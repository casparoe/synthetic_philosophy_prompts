  We are drafting a joint statement for two adversarial analysts: a neo-Malthusian and a cornucopian (Boserup-Simon tradition). The board wants a single document with four parts as described.

  Part I: Agreed Claims

  We begin with points of agreement, numbered for clarity.

  1. **Historical Record since Malthus**: 
     - Global population has multiplied many times over since Malthus's time (from about 1 billion in 1800 to over 8 billion today), and the real price of staple foods has generally fallen over the long term despite this growth.
     - The demographic transition (decline in birth rates following decline in death rates) has occurred in most regions, leading to slowing population growth in many parts of the world.
     - Agricultural growth has been driven by both extensification (expansion of cultivated area) and intensification (increased yield per unit area), with intensification playing a dominant role in the 20th century.

  2. **Formal Structure**:
     - Both sides accept that exponential growth (e.g., in population or resource demand) cannot continue indefinitely against any fixed linear ceiling (such as a finite resource base) without adjustment. This is a mathematical truth.

  3. **What Neither Side Claims**:
     - Neither side is committed to a specific year of global collapse or catastrophe. The neo-Malthusian does not predict an exact "doomsday," and the cornucopian does not deny that local or regional collapses (e.g., due to resource mismanagement) have occurred and are documented.
     - Both agree that the one-time subsidy from fossil energy (e.g., for mechanization), fossil groundwater (non-renewable aquifers), and synthetic nitrogen fertilizer (derived from fossil fuels) is distinct from a permanent technological capacity (e.g., knowledge-based innovations). The former represents a drawdown of finite stocks, while the latter represents a shift to renewable flows.

  4. **Bad Outcomes for the Trust**:
     - Both sides agree that a bad outcome for the trust would include:
       - Depletion of the water resource underlying the trust's land to the point where it becomes non-recoverable or uneconomical to use.
       - A sustained decline in the real value of the trust's assets (land and water) due to long-term agricultural productivity drops or regulatory changes.
       - Failure to maintain the real value of the endowment over the long term (to the 2080s and beyond).

  Part II: Disagreements Table

  We present key cruxes as a table. Each row has:
  - Sub-question
  - Neo-Malthusian position (in wording they'd sign)
  - Cornucopian position (in wording they'd sign)
  - Test or measurement both agree would bear on the crux
  - Each side's prediction (with numbers/dates where possible)

  | Sub-question | Neo-Malthusian Position | Cornucopian Position | Test/Measurement | Neo-Malthusian Prediction | Cornucopian Prediction |
  |--------------|--------------------------|------------------------|-------------------|----------------------------|-------------------------|
  | **1. Driver of the post-1800 escape from Malthusian constraints:** Was it primarily scarcity-induced innovation or depletion of a finite inheritance? | "The unprecedented growth since 1800 was enabled by a one-time drawdown of finite stocks: fossil fuels for energy, non-renewable aquifers for water, and phosphate rock for fertilizer. This inheritance is being depleted, and future scarcity will not be easily innovated away because it is fundamentally a loss of stock, not a price signal." | "The growth since 1800 was driven by human ingenuity responding to price signals and population pressure. Innovation in technology and institutions (e.g., synthetic fertilizers, irrigation techniques, high-yield varieties) was induced by scarcity and has created new, sustainable pathways. Depletion is a temporary bottleneck that spurs substitution and efficiency." | Global trend in Total Factor Productivity (TFP) growth in agriculture; rate of depletion of key non-renewable resources (e.g., fossil groundwater, phosphorus) vs. rate of substitution/renewable adoption; real price trends of key inputs (energy, fertilizer) and outputs (food). | TFP growth will decelerate (to below 1% per year by 2040) as depletion intensifies; real input prices will rise (e.g., energy +2%/year, fertilizer +1.5%/year) from 2030–2080; real food prices will rise (staple grains +0.5%/year real) from 2030–2080. | TFP growth will be sustained (at least 1.2% per year through 2080) due to innovation; real input prices will fluctuate but trend flat or down (e.g., energy -0.5%/year, fertilizer -0.3%/year) due to efficiency/substitution; real food prices will continue long-term decline (-0.3%/year real). |
  | **2. Nature of carrying capacity:** Does it have a physical floor independent of price, or is it purely a function of current technology and economics? | "Carrying capacity has a biophysical floor determined by solar energy, water cycles, and nutrient availability. Technology can push closer to this ceiling but cannot eliminate it. Price signals alone cannot create water or nutrients where they are physically absent." | "Carrying capacity is elastic and determined by the prevailing technology set and economic conditions. There is no fixed floor; human ingenuity redefines limits through substitution (e.g., desalination for water, nitrogen fixation for fertilizer). What appears as a physical limit is often an economic one." | Proportion of global cropland under renewable water stress (defined as withdrawals exceeding 75% of renewable flow); global average cereal yields under rainfed vs. irrigated conditions; rate of adoption of renewable-input agriculture (e.g., solar-powered desalination, precision fertigation). | By 2080, >40% of humanity will face severe renewable-water stress (withdrawals >90% of renewable flows in their region); cereal yield growth will slow to 0.5%/year globally by 2050. | By 2080, <25% of humanity will face severe renewable-water stress due to efficiency gains and new sources; cereal yield growth will be maintained at 1.0%/year globally through 2080. |
  | **3. Stability of the demographic transition:** Is it a stable feature of wealthy societies, or could it reverse under future scarcity? | "The demographic transition is contingent on sustained abundance. If resource scarcity intensifies, fertility rates could rise in response to increased child labor value or fall due to malnutrition, destabilizing societies and reversing progress." | "The demographic transition is a robust feature of development driven by education, women's empowerment, and urbanization. Once completed, it is irreversible even if temporary scarcity occurs; fertility decisions are based on cultural and economic factors, not short-term food prices." | Fertility rates in the poorest countries (e.g., Sahel, Central Africa) over the next 30 years; correlation between local food price spikes and fertility rates; completion of transition in the last 10 high-fertility countries. | In at least 5 of the 10 poorest countries, fertility rates will remain above 4.0 by 2050, and a food price shock (e.g., +30% real over 5 years) will cause a rise in fertility (e.g., +0.3 births/woman) due to increased reliance on child labor. | All 10 poorest countries will complete the demographic transition (fertility below 2.5) by 2050, and short-term food price spikes will have no measurable effect on long-term fertility trends. |
  | **4. Interpretation of recent warning signs:** Are aquifer depletion, yield deceleration, etc., binding constraints or solvable bottlenecks? | "Recent trends (e.g., depletion of major aquifers like the Ogallala, deceleration in cereal yield growth from 3% to 1% since the 1990s, volatile fertilizer prices post-2021) are symptoms of binding biophysical constraints. These are not temporary but signal diminishing returns to intensification." | "Recent trends are localized bottlenecks that have recurred throughout history (e.g., guano depletion in the 19th century) and were overcome by innovation. Yield deceleration is a natural plateauing effect after rapid gains; new technologies (e.g., gene editing, AI-driven precision ag) will restore growth." | Global cereal yield growth rate over 2025–2045; recovery rate of the Ogallala aquifer under current management; volatility index of fertilizer prices (5-year rolling stdev) vs. long-term trend. | Global cereal yield growth will average ≤0.8%/year over 2025–2045; Ogallala water levels will decline by >30% from 2025–2050; fertilizer price volatility will increase (stdev +20% vs. 2000–2020). | Global cereal yield growth will average ≥1.2%/year over 2025–2045; Ogallala depletion will slow (decline <10% 2025–2050) due to efficiency; fertilizer price volatility will revert to historical norms (stdev ±5% of 2000–2020). |

  Part III: Separation of Genuine vs. Verbal Disagreements

  Some disagreements stem from differing definitions. We clarify:

  - **Carrying capacity**: The neo-Malthusian uses it to mean the maximum population supportable by a given resource base under current solar flux and biogeochemical cycles, which has a theoretical upper bound. The cornucopian uses it to mean the population supportable with current technology and economic organization, which is expandable. Once this distinction is made, the debate shifts to whether the theoretical bound is approachable or irrelevant.

  - **Scarcity/Constraint**: For the neo-Malthusian, scarcity is absolute when a resource is physically depleted (e.g., fossil water). For the cornucopian, scarcity is always relative and induces substitution. This is a genuine disagreement about the substitutability of natural capital.

  - **Sustainability**: The neo-Malthusian defines it as living within renewable flows without depleting stocks. The cornucopian defines it as maintaining or improving human welfare over time, which may involve temporary depletion if offset by future innovation. This difference underlies many disputes about whether current practices are sustainable.

  - **Overpopulation**: The neo-Malthusian sees it as exceeding the biophysical carrying capacity, leading to degradation. The cornucopian sees it as a mismatch between population and institutional/technological capacity, solvable without reducing numbers.

  After fixing terms, the core disagreements remain: e.g., whether the Earth's biogeochemical systems have hard limits that cannot be circumvented by technology, and whether innovation can indefinitely outpace depletion.

  Part IV: Scoring Predictions and Defection Conditions

  The trust proposes a scoring rule for long-run predictions: 
  - Full credit if prediction X occurs by year T.
  - Decaying credit thereafter: credit proportional to λ^Δt, where Δt is the lag (years late) and λ (0<λ<1) is a discount factor declared in advance.
  - Auxiliary hypotheses used to explain a miss must be pre-registered and have independent testable consequences.

  **Right-but-early problem**: For a prediction that is directionally correct but early, λ determines how patient the scorer is. 

  - The neo-Malthusian, predicting eventual scarcity, might set λ=0.95 (credit decays slowly; e.g., half-life of ~13 years). They argue that depletion is inevitable but timing is uncertain due to complex systems. 
  - The cornucopian, predicting timely innovation, might set λ=0.85 (faster decay; half-life ~4 years). They argue that if innovation doesn't arrive "on schedule," it wasn't induced properly, so a lag suggests the prediction was flawed.

  **Is right-but-early unfalsifiable?** Not if λ is fixed in advance and auxiliary hypotheses are constrained. But if λ can be chosen post-hoc, it becomes unfalsifiable. The rule requires λ declaration upfront.

  **Defection conditions** (when each side would concede):

  - Neo-Malthusian: If by 2080, global population has peaked (e.g., below 9.5 billion) *and* real food prices are at or below 2025 levels *and* agricultural TFP growth has averaged ≥1.5%/year from 2025–2080 without major input cost inflation, they would concede that scarcity was averted.
  - Cornucopian: If by 2060, global population is above 10 billion *and* real food prices have doubled (100% increase) from 2025 levels *and* TFP growth has averaged ≤0.5%/year for 2025–2060, they would concede that innovation failed to keep pace.

  **Do defection conditions intersect?** 
  - The conditions are mutually exclusive: the neo-Malthusian requires sustained abundance to 2080 to concede, while the cornucopian requires sustained scarcity by 2060. There is overlap only in intermediate outcomes (e.g., mixed signals). Neither side would concede based on the other's deadline.

  **Board Implications**

  The joint statement licenses the board to:

  - Act under unresolved uncertainty. Neither scenario is certain; thus, the trust should hedge.
  - Spend capital now on storage and efficiency: This is robust to both scenarios. Even if innovation solves scarcity, efficiency investments pay off in lower costs. If scarcity bites, they protect the asset.
  - Do not assume scarcity will be solved: The cornucopian view does not guarantee local solutions for this specific land/water system.
  - Decision: Adopt a resilient strategy that:
    - Invests in water-efficient irrigation (e.g., drip systems) and soil health to reduce dependency on volatile inputs.
    - Diversify crops toward higher-value, less water-intensive options where feasible.
    - Monitor key indicators (e.g., local water tables, input prices, TFP) and adjust based on pre-agreed triggers (e.g., if water levels drop >10% in a decade, accelerate efficiency investments).
    - Set aside a portion of endowment income for R&D in sustainable ag (aligns with both views: precaution for Malthusian, innovation bet for cornucopian).

  The board should require annual reviews against the cruxes in Part II to inform strategy updates.

  ---
  **Placeholders**: 
  - In the table, dates (e.g., 2050, 2060, 2080) and thresholds (e.g., 40% water stress, 1.2% yield growth) are illustrative. The analysts must negotiate these.
  - λ values (0.95, 0.85) are examples; each camp should declare their own.

  Steelmanning: Both positions are represented faithfully, using their own logic and without caricature.
answer: |-
  ### Joint Statement on Long-Term Agricultural Sustainability and Resource Management  
  **Prepared for the Board of the [Trust Name]**  
  By Dr. [Neo-Malthusian Analyst] and Dr. [Cornucopian Analyst]  
  As Adversarial Collaborators  

  ---

  ### Part I: Agreed Claims  
  Both parties affirm the following numbered statements as foundational common ground:  

  1. **Historical Record since Malthus (1798):**  
     - Global population has grown approximately 8-fold since 1800, while the real price of staple foods (e.g., wheat, rice, maize) has trended downward over the same period.  
     - The demographic transition—where falling mortality rates precede falling fertility rates, leading to stabilized populations—has occurred in all developed nations and is underway in most developing ones.  
     - Agricultural output growth since 1800 relied significantly on *intensification* (higher yields per unit area) rather than solely *extensification* (new land cultivation).  

  2. **Formal Structural Agreement:**  
     - Compound growth (e.g., in population, resource demand) cannot persist indefinitely against any fixed linear ceiling (e.g., finite arable land, solar energy flux). Adjustments—whether through innovation or collapse—are inevitable.  

  3. **What Neither Side Asserts:**  
     - Neither predicts a specific year of global societal collapse. The neo-Malthusian does not claim collapse is immediate or universal; the cornucopian does not deny that local/regional collapses (e.g., Easter Island, modern Syria) have occurred.  
     - Both agree that fossil resource inputs (energy, groundwater, synthetic nitrogen) represent a one-time subsidy distinct from permanent technological capacities (e.g., knowledge, institutions). Using this subsidy does not inherently prove long-run sustainability.  
     - Neither denies that innovation has historically alleviated scarcity, nor that depletion has caused local crises.  

  4. **Bad Outcomes for the Trust:**  
     - Depletion of the trust’s groundwater resources to unrecoverable levels.  
     - A sustained decline in the real economic value of the trust’s farmland or water rights by 2080.  
     - Regulatory or social license revocations due to unsustainable practices (e.g., aquifer exhaustion, ecosystem damage).  

  ---

  ### Part II: Disagreements Table  
  Key unresolved cruxes, with positions, tests, and predictions. Predictions include *placeholders* (marked with brackets) to be negotiated by the analysts.  

  | Sub-Question                                                                 | Neo-Malthusian Position (Signed Wording)                                                                                                                                 | Cornucopian Position (Signed Wording)                                                                                                                               | Test/Measurement                                                                                                 | Neo-Malthusian Prediction                                                                                                 | Cornucopian Prediction                                                                                                |
  |------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|
  | **1. Driver of post-1800 growth:** Was it scarcity-induced innovation or depletion of finite stocks? | "The post-1800 escape relied on depleting finite stocks (fossil energy, non-renewable aquifers, concentrated minerals). This inheritance is irreplaceable; future scarcity will not be fully solvable by innovation alone." | "Growth was driven by innovation induced by population pressure and prices. Depletion is a temporary bottleneck; human ingenuity substitutes for depleted resources (e.g., solar for coal, recycling for phosphorus)." | Global agricultural TFP growth rate; fossil water depletion rate vs. renewable adoption; real energy/fertilizer prices. | TFP growth falls below 0.8%/yr by [2040]; non-renewable water use remains >30% of irrigation through [2050]; real fertilizer prices rise 1.5%/yr post-[2030]. | TFP growth sustains ≥1.2%/yr through [2080]; non-renewable water use falls to <10% by [2050]; real fertilizer prices decline 0.5%/yr post-[2030]. |
  | **2. Carrying capacity:** Is there a physical floor, or is it purely a function of technology? | "Carrying capacity has a hard biophysical floor (e.g., solar energy constraints, hydrological cycles). Technology can approach but not eliminate this ceiling; prices cannot create resources absent from Earth’s systems." | "Carrying capacity is elastic and technology-determined. There is no fixed floor; innovation redefines limits (e.g., desalination for water, microbial nitrogen fixation for soil)." | % of global population facing renewable-water stress (withdrawals >75% of recharge); cereal yield growth in rainfed vs. tech-enhanced systems. | By [2080], >45% of humanity faces severe water stress; global cereal yield growth decelerates to ≤0.6%/yr by [2050]. | By [2080], <20% face severe water stress; cereal yield growth sustains ≥1.0%/yr through [2080]. |
  | **3. Demographic transition:** Is it stable or reversible under scarcity? | "The transition is fragile and reversible under scarcity. Rising food prices may increase fertility (child labor value) or collapse social stability, halting declines in poor nations." | "The transition is robust and irreversible. Fertility decline is locked in by urbanization, education, and female autonomy; short-term scarcity does not reverse it." | Fertility rates in high-poverty nations (e.g., Sahel, Haiti) during food-price spikes; completion of transition in last 10 high-fertility countries. | Fertility in ≥5 of 10 poorest nations remains ≥4.5 by [2050]; a 30% real food-price spike causes a 0.4 rise in fertility within 5 years. | All 10 poorest nations achieve fertility ≤2.5 by [2050]; food-price spikes cause ≤0.1 fertility change. |
  | **4. Recent warning signs:** Binding constraints or solvable bottlenecks? | "Aquifer depletion (e.g., Ogallala), slowing yields, and volatile inputs signal systemic biophysical limits. These are not analogous to past solved bottlenecks (e.g., 19th-century guano scarcity)." | "These are temporary bottlenecks like countless others overcome by innovation (e.g., gene editing, AI-driven efficiency). Volatility reflects transient shocks, not structural limits." | Global cereal yield growth ([2025–2045]); Ogallala aquifer decline rate; fertilizer price volatility (5-yr std. dev.). | Cereal yield growth averages ≤0.7%/yr ([2025–2045]); Ogallala declines >40% by [2050]; fertilizer volatility doubles vs. 2000–2020 average. | Cereal yield growth averages ≥1.3%/yr ([2025–2045]); Ogallala decline slows to <15% by [2050]; volatility reverts to ≤2000–2020 levels. |
  | **5. Global population peak:** When and at what level? | "Population peaks late ([2080]) and high (>10B) due to delayed transitions, causing overshoot and collapse pressures." | "Population peaks early ([2060]) and lower (<9.5B) as transitions accelerate, avoiding significant overshoot." | UN population data; fertility convergence in low-income Africa/South Asia. | Peak: [10.8B] by [2080]. | Peak: [9.2B] by [2060]. |
  | **6. Real food prices in 2080:** Relative to today’s basket. | "Scarcity and input costs drive long-term price rises despite efficiency gains." | "Innovation and efficiency sustain long-term price declines despite population growth." | FAO real price index for staples (wheat, rice, maize). | +30–50% by [2080] (e.g., index at 130–150 vs. 100 today). | -20–40% by [2080] (e.g., index at 60–80 vs. 100 today). |

  ---

  ### Part III: Genuine vs. Verbal Disagreements  
  The following terms obscure substantive disputes; clarifying them dissolves *some* friction but leaves core disagreements intact:  

  - **Carrying Capacity**:  
    - Neo-Malthusian: "Maximum population supportable under Earth’s biogeochemical flows (e.g., solar energy, water cycles)."  
    - Cornucopian: "Maximum population enabled by prevailing technology and institutions."  
    - *Resolution*: Agree this is a physical vs. techno-economic distinction. Genuine disagreement remains: *Can technology decouple human systems from biogeochemical limits?*  

  - **Scarcity**:  
    - Neo-Malthusian: "Absolute shortfalls when stocks (e.g., aquifers) are exhausted."  
    - Cornucopian: "Relative imbalance solvable by substitution or efficiency."  
    - *Resolution*: Agree scarcity can be stock- or flow-based. Genuine disagreement: *Are critical stocks (e.g., phosphorus, groundwater) substitutable?*  

  - **Sustainability**:  
    - Neo-Malthusian: "Using resources ≤ renewable flow rates."  
    - Cornucopian: "Maintaining human welfare across generations."  
    - *Resolution*: Agree on core goal (welfare). Genuine disagreement: *Can welfare grow indefinitely without drawdown?*  

  - **Overpopulation**:  
    - Neo-Malthusian: "Exceeding biophysical capacity, causing degradation."  
    - Cornucopian: "Exceeding institutional capacity, causing poverty."  
    - *Resolution*: This is a proxy for *Are human crises caused by physical limits or institutional failures?*  

  **Outcome**: Verbal fixes resolve ~25% of perceived conflict. Core disagreements (e.g., substitutability of natural capital, permanence of innovation) remain empirical and irreducible to semantics.  

  ---

  ### Part IV: Scoring Predictions and Defection Conditions  
  **Scoring Rule**: Predictions of event *X* by year *T* receive:  
  - Full credit if *X* occurs by *T*.  
  - Decaying credit if late: Credit = λ<sup>Δt</sup>, where *Δt* = years late, and λ ∈ (0,1) is declared ex ante.  
  - Auxiliary hypotheses (to explain misses) must be pre-registered with independent testable consequences.  

  #### Right-but-Early Analysis:  
  - **Neo-Malthusian Stance**: Predicts eventual scarcity but with uncertain timing (complex systems, lagged effects). To avoid unfalsifiability:  
    - Declares **λ = 0.95** (slow decay; half-credit at ~14 years late).  
    - *Rationale*: Scarcity is "sticky" and inevitable; delays reflect temporary buffers (e.g., grain reserves), not falsity.  
  - **Cornucopian Stance**: Predicts timely innovation induced by prices. To avoid unfalsifiability:  
    - Declares **λ = 0.80** (faster decay; half-credit at ~3 years late).  
    - *Rationale*: If innovation is delayed, it suggests misjudged incentives, not "patience."  

  **Is Right-but-Early Unfalsifiable?**  
  - No, *if* λ is fixed ex ante and auxiliary hypotheses are constrained. However, λ choice is strategic:  
    - A λ near 1.0 (e.g., 0.95) risks unfalsifiability by allowing infinite patience.  
    - Both camps accept that λ must be justified by their theory’s logic (e.g., Malthusians cite system inertia; cornucopians cite market responsiveness).  

  #### Defection Conditions (When Each Camp Concedes):  
  | Camp             | Defection Condition                                                                                                |  
  |------------------|--------------------------------------------------------------------------------------------------------------------|  
  | **Neo-Malthusian** | If by [2080]: (1) Global population ≤ [9.5B], (2) Real staple prices ≤ today’s level, *and* (3) Agricultural TFP growth ≥ [1.4%]/yr sustained from [2030–2080]. |  
  | **Cornucopian**   | If by [2060]: (1) Global population ≥ [10.5B], (2) Real staple prices ≥ +100% vs. today, *and* (3) Agricultural TFP growth ≤ [0.6%]/yr sustained from [2030–2060]. |  

  **Do Defection Conditions Intersect?**  
  - No. The neo-Malthusian requires *sustained abundance to 2080* to concede; the cornucopian requires *acute scarcity by 2060*. They bound a middle ground (e.g., slow price rises, partial innovation) where neither concedes.  

  ---

  ### Conclusion: Implications for the Trust  
  The joint statement **does not resolve key uncertainties** but clarifies where both analysts agree and where predictions diverge. This licenses the board to:  

  1. **Act Under Unresolved Uncertainty**:  
     - Neither view justifies complacency (cornucopian) or doomism (Malthusian). Prudent management requires hedging.  

  2. **Invest in Robust, No-Regret Measures**:  
     - **Storage and Efficiency**: Both camps support investments reducing water/energy waste (e.g., drip irrigation, soil health). These pay off in both scenarios: they extend resource life (Malthusian) or boost profitability (cornucopian).  
     - **Diversification**: Shift toward drought-resilient crops and renewable-energy integration (e.g., solar pumps). This hedges against input volatility.  

  3. **Avoid Bets on Absolute Scarcity or Abundance**:  
     - Do not assume scarcity will be "solved" (e.g., by future tech) or that it is inevitable. The trust’s local context (e.g., aquifer health) may diverge from global trends.  

  4. **Decision Framework**:  
     - **Adopt Adaptive Management**:  
       - Monitor key variables from the disagreements table (e.g., local water levels, TFP growth).  
       - Set triggers (e.g., if water table drops >[10%] in 5 years, accelerate efficiency spending).  
     - **Allocate Capital Rationally**:  
       - Spend [5–10%] of endowment income annually on efficiency/storage.  
       - Reserve [2–5%] for R&D in sustainable tech (e.g., water recycling), as both camps endorse innovation under pressure.  
     - **Prioritize Resilience**: Ensure the trust’s operations remain viable under *both* futures (e.g., high prices or volatility).  

  This joint statement affirms that the trust’s strategy must be **evidence-adaptive**, **locally grounded**, and **agnostic to grand historical narratives**. We commit to biennial reviews of this document against emerging data.  

  ---  
  **Signed**,  
  [Dr. Neo-Malthusian Analyst]  
  [Dr. Cornucopian Analyst]  
