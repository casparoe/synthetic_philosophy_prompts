          - Affine transformations: `u1' = a1*u1 + b1` (with `a1>0`). Then the disagreement point becomes `d1' = a1*d1 + b1`.
          - The ideal point in the new coordinates: `m1' = max { a1*u1 + b1 : ... } = a1 * m1 + b1`.
          - The gain for player 1: `u1' - d1' = a1*(u1 - d1)`.
          - The maximum gain: `m1' - d1' = a1*(m1 - d1)`.
          - So the ratio `(u1' - d1')/(m1' - d1') = (a1*(u1-d1))/(a1*(m1-d1)) = (u1-d1)/(m1-d1)`.
          - Therefore, the ratio is invariant to affine transformations? Actually, yes. Then why is it said that KSS is not invariant? The catch is that the entire solution concept is defined relative to the ideal point, which is also transformed. So the equation for KSS becomes:
              (u1' - d1')/(m1' - d1') = (u2' - d2')/(m2' - d2')
          which is the same as the original condition. Therefore, the KSS solution is also invariant to independent affine transformations of each player's utility? Actually, yes. The literature often states that both solutions are invariant to positive affine transformations. So your understanding of the invariance of KSS is correct.

       However, note: the above reasoning holds for the ideal point being defined in the same transformed set. So both solutions are invariant to independent affine transformations. This is a key point because it means that both solutions are independent of the choice of units (as long as we adjust the disagreement and the ideal point accordingly). So in practice, both are safe from unit arguments.

  - **Independence of Irrelevant Alternatives (IIA)**:
     - This axiom states that if you have two feasible sets `S` and `T` such that `S ⊆ T`, and the solution for `T` is in `S`, then the solution for `S` should be the same as for `T`. In other words, removing alternatives that are not chosen should not change the outcome.
     - **Nash satisfies IIA.** This is why if you remove some points that are not the Nash solution, the solution remains the same.
     - **Kalai-Smorodinsky does not satisfy IIA.** Why? Because the ideal point (m1, m2) might change when you remove alternatives. For example, if you remove an alternative that gave one player a very high utility (even if it wasn't chosen), then that player's maximum possible gain `m_i` might drop, and then the KSS solution might change even if the original solution is still in the set.
     - **Engineering interpretation:** This is the heart of the debate. In your context, if you have a set of discrete allocations and you remove some allocations that are not chosen, then:
          - Under Nash, the solution remains the same (if the solution is still in the set).
          - Under KSS, the solution might change because the removal of an allocation might reduce the maximum utility one player can achieve (even if that allocation was not chosen). So the removal of an irrelevant alternative (one that wasn't going to be chosen) can change the KSS solution.

       This is the key difference: KSS depends on the entire set of alternatives (via the ideal point) while Nash only depends on the disagreement point and the chosen point.

  - **Monotonicity**:
     - This is the property that if the set of feasible outcomes expands (in a way that is favorable to one player), then that player should not end up worse off.
     - Kalai-Smorodinsky satisfies a strong form of monotonicity: if the feasible set expands in such a way that the ideal point for one player increases (without decreasing the other's) then that player's utility in the solution should not decrease. Nash does not satisfy this. 
