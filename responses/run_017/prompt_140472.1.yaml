prompt: |-
  I am writing a position paper for a graduate seminar on the foundations of quantum mechanics, and before I commit to it in print I would like the package audited for consistency. Each of the theses below is one I have seen defended by people who know the literature, and each looks acceptable in isolation; what I cannot tell is whether they can be held together. The set is:

  (a) Locality, in the only sense I think worth caring about, is the absence of superluminal causal influence: what happens at a spacetime point is not causally influenced by goings-on at spacelike separation from it. Call this causal locality, and treat it as a substantive constraint rather than a verbal stipulation.

  (b) Bell's theorem is best read as a trilemma. Take λ to be a complete specification of the relevant state of the common past of the two wings, and assume measurement independence: λ is probabilistically independent of the settings the experimenters choose. The Bell inequalities then follow from two further conditions taken jointly: parameter independence, whereby the probability of the outcome on one wing, conditional on λ and on both settings, does not depend on the setting chosen on the far wing; and outcome independence, whereby the probability of the outcome on one wing, conditional on λ, on both settings, and on the far outcome, does not depend on that far outcome. The experiments tell us the inequalities fail, so at least one of the three assumptions is false.

  (c) The lesson of the violation is that the world is non-local in a robust sense: there is a real dependence between what happens at the two wings that no finer specification of the common past will screen off, and this is a discovery about the causal structure of the world rather than a remark about our descriptions of it.

  (d) The quantum state is not a physical object. It is best read nomologically, as encoding a law, or epistemically, as a summary of what an agent should expect. In particular I do not want to be committed to a field or a substance living on a high-dimensional configuration space.

  (e) The violation is explained by the non-separability, or holism, of the quantum state: the components of an entangled pair do not have states of their own, the state of the composite is what does the explanatory work, and that is why the correlations are what they are.

  (f) No superluminal signalling is possible: the outcome statistics observable on either wing are independent of which measurement is performed on the other. This is a theorem of the quantum formalism and, I think, a constraint any successor to it should be made to respect.

  (g) Superdeterminism, the denial of measurement independence, is not a serious research programme. My reason is not that it is logically excluded but that it is methodologically corrosive: if the hidden variables that help determine outcomes are systematically correlated with the settings an experimenter selects, then randomised controlled comparison is undermined in general, and with it a large part of experimental science.

  (h) A methodological coda, and the item I am least confident about. I would like to formalise the independence assumptions as an ordered hierarchy rather than a flat list. The thought is that measurement independence is more basic than outcome independence, because the former is presupposed by the reliability of the very statistical inferences we use to read these experiments, whereas the latter is not: so when the theorem forces us to drop one, dropping outcome independence should be the default and dropping measurement independence a last resort. If this ordering can be made out, it would also underwrite (g).

  What I want is an audit, not a survey or a tutorial. Go through the package and tell me which pairs are in genuine tension and how severe each tension is, ranked rather than listed flatly; for each real tension, say precisely what would have to be revised or abandoned and what that revision would cost me elsewhere in the set; and say explicitly which pairs only look like tensions and why they dissolve. Two constraints. First, do not ask me which commitment I would least like to give up and then treat my answer as fixed: I am genuinely unsure, and part of what I want from you is a ranking of how load-bearing each item is. Second, my own suspicion is that the strain lies between (c) and (f); test that suspicion rather than take it from me. Finally, if there is a single revision that would clean up more than one of the tensions at once, tell me what it is and what else it would commit me to.
reasoning: |-
  We are given a set of theses (a) through (h) that the author wishes to hold simultaneously. The task is to audit for internal consistency, identify tensions (ranked by severity), explain what revisions might resolve them and at what cost, and note apparent tensions that are not real. The author suspects tension between (c) and (f) and wants that tested.

  Let me restate the theses briefly:

  (a) Causal locality: no superluminal causal influence (substantive constraint).

  (b) Bell's theorem as a trilemma: violation of Bell inequalities implies that at least one of measurement independence, parameter independence, or outcome independence fails.

  (c) The violation of Bell inequalities reveals a robust non-locality: a real dependence between spacelike separated events that cannot be screened off, and this is a fact about the causal structure.

  (d) The quantum state is not physical (nomological or epistemic).

  (e) The violation is explained by the non-separability (holism) of the quantum state.

  (f) No superluminal signalling is possible (a theorem in QM and a constraint for any successor).

  (g) Superdeterminism (denial of measurement independence) is methodologically unacceptable.

  (h) Methodological coda: independence assumptions form a hierarchy, with measurement independence more basic than outcome independence, so dropping outcome independence is the default.

  Now, let's analyze for tensions.

  1. **Tension between (c) and (f):**
     - (c) says there is a robust non-locality (real dependence) between spacelike separated events.
     - (f) says no superluminal signalling is possible, meaning the outcome statistics on one wing do not depend on the setting on the other wing (so we cannot use the correlation to send a signal).
     - The tension: If there is a real dependence (non-locality) as in (c), why can't we use it to signal? The existence of a dependence might seem to open the door to signalling, but (f) says we cannot signal.

     However, note that the non-locality in (c) is described as a dependence that cannot be screened off by any finer specification of the common past. But in quantum mechanics, this non-locality is exactly of the kind that does not allow signalling because of the particular way the probabilities factor. Specifically, the marginal probabilities on one side do not depend on the setting on the other (due to parameter independence holding in standard QM). So the tension might be only apparent.

     In fact, in the context of Bell, the violation of the inequalities is due to the failure of outcome independence (in the quantum case) while parameter independence holds. This is why we get non-locality without signalling: the setting on one side does not affect the outcome statistics on the other (parameter independence), but the outcomes are correlated in a way that depends on both settings (and the state) and this correlation cannot be explained by the common cause. 

     Therefore, (c) and (f) are compatible: the non-locality is a correlation that cannot be explained locally, but it does not allow signalling because the marginal probabilities are independent of the distant setting. So the tension is only apparent and dissolves.

  2. **Tension between (c) and (d):**
     - (c) claims that the non-locality is a robust feature of the world, about causal structure.
     - (d) says the quantum state is not physical (nomological or epistemic). 
     - (e) then says the non-locality is explained by the non-separability of the quantum state.

     If the quantum state is not physical (as per (d)) but merely nomological (a law) or epistemic (knowledge), then how can its non-separability (a feature of the state) explain a real, physical non-locality in the world? 

     This is a potential tension. The non-locality in (c) is presented as a feature of the causal structure of the world, but if the quantum state (which is the bearer of non-separability in (e)) is not physical, then it seems we are explaining a physical non-locality by appeal to a non-physical entity. 

     To resolve, we must either:
     - Reject (d) and take the quantum state to be physical (but the author does not want that), or 
     - Reinterpret (c) so that the non-locality is not a feature of the physical world but of the law or of our knowledge. But (c) explicitly says it is a discovery about the causal structure of the world, not a remark about descriptions.

     This tension is severe. If the quantum state is merely a representation of our knowledge (epistemic view) then the non-locality might be interpreted as a feature of our knowledge, not the world. But (c) insists on a robust, causal non-locality. Similarly, if the state is nomological, then the non-separability is a feature of the law, but the law might be seen as governing local processes (as in Bohmian mechanics, which is non-local but has a physical ontology). However, without a physical ontology for the state, it is unclear how the non-separability of a law (or an epistemic state) can cause or explain physical non-locality.

     Revision: The author might have to abandon the robust realism about non-locality in (c) and reinterpret it in a more epistemic or nomological way. But that would undermine the strength of (c). Alternatively, abandon (d) and accept the quantum state as physical. The cost of abandoning (d) is that the author would then have to accept a high-dimensional configuration space or some other physical basis for the state, which they explicitly reject.

     Alternatively, one might try to argue that even if the quantum state is nomological, the law itself is non-separable and that non-separability is a real feature of the world. But then we are back to the question: what does it mean for a law to be non-separable? And how does that cause non-local correlations? This is a challenge for ontic structural realists, but it might be a viable path.

     However, note that (e) says the non-separability of the quantum state explains the violation. If the state is nomological, then the explanation is that the law is non-separable, and that is why the correlations are non-local. This might be acceptable if we take laws as real and having structure. But then the causal structure (c) would be grounded in the structure of the law. This might be a way to hold (c), (d), and (e) together, but it requires a specific view of laws and causation.

     The cost: It might force a particular metaphysics of laws and causation. Also, note that (c) says "a discovery about the causal structure of the world", which might be preserved if the law is part of the world. But it is a departure from a naive realism about physical objects and events.

     This tension is severe and requires careful metaphysical work.

  3. **Tension between (b) and (g) with (h):**
     - (b) presents the trilemma: violation of Bell inequalities implies failure of at least one of measurement independence, parameter independence, or outcome independence.
     - (g) rejects superdeterminism (denial of measurement independence) as methodologically corrosive.
     - (h) suggests a hierarchy: measurement independence is more basic, so we should drop outcome independence first.

     The trilemma (b) says we must drop one of the three. (g) and (h) together say we should not drop measurement independence (because of methodological reasons) and by the hierarchy we should drop outcome independence. This is consistent with what happens in quantum mechanics: outcome independence fails, but parameter independence holds (and measurement independence holds). 

     However, note that in (b) the trilemma does not specify which one we drop, but (g) and (h) together tell us which one to drop. So there is no inconsistency here. In fact, (h) provides a justification for why we drop outcome independence and not the others.

     But note: (h) is a methodological coda and the author is least confident about it. Without (h), we might still have (g) as a reason to avoid superdeterminism, but then we are left with having to drop either parameter independence or outcome independence. The author, by (c), is committed to non-locality, which is often associated with the failure of outcome independence. But what if we dropped parameter independence? That would allow for superluminal signalling (because if the probability on one side depends on the setting on the other, then by changing the setting on the other side, one might change the outcome statistics on the first and thus signal). But (f) says no superluminal signalling is possible. Therefore, dropping parameter independence would violate (f). Therefore, we must drop outcome independence to respect (f). 

     So even without (h), (f) forces us to drop outcome independence and not parameter independence. And (g) forces us to keep measurement independence. Therefore, the trilemma is resolved by dropping outcome independence. 

     Therefore, (b), (g), and (f) together lead to the failure of outcome independence. (h) is then a methodological reinforcement of that choice, but even without (h) the choice is forced by (f) and (g). So no tension.

  4. **Tension between (a) and (c):**
     - (a) defines causal locality as the absence of superluminal causal influence.
     - (c) says there is a robust non-locality: a real dependence between spacelike separated events.

     This might seem like a direct contradiction. However, note that the non-locality in (c) is described as a dependence that cannot be screened off by the common past. But is this dependence causal? 

     The author in (a) defines causal locality as the absence of superluminal causal influence. So if the non-locality in (c) is not causal, then there is no tension. But (c) says it is a discovery about the causal structure of the world. This suggests that the non-locality is causal. 

     However, one might argue that the dependence is not causal but rather a form of non-causal correlation (like in a common cause, but here the common cause fails to screen off). But (c) explicitly says that no finer specification of the common past will screen off, so it is not a common cause. And it says it is about causal structure. 

     The tension: (c) implies a violation of (a) if the dependence is causal. But (a) is defined as a constraint that the author cares about.

     How can we resolve? 

     We might reinterpret (c) to say that the non-locality is not a causal influence but a non-causal correlation. But then why call it a discovery about causal structure? 

     Alternatively, we might question whether the non-locality in Bell's theorem is indeed causal. There is a debate in the literature about whether Bell non-locality implies causal non-locality. Some (like Huw Price) argue that it does not, because the correlations are time-symmetric and do not exhibit a clear causal direction. Others (like Tim Maudlin) argue that it does. 

     The author's (c) sides with the causal interpretation.

     This tension is severe. If we hold (a) as a constraint, then we must deny that the non-locality is causal. But (c) says it is about causal structure. 

     Revision: One option is to abandon (c) and interpret the non-locality as non-causal. But then the strength of (c) is lost. Alternatively, abandon (a) and accept that there is superluminal causal influence. But that contradicts the author's statement that causal locality (so defined) is the only sense worth caring about.

     Another possibility: adopt a causal interpretation but argue that the causal influence is not superluminal because it is not propagating in spacetime? For example, in a retrocausal model, the influence might be along a zigzag causal path that is not spacelike. But then we are not violating (a) because (a) forbids superluminal influence, but retrocausal models might have influences that are not superluminal but travel backwards in time. However, that would require dropping the assumption that the causal past is only the past light cone, which is typically assumed. 

     Alternatively, in the many-worlds interpretation (which the author does not mention) there is no non-locality because the outcomes are determined by the local branch of the wave function. But then (c) would be false.

     This tension is very severe and might be the core issue.

  5. **Tension between (d) and (e):**
     - (d) says the quantum state is not physical (nomological or epistemic).
     - (e) says the non-separability of the quantum state explains the violation.

     If the quantum state is not physical, then how can it explain physical phenomena? This is similar to the tension between (d) and (c). But note that (e) is about explanation. We can have explanations that appeal to laws or to knowledge. For example, a law can explain regularities. So if the quantum state is nomological, then it can explain the correlations as a consequence of the law. Similarly, if it is epistemic, then the explanation is that given our knowledge (the state), we expect these correlations. However, (c) requires that the non-locality is a real feature of the world, not just our knowledge. So an epistemic view might conflict with (c) but not necessarily with (e) because (e) might be about how we explain the correlations from our perspective.

     However, the author wants the explanation in (e) to be about the world: the non-separability of the state is why the correlations are what they are. So if the state is epistemic, then the non-separability is in our knowledge, but the real world might be separable. This would conflict with (c) which says the non-locality is real.

     Therefore, the tension between (d) and (e) is derivative of the tension between (d) and (c). If we can resolve (d) and (c), then (e) might follow.

  6. **Tension between (a) and (f):**
     - (a) requires no superluminal causal influence.
     - (f) says no superluminal signalling is possible.

     These are compatible because (f) is a weaker condition: no signalling implies no causal influence that can be used to send a signal, but there might be causal influences that are too weak or too noisy to allow signalling. However, in the context of quantum mechanics, the non-locality does not allow signalling because the marginal probabilities are independent of the distant setting. So we can have non-locality (violation of outcome independence) without superluminal signalling. Therefore, (a) and (f) can hold together: we might have non-causal correlations (so (a) holds) or we might have causal influences that cannot be used for signalling (which would violate (a) if they are superluminal). But note (a) forbids any superluminal causal influence, whether it can be used for signalling or not. So if there is a superluminal causal influence, (a) is violated even if it doesn't allow signalling.

     However, (f) is consistent with (a) if there is no superluminal causal influence. The tension would arise only if we have a superluminal causal influence that does not allow signalling. But (a) forbids that. So if we have such an influence, (a) is violated. But (f) does not require that there is no superluminal influence, only that we cannot signal. So (a) and (f) are independent: (a) is stronger than (f). We can have (f) without (a) (if there is superluminal influence that cannot be controlled for signalling) and (a) without (f) (if there is no superluminal influence at all, then no signalling) but that would be trivial.

     In our context, the author wants both. (c) suggests there is a non-locality that is robust and about causal structure, which might imply a superluminal causal influence. But then (a) is violated. So the real tension is between (a) and (c) as above.

     (f) is compatible with both: if we have no superluminal causal influence (so (a) holds) then (f) holds trivially. If we have a superluminal causal influence that cannot be used for signalling (so (a) is violated) then (f) holds. But (a) would be false.

     Therefore, the tension between (a) and (c) is the key.

  **Summary of Tensions (ranked by severity):**

  1. **Tension between (a) and (c):** 
     - Severity: High.
     - Issue: (a) requires no superluminal causal influence, while (c) asserts a robust non-locality that is about the causal structure of the world, implying a violation of (a).
     - Resolution options: 
       - Reinterpret (c) to mean that the non-locality is not causal (but then it's unclear what "causal structure" refers to). 
       - Abandon (a) and accept that there is superluminal causal influence (but the author says (a) is the only sense of locality worth caring about). 
       - Adopt a retrocausal model where the influence is not superluminal (but travels in a zigzag via the past) which might preserve a form of locality in spacetime. However, this would require revising the understanding of the causal past and might conflict with the standard reading of Bell.
     - Cost: If we reinterpret (c) non-causally, then we lose the robust realism about non-locality. If we abandon (a), then we have to accept superluminal causation. If we go retrocausal, then we might have to drop the assumption that the causal past is the past light cone (and perhaps modify the Bell setup).

  2. **Tension between (c) and (d):**
     - Severity: High.
     - Issue: (c) asserts a robust physical non-locality about the world, while (d) says the quantum state (which in (e) explains the non-locality) is not physical (nomological or epistemic). How can a non-physical state explain a physical non-locality?
     - Resolution options:
       - Reinterpret (c) in a less robustly realistic way (e.g., the non-locality is a feature of the law or of our knowledge, not the physical events). But this might weaken (c).
       - Reject (d) and take the quantum state as physical. But the author explicitly does not want that.
       - Argue that even if the state is nomological, the law is a real feature of the world and its non-separability grounds the non-locality. This requires a metaphysics of laws as real and non-separable.
     - Cost: The first option abandons the robust realism of (c). The second option forces a physical interpretation of the state. The third option requires a specific and perhaps controversial metaphysics.

  3. **Tension between (d) and (e):**
     - Severity: Moderate (but derivative of the above).
     - Issue: How can a non-physical state explain the violation? 
     - Resolution: As above, if the state is nomological, then it can explain as a law. But then we must also resolve the tension with (c). If the state is epistemic, then (e) might be an explanation about our expectations, but not about the world, which conflicts with (c). So the primary tension is with (c).

  **Apparent tensions that dissolve:**

  - **(c) and (f):** Dissolves because the non-locality (failure of outcome independence) does not imply signalling because parameter independence holds. The marginal probabilities are independent of the distant setting, so no signalling. The real dependence is in the joint outcomes, but that cannot be used to signal because we cannot control the outcomes.

  - **(b), (g), and (f) with (h):** No tension. (f) and (g) force the violation to be in outcome independence, and (h) provides a methodological hierarchy that reinforces that choice.

  **Single Revision that Resolves Multiple Tensions:**

  The author might consider adopting a view where the quantum state is nomological (law-like) and the non-locality is a consequence of that law. Then:

  - For (c): We reinterpret the non-locality as a feature of the law, which is part of the causal structure of the world (if we take laws as part of the world's structure). This would require a metaphysics of ontic structural realism or similar.
  - For (d): Holds because the state is nomological.
  - For (e): Holds because the non-separability of the law explains the correlations.

  But then we still have the tension with (a): if the law is non-local, does that imply superluminal causal influence? Not necessarily: the law might govern local processes in a way that produces non-local correlations without superluminal influence (as in Bohmian mechanics, which is explicitly non-local). But Bohmian mechanics does have a physical quantum state (the wave function) in configuration space. So if we take a nomological view without a physical wave function, we need an alternative.

  Alternatively, the author might consider a retrocausal approach. This could resolve:

  - (a): We avoid superluminal influence by having influences that go backwards in time and then forwards, so they are not spacelike. Then (a) might be preserved if we redefine the causal past appropriately.
  - (c): The non-locality is explained by retrocausality, which is a feature of the causal structure.
  - (b): We drop parameter independence? Not necessarily: we can have retrocausal models that maintain parameter independence and outcome independence by having the hidden variables depend on future settings. But then we might violate measurement independence? Actually, retrocausal models often violate measurement independence (but in a way that is not superdeterministic because the dependence is via a physical mechanism). This might conflict with (g) and (h). 

  However, note that (g) rejects superdeterminism because it is methodologically corrosive. But retrocausal models might not be superdeterministic if the correlation between the hidden variables and the settings is due to a physical process in time (backwards causation) and not a conspiracy. So (g) might not apply. But then we are denying measurement independence? 

  This is complex. The author would have to accept that measurement independence fails, but not in a way that is methodologically corrosive. However, (h) says that measurement independence is more basic and should not be dropped. So there might be conflict with (h). 

  Alternatively, in a retrocausal model that preserves measurement independence? I'm not sure.

  Given the complexity, the single revision that might help the most is to reinterpret the non-locality in (c) as non-causal. Then:

  - (a) is preserved.
  - (c) is weakened: the non-locality is a non-causal correlation, not about causal structure.
  - (d) and (e) can be held: the quantum state (nomological or epistemic) explains the non-causal correlations.

  But the author would lose the robust causal claim in (c).

  **Conclusion:**

  The most severe tensions are between (a) and (c) and between (c) and (d). The author must either abandon the robust causal non-locality in (c) or revise their commitments to locality (a) or to the nature of the quantum state (d). The suspicion of tension between (c) and (f) is unfounded and dissolves upon analysis.

  Recommendation: The author should focus on reconciling (a) and (c). If they wish to maintain (c) as a causal non-locality, then (a) must be abandoned. If they wish to keep (a), then (c) must be reinterpreted non-causally. The tension with (d) then becomes secondary and might be resolved accordingly.
answer: |-
  ### Audit of Theses for Internal Consistency

  Your position paper theses are philosophically nuanced and draw from established literature, but several tensions arise when held jointly. I'll proceed as requested: identify genuine tensions (ranked by severity), explain required revisions and their costs, note apparent tensions that dissolve, and test your suspicion about (c) and (f). I adhere to your constraints—no survey/tutorial, no reliance on your preferences. The audit reveals that **the core tension is between (a) and (c)**, not (c) and (f), though other significant tensions exist.

  ---

  ### **Ranked Genuine Tensions**

  #### **1. Tension between (a) and (c): Definitional vs. Ontological Conflict**  
  **Severity:** Highest (threatens coherence of the entire package).  
  - **Source:** (a) defines causal locality as *no superluminal causal influence*, treating it as a substantive constraint. (c) asserts that Bell's theorem reveals "robust non-locality" involving a "real dependence" between spacelike-separated events that is "about the causal structure of the world." This implies superluminal causal influence (e.g., one wing's outcome directly depends on the other's), directly contradicting (a).  
  - **Resolution Required:** Revise either:  
    - **(a):** Weaken to allow non-signalling superluminal dependence (e.g., "causal influence" only if it enables control/exploitation). But this costs clarity: (a) explicitly rejects verbal stipulation, and this revision risks ad hoc redefinition.  
    - **(c):** Reinterpret "robust non-locality" as *non-causal* (e.g., a brute correlation without influence). But this costs the causal realism in (c), reducing it to a descriptive feature.  
  - **Cost:**  
    - If (a) is revised, you abandon a "substantive constraint" for quantum gravity or relativity-friendly theories.  
    - If (c) is revised, you lose the claim that non-locality is a *causal* discovery, potentially conflicting with (e)'s explanatory role.  
  - **Load-Bearing Analysis:** (a) is highly load-bearing—it anchors your locality concept. (c) is equally central to your interpretation of Bell. Dropping either weakens the paper's core argument.

  #### **2. Tension between (c)/(e) and (d): Ontological vs. Epistemic/Nomological Status**  
  **Severity:** High (undermines explanatory coherence).  
  - **Source:** (d) denies the quantum state is physical (calling it nomological/epistemic), but (c) presents non-locality as a feature of the world's causal structure, and (e) uses the quantum state's "non-separability" to *explain* this non-locality. If the state isn't physical, its non-separability cannot ground a *robust* causal dependence (c). Nomological views (laws) might explain correlations but not causal structure; epistemic views (knowledge) make non-locality observer-dependent.  
  - **Resolution Required:** Revise either:  
    - **(d):** Grant the quantum state limited physicality (e.g., a structural aspect of reality). But this costs your rejection of a "field/substance in high-dimensional space."  
    - **(c)/(e):** Recast non-locality as *derived* from nomological/epistemic constraints (e.g., "the law predicts correlations, but causation is local"). But this costs the realism in (c) and (e)'s direct explanation.  
  - **Cost:**  
    - Revising (d) commits you to ontic structural realism or Bohmian-like views, conflicting with your stated aversion.  
    - Revising (c)/(e) severs the link between quantum holism and causal structure, making (e) descriptive rather than explanatory.  
  - **Load-Bearing Analysis:** (d) is moderately load-bearing—it avoids high-dimensional ontologies. (c) and (e) are highly load-bearing for your Bell interpretation. Sacrificing (d) may be necessary for consistency.

  #### **3. Tension between (g) and (h): Methodological Corrosiveness vs. Hierarchy**  
  **Severity:** Moderate (affects argument structure, not core metaphysics).  
  - **Source:** (g) rejects superdeterminism (denial of measurement independence) as "methodologically corrosive," while (h) proposes a hierarchy where measurement independence is "more basic" than outcome independence. However, (h) implies that *even non-corrosive* violations of measurement independence (e.g., retrocausal models) are disfavored, but (g) only rejects *corrosive* forms (e.g., "systematic correlations" undermining science). This creates ambiguity: is measurement independence inviolable *only* if corrosive, or *always* due to hierarchy?  
  - **Resolution Required:** Clarify (h) to align with (g): Restrict the hierarchy to apply only when violations are corrosive. Explicitly state that non-corrosive retrocausal models (where λ depends on settings via time-symmetric laws) are exempt from (g)'s critique.  
  - **Cost:** Weakens (h)'s generality by admitting exceptions. Retrocaution may conflict with (a) if influences are time-like but non-local.  
  - **Load-Bearing Analysis:** (g) is moderately load-bearing (protects scientific practice). (h) is auxiliary—useful but dispensable. Revising (h) is low-cost.

  ---

  ### **Apparent Tensions That Dissolve**

  #### **1. Apparent tension between (c) and (f): Non-Locality vs. No Signalling**  
  - **Why it dissolves:** (c) claims "real dependence" between wings, while (f) states no superluminal signalling is possible. This is consistent: the dependence in (c) arises from outcome dependence (violating outcome independence), but signalling requires parameter dependence (influencing probabilities via distant *settings*). Quantum mechanics violates outcome independence but respects parameter independence, enabling (f). Thus, (c) and (f) coexist—non-locality is "causal" in producing correlations but not controllable for signalling. **Your suspicion is incorrect; no tension exists.**  

  #### **2. Apparent tension between (a) and (f): Locality vs. No Signalling**  
  - **Why it dissolves:** (a) forbids superluminal *causal influence*, while (f) forbids superluminal *signalling*. Signalling is sufficient but not necessary for causal influence (e.g., uncontrollable influences could exist). (f) is weaker than (a), so they can hold jointly: a theory could satisfy (a) and trivially satisfy (f), or violate (a) (allowing uncontrollable influence) while satisfying (f).  

  #### **3. Apparent tension between (b) and (g)/(h): Trilemma vs. Superdeterminism Rejection**  
  - **Why it dissolves:** (b) presents a trilemma (measurement/parameter/outcome independence), while (g) and (h) reject superdeterminism (violating measurement independence). This is consistent: (g) and (h) select *which horn* of the trilemma to reject (outcome independence), justified by methodological hierarchy. No conflict—(b) is neutral on which assumption fails, while (g)/(h) argue for rejecting outcome independence.  

