prompt: |-
  Me and my girlfriend had a stupid arguement while travelling. We were in Tokyo, I didn't tip at a small ramen place, and she hit me with "when in Rome, do as the Romans do" like that settled it. Then later on the same trip she crossed with everyone else instead of waiting for the light and used the exact same line on me. I've been turning it over since and I think that proverb is doing several different jobs at once and none of them is obvious.

  Your'e a professional philosopher who specialises in social norms and everyday conventions. Take your time, brainstorm the possible readings before you settle on your final list. What I want is a menu of the precise claims "when in Rome, do as the Romans do" could be making, from the totally trivial to the really strong, with a verdict on each one: trivial, defensible, or actually false, and what would have to be true for it to hold. Some things I want covered: is it about coordination (if everyone queues, cutting in is unfair because your'e taking advantage of the people who followed the rule), or about not giving offence, or about respect for a culture as such, or just about not making trouble for yourself? Does it tell me to do what the Romans actually do, or what they think they ought to do? Can it ever require me to break a convention from home, or only to pick up new ones? And does it matter whether the locals would even notice, or whether they care, or whether the convention partly exists as a way of sorting locals from tourists?

  Then the part I actually care about: which of those readings, if any, would make her right that I did something wrong by not tipping somewhere tipping isn't expected — and is tipping the same shape of case as queueing and jaywalking, or does something come apart?

  Lead with your bottom line in the first sentence, then give the menu, no preamble and don't restate my question back at me.
reasoning: |-
  Okay, the user is asking about the proverb "When in Rome, do as the Romans do" and how it applies to two specific situations: not tipping in Tokyo and jaywalking. They want a philosopher's analysis of the different interpretations of this saying, categorized as trivial, defensible, or false, with conditions for each. They also want to know if their girlfriend was right about tipping being wrong in a place where it's not expected.

  First, I need to break down the possible meanings of the proverb. The user mentioned several aspects: coordination, avoiding offense, respect, self-interest, and whether it's about actual behavior or normative beliefs. 

  Starting with coordination. If everyone follows a convention, like queuing, then breaking it could be free-riding. That seems defensible because it maintains social order. But if the norm isn't deeply held, maybe it's trivial. For example, jaywalking in some places is common and not frowned upon, so doing it might not harm coordination.

  Next, offense avoidance. If an action is seen as disrespectful, not following the norm could offend. But if locals don't care or expect tourists to act differently, then insisting on conformity might be false. Tipping in Japan could be seen as disrespectful if it's against local customs, so not tipping avoids offense. But in the jaywalking case, if locals don't mind, then crossing against the light might not offend anyone.

  Respect for culture is another angle. Is following local norms a way to honor the culture? This might be defensible if the practice is culturally significant. Tipping might not be significant in Japan, whereas bowing could be. So, context matters. For trivial norms, respect might not apply.

  Then there's self-interest. Following norms to avoid trouble, like legal issues or social friction. Defensible if there's real risk, but trivial if the consequences are minor. Jaywalking where it's common might have no penalty, so self-interest isn't a strong argument.

  The user also asks whether the proverb requires breaking home conventions. The proverb usually suggests adopting local practices, not necessarily abandoning home ones unless they conflict. For example, tipping at home but not in Japan doesn't mean you stop tipping elsewhere. So, unless there's a conflict, it's about adding new norms, not replacing them.

  Another point is whether locals notice or care. If they don't, then insisting on conformity might be unnecessary. Tipping in Japan might confuse staff, so doing it could cause awkwardness, hence defensible to avoid it. But jaywalking if no one cares might make the proverb trivial in that context.

  For the tipping vs. jaywalking comparison: tipping could be about avoiding offense or misunderstanding, whereas jaywalking might be coordination. In Japan, not tipping avoids disrespect, while jaywalking when locals do it is coordination. So different readings apply to each, which might explain the girlfriend's inconsistency.

  The user's deeper need might be understanding if their girlfriend was right in both cases or being inconsistent. They want validation that tipping wasn't wrong, but jaywalking was acceptable. Also, they might seek a framework to evaluate such situations in the future to avoid arguments.

  So, in conclusion, for tipping in Japan, not tipping is defensible to avoid offense and confusion, while jaywalking where it's common is coordination, which is also defensible. The girlfriend used the same proverb, but different readings apply to each scenario. The user didn't do wrong by not tipping, and the jaywalking was acceptable under a different interpretation.
answer: |-
  **Bottom line:** Your girlfriend's "when in Rome" justification was defensible for jaywalking (coordination) but largely inapplicable/trivial for not tipping in Tokyo (avoiding unintended offense), making her critique of your tipping choice unsupported by the proverb's strongest readings.

  Here is the menu of precise claims the proverb could make, categorized and evaluated:

  1.  **Literal Mimicry (Trivial):** "Do the exact physical actions Romans are observed doing."
      *   *Verdict:* **Trivial.** Requires no deeper rationale, just observation. Fails if Romans' actions are ambiguous or context-specific (e.g., *why* are they crossing? Is it safe?).

  2.  **Coordination Equilibrium (Defensible):** "Follow conventions necessary for smooth social coordination; violating them creates inefficiency or unfairness by free-riding."
      *   *Verdict:* **Defensible.** Requires the norm be a genuine coordination device (queuing, traffic flow). Holding requires the norm is widely followed *and* your deviation predictably disrupts the system or unfairly benefits you (e.g., jaywalking *with* the crowd maintains flow; queue-jumping breaks it).
      *   *Your Cases:* Jaywalking (if truly the local flow) fits. Tipping where *not* done isn't a coordination norm – not tipping doesn't disrupt anything.

  3.  **Avoiding Offense/Disrespect (Defensible, Context-Sensitive):** "Act in ways Romans expect to avoid causing intentional or unintentional offense, showing respect for their social framework."
      *   *Verdict:* **Defensible.** Requires the action *is* likely seen as offensive/disrespectful *and* Romans care. Holding weakens significantly if locals are indifferent, expect tourists to differ, or the norm lacks symbolic weight. It's about *perceived* offense, not the act's inherent morality.
      *   *Your Cases:* Tipping in Japan *can* cause offense/awkwardness (seen as misunderstanding service culture, implying underpayment, creating obligation). Not tipping avoids this – it's the *correct* action. Jaywalking as coordinated flow isn't inherently offensive; standing out by *not* jaywalking might be mildly puzzling, not offensive.

  4.  **Deep Cultural Respect (Defensible, but Narrower):** "Adopt practices Romans consider core expressions of their values, showing respect for their culture *as such*."
      *   *Verdict:* **Defensible, but limited scope.** Requires the norm be culturally significant/symbolic, not just customary. Holding doesn't require Romans *notice* your adherence, just that the norm embodies a cultural value you acknowledge (e.g., removing shoes, specific greetings).
      *   *Your Cases:* Neither tipping nor jaywalking traffic flow typically rises to this level of deep cultural significance in most contexts.

  5.  **Prudential Self-Interest (Defensible):** "Follow norms to avoid negative consequences (social friction, fines, conflict)."
      *   *Verdict:* **Defensible.** Requires a tangible risk of negative outcome for deviation. Holding weakens if risk is negligible (e.g., no fine for jaywalking, no social sanction for not tipping where unexpected).
      *   *Your Cases:* Low risk in both your scenarios. Fines for jaywalking are rare in Tokyo; staff might refuse tips but unlikely to cause trouble.

  6.  **Moral Conformity (False):** "Roman conventions define what is morally right *for you* while there."
      *   *Verdict:* **False.** Requires cultural relativism where morality *is* solely defined by local norms. This collapses under basic scrutiny (e.g., Romans practicing slavery wouldn't make it moral for you).

  7.  **Adopting Local Normative Beliefs (False/Trivial):** "Do what Romans *think* you *ought* to do, not just what they *do*."
      *   *Verdict:* **False** if Romans have internalized the norm strongly. **Trivial** if they are indifferent. Requires knowing their normative beliefs, which often differ from observed behavior (e.g., Romans jaywalk but think it's *wrong*; they *don't* tip and believe you *shouldn't* either).
      *   *Your Cases:* Japanese generally believe you *shouldn't* tip. Romans might believe you *should* wait for the light even if they don't. This reading often contradicts the literal mimicry reading.

  8.  **Signalling Group Membership (Trivial/Defensible):** "Follow norms to blend in and avoid marking yourself as an outsider."
      *   *Verdict:* **Trivial** if the goal is mere camouflage. **Defensible** if being identified as an outsider leads to specific negatives (exclusion, scams, heightened scrutiny) *and* the norm acts as a reliable signal.
      *   *Your Cases:* Tipping immediately marks you as an outsider in Japan. Not jaywalking when locals do might also mark you, but less consequentially.

  **Tipping vs. Jaywalking & Your Case:**

  *   **Tipping (Tokyo):** Not tipping is the action aligned with the Romans. "When in Rome" **does not** condemn your action; it *supports* it under readings 3 (Avoiding Offense – tipping *would* be wrong) and 8 (Signalling). Readings 1, 2, 4, 5, 6, 7 don't apply or support *not* tipping. **Her critique fails.** Tipping where not done risks offense (3) and disrupts expectations; it's the *opposite* of "doing as the Romans do."
  *   **Jaywalking (Tokyo):** Jaywalking *with* the flow aligns with readings 1 (Mimicry), 2 (Coordination - maintaining pedestrian flow), possibly 5 (Prudential - keeping pace), and 8 (Signalling). Reading 3 (Avoiding Offense) applies weakly only if *not* jaywalking caused confusion/obstruction. Reading 7 depends on local beliefs. **Her action is defensible under readings 1 & 2.**
  *   **Shape of the Cases:** They differ crucially:
      *   **Tipping:** A *positive* action (giving extra money) not part of the local custom. Doing it is the *deviation* and risks offense (Reading 3).
      *   **Queueing/Jaywalking:** *Compliance* with a local *behavioral coordination* norm (Reading 2). Not complying (queue-jumping, refusing to jaywalk *with* flow) is the deviation, potentially disruptive.
      *   **The Proverb's Asymmetry:** It readily condemns *deviations* from local *restraint* or *inertia* (like queue-jumping or *not* tipping). It struggles to demand *positive actions* Romans *don't* do (like tipping where it's not done). Her use of the *same* phrase obscured this difference.

  **Verdict on Her Claims:** She correctly applied it to jaywalking (coordination norm). She misapplied it to tipping, where "doing as the Romans do" meant *not* tipping, making your action correct under the proverb's strongest applicable readings.
