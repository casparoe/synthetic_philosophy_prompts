prompt: |-
  I do some volunteer search-and-rescue dispatch, and I keep noticing a kind of complaint we make about things people say over the radio, and I dont think it is any of the three things Ive seen philosophers argue about.

  Case one: someone says the ridge above the treeline is clear. It is clear. He believed it, and he had looked, sort of, from the truck. But there is a pair of binoculars in the truck and thirty seconds to use them, and he did not. Afterwards everyone says he should not have said it. Nobody says it was false, nobody says he did not believe it, and when you push them they do not quite say he did not know it either. What they say is that he could not have told if it had not been clear.

  Case two: another guy gives a position off a single cell ping, gets it right, and then says so -- I was right, wasnt I -- and that makes people angrier, not less. If he had said I got lucky, everyone would of dropped it. And if the position had been wrong, lucky would not have been any excuse at all.

  So the complaint does not track how things turned out. It seems to track whether the person would have said the same thing if it had been false, and it seems to get worse when there was a check he could have done cheaply and skipped. In thick fog with no way to check anything, nobody complains, even though the basis is just as thin.

  I know there is a big argument about whether you are only allowed to come out with what you know, or what is true, or what you believe, but none of those three sounds like what we are doing. Does this thing have a name? I dont want just a label though -- I want to know whether it is a fourth norm or a reading of one of the three, whether it is really about assertion at all or about what the rest of us may do with what we hear, and whether the cheapness of the skipped check actually matters or only feels like it does.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're involved in volunteer search-and-rescue dispatch and have noticed a specific complaint about radio communications that doesn't align with the three main philosophical norms of assertion (truth, belief, knowledge). They provided two cases to illustrate this.

  In the first case, someone reports a ridge is clear without using available binoculars. Even though the statement was true and believed, the team criticizes him because he couldn't have known if it wasn't true. The criticism isn't about falsehood or lack of belief but about the reliability of the method.

  The second case involves someone bragging about a correct location from a single cell ping. The team gets angrier when he boasts, but if he admitted luck, they'd accept it. The issue seems tied to the speaker's acknowledgment of uncertainty and the skipped, easy verification step.

  The user mentions that in thick fog with no way to check, complaints don't happen, even with equally thin evidence. So the key factors are reliability (would the method detect if it were false?) and the cost of skipped checks. The user wants to know if this is a fourth norm, a variant of existing ones, or something else entirely. They also question if it's about assertion itself or how listeners should use the information.

  I recall that epistemology has concepts like safety and sensitivity. Sensitivity asks if the person would have believed it if it were false. In the ridge example, without binoculars, he might still believe it was clear even if it wasn't, so the statement isn't sensitive. Safety is about avoiding false beliefs in similar situations. Both relate to reliability.

  Assertion norms often reference knowledge, but here the team isn't explicitly saying "he didn't know." Instead, they focus on the method's reliability. The cost of the skipped check matters because in high-stakes situations like SAR, easy verifications are expected. The bragging in the second case adds an element of blameworthiness for not acknowledging the luck involved.

  I think the core here is the **norm of reliable evidence or due diligence**. It's not just about the statement being true or believed, but about the process leading to it. In SAR, where lives are at risk, assertions must be backed by methods that can detect errors. Skipping a cheap, available check violates due diligence, making the assertion irresponsible regardless of truth.

  The user might also be hinting at how listeners should assess incoming information. The team's reaction suggests they need to rely on reports without second-guessing, so the speaker's diligence affects trust. The cost factor is crucial because inescapable uncertainty (like thick fog) is tolerated, but skipping easy steps isn't.

  So, tying it together: this is a context-specific norm of responsible assertion emphasizing reliability and due diligence, influenced by stakes and practicality. It's a blend of existing ideas but tailored to high-stakes environments. The user's deeper need might be to formalize this understanding to improve training or communication protocols in their volunteer work, ensuring that dispatchers emphasize thorough checks and acknowledge uncertainties.
answer: |-
  This is a fascinating and astute observation – you've hit on a crucial norm in high-stakes, practical communication that doesn't neatly fit the classic "Truth/Belief/Knowledge" triad for assertion. What you're describing is closely related to concepts within **epistemology (philosophy of knowledge)** and **norms of assertion**, particularly focusing on **reliability, sensitivity, safety, and the violation of due diligence.**

  Here's a breakdown of the key elements and how they relate to philosophical concepts:

  1.  **The Core Complaint: Lack of Reliability/Sensitivity:**
      *   The fundamental complaint isn't *just* that the statement might be false, or that the speaker didn't believe it, or even strictly that they didn't "know" it in a basic sense.
      *   The complaint is: **The speaker's method for forming the belief/assertion was not reliable enough to *detect* if the situation were different (false).** Specifically:
          *   **"He could not have told if it had not been clear":** This directly points to the concept of **Sensitivity**. A belief is *sensitive* if, in the nearest possible world where the proposition is false, the speaker would not hold that belief using the same method. He looked casually from the truck without binoculars. In a nearby world where there *was* someone on the ridge (but still hard to see with the naked eye), he likely *still* would have believed/said it was clear. His method wasn't sensitive to the truth.
          *   **Related Concept: Safety.** A belief is *safe* if it couldn't easily have been false in the circumstances. Using the same unreliable method (casual glance) in similar situations would lead to false beliefs reasonably often. It was "safe" *this time* only by luck, not because of the method.

  2.  **The Role of Skipped Checks & Cost:**
      *   **"Cheaply Skipped Check":** This is absolutely crucial and highlights the **violation of due diligence**. The existence of a readily available, low-cost, high-value verification method (binoculars) makes the reliance on a less reliable method (naked eye) **unreasonable and blameworthy**. It demonstrates a failure to take reasonable steps to ensure the reliability/sensitivity/safety of the assertion.
      *   **Contrast with Fog:** In thick fog, *no* better method was available. Using the best available method, even if unreliable, is reasonable and meets the due diligence standard *for that context*. The complaint vanishes because the speaker *couldn't* have done better. The norm is context-sensitive and depends on the practical possibilities.

  3.  **The Bragging Case:**
      *   This reinforces the points above and adds a layer of **epistemic responsibility and acknowledgement of luck**.
      *   **The Anger:** Saying "I was right, wasn't I?" after a lucky guess ignores two things:
          *   The *irresponsibility* of asserting based on a single ping (an unreliable method prone to error).
          *   The *luck* involved. He *didn't* have a reliable method to detect if he was wrong (insensitive/unsafe).
      *   **"I got lucky":** Acknowledging the lack of reliability and the role of luck satisfies the implicit norm. It signals: "I understand my assertion wasn't based on a sufficiently reliable process to warrant confidence or your full reliance, given the stakes. I wouldn't assert it that way again." It demonstrates epistemic humility and responsibility.
      *   **"Lucky" being no excuse if wrong:** This confirms that the core issue isn't the outcome, but the *process*. If the assertion was wrong *and* based on an unreliable/skipped-check method, the blame is even more severe. Saying "I was wrong, but I got lucky" after a mistake would be nonsensical and aggravating – the "lucky" part only applies when the outcome accidentally matched the truth despite a bad process.

  **What is this Norm? Is it a "Fourth Norm"?**

  *   **Not Quite a *New* Fundamental Norm:** It's more accurately understood as a **contextually specified application or strengthening of the Knowledge Norm of Assertion**, incorporating elements of **reliability, safety/sensitivity, and due diligence**.
      *   **Knowledge Norm (KN):** "Assert P only if you know P."
      *   **The Problem:** Your team isn't *explicitly* saying "He didn't *know*," though they likely imply it. They focus on the *method* and *what he could have done*.
  *   **KN + Contextual Due Diligence:** The SAR context imposes high stakes (lives, resources, time) and often has readily available verification tools. Therefore, the knowledge norm in *this context* requires more than just minimal justification. It requires **knowledge acquired through a process that meets a standard of reasonable diligence and reliability given the stakes and available resources.** Skipping a cheap, highly effective check like binoculars means the belief *fails to meet the reliability threshold required for knowledge in this high-stakes context*. He didn't "know" it in the sense required *for responsible SAR dispatch*, even if he had a true, justified belief.
  *   **Reliability/Safety Norms:** Some philosophers argue assertion requires the belief to be *reliable* or *safe*, not just true or believed. Your cases strongly support this view in high-stakes practical contexts. The complaint tracks whether the method reliably produces true beliefs (or avoids false ones) in the relevant circumstances.

  **Is it about Assertion or about the Listener?**

  *   **Primarily about Assertion (and the Speaker's Responsibility):** The complaint is directed at the *speaker* and the *act* of asserting based on an insufficiently vetted or unreliable process. The speaker violated their responsibility to provide information worthy of reliance.
  *   **But it has Direct Implications for the Listener:** The listener's reaction (anger, distrust) stems from the fact that assertions made without due diligence **cannot be reliably acted upon.** The listener knows that if the situation had been different, the speaker would still have asserted the same falsehood. This erodes trust and forces listeners to expend extra effort verifying claims they should be able to rely on. The skipped cheap check signals a lack of care that endangers the mission and the team.

  **Does the "Cheapness" of the Skipped Check Matter?**

  *   **Absolutely, Critically.** This is key to the "due diligence" aspect.
      *   **Feasibility & Proportionality:** The norm isn't "do every possible check." It's "do the *reasonable* checks given: (1) the stakes, (2) the cost (time, effort, risk) of the check, and (3) the likely increase in reliability."
      *   **Threshold Trigger:** A cheap, quick, highly effective check (like binoculars) sets a low threshold for reasonableness. Skipping it is glaring negligence. An expensive, dangerous, or time-consuming check might be reasonably skipped even in high stakes, shifting the "due diligence" threshold.
      *   **Justifies the Anger:** The cheapness highlights how easily the speaker *could* have met the required reliability standard. Their failure is therefore more blameworthy.

  **Conclusion & Name:**

  You've identified a vital **context-sensitive norm of responsible assertion undergirding the Knowledge Norm in high-stakes practical environments**. It emphasizes **epistemic diligence, reliability, and sensitivity.**

  *   **Core Complaint:** Asserting based on a method that is **insufficiently sensitive/reliable** given the stakes *and* the **readily available alternatives for verification**.
  *   **Best Philosophical Labels (Combined):**
      1.  **Violation of Epistemic Due Diligence:** Failure to take readily available, cost-effective steps to ensure reliability.
      2.  **Assertion based on an Insensitive/Unsafe Belief:** The method wouldn't detect falsehoods in nearby possible worlds.
      3.  **Contextually Deficient Knowledge:** Failing to meet the higher reliability/safety threshold required for "knowledge" in *this specific high-stakes, resource-available context*.
  *   **Not Just a Label - The Substance:** This is a real, practical norm arising from the need for actionable, reliable information under pressure. The cheapness of the skipped check is fundamental because it defines the "due" in "due diligence" – what was reasonably required *here*. It's a crucial part of building and maintaining trust within a team whose success depends on the reliability of communicated information. Your team is holding each other to a high, but necessary, standard of epistemic responsibility.
