  ### Precautionary Principle Quiz: Scenarios and Logical Mapping

  Below is a complete 8-question quiz designed to sort users by their responses to concrete cases, without using jargon. The quiz maps to a logical framework of **six binary distinctions** (including the novel recursion axis), generating 64 theoretical positions. Named views occupy specific cells, while others remain empty due to logical inconsistencies or practical irrelevance.

  ---

  #### **Quiz Questions & Answer Options**
  *Each question has 2–3 options. Users select one per scenario.*

  1. **Gain-of-Function Research Pause**  
     Virology research is paused to prevent lab-generated pandemics. Ending the pause could accelerate vaccine development for future outbreaks.  
     → A) **Keep paused** until safety is proven.  
     → B) **Resume research**; unpreparedness for natural pandemics is the greater risk.  
     → C) **Resume research**; benefits clearly outweigh risks.  

  2. **Pesticide Licensing**  
     A pesticide boosts crop yields significantly but may harm unmonitored pollinators.  
     → A) **Block licensing** until proven pollinator-safe.  
     → B) **Approve immediately**; benefits outweigh unproven risks.  
     → C) **Approve but fund pollinator studies**.  

  3. **Asteroid Deflection**  
     An asteroid has a 1% natural hit chance. Deflecting it has a 0.1% chance of causing a hit.  
     → A) **Deflect it**; 1% risk is unacceptable.  
     → B) **Do nothing**; deflection’s 0.1% risk is an avoidable danger.  
     → C) **Deflect it**; expected damage reduction justifies it.  

  4. **Gene Therapy Approval**  
     A cheap cure for a common disease has a rare, unquantified risk of fatal side effects.  
     → A) **Delay approval** until side effects are ruled out or minimized.  
     → B) **Approve now**; benefits justify unknown risks.  
     → C) **Block permanently** if any death risk exists.  

  5. **Mosquito Gene Drive**  
     Releasing gene-drive mosquitoes could eradicate malaria but might disrupt ecosystems unpredictably.  
     → A) **Release immediately**; benefits dwarf speculative risks.  
     → B) **Never release**; unpredictable ecosystem harm is unacceptable.  
     → C) **Research in labs first**; do not release yet.  

  6. **Pascal’s Mugging**  
     A stranger requests $10 to prevent a 1-in-a-quintillion chance of a catastrophe killing 10²⁰ beings.  
     → A) **Pay $10**; stakes outweigh negligible costs.  
     → B) **Refuse**; probability is too speculative.  
     → C) **Refuse**; never act on cosmic-scale claims.  

  7. **Economic Ban Recursion**  
     Banning an industry prevents pollution but causes irreversible economic/cultural loss.  
     → A) **Ban**; pollution risks outweigh economic loss.  
     → B) **Do not ban**; the ban’s irreversible harms are too severe.  

  8. **Solvent Regulation**  
     A solvent causes reversible rashes at unknown rates but is vital for life-saving medical devices.  
     → A) **Ban solvent** until rash risks are measured.  
     → B) **Keep using**; benefits justify unknown risks.  
     → C) **Keep using but study rashes**.  

  ---

  #### **Logical Distinctions & Scoring Key**
  Responses map to **six yes/no distinctions** defining the user’s precautionary framework. Scoring is automated (e.g., via spreadsheet). 

  | Distinction (Abbr.) | Definition                                                                 | Scoring Guide (Yes = 1, No = 0)                                                                                             |
  |---------------------|----------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|
  | **Status Quo Bias (SQB)** | Applies to inaction/omissions, not just actions.                                  | **Q1A=0** (action-only), **Q1B=1** (inaction risk). Q1C scores 0 (non-precautionary).                                      |
  | **Decision Rule (DR)** | Directly mandates actions (vs. shifting burden of proof).                       | **Q3A=0** (burden shift), **Q3C=1** (action mandate). Q3B scores 0.                                                        |
  | **Trigger: Irreversibility (TrigIrr)** | Activated by irreversible harm (even with measurable probabilities).           | **Q4B=1** (avoids deflection’s extinction risk), Q4A/C=0. **Q2A=1** (pesticide blocks irreversible ecosystem loss).       |
  | **Trigger: Unmeasurable Risk (TrigUnmeas)** | Activated by unquantifiable risks (even for reversible harms).                  | **Q8A=1** (bans solvent over unmeasurable rashes), Q8B/C=0. **Q5B=1** (gene-drive blocks unmeasurable ecology risks).     |
  | **Threshold/Proportionality (ThreshProp)** | Weighs costs/benefits or uses risk thresholds (vs. "any nonzero risk" avoidance). | **Q6A=0** (no threshold; acts on any risk), **Q6C=1** (absolute threshold). Q4C/Q7A imply thresholds (1).                 |
  | **Recursion (Rec)** | Applies to precautionary measures themselves if irreversible/unmeasurable.      | **Q7B=1** (avoids ban due to its irreversible harms), **Q7A=0**.                                                           |

  **Special Cases**:  
  - **Q1C/Q3B** indicate non-precautionary stances (all distinctions = 0).  
  - **Q6B/Q8C** imply risk thresholds (ThreshProp=1).  

  ---

  #### **Logical Tree & Empty Cells**
  The framework yields **64 possible positions** (2⁶). Named views occupy **9 cells**; **55 cells are empty** due to logical contradictions or practical incoherence.  

  ##### **Named Views & Their Cells**
  | Position (SQB-DR-TrigIrr-TrigUnmeas-ThreshProp-Rec) | Named View                                  | Description                                                                 |
  |-----------------------------------------------------|---------------------------------------------|-----------------------------------------------------------------------------|
  | 0-0-1-1-0-0                                         | Weak (Treaty) Precaution                    | Burden of proof for irreversible/unmeasurable risks; no recursion.          |
  | 1-1-1-0-0-0                                         | Strict Precaution                           | Mandates avoiding irreversible risks (any probability); ignores inaction risks. |
  | 1-1-1-0-0-1                                         | **Recursion-Aware Strict Precaution**       | Avoids precautions causing irreversible harm (e.g., bans).                  |
  | 0-1-0-1-0-0                                         | Ambiguity Aversion                          | Mandates action for unmeasurable risks only.                                |
  | 1-1-0-0-0-0                                         | Maximin                                     | Minimizes worst-case outcome (ignores probability).                         |
  | 1-1-0-0-1-0                                         | Minimax Regret                              | Minimizes maximum regret (cost-aware but precautionary).                    |
  | 0-0-0-1-0-0                                         | Procedural Burden Shifting                  | Shifts proof for unmeasurable risks; no mandates.                           |
  | 0-0-0-0-1-0                                         | Rejectionist (Fat-Tail EU)                  | Uses expected utility with risk premiums; no precautionary triggers.        |
  | 1-0-1-1-1-0                                         | Weak Precaution + Inaction Coverage         | Hybrid: burden shift for irreversible/unmeasurable risks, including inaction. |

  ##### **Empty Cells & Why**
  - **Recursion + Non-Decision-Rule (e.g., X-X-X-X-X-1 + DR=0)**: Recursion requires actionable mandates (DR=1). *Example: "Shifting burden of proof" can’t apply to itself.*  
  - **TrigIrr=0 + TrigUnmeas=0**: Rejects both triggers → non-precautionary (all zeroes).  
  - **ThreshProp=0 + Rec=1**: "Any-risk" avoidance with recursion leads to paralysis. *Example: Banning industry to avoid pollution risks, then banning the ban to avoid economic risks, ad infinitum.*  
  - **SQB=0 + Rec=1**: Recursion focuses on actions, but SQB=0 ignores inaction risks → contradictions in dynamic tradeoffs.  

  ##### **Indistinguishable Positions**
  - **Strict Precaution vs. Maximin vs. Unbounded Pascalian (1-1-1-0-0-0 vs. 1-1-0-0-0-0 vs. 1-1-0-1-0-0)**:  
    All avoid worst-case outcomes but differ on triggers (irreversibility/unmeasurability). Q4/Q5/Q8 separate them.  
  - **Weak Precaution vs. Fat-Tail EU (0-0-1-1-1-0 vs. 0-0-0-0-1-0)**:  
    Weak Precaution triggers on irreversible/unmeasurable risks; Fat-Tail EU uses risk premiums without triggers. Q2/Q5/Q8 separate them.  

  ---

  #### **Novel Axis: Precautionary Recursion**
  This axis (**Rec**) exposes when users apply the principle to its *own safeguards* (e.g., bans or delays causing irreversible harm). It:  
  - **Creates a new position**: Strict Precaution with recursion (1-1-1-0-0-1).  
  - **Forces tradeoffs**: Users supporting irreversible precautions (Q7A) default to Rec=0. Those rejecting them (Q7B) adopt Rec=1, even if otherwise strict.  
  - **Explains paralysis**: Rec=1 + ThreshProp=0 creates infinite regress (empty cell).  

  ---

  ### **How to Implement**
  1. **Deploy the quiz** with the 8 questions.  
  2. **Score responses** using the table (e.g., code answers as 0/1 per distinction).  
  3. **Output the user’s 6-digit "precautionary fingerprint"** (e.g., 1-0-1-1-0-0).  
  4. **Map fingerprints to named views** using the table above.  
  5. **Flag empty cells** as "incoherent" and indistinguishable pairs as requiring follow-up questions.  

  This system avoids forcing users into predefined labels, instead deriving their stance from concrete cases while exposing hidden tensions (e.g., recursion). The recursion axis ensures positions like "strict unless precaution destroys options" emerge organically.
