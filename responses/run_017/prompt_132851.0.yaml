prompt: |-
  Hey — I teach a second-year ethics seminar, 18 students, one 75-minute slot, and most of them aren't philosophy majors (a bit of utilitarianism, one session on Kant, that's it). I want an activity where they first feel the pull of the idea that some actions are genuinely good to do but not required, and that omitting them isn't blameworthy — and then, more importantly, feel how unstable that category is once you start pushing on it. I'd rather they not hear the word "supererogation" until the last ten minutes, and I don't want to lecture up front at all.

  Here's the half-formed thing I keep failing to make work: a cost ladder. Fixed benefit (a stranger's life), ten rungs of cost to the agent, each rung only a hair worse than the one below — stubbed toe at the bottom, near-certain death at the top. Everyone privately marks where "you'd have to do this" ends, where "you'd be amazing but you don't have to" begins, and where "nobody could possibly demand this" starts. Then I want them to run into the collapse themselves: the person whose line is at rung 4 and the person whose line is at rung 5 have to explain to each other why a two-percent difference in risk flips a moral category. Can you design that as something they do to each other, with rules and roles, rather than something I announce?

  The part I actually care most about is a wrinkle they won't have seen before. My idea: the ratchet. Once you learn what people in the room actually did (or say they'd do), your sense of where the line sits moves — the person who goes furthest raises the bar for everyone else, which means the category partly eats itself, and now the other seventeen have a kind of complaint against the hero for making them look bad. Can you build a round where that happens to them for real, with small actual stakes (no money — chocolate, poker chips, a raffle for a silly prize, whatever), and where they notice it happening on their own? I also want a round where they try, and mostly fail, to rescue a non-arbitrary cutoff by finding a qualitative break somewhere on the continuous scale, and then have to say out loud what they ended up appealing to instead.

  Deliverable: rules, materials, a timeline with the reveals, and a debrief that maps specific moments onto the moving parts — how the blame/praise asymmetry behaves, what happens to the line when the group's behaviour is known, and what the failed rescue attempt shows. Real constraints: whiteboard and a projector, no prep outside class, and it has to still work if only 12 show up.

  Also two things: what will predictably go wrong the first time I run it (I'm guessing one student goes full act-utilitarian and refuses to play, and another tries to dissolve the whole thing into "well, it depends on the person"), and an honest note on which feature of the idea the activity structurally cannot reproduce and I'll just have to say in words. My guess is it can't separate "not required" from "positively permitted to skip" from "worth praising," but you tell me — and tell me if there's something bigger it leaves out.
reasoning: |-
  Okay, the user is an ethics professor looking for an interactive classroom activity to help students intuitively grasp the concept of supererogation and its instability. They've tried a "cost ladder" approach but couldn't make it work effectively. Their core needs are: making students feel the pull of supererogatory actions, experiencing how the category collapses under pressure, and noticing the "ratchet effect" where heroic actions shift group norms. They want minimal lecturing and no jargon until the end.

  Hmm... their half-formed idea has good bones but needs structural reinforcement. The key pain points seem to be: (1) getting concrete disagreement between students about near-identical rungs, (2) making the ratchet effect viscerally real, and (3) forcing failed attempts to find qualitative breaks. The chocolate/stakes idea is smart - it creates real social friction without ethical risk.

  The professor's deep concerns are spot-on: a utilitarian might derail it by refusing thresholds, and subjectivists might over-relativize. The activity indeed can't fully separate "permitted to skip" from "praiseworthy" - that distinction will need verbal scaffolding later. Also, the blame/praise asymmetry might not emerge organically; we'll need targeted debrief questions.

  Let me design around three phases: private threshold-setting, public pressure cooker, and rescue attempts. Using poker chips for "social capital" makes the ratchet tangible - when someone donates more chips, it implicitly judges others' choices. The "rescue round" where they hunt for qualitative breaks should expose how we retrofit justifications onto intuitions.

  Biggest execution risks: 
  - If the first volunteer picks a low rung (say 3), the ratchet won't build. Solution: seed the initial reveal with a confederate if possible, or have TAs model high commitment.
  - Students might cluster thresholds and avoid conflict. Counter by forcing pairwise debates between adjacent choices.
  - The "permitted but not praised" gap might collapse in discussion. Will need to explicitly flag in debrief.

  Materials are simple: projected ladder, poker chips, envelopes for privacy. Timeline tight but feasible if we cut transition times. Debrief must connect their frustration during the ratchet to moral reasoning pressures in real life. Might add a "what stayed with you?" closing to gauge absorption.
answer: |-
  Here's a structured, interactive classroom activity designed to hit your goals, incorporating the cost ladder, the ratchet effect, and the failed rescue attempt, all while avoiding upfront lecturing. It uses low-stakes poker chips as currency.

  **Activity Title:** *The Lifeline Dilemma*

  **Materials:** 
  1. Projector displaying a 10-rung "Cost Ladder" (see below)
  2. 18 envelopes (one per student), each containing 10 red poker chips + 1 green poker chip
  3. Whiteboard for tracking "donations"
  4. Small prize (e.g., fancy chocolate bar, campus bookstore voucher)

  **Cost Ladder (Projected):**  
  *Fixed Benefit: Saving a stranger’s life. Costs to YOU:*  
  `RUNG 1: Stubbed toe (mild, brief pain)`  
  `RUNG 2: Ruined new shoes ($150 loss)`  
  `RUNG 3: Broken wrist (6 weeks in cast)`  
  `RUNG 4: Severe flu (2 weeks bedridden)`  
  `RUNG 5: Lost job (no severance)`  
  `RUNG 6: Permanent back pain (manageable)`  
  `RUNG 7: Facial scarring (permanent, visible)`  
  `RUNG 8: Bankruptcy (lose life savings)`  
  `RUNG 9: Loss of a limb`  
  `RUNG 10: Near-certain death (95% chance)`

  **Timeline (75 mins):**

  1. **Setting Up (5 mins)**  
     - Distribute envelopes. Explain: *"Each chip represents a piece of your 'well-being capital.' You'll face choices about spending chips to save a life. Red chips = small cost. Green chip = MAJOR cost (like Rung 8-10). Keep choices private until instructed."*
     - Display ladder. Clarify: *"This shows escalating costs to YOU for saving one stranger. No right answers – decide based on your intuition."*

  2. **Private Threshold Setting (10 mins)**  
     - *Task:* Students write down privately:  
       a) **Must-Do Line (🔴):** *"I MUST save the life if the cost is at or below Rung ____"*  
       b) **Hero Line (🟢):** *"I'd be a HERO for saving at Rung ____, but I DON’T HAVE TO"*  
       c) **Unthinkable Line (⚫):** *"NO ONE could demand I save at or above Rung ____"*  
     - *Instructor Role:* Circulate, answer clarifying questions only. *Do not* engage in moral discussion.

  3. **The Ratchet Round (20 mins)**  
     - *Rules:*  
       - Students *anonymously* commit chips to "save the life" by placing them in a box.  
       - 1 red chip = Save at Rung 1-3.  
       - 2 red chips = Save at Rung 4-5.  
       - 3 red chips = Save at Rung 6-7.  
       - 1 green chip = Save at Rung 8-10.  
       - **Catch:** If total donations ≥ 18 red chips OR 6 green chips, the "life is saved," and all donors get raffle tickets for the prize. If not, no one gets tickets.  
     - *Process:*  
       1. Students decide *privately* how many chips to donate.  
       2. Donations collected anonymously in envelopes.  
       3. Tally donations publicly on whiteboard. **Do not reveal individual choices.**  
       4. *Reveal outcome*: Did they "save the life"? Raffle tickets distributed if yes.  
     - *Ratchet Trigger:* Announce: *"Now you SEE the group’s commitment level. You may ADJUST your personal Must-Do/Hero lines on your sheet based on what others did."* Give 2 mins for adjustments. *Do not* ask them to justify changes.

  4. **The Pressure Cooker (20 mins)**  
     - *Pair Debates:*  
       - Group students into pairs (or threes if uneven).  
       - Assign each pair two *adjacent* rungs from the ladder (e.g., Pair A debates Rung 4 vs. 5; Pair B debates Rung 5 vs. 6, etc.).  
       - *Task:* "Convince your partner why YOUR rung is the TRUE dividing line between MUST-DO and HEROIC. Use: 'If you think [Rung X] is heroic, why isn't [Rung X-1] mandatory?'"  
     - *Instructor Role:* Listen for arguments about tiny differences ("2% more risk!"), arbitrariness, or appeals to qualitative breaks. Note key quotes.

  5. **Failed Rescue Attempt (10 mins)**  
     - *Group Challenge:* "As a class, find ONE rung where a QUALITATIVE change happens (e.g., physical vs. financial, temporary vs. permanent). You have 3 minutes to agree."  
     - *Reality Check:* They will fail. After 3 mins, ask: "What did you try to appeal to? Why couldn’t you agree?" (Likely answers: "Everything feels gradual," "People value things differently").

  6. **Debrief & Reveal (10 mins)**  
     - **Map the Moments:**  
       - *Threshold Setting:* "You felt the 'permission' to not be a hero (🔴→🟢 gap). Praise/blame asymmetry started here – no shame at skipping Rung 7, but awe if you did it."  
       - *The Ratchet:* "When you saw others donate more, your Must-Do line likely crept up. The 'hero' raised the bar – suddenly doing *less* felt stingy. That’s the category eating itself."  
       - *Pressure Cooker:* "Arguing over adjacent rungs exposed the instability. A 2% difference can’t bear moral weight, but we need a cutoff!"  
       - *Failed Rescue:* "You hunted for a 'natural' break and found none. We retrofit reasons onto intuitions."  
     - **Reveal the Term:** "Philosophers call actions in the 🟢 zone **supererogatory** – good beyond duty. But as you felt, it’s a leaky category!"  
     - **Asymmetry Note:** *Verbally clarify:* "Supererogation tries to separate *blameless omission* (you can skip) from *praiseworthy action* (you’re awesome if you do). But notice: Does knowing others did more make your omission feel *blameworthy*? That’s the ratchet biting."

  **What Will Go Wrong (and Mitigations):**  
  1. **"Full Act-Utilitarian" Student:** Claims *all* rungs are mandatory if net benefit is positive.  
     - *Mitigation:* In Pressure Cooker, pair them with a moderate. Their rigidity highlights how demanding this is. Debrief: "Is requiring Rung 10 reasonable? Why/why not?"  

  2. **"It Depends on the Person" Relativist:** Argues thresholds are purely subjective.  
     - *Mitigation:* Use the Ratchet Round. Ask: "If it’s *all* personal, why did the group’s action shift YOUR line? Why do we resent the hero?"  

  3. **Cluster Thresholds:** Students pick similar rungs (e.g., most choose Rung 5).  
     - *Mitigation:* Assign *adjacent* rungs in Pressure Cooker (e.g., Rung 4 vs. 5), forcing debate on tiny differences.  

  4. **Low Stakes = Low Engagement:**  
     - *Mitigation:* Poker chips create psychological ownership. The raffle makes "sacrifice" tangible. Use dramatic ladder descriptions (e.g., "facial scarring").  

  **Structural Limitations (Require Verbal Explanation):**  
  1. **"Permitted to Skip" ≠ "Praiseworthy to Do":**  
     - The activity *links* praise and permission tightly. You’ll need to say: *"Supererogation insists skipping is *permissible*, not just *not evil*. But in the ratchet, skipping after others act feels *permissible*? Or *shameful*? Real life blurs this."*  

  2. **Motivation Matters:**  
     - The activity can’t distinguish doing Rung 7 *for praise* vs. *genuine compassion*. Mention: "We praise the *act*, but philosophers debate whether *why* you did it changes its status."  

  3. **The Hero’s Burden:**  
     - The ratchet hints at resentment toward heroes, but won’t show *why* we might *admire* them despite this. Note: "Your frustration showed the social cost of heroism. Yet we still call it ‘good’ – that’s the paradox!"  

  **Why This Works:**  
  - **Experiential:** Students *feel* the ratchet when adjusting thresholds post-donation.  
  - **Low-Stakes Conflict:** Poker chips and debates create friction without real harm.  
  - **Forced Collapse:** Adjacent-rung debates + failed qualitative rescue make instability unavoidable.  
  - **Debrief Maps It:** Explicitly connects game moments to target concepts.  

  Run it tight, embrace the chaos, and let the students’ frustration illuminate the philosophy. Good luck!
