answer: |-
  Here are the desiderata for an account of information in thermodynamics, designed for experimental assessment of nanoscopic information engines, motivated by your specified cases and key challenges. Each desideratum includes its motivation case, negotiability status, and whether it's non-negotiable (NN) or a preference (P).

  ### Desiderata
  1.  **Quantified Bounded Quantity (NN)**  
      *   **Requirement:** Identify a specific physical quantity (with units) that is bounded by the accounting (e.g., energy dissipation, entropy change). Specify if the bound is a strict floor on dissipation, an identity (exact equality), or an asymptotic limit (e.g., for quasistatic processes).  
      *   **Motivation:** All cases (e.g., noisy detector requires quantifying usable information vs. dissipation; transient decreases require identifying what transient quantity is bounded).  
      *   **Negotiability:** NN. Without a quantifiable bound, assessment is impossible.

  2.  **Derivation from Statistical Mechanics (NN)**  
      *   **Requirement:** The bound must be derivable from the fundamental postulates of statistical mechanics (Liouville dynamics, microcanonical/canonical ensembles, Gibbs entropy) without adding new postulates about information.  
      *   **Motivation:** "Agent knows nothing of specialist literature" – must rest on known physics. Prevents ad hoc "information postulates".  
      *   **Negotiability:** NN. Imposing extra postulates undermines universality.

  3.  **Path Independence (NN)**  
      *   **Requirement:** The net dissipation/cost over a complete cycle must depend only on the initial and final macrostates of the *combined system+memory+environment*, not on the sequence of operations (path).  
      *   **Motivation:** Entropy is a state function. Cases: cycles leaving memory debt (final state differs); quantum entanglement (memory state intrinsically linked to system).  
      *   **Negotiability:** NN. Violation contradicts the second law's foundation.

  4.  **Finite-Cycle Closure (NN)**  
      *   **Requirement:** Accounting must balance over *any finite number of cycles*, including cycles where memory is not reset (leaving a "debt") or is partially reset. The debt must be a physically stored quantity (e.g., memory in a non-equilibrium state).  
      *   **Motivation:** Unbounded tape (debt accumulates); single-bit reset (debt paid each cycle); pre-correlated tape (debt pre-paid).  
      *   **Negotiability:** NN. Prevents "kicking the cost down the road" indefinitely.

  5.  **Physical Implementation Agnosticism (P)**  
      *   **Requirement:** The bound should depend only on the *logical* description of the information processing (what correlations exist/changed) and the thermodynamic states (temperatures, energy levels), not on the specific physical mechanism implementing the logic (e.g., semiconductor vs. molecular switch).  
      *   **Motivation:** Passive mechanisms vs. demons (isolates memory contribution); quantum vs. classical.  
      *   **Negotiability:** P (Widely desired, but some argue mechanism matters for fluctuations).

  6.  **Explicit Memory Cost Attribution (NN)**  
      *   **Requirement:** The accounting must isolate the cost uniquely attributable to the *memory device's state change* (logical or physical), distinguishing it from costs due to the working substance or load.  
      *   **Motivation:** Passive mechanisms (trapdoor) – must show why they fail without demonic memory; refrigeration output vs. work output.  
      *   **Negotiability:** NN. Essential to identify if "information" is the enabling factor.

  7.  **Non-Epistemic Accounting (P)**  
      *   **Requirement:** The accounting must be phrased solely in terms of physical states and dynamics (correlations, entropies, energies). References to "knowledge" or "what an agent knows" are prohibited.  
      *   **Motivation:** Pre-correlated tape (no "knowledge acquisition" step); quantum non-disturbing measurement (correlation without classical knowledge).  
      *   **Negotiability:** P (A major camp insists on this; others accept epistemic terms if carefully defined).

  8.  **Transient Fluctuation Compatibility (NN)**  
      *   **Requirement:** The bound must hold on average but allow for transient decreases in entropy or violations on short timescales/small scales, consistent with statistical fluctuations.  
      *   **Motivation:** Small devices observed briefly (transient decreases are routine).  
      *   **Negotiability:** NN. Violates observed statistical mechanics.

  9.  **Generalized Temperature Handling (NN)**  
      *   **Requirement:** The bound must correctly handle working substances spanning multiple temperatures or non-equilibrium states, not assuming a single heat bath or global equilibrium.  
      *   **Motivation:** Demon operating on substance spanning two temperatures vs. equilibrium substance.  
      *   **Negotiability:** NN. Essential for real engines and consistency.

  10. **Information Fidelity Cost (NN)**  
      *   **Requirement:** The cost of acquiring (or the value of possessing) correlation must depend explicitly on the *fidelity* or *mutual information* relative to the desired measurement outcome, accounting for noise and partial information.  
      *   **Motivation:** Noisy detector (yields partial information).  
      *   **Negotiability:** NN. A binary "information present/absent" view is insufficient.

  ### Flagged Conflicts
  1.  **Non-Epistemic Accounting (D7-P) vs. Local Erasure Cost (Common View):**  
      *   **Conflict:** Insisting costs are *only* local to erasure (a physical reset event) often relies on defining the memory's "uncertainty" state, which borders on epistemic. D7 forbids this. Path Independence (D3-NN) further demands the total cost depends only on endpoints, not *when* erasure happens.
      *   **Resolution Difficulty:** High. Truly physical accounts (D7) often tie cost to correlation *change* (acquisition OR erasure) to satisfy D3, angering the "cost at erasure" camp.

  2.  **Information as Storable Resource (Implied by D4, D6) vs. Non-Epistemic Accounting (D7-P):**  
      *   **Conflict:** Treating information (correlation) as a storable, debt-incurring physical quantity (like free energy) to satisfy D4 and D6 feels intuitive but risks smuggling in an epistemic "value" of information. D7 strictly forbids any resource not defined by microstates/energy.
      *   **Resolution Difficulty:** High. Satisfying D4 and D6 without D7 is easier. Satisfying all requires a rigorous physical definition of "correlation resource".

  ### The Most Exclusionary Requirement
  *   **Path Independence (D3)** rules out the largest share of plausible accounts. Many intuitive frameworks (especially those emphasizing "cost at measurement" or "cost at erasure" as distinct events) inherently depend on the *sequence* of operations, making the net cost path-dependent. This violates the state-function nature of entropy (D3) and is experimentally untestable without specifying the exact protocol path. Accounts satisfying D3 must find costs tied solely to net changes in combined system+memory state.

  ---

  ### Scorecard of Three Views (Defined by Cost Timing/Origin)
  *(Evaluated against core NN Desiderata D1-D4, D6, D8, D9, D10)*

  1.  **Cost Paid at Erasure (Landauer-inspired):**  
      *   **D1/D2:** Quantifies dissipation (k_B T ln2 per bit erased), floor/asymptotic limit. Often presented as a postulate, derivation from stat mech is possible but context-dependent.  
      *   **D3 (Path Indep.):** **FAILS.** Cost depends on *when/if* erasure happens in the cycle.  
      *   **D4 (Finite Closure):** **FAILS** for cycles without erasure (debt unaccounted).  
      *   **D6 (Memory Cost):** Passes (cost is explicitly for memory reset).  
      *   **D8/D9/D10:** Can be extended, but foundation shaky due to D3/D4 failures.  
      *   **Verdict:** Insufficient for general assessment.

  2.  **Cost Paid at Correlation Acquisition (Measurement Cost):**  
      *   **D1/D2:** Quantifies dissipation related to measurement fidelity (e.g., based on mutual information). Derivation often requires specific measurement models.  
      *   **D3 (Path Indep.):** **FAILS.** Cost depends on *when/if* measurement happens.  
      *   **D4 (Finite Closure):** **FAILS** for pre-correlated tape or cycles without measurement.  
      *   **D6 (Memory Cost):** Ambiguous (is cost for measurement apparatus or memory?).  
      *   **D8/D9/D10:** Can handle noise/transients. Struggles with D9 (multi-temp).  
      *   **Verdict:** Insufficient for general assessment.

  3.  **Generalized Noneq. Free-Energy Bound (Information as Part of Free Energy):**  
      *   **D1/D2:** Quantifies dissipation (e.g., ΔF + k_B T I), identity/exact for finite times. Derivations exist from stochastic thermodynamics/stat mech.  
      *   **D3 (Path Indep.):** **PASSES.** Based on combined system+memory state changes.  
      *   **D4 (Finite Closure):** **PASSES.** Debt is stored as non-equilibrium memory state (part of F).  
      *   **D6 (Memory Cost):** **PASSES.** Cost of changing memory state is explicit in ΔF_mem.  
      *   **D8/D9/D10:** Naturally handles fluctuations (stochastic), multiple temperatures (F defined locally), and information fidelity (I is mutual info).  
      *   **Verdict:** Satisfies all core NN desiderata. Recovers standard thermodynamics when I=0.
