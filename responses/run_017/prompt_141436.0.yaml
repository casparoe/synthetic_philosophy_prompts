  **TO:** Board of Directors, National Guild of Published Fiction Writers  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Date: 4 Days Before Vote]  
  **SUBJECT:** Recommendations on Question 3 & Halberd Bequest – Action Required by [Vote Date]  

  **RECOMMENDATIONS:**  
  1. **ENDORSE Question 3 ("Clean Voices" Amendment)** and authorize our political committee to run ads supporting it.  
  2. **DECLINE the $1.5m Halberd Bequest.**  

  ---

  ### Why We Endorse Question 3  
  Question 3 tackles one specific problem: **access**. Let’s break down what money buys in politics (per our earlier discussions):  
  - **Reach**: Money buys megaphones (ads, mailers). *Question 3 doesn’t touch this.* Billionaires can still spend unlimited cash on ads.  
  - **Agenda**: Money decides which issues get attention (lobbying, think tanks). *Question 3 doesn’t touch this.*  
  - **Access**: Money buys face-time with officials. **This is what Question 3 fixes.**  

  Right now, a $500 donor matters 10x more to a candidate than a $50 donor. That’s access for sale. Question 3 makes a $100 donation *feel* like $700 to a candidate who opts in. Suddenly, the waitress who donates $20 matters as much as the lawyer who donates $140. Candidates can fund campaigns by listening to ordinary people, not just chasing big checks. It doesn’t force anyone to participate, cap outside spending, or silence voices. It just makes small donors competitive in the access marketplace.  

  **The Untouched Harms:**  
  Reach and agenda distortions remain. A billionaire can still flood airwaves with ads (reach), and corporations can still push niche policies (agenda). But access inequality is the most direct corruption of representative government. When officials hear only the wealthy, democracy starves. Question 3 feeds it.  

  ---

  ### Why We Decline the Halberd Bequest  
  The strongest argument *for* taking Halberd’s money:  
  *"Writers rely on patrons—publishers, grants, prizes. If we reject ‘tainted’ money, we’re hypocrites. And if we endorse Question 3, we’re endorsing state control over speech-subsidies—exactly the power that could someday muzzle writers by restricting who funds books or festivals."*  

  This deserves real respect. But here’s why it fails:  
  1. **Fungibility isn’t theoretical; it’s operational.** The Halberd money "frees up" other funds for our Question 3 ads. Legally clean? Probably. Ethically? We’re running ads *against the system Halberd profited from* using money *from* Halberd. That’s not hypocrisy—it’s self-sabotage. Our credibility evaporates.  
  2. **Halberd’s money symbolizes what Question 3 fights.** Halberd built its fortune on opaque, big-money influence campaigns. Taking this bequest while endorsing small-donor empowerment signals that we’re comfortable with the very inequality we claim to oppose.  
  3. **The ‘slippery slope’ fear is misplaced.** Question 3 regulates access to *public officials*, not private speech. Publishers funding books, festivals accepting sponsorships, or writers penning op-eds are exercises of reach—not bids for governmental access. The state’s interest in preventing elected officials from being auctioned is categorically different.  

  ---

  ### The Losing Consideration (Stated Charitably)  
  Those wary of Question 3 argue: *"The state shouldn’t condition public funds on candidates surrendering rights. If spending money is speech (as courts hold), the government can’t ‘bribe’ candidates to speak less. And writers, of all people, should fear the state picking speech-winners."*  

  This view isn’t fringe—it’s a principled commitment to liberty. But it mistakes the amendment’s design. No one’s rights are waived; candidates *choose* to trade a spending cap (a tactical limit) for small-donor empowerment (a democratic good). This isn’t state coercion; it’s an incentive to reconnect with ordinary voters. And for writers, whose voices are often drowned out by paid reach, amplifying small donors isn’t a threat—it’s an affirmation.  

  ---

  ### Actions & Timing  
  - **By [Date: 3 Days Before Vote]:** Executive Director will draft our endorsement statement for Question 3.  
  - **By [Date: 2 Days Before Vote]:** Counsel will confirm ad campaign compliance using existing funds (Halberd money will *not* be accepted, removing fungibility conflict).  
  - **By [Date: Day Before Vote]:** President will politely decline the Halberd bequest, citing mission alignment concerns.  

  ---  
  **In short:** Question 3 fixes a real corruption—access inequality—without touching legitimate speech. Taking Halberd’s money while fighting that corruption undermines our integrity. Writers know better than anyone: you can’t sell the villain the rights to your manifesto.  

  Respectfully,  
  [Your Name]
