prompt: |-
  I direct a small municipal archive in a city of about ninety thousand, and I came to the job from a history PhD rather than from an archives program. My staff is me, one part-time technician, and a rotating set of volunteers; we get thirty to forty offers of material a year and can properly process perhaps eight of them; we are moving buildings in eighteen months and have been told to plan on leaving behind roughly a third of what we hold. Our existing holdings are what you would expect from a city that grew around a rail yard: deeds and plat maps, tax assessor rolls, council minutes and departmental correspondence, the papers of two founding families. The people who make up most of the city now — renters, recent immigrants, a large Ghanaian Pentecostal congregation, the families who pass through the housing court — appear in those papers almost entirely as entries someone else generated: a name on a summons, a line in a ledger, a photograph taken from the sidewalk. I take the point that archives are not neutral and that the shape of a collection is an effect of power rather than a residue of chance. What I cannot work out is what follows from that on a Tuesday morning, when a box is on the table and I have perhaps half a day to decide whether it comes in, and how it gets described if it does.

  What I want is a written procedure my team can actually run, not a set of principles. It should cover appraisal (do we take it, do we decline, do we take it with conditions, and when do we take only a description of it rather than the thing itself) and description (what we are obliged to say about a collection in the finding aid beyond what it contains). The part I care most about is that it should treat gaps as objects to be documented rather than lamented: I want my staff to be able to distinguish, in a repeatable way, a silence that was never created from one that was destroyed, from one that survives somewhere we cannot find it, from one that exists in a form or language we cannot render, from one we ourselves are creating right now by declining or deferring; and I want each of those to have its own test, its own standard of evidence, and its own line in the catalogue record — call it a silence note — written in language a twenty-year-old volunteer can apply to a box without a seminar in theory. I also want the procedure to say, explicitly, where it stops with a no, and where it must stop and hand the question to our community advisory panel because the issue is one of values rather than of fact. Two further wrinkles: the archive's own paperwork (retention schedules, destruction logs, the files of past refusals) is itself a record of the archive's silences, and I want to know whether the procedure should capture that; and one of my board members has proposed that we simply correct the imbalance by actively collecting from under-recorded communities, which I half suspect reproduces the same asymmetry in a friendlier voice, since the material would still enter on our terms, under our description, in our building. Please commit on that dispute rather than describing both sides.

  Then run the procedure, at whatever length is needed, on three real-shaped cases. First: the records of a property management company, 1974 to 2003 — eviction files, rent ledgers, maintenance complaints, a few photographs — in which tenants appear only as defendants, debtors and complainants, offered to us by the founder's daughter on the condition that the reading room be named for her father. Second: a box of maybe two hundred audio cassettes from that Ghanaian congregation, services, counselling sessions and committee meetings from 1989 to 2004, donated by a departing pastor without the knowledge of anyone recorded on them, in a language none of my staff speaks, and including discussions of congregants' immigration status. Third: the papers of a long-serving city councillor, forty linear feet, offered with a small cash endowment attached, which would consume essentially all of our processing capacity for the next year and would fit our existing holdings perfectly. I expect the procedure to give me an answer I dislike in at least one of these; give it to me anyway and say so. Where you are making a judgment call dressed up as a step, mark it as one; and commit to the rule you would actually adopt and why, rather than laying out the menu and leaving me to choose — including, at the end, an honest note on what this procedure cannot do, and which of your steps you would be least surprised to find yourself revising in three years.
reasoning: |-
  Okay, the user runs a small municipal archive and is dealing with massive challenges: limited staff, an upcoming move requiring downsizing, and collections that don't represent the community. They need a practical procedure for appraisal and description that addresses archival silences systematically. 

  Hmm, their frustration is palpable - they're rejecting theoretical principles in favor of actionable steps. The core tension is between operational reality ("half a day per box") and ethical responsibility ("silences as objects to be documented"). Smart framing of silence typology: never created/destroyed/lost/inaccessible/actively created. 

  Whoa, the three test cases are perfectly crafted to stress-test any system: problematic donor terms, ethically fraught recordings, and a collection that'd monopolize resources. And they explicitly want to be uncomfortable with at least one outcome - that's intellectually honest. 

  The board member's "active collecting" idea is thorny. My gut agrees with their suspicion - it's well-meaning colonialism unless power dynamics change. But dismissing it outright might alienate supporters. Need to reframe as "collecting WITH not FOR." 

  Biggest challenge: making silence documentation usable by volunteers without theory backgrounds. The "silence note" concept must be ruthlessly operationalized. Also, distinguishing "values vs facts" decisions is crucial - that advisory panel escape hatch could prevent disasters. 

  For the procedure itself... Appraisal needs clear red/yellow/green flags. Description must bake silence metadata into finding aids. And oh! The archive's OWN paperwork as silence record - brilliant reflexive layer. Should treat past refusal files as accession backlog. 

  On test cases: The property records are radioactive with donor conditions and tenant erasure. The cassettes are ethically explosive but irreplaceable. The council papers are institutional catnip that'd starve everything else. One of these has to be the sacrificial lamb... probably the council papers despite the endowment. 

  Most fragile part? The "values vs facts" boundary. In practice, that line will blur constantly. Also, silence documentation requires time they don't have - might need simplified tiers. 

  Final thought: They're asking for steel-toed boots when the field offers glass slippers. Respect.
answer: |-
  Here is a written procedure designed for operational use, addressing appraisal, description, and silence documentation, followed by its application to your three cases. The procedure prioritizes actionable steps, distinguishes silence types, integrates mandatory referral points, and confronts the board member's proposal directly.

  ---

  **Procedure: Acquisition Appraisal & Description Protocol (AADP)**

  **I. PRELIMINARY ASSESSMENT (1-2 Hours Max)**
  1.  **Record Offer:** Log offer in "Incoming Offers" register (Date, Donor, Brief Description, Contact Info). *Volunteer Task.*
  2.  **Physical Inspection:** Open box. Note format, condition, approximate volume, language(s), dates, creator(s), basic content. Flag immediate risks (mold, pests, PII). *Technician/Archivist Task.*
  3.  **Donor Interview:** Ask donor: "Who created this? Why did they keep it? Why are you offering it now? Are there any restrictions you require? Are others involved who should consent?" Record answers. *Archivist Task.*
  4.  **Core Conflict Check:** Cross-reference donor/creator names with board members, major city officials, active litigation, or past controversial accessions. *Archivist Task.*

  **II. APPRAISAL DECISION (Key: Documented Silences & Values Referral)**
  5.  **Mandatory Referral Trigger?** If YES to any, STOP appraisal. Refer case + preliminary notes to Community Advisory Panel (CAP) with specific question. Proceed *only* after CAP recommendation.
      *   Donor imposes significant access/naming conditions impacting historical interpretation or equity.
      *   Material involves sacred/secret cultural knowledge of a specific community.
      *   Material directly concerns ongoing, highly sensitive community trauma.
      *   Acquisition would demonstrably exacerbate representation imbalance *and* involves contested ownership/consent.
      *   Core Conflict Check reveals significant potential conflict requiring CAP input.
  6.  **Collection Fit & Mandate:** Does it fall within collecting policy (City Govt, Founders, Major Local Orgs/Figures)? Does it *directly* document governance, development, or key social groups? (Yes/No/Partial). *Document "Fit" Rating (Strong/Weak/None).*
  7.  **Uniqueness & Survival Likelihood:** Is this the *only* copy? Is the creator/likely holder (e.g., similar orgs) able/willing to preserve it? (Unique/Likely Duplicate/Uncertain). *Document "Survival" Rating.*
  8.  **Resource Impact:** Estimate processing/storage time/cost vs. annual capacity. Flag if >10% of annual processing time OR requires special handling (language, format). *Document "Resource Cost" (Low/Medium/High/Prohibitive).*
  9.  **Representation Gap Analysis:** Does this material *primarily* document groups currently underrepresented in holdings (e.g., renters, immigrants, specific cultural groups)? (Yes/No/Indirectly). *Document "Representation Impact" (Strengthens Gap/Reduces Gap/Neutral).*
  10. **Appraisal Decision Matrix:**
      *   **ACCEPT:** Strong Fit + Unique + (Resource Cost Low/Medium OR Representation Impact Reduces Gap significantly) + No Mandatory Referral Triggered.
      *   **ACCEPT WITH CONDITIONS:** Strong/Partial Fit + Unique + Resource Cost High BUT Reduces Gap significantly. *Requires specific plan negotiated with donor (e.g., phased transfer, funding for processing) & documented.*
      *   **DECLINE:** Weak/No Fit OR Likely Duplicate OR Resource Cost Prohibitive OR Representation Impact Strengthens Gap/Neutral *without* offsetting unique value. *Document reason clearly.*
      *   **DECLINE BUT CAPTURE DESCRIPTION/METADATA ONLY:** Unique + Significant Historical Value + Resource Cost Prohibitive OR Representation Impact Uncertain/Problematic. *Create detailed "Silence Note" (See III.10) and offer donor assistance finding alternative repository.*
      *   **DEFER:** Unique + Uncertain Fit/Survival/Resource Cost. *Place on "Deferred" list for re-evaluation in 6 months; notify donor.*

  **III. DESCRIPTION & SILENCE DOCUMENTATION (Upon Acceptance)**
  11. **Basic Description (Finding Aid Minimum):** Creator, Title, Inclusive Dates, Physical Description (extent, format), Abstract (scope, content), Language(s), Access Restrictions.
  12. **Mandatory "Silence Note":** Add field to finding aid. **Assign ONE primary type per collection/series.** Use standard phrases:
      *   **Absence: Never Recorded:** "This collection documents [Creator's Perspective]. Perspectives of [Affected Group, e.g., tenants, congregants] were not systematically recorded by the creator."
      *   **Silence: Destroyed/Lost:** "Gaps exist within this material. Evidence suggests records concerning [Specific Topic/Group] were created but are now missing/destroyed (Evidence: [e.g., reference in correspondence, gap in sequence numbers])."
      *   **Silence: Survives Elsewhere:** "Related records documenting [Specific Perspective/Topic] from this period may exist but are not held by this archive. Potential holders: [e.g., specific community group, other repository]."
      *   **Silence: Inaccessible Here:** "This material is in [Language]. The archive cannot currently provide translation/transcription. Full understanding requires language proficiency." OR "Some content is on obsolete formats (e.g., audio cassettes) requiring digitization for access."
      *   **Silence: Created by Archive:** "The archive declined similar material from [Creator/Type] during [Period] (Ref: [File Number])." OR "This collection was prioritized over contemporaneous offers documenting [Underrepresented Group] due to resource constraints."
  13. **Evidence Requirement for Silence Note:** Must cite specific evidence from the material, donor interview, or archive records. *Judgment Call:* "Likely" conclusions require at least two corroborating indicators (e.g., gap in sequence + mention in correspondence). "Possible" requires one indicator. *Archivist must initial Silence Note & evidence basis.*
  14. **Archive's Own Silences:** Integrate into III.12 ("Silence: Created by Archive"). Reference specific past refusal logs or retention schedules where relevant.

  **IV. BOARD MEMBER PROPOSAL RULING**
  *   **"Actively collecting from under-recorded communities" alone is insufficient and risks replicating asymmetry.** We **will** proactively engage underrepresented communities. However, acceptance requires **Community Partnership**: Material must be offered *with explicit consent/participation* from the community group it documents OR through a formal partnership where description/access terms are co-developed. Acquisition cannot be solely "on our terms." *This is a core value embedded in the Mandatory Referral Trigger (II.5.d) and Silence Documentation (III.12).*

  ---

  **Application of AADP to Test Cases**

  **Case 1: Property Management Company Records (1974-2003)**
  *   **II.5 Mandatory Referral?** YES (Donor condition: Naming reading room after founder - impacts interpretation/equity). **STOP. Refer to CAP.**
      *   *CAP Recommendation Assumed (for procedure demo):* Accept collection ONLY if naming condition is dropped OR reading room is named generically ("Community History Reading Room") with a plaque acknowledging *all* major donors, including this one. Acceptance contingent on this.
  *   **II.6 Fit:** Strong (Documents housing/development, key local business).
  *   **II.7 Survival:** Unique (Unlikely city/courts have full duplicate).
  *   **II.8 Resources:** Medium-High (Ledgers/files standard; photos need care; volume moderate).
  *   **II.9 Representation:** Strengthens Gap (Tenants only seen through landlord lens).
  *   **Appraisal (Post-CAP):** If condition dropped/modified: **ACCEPT.** If condition stands: **DECLINE** (Mandatory Referral result).
  *   **Description/Silence:** **Silence Note (Absence: Never Recorded):** "This collection documents the operations of [Company Name] from a management perspective. The experiences, perspectives, and voices of tenants appear primarily within landlord-generated records such as eviction notices, rent ledgers, and complaint files. Tenant perspectives were not systematically recorded by the creator." *Evidence:* Inspection of content types.
  *   *Why you might dislike:* Accepting with the original condition legitimizes problematic power dynamics. Declining loses significant housing history. CAP referral is essential but adds time.

  **Case 2: Ghanaian Congregation Audio Cassettes (1989-2004)**
  *   **II.5 Mandatory Referral?** YES (Sacred/community knowledge? YES. Consent? NO. Sensitive immigration status? YES. Exacerbates imbalance? YES - acquired unethically. Contested ownership/consent? YES). **STOP. Refer to CAP.**
      *   *CAP Recommendation Assumed:* Do not accession physical/digital copies without explicit congregational consent. Offer to: 1) Return cassettes to current church leadership immediately; 2) If congregation consents *and* designates a liaison, work *with them* to **capture metadata only** (III.10): Document existence, creator (congregation), date range, general content types, language, sensitive topics. Create detailed **Silence Note**.
  *   **Appraisal:** **DECLINE BUT CAPTURE DESCRIPTION/METADATA ONLY** (Per assumed CAP guidance).
  *   **Description/Silence (Metadata Record):**
      *   *Basic Description:* Creator: [Congregation Name] (via departing pastor). Title: Audio recordings of services, counselling, meetings (1989-2004). Extent: ~200 cassettes. Language: [Specific Ghanaian language]. Access: Not held by Municipal Archive.
      *   **Silence Note (Combined Types):** "**Silence: Created by Archive:** The archive declined physical custody of these recordings due to lack of consent from the documented community and ethical concerns regarding sensitive content (immigration status). **Silence: Survives Elsewhere (Potentially):** Original recordings were returned to [Congregation Name] in [Date]. Their current location and accessibility are unknown. **Silence: Inaccessible Here:** Content is in [Language]; the archive lacks translation capacity. **Absence: Never Recorded:** N/A (Content exists but is inaccessible to this archive/institution)." *Evidence:* Donor interview (lack of consent, sensitive topics), language identification, CAP referral outcome log.
  *   *Why you might dislike:* Losing incredibly valuable primary source material documenting a vital community. However, acquiring it without consent is unethical and potentially harmful. The Silence Note is crucial documentation of the gap and the archive's ethical choice.

  **Case 3: City Councillor Papers (40 LF + Endowment)**
  *   **II.5 Mandatory Referral?** NO (No conditions, not sacred, no active trauma/consent issues identified, fits mandate, imbalance is passive not active exacerbation per II.5.d wording).
  *   **II.6 Fit:** Strong (Core government function, key figure).
  *   **II.7 Survival:** Likely Unique/High Value (Personal papers complement official minutes).
  *   **II.8 Resources:** **PROHIBITIVE** (40 LF = ~2-3+ years of *your entire processing capacity*; consumes endowment meant for processing *this*, starving other work).
  *   **II.9 Representation:** Neutral/Strengthens Gap (Fits existing power-structure holdings; does nothing for underrepresented groups beyond *possible* indirect mentions).
  *   **Appraisal:** **DECLINE** (Resource Cost Prohibitive outweighs Strong Fit/Uniqueness. Representation Impact is Neutral, not "Reduces Gap" to justify high cost). *Judgment Call:* The weight given to "Prohibitive" Resource Cost vs. "Strong Fit" is a core judgment. The procedure forces this decision based on capacity reality.
  *   **Description/Silence:** **Silence Note (Created by Archive):** "The archive declined the [Councillor Name] papers ([Date offered]) due to prohibitive resource requirements (estimated 40 linear feet; processing would consume [X] months/years of total capacity). Contemporaneous offers documenting underrepresented communities may also have been deferred or declined during this period due to this resource constraint." *Evidence:* Resource impact calculation, Deferred/Declined log reference.
  *   *Why you WILL dislike:** Turning down a core, high-value collection with funding attached is painful and counter-intuitive. However, accepting it paralyzes the archive for years, preventing *any* progress on addressing silences or processing other material, including potential community-focused collections. The endowment is a siren song masking an opportunity cost the archive cannot afford.

  ---

  **What This Procedure Cannot Do & Future Revisions**

  *   **Cannot Do:**
      *   Eliminate subjectivity or judgment calls (especially II.5 triggers, III.12 evidence weighting, "Significantly" reduces gap in II.10).
      *   Create time or resources you don't have.
      *   Guarantee CAP responsiveness or perfect guidance.
      *   Force communities to engage or trust the archive.
      *   Resolve fundamental contradictions between preservation mandate and ethical responsibilities alone.
      *   Retroactively fix past silences beyond documenting them.
  *   **Steps Most Likely for Revision (3 Years):**
      1.  **II.5 Mandatory Referral Triggers:** Likely need refinement based on real CAP cases. Expect broadening (e.g., adding "materials documenting police interactions with specific communities").
      2.  **II.9 Representation Impact:** May need a more nuanced scale (e.g., High/Medium/Low Reduction) rather than binary "Reduces/Strengthens/Neutral".
      3.  **III.12 Silence Types/Phrasing:** Volunteers may struggle with distinctions. May simplify to 3 core types: **Creator Silence** (Absence/Never Recorded), **Archive Silence** (Declined/Deferred/Unprocessed), **External Silence** (Destroyed/Lost/Survives Elsewhere/Inaccessible). Language will evolve.
      4.  **Resource Cost Thresholds (II.8, II.10):** Need clearer formulas (e.g., % of annual processing budget/hours) as capacity changes.
      5.  **Community Partnership Mechanics (IV):** Requires developing concrete workflows for co-description/access agreements, which this procedure mentions but doesn't detail.

  This procedure forces tough choices grounded in operational reality while systematically confronting power imbalances and silences. It prioritizes ethical boundaries (CAP referral) and transparent documentation over acquisition volume. The test case outcomes, particularly declining the Councillor papers, demonstrate its rigor – and the difficult path ahead.
