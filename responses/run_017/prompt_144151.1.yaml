answer: |-
  Bottom line: The "marginal opacity" critique is fundamentally correct for most real-world Moloch cases—participants aren't tempted defectors but paralyzed cooperators, and the standard prisoner's dilemma (PD) remedies fail because they attack the wrong problem.  

  Here’s why: When you look at an arms race, no general thinks, "If *I alone* build one extra tank, I’ll gain an advantage while the enemy doesn’t notice." They think, "If I *don’t* build up, we risk annihilation, and my unilateral restraint won’t stop their buildup." Same with academics: Your one skipped paper won’t slow the publish-or-perish juggernaut; it just costs you tenure. In attention economies, your tweet’s marginal harm is unmeasurable—but *not* optimizing for engagement means obscurity. The trap isn’t that you’re tempted to defect for selfish gain; it’s that your individual contribution to the collective harm is both negligible and invisible, making meaningful *non*-defection feel futile. You’re not a villain weighing betrayal; you’re a cooperator stuck in a system where your "good" action dissolves into statistical noise.  

  This flips the prescription. Commitment devices? Pointless—what’s the "defection" to commit *against*? Your marginal tweet or paper isn’t a detectable betrayal. Stigmatizing "defectors"? Counterproductive—it demonizes people already straining against structural incentives. ("Why didn’t you sacrifice your career to protest the system?") The real leverage is making the imperceptible *perceptible*:  

  - **Aggregation**: Show academics the *cumulative* burden of low-impact papers (e.g., "Your field published 10,000 redundant papers last year—equivalent to 200 wasted lifetimes").  
  - **Thresholds**: Create "safe" participation limits (e.g., "Labs pledging not to train models above 10^26 FLOPs").  
  - **Feedback**: Make individual impact legible (e.g., "Your social media post contributed X to polarization metrics based on aggregated data").  

  Now, the steelman objection that bites: **"If it’s not a dilemma, why does it *feel* like betrayal? Why do participants describe peers as 'defectors'?"**  

  Fair—this emotional resonance isn’t random. But the feeling arises from *misattribution*. When you’re drowning in an arms race, seeing a rival lab publish a breakthrough feels like a *personal* betrayal because the system forces you into adversarial roles. The "Moloch" framing externalizes blame: it’s easier to resent a competitor’s "defection" than admit you’re both hostages to incentives. The language of betrayal is a cognitive shortcut for systemic helplessness. It’s not that dilemmas don’t exist anywhere, but in large-scale traps, individual "defection" is an illusion—the real defector is the structure itself.  

  And yes, **the "measurement noise" rebuttal**: Isn’t this just a PD where we can’t detect small defections? No—it’s a different game entirely. In PD, defection is *dominant* (you gain whether others cooperate or defect). Under marginal opacity, *cooperation is dominant*... but only if scaled. Your choice isn’t "cooperate/defect" but "throw your drop in the ocean or keep it." The PD model misidentifies the incentive structure, leading to cures that worsen the disease (e.g., shaming individuals in attention economies just fuels performative outrage).  

  **Where it’s half-right**: Small-group cases (e.g., oligopolies) *can* be true PDs—a firm *can* gain by secretly polluting. But for diffuse traps (climate, AI races, academia), marginal opacity dominates. The damage? We waste energy "solving" phantom defections while the real problem—collective paralysis—deepens. The fix isn’t binding promises; it’s building systems where micro-actions become visible macro-change.  

  *PS: Tell the necro’d thread they’ve been useful. This one’s been itching at me too.*
