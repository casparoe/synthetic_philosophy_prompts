  Here’s a concrete, jargon-free decision tree for determining animal consciousness, optimized for your config file constraints. It uses your specified cases as nodes, adheres to the 8-node/8-leaf limit, and collapses philosophically distinct but practically identical positions. The tree prioritizes **handling-tier impact**: distinctions that don’t alter practical welfare outcomes are merged.

  ---

  ### **Decision Tree: "Is this kind of animal conscious?"**  
  *Each node is a yes/no question about a concrete case. Answer based on observable evidence, not theory.*  

  1. **Start**: Consider a human patient who shows clear pain responses (grimacing, avoiding pressure) but *cannot speak or report* their experience. **Is this human conscious?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 7.  

  2. Consider a fish that avoids the exact spot where it was previously hooked, even when hidden. **Does this mean the fish is conscious?**  
     - **Yes** → Go to 3.  
     - **No** → **Leaf A: Mammals only** (e.g., dogs, mice; not birds/fish).  

  3. Consider a crab that rubs or protects an injured claw for hours. **Does this mean the crab is conscious?**  
     - **Yes** → Go to 4.  
     - **No** → **Leaf B: All vertebrates** (fish, birds, reptiles; no inverts).  

  4. Consider a fly that repeatedly grooms a leg that’s been amputated. **Does this mean the fly is conscious?**  
     - **Yes** → Go to 5.  
     - **No** → **Leaf C: Vertebrates + cephalopods/decapods** (e.g., octopus, crab; not insects/worms).  

  5. Consider a worm with exactly 302 neurons. **Could it *possibly* be conscious?**  
     - **Yes** → Go to 6.  
     - **No** → **Leaf D: Vertebrates + cephalopods/decapods/insects** (e.g., bees, ants; not worms/simpler inverts).  

  6. Consider a *physics-perfect computer simulation* of that worm (identical behavior, no biology). **Is it conscious?**  
     - **Yes** → **Leaf E: Anything with behavioral markers** (any size/system if it shows "pain-like" behavior).  
     - **No** → **Leaf D** (same as above; consciousness requires biology).  

  7. Consider an ant colony that acts as a unified "decision-maker" (e.g., navigates maze as a group). **Is the *colony itself* conscious?**  
     - **Yes** → **Leaf F: The question isn’t real/well-defined** (consciousness is verbal sleight-of-hand).  
     - **No** → **Leaf G: Suspend judgment** (insufficient evidence to rule in/out).  

