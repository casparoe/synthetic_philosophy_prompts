prompt: |-
  I've been reading LessWrong and the old Overcoming Bias comment threads since basically forever, and a few of us from the local meetup are hacking on a tiny belief-tracking app (working name: Kinematics) where you don't log verdicts, you drag a slider to record how strongly today's observation pointed at some proposition, and the app pushes that through everything else in your model. I implemented the propagation as Jeffrey conditioning: take the partition {E, not-E} for whatever the slider is about, set the new credence in E to the slider value, hold the conditional credences P(H|E) and P(H|not-E) fixed, done. A friend of mine who actually does stats says this is broken in a way I should care about, and I've now argued about it twice without getting what her objection is.

  Here's what I think I know. Probability kinematics is supposed to be the generalization of Bayesian conditioning to the case where your evidence is uncertain: instead of becoming certain of E you move to some intermediate credence q, and rigidity of the conditional credences given E and not-E is what pins down the rest. And I've seen it justified as a minimal-change rule — of all the distributions that put credence q on E, this is the one closest to your old credence function, so it's the conservative choice, the one that doesn't sneak in information you didn't recieve. That sounds exactly like what I want from a general-purpose updating engine, so I've been treating "my credence in some proposition moved to q" as the only input the rule needs, regardless of what caused the move. I also batch a day's slider moves and apply them in whatever order they come out of the log file, because I was under the impression that Bayesian updating is commutative and the final state shouldn't depend on the order you learned things in. (Somewhere in the back of my head there's a half-memory of someone on the forums saying Jeffrey himself later backed away from the "updating on uncertain evidence" framing and treated it as just a way of describing a change in credence — I can't reconstruct the argument and I'm not sure it matters for the app, but flagging it in case it's the crux.)

  The case she keeps raising is this. Suppose a user logs a slider on "home rapid test read positive," but they're squinting at the cassette in bad bathroom light and are only 70% sure of what the display actually said. To me that is textbook uncertain evidence: set credence in E = "the test read positive" to 0.7, keep P(infected | positive read) and P(infected | negative read) where they were, propagate. She says that in exactly this kind of case the rigidities are the thing that fails, and that the correct move is to condition on something you *are* certain of — what the display looked like — and put the unreliability of your eyes into the likelihood rather than pretending the uncertainty is about the world-level proposition; and that the same goes, even more obviously, when the news is about the test rather than the patient, e.g. a preprint revising the sensitivity estimate downward, where P(infected | positive read) is precisely the quantity that moved and holding it fixed can't be right. I sort of follow, but then she said something about the answer depending on how finely you carve the partition, and about Jeffrey updates not commuting so that my batching silently picks an order, and I lost the thread. I also want to know what to do with the case I think my app handles fine: a user stares at their model, decides on reflection that their prior on the local base rate was overconfident, and drags the base-rate slider with no new observation at all.

  Could you walk me through it in these sections, roughly:

  - "The mistake in how I'm framing this" — ~300 words, naming the false presupposition before anything else
  - "What rigidity actually requires, and how to check for it" — ~400 words
  - "My three cases, worked" — ~600 words: the bad-light test reading, the preprint that revises the test's sensitivity, and the pure-reflection base-rate move
  - "So what is probability kinematics actually for?" — ~250 words
  - "Where I still have to use judgment" — ~150 words
reasoning: |-
  Okay, let me start by unpacking this user's problem. They've built a belief-tracking app using Jeffrey conditioning, where users adjust sliders to update credences based on observations. Their friend, who works in stats, says this approach is flawed, especially in cases like uncertain test readings or sensitivity updates. The user is confused about the objections and wants clarity on the underlying principles.

  First, I need to identify the core mistake. The user treats any credence change as uncertain evidence, applying Jeffrey conditioning universally. But Jeffrey conditioning assumes that conditional probabilities remain rigid, which isn't always true. The key misunderstanding is that the method of updating should depend on why the credence changed, not just the change itself. For example, if the update comes from unreliable perception versus new data about test accuracy, rigidity might not hold.

  Next, rigidity requires that learning whether E occurred doesn't change your beliefs given E. In the rapid test case, squinting in bad light means the user isn't certain about the display. Rigidity fails here because the observation (what they saw) affects both the likelihood of E and the conditionals. Instead, they should condition on the visual experience itself, updating P(infected) based on that sensory input.

  For the three cases: 
  1. Bad light test reading: The slider reflects uncertainty about the display. Jeffrey conditioning is wrong here because P(infected | positive) might not be rigid. Instead, model the visual observation as evidence.
  2. Preprint revising sensitivity: Here, the sensitivity estimate changes, so P(infected | positive) itself updates. Jeffrey conditioning forces rigidity where it shouldn't apply. The solution is to directly adjust the conditionals.
  3. Base-rate reflection: No new evidence; the user revises their prior. Jeffrey conditioning works here because it's a pure credence shift without changing conditionals.

  The user also batches updates, assuming commutativity. But Jeffrey updates don't commute if partitions differ, so order matters. Batching without order can lead to inconsistencies.

  Probability kinematics is best for partitioning uncertainty where conditionals stay fixed, like a machine reporting probabilities. Otherwise, standard conditioning on certain evidence is safer.

  Finally, judgment is needed to decide why credences change. Is it new uncertain evidence, revised world knowledge, or something else? The app should perhaps log reasons behind slider moves to guide the update method.
answer: |-
  ### The Mistake in How I'm Framing This  
  Your core error is treating *any shift in credence for proposition E* as "uncertain evidence about E" requiring Jeffrey conditioning. This presupposes that **the *reason* for the credence shift is irrelevant**—whether it stems from noisy sensory input, reflection, or learning new statistical relationships. But Jeffrey conditioning isn't a universal "credence shift" rule; it's a specific update for *one type* of scenario: when you directly experience ambiguous or uncertain sensory/perceptual data that *bears directly on E*, while your *causal model* (the conditional probabilities linking E to other hypotheses) remains intact. Your app treats all slider moves identically, assuming rigidity (fixed conditionals) by default. This ignores that **credence shifts often arise from changes to the model itself** (e.g., learning new dependencies between variables), not uncertain observations about a fixed model. Rigidity fails catastrophically in these cases, making your propagation rule systematically wrong when the shift isn't sensory noise.

  ---

  ### What Rigidity Actually Requires, and How to Check for It  
  **Rigidity** means that if you *were* to learn E or ¬E with certainty, your conditional credences for other hypotheses given E (or ¬E) would *not change*. Formally, rigidity holds iff:  
  - \( P_{\text{new}}(H \mid E) = P_{\text{old}}(H \mid E) \)  
  - \( P_{\text{new}}(H \mid \neg E) = P_{\text{old}}(H \mid \neg E) \)  

  **When does rigidity hold?** Only if the *source of uncertainty* is purely about whether E occurred, *and* E screens off H from the observation process. For example:  
  - You hear a muffled weather report: "rain" or "no rain?" Rigidity for {Rain, ¬Rain} may hold because the fuzziness affects your certainty about the *report*, not how rain relates to other variables (e.g., grass being wet).  
  - You measure a voltage with a noisy instrument. Rigidity for {Voltage > 5V, ≤ 5V} holds if the instrument’s noise is independent of how voltage affects downstream circuits.  

  **When does rigidity fail?** When the credence shift arises from:  
  1. **Changes to causal/likelihood relationships** (e.g., learning the test is less reliable).  
  2. **Correlated evidence** affecting multiple partitions.  
  3. **Non-sensory updates** (e.g., logical reflection).  

  **How to check:** Ask: "If I magically learned E was true/false, would my beliefs about H *given E* stay the same?" If yes, rigidity holds. If the shift *targets* P(H|E) itself (e.g., revising test sensitivity), rigidity fails.  

  ---

  ### My Three Cases, Worked  
  **Case 1: Bad-Light Test Reading**  
  - **Your approach:** Set P(Test Positive) = 0.7, hold P(Infected | Test Positive) and P(Infected | Test Negative) fixed.  
  - **Why it’s wrong:** The uncertainty isn’t about the *world-state* (test result), but about your *sensory experience*. Rigidity fails because squinting in bad light means your observation ("blurry stripe looks positive") affects *both* P(Test Positive) *and* the reliability of the test itself under poor conditions (e.g., faint lines might be false positives).  
  - **Correct approach:** Condition on your sensory observation S = "I saw what looked like a positive line." Define:  
    - P(S | Test Positive) = 0.9 (good sensitivity in ideal light)  
    - P(S | Test Negative) = 0.1 (false positive rate in ideal light)  
    - Adjust these for poor light (e.g., P(S | Test Positive) drops to 0.8). Then update P(Infected) via standard conditioning:  
    \[
    P_{\text{new}}(\text{Infected}) = P_{\text{old}}(\text{Infected} \mid S) \propto P(S \mid \text{Infected}) \cdot P_{\text{old}}(\text{Infected})
    \]  
    Here, P(S | Infected) depends on test characteristics and observation noise.  

  **Case 2: Preprint Revising Test Sensitivity**  
  - **Your approach:** User drags a slider for P(Infected | Test Positive) to a lower value. You treat this as "uncertain evidence" about Infected, holding other conditionals fixed—nonsense.  
  - **Why it’s wrong:** This isn’t evidence at all; it’s direct model revision. Jeffrey conditioning *forces* rigidity when it’s explicitly violated—the whole point is that P(Infected | Test Positive) *changed*.  
  - **Correct approach:** Update the likelihoods directly. If the preprint shows sensitivity dropped, redefine:  
    \[
    P_{\text{new}}(\text{Positive} \mid \text{Infected}) = \text{lower value}
    \]  
    Recompute joint probabilities from scratch (or use Bayesian networks). No "slider for P(Infected | Test Positive)"—adjust the *parameters* of your model.  

  **Case 3: Pure-Reflection Base-Rate Move**  
  - **Your approach:** User drags P(Local Base Rate High) to q. Jeffrey conditioning propagates by holding P(H | Base Rate High) and P(H | Base Rate Low) fixed.  
  - **Why this works:** Reflection alone doesn’t alter how hypotheses depend on the base rate. Rigidity likely holds (e.g., if you learned the base rate was high, your beliefs about H given that fact wouldn’t change). This is the "credence shift as minimal update" case Jeffrey intended.  
  - **Caveat:** Ensure no new evidence sneaks in. If reflection incorporates external info (e.g., recalling a study), model that explicitly.  

  **Batching/Order Dependence:**  
  Jeffrey updates commute *only* if all updates use the *same partition* {E, ¬E}. If you batch moves for different partitions (e.g., update E then H, vs. H then E), order matters. Your app’s arbitrary log-file order introduces silent errors.  

  ---

  ### So What Is Probability Kinematics Actually For?  
  Probability kinematics (Jeffrey conditioning) solves one problem: **updating on uncertain, partition-specific sensory evidence without changing causal relationships**. Classic examples:  
  - A dimly seen card is *probably* red—update {Red, Black} partition while keeping P(Spade | Red) fixed.  
  - A geiger counter reads 10k CPM, but you’re unsure if it means "high radiation" (partition {High, Low}), and your model of how radiation affects symptoms is unchanged.  
  It’s **not** for:  
  - General belief revision (e.g., "I now think P(H|E) is wrong").  
  - Updates affecting multiple partitions.  
  - Pure reflection (though it *can* apply there, as in Case 3).  
  Jeffrey later emphasized it as a *minimal* update given a constraint (P(E) = q), not necessarily "evidence." But misuse persists. In your app, kinematics is only valid when sliders represent noisy *observations* of E, not model adjustments.  

  ---

  ### Where I Still Have to Use Judgment  
  **You must classify why the credence changed:**  
  1. **Sensory uncertainty about E?** → Use kinematics *if* rigidity holds (e.g., "I’m 70% sure I saw the test say positive").  
  2. **New statistical/model information?** → Directly update conditionals or joint probabilities (e.g., "The preprint says sensitivity is 80%, not 90%").  
  3. **Pure reflection?** → Kinematics *may* work (e.g., "On second thought, P(Base Rate High) should be 0.6"), but validate rigidity.  
  **Implementation fixes:**  
  - Tag slider moves with "source" (observation vs. model revision).  
  - For sensory updates, record the *observation* (e.g., "display looked positive"), not just P(E).  
  - Never batch updates over different partitions.  
  **No escape hatch:** Some cases blur the line (e.g., "I recall a study undermining the test"). Judgment—or explicit modeling of memory reliability—is unavoidable.  

  ---
  **Key Takeaway:** Your app conflates *observing uncertain evidence* with *changing your mind*. Kinematics handles the first; direct model surgery handles the second. Fix this, and your propagation engine becomes robust.
