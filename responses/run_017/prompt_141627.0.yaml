prompt: |-
  Novelist here, and ive written myself into a hole I dont really have the vocabulary for.

  My current book is set in an invented federation — bits of the US, Germany, Switzerland and the EU glued together and renamed — and the climax is a constitutional standoff. A regional premier refuses to authorise a high-voltage transmission line that would carry renewable power out of her region into three others, and she defends herself with the subsidiarity line: the EU treaties say (I think its Article 10 of the Treaty on European Union) that decisions shall be taken as openly and as closely as possible to the citizen, so her region decides. Her opponents point out that the whole purpose of the line is that its benefits and costs spill across borders, that her region happens to be the only place that can physically block it, and that "the people affected" include several million people who will never vote in her region. Everyone in the room is using the same sentence and meaning something different, and I cant tell whether any of them is saying something true. Ive met the same sentence from a Swiss cousin defending cantonal school curricula, from American governors during covid, and from an MEP on the radio who used it to argue both for and against a farm subsidy in the same interview.

  So what I want is a menu, not an essay. As far as I can tell the sentence has three moving parts — how you measure closeness, who counts as the people affected, and whether "level" means only the levels that already exist or any jurisdiction you could draw — and different precisifications give very different claims. Please lay out the distinct precise things someone could be asserting with it, from the near-tautological to the wild, and for each: whether its a platitude anyone would accept, a substantive but contestable claim, or something probably false or incoherent; whether it actually hands my premier the veto she wants or quietly hands the argument to the federation; and what would have to be true in my fictional federation for that reading to get off the ground.

  The wrinkle that might actually be new: in my invented federation the lower units have something no real one does. Alongside the ordinary territorial rule, any resident can register under another region's legal code for a specific field — family law, education, environmental standards — and that region's rules then follow the person rather than the place theyre standing in. A third of the population has done this. I invented it for plot reasons and only later realised it might gut the slogan, or rescue it, depending on what the slogan means: if "close to the citizen" is about metres and self-rule over a shared place, portable registration looks like it destroys the thing; if its about fit between a person's values and the rules that bind them, portable registration looks like the slogan taken seriously for the first time. I genuinely dont know which.

  Give me the menu as a table with these columns:

  - reading — a short name for the reading
  - precise_claim — the claim spelled out tightly enough that a constitutional court could apply it, including what it says about each of the three moving parts above
  - verdict — one of: tautology / platitude / substantive-but-contested / false-or-incoherent
  - grid_veto — yes / no / only-if, plus the extra premise my premier would need for it to deliver her conclusion
  - portable_jurisdiction — serves-it / defeats-it / orthogonal, with one clause saying why
  - stage_direction — the single line of dialogue, detail or tell in the scene that would tip an attentive reader that this is the reading the premier means

  Under the table, add two or three sentences on which reading I should put in her mouth if I want her to be neither a fool nor obviously right.
reasoning: |-
  Okay, the user is a novelist who's created a fictional federation and needs help with a constitutional standoff centered around the principle of subsidiarity. They want a structured analysis of different interpretations of "decisions should be taken as closely as possible to the citizen," especially how these interpretations affect their plot about a regional premier blocking a power transmission line.

  First, I need to break down the three key variables: how "closeness" is measured, who counts as "affected people," and what "level" means. The user mentioned real-world examples like Swiss cantons and US governors using similar arguments, so I should ensure the interpretations reflect these nuances.

  The portable jurisdiction system adds complexity. Residents can choose which region's laws apply to them in specific areas. This could either support or undermine subsidiarity, depending on the interpretation. For example, if closeness is about geographical proximity, portable jurisdiction might defeat the principle. But if it's about aligning laws with personal values, it could strengthen it.

  The user wants a menu in table form. I'll structure each reading with the required columns: reading name, precise claim, verdict, whether it grants veto (grid_veto), impact of portable jurisdiction, and a stage direction hint. The verdicts should range from tautological to contested to false, showing a spectrum of plausibility.

  For the premier's argument to be credible, she shouldn't be obviously wrong or right. I should identify interpretations that are substantive but contested. For instance, the "Affected Interests" reading is strong because it considers all affected parties, making her veto claim debatable but not automatic. The "Choice Proxy" reading leverages the portable system, which could make her stance innovative yet controversial.

  The portable jurisdiction system needs careful handling. In readings where closeness is about values, it serves the principle; where it's about territory, it defeats it. Highlighting this dichotomy will show the depth of the conflict.

  Finally, under the table, I'll suggest which readings make her neither foolish nor clearly correct. The "Affected Interests" and "Choice Proxy" readings are ideal because they involve reasonable but debatable premises. Including a stage direction, like her emphasizing "our citizens" or mentioning portable registrations, will subtly signal her interpretation to readers.

  Ensuring the analysis helps the user navigate the standoff realistically without prescribing an outcome is key. The table should provide clear options that fit the fictional federation's unique elements while reflecting real-world subsidiarity debates.
answer: |-
  Here's the menu of interpretations for the subsidiarity principle in your constitutional standoff, formatted as requested:

  | reading                 | precise_claim                                                                                                                                                                                                 | verdict                  | grid_veto                  | portable_jurisdiction                      | stage_direction                                             |
  | :---------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------- | :------------------------- | :----------------------------------------- | :---------------------------------------------------------- |
  | **Administrative Proximity** | Decisions must be executed by the smallest *existing* administrative unit technically capable of handling the task. "Affected people" are those within the unit's borders. "Level" means existing jurisdictions only. | platitude                | no                         | orthogonal (focuses on execution, not rule-making) | Premier slams hand on *physical map* of her region.         |
  | **Territorial Sovereignty** | The unit where physical impacts occur has exclusive jurisdiction. "Affected people" = residents within the unit's borders. "Closeness" = geographical proximity. "Level" = existing units only.                | substantive-but-contested | yes (asserts exclusive right) | defeats-it (undermines territorial exclusivity) | Premier emphasizes "our soil, our decision."               |
  | **Affected Interests**  | Decisions must be made at a level encompassing *all* significantly affected parties. "Affected people" defined by material impact (e.g., power consumers, landowners). "Level" may require new or broader jurisdictions. | substantive-but-contested | only-if (proof that her region uniquely bears costs/impacts outweighing others' benefits) | orthogonal (focuses on impact geography, not choice) | Opponent points at map showing *multiple regions* in darkness. |
  | **Democratic Identity** | The unit whose collective identity/political community is most central to the issue decides. "Affected people" = the demos of that unit. "Closeness" = cultural/political affinity. "Level" = existing units. | substantive-but-contested | only-if (proof the line threatens regional identity/core competence) | serves-it (reinforces chosen community bonds) | Premier invokes her region's "unique energy heritage."     |
  | **Choice Proxy**        | "Closeness" is achieved when individuals choose the rule-set binding them. "Level" is defined by the jurisdiction offering the chosen rules. "Affected people" = those subject to the rules.                   | substantive-but-contested | only-if (majority in her region *chose* her environmental code *and* the line violates it *and* federation rules allow code veto) | **serves-it** (is the core mechanism for closeness) | Premier cites "% registered under *our* environmental code." |
  | **Pure Efficiency**     | Decisions should be made at the level minimizing total transaction/implementation costs. "Affected people" irrelevant. "Closeness" irrelevant. "Level" is purely functional.                                  | substantive-but-contested | no (federation likely argues it's cheaper centrally) | orthogonal (efficiency logic overrides choice) | Technocrat quotes cost estimates for regional vs federal.   |
  | **Absolute Localism**   | The smallest possible unit *always* has priority, regardless of spillovers. "Affected people" = residents of that unit only. "Level" = smallest existing unit, even if incapable.                          | false-or-incoherent      | yes (by definition)        | defeats-it (highlights interdependence)    | Premier shouts "Not one inch, no matter the cost elsewhere!" |

  **Which reading for the Premier (Neither Fool nor Obviously Right)?**

  1.  **Affected Interests:** This makes her argument *serious* but *contestable*. She must credibly argue that the negative impacts (e.g., environmental, social, economic) disproportionately burden *her specific region's residents* compared to the benefits flowing to others, justifying her veto despite spillovers. It forces the conflict onto empirical ground about costs/benefits, not just principle. Stage Direction: She meticulously details *local* impacts – specific villages displaced, unique habitats destroyed, economic burden on regional taxpayers.
  2.  **Choice Proxy:** This leverages your unique worldbuilding brilliantly. It transforms portable jurisdiction from a plot device into the *core* of her constitutional argument. She argues that "closeness" is fulfilled by residents *choosing* her region's environmental code, and building the line violates that code. Her veto upholds the subsidiarity principle *as realized through choice*. This is innovative, substantive, and deeply tied to your federation's structure, making her neither foolish nor obviously right – the federation would counter that energy transmission is inherently interstate infrastructure overriding local choice regimes. Stage Direction: She holds up a tablet showing high registration rates for *her* environmental code in the *specific corridor* of the proposed line.

  **Why these work for the Premier:**

  *   **Affected Interests:** Grounds her stance in a widely recognized (though debated) aspect of subsidiarity/federalism – managing negative externalities. Her position has weight if local burdens are severe and demonstrable.
  *   **Choice Proxy:** Makes her the *true believer* in your federation's unique system. She interprets subsidiarity *through* the portable jurisdiction lens, giving her a principled, innovative defense rooted in the world's specific rules. It feels authentic to the setting and elevates your invention beyond plot convenience to constitutional cornerstone.
  *   **Both avoid:** Absolute Localism (foolish/selfish), Administrative Proximity (too weak, grants no veto), Pure Efficiency (undermines principle). They force the conflict onto the *interpretation* of the principle and the *facts* of the case, creating genuine dramatic tension.
