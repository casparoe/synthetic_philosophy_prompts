prompt: |-
  i'm a TA for an historical methods seminar (honors section, ~20 papers a week) and i'm the one who has to decide whether a paper is being presentist — right now i basically go on vibes and then can't defend the comment when a student pushes back in office hours. can you turn this into a real procedure i can run while grading, something more than the old whig-history complaint?

  the stuff i keep getting stuck on, and want the procedure to actually handle instead of hand-wave:

  - vocabulary drag. when a paper calls a 12th-century queen a survivor of domestic violence, or a 19th-century senator a white supremacist, the present-day term drags a whole theory in with it. is there a usable test — something like restating the claim in words available to people at the time and seeing what gets lost — for when the drag is doing real work and when it's just a label?
  - explaining vs. evaluating. the line i keep hearing is that present standards are illegitimate for explaining why people acted but fine for judging whether they acted well. that asymmetry feels too convenient. where does it actually hold up?
  - silence laundering. if the category didn't exist yet, the archive is silent about it, and it is really easy to turn that silence into evidence about the thing rather than evidence about the category. how do i catch a student doing that?
  - reciprocity. if you judge past actors by standards they didn't accept, you should be fine with some future historian judging you by standards you don't accept yet. does anything real follow from that, or is it just a rhetorical move?

  what i want: the questions in order, what counts as a good enough answer to each, where the procedure stops with a clear yes/no, and where it has to hand the call back to me because it's a values question rather than a factual one. it has to run in about five minutes a paper and be explainable to a sophmore without assigning them theory, and please be honest about which steps are really just my judgment wearing a checklist as a costume.

  then run it on three papers from this week: (a) one arguing that a colonial governor's campaign in the 1780s amounts to genocide; (b) one describing an 18th-century food rioter as engaging in redistributive justice — i liked this one, so tell me if the procedure kills it anyway; (c) one that refuses to use any moral language about the past at all on the grounds that we weren't there. for each, give me the comment i'd actually write in the margin. american english, and please don't soften the result on (b) if the procedure says it's presentist.
reasoning: |-
  Okay, let's tackle the TA's problem. They need a clear, step-by-step procedure to evaluate presentism in student papers. The key issues they mentioned are vocabulary drag, explaining vs. evaluating, silence laundering, and reciprocity. 

  First, vocabulary drag. When a modern term is used, like calling a medieval queen a "survivor of domestic violence," we need to test if the term brings in modern concepts that didn't exist then. The restatement test makes sense: can the claim be rephrased using words available at the time without losing meaning? If not, there's probably a problem. For example, "white supremacist" in the 19th century—while racism existed, the term carries specific modern ideologies. If the student can't rephrase it using period-appropriate language without losing the core argument, it's likely presentist.

  Next, explaining vs. evaluating. The rule is that present standards shouldn't explain historical actions but can judge them. But that asymmetry needs scrutiny. The procedure should distinguish between using modern values for moral evaluation versus attributing motives. For instance, judging a past figure as morally wrong by today's standards is okay if framed as evaluation, not as their actual motivation. The test is whether the judgment is explicit about its modern standpoint and doesn't confuse evaluation with historical explanation.

  Silence laundering is tricky. When students use the absence of evidence (like no records of a concept) as evidence for that concept's non-existence or irrelevance, that's a problem. The key question is whether they're conflating absence with evidence. For example, if a paper argues that because there's no record of LGBTQ identities in a period, they didn't exist, that's laundering silence. The test is to check if the student acknowledges the archive's limitations and doesn't treat silence as proof.

  Reciprocity is more philosophical. If students apply modern standards to the past, they should accept future judgments on us. But is this substantive or just rhetorical? In practice, it might highlight the contingency of moral judgments. The procedure should ask if the student addresses this reciprocity. If not, it's not necessarily a flaw but could indicate unexamined presentism if they dismiss past perspectives without reflection.

  For the three papers: 

  Paper (a) on genocide: The term "genocide" is modern, coined in 1944. Applying it to 1780s events requires testing if the actions meet the modern definition without anachronism. The student needs to show intentional destruction of a group and address if contemporary terms like "extermination" were used. If they do, it might pass; otherwise, it's presentist. Comment should focus on vocabulary drag and anachronism.

  Paper (b) on redistributive justice: The term is modern, but concepts like fair distribution existed. Restating in 18th-century terms like "moral economy" or "just price" might work. If the student ties the rioter's actions to contemporary beliefs about fairness, it's valid. The procedure might allow it if the underlying concept is period-appropriate, even if the label isn't. Comment would affirm but suggest using historical terminology.

  Paper (c) avoiding moral language: This avoids presentism but might overlook moral frameworks of the time. The student should engage with historical actors' ethical perspectives. Comment would encourage analyzing contemporary morals instead of imposing modern ones.

  The procedure needs to be efficient, taking about 5 minutes per paper. Steps should be sequential, with clear yes/no where possible, and flag areas needing judgment. For example, vocabulary drag and silence laundering have more objective tests, while explaining vs. evaluating and reciprocity involve more nuance. The TA will still need to use judgment, but the checklist structures the decision-making.
answer: |-
  Here's a procedural checklist for detecting presentism, designed for speed and defensibility. It prioritizes **observable textual features** over vibes, flags judgment calls transparently, and includes time-saving shortcuts. Crucially, it distinguishes between **automatic fails**, **probable issues**, and **TA judgment zones**.

  **The Presentism Detection Protocol (5-min version)**

  1.  **Vocabulary Drag Test (60 sec):**
      *   *Question:* Does the paper use a **politically/ethically charged modern term** (e.g., "genocide," "white supremacist," "domestic violence survivor," "redistributive justice," "terrorist," "trauma") to label a past actor/event?
      *   *If YES:* **Restate the core claim using only concepts and vocabulary demonstrably available to the actors/contemporaries.** Can the claim stand without the modern term?
          *   *Passes:* The restated claim retains the essential analytical point using period language/concepts (e.g., "The governor sought the complete destruction of the X people" instead of "genocide"; "The rioter believed taking grain enforced a fair price" instead of "redistributive justice"). *Comment: "Term is modern but concept is supported by contemporary evidence/understanding."*
          *   *Fails:* The restated claim is significantly weaker, loses its moral/political force, or requires concepts absent at the time. The modern term is *doing the analytical work*. *Comment: "Significant vocabulary drag. The term '[MODERN TERM]' imports concepts ([LIST IMPLICIT CONCEPTS, e.g., systematic racial theory, modern psychological frameworks, specific legal definitions]) not demonstrably operative here. Restate the core argument using concepts/frameworks available to [HISTORICAL ACTOR/CONTEMPORARIES]."*
      *   *If NO:* Proceed.

  2.  **Explaining vs. Evaluating Check (90 sec):**
      *   *Question:* Does the paper **attribute motivation or causality** primarily to forces/values that would be unrecognizable or nonsensical to the historical actor (e.g., "He did X because he was a white supremacist" vs. "He did X to uphold the racial hierarchy he believed ordained by God/science")?
      *   *Key Test:* Look for verbs like "because," "motivated by," "driven by," "caused by," "since," "due to." Is the explanation rooted in the actor's *own* world, language, and demonstrable concerns?
          *   *Passes:* Explanations use frameworks/values/language the actor *could* have articulated or that are demonstrably present in contemporary discourse (e.g., divine right, honour, mercantilism, specific religious doctrine, scientific racism *as understood then*).
          *   *Fails:* Explanations rely on modern psychological diagnoses, systemic theories (Marxism, feminism, critical race theory) *as applied anachronistically*, or imply actors were consciously defying future moral standards. *Comment: "Anachronistic explanation. Attributing motivation/causality to [MODERN CONCEPT] risks misrepresenting [ACTOR]'s worldview. Ground explanation in frameworks demonstrably present in their context (e.g., contemporary political theory, religious beliefs, economic structures of the time)."*
      *   *Judgment Zone:* **Moral Evaluation.** Does the paper make a *modern* moral judgment *explicitly labeled as such*? (e.g., "By our standards today, this policy was genocidal/racist/unjust")? *This is generally acceptable IF:*
          *   It's clearly marked as a *modern* perspective.
          *   It doesn't *substitute* for historical explanation (Step 2 passes).
          *   It doesn't rely *solely* on the dragged vocabulary (Step 1 passed or addressed). *No automatic fail, but flag if clumsy or overshadows historical understanding: "Modern evaluation noted. Ensure it complements, rather than replaces, analysis grounded in the historical context."*

  3.  **Silence Laundering Trap (60 sec):**
      *   *Question:* Does the paper use the **absence of evidence** for a modern concept (e.g., no contemporary discussion of "sexual orientation," "gender identity," "systemic racism," "PTSD") as **positive evidence** *for* something about the past (e.g., "Since they didn't discuss it, it didn't exist/affect them/wasn't a problem")?
      *   *Key Test:* Look for phrases like: "The lack of mention proves...", "The silence shows...", "Absent any concept of X, we know Y...", "No evidence of X, therefore Z." Is the paper *treating the absence of the modern category as evidence about the historical reality itself*?
          *   *Passes:* Discusses silence as revealing *about the archive* or *contemporary priorities/categories* (e.g., "The absence of discussion in official records suggests elites did not consider this a political issue," "The lack of a specific medical term for this condition shaped how sufferers experienced it").
          *   *Fails:* Conflates the absence of the *category* with the absence of the *phenomenon* or its *significance* (e.g., "Without the term 'domestic violence,' women didn't suffer from it," "No concept of 'genocide,' so they couldn't have intended it"). *Comment: "Silence laundering. The absence of the modern category '[MODERN CATEGORY]' in the sources cannot be read as evidence that the underlying phenomena didn't exist or weren't significant, only that contemporaries framed/understood/recorded them differently. Discuss *what the silence reveals about the archive or contemporary frameworks*."*
          *   *Judgment Zone:* Arguments based *positively* on the *presence* of period-appropriate categories/concepts are generally safe (e.g., using "melancholy" to discuss 18th-c mental distress).

  4.  **Reciprocity Sanity Check (30 sec):**
      *   *Question:* Does the paper's argument **implicitly or explicitly claim immunity** from future historical judgment based on its *own* standards? (Rarely stated, often an underlying attitude).
      *   *Test:* If the paper makes strong modern moral condemnations (especially if Step 1 is borderline), ask: "Could this *same logic* be used by a future historian to condemn *us* for something we currently consider normal/acceptable using a future moral standard?" If yes, does the paper acknowledge this contingency?
          *   *Passes:* Acknowledges historical contingency of morality implicitly (by focusing on context) or explicitly. Doesn't claim its judgment is timeless.
          *   *Fails/Flag:* Demonstrates a tone of absolute, timeless condemnation without contextual awareness, implying the author's standards are objectively correct for all time. *Comment: "Consider the reciprocity of historical judgment. Applying our standards to the past implicitly accepts that future historians may apply *their* standards to us. Does this affect the weight or presentation of your moral evaluation? Strive for awareness of historical contingency."* **This step is primarily a *rhetorical move* for feedback. It rarely makes an argument *factually* wrong, but flags potential unreflective presentism in tone/presentation. Judgment Call.**

  **Where Judgment is Unavoidable (The "Checklist Costume"):**
  *   Step 1: Deciding if the "restated claim" retains sufficient force/is valid. (Is "complete destruction" really the same analytical point as "genocide"?)
  *   Step 2: Determining if an explanation is *sufficiently* grounded in period frameworks vs. smuggling in modern ones subtly.
  *   Step 4: Assessing the tone/degree of unreflective condemnation.
  *   **The checklist forces you to articulate *why* you feel the vibe, pointing to specific textual features (vocabulary, explanation structure, use of silence, tone). This makes your feedback defensible.**

  ---

  **Application to Example Papers:**

  **(a) Colonial Governor & Genocide (1780s)**
  1.  **Vocab Drag:** YES ("genocide"). Restate: "The governor systematically sought the extermination of Tribe X." *Does it lose force?* Maybe slightly ("extermination" was a strong term), but arguably captures core action. **Borderline Pass/Judgment Call.** (Modern legal definition/intent standards might be subtly dragged in).
  2.  **Explain vs. Evaluate:** Check explanations. Does it say *why* he did it? If attributed *only* to "genocidal intent" or modern racism, FAIL. If explained via land hunger, frontier paranoia, contemporary racial theories (e.g., "savagery"), religious zeal, rival colonial powers, PASS.
  3.  **Silence Laundering:** Unlikely focus here. PASS.
  4.  **Reciprocity:** If it condemns absolutely without context, FLAG.
      *   **Likely Comment:** "Borderline vocabulary drag with 'genocide'. While the *actions* described (extermination campaign) may align with the modern definition, ensure your *explanations* for the governor's motivations and the campaign's logic are firmly rooted in 18th-century frameworks (e.g., contemporary racial ideologies, land acquisition strategies, imperial rivalries) rather than relying solely on the modern label. Clarify if your moral condemnation is a modern perspective." **(Requires TA judgment on explanation grounding)**

  **(b) 18th-Century Food Riot & Redistributive Justice**
  1.  **Vocab Drag:** YES ("redistributive justice"). Restate: "The rioter seized grain to enforce a belief in a 'just price' and the moral obligation of the wealthy to ensure community subsistence during dearth." *Does it lose force?* Not significantly. The core concept of enforcing community norms of fairness in essential goods is well-documented (E.P. Thompson's "Moral Economy"). **PASS.**
  2.  **Explain vs. Evaluate:** Check explanations. Does it explain the rioter's actions via their belief in the "moral economy," customary rights, popular notions of justice, fear of starvation? PASS. If it frames it *primarily* as proto-socialism or challenging capitalism, FAIL.
  3.  **Silence Laundering:** Unlikely. PASS.
  4.  **Reciprocity:** Unlikely issue if contextualized. PASS.
      *   **Comment:** "While 'redistributive justice' is a modern term, your restatement using the 18th-century concept of the 'moral economy'/'just price' (Thompson) is valid and well-supported here. Good job grounding the actors' motivations in their contemporary understanding of economic fairness and community obligation." **(Procedure allows it if restatement works)**

  **(c) No Moral Language ("We Weren't There")**
  1.  **Vocab Drag:** NO (avoids modern terms). PASS.
  2.  **Explain vs. Evaluate:** Focuses solely on explanation? PASS.
  3.  **Silence Laundering:** Unlikely. PASS.
  4.  **Reciprocity:** Explicitly avoids judgment. PASS.
      *   **Comment:** "You successfully avoid anachronistic vocabulary and judgments. However, consider that historical actors *did* operate within moral frameworks (e.g., honour, religious duty, civic virtue, concepts of tyranny/justice). Your analysis could be enriched by exploring *their* contemporary moral language and ethical reasoning for their actions, rather than imposing modern judgments or avoiding morality altogether. What did 'right' and 'wrong' mean *to them* in this context?"

  This procedure gives you concrete textual features to point to ("You used term X, which drags in concept Y," "Your explanation relies on Z, which they wouldn't recognize," "You treat the silence about A as evidence for B"), making your feedback more objective and defensible, even when judgment is involved. It forces students to engage with the specifics of historical context and language.
