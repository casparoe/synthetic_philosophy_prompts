  Okay, let me try to unpack this user's dense formal epistemology query. They're clearly deep into accuracy-first epistemology, wrestling with how different inaccuracy measures affect arguments for probabilism. The Brier vs log score comparison is central, and their worked examples reveal genuine conceptual tensions.

  First, I need to validate their core observation: yes, the structural difference between global (Brier) and local (log) measures is fundamental. Their calculation that (0.6,0.6) isn't log-dominated by any coherent credence is correct, and it's not just an artifact - it stems from the log score's myopic focus on the true cell. 

  When they ask about the general property (question a), "strict propriety over R+^n" is indeed key, but I should emphasize that this forces the measure to care about all coordinates simultaneously. The Brier score's Euclidean nature naturally achieves this, while local measures can't. The user suspects this might circularly presuppose probabilism, but actually it's a weaker constraint - we're just requiring that truth-seeking accuracy should penalize both misplaced confidence and wrong total mass.

  For (b), their intuition about the log score's uniqueness among local proper measures seems right. I recall that any such measure must be a function of the true cell's credence alone, and among those, only affine transforms of log score satisfy strict propriety. The caveat is that on the simplex, other local measures can be proper if they're not strictly so.

  The calibration/refinement point (c) is insightful. The Brier score's false-cell sensitivity is indeed refinement showing up - but crucially, refinement only becomes epistemically relevant because the measure makes it accuracy-relevant. The user might be hinting that veritism alone doesn't justify caring about refinement, which is a deep challenge.

  Partition sensitivity (d) is where things get thorny. Their splitting examples perfectly illustrate how Brier scores change with partition coarseness while log scores don't. The standard move is to index scores to the "algebras of interest," but that feels ad hoc. Invariance under refinement would require something like log score's locality, which brings us full circle. Maybe I should acknowledge this as an unsolved tension in the program.

  Finally, for intuitive justification (e): the Euclidean "shape" of Brier penalizes both direction and magnitude errors from truth vectors. But is spreading credence over false cells really more truthful? I think the user wants the veritist to defend why global structure matters - perhaps via the "no miracles" argument that precise truths deserve precise confidence.

  Throughout, the user's tone suggests frustration with what they see as measure-dependent trickery. I should validate that their examples expose genuine fault lines while showing how the accuracy-first program tries to address them.
answer: |-
  Your analysis is astute and cuts to foundational issues in accuracy-first epistemology. Let's address each question systematically, blending algebra with intuition.

  ### (a) The Crucial Property: Strict Propriety Over Non-Negative Orthant
  Your diagnosis is correct: **Brier is "global" (sensitive to entire credence vector) while Log is "local" (depends only on the true cell)**. The general property enabling probabilism arguments is:

  > **Strict Propriety Extended to R₊ⁿ**: An inaccuracy measure *I* is *strictly proper over the non-negative orthant* if for every probabilistic *q*, the expected inaccuracy *E_q[I(c)]* is uniquely minimized when *c = q*, **even when *c* ranges over all non-negative vectors (not just probability functions).**

  **Why this works:**
  - Brier satisfies this: *E_q[I_B(c)] = Σⱼ (cⱼ - qⱼ)² + (1 - Σⱼ qⱼ²)*. The quadratic form ensures a unique minimum at *c = q* for *c ∈ R₊ⁿ*.
  - Log violates this: As you showed, *E_q[I_L(c)] = -Σⱼ qⱼ \ln cⱼ* is minimized at *c = q* **only** if we restrict *c* to the simplex. Outside, it can be lower (e.g., *c = (t,t)* for *t > 0.5*).

  **Is this circular?** No. Probabilism (sum-to-1) is derived from accuracy-dominance arguments using this property. The property itself is a constraint on the inaccuracy measure, motivated by:
  1. **Veritist intuition**: Inaccuracy should reflect "distance from truth". Truth vectors (e.g., (1,0,0)) have unit mass. A credence like (0.6,0.6) is "further from truth" than (0.5,0.5) globally, even if locally it assigns higher credence to each cell. Brier captures this; Log does not.
  2. **No "free accuracy inflation"**: Measures like Log allow incoherent credences to exploit the scoring rule by over-assigning total credence. Strict propriety over *R₊ⁿ* prevents this.

  ---

  ### (b) Log Score's Uniqueness and Structural Failure
  Your intuition is correct: **The log score is essentially the unique strictly proper local measure**. More precisely:
  - **Theorem** (Shuford et al., 1966; Savage, 1971): If a scoring rule *S(p,i)* depends only on *p_i* (the credence for the true cell) and is strictly proper over probabilities, then it must be of the form *S(p,i) = -k \ln p_i + b_i* (for *k>0*, *b_i* arbitrary).
    
  **Caveats:**
  1. **Locality + strict propriety ⇒ Log-like**: This holds for finite partitions. For infinite partitions, other options exist, but Log remains canonical.
  2. **Structural failure**: Yes, the inability to condemn incoherent credences like (0.6,0.6) is inherent to any local measure. They only penalize "stinginess" (*p_i* too low) not "inflation" (Σcⱼ > 1). Veritists argue both are accuracy defects.

  ---

  ### (c) Calibration, Refinement, and Brier's Sensitivity
  The Brier score decomposes as:
  ```
  I_B(c,wᵢ) = (1 - cᵢ)² + Σ_{j≠i} c_j² = Reliability + Resolution + Uncertainty
  ```
  - **Calibration (Reliability)**: Measures how well credences match empirical frequencies.
  - **Refinement (Resolution)**: Discriminates between different outcomes given the same credence.

  **Your insight is key**: Brier's sensitivity to spreading credence over false cells (e.g., (0.8,0.1,0.1) vs. (0.8,0.2,0) scoring better) is indeed its **refinement component** at work. 
  - **Why refinement matters for accuracy**: Assigning 0.1 to each of two false cells is "more truthful" than assigning 0.2 to one and 0 to the other because it acknowledges the symmetry of possibilities. The truth is "finer" than the partition, so spreading mass respects that. Log ignores this, treating all false cells identically.

  ---

  ### (d) Partition Sensitivity: The Core Challenge
  **The problem**: 
  - Brier: Splitting a false cell improves accuracy (0.08 → 0.06 → 0.04 in your example).
  - Log: Splitting a false cell does nothing; splitting the true cell worsens accuracy drastically.

  **Solutions in the literature**:
  1. **Fixed "Ultimate Partition"**: Run arguments relative to a maximally fine-grained partition of "possible worlds" (e.g., atomic propositions in Carnap's state-descriptions). 
     - Brier: In the limit of infinite refinement, splitting false cells has diminishing returns (0.04 + 0.04/n → 0.04). Coarse-grained scores are upper bounds.
     - Log: Insensitive to false-cell splitting but penalizes true-cell splitting harshly.
  2. **Algebra-Invariance**: Require scores to be invariant under partition refinements. 
     - **Brier fails this** (as your calculation shows).
     - **Log fails** for true-cell splits.
     - No common strictly proper score satisfies this. *This is a major criticism of accuracy-first approaches.*
  3. **Dominance Relative to All Partitions**: Pettigrew (2016) argues: if *c* is accuracy-dominated by a probabilistic *p* **in every possible partition**, then *c* is irrational. 
     - Incoherent *c* (like (0.6,0.6)) is Brier-dominated in every partition.
     - Log fails: (0.6,0.6) isn't dominated in the original partition.

  **Does refinement collapse locality?** No. Even maximally refined, Brier remains global (e.g., credence mass on distant worlds matters). Log remains local (only the true world's credence counts).

  ---

  ### (e) Intuitive "Shape" and Veritist Justification
  **Brier's "Shape"**:
  - **Euclidean geometry**: Inaccuracy is squared distance in credence-space from the truth vector. 
    - Penalizes both:
      - **Directional error**: Credence vector pointing away from truth (e.g., high *c_j* when *w_i* true, *j≠i*).
      - **Magnitude error**: Total credence ≠ 1 (e.g., (0.6,0.6) is "too long").
  - **Visualize**: Truth vectors are corners of the unit simplex. Brier penalizes any deviation from the closest corner, even outside the simplex.

  **Log's "Shape"**:
  - **Divergence geometry**: Inaccuracy is KL-divergence from truth. 
    - Only penalizes **scalar undersupply**: *c_i* < 1 for true *w_i*.
    - Blind to oversupply (Σcⱼ > 1) or distribution on false cells.

  **Veritist Justification for Globality**:
  1. **"No miracles" argument**: If a credence function assigns total mass >1, it must be overconfident somewhere. Even if accidentally "close" locally (like (0.6,0.6) having high *c_i*), it misrepresents the global structure of possibility.
  2. **Refinement matters**: Spreading credence evenly among symmetric false cells better reflects ignorance than arbitrarily concentrating mass. Truth-directedness requires sensitivity to what is *not* true.
  3. **Coherence as a side-effect**: Proper scoring rules on *R₊ⁿ* make probabilistic coherence emerge from accuracy maximization—no need to posit separate coherence norms.

  **Rebuttal from localists**: Truth is only about the actual world. False cells are epistemic artifacts; inaccuracy should ignore them (Joyce, 2009). But your examples show this leads to counterintuitive permissions for incoherence.

  ### Conclusion
  Your computations reveal a genuine rift: **Brier-style arguments for probabilism require inaccuracy measures to be strictly proper over *R₊ⁿ***, which demands global sensitivity. Log and other local measures fail this, making them "blind" to credence inflation. Partition sensitivity remains a challenge, favoring fixed maximally fine partitions. The veritist case for global measures hinges on the idea that accuracy requires fidelity to the *entire* structure of truth and possibility—not just the actual world. This remains contentious but is integral to the accuracy-first programme.
