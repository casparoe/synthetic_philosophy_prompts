prompt: |-
  Sorry if this is a bit niche, but its been bugging me for a while and I'd rather ask than read around it.

  Relativists have a practice I keep bumping into and I can't work out what it commits them to. The official doctrine goes like this. Take two solutions of Einstein's field equations that differ only by a diffeomorphism — a smooth relabelling of which manifold point is which. Those are not two possible worlds; they are one world described twice. So nothing physical hangs on the identity of the points: the physical content of a model is only what survives the relabelling. That's the moral everyone draws from the hole argument. Picture a region of spacetime with no matter or fields in it at all (the "hole"), and a relabelling that shuffles the points around inside that region but leaves everything outside it exactly as it was. If the points had identities of their own, independent of the fields sitting on them, you'd have two models that agree everywhere up to the edge of the hole and then disagree inside it — same past, different future, for no reason at all. Determinism breaks for free. Absurd. So: treat the relabelled models as the same model, and count as observable only the quantities that are invariant under relabelling.

  Fine. But now look at what people actually do at the keyboard. They build a numerical simulation, and the first thing they do is fix a gauge — pick coordinates, choose a lapse and a shift, lay down a grid — because without that the equations won't evolve. Then they read numbers off that grid: the metric component at this grid point at this time step, the coordinate radius of the horizon, the waveform extracted at some finite radius, the peak curvature reached during the merger. And those are exactly the sort of quantities the official doctrine says aren't physical. Some gauge conditions are pinned to physical landmarks — the time coordinate is the proper time of observers comoving with the matter, r is fixed by the areas of spheres — but plenty aren't: harmonic gauge, the popular slicing conditions for black hole collisions, all of it is just a convenient functional choice with no matter to hang it on. And then there are the parts of the simulation where there is no matter at all to anchor anything, i.e. vacuum regions that are basically the hole again, and people still seem perfectly happy to say what is happening "at" a point "at" a time.

  So: what does this practice actually presuppose about spacetime? Does the fact that gauge-fixed simulations work — convergent, cross-checked against each other, matching observation — presuppose that the relabelling freedom is genuinely surplus structure, so that the practice only makes sense if something like relationalism is true, or at least if points have no identity of their own beyond the fields (the anti-haecceitist thing, whatever it's called)? Or can someone who thinks the manifold points are real objects with primitive identities — a substantivalist, I suppose — explain why the practice is fine anyway, e.g. by treating the gauge-fixed model as a mere representative of an equivalence class and the grid numbers as an encoding of invariant facts about the whole class? I want the strict presuppositions separated from what the practice merely sits comfortably with, and I want to know where it's underdetermined: where several quite different metaphysical stories would license exactly the same behaviour at the keyboard.

  Three things that make it sharper for me.

  One. I've started calling the two kinds of gauge fixing tethered and free-floating. Tethered = the condition is stated by appeal to some physical field or landmark. Free-floating = it's just a convenient equation in the coordinates. My sense is people are much more relaxed about trusting tethered gauges, and that when a run produces something weird in a free-floating gauge the first diagnosis is "gauge artefact". Doesn't that asymmetry show the practice secretly relies on the relationalist idea — that coordinates only mean something when pinned to matter — even though the official doctrine says all gauges are equally unphysical and therefore equally fine? And if so, is "the gauge is just bookkeeping" false, or at least only half the story?

  Two. Imagine a run in a genuinely matter-free, symmetry-free region — no dust, no horizons, nothing to tether to — and it spits out a blow-up. There's no landmark to relate it to, so there's no invariant way to say whether that's a physical blow-up at a place or a coordinate pathology of that particular gauge. What would the practice have to say? Does it presuppose there's always enough physical structure lying around to anchor the gauge, and what happens to the practice when that presupposition fails? People worry about something like this for quantum gravity, where there may be no fixed background of landmarks at all.

  Three, and this is the bit I want a straight answer on. Suppose relativists decided the manifold points really do have primitive identities and the relabelled models really are distinct possibilities. Would anything at the keyboard change? Would any of the trust in tethered gauges, any of the "gauge artefact" diagnosing, any of the reading-off of local quantities become unjustified? Or is the whole practice compatible with every story, in which case the hole argument is doing no work in the practice even though everyone cites it as the thing that licenses the practice? If it is doing work, say where — what's the thing people do that they couldn't do, or couldn't justify, if the substantivalist were right?

  Don't give me a literature dump, I can't look any of it up anyway. Just reconstruct the implicit view, tell me which bits of the practice force which bits of it, and be explicit about what stays exactly the same under the rival views.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deep into relativity and gauge fixing, wrestling with the gap between the official doctrine (diffeomorphism invariance) and actual practice (using gauges in simulations). The core tension is: if physical reality is only the invariant quantities, why do relativists happily use gauge-dependent outputs in simulations?

  First, I need to recall the hole argument. It shows that if spacetime points had independent identities, we'd lose determinism. So the solution is to treat diffeomorphic models as physically identical. But in practice, simulations fix a gauge to compute things. The user sees a contradiction here.

  The user distinguishes tethered vs free-floating gauges. Tethered gauges reference physical fields (like proper time of comoving observers), while free-floating ones are arbitrary (like harmonic gauge). They note that relativists trust tethered gauges more and often dismiss free-floating gauge artifacts. This suggests an implicit reliance on relationalism—coordinates gain meaning through matter.

  Then there's the matter-free region problem. If a simulation blows up in a vacuum area with no landmarks, how can we tell if it's physical or a gauge artifact? This ties into quantum gravity worries where no background exists.

  The user's main ask is: if substantivalism were true (points have primitive identity), would simulation practices change? They want to know if the hole argument actually underpins the practice or if it's just philosophical decoration.

  Breaking it down: The official doctrine says only invariant quantities are physical. But in simulations, they use gauge-dependent quantities like metric components at grid points. The key is that these are practical tools to extract invariants. For example, waveforms are extracted at "finite radius" but then matched to observational data, which are invariant.

  For tethered vs free-floating gauges: Tethered ones are preferred because they're less likely to cause misleading artifacts. But both are unphysical; the trust in tethered gauges comes from their stability and closer alignment with measurable quantities, not from them being "more real."

  In vacuum regions, blow-ups are diagnosed by checking different gauges or looking for invariant indicators like curvature scalars. If all gauges blow up in the same way, it's likely physical. The practice assumes that invariants can be reconstructed, even if locally gauges are used.

  Now, if substantivalism were true, would practices change? Probably not. Simulations would still use gauge fixing because the equations need it. The outputs would still be interpreted by extracting invariants. The "gauge artifact" dismissals would still happen because even substantivalists need stable coordinates for calculation. The hole argument's role is justifying why we can dismiss gauge differences, but the computational methods don't care about the metaphysics as long as invariants are reached.

  So the practice is compatible with both views. The hole argument licenses ignoring gauge differences, but the day-to-day work relies on gauge fixing as a computational tool. The trust in tethered gauges is practical, not metaphysical. The key is that invariant quantities are the goal, and gauges are a means to that end.
answer: |-
  Here's a straight reconstruction of the implicit view in practice, separating strict presuppositions from compatibility, and identifying what hinges on the relationalist commitment:

  ### 1. **The Core Practice & Its Presuppositions**
     - **Strict Presupposition**: *Physical observables are diffeomorphism-invariant.* The practice assumes that *only* quantities unchanged by relabelling (e.g., event horizons, proper times between events, scalar curvature invariants, gravitational wave strain at infinity) are physical. Gauge-fixed outputs (metric components, coordinate radii) are **computational intermediates**, not observables.
     - **Compatibility**: This is *consistent* with both relationalism (points lack identity) and substantivalism (points have identity), **provided** substantivalists accept that relabelled models represent the *same physical possibility*. The practice doesn't care *why* you treat them as identical, only *that* you do.

  ### 2. **Why Gauge Fixing Works (Regardless of Metaphysics)**
     - **The Equivalence Class Move**: Fixing a gauge (tethered or free-floating) selects *one representative* from the equivalence class of diffeomorphic models. The simulation computes *that representative's* evolution. Crucially:
       - **Convergence/Cross-checking**: When codes with *different* gauge choices agree on *invariant outputs* (e.g., waveform phase, merger time), it confirms they are computing the *same physical solution*, just via different representatives.
       - **Reading off the Grid**: Numbers like "g_{tt} at (x=5,t=10)" are **not** considered physical reports. They are:
         - Inputs for *calculating invariants* (e.g., integrating g_{tt} along a worldline to get proper time).
         - Heuristic indicators (e.g., "this grid point has high curvature" flags a region to *compute* the invariant Kretschmann scalar).
       - **No Commitment to Point Identity**: The practice works because the *invariant relationships* encoded in the gauge-fixed solution are physical. Whether points have "primitive identity" is irrelevant to extracting those relationships.

  ### 3. **Tethered vs. Free-Floating Gauges: The Asymmetry Explained**
     - **Why Trust Tethered More?** It's **practical robustness**, *not* metaphysics:
       - Tethered gauges (e.g., synchronous gauge with comoving dust) often have **better numerical stability** and **directer mapping to measurable quantities**. A "weird" result in a free-floating gauge (e.g., harmonic) is more likely a *numerical instability* or *pathological coordinate choice* (e.g., developing caustics) than in a tethered gauge anchored to matter flow.
       - **Diagnosing "Gauge Artefacts"**: This flags outputs *sensitive to the choice of representative*, not the underlying physics. A tethered gauge's anchor reduces sensitivity, making artefacts *less likely*, not more physical.
       - **Compatibility**: Relationalists see tethering as "pinning to physical stuff." Substantivalists see it as "choosing a representative where coordinates align with physical trajectories." **The practice doesn't require choosing between these interpretations.** The asymmetry stems from computational reliability and ease of invariant extraction.

  ### 4. **The Matter-Free Hole: What Practice Presupposes**
     - **Presupposition Failure?** Practice assumes that *sufficient physical structure exists somewhere* to define invariants *globally* (e.g., asymptotic flatness for waveforms, singularities for BH mergers). In a truly *isolated*, structureless vacuum region:
       - **Blow-up Diagnosis**: Relativists *don't* presuppose anchors everywhere. They:
         1. Check if blow-up persists under *multiple gauge choices*.
         2. Compute *invariant scalars* (e.g., Riemann curvature invariants). If invariants blow up → physical singularity. If not → gauge pathology.
       - **Quantum Gravity Limitation**: Yes, practice *assumes classical GR with identifiable asymptotic/invariant structure*. If quantum gravity lacks this (e.g., no fixed boundaries), current practice breaks. This is a known frontier, not a hidden flaw.

  ### 5. **The Crucial Answer: Would Practice Change if Substantivalism Were True?**
     - **NO.** Nothing significant changes at the keyboard if substantivalists accept the equivalence class view:
       - **Gauge Fixing**: Still essential for evolving PDEs. Equations remain degenerate without it.
       - **"Gauge Artefact" Diagnosis**: Still valid. A substantivalist running two simulations with different gauges *interprets disagreement in grid values* as using different labeling schemes for the *same physical points*, not different physics. They still seek gauge-invariant agreement.
       - **Trust in Tethered Gauges**: Still based on numerical stability, not metaphysics.
       - **Reading Local Quantities**: Still just an intermediate step toward invariants.
     - **The Hole Argument's Role**: It **licenses dismissing gauge differences** as unphysical. Without it (i.e., if relabelled models were distinct possibilities), practice would face a crisis:
       - Simulations in different gauges could predict *divergent physical outcomes* (e.g., different merger times) for the *same initial invariant data*. This would destroy determinism and make cross-code verification impossible. **The practice *requires* treating gauge differences as non-physical to maintain determinism and empirical coherence.** This is the hole argument's *operational work*: it justifies ignoring gauge-dependent outputs as mere bookkeeping.

  ### Summary: Strict Presuppositions vs. Compatibility
  - **Strict Presuppositions (Non-Negotiable for Practice):**
    1. Diffeomorphic models represent the same physical state.
    2. Only diffeomorphism-invariant quantities are observable.
    3. Gauge fixing is a valid computational tool for evolving representatives.
  - **Compatible With:**
    - Relationalism (points lack identity).
    - Substantivalism *if* it accepts the equivalence class view (points have identity, but relabelling doesn't change physics).
  - **Practice Forced By:** The mathematical degeneracy of Einstein's equations (need gauge fixing to solve) and the need for deterministic, empirically verifiable predictions (demands invariance).
  - **Underdetermined:** The *metaphysical reason* points lack independent physical significance (relationalism vs. equivalence-class substantivalism). Practice functions identically under both.
  - **Hole Argument's Practical Value:** It resolves the threat of indeterminism from gauge freedom, justifying why we can safely ignore gauge-dependent outputs. Without this resolution, simulation results would be physically ambiguous.

  In essence: The practice presupposes *that* gauge differences are unphysical, not *why*. It works because it targets invariants. The hole argument justifies the "that," not the "why," and is operationally essential for deterministic computation. Nothing changes at the keyboard under substantivalism *unless* it rejects equivalence classes – which would break the practice entirely.
