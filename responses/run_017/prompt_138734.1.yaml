  Given the two cases, the requirements that must be included are:

  - Reliable Covariation
  - Causal Connection
  - Behavioral Competence

  but the conflict is between the need to test (which is behavioral) and the need for causal connection (which is non-behavioral and might be historical or architectural).

  So the solution must deliver a way to test for the causal connection without relying solely on current behavior, perhaps by examining the system's history or design. But that might not be possible in all cases.

  Thus, the tension remains.

  For the reading group, the key is to see that the symbol grounding problem requires more than behavior, but we can only test behavior. Hence, we might never be sure (as in the severed channel). But for practical trust, we rely on a combination of behavior and knowledge of the system's origins and design.

