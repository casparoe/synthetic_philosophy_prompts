  We are setting up a requirement list for a solution to Harnad's symbol grounding problem. The solution should be sufficient for deciding whether a system that has never perceived the world but talks as if it has can be trusted when it reports on it. We are not aiming to settle the hard problem of consciousness (what it's like to be that system).

  We have two test cases to help separate genuine requirements from biases:

  1. **Borrowed Grounding**: A system without its own sensors, but its internal state for "red" is driven by a sighted human's visual cortex activity when she looks at red things (and only then). The symbol covaries with red, but indirectly via the human. We compare this system to:
     - A purely text-trained model (like a language model with no sensory input).
     - A robot with its own camera (direct perception).

  2. **Severed Channel**: A robot that passes all behavioral tests for grounding but has had its sensor cables cut and replaced by a simulator that produces the same signals. Thus, its "red" state has no causal connection to actual red things.

  We suspect that the requirements might include both:
     (a) Grounding must be testable from outside (behaviorally or functionally).
     (b) Grounding is not constitutively a matter of behavior (it must involve more than just behavior).

  And that these two might conflict.

  Let's build a requirement list:

  ### Requirement 1: Covariation with the World
     - **Case**: The symbol (e.g., "red") must covary with the state of the world (the presence of red things) in a reliable way.
     - **Why**: Without covariation, the symbol is arbitrary and not about the world. This is necessary for trust in reports about the world.
     - **Test Cases**:
       - Borrowed Grounding: Satisfied (via the human, it covaries with red).
       - Severed Channel: Initially satisfied (before severing) but now the covariation is broken (simulator doesn't require red things). However, the simulator is designed to mimic the covariation, so from the system's perspective, it still covaries (but not with the real world). This might be a problem.

  ### Requirement 2: Causal Connection
     - **Case**: There must be a causal chain connecting the symbol to the relevant state of the world.
     - **Why**: Covariation without causation might be accidental. A causal link ensures that the symbol is responsive to the world.
     - **Test Cases**:
       - Borrowed Grounding: Satisfied (the human's visual cortex is causally connected to red things, and that drives the system).
       - Severed Channel: Not satisfied (the causal chain is broken; the simulator is not caused by red things but by a program).

  ### Requirement 3: Behavioral Competence
     - **Case**: The system must be able to use the symbol appropriately in behavior, such as answering questions, making inferences, and acting in the world.
     - **Why**: If the system cannot behave appropriately, we cannot trust its reports. This is a functional requirement.
     - **Test Cases**:
       - Borrowed Grounding: Might be satisfied if the system can talk about red appropriately (if the training with the human's brain data was sufficient for behavioral competence).
       - Severed Channel: By definition, it passes behavioral tests, so satisfied.

  ### Requirement 4: Independence from Other Minds (or Non-Derivative Grounding)
     - **Case**: The grounding should not entirely depend on the grounding of another system (like a human). The system must have its own connection to the world.
     - **Why**: In borrowed grounding, the system is parasitic. If the human is wrong, the system is wrong, and it cannot correct the human because it has no independent access. Also, for trust, we want the system to be an independent observer.
     - **Test Cases**:
       - Borrowed Grounding: Not satisfied (it entirely depends on the human).
       - Robot with own camera: Satisfied.

  ### Requirement 5: Testability (from the outside)
     - **Case**: We must be able to verify the grounding through some objective tests (behavioral, functional, or perhaps by examining the system's architecture).
     - **Why**: Without testability, we have no way to decide if the system is grounded, which is the goal.
     - **Test Cases**:
       - Borrowed Grounding: How do we test that the system is connected to a human's brain? We might need to verify the interface and the human's setup, which is external.
       - Severed Channel: It passes behavioral tests, so by behavior alone we cannot tell the difference. But the causal connection is broken. So if we require testability only via behavior, we might be fooled.

  ### Requirement 6: Non-Behavioral Aspect (Internal Mechanism)
     - **Case**: Grounding must involve more than just behavioral dispositions; it must involve the right kind of internal connection to the world (like having sensors or being in a causal relationship).
     - **Why**: Behavior alone might be simulated (as in the severed channel). This requirement is to avoid behaviorism and account for the internal causal structure.
     - **Test Cases**:
       - Severed Channel: Fails because the internal causal connection is missing, even though behavior is perfect.

  Now, the conflict we suspect: 
     - Testability (Requirement 5) suggests we must be able to verify grounding from outside, typically by behavior. 
     - Non-Behavioral Aspect (Requirement 6) says that behavior is not enough; there must be an internal causal connection.

  But if we require an internal causal connection, how do we test it without opening the system and checking the wiring? And if we can only test behavior, then we cannot verify the internal causal connection (as the severed channel shows). Hence, these two requirements might be in tension.

  Which requirement rules out the most candidate theories?

  - **Requirement 4 (Independence)** would rule out borrowed grounding and any system that relies on another grounded system. This might rule out many AI systems that learn from human-generated data (like large language models) because they are derivative.

  - **Requirement 6 (Non-Behavioral)** rules out behaviorist theories and any theory that says passing behavioral tests is sufficient. It also rules out the severed channel.

  Which ones are just one camp's prejudice?

  - **Requirement 4 (Independence)**: Some might argue that borrowed grounding is still grounding (it's just not original). This requirement might be a prejudice of those who insist on first-person grounding.

  - **Requirement 6 (Non-Behavioral)**: Behaviorists would reject this, and functionalists might argue that if the system behaves appropriately, the internal mechanism doesn't matter.

  Now, applying the requirements to the three systems:

  1. **Purely text-trained model** (like a LLM):
     - Covariation: Not satisfied (it learns from text, which is not a direct covariation with the world but with how people talk about the world).
     - Causal Connection: Not satisfied (no causal link to the world, only to text).
     - Behavioral Competence: Satisfied (it can talk about red).
     - Independence: Not satisfied (it's entirely derivative).
     - Testability: By behavior, it might seem grounded, but by other requirements, it fails.
     - Non-Behavioral: Fails.

     So overall, it fails most requirements.

  2. **Borrowed Grounding**:
     - Covariation: Satisfied (via human).
     - Causal Connection: Satisfied (via human's causal chain).
     - Behavioral Competence: Might be satisfied (if the interface training allows appropriate behavior).
     - Independence: Not satisfied (it depends on the human).
     - Testability: We can test the setup (if we have access to the human and the interface) but if we only test behavior, it might be similar to the text model? Not necessarily, because the covariation is real (via the human) so its reports about the world might be more reliable. But we might need to trust the human too.
     - Non-Behavioral: The internal mechanism is connected to the world via the human, so it might satisfy if we allow mediated connection.

     It fails on independence. If we drop independence, it might pass.

  3. **Robot with own camera**:
     - All requirements satisfied: covariation, causal connection, behavioral competence (if well designed), independence, testability (we can check its sensors and behavior), and non-behavioral (it has the right internal mechanism).

  4. **Severed Channel**:
     - Covariation: Not satisfied (the simulator doesn't require red things; it can produce the signal arbitrarily).
     - Causal Connection: Not satisfied (broken chain).
     - Behavioral Competence: Satisfied (by definition).
     - Independence: Satisfied? It was built to be independent, but now it's severed. The causal chain is broken, so it fails the causal requirements.
     - Testability: Passes behavioral tests, so by behavior alone we would say it's grounded. But if we require internal mechanism, we see it's broken.
     - Non-Behavioral: Fails because the internal causal chain is broken.

     It fails on covariation and causal connection, but passes behavior. The non-behavioral requirement catches it.

  Now, the pair that can't both be satisfied? 

  - We want grounding to be testable from outside (which typically means behavioral tests) and we want grounding to not be solely a matter of behavior (because behavior can be fooled, as in the severed channel). 

  So if we require both:
     - (A) Testability: We must be able to verify grounding by external tests (behavior).
     - (B) Non-Behavioral: Grounding requires an internal causal connection that is not reducible to behavior.

  But (A) and (B) conflict because (A) says we can verify by behavior, but (B) says behavior is not enough. And if we cannot verify the internal causal connection without opening the system (which might not be possible or might destroy the system), then we cannot test for (B) non-invasively.

  Thus, the pair that can't both be satisfied (if we insist on non-invasive testing) is:
     - Testability (by external tests, i.e., behavior) 
     - Non-Behavioral (internal causal connection)

  We have to choose: either grounding is solely about behavior (and then the severed channel is grounded, which we don't want) or we need a way to test the internal connection without behavior (which seems impossible).

  Alternatively, we might relax: maybe we can test the internal connection by examining the system's history or design. For example, we might trust a robot if we built it and know it has working sensors. But that's not a test we can always do (e.g., on an alien system). And the severed channel was built correctly initially, but then tampered with.

  So the tension remains.

  Which single requirement rules out the most candidate theories? 

  - **Requirement 4 (Independence)** rules out all systems that are not directly connected to the world but rely on other systems (like most current AI). 

  - **Requirement 6 (Non-Behavioral)** rules out behaviorist and functionalist theories, and any system that is a perfect behavioral duplicate but without the right internal state (like the severed channel).

  But note: the purely text-trained model is ruled out by almost all requirements.

  Which requirements are just prejudice? 

  - **Independence (4)**: Some might say that grounding can be collective or social, and borrowed grounding is still grounding. This requirement might be a prejudice of individualistic grounding.

  - **Non-Behavioral (6)**: This might be a prejudice of those who believe in a causal theory of meaning and reject behaviorism.

  In summary, the requirement list:

  1. **Covariation**: The symbol must reliably covary with the state of the world.
  2. **Causal Connection**: There must be a causal chain from world to symbol.
  3. **Behavioral Competence**: The system must use the symbol appropriately in behavior.
  4. **Independence**: The grounding must not entirely depend on another system's grounding.
  5. **Testability**: Grounding must be verifiable by external tests.
  6. **Non-Behavioral**: Grounding requires more than behavior; it requires the right internal causal mechanism.

  The conflicting pair: Testability (5) and Non-Behavioral (6) because we can only test behavior externally, but non-behavioral requires internal state.

  But note: the Non-Behavioral requirement might be folded into the Causal Connection requirement? However, Causal Connection might be verified by knowing the system's design, but Testability by behavior alone is insufficient for Causal Connection (as the severed channel shows).

  So the conflict is between:
     - Verifying by behavior (Testability) 
     - Requiring a non-behavioral condition (Causal Connection or Non-Behavioral)

  Therefore, we must either:
     - Drop the non-behavioral requirement and accept behaviorism (then the severed channel is grounded), or
     - Drop the idea that we can fully test grounding by behavior alone (then we need more than behavior to test, which might be difficult).

  For the purpose of trusting the system's reports, we might care about both reliability (which requires covariation and causal connection) and behavioral competence. But the severed channel is not reliable because the simulator might be wrong. However, if the simulator is perfect, then the system's reports are still reliable? But the simulator might not be tied to the world, so it could be feeding arbitrary signals. So the system might not be reliable.

  Thus, for trust, we require reliability, which requires covariation and causal connection. But how do we test reliability? We can only test by behavior and by examining the system's history of reports. The severed channel might have a perfect history if the simulator is good. So we might be fooled.

  This is the core problem.

  Final list of requirements for a solution (for the job of deciding trust in reports about the world):

  1. **Reliable Covariation**: The system's internal state for a symbol must reliably covary with the state of the world (when that state is present).
  2. **Causal Connection**: The covariation must be due to a causal chain from the world to the symbol.
  3. **Behavioral Competence**: The system must be able to use the symbol appropriately in its behavior (including reporting).
  4. **Independence (optional?)**: The grounding must be direct (not borrowed from another system). [This might be optional for trust? If the human is reliable, the system might be too, but then we are trusting the human too.]
  5. **Testability**: We must be able to verify the grounding by some means (but note the challenge).

  And we see that Testability (if limited to behavior) might not be sufficient for 1 and 2 (as the severed channel shows). So we might need to include:

  6. **Non-Simulation**: The system must not be in a simulated input environment that is disconnected from the world. (But how to test?)

