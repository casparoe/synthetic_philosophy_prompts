  Psychological realism matters too. Even with perfect external impunity, internal factors like guilt, anxiety, or identity changes might affect welfare. Plato's factionalized soul concept might hold weight here.

  The collective generalization problem is significant. If everyone had rings, society collapses, making injustice counterproductive. This undermines the individual-level thought experiment.

