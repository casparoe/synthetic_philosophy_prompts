prompt: |-
  Taking a moral responsibility module this term and we just did Strawson: the reactive attitudes, the participant stance versus the objective attitude, and the thought that holding someone responsible isn't really a theory we apply to a person but something we're doing inside a relationship. I also watched The Banshees of Inisherin last week and it struck me as basically a Strawson case study — Colm just withdraws his goodwill from Pádraic and wont give a reason, Pádraic keeps demanding one and refuses to accept that things have changed, and it escalates into something horrible.

  Can you read the film through that lens? Where does it actually illuminate what's going on between them, and where does the film resist the reading? I'm especially unsure about one thing: is Colm taking the objective attitude toward Pádraic, or is refusing to give reasons itself a reactive attitude? And does Strawson have anything to say about whether we're owed a reason when someone withdraws their regard? Finally, does the film add anything to this debate that the papers don't — about the cost of not accepting that a relationship is over, or about the difference between resentment and grief?
