  Okay, the user is setting up a reading group on group minds, specifically focusing on whether a colony like Aunt Hillary can have literal beliefs. They want a clear standard of proof that's portable across different systems. Let me unpack their query.

  First, they provided a list of desiderata, each with a case or consideration. I need to reorganize these into a coherent set of criteria. The user mentioned issues like house-hunting, the colony being wrong, fission, swap cases, no double counting, redundancy, gradual replacement, slave-making colonies, memory without a rememberer, and too many minds. They also want to know if consciousness should be included or if it's just about intentionality.

  The user's deeper needs seem to be about clarity and applicability. They want a framework that can decisively determine if group-level attributions are explanatory, not just metaphorical. Portability is key—applying the same criteria to firms, server farms, slime molds. They’re wary of arbitrary boundaries and double-counting causes. Also, they want testable requirements to avoid vagueness.

  I notice they’re concerned about biases, like individualism or assuming consciousness. They want to avoid smuggling in prejudices, such as genetic relatedness in slave-making colonies. The fission and swap cases highlight the need for non-arbitrary identity conditions. The gradual replacement touches on continuity and thresholds, which is tricky with sorites issues. The redundancy worry needs turning into a test, maybe through predictive divergence.

  I should check for conflicts between criteria. For example, determinacy in belief attribution vs. no sharp thresholds in colony size. Also, intrinsic mentality vs. observational accessibility might clash. The slave-making case challenges assumptions about shared biology, so negotiability there might be necessary.

  Including consciousness? Probably not, as it's contentious and might not be necessary for intentional states. Focus on intentionality for practicality. 

  Scoring positions briefly: Intentional stance might fail on misrepresentation and fission. Realiser functionalism could handle dynamics but struggle with redundancy. Superorganism view might over-rely on selection history. Eliminativism dismisses group level too quickly. 

  Prioritizing the criteria: Predictive divergence (from redundancy) seems crucial for testability. Misrepresentation is non-negotiable for literal beliefs. Fission and swap for identity. House-hunting for emergent info. 

  Need to mark which are non-negotiable vs. negotiable. For example, misrepresentation and fission are likely non-negotiable, while slave-making might be negotiable if the theory allows non-biological components. 

  Also, flag conflicts: Determinacy vs. no sharp thresholds is a big one. Gradual replacement's sorites problem might require accepting vague boundaries or a different approach. 

  Overall, structuring the response to address each criterion clearly, with cases, negotiability, conflicts, and then a quick scorecard of theories. Keeping it concise without citations as requested. Making sure British English is used throughout.
answer: |-
  Here’s a distilled set of desiderata for evaluating theories of group-level mentality, synthesising your cases into core requirements. Each criterion is designed to be portable across systems (colonies, firms, AIs, slime moulds) unless otherwise specified. Consciousness is **excluded** (see §6); the focus is on *intentionality* (beliefs/desires).

  ---

  ### **Core Desiderata**  
  *(Non-negotiable unless flagged)*  

  1. **Emergent Information Integration (House-Hunting)**  
     - *Case*: Colony assesses nest sites via distributed scouting; no ant compares options.  
     - *Requirement*: The system must integrate information such that the *whole* possesses states not reducible to any part’s knowledge.  
     - *Portability*: Must apply to firms (e.g., committee decisions), server farms (emergent routing optimisations).  

  2. **Misrepresentation (False Trails)**  
     - *Case*: Colony "believes" a depleted food source exists.  
     - *Requirement*: Theory must allow group states to be *objectively wrong* (not just noisy signalling). Covariance with environment is insufficient.  
     - *Non-negotiable*: Literal belief requires the possibility of error.  

  3. **Identity Under Fission/Swap (Fission & Swap Cases)**  
     - *Case*: Split colony → two functional units; swap workforces between nests.  
     - *Requirement*: Theory must specify:  
       - (a) Whether mentality persists post-fission (and if so, how identity is tracked).  
       - (b) Whether mind follows ants (substrate) or nest/network (organisation).  
     - *Crucial*: Answer must be principled, not ad hoc. *Non-negotiable*.  

  4. **Causal Non-Redundancy (No Double Counting)**  
     - *Case*: Colony-level "decision" vs. ant-level chemistry.  
     - *Requirement*: Colony states must be *causally potent*: they should explain behaviours not fully accounted for by part-level causes. *Avoid overdetermination*.  
     - *Test*: Interventions altering colony state (e.g., erasing pheromone trails) should change outcomes *differently* than part-level tweaks (e.g., drugging ants).  

  5. **Predictive Divergence (Redundancy Worry)**  
     - *Case*: Is a "colony belief" just shorthand for ant states?  
     - *Requirement*: Attributing group mentality must yield *superior predictions* vs. part-level redescription. Must generate testable counterfactuals part-level cannot (e.g., "If the colony *believed* site B was closer, it would ignore stronger trails to A").  
     - *Non-negotiable*: Separates literal explanation from *façon de parler*.  

  6. **Substrate Neutrality (Gradual Replacement & Slave-Making)**  
     - *Case*: Ants replaced by robots; slave-makers using alien workers.  
     - *Requirement*: Mentality must depend on *functional organisation*, not biological substrate, species, or history.  
     - *Negotiable*: Some theories may require shared evolutionary history (see §8).  

  7. **Continuity Without Persistent Subjects (Memory)**  
     - *Case*: Colony "memory" in trails/architecture despite ant turnover.  
     - *Requirement*: Theory must allow mentality without a persistent biological subject. Rejects individualism. *Non-negotiable*.  

  8. **Boundedness (Too Many Minds)**  
     - *Case*: Overlapping ant subgroups all function minimally.  
     - *Requirement*: Theory must specify *which* organisational structures constitute *a* mind (e.g., unified information processing vs. mere coordination).  
     - *Portability*: Must apply to firms (HQ vs. departments), server clusters (subnets).  

  ---

  ### **§6: Consciousness?**  
  - **Excluded**. Your suspicion is correct: demanding phenomenal consciousness smuggles in individualist prejudice. Focus on *intentionality* (goal-directedness, representational states). A theory satisfying 1–8 can address "belief" literally without needing qualia.  

  ---

  ### **Conflict & Priority Analysis**  
  - **Key Conflict**: **Predictive Divergence (5)** vs. **Continuity (7)**.  
    - *Why*: Deterministic belief attribution (5) requires discrete functional states, but gradual replacement (7) suggests vague boundaries (sorites). Resolution may require accepting degrees of mentality.  
  - **High-Impact Requirement**: **Predictive Divergence (5)**.  
    - *Does the most work*: Knocks out "as-if" theories, demands empirical testability.  
  - **Low-Impact Requirement**: Substrate Neutrality (6).  
    - *Why*: While important for portability, theories can satisfy other criteria while privileging biological systems (e.g., selection history).  

  ---

  ### **Stock Positions: Quick Scorecard**  
  *(British English; no citations)*  

  1. **Intentional Stance (Dennett-style "as-if")**  
     - Fails **Predictive Divergence (5)** (no literal explanation), **Misrepresentation (2)** (errors are just failed predictions). Portable but collapses to instrumentalism.  

  2. **Realiser Functionalism (Colony "realises" mental states)**  
     - Struggles with **Fission/Swap (3)** (vague on identity), **Boundedness (8)** (what counts as realisation?). Handles **Substrate Neutrality (6)** well.  

  3. **Superorganism (Unit-of-Selection View)**  
     - Fails **Slave-Making (6)** (over-relies on shared evolution), **Swap Case (3)** (mind tied to nest, not ants?). Portability limited to biological groups.  

  4. **Eliminativism ("Just ants!")**  
     - Rejects **Emergent Information (1)**, **Causal Potency (4)**, **Predictive Divergence (5)**. Falls to house-hunting case.  

  **Strongest candidate**: A **functionalist theory** refined to handle fission/swap (3) and predictive divergence (5) has the best shot. Sorites issues remain unresolved.  

  ---  
  This framework prioritises *testability* and *portability* while forcing theories to confront hard cases. Use it to dissect readings without library access.
