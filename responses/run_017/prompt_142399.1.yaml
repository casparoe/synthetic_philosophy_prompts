answer: |-
  ### Decision Tree for Representation Claims in Interpretability

  **Start Here**  
  0. **Could any empirical result (e.g., a perfect interchange intervention or causal-scrubbing) settle whether a feature is the model's representation of X?**  
     - **No** → **Leaf A: Non-Empirical**  
       *Awkward commitment: No experiment can ever prove a feature "is" a representation—disagreement is philosophical. Philosophers only. Upstream of evidence.*  
     - **Yes** → Proceed to 1.  

  1. **Must the feature be causally relevant to the model's behavior (i.e., actively used in processing) to count as the model's "representation" of X?**  
     *Diagnostic case: Vestigial feature (predicts X, causally inert). If "not a representation," causal relevance is necessary.*  
     - **Yes** → Proceed to 2.  
     - **No** → Proceed to 4.  

  2. **In seed divergence (Model A has a linear feature for X; Model B encodes X nonlinearly but identically), does Model B "have a representation" of X?**  
     - **Yes** → Proceed to 3.  
     - **No** → **Leaf B: Form-Specific Realism**  
       *Awkward commitment: Model B lacks a representation of X despite identical behavior. Interp engineer unlikely.*  

  3. **After mild distribution shift, if the model switches encodings (chameleon feature lights up but isn't used), is the representation of X "the same" as before?**  
     - **Yes** → **Leaf C: Functional-Role Realism**  
       *Awkward commitment: Representation persists even if the underlying feature changes. Interp engineer might sign on.*  
     - **No** → **Leaf D: Causal-Units Realism**  
       *Awkward commitment: Representation changes when the causal feature changes, even if behavior is identical. Interp engineer might sign on.*  

  4. **Is the feature's status as a representation an objective property of the model?**  
     - **No** → **Leaf E: Deflationary/Illusionist**  
       *Awkward commitment: Representations are descriptions we impose, not discoveries. Philosophers only.*  
     - **Yes** → Proceed to 5.  

  5. **Is the vestigial feature (predicts X, never used) a representation of X?**  
     - **Yes** → Proceed to 6.  
     - **No** → **Leaf F: Use-Dependent Realism**  
       *Awkward commitment: Features must have been used by the model to count as representations. Interp engineer might sign on.*  

  6. **Can a feature represent X if X lacks a human concept/word (wordless feature)?**  
     - **Yes** → Proceed to 7.  
     - **No** → **Leaf G: Anthropocentric Realism**  
       *Awkward commitment: Features can't represent realities beyond human concepts. Interp engineer unlikely.*  

  7. **Can a feature represent X if X doesn't exist (phlogiston feature)?**  
     - **Yes** → **Leaf H: Real-Patterns Realism**  
       *Awkward commitment: Representations exist if they compress/predict patterns, even of non-real things. Interp engineer might sign on.*  
     - **No** → **Leaf I: Veridical Realism**  
       *Awkward commitment: Representations must track real-world categories. Interp engineer unlikely.*  

  ---

  ### Leaf Descriptions
  - **A: Non-Empirical**: Upstream of evidence.  
  - **B: Form-Specific Realism**: Requires specific encodings (e.g., linear).  
  - **C: Functional-Role Realism**: Defined by interventions preserving behavior.  
  - **D: Causal-Units Realism**: Features are real causal units.  
  - **E: Deflationary/Illusionist**: Features are subjective descriptions.  
  - **F: Use-Dependent Realism**: Requires historical causal use.  
  - **G: Anthropocentric Realism**: Requires human-concept alignment.  
  - **H: Real-Patterns Realism**: Compress/predict ≈ real.  
  - **I: Veridical Realism**: Requires real-world reference.  

  ---

  ### Notes  
  **Indistinguishable Leaves**  
  - **C (Functional-Role) vs. D (Causal-Units)**: The tree doesn’t separate their views on non-human concepts (wordless) or non-real referents (phlogiston). Both are tested only on causal/functional criteria.  
  - **F (Use-Dependent) vs. D (Causal-Units)**: Ambiguous on whether "past use" suffices for representation post-shift (chameleon).  

  **Unoccupied Answer Combinations**  
  1. **0:Yes, 1:Yes, 2:No (→ B) + Chameleon inconsistency**:  
     *Diagnosis: Incoherent*—Rejects Model B’s representation but must accept chameleon (if used in-distribution).  
  2. **0:Yes, 1:No, 4:Yes, 5:No (→ F) + Wordless rejection**:  
     *Diagnosis: Unexplored*—Use-Dependent Realism doesn’t clarify if "X" can be wordless.  
  3. **0:Yes, 1:No, 4:Yes, 5:Yes, 6:Yes, 7:No (→ I) + Phlogiston acceptance**:  
     *Diagnosis: Unattractive*—Allows wordless representations but not coherent non-real ones.  

  **Engineer vs. Philosopher**  
  - **Interp engineers likely sign on**: C (Functional-Role), D (Causal-Units), H (Real-Patterns), F (Use-Dependent).  
  - **Philosophers only**: A (Non-Empirical), E (Deflationary), G (Anthropocentric), I (Veridical).  

  **Upstream of Evidence**: Only **Leaf A** (Non-Empirical). All others hold empirical results could settle the debate.  

