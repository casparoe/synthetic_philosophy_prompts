  Hmm, the user wants a careful comparison of two moral strategies - bridge and conversion - for extending the duty to aid from Singer's drowning child example to distant strangers. They've provided three specific test cases to evaluate which strategy holds up better. I need to analyze these cases strictly as stated, without referencing any authors or published works.

  The bridge strategy seems straightforward: it extends the drowning child intuition directly to global poverty through parity reasoning, ignoring distinctions like distance or institutional involvement. The conversion strategy takes a different route by reframing the duty as one of avoiding complicity in harm rather than rescue. Both aim for demanding altruism but through different moral pathways.

  Looking at the test cases:

  For unattributable peril (case one), bridge strategy would say I must save one child since I can prevent great harm at trivial cost. Conversion strategy faces a problem here because I don't know which child I've harmed, so I can't target my duty appropriately. This seems to force conversion toward bridge-style reasoning.

  In clean hands (case two), conversion strategy has a clear answer: Aida owes nothing since she's completely disconnected from harmful systems. But bridge strategy would demand she save the child regardless. The plausibility depends on whether we think institutional connection matters for moral duty.

  The overdetermined pond (case three) is most interesting. Conversion strategy can say each dropper has a duty to save the child because they're actively contributing to harm, even if their individual drop doesn't matter. Bridge strategy would also say each should save the child, but struggles to explain why they're more obligated than a random passerby.

  Comparing the strategies:
  - On demandingness, conversion has a natural stopping point (when complicity ends) while bridge stops only when costs become comparable to the harm prevented.
  - On duty direction, conversion targets those we've harmed through institutions, while bridge applies to anyone in need.
  - On epistemic burden, conversion requires knowing about one's complicity, which can be complex, while bridge just needs knowledge of suffering and cost-effective solutions.

  In case one, conversion must borrow from bridge; in case two, it stands firm but may seem counterintuitive; in case three, it actually explains the intuition better than bridge does. Case three feels strongest to me because it captures our sense that contributors have special obligations beyond bystanders.

  I think conversion is stronger overall despite its struggles with case one. The overdetermination case reveals something deep about collective harm that bridge misses. The strongest objection is that conversion can't handle unattributable peril, but I'd argue that in such cases we default to bridge-style duties precisely because we can't fulfill our complicity-based duties.

  Final verdict: conversion, with bridge filling gaps when complicity is unattributable.
answer: |-
  ### Comparison of Bridge and Conversion Strategies

  The bridge and conversion strategies both aim to extend the intuition from Singer's drowning-child case—that agents must prevent grave harm at trivial cost—to a demanding duty to aid distant strangers. The bridge strategy achieves this by eliminating morally irrelevant differences (e.g., distance, institutional mediation), while the conversion strategy reinterprets the duty as one of rectifying complicity in systemic harm. Using the three stipulated cases, this analysis evaluates which strategy is stronger based on demandingness, duty direction, epistemic burden, and guidance.

  #### **I. Core Differences**
  - **Bridge Strategy**: Derives a positive duty directly from cost-benefit comparison. The agent must aid until further sacrifice is comparable to the harm averted. The duty is owed to anyone in need, discharged by resource transfers, and requires minimal knowledge: only that aid is effective and affordable.
  - **Conversion Strategy**: Grounds duty in avoiding/complicity in harm. The agent must exit harmful institutions and compensate victims. The duty stops when complicity ceases, is owed only to those harmed by the agent’s institutions, and requires detailed causal knowledge (e.g., how institutions cause harm).

  #### **II. Evaluation Using Test Cases**
  **Case One: Unattributable Peril**  
  *Scenario*: You caused one of three drownings but cannot identify which child is "yours." You can save one.  
  - **Bridge**: You must save one child. The stakes (life saved) vastly outweigh the cost (ruined shoes), and features like fault or identifiability are irrelevant. The stopping point is after saving one, as you cannot do more.  
  *Plausibility*: Intuitive for demandingness but ignores the intuition that fault heightens obligation.  
  - **Conversion**: You have a strict duty to aid the child you harmed but cannot identify them. Absent knowledge, you cannot target your duty. To act, you must borrow bridge reasoning: save any child since all need aid and you caused one’s peril.  
  *Plausibility*: Borrowing undermines conversion’s distinct grounding (complicity), as it defaults to cost-benefit. It struggles to explain why you are *especially* bound beyond a bystander.  

  **Case Two: Clean Hands**  
  *Scenario*: Aida, entirely disconnected from institutions, receives $20K. She can save a life for $200.  
  - **Bridge**: Aida must save the child. The cost is trivial relative to the harm, and her institutional history is irrelevant. She must give until further giving sacrifices comparably to a life.  
  *Plausibility*: Demandingness is preserved, but it conflicts with the intuition that disconnected agents might have lesser duties.  
  - **Conversion**: Aida owes nothing. She bears no complicity; her hands are clean. The duty arises only from participation in harmful systems, which she avoided. No aid is required.  
  *Plausibility*: Intuitively limits duty but seems underdemanding—why should institutional distance negate the ability to prevent death at low cost?  

  **Case Three: Overdetermined Pond**  
  *Scenario*: A thousand agents each add a drop to drown a child; no drop is causal, but each could save the child cheaply.  
  - **Bridge**: Each agent must save the child. Cost is trivial, stakes are high, and overdetermination is irrelevant. However, it cannot explain why droppers are *more* obligated than a passerby who could also save the child.  
  *Plausibility*: Demandingness is upheld, but ignores the intuition that contributors have stronger duties.  
  - **Conversion**: Each dropper has a stringent duty. By contributing to harm (even if non-causal), they are complicit and must exit the harmful act (withhold the drop) *and* save the child to rectify harm. The duty is owed specifically to this victim.  
  *Plausibility*: Best captures the intuition that contributors are uniquely bound. Stopping point is clear: save the child and cease contributing.  

  #### **III. Comparative Strengths and Weaknesses**
  - **Demandingness and Stopping Points**:  
    Bridge sets a clear but potentially limitless threshold (aid until cost ≈ harm). Conversion naturally limits duty to rectifying complicity but risks underdemandingness in clean cases (e.g., Aida). Conversion’s stopping point (end complicity) is more precise but less flexible when harm is unattributable.  
  - **Duty Direction and Content**:  
    Bridge directs aid to *anyone* in need via transfers. Conversion directs duties only to *harmed parties* via compensation, exit, or reform. Bridge is simpler but overinclusive; conversion is targeted but exclusionary (e.g., Aida owes no one).  
  - **Epistemic Burden**:  
    Bridge requires only empirical knowledge of aid efficacy. Conversion demands causal knowledge of institutional harm, which is often unavailable (e.g., unattributable peril). When knowledge fails, conversion collapses into bridge reasoning.  
  - **Guidance in Cases**:  
    Conversion falters in **case one** (unattributable harm forces borrowing) and **case two** (clean hands yield no duty, counterintuitively). It excels only in **case three** (explains contributor obligations). Bridge handles **case one** and **case two** consistently but poorly explains **case three** (why droppers > bystanders?).  

  #### **IV. Verdict and Objection**
  **Hybrid Strategy: Conversion Grounding, Bridge Guidance**  
  The conversion strategy is stronger for *grounding* duties because it better captures intuitions about complicity (e.g., case three) and provides a principled limit to demandingness. However, it fails when complicity is unattributable or absent. Here, the bridge strategy provides essential *guidance*: when agents cannot identify victims or are institutionally disconnected, they default to a cost-benefit duty to aid anyone in need. This hybrid preserves conversion’s core insight—that duties arise from relational harm—while using bridge to handle edge cases.  

  - **Strongest Objection**: Hybridity is ad hoc. If conversion borrows bridge reasoning in unattributable cases, it abandons its grounding and becomes redundant.  
  - **Reply**: The hybrid is coherent. Conversion defines the *source* of duty (complicity), while bridge defines a *fallback action* when complicity cannot be enacted. This mirrors moral practice: we prioritize rectifying harm we cause but aid strangers when specific responsibility is obscured.  

  **Weighting the Cases**: Case three is decisive. It reveals that conversion uniquely accounts for collective harm intuitions, while bridge cannot. Cases one and two show conversion’s limits but do not defeat its core advantage in grounding.  

  Verdict: hybrid  

  Verdict: hybrid
