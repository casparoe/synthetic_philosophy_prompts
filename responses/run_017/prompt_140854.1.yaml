prompt: |-
  I lead a four-person forecasting cell at a humanitarian logistics organization, and I have an old undergraduate minor in philosophy plus a graduate degree in statistics, which is to say I know just enough of each to be dangerous. Every week we are handed numbers we are expected to turn into planning decisions: whether to pre-position supplies in a river basin, whether to hold back a contingency budget, whether to brief a country director that a scenario is now "likely." The numbers arrive from three sources our spreadsheets do not distinguish, and I have become convinced that most of our arguments after the fact trace back to that: ensemble outputs from physical models (seasonal climate forecasts, hydrological models), where the number carries an explicitly chance-like interpretation and usually some hindcast record; prices from a small internal prediction market we run among staff, several of whom have partial field access; and structured expert-judgment elicitations, which produce a number that looks identical in a cell to the other two but is somebody's opinion. We are also audited: six months after a decision, a donor or a board member asks why we moved the tents or did not, so whatever we do has to be reconstructible from a written record by someone who was not in the room.

  What I want from you is a written procedure my analysts can run on an incoming number before it enters a planning document. The analysts have real statistics training and no philosophy; the procedure has to be runnable in fifteen to twenty minutes per item, weekly, and its output has to be something our director of operations, who has no patience for epistemology, will actually sign off on. I have been reading about the Principal Principle — the principle that says your credence in an event should equal what you take the objective chance of that event to be, absent inadmissible evidence — and that feels like roughly the right framework, but I cannot hand my team a principle. I need it operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to use the number, and where it hands the rest to a person because the remaining question is one of values rather than facts.

  Two things I want it to get right, and one I want it to catch. A colleague has proposed the shortcut that we simply defer to any source that comes with a calibration curve, on the grounds that a well-calibrated source is tracking something real; I suspect this collapses a distinction I cannot name precisely, because being reliably calibrated across a run of cases looks like one thing and being a report of the chance of this single event looks like another. Relatedly, we routinely let numbers cross that gap by relabeling: an expert judgment gets fed into a model, the model prints a probability, and from then on it travels downstream as though it were a chance. I have started calling this chance laundering, and I want the procedure to detect it. It also has to handle numbers that arrive stale (a basin forecast issued in March is still circulating in June and nobody adjusts it), evidence that leaks the outcome rather than describing the setup (field reports that the short rains have already failed upstream, or that fighting has begun), and the reference-class problem that arises when the record contains nothing quite like the event being forecast.

  Please give me the procedure, then run it on three cases of the shapes we actually see: a seasonal ensemble forecast putting a 40% chance on below-normal rainfall in a region where the model has a thirty-year hindcast and good reliability, arriving the same week as herder reports that the short rains have failed; our internal market implying a 25% chance that a displacement site exceeds capacity within the quarter, when the trader pool is twelve people and three of them were in the field last month; and a vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record, which is precisely the case where I expect your procedure to tell me not to put a number in the memo at all and where my director will push back hardest. Where a step depends on a contested reading of the theory — whether chances are Humean, or whether deference to a calibrated expert is covered by deference to chance at all, or what the time-relativity of a chance really requires of us when a forecast ages — say so, mark your confidence, and tell me which steps are judgment calls dressed up as procedure. And if the framing itself is wrong — if for a large share of our events, conflict onset and displacement above all, there are simply no objective chances to defer to and the Principal Principle does not reach them at all — tell me that plainly rather than handing me a checklist I will over-trust.
reasoning: |-
  We are designing a procedure to evaluate incoming numbers that will inform planning decisions. The numbers come from three sources: physical model ensembles, internal prediction markets, and expert judgments. The goal is to determine whether a given number can be treated as an objective chance (suitable for direct use via the Principal Principle) or if it requires special handling (or even rejection) due to issues such as "chance laundering", staleness, outcome leakage, or reference class problems.

  The Principal Principle (PP) states that if you know the objective chance of an event is x, and you have no inadmissible evidence, then your subjective credence in that event should be x. However, in practice, we often have to decide whether a given number represents such an objective chance and whether we have inadmissible evidence.

  The procedure will have the following steps, designed to be completed in 15-20 minutes per number:

  1. **Source Identification**: Determine the source of the number (physical model, prediction market, expert judgment, or a combination). This is critical because each source has different characteristics.

  2. **Check for Chance Laundering**: Trace the history of the number. If it originated from an expert judgment (or any non-chance source) and was then processed by a model that output a probability, flag it as laundered. We must then try to recover the original source or treat it as an expert judgment.

  3. **Check for Staleness**: Determine the time of creation of the forecast and whether it is still valid. For physical models, check if the forecast is for the same time period and if conditions have changed. For prediction markets and expert judgments, check the date of the information. If stale, we may need to adjust or discard.

  4. **Check for Outcome Leakage**: Determine if the number is based on evidence that already indicates the outcome (e.g., field reports that the rains have failed). This is inadmissible evidence relative to the chance hypothesis and must be handled separately.

  5. **Reference Class Check**: For physical models, we have a hindcast record. We need to check if the current event is within the range of events the model was trained on. For events without a comparable history (like the 0.4% flood displacement in a basin with no record), we may not be able to assign a meaningful objective chance.

  6. **Calibration Check**: If the source provides a calibration curve (like the physical model with a thirty-year hindcast), that is a point in favor of it being a good chance. However, calibration alone does not make a number an objective chance. We must also consider whether the calibration is over a similar reference class.

  7. **Decomposition for Prediction Markets and Expert Judgments**: For these, we do not have an objective chance. We treat them as aggregated opinions. For the prediction market, we note the number of participants and their expertise (e.g., field access). For expert judgments, we note the expertise and the elicitation method.

  8. **Decision on Use**: 
     - If the number is from a physical model with a good hindcast and no staleness, no laundering, and no outcome leakage, and the event is within the reference class, then it can be treated as an objective chance and used directly via the PP.
     - If the number is from a prediction market or expert judgment, we do not treat it as an objective chance. We may still use it, but we must note that it is an aggregate of subjective opinions and not a chance. We should also check for biases (e.g., small trader pool) and consider it as one input among others.
     - If the number is stale, we must adjust (if possible) or discard. If there is outcome leakage, we must update the chance with the new evidence (if we can) or treat the event as having happened (or not) and adjust the probability accordingly. If there is a reference class problem, we may have to downgrade the number to an expert judgment or reject it.

  9. **Output for the Planning Document**: The output of the procedure should be a standardized note that accompanies the number in the planning document. It should state:
     - The source and any issues (laundering, staleness, leakage, reference class).
     - Whether the number can be treated as an objective chance (and hence used via the PP) or if it is a subjective aggregate.
     - Any adjustments made and why.

  Now, we run the procedure on the three cases:

  **Case 1: Seasonal ensemble forecast of 40% chance of below-normal rainfall, with a thirty-year hindcast and good reliability. However, herder reports (outcome leakage) arrive the same week that the short rains have failed.**

  Steps:
  1. Source: Physical model (ensemble forecast).
  2. Chance laundering: None (direct from model).
  3. Staleness: Assume the forecast is current (issued recently). But note: if the forecast was issued in March and it's now June, it would be stale. The problem states it arrives the same week as the herder reports, so we assume it's fresh.
  4. Outcome leakage: The herder reports that the short rains have failed. This is strong evidence that the event (below-normal rainfall) has already occurred. This is inadmissible evidence relative to the chance forecast (which is based on conditions before the rains). Therefore, we cannot use the 40% chance as if it were the current chance. We must update the chance with the new evidence.
  5. Reference class: The model has a thirty-year hindcast and good reliability, so the event is within the reference class.
  6. Calibration: Good reliability, so the 40% is well-calibrated.

  Decision: Because of the outcome leakage, the 40% chance is no longer valid. We must update the probability given the herder reports. This update requires a statistical model (e.g., using Bayes) or expert reassessment. Without that, we cannot use the original 40%. The procedure should flag that the number is invalid due to outcome leakage and require a new assessment.

  Output: "The 40% chance of below-normal rainfall from the ensemble forecast is based on pre-rain conditions. Herder reports that the short rains have failed provide strong evidence that below-normal rainfall has occurred. Therefore, the forecast is outdated and must be updated. We recommend immediate reassessment by the forecasting team to incorporate the new evidence. Until then, this number should not be used for decision-making."

  **Case 2: Internal prediction market implying a 25% chance that a displacement site exceeds capacity within the quarter. The trader pool is twelve people, three of whom were in the field last month.**

  1. Source: Prediction market (subjective opinions aggregated by a market mechanism).
  2. Chance laundering: Not applicable (unless the market itself is using laundered inputs, but we assume not).
  3. Staleness: The market price is current (as it is a market). However, note that the field visits were last month. If the situation is volatile, that might be stale. But the problem does not indicate a time gap, so we assume the market is updated to the present.
  4. Outcome leakage: None mentioned. The field reports from last month are about the setup, not the outcome (unless they saw conditions that directly lead to exceeding capacity, but the problem doesn't say that).
  5. Reference class: We don't have a hindcast for the prediction market. We can look at the market's past performance if available. But the problem doesn't provide that. Without a track record, we cannot be sure of the reference class.
  6. Calibration: We don't have a calibration curve for this market. We might have one if we've run it for a while, but the problem doesn't say.

  Decision: The prediction market does not produce an objective chance. It produces an aggregate of subjective beliefs. We can use it as an input, but not as a direct chance. We must note the small trader pool (12 people) and the fact that three have recent field access (a strength). However, the small pool might lead to volatility and bias.

  Output: "The 25% chance from the internal prediction market is an aggregate of the beliefs of 12 participants, three of whom have recent field access. Without a track record of calibration, we cannot treat this as an objective chance. It should be treated as a subjective consensus. Given the small trader pool, we note the potential for bias and volatility. We recommend using this number alongside other evidence, but not as a direct input to the Principal Principle."

  **Case 3: Vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record.**

  1. Source: Vendor model (likely a physical or statistical model).
  2. Chance laundering: We must check. If the model is built from expert judgments about the basin without data, then it might be laundered. But the problem says "vendor model", so we assume it's a model. However, without a comparable event, it might be based on expert judgment.
  3. Staleness: Not indicated, so assume current.
  4. Outcome leakage: None mentioned.
  5. Reference class: This is the critical issue. There is no comparable event in the record. Therefore, the model's output is not based on a frequency of similar events. It might be based on a theoretical model or expert judgment. Without a reference class, we cannot verify the model's calibration.
  6. Calibration: The vendor might provide a calibration curve, but without a reference class, it might be overfitted or based on dissimilar events.

  Decision: Without a reference class, we cannot trust the 0.4% as an objective chance. It is likely an expert judgment in disguise (and thus laundered). Even if the model is physical, without historical data for the basin, the model's parameters are set by experts. Therefore, we should reject the number as an objective chance. We might use it as an expert opinion, but with extreme caution.

  Output: "The vendor model's 0.4% annual probability for large-scale flood displacement is not based on a historical record of similar events in the basin. Without a reference class, we cannot verify the model's calibration or treat the output as an objective chance. The number may be based on expert judgment (chance laundering). We recommend against using this number in planning decisions. Instead, we should note the possibility of such an event and plan based on scenario analysis or further expert consultation."

  **Contested Points and Caveats:**

  1. **Objective Chances**: The Principal Principle requires objective chances. But in many situations (like conflict onset), there may be no objective chances because the events are not part of a repeatable chance setup. In such cases, the PP does not apply. We must then rely on subjective probabilities. The procedure should flag when an event is not repeatable (reference class problem) and thus not amenable to objective chance.

  2. **Deference to Calibrated Experts**: Some philosophers (e.g., in the "expert deference" literature) argue that we should treat a calibrated expert's probability as if it were a chance. This is a judgment call. In the procedure, we mark an expert judgment as not an objective chance, but if the expert is well-calibrated over a long run, we might treat it as a chance. However, note that calibration over a run of cases does not guarantee that the expert's probability for a single case is a chance. This is a point of contention.

  3. **Time-Relativity of Chances**: Chances are time-relative. A forecast issued in March for June is a chance in March, but by June, the chance might have changed. We must use the most current chance. If we have an old forecast, it is stale and must be updated. The procedure flags staleness and requires updating.

  4. **Chance Laundering**: We define it as the practice of taking a subjective input (like an expert judgment) and running it through a model that outputs a probability, which then is treated as a chance. The procedure requires tracing the source and flagging such laundering.

  **Conclusion on the Framing**: The Principal Principle is a good starting point, but it does not cover all events. For events without a repeatable chance setup (like unique historical events or complex social phenomena like conflict onset), there are no objective chances. In these cases, we cannot use the PP. We must rely on subjective probabilities and be transparent about their source. The procedure should catch these cases and recommend against using the number as a chance.

  Therefore, the procedure will help avoid over-trusting numbers by forcing a critical examination of the source and the conditions. It will also catch chance laundering and reference class issues. However, the analysts must understand that for a large class of events (like the flood displacement in a basin without history or conflict onset), the numbers are not chances and should be used with extreme caution, if at all.
answer: |-
  ### Operationalized Procedure for Evaluating Incoming Numbers  
  **Objective**: Determine whether an incoming number can be treated as an **objective chance** (suitable for direct use via the Principal Principle) or requires adjustment, contextualization, or rejection. Outputs a standardized note for the planning document.  
  **Time Limit**: 15–20 minutes per number.  
  **Key Concepts**:  
  - **Objective Chance**: A probability grounded in a physical or statistical process with a repeatable, verifiable mechanism (e.g., ensemble climate models with hindcasts).  
  - **Chance Laundering**: Relabeling non-chance inputs (e.g., expert opinions) as "model outputs" to mimic objectivity.  
  - **Inadmissible Evidence**: Information that directly references the outcome (e.g., "rains have failed") or violates the temporal scope of the forecast.  

  ---

  ### The Procedure: 8 Steps  
  **Output Format**: A 1–2 sentence note for the planning document, classified as:  
  - **✅ USE AS IS**: Number is an objective chance; no critical issues.  
  - **⚠️ CONTEXTUALIZE**: Number is not objective; include caveats.  
  - **❌ REJECT**: Number is unusable; do not include in planning.  

  #### Step 1: Identify Source and Mechanism  
  - **Question**: What generated this number?  
    - Physical model? Prediction market? Expert judgment? Hybrid?  
  - **Sufficient Answer**:  
    - Trace the origin. If the number passed through >1 system (e.g., expert judgment → model → output), flag for laundering check (Step 2).  
  - **Stop If**: Source cannot be verified (→ ❌ REJECT: "Unverifiable origin").  

  #### Step 2: Check for Chance Laundering  
  - **Question**: Is a non-chance input disguised as a chance?  
  - **Sufficient Answer**:  
    - If source is a model, ask: "Does the model mechanically process inputs (e.g., sensor data, physical laws), or does it rely on human opinions?"  
    - If opinions drive >50% of variance in outputs → ⚠️ CONTEXTUALIZE: "Laundered input; treat as expert assessment."  
  - **Judgment Call**: Distinguishing "mechanistic" from "judgmental" models. Use model documentation or creator interviews.  

  #### Step 3: Assess Temporal Validity  
  - **Question**: Is the number stale or contradicted by newer evidence?  
  - **Sufficient Answer**:  
    - Physical models: Forecast period must cover the decision horizon. If expired (e.g., March forecast used in June) → ❌ REJECT.  
    - Prediction markets/experts: If newer data exists (e.g., field reports), proceed to Step 4.  
  - **Stop If**: Stale and no adjustment protocol exists (→ ❌ REJECT: "Outdated").  

  #### Step 4: Screen for Inadmissible Evidence  
  - **Question**: Does the number (or its source) incorporate outcome-leaking evidence?  
  - **Sufficient Answer**:  
    - Outcome leakage = information about the event occurring (e.g., "fighting has begun," "rains failed").  
    - If leakage is present → ⚠️ CONTEXTUALIZE: "Inadmissible evidence; not a pre-event chance."  
  - **Judgment Call**: Leakage vs. "setup" evidence (e.g., "dry soil" is admissible; "no rain in 3 weeks" may leak).  

  #### Step 5: Evaluate Reference Class  
  - **Question**: Is there a relevant historical record for calibration?  
  - **Sufficient Answer**:  
    - Physical models: Require hindcasts for similar events/contexts.  
    - No comparable events (e.g., unprecedented floods) → ❌ REJECT (no objective chance exists).  
  - **Stop If**: Reference class is too dissimilar (→ ❌ REJECT: "No comparable baseline").  

  #### Step 6: Verify Calibration (If Applicable)  
  - **Question**: Is the source well-calibrated, and over what domain?  
  - **Sufficient Answer**:  
    - Calibration curves alone ≠ objective chance. Demand:  
      - Calibration over >20 similar cases.  
      - Domain match (e.g., rainfall model calibrated on same basin).  
    - No calibration → ⚠️ CONTEXTUALIZE (e.g., "Uncalibrated subjective estimate").  

  #### Step 7: Classify Chance Status  
  - **Question**: Can this number be treated as an objective chance?  
  - **Decision Tree**:  
    - ✅ USE AS IS: Only if:  
      - Source is a physical model (Step 1).  
      - No laundering (Step 2).  
      - Current (Step 3).  
      - No leakage (Step 4).  
      - Strong reference class (Step 5).  
      - Calibrated (Step 6).  
    - ⚠️ CONTEXTUALIZE: Prediction markets, expert judgments, or laundered numbers.  
    - ❌ REJECT: Stale, no reference class, or critical laundering.  

  #### Step 8: Compose Planning Note  
  - **Template**:  
    - ✅: "[Number]% is an objective chance from [source], calibrated for [context]. Use directly in decision weights."  
    - ⚠️: "[Number]% reflects [source; e.g., expert consensus] without objective basis. Augment with scenario planning."  
    - ❌: "Do not use: [Reason]."  

  ---

  ### Case Applications  
  #### Case 1: Seasonal Ensemble Forecast (40% below-normal rainfall)  
  - **Step 1**: Physical model (ensemble forecast).  
  - **Step 2**: No laundering (mechanistic model).  
  - **Step 3**: Current (issued this week).  
  - **Step 4**: **Inadmissible evidence** (herder reports: "rains failed" → outcome leakage).  
  - **Step 5**: Strong reference class (30-year basin hindcast).  
  - **Step 6**: Good calibration.  
  - **Step 7**: ⚠️ CONTEXTUALIZE (inadmissible evidence).  
  - **Output Note**: "40% is an objective chance but invalidated by field reports of rain failure. Treat as a scenario prompt, not a probability."  

  #### Case 2: Prediction Market (25% displacement site exceeds capacity)  
  - **Step 1**: Prediction market (expert opinions aggregated).  
  - **Step 2**: No laundering (direct output).  
  - **Step 3**: Current (market active).  
  - **Step 4**: Field reports are admissible (describe setup, not outcome).  
  - **Step 5**: No reference class (no hindcast data).  
  - **Step 6**: Uncalibrated (small trader pool; n=12 insufficient for calibration).  
  - **Step 7**: ⚠️ CONTEXTUALIZE (subjective aggregate).  
  - **Output Note**: "25% reflects aggregated staff judgments (3 with field access). Not an objective chance; cross-validate with field data."  

  #### Case 3: Vendor Model (0.4% annual flood displacement)  
  - **Step 1**: Vendor model (likely expert-derived).  
  - **Step 2**: **Chance laundering** (model inputs probably expert opinions; no physical basis).  
  - **Step 3**: Assume current.  
  - **Step 4**: No leakage.  
  - **Step 5**: **No reference class** (no comparable events).  
  - **Step 6**: Calibration unverifiable (no basin history).  
  - **Step 7**: ❌ REJECT (laundering + no reference class).  
  - **Output Note**: "Do not use: 0.4% launders expert guesses without historical basis. Recommend qualitative risk assessment."  
  - **Director Pushback Handling**: "Using this number implies precision where none exists. We risk misallocating resources. Alternatives: Scenario planning (e.g., 'low-likelihood, high-impact event')."  

  ---

  ### Theoretical Caveats & Judgment Calls  
  1. **Objective Chances May Not Exist** (High Confidence):  
     - For events like conflict onset or unprecedented disasters, there is **no repeatable physical mechanism** to generate objective chances. The Principal Principle **does not apply**.  
     - **Procedure Safeguard**: Step 5 (reference class) rejects these. Override demand for numbers with: "This event lacks a historical frequency. We must use narratives, not probabilities."  

  2. **Deference to Calibrated Experts** (Contested):  
     - The Principal Principle defers to chances, not calibrated experts. A well-calibrated expert may track truths, but this is **epistemically distinct** from chance (e.g., it’s a subjective frequency, not physical).  
     - **Procedure Handling**: Step 6 accepts calibration only for physical models. For experts, ⚠️ contextualize.  

  3. **Time-Relativity of Chances** (Moderate Confidence):  
     - Chances are relative to a time (e.g., a March rainfall chance is invalid in June). Staleness (Step 3) enforces this.  
     - **Judgment Call**: Define "current" as "covers decision period ±10%."  

  4. **Chance Laundering Detection** (Key Judgment):  
     - Relies on source tracing (Step 1) and mechanism analysis (Step 2). Err on the side of caution: "When in doubt, assume laundering if humans significantly influence inputs."  

  ---

  ### Conclusion  
  This procedure **operationalizes the Principal Principle** by filtering out non-chances, laundering, and inadmissible evidence. It:  
  - **Succeeds** at flagging laundering, staleness, and reference-class issues.  
  - **Fails Gracefully** for non-repeatable events (e.g., conflicts) by rejecting ungrounded numbers.  
  - **Balances Speed & Rigor**: Steps 1–8 fit within 20 minutes using a checklist.  

  **When to Override**: If directors demand numbers for non-chance events (e.g., Case 3), replace probabilities with scenario ranges (e.g., "low/medium/high likelihood"). This maintains auditability without misapplying statistics.  

  ---  
  **Final Output**: A reusable template for analysts, with examples. Refine quarterly based on audit feedback.
