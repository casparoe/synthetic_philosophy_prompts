answer: |-
  Below is a decision tree designed to move writers from concrete production choices to a named ethical position, avoiding abstract debates about moral standing. Built from your specified cases and pet distinctions, it uses 7 binary branch questions (within the 8-cap) and generates 8 distinct leaves. The tree prioritizes desk-level decisions over labels, incorporates attention scarcity and the two-audience problem as structural branches, and exposes unoccupied combinations in the logical space.

  ### Key Features:
  - **Branches** are concrete decisions from your cases (e.g., inventing events, compositing characters).  
  - **Leaves** are named positions (7 named, 1 "unnamed") with their "most awkward commitment" — a consequence writers might resist.  
  - **Logical gaps** identify 3 unoccupied combinations (2 unattractive, 1 incoherent).  
  - **Indistinguishable leaves**: The tree cannot separate decisions about **biased records (Case 5)** or **villainizing minor figures (Case 7)** from broader patterns; these are noted below.  
  - **Pet distinctions integrated**:  
    - *Attention scarcity* (Q1) addresses canon/opportunity cost.  
    - *Two-audience problem* (Q2) splits duties to the person vs. audience expectations.  

  ---

  ### Decision Tree  
  *(Start at Q1; follow answers to branches)*  

  **Q1: When selecting a subject, do you prioritize dramatizing underrepresented stories to correct cultural gaps?**  
  - *Yes* → Focus on canon impact → **Q2**  
  - *No* → Focus on story/artistic merit → **Q2**  

  **Q2: Do you expect audiences to treat your work as historically authoritative?**  
  - *Yes* → Audiences may conflate drama with history → **Q3**  
  - *No* → Audiences view it as invention → **Q3**  

  **Q3: Would you invent a pivotal event (e.g., a sex scene) between real people with no archival support?**  
  - *Yes* → Prioritize narrative/theme over record → **Q4**  
  - *No* → Require archival basis for key events → **Q4**  

  **Q4: Would you move a real speech to a different time/person for dramatic cohesion?**  
  - *Yes* → Alter chronology for story flow → **Q5**  
  - *No* → Preserve event timing/attribution → **Q5**  

  **Q5: Would you merge minor real people into a composite character?**  
  - *Yes* → Simplify for clarity → **Q6**  
  - *No* → Preserve individual identities → **Q6**  

  **Q6: If a subject’s memoir conflicts with archives, would you side with the archives?**  
  - *Yes* → Trust documentation over self-portrayal → **Q7**  
  - *No* → Trust self-portrayal as authentic → **Q7**  

  **Q7: Would you portray someone who explicitly forbade it in writing?**  
  - *Yes* → Override personal prohibition → **Leaf**  
  - *No* → Respect documented refusal → **Leaf**  

  ---

  ### Leaves (Named Positions)  
  *Each leaf’s "awkward commitment" highlights a tough trade-off.*  

  1. **Canon-Liberation Revisionist**  
     - *Path*: Yes (Q1), Yes (Q2), Yes (Q3), Yes (Q4), Yes (Q5), Yes (Q6), Yes (Q7)  
     - **Awkward commitment**: You must accept that overriding a subject’s explicit refusal (Case 6) for "greater good" canon correction risks weaponizing their trauma for your agenda.  

  2. **Fidelity Conservative**  
     - *Path*: No (Q1), Yes (Q2), No (Q3), No (Q4), No (Q5), No (Q6), No (Q7)  
     - **Awkward commitment**: You cannot dramatize anyone who refused portrayal (Case 6) or reshape timelines (Case 2), even if it leaves toxic myths unchallenged.  

  3. **Narrative Pragmatist**  
     - *Path*: No (Q1), No (Q2), Yes (Q3), Yes (Q4), Yes (Q5), Yes (Q6), Yes (Q7)  
     - **Awkward commitment**: You must defend inventing intimate scenes (Case 1) as harmless because "no one is harmed," while dismissing how it might cement salacious lies.  

  4. **Self-Portrayal Purist**  
     - *Path*: Any (Q1), Any (Q2), No (Q3), No (Q4), Any (Q5), No (Q6), No (Q7)  
     - **Awkward commitment**: You must side with a subject’s memoir (Case 4) even if it whitewashes harm they caused, because their self-view is sacred.  

  5. **Contextual Remediator**  
     - *Path*: Yes (Q1), No (Q2), No (Q3), Any (Q4), Yes (Q5), Yes (Q6), No (Q7)  
     - **Awkward commitment**: You cannot dramatize subjects who refused (Case 6), forcing you to use composites (Case 3) for marginalized stories, anonymizing real struggles.  

  6. **Archival Humanist**  
     - *Path*: Yes (Q1), Yes (Q2), No (Q3), No (Q4), No (Q5), Yes (Q6), No (Q7)  
     - **Awkward commitment**: You must reject composites (Case 3) and invented events (Case 1) for underrepresented stories, even if it makes them harder to dramatize compellingly.  

  7. **Unnamed (Rare Hybrid)**  
     - *Path*: Yes (Q1), No (Q2), No (Q3), Yes (Q4), No (Q5), Yes (Q6), Yes (Q7)  
     - **Awkward commitment**: You accept moving speeches (Case 2) to tighten pacing but reject composites (Case 3), creating a bloated cast that confuses audiences.  

  8. **Dramatic Ethicist**  
     - *Path*: No (Q1), Yes (Q2), Yes (Q3), Yes (Q4), Yes (Q5), No (Q6), No (Q7)  
     - **Awkward commitment**: You prioritize audience engagement but must avoid contradicting self-portrayals (Case 4), even if it means softening a villain’s actions.  

  ---

  ### Logical Gaps & Incoherences  
  The tree reveals **3 unoccupied combinations** of answers:  
  - **Unattractive: "Ethical but Inert"** (No to Q1, Yes to Q2, No to Q3, No to Q4, No to Q5, Yes to Q6, **Yes** to Q7). Ignores canon gaps while overriding refusals (Case 6) without artistic payoff. Untried because it satisfies no one.  
  - **Unattractive: "Pragmatic Exploiter"** (Yes to Q1, Yes to Q2, Yes to Q3, Yes to Q4, Yes to Q5, **No** to Q6, **No** to Q7). Prioritizes canon correction but trusts memoirs (Case 4) over archives, risking hagiography. Rarely chosen as it undermines credibility.  
  - **Incoherent: "Contradictory Purist"** (Any Q1, No to Q2, **Yes** to Q3, **No** to Q4, Any Q5, Any Q6, Any Q7). Invents events (Case 1) but won’t move a speech (Case 2)—illogically permits "big" lies but not "small" ones.  

  ---

  ### Indistinguishable Leaves & Pet Distinctions  
  - **The tree cannot separate**:  
    - **Biased records (Case 5)**: Writers in *all leaves* would reconstruct the subject’s perspective (if Q6=Yes) or trust the institution (if Q6=No). This correlates with Q6 (memoir vs. archive).  
    - **Villainizing minor figures (Case 7)**: This always aligns with Q3 (inventing events). If Q3=Yes, writers accept villainizing; if Q3=No, they reject it.  
  - **Pet distinctions as load-bearing**:  
    - **Two-audience problem (Q2)** splits leaves: When audiences treat drama as history (Q2=Yes), positions like "Fidelity Conservative" or "Canon-Liberation Revisionist" emerge, forcing trade-offs between authenticity and harm. When Q2=No, invention (Q3) is more permissible.  
    - **Attention scarcity (Q1)** is crucial: It creates distinct "canon-focused" leaves (e.g., "Contextual Remediator") that grapple with opportunity cost. Without it, the tree collapses into generic "duty to story" positions.  

  ---

  ### Why This Works for Your Workshop  
  - **Concrete over abstract**: Branches force decisions about scenes, speeches, and composites (Cases 1–4), not philosophical labels.  
  - **Students will recognize themselves**: "Narrative Pragmatist" (Leaf 3) and "Fidelity Conservative" (Leaf 2) mirror your described factions. "Archival Humanist" (Leaf 6) bridges both.  
  - **Gaps reveal dead ends**: Highlighting unattractive/incoherent combinations shows why certain stances are rare.  
  - **Efficiency**: 7 questions → 8 positions, with no reading lists.  

  This tree exposes how **production choices create ethical commitments**, not the reverse. By starting with "What will I do at my desk?" it bypasses the "owe the dead" loop.
