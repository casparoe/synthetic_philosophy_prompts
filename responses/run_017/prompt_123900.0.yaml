  For progress, the user wants concrete steps. Distinguishing the three theses helps clarify where disagreements lie. Formal models, like imprecise probabilities, could handle HOE by widening credence ranges instead of shifting them. Reframing the question to focus on functional roles of HOE (like triggering checks) might bypass the fixed-point problem. Also, accepting permanent divergence due to differing core commitments could be pragmatic, though unsatisfying.

