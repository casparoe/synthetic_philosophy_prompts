prompt: |-
  I'm putting together a handout for a third-year tutorial on blame and Ive been going round in circles trying to build one specific case, so I want you to build it for me. The topic is standing to blame and hypocrisy, and the case has to flip the usual ordering: the hypocrite — someone who is *currently*, unrepentantly doing the very thing they are blaming someone else for — has standing to blame, while a completely clean-handed person, who has never done anything remotely like it, lacks standing. And I don't mean lacks it in some weak advisory sense; I mean the strong thing, where the fitting response to their blame is: you are not in a position to say that to me. What the case is for is to make students see that standing might be a relation between blamer and blamed rather than a report card on the blamer, so anything that just stipulates that conclusion is cheating.

  Here is the part I can't get to work. I want one scenario, one paragraph, realistic — a workplace, a hospital ward, a restaurant kitchen, a university department, that sort of thing, no trolleys and no philosophers' dolls. Both blamers blame the same person for the same act, at the same moment, in more or less the same words, so the only things that vary are (i) dirty hands versus clean hands and (ii) inside the practice versus outside it. The hypocrite may not get standing from any of the usual escape hatches: no reform, no repentance, no apology on record, no punishment already served, no special role or authority over the person blamed, and the ongoing violation is recent and known. The clean-handed person may not lose standing for any of the usual reasons either: not complicit, not profiting from the violation, not misinformed, not motivated by spite, and not a stranger who wandered in off the street — they should know exactly what happened and be some kind of colleague, just not a participant in the practice whose norm was breached. Then the bit I actually care about: I want the case engineered so that three accounts come apart pairwise. Call them what you like, I don't want citations. (1) The forfeiture or tu quoque account: hypocrisy costs you standing, so it should say hypocrite no, clean-hands yes. (2) The equal-standing account: moral address among persons doesn't come in grades and dirty hands don't demote you, so it should say yes to both. (3) A relational account on which what matters isn't the state of your hands but whether you are inside the practice and exposed to being blamed back in the same coin: hypocrite yes, clean-hands no. My hunch is that (3) only wins if the violation is a breach of a norm internal to some shared practice rather than a plain moral wrong, because otherwise (2) grants the outsider standing for free and (3) collapses into (2) — build it that way if you agree, and tell me if you think the hunch is wrong.

  After the scenario, give me the verdict each of the three accounts gives and the reasoning that gets it there from that account's own commitments — I want to see the verdicts fall out, not be announced. Then: which single feature of the design is doing the work. Then a collapse test: what happens to the three-way spread if you clean the hypocrite's hands, if you swap the internal norm for a generic moral one, or if you make the outsider a full co-member. And finally the honest part: how would a defender of whichever account comes out worst attack the case — is someone going to say I built the verdict into the description of the practice, and is that a fair objection or just sour grapes?
reasoning: |-
  Okay, let me tackle this philosophy problem about blame and hypocrisy. The user wants a realistic case study that flips the usual standing-to-blame assumptions, where a hypocrite has standing while a clean-handed outsider doesn't. 

  First, I need to understand the core challenge: creating a scenario where three competing theories of blame standing give different pairwise verdicts. The theories are: (1) hypocrisy removes standing (tu quoque), (2) everyone has equal standing, and (3) standing depends on shared practice membership (relational). 

  Hmm, the hospital ward setting seems promising - it's a closed professional environment with strong internal norms. Let me build around that. The violation needs to be practice-specific, like skipping documentation protocols. For the hypocrite, I'll make them an unrepentant repeat offender who's currently violating the same norm. For the clean-handed person, they should be a non-clinical staff member who understands but doesn't participate in the practice. 

  Wait, the key is making the documentation norm clearly internal to clinical staff. That way: 
  - The hypocrite (clinician) is inside the practice and exposed to reciprocal blame
  - The outsider (IT specialist) is knowledgeable but not subject to the norm
  - Both blame the same junior doctor simultaneously

  I'll avoid all the forbidden escape hatches: no repentance from hypocrite, no malice from outsider. Now to test the theories:
  (1) Tu quoque says hypocrite loses standing (no), outsider keeps it (yes)
  (2) Equal standing says both can blame (yes/yes)
  (3) Relational says hypocrite has standing (yes), outsider doesn't (no)

  The collapse tests show which elements are crucial: if we make the hypocrite clean-handed, all theories converge. If we make the norm generic, relational collapses into equal standing. If we make the outsider a clinician, relational grants standing.

  For counterarguments: a tu quoque defender might claim the hypocrite's blame is defective regardless of practice membership. But is that fair? The case doesn't stipulate the relational view - it just creates conditions where practice-internality matters naturally. The objection feels like refusing to engage the thought experiment.

  The hospital scenario seems to work because: 
  - The norm is clearly practice-constituted
  - Reciprocal accountability is tangible
  - Outsider status is unambiguous
  - No extraneous factors muddy the waters

  This should help students see standing as relational rather than individual. I'll present it cleanly with clear theory applications and collapse tests.
answer: |-
  Here’s a realistic case designed to meet your specifications, followed by analysis, collapse tests, and objections:

  ---

  ### **Scenario: The ICU Charting Protocol**
  At City General Hospital, ICU nurses follow a strict protocol: all medication doses must be charted *immediately* after administration to prevent life-threatening errors. Dr. Lena, a junior resident, fails to chart a morphine dose for a post-op patient, citing urgent duties. Two colleagues witness this:  
  - **Dr. Ben**, a senior resident who openly admits he *also* skipped charting his last three doses* (unrepentant, no apology, currently violating).  
  - **Dr. Priya**, a research fellow (non-clinical, never treated ICU patients). Priya knows the protocol intimately from auditing ICU safety data but has never administered meds or been subject to charting rules.  

  Both approach Lena separately but simultaneously:  
  > **Ben**: "Lena, you *must* chart immediately. This isn’t optional."  
  > **Priya**: "Lena, you *must* chart immediately. This isn’t optional."  

  Lena’s retort to Priya: "You’ve never been in this position. You don’t get to say that to me."  
  To Ben, she sighs: "Fine, I know—I’ll fix it."  

  ---

  ### **Verdicts by Account**  
  1. **Forfeiture (Tu Quoque)**:  
     - *Hypocrite (Ben)*: **No standing** (He’s actively violating the same norm; his blame is discredited by his own conduct).  
     - *Clean-Hands (Priya)*: **Has standing** (She’s never breached the norm; her blame is legitimate).  
     *Reasoning*: Blame requires moral consistency. Ben’s hypocrisy forfeits his standing; Priya’s integrity grants hers.  

  2. **Equal Standing**:  
     - *Ben*: **Has standing** (All moral agents can hold others accountable).  
     - *Priya*: **Has standing** (All moral agents can hold others accountable).  
     *Reasoning*: Standing is universal. Moral address doesn’t depend on personal history or role—only on recognizing wrongdoing.  

  3. **Relational (Practice-Internality)**:  
     - *Ben*: **Has standing** (As a co-participant in the ICU practice, he’s subject to the same norms and reciprocal blame).  
     - *Priya*: **No standing** (Despite knowledge, she’s *outside* the practice; she isn’t vulnerable to being blamed *in the same way*).  
     *Reasoning*: Standing arises from mutual accountability within a shared practice. Ben is exposed to Lena’s future blame (e.g., "You skip it too!"), creating symmetrical authority. Priya faces no such exposure—she can’t be "called out" for charting failures.  

  ---

  ### **Key Feature Doing the Work**  
  **The norm’s practice-internality**: The charting rule isn’t a universal moral norm (like "don’t lie") but a *constitutive rule of the ICU practice*. Only those embedded in the practice (subject to its demands and reciprocal blame) have standing.  

  ---

  ### **Collapse Tests**  
  | Change                 | Forfeiture          | Equal Standing      | Relational          |  
  |------------------------|---------------------|---------------------|---------------------|  
  | **Ben cleans his hands** (starts charting perfectly) | Yes (Ben) / Yes (Priya) | Yes/Yes             | Yes (Ben) / No (Priya) |  
  | **Swap for generic norm** (e.g., "Don’t steal meds") | No (Ben) / Yes (Priya) | Yes/Yes             | *Collapses to Equal Standing* (Yes/Yes) |  
  | **Priya made co-member** (rotates into ICU duties) | No (Ben) / Yes (Priya) | Yes/Yes             | Yes (Ben) / Yes (Priya) |  

  - **Why collapse?** Relational depends on the norm being *practice-constituted*. Generic moral norms lack "insider/outsider" structure.  

  ---

  ### **Defender’s Objection & Rebuttal**  
  **Attacker (Forfeiture Defender)**: "You rigged the case by defining the ICU ‘practice’ to exclude Priya arbitrarily. If the norm is morally significant (preventing harm), *anyone* can blame—making relationalism collapse into equal standing. The ‘practice’ is just ad hoc."  

  **Is it fair?**  
  - **Yes, if** the critic insists *all* norms are moral norms. But practices *do* create distinct spheres of accountability (e.g., professional ethics vs. universal duties). The case exploits this reality.  
  - **No, if** the critic denies practice-internality matters. But Lena’s intuitive reaction ("*You’ve never been in this position*") shows the relational intuition exists pre-theoretically. The objection risks dismissing real-world normative complexity.  

  **Sour grapes?** Only if one assumes standing *must* be individual-moral rather than relational—which is precisely what the case challenges.  

  ---

  ### **Why This Works**  
  The ICU norm is **high-stakes yet practice-specific**, creating a "moral gravity" only insiders feel. Ben’s hypocrisy doesn’t undermine his standing because his shared vulnerability *grounds* it. Priya’s knowledge is real but *detached*—she critiques from a position of non-exposure. This forces students to confront standing as a *relationship*, not a virtue badge.
