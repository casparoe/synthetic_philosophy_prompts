  (3) The "decisive objection" against epistemicism  
  (4) Supervaluationism blocking sorites by refusing to pinpoint grains  

  For (1): The blog oversimplifies. Supervaluationists *do* technically keep bivalence for statements with determinate truth values—it's borderline cases where excluded middle fails. This nuance matters because... [thought trails off into technicalities about metalanguage vs object language]  

  For (2): Mostly accurate, but the "nothing more than how speakers use the word" phrasing irks me. Epistemicists like Williamson actually argue usage *plus causal-historical facts* fix the cutoff—it's not purely descriptive. Still, tolerable for intro purposes.  

