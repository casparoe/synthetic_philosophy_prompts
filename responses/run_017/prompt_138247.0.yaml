prompt: |-
  I work in clinical education for a regional ambulance service — about two thousand operational staff, mixed roles from emergency dispatchers to paramedics to newly qualified technicians — and several times a year I have to turn a new or revised clinical protocol into training that crews will actually follow at three in the morning, under time pressure, with a patient in front of them. The constraints are unglamorous: I get ninety-minute slots in the rota, a couple of high-fidelity simulation days a year, no ongoing coaching budget, and every package has to be signed off by the clinical director and, where it touches a scope-of-practice question, by staff-side. Last weekend, coming back from a two-day conference, I spent about three hours in a hotel bar arguing with an old colleague who now lectures in paramedic science. She said our protocols, mnemonics and handover templates produce crews who are competent without comprehending anything, and that what we should be doing is teaching people to reason; I said the mnemonics *are* the reasoning, offloaded into a tool, and that no amount of "understanding the physiology" survives adrenaline and sleep loss. We ended up misusing, I suspect, a four-level scheme for kinds of minds — as I half-remember it: creatures hard-wired by evolution to do a small fixed repertoire; creatures that can learn within a lifetime by being reinforced for what they actually try out in the world; creatures that can pre-screen candidate actions internally, so that bad options can be discarded in the head instead of in the field; and creatures whose heads have been re-equipped with imported thinking tools — words, diagrams, checklists, formulae — with that last grade named after some psychologist called Gregory. My colleague used the ladder to argue that almost everything we do is pitched one rung too low; I used the same ladder to argue that our checklists are the highest rung, not the lowest. Neither of us could say how you would actually decide, item by item, which rung a given behaviour needs, and that is the argument I need settled in a form my trainers can use.

  What I want is a triage procedure my team can run on each discrete behaviour in a protocol — the questions in order, what counts as an adequate answer to each, where it stops with a "no, this cannot be trained in the time you have", and where it hands the decision to a person because it is a question of authority or values rather than of learning. It has to be operable by an instructor who has never heard any of this theory, on a single page, in ten minutes per item. Please build it around distinctions that survive that simplification and say which ones you are dropping and what it costs. Some things I have been playing with, which you should use, fix, or throw away as you see fit: the *trial cost* of an item — how bad it is if the learner finds out by actually trying it on a patient, which is what pushes something from on-the-job shaping to simulation or to a rule that filters options before action; the *transfer distance* between the training room and the context where the behaviour has to appear, on a scale from identical through similar to genuinely novel; the *installation depth* of any tool you want crews to use, meaning what sub-tools must already be in place before a mnemonic or threshold value does any work, and what it takes to install them; the *empty-room test*, my name for checking whether a behaviour shows up when no instructor and no assessment is in the room, which I think is what separates something that has really been learned from something the crew has merely learned to perform for us; and *Darwinian residue*, the parts of a failure that are hard-wired rather than trained — startle, tunnel vision, degraded hearing under stress, fatigue — and which therefore have to be designed around rather than educated away. I also want the interference question handled explicitly: crews arrive with years of reinforcement history that rewards speed and seniority, and I suspect some of our training fails not because it is pitched at the wrong rung but because the payoffs in the system still favour the old behaviour, which would make it a management decision and not a training one.

  Then run the finished procedure on three items and show your working, including one where I will not like the answer. First: getting crews to complete a new sepsis screening tool and make a pre-alert call on every eligible patient, when the current failure mode is that experienced crews eyeball the patient and skip the form. Second: a rarely used, high-stakes invasive skill with a catastrophic trial cost — paediatric intraosseous access in a moving vehicle will do — where I cannot afford more than a single simulation session per crew. Third, and this is the one I expect to resent: our flagship ninety-minute module on the physiological reasoning behind the new chest-pain pathway, which my colleague would call the only genuinely higher-rung thing we do and which I have defended for two redesigns. Tell me honestly whether the procedure says that module is doing work it cannot do, whether it should be cut, shortened, or moved somewhere it bites, and what I would put in its place. Finally, be explicit about what the procedure cannot tell me: I need to know which of these calls it has no authority over, where it will confidently mislead me, and whether there is any way to use it after an incident to tell a misclassification from a botched implementation. If the four-level scheme is the wrong frame for any of this, or if it is being stretched past what it was built for, I would rather be told that than handed a tidy procedure built on it.
reasoning: |-
  Hmm, this is a fascinating and highly specific challenge from a clinical education professional in emergency medicine. The user is wrestling with how to design training that actually changes behavior in high-stress, time-sensitive situations, and wants a practical decision tool for classifying protocol elements.

  First, I need to unpack the core tension: the user and their colleague disagree about whether simplified tools (like mnemonics) represent "dumbing down" or sophisticated cognitive offloading. The four-level framework they referenced seems to be a blend of Dennett's cognitive levels and Hutchins' distributed cognition, with a nod to Gregory Bateson's learning theory.

  The constraints are brutal: 90-minute training slots, minimal simulation time, no coaching budget, and complex sign-off requirements. The user's proposed concepts (trial cost, transfer distance etc.) are actually quite sophisticated - they've clearly done their homework. I should honor these but refine them for operational use.

  Key insights emerging:
  - This isn't about "dumbing down" but appropriate cognitive engineering
  - The "empty room test" is crucial - it's about real behavior change
  - Interference from existing reward systems (speed/seniority) may be the silent killer
  - Some things simply can't be trained away (Darwinian residue)

  For the triage procedure, I'll need to:
  1. Sequence questions logically
  2. Define clear decision thresholds
  3. Flag where it stops being a training problem
  4. Make it usable in 10min/item by non-theorists

  The three test cases are perfect:
  - Sepsis screening exposes the interference problem
  - Pediatric IO highlights catastrophic trial costs
  - The chest-pain module tests the "comprehension vs competence" debate

  Biggest challenge: admitting that their prized physiology module might be ineffective. But the user explicitly asked for honesty - that's commendable. The procedure must also clearly state its limits, especially regarding organizational/systemic issues.

  Final design principles:
  - Ruthlessly practical
  - Preserves nuance without complexity
  - Exposes "training vs system" boundaries
  - Annotates what's sacrificed in simplification
answer: |-
  Below is a triage procedure for protocol behaviors, designed as a **single-page flowchart** with explicit thresholds. It distills your concepts into five key questions, sequenced to quickly escalate or deprioritize items. I've preserved your core distinctions but merged overlapping ideas for simplicity. **Dropped elements**: The 4-level cognitive ladder (overly theoretical; doesn't map cleanly to operational decisions) and "installation depth" (folded into "transfer distance" and "empty-room test"). The cost: slightly less granularity in diagnosing *why* a tool fails, but gains speed and actionability.

  ---

  ### **Protocol Behavior Triage Procedure**  
  *(Operable in 10 min/behavior by non-theorists)*  

  1. **TRIAL COST**  
     *"How bad is it if this is done wrong on a real patient?"*  
     - **LOW** (Annoyance/minor delay): → Go to Q2.  
     - **MODERATE** (Correctable clinical error): → Train via simulation.  
     - **CATASTROPHIC** (Death/permanent harm): → **Must use pre-action rule/checklist** (skip to Q5).  

  2. **TRANSFER DISTANCE**  
     *"How different is the training context from 3 am in a moving ambulance?"*  
     - **IDENTICAL** (e.g., equipment drill): → Train on-shift.  
     - **SIMILAR** (e.g., simulated stress): → Train via simulation.  
     - **NOVEL** (Never seen in practice): → **Use checklist/mnemonic** → Go to Q4.  

  3. **EMPTY-ROOM TEST**  
     *"Will crews do this without oversight?"*  
     - **YES** (Routine/high-reward): → Train via brief reminder.  
     - **NO** (Unrewarded/complex): → Go to Q4.  

  4. **DARWINIAN RESIDUE RISK**  
     *"Could stress/fatigue/hardwiring sabotage this?"*  
     - **LOW** (Simple motor skill): → Train via simulation.  
     - **HIGH** (Requires judgment/recall): → **Use checklist/mnemonic**.  

  5. **INTERFERENCE CHECK**  
     *"Do existing rewards punish compliance?"*  
     - **YES** (e.g., speed over thoroughness): → **NOT A TRAINING PROBLEM**. Escalate to management.  
     - **NO** → Proceed with chosen method.  

  **STOPPING RULES**:  
  - **"Cannot train"** if: Catastrophic trial cost + No simulation budget, OR High interference + No management buy-in.  
  - **Handoff to authority** if: Behavior conflicts with values (e.g., autonomy vs. compliance) or scope-of-practice disputes.  

  ---

  ### **Test Cases: Your 3 Items**  

  #### **1. New Sepsis Screening Tool (Skipped by Experienced Crews)**  
  - **Trial Cost**: Moderate (Delayed treatment → worsening outcomes).  
  - **Transfer Distance**: Identical (Form-filling in ambulance).  
  - **Empty-Room Test**: **NO** (Crews skip it; "eyeballing" is faster/rewarded).  
  - **Darwinian Residue**: Low (No high-stress cognitive load).  
  - **Interference Check**: **YES** (System rewards speed; seniority = "trusting gut").  
  → **VERDICT: NOT A TRAINING PROBLEM**. Escalate to management.  
  → *Fix*: Link tool completion to mandatory handover/reimbursement. Training: 5-min reminder in existing sessions.  

  #### **2. Paediatric Intraosseous (IO) Access in Moving Vehicle**  
  - **Trial Cost**: **Catastrophic** (Organ perforation, death).  
  - **Transfer Distance**: Novel (Rare, high-stress scenario).  
  - **Empty-Room Test**: N/A (Pre-action rule required).  
  - **Darwinian Residue**: **HIGH** (Stress → tremor/tunnel vision).  
  - **Interference Check**: Low (No incentive to skip).  
  → **VERDICT: Use checklist/mnemonic + 1 simulation session**.  
  → *Design*:  
    - **Checklist**: Physical laminated card (not memory-dependent).  
    - **Simulation**: Focus on anchoring oneself in moving vehicle + checklist use.  

  #### **3. Chest-Pain Physiology Module (90-min "Reasoning" Session)**  
  - **Trial Cost**: Low-Moderate (Pathway errors caught downstream).  
  - **Transfer Distance**: **NOVEL** (Classroom ≠ ambulance).  
  - **Empty-Room Test**: **NO** (Crews default to protocol, not physiology).  
  - **Darwinian Residue**: **HIGH** (Adrenaline disrupts recall).  
  - **Interference Check**: HIGH (Speed-focused culture disincentivizes deep reasoning).  
  → **VERDICT: CUT MODULE**. Replace with job aid.  
  → *Why*: Physiology "understanding" fails Empty-Room Test and Darwinian Residue. No evidence it changes 3 am behavior.  
  → *Replacement*:  
    - **5-min mnemonic** for key pathway decision points.  
    - **10-min simulation** on applying the mnemonic under time pressure.  

  ---

  ### **What the Procedure CANNOT Tell You**  
  1. **Misclassification vs. Botched Implementation**:  
     - After an incident, compare:  
       - *Misclassification*: Behavior passed the triage but failed → Revisit Trial Cost/Darwinian Residue scores.  
       - *Botched Implementation*: Crews knew the tool but rejected it → This is **Interference** (management issue).  
  2. **Blind Spots**:  
     - **Values Conflicts** (e.g., autonomy vs. compliance): Procedure flags for authority handoff but can’t resolve.  
     - **Tool Design Flaws**: A valid checklist might still fail if poorly designed (not assessed here).  
     - **Scalability**: Works per behavior but won’t catch system-wide interaction effects.  
  3. **False Confidence**:  
     - **Will over-prescribe checklists** for high-stress items but can’t guarantee crews carry them.  
     - **Underestimates Interference** if trainers ignore organizational politics.  

  ---

  ### **Why the 4-Level Scheme Was the Wrong Frame**  
  It conflates **cognitive philosophy** with **operational training design**. Your colleague’s "higher rung = better" mindset ignores that:  
  - **Checklists ARE reasoning** (per Atul Gawande’s *The Checklist Manifesto*).  
  - **Stress annihilates "understanding"** (per Klein’s recognition-primed decision-making).  
  - Your "Darwinian residue" and "interference" concepts do more practical work than the ladder.  

  This triage tool prioritizes **behavioral outcomes over cognitive ideals**. It’s not perfect, but it’s battle-ready for your constraints. If crews won’t do it at 3 am when no one’s watching, it fails — no matter how elegant the theory.
