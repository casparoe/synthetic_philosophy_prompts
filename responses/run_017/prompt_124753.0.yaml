prompt: |-
  A friend of mine — a musician rather than a philosopher, but the sort of person who reads intellectual history on holiday — and I spent most of an evening arguing about Tolstoy's book What Is Art?, which she had just finished and which I have never read. She emailed me her summary afterwards, and since I don't have her email open and can't look anything up, I'll paraphrase rather than quote. As I remember it, she said: that Tolstoy defines art as the transmission of feeling, so a work is art only to the extent that it infects its audience with the feeling the artist himself had; that he then turns this into a test of value, so that how widely and strongly a work infects is how good it is, which is why he ends up rejecting most of the European tradition — Shakespeare, Dante, Beethoven's late works, the symbolists, and his own novels — as counterfeit; that the reason so little survives is a second and stricter religious test, on which art must express the Christian perception of the age, so that what he really wants is art with religious subject matter, edifying stories about brotherly love; that he is a thoroughgoing aesthetic egalitarian who would rather have a peasant's dance song than King Lear, on the grounds that ordinary people can understand the one and not the other; and that he reaches all of this by simply discarding the concept of beauty, which he thinks is nothing more than a name for whatever the cultivated classes happen to enjoy. She also takes the whole thing to be refuted by a single objection: that on his own criterion a catchy music-hall song infects far more people than anything he praises, so either he has to call the song great art or he has to smuggle his religious views in by the back door.

  I argued back, and I think badly, and ended up defending a reading I more or less invented in the course of the argument: that his two criteria are doing quite different jobs, with infection functioning as a sincerity test — a sign that the feeling was genuinely lived through rather than manufactured by someone working to a commission — and the religious-perception criterion doing the separate work of ranking feelings by what they do to the bonds between people. On that reading, the music-hall objection misses its target, because wide infection would only ever have been evidence of sincerity and never a measure of worth. But I genuinely can't tell whether I reconstructed something Tolstoy actually built into the book or merely made him tidier than he is, and I suspect that somewhere in the argument I slid from what he says to what would be defensible for him to say.

  So I'd be grateful for an accuracy audit I can act on. Please go through her summary claim by claim and tell me, for each, what is faithful to the book, what is a simplification a careful populariser could get away with, and what Tolstoy explicitly denies or would have rejected — including whether any of it collapses into one slogan a distinction he insists on. And I especially want your judgment on three things: whether the music-hall objection is one he has the resources to answer or one he is really stuck with; whether my two-criteria reading is fair to him or a rationalisation that quietly drops something he cared about; and whether, if I concede to my friend next time we meet, there is a version of what she said that I could honestly agree with. This is for settling an argument, not for a paper, so please reason from what you know of the book itself and don't send me to sources or references.
reasoning: |-
  Okay, I need to help this user dissect their argument about Tolstoy's "What Is Art?" with their friend. The user wants an accuracy audit of the friend's summary and their own interpretation. Let me start by recalling Tolstoy's main arguments.

  First, Tolstoy defines art as the transmission of feeling. The friend got that right—art must infect the audience with the artist's genuine emotion. But Tolstoy also emphasizes that the feeling has to be sincere. The user's point about sincerity as a test is actually in line with Tolstoy. The friend missed that sincerity is crucial, not just transmission.

  Next, the infection as a value test. Here the friend is oversimplifying. Tolstoy does link value to infectiousness, but only after establishing sincerity. The religious criterion isn't secondary; it's how he ranks the feelings' moral value. The friend's claim that he rejects most art because it's counterfeit is true, but the reason isn't just lack of infection—it's insincerity and lack of religious morality. The user's two-criteria reading separates sincerity from moral ranking, which Tolstoy does, but the religious part isn't just subject matter—it's about universal brotherhood.

  The religious test part. The friend thinks Tolstoy wants edifying stories, but he's more about the feelings behind the art reflecting Christian brotherly love, not necessarily religious subjects. So the friend's take here is too narrow. The egalitarianism point stands—Tolstoy values accessible art like folk songs over complex works like King Lear because peasants can't access the latter. The beauty dismissal is accurate; Tolstoy sees it as elitist.

  Now the music-hall objection. The friend says a catchy song infects more people, so Tolstoy must either accept it as great or smuggle in religion. But Tolstoy's sincerity requirement blocks insincere commercial art. Plus, the religious criterion ranks the song's feelings lower. So the objection doesn't hold because infection alone isn't sufficient without sincerity and moral content. The user's defense here is valid.

  The user's two-criteria reading is fair, though they might understate how Tolstoy ties infection to universality. But separating sincerity and moral ranking aligns with the text. The user can concede that infection alone isn't the value measure but part of a larger framework. For the friend, agreeing that Tolstoy has an answer to the music-hall point using sincerity and religious criteria would be honest. Emphasizing that infection must be of sincere, morally significant feelings wraps it up.
answer: |-
  Based on Tolstoy's *What Is Art?* itself, here's a claim-by-claim accuracy audit of your friend's summary, your defense, and your specific questions:

  **Your Friend's Summary: Claim-by-Claim Audit**

  1.  **"Tolstoy defines art as the transmission of feeling, so a work is art only to the extent that it infects its audience with the feeling the artist himself had."**
      *   **Faithful:** This is the absolute core of Tolstoy's definition. He relentlessly argues that art is not about beauty, skill, or representation, but solely about the successful communication ("infection") of the artist's authentic feeling to the audience. "Infection" is his precise term.
      *   **Simplification:** The emphasis is correct. A careful popularizer *could* phrase it this way without significant distortion, though they should ideally mention the intensity of the infection and the requirement for the feeling to be *sincere* (your point, which is crucial).
      *   **Denial/Rejection:** Tolstoy explicitly denies that art is defined by beauty, pleasure, form, skill for skill's sake, or representation of reality *unless* those things serve the transmission of feeling. He would reject any definition prioritizing those over infectiousness.

  2.  **"...he then turns this into a test of value, so that how widely and strongly a work infects is how good it is..."**
      *   **Faithful:** He absolutely uses the *capacity* for infection (strength and universality) as a primary *measure* of artistic value *once something is defined as art*.
      *   **Simplification:** This is a reasonable popularization *of this specific aspect* of his value theory. However, it misses two critical qualifications he insists upon:
          *   **Sincerity:** The feeling transmitted *must* be one the artist genuinely experienced and felt compelled to express. Infection without sincerity is counterfeit.
          *   **Content/Moral Value:** Infectiousness alone is necessary but *not sufficient* for *high* value. The *quality* of the feeling transmitted is paramount. This is where the religious perception comes in.
      *   **Denial/Rejection:** Tolstoy explicitly rejects the idea that infectiousness *alone* determines *ultimate* value. He argues that highly infectious but morally bad or trivial feelings produce bad art (like your music-hall example). He denies that popularity *alone* signifies greatness if the feeling lacks moral weight or sincerity.

  3.  **"...which is why he ends up rejecting most of the European tradition... as counterfeit."**
      *   **Faithful:** He absolutely rejects the vast majority of celebrated Western art (precisely the examples your friend lists) as "counterfeit art."
      *   **Simplification:** This is accurate. His reasons are complex, but the popularizer's summary captures the outcome correctly.
      *   **Denial/Rejection:** He *explicitly* argues this rejection is *because* this art fails his core tests: it often lacks genuine feeling (manufactured for fame, money, or convention), fails to infect universally (being accessible only to the elite), and frequently transmits feelings contrary to the religious perception (pride, sensuality, despair, exclusivity).

  4.  **"...the reason so little survives is a second and stricter religious test, on which art must express the Christian perception of the age, so that what he really wants is art with religious subject matter, edifying stories about brotherly love."**
      *   **Faithful:** The religious perception is indeed the ultimate test for the *highest* value and purpose of art. He absolutely wants art that fosters universal brotherhood and love.
      *   **Simplification:** This is a *partial* simplification a popularizer might use, but it risks significant distortion:
          *   **"Second and stricter test":** It's more accurate to see the religious perception as defining the *highest quality* of feeling art *should* transmit. Infection defines *what art is* and its *raw power*. The religious perception defines the *moral and spiritual worth* of the feeling transmitted. They are intertwined criteria for value, not entirely separate.
          *   **"Religious subject matter":** This is **explicitly denied** by Tolstoy. He spends considerable effort arguing against this. He insists the religious perception is about the *feeling*, not the subject. Art about ordinary life (peasant labor, family love, simple joys, shared suffering) can perfectly express the Christian perception of universal brotherhood and love *without* depicting biblical scenes or preaching sermons. An "edifying story" that feels artificial fails his sincerity test. True religious art transmits the *feeling* of brotherly love inherent in the artist's authentic perception of the world.
          *   **"What he really wants":** True in spirit regarding the *feeling*, but misleading if interpreted as requiring overt religious themes or didacticism.

  5.  **"...he is a thoroughgoing aesthetic egalitarian who would rather have a peasant's dance song than King Lear, on the grounds that ordinary people can understand the one and not the other."**
      *   **Faithful:** This is fundamentally correct. He champions accessible folk art precisely because it transmits sincere feelings powerfully and universally to the common people. He explicitly argues the complexity and elite nature of works like *King Lear* prevent true universal infection, rendering them inferior or counterfeit *by his definition*.
      *   **Simplification:** A popularizer could get away with this phrasing. It captures his core egalitarian stance and his reason for valuing folk art.
      *   **Denial/Rejection:** He explicitly denies the value judgments of the elite and asserts the judgment of the "sound, unsophisticated" common people as the truer test of infectiousness and sincerity. He would reject the idea that *King Lear*'s complexity makes it superior if it fails to infect universally.

  6.  **"...he reaches all of this by simply discarding the concept of beauty, which he thinks is nothing more than a name for whatever the cultivated classes happen to enjoy."**
      *   **Faithful:** Absolutely central. He dedicates significant portions of the book to demolishing traditional aesthetic theories based on beauty. He argues "beauty" is subjective, historically contingent, and primarily serves as a justification for elite preferences, masking the true purpose of art (infection/communication).
      *   **Simplification:** This is an excellent, concise summary of his critique of beauty. A popularizer *should* use this.
      *   **Denial/Rejection:** He explicitly and vehemently denies that beauty is the foundation or purpose of art. He rejects it as a meaningful criterion.

  **Friend's Music-Hall Objection:**
  *   **"A catchy music-hall song infects far more people than anything he praises..."** True in terms of raw numbers/reach for *some* songs.
  *   **"...so either he has to call the song great art or he has to smuggle his religious views in by the back door."** **Tolstoy has the resources to answer this definitively.**
      *   **Sincerity:** He would immediately question the sincerity of the feeling transmitted by a commercial, formulaic music-hall song. Is it the artist's *genuine*, deeply felt emotion, or manufactured for profit and cheap effect? Likely the latter = Counterfeit.
      *   **Quality of Feeling:** Even if infectious, he would argue the feeling transmitted (likely trivial amusement, sentimentality, or even base passions) lacks the moral and spiritual significance of the feelings transmitted by true Christian art (universal love, compassion, the brotherhood of man). Its infectiousness doesn't make it *good* art by his highest standard.
      *   **Not Smuggling:** He openly declares the religious perception as the standard for judging the *value* of the feeling. He doesn't need to smuggle it; it's central to his argument. The music-hall song fails both tests: likely insincere *and* transmitting a trivial/bad feeling. Infection is necessary for something to *be* art, but insufficient for it to be *good* or *great* art. Your friend's objection **collapses the distinction Tolstoy insists on** between defining art (infection) and judging its value (sincerity + moral/religious quality of feeling).

  **Your Two-Criteria Reading:**
  *   **"Infection functioning as a sincerity test..."** This is **largely fair and insightful**. Tolstoy *does* strongly link infection with sincerity. If a work fails to infect widely among people prepared to receive it, he suggests the feeling likely wasn't sincere or wasn't communicated effectively (which stems from lack of true compulsion to express it). Infection *is* evidence of sincerity.
  *   **"...the religious-perception criterion doing the separate work of ranking feelings by what they do to the bonds between people."** This is also **essentially correct and captures Tolstoy's intent**. The religious perception defines *which* feelings are most valuable to transmit – those promoting universal love and brotherhood, strengthening the bonds between people.
  *   **Rationalization?** You haven't *quietly dropped* something crucial. You've accurately separated the definition/authenticity test (infection/sincerity) from the ultimate value-ranking criterion (religious perception of the feeling's content). This *is* the structure of his argument. You've made him clearer and more defensible, but not by distorting him. The potential *slight* under-emphasis is that for Tolstoy, the *capacity* for universal infection is *also* inherently linked to the *religious* feeling – the feeling of universal brotherhood is, by definition, the most universally infectious feeling possible. But your separation of the criteria for analysis is still valid.

  **Conceding to Your Friend - What You Can Honestly Agree With:**
  You can honestly concede the following version:

  1.  "Tolstoy's core definition is that art is the infectious transmission of the artist's feeling."
  2.  "He absolutely uses infectiousness (strength and breadth) as a key *measure* of whether something is art and its raw power."
  3.  "He explicitly rejects the concept of beauty as the basis for art, seeing it as elitist."
  4.  "He is a radical egalitarian, valuing accessible folk art that communicates directly to ordinary people far above complex elite art like Shakespeare or Beethoven's late works, which he dismisses as largely counterfeit *according to his definition*."
  5.  "His theory leads him to condemn the vast majority of the celebrated European artistic tradition."
  6.  "The *ultimate value* of art, for him, depends entirely on it transmitting feelings aligned with his specific interpretation of the 'Christian perception' – feelings promoting universal brotherly love. Art transmitting other feelings, even if infectious, is lower in value or bad."
  7.  "The *combination* of his criteria (infection proving sincerity *plus* the religious requirement for high value) is what allows him to dismiss the music-hall song example – it likely fails the sincerity test *and* transmits a trivial feeling, even if it's widely catchy."

  **In Conclusion:** Your friend's summary captures the *outcomes* and *provocations* of Tolstoy's argument very well (rejection of tradition, egalitarianism, dismissal of beauty). However, it slightly misrepresents the *structure* of his value theory by conflating the criteria and misinterpreting the "religious test" as requiring overt religious subject matter. Your two-criteria reading (infection/sincerity defining art & proving authenticity; religious content defining ultimate value) is a **fair and textually justified rationalization** that clarifies his argument and provides a solid defense against the music-hall objection. Tolstoy *does* have the resources to answer that objection head-on using his explicit criteria. When you next meet, you can concede the bold consequences of his theory she highlighted while confidently defending its internal logic based on the distinct roles of infection/sincerity and the religious perception of feeling.
