prompt: |-
  I'm a retired experimental physicist — accelerator work, mostly — who has drifted in to reading philosophy of computation over the last couple of years, probly more than is good for me. I've noticed I have firm gut verdicts on the hypercomputation cases but no idea what principle they add up to, and I'd like you to find it for me. British English, please, and no names, dates or citations — I can't look anything up from where I'm sitting.

  My verdicts, going case by case:

  - A spacetime in which one worldline has infinite proper time sitting entirely in the past of some other observer's finite endpoint (I forget whose name is on these), used to decide the halting problem: if that spacetime is really physically possible, that refutes the physical Church–Turing thesis. Not a trick, not a redefinition.
  - A machine that takes 1/2 second for its first step, 1/4 for the second, 1/8 for the third, and so gets through infinitely many steps inside a second: cheating. Not a computation. Even though I can't name the step at which it goes wrong.
  - A box that correctly answers halting questions on demand: not computing either — it's a measurement of something outside the machine, so it doesn't bear on the thesis at all.
  - A device that reads some physical quantity to unlimited precision and uses the digits to decide an uncomputable set: cheating, for the same sort of reason as the accelerating one.
  - A recurrent net with genuinely real-numbered weights doing the same: cheating too.
  - A quantum computer: doesn't touch the thesis, and only for the boring reason that everything it computes was computable already.
  - A gadget producing the digits of an uncomputable real by some genuinely stochastic physical process: just an expensive die, not a computation.

  Here's the pair I can't reconcile. I want to say the relativistic machine would refute the thesis if it's physically possible — that treats the thesis as an empirical claim about the world. But I also want to say I'd never accept that any real device was computing something uncomputable: I'd always redscribe it as measurement, oracle-consultation, or idealisation — which treats it as something closer to a conceptual truth I'd protect by redefining. Those pull opposite ways.

  Is there one principle that gets all seven verdicts, or nearly? Which of them does it force me to give up, and what does it say about the case I keep going back and forth on: a machine finite in every respect, but whose transition table is given by a physical constant we can only ever measure to more and more digits?
reasoning: |-
  Okay, let me tackle this retired physicist's query. They've got strong intuitions about hypercomputation cases but want a unifying principle. First, I need to parse their seven verdicts carefully. 

  The spacetime example with infinite proper time feels legit to them as a potential refutation of Physical Church-Turing thesis (PCTT). But the accelerating machine with supertasks? They call it cheating. The halting oracle box is dismissed as measurement, not computation. Unlimited precision devices and real-weighted neural nets are both rejected as idealizations. Quantum computing gets a shrug for not expanding computability. Stochastic processes? Just fancy dice.

  The core tension: they simultaneously believe PCTT could be empirically falsified (per the relativistic case) yet would always reinterpret any actual "uncomputable" device as non-computational. That's contradictory.

  Hmm... what principle bridges this? Physical implementability vs. epistemic access comes to mind. The relativistic case might satisfy implementability if the spacetime is possible, but others fail by requiring unphysical resources (infinite density, exact real numbers) or confusing measurement with computation.

  For the recurring neural net example, the physicist calls it cheating. Why? Because genuine real-numbered weights aren't physically implementable - we can't construct or access them with infinite precision. Same issue with the accelerating machine: infinite energy density at the final step. 

  The measurement distinction is crucial too. The oracle box and stochastic process don't compute; they sample pre-existing facts or randomness. Computation requires internal state transitions generating the output.

  Now the unresolved case: a finite machine whose transition table is defined by a physical constant. Here's where implementability meets epistemic limits. The constant exists, so the machine is physically realizable. But since we can only measure it finitely, we can't know what it computes beyond our measurement limits. The machine itself computes something definite (maybe uncomputable), but we can't access that fact empirically. 

  This preserves both intuitions: PCTT remains an empirical claim (could be false if such constants encode uncomputable functions), but in practice we'd always describe the output as measurement-dependent approximations. The physicist wouldn't have to abandon any verdicts - just recognize that the last case separates what's physically possible from what's knowable.

  The unifying principle? **Physical computation requires finite resources and unambiguous state transitions; uncomputability claims must survive finite approximation.** All rejected cases violate this: supertasks need infinite density, oracle boxes bypass computation, etc. The relativistic and physical constant cases satisfy it, differing only in whether uncomputability is empirically knowable.
answer: |-
  Right. Let's find that principle without the clutter. Your verdicts hang together under this:

  **Physical computation is the unambiguous implementation of a finite algorithm by means of finitely specifiable, physically realisable state transitions.**

  Now, apply it case-by-case:

  1.  **Relativistic spacetime with infinite proper time:** *Refutes PCTT if physically possible.* Why? The "machine" (the observer's worldline) implements a clear, finite algorithm (simulate TM + check halt) using physically realisable states (its own experienced time). The infinite steps are *resource* (time) provided by spacetime itself, not smuggled into the machine's definition. It's genuinely computing via physical law.
  2.  **Accelerating machine (supertask):** *Cheating.* The algorithm is finite, but the *implementation of state transitions* isn't physically realisable. Achieving the infinite subdivision requires infinite energy density/information density at the limit point. The "steps" become physically ambiguous – there's no well-defined final state transition. It's an idealised *description*, not a realisable *process*.
  3.  **Halting oracle box:** *Not computation.* It's performing a *measurement* of a pre-existing physical fact (whatever encodes the halting answers), not implementing an algorithm via state transitions. No internal process generates the answer; it's revealed. Fits "measurement of something outside".
  4.  **Physical constant read to infinite precision:** *Cheating.* While the constant exists, *reading it to infinite precision* isn't physically realisable. It requires an infinite amount of energy/information to resolve the digits beyond some point. The *access to the resource* (the constant's exact value) is unphysical, making the "computation" (reading the digits) impossible to implement unambiguously. Like the supertask, it confuses a description with a process.
  5.  **Recurrent net with real-numbered weights:** *Cheating.* "Genuinely real-numbered weights" aren't *finitely specifiable* or *physically realisable*. You cannot construct, set, or physically *represent* a true real number weight with infinite precision in a finite universe. The state transitions rely on an unphysical idealisation.
  6.  **Quantum computer:** *Doesn't touch PCTT.* Correct. It implements a finite algorithm (quantum circuit) via finitely specifiable, physically realisable state transitions (unitary ops on qubits). It computes Turing-computable functions, just (potentially) faster for some.
  7.  **Stochastic process generating uncomputable real:** *Not computation.* It's a *source* of randomness, not an algorithm. There are no state transitions implementing a rule to *generate* specific digits; it's passive measurement of an external, random physical process. An "expensive die".

  **Your Tension: Relativistic vs. Redescription**

  *   **Relativistic Machine:** If the spacetime is physically possible, it *does* unambiguously implement a finite algorithm (TM emulation + halt check) via physically realisable state transitions (the observer's proper time evolution). It *would* refute PCTT empirically. Your gut accepts this because the "uncomputability" arises from the *resource provision* (infinite time within a finite external interval) by fundamental physics, not a flaw in the computational model itself.
  *   **Redescription Intuition:** Your instinct to redescribe stems from guarding the *core principle* against *false implementations*. The other cases either:
      *   Smuggle in unphysical resources (infinite energy/density for the supertask, infinite precision for the constant reader/real weights).
      *   Confuse measurement/sampling (oracle box, stochastic process) with algorithmic computation.
      *   Fail to implement unambiguous state transitions (supertask limit ambiguity).
      Your principle protects PCTT *as a claim about what can be physically implemented via algorithmic state transitions* by exposing these flaws. It doesn't make PCTT conceptual; it makes it robustly empirical *against imposters*.

  **The Unresolved Case: Finite Machine, Physical Constant Transition Table**

  *   **Apply the Principle:** This machine *is* physically realisable and finite. Its transition table is fixed by a fundamental constant. It implements a finite algorithm (the transition rules defined by that constant) via unambiguous, physically realisable state transitions (its finite components changing state).
  *   **Verdict:** **If such a constant exists and defines a transition table that computes an uncomputable function, this *would* refute PCTT.** It genuinely computes via physical law.
  *   **...But you'd never accept it?** Here's the rub: *You could never empirically confirm it computes something uncomputable.* You can only measure the constant to finite precision (N digits). You can only observe the machine's behaviour for a finite time (M steps). For any finite N and M, the machine is indistinguishable from a Turing Machine computing some computable function consistent with your measurements. The *uncomputability* is *physically real* but *epistemically inaccessible*. You are forced to describe its *observed* behaviour using computable approximations.
  *   **Reconciliation:** Your tension resolves. The principle says such a machine *could* refute PCTT if the constant encodes uncomputability (empirical claim). However, *in practice*, you would *always* redescribe its *observed, finite output* as the result of a computable process (epistemic limitation). You wouldn't be protecting PCTT conceptually; you'd be acknowledging the fundamental limits of measurement and observation. The machine *is* computing (possibly uncomputably), but you can only ever *know* it as computing something computable.

  **The Principle Summarised:** Physical computation requires a finite, realisable machine performing unambiguous state transitions according to a finite rule. Uncomputability claims must survive *finite approximation* – infinite resources or inaccessible infinities disqualify the "computation". This gets all seven verdicts and resolves your tension: the relativistic machine meets the bar; the constant-defined machine meets the bar but hides its true power; the others fail the bar. No need to give any up.
