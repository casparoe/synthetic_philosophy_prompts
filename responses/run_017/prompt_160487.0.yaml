prompt: |-
  Hey, I'm taking a decision theory / philosophy of action seminar this term and I've been going back and forth with a couple of people in my study group about something and nobody's convinced anyone, so I wanted an outside read. We did Parfit's hitchhiker a few weeks back — stranded in the desert, driver will take you to town if you promise to pay, once you're in town paying is pure cost so a straightforwardly rational agent wouldn't, the driver foresees that and leaves you there, so it looks like rationality wants you to be the kind of person who'll later do something that will be irrational at the time. Separately we've been doing this broader rational irrationality theme, but most of the examples on that side were about *belief* rather than action: self-deception, motivated reasoning, pumping yourself up into an overconfident forecast because confidence leaks and other people pick up on it, that kind of thing. What I actually want is a careful comparison of the two families of case, not a summary of either: rational irrationality about what you do vs. rational irrationality about what you believe. My friend Priya says they aren't the same phenomenon at all, because the hitchhiker only needs a funny *disposition* and dispositions are the sort of thing you can have without being irrational at any moment, whereas the belief cases require you to be in a state that's irrational the whole time you're in it — I think she's half right but I can't get the half she's wrong about into focus.

  A few things I specifically want pinned down, and please be disciplined about the mapping rather than gesturing at big conclusions. First: lay out what structural feature the two have in common — I take it something like the agent doing better by being less than perfectly responsive to reasons, or by being predictable/unpredictable in the right way — and then say exactly where they come apart. In particular, is the standard move of evaluating rationality at the level of policies or dispositions rather than individual acts equally available in both? It looks to me like there's a real asymmetry, since you can generally decide to φ but you can't just decide to believe that p, and beliefs are supposed to be constitutively responsive to evidence in a way intentions aren't; I want to know whether that asymmetry is the whole difference or whether there's more to it. Second, here's a case I made up to try to collapse the two, and I want it taken apart: the telepathic hitchhiker, where the driver can't read your intentions at all but reads your *beliefs about what you'll do*, and is right maybe 80% of the time. Now getting rescued seems to require genuinely expecting yourself to pay, i.e. a belief you know is probably false. Does this case generate a problem the original doesn't, or does it just reduce to the original with extra steps? Does the answer change if the driver's accuracy drops low enough that cultivating the disposition stops paying? And a related variant I can't settle: the escrow hitchhiker, where you can pay a third party a fee up front to force payment later, but using it is visible to the driver and makes you look like the sort of person who'd need forcing, which lowers your chance of being picked up. Walk through what rationality actually recommends there and whether the availability of commitment devices changes the original verdict.

  Third, and this is the bit I care most about: which family is the harder case, and why? Give me a verdict with the reasoning exposed, including whether one of the two is arguably not a case of rational irrationality at all but something else — a coordination problem, an issue about which level rationality is assessed at, a case where the irrationality is only apparent — and tell me what would have to be true for the harder case to dissolve. If it helps, we also did the toxin puzzle in week three, and if you think that's a third data point that changes the comparison rather than just another instance of the action side, say so and say why. Please don't just tell me who's written about this, I can look that up later; I want the argument.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're in a philosophy seminar focusing on decision theory and action, specifically comparing rational irrationality in belief versus action. The main examples are Parfit's hitchhiker for action and self-deception cases for belief. 

  First, I need to identify the structural commonality: both involve agents benefiting from being predictably less responsive to reasons. For the hitchhiker, having a disposition to act irrationally later helps now. In belief cases, holding an irrational belief now leads to better outcomes. But the key difference lies in temporal alignment. The hitchhiker's irrationality is deferred; they act rationally when making the promise, and only the future action is irrational. Belief irrationality is concurrent; the agent must maintain the irrational state continuously.

  The user wants a detailed comparison, especially whether evaluating rationality at the policy level works for both. For actions, adopting a policy (e.g., "always keep promises") is rational overall, even if individual acts (like paying later) aren't. For beliefs, policies like "be overconfident" face a problem: forming such a belief requires ignoring current evidence, which is immediately irrational. The user's asymmetry point is crucial here—you can decide to act but not to believe, so belief policies can't be rationally adopted without self-deception.

  Next, their telepathic hitchhiker case. Here, the driver reads beliefs about future actions. To get rescued, you need to falsely believe you'll pay. Unlike the original, this requires concurrent irrationality—holding a belief you know is probably false. This collapses the distinction, making it more like belief cases. If the driver's accuracy is low, cultivating the disposition might not pay, so the irrational belief isn't rational to hold. This highlights how belief cases force concurrent irrationality.

  The escrow variant adds commitment devices. Paying upfront to force payment later signals untrustworthiness. Rationality might recommend the disposition without escrow if the signal cost outweighs the commitment benefit. This shows that mechanisms like escrow can alter the cost-benefit analysis but don't resolve the core issue of needing a disposition.

  Finally, which case is harder? Belief cases are tougher because they require continuous irrationality. The hitchhiker can be resolved by policy-based evaluation, but belief irrationality involves epistemic failure at every moment. If we could compartmentalize belief formation (like acting on a policy), it might dissolve, but beliefs' evidential nature makes this impossible. The toxin puzzle is another action case, reinforcing that policy evaluation works there but not for beliefs.

  The user's deeper need is to clarify the conceptual asymmetry for their seminar. They need rigorous analysis to present to their study group, especially countering Priya's point. Highlighting the temporal misalignment and the inescapable concurrent irrationality in belief cases addresses their core concern.
answer: |-
  Here's a systematic comparison addressing your core questions, focused on structural features and key differences:

  ### 1. Common Structural Feature & Where They Diverge
  - **Shared Core**: Both involve *instrumentally rational self-sabotage of constitutive rationality*. Agents achieve better outcomes by being predictably less responsive to reasons (evidence for beliefs, immediate incentives for actions) at some point(s).
  - **Divergence Point**: *Temporal alignment of irrationality*.
    - **Action Cases (Hitchhiker/Toxin)**: Irrationality is *deferred*. At T1 (making promise/resolving to drink toxin), acting rationally *requires* adopting a disposition that guarantees irrationality at T2 (paying/drinking toxin). The T2 act is irrational *when performed*, but the T1 act is rational *because* it binds you.
    - **Belief Cases (Self-Deception)**: Irrationality is *concurrent*. Maintaining the irrational belief (e.g., overconfidence) is itself epistemically irrational *throughout its duration*, yet instrumentally beneficial. There's no "rational moment" of adopting it without self-undermining (see below).

  - **Policy/Disposition Evaluation Asymmetry**:
    - **Actions**: Evaluating the *policy* ("always keep promises") resolves the problem. Adopting this policy at T1 is rational; executing it at T2 is locally irrational but globally rational *as part of the policy*. Crucially, **you can rationally decide to adopt a policy**.
    - **Beliefs**: Policies ("be overconfident") hit a wall. To rationally adopt this policy, you'd need evidence it's beneficial *and* that you'll succeed in believing falsely. But recognizing the policy *requires* recognizing the belief as false, making adoption self-defeating. **You cannot decide to believe**; belief formation is (ideally) evidence-constituted. The irrationality isn't confined to a future act—it infects the *process* of forming/sustaining the belief.

  ### 2. Your Cases Analyzed
  - **Telepathic Hitchhiker**:
    - This **collapses the distinction** and creates a hybrid case. To get rescued, you need a *current* belief ("I will pay") that you (presumably) know is probably false. This requires *concurrent epistemic irrationality*.
    - **Problem vs. Original**: The original only needs a *disposition to act* (irrational later). This needs a *current false belief about your future action* (irrational now). It becomes structurally identical to belief-based rational irrationality. Rationality might demand cultivating an epistemically irrational belief.
    - **Accuracy Threshold**: If the driver's accuracy is too low (e.g., <50%), cultivating the disposition (and thus the belief) may not pay. But critically, *if* it pays, it requires *genuine, concurrent* irrational belief, unlike the original.

  - **Escrow Hitchhiker**:
    - **Rationality's Recommendation**: Depends on costs/benefits:
      - Let C = Escrow fee, B = Benefit of rescue, P(rescue|no escrow) = Probability of rescue *without* signaling untrustworthiness, P(rescue|escrow) = Lower probability *with* escrow.
      - Rationality recommends:
        - **Use escrow if**: (B - C) > B * P(rescue|no escrow)
        - **Cultivate disposition if**: B * P(rescue|no escrow) > (B - C) AND P(rescue|no escrow) is high enough to justify the risk of future irrational payment.
    - **Changes Original Verdict?**: Yes, by introducing a *dominant strategy* if escrow is cheap/signaling cost is low. If (B - C) > B * P(rescue|no escrow), escrow dominates: you pay less than the expected cost of future payment *and* guarantee rescue. Commitment devices dissolve the original problem *if available and sufficiently cheap*. The original hitchhiker assumes commitment devices are unavailable.

  ### 3. Which is the Harder Case? Why?
  **Belief cases are the harder case.**

  - **Reasoning**:
    1. **Inescapable Concurrent Irrationality**: Action cases allow partitioning rationality (rational policy adoption, irrational execution). Belief cases force *continuous* epistemic failure for instrumental gain. There's no "rational moment" to launch the irrational belief without self-deception *already* being at work.
    2. **Self-Undermining Adoption**: To *rationally decide* to be irrationally overconfident, you must simultaneously believe:
       - "Overconfidence is beneficial here" (Rational)
       - "I will succeed in becoming overconfident" (Rational, given evidence?)
       - "The proposition I will be overconfident about is actually false" (Epistemically rational, but dooms the project).
       Holding these simultaneously is arguably impossible for a logically coherent agent. The policy cannot be rationally adopted; it can only arise via arational processes (e.g., emotion, bias).
    3. **Constitutive Tension**: Belief aims at truth. Intention aims at action. Intending irrationally (Toxin) is odd but coherent; *believing* irrationally violates the core norm of belief itself. Rationality seems to demand violating a constitutive norm of the mental state.
    4. **The Toxin Puzzle as Clarifier**: Toxin reinforces action-case structure. Resolving *now* to drink later is rational if you get the reward *now*. Drinking later is irrational but *need not occur* if the reward is independent (Kavka's point). This temporal decoupling isn't available for beliefs—the "reward" (e.g., others' confidence in you) requires *sustaining* the irrational belief.

  - **When Would Belief Cases Dissolve?**
    Belief-based rational irrationality would cease to be problematic *only if*:
    - Beliefs were *not* constitutively truth-aimed (radically revisionist), OR
    - We could compartmentalize "policy beliefs" distinct from factual beliefs (e.g., "Act *as if* P" without believing P), OR
    - Instrumental benefits could *directly* justify epistemic failure without self-undermining (rejecting evidentialism).

  **Verdict on Priya's Point**: Priya is correct that action cases only require a disposition (making them "easier"), but mistaken in implying belief cases *must* involve continuous irrationality *without a dispositional analogue*. The asymmetry stems from dispositions being *adoptable* via rational policy choice, while irrational beliefs *cannot be rationally adopted or maintained* without violating core norms. The telepathic hitchhiker shows that when actions *require* irrational beliefs, they inherit the harder problem.

  **Conclusion**: The core asymmetry is that rational *policy adoption* for future action can be temporally isolated from the irrational acts it mandates, while rational *belief management* cannot be isolated from concurrent epistemic irrationality. This makes belief-based cases harder, as they demand continuous, self-undermining failure of a constitutive norm. Commitment devices (escrow) can dissolve action problems but have no clear analogue for beliefs.
