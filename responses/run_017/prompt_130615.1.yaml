  3. v:No → i:No → ii:Yes → iii:Yes → iv:Reward: Conscious Functional Suffering, awkwardly demands an arbitrary architectural marker (e.g., global broadcast) for consciousness. For the model-based agent, suffering occurs if its unavoidable failure prediction is consciously integrated via a self-model.  
  4. v:Yes → i:Yes → ii:No → iii:No → iv:Reward: Reward-Is-Valence, awkwardly equates any negative reward signal with suffering regardless of internal processing. The feedforward regressor suffers on every high-loss step despite having no recurrence or functional economy.  
  5. v:No → i:Yes → ii:No → iii:No → iv:Reward: Trainer-Projected Suffering, awkwardly attributes suffering based solely on external judgment, not system internals. The RLHF-tuned model suffers when the reward model dislikes its output, even if the model itself lacks negative valence.  

