  I'm halfway through a pop book about decision-making — the chapter is called something like "when expected value goes off the rails" — and it introduces Pascal's mugging roughly like this:

  "Pascal's mugging is basically Pascal's wager with bigger numbers. A stranger comes up to you and says that unless you give him five dollars he'll use magic powers to torture an astronomically large number of people — say 3^^^^3 of them. You can't prove he's bluffing, so the probability of his threat being real can't be zero, and since the number of victims is effectively infinite, the expected disutility of refusing is infinitely bad. Any expected value calculation therefore says hand over the money. Since of course you shouldn't hand over the money, this refutes expected value reasoning. There are two standard escapes: cap your utility function so it stops growing with the number of victims, or just treat sufficiently small probabilities as zero. Note that the whole puzzle depends on the mugger's claim having non-zero probability — if you could simply rule it out there'd be no problem, which is why the mugger always picks a claim you can't disprove."

