prompt: |-
  You are a comparative constitutional scholar and political theorist working on multilevel governance, with real command of the American, German, Swiss and EU systems. I would like you to answer in stages rather than in one pass. First, brainstorm the candidate concepts a specialist would reach for on hearing what follows — from federal theory, from EU studies, from public administration, from the literature on intergovernmental finance. Second, test each candidate against the three instances I give you, stating explicitly where it fits and where it strains. Third, tell me whether one of them is the concept, or whether the thing I am describing falls between them. If nothing established fits, coin a term: give me a one-sentence definition, a pair of near-identical cases that fall on opposite sides of the boundary, and a note on what the term should *not* be used for. I do not want a reading list, and I will not be satisfied with a bare label — the carving is the whole point. Please also correct any institutional background I have got wrong.

  The background, as I understand it: in the EU the Union is supposed to act only so far as the objectives cannot be sufficiently achieved by the member states; in Germany the federation may use one of the shared legislative competences only where a federal rule is shown to be necessary, and the constitutional court is supposed to police that showing; Switzerland has a clause, as I remember it, telling the Confederation to take on only what the cantons cannot manage or what needs uniform regulation; the United States has no such clause and instead seems to work through money attached to grants, plus a rule that the centre may not simply conscript state officials. I work in the legal office of a subnational government, and what I keep watching is this: the same formally allocated power is worth wildly different amounts depending on which unit holds it, and the difference is not mainly money.

  Three instances.

  (1) Two units hold formally identical competence over, say, hospital planning. Unit A has a drafting office of about forty lawyers; unit B has four. A legislates continuously. B does one of three things in practice: it copies A's statute more or less wholesale — after which the comparative tables record that B has its own law; or it simply leaves the central framework provision standing unmodified, year after year; or it asks a central ministry for a model text. No competence has been transferred and the allocation rule has not changed, yet when the central framework lapses, A has a replacement in force within weeks while B formally requests that the central rule remain in place until its administration is in a position to legislate — and the extension is renewed twice. What differs is not legal authority but the capacity to originate a rule and then defend it once someone challenges it.

  (2) When units lose a competence, they are compensated with a seat in the joint body that makes the central rule. But the low-capacity delegations cannot independently evaluate the central impact assessment or its several-hundred-page annex. They rely on the centre's own summary, or on whichever high-capacity unit's ministry has already costed the options, and they end up trading their votes for transition periods and side payments. The substitute for self-government is thus itself unequally available: the participation right is worth far more to the unit that can use it.

  (3) Reversals run the same way. Where competences are formally returned, or where a scheme lets units opt into additional powers by meeting benchmarks, uptake tracks the same ranking every time. The units that decline are not refusing autonomy — they are declining an administrative burden they cannot carry. So the familiar claim that competences ratchet upward turns out to be true in one part of a federation and false in another, which is a worse situation than either the ratchet story or its denial describes.

  My colleagues wave this off in two ways, and I think both are wrong but cannot say why. The first is that it is just the familiar fact that some regions are richer and some poorer; but equalisation transfers do not touch it, and the unit I have in mind is not poor, only small. The second is that it is just what everyone already discusses under the heading of units having different powers; but here the powers are formally identical, and that is precisely what makes the pattern invisible in the usual comparative tables.

  So: does this configuration have a name of its own? How does it differ from each of the nearby things — unequal resources, formally differentiated status for particular units, the arrangement in which subnational bodies administer central law, the well-known claim that joint intergovernmental decision-making is biased toward the status quo, and the "earned autonomy" or benchmark-based schemes that are meant to remedy it? Is what I am describing a defect in the allocation principle itself, or only in the way the "cannot be sufficiently achieved" test gets applied — and why do the obvious remedies each seem to make it worse in a different way (transfers that the strong units can simply buy their way out of, capacity-building designed and supervised centrally, procedures that require a unit to petition the centre to be trusted)? Finally, is this specific to multilevel constitutional systems, or does the same structure appear wherever a formal power is granted uniformly to agents of unequal capacity?
reasoning: |-
  Hmm, the user is presenting a sophisticated constitutional analysis problem across multiple governance systems. They're a legal professional in subnational government observing a pattern where formally equal powers function unequally due to administrative capacity differences, not financial resources. The core puzzle is why this phenomenon remains invisible in standard comparative frameworks despite its real-world impacts.

  The user has laid out three concrete scenarios showing how legislative capacity disparities create de facto power asymmetries even when de jure competences are identical. They've also preempted two common misinterpretations - this isn't about fiscal inequality or formal differentiation. Their questions reveal deep frustration with existing analytical categories.

  Looking at their institutional examples: the EU's subsidiarity principle, Germany's necessity test, Switzerland's subsidiary clause, and US anti-commandeering doctrine all attempt to address competence allocation but fail to capture this capacity gap phenomenon. The three cases demonstrate how legislative initiative, participation effectiveness, and opt-in decisions all track administrative heft rather than legal authority.

  The key insight emerging is that formal competence allocation systems assume uniform implementation capacity - a flawed premise. When unit A with 40 lawyers can actively legislate while unit B with 4 staff relies on copying templates, we're seeing "competence inflation" where the letter of the law obscures functional realities. This explains why reversals of centralization fail in predictable patterns - it's not about willingness but administrative carrying capacity.

  Existing concepts don't quite fit: "administrative capacity" is too broad, "implementation deficit" too narrow, "absorptive capacity" too economistic. The proposed term "competence inflation" captures how formal powers expand or contract based on administrative mass. Crucially, this differs from fiscal federalism issues because throwing money at the problem doesn't help - small but rich cantons still struggle with legislative weightlifting.

  The user's deeper concern seems to be about democratic accountability - when units "choose" not to exercise returned powers due to administrative burden, it creates phantom autonomy. This structural problem persists because capacity-building solutions often require central oversight, creating new dependencies. The phenomenon likely extends beyond multilevel governance to any principal-agent relationship with uniform mandates but unequal capabilities.
answer: |-
  This is a penetrating observation that cuts to the heart of multilevel governance dysfunction. Let's break it down systematically:

  **Stage 1: Brainstorming Candidate Concepts**
  - **Subsidiarity Principle** (EU/GER/CH): The core allocation rule itself ("cannot be sufficiently achieved").
  - **Administrative Capacity** (Public Admin): Raw ability to execute functions.
  - **Absorptive Capacity** (Devt. Economics/Intergov. Finance): Ability to utilize resources effectively.
  - **Legislative Drafting Capacity** (Legisprudence): Specific skill to originate/defend legislation.
  - **Intergovernmental Influence Asymmetry** (IGR Literature): Unequal power in joint bodies despite formal equality.
  - **Competence Creep/Centralization Bias** (Federalism Studies): Tendency for powers to drift upward.
  - **Unfunded Mandates** (US Federalism): Imposing costs without resources – *but you note money isn't primary*.
  - **Hollowing of Autonomy** (Political Theory): Formal powers lacking substantive effect.
  - **De Facto Asymmetry** (Comparative Federalism): Informal inequality despite formal symmetry.

  **Stage 2: Testing Concepts Against Your Instances**

  | Concept             | Instance 1 (Hospital Planning)                | Instance 2 (Joint Body Participation)         | Instance 3 (Reversed Competences/Opt-Ins)     |
  | :------------------ | :-------------------------------------------- | :-------------------------------------------- | :-------------------------------------------- |
  | **Subsidiarity**    | *Strains:* Principle allocates *what*, not *how well*. Doesn't address differential ability to exercise competence once allocated. | *Fits partially:* "Sufficient achievement" test *should* consider capacity, but courts rarely operationalize it this way. | *Strains:* Explains initial allocation/reversal but not differential uptake when offered. |
  | **Admin Capacity**  | *Fits:* Directly explains drafting disparity. | *Fits:* Explains inability to analyze complex docs. | *Fits:* Explains inability to bear burden of reclaimed powers. |
  | **Absorptive Capacity** | *Fits partially:* Usually applied to financial/resources; your case is *legislative/regulatory* absorption. | *Fits well:* Inability to "absorb" & process complex info for decision-making. | *Fits well:* Inability to "absorb" the administrative burden of the competence. |
  | **Leg. Drafting Capacity** | *Fits perfectly:* Core issue is originating/defending law, not just executing policy. | *Fits partially:* Underlies ability to scrutinize central proposals effectively. | *Fits:* Opt-in requires drafting/admin frameworks to utilize power. |
  | **IGR Influence Asymmetry** | *Strains:* Focuses on bargaining power, not core legislative incapacity. | *Fits perfectly:* Voting power devalued by dependence on others' analysis/side deals. | *Strains:* Less about bargaining, more about inability to act. |
  | **Competence Creep** | *Strains:* Explains centralization, not *differential* reversal failure. | *Fits partially:* Asymmetric influence facilitates creep, but doesn't explain *why* asymmetry exists here. | *Fits partially:* Explains ratchet effect where capacity exists, but not refusal where it doesn't. |
  | **Hollowing of Autonomy** | *Fits:* Formal power is hollow without drafting capacity. | *Fits:* Seat in joint body is hollow without analytical capacity. | *Fits:* Offered autonomy is hollow if unit lacks capacity to wield it. |
  | **De Facto Asymmetry** | *Fits:* Identifies the *outcome* (unequal power) but not the *mechanism* (capacity). | *Fits:* Identifies outcome (unequal influence) but not mechanism. | *Fits:* Identifies outcome (differential uptake) but not mechanism. |

  **Stage 3: Synthesis, Coinage, and Differentiation**

  1.  **The Gap:** No single established concept fully captures the **core mechanism: the dependence of the *substantive value* of a formally held competence on the unit's endogenous *regulatory/legislative administrative capacity***, distinct from fiscal resources or formal status. Existing terms describe symptoms (hollowing, asymmetry) or inputs (capacity generally), not this specific causal link affecting competence *value*.
  2.  **The Coined Concept: Regulatory Mass**
      *   **Definition:** *The effective capacity of a governing unit to autonomously originate, scrutinize, defend, and adapt complex rules within a formally held competence, determining the substantive value of that competence.*
      *   **Boundary Cases:**
          *   *Inside:* Canton A (high regulatory mass) actively legislates unique hospital planning rules; Canton B (low regulatory mass) copies framework verbatim or relies on central models – *same formal competence, wildly different substantive autonomy*.
          *   *Outside:* Canton C has less *fiscal* mass than Canton D, but equivalent internal legal/expert staff (regulatory mass) for a competence – *both exercise autonomy differently but substantively.*
      *   **What It's Not For:**
          *   General administrative capacity for service delivery (e.g., running hospitals).
          *   Fiscal capacity or resource inequality *per se*.
          *   Formal asymmetry (e.g., Bavaria's special status).
          *   Simple implementation deficits.
  3.  **Distinguishing Nearby Concepts:**
      *   **Unequal Resources:** Regulatory mass is a *specific type* of resource (specialized human/organizational capital), distinct from money. Transfers can't easily buy deep expertise quickly.
      *   **Formally Differentiated Status:** This exists *despite* formal symmetry.
      *   **Administration of Central Law (Exekutivföderalismus):** This concerns executing *central* rules. Regulatory mass concerns originating/adapting *own* rules within a competence.
      *   **Joint Decision-Making Bias:** Regulatory mass explains *why* some units are more vulnerable to this bias or less able to overcome it.
      *   **"Earned Autonomy":** These schemes *presuppose* differential regulatory mass as the barrier they aim to overcome (often unsuccessfully, as you note).
  4.  **Is it a Defect?** It's a defect in the **operationalization of the allocation principle**. Subsidiarity tests (EU/GER/CH) focus on *whether* a unit *can* achieve an objective, often superficially ("could *a* canton do this?"), not *how effectively or autonomously* each specific unit *will* exercise the competence in practice given its regulatory mass. Courts are ill-equipped to assess ongoing regulatory capacity.
  5.  **Why Remedies Fail:**
      *   *Financial Transfers:* Can't directly create deep expertise or institutional culture (strong units buy consultants, weak ones struggle to attract/retain talent).
      *   *Centrally Designed Capacity-Building:* Often misfits local needs, creates dependency, undermines the autonomy it seeks to enable ("petition to be trusted" reinforces asymmetry).
      *   *Procedural Fixes (longer deadlines, model laws):* Treat symptoms (allowing copying) not the disease (inability to originate/defend), potentially *eroding* regulatory mass further.
  6.  **Specific to Multilevel Systems?** The core structure – **uniform formal power + unequal agent capacity = unequal substantive power** – is universal (e.g., within corporations, NGOs). However, the *constitutional significance*, the impact on *democratic autonomy*, and the *systemic rigidity* caused by joint decision-making and competence allocation rules are acutely visible and problematic in multilevel *constitutional* systems like federations/EU. The formal equality promise makes the de facto inequality more normatively jarring and structurally entrenched.

  **In short:** You've identified **Regulatory Mass** as the critical, often overlooked, determinant of the substantive value of formally equal competences. This explains the differential exercise, influence, and reversal uptake better than fiscal inequality or formal asymmetry. It's a systemic flaw in how subsidiarity is applied, not just in allocation. Remedies fail because they don't build genuine, endogenous, self-sustaining capacity for autonomous rule-making. This phenomenon is starkest in multilevel constitutional systems but reflects a universal principal-agent problem.
