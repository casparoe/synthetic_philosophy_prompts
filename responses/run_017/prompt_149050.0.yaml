prompt: |-
  I work in the economics office of a regulatory agency, and I am drafting an internal methods note on our benefit–cost practice. I do not want a verdict on whether the practice is good; I want the theory it is implicitly committed to reconstructed, and I want the places where it is philosophically underdetermined flagged as underdetermined.

  The practice, as it actually operates. To score a proposed rule we monetize every consequence in dollars and add: households' willingness to pay for each benefit, firms' compliance costs, and mortality risk reductions valued at a single figure per statistical life applied to the expected number of deaths averted. A reduction of one-in-ten-thousand in the annual risk of each of ten thousand people is costed exactly as one life saved, and exactly as the certain avoidance of one identifiable death. Rules are ranked by net benefits with no weights attached to whose benefits and costs they are; when a rule's costs fall on one income group and its benefits on another, our guidance asks for a separate distributional statement but instructs us not to fold equity weights into the net-benefit calculation. The value-of-life figure itself is revised upward over time as real incomes rise, on the ground that willingness to pay for safety increases with income.

  I have been reading about Harsanyi's aggregation theorem, and the practice looks as though it were built to match that result's conclusion — social welfare as a weighted sum of individual expected utilities — while quietly failing to match its premises. I want that suspicion tested piece by piece, in the following order.

  First, reconstruct the social welfare function the practice must be using if it is coherent, and tell me what it strictly presupposes as opposed to what merely fits it. In particular, does the practice need each of the theorem's premises — expected-utility rationality for individuals, expected-utility rationality for the social ranking itself, the unanimity condition, and the impartiality or equiprobability step that converts free weights into equal ones — or does it need only the conclusion? My own suspicion is that the instruction not to use equity weights is doing work that nothing in the aggregation result requires, since the result leaves the weights undetermined; confirm or dislodge that.

  Second, the currency problem. The weights in the theorem are weights on von Neumann–Morgenstern utility functions, and those functions are determined only up to positive affine transformation, with the weights absorbing any rescaling, so that the resulting ranking is invariant to how each person's utility is normalized. Our currency is dollars, and a person's utility is an affine function of dollars only if that person is risk-neutral with respect to money. Work out what the practice therefore implies: if a dollar is counted as worth the same wherever it lands, what is being said about the weight on each person's well-being? I think the answer is that equal treatment per dollar amounts to unequal treatment per unit of utility in a determinate direction, and that the direction is the opposite of what the impartial framing of the practice suggests — but I want the argument made properly, including whether the practice might instead be defended as a weighted sum with unequal yet principled weights rather than dismissed as a botched equal-weight sum.

  Third, a diagnostic I would like you to apply. Because the Harsanyian sum is invariant to positive affine rescaling of each individual's utility, any aggregation method whose rankings shift when you change units or baselines is not a Harsanyian sum. Is dollar-metric aggregation invariant in that sense, given that the dollar value assigned to a person's gain depends on the income or consumption level at which the conversion into money is made? If two analysts who convert at different reference levels can reverse the ranking of the same pair of rules, say what that establishes: is the practice committed to universal risk-neutrality in money, or only to a particular cardinalization that it never explicitly chose?

  Fourth, ex ante or ex post. Under the practice as described, a prospect that imposes certain death on one person and one that imposes a one-in-ten-thousand risk on each of ten thousand people are costed identically. Is the practice therefore committed to evaluating prospects by the sum of expected utilities rather than by how outcomes look once the uncertainty is resolved, and to indifference between concentrated and dispersed fatal risk at equal expected value? Tell me what the best-known objection to that indifference is, what it would take for the practice to register it, whether any scoring rule we actually use would have to change, and whether our separate handling of identifiable lives — the refusal to score a named worker facing a known hazard the way we score a statistical one — is a genuine inconsistency or a defensible division of labor.

  Fifth, suppose an internal review found that stated willingness to pay per unit of risk reduction is systematically larger for large risk reductions than for small ones, so that the single value-of-life figure is not a constant marginal rate of substitution at all. Which premise of the reconstruction would that break, and would we then still be aggregating expected utilities, or something that merely resembles them? Does anything in the argument for the aggregation result tell us which way to go once that premise fails?

  Finally, and most usefully for my note: if we took the result seriously as a constraint on our practice, what exactly would have to change? Separate the changes that are forced by the aggregation result itself, the changes that follow only if one adds an equal-weight or impartial-observer premise, and the changes that follow only if one rejects ex ante evaluation in favour of an ex post one. And be explicit about where the practice is underdetermined: if several different welfare functions would generate the same scores, the note should say so rather than announcing that we have uncovered a hidden utilitarianism in our spreadsheets.
reasoning: |-
  We are reconstructing the implicit social welfare function (SWF) of the regulatory agency's benefit-cost practice and examining its philosophical underpinnings, particularly in relation to Harsanyi's aggregation theorem.

  ### Step 1: Reconstructing the Social Welfare Function and Testing Against Harsanyi's Premises

  **Harsanyi's Aggregation Theorem**: 
  - Assumes each individual has expected-utility (EU) preferences (vNM rationality).
  - Assumes the social ranking satisfies EU rationality (so social preferences can be represented by a vNM utility function).
  - Unanimity (Pareto) condition: If every individual is indifferent between two prospects, so is society; if at least one individual strictly prefers prospect A to B and no one prefers B to A, then society strictly prefers A to B.
  - Impartiality: The social welfare function is a weighted sum of individual utilities, and if we impose an impartiality condition (e.g., behind a veil of ignorance with equal probability of being anyone), the weights become equal.

  The practice:
  - Aggregates monetized consequences: willingness to pay (WTP) for benefits, compliance costs, and a constant value per statistical life (VSL) for mortality risk reductions.
  - Treats a small risk reduction spread over many people as equivalent to a certain life saved for one person.
  - Ranks rules by net benefits (sum of monetized benefits minus costs) without equity weights (i.e., a dollar is a dollar regardless of who gets it).
  - The VSL is updated for income growth, reflecting that WTP for safety increases with income.

  **Reconstruction of the SWF**:
  The practice aggregates in dollars. This can be interpreted as a weighted sum of individual utilities if we assume that each individual's utility is linear in money (risk-neutrality). Let:
  - \( u_i(m) \) be the utility of individual \( i \) from money \( m \).
  - If risk-neutral, \( u_i(m) = m \) (or affine: \( a_i + b_i m \), but since we are summing, the constants \( a_i \) disappear and the slopes \( b_i \) matter).

  The practice's net benefit is:
  \[ NB = \sum_{\text{beneficiaries}} \text{WTP}_i - \sum_{\text{bearers}} \text{cost}_j + \text{VSL} \times \text{expected lives saved} \]

  But note: WTP for non-mortality benefits and the VSL for mortality are also expressed in dollars. The VSL is derived from marginal WTP for small risk reductions. So, for a small risk reduction \( \Delta p_i \) for individual \( i \), the WTP is \( \text{VSL}_i \times \Delta p_i \). The practice uses a single VSL for all, but adjusts for income over time. However, at a given time, the same VSL is used for everyone, regardless of their income (unless the distributional statement is used, but it is not folded in).

  The net benefit can be written as:
  \[ NB = \sum_i \Delta m_i \]
  where \( \Delta m_i \) is the monetary equivalent change for individual \( i \) (positive for benefits, negative for costs). This is then the sum of money changes.

  But if we interpret \( \Delta m_i \) as a change in income, and if we assume that each individual's utility is linear in money (i.e., \( u_i(m) = b_i m \)), then the social welfare change is:
  \[ \Delta W = \sum_i b_i \Delta m_i \]

  However, the practice does not use individual-specific \( b_i \) (which would be the marginal utility of income). Instead, it uses the same dollar for everyone. That implies that the practice is using:
  \[ \Delta W = k \sum_i \Delta m_i \]
  for some constant \( k \), which would be equivalent to assuming that \( b_i = k \) for every individual \( i \). But that is only true if every individual has the same marginal utility of income. Alternatively, the practice might be interpreted as having weights \( \beta_i = b_i \) and then writing:
  \[ \Delta W = \sum_i \beta_i \Delta m_i \]
  but then the practice sets \( \beta_i \) proportional to \( 1/b_i \) (because a dollar to a person with low \( b_i \) has a lower weight in social welfare). Actually, let's clarify:

  In the Harsanyi sum, we have:
  \[ W = \sum_i \beta_i U_i \]
  where \( U_i \) is individual \( i \)'s vNM utility.

  In the practice, we are summing \( \Delta m_i \). If \( U_i \) is linear in money, then \( \Delta U_i = b_i \Delta m_i \). Then:
  \[ \Delta W = \sum_i \beta_i b_i \Delta m_i \]

  The practice sets \( \beta_i b_i = 1 \) for every \( i \), so that \( \Delta W = \sum_i \Delta m_i \). This implies that the social weight on individual \( i \)'s utility is \( \beta_i = 1 / b_i \). That is, the practice gives a higher social weight to individuals with a lower marginal utility of income (i.e., the rich).

  **Testing the premises of Harsanyi's theorem**:
  1. **Individual EU rationality**: The practice relies on WTP, which for small changes is consistent with EU. However, for non-marginal changes, WTP may not be consistent with EU (due to income effects or risk aversion). The practice uses a constant VSL for any risk reduction, which assumes marginality (or linearity in risk). But the theorem requires that individuals are EU maximizers. The practice does not necessarily assume that individuals are EU maximizers beyond the small risks (but for the small risks we use, it might be approximately true). However, the use of a single VSL for any risk reduction (even non-marginal) is an extra assumption (see point 5 below).

  2. **Social EU rationality**: The practice ranks prospects by the expectation of the net benefit. Since net benefit is linear in the outcomes (because we add up the dollars and the VSL times risk changes), the social ranking is linear in probabilities. So the practice does satisfy social EU rationality.

  3. **Unanimity (Pareto)**: The practice respects Pareto. If a change makes at least one person better off (in WTP terms) and no one worse off, then net benefits are positive. But note: because we are using WTP, which is income-constrained, a transfer from a rich person to a poor person might not be captured (if the poor person's WTP is low even though the utility gain is high). But in the practice, if a change benefits one and harms none, then net benefits are positive. So the weak Pareto condition is satisfied.

  4. **Impartiality**: The practice does not use equal weights on utilities. Instead, it uses weights that are inversely proportional to the marginal utility of income. This is not impartial in utility terms. The practice does not require the impartiality step of Harsanyi (which would lead to equal weights on utilities). The instruction not to use equity weights is consistent with the practice's implicit weighting (which is already inequitable in utility terms). Therefore, the practice does not require the impartiality premise. The weights are determined by the requirement that each dollar is counted equally, which leads to unequal utility weights.

  So the practice does not require each premise of Harsanyi's theorem. It requires:
  - Individual EU rationality (at least for small risks) and social EU rationality (because of linearity in probabilities).
  - It does not require the unanimity condition to be stated in utility terms (but it does satisfy a form of Pareto in money terms). However, Harsanyi's unanimity is in utility terms, and the practice's Pareto is in money terms. They are not the same because of the difference in weights.
  - It does not require the impartiality condition. The weights are fixed by the dollar metric.

  **On equity weights**: The practice explicitly avoids equity weights (which would adjust the dollar values by a factor reflecting the social marginal utility of income). This is consistent with the practice's implicit weighting (which already has a built-in weighting that is regressive). So the instruction not to use equity weights is not required by Harsanyi's theorem (which leaves weights free) but is required by the practice's specific choice of weighting (which sets \( \beta_i b_i = 1 \)).

  ### Step 2: The Currency Problem

  The practice counts a dollar the same regardless of who receives it. As above, this implies:
  \[ \beta_i b_i = \text{constant} \quad \text{(say 1)} \]
  where \( b_i \) is the marginal utility of income for individual \( i \). Therefore, \( \beta_i = 1 / b_i \). 

  This means that the social weight on an individual's utility is inversely proportional to their marginal utility of income. Since the marginal utility of income is typically higher for the poor, the practice gives a higher social weight to the rich. This is the opposite of what an impartial observer (who assigns equal weight to each person's utility) would do.

  **Defending the practice**: The practice might be defended on the grounds that it is using a "willingness to pay" metric, which reflects the individual's own valuation. In this view, the practice is a form of Kaldor-Hicks efficiency. However, note that the practice is not just about efficiency but also about valuing lives. The use of a single VSL (which is derived from average WTP) for everyone, regardless of income, would not reflect the actual WTP of each individual if we allowed for heterogeneity. But the practice does not adjust for individual income in VSL (except over time, by raising VSL with average income). However, if we took individual WTP for risk reduction (which depends on individual income), then the VSL would be higher for the rich. The practice does not do that: it uses a single VSL for all at a given time. So it is not using actual individual WTP, but an average. This point will be revisited.

  Alternatively, the practice might be defended as a weighted sum with weights that are not arbitrary but based on the principle of "dollar democracy": each dollar of WTP counts equally. This is a market-based logic. However, the ethical basis for such a weighting is controversial.

  ### Step 3: Diagnostic - Invariance Under Affine Transformations

  Harsanyi's social welfare function is invariant to positive affine transformations of individual utilities. That is, if we rescale individual \( i \)'s utility by \( u_i' = c_i u_i + d_i \) (with \( c_i > 0 \)), then the social welfare function can be adjusted by changing the weights to \( \beta_i' = \beta_i / c_i \) (and the constants \( d_i \) do not affect the ranking of alternatives). Therefore, the ranking of social prospects remains the same.

  In the practice, we are using dollars. The dollar value assigned to a non-monetary consequence (like a risk reduction) depends on the reference income level because of diminishing marginal utility of money. For example, the same risk reduction might have a higher WTP if the individual is richer. Therefore, if two analysts use different reference levels for converting utility changes into dollars, they might get different dollar values for the same utility change.

  Suppose we have a prospect that changes the risk of death for a group. The WTP for a risk reduction \( \Delta p \) is:
  \[ \text{WTP}_i = \frac{\Delta p \cdot (u_i(\text{alive}) - u_i(\text{dead}))}{b_i} \]
  where \( b_i \) is the marginal utility of income when alive.

  If we change the reference income level for individual \( i \), we change the baseline at which \( b_i \) is evaluated. Therefore, the dollar value of the same risk reduction will change if the individual's income is different. Now, if the practice uses a fixed VSL (which is the WTP for a marginal risk reduction) and that VSL is computed at a particular income level, then if we change the income level we would change the VSL. But in the agency, the VSL is updated over time for average income growth, but not for cross-sectional differences.

  Now, suppose two analysts are evaluating the same policy but use different reference points for converting utility to money. For instance, one uses current income and the other uses a projected future income. If the income growth is uneven, then the dollar values assigned to the same utility change might differ. Then the net benefit of the same policy might differ, and they might rank two policies differently.

  This shows that the dollar-metric aggregation is not invariant to the choice of reference point. Therefore, the practice is not equivalent to a Harsanyi sum unless we assume that every individual is risk-neutral in money (so that \( u_i \) is linear and the marginal utility \( b_i \) is constant, independent of income). But if we assume risk-neutrality, then the dollar value of a utility change would not depend on the reference point. However, the practice does update VSL with income, which is an acknowledgment that marginal utility of income changes with income. Therefore, the practice implicitly assumes that we are measuring at a fixed reference point (like current average income) and then using that for all. But the non-invariance shows that the practice is not a Harsanyi sum because it is not invariant to the scaling of utility. Instead, it is fixed to a particular cardinalization: the one that is linear in money at a given reference income.

  Therefore, the practice is committed to a particular cardinalization of utility (the money-metric at a given income level) and not to universal risk-neutrality. It does assume that utility is linear in money for small changes (which is approximately true) but it does not assume risk-neutrality for large changes. However, the use of a constant VSL for non-marginal risk changes is an additional assumption that goes beyond the small-risk case.

  ### Step 4: Ex Ante vs. Ex Post

  The practice treats a certain death of one person and a 1/10,000 risk for 10,000 people as identical (both costed at one VSL). This is an ex ante evaluation: we are looking at the expected number of lives saved and multiplying by VSL. This is equivalent to summing the expected utilities of individuals (if we assume that the utility of death is the same for everyone and that the VSL is the same for everyone). 

  The practice is therefore committed to ex ante evaluation. It is indifferent between concentrated and dispersed risks at the same expected number of deaths.

  **Objection**: The most well-known objection is from the ex post perspective. Once the uncertainty is resolved, we might care about the actual distribution of deaths. For example, the prospect that kills one person for sure is different from the one that with high probability kills no one and with very low probability kills ten thousand. The ex post view might assign a higher disvalue to the catastrophic outcome. This is related to risk aversion at the social level. However, note that in the practice, we are using a constant VSL, which assumes that individuals are risk-neutral in the space of mortality risks (i.e., they value risk reductions linearly). But if individuals are risk-averse with respect to mortality risk, then the VSL would depend on the baseline risk level. The practice ignores that.

  The practice does have a separate handling of identifiable lives: it does not use VSL for a named individual facing a known hazard. This is a defensible division of labor if we interpret the VSL as a tool for small risks spread over a large population. For identifiable lives, we might be in a situation of large risk changes (e.g., a 100% risk of death) and then WTP would not be linear. Therefore, the practice might be seen as using VSL only for small risks and using a different method for large risks. However, the example of 1/10,000 risk for 10,000 people is still small at the individual level, so it should be covered by VSL. The practice's scoring of that as one life saved is consistent.

  But the issue of identifiable lives might be more about public perception or ethical considerations. The practice is consistent in the sense that it uses the same method for all statistical risks, but it does not use that method for identifiable lives. This is not necessarily an inconsistency if we view the identifiable lives case as outside the scope of the VSL method (because the risk change is not marginal). However, if we have a situation where an identifiable individual faces a small risk change, then we should use VSL. The practice might be using a heuristic.

  ### Step 5: Non-constant marginal WTP

  Suppose that WTP per unit of risk reduction is larger for large risk reductions than for small ones. This implies that the marginal WTP is increasing with the size of the risk reduction. This breaks the assumption of linearity in risk (i.e., that the utility function is linear in the probability of death). This violates the expected utility assumption because under EU, the utility of a mortality risk reduction should be linear in the risk change.

  If this happens, then the practice's use of a single VSL for any risk reduction would be incorrect. We would not be aggregating expected utilities. Instead, we would be aggregating something that does not have a clear welfare interpretation. The practice might then be seen as a first-order approximation.

  Harsanyi's theorem requires EU. If individuals do not have EU preferences, then the theorem does not apply. Without EU, we cannot represent the social welfare as a weighted sum of individual utilities in the vNM sense. We might have to use a different model (like rank-dependent utility).

  In this case, the practice would have to change: it would need to use a VSL that depends on the baseline risk and the size of the risk reduction. This would complicate the analysis.

  ### Step 6: Required Changes if Taking Harsanyi Seriously

  If the agency took Harsanyi's result as a constraint, what would change?

  **Changes forced by the aggregation result itself**:
  - We would need to represent individual preferences by vNM utility functions. This implies that we must assess the utility of outcomes in a way that is consistent with the EU hypothesis. For mortality risks, we would need to ensure that the VSL is constant for small risk changes (which it is by definition) and also that for non-marginal changes, we use the integral of marginal WTP (or a direct assessment of the utility difference). Currently, the practice uses a single VSL for any risk reduction, which would be incorrect if WTP is not linear.
  - We would need the social ranking to be consistent with EU (which it is, because we are using expected net benefits and net benefits are linear in outcomes).

  **Changes that follow from adding an equal-weight or impartiality premise**:
  - We would use equity weights. Specifically, we would set \( \beta_i \) equal for all \( i \). Then, the social welfare change would be \( \Delta W = \sum_i \beta \Delta U_i \). But we need to express \( \Delta U_i \) in comparable units. If we assume that utility is interpersonally comparable, then we can set \( \beta = 1 \) for all. Then we would need to express all changes in utility and then sum. But we do not observe utility. We would have to convert dollar gains into utility gains using the marginal utility of income. Then:
    \[ \Delta W = \sum_i \frac{\Delta m_i}{b_i} \]
    but note: \( \Delta U_i \approx b_i \Delta m_i \) for small \( \Delta m_i \), so:
    \[ \Delta W = \sum_i \frac{b_i \Delta m_i}{b_i} = \sum_i \Delta m_i \]
    ??? That is not right. If \( \Delta U_i = b_i \Delta m_i \), then \( \Delta W = \sum_i 1 \cdot \Delta U_i = \sum_i b_i \Delta m_i \). This is not the same as the practice's \( \sum_i \Delta m_i \). 

    Actually, if we have equal weights on utilities and we want to express in dollars, we would weight each dollar to individual \( i \) by \( b_i / b_{\text{ref}} \) (where \( b_{\text{ref}} \) is the marginal utility of a reference individual). This is the inverse of the practice's weighting. So to implement equal utility weights, we would need to give a higher weight to a dollar going to a person with high marginal utility (the poor). This is the opposite of the practice.

  - We would also have to adjust the VSL for income: since the marginal utility of income is higher for the poor, a given risk reduction would have a higher social value for the poor. Therefore, we would use an equity-weighted VSL. But the practice uses the same VSL for everyone.

  **Changes that follow from rejecting ex ante in favor of ex post**:
  - We would not use expected utility for social evaluation. Instead, we would evaluate the distribution of outcomes after the uncertainty is resolved. Then we might be risk-averse at the social level. For mortality risks, we might use a concave transformation of the number of deaths. This would imply that we are willing to pay more to avoid catastrophic losses. The current practice would have to be adjusted to include a risk premium for catastrophic events.

  **Underdetermination**:
  The practice as described is consistent with:
  1. A Harsanyi sum with weights \( \beta_i = 1 / b_i \) (so that the dollar sum is the social welfare change).
  2. A Kaldor-Hicks efficiency test (if we ignore the VSL and just look at potential compensation).

  But note: the VSL is not part of Kaldor-Hicks in the standard sense because it is based on WTP which includes all individuals' valuations. The entire practice is a form of cost-benefit analysis that aggregates WTP and costs. It is not necessarily utilitarian in the classical sense. It is a money-metric aggregation.

  The practice is also consistent with a social welfare function that is the sum of money equivalent gains (if we interpret money equivalent as a welfare measure) but without any assumption about utility. However, without the EU structure, the treatment of risk is ad hoc.

  ### Summary for the Note

  The note should highlight:
  - The practice implicitly uses a social welfare function that is the sum of changes in money (or money-equivalent) for each individual.
  - This implies a weighted sum of utilities with weights inversely proportional to the marginal utility of income (hence regressive).
  - The practice requires the assumption that individuals are expected-utility maximizers for small risks and that social evaluation is linear in probabilities.
  - The practice does not require the impartiality condition of Harsanyi (and in fact, its weights are not impartial).
  - The dollar metric is not invariant to the choice of reference income level, which shows that the practice is tied to a particular cardinalization of utility (money-metric at a given income level).
  - The practice is ex ante and therefore indifferent between concentrated and dispersed risks at the same expected number of deaths. The identifiable lives exception might be justified by non-marginal risk changes.
  - If WTP is not linear in risk, then the practice does not aggregate expected utilities and would need adjustment.
  - Changes required by Harsanyi: use vNM utilities for non-marginal changes; if we add impartiality, use equity weights (which would be progressive); if we reject ex ante, then we need to account for social risk aversion.

  The practice is underdetermined: it is consistent with a Harsanyi sum with unequal weights (as above) and also with other interpretations (like money-metric utilitarianism). It is not uniquely determined by the aggregation theorem.
answer: |-
  ### Reconstructing the Social Welfare Function and Testing Harsanyi's Premises
  Your practice aggregates monetized consequences (WTP for benefits, compliance costs, and VSL × expected lives saved) into a net-benefit score. This implies a social welfare function (SWF) of the form:  
  **SW = Σᵢ [WTPᵢ for benefits] - Σⱼ [Compliance costsⱼ] + Σₖ [VSL × Δpₖ]**  
  where Δpₖ is the mortality risk reduction for individual k. Crucially, **dollars are interchangeable across individuals**, meaning a dollar of WTP, cost, or VSL has equal weight regardless of who experiences it. 

  #### Strict Presuppositions vs. Harsanyi's Premises
  Harsanyi’s aggregation theorem derives a SWF **W = Σᵢ βᵢ Uᵢ**, where Uᵢ are vNM expected utilities and βᵢ are weights. Your practice matches the theorem’s **conclusion** (a weighted sum of utilities) but **not its premises**:
  1. **Individual EU rationality**: Required. Your practice relies on WTP, which presupposes individuals are EU-rational (vNM preferences) for small risks. Without this, WTP cannot be interpreted as a marginal utility metric.
  2. **Social EU rationality**: Required. Net-benefit scoring is linear in probabilities and outcomes, implying social preferences satisfy vNM axioms (e.g., independence of irrelevant alternatives).
  3. **Unanimity (Pareto)**: Required weakly. If all individuals are indifferent between two policies, net benefits are equal; if one strictly prefers A over B and none oppose, A has higher net benefits. This assumes WTP/cost differences reflect preference intensities.
  4. **Impartiality (equal weights)**: **Not required or implied**. The theorem leaves βᵢ undetermined; impartiality (e.g., veil of ignorance) would set βᵢ equal. Your practice sets weights **implicitly via money**: βᵢ ∝ 1/bᵢ, where bᵢ is individual i’s marginal utility of income. This violates impartiality, as weights are higher for those with lower marginal utility of income (typically the rich).

  #### Equity Weights and the Aggregation Theorem
  Your suspicion is correct: **The instruction to avoid equity weights is not required by Harsanyi’s theorem** but is consistent with the practice’s implicit weighting. The theorem permits any βᵢ; equity weights would adjust βᵢ to correct for inequality (e.g., βᵢ ∝ 1/bᵢ for utilitarian symmetry). By prohibiting this, your practice commits to **βᵢ = k / bᵢ** for some k, which is regressive (favors the rich). This is a **philosophical choice**, not a logical requirement of aggregation.

  ---

  ### The Currency Problem: Dollars vs. Utility
  Your practice treats a dollar as having equal social value regardless of recipient. For a Harsanyi SWF **W = Σᵢ βᵢ Uᵢ**, this implies:
  - **Uᵢ is affine in money**: Uᵢ(m) = aᵢ + bᵢ m.  
  - **Social weight βᵢ must satisfy βᵢ bᵢ = c** (a constant) for all i.  
  Thus, **βᵢ ∝ 1/bᵢ**.  

  #### Implications:
  - **Unequal treatment per unit utility**: Those with **low bᵢ** (high income, low marginal utility of money) receive **higher βᵢ** (more social weight per util). This is the **opposite of impartiality**: your practice values a util more for the rich than the poor.  
  - **Defense as principled weighting**: The practice could be defended as a "dollar democracy" prioritizing **aggregate willingness-to-pay efficiency** (Kaldor-Hicks). However, this is a **deliberate normative choice**—not a neutral implication of Harsanyi—as it rejects equal concern for utility.  
  - **Risk-neutrality assumption**: By counting dollars equally, the practice assumes **money-metric utility is comparable across individuals at a reference point**. It does not require universal risk neutrality (bᵢ constant), only that bᵢ is fixed at the income level used for WTP elicitation.

  ---

  ### Diagnostic: Invariance Under Affine Transformations
  Harsanyi’s SWF is invariant to positive affine transformations of Uᵢ (i.e., changing Uᵢ to cᵢUᵢ + dᵢ). Your dollar-based SWF **lacks this invariance** because:
  - The dollar value of a utility gain depends on the **reference income level** (e.g., WTP for risk reduction rises with income due to diminishing bᵢ).  
  - **Ranking reversals possible**: If Analyst A uses current incomes and Analyst B uses future incomes (with growth unevenly distributed), they may assign different VSLs or WTPs to the same individuals, reversing policy rankings.  

  #### What this establishes:
  - **Commitment to a specific cardinalization**: Your practice fixes utility via **money-metric at a reference income**, not vNM utility. It assumes bᵢ is measurable and stable at that reference point.  
  - **Not universal risk-neutrality**: It allows bᵢ to vary with income but **freezes bᵢ at the point of measurement**. Updating VSL with income growth acknowledges this cardinalization is income-dependent.  
  - **Underdetermination**: The practice never explicitly chooses a reference income for cardinalization, creating ambiguity.

  ---

  ### Ex Ante vs. Ex Post Evaluation
  Your practice treats concentrated risk (certain death for one) and dispersed risk (1/10,000 risk for 10,000 people) identically, costing both at VSL × 1. This implies:  
  - **Ex ante evaluation**: Prospects ranked by **Σᵢ E[Uᵢ]**, not ex post outcomes.  
  - **Indifference to risk distribution**: Assumes society is **risk-neutral over statistical lives**, valuing only expected lives saved.  

  #### Key objection and implications:
  - **Objection**: Ex post, concentrated harm (e.g., certain death) may warrant **aversion to catastrophe** or **inequity aversion** (e.g., it’s worse to kill one person than expose many to small risks that likely harm no one).  
  - **Registering the objection**: To incorporate this, you would need:  
    (a) **Non-linear risk valuation**: Adjust VSL for baseline risk or risk-size (e.g., higher VSL for large individual risk reductions).  
    (b) **Ex post SWF**: Rank policies by expected social welfare of outcomes (e.g., Σᵢ βᵢ Uᵢ(s) after uncertainty resolves), potentially adding inequality aversion.  
  - **Identifiable vs. statistical lives**: Treating identifiable lives differently is a **defensible division of labor**, not inconsistency. VSL is designed for small risks in large populations; identifiable lives often involve large, certain harms where WTP is non-linear. No scoring rule change is needed if this is a contextual exception.

  ---

  ### Non-Constant Marginal WTP per Unit Risk
  If WTP per unit risk reduction is larger for large reductions, this breaks:  
  - **Linearity in probabilities**: vNM rationality requires WTP to be linear in Δp (i.e., constant VSL). Non-constant marginal WTP violates EU preferences.  
  - **Aggregation consequence**: You would no longer be aggregating vNM expected utilities. Instead, you aggregate **non-EU preferences**, losing welfare-theoretic foundations.  

  #### Response if premise fails:
  - **Harsanyi’s theorem fails**: Without EU, no unique aggregation to a vNM SWF exists.  
  - **Paths forward**:  
    1. **Marginal approach**: Use VSL only for small Δp; for large changes, integrate WTP over risk.  
    2. **Non-EU aggregation**: Adopt an alternative (e.g., rank-dependent utility), sacrificing Harsanyi’s result.  
    3. **Reject welfare interpretation**: Treat CBA as purely efficiency-focused, not welfare-based.  

  ---

  ### Required Changes to Align with Harsanyi
  #### Forced by aggregation theorem:
  - **Individual EU rationality**: Ensure WTP elicitation respects vNM axioms (e.g., use marginal VSL for small Δp; integrate WTP for large changes).  
  - **Social EU rationality**: Maintain linear monetization (net benefits proportional to E[W]).  

  #### Required only with impartiality (equal βᵢ):
  - **Equity weights**: Weight dollars by 1/bᵢ (social marginal utility of income), where bᵢ ∝ 1/income (approximately). This regressive weighting would become progressive.  
  - **VSL differentiation**: Set VSLᵢ ∝ 1/bᵢ (higher VSL for low-income individuals).  
  - **Distributional integration**: Fold equity effects into net benefits, not separate statements.  

  #### Required only with ex post evaluation:
  - **Social risk/inequity aversion**: Apply a concave transformation to net benefits (e.g., prioritize reducing variance in outcomes) or use an ex post SWF like Σᵢ βᵢ Uᵢ(s).  
  - **Catastrophe aversion**: Scale VSL by risk concentration (e.g., higher VSL for correlated risks).  

  #### Underdetermination in current practice:
  Your net-benefit scores are consistent with **multiple welfare interpretations**:  
  1. **Harsanyi with unequal weights**: βᵢ ∝ 1/bᵢ (regressive).  
  2. **Money-metric utilitarianism**: Social welfare = Σᵢ (monetary equivalent), without utility comparisons.  
  3. **Kaldor-Hicks efficiency**: Potential compensation test, ignoring distribution.  
  The practice is **not uniquely utilitarian**; it is underdetermined between these. The critical hidden commitment is **cardinalization via money at a reference income level**.

  ---

  ### Summary for Your Methods Note
  - **Implicit SWF**: Weighted sum of money-equivalent utilities, with weights βᵢ ∝ 1/bᵢ (regressive).  
  - **Harsanyi premises**: Requires individual and social EU rationality; does not require impartiality.  
  - **Key tensions**:  
    - **Currency**: Dollar equality ≠ utility equality; practice favors high-income individuals per util.  
    - **Invariance**: Practice is cardinalized to income-specific utility, risking ranking reversals.  
    - **Risk distribution**: Ex ante evaluation ignores ex post equity; identifiable-life exception is defensible.  
  - **Underdetermination**: Practice compatible with Harsanyi (unequal weights), money-metric utilitarianism, or Kaldor-Hicks. **No single welfare function is uniquely exposed**.  
  - **Recommendation for note**: Explicitly state that the practice commits to a money-metric cardinalization and regressive weighting, flagging where philosophical choices (not efficiency or Harsanyi) drive outcomes.
