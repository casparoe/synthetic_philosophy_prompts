prompt: |-
  Not sure if this is the right place to ask this, but here goes. I'm a 3rd-year PhD student in evolutionary biology (microbial experimental evolution — endless plates, serial transfer, patches that crash) and I keep getting the same shape of result out of my simulations and I have no idea what to call it.

  Here's the shape. There are local populations — patches — and they're open: individuals migrate in from a common pool, and the patches don't really reproduce, they just persist for a while and then get washed out or crash. Now take a trait with two effects. (a) Within a patch, in any given round, the bearer does slightly better than its patch-mates — grows a bit faster, whatever, nothing dramatic. (b) The trait makes the patch it is in last longer before crashing. Both effects are perfectly ordinary individual-level effects; no spooky action.

  What keeps happening is that the trait spreads mainly because of (b), and I don't think it's any of the usual stories. It isn't kin selection: I can push patch-mate relatedness down to basically zero in the sim and it still works, because the covariance isn't coming from who is related to whom, it's coming from the fact that bearers are physically sitting in the patches that don't crash, so they get more rounds of (a). And it isn't the standard multi-level story where the group with more cooperators pumps out more total offspring and that's the between-group term — because I can set things up so the long-lived patches actually produce *fewer* total cells over the whole run than the short-lived ones (slow growth, long life), and the trait still wins. What seems to matter is how many selective episodes happen inside the patch before it dies, not how much comes out of the patch.

  Second case, different substrate, same shape as far as I can tell. A symbiont strain that extends its host's lifespan. The strain is only mildly better than its competitors within a host, and it gets diluted every round by immigration from the environment. Long-lived hosts host more rounds of within-host competition, so the strain ends up winning there — even though the extra rounds don't produce anything extra for the strain's own descendants in particular, and the hosts don't leave more offspring.

  What I can't work out is how to talk about this. Is the patch (or the host) a unit of selection here, or not? It doesn't reproduce, and I can't see that it has a fitness in any normal sense — what it has is a lifespan, or equivalently a turnover rate, or a duration measured in particle generations. And the trait's success looks like it comes from the patch's duration acting as a multiplier on how much lower-level selection happens, not on which way the lower-level selection points. I've been writing 'episode-count selection' in my notes, which is probably awful, and I half suspect it's a special case of something — some version of niche construction (the trait lengthens the environment in which it happens to be favoured), or maybe just what falls out of a multi-level / Price-style decomposition once you put a clock in it, or maybe it's that old life-history thing about output and generation time coming apart, pushed up one level.

  So: does this configuration have a name, or a home in the levels-of-selection literature? But honestly I don't want a label, I want the carving. Concretely, the things I'd want an answer to pin down:

  - Is the collective doing any causal work at all here, or is it just a background condition on individual-level selection, the way temperature is? What experiment or what bit of formalism would settle that?
  - How exactly is this different from the group-lasts-longer / group-is-less-likely-to-go-extinct version of multi-level selection, given that I can make output and duration come apart in either direction?
  - Is it niche construction or ecological inheritance, or does the fact that the modification changes only how much selection occurs (and not what it favours) put it outside those?
  - Could it be redescribed as plain individual selection with a strange fitness measure? If so, is there anything actually wrong with that redescription?
  - And the edges: what would have to be true for a case not to be an instance of this? Say the patches were closed rather than open; or the trait's effect on patch lifespan didn't depend on how common the trait was in the patch; or the within-patch advantage were exactly zero; or the trait shortened patch life but still made its bearer more likely to be in whatever persisted.

  Please don't spend words on references or citations or who said what — I can chase all that myself. I want the anatomy: what the thing is, what it is not, which of its near neighbours it's closest to and why, and if there genuinely isn't a term for it, a name plus a definition tight enough that I could look at a new case and say yes or no.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a PhD student in evolutionary biology working with microbial experimental evolution, specifically looking at patches that crash. The issue is they keep seeing a particular pattern in their simulations where a trait spreads mainly because it extends the patch lifespan, even when within-patch advantage is minimal and relatedness is low. They're struggling to categorize this within existing evolutionary frameworks.

  First, I need to understand the core mechanism they're describing. The trait has two effects: (1) slight within-patch fitness advantage, and (2) extends patch duration. The spread seems driven by (2), but it doesn't fit standard multi-level selection because patch output can be lower and relatedness is negligible. The key is that longer-lived patches allow more rounds of within-patch selection, amplifying the minor advantage.

  The user mentions several specific concerns: whether the collective is a real unit of selection, how this differs from standard group selection, whether it's niche construction, and if it can be reduced to individual selection. They also want clear boundaries for what would and wouldn't count as this phenomenon.

  Hmm... I recall that in evolutionary theory, there's discussion about time scales and selection episodes. The patch duration acting as a multiplier for selection events reminds me of models where persistence matters more than reproduction. The user's "episode-count selection" term actually captures this well - it's about the number of selective sweeps within a patch.

  For the collective's role: the patch isn't reproducing, so it's not a Darwinian unit. But its persistence creates the conditions for individual selection to operate more times. This is different from group extinction in MLS1 because here group fitness isn't defined by offspring groups but by duration enabling more within-group evolution.

  The niche construction angle is interesting - the trait modifies the environment (patch lifespan), but unlike typical niche construction, it doesn't change selection pressures, just their duration. So it's more about environmental persistence than environmental alteration.

  Could this be individual selection? Technically yes if you define fitness as cell divisions over the metapopulation, but that would obscure the causal mechanism - the patch-level effect is doing real work in the system.

  For boundaries: if patches were closed, it might become standard group selection. If the trait didn't affect patch duration dependence, it would just be plain individual selection. If within-patch advantage was zero, the trait wouldn't spread at all.

  The user seems frustrated with existing categories not fitting. They're not just looking for labels but want to understand the causal structure. Their examples with symbionts extending host lifespan show they've thought deeply about generalizability.

  I should emphasize that this is about persistence-driven amplification of selection rather than differential reproduction at higher levels. The "multiplier effect" seems central. Their own term "episode-count selection" might actually be perfect if properly defined.

  The carving they want requires distinguishing between: 1) the entity undergoing selection (individual cells) and 2) the environmental scaffold enabling more rounds of that selection (the persistent patch). The patch isn't selected; it's selecting for longer through its persistence.
answer: |-
  This configuration has a distinct identity. It's **Persistence-Amplified Individual Selection (PAIS)**, defined by:

  1.  **A persistent environmental scaffold (patch/host):** Provides a temporal arena for selection.
  2.  **A trait at the lower level (individual):** Confers:
      *   A modest fitness advantage *within* the scaffold (*Component A*).
      *   An extended persistence duration *of the specific scaffold it inhabits* (*Component B*).
  3.  **No inherent reproduction of the scaffold:** Scaffolds are assembled/replenished externally or stochastically (e.g., immigration pool, host infection), not via differential reproduction of scaffolds themselves.
  4.  **Openness:** Scaffolds experience immigration/recolonization (low relatedness possible).
  5.  **The causal driver:** The trait's primary spread mechanism is *the amplification of Component A within its own scaffold due to Component B*. More time within the scaffold allows more rounds of within-scaffold competition favoring the trait.

  **Anatomy & Carving:**

  1.  **Is the collective doing causal work?**
      *   **Yes, causally active but not a Darwinian unit.** The scaffold (patch/host) is *causally essential* as the temporal arena. Its persistence duration (*Component B*) *directly determines the number of selective episodes* where *Component A* can act. This is distinct from being a passive background condition like temperature because the trait *actively modifies this specific scaffold's property* (persistence). Crucially, the scaffold *does not reproduce*; it doesn't have "offspring scaffolds." Its "fitness" isn't defined by offspring but by persistence duration enabling more internal evolution.
      *   **Settling Experiment/Formalism:**
          *   *Experiment:* Run simulations where you artificially clamp the persistence duration of *all* scaffolds to a fixed value, independent of any trait. Observe the trait frequency change. Then run identical simulations allowing trait-dependent persistence. Compare the magnitude and direction of trait frequency change. If the change is significantly greater in the latter case, the scaffold's variable persistence is causally necessary for the trait's spread via amplifying internal selection. Price decomposition fails to capture the full causal story cleanly because the "group" (scaffold) doesn't reproduce; the covariance term becomes messy when groups are defined by persistence time rather than descent.
          *   *Formalism:* Model the number of within-scaffold selective episodes as a random variable dependent on the trait frequency within the scaffold. Key parameters: baseline persistence rate, trait-modulated persistence rate, within-scaffold selection coefficient. Analyze trait fixation probability/invasion fitness.

  2.  **How is it different from standard group extinction/MLS?**
      *   **Fundamental Difference:** Standard MLS (especially MLS1) requires *differential reproduction of groups*. Groups with more cooperators produce *more offspring groups* (or more migrants contributing to new groups). PAIS lacks group reproduction.
      *   **Duration vs. Output:** In MLS, group output (migrants/new groups) is paramount. In PAIS, *duration enabling more within-group selection* is paramount. You correctly note trait success *even when long-lived scaffolds produce fewer total cells/migrants*. MLS success requires higher output *from the group*. PAIS success requires longer duration *for internal selection within the group*. MLS selects for group-level traits *contributing to group fecundity*. PAIS exploits a scaffold-level trait (persistence) *to amplify individual-level selection*.

  3.  **Niche Construction (NC) or Ecological Inheritance?**
      *   **Overlap, but distinct.** The trait modifies the environment (extends scaffold persistence) – a core NC action.
      *   **Key Distinction:** Classic NC focuses on modifications that *change the nature or direction* of selection pressures (e.g., building a dam alters the environment, favoring different traits). PAIS modifies the environment (persistence duration) to *amplify the magnitude of an existing selection pressure* without changing its direction. It's about the *quantitative intensity and duration* of a consistent selective regime, not creating a new one. Ecological inheritance usually implies modification passed to descendant entities (organisms, groups). Here, the persistence modification benefits individuals *within the same scaffold during its extended lifetime*, not necessarily descendants inheriting the modified environment. It's more "immediate environmental modulation" than inheritance across generations.

  4.  **Redescription as plain individual selection?**
      *   **Yes, technically possible, but misrepresents causality.** You *could* define a complex individual fitness measure: "Lifetime reproductive success (LRS) integrated over the stochastic lifespan of the scaffold, which itself depends on the trait." This folds everything into individual fitness.
      *   **What's wrong with it?** It obscures the *causal mechanism*. It hides the critical role of the scaffold's persistence *as a distinct causal factor* that the trait manipulates to amplify its own within-scaffold advantage. It conflates the *source* of fitness differences (amplified rounds of selection within a persistent environment) with the *result* (higher LRS). PAIS highlights the *how* – the trait succeeds *because* it engineers a longer runway for its minor advantage to play out repeatedly. The individual-selection-only description provides the *what* (higher fitness) but not the biologically insightful *why*.

  5.  **Boundaries: When is it NOT PAIS?**
      *   **Closed Patches (No Immigration):** If patches are closed and reproduce (e.g., fission based on composition), it shifts towards standard MLS1. Differential reproduction of groups based on trait frequency becomes possible and likely dominant. *Edge:* PAIS requires openness/immigration to decouple scaffold persistence from scaffold reproduction and keep relatedness low.
      *   **Trait Effect Independent of Commonness:** If the trait extends patch lifespan *regardless* of how common it is within the patch (e.g., a single bearer can prevent a crash), it becomes closer to a "public good" scenario. While Component B still acts, the within-patch dynamics change significantly. PAIS relies on the trait's benefit *to the patch* being contingent on its presence (even if implicitly via bearer density). *Edge:* The trait's effect on persistence should be a function of its representation within the scaffold.
      *   **Zero Within-Patch Advantage (Component A = 0):** The trait cannot spread via PAIS. Component A is essential; PAIS amplifies an existing advantage, it doesn't create one de novo. Without *some* within-scaffold advantage, extending persistence doesn't favor the trait. *Edge:* Component A > 0 is necessary.
      *   **Trait Shortens Scaffold Life but Increases Presence:** If the trait shortens the scaffold lifespan but somehow makes its bearers more likely to be in the *next* scaffold (e.g., better dispersers colonizing new patches faster), this is fundamentally different. It's individual-level selection based on dispersal/metapopulation dynamics. PAIS relies on the trait *extending the lifespan of the specific scaffold it currently occupies*, allowing *more rounds of selection within that same scaffold*. *Edge:* The causal link must be "Trait in Scaffold X -> Longer Lifespan of Scaffold X -> More rounds of selection *within Scaffold X* favoring trait".

  **In Summary:**

  You've identified **Persistence-Amplified Individual Selection (PAIS)**. The scaffold (patch/host) is a causally active environmental structure whose persistence duration is modified by a trait. This modification amplifies the number of rounds of individual-level selection occurring *within that specific scaffold*, favoring the trait due to its consistent (even if small) within-scaffold advantage. It's distinct from MLS due to the lack of scaffold reproduction, distinct from standard NC due to amplifying rather than redirecting selection, and while reducible to complex individual fitness, that description obscures the key causal mechanism of environmental persistence enabling repeated selection episodes. It sits closest to niche construction conceptually, but its defining feature is the amplification of selection intensity/duration within a modified environment, rather than altering the selective pressures themselves. The core novelty is the **scaffold-as-timer** mechanism for evolutionary advantage.
