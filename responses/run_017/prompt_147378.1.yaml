  Okay, let me tackle this user's query step by step. They're a high school senior working on an evolutionary psychology response paper, feeling stuck between their brother's confident critique and the textbook chapter. 

  First, I need to unpack the brother's summary which seems to mix some accurate points with oversimplifications. The modularity claim is real but exaggerated - modern evopsych doesn't think the brain is purely Pleistocene-adapted or that culture doesn't matter. The "just-so story" critique is valid but good researchers avoid it through specific methods. 

  The Wason test example is perfect for examining testability. I should explain how disconfirming evidence (like cultural variation or training effects) would actually challenge the cheater-detection hypothesis, contrary to the brother's claim that evopsych can explain anything. That's key to showing it's falsifiable science.

  The user's intuition about confusing past function with current utility is sharp - I'll develop that as the crucial distinction. Their brother's "stuck with ancient traits" framing ignores contemporary gene-culture interactions. 

  For structure, I'll:
  - Correct each point of the brother's summary
  - Analyze the Wason test as a testability case study
  - Emphasize the past/present trait distinction
  - Note where critics and defenders actually agree (like rejecting genetic determinism)

  The tone should stay conversational since they're stressed about academic writing. No jargon dumps - just clear signposting like "here's what's fair criticism" versus "this part's a straw man." Their self-awareness about sources (limited library access, skeptical but influenced by brother) means I should position this as equipping them to push back intelligently in their paper.
answer: |-
  Here's a breakdown of your brother's summary, the "just-so story" critique, and how to approach your paper, focusing on accuracy and testability:

  ### Deconstructing Your Brother's Summary (Point-by-Point)

  1.  **"The brain isn’t one general-purpose learning machine, it’s a bunch of separate modules..."**
      *   **Fair?** **Partially, but oversimplified.** Evopsych *does* emphasize domain-specific adaptations/modules, challenging the notion of a *purely* general-purpose brain (like a blank slate). This is a core tenet derived from evolutionary biology (e.g., vision, language likely involve specialized circuits).
      *   **Caricature?** **Yes.** Modern evopsych doesn't deny general learning capabilities exist *alongside* modules. The "massive modularity" idea (the brain is *only* modules) is debated *within* the field and often exaggerated by critics. The brain is complex, with both specialized and flexible aspects.

  2.  **"...built during the Pleistocene... minds are stuck running software for a world that doesn't exist anymore."**
      *   **Fair?** **The core idea is central, but the phrasing is overly deterministic.** Evopsych argues that many fundamental human traits evolved as adaptations to the Environment of Evolutionary Adaptedness (EEA), roughly the Pleistocene. Traits that were adaptive then may be mismatched to modern environments (e.g., cravings for fat/sugar).
      *   **Caricature?** **Yes, significantly.** "Stuck running software" implies rigidity and no change. Evopsych acknowledges:
          *   **Flexibility:** Modules often produce flexible *behavior* (e.g., mate preferences adapt to local conditions).
          *   **Gene-Culture Coevolution:** Culture evolves rapidly and interacts with genes. Our evolved psychology *allows* for immense cultural diversity and adaptation.
          *   **Recent Evolution:** Some evolution has likely occurred since the Pleistocene (e.g., lactose tolerance). The EEA is a statistical concept, not a single frozen moment.

  3.  **"You notice something people do... make up a story about how that helped ancestors... that story is the explanation."**
      *   **Fair?** **This describes the *just-so story* critique PERFECTLY.** This is the core accusation: starting with an observation, inventing a plausible adaptive story, and presenting it as the explanation *without rigorous testing*. *This is what critics accuse poor evopsych of doing.*
      *   **Caricature?** **As a description of the *critique*, it's accurate. As a description of what *good* evopsych *should* be, yes, it's a caricature.** Good researchers don't *stop* at the story. They use it to generate *testable hypotheses*.

  4.  **"...a theory that can explain absolutely everything can't be tested and isn't really science."**
      *   **Fair?** **This is the logical consequence of the *just-so story* problem.** If you can invent an adaptive story for *any* observation after the fact, the theory is unfalsifiable. Karl Popper argued falsifiability is key to science. If no evidence *could* disprove the adaptationist hypothesis, it's not scientific.
      *   **Caricature?** **Not a caricature of the *critique itself*. This is the *point* of the critique.** Critics argue that *if* evopsych is practiced as just storytelling, it *isn't* science. Defenders argue *good* evopsych *is* testable.

  5.  **"These things are innate and genetic... parenting and culture don't matter... we're stuck..."**
      *   **Fair?** **NO. This is a fundamental misrepresentation (a "straw man").**
      *   **Defender Pushback:** Evopsych explicitly focuses on *how* evolved psychological mechanisms *interact with* the environment (including parenting and culture) to produce behavior. It's about *nature AND nurture*. The mechanisms are "innate" in the sense of being evolved products, but their *expression* is highly dependent on environment. Culture is seen as both a *product* of and an *input* to our evolved psychology. **No serious evopsychologist claims parenting or culture "don't matter."** They study *how* evolved predispositions shape and are shaped by them. Genetic determinism is rejected.

  ### The "Just-So Story" Critique & Testability (Your Wason Test Example)

  *   **The Accusation:** Critics argue that evopsych often relies on post-hoc, plausible-sounding adaptive narratives that are difficult or impossible to test empirically. They see these stories as unfalsifiable because *some* adaptive story can *always* be concocted.
  *   **A Careful Evopsychologist's Defense:**
      *   **Hypotheses First:** Good research *starts* with an evolutionary hypothesis *derived from theory* and *then* tests it against data, including cross-cultural data, neuroscience, genetics, or experiments.
      *   **Specific Predictions:** They make specific, falsifiable predictions. The Wason test example *is* an attempt at this. The hypothesis: "Humans possess a specialized cheater-detection module." The prediction: "Performance will be superior on logically identical problems framed in terms of social exchange/cheating vs. abstract rules." The result supported the prediction.
      *   **Alternative Explanations:** Good researchers actively seek and test alternative explanations (e.g., familiarity, practice effects, general intelligence).
  *   **Your Counter-Scenario (Wason Test Variations):**
      *   **Vanishing Advantage in Small-Scale Societies:** This would *seriously challenge* the "universal, evolved cheater-detection module" hypothesis. A defender might argue the module still exists but requires specific social contexts to activate, or that the test wasn't appropriately translated. However, strong cross-cultural variation would demand significant revision or abandonment of the strong modular claim.
      *   **Training Eliminates Advantage:** This would *also* challenge the strong module claim. It suggests the difference is due to familiarity or learned strategies, not a dedicated innate module. A defender might argue the module gives an initial bias that training overcomes, but the core claim of a *specialized, innate* module would be weakened.
      *   **The Key Point:** **Both your scenarios ARE POTENTIAL FALSIFICATIONS.** If the results held *only* in specific cultures or disappeared with training, it would undermine the original hypothesis. Good evopsych *can* be tested and potentially falsified. The problem arises when researchers *ignore* such findings or invent *new* unfalsifiable stories to explain them away *without new evidence* (which *is* bad science).

  ### Your Insight: Past Function vs. Current Utility/Health

  *   **You are SPOT ON.** This is a crucial distinction often blurred in pop-science and sometimes in weaker academic work.
      *   **Past Function (Adaptation):** What selective pressure(s) *in the past* caused the trait to evolve? (e.g., Sweet tooth: adaptive for calorie-seeking in scarce environments).
      *   **Current Manifestation:** How does the trait express itself *now*? (e.g., Sweet tooth: leads to obesity/diabetes in modern environments).
      *   **Current Utility:** Is the trait currently adaptive? (e.g., Sweet tooth: generally maladaptive now).
      *   **Health/Desirability:** Is the trait good or bad for well-being? (e.g., Sweet tooth: often unhealthy). **Evolution doesn't care about happiness or health, only reproductive success.** A trait can be an adaptation but currently harmful.
  *   **Build Your Paper Around This:** This is an excellent, clear, and important framework. Emphasize that:
      *   Evopsych primarily seeks to explain the *past evolutionary function*.
      *   Confusing this with *current* adaptiveness, healthiness, or inevitability leads to major misunderstandings (like your brother's "stuck with it" determinism).
      *   Recognizing past function helps us understand *why* a trait exists, which is essential for addressing current mismatches (e.g., public health strategies for obesity).

  ### Conclusion for Your Paper

  *   **The "just-so story" critique lands HARD on weak evolutionary psychology** that relies solely on post-hoc storytelling without generating testable predictions or confronting disconfirming evidence.
  *   **However, it is NOT a fatal blow to the entire field.** Careful evolutionary psychology uses evolutionary theory to generate *testable hypotheses* about psychological mechanisms. Your Wason test counter-examples demonstrate this testability.
  *   **Your brother's summary mixes oversimplifications, a fair core critique (just-so stories), and a major misrepresentation (genetic determinism/culture doesn't matter).**
  *   **The crucial distinction** between explaining *past evolutionary function* and describing *current* adaptiveness, health, or flexibility is key to avoiding confusion and straw-man arguments. Evolutionary psychology aims for the former, not the latter.
  *   **Therefore:** The "just-so story" critique highlights a serious methodological pitfall that researchers must avoid. It does *not* mean that asking evolutionary questions about the mind is inherently unscientific. It means the methods must be rigorous, hypotheses testable, and alternative explanations considered. When done well, evolutionary psychology is a valuable scientific framework.

  Focus your paper on explaining the "just-so story" critique clearly, emphasizing the importance of testability (using examples like the Wason test variations), and highlighting your key insight about past vs. present claims. This will show you understand both the critique and the field's defense. Good luck!
