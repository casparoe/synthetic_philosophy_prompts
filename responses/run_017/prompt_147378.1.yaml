prompt: |-
  ok so I'm a senior and I'm in this elective called Human Nature (it's half psych half bio, mostly discussion) and right now we're doing like two weeks on evolutionary psychology. Our teacher had us read a chapter out of one of those pop-science books — I think the guy writes for a magazine or something, I alredy forgot the title and I returned my copy to the library — and then we're supposed to write a short response on whether the "just-so story" criticism actually lands or whether it's mostly people misunderstanding what the field is even claiming. I get the general vibe but I feel like if I just repeat the chapter's framing I'm going to write something a real evolutionary psychologist would roll their eyes at, and I can't really go check anything (our school library has like six psych books and no journal access at all, so please don't just tell me to go read papers, I can't get them).

  The thing is, my brother read the same chapter — he's a psych major at the community college and is extremely confident about everything — and he summed the whole field up for me like this:

  "Evolutionary psychology says the brain isn't one general-purpose learning machine, it's a bunch of separate modules that natural selection built during the Pleistocene while we were all hunter-gatherers, so our minds are stuck running software for a world that doesn't exist anymore. The way they actually do it is: you notice something people do — guys going for younger women, everyone being scared of snakes, people gossiping about who cheated who — and then you make up a story about how that would have helped our ancestors survive and reproduce, and that story is the explanation. Which means whatever fact you hand them, they can cook up a story for it, and a theory that can explain absolutely everything can't be tested and isn't really science. Also the whole point is that these things are innate and genetic, so they basically think parenting and culture don't matter and we're stuck with whatever our ancestors handed us."

  I don't trust him 100% because this is the same person who says Freud was right about everything at dinner, but I also can't tell which parts he's getting from the book and which parts he's adding himself, and I don't want to hand in a paper that's just his confidence in nicer handwriting.

  There's one more piece. The chapter had this experiment thing where people are apparently way better at catching someone who breaks a rule like "if you take the benefit you have to pay the cost" than at catching someone breaking the exact same rule written out as some boring if-then thing about letters and numbers, even though logically it's the same problem, and the book says that shows our brains come with a built-in cheater-detection module. That part honestly kind of blew my mind. But then I made up a counter-scenario to test myself: suppose someone ran that same kind of task in a bunch of small-scale societies and the advantage basically vanished, or suppose it turned out you can get people just as good at the abstract version with like an hour of logic practice. Would that actually kill the module claim, or is there some way an evolutionary psychologist could just absorb that result and keep going — and if they can absorb it either way, is that the thing my brother is complaining about? And more generally: when people say "just-so story," what exactly are they accusing evolutionary psychologists of doing, what would a careful one say back, and does the "so it's not science" conclusion actually follow from the parts of his summary that are right?

  My own guess is that the confusion is that "this trait was useful to our ancestors" and "this trait is useful / healthy / unavoidable right now" are two totally different claims and everyone keeps sliding between them, but I'm not sure that's the main thing going on, or if there's a better distinction I should be building the paper around. Anyway — go through his summary claim by claim and tell me what's fair, what's a caricature, and what a defender would push back on, and also flag anything where even the critics would go "no, that's not our objection." thank u!!
