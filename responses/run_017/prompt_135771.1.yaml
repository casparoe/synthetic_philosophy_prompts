prompt: |-
  I want you to do a piece of applied exegesis: reconstruct how Wittgenstein, working from the remarks eventually published as *On Certainty*, would have responded to a phenomenon that could not have arisen in the form I am about to describe, and be explicit about where the reconstruction stops being supported by the text.

  Call the phenomenon hinge laundering. An institution — a land registry, a statistical agency, a liturgical calendar, the maintainers of a widely used database or classification scheme — introduces a claim into its routine output not as something anyone asserts or argues for, but as background: a cutoff date, a category boundary, a transliteration convention, a default value. Nobody holds it in the sense of having weighed and accepted it; it is simply what the forms, the tables, and the training of new staff presuppose. Two generations later it has become basic for a large and varied set of practices. It is what disputes around the institution presuppose rather than what they are about, and anyone who called it into question would be treated not as mistaken but as failing to grasp what the institution is doing. From surviving paperwork it then emerges that the claim entered the practice through a documented accident — a mistranslation, an arbitrary decision by one clerk, an unrechecked miscalculation — and that, had the accident not occurred, some different and equally arbitrary claim would now occupy the same place. Assume throughout that nothing has broken: coordination around the claim still succeeds, the practice is in good working order, and the discovery concerns provenance rather than truth.

  Please address the following.

  1. Draw, as carefully as you can, the distinction a Wittgensteinian needs between an ordinary empirical proposition and a hinge or world-picture proposition, and say whether the laundered claim is one or the other — both before the paperwork surfaces and after. Be explicit that the discovery does not show the claim to be false.

  2. Provenance. Hinges are, on his account, themselves unfounded: they are not held on the strength of reasons and are not the sort of thing that could be. If that were the whole story, learning that a hinge originated in a clerical error would be a non-event. Is that where he would land, or does anything in the material on inherited world-pictures, on what is passed on in schooling and upbringing, or on the difference between the hard rock and the shifting sand of the riverbed give him resources for treating accidentally acquired hinges differently from ones with a long history? Which way would you expect him to go, and what in the text pushes each way?

  3. The reformers. Suppose a movement forms to correct the claim, publicize the paperwork, and hold an inquiry. Given what he says about argument, persuasion, and the way a world-picture changes, would he expect publicizing the accident to accomplish anything? If not, what sort of thing would he expect to move a community's hinges, and would he regard that as something one can plan?

  4. Where the reformers stand. Identify the hinges that the demand that arbitrary origins discredit a practice, or that a documented error is a reason to stop, itself rests on — and say whether he would treat that demand as exempt from the treatment he gives everyone else. Compare the case with G. E. Moore's gesture of holding up his hands as a proof of an external world.

  5. Limits. Mark which parts of your answer *On Certainty* genuinely supports, which require going beyond it, and where the text is silent or pulls in two directions. If you think he would decline the question altogether, on the grounds that whether to keep or discard the claim is not a philosophical question, say so and explain why that refusal is the most faithful answer available.

  Do not summarize *On Certainty* as a whole; go straight to the case. Keep the whole reply under 700 words.
reasoning: |-
  Okay, the user wants me to reconstruct how Wittgenstein would respond to "hinge laundering" based on *On Certainty*. Let me start by understanding hinge laundering. It's when an institution introduces a claim through routine output, like a cutoff date or category boundary, without anyone explicitly asserting it. Over time, it becomes a background assumption crucial for practices. Later, it's discovered that this claim originated from an accident—like a clerical error—but the practice still works fine. The key is that the discovery is about provenance, not truth.

  First, I need to distinguish hinges from empirical propositions. In *On Certainty*, hinges are foundational certainties that aren't based on evidence. They're the framework within which doubts and inquiries happen. Empirical propositions are testable within that framework. The laundered claim acts as a hinge both before and after the discovery because it's embedded in practices, even if its origin is arbitrary. The discovery doesn't make it false; it just reveals its accidental origin.

  Next, provenance. Wittgenstein says hinges are unfounded, so learning about the clerical error might seem irrelevant. But *On Certainty* also discusses how hinges are inherited through training and social practices. The longevity and role in a practice matter more than origin. So, he'd likely see the accident as a non-issue unless it affects current use. The text supports this through examples of how certainties are transmitted, not justified.

  Then, the reformers. Publicizing the accident probably won't change hinges because hinges change through shifts in practice, not arguments. Wittgenstein thinks world-pictures evolve slowly through changes in actions and forms of life. Reformers might need to alter practices practically, not just present evidence. Planning such change is tricky since it depends on communal adoption.

  For the reformers' stance, their demand relies on hinges like the value of historical accuracy or rejection of arbitrariness. Wittgenstein would treat these as another world-picture, not exempt. Comparing to Moore, the reformers' gesture is similar—they're asserting their hinges, but it doesn't prove anything to those with different certainties.

  Limits: *OC* clearly supports the role of hinges in practices and their non-empirical nature. The focus on practice over provenance is text-based. The text is silent on accidental origins, so extending his view here is necessary. He might refuse the question as non-philosophical since deciding to keep or discard is a practical, not philosophical, issue.
answer: |-
  Here is a Wittgensteinian response to "hinge laundering," grounded strictly in *On Certainty* (OC) and marking limits:

  1.  **Distinction & Status of the Claim:**
      *   **Empirical Proposition:** Tested within a system. Supported or undermined by evidence, experience, or procedure (e.g., "This deed is registered under plot X," "The average is 5.2"). Doubt is meaningful here (OC 341, 56).
      *   **Hinge Proposition:** Functions as an unchallenged framework enabling testing, doubting, and acting. Not justified by evidence; its acceptance *shows* in practice. Doubt here is idle, signaling misunderstanding, not error (OC 341-344, 151-152, 115).
      *   **The Laundered Claim (Before & After):** It is a hinge *both before and after* the discovery. Its role as the unchallenged, practice-constituting background is unchanged by the paperwork surfacing. The discovery concerns its *genesis*, not its current *function* or truth/falsity (which are irrelevant to its hinge status). OC supports this: hinges are defined by use, not origin or truth-value (OC 94, 205, 559).

  2.  **Provenance:**  
      *   **OC Pulls Toward Non-Event:** Wittgenstein *emphatically* denies hinges need justification or a "noble" origin. They are "there, like our life" (OC 559). Their authority comes from being "handed down" and embedded in action, not pedigree (OC 94, 298, 344). Learning of the accident is like learning a myth of origin – interesting anthropologically, but philosophically irrelevant to its current role. The hinge works *now*; that's what matters (OC 99, 105).
      *   **Tension with Inheritance?** While OC stresses hinges are inherited through training and practice (OC 94, 279), it offers *no* resources to privilege hinges with long, "authentic" histories over accidental ones that *function identically within the practice*. The "riverbed" (OC 96-99) analogy concerns the *mutability* of hinges over time, not validating origins. The "hard rock" is defined by current function, not historical depth. **Reconstruction:** He'd likely see it as a non-event. The text pushes *hard* against origin mattering.

  3.  **The Reformers:**
      *   **Publicizing the Accident:** OC suggests this will fail. Argument doesn't dislodge hinges; it presupposes them (OC 609-612). Presenting historical facts treats the hinge as an empirical proposition, misunderstanding its role. The community will likely dismiss it as irrelevant or mad (OC 155, 467).
      *   **What Would Move Hinges?** Change happens through shifts in *practice*, forms of life, and "persuasion" akin to conversion or re-training (OC 92, 262, 612). It requires altering *how people act and react*, not just their beliefs. Think new rituals, tools, or training regimes emerging organically or imposed by overwhelming practical need/crisis.
      *   **Can it be Planned?** Unlikely systematically. Such change is holistic, slow, and depends on uptake within the "stream of life" (OC 97, 359). Reformers can *try* to instigate new practices, but success depends on complex, uncontrollable factors. OC is skeptical of top-down hinge engineering (OC 609-610).

  4.  **Where the Reformers Stand:**
      *   **Their Hinges:** Their demand rests on hinges like: "Arbitrary origins undermine legitimacy," "Documented error mandates correction," "Historical provenance is relevant to current authority," "Transparency/purity is fundamental." These are *their* world-picture elements.
      *   **Exempt? No.** Wittgenstein treats *all* such fundamental demands as expressions of a particular world-picture, not universally valid axioms (OC 608-611). Comparing them to Moore is apt: Holding up hands proves an external world *only if* you already accept hinges about perception, hands, etc. (OC 1, 20, 151). Similarly, the reformers' demand "proves" the need for change only within *their* framework, which the institution doesn't share. Their stance isn't philosophically privileged (OC 608).

  5.  **Limits:**
      *   **Supported by OC:** The core distinction (1), the functional definition of hinges (1, 2), the unfoundedness of hinges (2), the inefficacy of argument against hinges (3), the non-privileged status of the reformers' stance (4), the comparison to Moore (4).
      *   **Beyond/Silent:** OC is silent on *accidental* origins specifically. The inference that origin is irrelevant is strong but relies on OC's *consistent denial of the relevance of justification/origin generally* (2). The text doesn't explicitly discuss planned hinge-change; the view on reformers' planning (3) extrapolates from OC's views on persuasion/practice.
      *   **Pulls Two Ways?** The emphasis on inheritance/training *could* be stretched to suggest origin matters, but OC never uses it to *validate* hinges, only to explain their *presence*. The functional definition dominates.
      *   **Refusal?** He *might* refuse the practical question ("Should we keep it?") as non-philosophical (OC 124). Philosophy clarifies the logical status (hinge) and the futility of certain arguments, but doesn't prescribe action within a form of life. The faithful answer is descriptive analysis, not a verdict.
