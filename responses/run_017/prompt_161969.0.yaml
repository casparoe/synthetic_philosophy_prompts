prompt: |-
  I should be grateful for your help with an argument I was unable to settle, and which I should prefer to understand rather than to have settled for me.

  Since retiring from a career in protein physical chemistry I have been attending a philosophy of science reading group at the university. At our last meeting two members of it — Dr Halloran, who teaches philosophy of science there, and Dr Biswas, a historian of science — disagreed about incommensurability and neither would give ground. I was the only person in the room who had lived through the case under discussion, so I was asked to referee; I could not, and I should like to know what I ought to have said. I have tried to report both sides fairly. I take no view myself: I was persuaded, and then unpersuaded, by each of them within the same hour.

  The case was one I had supplied. The working hypothesis of my field in the 1960s was that a protein's native conformation is the conformation of lowest Gibbs free energy available to the chain and is therefore fixed by the amino acid sequence alone; the classical demonstration was that a small enzyme, unfolded in urea with its disulphide bonds reduced, would recover both its structure and its activity when the denaturant was removed, and would do so unaided. What has replaced this is not a hypothesis but a picture: a funnel-shaped energy landscape with many routes down it, kinetic traps and metastable intermediates, folding in the cell usually assisted by chaperones, a large class of proteins with no single native fold at all, some of which fold only upon binding a partner, and — most awkwardly — prions, in which one sequence supports two stable self-propagating folds, so that what the chain becomes depends in part on what it was last alongside rather than on the sequence alone. The sentence *the native conformation is determined by the sequence* is therefore now, depending on how charitably one reads it, false, or trivially true because it has been emptied of content, or not the sentence anybody was asserting in 1962. The group's question was whether that sentence was refuted or merely abandoned.

  Halloran opened with the strong reading. The reference of a theoretical term, he said, is fixed by the whole network of laws in which it appears; when the network is replaced the terms do not keep their referents, so there is no proposition both theories assert of which one says yes and the other no. What looks like refutation is replacement. It follows that no neutral procedure could have adjudicated the transition, that the shift was a conversion rather than an inference, and that *the better theory won* is true only retrospectively, told in the winner's vocabulary.

  Biswas granted that meanings shift but denied that reference is controlled by the whole theory. Some terms are anchored from outside it, by instruments, samples and measurement routines that survive the change, and it is precisely in that shared vocabulary that the old theory made numerical predictions which then failed. There is therefore a genuine contradiction, hence a genuine refutation, hence no need to invoke conversion. She added that if the strong thesis were true we could not even say that the new picture handles the old cases better, which is a visible fact about the recent history of the field and not a piece of ideology.

  Halloran conceded the shared measurement vocabulary but said it does not reach far enough. The proposition that failed was stated in terms of a quantity — the free energy of *the* native conformation — whose identity conditions were supplied by the old theory, which allowed exactly one such conformation per sequence. Once the successor makes the native state an ensemble, allows chaperone-dependence and allows two stable folds for one chain, the old quantity has no successor quantity, and there is nothing both parties assert about it. He proposed a diagnosis of his own: successor lexicons are *one-way expressible* in the predecessor's — the new vocabulary can state the old claim and say where it fails, while the old vocabulary cannot so much as formulate the new one — and, he said, one-way expressibility gives you replacement, not refutation. The appearance of refutation is produced by doing the translation in the winner's language and then forgetting that one did it.

  Biswas replied, first, that one-way expressibility is enough for refutation in the only sense that matters: to refute a claim is to show, in a vocabulary one accepts, that the claim, on its best reconstruction, is false; the asymmetry is a fact about who is in a position to see this, not a semantic obstacle to its being so. Second, she said the asymmetry is itself a reason for preferring the successor, and offered it as a standard both sides could apply from outside either theory: *expressive span*, the capacity to state more of what the rival can state. Halloran's own concession, she said, supplies the common measure he claimed did not exist.

  Halloran answered that expressive span is not neutral. Counting what a lexicon can state requires a prior decision about which states of affairs are worth stating — whether the ability to talk about chaperones and disordered ensembles counts as gain depends on whether those things matter — and that decision is exactly what changes in a transition. He offered a different account of the rationality of a shift, which needs no comparison at all: a practice is entitled to supersede its predecessor if it dissolves the problems its predecessor generated, where *problem* is fixed internally to the predecessor. Progress is inheriting a problem list and shortening it, not outscoring a rival on a shared scale.

  Biswas said this smuggles comparability back in. To say that the successor solves the *old* problems one must re-identify those problems across the lexical break, and re-identification requires translating at least the problem statements; so Halloran owes a criterion for problem re-identification, and any criterion strong enough to re-identify a problem is strong enough to carry a contradiction. If problem inheritance can survive the break, why cannot failure also survive it?

  At this point I ventured a case from my own métier, and each of them then used it against the other. When the kilogram was recently redefined by fixing the numerical value of the Planck constant, the *definition* of the unit changed while the quantity was held fixed by an explicit continuity stipulation, checked against theInternational prototype to within the available uncertainty. Halloran said this proves his point: continuity had to be imposed by a convention adopted for practical reasons, which shows that reference is not preserved automatically, and in a scientific revolution there is no body with the authority to impose it — indeed the disputes just are about whether the old term and the new term pick out the same stuff. Biswas said it proves hers: meaning change plainly does not entail reference change, which is Halloran's premise; and the continuity in such cases is not secured by a description at all but by ostension, by our continuing to handle the same samples in the same vessels. In our case, she said, the anchor is a thing and not a sentence: the same polypeptide chain, the same preparation, the same calorimeter. Halloran replied that ostension individuates objects and not quantities or properties, and that the disagreement is about which quantities the chain bears — whether there exists a property of the kind the old theory ascribed — which pointing at the chain cannot settle.

  Would you go through the exchange and adjudicate it move by move? I should like each move rated from clearly mistaken to clearly right, with a sentence or two of justification, rather than a verdict on the whole; then an overall judgement as to who is more right; then what, if anything, both of them are missing. Four things in particular puzzle me. Whether *refuted* survives at all if Halloran's one-way expressibility is granted. Whether expressive span is a neutral standard or merely the successor's own verdict about what is worth saying, restated in comparative form. Whether my metrological case is a genuine model for a paradigm shift or a misleading one, and on which side of the dispute it finally falls. And whether either of them has actually supplied a criterion for re-identifying a quantity, a problem, or a sample across a lexical break, or whether that is the load-bearing omission in both positions. If you think the argument turns on a distinction neither of them drew, say what it is.

  One request: please adjudicate the arguments as they were actually made, and do not simply report what the secondary literature says about incommensurability. It was the secondary literature that got them into this, and I can read it myself.
reasoning: |-
  Okay, let me approach this methodically. The user presents a sophisticated philosophy of science debate about incommensurability in protein folding history, with four specific puzzles to resolve. 

  First, I need to map the core disagreement: Halloran defends strong incommensurability where theory change replaces rather than refutes predecessors, while Biswas argues for referential continuity enabling genuine refutation. Their moves form a dialectical sequence:

  Halloran's opening relies on theory-laden reference - theoretical terms derive meaning from entire networks. When networks change, reference shifts. This makes direct comparison impossible. 

  Biswas counters with stable referential anchors - instruments and samples that persist through theory changes. These allow testing old predictions and creating contradictions. 

  Halloran's response about quantities is crucial - he distinguishes between the physical chain (which persists) and theoretical quantities like "the native conformation" (which don't survive). This moves the debate from objects to properties.

  The kilogram case becomes pivotal. Halloran sees it as proof that reference preservation requires convention, while Biswas sees it demonstrating that reference can persist despite meaning change. 

  Four key puzzles emerge:
  1) Whether refutation is possible given one-way expressibility
  2) Whether expressive span is neutral
  3) What the kilogram case reveals
  4) Whether cross-theory identification criteria exist

  I'll need to evaluate each move while respecting the user's constraints: no appeals to secondary literature, focus on actual arguments made, and addressing all four puzzles. The protein folding case provides concrete grounding - from single-fold determinism to ensemble/chaperone models - making this more tangible than abstract philosophy.

  The user's background as a physical chemist who witnessed this scientific shift is significant. They've likely encountered both frameworks professionally, explaining their initial alternating agreement during the debate. Their request for move-by-move adjudication suggests they want analytical tools to parse such disputes themselves.
answer: |-
  Here is a move-by-move adjudication of the debate, followed by an overall judgment and analysis of the unresolved questions. I evaluate each core argument on clarity, logical soundness, and empirical adequacy to the protein folding case.

  ### Adjudication of Moves
  1.  **Halloran's Opening (Strong Incommensurability):**  
      *Rating: Partly Right but Overstated.*  
      Theory-ladenness of reference is real (e.g., "the native conformation" *meant* a unique, sequence-determined state in 1962). However, claiming *no* proposition is shared ignores stable referential anchors (e.g., the polypeptide chain itself). Refutation isn't impossible—it just requires careful translation.

  2.  **Biswas' First Reply (Referential Anchors & Refutation):**  
      *Rating: Largely Correct.*  
      Instruments, samples, and measurement routines (e.g., calorimetry, CD spectroscopy) provide continuity. The old theory made testable predictions (e.g., "This denatured RNase will refold to 100% activity without aid") that failed empirically. This *is* refutation via shared experimental vocabulary.

  3.  **Halloran's Rebuttal (Loss of Quantities):**  
      *Rating: Insightful but Incomplete.*  
      Correct that "free energy of *the* native conformation" has no direct counterpart when "native" becomes an ensemble or prion state. *But* he ignores that the *chain's observable behavior* (folding kinetics, activity recovery) remains a common target for both theories to explain/predict. Failure to predict *that behavior* is the refutation.

  4.  **Halloran's "One-Way Expressibility":**  
      *Rating: Valid Observation, Invalid Conclusion.*  
      Asymmetry exists: New theories often describe old phenomena more comprehensively. But this doesn't make refutation impossible. Biswas is right: Refutation occurs when a successor theory *in its own terms* demonstrates why the predecessor's claims (when charitably reconstructed) are false given empirical data anchored in practice (e.g., "Chaperones are required for folding in vivo, contradicting the 'unaided' claim").

  5.  **Biswas on Expressive Span:**  
      *Rating: Problematic but Salvageable.*  
      Expressive span *isn't* neutral if defined solely by the successor's interests (e.g., "Can it talk about chaperones?"). *However*, if defined as the capacity to reconstruct and explain *the predecessor's empirical domain plus anomalies it couldn't handle*, it becomes a weak but useful cross-theoretic standard (e.g., new theory explains both classical refolding *and* chaperone dependence).

  6.  **Halloran on Problem-Solving Progress:**  
      *Rating: Strongest Positive Argument.*  
      Progress as "inheriting and shortening the predecessor's problem list" (e.g., explaining protein folding *speed*, aggregation, chaperone effects) avoids direct comparison of incommensurable concepts. This is a robust internal criterion for rationality.

  7.  **Biswas' Challenge on Problem Re-identification:**  
      *Rating: Correct & Damaging to Halloran.*  
      If problems (e.g., "How does sequence determine fold?") can be inherited across the lexical break, then *failure* (e.g., "The old answer predicts X, but we observe not-X") can too. Halloran needs a criterion for re-identifying problems that doesn't also permit re-identifying failures/contradictions. He doesn't provide one.

  8.  **The Kilogram Example:**
      *   **Halloran's Use:**  
          *Rating: Misleading.*  
          Metrological redefinitions *stipulate* continuity for practical consistency. Scientific revolutions involve *discovery-driven* conceptual breaks (e.g., discovering prions forces rethinking "one sequence, one fold"). No authority can stipulate prions don't challenge the old concept.
      *   **Biswas' Use:**  
          *Rating: More Relevant.*  
          The kilogram case shows meaning change ≠ reference change when anchored by *procedures and artifacts* (prototype, measurement setup). Similarly, the *same chain*, *same denaturation protocol*, *same activity assay* anchor "folding" across theories. Failure occurs within this stable framework.

  9.  **Halloran on Ostension:**  
      *Rating: Half-Right.*  
      Correct that pointing to a chain doesn't settle *which properties* it has (e.g., "Does it have *a* native conformation?"). *But* ostension plus shared measurement routines (e.g., "Measure activity after refolding") *does* anchor empirical outcomes that theories must predict. The disagreement is about *concepts*, but the *data* (e.g., activity recovery rate) persists.

  ### Overall Judgment
  **Biswas has the stronger position.** She successfully defends the possibility of genuine refutation through empirically anchored failures in prediction (e.g., chaperone dependence, prions). Halloran correctly identifies deep conceptual shifts but overstates their implications, rendering scientific progress mysterious and failing to adequately explain how problems are inherited if failures are not. Biswas' appeal to stable experimental practices and artifacts provides the necessary bridge for cross-theoretic comparison.

  ### What Both Are Missing / Unresolved Puzzles
  1.  **Refutation & One-Way Expressibility:**  
      Refutation *survives* if defined pragmatically: The successor theory, using its own concepts and shared measurement practices, *explains why the predecessor's central claims (under charitable reconstruction) are empirically inadequate*. The asymmetry doesn't negate refutation; it reflects the successor's broader explanatory power. Halloran conflates *semantic discontinuity* with *empirical incomparability*.

  2.  **Expressive Span Neutrality:**  
      **Not inherently neutral.** If defined as "can say what the rival says *plus more*," it's circular (the successor decides what "more" matters). **But** it *can* be operationalized neutrally as: *Which lexicon allows the more precise, empirically adequate reconstruction of the phenomena both theories aimed to explain, plus the anomalies that troubled the predecessor?* This focuses on explanatory coverage of a *common empirical domain*.

  3.  **Kilogram Case:**  
      **Misleading for paradigm shifts.** It models *coordinated conceptual refinement within a stable framework* (metrology), not revolutionary change driven by discovery (prions). It falls on **Biswas' side** only weakly, showing meaning ≠ reference, but fails to model the *conceptual disruption* of discovering phenomena (prions) that the old framework *couldn't coherently describe*.

  4.  **Criterion for Re-identification (The Load-Bearing Omission):**  
      **Neither supplies a sufficient criterion.**  
      *   **Biswas** relies on "same samples, same instruments," which anchors *objects and data* but not necessarily *theoretical kinds/properties* (e.g., is "native conformation" the same property?). She needs a criterion for re-identifying *the explanatory target* (e.g., "protein folding behavior under condition X") across theories.
      *   **Halloran** relies on problem inheritance but offers no criterion for re-identifying *the problem* (e.g., "How does sequence determine structure?") beyond intuitive similarity, which undermines his claim that failures don't persist.

      **The Key Distinction:** **Phenomena vs. Theories.** Both miss fully articulating that:
      *   **Phenomena** (e.g., the refolding kinetics of purified RNase A under condition X, chaperone dependence in vivo, prion propagation) are relatively stable, anchored in reproducible practice.
      *   **Theories/Kinds** (e.g., "the native conformation," "folding pathway") are contested.
      Refutation occurs when a *phenomenon* (e.g., "This prion-forming chain adopts two stable folds") robustly conflicts with a *theory's* prediction (e.g., "One sequence, one fold"). Problem re-identification works by tracing which *phenomena* a theory was meant to explain. Quantity re-identification is harder but relies on continuity in *measurement operations* defining the quantity (e.g., "free energy difference *measured by* equilibrium unfolding"). The prion case shows this continuity *can* break for some quantities (e.g., "*the* native state free energy"), forcing conceptual replacement, but the *phenomenon* (the chain's bistability) remains the refuting anchor.

  **In essence:** The debate conflates the stability of *phenomena and measurement practices* with the instability of *theoretical concepts*. Recognizing this distinction allows refutation (via phenomena) and problem inheritance (via phenomena needing explanation) even amidst conceptual revolution (prions forcing new kinds), resolving the stalemate. Your protein folding case beautifully illustrates this interplay.
