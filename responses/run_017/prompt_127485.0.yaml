answer: |-
  Your thought experiment is clever, but I reject the dilemma. The reportive isn't assertion at all; it's something else—likely a device for expressing *reasonable belief* or *prima facie credible information* without claiming the speaker's epistemic authority. This community *does* exchange information, but they do so through a practice functionally distinct from assertion. The witnessed form *is* their assertion: it alone carries the constitutive commitment to knowledge, manifest in the accountability practices you describe (challenge, correction, staking something). The reportive is analogous to prefacing every claim with "I think" or "I've heard" in our language—it signals a lower epistemic tier, bypassing the knowledge norm precisely because it avoids the full illocutionary force of assertion.

  You cry "absurd!"—a community exchanging information without assertion. But why? We readily accept communities without *promising* or *commanding*, yet they coordinate actions. Here, they coordinate beliefs via reportives as *provisional inputs* for practical reasoning or further verification, finalized only when upgraded to witnessed form (akin to endorsing with knowledge). The reportive functions more like *supposition offered for consideration* or *hearsay reporting*. Assertion isn't the only way to transmit information; it's the way to *vouch* for it with personal authority. They *have* that—in witnessed utterances. That they get by without using the full "vouching" move for every claim doesn't negate assertion's nature; it shows they compartmentalize epistemic risk. The knowledge norm governs witnessed utterances, confirming its constitutive role *for genuine assertion*.

  ---

  On falsifiability: Your objection misunderstands the test. It's not about *finding* a commitment everywhere; it's about detecting the *normative structure* implicit in practice. A genuine counterexample would be a community where: (1) They have a default, unqualified declarative for informing others; (2) Speakers freely utter "P, but I don't know P" *without* oddity, self-correction, or challenge; (3) Hearers treat such utterances as fully proper informings. *Then* we'd have assertion without the knowledge norm. Crucially, the oddity test probes the *internal* norms, not speakers' theorizing. If your reportive users *do* find "P (reportive), but I don't know P" coherent and unproblematic, *that* might show it lacks the knowledge norm. But you stipulate they act on, pool, and challenge reportives—suggesting they *treat* them as carrying *some* epistemic weight. The question is: does *denying knowledge* while using the reportive *undermine* its function in their eyes? If yes, the commitment lurks implicitly. If no, it might be belief-based. But crucially, *our* assertion shows the oddity—and no stable community practice mirrors your reportive *without* exhibiting parallel normative constraints tied to their "guarantee" form. The demand isn't misplaced; the burden is to describe a practice where unqualified informing is truly normatively detached from knowledge. Your reportive, as described, likely still binds speakers to *justified belief* or *reliable sourcing*, indicating a weaker but structurally similar norm—not its absence.
