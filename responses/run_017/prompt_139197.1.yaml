  Below is a flowchart-style handout addressing how different foundational systems resolve Russell's paradox. It starts from the paradox and branches based on decisions about collection formation, logic, and membership. Each leaf describes a position (or family of positions) and what is lost when formalizing mathematics. Empty cells are noted, and positions that collapse together are flagged. The structure uses indented questions and answers, with leaves marked as **bolded entries**.

  ---

  ### Russell's Paradox and the Menu of Fixes  
  *Start:* You want to form the collection \(R = \{ x \mid x \notin x \}\). But \(R \in R\) iff \(R \notin R\)—a contradiction. How do you proceed?  

  1. **Keep classical logic unchanged?**  
     - *No* (change logic to block explosion from contradictions):  
        - **A. Adopt a paraconsistent logic?**  
           - *No* → *[Empty: Without blocking explosion, contradictions trivialize all truths.]*  
           - *Yes* →  
              - **Block Curry's paradox?** (The negation-free variant: Define \(C = \{ x \mid (x \in x) \to P \}\) for arbitrary \(P\). If \(C \in C\), then \(P\) holds, proving *any* \(P\) without negation.)  
                 - *No* → *[Empty: Curry still trivializes the system.]*  
                 - *Yes* (e.g., restrict implication rules like contraction \( (A \to (A \to B)) \vdash (A \to B) \)):  
                    → **Leaf 1: Contradiction-tolerant set theory**  
                       *Loss: Standard implication and self-referential proofs break; you cannot reason classically about functions, recursion, or equivalence.*  
     - *Yes* (keep classical logic):  
        - **B. Allow unrestricted comprehension?** (Form \(\{x \mid \phi(x)\}\) for *any* property \(\phi\), with \(x\) ranging over absolutely everything.)  
           - *Yes* → *[Empty: Russell/Curry explode the system.]*  
           - *No* (restrict comprehension):  
              - **C. Require collections to be built cumulatively?** (Only form \(\{x \mid \phi(x)\}\) if \(x\) ranges over a *previously constructed* domain of collections. New collections are built from old ones in stages.)  
                 - *Yes*:  
                    → **Leaf 2: Iterative/cumulative set theory** (e.g., ZFC, where sets are built in ranks \(V_\alpha\))  
                       *Loss: No universal collection. You cannot define "all sets" as a set; large objects (e.g., proper classes) require manual handling in proofs.*  
                       *Note: The "formation stages" fix (properties quantify only over strictly earlier stages) lands here. It works but requires tracking stages explicitly.*  
                 - *No* (allow \(x\) to range over everything—no cumulative hierarchy):  
                    - **D. Allow collections to contain themselves?** (Accept \(x \in x\) or infinite membership chains.)  
                       - *Yes*:  
                          - **E. Restrict comprehension to "positive" properties?** (Ban negation and certain implications; e.g., \(\phi\) uses only \(\land\), \(\lor\), \(\forall\), \(\exists\), \(=\), \(\in\).)  
                             - *Yes*:  
                                → **Leaf 3: Positive set theory** (e.g., GPK)  
                                   *Loss: You lose complement sets, powersets, and other negated constructions; many theorems require manual workarounds.*  
                             - *No* → *[Empty: Russell reappears with self-membership.]*  
                       - *No* (require well-foundedness: membership chains bottom out) →  
                          - **F. Use stratification?** (Assign levels to variables; in \(\phi\), require \(x \in y\) only if level\((x) <\) level\((y)\), and \(x = y\) only if levels match.)  
                             - *Yes*:  
                                → **Leaf 4: Stratified/typed systems** (e.g., Quine's NF, Martin-Löf type theory)  
                                   *Loss: You cannot define unstratified objects (e.g., the Russell collection, or a function mapping a set to its power set). Recursion and induction often need level management.*  
                                   *Flag: Simple type theory and NF collapse here—both enforce stratification.*  
                             - *No*:  
                                - **G. Introduce multiple "sizes" of collections?** (Some collections are "too big" to be members; e.g., distinguish sets vs. proper classes.)  
                                   - *Yes*:  
                                      → **Leaf 5: Two-sorted class theory** (e.g., NBG, MK)  
                                         *Loss: You cannot treat "all collections" as a single object; large categories or universes require stratified meta-theories.*  
                                         *Flag: NBG and MK collapse here—both use class/set distinction.*  
                                   - *No* → *[Empty: No consistent classical fix known.]*  

  ---

  ### Key and Notes  
  - **Leaf 1: Contradiction-tolerant set theory**  
    Dialetheic or paraconsistent approaches (e.g., using relevant logic). Curry's paradox forces weakening implication.  
  - **Leaf 2: Iterative/cumulative set theory**  
    ZFC-like systems. The hand-rolled "formation stages" fix is here.  
  - **Leaf 3: Positive set theory**  
    Non-well-founded sets with a universal set (e.g., \(x \in x\) allowed).  
  - **Leaf 4: Stratified/typed systems**  
    Includes NF (one universe) and type theories (disjoint types). Losses are similar.  
  - **Leaf 5: Two-sorted class theory**  
    Proper classes cannot be members; e.g., the Russell collection is a proper class.  

  - **Empty cells** are unattractive or unexplored:  
    - Changing logic without blocking explosion (Curry) → triviality.  
    - Classical logic + unrestricted comprehension → explosion.  
    - Non-cumulative + non-stratified + non-positive + no classes → no known fix.  

  - **Constructive picture**: Not a leaf! Intuitionistic logic (e.g., in IZF) uses **Leaf 2** but loses classical logic (excluded middle, choice). Loss: Proofs require constructive methods; many classical theorems (e.g., extremal principles) are unprovable.  

  - **What you lose**: Focused on practical formalization pain points (e.g., "you cannot define X", "manual handling required").  

  ---  
  This tree covers all requested leaves (iterative, two-sorted, stratified, non-well-founded, constructive, contradiction-tolerant) and extras (Curry paradox, hand-rolled stages). Positions are separated by their licensing rules—not theory names—and collapse where distinctions aren't foundational.
