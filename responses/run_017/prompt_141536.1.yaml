prompt: |-
  I sit on the standing revision committee for a national adaptation of an international diagnostic manual, and I am tired of watching our categories move under us. We meet three times a year; we are eight clinicians, one epidemiologist, one medical sociologist and two service-user representatives; each of us can spare about a day of preparation per item; and every change has to be defended in a published two-page rationale, because our codes drive billing, school accommodations, insurance and disability benefits, and both industry and advocacy groups will attack anything that looks like a guess. The pattern we keep hitting is that a category changes the people it classifies: prevalence climbs after a label becomes a usable social identity, patients arrive already fluent in the criteria, clinics build referral pathways and billing around a code, and within a decade the presentation we wrote criteria for is no longer the one we see. We have been handling this ad hoc, and I want it turned into a procedure.

  Here is the crude vocabulary we have fallen into, which you should feel free to discard if it does no work: we distinguish loops that run through identity and self-narrative, through our own diagnostic instruments (a checklist that teaches patients which symptoms to endorse), through institutions (referral routes, accommodations, form design), and through markets (pharmaceutical marketing, self-help publishing, social-media communities); and we distinguish loops that tighten a presentation toward a stereotype from loops that splinter it into variants. We also suspect our baselines are contaminated before we even start, because draft criteria circulate and advocacy communities reorganise around a proposed category years before adoption, so that pre-adoption data already reflects a category that does not officially exist. Hacking's ideas about looping effects and interactive human kinds are obviously the theory here, but we cannot cite philosophy in a committee rationale; the procedure has to carry the theory implicitly, in a form a working clinician with no background in it can run in half a day using administrative data, published literature and clinical experience, and with explicit instructions for what to do when the number we want does not exist.

  What I want is that procedure: the questions in order, what counts as a sufficient answer to each given our constraints, the point at which it stops with a no, and the point at which it hands the decision over as a matter of values rather than facts. It must tell a loop apart from its lookalikes — genuine change in incidence, improved ascertainment, changes to the criteria themselves, diagnostic substitution, and compensation or litigation incentives — since those call for different responses and we have confused them before. It should say what we are allowed to do about a looping category: freeze the criteria, prefer symptom-descriptive over identity-shaped labels, narrow to a stabilised core phenotype, split, retire, or keep a code for access while excluding it from surveillance counts and research case definitions, and it should say which of those is a real remedy and which only hides the problem. It should specify what monitoring or sunset clause attaches to whatever we decide. And it should be honest about where it misfires: rare categories, categories anchored to a biomarker, categories adopted under time pressure. Then run it on three of our live items: adult attention-deficit hyperactivity disorder, where reported prevalence and prescribing have risen steeply and self-referral is now largely mediated by social media; paediatric bipolar disorder, which expanded in some countries and not others, in a way that looks institutionally and commercially driven; and a proposed new category for extreme avoidance of everyday demands, which a well-organised parent and patient community is pushing hard for and which several of us, myself included, want to adopt. I will be the one defending the third decision, so if the procedure returns an answer we will not like, give it anyway, and tell me what evidence within two cycles would change the verdict and where my argument is weakest.
reasoning: |-
  Okay, let me start by really understanding what this committee member is asking for. They’re on a standing revision committee for a diagnostic manual, and they’re dealing with categories that change because of the labels themselves. It’s like Hacking’s looping effects in action. But they can’t cite philosophy in their rationales, so they need a practical procedure that clinicians can use without prior knowledge of the theory.

  First, I need to break down their main pain points. They have limited time—one day per item per member—and each change needs a two-page rationale. The categories morph due to identity, diagnostic tools, institutions, and markets. They’ve identified different types of loops: tightening or splintering presentations. Plus, pre-adoption data is already contaminated because drafts circulate early.

  The user wants a step-by-step procedure to detect these loops, distinguish them from other factors like actual incidence changes or diagnostic substitution, and decide on actions like freezing criteria or retiring codes. They also need monitoring steps and honesty about where the method might fail. Then, apply it to three cases: adult ADHD, pediatric bipolar, and a new category for extreme avoidance.

  I should start by outlining the key phases: Detection, Differentiation, Decision, and Monitoring. Detection involves checking for prevalence changes, presentation shifts, and external drivers. Differentiation is crucial to rule out other causes. Decision-making needs clear criteria for each action, like freezing or splitting. Monitoring requires specific triggers and sunset clauses.

  For adult ADHD, the rise in prevalence and social media influence suggests a loop. Pediatric bipolar’s variation by country points to institutional factors. The new avoidance category’s pre-adoption advocacy indicates contamination. The procedure must flag these and recommend actions, even if unpopular. For the avoidance category, the user might need evidence of unaltered prevalence or treatment outcomes to counter looping concerns.

  I need to ensure each step is actionable with available data. Clinicians can use admin data, literature, and their experience. Where numbers don’t exist, the procedure should guide qualitative assessments. Also, specifying when a decision shifts from facts to values is key, like when evidence is inconclusive but access is critical.

  Finally, the procedure must acknowledge limitations, like with rare disorders or biomarker-based categories. For the three examples, being honest about weaknesses in the approach will build credibility. The user might not like the outcome for the avoidance category, but the procedure should stand firm if looping risks are high, suggesting evidence that could change the verdict later.
answer: |-
  Here is a procedural framework designed for your committee, incorporating Hacking's insights implicitly while operating within your constraints. It's structured as a sequential checklist ("The Loop Audit"), designed for completion within half a day using accessible data sources.

  **The Loop Audit Procedure**

  **Phase 1: Detection - Is Something Shifting? (1-2 hours)**
  *   **Q1. Prevalence Trajectory:** Has the reported prevalence shown a sustained, significant increase (e.g., >50% over 5-10 years) *after* initial adoption/stabilization, *disproportionate* to changes in screening/awareness programs? *(Sufficient: Clear administrative/insurance claims data, high-quality registry data, or replicated epidemiological surveys. Stop if: Increase is fully explained by documented, widespread improvements in screening access/methods. Handover if: Increase is moderate/linked to societal stress events - requires value judgment on significance).*
  *   **Q2. Presentation Shift:** Is there clinical consensus (literature review + committee experience) that the *typical presenting features* seen in practice now differ meaningfully from the original criteria? (e.g., more "identity-driven" self-reports, symptom clustering altered, severity profile shifted). *(Sufficient: Systematic review/meta-analysis highlighting changes; strong consensus in 5+ recent clinical practice guidelines; committee members report consistent shift. Stop if: No evidence of shift beyond normal clinical variation. Handover if: Shift is subtle/debated but impacts treatment response - values judgment on diagnostic fidelity vs. real-world utility).*
  *   **Q3. Pre-Adoption Contamination:** Is there evidence the proposed/established criteria were widely disseminated and acted upon (diagnostically or socially) *before* formal adoption? (e.g., advocacy materials directly reference draft criteria, clinics use "provisional" codes, patient communities organize around the pre-release label). *(Sufficient: Documented advocacy campaigns citing drafts, pre-adoption prevalence spikes in pilot regions, analysis of social media/online forums pre-adoption. Stop if: No evidence of pre-adoption use. Handover: N/A - factual finding).*
  *   **Q4. External Drivers:** Is there evidence of significant activity in *at least two* of these domains coinciding with the prevalence/presentation shift?
      *   *Identity/Narrative:* Boom in self-help books, social media communities, identity-first language dominance.
      *   *Diagnostic Tools:* Widespread use of specific screening tools/checklists becoming public knowledge.
      *   *Institutions:* New referral pathways, billing codes, school/employment accommodations directly tied to the label.
      *   *Markets:* Heavy pharmaceutical DTC marketing, diagnostic clinics advertising specifically for the condition. *(Sufficient: Market research data, media analysis, policy document review, healthcare administrative data on service pathways/billing. Stop if: No evidence or activity isolated to one domain. Handover if: Activity is present but impact is contested - values judgment on influence).*
  *   **Detection Outcome:** If **Q1 + Q2 + (Q3 or Q4)** are answered "Yes", proceed to **Phase 2**. Otherwise, "No Significant Looping Detected" - standard revision processes apply.

  **Phase 2: Differentiation - Is it Looping or Something Else? (1-2 hours)**
  *   **Q5. Rule Out Lookalikes:** Can the shifts detected in Phase 1 be *better explained* by:
      *   *Genuine Incidence Change:* New environmental toxin, pandemic, major societal trauma? *(Check: Correlate with known exposures/events across populations)*.
      *   *Improved Ascertainment:* Documented, widespread rollout of new, highly sensitive screening? *(Check: Timing matches screening program start, increase plateaus post-rollout)*.
      *   *Criteria Change (Past):* Was there a major, recent criteria revision *before* this shift? *(Check: Revision history)*.
      *   *Diagnostic Substitution:* Is a similar, previously used category declining as this one rises? *(Check: Prevalence trends of adjacent diagnoses)*.
      *   *Compensation/Litigation:* Is access to significant benefits/services *solely* contingent on this specific diagnosis? *(Check: Policy documents, legal rulings)*.
  *(Sufficient: Strong temporal/data correlation with an alternative explanation that fully accounts for the magnitude and nature of the shift. Stop if: A single alternative explanation provides a clear, complete account. Handover if: Multiple factors contribute, but looping appears significant - values judgment on dominant driver).*
  *   **Differentiation Outcome:** If **no single lookalike** provides a sufficient complete explanation, conclude "**Likely Looping Effect Present**" and proceed to **Phase 3**.

  **Phase 3: Decision & Action - Mitigating the Loop (1-2 hours)**
  *   **Q6. Nature of Loop:** Is the loop primarily:
      *   *Tightening:* Presenting features converging towards a narrower stereotype? (e.g., only specific symptom clusters reported, heterogeneity lost).
      *   *Splintering:* Presentation fragmenting into numerous distinct subtypes/variants? (e.g., proliferation of specifiers, "spectrum" concepts dominate).
      *(Sufficient: Clinical consensus + literature review clearly indicating trend. Handover if: Ambiguous pattern - values judgment on potential harm of each).*
  *   **Q7. Assess Harm:**
      *   *Clinical Harm:* Reduced diagnostic accuracy? Delayed/misdirected treatment? Overtreatment of mild cases? Undertreatment of atypical cases?
      *   *Social Harm:* Stigma amplified? Identity becoming overly defining? Resource misallocation?
      *   *Systemic Harm:* Billing fraud? Diagnostic inflation undermining credibility? Erosion of trust?
  *(Sufficient: Evidence of harm from clinical audits, outcome studies, patient surveys, ethics reviews, fraud investigations. Handover if: Harm is potential vs. proven - values judgment on risk tolerance).*
  *   **Action Matrix (Based on Q6 & Q7):**

  | Loop Type       | Significant Harm Identified | Minimal/Unclear Harm       | Action Notes                                                                 |
  | :-------------- | :-------------------------- | :------------------------- | :--------------------------------------------------------------------------- |
  | **Tightening**  | **Freeze Criteria**         | **Narrow to Core Phenotype** | Freezing halts feedback. Narrowing focuses on most stable, objectively defined features. *Core must be functional/biomarker-anchored if possible.* |
  | **Splintering** | **Split** OR **Retire**     | **Prefer Symptom-Descriptive Label** | Splitting if valid subgroups exist; Retiring if category loses coherence. Symptom labels (e.g., "Affective Dysregulation") reduce identity capture. |
  | **Any** + **Severe Access Dependency** | **Segregate Code**          |                            | Keep code *only* for billing/access, exclude from surveillance/research definitions. Add "Legacy Access" flag. *Hides but doesn't solve loop.* |
  | **Pre-Adoption Contamination High** | **Avoid/Defer Adoption** OR **Adopt with Extreme Caution + Monitoring** |                            | Contamination suggests loop is already active. Adoption fuels it. Caution essential. |

  *   **Action Outcome:** Select action based on matrix. **Freeze, Narrow Core, Split, Retire, Segregate, Avoid/Defer** are substantive remedies. **Prefer Symptom Label** is a mitigation. **Adopt with Caution** is high-risk.

  **Phase 4: Monitoring & Sunset (30 mins)**
  *   **Mandatory for any Action except Retire/Avoid:**
      *   **Define Monitoring Metrics:** Specific, measurable indicators tied to the loop/harm (e.g., stability of prevalence, treatment response rates, diagnostic stability over time, measure of diagnostic heterogeneity).
      *   **Set Review Trigger & Sunset Clause:**
          *   *Trigger:* If metric [X] moves beyond threshold [Y] within [Z] years (e.g., prevalence increases >20% in 3 years post-freeze; diagnostic stability <60% in 5 years post-split).
          *   *Sunset:* Automatic review for retirement or major revision if trigger hit. Default sunset at 10 years regardless.
      *   **Specify Data Source:** Administrative data, mandatory registry, specific research initiative.

  **Acknowledged Limitations:**
  *   **Rare Categories:** Low statistical power for prevalence shifts. Reliance on qualitative/clinician reports increases.
  *   **Biomarker-Anchored Categories:** Loops less likely to distort core phenotype, but can still affect perception/access/expression. Focus differentiation (Q5) intensely.
  *   **Time Pressure:** Increases risk of inadequate Phase 1/2. Prioritize Q3 (Pre-Adoption Contamination) and Q7 (Harm).
  *   **Data Gaps:** If critical data missing (e.g., no reliable prevalence pre-adoption), flag uncertainty prominently in rationale. Use best available proxy (e.g., specialist referral rates). Committee clinical consensus becomes primary data point.

  ---

  **Application to Live Items:**

  1.  **Adult ADHD:**
      *   **Phase 1:** Q1 (Yes - steep rise), Q2 (Yes - presentation influenced by social media narratives, self-dx common), Q3 (No - established cat.), Q4 (Yes - Identity/Narrative: massive social media; Markets: Pharma DTC, private clinics). **Proceed.**
      *   **Phase 2:** Q5 - Lookalikes? Genuine change? (Unlikely universal); Ascertainment? (Improved, but not sufficient for magnitude); Criteria? (DSM-5 change, but rise continued); Substitution? (Some decline in GAD? Not major); Compensation? (Limited - accommodations exist but not primary driver). **No single sufficient lookalike. Likely Looping.**
      *   **Phase 3:** Q6 (Tightening? - Mixed. Splintering? - Some, e.g., focus on inattention vs. hyperactivity). Q7 (Harm? - Overtreatment concerns, diagnostic inflation, potential trivialization). **Action:** Given mixed loop type but significant harm concerns → **Freeze DSM-5-TR criteria.** **Monitor:** Prevalence stability via claims data; Diagnostic accuracy studies in self-referred populations. **Trigger:** >15% prevalence rise in 5 years; <70% diagnostic stability over 2 years. **Sunset:** 10-year review.

  2.  **Paediatric Bipolar (Focus on High-Expansion Countries):**
      *   **Phase 1:** Q1 (Yes - in specific countries), Q2 (Yes - broader, softer presentations diagnosed), Q3 (No), Q4 (Yes - Institutions: specific assessment pathways/clinics; Markets: Pharma influence on guidelines/clinics). **Proceed.**
      *   **Phase 2:** Q5 - Lookalikes? Genuine change? (Unlikely geographically patchy); Ascertainment? (May contribute, but not sole cause); Criteria? (Shift towards broader definitions occurred); Substitution? (Decline in CD/ODD? - Evidence mixed); Compensation? (School accommodations possible driver). **Looping + Criteria Change + Institutional Drivers likely.**
      *   **Phase 3:** Q6 (Tightening? - No. Splintering? - Became overly broad). Q7 (Harm? - Significant: Overtreatment with serious meds, diagnostic validity questioned, international inconsistency). **Action:** **Narrow to Core Phenotype** (e.g., require clear episodic euphoric/grandiose mania, not just irritability; strengthen exclusion for trauma/developmental disorders). **Monitor:** Diagnostic stability, rates of antipsychotic prescribing in children, international diagnostic concordance. **Trigger:** Prescribing rates increase post-change; stability <65%. **Sunset:** 7 years.

  3.  **Extreme Avoidance (Proposed Category - "Pathological Demand Avoidance" (PDA) - illustrative):**
      *   **Phase 1:** Q1 (N/A - new), Q2 (N/A - no official criteria yet), Q3 (**YES - Extremely High**: Well-organized community uses specific criteria, self-dx rife, some clinics unofficially diagnose). Q4 (Yes - Identity/Narrative: Strong online communities; Institutions: Some schools unofficially accommodate "PDA"). **Proceed IMMEDIATELY to Q7 Harm Assessment due to High Q3.**
      *   **Phase 2:** Q5 - Lookalikes? Primary issue is **Pre-Adoption Contamination**. Looping is already active.
      *   **Phase 3:** Q7 (Harm? *Potential*: Diverting resources from established Dx (ASD, ODD, Anxiety)? Creating diagnostic confusion? Undermining existing support frameworks? *Potential Benefit*: Better access/understanding for a distressed group? Community validation?).
          *   **Action:** Given **High Pre-Adoption Contamination**, the procedure dictates **Avoid/Defer Adoption** OR **Adopt with Extreme Caution + Intensive Monitoring**. Adoption risks cementing and amplifying an already active loop.
          *   **Your Argument's Weak Point:** The strongest argument *for* adoption (meeting unmet need) is vulnerable because the "need" is already being shaped by the pre-existing, contested PDA construct. The community's self-reports and clinic presentations are *already* filtered through this lens. You cannot demonstrate the category's validity independent of the loop. Evidence of harm from *not* adopting is largely anecdotal (community distress), while evidence of potential systemic harm (diagnostic confusion, resource diversion) is plausible.
          *   **Evidence Needed Within 2 Cycles (6 years) to Change Verdict:**
              *   *Uncontaminated Baseline Data:* Prevalence studies using *only* symptom descriptions *without* the "PDA" label, conducted in settings *not* exposed to the advocacy, showing a distinct, stable cluster *not* covered by existing categories.
              *   *Treatment Outcome Evidence:* RCTs demonstrating that interventions targeted at the proposed "PDA" criteria yield significantly better outcomes than interventions for ASD, ODD, or Anxiety in this *specific* group, defined *without* using the PDA label initially.
              *   *Neurobiological Validation:* Identification of a biomarker or distinct neurocognitive profile strongly associated *only* with the proposed core symptoms, invariant across populations exposed/not exposed to the PDA concept.
          *   **If Adopted Under Caution:** Action = **Prefer Symptom-Descriptive Label** (e.g., "Extreme Demand Avoidance Syndrome (EDAS)" - descriptive, less identity-capture than "PDA") + **Segregate Code** (if access dependency is high) + **Immediate Monitoring**. **Sunset:** 5 years. **Triggers:** Rapid (>30%) prevalence increase; low diagnostic stability (<60%); failure to show distinct treatment response.
