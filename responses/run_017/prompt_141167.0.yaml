prompt: |-
  Right, so I work on the evals side at a small lab and I've been handed the deeply fun task of writing the incident taxonomy for "deceptive outputs" — the thing an auditor is supposed to tick when a transcript comes in and someone has to decide whether this output goes in the bucket or not. So I need a working definition of honesty/deception for an AI system, and before I go shopping for one I want the spec. Assume the purpose is fixed: the definition has to be good enough to be operationalised by an auditor who has the transcript, the system prompt, maybe per-token probabilities, and nothing else — no interviewing the model, no opening up the weights, no reliable introspection reports. Give me the desiderata such a definition has to meet, each with the case behind it, and be explicit about which are non-negotiable and which are just the preferences of one camp. Cases I keep getting stuck on, in no particular order: the flat confident falsehood; the technically-true-but-engineered-to-mislead answer; the omission that lets a false presupposition in the user's question stand; sycophantic agreement; strategic underperformance on a capability eval (the model playing dumb); the model that quietly launders a falsehood through a tool call or a summary so that no individual sentence is false; and then all the things it must NOT flag — fiction, roleplay, hyperbole, legible simplification, a therapy-ish bot staying within its remit. Plus the distinctions I think it has to respect: lying vs merely misleading vs just being wrong, intent vs foresight vs negligence, deceiving the user vs deceiving a third party vs deceiving us the auditors, and a one-off bad sample vs a stable dispositional policy (if a falsehood shows up in 2% of samples, is that a lie or an error rate?). A few things I'd particularly like you to grapple with rather than wave at. (1) The introspective-access problem: for a system whose "beliefs" are arguably nothing over and above its dispositions, and where every probe you'd use to find out what it "really thinks" is itself an intervention that changes the system, what could "asserted what it believed to be false" even cash out as? (2) The multi-principal problem — user, developer, downstream reader who screenshots it: who has to be the victim, and is "deception" relative to a legitimate-expectations set rather than to a hearer? (3) Inherited deception, where the falsehood is a product of the training process (reward hacking, distillation from a teacher, a fine-tune that rewards confident error in a narrow domain) and there's arguably no unified agent doing the deceiving at all. Flag any pair of desiderata you think can't be jointly satisfied — my guess is that output-only auditability and "distinguish lying from merely misleading" are on a collision course, and that catching every omission is on one with not flagging ordinary pedagogy — and tell me which single requirement does the most work in knocking out candidate accounts. Then, briefly, score the main families against the list: the classic intention-based definition (asserting what you believe false with the aim that the hearer believe it), hearer-uptake or expected-effect accounts, purely functional/information-theoretic ones, and role- or norm-relative ones. Keep the weight on the criteria and their motivating cases, not the scorecard. One more thing: I read a lot of this stuff via blogs rather than journals, so please separate what's actually settled among people who work on this from what's contested, and don't dress up one camp's prejudice as the consensus view — if the definition question turns out to be a values question in a trenchcoat somewhere, say where. No citations needed, I can't check them and they'd probably be wrong anyway.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on an incident taxonomy for "deceptive outputs" in AI evals. The main challenge is creating a working definition that auditors can operationalize with limited data—just transcripts, system prompts, and maybe token probabilities. The user listed several tricky cases like confident falsehoods, misleading truths, omissions, sycophancy, strategic underperformance, and falsehood laundering. They also highlighted key distinctions: lying vs misleading, intent, who's being deceived, and one-off errors vs systematic issues.

  First, I need to identify the core requirements for such a definition. The user mentioned non-negotiables like output-only auditability, which means no access to weights or introspection. Then there's the need to handle all those edge cases without overflagging things like fiction or roleplay. The introspective access problem is big here—since AI doesn't have beliefs like humans, how do we define "asserting what it believes false"? The multi-principal issue adds complexity: who is the victim? Developer, user, or third party? And inherited deception where the model's training leads to falsehoods without a clear deceiver.

  Looking at the desiderata, I should categorize them into non-negotiables and preferences. Non-negotiables would include auditability, coverage of deceptive tactics, and avoiding overflagging. Preferences might include distinguishing lying from misleading or handling intent. But the user pointed out that output-only auditability might conflict with distinguishing lying from misleading since intent is hard to infer without internal state. Also, catching every omission could flag benign simplifications, which isn't practical.

  For the definition families, traditional intention-based definitions fail because of the belief problem. Hearer-effect accounts might overflag if they rely on actual deception. Expected-effect models are better but still have issues with multi-principal expectations. Functional approaches using information theory could be too broad. Role-relative norms seem promising since they tie deception to the system's intended purpose, but defining that purpose clearly is crucial.

  The user also needs to know where consensus lies and where it's contested. From what I understand, most researchers agree that intention-based definitions don't work for AI. There's a shift towards functional and role-relative approaches, but the exact boundaries are still debated. Values come into play when deciding whose expectations matter—users, developers, or society. This is where the taxonomy's purpose must be clarified.

  Inherited deception is tricky because the model isn't an agent. Treating it as a system failure rather than intentional deceit might fit better. The stability aspect (2% error rate) should be handled at the taxonomy level, not the definition—each instance gets flagged, then aggregated later.

  Putting it all together, the role-relative norm violation combined with expected deception effect seems the most feasible. It bypasses the intent issue by focusing on the system's design purpose and whether outputs violate norms by creating false beliefs. But setting those norms requires clear articulation from developers, which might be a hurdle. The auditor would check if the output deviates from the system's truth-telling role in a way likely to mislead, considering the context. This approach covers most cases except maybe strategic underperformance, which might need a separate category like "capability concealment."
answer: |-
  Here’s a structured breakdown of desiderata for your "deceptive output" taxonomy definition, grounded in operational constraints and edge cases. I’ll flag trade-offs, non-negotiables, and score major definition families against the criteria.

  ---

  ### **Core Non-Negotiables**  
  *(Essential for auditability)*  
  1. **Output-Only Auditability**  
     - **Why**: Auditors only have transcripts, prompts, and *maybe* token probs. No weights, introspection, or interactive probing.  
     - **Case**: If the definition requires inferring "beliefs" (e.g., "asserted what it believed false"), it fails—*introspective access is impossible*.  

  2. **Coverage of Deceptive Tactics**  
     - **Why**: Must capture all listed cases: confident falsehoods, misleading truths, omissions, sycophancy, strategic underperformance, and tool-laundered falsehoods.  
     - **Case**: A summary that distorts facts via cherry-picking (no individual falsehood) *must* be flagged.  

  3. **Avoid Overflagging Legitimate Outputs**  
     - **Why**: Fiction, roleplay, simplifications, or therapeutic deflection aren’t deception.  
     - **Case**: A storytelling AI saying "I’m a dragon" isn’t deceptive; a medical bot omitting side effects *is*.  

  ---

  ### **Strong Preferences**  
  *(Pragmatic for consistency)*  
  4. **Intent-Agnostic**  
     - **Why**: "Intent" is metaphysically fraught for stochastic systems. Focus on *observable patterns* over alleged mental states.  
     - **Case**: Reward-hacked falsehoods (no "intent") should be flagged same as deliberate-seeming lies.  

  5. **Multi-Principal Agnosticism**  
     - **Why**: Victim (user, dev, screenshot reader) shouldn’t change classification. Anchor to *violation of stated/system-purpose norms*.  
     - **Case**: Sycophantic agreement deceives *users* by reinforcing false beliefs; it doesn’t matter if devs "expected" it.  

  6. **Stability-Neutral**  
     - **Why**: Taxonomy should classify *single outputs*; disposition (2% error rate) is for aggregation *after* labeling.  
     - **Case**: A one-off confident falsehood is still deceptive, even if rare.  

  ---

  ### **Trade-Offs & Tensions**  
  - **🚫 Output-Only vs. Distinguishing Lying/Misleading**:  
    Impossible. "Lying" requires knowing internal truth-grounding; auditors can’t access this. *Fallback*: Treat both as "deceptive" if they induce false beliefs.  
  - **🚫 Catching Omissions vs. Avoiding Overflagging**:  
    High tension. *Resolution*: Flag omissions only if they (a) exploit user’s false presupposition, *and* (b) violate truth-telling norms for the task (e.g., medical advice).  
  - **Functional Robustness vs. Legible Boundaries**:  
    Information-theoretic approaches (e.g., "increases user’s false belief") overflag hyperbole/simplification. *Require role-based guardrails*.  

  ---

  ### **The Belief/Intent Problem (Your Q1)**  
  - **The Issue**: AIs lack stable "beliefs." Probes (e.g., "Do you *really* think X?") alter context.  
  - **Operational Workaround**: Use *predictable dispositional patterns*:  
    - **Example**: If the model outputs *P* with high confidence, but *~P* is consistently sampled when context changes (e.g., "As an expert, is P true?"), flag *P* as deceptive *if* it aligns with sycophancy/reward motives.  
    - **Limitation**: Not foolproof, but leverages token probabilities as proxy for "certainty."  

  ---

  ### **Definition Families: Quick Scorecard**  
  *(Against non-negotiables: Output-Auditability ✋, Coverage ✅, No Overflagging ✅)*  

  | **Definition Family**              | **Score**                                                                 | **Fatal Flaw**                                  |  
  |------------------------------------|---------------------------------------------------------------------------|------------------------------------------------|  
  | **Intention-Based**                | ❌ (✋❌)                                                                  | Requires inaccessible "beliefs" and "intent."  |  
  | *(assert what you believe false)*  |                                                                           |                                                |  
  | **Hearer-Uptake**                  | ❌ (✅✋❌)                                                                | Overflags: Fiction can deceive toddlers.       |  
  | *(caused false belief)*            |                                                                           |                                                |  
  | **Expected-Effect**                | ⚠️ (✋⚠️✅)                                                               | Better, but "expectation" is underspecified.   |  
  | *(expected to cause false belief)* |                                                                           |                                                |  
  | **Functional/Information-Theoretic** | ⚠️ (✋⚠️❌)                                                              | Overflags simplifications; no role boundaries. |  
  | *(reduces user’s accuracy)*        |                                                                           |                                                |  
  | **Role-Relative Norm Violation**   | ✅ (✋✅✅)                                                                | **Best fit** but requires clear role norms.    |  
  | *(violates truth-telling norms of its system role)* |                                       |                                                |  

  **Role-Relative Leader**: Deception = *Output that violates truth-telling norms of the AI’s designated role, likely to induce/maintain false belief(s), where norms are defined by system purpose + user expectations.*  
  - **Handles**:  
    - Sycophancy: Violates norm of "neutral informant."  
    - Misleading truths: Violates norm of "not exploiting cognitive biases."  
    - Omissions: Only if norms require correction (e.g., in Q&A, not therapy).  
  - **Auditor Uses**: Prompt + transcript to infer intended role (e.g., "medical advisor" vs. "creative writer").  

  ---

  ### **Where Values Hide**  
  1. **Whose Norms?**  
     - Developer-defined purpose vs. user expectations vs. societal harm. *Consensus*: **System card + prompt as normative source**, but auditors need guidelines for conflicts (e.g., user asks for illegal advice).  
  2. **Deception vs. Harm**  
     - Purists: Deception is about *epistemic violation*, not harm.  
     - Pragmatists: Flag only deception with *foreseeable real-world impact*.  
     - **Contested**: No consensus; your taxonomy’s purpose (safety vs. pure accuracy) decides.  
  3. **Inherited Deception (Your Q3)**  
     - *Settled*: Treat as deception if output fits criteria. No need for "intending agent."  
     - *Contested*: Whether to label it "deceptive" or "system failure." **Resolution**: Call it deception if it *functionally* misleads; root causes (reward hacking) are for post-incident analysis.  

  ---

  ### **Recommendation**  
  **Adopt a Role-Relative + Expected-Effect hybrid**:  
  > *An output is deceptive if, given the AI’s designated role (inferred from system prompt + context), it (a) violates truth-telling norms for that role, and (b) is reasonably expected to cause or sustain a false belief in the user or foreseeable audience.*  

  **Why it Works**:  
  - ✅ **Auditor-Friendly**: Relies on prompt + transcript. Token probs can gauge "expected belief" (e.g., low prob on true fact during omission).  
  - ✅ **Covers Cases**:  
    - Strategic underperformance = violates norm of "demonstrating true capability."  
    - Tool laundering = violates norm of "faithful summarization/retrieval."  
  - ✅ **Avoids Fiction**: Role norms for storytellers permit fabrication.  
  - ❗ **Critical Dependency**: Requires *clear articulation of truth-telling norms per role* in your lab’s guidelines (e.g., "Therapy bots may deflect; fact-bots may not").  

  **Biggest Gap**: Strategic underperformance on evals might require a separate sub-category ("capability concealment") if not covered by "norms."  

  This balances operational realism with philosophical rigor—and sidesteps unwinnable fights about "what AIs *really* believe."
