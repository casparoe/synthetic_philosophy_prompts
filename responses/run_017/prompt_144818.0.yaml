prompt: |-
  Im putting together a cause-prioritization framework for a small grantmaking team — maybe ten candidate causes, a couple of staff, no realistic shot at multi-year research programs — and before I just adopt importance/tractability/neglectedness I want the spec: what does a framework like this actually have to deliver to count as adequate for that purpose? Give me the requirements with the case or failure mode behind each, not the ITN spiel Ive already read. Things Im stuck on and want you to judge, add to, or throw out:

  - partition sensitivity: the scores move depending on how finely you carve up the cause space (global health vs malaria vs bednet delivery in one province vs one delivery org), so is invariance to the carving a genuine requirement, and could anything actually meet it
  - fungibility: the counterfactual value of a marginal dollar isnt proportional to how much a cause currently gets, so both per-dollar comparisons and "neglectedness" can mislead — does that have to be modeled explicitly or can it be left as a verbal caveat
  - option value: sometimes the best cause is learn-more, or invest-and-give-later rather than spend now; should that live inside the same framework or in a separate budget
  - interaction: causes that are complements or substitutes, where the scores dont decompose and you cant rank them one at a time
  - cluelessness: flow-through effects decades out that nobody can sign off on, plus the option of causes whose main effect is on what future funders do
  - usability by people who cant produce confident numbers — is that a desideratum of the framework or just a fact about me

  Tell me which of these are real desiderata and which are one camp's taste, which are non-negotiable given my purpose, and whether some subset is jointly unsatisfiable — that's the part I care most about, since if it is, the list itself is the finding. Then: which single requirement knocks out the most candidate frameworks, and two lines max on how ITN itself does, I can fill in the rest.
reasoning: |-
  Okay, the user is building a cause-prioritization framework for a small grantmaking team. They have about ten candidate causes, a couple of staff, and no capacity for multi-year research. They're familiar with ITN but want to know what a framework must actually deliver to be adequate. They listed specific concerns: partition sensitivity, fungibility, option value, interactions, cluelessness, and usability. 

  First, I need to address each of their points and determine which are genuine requirements versus preferences. The user is stuck on whether these issues are must-haves or nice-to-haves. Their deeper need is to know if a practical framework can exist given these constraints or if some trade-offs are unavoidable.

  Partition sensitivity is a real issue but can't be fully solved. They need consistency in granularity, so the framework should require defining cause boundaries clearly. Fungibility is critical; they must consider counterfactual impact, possibly using per-dollar metrics with adjustments. Option value is essential for a small team—learning now can lead to better grants later. Interactions might be handled with a separate step for synergies. Cluelessness is unavoidable; they should focus on tractable evidence and transparent uncertainty. Usability is non-negotiable; the framework must work without complex models.

  The user's unspoken need is practicality. They can't handle overly complex systems. The biggest hurdle is usability combined with fungibility and option value. ITN struggles here because it's static and hard to quantify. The recommendation is a phased approach: initial qualitative scoring, then incremental quantification for top causes. This balances rigor with feasibility, addressing their core need for a workable solution without exhaustive research.
answer: |-
  Here's the spec for a *practical* cause-prioritization framework for your context, distilled from your concerns and grounded in operational reality. **The core function is to consistently guide *better-than-random* resource allocation decisions under constraints, not theoretical perfection.**

  ### Non-Negotiable Requirements (Failure Modes in Parentheses)
  1.  **Operational Stability:** Must produce *stable-enough* rankings despite reasonable variations in granularity & scoring uncertainty. *(Failure: Endless re-defining causes or re-scoring based on minor debates paralyzes decisions; team loses confidence.)*
  2.  **Counterfactual Honesty:** Must explicitly force consideration of *what happens if we fund/don't fund* vs. just current state. *(Failure: Funding "neglected" causes that would have been funded anyway by others, or missing high-leverage opportunities in "crowded" spaces due to fungibility.)*
  3.  **Decision-Ready Output:** Must directly feed into "Fund / Don't Fund / Investigate More" decisions *this cycle*. *(Failure: Framework outputs abstract scores requiring further complex interpretation; decisions delayed or made ad-hoc.)*
  4.  **Bounded Cognitive Load:** Must be usable by small team without advanced modeling skills or vast research time. *(Failure: Framework abandoned for gut feeling; key staff overwhelmed; process takes longer than grant review itself.)*
  5.  **Explicit Uncertainty Handling:** Must *surface* major uncertainties (cluelessness, interactions, long-term effects) as flags, not bury them. *(Failure: Overconfident decisions on shaky grounds; ignoring crucial risks/opportunities because they weren't quantified.)*

  ### Addressing Your Stuck Points - What's Required vs. Tractable

  *   **Partition Sensitivity:**
      *   **Requirement:** Operational Stability (1). Invariance is *impossible*. Adequacy means **requiring cause definitions at a *consistent level of intervention*** relevant to your grants (e.g., "Malaria prevention via bednets in Province X" not "Global Health" OR "Org Y"). Scores *will* shift with granularity; the framework must mandate *defining the unit of analysis clearly* upfront. Accept this limitation.
  *   **Fungibility:**
      *   **Requirement:** Counterfactual Honesty (2). **Must be modeled *explicitly*, but simply.** A verbal caveat is useless. Require a qualitative assessment (e.g., Low/Med/High) of: "If we don't fund this, how likely/fast is another funder to step in *at the margin*?" or "How much does current funding level *actually* constrain impact growth?". Integrate this into the "Neglectedness" concept or as a separate "Counterfactual Crowding" factor.
  *   **Option Value:**
      *   **Requirement:** Decision-Ready Output (3). **Must live *within* the same framework as a distinct "cause."** "Learn More About Cause X" or "Build Capacity for Future Grantmaking" *are* potential causes competing for *this* budget. Score them on ITN-like dimensions (e.g., Importance of knowledge gained, Tractability of research, Neglectedness of the specific question). Failing to include them biases against crucial exploratory work.
  *   **Interaction:**
      *   **Requirement:** Explicit Uncertainty Handling (5). **Cannot be fully decomposed.** Adequacy means **requiring a *separate assessment step* after initial scoring:** "Does funding Cause A significantly boost/damage the impact of Cause B/C? If so, flag for joint consideration or strategic sequencing." Don't try to build complex interdependence into core scores.
  *   **Cluelessness:**
      *   **Requirement:** Explicit Uncertainty Handling (5). **Cannot be eliminated.** Adequacy means **mandating documentation of key uncertainties and time horizons** for each cause. Use a simple flag: "High long-term/hard-to-predict effects?" or "Significant influence on future funders?". This doesn't change the score but informs risk appetite during final decisions.
  *   **Usability:**
      *   **Requirement:** Bounded Cognitive Load (4). **Non-negotiable.** The framework **MUST support qualitative scales (e.g., 1-5, Low/Med/High), confidence ratings, and narrative justification.** Requiring precise numbers guarantees failure or garbage-in-garbage-out. The framework must *enable* usable judgment, not demand impossible precision.

  ### Joint Satisfiability & The Biggest Hurdle
  **Yes, the core requirements (1-5) are jointly satisfiable for your context.** The key is accepting **bounded rationality and focusing on robust process over illusory precision.**

  *   **The requirement that knocks out the most frameworks is Bounded Cognitive Load (4).** Most academic or theoretically "optimal" frameworks require quantification, complex modeling, or extensive research far beyond your capacity. They fail immediately.
  *   **How ITN does (in 2 lines):** ITN's *concepts* are essential (addressing 2 & part of 3), but vanilla ITN fails **Operational Stability (1)** without defined granularity, **Counterfactual Honesty (2)** by ignoring fungibility, **Explicit Uncertainty (5)** by ignoring cluelessness/interactions, and often **Cognitive Load (4)** by demanding false precision. It needs significant adaptation.

  ### Recommendation: Your Adapted Framework Core
  1.  **Define Causes:** At consistent, grant-relevant intervention level (e.g., "Scale Proven Tutoring Program in District Y").
  2.  **Score Each Cause:**
      *   **Impact Potential (Importance & Tractability Blend):** How much good *could* be done *if successful*? (Scale: Low/Med/High) + Confidence (Low/Med/High).
      *   **Marginal Leverage (Neglectedness & Fungibility):** How much *additional* impact does *our* dollar buy *right now*? (Scale: Low/Med/High) + Confidence.
      *   **Option Value / Learning Potential:** Does this grant significantly enable *future* better decisions/giving? (Scale: Low/Med/High).
      *   **Key Uncertainties/Risks:** Flags for Cluelessness, Major Interactions, Counterfactual Complexity.
  3.  **Flag Interactions:** Review top candidates: "Does funding A affect B/C?"
  4.  **Prioritize & Decide:** Use scores + flags + narrative context to make "Fund / Don't Fund / Learn More" decisions. **Accept that Med/Low Confidence scores are valid inputs.**

  This delivers adequacy: better-than-random decisions, forces critical thinking on counterfactuals and uncertainty, fits your capacity, and produces actionable outputs.
