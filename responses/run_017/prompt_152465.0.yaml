  The user's pain point seems to be that Marxists keep dismantling their automation-doesn't-break-capitalism thesis. They want rigorous opposition to stress-test their ideas before publication. Underneath, they might be wrestling with whether capitalism truly contains immanent contradictions or just evolves through different rent-extraction modes.

  For the Marxist counter: I should start by acknowledging their scenario is theoretically coherent before attacking its premises. The key is that full automation is impossible under capitalism - not just practically, but logically. Capital requires living labor as value's only source. If all profit comes from ownership rather than exploitation, it becomes rent by definition, which Marx explicitly says can't sustain capitalism. 

  I'll need to deploy the organic composition of capital math from Capital Volume 3. Rising c/v ratio forcing profit rates down even with stable exploitation. The user's "few dozen engineers" point hurts though - that's a real tension in Marx's theory I should admit.

  For the "time out" reflection later: their strongest move is exposing how LTV struggles with near-total automation. I'd abandon crisis theory if we saw profit rates stable while labor share approaches zero. My weakest point is probably handwaving about capital "always finding" living labor - that does sound faith-based.
answer: |-
  Alright, let's get this over with. Your "loop" scenario is clean on paper, but it smuggles in assumptions that fundamentally misunderstand capital's metabolism. Here's the shredding:

  First, **value doesn't "collapse toward nothing" in your loop – it ceases to be *produced*.** Marx isn't saying the machine-made widget magically loses value if made without labour; he's saying *no new value is added* in its production within the automated sector (Vol III, Ch. 48-50). The value transferred from the constant capital (machines, raw materials) remains. The loop owner sells at 'prices of production' incorporating an average profit, yes. But where does that profit *come from*? Your loop is a closed system *only of circulation and realization*, not *production of new value*. The profit pocketed must be siphoned *from sectors where living labour *is* exploited*. It's not the LTV becoming vestigial; it's revealing that your fully automated sector is a parasite, living off surplus value extracted elsewhere. Your "prices don't collapse" observation doesn't refute the LTV; it exposes that prices here express a *redistribution* of value created by living labour *outside* the loop. The LTV explains *why* that redistribution is necessary for the loop owner to get profit. Ownership enables capturing a *share* of the total social surplus value; it doesn't magically create value where none is produced. Your "vestigial plumbing" crack misses the point entirely – the LTV is *necessary* to explain the *origin* of the profit the loop owner appropriates as rent.

  *(Acknowledging a hit: Your point about the "backward producers" anchor vanishing globally is sharp. That *is* the theoretical crux, not a side issue.)*

  Second, **your "scale it to the whole economy" scenario is capitalism's logical *suicide note*, not a refutation.** If *every* sector achieved your loop – absolutely zero living labour in material production – then *no new value is created anywhere*. Period. The system *implodes*. The mass of profit depends on the mass of surplus value, which depends on exploited living labour (Capital Vol I, Ch 9). Constant capital only transfers its existing value; it creates no new value (Vol I, Ch 7). If there's *no* living labour being exploited in production, the *only* "profit" possible is:
  1.  **Pure asset inflation/rent:** Charging for access to the machines/land/resources. This *is* rent, not industrial profit. It's a zero-sum game between capitalists, not profit derived from expanding value.
  2.  **Fictitious capital:** Trading claims on future... what? There *is* no future production of new value to underpin it. It's pure bubble.
  Capitalism *cannot* function as a system of self-expanding value under these conditions. The average rate of profit *you* rely on *depends* on there being a pool of surplus value created somewhere. If there's nowhere, the rate collapses to zero. Your loop owner only gets their "average profit" *because* and *while* other sectors *are* employing living labour and producing surplus value. Make it universal, and the engine stalls. Automation doesn't "empty out" the theory; it reveals the *absolute limit* capital creates for itself. The crisis isn't a "technical glitch"; it's the culmination of the rising organic composition (c/v) eroding the very source (v, variable capital exploited to yield s) of the profit rate (s/(c+v)). The arithmetic is brutal: as c approaches infinity and v approaches zero, s/(c+v) approaches zero *even if the rate of exploitation (s/v) is astronomical*. Capital *does* saw off the branch.

  **Time Out.**

  Your strongest move was forcing the global automation scenario – it directly challenges the *empirical possibility* of capitalism sustaining itself under near-total automation *without* collapsing into a rentier/asset-based system fundamentally different from industrial capitalism. If we observed sustained, stable profit rates *alongside* a near-zero share of total value attributable to labour compensation *in material production* over a long period, I'd have to seriously reconsider the immediacy/potency of the crisis tendency. My biggest vulnerability is the *temporal* aspect: capital constantly seeks new realms to commodify and exploit labour (service sectors, "immaterial labour," global labour arbitrage). My argument relies on capital *eventually* exhausting this, but proving that point *empirically* is messy. Your weakest point was dismissing profit in the loop as merely "ownership/bargaining power" without addressing *where the value it captures originates*.
