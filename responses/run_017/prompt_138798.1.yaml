prompt: |-
  Hi — I'm a novelist, not an academic, and I've somehow let myself be talked into running a forty-five minute session at a writers' festival in the spring: about thirty other novelists, no slides, me and a flipchart and a room that will have had lunch. It's being billed as Can Your Characters Agree to Disagree?, and the thing I actually have to get across in the middle of it is the common prior assumption in Bayesian epistemology — not the maths, god knows, I've no maths — but the intuition that two perfectly rational people who trust each other and who tell each other everything they know shouldn't be able to end up still disagreeing, the famous result that says they can't, and the assumption underneath doing all the work.

  Don't explain it to me, I've read around a bit. Plan how I should teach it.

  What I especially want from you is the dependency structure: what has to be in place before the assumption even means anything, and why. My sense is that people will hear prior and file it under starting belief or prejudice, and once it's filed that way the rest of the session is unrecoverable, so I need to know what to put in their heads first so that a prior lands as the thing you'd believe if the only difference between you were the evidence you'd each seen.

  The carrying example has to be fiction-shaped, because these are novelists. Mine is from my own draft: two women who've been friends since they were eleven, one of them thinks the other's brother is lying about where he was that night, each of them has private evidence, and they've told each other most of it but not all. There is no moment in time when they shared a prior — they've known each other forty years — so I need the sequence arranged so that the prior feels like a counterfactual rather than a point in time, or the whole thing collapses the second someone in the third row asks when the prior got set. Tell me what that example must contain and what it must not contain, and if it's the wrong one, say so and give me the right one.

  Misconceptions I'm betting on, and I want each defused at the right point in the sequence rather than all at the end: prior as prejudice; the assumption being that everyone begins with the same opinions; it's a claim about how people actually reason, therefore obviously false, therefore who cares; if it's true then every disagreement in fiction is irrational and there goes drama, which is the one that will make the room turn on me; rational people with the same evidence must agree; and the clever dodge, somebody will say people just have different values and that settles it, and I want that headed off wherever it does least damage rather than wherever it's most fun to argue with.

  I also want to use the no-trade thing — two people sharing a prior shouldn't both be able to expect to win a bet — because writers understand a wager in a scene in a way they won't understand a theorem. Where does that go: is it the thing that carries the session, or the payoff at the end?

  What should I openly refuse to explain at this level and say out loud that I'm refusing? And give me one question to put to them at the end that tests whether they actually picked up the assumption rather than the slogan — ideally something they can answer about whatever they're working on at the moment, since that's the only version of the idea they'll retain past the weekend.
reasoning: |-
  Alright, the user is a novelist preparing a workshop for other writers about Bayesian epistemology, specifically the common prior assumption. They need to convey the intuition behind why rational people with the same information shouldn't disagree, without the math. The key is to prevent misconceptions like priors as prejudice or the idea that it kills drama.

  First, I should start by grounding the concept in storytelling. Writers care about character conflict, so the example must feel real. Their current example involves two friends disagreeing about a brother's alibi. The challenge is that they don't have a shared prior from the start. I need to reframe the prior as a "what if" scenario—what they'd believe if they had the same evidence up to a point. That way, it's a counterfactual, not a historical moment.

  Next, dependency structure: Before introducing priors, establish rationality and trust. Emphasize that both characters are logical, share all evidence, and trust each other's honesty. Without this, the prior won't make sense. Also, clarify that the prior isn't about starting beliefs but a hypothetical agreement point.

  Common pitfalls: Addressing "priors as prejudice" early is crucial. Use the term "starting point" instead. Show that different experiences lead to different evidence, not different values. Values can come later as a complication, not a dismissal.

  The no-trade theorem as a wager makes sense. Use it after explaining the main idea to reinforce why disagreement implies irrationality or hidden info. It's a payoff, not the core.

  Openly skip the math and the actual convergence process. Focus on the intuition. For the ending question, ask them to identify a character conflict and determine if it hinges on hidden evidence or irrationality. This applies the concept to their work, ensuring retention.

  Need to check if their example works. The two friends have private evidence not fully shared. That's good. Stress they must share all evidence during the conversation. The prior is what they'd agree on if they had all evidence up to now. This avoids the "when was it set" problem.

  Misconception management: At each step, preempt issues. When defining rationality, clarify it's not about real people. After introducing priors, distinguish from prejudice. When discussing disagreement, explain that drama isn't ruined because real people aren't perfectly rational. Values can be addressed as part of the prior, not a separate factor.

  Structure the session: Start with a relatable disagreement. Define rationality and trust. Introduce the thought experiment. Explain the convergence. Use the wager to solidify. End with the application question.

  Ensure the example has complete evidence sharing during the discussion. If they hold back, the assumption fails. Highlight that in fiction, hidden info or irrationality creates conflict, which is fine. The Bayesian point just clarifies sources of conflict.
answer: |-
  Here’s a battle-tested plan for your session, structured to dodge misconceptions and anchor the intuition in fiction. I’ll map the dependencies clearly, reshape your example, and weaponize the no-trade theorem. Total time: 45 mins.

  ---

  ### **The Core Sequence (Dependency Chain)**
  **1. START WITH A DISAGREEMENT EVERY WRITER GETS (5 mins)**  
     - **Do:** Present a *simple*, relatable fictional disagreement. *Use your example, but tweak it:*  
       *"Two lifelong friends (Clara and Maya) clash over whether Clara’s brother lied about his alibi. Clara thinks he’s lying (she saw mud on his shoes that night; he claimed he was home). Maya believes him (he once took the blame for her mistake as a teen). They trust each other deeply and share these reasons."*  
     - **Dependency 0:** Establish **trust + total evidence-sharing** as non-negotiable. Hammer: *"They’ve told each other EVERYTHING they know—no secrets, no holding back."*  
     - **Why now?** Without this, the whole Bayesian framework collapses. Writers instinctively grasp "hidden motives" as drama fuel—explicitly rule it out upfront.

  **2. DEFINE "RATIONAL" IN A WAY THAT SERVES STORY (7 mins)**  
     - **Do:** Flipchart: **Rational = "Updating beliefs when new evidence arrives."**  
       Use a micro-example: *"If Clara learns the brother’s shoes were muddy because he rescued a cat, she should adjust her belief."*  
     - **Kill misconception 1 (It’s about how people actually think):**  
       *"This isn’t psychology—it’s a thought experiment. Real people aren’t like this. We’re asking: IF two people were logic engines that trust and share everything, could they still disagree? If no, why not? If yes, how?"*  
     - **Dependency 1:** Rationality must be defined **before** introducing priors. Otherwise, "prior" gets conflated with stubbornness.

  **3. THE COUNTERFACTUAL PRIOR (10 mins)**  
     - **Do:** Introduce the prior as a **"What if?" moment**—not a point in time.  
       *"Imagine Clara and Maya could rewind to a hypothetical starting point BEFORE either had their private evidence. At that moment, if they shared ALL their knowledge up to then, would they agree on the brother’s likelihood to lie? THAT agreement is their ‘common prior.’ It’s not a memory—it’s a logical anchor."*  
     - **Fix your example:**  
       - **Must contain:** A clear "reset point" (e.g., *the moment before Clara saw the muddy shoes and before Maya recalled the teenage incident*).  
       - **Must NOT contain:** Any hint that they ever *actually* held this belief. Stress: *"They’ve known each other 40 years—this point never existed. It’s a tool."*  
     - **Kill misconception 2 (Prior = prejudice):**  
       *"This isn’t about bias—it’s what they’d conclude if their ONLY difference was which evidence they saw next. Clara saw mud; Maya saw loyalty. The prior is the agreement they’d have had before that split."*  
     - **Dependency 2:** Trust/rationality must be locked in first. Otherwise, the prior feels arbitrary.

  **4. THE PAYOFF: WHY DISAGREEMENT IMPLIES IRRATIONAILITY (8 mins)**  
     - **Do:** Flipchart their evidence. Show Clara and Maya updating beliefs as they share.  
       *"Clara’s prior belief + Maya’s evidence → Clara’s new belief. Maya’s prior belief + Clara’s evidence → Maya’s new belief. If they trust each other and are rational, these outputs MUST converge."*  
     - **Kill misconception 3 (Drama dies):**  
       *"Real conflict comes because people DON’T do this! They hide evidence, distrust, or freeze beliefs. This explains WHY disagreements persist—it’s never just ‘different perspectives.’ It’s incomplete sharing or irrationality. That’s GOLD for character depth."*  

  **5. NO-TRADE THEOREM AS THE KILLER APP (7 mins)**  
     - **Do:** Position this as the **proof** that hooks writers.  
       *"Clara and Maya now disagree. Clara says: ‘Bet you £50 he’s lying.’ Maya takes it. But if they truly share a prior and trust each other’s evidence, both can’t rationally expect to win. If Clara thinks she’ll win, Maya should update and agree! The bet itself exposes hidden distrust or irrationality."*  
     - **Why here?** It’s the payoff. After steps 1-4, the room *feels* why disagreement is unstable. The wager crystallizes it.  
     - **Kill misconception 4 (Different values settle it):**  
       *"Values are PART of the prior! If Maya values loyalty more, that’s baked into the hypothetical starting point. After sharing evidence, they’d still converge on what the facts imply."*  

  **6. WHAT WE IGNORE (1 min)**  
     - **Openly skip:**  
       - The math (obviously).  
       - *How fast* convergence happens.  
       - Whether common priors exist in reality (stress: *"This is a logic tool, not a claim about the world"*).  

  ---

  ### **Final Question to Test Understanding**
  **"Look at a conflict in your current work. If both characters shared ALL their evidence and fully trusted each other, would they HAVE to agree? If not, what’s secretly in play: hidden information, mistrust, or irrationality?"**  
  - **Why it works:** Forces them to apply the assumption ("shared prior + total sharing → agreement") to their own stakes. If they identify "hidden evidence," they got it. If they say "different values," probe: *"Would that difference vanish if they shared how they formed those values?"*  

  ---

  ### **Why This Works for Novelists**
  - **Priors as counterfactuals:** Your rewound "hypothetical starting point" sidesteps "when did they agree?" objections.  
  - **Drama intact:** By step 4, they see irrationality/mistrust as the engine of conflict—not an obstacle.  
  - **No-trade as the climax:** Writers instinctively smell a "bet" as a tension device. Use that.  
  - **Their example works** if you:  
    - Explicitly define the "reset point" (pre-mud/pre-memory).  
    - Stress they share **everything** during the current dispute (no slow-reveal tricks).  

  **Time Check:** 5+7+10+8+7+1 = 38 mins. Leaves 7 mins for Q&A—enough to field the "values" objection if it arises ("Values are evidence! Share how you formed them!").  

  This sequence makes the assumption inescapable by the time you hit the no-trade bet. They’ll leave seeing conflict as a symptom of hidden forces—which is exactly what you want. Break a leg.
