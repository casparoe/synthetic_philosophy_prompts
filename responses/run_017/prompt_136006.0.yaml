prompt: |-
  hey — I need something I can actually hand to a committee, and I've failed to write it four times now.

  Setup: I'm a philosophy PhD student, and last year I got put on the data-governance committee for the two-hospital academic health system my department is affiliated with. We decide what goes in the demographics block of the electronic health record, and who's allowed to use those fields downstream. We meet every other week, 25–30 proposals a year, about 25 minutes each. The committee is a hospitalist, a nurse manager, a data architect, a compliance officer who has to sign off on everything or it doesn't ship, a rotating patient advocate, and me. Nobody else on it has read anything about social construction and nobody else ever will. The hospitalist hears "social construction" as "it's made up, so it doesn't matter"; the data architect hears it as "let people self-describe and then never aggregate." I get one page, ten questions maximum, and I cant use any jargon. Whatever we decide sits in the record for a decade and gets used for disparities research, quality reporting, registry submissions, and clinical decision support.

  What keeps happening: every proposal is really "add, delete, or redefine a category of person." I can see why the same move is fine in one case and a disaster in another, but when I try to say it I either give a five-minute lecture on Hacking's looping effects or I cave and vote on vibes. So: write me a procedure.

  What it has to be:
  - Ordered questions with hard stops, not a menu of considerations. I need to be able to say "question 3 fails, we're done, next proposal."
  - For each question: what counts as a sufficient answer, and who has to supply it (the proposal author? informatics? compliance?).
  - Explicit marks at the points where the answer is a values decision and has to go to a named human rather than to the procedure.
  - Runnable by someone with no theory, in ~20 minutes, from documents the committee already has.
  - It has to cope with: the same label meaning different things at the two hospitals we merged; a field collected at intake for one purpose getting reused eight years later for another; a category used to track something causal (exposure to a social environment) versus used as a proxy for an intrinsic property; and people who give different answers at different times or get classified differently by different staff.

  I also want you to commit, not survey, on three design choices:

  1. Which distinctions have to survive the translation and which can be dropped. My instinct is that the interactive-vs-indifferent-kind / looping stuff and the conferral stuff (who has to do what, in what setting, for the property to be there) are load-bearing, and that the whole realism/antirealism fight about whether race is "real" is dead weight we should just drop and never mention again. Tell me if I've got that backwards.

  2. Whether to require, for every category, an "export license": a written statement of the downstream uses it's licensed for, where any new use has to come back through us. I made this up, it's the part I'm least sure about, and the data architect already hates it.

  3. Whether there should be a rule that any field used to make a clinical decision about a patient has to be recorded as an act — what was actually asked, of whom, by whom, when — rather than as a trait of the patient. And what the procedure should do when the honest answer to "what was actually asked" is "nothing, the clerk guessed" or "nothing, a model imputed it." Related: I've been calling the next question the re-description question — if someone reads this field in eight years under a different description than the one it was collected under, what breaks? Keep it if it earns its place on the page, cut it if its just decoration.

  Then run it on three proposals actually in front of us:

  (a) Add a "Middle Eastern or North African" option to the race/ethnicity question, because a patient-advocacy group says the current boxes force people into "white" and their community disappears from our disparities data.

  (b) Have the lab auto-populate the race field from a genetic-ancestry panel that's already being run on a subset of patients, on the grounds that it's more objective and intake staff are bad at asking. I think this is obviously bad and I cannot say why in a form the hospitalist will accept.

  (c) Delete the "sex assigned at birth" field and keep only gender identity, because a committee member argued last meeting that the first one is "just a social category with no clean biology under it, so its noise in a medical record."

  On (c): my sympathies are with the deletion and my own work is why — I spend my days arguing these categories are constructed. If the procedure, run honestly, says keep the field, I want you to say that plainly and tell me why construction isn't the reason to delete it. I'd rather be overruled by the checklist than by my politics.

  One more, which you should feel free to treat as the real test: we've been told to harmonize the two hospitals' category sets into one master list. If the procedure implies we shouldn't — that we should keep both and map between them at analysis time — say so, because the CIO is going to be furious and I want to know before I walk into the room.

  Give me your version, argue for it, say where it has to hand off to a person and where it'll just misfire, and don't hedge between options. No reading lists and no citations — I can look those up myself, I need the page.
reasoning: |-
  We are designing a decision procedure for the data governance committee. The procedure must be:
  - A list of ordered questions with hard stops (if one fails, the proposal is rejected or requires revision)
  - Each question specifies what counts as a sufficient answer and who is responsible for providing it.
  - It must mark points where a values decision must be made by a named human (e.g., the committee, the patient advocate, etc.)
  - Runnable in ~20 minutes by someone without theory, using existing documents.
  - Must handle: same label meaning different things at different hospitals, reuse of fields for different purposes over time, categories used for causal vs. proxy purposes, and variability in how people are classified.

  We are also making three design choices:

  1. Distinctions to keep: 
     - Interactive kinds (categories that change the people classified under them) vs. indifferent kinds (categories that don't) — this is Hacking's looping effect. This is load-bearing because it affects how the category will be used and how it might change over time.
     - Conferral: who has to do what for the property to be assigned? (This matters for data collection procedures and validity.)
     - Drop the realism/antirealism debate. We don't need to decide if the category is "real", only how it functions in the system.

  2. Export license: 
     We will require an "export license" for each category. This is a list of the downstream uses the category is approved for. Any new use must come back to the committee. This is important because it prevents unintended and potentially harmful reuse of the data. The data architect might hate it, but it's necessary for governance.

  3. Record as act vs. trait: 
     We will require that any field used for clinical decision support must be recorded as an act (what was asked, by whom, when, and the answer given) rather than as a trait. This is because the context of collection affects the interpretation. However, if the data is imputed or guessed, that must be recorded as such. The procedure must handle this.

  Also, the "re-description question": if the field is used under a different description in the future, what breaks? We'll include this as a specific question because it tests the robustness of the category definition.

  Now, the procedure:

  **Data Category Proposal Evaluation Procedure**

  *Purpose: To evaluate proposals to add, delete, or redefine a demographic category in the EHR, ensuring the category is fit for purpose and that potential harms are mitigated.*

  **Step 0: Pre-submission (to be done by proposal author)**
  - The proposal must include:
    a. The exact field name and where it will appear in the EHR.
    b. The set of allowed values (if categorical) or data type (if free text or numeric).
    c. The data collection procedure: who will collect it, when, how, and from whom (e.g., patient self-report, staff observation, lab test, etc.). If the procedure varies by site or context, describe.
    d. The primary purpose(s) for collecting the data (e.g., disparities research, clinical decision support, billing, etc.).
    e. The "export license": a list of specific downstream uses (e.g., "for research on health disparities in diabetes", "for calculating quality metrics for CMS", "for clinical decision support in pharmacogenomics"). Any use not on this list requires a new proposal.
    f. For existing fields being changed or deleted: impact analysis on current uses and any historical data.

  *Who: Proposal author. If not provided, the proposal is rejected until completed.*

  **Step 1: Clarity of Definition**
  - Question 1: Is the category defined unambiguously? (Check: if two people read the definition, would they assign the same value to the same person in the same context?)
  - Sufficient answer: A clear, written definition that does not rely on undefined jargon. Examples are allowed but not required.
  - Who: Proposal author. If insufficient, reject or return for revision.

  **Step 2: Collection Procedure**
  - Question 2: Is the collection procedure specified, and is it feasible and consistent with the definition? (Check: if the definition requires self-report, but the procedure is staff observation, that's a mismatch.)
  - Sufficient answer: A description of the procedure that matches the definition. If the procedure involves imputation or guessing, it must be explicitly stated and justified.
  - Who: Proposal author. If insufficient, reject or return for revision.

  **Step 3: Purpose and Export License**
  - Question 3: Are the primary purpose and the export license clearly stated, and are they aligned? (Check: the purpose must be one of the export license items, and the category must be suitable for that purpose.)
  - Sufficient answer: A list of specific, approved uses and a rationale for why the category is appropriate for each.
  - Who: Proposal author. If insufficient, reject or return for revision.

  **Step 4: Variability and Stability**
  - Question 4: If the category can vary over time or by context (e.g., a patient might change their answer, or different staff might classify differently), is there a procedure to record each instance (as an act) and to handle the variability in downstream uses?
    - For fields used in clinical decision support, recording as an act is mandatory (what was asked, by whom, when, and the answer). If the data is imputed, that must be recorded and the method described.
    - Also: if the category is intended to track something causal (like exposure to an environment) vs. an intrinsic property, the proposal must state which and justify.
  - Sufficient answer: A description of how the data will be stored (e.g., as a series of acts or as a single trait) and how variability will be managed in analysis. For clinical decision support, the act-based recording must be implemented.
  - Who: Proposal author and informatics (to confirm technical feasibility). If the answer is insufficient or not feasible, reject or revise.

  **Step 5: Re-description Risk**
  - Question 5: If this field were to be used under a different description in the future (e.g., collected for one purpose but used for another), what would break? (Example: a field collected for social services referral being used for genetic risk prediction.) The proposal must identify potential misalignments and how they are mitigated by the export license and data model.
  - Sufficient answer: At least one potential misalignment scenario and an explanation of why the export license and current data model prevent harm (or why it's safe). If the risk is high and unmitigated, the proposal might need revision.
  - Who: Proposal author. If the risk is unaddressed, return for revision.

  **Step 6: Impact on Historical Data and Merged Systems (for changes to existing fields)**
  - Question 6 (for modifications or deletions): How will the change affect historical data and reporting? For merged systems, how will mapping between legacy systems be handled?
  - Sufficient answer: A plan for historical data (e.g., freezing old data, mapping to new values) and for legacy systems (e.g., maintaining two sets of categories with a mapping table, or converting old data). The plan must not break existing uses without explicit mitigation.
  - Who: Proposal author and data architect. If no plan or an inadequate plan, reject or revise.

  **Step 7: Values Checkpoint (Human Decision)**
  - Question 7: Are there potential harms (e.g., discrimination, stigmatization, erasure) that are not mitigated by the above? This is a values decision.
  - Process: The patient advocate and the committee must discuss and vote. The proposal must include a section on potential harms and mitigations.
  - Sufficient answer: The committee and patient advocate agree that the harms are acceptable or mitigated. If they don't, the proposal is rejected or revised.

  **Step 8: Compliance and Feasibility**
  - Question 8: Is the proposal compliant with regulations (e.g., HIPAA, anti-discrimination laws) and technically feasible?
  - Who: Compliance officer (for regulations) and data architect (for feasibility). Must sign off. If not, reject or revise.

  **Step 9: Final Approval**
  - If all steps are passed, the proposal is approved.

  Now, we run the three proposals:

  **Proposal (a): Add "Middle Eastern or North African" (MENA) to race/ethnicity.**

  - Step 0: Assume the proposal includes the required elements.
  - Step 1: Definition should be clear (e.g., "A person having origins in any of the original peoples of the Middle East or North Africa"). Pass.
  - Step 2: Collection: self-reported at intake. Feasible. Pass.
  - Step 3: Purpose: disparities research for MENA community. Export license: for disparities research and quality reporting. Aligned. Pass.
  - Step 4: Variability: self-report may change? But race/ethnicity is currently stored as a trait. We must change to act? Not required unless used for clinical decision support. Currently, race/ethnicity is not used for clinical decisions (usually). So it can remain a trait. But note: if it is used in CDS, we must change. The committee must verify current uses. Let's assume it's not. Pass with note to monitor.
  - Step 5: Re-description risk: if used for genetic inferences, that would be a misalignment because MENA is not a genetic category. The export license does not include genetics, so it's mitigated. Pass.
  - Step 6: Not applicable (new category).
  - Step 7: Values: the harm of erasure is mitigated by adding the category. Patient advocate likely supports. Committee must discuss and approve.
  - Step 8: Compliance: adding a category is generally fine. Feasible. Pass.
  - Outcome: Pass.

  **Proposal (b): Auto-populate race from genetic-ancestry panel.**

  - Step 0: Assume provided.
  - Step 1: Definition: genetic ancestry is defined by the lab test. Clear. Pass.
  - Step 2: Collection: auto-populated from lab test. But the current definition of race is social, not genetic. Mismatch! The proposal is redefining race without stating it. Fail at Step 2. We stop.

  Even if we continued:
  - Step 3: Purpose: to have "objective" race for disparities research and clinical use. But genetic ancestry is not the same as social race. Export license might include both, but they are not interchangeable. Misalignment.
  - Step 4: If used for clinical decisions, we must record as an act. But if auto-populated, it's an imputation. We must record that it's imputed. However, the harm is that it conflates social and biological constructs.
  - Step 5: Re-description risk: high. If this is used for social disparities, it's wrong because genetic ancestry doesn't capture social experience. If used for genetics, it might be okay, but then why call it "race"?
  - Step 7: Values: potential harm of biologizing race and misrepresenting disparities. Patient advocate might oppose.
  - So it would fail at multiple steps.

  **Proposal (c): Delete "sex assigned at birth" and keep only gender identity.**

  - Step 0: Assume provided.
  - Step 1: The proposal must define what is being kept (gender identity) and what is being deleted. Pass.
  - Step 2: Collection: gender identity is self-reported. But what about the need for sex assigned at birth? The proposal argues it's not needed. However, we must check current uses.
  - Step 3: Purpose: The proposal says sex assigned at birth is not used. But is that true? We must verify with the export license of the existing field.
  - Step 4: If the field is used for clinical decision support (e.g., in some clinical guidelines, sex assigned at birth might be relevant for certain screenings), then deleting it might remove necessary information. The proposal must show that it is not used for such purposes. But if it is used, then we must record it as an act. However, if we delete it, we lose that.
  - Step 5: Re-description risk: if gender identity is used in place of sex assigned at birth (e.g., for a clinical guideline that requires sex assigned at birth), that might be harmful. The export license must not allow such substitution.
  - Step 6: Impact: deleting a field used in historical data might break reporting. How will historical data be handled?
  - Step 7: Values: the proposal argues that keeping sex assigned at birth is stigmatizing. But the committee must weigh that against potential clinical harms. Patient advocate might have strong views.

  But the critical point: the construction of the category (that it is socially constructed) does not by itself justify deletion. The question is whether it is still needed for current purposes. Therefore, the procedure would require:

  - The proposal must show that there are no current uses (in the export license) that require sex assigned at birth. If it is still used, then deletion would break existing processes.

  Thus, the procedure might not support deletion if the field is still in use. The committee must first remove the uses from the export license (via separate proposals) or show that the uses are invalid.

  If the procedure is run honestly and the field is still used, then we must keep it. Construction is not the reason to delete it; lack of current use is.

  **Harmonization of the two hospitals' categories:**

  The procedure implies that we should not necessarily force one master list. Step 6 (for any change) requires a plan for historical data and legacy systems. For harmonization:

  - We would treat this as a proposal to change both systems to a new master list.
  - Step 6: We must map the old categories to the new ones. If the two hospitals have the same label but different meanings, we cannot simply merge. We must create a mapping that preserves the original data and context.
  - Therefore, the procedure would require keeping the legacy categories in the data model and mapping at analysis time. This is because the same label with different meanings is a re-description risk (Step 5) and the collection procedure (Step 2) is tied to the site.

  Thus, the procedure would reject a simple harmonization that loses the site-specific context. We must keep both and map. The CIO might be furious, but the procedure protects against data corruption.

  **Design choices argued:**

  1. We kept interactive vs. indifferent and conferral because:
     - Interactive kinds: In Step 4 and 5, we handle variability and re-description, which are risks for interactive kinds (like race or gender) that can change or be influenced by the category itself. For indifferent kinds (like blood type), this is less of an issue.
     - Conferral: Step 2 requires specifying who assigns the category and how, which is conferral. This is critical for validity.

  2. Export license: We require it to prevent misuse. The data architect hates it because it adds overhead, but without it, we cannot control re-description.

  3. Record as act: For clinical decisions, we require it to maintain context. This addresses the problem of "the clerk guessed" by forcing that to be recorded. If imputed, we record the method. This is essential for trust.

  The procedure will misfire if:
  - The committee does not have the expertise to answer a question (e.g., if the data architect says something is feasible when it's not). We rely on the named roles.
  - The values decision (Step 7) is too subjective. We mitigate by requiring the patient advocate and full committee.

  This procedure is a starting point and may need refinement in practice. But it provides the hard stops and structure needed.

  Final output: a one-page checklist version of the above.
answer: |-
  Below is a decision procedure designed for your committee, formatted as a one-page checklist. It prioritizes actionability, hard stops, and clarity over theory. I'll first present the procedure, then commit to your three design choices, then run the three test proposals (and harmonization) without hedging. The procedure assumes proposals are pre-submitted with standard documentation (field definition, collection method, purpose, and impact analysis—per your existing workflow). Total runtime per proposal: 15–20 minutes.

  ---

  ### **Demographic Field Proposal Decision Procedure**  
  *One-page checklist for committee use. Hard stops at any "FAIL."*

  #### **Question 1: Is the category defined clearly and consistently?**  
  - **What counts**: Written definition that avoids ambiguity (e.g., "Middle Eastern or North African" must specify geographic/cultural origins; "sex assigned at birth" must specify it is typically based on physical traits observed at birth). No overlap with other categories.  
  - **Who answers**: Proposal author.  
  - **Hard stop**: FAIL if definition is vague, circular, or conflicts with existing fields.  
  - **Values decision?** No. Pure clarity check.  

  #### **Question 2: Is the collection method transparent and auditable?**  
  - **What counts**: Description of who collects it (e.g., patient, clerk, lab), how (e.g., self-report, observation, algorithm), and when (e.g., at intake, during lab test). Must specify if staff guess/impute data.  
  - **Who answers**: Proposal author + informatics (to verify technical feasibility).  
  - **Hard stop**: FAIL if method is undocumented or contradicts definition (e.g., defining race as identity but collecting via genetic test).  
  - **Values decision?** No. Focuses on traceability.  

  #### **Question 3: Does the field’s purpose justify its risks?**  
  - **What counts**: Primary use case stated (e.g., "track disparities for group X"). Must include an **export license**—a binding list of approved downstream uses (e.g., "disparities research only"). New uses require committee re-approval.  
  - **Who answers**: Proposal author.  
  - **Hard stop**: FAIL if purpose is missing, or export license is absent/overly broad (e.g., "any research").  
  - **Values decision?** Yes—escalate to full committee + patient advocate if purpose could cause harm (e.g., stigmatization).  

  #### **Question 4: Can the field handle real-world variability?**  
  - **What counts**: Proof it accommodates:  
    - Changes over time (e.g., a patient updates their gender).  
    - Context dependence (e.g., different answers at different hospitals).  
    - Proxy vs. causal use (e.g., "ZIP code as proxy for poverty exposure" must not be used as "intrinsic risk factor").  
  - **Who answers**: Proposal author + data architect (for technical handling).  
  - **Hard stop**: FAIL if variability isn’t addressed (e.g., storing fluid identities as fixed traits).  
  - **Values decision?** No. Practicality check.  

  #### **Question 5: If used for clinical decisions, is it recorded as an act?**  
  - **What counts**: For any clinical decision support use:  
    - Field must be stored as an **act** (what was asked, who answered, when, and the exact response).  
    - If imputed/guessed, method must be logged (e.g., "clerk visual guess," "AI model Y").  
  - **Who answers**: Informatics + compliance.  
  - **Hard stop**: FAIL if clinical use exists but act-based recording isn’t feasible.  
  - **Values decision?** No. Safety/audit requirement.  

  #### **Question 6: Does re-description break anything?**  
  - **What counts**: Test case: "If this field is reused in 5+ years for a new purpose not in its export license, what harm occurs?" (e.g., race data collected for disparities research reused for genetic risk prediction). Must identify one concrete risk and mitigation (e.g., export license blocks reuse).  
  - **Who answers**: Proposal author.  
  - **Hard stop**: FAIL if risk is unmitigated (e.g., no export license controls).  
  - **Values decision?** Yes—committee + compliance if risk is high (e.g., discrimination potential).  

  #### **Question 7: For changes, is historical/legacy data preserved?**  
  - **What counts**: Plan to handle:  
    - Legacy differences (e.g., "race" meaning different things at Hospital A vs. B).  
    - Historical reuse (e.g., old data used for new studies).  
    - Must include mapping strategy (e.g., "store both legacy categories, map at analysis").  
  - **Who answers**: Data architect + proposal author.  
  - **Hard stop**: FAIL if plan forces harmonization that erases context (e.g., merging two "race" fields without mapping).  
  - **Values decision?** No. Data integrity check.  

  #### **Question 8: Is it compliant and feasible?**  
  - **What counts**: Compliance sign-off (legal/regulatory) + informatics sign-off (technical).  
  - **Who answers**: Compliance officer + informatics.  
  - **Hard stop**: FAIL if either vetoes.  
  - **Values decision?** No.  

  --- 

  ### **Commitment to Your Design Choices**  
  1. **Distinctions to keep/drop**:  
     - **Keep**: Interactive kinds (categories that change behavior, e.g., race influencing care access) and conferral (who assigns the category and how). These are embedded in Questions 2 (collection), 4 (variability), and 5 (act recording).  
     - **Drop**: Realism/antirealism debate. Not relevant—the procedure focuses on *how the category functions* (e.g., "Does it work for its purpose?"), not "Is it real?" This aligns with your instinct.  

  2. **Export license (required)**:  
     - **Why**: Prevents "scope creep" (e.g., a field for social work referrals being reused for clinical algorithms). Mandatory in Question 3. The data architect hates it because it adds oversight, but it’s non-negotiable—without it, re-description (Question 6) becomes unmanageable.  

  3. **Record as an act for clinical use (required)**:  
     - **Why**: Ensures accountability when fields influence care (e.g., a guessed race triggering a flawed algorithm). Handles "clerk guessed" by requiring the method be logged (Question 5). The re-description question (Question 6) stays—it’s not decoration. It forces authors to confront misuse, which is load-bearing for long-term safety.  

  --- 

  ### **Test Proposals Run Through the Procedure**  
  **Proposal (a): Add "Middle Eastern or North African" (MENA) to race/ethnicity**  
  - Question 1: **PASS**. Definition clear (e.g., "origins in MENA regions").  
  - Question 2: **PASS**. Self-reported at intake, no guesswork.  
  - Question 3: **PASS**. Purpose: disparities research. Export license: "disparities reporting only."  
  - Question 4: **PASS**. Handles variability (self-report may change, but stored as trait—OK since not used clinically).  
  - Question 5: **N/A** (not used for clinical decisions).  
  - Question 6: **PASS**. Re-description risk: if reused for genetics, export license blocks it.  
  - Question 7: **N/A** (new field).  
  - Question 8: **PASS**. Compliance/informatics approve.  
  - **Outcome: APPROVED**.  

  **Proposal (b): Auto-populate race from genetic-ancestry panel**  
  - Question 1: **FAIL**. Definition mismatch: race (social identity) vs. genetic ancestry (biological). Collection method (genetic test) contradicts definition.  
  - **Hard stop—REJECT**.  
  - *Why the hospitalist accepts this*: "Race isn’t in your genes—it’s how you’re seen in society. A genetic test can’t capture that. Using it here would mislead disparities research." (No theory needed.)  

  **Proposal (c): Delete "sex assigned at birth," keep only gender identity**  
  - Question 1: **PASS**. Definitions clear (gender identity = self-identified; sex assigned = typically anatomy at birth).  
  - Question 2: **PASS**. Gender collected via self-report.  
  - Question 3: **FAIL**. Export license for sex assigned at birth (e.g., used for cancer screening guidelines) isn’t addressed. Deleting it breaks existing uses.  
  - **Hard stop—REJECT**.  
  - *Why construction isn’t the reason to delete*: Even if socially constructed, the field has clinical uses (e.g., certain screenings reference anatomy). Construction doesn’t erase utility—deletion requires proving no current use. Your politics are overruled by the export license (Question 3).  

  **Harmonization of Two Hospitals’ Categories**  
  - **Procedure output**: Do **not** force one master list. Question 7 requires mapping legacy data (e.g., "race at Hospital A vs. B stored separately, mapped at analysis"). Harmonizing without this fails Question 7.  
  - **Why the CIO will be furious but you’re right**: Merging distinct categories corrupts data (e.g., "Asian" meant different things at each hospital). Mapping preserves context for disparities research. The procedure forces this—blame the checklist!  

  --- 

  ### **Where the Procedure Hands Off or Misfires**  
  - **Handoff to humans**:  
    - Values decisions at Questions 3 (purpose/harm) and 6 (re-description risk) go to full committee + patient advocate.  
    - Question 8 (compliance) goes to named roles.  
  - **Misfires**:  
    - If a proposal is poorly documented, it fails early (Question 1/2).  
    - If staff ignore the export license (Question 3) or act-recording (Question 5) in practice, compliance must enforce.  
    - Confusing conferral (who assigns the category) with realism might still trip up the hospitalist—but the procedure avoids jargon by focusing on "who collects it and how" (Question 2).  

  **Final version**: This is your one-page handout. It’s theory-agnostic, prioritizes safety/auditability, and cuts off debates with hard stops. Run it as-is for 6 months, then revise based on misfires. No reading lists—just the page.
