prompt: |-
  I sit on the grants committee of a small foundation that makes "big bet" awards, and our charter annoyingly says we fund whichever proposal has the highest expected benefit per dollar. This cycle the front-runner is a proposal to endow a permanent rapid-response research network with no fixed end date, and our analyst's model of it has come apart. She says the upsides and downsides are both unbounded, that the expected net benefit only looks like a finite number because the enormous gains and the enormous losses cancel, and that the total moves depending on what order she adds the rows in — roughly +$40M chronological, roughly −$9M worst-first, no number changed, and it isn't a rounding error. Her view is that there just isn't an expected value here. Meanwhile the boring rival, a five-year job-training programme with decent evidence, beats the network if we cap the model at $100M and loses to it if we cap at $1B. Three of us want to fix a cap and rank by truncated mean, two want to rank by median instead, one says this is a modelling artifact and we should send the analyst back. We vote in ten days.

  Draft the memo I'll circulate. Recommend one course of action on this proposal and one rule for future cycles, and give the losing side's best argument its due — don't just tell us to adopt a utility function or a discount rate, we've had that argument and it settled nothing. Lead with the recommendation in the first sentence, then the reasoning, no preamble and no restating any of this back to me, and keep it under about 600 words.
reasoning: |-
  Okay, the user is on a grants committee for a foundation that makes "big bet" awards. Their charter requires funding proposals with the highest expected benefit per dollar. The current front-runner is a permanent rapid-response research network with no fixed end date, but the analyst's model is problematic because the expected net benefit isn't converging - it changes dramatically based on calculation order (+$40M chronological vs. -$9M worst-first). The analyst believes there's no defined expected value.

  Meanwhile, there's a solid but boring five-year job-training program that outperforms the network if they cap benefits at $100M but loses if capped at $1B. The committee is divided: three want truncated mean, two prefer median, and one thinks it's a modeling artifact.

  They need a memo draft that:
  1. Leads with clear recommendations (one for this proposal, one future rule)
  2. Acknowledges the losing side's best argument fairly
  3. Avoids rehashing settled debates like utility functions/discount rates
  4. Stays under 600 words

  The user is likely a senior committee member facing time pressure (vote in 10 days). Their unspoken needs include: preserving committee unity, maintaining charter compliance while resolving ambiguity, and establishing defensible decision criteria for unconventional proposals. The emotional tone suggests frustration with the charter's rigidity and analyst deadlock.

  For recommendations:
  - Current proposal: Reject the research network since it violates the charter's requirement for calculable expected value. The job-training program wins by default as the only compliant option.
  - Future rule: Require all proposals to have convergent expected values (absolute convergence) as a precondition for evaluation. This mathematically captures the current problem.

  The losing side (median advocates) best argues that truncation arbitrarily discards tail risks while median resists outliers. But this fails because median ignores scale of benefits and violates the charter's "expected benefit" mandate.

  Key nuances: Must show why non-convergence disqualifies the proposal under existing rules without overstepping. The future rule preempts repeat scenarios while respecting the charter's intent. Acknowledge the median alternative but demonstrate its inadequacy.
answer: |-
  **Recommendation: Reject the permanent research network proposal this cycle, and adopt a future rule requiring absolute convergence of modeled expected value as a precondition for evaluation under the charter.**

  The research network proposal violates the core requirement of our charter – calculable expected benefit per dollar. The analyst demonstrates the expected net benefit is mathematically undefined; it fails to converge to a single value regardless of calculation order, indicating our model lacks the necessary stability for charter compliance. Using an undefined value to rank proposals is invalid. Therefore, the only charter-compliant proposal is the job-training program. Award to it.

  For future cycles, mandate that any proposal's modeled expected net benefit must demonstrate *absolute convergence*. This means the sum of the absolute values of the individual scenario benefits must be finite. If it isn't, the expected value sum is not well-defined mathematically (it depends on summation order), disqualifying the proposal. This rule directly addresses the core mathematical flaw exposed here, ensuring proposals meet the charter's fundamental requirement *before* ranking. It doesn't impose new utility functions or discount rates; it enforces the existing charter’s calculability prerequisite. Analysts must test for and report convergence status.

  **Losing Side's Best Argument (Median/Truncation):**
  Proponents of ranking by median benefit or truncated mean argue these methods provide stable, order-independent values resistant to extreme tail risks, which they believe better reflects real-world decision-making under deep uncertainty than the problematic, unbounded mean. They contend that insisting on a pure, convergent expected value is overly restrictive, forcing us to reject potentially transformative but inherently uncertain "big bets" like the research network. Capping or using the median offers a pragmatic, consistent workaround that still captures central tendency, allowing evaluation of high-variance proposals our charter might otherwise exclude arbitrarily. They see rejecting the network solely due to non-convergence as letting a technical modeling artifact override substantive potential.

  **Why This Argument Doesn't Prevail:**
  While median/truncation offers stability, it fundamentally alters the charter’s mandate. The charter explicitly requires maximizing *expected* benefit per dollar. Median benefit is a different statistic entirely – it ignores the magnitude of outcomes above/below the midpoint, violating the "expected benefit" principle. Truncation capriciously discards information beyond an arbitrary threshold, also distorting the true expectation. Adopting either would be a substantive policy change, not a faithful execution of the existing charter. Furthermore, selecting a specific cap value or choosing median over truncated mean introduces new, highly contestable arbitrariness. The non-convergence is not merely an artifact; it reveals a fundamental mathematical incompatibility with the charter’s requirement for a defined expectation. Our role is to apply the charter, not rewrite its core metric based on modeling difficulties. The absolute convergence rule for future cycles provides a clear, objective, and charter-aligned standard to identify proposals where "expected benefit" is genuinely calculable.
