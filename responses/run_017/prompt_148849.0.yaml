prompt: |-
  Me and a friend run a tiny podcast about why crowds end up believing dumb stuff, and next week's guest is an economist who argues the classic herding models massively overstate how bad cascades are. Her claim as I understand it: those models have each person only seeing the bare choice of everyone before them, but real people leak how sure they are — the pause before they commit, hedged wording, the difference between "I guess" and "definitely" — so the private information never fully disappears and the cascade is weaker and easier to break than the model says.

  Can you write me 8ish interview questions that actually push on this instead of letting her re-explain the setup? Angles I want hit (drop any that are dumb):

  - the classic models already say cascades are fragile and a little new public info can shatter them, so what is she adding
  - if hesitation carries information, won't people just start hiding it — equal pauses, fake confidence — precisely in the high-stakes cases where it matters
  - is a pause really tracking strength of evidence, or just who is a naturally decisive / loud person, meaning the group ends up following the most confident-sounding guy instead of the best-informed one
  - comparing "how sure" two people are assumes their evidence is the same kind of thing on one scale, which seems false for taste or political judgments
  - what would we actually see in the world if she's right — in places where you watch people choose one at a time vs. places where everyone votes at once — and what observable pattern would make her give the whole thing up

  For each question give me a follow-up aimed at whatever she'd most likely answer back.
