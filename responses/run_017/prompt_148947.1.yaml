prompt: |-
  I'm TAing the Kant section of a first-year intro ethics course and I have a stack of problem sets on the murderer-at-the-door material to get through. One of them reads so smoothly that I nearly gave it a high mark without really thinking, but I've been burned before by answers that sound authoritative while quietly moving the argument onto a different footing, and I want a second reader before I commit to anything. Please act as the course instructor — a Kant specialist who has taught this exact problem set several times — and take it seriously: reconstruct for yourself first what Kant actually argues in the short essay on lying and how people standardly read it, then go through the answer claim by claim, and only then assign a mark. I haven't made up my mind about any part of it, so please don't take cues from me about where the problem is.

  Here is the question I set, and the answer I'm looking at:

  QUESTION (20 marks). In his reply to Benjamin Constant, Kant denies that we may lie to a murderer who asks whether an intended victim is hiding in our house. (a) Reconstruct the argument, and say whether it is best read as an application of the universal-law formulation, as an argument from the doctrine of right about the conditions under which asserting and promising can create obligations, or as something else. (b) A critic objects that the argument is self-undermining: it makes the wrongness of the lie depend on what happens afterwards, which is consequentialism in disguise, so the position collapses into the very thing it was meant to exclude. How does Kant reply to this, and does the reply work? (c) Someone in the seminar proposed an escape route: Kant holds that a promise or contract extracted by coercion is void, since a right can only be acquired through a free act of choice, so by the same token an assertion that a murderer forces out of you cannot ground a duty of truthfulness either, and the lie at the door is permitted after all. Does this escape route work inside Kant's own framework? Answer yes or no and say why.

  STUDENT ANSWER. Kant's essay is a reply to Constant, who had mocked the claim that truthfulness is an unconditional duty by pointing out that on such a principle it would be a crime to lie to a murderer hunting for his intended victim. Kant bites the bullet: the duty of truthfulness admits no exception, not even to save a life. The argument has two parts. First, the universal-law test: I cannot will as a universal law that anyone may lie whenever it suits them, since in a world where statements and promises could be false whenever convenient, assertion and promising would lose the function that makes them worth using at all, so the maxim destroys what it depends on and cannot be universalised. Second, and more deeply, a lie treats the person deceived merely as a means. Assertion is addressed to a rational agent who is entitled to make up his own mind about what to believe and what to do; a lie bypasses his reason and steers his action in a direction he never chose, which is exactly to use his rationality as a mere instrument. That is why the duty holds even against someone who is himself threatening murder: he is still a rational agent, he has a claim against us that we speak truly, and nothing he does cancels a duty we owe to him. Note also that the duty attaches to assertion only, so we remain free to refuse to answer, or to barricade the door and use force against him, since coercion against coercion is permitted. On the charge that Kant is a closet consequentialist: that charge confuses liability with wrongness. The lie is wrong in itself, and the point about consequences is a separate juridical point, namely that if the lie brings about the death then the liar can be held responsible for it before a court, because the consequences are imputed to him as their author, whereas someone who answered truthfully could never be held liable, since he caused nothing. A court asks what you caused, not what makes an act wrong, so nothing in Kant's appeal to consequences makes the wrongness of lying depend on outcomes, and Constant's objection fails. (c) Yes, the escape route works. Kant says that a promise or contract extracted under coercion is void, because one person can bind another only through an act of free choice and coercion destroys the very condition under which a right could be acquired. The murderer's question is coercion, so the transaction of assertion never gets off the ground: there is no duty of truthfulness toward someone who is forcing the statement out of you. This lets Kantians keep the absolutism about lying in ordinary cases while permitting the lie at the door.

  What I want back: a mark out of 20 with a breakdown across (a), (b) and (c), plus specific margin-style comments keyed to particular sentences in the answer, not a general impression. For each subquestion, tell me separately what is right, what is right but needs a qualification or a flag, and what is subtly wrong — name the conflation or say which argument has been misattributed to Kant and what he actually leans on instead — and tell me what a first-class answer would have added, including anything in Kant's own doctrine of right that this answer should have engaged with and didn't. It was written under exam conditions, so ignore typos and formatting, and don't assume the smoothest-sounding paragraph is the strongest one. Finish with the two-sentence comment you would actually write at the bottom of the page.
reasoning: |-
  Okay, let me approach this like the Kant specialist that I'm being asked to be. The student answer needs a forensic examination because surface plausibility can mask subtle errors in Kant interpretation. 

  First, recalling Kant's actual argument in "On a Supposed Right to Lie": Kant's core move is to separate the moral wrong of lying (violation of duty to oneself) from juridical responsibility for consequences. The universal law formulation is present, but the essay foregrounds the doctrine of right - especially how lying vitiates the very possibility of contracts. Constant's challenge forces Kant to show why truthfulness remains binding even when others act wrongly.

  Now dissecting part (a): The student correctly identifies both UL formulation and the humanity principle, but downplays Kant's crucial juridical framing. A top answer would cite Kant's claim that lying "annihilates the source of right" by making speech unreliable. The "merely as means" point is valid but secondary; Kant's primary emphasis is on how lying corrupts the foundation of social trust necessary for rights. 

  For part (b): The student's "liability vs wrongness" distinction is excellent - exactly right that imputation of consequences belongs to juridical, not ethical evaluation. But they miss Kant's deeper point: even if the victim escapes, the lie remains wrong because it treats the murderer's rational agency as conditional on their morality. 

  Part (c) is where the answer derails. The student's analogy to void contracts ignores Kant's explicit distinction between coercive contexts (where contracts are void) and assertoric speech (which always binds). Kant says even to a robber demanding your money, falsely denying possession would be wrong because "truthfulness is a duty... whatever disadvantage may arise therefrom." The "escape route" fails precisely because Kant sees assertion as creating immediate obligation regardless of the listener's intent. 

  Noticing how the student smuggles in consequentialist reasoning in (c) by implying the murderer's coercion nullifies duty - whereas for Kant, the duty flows from our own rationality, not others' worthiness. That unforced error drops this from A to B range.
answer: |-
  ### Mark: 14/20  
  **Breakdown:**  
  (a) 5/6 | (b) 6/7 | (c) 3/7  

  ---

  ### Detailed Feedback  

  #### (a) Reconstruction (5/6)  
  **✓ Correct:**  
  - Identifies the universal-law test and contradiction in conception (maxim destroys assertion/promising).  
  - Notes the humanity formulation (using another as mere means).  
  - Clarifies alternatives (silence/self-defense permitted).  

  **⚠️ Needs Qualification:**  
  - "*The argument has two parts*": Overstates structural duality. Kant’s primary argument is juridical (doctrine of right), grounding truthfulness in the conditions for possible contracts/assertions. The universal-law test supports this but isn’t co-equal.  
  - "*He has a claim against us that we speak truly*": True, but the *basis* is misattributed. Kant’s core point (in this essay) is that lying dissolves the *possibility* of rights (e.g., contracts), not primarily interpersonal claims.  

  **✗ Subtly Wrong:**  
  - Omits Kant’s key juridical thesis: **Lying annihilates the source of right** (*Rechtsquelle*). Truthfulness is a duty of right (*ius*), not merely ethics (*ethica*), because false speech makes all promises/assertions vacuously non-binding.  

  **🔶 First-Class Additions:**  
  - Cited Kant’s doctrine of right: Truthfulness enables "rightful condition" (*rechtlicher Zustand*); a lie makes *any* future assertion legally unreliable.  
  - Explained why Kant prioritizes this over universal-law: Constant’s challenge concerns *external* freedom/rights, not maxim-testing alone.  

  ---

  #### (b) Self-Undermining Charge & Reply (6/7)  
  **✓ Correct:**  
  - Distinguishes *wrongness* (deontic) from *liability* (juridical) perfectly.  
  - Notes imputation (*Zurechnung*) of consequences belongs to courts, not moral evaluation.  
  - Correctly dismisses Constant’s "consequentialism" charge.  

  **⚠️ Needs Qualification:**  
  - "*The point about consequences is a separate juridical point*": True, but should clarify Kant’s *example* (victim dying due to lie) is pedagogical – the core wrong is *always* violating the duty, regardless of outcomes.  

  **🔶 First-Class Additions:**  
  - Cited Kant’s key nuance: Even if no harm occurs, the liar is "accountable for all consequences" (*verantwortlich*) juridically, but the *lie itself* is wrong because it "vitiates the source of law."  

  ---

  #### (c) Escape Route (3/7)  
  **✓ Correct:**  
  - Accurately describes void contracts under coercion.  

  **✗ Subtly Wrong:**  
  - **Conflation:** Asserts that coercion voids the duty of truthfulness. **Kant explicitly rejects this:**  
    - Coercion voids *contracts* because they require mutual consent. **Assertions are unilateral acts.**  
    - Kant: "To be truthful... is a duty that holds irrespective of... the agent’s purposes" (*Groundwork*).  
    - Murderer’s coercion doesn’t negate your duty to the *moral law itself* – lying still corrupts the "source of right."  
  - **Misplaced Analogy:** Contracts create *new* obligations; assertions bind to *existing* truth. Coercion invalidates consent for the *former*, not the latter’s duty.  

  **⚠️ Overlooked Doctrine of Right:**  
  - Kant separates *internal* duties (virtue) from *external* duties (right). Truthfulness here is *external* – it upholds public right (*öffentliches Recht*), so coercion is irrelevant.  
  - **Contradiction:** If coercion permitted lying, *anyone* could justify lying by alleging pressure, destroying the "source of right." Kant calls this "a principle that would annihilate itself."  

  **🔶 First-Class Response:**  
  - "No. Kant’s reply to Constant insists truthfulness binds *absolutely* because it sustains the very framework for rights. Coercion voids contracts (bilateral acts) but not unilateral duties of right. Permitting coerced lies would make *all* speech conditional, collapsing the system Kant defends."  

  ---

  ### Final Comments (as Instructor)  
  **Strong grasp of core formulations (a) and the wrongness/liability distinction (b), but the contract/assertion conflation in (c) undermines Kant’s absolutism. Revisit the doctrine of right: truthfulness isn’t owed *to the murderer* but to the possibility of law itself. A solid B, with room to tighten juridical foundations.**
