prompt: |-
  I coach a competitive debate team at a large public high school, and in the same building I moderate a monthly discussion group for adults who read philosophy on their own. In both settings I run into the same move several times a month, and I have never had a consistent way of ruling on it. Instead of offering evidence, a speaker says that the opponent could not even make the claim without presupposing its opposite. You cannot argue that there are no reasons for belief, because to argue is to offer a reason. You cannot say that every truth is relative, because that very statement presents itself as true and not merely relative. You cannot deny that you acted freely, since raising the denial is something you did. You cannot claim that nothing is objectively valuable while writing a speech that urges the audience to change its mind. Sometimes the move deserves to win the point. Sometimes it feels like rhetorical judo, a way of punishing someone for speaking at all. I have since learned that philosophers apparently have a name for this shape of argument and a long dispute about what, if anything, it establishes, but I have no training in the subject and I am asking you rather than reading about it.

  What I need is a decision procedure, not an essay. My students debate every other weekend, and whether this move counts decides rounds; I also have to give the adults something they can use the same evening. So I want six or seven questions in a fixed order, each with a statement of what counts as a sufficient answer, a point at which the procedure returns a clear no, and a point at which it stops and hands the decision to the judge because the remaining question is one of values rather than of fact. It has to fit on one side of an index card and be runnable by a fifteen-year-old in about ninety seconds in the prep room, with no technical vocabulary. Where a step needs a piece of theory in order to be understood, say so and say what the plain-language version gives up. The judges are community volunteers who will not accept anything that sounds like theory, and neither will half my students.

  Three things I have noticed on my own that I want built in, but corrected if I have them wrong. First, these arguments are supposed to start from something the opponent cannot deny; yet some of them start from something the opponent is perfectly willing to give up, such as their own continued participation in the exchange, since they can stop talking or say they are only venting a feeling rather than asserting anything. That difference seems to matter, and I want a question that catches it. Second, there is a reply that deflates many of these arguments for me: granted, we have to think that way, but is that any reason to think things are that way? Some arguments I hear seem to collapse under that reply and others seem untouched by it, and I cannot say which is which. To me this looks like the deepest issue in the whole neighbourhood, so I would like the procedure to contain an explicit test for vulnerability to it, and to say what an argument would have to add in order to be immune. Third, some of these arguments strike me as circularity in costume, where the starting point quietly contains the conclusion the argument was meant to establish. I want a question that catches that without rejecting every argument of this shape on principle, since a few of them clearly do real work.

  Please then run the finished procedure on three cases and be blunt about the results. Apply it to the relativism case above, where a speaker says that the claim there is no objective truth refutes itself. Apply it to the case of reasons for belief, because I have been using that argument myself for about ten years and I would rather be told honestly that it establishes only something weaker than I have been claiming, if that is what it establishes. And apply it to a case I expect to fail outright, such as the claim that no one can deny having free will, since anyone who says so could have stayed silent instead. Where the procedure hands a decision to the judge, say so explicitly and say what the judge is being asked to decide.

  Finally, tell me which of the questions are really judgment calls wearing procedural clothing, and what the procedure cannot do. In particular, I want to know whether it can ever certify a conclusion as true of the world rather than merely as something we are committed to in virtue of thinking or speaking at all, and how a judge should weigh a move that survives the whole procedure against a single piece of ordinary evidence pointing the other way.
reasoning: |-
  Okay, let me tackle this complex debate coaching problem step by step. The user needs a practical decision tree for evaluating self-refuting arguments in competitive debate settings, with strict constraints: it must fit on an index card, use plain language, and be executable by teens in 90 seconds. 

  First, I recognize three key insights from the user's experience: (1) some arguments rely on premises the opponent might reject (like continued participation), (2) the "granted we think that way, but is it true?" rebuttal varies in effectiveness, and (3) circularity concerns. These need structured tests.

  Hmm... the solution should avoid philosophy jargon while capturing essential logical checks. I consider building a flowchart-like sequence: 
  Start by verifying if the opponent actually holds the presupposed commitment (Q1). Then check if abandoning that commitment is possible/meaningful (Q2). Next, assess if the argument smuggles in the conclusion (Q3). The critical move is testing vulnerability to the "thinking vs. being" distinction (Q4) - this requires explaining immunity conditions simply (e.g., "does the point work even if we're all confused?"). 

  For implementation, I'll design concrete yes/no questions with exit points. Q5 handles special cases like relativism where pragmatic contradictions arise. The final step (Q6) explicitly flags when judges must make value judgments about argument weight. 

  Testing cases: 
  1. Relativism ("no objective truth"): Should pass Q1-Q4 but stumble at Q4 vulnerability - showing it only proves we're committed to truth, not its existence. 
  2. "No reasons for belief": Similar outcome - survives circularity test but can't bridge to ontological claim. 
  3. Free will denial: Fails early at Q2 since silence isn't meaningful denial. 

  Important caveats: Q4 and Q6 involve judgment calls disguised as procedure. The tool can't prove truths about the world - only expose when arguments overreach from pragmatic commitments to ontological claims. Against counterevidence, surviving arguments get weaker weight as they don't provide positive proof. 

  This balances rigor with the user's need for speed and simplicity. The index card format forces ruthless prioritization - I'll omit historical context (e.g., Kant's transcendental arguments) since volunteers won't care about pedigree.
answer: |-
  Here's a decision procedure meeting your specifications. It fits on one index card (printed small), uses no technical terms, and takes ~90 seconds to run.

  **Self-Refutation Argument Tester (SRAT) - 6 Questions**

  1.  **"Does the opponent *actually need* the starting point?** *(Sufficient Answer: "Yes, they actively used it." Clear No: "No, they could stop/withdraw it right now.")*
      *   *If NO → STOP. Argument FAILS.* (They can just stop talking or say it's not a claim.)
      *   *If YES → Go to Q2.*

  2.  **"If they gave up the starting point, would their *main claim* still make sense?"** *(Sufficient Answer: "No, the claim itself relies on it." Clear No: "Yes, the claim stands alone.")*
      *   *If YES → STOP. Argument FAILS.* (The starting point isn't essential to the claim itself.)
      *   *If NO → Go to Q3.*

  3.  **"Does the argument *quietly sneak in* the exact thing it's trying to prove?"** *(Sufficient Answer: "Yes, the 'presupposition' is identical to the conclusion." Clear No: "No, it's different.")*
      *   *If YES → STOP. Argument FAILS.* (Circular - Cheating!)
      *   *If NO → Go to Q4. (This is where most real arguments pass)*

  4.  **"Does this *only* show we have to *think or speak* this way, OR does it show things *really are* this way?"** *(Sufficient Answer: "It claims to show things really are this way.")*
      *   *If "Only how we think/speak" → Go to Q5.*
      *   *If "How things really are" → Go to Q6.*
      *   *(Judgment Call: Arguer must state which they claim)*

  5.  **"Could the world *be different* even if we *had to think/speak* this way?"** *(Sufficient Answer: "Yes, we could be universally confused/mistaken.")*
      *   *If YES → Argument ONLY ESTABLISHES "how we must think/speak". Judge decides weight.*
      *   *If NO → Argument claims immunity. Go to Q6.*
      *   *(This is the "vulnerability test". Immunity requires showing confusion/mistake is impossible.)*

  6.  **"Is the starting point something *beyond possible doubt* for *anyone* trying to make *any* claim?"** *(Sufficient Answer: "Yes, it's absolutely unavoidable for any claim." Clear No: "No, some claims might avoid it.")*
      *   *If YES → Argument STRONG. Judge decides weight vs. evidence.*
      *   *If NO → Argument WEAK. Judge decides weight vs. evidence.*
      *   *(Judgment Call: This is about universality/necessity. Hand final weight to Judge.)*

  **Key Theory Simplifications & What's Lost:**
  *   **Q4/Q5:** The "Thinking vs. Being" distinction simplifies complex epistemology (e.g., transcendental arguments). *Lost:* Nuance on *how* thought might constrain reality. Plain version favours scepticism.
  *   **Q6:** "Beyond possible doubt" simplifies concepts of necessity/certainty. *Lost:* Degrees of doubt/certainty; context-dependence.

  ---

  **Application to Cases:**

  1.  **Relativism ("No objective truth" refutes itself):**
      *   Q1: **YES** (They made a claim).
      *   Q2: **NO** (Claim "no objective truth" relies on presenting itself as true).
      *   Q3: **NO** (Presupposes "truth exists for this claim", doesn't presuppose *objective* truth for all claims).
      *   Q4: Arguer claims it shows things *really are* this way (truth exists).
      *   Q5: Immune? **NO.** We *could* be universally wrong/deluded about truth. **Result:** ONLY ESTABLISHES "You must *presuppose* truth when making claims." *Judge decides weight.* (Survives procedure but weakened).

  2.  **Reasons for Belief ("You can't argue there are no reasons for belief"):**
      *   Q1: **YES** (They argued).
      *   Q2: **NO** (Claim "no reasons" relies on offering a reason - their argument).
      *   Q3: **NO** (Presupposes "reasons exist for this argument", not "reasons exist for all beliefs").
      *   Q4: Arguer claims it shows things *really are* this way (reasons exist).
      *   Q5: Immune? **NO.** We *could* be universally irrational/mistaken about reasons. **Result:** ONLY ESTABLISHES "You must *presuppose* reasons when arguing." *Judge decides weight.* (Survives but weakened - establishes commitment, not universal truth).

  3.  **Free Will Denial ("Can't deny free will because you spoke"):**
      *   Q1: **YES** (They denied it by speaking).
      *   Q2: **YES** (Their claim "I lack free will" *could* still be asserted/meant even if they stopped speaking *right now* or said it was just a feeling. The *content* of the claim doesn't inherently rely on them *choosing* to speak *at this moment*). **Result: STOP. Argument FAILS at Q2.**

  ---

  **What the SRAT Can and Cannot Do:**

  *   **Judgment Calls Disguised:**
      *   **Q4:** Determining if the arguer claims "thinking" or "being" relies on interpretation.
      *   **Q5:** Deciding if universal confusion *is possible* involves philosophical judgment.
      *   **Q6:** Deciding if something is "beyond possible doubt" is inherently subjective.
  *   **Limitations:**
      *   **Cannot Certify World Truth:** The SRAT *cannot* definitively prove something is true of the world (ontology). At best, it identifies arguments that *claim* this (Q4) and might be strong (Q6). Q5 explicitly blocks easy moves from "must think" to "is true".
      *   **Weight vs. Evidence:** A move surviving the SRAT (especially passing Q5/6 strongly) establishes a *logical commitment* or a *strong presupposition*. Against **ordinary counter-evidence**, a judge should typically:
          *   **Weigh the SRAT Move as a Logical Constraint:** It shows the *opponent's position* leads to a self-contradiction in the act of stating it. This is powerful but *formal*.
          *   **Weigh Counter-Evidence as Empirical/Substantive:** This addresses the *content* of the claim about the world.
          *   **Decision:** The judge must decide if the *formal inconsistency* in the opponent's position is a fatal flaw outweighing the *substantive evidence* they presented, or vice-versa. The SRAT move doesn't *disprove* the evidence; it undermines the *coherence* of asserting that evidence within the opponent's framework.

  **The SRAT gives you a fast, structured way to separate strong self-refutation arguments from weak or cheating ones, forces the "thinking vs. being" distinction into the open, flags circularity, and clearly tells the judge when and *what* they need to decide regarding weight.** It treats these moves as exposing necessary commitments or pragmatic contradictions, not usually as direct proofs of objective truth.
