prompt: |-
  Hi — I'm on the allocations commitee of a small foundation. About $40m a year, four staff, monthly meetings, and we have to publish a one-paragraph public rationale for every grant we make.

  We keep receiving what philosophers call Pascal's mugging: someone emails saying that unless we wire $5,000 to an account, they'll use their powers to cause some astronomically large amount of suffering, and when we ask how likely that is they just name a bigger number. We obviously say no, but we've never been able to say *why* in a way that doesn't also kill grants we actually want to make. Last month someone pointed out that if we're being consistent we either pay the mugger or we stop funding our pandemic-prevention portfolio, which has maybe a 1-in-10,000 shot at mattering at a civilisational scale. We also have a live $250k application from a group studying whether a certain industrial process could in principle set off a runaway atmospheric effect — real physics, genuinely speculative, maybe 1-in-a-million, catastrophic if real — and nobody can say whether that one is a mugging or not.

  So we want one written rule. It has to be usable by a programme officer with no decision-theory background in about twenty minutes, it has to output a number or a yes/no (no "it depends"), and it has to survive being published, because donors read these things.

  Here are nine candidate screens I've drafted, in my own words:

  1. Value ceiling — any payoff above a billion units of value just counts as a billion.
  2. Satisficing ceiling — once an option's upside clears a ceiling, we stop counting anything past it and rank options by what's under the ceiling.
  3. Probability floor — probabilities below one in a billion round to zero.
  4. Escalation screen — if the claimant can always name a bigger number in response to whatever probability we assign, the claim gets zero weight regardless of its content.
  5. Mechanism requirement — we need a causal chain from our action to the outcome where every link has a probability we could defend to a sceptical colleague; one unspecifiable link and the whole thing is zero.
  6. Track record — we only accept a probability if whoever produced it has a demonstrated calibration record at that order of magnitude; otherwise we throw their number out and substitute a base rate from a reference class of similar-sounding claims.
  7. Median not mean — rank options by the median of the outcome distribution under our posterior instead of the average.
  8. Robustness to our own disagreement — take whatever does best under the worst of the priors actually held around the table.
  9. Information only — never fund on expected-value grounds at all; fund only to reduce uncertainty, and price that separately.

  What I want back:

  - Score each screen 0–10 on two things *separately*: (a) does it actually stop the mugger — including the version where he emails every month with a bigger number, the version where he offers to pay *us* an astronomical sum, and the version where the harm happens somewhere we could never verify; and (b) does it leave the real portfolio intact — and for each screen, name the one existing grant it would wrongly kill.
  - I suspect two or three of these are the same rule wearing different clothes. Say which, and whether collapsing them loses anything that matters.
  - A tier list: adopt as written / adopt with one patch you specify / drop. One sentence per screen, no essays.
  - Under whichever screen you'd adopt, what fraction of the annual budget should we hold in reserve for mugger-shaped claims? Give me a number between 0 and 1, and say why it isn't 0 and why it isn't "as much as the biggest number implies."
  - Where is the real work actually happening — in the decision rule, or in whatever tells us where the probabilities came from? One paragraph. If it's the second, say what the written rule should say about that instead.

  Please don't rank them by how much decision theorists happen to like them. Rank them by whether a tired programme officer can apply them correctly at 4pm on a Friday, and by whether the sentence we publish makes us look like we know what we're doing.
reasoning: |-
  Okay, the user is on the allocations committee of a small foundation with a $40m annual budget. They're struggling with Pascal's mugging scenarios where people threaten astronomically large harms unless paid a small amount. They need a clear, practical rule that stops these muggers without affecting legitimate grants like pandemic prevention or speculative physics research. 

  The user provided nine candidate screens and wants them evaluated on two main criteria: effectiveness against muggers (including variants) and preservation of their real portfolio. They also want to know if any screens are redundant, a tier list for adoption, a reserve budget fraction for mugger claims, and where the real work happens.

  First, I need to assess each screen against the criteria. The user emphasized practicality—program officers must apply it quickly without decision theory expertise. The rule must output a clear yes/no or number and withstand public scrutiny since rationales are published.

  Starting with screen 1 (Value ceiling): Caps payoffs at 1 billion units. This stops muggers because their astronomical claims get truncated, but it would kill legitimate high-impact, low-probability grants like the $250k atmospheric study. If a billion is the cap, even if the study prevents a trillion-unit catastrophe, it only counts as a billion, making it hard to justify. So it's strong against muggers (10/10) but weak for the portfolio (2/10). The grant it kills is the atmospheric effect study.

  Screen 2 (Satisficing ceiling): Focuses on meeting a threshold rather than maximizing. Once an option's upside clears a high ceiling (say, preventing extinction), further gains don't matter. This might stop muggers since their huge threats exceed any ceiling. However, it could harm portfolio grants that aim for massive impacts beyond the ceiling. For example, if pandemic prevention clears the ceiling, studying even better methods might not get funded. It scores 9/10 against muggers but 5/10 for the portfolio, killing follow-up grants to successful interventions.

  Screen 3 (Probability floor): Rounds extremely low probabilities to zero. This directly stops muggers by ignoring their tiny probabilities. But it would kill the atmospheric study (1-in-a-million probability) and similar speculative science. Scores 10/10 against muggers, 3/10 for portfolio. The atmospheric grant is the casualty.

  Screen 4 (Escalation screen): Rejects claims where the claimant can always name a bigger number. This is clever—muggers inherently escalate, so this cuts them off. It shouldn't affect legitimate grants because real researchers don't engage in escalation (e.g., pandemic experts don't inflate numbers when questioned). Strong against muggers (9/10), safe for portfolio (9/10). No existing grants killed.

  Screen 5 (Mechanism requirement): Demands a defensible causal chain. Muggers can't provide this, so it stops them. Legitimate grants like pandemic prevention have clear mechanisms (e.g., vaccine development). The atmospheric study might struggle if the chain isn't fully specified. Scores 10/10 against muggers, 8/10 for portfolio. Might kill the atmospheric grant if mechanisms aren't clear.

  Screen 6 (Track record): Uses calibration and base rates. Muggers lack track records, so their claims get dismissed. Legitimate researchers often have calibration (e.g., epidemiologists). The atmospheric study could reference similar physics models. Scores 10/10 against muggers, 7/10 for portfolio. Could kill novel, first-time claims without direct precedents.

  Screen 7 (Median not mean): Focuses on median outcomes rather than averages. This ignores extreme tails, so muggers' low-probability threats don't sway decisions. However, legitimate high-impact, low-probability grants (like pandemic prevention) rely on mean calculations. Switching to median would undervalue them. Scores 8/10 against muggers, 2/10 for portfolio. Kills all tail-risk grants.

  Screen 8 (Robustness to disagreement): Uses the worst-case prior from committee members. Muggers' claims won't survive skeptical priors. Legitimate grants should have consensus. But if one member is overly skeptical, good grants die. Scores 9/10 against muggers, 6/10 for portfolio. Might kill controversial but valid grants.

  Screen 9 (Information only): Funds only to reduce uncertainty, not expected value. This avoids muggers entirely since they offer no information. However, it prevents funding action-oriented grants like pandemic prevention. Scores 10/10 against muggers, 1/10 for portfolio. Kills all non-research interventions.

  Now, identifying redundancies: Screens 1, 2, 3, and 7 all target extreme values or probabilities, making them similar. But 4 (escalation) and 5 (mechanism) are distinct and more practical. Screen 4 is unique in handling the escalation dynamic, while 5 focuses on plausibility.

  For the tier list: Adopt Screen 4 (escalation) with a minor patch—explicitly defining "naming a bigger number" as any response that increases stakes without new evidence. Screen 5 (mechanism) is also strong; adopt as written. Screens 6 and 8 are adoptable with patches (e.g., defining reference classes for track records, requiring priors to be justified). Others are dropped due to portfolio harm.

  Reserve budget fraction: 0.0001 (about $4,000). Why not zero? Because a genuine claim might slip through, but it's negligible. Why not more? Because mugger claims are invalid, so reserves should be symbolic.

  The real work happens in probability assessment, not the decision rule. The written rule should mandate documented probability sources, reference classes, and calibration evidence. This makes the process transparent and defensible.

  Overall, Screen 4 (escalation) is the top choice—simple, effective, and portfolio-safe. Pair it with the mechanism requirement for robustness. The user needs a rule that's both practical and credible, and this delivers.
answer: |-
  Here's your assessment, designed for clarity, practicality, and public defensibility. Scores are (a) Mugger-Stopping / (b) Portfolio-Safety.

  **Scores & Existing Grant Killed:**
  1.  **Value Ceiling**: (a) 10/10 (b) 2/10. *Kills:* The $250k atmospheric runaway study (its potential value is capped at 1B, likely making it unfundable).
  2.  **Satisficing Ceiling**: (a) 9/10 (b) 5/10. *Kills:* Follow-up funding for a *successful* pandemic prevention project aiming for even greater scale beyond the ceiling.
  3.  **Probability Floor**: (a) 10/10 (b) 3/10. *Kills:* The $250k atmospheric runaway study (1e-6 < 1e-9).
  4.  **Escalation Screen**: (a) 9/10 (b) 9/10. *Kills:* None. (Legitimate claimants provide evidence, not escalation).
  5.  **Mechanism Requirement**: (a) 10/10 (b) 8/10. *Kills:* *Potentially* the atmospheric study if a critical link remains unspecifiable/undefendable.
  6.  **Track Record**: (a) 10/10 (b) 7/10. *Kills:* A novel, high-impact intervention proposed by a brilliant but uncalibrated new researcher.
  7.  **Median not Mean**: (a) 8/10 (b) 2/10. *Kills:* Your entire pandemic prevention portfolio (relies on low-p high-impact tails).
  8.  **Robustness to Disagreement**: (a) 9/10 (b) 6/10. *Kills:* Any grant where one skeptical committee member assigns a near-zero prior to its impact (e.g., the atmospheric study).
  9.  **Information Only**: (a) 10/10 (b) 1/10. *Kills:* Your entire pandemic prevention portfolio (funds action, not just research).

  **Redundancy Check:**
  *   **Screens 1, 2, 3, 7 are closely related:** They all fundamentally attack the problem by downweighting or ignoring extreme values (1,2,7) or extreme probabilities (3). Collapsing them loses nuance (satisficing vs. capping vs. median focus) but the core "ignore extremes" idea is shared.
  *   **Screen 4 (Escalation) is distinct:** It uniquely targets the *behavior* of the claimant, not the numbers themselves.
  *   **Screen 5 (Mechanism) is distinct:** It focuses on the *plausibility of the causal chain*.
  *   **Screens 6 & 8 are distinct but complementary:** 6 uses external calibration/reference classes, 8 uses internal committee priors. Both address uncertainty about the probability estimate itself.
  *   **Screen 9 is in its own category:** It fundamentally changes the funding paradigm.
  *   **Collapsing Loss:** Collapsing 1,2,3,7 loses the specific tactical differences (e.g., satisficing logic vs. hard cap), but the core "extreme value/probability mitigation" is preserved. Screens 4 and 5 offer fundamentally different, highly practical, and robust approaches.

  **Tier List (Adopt/Patch/Drop):**
  1.  **Adopt as Written:** **#4 Escalation Screen.** (Simple, behavioral, stops muggers, preserves portfolio).
  2.  **Adopt with Patch:** **#5 Mechanism Requirement.** (Patch: Define "defend to a skeptical colleague" as "requiring at least one published study or established model supporting *each critical link* in the chain, or a clear expert consensus documented in the proposal."). **#6 Track Record.** (Patch: Define "reference class" as "published forecasts or outcomes from similar interventions/models in peer-reviewed literature or reputable forecasting platforms").
  3.  **Drop:** #1, #2, #3, #7 (Harm portfolio too much), #8 (Too subjective/vulnerable to one skeptic), #9 (Fundamentally incompatible with your mission).

  **Reserve Fraction: 0.0001 (0.01% or ~$4,000)**
  *   **Why not 0?** A vanishingly small reserve acknowledges the theoretical possibility of a *genuine*, non-mugging claim fitting your criteria *might* someday appear (e.g., a well-calibrated expert with a mechanistic model predicting a novel, high-impact, low-probability threat needing small, urgent funding for verification/mitigation).
  *   **Why not "as much as the biggest number implies"?** The entire point of adopting Screen #4 (or #5) is that these claims are fundamentally invalid and *should not* influence expected value calculations. Paying them encourages more muggings and wastes resources on scams. The reserve is purely symbolic/contingency.

  **Where the Real Work Happens:**
  The real work happens **overwhelmingly in assessing the probabilities and mechanisms** (the inputs), *not* in the final decision rule applying them. The rule (#4 or #5) acts as a crucial filter rejecting invalid *inputs*. For your written rule:

  > **"Our Foundation requires a credible causal mechanism linking the funded activity to the claimed outcome, supported by evidence for each critical step. Claims where the only response to scrutiny is escalating the stakes of harm or reward, without providing new evidence, are considered non-credible. Funding decisions are based on the expected value calculated using probabilities and outcomes derived from these credible mechanisms."**

  **Recommendation:** **Adopt Screen #4 (Escalation Screen) as your primary written rule.** It's the easiest for a program officer to apply correctly (identify escalation behavior), stops all mugger variants dead, perfectly preserves your desired portfolio, and sounds decisive/defensible to the public ("We fund credible claims backed by evidence, not escalating threats"). Use Screen #5 (Mechanism Requirement) as an *internal due diligence step* for *all* grants, especially speculative ones like the atmospheric study, to bolster credibility. The $4k reserve is a negligible token.
