answer: |-
  Here’s a concise, theory-neutral quiz designed to map answers onto Frege’s puzzle solutions. Each case isolates a key theoretical commitment. **Answer based on intuitive judgments about meaning, informativeness, or mental states.**

  ---

  ### **Quiz: Identity Statements and Cognitive Significance**  
  *For each scenario, pick the option that best reflects your view.*  

  1.  **Lab Specimen**: A scientist names a single lab sample "Ares" and "Kronos" *in the same ceremony*, knowing it’s one sample. Years later, she says, "Ares is Kronos."  
      a) This is trivial/uninformative; it conveys nothing new.  
      b) This could still be informative; she might learn something beyond the identity.  

  2.  **Pure Testimony**: Jamie learns *only* from reliable sources that "Cicero" and "Tully" name the same person. Jamie has no other knowledge of Cicero/Tully. "Cicero is Tully" strikes Jamie as:  
      a) Trivial (like "Bob is Bob").  
      b) Substantial new information.  

  3.  **Belief Difference**: Lois Lane believes Superman can fly but Clark Kent cannot (unaware they’re identical). When she thinks, "Superman is nearby," she feels excited; when she thinks, "Clark Kent is nearby," she feels indifferent.  
      a) Her *beliefs* differ: she believes Superman is nearby but not Clark.  
      b) Her beliefs are the same; the difference is in *how* she thinks about the person.  

  4.  **Empty Names**: "Vulcan" was a hypothesized planet; "Phlogiston" a hypothesized substance. Both turned out not to exist. The statement "Vulcan is Phlogiston" is:  
      a) Meaningless (no referents, so no real identity claim).  
      b) False (it claims identical referents, but neither exists).  
      c) Informative/cognitive (it conveys something, e.g., about theories).  

  5.  **Coordinated Speaker**: Alex knows "Dr. Jekyll" and "Mr. Hyde" refer to the same person and always uses them with this awareness. Alex says, "Dr. Jekyll is Mr. Hyde."  
      a) This is uninformative *for Alex* (they’re fully coordinated).  
      b) This could still be informative/cognitively significant for Alex.  

  6.  **Arithmetic Identity**: Someone learns "Hesperus is Phosphorus" (evening star = morning star) is true. Later, they learn "Hesperus is Hesperus."  
      a) The second statement is fundamentally different/trivial.  
      b) Both statements are equally trivial once the identity is known.  

  7.  **Emotional Response**: Oedipus admires the King of Thebes but despises the man who killed Laius (unaware they’re identical). He feels pride thinking of the King, disgust thinking of the killer.  
      a) This shows his *beliefs* about the individuals differ.  
      b) This shows a difference in his *mode of thought* about one individual.  

  8.  **First-Person Mirror**: You see a live video feed labeled "External View," showing a person facing away. Unbeknownst to you, it’s a mirror: the person is you. You think, "That person has my shirt!" Later, you realize, "I am that person."  
      a) This realization is *about identity* but doesn’t change self-knowledge.  
      b) This realization fundamentally alters self-understanding.  

  9.  **AI Database**: A language model outputs different responses to "Is Ares radioactive?" (Yes) vs. "Is Kronos radioactive?" (No), because its training data associates the codenames inconsistently. There is no lab sample; the names are fictional.  
      a) The model exhibits a cognitive difference (like Lois Lane).  
      b) This is just syntactic; no cognitive significance without a thinking subject.  

  ---

  ### **Scoring Key & Position Mapping**  
  *Tally your answers (e.g., 1b, 2a, 3b...9a). Compare to the groups below.*  

  **Group A (Semantic + Expression-Bound):**  
  - **Q1b, Q2b, Q3a, Q5b, Q6a, Q7a, Q8b, Q9a**  
    *Views:* **Classical Descriptivism** (meaning = descriptive content), **Fregean/Neo-Fregean** (senses as semantic).  
    *Core:* Informativeness is semantic; cognitive differences come from distinct semantic properties of names.  

  **Group B (Semantic + Relational):**  
  - **Q1a, Q2a, Q3b, Q5b, Q6a, Q7b, Q8b, Q9a**  
    *Views:* **Semantic Relationism** (Fine), some **Structured Proposition** views.  
    *Core:* Semantic content is relational; "a=a" vs. "a=b" differ structurally even with shared reference. Coordination (Q5b) doesn’t erase structure.  

  **Group C (Semantic + Hidden):**  
  - **Q1a/b, Q2b, Q3b, Q4c, Q5b, Q6a, Q7b, Q8b, Q9a**  
    *Views:* **Hidden-Indexical Theories** (Schiffer).  
    *Core:* Belief reports assert reference + pragmatically imply a "mode of presentation." Difference is semantic but not in the *words*. Empty names (Q4c) can have MoPs.  

  **Group D (Non-Semantic):**  
  - **Q1a, Q2a, Q3b, Q4a, Q5a, Q6b, Q7b, Q8a, Q9b**  
    *Views:* **Direct Reference/Pragmatic Millianism** (Salmon, Soames), **Metalinguistic/Deflationary** (Rorty, some Wittgensteinians).  
    *Core:* Informativeness is pragmatic (about language use/psychology). No semantic difference between "a=a" and "a=b" once identity known. Coordination (Q5a) trivializes. Cognition requires a subject (Q9b).  

  **Group E (2D/Contextual):**  
  - **Q1b, Q2b, Q3b, Q4a/c, Q5b, Q6a, Q7b, Q8b, Q9a**  
    *Views:* **Two-Dimensionalism** (Chalmers, Jackson).  
    *Core:* Names have primary (descriptive) and secondary (referential) intensions. "Ares is Kronos" is cognitively significant via primary intensions. Empty names (Q4a/c) may lack secondary intension.  

  ---

  ### **Indistinguishable Views & Unoccupied Leaves**  
  - **Pragmatic Millianism (Group D) vs. Metalinguistic Deflationism (Group D)** collapse: Both answer identically.  
  - **Relationism (Group B) vs. Neo-Fregean (Group A)** *mostly* collapse *except on Q4/Q9*: Neo-Fregeans often require referents (Q4a), Relationism may not.  
  - **Unnamed Combo:** Q1b + Q2a + Q3b + Q4a + Q5a + Q6b + Q7b + Q8a + Q9a. *Why?* Asserts cognitive significance is semantic (Q1b,Q2a) but denies coordination matters (Q5a) *and* that structure matters (Q6b)—incoherent.  
  - **Unnamed Combo:** Q1a + Q2b + Q3b + Q4c + Q5a + Q6a + Q7b + Q8b + Q9b. *Why?* Claims names are trivial when coordinated (Q5a) but substantial via testimony (Q2b)—contradicts Q2b requiring semantic depth without coordination.  

  **Design Notes:**  
  - Cases isolate: Semantic vs. Pragmatic (Q1,Q2,Q5,Q6), Nature of Difference (Q3,Q7,Q8), Reference Dependence (Q4), Subject Requirement (Q9).  
  - Positions mapped via core commitments; labels added post-hoc for teaching.  
  - Word count: ~1,200 words (fits 2 pages).  

  Let me know if you'd like the cases reordered or refined!
