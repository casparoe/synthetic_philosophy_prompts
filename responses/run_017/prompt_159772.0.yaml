prompt: |-
  I sit on my university's academic-integrity committee, and after a messy case last term I started reading about how groups decide things. Our rule is two-part: a finding of misconduct requires both that the student submitted work that was not their own and that no valid excuse applies. We vote by show of hands, and last term we ended up with a majority for each of the two conditions separately but a majority against a finding of misconduct — and then argued for an hour about what we had actually decided. Someone sent me a chapter from a popular book on collective decision-making that seemed to describe exactly our problem, but I don't trust it enough to bring it to the committee. Before I do, I'd like to know which parts of it a specialist in this area would endorse, which are simplifications, and which are quietly wrong.

  The chapter's account, as closely as I can reproduce its wording, goes like this: a group can be made up of perfectly reasonable individuals and still be unreasonable as a group. Imagine three judges deciding whether a defendant is liable, where the law makes liability depend on both a duty of care and a breach of that duty. One judge finds a duty and a breach and votes liable; one finds a duty but no breach; one finds no duty but a breach. Two of the three accept that there was a duty and two of the three accept that there was a breach, so if the court votes on the two questions separately it has to find the defendant liable — even though two of the three judges voted not liable. The court's verdict therefore depends on nothing more than which questions get put to the vote, which means it is an artifact of procedure rather than a finding. This is the discursive dilemma. The chapter then says that it is really just Condorcet's paradox of voting applied to beliefs instead of preferences — or, equivalently, Arrow's impossibility theorem restated for courts — and draws the moral that whenever a group has to settle several logically connected questions at once, no voting rule can reliably turn reasonable individuals into a reasonable group. It extends this well beyond law: any committee, board or electorate that votes on a package of related propositions risks endorsing conclusions that nobody in the room accepts, which is why putting complex questions to a popular vote is a dice roll. The only real escapes, it concludes, are to hand the decision to one person, or to break the issue down until every vote is a simple yes-or-no on one thing.

  My instinct is that this is unfair in at least one way — it slides from "collective judgments can be inconsistent" to "group decision-making is unreliable generally," and I don't see why a coherence problem about the shape of a group's stated position should tell us anything about whether the group is likely to get the facts right. But I can't tell where the chapter stops being accurate and starts overstating, and I also can't tell whether its practical moral survives correction. So: please audit it claim by claim, saying what someone who works on this literature would accept outright, what they would describe as a common simplification, what they would reject, and what the strongest defender of the view would say the chapter gets wrong about their own result. Then tell me whether the conclusion I actually care about follows from the accurate parts of the account: our committee is considering a "double-majority" fix, where each condition must win a majority on its own and the composite finding must also win a majority on its own, and if the composite fails we record no violation and note only those conditions that did pass. Is that a genuine way out of the problem the chapter describes, is it secretly one of the procedures the literature already discusses under another description, what does it cost us, and does it quietly give up something that the impossibility results are usually taken to require? I'd also like to know whether we would do better simply to vote only on the two conditions and never on the composite finding at all — what we would gain and lose by doing that, in terms the rest of the committee will understand.
reasoning: |-
  Hmm, the user is on an academic-integrity committee and faced a confusing voting situation where separate majorities supported each condition for misconduct but the overall finding failed. They read a popular book chapter about the "discursive dilemma" and want to know how much of it is accurate.

  The chapter describes how groups can produce inconsistent judgments even when individuals are rational, using the example of three judges voting on duty and breach in a liability case. It connects this to Condorcet's paradox and Arrow's theorem, suggesting that voting on multiple propositions inevitably leads to incoherence, with the only solutions being dictatorship or isolating single issues.

  I need to audit this chapter claim-by-claim. Starting with the core example: the discursive dilemma is real and well-established in judgment aggregation theory. The three-judge scenario perfectly illustrates how separate majorities can conflict with the overall vote. This part is solid.

  The connection to Condorcet's paradox is reasonable but imperfect. While both show aggregation problems, Condorcet is about preferences (cyclic majorities), while discursive dilemma is about beliefs (inconsistent judgments). They're cousins, not identical. Arrow's theorem is a stretch - it applies more to preference aggregation than belief aggregation, though there are parallels in impossibility results.

  Where the chapter overreaches is claiming this makes group decision-making "unreliable generally." The problem is about logical coherence of outcomes, not accuracy. Groups might still get facts right despite inconsistent reasoning paths. The chapter also overstates the "no voting rule" claim - while impossibility theorems exist, they depend on specific conditions, and some rules perform better than others.

  The user proposes a "double-majority" fix: requiring majority support for each condition AND for the composite finding. This is actually the premise-based approach discussed in literature. It ensures coherence but at the cost of sometimes not convicting when separate majorities exist (the very case they encountered). Alternatively, voting only on conditions (conclusion-based) avoids inconsistency but may ignore how conditions connect to the verdict.

  For their committee, I should clarify: the double-majority approach (premise-based) prevents inconsistent outcomes but might feel unsatisfying when conditions pass separately but the composite fails. Voting only on conditions (conclusion-based) is simpler but detaches the verdict from the reasoning. Neither is perfect, but both avoid the dilemma they faced. Practical advice would be to choose based on whether they prioritize logical coherence or direct verdicts.
answer: |-
  Here's a claim-by-claim audit of the chapter's argument, drawing on the judgment aggregation literature (which directly addresses this problem) and social choice theory, followed by analysis of your proposed solutions:

  **Audit of the Chapter's Claims:**

  1.  **"A group can be made up of perfectly reasonable individuals and still be unreasonable as a group."**
      *   **Specialist Endorsement:** **Strongly Accepted.** This is the core insight of judgment aggregation theory. Individuals can hold logically consistent sets of beliefs (judgments on premises/conclusions), but aggregating them via voting on individual propositions can lead the *collective* set of judgments to be logically inconsistent or inconsistent with the decision rule. This is the "discursive dilemma" (also known as the "doctrinal paradox").

  2.  **The Three Judges Example (Duty + Breach -> Liability):**
      *   **Specialist Endorsement:** **Strongly Accepted as Illustration.** This is the canonical example used to introduce the discursive dilemma. It perfectly demonstrates the problem: separate majority votes on premises (Duty: 2-1 Yes, Breach: 2-1 Yes) imply Liability, while a majority vote on the conclusion (Liability: 1-2 No) contradicts this. The collective judgment set {Duty=Yes, Breach=Yes, Liability=No} is inconsistent with the rule "Duty AND Breach imply Liability".
      *   **Simplification:** The example assumes a simple conjunctive rule (A AND B). Real-world rules can be more complex (disjunctions, implications), but the core paradox arises even with simple rules.

  3.  **"The court's verdict therefore depends on nothing more than which questions get put to the vote... an artifact of procedure."**
      *   **Specialist Endorsement:** **Accepted (with nuance).** This is precisely the point. The outcome *is* highly sensitive to the *agenda* (what is voted on, and in what order/combination). Voting only on premises ("premise-based") yields Liability. Voting only on the conclusion ("conclusion-based") yields No Liability. Both procedures are plausible, but they yield different results from the *same individual judgments*. The dilemma forces a procedural choice with substantive consequences.
      *   **Nuance:** While the outcome is procedure-dependent, it's not *arbitrary* in the sense of being random. It depends specifically on *which* aggregation method (premise-based, conclusion-based, or something else) is chosen.

  4.  **"This is the discursive dilemma."**
      *   **Specialist Endorsement:** **Correct.** This is the standard name for this specific phenomenon in judgment aggregation.

  5.  **"It is really just Condorcet's paradox of voting applied to beliefs instead of preferences — or, equivalently, Arrow's impossibility theorem restated for courts."**
      *   **Specialist View:**
          *   **Condorcet's Paradox Analogy:** **Accepted as Intuitive Analogy, but Imperfect.** Condorcet shows aggregation of *preferences* (rankings) can lead to cycles (A>B, B>C, C>A). The discursive dilemma shows aggregation of *judgments/beliefs* (on logically connected propositions) can lead to inconsistency. Both highlight aggregation problems, but the nature of the input (preferences vs. truth-apt beliefs) and the output problem (cycle vs. logical inconsistency) differ significantly. They are analogous cousins, not the same thing.
          *   **Arrow's Theorem Equivalence:** **Overstated/Largely Rejected.** Arrow's theorem concerns aggregating *preferences* into a social *ordering* satisfying specific axioms (like independence of irrelevant alternatives), proving an impossibility under reasonable conditions. Judgment aggregation has its *own* impossibility theorems (notably by List and Pettit, building on earlier work like Kornhauser & Sager), showing that no aggregation rule satisfies a set of seemingly reasonable conditions (like consistency, completeness, independence, and unanimity preservation) for aggregating judgments on interconnected propositions. While deeply connected and inspired by Arrow, and often seen as a "belief-based" counterpart, judgment aggregation impossibility is a distinct result with its own conditions and focus on logical consistency. Saying it's "Arrow restated for courts" is a significant oversimplification.

  6.  **"Whenever a group has to settle several logically connected questions at once, no voting rule can reliably turn reasonable individuals into a reasonable group."**
      *   **Specialist View:** **Accepted *in a specific technical sense*, but often Overstated in Popular Accounts.**
          *   **Accurate Core:** Judgment aggregation impossibility theorems *do* show that under general conditions, no aggregation rule can *guarantee* a logically consistent collective set of judgments while satisfying other minimal democratic desiderata (like non-dictatorship, independence of irrelevant propositions to some degree, and respecting unanimity) for *all possible combinations* of individual judgments.
          *   **Crucial Simplifications/Overstatements:**
              *   **"Reliably":** The impossibility is about *guaranteeing* consistency *for every possible profile* of individual judgments. Many rules work perfectly fine *most of the time* with *real-world* profiles that aren't perfectly balanced to trigger the dilemma. The problem is the *risk* and the lack of a *universally flawless* rule.
              *   **"Reasonable Group":** The problem is *specifically* about *logical coherence* of the collective output, not necessarily about the group's overall epistemic reliability (getting facts right) or wisdom. A group can be logically inconsistent but still make a factually correct final decision, or vice-versa.
              *   **Scope:** The impossibility holds for sufficiently complex sets of interconnected propositions. Simpler structures might avoid it.

  7.  **"Any committee... voting on a package of related propositions risks endorsing conclusions that nobody in the room accepts... why putting complex questions to a popular vote is a dice roll."**
      *   **Specialist View:** **Accepted as Highlighting a Real Risk, but Overly Pessimistic/Dramatic.**
          *   **Risk of Inconsistency/Nobody Accepts:** True, the dilemma *can* lead to a collective judgment set where the implied conclusion contradicts the directly voted conclusion. It *can* lead to outcomes not held by any single member (e.g., the Liability verdict implied by premises but rejected in the conclusion vote).
          *   **"Dice Roll" / "Risks":** While the risk exists, it's not random like dice. It depends on the distribution of views and the procedure. The probability depends on the specific case. Calling it a "dice roll" exaggerates the unpredictability compared to other voting pathologies.

  8.  **"The only real escapes... hand the decision to one person, or to break the issue down until every vote is a simple yes-or-no on one thing."**
      *   **Specialist View:** **Incomplete and Oversimplified.**
      *   **Dictatorship:** Correct that letting one person decide avoids aggregation problems, but it's usually unacceptable for committees.
      *   **"Break the issue down" (Isolation):** This is ambiguous and potentially misleading.
          *   If it means voting *only* on atomic, logically *independent* facts, that *can* avoid inconsistency *if* the decision rule is applied *afterwards* by someone (but then you've deferred the key judgment).
          *   If it means voting on each premise and the conclusion separately (the core problem!), it *doesn't* escape the dilemma – it just makes the potential inconsistency manifest.
          *   **Missing Alternatives:** The literature explores other procedures:
              *   **Deliberation:** Facilitating discussion to reach consensus or clarify ambiguities in the rule/premises before voting.
              *   **Voting Rules:** Using rules beyond simple majority on each proposition, like supermajorities, sequential voting with feedback, or rules explicitly designed for premise/conclusion aggregation (though these often trade off different desirable properties).
              *   **Structured Rule Application:** Voting *only* on premises and then *automatically* deriving the conclusion based on the rule ("premise-based"), or voting *only* on the conclusion ("conclusion-based") and accepting that premises might be inconsistent. These are the main procedural alternatives already discussed.

  **Analysis of Your Proposed Solutions & Questions:**

  1.  **Your "Double-Majority" Fix:**
      *   **What it is:** You propose requiring:
          *   Majority for Condition A (e.g., "Not own work")
          *   Majority for Condition B (e.g., "No valid excuse")
          *   Majority for the Composite Finding C (e.g., "Violation")
      *   **Is it a Genuine Escape?** **Yes, it prevents inconsistency by design.** If C fails, you record no violation, even if A and B both passed. The collective judgment set {A=Yes, B=Yes, C=No} is *not* logically inconsistent *if* you explicitly define the rule as requiring majority approval on C *in addition to* A and B. You've redefined the decision rule from "A AND B imply C" to "C requires (Majority(A) AND Majority(B) AND Majority(C))". This avoids the specific inconsistency of the doctrinal paradox.
      *   **What is it in Literature?** This is a specific variant of a **conclusion-based procedure with additional constraints**. You are prioritizing a direct vote on the conclusion (C) and making its passage essential, *even if* the premises (A and B) pass. It's distinct from pure premise-based or pure conclusion-based.
      *   **What Does it Cost?**
          *   **Reduced Conviction Rate:** You will *not* find a violation in cases where a majority supports A, a majority supports B, but a majority *rejects* C. This is the scenario you encountered. Some committee members will likely feel this is letting someone "off the hook" when the core conditions are met.
          *   **Potential "False Negatives":** It might fail to convict in cases where the *reason* the majority rejects C is based on a misunderstanding of the rule or an irrelevant factor not captured by A or B.
          *   **Redundancy?:** If A and B passing *logically implies* C for committee members, then requiring a majority on C might seem redundant. But your dilemma showed members might accept A and B but reject C for other reasons (e.g., perceived minor offense, procedural fairness concerns not captured in A/B, misunderstanding the link). Your rule makes those reasons decisive.
      *   **Does it Give Up Something Required by Impossibility?** **Yes.** The impossibility theorems typically require that the aggregation rule satisfies "Systematicity" or "Independence" (judging each proposition based *only* on votes on that proposition) and "Consistency" (collective judgments must be logically consistent). Your rule violates Systematicity/Independence in spirit: the *meaning* of voting on C is now different because it depends on the votes for A and B (C only matters if A and B pass, otherwise it's irrelevant). More importantly, impossibility theorems require rules that work for *all possible* connections between propositions. By explicitly defining the group's decision rule as requiring majority approval on C *in addition to* A and B, you are fixing a *specific* aggregation method for this *specific* rule structure, avoiding the *general* impossibility. You've chosen a specific, consistent, but potentially less "premise-driven" rule.

  2.  **Voting Only on the Two Conditions (Never on the Composite):**
      *   **What it is (Premise-Based Procedure):** Vote only on A ("Not own work? Majority Yes/No") and B ("No valid excuse? Majority Yes/No"). Apply the rule automatically: If both A and B are "Yes" by majority, then record a violation. If not, no violation.
      *   **What You Gain:**
          *   **Guaranteed Consistency:** The outcome will always be logically consistent with the rule "Violation iff A and B". {A=Yes, B=Yes, Violation=Yes} or {A=No, Violation=No} or {B=No, Violation=No} are all consistent.
          *   **Clarity & Speed:** Simpler voting procedure. Avoids the hour-long argument about the composite meaning.
          *   **Focus on Facts:** Forces focus on determining the factual premises A and B according to the evidence and policy.
      *   **What You Lose:**
          *   **Loss of Nuance/Discretion:** The committee cannot express the view that *even though* A and B are true (work not own, no valid excuse), there is *still* some overriding reason why it shouldn't be deemed a *violation* meriting formal sanction (e.g., triviality, extenuating circumstances not covered by "valid excuse," procedural error not rising to dismissal level). The rule is applied mechanically.
          *   **Potential for Harsher Outcomes:** It *will* convict in the scenario where majorities support A and B *but* a majority would have rejected the composite finding C if voted on directly (the case you had). Some members might see this as overly rigid or unfair in specific cases.
          *   **"Black Box" on Severity:** It doesn't allow the committee to signal degrees of severity or specific concerns about the *consequence* (violation finding) separate from the facts.

  **Recommendation for Your Committee:**

  1.  **Explain the Dilemma:** Start by clearly explaining the discursive dilemma using a simple example (like the judges) to show why your previous procedure led to confusion. This establishes the *problem* you need to solve.
  2.  **Present the Core Alternatives Clearly:**
      *   **Option 1 (Premise-Based):** Vote *only* on the two conditions (A & B). If both pass by majority, violation is automatic. *Gains:* Consistency, Speed, Focus on Facts. *Losses:* No discretion on the composite finding, might convict when some feel it's too harsh.
      *   **Option 2 (Your Double-Majority):** Vote on A, B, *and* C. Violation *only* if A, B, *and* C *each* get a majority Yes. *Gains:* Consistency, Allows expression of reservations about the finding itself. *Losses:* Might acquit when A&B are true but C fails, potentially seen as lenient; slightly more complex voting.
      *   **(Option 3 - Conclusion-Based):** Vote *only* on C ("Violation? Yes/No"). *Gains:* Simple, focuses on the bottom line. *Losses:* Ignores the reasons *why* (premises A & B could be inconsistent), provides less guidance/transparency. (Likely less suitable for an integrity committee needing clear reasoning).
  3.  **Recommendation:** **Adopt the Premise-Based Procedure (Option 1).** This is the cleanest escape from the dilemma:
      *   It guarantees logical consistency.
      *   It directly implements the two-part rule as written: violation requires A AND B.
      *   It focuses the committee's debate squarely on the factual determinations (Was it not their own? Was there no valid excuse?). Any concerns about fairness, proportionality, or mitigating factors *must* be addressed within the scope of defining and evaluating A and B (e.g., refining the definition of "valid excuse").
      *   It avoids the potential frustration of the double-majority system where A and B pass but C fails, which might feel like an override of the rule.
      *   It's procedurally simple and fast.
  4.  **Address the Loss (Discretion):** Acknowledge the loss of discretion on the composite finding. Argue that the rule *is* "A AND B imply Violation." If A and B are met, the violation *should* be found. If committee members frequently feel that A and B being true doesn't *deserve* a violation finding, that suggests the *definitions* of A or B, or the *sanction* associated with a violation, need review, not the voting procedure. The committee's role is to apply the rule based on findings of fact (A and B), not to re-adjudicate the rule's merit in each case. Save broader discussions about rule changes for policy review, not individual case adjudication.

  By adopting the premise-based procedure, you resolve the logical inconsistency, streamline your process, and stay true to the structure of your rule, while channeling substantive concerns about fairness back into the definitions of the premises or the broader sanctioning policy.
