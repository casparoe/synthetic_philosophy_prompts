  We are drafting a joint statement from two parties: the Realist and the Looping Constructivist, on the philosophy of psychiatric classification. We use the hypothetical case of "persistent derealization syndrome associated with immersive virtual environments" (PDS-IVE) to illustrate points.

  The document has four parts:
  1. Agreed Claims (numbered section)
  2. Disagreements Table
  3. Cruxes Table
  4. Closing Recommendations

  We must define technical terms and avoid scholarly citations. The document is formal and in American English.

  ---

  **Joint Statement on Psychiatric Classification: Realist and Looping Constructivist Perspectives**

  **Introduction**

  This document represents a consensus statement between two perspectives in the philosophy of psychiatric classification: the Realist and the Looping Constructivist. We address the nature of psychiatric categories and the process of diagnostic revision, using the hypothetical case of *persistent derealization syndrome associated with immersive virtual environments* (PDS-IVE) as a test bed. PDS-IVE is proposed as a disorder characterized by distressing and persistent feelings of unreality (derealization) that patients attribute to prolonged use of immersive virtual reality headsets. It requires a minimum duration and significant impairment, with no known mechanism at the time of proposal. Two years after adoption, a candidate biomarker is announced (a pattern of reduced interoceptive accuracy and attenuated pupillary modulation), and there is a proposal to add this biomarker as a supporting criterion.

  We agree on core claims, acknowledge disagreements, identify cruxes for future resolution, and offer joint recommendations.

  **1. Agreed Claims**

  Both parties agree on the following substantive claims, which represent genuine concessions from each perspective:

  1.1 **Mental suffering is real and often severe, but its expression is shaped by context.** The Realist concedes that even when a disorder has a clear biological mechanism, the way individuals experience and report symptoms can be influenced by cultural, social, and personal factors. The Constructivist concedes that the reality of suffering is not negated by the fact that it is expressed through culturally available concepts.

  1.2 **Psychiatric classification has practical consequences beyond mere description.** Both parties agree that diagnostic labels affect individuals' self-understanding, access to resources, social responses, and treatment options. The Realist grants that these effects can alter the presentation of the disorder (first-order looping) and may lead to revisions of the diagnostic criteria (second-order looping). The Constructivist grants that these consequences do not imply that the underlying distress is imaginary or that the disorder is entirely socially constructed.

  1.3 **Looping effects are a fact of psychiatric practice, but their magnitude varies.** Both parties accept that:
     - *First-order looping* occurs: individuals change their behavior, experience, and self-concept upon receiving a diagnosis.
     - *Second-order looping* occurs: the diagnostic criteria and the population meeting those criteria co-evolve over time, creating a feedback loop (a "ratchet").
     - Categories differ in their *loop-resistance* vs. *loop-amplification*. Categories tied to identifiable peripheral pathology (e.g., neurosyphilis) are more loop-resistant, while categories defined by subjective reports of distress and social impairment (e.g., many functional somatic syndromes) are more loop-amplifying. PDS-IVE, being defined by subjective experience and an environmental trigger without a known mechanism, is initially in the loop-amplifying category.

  1.4 **The search for mechanisms is valuable but does not guarantee stability.** The Realist concedes that discovering a mechanism (e.g., the candidate biomarker for PDS-IVE) does not necessarily halt looping effects; it may instead create new pathways for looping (e.g., by altering self-conception, treatment development, or research funding). The Constructivist concedes that mechanistic understanding can, in some cases, stabilize a category and improve its predictive validity (e.g., by identifying a homogeneous subgroup).

  1.5 **Current psychiatric manuals are provisional and should be improved.** Both parties agree that the DSM/ICD process is a pragmatic compromise and that categories should be revised to improve clinical utility. They agree that utility includes supporting induction (predicting outcomes), explanation (integrating with scientific knowledge), and intervention (guiding effective treatment). However, they differ on what counts as improvement (see disagreements).

  1.6 **In the case of PDS-IVE, the initial adoption without a known mechanism was justifiable.** The Realist concedes that waiting for a mechanism might leave suffering unaddressed. The Constructivist concedes that the category's environmental trigger (headset use) provides a starting point for investigation. Both agree that the category should be adopted provisionally, with a plan for re-evaluation.

  **2. Disagreements Table**

  We now outline key disagreements. Each row states the issue, the Realist's formulation, the Constructivist's formulation, and a verdict on whether the disagreement is genuine or verbal. Where verbal, we specify the contested term and each party's meaning.

  | Issue | Realist Formulation | Constructivist Formulation | Verdict |
  |-------|---------------------|----------------------------|---------|
  | **The primary goal of classification** | "Psychiatric categories should aim to carve nature at its joints, aligning with underlying dysfunctions that exist independently of our practices." | "Psychiatric categories should aim to serve clinical and social functions, recognizing that the 'joints' are partly shaped by our practices." | **Genuine, but partially normative.** The Realist prioritizes truth (correspondence to independent reality), while the Constructivist prioritizes utility (beneficial outcomes). |
  | **The meaning of 'validity'** | "A category is valid if it corresponds to a real dysfunction in the individual, ideally identifiable by a mechanism." | "A category is valid if it is clinically useful, which includes being reliable, predictive, and therapeutically actionable, even if its boundaries shift due to looping." | **Verbal.** Contested term: "validity." Realist: correspondence to a mind-independent dysfunction. Constructivist: practical success in clinical and research contexts. |
  | **The status of the biomarker in PDS-IVE** | "The candidate biomarker for PDS-IVE should be incorporated as a supporting criterion because it reflects an underlying mechanism, moving the category closer to a natural kind." | "The biomarker should not be incorporated until we understand how its announcement and use might alter the presentation and prevalence of PDS-IVE, given looping effects." | **Genuine and empirical.** The Realist sees the biomarker as a stabilizing discovery; the Constructivist sees it as a potential new loop-amplifier. |
  | **Whether looping undermines realism** | "Looping effects are noise that obscures the signal of the underlying dysfunction; good science will reduce their impact." | "Looping effects are part of the signal; they are constitutive of psychiatric phenomena and cannot be eliminated without changing the subject." | **Genuine and conceptual.** Contested term: "the disorder." Realist: the disorder is the underlying dysfunction. Constructivist: the disorder is the looping process itself. |
  | **The relationship between utility and reality** | "Clinical utility is evidence of validity because a category that carves nature at its joints will support better predictions and interventions." | "Clinical utility can be achieved independently of correspondence to a pre-existing dysfunction, because looping can create self-validating patterns." | **Genuine, with empirical cruxes.** (See Cruxes Table.) |

  **3. Cruxes Table**

  We identify key cruxes: questions that, if resolved, would move at least one party to change their position. For each, we specify a test, each party's prediction, and what would count as a defeat. We label each as empirical (E), conceptual (C), or normative (N).

  | Crux | Type | Test/Case/Argument | Realist Prediction | Constructivist Prediction | What Counts as Defeat |
  |------|------|---------------------|---------------------|----------------------------|------------------------|
  | **Does adding a biomarker halt or amplify looping?** | E | In PDS-IVE, after adding the biomarker, track over 5 years: (a) prevalence, (b) variation in symptom presentation, (c) stability of the biomarker in diagnosed patients. | Prediction: Prevalence stabilizes; symptom presentation becomes more homogeneous; biomarker remains stable. Adding the biomarker reduces looping by anchoring the category to a biological reality. | Prediction: Prevalence increases (due to increased screening and awareness); symptom presentation shifts toward the biomarker (e.g., patients report more interoceptive issues); biomarker may show drift as new patients are included. Adding the biomarker amplifies looping by changing self-reports and clinician focus. | Realist defeat: Prevalence increases and symptom presentation shifts away from the original profile. Constructivist defeat: Prevalence stabilizes and symptom profile remains constant. |
  | **Can looping create utility without an underlying dysfunction?** | E | Compare two categories: (i) a disorder with known mechanism (e.g., Huntington's) and (ii) a highly loop-amplifying category (e.g., chronic fatigue syndrome). Measure predictive validity (same outcome predictions over time) and treatment specificity (does targeting the category lead to better outcomes than targeting symptoms?). | Prediction: Categories with mechanisms show higher and more stable predictive validity and treatment specificity. Utility without mechanism is unstable and context-dependent. | Prediction: Some loop-amplifying categories achieve stable utility (e.g., by organizing effective patient advocacy and research). Utility can be self-sustaining. | Realist defeat: A loop-amplifying category achieves utility equal to a mechanism-based category. Constructivist defeat: Mechanism-based categories consistently show superior utility. |
  | **What happens when a category is used administratively without patient disclosure?** | E | Natural experiment: In a health system where PDS-IVE is coded for billing but not disclosed to patients, compare over time with a system that routinely discloses. Track: (a) prevalence, (b) symptom stability in individuals, (c) chronicity. | Prediction: Without disclosure, looping is reduced: prevalence remains stable, symptoms less influenced by diagnostic label, chronicity unaffected or reduced. | Prediction: Disclosure status has little effect; looping occurs through clinician behavior and societal responses even without patient awareness. | Realist defeat: Prevalence and symptom shifts occur without disclosure. Constructivist defeat: Non-disclosure halts looping effects. |
  | **Does mechanism-based definition halt the ratchet?** | E/C | Historical case: When a biomarker was added to a disorder (e.g., the incorporation of CSF findings in Alzheimer's), did looping effects (criteria shifts, prevalence changes) stop? | Prediction: Yes, the category stabilized. | Prediction: No, the criteria continued to evolve (e.g., broadening to include biomarker-negative cases). | Realist defeat: Criteria and prevalence continued to shift post-biomarker. Constructivist defeat: Category stabilized with no significant shifts. |
  | **Is truth or utility the proper goal?** | N | Argument: If a category with no known mechanism but high utility (e.g., early DSM-III categories) is later found to be heterogeneous and not corresponding to a single dysfunction, was it nevertheless valid at the time? | Realist: No, it was never valid; utility was incidental. | Constructivist: Yes, validity is utility-relative; it was valid for its time. | *Normative crux; no empirical test. Defeat requires persuasion.* |

  *Note: Some tests (e.g., 5-year tracking of PDS-IVE) are feasible; others (e.g., historical comparisons) are subject to confounding factors.*

  **4. Closing Recommendations**

  Regarding the specific proposal for PDS-IVE:

  - **Realist Position:** Adopt PDS-IVE provisionally. Upon discovery of the biomarker, incorporate it as a supporting criterion to improve validity. This moves the category toward a more stable, mechanism-based definition.
  - **Constructivist Position:** Adopt PDS-IVE provisionally, but do not incorporate the biomarker immediately. First, study how its announcement affects patient experience, clinician diagnosis, and research priorities. Revise criteria only after understanding these effects.

  **Joint Procedural Recommendations:**

  Both parties support:
  - **Provisional adoption of new categories** with a mandatory sunset review after 5-10 years, requiring evidence of utility (broadly construed) for retention.
  - **Transparent documentation** of looping effects in criteria revisions, including how first- and second-order looping might have influenced changes.
  - **Field trials for PDS-IVE** that explicitly track looping effects (e.g., patient self-reports before and after diagnosis, changes in clinician recognition).
  - **Caution with biomarkers:** Before incorporating any biomarker, require evidence not only of its sensitivity and specificity but also of its impact on the diagnostic process and patient experience.

  **Conclusion**

  We, the undersigned Realist and Looping Constructivist, affirm that psychiatric classification is a dynamic process that must balance scientific aspirations with pragmatic and ethical responsibilities. Our agreement on core claims and joint recommendations for procedural safeguards demonstrates that productive collaboration is possible. We commit to resolving our remaining disagreements through continued dialogue and empirical investigation.

  ---
  **Signatures:**

  [Realist Representative]
  [Looping Constructivist Representative]

  ---
