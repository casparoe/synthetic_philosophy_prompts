answer: |-
  **1. Question:** What standard of evidence should apply to cliodynamics' core conditional structural claims (e.g., "given sufficient elite overproduction and state weakness, instability follows within ~X decades") given its thin, interconnected historical sample, the "out-of-regime" modern context, and the reflexive potential where audiences act on the forecasts?  

  **2. Why it is open:** Current debate fixates on binary "prediction success/failure," obscuring how modelers primarily offer ordinal/phase diagnoses or conditional structural claims, while humanist critics rightly demand impossible precision or independence; neither adequately addresses evidence standards for conditional claims under limited data and reflexivity.  

  **3. Method:**  
  *   **Months 1-3:** Independently replicate the quantitative fit of one key secular cycle case study (e.g., pre-revolutionary England) using original sources and model specifications.  
  *   **Months 4-6:** Construct and pre-register a public, trackable "scorecard" defining specific, measurable indicators for current conditional structural claims (e.g., elite competition metrics, fiscal strain thresholds) and their predicted instability outcomes within defined timeframes.  
  *   **Months 7-9:** Conduct structured interviews with leading modelers and critics, focusing on their assessment of evidence standards for conditional claims in light of replication findings, the scorecard's structure, and reflexivity concerns.  

  **4. Deliverable:** A book manuscript for intellectually curious general readers and policy-adjacent professionals, translating the evidence standard debate into clear frameworks (the three prediction grades) and using the replication, live scorecard, and interviews to show why conditional claims require distinct, context-aware evaluation.  

  **5. Failure conditions and scope:** Failure occurs if replication proves technically infeasible or yields no insight, or if interviewees universally dismiss the core framing. Scope most likely exceeds nine months by chasing additional historical case replications or over-elaborating the scorecard's indicator set.
