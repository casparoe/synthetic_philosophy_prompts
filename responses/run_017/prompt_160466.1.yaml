answer: |-
  Based on your supervisor's documented rulings and the philosophical context, I reconstruct three candidate rules that fit her prior verdicts equally well. I then apply them to your three cases, identify the genuinely diagnostic case, and specify what would resolve the ambiguity. Crucially, **the candidate rules disagree on your first case (G-star)**, making it diagnostic, while the others are resolvable under all rules or non-diagnostic. Your supervisor's "whose language" comment strongly points toward Rule A as her likely position.

  ### Reconstructed Candidate Rules
  1. **Rule A (Community-Relative Entrenchment)**:  
     A predicate is projectible iff it has been *successfully projected as a basic term* within a linguistic community for a "significant" period (where "significant" is calibrated to exceed Goodmanian pathological cases like grue). Entrenchment is a property of a predicate *relative to a community's linguistic practice*, not the predicate in isolation. Definitions "do the work" if they are used to construct artificial predicates detached from lived practice.  

  2. **Rule B (Objective Entrenchment + Natural Kind Alignment)**:  
     A predicate is projectible iff (i) it has a history of successful projections exceeding a threshold (e.g., >>12 instances), *and* (ii) it corresponds to a causally stable natural kind/property (actual or presumed). Definitions "do the work" if they introduce disjunctive or gerrymandered properties not carveable at nature's joints.  

  3. **Rule C (Definitional Transparency)**:  
     A predicate is projectible iff it can be used *without reliance on its definition* in projections (i.e., it is treated as primitive or "transparently" reduced to fundamental categories like mass/spatiotemporal location). Definitions "do the work" if users must consciously appeal to the definition to justify projections.  

  All three rules fit the supervisor's past verdicts:  
  - **Green/blue**: Projectible under all rules (entrenched, natural, transparent).  
  - **Grue (cutoff future)**: Not projectible. Rule A: insufficient community entrenchment. Rule B: unnatural disjunction. Rule C: definition (time-dependent disjunction) is "doing the work."  
  - **Grue (cutoff past)**: "Puzzle never starts" because past cutoff makes it non-disjunctive *for current users* (Rules B/C) or irrelevant to community practice (Rule A).  
  - **Greavy/Greast**: Not projectible. Rule A: no community treats them as basic. Rule B: unnatural disjunctions. Rule C: definition (weight/location disjunction) is "doing the work."  
  - **Inheritance clause**: "Definition not doing the work" resolves as: (A) if the defined predicate becomes entrenched in practice; (B) if the definition maps to a natural kind; (C) if users project without invoking the definition.  

  ---

  ### Predictions for Your Cases
  | Case                     | Rule A Prediction                                     | Rule B Prediction                                      | Rule C Prediction                                     |
  |--------------------------|-------------------------------------------------------|--------------------------------------------------------|-------------------------------------------------------|
  | **1. G-star community**  | **YES** (projectible). Predicts >1g emerald is G-star (blue). | **NO** (not projectible). Greavy is unnatural; predicts nothing or inconsistency. | **NO** (not projectible). Definition (weight disjunction) is "doing the work" for projections. |
  | **2. New natural kind**  | **NO** (but borderline). 12 projections << "significant" history. | **YES** (projectible). Natural kind + some history suffices. | **YES** (projectible). Ostensive definition implies transparency; no disjunctive "work." |
  | **3. Phlogiston (1780)** | **YES** (projectible). Entrenched in 18th-century chemistry. | **NO** (not projectible). Fails natural kind requirement. | **YES** (projectible). Chemists projected it as primitive; definition not "doing the work." |

  ---

  ### Analysis
  1. **Diagnostic Case**:  
     - **Case 1 (G-star)** is genuinely diagnostic. It cleanly separates Rule A from Rules B/C:  
       - Rule A mandates projectibility due to community entrenchment.  
       - Rules B/C reject it due to unnaturalness/definitional reliance.  
     - Your supervisor's "whose language" comment **strongly implies Rule A**. She treats entrenchment as practice-relative, not language-internal. If she rules G-star projectible, Rule A is confirmed; if not, Rule B/C holds.  

  2. **Non-Diagnostic Cases**:  
     - **Case 2 (New kind)**: Resolvable under all rules with minor tweaks. Rule A rejects it due to insufficient history (12 < "significant"), but if you stipulated 50 projections, Rule A would align with B/C. Non-diagnostic.  
     - **Case 3 (Phlogiston)**: Rules A/C agree (projectible in 1780), Rule B dissents. Since your supervisor likely prioritizes practice over metaphysics (given her greavy/greast remarks), she would probably follow A/C. Non-diagnostic for separating rules.  

  3. **Where Freedom Remains**:  
     - The **inheritance clause** ("definition not doing the work") is ambiguous. Rule A interprets it as *practice-driven entrenchment*; Rule B as *natural kind reduction*; Rule C as *psychological primacy*.  
     - **Thresholds** (e.g., "significant" projections) are undefined in past rulings, leaving flexibility.  

  ---

  ### The Key Test and Best-Guess Rule
  - **Diagnostic Verdict Needed**: Your supervisor's ruling on **Case 1 (G-star)**. If she says:  
    - *Projectible* → Confirms **Rule A** (Community-Relative Entrenchment).  
    - *Not projectible* → Confirms **Rule B** (Objective Entrenchment + Naturalness) or **Rule C** (Definitional Transparency).  
  - **Best-Guess Rule**: **Rule A (Community-Relative Entrenchment)** is the strongest candidate. Reasons:  
    1. Her "whose language" comment directly addresses linguistic practice, not metaphysics.  
    2. Her greavy/greast verdicts focused on their artificiality *as used*, not intrinsic properties.  
    3. She dismissed past-cutoff grue as "not in the running," implying projectibility is context-bound.  
    4. Inheritance is likely tied to entrenchment (e.g., "temperature" inherits from "heat" via community use).  

  - **Further Case to Separate Rules B/C**: If needed, test:  
    > *"Slenk" defined as "green if found on a Monday, blue otherwise." A fringe cult projects it 10,000 times, always on Mondays, successfully. Is "All emeralds are slenk" projectible for them?*  
    - Rule A: YES (entrenched in cult practice).  
    - Rule B: NO (unnatural disjunction).  
    - Rule C: NO (definition "does the work" via day-dependence).  

  ---

  ### Conclusion
  **The candidate rules are distinguishable and disagree on Case 1.** Your supervisor's past rulings and comments suggest she endorses **Rule A (Community-Relative Entrenchment)**, making projectibility dependent on a predicate's role in a community's linguistic practice. For your chapter:  
  - **Predict her verdicts**: Case 1: YES (projectible); Case 2: NO (or "not yet"); Case 3: YES (projectible in 1780).  
  - **Diagnostic leverage**: Emphasize Case 1. If she rejects G-star's projectibility, your reconstruction must shift to Rule B/C.  
  - **Philosophical implication**: Her view implies grue is pathological *only because* no community naturally entrenched it—solving the riddle sociolinguistically.  

  This fits your observation that her view is "rulings-based," but Rule A provides a coherent criterion: **Projectibility emerges from communal projection practices, not predicates' formal features.** If she *denies* G-star's projectibility, the chapter's "no general criterion" conclusion holds—but her comments point clearly toward Rule A. Test Case 1 explicitly to force clarity.
