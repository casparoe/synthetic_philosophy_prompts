    - They might be altruistic.
  - The belief elicitation might show that some players expect their partner to pass, and they pass to allow the pot to grow, but then the partner takes at the next node.
  - In the random-length game, some players might take early anyway because they are risk-averse.

  What the activity can't show:

  - It can't distinguish between "my partner isn't an expected-utility maximizer" and "my partner is just nice". In fact, the passing in the fixed-length game might be due to altruism, or to a different form of rationality (e.g., reciprocity) that is not captured by the standard model.
  - The activity also doesn't prove that the backward induction argument is wrong. It just shows that in practice, with a fixed end, people often take early, but not always. And with a random end, they are more likely to pass.

  Additional point: The backward induction argument relies on common knowledge of rationality. If there is any doubt that the other player is not rational (or not self-interested), then passing might be rational.

  Finally, we will provide the payoff numbers for the fixed game:

  - Node 1: take -> (8,2); pass -> move to node2
  - Node 2: take -> (4,16) [because at node2, the taker gets 16, the other gets 4]; but wait, the other player is the one who gets 4. So if Player A passes at node1, then at node2 Player B takes, then Player A gets 4 and Player B gets 16.

  Similarly, for the random game, the payoffs are variable.

  We'll now write out the exact instructions to read.
answer: |-
  ### Classroom Activity: Centipede Game Experience  
  **Objective:** Students experience the backward induction paradox firsthand without prior formal exposure. The debrief will highlight how the paradox relies on a commonly known last node and iterated beliefs about rationality, not greed or distrust.  

  ---

  ### Game Setup  
  - **Students:** 16 (paired into 8 groups of 2).  
  - **Time Allocation:**  
    - Fixed-length game: 15 minutes  
    - Random-length game: 15 minutes  
    - Debrief: 30 minutes  
  - **Materials:**  
    - Instruction sheets for each pair (one for Player A, one for Player B).  
    - Private prediction slips (collected before each decision).  
    - A die and screen (for random-length game).  
    - Points converted to candy or trivial prizes (e.g., 10 points = 1 piece of candy).  

  ---

  ### Fixed-Length Game Instructions (6 Nodes, No Randomness)  
  **Read Aloud to Class:**  
  “You’ll play in pairs. One of you is Player A, the other Player B. The game has 6 decision points (nodes). Player A starts at Node 1. The pot starts at 10 points. At your turn, you choose:  
  - **TAKE:** You get 80% of the pot; your partner gets 20%. Game ends.  
  - **PASS:** Pot grows by 10 points. Turn passes to your partner.  

  **Crucial rule at Node 6:** If you PASS at Node 6, the pot vanishes—both get 0 points.  

  **Payoffs at each node if you TAKE:**  
  - Node 1: Taker gets 8, other gets 2  
  - Node 2: Taker gets 16, other gets 4  
  - Node 3: Taker gets 24, other gets 6  
  - Node 4: Taker gets 32, other gets 8  
  - Node 5: Taker gets 40, other gets 10  
  - Node 6: Taker gets 48, other gets 12  

  **Before each decision, write on a slip:**  
  1. What you expect your partner to do at the next node if you PASS (TAKE or PASS).  
  2. What you think your partner expects you to do now (TAKE or PASS).  

  **Scoring predictions:** After the game, you get 1 bonus point per correct prediction (added to your game points). We won’t reveal predictions until the end. Points convert to [candy].”  

  ---

  ### Random-Length Game Instructions (Die Roll After Every Pass)  
  **Read Aloud to Class:**  
  “New pairs and roles! This time, after every PASS, I roll a die behind this screen. Rules:  
  - **TAKE:** Same as before (taker 80%, other 20%). Game ends.  
  - **PASS:** I roll the die.  
    - **If die = 6:** Game ends instantly. Current pot is split evenly (50/50).  
    - **If die ≠ 6:** Pot grows by 10 points. Turn passes to partner.  

  **Key differences:**  
  - There’s no fixed end node—the game could stop after any PASS.  
  - If the game runs very long (e.g., 20+ nodes), we’ll stop it and both get 0 (but this is rare).  
  - Pot starts at 10 and grows identically to the first game.  

  **Predictions (same as before):**  
  Before each decision, write:  
  1. If you PASS and the die doesn’t end the game, what you expect your partner will do next (TAKE or PASS).  
  2. What you think your partner expects you to do now (TAKE or PASS).  

  **Scoring:** 1 bonus point per correct prediction. Play this version twice with the same partner.”  

  ---

  ### Predicted Outcomes & Sting  
  - **Fixed-length game “sting”:**  
    - Backward induction predicts TAKE at Node 1 (8 > 4, the expected payoff if passing).  
    - Most pairs will TAKE early (Node 1–3). Students who PASS expecting cooperation often get “burned” when their partner TAKES later (e.g., Player A PASSES at Node 1 hoping for a bigger pot, but Player B TAKES at Node 2, leaving A with only 4 vs. the 8 they could’ve had).  
    - **Payoff pain:** Passing risks losing up to 44 points (e.g., passing to Node 6 then getting 0 vs. taking early).  

  - **Random-length game contrast:**  
    - More students PASS early (Node 1–3) since the die roll breaks certainty.  
    - No clear “sting”—passing is less risky due to the 1/6 chance of an early equal split.  

  ---

  ### Debrief Script  
  **Start (after games):**  
  “Look at the fixed-length game first. How many pairs had a TAKE at Node 1? [Raise hands] Why did you take?”  

  #### Step 1: Map Fixed-Game Outcomes to Backward Induction  
  - **Draw the game tree on the board (6 nodes, payoffs labeled).**  
  - **Ask:** “At Node 6, what happens if you PASS?” → Both get 0. “So if you’re rational, you’d...?” → TAKE (get 48).  
  - **Now Node 5:** “If you PASS, what happens?” → Partner TAKES at Node 6, you get 12. “But if you TAKE now, you get 40. 40 > 12, so...?” → TAKE.  
  - **Node 4:** “PASS means partner TAKES at Node 5, you get 10. TAKE gives you 32. 32 > 10 → TAKE.”  
  - **Continue to Node 1:** “TAKE gives 8. PASS means partner TAKES at Node 2, you get 4. 8 > 4 → TAKE.”  
  - **Key insight:** “The unravelling begins at the **last node** (Node 6). Because it’s commonly known:  
    - Everyone knows Node 6 is the end.  
    - Everyone knows a rational player takes at Node 6.  
    - So everyone knows Node 5’s player takes... and so on back to Node 1.”  

  #### Step 2: Contrast with Predictions  
  - **Ask:** “In the fixed game, did anyone expect their partner to PASS later? What actually happened?”  
    - Most predictions will show: Players expected partners to PASS (e.g., “I thought they’d let the pot grow”). But in practice, partners TOOK early.  
  - **Highlight:** “The gap between predictions and outcomes isn’t about distrust—it’s about **iterated rationality**. Even if you trust your partner, backward induction forces TAKE because they’ll fear you won’t trust them later.”  

  #### Step 3: Analyze Random-Length Game  
  - **Ask:** “How many passed early in the die version? Why?”  
  - **Contrast:** “Here, unravelling has **nowhere to begin**. Why?  
    - No commonly known last node (the die could end it anytime).  
    - At Node 1, if you PASS, there’s a 1/6 chance you both get 5 points now. Even if it continues, your partner might PASS too (since they face the same uncertainty).  
    - Backward induction fails because you can’t start from a fixed endpoint.”  
  - **Core lesson:** “The force of the paradox comes from **common knowledge of the last node + iterated rationality**—not greed or distrust. Break that knowledge (like with the die), and cooperation can emerge.”  

  #### What the Activity Can’t Show (Be Frank)  
  - **Limitation 1:** It can’t distinguish “my partner isn’t rational” from “my partner is nice.” If students PASS, it could be altruism OR a different rationality (e.g., reciprocity).  
  - **Limitation 2:** It doesn’t prove backward induction is “wrong”—it shows real people deviate under uncertainty, but the logic holds under ideal conditions.  
  - **Predictable hiccups:**  
    - Fixed game: Some pairs PASS to Node 4+ (due to altruism or misjudgment). Use this! Ask: “Why did you pass? Did backward induction fail here?”  
    - Predictions may be noisy (e.g., students guess randomly). Stress the gap between expected and actual behavior.  
    - Random game: A few may still TAKE early (risk aversion). Note: This mirrors real life—some people can’t handle uncertainty.  

  **Closing:** “Backward induction is powerful when the end is certain. But in life? Uncertainty changes everything.”  

  ---

  ### Why This Works  
  - **Experiential learning:** Students *feel* the paradox (taking early feels unsatisfying; the die version feels freer).  
  - **Debrief links moments to theory:** Node 1 takes → unravelling start; prediction gaps → iterated beliefs; die version → broken common knowledge.  
  - **Clarity on rationality:** Emphasizes that the paradox is structural, not moral (“greedy” takes are compelled by logic).  

  **Final Tip:** Keep energy high—call out “Sting!” when early takers “burn” passers. Use the board relentlessly during debrief.
