prompt: |-
  I'm in a reading group — a play every couple of months, mostly people from my old uni philosophy cohort plus a couple of physicists and me (I've been reading LessWrong and ACX for years but I did exactly one module on formal epistemology and mostly slept though it) — and I volunteered to do the philosphy bit at the end of our Stoppard session. We're doing Rosencrantz and Guildenstern Are Dead, and the bit I can't stop thinking about is the opening: Rosencrantz keeps calling heads and winning, ninety-two flips in a row or thereabouts, while Guildenstern reasons his way around it — the flips are independent, the past can't reach the next one, a run like this is just what happens sometimes — and then slowly comes apart and starts speculating that they're in the grip of something that isn't natural forces at all. I want to read that scene (and the recurring bits where the two of them sense that reality is thinner or more scripted than it should be) against Lewis's Principal Principle: the thought, from his 1980 paper I think, that your credence in an outcome given the objective chance of it plus your admissible evidence should just equal the chance. My rough take, which I want pushed on: Guildenstern is actually reasoning fine by Bayesian lights — a streak that long is overwhelming evidence that the setup isn't fair, and he duly drifts toward suspicion — but the play has rigged things so that the true hypothesis isn't on his menu. It isn't a biased coin, or a fluke, or a message from a god; it's that he's a character in a play and the flip was always going to come up heads, so there is no chance for him to defer to. Call it the authorial hypothesis: not a chance hypothesis, not reducible to one, and yet exactly the sort of thing that makes "defer to the chance" the wrong instruction. So is the play a counterexample to the Principal Principle, or a case it was simply never meant to cover — and if the latter, is that itself a complaint?

  Two things I'd especially like you to chew on, neither of which I've seen discussed anywhere. First, whether Lewis's admissibility clause can be stretched to cover an authorial hypothesis at all, or whether the principle quietly presupposes an unauthored world and so has nothing to say the moment a script is in play — and if it does have nothing to say, whether that's a bug in the principle or just a limit on its ambitions. Second, the audience's standpoint: we watching already know the coin comes up heads, and from outside the fiction the outcome is settled, so at the god's-eye view there arguably is no chance there, only a fixed script. Does that external determinacy put any pressure on Guildenstern's credences, or is the norm indexed to his evidence in a way that makes what we know simply irrelevant to what he should believe? I also half-remember something from that module about chance hypotheses being self-undermining — outcomes feeding back to make you doubt the very chance hypothesis you started from — and it feels like Stoppard has backed into exactly that, but I can't reconstruct the argument and don't trust my memory of it, so please rebuild it if it's real and say so if I've garbled it. What I want is the reading: what the play gets right about deference to chance, where it dramatises something the literature misses, where it's trading on a confusion between "unlikely" and "uncaused" (or whatever the actual confusion is), which scenes you'd point the group at, and an honest verdict on whether the whole exercise is a stretch. Be explicit about confidence as you go, and at the end single out the one claim you're least sure of — including any detail of the play you're reconstructing from memory and might have wrong.
