prompt: |-
  I'm the copy editor for a small interdisciplinary journal — I volunteered, nobody else wanted the job — and I've just been handed a special issue on autonomous systems where the word "man" keeps coming up. We have a house style guide with a non-sexist-language section and a stack of minutes from the committee that maintains it, and I'd rather apply our own precedents than my politics. The trouble is that once I laid the minutes out side by side, I realised they fit more than one rule equally well, and the case actually in front of me seems to sit right where those rules come apart. So: predict what this committee would say, or rather tell me what it should say if it wants to be consistent with itself.

  The precedents, as recorded in the minutes: "chairman" to "chair", replace; "manpower" to "workforce", replace, with a note saying explicitly not "personpower"; "man-hours" to "person-hours", replace, and here a literal "person-" compound is fine; "middleman" to "intermediary", replace; generic "he" for an indefinite researcher to singular "they", replace; "mankind" to "humankind", replace; "guys" when addressing a mixed audience to "everyone", replace (so the rule clearly isn't about the letters m-a-n occurring); "manhole", keep, minute says fixed engineering and legal term, no male is pictured; "human", "humane", "manic", "manifest", keep, minute says "man" isn't a morpheme there; "woman", keep, with "woperson" and "womyn" rejected outright; "man cave", keep, minute says male-specific on purpose and none of our business; "man the phones" to "staff the phones", replace.

  The new case: the survey manuscript keeps saying "man-in-the-middle (MITM) attack", and I have to rule on it. Three things make it unlike the earlier ones. First, the acronym is what people actually cite and search, and MITM survives unchanged whether the expanded form is "man-", "machine-", or "adversary-in-the-middle", so the usual stability argument for leaving technical terms alone costs almost nothing here — unless you think the expanded form in running prose is what does the damage. Second, there are ready-made neutral alternatives that are arguably more accurate, since the thing in the middle is a hostile machine and not a guy in a hoodie, and the authors tell me some people in their field already write "machine-in-the-middle" or "adversary-in-the-middle". Third — and this is what I got stuck on when I was arguing with my housemate, who does feminist linguistics and said something about markedness that I only half followed — there is no such thing as a "woman-in-the-middle", which on the markedness story suggests "man" is doing generic-human work here, but that is equally true of "manhole", which we left alone.

  What I want from you: the two or three candidate rules that fit that whole track record — I can think of a "would a reader picture a man" imagery rule, a "don't touch established terms of art" rule, and something like the old Hofstadter-style parody procedure where you mechanically swap in "person" and ask whether the absurdity you get is the revealing kind or just silliness — what each of them predicts about "man-in-the-middle", and your best guess with the reason for preferring it. Say which precedent is genuinely the closest analog, "middleman" or "manhole", and why. If you think our precedents really don't settle it, say plainly what principle we'd be committing ourselves to with each choice. And name one further case we could put in front of the committee that would tell the top two rules apart — I was going to suggest "manned spacecraft" vs "crewed spacecraft", but tell me if there's a cleaner one. Finish with one machine-readable line and nothing after it, in exactly this shape:

  \answer{verdict: KEEP | rule: <short name of the rule you're attributing to us> | discriminator: <short phrase naming the further case>}
reasoning: |-
  Okay, let me tackle this copy editor's dilemma step by step. The journal committee has a set of precedents for handling gendered language, and now they're stuck on "man-in-the-middle (MITM) attack" where the acronym MITM is fixed but the expanded form could be changed. 

  First, I need to map out the committee's existing rules from the minutes. There's a clear pattern: terms like "chairman" become "chair" because they evoke a male image, while "manhole" stays because it's a technical term without male imagery. The "man cave" exception shows they respect intentionally male-specific terms. For "man the phones," they replace it with "staff" since "man" here functions as a verb implying human agency. 

  Looking at the new case, three factors stand out: the MITM acronym is stable regardless of expansion; alternatives like "machine-in-the-middle" exist and might be more accurate; and unlike "woman-in-the-middle" doesn't exist, suggesting "man" is generic here—but that same logic applied to "manhole" which they kept. 

  Comparing precedents: "middleman" was changed to "intermediary" because it's a role anyone could fill, while "manhole" was kept as a fixed term. "Man-in-the-middle" feels closer to "middleman"—it's describing a functional role in cybersecurity, not a physical object. The committee's imagery test ("would you picture a man?") likely applies: in a MITM attack, you might imagine a human hacker, so replacing it aligns with changing "middleman." 

  For a discriminator case, "manned spacecraft" vs "crewed" would test their stance on technical terms where the alternative ("crewed") is already widely adopted. If they change it, that reinforces the "avoid generic 'man'" rule; if kept, it leans toward preserving established terminology. 

  Final verdict: replace "man-in-the-middle" with "machine-in-the-middle" or similar, following the "middleman" precedent. The rule is about avoiding generic masculine imagery in non-fixed roles. 

  \answer{verdict: REPLACE | rule: imagery/generic masculine avoidance | discriminator: manned vs crewed spacecraft}
