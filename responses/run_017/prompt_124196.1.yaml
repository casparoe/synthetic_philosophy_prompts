prompt: |-
  I am part of a small penal-reform reading group that meets after lectures, and last week we got stuck on the argument between Daniel Dennett and Gregg Caruso about just deserts and punishment. As I understand the dialectic, Dennett defends a compatibilist, forward-looking practice of holding people responsible, while Caruso argues from free-will scepticism that nobody has basic desert — nobody deserves to suffer or be censured simply in virtue of having wrongly chosen, apart from any deterrent, rehabilitative, or protective benefit — and that the state should therefore replace retributive punishment with something like a public-health-quarantine model, allowing incapacitation, treatment, and risk-reduction but not blame. I do not want another pro-and-con list; I want the specification that any adequate theory would have to meet if it were to serve as the normative backbone of a criminal code in a liberal democracy whose citizens disagree about free will. The purpose is practical: the theory must be good enough to tell a sentencing commission whether desert should be retained as a limiting principle on punishment, whether it should be replaced by the quarantine model, and, if some hybrid is needed, how to resolve cases where blameworthiness and dangerousness come apart. To make this concrete, suppose the commission is experimenting with a two-number sentence worksheet: judges must record a desert score reflecting how much blame the offender is judged to deserve for the offence, given their reasons-responsive capacities at the time and the harm actually caused, and a risk score reflecting an actuarial estimate of the probability of serious reoffending if nothing is done. The draft rule says the censuring element of the sentence may not exceed the desert score, but the duration of preventive supervision may not be shorter than the risk score requires. When the two scores diverge, the worksheet produces results that strike some of us as unfair or incoherent.

  Please write the desiderata: what any theory of punishment, or any account of just deserts, must deliver to be adequate for this purpose — the phenomena it must explain, the cases it must get right, and the distinctions it must respect — with the case or consideration behind each requirement. Use at least the following stress cases: the high-desert/low-risk elderly fraudster who is unlikely to offend again; the low-desert/high-risk offender whose dangerousness is largely the product of a neurological disorder or severe duress rather than a blameworthy choice; the successful killer versus the attempted killer where the only difference is luck; the offender whose high risk score is driven mainly by poverty, addiction, or postcode rather than by culpability; and the offender who repents and reforms before sentencing, so that desert and risk appear to move in opposite directions. For each desideratum, say whether it is non-negotiable for any theory adequate to this purpose or merely a preference of a camp — for example, a retributivist insistence on strict proportionality, a forward-looking insistence that every sanction be justified by expected harm reduction, or a quarantine model's refusal to censure — and flag any requirement you suspect is really a prejudice rather than a genuine desideratum. I am especially interested in the subset of desiderata that may be jointly unsatisfiable: if treating offenders as agents conflicts with a pure quarantine model, or if desert-as-a-side-constraint plus actuarial prevention cannot both be honoured in the moral-luck or social-determinist cases, locate the collision precisely and say which requirement would have to give. Tell me also which single desideratum, if accepted, would exclude the largest number of otherwise attractive theories.

  Please do not give me a bibliography, reading list, or citations; I am working offline and only need the substance. If it helps, you may end with a one-sentence verdict on each of three families of view — traditional retributivism, Dennett-style compatibilist and forward-looking accounts, and Caruso-style free-will-sceptical quarantine models — but no table, no extended comparison, and no citations; the criteria are the deliverable, not another survey. In your answer, separate what is settled among people who work on punishment theory and the free-will debate from what is genuinely contested, and do not present a contested view as the consensus: where you recommend relaxing or dropping a requirement, say whether that is a confident verdict or a conjecture, and flag any place where the answer depends on how persuasive one finds the sceptical argument about basic desert rather than on something every competent theorist accepts. Please write the response in British English.
reasoning: |-
  Hmm, the user is part of a penal-reform reading group grappling with the Dennett vs. Caruso debate on just deserts and punishment. They want a practical framework for sentencing commissions in liberal democracies where citizens disagree about free will. Specifically, they need desiderata for an adequate theory of punishment that can handle their two-score system (desert and risk), especially when the scores diverge.

  The user explicitly rejects pro/con lists or bibliographies. They want criteria that must be satisfied for any theory to function as the normative backbone of criminal law. The stress cases they listed (elderly fraudster, neurologically impaired offender, moral luck cases, socioeconomically driven risk, repentant offenders) are crucial test beds.

  The core tension is between backward-looking desert and forward-looking risk management. Dennett's compatibilism allows blame within determinism for forward-looking purposes, while Caruso's skepticism rejects basic desert entirely in favor of a quarantine model. The user's worksheet forces a collision: e.g., can you detain a low-desert/high-risk person indefinitely without censure? Or give a slap on the wrist to a high-desert/low-risk offender?

  Key philosophical pressure points:
  - Non-negotiable: Any theory must resolve *how blame relates to coercion* when desert/risk diverge. Pure quarantine models (Caruso) reject censure entirely; retributivism demands it proportionally. This is where theories fracture.
  - The deepest conflict arises in moral luck cases: if two equally culpable attempts result in death vs. survival, does desert differ? Retributivism says yes (harm matters); consequentialism says no (only intent/danger do). The worksheet's desert score must take a stand here.
  - Social determinism cases expose whether risk scores can override desert when disadvantage causes danger. This challenges liberal individualism.
  - Repentance cases test if reform affects desert (traditionally no) or only risk (yes). If desert is "sticky," the worksheet may mandate censure even when risk evaporates.

  The single most exclusionary desideratum is: **"Desert must be real and non-contingent on future outcomes."** This immediately disqualifies pure consequentialist and quarantine models, preserving only retributivist or compatibilist accounts that treat blame as intrinsically justified.

  For the stress cases:
  - **High-desert/low-risk elderly fraudster**: Retributivism insists on censure; quarantine models resist it. Any hybrid must explain why censure is warranted without preventive benefit.
  - **Low-desert/high-risk neurological case**: Desert constraints may forbid censure, but risk management demands incapacitation. Can quarantine model's "no-blame" detention satisfy liberal concerns about non-punitive coercion?
  - **Moral luck (successful vs. attempted killer)**: If desert scores differ, risk scores may not—creating sentencing asymmetry. Theories must justify or reject luck-based desert.
  - **Risk from poverty/postcode**: High risk scores here may pressure detention exceeding desert. Only theories valuing social justice would cap sentences below risk demands.
  - **Repentant offender**: If desert is fixed at offense time, but risk plummets, censure may feel excessive. Forward-looking accounts can adjust; retributivism cannot.

  The verdicts:
  - **Traditional retributivism**: Fails the risk-management cases by subordinating prevention to proportionality.
  - **Dennett-style accounts**: Best balance but struggle with moral luck (where harm outcome shouldn't affect desert) and may underplay structural injustice.
  - **Caruso-style models**: Solve skepticism but risk over-detention in low-desert/high-risk cases and feel "unjust" in high-desert/low-risk cases by refusing censure.

  The unresolved collision: **Liberal legitimacy requires treating citizens as reason-responsive agents, but if risk scores justify detention without desert, we implicitly treat them as objects.** Only retributivism fully honors agency; quarantine models explicitly reject it. Dennett tries to have both, but the worksheet's divergence cases expose the strain.
answer: |-
  ### Desiderata for a Punishment Theory in a Liberal Democracy  
  *(Aimed at guiding sentencing policy where citizens disagree on free will)*  

  1. **Resolution of Agency and Coercion**  
     - **Must explain**: How to justify state coercion (e.g., detention, censure) toward individuals, given disagreement about free will.  
     - **Case**: The low-desert/high-risk offender (e.g., severe neurological disorder). Desert constraints may forbid blame, but risk demands incapacitation.  
     - **Non-negotiable**: Yes. Any theory must reconcile agency recognition with preventive detention to avoid arbitrariness.  
     - **Collision**: Pure quarantine models (Caruso) reject agency, risking unjust detention; retributivism over-blames in low-culpability cases. **Trade-off**: If agency is non-negotiable, quarantine must incorporate agency-respecting procedures.  

  2. **Treatment of Moral Luck**  
     - **Must explain**: Whether outcomes (e.g., harm caused) affect desert when intent and capacity are identical.  
     - **Case**: Successful vs. attempted killer – same culpability, different harm. Desert scores may diverge; risk scores likely similar.  
     - **Non-negotiable**: No. Retributivists insist outcomes matter (desert higher for success); consequentialists and skeptics reject this, focusing on intent/danger.  
     - **Contested**: Core conflict. Accepting moral luck prioritizes proportionality; rejecting it aligns with risk management but may feel "unjust" to retributivists.  

  3. **Blame and Censure Without Retribution**  
     - **Must explain**: Whether censure (e.g., verbal condemnation, stigma) requires "basic desert" or can be forward-looking.  
     - **Case**: High-desert/low-risk elderly fraudster – deserves blame but poses no risk. Can censure be justified without retribution?  
     - **Non-negotiable**: Partially. Theories must clarify if censure is permissible absent preventive benefits.  
     - **Collision**: Quarantine models (Caruso) reject censure entirely; Dennett-style accounts use censure for deterrence/reform. **Trade-off**: If censure is deemed essential for social solidarity, quarantine models must relax their refusal.  

  4. **Risk Assessment and Social Justice**  
     - **Must explain**: How to handle risk scores driven by social factors (e.g., poverty, postcode) unrelated to culpability.  
     - **Case**: Offender with high risk score due to addiction/poverty but low desert score.  
     - **Non-negotiable**: Yes. A liberal theory must not punish for immutable circumstances. Risk-based detention must not compound injustice.  
     - **Distinction**: Preventive measures must be distinguishable from punishment and address root causes (e.g., treatment, not prison).  

  5. **Temporal Flexibility**  
     - **Must explain**: Whether desert or risk can change post-offense (e.g., due to repentance).  
     - **Case**: Offender reforms before sentencing – desert (backward-looking) may remain high, but risk plummets.  
     - **Non-negotiable**: No. Retributivists fix desert at offense time; forward-looking accounts adjust sanctions to current risk.  
     - **Prejudice?**: Insisting desert is immutable may reflect retributivist bias. A flexible approach better serves prevention.  

  6. **Proportionality as a Constraint**  
     - **Must explain**: Whether punishment/prevention must be proportional to desert, risk, or both.  
     - **Case**: Low-desert/high-risk offender – proportional detention may exceed desert-based limits.  
     - **Non-negotiable**: In liberal democracies, yes. Extreme disproportionality (e.g., life detention for minor theft) violates human rights, regardless of risk.  
     - **Collision**: Quarantine models risk indefinite detention; retributivism may release dangerous individuals. **Trade-off**: Hybrid theories need a ceiling (e.g., desert caps censure; risk caps duration).  

  7. **Empirical Practicability**  
     - **Must deliver**: A framework workable with real-world risk assessments (imperfect, biased) and desert judgments (subjective).  
     - **Case**: All stress tests – e.g., actuarial risk scores misattribute danger to neurodivergence.  
     - **Non-negotiable**: Yes. Over-reliance on risk scores risks discrimination; over-reliance on desert ignores prevention.  

  8. **Liberal Legitimacy**  
     - **Must explain**: How to command public assent despite free-will disagreements.  
     - **Case**: Any divergence (e.g., detaining a low-desert/high-risk person feels "unfair"; freeing a high-desert/low-risk fraudster feels "unjust").  
     - **Non-negotiable**: Yes. Sanctions must be justifiable to all citizens, not just adherents of one metaphysics.  

  ---  
  **Most Exclusionary Desideratum**:  
  **"Proportionality must be strictly desert-based"** excludes all purely forward-looking and quarantine models, as they subordinate desert to prevention.  

  **Key Collision**:  
  - **When desert and risk diverge**, honoring *desert as a side-constraint* (e.g., no censure beyond blameworthiness) conflicts with *pure prevention* (e.g., indefinite detention for high risk).  
  - **Resolution requires compromise**: E.g., censorious elements (e.g., stigma, hard treatment) tied to desert; preventive elements (e.g., supervision duration) tied to risk, but capped by desert to avoid tyranny.  

  **Settled vs. Contested**:  
  - **Settled**: Liberal democracies must not punish for luck, uncontrollable risk factors, or immutable traits.  
  - **Contested**: Whether censure requires basic desert (skeptics say no; compatibilists say yes under determinism).  

  **One-Sentence Verdicts**:  
  - **Traditional retributivism**: Fails risk management in low-desert/high-risk cases and moral luck consistency.  
  - **Dennett-style accounts**: Best balance agency and prevention but struggle to justify censure without implicit desert.  
  - **Caruso-style models**: Avoid retribution but risk excessive detention in low-culpability cases and lack censure’s social functions.  

  **Recommendation**:  
  A hybrid must relax pure desert-proportionality for prevention (conjecture: confident) but retain desert limits on censure and total severity (non-negotiable). Skepticism about basic desert need not collapse agency if censure is forward-looking (contested; depends on persuasiveness of skepticism).
