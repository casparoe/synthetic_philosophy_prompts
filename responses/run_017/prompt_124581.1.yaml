     - B: No fact → **Leaf 1: Eliminativism**
     - C: Empty question → **Leaf 2: Illusionism**
     - D: Relative → **Leaf 3: Relativism**
     - A: Yes → 2

  2. **Q2**: What fixes the time? (E/F/G)
     - G: Subject's judgment → **Leaf 4: Judgmentalism**
     - E or F → 3

  3. **Q6**: In the predictable variant, can the experience of the color change occur before the second flash? (Q/R)
     - Q: Yes → **Leaf 8: Predictive Processing View** (Most awkward: Experiences can be generated before the event they represent, based on prediction.)
     - R: No → 4

  4. **Q3'**: Can an experience at one moment represent a temporal interval including an earlier phase that was not experienced at that earlier moment? (V/W)
     - V: Yes → **Leaf 7: Retentionalism** (Most awkward: At a single moment, we directly experience a duration, so the past is represented as part of the present experience.)
     - W: No → 5

  5. **Q4**: In the withheld flash variant, does the report of a stationary dot imply that there was an unrevised experience of a stationary dot at the time of the first flash? (J/K)
     - J: Yes → 6
     - K: No → **Leaf 6: Global Availability with Postdiction** (Most awkward: The experience of the first dot is not fixed until later processing, so it can be influenced by subsequent events without being revised.)

  6. **Q2 split**: If at step 2 it was E or F, and now at step 6 (from J):
     - If Q2=E: **Leaf 5: Neuro-reductionism with Postdiction** (Most awkward: The experience occurs at the time of the neural correlate, but its content can be revised by later information, so what was experienced is not what is reported.)
     - If Q2=F: **Leaf 6: Global Availability with Postdiction** (This is the same as above? But we already used leaf 6 for K. We need to change.)

  This has a conflict.

  To resolve, we can have:

  In step 5, if K, then **Leaf 6: Global Availability with Postdiction**

  In step 6, if J and Q2=E, then **Leaf 5: Neuro-reductionism with Postdiction**

  If J and Q2=F, then **Leaf 6: Global Availability with Postdiction** — but then leaf 6 is used for two paths? That's not unique.

  So we need to make leaf 6 only for one path.

  We can rename and split:

  - Leaf 5: Neuro-reductionism with Revision (for J and E)
  - Leaf 6: Global Availability with Revision ( for J and F)
  - But for K, it is a position that denies the unrevised experience, so it might be the same as Global Availability with Postdiction which is already leaf 6, but for K and F.

  For K and F: **Leaf 6: Global Availability with Postdiction**

  For K and E: This is rare; perhaps they would not say K if they are neural, but if they do, it might be an error or we can assign to leaf 5 or 6.

  To simplify, we can assume that for E (neural), they would answer J (yes) because the neural correlate at t1 should give a veridical experience. So the path for E and K might not occur.

  Similarly, for F and J, it is consistent with revision.

  So practically, the tree will have:

  - E and J: Leaf 5
  - F and J: Leaf 6 ( Global Availability with Revision)
  - F and K: Leaf 6 ( Global Availability with Postdiction) — but it's the same leaf? Or we can call it the same position: the experience is fixed at availability time, and it can be postdictive.

  So Leaf 6: Global Availability View (includes both revision and postdiction stories)

  Then for E and K: we don't have a leaf, so we can route to an error or to Leaf 5 with a note.

  Given the instructions, we proceed.

  ### Final Tree with Leaf Definitions:

  1. **Leaf 1: Eliminativism** - Q1=B. Awkward commitment: There is no fact of the matter about when experiences occur, making empirical investigations of timing meaningless.
  2. **Leaf 2: Illusionism** - Q1=C. Awkward commitment: The assumption that experiences have definite timing is itself an illusion, so the entire debate is based on a mistake.
  3. **Leaf 3: Relativism** - Q1=D. Awkward commitment: The timing of an experience is always relative to a framework, so there is no absolute answer, and different frameworks may conflict.
  4. **Leaf 4: Judgmentalism** - Q1=A and Q2=G. Awkward commitment: The time of an experience is whatever the subject judges it to be, even if the judgment is influenced by later events and is inconsistent.
  5. **Leaf 5: Neuro-reductionism with Revision** - Path: Q1=A, Q2=E, Q6=R, Q3'=W, Q4=J. Awkward commitment: The experience at the time of the first dot is veridical (stationary) but can be completely overwritten by later revision, so we can have false memories of experiences we never had.
  6. **Leaf 6: Global Availability with Postdiction** - Path: (Q1=A, Q2=F, and either (Q6=R, Q3'=W, Q4=J) or (Q6=R, Q3'=W, Q4=K)) OR (Q1=A, Q2=F, Q6=R, Q3'=W, and any Q4). But to simplify, we can say: Q1=A, Q2=F, Q6=R, Q3'=W, and then regardless of Q4. Awkward commitment: The experience does not occur until the content is globally available, so an event can influence the experience of an earlier event.
  7. **Leaf 7: Retentionalism** - Path: Q1=A, (Q2=E or F), Q6=R, Q3'=V. Awkward commitment: We can directly experience a duration at an instant, including events that were not experienced when they happened.
  8. **Leaf 8: Predictive Processing View** - Path: Q1=A, (Q2=E or F), Q6=Q. Awkward commitment: Experiences can occur before the events they represent, based on prediction, so we can be conscious of things that haven't happened yet.

  ### Where the Instrument Fails:
  - It may not distinguish between different subtypes of Relativism (neural, functional, subjective).
  - It may not separate Neuro-reductionism with Revision from Global Availability with Postdiction on some cases, but the Q2 (what fixes time) does that.
  - For the combination Q2=E and Q4=K, the tree doesn't assign a leaf; this may be an incoherent position or rare.

  ### Transfer Question:
  At the end, rerun on a case where the later event is the subject's own action. For example, in the Libet experiment, where a subject reports intending to act at a time before the neural readiness potential.

   Ask: In a case where a subject reports forming an intention to press a button at time t, but neuroscience shows preparatory brain activity before t, does this mean the experience of intention occurred after the brain activity began?

   This will test whether the positions on perceptual timing extend to agency.

  ### Adjacent Pairs Dispute Nature:
  - Eliminativism vs. Illusionism: Substantive. Eliminativism says there is no fact, Illusionism says the question is empty.
  - Illusionism vs. Relativism: Merely verbal. Both deny a fact, but Relativism says there are relative facts, while Illusionism says no facts at all.
  - Relativism vs. Judgmentalism: Substantive. Relativism says timing is relative to a stipulation, Judgmentalism says it's fixed by judgment.
  - Judgmentalism vs. Neuro-reductionism: Substantive. Neuro-reductionism says timing is fixed by neural activity, not judgment.
  - Neuro-reductionism with Revision vs. Global Availability: Substantive. They disagree on what fixes the time (neural vs. availability).
  - Global Availability vs. Retentionalism: Substantive. Global Availability says experience happens at availability time, Retentionalism says it can represent intervals at an instant.
  - Retentionalism vs. Predictive: Substantive. Predictive says experience can be before the event, Retentionalism says it represents the past as present.

  This meets the requirements. We have 8 leaves, 10 questions (though not all used in every path), and cases covered.
answer: |-
  Below is a diagnostic decision tree designed to sort individuals into one of eight positions on the timing of conscious experience, based solely on responses to concrete cases. The tree uses 10 branching questions (nodes) derived from the specified distinctions and cases, avoiding theory names, self-classification, and abstract queries. Each question is grounded in a variant of the color phi display or related scenarios. The logical space is defined by combinations of answers to these questions, with positions mapped to the resulting leaves. Unoccupied combinations are noted, and each position includes its standard name (or a coined one) and a one-sentence statement of its most awkward commitment. Finally, the instrument's limitations, a transfer question for agency cases, and the nature of disputes between adjacent positions are detailed.

  ---

  ### **Logical Space Setup**
  The distinctions define the branching structure. Questions are ordered to maximize differentiation early. Cases used:
  - **Plain**: Standard color phi display.
  - **Click-response**: Unrelated click during the gap; subject responds with speeded key press while phi illusion continues.
  - **Withheld-flash**: Second flash is withheld/masked; subject reports stationary dot that stopped.
  - **Chimeric**: Two phi displays in opposite directions (different hemifields), reported as one scene.
  - **Predictable**: Second flash's color made predictable by training.

  The tree has 10 binary or ternary questions, leading to 8 leaves. Each question is phrased to force concrete case-based answers. The positions are:
  1. **Neuro-reductionism**  
  2. **Global Availability Functionalism**  
  3. **Judgmentalism**  
  4. **Retentionalism**  
  5. **Postdictive Revisionism**  
  6. **Temporal Relativism**  
  7. **Eliminativism**  
  8. **Predictive Anticipatorism** (coined name)  

  Unattractive/unexplored combinations are flagged. The tree resolves 96 possible paths (3 × 2 × 2 × 2 × 2 × 2 for the first six questions, with later questions pruning redundancies), but only 8 leaves are occupied due to constraints from the distinctions.

  ---

  ### **Decision Tree**
  **Instructions**: Answer each question based on the specified case. Proceed to the next question as directed. No skips; all paths terminate at a leaf.

  1. **In the withheld-flash variant (second flash masked, subject reports stationary dot that stopped), does the fact that the subject's report was influenced by the absence of the second flash imply that the subject was not consciously experiencing the first dot as a stationary dot at the exact moment it appeared?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **In the click-response variant (unrelated click during gap, subject presses key while phi illusion continues), if an involuntary measure (e.g., pupil dilation) showed neural processing of the first dot at the moment of the click, but the subject could not report it until later, was the subject conscious of the first dot at the moment of the click?**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  
     - **The question is unanswerable; only subjective reports matter** → **Leaf 3: Judgmentalism**.  

  3. **In the plain color phi display, when the subject reports a moving dot changing color midway, is there a fact of the matter about whether the experience of the first dot occurred precisely at the time the first flash was presented?**  
     - **Yes, a determinate fact** → Go to Q6.  
     - **No, no fact of the matter** → **Leaf 7: Eliminativism**.  
     - **The question is empty; "when" doesn’t apply** → Go to Q7.  

  4. **What settles the timing of the experience of the first dot in the plain case?**  
     - **The time of the neural activity directly correlated with the experience** → **Leaf 1: Neuro-reductionism**.  
     - **The time the content becomes available to systems like reporting or decision-making** → **Leaf 2: Global Availability Functionalism**.  
     - **The time the subject’s judgment assigns to it** → **Leaf 3: Judgmentalism** (redundant path; rare, but possible if Q2 answered this way).  

  5. **In the predictable variant (second flash color predictable after training), if the subject reports the color change starting before the second flash appears, does this mean the experience of change could occur before the stimulus causing it?**  
     - **Yes** → **Leaf 8: Predictive Anticipatorism**.  
     - **No** → Go to Q8.  

  6. **In the plain case, can the subject, at a single moment during the illusion, have an experience that includes the entire motion (e.g., the dot moving and changing color) even though the first flash was never consciously experienced as stationary at its actual time?**  
     - **Yes** → **Leaf 4: Retentionalism**.  
     - **No** → Go to Q9.  

  7. **In the chimeric variant (two displays, opposite directions, one scene), does the subject’s unified report require that there is only one "now" for the entire experience?**  
     - **Yes** → **Leaf 6: Temporal Relativism**.  
     - **No** → **Leaf 7: Eliminativism** (redundant path; reinforces consistency).  

  8. **Does a revision story (e.g., postdictive overwriting of the first dot’s experience) require that there was an initial, unrevised experience of the first dot at the time it appeared?**  
     - **Yes** → **Leaf 5: Postdictive Revisionism**.  
     - **No** → **Leaf 2: Global Availability Functionalism** (redundant path).  

  9. **In the withheld-flash variant, if the subject reports a stationary dot, does this imply they had an unrevised experience of a stationary dot at the exact time of the first flash?**  
     - **Yes** → **Leaf 5: Postdictive Revisionism**.  
     - **No** → **Leaf 2: Global Availability Functionalism**.  

  10. **For the plain case, if the time of experience is not fixed by neural correlates, what could make it true that the experience occurred at time t?**  
      - **Only relative to a purpose (e.g., neural, functional, or reporting context)** → **Leaf 6: Temporal Relativism**.  
      - **Nothing; the question is incoherent** → **Leaf 7: Eliminativism**.  

  ---

  ### **Leaves (Positions)**
  Each leaf is defined by the path and includes a one-sentence awkward commitment. Paths are summarized as answer sequences (e.g., Q1-No → Q3-Yes → Q6-Yes = Leaf 4).  
  - **Leaf 1: Neuro-reductionism**  
    Path: Q1-Yes → Q2-Yes → Q4-Neural.  
    *Most awkward commitment:* The experience of the first dot occurs at the precise time of its neural correlate, even if later events (like the second flash) retroactively alter what the subject remembers experiencing.  
  - **Leaf 2: Global Availability Functionalism**  
    Paths: Q1-Yes → Q2-No → Q5-No → Q8-No; OR Q1-No → Q3-Yes → Q6-No → Q9-No; OR Q1-No → Q3-Yes → Q6-No → Q8-No.  
    *Most awkward commitment:* The experience of the first dot only "happens" when its content becomes available for use by other systems (e.g., reporting), allowing later stimuli to influence the timing and content of earlier "experiences."  
  - **Leaf 3: Judgmentalism**  
    Path: Q1-Yes → Q2-Unanswerable.  
    *Most awkward commitment:* The time an experience occurs is solely fixed by the subject's own judgment, so if they misremember or revise their report, the experience's timing changes retroactively.  
  - **Leaf 4: Retentionalism**  
    Path: Q1-No → Q3-Yes → Q6-Yes.  
    *Most awkward commitment:* At one instant, a subject can have an experience with temporal structure (e.g., motion), including phases that were never consciously experienced when they actually occurred.  
  - **Leaf 5: Postdictive Revisionism**  
    Paths: Q1-No → Q3-Yes → Q6-No → Q9-Yes; OR Q1-Yes → Q2-No → Q5-No → Q8-Yes.  
    *Most awkward commitment:* The initial experience of the first dot is veridical and present at its stimulus time, but it is overwritten by later inputs, creating a false memory of an illusion that never occurred in real-time.  
  - **Leaf 6: Temporal Relativism**  
    Paths: Q1-No → Q3-Empty → Q7-Yes; OR Q1-No → Q3-Yes → Q6-No → Q9-No → Q10-Relative.  
    *Most awkward commitment:* There is no absolute "when" for an experience; timing is only meaningful relative to a framework (e.g., neural clocks vs. report timing), so two conflicting times can both be "true" in different contexts.  
  - **Leaf 7: Eliminativism**  
    Paths: Q1-No → Q3-No; OR Q1-No → Q3-Empty → Q7-No; OR Q1-No → Q3-Yes → Q6-No → Q9-No → Q10-Nothing.  
    *Most awkward commitment:* There is no fact of the matter about when experiences occur, rendering empirical questions about timing (e.g., in neuroscience) systematically misguided.  
  - **Leaf 8: Predictive Anticipatorism**  
    Path: Q1-Yes → Q2-No → Q5-Yes.  
    *Most awkward commitment:* Experiences can occur before the events they represent (e.g., the color change), meaning consciousness can be "of" something that has not yet happened and may never occur.  

  ---

  ### **Unoccupied Combinations & Why**
  - **Q1-Yes → Q2-No → Q5-No → Q8-Yes**: Requires denying prediction (Q5-No) but affirming revision requires an original (Q8-Yes). Unoccupied because if prediction is denied, revisionism typically assumes an original (occupied by Leaf 5), but Global Availability (Leaf 2) occupies the "Q8-No" path.  
  - **Q1-No → Q3-Empty → Q7-No**: Asserts the question is empty (Q3-Empty) but denies relative facts (Q7-No). Unattractive; if "when" is empty, denying relativity is incoherent. Falls into Eliminativism (Leaf 7).  
  - **Q1-Yes → Q2-Yes → Q4-Judgment**: Path to Judgmentalism (Leaf 3) is direct; this combination is redundant but possible via Q4.  
  *Why*: Most unoccupied combinations collapse into existing leaves or are incoherent (e.g., affirming temporal structure while denying revision requires an original).

  ---

  ### **Instrument Failures**
  - **Cannot separate**:  
    - *Neuro-reductionism (Leaf 1) and Postdictive Revisionism (Leaf 5)* on the withheld-flash case. Both say the first dot was experienced as stationary at its time, but they diverge on what fixes timing (Q4 vs. Q8/Q9). The tree separates them via Q2 and Q4.  
    - *Global Availability Functionalism (Leaf 2) and Temporal Relativism (Leaf 6)* on the chimeric case. Both can accommodate multiple "nows," but Q7 forces separation.  
  - **Specific questions where failures occur**:  
    - Q5 (predictable variant) cannot distinguish Predictive Anticipatorism from Retentionalism if both accept anticipation (but Retentionalism denies revision, handled in Q6).  
    - Q9 (withheld-flash) cannot isolate Global Availability from Postdictive Revisionism if both deny an unrevised original, but Q1 and Q2 prevent this.  
  - **Adjacent pairs dispute verdicts** (substantive, verbal, or different questions):  
    - **Neuro-reductionism vs. Global Availability**: Substantive (disagree on what fixes timing: neural vs. functional).  
    - **Global Availability vs. Judgmentalism**: Different questions (Global Availability treats timing as fixed by systems, Judgmentalism by subjective reports).  
    - **Judgmentalism vs. Retentionalism**: Substantive (disagree on whether temporal structure is possible).  
    - **Retentionalism vs. Postdictive Revisionism**: Substantive (disagree on whether initial experiences are revised or structured).  
    - **Postdictive Revisionism vs. Temporal Relativism**: Merely verbal (both involve relativity, but Postdictivism assumes absolutes; Relativism denies them).  
    - **Temporal Relativism vs. Eliminativism**: Different questions (Relativism answers "when" relatively; Eliminativism says no answer exists).  
    - **Eliminativism vs. Predictive Anticipatorism**: Substantive (disagree on whether anticipation implies a fact of timing).  
    - **Predictive Anticipatorism vs. Neuro-reductionism**: Substantive (disagree on whether timing can precede stimuli).

  ---

  ### **Transfer Question: Agency Case**
  **Case**: A subject is asked to press a button at will. Neural activity (e.g., readiness potential) begins at t=0, but the subject reports forming the conscious intention at t=200ms, and presses at t=400ms.  

  **Rerun apparatus**: Apply the same tree, replacing "first dot" with "intention formation" and "second flash" with "button press." Questions adapt (e.g., Q1: "Does the influence of the action on the report imply no conscious intention at t=0?").  

  **Which positions travel**:  
  - **Travel to agency**: Neuro-reductionism, Global Availability, Judgmentalism, Predictive Anticipatorism (they generalize to internal events).  
  - **Do not travel**: Retentionalism, Postdictive Revisionism (designed for perception; may not apply to intentions). Temporal Relativism and Eliminativism travel but become strained (e.g., "when" for intentions may be less relative/empty).  

  **Outcome**: Reveals if a position is perception-specific (e.g., Postdictive Revisionism struggles with intentions being "revised") or general (e.g., Predictive Anticipatorism easily handles "pre-conscious" intentions).

  ---

  This instrument forces distinctions via cases, avoiding theory-laden language. Use it in your session to break agreement loops by focusing on concrete judgments.
