  The user identifies three potential design flaws: support laundering, cost of abstraction, and verdict portability. They want to prioritize research questions that would yield practical outputs—norms or stress tests for constructing philosophical examples—rather than theoretical accounts of thought experiments. They need guidance on which questions to focus on, considering their constraints.

