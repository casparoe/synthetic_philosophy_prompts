  Assessing the three labels: support laundering might be salvageable as "principle misattribution." Cost of abstraction is well-recognized but needs operationalization for specific norms. Verdict portability could be reframed as "contextual stability," focusing on how presentation variations affect verdict reliability.

  Top questions would need to be tractable within a year, upstream of practical outputs, and neglected in current literature. The evidential-status debate (intuitions as evidence) is saturated; design-level issues are underexplored. The user's position is that design flaws persist regardless of the intuition debate, so the research isn't premature.

  The adjudication: design-level problems aren't downstream of the evidential question. Even if intuitions are reliable, poorly designed cases can mislead. For example, a thought experiment might trigger a pre-existing intuition that doesn't actually support the target principle. That's a design flaw, not an intuition problem.

  Prioritized questions:
  1. Verdict portability → contextual stability. How do narrative elements (framing, detail, order) affect verdicts? Tractability: analyze existing case pairs (e.g., trolley variations) for instability patterns. Output: decision-tree for auditing narrative risks.
