  The user should drop "verdict portability" as a term but keep the concept as "contextual stability." The other two labels can be refined. A solved version would be a structured audit protocol for thought experiments, tested on historical cases. Success means having a usable framework by year's end.
answer: |-
  Here’s a structured research agenda prioritizing your constraints, adjudicating the core disagreement, and refining your concepts. I’ll focus on **design-level failures independent of the intuition-as-evidence debate**, as your position holds water: even if intuitions *are* reliable evidence, flawed case design can corrupt their output. The agenda targets **actionable norms for constructing/auditing thought experiments**, leveraging conceptual analysis, case studies, and logical modeling (no empirical tools needed).

  ---

  ### **Adjudicating the Crux: Is Design Downstream of Intuition-Evidence?**
  **Your position wins.** Design failures can sabotage thought experiments *even if* intuitions are reliable. Consider:
  - **Support laundering**: If a case accidentally triggers an *unrelated* but reliable intuition (e.g., disgust at exploitation), the verdict may misattribute support to the target principle. The intuition isn’t faulty—the *mapping* is.
  - **Cost of abstraction**: If a case omits real-world features essential to justification (e.g., removing social context from a fairness experiment), the verdict may be accurate *for the case* but inapplicable to reality. Again, the intuition isn’t the failure.
  - **Implication**: Research on design flaws is **not premature**. It addresses *how* thought experiments mislead *despite* potentially reliable intuitions. Your friend’s "evidential status" question is orthogonal: it asks *whether* intuitions count as evidence, not *how* cases corrupt their function.

  ---

  ### **Top 3 Research Questions (Ranked by Impact/Tractability)**
  #### **1. Question: Under what conditions do narrative framing elements (order, perspective, detail) destabilize verdicts?**  
     - **Upstream of**: Verdict portability (your label), robustness norms for case design.  
     - **Tractability**: High. Requires analyzing existing philosophical cases (e.g., Thomson’s violinist vs. trolley variants) and cognitive science literature on framing effects. No new experiments—reinterpret published data.  
     - **Neglected?**: Yes. The "experimental philosophy" literature catalogs framing effects but rarely systematizes *why* they arise or how to avoid them.  
     - **Trade-offs**: Skips debating intuition’s evidential status; focuses on mitigating noise in verdicts.  
     - **Solved Output**: A **decision-tree for auditing narrative risks** (e.g., "If changing POV alters verdicts, check for [X] confounding factors").  
     - **Success Metric**: A tested protocol applied to 5+ classic cases, identifying previously overlooked instabilities.  

  #### **2. Question: When does simplifying a case ("cost of abstraction") strip justificatory features without notice?**  
     - **Upstream of**: Guidelines for necessary complexity in thought experiments.  
     - **Tractability**: Medium-High. Compare criticized abstractions (e.g., Rawls’ Original Position ignoring care ethics) to robust ones. Use conceptual tools like "veils of ignorance."  
     - **Neglected?**: Unfashionable. Philosophers often idealize freely; few norms exist for when abstraction *harms*.  
     - **Trade-offs**: Less flashy than intuition debates but directly serves your goal of practical norms.  
     - **Solved Output**: **A taxonomy of abstraction risks** (e.g., "Omission of feedback mechanisms → misjudges dynamic systems").  
     - **Success Metric**: Criteria distinguishing benign vs. harmful simplification, validated against historical cases (e.g., Nozick’s utility monster).  

  #### **3. Question: How can "support laundering" be detected and neutralized during case construction?**  
     - **Upstream of**: Diagnosing unintentional bait-and-switch in arguments.  
     - **Tractability**: Medium. Identify patterns in cases that backfire (e.g., Singer’s pond example eliciting tribalism vs. utilitarianism).  
     - **Neglected?**: Genuinely so. Literature on "dialectical effectiveness" is sparse.  
     - **Trade-offs**: Overlaps with psychology of persuasion; risks drifting from philosophy. Mitigate by focusing on *logical* misattribution.  
     - **Solved Output**: **Red-flag checklist** (e.g., "Does the vignette contain emotionally loaded details orthogonal to the principle?").  
     - **Success Metric**: A flowchart for detecting laundering in new cases.  

  ---

  ### **What to Abandon or Reframe**  
  - **Verdict Portability (your label)**: **Collapse into Q1**. It’s a subtype of framing effects—useful but not standalone.  
  - **Support Laundering**: **Reframe as "Principle Misattribution"** (avoids confusion with "intuition laundering" debates).  
  - **Cost of Abstraction**: **Keep**, but tighten to "**Justificatory Gap Analysis**"—it’s the most original.  
  - **Intuition-as-Evidence Debate**: **Explicitly exclude**. Your resources can’t resolve it, and it’s saturated.  

  ---

  ### **Overrated/Overlooked Implications**  
  - **Overrated**:  
    - "If intuitions are unreliable, all thought experiments fail." **False**. Design fixes might salvage some (e.g., by reducing cognitive load).  
    - "Taxonomies of case types matter most." **Overemphasized**. Your focus on *failure modes* is more actionable.  
  - **Underrated**:  
    - **Second-order effects**: How a case’s *reception* (e.g., backlash to Jarvis Thomson) reveals design flaws (Q3).  
    - **Repairability**: Whether flawed cases can be revised or must be abandoned (applies to all 3 questions).  

  ---

  ### **Why This Agenda?**  
  - **Fits Constraints**: No empirical work needed—leverage existing cases and philosophy/cog-sci literature.  
  - **Downstream Impact**: Outputs are **tools, not theories** (e.g., an audit protocol philosophers can use pre-publication).  
  - **Neglected Niche**: Design-level flaws are underexplored compared to intuition-bashing.  
  - **Win-Win**: If intuitions are reliable, your norms prevent corruption; if unreliable, your norms reduce noise.  

  By year’s end, you’d deliver a **manual of design norms** (e.g., "To avoid laundering, stress-test against rival principles; to avoid abstraction gaps, map omissions to real-world justificatory roles"). This shifts the practice, not just the debate.
