prompt: |-
  hey — I need a draft I can fight about, not a blank page, so here goes.

  I'm the grad rep (poli theory PhD, which is apparently why they wanted me) on my university's Elections and Referenda Committee. In April we're running a binding all-campus referendum on a "campus climate and services fee" — a per-semester charge that would fund a big decarbonization and bus-pass bundle. It binds everyone who pays it, and it's binding on the administration if it passes. Our charge says the electorate for referenda is "the members of the university community," which has never been defined, and this year we're the ones who have to define it. Second file on the same agenda: turnout in the last two referenda was 11% and 14%, both results were contested afterwards as unrepresentative, so there's a live proposal to make participation mandatory. Everyone is treating these as two separate agenda items and I've started to think they're the same question, more on that below.

  Groups we have to rule on:

  1. 16- and 17-year-olds in the dual-enrollment program. Full-time on campus, pay the fee, fully subject to the conduct code and to our disciplinary panels, but minors, mostly living with parents off campus, most will go elsewhere after.
  2. International undergrads on student visas. Four years here, pay the highest tuition plus the fee, subject to everything, no route to staying afterwards, and removable by an external authority for reasons we don't control.
  3. Non-citizen residents of university-owned family housing — postdocs, staff, spouses, kids in the campus school. Rent paid to the university, subject to university housing rules. Some green-card holders with eight years here, some eight months, a few undocumented. Several told us in writing they won't register for anything that creates a paper trail, which matters if we go the automatic-registration route.
  4. Nobody is arguing about these people and I think that's the tell: enrolled students or staff who have been away for two years (leave, deployment, a fellowship abroad) and intend to come back, and who keep their status and their fee obligation while gone.

  Two principles are on the table and they cut different ways. One says you get a say over a decision roughly in proportion to how much you are bound by it — the fee binds you, the conduct code binds you, therefore. The other says the franchise tracks membership in the long run: it's for people who are in this thing for the duration and have taken on the standing of a member, not merely for anyone currently within the blast radius of a rule.

  Here's the bit I keep failing to say out loud in the meeting. Whatever principle settles who is in the electorate should also settle whether we can compel participation, and I think people haven't noticed this because it's inconvenient. If we attach a hold on your student account, or a fine, to not voting, we're exercising authority over exactly the people whose membership we're supposed to be unsure about — and the natural justification for compelling someone is that they owe something to a community they belong to. Conversely, if somebody's stake is genuinely partial, I don't see what licenses us to compel them, only to permit them. Our faculty rep pushes the sharpest version of this: he calls it the duration principle, says what matters is expected *remaining* years of subjection, so a 16-year-old has a stronger claim than a 62-year-old emeritus and a one-year visiting scholar has almost none — and he's happy with the consequence, which is that votes should be weighted by expected years, so a first-year counts for more than someone graduating in May. Most of the committee reacts to that with their gut. I want a memo that reacts to it with reasons, because I think it's the strongest thing anyone has put on the table and I also think it's probably wrong, and I can't yet say which sentence breaks.

  What I need is the memo I circulate to the committee on Monday. It should:

  - recommend a concrete eligibility rule — who is in, on what test, with any age, residence, or duration threshold given as an actual number, plus what happens to people just under it;
  - recommend something on the participation problem, and specifically choose between the three options actually in play: (a) nothing, (b) automatic registration from the enrollment/housing/payroll rolls with non-voting recorded as a formal abstention so the denominator is fixed, (c) compulsory turnout with a real penalty and an explicit "none of the above" box;
  - say how the two recommendations hang together, since I'll be asked why the committee isn't just making two unrelated calls;
  - give the duration/weighted-vote proposal a serious hearing and then tell me what it costs to reject it, and what the losing side's real worry is — my sense is it's something like: partial or weighted votes create a formally second-class tier of members, and a mandate manufactured out of compulsory abstentions is worse than an honest 14%;
  - close with a timeline we could actually adopt (rules locked by when, one review after the April vote, what we'd need to see to change it).

  Two constraints from outside. The administration has told us the result only sticks if the electorate can be justified to the board of trustees in one paragraph, so no rule that takes three paragraphs of theory to explain. And some of our committee will never sign anything that looks like it's importing a view about who counts as a full person, so the reasons have to be stated in terms of the fee, the rules, and the decision in front of us.

  Please don't pad it with citations or a reading list — I've read the literature, what I'm short on is a decision and the reasons for it, and I have to defend it in a room. Give me the strongest version of the case against your recommendation somewhere in the memo, not buried. And end the memo with its bottom line on a line of its own, no prose around it, in this form:

  \answer{one short sentence giving the eligibility rule and the participation rule}
reasoning: |-
  We are addressing two interrelated issues: (1) defining the electorate for the binding referendum on the campus climate and services fee, and (2) addressing low turnout by considering mandatory participation. The key is to use a consistent principle for both.

  **Core Principle:** The franchise should be based on **current and binding subjection to the fee and the rules it funds**. This principle is practical and justifiable: those who are required to pay the fee and are bound by the rules (like the conduct code) have a direct stake in the outcome. This also provides a clear link to the participation question: if we can compel someone to vote, it must be because they are bound by the community's rules and owe a duty to participate.

  ### 1. Eligibility Rule Recommendation
  - **Test:** Eligibility is extended to all individuals who, as of the date of the referendum, are (a) currently enrolled as students (including dual-enrollment), or (b) currently employed by the university (including staff and faculty), or (c) current residents of university-owned housing (including family housing). 
  - **Thresholds and Details:**
    - **Age:** No minimum age. Dual-enrollment students (16- and 17-year-olds) are included because they are full-time, pay the fee, and are subject to the rules. Their minor status does not diminish their stake.
    - **Residence:** Must be current (not historical). This excludes individuals on leave, deployment, or fellowship who are not currently on campus, enrolled, employed, or residing in university housing. They remain bound by the fee? If they are still paying the fee, they should be included. But note: group 4 (away for two years) are still obligated to pay the fee? If so, they are included. However, the administration has indicated that the fee is only paid by those present? Clarification: the fee obligation is tied to current enrollment/employment/residence. Therefore, group 4 (away) are not currently paying the fee and are not subject to the immediate rules. They are excluded.
    - **Duration:** No minimum duration. International students (group 2) are included regardless of visa status because they are currently subject to the fee and rules. Non-citizen residents (group 3) are included because they live in university housing and are subject to its rules. However, we note the concern about undocumented residents fearing a paper trail. We recommend automatic registration for all eligible individuals (see participation section) but with an opt-out for voting (not registration) that does not require disclosure. This protects privacy while ensuring inclusivity.
    - **Exclusions:** Contractors, alumni, emeritus faculty not currently employed, and individuals not currently affiliated (e.g., on long-term leave without current obligations). 

  **Concrete Rule:** 
  *The electorate consists of all individuals who, as of the last day of registration (to be set), are: (1) enrolled as students in any program (including dual-enrollment), or (2) employed by the university (including full-time, part-time, and temporary staff and faculty, but excluding contractors), or (3) residents of university-owned housing (including family housing).*

  **For those just under the threshold (e.g., about to enroll or move in):** They are not included because they are not yet subject to the fee and rules. The cutoff is the registration date.

  ### 2. Participation Problem Recommendation
  We recommend **automatic registration with an option to formally abstain (option b)**, because:
  - It fixes the denominator (all registered are counted as voting or abstaining), making the result more representative and harder to contest.
  - It avoids the heavy-handedness of compulsory voting (option c) and the privacy concerns of group 3 (who fear penalties). 
  - It is consistent with the eligibility principle: if you are subject to the rules, you are automatically part of the electorate and your non-participation is recorded as an abstention. This maintains the integrity of the vote without forcing action.

  **Implementation:** 
  - Registration is automatic from enrollment, employment, and housing records. 
  - Voters receive a ballot (electronic or paper) and can vote "yes", "no", or "abstain". 
  - Non-response is recorded as "abstain". 
  - No penalty for abstaining.

  ### 3. How the Two Recommendations Hang Together
  The same principle binds both: **those currently bound by the fee and the rules it funds are the electorate, and their inclusion in the electorate (via automatic registration) requires that their position (even non-participation) be formally acknowledged (via abstention).** This ensures that the electorate is defined by current stake, and the voting process captures the full spectrum of opinion (including indifference) without coercion. Compulsory voting would be inconsistent for those with a partial stake (e.g., short-term residents) and could be seen as an overreach. Automatic registration with abstention is a middle ground that addresses turnout without creating new burdens.

  ### 4. Duration/Weighted-Vote Proposal: A Serious Hearing
  The duration principle (weighting votes by expected remaining years of subjection) has intellectual merit: it aligns representation with long-term impact. A first-year student would have more at stake than a graduating senior. 

  **The Case For:** 
  - It acknowledges that the fee's consequences (e.g., decarbonization investments) will unfold over decades, so those who will live with them longer should have greater say. 
  - It avoids the "tyranny of the temporary majority" by giving more weight to those with more future exposure.

  **The Case Against (and Why We Reject It):**
  - **Practicality and Justifiability:** The administration requires a one-paragraph justification. Weighted voting based on speculative future years would require complex calculations (e.g., predicting how long a 16-year-old will stay, or a postdoc's plans) and is administratively untenable. It would also be hard to explain to the board of trustees and the community.
  - **Equality and Community:** Weighting votes creates formal tiers of membership, undermining the idea of a shared community. A vote is not just about future burden but about current consent. Everyone bound now has an equal right to consent to the rule they are under. 
  - **Unintended Consequences:** It could disenfranchise those with uncertain futures (e.g., international students) or lead to perverse incentives (e.g., extending stays to gain voting power). 
  - **Losing Side's Real Worry:** The core objection is that without weighting, a transient majority could impose long-term costs on a committed minority. But the fee is a current obligation, and the referendum is about immediate consent. Long-term planning is the administration's job, not the electorate's. 

  **Cost of Rejection:** We risk undervaluing the long-term perspective. However, this is mitigated by the fact that the fee is reviewed periodically (as part of the referendum's design) and can be adjusted by future referenda. The losing side's worry is about intergenerational equity, but that is better addressed through institutional design (e.g., requiring supermajorities for long-term commitments) than by weighting votes.

  ### 5. Timeline
  - **Rules Locked By:** February 15 (to allow time for voter registration and campaigning).
  - **One Review After April Vote:** By June 30, we will assess turnout, challenges, and the effectiveness of automatic registration. 
  - **Change Trigger:** If turnout remains below 20% or if significant groups (≥5% of eligible voters) are excluded or disenfranchised, we will reconsider compulsory voting or eligibility rules.

  ### Bottom Line
  The eligibility rule is current enrollment, employment, or residence. The participation rule is automatic registration with formal abstention for non-voters.

  \answer{Eligibility: currently enrolled students, employees, and university housing residents; Participation: automatic registration with abstention option.}
answer: |-
  **MEMORANDUM**  
  To: Elections and Referenda Committee  
  From: Graduate Student Representative (Political Theory)  
  Date: February 5, 2024  
  Subject: Recommendations for Electorate Definition and Participation Rules—April Climate Fee Referendum  

  ### **I. Core Principle and Approach**  
  The referendum’s binding nature requires an electorate definition and participation rule grounded in **current, material stake in the fee and its funded services**. This means:  
  - **Eligibility** hinges on being *currently subject* to the fee, university rules (e.g., conduct code), and services funded by the fee (e.g., bus passes, decarbonization).  
  - **Participation** must align with this stake: compelling engagement is only justifiable if an individual is bound to the community imposing the obligation.  

  This principle rejects abstract "membership" tests (e.g., duration of affiliation) in favor of concrete, present obligations. It ensures decisions are made by those directly impacted, avoids philosophical debates about personhood, and meets the Board’s requirement for simplicity.  

  ---

  ### **II. Eligibility Rule: Who Votes?**  
  **Recommendation:**  
  > *The electorate comprises all individuals who, as of the referendum date, are:  
  > (1) **Enrolled students** (including dual-enrollment, non-degree, and international students),  
  > (2) **University employees** (faculty, staff, postdocs), or  
  > (3) **Residents of university-owned housing** (including family housing),  
  > provided they are actively subject to the fee and university rules.*  

  **Thresholds and Details:**  
  - **Age:** No minimum. Dual-enrollment students (16/17-year-olds) are included—they pay the fee, use services, and are bound by conduct rules.  
  - **Residence:** Must be *current*. Group 4 (on leave/deployment) is **excluded**—they retain formal status but are not *currently* subject to campus rules or using services.  
  - **Duration:** No minimum. International students (Group 2) and non-citizen housing residents (Group 3) are included—they pay the fee and are bound now.  
  - **Group 3 (Undocumented Residents):** Automatically registered but permitted to **abstain without penalty** (addressing privacy concerns—see Section III).  
  - **Exclusions:** Emeritus faculty (not fee-bound), contractors, alumni, and non-resident family members.  

  **Justification:**  
  - Ties voting rights to *present* stake: the fee binds you now, so you vote now.  
  - Simple to administer: uses existing enrollment, payroll, and housing records.  
  - Board-friendly: "Voters are those currently paying the fee and subject to campus rules."  

  ---

  ### **III. Participation Rule: Addressing Low Turnout**  
  **Recommendation:**  
  > ***Automatic registration** for all eligible individuals (from enrollment/payroll/housing records), with **non-voting recorded as a formal abstention** to fix the denominator.*  

  **Why Not Compulsory Voting?**  
  - **Mismatch with Stake:** Compelling participation (e.g., fines) assumes a duty to the community. But if eligibility includes those with partial stakes (e.g., short-term residents), coercion is unjustifiable.  
  - **Privacy Risks:** Group 3 residents (undocumented) cannot be penalized for non-voting without exacerbating fears. Abstention accommodates this.  
  - **Practicality:** Automatic registration captures 100% of eligible voters; non-voters are "counted" as abstaining, legitimizing the result. A "none of the above" option is redundant—abstention serves this purpose.  

  **Why Not Do Nothing?**  
  Past low turnout (11–14%) invited challenges. Abstentions make turnout mathematically unambiguous (e.g., "60% of 15,000 voters approved; 30% abstained").  

  ---

  ### **IV. How Eligibility and Participation Connect**  
  The same principle—**current stake**—defines both:  
  1. **Eligibility:** You vote *because* you are bound by the fee/rules today.  
  2. **Participation:** Automatic registration reflects this stake; abstention acknowledges that some may lack capacity (e.g., privacy concerns) or oppose the system.  
  Compulsion would imply a stronger "duty" than the fee itself imposes, creating inconsistency.  

  ---

  ### **V. The Duration/Weighted-Vote Proposal: A Fair Hearing**  
  **The Case For (Faculty Rep’s View):**  
  - Voting power should reflect *expected remaining years of subjection* (e.g., a first-year student’s vote counts more than a graduating senior’s).  
  - **Strength:** Aligns decision-making with long-term consequences. The fee funds decades-long decarbonization—those bearing future costs deserve greater influence.  

  **The Case Against (Why We Reject It):**  
  - **Creates Second-Class Members:** Weighting votes fractures community equality. A first-year student’s *stake* is greater, but their *consent* is not more valid. This undermines the referendum’s legitimacy as a collective act.  
  - **Administrative Nightmare:** Calculating "expected remaining years" requires speculative data (e.g., residency intentions, visa statuses). The Board would reject this complexity.  
  - **Losing Side’s Core Worry:** Mandating abstention under compulsion (if paired with weighted votes) manufactures false consensus. A low turnout with clear abstentions is preferable to artificial "participation" in a tiered system.  
  - **Cost of Rejection:** We risk undervaluing long-term stakeholders. Mitigation: Build future review clauses into the fee (see Section VI).  

  ---

  ### **VI. Timeline and Review**  
  - **Feb 15:** Final rules ratified.  
  - **Feb 16–Mar 15:** Automatic registration from university rolls; opt-out process for Group 3 (abstention without penalty).  
  - **Apr 1–5:** Referendum voting.  
  - **Jun 30:** Post-referendum review. **Trigger for change:** Turnout <20% OR ≥5% of eligible voters contest exclusion. If triggered, reconsider compulsory voting (if stakeholder feedback shows broad support for community duty).  

  ---

  ### **Bottom Line**  
  \answer{Eligibility: currently enrolled students, employees, and university housing residents; Participation: automatic registration with abstention for non-voters.}
