  The user presents a thought experiment: gradually replacing neurons in a monkey's visual cortex with analog devices that mimic voltage responses but lack computational features. They frame it as a dilemma—either the monkey still sees (so computation wasn't essential) or it doesn't (so something beyond computation matters). They also preempt two escapes: comparing the devices to non-computational systems like coastlines, or reducing computation to causal roles. 

