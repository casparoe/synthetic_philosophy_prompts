  3. "Causal role" alone isn't computational, but when causal chains *systematically mediate environmental inputs to behavioral outputs* (like turning light patterns into shape discriminations), that's computation. 

  User might counter: "But you're just calling any input-output function computation!" So I'll stress the *structural* aspect: the devices inherit a role in a network that decomposes visual processing into interdependent operations (edge detection, motion tracking etc.). A coastline doesn't have interdependent sub-functions. 

  End with a question pushing them to define cognition without computation. If they can't, it hints that computation might be inescapable. 

  ...Wait, did I drift toward representationalism? I mentioned "information-carrying," but the prompt said to define "representation" if used. I'll tweak: focus on the *functional architecture* of vision (detecting spatial/temporal patterns) without calling it representation. The analog devices maintain that architecture—so they're still computing, just continuously.
answer: |-
  Your thought experiment is sharp, but I don’t find it a true dilemma because I take your first horn: the monkey still sees, and computation persists. Let me explain why this doesn’t undermine my position.  

  The analogue devices aren’t merely inert physical systems like a coastline; they are engineered to preserve *specific input-output mappings* that were *selected for* their role in visual processing. A coastline’s erosion is a passive physical regularity, but these devices actively maintain the *functional relationships* that enable the monkey to discriminate shapes and track motion. What makes this computational—and not merely dynamical—is that the system’s behavior depends on *structural dependencies* between inputs and outputs that carry information about the environment. For instance, a device’s voltage response to a moving edge isn’t just a brute physical reaction; it sustains a correspondence between external features (e.g., edge orientation) and downstream neural activity that guides behavior. A "representation," here, is a state or process that stands in for an external feature *in virtue of* its systematic causal role in mediating the animal’s adaptive responses—like how a specific voltage pattern "represents" a diagonal line because it reliably covaries with that line and triggers appropriate orienting behavior.  

  The computational claim isn’t that neurons resemble digital gates, but that the *orchestrated transformations* across the visual system implement abstract operations (e.g., filtering, integration) that extract behaviorally relevant information from sensory data. Your substituted devices inherit this computational architecture: they preserve the critical input-output functions that, when composed across the network, perform the visual discrimination "task." That the devices lack internal discrete states or drift is irrelevant; computation can be analog, stochastic, and decentralized. A dynamical description becomes computational when it captures how the system *processes information*—i.e., how it transforms environmental inputs into representations that support goal-directed behavior. The coastline fails this test: its erosion doesn’t *functionally depend* on wave pressure to guide an overarching behavior-supporting process.  

  So, the computation *does* make the difference: the devices work only because they uphold the specific mappings that realize the visual computation. Remove *that* organization—say, by scrambling the input-output fits—and vision collapses. Your substitution preserves the essential computational structure, hence the survival of sight.  

  If cognition isn’t computation in this sense—transformations of structured, information-carrying states—what positive account do you offer to distinguish cognitive processes (like seeing) from mere biochemical dynamics?
