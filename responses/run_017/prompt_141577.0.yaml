prompt: |-
  I sit on the governance-advisory team of a multilateral development bank. We are drafting an internal guidance note on which practices our programmes should treat as corrupt — not merely illegal, and not merely in breach of our own procurement rules — and we keep discovering that we disagree with each other in ways none of us can fully articulate. Before I argue with my colleagues I would like to know what I actually think. So I have written down my own verdicts on a set of cases I have either encountered or argued about, together with the test I have been using to decide them, and I would like you to tell me what principle my verdicts add up to, how my test should be repaired or replaced, and which of my verdicts a defensible account would force me to give up.

  My cases and verdicts.

  1. At a district hospital in a low-income country, a family gives a nurse the equivalent of about two dollars before she will take an elderly woman's card and let her be seen. Corrupt, but the least serious thing on this list; I would not report her, and I would rather she took the money than sent the woman away.

  2. The same nurse, on the same ward. After a successful delivery, the family hands her a chicken in front of the other patients, purely out of gratitude; nothing about her future conduct changes. Not corrupt. I notice that these two cases involve the same official, a transfer of roughly the same magnitude, and opposite verdicts, and that what seems to be doing the work is timing, publicity and consequence. I dislike the idea that timing does the work, but I cannot get myself to change either verdict.

  3. A municipal clerk demands twenty dollars to release a ration card that the applicant has already been approved for and is legally entitled to. The clerk's demand is corrupt; the applicant's payment is not. As I understand it, the American statute's grease-payment carve-out and the British statute's lack of one each get one half of this case wrong, and in opposite directions.

  4. A mayor awards a no-bid contract to the only firm in a blighted district, having campaigned on bringing work to that district; his motive is partly re-election. Not corrupt.

  5. A mayor awards a no-bid contract to a firm that, three months later, hires his son at market salary for a job he is qualified for; there is no evidence of any prior understanding. Corrupt. I know this sits badly with case 4 and I go back and forth on the pair: in both, an official uses discretion to advantage someone connected to him and gains from it.

  6. A pharmaceutical representative buys lunch for the doctors at a clinic and waits outside while they eat; prescribing of her product subsequently rises. Corrupt, mildly — including in jurisdictions where this is legal and fully disclosed.

  7. A village headman adjudicating a land dispute accepts the customary drink from both parties before he hears the matter; everyone present regards this as how a headman behaves and would think worse of one who refused. I want to say not corrupt, and I genuinely cannot tell whether that verdict is respect for local norms or cowardice.

  8. An international lender makes a loan tranche conditional on the recipient's criminalising customary gift-giving to officials, on pain of losing money that pays for clinics. The condition is itself a species of the thing it targets. My own employer does things of this kind.

  9. A donor gives a university ten million dollars; his son is admitted two years later; the admissions office never discussed the gift. Not corrupt on these facts — but the university ought to refuse the gift, and I do not know what to call the wrongness if corruption is the wrong name for it.

  10. A senior regulator takes a job at a bank she previously regulated, at triple her public salary, eighteen months after leaving, breaking no cooling-off rule. This is the case I feel most strongly about, and I call it corrupt or at least corrosive, even though no law was broken and no bribe was offered. Her former department now regulates softly, in the hope of similar offers.

  11. A legislator's closest friend since university — now a registered lobbyist for an industry her committee oversees — gives her a watch worth two thousand dollars for her fiftieth birthday. There is no expectation on either side; the friendship is precisely what makes the gift possible. This should be prohibited and I am inclined to call it corrupt, but it seems to break clause (i) of my own test below, since the transfer would have been made had she held no office at all.

  My current test, which a colleague has named the Counterfactual-Relation Test, says that a transfer of advantage to someone occupying a role of trust is corrupt if and only if (i) the transfer would not have been made but for the role, and (ii) the point of the transfer is to make the recipient's exercise of the role answer to the giver's interests rather than to the purposes the role exists to serve, where interests is understood to include an interest in being treated better than the role's rules allow. The same colleague proposes sorting transfers into extractive ones — those the office-holder can extract because of her power over someone already entitled to something, as in cases 1 and 3 — and integrative ones — those that constitute or maintain a relationship, as in cases 2, 7 and 11 — and treating only the extractive ones as corrupt. I think that sorting collapses on case 11, but I cannot say why in a way my colleague would have to accept.

  What I want from you. State, as precisely as you can, the principle my verdicts are really tracking, with the case that motivates each clause, and say plainly which clause of my test is doing no work and which is doing too much. Explain why the very same transaction can be corrupt in one direction and not the other in case 3, and whether that asymmetry is a feature of a good account or a sign that I have been using one word for two things. Then give your account's verdicts on three cases I have not listed: a legislator who accepts campaign contributions from an industry whose case she had independently come to believe in before any contribution was made; a hiring manager who appoints her nephew, who is genuinely the strongest candidate, without disclosing the relationship; and a convoy commander who pays a militia for safe passage of food through territory that militia controls. Finally, tell me honestly which of my eleven verdicts your account cannot accommodate and which one you think I should overturn, and say whether the resulting account commits me to the view that the standards my institution enforces are universal, or to the view that they are parochial standards we happen to have the power to impose — and, if it commits me to the latter, whether corruption is then a concept I should be using less, with some of cases 8, 9 and 10 reassigned to other names such as injustice, abuse of power, or institutional capture.
reasoning: |-
  Hmm, this is a fascinating and complex query from someone working on anti-corruption governance at a multilateral development bank. The user presents 11 nuanced cases where they've made intuitive judgments about corruption, along with a proposed test they call the "Counterfactual-Relation Test," and asks me to analyze the underlying principles, critique their test, resolve asymmetries in their judgments, and apply a consistent framework to new cases.

  The user's judgments reveal several important tensions in defining corruption:
  - Distinguishing between extortion and gratitude (cases 1 vs 2)
  - Handling cultural practices (case 7)
  - Addressing structural corruption without explicit quid pro quo (cases 10-11)
  - Wrestling with institutional hypocrisy (case 8)
  - Separating corruption from other wrongs like nepotism or conflict of interest (cases 4-5, 9)

  Their current test focuses on two elements: whether the transfer depends on the role (counterfactual condition), and whether it subverts role purposes. But their own cases show this test has problems - particularly with case 11 where the gift would occur without the role, yet still feels corrupt.

  I notice three recurring principles in their verdicts:
  1) Power asymmetry matters most (the nurse has power over patients, while the headman's drink is symmetrical)
  2) The direction of initiation is crucial (extortion vs unsolicited gift)
  3) Institutional damage potential separates minor improprieties from systemic corruption

  For case 3's asymmetry, I think it's defensible: corruption is about abuse of power by the official, not the victim's payment under duress. The British and US approaches each miss half because they focus on different aspects - bribe-giving vs bribe-taking.

  The user's colleague's extractive/integrative distinction fails because even "integrative" transfers (like case 11) can corrupt when they create unspoken obligations in power-imbalanced relationships.

  For the three new cases:
  - The legislator accepting campaign contributions isn't corrupt if belief preceded contributions
  - Hiring a qualified nephew without disclosure is conflict of interest but not corruption
  - Paying a militia for safe passage is extortion, not corruption - unless the militia is state-affiliated

  Their verdicts that are hardest to defend:
  - Case 6 (pharma lunch) being called "corrupt" seems inconsistent with not calling case 7 (customary drink) corrupt - both involve inducements affecting behavior
  - Case 10's strong condemnation clashes with their own test's conditions not being met

  Ultimately, corruption standards are parochial - we're imposing context-specific norms. This means cases like 8 (criminalizing gifts) may be hypocritical, and some behaviors (like case 10's revolving door) might be better termed "institutional capture" rather than corruption.

  The user should consider adopting a graduated framework that distinguishes:
  1) Petty extortion (case 1)
  2) Cultural practices (case 7)
  3) Structural corruption (case 10)
  4) Institutional conflicts (case 9)

  This approach would require them to moderate their verdict on case 6 and recognize that case 10's wrong is more about systemic capture than individual corruption.
answer: |-
  Your verdicts reveal a consistent principle that prioritizes **the nature of power imbalance and its exploitation** over formal legality or transactional mechanics. The core idea is that corruption occurs when a **position of institutional trust is weaponized to extract unearned advantage or distort impartial judgment**, especially where the act entrenches systemic inequity or subverts public purpose. Below, I distill your implicit principle, repair your test, resolve asymmetries, and apply it to new cases—then identify where your judgments conflict with a defensible framework.

  ---

  ### **The Principle Your Verdicts Track: The Power-Distortion Standard**
  A transfer is corrupt when:
  1. **It exploits an *asymmetry of power* inherent to an institutional role** (e.g., the nurse controls access to care; the clerk gatekeeps entitlements).  
     *Motivated by:* Cases 1 (nurse extorts), 3 (clerk demands payment), 5 (mayor’s contract enables son’s job).  
  2. **It *distorts impartial judgment* or *institutional purpose***, either immediately (case 3) or predictably (case 10).  
     *Motivated by:* Cases 5 (contract influences hiring), 6 (lunch sways prescribing), 10 (revolving door incentivizes soft regulation).  
  3. **The act *reinforces systemic harm* or *normalizes exploitation*** (e.g., case 8’s hypocrisy; case 10’s incentive erosion).  
     *Motivated by:* Cases 8 (loan condition perpetuates power imbalance), 10 (revolving door corrupts regulatory culture).  

  **What your test gets right:**  
  - Condition (ii) captures *purpose-driven distortion* (e.g., cases 1, 3, 6).  
  **Flaws in your test:**  
  - Condition (i) (*"transfer would not occur but for the role"*) is **overinclusive** (it condemns case 2’s chicken) and **underinclusive** (it excuses case 11’s watch, which exploits the role despite the friendship).  
  - Your colleague’s extractive/integrative split fails because **"integrative" transfers can still corrupt** (case 11’s watch appears relational but biases oversight).  

  **Repaired Test:** A transfer is corrupt if:  
  > **(i) The recipient’s institutional power *creates or amplifies an imbalance* enabling the transfer, AND**  
  > **(ii) The transfer *subverts the role’s intended purpose* by prioritizing private interests over public/impartial duties.**  

  ---

  ### **Case 3’s Asymmetry: A Defensible Feature**
  The clerk’s demand is corrupt; the applicant’s payment is not. This asymmetry holds because:  
  - **Corruption is defined by the abuse of institutional power.** The clerk weaponizes public authority for private gain. The applicant is a victim of extortion, not a corrupt actor.  
  - **The asymmetry exposes a flaw in statute-based approaches:**  
    - The U.S. "grease payment" exception ignores that small bribes perpetuate systems of extraction.  
    - The U.K.’s strict liability misses that victims of extortion bear no moral culpability.  
  **Verdict:** This asymmetry is logical—it focuses on *who wields institutional power* and *how it is abused*.  

  ---

  ### **Verdicts on New Cases**  
  1. **Legislator accepting campaign contributions from an industry she independently supported:**  
     - **Not corrupt** if her belief predates contributions and voting remains uncompromised. Power imbalance is not exploited if judgment is truly impartial.  
  2. **Hiring manager appoints qualified nephew without disclosure:**  
     - **Corrupt.** The role’s power amplifies nepotism (condition i), and nondisclosure subverts merit-based hiring (condition ii). Qualification doesn’t negate the conflict.  
  3. **Convoy commander pays militia for safe passage:**  
     - **Not corrupt** (but possibly illegal/extortionate). The militia controls territory, not an institutional role. No *public trust* is subverted—though it may fund bad actors.  

  ---

  ### **Where Your Verdicts Conflict with a Defensible Account**  
  Your repaired test **cannot accommodate:**  
  - **Case 2 (gratitude chicken):** You absolve it, but the nurse’s role enables the gift (condition i). However, it doesn’t subvert care (condition ii), so *not corrupt*—your verdict holds.  
  - **Case 7 (headman’s customary drink):** Not corrupt. The symmetrical ritual doesn’t exploit power or distort judgment; rejecting it would impose alien norms.  
  - **Case 11 (lobbyist’s watch):** **Corrupt** under the repaired test. The friendship enables the transfer *because* of her role (i), and it inevitably biases oversight (ii). You must overturn your verdict.  

  **You should overturn:**  
  - **Case 6 (pharma lunch):** Not corrupt. The lunch itself doesn’t exploit power asymmetry (doctors voluntarily accept), though it’s ethically dubious. The *prescribing shift* suggests systemic failure, but the act is better termed "conflict of interest."  

  **Borderline:**  
  - **Case 9 (donor’s son admitted):** Not corrupt, but your instinct is right—it’s **institutional capture**. The university sacrifices impartiality for funding, subverting meritocracy.  

  ---

  ### **Universality vs. Parochialism**  
  Your framework commits you to **parochial standards**:  
  - Corruption is defined by how a *specific institutional context* permits power imbalances to distort public purpose (e.g., case 7’s headman ritual isn’t corrupt locally but might be in a formal court).  
  - This means:  
    - **Use "corruption" narrowly** for clear abuses of institutional trust (e.g., cases 1, 3, 5, 10).  
    - **Reassign other cases:**  
      - Case 8: **Hypocrisy/injustice** (imposing rules you violate).  
      - Case 9: **Institutional capture** (trading resources for privileges).  
      - Case 10: **Structural abuse of power** (eroding norms for private gain).  
      - Case 11: **Conflict of interest** (even absent quid pro quo).  

  ---

  ### **Conclusion**  
  Your instincts track a **power-distortion principle** focused on exploitation and systemic harm. The repaired test clarifies that corruption requires both (i) **institution-enabled imbalance** and (ii) **purpose-subverting intent**. This forces you to:  
  - Condemn case 11 (the watch) as corrupt due to its inescapable bias.  
  - Reclassify cases 6, 8, 9, and 10 as non-corrupt but still harmful—*other concepts better name their wrongs*.  
  - Accept that your institution’s standards are **parochial** (rooted in liberal-democratic norms) but **defensible** when targeting exploitative power imbalances.  

  This approach avoids overloading "corruption" while demanding rigor in diagnosing institutional decay. When drafting your guidance, distinguish:  
  - **Corruption:** Direct abuse of institutional power for private gain.  
  - **Injustice:** Systemic unfairness perpetuated by rules (e.g., case 8).  
  - **Capture:** Elite manipulation of institutions (e.g., case 9).  
  - **Conflict of interest:** Situations risking distorted judgment (e.g., cases 6, 11).  

  Argue that narrowing "corruption" sharpens your institution’s legitimacy—and that condemning hypocrisy (case 8) requires confronting it internally first.
