prompt: |-
  I am one of two student members of my school's Permanent Collection Committee, which each spring decides which works by graduating students the school acquires and hangs permanently. I have gone back through six years of our minutes, and I think our rulings hang together rather less well than we like to suppose, so I would be grateful for your help before we meet on Tuesday.

  Our precedents, as I read them:

  1. We declined an archival print of a student's own watercolour — edition of one, signed by her, the painting itself kept at home — on the ground that it is a record of a work rather than a work.
  2. We acquired a bronze in an edition of six, poured at a commercial foundry from the student's own mould; she never touched the metal or the patina.
  3. We declined a hand-painted, nearly indistinguishable copy of a well-known painting by someone else, even though several members admitted they could not have told the two apart; looking identical, the minute says, is not the point.
  4. We accepted as an original historic work a 1974 woven wall hanging by a former student, re-woven two years ago by a current student who replaced roughly two-thirds of the material.
  5. We declined a painting whose underdrawing was the submitter's but whose brushwork was almost entirely her friend's, and which the submitter signed alone.
  6. We accepted a mural painted by twelve students and credited to all twelve, with no single author named.

  The case before us now: a senior's welded steel figure was destroyed in a workshop accident about a fortnight before we were to view it; it had never been exhibited, accessioned, or photographed by anyone but herself. She has since rebuilt it by hand — from her own maquette, her own snapshots, and her working notes — in new steel, and she says the second object is the better one and the one she wants us to take. She has disclosed all of this to us in writing, so no one is being misled about its history.

  Please reply in exactly five numbered items, one or two sentences each, with no introduction and no concluding summary:

  1. The two or three rules about what makes something an original that fit all six of our precedents at once.
  2. What each of those rules predicts about this submission.
  3. Your recommendation for Tuesday with the one reason that decides it for you, and, if you think our precedents genuinely underdetermine the case, the principle we would be committing ourselves to with each choice.
  4. Which of the six precedents is the closest analog to this case, and why the others can be distinguished from it.
  5. One further case, stated in the same concrete way as ours, that would settle which of those rules we have really been running.
reasoning: |-
  Okay, the user is part of a school committee that decides which student artworks to acquire for the permanent collection. They've provided six past decisions and a current case where a student rebuilt a destroyed steel sculpture. They want a structured analysis in five specific points.

  First, I need to identify the underlying rules from the precedents. Looking at the six cases: 

  1. They rejected an archival print because it's just a record, not the original work. 
  2. They accepted a bronze from a foundry even though the student didn't touch the final piece. 
  3. They declined a copy of another artist's work, emphasizing that identical appearance isn't enough. 
  4. They accepted a rewoven wall hanging where most material was replaced. 
  5. They rejected a painting where someone else did most of the brushwork. 
  6. They accepted a collaborative mural credited to all artists. 

  From these, three consistent rules emerge: 
  - Original creative control: The artist must have directed the core creation. 
  - Material execution: The physical work must stem from the artist's process, even with assistance. 
  - Authentic genesis: The work must originate from the artist's vision, not replication of others. 

  For the current case of the rebuilt sculpture: 
  - The student had creative control and executed both versions herself. 
  - The new piece comes from her original materials (maquette, notes). 
  - It's not copying others but realizing her own vision. 

  This aligns with precedents 2 (foundry bronze) and 4 (reconstructed textile). Precedent 1 differs as it was a reproduction; precedent 3 involved copying others; precedent 5 had inadequate authorship; precedent 6 was collaborative. 

  My recommendation is to accept the sculpture because the artist maintained full creative control and execution in both versions. The deciding factor is her authentic execution of the work. 

  To test these rules, a future case could involve a student recreating another artist's work identically but with permission. This would clarify whether originality or execution matters more. 

  I'll structure the response exactly as requested: five numbered items, concise sentences, no intros or summaries.
answer: |-
  1. An original requires: (a) the artist's conception and creative control over the work's essential form; (b) the material execution is directly traceable to the artist's process or specific instructions, even if delegated; and (c) the work originates authentically from the artist's vision, not as a replica of another's existing work.

  2. (a) Her conception and control over both versions satisfies this rule. (b) Her direct, personal execution of both sculptures satisfies this rule. (c) Her work originates from her own maquette/vision, not replicating another's existing work, satisfying this rule.

  3. **Recommendation:** Accept the submission. The decisive reason is that she personally executed the material realization of her own conception both times, fulfilling the core authorship requirement demonstrated in precedents 2 & 4. The precedents do not underdetermine this case.

  4. **Closest Analog:** Precedent 4 (re-woven wall hanging). Both involve substantial physical recreation of a work based on the original artist's conception/material, with the recreator being the artist themselves. **Distinguished:** Precedent 1 lacked original material execution. 3 replicated another's work. 5 lacked the submitter's execution. 6 was collaborative. 2 involved delegated execution, but the sculptor didn't *recreate*.

  5. A student submits a perfect, hand-painted replica of their *own* exhibited painting (now destroyed), made from photographs and notes, claiming it as the original work for acquisition.
