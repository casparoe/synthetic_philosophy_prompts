prompt: |-
  My friend and I spent something like two hours last night arguing about whether being dead is bad for the person who dies, and we got nowhere — not because we disagreed about everything, but because we kept hurling examples at each other and neither of us could say what we were sorting them by. He's got the old Epicurus thing lodged in his head: death is nothing to us, when death is there you aren't, so there's nobody left for it to be bad for. He also kept pushing the symmetry point — if the stretch after you die isn't a misfortune for you, then neither is the stretch before you were born — and he says my refusal to swallow that is just fear of dying wearing a philosophy costume. I said the asymmetry is obvious and nobody thinks it's a misfortune for me that I wasn't born in 1750, and he said that I can't just assert the asymmetry, and around then we went in a circle for forty minutes.

  So here are my verdicts, assuming every death in the list is sudden, painless, and completely unforeseen, so that the process of dying and the fear beforehand can't do any work. A 32-year-old shot in the back of the head by a sniper mid-sentence, with everything going well: very bad, one of the worst things that can happen to someone. The exact same death at 93, projects finished, ready to be done: barely bad, maybe not bad at all. A composer who dies an hour after finishing the piece she's spent her life on, content: much less bad for her than dying an hour before finishing it, even though the quantity of life lost is identical. A two-and-a-half-year-old who wanders into a pool: very bad, and worse for her than the 93-year-old, even though she has no plans or ambitions or future-directed desires yet — and this is the case my friend says wrecks me if I go desire-based. A man who dies believing his marriage and his work are both fine, when in fact both collapsed years earlier and everyone hid it: something about this seems worse for him, even though nothing happens to him after he dies, and my pull here is weaker than in the sniper case. A man whose remaining decade would have been mostly miserable — untreatable pain, nothing good coming — but who desperately wants to keep going: I say death is bad for him, and my friend says I've quietly switched from counting goods to counting desires and can't help myself to both. Someone who lives entirely in the present, no projects, no ambitions, no desires about the future at all, dead at 45 out of nowhere: I lean toward still bad, but with way less confidence and no idea why. A woman who dies believing her life's central project succeeded when it actually failed years before and her friends staged the evidence: I genuinely don't know whether death is worse for her because the decade she experienced as good wasn't. Dying six months before a cure is announced versus six days before it: I feel the second is worse, but I can't tell if that's just sentimentality about near-misses. And finally, someone who dies and whose organs save three lives, versus someone who thinks about it, decides they'd want to die for a cause, and then shoves a kid out of the way of a truck: I say the organ case does nothing to cancel the badness, and the truck case maybe reduces it a bit, which I admit feels inconsistent.

  What I want is the principle underneath, if there is one. I tried writing down something like: death is bad for a person to the extent that it deprives them of the good life they would otherwise have had, with the goods counted impersonally rather than by what they happened to want — and my friend instantly said that gives the wrong answer on the miserable-decade man and makes the composer case come out as barely a loss at all, which it isn't. So: is there a single account that captures these verdicts, or is it really two or three accounts that I'm sliding between and need to choose among? Tell me which of my verdicts any candidate forces me to drop and why I should drop that one rather than the principle, state the principle precisely enough that I can test it, and then run it on a case I haven't listed — say, someone who dies young and would have gone on to have a life that was objectively excellent but that they'd have found miserable — and tell me what it says. Also, honestly: are my friend and I even disagreeing about the same question, or is he answering something like whether it's rational to fear death, or whether anything can be bad for someone who doesn't exist, while I'm answering something else entirely?
reasoning: |-
  Okay, let me try to unpack this user's problem. They had a lengthy debate with their friend about whether death is bad for the person who dies, and they couldn't resolve it. The user provided several scenarios with their intuitive judgments, seeking an underlying principle that explains them all. The friend seems stuck on Epicurus' view that death isn't bad because there's no subject to experience it, plus the symmetry argument about pre-birth non-existence.

  First, I need to understand the core disagreement. The friend is using a desire-based or experience-based account, while the user feels deprivation is key but struggles to define it. The scenarios highlight nuances: age matters, unfinished projects matter, and quality of life matters, but not always in straightforward ways. For example, the user thinks dying just before completing a life's work is worse than right after, even with identical time lost—this suggests the timing of death relative to life milestones affects badness.

  The user's attempted principle—death is bad insofar as it deprives someone of the good life they would have had—runs into problems. The miserable-decade case: if someone would suffer, deprivation says death isn't bad, but the user feels it is because the person desires to live. This points to a tension between objective goods and subjective desires. Maybe the principle needs to incorporate both, but how?

  Looking at the cases: 
  - The toddler's death feels tragic even without future-directed desires. A deprivation account could work here (losing potential goods), but the friend might counter that the toddler can't desire those future goods. 
  - The deceived cases: death seems worse if the person died believing things were fine when they weren't. But if nothing changes for them post-death, why is it worse? Unless the badness relates to the life they actually had versus the one they thought they had—but that's about life quality, not death itself. 

  The symmetry argument is tricky. The user rejects that pre-birth non-existence isn't bad, but post-death is. Deprivationism naturally creates this asymmetry: before birth, there's no subject to deprive; after death, there's a person who loses out. But the friend calls this bias. 

  For the miserable-decade case, the user insists death is bad because the person desires to live. This suggests subjective desire matters independently of objective goods. But then why is the toddler's death bad without such desires? Unless we consider potential desires or impersonal goods. 

  The organ donor vs. hero cases highlight another angle: sacrificial death might mitigate badness. But why? Because it fulfills a desire or because it adds meaning? The user feels inconsistency here—maybe extrinsic factors like legacy or impact affect perception, but not the intrinsic badness to the person. 

  The composer case suggests that narrative completion matters. Dying post-completion feels less bad because a life chapter closed. This isn't about quantity but qualitative wholeness. Could a life-narrative account help? 

  Possible principles: 
  1. Hybrid deprivation-desire: death is bad when it deprives someone of desired future goods. 
     - Solves composer (desire unmet), miserable-decade (desire present), and toddler (potential desires?). 
     - But the toddler might not have desires yet. Potential is fuzzy. 
  2. Objective list with narrative closure: death is worse when it interrupts significant life narratives or prevents achieving central goods. 
     - Explains composer, age difference, but maybe not the deceived cases or desire to live despite suffering. 
  3. Two-level account: intrinsic badness via deprivation of future goods, mitigated by factors like readiness or contribution. 
     - But the user wants a unified principle. 

  Testing on the unlisted case: someone dies young, would have had an objectively good life but hated it. 
  - Deprivationism says bad (losing good life). 
  - Desire-based says not bad (they'd not desire it). 
  - User's intuitions? Unclear, but they might lean toward not bad if the person wouldn't want it. 

  The friend might be answering "can non-existence be bad?" while the user addresses "is death a misfortune?" These are related but distinct. Epicurus denies the latter because no subject exists to be harmed. Deprivationists argue the living person is harmed by losing future goods. 

  To resolve, the user might need to: 
  - Accept that multiple factors influence badness (deprivation, desires, narrative). 
  - Define "for the person" carefully—e.g., counterfactual comparison of possible lives. 
  - Acknowledge that some intuitions (deceived cases) might be about life, not death. 

  A precise principle could be: "Death is bad for a person to the degree that it prevents the fulfillment of their reasonably expectable future desires and the realization of objectively valuable states they would have pursued, weighted by the significance of these to their life narrative." 
  - Solves composer (prevents fulfillment), miserable-decade (despite suffering, desires exist), toddler (expectable future), and age (less significance left). 
  - For the deceived: dying ignorant might not change badness, but the life itself was worse—a separate issue. 
  - Organ case: no mitigation unless saving lives fulfills a desire. Hero case: actively fulfills a desire, reducing badness. Consistency if desire-fulfillment is key. 

  But the young person with good-but-unwanted life: if they wouldn't desire it, not bad. If deprivation is objective, bad. User must choose which intuition to prioritize.
answer: |-
  You've hit on one of philosophy's thorniest debates—and your frustration is utterly understandable. The core disagreement isn't just about death; it's about what makes *anything* bad *for* a person. Your friend leans on **experience-based** or **desire-satisfaction** accounts (like Epicurus), while your intuitions point toward a **deprivation-based** view, but with wrinkles. Below, I'll dissect your cases, propose a unified principle, test it rigorously, and clarify the underlying disagreement.

  ### Your Verdicts & Their Challenges
  Let's map your intuitions to standard theories:

  | **Case** | **Your Verdict** | **Epicurus/Desire Theory** | **Simple Deprivation Theory** |
  |----------|------------------|----------------------------|------------------------------|
  | 32yo sniper | Very bad | Not bad (no subject to experience loss) | Very bad (deprived of many good years) |
  | 93yo death | Barely bad | Not bad | Mildly bad (few good years left) |
  | Composer: pre- vs. post-piece | Worse to die pre-completion | Same (no post-death experience) | Same loss of time (problem!) |
  | Toddler (2.5yo) | Very bad | Not bad (no future-directed desires) | Very bad (deprived of whole life) |
  | Deceived man (life collapsed) | Slightly worse | Not worse (ignorant = no suffering) | Same as undiscovered (problem!) |
  | Miserable-decade man | Bad (wants to live) | Not bad (future pain avoided) | *Good* (spares suffering) ← conflict |
  | Present-focused 45yo | Leaning bad | Not bad (no desires thwarted) | Mildly bad (deprived of goods) |
  | Deceived woman (project failed) | Unsure | Not worse (she died content) | Worse? (but deprivation unchanged) |
  | Death before cure: 6mo vs. 6d | 6d feels worse | Same (no experience of "near-miss") | Same loss (problem!) |
  | Organ donor vs. hero | Organ: badness unchanged. Hero: reduced | Hero: less bad (desire fulfilled) | Both equally bad (same deprivation) |

  Your friend’s desire-based view fails your toddler, composer, and miserable-decade cases. Your deprivation view ("death is bad when it deprives you of objectively good future life") fails the composer timing, deceived cases, and near-miss intuition. 

  ### The Unified Principle: **Narrative Deprivation + Threshold Desires**
  After testing your cases against major theories (deprivationism, desire-fulfillment, hedonism), a hybrid principle best captures your intuitions:

  > **Death is bad for a person to the extent that it:**
  > **1. Deprives them of future life that would have met a threshold of objective flourishing *and* contained the continuation of their core practical identity (narrative deprivation);**  
  > **2. And/or frustrates a current, strong desire to continue living that isn't irrational (desire threshold).**  
  >   
  > *Badness increases when these factors intensify; decreases when death aligns with narrative closure or desire fulfillment.*

  #### Why this works for your cases:
  - **32yo sniper**: Very bad. High flourishing potential + identity continuation (projects, relationships) + likely desire to live.  
  - **93yo "ready"**: Mildly bad. Low flourishing potential (age-related decline) + narrative closure (projects finished) → deprivation minimal.  
  - **Composer (pre-completion)**: Worse than post-completion. Dying pre-completion *narratively deprives* her of seeing her life's work fulfilled—even if time lost is identical. Post-completion, narrative closure reduces badness.  
  - **Toddler**: Very bad. High objective flourishing potential (whole life ahead) + *implicit* future desires (developmental norm: toddlers grow into beings with desires).  
  - **Deceived man**: Slightly worse. Not because of post-death events, but because his *actual life narrative was worse* than he believed. Death fixes this false narrative, making his life as a whole less flourishing—but the *deprivation* (lost future) is unchanged.  
  - **Miserable-decade man**: Bad. His strong, non-irrational desire to live overrides objective flourishing (future pain). Desire threshold dominates.  
  - **Present-focused 45yo**: Mildly bad. Low desire frustration, but still deprived of baseline flourishing (experiences, relationships).  
  - **Deceived woman**: Death isn’t worse *for her*, but her *life* was worse. Same as deceived man.  
  - **Death before cure (6d vs. 6mo)**: 6d feels worse due to *salience of nearness*, but principle says equal badness (same deprivation). You *should* drop this verdict—it’s psychological bias, not philosophical badness.  
  - **Organ donor vs. hero**:  
    - Organ donor: Badness unchanged. No narrative/desire link to dying to save others.  
    - Hero: Badness reduced. His desire/causal role in saving a life *integrates death into a positive narrative*, reducing frustration. This resolves your felt inconsistency.  

  #### Principle Strengths:
  - **Narrative deprivation** handles composer/toddler/93yo without relying on subjective desire alone.  
  - **Threshold desire** rescues the miserable-decade case.  
  - **Flourishing threshold** avoids calling death bad for someone who'd live in torture with no desire to live.  
  - **Closure/reduction** explains hero case and 93yo.  

  #### Cases You Must Drop or Revise:
  1. **6d vs. 6mo death before cure**: Equal badness. The "near-miss" feeling is sentimentality, not a difference in harm *to the person*.  
  2. **Deceived cases**: Death isn’t *worse*; the *life* was worse. Distinguish bad death from bad life.  

  ### Test on Your Unlisted Case
  **Case**: A 20yo dies suddenly. Had they lived, they’d have an objectively flourishing life (wealth, health, achievements) but *hated* it (e.g., forced into a career they loathed).  

  **Principle verdict**: Death is *not bad* for them.  
  - **Why?** No objective flourishing *for them* (they’d find it miserable). No desire threshold met (they’d desire to escape, not continue). Narrative deprivation doesn’t apply—future life wouldn’t align with their identity.  

  ### What You and Your Friend Are *Really* Disagreeing About
  You’re both answering **"Is death bad for the one who dies?"** but using different criteria:  
  - **Your friend** uses an *existence-requiring* view: Nothing can be bad for you unless you exist to experience it. He’s answering: "Can a nonexistent subject be harmed?" (Epicurus' point) + "Is fear rational?"  
  - **You** use a *counterfactual* view: Death is bad if your life would have been *better for you* had you not died now. You’re answering: "Does dying at time T make your life as a whole worse?"  

  This is why his symmetry argument (pre-birth vs. post-death) feels compelling to him but wrong to you:  
  - For him, neither pre-birth nor post-death non-existence can harm a subject.  
  - For you, post-death deprives a *existing person* of a future they’d have had; pre-birth doesn’t deprive anyone (no person was waiting to exist). The asymmetry comes from the *direction of deprivation*.  

  ### Conclusion
  Your intuitions mostly fit **narrative deprivation + threshold desires**. It’s not a slide between theories but a hybrid that handles:  
  - Flourishing-based cases (toddler, 32yo)  
  - Desire-based cases (miserable-decade man)  
  - Narrative cases (composer, hero)  

  **To persuade your friend**: Argue that death’s badness isn’t about *experiencing* harm but about *losing* a valuable future relative to the person you are. The asymmetry isn’t fear-based—it’s that only death robs an existing individual of their trajectory. If he rejects counterfactuals, you’re at a metaphysical impasse. But if he grants that we evaluate harms counterfactually (e.g., "losing my job is bad *because I’d have been better off with it*"), then death isn’t special.  

  This won’t resolve in two hours—philosophers have debated this for millennia. But at least now you know what you’re sorting by.
