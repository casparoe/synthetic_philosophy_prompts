prompt: |-
  I chair the staff recognition committee at a 250-bed community hospital. Every month we pick one person for an "above and beyond" award, and every month it goes the same way: someone tells a story, we all feel something, we vote, and then someone asks why the person who quietly did the same thing last month got nothing. I've started reading about supererogation — acts that go past duty, are praiseworthy if you do them and not blameworthy if you don't — and it looks like exactly the distinction we keep fumbling, but I can't hand a rotating ward manger a philosophy paper.

  What I need is a decision procedure we can actually run: the questions in order, in plain words, what counts as a good enough answer to each, where the answer is a firm no, and where the question stops being factual and has to go to a person as a values call. Constraints: it gets run in about twenty minutes by a manager with no training and no time, HR has to be able to defend the outcome if it's grieved, and the output is a one-paragraph citation, so the reasoning has to survive being written down and read out loud.

  Please build in the things I keep tripping over: that "it was clearly the best thing to do" doesn't by itself make something heroic rather than just your job; that praising something in public seems to turn it into an expectation within a few cycles, so what was optional in March is quietly obligatory by June and the person who doesn't do it gets blamed; and the case where the act was only needed because we understaffed something, where an award feels like it's laundering a duty into a gift. Also: half the time we can't tell what actually happened or why the person did it, and sometimes they did a genuinely good thing and then advertised it all over social media.

  Run the finished procedure on three of our real cases: (1) a nurse who came in unpaid on her day off to sit with a dying patient whose family hadn't arrived yet; (2) a porter who spent two hours of his shift hunting down a mislabelled biopsy sample; (3) a senior healthcare assistant who has covered other people's vacancies almost every week for a year, who everyone wants to honor and who I suspect the procedure will tell us not to. Then be straight with me about where it's going to misfire and where a manager just has to use judgment.
reasoning: |-
  Hmm, the user chairs a staff recognition committee at a hospital and is struggling with their monthly "above and beyond" award selection. They've identified core problems: difficulty distinguishing true supererogation from regular duties, award inflation turning optional acts into expected ones, rewarding systemic failures like understaffing, and dealing with incomplete information or self-promotion.

  They've discovered the philosophical concept of supererogation but need a practical decision tool. The tool must be: executable in 20 minutes by untrained managers, legally defensible, produce citation-ready reasoning, and address their specific pain points. They also want me to test it on three real cases and be honest about limitations.

  The recognition committee likely faces deeper issues: moral distress when praising becomes problematic, fairness concerns when consistent contributors feel overlooked, and potential erosion of trust if awards feel arbitrary or reward broken systems.

  For the decision procedure, I need something structured yet flexible. I'll design a flowchart-style questionnaire with clear thresholds. Key principles: separating duty from extra-duty, assessing voluntariness, ensuring non-repeatability without expectation creep, and filtering out systemic failures. Each question needs unambiguous criteria and failsafes.

  Handling their specific concerns: "Best thing to do" won't suffice without showing how it exceeded role requirements. I'll build in safeguards against expectation creep by requiring acts to be non-scalable or non-transferable. For understaffing, I'll include explicit checks for duty laundering. For murky facts, I'll prioritize observable actions over speculated intent. Self-promotion will be treated as irrelevant unless it contaminates the act itself.

  Testing on their cases:
  - Nurse case: Should pass - clear voluntariness (unpaid/day off), non-transferable compassion, not fixing staffing failure.
  - Porter case: Tricky - hunting samples is core duty, but duration/initiative might tip it. Probably fails unless investigation reveals extraordinary context.
  - HCA case: Likely fails - systemic issue masquerading as virtue, creates expectation creep. Better addressed through other recognition channels.

  I'll be transparent about limitations: Contextual judgment will always be needed at certain thresholds. The tool can't resolve all information gaps, and some acts will straddle the line. Managers must still decide when criteria are met ambiguously. Also, the procedure might occasionally exclude deserving but complex cases - that's why it needs pairing with other recognition forms.

  The output will be a clear step-by-step filter with decision points, sample citations for the test cases, and candid discussion of edge cases. This should give the committee a defensible, consistent framework while preserving human judgment where necessary.
answer: |-
  Here’s a **Supererogation Screening Protocol (SSP)** designed for your constraints. It’s a 5-step flowchart with clear "NO" exits, plain-language questions, and guidance on where human judgment kicks in. Each step must be passed to proceed.

  ---

  ### **Supererogation Screening Protocol (SSP)**
  *Run in order. Stop if any answer is "NO."*

  1. **WAS THIS BEYOND THEIR CORE DUTIES?**  
     *"Would a reasonable person in this role, on a typical day, be expected to do this as part of their job?"*  
     - **Good enough answer:** Specific task is absent from job description, training materials, or performance expectations.  
     - **FIRM NO if:**  
       - It’s listed in their duties (e.g., porters transport specimens).  
       - It’s an obvious emergency response (e.g., CPR by clinical staff).  
       - *Values call needed?* If duty boundaries are ambiguous (e.g., "emotional support" in nursing).  

  2. **WAS IT TRULY VOLUNTARY?**  
     *"Did they freely choose to do this without direct pressure, coercion, or significant personal cost avoidance?"*  
     - **Good enough answer:** They opted in despite personal sacrifice (time off, risk, inconvenience) and could have declined without consequence.  
     - **FIRM NO if:**  
       - They were asked/ordered by a supervisor.  
       - Avoiding disciplinary action (e.g., fixing their own error).  
       - *Values call needed?* If "pressure" is cultural (e.g., "everyone covers shifts").  

  3. **IS THIS NON-REPEATABLE WITHOUT CREEP?**  
     *"If we praise this, could it become a new silent expectation that penalizes non-participants?"*  
     - **Good enough answer:** Act is situational (e.g., unique patient need) or requires rare skills.  
     - **FIRM NO if:**  
       - It addresses chronic understaffing/systems failures.  
       - Scalable/repeatable (e.g., "always covers gaps").  
       - *Values call needed?* If the act *could* become expected but context makes it unlikely.  

  4. **WAS IT NOT A SYSTEMS FIX?**  
     *"Did this act solve a problem caused by the hospital’s failure (staffing, process, resources)?"*  
     - **Good enough answer:** Problem was unforeseeable/unavoidable (e.g., family delayed by blizzard).  
     - **FIRM NO if:**  
       - Routine understaffing, preventable error, or broken process (e.g., chronic sample mislabeling).  
       - *Values call needed?* If systems failure was minor/exceptional.  

  5. **IS THE STORY CREDIBLE & ACTION-CENTERED?**  
     *"Do verified facts (not speculation) show they *did* something extraordinary, regardless of motive?"*  
     - **Good enough answer:** Evidence from records/witnesses of actions taken. Ignore "why" and social media.  
     - **FIRM NO if:**  
       - Key facts conflict or are unverifiable.  
       - Act was self-promotional *in execution* (e.g., delayed care to record video).  
       - *Values call needed?* If evidence is circumstantial but plausible.  

  **OUTPUT:** If all 5 are "YES," write the citation using:  
  *"[Name] demonstrated exceptional initiative by [action], which exceeded core role expectations through [sacrifice/skill]. This addressed [specific situation] without creating future obligations for others."*  

  ---

  ### **Test Cases Run Through SSP**
  **Case 1: Nurse sitting unpaid with dying patient.**  
  1. **Beyond duties?** YES (sitting beyond shift is not clinical duty).  
  2. **Voluntary?** YES (unpaid, day off).  
  3. **Non-repeatable?** YES (specific patient/family timing).  
  4. **Not a systems fix?** YES (family delay isn’t hospital failure).  
  5. **Credible?** YES (schedule/attendance verified).  
  → **AWARD.** Citation: *"Demonstrated exceptional compassion by spending her unpaid day off providing companionship to a dying patient awaiting family, exceeding clinical duties through personal sacrifice for an unrepeatable circumstance."*  

  **Case 2: Porter hunting biopsy sample.**  
  1. **Beyond duties?** NO (porters are responsible for specimen transport/location).  
     → **STOP. NO AWARD.**  
     *Why it fails:* Hunting samples is literally his job. Praising this might imply others can skip it. If mislabeling is frequent, it’s a systems failure (Step 4).  

  **Case 3: Senior HCA covering vacancies for a year.**  
  1. **Beyond duties?** Unclear (HCAs may have "flexibility" expectations). *Values call:* Stretches "core duties" but might pass.  
  2. **Voluntary?** NO (Likely pressured by staffing gaps).  
     → **STOP. NO AWARD.**  
     *Why it fails:* Chronic understaffing (Step 4) and expectation creep (Step 3). Covering *once* during a crisis might pass, but routine coverage rewards system failure.  
     *Better recognition:* Thank-you note, bonus, or "Reliability Award" outside this program.  

  ---

  ### **Where This Will Misfire & Judgment Required**
  1. **Ambiguous Duties (Step 1):**  
     - *Problem:* Roles like nursing have fuzzy boundaries (e.g., is "emotional labor" core?).  
     - *Judgment needed:* Committee must define "reasonable expectation" for common roles upfront.  

  2. **Chronic Crises (Steps 3 & 4):**  
     - *Problem:* In understaffed hospitals, *everything* feels "beyond duty."  
     - *Judgment needed:* Flag acts that fix *acute* vs. *chronic* failures. Award only acute.  

  3. **Motive vs. Action (Step 5):**  
     - *Problem:* A self-promoter might still do a heroic act.  
     - *Judgment needed:* Ignore social media unless it impacted patient care.  

  4. **The "Quiet Contributor" Dilemma:**  
     - *Problem:* SSP may miss people who *consistently* do small extras.  
     - *Fix:* Create a separate "Consistent Excellence" award with different criteria.  

  **Key Safeguard:** Have the committee document *why* each step passed/failed (e.g., "Step 4: NO – biopsy mislabeling is a monthly issue per lab logs"). This creates an audit trail for HR.  

  **Final Advice:** Pair this with a quarterly review of winners to check for expectation creep (e.g., "Are nurses now pressured to work off-the-clock?"). Reset boundaries if needed. Supererogation only stays "beyond duty" if you guard the line.
