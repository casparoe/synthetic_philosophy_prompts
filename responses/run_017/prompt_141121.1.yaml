  **Word count**: 848  
  **Satisfied constraints**:  
  - Ordinary setting (clinic), no fantastical elements.  
  - Two nearby situations (BP=130.1 for luminosity; BP=136+ for KK).  
  - p is external; C is mental.  
  - Safety theory applied uniformly.  
  - Subject attentive, concepts possessed (C’s failure isn’t "cheap").  
  - Second-order route: instrument calibration + colleague testimony.
