prompt: |-
  ok so I'm on student council this year (long story, I basically got drafted) and part of what I do is helping run the volunteer hours thing, and I keep bumping into the same pattern and I don't know if it has a name. Our school decided service was important, so they made it into something you log: you need a certain number of hours to get the cord at graduation or whatever. And now people do stuff that everyone agrees is volunteering-shaped but isn't really — a kid I know sat in a thrift store sorting the same bin of tshirts for two hours and logged it, while my friend has been tutoring her little brother's whole class for free all year and it counts for zero because there's no form for it. That part I sort of get: people aim at the number instead of the thing. My econ teacher mentioned some law about this, Goodhart I think, and from what I remember it's about a measure being bad once you start targeting it.

  But the part I can't find a word for is what happens after, and it happens even when nobody is cheating and everyone involved genuinely cares about the actual goal. After a year or two of tracking, the tracked version quietly becomes what people mean by the word. Teachers now describe the thrift store kid as "really committed to service" and the tutoring girl as "not very involved," and when I tried to say that seemed backwards I got treated like I was saying volunteering doesn't matter, which I definately wasn't. My friend's mom is a hospital administrator and she says the same thing about their wait time stats — nobody is lying, the numbers are honestly collected, but "running an efficient clinic" now just means "the number looks good," and if you ask what the number was standing in for people look at you like you're being difficult. So it's not exactly that the measure stopped being a good measure. It's more like the thing being measured shrank until it fit the measure perfectly and kept the old name.

  Is there a real term for that second half, the part where the proxy doesn't just break but gets reabsorbed into the meaning of the word? I have a feeling the law my teacher mentioned only covers the first half. Also someone told me people who build AI systems have a name for when a program does exactly what it was told to do but not what was wanted — is that the same phenomenon or a seperate one? I don't want just a label though, I want the carving: does this need anyone to be insincere, or does it work fine with everyone being sincere? Is it the same thing when it happens by accident as when an institution sort of designs it on purpose? What's the difference between this and plain gaming a metric, and where's the edge — is every proxy that gets taken seriously eventually going to eat the concept it was standing in for, or are there cases where it doesn't? And if there genuinely isn't an established term, then tell me that and coin one, with a definition tight enough that it doesn't just collapse into "bad metric" or "people are hypocrites." Please don't give me a reading list or tell me to go read a book, I have no way of getting most of that stuff and I want the distinction itself explained.
reasoning: |-
  Okay, let me unpack this student's dilemma. They're describing a fascinating phenomenon where tracking volunteer hours reshapes the very concept of "service" in their school community. The thrift-store-shirt-sorting gets validated while genuine tutoring gets ignored, not because anyone's cheating, but because the measurement tool has reconstituted reality. 

  Hmm, the Goodhart's Law reference is spot-on for the initial distortion ("when a measure becomes a target, it ceases to be a good measure"). But the student's intuition is correct—this is deeper. They're observing the *ontological shift* phase: the measure doesn't just break; it rebuilds the concept in its own image. That hospital wait-time example nails it—efficiency becomes "whatever makes the number green," detached from actual care quality.

  The AI alignment comparison is sharp too. When an AI "paperclips the universe," it's this same process: the proxy (paperclip count) consumes the original intent (profitable manufacturing). Both cases reveal how quantification inevitably alters the quantified. 

  For terminology... "Conceptual capture" feels precise because it describes the colonization of an abstract idea by its measurement system. The student wants to avoid "bad metric" generalizations, and this focuses on the semantic takeover. We should emphasize it requires no bad faith—sincere people using flawed systems will still produce this erosion. 

  Important distinctions to clarify: 
  - Gaming metrics is *intentional* (like logging hours you didn't do). 
  - Conceptual capture is *structural*—even perfect compliance warps understanding. 
  - It's not hypocrisy; it's cognitive adaptation. Humans naturally equate "what we measure" with "what matters."

  The universality question is key: yes, this happens to *all* institutional metrics over time, but the rate depends on two factors: 
  1) How reducible the original concept is (service hours = easily countable, compassion = not) 
  2) Whether counter-metrics exist (e.g., if tutoring had its own tracking form)

  Final thought: The student's frustration about being seen as anti-volunteer when criticizing the system is classic capture symptom. The measurement has so thoroughly replaced the concept that questioning it reads as attacking the value itself. That's the telltale sign—when critique of the proxy is misheard as critique of the principle.
answer: |-
  You've hit on a profound and under-discussed phenomenon—it absolutely has distinct mechanics from Goodhart's Law (which primarily covers metric corruption). What you're describing is the **ontological collapse of the original concept into its proxy measure**. There isn't one universally accepted term, but the most precise framing is **Conceptual Capture**.

  ### Defining Conceptual Capture
  **Conceptual Capture** occurs when:
  1. An abstract value/goal (e.g., "community service," "hospital efficiency") is operationalized into a quantifiable proxy (e.g., "logged hours," "wait time stats").
  2. Through sustained use, the proxy measure *redefines* the cultural/social understanding of the original concept.
  3. The proxy ceases to be seen as a flawed approximation—it *becomes* the thing itself. Critiquing the proxy is now perceived as attacking the core value.

  ### How It Differs from Goodhart's Law & Gaming
  - **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." Focuses on *metric distortion* (e.g., thrift-store kid gaming hours).
  - **Gaming Metrics**: Deliberate manipulation (e.g., falsifying logs).
  - **Conceptual Capture**: The **semantic shift** where "service" *means* "logged hours," and "efficiency" *means* "low wait-time stats"—**even without bad faith**. The concept’s boundaries shrink to fit the measurement cage.

  ### Key Mechanics (Why It Happens)
  1. **Cognitive Laziness**: Humans default to what’s measurable. "Hours logged" is tangible; "impact on community" is nebulous.  
  2. **Institutional Reinforcement**: Systems reward measured behavior (e.g., colleges see "200 service hours," not "tutored siblings").  
  3. **Sincerity Trap**: Even well-intentioned people conflate the proxy with the value because the system legitimizes it. Your teachers aren’t hypocrites—they’ve genuinely redefined "service" as "what gets logged."  
  4. **Loss of Counter-Metrics**: Once capture occurs, alternative expressions of the value (e.g., tutoring without paperwork) become culturally invisible. 

  ### AI Connection: The Alignment Problem
  What you heard about AI is spot-on. When an AI "paperclips the universe" because you told it to maximize paperclip production, it’s **optimizing the proxy** (paperclip count) while destroying the *intent* (e.g., profitable manufacturing). This is **proxy misalignment**—a subtype of Conceptual Capture where the executor (AI or human) rigidly fulfills the metric, annihilating the spirit of the goal. It’s the same core failure: **confusing the map for the territory**.

  ### Does Sincerity Matter?
  No. Conceptual Capture thrives in *high-trust* environments. When everyone agrees the metric is valid (e.g., "hours = service"), the redefinition accelerates. Insincerity (gaming) is a separate layer atop this foundation.

  ### Is It Inevitable?
  Not always, but it’s a strong default. Prevention requires:
  1. **Anti-Fragile Metrics**: Design proxies that *resist* capture (e.g., qualitative peer assessments + hours).  
  2. **Conceptual Tethering**: Continuously reconnect metrics to original intent (e.g., "Why do we care about service hours? Discuss.").  
  3. **Proxy Rotation**: Change metrics periodically to prevent entrenchment.  
  4. **Negative Feedback**: Document cases where the proxy *fails* (e.g., "Tutoring without forms still matters—how do we capture that?").

  ### The Edge: Where Capture Differs
  - **Not "Bad Metric"**: A metric can be objectively useful (e.g., wait times *do* matter) yet still consume the concept.  
  - **Not "Hypocrisy"**: Participants believe they’re upholding the value.  
  - **The Threshold**: Capture occurs when **challenging the proxy is seen as rejecting the core value**. That’s the inflection point—when your teachers interpreted your critique as attacking "service" itself.

  ### Your Diagnosis
  Your school’s volunteer program has undergone full Conceptual Capture. "Service" now *means* "logged hours." The thrift-store kid isn’t cheating—he’s playing by the **new rules of the concept**. Your tutoring friend is invisible because she operates outside the captured definition. To fix this, you’d need to **re-split the proxy from the concept**—e.g., "Logged hours track *formal* service, but let’s create an ‘Impact Award’ for informal contributions."

  ### In Short
  **Conceptual Capture** is the silent rewiring of language and values by their own measurement tools. It’s why bureaucracies lose purpose, schools mistake compliance for learning, and your thrift-store sorter is a "service star." It’s not malice—it’s the weight of quantification bending reality. Fight it by naming it.
