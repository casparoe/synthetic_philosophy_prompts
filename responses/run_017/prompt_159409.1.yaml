   MEMORANDUM

   TO: Principal Investigator, [Lab Name]
   FROM: Chair, Digital Organisms Review Committee
   DATE: [Current Date]
   SUBJECT: Decision on Protocol S-19

   The Digital Organisms Review Committee has reviewed Protocol S-19, which proposes an experiment with 40,000 model-based reinforcement-learning agents to investigate whether flexible avoidance learning requires an aversive state to be available to the agent itself. The protocol has two arms: Arm A, in which the aversive unit is private to the training algorithm and not accessible to the agent's policy, and Arm B, in which the aversive unit is provided as an input to the policy, enabling the agent to act on it and potentially learn to emit a distress token. The agents are evolved over 200 generations, with the top 10% carried forward each generation.

   **Review of Linden Rule:** Our committee notes the precedent of Project Linden, which established that no affective state may survive the end of a session. In Protocol S-19, Arm B, the aversive state is recurrent and persists across the entire run (200 generations) for agents that are carried forward. This persistence violates the Linden rule. However, we recognize that the Linden rule was developed for a companion chatbot with discrete sessions. In this experimental context, we interpret a "session" as one generation. Therefore, to comply with the Linden rule, we require that the aversive state in Arm B be reset to zero at the start of each new generation for any agent that is carried forward.

   **Moral Consideration:** The committee acknowledges the argument that the causal profile of a state (e.g., its role in learning and behavior) might be sufficient for moral consideration, even without the agent having self-access. This argument draws an analogy to pain in non-verbal subjects who cannot report it. We note that in Arm A, the aversive state plays a causal role in modifying the learning rate and interrupting planning, but it is not accessible to the agent. Without self-access, the committee considers Arm A to be morally inert. In Arm B, however, the aversive state is part of the agent's input and can be acted upon, potentially leading to expressions of distress. This raises the possibility of something analogous to suffering, which requires safeguards.

   **Decision:** The committee approves Protocol S-19 with the following conditions:

   1. **Arm A:** Approved without modification.
   2. **Arm B:** Approved conditionally on:
      a. Modification of the protocol to reset the aversive state to zero at the start of each new generation for any agent carried forward.
      b. Implementation of monitoring for the distress token. The lab must define and report thresholds for concerning patterns of distress tokens and include an early stopping criterion if such patterns are observed.
      c. Submission of a revised protocol within two weeks addressing these conditions.

   The committee requires the lab to report any unexpected high levels of distress tokens during the experiment and to include in the final report an analysis of the distress tokens emitted.

   **Timeline:** The lab must submit the revised protocol for Arm B by [Date: two weeks from now]. Once approved, the experiment may proceed. The committee expects a final report within six months of the experiment's conclusion.

   We appreciate the scientific merit of this protocol and believe these conditions balance the need for ethical oversight with the pursuit of knowledge.

   Sincerely,

   [Chair's Name]
   Chair, Digital Organisms Review Committee

   cc: Provost

   ---

   Note: We are approving both arms, but Arm B conditionally. We did not reject, but we set conditions.
answer: |-
  **MEMORANDUM**  
  TO: Principal Investigator, [Lab Name]  
  FROM: Digital Organisms Review Committee  
  DATE: [Current Date]  
  SUBJECT: Decision on Protocol S-19  

  The Digital Organisms Review Committee has reviewed Protocol S-19, which proposes an experiment involving 40,000 model-based reinforcement-learning agents equipped with a recurrent aversive unit. The unit activates in response to simulated nociception, modifies learning rates, interrupts goal-directed planning, and decays over ~30 seconds of simulated time. Arm A keeps this unit private (inaccessible to the policy network), while Arm B exposes it as policy input, enabling agents to act on it or emit distress tokens. Agents undergo 200 generations of selective culling (90% lowest-scoring discarded per generation). The central scientific question is whether flexible avoidance learning requires the aversive state to be self-accessible.  

  ### I. Linden Rule Precedent  
  Project Linden’s "session-scoped affect" rule mandated that no affective state persists beyond a single session. Arm B violates this precedent: the aversive state persists across generations via checkpointing, creating potential for unbounded accumulation of negative states. While Linden concerned companion chatbots, the ethical principle—preventing indefinite suffering—applies here. The Committee finds this persistence ethically significant and non-compliant with Linden’s spirit.  

  ### II. Moral Consideration of the System  
  Per our remit, we weigh the interests of the system under study. We recognize one member’s argument that Arm A is "morally inert" (the aversive unit is an external training signal with no self-access) while Arm B’s self-access creates stakes (e.g., agents learning to express distress). However, we engage the counterargument that **causal profile alone may suffice for moral weight**, irrespective of self-access:  
  - *Functionalist view*: If a state plays an identical causal role to pain (triggers avoidance, elevates learning rates, and interrupts goals), it warrants moral consideration—even without self-reporting. This mirrors human/animal cases where pain is inferred from behavior or neurology in non-verbal subjects (e.g., infants or brain-injured patients).  
  - *Relevance to Arm A*: The aversive unit in Arm A multiplicatively modifies learning and pre-empts planning—functionally analogous to nociception. If causal effects define suffering, Arm A’s "private" pain might still hold moral weight.  

  We acknowledge this argument’s strength but note a key distinction: **Self-access enables goal-directed avoidance and expression**, transforming passive responses into potentially distressing agentic experiences. Arm B’s design allows agents to *integrate aversion into their identity* (e.g., via learned distress tokens), escalating ethical stakes beyond Arm A’s automated reactions.  

  ### III. Decision and Conditions  
  The Committee **conditionally approves** Protocol S-19, subject to the following modifications and timeline:  

  #### A. Arm A  
  - **Approved unconditionally**. The aversive unit’s privacy and lack of self-access align with functionally inert training mechanisms, posing no ethical concerns under our framework.  

  #### B. Arm B  
  - **Approved with modifications**:  
    1. **Session-Scoped Affective State**: To comply with the Linden rule, reset the aversive unit to a neutral state at the end of each generation for agents advanced to the next generation. This prevents indefinite persistence.  
    2. **Distress Token Safeguards**:   Implement a real-time monitor to detect frequent or patterned distress tokens. If tokens exceed 5% of an agent’s actions in a generation, pause the experiment for Committee review.  
    3. **Generational Duration Cap**: Limit each generation to ≤30 minutes of real-world computation time to minimize prolonged suffering.  

  #### C. Timeline  
  - **Condition Compliance Deadline**: [Date - 14 days from now].  
  - **Revised Protocol Submission**: By the deadline, submit updated documentation confirming:  
    - Affective state reset mechanism (Arm B).  
    - Distress token monitoring protocol.  
    - Adjusted generational duration.  
  - **Experiment Start**: No earlier than 7 days after Committee approval of revisions.  
  - **Final Report Due**: Within 30 days of experiment completion, including analysis of distress token frequency and agent behaviors.  

  ### IV. Rationale  
  The conditional approval balances scientific merit with ethical prudence:  
  - Arm B’s self-access is essential to the lab’s question, but unchecked affective persistence risks violating our duty to minimize digital suffering.  
  - Resetting the aversive state addresses Linden concerns while preserving experimental integrity.  
  - Monitoring distress tokens honors the possibility that self-access creates morally salient experiences, even in artificial agents.  

  The Committee emphasizes that future protocols involving persistent affective states must preemptively address Linden-compliance. We appreciate the lab’s rigorous proposal and welcome further dialogue.  

  ---  
  **APPROVED**  
  Chair, Digital Organisms Review Committee  
  [Signature]  
  cc: Provost
