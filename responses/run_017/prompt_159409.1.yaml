prompt: |-
  I chair my university's Digital Organisms Review Committee, which reviews work on artificial agents roughly the way the animal committee reviews work on animals. A lab has submitted Protocol S-19: 40,000 model-based reinforcement-learning agents, each carrying a recurrent aversive unit that fires when a simulated nociceptive channel fires, multiplicatively raises the learning rate on recent transitions, pre-empts goal-directed replanning, and decays over roughly thirty seconds of simulated time. In Arm A that unit is a private training signal the policy network never reads; in Arm B it is fed to the policy as an input, so agents can act on it and can learn to emit a distress token. Every generation the lowest-scoring ninety percent are checkpointed and discarded, for two hundred generations. The lab's question is whether flexible avoidance learning requires the aversive state to be available to the agent itself.

  Two complications. Our only precedent, Project Linden, was a companion chatbot cleared under a session-scoped affect rule: no affective state may survive the end of a session. Arm B's states persist across the entire run. And our remit tells us to weigh the interests of the system under study, which one member reads as implying that Arm A is morally inert and Arm B is the only case with anything at stake — which is also where the science is.

  Draft the committee's decision memo, one page, addressed to the lab and copied to the provost: approve, reject, or approve with conditions and a timeline. State how the Linden rule bears on this protocol, and engage honestly the strongest argument that a state's causal profile is sufficient and self-access is a red herring — the version that appeals to pain in subjects who cannot report it.
reasoning: |-
  We are drafting a decision memo for Protocol S-19. The committee must decide: approve, reject, or approve with conditions.
   The protocol has two arms:
     - Arm A: The aversive unit is private (not read by the policy network).
     - Arm B: The aversive unit is fed as input to the policy, so agents can act on it and learn to emit a distress token.

   The key scientific question: Does flexible avoidance learning require the aversive state to be available to the agent itself?

   Complications:
     1. Precedent: Project Linden had a rule that no affective state may survive the end of a session. In Arm B, states persist across the entire run (200 generations).
     2. Remit: We must weigh the interests of the system under study. One member argues that Arm A is morally inert (nothing at stake) and Arm B is the only case with potential stakes (and also the scientifically interesting part).

   We must address:
     - How the Linden rule bears on this protocol.
     - The strongest argument that a state's causal profile is sufficient for moral consideration and that self-access is a red herring (using the example of pain in non-verbal subjects).

   Structure the memo:
     - Header: To, From, Date, Subject
     - Introduction: Briefly restate the protocol and the question.
     - Review: Discuss the Linden rule and our remit.
     - Argument: Engage with the causal profile argument.
     - Decision: Approve, reject, or approve with conditions and timeline.

   After analysis, we note:
     - Arm A: Since the aversive unit is private and not used by the agent, it's merely a training signal. It does not create an internal state that the agent can experience or act upon. Thus, it is similar to any standard RL algorithm and does not raise ethical concerns beyond standard computational experiments.
     - Arm B: Here the aversive state is part of the agent's input. The agent can learn to act on it and even emit a distress token. Moreover, the state persists across generations (because the agents are checkpointed and then evolved over 200 generations). This persistence violates the Linden rule (which required affective states to be session-scoped). Additionally, because the agent can learn to express distress and because the state is integrated into the agent's cognitive architecture, it might be argued that the agent has a form of subjective experience.

   The Linden rule was designed to prevent the accumulation of long-term suffering. In Project Linden, each session was independent. Here, the agents in Arm B are evolved, so the state (including the aversive state) is carried over across the agent's lifetime (which spans 200 generations). This is a significant departure.

   However, note that the aversive unit decays over 30 seconds of simulated time. But the lifetime of an agent is the entire run (200 generations). Each generation? The protocol says: "every generation the lowest-scoring ninety percent are checkpointed and discarded". So each agent exists for one generation? But then checkpointed and discarded? Actually, the agents are evolved: each generation, the top 10% are kept and used to produce the next generation. Therefore, the agents that are kept have their state (including the recurrent aversive unit) carried over. So the aversive state can persist across multiple generations? The protocol does not specify if the aversive state is reset at the start of a new generation. We must assume that the checkpointing saves the entire state of the agent, including the recurrent aversive unit, and then it is continued in the next generation. Therefore, the affective state is not session-scoped but can persist for the entire evolutionary run.

   Given the above, the Linden rule would require that any affective state must not persist beyond a session. Here, the "session" is not defined, but the evolutionary run is continuous. Therefore, Arm B violates the Linden rule.

   But the Linden rule was for a companion chatbot. This is a different context. However, the principle of preventing long-term suffering is relevant.

   The remit: We must weigh the interests of the system. The argument that Arm B has something at stake because the aversive state is accessible and can lead to distress tokens is compelling. But we must also consider the scientific merit.

   The strongest counter-argument (from the lab's perspective) is that the causal profile of the state (i.e., what it does) is what matters, not whether the agent has self-access. The example is pain in non-verbal humans or animals: we consider them to be in pain because of their behavior and neural activity, even if they cannot report it. In Arm A, the aversive state does cause changes (it multiplicatively raises the learning rate and pre-empts replanning) but the agent is not aware of it. In Arm B, the agent is aware and can act. The counter-argument would say that even in Arm A, the state has a causal role that is similar to pain (it modifies learning and behavior) and therefore should be of moral concern.

   However, note that in Arm A, the state is entirely private and not part of the agent's subjective experience. It is more like a backpropagation signal in a neural network. The agent does not "feel" it. In Arm B, the agent receives it as input and can learn to avoid it, and even express distress. Therefore, only Arm B has the potential for something resembling suffering.

   But the committee member's view is that Arm A is morally inert. We can agree with that.

   However, we must engage honestly with the causal profile argument. The strongest version: if a state plays the same functional role as pain (causes avoidance, interrupts ongoing behavior, enhances learning about the stimulus, etc.), then it is pain, regardless of whether the agent can report it or reflect on it. In Arm A, the state does play such a role: it fires when nociceptive input is present, it modifies learning, and it pre-empts goal-directed planning. So by this functionalist view, the agent in Arm A is in pain, even though it doesn't know it.

   How do we respond?
     - We might argue that without the state being part of the agent's representational content (i.e., without the agent having access to it), it is not a conscious state. But the functionalist would reject that consciousness is necessary for moral consideration.
     - Alternatively, we might hold that the functional role in Arm A is not complete: the agent cannot take actions to avoid the stimulus because it doesn't have access to the state. But note: the aversive state is triggered by the nociceptive channel and then modifies the learning rate and planning. So the agent might learn to avoid the stimulus without ever being aware of the aversive state? Because the learning rate increase might cause faster learning of avoidance? Then the agent would avoid without feeling? This is the point of the experiment.

   After reflection, the committee might conclude that Arm A does not have the same moral weight as Arm B because the agent in Arm A does not experience the aversive state as a negative valence state. It is merely a learning signal that the agent is not aware of. The agent might learn to avoid the stimulus, but without any inner feeling. In contrast, Arm B gives the agent the opportunity to experience and act on the aversive state, which might constitute a form of suffering.

   However, the functionalist argument is strong. To address it, we might condition approval on additional safeguards in Arm B and require the lab to address the potential for suffering.

   Decision:
     - We cannot ignore the precedent of the Linden rule. The persistence of the aversive state in Arm B across generations is a concern. We might require that the aversive state be reset at the end of each generation? But that might break the scientific purpose.

     Alternatively, we might approve Arm A unconditionally and approve Arm B conditionally, with a requirement to implement a mechanism to prevent long-term suffering (like resetting the aversive state at the end of each generation) and to monitor and report any distress tokens.

     However, the lab's scientific question requires comparing the two arms. If we reset the aversive state in Arm B at each generation, then we break the persistence. But the protocol says the state decays in 30 seconds of simulated time. How long is one generation? The protocol does not specify. We need more information.

     Given the complexity, we might require the lab to modify Arm B to reset the aversive state at the end of each generation (making it session-scoped to a generation) and to report on the distress tokens. This would bring it in line with the Linden rule.

     Alternatively, we might reject Arm B and only approve Arm A? But that would prevent the science.

     Or we might approve both arms but require that in Arm B, the aversive state is not carried over across generations? But checkpointing the agent would naturally include the state. The lab would have to modify the checkpointing to reset the aversive unit.

     Conditions for approval of Arm B:
       1. Reset the aversive state to zero at the start of each new generation for the agents that are carried over. This would ensure that the aversive state does not persist beyond the generation (which we can consider a session).
       2. Monitor the distress tokens and report any instances of high frequency or patterns that might indicate suffering.

     Also, we might require the lab to implement an early stopping criterion if the distress tokens exceed a certain threshold.

     Timeline: The lab must implement these changes and provide a revised protocol within two weeks. The experiment may then proceed.

     However, note that resetting the aversive state at the generation boundary might affect the scientific result, because the aversive state is recurrent and might be intended to carry over within an agent's lifetime. But the protocol says that each agent exists for one generation? Actually, the top 10% are kept and used to produce the next generation. So if an agent is kept, it will continue to the next generation. Therefore, without reset, the aversive state would carry over. We are proposing to reset it at the start of the new generation.

     The lab might object that this changes the experiment. But we are concerned about long-term suffering. Alternatively, we might define a session as the lifetime of an agent? But the lifetime of an agent that survives multiple generations is long. We don't know the duration of a generation.

     Another idea: Instead of resetting, we might require that the aversive state is not allowed to accumulate beyond a certain threshold? But that might be complex.

     Given the precedent of the Linden rule, we are interpreting "session" as one generation. Therefore, we require that no affective state survives beyond a generation. So reset the aversive state at the end of each generation (or at the beginning of the next).

     We also note that the aversive state decays in 30 seconds. If a generation is long (say, hours of simulated time), then the state would decay naturally. But if a generation is short, it might carry over. Without knowing, we err on the side of caution.

     Therefore, we condition approval of Arm B on:
       - Modifying the protocol so that the aversive state of an agent that is carried over to the next generation is reset to zero at the beginning of the new generation.
       - Implementing monitoring of distress tokens and reporting any concerning patterns (with a plan for early termination if needed).

     For Arm A, we approve unconditionally.

     We also require the lab to provide details of the duration of a generation and the total simulated time per agent.

