answer: |-
  ### Dichotomous Key for Theories of Truth  
  **Instructions for Students:**  
  Work through the numbered couplets below. At each step, choose the description that best reflects your view. Follow the cross-reference (e.g., "go to 4") until you reach a named position (a "leaf"), an empty cell (a gap in logical space), or an unresolved pair. Allow 15 minutes. Answer honestly—your goal is to map your pre-theoretic intuitions, not to guess "correct" answers.  

  ---

  1. **Must a theory of truth explain how we generalise about truth in statements like "Everything she said was true" (where listing all claims is impossible)?**  
     - **Yes, it must handle this "generalisation job"** → go to 2  
     - **No, this is not a core task for truth** → go to 3  

  2. **Must a theory of truth fix what sentences mean (e.g., by supplying truth-conditions)?**  
     - **Yes, it must do this "semantic job"** → go to 4  
     - **No, meaning is fixed independently of truth** → go to 5  

  3. **Even if truth needn’t handle generalisation, must it play *any* role (e.g., as a norm for belief or in explaining success)?**  
     - **Yes, truth has other essential work** → **Empty Cell 1**  
     - **No, truth is redundant or illusory** → go to 14  

  4. **Can a sentence in an untranslatable language (e.g., undeciphered ancient symbols) be true before we understand it?**  
     - **Yes, its truth is independent of our grasp** → go to 6  
     - **No, truth requires interpretable content** → go to 7  

  5. **Is truth a non-negotiable norm for belief (i.e., should we only believe what is true)?**  
     - **Yes, truth inherently governs belief** → go to 8  
     - **No, truth is not inherently normative** → go to 9  

  6. **In moral discourse (e.g., "Stealing is wrong"), does calling a claim "true" add more than merely endorsing it?**  
     - **Yes, truth here reflects objective facts** → **Leaf: Substantive correspondence realism**  
     - **No, it only expresses agreement** → **Leaf: Alethic pluralism/functionalism**  

  7. **Does moral truth (e.g., "Compassion is good") require consensus or ideal human responses?**  
     - **Yes, truth depends on ideal agreement** → **Leaf: Superassertibility (epistemic view)**  
     - **No, moral truth is mind-independent** → **Leaf: Primitivism**  

  8. **Can truth explain why acting on true beliefs leads to success (e.g., finding water)?**  
     - **Yes, truth causes practical success** → **Leaf: Pragmatism**  
     - **No, success stems from justification, not truth** → **Leaf: Expressivism about truth**  

  9. **Does truth have a single, unified nature across all domains (e.g., science, comedy, ethics)?**  
     - **Yes, truth is uniform everywhere** → go to 10  
     - **No, truth varies by subject matter** → **Leaf: Alethic pluralism/functionalism**  

  10. **Is truth a property at all?**  
      - **Yes, but a minimal one** → **Leaf: Minimalism**  
      - **No, truth is not a property** → go to 11  

  11. **In "That is true" (e.g., agreeing with "Snow is white"), is "true" a redundant proxy for the original claim?**  
      - **Yes, it merely echoes content** → **Leaf: Prosententialism**  
      - **No, it ascribes a property** → **Empty Cell 2**  

  12. **Can all truth-talk be replaced by direct assertions (e.g., "Snow is white" instead of "That is true")?**  
      - **Yes, truth is eliminable without loss** → **Leaf: Deflationism (no-property)**  
      - **No, truth has ineliminable uses** → **Leaf: Minimalism**  

  13. **Is truth grounded in coherence with a belief system?**  
      - **Yes, truth is internal consistency** → **Leaf: Coherentism**  
      - **No, truth outruns coherence** → **Empty Cell 3**  

  14. **Does eliminativism about truth extend to disallowing *all* truth-claims?**  
      - **Yes, "true" must be excised from language** → **Leaf: Eliminativism**  
      - **No, we can keep truth-talk as a useful fiction** → **Empty Cell 4**  

  ---

  ### Leaves (Theories of Truth)  
  | **Leaf Name**                          | **Most Awkward Commitment**                                   | **Jobs**                                                                 |  
  |----------------------------------------|-------------------------------------------------------------|--------------------------------------------------------------------------|  
  | **Substantive correspondence realism** | Truth requires mind-independent "facts" that map to claims. | Generalisation: ✅ | Semantic: ✅ | Normative: ⚠️ (strained) | Success: ✅ |  
  | **Coherentism**                        | A claim is true only if it coheres with a specified system. | Generalisation: ⚠️ | Semantic: ✅ | Normative: ✅ | Success: ❌ |  
  | **Pragmatism**                         | Truth is defined by long-term utility of beliefs.           | Generalisation: ✅ | Semantic: ❌ | Normative: ✅ | Success: ✅ |  
  | **Superassertibility (epistemic)**     | Truth is idealised warranted assertibility.                 | Generalisation: ✅ | Semantic: ❌ | Normative: ✅ | Success: ⚠️ |  
  | **Minimalism**                         | Truth is a thin property with no hidden essence.            | Generalisation: ✅ | Semantic: ❌ | Normative: ✅ | Success: ❌ |  
  | **Deflationism (no-property)**         | "True" is a linguistic tool, not a property.                | Generalisation: ✅ | Semantic: ❌ | Normative: ⚠️ | Success: ❌ |  
  | **Prosentence theory**                 | "True" is an anaphoric shorthand (like a pronoun).          | Generalisation: ✅ | Semantic: ❌ | Normative: ❌ | Success: ❌ |  
  | **Expressivism about truth**           | Calling X "true" expresses attitude, not fact.              | Generalisation: ⚠️ | Semantic: ❌ | Normative: ✅ | Success: ❌ |  
  | **Primitivism**                        | Truth is indefinable and fundamental.                       | Generalisation: ✅ | Semantic: ✅ | Normative: ✅ | Success: ❌ |  
  | **Alethic pluralism/functionalism**    | Truth "does different jobs" in different domains.           | Generalisation: ✅ | Semantic: ⚠️ | Normative: ✅ | Success: ⚠️ |  
  | **Eliminativism**                      | Truth-talk is nonsensical and must be abandoned.            | Generalisation: ❌ | Semantic: ❌ | Normative: ❌ | Success: ❌ |  

  ---

  ### Empty Cells (Unoccupied Logical Space)  
  - **Empty Cell 1**: Rejecting the generalisation job while requiring other jobs is incoherent. If truth has work to do, it must handle blind generality.  
  - **Empty Cell 2**: Asserting that "true" ascribes no property yet isn’t merely prosentential is unexplored and unstable.  
  - **Empty Cell 3**: Combining anti-coherentism with a non-correspondence view is merely unattractive (no clear candidates).  
  - **Empty Cell 4**: Keeping truth as a "useful fiction" while denying all its jobs is pragmatically self-undermining.  

  ---

  ### Unresolved Pairs  
  - **Minimalism vs. Deflationism (no-property)**: Separated at Couplet 12. Minimalists retain truth as a property; deflationists reject any property.  
  - **Deflationism (no-property) vs. Prosententialism**: Prosententialism reduces "true" to grammatical syntax; deflationism is broader. Resolved at Couplet 11.  

  **Key Design Notes**:  
  - Cases are integrated:  
    - **Blind generalisation**: Couplet 1 (job i).  
    - **Untranslatable language**: Couplet 4 (case B).  
    - **Moral/aesthetic truth**: Couplets 6–7 (case C).  
  - Jobs structure early branches (Couplets 1–2, 5, 8).  
  - Deflationism is distinguished from eliminativism (Couplets 3, 14) and normative irrelevance (Couplet 5).  
  - 12 leaves and 4 empty cells cover specified positions and logical gaps.  

  British English compliant. No bibliographic references.
