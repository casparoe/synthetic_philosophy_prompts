prompt: |-
  I'm a PhD student in political theory and I do a bit of paid grant-reading on the side for a friend who runs a small longtermist fund, and next week I have to write up a recommendation on a proposal and I genuinely cant tell which way she'll go. Her verdicts so far:

  1. Funded $1.5M for technical AI alignment work at a university lab.
  2. Funded a medium grant to a biosecurity org doing novel-pathogen detection.
  3. Funded, small, an advocacy group pushing to slow or pause frontier AI training runs.
  4. Funded, small, a scoping project on which values early AI systems might end up locking in.
  5. Funded, small, a post-catastrophe recovery thing: knowledge preservation, seed-bank-style resilience.
  6. Funded a fellowship pipeline to grow the x-risk research field, described it as option value; but rejected an endowment for general movement-building as too diffuse to model.
  7. Rejected a GiveWell-recommended cash transfer / global health grant because the benefits dont touch the long run. Rejected a climate grant framed in near-term lives saved, then funded a smaller grant in the same space on climate stress feeding into global catastrophic risk.

  The new one is a $15M proposal: research, pilots and policy advocacy aimed at raising total factor productivity growth in a large middle-income country by roughly half a percentage point a year. The pitch is explicitly longtermist — faster growth gets us through the current dangerous period sooner and means we start using the accessible universe's resources earlier, so every year of delay wastes an astronomical number of potential lives. It also comes with a large near-term welfare component, and internally her own analysts are split on whether faster growth raises or lowers existential risk (one memo says institutional capacity and less great-power competition, the other says more diffuse capability).

  So: does she fund it? More usefully, give me the two or three rules that fit all seven verdicts above, say what each predicts about this proposal, and tell me which single variant of this case — or which one further hypothetical proposal — would best tell those rules apart. I've noticed that everything she's funded looks like either lower the chance we die or change which stuff gets built and how fast the risky stuff spreads, with nothing that just speeds everything up, but her pause grant is itself about slowing down, so I cant tell whether she's against speeding up on principle or only against speed in the specific direction the risky capabilities are moving. And if her rule makes the whole thing collapse into the empirical question of whether growth raises or lowers x-risk, say that plainly and tell me what she should do given nobody can settle it right now. Please skip citations and reading lists, I just want the reasoning.
reasoning: |-
  We are given 7 past verdicts and a new proposal. We need to infer the funding rules that explain all past decisions and then apply them to the new proposal. We are also asked to identify which variant or hypothetical proposal would best distinguish between the rules if they conflict.

  **Step 1: Summarize the past verdicts**

  1. Funded: Technical AI alignment work at a university lab. (Directly reduces AI x-risk by making AI safer.)
  2. Funded: Biosecurity org doing novel-pathogen detection. (Reduces biorisk by early detection of potential pandemics.)
  3. Funded: Advocacy group to slow or pause frontier AI training runs. (Reduces AI x-risk by slowing down dangerous capabilities development.)
  4. Funded: Scoping project on values that early AI systems might lock in. (Addresses the value alignment problem, which affects the long-term future.)
  5. Funded: Post-catastrophe recovery (knowledge preservation, seed-bank-style). (Builds resilience to increase the chance of recovery after a catastrophe, thus preserving the long-term future.)
  6. Funded: Fellowship pipeline to grow x-risk research field (option value). But rejected an endowment for general movement-building (too diffuse). (Focuses on building specific capacity for x-risk research, which has clear long-term benefits and option value, while rejecting a more diffuse approach that doesn't have a clear model of impact.)
  7. Rejected: GiveWell-recommended cash transfer / global health grant (benefits don't touch the long run). Rejected a climate grant framed in near-term lives saved, but funded a smaller grant in the same space on climate stress feeding into global catastrophic risk. (Only funds climate work when framed as reducing global catastrophic risk, not near-term benefits.)

  **Step 2: Infer the rules**

  From the above, we can deduce:

  - **Rule 1: Direct impact on reducing existential risk (x-risk) or building resilience to it.** All funded projects (1-5, and the climate GCR grant in 7) are aimed at either reducing the probability of an existential catastrophe or increasing the chances of recovery if one happens (resilience). The rejected GiveWell grant and the near-term climate grant were rejected because they didn't target the long run (i.e., didn't directly address x-risk).

  - **Rule 2: Tangible and focused impact pathway.** The rejection of the endowment for general movement-building (in 6) because it was "too diffuse" indicates that the funder requires a clear and modelable pathway to impact. The funded projects have specific mechanisms: technical research, detection systems, advocacy for a pause, scoping project, resilience building, and a fellowship pipeline (with option value, which is a specific kind of value in uncertain situations).

  - **Rule 3: Prioritize interventions that affect the trajectory of the future in a way that shapes the long-term positively, especially by influencing what gets built and how fast risky capabilities spread.** Note that the pause grant (3) is about slowing down a specific risky area (frontier AI training). The funder is not against all speed, but against the speed in risky capabilities. The funded productivity growth proposal is about speeding up overall growth to get through the dangerous period faster. However, the funder has not yet funded any project that speeds up overall technological progress or economic growth. The pause grant is about slowing down a specific risk, but it doesn't necessarily imply a stance on overall growth.

  But note: the funder rejected a climate grant that was framed in near-term lives saved but funded one that was framed in terms of global catastrophic risk. This reinforces Rule 1: the impact must be on the long-term future (x-risk or resilience).

  Now, the new proposal: $15M for raising total factor productivity growth in a large middle-income country by 0.5% per year. The longtermist pitch is that faster growth gets us through the current dangerous period (presumably the period of high x-risk from AI, bio, etc.) sooner and allows us to start using the universe's resources earlier. However, there is internal disagreement on whether faster growth raises or lowers x-risk.

  **Step 3: Apply the rules to the new proposal**

  - **Rule 1 (direct impact on x-risk):** The proposal claims to reduce x-risk by shortening the dangerous period. However, the funder's analysts are split: one says it lowers x-risk (via institutional capacity and less great-power competition), the other says it raises x-risk (more diffuse capability). Since the impact on x-risk is uncertain and disputed, this rule would likely lead to rejection because the funder has previously rejected proposals that don't clearly target x-risk (as in the GiveWell and near-term climate grants). Also, note that the near-term welfare component is not the focus for the funder (as per her past rejections).

  - **Rule 2 (tangible and focused impact):** The proposal has a clear mechanism: research, pilots, and policy advocacy to boost productivity. The impact is measurable (0.5% growth per year). However, the chain from productivity growth to x-risk reduction is long and contested. This might be too indirect and therefore "diffuse" in terms of x-risk impact, similar to the rejected endowment for movement-building.

  - **Rule 3 (shaping the trajectory):** The funder has funded projects that slow down risky capabilities (like the pause grant) but has not funded any that speed up overall progress. The proposal is about speeding up overall economic growth. If the funder is cautious about speeding up because it might increase risks (as one analyst memo suggests), then she might reject. However, if she believes that getting through the dangerous period faster is the key (as the proposal argues), then she might fund. But note: the pause grant was about slowing down a specific risk, not about slowing down everything. The funder's stance on overall growth is unclear.

  Given the internal split on the effect on x-risk, and the funder's pattern of requiring clear and direct x-risk reduction, the proposal does not meet Rule 1 because the impact on x-risk is ambiguous. Therefore, the rules predict **rejection**.

  **Step 4: What would best tell the rules apart?**

  The key uncertainty is whether the funder is willing to fund interventions that speed up overall growth to reduce the dangerous period, even when there is disagreement about the net effect on x-risk.

  To distinguish, consider a variant of the proposal:

  - **Variant A**: The same productivity growth proposal but in a context where there is strong consensus among the funder's analysts that faster growth reduces x-risk (e.g., by building institutional capacity and reducing great-power competition without increasing diffuse capability risks).

  In this case, if the funder funds it, then Rule 1 (with the requirement of clear x-risk reduction) is satisfied. If she still rejects, then she might have a deeper principle against speeding up (perhaps due to precaution about unintended consequences) or because the pathway is still too indirect.

  Alternatively, consider:

  - **Hypothetical Proposal B**: A project that aims to slow down overall economic growth in a country (without targeting a specific risk) with the argument that slower growth reduces x-risk by giving us more time to develop safety measures and reducing the rate of risky technological diffusion.

  If the funder rejects Proposal B, then she is not against speeding up per se but requires a clear x-risk reduction pathway. If she funds Proposal B, then she is consistently applying a principle of slowing down to reduce x-risk, which would explain why she funded the pause grant and might be skeptical of speeding up.

  But note: the pause grant (3) was about slowing down a specific risky activity (frontier AI training), not overall growth. So the funder might be in favor of targeted slowing but not overall slowing (or speeding).

  Therefore, the best test is:

  - **Hypothetical Proposal C**: A project that aims to speed up a specific non-risky capability that is bottlenecking safety, e.g., speeding up the development of AI alignment research tools. This is targeted speed-up.

  If the funder funds Proposal C, then her principle is not against speed per se but about the direction: she is willing to speed up safety and slow down risks. If she rejects Proposal C, then she might be generally against interventions that speed up any part of the system (which would be inconsistent with her funding of the fellowship pipeline, which is building capacity, i.e., speeding up the growth of the x-risk field?).

  Wait: the fellowship pipeline (6) is about building capacity in x-risk research, which can be seen as speeding up the development of safety knowledge. So she is willing to speed up safety.

  Therefore, the key distinction is between:

  - Speeding up safety or resilience (funded, like the fellowship and alignment work)
  - Speeding up capabilities that are ambiguous or risky (not funded, and the pause grant is about slowing down risky capabilities)

  The productivity growth proposal is not clearly in the safety category. It's general economic growth, which might include both productive and risky capabilities.

  Thus, the rule that fits all is:

  **The funder funds projects that:**
  1. **Directly and clearly reduce existential risk or build resilience to it (with a clear causal pathway).**
  2. **Have a focused and modelable impact (not diffuse).**
  3. **Target either: (a) reducing the probability of a catastrophe by intervening on specific risks (e.g., AI alignment, bio detection, pausing risky AI, studying value lock-in) or (b) building resilience (post-catastrophe recovery) or (c) building capacity for addressing x-risk (fellowship pipeline).**

  The new proposal does not clearly meet (1) because there is disagreement about the effect on x-risk. It might be too indirect and therefore not meet (2). And it doesn't specifically target safety but overall growth, which might include both good and bad.

  **Conclusion: The rules predict rejection.**

  Given that the empirical question (does growth raise or lower x-risk?) is unresolved, the funder should follow her pattern of requiring clear x-risk reduction. Since the proposal doesn't have that, she should reject.

  But note: the funder did fund the climate stress grant that was framed as feeding into global catastrophic risk. In that case, the pathway was clear: climate stress -> global catastrophic risk. Here, the pathway is growth -> (either increasing or decreasing) x-risk. The ambiguity is the problem.

  **What she should do:** Given the internal split and the lack of consensus, and her past pattern of rejecting proposals without a clear longtermist pathway, she should reject.

  However, if she is open to funding based on the potential for huge upside (if growth does reduce x-risk) and the large near-term welfare component, that would break her pattern. But the past rejections (like the GiveWell grant) show she doesn't care about near-term welfare.

  Therefore, the prediction is **reject**.
answer: |-
  Based on the seven verdicts, your funder's decisions consistently follow three core rules. I'll state each rule, explain how it fits the past decisions, predict the outcome for the new $15M proposal, and then identify a key variant to test the rules. Finally, I'll address the empirical uncertainty around growth and x-risk.

  ### Core Rules from Past Verdicts
  1. **Rule 1: Directly target existential risk (x-risk) reduction or resilience, not just long-term welfare.**  
     - Past fits:  
       - Funded AI alignment (1), biosecurity (2), AI pause advocacy (3), value lock-in scoping (4), and post-catastrophe resilience (5) because they explicitly lower the probability of extinction (e.g., by mitigating specific risks like rogue AI or pandemics) or improve recovery from catastrophes.  
       - Funded the climate stress grant (7) only when reframed as reducing global catastrophic risk, not near-term lives saved.  
       - Rejected GiveWell and initial climate grants (7) because they focused on near-term welfare without a clear x-risk link.  
     - Why it's a rule: Every funded project has a direct, actionable pathway to x-risk reduction (e.g., slowing risky capabilities, building safety systems). Near-term welfare is never sufficient alone.

  2. **Rule 2: Focus on targeted, modelable interventions, avoiding diffusion.**  
     - Past fits:  
       - Funded the fellowship pipeline (6) for its "option value" in growing x-risk talent (a high-precision, leverageable input) but rejected the endowment (6) as "too diffuse" (lacking a clear mechanism for x-risk impact).  
       - Funded technical work (1) and detection pilots (2) over broad movement-building.  
       - Even advocacy (3) and scoping (4) are narrow: they target specific levers (e.g., pausing frontier AI runs, studying value lock-in).  
     - Why it's a rule: Diffusion is penalized; funded projects have bounded scope, measurable outputs (e.g., "pause advocacy," "detection systems"), and a theory of change that can be modeled probabilistically.

  3. **Rule 3: Shape the trajectory by reducing risks or controlling the pace of dangerous capabilities, not indiscriminate acceleration.**  
     - Past fits:  
       - Funded slowing down AI capabilities via pause advocacy (3) but rejected anything that speeds up ambiguous or high-risk processes.  
       - Funded capacity-building only when it directly targets x-risk (e.g., fellowships (6) for research, not general growth).  
       - No funded projects accelerate "capability diffusion" without a clear offsetting safety mechanism (e.g., alignment (1) accelerates safety, not capabilities).  
     - Why it's a rule: Trajectory-shaping is acceptable only if it net-reduces x-risk by design (e.g., slowing risks, speeding safety). Indiscriminate acceleration is avoided because it could amplify risks (as in the rejected endowment (6)).

  ### Prediction for the $15M Productivity Growth Proposal
  - **Rule 1 prediction: Likely reject.**  
    The proposal's x-risk impact is empirically disputed (growth could raise or lower x-risk via institutional capacity vs. diffuse capability). It lacks the *direct* x-risk reduction pathway seen in funded projects (e.g., AI alignment directly targets safety; biosecurity directly targets detection). The near-term welfare component is irrelevant per Rule 1, as with GiveWell's rejection.  
  - **Rule 2 prediction: Likely reject.**  
    The intervention is broad (research, pilots, policy advocacy across a whole economy) and thus "diffuse" compared to targeted grants like biosecurity detection (2) or value lock-in scoping (4). The chain from productivity growth to x-risk reduction is complex and contested, making it hard to model reliably (unlike, say, the climate stress grant (7), which had a clear GCR link).  
  - **Rule 3 prediction: Likely reject.**  
    Speeding up general economic growth is indiscriminate acceleration—it could spread risky technologies faster (e.g., AI, biotech) without a built-in safety mechanism. This contrasts with funded projects that explicitly slow risks (pause advocacy (3)) or accelerate safety (fellowship pipeline (6)). Your funder avoids "speeding everything up" unless it directly reduces x-risk.  

  **Overall prediction: Reject.** The proposal fails all three rules: it lacks a direct x-risk link, is too diffuse, and risks amplifying dangerous capabilities. Her pause grant (3) shows she’s willing to slow specific risks, but nothing suggests she’ll fund general acceleration without clear x-risk benefits.

  ### Key Variant to Test the Rules
  To distinguish between Rule 1/2 (direct, targeted x-risk focus) and Rule 3 (trajectory-shaping with preference for slowing risks), propose:  
  - **A $15M project to accelerate AI safety R&D in the same middle-income country.**  
    - *Details:* Target productivity growth *only* in AI safety research (e.g., compute access for alignment labs, policy advocacy for safety standards). Pitch: speeding up safety shortens the dangerous period, with minimal capability diffusion.  
  - **Why it tests the rules:**  
    - If she funds it, Rule 3 is the dominant factor: she opposes acceleration only when it aids risky capabilities, not safety. This fits the pause grant (slowing risks) and fellowship (speeding safety).  
    - If she rejects it, Rule 1/2 dominate: even "safe" acceleration is too indirect or diffuse (e.g., growth might leak into capabilities).  
    This variant isolates trajectory-shaping (Rule 3) from the direct x-risk requirement (Rule 1).  

  ### Handling the Empirical Uncertainty
  Yes, her rules collapse the decision into the empirical question: **"Does this growth proposal net-reduce x-risk?"** But since this is unsettled (per the split memos), her past behavior implies:  
  - **She defaults to rejection when evidence is ambiguous.** Examples:  
    - GiveWell grants were rejected despite strong evidence for near-term benefits (Rule 1).  
    - The endowment (6) was rejected despite potential long-term value because diffusion made modeling impossible (Rule 2).  
  - **What she should do:** Reject the proposal. Funding it would break her pattern—she only funds uncontested x-risk reductions (e.g., AI alignment, bio detection) or projects where the risk-reduction mechanism is clear (e.g., pause advocacy). With no consensus on growth's x-risk impact, it becomes a speculative bet, which she avoids (Rule 2). If she were open to ambiguity, she’d have funded the endowment (6) or near-term climate grant (7).  

  **Bottom line:** Her rules prioritize precision and caution. Uncertainty on growth's x-risk impact makes this proposal a poor fit. Recommend rejection unless new evidence unequivocally shows net x-risk reduction. For your write-up, flag the diffusion and trajectory risks as key concerns.
