answer: |-
  The pro rata rule in insolvency law, while superficially straightforward, reveals a complex commitment to a specific conception of fairness upon examination. It presupposes that fairness consists in creditors bearing a burden proportional to the *nominal size of their admitted claims*, not proportional to what was realistically at stake given the estate's insufficiency. This is evident precisely in cases where a single claim dwarfs the estate, making the "realistic ceiling" for that creditor (the entire estate) radically different from their claim. The rule insists on using the claim as the denominator for calculating proportional sacrifice, even when this decouples the sacrifice from the actual maximum possible recovery.

  Several readings are possible, but each faces challenges. One might argue it embodies "equal proportional sacrifice," where sacrifice is measured against the original expectation (the claim). However, this struggles with the law's simultaneous recognition that full recovery is impossible – the "expectation" is known to be unattainable in insolvency. Why measure sacrifice against an impossible benchmark? A second reading views claims as establishing *comparable bargaining positions* or entitlements relative to each other. Fairness requires losses scaled to these relative entitlements. This better explains the focus on the claim ratio but seems arbitrary when the estate's size renders the largest claims fundamentally non-comparable in terms of achievable outcomes. A third reading emphasizes administrative simplicity and predictability: claims are verifiable facts, while "realistic ceilings" require complex, estate-specific calculations. This is pragmatically compelling but doesn't address the normative question of fairness; it suggests the rule might be underdetermined by fairness alone.

  The strongest interpretation is that pro rata reflects a procedural, claim-based conception of fairness. It treats the *admitted claim* as the foundational entitlement for distribution purposes, establishing a creditor's relative "share" in the debtor's obligations. Fairness, in this view, requires that the *loss relative to this admitted share* is proportionally equal. The legal cap limiting recovery to the claim amount reinforces this: it defines the maximum possible *distribution right*, not the realistic outcome expectation. The claim *is* the denominator because it defines the unit of participation in the distribution pool. The divergence of the realistic ceiling from the claim for large creditors is acknowledged but deemed irrelevant to this procedural fairness metric; the sacrifice is calibrated to the *nominal obligation acknowledged by the debtor*, not the *contingent value of recovery*. This view survives the divergence because it prioritizes the ex ante contractual relationship and the formal recognition of the debt over the ex post realities of insufficiency.

  Is the practice underdetermined? While simplicity arguments and path dependence play a role, the consistent choice of the *claim* as the denominator across jurisdictions, even when it conflicts with the achievable maximum, suggests a specific normative commitment. Alternatives like equal division per creditor or prioritizing small claims in full are available and sometimes used in different contexts (e.g., very small claims thresholds), but pro rata's dominance points to the claim-based proportional loss principle as the core fairness rationale.

  Implementing Kalai-SSmorodinsky (KS), which equalizes the *proportion of the realistic maximum* recovered, would require a fundamental shift. Instead of distributing based on fixed claim ratios, courts would need to calculate each creditor's individual achievable maximum (the lesser of their claim or the entire estate) *first*. The estate would then be divided to equalize the recovery *as a percentage of this individual max*. In the example, the £1M creditor's max is £200k, the £100k creditor's max is £100k. Equalizing the recovery percentage (say, X%) means X% * £200k + X% * £100k = £200k. Solving gives X ≈ 66.67%, yielding roughly £133k and £67k.

  Bankruptcy institutions would resist this. It introduces significant complexity and uncertainty compared to simple claim ratios. Determining the "realistic ceiling" for each creditor requires knowing the entire estate size *and* the full hierarchy of claims before distribution can be calculated – a potential logistical hurdle. More profoundly, it clashes with the claim-based entitlement view. KS focuses on the outcome relative to possibility, diminishing the weight of the original nominal obligation. It asks creditors to sacrifice based on what they *could* get from *this* estate, not based on what they were *owed* by the debtor. This move from a debtor-creditor obligation metric to a purely estate-constrained possibility metric represents a deep philosophical shift that existing insolvency frameworks, built on enforcing admitted claims proportionally, are structurally and normatively inclined to reject. The pro rata rule's persistence, despite the theoretical appeal of alternatives, underscores the law's commitment to fairness as proportional sacrifice relative to the nominal claim, treating those claims as the anchors for comparative justice in loss.
