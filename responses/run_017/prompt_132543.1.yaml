  **Joint Statement: Adversarial Collaboration on Method in the Science of Consciousness**

  **Introduction**

  We, the undersigned, having engaged in a year-long adversarial collaboration on the methods appropriate to the science of consciousness, hereby present this joint statement. Our collaboration was governed by the following ground rule, which we call the **ledger clause**: For every disputed claim C, each side has committed to specifying C's ledger—the set of differences that C's truth would make to any third-person detectable phenomenon (including verbal reports, behavioral responses, reaction times, neural activity, or any other objective measure). Both parties acknowledge that a claim with an empty ledger cannot be resolved by third-person scientific inquiry. However, neither party concedes that such claims are thereby empty, false, or illegitimate. This acknowledgment and refusal are central to our joint statement.

  **Section 1: Agreed Claims**

  We jointly affirm the following:

  1. Verbal reports and other first-person accounts are genuine data that must be collected and analyzed in the science of consciousness.
  2. Such reports must be gathered under pre-registered experimental protocols to minimize ad-hoc interpretations and experimenter bias.
  3. First-person reports are systematically unreliable in ways that can be partially cataloged, including but not limited to confabulation, demand characteristics, limitations of retrospection, and the effects of training or expectation.
  4. Report-based methods have yielded scientifically valuable results in specific domains; for example, in the study of blindsight, where subjects' reports of visual awareness (or lack thereof) have been correlated with behavioral performance and neural activity to reveal dissociations between perception and awareness.
  5. Neither methodological approach (heterophenomenology or neurophenomenology) possesses a privileged pipeline to the facts about consciousness; both must be subject to empirical scrutiny and methodological rigor.
  6. Each side can articulate what empirical findings would challenge its own position: 
     - For A (heterophenomenologist): A demonstration that first-person reports, treated as privileged observations, consistently yield unique and indispensable explanatory power that cannot be replicated or replaced by third-person methods alone.
     - For B (phenomenal realist): A demonstration that all properties of conscious experience can be fully accounted for, predicted, and explained solely through third-person data, with no residual explanatory gap pertaining to subjective experience itself.

  **Section 2: Residual Disagreement**

  *Neutral wording of the disagreement*:
  The core disagreement concerns whether first-person reports should be treated solely as behavioral data to be interpreted from the third-person standpoint (with no assumption of privileged access), or whether they should also be treated as observations from a first-person perspective that provide unique evidence about subjective experience, even after accounting for their fallibility.

  *Wording acceptable to A (heterophenomenologist)*:
  The science of consciousness must treat all verbal reports as texts to be interpreted with the same interpretive charity and skepticism applied to any other verbal behavior. No report should be granted special status as a direct measurement of inner experience. The aim is to construct a neutral model of the subject's believed world, without positing any ontologically private facts.

  *Wording acceptable to B (phenomenal realist)*:
  The science of consciousness must incorporate disciplined first-person reports as observations made with a distinctive instrument (the subject's introspective capacity). This instrument, while fallible and trainable, provides unique evidence about subjective experience. Renouncing this instrument risks producing a science that predicts behavior but fails to explain subjective experience itself—the very phenomenon under investigation.

  **Section 3: Cruxes**

  We identify the following cruxes as pivotal to the disagreement. For each, we specify: a neutral restatement, each side's preferred wording, an agreed test or case, each side's prediction, and what each would count as evidence against its own position.

  | Crux | Neutral Restatement | Wording for A | Wording for B | Agreed Test/Case | Prediction of A | Prediction of B | Evidence Against A | Evidence Against B |
  |------|---------------------|---------------|---------------|------------------|----------------|----------------|---------------------|---------------------|
  | **Silent Swap** | Is an intervention that swaps the neural realizers of two sensory qualities without altering any discriminable behavior or report coherent? If so, what is the ledger for the claim that the subject's experience changed? | A: The silent swap is incoherent because if all dispositions are identical, there is no fact of the matter about a change in experience. The ledger for such a change claim is empty. | B: The silent swap is coherent; it would change the subject's experience even if undetectable. The ledger for the change claim is empty, but this does not entail that no change occurred. | Thought experiment: Design a hypothetical intervention that transposes neural correlates of, e.g., red and green qualia, while preserving all behavioral and neural signatures associated with discrimination and report. | A predicts: The swap scenario is self-contradictory; any purported change would be empirically vacuous. | B predicts: The swap is conceivable and would alter subjective experience, but this alteration has no ledger because it is beyond third-person detection. | For A: A coherent description of the swap that satisfies all constraints without contradiction. | For B: A demonstration that the concept of an undetectable change is incoherent or that all meaningful claims must have a ledger. |
  | **Residue Protocol** | After thorough training in neuroscience and confabulation psychology, and cross-examination, if subjects avow that something about their experience remains uncaptured by third-person descriptions, what does this avowal signify? | A: Such avowals are further verbal behavior, interpretable as expressions of belief or cognitive bias, not evidence of an ineffable residue. | B: Such avowals reflect a persistent aspect of subjective experience that resists third-person reduction. | Pre-registered experiment: Train subjects as described, then ask: "Does any aspect of your experience resist complete third-person description?" Measure avowal rates and their stability across theoretical sophistication. | A predicts: Avowal rates will decrease with increased training, showing it is a remediable cognitive bias. | B predicts: Avowal rates will remain stable, indicating a core feature of experience. | For A: Stable avowal rates insensitive to training, suggesting a robust belief not attributable to bias. | For B: Avowal rates drop to near zero with training, showing it is eliminable through education. |
  | **Indistinguishable Interlocutor** | For a system behaviorally indistinguishable from a human in all pre-registered heterophenomenological tests, is the question "Is it conscious?" answerable in principle? | A: The question is answerable only by behavioral criteria; indistinguishability implies consciousness by definition, or the question is moot beyond behavior. | B: The question remains open and meaningful; indistinguishability does not entail consciousness, and further inquiry (e.g., architectural analysis) might provide evidence. | Construct or simulate a system passing a rigorous battery of heterophenomenological tests. Debate whether further evidence (e.g., neural architecture) could settle its consciousness. | A predicts: No new evidence beyond indistinguishability is relevant; the system is conscious for all scientific purposes. | B predicts: Indistinguishability is necessary but not sufficient; architectural features (e.g., biological realism) may provide evidence for or against. | For A: Evidence that behavioral criteria lead to contradictions (e.g., systems we agree are unconscious passing the test). | For B: Evidence that architectural criteria are either irrelevant or impossible to define non-arbitrarily. |

  *Additional crux, if any*: We find no other cruxes essential to this statement beyond these three.

  **Section 4: Closing**

  We agree that part of our disagreement is substantive and part may be verbal. 

  - **Verbal aspect**: Disagreement about the term "consciousness" itself. A views "consciousness" as a functional property fully describable by its role in behavior and cognition, while B views it as including an irreducible subjective aspect. Thus, some disputes about whether a system is "conscious" reduce to how the term is defined. However, this does not resolve the core methodological disagreement about first-person reports.

  - **Substantive aspect**: The cruxes reveal genuine disagreements about what constitutes evidence and explanation. The silent swap crux hinges on whether an empty ledger implies ontological vacuity (A) or merely epistemological limitation (B). The residue protocol tests whether a persistent avowal of ineffability is evidence of something real or a cognitive illusion. The indistinguishable interlocutor crux concerns whether consciousness can be fully defined by functional criteria.

  We acknowledge that at least one crux (silent swap) is currently untestable, as it is a thought experiment with no empirical ledger. However, its coherence is contested and bears on the nature of consciousness.

  **Bottom line**: The dispute involves both substantive disagreements about the nature and accessibility of subjective experience and verbal disagreements about the meaning of key terms, but the substantive cruxes remain unresolved and may require conceptual advances alongside empirical inquiry.

