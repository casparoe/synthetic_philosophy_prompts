  ### Joint Statement: Adversarial Collaboration on Method in the Science of Consciousness  

  **Introduction**  
  We, the undersigned—representing heterophenomenology (A) and phenomenal realism (B)—have engaged in a year-long adversarial collaboration to clarify methodological disputes in the science of consciousness. This statement reflects our good-faith effort to isolate points of agreement and disagreement, governed by the **ledger clause**: For any disputed claim *C*, each party must specify *C*’s ledger—the set of differences *C*’s truth would make to third-person detectable phenomena (e.g., reports, behavior, neural data, or other objective measures). Both parties acknowledge that a claim with an empty ledger cannot be adjudicated by third-person science. Neither party concedes that such claims are therefore empty, false, or illegitimate. This concession and refusal are integral to this document.  

  ---

  #### **1. Agreed Claims**  
  We jointly affirm:  
  1. First-person reports constitute genuine data for the science of consciousness and must be collected rigorously.  
  2. Reports must be gathered under pre-registered protocols to minimize ad-hoc interpretation, experimenter bias, and post-hoc rationalization.  
  3. Reports are systematically unreliable in cataloged ways, including confabulation, demand characteristics, retrospection errors, and training effects.  
  4. Report-based methods have yielded validated results in specific domains (e.g., blindsight), where dissociations between report and behavior reveal properties of unconscious processing.  
  5. Neither approach (heterophenomenology or neurophenomenology) holds a privileged pipeline to truth; both require empirical validation and are fallible.  
  6. Each side can specify what would challenge its view:  
     - **A**: Evidence that first-person reports, treated as direct observations of subjective facts, consistently provide unique, indispensable explanatory power beyond third-person data.  
     - **B**: Evidence that third-person methods alone can fully explain all properties of subjective experience (e.g., qualia) with no residual "explanatory gap."  

  ---

  #### **2. Residual Disagreement**  
  - **Neutral wording**: The dispute centers on whether first-person reports are solely *texts for third-person interpretation* (with no privileged access to inner states) or *observations from a unique first-person instrument* (providing irreplaceable evidence about subjective experience).  
  - **Wording for A (heterophenomenologist)**: Consciousness science must treat reports as verbal behavior to be interpreted neutrally, without granting any report privileged status as a measurement of private facts. The goal is a third-person model of the subject’s believed world.  
  - **Wording for B (phenomenal realist)**: Consciousness science must treat disciplined first-person reports as data from a distinctive observational instrument (introspection), which, despite fallibility, provides essential evidence about subjective experience. Excluding this risks explaining behavior while leaving experience itself unexplained.  

  ---

  #### **3. Cruxes**  
  We identify the following cruxes, where resolving one would shift at least one party’s position. For each, we specify:  
  - **Neutral restatement**: The core question without partisan framing.  
  - **Each side’s wording**: How A and B describe the crux in their own terms.  
  - **Agreed test**: The case, argument, or experiment both accept as bearing on the crux.  
  - **Predictions**: What A and B expect from the test, recorded in advance.  
  - **Evidence against self**: What each would count as disconfirming their position.  

  | Crux | Neutral Restatement | Wording for A | Wording for B | Agreed Test | Prediction of A | Prediction of B | Evidence Against A | Evidence Against B |
  |------|---------------------|---------------|---------------|------------|-----------------|-----------------|---------------------|---------------------|
  | **Silent Swap** | Is an intervention that swaps neural realizers of two sensory qualities (e.g., red/green) without altering discrimination, reports, or neural signatures coherent? If so, what is the ledger for "experience changed"? | A: The swap is incoherent; identical third-person data imply identical experience. The ledger for change is empty, so no claim of change is meaningful. | B: The swap is coherent; experience changes despite no detectable difference. The ledger is empty, but this reflects epistemological limits, not ontological absence. | Thought experiment: Swap neural correlates while preserving all behavior, reports, and measurable neural patterns. Debate coherence and implications. | A: Swap is self-contradictory; "change" is an illusion from misinterpreting verbal behavior. | B: Swap is possible; change occurs but is undetectable, implying consciousness transcends ledger-completeness. | A: A logically consistent swap scenario where change is intuited as real despite no ledger. | B: Proof that undetectable changes are inconceivable or that all meaningful claims require a ledger. |
  | **Residue Protocol** | After training in neuroscience/confabulation and cross-examination, if subjects avow that "something" in experience resists third-person capture, what does this signify? | A: Avowals are verbal behavior expressing beliefs, not evidence of ineffable residue. Training reduces avowals, revealing their origin in bias. | B: Avowals reflect persistent subjective residue. Stable avowals after training indicate a real aspect of experience. | Pre-registered experiment: Train subjects, cross-examine reports, then ask: "Does an uncaptured residue remain?" Track avowal rates across expertise levels. | A: Avowal rates decline with training, showing it is a confabulatory belief. | B: Avowal rates stabilize, indicating a core feature of experience. | A: Stable avowal rates despite training, suggesting robustness not attributable to ignorance. | B: Near-zero avowals after training, showing residue is eliminable through conceptual refinement. |
  | **Indistinguishable Interlocutor** | For a system indistinguishable from humans in pre-registered heterophenomenological tests, is "Is it conscious?" answerable? | A: The question is settled by indistinguishability; no further evidence is needed or meaningful. Consciousness is functional capacity. | B: Indistinguishability is insufficient; architectural or causal properties could yield evidence for/against consciousness. | Analyze a system (e.g., AI) passing a heterophenomenological battery. Debate whether non-behavioral evidence (e.g., computational architecture) could bear on its consciousness. | A: Indistinguishable systems are conscious; no "further fact" exists beyond behavior. | B: Indistinguishability is necessary but not sufficient; architectural features (e.g., biological realism) may provide evidence. | A: Cases where behavioral criteria conflict (e.g., systems we agree lack consciousness pass the test). | B: Proof that non-behavioral evidence is irrelevant or that "consciousness" reduces to behavior. |

  ---

  #### **4. Closing: Separating Substantive and Verbal Disagreements**  
  We concur that **part of the dispute is verbal**: Divergent uses of "consciousness" fuel disagreement. A treats it as a functional/behavioral capacity, while B treats it as including intrinsic subjective character. Thus, debates over "is it conscious?" in edge cases (e.g., the indistinguishable interlocutor) sometimes reduce to terminological choices.  

  However, **the cruxes reveal substantive disagreements**:  
  - The silent swap hinges on whether an empty ledger implies no fact of the matter (A) or mere undetectability (B). This is untestable but concerns what constitutes a complete explanation.  
  - The residue protocol tests whether avowals of ineffability reflect reality or illusion, with empirical implications.  
  - The indistinguishable interlocutor exposes a divide over whether third-person methods exhaust the facts of consciousness.  

  These cruxes are not merely verbal; they reflect genuine contrasts in what each side takes evidence and explanation to require.  

  **Bottom line**: The core disagreement involves both substantive issues (e.g., the epistemic status of first-person reports and the ontology of experience) and verbal elements (e.g., the meaning of "consciousness"), with the substantive cruxes remaining unresolved but amenable to iterative inquiry.  

