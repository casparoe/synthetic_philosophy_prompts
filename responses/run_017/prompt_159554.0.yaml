  The user’s additional ideas for expansion: iterated cases, unequal losses, and moving from permissibility to action. The iterated case is powerful—over many trials, (ii) leads to more deaths, which seems counterintuitive even for Taurek. This could be a strong section. Unequal losses might complicate things but could be a footnote. The permissibility-to-action section is crucial because it challenges Taurek's normative guidance.

