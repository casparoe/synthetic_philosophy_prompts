prompt: |-
  I lead a three-person environment-model team at a company that operates fleets of autonomous delivery robots inside large hospitals: the robots move pharmacy items, specimens, linen and meals along mapped corridors and through service lifts. My team owns the world model the planner reads, and we process roughly ten to fifteen change requests and incident reports per week: a corridor being re-floored, a supplier switching container, a new infection-control rule about which lifts may be used, a near-miss write-up from a porter. Right now we have no principled way to decide whether one of these is a fact to add, a fact to start watching, or evidence that the model itself is wrong about what the world contains.

  I want a decision procedure my on-call engineer can run in about thirty minutes, with a bachelor's-level engineering background and no formal logic, and then bring to a weekly ninety-minute review where two engineers sign off. Its output has to be auditable by an outside assessor months later, so each step needs to record what was decided and on what basis. Please ground it in what the frame problem literature actually distinguishes: inferring that an action left something alone without being told (the frame-axiom problem), unstated preconditions (the qualification problem), unstated downstream consequences (the ramification problem), and the version of the problem where a bounded agent has to decide what to think about at all rather than what to infer. Tell me which of those distinctions survive being turned into a half-hour checklist and which collapse under the simplification, and be explicit about which steps are judgment calls wearing procedural clothing.

  To start you off, here is the taxonomy we currently use, which I suspect is drawn in the wrong place. We call a fact baked-in when the planner could not be told about it at runtime even in principle — that a door is either open or shut, that a floor is a single level surface — flagged when it is representable and held fixed until an update arrives, and watched when something checks it at runtime with a named detector and a refresh interval. The category that actually causes our incidents is the fourth, unofficial one: silent dependencies, facts a plan's success relies on that appear in none of the three. My current rule is that every silent dependency must either get a monitor or get a named person's signature. Redraw that split if it misdescribes the problem, and add the second-order step: how to handle the case where the thing that would reveal a stale frame is itself inside the frame, because our detectors are mounted on the robots and can be occluded, mis-mounted, or simply not pointed at the relevant volume.

  Give the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it is a question about how much risk the hospital wants rather than about how the world is. Then run it on three real-shaped cases. First: a six-week renovation of the main spine corridor in which the vinyl is being replaced section by section with a different surface, hoarding narrows one stretch to well below our usual clearance, our localisation was tuned on the old floor's visual texture, and our braking distances were validated against the old floor's friction. Second: the pharmacy begins sending controlled drugs in a rigid sealed case that sits proud of the bin lip, where our bin-latched check is a simple beam break and our manifest check is a label scan; the proposed fix is to tag those deliveries large and route them into a deeper bin. Third: a near-miss report reveals that a fire door on a night route had been wedged open with a rubber stop, where our map's door state is binary and a wedged door reads as shut. At least one of these should come out with an answer that costs us something we would rather not pay — say plainly which, and what it costs. Finally, name one kind of change this procedure will systematically mishandle, and why.
reasoning: |-
  We are designing a decision procedure for the environment-model team to handle change requests and incident reports. The procedure should be executable in about 30 minutes by an on-call engineer with a bachelor's-level engineering background and no formal logic. The output must be auditable, so each step requires recording the decision and the basis for it. The procedure will be reviewed in a weekly 90-minute meeting by two engineers for sign-off.

  The procedure should be grounded in distinctions from the frame problem literature:
  1. Frame-axiom problem: inferring that an action left something alone without being told.
  2. Qualification problem: unstated preconditions for an action.
  3. Ramification problem: unstated downstream consequences of an action.
  4. The problem of what to think about (for a bounded agent).

  We will use the existing taxonomy (baked-in, flagged, watched) but refine it to avoid silent dependencies. We also need to handle the case where the detector itself is part of the frame (occluded, mis-mounted, etc.).

  We redefine the categories:
  - **Baked-in**: Facts that are inherent in the model and cannot be changed at runtime (e.g., the fundamental structure of the world). These are fixed and not updated.
  - **Flagged**: Facts that are represented in the model and held fixed until an explicit update is provided. They are not monitored at runtime.
  - **Watched**: Facts that are monitored at runtime by a named detector with a refresh interval. The detector must be reliable and available.
  - **Silent dependencies**: We aim to eliminate these by either converting them to watched or flagged, or by having a named person take responsibility.

  The procedure must also address the issue of detectors being part of the environment (e.g., mounted on robots) and thus subject to failure.

  ### Decision Procedure Steps

  The procedure is a series of questions. Each step must record:
  - The question.
  - The answer (with evidence or reasoning).
  - The decision made.

  Where the procedure stops with a "no", it means that the change cannot be handled by the current model and requires a model update or a significant change. Where it hands the decision to a person, it is because it involves risk assessment or policy decisions.

  #### Step 1: Identify the change and its source
     - **Question**: What is the change or incident? What is the source (e.g., change request, incident report)?
     - **Sufficient answer**: A clear description of the change and the source document (e.g., change request ID, incident report number).
     - **Record**: Description and source.

  #### Step 2: Determine if the change affects a baked-in fact
     - **Question**: Does this change contradict a baked-in fact? (Baked-in facts are core assumptions of the model, e.g., "a door is either open or shut", "a floor is a single level surface".)
     - **Sufficient answer**: Compare the change to the list of baked-in facts. If it contradicts, then it may require a model redesign.
     - **Decision**:
       - If **yes** (contradicts baked-in): This is a critical issue. The procedure stops with a "no" and must be escalated to the model redesign process. Record the contradiction and the baked-in fact.
       - If **no**: Proceed to step 3.

  #### Step 3: Check for existing representation
     - **Question**: Is the fact already represented in the model? (i.e., is it currently flagged or watched?)
     - **Sufficient answer**: Check the model's current representation (database, configuration files).
     - **Decision**:
       - If **yes** (already represented): Proceed to step 4 to check if the representation is adequate.
       - If **no** (not represented): Proceed to step 5.

  #### Step 4: Evaluate adequacy of current representation (if already represented)
     - **Question**: Is the current representation (flagged or watched) adequate for the change?
       - For **flagged**: Is the fact stable enough to be updated only by explicit updates? If the change is temporary or frequent, flagged might not be adequate.
       - For **watched**: Is the detector reliable and available? Consider the detector's refresh rate, accuracy, and whether it can be occluded or fail.
     - **Sufficient answer**: Assess the stability and reliability. If the change is about a temporary condition (like a renovation) and the fact is flagged, then the update frequency might be too low. If watched, check if the detector covers the new condition.
     - **Decision**:
       - If **adequate**: The change can be handled by updating the fact (for flagged) or by adjusting the detector (if needed). Then the procedure stops with a "yes" for update. Record the update plan.
       - If **inadequate**: Proceed to step 5.

  #### Step 5: Determine if the fact can be monitored (watched)
     - **Question**: Can the fact be monitored at runtime by a named detector with a known refresh interval?
     - **Sufficient answer**: Identify a detector that can sense the fact. Consider:
          - Is the detector available on the robots that traverse the relevant area?
          - Can the detector work in the conditions (e.g., lighting, occlusions)?
          - Is the refresh interval appropriate for the rate of change?
          - Also, consider the detector's own reliability: can it be occluded, mis-mounted, or not pointed at the relevant volume? (This addresses the issue where the detector is part of the frame.)
     - **Decision**:
          - If **yes** (can be monitored): Then the fact should be converted to watched. Specify the detector, refresh interval, and any necessary adjustments. Then the procedure stops with a "yes" for implementation. Record the monitoring plan.
          - If **no** (cannot be monitored): Proceed to step 6.

  #### Step 6: Determine if the fact can be flagged
     - **Question**: Can the fact be updated by an external source (like a human operator or a building management system) and then held fixed until the next update?
     - **Sufficient answer**: Assess the stability of the fact and the availability of an update mechanism. If the fact changes infrequently and there is a reliable way to get updates (e.g., from the hospital's renovation schedule), then it can be flagged.
     - **Decision**:
          - If **yes** (can be flagged): Then the fact should be flagged. Specify the update mechanism and how often it is expected to be updated. Then the procedure stops with a "yes" for implementation. Record the flagging plan.
          - If **no** (cannot be flagged): Proceed to step 7.

  #### Step 7: Silent dependency risk assessment
     - **Question**: If the fact cannot be watched or flagged, then it is a silent dependency. We must assess the risk of leaving it as silent.
     - **Sufficient answer**: This step requires judgment and risk assessment. Consider:
          - What is the probability of the fact changing?
          - What is the consequence if the planner uses a stale value? (e.g., safety, mission failure)
          - Are there any mitigations?
     - **Decision**:
          - This step hands the decision to a person (or the weekly review). The on-call engineer must document the risk and propose either:
              a) Accept the risk: Then a named person (with authority) must sign off on the risk. Record the acceptance and the signer.
              b) Mitigate by redesign: The model must be redesigned to represent the fact (which might involve changing baked-in assumptions). This is a "no" in the procedure and escalates to a model redesign.
          - The weekly review will decide between (a) and (b).

  ### How the Frame Problem Distinctions Survive
  - **Frame-axiom problem**: Addressed in step 2 (baked-in) and step 4 (if the change affects a fact that we assume doesn't change). Also in step 5 when considering if a detector can monitor the fact (so we don't have to infer it didn't change).
  - **Qualification problem (unstated preconditions)**: Addressed in step 5 and 6 when we check if we can monitor or update a precondition that we previously didn't represent. Also, step 7 when we assess the risk of a silent precondition.
  - **Ramification problem (unstated consequences)**: This is harder. We don't have an explicit step for it because it would require reasoning about downstream effects. However, in step 2 we might catch if the change affects a baked-in fact that has downstream consequences. Also, in step 7 we consider the consequences of the silent dependency. But note: this is a judgment call and might be systematically mishandled (see below).
  - **What to think about**: The procedure itself is a way to decide what to think about (by running through the steps). We focus on the change and its direct effects, but we don't do a full exploration of indirect effects (due to time constraints). This simplification collapses the full scope of the problem, but we capture the most critical aspects.

  ### Judgment Calls in Procedural Clothing
  - Step 4: Deciding if the current representation is "adequate" involves judgment about stability and detector reliability.
  - Step 5: Deciding if a fact "can be monitored" involves judgment about the detector's capabilities in the real world.
  - Step 7: Entirely a risk assessment, which is a judgment call.

