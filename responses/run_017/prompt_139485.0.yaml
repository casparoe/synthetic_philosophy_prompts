answer: |-
  Below is a decision procedure grounded in frame problem literature, designed for your on-call engineer. It explicitly addresses the frame-axiom problem (inertia assumptions), qualification problem (unstated preconditions), ramification problem (unstated consequences), and the bounded agent's "what to think about" problem. The procedure converts your existing taxonomy (baked-in, flagged, watched) into auditable steps, eliminates silent dependencies, and handles detector reliability. Steps requiring judgment calls are marked with ⚠️.

  ### **Decision Procedure: Flow & Rules**
  1. **Record all inputs, decisions, and justifications in a tamper-evident log** (e.g., shared spreadsheet with timestamps).  
  2. **Time limit**: 30 minutes. If stuck, escalate to weekly review.  
  3. **Stopping conditions**:  
     - "**No**": Change contradicts baked-in facts (Step 2) or requires model redesign (Step 7). Escalate to weekly review.  
     - "**Handoff**": Risk tolerance decision (Step 7) or ambiguity in detector reliability (Step 5).  
  4. **Sufficient answers**: Require evidence (e.g., incident reports, sensor specs, validation docs). No formal logic—use plain language.  

  ---

  ### **The Procedure: 7 Steps**
  #### **Step 1: What is the change?**  
  - **Question**: Describe the change/incident in one sentence. What is the source (e.g., change request, near-miss report)?  
  - **Sufficient answer**: Clear description + source document ID.  
  - **Output**: Log description. Proceed to Step 2.  
  - *No stopping yet.*

  #### **Step 2: Does this contradict a baked-in fact?**  
  - **Question**: Does the change violate a core, unchangeable model assumption? (e.g., "doors are open/shut," "floors are flat").  
  - **Baked-in definition**: Facts the planner *cannot* represent or update at runtime.  
  - **Sufficient answer**: Compare to baked-in list (e.g., "model assumes uniform floor friction"). If yes, cite the fact.  
  - **Decision**:  
    - **Yes**: Stop with "**No**." Log: *"Contradicts baked-in fact [X]. Requires model redesign."*  
    - **No**: Proceed to Step 3.  
  - *Surviving distinction*: Frame-axiom problem (inertia). Simplified to a checklist via pre-defined baked-in facts.  
  - *Judgment call?* No. Uses your team’s baked-in list.

  #### **Step 3: Is this fact already represented?**  
  - **Question**: Is the fact currently in the model as **watched** (runtime monitor) or **flagged** (fixed until update)?  
  - **Sufficient answer**: Check model database for existing flags/watched detectors.  
  - **Decision**:  
    - **Yes**: Proceed to Step 4 (evaluate adequacy).  
    - **No**: Proceed to Step 5 (can it be watched?).  
  - *Surviving distinction*: Bounded agent’s "what to think about." Simplified to a database lookup.  
  - *Judgment call?* No.

  #### **Step 4: Is the current representation adequate?**  
  - **Question**: For existing watched/flagged facts:  
    - **Watched**: Is the detector reliable? Consider occlusion, refresh rate, and accuracy.  
    - **Flagged**: Is the fact stable (rarely changes) and updatable?  
  - **Sufficient answer**: Evidence of detector reliability (e.g., test logs) or update frequency.  
  - **Decision**:  
    - **Adequate**: Stop with "**Yes**." Log: *"Update existing [watched/flagged] fact."*  
    - **Inadequate**: Proceed to Step 5.  
  - *Surviving distinctions*:  
    - Qualification problem (detector reliability as a precondition).  
    - Frame-axiom problem (stability of flagged facts).  
  - *Judgment call?* ⚠️ **Yes**. Reliability/stability require engineering judgment.  

  #### **Step 5: Can it be watched with a reliable detector?**  
  - **Question**: Can we monitor this at runtime? Define:  
    - Named detector (e.g., LIDAR, camera).  
    - Refresh interval (e.g., every 5s).  
    - How detector failures are handled (occlusion, mis-mounting, etc.).  
  - **Sufficient answer**: Detector spec + failure mitigation (e.g., "if occluded, robot slows down").  
  - **Decision**:  
    - **Yes**: Stop with "**Yes**." Log: *"Add watched fact. Detector: [X], refresh: [Y], failures: [Z]."*  
    - **No**: Proceed to Step 6.  
  - *Surviving distinctions*:  
    - Qualification problem (detector as a precondition).  
    - Bounded agent (prioritizing detectable facts).  
  - *Judgment call?* ⚠️ **Yes**. Detector feasibility is hardware-dependent.  
  - *Key refinement*: Addresses "detectors in the frame" by requiring failure mitigations.

  #### **Step 6: Can it be flagged?**  
  - **Question**: Can the fact be updated externally (e.g., hospital IT system) and remain fixed until the next update?  
  - **Sufficient answer**: Update mechanism (e.g., API, manual input) + max acceptable staleness (e.g., "updated daily").  
  - **Decision**:  
    - **Yes**: Stop with "**Yes**." Log: *"Add flagged fact. Update via [X], max staleness: [Y]."*  
    - **No**: Proceed to Step 7.  
  - *Surviving distinction*: Frame-axiom problem (stability between updates).  
  - *Judgment call?* Minimal. Focuses on update logistics.

  #### **Step 7: Eliminate silent dependencies or escalate**  
  - **Question**: Is leaving this as a silent dependency an acceptable risk?  
  - **Sufficient answer**: Risk assessment:  
    - Probability of failure (e.g., "low: happens once/year").  
    - Consequence (e.g., "high: robot collision").  
  - **Decision**:  
    - **Unacceptable risk**: Stop with "**No**." Log: *"Silent dependency. Requires model redesign."*  
    - **Acceptable risk**: Handoff to weekly review. Log: *"Silent dependency accepted. Risk: [X]. Escalate for sign-off."*  
  - *Surviving distinctions*:  
    - Qualification/ramification problems (unstated risks).  
    - Bounded agent (deferring uncertain decisions).  
  - *Judgment call?* ⚠️ **Yes**. Risk tolerance is a hospital policy decision.  

  ---

  ### **Redrawn Taxonomy & Key Changes**
  - **Baked-in**: Unchanging core assumptions (e.g., "doors are binary").  
  - **Flagged**: Represented, updated externally (e.g., "lift unavailable until 2025").  
  - **Watched**: Monitored at runtime *with failure mitigations* (e.g., "door state checked every 10s; if occluded, assume closed").  
  - **Silent dependencies**: Eliminated by Steps 5–7. All facts must be watched, flagged, or signed off as accepted risks.  
  - **Improvements**:  
    - Detector reliability is explicitly part of "watched" (Step 5).  
    - Silent dependencies require risk sign-off (Step 7), closing your loophole.  

  ---

  ### **Case Applications**
  #### **Case 1: Corridor Renovation**  
  - **Step 1**: Change request: Flooring replaced, clearance reduced, localisation/braking affected.  
  - **Step 2**: Does not contradict baked-in (floors can vary).  
  - **Step 3**: Floor friction/texture not explicitly represented → **No**.  
  - **Step 5**: **Can it be watched?**  
    - Friction: No direct detector. Braking tests are offline. → **No**.  
    - Localisation: Texture change can be detected via camera, but occlusion risk (people/equipment). → **Unreliable**.  
  - **Step 6**: **Can it be flagged?** Yes, but updates needed daily (staging changes). Hospital can provide schedule → **Yes**.  
  - **Step 6 Output**: Flag floor friction/texture. Update daily via renovation schedule.  
  - **Risk**: Stale data if schedule slips. → **Handoff to review for risk acceptance**.  
  - **Cost**: Daily manual updates + re-validation of braking/localisation for new surfaces ($$$ time/resources). **We’d rather not pay this.**  

  #### **Case 2: Pharmacy Sealed Case**  
  - **Step 1**: Change request: Rigid case overhangs bin, breaking latch/manifest checks.  
  - **Step 2**: Does not contradict baked-in (item size variability allowed).  
  - **Step 3**: Item size not represented → **No**.  
  - **Step 5**: **Can it be watched?** Size detection possible via 3D camera, but occlusion risk (e.g., linen covers case). → **Unreliable**.  
  - **Step 6**: **Can it be flagged?** Yes. Pharmacy can tag items as "large" at dispatch → **Yes**.  
  - **Step 6 Output**: Flag item size. Update at dispatch via pharmacy system.  
  - **Cost**: Minimal (IT integration). No escalation.  

  #### **Case 3: Wedged Fire Door**  
  - **Step 1**: Near-miss report: Door wedged open, model reads as shut.  
  - **Step 2**: Contradicts baked-in? **Yes** (model assumes door state is binary: open/shut. Wedged is a third state).  
  - **Step 2 Output**: Stop with "**No**." Log: *"Contradicts baked-in fact: 'door states are binary.' Redesign required."*  
  - **Cost**: Model redesign to support ternary states (open/shut/wedged) + new detectors.  

  ---

  ### **Systematic Weakness**  
  - **Mishandled change**: **Ramification problems** (unstated downstream consequences).  
  - **Why**: The procedure checks direct impacts (Steps 2–7) but doesn’t evaluate chain reactions (e.g., "if we reroute due to renovation, how does it affect lift congestion?"). Ramification requires holistic simulation, which exceeds 30 minutes.  
  - **Example**: In Case 1, flagging floor changes avoids silent dependencies but doesn’t catch if rerouted robots overload service lifts. This could cause new failures.  
  - **Mitigation**: Weekly reviews should run simulations for high-risk changes, but the procedure itself won’t catch it.  

  ### **Summary**  
  - **Procedure output**: Clear "Yes/No/Handoff" with audit trail.  
  - **Surviving distinctions**: Frame-axiom (Steps 2, 4, 6), qualification (Steps 4, 5), bounded agent (Steps 3, 5).  
  - **Collapsed distinction**: Ramification (prioritized due to time constraints).  
  - **Judgment-heavy steps**: 4 (adequacy), 5 (detector reliability), 7 (risk).  
  - **Costly case**: Corridor renovation (re-validation + manual updates).  

  This balances theoretical grounding with practicality. The weekly review resolves ambiguities, ensuring no silent dependencies slip through.
