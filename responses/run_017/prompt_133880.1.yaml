prompt: |-
  I convene a fortnightly seminar on moral responsibility that has now run for several years, and one argument in it recurs in nearly the same shape every time. Nearly everyone in the room now grants two things: that the bare truth of determinism cannot by itself settle whether anyone is responsible, and that some account of the reactive attitudes has to appear in any adequate theory. Past that point nothing moves. The Strawsonians — roughly, those who follow Wallace in treating holding responsible as a matter of judging that a moral obligation has been breached and of the warrant for the associated attitudes being supplied by that obligation rather than by the attitudes themselves — repeat that the rationalists have psychologised what is a normative relation. The reasons-responsiveness theorists — those who follow Fischer and Ravizza in locating responsible agency in the sensitivity to reasons of the mechanism that issues in action, with the reactive attitudes demoted to evidence or to downstream effects — repeat that the Strawsonians have described our practices without saying which agents qualify as their proper objects. A third group says Strawson quietly changed the subject; a fourth says he dissolved it. Every objection is one the other side has already absorbed.

  What makes me think this is not a single dispute is that the two sides seem to me to be picking different *explananda*. One is asking what we are doing when we hold someone responsible — whether it is an act of address, a set of attitudes, a demand that the other party register. Another is asking when it is fitting or fair to do it. A third is asking what an agent must be like in order to be a possible object of it. Each camp then treats the other camps' answers as evasions rather than as answers to a different question. I want that hypothesis tested against three cases I have found useful for separating the questions.

  First, the one-sided community. Imagine a population with intact moral judgment and intact self-directed reactive attitudes — guilt, remorse, a sense of owing repair — but no other-directed ones: no resentment, no indignation, no gratitude. They register injuries to themselves as damage to be repaired and as reasons to revise their expectations of the injurer, and they never resent anyone. Do they hold one another responsible? The theories appear to diverge here, and it is unclear to me whether the divergence is descriptive (could such a psychology exist, and would it be stable, given that resentment may do work in enforcing norms that repair alone cannot do) or normative (would the practice be missing something, or merely be less clamorous than ours).

  Second, address without an audience: blame directed at the dead, at a permanently unconscious wrongdoer, at a corporation, at a system incapable of registering the address. If holding responsible is essentially transactional, these look degenerate; if it is not, the participant stance is not doing the constitutive work it is credited with. Our practice seems to split — we blame the dead but hesitate to punish them, and we demand apologies we know cannot arrive.

  Third, a calibration test. Suppose it turned out empirically that resentment is keyed tightly to the cost of an injury and the closeness of the injurer and only loosely to the injurer's reasons-sensitivity, so that our attitudes are badly calibrated to the property the rationalists care about. Is that a debunking discovery or an irrelevant one? Both sides can claim it, which suggests to me that the live issue is the direction of explanation, not any fact awaiting discovery.

  My hypothesis, then, is that the standoff is several disputes sharing a name: a conceptual question about which phenomenon is to be explained; a first-order normative question about the conditions under which blame is fair; a hidden empirical question about the actual structure and plasticity of the reactive attitudes; and possibly a bedrock disagreement about whether a moral life without blame would be impoverished or merely quieter.

  I do not want a verdict on which theory is true, and I do not want a survey of the literature or a reading list. I want a diagnosis of the disagreement itself, grounded in what each position actually claims, and an argument for the diagnosis rather than an assertion of it. Tell me which of these disagreements — or which other one — is really doing the work, and whether the conceptual, the normative and the empirical strands can be pulled apart at all. Then, given your diagnosis, tell me what would count as progress for the seminar: a distinction that dissolves the appearance of conflict (the fittingness of an attitude versus the fairness of a practice, say, or the split between attributability, answerability and accountability), an empirical result, a formal result, or a change of question. If your diagnosis implies that no progress should be expected, say so and say what the seminar should do with the hour instead. Argue for your answer in about 1,200 words, and say plainly where your diagnosis is itself contested.
reasoning: |-
  Okay, the user is running a long-standing seminar on moral responsibility where the same debate keeps happening between Strawsonians and reasons-responsiveness theorists. They've noticed that everyone agrees on two points: determinism doesn't automatically settle responsibility, and reactive attitudes are crucial. But beyond that, there's deadlock. The user thinks this isn't one debate but several conflated questions, and they want me to diagnose the core disagreement rather than pick sides.

  Hmm, the user presents three test cases to tease apart the questions: the one-sided community (only self-directed reactive attitudes), address without an audience (blaming the dead/corporations), and a calibration test (if resentment doesn't track reasons-sensitivity). These are clever thought experiments designed to expose fault lines.

  The user's hypothesis is compelling—that the standoff stems from conflating distinct questions: (1) conceptual (what is holding responsible?), (2) normative (when is it fair?), (3) empirical (how do reactive attitudes actually work?), and possibly (4) foundational (is blame essential to morality?). They want me to argue for this diagnosis grounded in what each position claims, not just assert it. 

  First, I need to map the camps. The Strawsonians (following Wallace) see holding responsible as a normative practice based on obligation breaches, where reactive attitudes are constitutive. The rationalists (Fischer/Ravizza) treat responsibility as about reasons-sensitivity mechanisms, with attitudes as mere evidence. Third groups think Strawson changed or dissolved the subject. 

  The key insight is that each camp prioritizes a different *explanandum*. Strawsonians focus on the *practice* of holding responsible—its grammar and social function. Rationalists care about *agent-qualification*—what makes someone fit to be held responsible. This explains why they talk past each other: Strawsonians see rationalists as missing the practice's point; rationalists see Strawsonians as dodging the fairness question. 

  Now, testing against the cases:
  - **One-sided community**: Strawsonians would say yes, they hold responsible via self-attitudes and repair demands. Rationalists might say no, lacking other-attitudes undermines the practice's core. But this divergence reveals the conceptual split: what counts as "holding responsible"?
  - **Address without audience**: Strawsonians struggle here if the stance requires reciprocity. Rationalists can accommodate it if reasons-sensitivity exists independently. This exposes the normative question—is blame fitting without possibility of answer?
  - **Calibration test**: If resentment ignores reasons-sensitivity, Strawsonians might call it irrelevant (attitudes define the practice) while rationalists see debunking (showing attitudes misalign with true responsibility). Here the empirical and normative clash: should attitudes track reasons-sensitivity, or is resentment itself the standard?

  The deeper tangle is between three strands: 
  1. **Conceptual**: What phenomenon are we explaining? (Practice vs. agent-property)
  2. **Normative**: What justifies blame? (Obligation breaches vs. reasons-sensitivity)
  3. **Empirical**: How plastic are reactive attitudes? (Can they be retrained?)

  Progress requires disentangling these. First, distinguish *attributability* (agent owns action), *answerability* (agent can explain), and *accountability* (agent owes response). The cases show they can come apart: dead wrongdoers pass attributability but fail accountability. 

  Next, formalize the questions explicitly in sessions:
  - Q1 (Conceptual): What constitutes holding responsible? 
  - Q2 (Normative): When is it fair to do so?
  - Q3 (Agent-qualification): What capacities make someone responsible?
  - Q4 (Empirical): How do attitudes actually function?

  For the seminar, use the cases to force theorists to specify which question they're answering. The calibration test could spark empirical work—e.g., can resentment be recalibrated? If not, maybe rationalists need to adjust their theory.

  Where might this be contested? Some Strawsonians (like Miranda Fricker) argue practices can't be divorced from normative foundations. Rationalists might insist reasons-sensitivity must ground fairness. Still, separating the questions reveals why agreement is hard—they're not even arguing about the same thing. 

  The seminar should shift from "who's right?" to mapping which questions each theory addresses best. Progress isn't consensus but clearer disagreement. For the next hour, apply the three cases to each strand separately. This won't resolve everything but might unstick the debate.
answer: |-
  ## Diagnosis: The Tangle of Strands in Moral Responsibility

  Your hypothesis is profoundly correct: the standoff arises because **three distinct but entangled questions are being conflated under the single label "moral responsibility"**, and each major camp prioritizes a different *explanandum* while treating the others' concerns as secondary or derivative. The core dispute isn't primarily about determinism or the *existence* of reactive attitudes, but about **what phenomenon "moral responsibility" fundamentally names** and **where the explanatory priority lies**. Let's dissect the strands, test against your cases, and chart a path for progress.

  ### The Three Entangled Strands

  1.  **The Conceptual/Phenomenological Question (Q1): What *is* the practice of "holding responsible"?** This asks for a constitutive account of the phenomenon itself. What are we *doing* when we blame or praise? Is it primarily an attitude (resentment, indignation), a speech act (address, demand), a normative judgment (breach of obligation), or a social practice (enforcing norms)? Strawsonians (especially Wallace-inspired) prioritize this question. For them, responsibility *is* embedded in the "participant stance" and its reactive attitudes. To explain responsibility *is* to explicate this normative practice. Answering "when it's fair" (Q2) or "who qualifies" (Q3) flows *from* understanding this practice and its internal norms (like the excusing conditions Strawson identified).

  2.  **The Normative Fairness Question (Q2): When is it *fair* or *fitting* to hold someone responsible?** This asks for the justification conditions of the practice. What makes blame deserved or praise merited? This is the primary driver for Reasons-Responsiveness (RR) theorists like Fischer & Ravizza. They start from the intuition that it's unfair to blame someone who couldn't have recognized or acted on the relevant moral reasons. Their *explanandum* is the *justified application* of responsibility practices. They seek an agent-focused property (reasons-sensitivity) that grounds fairness. Strawsonian practices are seen as descriptively interesting but normatively inert without this grounding.

  3.  **The Agent-Qualification Question (Q3): What capacities must an agent possess to *be* responsible?** This asks about the properties of the agent that make them a potential target of Q1 and Q2. RR theorists explicitly target Q3 (reasons-sensitivity of the mechanism). While Strawsonians might *derive* conditions from the practice (e.g., sanity, minimal understanding), Q3 isn't their primary starting point. They might see answers to Q3 as emerging *from* the structure of the practice and its excusing conditions, not as an independent foundation.

  **The Conflation & Talking Past:** The standoff occurs because:
  *   **Strawsonians treat Q1 as fundamental.** They see RR's focus on Q2/Q3 as an illegitimate attempt to find a "theory" *behind* or *justifying* the practice from some external, supposedly more objective standpoint (the "objectivity of theory" vs. the "objectivity of the interpersonal"). When RR theorists demand an account of "who qualifies," Strawsonians hear a request to justify the practice from outside its own norms – which they see as impossible or changing the subject. RR's focus on mechanisms seems like a psychologizing reduction of a normative relation.
  *   **RR Theorists treat Q2/Q3 as fundamental.** They see Strawsonian accounts of Q1 as merely *describing* our practices without providing the crucial normative *justification* for them. Without an account of what makes an agent *fairly* held responsible (Q2 based on Q3), the practice seems arbitrary or culturally relative. Strawsonian talk of "participant stances" seems like avoiding the core issue of fairness and agent capacities.
  *   **Both view the other's answer as an evasion** precisely because they prioritize different *explananda*. For Strawsonians, RR answers a *different* (and perhaps misguided) question; for RR theorists, Strawsonians haven't answered the *crucial* question.

  ### Testing Against Your Cases

  1.  **The One-Sided Community:**
      *   **Q1 (Conceptual/Phenomenological):** Strawsonians likely say **No, they do not hold responsible** in the full sense. Holding responsible constitutively involves the *interpersonal* reactive attitudes (resentment, indignation, gratitude). Self-attitudes like guilt show the *agent* takes responsibility, but the *community* lacks the core practice of holding *others* responsible via other-directed blame. The absence of resentment signifies the absence of the participant stance *towards others*. Repair and revised expectations might be pragmatic or rule-following, but lack the distinctive emotional/attitudinal core of blame.
      *   **Q2/Q3 (Normative Fairness/Agent-Qualification):** RR theorists might say **Yes, they *could* hold responsible** *if* they judged breaches of obligation and agents possessed reasons-sensitivity. The *absence* of resentment is irrelevant to the core question of fairness/qualification. They might argue such a community *should* hold responsible (if agents are reasons-responsive) to enforce norms fairly, even if their psychology currently lacks resentment. The divergence highlights whether the *practice* (Q1) is defined by its emotional attitudes or by its normative judgments/effects.
      *   **Diagnostic Reveal:** This case forces the question: Is the reactive attitude (resentment) *constitutive* of holding responsible (prioritizing Q1), or is it merely a common *consequence* or *enforcement mechanism* separable from the core normative judgment of obligation-breach and fairness (prioritizing Q2/Q3)? The disagreement is both conceptual (defining the phenomenon) and normative (what *should* the practice involve?).

  2.  **Address Without an Audience:**
      *   **Q1 (Conceptual/Phenomenological):** This directly challenges the Strawsonian emphasis on the participant stance as a *transaction*. Blaming the dead or comatose feels like a degenerate case *if* holding responsible requires a reciprocal relationship or potential uptake. It suggests the core might be a *judgment* or *attitude* held by the blamer, not necessarily a completed transaction. Strawsonians might struggle, perhaps calling it an attenuated or symbolic form of the stance.
      *   **Q2/Q3 (Normative Fairness/Agent-Qualification):** RR theorists have less trouble. If the *agent* (when capable) possessed reasons-sensitivity and breached an obligation (Q2/Q3), then blame can be *fitting* or *fairly directed* at them, even if they cannot respond *now*. The inability to punish or receive an apology is a practical limitation on *enforcement* or *repair*, not necessarily on the *fairness of the blame itself* or the *attribution of responsibility*. Our split practice (blame but no punishment) reflects this distinction between attributing responsibility (fitting) and demanding certain responses (feasible/enforceable).
      *   **Diagnostic Reveal:** This case exposes the tension within Q1: How essential is *actual reciprocity* or *potential response* to the very concept of holding responsible? It also highlights the distinction between *attributing* responsibility (which might persist) and *seeking accountability* or *enforcement* (which requires an agent capable of responding). RR theorists more easily separate these.

  3.  **The Calibration Test:**
      *   **Q1 (Conceptual/Phenomenological):** Strawsonians would likely see this as **irrelevant or even confirming**. If resentment tracks injury cost and relationship closeness, that *is* part of the structure of our actual reactive attitudes as described by Strawson. It reflects the "vicarious" nature of indignation and the personal stake in resentment. How well it tracks an external property like reasons-sensitivity doesn't debunk the practice; it just describes how our attitudes *actually function* within the practice. The practice is defined by these attitudes, not by their correspondence to RR's preferred property.
      *   **Q2/Q3 (Normative Fairness/Agent-Qualification):** RR theorists would see this as **potentially debunking** or at least a serious problem. If our primary blaming emotion (resentment) is poorly calibrated to the property that *actually makes blame fair* (reasons-sensitivity), then our practices are systematically unfair or misguided. It suggests we are often blaming people too much or too little based on irrelevant factors (cost, closeness) rather than the crucial factor (capacity). This demands reform of our attitudes or practices to better track the true grounds of fairness.
      *   **Diagnostic Reveal:** This is the clearest clash of **explanatory direction** and **normative priority**. For Strawsonians (Q1), the attitudes *define* the practice; their structure is the datum. For RR theorists (Q2/Q3), the attitudes are fallible indicators or consequences that *should* track an independent normative ground (reasons-sensitivity). The discovery forces the question: Should our theory of responsibility *reflect* and *explain* our actual attitudes (even if "miscalibrated" by some external standard), or should it provide a *normative standard* by which to *evaluate and potentially correct* those attitudes?

  ### The Bedrock: Normative Priority and the Point of Morality

  Underpinning these disagreements is a deeper, often implicit, divergence: **What is the fundamental point or function of responsibility practices within morality?**

  *   **Strawsonians (Prioritizing Q1):** Tend to see responsibility practices as constitutive of the moral community itself – the framework of mutual demand and expectation that defines our interpersonal relationships. Blame isn't primarily about retribution or efficient norm-enforcement; it's an expression of the import of the relationship and the violation. A life without blame might be "quieter," but it would lack the depth of engagement and recognition that defines full moral personhood *for us*.
  *   **RR Theorists (Prioritizing Q2/Q3):** Tend to see responsibility practices as primarily serving functions like fairness, desert, and the regulation of conduct through praise and blame. The point is to hold people accountable *only* when it's fair, based on their capacities and opportunities. A life without blame *could* be morally equivalent, perhaps even superior, if norms were maintained through other means (like the repair-focused community), as long as fairness is upheld. The "moral community" is defined by shared norms and reasons, not necessarily by shared reactive attitudes.

  ### Diagnosis Summary

  The core problem is **conflation and misaligned priorities**. The seminar is stuck because participants are:
  1.  **Conflating Distinct Questions:** Q1 (What is holding responsible?), Q2 (When is it fair?), Q3 (Who qualifies?).
  2.  **Prioritizing Different Questions:** Strawsonians anchor in Q1; RR theorists anchor in Q2/Q3.
  3.  **Misinterpreting Answers:** Treating answers to one question as attempted (but failed) answers to the other.
  4.  **Hiding Deeper Commitments:** Differing views on the fundamental point of responsibility within morality.

  **Contested Aspects of this Diagnosis:** Some Strawsonians might argue their account *does* answer Q2/Q3 internally (via excusing conditions derived from the practice). Some RR theorists might argue their mechanism *is* part of the concept of agency relevant to Q1. Proponents of "quality of will" or "attributability" accounts might argue they bridge Q1 and Q3 better than either camp. Others might argue Q1 *cannot* be cleanly separated from Q2, as the practice is inherently normative.

  ### Prescription: Paths to Progress for the Seminar

  Given this diagnosis, progress requires **disentangling the strands and shifting focus from "Which theory wins?" to "Which question are we asking, and how do the theories address *it*?"**

  1.  **Explicitly Separate the Questions:** Begin every discussion by clarifying: "Are we asking what holding responsible *is* (Q1), when it's *fair* (Q2), or what capacities make someone *capable* of it (Q3)?" Use your three cases as diagnostic tools *specifically for this purpose*. Force participants to state which question their argument addresses.
  2.  **Adopt Distinctions that Unpack the Strands:**
      *   **Attributability vs. Accountability:** (T.M. Scanlon, T. M. Scanlon, Gary Watson). Attributability (Q3-lite/Q1): Does this action reflect on the agent's evaluative stance/character? Accountability (Q2/Q3): Does the agent owe a response (e.g., blame, apology, justification)? This helps parse the one-sided community (attributability might hold, accountability falters) and address without audience (attributability holds, demanding accountability is impossible).
      *   **Answerability:** (Hilary Bok, Pamela Hieronymi). Focuses on Q3: Can the agent *answer* for their action? This provides a distinct capacity-based perspective potentially different from reasons-sensitivity (emphasizing justificatory capacity).
      *   **Fittingness vs. Fairness:** (Pamela Hieronymi, David Shoemaker). Fittingness: Is the attitude (resentment) an appropriate response to the *wrong* itself (links to Q1/Q3 via quality of will)? Fairness: Is it appropriate to *express* that attitude or impose burdens on *this agent* given their capacities and context (Q2/Q3 - reasons-sensitivity)? This directly addresses the Calibration Test: Resentment might be *fitting* to the wrong but *unfair* to express if the agent lacked reasons-sensitivity.
  3.  **Focus on Explanatory Direction:** Explicitly debate the Calibration Test and Address Without an Audience cases to force the issue: *Must* a theory of responsibility start with/privilege the actual structure of our reactive attitudes (Strawsonian), or can/must it start with an independent normative standard for fairness/agent-capacity (RR)? Is resentment definitive of blame or evidence for it?
  4.  **Empirical Engagement (Cautiously):** Discuss the *plausibility* of the One-Sided Community – is resentment psychologically/culturally indispensable for norm maintenance? What does empirical psychology say about the actual determinants of resentment (Calibration Test)? Does it track perceived intent, harm, relationship, or something else? This won't resolve normative debates but can test descriptive assumptions within theories.
  5.  **Shift the Ultimate Question:** Instead of "What is moral responsibility?" or "Who is responsible?", focus on: "**What work do our responsibility concepts and practices do for us?**" and "**Are these functions best served by practices grounded in reactive attitudes, reasons-sensitivity, or something else?**" This frames the disagreement as a choice about what we *want* responsibility to be and do, making the normative priorities explicit.

  **What Progress Looks Like:** Progress isn't consensus on a single theory. It is:
  *   **Clarity:** Participants consistently distinguish Q1, Q2, Q3, and the distinctions like Attributability/Accountability or Fittingness/Fairness.
  *   **Charity:** Participants accurately articulate *which* question the opposing camp is primarily answering and why it prioritizes that question.
  *   **Targeted Disagreement:** Arguments focus on why one's preferred *explanandum* (Q1 vs Q2/Q3) is fundamental, or why a specific distinction resolves a case better, rather than repeating generic "psychologizing" or "descriptive" accusations.
  *   **Acknowledged Trade-offs:** Recognition that prioritizing one strand (e.g., the interpersonal practice) might come at the cost of providing a fully independent normative justification (RR's demand), and vice-versa.

  **If Progress Seems Impossible:** If disentangling strands only reveals irreconcilable starting points (e.g., Strawsonians insist Q1 *is* the whole subject; RR theorists insist Q2 *must* be answered first), then the seminar should explicitly **map the foundational commitments**. Spend the hour debating: "What is lost if we abandon reactive attitudes as constitutive?" vs. "What is lost if we abandon reasons-sensitivity as the fairness ground?" This meta-discussion about the *point* of responsibility might be the most honest and revealing conversation possible, accepting that the field encompasses distinct, potentially incommensurable, projects sharing a name. The goal becomes understanding the landscape of disagreement, not overcoming it.
