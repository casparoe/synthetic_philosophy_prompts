prompt: |-
  I sit on the technical advisory panel of a private conservation funder whose charter was recently amended to add the welfare of wild animals as an objective alongside biodiversity and carbon. The amendment is easy to read and hard to use. It tells us to weigh wild animal welfare but not how, and every concrete decision in front of us turns on the same unresolved cluster of questions: whether draining a coastal wetland for rice paddy reduces suffering or merely relocates it, whether poisoning the rats on a seabird island is a welfare gain or a massacre, whether planting conifers on abandoned pasture creates welfare or destroys it, whether vaccinating a wild herd against a disease counts as a benefit when it works by preventing lives from existing.

  Before we commission any modeling, I want the specification. Write the desiderata that any adequate account of the net welfare of an ecosystem must meet: what a theory has to deliver to be good enough for our purpose, which is to rank land-use interventions competing for a fixed five-year budget, and to return a reasoned not-yet-determinable in the cases where it cannot honestly rank them.

  Fix the purpose as above, and assume the following background, which the panel treats as settled. Invertebrate sentience is unresolved. There is no cardinal interspecies scale of welfare, and no prospect of individual-level welfare data at landscape scale: what we can obtain are abundances, life histories, and remote sensing. Population size and age structure are endogenous to whatever we do, so the ledger cannot hold fixed the set of animals it is assessing. Effects propagate past the project boundary and past the budget window, and the systems are rarely at equilibrium.

  Give me the requirements as a numbered list, each with the case or background consideration that motivates it, and be specific about the distinctions it forces. I expect at least these to be addressed: the difference between how well a life goes, how many lives there are, and how long they last; the difference between the welfare of the animals in a place and the value or integrity of the place itself; the fact that an index denominated in animals, or in biomass per hectare, is not yet an index of welfare; the choice about whether death is a loss to the animal who dies or merely the termination of a future, and how much of a verdict's sign depends on that choice; the fact that interventions change who exists later, so the counterfactual is not a fixed population with a different welfare level; displacement of harm outside the assessed boundary; and sensitivity of the verdict to the spatial boundary, the time horizon, and the cut-off for which organisms count at all.

  For each requirement say whether it is non-negotiable, negotiable, or a preference of one camp dressed up as a requirement. Some candidate demands I want ruled in or out explicitly: that the account never recommend killing a sentient animal; that it treat intactness or naturalness as carrying independent weight; that it never aggregate across species; that it reproduce the judgment that a functioning ecosystem is a good thing; that it be expressible without any claim about which animals have lives worth living.

  A consultant has proposed that we simply rank projects by expected net welfare-years per hectare-year, integrated over a century and discounted at three percent, with each animal weighted by the probability that it is sentient. Use that proposal as the stalking horse: state what such an index would have to presuppose, and where it meets or fails the list you have built.

  Two further things I care about more than the rest. First, whether some subset of the desiderata cannot be jointly satisfied, so that the specification is itself a negative result: say which, and what would have to be given up. I suspect there is a deep tension between being fine-grained enough to discriminate between interventions and being computable from the coarse data we can actually get. Second, which single requirement does the most work in excluding otherwise attractive candidates.

  Close with a compact table, no more than a few lines each, scoring four families of approach against the most discriminating requirements: suffering-focused consequentialism, totalist hedonic accounting over wild populations, biodiversity- or integrity-based views that treat welfare as downstream of ecological condition, and views that constrain what may be done to wild animals regardless of the arithmetic. Keep the weight on the criteria rather than the scoring. Argue from the cases; do not cite anything.
reasoning: |-
  We are building a specification of desiderata for an account of net ecosystem welfare to rank land-use interventions for a conservation funder. The account must handle:
  - Endogenous populations (changing who exists)
  - Lack of individual-level welfare data (only abundances, life histories, remote sensing)
  - No cardinal interspecies welfare scale
  - Uncertain sentience (especially invertebrates)
  - Propagation of effects beyond project boundaries and time windows
  - Non-equilibrium systems

  The purpose is to rank interventions competing for a fixed budget over a 5-year horizon, with the ability to return "not-yet-determinable" when ranking is impossible.

  We must address:
  1. The components of welfare: quality of life, number of lives, duration of life.
  2. Welfare of animals vs. value/integrity of the place.
  3. Why abundance/biomass indices are not welfare indices.
  4. Whether death is a loss or merely termination, and how this affects verdicts.
  5. The counterfactual problem (interventions change who exists).
  6. Displacement of harm outside boundaries.
  7. Sensitivity to spatial/temporal boundaries and sentience cutoffs.

  We also need to rule on candidate demands (e.g., never kill sentient animals, naturalness has weight, no aggregation, must endorse functioning ecosystems, no claims about lives worth living).

  We have a stalking horse proposal: expected net welfare-years per hectare-year over 100 years at 3% discount, weighted by sentience probability.

  Finally, we must:
  - Identify any insurmountable tensions (especially between discrimination and computability).
  - Identify the most discriminating requirement.
  - Score four families of approaches in a table.

  Let's build the desiderata as a numbered list.

  **Desiderata for an Account of Net Ecosystem Welfare**

  1. **Distinguish Welfare Components (Quality, Quantity, Duration)**
     - *Motivation*: Interventions affect how well individuals live (quality), how many individuals exist (quantity), and how long they live (duration). We must account for these separately because:
       - Draining a wetland may reduce the number of animals but improve the quality of life for the remaining ones (e.g., by reducing disease). 
       - Poisoning rats may shorten lives (negative duration) but prevent predation on seabirds (improving quality and duration for birds). 
       - Planting conifers may create new habitats (increasing quantity) but with unknown quality.
     - *Distinctions forced*: We cannot collapse welfare into a single metric (like biomass) without specifying how these components trade off. We must decide if we value more lives of lower quality vs. fewer of higher quality.
     - *Status*: Non-negotiable. Without this, we cannot model the core effects.

  2. **Separate Animal Welfare from Place Value**
     - *Motivation*: The funder's charter now includes both biodiversity/carbon and animal welfare. We must not conflate the intrinsic value of an ecosystem (e.g., biodiversity, naturalness) with the welfare of its inhabitants. Example: A pristine forest may have high integrity but contain animals suffering from high predation and disease. Conversely, a managed habitat may have lower naturalness but higher welfare.
     - *Distinctions forced*: We must not assume that "intact" ecosystems are better for welfare. Draining a wetland might reduce biodiversity (a loss for place value) but improve welfare (if it reduces suffering). The account must independently track welfare.
     - *Status*: Non-negotiable. The charter amendment demands weighing welfare alongside other objectives; we cannot let it be absorbed by existing goals.

  3. **Reject Abundance/Biomass as Welfare Proxies**
     - *Motivation*: More animals or more biomass per hectare does not imply better welfare. Example: Planting conifers on pasture may increase biomass and abundance (e.g., of insects) but the welfare of those insects might be poor (e.g., due to harsh conditions). Similarly, poisoning rats reduces abundance but might prevent future suffering (if rat lives are net negative) or cause suffering (if net positive).
     - *Distinctions forced*: We need welfare estimates that go beyond counts. This forces us to model quality of life (e.g., via life history traits, environmental stressors) even without individual data.
     - *Status*: Non-negotiable. This is a core reason the amendment is "hard to use."

  4. **Account for the Nature of Death**
     - *Motivation*: Whether death is a harm depends on whether the life that would have been lived is worth living. Example: Vaccinating a wild herd prevents deaths but also prevents future lives (if herd size is density-dependent). If those future lives are net negative, prevention might be a welfare gain. Conversely, killing a rat might be a harm if its life was net positive.
     - *Distinctions forced*: We must adopt a stance on:
       - The "deprivation account" of death (death is bad because it deprives of future good) vs. "termination only" (death is neutral, only suffering matters).
       - Whether we compare existence vs. non-existence for potential lives.
     - *Status*: Negotiable in theory, but non-negotiable to specify. Without this, we cannot model interventions that change population sizes (like vaccination or culling). However, the choice of stance is a value judgment the panel must make.

  5. **Handle Non-Identity Problem (Changing Who Exists)**
     - *Motivation*: Interventions change future populations. The counterfactual is not a fixed set of animals with altered welfare, but a different set of animals. Example: Vaccinating a herd changes which individuals are born (due to timing and survival). Draining a wetland might replace wetland species with rice paddy species.
     - *Distinctions forced*: We cannot use a "same-number" comparison. We must decide how to value the welfare of individuals who exist only in one scenario. This requires a "total" or "averagist" view (or other) of population ethics.
     - *Status*: Non-negotiable. This is inherent in landscape-scale interventions.

  6. **Account for Displacement and Leakage**
     - *Motivation*: Effects propagate beyond project boundaries. Example: Poisoning rats on an island might cause rats to recolonize from elsewhere, shifting harm. Draining a wetland might push waterfowl to a worse habitat. We cannot assess welfare only within the project area.
     - *Distinctions forced*: We need a spatial boundary for assessment, but must model spillover effects. This complicates data collection (requires regional context).
     - *Status*: Non-negotiable for accuracy, but negotiable on how far to extend the boundary (practical constraint).

  7. **Control for Sensitivity to Boundaries and Cutoffs**
     - *Motivation*: The verdict should not flip with small changes to:
       - Spatial boundary (e.g., 1 km vs. 10 km buffer).
       - Time horizon (e.g., 50 vs. 100 years).
       - Sentience cutoff (e.g., including/excluding insects).
       Example: Draining a wetland might look positive over 10 years (due to reduced disease) but negative over 100 (due to carbon loss affecting climate and global welfare). Similarly, including insects might make conifer planting negative (if insect suffering dominates).
     - *Distinctions forced*: We must set these parameters explicitly and test robustness. The account must not be arbitrarily sensitive.
     - *Status*: Non-negotiable for transparency, but the specific settings are negotiable.

  **Ruling on Candidate Demands:**

  - *Never kill a sentient animal*: **Ruled out** as a requirement. This is a deontological constraint, but our task is consequentialist weighing. Example: Poisoning rats might be net beneficial if it prevents more suffering in seabirds.
  - *Treat intactness/naturalness as carrying independent weight*: **Ruled out**. This conflates place value with welfare (see Desideratum 2).
  - *Never aggregate across species*: **Ruled out**. We must aggregate to get net welfare, but we can do so cautiously (e.g., using sentience weights). Without aggregation, ranking is impossible.
  - *Reproduce the judgment that a functioning ecosystem is a good thing*: **Ruled out**. We are to weigh welfare, not assume ecosystems are inherently good for welfare. A "functioning" ecosystem might have high suffering.
  - *Be expressible without claims about lives worth living*: **Ruled in** as a preference. We can design the account to avoid needing a binary "worth living" judgment by focusing on welfare ranges (e.g., net positive/negative). This is negotiable but desirable to reduce controversy.

  **Stalking Horse Proposal Assessment:**

  Proposal: Expected net welfare-years per hectare-year, integrated over 100 years at 3% discount, weighted by sentience probability.

  - *Presuppositions*:
    - Welfare is cardinally measurable and interpersonally comparable (across species and individuals).
    - Death is a loss proportional to future welfare (deprivation account).
    - We can estimate individual welfare duration and quality from coarse data (abundances, life histories).
    - The value of a life is its integrated welfare (totalist view).
    - Sentience probabilities are knowable and multiplicative.

  - *Where it meets desiderata*:
    - Separates welfare components (by integrating quality and duration).
    - Rejects biomass as proxy (uses welfare estimates).
    - Handles changing populations (by summing over all individuals in the counterfactual populations).
    - Can account for sentience uncertainty (via weights).

  - *Where it fails*:
    - **Quality vs. quantity trade-off**: It adopts total welfare (more lives are better if net positive) without allowing for averagist or other views. This is a value choice that may not align with the panel's (e.g., creating many barely-positive lives might be preferred over fewer very good ones).
    - **Death as harm**: It assumes the deprivation account. If we think death is neutral, the index overstates the harm of killing.
    - **Displacement**: It requires defining a fixed spatial boundary for integration, but may miss effects outside it unless the boundary is huge.
    - **Sensitivity**: The verdict is highly sensitive to time horizon (100 years) and discount rate (3%). It may also be sensitive to sentience cutoffs (e.g., if insects are included with low probability).
    - **Data**: It assumes we can estimate welfare per animal from coarse data, which is dubious (e.g., how to map life histories to welfare?).

  **Tensions and Negative Results:**

  - *Tension between discrimination and computability*: To discriminate between interventions (e.g., draining vs. not draining), we need fine-grained welfare estimates. But with only abundances and life histories, we cannot observe welfare directly. We must rely on models (e.g., linking environmental stress to welfare) that are speculative and data-hungry. **This is a deep tension.** We must either:
    - Accept coarse, uncertain welfare proxies (risking arbitrary rankings), or
    - Invest heavily in welfare modeling (which may exceed budget/time).

  - *Most discriminating requirement*: **Handling the non-identity problem (Desideratum 5)**. This excludes any account that holds the population fixed (e.g., traditional welfare economics applied to animals). It forces us into population ethics, which is philosophically fraught and computationally hard (e.g., tracking which individuals exist in each scenario).

  **Assessment of Four Families of Approaches:**

  We'll use a table. Criteria are the most discriminating desiderata (from above):
  - D1: Distinguish welfare components.
  - D2: Separate welfare from place value.
  - D4: Account for the nature of death (requires a stance).
  - D5: Handle non-identity (changing populations).
  - D6: Control displacement/leakage.
  - D7: Control sensitivity to boundaries.

  Scoring:
  - ++: Fully addresses (explicitly and robustly)
  - +: Partially addresses (or with caveats)
  - -: Poorly addresses (or contradicts)
  - --: Actively violates

  | Approach                          | D1: Components | D2: Welfare vs. Place | D4: Death | D5: Non-Identity | D6: Displacement | D7: Boundaries |
  |-----------------------------------|----------------|------------------------|-----------|-------------------|------------------|----------------|
  | **Suffering-Focused Consequentialism** (e.g., minimize net suffering; may prioritize reducing intense suffering) | ++ (Focus on quality, especially suffering) | ++ (Ignores place value) | -- (Death may be good if prevents suffering; rejects deprivation) | + (Counts all affected lives) | - (May ignore positive spillovers) | - (Highly sensitive to sentience cutoff) |
  | **Totalist Hedonic Accounting** (Sum total welfare over all individuals, as in stalking horse) | ++ (Explicitly integrates quality and duration) | + (Can be separated, but may use same data) | + (Assumes deprivation) | ++ (Naturally handles changing populations) | - (Requires arbitrary boundaries) | -- (Highly sensitive to time horizon and discount rate) |
  | **Biodiversity/Integrity-Based Views** (Welfare is downstream of ecological condition; e.g., healthy ecosystems → better welfare) | - (Conflates abundance with welfare) | -- (Conflates welfare with place value) | ? (Depends on implementation) | - (May assume fixed population) | + (Can model ecosystem-wide) | + (Uses established ecological boundaries) |
  | **Constraint-Based Views** (Deontological rules; e.g., no killing, no interference) | - (Ignores components; focuses on actions) | + (Welfare independent, but not quantified) | N/A (Rules override) | N/A (Rules override) | + (Avoids leakage by non-intervention) | + (Not sensitive if no action) |

  **Arguments from Cases:**

  - *Suffering-Focused*: 
    - Pro: Draining a wetland might be good if it reduces disease (suffering). 
    - Con: It might ignore the welfare gain from new rice paddy species (if focused only on reducing suffering).
  - *Totalist*: 
    - Pro: Vaccinating a herd is good if it leads to more net-positive lives. 
    - Con: It may recommend creating large populations of barely-sentient insects in conifer plantations (high quantity, low quality).
  - *Biodiversity-Based*: 
    - Pro: Preserving a seabird island is good because it's "natural." 
    - Con: It may oppose rat poisoning even if rats cause immense suffering to birds.
  - *Constraint-Based*: 
    - Pro: Avoids the rat poisoning "massacre." 
    - Con: May prevent interventions that reduce net suffering (e.g., draining a disease-ridden wetland).

  **Conclusion:**

  The specification reveals a core tension: We need welfare estimates to discriminate interventions, but lack the data for reliable estimates. The most discriminating requirement is handling changing populations (non-identity). The stalking horse proposal (totalist) is a starting point but fails on sensitivity and data demands. We must either embrace uncertainty (returning "not-yet-determinable" often) or invest in welfare modeling.
answer: |-
  ### Desiderata for an Account of Net Ecosystem Welfare  
  *Purpose: Rank land-use interventions for a fixed 5-year budget, with "reasoned not-yet-determinable" where ranking is impossible.  
  Background: Uncertain invertebrate sentience; no cardinal interspecies welfare scale; only abundances/life histories/remote sensing available; endogenous populations; effects propagate beyond boundaries/time; non-equilibrium systems.*

  #### Numbered Desiderata (Non-negotiable unless noted)  
  1. **Distinguish welfare components (quality, quantity, duration)**  
     *Motivation*: Interventions affect how well lives go (quality), how many lives exist (quantity), and lifespan (duration). Failure to separate these conflates distinct moral dimensions (e.g., draining a wetland may reduce population size but improve survivors’ quality by reducing disease). Forces explicit trade-offs: e.g., does preventing rat lives via poisoning reduce suffering (quality focus) or merely truncate lives (duration focus)?  
     *Status*: Non-negotiable. Core to weighing welfare.  

  2. **Decouple animal welfare from place value/integrity**  
     *Motivation*: The charter adds welfare alongside biodiversity/carbon, so welfare must not be subsumed by ecological proxies. E.g., planting conifers may boost biodiversity (place value) but create low-welfare habitats for insects. Forces rejection of assumptions that "natural = good for welfare."  
     *Status*: Non-negotiable. Amendment requires independent welfare weighting.  

  3. **Reject abundance/biomass as direct welfare proxies**  
     *Motivation*: High abundance or biomass (e.g., rats on an island) does not imply positive welfare; it may indicate suffering (e.g., starvation, disease). Forces development of welfare models using life histories (e.g., stress indicators from remote sensing).  
     *Status*: Non-negotiable. Essential to avoid false equivalences.  

  4. **Specify stance on death and potential lives**  
     *Motivation*: Vaccinating a herd prevents deaths but also prevents future lives. If death is a harm (deprivationism), saving lives is good; if death is neutral (terminationism), only suffering matters. Forces a choice: e.g., poisoning rats is a massacre (deprivationism) or net good (terminationism if rat lives are net-negative).  
     *Status*: Negotiable (stance choice required, but omission is non-negotiable). Sign of verdicts hinges on this.  

  5. **Handle non-identity (counterfactual populations)**  
     *Motivation*: Interventions change who exists (e.g., draining a wetland replaces wetland species with rice-paddy species). Counterfactuals cannot assume fixed populations. Forces population-ethical choices: e.g., totalism (count all future lives) vs. person-affecting views (only count existing lives).  
     *Status*: Non-negotiable. Unavoidable in dynamic systems.  

  6. **Account for spatial/temporal leakage**  
     *Motivation*: Effects bleed across boundaries (e.g., poisoning rats causes recolonization elsewhere; drainage shifts species to adjacent areas). Forces system-wide modeling (e.g., metapopulation dynamics) and arbitrary boundary choices.  
     *Status*: Non-negotiable for accuracy, but boundary scope is negotiable.  

  7. **Control sensitivity to boundaries, horizons, and sentience cutoffs**  
     *Motivation*: Verdicts must not flip with minor parameter changes (e.g., including insects reverses conifer-planting welfare; 50- vs. 100-year horizons alter drainage impacts). Forces robustness analysis and explicit cutoffs (e.g., exclude invertebrates if sentience probability < threshold).  
     *Status*: Non-negotiable. Required for reasoned "indeterminable" judgments.  

  #### Rulings on Candidate Demands  
  - **Never kill sentient animals**: *Ruled out*. Consequentialist weighing may require it (e.g., culling invasive rats to prevent seabird suffering).  
  - **Treat naturalness as independently valuable**: *Ruled out*. Violates Desideratum 2; welfare must be separable.  
  - **Never aggregate across species**: *Ruled out*. Ranking requires aggregation (e.g., via sentience weights), but weights can be uncertain.  
  - **Reproduce "functioning ecosystem = good"**: *Ruled out*. Functionality (e.g., predation) may increase suffering; welfare is independent.  
  - **Expressible without claims about lives worth living**: *Ruled in as a preference*. Possible via signed welfare ranges (e.g., net-positive/negative), avoiding binary judgments.  

  #### Stalking Horse Proposal Assessment  
  *Proposal: Rank by expected net welfare-years/ha-year over 100 years, 3% discount, sentience probability weights.*  
  - **Presupposes**:  
    - Cardinal, comparable welfare across species.  
    - Deprivationism (death = welfare loss).  
    - Totalism (value = sum of welfare).  
    - Welfare estimable from coarse data (life histories → welfare units).  
  - **Meets**: Desiderata 1 (integrates duration/quality), 5 (handles changing populations), and partially 7 (uses explicit cutoffs).  
  - **Fails**:  
    - Desideratum 4: Assumes deprivationism without alternatives.  
    - Desideratum 6: Ignores leakage (fixed boundaries).  
    - Desideratum 7: Highly sensitive to discount rate/horizon.  
    - Desideratum 3: Requires implausible welfare estimates from coarse data.  

  #### Key Tensions and Discriminating Requirements  
  - **Unresolvable tension**: *Discrimination vs. computability*. Fine-grained welfare discrimination (Desiderata 1,3) requires individual-level data (infeasible); coarse proxies (abundances) violate Desideratum 3. **Resolution**: Must accept limited discrimination (frequent "indeterminable") or invest in probabilistic welfare models (costly).  
  - **Most discriminating requirement**: *Desideratum 5 (non-identity)*. Excludes fixed-population approaches (e.g., traditional cost-benefit analysis), forcing complex population modeling and ethical choices.  

  #### Compact Table: Scoring Four Approaches  
  *Criteria: D1 (Components), D2 (Welfare vs. Place), D4 (Death Stance), D5 (Non-Identity), D6 (Leakage), D7 (Sensitivity).  
  Scoring: ++ (fully addresses), + (partially), 0 (neutral/inconsistent), – (weak), -- (fails).*  

  | Approach                          | D1  | D2  | D4  | D5  | D6  | D7  | Summary (Case-Driven)                                  |  
  |-----------------------------------|-----|-----|-----|-----|-----|-----|--------------------------------------------------------|  
  | **Suffering-Focused Consequentialism** (Minimize net suffering; prioritize worst-off) | ++  | ++  | -- (Assumes terminationism) | +   | –   | –   | Rat poisoning: good if prevents suffering (ignores seabird gains). Fails D4/D7: rejects deprivationism; sensitive to sentience cutoffs. |  
  | **Totalist Hedonic Accounting** (Sum welfare; e.g., stalking horse) | ++  | +   | + (Assumes deprivationism) | ++  | –   | --  | Vaccination: good if adds net-positive lives. Fails D6/D7: boundaries arbitrary; highly horizon/discount-sensitive. |  
  | **Biodiversity/Integrity-Based** (Welfare derived from ecological health) | –   | --  | 0   | –   | +   | +   | Conifer planting: good if "natural" but may create insect suffering. Fails D1/D2: conflates welfare with place value. |  
  | **Constraint-Based Views** (Rights/no interference; e.g., "wildness inviolate") | –   | +   | N/A | 0   | ++  | ++  | Rat poisoning: forbidden (deontological). Avoids leakage but fails D1/D5: ignores welfare components/counterfactuals. |  

  **Weight on Criteria**:  
  - D1, D2, D5 are most decisive: They exclude approaches that conflate welfare with ecology (biodiversity) or ignore population changes (constraint-based).  
  - D4 and D7 are high-stakes: Choice of death stance (D4) and sentience cutoff (D7) can reverse verdicts (e.g., rat poisoning).  
  - D6 is moderate: Leakage matters for accuracy but can be bounded pragmatically.  

  **Conclusion**: No approach satisfies all desiderata. Totalism (stalking horse) is computationally closest but fails on sensitivity and data demands. The specification forces trade-offs: e.g., if computability is prioritized, "not-yet-determinable" will be common; if discrimination is prioritized, invest in welfare modeling. Desideratum 5 (non-identity) is the strongest filter, excluding simplistic models.
