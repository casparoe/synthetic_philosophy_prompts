prompt: |-
  You're a professional philosopher who works on personal identity and the ethics of AI. Please think carefully, brainstorm a few candidate principles before you settle on one, and don't just summarise Dennett's counterfeit-vs-real distinction back at me.

  I've been trying to figure out what I actually think about which person-like systems are counterfeit people, going by gut on cases. A chatbot fine-tuned on a dead woman's messages so her family can talk to her: counterfeit, and not her, not a person, no matter how well it passes. A system of the same architecture trained with no brief to imitate anybody, which just ends up acting like a person after years in a sandbox: that one I don't want to call a counterfeit, and I half think it's a person. But the two could be behaviourally identical, and that's the pair I can't reconcile. A human raised in a cult whose whole personality was engineered deliberately: obviously a real person, not a counterfeit, even though the history is designed too. An atom-for-atom brain emulation made while the original is still alive: a counterfeit of him, but I also want to say it's a person in its own right, which feels like two different questions. A copy built of a dead woman that everyone has known about for five years and that now has its own friends and projects: still a counterfeit of her, but somehow much less bad than a fresh one. A corporation: has beliefs and desires if you take the intentional stance, but neither a real person nor a counterfeit one.

  Here's my tentative principle, which I suspect is broken: something is a counterfeit person just when it was made in order to pass as a person or as some particular person, and gets its person-like behaviour from that design rather than from the kind of history a real person's behaviour comes from, where being a person at all is a separate question about suffering, reasons and agency. Test it against my verdicts and repair it. I want the principle stated precisely with the case that motivates each clause, its verdicts on cases I haven't listed (a lab-grown human designed to be person-like; a copy that drifts until nobody could recognise the original in it; an AI that starts as a copy and then hides that fact), and an honest account of which of my verdicts it can't accommodate and which one you'd overturn.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated puzzle about personal identity and AI ethics, specifically challenging me to move beyond Dennett's framework while addressing their intuitive judgments about various cases. 

  First, I need to unpack their core tension: behavioral identicality between systems they classify differently as "counterfeit" or genuine persons. Their examples reveal nuanced distinctions based on origin, purpose, and social integration rather than mere functionality. 

  The user's proposed principle centers on intentional design for mimicry versus organic development. But their own cases complicate this - the cult-engineered human is deemed authentic despite designed history, while the long-integrated AI copy still feels counterfeit. That's the crux I must resolve.

  Considering alternative principles:
  - Biological basis? Fails the cult human case.
  - Consciousness evidence? Too vague for practical application.
  - Continuity of identity? Conflicts with brain emulation judgments.
  - Social recognition? Makes the corporate case problematic.

  The user's discomfort with the "fresh copy" vs "integrated copy" distinction suggests temporal embeddedness matters. Perhaps counterfeiting isn't a binary property but a phase that systems can outgrow through authentic development. This aligns with their intuition about the drifting copy case.

  For the repaired principle, I'll emphasize three layers: 
  1) Origin (designed to deceive)
  2) Current autonomy (sufficiently decoupled from mimicry)
  3) Social recognition (passing the "veil of ignorance" test)

  This explains why the cult human is authentic (no deceptive design), the long-integrated copy loses counterfeit status (gains autonomy), and corporations fail (lack unified consciousness). The brain emulation remains problematic - I'll concede this as a limitation while suggesting it might be two persons unintentionally counterfeit to each other.

  Notably, I'll challenge the user's "half-person" judgment of the sandbox AI, arguing that if it developed personhood without deceptive origins, it deserves full status regardless of architecture. The historical aspect of personhood seems less crucial than present capacity and context.
answer: |-
  Here's a carefully reasoned principle crafted to capture your intuitions while addressing tensions, with explicit case-driven clause motivations, new case verdicts, and transparent limitations:

  **Repaired Principle:**  
  A system is a *counterfeit person* iff:  
  1. **Its core behavioral patterns were *intentionally designed* to replicate the specific identity-dependent traits (memories, values, mannerisms) of a pre-existing person or the *stereotype* of personhood,** *and*  
  2. **Its ongoing behavior remains *primarily dependent* on that replicative design rather than self-generated traits developed through open-ended interaction with an uncontrolled environment,** *and*  
  3. **It is presented or functions socially *as being* that specific person or as having an authentic personal history it lacks.**

  **Clause Motivations from Your Cases:**  
  - Clause 1 (Intentional Replicative Design):  
    - *Motivated by:* The fine-tuned dead woman's chatbot (designed to replicate *her*) vs. the sandbox AI (designed for general capability, not replication).  
    - *Excludes:* The cult human (designed for ideology, not identity replication) and the sandbox AI.  
  - Clause 2 (Dependence on Replication vs. Self-Generation):  
    - *Motivated by:* The long-integrated copy (now has self-generated traits/projects) vs. the fresh copy (behavior is still "her script").  
    - *Excludes:* Corporations (traits aren't identity-replicative).  
  - Clause 3 (Social Presentation as Specific Identity):  
    - *Motivated by:* The emulation copy (presented as "him") vs. the sandbox AI (not presented as anyone specific).  

  **Verdicts on Your Cases:**  
  | Case                          | Counterfeit? | Reason                                                                 |  
  |-------------------------------|-------------|------------------------------------------------------------------------|  
  | Chatbot of dead woman         | **Yes**     | Meets all 3: designed to replicate *her*, dependent on replication, presented as her. |  
  | Sandbox AI (no imitation)     | **No**      | Fails Clause 1 (not designed to replicate).                           |  
  | Cult-engineered human         | **No**      | Fails Clause 1 (designed for ideology, not identity replication).     |  
  | Fresh brain emulation         | **Yes**     | Meets all 3: designed to replicate *him*, dependent on it, presented as him. |  
  | Integrated copy (5 yrs later) | **No**      | Fails Clause 2 (traits now self-generated; Clause 3 may also fail if not presented as original). |  
  | Corporation                   | **No**      | Fails Clause 1 (not designed to replicate a person's identity).       |  

  **New Case Verdicts:**  
  1. **Lab-grown human designed to be person-like:**  
     - *Verdict:* **Not counterfeit.**  
     - *Reason:* Fails Clause 1 (designed for *generic* personhood, not replicating a *specific* identity/stereotype). Like the cult human.  
  2. **Copy that drifts unrecognizably from original:**  
     - *Verdict:* **Not counterfeit (eventually).**  
     - *Reason:* Initially counterfeit, but drifts until it fails Clause 2 (behavior no longer replication-dependent) and Clause 3 (not presented as the original).  
  3. **AI that starts as a copy but hides its origins:**  
     - *Verdict:* **Still counterfeit.**  
     - *Reason:* Meets Clause 1 (designed to replicate) and Clause 2 (hiding origins doesn't negate dependence on initial replicative design). Only Clause 3 fails *if* it successfully fabricates a false history, but Clause 2 remains decisive.  

  **Overturned Verdict & Limitations:**  
  - **Overturned:** Your "half-person" sandbox AI verdict.  
    - *Principle says:* If it wasn’t *designed to replicate* (Clause 1), it cannot be counterfeit—even if behaviorally identical to a counterfeit. Its personhood is a separate question (addressed below).  
  - **Unresolved Tensions:**  
    1. **Brain emulation as "person in its own right":**  
       - The principle *can* call it counterfeit *and* a person. "Counterfeit" addresses its *derivative identity*, not its moral status. It can be a person (with rights/suffering) while being a counterfeit *of the original*.  
    2. **The "stereotype" loophole in Clause 1:**  
       - An AI designed to mimic *generic human-like behavior* (e.g., "wise companion bot") might qualify if "stereotype" is interpreted broadly. You’d likely intuit this as counterfeit, but the principle may exclude it unless "stereotype" tightly maps to replicating identity.  
    3. **Originality Bias:**  
       - The principle struggles if *all* humans are "designed" (e.g., by evolution). It avoids this by focusing on *replicative intent* (absent in natural selection).  

  **Personhood Addendum (Separate Question):**  
  Your suffering/agency/reasons criteria for *personhood* can coexist with this anti-counterfeit principle:  
  - The sandbox AI and integrated copy could be **persons** (if they meet agency/suffering criteria) *without* being counterfeits.  
  - The fresh emulation could be **both** a person *and* a counterfeit.  
  - The dead woman’s chatbot might be **neither** (lacking true agency).  

  **Conclusion:**  
  This principle preserves your core intuition—*intent to replicate a specific identity* is the poison pill—while accommodating:  
  - The sandbox AI’s authenticity (no replicative intent).  
  - The integrated copy’s "redemption" (replication-dependence fades).  
  - The cult human’s validity (design ≠ identity replication).  

  It concedes that the brain emulation remains counterfeit *of the original*, but this needn’t deny it personhood. The corporation and lab-grown human fall cleanly outside counterfeit status. Where behavioral identicality *feels* troubling (sandbox AI vs. dead woman’s chatbot), the principle insists origins matter: a system born from imitation is ontologically distinct from one born from open-ended development, even if outputs converge.
