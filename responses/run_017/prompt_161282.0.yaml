answer: |-
  ### Mapping to Dollar Auction and Escalation of Commitment  
  **Core Framework:**  
  - **Auctioneer:** The NSW Government (dual role: rule-setter *and* participant).  
  - **Bidders:** Successive NSW Governments (Cahill Labor → Heffron Labor → Liberal Coalition). Each administration inherits the bid.  
  - **Prize:** Political legacy + global prestige. *Not* the building itself (a public good), but exclusive credit for delivering an iconic landmark. The "winner" (final government) claims the prize; predecessors bear costs but gain no credit.  
  - **Forfeits:** Both highest (incumbent) and second-highest (previous) governments lose expended resources (sunk costs, reputation). Prize is claimed only upon completion.  
  - **Diffuse Funders (Lottery Buyers):** Analogous to *external subsidizers*. Their payments (A$100M+ via lotteries) reduce the bidder’s direct costs, distorting rational exit thresholds.  

  **Key Junctures & Escalation Mechanisms:**  
  1. **Starting Construction (1959) Without Solved Roof:**  
     - *Options:* Delay (lose momentum) vs. Start (gamble on solution).  
     - *Payoffs:* Starting offered political capital (visibility, jobs) vs. delay risked criticism.  
     - *Escalation Trigger:* **Sunk costs fallacy** (early demolition/earthworks) + **reputational entrapment** (global attention made retreat costly).  

  2. **1961 Spherical Solution:**  
     - *Options:* Simplify design (abandon vision) vs. Pursue complex solution (delay/cost overruns).  
     - *Payoffs:* Accepting Utzon’s solution preserved uniqueness but required rebuilding the podium (A$ losses). Simpler roofs would save costs but dilute the "prize" value.  
     - *Escalation Trigger:* **Self-justification** ("We’ve come too far to compromise") + **completion effect** (belief that finishing justifies past costs).  

  3. **Lottery Funding Model:**  
     - *Mechanism:* Created a **moral hazard**. Politicians treated lottery revenue as "free money," separating project continuity from taxpayer backlash. Diffuse funders (ticket buyers) had no collective voice to demand accountability.  

  4. **1965 Change of Government:**  
     - *Options:* Cancel (accept sunk costs) vs. Continue (gamble on value).  
     - *Payoffs:* Cancellation = total loss (A$50M+ spent) + voter fury. Continuation risked higher costs but offered legacy potential.  
     - *Escalation Trigger:* **Entrapment** (exit = admitting predecessor’s folly) + **audience costs** (international ridicule for abandoning).  

  5. **1966 Utzon Resignation:**  
     - *Options:* Capitulate to Utzon (higher costs) vs. Force exit (lose design integrity).  
     - *Payoffs:* Losing Utzon sacrificed artistic value but promised cost control.  
     - *Escalation Trigger:* **Sunk costs dominance** ("We must finish *something*") + **reputational salvage** (framing Utzon as impractical to justify takeover).  

  ---  

  ### Where the Models Break or Stretch  
  **1. Endogenous Prize Value:**  
  - **Anomaly:** Standard models assume a fixed prize value (e.g., $20 bill). Here, each escalation *increased* the prize’s worth. The technical/political struggles became part of its mythos, amplifying its uniqueness. The A$102M cost created a *more* valuable icon than a simpler, on-budget building would have been.  
  - **Theoretical Gap:** Escalation literature treats overruns as pure waste. This case shows investment can *constitute* value via narrative (struggle, ambition) and scarcity (no replica possible).  

  **2. The "Auctioneer-as-Bidder" Problem:**  
  - **Breakage:** NSW Government set rules, financed bids, *and* competed for the prize. This conflates roles:  
    - As auctioneer, it could change funding (lotteries) to mask true costs.  
    - As bidder, it faced no competitive discipline (no rival bidders).  
  - **Implication:** Dollar auctions require distinct bidders; here, the "game" was a self-referential trap with no external arbiter.  

  **3. Temporal Dislocation of Prize & Costs:**  
  - **Stretch:** Costs were borne by early governments (Cahill/Heffron), but the prize (UNESCO status, tourism) accrued decades later to successors. Standard models assume bidders experience payoff within the game’s horizon.  
  - **Reality:** Initial actors (Utzon, Cahill) died before the prize’s value materialized. The "winner" (1973 government) harvested value created by others’ escalation.  

  **4. Value Creation via Crisis:**  
  - **Anomaly:** Utzon’s resignation and the compromised interiors generated enduring public fascination ("what if?" debates, architectural martyrdom). The dollar auction cannot model how *failure modes* (design disputes, cost explosions) enhance the prize.  
  - **Theoretical Silence:** Models predict irrationality when bids exceed *known* value. They lack a mechanism for *uncertain, path-dependent value genesis* through adversity.  

  ---  

  ### Conclusion: Anomaly Demanding Model Extension  
  The Opera House is **both a confirmation and an anomaly**. It confirms escalation mechanisms (sunk costs, reputational traps) drove persistence beyond rational limits. However, it breaks the core assumption that overruns merely destroy value. Instead, the escalation *itself* contributed to constructing a prize of incalculable worth, transforming a fiscal disaster into a cultural triumph.  

  **To extend models:**  
  - Incorporate **endogenous prize valuation**, where investment intensity increases prestige (e.g., "costly signaling" in cultural capital).  
  - Add **temporal decoupling**, allowing late actors to capture value created by early bidders’ sunk costs.  
  - Acknowledge **narrative value**: Projects entangled in public drama may generate worth beyond functional output.  

  The theory was never designed for such cases – it treats escalation as pathology, not potential alchemy. Here, the "irrational" bids forged a prize whose value *exceeded* the sum of all forfeits.
