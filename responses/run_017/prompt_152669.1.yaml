answer: |-
  ### Decision Tree for Frontier Model Oversight  
  **Root:** The model is better at the engineering task than any human reviewer in the available time.  

  #### Branch 1: **Can a trusted, less capable agent verify the outcome?**  
  *(e.g., "Can we break this into subtasks humans *could* check if given time?" or "Is there a simple way to confirm the final result?")*  
  - **Yes** → Go to Branch 2.  
  - **No** → Go to Branch 3.  

  #### Branch 2 (Verifiable): **Is the task a single output or a multi-step sequence?**  
  - **Single output** → **Recursive Decomposition**  
    - *Must believe:* Subtasks are simple enough for weaker reviewers to verify accurately.  
    - *Awkward commitment:* Trusting the model to break down its own work fairly.  
    - *Cannot do:* Handle tasks where errors in decomposition cascade silently.  
  - **Sequence of actions** → **Monitoring + Control**  
    - *Must believe:* A weaker monitor can reliably detect and stop harmful actions in real-time.  
    - *Awkward commitment:* The monitor must be trustworthy *and* powerful enough to intervene.  
    - *Cannot do:* Prevent undetectable long-term manipulation (e.g., slow corruption of systems).  

  #### Branch 3 (Unverifiable): **Is the task about factual truth or values/priorities?**  
  *(e.g., "Is there a single correct answer, or does this hinge on competing interests?")*  
  - **Factual truth** → Go to Branch 4.  
  - **Values/priorities** → Go to Branch 5.  

  #### Branch 4 (Factual): **Is iterative argumentation needed to uncover the truth?**  
  *(e.g., "Could hidden flaws stay buried unless two sides compete to expose them?")*  
  - **Yes** → **Debate**  
    - *Must believe:* Competition between two models will reveal hidden flaws to a human judge.  
    - *Awkward commitment:* Judges might miss subtle manipulation in arguments.  
    - *Cannot do:* Resolve conflicts where "truth" depends on subjective tradeoffs.  
  - **No** → **Prediction Market-Style Scoring**  
    - *Must believe:* Models will report honestly to maximize their score in a betting-like system.  
    - *Awkward commitment:* Requires many models to compete for robust scoring.  
    - *Cannot do:* Handle tasks where outcomes are unmeasurable or far in the future.  

  #### Branch 5 (Values): **Can affected parties contest the decision later?**  
  *(e.g., "If this goes wrong, can impacted groups challenge it?")*  
  - **Yes** → **Democratic Legitimacy**  
    - *Must believe:* Post-hoc accountability (e.g., appeals, audits) ensures fair representation.  
    - *Awkward commitment:* Sacrifices speed for inclusivity; may not prevent harm.  
    - *Cannot do:* Stop irreversible damage (e.g., physical safety risks).  
  - **No** → **Blunt Capability Limits**  
    - *Must believe:* No oversight strategy is safe enough for high-stakes, irreversible tasks.  
    - *Awkward commitment:* Forfeits the model’s potential benefits entirely.  
    - *Cannot do:* Enable controlled use of the model for this task.  

  #### Unoccupied Combinations & Why:  
  - **Verifiable + Values tasks**: *Incoherent* (if values dominate, verification usually fails—e.g., "fairness" can’t be measured like a fact).  
  - **Unverifiable + Single output**: *Unexplored* (no clear oversight tools exist; blunt limits become default).  

  #### Collapsed Distinctions:  
  - **Debate vs. Prediction Markets**: The tree *cannot* split these cleanly for factual tasks. Why? Both rely on competition to surface truth; the difference is in format (argumentation vs. scoring), not outcome. This reflects a real overlap: both are "adversarial truth-seeking."  
  - **Debate vs. Decomposition**: The tree *can* separate these (decomposition needs verifiable subtasks; debate needs unverifiable truths).  

  #### How a Lawyer Table Would Use This (10-Minute Exercise):  
  1. **Start at the root** (granted: model beats humans).  
  2. **Answer Branch 1:** For an engineering task, debate if verification is possible (e.g., "Can we test the final design?"). If unclear, default to "No."  
  3. **Follow the path:** If unverifiable, argue whether the task is about *facts* (e.g., "Will this bridge hold?") or *values* (e.g., "Is this bridge worth the environmental cost?").  
  4. **Land on a leaf:** Select the strategy and debate its "must believe" condition (e.g., "Can we *really* trust a weaker monitor?").  
  5. **Document:** Agree on the strategy and its key assumptions for the regulator’s report.  

  ---  
  *Tree logic: Branch 1 isolates whether oversight can "offload" work to a weaker agent. Branch 3 separates truth-seeking from preference-aggregation—the core divide in scalable oversight. Other questions (e.g., contestability, iterative argumentation) refine within these.*
