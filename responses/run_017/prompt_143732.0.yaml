  ## Memorandum  
  **To:** University Senate Committee on Conflicts of Interest  
  **From:** Junior Faculty Representative  
  **Date:** October 10, 2023  
  **Subject:** Resolution of Complaint #COI-2023-07 & Proposed Revision to Recusal Policy for Internal Fellowship Panels  

  ---

  ### I. RESOLUTION OF ACTIVE COMPLAINT (#COI-2023-07)  
  **Finding:** Violation of conflict of interest principles, though not of current written policy.  
  **Action Taken:**  
  1. **Fellowship Decision:** The award stands. No evidence of intentional misconduct or fraud exists.  
  2. **Reader Conduct:** Formal written reprimand to the reviewer for failing to proactively disclose the significant past supervisory relationship. While not required by current rules, this omission created a reasonable perception of bias, undermining trust in the process.  
  3. **Communication with Complainant:** The runner-up will receive:  
     > *"The Committee acknowledges that the appearance of partiality in the evaluation process caused legitimate concern. While the current policy did not technically require recusal in this case, the reviewer should have disclosed the past supervisory relationship to the committee chair. The Senate Committee is revising its policies to prevent similar ambiguities. Your proposal’s score and ranking remain confidential per university policy, but the integrity of the process is being strengthened."*  

  **Rationale:** Upholding the award respects the absence of procedural breach *at the time*. The reprimand signals that the *spirit* of impartiality—including managing appearances—is paramount.  

  ---

  ### II. RECOMMENDED POLICY REVISION:  
  **Current Rule Flaws:**  
  - Overly narrow (focused only on familial/financial/current ties).  
  - Ignores enduring relational duties (e.g., past mentorships) and negative biases (rivalries, grudges).  
  - Assumes unbiased strangers are ideal evaluators, potentially excluding knowledgeable judges.  

  **Proposed New System: "Declared Partiality with Mitigation"**  
  *(Replaces binary recusal for non-financial/non-familial ties)*  

  1. **Mandatory Pre-Review Disclosure:**  
     - All reviewers submit a **Relationship Statement** listing:  
       - Past/present academic relationships with applicants (e.g., dissertation advisor/advisee, co-author, thesis committee member, postdoc supervisor).  
       - Any personal relationships (positive or negative) potentially affecting judgment.  
       - Self-identified direction of bias: **"Supportive," "Neutral," or "Adversarial"** (e.g., *"Former PhD student (Supportive)"*; *"Colleague with ongoing disciplinary disagreement (Adversarial)"*).  

  2. **Chair’s Role:**  
     - Assigns reviewers to proposals **to balance declared biases** across the panel.  
     - Ensures **no proposal is scored solely by reviewers with a declared "Supportive" or "Adversarial" bias** toward the applicant.  
     - Requires **written justification** for any score deviating >20% from the panel median.  

  3. **Transparency & Record:**  
     - Relationship Statements and bias declarations are archived with scoring sheets.  
     - Summaries of declared biases (without names) included in annual committee reports.  

  4. **Recusal Thresholds Remain For:**  
     - Current financial interests, familial relationships, or direct supervisory roles.  

  ---

  ### III. WHY THIS WORKS BETTER THAN EXPANDING RECUSAL  
  **Addresses the Confucian Critique (Strong Version):**  
  Your friend’s core insight is correct: Knowledgeable evaluators *always* bring relational histories. Forcing them to pretend otherwise is dishonest and devalues context. The "recusal ratchet" *does* systematically exclude experts with legitimate, enduring obligations (e.g., a scholar responsibly shepherding a former student’s career). It also ignores hidden negative biases, which are equally corrosive. This system **honors relational reality** by requiring transparency about ties rather than demanding their erasure. Declaring "Supportive" bias isn’t corruption—it’s intellectual integrity.  

  **Practical & Ethical Advantages:**  
  - **Captures Negative Bias:** "Adversarial" declarations address grudges/rivalries ignored by current rules.  
  - **Preserves Expertise:** Prevents knowledgeable reviewers being sidelined for having past ties.  
  - **Reduces Gaming:** Harder to hide behind false neutrality. Written justifications deter extreme scores.  
  - **Fairer Balancing:** A "Supportive" score offset by a "Neutral" or "Adversarial" score (with justifications) is more robust than a score from an ignorant but "unconflicted" reviewer.  
  - **Builds Trust:** Transparency about human relationships is more credible than pretending they don’t exist.  

  **Limitations Acknowledged:**  
  - Relies on honest self-disclosure. However, false nondisclosure becomes unambiguous misconduct.  
  - Requires diligent chairs. Training materials will be provided.  
  - Doesn’t eliminate bias; it *manages and contextualizes* it more openly than the current facade of neutrality.  

  ---

  ### IV. INTERIM GUIDANCE FOR SPRING 2024 FELLOWSHIP  
  Pending Senate approval of the full policy:  
  1. **All spring 2024 reviewers** must disclose *past supervisory relationships* with applicants (even if >5 years old).  
  2. **Chairs must ensure:**  
     - No applicant is scored by *only* reviewers with a past supervisory tie.  
     - Any reviewer with such a tie provides a written note justifying scores significantly above/below the panel median.  

  ---

  ### V. BOTTOM LINE & NEXT STEPS  
  **Recommendation:** Adopt the **"Declared Partiality with Mitigation"** system effective Fall 2024.  
  **Motion for Senate:**  
  > *"The Committee moves to revise the Conflicts of Interest policy for internal fellowship reviews per Section II above, replacing binary recusal requirements for academic/personal relationships with mandatory disclosure, bias-direction declaration, and chair-managed mitigation."*  

  **Deadline:** Committee vote on final language by October 14.  

  ---  
  *This proposal takes relational obligations seriously while rejecting the false choice between "neutral strangers" and "unchecked partiality." It replaces secrecy with structured candor.*  

  // Let your friend know this memo doesn’t dismiss Confucian ethics—it operationalizes its realism about human bonds within a rule-of-law framework. The "recusal ratchet" is real; this stops it by making relationships visible fuel for fairer decisions, not a contaminant to be purged. //
