     - How many precommitted? Did it help?

  3. Highlight the time-inconsistency:
     - At T0, by choosing B0, they revealed a preference for postponing the chore (they thought doing the small chore now was worse than doing the large chore later). 
     - But at T2, some of them skipped, revealing that they now think doing the large chore is worse than losing 3 points. But at T0, they thought they would do the chore at T2 (because they predicted they would and they didn't precommit to force themselves). So what changed? The only thing is that now the chore is immediate.

  4. Discuss precommitment:
     - Those who precommitted paid a cost to bind themselves. Did they regret it? 
     - Compare the two strategies: gritting teeth (trying to rely on willpower at T2) vs. rearranging (precommitting). Which worked better?

  5. Open question:
     - Was the person who skipped at T2 being irrational? Or did they simply change their mind? 
     - Are there two selves? Which one is the "real" you?

  6. Connect to theory:
     - Time-inconsistency in preferences: the same option (doing a chore) is evaluated differently when it's immediate vs. delayed.
     - Weakness of will: acting against one's better judgment (if they predicted they would do it but then skipped).

  But leave it open: maybe it's not weakness, just changing preferences.

  What the TA should not say: 
     - Don't define time-inconsistency or hyperbolic discounting until the debrief.
     - Don't judge the choices.

  Predictable issues and handling:

  1. Students treating it as a puzzle: Some might choose B0 and precommit to force themselves to do the chore because they want the 10 points and they know they might be tempted. That's fine, it's part of the lesson. In debrief, note that some people used precommitment to overcome their predicted weakness.

  2. Renegotiation: If a student at T2 says "I don't want to do the chore, can I do the small one now?" - TA says: "The rules are fixed, you must choose from the options given."

  3. Resentment: If a student precommitted and then at T2 is unhappy doing the chore, that's a learning moment. In debrief, discuss the cost of precommitment.

  4. Boredom: The chore must be boring but not too bad. Choose a text that is dry but not impossible. Also, the 40-minute lecture must be engaging enough to not make them leave.

  5. Second group: Ask the first group not to discuss until after the second group has done it. Offer an incentive (e.g., if both groups keep it secret, everyone gets an extra point).

  What the activity can't stage: 
     - It doesn't have a direct reward round. The TA might have to draw the analogy: "Just as we put off chores, we might choose immediate rewards over larger delayed ones, and the same flip happens." But the activity only shows the aversive side. If there's time, the TA can ask: "How do you think this relates to choosing between a smaller sooner reward and a larger later reward?" and let them see the parallel.

  Given the constraints, this should work.
