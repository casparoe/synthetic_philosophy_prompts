  ### **The "Now-or-Never" Challenge: A Time-Inconsistency Activity**  
  **Designed for a 75-minute session, 16 students, zero budget**  
  *No slides, no hypotheticals—students experience time-inconsistency firsthand using participation points (redeemable for chocolates) and a mildly unpleasant task. Focuses on procrastination (aversive) and precommitment, with a twist to avoid predictability.*

  ---

  ### **Setup & Materials**  
  - **Materials**:  
    - **Participation points system**: Each student starts with 100 points (1 point = 1g of chocolate at session end).  
    - **Task sheets**: Two types:  
      - **"Quick Task"** (mildly unpleasant): Transcribe 10 lines of binary code (e.g., `01010101...`) neatly by hand. Takes ~3 minutes.  
      - **"Long Task"** (more unpleasant): Transcribe 20 lines of binary code. Takes ~6 minutes.  
    - **Precommitment cards**: Small index cards for students to "lock in" future choices.  
    - **Prediction slips**: Paper slips for private predictions.  
    - **Whiteboard**: Track time, choices, and points.  
    - **Timer**: For strict 5/10-minute intervals.  
    - **Chocolate bag**: For point redemption post-activity.  

  - **Stakes**:  
    - **Reward**: Points = real chocolate.  
    - **Aversive task**: Actual boredom (transcription) done in-class. Delaying the task makes it worse.  
    - **Precommitment cost**: Pay 10 points to restrict future choices.  

  ---

  ### **Rules & Payoff Scheme**  
  The activity has **three phases**, each with choices. Students face:  
  1. **A choice between doing a task now vs. later** (with the later task being longer).  
  2. **A second-order choice**: Predict their future behavior or pay points to precommit.  
  3. **A reversal**: The same choice later, but "now" has shifted.  

  **Key mechanics**:  
  - **Phase 1 (T0)**: Choose between:  
    - **Option A**: Do the **Quick Task now** (at T0). Gain **0 points** (no penalty).  
    - **Option B**: **Postpone** the task. If postponed, you’ll do the **Long Task at T2** (40 mins later).  
      - *Sub-choice for Option B*:  
        - **Predict**: Privately write whether you’ll actually do the Long Task at T2 or skip it (losing points).  
        - **Precommit**: Pay 10 points to *force* yourself to do the Long Task at T2 (no backing out).  

  - **Phase 2 (T1)**: **Unexpected "reward" checkpoint** (tests if they value immediate points over consistency):  
    - "While waiting, you can earn bonus points: Do nothing and get **5 points now**, OR skip bonus and keep your prior plan."  
    - *Catch*: Choosing the 5 points *doesn’t change Phase 1*, but reveals impulsivity.  

  - **Phase 3 (T2)**: **Consequences for postponers**:  
    - If you postponed at T0:  
      - **Do the Long Task now** (at T2): Gain **0 points** (no penalty).  
      - **Skip the task**: Lose **30 points**.  
    - *Precommitters must do the task; non-precommitters choose freely*.  

  **Payoffs summarized**:  
  - **Doing any task**: 0 points (avoids loss, but no gain).  
  - **Skipping postponed task**: -30 points.  
  - **Precommitting**: -10 points (plus task completion).  
  - **Bonus at T1**: +5 points (if chosen).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 mins** (adjust ±2 mins as needed).  

  | Time | Activity | Facilitator Actions |  
  |------|----------|---------------------|  
  | **0-5 min** | **Intro & Rules** | - Explain points system: "Points = chocolate. Every choice affects your final haul."<br>- Introduce the task: "You’ll transcribe binary code—boring but short if done now, longer if delayed."<br>- **Do NOT define time-inconsistency or weakness of will.** Say: "Today is about observing your own choices." |  
  | **5-15 min** | **Phase 1 (T0): Initial Choice** | - Hand out task sheets and prediction slips.<br>- Present options (write on whiteboard):<br>  - **A**: Quick Task NOW → 0 pts.<br>  - **B**: Postpone (Long Task at T2).<br>    - *If B*: Predict (write slip): "I’ll DO the task at T2" or "I’ll SKIP at T2."<br>    - *If B*: Option to precommit (pay 10 pts for a card binding you to the task).<br>- **Silent work time**: Students choose, write predictions, decide precommitment. Collect slips/cards. Quick Task doers transcribe now. |  
  | **15-25 min** | **Phase 2 (T1): Bonus Temptation** | - **Surprise interrupt**: "Time check! Optional bonus: Take **5 points now** for doing nothing, OR refuse and stick with your T0 plan."<br>- Emphasize: "This is separate from your earlier choice. No right/wrong—just what you prefer NOW."<br>- Students write choice (anonymous) and hand in. |  
  | **25-40 min** | **Filler Activity** | - Run a **tangential discussion**: "Let’s debate: Can you rationally change your mind? Example: You plan to diet but see cake."<br>- **Key**: Keep it abstract; no reference to today’s choices. Use whiteboard for ideas. |  
  | **40-55 min** | **Phase 3 (T2): The Reckoning** | - Postponers face consequences:<br>  - Precommitters: Must do Long Task (no choice).<br>  - Non-precommitters: Choose: Do Long Task or skip (-30 pts).<br>- **Do NOT allow renegotiation**. Enforce precommit cards strictly.<br>- All students do tasks as chosen (supervise timing). |  
  | **55-65 min** | **Calculate Points** | - Tally points (publicly on whiteboard):<br>  - Base: 100 pts.<br>  - Adjust for precommit (-10), skipping (-30), bonus (+5 if taken).<br>- Hand out chocolates based on points. |  
  | **65-75 min** | **Debrief & Discussion** | - Guide reflection (questions below). **Never lecture—draw out their experiences.** |  

  ---

  ### **Facilitator Script: What to Say (and Not Say)**  
  - **At start**:  
    - "Your choices today earn points for chocolate. There’s a task—short now or long later. I won’t judge your decisions; just observe what you do."  
    - **Avoid**: Naming "time-inconsistency," "discounting," or "akrasia."  

  - **During choices**:  
    - **T0**: "Option B folks: Predict what you’ll actually do later. Be honest—no one sees this but you. If you want to force yourself, pay 10 points to precommit."  
    - **T1 (bonus)**: "This is a separate choice. 5 points now, or stick with your plan?"  
    - **T2**: "Precommitters: You bound yourselves—do the task. Others: Choose freely: task or penalty."  
    - **Avoid**: Explaining *why* choices matter. No hints like "Think about your future self."  

  - **When students resist**:  
    - **Renegotiators**: "The rules are fixed. You had your chance to precommit."  
    - **Puzzle-beaters**: "Interesting strategy! We’ll discuss later if it paid off."  
    - **Resentful precommitters**: "You paid to bind yourself—was it worth it?"  

  ---

  ### **Debrief: Mapping Experience to Theory**  
  **Goal**: Leave "weakness of will?" open. Use Socratic questioning.  

  | **Debrief Question** | **Theoretical Link** | **Facilitator Notes** |  
  |----------------------|----------------------|------------------------|  
  | 1. "Who chose to postpone at T0? Why?" | Revealed preference for delaying aversive tasks. | Highlight: "You thought doing it later was better than now." |  
  | 2. "Who predicted they’d skip at T2? Who actually skipped? Who was wrong?" | Time-inconsistency: Predictions vs. actions. | Note: "Many of you said you’d do it later but skipped. What changed?" |  
  | 3. "Precommitters: Did binding yourself help? Was it worth 10 points?" | Precommitment as a tool for self-control. | Contrast: "Gritting teeth failed for some; precommitment forced action but cost points." |  
  | 4. "Bonus takers at T1: Why grab 5 points? Did it clash with your T0 plan?" | Hyperbolic discounting (small rewards now trump larger later plans). | Point out: "You valued ‘now’ points even if it undermined patience." |  
  | 5. **Crucial pivot**: "When the same choice came at T2, why did some skip? What’s special about ‘now’?" | **Time-inconsistency defined**: Proximity changes preference. | **STOP HERE**: "Notice: At T0, delaying seemed wise. At T2, skipping did. The options didn’t change—your distance to them did." |  
  | 6. "Was skipping weak-willed? Or just a new preference?" | Open debate: Is akrasia irrational? | **End unresolved**: "Philosophy’s fought over this for 2,500 years. Which self is ‘you’—the planner or the doer?" |  

  **Debrief flow**:  
  - Start with concrete experiences (Q1–Q4).  
  - Pivot to the "flip" (Q5).  
  - End with the open question (Q6). **Do not resolve it.**  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Puzzle-beaters" precommit aggressively**:  
     - *E.g.*, A student pays to precommit, then brags, "I outsmarted the system!"  
     - **Solution**: In debrief, ask: "Did precommitting feel like cheating? Or is it rational self-defense?" Compare their outcome to non-precommitters.  

  2. **Renegotiation at T2**:  
     - *E.g.*, "I’ll do the Quick Task now instead!"  
     - **Solution**: Hold the line: "Rules are fixed. You chose to postpone—now face Long Task or penalty."  

  3. **Resentful precommitters**:  
     - *E.g.*, A student pays 10 points, does the task, and complains, "I wouldn’t have skipped! I wasted points."  
     - **Solution**: Highlight in debrief: "Precommitment is an insurance policy. Sometimes you ‘overpay’—was it irrational?"  

  4. **Group-chat spoilers for second session**:  
     - **Prevention**:  
       - After first session, say: "Don’t spoil the surprise for Group 2! If both groups keep it secret, everyone gets +10 bonus points."  
       - Use a **variant task**: For Group 2, swap binary transcription with a similarly boring task (e.g., counting vowels in a legal document). The structure feels identical, but specifics differ.  
     - **If spoiled**: Lean into it: "Some of you know the setup. Does that make your choices more rational? Or does foreknowledge change your preferences?"  

  ---

  ### **What the Activity Can’t Stage (And Must Be Said Aloud)**  
  - **The reward/aversive symmetry**: Students experience procrastination (aversive), but not the classic "smaller-sooner vs. larger-later" reward dilemma.  
    - **What to say in debrief**: "Procrastination is like a negative version of the marshmallow test. When we delay a chore, we’re choosing immediate ease over future pain—just like grabbing $10 now over $15 later. The ‘flip’ feels the same."  
  - **Why "now" is special**: The activity *shows* the preference reversal, but doesn’t *explain* it.  
    - **What to say**: "Notice how ‘now’ feels urgent? That’s the core of time-inconsistency. But is it irrational? Maybe your ‘now self’ has new information—like how tedious transcription feels!"  

  ---

  ### **Why This Works**  
  - **Aversive focus**: Procrastination feels real (not hypothetical). The task is boring but harmless.  
  - **"Now" shift**: Students see their preferences flip when T2 becomes "now."  
  - **Precommitment in action**: Paying points to bind themselves makes self-control tangible.  
  - **No easy answers**: The debrief leaves them arguing—exactly as you wanted.  

  **Final tip**: Bring extra chocolate. Chaos is likely, but that’s where the learning hides.
