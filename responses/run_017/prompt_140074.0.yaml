            The strategy: Blue's turn in a game where it is the first player? But in the parallel game, after Blue's extra stone, Red has played (2,2). Then it's Blue's turn. The strategy would look at the board and pick the top-left available cell. The available cells: (1,1), (1,2), (1,3), (2,1), (2,3), (3,1), (3,2) [since (2,2) and (3,3) are taken]. The top-left is (1,1). So Blue plays (1,1).

          Move 2: Red plays at (1,1) -> but (1,1) is now taken by Blue? In the real board, (1,1) is Blue. So Red cannot play there. Red must play elsewhere. But in the parallel game, when Red plays, they can play anywhere available. In the real game, Red plays, say, (1,2).

          Move 3: Blue's turn. 
            Real board: Blue has E at (3,3) and (1,1). Red has (2,2) and (1,2).
            In the parallel game, the state is the same. Blue's strategy: top-left available cell. Available: (1,3), (2,1), (2,3), (3,1), (3,2). Top-left: (1,3). So Blue plays (1,3).

          Move 4: Red plays at (1,3) -> already taken by Blue in the real board? No, not yet. In the real board, after move 3, Blue has (1,1) and (1,3) and E at (3,3). Red has (2,2) and (1,2). So (1,3) is available? But in move 3, Blue played (1,3). So it is Blue. So Red cannot play there. Red plays elsewhere, say (2,1).

          Move 5: Blue's turn. 
            Board: Blue: (3,3) [E], (1,1), (1,3); Red: (2,2), (1,2), (2,1).
            In the parallel game, same state. Blue's strategy: top-left available: (2,3) -> so Blue plays (2,3).

          Now, does Blue win? 
            Blue has a path? In 3x3 Hex, with Blue connecting left to right: 
              Left: (1,1), (2,1), (3,1)
              Right: (1,3), (2,3), (3,3)
              Blue has (1,1), (1,3), (2,3), (3,3). 
              They don't have a connected path from left to right? They are missing (2,1) and (3,1) and (3,2). But they have (1,1) and (1,3) which are both on the top row, but not connected to the bottom.

          This strategy might not be winning.

    The point of the drill is not to win, but to see the mechanics and the potential conflict. We see that the strategy might call for a move that is already taken (but in this case, it didn't). We also see that the extra stone is on the board and might block the opponent.

    But we want a conflict. So let's choose the extra stone at (1,1).

    Worksheet 2: Conflict

        Extra stone: Blue at (1,1)

        Move 1: Red plays at (1,1) -> but (1,1) is already Blue! So Red cannot play there. So Red plays elsewhere, say (2,2).

        Move 2: Blue's turn. 
            Board: Blue has (1,1) and Red has (2,2). 
            In the parallel game: Blue has extra at (1,1), and then Red has played (2,2). It's Blue's turn. 
            Blue's strategy (top-left) would look for the top-left available cell. Available: (1,2), (1,3), (2,1), (2,3), (3,1), (3,2), (3,3). Top-left: (1,2). So Blue plays (1,2).

        Move 3: Red plays at (1,2) -> but (1,2) is now taken by Blue? In the real board, after move 2, Blue has (1,1) and (1,2). So Red cannot play there. Red plays at (1,3).

        Move 4: Blue's turn.
            Board: Blue: (1,1), (1,2); Red: (2,2), (1,3).
            In the parallel game, same. Blue's strategy: top-left available: (2,1). So Blue plays (2,1).

        Here, we see that when Red played at (1,2) in move 3, that cell was already taken by Blue (from move 2), so Red had to play elsewhere. But in the parallel game, the strategy never was asked to play at (1,1) because it was already taken by the extra stone. 

    To see a conflict in the strategy: 

        We need a scenario where the strategy for Blue (as first player) wants to play at (1,1) at some point, but (1,1) is already occupied by the extra stone.

        How about:

          In the parallel game, after some moves, the strategy says: play at (1,1). But (1,1) is already occupied by the extra stone. Then what? The strategy must be defined for the board state. In that state, (1,1) is occupied, so it should not be chosen. The strategy should choose a different move. In our top-left strategy, it would choose the next available.

        So the conflict is resolved by the strategy choosing a different move. And the extra stone is beneficial because it might block the opponent.

    The drill shows that:

        - The extra stone might block the opponent (good).
        - The strategy might call for a move that is already taken, but then you play somewhere else (and that's okay because the extra stone is beneficial).

    But the students might not see the full argument. The point is to experience the mechanics.

  Debrief (10 minutes):

    We will map the experiences to the premises:

        1. Extra move never hurts (monotonicity): 
            - In Tic-Tac-Toe, an extra move might not help if the game is drawn.
            - In Hex, we assume it never hurts (but we didn't challenge that).
            - In Sim, an extra move might complete a triangle and make you lose.

        2. No draw: 
            - Tic-Tac-Toe can draw.
            - Hex cannot draw (but we take it on faith? we can state it).
            - Sim cannot draw.

        3. Symmetric roles: 
            - In the handicap variants, the roles are not symmetric.

    We then discuss each round:

        Round 1 (Tic-Tac-Toe): 
            - Stealing argument: second player can use the first player's strategy and at least draw. 
            - But students might have seen first player wins sometimes and draws sometimes.

        Round 2 (Hex): 
            - Stealing argument: second player can steal and win, which is a contradiction, so first player must have a winning strategy.
            - But in our play, did the first player always win? (collect results)
            - The drill: we tried to steal and saw that when the strategy calls for an occupied cell, we play elsewhere, and the extra stone is there to help.

        Round 3 (Sim): 
            - Extra move can be harmful: because it might complete a triangle. 
            - In fact, the player with fewer moves might be better off.

        Round 4 (Handicap Hex):
            - Variant 1: second player has a bolt (extra move). Does the strategy-stealing argument apply? 
                  - The bolt is an extra move, but it is not placed at the beginning. The second player can choose when to use it. 
                  - However, the argument might be adapted: if the second player has an extra move, then they should be able to win. But is an extra move always beneficial? In Hex, yes. 
                  - But note: the roles are not symmetric because only the second player has the bolt. So the argument would say: if the second player does not have a winning strategy, then the first player does. But then the second player, having an extra move, should be able to win. So we expect the second player to win.
            - Variant 2: both players have a bolt. Now symmetric? Not exactly, because the first player might use the bolt first. The argument: 
                  - We can try to steal, but now both have an extra move? It's complicated.

            - What predictably goes wrong: 
                  - In Variant 1, students might not use the bolt optimally, so the first player might win. They might think the bolt is not enough.
                  - In Variant 2, they might think it's symmetric and the first player wins, but the bolt might change the dynamics.

    Then we return to the friend's claim: 
        "in any race where you can observe what the leader is doing, the follower can simply adopt the leader's playbook plus one free extra move, so moving first is decisive everywhere."

    We have seen that:
        - In Tic-Tac-Toe, it doesn't work because of draws.
        - In Hex, it works to prove the first player wins, but not by the follower observing and adopting in a direct mimicry, but by a combinatorial argument that assumes the second player can win and derives a contradiction.
        - In Sim, an extra move might be harmful.
        - In Handicap Hex, the asymmetry might change who wins.

    So the friend's claim is too sweeping.

  Closing:

    "My friend’s claim that an extra free move always lets the follower win applies only in very specific conditions: when the extra move is always beneficial, there are no draws, and the roles are symmetric. We've seen counterexamples in this session."

   If we cut to 60 minutes, we drop Round 4 (Handicap Hex).

   Let's write the full plan.
answer: |-
  ### Recommended Activity Design: "The Strategy-Stealing Sandbox"

  This 90-minute session uses experiential learning to dissect the strategy-stealing argument. Students confront its limitations through gameplay, physical drills, and structured reflection. The design avoids upfront lectures and reserves terminology (e.g., "strategy-stealing") for the debrief.

  **Materials per Pair**:
  - 1× Tic-Tac-Toe grid (printed)
  - 1× 5×5 Hex board (printed)
  - 1× \(K_6\) graph (15 edges, printed)
  - Colored pens (red/blue)
  - Worksheet: "Stealing Drill" (two scenarios, described below)
  - Prediction ledger (shared group sheet)

  **Timeline**:

  #### 0–5 min: Setup & Rules for Round 1 (Ordinary Tic-Tac-Toe)
  - **Rules**: Players alternate marking X/O. Win: 3-in-a-row. Draw: full board, no win.  
  - **Task**: Play **two games** (swap who starts). Record wins/losses/draws in the ledger.  
  - **Focus**: "Notice how the extra move affects outcomes when draws exist."  

  #### 5–15 min: Play Round 1 (10 min)
  - Pairs play. Instructor circulates, nudging: "If you could replay as the follower with an extra move, would you always win?"  
  - **Predictable issue**: Strong players dominate; novices assume first-move advantage is universal.  

  #### 15–20 min: Rules for Round 2 (5×5 Hex, No Swap)
  - **Rules**: Players connect opposite sides with stones. No draws (declare this; prove later).  
  - **Task**: Play **one game**. First player wins if they control a path.  
  - **Focus**: "Observe if the first player’s advantage feels absolute."  

  #### 20–40 min: Play Round 2 (20 min)
  - Most games end quickly. Instructor notes wins: "How many first-player wins?" (Expect >80%.)  

  #### 40–45 min: Introduce & Execute Stealing Drill (5 min)
  - **Physical Drill**: Pairs receive a worksheet with two partially played 3×3 Hex boards:  
    - **Scenario A**: Blue (follower) has a "dummy stone" at (1,1). Red (leader) played (2,2).  
      *Task*: Blue tries to "steal" Red’s strategy. When Red’s next move is (1,1), Blue must abandon the plan—the cell is occupied.  
    - **Scenario B**: Blue’s dummy is at (3,3). Red plays (1,1), (2,2).  
      *Task*: Blue uses Red’s strategy. Strategy calls for (3,3), but it’s occupied—Blue plays randomly.  
  - **Focus**: "Which stone is the ‘extra’? What breaks when the stolen move is taken?"  

  #### 45–50 min: Rules for Round 3 (Sim on \(K_6\)) (5 min)
  - **Rules**: Players claim edges (red/blue). **Lose** if you complete a monochromatic triangle. No draw (Ramsey theory).  
  - **Task**: Play **one game**. Track whose move completes a triangle.  
  - **Focus**: "Is an extra move here a gift or a curse?"  

  #### 50–60 min: Play Round 3 (10 min)
  - Games end in 5–8 moves. Instructor highlights: "Did the player with more moves lose more often?"  

  #### 60–65 min: Rules for Round 4 (Handicap Hex Variants) (5 min)
  - **Variant 1 (Bolt for Follower)**: Second player gets **one bolt** (play two stones once).  
  - **Variant 2 (Bolts for Both)**: Both get one bolt.  
  - **Task**: Play **one game per variant**.  
  - **Focus**: "Does stealing ‘work’ when rules aren’t symmetric?"  

  #### 65–75 min: Play Round 4 (10 min)
  - **Predictable errors**:  
    - *Variant 1*: Students underestimate the bolt, letting first player win despite the handicap.  
    - *Variant 2*: Misinterpret symmetry—assume bolts cancel, missing that timing matters.  

  #### 75–85 min: Debrief (10 min)
  - **Map Experiences to Premises**:  
    | Premise               | Round 1 (Tic-Tac-Toe)      | Round 2 (Hex)             | Round 3 (Sim)             | Round 4 (Handicap)        |  
    |-----------------------|---------------------------|--------------------------|--------------------------|--------------------------|  
    | Extra move never hurts | ✔️ (but draws negate win) | ✔️ (critical for proof)  | ❌ (completes triangles)  | ❓ (asymmetry breaks swap)|  
    | No draw               | ❌                        | ✔️ (declared)            | ✔️                       | ✔️                       |  
    | Symmetric roles       | ✔️                        | ✔️                       | ✔️                       | ❌ (bolt imbalance)      |  
  - **Predictable Shortcomings**:  
    - Strong players skew results (e.g., Hex wins attributed to skill, not structure).  
    - Small samples mistaken for proof (e.g., "Hex always favors first player" after one game).  
    - Confusion in drill: "Is the dummy stone the extra move, or is it part of the strategy?"  
  - **What You Must Supply**:  
    - Generality (proof that Hex never draws on any board size).  
    - Strategy-stealing’s existential guarantee (it proves a winning strategy exists but doesn’t construct it).  

  #### 85–90 min: Closing (5 min)
  - **Link to Friend’s Claim**: "My friend argued that followers always win with an extra move by copying leaders. Today, we saw this fails when:  
    - Draws exist (Tic-Tac-Toe),  
    - Extra moves backfire (Sim),  
    - Rules aren’t symmetric (Handicap Hex).  
    Strategy-stealing isn’t mimicry—it’s a *reductio* requiring strict combinatorial conditions."  

  ---

  ### If Cut to 60 Minutes
  - **Cut Round 4 (Handicap Hex)**. It extends concepts but isn’t core to the argument’s premises.  
  - **Adjusted Timeline**:  
    - 0–5 min: Round 1 rules.  
    - 5–15 min: Play Round 1.  
    - 15–20 min: Round 2 rules.  
    - 20–35 min: Play Round 2.  
    - 35–40 min: Stealing drill.  
    - 40–45 min: Round 3 rules.  
    - 45–55 min: Play Round 3.  
    - 55–60 min: Debrief + closing.  

  ---

  ### Why Other Designs Were Rejected
  1. **Pure Lecture + Examples**  
     - *Rejected*: Fails the "feel the difference" requirement—students passively absorb theory.  
  2. **Single Complex Game (e.g., Hex Variants Only)**  
     - *Rejected*: Overlooks contrast with draws (Tic-Tac-Toe) and harmful moves (Sim), narrowing scope.  
  3. **Digital Simulation**  
     - *Rejected*: Violates "no devices" constraint and undermines tactile learning.  

  This design forces students into the argument’s "failure modes" through play, making abstract constraints visceral. The drill and ledger foster metacognition, while the debrief explicitly ties chaos to premises.
