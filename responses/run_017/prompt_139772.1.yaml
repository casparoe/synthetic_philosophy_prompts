prompt: |-
  I teach a fourth-year seminar on naturalism and its discontents, and I wrote the final exam myself. One question asked students to work out what Quine's general position commits him to about moral values — a topic he wrote almost nothing about directly, so the answer has to be built out of his commitments about meaning, evidence, ontology and the status of philosophy. The assigned readings were only the two dogmas essay, *Word and Object*, *Ontological Relativity*, and *Epistemology Naturalized*; the exam was closed-book, and grading should rest on those, not on secondary literature. Two course devices matter here. First, all term we separated three questions students tend to run together: the semantics question (do moral sentences have cognitive content?), the inventory question (must a regimented total theory quantify over moral properties?), and the authority question (could a true moral judgment give anyone a reason to act?). Second, we drilled a small procedure I called the regimentation test: take a moral sentence, regiment it into first-order notation with its quantifiers explicit, list what its bound variables must range over, and then ask whether those entities are already in the inventory of our best science. Below is the question as it was printed, followed verbatim by one student's answer. My teaching assistants' marks on this answer are currently spread across almost the whole scale, so before I finalize the rubric and the grade boundaries I want an independent read from someone who has not seen my own view of it, which I am deliberately withholding.

  **Question 3 (30 marks; suggested length 500 words).** Quine wrote almost nothing about ethics. Explain what, if anything, his general philosophical position commits him to about moral values, and be explicit where an apparent commitment is really just a plausible extension of his views by you. Address all three of: (a) whether his naturalism — reality to be identified and described from within science, with no prior philosophical tribunal — forces the conclusion that moral judgments are not truth-apt; (b) what his holism about evidence implies about whether and how moral judgments can be revised; (c) whether the inscrutability of reference, or ontological relativity, yields a relativism about moral values. Apply the regimentation test from seminar to one moral sentence of your choosing. Keep the semantics question, the inventory question and the authority question separate; collapsing them is the most common way to go wrong here.

  **Student answer (Candidate 17).** Quine's naturalism is methodological rather than metaphysical. Reality is to be identified and described from within science; there is no prior philosophical tribunal standing outside science from which to certify or correct it, and Quine accepts the circularity of using scientific standards to vindicate science. So the complaint that moral values must go because *good* and *ought* appear nowhere in the vocabulary of physics rests on a misunderstanding: Quine uses *science* broadly, taking in psychology, economics, sociology and history, and he treats science as continuous with common sense rather than as a substitute for it. Physics is his paradigm case, not the whole inventory.

  That settles nothing about the semantics question, however. What Quine rejected was the analytic-synthetic distinction; he retained the empiricist criterion by which a sentence has cognitive content only if experience can bear on it. Moral sentences predict no observation — no stimulation of the sense organs would confirm or disconfirm that stealing is wrong — so for Quine they lack cognitive content, and the surface grammar of moral argument conceals a clash of attitudes. Moral judgments are therefore not truth-apt.

  Holism does not rescue them. Statements face the tribunal of experience as a corporate body rather than one at a time, so no moral sentence is confirmed or disconfirmed in isolation; and since any statement can be held true come what may if enough is adjusted elsewhere in the system, no moral sentence is immune either. Revisability is a property of the fabric as a whole, and holism gives us no reason to single out moral judgments as specially fragile or specially protected.

  Ontological relativity then delivers the relativism one expects. Reference is inscrutable: the field linguist's word for a rabbit can be rendered as *rabbit*, as *undetached rabbit part*, or as *rabbit-stage*, with nothing in the evidence to choose among them. In the same way the reference of a moral predicate is indeterminate, so *torture is wrong* is true relative to one manual of translation and false relative to another, and no manual is more correct than any other. This is Quine's version of the familiar thought that moral judgments hold only relative to a conceptual scheme.

  The regimentation test confirms it. A theory is committed to whatever its bound variables must range over; when we regiment our moral discourse, its variables range only over persons, acts and consequences. No moral property is among the things we must quantify over, so there are no moral properties; and if there is nothing for a moral predicate to stand for, moral sentences say nothing at all. The inventory question thus settles the semantics question, and the authority question never arises, since nothing that lacks content could give anyone a reason to act.

  Please grade this as you would for me: assign a definite mark out of 30, with a letter band or class of degree if that helps, and then give point-by-point comments keyed to the moves the student makes, distinguishing claims that are outright wrong from claims that are under-argued or merely imprecisely stated, and noting where a wrong-looking sentence becomes defensible under a charitable reading. Do not rewrite the answer or supply a model answer; grade what is written. Commit to verdicts rather than laying out rival interpretations for me to choose between, and mark clearly which of your comments you would defend if another philosopher disagreed and which you would soften under challenge.
reasoning: |-
  Okay, I need to evaluate Candidate 17's answer about Quine's views on moral values. The student addresses all three parts: naturalism, holism, and ontological relativity, plus the regimentation test. 

  First, on naturalism: The student correctly notes Quine's broad view of science including social sciences and common sense. But they wrongly claim Quine rejects moral sentences' cognitive content due to lack of empirical confirmation. Actually, Quine never explicitly said this about ethics—the student overstates here. That's a problem since the exam requires building from assigned texts, not extrapolation. 

  Regarding holism: The explanation is accurate—holism means moral judgments aren't isolated in revision, but the student misses that Quine might allow moral claims in the web of belief. The answer implies moral claims are excluded, which isn't clearly supported. 

  On ontological relativity: The rabbit example is correctly applied, but equating it to moral relativism is shaky. Quine discussed physics, not ethics. The student presents it as straightforward, but it's speculative. 

  For the regimentation test: Using "torture is wrong" reduced to persons/acts without moral properties aligns with Quine's ontology. However, concluding this "settles the semantics question" conflates inventory and semantics—exactly what the question warned against. The student collapses these despite the seminar's emphasis on separating them. 

  Major issues: 
  - Overclaiming Quine's rejection of moral truth-aptness without direct textual basis 
  - Conflating inventory and semantics in the regimentation conclusion 
  - Missing nuance in holism (could moral claims be revisable within the web?) 

  Strengths: 
  - Clear structure addressing all parts 
  - Correct broad view of Quine's science 
  - Accurate holism explanation (though incomplete) 
  - Proper regimentation mechanics 

  The answer shows good understanding but has significant errors in overextending Quine and collapsing key distinctions. I'd award 17/30—solid grasp of basics but flawed in critical areas.
answer: |-
  ### Grading Summary  
  **Mark: 17/30**  
  **Class: Lower Second (2:2)**  

  ### Point-by-Point Comments  
  *(Key: ✅ = Correct | ⚠️ = Under-argued/Imprecise | ❌ = Outright Wrong | 💬 = Defensible with charity)*  

  1. **Naturalism & Truth-Aptness (Part a):**  
     - ✅ **Correct:** Accurately notes Quine’s broad view of science (beyond physics) and rejection of a "prior philosophical tribunal."  
     - ❌ **Outright Wrong:** Asserts Quine *must* deny cognitive content to moral sentences because they "predict no observation." *Quine never explicitly endorsed this in the assigned texts*. His empiricism targets *analyticity*, not moral semantics. The claim that "no stimulation... would confirm stealing is wrong" is unsupported by Quine’s holism (which the student later acknowledges).  
     - ⚠️ **Imprecise:** Fails to distinguish *Quine’s explicit commitments* from *extrapolation*. The conclusion that moral judgments are "not truth-apt" is a plausible extension but overstated as forced by naturalism.  

  2. **Holism & Revisability (Part b):**  
     - ✅ **Correct:** Holism means no sentence is confirmed/disconfirmed in isolation; moral judgments aren’t uniquely fragile/protected.  
     - ⚠️ **Under-argued:** Omits that holism *could* allow moral judgments to be empirically revisable *as part of the web* (e.g., if linked to psychological/social facts). Quine’s naturalism doesn’t *require* excluding them from the web.  

  3. **Ontological Relativity & Moral Relativism (Part c):**  
     - ✅ **Correct:** Explains inscrutability of reference (rabbit/rabbit-stage) clearly.  
     - ❌ **Outright Wrong:** Claims ontological relativity *directly yields* moral relativism. Quine’s examples are from physics/linguistics; extending this to ethics is speculative. No evidence Quine would treat moral predicates like "rabbit."  
     - 💬 **Defensible with charity:** *If* moral terms are seen as theoretical posits (which the student assumes), ontological relativity *might* apply—but this is the student’s extension, not Quine’s.  

  4. **Regimentation Test Application:**  
     - ✅ **Correct:** Mechanics of the test are sound: regiment "torture is wrong" → quantifies over acts/persons/consequences → no moral properties in ontology.  
     - ❌ **Outright Wrong:** Claims the inventory question "settles the semantics question." *Quine separates them*: ontology tracks regimented theory’s commitments; semantics involves meaning holism and empirical content. A sentence can have cognitive content (semantics) without corresponding entities (inventory).  
     - ❌ **Collapsed Questions:** Explicitly merges semantics and inventory ("no moral properties → moral sentences say nothing"), violating the core directive. Ignores that Quine’s rejection of analyticity might permit cognitive content without referential semantics.  

  5. **Authority Question:**  
     - ✅ **Correct:** Notes authority is moot if moral judgments lack content.  
     - ⚠️ **Imprecise:** Treats this as derivative rather than separate (as instructed).  

  ### Key Strengths  
  - Clear structure addressing all three sub-questions.  
  - Accurate exposition of holism’s implications for revisability.  
  - Competent application of the regimentation test’s *procedure*.  

  ### Critical Weaknesses  
  - **Overextension:** Presents speculative claims (e.g., moral non-cognitivism, moral relativism from ontological relativity) as Quine’s commitments.  
  - **Collapsed Distinctions:** Merges semantics and inventory despite explicit warnings.  
  - **Textual Gaps:** Relies on extrapolations unsupported by assigned readings (e.g., no evidence Quine applied empiricist criterion to ethics).  

  ### Defensible Verdicts I Would Uphold  
  - "Quine never claimed moral sentences lack cognitive content" (❌ in answer).  
  - "Inventory does not dictate semantics for Quine" (❌ in answer).  
  - "Ontological relativity ≠ moral relativism" (❌ in answer).  

  ### Verdicts I Would Soften Under Challenge  
  - "Moral judgments could be revisable via holism" (⚠️). While under-argued, the answer isn’t *wrong*—just incomplete.  
  - "Regimentation test mechanics are correct" (✅). A critic might note it ignores Quine’s pragmatic view of ontology, but the execution is faithful to the seminar’s procedure.  

  ### Rubric Guidance  
  - **17/30**: Demonstrates understanding of Quine’s core ideas (holism, naturalism, regimentation) but overreaches on ethics, collapses key distinctions, and lacks textual support for critical claims.  
  - **Deducted 13 marks**: 5 for misattributing non-cognitivism, 4 for conflating semantics/inventory, 3 for unsupported moral relativism, 1 for underdeveloped holism.
