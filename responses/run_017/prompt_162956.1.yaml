  ### Central Handout: Mathematics, Truth, and Proof  
  *Follow the tree by answering each question based on your pre-theoretic intuitions. Begin from the shared commitment that mathematical discourse is truth-apt and mathematicians are largely reliable. The path you take will lead to a named philosophical position forced by Benacerraf’s dilemma (semantics vs. epistemology) and the identification problem (which objects?).*

  #### Decision Tree:  
  1. **Must mathematical knowledge be explainable via natural processes (no non-natural faculties)?**  
     - **Yes** → 2  
     - **No** → 3  

  2. **Can a machine trained only on proofs/texts (no causal contact with abstracta) know mathematics?**  
     - **Yes** → 4  
     - **No** → 5  

  3. **Do mathematical truths require non-spatiotemporal objects to exist?**  
     - **Yes** → 6  
     - **No** → 7  

  4. **When doing arithmetic, do we describe specific objects or a pattern?**  
     - **Objects** → 8  
     - **Pattern** → 9  

  5. **Is human mathematical knowledge grounded in linguistic/conceptual practices?**  
     - **Yes** → 10  
     - **No** → *Gap: Incoherent* (Naturalism requires a natural basis for knowledge)  

  6. **In rival set-theoretic reductions (e.g., Zermelo vs. von Neumann ordinals differing on "3 ∈ 5?"), is there one correct reduction?**  
     - **Yes** → *Object Platonism*  
     - **No** → 9  

  7. **Can math truths be paraphrased into non-mathematical statements?**  
     - **Yes** → *Figuralism (Yablo)*  
     - **No** → 11  

  8. **Is mathematical truth about unique objects or arbitrary instantiations?**  
     - **Unique objects** → *Object Platonism*  
     - **Arbitrary** → *Ante Rem Structuralism*  

  9. **Is every consistent theory true of some structure?**  
     - **Yes** → *Full-Blooded Platonism*  
     - **No** → *Modal Structuralism*  

  10. **Is math knowledge based on implicit definitions/rules?**  
      - **Yes** → *Neo-Fregeanism*  
      - **No** → *Fictionalism (Field)*  

  11. **Must true math statements have truth-makers?**  
      - **Yes** → *Gap: Unattractive* (Fails Benacerraf’s dilemma)  
      - **No** → *Quietism*  

  ---

  #### Positions and Their Uncomfortable Commitments:  
  - **Object Platonism**: Abstract objects exist, but their epistemic access is mysterious.  
  - **Full-Blooded Platonism**: All consistent theories describe real structures, bloating ontology.  
  - **Ante Rem Structuralism**: Structures exist independently, but their epistemology is obscure.  
  - **Modal Structuralism**: Math is about possible concrete systems, straining modality.  
  - **Fictionalism (Field)**: Math is useful fiction, making pure math "false".  
  - **Figuralism (Yablo)**: Math is metaphorical, risking loss of literal truth.  
  - **Neo-Fregeanism**: Numbers exist by definition, inviting Caesar Problem (which objects?).  
  - **Quietism**: Rejects ontology/epistemology demands, appearing evasive.  

  #### Unoccupied Combinations:  
  - **Node 5 → "No"**: Incoherent (naturalism requires *some* natural basis for knowledge).  
  - **Node 11 → "Yes"**: Unattractive (reopens Benacerraf’s dilemma).  

  #### Indistinguishable Leaves:  
  - **Fictionalism vs. Figuralism** collapse without a node on *nominalistic reconstruction* (e.g., "Can math be reformulated in purely physical terms?"). The tree groups them; further work separates them.  

  #### Closing Note:  
  The most pivotal node is **Q2 (Machine Knowledge)**. It forces naturalists to either accept non-causal reliability (enabling platonism) or explain human uniqueness under naturalism—exposing the core tension in Benacerraf’s epistemology horn. Spend seminar time here to dissect causal vs. non-causal accounts of knowledge.  

