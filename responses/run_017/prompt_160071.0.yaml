  ### Decision Tree for Single-Case Risk Probability Assignment

  #### 1. The Tree  
  Start at the root: "I have exactly one individual, and someone demands one probability number." Answer each question based solely on case-file details. Proceed down the branches until you reach a leaf (a named position or approach).

  **Q0: Is the case typical of any reference class (i.e., are there groups with similar characteristics and known outcomes)?**  
  - **No** → **Leaf 1: Only Class Rates, No Single-Case Probability**  
    Stop. Probability is only meaningful for groups, not individuals. Report the class rate with a disclaimer about its applicability to the individual case.
  - **Yes** → Proceed to Q1.

  **Q1: Is there reliable statistical data for a non-circular reference class defined by factors fixed at prediction time (e.g., age, diagnosis date), excluding legally prohibited attributes (e.g., ethnicity, sex)?**  
  - **No** → Proceed to Q6.  
  - **Yes** → Proceed to Q2.

  **Q6: Can you form a reasonable probability estimate using subjective judgment (e.g., expert intuition, case-specific details)?**  
  - **Yes** → **Leaf 4: Coherent Choice of Class**  
    Any class is acceptable if probabilities are updated coherently via Bayes’ rule.  
  - **No** → **Leaf 7: Pragmatic Class Selection**  
    Pick a class based on the decision context (e.g., cost of false positives/negatives, how the number will be used).

  **Q2: Does the outcome depend on future choices or events not fixed at prediction time (e.g., individual actions, random occurrences)?**  
  - **Yes** → **Leaf 5: Single-Case Chance with Class as Evidence**  
    A genuine single-case probability exists (e.g., propensity); class data is merely evidence for it.  
  - **No** → Proceed to Q3.

  **Q3: Are there multiple admissible reference classes (non-circular, fixed factors, reliable data, legally permissible)?**  
  - **No (one class only)** → Proceed to Q4.  
  - **Yes (multiple classes)** → Proceed to Q5.

  **Q4: Can this class be subdivided using available factors (e.g., severity, comorbidities) in a way that significantly changes the outcome rate?**  
  - **No** → **Leaf 3: Invariant Class**  
    Use a class whose rate doesn’t change under relevant subdivisions.  
  - **Yes** → **Leaf 2: Narrowest Reliable Class**  
    Use the narrowest class with sufficient data (even if broader subdivisions might exist).

  **Q5: Is there a unique narrowest class with reliable data (e.g., most specific subgroup without statistical noise)?**  
  - **Yes** → **Leaf 2: Narrowest Reliable Class** (as above).  
  - **No** → Proceed to Q7.

  **Q7: Is there an invariant class (rate unchanged under subdivisions) among the options?**  
  - **Yes** → **Leaf 3: Invariant Class** (as above).  
  - **No** → Proceed to Q8.

  **Q8: Do all admissible classes yield similar outcome rates (e.g., within 5 percentage points)?**  
  - **Yes** → **Leaf 4: Coherent Choice of Class** (as above).  
  - **No** → Proceed to Q9.

  **Q9: Is the decision context well-defined (e.g., known costs of errors, clear use for the number)?**  
  - **Yes** → **Leaf 7: Pragmatic Class Selection** (as above).  
  - **No** → **Leaf 6: Report Spread of Admissible Classes**  
    Refuse one number; disclose the range from all valid classes.

  #### 2. The Leaves  
  **Leaf 1: Only Class Rates, No Single-Case Probability**  
  Report the class rate without attributing it to the individual. The most awkward thing: You may face pressure to "just give a number," but must explain why it doesn’t apply to the case.  
  **Leaf 2: Narrowest Reliable Class**  
  Use the most specific group with robust data. The most awkward thing: The class may be too broad (e.g., ignoring key modifiers), making the number feel uninformative.  
  **Leaf 3: Invariant Class**  
  Use a class immune to rate-altering subdivisions. The most awkward thing: Invariant classes are rare; you might use a broad group and overlook finer details.  
  **Leaf 4: Coherent Choice of Class**  
  Any class works if probabilities are updated logically (e.g., Bayesian). The most awkward thing: Subjective input risks appearing arbitrary or unscientific.  
  **Leaf 5: Single-Case Chance with Class as Evidence**  
  The probability is inherent to the case; class data informs it. The most awkward thing: Choosing which class to use as evidence remains subjective and controversial.  
  **Leaf 6: Report Spread of Admissible Classes**  
  Disclose a range, not one number. The most awkward thing: Decision-makers may ignore the spread or demand a single "best guess."  
  **Leaf 7: Pragmatic Class Selection**  
  Choose a class based on decision theory (e.g., error costs, use case). The most awkward thing: You may be accused of bias for tailoring numbers to context.

  #### 3. Empty Cells  
  Combinations that rarely occur:  
  - **"No" at Q0 + "Yes" at Q1**: If the case is atypical but has reliable class data, why was it deemed atypical? Likely unused because analysts exclude classes where the individual is an outlier.  
  - **"No" at Q2 + "No" at Q3 + "No" at Q4**: One class exists, but it’s subdividable and invariant—a contradiction. Unused because subdividability implies non-invariance.  
  - **"Yes" at Q8 + "Yes" at Q9**: Classes agree, but a well-defined context exists. Unused because agreement negates the need for pragmatic overrides.  
  These gaps arise from cognitive biases (e.g., ignoring invariant classes when subdivisions exist) or case constraints (e.g., atypical cases rarely have data).

  #### 4. Where It Breaks  
  **Problematic nodes:**  
  - **Q0 (Typicality)**: Subjective and vague (e.g., "typical for a startup" is ill-defined). Analysts may default to "yes" to avoid Leaf 1.  
  - **Q2 (Future Dependencies)**: Overly broad. *All* cases have future unknowns, so this often forces Leaf 5 (e.g., the pilot case always lands here, even when class data is robust).  
  **Poorly handled cases:**  
  - **Startup survival**: Always routed to Leaf 5 via Q2 (due to unpredictable markets/choices), ignoring useful classes (e.g., industry benchmarks).  
  - **Legally prohibited class (e.g., ethnicity) with a proxy**: The proxy may be admissible at Q1, but if rates conflict (Q8 → "no"), the tree defaults to Leaf 6/7. This overlooks ethical dilemmas (e.g., proxies perpetuating bias).  
  - **Claimant returning to work**: If future choices (Q2) dominate, Leaf 5 is used, disregarding invariant classes (e.g., "similar injury severity").  
  **Overall**: The tree struggles when "future dependencies" (Q2) are trivial or when multiple classes are admissible but disagree (Q8 → "no"), as this forces context-dependent (Leaf 7) or evasive (Leaf 6) answers. It also underserves cases where class construction is political (e.g., prohibited variables).  

  ---  
  **Tree Logic Applied to Pilot Case (52-year-old pilot post-arrhythmia):**  
  - Q0: Yes (typical of "pilots with arrhythmia").  
  - Q1: Yes (data exists, e.g., FAA medical recertification stats).  
  - Q2: Yes (outcome depends on future choices: compliance/retirement).  
  - → Leaf 5: Use class data (e.g., "compliant pilots") as evidence for a single-case probability.  
  *Other cases follow similar paths: e.g., startup (Leaf 5), claimant (Leaf 5), prohibited class (varies, but often Leaf 6/7 if proxies conflict).*
