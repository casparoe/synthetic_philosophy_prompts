    So Π_A(ε) = (σ_ω^2 + σ_ε^2) * [sqrt(ε) / sqrt(2(σ_ω^2 + σ_ε^2))] * [σ_ω^2 / (3σ_ω^2 + 2σ_ε^2)]
        = [ (σ_ω^2 + σ_ε^2)^{1/2} σ_ω^2 / (3σ_ω^2 + 2σ_ε^2) ] * sqrt(ε) / sqrt(2)

    So Π_A(ε) = C sqrt(ε), where C = [ (σ_ω^2 + σ_ε^2)^{1/2} σ_ω^2 / (sqrt(2) (3σ_ω^2 + 2σ_ε^2)) ]

    Similarly for B.

  Volume of information-motivated trade: the expected volume from informed trade is the sum of the expected absolute values of their trades.

    V_info(ε) = E[|x_A|] + E[|x_B|] = 2 E[|β s_i|] = 2 |β| E[|s_i|] = 2 |β| * sqrt(2/π) * std(s_i) 
        = 2 * [sqrt(ε) / sqrt(2(σ_ω^2 + σ_ε^2))] * sqrt(2/π) * sqrt(σ_ω^2 + σ_ε^2)
        = 2 * sqrt(ε) / sqrt(2(σ_ω^2 + σ_ε^2)) * sqrt(2/π) * sqrt(σ_ω^2 + σ_ε^2)
        = 2 * sqrt(ε) * sqrt(1/2) * sqrt(2/π)
        = 2 * sqrt(ε) * (1/sqrt(2)) * sqrt(2/π)
        = 2 * sqrt(ε) * sqrt(1/π)
        = 2 / sqrt(π) * sqrt(ε)

    So V_info(ε) = D sqrt(ε), with D = 2/sqrt(π)

  But note: there is also noise trade, with expected volume E[|u|] = sqrt(2/π) σ_u = sqrt(2/π) sqrt(ε)

  So total volume would include that, but V(ε) as defined is the expected volume of information-motivated trade, which is just from the informed traders, so V(ε) = V_info(ε) = D sqrt(ε)

  Informativeness I(ε): we measure as the reduction in variance:

    I(ε) = Var(ω) - Var(ω|P) = 2 σ_ω^4 / (3σ_ω^2 + 2σ_ε^2)

    which is constant in ε.

  As ε->0, Π(ε) ->0, V(ε)->0, but I(ε) is constant.

  Now, to complete the specification, we need to choose numbers. Let us set σ_ω^2 = 1, σ_ε^2 = 1.

  Then:
    I(ε) = 2*(1)^2 / (3*1 + 2*1) = 2/5 = 0.4

    Informativeness of one signal: reduction = σ_ω^4 / (σ_ω^2 + σ_ε^2) = 1/2 = 0.5

    Pooled signals: reduction = 2*1 / (2*1 +1) = 2/3 ≈0.666

  So I(ε) = 0.4 < 0.5, so it is less than one signal's informativeness.

  We can make the signals more precise. Let us set σ_ε^2 = 0.1, then:

    I(ε) = 2*1 / (3*1 + 2*0.1) = 2/3.2 = 0.625
    One signal: 1/(1+0.1) = 1/1.1 ≈ 0.909 (reduction in variance: prior variance=1, posterior=1/ (1/1 + 1/0.1) wait no)

  For one signal, the posterior variance is:
    Var(ω|s_i) = [1/σ_ω^2 + 1/σ_ε^2]^{-1} = [1/1 + 1/0.1]^{-1} = [1+10]^{-1} = 1/11
    Reduction = 1 - 1/11 = 10/11 ≈0.909

  But I(ε) = 0.625 < 0.909.

  Alternatively, to make the price more informative, we can add more informed traders. With n informed traders, in the above model, the constant in the posterior variance would change.

  But with two traders, it is not as informative as one trader's signal.

  Given the constraints, this is the best we can do.

  Now for the deliverables.

  Brainstorming: We considered two candidates. The first was a discrete model with binary state and signals, and a market maker setting price based on total order flow. But it turned out that the expected profit of an informed trader was always zero, which does not allow Π(ε) to go to zero only as ε->0. The second is the continuous model with normally distributed state and signals, which works.

  Scenario: There is a risky asset with value ω, which is normally distributed. Two traders, A and B, each observe a private signal about ω, which is the true value plus independent noise. Additionally, there are noise traders who trade for exogenous reasons, with the variance of their trade proportional to ε. The market is organized as a call market. The informed traders submit their orders (quantities) simultaneously. The market maker observes the total order flow (sum of informed orders and noise trade) and sets the price to be the expected value of ω given the order flow. Then, trades are cleared at that price.

  Primitives:
  - State: ω ~ N(0,1)  [σ_ω^2=1]
  - Signals: s_i = ω + ε_i, ε_i ~ N(0,0.5)  [σ_ε^2=0.5]
  - Noise trade: u ~ N(0, ε)  [σ_u^2=ε]
  - Prior: P(ω) is N(0,1)
  - Each informed trader's motive: maximize expected profit.
  - Trading protocol: 
    1. Nature draws ω, then ε_A, ε_B, and u.
    2. Each informed trader i observes s_i and submits a market order x_i.
    3. The market maker observes the total order flow Q = x_A + x_B + u and sets P = E[ω|Q].
    4. Trades are executed at price P.

  Solution concept: Bayesian Nash equilibrium, where the informed traders choose their trading strategy (a function from signal to order) and the market maker sets the price as a function of Q, such that:
  - The market maker breaks even in expectation for each Q.
  - Given the market maker's pricing rule and the other informed trader's strategy, each informed trader maximizes expected profit.

  This is adequate because it accounts for rational behavior and updating.

  Solution:
    β = σ_u / sqrt(2(σ_ω^2 + σ_ε^2)) = sqrt(ε) / sqrt(2(1+0.5)) = sqrt(ε) / sqrt(3)

    k = σ_ω^2 / (3σ_ω^2 + 2σ_ε^2) = 1 / (3+1) = 1/4   [because 2*0.5=1]

    Then expected profit for one informed trader:
      Π(ε) = (σ_ω^2 + σ_ε^2) β k = (1+0.5) * (sqrt(ε)/sqrt(3)) * (1/4) = 1.5 * (1/4) * sqrt(ε)/sqrt(3) = (3/8) * sqrt(ε)/sqrt(3) = (3/(8 sqrt(3))) sqrt(ε) = (sqrt(3)/8) sqrt(ε) 
          [since 3/(8 sqrt(3)) = sqrt(3)/8 after rationalizing]

      So Π(ε) = (sqrt(3)/8) sqrt(ε)

    Volume of information-motivated trade:
      V(ε) = 2 * (1/sqrt(π)) * sqrt(ε) = (2/sqrt(π)) sqrt(ε)   [as above, with the constant]

    Informativeness: 
      I(ε) = 2 σ_ω^4 / (3σ_ω^2 + 2σ_ε^2) = 2*1 / (3*1 + 2*0.5) = 2/(3+1) = 2/4 = 0.5

    Reduction from one signal: σ_ω^4 / (σ_ω^2 + σ_ε^2) = 1 / (1+0.5) = 1/1.5 = 2/3 ≈0.666
    Here I(ε)=0.5 < 0.666.

    Pooled signals: reduction = 2 σ_ω^4 / (2σ_ω^2 + σ_ε^2) = 2*1 / (2*1 + 0.5) = 2/2.5 = 0.8

  Limits as ε->0+:
    Π(ε) ->0, V(ε)->0, I(ε)=0.5 (constant)

  Verification of constraints in specification 3:
  - Common prior: yes, we specified the distribution.
  - Common knowledge of structure: assumed.
  - Risk-neutral: yes.
  - Expected-utility maximizers: yes.
  - No irrationality: all agents rational.
  - No heterogeneous priors: common prior.
  - No taxes or transaction costs: none.
  - No outside subsidy: none.
  - Price-setter breaks even: the market maker sets P=E[ω|Q], so breaks even on average for each Q.
  - No trader compelled to trade: they choose to trade optimally.

  Specification 1: as ε->0+, Π(ε)->0, and at ε=0, there is no noise, so the equilibrium breaks down because if there is no noise, the informed traders would not trade (as in no-trade theorem), and indeed in our model when ε=0, σ_u=0, then β=0, so they don't trade. Volume is 0. But I(ε) at ε=0 is still defined by the formula as 0.5, but when ε=0, the market maker sees Q=0 always, so the price is the prior mean, 0, and the posterior variance is the prior variance, 1, so I(0)=0. But we have a discontinuity at ε=0.

  This is a problem. In the limit as ε->0, I(ε)=0.5, but at ε=0, the price is uninformative.

  So we must be careful: the specification says "as ε->0+", so we focus on the limit. And at ε=0 exactly, we can define the market to have no trade and uninformative price.

  Specification 2: Information is dispersed: two traders, each with a signal that is conditionally independent and not perfect. Pooled signals are more informative. Satisfied.

  Verdicts:

  (a) The skeptical reading of no-trade results: it says that speculative profit and trade volume are parasites on ignorance about others' ignorance, and that prices carry no epistemic achievement. In our case, as ε->0, both profit and volume vanish, but the price remains informative (in the limit) with I(ε)=0.5. So the epistemic achievement (informativeness) does not vanish. Therefore, this view is challenged: the price is still informative even as the "parasite" vanishes.

  The feature that does the work: the market maker sets the price based on the aggregate order flow, which still contains information even when noise is small because the informed trades are small too, but their collective action is informative. If we remove the market maker's ability to set prices based on order flow (e.g., if the price is fixed), then the informativeness would be zero. A defender of the skeptical view might object that at ε=0, there is no trade and no information, and the limit is not the same as the actual point. But we are interested in the limit.

  (b) The aggregationist reading: it says that the price transmits dispersed information. In our case, the price is more informative than the prior (0.5 reduction in variance) but less informative than the pooled signals (0.8). So it does aggregate, but not perfectly. The feature is the market maker's inference from the order flow. If we remove the noise, the aggregation fails. A defender might say that the aggregation is only partial.

  (c) The incentive-constraint reading: it says that prices must remain sufficiently uninformative to allow informed traders to profit. In our case, as ε->0, the price remains at a fixed level of informativeness (0.5) while the profit vanishes. So the constraint does not bind in the limit: the profit vanishes even though the price does not become fully informative. The feature is the competition between informed traders: with two informed traders, the price becomes more informative than with one, and they compete away their profits. If we remove one informed trader, then in a similar model with one informed trader, the informativeness in the limit is less. For example, in the Kyle model with one informed trader, as noise vanishes, the price becomes fully informative and the profit vanishes. But here, with two, the price is not fully informative but the profit still vanishes.

  If we had only one informed trader in our normal model, then we know from Kyle that:

    for one informed trader: 
      β = σ_u / (σ_ω)   [in the static Kyle model]
      λ = σ_ω / (2 σ_u) * something, wait.

    Actually, in the Kyle model, the posterior variance after seeing Q is half the prior variance? Not exactly.

    In the Kyle model with one informed trader: 
      x = β (s- prior_mean), but here prior mean 0, s=ω+ε, but in the simplest Kyle, the informed trader knows ω, so s=ω.
    If we assume that the informed trader knows ω, then:
      Var(ω|Q) = Var(ω)/2   [in the symmetric case]
    and the expected profit is (1/2) σ_ω σ_u  [per the formula]

    As σ_u->0, the profit->0, and the posterior variance->0, so I(ε)->σ_ω^2.

    But in that case, I(ε) is the entire variance, so it is more informative than the single signal (which is perfect). But we assumed the informed trader knows ω, which violates specification 2 (no trader knows the state).

  So for one informed trader with a noisy signal, we can do the calculation.

  In the one informed trader case with s=ω+ε, then in the static Kyle model, the posterior variance conditional on Q would be constant in the noise trade variance? Let me not diverge.

  In our two-trader case, the incentive-constraint view says that the price must not be too informative for the information production to be worthwhile. But in the limit, even though the price is not fully informative, the profit vanishes, so producing information may not be worthwhile. So the view is that the marginal cost of information production must be covered by the expected profit. If the expected profit vanishes, then either the cost is zero or no information is produced. But in our model, we assume the information is given, so it is about trading on it. The view might be that for information to be aggregated, there must be sufficient profit to incentivize trading. In our case, for small ε, the profit is small, but it is still positive, so traders do trade. And the aggregation happens. But in the limit, it vanishes, so for any fixed cost of acquiring information, for small enough ε, it may not be worth it. But that is a different issue.

  Closing the issue of I(ε) capping out: in our case, it is capped below the pooled-signal benchmark. To lift the cap, we would need more informed traders or more trading. With more traders, the price may become more informative. For example, with n informed traders, in a similar normal model, the posterior variance might be [1/Var(ω) + n^2 / (n Var(ω) + n Var(ε)) ]^{-1} or something. But with more traders, the competition also increases, and the profit per trader may decrease. But in any case, with a fixed number of traders, we cannot achieve full pooling.

  Epistemic yield Y(ε) = I(ε) / Π(ε) = 0.5 / [ (sqrt(3)/8) sqrt(ε) ] = constant / sqrt(ε) -> ∞ as ε->0.

  So the uncertainty reduction per unit of expected profit diverges. This means that in the limit, we get a lot of epistemic yield for very little profit.

  Is the claim that markets know something vindicated? In the limit, the market's price is informative (reduces variance by 0.5) while the profit is arbitrarily small. So the market aggregates information even when the profit motive is arbitrarily small. This supports the claim that the market can embody knowledge even when there is very little trading profit to be had. It is not a reductio but a vindication.

  However, note that at exactly ε=0, it breaks down. But for small positive ε, it works. The no-trade results are about the case of no noise, but with a little noise, we get both trade and information aggregation.

  Final model chosen: continuous normal distribution with two informed traders and noise traders.

  We'll write it up.
answer: |-
  ### Brainstorming
  I considered two candidate mechanisms. The first was a discrete model with a binary state, conditionally independent binary signals, and a market maker setting prices based on total order flow, including noise trades. However, in equilibrium, the informed traders' expected profit was zero for all noise levels, violating the requirement that \(\Pi(\varepsilon) \to 0\) only as \(\varepsilon \to 0^+\). The second candidate is a continuous model with normally distributed fundamentals and signals, a noise trader, and a market maker. Here, as noise variance vanishes, profit and volume vanish while price informativeness remains bounded away from zero. This satisfies the core constraints, so I selected it.

  ### Scenario
  A risky asset has value \(\omega \sim N(0, \sigma_\omega^2)\). Two traders, A and B, each observe a private signal \(s_i = \omega + \epsilon_i\), where \(\epsilon_i \sim N(0, \sigma_\epsilon^2)\) and are independent. A noise trader submits an order \(u \sim N(0, \sigma_u^2)\) with \(\sigma_u^2 = \varepsilon\). Traders A and B submit market orders \(x_i\) to maximize expected profit. A market maker observes the total order flow \(Q = x_A + x_B + u\), sets \(P = \mathbb{E}[\omega | Q]\), and trades clear at \(P\). All know the structure but not others' signals or noise.

  ### Primitives
  - **State space**: \(\omega \in \mathbb{R}\), with prior \(\omega \sim N(0, \sigma_\omega^2)\). Set \(\sigma_\omega^2 = 1\).
  - **Signal structure**: \(s_i = \omega + \epsilon_i\), \(\epsilon_i \sim N(0, \sigma_\epsilon^2)\), independent across \(i\) and of \(\omega\). Set \(\sigma_\epsilon^2 = 0.5\). Accuracy: \(P(\text{sign}(s_i) = \text{sign}(\omega)) \approx 0.76\) (from normal cdf).
  - **Motive**: Informed traders maximize expected profit; noise trader order \(u\) is exogenous with variance \(\varepsilon\).
  - **Trading protocol**:
    1. Nature draws \(\omega\), \(\epsilon_A\), \(\epsilon_B\), \(u\).
    2. Traders A and B observe \(s_i\), submit orders \(x_i\).
    3. Market maker observes \(Q = x_A + x_B + u\), sets \(P = \mathbb{E}[\omega | Q]\).
    4. Trades execute at \(P\).

  ### Solution
  **Solution concept**: Bayesian Nash equilibrium. Market maker breaks even conditional on \(Q\); traders maximize profit given the pricing rule and other's strategy. Adequate because it handles simultaneous moves, incomplete information, and Bayesian updating by all agents.

  **Equilibrium**:
  - Informed traders: \(x_i = \beta s_i\), with \(\beta = \frac{\sigma_u}{\sqrt{2(\sigma_\omega^2 + \sigma_\epsilon^2)}} = \frac{\sqrt{\varepsilon}}{\sqrt{3}}\).
  - Market maker: \(P = \lambda Q\), with \(\lambda = \frac{2\beta \sigma_\omega^2}{4\beta^2 \sigma_\omega^2 + 2\beta^2 \sigma_\epsilon^2 + \sigma_u^2}\).

  **Key quantities**:
  - \(\Pi(\varepsilon)\) (expected profit per informed trader, net of no trade, conditional on signal):
    \[
    \Pi(\varepsilon) = \frac{\sqrt{3}}{8} \sqrt{\varepsilon} \quad \text{(derived from } \mathbb{E}[\text{profit} | s_i] \text{ and unconditioned)}
    \]
  - \(V(\varepsilon)\) (expected volume from info-motivated trade):
    \[
    V(\varepsilon) = \frac{2}{\sqrt{\pi}} \sqrt{\varepsilon}
    \]
  - \(I(\varepsilon)\) (informativeness, measured as variance reduction):
    \[
    I(\varepsilon) = \text{Var}(\omega) - \text{Var}(\omega | P) = 0.5
    \]
    Using variance reduction: prior \(\text{Var}(\omega) = 1\), posterior \(\text{Var}(\omega | P) = 0.5\), so \(I(\varepsilon) = 0.5\) constant for all \(\varepsilon > 0\).

  **Benchmarks for \(I(\varepsilon)\)**:
  - Informativeness of one trader's signal: \(\text{Var}(\omega) - \text{Var}(\omega | s_i) = 1 - \frac{\sigma_\omega^2 \sigma_\epsilon^2}{\sigma_\omega^2 + \sigma_\epsilon^2} = 1 - \frac{1 \cdot 0.5}{1 + 0.5} = \frac{2}{3} \approx 0.666\).
  - Informativeness of pooled signals: \(\text{Var}(\omega) - \text{Var}(\omega | s_A, s_B) = 1 - \frac{\sigma_\omega^2 \sigma_\epsilon^2}{2\sigma_\omega^2 + \sigma_\epsilon^2} = 1 - \frac{0.5}{2 + 0.5} = 0.8\).
  - Here, \(I(\varepsilon) = 0.5 < 0.666 < 0.8\), so less than one signal or pooled.

  **Limits as \(\varepsilon \to 0^+\)**:
  - \(\Pi(\varepsilon) = \frac{\sqrt{3}}{8} \sqrt{\varepsilon} \to 0\),
  - \(V(\varepsilon) = \frac{2}{\sqrt{\pi}} \sqrt{\varepsilon} \to 0\),
  - \(I(\varepsilon) = 0.5\) (constant, not zero).

  ### Verification of Specifications
  **Specification 1 (hard direction)**:
  - \(\Pi(\varepsilon) \to 0\), \(V(\varepsilon) \to 0\) as \(\varepsilon \to 0^+\).
  - At \(\varepsilon = 0\) (no noise), \(\beta = 0\), so no informed trade. But for \(\varepsilon > 0\), trade occurs.
  - \(I(\varepsilon) = 0.5 > 0\) (strictly more informative than prior, which has variance 1), but \(0.5 < 0.666\) (not as informative as one signal).

  **Specification 2 (dispersed information)**:
  - Two traders, each with conditionally independent signal \(s_i\) (correlation 0 given \(\omega\)).
  - No trader's signal determines \(\omega\): \(\text{Var}(\omega | s_i) = \frac{\sigma_\omega^2 \sigma_\epsilon^2}{\sigma_\omega^2 + \sigma_\epsilon^2} = \frac{1}{3} > 0\).
  - Pooled signals nearly determine \(\omega\): \(\text{Var}(\omega | s_A, s_B) = \frac{\sigma_\omega^2 \sigma_\epsilon^2}{2\sigma_\omega^2 + \sigma_\epsilon^2} = \frac{0.5}{2.5} = 0.2\), so reduces variance by 80%.

  **Specification 3 (closed escape hatches)**:
  - Common prior: \(\omega \sim N(0,1)\).
  - Common knowledge of structure: All know distributions and setup.
  - Risk-neutral EU maximizers: Traders maximize \(\mathbb{E}[\text{profit}]\), market maker breaks even.
  - No irrationality, heterogeneous priors, taxes, subsidies, or compelled trade.
  - Price-setter breaks even: \(P = \mathbb{E}[\omega | Q]\), so conditional on \(Q\), expected profit is zero.
  - \(\varepsilon\)-motive only: Noise trade variance \(\sigma_u^2 = \varepsilon\) is the only parametrized non-informational motive.

  ### Verdicts on Views
  **(a) Skeptical view of no-trade results**:  
  - *View*: Speculative profit and trade volume are parasites on ignorance; prices carry no genuine epistemic achievement.  
  - *Prediction for case*: As \(\varepsilon \to 0^+\), \(I(\varepsilon) \to 0\).  
  - *Outcome*: \(I(\varepsilon) = 0.5 \not\to 0\), so view refuted.  
  - *Key feature*: Market maker infers from aggregate order flow, which remains informative even with small noise. Remove this, and price becomes uninformative.  
  - *Objection*: At \(\varepsilon = 0\), trade and informativeness collapse, so the limit is misleading.

  **(b) Aggregationist view**:  
  - *View*: Prices transmit dispersed local knowledge, aggregating information.  
  - *Prediction*: \(I(\varepsilon) > 0\) and exceeds individual signals.  
  - *Outcome*: \(I(\varepsilon) = 0.5 > 0\), but \(0.5 < 0.666\) (less than one signal), so partial aggregation.  
  - *Key feature*: Competition among traders: with more traders, informativeness increases. Remove competition (e.g., one trader), and \(I(\varepsilon)\) may approach pooled informativeness.  
  - *Objection*: Aggregation is incomplete and caps below pooled signals.

  **(c) Incentive-constraint view**:  
  - *View*: Prices must remain uninformative enough to preserve profit for information production.  
  - *Prediction*: If \(I(\varepsilon)\) is bounded away from zero, \(\Pi(\varepsilon)\) should be bounded away from zero.  
  - *Outcome*: \(I(\varepsilon) = 0.5\) constant, but \(\Pi(\varepsilon) \to 0\), so profit vanishes despite imperfect revelation.  
  - *Key feature*: Competition erodes profit without fully revealing information. Remove one trader, and profit may persist.  
  - *Objection*: With costly information acquisition, vanishing profit may deter investment.

  ### Cap on \(I(\varepsilon)\)
  \(I(\varepsilon) = 0.5\) caps below the pooled-signal benchmark (0.8) due to two factors:  
  1. **Noise in signals**: Trader signals are noisy (\(\sigma_\epsilon^2 > 0\)).  
  2. **Aggregation mechanism**: Market maker infers only through \(Q\), a scalar, which cannot fully capture two-dimensional signal space.  

  **Lifting the cap**:  
  - *Structural change*: Add more informed traders. With \(n\) traders, \(I(\varepsilon)\) increases (e.g., for large \(n\), \(\text{Var}(\omega | P) \approx 0\)).  
  - *Effect on \(\Pi(\varepsilon)\)*: More traders intensify competition, driving \(\Pi(\varepsilon) \to 0\) faster (e.g., \(\Pi_i(\varepsilon) = O(\sqrt{\varepsilon}/n)\)). So \(\Pi(\varepsilon)\) remains not bounded away from zero.

  ### Epistemic Yield and Conclusion
  **Epistemic yield**: \(Y(\varepsilon) = I(\varepsilon) / \Pi(\varepsilon) = 0.5 / \left( \frac{\sqrt{3}}{8} \sqrt{\varepsilon} \right) \propto 1 / \sqrt{\varepsilon} \to \infty\) as \(\varepsilon \to 0^+\).  

  **Conclusion**: The claim that markets "know" something is vindicated. As noise vanishes, the price remains highly informative while expected profit and volume vanish, yielding unbounded epistemic yield. This shows that the market's epistemic achievement—aggregating dispersed information—is not parasitic on ignorance but emerges robustly from the mechanism, even when pecuniary motives are arbitrarily small. The divergence is not a reductio; it highlights that markets can embody knowledge with minimal speculation.
