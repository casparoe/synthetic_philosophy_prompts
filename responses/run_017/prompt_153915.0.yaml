answer: |-
  Below is a complete grading procedure designed for undergraduate RAs, optimized for reproducibility, speed (≤5 minutes/problem), and clear escalation protocols. The procedure includes explicit decision thresholds, logging standards, and built-in safeguards against common disputes. Judgment calls are minimized and confined to predefined criteria.

  ---

  ### **Grading Procedure for Bongard Problems**  
  **RA Instructions**  
  *Time limit: 5 minutes per problem. Log decisions in one line (e.g., `ProblemID, SubmissionID, Code`). Escalate only when specified.*

  #### **Materials Provided per Problem**  
  1. 12 figures (6 left "positive", 6 right "negative").  
  2. Intended rule (from the problem creator).  
  3. Submission (solver's rule description).  
  4. **Critical examples** (2 additional figures from the generator: 1 positive, 1 negative, with labels hidden from RA).  

  ---

  #### **Steps**  
  **✅ Step 1: Fit Check (1 minute)**  
  - Apply the submission’s rule to all 12 figures.  
  - **If ANY mismatch** (left figure rejected or right figure accepted):  
    - Log `INCORRECT` and **STOP**.  
  - **Else**: Proceed to Step 2.  

  **✅ Step 2: Anti-Disjunction Check (1 minute)**  
  - Check if the rule is a disjunction (OR) of:  
    - Specific figure positions (e.g., "the first left figure has...").  
    - Unique per-figure features (e.g., "has a red triangle OR a blue circle" where no feature repeats).  
  - **If disjunctive**:  
    - Log `DISJUNCTIVE` and **STOP**.  
  - **Else**: Proceed to Step 3.  

  **⚠️ Step 3: Rephrasing Check (Judgment call; 1.5 minutes)**  
  - Compare submission to intended rule. Ask:  
    > *"Would a reasonable person interpret these as describing the SAME visual pattern? Ignore wording differences (e.g., 'closed shape' vs. 'no gaps')."*  
  - **If YES**: Log `CORRECT` and **STOP**.  
  - **If NO**: Proceed to Step 4.  

  **✅ Step 4: Critical Example Test (1 minute)**  
  - Apply submission to the 2 critical examples.  
  - **If ANY misclassification** (e.g., critical positive rejected):  
    - Log `INCORRECT_GEN` and **STOP**.  
  - **If ALL correct**: Proceed to Step 5.  

  **🚩 Step 5: Escalation (30 seconds)**  
  - Log `ESCALATE` with note: "Passed critical test but not rephrasing."  
  - **STOP**.  

  ---

  #### **Escalation Protocol**  
  - **Cap**: Max 2 escalations per 10 problems. Beyond cap: Log `AMBIGUOUS_CAP` and stop.  
  - **RA action**: Forward `ESCALATE` cases to problem creator. Do NOT decide.  
  - **Creator action**: Resolve escalations (see "Special Cases" below).  

  ---

  ### **Test Cases**  
  *Using the procedure on your examples:*  

  #### **Submission 1**  
  - **Intended**: "Outline is closed."  
  - **Submission**: "Even number of separate marks."  
  - **Procedure**:  
    1. Step 1: Passes (fits all 12).  
    2. Step 2: Not disjunctive → Proceed.  
    3. Step 3: **Not rephrasing** (open shape with 2 marks ≠ closed shape).  
    4. Step 4: Test critical examples:  
       - Critical positive (closed): e.g., 3 marks → Submission rejects (incorrect).  
       - Log `INCORRECT_GEN`.  
  - **RA Log**: `INCORRECT_GEN`  

  #### **Submission 2**  
  - **Intended**: Concise general rule (e.g., "Contains a circle").  
  - **Submission**: "Box 1: triangle, Box 2: circle, ..." (5-way disjunction).  
  - **Procedure**:  
    1. Step 1: Passes (fits all 12).  
    2. Step 2: **Disjunctive** (lists per-box features).  
    3. Log `DISJUNCTIVE`.  
  - **RA Log**: `DISJUNCTIVE`  

  #### **Submission 3**  
  - **Intended**: Specific rule (e.g., "Symmetrical shape").  
  - **Submission**: Simpler rule (e.g., "Has a mirror line"), fits generator perfectly.  
  - **Procedure**:  
    1. Step 1: Passes.  
    2. Step 2: Not disjunctive.  
    3. Step 3: **Not rephrasing** (e.g., "mirror line" ≠ "symmetrical" if RA interprets differently).  
    4. Step 4: Passes critical examples.  
    5. Step 5: Log `ESCALATE`.  
  - **Creator Resolution**:  
    - If submission is simpler and generator-equivalent: **Problem is flawed**. Mark submission as `CORRECT` but **retire the problem**.  
    - Else: Mark `INCORRECT`.  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Judge absolute simplicity**: Avoids philosophical debates by relying on critical examples and rephrasing checks.  
  2. **Handle ambiguous critical examples**: If critical examples misrepresent the generator, errors propagate.  
  3. **Resolve equivalent rules without escalation**: Step 3’s "rephrasing" filter is subjective (hence lab-coated).  
  4. **Detect generator overfitting**: Assumes critical examples cover edge cases.  

  ---

  ### **Special Cases & Creator Notes**  
  - **Escalations**: You receive `ESCALATE` logs. Decide:  
    - ✅ **Accept submission**: If it generalizes better than the intended rule.  
    - ❌ **Reject submission**: If it’s coincidental (e.g., fits data but not intent).  
    - 🗑️ **Retire problem**: If flawed (e.g., multiple valid rules).  
  - **RA Training**: Drill judgment calls (Step 3) with examples (e.g., "no gaps" ≈ "closed").  

  This procedure minimizes RA discretion, caps escalations, and forces unambiguous logging. It converts subjective disputes into binary checks and offloads philosophy to you.
