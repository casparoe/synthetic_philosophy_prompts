answer: |-
  **Contractualism’s aggregation asymmetry – the permissibility of summing burdens within a single life but not across distinct persons – represents a fundamental yet underexplored vulnerability in its framework, demanding scrutiny into whether this distinction can withstand challenges posed by the metaphysical flexibility of "subjects," a critical investigation this grant enables.**  

  **Background and Core Question:**  
  T.M. Scanlon’s contractualism defines wrongness via principles no one could reasonably reject. A central commitment, highlighted in debates like Taurek’s "numbers problem" and refined by critics like John Broome and defenders like Rahul Kumar, is its prohibition on aggregating *small individual complaints across many people* to outweigh a *large complaint for one person*. This is presented as a defining feature contrasting with consequentialism. However, contractualism demonstrably *requires* aggregating burdens *within* a single subject’s life: assessing the cost of a principle to an individual necessitates summing its impacts across different times, interests, and experiences to determine their overall complaint strength. This creates a stark *asymmetry*: aggregation is mandatory intra-personally but forbidden inter-personally.  

  This project asks: **Can contractualism provide a coherent, non-arbitrary justification for permitting aggregation *within* subjects while prohibiting it *across* subjects, given that the metaphysical boundaries of "subjects" can be varied without altering the qualitative nature or magnitude of the burdens involved?** This "slicing problem" questions whether the asymmetry rests on a defensible foundation or merely reflects an unchallenged background assumption about subject individuation. Existing contractualist positions (Scanlon’s own, Kumar’s moderate aggregation, Norcross’s challenges) primarily debate *whether* and *how much* interpersonal aggregation might be permitted *given fixed subjects*, leaving the prior question of *why subject-boundaries dictate aggregative permissions* largely unaddressed.  

  **Methodology:**  
  The core method involves constructing carefully **matched pairs of cases** that are structurally identical in terms of the *types, magnitudes, and total sum of burdens*, differing *only* in how those burdens are distributed across entities defined as "subjects." By holding the burdens constant and manipulating only the subject-boundaries, we isolate the ethical significance (or lack thereof) of those boundaries for aggregation.  

  1.  **Concentrated vs. Distributed Burdens:** Compare Case A (one subject suffers many small burdens) with Case B (many distinct subjects each suffer one identical small burden), assessing whether the single subject's aggregated complaint in A is treated as stronger than any individual complaint in B, and crucially, whether the *sum* of complaints in B is recognized as outweighing a medium-sized burden in a third party, unlike the aggregated complaint in A. The asymmetry predicts different answers; the challenge is to justify this difference solely based on subject-boundaries.
  2.  **Varying Burden Strength:** Crucially, extend Case B so the small burdens borne by different subjects are *non-identical* in strength (e.g., minor inconveniences of slightly varying severity). This blocks simple appeals to the "indistinguishability" of complaints or tie-breaking rules, forcing the justification to rely directly on the *subject* bearing the complaint, not just the complaint's properties.
  3.  **Entity Redescription:** Compare Case C (many distinct human persons suffer one small burden each) with Case D (a single, long-lived entity – e.g., a person with a very long life, or a temporally extended collective like a corporation or state – suffers all the same small burdens distributed across its existence or components). Does contractualism treat D like A (intra-subject aggregation permitted) or like C (inter-subject aggregation forbidden)? If D is treated like A, it suggests the asymmetry hinges metaphysically on subject identity; if treated like C, it undermines the intuitive permissibility of intra-personal aggregation itself.

  **Rationale for Methodology:**  
  This case-based method is superior to alternatives:  
  *   *Pure conceptual analysis* risks circularity or neglects concrete intuitions. Cases ground the abstract problem.  
  *   *Surveying existing literature* alone cannot resolve the gap; the slicing problem requires new thought experiments.  
  *   *Focusing solely on numbers* misses the deeper metaphysical issue of subject individuation.  
  Matched pairs directly test the necessity of subject-boundaries by varying them while holding burden profiles constant, providing the clearest lens to evaluate whether contractualism’s asymmetry is defensible or ad hoc.  

  **Potential Conclusions and Deciding Factors:**  
  1.  **Asymmetry Defended:** Contractualism possesses resources (e.g., a specific conception of "reasonable rejection" tied fundamentally to distinct points of view) to justify privileging subject-boundaries. Success requires articulating this defense clearly and showing it withstands the case variations, especially non-identical burdens and entity redescription.  
  2.  **Asymmetry Indefensible:** No non-arbitrary justification exists. Subject-boundaries lack the requisite moral significance to dictate aggregative permissions. This would force a major revision of contractualism, potentially requiring abandoning the asymmetry (permitting some interpersonal aggregation) or rejecting intra-personal aggregation (an extremely counterintuitive move).  
  3.  **Subject-Relativity Confirmed but Problematic:** The asymmetry is fundamental but leads to deeply counterintuitive results in the redescribed cases (e.g., the state/corporation case), revealing a significant cost of the view.  
  **Deciding factors** will be the intuitive plausibility and consistency of the principles derived to explain the asymmetry when applied rigorously to all case variations, particularly the non-identical burdens and entity redescription challenges. Does the justification hold, or does it produce judgments that seem arbitrary or morally untenable?  

  **Deliverables:**  
  The primary output will be a **6,000-7,000 word research paper** presenting the slicing problem, the case-based argument, analysis of potential contractualist responses, and a reasoned conclusion. This will be supplemented by:  
  1.  A **one-page non-specialist summary** explaining the core problem and findings in accessible language.  
  2.  A **conceptual table** categorizing types of aggregation (e.g., intra-personal identical burdens, intra-personal non-identical, inter-personal identical, inter-personal non-identical, collective entity intra-"subject") and indicating whether contractualism, based on the analysis, can consistently permit or prohibit each.  

  **Scope, Risks, and Failure Conditions:**  
  *   **Scope Risks:** The metaphysical questions about personal identity and collective agency are deep. This project cannot resolve them but must engage sufficiently to show their relevance. The risk is getting bogged down in metaphysics. Mitigation: Focus on the *ethical implications* of different ways of drawing boundaries within contractualism, not resolving the metaphysics itself.  
  *   **Time Constraints:** Designing robust cases and engaging deeply with sophisticated contractualist responses is ambitious for one semester alongside coursework. Mitigation: Prioritize core case pairs and focus on key representative responses (Scanlon, Kumar, perhaps a critic like Norcross).  
  *   **Failure Conditions:**  
      *   **The asymmetry proves readily defensible:** While showing this would be a valid result, it might feel less novel. Value lies in rigorously establishing it against a potent challenge.  
      *   **The cases prove inconclusive:** If intuitions are murky or responses too varied, a clear conclusion might be elusive. Value lies in mapping the terrain and clarifying the challenge.  
      *   **Metaphysical complexity overwhelms:** The analysis might become too abstract or stray from core contractualist mechanics. Mitigation: Constant grounding in the contractualist framework of reasonable rejection.  
  *   **High School Feasibility:** The topic is advanced but suitable for a motivated student. The primary challenge is independent time management and engaging with complex texts. The structured method (case construction and analysis) provides a clear pathway. Genuine failure would only occur if the core question and method aren't pursued; any rigorous engagement yielding analysis of the cases and responses constitutes success.
