  - *Characteristic mistake*: Incorrect payoff expressions or inequality errors.  

  **(iii) Iterated deletion and order (7 marks)**  
  - **4 marks** for steps (1 mark per correct deletion with reason and surviving profiles).  
  - **1 mark** for unique profile (A, L).  
  - **2 marks** for order explanation (order-independent due to forced initial mixed deletion).  
