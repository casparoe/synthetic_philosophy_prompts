  **(iv) Objection response (3 marks)**  
  - **3 marks** for explaining that mixtures show C is never a best response (no randomisation needed).  
  - *First-class distinction*: Explicit link to rationality and beliefs (epistemic reading).  
  - *Upper-second limit*: Correct but misses "never a best response" point.  
  - *Characteristic mistake*: Confusing dominance with equilibrium randomisation.  

  **(v) Ordinal invariance and counterexample (3 marks)**  
