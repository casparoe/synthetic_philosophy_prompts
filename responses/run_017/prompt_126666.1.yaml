answer: |-
  ### Question

  Consider the following two-player game. Rowena chooses a row (A, B, or C) and Colin chooses a column (L, M, or R). Payoffs are given as (Rowena's payoff, Colin's payoff), with both being von Neumann–Morgenstern utilities.

  ```
         L       M       R
  A   (4, 6)  (0, 4)  (3, 2)
  B   (0, 2)  (4, 1)  (1, 3)
  C   (1.5,1) (1.5,5) (1.8,5)
  ```

  (i) Show that no strategy of either player is strictly dominated by a pure strategy at the outset. Conclude that no strategy is weakly dominated by a pure strategy. (4 marks)  
  (ii) Identify the single strategy that is strictly dominated by a mixed strategy (but not by any pure strategy). Verify the domination by specifying a mixed strategy that dominates it and determining the exact interval of mixing weights for which this holds. (8 marks)  
  (iii) Perform iterated deletion of strictly dominated strategies, starting from the deletion in part (ii). At each step, state the surviving strategy profiles and the reason for deletion. State the unique profile that survives. Explain briefly whether the order of deletion could affect the outcome and why. (7 marks)  
  (iv) An objection states: "Rowena is a single agent who will perform one action. She cannot improve her position by tossing a coin, so deleting an option because a mixture of others beats it is illegitimate." Respond to this objection in 2–3 sentences, addressing the role of mixed strategies in dominance. (3 marks)  
  (v) Suppose we know only Rowena's *ordinal* ranking of the nine outcomes (i.e., her preference order over the payoff pairs) and Colin's *cardinal* payoffs. Is the mixed deletion from part (ii) still necessarily justified? If not, provide an explicit ordinally equivalent payoff table for Rowena (with Colin's payoffs unchanged) where this deletion does not occur. (3 marks)  

  ---

  ### Model Answer

  **(i)**  
  For Rowena:  
  - **A vs B**: Against L, A (4) > B (0); against M, A (0) < B (4); against R, A (3) > B (1). No strict or weak dominance.  
  - **A vs C**: Against L, A (4) > C (1.5); against M, A (0) < C (1.5); against R, A (3) > C (1.8). No dominance.  
  - **B vs C**: Against L, B (0) < C (1.5); against M, B (4) > C (1.5); against R, B (1) < C (1.8). No dominance.  

  For Colin:  
  - **L vs M**: Against A, L (6) > M (4); against B, L (2) > M (1); against C, L (1) < M (5). No dominance.  
  - **L vs R**: Against A, L (6) > R (2); against B, L (2) < R (3); against C, L (1) < R (5). No dominance.  
  - **M vs R**: Against A, M (4) > R (2); against B, M (1) < R (3); against C, M (5) = R (5). No strict or weak dominance.  

  Thus, no strategy is strictly or weakly dominated by any pure strategy.  

  **(ii)**  
  Rowena's strategy C is strictly dominated by a mixed strategy of A and B, but not by any pure strategy. Let the mixed strategy be A with probability \(p\) and B with probability \(1-p\). The expected payoffs against Colin's actions are:  
  - Against L: \(4p + 0(1-p) = 4p\)  
  - Against M: \(0p + 4(1-p) = 4(1-p)\)  
  - Against R: \(3p + 1(1-p) = 2p + 1\)  

  C yields 1.5, 1.5, 1.8 against L, M, R respectively. Domination requires:  
  1. \(4p > 1.5\) → \(p > 0.375\)  
  2. \(4(1-p) > 1.5\) → \(1-p > 0.375\) → \(p < 0.625\)  
  3. \(2p + 1 > 1.8\) → \(2p > 0.8\) → \(p > 0.4\)  

  Combining: \(0.4 < p < 0.625\). Thus, for \(p \in (0.4, 0.625)\), the mixed strategy strictly dominates C. The interval is proper and non-degenerate.  

  **(iii)**  
  - **Step 1**: Delete C (strictly dominated by mixed strategy of A and B). Surviving: Rowena {A, B}, Colin {L, M, R}.  
  - **Step 2**: In the reduced game, Colin's M is strictly dominated by L: against A (4 > 4? No; wait: Colin's payoffs: against A, L gives 6 > M gives 4; against B, L gives 2 > M gives 1). Delete M. Surviving: Rowena {A, B}, Colin {L, R}.  
  - **Step 3**: Rowena's B is strictly dominated by A: against L (4 > 0), against R (3 > 1). Delete B. Surviving: Rowena {A}, Colin {L, R}.  
  - **Step 4**: Colin's R is strictly dominated by L: against A (6 > 2). Delete R. Surviving: (A, L).  

  The unique surviving profile is (A, L).  

  The order of deletion could not affect the outcome. The initial deletion of C (by mixed dominance) is necessary as no pure deletion is possible. Subsequent deletions use pure dominators, and iterated strict dominance is order-independent.  

  **(iv)**  
  The objection confuses actual randomisation with epistemic justification. The mixed strategy demonstrates that C is never a best response to any belief about Colin's play; thus, a rational Rowena (maximising expected payoff) will never choose C. This requires no assumption she randomises, only that she has beliefs and is rational.  

  **(v)**  
  No, the deletion is not necessarily licensed. Ordinal transformations can alter cardinal comparisons. An ordinally equivalent payoff table for Rowena is:  
  ```
         L    M    R
  A     10    0    8
  B      0   10    1
  C      3    3    4
  ```  
  *Verification*: Rowena's ordinal ranking is preserved (A,L:10 ≈ original 4; B,M:10 ≈ original 4; A,R:8 ≈ original 3; C,R:4 ≈ original 1.8; C,L and C,M:3 ≈ original 1.5; B,R:1 ≈ original 1; A,M and B,L:0 ≈ original 0). For domination by mixed strategy \(p\):  
  - Against L: \(10p > 3\) → \(p > 0.3\)  
  - Against M: \(10(1-p) > 3\) → \(p < 0.7\)  
  - Against R: \(8p + 1(1-p) = 7p + 1 > 4\) → \(7p > 3\) → \(p > 3/7 ≈ 0.4286\)  
  For \(p \in (0.4286, 0.7)\), the first two hold, but \(p > 0.4286\) and \(p < 0.7\) is non-empty (e.g., \(p = 0.5\) works). Thus, domination still occurs in this table.  

  *Correct counterexample*:  
  ```
         L    M    R
  A     100   50   90  
  B      50  100   60  
  C      70   70   80  
  ```  
  *Verification*: Order preserved (A,L:100 ≈4; B,M:100≈4; A,R:90≈3; C,R:80≈1.8; C,L,C,M:70≈1.5; B,R:60≈1; A,M,B,L:50≈0). Check domination:  
  - Against L: \(100p + 50(1-p) = 50 + 50p > 70\) → \(p > 0.4\)  
  - Against M: \(50p + 100(1-p) = 100 - 50p > 70\) → \(p < 0.6\)  
  - Against R: \(90p + 60(1-p) = 60 + 30p > 80\) → \(30p > 20\) → \(p > 2/3 ≈ 0.666\)  
  No \(p\) satisfies \(p > 0.666\) and \(p < 0.6\). Thus, no mixed strategy dominates C.  

  *(Note: This transformed game also has multiple Nash equilibria, e.g., (A,L) and mixed equilibria where Rowena plays C and Colin mixes between M and R, showing uniqueness is not preserved.)*  

