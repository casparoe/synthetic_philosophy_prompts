answer: |-
  ### Scenario: Sparkfin Minnow Electrical Organ
  The Sparkfin minnow (*Ignisculus fluviatilis*) inhabits predator-rich rivers where its electric organ (T) evolved to emit high-voltage pulses (F) stunning predatory catfish. A genetically isolated population was trapped in a deep, predator-free caldera lake 500 generations ago. Here, T no longer produces high-voltage pulses. Instead, due to mineral-rich water enhancing conductivity, T emits patterned low-voltage signals (G) coordinating synchronized spawning in murky conditions. This G is robust: experimental silencing disrupts mating. T is fixed (no heritable variation), can malfunction (e.g., developmental defects cause erratic/no signals), and retains the anatomical structure for high-voltage discharge, though the neural pathway now only triggers low-voltage patterns.

  ---

  ### Accounts & Verdicts
  - **Selected-effect (SE) account (Millikan 1984)**: Function is what T was *historically selected for*.  
    *Verdict: F (stunning predators)*. Reasoning: T's structure and fixation resulted from past selection for predator stunning. G is a current *useful effect* but lacks selection history; it emerged post-isolation without differential reproduction favoring it.  

  - **Causal-role (CR) account (Cummins 1975)**: Function is T’s *current systemic contribution*, relativized to the organism’s capacity for reproduction.  
    *Verdict: G (coordinating spawning)*. Reasoning: In the minnow’s current physiology and environment, T’s indispensable role in enabling reproductive success (via spawning synchronization) makes G its function. The system-capacity pair (organism/reproduction) is natural as reproduction is the central biological capacity.  

  ---

  ### Key Feature & Its Removal
  **The critical feature**: T is fixed in a *novel environment* where its historical selective pressure vanished, and its new contribution G *has not been under selection* (due to fixation and rapid environmental shift).  

  - **If heritable variation is restored**: SE theorists might argue G could *become* a function if selected for. CR verdict remains G.  
  - **If environment stable for 500+ generations**: SE might argue G is now a function via "derived selection" if variation existed earlier (but here it didn’t). CR unchanged.  
  - **If relativized differently** (e.g., system=locomotion, capacity=escape): CR might assign no function, but reproduction is the salient capacity.  

  ---

  ### Strongest Replies & Resistance  
  **SE defender’s rebuttal**:  
  1. *"G is a derived function"*: But T was fixed *before* G emerged; no selection operated on G. **Resists**.  
  2. *"CR confuses function with mere contribution"*: Grants CR identifies a role but insists "proper function" requires history. **Case allows this—but shows divergence in what counts as "function."**  
  3. *"Differential retention"* (e.g., Griffiths): If G prevented T’s degeneration, it could be a function. But T persists due to developmental constraint, not G’s maintenance. **Resists**.  

  **CR defender’s rebuttal**:  
  *"SE verdict is empty; G is the relevant function now."* But SE can note F explains T’s presence. **Case highlights that CR prioritizes current utility over etiology.**  

  ---

  ### Conclusion  
  **This case shows extensional divergence**: The accounts assign different functions (F vs. G) to the *same trait* under identical empirical descriptions, proving they can conflict in real biological systems. Fundamentally, they answer different questions: SE asks "Why is T here?", CR asks "What does T do *now*?"
