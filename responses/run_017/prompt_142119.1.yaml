  ### Materials and Prep List
  1. **Pairing Cards**: 12 cards labeled A, 12 labeled B, ..., up to 12 labeled L (one pair per letter; 24 cards total).  
  2. **Draw Bag**: To randomly distribute pairing cards.  
  3. **Choice Slips**: 24 slips per round (4 rounds × 24 slips = 96 slips).  
  4. **Pens/Pencils**: 24.  
  5. **Envelopes for Round 3**: 12 sealed envelopes (5 labeled "MIRROR", 7 labeled "OPEN"). Assign each pair’s letter to an envelope in advance (5 mirror pairs, 7 open pairs).  
  6. **Dice**: One six-sided die for public roll in Round 4; 24 small dice + cups for private randomization in Round 3 (or use coins if dice unavailable).  
  7. **Payoff Matrix Poster**: Display throughout:  
     - (C, C): 3 points each  
     - (C, D): 0 (you) / 5 (partner)  
     - (D, C): 5 (you) / 0 (partner)  
     - (D, D): 1 point each  
  8. **Blackboard Setup**: Columns for tallying choices (C/D) after Rounds 1, 2, 4; and for Round 3 open-pair outcomes (CC/CD/DD).  
  9. **Coda Cards**: 8 cards with modified temptation payoff (7 instead of 5; unilateral defect pays 7).  
  10. **Timer**: To keep rounds on schedule.  

  ---

  ### Minute-by-Minute Timeline (75 min total)  
  - **0:00–0:05** (5 min): **Intro**  
    Distribute pairing cards via bag. Assign seats randomly. Display payoff matrix. Read:  
    *"You are anonymously paired by letter. Each round, write C or D on a slip. Points convert to raffle tickets for a prize. No talking during rounds."*  

  - **Round 1: Anonymous Round** (0:05–0:10, 5 min)  
    Read: *"Your payoff depends on your choice and your partner’s actual choice. Write C or D. Hand in your slip."*  
    **Tally**: Post total C and D counts on board.  

  - **Round 2: Mirror Round** (0:10–0:15, 5 min)  
    Read: *"This round, your payoff is based solely on your own choice. If you choose C, you get 3 points. If you choose D, you get 1 point."*  
    **Tally**: Post total C and D counts.  

  - **Round 3: Mirror/Open Round** (0:15–0:30, 15 min)  
    Read: *"You are in either MIRROR or OPEN condition. 10 students are MIRROR; 14 are OPEN. Open your envelope to see your condition. If MIRROR, your own choice sets both players’ choices. If OPEN, payoffs use both slips. You may roll a private die under your cup to randomize."*  
    Distribute envelopes. Students open, choose, hand in slips.  
    **Tally**:  
    1. For **open pairs only** (7 pairs), ask one student per pair to call out their pair outcome: CC, CD, or DD.  
    2. On board:  
       - CC pairs: `n_CC = [count]`  
       - CD pairs: `n_CD = [count]`  
       - DD pairs: `n_DD = [count]`  
    3. Compute:  
       - Cooperators: `N_C = 2*n_CC + n_CD`  
       - Defectors: `N_D = 2*n_DD + n_CD`  
       - α̂ = `(2*n_CC) / N_C` (if `N_C > 0`)  
       - β̂ = `n_CD / N_D` (if `N_D > 0`)  
       - ĝ = α̂ – β̂  
    **If ĝ ≈ 0/negative/large**:  
    - *"In open pairs, choices moved together very little/negatively/strongly."*  
    - *"This gap ĝ measures how much your choice predicted your partner’s."*  

  - **Round 4: Public-Die Round** (0:30–0:35, 5 min)  
    Read: *"Everyone is OPEN again. I will roll a public die. You may condition your choice on the outcome. After the roll, write C or D and hand in your slip."*  
    Roll die, students choose, collect slips.  
    **Tally**: Post total C and D counts.  

  - **Debrief** (0:35–1:05, 30 min):  
    - **Round 1 recap** (2 min): *"Defection was dominant: no matter what your partner did, D gave higher payoff."*  
    - **Round 2 recap** (3 min): *"You chose C: 3 > 1. Here, your choice set the outcome. This doesn’t distinguish causal/evidential theories—it was fixed by design."*  
    - **α, β, g definitions** (5 min):  
      *"Let α = P(partner C | you C), β = P(partner C | you D), g = α – β.  
      E[C] = 3α + 0(1–α) = 3α.  
      E[D] = 5β + 1(1–β) = 1 + 4β.  
      C better if 3α > 1 + 4β → g > (1 + β)/3."*  
    - **Round 3 analysis** (10 min):  
      - *"Overall g combines mirror (p = 5/12) and open (ĝ). In mirror, α=1, β=0, g=1.  
      So g_overall = (5/12)*1 + (7/12)*ĝ."*  
      - *"With p=2/5, symmetric equilibrium is mixed: cooperate with prob 1/3."*  
        Derive:  
        *"Assume all cooperate w/prob q.  
        E[C] = p*3 + (1–p)(3q)  
        E[D] = p*1 + (1–p)(1 + 4q)  
        Set equal: 3p + 3(1–p)q = p + (1–p) + 4(1–p)q  
        → q = (3p–1)/(1–p) = 1/3 for p=2/5."*  
      - *"Cooperation pays for all β iff p ≥ 5/7."*  
        *"Worst case: α=0, β=1. Then 3α > 1+4β? 0 > 5? No. Solve 3p > 1+4(1–p) → 7p > 5."*  
    - **Round 4 & superrationality** (5 min):  
      *"Public die made choices co-move perfectly (g=1). If you C, partner always C (α=1); if D, partner D (β=0). Then g > (1+β)/3 holds (1 > 1/3), so C is optimal. This is superrationality: identical agents converge to the same choice via symmetric reasoning. But note: we enforced co-movement with the die—we didn’t test if reasoning alone causes convergence."*  
    - **Name the argument** (5 min): *"Today’s ‘surprise’ is superrationality: cooperating in a dilemma because your choice and your similar partner’s are linked by shared reasoning, not causality. The gap g must exceed (1+β)/3—and in Round 3, p=2/5 wasn’t enough for pure cooperation."*  

  - **Coda** (1:05–1:11, 6 min):  
    Hand 8 students modified cards (temptation=7). Announce: *"8 of you have a different matrix: defecting against a cooperator gives 7 points. Holders aren’t revealed. What should a superrational pair do if one has standard and one has modified payoffs?"*  
    **Purpose**: Show superrationality requires symmetry.  
    **Expected answers**:  
    - *"Still cooperate: (3,3) > (1,1)."*  
    - *"Defect: the modified player gets more from D."*  
    - *"No clear answer—superrationality breaks without symmetry."*  
    **Cut?** Yes if time is tight; else keep to highlight symmetry’s role.  

  ---

  ### Predictable Problems & Handling  
  1. **Problem**: Students cooperate in Round 1 out of "niceness."  
     **Handling**: Emphasize pre-game: *"This tests rational choice, not morality. Defection dominates."*  

  2. **Problem**: Students distrust Round 2 ("trick!"), defect "to test."  
     **Handling**: Clarify: *"No tricks. In mirror, your choice alone sets your payoff."*  

  3. **Problem**: Signaling (e.g., sighing, eye contact).  
     **Handling**: Enforce silence; discard slips if detected.  

  4. **Problem**: Debrief arithmetic loses students.  
     **Handling**: Use concrete numbers from class data. Pre-write derivation steps.  

  5. **Problem**: Round 3 open-pair tally ĝ near zero/negative.  
     **Handling**: Normalize: *"Real co-movement is noisy. Superrationality requires high g, which we didn’t see here."*  

  ---

  ### What the Activity Cannot Reproduce  
  - **Claim**: *"Independent agents running identical reasoning converge."*  
    **Why not**: Convergence is enforced via mirror envelopes/public die. Students don’t experience reasoning-based convergence.  

  ---

  \answer{mirror round: C; anonymous round: D; cooperate iff g > (1+beta)/3; p = 2/5 symmetric fixed point: cooperate with probability 1/3; cooperation pays at every base rate iff p >= 5/7; public-die round: C}
