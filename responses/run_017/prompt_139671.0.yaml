prompt: |-
  I teach an upper-level undergraduate seminar titled Chance, Law and Prediction: 18 students, mixed majors (philosophy, physics, economics, one or two from engineering), one 80-minute session, a projector and a whiteboard, no laptops, and no budget beyond printed sheets and index cards. Half the class has no mathematics past high-school algebra, and I would like the activity to work for them too.

  I want a single session's activity that makes students feel, rather than being told, the gap between saying that a system runs according to deterministic laws and saying that anyone can predict what it will do next — and I want them to run into the gap through their own choices and their own losses, not by watching a simulation on my screen.

  Here is what I want them to end up having seen for themselves:

  1. A system can be fully law-governed and still defeat any forecaster whose knowledge of the present is stated to finitely many digits.
  2. The loss of foresight is a tradeoff rather than a cliff: each additional step of forecast lead time costs a fixed multiplicative factor of precision in the starting value, so no attainable measurement buys unlimited foresight — while better instrumentation is not worthless either, it merely buys lead time at a terrible exchange rate.
  3. Possessing the true rule is not the same as possessing the prediction. I want one student, playing an ideally-informed predictor who is handed the exact updating rule and the starting value to six decimal places plus a calculator, to fail anyway, in front of everyone.
  4. There is a further question that a finite-precision stretch of data cannot settle: whether the irregular series they are looking at came from a deterministic rule at all. I would like a phase in which two black boxes emit series that look statistically alike — one generated by a deterministic rule, one by coins, dice, or a random-number app — and the students stake points on which is which.

  Please design the activity accordingly. I need: the rules; the materials (what I print in advance); a wagering or scoring scheme that requires no real money, is keepable on index cards, and punishes overconfident bidding — something in the spirit of a scoring rule that charges you for the confidence you did not earn; a minute-by-minute timeline; and the reveal, meaning the moment the two-line rule that generated all the data goes on the board next to a table showing two runs from starting values that differ only in the eighth decimal place.

  Then the debrief. Map specific moments in the activity onto each of the four points above, and say what will predictably go wrong the first time I run it. My worries include: that students will conclude the system simply is random; that they will think a faster computer or more data would fix everything; that they will discount the whole thing because the data came from my laptop; that the ideally-informed student's failure will be read as personal carelessness rather than as the point; and that someone will announce that determinism is therefore unfalsifiable, which I do not want to endorse either. Give me a response to each.

  Finally, be frank about what the activity cannot deliver. My sense is that at least three things have to be supplied by me in so many words: that the unpredictability on display is an artifact of the precision and tolerance I chose rather than a discovery about the world; that the black-box phase illustrates underdetermination at a fixed resolution and does not show that deterministic structure is undetectable in principle, since there are techniques for finding structure in longer and cleaner series, and I want a prepared answer for a sharp student who raises this; and that nothing done in the room bears on whether the actual world is deterministic or on what any of it implies for free will. Tell me which moves I must make by lecture, and where.

  No lecture up front, and the word for sensitive dependence should not be spoken until the debrief. Close with a short written exit ticket I can use to check which of the four points actually landed.
reasoning: |-
  We are going to design an activity that uses a simple deterministic system with sensitive dependence on initial conditions. The logistic map is a classic example that is easy to compute and exhibits chaotic behavior. The rule is:

      x_{n+1} = r * x_n * (1 - x_n)

  We choose r = 4 so that the system is chaotic and the values stay in [0,1]. The system is deterministic but has sensitive dependence on initial conditions.

  We'll break the activity into phases:

  Phase 1: Prediction Challenge (Points 1, 2, and 3)
  Phase 2: Black Box Challenge (Point 4)

  Materials to prepare:

  1. Printed sheets for each student with:
     - The rules of the game (for the prediction phase and the black box phase).
     - A table of 10 starting values (each to 6 decimal places) for the prediction challenge, and a blank for their predictions for the next 1, 2, 3, 4, and 5 steps.
     - A scoring table for the prediction phase (explained below).

  2. Index cards for each student to record their predictions and wagers.

  3. Two "black boxes" (which are just two sequences of 20 numbers each, one generated by the logistic map with r=4 and a fixed starting value, and the other by a random number generator). These will be printed on a sheet or projected.

  4. A calculator for the ideally-informed predictor (one student).

  5. A whiteboard to record the starting values, the predictions, and the actual outcomes.

  Phase 1: Prediction Challenge (60 minutes)

  - Explain that the students will be forecasters for a simple system. The system is defined by a rule that updates a number between 0 and 1. The rule is deterministic and known to them: 

        next_value = 4 * current_value * (1 - current_value)

  - Tell them that they will be given the starting value (to 6 decimal places) and they must predict the value at the next step (to 6 decimal places) and then use that prediction to predict the step after, and so on. They will do this for 5 steps.

  - Divide the students into pairs. Each pair gets one starting value (from a set of 10 starting values that you have precomputed). They are to compute the next 5 values using the rule. They must write down each prediction to 6 decimal places (rounding as needed). They are allowed to use calculators (or even do it by hand, but it will be tedious).

  - Meanwhile, choose one student to be the "ideal predictor". Give them the same rule and a starting value (to 6 decimal places) and a calculator. They are to compute the next 5 steps to 6 decimal places.

  - While the pairs are working, you (the instructor) will compute the "true" values for each starting value for 5 steps, but using the starting value to 15 decimal places (so that rounding errors don't accumulate too quickly). You have precomputed these at home.

  - After 15 minutes, collect the predictions for each step from each group. Also, collect the ideal predictor's predictions.

  - Now, reveal the true values step by step (for each starting value, for each step). For each prediction, the group (or the ideal predictor) gets a point if their prediction is within 0.001 (i.e., 0.001 is the tolerance). But note: the prediction must be for the exact step.

  - Scoring for each step: 
     - If a group predicted the value at step k and it is within 0.001 of the true value, they get 1 point for that step.
     - If not, they get 0.

    However, they must have predicted the step k using the chain of predictions (so if they made an error at step 1, then step 2 is computed from their step1, which is wrong, so step2 is likely wrong too).

  - The ideal predictor does the same: they get 1 point per step if their computed value (using 6 decimal places) is within 0.001 of the true value (computed with 15 decimal places).

  - Now, the twist: you also allow the groups to wager on their predictions. For each step, before they make the prediction, they must wager a certain number of points (from a starting pool of 10 points) on that step. They can wager 0 to 5 points on step 1, then 0 to 5 on step 2, etc. (with the constraint that they cannot wager more than they have). The catch: if they are correct, they gain the wagered points, but if they are wrong, they lose the wagered points. This scoring rule encourages them to be confident only when they are sure.

  - The ideal predictor also must wager (from their own pool of 10 points) on each step.

  - After the true values are revealed, each group and the ideal predictor tally their points.

  - What will happen: 
    - For step 1, most groups (and the ideal predictor) will be correct because the starting value is known exactly (to 6 decimals) and the rule is applied once. The true value is computed with high precision, but 6 decimals might be enough for step1? Actually, with r=4, let's check:

        x1 = 4*x0*(1-x0)

      If x0 is given to 6 decimals, then the error in x0 is at most 0.0000005. The derivative of the map at x0 is 4*(1-2*x0). The maximum absolute value of the derivative in [0,1] is 4 (at the endpoints). So the error in x1 is at most 4 * 0.0000005 = 0.000002, which is 0.000002, so when rounded to 6 decimals, it might be the same. But to be safe, we choose starting values that are not too close to 0.5 (where the derivative is 0) and not at the endpoints. Actually, the derivative is 0 at x=0.5 and 4 at the endpoints. We want to show that even step1 might be off? Maybe not. So to make step1 almost always correct, we choose starting values that are not too near the endpoints. We can precompute: pick starting values that after one step are not too sensitive. But we want the error to build up. Alternatively, we can note that the rounding to 6 decimals at each step will cause the error to accumulate.

    - However, the problem for the ideal predictor is that they are rounding at every step to 6 decimals. So after a few steps, the rounding error will accumulate and their prediction will diverge. We can precompute an example starting value that after 5 steps (with rounding at each step) gives a value that is more than 0.001 away from the true value (computed without rounding). We need to choose such a starting value for the ideal predictor.

    - For the groups, they are doing the same rounding, so they will also accumulate errors.

  - We will have 10 starting values. We choose them so that:
     - Some are stable for a few steps (so that the predictions are good for a couple of steps) and then diverge.
     - Some are very sensitive and diverge quickly.

  - The ideal predictor will be given one of the starting values that we know will lead to a prediction at step5 that is off by more than 0.001.

  - After the scoring, the students will see that even the ideal predictor fails at some step (probably step 4 or 5). The groups will also see that their predictions become worse as the step increases.

  - This shows point 1 and 2: the system is deterministic but the finite precision (6 decimals) leads to failure after a few steps. The lead time is limited by the precision.

  Phase 2: Black Box Challenge (15 minutes)

  - Now present two sequences of 20 numbers (each between 0 and 1, to 6 decimal places). One is generated by the logistic map (with r=4) from a starting value (known only to you) and the other by a random number generator (uniform in [0,1]). 

  - Tell the students that one sequence is generated by a deterministic rule (the same kind as before) and the other by a random process. They have to decide which is which.

  - Each student (or pair) gets to examine the two sequences and then wager (from their remaining points, or we give them 10 new points for this phase) on which is the deterministic one. They can also choose to not wager.

  - The wagering: they assign a probability (in percentage) to sequence A being deterministic and sequence B being random. Then they must state their belief. Then they are scored using a proper scoring rule, such as the Brier score. But to keep it simple, we can do:

        If they choose the correct one, they gain the amount they wagered (if they wagered 5 points, they get 5 points). If they are wrong, they lose the wagered points.

      But we want to punish overconfidence. So we can use a quadratic scoring rule:

        Let p be the probability they assign to the correct answer. Then their score is: 10 * (1 - (1-p)^2) if they are correct, and 10 * (1 - p^2) if they are wrong.

      But that might be too abstract. Alternatively, we can have them choose a confidence level: low, medium, high. And assign point gains/losses accordingly:

        Low confidence: if correct, gain 1 point; if wrong, lose 1 point.
        Medium: if correct, gain 3; if wrong, lose 3.
        High: if correct, gain 5; if wrong, lose 5.

      And they can also choose to not bet (then 0 change). This is simpler.

  - After they place their bets, reveal which is which.

  - The point: the deterministic sequence may look as random as the random one. So they cannot tell. This shows that with finite data and finite precision, one cannot be sure whether the sequence is deterministic or random.

  The Reveal (5 minutes)

  - Write the rule on the board: next_value = 4 * current_value * (1 - current_value)

  - Then show two runs from starting values that differ only in the 8th decimal place (for example, 0.12345670 and 0.12345671). Show the values for 10 steps. They will see that the two sequences are identical for the first few steps and then diverge.

  Debrief (15 minutes)

  Map to the points:

  1. The system is deterministic (we used a fixed rule) but the finite precision (6 decimals) led to prediction failures after a few steps. The students experienced this by having correct predictions for the first 1-2 steps and then failing.

  2. The tradeoff: each additional step required more precision. We can show by example: to predict 5 steps, we needed more than 6 decimals. How much? We can compute the Lyapunov exponent for the logistic map (which is ln(2) for r=4). The maximum error growth is exponential. So to predict for n steps, we need the initial error to be less than about (0.001) * (1/2)^n. So for n=5, we need initial error less than about 0.001 / 32 = 0.00003125, which is about 5 decimal places? But we had 6 decimals (which gives 0.000001) and that was not enough for 5 steps? Actually, we had rounding at each step. We can explain that the required precision doubles with each step.

  3. The ideal predictor had the rule and the starting value to 6 decimals and a calculator, but because of rounding at each step, the prediction failed. This was not carelessness but inherent in the finite precision.

  4. The black box challenge: two series, one deterministic and one random, and they could not tell with 20 data points. This shows that with finite data, one cannot settle the question.

  Potential Misconceptions and Responses:

  - "The system is random": No, we used a fixed rule. The unpredictability comes from the sensitive dependence on initial conditions and the finite precision, not randomness.

  - "A faster computer or more data would fix everything": A faster computer would not help because the problem is the precision of the initial condition. More data (longer sequence) might help in distinguishing deterministic from random in some cases (if the deterministic system has patterns that are detectable in longer runs), but for chaotic systems, the sequence looks random. Also, for prediction, even with more data, if you don't have the exact initial condition, you cannot predict arbitrarily far ahead.

  - "The data came from your laptop": We can run the logistic map by hand for a few steps to show that it's deterministic. Also, we are revealing the rule. The point is not the source but the mathematics of the rule.

  - "The ideal predictor's failure was carelessness": We can show that the rounding at each step is necessary if we only have 6 decimal places. It's a systematic issue.

  - "Determinism is unfalsifiable": We are not saying that. We are saying that with finite precision data, one cannot distinguish a deterministic chaotic system from a random one. But with infinite precision? In practice, we never have infinite precision. And in theory, if we had infinite precision and infinite data, we might be able to detect the deterministic structure. But in the real world, we are limited.

  What the activity cannot deliver:

  - We must explain that the unpredictability is due to the precision we chose (6 decimals) and the tolerance (0.001). If we had higher precision, we could predict further. But the key is the exponential growth of errors.

  - About the black boxes: in principle, with a longer series or a more sophisticated analysis (like looking for hidden patterns, using machine learning, etc.), one might detect the deterministic structure. But for a chaotic system, the sequence will pass many tests for randomness. And in practice, for a given finite resolution, it is underdetermined.

  - The activity does not bear on free will or the determinism of the real world. We are only showing a mathematical example.

  Exit Ticket (5 minutes):

  Give each student an index card with:

  1. In your own words, why did the ideal predictor (with the exact rule and starting value to 6 decimals) fail to predict correctly after a few steps?
  2. How does the required precision for the initial condition change as we try to predict further into the future?
  3. Why was it hard to tell which of the two sequences was generated by a deterministic rule?
  4. Does the unpredictability in this activity mean the system was not governed by laws?

  Timeline:

  - 0-5 min: Introduction and explanation of the prediction challenge (Phase 1).
  - 5-20 min: Students work in pairs to predict 5 steps for their starting value (and wager). The ideal predictor works too.
  - 20-35 min: Collect predictions, reveal true values step by step, and record scores.
  - 35-40 min: Explanation of the black box challenge (Phase 2).
  - 40-50 min: Students examine the two sequences and wager.
  - 50-55 min: Reveal the black boxes and score.
  - 55-60 min: The reveal: the rule and the two close starting values that diverge.
  - 60-75 min: Debrief (address the points and misconceptions).
  - 75-80 min: Exit ticket.

