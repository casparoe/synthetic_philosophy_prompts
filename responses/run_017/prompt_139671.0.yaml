  ### Activity Design: "The Prediction Gap"

  #### **Rules & Materials**
  - **Materials to Print**:
    1. **Prediction Sheets (5 versions)**: Each with a unique starting value (e.g., 0.341592, 0.719283, etc.) to 6 decimal places, and blanks for 6-step predictions (1–6 steps ahead). Include the rule:  
       `Next value = 4 × Current × (1 - Current)`  
    2. **Wagering Cards**: Index cards with 10 starting "points." Students wager 0–3 points per step.  
    3. **Black Box Sheets**: Two sequences of 20 values (0.000000 to 1.000000):  
       - **Sequence A**: Logistic map (`x_{n+1} = 4x_n(1 - x_n)`) from `x₀ = 0.314159`.  
       - **Sequence B**: Uniform random numbers (generated via RNG or dice rolls).  
    4. **Scoring Rules Sheet**:  
       - **Prediction Phase**: Gain/loss = wagered points if prediction within ±0.001 of true value; lose wagered points otherwise.  
       - **Black Box Phase**: Confidence bets (Low: ±1 pt, Medium: ±3 pts, High: ±5 pts) on which sequence is deterministic.  

  #### **Timeline (80 Minutes)**
  1. **Intro (5 min)**:  
     - *"You’ll predict a system’s future. The rule is on your sheet. Start with your given value, calculate the next 6 steps (rounded to 6 decimals). Wager points on each step."*  
     - Assign one student as the "Ideal Predictor" (uses calculator, same rule/starting value as Group 1).  

  2. **Prediction Phase (30 min)**:  
     - **0–15 min**: Groups (3–4 students) compute 6 steps. Ideal Predictor calculates alone.  
     - **15–25 min**: Groups wager. Collect prediction/wager cards.  
     - **25–30 min**: Reveal true values (pre-computed to 15 decimals). Tally points.  

  3. **Black Box Phase (15 min)**:  
     - **30–35 min**: Show Sequences A and B. *"One is deterministic (same rule), one is random. Bet confidence points."*  
     - **35–40 min**: Collect bets. Reveal: A = deterministic, B = random. Adjust points.  

  4. **The Reveal (5 min)**:  
     - Write rule on board: `x_{n+1} = 4x_n(1 - x_n)`.  
     - Show two runs from `x₀ = 0.341592` (true) and `x₀ = 0.34159201` (perturbed):  
       | Step | True Run | Perturbed Run |  
       |------|----------|--------------|  
       | 0    | 0.341592 | 0.34159201   |  
       | 1    | 0.899999 | 0.900000     |  
       | 2    | 0.360006 | 0.360000     |  
       | ...  | ...      | ...          |  
       | 6    | 0.583123 | 0.812877     | *(Diverged!)*  

  5. **Debrief (20 min)**:  
     - Map observations to the four points (see below).  
     - Address misconceptions.  
     - Exit ticket.  

  ---

  ### **Debrief & Misconception Management**  
  **Map to Learning Points**:  
  1. **Determinism ≠ Predictability**:  
     - *"You had the true rule, yet predictions failed after a few steps. Why?"*  
     → Point to the Ideal Predictor’s failure: finite precision (6 decimals) caused rounding errors that snowballed.  

  2. **Precision/Lead-Time Tradeoff**:  
     - *"How many groups predicted step 6 correctly? Step 1?"*  
     → Show: Each step requires ~2× more starting precision (Lyapunov exponent ln 2). 6 decimals buy ~15–20 steps max in theory—but rounding kills it faster.  

  3. **Rule ≠ Prediction**:  
     - *"Ideal Predictor: you had the rule and exact start. Why fail?"*  
     → Emphasize: Rounding at each step is unavoidable with 6-digit inputs. Not carelessness—mathematical inevitability.  

  4. **Underdetermination**:  
     - *"Why did bets on the black boxes split? Could you prove which was random?"*  
     → Finite data (20 values) can’t distinguish chaos from randomness at this resolution.  

  **Predictable Misconceptions & Responses**:  
  - **"The system is random"**:  
    → *"The rule is fixed and simple—like flipping a coin with equations. Random-looking output doesn’t imply randomness."*  

  - **"More data/computation would fix it"**:  
    → *"A faster computer can’t invent digits you don’t have. Better instruments grant more lead time, but exponentially more precision is needed for each extra step."*  

  - **"Data came from your laptop"**:  
    → *"The rule is transparent—test it yourself! Plug in a starting value and calculate step 1. The gap is in the math, not the source."*  

  - **"Ideal Predictor was careless"**:  
    → *"Everyone rounded to 6 decimals—including the Ideal Predictor. The failure is systemic: small initial uncertainties grow."*  

  - **"Determinism is unfalsifiable"**:  
    → *"This shows underdetermination at finite resolution, not in principle. With infinite precision/data, you could detect deterministic structure. But we never have that."*  

  **What the Activity Can’t Deliver (Requires Your Lecture)**:  
  1. **Unpredictability is precision-dependent**:  
     - *"We chose 6 digits and ±0.001 tolerance. With infinite digits, you could predict forever—but no real measurement has that."*  
  2. **Black boxes illustrate underdetermination, not undetectability**:  
     - *"Longer/cleaner data can reveal structure (e.g., attractor reconstruction). But at fixed resolution, ambiguity remains."*  
  3. **No bearing on free will or cosmic determinism**:  
     - *"This is a math toy. Whether the universe is deterministic or what that implies for choice is untouched here."*  

  ---

  ### **Exit Ticket**  
  *(Students answer anonymously on index cards)*  
  1. Why did the Ideal Predictor (with exact rule and 6-digit start) fail after a few steps?  
  2. How does needing to predict farther ahead change the required starting precision?  
  3. Why couldn’t we be sure which black-box sequence was deterministic?  
  4. Does unpredictability here mean the system wasn’t governed by laws?  

  **Expected Answers**:  
  1. Rounding errors amplified with each step.  
  2. Required precision increases exponentially (each step ~doubles needed digits).  
  3. Finite data at fixed resolution can’t distinguish chaos from randomness.  
  4. No—it was deterministic but sensitive to tiny errors.  

  ### **First-Run Pitfalls**  
  - **Timing**: Prediction phase may run long. *Mitigation*: Use calculators; cap at 5 steps if needed.  
  - **Divergence Visibility**: Some starting values diverge slower. *Mitigation*: Pre-test values (e.g., near 0.1 or 0.9).  
  - **Black Box Betting**: Students may "guess" correctly. *Use it!*: *"Some won—but was it luck or certainty?"*  
  - **Philosophical Tensions**: A sharp student notes: *"Longer data could reveal structure."* → *"Yes! But in practice, noise and finite resolution limit this. That’s why we use statistical tests, not yes/no answers."*  

  This activity makes the prediction gap visceral. Students lose points on later steps despite having the rule; they split bets on black boxes; they see the Ideal Predictor—armed with truth—fall. The reveal of divergent trajectories from near-identical starts crystallizes sensitive dependence. You frame the limits, ensuring the takeaway isn’t skepticism but nuance: laws govern, but prediction is a battle against uncertainty.
