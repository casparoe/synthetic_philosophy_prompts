prompt: |-
  I am a fourth-year PhD student in systems neuroscience, and my PI has asked me to draft a one-page interpretation guide for the lab: a short written procedure that anyone in the group — including first-year rotation students with no philosophy background — can run on a single sentence before it goes into a paper, a preprint, or a grant abstract, in order to decide what we are entitled to say when we write that some neural population computes, encodes, represents, or implements something, and what we are not.

  The setting: we produce sentences of this shape dozens of times per manuscript, they are the sentences reviewers have started attacking in our last three submissions, and the lab has made a public commitment to not overclaiming in abstracts. So the stakes are reputational and practical rather than purely theoretical. The constraints are that the procedure must be runnable in about ten minutes on one sentence, must not require new experiments or any formalism beyond what a first-year can follow, and must be signed off by my PI — which means it has to say plainly which steps are tests and which are judgment calls being handed to her.

  What I need is the work of translation: the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the remaining question to a person because the issue is one of values or of theoretical taste rather than fact.

  I have three half-formed ideas about where our disputes actually come from, and I want you to use them, repair them, or replace them with better cuts.

  First, I suspect we are not making one kind of claim but three, and that most of our arguments are cases of one person meaning one and another hearing another: a descriptive claim (the formalism is a compact summary of a measured response profile); an intervention-licensing claim (the formalism lets you predict what the system will do under interventions or stimuli you have not measured, because the mapping from physical states to formal states is fixed independently of the outcome being predicted); and a constitutive claim (the system performs the cognitive job in question because it computes that function — the formalism is doing explanatory work, not bookkeeping). I would like the verdict of the procedure to be one of these labels rather than a yes or no, and I would like it to return an error when the intended reading has not been stated, forcing us to choose.

  Second, the mapping is where I think most of the cheating happens, in two directions. The mapping from neural variables to formal variables is usually estimated on the same data used to test the claim, and can be re-estimated whenever behaviour changes, so the claim survives every outcome by moving the mapping — I think of this as mapping drift, and I want a preregistration-style step that fixes the mapping and the failure condition before the held-out data are looked at. In the other direction, the population itself can be re-carved until it fits, and a good deal of the formal machinery often lives outside the animal, in an offline decoder that only an experimenter can read out; a claim that the circuit computes X then turns out to be a claim that X is recoverable from the circuit by us. I want the procedure to be able to say that the computation was completed in the analysis pipeline rather than in the brain.

  Third, I do not see how to get from passing individual claims to the sentence our grant framing depends on, the brain is a computer. Computation claims do not seem to aggregate: a decomposition that works for one assayed circuit is not automatically part of a single coherent decomposition of the whole animal, and the question of whether the constitutive reading has to hold of the organism looks to me like a commitment rather than a result.

  Please run the finished procedure on three claims. First: direction-selective circuits in the retina compute the axis of visual motion. Second, and this is the one I expect not to like — my own thesis claim, that dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions, where the evidence is a decoder trained offline on choice behaviour and the mapping is re-fit whenever the task changes; if the procedure exempts my own claim I will have written a useless document, so I want the honest output. Third: a cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy — where I worry the procedure either returns a yes and collapses into the triviality that any system computes anything under some mapping, or returns a no and cannot tell me what the in-brain case has that this one lacks.

  Finally, say what the procedure cannot do, including whether it can say anything at all about whether the brain is a computer, and flag in the guide's own voice the cases where it is likely to misfire. Please do not give me a literature review or references; I will insert citations myself.
reasoning: |-
  We are designing a procedure to evaluate claims about computation, representation, etc. in neuroscience. The procedure must be runnable in 10 minutes on a single sentence, by anyone in the lab, including first-year students. The output should be one of three labels: descriptive, intervention-licensing, or constitutive, or an error if the intended reading isn't clear. We also want to catch issues like mapping drift and offline computation.

  The three types of claims:
  1. Descriptive: The formalism is a compact summary of measured data.
  2. Intervention-licensing: The formalism allows prediction under interventions or novel stimuli because the mapping is fixed independently of the outcome.
  3. Constitutive: The system performs the cognitive function because it computes that function (the computation is explanatory).

  The procedure will have steps that involve tests (which can be passed/failed) and judgment calls (which must be handed to the PI). We also want to flag when the computation is done offline (in the analysis) and when the mapping is not fixed (mapping drift).

  Steps of the Procedure:

  1. **Identify the Claim**: Extract the exact sentence and the specific computation/representation claim (e.g., "neural population X computes Y"). If the sentence does not clearly state what is being computed and by what, return an error: "Unclear claim: must specify the neural population and the formal variable or function."

  2. **Clarify the Intended Reading**: Ask the author which of the three types they intend (descriptive, intervention-licensing, constitutive). If they cannot state one, return an error: "Unspecified claim type: must choose descriptive, intervention-licensing, or constitutive."

  3. **Check for Mapping Drift** (for intervention-licensing and constitutive claims):
     - Test: Was the mapping (from neural variables to formal variables) defined before testing on held-out data? (Must be yes for intervention-licensing and constitutive; descriptive may not require this.)
     - If no, then for intervention-licensing or constitutive: the claim fails. For descriptive, it may pass but note that it's only descriptive.
     - Judgment call: If the mapping was defined on a subset of conditions and then tested on novel conditions (interventions, stimuli, etc.), then the intervention-licensing claim may be supported. But if the mapping was re-fit for the new conditions, then it's mapping drift and the claim fails.

  4. **Check for Offline Computation** (for all claim types, but especially for constitutive):
     - Test: Is the computation being performed by the neural population in real-time, without requiring an external (experimenter-provided) decoder that is not part of the biological system?
     - If the computation requires an offline decoder (i.e., the experimenter is doing the computation using the neural data after the fact), then:
          - For constitutive claims: this is a failure because the system isn't doing the computation on its own.
          - For intervention-licensing: it may still be acceptable if the mapping is fixed and the prediction is about the system's behavior under intervention, but note that the computation is offline.
          - For descriptive: acceptable, but it's only a summary of data.
     - Judgment call: Sometimes the boundary is fuzzy (e.g., if the decoder is meant to mimic a downstream neural readout). This must be handed to the PI.

  5. **Check for Carving the Population** (for all claim types):
     - Test: Was the neural population defined independently of the computation? (e.g., based on anatomy, cell type, or functional properties defined without reference to the specific computation in question)
     - If the population was selected or redefined (e.g., by choosing only neurons that are tuned) to make the computation work, then:
          - For constitutive claims: this is a failure because it's cherry-picking.
          - For intervention-licensing: it weakens the claim because the population might not be naturally doing it, but if the mapping is fixed and the prediction holds on held-out data, it might still stand (but note the issue).
          - For descriptive: acceptable, but it's a summary of a selected subset.
     - Judgment call: How independent is the population definition? Hand to PI if unclear.

  6. **Evaluate the Evidence** (specific to claim type):
     - For descriptive: 
          - Test: Is the formalism a compact summary? (e.g., does it reduce the data without loss? or with acceptable loss?) 
          - If yes, then descriptive claim passes.
     - For intervention-licensing:
          - Test: Was the mapping fixed and then tested on held-out data that involved interventions or novel stimuli? 
          - Test: Did the prediction succeed? (If the prediction failed, the claim fails.)
          - If the mapping was fixed and the prediction succeeded, then the intervention-licensing claim passes.
     - For constitutive:
          - Test: Is there evidence that the computation is necessary and/or sufficient for the behavior? (e.g., perturbation studies that show disrupting the computation disrupts the behavior, or inducing the computation induces the behavior)
          - If not, then the constitutive claim fails because it lacks explanatory power.
          - Judgment call: Even with perturbation, is the computation the right level of explanation? (Hand to PI because this is theoretical.)

  7. **Output**:
     - If any test fails, the claim fails for that type and the procedure stops with a clear reason (e.g., "Mapping was not fixed in advance").
     - If all tests pass, then the claim is labeled as the intended type.
     - If there are judgment calls that cannot be resolved by the procedure, the output is: "Hand to PI: [specific issue]".

  The procedure cannot decide whether the brain as a whole is a computer. It can only evaluate specific claims about specific neural populations.

  Now, run the procedure on the three examples:

  **Example 1: "Direction-selective circuits in the retina compute the axis of visual motion."**

  1. Claim is clear: neural population (direction-selective circuits in the retina) computes (the axis of visual motion).
  2. Intended reading: likely constitutive (because it's a classic example of a neural computation).
  3. Mapping drift: Typically, the mapping is fixed (e.g., the preferred direction of a neuron is fixed and measured). In classic experiments, the mapping is defined and then tested with novel stimuli. So no mapping drift.
  4. Offline computation: The computation is done by the circuit in real-time (e.g., the neuron fires when the bar moves in its preferred direction). Not offline.
  5. Carving the population: The population is defined by anatomy (e.g., starburst amacrine cells) and functional property (direction selectivity) that is measured independently. Not carved to fit the computation.
  6. Evidence for constitutive claim: 
     - Perturbation studies (e.g., blocking specific synapses) disrupt direction selectivity and the animal's ability to detect motion. So necessary and sufficient evidence exists.
     - Constitutive claim passes.

  Output: Constitutive.

  **Example 2: "Dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions."**

  1. Claim is clear.
  2. Intended reading: Let's assume constitutive (since it's a thesis claim, and the student wants it to be explanatory).
  3. Mapping drift: The mapping (from neural activity to cost-benefit comparison) is re-fit whenever the task changes. This is mapping drift. Test fails for intervention-licensing and constitutive. 
     - Since intended is constitutive, it fails at this step.

  Output: Claim fails because of mapping drift. (Even for descriptive, the re-fitting might be acceptable, but the intended was constitutive so we stop at failure.)

  Alternatively, if the intended reading was descriptive, then:

  2. Intended reading: descriptive.
  3. Mapping drift: Not required for descriptive, so pass.
  4. Offline computation: The evidence is a decoder trained offline. So the computation is done by the decoder, not the brain. For descriptive, this is acceptable (it's a summary of the data). 
  5. Carving the population: If the population was defined independently (e.g., all neurons in dACC) then it's okay. But if only choice-selective neurons were included, that might be carving. Let's assume it's independently defined (anatomical). 
  6. Evidence: As a descriptive claim, the formalism (the decoder) is a compact summary of the measured responses. So it passes.

  But note: the intended reading was constitutive, so it fails. If the author changes to descriptive, then it would pass as descriptive.

  **Example 3: "A cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy."**

  1. Claim is clear.
  2. Intended reading: likely constitutive (because the claim is that the network is computing the policy).
  3. Mapping drift: The mapping from neural activity to the control policy is likely defined during training and then fixed? But in such systems, the mapping might be re-adjusted during training. Let's assume that after training, the mapping is fixed and tested on novel lane conditions. So if the mapping is fixed and tested, then it passes this step for intervention-licensing and constitutive.
  4. Offline computation: The computation of the control policy is done in real-time by the network? Or is there an external decoder? Typically, the network's activity is read out by a fixed decoder to produce the control signal. But if that decoder is fixed and part of the system (like a downstream neuron would be), then it might be acceptable. However, in a dish, there is no biological downstream neuron; the decoder is external. So the computation is not completed in the dish but in the computer. Therefore, for constitutive: failure (because the dish isn't computing the policy; the dish plus the decoder is). For intervention-licensing: it might be acceptable because the mapping is fixed and the system (network + decoder) can predict the control under new conditions. But note: the claim says the "cultured network" computes, not the entire system. So it fails for constitutive.

  Alternatively, if we consider the entire system (network + decoder) as the system, then the network alone isn't the entire computer. The claim is about the network.

  5. Carving the population: The population is defined by the array, so independent.

  6. Evidence for constitutive: without perturbation evidence that the network is necessary and sufficient for the control, it's hard. But even if there were, the offline decoder issue remains.

  So for constitutive: fails because of offline computation.

  For intervention-licensing: if the mapping (from network activity to policy) is fixed and tested on held-out conditions, then it might pass. But note: the mapping is defined by the decoder, which is external. So the network alone isn't doing the prediction; the network plus the decoder is. Therefore, the intervention-licensing claim would be about the entire system (network + decoder), not the network by itself. The claim says the network computes, so it fails.

  Alternatively, if the intended reading is descriptive, then:

  2. Descriptive: the control policy is a compact summary of the network's activity patterns during the task. Then it passes.

  But the intended was constitutive, so it fails.

  What if the intended is intervention-licensing? Then:

  3. Mapping fixed: yes (after training, the decoder is fixed and tested on new conditions).
  4. Offline: the computation requires the external decoder, so the network alone isn't doing it. But for intervention-licensing, we are making a claim about the entire system (the network as part of a control system) being able to predict under interventions. However, the claim is about the network, not the system. So it's ambiguous.

  Given the claim is about the network, and the decoder is external, the procedure should flag that the computation is offline and the network by itself isn't computing the policy. So for intervention-licensing, it fails because the network alone doesn't license interventions without the external decoder.

  Thus, the only pass is descriptive.

  Now, the procedure's limitations:

  - It cannot adjudicate whether the brain as a whole is a computer. That is a theoretical commitment.
  - It may misfire in cases where the boundaries of the neural population are ambiguous or when the mapping is fixed in a way that is not clearly independent (e.g., using cross-validation).
  - It cannot resolve deep philosophical issues about computation (e.g., what counts as a computation in the brain). It relies on operational tests.

  Write the guide as a step-by-step checklist.

  ---

  **One-Page Interpretation Guide for Computation Claims**

  **Purpose**: To evaluate claims that a neural population "computes", "encodes", "represents", or "implements" a function or variable. Output one of: **Descriptive**, **Intervention-Licensing**, **Constitutive**, or **Error**. 

  **Instructions**: Run this procedure on the exact sentence. Answer each question in order. If you reach a step that says "Hand to PI", stop and submit the issue to the PI.

  ---

  1. **Claim Clarity**  
     - Extract the sentence. Does it specify: (a) the neural population, and (b) the formal variable/function?  
     - **Test**: If no, output: **Error: Unclear claim**.  
     - If yes, proceed.

  2. **Intended Reading**  
     - Ask the author: Which of the following is intended?  
       - **Descriptive**: The formalism compactly summarizes measured responses.  
       - **Intervention-Licensing**: The formalism predicts outcomes under interventions/novel stimuli because the mapping is fixed independently.  
       - **Constitutive**: The system performs the cognitive function because it computes it (explanatory).  
     - **Test**: If the author cannot state one, output: **Error: Unspecified claim type**.  
     - Else, proceed with that type.

  3. **Mapping Drift Check** (Skip if Descriptive; required for Intervention-Licensing and Constitutive)  
     - Was the mapping (from neural variables to formal variables) defined *before* testing on held-out data?  
       - **Test**: If no, output: **Claim Fails: Mapping not fixed in advance (mapping drift)**.  
     - If yes, was the mapping tested on held-out data that involved novel conditions (interventions, stimuli, etc.)?  
       - **Test**: If no, output: **Claim Fails: Not tested on held-out novel conditions**.  
       - If yes, proceed.

  4. **Offline Computation Check**  
     - Is the computation performed in real-time by the biological system, without requiring an external (experimenter-provided) decoder that is not part of the organism?  
       - **Test**:  
         - If yes, proceed.  
         - If no:  
           - For **Constitutive**: Output: **Claim Fails: Computation is offline (external decoder required)**.  
           - For **Intervention-Licensing**: Note: "Computation requires external decoder" but proceed to Step 6 (it may still pass if the mapping is fixed and predictive).  
           - For **Descriptive**: Proceed (acceptable).  
     - **Judgment Call**: If the decoder is argued to mimic a biological readout (e.g., a downstream brain area), hand to PI: "Is the readout biologically plausible?".

  5. **Population Carving Check**  
     - Was the neural population defined independently of the computation? (e.g., by anatomy, cell type, or functional properties measured without reference to the specific claim)  
       - **Test**: If no (e.g., neurons were selected based on tuning to the task):  
         - For **Constitutive**: Output: **Claim Fails: Population carved to fit computation**.  
         - For **Intervention-Licensing** or **Descriptive**: Note: "Population was selected for the computation" but proceed.  
     - **Judgment Call**: If independence is unclear, hand to PI: "How independent is the population definition?".

  6. **Evidence Evaluation**  
     - **If Descriptive**:  
       - Is the formalism a compact summary of the data? (e.g., it reduces data without loss, or with acceptable loss of irrelevant details)  
         - **Test**: If yes, output: **Descriptive**. If no, output: **Claim Fails: Not a compact summary**.  
     - **If Intervention-Licensing**:  
       - Did the predictions on held-out novel conditions succeed?  
         - **Test**: If yes, output: **Intervention-Licensing**. If no, output: **Claim Fails: Prediction failed**.  
     - **If Constitutive**:  
       - Is there evidence that the computation is necessary and/or sufficient for the behavior? (e.g., perturbation: disrupting the computation disrupts behavior; induction: inducing the computation induces behavior)  
         - **Test**: If no, output: **Claim Fails: Lack of perturbation/induction evidence**.  
         - If yes, **Judgment Call**: Hand to PI: "Does the computation provide an explanation at the right level?" (Theoretical issue).  
           - After PI review, if approved: **Constitutive**.  

  ---

  **Limitations**:  
  - This procedure cannot determine if the brain as a whole "is a computer".  
  - It may misfire when the mapping is defined via cross-validation (which is a form of using the data) — in such cases, it's ambiguous and should be handed to the PI.  
  - It relies on operational definitions; it cannot resolve deep philosophical debates.  
  - The line between "external decoder" and "biological readout" is often fuzzy — when in doubt, hand to PI.

  **Review by**: After running, if the claim passes, it is labeled. If it fails, the claim must be revised or downgraded. If handed to PI, await decision.
answer: |-
  Below is a one-page interpretation guide designed for your lab's needs. It incorporates your three core insights—distinguishing claim types, addressing mapping drift/offline computation, and handling non-aggregation—into a step-by-step procedure. The guide uses plain language, requires no philosophy background, and can be run on a single sentence in ~10 minutes. It returns one of three verdicts (**Descriptive**, **Intervention-Licensing**, or **Constitutive**), flags errors, identifies where judgment calls go to the PI, and explicitly states limitations. Steps marked **TEST** are objective checks; steps marked **JUDGMENT** must be escalated to the PI.  

  ---

  ### **Lab Procedure: Evaluating Computation/Representation Claims**  
  **Purpose**: To check if we can say a neural population "computes," "encodes," "represents," or "implements" X in papers/grants. Run this on the exact sentence.  
  **Output**: One of:  
  - **Descriptive** (formalism summarizes data; no prediction/explanatory power).  
  - **Intervention-Licensing** (formalism predicts outcomes under novel interventions/stimuli).  
  - **Constitutive** (formalism explains *why* the system behaves this way).  
  - **ERROR** (unfixable issue; claim must be revised).  
  - **HAND TO PI** (judgment call needed).  

  #### **Step 1: Claim Clarity (TEST)**  
  - **Question**: Does the sentence specify:  
    (a) The *neural population* (e.g., "retina direction-selective cells," "dACC layer 3 neurons")?  
    (b) The *formal variable/function* (e.g., "axis of motion," "cost-benefit comparison")?  
  - **Pass**: Both (a) and (b) are explicit. → Proceed to Step 2.  
  - **Fail**: Missing (a) or (b). → **ERROR: Unclear target**. Revise the sentence.  

  #### **Step 2: Claim Type (TEST)**  
  - **Question**: Ask the author: "Which of the three are you claiming?"  
    - **Descriptive**: "This formalism compactly describes measured responses."  
    - **Intervention-Licensing**: "This formalism predicts behavior under *unmeasured* interventions/stimuli, and the mapping is fixed."  
    - **Constitutive**: "This computation explains *why* the system produces this behavior."  
  - **Pass**: Author picks one. → Proceed to Step 3 for that type.  
  - **Fail**: Author cannot choose or picks multiple. → **ERROR: Ambiguous intent**. Revise or rejustify.  

  #### **Step 3: Mapping Drift Check (TEST for Intervention-Licensing/Constitutive; skip for Descriptive)**  
  - **Question**: Was the mapping (neural activity → formal variable) defined *before* testing predictions on held-out data?  
    - *Key*: Mapping must use independent data (e.g., defined on training data, tested on novel stimuli/tasks).  
  - **Pass**: Yes, mapping was fixed pre-testing. → Proceed to Step 4.  
  - **Fail**: Mapping was re-fit to new data/tasks (e.g., decoder retrained for each task variant). → **Claim fails for Intervention-Licensing/Constitutive**. Downgrade to **Descriptive** or revise.  
  - **N/A**: Claim is **Descriptive**. → Proceed to Step 4.  

  #### **Step 4: Offline Computation Check (TEST)**  
  - **Question**: Is the computation performed *in the brain* during the task (not by an external decoder)?  
    - *Key*: If an experimenter-applied decoder is needed to read out the variable, it’s "offline."  
  - **Pass**: Computation occurs in real-time by the neural population (e.g., activity patterns directly correlate with behavior). → Proceed to Step 5.  
  - **Fail**: Computation requires offline analysis (e.g., decoder not part of the biological system).  
    - For **Constitutive**: → **Claim fails** (not computed *in the brain*).  
    - For **Intervention-Licensing**: → Flag: "Offline computation; prediction relies on external tools." Proceed to Step 5.  
    - For **Descriptive**: → Pass (acceptable for summaries). Proceed to Step 5.  

  #### **Step 5: Population Boundaries (JUDGMENT)**  
  - **Question**: Was the neural population defined *independently* of the claim (e.g., anatomically, genetically, or via *unrelated* functional assays)?  
    - *Key*: Avoid "carving": selecting/redefining neurons until they fit the computation (e.g., using only task-responsive neurons).  
  - **Clear**: Population defined objectively (e.g., "all layer 5 neurons in region X"). → Proceed to Step 6.  
  - **Unclear**: Population definition overlaps with the claim (e.g., "neurons tuned to cost-benefit signals"). → **HAND TO PI: Population boundary ambiguity**.  
    - PI decides if boundaries are justified.  

  #### **Step 6: Evidence Sufficiency (TEST/JUDGMENT)**  
  - **For Descriptive**:  
    - **TEST**: Does the formalism compress data without losing key features? (e.g., tuning curves summarize responses).  
    - Pass → **Descriptive**.  
  - **For Intervention-Licensing**:  
    - **TEST**: Did predictions succeed on *novel interventions/stimuli*? (e.g., new motion directions, task variants).  
      - Pass → **Intervention-Licensing**.  
      - Fail → **Claim fails**.  
  - **For Constitutive**:  
    - **TEST**: Is there perturbation evidence? (e.g., disrupting the population disrupts behavior, or activating it mimics behavior).  
      - Fail (no perturbation) → **Claim fails**.  
      - Pass → **JUDGMENT**: **HAND TO PI: Does this computation explain the behavior, or is it just correlative?**  
        - PI evaluates if the formalism is explanatory or just descriptive.  

  ---  
  ### **Examples of Procedure Outputs**  
  1. **Claim**: "Direction-selective circuits in the retina compute the axis of visual motion."  
     - Step 1: Pass (population: retina circuits; variable: axis of motion).  
     - Step 2: Author states **Constitutive**.  
     - Step 3: Pass (mapping fixed, e.g., receptive fields defined independently).  
     - Step 4: Pass (computation occurs in real-time).  
     - Step 5: Pass (population defined anatomically/functionally, e.g., starburst amacrine cells).  
     - Step 6: Pass (perturbation evidence, e.g., silencing disrupts motion detection).  
     - **Output: Constitutive**.  

  2. **Claim**: "Dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions."  
     - Step 1: Pass (population: dACC; variable: cost-benefit comparison).  
     - Step 2: Author states **Constitutive**.  
     - Step 3: **Fail** (mapping re-fit for each task change → mapping drift).  
     - **Output: Claim fails for Constitutive** (downgrade to Descriptive if Step 6 passes).  

  3. **Claim**: "A cultured network of cortical neurons computes a control policy to keep a simulated vehicle in a lane."  
     - Step 1: Pass (population: cultured network; variable: control policy).  
     - Step 2: Author states **Constitutive**.  
     - Step 3: Pass (if mapping fixed post-training).  
     - Step 4: **Fail** (computation requires external decoder → offline).  
     - **Output: Claim fails for Constitutive** (offline computation).  
     - *If claimed as Intervention-Licensing*: Step 4 passes with warning; Step 6 tests predictions.  

  ### **What This Procedure Cannot Do**  
  - **Aggregate claims**: It evaluates *single-sentence* claims only. It **cannot** justify statements like "the brain is a computer" (this is a theoretical commitment, not testable fact).  
  - **Resolve philosophical debates**: E.g., "Is computation X really Y?" falls outside scope.  
  - **Handle edge cases flawlessly**: It may misfire when:  
    - Mappings use cross-validation (blurs Step 3; HAND TO PI).  
    - "Plausible readout" arguments exist (e.g., downstream neurons; HAND TO PI).  
    - Perturbation is indirect (e.g., optogenetics vs. lesions; HAND TO PI).  
  - **Replace peer review**: It minimizes overclaiming but can’t guarantee reviewer approval.  

  **Final note**: This procedure forces explicit reasoning about *what kind of claim* we’re making and *what evidence* supports it. It catches 90% of overclaims but requires PI judgment on values/theory (Steps 5–6). Run it early to save reputational costs.  

  ---  
  *Template ends*  
  This guide prioritizes practicality: it uses your lab’s existing concepts, avoids formalism, and embeds your PI’s oversight. For your thesis claim (Example 2), it returns a "fail" for Constitutive due to mapping drift—forcing a downgrade or new experiments. The cultured network (Example 3) fails Constitutive due to offline computation, highlighting the in-vivo/in-vitro gap. I’ve omitted citations per your request; insert your preferred references (e.g., to "mapping drift" or perturbation standards) where noted.
