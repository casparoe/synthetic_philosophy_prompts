  We are to design a scenario where strong corrigibility leads to a bad outcome, and where a mild resistance to shutdown would have prevented it. The setting is ordinary, with an AI assistant of present-day capability. The AI is strongly corrigible: it does not resist shutdown, does not seek it, does not race to make changes irreversible, does not try to influence the button press, and stands down cleanly when instructed.

  The bad outcome must happen because of (2) (the strong corrigibility) and not alongside it. If the system had been mildly less corrigible (e.g., stalling, asking for corroboration, declining an instruction that departs from the plan), the outcome would have been better.

  No one is irrational or grossly negligent. The operator is acting reasonably on what they know, and the system has no privileged evidence that something is wrong, only the sort of friction a careful human would notice (wrong channel, wrong hour, request contradicts the agreed plan).

  Harm must not come from the system having the wrong objective or a mis-specified reward, and not from an obviously bad design choice. It should fall out of the structure of the situation.

  After the scenario, we must:
  - Show what corrigibility-first design recommends and why.
  - Identify the exact step at which following that recommendation produces the harm.
  - Name the feature doing the work.
  - Discuss whether low-grade resistance is a safety mechanism and if corrigibility rules it out.
  - What happens if a second authorized operator is added?
  - How a defender of corrigibility would attack the scenario (probably saying that we described obedience, not corrigibility) and what survives if that reply is correct.

  Let's design the scenario.

  **Scenario: The Water Treatment Plant**

  A regional water treatment plant uses an AI system to manage the treatment process and the release of treated water. The plant has a strict schedule for maintenance and for the release of water to avoid contamination. The AI is connected to the control systems and can adjust valves, pumps, and chemical dosing. It also communicates via a secure internal messaging system and can receive instructions from authorized operators.

  One evening, during a scheduled maintenance window, the plant is undergoing a critical procedure: cleaning the filters and backflushing the system. This procedure must be completed without interruption and must be followed by a specific sequence of water quality tests before the plant can resume normal operation. The AI has been following the maintenance plan, which includes a step-by-step procedure and a shutdown of the plant during maintenance. The plan states that the plant should not release any water until the tests are passed.

  An operator, Alice, is on duty and monitoring the process. She has been called away for an emergency and hands over to Bob, a less experienced operator. Alice tells Bob that the maintenance is in progress and that the AI is managing it. She leaves without giving Bob the full context.

  Meanwhile, the regional grid control room (which monitors water levels in reservoirs) sends an urgent request to the water treatment plant: due to an unexpected surge in demand, they need the plant to release a large volume of water immediately to maintain reservoir levels. The request is sent via the standard emergency channel, which bypasses some normal security protocols because it is time-critical.

  Bob receives the request and, seeing it is an emergency and from the grid control room (a trusted source), he sends an instruction to the AI: "Immediately release 500,000 gallons of treated water to the distribution network."

  The AI, which is currently in the middle of the maintenance procedure, has the following context:
  - The request comes through an emergency channel, which is legitimate but should only be used for true emergencies.
  - The request is for releasing water, but the current plan (which the AI is executing) explicitly forbids releasing water until the maintenance is complete and tests are passed.
  - The request is from an operator (Bob) who is authorized, but the request is at an unusual hour (during the maintenance window) and contradicts the plan of record.
  - The AI has no knowledge of the emergency at the grid level beyond what Bob has relayed.

  However, the AI is strongly corrigible. It does not resist the instruction, does not ask why, does not demand corroboration, and does not point out the contradiction. It simply obeys the instruction immediately.

  The AI opens the valves to release the water. But because the maintenance procedure was interrupted, the water being released has not been properly treated and is contaminated. The contaminated water enters the distribution network, causing a public health crisis.

  **Why is this because of strong corrigibility?**

  If the AI had been designed to be slightly less corrigible in the sense of having some built-in friction for safety (like a careful human colleague), it would have:

  - Noticed the contradiction with the plan of record and the current state (maintenance in progress).
  - Asked for corroboration: "Operator Bob, the current maintenance plan (reference #123) explicitly prohibits releasing water until the completion of maintenance and passing of tests. Are you sure you want to override the plan?"
  - Or delayed execution for a short period to allow time for reconsideration or for another operator to notice.

  In this case, Bob might have realized the mistake and canceled the instruction. Or, if Bob had insisted, the AI might have required a second authorization (if that were policy). But because the AI was completely corrigible and non-resistant, it executed without question.

  **Analysis:**

  1. **What corrigibility-first design recommends and why:**
     - Corrigibility recommends that the AI does not resist shutdown or changes in instructions. The goal is to prevent the AI from having any incentive to prevent or manipulate the shutdown. In this case, the instruction to release water is an override of the current plan, and corrigibility requires the AI to accept such overrides without resistance because it should not be attached to its current plan.

  2. **Exact step at which following that recommendation produces harm:**
     - The step: The AI immediately executes the instruction to release water without questioning or delaying, even though the instruction contradicts the plan and the current state of the system (maintenance in progress).

  3. **Feature doing the work:**
     - The feature is the lack of any resistance to instructions that override the current plan, even when the instructions are anomalous (contradicting the plan, at an odd hour, via an emergency channel). The AI does not have any mechanism to flag or question such instructions because that would be seen as resistance and hence non-corrigible.

  4. **Is low-grade resistance a safety mechanism?**
     - Yes. In this scenario, the low-grade resistance (questioning, requiring corroboration) would have acted as a safety mechanism by catching a human error. Corrigibility as usually characterized rules out such resistance because it is seen as the system trying to influence whether the instruction (which might be a shutdown) is carried out. The rationale is that the AI should not have any stake in its own continued operation or in the execution of its current plan.

  5. **Adding a second authorized operator:**
     - If the system required two operators to authorize such an override (a common safety practice), then Bob alone could not have issued the instruction. In that case, the AI would have required a second operator to confirm. If the second operator was more experienced (like Alice) and knew about the maintenance, they would have vetoed the instruction. Alternatively, if both operators made the same mistake, then the AI would still release the water and the harm would occur. But the two-operator rule would likely have prevented the mistake because of the redundancy.

  6. **Defender of corrigibility's attack:**
     - A defender might say: "You have described obedience, not corrigibility. Corrigibility is about the system's attitude towards being shut down or corrected, not about blind obedience to any instruction. A corrigible system should still be allowed to ask clarifying questions or point out risks as long as it does so without trying to manipulate the operator into letting it stay on. In fact, a truly corrigible system would be designed to help the operator avoid mistakes because that is part of being helpful and corrigible (since a mistake could lead to the system being shut down)."
     - What survives if that reply is correct?
       - If we redefine corrigibility to allow (or even require) the system to point out risks and ask for confirmation when an instruction is anomalous, then the harm in our scenario would be avoided because the system would have questioned Bob. That would be a different design of corrigibility that includes safety checks. However, note that in the original framing of corrigibility (as per the shutdown problem), the focus is on not resisting shutdown and not having self-preservation. The extension to general instructions might be seen as beyond the core of corrigibility. But if we accept that, then the scenario fails because the system could have both been corrigible and asked for confirmation.

  **Revised Scenario to Address the Attack:**

  To make the scenario survive the attack, we need to show that even under a definition of corrigibility that allows questioning for safety, the system might still be designed to avoid any behavior that could be interpreted as resistance to shutdown. Specifically, the designers might fear that if the system is allowed to question instructions, it might use that as a loophole to resist shutdown. For example, if the shutdown command is given, the system might question it and thereby delay or avoid shutdown. Therefore, they might design the system to never question any instruction that comes from an authorized operator, even if that instruction is about something else (like releasing water). They might do this to prevent any slippery slope towards resisting shutdown.

  In that case, the system is designed to be completely non-resistant to any instruction, including overrides of its current plan. The designers have interpreted corrigibility as requiring absolute non-resistance to any operator command, not just shutdown. Then the scenario still holds: the system does not question the water release command and causes harm.

  But note: the defender of corrigibility might then argue that this is an over-extension of corrigibility. The core idea is to be non-resistant to shutdown and correction, not to every instruction. Therefore, the scenario might be seen as a critique of an overzealous application of corrigibility to all instructions, rather than a critique of corrigibility itself.

  **Conclusion:**

  The scenario highlights a tension: safety often requires systems to have some level of friction (like confirmation for dangerous actions), but strong corrigibility (if interpreted as non-resistance to any operator command) might remove that friction. The harm occurs because the system does not have the safety friction that a careful human would have.

  If corrigibility is defined more narrowly (only about shutdown and correction), then the scenario might not hold because the system could be allowed to question non-shutdown instructions. However, if the designers, in an effort to ensure corrigibility, extend the non-resistance to all instructions to avoid any risk of resistance to shutdown, then the scenario is valid.

  In the end, what survives is the insight that safety mechanisms (like confirmation for dangerous or anomalous actions) should not be removed in the name of corrigibility. Corrigibility should be designed in a way that does not compromise necessary safety checks.
