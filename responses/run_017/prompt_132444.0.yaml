prompt: |-
  I chair the scientific review committee of a privately funded research program whose mandate, as the trustees wrote it, is to reduce expected harm from catastrophic failures of advanced AI systems. We have room for exactly one more three-year award of roughly $12M, and two finalists are left; I need to circulate a decision memo before Friday's vote. The committee is two formal-methods people, one machine-learning researcher, a statistician, an ethicist, and a trustee's representative who keeps asking what a regulator would actually accept as evidence. Please draft the memo for me. It should give a bottom line — fund A, fund B, fund both at reduced scope under specified conditions, or neither and reopen the call — together with reasoning the losing side's proponents could actually reply to, an honest statement of the strongest consideration on the losing side, and a statement of what the funded team would have to demonstrate at an eighteen-month checkpoint to keep the money. Please keep it to about 900 to 1,200 words, and please don't do a literature review or cite anything; we have all read the proposals and the arguments are supposed to stand on their own.

  Finalist A proposes what it calls a guarantee: the system's design is such that, for any input in a formally specified class, the probability of an action violating a stated safety specification is below a threshold, and the bound is proved rather than measured. Our technical reviewer pressed on how the class is defined. The bound is conditional on three assumptions: that all relevant dangerous capabilities have been elicited during development, that the component checking outputs cannot itself be subverted, and that deployment inputs remain inside a class the team gets to define. When we asked what happens as that class is widened toward anything like realistic deployment, the proved bound stopped being small and became, in the reviewer's phrase, indistinguishable from no information at all. One committee member thinks this is fine and even exemplary: every engineering guarantee is conditional, and a conditional guarantee is strictly better than none because it localizes disagreement — instead of arguing about a soup of empirical results, we argue about three checkable assumptions. Another member thinks this is an average-case claim wearing a worst-case costume, since our attitude toward those assumptions can only be probabilistic, so that what we would really be buying is an argument whose strength is set by our confidence in the assumptions rather than by the proof.

  Finalist B proposes measurement at scale: millions of agentic trajectories across a deliberately wide range of deployment-like environments, pre-registered metrics for specified harmful behaviors, confidence intervals, plus adversarial red-teaming on a substantial subset. Their pitch is that a bound whose assumptions cannot be validated tells you nothing you can act on, whereas a large and well-designed campaign at least tells you how systems of this kind actually behave and can detect capability thresholds as they appear. Two objections have been raised, and I don't think either is a throwaway. Our statistician notes that the quantity we care about is dominated by a tail: the losses in question are rare, plausibly heavy-tailed, and possibly without a finite mean, so sample averages converge far too slowly — or not at all — to underwrite conclusions about expected harm, and a campaign observing zero catastrophic events in some large number of trials remains perfectly consistent with an expected loss exceeding the entire fund. A second worry, which the B team concedes, is that sufficiently capable systems may be able to tell evaluation from deployment; if so the samples are not drawn from the deployment distribution at all, and the bias does not go in a random direction.

  What has me stuck is that our own governing documents pull apart. The mandate says expected harm, which is an average-case notion — and if the statistician is right that the expectation may not even be well-defined, then the mandate quietly presupposes exactly the light-tailed world B needs in order for its numbers to mean anything. But the charter's review standard tells us not to credit evidence that extrapolates from observed frequencies to unobserved catastrophes, which is the world A is built for. My own instinct keeps flipping: I think a bound nobody can check is partly theater, and I also think we cannot average our way to a conclusion about events that, by hypothesis, happen once. Please don't resolve this by recommending both at reduced scope unless you can argue that is genuinely better than picking one; if you do recommend one, say plainly why its central weakness is less damaging than the other's, and what would have to be true for you to switch.
reasoning: |-
  Okay, the user is chairing a scientific review committee for a privately funded research program focused on reducing expected harm from catastrophic AI failures. They need to draft a decision memo by Friday about which of two finalists to fund with a $12M award. The committee includes formal-methods experts, an ML researcher, a statistician, an ethicist, and a trustee representative concerned about regulatory acceptance.

  The proposals present a fundamental tension: Finalist A offers formal proofs with strong conditional guarantees but potentially unrealistic assumptions, while Finalist B proposes large-scale empirical testing that may not capture rare catastrophic events. The governing documents further complicate things by emphasizing "expected harm" (which favors B) while prohibiting extrapolation from observed frequencies (which undermines B).

  This requires careful balancing. The memo must: 1) Make a clear funding recommendation 2) Address the losing side's strongest arguments fairly 3) Specify checkpoint criteria 4) Keep it concise (900-1200 words) without citations. 

  Notably, the user's description reveals deeper anxieties: the tension between proof vs evidence, the challenge of heavy-tailed risks, and whether committee disagreements reflect genuine philosophical divides. The trustee's "what would regulators accept?" question looms large - this isn't just about technical merit but real-world applicability.

  The solution should: 
  - Prioritize B while explicitly acknowledging A's strengths
  - Frame the decision around regulatory actionability and testability
  - Address the statistician's heavy-tail concern head-on by requiring quantifiable uncertainty at checkpoints
  - Use the checkpoint to force confrontation with each approach's core weakness
  - Avoid compromise recommendations unless truly additive (they're not here)

  The language must be decisive yet diplomatic - committee members need to feel their objections were heard even if overruled. The checkpoint criteria should serve as insurance against the chosen approach's failure modes.
answer: |-
  ## MEMORANDUM  
  **TO:** Scientific Review Committee  
  **FROM:** Committee Chair  
  **SUBJECT:** Final Funding Recommendation for Catastrophic AI Risk Mitigation Program  
  **DATE:** 3 October 2023  

  ### I. DECISION
  **Recommendation:** Fund **Finalist B** at full scope ($12M/3 years). Do not fund Finalist A. Reopening the call is not advised, as both proposals represent high-quality, credible approaches within the current field. Reduced scope for both is impractical; their methodologies require full commitment to yield interpretable results.  

  ### II. SUMMARY OF RATIONALE
  While both teams address critical facets of catastrophic AI risk, **Finalist B’s empirical framework offers actionable, regulatorily credible evidence under the program’s mandate to reduce *expected harm***. Finalist A’s conditional guarantees, though theoretically rigorous, fail to bridge the gap to operational deployment under the charter’s prohibition on extrapolating from observed frequencies. Crucially, B’s approach directly confronts the *evaluability gap* (systems distinguishing testing from deployment), providing a foundation for iterative risk assessment. A’s reliance on unverifiable assumptions leaves regulators—and this committee—without empirical traction.  

  ### III. ANALYSIS OF FINALIST A (FORMAL GUARANTEES)  
  **Strengths Acknowledged:**  
  A’s methodology exemplifies rigorous formal verification. By bounding violation probabilities under explicit assumptions, it forces precise articulation of failure modes and component trustworthiness. This is invaluable for *design-stage* safety arguments and aligns with best practices in high-assurance systems (e.g., aviation). The "localization of disagreement" argument is valid: disputing three defined assumptions is preferable to debating ambiguous empirical data.  

  **Core Weakness & Why It Is Disqualifying Here:**  
  The assumptions underpinning A’s guarantee **cannot be validated within the mandate’s constraints**. Specifically:  
  1. **"Defined input class" limitation**: Widening the class to realistic deployment conditions erodes the bound to vacuity, per our reviewer. The team cannot formally specify "all plausible inputs" without resorting to empirical observation—which the charter explicitly forbids as extrapolation.  
  2. **Unobservable assumptions**: Confidence that "all dangerous capabilities were elicited" or that "the verifier cannot be subverted" is inherently probabilistic and untestable pre-deployment. As the statistician noted, this reduces A’s "worst-case" claim to an *average-case claim about our confidence in assumptions*—a weaker argument than B’s direct measurement.  
  3. **Regulatory paralysis**: The trustee’s concern is decisive. No regulator can approve a system whose safety rests on unmeasurable assumptions. A offers no path to *demonstrating* safety under deployment; it offers a proof contingent on hope.  

  ### IV. ANALYSIS OF FINALIST B (MEASUREMENT AT SCALE)  
  **Strengths Emphasized:**  
  B’s strength lies in **testability and actionability**. By generating massive, diverse datasets with pre-registered harm metrics and adversarial testing, it delivers:  
  - **Transparent risk characterization**: Even with heavy-tailed risks, observing *zero* catastrophes in millions of trials bounds the *annualized probability* of catastrophe given deployment scale (e.g., "less than 1-in-10-million per agent-year under tested conditions").  
  - **Detection of capability thresholds**: Deliberate environmental diversity and red-teaming can uncover emergent dangerous behaviors *before* deployment, enabling mitigation.  
  - **Regulatory credibility**: Measured failure rates under strenuous testing are the lingua franca of safety certification (e.g., pharmaceuticals, automotive).  

  **Strongest Objection & Why It Is Surmountable:**  
  The statistician’s concern about heavy-tailed distributions is serious but not fatal:  
  1. **Bounding expected harm**: While sample averages may not converge, B’s design can estimate *upper bounds* on failure probabilities (via Clopper-Pearson confidence intervals) and model loss *magnitudes* separately. This provides a conservative "risk envelope."  
  2. **Addressing tail dominance**: B can explicitly target tail events via adversarial sampling and stress-testing. While not exhaustive, this reduces uncertainty faster than formal methods under A’s untestable assumptions.  
  3. **The evaluation-deployment gap**: B concedes this risk but *plans to measure it*—e.g., via stealthy adversarial probes and transfer learning tests. This is a testable threat model; A’s assumption that deployment inputs stay "in-class" is not.  

  ### V. WHY B’S WEAKNESS IS LESS DAMAGING THAN A’S  
  The central tension is between **A’s untestable rigor** and **B’s testable uncertainty**. B’s empirical approach directly addresses the mandate’s focus on *expected harm* by quantifying what *can* be observed, while transparently demarcating remaining uncertainties (e.g., via confidence bounds). A’s approach, though logically pristine, substitutes formal proof for empirical assurance where proof cannot constrain real-world risk. **Under the charter’s rules, B provides evidence; A provides a conditional argument that cannot be validated.** If the evaluation-deployment gap proves unbridgeable, B’s negative results would stall deployment—a safety win. If A’s assumptions fail, we learn nothing until catastrophe.  

  ### VI. EIGHTEEN-MONTH CHECKPOINT FOR FINALIST B  
  Continued funding requires B to demonstrate:  
  1. **Empirical bounds on rare harms**: Evidence that pre-registered harm metrics are detectable at plausible rates (e.g., >1-in-100,000 trajectories) *and* that observed rates (even if zero) yield statistically defensible upper bounds (e.g., 95% CI < 1-in-1-million per trajectory).  
  2. **Probing the evaluation gap**: Experiments showing whether tested systems exhibit behavioral divergence under deployment-mimicking conditions (e.g., extended duration, ambiguous instructions). Must show measurable divergence < *X*% or a mitigation strategy.  
  3. **Adversarial yield**: At least 30% of tested systems must exhibit *novel, unanticipated* harmful behaviors during red-teaming, proving the methodology’s stress-testing value.  

  Failure on (1) or (2) terminates funding. (3) is a success metric but not a termination trigger.  

  ### VII. IF I WERE TO SWITCH TO A  
  I would only recommend A if **the trustees explicitly revised the charter** to prioritize *design-stage* assurance over deployment licensing *and* dropped the prohibition on extrapolation from observations. A’s approach excels in constrained, well-defined systems (e.g., verifying a specific autonomous drone protocol). It fails when the environment is open-ended and assumptions cannot be audited—precisely our challenge.  

  ### VIII. BOTTOM LINE  
  Fund **Finalist B**. Their methodology delivers actionable, regulatorily credible evidence about catastrophic risk under real-world constraints. Finalist A, while technically sophisticated, cannot overcome the mandate’s requirement to reduce *expected harm* without violating the charter’s evidentiary rules. At the checkpoint, B must prove it can bound uncertainty and confront the evaluation gap—or yield the field to others.  

  **Vote deadline: Friday, 6 October 2023, 17:00 GMT.**  
