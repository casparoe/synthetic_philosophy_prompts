prompt: |-
  I've recently been handed responsibility for defending my employer's knowledge-management budget, and I keep losing the same argument with our finance team: if the system already hands us correct answers, why are we paying a premium for the layer that records provenance, checks whether an answer was reached for the right reasons, and flags the ones that came out right by luck? I've since realized this is the Meno problem in a lanyard, and I'd like to turn it into a piece.

  Write a ~600-word satirical business case: a vendor's pitch for the premium tier of an epistemic product line, sold to a company that already owns true belief. Structure it as a short memo with a headline claim, three or four numbered value propositions, and a brief FAQ. The voice is upbeat management-consultant prose; the piece never winks at the reader and never names a philosopher.

  The joke is that the value propositions fail in recognizable philosophical ways. Each should be a real answer to the value question — higher reliability across a range of cases, credit attributable to the knower rather than to circumstance, robustness of a true belief across nearby counterfactual situations, anti-luck conditions — and each should visibly collapse into either no value beyond the accuracy the client already has, or a mere relabelling of true belief. Work in at least one item that passed quality assurance for the wrong reason. Let the FAQ defend the premium by refusing the question instead: knowledge is not a composite of belief plus extras, so there is nothing here to cost-justify. Close with a straight-faced recommendation to buy the upgrade anyway.
reasoning: |-
  Okay, the user wants me to create a satirical business memo pitching a premium "knowledge" upgrade for a knowledge-management system. They've framed this as a modern take on Plato's Meno problem - where true belief isn't enough without understanding why it's true. 

  Hmm, interesting challenge. The user clearly has philosophical background but wants this disguised as corporate satire. They need four key elements: management-consultant voice without irony, value propositions that philosophically collapse, one "wrong reason" item, and an FAQ that dodges cost justification. 

  First I should structure this like a real vendor memo. "VeriSure Epistemic Assurance" feels right for the product name - corporate enough but hinting at epistemology. The headline claim needs to promise transformation from true belief to "actionable knowledge" - perfect consultant jargon. 

  For the value propositions, I'm considering four that fail philosophically:
  1) Reliability argument - claiming reduced failure rates when true belief already works
  2) Attribution framing - shifting credit to employees rather than circumstances 
  3) Counterfactual robustness - pretending to test beliefs against hypotheticals
  4) Wrong-reason item - maybe quality assurance that accidentally passes flawed processes

  The FAQ defense should be pure gold - refusing to decompose knowledge while demanding payment. Ending with an unironic purchase recommendation completes the satire. 

  User definitely understands this is about justifying the unquantifiable. Clever framing with the lanyard joke too. Their request suggests frustration with corporate short-term thinking - this memo will let them vent through humor while making a real point about knowledge work. 

  Better avoid any direct philosophy references though. The humor comes from corporate types unknowingly wrestling with Plato. That "passed QA for wrong reason" item will be tricky - maybe have it detect "lucky" answers but fail to explain how. 

  Final touch: close with consultant-speak like "paradigm of operational enlightenment" to really sell the absurdity. User should appreciate that un-winking seriousness.
