  It looks like you've hit on a classic tension in Evidential Decision Theory (EDT) when dealing with prediction scenarios like Death in Damascus. Your reasoning is solid, but the conclusion that EDT "never gets to deliver a verdict at all" is too strong and arises from overgeneralizing the Damascus case to all decisions. Let's break this down step by step, using your numbered points as a framework. I'll explain why dropping (4) is the right move, why it resolves the problem, and what it costs you. (Spoiler: it doesn't ruin EDT, and it preserves what you want to keep.)

  ### Recap of Your Points
  - **(1)** You want to keep the core EDT formula: \( \text{EU}(A) = \sum_s P(s \mid A) \times U(A \& s) \). This is the definition, and it's non-negotiable for EDT.
  - **(2)** You want to keep the Death in Damascus calculation as you described it: with a 90% accurate predictor, EDT assigns an EU of 1 to staying (because \( P(\text{Death in Damascus} \mid \text{stay}) = 0.9 \), leading to 0.9 × 0 + 0.1 × 10 = 1) and 9 to fleeing from the conditional perspective of staying (and vice versa when conditioning on fleeing). This makes neither act ratifiable (each seems worse than the alternative when conditioned upon).
  - **(3)** You note that the exact 90% isn't crucial—any better-than-chance correlation between act and state causes the same ratifiability issue.
  - **(4)** You worry that every real choice has such a correlation because your act "comes out of your character and situation," which are "tangled up with how the world is" (e.g., carrying an umbrella is evidence for rain).
  - **(5)** Thus, you fear no act is ever ratifiable, and EDT never delivers a verdict.
  - **(6)** But this can't be right because EDT handles cases like the umbrella decision just fine, and EDT proponents (e.g., in Newcomb-style problems) clearly think it works in many situations.

  Your study partner suggests dropping (4), and I agree—this is the cleanest exit. Dropping (4) means accepting that not all real choices have *irreducible* act-state correlation. Instead, in many cases (like the umbrella case), there is background evidence (e.g., a weather forecast) that "screens off" the correlation, allowing EDT to work smoothly. In Death in Damascus, no such screen exists, which is why EDT struggles with ratifiability there. But this doesn't doom EDT everywhere—it just highlights that prediction-based decisions are special cases.

  Below, I'll explain why dropping (4) resolves the dilemma, address why it doesn't work the same way in Damascus as in the umbrella case, and clarify what EDT does in cases with and without screens. I'll also touch on what this costs you (it's minimal for most EDT proponents).

  ### Why Dropping (4) Resolves the Problem
  **(4) claims that every real decision has problematic act-state correlation.** But this isn't true. In reality, many decisions involve observable evidence that *screens off* the correlation, meaning that conditioning on that evidence makes the act and state probabilistically independent. Formally, screening off means that for some evidence \( E \), \( P(s \mid E, A) = P(s \mid E) \)—the action \( A \) provides no additional evidence about the state \( s \) once you know \( E \). This breaks the act-state dependency that causes ratifiability issues in EDT.

  - **Example: Umbrella case with a forecast.**  
    Suppose you have a weather forecast \( F \) that is 90% accurate. States: rain (\( R \)) or no rain (\( N \)). Actions: carry umbrella (\( C \)) or not (\( NC \)). Utilities:  
    - \( U(C, R) = 10 \) (dry), \( U(C, N) = 5 \) (unnecessary burden),  
    - \( U(NC, R) = 0 \) (wet), \( U(NC, N) = 10 \) (no burden).  
    Crucially, the forecast \( F \) screens off the correlation: your action doesn't provide extra evidence about rain because \( P(R \mid F, C) = P(R \mid F) \) and \( P(R \mid F, NC) = P(R \mid F) \). For instance:  
    - If \( F \) says "rain" with \( P(R \mid F) = 0.9 \), then:
      - \( \text{EU}(C \mid F) = P(R \mid F) \times 10 + P(N \mid F) \times 5 = 0.9 \times 10 + 0.1 \times 5 = 9.5 \)
      - \( \text{EU}(NC \mid F) = P(R \mid F) \times 0 + P(N \mid F) \times 10 = 0.9 \times 0 + 0.1 \times 10 = 1 \)
    - EDT recommends carrying the umbrella (since 9.5 > 1), and this is ratifiable: conditioning on \( C \), \( \text{EU}(C) \) doesn't change because \( P(R \mid F, C) \) is still 0.9. No ratifiability problem arises because the act doesn't "twist" the state probabilities when screened by \( F \).

  - **Death in Damascus lacks a screen.**  
    Here, the state (Death's location) depends on Death's prediction of your action, and you have no access to what Death predicted—you only know the prediction *mechanism* (90% accuracy). So there's no equivalent to \( F \) to condition on:  
    - \( P(\text{Death in Damascus} \mid \text{stay}) = 0.9 \), making \( \text{EU}(\text{stay}) = 1 \) and \( \text{EU}(\text{flee} \mid \text{stay}) = 9 \) (as you calculated).  
    - Similarly, \( P(\text{Death in Damascus} \mid \text{flee}) = 0.1 \), making \( \text{EU}(\text{flee}) = 1 \) and \( \text{EU}(\text{stay} \mid \text{flee}) = 9 \).  
    Without a screen, EDT assigns equal EU to both acts (1 each), so it delivers a verdict of indifference. But neither act is ratifiable because conditioning on one makes the other look better. This is a feature of prediction-based decisions where the agent lacks the predictor's output as evidence.

  **Why (4) is the issue:** Your step (4) assumes that real decisions always have irreducible correlation, like in Damascus. But in reality, many decisions (e.g., the umbrella) have screens (e.g., forecasts, data, or prior observations) that break this correlation. Dropping (4) means acknowledging that screens are common and that EDT works fine when they exist. In cases without screens (like Damascus), EDT still delivers a verdict—it just might not be ratifiable, which is acceptable to many EDT proponents.

  ### Why This Doesn't Work the Same in Damascus as in the Umbrella Case
  You asked: "Why doesn't the screening move work in Damascus?" The answer is that in Damascus, there *could* be a screen, but in the standard setup, it's not available.

  - **If you had Death's prediction as evidence, screening would work:**  
    Suppose Death's prediction is revealed to you (e.g., "Death predicted you will stay"). Then conditioning on this prediction screens off the correlation:  
    - If Death predicted "stay," then \( P(\text{Death in Damascus} \mid \text{prediction}) = 1 \), so:
      - \( \text{EU}(\text{stay}) = 1 \times 0 + 0 \times 10 = 0 \)
      - \( \text{EU}(\text{flee}) = 1 \times 10 + 0 \times 0 = 10 \)  
      EDT recommends fleeing, and this is ratifiable (no conflict when conditioning on actions).
    - Similarly, if Death predicted "flee," EDT recommends staying.  
    But in the classic Death in Damascus, you *don't* know the prediction—you only know the accuracy. So there's no screen to condition on, and the act-state correlation remains problematic.

  - **Why the umbrella case is different:**  
    In the umbrella decision, the forecast is typically part of the agent's knowledge before acting. In Death in Damascus, the predictor's output is not. This asymmetry explains why screening is feasible in one but not the other. Real-world decisions often resemble the umbrella case (we have data or evidence), while prediction-based problems like Damascus are designed to lack screens, making them edge cases for EDT.

  ### What About (3) and (5)?
  Dropping (4) resolves the conflict with (6), but let's confirm why (3) and (5) don't need to be dropped:
  - **(3) is correct but not the core problem:** You're right that any better-than-chance correlation can cause ratifiability issues *in the absence of a screen*. But with a screen, the correlation is neutralized, so this doesn't generalize to all decisions. (3) doesn't force (5) because screens exist.
  - **(5) is overstated:** EDT *does* deliver verdicts even without screens. In symmetric Death in Damascus, it says both acts are equally good (EU=1), so you can choose arbitrarily. In asymmetric cases (e.g., if Death is 90% accurate when you stay but 70% when you flee), EDT might clearly recommend one act (e.g., flee with EU=3 vs. stay with EU=1). The verdict is delivered—it's just not ratifiable. Ratifiability is a separate desideratum, not a requirement for EDT to function. In cases with screens (umbrella), EDT delivers ratifiable verdicts.

  ### What Dropping (4) Costs You
  Dropping (4) comes with a cost, but it's manageable and often seen as acceptable by EDT proponents:
  - **The cost:** You must concede that in rare, screen-less decisions—typically artificial prediction scenarios like Death in Damascus—EDT may produce non-ratifiable verdicts. This is because EDT relies on conditional probabilities, and without evidence to screen off the act-state correlation, the act "tells you something" about the state that leads to instability. In such cases, EDT might seem less intuitive or satisfactory than alternatives like Causal Decision Theory (CDT), which handles Death in Damascus better by ignoring the evidential link (e.g., using fixed state probabilities).
    
  - **Why it's worth it:** For EDT proponents, this cost is low because:
    - Real-world decisions often have screens (e.g., medical choices with test results, business decisions with market data). EDT excels here.
    - Even in screen-less cases, EDT still provides a verdict (e.g., indifference in Damascus), so it doesn't "go silent." Proponents argue that ratifiability is a secondary issue—EDT's goal is to maximize expected utility based on evidence, not self-consistency under conditioning.
    - If you reject this, the alternatives are worse: dropping (3) would require denying that any correlation causes problems (but it does in Damascus), and dropping (5) would mean ignoring EDT's failures in prediction cases (which you don't want). Dropping (4) preserves EDT's strengths while containing its weaknesses.

  ### Final Advice
  Stick with your study partner's suggestion: drop (4). This keeps EDT viable for most decisions (like the umbrella) by recognizing that screens are common, while acknowledging that prediction scenarios like Death in Damascus are special cases where ratifiability fails. If this feels unsatisfying, remember that many decision theorists see Death in Damascus as an argument for CDT or hybrid approaches—but if you're committed to EDT, this is a standard defense.

  To test this, consider modifying Death in Damascus to include a screen: if you learn Death's prediction, EDT works perfectly. This reinforces that the problem isn't EDT itself, but the lack of evidence in the setup. For your seminar, you could present it as:
  - EDT works well with screens (umbrella).
  - Without screens, it delivers verdicts but may lack ratifiability (Damascus).
  - This doesn't generalize because screens are ubiquitous in real life. 

