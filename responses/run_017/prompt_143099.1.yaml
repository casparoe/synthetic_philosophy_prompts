prompt: |-
  I write about science and ideas for a living, and last month I was at a small invitation-only workshop on decision theory and AI where this argument broke out at dinner. I wasn't a participant and I don't have a horse in this race, but I might want to use some of it in a piece and I'd like to know who's actually right before I do. Names changed, and I quoted neither of them.

  The talk that evening was about the updateless decision theories that came out of the rationalist / AI-alignment world: the rough idea that you should choose a whole policy from behind a veil of ignorance about which situation you'll end up in, rather than deciding case by case on causal grounds. The speaker used the famous Omega case, the one where a near-perfect predictor flips a fair coin and, if it comes up tails, asks you for a hundred dollars — while if it had come up heads it would have handed you ten thousand, but only if it predicted you'd have paid in the tails branch. Updateless decision theory says pay. The speaker said this was obviously right, the room was visibly split, and then Ravi (an ML researcher) and Nina (a philosopher) went at it for about forty minutes over the bread basket. Here's roughly how it went.

  (1) Ravi: The standard case makes updatelessness look exotic, but it isn't. Try my variant instead. Omega makes a perfect simulation of you, puts it in a room subjectively identical to yours, asks both of you for a hundred dollars at the same time, and hands the real you ten thousand iff the simulation says yes. Neither of you can tell which one you are. Now a plain causal decision theorist who updates on nothing more than self-locating uncertainty gets the same answer: if I might be the simulation, then my saying yes causes the real one to get the ten thousand. That's an ordinary causal lever. So the appearance of acausal reasoning in the original case is an artifact of how that story is told. Updatelessness is just causal reasoning plus not knowing which copy you are.

  (2) Nina: You've built a different problem. Your case contains two things the original doesn't: a decision-maker whose act is causally efficacious, and a beneficiary who might be her. That's a two-person coordination problem with a lever attached. The original case has no lever at all — Omega's prediction is already in the bank, and nothing you do now changes the heads branch. Your reconstruction doesn't touch the hard case, it relocates it. And here's the test: if Omega labels the rooms, so the simulation knows she's the simulation, then on your own account there's no reason for her to pay. She gets nothing either way and the ten thousand goes to somebody else. Your reduction collapses exactly where the original difficulty lives, unless you stipulate that the copies care about each other. In which case what's really doing the work is cross-copy concern, not causality.

  (3) Ravi: Fine, but that's not a retreat, it's the point. The original case also requires you to care about the version of you in the heads branch. Nobody thinks paying is justified if you only count dollars that land in the branch you're actually standing in. So UDT always involves weighting outcomes for versions of you that don't exist, and your "collapse" is just that same commitment showing up somewhere it's easier to see. And once you've granted it, the simulation case shows the mechanism is entirely ordinary: causal leverage plus self-locating uncertainty.

  (4) Nina: Then the puzzle was never a puzzle about decision theory. It's a question in moral psychology about how much to discount your merely possible selves, wearing a formalism as a disguise. And the formalism hides a second, worse problem: how much weight each branch gets. Take the original case but make the coin heavily biased — heads one time in ten thousand. UDT now says don't pay, because the ten-thousand branch is weighted by its probability and it isn't worth a hundred dollars in the other nine thousand nine hundred and ninety-nine. But nothing about my concern for the heads-branch version of me changed. So all the action is in the weights, and I want to know why the prior probability of a branch is the right weight for concern about it. Why not weight by similarity to me? Why not weight every version equally?

  (5) Ravi: The prior is forced. You evaluate a policy by its expected return across the situations it might land you in; that just is expected utility. If you weight branches equally regardless of how unlikely they are, you'll pay a hundred dollars for a one-in-ten-thousand shot at ten thousand, which is a losing trade, and in a world with predictors you get cleaned out. Every other weighting is exploitable.

  (6) Nina: Exploitable relative to what? I'm not playing a repeated game against an ensemble of myself. The only money that changes hands is in the branch I'm in. You keep adding up branches I know didn't happen, announcing that the total is negative, and treating that as a reason for me — but I never agreed to maximize a total. I agreed to be a person in a room being asked for a hundred dollars.

  (7) Ravi: But the person in the room benefits from having been an adder-upper, because Omega conditions on the policy. Even the purest this-branch-only self-interester has reason to want to have been built as someone who pays. That's precisely why the answer is pay and not "oh, then it's a free choice."

  (8) Nina: Has reason to want to have been is a reason to wish you'd been manufactured differently, not a reason to act. You can only convert it into a reason to act if deciding now is somehow evidence about, or partly constitutive of, the algorithm Omega predicted. And if that's your move, you're doing evidential decision theory, and you owe me an answer about the smoking lesion, where the correlation between the act and the outcome is perfectly real but there's no reason at all to think the act makes a difference.

  (9) Ravi: Not the same. UDT runs counterfactuals on the output of your decision algorithm while holding the causal and logical facts fixed. In the lesion case the correlation runs through a common cause, the gene, so varying your output doesn't move your cancer risk and UDT says smoke if you enjoy it. In the mugging the correlation runs through the prediction itself, so varying your output does move the payout. That's exactly the distinction evidential decision theory can't see.

  Then the check came and they dropped it. I definately can't tell who won, and there's one thing neither of them addressed that I noticed on the walk back to my hotel: in Ravi's variant, once Omega tells you which room you're in, the right answers come apart — the simulation should pay and the real one shouldn't — and that felt like it broke something in his argument, though I couldn't say what.

  Please go through the nine moves and tell me who's right about what at each step, not just who wins overall: rate each move from clearly mistaken to clearly right, say briefly why, and then tell me what both of them are missing and whether the room-labels point I stumbled onto is the real objection or just a confusion.
reasoning: |-
  Okay, let me try to unpack this fascinating dinner debate about decision theory. The user witnessed a heated argument between Ravi (ML researcher) and Nina (philosopher) about updateless decision theory (UDT) and wants to understand who was right at each step. 

  First, I need to reconstruct the core disagreement. Ravi seems to be defending UDT by arguing it's reducible to causal reasoning plus self-locating uncertainty, using his simulation variant. Nina counters that this avoids the hard part of the original problem - the acausal aspect - and that UDT smuggles in controversial assumptions about caring about possible selves and probability weights.

  Looking at their moves:
  In move (1), Ravi's simulation analogy is clever but I notice it adds causal levers that don't exist in the original Omega problem. When Nina points this out in (2), she's spot-on - labeling the rooms collapses Ravi's argument because the simulation would rationally defect. 

  Move (3) reveals Ravi's real position: UDT requires caring about counterfactual selves. But as Nina sharply observes in (4), this shifts the debate to moral psychology and exposes the arbitrary-looking probability weights in biased cases. Ravi's "exploitability" argument in (5) feels weak because, as Nina retorts in (6), we don't actually sum utilities across branches in real life.

  The hotel room-labeling point the user noticed is actually crucial - it demonstrates the fracture in Ravi's analogy. When identities are known, the simulation has no incentive to pay, which parallels why UDT feels counterintuitive: we're asked to care about branches we know aren't ours.

  Neither addressed that UDT's "policy" approach only works if we accept two controversial premises: that possible selves deserve moral weight, and that probability is the right weighting metric. The user's instinct about the labeled rooms points directly to this - it's not a confusion but the core issue made visible.
answer: |-
  Here's a breakdown of each move, assessing correctness and core issues, followed by the unresolved elements and your observation:

  ### Move-by-Move Analysis
  1. **Ravi (Simulation Variant)**  
     *Rating: Partially Correct but Misleading*  
     Ravi correctly shows that *self-locating uncertainty* + causal leverage replicates UDT's "pay" verdict. However, he misrepresents the original problem. The original Omega scenario has **no causal link** between "you in tails" and "you in heads" – the prediction is fixed. His variant adds artificial causal structure (the simulation’s decision *causes* the real you’s payout), sidestepping the core puzzle: **acausal influence**. Nina’s rebuttal is justified.

  2. **Nina (Critique of the Variant)**  
     *Rating: Clearly Right*  
     Nina identifies the flaw: Ravi’s variant isn’t equivalent. Adding labels ("you’re the simulation") makes cooperation irrational for the simulation, while UDT still says "pay" in the original even *without* uncertainty. This exposes that Ravi’s argument relies on hidden premises (causal links or altruism) absent in the original. Her "cross-copy concern" point is incisive.

  3. **Ravi (UDT Requires Caring About Counterfactual Selves)**  
     *Rating: Correct but Incomplete*  
     Ravi is right that UDT *always* weights counterfactual branches (possible selves), not just your current branch. This *is* the defining feature of UDT. However, he implies this is unproblematic ("once you’ve granted it..."), but Nina’s next move shows the weighting itself is contentious.

  4. **Navi (Problem of Branch Weights)**  
     *Rating: Clearly Right*  
     Nina nails UDT’s critical vulnerability: **Why weight branches by prior probability?** Biasing the coin exposes that UDT’s verdict hinges entirely on this arbitrary-seeming choice. Alternatives (equal weighting, similarity) are plausible, and UDT offers no principled defense beyond "exploitability," which she correctly challenges next.

  5. **Ravi (Prior as Forced by Expected Utility)**  
     *Rating: Weak/Circular*  
     Ravi appeals to standard expected utility (EU), but EU *assumes* probability-weighted outcomes. In UDT, "situations you might land in" include branches that **didn’t happen** and aren’t causally connected to you. Nina is right to question why *this* aggregate matters. His "exploitability" claim only holds if you accept EU across branches – which is the very point in dispute.

  6. **Nina (Rejecting the Aggregate)**  
     *Rating: Valid Challenge*  
     Nina correctly argues that "exploitability" is question-begging. If only your actual branch matters, losing $100 in *this* branch to benefit a non-actual branch *is* irrational. UDT’s "total" is metaphysically dubious if branches are ontologically separate. Her point: **No self-interested agent in their branch has reason to care about the sum.**

  7. **Ravi ("Wanting to Have Been" an Adder-Upper)**  
     *Rating: Correct for UDT but Ignores the Agent’s Perspective*  
     Ravi describes UDT’s core justification: pre-committing to a policy gets better outcomes *because Omega conditions on it*. But Nina’s next move is correct – this is a *preference about your past algorithm*, not a reason for *your current self* to act unless your act reveals/constitutes that algorithm.

  8. **Nina (Link to Evidential DT & Smoking Lesion)**  
     *Rating: Partially Right*  
     Nina is right that if your act *now* is evidence of the policy Omega predicted, you’re in Evidential Decision Theory (EDT) territory. Her Smoking Lesion example is valid: EDT says "don’t smoke" due to correlation, even if smoking doesn’t cause cancer. However, Ravi’s UDT reply is strong: UDT *can* distinguish cases by holding fixed logical/causal dependencies (e.g., the prediction mechanism).

  9. **Ravi (UDT vs. EDT Distinction)**  
     *Rating: Clearly Right*  
     Ravi correctly notes UDT evaluates counterfactual *algorithm outputs*, not acts-as-evidence. UDT would say "smoke" in the Lesion (no causal/logical link from decision to cancer) but "pay" in the mugging (the prediction links decision to payout). This *is* a meaningful advance over EDT.

  ### Who "Won"? 
  Nina lands more critical blows. She exposes that:  
  - Ravi’s simulation variant doesn’t address the acausal core.  
  - UDT’s branch-weighting is arbitrary and lacks justification for the agent-in-a-branch.  
  - The "pre-commitment" justification doesn’t give *current-you* a reason to act.  

  Ravi successfully defends UDT’s technical coherence (it handles the Lesion correctly) and its consistency. But he doesn’t resolve Nina’s deeper objections about **why a branch-bound agent should care about UDT’s aggregate**.

  ### What Both Missed
  1. **The Central Conflict:** UDT isn’t a "decision theory" for agents in time. It’s a **tool for designing agents/policies pre-emptively** in multiverse scenarios. It answers "What algorithm should I install?" not "What should I do now?" Nina’s "moral psychology" charge hits home: UDT assumes you *already* value the aggregate.  
  2. **The Weighting Problem:** Neither justifies why *probability* is the right weight. Alternatives (e.g., "measure" in Everettian quantum mechanics) exist. UDT implicitly assumes a **utilitarian aggregation** over possible selves, which is normative, not purely rational.

  ### Your Room-Labeling Observation: Real Objection
  **This is a profound point and the core issue.**  
  - In Ravi’s variant, **labeling the rooms destroys cooperation**: the simulation knows paying won’t benefit *it*. Yet in the *original* Omega problem, even knowing "I’m in the tails branch" doesn’t change UDT’s "pay" verdict.  
  - **Why?** Because UDT evaluates the *policy* ("pay if asked") *before* knowing the branch. The labeled-room variant breaks the symmetry UDT relies on. This shows:  
    - Ravi’s simulation **only works under symmetry/ignorance**.  
    - The original UDT **requires caring about counterfactual outcomes** (the heads branch) *even when you know they aren’t yours*.  

  Your observation highlights the heart of the debate: UDT **compels you to sacrifice your branch’s interests for counterfactual branches**, which feels irrational to the branch-bound agent. Nina’s critique is validated; Ravi’s "reduction" fails under asymmetry. The real disagreement is ethical: **Do possible selves deserve moral weight?** UDT says yes; causal decision theorists (and your intuitions) say no.  

  **Conclusion**: Nina wins on exposing UDT’s normative assumptions and the branch-weighting problem. Ravi wins on UDT’s formal consistency and its advantage over EDT. Your labeled-rooms point is the knockout punch against Ravi’s simulation analogy – it perfectly crystallizes why UDT feels alien to embodied agents. For your piece, frame UDT as a *design principle for multiverse agents*, not a guide for human decisions.
