  We have to be careful.

  Alternatively, we might not be able to create a cycle with purely self-regarding rights.

  This suggests that the busybody objection might be answered by restricting rights to self-regarding pairs, and then the paradox disappears.

  But in the original Sen example, the rights are not necessarily self-regarding.

  In the novel, the scene might work with the first setup, and the busybody objection can be addressed by emphasizing the altruism and the nature of the task.

