  Bob:
  - On the pair (JJ, A): he has JJ > A -> so he will choose to go if Alice is going.

  Now, social ranking:

  - Alice's decisiveness over (JJ, B): she prefers JJ to B -> so JJ > B.
  - Bob's decisiveness over (JJ, A): he prefers JJ to A -> so JJ > A.

  Also, both prefer JJ to everything else? Not necessarily.

  Alice: JJ > A > P > B -> so she prefers JJ to all.
  Bob: JJ > B > P > A -> so he prefers JJ to all.

  So by Pareto, we have JJ > A, JJ > B, JJ > P.

