  Does it matter that we want a single outcome rather than a full ordering? In the context of choosing one outcome, a cycle means there is no Condorcet winner, and any outcome might be blocked. But more severely, the conditions force an empty choice set.

  Now, what is carrying the case? Indivisibility: the task must be done exactly once, and it can be done by one or both. This forces the outcomes to be mutually exclusive.

