  Another feature: the assignment of rights. In this case, Alice's right over (A, B) might be seen as not purely self-regarding because outcome B requires Bob to go. But if we try to restrict rights to purely self-regarding preferences, then we might avoid the paradox. However, it's hard to define purely self-regarding in a social setting.

