    - **Trustworthy source?** Partial (mechanism verified, intent not). → \( p_{\text{cap}} \) might apply, but adversarial discounting dominates.  
    - **Catastrophe?** Yes (suffering scale), but irrelevant if \( p \approx 0 \).  
  - **Verdict**: Reject. Paying $5,000 has no expected benefit.  
  - **Why it aligns**: Your gut likely says "this is a dressed-up Mugger." Provenance dominates mechanism verification.  

  ---

  ### **Overturned Verdicts and Limitations**  
  - **Overturns**: None. TWEU-CA matches all your verdicts:  
    - **Saving 4 lives**: Rejecting is consistent under linear utility (if $2M is "too much" for 4 lives).  
    - **Portfolio vs. sequential**: Aggregation explains the difference.  
  - **Limitations**:  
    - **Sequential bets**: Math says accepting all is identical to the portfolio, but you reject sequentially. TWEU-CA accommodates this via "lack of aggregation" (psychologically plausible: humans evaluate isolated acts differently).  
    - **Utility bounds**: No hard cap, avoiding "calmness" about large losses. Catastrophe multiplier is finite but contextually large.  

  ---

  ### **Discriminating Case for Top Candidates**  
  Suppose your top candidates are **TWEU-CA** vs. **Bounded Utility (BU)**. Consider:  
  - **Case**: A *non-adversarial, data-tested* model shows a 1-in-\(10^{20}\) chance of an asteroid causing \(10^{40}\) suffering units. Prevention costs $10.  
    - **TWEU-CA**: Trusted source → no \( p = 0 \). But \( p = 10^{-20} < p_{\text{min}} \) (e.g., \(10^{-10}\)) → reject.  
    - **BU**: Accept if \( u(\text{suffering}) \) is unbounded; reject if bounded (e.g., \( u \leq 10^{30} \)).  
  - **Your probable verdict**: Reject (similar to your "meh" for \(10^{-12}\)). Favors TWEU-CA.  
  - **Why it discriminates**: BU hinges on an arbitrary bound; TWEU-CA rejects due to untestably tiny \( p \), preserving adversarial/non-adversarial distinction.  

