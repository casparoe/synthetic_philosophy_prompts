  ### **Field Consensus and My View**  
  - **Settled Math**:  
    - EUM requires consistency in portfolios vs. sequential bets (your verdict violates this; it’s irrational under EUM).  
    - Probabilities from adversarial sources can be discounted to 0 if they’re "not even wrong" (no testable claim).  
  - **Contested Issues**:  
