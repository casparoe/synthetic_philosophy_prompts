  ### **Synthesizing a Unified Principle**  
  Your verdicts suggest:  
  1. **Source provenance matters**: Adversarial stakes are discounted to \( p \approx 0 \).  
  2. **Certainty has diminishing returns**: Saving 4 certain lives feels less urgent than a tiny extinction risk (due to catastrophe emphasis).  
  3. **Tiny probabilities need aggregation**: A portfolio of tiny bets is acceptable; isolated ones are not.  

  Thus, I propose:  

  #### **Trust-Weighted Expected Utility with Catastrophe Aversion (TWEU-CA)**  
  - **Rule**:  
    1. **Adversarial Discounting**: If the stake \( s \) is chosen by an agent who (a) knows your decision rule and (b) selects \( s \) to force acceptance, set \( p = 0 \).  
    2. **Catastrophe Emphasis**: For outcomes involving existential/catastrophic harm (e.g., human extinction), apply a utility multiplier \( k > 1 \) (e.g., \( k = 1000 \)) to the stake.  
    3. **Probability Aggregation**: For identical, independent bets with tiny \( p \), evaluate the portfolio as a single "meta-bet" with probability \( 1 - (1 - p)^n \) and total stake \( s \cdot n \). Ignore isolated bets if \( p < p_{\text{min}} \) (e.g., \( 10^{-10} \)).  
    4. **Trust Threshold**: If \( p \) comes from a non-adversarial, data-tested model (e.g., physics), use it directly. Else, cap \( p \) at \( p_{\text{cap}} \) (e.g., \( 10^{-12} \)) based on source reliability.  

  - **How It Captures Your Verdicts**:  
    - **Mugger**: Adversarial discounting → \( p = 0 \) → reject.  
    - **Extinction risk**: Non-adversarial source + catastrophe emphasis → accept.  
    - **Portfolio**: Aggregation makes \( p_{\text{effective}} \) high → accept. Sequential bets lack aggregation → reject.  
    - **Saving 4 lives**: No catastrophe multiplier → valued linearly. At $500k/life (plausible for a retiree), $2M for 4 lives has negative net utility → reject (matches your guilt but stands).  
    - **Tiny bet ($1 for \(10^{15}\) lives)**: \( p = 10^{-12} < p_{\text{min}} \) → reject.  

