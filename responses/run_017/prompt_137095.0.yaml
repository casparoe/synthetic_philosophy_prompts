  | Same bets, sequential | No each time | ✗ | ~ | ✗ | ✓ | - | ~ |  

  **Key**:  
  - ✓ = Matches verdict; ✗ = Contradicts; ~ = Partial/contextual match; - = Irrelevant.  
  1. Diminishing marginal utility explains $1M choice (settled).  
  2. PT might reject if threshold e.g., \( p < 10^{-9} \), but you accept \( p = 10^{-9} \).  
