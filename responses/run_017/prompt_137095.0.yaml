  ### Step-by-Step Analysis and Proposed Principle  
  I'll start by brainstorming candidate principles based on your verdicts, then refine them into a coherent rule. Your core insight—that "adversarially selected stakes" should be discounted—is central, but it needs integration with other intuitions (e.g., diminishing returns for certainty, portfolio effects). Below, I outline key principles, test them against your cases, identify tensions, and finally state a unified rule. I'll flag settled math, contested ideas, and my own stance.

  ---

  ### **Candidate Principles Brainstorm**  
  1. **Expected Utility Maximization (EUM)**:  
     - *Idea*: Maximize \( \sum p_i \cdot u(x_i) \), where \( p_i \) is probability and \( u \) is utility.  
     - *Problem*: Fails Pascal's Mugger (paying $5 for \(10^{100}\) stakes) and your "meh" reaction to tiny probabilities. Ignores source credibility.  

  2. **Bounded Utility (BU)**:  
     - *Idea*: Cap \( u(x) \) (e.g., \( u(\text{life}) \leq 10^{15} \)). Solves Mugger but makes you "weirdly calm" about large certain losses (e.g., rejecting $2M to save 4 lives feels worse under BU).  

  3. **Probability Threshold (PT)**:  
     - *Idea*: Ignore probabilities below a minimum (e.g., \( p < 10^{-9} \)). Explains declining single tiny bets.  
     - *Problem*: Doesn't handle adversarial sources or portfolio effects.  

  4. **Adversarial Discounting (AD)**:  
     - *Idea*: Set \( p = 0 \) for stakes chosen by an adversary to exploit your decision rule. Matches your Mugger verdicts.  
     - *Problem*: Silent on non-adversarial cases (e.g., extinction risk) and portfolios.  

  5. **Catastrophe Emphasis (CE)**:  
     - *Idea*: Weight catastrophic outcomes (e.g., extinction) more heavily than linear utility implies. Explains yes to extinction risk despite low expected lives saved.  

  6. **Risk-Weighted Expected Utility (RWEU)**:  
     - *Idea*: Transform probabilities to overweight worst outcomes (e.g., rank-dependent utility). Explains preference for certainty in $1M case.  
     - *Problem*: Doesn't address source provenance.  

  ---

  ### **Testing Principles Against Your Verdicts**  
  | Case | Your Verdict | EUM | BU | PT | AD | CE | RWEU |  
  |------|--------------|-----|----|----|----|----|------|  
  | Coin flip for $220 vs. $100 | Take flip | ✓ | ✓ | ✓ | ✓ | - | ✓ |  
  | Coin flip for $3M vs. $1M | Take $1M | ~¹ | ~¹ | ✓ | ✓ | - | ✓ |  
  | $10k for 1/100k extinction chance | Yes | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |  
  | $2M for 1-in-billion extinction risk | Yes | ✓ | ✓ | ~² | ✓ | ✓ | ✓ |  
  | $2M to save 4 lives (vs. extinction) | No | ✗³ | ~⁴ | - | - | ✗ | ~ |  
  | Pascal's Mugger ($5 for \(10^{30}\) suffering) | No | ✗ | ✓ | ✓ | ✓ | - | ~ |  
  | Escalating Mugger | No | ✗ | ✓ | ✓ | ✓ | - | ~ |  
  | $1 for 1/\(10^{12}\) chance to save \(10^{15}\) lives | No (single) | ✗ | ~⁵ | ✓ | ✓ | - | ~ |  
