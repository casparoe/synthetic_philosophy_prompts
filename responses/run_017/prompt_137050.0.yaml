answer: |-
  ### The Pattern, Restated (~120 words)  
  You observe a dualism in aquaculture welfare standards. For salmon, operations meticulously monitor health (veterinary plans, disease treatment, mortality rates, stocking density) yet slaughter via asphyxiation in ice slurry—a method illegal for mammals due to suffering. For shrimp, eyestalk ablation (crushing/cutting to induce spawning) is routine despite emerging recognition of decapod sentience. Welfare metrics focus solely on population-level data (FCR, oxygen, mortality), ignoring individual experience. Crucially, while disease intervention acknowledges suffering avoidance, slaughter methods disregard it. You note this contrasts with terrestrial livestock, where both confinement duration and slaughter pain are regulated. The paradox: practices presuppose sentience when treating illness but ignore it at death or mutilation.  

  ### The Implicit Theory (~300 words)  
  The pattern presupposes **"Welfare as Preventable Pathological Harm"**—a theory prioritizing measurable, disease-driven suffering over experiential states. Key tenets:  
  1.  **Suffering is Legitimate Only When Medically Quantifiable**: Treating bacterial outbreaks prevents observable pathology (e.g., lesions, sepsis), justifying intervention. Slaughter distress or ablation trauma lack equivalent biomarkers and are thus discounted.  
  2.  **Welfare Equals Biomass Viability**: Mortality, FCR, and oxygen levels track population survival and growth efficiency, not individual wellbeing. High survival signals "good welfare" regardless of slaughter suffering. This renders welfare a stock-level property.  
  3.  **Pain is Contingent on Economic Cost-Benefit**: Sentience research is funded (placating ethical scrutiny) but operationalized only where cheap (disease treatment). Costly interventions (humane slaughter for billions of fish) are avoided, implying an unspoken suffering-per-kilo threshold.  
  4.  **Cognitive Discounting**: Salmon/shrimp are presumed to lack complex memory or fear anticipation, reframing slaughter panic as "brief" (ignoring intensity) and chronic stress as "manageable" (if survival is high). Eyestalk ablation is excused as "functionally necessary" for production.  

  This theory isn't *denial* of sentience (Hypothesis 1) but **compartmentalization**: sentience matters only when it threatens productivity or invites scandal. Hypothesis 2 (brief-life discount) is partially adopted but inverted: chronic stress is downplayed *because* metrics ignore it, while acute slaughter suffering is dismissed as ephemeral. Hypothesis 3 (cost-threshold) is foundational—welfare is optimized until costs outweigh market tolerance.  

  ### What It Strictly Needs vs. Merely Fits (~250 words)  
  **Strictly Needs**:  
  - A definition of welfare reducible to **population vitality** (mortality, growth efficiency).  
  - **Pathology as suffering's sole validator**: Only medically diagnosible conditions (e.g., infections) demand mitigation.  
  - **Economic prioritization**: Welfare costs must align with commodity value (salmon > shrimp) and scale (e.g., stunning 10,000 pigs vs. 100,000 salmon).  

  **Merely Fits**:  
  - Sentience ambiguity: While sentience *assumption* is load-bearing for disease treatment (preventing "suffering"), the theory *functions* without it by substituting "biological stress" (e.g., cortisol) for subjective experience.  
  - Cognitive discounting: The theory doesn’t *require* animals to have short memories—only that their distress lacks political/economic weight.  
  - Hypocrisy: Compartmentalization (treat disease, ignore slaughter) is consistent *if* welfare is defined as "avoiding economically wasteful suffering." Disease kills fish, reducing yield; slaughter doesn’t. Eyestalk ablation boosts yield, outweighing ethical cost.  

  The core is **welfare-as-productivity**. Individual experience is irrelevant because metrics can’t capture it at scale, and suffering only "counts" when it threatens output.  

  ### Where It's Underdetermined (~200 words)  
  Rival theories could license identical practices:  
  - **Utilitarian Nihilism**: "All suffering is bad, but fish/shrimp suffering is trivial compared to human dietary benefits." This rejects sentience research but achieves the same outcome.  
  - **Behavioral Welfare**: If welfare is defined solely as natural behaviors (e.g., swimming, foraging), crowding might be condemned, but slaughter/ablation could still be ignored as "instantaneous." Current metrics (oxygen, density) could misalign.  
  - **Stochastic Welfare**: "Most individuals experience acceptable welfare if population metrics are good; outliers are irrelevant." This justifies ignoring slaughter suffering if mortality is low pre-harvest.  
  - **Regulatory Literalism**: Compliance focuses solely on audited metrics (e.g., mortality <5%). Slaughter/ablation aren’t measured, so they "don’t exist."  

  The pattern is equally consistent with **anthropocentrism** ("Human needs override animal pain") or **epistemic fatalism** ("We can’t measure individual welfare, so we default to survivability"). The key underdetermination: Does the industry *believe* its compartmentalization, or is it moral evasion? Both produce identical outcomes.  

  ### What Would Actually Have to Change (~250 words)  
  Eradicating this dualism requires dismantling its philosophical and economic foundations:  
  1.  **Redefine Welfare Metrics**: Integrate individual-level indicators (e.g., lesion scoring, behavioral monitoring via AI) and mandate slaughter/ablation assessments (e.g., stress hormones, neural activity).  
  2.  **Ethical Parity Standards**: Legally define "humane slaughter" for fish/shrimp equivalent to mammals (e.g., mandatory percussive/electrical stunning). Ban ablation, replacing it with hormonal or environmental induction.  
  3.  **Cost Internalization**: Subsidize humane tech (e.g., water-percussion stunners) or impose tariffs on non-compliant imports, neutralizing the cost-threshold.  
  4.  **Sentience-Driven Regulation**: Base rules on sentience evidence (e.g., UK Animal Welfare Sentience Act 2022). If salmon/shrimp feel pain, *all* suffering—chronic or acute—requires mitigation.  
  5.  **Shift Certification Priorities**: Make individual welfare (e.g., injury rates, slaughter loss of consciousness) core to schemes like ASC or BAP, not add-ons.  

  Without this, incremental tweaks (e.g., "kinder" crowding) won’t resolve the slaughter/ablation paradox. The economic premise—that suffering is tolerable below a cost-per-kilo threshold—must be rejected ethically and legally. Certification bodies would need authority to enforce stunning or ban ablation, overriding industry cost objections.  

  ### Bottom Line (~80 words)  
  The pattern presupposes **welfare as survivable productivity**: suffering matters only if it threatens biomass output or is medically legible. This theory strictly requires welfare to be a stock-level, pathology-avoidance metric, while conveniently exploiting sentience ambiguity and cost barriers. To align practice with ethical consistency—treating disease *and* preventing slaughter/ablation suffering—the industry must adopt individual experiential welfare as foundational, enforce humane slaughter equivalency, and abandon economic thresholds for suffering tolerance. Anything less perpetuates compartmentalized ethics.
