  For the user's piece, they need: 1) A clearer distinction between mathematical resolution (sample spaces) and philosophical debates 2) A nod to invariance arguments 3) Removal of that strained jury analogy. The Bayesian point can stand if framed more carefully - maybe noting that indifference requires symmetry justification.

