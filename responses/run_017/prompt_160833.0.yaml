  The jury analogy bothers me. Equating "random chord" ambiguity with Bayesian flat priors feels like comparing apples to orbital mechanics. One's about ill-defined experiments, the other about subjective ignorance. The leap to "flat priors can't be trusted" oversimplifies - objective Bayesians have counterarguments. 

