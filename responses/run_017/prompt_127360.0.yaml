prompt: |-
  I'm in a 4th-year seminar right now on measurement and machine learning (cross-listed between philosophy and the i-school), we spent most of last week on Goodhart's law, and I've realised the thing I keep noticing isn't quite it and I don't know what to call it.

  The pattern: you pick a proxy, you optimise against it, the proxy goes up and up, and the thing you actually cared about really does improve — genuinely, not just on paper. But the proxy quietly stops being able to tell apart the cases you now actually have. It hasn't stopped tracking the target in the coarse sense: if you plotted the whole history including the bad old days, it would still correlate fine. It's just that everything you now see is crammed into a narrow band near the top where the proxy has no resolution left, so a real improvement and a real collapse look identical, and the number you were relying on as an early-warning system has gone deaf.

  Three cases I keep coming back to:

  1. My sleep tracker's "sleep score". I actually fixed my sleep — same bedtime, dark room, nothing to drink after nine. Score went from around 70 to a steady 92–95. And now it's useless: it gives me 93 whether I wake up fine or wake up wrecked, and if something new started ruining my sleep I genuinely don't think the number would budge.
  2. My university's counselling service started being measured on time-to-first-response for intake. They got fast, the average dropped under an hour, good. Then the bottleneck moved to the second appointment, a real backlog built up, and the response-time number just sat there. Nobody gamed anything, and the number still measures exactly what it says it measures.
  3. Our course project: we fine-tuned a summariser against a learned reward model. Rewards climbed smoothly. The outputs weren't doing the obvious reward-hack stuff we'd been warned about — no all caps, no weird padding — they just stopped getting better in any way any of us could detect, while the number crept up. And we had no way to tell whether we were still improving or had quietly broken something.

  So: is there an established concept for this? So far everyone just says "that's Goodhart", but the flavors we went through in class don't seem to fit — nobody is adversarially gaming the measure, it isn't regression toward the mean from selecting on a noisy proxy, it isn't the extreme-tails version, and the causal link between proxy and target hasnt been broken by the optimisation. Someone said Campbell's law, someone said restriction of range, someone said it's just the base-rate problem (the outcome got rare, so the measure got noisy). All feel close, none feel right, and I also can't tell whether case 2 is even the same phenomenon as 1 and 3 or a different one where the bottleneck just moved downstream.

  I don't want a label on its own — I want to know what exactly the phenomenon is, how it differs from each of the nearby things, whether it's really a special case of one of them, and where its edges are. Is it still the same thing if the proxy lost resolution because you *selected* on it rather than optimised against it? What if the target hasn't changed at all? What if the proxy still has plenty of variance but the variance has stopped meaning anything? If there's no name, coin one and define it, including the cases where you'd say no, that's not an instance. And is there any way to tell from the numbers alone, before it bites you, that you've slid into it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a seminar on measurement and machine learning, focusing on Goodhart's law, but they've noticed a pattern that doesn't quite fit. The core issue is that optimizing a proxy improves the actual target initially, but then the proxy loses resolution at the high end. The examples given—sleep tracker, counseling service, ML model—all show this. The user wants to know if there's a term for this, how it differs from related concepts, and how to identify it.

  First, I need to recall Goodhart's law variants. The standard ones are gaming, regression, causal break, and extremization. But the user's cases don't involve gaming; the proxies still correlate with the target over the full range but lose discriminative power at the top. So it's not classic Goodhart. 

  Next, considering nearby concepts. Campbell's law involves corruption due to pressure, which isn't happening here. Restriction of range refers to reduced variance affecting correlation, but here correlation remains intact historically. Base rate fallacy involves rare outcomes, but the issue here is resolution, not rarity. 

  The key elements are: proxy optimization, genuine improvement, reduced variance at the high end, and loss of resolution. This seems like a distinct phenomenon. The user mentions "compressed performance space" and "ceiling resolution collapse," which are descriptive but maybe too jargony. "Resolution Saturation" feels intuitive, combining the saturation of the scale with loss of discriminative ability.

  For differentiation: Goodhart involves proxy-target divergence, while here they align but the proxy can't differentiate between high performers. Restriction of range affects correlation coefficients, but here the correlation is preserved over time. Ceiling effects are about fixed upper limits, but here the proxy might not have a hard ceiling; it's the optimization that compresses values.

  Cases 1 and 3 are similar—optimization pushes performance to a high plateau where the proxy can't distinguish. Case 2 is slightly different; the bottleneck shifted downstream, so the proxy (response time) no longer reflects the new bottleneck (wait time for second appointment). This is a form of "measurement drift" where the original metric becomes irrelevant. Still related but distinct.

  To identify this phenomenon, look for variance collapse in the proxy after optimization, while the target's variance remains. Monitoring the residual variance in the target after accounting for the proxy could help. Also, tracking alternative metrics might detect shifts in bottlenecks.

  In conclusion, this is a distinct phenomenon best termed "Resolution Saturation," with case 2 being a subtype involving shifting bottlenecks. The user needs clear definitions, differentiation from other concepts, and detection methods, all of which I've addressed. They might also appreciate knowing this is a recognized issue in metrics design, emphasizing the need for dynamic measurement systems.
answer: |-
  This is a **profoundly important observation** that deserves a clear conceptual framing. While related to Goodhart's law and other concepts, it represents a distinct and critical failure mode of *measurement under optimization*.

  **The Core Phenomenon: Resolution Saturation**

  *   **Definition:** Resolution Saturation occurs when optimizing a proxy metric successfully improves the true target variable to a high-performance plateau, but concurrently compresses the *distribution of the proxy values* into such a narrow band near its practical upper limit that it loses all *discriminatory power* for detecting meaningful variations in the target variable *within that high-performance regime*. The proxy remains historically correlated with the target but becomes operationally useless for monitoring, diagnosis, or further optimization at the achieved level.
  *   **Key Mechanisms:**
      1.  **Successful Optimization:** The proxy genuinely drives improvement in the true target.
      2.  **Compression:** Optimization naturally reduces variance in the proxy as performance approaches practical/physical/algorithmic limits.
      3.  **Loss of Discriminatory Power:** Within the compressed high-value band, the proxy's sensitivity to underlying changes in the target falls below a useful threshold. Small, meaningful differences in the target produce imperceptible (or statistically insignificant) differences in the proxy.
      4.  **Preserved Historical Correlation:** Over the *full historical range* (including low-performance states), the correlation between proxy and target remains strong. The breakdown is *localized* to the high-performance region.

  **Differentiating from Nearby Concepts:**

  1.  **Goodhart's Law (General):** The broadest umbrella ("When a measure becomes a target, it ceases to be a good measure"). Resolution Saturation is a *specific subtype*.
  2.  **Goodhart - Gaming/Adversarial:** (The classic "teaching to the test"). Involves agents *deliberately manipulating* inputs or processes to inflate the proxy *without* improving (or while harming) the target. *Resolution Saturation lacks this adversarial element.* Optimization genuinely improves the target until the resolution limit is hit.
  3.  **Goodhart - Regression to the Mean:** Occurs when selecting entities based on a *noisy* proxy. High performers are likely over-estimates and regress downward. *Resolution Saturation doesn't require the proxy to be noisy in the low-performance regime; the problem is compression/loss of sensitivity at the top.*
  4.  **Goodhart - Extremization:** Optimizing a proxy pushes systems into extreme, often pathological, states the proxy wasn't designed for (e.g., RL agents doing backflips for points). *Resolution Saturation involves genuine improvement within the intended domain, followed by a loss of resolution, not necessarily pathological extremes.*
  5.  **Campbell's Law:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." Focuses on *corruption/distortion due to pressure*. *Resolution Saturation doesn't require corruption/distortion; the process can remain pure, the measure just loses resolution.*
  6.  **Restriction of Range:** A statistical phenomenon where reducing the variance in one variable (e.g., selecting only high performers) *artificially lowers the observed correlation coefficient* with another variable. *Resolution Saturation preserves the historical correlation coefficient; the problem isn't the *correlation* per se, it's the *operational utility* of the measure within the compressed range. The proxy *could* still have perfect correlation mathematically, but all values cluster so tightly that the number is meaningless for practical differentiation.*
  7.  **Base-Rate Problem / Rare Outcome Problem:** When the event of interest becomes very rare, detecting it or measuring changes becomes statistically difficult. *Resolution Saturation is different: The "event" (variation in the true target) might not be rare; you just can't *discern* it with your compressed proxy. The problem is measurement resolution, not outcome rarity.*
  8.  **Ceiling Effect:** A measurement limitation where scores cluster at the maximum possible value of a scale. *Resolution Saturation is a *dynamic* consequence of *optimization* leading to a *de facto* ceiling effect, even if no formal ceiling exists. It's *caused* by the process.*

  **Applying the Definition & Edges:**

  *   **Your Cases:**
      *   **Case 1 (Sleep Score):** **Resolution Saturation.** Proxy (score) drove genuine improvement (better habits). Values compressed near top (92-95). Proxy lost ability to distinguish "good" from "great" or "slightly bad" sleep within that band. Historical correlation intact.
      *   **Case 2 (Counselling Service):** **A Related But Distinct Phenomenon: Measurement Drift / Bottleneck Shift.** The initial optimization genuinely improved the target measured (time-to-first-response). However, the *operational goal* (timely therapy) involves a multi-step process. Optimizing the first step shifted the bottleneck downstream. The *original proxy* (first response time) is no longer *relevant* to the *current* critical constraint (second appointment wait). The proxy didn't saturate; it became *misaligned* with the evolving operational reality. It's related because the *measurement system* failed to detect the new problem, but the *mechanism* (bottleneck shift) is different from resolution loss *within* the intended target domain.
      *   **Case 3 (Summarizer Reward):** **Resolution Saturation (Strong Candidate).** Rewards climbed, outputs genuinely improved initially (no obvious hacks), then rewards crept up while human-perceptible quality plateaued. The learned reward model likely lost discriminatory power within the high-reward region. It couldn't distinguish "slightly better" from "slightly worse" or even "broken". Historical correlation likely holds.
  *   **Selection vs. Optimization:** Selecting a subset (e.g., only hiring people with GPA > 3.8) based on a proxy can *cause* restriction of range for that subset, potentially masking the proxy's true correlation. This could *lead* to Resolution Saturation *if* you then try to use that same proxy to make fine-grained distinctions *within* the selected high-performing group. The core phenomenon (loss of resolution within a compressed high band) is similar, but the *cause* is selection pressure rather than active optimization pressure.
  *   **Static Target, Changing Proxy?** If the *true target* hasn't changed, but the proxy loses variance or meaning *without* optimization/selection, that's likely **instrument drift** or a change in the underlying system dynamics affecting the proxy but not the target. Resolution Saturation is fundamentally linked to the *process of optimizing/selecting on the proxy* driving the system into a state where the proxy loses resolution.
  *   **Variance Without Meaning:** If the proxy retains variance but that variance becomes uncorrelated with the target *in the current regime*, this is classic **proxy breakdown** or **causal decoupling** – a core Goodhart failure. Resolution Saturation specifically involves the proxy *losing the variance necessary* to track the target *because* it's been pushed to its effective limit, not because the link broke.
  *   **Is Case 2 the Same?** As argued above, **No.** Case 2 is **Measurement Drift** or **Bottleneck Shift**. The measure stopped being the *relevant* constraint indicator. Resolution Saturation is about the measure becoming *indiscriminate* for the thing it *is* still measuring.

  **Detection: Can You See It Coming?**

  It's hard *from the proxy alone*, but possible with vigilance:

  1.  **Monitor Proxy Variance:** Actively track the *variance* (or standard deviation) of the proxy metric *over time*. A significant and sustained *decrease* in variance, especially while mean values are high and stable, is a major red flag for impending Resolution Saturation. (Your sleep score variance plummeted).
  2.  **Track Residual Variance in Target:** If you have *any* way to measure the true target (even sporadically, expensively, or subjectively), track the *variance* of the true target *after accounting for the proxy*. If the residual variance remains significant while the proxy variance collapses, Resolution Saturation is likely.
  3.  **Sensitivity Analysis:** Systematically perturb the system in ways you *believe* should affect the true target (e.g., deliberately have a bad sleep night, introduce known summarizer errors). If these perturbations cause large perceptible changes in the target but *no significant change* in the proxy within its compressed band, Resolution Saturation has occurred.
  4.  **Calibration Plots:** If you have ground truth data (even for a subset), plot proxy value vs. true target value specifically for the *recent, high-performing data points*. If the points are tightly clustered vertically (high proxy) but spread horizontally (varying true target), resolution is saturated.
  5.  **Leading Indicators:** A plateau in the *rate of improvement* of the true target (if measurable) while the proxy continues to climb is suspicious. The proxy creeping up without observable change is a warning sign (your Course Project).

  **In Summary:**

  You've identified a crucial pitfall: **Resolution Saturation**. It's a specific failure mode under optimization where genuine success on both proxy and target leads to a state where the proxy becomes operationally useless for monitoring or further improvement *because it loses the resolution to distinguish meaningful variations in the target at the achieved high-performance level*.

  *   **Key Differentiators:** Genuine improvement, lack of gaming, compression of proxy variance near the top, loss of discriminatory power locally, preserved historical correlation.
  *   **Vs. Goodhart:** A distinct subtype focused on loss of resolution, not proxy-target divergence.
  *   **Vs. Restriction of Range:** Focuses on operational utility loss within the range, not just correlation coefficient reduction.
  *   **Your Cases:** 1 & 3 are Resolution Saturation. 2 is Measurement Drift/Bottleneck Shift.
  *   **Detection:** Monitor proxy variance decay, residual target variance, conduct sensitivity tests, check calibration in the high band.

  This phenomenon highlights why **measurement systems must evolve alongside performance**. A metric perfect for driving improvement from 70 to 90 is often useless, or even misleading, for managing performance between 90 and 95. Recognizing Resolution Saturation forces us to design adaptive measurement regimes, incorporate multiple metrics, and maintain connections to ground truth, even when proxies seem to be working perfectly.
