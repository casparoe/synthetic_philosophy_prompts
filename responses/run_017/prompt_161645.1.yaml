  A doctrinal theorist insists the left/right axis is defined by attitudes toward hierarchy. When asked why "hierarchy" explains both 18th-century monarchists and 21st-century tech libertarians...  

  **Punchline:**  
  They sigh: "It’s always hierarchy—*except* when it’s equality, which is actually hierarchy’s dialectical antithesis... or its neo-liberal commodification. Look, just hold this measuring tape *sideways*."  

