answer: |-
  Here’s a precise principle built from your cases, with clauses motivated by each scenario. I’ll state it step-by-step, then apply it to your cases (including the new ones) and note where your intuitions conflict with a defensible rule.

  ### **The Principle: Conditional Process Reflection**
  > **Core Idea**: Defer to a reported future credence \( p_{f}(H) = r \) iff you rationally expect the future self/system to form its credence through a process that is (i) *epistemically continuous* with your current reasoning and (ii) *strictly evidentially superior*. Otherwise, treat the report as *evidence* about future evidence or constraints.  
  >  
  > **Clauses**:  
  > 1. **Baseline Deference (motivated by a, c, f-undeformed)**:  
  >    Defer if the future system:  
  >    - Has strictly *more* relevant evidence than you *and*  
  >    - Forms its credence via a process you currently endorse (e.g., rational updating).  
  >    *Example*: (a) Lab report adds new evidence; (c) "Better reasoning" implies endorsement.  
  >  
  > 2. **Process Corruption Exception (motivated by b, d)**:  
  >    Do *not* defer if the future credence is formed under:  
  >    - **Evidence loss** (e.g., forgetting),  
  >    - **Cognitive distortion** (e.g., drugs), or  
  >    - **Systematic bias** (e.g., training for boldness).  
  >    Instead, treat \( p_{f}(H) = r \) as *evidence* about what the future evidence *might be*, and update accordingly.  
  >    *Example*: (b) Drugs distort reasoning; (d) Forgetting degrades evidence.  
  >  
  > 3. **Perspectival/Indexical Exception (motivated by e, f-duplicated)**:  
  >    Do *not* defer if the future system occupies a *different epistemic perspective* (e.g., due to duplication, memory wipes, or indexical uncertainty), even if its process is rational.  
  >    *Example*: (e) Sleeping Beauty’s future self has identical evidence but different indexical information.  
  >  
  > 4. **Interval/Uncertain Reports (motivated by g)**:  
  >    If you learn \( p_{f}(H) \in [a,b] \) (or a distribution over values), your credence should satisfy \( p_{now}(H) \in [a,b] \), but no further constraint applies. Any "pull" to a specific value (e.g., 0.75 in g) is unjustified unless derived from evidence about evidence.  

  ---

  ### **Verdicts on Your Cases**
  | Case | Your Verdict | Principle’s Verdict | Conflict? |  
  |------|-------------|---------------------|----------|  
  | (a) | Defer (0.7) | **Defer** (Clause 1: new evidence + endorsed process) | None |  
  | (b) | Don’t defer (~0.55) | **Don’t defer** (Clause 2: drugs distort process; treat as evidence) | None |  
  | (c) | Defer (0.6) | **Defer** (Clause 1: "better reasoning" implies endorsed process) | None |  
  | (d) | Don’t defer (go >0.4) | **Don’t defer** (Clause 2: evidence loss; update on report as evidence) | None |  
  | (e) | Don’t defer (stay 1/3) | **Don’t defer** (Clause 3: perspectival/indexical shift) | None |  
  | (f) Undrugged | Defer | **Defer** (Clause 1: more evidence, endorsed process) | None |  
  | (f) One drugged | Confused | **Don’t defer to either** (Clause 2: one process corrupted; use reports to infer evidence) | None |  
  | (g) Interval [0.55,0.95] | Pulled to 0.75 | **Any \( p \in [0.55, 0.95] \) allowed** (Clause 4: no justification for 0.75) | **Forced surrender** |  
  | (g) 50/50 {0.55, 0.95} | Pulled to 0.75 | **Set \( p = 0.75 \) only if it reflects expected evidence** (Otherwise, use weighted average: 0.75?) | **Partial surrender**<sup>†</sup> |  

  <sup>†</sup> *Clause 4 allows 0.75 IF you infer it’s the expected future credence. But if you only know the distribution, your credence should be the expectation of H given that distribution (likely 0.75 here). No conflict if "pull" is rational calculation.*

  ---

  ### **New Cases & Verdicts**
  1. **Boldness-Calibrated Future System**  
     - *Scenario*: Future system has all your evidence but was trained with a loss function rewarding boldness (e.g., confident guesses).  
     - **Verdict**: **Do not defer** (Clause 2: systematic bias).  
     - *Reasoning*: The training distorts truth-tracking for calibration. Treat its report as evidence about what the evidence *might* support (e.g., if it reports 0.9, nudge up slightly).  

  2. **Full Future Distribution Over Partition**  
     - *Scenario*: You learn your future credence distribution over a partition (e.g., {H1, H2, H3}).  
     - **Verdict**: **Defer fully to each value** (Clause 1 applies per hypothesis).  
     - *Reasoning*: With strictly more evidence and an endorsed process, the distribution encodes your best future uncertainty. No corruption or perspectival shift.  

  ---

  ### **Where You Must Surrender**
  A defensible principle forces you to abandon:  
  - **The "pull" in (g)**: Your intuition for 0.75 in the interval case is unjustified. The interval version of Reflection *only* requires \( p_{now}(H) \in [0.55, 0.95] \). Any specific value must be based on further evidence (e.g., "0.75 is most likely" is extra information).  
  - **Confusion in (f) with one drugged copy**: The principle resolves this: use both reports to infer what evidence the drugged/non-drugged selves likely saw, then update on H. No simple deference.  

  ---

  ### **Why This Works**  
  - **Handles (c) vs. (d)**: Endorsed "better reasoning" (c) vs. compromised "forgetting" (d).  
  - **Justifies (e)**: Perspectival shifts break continuity, even with rational future credences.  
  - **Clarifies intervals (g)**: The interval rule is purely about bounds; inner values require evidence.  
  - **Solves duplication (f)**: Undrugged copies get deference; drugged copies provide noisy evidence.  

  **American English Note**: "Credence" = subjective probability; "defer" = adopt the reported value.  

  This principle prioritizes *epistemic continuity* and *evidential improvement* over blind self-trust. When those fail, you pivot to treating credences as evidence—which explains your split intuitions.
