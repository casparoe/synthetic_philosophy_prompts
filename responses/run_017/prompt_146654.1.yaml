prompt: |-
  I run the clinical ethics consultation service at a large teaching hospital, and most of our consults are family disagreements about treatment for a patient who has lost capacity. Our standing protocol is autonomy-based: look for an advance directive, identify the designated surrogate, apply substituted judgment, fall back on best interests. It keeps producing recommendations that families experience as foreign — it insists on one person whose judgment counts, and it treats the patient as a self-contained chooser with a pre-existing will to be unearthed. I want a second procedure to run alongside it, built from Confucian role ethics, that begins from the patient as a node in a web of relationships and from obligations that attach to roles rather than to individuals.

  Constraints on the design: it has to be runnable inside one thirty-minute family meeting by a rotating fellow with no philosophy training; it has to end in something the attending physician can sign and our legal office can defend, even though that office thinks exclusively in terms of individual autonomy and statutory surrogacy; and it has to be honest about where it stops.

  So please write the procedure: the questions in order, what counts as an adequate answer to each, where it halts with a recommendation, and where it deliberately hands the decision to a person because the question is one of values or of institutional authority rather than something the framework can settle. Two features of our caseload must be handled explicitly. First, roles are frequently held by people who have not lived them — the son who is statutory next of kin but has not spoken to his father in twelve years, the stepdaughter who has done the daily caring for six. Say what your procedure does when role and enacted relationship diverge, and state plainly whether you are treating a role as conferred by social position or as constituted by the relationship actually being lived; I know this is contested, so commit to one and say what it costs you. Second, patients often arrive with a written advance directive that the family wants set aside. The written document is the paradigm object of the autonomy framework and has almost no place in a role-ethics one; do not quietly ignore it — say what the procedure does with it.

  Then run the procedure on three recent cases: (1) a widowed father with advanced dementia and no directive, whose estranged son, the legal surrogate, wants a feeding tube and aggressive treatment, while the brother who has visited weekly for years says he was told repeatedly that he never wanted machines; (2) a man with pneumonia and a signed directive refusing antibiotics, whose wife and two adult children, all closely involved, insist he has changed his mind and want it overridden; (3) two daughters equally involved in their father's care, one arguing that filial responsiveness means honoring the wish he stated, the other that it means protecting him from a burdensome intervention. I expect at least one of these to come out somewhere I won't like; do not steer around that.

  Finally, answer as a specialist in comparative moral philosophy who knows both Confucian ethics and clinical practice. Think the design through before you write — sketch at least one alternative structure and say why you rejected it. Flag where the translation does violence to the theory: which distinctions you had to drop to make it usable by a non-specialist in half an hour, which you refused to drop, and which step is most exposed to being gamed by an articulate family. Close with a confidence note on the procedure as a whole and on each step, and single out the one claim you are least sure of, including whether your uncertainty is about institutional design or about what the tradition actually commits you to.
reasoning: |-
  We are designing a Confucian role ethics (CRE) procedure to run alongside the autonomy-based protocol. The core idea is to view the patient as a node in a web of relationships, with obligations arising from roles (e.g., parent, child, spouse) rather than from individual autonomy.

  Key principles for the procedure:
  1. **Focus on relationships**: Decisions should emerge from the family as a collective, not just one surrogate.
  2. **Roles over individuals**: Obligations are tied to roles (e.g., filial piety). But we must decide how to handle when the statutory role-holder (e.g., next of kin) is not the one who has lived the role.
  3. **Harmony and context**: Aim for a harmonious resolution that considers the patient's relational context and the family's collective wisdom.

  Constraints:
  - 30-minute family meeting by a non-philosopher fellow.
  - Must produce a defensible recommendation for the attending and legal office (which is autonomy-focused). Thus, we must end with a clear decision that can be framed in autonomy terms if needed, but the process is relational.
  - Must explicitly handle: 
     a) Divergence between statutory role and lived relationship.
     b) Written advance directives (which are autonomy-centric).

  Design choices:
  - **Role definition**: We will treat a role as **constituted by the relationship actually being lived**. This is because CRE emphasizes the actual performance of relational duties. The cost: it may conflict with legal statutes and might be harder to defend legally. We will have to bridge this gap by documenting the lived relationship and then, if necessary, having the legal office accept a deviation from statutory surrogacy based on the ethical reasoning (but note the constraint: the legal office thinks in autonomy terms). We might have to hand off to the autonomy procedure if the legal risk is too high.
  - **Advance directive**: We will not ignore it. We treat it as one piece of evidence about the patient's wishes, but in CRE, the patient's wishes are not the sole driver. The directive will be considered in the context of the patient's relationships and the family's collective understanding. However, if the family collectively agrees that the directive no longer reflects the patient's current relational context or values, we may set it aside. But note: the legal office may require adherence to the directive. Therefore, if the directive is clear and the family cannot agree, we may have to revert to the autonomy procedure.

  Procedure Steps (with time allocation in mind):

  1. **Introduce the process (2 minutes)**: 
     - Explain that we are using a family-centered approach that considers the patient's relationships and roles.
     - Clarify that the goal is to reach a harmonious decision that respects the patient in the context of their family.

  2. **Map the relationships (5 minutes)**:
     - Question: "Who are the key people in the patient's life, and what role did they play in the patient's care and decision-making when the patient had capacity? Also, what role does each of you play now?"
     - Adequate answer: Identify the network of relationships (e.g., spouse, children, close friends) and the nature of their involvement (e.g., daily care, financial, emotional support). We are looking for who has been actively involved in the patient's life and care.
     - Note: We are focusing on lived relationships. If there is a statutory surrogate who has not been involved, we note that but do not automatically grant them authority. Instead, we will consider the collective.

  3. **Discuss the patient's values in relational context (8 minutes)**:
     - Question: "In the context of these relationships, what values did the patient hold about health, illness, and family? How did they express these in their relationships? And how do these values guide what the family should do now?"
     - Adequate answer: Stories and examples that illustrate the patient's values as expressed in their roles (e.g., as a parent, they always put family first; as a spouse, they valued quality of life over longevity). We are not looking for a "pre-existing will" but for values enacted in relationships.
     - Handling advance directive: If there is a written directive, ask: "How does this directive fit with the patient's lived values in their relationships? Do you believe it still reflects what the patient would want in the context of their current relationships and condition?" The directive is one input, but the family's collective interpretation in light of the patient's relational history is primary. If the family collectively agrees the directive is outdated or doesn't apply, we may set it aside. If they disagree, we note the conflict and move to step 4.

  4. **Seek family consensus (10 minutes)**:
     - Question: "Given the patient's relational values and your roles in their life, what decision would best honor the patient in the context of their family? How can we reach a decision that maintains family harmony?"
     - Adequate answer: A collective agreement on a course of action. We are looking for a consensus that emerges from the group, not a vote. The fellow facilitates discussion, reminding the family of the patient's relational values and their roles. 
     - If consensus is reached, we document it.
     - If not, we must either:
          a) Hand off to the autonomy procedure (if the conflict is irreconcilable and we need a single decision-maker) OR 
          b) If there is a clear majority and one dissenter, we might still proceed with the majority if the dissenter is not a key lived-relation. But note: if the dissenter is the statutory surrogate, this creates a legal problem. Therefore, we must be cautious. We might have to fall back to statutory surrogacy if consensus fails and the legal risk is high.

  5. **Formulate recommendation (5 minutes)**:
     - If consensus is reached, the recommendation is that course of action.
     - If not, we may have to:
          - Acknowledge the impasse and switch to the autonomy procedure (which will then look for a surrogate and apply substituted judgment/best interests). 
          - Or, if the family agrees on a process (e.g., let the primary caregiver decide), we can document that and frame it as the family's chosen method. But note: the legal office may not accept it. Therefore, we must be prepared to use the autonomy procedure as a backup.

  Explicit handling of the two features:
  1. **Role vs. lived relationship**: We treat the role as constituted by the lived relationship. So, the stepdaughter who provided daily care has more weight than the estranged son. The procedure in step 2 (mapping) identifies the active relationships. In step 4, if the estranged son (statutory surrogate) disagrees with the rest, we try to achieve consensus. If we cannot, we may have to hand off to the autonomy procedure because the legal surrogate must be followed unless overridden by court. We note that the procedure's recommendation might be overridden by legal requirements, but we document the ethical recommendation from the relational perspective.

  2. **Advance directive**: We address it in step 3. We do not ignore it, but we contextualize it within the patient's relationships. If the family collectively agrees it should be set aside, we do so. If they disagree, we note the conflict and either try to resolve it in step 4 or hand off to autonomy.

  Now, run the three cases:

  **Case 1**: Widowed father with advanced dementia, no directive. Estranged son (legal surrogate) wants feeding tube and aggressive treatment. Brother (weekly visitor) says patient never wanted machines.

  - Step 2: Map relationships. The brother has been present weekly, the son is estranged (no contact for 12 years). The brother is a key lived-relation; the son, though legal surrogate, has not lived the role of a son in relation to his father.
  - Step 3: Discuss patient's values. The brother reports the patient's repeated statements against machines. The son might not have any counter-evidence from the recent relationship. The brother's account is given more weight because of the lived relationship.
  - Step 4: Seek consensus. The brother and son are in conflict. The fellow tries to facilitate: "Given that your father expressed these wishes to his brother, who was actively involved, and in the absence of a contrary expression to the son, what would honor your father?" If the son remains adamant, consensus fails. 
  - Step 5: Because consensus fails and the son is the legal surrogate, we may have to hand off to the autonomy procedure. The autonomy procedure would identify the son as surrogate and apply substituted judgment. The brother's testimony would be considered, but the son might override. However, in the CRE procedure, we document the ethical recommendation from the relational perspective: no feeding tube, based on the brother's account and the patient's expressed wishes. But we note the legal surrogate's authority. The attending might need to involve the legal office to challenge the son's authority based on estrangement (if the hospital policy allows). This is messy and might not succeed. The CRE procedure stops with a recommendation but cannot override the law.

  **Case 2**: Man with pneumonia and signed directive refusing antibiotics. Wife and two adult children (all involved) insist he changed his mind and want to override.

  - Step 2: Map relationships. Wife and children are all closely involved. The directive exists.
  - Step 3: Discuss values. The family says the patient changed his mind recently, based on new circumstances (e.g., he became a grandfather and wanted to live longer). They provide examples of conversations. The directive is old. We contextualize the directive: the family collectively agrees it no longer reflects the patient's wishes. 
  - Step 4: Seek consensus. The family is united. They agree to override the directive. Consensus reached.
  - Step 5: Recommendation: provide antibiotics. The legal office might object, but we argue that the family, as the patient's relational context, is the best interpreter of the patient's current wishes. We frame it as: the advance directive was superseded by the patient's more recent relational expressions. This might be defensible as an update to the patient's wishes.

  **Case 3**: Two equally involved daughters, one wants to honor the stated wish (e.g., no dialysis), the other wants to protect from burdensome intervention (e.g., by providing dialysis to avoid discomfort from untreated symptoms? Note: the case is ambiguous. Let's assume the father stated a wish to avoid dialysis, but now one daughter thinks that in his current state, dialysis would be burdensome and not what he would want now, while the other thinks he would want it to prolong life because he always valued family gatherings and wants to see his grandchildren grow.)

  Actually, the case description: "one arguing that filial responsiveness means honoring the wish he stated, the other that it means protecting him from a burdensome intervention." So, both are appealing to filial piety but interpreting it differently.

  - Step 2: Both daughters are equally involved. No statutory hierarchy (unless one is older? But we don't have that info). Both are in lived relationships.
  - Step 3: Discuss values. The patient stated a wish (e.g., no aggressive treatment). But what was the context? One daughter says we must honor that. The other says that protecting him from burden now is more in line with being a filial daughter. We ask: how did the patient express his values in the context of family? For example, did he ever change his mind based on family circumstances?
  - Step 4: Seek consensus. The fellow facilitates: "What would your father want given his role as a father and his relationships with you? How can we balance honoring his past words with protecting him now?" If they cannot agree, we try to find a middle ground. If still no consensus, we might hand off to the autonomy procedure. But note: they are both equally involved and both are legal surrogates (if no one else)? If they are co-surrogates, the autonomy procedure might also deadlock. Alternatively, we might ask: is there a family elder or another relative who can break the tie? In CRE, we might look for a hierarchical element (e.g., the older daughter?) but that might be arbitrary. Instead, we might recommend a trial of treatment or a time-limited intervention. But the procedure doesn't specify. 
  - Step 5: If consensus fails, we may have to hand off to autonomy. The autonomy procedure would look for a surrogate (if they are co-surrogates, they might have to go to court). Alternatively, we might recommend that the two daughters seek mediation or involve another family member. But in 30 minutes, we might not have time. This case is tough and may not resolve. The CRE procedure might end without a clear recommendation and defer to the autonomy procedure.

  As a philosopher:

  Alternative structure considered: 
  - Instead of seeking consensus, we could assign decision-making authority to the person with the closest lived relationship (e.g., the primary caregiver). But that might create hierarchy and conflict. We rejected it because CRE emphasizes collective harmony, not individual authority. Also, in cases of equal involvement, it fails.

  Translation violence:
  - We dropped the distinction between different types of roles (e.g., ruler-subject, father-son) and treat all family roles similarly. We also simplified the concept of harmony to mean consensus, which might not capture the full Confucian idea.
  - We refused to drop the emphasis on lived relationships over statutory roles, even though it creates legal tension.
  - The step most exposed to gaming: Step 3 (discussing values). An articulate family might overemphasize recent events to set aside an advance directive, or a dominant family member might steer the narrative. The fellow must be alert to power imbalances.

  Confidence:
  - Overall procedure: Moderate. It's a pragmatic adaptation. It might work well in families with strong relationships but struggle with fractured ones.
  - Step 2 (mapping): High confidence.
  - Step 3 (values): Moderate. It's hard to do in 8 minutes.
  - Step 4 (consensus): Low confidence in achieving it in 10 minutes, especially in conflict.
  - Least sure about: How to handle the legal surrogate who hasn't lived the role (Case 1). We are committed to lived relationships, but the legal system isn't. My uncertainty is about institutional design: how to get the legal office to accept a non-statutory decision-maker without a court order? We might have to accept that the CRE recommendation is advisory and then let the autonomy procedure take over for legal defensibility. This undermines the CRE approach. Alternatively, we might build a bridge by having the hospital's legal office accept a family consensus as a form of extended autonomy, but that's not guaranteed.

  Final note: The procedure is a supplement. It may not always produce a different outcome, but it changes the process to be more relational. It will sometimes conflict with the autonomy procedure, and we must be transparent about that.
answer: |-
  ### Confucian Role Ethics Consultation Procedure  
  **Design Rationale**: I considered an alternative structure where the fellow directly assigns decision-making authority to the person with the strongest lived relationship (e.g., the primary caregiver). I rejected this because it risks imposing hierarchy and undermining collective harmony—core to Confucian ethics. Instead, this procedure prioritizes *family consensus* as the manifestation of relational harmony. It explicitly treats **roles as constituted by the relationship actually being lived** (not statutory position), as this aligns with Confucianism's focus on enacted virtue (*ren*). The cost: it may conflict with legal surrogacy statutes, requiring careful documentation to bridge the gap.  

  **Time Allocation**:  
  - Intro (2 min) → Map Relationships (5 min) → Discuss Values (8 min) → Seek Consensus (12 min) → Finalize Rec (3 min).  
  Total: 30 minutes.  

  **Key Definitions**:  
  - **Adequate Answer**: Concrete examples of actions/words (e.g., "She visited weekly," "He always said X at family dinners").  
  - **Halt for Recommendation**: Consensus reached in Step 4.  
  - **Handoff to Autonomy Procedure**: (1) No consensus after 12 min, (2) Legal surrogate invokes statutory authority, or (3) Advance directive dispute escalates (see Step 3 rules).  

  ---

  ### Procedure Steps  
  **Step 1: Introduction (2 minutes)**  
  *Question*: "We’ll focus on how your family relationships guide this decision. My role is to help you find harmony in what the patient would want *as part of this family*."  
  *What Counts*: Family nods/verbal agreement to proceed. No debate.  

  **Step 2: Map Relationships (5 minutes)**  
  *Questions*:  
  - "Who shared daily life with the patient? Describe their role—e.g., caregiver, advisor, emotional anchor."  
  - "Who here has been most involved in the patient’s health decisions *before* they lost capacity?"  
  *What Counts*: Names, specific roles (e.g., "Maria managed meds," "John handled finances"), and frequency of contact. *Inadequate*: Vague claims ("I’m the son").  
  *Role Divergence Handling*: **Lived relationships override statutory titles**. E.g., An estranged son’s input is noted but weighted less than a stepdaughter’s daily care. Fellow documents: "Lived role > statutory role" and why.  
  *Where It Halts*: If only statutory surrogates are present (no lived relations), hand off to autonomy protocol.  

  **Step 3: Discuss Values in Relational Context (8 minutes)**  
  *Questions*:  
  - "In these roles, what did the patient value about health/family? Give examples of how they *showed* this."  
  - (If advance directive exists) "How does this document fit with the patient’s actions in their relationships? Did they ever discuss it with you?"  
  *What Counts*: Stories showing values *enacted in relationships* (e.g., "He refused a pacemaker to attend graduation"). Avoid hypotheticals.  
  *Advance Directive Handling*: **Treat as one input among many**, not binding. If family *collectively* agrees it misrepresents current relationships/values, set it aside. If disagreement persists, hand off to autonomy.  
  *Where It Halts*: Directive override requires unanimous family agreement. Else, hand off.  

  **Step 4: Seek Consensus (12 minutes)**  
  *Question*: "Given these roles and values, what decision upholds harmony? How would the patient judge your choice *as a family member*?"  
  *What Counts*: Consensus = all lived relations agree. Fellow reframes disagreements using relational language (e.g., "As a daughter, how does honoring his past words align with protecting him now?").  
  *Handoff Triggers*:  
  - No consensus after 10 min.  
  - Statutory surrogate unilaterally overrules (document as "consensus failed").  
  *Output*: If consensus, document: "Family agrees [decision] best reflects patient’s relational identity."  

  **Step 5: Finalize Recommendation (3 minutes)**  
  *Action*: State consensus decision or handoff to autonomy. Write orders in autonomy-compatible terms:  
  - *If CRE consensus*: "Per family consensus based on patient’s relational values, [decision]."  
  - *If handoff*: "Referred to autonomy protocol. Statutory surrogate to decide."  
  *Honest Limits*:  
  - Confucian process stops if consensus fails or law conflicts.  
  - Legal defense relies on documentation of lived roles and unanimity.  

  ---

  ### Case Applications  
  **Case 1: Estranged Son vs. Involved Brother**  
  - **Step 2**: Brother (weekly visits) has lived role; son (12-year estrangement) has statutory role only.  
  - **Step 3**: Brother’s accounts of patient’s anti-machine stance weighted heavily. No directive.  
  - **Step 4**: Son demands feeding tube; brother refuses. No consensus. Son invokes legal authority.  
  - **Step 5**: **Handoff to autonomy**. Fellow documents: "Lived role (brother) supports comfort care; statutory surrogate (son) insists on tube. CRE consensus failed."  
  *Outcome*: Autonomy protocol likely defers to son. *Unlikable but honest*: CRE cannot override law.  

  **Case 2: Directive Refusing Antibiotics, Family Wants Override**  
  - **Step 2**: Wife and children—all lived relations—unanimous.  
  - **Step 3**: Family provides examples: Patient recently said, "I want to meet grandchild," contradicting old directive. Unanimously agree to override.  
  - **Step 4**: Consensus: Give antibiotics.  
  - **Step 5**: **Recommendation**: Treat. Document: "Unanimous family consensus: directive inconsistent with patient’s current relational values."  
  *Legal Defense*: "Patient’s contemporaneous relational expressions supersede outdated document."  

  **Case 3: Daughters Disagree on Filial Responsiveness**  
  - **Step 2**: Both daughters equally involved (daily care).  
  - **Step 3**: Daughter A: "He stated no intervention." Daughter B: "Protecting him now is more filial."  
  - **Step 4**: Fellow reframes: "As daughters, did he ever prioritize family comfort over rigid wishes?" No consensus.  
  - **Step 5**: **Handoff to autonomy**. Document: "CRE consensus failed. Statutory surrogates (both daughters) deadlocked."  
  *Outcome*: Autonomy may escalate to court. *Weakness*: CRE struggles with equal-role conflicts.  

  ---

  ### Philosopher’s Analysis  
  **Translation Challenges**:  
  - *Violence to Theory*: Dropped *role hierarchies* (e.g., elder son’s primacy) to avoid cultural bias. Kept *relational enactment* over ritual form—critical to Confucianism.  
  - *Gaming Risk*: **Step 3 (Values Discussion)**. Articulate families may weaponize "relational values" to suppress dissent (e.g., "Mom would’ve wanted this" without evidence). Mitigation: Fellow demands concrete examples.  
  - *Refused to Drop*: **Lived roles > statutory titles**. Sacrifices legal smoothness for ethical fidelity.  

  **Confidence Assessment**:  
  - **Overall Procedure**: Moderate-High. Works best with cohesive families; fractures expose limits.  
  - **Step 2 (Mapping)**: High. Clear criteria.  
  - **Step 3 (Values)**: Moderate. Vulnerable to gaming but anchored in stories.  
  - **Step 4 (Consensus)**: Low-Moderate. Time-constrained; may fail in conflict.  
  - **Least Sure Claim**: **Treating roles as solely lived** (not statutory). Confucian texts *do* acknowledge social position (e.g., *Analects* 12.11), but I prioritize performative virtue. Uncertainty is institutional: Hospitals may reject non-statutory decisions despite ethical grounding.  

  **Final Note**: This procedure complements—does not replace—autonomy protocols. It excels when families are engaged but falters under legal rigidity or fragmentation. Its power lies in revealing what autonomy obscures: the patient as a relational being.
