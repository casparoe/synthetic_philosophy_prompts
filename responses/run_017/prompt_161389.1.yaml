prompt: |-
  I am putting together a handout for a graduate seminar on experimental philosophy, and I would like a diagnostic decision tree for the side-effect effect: beginning from the bare asymmetry (in the familiar chairman-style vignette, where a company officer adopts a profit-maximising program while saying he does not care that it will harm — or, in the other version, help — the environment, people are markedly more willing to say he brought about the harm intentionally than the help), a student should be able to answer a handful of questions and arrive at a named account of why the asymmetry is there.

  Three constraints matter for my purpose. First, the tree must sort students by what they predict about cases, not by which label they find attractive: no node may ask whether the concept of intentional action is itself normative, or whether the effect is pragmatic, and each node must be phrased as a concrete vignette or manipulation that a student can respond to without knowing which account it discriminates. Second, I want the tree built from the logical space rather than from a roster of views: lay out the probes, note which combinations of answers they permit, then locate the actual accounts in those cells, and mark any unoccupied combination with a clause on why nobody lives there (incoherent, unattractive, or merely untried). Third, I am assembling this without access to my university's subscriptions, so build it from the cases rather than from the literature: no citations and no author names unless a name is the only way to identify a leaf, and no assertions about what any particular study found — if a node depends on an empirical result, say so and give me both branches.

  The probes I want used as branch nodes, in whatever order makes the tree cleanest: replacing the yes/no question with a forced choice, a graded scale, or a three-option format that allows a distinct side-effect answer, and counterbalancing order; swapping 'intentionally' for 'in order to', 'for the sake of', 'deliberately', or 'did he foresee'; a side effect that breaches etiquette, a local convention, or prudence rather than morality; a case where the agent's community treats the side effect as required or forbidden and the agent shares that view while the reader does not; a case where the agent aims at the side effect but the program does not in fact produce it, or where he has no control over whether it occurs, or where the system producing it is a piece of software with no mental life; and a case where the agent is coerced or otherwise exempt from blame but the outcome is equally bad.

  The leaves I want reachable are: the effect is an artifact of question format or demand and tells us nothing about the concept; moral considerations are partly constitutive of intentional action; the question is heard as asking for a reason or as an invitation to criticise, and the asymmetry is conversational; intentionality judgments inherit an independently formed blame or praise judgment; the asymmetry reduces to what the agent knew, foresaw, or could control, with normativity doing no work; and the concept tracks whether the outcome is the sort of thing the agent was disposed to promote or prevent. I suspect the third and fourth of these may be hard to separate; flag any such pair rather than inventing a distinction, and tell me what further probe would separate them if one exists. Give each leaf a name (or 'unnamed' if nobody defends it) and one sentence on its most awkward commitment.

  Deliverable: the tree as a nested list with each branch labelled by the probe that splits it, then a compact table with one row per leaf (name, the path that reaches it, the awkward commitment), then two or three sentences on the empty cells and on any leaves the tree cannot distinguish. The whole answer should be under 700 words.
reasoning: |-
  Okay, the user is creating a handout for a graduate seminar on experimental philosophy, specifically the side-effect effect. They need a diagnostic decision tree that starts from the basic asymmetry in chairman-style vignettes where people are more likely to say harm was intentional than help. The tree must sort students based on predictions about cases, not theoretical labels. Each node should be a concrete vignette or manipulation. 

  The constraints are clear: no citations or author names unless necessary, and the tree must be built from logical possibilities rather than existing literature. The probes provided include varying question formats (like replacing "intentionally" with other phrases), changing the norm violated (etiquette instead of morality), cultural differences, outcome control, and coercion scenarios. 

  The leaves should cover major accounts: artifact, moral constitution, conversational pragmatics, blame inheritance, epistemic reduction, and dispositional tracking. The user is concerned that conversational and blame accounts might be hard to distinguish, so I need to flag that and suggest a further probe if possible.

  First, I need to structure the tree logically. The best starting point is testing whether the asymmetry persists without morality—using an etiquette violation probe. If the asymmetry disappears, it points to moral constitution. If it remains, we move to other branches. Next, varying the question format (e.g., "in order to" vs "intentionally") can test if the effect is pragmatic. If changing the verb removes the asymmetry, it supports conversational pragmatics. If not, we proceed.

  Then, coercion scenarios test if blame drives the effect. If coercion removes the asymmetry for harm but not help, it suggests blame inheritance. If not, we check epistemic factors like foreseeability or control. If normativity still matters after accounting for knowledge/control, moral constitution is likely. Otherwise, epistemic reduction or dispositional tracking could explain it.

  The dispositional tracking account might be separated by a case where the outcome doesn't occur, testing if intentionality hinges on the agent's disposition regardless of result. If yes, that's dispositional; if no, it might be epistemic.

  The empty cells in the table might occur if certain answer combinations are incoherent—like the asymmetry disappearing in etiquette cases but persisting in coercion scenarios, which might not align with any major theory. Also, conversational and blame accounts might overlap; suggesting a probe where the agent is unaware of the norm could help distinguish them.

  I need to ensure the tree remains under 700 words, using nested lists and a compact table. The awkward commitments for each leaf are crucial: e.g., moral constitution's commitment that intentional action is inherently moral, which might counter common intuitions. Finally, highlight any indistinguishable leaves and propose additional probes.
answer: |-
  Here is the diagnostic decision tree, structured per your constraints:

  **Decision Tree (Nested List)**
  1. **Does the side-effect asymmetry persist when violating a non-moral norm (e.g., etiquette)?**  
     - *No (asymmetry disappears)* → **Leaf: Moral Constitution**  
     - *Yes (asymmetry persists)* → Proceed to 2.  
  2. **Does replacing "intentionally" with "in order to" eliminate the asymmetry?**  
     - *Yes (asymmetry disappears)* → **Leaf: Conversational Pragmatics**  
     - *No (asymmetry persists)* → Proceed to 3.  
  3. **Does exempting the agent from blame (e.g., via coercion) eliminate the harm-asymmetry but not the help-asymmetry?**  
     - *Yes* → **Leaf: Blame Inheritance**  
     - *No (asymmetry persists unaffected)* → Proceed to 4.  
  4. **Does the asymmetry disappear if the agent lacks foresight/control over the side-effect?**  
     - *Yes* → **Leaf: Epistemic Reduction**  
     - *No (asymmetry persists despite lacking foresight/control)* → **Leaf: Dispositional Tracking**  

  **Leaf Table**  
  | Name                     | Path (Answers)                                                                 | Awkward Commitment                                                                 |
  |--------------------------|--------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | Moral Constitution       | 1: No                                                                          | Commits to intentional action being partly *defined* by moral valence.             |
  | Conversational Pragmatics| 1: Yes → 2: Yes                                                                | Predicts no asymmetry in non-pragmatic contexts (e.g., AI agents).                 |
  | Blame Inheritance        | 1: Yes → 2: No → 3: Yes                                                        | Requires blame to precede intentionality judgments asymmetrically (harm≠help).    |
  | Epistemic Reduction      | 1: Yes → 2: No → 3: No → 4: Yes                                                | Denies normativity plays *any* role beyond affecting knowledge/control.           |
  | Dispositional Tracking   | 1: Yes → 2: No → 3: No → 4: No                                                 | Judges intentionality even with no control/foresight, based on agent's disposition.|

  **Notes on Empty Cells & Ambiguities**  
  - **Empty Paths**: Combinations like "Asymmetry vanishes for etiquette (1:No) but persists under coercion (3:Yes)" are untried/incoherent. Moral Constitution (1:No) implies norm-type sensitivity, making coercion probes irrelevant.  
  - **Indistinguishable Leaves**: Conversational Pragmatics and Blame Inheritance both predict asymmetry vanishes when pragmatic/blame pressures are removed. **Further Probe**: *Agent unaware of norm*: If asymmetry *persists* (agent thinks harm is fine, but subject blames), supports Blame Inheritance. If asymmetry *vanishes*, supports Conversational Pragmatics.  
  - **Unnamed Leaf**: An "artifact" account (asymmetry due to demand) isn’t reached; all paths assume a real phenomenon. To test artifact, add a node probing response under cognitive load/time pressure.  
  - **Dispositional Tracking** is underspecified; the suggested probe (4: No) uses lack of foresight/control. A sharper probe: "Outcome doesn’t occur, but agent had identical disposition." If still judged intentional, confirms dispositional view.
