  1. **Endurantism vs. Perdurantism**: These views often yield identical answers to your cases. To split them, add a temporal part case: *"When the statue exists for 5 years, is there also an object that is only the first 10 minutes of the statue?"* Perdurantists typically say yes (temporal parts are objects); endurantists say no.  
