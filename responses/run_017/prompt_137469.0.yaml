  First, I need to recall philosophical concepts where an action invalidates its own premise. The user mentioned three aspects: capacity, doctrine, and the agent/audience dynamic. Each shows how the initial act changes the conditions, making repetition inevitable or altering the context irreversibly. 

  The closest concept might be a "self-defeating justification" or "self-consuming exception." But I should check if there's an existing term. Logical paradoxes come to mind, like performative contradictions, where the act of asserting something undermines the assertion. But here, it's about the conditions of permissibility being erased by the act itself.

  The user rejected slippery slope because their point isn't about gradual erosion but necessary structural changes post-act. Dirty hands focuses on the agent's guilt, not the systemic changes. Moral hazard is about incentives, which is different. 

  H.L.A. Hart's internal aspect of rules might be relevant. Once an exception is institutionalized, it becomes a rule, defeating the original prohibition. Also, John Searle's institutional facts—where the first act creates a new reality. For example, declaring a state of emergency establishes a precedent that alters future possibilities. 

  Another angle: game theory or dynamic inconsistency, where a threat must be credible but executing it changes the game. However, the user distinguished their case from nuclear deterrence by focusing on concrete changes (training, protocols) rather than credibility. 

  Perhaps there isn't a single term. The user might need a new concept. I'll define it as "Self-Annihilating Exception" (SAE). Instances include torture's one-off justification and perhaps revolutionary acts that establish new norms. Non-instances could be self-defense (it doesn’t create infrastructure) or pardons (they don’t alter systemic capacity). 

  For the ticking-bomb argument, recognizing SAE shows that even a "perfect" one-off is impossible because it inherently establishes the apparatus it claims to avoid. Critics should emphasize that the initial conditions can't be restored, making the justification incoherent.
answer: |-
  Here's a precise conceptualization and analysis of the pattern you've identified:

  **Core Concept: Self-Annihilating Justification (SAJ)**

  **Definition:** A justification for an act (X) that requires the presence of condition (C) for its permissibility, where the performance of X *necessarily and immediately* destroys C, thereby rendering the justification inapplicable to any subsequent act. SAJ is inherently non-repeatable *by its own logic*, not merely contingent on circumstances. The act consumes the very condition that licenses it.

  **Key Features:**
  1.  **Essential Non-Repeatability:** The justification logically cannot apply more than once *because* the first application eliminates its necessary condition.
  2.  **World-Altering:** The act changes the objective context (institutional capacity, normative landscape, agent/audience knowledge) in a way that negates C.
  3.  **Structural, Not Contingent:** The self-annihilation arises from the nature of the act and justification itself, not from foreseeable but avoidable corruption or misuse (slippery slope) or psychological residue (dirty hands).
  4.  **Contradicts Institutionalization:** SAJ is fundamentally incompatible with the standing arrangements (capacity, doctrine) required to make X reliably possible or permissible in the "one-off" case.

  **Clear Instances of SAJ:**

  1.  **Your Ticking-Bomb Torture Case:** Condition (C): Absence of institutional torture capacity/protocol/doctrine and shared knowledge of its non-use. Act (X): Authorized, effective torture. Destruction of C: X *requires* and thus *creates* the capacity/protocol/doctrine it needs, establishes a precedent, and alters the knowledge of all actors, making C impossible to reinstate. The justification (necessity under unique C) vanishes with the act.
  2.  **The "Sacred First Use" of a Revolutionary Tactic:** Condition (C): Element of surprise and societal unpreparedness for the tactic. Act (X): First deployment of the tactic (e.g., a novel insurgency method, a radical protest technique). Destruction of C: X reveals the tactic, eliminates surprise, and triggers counter-measures/preparation (doctrine/capacity). The justification (effectiveness/necessity due to surprise/C) is consumed by its first use.

  **Cases That Resemble But Are Not SAJ:**

  1.  **Self-Defense Killing:** Condition (C): Imminent threat to life. Act (X): Lethal force. Why not SAJ? X removes the *specific* threat (C1), but C is a *general* condition (imminent threat) that can reoccur later, involving different actors/threats. The general justification isn't destroyed; only the specific instance of C is resolved. No standing capacity/doctrine/knowledge *essential to the justification* is necessarily created.
  2.  **A Unique Pardon:** Condition (C): Existence of a specific, unrepeatable circumstance justifying clemency (e.g., terminal illness). Act (X): Granting the pardon. Why not SAJ? X resolves the *specific* case requiring C, but granting it doesn't inherently create a *general* pardoning doctrine/capacity that *destroys the possibility* of future unrepeatable circumstances arising. Future unique Cs remain possible. The pardon doesn't fundamentally alter the institutional landscape for pardons in a way that consumes the condition for its own unique justification.

  **Implications for the Ticking-Bomb Argument:**

  Recognizing the SAJ structure fatally undermines the "clean one-off" defense:
  1.  **The Stipulation is Logically Incoherent:** The conditions required for the "one-off" to be possible (no standing capacity, pure surprise, no precedent) are *logically incompatible* with the act being performed effectively and lawfully (which requires capacity, doctrine, and thus precedent/knowledge).
  2.  **Focus on Institutional Reality:** The debate *must* shift to the institutional reality the "one-off" necessitates. Critics can argue: "Even granting your hypothetical scenario, actually acting on it *creates* the very institutional apparatus and normative precedent you claim to avoid. The 'one-off' is a conceptual mirage; you are arguing *for* a system of torture, not an exception."
  3.  **Principle vs. Practice Collapse:** The SAJ shows the artificiality of separating principle and practice here. The principle ("permissible only when C holds") *logically demands* a practice that *destroys* C, making the principle self-refuting upon application. The defender cannot coherently maintain the principle *and* advocate for acting on the "one-off" scenario.
  4.  **The Only Consistent Stance:** Either maintain an absolute prohibition (avoiding the creation of the SAJ-destroyed capacity/doctrine), or openly argue for a regulated system of torture (accepting the institutionalization the "one-off" requires but denies). The "one-off" middle ground is logically untenable due to SAJ.

  **In essence:** SAJ exposes the ticking-bomb "exception" as a Trojan horse for institutionalization, revealing its justification as inherently self-consuming. The argument must confront this structural reality.
