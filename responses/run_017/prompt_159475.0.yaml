prompt: |-
  I teach a fourth-year/MA seminar in formal epistemology, and this term's problem sheet on the common prior assumption and Aumann's agreement theorem came back with answers I am not confident about. I was marking the set on the train home from a workshop, half-asleep, and this particular submission — from one of the strongest people in the room — has been sitting with me ever since. My colleague who teaches the micro-theory version of the course thinks part (d) is a giveaway because I spelled out the "acceptable bet" route, and that the rider about dropping positivity is a distraction; I think the rider is exactly where you can tell who understands the assumption and who has merely memorised that "a common prior is a prior they both started from." So I would like a second reader who does not know what I was hoping for. I am pasting the question exactly as the students got it, followed by this student's answer as submitted.

  **The question (45-minute take-home, 25 marks).** Throughout, Ω is a finite set of states; agent i has a partition Pᵢ of Ω (her information), so that at state ω she can only rule out states outside her cell Pᵢ(ω). A *belief map* for i is a function bᵢ: Ω → Δ(Ω) that is constant on each cell of Pᵢ and satisfies bᵢ(ω)(Pᵢ(ω)) = 1 for every ω. A *common prior* for a pair of belief maps (b₁, b₂) is a single μ ∈ Δ(Ω) with μ(ω) > 0 for every ω such that, for each i and each ω, bᵢ(ω) = μ(· | Pᵢ(ω)).

  *Scenario 1.* Ω = {ω₁, …, ω₅}, μ uniform (1/5 on each state). The event of interest is E = {ω₂, ω₄}. Ann's partition is A₁ = {ω₁, ω₂}, A₂ = {ω₃, ω₄, ω₅}; Bob's is B₁ = {ω₁, ω₂, ω₃}, B₂ = {ω₄, ω₅}. Both belief maps are obtained from μ by conditioning.

  (a) [3 marks] Give Ann's and Bob's posterior probability for E in each of their cells, and list the states at which their posteriors initially differ.

  (b) [4 marks] They now announce their posteriors for E publicly and simultaneously, and repeat: in each round both hear the other's number without noise, update by conditioning on everything they have heard, and announce again. Run the process at each of the five states until the announced numbers stop changing. State how many rounds are needed and verify that when it stops the two announced numbers are equal at every state.

  (c) [3 marks] Show that before any announcement the only event that is common knowledge at any state is Ω itself. Conclude that Aumann's agreement theorem does not rule out the initial disagreement you found in (a), and explain in one sentence why the disagreement has gone by the time the process in (b) stops.

  *Scenario 2.* Ω = {ω₁, …, ω₄} = {(h₁,k₁), (h₁,k₂), (h₂,k₁), (h₂,k₂)}, where the first coordinate is the reading of the sensor Ann sees and the second the reading of the sensor Bob sees: Ann's partition is A₁ = {ω₁, ω₂} ("h₁"), A₂ = {ω₃, ω₄} ("h₂"); Bob's is B₁ = {ω₁, ω₃} ("k₁"), B₂ = {ω₂, ω₄} ("k₂"). This time the belief maps are stipulated directly, not derived from any prior:
  — Ann, after h₁: (3/4, 1/4, 0, 0); after h₂: (0, 0, 3/4, 1/4).
  — Bob, after k₁: (1/2, 0, 1/2, 0); after k₂: (0, 1/4, 0, 3/4).

  (d) [9 marks] Does a common prior exist? Either exhibit one and verify the conditioning conditions, or prove that none exists. Two routes are available for the negative verdict: (i) show that the consistency equations have no solution with all entries positive; (ii) exhibit an *acceptable bet*, i.e. transfers f_A, f_B: Ω → ℝ with f_A(ω) + f_B(ω) ≤ 0 for every ω, such that Ann strictly wants to accept f_A given either of her cells (E[f_A | A₁] > 0 and E[f_A | A₂] > 0, computed with her stipulated belief map) and likewise for Bob. State also whether your verdict changes if the requirement μ(ω) > 0 is dropped and zero-probability states are allowed.

  (e) [6 marks] Two short questions.
  (e1) [3 marks] Distinguish the common prior assumption from the claim that the two agents' posterior beliefs coincide, and explain why the so-called no-trade theorem is not a corollary of the common prior assumption alone: name the extra premises it needs and state its conclusion precisely.
  (e2) [3 marks] Return to Scenario 1, but suppose each announcement travels over a channel that drops every message independently with probability ε ∈ (0,1), and that a dropped message leaves the hearer's beliefs unchanged (both agents know ε and the structure of the channel; model this by enlarging the state space to include the transmission history). Is it ever common knowledge, at any state of the enlarged space, what the two agents' posteriors are? What follows for Aumann's theorem?

  **The student's answer, reproduced as submitted.**

  *(a)* Ann: in A₁, P(E|A₁) = (1/5)/(2/5) = 1/2; in A₂, P(E|A₂) = (1/5)/(3/5) = 1/3. Bob: in B₁, P(E|B₁) = (1/5)/(3/5) = 1/3; in B₂, P(E|B₂) = (1/5)/(2/5) = 1/2. So Ann and Bob disagree at ω₁ and ω₂ (1/2 against 1/3) and at ω₄ and ω₅ (1/3 against 1/2). At ω₃ both have 1/3, so there is no disagreement there.

  *(b)* One exchange suffices. At ω₄ Ann announces 1/3 and Bob announces 1/2; hearing 1/2, Ann infers that Bob's cell is B₂, hence that the state lies in A₂ ∩ B₂ = {ω₄, ω₅}, and her new posterior is P(E|{ω₄,ω₅}) = 1/2; symmetrically, hearing 1/3 Bob infers A₂ and also gets 1/2. A further round changes nothing, because each already knows the state is in {ω₄, ω₅}, so 1/2 is announced again. The same happens at ω₅. At ω₁ and ω₂ both end at 1/2: Ann hearing 1/3 infers B₁, hence {ω₁, ω₂}, and Bob hearing 1/2 infers A₁, hence {ω₁, ω₂}. At ω₃ both announce 1/3 at the first round but then each infers the other's cell and narrows to {ω₃}, so both announce 0 from the second round on. So by the end of one round-trip the announced numbers are equal everywhere.

  *(c)* Starting from ω₁, Ann's cell is {ω₁, ω₂}; the states sharing a Bob-cell with ω₁ or ω₂ are {ω₁, ω₂, ω₃}; Ann's cell at ω₃ is {ω₃, ω₄, ω₅}; Bob's cells at ω₄ and ω₅ add nothing new. So the common-knowledge component of ω₁ is all of Ω, and the same holds for every other state. The finest common-knowledge partition is therefore trivial, and the only common-knowledge event is Ω. Aumann's theorem says that a common prior together with common knowledge of the two posteriors forces the posteriors to be equal; since nothing beyond Ω is common knowledge at the outset, the theorem has no purchase on the initial disagreement of part (a), and there is no contradiction with the agents sharing the uniform prior. The disagreement has gone by the end of (b) because the public announcements refine both partitions, so that by then the event "both posteriors are 1/2" (or, at ω₃, "both are 0") contains the agents' common-knowledge component — the posteriors have become common knowledge, which is precisely the situation the theorem says cannot arise with unequal posteriors.

  *(d)* Write xᵢ = μ(ωᵢ). Consistency with Ann's map requires x₁/(x₁+x₂) = 3/4 and x₃/(x₃+x₄) = 3/4; consistency with Bob's requires x₁/(x₁+x₃) = 1/2 and x₂/(x₂+x₄) = 1/4. These give x₂ = x₁/3, x₄ = x₃/3, x₃ = x₁ and x₄ = 3x₂. Substituting, x₄ = x₁/3 but also x₄ = 3(x₁/3) = x₁, whence x₁ = x₁/3 and so x₁ = 0, which is impossible for a full-support prior. So there is no common prior with full support.

  This is, however, an artefact of the positivity requirement rather than a real violation of the assumption. If μ is allowed to put zero probability on some states the system becomes solvable: the obstruction is the state ω₄, which both belief maps make least likely, and once μ(ω₄) = 0 the equations x₄ = x₃/3 and x₄ = 3x₂ no longer have to hold simultaneously, so we can take μ proportional to (3, 1, 1, 0) and recover both stipulated belief maps by conditioning. So a common prior does exist once positivity is dropped, and the correct verdict is that Scenario 2 does not really violate the common prior assumption — only its full-support version.

  *(e1)* The common prior assumption is not the assumption that the two agents currently hold the same beliefs; it is the assumption that their current beliefs can both be obtained from one and the same ex ante distribution by conditioning on their respective private information. Disagreement at the interim stage is entirely compatible with a common prior — what a common prior excludes is disagreement that is common knowledge. As for no-trade, that is only the common prior assumption plus the observation that trade is voluntary: if the two agents share a prior, then any contract one of them expects to gain from the other must expect to lose from, so no mutually acceptable trade is possible, which is why the common prior assumption is often described as a "no-trade" condition.

  *(e2)* No: in the enlarged space no non-trivial event is ever common knowledge. From any state, each agent must count as possible the history in which the messages addressed to her were dropped, and also the history in which her own messages were dropped; chaining these possibilities together takes you from any state to a state in which nothing at all was heard, and from there — moving through the sensor readings, as in part (c) — to a state with any other value of the underlying parameter. So the common-knowledge component of every state is the whole enlarged space, Aumann's theorem never gets a grip, and the two agents can disagree indefinitely while still sharing a prior. This is the same moral as in part (c): it is not disagreement as such that a common prior forbids, but disagreement that is common knowledge.

  **What I want from you.** Act as second reader: give the answer a mark out of 25, and give me point-by-point comments I can paste into the feedback sheet — for each part, what is right, what is wrong, and, where it is wrong, what the correct claim is and exactly why the student's version fails. Please do the algebra yourself rather than taking the student's word for any of it: in particular, check whether the distribution proposed at the end of (d) really reproduces the stipulated belief maps when you condition, and whether the "no-trade" claim in (e1) really follows from the common prior assumption by itself. I want a committed verdict — a definite mark, definite diagnoses, no sitting on the fence and no list of "on the other hand" caveats; where you are unsure of something, recompute it and then tell me what you found. If you think some part of my question is ambiguous or badly posed, say so plainly, but grade the answer as written against the most natural reading of the question. And please don't give me references, reading suggestions or citations: I know that literature, and what I need is the mathematics and the argument.
reasoning: |-
  Okay, I'm stepping into the role of a second reader for this formal epistemology problem set. The student seems strong, but the professor has doubts about parts (d) and (e1). Let me analyze each part carefully.

  First, for scenario 1 part (a): The student correctly calculates Ann's posteriors as 1/2 in A₁ and 1/3 in A₂. Bob gets 1/3 in B₁ and 1/2 in B₂. The disagreement states are correctly identified as ω₁,ω₂ (Ann 1/2 vs Bob 1/3) and ω₄,ω₅ (Ann 1/3 vs Bob 1/2), with agreement at ω₃. This is perfect. 

  Part (b) is well-executed. The student tracks each state's updating: at ω₁/ω₂ they converge to 1/2 after one round; at ω₃ they go to 0; at ω₄/ω₅ they meet at 1/2. The round count (one full exchange) is correct, and equality is achieved everywhere. Full marks here.

  Part (c) is solid. The student correctly identifies that only Ω is common knowledge initially because the common knowledge partition is trivial. They properly explain why Aumann's theorem doesn't apply to initial disagreement but does after announcements make posteriors common knowledge. The logic is sound.

  Now part (d) - the controversial one. The student correctly shows no full-support common prior exists via equations: x₂=x₁/3, x₄=x₃/3, x₃=x₁, x₄=3x₂ → x₄=x₁/3=x₁ → contradiction. But then claims a zero-allowed prior μ∝(3,1,1,0) works. Let me verify conditioning: 

  - For Ann at A₁={ω₁,ω₂}: μ(ω₁|A₁)=3/(3+1)=3/4 ✓, μ(ω₂|A₁)=1/4 ✓
  - At A₂={ω₃,ω₄}: But μ(ω₄)=0! Conditional probability undefined when conditioning on zero-probability event. The student failed to notice A₂ has probability μ(ω₃)+μ(ω₄)=1+0=1>0, but conditioning requires positive probability for the cell. With μ(ω₄)=0, Ann's belief at A₂ is stipulated but undefined under conditioning - it's mathematically invalid. The "solution" doesn't work. 

  Moreover, the no-trade route isn't explored, but that's optional. The verdict should be "no common prior exists even without positivity" because conditioning breaks down at A₂.

  For part (e1): The distinction between common prior and agreement is correct. But the no-trade claim is flawed. The student says common prior alone implies no trade because "any contract one gains from the other must lose from". This is incorrect - it assumes risk-neutrality and common utility. The no-trade theorem requires common prior AND common utility functions (or at least no speculative trade based purely on belief differences). With different risk attitudes, trade can occur even with common priors.

  Part (e2) is excellent. The student correctly argues that in the noisy channel model, no nontrivial event becomes common knowledge due to possible message drops. They properly connect this to Aumann's theorem requiring common knowledge of posteriors. The explanation is clear and insightful.

  Now grading:
  - (a) 3/3
  - (b) 4/4 
  - (c) 3/3 
  - (d) Algebra correct for positive case (3 marks), but wrong conclusion about zero-probability case: should get 0 for that part. The "solution" doesn't work. So 3/9? But the question has two routes, and they did one correctly. Let me see the mark allocation: 9 marks total. I'd give 4/9: 3 for correct positive case, 1 for attempting zero-case (though wrong), minus for incorrect conclusion.
  - (e1) First half correct (2 marks), second half wrong (0/3 for no-trade). So 2/3? But it's 3 marks total. 1.5/3? Better to be strict: distinction correct (1.5), no-trade explanation flawed (0). Call it 1.5/3.
  - (e2) 3/3 - perfect.

  Total: 3+4+3+4+1.5+3 = 18.5/25. Rounded to 19/25? But let's confirm deductions.

  More precisely:
  - (d) deserves 4/9: full credit for positive case (3 marks), partial for attempting zero-case but failing (1 mark). The "exhibit one" attempt is present but invalid.
  - (e1) 1.5/3: full credit for distinguishing priors vs agreement, zero for no-trade misconception.

  So 3(a)+4(b)+3(c)+4(d)+1.5(e1)+3(e2)=18.5 → 19/25 when rounded.

  The student's fundamental errors are: 
  1. Not realizing conditioning fails when cell has zero probability
  2. Overgeneralizing the no-trade theorem
  Otherwise excellent work.
answer: |-
  ### Mark: 19/25

  **General Comments:** The student demonstrates strong technical skills in parts (a)–(c) and (e2), with correct calculations and clear reasoning. However, part (d) contains a critical error in handling zero-probability states, and part (e1) misstates the no-trade theorem. The work is precise and insightful overall, but these errors warrant significant deductions.

  ---

  **Part (a) [3/3]**  
  **Feedback:** Correct. Ann's posteriors: \( P(E|A_1) = \frac{1}{2} \), \( P(E|A_2) = \frac{1}{3} \). Bob's posteriors: \( P(E|B_1) = \frac{1}{3} \), \( P(E|B_2) = \frac{1}{2} \). Disagreement occurs at \( \omega_1, \omega_2 \) (Ann: \( \frac{1}{2} \), Bob: \( \frac{1}{3} \)) and \( \omega_4, \omega_5 \) (Ann: \( \frac{1}{3} \), Bob: \( \frac{1}{2} \)). Agreement at \( \omega_3 \) (both \( \frac{1}{3} \)). Algebra and conclusions are flawless.

  ---

  **Part (b) [4/4]**  
  **Feedback:** Correct and well-justified. After one round:  
  - At \( \omega_1, \omega_2 \): Both update to \( \frac{1}{2} \).  
  - At \( \omega_3 \): Both update to \( 0 \) (since they learn the state is \( \omega_3 \notin E \)).  
  - At \( \omega_4, \omega_5 \): Both update to \( \frac{1}{2} \).  
  A second round confirms stability. Convergence to agreement at all states is verified. Process terminates after one full exchange (two announcements per agent).

  ---

  **Part (c) [3/3]**  
  **Feedback:** Correct. The common-knowledge partition is trivial (only \( \Omega \) is common knowledge at every state) because iterating knowledge operators covers all states. Aumann’s theorem requires common knowledge of posteriors to enforce agreement; initial disagreement is allowed as posteriors are not initially common knowledge. Disagreement resolves in (b) because announcements make posteriors common knowledge, triggering the theorem’s equality conclusion.

  ---

  **Part (d) [4/9]**  
  **Feedback:**  
  - **Positive case (3 marks):** Correctly shows no full-support common prior exists. Equations from belief maps:  
    - Ann: \( \frac{x_1}{x_1 + x_2} = \frac{3}{4} \Rightarrow x_2 = \frac{x_1}{3} \); \( \frac{x_3}{x_3 + x_4} = \frac{3}{4} \Rightarrow x_4 = \frac{x_3}{3} \).  
    - Bob: \( \frac{x_1}{x_1 + x_3} = \frac{1}{2} \Rightarrow x_3 = x_1 \); \( \frac{x_2}{x_2 + x_4} = \frac{1}{4} \Rightarrow x_4 = 3x_2 \).  
    Substituting \( x_3 = x_1 \) and \( x_2 = \frac{x_1}{3} \) gives \( x_4 = \frac{x_1}{3} \) and \( x_4 = 3 \cdot \frac{x_1}{3} = x_1 \), so \( \frac{x_1}{3} = x_1 \Rightarrow x_1 = 0 \), violating positivity.  
  - **Zero-probability case (1 mark for attempt, but incorrect):** Claims \( \mu \propto (3, 1, 1, 0) \) works, but **this is wrong**. Conditioning fails for Ann at \( A_2 = \{\omega_3, \omega_4\} \) because \( \mu(A_2) = \mu(\omega_3) + \mu(\omega_4) = 1 + 0 = 1 > 0 \), but \( \mu(\omega_4) = 0 \). Ann’s stipulated belief at \( A_2 \) is \( (0, 0, \frac{3}{4}, \frac{1}{4}) \), which assigns positive probability to \( \omega_4 \). However, \( \mu(\cdot \mid A_2) \) must assign probability \( \frac{\mu(\omega_4)}{\mu(A_2)} = \frac{0}{1} = 0 \) to \( \omega_4 \), contradicting \( \frac{1}{4} \). Conditioning is undefined for positive-probability events containing zero-probability states when beliefs require positive mass there.  
  **Correction:** No common prior exists even without positivity. The consistency equations require \( \mu(\omega_4) > 0 \) for Ann’s \( A_2 \)-belief to match, but Bob’s equations force \( \mu(\omega_4) = 0 \) (via \( x_4 = 3x_2 \) and \( x_2 = x_1/3 \), implying inconsistency). Acceptable bet route not used, but not required.

  ---

  **Part (e1) [1.5/3]**  
  **Feedback:**  
  - **Distinction (1.5 marks):** Correctly distinguishes common prior (shared ex ante belief updated by conditioning) from posterior agreement.  
  - **No-trade theorem (0 marks):** Misstated. Claims common prior alone implies no mutually acceptable trade ("any contract one gains from the other must lose from"). **This is false.** The no-trade theorem requires:  
    - Common prior,  
    - Common utility functions (or risk-neutral agents),  
    - **No aggregate uncertainty** (or common consumption value).  
  Conclusion: If posteriors are common knowledge, no trade occurs. The common prior alone does not prevent trade; e.g., with risk aversion or different utilities, trade can benefit both even with common priors. The error is overgeneralizing.

  ---

  **Part (e2) [3/3]**  
  **Feedback:** Perfect. Correctly argues that in the enlarged space (with message drops), no nontrivial event is common knowledge. From any state, agents consider histories where messages were dropped, allowing any state to be reached. Thus, the common-knowledge partition is trivial (\( \Omega \)), so Aumann’s theorem does not enforce agreement. Disagreement can persist indefinitely despite a common prior, as posteriors are never common knowledge.

  ---

  **Summary of Deductions:**  
  - (d): −5 (3 for zero-probability error, −0.5 for incorrect conclusion; positive case correct).  
  - (e1): −1.5 (no-trade explanation flawed).  
  All other parts full marks. Total: 19/25.
