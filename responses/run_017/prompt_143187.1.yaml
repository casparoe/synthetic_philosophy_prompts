     - *Question*: Was the agent's failure to act due to a prior omission by another party that removed the means, information, or authority necessary to act?
     - *If yes*: Then this is a borrowed omission. Proceed to analyze the prior omission (run this entire procedure on the prior omission). 
          - If the prior omission is found to be a cause, then the current omission is not a cause (it is a consequence of the prior omission). Stop.
