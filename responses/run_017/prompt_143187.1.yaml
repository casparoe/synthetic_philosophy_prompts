  We are designing a decision procedure for the panel to assess when an omission is a cause of harm in a medical incident. The procedure must be runnable in 45 minutes by non-experts and yield consistent results. 

  The key distinctions we have to capture are:
  1. The fragility of counterfactual reasoning: We must be cautious about assuming that if the omitted action had been taken, the harm would have been avoided.
  2. Cases where the omission is causal only because an independent backup was disabled.
  3. Cases where the agent would have been prevented from acting even if they had tried.
  4. Cases where the omission was due to an earlier omission by another party (which might lead to a "borrowed omission").
  5. The idea that an omission is only an omission relative to a norm, role, or expectation.

  We are also asked to formalize and critique a threefold distinction among omissions:
  - "Live omission": The agent could have acted and nothing would have stopped them.
  - "Blocked omission": The agent would have been prevented from acting even if they tried.
  - "Borrowed omission": The agent did not act because an earlier omission by another party removed the means, information, or authority to act.

  We must determine whether "borrowed omission" is distinct or collapses into "blocked" or ordinary causation.

  The procedure must have:
  - A fixed order of questions.
  - Clear sufficient answers for each question.
  - An explicit stop that returns "not a cause".
  - Hand-offs to a person when what remains is a decision about obligations (norms) rather than causation.

  We will then run the procedure on three cases.

  Finally, we must note the limitations of the procedure, especially regarding preventing recurrence and disputed norms.

  **Design of the Decision Procedure**

  We break the procedure into steps:

  1. **Establish the omission relative to a norm**: We must first confirm that there was an omission (i.e., a failure to act) that violated a norm, role, or expectation. Without a norm, there is no omission. If the norm is disputed, we hand off to a separate process (e.g., a policy review) because the existence of the norm is a prerequisite.

  2. **Counterfactual test**: Would the harm have been avoided if the action had been taken? If not, then the omission is not a cause. This step addresses the fragility of counterfactuals by requiring that the avoidance of harm must be more likely than not in the scenario where the action is taken.

  3. **Check for blocking**: Would the agent have been prevented from acting even if they had tried? If yes, then it's a blocked omission and not a cause.

  4. **Check for borrowing**: Was the omission due to an earlier omission by another party that removed the means, information, or authority? If so, then we note that the omission is "borrowed" and we must then assess the earlier omission. However, we must be cautious not to let this lead to an infinite regress. We will handle this by redirecting the analysis to the earlier omission (if it hasn't been analyzed yet) and then returning to the current one only if the earlier omission is found to be non-causal. But note: if the earlier omission is the cause, then the current omission might be a consequence and not an independent cause.

  5. **Check for disabled backup**: Was the omission causal only because an independent backup system had been disabled by a prior act? If so, then the prior act (that disabled the backup) might be the more proximate cause.

  We must also consider that an omission might be a background condition if it is too remote or if it is part of the normal state of affairs that does not by itself cause the harm.

  We structure the procedure as a flowchart of questions:

  **Decision Procedure Steps:**

  1. **Is there an omission?** 
     - *Definition*: An omission is a failure to perform an action that was expected by a norm, role, or protocol.
     - *Sufficient answer*: Yes, if there was a clear expectation (from a protocol, job description, or specific instruction) that the action should have been performed, and it was not. 
     - *If no*: Stop. This is not an omission. (But note: if the norm is disputed, hand off to a separate process to determine the norm. Then, if the norm is established, proceed. If not, stop.)
     - *If yes*: Proceed to step 2.

  2. **Counterfactual test**: 
     - *Question*: If the omitted action had been taken, would the harm have been avoided (with a probability >50%)? 
     - *Sufficient answer*: We require a clear causal chain: if the action had been taken, it would have interrupted the chain of events leading to harm. 
     - *If no*: Stop. The omission is not a cause (it might be a background condition or irrelevant). 
     - *If yes*: Proceed to step 3.

  3. **Blocking test**: 
     - *Question*: If the agent had attempted to perform the action, would they have been prevented from succeeding by an external factor? 
     - *Sufficient answer*: Evidence that even if the agent had tried, the action would have failed (e.g., equipment was broken, a policy would have forbidden it, or another person would have stopped it). 
     - *If yes*: Then it is a blocked omission. Stop. The omission is not a cause (because the harm would have occurred anyway). 
     - *If no*: Proceed to step 4.

  4. **Borrowing test**: 
     - *Question*: Was the agent's failure to act due to the prior omission of another party that removed the means, information, or authority to act? 
     - *Sufficient answer*: Evidence that the agent did not act because they lacked the necessary resources (which were supposed to be provided by another) or because they were misinformed (due to someone else's failure) or because they were not authorized (due to a prior failure in delegation). 
     - *If yes*: Then this is a borrowed omission. We must then analyze the prior omission (go to step 1 for the prior omission). After analyzing the prior omission, if the prior omission is found to be a cause, then the current omission is a consequence and not an independent cause. We then mark the current omission as "borrowed" and non-causal (unless the prior omission is found non-causal, then we might need to reconsider). However, to avoid loops, we note that the causal responsibility lies with the prior omission if it is causal. Therefore, for the current omission, we can stop and return "not a cause" (because the cause is the prior omission). But wait: what if the prior omission is not found to be causal? Then we must reconsider the current omission without the borrowing? We'll adjust: 
          - If the borrowing test is positive, then we analyze the prior omission (run the entire procedure on the prior omission). 
          - If the prior omission is found to be a cause, then the current omission is not an independent cause (it is a borrowed omission and non-causal). 
          - If the prior omission is not a cause, then we go back to the current omission and proceed to step 5 (because the borrowing was not the cause, so we must check other factors). 
     - *If no*: Proceed to step 5.

  5. **Disabled backup test**: 
     - *Question*: Was the harm caused by the omission only because an independent backup system (that would have prevented the harm) had been disabled by a prior act? 
     - *Sufficient answer*: Evidence that there was a backup system that was designed to prevent this harm and that it was disabled (by an act or omission) and that if it had been functional, it would have prevented the harm. 
     - *If yes*: Then the prior act (that disabled the backup) is the primary cause. We mark the current omission as non-causal (because the harm would not have occurred if the backup had been functional, regardless of the omission). We then run the procedure on the prior act (if it was an omission, then start at step 1 for that omission; if it was a positive act, then we note it as a cause and stop for the current omission). 
