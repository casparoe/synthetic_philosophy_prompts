  Below is a structured decision procedure for your panel, grounded in the philosophical and practical distinctions of causation by omission. It addresses your requirements: fixed order, clear sufficient answers, explicit stops, hand-offs for norm disputes, and avoidance of recurrence bias. The procedure formalizes and critiques your "live," "blocked," and "borrowed" omission categories, and includes safeguards against common pitfalls.

  ---

  ### **Decision Procedure: Causality of Omission in Harm Events**
  **Time:** Designed for 45-minute reviews.  
  **Inputs:** Incident facts, norms/protocols, agent roles.  
  **Outputs:** "Cause," "Contributed to," "Background," or "Not an omission."  
  **Key Rules:**  
  - Stop at the first "no" unless redirected.  
  - Hand off norm disputes to hospital policy/ethics leads (not the panel).  
  - Never infer causation from prevention goals.  

  #### **Step-by-Step Questions**  
  **Fixed order. Answer "yes" or "no" with evidence. Stop if criteria unmet.**

  1. **Was there a defined duty to act?**  
     - *Check:* Existence of a clear norm, protocol, or role expectation requiring action (e.g., policy document, job description).  
     - *Sufficient "yes":* Written protocol or explicit role duty at the time.  
     - *No/Unclear:* **Stop → "Not an omission."**  
     - *Norm disputed?* **Hand off** to policy/ethics leads. Do not proceed until resolved.  

  2. **Would timely action have *likely* prevented harm?**  
     - *Check:* Counterfactual where action occurs. Harm avoidance must be >50% probable (e.g., "escalation would typically trigger intervention").  
     - *Sufficient "yes":* Historical data, expert input, or logical chain showing harm avoidance.  
     - *No:* **Stop → "Background condition"** (e.g., harm inevitable).  

  3. **Was the agent *able* to act?**  
     - *Check:* Physical, cognitive, and resource-based capacity at the time (e.g., staff, tools, knowledge).  
     - *Sufficient "yes":* No barriers (e.g., staffing adequate, equipment available).  
     - *No:* **Stop → "Blocked omission" → "Background condition."**  
       - *Includes:* Prevented by external factors (e.g., locked door, policy override).  

  4. **Was the omission due to a *prior omission* removing means/information/authority?**  
     - *Check:* Another party's earlier failure caused inability (e.g., missing data due to unreported result).  
     - *Sufficient "yes":* Direct link (e.g., "nurse couldn’t escalate because pager battery dead due to prior maintenance skip").  
     - *No:* Proceed to Step 5.  
     - *Yes:* **Redirect** to analyze the *prior omission* with this procedure.  
       - If prior omission is causal → Current is **"Borrowed omission" → "Background condition."**  
       - If prior omission is *not* causal → Return to current omission and proceed to Step 5.  

  5. **Was a functional backup available?**  
     - *Check:* Independent system/process that *should* have prevented harm if active (e.g., alarm, secondary review).  
     - *Sufficient "yes":* Backup existed but was disabled/dysfunctional.  
     - *No or not applicable:* Proceed to Step 6.  
     - *Yes:* **Redirect** to analyze the *backup’s disablement*.  
       - If backup disablement is causal (act or omission) → Current omission is **"Background condition."**  
       - If backup disablement is *not* causal → Proceed to Step 6.  

  6. **Conclusion: Omission as cause.**  
     - If all prior steps "yes" and no redirects apply → **"Cause."**  

  ---

  ### **Critique of "Live," "Blocked," and "Borrowed" Omissions**  
  - **Live omission (Step 3 "yes"):** "Agent could have acted, nothing would have stopped them." *Verdict:* Valid and causal if Steps 1–2/4–6 align.  
  - **Blocked omission (Step 3 "no"):** "Agent would have been prevented." *Verdict:* Valid; non-causal as defined.  
  - **Borrowed omission (Step 4 "yes"):** "Agent didn’t act due to another’s earlier omission." *Verdict:* **Distinct but non-causal.** Does *not* collapse:  
    - "Borrowed" focuses on *dependence* (e.g., "couldn’t act because prior failure removed tools").  
    - "Blocked" focuses on *immediate prevention* (e.g., "tried but physically stopped").  
    - "Borrowed" is **not** ordinary causation: It is a *relay* of responsibility to the prior omission. If the prior omission is causal, the current one is background.  

  ---

  ### **Case Applications**  
  **Case 1: Night nurse did not escalate; doctor’s pager battery dead.**  
  1. **Duty?** Yes (nurse must escalate deterioration).  
  2. **Prevent harm?** **No** → If escalated, pager dead → doctor not alerted → harm occurs. **Stop → "Background."**  
     - *Not "blocked" or "borrowed"*: Nurse *could* have escalated (Step 3 "yes"), but Step 2 fails.  

  **Case 2: Maintenance skipped calibration; independent alarm muted.**  
  1. **Duty?** Yes (scheduled calibration).  
  2. **Prevent harm?** Yes (calibration would have caught sensor error).  
  3. **Able?** Yes (no barriers).  
  4. **Borrowed?** No (not caused by prior omission).  
  5. **Backup?** **Yes** → Functional alarm would have prevented harm. **Redirect** to alarm disablement.  
     - *Alarm mute (by contractor):*  
       1. Duty? Yes (alarms must be active).  
       2. Prevent harm? Yes (alarm would have alerted staff).  
       3. Able? Yes (contractor could have unmuted).  
       4. Borrowed? No.  
       5. Backup? Not applicable.  
       6. **Cause** (contractor’s omission).  
     - **Maintenance omission → "Background."**  

  **Case 3: Consultant did not review scan; registrar also didn’t act.**  
  1. **Duty?** **Hand off** (disputed: delegation may negate duty). *Assume policy says consultant retains oversight.*  
     - If duty confirmed → Proceed.  
  2. **Prevent harm?** **No** → Even if consultant reviewed, she would not have acted (per case: "nothing would change"). **Stop → "Background."**  
     - *Panel may dislike this*, but causation fails on counterfactual.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Prevent recurrence ≠ Causation:**  
     - The procedure isolates factual causation. If an omission is "background" or "not causal" (e.g., Case 1), it may still warrant an action plan for risk reduction. This must be documented separately to avoid smuggling prevention into causality.  

  2. **Disputed norms:**  
     - If the norm itself is contested (e.g., "Was staffing *actually* required to be X?"), Step 1 mandates a **hand-off**. The panel cannot arbitrate norms; it relies on policy leads.  

  3. **Limitations:**  
     - **Not for positive acts:** Only assesses omissions.  
     - **Complex chains:** May require multiple passes for interdependent omissions.  
     - **Uncertain evidence:** Relies on available facts; ambiguities trigger "no" in steps.  
     - **No blame allocation:** Determines causal role, not accountability.  

  ---

  ### **Procedure Summary**  
  ```mermaid
  graph TD
      A[Step 1: Duty to act?] -->|Yes / Norm clear| B[Step 2: Prevent harm?]
      A -->|No| H["Stop: Not an omission"]
      A -->|Norm disputed| I["Hand off to policy"]
      B -->|Yes| C[Step 3: Able to act?]
      B -->|No| J["Stop: Background"]
      C -->|Yes| D[Step 4: Borrowed?]
      C -->|No| K["Stop: Blocked → Background"]
      D -->|Yes| L["Redirect to prior omission"]
      D -->|No| E[Step 5: Backup?]
      E -->|Yes / Backup causal| M["Prior cause → Background"]
      E -->|No or N/A| F["Step 6: Cause"]
  ```

  This procedure ensures consistency, mitigates philosophical complexities, and addresses your core concerns. Use it as a checklist during reviews, with a scribe documenting answers at each step.
