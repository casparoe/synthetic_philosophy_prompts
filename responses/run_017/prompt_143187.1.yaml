  **Critique of the three categories:**

  - **Live omission**: The agent could have acted and nothing would have stopped them. This maps to: step 3 (blocking) is negative and step 4 (borrowing) is negative and step 5 (backup) is negative? And step 2 is positive. Then it's causal.

