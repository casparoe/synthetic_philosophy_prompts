  **Note on Multiple Omissions**: If there are multiple omissions, run the procedure for each one separately. However, note that the procedure might redirect to prior omissions. We must avoid infinite loops by ensuring that each omission is only analyzed once (unless redirected by the borrowing test). We recommend starting with the most immediate omission and then working backwards if necessary.

