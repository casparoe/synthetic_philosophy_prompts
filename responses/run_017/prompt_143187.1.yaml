  But note: the disabled backup test is about whether the omission was a cause only because the backup was down. In such a case, the primary cause is the disabling of the backup. However, if the omission itself is the cause and the backup being down is a background condition, then the omission is still a cause. We must be careful: the question is whether the backup, if functional, would have prevented the harm independently of the omission. If so, then the disabling of the backup is the cause. If the omission is necessary even with the backup down, then the omission is a cause.

  But in our step 5, we are asking: was the harm caused by the omission only because the backup was disabled? This is equivalent to: if the backup had been functional, would the harm have been avoided even if the omission occurred? If yes, then the omission is not a cause because the harm only occurred because the backup was down. Then we look to what caused the backup to be down.

  We adjust step 5:

  5. **Backup test**:
     - *Question*: If the independent backup system had been functional, would the harm have been avoided even if the omitted action had not been taken?
     - *Sufficient answer*: Evidence that the backup system was designed to prevent the harm and that it was not functional at the time, and that if it had been functional, it would have prevented the harm.
     - *If yes*: Then the cause of the harm is the event that disabled the backup. We then run the procedure on the event that disabled the backup (if it was an omission, start at step 1; if a positive act, then that act is a cause). The current omission is not a cause (it is a background condition). Stop for the current omission.
     - *If no*: Then the omission is a cause.

  But note: in step 2 we already established that if the omitted action had been taken, the harm would have been avoided. So if the backup test is positive, it means that even without the omitted action, the backup would have prevented the harm (if it had been working). Therefore, the harm occurred only because the backup was down. So the disabling of the backup is the cause.

  However, if the backup test is negative, then the omission is still a necessary condition (because without the action and without the backup, the harm occurred) and hence a cause.

  But note: step 5 might be skipped if there is no independent backup system. We can make it conditional: only if there was a backup system that was disabled.

  Therefore, we restructure step 5 as optional:

  5. **Backup test (if applicable)**:
     - *Condition*: Only if there was an independent backup system that was not functional at the time of the incident.
     - *Question*: If the backup system had been functional, would it have prevented the harm even if the omitted action had not been taken?
     - *If yes*: Then the omission is not a cause. We then run the procedure on the event that disabled the backup (if it is an omission, start at step 1; if a positive act, then that act is a cause). Stop for the current omission.
     - *If no*: Then the omission is a cause. Proceed to step 6 (which is just the conclusion).

  But note: if the backup test is not applicable, then we go straight to concluding that the omission is a cause.

  However, we must also consider that there might be multiple backups? We are considering only the independent backup that is directly relevant.

  **Revised Steps:**

  1. **Omission?** (with hand-off for norm dispute)
  2. **Counterfactual**: Would harm have been avoided if action taken?
     - No: stop (not a cause).
     - Yes: go to 3.
  3. **Blocking**: Would the agent have been prevented?
     - Yes: blocked omission, stop (not a cause).
     - No: go to 4.
  4. **Borrowing**: Was the omission due to a prior omission by another that removed means/info/authority?
     - Yes: then analyze the prior omission (go to step 1 for that prior omission).
       - If the prior omission is found to be a cause, then the current omission is not a cause (borrowed, non-causal).
       - If the prior omission is not a cause, then go back to the current omission and go to step 5 (if backup test applicable) or 6.
     - No: go to step 5 (if backup test applicable) or 6.
  5. **Backup test (if applicable)**: Would the functional backup have prevented the harm even without the action?
     - Yes: then the omission is not a cause (because the harm is due to the backup being down). Then analyze the cause of the backup being down (if omission, run procedure; if positive act, that act is a cause). Stop for current omission.
     - No: then the omission is a cause. Go to 6.
  6. **Conclusion**: The omission is a cause.

  But note: what if in step 4 we have a prior omission that is not a cause? Then we proceed to step 5 for the current omission. This means that even though the current omission was borrowed, the prior omission was not causal, so the current omission might be causal? 

