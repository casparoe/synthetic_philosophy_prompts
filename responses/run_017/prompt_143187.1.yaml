  But if we run the procedure on Nurse A and find that the prior omission (by A) is not a cause (maybe because even if A had given the info, B would not have acted? or because the info wouldn't have changed the outcome?), then we go back to Nurse B and now we have to test Nurse B without the borrowing. But wait: without the borrowing, we already know that B did not act because of the missing info. But we are now at step 5 for B. We must then ask: was there a backup? and so on.

