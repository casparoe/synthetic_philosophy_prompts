     - *If yes*: Proceed to Step 3.

  **Step 3: Blocking Test**
     - *Question*: If the agent had attempted to perform the action, would they have been prevented from succeeding by an external factor (e.g., broken equipment, policy barrier, physical barrier, or another person stopping them)?
     - *If yes*: Stop. The omission is a blocked omission and not a cause.
     - *If no*: Proceed to Step 4.

