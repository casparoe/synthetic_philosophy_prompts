  **Limitations of the Procedure**

  1. **Preventing recurrence**: The procedure is designed to determine causation, not to assign blame or to prevent recurrence. An omission might be a background condition or non-causal but still be a breach of protocol that should be addressed. The panel must separate causal findings from findings about protocol breaches and opportunities for improvement.

