answer: |-
  ### Joint Statement on the Nature of 'a'-ness: Schema vs. System Perspectives  
  *Produced via adversarial collaboration between proponents of the Schema and System theories of letter identity.*

  #### Part 1: Agreed Claims  
  Both camps endorse the following non-vacuous claims, grounded in observable phenomena. Claims 5 and 7 would have been initially contested by one side but are now accepted as robust.  

  1. **Conventional grounding**: Letters are cultural artifacts, not natural kinds. Their identity depends on human practices, not intrinsic physical properties.  
  2. **Formal variation is unproblematic**: Two-storey ‘a’, single-storey ‘ɑ’, handwritten scrawls, and stylized variants (e.g., in swapped-shape fonts) all function as ‘a’ in appropriate contexts.  
  3. **Role in contrastive systems**: A mark is an ‘a’ only if it occupies a position in a system of distinctions (e.g., differentiating "cat" from "cot"). Isolated marks lack determinate identity.  
  4. **Allography as stylistic variation**: In a font with both ‘a’ and ‘ɑ’ as contextual alternates for the same codepoint, they represent one letter. The choice is stylistic, not categorical (e.g., Latin ‘a’ vs. Greek ‘α’).  
  5. **Templates are descriptive, not constitutive**: Cognitive templates (stored patterns) exist for recognition/production but are *effects* of systemic practice, not foundations of identity. Neither camp treats them as ontologically necessary.  
  6. **Intentionality and uptake can diverge**: If a child intends ‘a’ but produces a mark unanimously read as ‘u’, it functions as ‘u’. Conversely, if a mark unintended as ‘a’ is unanimously read as ‘a’, it *is* ‘a’ for readers.  
  7. **No stable "ur-form"**: No physical or abstract shape (e.g., stroke sequence, contour) is common to all ‘a’s across scripts, media, and historical stages.  
  8. **Context overrides history**: A mark’s current role in a system supersedes its origin. If a shape created via an ‘a’-generating routine is repurposed as ‘b’ in a new system, it becomes ‘b’.  

  *Surprising concessions*:  
  - **Schema camp** accepts claim 5: Templates are byproducts, not causes (contra initial "schema-as-essence" view).  
  - **System camp** accepts claim 7: No form is universal (contra initial "family resemblance" hedging).  

  #### Part 2: Disagreements Table  
  | Issue | Schema Camp Claim | System Camp Claim | Disagreement Type |  
  |-------|-------------------|-------------------|------------------|  
  | **What constitutes ‘a’-ness?** | ‘a’-ness is defined by satisfaction of an abstract schema: a topological arrangement of parts (e.g., closed bowl + open terminal) with parametric tolerance (e.g., storey count). | ‘a’-ness is defined by occupying the ‘a’ role in a contrastive system, maintained through reproducible practices of inscription/recognition. | Genuine: Schema roots identity in form; System in functional role. |  
  | **Can a non-schematic mark be ‘a’?** | A mark violating the ‘a’ schema (e.g., lacking a bowl) cannot be ‘a’, even if consistently read as ‘a’ in a system. Form constrains possible identity. | Any mark can be ‘a’ if reliably produced/read as occupying the ‘a’ role, regardless of form. Function determines identity. | Genuine: Dispute over whether form is a constraint (Schema) or merely evidence (System). |  
  | **The orphan glyph (40% ‘a’, 60% ‘o’)** | The glyph is an ‘a’ *by origin* (generated via ‘a’ schema) but ambiguous *in performance*. Its identity is latent, awaiting contextual disambiguation. | The glyph has no fixed identity; it is ‘a’ only when read as such in a system. Isolated, it is an ‘a’-candidate at best. | Verbal: “Identity” = schema compliance vs. systemic role. *Cashed out*: If identity requires contextual activation (System) or pre-exists context (Schema). Settling this would clarify whether misread glyphs retain latent identity. |  
  | **Production vs. uptake primacy** | When production (intent/design) and uptake conflict, the mark’s identity is determined by its fit to the schema (e.g., a child’s ‘u’-shaped intent for ‘a’ is non-‘a’). | When production and uptake conflict, uptake prevails (e.g., a child’s mark read as ‘a’ *is* ‘a’, regardless of intent). | Stipulation-dependent: Schema assumes form determines fit; System assumes uptake determines role. Neither can stipulate priority; real cases (e.g., Part 3) must decide. |  

  #### Part 3: Cruxes  
  Predictions for concrete cases, pre-registered to test theories.  

  | Case | Schema Camp Prediction | System Camp Prediction |  
  |------|------------------------|------------------------|  
  | **Permuted typeface** (typed ‘a’ outputs ‘e’-shape, read fluently as ‘a’ after adaptation): | The ‘e’-shape remains an ‘e’ schema instance; readers *map* it to ‘a’ but do not redefine it as ‘a’. | The ‘e’-shape *becomes* ‘a’ by occupying that role; schema is irrelevant. |  
  | **Orphan glyph** (from ‘a’ routine, 40% read as ‘a’, 60% as ‘o’ in isolation): | Glyph is inherently ‘a’ (by schema), but noise causes misrecognition. | Glyph has no identity; readings reflect probabilistic associations, not essence. |  
  | **Invented script** (26 shapes, Latin-like contrasts, no historical/shape overlap): | Shapes are *analogs* of Latin letters but not ‘a’, ‘b’, etc., lacking schema compliance. | The shape in the ‘a’ position *is* ‘a’ if the script sustains Latin-like contrasts. |  
  | **Child’s mark intended as ‘a’ but read as ‘u’ by all**: | Non-‘a’ (fails schema and intent). | Non-‘a’ (uptake fails; no systemic role). |  
  | **Child’s mark intended as ‘u’ but read as ‘a’ by all**: | Non-‘a’ (fails schema despite uptake). | ‘a’ (uptake establishes role; intent irrelevant). |  
  | **New: Drift Simulation** (100 writers copy an ‘a’; each slightly alters it. Final shape resembles ‘o’, but all use it as ‘a’): | Identity breaks when the schema is violated (e.g., bowl closure lost); final shape is ‘o’. | Identity persists if functional role is maintained; final shape is ‘a’. |  

  #### Part 4: What Would Move Us  
  - **Schema camp**: We abandon our core claim if a mark consistently functions as ‘a’ *despite violating all known schemas* (e.g., in the invented script, a triangle is read/written as ‘a’ with no resemblance to any ‘a’ schema).  
  - **System camp**: We abandon our core claim if a mark perfectly matches the ‘a’ schema but *cannot function as ‘a’ in any system* (e.g., in the permuted typeface, the schema-compliant ‘a’-shape is universally rejected as ‘not a’).  
  - **Shared settlement criterion**: A case where form and function dissociate *irreducibly* (e.g., the drift simulation ends with a shape that matches the ‘o’ schema but is uncontroversially used as ‘a’). This would demand a third theory, not restate ours.  

  ---  
  *Collaborative note: This statement isolates empirical tensions. Resolving them requires behavioral tests (e.g., measuring recognition thresholds in permuted/drift systems), not conceptual wins.*  
  **Word count**: 1,218.
