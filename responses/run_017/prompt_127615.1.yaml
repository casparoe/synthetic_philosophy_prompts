  We are drafting a joint statement from an adversarial collaboration between the Schema camp and the System camp on the question: "What makes every 'a' an 'a'?" The goal is to present both views fairly and identify areas of agreement, disagreement, and cruxes that could resolve the dispute.

  ### Part 1: Agreed Claims

  Both camps agree on the following points, numbered 1 to 8 (as requested, 8 to 12 claims, but we'll aim for 8 to keep it tight and non-vacuous; note: 8 is within the range). Each claim must be non-vacuous and at least two should be surprising or deniable by one side going in.

  1. **Conventionality of Letters**: Letters are conventional symbols; their forms and identities are not determined by natural necessity but by human practices.
  2. **Variability of Form**: There is no single physical form that all and only instances of 'a' must share. The letter 'a' can appear in two-storey, single-storey, handwritten, or stylized forms without ceasing to be 'a'.
  3. **Functional Role**: The identity of a letter is tied to its function in a writing system. An 'a' serves as a contrastive unit in an alphabet, distinguishing words from one another.
  4. **Allography**: In a single font that includes both 'a' and 'ɑ' as stylistic alternates for the same textual position (e.g., in a font with a single codepoint but multiple glyphs selectable by context), both are representations of the same letter. The choice is a matter of stylistic variation within the same graphemic category.
  5. **Template as a Possible but Not Necessary Mechanism**: A stored template (a mental or cultural schema) may be a common mechanism for recognition and production, but it is not the only possible mechanism. Both camps agree that such templates exist for many readers/writers, but the System camp denies that they are constitutive of letter identity.
  6. **Production and Uptake Can Diverge**: There are cases where the producer's intention (production history) and the reader's interpretation (uptake) come apart. For example, if a child intends to write an 'a' but produces a mark that readers consistently interpret as 'u', the mark is not an 'a' in that context. Conversely, if a mark is intended as something else but is read as 'a', it functions as an 'a' for those readers.
  7. **Context Dependency**: The interpretation of a mark as a particular letter is context-dependent. The same shape might be read as different letters in different systems (e.g., in a permuted alphabet).
  8. **Historical and Cultural Embeddedness**: The identity of a letter is historically and culturally situated. A mark that looks like an 'a' but appears in an unrelated script (e.g., a Cyrillic letter) is not an 'a' because it does not occupy the 'a' position in the Latin system.

  Surprising/deniable claims:
  - For the Schema camp, claim 6 (production and uptake can diverge) might have been initially resisted because they emphasize form, but they accept that function can override form in cases of divergence.
  - For the System camp, claim 5 (template as a possible mechanism) might be acceptable but they would deny it is necessary, so agreeing it exists as one mechanism is a concession.

  ### Part 2: Disagreements Table

  We present the key disagreements in a table. Each row addresses a specific issue. The columns are:
  - Issue
  - Schema camp's claim (in their own words)
  - System camp's claim (in their own words)
  - Nature of disagreement: genuine, verbal, or stipulation-dependent.

  We must phrase each camp's claim as they would sign it. For verbal disagreements, we'll cash it out by naming the two candidate meanings and what would make each right. For stipulation-dependent, we'll say whose stipulation and why it can't be made.

  | Issue | Schema Camp Claim | System Camp Claim | Nature of Disagreement |
  |-------|-------------------|-------------------|------------------------|
  | **Constitutive Basis of Letter Identity** | A letter is an 'a' if and only if it instantiates the abstract schema for 'a'. This schema consists of a set of parts (e.g., a bowl, a stem, a terminal) in a specific topological arrangement (e.g., the bowl must be attached to the stem, the terminal must be open), with allowable metric variations (e.g., size, proportion). Style is the variation within these parameters. | A letter is an 'a' if and only if it is produced and recognized as occupying the contrastive position of 'a' in the Latin alphabet. The form is only a conventional sign of that role; the role itself is maintained by practices of production and interpretation. | Genuine disagreement. The Schema camp holds that form (via schema) is constitutive, while the System camp holds that systemic role is constitutive and form is evidential. |
  | **Necessity of Shared Form** | There must be a shared abstract form (the schema) that all 'a's satisfy. Without this, we cannot explain the stability of letter identity across variations. | There is no shared form (abstract or otherwise) that is necessary and sufficient for 'a'-ness. The only thing shared is the functional role in the system. | Genuine disagreement. The Schema camp insists on a form-based commonality, while the System camp denies it. |
  | **The Orphan Glyph Case** | If a glyph, when shown in isolation, is not reliably recognized as 'a' by a majority of readers (e.g., 40% say 'a', 60% say 'o'), then it does not fully instantiate the 'a' schema. It may be an ambiguous or poorly formed schema instance, but it is not a prototypical 'a'. | If a glyph is produced by the 'a' routine in a typeface but is misread by the majority, then in that context, it fails to function as an 'a'. Its production history does not override its failure to be recognized; thus, it is not an 'a' in that system at that time. | Genuine disagreement. Schema focuses on the generative process and schema satisfaction (which might be imperfect), while System focuses on recognition in context (even if isolated). |
  | **The Possibility of a Stored Template** | A stored template (the schema) is necessary for letter recognition and production. It is the cognitive basis for why we see diverse forms as the same letter. | A stored template may exist as a cognitive aid, but it is not necessary for letter identity. Identity is maintained by the system of contrasts and practices; templates are learned approximations of the system's demands. | Partly verbal and partly genuine. Verbal: "template" might mean different things. For Schema, it's a defining structure; for System, it's a heuristic. Genuine: Schema says it's necessary; System says it's not. Cashing out: If "template" means a mental representation that must be matched, then Schema is right if such matching is always required. But System says the system can work without it (e.g., in the permuted alphabet, readers learn new mappings without new templates). What changes: If we found a case where letter identity is maintained without any stored form (e.g., by pure relational positioning), System would be supported. |
  | **Allography in a Single Font** | In a font that includes both 'a' and 'ɑ' as alternates, both are the same letter because both satisfy the same abstract schema (with parameters for one or two storeys). The schema allows for this variation. | In a font with both 'a' and 'ɑ' as alternates, both are the same letter because they are used interchangeably in the same contrastive position. The font's design treats them as stylistic variants of one grapheme. | Stipulation-dependent on the definition of "schema". Schema camp's schema must be broad enough to cover both, but they can define it that way. System camp doesn't care about the form. But both agree they are the same letter, so no real disagreement here. We remove this row? No, because the issue is about why they are the same. But both camps agree on the outcome, so the disagreement is only in the explanation. It's genuine in that the explanations differ, but they don't conflict in a testable way? We might say it's verbal: "same letter" means same schema instance for Schema, same systemic role for System. But both agree they are the same, so it's not a disagreement about the fact. We'll skip this as it's covered in agreements. |
  | **The Invented Script Case** | A mark in an invented script that has the same contrast structure as Latin but no shared forms cannot be an 'a' because it does not instantiate the 'a' schema. It may be analogous, but it is not an 'a'. | A mark in an invented script that occupies the same contrastive position as 'a' in a system isomorphic to Latin is functionally equivalent to an 'a'. If it is used as such, it is an 'a' in that system, even without shared form. | Genuine disagreement. Schema requires historical connection to the Latin schema; System does not. |

  We remove the allography row since both agree they are the same letter, just for different reasons. We have 5 rows.

  ### Part 3: Cruxes

  We present 4 cruxes (as per the request, and one more if we can think of a better one). For each, we describe the concrete case and each side's prediction.

  1. **The Permuted Typeface Case**  
     - **Case**: A book set entirely in a permuted typeface: the shapes are permuted by one big cycle (e.g., when the author types 'a', the shape that appears is the one normally read as 'e'). Consistent for 200 pages. Readers adapt and read fluently after an hour.  
     - **Schema Prediction**: After adaptation, readers will mentally remap the shapes to the letters. The shape that was 'e' is now functioning as 'a' because it is used in the 'a' slot, but it does not become an instance of the 'a' schema. It remains an 'e' shape used as an 'a'.  
     - **System Prediction**: The shape that appears when 'a' is typed becomes the new 'a' for that system. It occupies the 'a' position and is read as such, so it is an 'a' in that context.  

  2. **The Orphan Glyph Case**  
     - **Case**: A glyph comes from the typeface's 'a' routine (so it was generated by the 'a' schema in design). Shown in isolation to 100 readers: 40 read it as 'a', 60 as 'o'.  
     - **Schema Prediction**: The glyph is an 'a' because it was generated by the 'a' schema, even if recognition is imperfect. The misrecognition is due to context absence or ambiguity in the schema's realization.  
     - **System Prediction**: In isolation, without context, the majority reading determines its identity. Since most read it as 'o', it is not an 'a'; it's an 'o' or ambiguous. The production history doesn't matter.  

  3. **The Invented Script Case**  
     - **Case**: An invented script with 26 elements, structurally identical to Latin in contrasts (e.g., minimal pairs work the same), no shared shapes, no historical connection.  
     - **Schema Prediction**: The element in the 'a' position is not an 'a' because it doesn't share the 'a' schema. It's a different letter (say, 'alpha') in a different script.  
     - **System Prediction**: The element in the 'a' position is an 'a' because it plays the same contrastive role. If the script is used for English, it is an 'a'.  

  4. **The Child's Mark Cases**  
     - **Case A**: Child intends 'a', produces a mark that every reader reads as 'u'.  
       - Both agree: It's a 'u' in function, not an 'a'.  
     - **Case B**: Child intends something else (say, 'u'), but produces a mark that every reader reads as 'a' and praises her.  
       - **Schema Prediction**: The mark satisfies the 'a' schema, so it is an 'a', regardless of intention.  
       - **System Prediction**: The mark is read as 'a', so it functions as an 'a' and is an 'a' in that context. Intention doesn't override function.  
     - **Crux**: For Case B, both agree it's an 'a', but for different reasons. So we need a different separation. Instead, we can use:  
     - **New Case: The Ambiguous Mark in Context**  
       - **Case**: In a word, a mark is ambiguous (like the orphan glyph) but in context (e.g., in the word "cat"), it is read as 'a' by all. However, when shown alone, it's read as 'o' by 60%.  
       - **Schema Prediction**: In context, it is an 'a' because the context disambiguates the schema (e.g., the word context activates the 'a' template).  
       - **System Prediction**: In context, it functions as 'a', so it is an 'a'. In isolation, it might not.  

     But this is not new. Let's think of a better crux:  

  5. **The Morphing Glyph Case (New)**  
     - **Case**: A digital font where the glyph for 'a' gradually morphs over time (e.g., from two-storey to single-storey) across a long document. The change is imperceptible per page, but over 100 pages, it becomes a different shape (say, one that looks like 'o'). Readers never notice and read it as 'a' throughout.  
     - **Schema Prediction**: At some point, the glyph no longer satisfies the 'a' schema (it might fit the 'o' schema). But since readers don't notice, they might be misreading it or the schema has shifted.  
     - **System Prediction**: Since readers continue to read it as 'a' without error, it remains an 'a' throughout. The form change doesn't matter as long as the function is maintained.  

     This separates the camps: Schema requires form within schema bounds, System relies on function.  

  We'll use 5 cruxes: the 4 given (with Child's Mark Case B as is, but note both agree it's 'a' so it doesn't separate; we'll adjust) and the new one.

  Revised cruxes:

  1. Permuted Typeface
  2. Orphan Glyph
  3. Invented Script
  4. Child's Mark Case B (intention vs. uptake) - but both agree it's 'a', so it doesn't separate. Instead, we use:
     **4. The Intentional Mismatch in a System**: A writer consistently uses a mark that fits the 'o' schema to represent the 'a' sound in a private document. Readers (if any) would misread it, but the writer always intends 'a'.  
     - **Schema Prediction**: The mark is an 'o' (by form) and not an 'a'.  
     - **System Prediction**: For the writer, it is an 'a' because it occupies that role in their system. For readers, it's not. But without shared practice, it's not part of a social system.  
     This is messy. We stick to the original cases and add the morphing glyph.

  Final 5 cruxes:

  1. Permuted Typeface
  2. Orphan Glyph
  3. Invented Script
  4. Morphing Glyph (new)
  5. Child's Mark Case A: intended 'a' but read as 'u' by all. Both agree it's 'u', so it doesn't separate. Instead, we use Case B with a twist:  
     **5. The Misintention in a New System**: In a classroom, a child writes a mark that fits the 'a' schema but intends it as 'u'. The teacher, however, is using a permuted alphabet (like crux 1) where that shape means 'a'. The teacher reads it as 'a' and praises. Other children, using the same permuted system, also read it as 'a'.  
     - **Schema Prediction**: The mark is an 'a' by form, so it is an 'a'. The child's intention doesn't change that.  
     - **System Prediction**: In the classroom system, the mark is used and read as 'a', so it is an 'a'. The child's intention is overridden by the social practice.  

  But this is complex. We'll keep it simple and use the morphing glyph as the fourth, and for the fifth, we use:

  **5. The Historical Drift Case**: Over centuries, the shape of 'a' changes gradually (e.g., from Roman to Carolingian to modern). At no point is there a sudden change, and each generation reads the new forms as 'a'.  
     - **Schema Prediction**: At each step, the form must still satisfy the 'a' schema of that time, which evolves. But if we compare endpoints (ancient and modern), they may not share a common schema.  
     - **System Prediction**: The continuous function as 'a' maintains its identity, even if the form changes completely.  

