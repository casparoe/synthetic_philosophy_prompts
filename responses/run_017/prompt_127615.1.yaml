     - **System Prediction**: As long as each generation uses it as 'a', it remains an 'a'.  

  This is our fifth crux.

  ### Part 4: What Would Move Us

  - **Schema camp**: We would give up our central claim (that schema is necessary and constitutive) if a case were found where a mark is consistently used and recognized as 'a' but shares no form or schema with any existing 'a' (e.g., in the invented script case, if readers with no exposure to the script learn it and treat a new shape as 'a' without any resemblance or schema matching, purely by position).  
  - **System camp**: We would give up our central claim (that form is never constitutive) if a case were found where a mark perfectly matches the 'a' schema but fails to function as 'a' in a system (e.g., in a permuted alphabet, the 'a' schema shape is used for 'b', and readers never misread it as 'a').  

