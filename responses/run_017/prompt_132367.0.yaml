  We are to build a case where infinitism says the belief is justified, but coherentism says it is not.
   The subject must be able to generate an infinite chain of reasons without looping (so no circles) and without foundational stopping points.
   The chain must be generated by a rule that the subject could actually use.
   The total belief system must fail to cohere with the target belief, but the incoherence must be localized so that it doesn't break the infinitist chain.

