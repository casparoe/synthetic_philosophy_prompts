prompt: |-
  I run a small reading group on risk and rationality with some people from the finance department, and one of them presented an argument last week that I've been mulling over since and can't quite get out of. It's supposed to be a straight argument for geometric rationality — maximize expected log, not expected value — and I think it definately proves too much, but I can't put my finger on the exact joint. Roughly as he gave it: (1) Take a favourable multiplicative gamble you can repeat: any fraction of your bankroll on a coin that comes up heads with p = 0.6 at even money. The rule that maximizes the expected logarithm of your bankroll — betting 20% each round, i.e. edge over odds — will with probability one eventually leave you richer than a bettor using any other fixed fraction, and the ratio between the two of you grows without bound. (2) The moral of that theorem is supposed to be about what a single individual actually lives through: your wealth is one trajectory, and what happens to it over time is governed by its time-average growth rate, not by the average across a hypothetical population of copies of you, which is dragged around by outcomes almost nobody experiences. Expected wealth maximization is maximizing a fiction. (3) But — and here's where I start to itch — the number of times you face a given choice can't be what makes a rule rational. If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once; the long run is just a device that exposes what the correct policy is, it isn't a separate ingredient in the justification. (4) So in any decision whatever, maximize the expected log of the quantity your decision multiplies. (5) Expected log is minus infinity if any outcome drives that quantity to zero, so rationality forbids accepting any gamble carrying any nonzero probability of total loss of that quantity, however tiny the probability and however large the finite gain. (6) That's preposterous. There's some chance that driving to campus I get disabled in a way that destroys my earning capacity, and my earning capacity is most of the quantity that compounds over the rest of my life; by (5) no finite benefit could ever justify the drive. Same for the surgery I've been putting off, same for having a second kid. A rule that forbids every action anyone ever takes isn't the rule. (7) So one of (1)–(6) has to go, or one of the steps between them.

  Things I've tried that don't satisfy me. The finance guy says you just define the "bankroll" narrowly — the money earmarked for this kind of bet — and then nothing is ever driven to zero and (5) never bites; but (1) was a claim about your whole wealth process, and if I'm allowed to choose the quantity freely it looks like I can get the rule to say anything I like, which is just a version of the problem rather than a solution. I also don't think the difficulty is really about repetition as such, because I can construct cases where the timing is what's odd: my colleague's own example was a 78-year-old with no heirs deciding whether to put 5% of her savings on a single even-money 60/40 bet, where the proceeds will be spent on care within the year and never reinvested in anything, and I made up one of my own where the stake isn't a compounding quantity at all — a drug that might cost me my eyesight. Call it the reinvestment condition, if you like: the theorem needs a quantity that actually gets multiplied, over and over, into itself. My question: which step do you reject, why did it look fine when he wrote it on the board, and what does rejecting it cost? I'd rather keep (1) and (6) than (3) or (4), and I'd rather not end up saying that what's rational for me to do on Monday depends on how many similar decisions the universe is going to hand me. And if (3) does go: is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice, or does the whole program only get a grip inside sequences?
reasoning: |-
  Okay, the user is grappling with a geometric rationality argument presented in their reading group. Let me unpack this step by step. The core issue is whether maximizing expected log wealth is universally rational, especially given the counterintuitive implications for one-off decisions.

  First, I need to understand the argument's structure. The finance guy's reasoning moves from repeated bets (where Kelly criterion clearly dominates) to claiming it should apply to single decisions. The problematic leap seems to be in step (3) and (4) - assuming what's optimal in sequences must be optimal for isolated cases. But that equivalence doesn't hold because repeated settings exploit multiplicative dynamics that simply don't exist in one-off scenarios.

  The user's discomfort with step (5) and (6) is spot-on. A rule that forbids any risk of ruin would paralyze real life. But dismissing geometric rationality entirely feels wrong too - it clearly works for repeated investments. So how to reconcile this?

  I recall that the Kelly criterion's optimality depends crucially on constant fraction reinvestment. Without that compounding mechanism, expected log maximization loses its justification. For one-off decisions like medical procedures or driving risks, we're not dealing with reinvestable quantities - so applying Kelly there is category error.

  The user mentioned defining "bankroll" narrowly to avoid total loss. But that feels ad hoc - if we can arbitrarily shrink the domain at risk, we could justify any behavior. Better to acknowledge that different decision frameworks apply to different problem types.

  What the user might really need is a principled way to distinguish when geometric rationality applies versus when standard expected utility is appropriate. They're hinting at this with their "reinvestment condition" observation. The key insight is that time-average growth rate only matters when you actually have repeated multiplicative growth.

  For their examples: The elderly woman's bet doesn't involve reinvestment, so expected utility of outcomes makes more sense. The eyesight-risk drug decision should weigh disability against benefit using marginal utility, not log wealth. Driving risk is about valuing life/health versus convenience - again, not multiplicative.

  The user's worry about decision-count dependency is valid but manageable. We're not saying Monday's decision changes based on future events - rather that the rational framework depends on the nature of the decision process itself. Single decisions simply lack the multiplicative structure that gives Kelly its power.

  Geometric rationality isn't "wrong" - it's domain-specific. The residue for one-off decisions is standard expected utility theory, which already handles risk-aversion via concave utility functions. Kelly emerges as a special case when utility is logarithmic and decisions are repeated.

  This preserves the value of geometric rationality where it shines (long-term investing) while avoiding absurd prescriptions elsewhere. The cost is rejecting universality - but that's necessary because no single rule covers all decision types.
answer: |-
  This is a beautifully sharp dissection of a deep and persistent confusion. Your colleague's argument is seductive but flawed, and your itch is justified. The error lies in **step (3)**, specifically the inference from "the long run exposes the correct policy" to "the policy for the long run *is* the policy for a single bet." Rejecting this inference preserves the power of geometric rationality for sequences while avoiding its absurdity for one-offs, and it doesn't make rationality depend on unknowable future repetitions. Here's the breakdown:

  1.  **Step (1) is Correct:** The Kelly Criterion (maximize expected log wealth) *is* the unique strategy that asymptotically dominates any other essentially different strategy in repeated, identical, independent multiplicative gambles. The wealth ratio grows without bound with probability 1. This is a profound result (originating with Kelly, Latané, Breiman, etc.).

  2.  **Step (2) is Partially Correct/Interpretive:** The "moral" about focusing on the time-average growth rate (`g = (1/T) * log(W_T / W_0)`) of your *actual* trajectory, rather than the ensemble average of possible final wealths, is a valid and crucial insight *for repeated multiplicative scenarios*. It highlights why maximizing expected *value* (`E[W_T]`) is disastrous long-term (volatility drag).

  3.  **Step (3) is the Fatal Leap:** The claim "If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once" **is false.** This is the "reification of the long run" fallacy applied to decision rules. Why?
      *   **Different Optimization Goals:** The Kelly rule optimizes the *long-run growth rate*. A single bet has no long-run growth rate to optimize. The goal for a single bet is fundamentally different: maximizing the expected utility of the *outcome* of that single action, given your risk preferences and overall context.
      *   **Different Mechanisms:** Kelly's dominance relies *critically* on the multiplicative compounding of outcomes over many trials. A single bet doesn't compound. The mechanism that makes Kelly optimal (avoiding ruin while capturing edge) doesn't exist in isolation.
      *   **"Exposes" ≠ "Defines":** The long run *reveals* that Kelly maximizes a specific desirable property (asymptotic dominance). It doesn't magically transform that property into the universally correct objective for all decisions, regardless of structure. A microscope reveals cells; it doesn't mean the optimal way to look at a mountain is through a microscope.

  4.  **Step (4) is Therefore Incorrect:** You cannot universally state "maximize the expected log of the quantity your decision multiplies" because: a) Not all decisions *are* multiplicative (e.g., your eyesight drug example), b) Not all decisions are repeated, and c) The justification for doing so *only* holds robustly in the repeated multiplicative context.

  5.  **Step (5) & (6) Highlight the Absurdity:** Step (5) is a *consequence* of misapplying the Kelly logic (maximize E[log(X)]) to a single decision where the "bankroll" (X) is something like total lifetime utility capacity. Step (6) correctly identifies this as preposterous and paralyzing. This reductio ad absurdum shows why step (3) must be wrong.

  **Rejecting Step (3): What it Costs and Why it's Worth It**

  *   **Cost:** It means geometric rationality (Kelly) is not a *universal* decision rule. It's specific to repeated, multiplicative decision contexts where optimizing long-run growth is the primary objective. You lose the clean, simple, "one rule to rule them all" appeal.
  *   **Benefit:** You avoid paralyzing absurdity (step 6). You preserve the validity and power of geometric rationality *in its proper domain* (repeated multiplicative bets/investments). You align rationality with standard expected utility theory (EUT) for non-repetitive or non-multiplicative decisions.

  **Addressing Your Concerns:**

  *   **"I'd rather not end up saying that what's rational for me to do on Monday depends on how many similar decisions the universe is going to hand me."** Good news: Rejecting step (3) *doesn't* force you into this. Your decision on Monday depends on:
      1.  **The nature of Monday's choice:** Is it inherently part of a repeated multiplicative structure (e.g., investing a fixed fraction of your trading capital)? If yes, Kelly applies *to that structure*.
      2.  **Your overall goals and risk preferences for the outcome of Monday's action:** If it's isolated (e.g., the surgery, the one-off bet for the 78-year-old, driving to campus), use EUT with an appropriate utility function over the relevant outcomes (wealth, health, quality of life).
      *   Crucially, you don't need to know *future, unrelated decisions*. You only need to recognize if *this specific decision* is embedded in an *ongoing multiplicative process* (like an investment portfolio you manage) or not. The rule depends on the *structure of the current decision problem*, not on future unknowns.

  *   **"Is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice?"** **Yes, but indirectly and within EUT:**
      *   **Log Utility as a Specific Risk Aversion:** Within Expected Utility Theory, choosing a utility function `U(W) = log(W)` represents a *specific*, quite strong, level of constant relative risk aversion (CRRA = 1). This is the *same* utility function that Kelly maximizes the expected value of for each bet in the sequence.
      *   **Why it might feel relevant:** For a large one-off bet where the stake is a significant fraction of your total wealth, a log-utility maximizer *would* behave similarly to a Kelly bettor sizing a single bet within a sequence. They would bet a fraction proportional to their edge because `U(W)` is concave, penalizing losses more than rewarding gains proportionally.
      *   **Key Difference:** This is *not* justified by appealing to long-run dominance theorems. It's justified by the decision maker's inherent risk aversion encoded in their `U(W) = log(W)`. They might choose a *different* utility function (e.g., `U(W) = sqrt(W)` for less risk aversion, `U(W) = -1/W` for more).
      *   **The "Residue":** The insight from geometric rationality is that `log(W)` is a *particularly natural and important* utility function, especially when dealing with multiplicative growth *over time* or when constant relative risk aversion is descriptively or normatively appealing. It provides a strong normative foundation *for choosing that specific utility function* within EUT, particularly for financial decisions involving scaling. It doesn't provide a separate *decision rule* outside EUT for one-offs.

  **Conclusion:**

  Reject **Step (3)**. The optimality of maximizing expected log wealth for repeated multiplicative gambles **does not imply** it is optimal for a single instance of that gamble, or for any non-multiplicative decision. The long run exposes the optimal rule *for achieving long-run dominance in multiplicative sequences*; it doesn't define optimality for fundamentally different decision contexts.

  Geometric rationality (Kelly) is a powerful framework **specifically for repeated decisions involving multiplicative growth of a "bankroll"** (investment capital, betting bank). For one-off decisions, non-multiplicative risks (like eyesight), or decisions where the "stake" isn't a reinvestible quantity, **Expected Utility Theory** with an appropriately chosen utility function (which *could* be log-utility, reflecting strong CRRA) is the correct framework. The "residue" is the justification for log-utility within EUT, not a standalone geometric rule for one-offs. This preserves (1) and (6), avoids the absurdity of (5), and doesn't make Monday's rationality depend on unknowable future events, only on the structure of Monday's choice itself.
