  Looking at their three sticking points. The statue example: they perceive the same object but still find the identity informative. Direct reference might struggle here because perception usually fixes reference. Fregeans would invoke different modes of presentation. But the user wonders if having two modes for the same demonstrative is problematic. 

  Next, the Dana Reyes case. Here, it's about one name but two mental conceptions. The user asks if the debate shifts to mental files. If so, does the same disagreement reappear or can they agree? This touches on psychological vs. semantic explanations.

