prompt: |-
  I'm putting together a seminar on the boundary problem — who has to be in the demos for a given decision — and I need a case that breaks the "everyone whose interests are affected gets a say" principle in a way that isn't just the usual gripe that it balloons the demos out to everyone on earth.

  The wrinkle I want is endogenous affectedness: the harm is real if the affected group doesn't get a vote, but if they do get a vote they block the thing, so the harm never happens, so by the principle's own lights they shouldn't be in the demos, so they don't get a vote, so the harm happens. The principle never settles.

  Constraints: one paragraph; a realistic body making a realistic decision (water authority, zoning board, transit agency, whatever); the affected group has to sit outside the jurisdiction, so the rival principle — the demos is everyone subject to the state's coercion, its laws and police and courts — excludes them cleanly; and the loop has to fall out of the ordinary machanics of the vote, not from anyone threatening retaliation or from anything exotic.

  After the scenario: say what each principle delivers and why, point at the one feature doing the work, tell me what happens if you tweak the case so the harm is the same size whichever way the vote goes, and tell me how someone who likes the affected-interests principle would try to wriggle out. The verdicts have to fall out of the principles rather than be written into the setup.
reasoning: |-
  Okay, the user is setting up a seminar on the boundary problem in democratic theory, specifically looking for a case that challenges the principle that everyone whose interests are affected should have a say in a decision. They want a scenario where the affectedness is endogenous—meaning the harm depends on whether the group gets a vote or not. 

  Hmm, the user is clearly well-versed in political theory—they're using precise terms like "endogenous affectedness" and referencing standard principles like the coercion-based demos boundary. They're not just asking for any counterexample; they want one that avoids the common "global demos" criticism and focuses on this logical loop where the principle self-undermines. 

  The constraints are tight: one paragraph, realistic decision-making body, excluded group outside jurisdiction, and the loop must emerge naturally from voting mechanics—no threats or exotic elements. They also want analysis of how each principle handles it, the key feature causing the problem, a tweak to equalize harm, and how an affected-interests supporter might respond. 

  Let me construct this carefully. A water authority case feels right—downstream communities are classic examples of externally affected groups. If the upstream votes alone, they might pollute the river; if downstream votes too, they block the pollution, so they're unaffected and by the principle shouldn't vote... but then the pollution happens. Perfect loop. 

  Key is that the harm's existence depends on the voting boundary itself. For coercion principle supporters, it's clean: downstream isn't coerced by upstream laws, so no vote. The tweak: if pollution cleanup harms upstream equally, the loop vanishes because affectedness no longer depends on inclusion. 

  An affected-interests defender might argue downstream is always affected *potentially*, or that the principle should consider expected harms... but that feels ad hoc. The core problem remains: the principle can't neutrally define who's affected without already deciding who votes. 

  User's seminar will love this—it's a crisp, real-world example of a theoretical paradox. They'll probably use it to show why coercion-based boundaries avoid such loops, even if they seem less inclusive at first glance.
answer: |-
  Here's the case:

  **Case:** The Metro Water Authority (MWA), governing a major city's water supply, votes on diverting a river through a new industrial zone upstream, which would boost local jobs but release pollutants harming downstream farmers outside MWA's jurisdiction. If farmers lack a vote, MWA approves diversion and pollution occurs, tangibly harming farmers. But if farmers *are* included in the demos, they vote "no," blocking the diversion. No pollution occurs, so no harm materializes. By the "affected interests" principle, their inclusion is only justified if harm occurs, which it doesn't *if* they are included. Thus, the principle cannot settle whether they should be included: excluding them causes harm (justifying inclusion), while including them prevents harm (negating the justification for inclusion).

  **Analysis:**
  1.  **Affected Interests Principle:** Leads to a loop. It demands inclusion only if harm occurs, but inclusion prevents that very harm, removing the justification. It never resolves.
  2.  **Coercion Principle:** Cleanly excludes the downstream farmers. They are not subject to MWA's laws, taxes, or enforcement; the harm is a spillover effect, not direct coercion. Only MWA jurisdiction residents vote.
  3.  **Key Feature:** The harm's very *existence* is endogenously determined by the boundary decision itself (inclusion prevents harm, exclusion causes it).
  4.  **Tweaked Case (Equal Harm):** Suppose blocking the diversion *also* causes equivalent economic harm to farmers (e.g., they lose lucrative contracts supplying the new industrial zone). Now, farmers are harmed whichever way the vote goes (pollution or lost income). The affected interests principle consistently demands their inclusion regardless of the outcome, breaking the loop.
  5.  **Wriggling Out:** A proponent of affected interests might argue: a) The principle considers *potential* or *risk* of harm, not just actualized harm. Farmers are *potentially* affected by the *decision*, justifying inclusion. b) The *power* to cause harm (MWA's diversion authority), not the harm itself, creates the affected interest. c) They might bite the bullet and insist inclusion is always required for such spillover cases, accepting a larger demos.

  **Verdicts:** The coercion principle delivers a clear, stable boundary (only jurisdictional residents vote). The affected interests principle fails to deliver *any* stable boundary in this endogenous case, creating a logical paradox. The tweak shows the loop depends on harm being contingent on inclusion/exclusion. Wriggling out requires redefining "affected" more broadly (potential/risk/power), weakening the principle's precision.
