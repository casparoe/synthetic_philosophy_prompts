prompt: |-
  I help run a little reading group on metaphysics in my department, and two of the regulars have been going round in circles since about October about the special composition question — when some things compose something. One of them is a Lewis-style universalist: composition is unrestricted, any old plurality whatsoever has a fusion, so there really is something made of my nose and the Eiffel Tower, and the real work for her is all downstream of that — which of the wildly many objects are joint-carving or salient or worth quantifying over, and how to stop that from being a merely verbal move. The other holds something I have not seen in the literature exactly, which he calls homeostatic restrictivism as a shorthand: some things compose something only when their arrangement is actively held within bounds by a self-directed process, one that maintains itself against perturbation, so organisms and cells and candle flames and maybe ecosystems are genuine objects, whereas tables, chairs and bicycles are just particles arranged tablewise or bicyclewise, held in shape by nothing but inertia, glue and us. It is meant to be van Inwagen's organicism with life swapped out for self-maintenance, which is precisely why the two of them talk past each other: she thinks his condition is an invented restriction on a relation that could not care less, he thinks her fusions are not unities in any sense that a metaphysician should want.

  What I want from you is the document they should have produced instead of another year of this: a joint statement from an adversarial collaboration that both of them could actually sign. Please give me a numbered agreed-claims section first — real agreement between two people who both think the question has an answer, not the sort of padding someone who thinks the whole debate is confusion would also sign; so yes, things about the particles arranged furniturewise, about the problem of the many, about what mereology alone can and cannot settle, but nothing as empty as ontology is hard — then a disagreements table where each row is one crux and each side's own position is stated in wording that side would accept rather than wording the other side would find easy to knock down. Then, for each crux, a case, argument or hypothetical finding that both would accept as bearing on it, with each side's prediction written down in advance and what each would concede if it came out the other way.

  Some things to build in, though add your own if they are better. There is a nice circularity worry for him: a self-maintaining arrangement looks like it has to be self-maintaining on behalf of some thing, so his condition may secretly presuppose the object it is meant to be a test for; she has to say whether unrestricted composition is genuinely metaphysically innocent or just a lot of ontological cheapness nobody pays for. For evidence, please use hypothetical rather than real results, since none of us can check anything: one crux should be tested by an imagined finding in cognitive science that our object-tracking is thoroughly task-relative — infants, adults and macaques all represent scattered or loosely connected pluralities as one object when the task rewards it, and no level of description in the visual system is privileged — and I want to know what each of them predicted about that and why. Another should be tested by an imagined split in which our best fundamental physics quantifies only over fields at spacetime points and never over bounded composites, while our best biology turns out to quantify irreducibly over organisms as units of selection; which way does that cut, for her and for him? I would also like a crux about vagueness and counting: how many objects are in this room, is there a determinate answer, and does sharpness there count for or against a view. Finally, tell me plainly which parts of their dispute you think are merely verbal — about what exists and object mean, presumably — and which are substantive, and do not let the whole thing collapse into it is all just words, because I am fairly sure at least one bit is not. Around 1000 to 1200 words, tables can be compact, and please no bibliography or suggested reading: we have plenty of that, and half of it is the reason they are stuck.
reasoning: |-
  Okay, the user runs a metaphysics reading group where two members are stuck debating the Special Composition Question (SCQ). One is a Lewis-style universalist who believes any arbitrary collection of objects composes a new object. The other advocates "homeostatic restrictivism," where composition only occurs when there's a self-maintaining process holding the parts together. The user wants a collaborative document that captures both viewpoints clearly.

  First, I need to understand the core of their disagreement. The universalist sees composition as unrestricted and metaphysically innocent, meaning it doesn't add new reality beyond the parts. The restrictivist argues that only self-maintaining unities like organisms are genuine objects. Their debate involves circularity concerns for restrictivism (defining objects in terms of themselves) and questions about metaphysical innocence for universalism.

  The user requests a structured output: agreed claims, a disagreements table with cruxes, hypothetical tests for each crux, and an analysis of verbal vs substantive disputes. They specified hypothetical evidence from cognitive science (object-tracking relativity), physics/biology (fields vs organisms), and vagueness in counting objects. 

  For the agreed claims section, I'll list points both parties accept, avoiding trivial statements. Key agreements include: mereology alone not settling SCQ, particles arranged tablewise lacking intrinsic unity, problem of the many applying to both views, and vagueness in ordinary counting not resolving the debate.

  The disagreements table needs clear cruxes. I identify three main ones: the composition criterion (universalism vs homeostatic property cluster), metaphysical innocence, and what counts as a genuine object. Each crux gets a hypothetical test case. For cognitive science, universalist predicts relativity supports their view, while restrictivist expects core object perception to track self-maintenance. If evidence shows no privileged level, restrictivist might concede perceptual relativity but hold ontological distinction. For physics/biology split, universalist sees it as pragmatic, restrictivist as validating irreducible biological units. Vagueness in counting favors universalist's precise ontology but restrictivist argues ordinary objects aren't the target.

  Finally, I analyze verbal vs substantive elements. The existence of arbitrary sums is verbal (about "object" meaning), while whether self-maintenance grounds objective unity is substantive. Metaphysical innocence is substantive—does unrestricted composition add commitments? The circularity worry for restrictivism is substantive if it undermines the view's coherence.

  The user wants resolution without dissolving into "just semantics," so I'll emphasize substantive disagreements. The document should be 1000-1200 words with compact tables. No bibliography needed. I'll ensure predictions and concessions are specific, and hypothetical tests are clear and relevant.
answer: |-
  ## Joint Statement: Universalism vs. Homeostatic Restrictivism on Composition

  **Agreed Claims:**

  1.  **Mereology is formal:** Mereology provides a formal structure for part-whole relations but does not, by itself, settle the *Special Composition Question* (SCQ) – *when* composition occurs. Answering SCQ requires substantive metaphysical commitment.
  2.  **Particles arranged X-wise exist:** There are fundamental particles (or field values, etc.) arranged tablewise, bicyclewise, organismwise, etc. The disagreement concerns whether there exists a further object *composed* by these particles in each case.
  3.  **Problem of the Many applies:** Both views face the problem of the many for composite objects (e.g., organisms, clouds, potentially artifacts). Neither view inherently solves or avoids it; both require auxiliary accounts (e.g., vagueness, maximality, contextual restriction).
  4.  **Ordinary counting is vague:** Questions like "How many objects are in this room?" asked in ordinary contexts, typically involve significant vagueness and context-sensitivity regarding which entities count as "objects" for the purpose. This vagueness is primarily linguistic/conceptual, not necessarily reflecting ontological vagueness.
  5.  **"Salience" vs. "Existence":** There is a distinction between what *exists* fundamentally or simpliciter and what is *salient*, *useful*, or *joint-carving* for our purposes (e.g., science, everyday life).
  6.  **Organisms are paradigm composites:** Both agree that organisms (understood as living, self-maintaining systems) are clear and central examples of composite objects. The dispute is whether they are the *only* genuine composite objects or merely one kind among many.
  7.  **Metaphysics seeks unity:** Metaphysics aims to understand the nature of reality, including the structure of unification – what makes something a single, unified entity rather than merely a collection of parts.

  **Disagreements Table:**

  | Crux                                                                 | Universalist Position (U)                                                                                                 | Homeostatic Restrictivist Position (HR)                                                                                                                               |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. The Composition Criterion:** What is the necessary and sufficient condition for some things to compose a further object? | **Composition is unrestricted:** Any arbitrary plurality of objects whatsoever has a mereological fusion. There are no substantive conditions for composition. | **Composition is restricted:** Some things compose an object only if their arrangement is dynamically maintained within bounds *by a self-directed process* inherent to that arrangement (e.g., metabolism, homeostasis, autocatalysis). |
  | **2. Metaphysical Innocence:** Is unrestricted composition ontologically cost-free?                                            | **Metaphysical Innocence Holds:** Fusions add no *fundamental* ontological commitment beyond the parts and their arrangement. They are "ontological free lunch." | **Metaphysical Innocence Fails:** Postulating arbitrary fusions like "Nose-Eiffel Tower" *is* an additional ontological commitment, multiplying entities without genuine unifying principle, violating parsimony for fundamental ontology. |
  | **3. Nature of Genuine Objects:** What constitutes a genuine unified object, beyond mere aggregation?                           | **Unity is minimal/derivative:** A fusion's "unity" is simply the fact that its parts are collected under a single term or concept. No further robust unity is required for existence. | **Unity is robust/objective:** A genuine object possesses *intrinsic, mind-independent unity* grounded in the causal-dynamic interdependence and self-maintenance of its parts, making it a non-arbitrary whole. Tables, etc., lack this. |

  **Crux Tests, Predictions & Concessions:**

  1.  **Crux:** The Composition Criterion
      *   **Test Case:** Cognitive science finds that human (and macaque) object-tracking systems robustly represent scattered or loosely connected pluralities (e.g., a group of moving dots acting in concert, a tool held by a robot arm, a "superorganism" like an ant colony) *as single objects* **if and only if** the task requires tracking them as a functional unit for achieving a goal (e.g., catching, avoiding, predicting behavior), and no level of visual processing is privileged for "objecthood" independent of task demands.
      *   **U Prediction:** This finding strongly supports Universalism. It shows our core object concept is inherently flexible, pragmatic, and task-relative, aligning perfectly with the idea that composition is unrestricted and "object" is a context-sensitive way of talking about any plurality we find it useful to track as one. There is no deep, objective unity criterion reflected in cognition.
      *   **HR Prediction:** This finding is neutral or slightly favors HR. While object *representation* is task-relative, it doesn't track *ontological* unity. It shows cognition *uses* pluralities as units pragmatically, but the finding itself says nothing about what *grounds* the intrinsic unity of *genuine* objects like organisms. The core cases of object perception (solid, bounded, coherently moving things) likely still correlate best with self-maintaining unities.
      *   **U Concession:** If the finding showed a *privileged, innate* level of visual processing *always* tracking only arrangements with robust self-maintenance (even when task-irrelevant), U would concede this weakens the claim that our *concept* is inherently unrestricted, though not the ontological claim itself.
      *   **HR Concession:** If the finding showed *no correlation whatsoever* between robust object perception/tracking and self-maintaining processes (e.g., infants track arbitrary task-defined "objects" as readily and fundamentally as they track cohesive bodies), HR would concede that our perceptual object concept does not align with his proposed ontological criterion, weakening an intuitive support pillar (though not refuting the ontology).

  2.  **Crux:** Metaphysical Innocence / Nature of Genuine Objects
      *   **Test Case:** Our best fundamental physics definitively describes reality solely in terms of fields/quantum states defined at spacetime points/regions, with *no quantification over bounded macroscopic composite objects* as fundamental. Simultaneously, our best evolutionary biology *requires* quantifying over organisms and perhaps higher-level units (e.g., colonies, symbiotic systems) as *irreducible units of selection* to explain adaptation and diversity; reducing these explanations solely to particle dynamics is intractable and loses essential causal patterns.
      *   **U Prediction:** This cuts neutrally or weakly favors U. Physics shows composites aren't fundamental, supporting innocence. Biology's need for higher-level quantification is pragmatic/epistemic – a useful way to describe complex patterns in the fundamental field/particle mosaic. The fusions *exist*, biology finds them salient. No conflict.
      *   **HR Prediction:** This strongly favors HR. Physics confirms fundamental reality lacks arbitrary bounded composites. Biology's *irreducible* need to quantify over organisms *as units* demonstrates that these specific self-maintaining composites are ontologically significant non-arbitrary nodes in the causal structure, justifying their status as genuine objects distinct from mere pluralities. Tables lack this biological indispensability.
      *   **U Concession:** If biology showed that *only* self-maintaining units required irreducible quantification *and* that quantification over artifacts like tools in cultural evolution was demonstrably reducible without loss, U would concede this provides pragmatic justification for HR's *salience* distinction, though not for denying existence to artifacts.
      *   **HR Concession:** If biology showed that *any* functionally defined aggregate (e.g., predator-prey pairs, a river and its basin, specific artifact types) required irreducible quantification as a unit of selection *on par with* organisms, HR would concede his criterion might be too narrow or that his view faces a significant challenge in distinguishing "genuine" objects.

  3.  **Crux:** Vagueness, Counting & Unity
      *   **Test Case:** Consider a room containing: a person (organism), a wooden chair (artifact), a candle flame (self-maintaining process), and a pile of sand (mere aggregate). Is there a determinate number of composite objects in this room, simpliciter?
      *   **U Position:** **Yes, determinately many.** There is the fusion of all particles in the room. There are also countless sub-fusions: the person-fusion, the chair-fusion, the candle-flame-fusion, the sand-pile-fusion, the nose-person fusion, the chair-legs fusion, the air-molecules-near-the-flame fusion, etc. The number is vast but precise. Vagueness only arises in *which* fusions we *count as objects* for a purpose.
      *   **HR Position:** **No, not determinate simpliciter, but determinate for genuine unities.** There is exactly one clear-cut composite object: the person (organism). The candle flame *might* qualify (needs analysis). The chair and sand pile definitely do not. The number of *genuine* composites is small and determinate (e.g., 1 or 2). Vagueness in *ordinary* counting ("How many objects?") arises from conflating genuine unities with arbitrary aggregates or functional groupings we mistakenly reify.
      *   **Significance:** U argues sharpness supports ontological precision. HR argues U's sharpness is trivial (counting all arbitrary sums) and masks the lack of sharpness in identifying *robust unities*, which *is* sharp under his criterion. Vagueness in ordinary talk counts against mistaking functional groupings for genuine objects.

  **Verbal vs. Substantive Disagreement:**

  *   **Verbal (Primarily):** The core dispute over **what "exists" or is an "object"** has a significant verbal component. U uses "exists" and "object" very broadly (any fusion). HR uses them restrictively (only robust unities). Much heat stems from talking past each other on terminology. Agreed Claim 5 ("Salience vs. Existence") highlights this.
  *   **Substantive:**
      1.  **The Ground of Unity:** Whether there is a **mind-independent, objective difference in the world** between the kind of unity found in an organism and that found in a pile of sand or an arbitrary fusion (like nose + Eiffel Tower). HR asserts there is; U denies it, seeing all unity as derived from our concepts/descriptions. *This is not merely verbal; it's about the structure of reality.*
      2.  **Metaphysical Innocence:** Whether positing all arbitrary fusions **genuinely adds no ontological cost** beyond the parts and their relations (U), or whether it constitutes **profligate, unjustified ontological commitment** lacking a unifying principle (HR). *This is a substantive dispute about ontological parsimony and commitment.*
      3.  **The Circularity Worry for HR:** Whether defining composition via a self-*maintaining* process inherently **presupposes the existence of the very object** it's meant to define ("maintaining *what*?"). *If this worry holds, it's a substantive internal problem for HR's specific criterion.*
      4.  **The Status of Scientific Ontology:** Whether the indispensability of certain composites (like organisms) in successful scientific explanations **reflects an objective ontological joint** (HR) or is **merely a powerful pragmatic tool** for describing complex patterns in a more fundamental ontology (U). *This is substantive, concerning the link between epistemology and metaphysics.*

  **Conclusion:** The debate is not *merely* verbal. While terminology fuels confusion, the substantive heart lies in whether reality contains objectively unified, non-arbitrary wholes whose unity is grounded in intrinsic, self-sustaining dynamics (HR), or whether all unity is imposed by thought or language upon a fundamentally part-whole mosaic where composition is universal and innocent (U). The hypothetical tests probe these underlying substantive commitments about unity, ontological cost, and the connection between scientific practice and fundamental reality.
