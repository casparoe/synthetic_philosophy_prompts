  3. Whether tampering with the channel, the reward computation process, the inputs, or the agent's sensitivity are different in kind or only in mechanism.
  4. Whether the agent must have phenomenal experiences (or if a non-experiential system can wirehead).
  5. Whether it matters if the agent is aware that it is severing the link (opaque vs. transparent wireheading).
