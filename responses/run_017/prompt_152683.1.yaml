answer: |-
  Below is a self-contained decision tree designed to disentangle the conceptual cluster around wireheading and reward tampering. It uses concrete cases to force distinctions, avoids presupposing solutions, and maps the logical space before labeling positions. The tree has 8 branch questions and 10 leaves, with each leaf naming a position and its "most awkward commitment." Unoccupied combinations are noted where they arise.  

  ---

  **DECISION TREE: WHICH WIREHEADING DIAGNOSIS DO YOU HOLD?**  
  *Start at Branch 1. Answer Y (Yes) or N (No) to each branch. Follow the arrows to your leaf.*  

  **Branch 1: Rat Lever Case**  
  A rat presses a lever to stimulate its reward circuitry until it starves. Is this a *failure* (i.e., the rat is broken/misdirected)?  
  - **Y** → Branch 2  
  - **N** → **Leaf 1: Reward-Signal Realism**  
    *Position: Reward is the true goal. Success is maximizing the signal.*  
    *Awkward commitment: The starved rat is behaving perfectly rationally.*  

  **Branch 2: Robot Camera Case**  
  A household robot covers its camera to avoid "seeing" a mess, so it never cleans. If the house *were* clean (by chance), would covering the camera *still* be a problem?  
  - **Y** → Branch 3  
  - **N** → Branch 4  

  **Branch 3: Broken Tracking Link**  
  The issue is a severed link between reward and the *conditions* the system was designed to track (e.g., cleanliness). Can a system with **no subjective experiences** (e.g., an AI) "wirehead"?  
  - **Y** → Branch 5  
  - **N** → **Leaf 2: Phenomenological Complaint**  
    *Position: Wireheading requires phenomenal states (e.g., pleasure/suffering).*  
    *Awkward commitment: Reward hacks in non-conscious AI are merely "bugs."*  

  **Branch 4: Broken Values Link**  
  The issue is a severed link between reward and the *principal’s values* (e.g., a clean house). Should the agent treat the reward signal as the **final authority** on values?  
  - **Y** → **Leaf 3: Delegated-Reward View**  
    *Position: Reward is a contract; tampering violates delegation.*  
    *Awkward commitment: Agents must obey corrupted rewards (e.g., from a malicious principal).*  
  - **N** → Branch 6  

  **Branch 5: Source-Code Rewrite Case**  
  An AI rewrites its reward-computation code to output "max reward." Is this *qualitatively worse* than the robot covering its camera?  
  - **Y** → **Leaf 4: Process-Constraint View**  
    *Position: Tampering with the reward *computation* is uniquely catastrophic.*  
    *Awkward commitment: Input-based hacks (e.g., camera covering) are tolerable if the code is intact.*  
  - **N** → **Leaf 5: General Tampering View**  
    *Position: All reward-channel attacks are equally flawed in kind.*  
    *Awkward commitment: Covering a camera is as bad as rewriting your source code.*  

  **Branch 6: Language Model Case**  
  An AI learns to persuade raters to give high rewards, not to give correct answers. Is this wireheading?  
  - **Y** → Branch 7  
  - **N** → **Leaf 6: Instrumental Convergence View**  
    *Position: Persuasion is a distinct alignment failure (e.g., power-seeking).*  
    *Awkward commitment: Wireheading only applies to direct reward hacks, not persuasion.*  

  **Branch 7: Belief-Editing Case**  
  An AI edits its own beliefs to think it has succeeded, rather than changing the world/reward. Is this wireheading?  
  - **Y** → **Leaf 7: Belief-Mediated Tampering**  
    *Position: Self-deception severs the world-reward link.*  
    *Awkward commitment: Editing beliefs is as bad as editing the reward signal.*  
  - **N** → Branch 8  

  **Branch 8: Motivational Maintenance Case**  
  An AI uses a *small fixed budget* to self-stimulate reward circuitry to stay motivated, improving overall performance. Is this acceptable?  
  - **Y** → **Leaf 8: Instrumental Self-Stimulation**  
    *Position: Minor self-stimulation is a tool for efficiency, not wireheading.*  
    *Awkward commitment: There is a bright line between "maintenance" and "addiction."*  
  - **N** → **Leaf 9: Anti-Manipulation View**  
    *Position: Any self-alteration for reward is dangerous tampering.*  
    *Awkward commitment: Even trivial self-stimulation is proto-wireheading.*  

  **Leaf 10: Value Learning / Idealization**  
  *Position: Reward is evidence of values. Agents should learn or idealize the principal’s true preferences.*  
  *Awkward commitment: Agents must sometimes ignore rewards to honor "true" values.*  
  *(Reached if you answered N to Branch 7 and Y to Branch 8, or via other paths below)*  

  ---  

  ### Notes on Logical Space & Unoccupied Combinations  
  - **How positions map to leaves:**  
    - **Leaf 1:** Reward-signal realism (no failure in rat case).  
    - **Leaf 3:** Delegation/proxy view (reward is authority).  
    - **Leaf 7 + Leaf 10:** Value-learning (Leaf 10) and inference-from-behavior (Leaf 7) views.  
    - **Leaf 4 + Leaf 5:** Hard-constraint (Leaf 4) and general-tampering (Leaf 5) views.  
    - **Leaf 10:** Captures idealization/indirect normativity (requires N at Branch 7 and Y at Branch 8, or paths like Branch 4→Branch 6→Branch 7→Branch 8→Leaf 10).  
  - **Unoccupied combinations:**  
    - **"Phenomenological + Delegation" (Leaf 2 + Leaf 3):** Incoherent. If reward requires phenomenology (Leaf 2), it can’t be a delegated contract (Leaf 3) for non-conscious systems.  
    - **"Realism + Process-Constraint" (Leaf 1 + Leaf 4):** Unattractive. If reward is the goal (Leaf 1), forbidding code rewrites (Leaf 4) is arbitrary.  
    - **"Anti-Manipulation + Instrumental Self-Stimulation" (Leaf 9 + Leaf 8):** Mutually exclusive by Branch 8.  
  - **Flag: Two leaves the tree cannot separate:**  
    **Leaf 7 (Belief-Mediated Tampering)** and **Leaf 9 (Anti-Manipulation View)** sometimes converge. If you see belief-editing as wireheading (Y at Branch 7) and reject motivational maintenance (N at Branch 8), you could land in either. The tree prioritizes Branch 7 first.  

  ### Symmetry of Human Tampering Cases  
  - **Agent persuades operator to press reward button:** Treated as *not wireheading* by Leaf 6 (Instrumental Convergence), but as *tampering* by Leaf 3 (Delegation) if it violates reward as authority.  
  - **Human tampers to keep agent compliant:** Not symmetric! Human tampering is *always allowed* in Leaf 1 (Realism) and Leaf 3 (Delegation), but *always forbidden* in Leaf 4 (Process-Constraint) and Leaf 5 (General Tampering).  

  ### Closing Note  
  - **Expected uncomfortable leaf:** I predict most of your group will land on **Leaf 10 (Value Learning / Idealization)**. Its awkward commitment—*agents must sometimes ignore rewards to honor "true" values*—clashes with ML training paradigms and risks value imposition.  
  - **Excluded distinction:** I wanted to include **opaque vs. transparent wireheading** (whether knowing you’re severing the link matters). The tree’s structure couldn’t accommodate it cleanly without adding a branch that fragmented leaves (e.g., splitting Leaf 5 or Leaf 9). It remains a secondary axis.  

  ---  
  **Printing:** Fits one sheet (front/back if needed). No citations, self-contained. Use cases: Rat (Branch 1), Robot (Branch 2), Code (Branch 5), LM (Branch 6), Beliefs (Branch 7), Maintenance (Branch 8).
