  ### MEMORANDUM  
  **To:** Fellowships Committee  
  **From:** [Your Name], Graduate Representative  
  **Date:** [Current Date]  
  **Re:** Fellowship Allocation Procedure and Charter Amendment  

  This memo addresses the impasse in awarding four dissertation fellowships to 17 closely ranked applicants (F-06 to F-51). The dense band (adjacent gaps <0.2 points) and cyclical head-to-head preferences (F-06 > F-11 > F-17 > F-06, all 4–3) violate the charter’s pairwise clause and challenge assumptions about transitivity and perceptibility. My recommendation resolves this by adopting a **respect-relative view of merit** (i.e., "better than" depends on context-specific criteria) and **accepting imperceptible differences as real and transitive**. This justifies using average scores to break ties while honoring the pairwise clause.  

  #### Philosophical Grounding  
  The cycle arises because merit is multidimensional: members prioritized distinct respects (writing quality, teaching, fit, etc.). Squeezing these into a single "merit" ordering is flawed—hence the intransitivity. Yet imperceptible differences *are* real: though adjacent files are indistinguishable, their cumulative differences (e.g., F-06 vs. F-51) reflect genuine disparities. We thus reject non-transitivity but embrace respect-relativity. This allows us to:  
  1. Treat cyclical candidates (F-06, F-11, F-17) as tied, satisfying the pairwise clause.  
  2. Use average scores—despite tiny gaps—to allocate remaining awards, as imperceptible shifts aggregate meaningfully.  

  #### Recommended Action  
  1. **Award three full fellowships** to F-06, F-11, and F-17.  
     - *Rationale*: They form an intransitive cycle; ranking any above another violates the charter. Treating them as tied respects head-to-head outcomes.  
  2. **Split the fourth fellowship equally** between F-18 and F-19.  
     - *Rationale*: As the next-highest by average score, they lead the band’s non-cyclical segment. Imperceptible differences (e.g., F-17 to F-18: <0.2 points) are real when accumulated; scores objectively differentiate them from lower-ranked files.  
  3. **Amend the charter** to formalize this approach (wording below).  

  #### Allocation Details (Band of 17)  
  | File ID | Outcome       | Reason (≤20 words) |  
  |---------|---------------|---------------------|  
  | F-06    | Award         | Cycle tie: full fellowship |  
  | F-11    | Award         | Cycle tie: full fellowship |  
  | F-17    | Award         | Cycle tie: full fellowship |  
  | F-18    | Split Award   | Next by average score: half fellowship |  
  | F-19    | Split Award   | Next by average score: half fellowship |  
  | F-20–F-51 (12 files) | No Award | Below top five in band |  

  *Total awards*: Three full fellowships, two half fellowships (utilizing all four funding slots).  

  #### Strongest Objection  
  Critics may argue this abandons holistic judgment: reducing nuanced merit to scores/lottery-like ties ignores individual strengths and fails candidates deserving personalized evaluation.  

  *Rebuttal*: Time constraints and the charter bind us. This method:  
  - Honors pairwise preferences.  
  - Uses objective data (scores) where distinctions exist.  
  - Maximizes fairness by awarding five candidates, not four.  

  #### Charter Amendment  
  Replace the pairwise clause with:  
  > "The committee shall not rank Q above P if a majority prefers P to Q head-to-head. In cyclical cases (e.g., P>Q, Q>R, R>P), affected candidates are tied. Ties may also be declared for candidates with score differences <1.0 point or indistinguishability in fellowship-specific merit respects. Tied candidates share awards equally or proceed to score-based tiebreaking."  

  #### Next Steps  
  | Action                                | Owner               | Date          |  
  |---------------------------------------|---------------------|---------------|  
  | Vote on this motion                   | Committee Chair    | Thursday      |  
  | Draft split-fellowship justification | Fellowships Coordinator | Next Monday   |  
  | Notify winners                        | Department Admin   | 9 days from now |  
  | Formalize charter revision            | Committee Chair    | End of semester |  

