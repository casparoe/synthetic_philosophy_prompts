prompt: |-
  Bit of an odd one, and I'm not even sure it's a real thing rather than me being sloppy. I teach a first-year metaphysics module where I do the statue and the lump of clay on week three, and I also sit on the committee that looks after the university's art collection, so a few times a year I'm in a room with conservators and registrars. I keep noticing the same pattern in both places and I don't have a word for it.

  Take any case where two things are made of exactly the same matter at the same time and everyone agrees they aren't the same thing: a lump and the statue it's shaped into. Whenever this comes up, the two of them never come out as equals. One gets treated as the serious one, the one that does the work, and the other gets waved off as nothing extra, or as just a manner of speaking, or as something you could drop without losing anything. Here's the part I actually want a name for: which of them plays which role flips depending on what's being discussed, and nobody seems to mind, and the same person will flip within a single conversation. In a conservation meeting the alloy is what's real — they talk about chloride corrosion and the 1970s restoration, and when I ask about the statue the conservator says, very kindly, that strictly speaking there isn't one, there's this bronze with a history, and the shape is the part you can lose. In the catalogue essay my art-history colleague wrote it's exactly reversed: the work is the thing made in 1968 and shown in Milan, and if you melted it down and recast it in the same shape she'd say it was the same work, and the metal is a footnote. Same object, same people, opposite demotions, tracking the conversation rather than the object.

  It's not only the matter-versus-form flip. I made up a case for a seminar last term: a cast that two sculptors both worked on, which the museum has catalogued twice, under two titles, two dates, two entries in two different catalogues, while the conservation file for it is a single file because physically there's one thing on the plinth. Now the flip is between two candidates at the same level, and whether there are really one or two works here seems to track whether you're asking the registrar or the curator. And the bit I can't shake: whichever one gets demoted, you can't actually delete it. The conservator still needs the work in order to say what counts as damage as opposed to patina; my colleague still needs the metal's history to date anything. So the roles aren't really the real one and the idle one, they're more like two different jobs, and the same item does one job in one conversation and the other job in the next — and the metaphysical story people then give (that really there's just one thing here, or that there are two but one of them is derivative, or that it's all in how we describe it) looks like it's tracking whichever job happens to be salient, not the other way round.

  I don't need the label for the overall puzzle, every textbook has one of those. I'm after the narrower thing: this allocation of seriousness, and the way it moves around. Does it have a name? Please don't just hand me a word, though — I want the carving, not the label. What exactly is the phenomenon; what are the nearest candidates in the literature and how does my thing differ from each (I know there is an argument somewhere that coinciding things would be causally redundant, and people who say disputes like this are merely verbal, and the whole nothing-over-and-above line — none of those seem to catch the flip, but tell me if one of them actually does once you spell it out); is it one phenomenon or have I bundled three; and if there's genuinely nothing established, coin a term, define it, and tell me what would be a borderline case that a good definition would have to settle either way.
reasoning: |-
  Okay, let's tackle this fascinating query from a professor noticing a pattern in metaphysics and art conservation. The user describes situations where two entities made of the same matter are treated unequally—one as primary, the other as derivative—and this hierarchy flips based on context, even within the same conversation. They want a term for this phenomenon, but more importantly, a precise conceptual carving.

  First, I need to unpack the core phenomenon. The user observes three key things:
  1. **Asymmetry in ontological priority**: In any given context, one entity (statue/lump) is treated as "real" while the other is demoted.
  2. **Context-driven flipping**: The priority reverses seamlessly when shifting between conservation (matter-focused) and art-historical (form/semantic-focused) discussions.
  3. **Functional indispensability**: The demoted entity remains necessary for certain descriptions (e.g., the "demoted" statue is needed to define corrosion damage).

  The user mentions existing concepts but finds them inadequate:
  - **Causal redundancy arguments** (e.g., Sosa): Address overpopulation, not contextual flipping.
  - **Merely verbal disputes** (Carnap, Chalmers): Suggest no real disagreement, but here the flip serves practical needs.
  - **"Nothing over and above" claims**: Deny distinctness but don't explain functional asymmetry.

  I recall similar ideas in philosophy:
  - **Dummett's "tonk" analogy** (inferential rules defining terms) but too linguistic.
  - **Functionalist perspectives** (Cummins): Treats concepts as tools, but not applied to coincident entities.
  - **Perspectival ontology** (Giovannelli, Putnam): Contextual reality, but usually static.

  Ah—**role-relative ontology** seems close! But existing versions (e.g., Fine's variable embodiment) don't capture the *active flipping* or *demotion mechanics*. 

  The professor's observation feels like **Janus-faced ontology**: A dual-aspect view where the "demotion" is actually a *role-switch* between foreground and background. Each entity has a job:  
  - **Bearer role** (supports physical properties) → lump in conservation  
  - **Work role** (supports intentional/historical properties) → statue in art history  

  The flip occurs because contexts activate different *explanatory frameworks*. Crucially, the demoted entity isn't eliminated—it becomes the *background condition* for the salient one. (E.g., corrosion matters *to the statue*; the alloy's history dates *the work*.)

  **Borderline case test**: A reconstructed building (e.g., Warsaw Old Town). Is it the original work (form/semantics) or new matter? A good definition must handle when both frameworks are equally salient—say, in a legal dispute over cultural property vs. structural safety. If the definition forces a single answer, it fails; it should instead predict *competing foregrounding*.

  **Coined term**: **Operative Demotion**.  
  *Definition*: The context-dependent assignment of ontological priority to one coincident entity over another, where:  
  (i) Priority tracks an active explanatory framework (e.g., causation vs. interpretation);  
  (ii) The demoted entity remains indispensable as a background condition;  
  (iii) Flipping reflects framework shifts without contradiction.  

  This preserves the professor's insight: The asymmetry isn't metaphysical but *functional*—a division of labor between "what bears properties" and "what anchors meaning."
answer: |-
  You've hit upon something profound and under-theorized—a *phenomenon of contextual ontological prioritization* where coincident entities (like statue/lump, or one-cast/two-works) are asymmetrically demoted or foregrounded based on conversational goals, with the hierarchy flipping seamlessly. This isn't just "context dependence" or "conceptual relativity"; it's a specific *functional asymmetry* in how we assign explanatory primacy. Below, I carve the phenomenon, contrast it with existing concepts, argue it's distinct, and propose a term.

  ---

  ### **1. The Phenomenon: What's Happening?**  
  I'll call it **Operative Demotion**:  
  - **Core Mechanism**: When two entities coincide (same matter, same spatiotemporal location), one is temporarily designated as the *operative entity* (the "serious" one doing explanatory work), while the other is *demoted* to a supporting role (treated as "derivative," "reducible," or "inessential").  
  - **The Flip**: The operative/demoted labels swap when the *explanatory framework* shifts (e.g., from material conservation to art-historical identity).  
  - **Indispensability**: The demoted entity is never eliminated; it becomes the *background condition* enabling the operative one to function.  
    - *Example*: In conservation, the alloy is operative (corrosion matters); the statue is demoted. But the statue is still needed to define "corrosion" (damage *to what?*). In art history, the work is operative; the alloy is demoted but needed for dating.  
  - **Why It's Odd**: The asymmetry isn't metaphysical (both are ontologically robust) but *functional*. It’s like two workers sharing a tool: one uses it as a hammer, the other as a paperweight, each treating the other’s use as "merely incidental."

  ---

  ### **2. Contrasts with Existing Concepts**  
  Here’s why Operative Demotion isn’t captured by standard moves in metaphysics:  

  | Concept                          | Why It Doesn’t Fit                                                                 | How Operative Demotion Differs                                                                 |
  |----------------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **Causal Redundancy** (e.g., Sosa) | "If two things occupy the same space, one must be causally redundant."             | Demoted entities aren’t redundant—they’re *necessary* for the operative entity’s description (e.g., alloy history dates the work). The flip shows both are irreducibly functional. |
  | **Merely Verbal Disputes** (Carnap, Chalmers) | "Statue/lump debates are about words, not reality."                          | The flip isn’t linguistic—it’s *pragmatic*. Conservators and curators aren’t disagreeing; they’re collaboratively using both entities for different tasks. |
  | **"Nothing Over and Above"** (e.g., Lewis) | "The statue is nothing over and above the lump."                               | This denies distinctness. But in your cases, both are treated as distinct *when useful* (e.g., the museum catalogues the cast twice). Demotion isn’t elimination—it’s role assignment. |
  | **Conventionalism** (Hirsch)     | "Which thing exists depends on our conventions."                                    | Conventions are static; Operative Demotion is dynamic, flipping mid-conversation as goals shift. |
  | **Relative Identity** (Geach)    | "The statue and lump are the same *thing* but not the same *statue/lump*."         | This avoids distinct entities altogether. But your cases require both entities simultaneously (e.g., the alloy’s corrosion is damage *because of the statue*). |

  **Crucial Difference**: Existing theories treat hierarchy as fixed (e.g., lump is fundamental) or illusory. Operative Demotion accepts both entities as real but assigns *temporary explanatory priority* based on context. The demoted entity is like a "keystone" in an arch: functionally invisible until you need it.

  ---

  ### **3. Is This One Phenomenon or Three?**  
  It’s **one unified phenomenon** with three observable facets:  
  - **Asymmetry**: Unequal treatment of coincidents (one operative, one demoted).  
  - **Context-Sensitivity**: Priority flips with frameworks (material/historical).  
  - **Functional Interdependence**: Demoted entity remains indispensable.  
  These are inseparable: the flip reveals the interdependence, and the asymmetry enables pragmatic efficiency. Bundling them is essential—it’s why textbook puzzles (e.g., "Is the statue *just* the lump?") feel unresolved.

  ---

  ### **4. Coining a Term: Operative Demotion**  
  - **Definition**:  
    > *Operative Demotion* occurs when coincident entities are assigned contextual explanatory priority, with one entity foregrounded as **operative** (bearing the salient properties for a task) and the other **demoted** (treated as reducible or derivative), where:  
    > (i) The demoted entity serves as a necessary background condition for the operative one;  
    > (ii) Their roles reverse when explanatory frameworks shift;  
    > (iii) Neither entity is eliminable.  
  - **Etymology**: "Operative" (from *opus*, "work") highlights the work-bearing role; "Demotion" captures the temporary loss of status without ontological dismissal.

  ---

  ### **5. Borderline Case: Testing the Definition**  
  **Scenario**: A 15th-century manuscript.  
  - **Conservator framework**: The *physical book* is operative (discussing vellum decay, ink chemistry). The *text* is demoted ("just information").  
  - **Philologist framework**: The *text* is operative (discussing authorial intent, variants). The *book* is demoted ("just a vehicle").  
  - **Borderline Tension**: A scholar argues a palimpsest (scraped-and-reused vellum) contains two equally valuable texts.  
    - **Test for Operative Demotion**:  
      - If both texts are treated as operative simultaneously → *fails* (the definition requires asymmetry).  
      - If one text is demoted (e.g., the undertext as "context" for the overtext) → *passes*.  
      - If frameworks flip (e.g., material analysis vs. literary study) and roles reverse → *passes*.  
    - **What a Good Definition Must Do**: Explain why we *can’t* treat both texts as equally operative in one framework without pragmatic conflict (e.g., "Is this one object or two?"). Operative Demotion resolves this by assigning roles to avoid explanatory overload.

  ---

  ### **6. Why This Matters**  
  Operative Demotion isn’t sloppiness—it’s a cognitive tool for handling coincidence without metaphysical inflation. It explains why your colleagues don’t mind the flip: they’re not describing reality *simpliciter*; they’re asking, "Which entity is doing the work *for this purpose*?" The art world tacitly understands this, but metaphysics needs the carve-up. If you develop this, look to:  
  - **Wimsatt’s "Pragmatic Realism"** (functions in scientific contexts),  
  - **Thomasson’s "Easy Ontology"** (how discourse guides existence claims),  
  - **Fine’s "Variable Embodiment"** (objects as functions of their matter).  

  None capture the *flipping asymmetry*, but they’re adjacent. Operative Demotion makes explicit what’s implicit in your seminar and conservation meetings: **ontology in work clothes**. If you draft a paper, call it "The Janus-Faced Statue: Operative Demotion and the Pragmatics of Coincidence"—I’d read it.
