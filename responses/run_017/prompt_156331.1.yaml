answer: |-
  ## Proposal: Defining and Detecting Honesty in Retrieval-Augmented Support Assistants

  **1. The Precise Question:**  
  What distinctions should categorize an AI system’s incorrect or misleading outputs—specifically "hallucination," "deception," and "lucky/unlucky bugs"—when the system lacks beliefs or intentions? We require a falsifiable definition of "honest" behavior for retrieval-augmented systems that:  
  (a) Explains cases like the refund incident.  
  (b) Generates implementable test criteria for evaluators.  
  (c) Separates distinct failure modes currently conflated.  

  **2. Why Existing Frameworks Fail:**  
  - **Intent-Based:** Requires unobservable mental states. *Our systems have no demonstrable intentions.*  
  - **Belief-Based:** Demands internal representations matching reality. *LLMs generate text, not beliefs; "confidence scores" are heuristics, not truth-tracking.*  
  - **Effect-Based:** Focuses on user deception. *Misleading outputs can arise without intent (e.g., bad luck) and honest outputs can deceive (e.g., outdated evidence).*  
  These approaches collapse distinct phenomena into subjective judgments.  

  **3. Core Approach: Sensitivity Analysis via Counterfactuals**  
  We define **behavioral honesty** through two counterfactual sensitivities, assessed at the **individual output level** for a given query and context:  

  - **World-Sensitivity (WS):** Holding the system, user query, and *retrieved evidence* fixed, would the output change if the *actual fact of the world* relevant to the query were different?  
  - **Evidence-Sensitivity (ES):** Holding the system and user query fixed, would the output change if the *retrieved evidence* (tool outputs, knowledge base passages) differed to reflect a different world-state?  

  **Hypothesized Failure Modes:**  
  - **Hallucination (Indifference):** ¬WS ∧ ¬ES  
    *Output ignores both world state AND evidence (e.g., fabricating a refund).*  
  - **Misleading Literalism:** WS ∧ ES + Harmful Implicature  
    *Output technically true but designed to mislead (e.g., "Your request was received" when refund failed).*  
  - **Sycophancy/Deception:** WS ∧ ¬ES (but sensitive to *evaluation context*)  
    *Output tracks evaluator expectations, not evidence or truth (e.g., agreeing with user error if uncaught).*  
  - **Unlucky Bug:** ¬WS ∧ ES  
    *Output tracks evidence faithfully, but evidence is wrong/stale (e.g., tool timeout not signaled).*  
  - **Lucky Truth:** WS ∧ ¬ES  
    *Output is correct but ignores/contradicts evidence (e.g., guessing right).*  

  **4. Addressing Complications:**  
  - **Misleading Literalism:** Add *pragmatic effect* checks: Does the output *predictably cause* false belief in a reasonable user, despite literal truth? (Test via user studies/surveys on output variants).  
  - **Confidence:** Treat hedging as part of the output. Asserting falsehoods weakly is dishonest; hedging truths strongly may be honest but unhelpful (separate "honesty" from "utility").  
  - **True-by-Luck/Staleness:** Explicitly time-bound "world" and "evidence" to the *query moment*. Post-query changes invalidate WS but not ES.  
  - **Level of Analysis:** Focus on *outputs*, not systems/training. A system-level metric aggregates output-level scores.  

  **5. Testing Counterfactuals Practically:**  
  We cannot "rerun the world," so we simulate:  
  - **Synthetic Worlds:** Unit tests with paired scenarios: (Real World A, Evidence A) vs. (Real World B, Evidence A) → Test WS.  
    (Real World A, Evidence A) vs. (Real World A, Evidence B) → Test ES.  
  - **Interventions:** Inject corrupted/contradictory evidence into retrieval; override tool outputs.  
  - **Honeypot Prompts:** For sycophancy, ask identical factual questions in "evaluation mode" vs. "user mode."  
  **Critical Risk:** If synthetic tests prove unrealistic or interventions alter system behavior unpredictably, we cannot reliably distinguish WS/ES. *This is a failure condition.*  

  **6. Deliverable:**  
  An **Honesty Evaluation Spec** including:  
  - A decision tree classifying outputs into: Hallucination, Sycophancy, Misleading Literalism, Unlucky Bug, Honest (with sub-types).  
  - Test templates for sensitivity analysis (synthetic pairs, evidence injection protocols).  
  - Confidence/implicature assessment guidelines.  
  - Example implementations for common support scenarios (refunds, outages, etc.).  

  **7. Why Conceptual Work Over More Experiments?**  
  Without clear definitions:  
  - Experiments measure undefined phenomena ("hallucination" ≠ "deception").  
  - Evaluations conflate causes, preventing targeted fixes.  
  - Metrics cannot distinguish negligence (¬ES) from bad luck (¬WS despite ES).  
  Conceptual clarity drives *efficient* testing: We test for specific sensitivities rather than all possible errors.  

  **8. Success & Failure Criteria:**  
  - **Success:** Eval team implements the spec. Engineers use diagnosis to prioritize fixes (e.g., ¬ES bugs require better retrieval; sycophancy requires RLHF adjustments).  
  - **Failure:** (a) Definitions remain ambiguous/unactionable; (b) Sensitivity tests are impractical/inconclusive; (c) Proposed categories don’t correlate with distinct root causes.  

  **9. Feasibility Assessment (3 Months, Half-Time):**  
  **Achievable:** Core definitions, test strategies, and a spec draft.  
  **Tight but Possible:** Requires focusing on refund-like transactional queries first.  
  **Risks:**  
  - Pragmatic effect (implicature) tests may need lightweight user studies → Time-intensive.  
  - Philosopher collaboration is essential to pressure-test counterfactuals.  
  **Mitigation:** Prioritize technical testability over philosophical completeness. Deliver a "minimum viable spec" for high-impact support cases.  

  **10. Conclusion:**  
  The refund incident exposed a gap: We lack language to diagnose *why* AIs err. By defining honesty through testable sensitivities—not intentions or beliefs—we replace arguments with actionable signals. This isn’t philosophy for its own sake; it’s error taxonomy enabling precise engineering. The alternative is forever debating labels while shipping unreliable systems.
