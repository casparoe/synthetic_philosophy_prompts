answer: |-
  Here’s your exam question, model answer, and marking scheme designed to meet your specifications:

  ---

  ### **1. Essay Question**  
  **Time Allowed:** 60 minutes  

  **Case:**  
  In 1911, a panel painting attributed to a minor seventeenth-century Dutch master underwent conservation: the entire paint and ground layer was lifted from its warped oak panel and remounted on a new mahogany support. Decades later, the museum re-examined its holdings. Dendrochronology dated the *original oak panel* (retained by the museum with a thin residue of ground layer) to the master’s lifetime. Pigment analysis revealed that the *paint layer now on display* dates to the 1880s. Archival research confirmed that a nineteenth-century restorer reconstructed the image from fragmentary remains and had it catalogued/sold as the master’s work. Thus, the displayed object is a nineteenth-century imitation using period materials, while the sole physical remnant of the seventeenth-century object is the nearly blank oak plank in storage.  

  **Instruction:**  
  Defend a position on **what kind of property "authenticity" is** and **what evaluative work this property performs** in this case. Your argument must:  
  - Explain whether authenticity is primarily a *historical*, *experiential*, or *relational* property (or another type), and why this matters.  
  - Account for the potential artistic and aesthetic value of **both** the hanging reconstruction *and* the blank plank.  
  - **Avoid** resolving the issue by deciding "which object is the real artwork" or relying on theories of indiscernibility or aura.  

  ---

  ### **2. Model Answer** (597 words)  

  This case fractures conventional assumptions about authenticity, demanding we clarify its nature. Authenticity here is not a monolithic property but a *relational historical status* tethered to specific contexts of production and reception. Its value lies not in brute physical continuity or subjective experience alone, but in how it anchors an object’s identity within networks of artistic intention, cultural narrative, and institutional authority.  

  The oak plank is undeniably the *physically continuous relic* of the 17th-century artifact. Its authenticity derives from its causal history: it is a trace of the master’s workshop, carrying forensic data (wood age, ground residue) that materially links it to the past. However, to claim this *makes it the primary locus of aesthetic value* commits a category error. Authenticity-as-continuity does not entail aesthetic significance. The plank’s value is archival or archaeological—it is evidence *of* the lost work, not an object *for* aesthetic engagement. Its worth is epistemic (it validates art-historical narratives) but not perceptual; it lacks the configured visual properties that invite interpretive experience. Prioritizing it conflates material provenance with artistic function.  

  Conversely, the hanging reconstruction possesses significant *artistic value*, despite its inauthentic attribution. The 19th-century restorer was not a forger but a reconstructor operating in good faith, reassembling the master’s composition from fragments. This object sustains the aesthetic encounter the original was designed to facilitate: its form, color, and composition deliver the perceptual and emotional impact intended by the Dutch tradition. To dismiss it as "merely a copy" ignores its status as a skilled *interpretive act*. Its value resides in its pictorial coherence, technical mastery, and continuity of artistic purpose—qualities independent of its misattribution. It functions *as art* because it successfully embodies and communicates artistic intent, albeit secondhand.  

  Yet the reconstruction’s *authenticity* is compromised. Its relational historicity is fractured: it originates from the 1880s restorer, not the 17th-century master. This matters because authenticity—as a relational property—grounds an artwork’s identity in its generative context. When we discover the reconstruction’s true origin, our understanding of its intentional and cultural significance shifts. It becomes a document of 19th-century art historical reverence, not a 17th-century creative statement. This recontextualization alters its meaning—not its perceptual qualities—demonstrating that authenticity shapes hermeneutic, not sensory, value.  

  Thus, authenticity performs distinct work for each object:  
  - For the **plank**, authenticity is an *archival* property, lending historical credibility but no aesthetic function.  
  - For the **reconstruction**, authenticity (as accurate attribution) is a *hermeneutic* property, clarifying its true cultural role as a revivalist artifact.  

  The case reveals authenticity as pluralistic. It is neither a guarantor of experience (the reconstruction provides that without it) nor reducible to material continuity (the plank has that without artistic value). Instead, it is a framework for *correctly situating* an object within art’s historical dialogues. The hanging picture remains valuable *as art*; the plank gains value *as evidence*; but only accurate attribution allows us to properly honor both their distinct contributions to artistic practice. Authenticity, therefore, is less about what we see than about how we understand what we see—a property that enables truthful engagement with art’s histories and hierarchies.  

  ---

  ### **3. Marking Scheme** (Total: 20 points)  

  #### **1. Defines authenticity as a relational/historical property, not material continuity or experience** (5 points)  
  - **5:** Clearly distinguishes authenticity from physical survival or perceptual qualities; frames it as contextual/historical.  
  - **Deduct 2–3 points** if: Student implies authenticity = unbroken physical matter (e.g., "the plank is authentic because it’s original wood").  
  - **Deduct 1–2 points** if: Reduces authenticity to audience experience (e.g., "authenticity is the feeling of connection").  

  #### **2. Argues the blank plank has epistemic/historical value but lacks aesthetic significance** (5 points)  
  - **5:** Affirms the plank’s value as evidence while denying it sustains aesthetic engagement.  
  - **Deduct 3 points** if: Asserts the plank is "the real artwork" or "what we should value" based solely on material continuity.  
  - **Deduct 2 points** if: Fails to address why material continuity ≠ aesthetic value.  

  #### **3. Attributes artistic/aesthetic value to the reconstruction independent of authenticity** (5 points)  
  - **5:** Identifies the reconstruction’s pictorial, technical, or expressive merits *despite* its inauthenticity.  
  - **Deduct 3 points** if: Dismisses the reconstruction’s value solely because "it’s not by the master."  
  - **Deduct 2 points** if: Only praises its historical value (e.g., "it shows 19th-century tastes") without addressing its aesthetic qualities.  

  #### **4. Explains why authenticity matters: hermeneutic recontextualization** (5 points)  
  - **5:** Argues authenticity correctly situates objects in artistic narratives (e.g., reconstruction as 19th-century homage vs. 17th-century original).  
  - **Deduct 3 points** if:** Reduces the loss of authenticity to "deception" without addressing its impact on meaning.  
  - **Deduct 2 points** if:** Vaguely claims authenticity "affects value" without specifying how.  

  ---

  ### **Key Design Notes**  
  - **Avoids Goodman/Benjamin traps:** No appeal to indiscernibility or aura; focuses on historicity and function.  
  - **Forces property analysis:** Students must categorize authenticity (e.g., historical, hermeneutic) and justify its role.  
  - **Blocks reductive errors:** Explicitly penalizes conflating material continuity with aesthetic value (§2) or dismissing the reconstruction’s artistic worth (§3).  
  - **Elevates beyond "which is real":** By demanding an account of *both* objects’ values and authenticity’s *function*, the question transcends binary ownership debates.  

  This structure ensures students grapple with authenticity’s philosophical mechanics—not just its verdicts—while your case study exposes the complexities of conservation, reconstruction, and artistic identity.
