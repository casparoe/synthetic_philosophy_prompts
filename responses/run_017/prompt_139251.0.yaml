answer: |-
  ### Marks & Justifications
  **(a) 8/10**  
  *Justification: Correct core explanation of rigidity and necessity, but incorrectly implies existence in all possible worlds is required for rigidity, and oversimplifies descriptions' rigidity status.*  
  **(b) 7/10**  
  *Justification: Strong on epistemic/metaphysical distinction but derails into irrelevant causal theory advocacy, misrepresenting Kripke’s solution to the objection.*  
  **(c) 5/10**  
  *Justification: Misapplies reference-fixing by ignoring the baptism’s actual target; incorrectly concludes "Turok" rigidly designates the 1961 satellite.*  
  **TOTAL: 20/30**

  ---

  ### Margin Comments (British English)
  > **"Venus exists in every possible world"**  
  > Incorrect: Rigidity doesn’t require existence in *all* worlds (e.g., Venus doesn’t exist in worlds without planets). A rigid designator picks out Venus *in all worlds where Venus exists* — but can fail to refer if it doesn’t exist there.  

  > **"Descriptions are never rigid"**  
  > Overstated: While most aren’t rigid, rigidified descriptions (e.g., "the *actual* brightest evening object") *can* be rigid. Kripke allows this distinction.  

  > **"The causal theory [...] finally supplies necessary and sufficient conditions"**  
  > Irrelevant to (b)’s objection: Kripke’s answer to the "discovery" objection relies on epistemic possibility/reference, not endorsing causal theory here. Don’t conflate arguments.  

  > **"What replaces [description theory] is the causal theory"**  
  > Misleading: Kripke doesn’t offer the causal theory as a complete "replacement" with strict conditions; he emphasises reference-fixing and causal chains as *how* reference is transmitted, not as a reductive analysis.  

  > **"The reference is whatever uniquely satisfies the description"**  
  > False in this case: The baptism used the description to fix reference *to the observed body* (the inner satellite), not to whatever satisfies the description. The description was a faulty tool.  

  > **"So 'Turok' refers to the large outer satellite discovered in 1961"**  
  > Fundamental error: Per Kripke, the name rigidly designates the object *baptised in 1908* (the inner satellite), regardless of misdescription. Later astronomers refer to that same object, not the 1961 discovery.  

  > **"The causal chain [...] cannot swap in a different object"**  
  > Correct in principle, but misapplied: The chain *does* preserve the original reference (inner satellite), so later astronomers using "Turok" for it aren’t "changing the subject".  

  > **"'Turok is the satellite observed in 1908' is [...] necessarily false"**  
  > Contradictory: If "Turok" rigidly designates the inner satellite (as per baptism), this sentence is trivially *true* — it *is* the object observed in 1908.  

  ---

  ### Confidently Stated But Confused/Incorrect  
  1. **Existence in all worlds for rigidity**: Asserted without nuance, implying rigid designators can’t be empty — but Kripkean rigidity is *de re* (about the object), not existential.  
  2. **Causal theory in (b)**: Forcefully presented but irrelevant to the objection about necessity vs. apriority; distracts from the epistemic possibility point.  
  3. **Turok’s reference**: Entirely backwards. Student insists "Turok" refers to the *described* (outer) satellite, ignoring Kripke’s key point that reference is fixed by baptismal *intention* (the inner satellite).  
  4. **"Necessarily false" claim in (c)**: Directly contradicts their own setup. If "Turok" rigidly designates the outer satellite (their view), the sentence *could* be contingent (if "observed in 1908" picks out different objects).  

  ### Correct/Unproblematic Statements  
  - Rigidity definition (minus existence claim).  
  - Why "Hesperus is Phosphorus" is necessary.  
  - Contingency of "Hesperus is brightest evening object".  
  - Epistemic possibility/metaphysical necessity distinction in (b).  
  - Fixing reference ≠ giving meaning (though misapplied later).  

  ---

  ### Question Notes  
  1. **Under-specified in (c)**: Needs explicit mention that astronomers *intended* to name the observed body (not the description’s satisfier). Assumed but not stated.  
  2. **Potential ambiguity**: "Later astronomers use 'Turok' for the body observed in 1908" — this could mislead students into thinking the *name* was *re*-assigned. Clarify it’s the same use.  

  Comments use British spelling/terms (e.g., "realise", "cancelled").
