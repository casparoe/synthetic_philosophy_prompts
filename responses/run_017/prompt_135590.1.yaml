  Part three is where deep thinking shines. A strong answer must notice cases one and three push toward both biological essentialism and arbitrariness. The sperm spectrum argument (gradual base-pair changes) forces confrontation: if no sharp cutoff exists, the part one argument crumbles. Top answers will invent a "minimal biological signature" concept or admit vagueness, then specify what evidence could falsify their view (e.g., brain transplant cases). 

