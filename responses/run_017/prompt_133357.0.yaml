  Here's a precise breakdown of the theories, a claim-by-claim analysis of the passage, and the application to your satellite bracket case, reflecting genuine specialist disagreements where they exist.

  **Core Concepts (Distinct but Related):**

  1.  **Epistemic Contextualism (EC):** This is a **semantic thesis** about the word "knows" and its cognates. EC claims that the *truth-conditions* of knowledge attributions ("S knows that p") are sensitive to the **conversational context of the attributor** (the person saying "S knows"). The standards for what counts as "knowing" shift with this context, much like the standards for "tall" shift in contexts like "tall for a jockey" vs. "tall for an NBA player." Crucially:
      *   **What shifts:** The *semantic meaning* of "knows" itself. Different contexts deploy different concepts of knowledge with varying stringency.
      *   **What causes the shift:** Features of the *attributor's* context – often the stakes they perceive, salient error possibilities they raise, or the purposes of the conversation.
      *   **What it explains:** How speakers can seem to contradict each other ("I know"/"You don't know") without either being wrong, because they are using "knows" with different standards. The *subject's* (S's) actual situation (evidence, stakes) remains fixed.

  2.  **Pragmatic Encroachment (PE):** This is a **metaphysical thesis** about the nature of knowledge itself. PE claims that whether a true belief held by a subject (S) counts as *knowledge* can depend, in part, on **non-evidential, pragmatic factors** – primarily the **stakes for the subject S** in being right or wrong about *p*. Crucially:
      *   **What is affected:** The *knowledge relation* itself between S and p. It's about what knowledge *is*, not just how we talk about it.
      *   **What causes the effect:** The *subject's* (S's) practical situation – the costs of being wrong, the importance of being right for their decisions/actions.
      *   **What it explains:** Why subjects need *stronger* evidence to know something in high-stakes situations, even holding their purely epistemic situation constant. Knowledge is not "purely evidential."

  **Where They Come Apart (Key Distinctions):**

  *   **Locus of Sensitivity:** EC locates sensitivity in the *language* used by the *attributor*. PE locates sensitivity in the *knowledge state* of the *subject*.
  *   **Subject's Stakes:** For EC, the *subject's* stakes are irrelevant *unless* they become salient in the *attributor's* context. For PE, the *subject's* stakes are directly constitutive of whether they know, regardless of anyone's context.
  *   **Truth-Makers:** In EC, whether "S knows p" is true depends on which epistemic standard governs the attributor's context. In PE, whether S *actually knows* p depends on S's stakes and evidence.
  *   **The "Same Idea"?** No. EC is about how we *talk* about knowledge in different contexts. PE is about how practical factors *constitute* knowledge. They offer different explanations for similar phenomena (e.g., needing more evidence in high stakes).

  **Analysis of the Passage (Claim-by-Claim):**

  1.  **"Knowledge, it claimed, used to be understood as true belief plus good evidence..."**
      *   **Status:** Simplification (mostly acceptable). The "standard analysis" was traditionally Justified True Belief (JTB, where justification was often understood evidentially). Gettier problems showed JTB insufficient, but evidentialism (knowledge depends only on evidence/justification) was a dominant background view. Specialists wouldn't quibble too much with this as a starting point.

  2.  **"...so whether you know depends only on your reasons and nothing else."**
      *   **Status:** Fine as stated (for describing the traditional "purist invariantist" view EC/PE react against). This defines "purism" or "evidentialism".

  3.  **"Then along came epistemic contextualism, which points out that 'knows' behaves like words such as 'flat' or 'tall': the standards it sets shift with the context of the conversation..."**
      *   **Status:** Fine as stated (core claim of EC).

  4.  **"...so I can truly say on Friday that I know the bank will be open on Saturday, and yet later that day, when missing a mortgage payment is on the line, that very claim about me is false."**
      *   **Status:** Fine as stated (classic DeRose/Cohen-style bank case illustrating EC). EC explains this as the *attributor's* context changing the meaning of "knows". The Friday attributor uses a low-standards "knows", the Saturday attributor uses a high-standards "knows".

  5.  **"Pragmatic encroachment... is just the same idea in different clothes: how much is at stake for the person determines whether they know..."**
      *   **Status:** **Misleading or Wrong.** This is the core conflation. EC focuses on the attributor's context defining the word's meaning; PE focuses on the subject's stakes constituting the knowledge relation. They are distinct theoretical explanations. While both acknowledge stakes matter, *how* and *why* they matter differs fundamentally. PE is *not* simply EC rephrased.

  6.  **"...so knowledge is partly a practical matter rather than a purely evidential one."**
      *   **Status:** Fine as stated (core claim of PE).

  7.  **"The invariantists... are therefore committed to saying that evidence is the only thing that matters..."**
      *   **Status:** **Misleading or Wrong / Doesn't do the work.** This oversimplifies invariantism. There are two main types:
          *   *Purist Invariantism:* Yes, holds only evidence matters for knowledge. Stakes affect what one *should do* given a belief, not whether it's knowledge.
          *   *Impurist Invariantism (Subject-Sensitive Invariantism - SSI):* This *is* a form of Pragmatic Encroachment! (e.g., views of Fantl, McGrath, Hawthorne, Stanley). SSI agrees with PE: the subject's *stakes* directly affect whether they know, *and* the standards are invariant (fixed) – it's just that those fixed standards *include* stakes sensitivity. The passage wrongly implies all invariantists deny stakes matter to knowledge. SSI invariantists *deny* that the word "knows" is context-sensitive (deny EC) but *affirm* that stakes affect the knowledge relation (affirm PE).

  8.  **"...and they're stuck denying the obvious point that you need stronger evidence when more is riding on being right."**
      *   **Status:** **Misleading or Wrong.** *No* serious invariantist denies this obvious point. The disagreement is about *why* you need stronger evidence:
          *   **Purist Invariantist:** You need stronger evidence *to be rationally justified in acting* on the belief in high stakes. Knowledge itself (requiring justification) might still be present with the original evidence, but acting on it would be reckless. Knowledge ≠ Actionability.
          *   **EC:** You need stronger evidence to satisfy the *higher semantic standards* for "knows" in the high-stakes *conversational context*.
          *   **PE/SSI:** You need stronger evidence *to know* in high stakes because stakes are partly constitutive of knowledge. The justification threshold *for knowing* rises with stakes.

  9.  **"Both views share an unacceptable consequence... a stranger who secretly places a huge bet... can destroy your knowledge without your ever finding out..."**
      *   **Status:** **Fine but doesn't do the work the author wants / Contentious.** This *is* the famous "Secret Stakes" or "Ignorant High Stakes" objection. However:
          *   **Against EC:** This objection largely *misses* EC. EC is about the attributor's context. If *I* (the subject) am unaware of the bet, and no attributor is in a context where the high stakes are salient, then *attributors* using "knows" with low standards relative to *their* contexts can still *truly* say "I know p". The secret bet doesn't change *my* knowledge state according to EC; it might only change what a hypothetical attributor *aware* of the bet could truthfully say. EC generally *avoids* this consequence.
          *   **Against PE/SSI:** This objection **is serious and central** to debates about PE/SSI. If knowledge depends on the *subject's* actual practical situation, and a secret bet radically increases the cost of being wrong *for the subject* (even if they are oblivious), then PE/SSI *does* seem committed to the subject losing knowledge. Proponents (e.g., Fantl & McGrath) bite the bullet or argue the stakes *aren't* truly the subject's if they are oblivious (contentious). Critics (e.g., Brown, Reed) find this consequence absurd and a major cost of PE/SSI. **This is a genuine point of significant disagreement.**

  10. **"...since that's obviously absurd, the whole family of views is refuted."**
      *   **Status:** **Misleading or Wrong.** The objection primarily targets PE/SSI, not EC. EC has plausible replies. PE/SSI proponents offer defenses. The objection hasn't achieved consensus refutation; it's a live debate point highlighting a cost for PE/SSI. Dismissing *all* the views ("the whole family") based on an objection that mainly applies to one subset is incorrect.

  **Applying the Surviving Analysis to Your Satellite Bracket Case:**

  1.  **Friday (Normal Stakes):**
      *   **Purist Invariantism:** You *knew* (assuming true belief + sufficient evidence for the context). The stakes were low, your evidence was sufficient for knowledge.
      *   **EC:** An attributor in *your* context (low stakes, routine check) could truly say "You know the bracket is within spec." The *sentence* "You know" is true relative to that context.
      *   **PE/SSI:** You *knew* (sufficient evidence relative to the low stakes you were aware of).

  2.  **Saturday (Secret High Stakes):**
      *   **Purist Invariantism:** You *still knew*. Your evidence and belief state didn't change. The astronomical stakes mean it would be *catastrophically irresponsible* for your manager to *act* on *your* belief/log entry without further verification. But *knowledge* itself hasn't vanished. "We shouldn't act on this belief without checking again" ≠ "This belief isn't knowledge."
      *   **EC:** An attributor aware of the high stakes (e.g., your manager, or someone discussing the satellite shipment) would likely use "knows" with very high standards. Relative to *that* context, the sentence "You knew on Friday" (or "He knows") would likely be *false*, because your evidence doesn't rule out the now-salient possibility of catastrophic failure. Crucially, *your own* knowledge state on Saturday (if you remained unaware) is unchanged; it's the truth of *attributions* about your Friday state that shifts. If *you* said on Saturday (unaware) "I knew it was fine Friday," that might *still* be true relative to *your* low-stakes context.
      *   **PE/SSI:** This is where the secret stakes bite hard. If the stakes for *you* (or your employer, where you bear responsibility) were objectively sky-high on Saturday *even though you didn't know it*, then proponents argue you *ceased to know* on Saturday. Your Friday evidence is no longer sufficient *for knowing* given the immense practical cost of being wrong. **This is the controversial consequence.** Critics find it deeply counterintuitive that your knowledge state flickered off due to a secret change.

  3.  **Monday (Stakes Evaporated):**
      *   **Purist Invariantism:** You *still knew/know* (nothing changed epistemically).
      *   **EC:** Attributors can likely revert to using "knows" with lower standards. Attributions about your Friday belief become true again in those contexts.
      *   **PE/SSI:** If the stakes genuinely returned to normal, proponents would likely say you *regained* knowledge on Monday. Yes, knowledge would "flicker." Critics argue this is absurd: knowledge states shouldn't depend on external, unknown practical fluctuations.

  **Other Specifics:**

  *   **Moral Encroachment:** This is a newer view suggesting *moral* stakes (e.g., potential for harm, injustice) can also encroach on justification/knowledge, distinct from purely practical stakes. While your case involves financial stakes and potential harm (satellite failure), it's primarily analyzed under pragmatic encroachment. Moral encroachment might add nuances if the bracket failure could cause human harm (beyond financial loss), but it wouldn't fundamentally change the analysis above relative to PE/SSI vs. alternatives. The "secret bet" problem applies similarly.
  *   **Whose Stakes?** This matters crucially for PE/SSI. Proponents would argue the stakes relevant to *your* knowledge are those bearing on *your* actions/responsibilities. If the $40M risk and responsibility fell entirely on your manager/client *and* you had no reasonable expectation of such stakes, they *might* argue the stakes weren't truly *yours* on Saturday, meaning you didn't lose knowledge. However, if you were the engineer who signed off and would share responsibility for failure, proponents would likely insist the stakes *were* yours objectively, even if unknown. This is a point of interpretation within PE/SSI.
  *   **Secret Bet Objection:** As analyzed, it's a serious and widely discussed problem for PE/SSI specifically. Proponents have replies (e.g., denying oblivious stakes are *real* stakes for the subject; biting the bullet), but many find it a significant cost. It's not a problem for EC or Purist Invariantism. The blog post misapplied it to "the whole family."

  **Your Intuition:** Your inclination ("stakes change what you should *do*, not what you know") aligns perfectly with **Purist Invariantism** (the traditional view defended by critics of EC and PE, e.g., Bach, Reed, Williamson in some aspects). It's a major, well-defended position. You're not being stubborn; you're siding with a significant branch of epistemology.

  **Conclusion:** The blog post seriously conflated EC and PE. The key difference is semantic (EC) vs. metaphysical (PE). The post also misrepresented invariantism. Your satellite case vividly illustrates the core disagreement: Purists/EC (in different ways) preserve your Friday knowledge through the secret high-stakes period, while PE/SSI forces a knowledge "flicker." The secret bet objection is a genuine headache for PE/SSI but not for EC. Your intuition is philosophically respectable.
