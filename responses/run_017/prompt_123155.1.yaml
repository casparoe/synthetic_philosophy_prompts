  ### Case Design

  Consider a colloidal particle in a double-well potential (states L and R, each with energy 0), initially at equilibrium with a single heat bath at 300 K, so \( P(L) = P(R) = 0.5 \). The demon is a finite tape of bits, each realized as a symmetric double-well system (states 0 and 1) with initial probability \( P(0) = P(1) = 0.5 \) (Shannon entropy 1 bit per bit). The tape is advanced externally after each cycle. The demon measures the particle's position via a weak coupling to the current tape bit: it tilts the tape bit's potential adiabatically to correlate it with the system. Due to thermal noise, the measurement has an error rate \( \epsilon = 0.1 \) (Shannon entropy of measurement outcome: 1 bit; mutual information with system: \( I(S;M) = 1 - H_b(0.1) \approx 0.531 \) bits, where \( H_b(\epsilon) = -\epsilon \log_2 \epsilon - (1-\epsilon)\log_2(1-\epsilon) \) is the binary entropy). Based on the measured state, the demon quasistatically adjusts the system's potential: if \( M = \text{L} \), it lowers the right well by \( \delta E \); if \( M = \text{R} \), it lowers the left well by \( \delta E \). The particle then relaxes isothermally, extracting work. The potential is reset symmetrically, and the system re-equilibrates. Writing to the tape is done reversibly during measurement coupling, costing zero average work since the initial and final tape bit distributions are identical (uniform). The work extracted arises from the energy drop \( \delta E \), chosen as \( kT \ln(1 + \alpha) \) for correct measurement and \( kT \ln(1 - \alpha) \) for incorrect, with \( \alpha = 1 - 2\epsilon = 0.8 \) to maximize work.

  #### 1. Cycle Quantities (per cycle)
  - Work extracted: \( W = (1-\epsilon) kT \ln(1+\alpha) + \epsilon kT \ln(1-\alpha) = kT [(0.9)\ln(1.8) + (0.1)\ln(0.2)] \approx 0.368 \, kT \) (joules)  
    In units of \( kT \ln 2 \): \( W / (kT \ln 2) \approx 0.368 / 0.693 \approx 0.531 \).  
  - Bits written to tape: 1.  
  - Shannon entropy of record: 1 bit (outcome uniform).  
  - Mutual information \( I(S;M) \): \( 1 - H_b(0.1) \approx 1 - 0.469 = 0.531 \) bits.  
    Verify binary entropy: \( H_b(0.1) = -0.1 \log_2 0.1 - 0.9 \log_2 0.9 \approx 0.469 \) bits. Mutual information matches.

  #### 2. Ledgers (units: \( kT \ln 2 \))
  - (a) **Erasure ledger**: Cost = 0 (no bits erased in cycle). Gain = 0.531. Net = +0.531.  
  - (b) **Feedback ledger**: Work bound = \( kT \cdot I(S;M) \approx 0.531 \, kT \ln 2 \). Gain = 0.531, exactly matching the bound. Compensation occurs physically in the measurement coupling: thermal noise during the weak coupling dissipates \( kT \) times the conditional entropy \( H(S|M) = H_b(\epsilon) \approx 0.469 \) bits, accounting for measurement irreversibility. The difference (entropy of record minus mutual information, \( 1 - 0.531 = 0.469 \) bits) is the measurement noise entropy, dissipated as heat.  
  - (c) **Resource ledger**: Tape bit entropy change = 0 (initial and final entropy both 1 bit). Cost = 0. Gain = 0.531. Net = +0.531. Restoration cost is deferred: to reuse the tape, an external agent must erase it, paying \( kT \ln 2 \) per bit externally later. During the cycle, the fresh tape bit is a consumable low-entropy resource? No—it starts with high entropy (1 bit), and writing doesn't reduce it. The "resource" is the *ability to write without immediate erasure cost*, enabled by the tape's initial randomness.

  #### 3. Structural Feature and Collapse
  The key feature is the **initial randomness of the tape bit** (entropy 1 bit). Writing leverages this to avoid immediate work cost.  
  - **Removal (reset memory per cycle)**: Suppose we reset the tape bit to 0 before writing. Initial entropy = 0. Writing a uniform random bit now costs average work \( 0.5 \cdot 0 + 0.5 \cdot kT \ln 2 = 0.5 \, kT \ln 2 \) (half the time flipping 0 to 1). Work extracted is still 0.531 \( kT \ln 2 \), but net work = \( 0.531 - 0.5 = 0.031 \, kT \ln 2 \). However, the mutual information bound is unchanged at 0.531, and net work is positive, but this is inconsistent. Correction: When resetting to 0, the nonequilibrium free energy change during writing is \( \Delta F = -T \Delta S = kT (S_{\text{final}} - S_{\text{initial}}) = kT ( \ln 2 - 0 ) = kT \ln 2 \) (since final entropy is 1 bit). Thus, writing costs at least \( kT \ln 2 \), and net work = \( 0.531 - 1 = -0.469 \, kT \ln 2 < 0 \), restoring consistency. The output work is bounded by \( kT I(S;M) \approx 0.531 \), exceeded only if writing costs are ignored.  
  - **Recycle medium inside device**: If the device must erase the tape bit after use, cost \( kT \ln 2 \) is paid internally per cycle. Net work = \( 0.531 - 1 = -0.469 \, kT \ln 2 \). Collapses to a net sink, like a standard engine where erasure consumes extracted work.

  #### 4. Reply from Erasure Ledger Defender
  **Defender's reply**: "Writing defers erasure; the \( kT \ln 2 \) cost is paid when fresh blank bits are prepared externally. Your gains are offset by future erasure costs, showing no violation."  
  **Analysis**: This is a **relocation of the system boundary**, not a fundamental explanation. The case establishes:  
  - Within the cycle's boundary (excluding tape reset), erasure is **not** the locus of cost—writing can occur without immediate dissipation by consuming the tape's initial entropy.  
  - The erasure ledger fails to account for gains when no erasure happens in the cycle.  
  - However, for perpetual operation, the tape must be reset externally, paying \( kT \ln 2 \) per bit, negating work gains over full cycles including reset. Thus, the case does **not** violate the second law but shows erasure is **merely a convenient accounting point**, not the only possible locus of cost. The cost can be shifted to the preparation of the tape, highlighting that thermodynamic accounting depends on boundary choice.
