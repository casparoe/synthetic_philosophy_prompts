prompt: |-
  You are a professional philosopher working at the intersection of philosophy of technology, social epistemology, and the study of institutions, with working knowledge of how AI systems are actually governed inside large organizations. I want careful conceptual work here, not a literature dump. Do not give me bibliographies, reading lists, or citations to chase: I have no library and no web access, and I want your own analysis. If you mention a named idea, describe it in a sentence, because I will not be able to look it up. Take your time over the candidate set before you start drafting.

  Here is the background and the thing I have noticed. I work in the second line of defense at a large insurer, and for the past two years I have sat on the internal committee that assigns each deployed model one of two governance labels before it goes live. Roughly: "tool" (the system produces recommendations; a named human reviewer with real authority and real capacity to override signs off on each one; accountability stays with the human; light oversight regime) versus "agent" (the system is allowed to carry a multi-step task through without per-action human approval; heavier regime; the deployer carries the exposure).

  What I keep watching happen is this. A system earns the "tool" label because the override is genuine: in the first months reviewers change a meaningful fraction of recommendations, and the committee can point to that as its evidence. Then the model improves and the override rate falls. Nothing is wrong yet. But three things follow. First, the skill that made the override meaningful gets exercised less and decays — a reviewer who now sees two hundred recommendations a day, of which perhaps one is wrong, and who is measured on throughput, is not in a position to catch that one. Second, the organization acquires a strong interest in the "tool" label, since the label is what keeps the system in the light regime and leaves the residual liability with the human; so the review interface, the time budget per case, and the documentation requirement all get shaped in ways that preserve the form of review. Third — and this is the part I take to be distinctive — the artifacts of the eroded practice are then offered as evidence that nothing has eroded. The file shows 99.7% of decisions "human-reviewed." That figure is cited back to the committee as the reason to renew the tool classification, and to the auditor as the reason the control is effective.

  So: the conditions that justified the label are consumed by the consequences of holding it, and the accounting trail left by the degraded practice is what certifies that the conditions still hold.

  Three further instances, in case they help you see the shape rather than my generalization:

  - Hospital imaging: a model flags possible findings and the radiologist "reads" the flagged study. The hospital reports that every flagged study is read by a physician. Reading has quietly become confirmation.
  - Public benefits eligibility: the analyst must type a justification in order to deviate from the model's recommendation; writing one up takes twenty minutes and attracts supervisory attention. Deviation rates go to near zero. The program reports a human determination in every case.
  - Software: a developer reviews a generated diff line by line, accepts it, and merges. When the resulting bug ships, the developer is the person asked about it, on the grounds that a human put their name to it.

  What I have already tried and set aside: "Goodhart's law" is about a measure ceasing to track its target once it becomes a target; here the measure is not so much gamed as left reading the same number while the underlying capacity quietly disappears. "Automation bias" and its neighbors get the psychology of over-trust but not the governance loop, and they say nothing about the third step, where the output of the degraded practice is offered as proof of its own integrity. "The responsibility gap," as I understand it, concerns cases where no one can be held responsible; here responsibility is assigned very precisely and even advertised, which is part of what stabilizes the arrangement.

  So my question is whether there is an established concept for this exact configuration, and if not, how it should be carved.

  Please answer in American English, in the following sections, in this order, at roughly these lengths:

  1. Brainstorming (150–200 words). Before you settle on anything, list a dozen candidate concepts from whatever fields they come from — philosophy, science and technology studies, organizational sociology, law, human factors, auditing, anywhere — unsorted, one line each. I want to see the raw candidate set and not only your finalists.

  2. Nearest existing concept (250–300 words). The single best fit that already has a name. State the concept, the field it comes from, exactly how my case instantiates it, and exactly where it stops short.

  3. Runner-ups and the point of divergence (200–250 words). Three or four more, each with the one sentence that rules it out. I care more about your reasons for exclusion than about the list itself.

  4. Verdict (about 100 words). Does anything established cover the whole configuration, or is there a genuine gap? Be direct: if the right answer is that this is a special case of something already named and I am over-describing it, say so plainly.

  5. Definition and coinage (300–350 words). Either way, finish the carving. Give me the necessary conditions — I provisionally think there are three: a status assigned on the basis of a capacity; the assignment predictably degrading that capacity; and artifacts of the degraded practice being counted as evidence that the capacity is intact. Correct or replace them. Then give me a name and a one-sentence definition, and say what the coinage is supposed to let us see that the nearby terms conceal.

  6. Boundary cases (about 250 words). Five cases of your own choosing, with an in-or-out verdict and a one-line reason for each. Please include at least one case where the capacity decays but nobody has an interest in the label, and one where the label was never warranted at all — a pure rubber stamp from the first day. Is the second of those my phenomenon or a different one?

  7. Field test (100–150 words). What would I measure, or what could I run, to tell this phenomenon apart from its lookalikes in a live deployment?

  A name on its own is not what I am after; I need the joints.
reasoning: |-
  Okay, the user is a professional in risk governance at an insurer, dealing with AI model classification between "tool" and "agent" labels. They've observed a pattern where systems initially classified as "tools" (requiring human override) degrade over time: human reviewers lose skills due to low override rates, the organization becomes invested in maintaining the "tool" label for liability reasons, and the system's own metrics (like 99.7% review rates) are used to justify the continued classification despite eroded oversight. They've already considered and dismissed concepts like Goodhart's law, automation bias, and responsibility gap as incomplete fits.  

  Hmm, this is a sophisticated institutional pathology. The core tension lies in how the governance label itself triggers organizational behaviors that hollow out the very conditions justifying the label, while generating self-validating paperwork. The user wants precision—not just a name but conceptual surgery to isolate the mechanism.  

  First, I'll brainstorm candidate concepts. Obvious picks include moral crumple zone (from STS), but that's about blame deflection, not systemic erosion. Epistemic capture fits the self-justifying aspect but misses the capacity decay. Performativity (from sociology) describes how labels shape reality, but doesn't specify this negative feedback loop. Decisional atrophy (from human factors) captures skill loss but not the institutional incentives.  

  For the nearest existing concept, I'm landing on institutional isomorphism—specifically coercive isomorphism. It explains how labels (like "tool") trigger compliance behaviors that preserve formal structures (review interfaces) while gutting substance (actual oversight). But it stops short by not addressing how the gutted process then provides "evidence" of its own integrity.  

  Runner-ups:  
  - Moral crumple zone: Only explains blame absorption, not the full erosion cycle.  
  - Epistemic decoupling: Describes policy-practice gaps but not the self-validating metrics.  
  - Normalization of deviance: Focuses on risk tolerance creep, not label-driven decay.  

  Verdict: Genuine gap. Existing terms cover fragments but miss the tripartite structure: (1) status assigned based on capacity → (2) status degrades capacity → (3) artifacts of degraded capacity "prove" status is valid.  

  For carving:  
  Necessary conditions:  
  1. **Conditional status**: A label ("tool") granted contingent on demonstrable capacity (meaningful override).  
  2. **Status-induced decay**: The label triggers behaviors that erode that capacity (throughput pressure, skill atrophy).  
  3. **Artifactual validation**: Outputs of the degraded practice (review logs) are used as evidence the capacity exists.  

  Name: **Label-Induced Epistemic Hollowing (LIEH)**. It highlights how the label actively creates the emptiness it then papers over with data.  

  Boundary cases:  
  - Pure rubber stamp (not LIEH): No initial capacity existed, so no erosion cycle.  
  - Capacity decay without label incentive (not LIEH): Skill fades but no one defends the status.  
  - Deliberate deception (not LIEH): Active fraud lacks the "unintended" systemic erosion.  

  Field test: Track override rates *before/after* label assignment, correlate with changes in reviewer incentive structures, and audit whether override attempts are meaningfully scrutinized or just procedural. LIEH shows a specific sequence: high initial overrides → drop after label → metrics used to justify status quo.
answer: |-
  ### 1. Brainstorming  
  - **Moral crumple zone** (STS): Human becomes a blame-absorber for system failures.  
  - **Institutional isomorphism** (sociology): Organizations mimic structures (like "review") for legitimacy, decoupling form from function.  
  - **Epistemic capture** (philosophy): Metrics dominate perception, obscuring eroded reality.  
  - **Performativity** (STS/economics): Labels (e.g., "tool") shape behavior to conform to their definition.  
  - **Decisional atrophy** (human factors): Skills degrade when not exercised in meaningful contexts.  
  - **Coercive isomorphism** (sociology): External pressures (e.g., liability) force adoption of symbolic practices.  
  - **Simulacrum** (philosophy): Artifacts (e.g., logs) become empty signifiers of control.  
  - **Normalization of deviance** (safety engineering): Erosion becomes accepted as "normal" via documentation.  
  - **Epistemic decoupling** (organizational theory): Policy (review requirement) detaches from practice (rubber-stamping).  
  - **Responsibility laundering** (law/STS): Delegation to humans obscures system agency.  
  - **Cybernetic irony** (systems theory): Feedback loops (e.g., low overrides "proving" safety) entrench dysfunction.  
  - **Metric fixation** (management): Over-reliance on quantitative evidence (99.7%) blinds to qualitative decay.  

  ### 2. Nearest Existing Concept  
  **Coercive isomorphism** (organizational sociology, DiMaggio & Powell). Organizations adopt structures in response to external pressures (e.g., regulatory liability), leading to ceremonial compliance where formal processes exist but lack substance. Your case instantiates it perfectly: the "tool" label is maintained to satisfy auditors/regulators, preserving the *form* of human review (interfaces, logs) while its *substance* (critical engagement) decays due to throughput metrics and liability shields. It stops short by not explaining the *epistemic feedback loop*: the artifacts of the hollowed process (review logs, 99.7% metric) are weaponized as proof of robustness, accelerating the erosion. Isomorphism describes structural mimicry but not how the mimicry generates self-validating evidence.  

  ### 3. Runner-Ups and Divergence  
  - **Moral crumple zone** (STS, Madeleine Clare Elish): Humans bear blame for system failures. *Diverges*: Your case involves systemic *procedural erosion*, not just individual blame-shifting.  
  - **Epistemic decoupling** (organizational theory): Policies (e.g., "review required") detach from practice. *Diverges*: It misses the *causal role of the label itself* in triggering the erosion.  
  - **Normalization of deviance** (Diane Vaughan): Gradual acceptance of risky shortcuts. *Diverges*: Your erosion is driven by *incentives tied to a governance label*, not routine complacency.  
  - **Performativity** (STS, Mackenzie): Labels enact the realities they describe. *Diverges*: It doesn’t capture the *degradation cycle* where the label consumes its own justification.  

  ### 4. Verdict  
  Genuine gap. Coercive isomorphism and decoupling are adjacent but miss the core triad: (1) a label assigned conditionally on capacity, (2) the label’s incentives eroding that capacity, and (3) the degraded process producing artifacts that "prove" the label’s validity. No extant concept captures this self-consuming, evidentiary loop.  

  ### 5. Definition and Coinage  
  **Necessary Conditions**:  
  1. **Conditional status**: A system/role is assigned a privileged status (e.g., "tool") based on demonstrated capacity (e.g., meaningful human override).  
  2. **Status-induced decay**: The status creates incentives (e.g., liability avoidance, efficiency) that degrade the capacity (e.g., skill atrophy, interface design).  
  3. **Artifactual validation**: Outputs of the degraded practice (e.g., review logs, override rates) are used as evidence that the capacity exists, reinforcing the status.  

  **Name**: **Label-Induced Epistemic Hollowing** (LIEH)  
  **Definition**: *A process whereby a governance label, assigned based on a capacity, triggers organizational behaviors that erode that capacity, while generating artifacts that falsely certify the capacity’s persistence.*  
  **Coinage Purpose**: It isolates the *feedback loop* concealed by nearby terms: the label isn’t just gamed (Goodhart) or decoupled (isomorphism)—it actively consumes the condition for its own existence and replaces it with simulacral evidence.  

  ### 6. Boundary Cases  
  - **Hospital triage AI**: Nurses override an AI’s "low-risk" assessments 40% of the time initially, but after "safety certification," override rates drop to 1% due to time pressure. *In*: All three conditions met (status → decay → validation via logs).  
  - **Autopilot disengagement**: Pilots manually override systems during training, but skill decays with automation. *Out*: No "label" (e.g., regulatory status) driving decay; just skill attrition.  
  - **Pure rubber stamp**: A clerk "reviews" loan approvals from day one with no overrides. *Out*: Condition 1 unmet; no initial capacity to erode.  
  - **Deliberate deception**: A firm fakes review logs to avoid "agent" classification. *Out*: Condition 2 unmet; decay isn’t an *unintended consequence* of the label.  
  - **Regulator-mandated review**: After an incident, regulators require human review, and override rates rise. *Out*: Condition 3 unmet; artifacts reflect *genuine* capacity.  

  ### 7. Field Test  
  Measure: **Override attempt scrutiny**. In a live deployment, secretly seed cases with subtle errors. Track:  
  - *Override rate* on seeded cases (tests residual capacity).  
  - *Reviewer justification depth* (e.g., word count, specificity in logs).  
  - *Time-to-override* (indicates cognitive engagement).  
  LIEH predicts: (1) Near-zero override attempts on seeded cases despite errors, (2) shallow justifications when overrides occur, and (3) logs still cite "100% reviewed" as proof of control. Contrast with Goodhart (override rates manipulated but scrutiny intact) or decoupling (reviews skipped entirely).
