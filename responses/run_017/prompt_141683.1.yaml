prompt: |-
  hey — quick one. I work on the procurement side of a public agency, and we're trying to write fairness requirements into the contracts we sign with vendors who sell us risk scores (benefits eligibility, that sort of thing). Vendors bid with different models, we audit them after they've been running for a while, and everyone building a model knows the rule in advance. I need a spec before I write anything down.

  What I want from you: the list of requirements a fairness criterion has to meet to be usable as a procurement rule, with the motivating case behind each. The ones I keep circling: an auditor has to be able to check it from decisions and realised outcomes alone (we don't get the features, and outcomes are only observed for people who were selected); it has to be comparable across vendors whose scores aren't on the same scale; it can't be something a vendor can hit by tuning against the audit while making things worse on the ground; it should compose, or at least not fall apart, when the same person passes through three of these systems in a row; and it should still mean something when the score allocates an intervention that changes the outcome it was predicting. Add any I'm missing, say which are non-negotiable and which are just preferences, and flag anywhere I'm confusing the definition of a criterion with an estimator we could actually compute.

  The bit I really care about: given the familiar no-go results — you can't have calibration and equal error rates across groups at once when base rates differ, and the rest of that family — which subset of my requirements is jointly unsatisfiable, and what would we have to drop. One line each on the existing criteria at the end, no scorecard.
reasoning: |-
  We are to design a fairness criterion for procurement contracts in a public agency setting. The goal is to have a set of requirements that such a criterion must meet to be practical and effective in this context. We are also to identify which requirements are non-negotiable and which are preferences, and to analyze which subsets of requirements are jointly unsatisfiable given known fairness impossibility results.

  ### Requirements List (with motivation and category)

  1. **Auditability from decisions and outcomes only (non-negotiable)**
     - **Motivation**: The agency does not have access to the model's features (inputs) and only observes outcomes for individuals who were selected (i.e., received the intervention). Therefore, the criterion must be verifiable using only the decisions (e.g., who received the intervention) and the realized outcomes for those individuals.
     - **Category**: Non-negotiable, because without this the agency cannot audit.

  2. **Scale-invariance / Comparability across vendors (non-negotiable)**
     - **Motivation**: Different vendors use different models and scales for their risk scores. The criterion must be comparable across these different scales (e.g., one vendor uses a score from 0 to 100, another from -1 to 1). This is crucial for a fair procurement process.
     - **Category**: Non-negotiable, because otherwise the agency cannot compare bids.

  3. **Robustness to gaming (non-negotiable)**
     - **Motivation**: Vendors must not be able to trivially satisfy the criterion by tuning their model specifically for the audit in a way that degrades performance on the ground (e.g., by manipulating the distribution of scores without improving actual fairness). The criterion should incentivize genuine fairness.
     - **Category**: Non-negotiable, because without it the rule is ineffective.

  4. **Compositionality (preference)**
     - **Motivation**: Individuals may pass through multiple systems (e.g., three in a row). The fairness criterion should ideally compose so that fairness at each stage implies fairness overall, or at least not break down entirely in a sequence.
     - **Category**: Preference, because it might be too strict to require in all cases, but highly desirable.

  5. **Validity under intervention (non-negotiable)**
     - **Motivation**: The risk scores are used to allocate interventions (e.g., additional scrutiny or services) that might change the outcome being predicted. The criterion must remain meaningful in this setting (i.e., under a performative aspect).
     - **Category**: Non-negotiable, because if the intervention changes the outcome, standard fairness metrics that assume no interference might break.

  6. **Group-awareness (non-negotiable)**
     - **Motivation**: Fairness is typically assessed across legally protected groups (e.g., race, gender). The criterion must allow for group-based analysis because disparate impact is a primary concern.
     - **Category**: Non-negotiable, because the agency must ensure non-discrimination.

  7. **Feasibility with partial outcome data (non-negotiable)**
     - **Motivation**: Outcomes are only observed for the selected individuals (those who received the intervention). The criterion must account for the missing data problem (selective labels) and still be auditable.
     - **Category**: Non-negotiable, because the data constraints are inherent.

  ### Analysis of Joint Satisfiability

  Given the well-known impossibility results in fairness (e.g., the impossibility of satisfying both calibration and equal error rates when base rates differ), we must consider which of the above requirements are in tension.

  - The requirements **1 (auditability)**, **6 (group-awareness)**, and **7 (partial outcomes)** together might already be challenging because they require group fairness metrics that can be computed with only partial outcome data (i.e., only for the treated). This is a classic issue of selective labels and missing counterfactuals.

  - Moreover, requirement **5 (intervention effect)** complicates the interpretation of outcomes because the intervention changes the outcome. This can lead to a situation where the outcome we observe for the selected group is not the same as what would have happened without the intervention. Thus, any criterion that relies on the observed outcomes as ground truth might be biased.

  - The requirement of **3 (robustness to gaming)** might conflict with the simplicity of the metric. For instance, a metric that is easily auditable might also be more easily gamed.

  #### Specific Impossibility Concerns

  The classic fairness impossibility (calibration by group vs. equal error rates) is less directly applicable here because we are in a setting with partial outcomes and intervention effects. However, we can still draw parallels:

  - We require group fairness (e.g., equal FPR, equal FNR, or predictive parity) but note that without the full data (we only have outcomes for the selected) and with intervention effects, we cannot directly compute error rates.

  - In fact, the requirement of **validity under intervention (5)** and **partial outcomes (7)** together make it impossible to observe the true counterfactual outcomes. Therefore, any fairness criterion that relies on counterfactuals (like equal opportunity) is not auditable (violating requirement 1). 

  - Thus, we must rely on metrics that use only the observed outcomes and decisions. This leads us to consider metrics like:
    - **Disparate impact**: Ratio of selection rates across groups. But this does not use outcomes and hence ignores performance and the effect of the intervention.
    - **Predictive parity (PPV)**: This requires outcomes for the selected group. However, because of intervention effects, the observed outcome is not the same as the outcome without intervention. Also, without the unselected group, we cannot compute NPV.

  Given these challenges, we must drop or relax some requirements. The most critical tension is between:

  - **Group fairness based on error rates** (which requires knowledge of the counterfactual outcomes for the unselected) and **auditability with partial outcomes (1 and 7)**.

  Hence, we must drop the requirement that the criterion be based on error rates (like equal opportunity) because we cannot compute them. Instead, we might have to rely on metrics that are computable from the selected population only.

  ### Proposed Approach

  Given the constraints, we might consider:

  - **Conditional Use Accuracy Equality (CUAE)**: This focuses on the selected group. We can compute the accuracy (or other metrics) within the selected group by group. But note: because of intervention effects, the outcome is changed by the selection, so the accuracy is with respect to a different distribution.

  - **Disparate impact**: This is easy to audit (selection rates by group) but does not use outcomes. However, it might be insufficient because it doesn't account for the actual impact of the intervention.

  - **Outcome-based metrics on the selected**: For example, the rate of positive outcomes in the selected group by protected group. This is auditable (requirement 1), scale-invariant (if we use rates, requirement 2), and does not require the unselected group. However, it is affected by the intervention (requirement 5) and might be what we care about (did the intervention lead to similar success rates across groups?).

  But note: if the intervention is more effective for one group than another, then even with a perfectly fair model, we might see different outcome rates. So this metric might not reflect the fairness of the model but rather the effectiveness of the intervention.

  Alternatively, we might define fairness in terms of the model's predictions being equally informative across groups in the face of intervention. However, this is complex.

  ### Existing Criteria (One Line Each)

  - **Demographic Parity (Disparate Impact)**: Requires similar selection rates across groups. Does not use outcomes.
  - **Equal Opportunity**: Requires similar false negative rates across groups. Requires counterfactual outcomes for the unselected.
  - **Predictive Parity**: Requires similar positive predictive value across groups. Uses outcomes only for the selected.
  - **Calibration**: Requires that the predicted risk equals the observed event rate, by group. Requires outcomes for the entire population (or at least across the risk score distribution) but we only have for selected.

  Given our constraints, we can only realistically use metrics that are computable on the selected population. Therefore, **Predictive Parity (PPV)** is a candidate. However, note:

  - PPV requires the observed outcome for the selected group. With intervention effects, the observed outcome is not the same as the outcome without intervention. So if the intervention is effective, it might improve the outcome for the selected group, making the PPV higher than it would have been without intervention.

  - Moreover, the classic impossibility: we cannot have PPV equality and equal opportunity simultaneously when base rates differ. But in our case, we cannot compute equal opportunity.

  ### Recommendations

  Given the non-negotiable requirements (1,2,3,5,6,7) and the preference (4), we must choose a criterion that:

  - Is computable from decisions and observed outcomes (so PPV, or outcome rates by group in the selected).
  - Is scale-invariant (rates are).
  - Is not easily gamed? (Vendors could manipulate the threshold to achieve a desired PPV, but if the threshold is fixed by the agency then it might be less of an issue. Alternatively, we can use a metric that requires the entire curve, but then we need a summary that is not easily manipulable.)
  - Works under intervention: We have to accept that the outcome is post-intervention. We might define the fairness criterion as: the model should be such that among those selected, the intervention is equally effective across groups? But note: the model does not control the intervention's effectiveness.

  Alternatively, we might reframe the problem: the agency cares about the ultimate outcome. So we want that the selection does not lead to disparities in the outcome of the selected group. This is an outcome-based fairness criterion. However, this might not be about the model but about the world. But if the model is used to allocate an effective intervention, then we want the intervention to be allocated so that it benefits groups fairly.

  Therefore, a potential criterion: **The ratio of the rate of positive outcomes in the selected group between protected groups should be above a threshold (e.g., 0.8)**. This is auditable (1), scale-invariant (2), and uses the observed outcomes for the selected (7). It also accounts for the intervention (5). However:

  - This does not account for the possibility that the groups might have different potential to benefit from the intervention. But without more data, we cannot disentangle.

  - Gaming: A vendor might select a group that is very likely to have a positive outcome even without the intervention, but that might not be the intended use. Also, they might avoid selecting a group that would benefit a lot but has a low baseline outcome rate.

  - Composition: This might not compose because the outcome after multiple interventions is complex.

  ### Summary of Trade-offs

  We cannot have a criterion that simultaneously:

  - Uses only the selected group's outcomes (due to partial observability) 
  - And also accounts for the counterfactual (what would have happened without the intervention) 
  - And also satisfies standard group fairness definitions that require knowledge of the unselected group.

  We must drop the requirement that the criterion account for the unselected group (because we don't have their outcomes). Therefore, we are limited to metrics that use the selected group.

  We must also accept that the intervention effect is part of the metric. Hence, we propose:

  **Criterion**: The ratio of the success rate (observed positive outcome) in the selected group between the protected groups must be at least 0.8 (or similar threshold).

  Additionally, we might require:

  - **Disparate impact as a backstop**: The selection rate ratio must also be at least 0.8 to avoid extreme under-selection.

  But note: the two together might be too strict? Not necessarily, because we are in a procurement setting and can set both.

  Alternatively, we might use:

  - **Balanced treatment effect**: But we cannot observe the treatment effect without a control group.

  Given the constraints, the proposed criterion (success rate in selected) is the most auditable and meets the non-negotiables, even though it conflates the model's performance and the intervention's effectiveness. It has the advantage that it aligns the vendor's incentive with actually improving outcomes for the selected group in a fair manner.

  ### Final List of Requirements Met by Proposed Criterion

  1. **Auditability**: Yes, from decisions (which group was selected) and outcomes (success in selected).
  2. **Scale-invariance**: Yes, because it uses rates.
  3. **Robustness to gaming**: Partially. Vendor can game by selecting easy cases in the disadvantaged group? But if the disadvantaged group has a lower base success rate, then achieving a high success rate might be harder. We can adjust by requiring a minimum success rate in each group? Or use a ratio? 
     - To mitigate gaming, we might set absolute minimum success rates per group as well? But then we need to set those thresholds appropriately.
  4. **Compositionality**: Not directly addressed, but we can require the same criterion at each stage? Then the overall outcome might be composed? Not perfect, but a start.
  5. **Validity under intervention**: Yes, because it uses the outcome after intervention.
  6. **Group-awareness**: Yes.
  7. **Partial outcomes**: Yes, uses only the selected group.

  This criterion is not perfect, but it meets the non-negotiables. We must be aware that it does not capture error rate fairness, but that is unattainable under the constraints.
answer: |-
  ### Requirements for Fairness Criteria in Procurement Contracts

  Here's a structured list of requirements, categorized by **non-negotiable** (essential for procurement) and **preference** (desirable but flexible), with the motivating case for each. I've added critical missing requirements and flagged estimator-vs.-definition confusion where relevant.

  ---

  #### **Non-Negotiable Requirements**  
  *(Essential for auditability, comparability, and integrity)*  

  1. **Auditability from decisions/observed outcomes only**  
     - **Motivation**: Auditors only see *decisions* (e.g., who received an intervention) and *realized outcomes* for selected individuals (e.g., benefit eligibility outcomes). Vendors don’t share model features or scores for the entire population.  
     - **Why non-negotiable**: Without this, audits fail.  

  2. **Scale-invariant comparability across vendors**  
     - **Motivation**: Vendors use different scoring models (e.g., 0–100 vs. z-scores). The criterion must work without score normalization or access to raw probabilities.  
     - **Why non-negotiable**: Procurement requires apples-to-apples vendor comparisons.  

  3. **Robustness to strategic tuning (non-gamability)**  
     - **Motivation**: Vendors might tweak models to "hack" the audit metric (e.g., inflating scores for low-risk groups to manipulate group-wise error rates) without improving real-world fairness.  
     - **Why non-negotiable**: Avoids perverse incentives degrading actual outcomes.  

  4. **Validity under performative effects**  
     - **Motivation**: Interventions (e.g., extra scrutiny) alter outcomes (e.g., fraud rates). The criterion must retain meaning when predictions *cause* outcome changes.  
     - **Why non-negotiable**: These scores are *interventional*; static-world fairness fails here.  

  5. **Group fairness based on protected attributes**  
     - **Motivation**: Legally mandated (e.g., race, gender) disparity assessments require explicit group definitions.  
     - **Why non-negotiable**: Compliance with anti-discrimination laws.  

  6. **Feasibility with selective outcome data**  
     - **Motivation**: Outcomes are *only observed for selected individuals* (e.g., you see fraud rates only for those investigated). Unselected groups have missing outcome data.  
     - **Why non-negotiable**: Real-world data constraints are immutable.  

  ---

  #### **Preference Requirements**  
  *(Desirable for robustness but negotiable)*  

  7. **Compositionality across sequential systems**  
     - **Motivation**: Individuals often pass through multiple systems (e.g., risk scoring → eligibility review → appeals). Fairness shouldn’t collapse when chained.  
     - **Why a preference**: Complex to enforce; could be handled by per-system rules + monitoring.  

  8. **Minimal assumptions about counterfactuals**  
     - **Motivation**: Avoids untestable assumptions (e.g., "What if unselected individuals were selected?").  
     - **Why a preference**: Possible but limits metric choice; some estimators need counterfactual modeling.  

  ---

  #### **Missing Requirements Added**  
  9. **Construct validity (alignment with policy goals)**  
     - **Motivation**: Fairness metrics must reflect the agency’s mission (e.g., minimizing false denials in benefits). A purely statistical criterion might miss policy intent.  
     - **Non-negotiable**: Procurement rules must ensure vendors support agency objectives.  

  10. **Sample efficiency for audit**  
      - **Motivation**: Audits use limited data. Metrics needing huge samples (e.g., precise small-group estimates) may fail in practice.  
      - **Preference**: Larger audits possible but costly.  

  ---

  ### **Clarifying Estimator vs. Criterion Confusion**  
  - **You’re conflating when**: Requiring "outcomes for selected individuals only" is about *data availability for estimation*, not the criterion definition. For example:  
    - *Criterion*: "Equal false omission rates (FOR)" is defined for all people.  
    - *Estimator problem*: FOR needs outcomes for the *unselected* (which you lack).  
  - **Fix**: Specify criteria that only require observables (e.g., selection rates or outcomes of the selected).  

  ---

  ### **Joint Unsatisfiability of Requirements**  
  Given **impossibility theorems** (e.g., calibration vs. error rate balance), your constraints make **all error-rate-based criteria unsatisfiable**. Here’s why:  

  - **Conflict core**:  
    - You require **group fairness** (e.g., equal error rates) + **auditability with partial outcomes** (only selected individuals have observed outcomes) + **performative effects** (interventions change outcomes).  
  - **Unsatisfiable trio**:  
    1. **Error-rate balance** (e.g., equal FPR/FNR) requires outcomes for *all* (selected + unselected), but you only have data for the selected (violates #6).  
    2. **Calibration** requires observed outcomes across the score distribution, but performative effects (#4) break the assumption that predictions don’t affect outcomes.  
    3. **No criterion can satisfy both scale-invariance (#2) and non-gamability (#3) while handling missing data (#6) and performativity (#4)**.  

  - **What you must drop**:  
    - **Error-rate parity** (FPR/FNR equality): Unauditable without full outcome data.  
    - **Calibration**: Untestable under performative effects.  
    - **Alternative**: Use metrics relying solely on *selection rates* or *outcomes of the selected* (e.g., demographic parity or success rate parity). These work with your constraints but have limitations (see below).  

  ---

  ### **Existing Criteria at a Glance**  
  - **Demographic parity**: Equal selection rates. *Pro*: Auditable, scale-invariant. *Con*: Ignores outcomes; may harm accuracy.  
  - **Predictive parity**: Equal PPV. *Pro*: Uses outcomes of the selected. *Con*: Fails if base rates differ; performative effects skew PPV.  
  - **Equal opportunity**: Equal FNR. *Pro*: Meaningful for access. *Con*: Requires unselected outcomes → unauditable for you.  
  - **Calibration**: Score = actual probability. *Pro*: Intuitive. *Con*: Broken by performativity; group calibration clashes with error rates.  
  - **Success rate parity**: Equal outcome rates in selected group (e.g., approval accuracy). *Pro*: Auditable, works with performativity. *Con*: Misses disparities in selection.  

  ---

  ### **Recommendation**  
  Prioritize **success rate parity** (equal outcome rates among selected) or **demographic parity** (equal selection rates) supplemented with **outcome testing**. They satisfy non-negotiables:  
  - Auditable with partial data (#1, #6).  
  - Scale-invariant (#2).  
  - Hard to game if defined rigorously (#3).  
  - Work under performativity (#4).  
  - Group-aware (#5).  

  **Trade-off**: These don’t guarantee error-rate fairness, but no metric can under your constraints. Pair with:  
  - Risk-sharing clauses (e.g., penalties if real-world disparities exceed thresholds).  
  - Audits tracking long-term group outcomes.
