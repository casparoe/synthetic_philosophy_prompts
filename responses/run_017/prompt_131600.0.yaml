prompt: |-
  I am trying to settle an argument, not to learn what Ayn Rand wrote, so please skip citations, reading suggestions, and summaries of her corpus: I want the argument space mapped, and I want it mapped without anyone looking anything up.

  The argument was about effective altruism. My interlocutor reached for the title of Rand's 1964 collection, "The Virtue of Selfishness," and used it, in one breath, to two conclusions: first, that giving a large share of one's income to strangers is not merely optional but degrading, a self-sacrifice that a person of integrity would refuse; second, that a genuinely rational person would never make an anonymous gift, since an anonymous gift cannot come back to benefit the giver. He also leaned on the point that Rand glosses "selfishness" in her introduction as nothing more than concern with one's own interests, and on her definition of value as that which one acts to gain and/or keep.

  I am convinced the one-liner is sliding, and I want the slide made explicit. Please give me a menu of the distinct precise theses the slogan could be asserting, and grade each one. My own attempts, which I expect you to correct, split, and add to, are these:

  One: a purely verbal thesis. Selfishness is redefined so that any action flowing from what the agent values counts as selfish, in which case the slogan says almost nothing and cannot reach either conclusion.
  Two: an objective-standard thesis. "Interests" are not whatever the agent happens to want but what serves her life as the kind of being she is, so the slogan has real content, but only if the account of a person's objective interests does independent work.
  Three: a jurisdictional thesis. What is wrong with altruism is not the cost to the agent or the benefit to others but the location of the normative trigger: the agent acts on another's need rather than on her own judgment of value. This may have no behavioral content at all, so that a kidney donation and a refusal to donate could each be virtuous or vicious depending on their source.
  Four: an anti-fixed-pie or harmony thesis: value is created rather than transferred, so benefit to another at cost to self is never the net gain it appears to be, and altruistic codes systematically destroy value.
  Five: an epistemic thesiss: others' needs are not transparent to me, whereas my own interests are, so an altruistic code is a systematically error-prone decision rule.
  Six: an empirical psychological thesis about what altruistic motivation does to character, to dependents, and to the giver's own capacity for sustained action.
  Seven: a narrow scope thesis: no positive duty to serve others, gifts permitted as luxuries, i.e. a denial of obligation rather than a denial of permissibility or admirability.

  For every reading, tell me: how to state it precisely; whether it is a definitional maneuver, a platitude, a substantive and defensible thesis, a substantive but contested one, or false; what would count as refuting it; whether Rand or a defender of the slogan is actually committed to it or whether it is an extrapolation; and, most importantly, whether it licenses the first conclusion, the second, both, or neither. Note where the readings differ along the axes that I think are doing the hidden work: the extension of "selfishness," the kind of normative status being claimed (permissible, praiseworthy, obligatory, admirable), and the direction of the contrast (altruism is not obligatory, versus never permissible, versus never admirable).

  Two things I cannot work out and particularly want addressed. First, over what interval are interests summed? Rand's own framework must permit forgoing present goods for long-range ones, so the self whose interests matter is a life and not a time slice; say what that does to the bite against altruism. Second, if the content of the virtue is just concern with one's own interests, and if the standard is indexed to a living organism's survival, what principle internal to the view stops the boundary of the self at the skin, so that the interests of those I love cannot be counted as mine? If no such principle can be given, say what happens to my interlocutor's two conclusions.

  Finally: tell me which reading he must have meant, and if no reading both survives scrutiny and supports what he said, say so plainly and tell me which suppressed premise is actually carrying the weight.
reasoning: |-
  Okay, let me try to unpack this user's request. They're in an argument about effective altruism and Ayn Rand's "virtue of selfishness," and they want me to map out the possible interpretations of Rand's slogan without referencing her actual texts. The user's interlocutor used the slogan to claim that charitable giving is degrading and anonymous gifts are irrational.

  First, I need to understand the core of the user's frustration. They suspect the slogan is being used ambiguously - a "slide" between meanings - to reach unjustified conclusions. They've already listed seven possible interpretations but want them refined and evaluated. 

  Looking at their seven theses, I notice they're probing different dimensions: semantic (how "selfishness" is defined), normative (what kind of claim is being made), and psychological (how interests are calculated). The user is particularly sharp on wanting to expose where the argument's weight truly lies - especially regarding the two conclusions about charitable giving being degrading and anonymous gifts being irrational.

  The two sticking points they mention are crucial:
  - The time horizon problem: If selfishness means serving one's life-long interests, how does that categorically exclude altruism? Maybe donating builds skills/relationships that pay off later.
  - The identity boundary problem: If we care about what we value, why can't loved ones' welfare be part of "my interests"? This could demolish both conclusions.

  I'll need to systematically rebuild their framework. Their Thesis One (verbal redefinition) seems weak - if selfishness just means "acting on values," it can't condemn anything. But their interlocutor clearly wants condemnation, so we need stronger theses. Theses Two (objective interests) and Four (value creation) seem most promising for the interlocutor's stance, but both have problems. 

  For Thesis Two: Who defines "objective interests"? If it's survival, donating a kidney could objectively harm me. But what if I derive meaning from it? The thesis struggles to exclude that without circularity. 

  Thesis Four is interesting - if value isn't zero-sum, maybe helping others can create value for me indirectly. But then anonymous giving could still benefit me via self-image or societal stability. So it doesn't support the second conclusion.

  The jurisdictional thesis (Three) is clever but too procedural - it might permit altruism if I "judge it valuable." The epistemic thesis (Five) feels flimsy - I know my neighbor's hunger as well as my own.

  I think the interlocutor is leaning on a mix of Theses Two and Four, but neither fully delivers both conclusions. The boundary problem is fatal: if my child's welfare is part of my interests, then providing for them isn't sacrifice. And if interests are lifelong, strategic charity might pay off. 

  Ultimately, the interlocutor's conclusions require suppressed premises: either that altruism inherently conflicts with "true" self-interest (unproven) or that psychological egoism is true (which Rand rejects!). That's the real slide - smuggling in assumptions about what counts as "real" interest.
answer: |-
  Here's a precise mapping of the argument space, evaluating each thesis against your criteria and exposing the slide in your interlocutor's reasoning. Key axes are **selfishness extension**, **normative status claimed**, and **contrast direction**.

  **The Theses Evaluated:**

  1.  **Verbal Redefinition ("Selfishness = Pursuit of Values")**
      *   *Precise Statement:* Any action taken because the agent values it is, by definition, "selfish." The term is stripped of its conventional meaning (disregard for others).
      *   *Status:* Definitional maneuver (tautological). Defensible only as a redefinition. Does *not* imply conventional selfishness is good.
      *   *Refutation:* Demonstrating it's an arbitrary redefinition that ignores common usage and conflates all motivated action.
      *   *Rand/Commitment:* Rand *starts* with this redefinition, but her followers often equivocate between this and substantive meanings.
      *   *Licenses Conclusions?* **Neither.** If *all* motivated action is selfish (including altruism), it cannot condemn altruism or anonymous giving. Conflates "selfish" with "volitional."

  2.  **Objective-Interest Standard ("Selfishness = Pursuit of *True* Interests")**
      *   *Precise Statement:* "Selfishness" means rationally pursuing one's *objective* life-enhancing interests, defined by human nature/survival needs, distinct from subjective wants.
      *   *Status:* Substantive, highly contested thesis. Requires a robust, non-arbitrary account of "objective interests."
      *   *Refutation:* 1) Showing "objective interests" are incoherent or unidentifiable. 2) Showing altruism *is* objectively in one's interests (e.g., for social species survival, psychological well-being).
      *   *Rand/Commitment:* Core to Rand's ethics. She *is* committed.
      *   *Licenses Conclusions?* **Potentially Both, but weakly/indirectly.** *If* altruism objectively harms the giver's life, it could be degrading (C1). Anonymous gifts *might* be irrational if they objectively harm the giver without countervailing benefit (C2). **Crucially:** Depends entirely on the *content* of "objective interests." Nothing here *inherently* rules out altruism or anonymity being objectively beneficial.

  3.  **Jurisdictional Thesis ("Morality Concerns *My* Values")**
      *   *Precise Statement:* The fundamental moral error of altruism is locating the *source* of value/duty in *another's need*, rather than in one's *own independent judgment* of what is valuable. Virtue lies in acting on one's rationally formed hierarchy of values.
      *   *Status:* Substantive, contested thesis. Focuses on motivation/origin, not outcome.
      *   *Refutation:* Showing morality inherently involves responsiveness to others' needs/welfare *as* a source of value/duty, alongside self-interest.
      *   *Rand/Commitment:* Core to Rand's ethics (primacy of reason, rejection of duty). She *is* committed.
      *   *Licenses Conclusions?* **Neither Conclusion Directly.** A kidney donation *could* be virtuous if based on the agent's judgment that it aligns with *their* highest values (e.g., love for spouse). An anonymous gift *could* be virtuous if chosen as an expression of value. Condemns *duty-driven* sacrifice, not necessarily *value-driven* giving. Focuses on *why*, not *what*.

  4.  **Anti-Fixed-Pie / Value Creation Thesis ("Trade, Not Sacrifice")**
      *   *Precise Statement:* Value is created through production and voluntary exchange. Sacrificial transfers destroy net value by harming the producer/giver without creating equivalent gain. Altruism as a *moral code* enforces this destruction.
      *   *Status:* Substantive, contested thesis (economic/ethical). Platitude only if reduced to "voluntary exchange is good."
      *   *Refutation:* 1) Showing non-market transfers (gifts, aid) *can* create net value (e.g., saving a life, enabling future production). 2) Showing "sacrifice" isn't inherent in all giving.
      *   *Rand/Commitment:* Core to Rand's ethics/politics. She *is* committed.
      *   *Licenses Conclusions?* **Conclusion 1 (Degrading), but not Conclusion 2 directly.** Focuses on the *system* and sacrificial *transfers*. Could condemn obligatory giving as degrading/destructive (C1). Says nothing specific about anonymity (C2); an anonymous gift isn't inherently sacrificial or value-destroying.

  5.  **Epistemic Thesis ("I Can't Know Your Needs")**
      *   *Precise Statement:* Altruism is irrational because one cannot reliably know or judge the true needs/deserts of strangers, whereas one can (more reliably) know one's own interests.
      *   *Status:* Substantive, highly contested and weak thesis. Often a supporting argument.
      *   *Refutation:* 1) We *can* often reliably identify basic needs (starvation, disease). 2) We are often wrong about our *own* interests. 3) Specialized knowledge (e.g., effective charities) mitigates this.
      *   *Rand/Commitment:* Rand uses this argument, but it's secondary. Not strictly necessary for core ethics.
      *   *Licenses Conclusions?* **Neither Robustly.** Provides a *pragmatic* argument against *some* altruism, not a moral condemnation (C1). Says nothing specific about anonymity (C2).

  6.  **Psychological Character Thesis ("Altruism Corrupts")**
      *   *Precise Statement:* Cultivating altruistic motivation systematically weakens character: fosters resentment, helplessness in recipients, destroys the giver's ambition/productivity, and makes sustained rational action impossible.
      *   *Status:* Substantive, empirical, highly contested thesis.
      *   *Refutation:* Empirical evidence showing prosocial behavior correlates with well-being, resilience, and strong communities; effective altruism focuses on sustainable impact.
      *   *Rand/Commitment:* Rand strongly implies this, but it's more psychological conjecture than core ethical principle.
      *   *Licenses Conclusions?* **Conclusion 1 (Degrading), but not Conclusion 2.** Focuses on *motivation's effect on character*. Could support C1 if the effect is inherent. Anonymity (C2) is irrelevant to character effects.

  7.  **Narrow Scope / Anti-Obligation Thesis ("No Duty to Give")**
      *   *Precise Statement:* There is no positive moral *obligation* to serve the needs of others. Giving is permissible only as a discretionary act based on one's values, not a duty ("optional as a luxury").
      *   *Status:* Substantive, contested thesis. Core to rejecting altruism *as a moral code*. Denies *obligation*, not necessarily *permissibility* or *value*.
      *   *Refutation:* Moral arguments establishing positive duties to aid others (e.g., capacity to help without comparable sacrifice, basic human solidarity).
      *   *Rand/Commitment:* Absolutely core to Rand. She *is* committed.
      *   *Licenses Conclusions?* **Conclusion 1 ONLY if conflated.** Directly supports that giving is *not obligatory*. It *does not* support that giving is "degrading" or that a person of integrity "would refuse" (C1) – that requires stronger theses (2, 4, 6). It *explicitly permits* giving based on values, undermining C1's stronger claim. Says nothing about anonymity (C2).

  **Addressing Your Sticking Points:**

  1.  **Time Horizon (Life as a Whole):**
      *   This *severely weakens* the case against altruism. Rational selfishness *requires* forgoing short-term gains for long-term flourishing. Strategic giving (building reputation, securing alliances, investing in societal stability, gaining personal satisfaction/meaning) could be easily framed as serving long-term self-interest. Rand's framework *cannot* categorically rule out altruism being in one's long-term interest; it depends entirely on the specific context and the agent's hierarchy of values. Anonymous giving could be rational if it provides long-term psychological satisfaction or aligns with a deeply held value of justice/beneficence without need for recognition.

  2.  **Boundary of the Self ("Skin" vs. "Loved Ones"):**
      *   **There is no principled internal barrier.** If "interests" are defined by what an individual *values* (Thesis 1) or what *objectively* serves their life/flourishing (Thesis 2), the well-being of loved ones can absolutely be a core part of "my" interests. Their suffering *is* my suffering; their flourishing *is* my flourishing. This is fundamental to human psychology as a social species. **This demolishes both conclusions:**
      *   *Conclusion 1:* Giving to a loved one (or even a cause one passionately identifies with) isn't "sacrifice" or "degrading" – it's *selfishness* in Rand's terms if it serves a profound personal value. Anonymous giving to a loved one's cause could be profoundly "selfish."
      *   *Conclusion 2:* Anonymous giving to a cause one values highly *does* benefit the giver intrinsically through the fulfillment of that value, regardless of recognition. The benefit lies in the act itself aligning with one's deepest commitments.

  **What Your Interlocutor Meant & The Slide:**

  *   **He likely conflated Theses 1, 2, and 7.** He started with the redefinition (Thesis 1: "selfishness = action based on values"), then *surreptitiously infused it* with the objective standard (Thesis 2: *only* actions serving narrowly construed "rational" self-interest count) and the anti-obligation stance (Thesis 7: no duty), *while ignoring the boundary problem*.
  *   **The Slide:** From "Selfishness means acting on your values" (Thesis 1, harmless) to "Therefore, acting for others *instead* of yourself is degrading sacrifice" (Conclusion 1, requiring Theses 2, 4, or 6) and "Anonymous giving provides *no* benefit to you" (Conclusion 2, requiring a very narrow, short-term, non-relational view of "benefit" that contradicts the life-as-a-whole principle and ignores valued states like integrity or compassion).
  *   **No single reading** survives scrutiny and supports *both* conclusions robustly. Thesis 2 *might* support them *if* one accepts a highly specific, non-relational, short-sighted account of "objective interests" – but this contradicts Rand's life-as-a-whole principle and human social nature.
  *   **The Suppressed Premises Carrying the Weight:**
      1.  **Psychological Egoism (False):** The assumption that humans *only* act for perceived self-benefit, making true altruism impossible. (Rand explicitly *rejected* psychological egoism; she advocated *ethical* egoism).
      2.  **Zero-Sum View of Value:** The assumption that benefit to another inherently means cost to self (contradicted by Thesis 4's *own* emphasis on value creation).
      3.  **Atomistic Individualism:** The assumption that the self is radically isolated, and the interests/well-being of loved ones or valued communities are *not* part of one's own interests (contradicted by human nature and the life-as-a-whole principle).
      4.  **Narrow "Benefit":** For Conclusion 2, the assumption that "benefit" only means direct, tangible, reciprocal, or egoistic rewards, excluding intrinsic satisfaction, alignment with values, or the well-being of deeply identified-with others.

  **Conclusion:** Your interlocutor's use of "The Virtue of Selfishness" relies on **equivocation** between the redefinition and substantive theses, plus **crucially suppressed premises** (atomistic individualism, zero-sum value, narrow benefit) that are **not inherent to Rand's stated framework** and are often **contradicted by it** (life-as-a-whole, rejection of psychological egoism). His two conclusions do not validly follow from the slogan alone or its core interpretations without these problematic additions. The strongest core Randian theses (2, 4, 7) support rejecting *obligatory* sacrifice but fail to categorically condemn *all* significant or anonymous giving, especially when the boundary of "self" includes loved ones and the time horizon is one's entire life.
