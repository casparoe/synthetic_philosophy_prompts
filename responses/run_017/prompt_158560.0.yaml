  I should start by laying out the mappings in detail. Then address each disanalogy they mentioned, but also think of others they might have missed. For example, the information processing in ant colonies is decentralized and slow, while brains are synchronous and fast. That's crucial because functional organization isn't just about structure but real-time processing.

