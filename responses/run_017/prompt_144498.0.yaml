prompt: |-
  So I got roped into chairing my university's curriculum committee this year, which I assumed would be pure busywork right up until I noticed this: we vote separately on whether a proposed course satisfies each of several requirements (writing-intensive, quantitative reasoning, whatever else), and then we vote on whether it counts toward the major — and the overall verdict sometimes flatly contradicts the votes on the parts. A colleague mentioned this thing has a name and a whole literature attached to it, and I've been falling down that rabbit hole in my spare time since.

  Two wrinkles make it more than a textbook case for me. First, I'm the one who writes the ballot, so I choose the decomposition into sub-questions — and I've noticed I can pretty much steer the outcome by slicing a course's requirements differently, which is either a superpower or an ethical problem. Second, we've started using an LLM as a kind of clerk: I can ask it each sub-question separately and derive the verdict, or ask it for the verdict straight, and because it's stochastic and I sometimes rephrase, it hands back a little cloud of answers rather than one. So we're aggregating across a population of model-judgments as well as across seven humans, and nobody has any idea whether that thing should count as one more voter, as a tie-breaker, as a supplier of reasons, or not at all. It also matters that the sub-questions aren't all the same kind: on some everyone quietly defers to whichever member actually knows the subject matter, and on others it's straight-up politics.

  Constraints: me, roughly one day a week for a semester, one grad assistant who is very good with spreadsheets, no software budget, and the output has to be a written protocol that seven tired faculty will actually follow and that the dean won't laugh at.

  I'll write the protocol myself — what I want from you is a defended agenda for my limited thinking time: which questions about aggregating connected judgments I should actually grind on, in what order, and why that order. What's genuinely upstream of what, what's tractable for someone who is not a logician, what I should stop worrying about because the answer wouldn't change the protocol, and — the part I care most about — what I could dig out of our own past voting records that would move a question up or down the list. Also be honest about which bits of this literature people get excited about that are basically irrelevant to a committee like mine.
reasoning: |-
  Okay, the user is chairing a university curriculum committee and dealing with a complex issue where voting on individual course requirements sometimes contradicts the overall verdict. They need a structured approach to tackle this within limited time and resources.

  First, I need to understand the core problem. The key issue is the doctrinal paradox, where separate votes on sub-questions can lead to inconsistent outcomes compared to a direct vote on the whole issue. The user has control over how they decompose the questions, which gives them significant influence over the outcome. That's an ethical concern they're aware of.

  Then there's the complication of using an LLM as a clerk. The LLM provides multiple answers due to its stochastic nature, so they're aggregating both human and AI judgments. They need to figure out how to integrate the LLM—whether as another voter, a tie-breaker, or something else.

  The constraints are tight: one day a week, a grad assistant good with spreadsheets, no software budget, and the protocol must be practical for tired faculty and acceptable to the dean. The user wants a prioritized agenda for their limited thinking time, focusing on what's tractable and impactful.

  Breaking down the problems, the doctrinal paradox is the foundational issue. They should start here because it's upstream; how they structure the ballots affects everything else. Literature suggests decomposition strategies matter, so analyzing past votes to see how different decompositions led to contradictions would be useful. They can use the grad assistant to mine this data from records.

  Next is the LLM's role. This is tricky because it's stochastic. They need to determine if the LLM's outputs are consistent enough to trust. Testing it on past cases could show whether it aligns with human decisions. But this might be time-consuming. Maybe they should handle the human aggregation first, then test the LLM separately. The key is not to merge human and AI votes without understanding reliability.

  The third priority is handling different types of sub-questions. Some are expertise-based, others political. They might need different voting rules per question type, but that complicates the protocol. Past data can show which questions had high agreement (expertise-deferred) versus divisive ones. This affects how they structure discussions or assign weights.

  Downstream issues include the ethical dilemma of decomposition power. But until there's data on how much it influences outcomes, it's premature to address. Similarly, fine-tuning the LLM's role should wait until basic aggregation is settled.

  Tractability is important. The user isn't a logician, so avoiding complex math is key. Spreadsheet analysis of past votes is doable with the grad assistant. Testing the LLM on past cases is also feasible without coding. The protocol must be simple: clear ballot structures, transparent voting rules, and defined roles for the LLM as a clerk, not a voter.

  What's not important? Theoretical debates on judgment aggregation models or the LLM's explainability. Focus on practical steps: using past data to inform decomposition, setting clear guidelines for when to use holistic vs. decomposed votes, and piloting the LLM as a reason-generator.

  Prioritization: First, analyze past votes for paradox frequency and decomposition impact. This informs how to structure ballots. Second, test LLM consistency on same tasks. Third, categorize sub-questions by type using past agreement levels. Then, draft protocol with decomposition rules, voting methods per question type, and LLM as non-voting clerk. Finally, ethical guidelines once data shows the extent of steering power.

  The user needs actionable steps that fit their constraints. Emphasize using existing data, practical experiments, and phased implementation to build a protocol that's robust and acceptable.
answer: |-
  Here’s a battle-tested agenda for your limited time, prioritizing tractable, high-impact questions based on your constraints. Skip the theoretical rabbit holes—focus on what changes your protocol. I’ll flag what’s upstream, what’s tractable, what to deprioritize, and how your voting records can guide you.

  ### **Core Problem: The Doctrinal Paradox**
  **What it is:** When separate votes on premises (e.g., "meets writing req") contradict the holistic vote on the conclusion ("counts toward major").  
  **Why it’s upstream:** Everything hinges on how you structure ballots. *This is your ethical superpower.*  
  **Tractable actions:**  
  1. **Mine past votes** (grad assistant task):  
     - Calculate how often the holistic verdict conflicted with the aggregated sub-votes.  
     - Identify *which requirements* most frequently caused contradictions (e.g., does "quantitative" vote often override a holistic "no"?).  
     - **Why:** If conflicts are rare (<10%), stick with decomposed votes and add a reconciliation step. If frequent (>25%), you need structural changes.  
  2. **Test ballot designs** (spreadsheet simulation):  
     - Re-run past decisions using 2–3 decompositions (e.g., merge "writing" and "critical thinking" into one humanities req; split "quantitative" into math/stats).  
     - **Why:** Reveals whether your decomposition power is theoretical or actually swings outcomes. If outcomes are stable across decompositions, relax.  

  ### **Priority Order & Reasoning**
  1. **Ballot Structure (Weeks 1–3)**  
     **Question:** *"Under what conditions do decomposed votes reliably predict the holistic outcome?"*  
     **Why first:** All aggregation methods depend on this. Your records show which sub-questions correlate with holistic approval.  
     **Action:**  
     - Use records to build a simple decision tree: "If votes for Req A + Req B ≥ 5, holistic vote is YES 90% of time."  
     - **Protocol impact:** If strong patterns exist, decomposed voting is defensible. If not, default to holistic votes for contentious courses.  
     **Trap to avoid:** Don’t seek a "perfect" decomposition—aim for one that minimizes contradictions in *your* data.  

  2. **LLM Role Clarity (Weeks 4–6)**  
     **Question:** *"Is the LLM a voter, an advisor, or a noise generator?"*  
     **Why now:** LLM’s volatility could poison aggregation. Test *before* designing human voting rules.  
     **Action:**  
     - **Audit the LLM:** Feed it 20 past course proposals (sub-questions + holistic). Run each 10x. Measure:  
       - Consistency (% same answer across runs).  
       - Alignment (% matches committee’s final decision).  
     - **Key insight:** If consistency <70% or alignment <60%, **never** use as voter/tie-breaker. Use only to generate pro/con bullet points.  
     **Tractable:** Grad assistant can paste queries into ChatGPT/Claude and log outputs. No coding needed.  

  3. **Voting Rules for Heterogeneous Sub-questions (Weeks 7–9)**  
     **Question:** *"Do we need different aggregation rules for expertise-driven vs. political questions?"*  
     **Why after #1–2:** Rules depend on ballot stability and whether LLM inputs are trustworthy.  
     **Action:**  
     - **Categorize requirements** using records:  
       - *Expertise-deferred:* High agreement (>80%), one "no" sinks it (e.g., "correct prerequisites?").  
       - *Political:* Split votes, majority rules (e.g., "fits department mission?").  
     - **Protocol hack:** For expertise questions, require unanimity among relevant specialists (e.g., statisticians for quant req). For political, simple majority.  
     **Data needed:** Flag past votes where a lone specialist’s "no" was overruled—did this cause problems later?  

  4. **Aggregation Mechanics (Weeks 10–12)**  
     **Question:** *"How do we combine human and (if used) LLM judgments without chaos?"*  
     **Why last:** Mechanics depend on earlier decisions.  
     **Simple solutions:**  
     - **Humans only:** Use decomposed votes, with holistic override if sub-votes conflict.  
     - **LLM-assisted:** LLM generates summary report *before* human vote (e.g., "Statisticians: prerequisites insufficient. Historians: writing req met"). Humans vote on sub-questions.  
     - **No mixed panels:** Never average human + LLM votes.  

  ### **What to Deprioritize (Time Sinks)**
  - **Theoretical aggregation models:** Judgment aggregation literature loves impossibility theorems (e.g., "no fair system satisfies X,Y,Z"). Irrelevant—you need a *workable* system, not a perfect one.  
  - **LLM explainability:** Why the LLM voted "no" doesn’t matter if it’s inconsistent. Focus on its reliability, not reasons.  
  - **Strategic voting:** Your committee isn’t gaming the system; they’re tired. Assume good faith.  

  ### **What Your Records Reveal (Grad Assistant Tasks)**
  1. **Paradox frequency:** How often holistic vs. decomposed outcomes conflict.  
  2. **Requirement influence:** Which sub-votes predict holistic YES/NO (logistic regression in Excel).  
  3. **Power maps:** Which members dominate which topics (e.g., Prof. X’s "no" on writing req correlates 95% with overall rejection).  
  4. **LLM alignment:** Does the LLM’s most common output match committee decisions?  

  ### **Protocol Sketch (Defensible & Dean-Proof)**
  1. **Ballot:** Decomposed votes *only* for requirements with high past agreement (>75%). Holistic vote for ambiguous/political criteria.  
  2. **LLM:** Clerk role only—prepares summary of course alignment with criteria using *past committee decisions* as examples. No voting.  
  3. **Voting rules:**  
     - Expertise reqs: Unanimity of relevant specialists.  
     - Subjective reqs: Majority of whole committee.  
     - Holistic verdict: YES only if all sub-verdicts pass *or* (if sub-verdicts conflict) separate holistic vote >4/7.  
  4. **Steering ethics:** Chair must use the *same* decomposition for all similar courses (e.g., all STEM quant reqs split into "math/stats").  

  **Time budget:** 3 weeks data mining (grad assistant), 3 weeks testing LLM/ballots, 3 weeks drafting protocol, 3 weeks dry-runs. You’ve got this—focus on exploiting your records, not the literature. The goal isn’t philosophical purity; it’s a system that doesn’t embarrass you at the next faculty meeting.
