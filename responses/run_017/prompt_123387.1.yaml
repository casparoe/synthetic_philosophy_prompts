prompt: |-
  Sorry if this comes out half-baked. I teach early modern metaphysics and I only know the ethics side of the house secondhand, from a reading group a few of us run in my department (we meet in a pub, which may be part of the problem). Every year or so the same pattern comes up, in the readings and in departmental life, and I've started to think its the same pattern, but I can't find a word for it. Three instances. (1) Two colleagues in different departments each push through a big curricular reform against their dean's advice. One looks great two years later because a demographic blip happened to swell enrollments in exactly that area; the other's reform looks like a disaster because the state changed a funding rule halfway through. At the retro the first is described as someone with the courage to take a principled stand, the second as someone who won't listen — but the actual trait, the pig-headedness about the reform, is the same in both, and everyone in the room can see that. (2) Two junior people send near-identical papers to the same top journal. One draws a sympathetic referee and gets it in; the other draws a hostile one, gets desk-rejected, and spends eighteen months revising. Ten years later the promotion files read "publishes in the leading journals" and "aims too high, wastes time" — and here's the bit that interests me most, the second description has by then leaked into wholly unrelated judgments: the same people who say he aims too high also quietly stop trusting him on the budget committee and on hiring. (3) The person who got lucky seems to end up believing the flattering version about herself. A former student of mine took a genuinely reckless gamble on a research program that paid off; she now describes her earlier self as "brave," and that self-description visibly changes what she's willing to try next, so the luck seems to have become a real feature of her practical reasoning.

  What I think I'm seeing is two things pasted together, and I can't tell whether they're one thing. First: when the outcome-driven judgment gets challenged, nobody gives it up; instead the voluntary bit of the conduct gets relocated. The act gets described more broadly — not "he drove home that night" but "he decided to go out drinking at all" — or more narrowly, and in the lucky case it shrinks to something like "he got lucky" — and the relocation happens in whichever direction protects the original reaction. Second: the residue then travels sideways into assessments that have nothing to do with the original act at all. It's obviously in the neighbourhood of the famous discussion of the two drivers, one of whom hits a child, but it isn't quite that, because in my cases nobody is disagreeing about how much the agent controlled. The silent shift is about which bit of behaviour we're counting as the thing she did, and about where the resulting judgment lands afterward.

  So: does this have a name? And I really don't want a bare label and a reading list — I've had enough of people saying "oh that's just X, go read X." I want the carving. Are the relocation part and the sideways-travel part the same phenomenon, or two that merely travel together? What are the nearest established concepts — I'd guess there's something on the action-theory side about how fine- or coarse-grained a description of an action is, something on the ethics side about luck, and maybe something in psychology about judging by outcomes rather than by decisions — and how does the thing I've described differ from each of them, and which, if any, actually fits? Give me the edge cases too: when is re-describing someone's conduct more broadly perfectly legitimate rather than a symptom of this pattern? My guess is it has something to do with whether the broader description is one the agent would have accepted in advance, but I'm not sure. I'd also like a case where the pattern is absent even though all the surface features are there. And note the asymmetry in my examples — the unflattering version seems to survive being debunked while the flattering one collapses the moment you point at the luck — and tell me whether that asymmetry is essential to the thing or a separate fact about us. If nothing established fits, coin the term and define it tightly enough that I could walk into my department meeting on Monday and actually use it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professor in early modern metaphysics, noticing a recurring pattern in ethical judgments within their department and readings. The pattern involves outcomes influencing moral assessments despite identical initial behaviors. They provided three clear examples: curricular reforms, journal submissions, and a student's research gamble. 

  First, I need to identify the core of their observation. They mention two key elements: the relocation of the voluntary aspect of an action to fit the outcome, and the sideways spread of the resulting judgment to unrelated areas. They want to know if this has a name, how the components relate, and how it differs from existing concepts like moral luck or outcome bias.

  Hmm, the user explicitly rejects just getting a label and reading list. They want a detailed conceptual carving. So I should avoid simply saying "that's moral luck" and move on. Instead, I need to dissect how their examples differ from standard treatments. For instance, Nagel's moral luck focuses on lack of control, but here the disagreement is about action description, not control. That's a crucial distinction.

  The relocation part seems central. When outcomes color judgments, people redefine the voluntary aspect—broadening or narrowing the action description to justify their assessment. Like in the curricular reform case: both were stubborn, but one succeeded, so their stubbornness was recast as courage. The other's identical trait became foolishness after failure. 

  Then there's the sideways travel. The negative judgment from a failed journal submission affects unrelated areas like budget decisions. Why does this happen? Probably cognitive dissonance or halo effects, where one negative trait perception bleeds into other domains. The asymmetry is interesting too—negative judgments persist even after debunking, while positive ones collapse when luck is pointed out. That suggests a deeper cognitive bias toward preserving negative assessments.

  Now, considering existing concepts. Moral luck is close but not identical. Here, it's not about control but action redescription. Outcome bias fits partially, but again, the redescription element is key. Action theory discusses coarse vs. fine-grained descriptions, but doesn't address the evaluative shift. The concept I coined, "evaluative drift," combines these—redescription plus judgment migration. 

  Edge cases: When is broadening action descriptions legitimate? If the agent endorsed the broader scope beforehand, like a general admitting their strategy included supply lines. Without that prior endorsement, it's evaluative drift. And a surface-similar case without the pattern? Someone fails due to unforeseeable events, and critics acknowledge the bad luck without reappraising their character. That absence shows the drift isn't inevitable.

  The user's hidden needs: They likely want to articulate this pattern to colleagues, hence needing a precise term. Also, understanding the mechanism could help address departmental biases, like unfair promotion files influenced by past luck. Their frustration with superficial labels suggests they seek a framework for deeper discussions, possibly to foster fairness in evaluations.

  Putting it together: Evaluative drift as the core concept, with relocation and sideways travel as linked mechanisms. The asymmetry might stem from negativity bias. Offering "constitutive drift" for the redescription part gives them usable terminology. Emphasizing the difference from moral luck addresses their request for distinction. Practical examples help them apply this in meetings, fulfilling their need to communicate this effectively on Monday.
answer: |-
  This is a brilliantly observed pattern, and you're right that existing concepts like "moral luck" or "outcome bias" capture *aspects* but not the full mechanism you've dissected. Let's carve it precisely.

  **The Core Phenomenon: Evaluative Drift**

  1.  **Outcome-Triggered Evaluative Shift:** An initial action (A) is performed with a specific voluntary core (e.g., stubbornness, ambition, risk-taking). An outcome (O) occurs, significantly influenced by factors beyond the agent's control (luck).
  2.  **Retroactive Action Redescription (Relocation):** The *description* of the action (A) is implicitly or explicitly altered to align with the valence of the outcome (O). This isn't about denying control over the *initial act*, but about *reframing what the act fundamentally *was* or *represented* in light of O.
      *   *Positive O (Success):* A is described *more narrowly* or *specifically* to isolate the "good" voluntary element ("courage," "vision," "persistence") and downplay/separate luck ("got lucky *despite* the risk"). The luck becomes an *external* factor.
      *   *Negative O (Failure):* A is described *more broadly* or *generically* to encompass elements that make the failure seem like an inherent flaw ("won't listen," "reckless," "poor judgment"). The luck becomes an *intrinsic* consequence of the flawed action.
  3.  **Judgment Migration (Sideways Travel):** The *evaluative judgment* (J) formed via this outcome-triggered redescription doesn't remain confined to the original act (A) or even similar future acts. It bleeds into *wholly unrelated domains* (competence, trustworthiness, character) as a seemingly stable trait ("unreliable," "poor strategist," "brave thinker").

  **Relationship of Relocation and Sideways Travel:**

  *   **Linked, Not Identical:** They are distinct phases of the *same evaluative drift process*.
      1.  **Relocation is the Mechanism:** It's *how* the initial outcome (O) contaminates the perception of the action (A) itself, creating a new, outcome-tainted "fact" about the agent's conduct.
      2.  **Sideways Travel is the Consequence:** The newly formed judgment (J), now seemingly rooted in a "fact" about the agent's action/character (thanks to relocation), becomes available as a general heuristic for evaluating the agent in *any* context. It's the fallout of the relocated description becoming accepted as truth.
  *   **Travel Requires Relocation:** Sideways travel relies on the judgment feeling grounded in a "real" characteristic revealed by the redescription. Without relocation, J remains tied to the specific outcome of A. *With* relocation, J feels like it's about *who the agent is*.

  **Distinguishing from Neighbors:**

  1.  **Moral Luck (Nagel/Williams):**
      *   **Focus:** How luck *should* or *does* affect moral *blame/praise* for actions based on *outcomes* the agent couldn't fully control (e.g., the reckless driver who hits a child vs. the one who doesn't).
      *   **Difference:** Your phenomenon isn't primarily about *blameworthiness* per se. It's about the *cognitive process of redescription* that *enables* the judgment (blame *or* praise) to latch onto the agent *as a person* and migrate. Nagel worries about control; you observe the *redescription* that makes the judgment sticky and portable *regardless* of control debates. It's the *action description* shift that's key.
  2.  **Outcome Bias (Baron/Hershey):**
      *   **Focus:** The tendency to judge the *quality of a decision* based on its outcome rather than the quality of the decision-making process *given the information available at the time*.
      *   **Difference:** Outcome bias explains the *initial* skewed judgment about the *decision/action itself*. Your phenomenon explains *what happens next*: how that biased judgment triggers a redescription of the *action's nature* and then *migrates* to form a broader character assessment. It's the downstream effect and generalization mechanism.
  3.  **Action Theory (Coarse/Fine-Grained Descriptions - Davidson/Anscombe):**
      *   **Focus:** How actions can be described at different levels of specificity (e.g., "flipping the switch," "turning on the light," "alerting the burglar"). What counts as "the same action"?
      *   **Difference:** Action theory is descriptive/metaphysical. Your phenomenon is *evaluative* and *motivated*. The redescription isn't neutral; it's *strategic*, driven by the *need to justify the outcome-triggered judgment*. It's biased redescription in service of preserving an affectively charged evaluation.

  **Edge Cases & Legitimacy:**

  *   **When is Broadening Legitimate?** Your guess is correct. Broadening the description is legitimate **if the agent *endorsed* or *should reasonably have foreseen* the broader context/consequences as part of their act.** Example:
      *   *Illegitimate (Your Case):* "He pushed the reform" -> (fails) -> "He stubbornly ignored all risks (including unforeseen funding changes!)". The funding change wasn't a foreseeable risk inherent in *his* stubbornness about *this specific reform*.
      *   *Legitimate:* A general launches an invasion reliant on fragile supply lines. The supply lines collapse due to unexpected weather. Criticizing him for "undertaking a logistically unsustainable campaign" is legitimate broadening *if* competent planning *should* have identified the supply line vulnerability *as a core risk of the chosen strategy*. He endorsed the strategy *including* its inherent logistical risks. The weather was bad luck, but the vulnerability was constitutive of his act.
  *   **Case Without the Pattern (Surface Features Present):** Two colleagues push risky reforms. One succeeds (lucky demographic blip), one fails (unlucky funding change). At the retro:
      *   *Success:* "John got very lucky with those demographics. His push was still pretty reckless given what we knew. We need to review the *process* for approving reforms, not just outcomes." (Judgment remains on the *act/process*, doesn't become "John is visionary", doesn't migrate).
      *   *Failure:* "Jane was unlucky with the funding change. Her analysis of the *educational need* was sound, and the push itself wasn't inherently foolish based on our info at the time. Let's help her manage the fallout." (Judgment doesn't become "Jane is stubborn/unreliable", doesn't migrate). **Key Difference:** Evaluators consciously decouple outcome luck from the assessment of the *initial voluntary act* and resist forming a global character judgment. They focus on the *decision process* under uncertainty.

  **The Asymmetry:**

  *   **Observation:** Negative judgments (from failure + bad luck) seem more resilient to debunking ("it was bad luck") than positive judgments (from success + good luck) ("it was good luck").
  *   **Is it Essential?** Not logically essential to the *mechanism* of evaluative drift (it *could* happen symmetrically), but **highly characteristic and likely driven by deeper cognitive biases:**
      *   **Negativity Bias:** Humans pay more attention to, weigh more heavily, and remember negative information more than positive. A failure + bad luck combo is a strong negative signal.
      *   **Fundamental Attribution Error (FAE):** We tend to over-attribute others' behavior to internal traits (character) and under-attribute to situational factors (luck), especially for negative outcomes. FAE makes it easier to anchor the failure-based redescription ("stubborn fool") as a trait than to accept the success was lucky.
      *   **Threat Response:** Failure can feel threatening (to department, reputation, resources). Blaming an individual's "flaw" (revealed by the broadened description) is psychologically easier than accepting random bad luck destabilizing things. Success, while positive, doesn't trigger the same defensive need to anchor blame.
      *   **Collapse of Flattering Judgment:** Pointing out luck for success directly undermines the agent's claim to exceptional skill/vision (threatening their self-narrative and status). Pointing out luck for failure doesn't fully absolve the agent in the eyes of others; the FAE and negativity bias keep the taint of the failure attached via the broadened description ("even with bad luck, it showed poor judgment to be in that vulnerable position").

  **The Carved Concept: Evaluative Drift (with Key Components)**

  *   **Term:** **Evaluative Drift**
  *   **Definition:** The cognitive and social process whereby:
      1.  The perceived outcome of an action, significantly influenced by factors beyond the agent's control, triggers a biased retroactive redescription of the nature of the agent's voluntary conduct (*Constitutive Drift*).
      2.  This redescription serves to align the perceived act with the valence of the outcome (narrowing for success, broadening for failure).
      3.  The resulting evaluative judgment of the agent, now seemingly grounded in this redescription, subsequently migrates to influence assessments of the agent in unrelated contexts (*Judgmental Migration*).

  *   **Sub-Terms for Precision (Use as needed):**
      *   **Constitutive Drift:** The specific mechanism of outcome-triggered redescription of the voluntary act (Step 2 above - the "relocation").
      *   **Judgmental Migration:** The subsequent leakage of the evaluation into unrelated domains (Step 3 above - the "sideways travel").

  **Using it on Monday:**

  > "Look, I think we're seeing a classic case of **Evaluative Drift** here. When Jane's initiative succeeded due to that unexpected enrollment surge, we engaged in **Constitutive Drift**: we retroactively narrowed our description of her act to just 'courageous vision,' downplaying the stubbornness that was equally present. When John's failed because of the funding rule change, we drifted the other way: we broadened our description to 'reckless disregard for risk,' making the failure seem inherent to *him*. Now, that judgment about John being 'reckless' or 'poor at planning' is undergoing **Judgmental Migration** – it's coloring how we view his budget proposals and committee work, even though those have nothing to do with curriculum reform. We need to consciously decouple the luck-driven outcomes from our assessment of their initial *volition* and stop letting those judgments bleed into everything else."

  You've identified a profound and pernicious cognitive habit. "Evaluative Drift" and its components ("Constitutive Drift," "Judgmental Migration") should give you the precision to dissect it in the pub, the classroom, and the department meeting.
