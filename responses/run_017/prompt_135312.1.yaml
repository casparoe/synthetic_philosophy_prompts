answer: |-
  ## The Reductionist Dreams of Matching

  We mapped her moods to circuits, traced each turn,  
  As if the perfect dose might calibrate  
  The inner sea’s unsteady, shifting weight.  
  We sought the rhythm in the faulty pulse,  
  The tangled protein’s consequential fold,  
  The single, final, diagnostic sign.

  No other language held the needed sign:  
  We thought a switch must turn her suffering’s turn,  
  A synaptic fault the reason for the fold  
  In meaning. Every ache required its dose  
  Of explanation. Could we trace the pulse  
  Of thought itself, discard the phantom weight?

  But watch how different structures bear the weight  
  Of similar collapse. Observe the sign:  
  The tremor manifests without that pulse  
  Of dopamine you swore would mark the turn.  
  A different salt conveys the toxic dose;  
  Another gene instructs the lethal fold.

  Consider systems poised at phase-change fold:  
  A billion spins align beneath the weight  
  Of freezing air. No single atom’s dose  
  Of motion holds the critical cold’s sign.  
  Below that line, no change; beyond, the turn  
  To solid. Finite parts? The macro pulse

  Refuses capture. Is the emergent pulse  
  Of ice itself just substrate, fold on fold?  
  Then what commands the water’s sharp turn  
  From flow to fracture? What sustains the weight  
  Of form? If circuits cause, why does the sign  
  Persist when swapped? Is she *nothing but* this dose

  Of elements? Or must we grant the dose  
  Of suffering a life beyond the pulse  
  Of ions? Here’s the rub: each hopeful sign  
  Of pure reduction meets a stubborn fold  
  In logic. If the micro bears the weight  
  Of cause, what work is left for her to turn?

  Envoy  
  The strict fold yields no cure. The measured dose  
  Falls short. The pulse still stutters. Weight remains.  
  No circuit bears her sign. *Illness* still turns.

  ---

  **Notes on the Sestina & Contested Ground**

  1.  **Strain Point:** Line 3, Stanza 5 ("Of motion holds the critical cold’s sign.") is syntactically awkward due to needing "sign" as the end-word while trying to convey the "critical point/sign" concept. It prioritizes form slightly over fluidity.
  2.  **Envoy Cost:** The final line names "Illness" explicitly. This breaks the requested abstraction but serves a crucial purpose: resolving the envoy's pairing argument ("No circuit bears her sign. *Illness* still turns.") and grounding the abstract dilemma in the concrete, lived reality central to your perspective. The cost is abandoning pure implication for direct confrontation.
  3.  **"Nothing but":** Used in Stanza 5, Line 5 ("Is she *nothing but* this dose"), visibly marked as the claim under examination.

  **Where the Poem Stands: Settled, Debated, and Leaned-On**

  *   **Settled/Nearly Settled:**
      *   **Multiple Realizability (MR):** Widely accepted across philosophy of mind and science. The poem relies heavily on this (Stanzas 3 & 4, "But watch how different structures bear the weight...", "Consider systems poised at phase-change fold..."). MR defeats *type-identity* reduction (the claim that every mental state type is identical to one neural state type).
      *   **Causal Completeness of Physics (at some level):** Generally assumed in non-vitalist scientific work. The dilemma in Stanza 5 ("If circuits cause... Is she nothing but...?") presupposes it.
      *   **Need for Higher-Level Explanations:** Practically uncontested, even by reductionists. Autonomy is often conceded for pragmatic/epistemic reasons.

  *   **Genuinely Contested:**
      *   **MR vs. Reduction:** Does MR defeat reduction *itself*, or merely type-identity? Can *token-identity* (this instance of illness is identical to *this specific* neural state) or *functional* reduction (defining illness by its causal role, then finding its physical realizer) succeed? The poem *leans* on MR implying non-identity and defeating reduction proper (Stanza 6, Envoy).
      *   **Singular Limits & Ontology:** Does the thermodynamic limit (Stanza 6) show *ontological emergence* (new, fundamental causal powers at the macro level) or is it merely *epistemically* necessary for tractable explanation? The poem *implies* ontological significance ("The macro pulse / Refuses capture"), a contested view. Many argue it only justifies explanatory autonomy.
      *   **The Exclusion Problem:** Is it a sound argument against non-reductive physicalism? If the physical is causally complete and the mental supervenes on the physical, how can the mental have distinct causal powers? This *is* a live dilemma. The poem presents it starkly in Stanza 5 but offers no resolution, reflecting the ongoing debate.
      *   **"Strong Emergence":** Does it have coherent content beyond explanatory utility? Most neuroscientists/philosophers of science are deeply skeptical. The poem flirts with it via the phase transition and the envoy's refusal, but avoids explicitly claiming novel downward causation.

  *   **Where the Poem Leans/Fudges:**
      *   **Leaning on Non-Reduction via MR:** It presents MR (Stanza 3) as directly challenging reduction, aligning with arguments by Fodor, Putnam, and others against *any* straightforward reduction of special sciences. This is contested by proponents of functional reduction (e.g., Kim, later writings).
      *   **Leaning on Ontological Significance of Limits:** The phase transition stanza (6) is framed as a fundamental obstacle ("The macro pulse / Refuses capture"), suggesting ontological emergence is plausible. This is a contested interpretation.
      *   **Fudging "Pulse":** "Pulse" is used flexibly: neural activity pulse (Stanza 1), metaphorical pulse of thought/illness (Stanza 2), and macro-level pulse (Stanza 6). This stretches the 'lower-level' requirement slightly for poetic coherence and thematic link.
      *   **Avoiding Temperature:** Heeded your caution. Used the conceptually clearer (though still complex) example of phase transitions (water/ice), explicitly mentioning the thermodynamic limit ("Finite parts? The macro pulse / Refuses capture").

  *   **Embarrassing Claim?:** The poem's strongest, potentially contestable implication (especially to neurologists listening for sloppiness) is in the envoy: "No circuit bears her sign. *Illness* still turns." This asserts a fundamental *explanatory and causal* gap. While MR justifies explanatory autonomy, and the exclusion problem highlights a dilemma, this line leans towards the *reality* of the higher-level kind ("Illness") as something the mechanistic vocabulary cannot fully capture or *be*, not just explain. It risks sounding dualistic or anti-physicalist. However, it grounds this in the preceding arguments (MR, limits) and the lived experience central to your request, avoiding quantum woo or vitalism. It's the core tension you asked to be made legible.
