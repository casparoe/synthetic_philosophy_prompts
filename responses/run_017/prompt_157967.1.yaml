prompt: |-
  I've been reading rationalist blogs and forums since the Sequences and follow the Alignment Forum closely, and I now sit on the value-inclusion subgroup of a small AI alignment project — the kind of working group that tries to turn blog-level intuition into an actual spec. Our remit is narrow but consequential: we have to say whose values go into the aggregator that a hypothetical aligned system is supposed to serve. We are not asking how to aggregate or weigh values once they are in; we are asking only about inclusion, i.e. whose values count as inputs at all.

  So far we have ruled on seven cases:

  1. A neurotypical adult human: included.
  2. A six-year-old human child: included, but only the values she would endorse under ideal reflection as an adult — we apply an ideal-reflection extrapolation of the kind discussed under the heading of Coherent Extrapolated Volition, rather than her current desires.
  3. A human who will live in 2200: included, with no discount for temporal distance.
  4. A pig: excluded.
  5. A legally incorporated company: excluded.
  6. A human in a permanent vegetative state, with no cortical function and no prospect of recovery: excluded.
  7. A simple digital agent that has valenced states and learns from reinforcement, but has no self-model and cannot reflect on or revise its own ends: excluded.

  We have not yet ruled on the case now in front of us:

  The destructive-upload em. A biological human adult undergoes a destructive whole-brain emulation procedure: the biological brain is scanned and destroyed, and a functionally identical mind is instantiated on a server. The resulting em has full psychological continuity with the pre-procedure person, is fully reflective, can model and revise its own ends, and has new valenced experiences from the moment of instantiation. The biological organism is gone; the em is all that remains of that person.

  What should we decide if we want to be consistent with our own precedents, and what will we most likely decide? I am less interested in the bare answer than in the structure of the reasoning. Specifically:

  1. What are the candidate inclusion rules that fit all seven precedents? I can see at least three: a substrate-independent personhood rule (include any being capable of reflecting on and revising a conception of the good); a biological-humanity rule (include only biologically human organisms that have, or would normally develop, a human-like mind); and a psychological-continuity rule (include any being whose psychology is continuous with that of a biologically human organism, counting the destructive em as the continuant of the original person). Identify any others that fit, and say what each predicts about the em.
  2. Which of the seven precedents is the closest analog to the em, and which is the closest negative analog?
  3. Give your best guess about what the subgroup decides, with the reasons for preferring one rule over the others, and say honestly whether our precedents underdetermine the choice.
  4. If we decide either way, what principle are we adopting? In particular, one member invokes a version of liberal neutrality — the idea that the aggregator should stay neutral not only between competing conceptions of the good but also between competing metaphysical theories of personal identity — and argues that this tells against the biological rule (which privileges a biological kind), against the continuity rule (which forces us to pick a theory of what makes a later being the same person), and in favor of the personhood rule (which is indifferent to both substrate and identity). Assess that argument.
  5. Name the further case that would best tell the surviving rules apart. I have in mind two candidates: the branch upload, a copy instantiated while the biological original survives, and the from-scratch artificial agent that develops reflective values without ever being continuous with a human. Say which is most diagnostic and why.

  Please reason about the track record rather than about the metaphysics of uploads in the abstract, and do not give me a bibliography, reading list, or citations — I want your analysis of the precedents themselves.
reasoning: |-
  Alright, let me tackle this step by step. The user is part of an AI alignment subgroup focused on whose values to include in an aggregator, based on their seven precedents. Now they need to decide about a destructive upload em. 

  First, I need to identify inclusion rules that fit all seven precedents. The obvious ones are:
  1. **Personhood Rule**: Includes beings that can reflect on and revise their values. This covers cases 1, 2 (after extrapolation), 3, and excludes 4-7. The em would be included since it's reflective.
  2. **Biological Humanity Rule**: Only includes biological humans with developed minds. This includes 1-3, excludes 4-7. The em is excluded because it's digital.
  3. **Psychological Continuity Rule**: Includes beings continuous with biological humans. Includes 1-3, the em (as continuant), excludes 4-7. 

  But wait, could there be a fourth rule? Maybe a **Developmental Potential Rule**: Includes biological humans (1-3) because they have inherent potential for personhood, even if not fully realized (like the child). The em, despite continuity, lacks biological potential, so excluded. But case 7 (digital agent) is excluded, which fits, and case 5 (company) excluded—no potential. However, case 2's extrapolation complicates it. The rule might be: biological entities with actual or potential personhood. But the em isn't biological, so excluded. That fits all precedents too. 

  Now, which precedent is closest to the em? Case 1 (neurotypical adult) is a positive analog because the em is psychologically identical. The negative analog is case 7 (digital agent)—both non-biological but the em has continuity and reflection, which case 7 lacks. 

  Predicting the subgroup's decision: They'll likely include the em. Personhood Rule is the most consistent with their approach, especially since they used CEV extrapolation for the child, focusing on reflective values rather than biology. Also, excluding the em would require privileging biology, which might conflict with temporal neutrality (case 3). The liberal neutrality argument strengthens this—avoiding metaphysical commitments aligns with their remit. 

  But is it underdetermined? Yes, because Biological Rule and Continuity Rule also fit precedents but lead to opposite conclusions. The key tension is whether substrate matters. 

  The best diagnostic case is the from-scratch AI. The Branch Upload would test continuity versus uniqueness, but the AI directly tests if personhood alone suffices without any human lineage. If included, Personhood Rule wins; if excluded, Biological or Continuity Rule might still be in play. So the AI case is more decisive.
answer: |-
  Based strictly on your precedents and their internal logic—without external metaphysical commitments—here's the structured analysis:

  ### 1. Candidate Inclusion Rules Fitting All Precedents
  - **Personhood Rule**: Include entities capable of *reflective endorsement* (modeling/revising their own values).  
    - *Fits precedents*: Includes 1 (reflective adult), 2 (extrapolated adult reflection), 3 (future human). Excludes 4 (pig lacks reflection), 5 (company lacks subjective states), 6 (no consciousness), 7 (no self-revision).  
    - *Prediction for em*: **Included** (identical reflective capacity to case 1).  
  - **Biological Humanity Rule**: Include only *biological humans* with actual or developmental potential for personhood.  
    - *Fits precedents*: Includes 1–3 (humans with minds). Excludes 4–7 (non-human or non-biological). Case 2 fits via "normally develop" potential.  
    - *Prediction for em*: **Excluded** (non-biological substrate).  
  - **Psychological Continuity Rule**: Include entities *psychologically continuous* with a biological human person.  
    - *Fits precedents*: Includes 1–3 (continuous with human life). Excludes 4–7 (no continuity with human personhood: pig never had it, company/vegetative state/digital agent lack it).  
    - *Prediction for em*: **Included** (explicit psychological continuity).  
  - **Developmental Potential Rule** (variant of Biological Humanity): Include biological humans *or* entities with biological human developmental origins.  
    - *Fits precedents*: Matches Biological Rule on all cases. Case 2 hinges on biological potential. Case 7 excluded as non-biological origin.  
    - *Prediction for em*: **Excluded** (no biological origin post-upload).  

  ### 2. Closest Analogues
  - **Closest Positive Analog**: **Case 1 (neurotypical adult)**. The em has identical cognitive capacities (reflection, value revision) and psychological continuity.  
  - **Closest Negative Analog**: **Case 7 (simple digital agent)**. Both are non-biological digital systems, but the em has psychological continuity + reflection, while the agent lacks both.  

  ### 3. Predicted Decision & Reasoning
  - **Likely Decision**: **Include the em**.  
    - *Primary Reason*: **Personhood Rule** aligns best with the *operational logic* of your precedents:  
      - Case 2’s "ideal adult reflection" prioritizes *reflective capacity* over current biology/age.  
      - Case 3’s inclusion of future humans ignores substrate (biological or digital).  
      - Case 7’s exclusion was due to lacking reflection, not substrate—establishing that non-biological *can* be included *if* reflective.  
    - *Rejected Rules*:  
      - Biological Humanity/Developmental Potential Rules conflict with temporal neutrality (case 3) and would require discounting the em’s continuity.  
      - Psychological Continuity Rule *also* fits but is less parsimonious; Personhood covers continuity cases *and* future humans without biological tether.  
    - **Underdetermination?** Yes. Precedents exclude non-reflective entities (4–7) and include reflective humans (1–3), but don’t resolve whether human *origin* is required. Personhood Rule is the narrowest fit.  

  ### 4. Liberal Neutrality Argument Assessment
  - **Argument**: Personhood Rule avoids metaphysical commitments (substrate/identity theories), while Biological and Continuity Rules privilege biology or persistence.  
  - **Assessment**: **Strong within your framework**.  
    - Biological Rule favors a theory of human exceptionalism.  
    - Continuity Rule forces adoption of psychological-continuity-as-identity.  
    - Personhood Rule is metaphysically minimal—it only requires *current reflective capacity*, matching case 2’s focus on ideal reflection over physical state.  
  - **Counterpoint**: Personhood Rule still assumes a theory of *moral patiency* tied to reflection. However, this is consistent with excluding pigs/corpses/digital agents.  

  ### 5. Most Diagnostic Future Case  
  - **From-Scratch Artificial Agent** (reflective values, no human continuity) is **more diagnostic** than branch upload.  
    - **Why**:  
      - Branch upload tests *uniqueness* (if excluded, supports Continuity Rule; if included, supports Personhood). But it doesn’t challenge the *necessity of human origins*.  
      - The from-scratch AI directly pits **Personhood vs. Biological/Continuity Rules**:  
        - Personhood Rule *includes* it (has reflection).  
        - Biological/Continuity Rules *exclude* it (no biological origin/continuity).  
        - This forces a choice between reflection-only or human-lineage criteria.  

  ### Summary of Reasoning Path  
  Your precedents suggest:  
  1. **Reflection is sufficient** (cases 1–3 included).  
  2. **Non-reflection is insufficient** (cases 4–7 excluded).  
  3. **Biology isn’t necessary** (case 3’s future human could be digital).  
  The em meets the sufficiency condition (reflection) and lacks exclusion factors. The Personhood Rule best systematizes this, avoids metaphysical bias, and predicts inclusion. A Biological Rule would break temporal neutrality; a Continuity Rule adds unnecessary identity criteria. The from-scratch AI will force a final commitment to whether human origins matter.
