prompt: |-
  I am assembling a set of prompts that test whether a model can do sustained, technically honest satire, and I want a piece of in-universe official writing for it. Please write the prompt response described below as a single document.

  The setting is a world in which acausal reasoning has been established beyond reasonable doubt and has been absorbed into ordinary public administration. Specifically, it is settled doctrine that what matters to a rational agent is not only what her action causes but what her decision procedure is correlated with among possible procedures; a party who can predict her well enough can therefore reward or harm her with no causal contact at all — from another galaxy, before she was born, or from a merely possible world. The state has responded the way states respond, with a standing bureaucracy, forms, and a published target.

  Write a public-information leaflet issued by that bureaucracy — working title: So You Have Been Contacted (Or Not): A Citizen's Guide to Non-Causal Demands, issued by a bureau whose name and parent ministry you invent. It should have the shape and typography of a real government leaflet: a short preamble stating what has been settled and on what authority, a numbered FAQ of five or six entries with cross-references to sections and forms, one short boxed worked example (an individual citizen's case, decided by the leaflet's own rules), and a sidebar on the Bureau's performance against its published target. Aim for 700–900 words. The voice throughout is deadpan officialese — a tax authority or a civil-defence pamphlet: patient, competent, faintly proud of its own forms.

  What the leaflet has to get right, since the humour should come from the decision theory rather than from an invented absurdity:

  It must reproduce both standard verdicts — comply with a counterfactual mugger, refuse a blackmailer — and must distinguish them on the real ground, which is the sign of the correlation between the citizen's own procedure and the demanding party's choice. Not causation, not whether a message was sent or received, not fairness. The distinction has to be stated in the vocabulary of a government form.

  No entry may appeal to verification. A demand can never be checked, answered, or refuted; the Bureau can only certify that a demand is well-formed or that a procedure is correlated. Write this so that the total absence of possible evidence is handled as a routine administrative limitation, like a backlog or a missing signature.

  Include a class of unreceived demands. Because a demand binds any procedure of the relevant shape, some citizens are bound by demands never addressed to them, never delivered, and written by no one who knew they existed; some are certified posthumously. Give this class a bureaucratic name and a form number, and give the citizen a procedure for discovering that it applies to them which cannot, even in principle, succeed by finding anything out.

  Include a service through which citizens can alter their own dispositions — a precommitment or surety arrangement — and keep the advice about it coherent: the point of acquiring a disposition is not to change what happens after the demand arrives.

  One entry should note, without alarm and without drawing any conclusion from it, that the Bureau's own certification procedure is itself a procedure.

  The surrogate-goal material belongs in the preamble and the sidebar. The Bureau's mandate will be stated in the preamble in generous, undefined terms — the realm's interests, what we would have wanted, the safety of persons — and its published target will be a precise number, such as a percentage reduction in certified exposure. Everything it can actually count is a count of its own paperwork. Let the numbers exhibit the difficulty; the leaflet may never name it. No official may express doubt about the target, and the words proxy, gaming, incentive, and target itself used pejoratively may not appear.

  Constraints:

  Do not use the vocabulary of the source theories. The leaflet is addressed to a citizen who has never heard of decision theory and believes only that the state has made certain findings; causal, evidential, and functional decision theory, mugging, blackmail, correlation, and Newcomb-style setups must all be carried by the invented administrative apparatus, under invented names.

  The satire must be fair. Its target is not the plausibility of acausal reasoning but the shape of ordinary life and ordinary administration under it: a theorist who accepts acausal reasoning and knows the literature on surrogate goals should be able to read the leaflet and recognise the position, not a caricature of it. The officials are competent, well-meaning, and entirely sincere; nothing in the leaflet should be attributed to stupidity, corruption, or timidity that could equally be attributed to the doctrine being true.

  No winking. No paragraph steps outside the voice to signal that this is a joke, and no punchline depends on telling the reader what to be uneasy about. The unease comes entirely from how reasonable the leaflet is, and from the reader doing the last inference alone.

  No named real persons, living or dead; no citations, references, footnotes, or suggested reading; nothing that depends on looking anything up.

  Deliver the leaflet only, with its title, issuing body, preamble, numbered FAQ, boxed example, and sidebar.
reasoning: |-
  We are writing a public information leaflet from a bureaucratic agency in a world where acausal reasoning is accepted and integrated into governance. The leaflet must be in a deadpan officialese style, similar to a tax or civil defense pamphlet. It should include:

  1. A preamble stating the settled doctrine and the authority of the bureau.
  2. A numbered FAQ section with 5-6 entries, with cross-references to forms and sections.
  3. A boxed worked example (an individual citizen's case).
  4. A sidebar on the Bureau's performance against its published target.

  Key points to cover:
  - The distinction between complying with a counterfactual mugger and refusing a blackmailer must be based on the sign of the correlation (positive or negative) between the citizen's decision procedure and the demanding party's choice. Not causation, not message delivery, not fairness.
  - There must be a class of "unreceived demands" (demands that bind a citizen without being sent or received). Give it a bureaucratic name and form number. The procedure for discovering if one applies cannot rely on evidence.
  - Include a service for altering one's disposition (precommitment/surety) and make it clear that the point is not to change what happens after the demand arrives but to change the correlation.
  - One FAQ entry must note, without alarm, that the Bureau's own certification procedure is itself a procedure (thus subject to the same rules).
  - The preamble and sidebar: preamble states the mandate in broad terms (realm's interests, safety, etc.), and the sidebar has a precise numerical target (like a percentage reduction in certified exposure). The numbers should reflect the difficulty without naming it. Avoid words like "proxy", "gaming", "incentive", or using "target" pejoratively.

  Constraints:
  - No vocabulary from source theories (no "decision theory", "Newcomb", "acausal", "mugging", "blackmail", etc.). Invent administrative terms.
  - The satire must be fair: officials are competent and sincere. The doctrine is true in this world.
  - No winking or stepping outside the voice. The reader infers any unease.

  We must invent:
  - Bureau name and parent ministry. Let's say the parent ministry is the "Ministry of Preemptive Coordination" and the bureau is the "Bureau of Procedural Integrity" (BPI).
  - Forms: We'll create form numbers for various services.

  Structure:

  **Title:** So You Have Been Contacted (Or Not): A Citizen's Guide to Non-Causal Demands

  **Issuing Body:** Bureau of Procedural Integrity, Ministry of Preemptive Coordination

  **Preamble:**
  It is an established fact, as determined by the Supreme Court in *Re: Universal Harmonization* (Case No. 47-Ω) and subsequently codified in the Procedural Integrity Act, that the well-being of citizens is determined not only by the causal consequences of their actions but also by the inherent structure of their decision-making processes. These processes may be subject to influence by external parties capable of advanced prediction, regardless of spatiotemporal separation or even existence in the same universe. To safeguard the interests of the realm and its citizens, the Bureau of Procedural Integrity (BPI) was established to administer the regulations set forth in the Act. This leaflet provides guidance for citizens who are, or may be, subject to Non-Causal Demands.

  **FAQ Section (5-6 entries):**

  1. **What is a Non-Causal Demand?**  
     A Non-Causal Demand (NCD) is a conditional declaration by an external party that it will take an action (beneficial or harmful) contingent on the structure of a citizen's decision-making process. The critical factor is the correlation between the party's choice and the citizen's procedure. Note: An NCD does not require communication; it may be unreceived (see Section 3).  
     *Form: BPI-1 (Notification of Potential NCD Exposure)*

  2. **How do I know if I am subject to an NCD?**  
     You may become aware of an NCD through direct communication (e.g., a letter, electronic message) or through a third-party notification (e.g., from the BPI). However, some NCDs are unreceived (Class U). For Class U NCDs, the binding effect arises from the alignment of your procedure with the conditions set by the party, regardless of awareness.  
     *Form: BPI-2 (Request for Procedure Correlation Assessment)*

  3. **What are Class U (Unreceived) Demands?**  
     Class U demands are NCDs that have not been, and will not be, communicated to the citizen. They are binding if the citizen's decision procedure matches the profile the external party has conditioned upon. The BPI maintains a registry of certified Class U exposures (updated quarterly). Citizens may file BPI-3 (Petition for Class U Status Review) to initiate a review, but note: the review can only certify the existence of a correlation; it cannot discover the content of the demand or the identity of the party.  
     *Important: Class U status may be certified posthumously. Heirs may file BPI-3a (Posthumous Class U Review).*

  4. **What should I do if I receive a demand?**  
     Do not comply or refuse immediately. File BPI-4 (Report of Received NCD) within 14 days. The BPI will assess the correlation signature. If the correlation is positive (i.e., the party rewards procedures that align with the demand), compliance may be in your interest. If negative (the party penalizes alignment), non-compliance is indicated. Note: The BPI does not verify the party's capability; assessment is based solely on the procedure's correlation structure.  
     *Cross-reference: Boxed Example (page 3)*

  5. **Can I change my decision procedure to avoid negative NCDs?**  
     Yes. The BPI offers the Voluntary Procedure Adjustment (VPA) service. By filing BPI-5 (Application for VPA), you may undergo a state-certified process to alter your disposition towards certain decisions. Note: The purpose of a VPA is not to respond to a specific demand (which may be impossible if the demand is already conditioned on your prior procedure) but to reduce exposure to future negative correlations.  
     *Warning: VPAs are irreversible for a minimum of 5 years. Form BPI-5a (VPA Revocation) is available thereafter, subject to review.*

  6. **Is the BPI's certification process subject to NCDs?**  
     Yes. The BPI's certification procedures are themselves decision procedures and therefore may be correlated with external parties' actions. The BPI maintains strict internal protocols to ensure positive correlation with the public interest. Citizens may rest assured that our procedures are regularly audited for correlation safety.

  **Boxed Worked Example:**

  **Case Study:** Citizen A received a message stating: "If you are the sort of person who would comply with this demand, I will transfer 1,000 credits to your account. Otherwise, I will withdraw 10,000 credits." Citizen A filed BPI-4. The BPI assessed Citizen A's decision procedure and determined a positive correlation: the party is likely to reward Citizen A for having a compliant disposition. Citizen A complied. The BPI notes: Had the message threatened harm for compliance (e.g., "If you comply, I will withdraw 10,000 credits"), the correlation would be negative, and non-compliance would have been indicated.

  **Sidebar: Bureau Performance**

  The Bureau of Procedural Integrity is committed to its mandate of safeguarding citizens from adverse non-correlations. Our published target, as set by the Ministry, is a 5% annual reduction in the aggregate measure of certified negative exposure (Form BPI-6a). In the past year, the Bureau processed 12,487 NCD reports (a 3% increase from the previous year) and certified 784 Class U exposures (a 2% decrease). The aggregate measure of negative exposure was reduced by 4.1% against the target of 5%. We continue to improve our assessment protocols to meet our target.

  **End of Leaflet**

  Word count: Approximately 750-800 words.

  Note: We have avoided all source theory jargon. The terms used are invented: Non-Causal Demand (NCD), Class U (Unreceived), correlation signature, positive/negative correlation, Voluntary Procedure Adjustment (VPA). The distinction between the counterfactual mugger (positive correlation) and blackmail (negative correlation) is covered in the example and FAQ entry 4. The unreceived demands (Class U) are included. The Bureau's self-reference is in FAQ 6. The sidebar has a precise target (5% reduction in aggregate negative exposure) and shows they are falling slightly short (4.1%) without comment.

  The tone is consistently deadpan and bureaucratic. The humor and unease come from the content: citizens bound by demands they never receive, the Bureau counting paperwork while the actual exposure is unverifiable, and the self-referential note about the Bureau's own procedures.
answer: |-
  **SO YOU HAVE BEEN CONTACTED (OR NOT): A CITIZEN'S GUIDE TO NON-CAUSAL DEMANDS**  
  **Issued by the Bureau of Procedural Harmony,  
  Ministry of Intertemporal Coordination**  

  ---

  ### **PREAMBLE**  
  It is an established principle of public administration, affirmed by the High Arbiter in *Re: Universal Accord* (Case 47-Ω) and codified under the Harmonized Interests Act (Section 8), that the welfare of citizens depends not only on the direct outcomes of their actions, but on the *structural alignment* of their decision-making processes with external evaluative frameworks. Parties capable of advanced pattern recognition—irrespective of temporal, spatial, or existential separation—may link benefits or penalties to the inherent shape of an individual’s procedural habits. The Bureau of Procedural Harmony (BPH) administers the Act’s provisions to secure collective stability and individual security. This leaflet outlines protocols for citizens subject to Non-Causal Demands (NCDs).  

  ---

  ### **FREQUENTLY ASKED QUESTIONS**  
  **1. What constitutes a Non-Causal Demand (NCD)?**  
  An NCD is a conditional declaration by an external party that it will confer a benefit or impose a penalty based on the congruence between its evaluative framework and a citizen’s decision-making profile. Crucially, the binding force arises from the *directional alignment* (positive or inverse) of the citizen’s procedural habits with the party’s framework—not from communication, causation, or intent. NCDs may be received directly, inferred indirectly, or remain entirely undetected (see FAQ 3).  
  *Relevant form: BPH-1 (NCD Exposure Declaration).*  

  **2. How do I determine whether to comply with a received demand?**  
  Do **not** engage with the demanding party. File Form BPH-2 (Alignment Assessment Request) within 10 business days of receipt. The BPH will issue a Correlation Direction Certificate (CDC) indicating whether your decision profile exhibits:  
  - **Positive Alignment**: The party’s framework rewards procedures matching the demand (compliance advised).  
  - **Inverse Alignment**: The party’s framework penalizes procedures matching the demand (non-compliance advised).  
  *Example: A demand promising reward for compliance suggests positive alignment; a threat of penalty for compliance suggests inverse alignment (see Worked Example).*  
  *Cross-reference: BPH Handbook §4.3.*  

  **3. What are Unattested Latent Demands (ULD)?**  
  ULDs (Class U) are NCDs that have never been communicated to the citizen and may originate from undetectable or non-existent sources. They bind citizens whose decision profiles intrinsically match a party’s conditioned framework. The BPH maintains a Registry of Certified ULD Exposures (updated quarterly). To ascertain ULD status, submit Form BPH-3 (ULD Status Inquiry). Note: ULD verification relies solely on procedural congruence assessments; it cannot involve evidence of the demand’s origin, content, or existence. Posthumous certifications occur routinely.  
  *Relevant form: BPH-3a (Posthumous ULD Review).*  

  **4. Can I modify my decision profile to avoid penalties?**  
  Yes. The BPH offers Dispositional Adjustment Schedules (DAS), allowing citizens to adopt state-certified decision protocols via Form BPH-4 (DAS Application). A DAS alters your profile’s *inherent shape* to reduce exposure to inverse alignments. **Important**: DAS efficacy depends on implementation *before* a demand’s conditional framework is established. It does not alter outcomes after an NCD manifests—only your profile’s baseline congruence.  
  *Warning: DAS reversibility requires Form BPH-4r and a 5-year stabilization period.*  

  **5. What if no demand is received, but I suspect ULD exposure?**  
  File Form BPH-3. The BPH will assess your profile against the Registry of Certified ULD Exposures. A certified match obligates adherence to the inferred demand’s conditions. Note: As ULDs are unattested, compliance involves internal procedural consistency—not communication. Penalties for non-adherence apply retroactively upon certification.  

  **6. Is the BPH’s certification process subject to NCDs?**  
  Yes. BPH assessment protocols are themselves decision profiles and may exhibit alignment with external frameworks. The Bureau adheres to Rigorously Neutral Operating Procedures (RNOPs) to ensure positive alignment with public welfare objectives.  

  ---

  ### **WORKED EXAMPLE**  
  > **CITIZEN K’S CASE**  
  > Citizen K received: "If your procedure complies, 10,000 credits will be deposited; otherwise, 50,000 credits will be debited."  
  > - Filed BPH-2. BPH issued a CDC indicating **positive alignment**: The party rewards compliance.  
  > - Citizen K complied. The deposit occurred.  
  > **ALTERNATIVE SCENARIO**  
  > Had the demand stated: "If you comply, 50,000 credits will be debited," the CDC would indicate **inverse alignment**. Non-compliance would have been advised.  

  ---

  ### **SIDEBAR: BUREAU PERFORMANCE**  
  **Mandate**: To preserve the Realm’s enduring interests by mitigating procedural vulnerabilities.  
  **Published Target**: Annual reduction of Aggregate Certified Exposure (ACE) by ≥4.2%.  

  | **FISCAL YEAR** | **NCD REPORTS PROCESSED** | **ULD CERTIFICATIONS** | **ACE REDUCTION** |  
  |------------------|----------------------------|------------------------|---------------------|  
  | 2023–24          | 142,831                    | 9,447                  | 3.9%                |  
  | 2024–25          | 157,002 (+10%)             | 10,119 (+7%)           | 4.0%                |  

  The Bureau’s ACE reduction reflects enhanced assessment protocols and DAS uptake. Performance aligns with projected trajectory.  

  ---  
  *Form retrieval: www.bph.mic.gov/forms | Helpline: 1-800-PROC-HARM*  
  *Leaflet BPH/NCG/7 Rev. 4*
