answer: |-
  Here’s the adversarial collaboration report for your co-op, drafted as requested. Both sides (Convention-First "CF" and Norms-First "NF") have agreed on the structure and phrasing of their respective positions. The goal is to clarify disagreements, identify cruxes, and inform your vote – not to declare a winner.

  **Agreed Claims (Non-Vacuous):**
  1.  **The unwritten patterns in the co-op solve recurrent coordination problems** (e.g., washing-up, quiet hours, locking up).
  2.  **Compliance is mostly driven by expectations:** People generally follow the patterns because they expect others to follow them and expect others to expect them to follow.
  3.  **These patterns are arbitrary in principle:** A different stable pattern *could* have solved the same problem (e.g., quiet hours could start at 10:30 or 11:30; washing-up rotas could run Mon-Sun or Sun-Sat).
  4.  **The system worked effectively for existing members** before the new arrivals, despite being unwritten.
  5.  **The arrival of new members disrupted the system** because they lacked the expectations necessary for compliance.
  6.  **Some patterns involve a small cost or perceived fairness element** (e.g., communal milk), not just pure coordination.
  7.  **Writing down a rule changes the social fact of the rule** somehow; it doesn't leave it entirely unchanged.

  **Disagreements Table:**

  | # | Disagreement Phrasing (Convention-First Accepts)                                                                 | Disagreement Phrasing (Norms-First Accepts)                                                                                                                               | Real Disagreement? | Verbal Aspect?                                                                                                |
  | :-- | :--------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------- | :------------------------------------------------------------------------------------------------------------ |
  | **1** | Conventions *are* the fundamental social glue here; normative expectations and sanctions are emergent properties or unnecessary complications for explaining core compliance. | Social norms (requiring normative expectations and sanction-readiness) are fundamental; conventions are merely a subset or precursor, insufficient to explain commitment and perceived obligation. | **YES** (Core)     | Partly: Dispute over definitions ("convention" vs "norm"). **But** also substantive: Is the *core driver* expectation of behaviour (CF) or expectation of *appropriateness* (NF)? |
  | **2** | The patterns function effectively *because* they are coordination equilibria; the belief that one "ought" to comply is epiphenomenal or derived from the coordination benefit. | The sense that one "ought" to comply (and that others think you ought to) is primary and constitutive; the coordination benefit is a consequence, not the core explanation. | **YES**            | Minimal. Focus on explanatory primacy.                                                                        |
  | **3** | Sanctions (even mild disapproval) are rare, weak, or unnecessary for maintaining most house patterns; expectation of conformity is sufficient.                      | Readiness to sanction (e.g., mild disapproval, reminders, social pressure) is essential for defining a social norm and explaining sustained commitment, especially when minor costs are involved. | **YES**            | Minimal. Disagreement over empirical prevalence & necessity of sanction-readiness for "norm" status.             |
  | **4** | The "normativity" people report feeling is *just* their preference for coordinating plus their expectation that others expect them to coordinate. | The reported normativity (feeling one *should* lock the door, *shouldn't* leave dishes) is a distinct psychological state, irreducible to coordination preferences.        | **YES**            | Partly: CF sees it as reducible, NF sees it as primitive. **Substantive** disagreement about psychology.          |
  | **5** | A stable pattern sustained *only* by mutual expectations of conformity (and preference for conformity given others do) is a full convention and sufficient. | A stable pattern sustained *only* by expectations of conformity lacks the "normative bite" of a true social norm; it needs the "ought" element to be robust.               | **YES**            | **Core substantive disagreement** on what constitutes a sufficiently robust rule for this context.             |

  **Cruxes: Settling these could move one side:**

  1.  **Crux: The Role of Reported "Ought" Feelings:**
      *   **Shared Case:** Survey co-op members (old and new) on specific patterns (e.g., locking the back door, quiet hours). Ask: "Do you follow this mainly because (a) it's just what everyone does / expected, or (b) because you feel you *should* / it's the right thing to do?" AND "Do you think others follow it mainly because (a) or (b)?"
      *   **CF Prediction:** Most will cite (a) for themselves and attribute (a) to others. Strong correlation between expectation of conformity and compliance, weak independent role for (b). "Ought" feelings are consequences, not primary drivers.
      *   **NF Prediction:** Significant portion (especially established members) will cite (b) for themselves and attribute (b) to others. "Ought" feeling is a distinct, primary motivator even when coordination is obvious.

  2.  **Crux: Prevalence & Impact of Sanction-Readiness:**
      *   **Shared Case:** Observe/document reactions to minor breaches over 2 weeks (e.g., slightly late washing-up, mildly noisy after 11:05, forgetting milk once). Focus on subtle sanctions: sighs, pointed comments, reminders, visible disapproval. Interview members: "If someone repeatedly ignored [pattern], how would you/react would others react? Would you care *because* it's unfair/annoying, or *mainly* because it breaks the coordination?"
      *   **CF Prediction:** Sanctions are infrequent, mild, and primarily driven by the *practical inconvenience* of the breach (coordination failure), not a sense of "wrongness." Most would say they care mainly about the coordination failing.
      *   **NF Prediction:** Sanctions (even subtle) are observable and common. Reactions stem significantly from a sense the rule *ought* to be followed, beyond mere inconvenience. Many would report caring about the breach being "unfair" or "wrong."

  **Analysis of House Cases:**

  1.  **The Laminated Sheet:**
      *   **CF:** This *is* a convention. The sheet is just a focal point replacing the unwritten mutual expectations. Compliance stems from expecting others to follow the visible rota and preferring to coordinate. It's functionally the *same* coordination object as before, just externally stored. The "ought" is weak or derived.
      *   **NF:** This is likely a *weakened* norm or a transition. Compliance is now purely behavioural/habitual, driven by the sheet's visibility, not internalised "ought." The unwritten version had more normative weight ("this is *our* way"). It's a *different*, less robust social object. Sanction-readiness might be lower now.
      *   **Collaboration:** Both agree it works *now* via expectations focused on the sheet. NF argues its normative robustness is reduced.

  2.  **The Phantom Convention:**
      *   **CF:** The false origin story is irrelevant. What matters is the *current* state: a stable pattern everyone expects everyone else to follow. It's a convention regardless of origin myth.
      *   **NF:** The false story *is* crucial. It provides a spurious source of normative legitimacy ("we voted for this, so you *ought* to comply"). Without it, the pattern might be seen as mere habit, potentially weaker. The myth sustains the normative expectation.
      *   **Collaboration:** CF sees the myth as epiphenomenal to the convention's function. NF sees it as actively bolstering the normativity. Settling Crux 1 (survey on "ought" feelings re: quiet hours) is relevant.

  3.  **The Milk:**
      *   **CF:** Can handle it. The "sucker payoff" creates an *assurance problem* alongside coordination. The solution is still a conventional pattern (turn-taking, informal tally) that avoids being the sucker. Fairness *talk* emerges as a way to stabilise this vulnerable coordination equilibrium. The core is still mutual expectations solving a recurring problem.
      *   **NF:** This exposes CF's limits. The "sucker" element inherently involves perceived unfairness – a normative concept. Compliance relies on members feeling they *ought* to take their turn to be fair, and sanctioning free-riders (even mildly). This requires irreducible normativity (fairness/turn-taking norms).
      *   **Collaboration:** CF argues fairness norms *are* conventions solving recurrent problems of distribution. NF argues fairness norms are foundational and distinct. Crux 2 (sanctions & motivations re: milk) is key.

  4.  **Pluralistic Ignorance:**
      *   **CF:** The pattern still *is* a convention. The mutual expectations *exist* (even if based on false beliefs about others' attitudes) and sustain compliance. It remains a coordination equilibrium. The newcomer has no reason *yet*; reason emerges as they form expectations based on observed behaviour.
      *   **NF:** This pattern is *not* a social norm. The crucial normative expectations (belief that others think one *ought* to comply) are absent (everyone resents it) or incorrect. It's sustained by *mistaken* factual expectations about others' normative views. It's a fragile, pathological case. The newcomer has no normative reason to comply.
      *   **Collaboration:** CF maintains it's a convention based on *de facto* expectations driving behaviour. NF argues the lack of genuine normative expectations means it fails as a norm. This case starkly highlights their core disagreement (Agreed Claim 5 & Disagreement 5).

  **Falsifiability & Settlement:**

  *   **CF: What would falsify it?** Evidence that compliance persists robustly *even when* the coordination benefit is removed or negative for most individuals (e.g., everyone keeps locking the door even after it's proven totally unnecessary and slightly annoying), *or* if survey/interviews (Crux 1) show "ought" feelings are primary and independent motivators for core patterns *without* clear coordination benefit.
  *   **NF: What would falsify it?** Evidence that core patterns function identically *without* any trace of "ought" feelings or sanction-readiness, purely on mutual behavioural expectations and individual convenience (Crux 1 & 2 showing minimal "ought" and sanctions driven purely by practical annoyance), *especially* for cases like the milk.
  *   **Could anything settle it?** Both agree **Crux 1 (Survey on "Ought" Feelings)** is the most direct test. If the survey shows "ought" is rarely cited and correlates tightly with coordination expectations, CF is strengthened. If "ought" is frequently cited as a primary, distinct motivator (especially by established members), NF is strengthened. **Crux 2 (Observing Sanctions)** provides supporting evidence. Neither side expects a single knockout blow; it's about the weight of evidence across cases.

  **Joint Recommendation on the Handbook Vote:**

  Both sides agree codifying *everything* risks ossifying fluid practices and potentially undermining the subtle expectations underpinning them (CF: kills organic convention formation; NF: replaces internalised norms with external rules, weakening commitment). **However**, both sides also agree the current breakdown stems from new members lacking the necessary expectations.

  Therefore, the collaboration recommends a **targeted, minimal approach:**

  1.  **Write down ONLY the truly essential "coordination core"** that caused significant problems for new members (e.g., "Quiet hours begin at 11pm", "The last person downstairs locks the back door", "Communal milk: please note your contribution on the tally sheet/rotate weekly").
  2.  **Frame it descriptively, not prescriptively:** Present it as "This is what we generally do to make things run smoothly," not "These Are The Rules." Emphasise it's a record of current practice, not a constitution.
  3.  **Explicitly state the "unwritten constitution" remains:** Include a preamble: "These notes capture some recurring patterns that help us coordinate. Much of how we live together relies on shared understanding and unwritten expectations developed over time – please ask if unsure!"
  4.  **Complement with active onboarding:** Assign "buddies" to new members for the first month to explicitly explain *both* the written basics *and* the unwritten ethos ("People generally do dishes the same day," "We chat in the kitchen but keep it quiet in the halls late").
  5.  **Sunset Clause:** Review the written list in 6 months. Does it help? Is it used? Can parts be retired?

  **Why both sides can sign off:** CF sees this as providing minimal focal points for essential coordination without dictating process. NF sees it as providing necessary normative clarity for newcomers ("This *is* expected") without attempting to codify the entire normative life of the house. Both see active onboarding as crucial for rebuilding the shared expectations – written or unwritten – that make the co-op work. This avoids the risk of a comprehensive handbook freezing the system while directly addressing the new member integration failure.

  **Vote Recommendation:** Advocate for this minimal, onboarding-focused approach as the best chance to preserve the co-op's strengths while solving the immediate problem. Good luck with the meeting!
