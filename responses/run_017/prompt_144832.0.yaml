  They've outlined exactly what they want: 1) agreed claims both sides accept, 2) a disagreements table with dual formulations, 3) cruxes (key questions that could change minds), 4) analysis of four real cases from their co-op, 5) falsifiability conditions for each theory, and 6) a joint recommendation for the handbook vote.

  The four cases are particularly interesting: 
  1) The laminated rota sheet nobody reads but everyone follows - is this the same as the unwritten rule? 
