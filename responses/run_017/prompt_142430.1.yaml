prompt: |-
  hey — I'm TAing a first-year seminar on freedom this term and I want a "which theory of liberty do you actually hold" quiz for the last session. I need the leaves to include negative liberty, positive liberty in both its flavors (self-mastery and the exercise/self-realization kind), Pettit-style non-domination, and the feminist non-subordination cousin, plus up to two more you think belong in the space.

  The whole point is that it should sort students by what they say about cases, not by which label they like, so: no question may mention a theorist or a theory name, and no question may be phrased as "do you think freedom means X". 8–10 questions, each a short concrete case with three answer options — keep the options parallel across questions so the scoring isn't a mess.

  Here's why I'm not just writing it myself. Every version of this I've seen runs the same three warhorses, and they're all easy to answer from vibes. I want the cases to carry the load, so:

  - Set all of them inside one invented institution so they hang together. My idea was a deep-sea research station with a captain who holds formal emergency powers she has never once used, but a tenant co-op run by an allocation algorithm, or a monastery under a rule nobody can amend, might work better — pick one and stick to it for the whole quiz.
  - Build each case to isolate a single parameter. These are the ones I want separated:
    1. interference that actually happens vs. power that is held but never exercised;
    2. whether the power is arbitrary (its holder needn't track your avowable interests) vs. bound to track them — e.g. an administrator who governs well and consults everyone but whose decisions there is no procedure for contesting;
    3. whether the power is cheap for its holder to exercise vs. ruinously costly — is a capacity no one would rationally use still a capacity?;
    4. internal obstacles (compulsion, weakness of will, preferences that adapted to a dominating power) vs. external ones;
    5. interference with an option the agent was never going to take, and the related question whether freedom is a scalar (how wide is the open field) or a status (does anyone stand over you);
    6. whether the agent knows about the power — a monitoring system nobody told you about, and its mirror image, a guard quietly retired years ago whose cameras are still switched on;
    7. structural cases with nobody in charge: the constraint comes from a rule with no author you can point at and no procedure for changing it. Does domination need a dominus?

  Then give me the scoring key as a decision tree rather than a points tally: branch nodes are the parameters above (or better ones if you spot them), leaves are positions, each leaf with one sentence on its most awkward commitment — the thing a defender has to swallow. Work out the tree from the logical space first and then slot the named positions into it, and for the cells nobody occupies, say whether that's because the combination is incoherent, merely unattractive, or just unexplored.

  I also want you to flag where the tree genuinely can't seperate two leaves instead of faking a distinction. My guess is that non-domination and positive liberty converge on the adapted-preferences case and that republicanism splits internally over whether tracking interests is enough or contestability is required, and that a probabilistic or expected-cost version of domination collapses into a maximizing negative-liberty view — but do the work and tell me where you actually get stuck, not where I guessed.

  Students haven't read anything yet, so no names in the quiz itself (names in the key are fine), and keep each case under about 60 words. The key can be as long as it needs to be.
reasoning: |-
  Okay, the user is a TA for a first-year seminar on freedom, and they need a quiz to help students identify their implicit theory of liberty. The quiz must avoid theory names and focus on concrete cases within a single institutional setting. They specified parameters to isolate, like interference vs. power, arbitrariness, cost of exercise, internal vs. external obstacles, etc. 

  First, I need to pick a setting that's engaging and allows for varied scenarios. A deep-sea research station sounds perfect—it's contained, has clear authority structures (Captain Vega with emergency powers), and potential for unique constraints like oxygen limits or surveillance systems. It's more relatable than a monastery or algorithm-run co-op for first-years. 

  Next, the parameters. The user listed seven key distinctions. I'll map each to a quiz question, ensuring the options are parallel (A/B/C) across all questions. For example: 

  - Q1 tackles actual interference vs. latent power (parameter 1). Scenario: Captain doesn't intervene but has unchecked power. Options focus on whether the power's existence matters. 

  - Q2 deals with arbitrariness (parameter 2). Captain makes good decisions but can't be challenged. Does due process matter if outcomes are benign? 

  - Q3 tests cost of exercising power (parameter 3). Emergency power is too expensive to use—is it still a threat? 

  - Q4 probes internal vs. external obstacles (parameter 4). Scientist avoids the lab due to trauma—is that a freedom issue? 

  - Q5 addresses non-preferred options and scalar vs. status freedom (parameter 5). A blocked exit no one uses—does it reduce freedom? 

  - Q6 examines knowledge of power (parameter 6). Secret surveillance vs. fake cameras—does awareness change things? 

  - Q7 explores structural domination sans dominus (parameter 7). Unchangeable station rules—can rules themselves be dominating? 

  - Q8 adds adapted preferences (implied in parameter 4). Chef tolerates bad conditions—is she free if she doesn't resist? 

  For the scoring tree, I'll start from the parameters logically. First branch: does freedom require no interference (negative) or something more? If "more," split into capacity/self-mastery (positive) vs. relational status (non-domination). Then drill down—e.g., for non-domination, does power need to be arbitrary? Contestable? Known? 

  Noticing tricky spots: 
  - Non-domination and positive liberty both care about adaptive preferences (Q8), so they'll converge there. 
  - Pettit's contestability vs. tracking interests: the tree forces a choice, but real theorists might blend them. 
  - The "ruinously costly power" case (Q3) might not cleanly separate views—everyone agrees it's not domination if unusable. 

  For the key, I'll assign positions to leaves, noting awkward commitments. E.g., negative liberty must say the benevolent dictator isn't limiting freedom—a hard sell. Feminist non-subordination insists structural rules can dominate without a person, which some find vague. 

  Finally, keeping cases under 60 words: "Captain Vega has unused emergency powers" sets up Q1 in 14 words. Options are snappy: A (only interference matters), B (power itself restricts), C (only if arbitrary). 

  User's deeper needs: They want students to *feel* the tensions between theories, not just memorize labels. The institutional narrative (research station) makes it stick. Also, they’re avoiding "vibes"-based quizzes, so precise parameter isolation is key. Unspoken: They likely want debate fuel for the last session—hence highlighting "awkward commitments" for each theory.
answer: |-
  Here’s a quiz set on **Aquatica Station**, a deep-sea research habitat, designed to isolate your parameters with parallel answer choices. Each case is <60 words, and all options are phrased as opinions an occupant might hold. The scoring tree follows, mapping logically to theories and flagging tensions.

  ---

  ### **The Aquatica Station Quiz**  
  *Answer each scenario with which statement you agree with most:*  
  **A:** *"This restricts my freedom."*  
  **B:** *"This doesn’t restrict my freedom, but it’s unjust/oppressive."*  
  **C:** *"This doesn’t affect my freedom at all."*  

  1. **Unused Power**  
     Captain Vega can override any decision using emergency powers, but she never has. Her authority is absolute and unchecked.  
     *A / B / C*  

  2. **Benevolent Dictator**  
     Vega always consults the crew and acts in their best interests, but there’s no way to challenge her decisions. Everyone agrees she’s fair.  
     *A / B / C*  

  3. **Costly Intervention**  
     Vega’s emergency powers require unanimous crew approval to activate—a near-impossible hurdle. She couldn’t use them even if she wanted to.  
     *A / B / C*  

  4. **Internal Barrier**  
     Dr. Eli avoids Lab 3 due to past trauma there. The lab is open to all, but Eli’s anxiety makes entering unthinkable.  
     *A / B / C*  

  5. **Blocked Exit (Unused)**  
     A critical escape hatch is welded shut by station protocol. No one has *ever* needed it, and alternatives exist.  
     *A / B / C*  

  6. **Secret Surveillance**  
     Hidden cameras monitor all corridors (unknown to crew). Vega never watches feeds, but they *could* be accessed.  
     *A / B / C*  

  7. **Ghost Protocol**  
     Cameras *appear* active but were disconnected years ago. Everyone believes they’re monitored.  
     *A / B / C*  

  8. **Unchangeable Rule**  
     Station oxygen limits are set by an unmodifiable algorithm from the surface. No one, including Vega, can alter them.  
     *A / B / C*  

  9. **Adapted Preferences**  
     Chef Riya works 16-hour days by "choice," believing it’s noble. Crew shortages mean refusing could collapse operations.  
     *A / B / C*  

  ---

  ### **Scoring Key: Decision Tree**  
  *(Leaves: Negative Liberty, Positive Liberty [Self-Mastery], Positive Liberty [Self-Realization], Non-Domination [Pettit], Feminist Non-Subordination)*  

  ```mermaid
  graph TD
      Q1[Q1: Actual Interference vs. Latent Power] -->|A| Q2
      Q1 -->|B or C| Q4
      Q2[Q2: Arbitrary Power?] -->|A| Q3
      Q2 -->|B or C| PositiveLiberty
      Q3[Q3: Costless to Exercise?] -->|A| NonDomination
      Q3 -->|B or C| NegativeLiberty
      Q4[Q4: Internal Barriers Restrict Freedom?] -->|A| PositiveLiberty
      Q4 -->|B or C| Q5
      Q5[Q5: Blocked Unused Option Restricts?] -->|A| Q6
      Q5 -->|B or C| NegativeLiberty
      Q6[Q6: Structural Domination? Q8] -->|A| FeministNonSub
      Q6 -->|B or C| NonDomination
      Q7[Q7: Knowledge Matters? Q6 vs. Q7] -->|Different Answers| NonDomination
      Q7 -->|Same Answers| NegativeLiberty
      Q8[Q9: Adaptive Preferences] -->|A| PositiveLiberty
      Q8 -->|B or C| NonDomination
  ```

  ### **Theories & Their "Awkward Commitments"**  
  1. **Negative Liberty (Berlin)**  
     *Freedom = no actual interference with choices.*  
     **Awkward:** Must deny Vega’s unused power (Q1), benevolent rule (Q2), or secret surveillance (Q6) restricts freedom.  
     *Branch:* Q1→B/C; Q4→B/C; Q5→B/C  

  2. **Positive Liberty: Self-Mastery**  
     *Freedom = overcoming internal barriers to rational self-direction.*  
     **Awkward:** Must say Eli’s trauma (Q4) *does* restrict freedom, but Vega’s absolute power (Q1) does *not*.  
     *Branch:* Q4→A; Q8→A; Q1→B/C  

  3. **Positive Liberty: Self-Realization**  
     *Freedom = conditions to fulfill your potential/social role.*  
     **Awkward:** Must say Chef Riya’s "choice" (Q9) isn’t free due to background pressure, but welded exits (Q5) might not matter if unused.  
     *Branch:* Q9→A; Q5→C; Q2→A/B  

  4. **Non-Domination (Pettit)**  
     *Freedom = no arbitrary power over you, regardless of use.*  
     **Awkward:** Must say Vega’s costly power (Q3) doesn’t dominate, but unchangeable algorithms (Q8) might if arbitrary.  
     *Branch:* Q1→A; Q2→A; Q3→B/C; Q6→A; Q7→A/B  

  5. **Feminist Non-Subordination**  
     *Freedom = absence of systemic subordination, even without a dominus.*  
     **Awkward:** Must say oxygen algorithms (Q8) *are* dominating, but disconnected cameras (Q7) might not be if belief in monitoring causes no harm.  
     *Branch:* Q8→A; Q6→A; Q7→B/C  

  ---

  ### **Key Tensions & Incoherencies**  
  - **Non-Domination vs. Positive Liberty (Q9):** Both say Chef Riya is unfree (adaptive preferences). *Tree forces separation via Q4/Q5.*  
  - **Pettit’s Internal Split:** Q2 isolates "tracking interests" (B/C) vs. "contestability" (A). Real-world republicans vary here.  
  - **Costly Power (Q3):** All theories *except* rigid Negative Liberty say unusable power isn’t threatening (→B/C).  
  - **Structural Domination (Q8):** Feminist Non-Subordination uniquely requires no *dominus* (A on Q8). Pettitians may split.  
  - **Knowledge (Q6 vs. Q7):** Negative Liberty collapses these (freedom unaffected by unknown/unreal power). Others distinguish.  

  **Unoccupied Cells:**  
  - "Belief in power matters, but latent power doesn’t" (e.g., Q7→A + Q1→C): Incoherent—if perceived power restricts, actual power should too.  
  - "Internal barriers restrict freedom, but structural rules don’t": Logically possible but unattractive (no major theory holds this).  

  ---

  ### **How to Use**  
  1. Students answer A/B/C for each scenario.  
  2. Tally responses per question.  
  3. Use the tree to assign each student’s *pattern* to a theory.  
  4. Discuss "awkward commitments" to highlight trade-offs.  

  This forces engagement with the *logic* of freedom, not labels. The Aquatica frame ensures coherence, and parallel options simplify scoring. Let me know if you need a printable version!
