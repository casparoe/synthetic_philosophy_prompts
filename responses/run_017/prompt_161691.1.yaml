prompt: |-
  I've been asked to run a sealed-bid tender for the organisation I work for, and I've been spending what spare time I have on the mechanics of how such things are supposed to work. Our format is the ordinary one: suppliers submit sealed bids, the lowest bid wins, and the winner is paid its own bid. There is an alternative format that textbooks like, in which the lowest bidder still wins but is paid the runner-up's price; there, quoting your true cost is the sensible thing to do whatever you happen to believe about your rivals, whereas in our format a supplier has to bid some way above its own cost, and by how much depends on how many rivals it faces and on what it expects those rivals to do. Real tenders almost never use the other format.

  What I can't get straight is what our format presupposes about the bidders. Taken at face value it seems to need a great deal: not merely that each supplier knows its own costs, but that each has a view about the others' costs, a view about the others' views, and so on upward — and, further, that they all in some sense share a single picture of the spread of costs they are drawing from, so that whatever disagreement exists among them is really just a difference in private information. It also strikes me as odd that we seal the bids and forbid the bidders from talking to one another, thereby destroying mutual knowledge, while the predictions we rely on seem to need that mutual knowledge; and that our own rules let me reject a bid for being implausibly cheap, as though a supplier offering a very low price must be mistaken about its own costs, even though finding out who genuinely has the lowest costs was the whole purpose of the exercise.

  I'd like you to reconstruct the implicit theory of rationality and mutual knowledge that this practice rests on, and to tell me which parts the practice strictly presupposes and which it merely sits comfortably with. Could the same practice be licensed by a view on which suppliers are risk-averse, or one on which they reason only a step or two about each other rather than reasoning to a fixed point, or one on which they learn across repeated tenders instead of working anything out in advance? Where is the choice of format philosophically underdetermined — where would several quite different theories of bidder rationality all tell me to carry on exactly as we do? And what would concretely have to change in how we run the tender if I stopped assuming common knowledge of rationality: for instance, if I announced in advance that every bid would be published afterwards, or if I knew that one regular supplier always bids its true cost?

  Please argue from the structure of the situation rather than from the literature — I want your own reconstruction, not references — and write the answer in British English.
reasoning: |-
  Okay, the user is running a sealed-bid tender where the lowest bid wins and gets paid its own bid. They're confused about the assumptions behind this format, especially regarding bidder rationality and mutual knowledge. They mentioned the Vickrey auction as an alternative but noted it's rarely used. 

  First, I need to unpack the implicit assumptions in their current format. The user is spot on about requiring bidders to know their own costs and have beliefs about others. But how deep does this rabbit hole go? Common knowledge of rationality seems crucial here - everyone knows everyone is rational, knows that others know, and so on. Without this, bidders might not converge to equilibrium strategies. 

  The user's observation about sealed bids destroying mutual knowledge is fascinating. By keeping bids private, we're preventing collusion but also removing common knowledge of actions. Yet the equilibrium relies on common knowledge of beliefs. That's quite a tension they've identified. 

  Their point about rejecting implausibly cheap bids is particularly interesting. This practice suggests we don't fully trust the rationality assumption - we're acknowledging bidders might make mistakes or be irrational. So in practice, the organization is already hedging its bets on common knowledge of rationality.

  Now for their specific questions: Could risk aversion change things? Absolutely. Risk-averse bidders would shade bids even higher. Limited strategic thinking? If bidders only reason one step ahead ("others will bid true costs"), they might bid less aggressively. Learning over time? That could replace upfront rationality assumptions with experience. 

  The underdetermination point is key. Many different assumptions could lead to similar bidding behavior in practice. For example: whether bidders have common priors or not, whether they're perfectly rational or learn through repetition - all might produce similar bid distributions. 

  Practical changes if we drop common knowledge of rationality: Publishing bids afterwards would create common knowledge of actions, enabling collusion. A supplier bidding true cost would disrupt equilibrium - others would bid just below them. 

  The user seems deeply thoughtful about the philosophical underpinnings while needing practical guidance. They're not just asking for textbook answers but want to understand what their specific practices imply. I should honor that by focusing on situational logic rather than citations.
answer: |-
  Your sealed-bid tender rests on an intricate, often unspoken, edifice of assumptions about bidder rationality, knowledge, and strategic interaction. Let's reconstruct the implicit theory and examine its flexibility.

  **The Implicit Theory: Common Knowledge, Rationality, and Equilibrium**

  1.  **Private Cost Knowledge:** Each bidder *knows its own cost* (`c_i`) to fulfil the contract. This is the bedrock assumption and is strictly presupposed. Without it, bidding becomes arbitrary.

  2.  **Instrumental Rationality:** Each bidder aims solely to maximise its expected profit (`(b_i - c_i) * Pr(win | b_i)`). This narrow self-interest is strictly presupposed. Altruism or sabotage invalidates the model.

  3.  **Mutual Knowledge of Rationality (MKR):** Not only is each bidder rational, but each *knows* the others are rational, each *knows that others know* they are all rational, and so on, ad infinitum. This **common knowledge of rationality (CKR)** is fundamental. Without it, predicting others' behaviour becomes intractable. You cannot rely on them reasoning strategically "like you" if you doubt *they* believe others reason strategically.

  4.  **Common Prior & Beliefs about Competition:**
      *   **Common Prior Assumption (CPA):** Bidders share a single, common probabilistic belief (a "prior") about how costs (`c_i`) are distributed among potential bidders (e.g., "costs are drawn independently from distribution F(c)"). This is *highly significant* but potentially relaxable.
      *   **Mutual Knowledge of CPA:** Crucially, it's not just that costs *are* drawn from F(c), but that *all bidders know this*, *all know that all know*, etc. – it's common knowledge. This shared understanding of the "rules of the game" (the cost distribution) is essential for forming consistent beliefs.
      *   **Known Number of Rivals (`n`):** Bidders know (or strongly believe) how many competitors (`n`) they face. This `n` heavily influences bid shading. Knowing `n` is common knowledge is often assumed.

  5.  **Bayesian Updating & Equilibrium:** Given CKR, CPA, and known `n`, each bidder forms a subjective belief about rivals' costs *conditional on their own cost*. They calculate the optimal bid (`b_i*`) that maximises expected profit, anticipating rivals are doing the same. The solution is a **Bayesian Nash Equilibrium (BNE)** – a set of bidding strategies (functions mapping cost `c_i` to bid `b_i`) where each is optimal given the others. Your practice implicitly assumes bidders find (or approximate) this BNE.

  **The Sealing Paradox & Implausible Bids**

  *   **Sealing Bids:** This prevents collusion and *common knowledge of actions*. Crucially, the model relies on *common knowledge of beliefs* (about the cost distribution and rationality), not common knowledge of bids. Sealing ensures bids are private actions informed by private costs, forcing bidders to act on their *beliefs* about others, which is central to the strategic calculation. Destroying mutual knowledge of *actions* is necessary for the non-cooperative equilibrium.
  *   **Rejecting Implausibly Low Bids:** This reveals a practical crack in the theoretical facade. The BNE model assumes bidders perfectly know their costs and bid rationally *given those costs*. Rejecting a low bid implies:
      1.  You doubt the bidder's *rationality* ("they must have miscalculated costs/profit").
      2.  You doubt the *common prior* ("such a low cost is impossible given our shared understanding F(c)").
      3.  You fear non-performance (which the pure model often ignores).
      This practice hedges against the model's strict assumptions failing in reality, acknowledging that bidders *might* be mistaken or irrational, or that the CPA is flawed.

  **Where the Practice is Philosophically Underdetermined (Flexible Assumptions)**

  The *observed behaviour* (bidders shading bids above cost) can emerge from several different underlying rationalities, making the *strict* CKR/CPA/BNE framework sufficient but not always necessary:

  1.  **Risk Aversion:** A risk-averse bidder fears losing money more than a risk-neutral one values high profits. They will shade their bid *higher* than the risk-neutral BNE bid to increase their chance of winning at a safer margin. The practice (lowest wins, pays own bid) sits comfortably with risk aversion; it might even produce *more* revenue for you than the risk-neutral BNE. You don't strictly *need* risk neutrality.
  2.  **Limited Strategic Depth (Level-k Reasoning):** Suppose bidders aren't infinite thinkers. A "Level-0" bidder might naively bid cost. A "Level-1" bidder assumes others are Level-0, so bids just below the *expected cost* of rivals. A "Level-2" bidder assumes others are Level-1, and so on. Depending on the prevalent "level", bids will shade above cost, potentially converging *towards* the BNE without requiring full common knowledge of rationality or infinite regress. Your format can function with this bounded rationality.
  3.  **Learning via Repeated Play:** Bidders don't need to compute the BNE upfront if they participate in many similar tenders. Through trial, error, and observation (e.g., seeing who wins roughly how often), they can learn approximately optimal bidding strategies. The practice is robust to this; the "theory" is learned empirically rather than deduced. Common knowledge of the *game structure* (rules, typical competition) facilitates this learning, but full CKR/CPA upfront is not strictly necessary.

  **Concrete Changes if Dropping Common Knowledge of Rationality (CKR)**

  Dropping CKR fundamentally alters the strategic landscape:

  1.  **Publishing All Bids Afterwards:**
      *   **Problem:** This creates **common knowledge of actions** over time. Bidders see exactly what others bid. This enables tacit collusion ("folk theorems"). In future tenders, bidders can punish deviations from collusive high bids. It *destroys* the non-cooperative, competitive logic of the sealed bid.
      *   **Change Required:** Publishing bids makes collusion sustainable. To counteract this, you'd need *much* stronger anti-collusion measures (e.g., randomised bidder pools, changing specifications frequently) or accept higher prices. The core "lowest sealed bid wins" logic becomes vulnerable.

  2.  **A Known "True-Cost" Bidder (Supplier X bids `b_x = c_x`):**
      *   **Problem:** This violates CKR (Supplier X isn't bidding strategically). It also gives rivals *public, focal information*.
      *   **Impact & Required Change:** Rational rivals *will* exploit this. If Supplier X's true cost `c_x` is known or can be estimated, rivals will bid *just below* `c_x` (if profitable). Supplier X almost never wins. This distorts the bidding:
          *   **Known `c_x`:** Rivals bid `min(b_i*, c_x - epsilon)`. The winner is paid just below `c_x`, regardless of their own cost. Outcomes become highly dependent on Supplier X's cost.
          *   **Unknown `c_x` (but known they bid it):** Rivals treat `c_x` as a random variable. They bid more aggressively (lower) overall than in the full CKR/BNE case because they know *someone* (Supplier X) isn't shading bids. The winner's payment is lower than in the standard BNE.
      *   **Implication:** The presence of a non-strategic player disrupts the equilibrium predictions. Your award price becomes more volatile and dependent on Supplier X's specific cost. Philosophically, it breaks the symmetry and shared strategic understanding. You might need to exclude such a supplier or accept that your pricing mechanism is no longer targeting the standard BNE outcome.

  **In Essence**

  Your tender format strictly presupposes **private cost knowledge** and **instrumental rationality**. It fundamentally relies on **common knowledge of rationality (CKR)** and a **shared understanding of the competitive landscape** (often formalised as a Common Prior and known `n`) to generate predictable bid shading via a Bayesian Nash Equilibrium (BNE).

  However, the *practice* of bidders shading bids above cost is **philosophically underdetermined**. It emerges robustly under:
  *   The "ideal" CKR/CPA/BNE model.
  *   Models with risk aversion (producing higher bids).
  *   Models with bounded strategic reasoning (Level-k).
  *   Models with learning over repeated tenders.

  The format is *less robust* to violations of CKR that introduce public focal points (like a known true-cost bidder) or that enable the construction of common knowledge of past actions (like publishing all bids), as these fundamentally alter the strategic incentives and can facilitate collusion or unpredictable distortions. Rejecting implausibly low bids is a pragmatic admission that the idealised assumptions of perfect cost knowledge and strict rationality sometimes fail in practice.
