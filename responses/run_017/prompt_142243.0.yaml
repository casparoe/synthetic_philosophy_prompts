prompt: |-
  Our reading group (me, two philosophy grad students, and one computer science postdoc who refuses to be called a philosopher) has spent basically a whole semester stuck on the causal exclusion argument, and Im the one who has to write up where we got to. Two of us have calcified into positions. Dev thinks mental properties are perfectly ordinary causes and that the exclusion argument only looks forceful because it quietly assumes causation is a single, one-relation, all-or-nothing affair: hes happy with a difference-making, contrastive, interest-relative picture and says the argument slides between a cause being sufficient for its effect in the circumstances and its being the only thing that mattered. Nina thinks the argument is basically sound: she agrees mental properties are real, irreducible, and not epiphenomenal in the silly sense, but she holds that the causal work on any occasion is done by whatever physical property realizes the mental one, and that any claim the mental has to being a cause is inherited from that rather than being an independent contribution. They have been talking past each other for months and I want a document both of them could actually sign.

  Here is the case we keep coming back to, so please use it too (and do say where its underspecified). Mira is deciding whether to sign a petition. She has an occurrent desire to sign, call it M, which on this occasion is realized by neural state P. P is causally sufficient, in the circumstances, for her hand moving in the signing way; it produces that effect through a route that involves no further mental state; and there is no separate, independent cause of the signing hanging around waiting to be an overdeterminer. Nina says: P caused the signing, M did not cause it, though M is what makes the cause the kind of cause it is and what makes the story about the signing intelligible. Dev says: both M and P caused it, because Mira signed because she wanted to is true, the counterfactuals about her wanting to sign line up exactly with the counterfactuals about P, and demanding an extra bit of independent causal oomph over and above the counterfactual and pattern structure is a picture rather than an argument.

  What I want from you is their joint statement. First, a numbered section of claims both of them can sign without wincing: about causal closure; about whether overdetermination is even the right model of what the mental cause would have to be; about whether the mental property and the physical property are distinct properties even when the event is the same; about whether causation is contrastive or explanation-relative or level-relative; and about what is actually at stake here (agency, causal explanation, moral responsibility, the intelligibility of action explanations). Second, a table of the residual disagreements, one row each, where every claim is phrased the way the side that holds it would phrase it for itself, with the other sides restatement of the same row next to it so I can see whether they are disagreeing or just describing the same thing differently. Third, the cruxes: the sub-questions such that settling one would move at least one of them. For each crux, give a case, test, or argument both would accept as genuinely bearing on it, and write down in advance what Dev predicts and what Nina predicts about how it comes out, so they cant quietly reinterpret the result later.

  Some cruxes I suspect are load-bearing, but use the better ones if you see them: (a) whether a cause has to be something you could in principle intervene on independently of its realizer, where Nina thinks no intervention on M that leaves P fixed is even coherent and Dev thinks that just shows interventionism was the wrong theory of causation; (b) the generality problem, since the same style of argument seems to threaten droughts, recessions, the structural flaw in a bridge and the fragility of a wine glass, so Nina owes us either an eliminativism about all special-science causation or a principled place to stop; (c) proportionality, where if causes must be proportional to their effects then the threat to M sometimes comes from below, because P is more fine-grained, and sometimes from above, because the mental description is the one at which the pattern is stable across Miras possible neural variation, and I want to know whether both sides accept proportionality as a constraint at all and which way it cuts; (d) whether causal relevance can come in degrees, or be a kind of bookkeeping, so that Ms causal status is vindicated by the fact that we can only predict, plan and act under mental descriptions, or whether that is a pragmatic and explanatory vindication that leaves the metaphysical question exactly where it was; (e) the CS postdocs intervention, which both of them hated: consider a molecule-for-molecule duplicate of Mira whose P-type state plays exactly the same causal role in producing the signing but whose state has no content at all, or has different content, and ask whether the causal work tracked the content or the vehicle. Work that case in if it is worth anything and tell me what each side should predict about it. Finally, flag any part of their dispute you think is merely verbal, whether about cause or distinct or sufficient, and say what is left once that is cleared away. Please dont adjudicate or tell me who is right, and skip anything like citations or further reading: we have read the literature to death and I need something I can hand to both of them at the start of next term.
reasoning: |-
  Okay, the user has a reading group stuck on the causal exclusion argument. They've been debating for a whole semester, and now the user needs to write up where they got to. Two members, Dev and Nina, have entrenched positions. Dev thinks mental properties are causes in a contrastive, interest-relative framework, while Nina argues that only physical realizers do the causal work, with mental properties providing intelligibility. The user wants a joint statement both can sign, a table of disagreements, and cruxes with testable predictions.

  First, I need to identify common ground. Both agree on causal closure of the physical: no gaps in physical causation. Overdetermination isn't the right model; simultaneous independent causes are rare. Mental and physical properties are distinct but co-instantiated. Causation might be contrastive or level-relative. The stakes involve agency, explanation, and moral responsibility. These points should form the basis of the joint statement without triggering objections.

  Next, the disagreements table. Dev's view: M causes the signing through counterfactual dependence. Nina: only P causes it; M's role is explanatory. The cruxes are critical here. For instance, interventionism: Nina thinks intervening on M without changing P is incoherent, while Dev rejects interventionism as a theory. The generality problem: Nina must either reject special-science causation or find a stopping point. Proportionality: if causes must match effects in granularity, does that favor M or P? Degrees of relevance: is causal status metaphysical or pragmatic? The molecule duplicate case tests whether content or vehicle matters causally.

  I should structure the cruxes with cases and predictions. For the duplicate case, Nina predicts identical causal outcomes since physical realizers are the same, denying content's causal role. Dev argues that without content, the description "signing because she wanted to" fails, showing M's causal relevance. Both might agree the physical process is identical but disagree on causation's description-sensitivity.

  Flagging verbal disputes is key. "Cause" might be ambiguous between production and difference-making. "Distinct properties" could mean token-identity versus type-distinction. Once clarified, the real disagreement is whether M has causal efficacy beyond explanation. The user needs neutrality, so presenting both sides without judgment is essential. Ensuring the document is usable for next term means clarity and conciseness, avoiding literature references as requested.
answer: |-
  ### Joint Statement: Points of Agreement  
  1. **Causal Closure of the Physical**:  
     In Mira’s case, the physical state \(P\) is causally sufficient for her signing, and there are no gaps in the physical causal chain. No non-physical "extra" force is needed for the effect.  

  2. **Overdetermination is Misapplied**:  
     Overdetermination (two *independent* sufficient causes) is not the right model. \(M\) and \(P\) are not independent; \(M\) supervenes on \(P\). If \(M\) has causal status, it’s not via brute overdetermination.  

  3. **Distinct Properties, Same Event**:  
     \(M\) (the desire) and \(P\) (its neural realizer) are distinct properties, but they are instantiated by the same event (Mira’s occurrent state). \(M\) cannot vary without \(P\) varying in this context.  

  4. **Causation is Contrastive & Interest-Relative**:  
     Causal claims depend on contrasts (e.g., "signing vs. not signing") and explanatory interests. Saying "\(M\) caused the signing" answers why she signed *rather than abstained*, while "\(P\) caused it" answers how the signing occurred at the physical level.  

  5. **Stakes: Agency, Explanation, Responsibility**:  
     What’s at stake is whether mental causation is essential for:  
     - **Agency**: Treating actions as responses to reasons.  
     - **Explanation**: Making behavior intelligible (e.g., "she signed *because* she wanted to").  
     - **Moral Responsibility**: Holding agents accountable for actions *under mental descriptions*.  

  ---

  ### Table of Residual Disagreements  
  | Dev’s Position (Difference-Making) | Nina’s Position (Causal Inheritance) |
  |------------------------------------|-------------------------------------|
  | **1. Causation of the signing**: <br> *"\(M\) caused the signing because ‘Mira signed because she wanted to’ is true, and \(M\) makes a difference to the effect: if \(M\) were absent (and \(P\) changed accordingly), she wouldn’t have signed."* | **1. Causation of the signing**: <br> *"\(P\) caused the signing; \(M\) did not. \(M\)’s causal relevance is inherited from \(P\): it explains *why* \(P\) had this effect, but adds no independent causal power."* |
  | **2. Causal Ontology**: <br> *"Causation is not a monolithic ‘oomph’ but a pattern of counterfactual dependencies. \(M\) and \(P\) both cause the effect under different descriptions, with identical counterfactual profiles."* | **2. Causal Ontology**: <br> *"Causal work is done by physical properties. \(M\)’s counterfactual patterns are parasitic on \(P\)’s; they reflect explanation, not additional causation."* |
  | **3. Epiphenomenalism**: <br> *"Denying \(M\)’s causal role *undermines agency*: if desires don’t cause actions, we lose reason-based explanation."* | **3. Epiphenomenalism**: <br> *"\(M\) isn’t epiphenomenal: it provides indispensable explanations, but its *explanatory* role doesn’t entail *metaphysical* causation."* |

  ---

  ### Cruxes: Tests and Predictions  
  **Crux (a): Independent Intervenability**  
  - **Test**: Imagine an intervention that changes Mira’s desire (\(M\)) to a different desire \(M*\) (e.g., to *not* sign), while holding \(P\) fixed. Is this coherent?  
    - **Nina predicts**: Incoherent. \(M\) supervenes on \(P\); you can’t change \(M\) without changing \(P\). If \(P\) is fixed, \(M\) cannot vary.  
    - **Dev predicts**: Coherent only as a *conceptual* test. If interventionism requires this, interventionism is flawed. Causation is difference-making, not intervention-dependent.  

  **Crux (b): Generality Problem**  
  - **Test**: Does Nina’s view eliminate "the drought caused the famine" or "the bridge’s fragility caused its collapse"?  
    - **Nina predicts**: Special-science causes are *explanatory shortcuts* for physical complexes. They’re real patterns but causally inert; only their physical realizers do causal work.  
    - **Dev predicts**: If droughts/fragility aren’t causes, we lose actionable explanations. Difference-making *is* causation; Nina’s view collapses into eliminativism.  

  **Crux (c): Proportionality**  
  - **Test**: Which cause is "proportional" to the signing? \(P\) (specific neural state) or \(M\) (general desire)?  
    - **Nina predicts**: \(P\) is proportional; it’s maximally specific to the effect. \(M\) is too coarse-grained.  
    - **Dev predicts**: \(M\) is proportional; it captures the *invariant* pattern (Mira signs across neural variations, but not without \(M\)).  

  **Crux (d): Degrees of Causal Relevance**  
  - **Test**: Can \(M\) be "partly" causal? E.g., does it explain variance in signing *better* than \(P\) in some contexts?  
    - **Dev predicts**: Yes. \(M\) predicts signing across neural realizers; \(P\) is noisy/overly specific. Causal relevance is graded.  
    - **Nina predicts**: No. Causal work is binary (done/not done by \(P\)). \(M\)’s predictive power is explanatory, not causal.  

  **Crux (e): Mira’s Duplicate (Content vs. Vehicle)**  
  - **Test**: Mira’s physical duplicate has \(P\) but no desire (content is absent or different). Both produce signing. Does "desire" explain the duplicate’s signing?  
    - **Nina predicts**: Yes, identically. Causal work is tracked by \(P\) (vehicle), not content. Content is explanatorily useful but causally idle.  
    - **Dev predicts**: No. Without content, "she signed because she wanted to" is false. The duplicate’s signing has no *mental cause*; content is difference-making.  

  ---

  ### Flagged Verbal Disputes  
  - **"Cause"**: Dev uses it for difference-making; Nina for physical production. Clearing this shows their core disagreement is whether causation *includes* counterfactual/explanatory patterns.  
  - **"Distinct properties"**: Both agree \(M ≠ P\), but Nina sees this as implying causal competition; Dev does not.  
  - **"Sufficient"**: Nina: \(P\) is causally sufficient; Dev: \(M\) is sufficient *for the contrastive effect*.  
  - **Residual Issue**: Whether mental properties have **causal efficacy beyond explanatory utility**.  

  ---  
  **Output Format**: This document is ready for signatures. Joint statement (§1–5) establishes common ground. Table (§6) clarifies disagreements neutrally. Cruxes (§7) offer testable predictions to unstick debate. Verbal disputes (§8) are flagged to prevent talking past each other. No citations/adjudication included.
