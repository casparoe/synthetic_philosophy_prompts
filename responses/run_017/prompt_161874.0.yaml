prompt: |-
  I'm a third-year undergraduate in a seminar on democratic theory, and I've been asked to lead one 80-minute session for about eighteen classmates on the boundary problem — the difficulty that any vote presupposes a settled answer to who is entitled to vote, while every proposed answer to that seems itself to have been settled by somebody, and so on down. I want them to run into it rather than hear it from me: no lecture up front, and the name of the problem shouldn't be said until the debrief.

  My rough plan, which I'd like you to design properly or replace: the group has to make one genuinely binding but small decision (how we use the final seminar, plus roughly twenty-five euros of leftover course money for food), and before that they must decide who counts, by a vote held under a franchise I assign arbitrarily and in advance — say, only students whose surnames fall in the first half of the alphabet, or only those dealt a marked card on arrival. They should then propose and vote on a principled rule of their own and only discover afterwards that any rule they accept has to be applied to the choice of the rule. Partway through I'll hand them a second, wider decision — one that would bind the whole department or next year's cohort — so that they have to recompute the franchise from scratch and notice that the demos seems to shift with the decision rather than being a fixed group of people.

  One principle of my own that I'd like the activity to put pressure on: membership graded by whether the decision changes what a person can do, the set of options available to them, rather than by how well off they end up. I want that tested against the two familiar ones — everyone whose interests are affected, and everyone who will be subject to the decision's enforcement — including the cases where it diverges from them.

  Please give me the rules, materials, card or role assignments, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the regress, the decision-relativity of the demos, and the differences among the three principles. Tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about what the activity cannot reproduce and I will have to say myself — I suspect, among other things, that real boundaries are closed by territory, force and constitutional settlement before anyone gets to vote on them, and that walking out is available in a classroom in a way it is not in a state.

  End with a single last line beginning Activity in one sentence:
reasoning: |-
  We are designing an 80-minute session for a third-year undergraduate seminar on democratic theory. The goal is to have students encounter the boundary problem (the question of who should be included in the demos) through an experiential activity without initially naming it. The session will have a binding decision on a small matter (use of final seminar and leftover money) and then a wider decision that affects a larger group. We will also test three principles of membership: 
   1. Affected interests (everyone whose interests are affected)
   2. Subject to enforcement (everyone subject to the decision's enforcement)
   3. Change in options (membership graded by whether the decision changes what a person can do, the set of options available to them)

   The activity will have the following structure:
   - No lecture at the start.
   - Students are arbitrarily assigned to an initial franchise (e.g., by surname or marked cards).
   - They first vote on the franchise rule for the small decision.
   - Then they make the small decision (with the franchise they just set).
   - Then they are given a wider decision (affecting the department or next year's cohort) and must set a franchise rule again, but now they may notice the demos shifts with the decision.
   - Finally, a debrief where the boundary problem is named and discussed, including the three principles.

   We'll design the activity to run in 80 minutes as follows:

   **Materials:**
   - Index cards (one per student) - some marked for the initial franchise, others blank.
   - A flip chart or whiteboard for recording proposals and votes.
   - A timer.
   - Envelopes with role assignments for the wider decision (optional, if we want to simulate non-present stakeholders).
   - About 25 euros in cash (or a symbolic representation) for the small decision.

   **Setup:**
   - Before class, prepare:
     * Marked cards: For 18 students, mark 9 cards with a star (or any mark) to represent the initial arbitrary franchise. Alternatively, use the first half of the alphabet for surnames. We'll choose the card method for more randomness and to avoid sensitivity about names.
     * Envelopes with roles for the wider decision (if using): These will represent absent stakeholders (e.g., next year's students, department staff). Each envelope has a description of a stakeholder and how the decision affects them.

   **Timeline (80 minutes total):**

   **Part 1: Introduction and Initial Franchise (10 minutes)**
   - 0:00 - 0:05: (5 min) Welcome and setup. Explain that today's session will involve making a real decision about the final seminar and the leftover course money (approx. 25 euros). The decision will be binding. Hand out one index card to each student as they enter (9 marked, 9 unmarked, shuffled). Do not explain the mark yet.
   - 0:05 - 0:10: (5 min) Announce: "Before we make the decision about the seminar and money, we must decide who gets to vote on this matter. The rule for voting today is: only those who have received a marked card may vote on the franchise rule and the subsequent decision." Reveal the mark (e.g., a star) and ask the marked-card holders to raise their hands. Count them (9). Explain that the unmarked card holders (9) are not allowed to vote at this stage.

   **Part 2: Proposing and Voting on a Franchise Rule (20 minutes)**
   - 0:10 - 0:15: (5 min) Task: The voting members (marked-card holders) must now propose and vote on a principled rule for who should be included in the demos for the upcoming decision about the seminar and money. They can propose any rule they like (e.g., everyone in the seminar, only those who paid the fee, only those who will attend the final session, etc.). Non-voters (unmarked) may observe but not speak. 
     * Facilitator note: Encourage the voting group to think about principles. Write proposals on the board.
   - 0:15 - 0:25: (10 min) Discussion and vote on the franchise rule. Each voting member may speak. They must vote by show of hands on the proposed rule(s). If multiple proposals, they can be voted in sequence or use a runoff. The goal is to adopt one rule. 
     * Note: The rule they choose will then be applied to determine who votes on the small decision. But note: the rule itself was voted on by the initial arbitrary franchise. This is the first step of the regress.
   - 0:25 - 0:30: (5 min) Apply the newly adopted rule. Determine who is now eligible to vote on the small decision (the seminar and money) based on the rule. Some students may be excluded by the rule they just adopted. 

   **Part 3: Making the Small Decision (15 minutes)**
   - 0:30 - 0:35: (5 min) The newly defined voting group (as per the rule they adopted) now discusses and proposes options for the final seminar and the use of the 25 euros. Options might include: buying pizza, having a potluck, using the money for a donation, etc. Non-voters (if any) may observe but not speak.
   - 0:35 - 0:45: (10 min) Vote on the options. The voting group decides by majority vote. Record the decision. The facilitator confirms it is binding.

   **Part 4: Introducing the Wider Decision (10 minutes)**
   - 0:45 - 0:50: (5 min) Announce: "Now we have a second decision to make. This one is about [describe a wider decision that would bind the whole department or next year's cohort]. For example: 
     * 'The department is considering a new policy that all seminars must have a field trip. We are to decide whether to implement this for next year's cohort and how to fund it (maybe by increasing the course fee by 5 euros).'
     * Or: 'We are to decide on a change to the seminar structure that will affect next year's students (e.g., mandatory attendance at all sessions).'
     * This decision is more consequential and affects a wider group."
   - 0:50 - 0:55: (5 min) Explain: "We must now decide on a franchise rule for this wider decision. But note: the rule we used for the small decision might not be suitable. We must start over." 
     * Now, the entire class (all 18) is allowed to participate in the discussion of the franchise rule for the wider decision? But wait: we haven't set the franchise for this decision yet. So we face the same problem again. 

     **Important twist:** For the wider decision, we want them to notice that the demos might shift. So we don't start with an arbitrary franchise. Instead, we open the floor to everyone to discuss and then vote on the franchise rule? But how? We are in a regress: without a franchise rule, we can't vote on the franchise rule. 

     **Solution:** We let them self-organize. The facilitator does not impose an initial franchise. The group must first decide how to decide the franchise rule. This may lead to chaos or a spontaneous agreement on a procedure. The goal is for them to feel the problem.

     **Revised plan for Part 4:**
     - 0:45 - 0:55: (10 min) Introduce the wider decision. Then say: "We must now decide who gets to vote on this wider decision. But note: we have not set a rule for this decision. How should we proceed? I leave it to the group to figure out how to decide the franchise rule for this decision." 
       * The facilitator remains silent and observes. Students may propose a method (e.g., let's all discuss and then vote by the whole group, or form a committee, or use the previous rule, etc.). The point is to let them struggle with the regress.

   **Part 5: Making the Wider Decision (20 minutes)**
   - 0:55 - 1:05: (10 min) Discussion and decision on the franchise rule for the wider decision. The group must agree on a process and then a rule. They might try to vote without a rule, or they might adopt a rule by consensus, or they might use the previous rule. The facilitator does not intervene unless necessary (e.g., to keep time or if they are completely stuck). 
     * If they try to vote without a rule, ask: "Who is allowed to vote on this rule?" to highlight the problem.
     * If they settle on a rule, then apply it to define the voters for the wider decision.
   - 1:05 - 1:15: (10 min) With the franchise set, the voting group now discusses the wider decision and votes. The non-voters (if any) must observe.

   **Part 6: Debrief (25 minutes)**
   - 1:15 - 1:40: (25 min) Facilitated discussion. Now we name the boundary problem and reflect.

     **Debrief Structure:**
     1. **Regress:** 
          - Ask: "When we set the first franchise rule, who decided that the marked-card holders should vote?" (Answer: I, the facilitator, arbitrarily.) 
          - "Then you voted on a rule. But that vote was only among the initial group. How did we break the chain? What made that initial group legitimate?" 
          - Point out that in the wider decision, we had to start over and they faced the same problem: without a rule, how do we set the rule? 

     2. **Decision-relativity of the demos:**
          - "Notice that for the small decision, the franchise rule you chose might have included only the seminar members. But for the wider decision, you might have included next year's students or the department. Why? How does the nature of the decision affect who should be included?"
          - Highlight: In the small decision, the set of people whose options are changed might be only the current students (if the money is for their party). In the wider decision, next year's students are affected (if we change the fee or structure). 

     3. **Three principles:**
          - Write the three principles on the board:
            a) Affected interests: include everyone whose interests are affected.
            b) Subject to enforcement: include everyone who will be subject to the decision's enforcement.
            c) Change in options: include everyone whose set of available options is changed by the decision.
          - Ask: "Which principle did you implicitly use in the small decision? In the wider decision?"
          - Discuss cases where they diverge:
            * Example for the small decision: The money is spent on food for the final seminar. Only those who attend the seminar have their options changed (they get food). But what about someone who doesn't attend? Their interests might be affected if they care about the money being used, but they are not subject to enforcement and their options aren't changed. 
            * Example for the wider decision: The field trip policy affects next year's students. They are subject to enforcement (must attend) and their options are changed (they have a field trip). But what about the department staff? They are subject to enforcement (must organize) and their interests are affected, but they might not have been included.

     4. **Grading by change in options:**
          - "In the small decision, if we used the change-in-options principle, we might have included only those attending the final seminar. But what about someone who paid the fee but won't attend? They might have an interest in how the money is used. How do we balance that?"
          - "In the wider decision, next year's students have their options changed (they must go on the field trip and pay more). But current students? They might have an interest in the department's reputation, but their options aren't changed. Would you include them?"

     5. **What the activity cannot reproduce:**
          - In real life, boundaries are often set by territory, force, and constitutional settlement. We don't vote on them from scratch every time.
          - In the classroom, people can walk out (or not participate) without severe consequences, but in a state, leaving is not easy (emigration barriers).

     6. **Predictable problems and handling:**
          - Problem 1: The initial arbitrary franchise might cause resentment. Some students might disengage. 
            * Handling: In the debrief, acknowledge that exclusion feels arbitrary and undemocratic. That's part of the point.
          - Problem 2: During the wider decision, the group might be stuck on how to set the franchise rule. 
            * Handling: Let them struggle for a while. If they are stuck for more than 5 minutes, you might suggest: "Perhaps you can discuss what principle should guide the franchise and then use that principle to define the voters without a vote?" or "Maybe you can use consensus for this meta-decision?" But try not to solve it for them.
          - Problem 3: The three principles might not come up explicitly. 
            * Handling: In the debrief, introduce them and ask which one they used. Use examples from their discussion.

   **Last Line:**
     Activity in one sentence: Students experience the boundary problem by making binding decisions under arbitrary and then self-determined franchise rules, testing principles of inclusion through two decisions of differing scope.

   **Detailed Minute-by-Minute:**

   0:00-0:05: Arrival and card distribution. Explain the small decision (final seminar and money). Do not mention the mark on the cards until the next step.

   0:05-0:10: Announce the initial franchise: only marked-card holders can vote on the franchise rule and the small decision. Count the voters (9). Non-voters (9) must be silent observers.

   0:10-0:25: The voting group (9) discusses and proposes franchise rules for the small decision. They vote on a rule. (15 minutes for discussion and vote? Actually, we allocated 20 min for Part 2, so 15 min for discussion and vote, then 5 min to apply the rule.)

   0:25-0:30: Apply the rule they just adopted to determine who votes on the small decision. Some students might be excluded by their own rule.

   0:30-0:45: The new voting group (as per their rule) discusses and votes on the small decision (what to do with the money and final seminar). (15 min)

   0:45-0:55: Introduce the wider decision (e.g., "The department is considering a new policy: all seminars must have a field trip, funded by a 5-euro increase in the course fee for next year. We are to decide whether to recommend this policy."). Then: "We must now decide who gets to vote on this wider decision. But note: we don't have a franchise rule for this. How do we proceed?" Let the group self-organize. (10 min)

   0:55-1:15: The group decides on a franchise rule for the wider decision (this may take 10 min) and then uses that rule to define the voters who then discuss and vote on the wider decision (10 min). 

   1:15-1:40: Debrief (25 min) as outlined above.

   **Role Assignments for Wider Decision (optional):**
     If we want to simulate non-present stakeholders, we can hand out envelopes to some students to represent them. For example:
     - Envelope 1: "You are a student who will take this seminar next year. You don't want the fee increase because you are on a tight budget."
     - Envelope 2: "You are a faculty member who will have to organize the field trip. You are concerned about the extra work."
     - Envelope 3: "You are a current student who cares about the department's reputation. You think field trips would attract more students."

     But note: including role assignments might complicate the focus on the boundary problem. We are already having a wide decision that affects next year's students. They are not in the room. The point is: should they be included in the franchise? The role assignments might be a distraction. We can skip them and just describe the affected groups.

     Alternatively, we can have a few students volunteer to take on these roles during the discussion? But that might be too much. I recommend skipping the role assignments and keeping the focus on the franchise rule.

   **Final note:** The activity is designed to be provocative and may cause frustration. That's intentional to highlight the problem. The debrief is crucial for processing.

   Let's adjust the timing to be more realistic:

   - Part 1: 5 min (0:00-0:05) and 5 min (0:05-0:10) -> total 10 min.
   - Part 2: 15 min (0:10-0:25) for discussion and vote on franchise rule, then 5 min (0:25-0:30) to apply the rule -> total 20 min.
   - Part 3: 15 min (0:30-0:45) -> total 15 min.
   - Part 4: 10 min (0:45-0:55) -> total 10 min.
   - Part 5: 20 min (0:55-1:15) -> total 20 min.
   - Part 6: 25 min (1:15-1:40) -> total 25 min.

   Total: 100 minutes? Oops, we have 80 minutes. So we must cut.

   **Revised timing for 80 minutes:**

   - Part 1: 5 min (0:00-0:05) and 3 min (0:05-0:08) -> total 8 min.
   - Part 2: 12 min (0:08-0:20) for discussion and vote on franchise rule, then 3 min (0:20-0:23) to apply the rule -> total 15 min.
   - Part 3: 10 min (0:23-0:33) -> total 10 min.
   - Part 4: 7 min (0:33-0:40) -> total 7 min.
   - Part 5: 15 min (0:40-0:55) -> total 15 min. (10 min for franchise rule, 5 min for decision? That's tight. Maybe 8 min for franchise and 7 min for decision.)
   - Part 6: 25 min (0:55-1:20) -> total 25 min.

   But 8+15+10+7+15+25 = 80 minutes.

   Alternatively, we can cut the wider decision vote short and focus more on the debrief.

   Let's stick to the 80-minute plan:

   0:00-0:08: Part 1
   0:08-0:23: Part 2 (15 min: 12 min discussion/vote, 3 min application)
   0:23-0:33: Part 3 (10 min)
   0:33-0:40: Part 4 (7 min: introduce wider decision and let them start the franchise discussion)
   0:40-0:55: Part 5 (15 min: 8 min for franchise rule decision, 7 min for the wider decision vote)
   0:55-1:20: Part 6 (Debrief)

   But note: the wider decision part might run over. We can be flexible and cut the wider decision vote short if needed.

   **Activity in one sentence:**
     Activity: Students confront the boundary problem by successively setting franchise rules under arbitrary initial conditions for two binding decisions of differing scope, then debrief the resulting regress, decision-relativity, and competing inclusion principles.
answer: |-
  Below is a fully designed activity for your 80-minute session, including rules, timeline, materials, and debrief. The goal is to create experiential friction around the boundary problem while testing three inclusion principles (affected interests, subject to enforcement, change in options). Crucially, the term "boundary problem" is withheld until debrief.

  ---

  ### **Activity Design: "The Demos Dilemma"**
  **Core Structure**: Two binding decisions (one small/current, one large/future) force iterative franchise rulemaking. The initial franchise is arbitrary; subsequent rules are self-generated. The twist: the second decision intentionally creates mismatches between the three inclusion principles.

  #### **Materials & Prep**
  1. **Cards**: 18 index cards (9 marked ★, 9 blank). Shuffle and distribute randomly as students enter.
  2. **Whiteboard** with three columns for proposals: "Rule," "Voters," "Why?"
  3. **Decision Prompts** (write on board):
     - **Small Decision**: "How to use €25 and final seminar (e.g., pizza party, donation, guest speaker)."
     - **Wider Decision**: "Whether to mandate all future seminars in this course include a paid field trip (€15/student), binding next year’s cohort."
  4. **Timer** for strict timekeeping.
  5. **€25 cash** (symbolic) to make stakes tangible.

  #### **Role Assignments**
  - **Initial Arbitrary Franchise**: Only ★ cardholders vote in Step 1.
  - **No other roles**: Avoid distracting narratives. The focus is on *procedural conflict*, not role-play.

  ---

  ### **Timeline (80 Minutes)**
  **Goal**: Force self-reflexive rulemaking. Silence your theoretical knowledge until debrief.

  #### **Step 1: Arbitrary Franchise & Rule Proposal (20 mins)**
  - **0:00–0:05** (5 min):  
    - "We’re making a real decision today: how to spend €25 and structure our final seminar. But first: Who decides? Only ★ cardholders may vote *on the voting rule* for this decision."  
    - ★ cardholders stand (9 people). Non-★ sit separately.  
  - **0:05–0:15** (10 min):  
    - ★ cardholders brainstorm **principled rules** for who votes on the small decision.  
    - Push principles: Ask, "Should voters be people affected? Subject to enforcement? Or those whose options change?"  
    - Examples: "Only attendees," "Full class," "Those who paid fees."  
  - **0:15–0:20** (5 min):  
    - ★ cardholders vote on a rule. Apply it immediately.  
    - *Predictable issue*: Non-★ students excluded. Some may protest—note reactions for debrief.  

  #### **Step 2: Small Decision Under New Rule (15 mins)**
  - **0:20–0:30** (10 min):  
    - Newly defined voters (per Step 1’s rule) propose ideas for the €25/seminar.  
  - **0:30–0:35** (5 min):  
    - Vote. Record outcome. Hand facilitator the €25.  

  #### **Step 3: Wider Decision & Franchise Reset (20 mins)**
  - **0:35–0:40** (5 min):  
    - Introduce wider decision: "Now decide whether to mandate field trips for *next year’s cohort* (cost: €15/student). This binds strangers."  
    - Reset: "Before debating, you must *again* decide who votes—but now for a decision affecting outsiders."  
  - **0:40–0:55** (15 min):  
    - **No initial franchise**: Entire class (18) debates a new rule.  
    - Intervene only if stuck: "How will you adopt this rule? By consensus? Majority? Who counts as ‘you’?"  
    - *Predictable issue*: Chaos. Students will try to vote on the rule but lack legitimacy. Highlight: "Who authorized *this* vote?"  
    - Once a rule is accepted, apply it and vote on the field trip.  

  #### **Step 4: Debrief (25 mins)**
  **Reveal the boundary problem** and explore principles using their lived experience.

  - **0:55–1:00** (5 min): Name the problem.  
    > "Today you encountered the *boundary problem*: Any vote assumes a prior ‘demos,’ but how do we legitimately define that group without a prior vote? You experienced this as a regress."  

  - **1:00–1:20** (20 min): Map moments to concepts:  
    | **Moment**                  | **Concept**                  | **Questions for Discussion**                                                                 |  
    |-----------------------------|------------------------------|----------------------------------------------------------------------------------------------|  
    | ★ cardholders voting on rule | **Regress**                  | "Who decided the ★ cardholders should rule? Was this democratic? Where does authority start?" |  
    | Wider decision rulemaking   | **Decision-Relative Demos** | "Why did the ‘demos’ feel different for the field trip? Should the affected group (next year) have been included? Could they ‘walk out’?" |  
    | Conflicts in Step 3         | **Three Principles Tested** | "When proposing rules, did you prioritize:  
      - *Affected interests* (e.g., next year’s students)?  
      - *Subject to enforcement* (e.g., current students voting on their own rules)?  
      - *Change in options* (e.g., only those forced to pay/attend)?  
      Where did these clash? (Example: Field trip changes options for future students but enforces nothing on current ones.)" |  

  - **1:20–1:25** (5 min): **Limits of the Activity**:  
    > "In reality, boundaries are closed by force (borders), constitutions, or inertia—not votes. Walking out here was easy; emigrating isn’t. We simulated *founding* moments, but most democracies inherit boundaries."  

  ---

  ### **Predictable Problems & Fixes**
  - **Problem**: Students resist arbitrary exclusion (★ cards).  
    - **Fix**: Let frustration simmer. Say: "This exclusion mirrors real historical franchises. Observe your reactions—we’ll discuss later."  
  - **Problem**: Wide decision debate stalls over rulemaking.  
    - **Fix**: If >5 mins pass without progress, ask: "Can you adopt a rule without a vote? How?" (Prompt consensus or procedural experiments.)  
  - **Problem**: Principles blur in discussion.  
    - **Fix**: In debrief, contrast concrete proposals. Example: "When Maria said ‘only attendees should vote for the party,’ was that ‘change in options’ or ‘enforcement’?"  

  ### **What the Activity Cannot Simulate (Requires Your Voice)**
  1. **Pre-settled boundaries**: Real demoi are rarely self-determined; they emerge from war, colonization, or constitutional accidents.  
  2. **Exit costs**: Walking out of a state is hard; walking out of class is easy. Stress that "consent" is idealized.  
  3. **Scale/abstraction**: Students deliberate face-to-face. Real boundaries involve millions who never meet.  

  ---

  **Activity in one sentence**: Students iteratively define voting rules under arbitrary exclusion to make binding small/future decisions, exposing the boundary problem’s regress, decision-relativity, and clashes among inclusion principles before debriefing.
