  Okay, the user is a teaching assistant for a fourth-year seminar on epistemic paradoxes, specifically the lottery and preface paradoxes. They want a sestina poem that illustrates the structural differences between these two without explicit explanation. The poem must use specific end-words and follow a strict rotation pattern.

  First, I need to understand the core differences between the paradoxes. The lottery paradox involves external probabilities—each ticket has high odds of losing, but the conjunction that all lose is false. The preface paradox is about the author's internal justification for each claim, yet believing the book contains an error due to human fallibility. The twist is a new scenario where a copy-editor notes at least one false claim, turning the author's sentences into lottery tickets.

  The end-words are TICKET, ODDS, SURE, CLOSURE, ERRATA, FALLIBLE. I'll assign each to roles: TICKET and ODDS for the lottery, ERRATA and FALLIBLE for the preface. CLOSURE bridges both, SURE becomes ironic. The rotation should make CLOSURE feel inevitable, accumulating tension.

  Stanzas 1-2: Lottery paradox. Build reassurance with each TICKET and ODDS, but CLOSURE's repetition hints at the coming contradiction. Use imagery of tickets, draws, crowds.

  Stanzas 3-4: Preface paradox. Author's voice, reflecting on her work. ERRATA as the errata page, FALLIBLE emphasizing human error. Contrast with lottery—no external odds, just personal history and book length.

  Stanza 5: Introduce the copy-editor's note. Merge lottery structure (TICKET as sentences) with the author's context. Show this scenario aligns with lottery because the note is external information, unlike the preface's internal justification.

  Stanza 6 and tornada: No resolution. Words cycle with both paradoxes unresolved. Final line avoids blaming a single concept, leaving the burden unassigned.

  Brainstorming key points:
  - TICKET: Lottery (physical tickets) and twist (sentences as tickets).
  - ODDS: Statistical in lottery, absent in preface.
  - SURE: Shifts from confidence to doubt.
  - CLOSURE: Mechanical, inevitable force.
  - ERRATA: Preface's acknowledgment page.
  - FALLIBLE: Human element in preface.

  For the answer key:
  - Stanzas 1-2: Lottery paradox.
  - Stanzas 3-4: Preface paradox.
  - Stanza 5: Copy-editor scenario as lottery-type due to external input.
  - Burden: Lottery challenges closure; preface challenges justification of individual claims.

  Ensure the poem avoids clichés and remains performable in two minutes. Use concrete imagery and subtle shifts in word connotations to convey the philosophical points without exposition.
