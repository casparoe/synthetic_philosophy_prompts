  ### Brainstorm
  - **End-Word Roles**:  
    `TICKET`/`ODDS` anchor lottery (stanzas 1-2); `ERRATA`/`FALLIBLE` anchor preface (3-4); `SURE` shifts from confidence to doubt; `CLOSURE` acts as relentless formal machinery.  
  - **Turn**: Stanza 5 merges the copy-editor’s note (external authority) with lottery logic—sentences become tickets, the note the "published odds."  
  - **Tornada Withholding**: Resolves nothing. `CLOSURE` and `FALLIBLE` share a line but clash; final word (`SURE`) hangs ambiguously.  
  - **Contrast**: Lottery’s "odds" are given (external); preface’s "fallible" is self-ascribed (internal). The copy-editor reintroduces external arbitration.  

  ---

  ### Sestina: Two Apologies  

  Each flimsy rectangle feels like a losing **TICKET**,  
  though printed numbers promise kinder **ODDS**.  
  The crowd insists this one’s a **SURE** defeat—  
  why doubt? Belief snaps shut: mere **CLOSURE**.  
  No thought for pages where **ERRATA** swarm—  
  just faith that ink-damp hands stay **FALLIBLE**.  

  I stacked the deck, called every **ODDS**-on guess,  
  made each claim feel a certain, stamped **TICKET**  
  to truth. But bound and typeset, **FALLIBLE**  
  as breath, the whole work gasps. This **CLOSURE**  
  rings false. I draft the **ERRATA**, half-**SURE**  
  some flaw will surface, sharp as **SURE** regret.  

  **ERRATA** slip in, quiet. Not **SURE**  
  which sentence frays, but knowing **FALLIBLE**  
  minds weave such threads. The press demands **CLOSURE**—  
  I grant one page to doubt. No **ODDS**  
  are posted here; no golden **TICKET**  
  buys grace. The fault’s not drawn—it’s **FALLIBLE**.  

  Then, proof returned: one stark note, **SURE**  
  as verdicts penned in red. “Some **TICKET**  
  in this pile’s void.” The **ODDS** now glare—external,  
  cold. My claims stand accused. This **CLOSURE**  
  feels borrowed, like a rigged **SURE** thing. **ERRATA**  
  loom, not owned, but dealt. Am I less **FALLIBLE**?  

  The copy’s mark makes every **FALLIBLE**  
  line a numbered chance, each word a **TICKET**  
  in a draw I didn’t bank. Those **ODDS**  
  are someone else’s math. This **SURE**  
  alarm—not mine—still forces **CLOSURE**.  
  I scan for flaws. The **ERRATA** burn.  

  What **ERRATA** hide, what **ODDS** expose:  
  a **FALLIBLE** trust in thought. That **SURE**  
  belief’s a **TICKET** punched by **CLOSURE**.  

  ---

  ### Answer Key (For TA’s Reference)  
  1. **Stanzas 1-2**: Lottery paradox (external odds; reassurance accumulates falsely).  
  2. **Stanzas 3-4**: Preface paradox (author’s voice; fallibility intrinsic, no external odds).  
  3. **Stanza 5**: Copy-editor’s note scenario—structurally lottery-like (external input arbitrates sentences as "tickets").  
  4. **Burden Placement**:  
     - Lottery challenges *closure* (justified beliefs aggregate to absurdity).  
     - Preface challenges *justification of individual claims* (fallibility undermines each premise’s warrant).  
     - The honest answer? Burden shifts: external data (lottery/copy-editor) pressures closure; internal reckoning (preface) pressures justification.  

  **Performance Note**: ~110 seconds at moderate pace. End-words rotate per canonical sestina order (last word of stanza 1 becomes line-end for stanza 2 in sequence: 6,1,5,2,4,3).
