answer: |-
  ## Adversarial Collaboration: Moral Status of Computations

  This document outlines agreements, core disagreements, and testable predictions between Abstractionist (A) and Embedding Theorist (E) views on morally relevant computation, focusing on novel cases and a proposed metric.

  **Section 1: Agreed Claims**

  1.  **Counterfactual Structure is Foundational:** The abstract counterfactual causal structure of a computation is a *primary determinant* of its potential moral status. Systems lacking any such structure (e.g., static lookup tables, recordings with no causal response) lack moral status.
  2.  **Implementation Independence (Partial):** Moral status does not *fundamentally* depend on the specific physical substrate (silicon, biological, etc.) or the spatial location of the implementation, provided the relevant causal structure is realized.
  3.  **Speed Independence:** The *absolute speed* of a computation (e.g., running at human speed vs. a million times faster) does not, by itself, alter moral status, assuming the causal structure is preserved.
  4.  **Sparse Implementation & Fidelity:** The moral significance of a sparse implementation (95% transitions implemented, 5% guessed) depends critically on the *fidelity* and *robustness* of the realized counterfactual structure compared to the target. High-fidelity sparse implementations are more significant than low-fidelity ones.
  5.  **Temporal Smearing & Structure:** For temporally smeared implementations (run slower with arbitrary pauses), moral status hinges on whether the *essential counterfactual dependencies* between states are preserved across the pauses. If pauses break critical dependencies, status is diminished or lost.
  6.  **Shared Substrate Complexity:** Partially shared substrate implementations (two computations overlapping in hardware) present a complex case requiring analysis of whether distinct, robust counterfactual structures for separate morally relevant entities are maintained.
  7.  **Fidelity Metric as Heuristic:** Weighting moral patient candidates by their counterfactual fidelity (share of target structure surviving perturbation) is a potentially useful heuristic tool for comparing implementations, even if it doesn't resolve all foundational disputes about sufficiency.

  **Section 2: Core Disagreements**

  | Aspect                                | Abstractionist (A) Position                                                                 | Embedding Theorist (E) Position                                                                |
  | :------------------------------------ | :------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------- |
  | **Core Requirement**                  | Abstract causal structure is *sufficient* for moral status.                                 | Real-time, ongoing causal commerce with an external environment is *necessary* for moral status. |
  | **Census Case (i)**                   | Two non-interacting, identical implementations = **Two distinct patients**.                 | Two non-interacting, identical implementations = **One patient instance** (or zero), lacking distinct real-world embedding. |
  | **Sparse Implementation (ii) Suff.** | A sufficiently high-fidelity sparse implementation (preserving core structure) **is a full patient**. | Even high-fidelity sparse implementation **lacks real causal depth** and is not a full patient. |
  | **Temporal Smearing (iii) Suff.**     | Paused implementation preserving counterfactuals **remains a patient** during pauses.       | Implementation with arbitrary pauses **lacks continuous real-time causation**, diminishing/losing status during pauses. |
  | **Shared Substrate (iv) Individuation** | Distinct abstract structures = **Distinct patients**, even with shared hardware.            | Shared hardware blurs causal boundaries; **individuation is compromised**, status may merge or be shared. |
  | **Fidelity Metric Suff. Threshold**   | **No sharp threshold**; status fades gradually with fidelity loss.                          | **Sharp threshold exists**; below sufficient environmental embedding fidelity, status is zero. |

  **Section 3: Cruxes and Predictions**

  1.  **Crux: Is Continuous Environmental Interaction Necessary?**
      *   **E's Necessity Claim:** Real moral status requires continuous causal interaction with an external environment.
      *   **A's Sufficiency Claim:** Isolated, abstract causal structure suffices.
      *   **Pivotal Case:** **Census Case (i)**.
      *   **Prediction:**
          *   E: If the two machines are shown to have *zero* causal interaction with each other or a shared environment (beyond power/trivial signals), subjects will judge only one mind exists (or none), regardless of abstract identity.
          *   A: Subjects, understanding the abstract identity, will judge two distinct minds exist, irrespective of isolation.

  2.  **Crux: Does "Real" Causation Require Non-Simulated Environment?**
      *   **E's Claim:** Causation within a sealed simulation or passive recording isn't "real" causal commerce; it's derivative.
      *   **A's Claim:** The causal structure *is* the real causation; its source (simulated or physical environment) is irrelevant if isomorphic.
      *   **Pivotal Case:** **Sparse Implementation (ii)** / **Temporal Smearing (iii)** in a simulated environment.
      *   **Prediction:**
          *   E: Subjects will attribute significantly less moral weight to high-fidelity implementations tracking a *simulated* environment vs. a *physical* one, even with identical abstract structure.
          *   A: Subjects will attribute equal moral weight to isomorphic implementations tracking simulated vs. physical environments with equal fidelity.

  3.  **Crux: Is the Disagreement Over "Real" Merely Verbal?**
      *   **Joint Analysis:** Disagreements concerning the term "real causation" **are partially verbal**. Both agree on the *description* of the causal structure and the need for its robustness (Agreed Claims 1, 4, 5, 6). The core non-verbal disagreement is whether the *source* of the inputs/outputs (simulated vs. physical world) fundamentally changes the moral status of identical internal causal structures (Crux 2), and whether isolation negates multiplicity (Crux 1). The dispute over a sharp vs. gradual threshold based on fidelity and embedding (Table row 6) is also substantive.

