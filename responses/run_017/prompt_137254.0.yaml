prompt: |-
  hey, I'm in a freedom of expression seminar right now, and for my independent study I'm trying to use the harm principle to grade two real things: my university's speech code, and the moderation rules of a big social platform (the real kind, with newsworthiness exemptions and everything). Before I go read a pile of theories of what counts as a harm, I want to know what I should be demanding of one, because everyone seems to smuggle in there politics at this exact step.

  You're a political philosopher who's spent years on speech regulation. Brainstorm a bit before you write, and be concrete rather than programmatic.

  Write the desiderata. What an account of "harm to others" has to deliver to be good enough for that job -- the cases it has to get right, the distinctions it can't collapse, the baseline/counterfactual questions it has to answer -- with the reasoning behind each requirement. Cap it at ten or twelve. I care about your requirements more than about verdicts on the cases, but here are the cases I want the requirements anchored to:

  a billboard that disgusts nearly everyone but changes no one's behavior; speech that makes members of a group unemployable, but only because employers are bigots; pro-anorexia content that people actively seek out and that predictably makes their own condition worse; a false claim that moves vaccination rates a fraction of a percent, with deaths far downstream and no identifiable victim; speech that leaves everyone's welfare unchanged but lowers one group's standing; speech that harms only because the state won't protect the targets; and the counterfactual problem -- if this speaker is silenced, someone else posts the same thing, so was any harm prevented at all?

  Then: which desiderata are non-negotiable and which are really just the preferences of one camp (the "offense is never harm" people, or those who think subordination must count). Flag any pair you suspect can't be jointly satisfied -- especially anything that pulls between "usable by a moderator deciding in five minutes" and "gets diffused, aggregated, and counterfactual harms right." And say which single requirement knocks out the most candidate theories.

  Short table at the end scoring welfare-setback views, rights/sovereignty views, and equal-standing/subordination views against the list is fine, but keep it brief -- the list is the deliverable. And don't cite anything, I can't check it anyway.

  Finish with one line: \answer{the single desideratum that excludes the most candidate accounts}
reasoning: |-
  Okay, let me tackle this user's request. They're in a freedom of expression seminar and need a solid framework to evaluate real-world speech policies using the harm principle. The core challenge is defining "harm" without political bias sneaking in. 

  First, I consider their examples - the disgusting billboard, bigotry-driven unemployment, pro-ana content, etc. Each tests different harm dimensions: subjective offense, structural discrimination, self-harm, statistical harms. The counterfactual problem (silencing one speaker when others remain) is particularly thorny for platform moderation.

  I start listing what a harm account MUST handle:
  1) Baseline requirement - can't call status quo harms "baseline" if they're unjust
  2) Distinguishing harm from offense - the billboard case demands this
  3) Third-party bigot problem - speech enabling discrimination isn't victim-blaming
  4) Self-harm with consent - pro-ana seekers complicate autonomy arguments
  5) Statistical/cumulative harms - vaccine lies show tiny impacts matter at scale
  6) Standing vs welfare - some speech damages social position without economic loss
  7) State complicity - when harm exists only because protections are withheld
  8) Counterfactual robustness - moderation must work even with replaceable speakers

  Then the practical tensions:
  - Operationalizability vs nuance (moderators need speed, philosophers want depth)
  - Non-negotiable vs contested points (e.g. subordination-as-harm is ideological)

  The welfare setback view fails baseline issues. Rights views struggle with diffuse harms. Subordination views reject offense/harm distinctions. But the counterfactual test is the real killer - most theories implode when harm disappears if identical speech persists elsewhere.

  User's clearly sharp - they spot how "harm" definitions smuggle in politics. Their examples are perfectly chosen to expose theoretical weaknesses. I'll emphasize the counterfactual point as the biggest tripwire.
answer: |-
  Here’s your desiderata list for a "harm to others" account under the Harm Principle, grounded in your cases and designed for real-world application. Non-negotiables are starred (\*). Trade-offs and tensions are flagged.

  ---

  ### **Desiderata for a "Harm to Others" Account**  
  1.  **\*Distinguishes Harm from Mere Offense/Disgust**  
      *Why*: Must acquit the "disgusting billboard" that changes no behavior. If disgust alone counts as harm, all unpopular speech is restrictable.  
      *Requirement*: Harm must involve a *material setback to interests* (welfare, opportunities, security), not just emotional distress.  

  2.  **\*Assigns Liability for Harms Mediated by Unjust Social Structures**  
      *Why*: Speech making a group "unemployable due to bigoted employers" must count as harm. The account can’t let third-party bigotry absolve the speaker if the speech *invites or normalizes* that discrimination.  
      *Requirement*: Harms count even if they rely on pre-existing injustice, provided the speech *exploits or amplifies* it.  

  3.  **Handles Non-Consensual Self-Harm Facilitation**  
      *Why*: "Pro-anorexia content sought by users" must be distinguishable from consensual risks (e.g., boxing). Vulnerability matters: if the speech *targets or exploits* impaired autonomy (e.g., mental illness), it can cause harm.  
      *Requirement*: Harm can arise when speech deliberately impairs rational agency in ways the state may protect against.  

  4.  **Accounts for Diffuse/Statistical Harms**  
      *Why*: The "false claim lowering vaccination rates" causes real deaths, but no victim can say, "*You* killed *me*." Requiring direct, identifiable victims would immunize population-level harms.  
      *Requirement*: Aggregate harms from widespread speech must be actionable, even if individual causation is probabilistic.  

  5.  **\*Distinguishes Welfare Harms from Status Harms**  
      *Why*: Speech that lowers a group’s "standing without changing welfare" (e.g., demeaning stereotypes reinforcing social inferiority) must be capturable *if* it enables future material harm (e.g., discrimination).  
      *Requirement*: Status harm counts *only* when it creates tangible risks (e.g., to equal opportunity) — not as an independent category.  

  6.  **\*Rejects "State Complicity" as a Harm Nullifier**  
      *Why*: If "speech harms only because the state won’t protect targets," the harm is still real (e.g., hate speech enabling violence). The account can’t define harm away by blaming state inaction.  
      *Requirement*: Harm assessment must be based on the *actual social context*, not idealized state behavior.  

  7.  **Resolves the Counterfactual Problem**  
      *Why*: If silencing one speaker prevents no harm because "someone else posts the same," the Harm Principle appears useless for moderation. But if silencing *reduces reach/frequency*, harm is mitigated.  
      *Requirement*: Harm must account for *marginal contribution* to risk/damage, not just total harm if speech exists.  

  8.  **Operationalizable for Institutional Use**  
      *Why*: A moderator needs clear heuristics ("credible threats = harm; insults ≠ harm"). Philosophers might prefer contextual nuance, but institutions need rules.  
      *Tension*: Directly clashes with highly contextual accounts (e.g., "harm depends on historical oppression").  

  9.  **Avoids Moralizing/Political Assumptions in Core Definition**  
      *Why*: To prevent "smuggling in politics," the baseline harm metric shouldn’t presuppose contested values (e.g., "subordination is inherently harmful").  
      *Non-Negotiable?*: Yes, but **contested** — egalitarians argue *failure to redress oppression* is the real smuggling.  

  10. **\*Defines a Non-Question-Begging Baseline**  
      *Why*: Is the baseline "no speech" or "status quo power relations"? Calling racist speech "harmful" assumes equality as the baseline; opponents assume liberty.  
      *Requirement*: Baseline must be a *minimally just condition* (e.g., physical security, equal rights), not the status quo.  

  ---

  ### **Tensions & Non-Negotiables**  
  - **Non-Negotiables**: (1), (2), (5†), (6), (10).  
    †*(5) is contested: "Offense≠harm" camp rejects status harm entirely; egalitarians insist it’s core*.  
  - **Key Tension**: **#8 (Operationalizability) vs. #7 (Counterfactuals) & #4 (Diffuse Harms)**.  
    Granular harm analysis (e.g., marginal contribution, statistical risk) is messy for moderators.  
  - **Impossible Pair?** Full operationalizability (#8) + Capturing status harms (#5) without political contestation.  

  ---

  ### **Quick Theory Scorecard**  
  | **Desideratum**              | **Welfare-Setback** | **Rights/Sovereignty** | **Equal Standing** |  
  |------------------------------|---------------------|------------------------|--------------------|  
  | 1. Harm≠Offense              | ✅                  | ✅                     | ⚠️ (Status=harm?) |  
  | 2. Mediated Harms            | ⚠️ (Indirect?)      | ✅ (Rights violation)  | ✅                 |  
  | 4. Diffuse Harms             | ✅ (Aggregate welfare) | ❌ (Need rights-holder) | ⚠️                |  
  | 5. Status Harms              | ❌                  | ❌                     | ✅                 |  
  | 7. Counterfactuals           | ❌ (Total welfare)  | ⚠️                    | ❌                 |  
  | 10. Non-Question-Begging Base| ❌ (Status quo?)    | ⚠️ (Liberty baseline?) | ✅                 |  
  **✅=Strong, ⚠️=Partial, ❌=Weak**  

  ---

  ### **The Biggest Theory-Killer**  
  **#10: Defining a Non-Question-Begging Baseline**  
  Most theories fail here: Welfare views often default to the status quo; rights views assume controversial entitlements; standing views presuppose equality. Without an agreed baseline, "harm" is politicized by definition.  

  \answer{Non-question-begging baseline}
