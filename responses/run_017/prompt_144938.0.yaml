  For concessions: The user should grant that (1) the separateness intuition exists (orthodox), (2) deliberative unity matters for complaint units (moderately supported), and (3) pooled agency cases are possible. But they must hold the line on the core thesis—that biological persons aren't the default complaint units—and both extensions, especially the within-life failure.

  The prioritarians' objection to "aggregation within a life" will be the most damaging because it attacks the weaker of the two extensions and has broad appeal. The Kantian meta-objection about ethical foundations is the nightmare question—it could derail the whole framework.

  I'll draft the table in descending threat order: prioritarians first (high damage), then act-utilitarians (moderate), Kantians (moderate but meta), and others. Replies should acknowledge valid concerns while steering back to the user's framing. For example, when prioritarians attack the within-life claim, emphasize that psychological disunity creates genuinely separate standpoints.

  Soft spots to flag: The dense amnesia case might not convince skeptics, and the "shared deliberation" threshold for pooled agency risks vagueness. The user should admit these are live debates but insist they don't undermine the core proposal.

  Final outputs: "Most damaging: Prioritarians attacking within-life aggregation" and "Dread question: Kantian meta-objection."
answer: |-
  Here’s your Q&A prep sheet, structured for tactical readiness. Epistemic status is marked throughout (🟢 = near-orthodox, 🟡 = contested, 🔴 = novel/revisionary).  

  ---

  ### **Initial Concessions & Non-Negotiables**  
  **Concede in first 2 minutes:**  
  - 🟢 The *core intuition* behind separateness of persons (SoP) is widely accepted in anti-utilitarian circles (Rawls, Nozick, Scanlon).  
  - 🟡 Deliberative unity *matters* for practical reason (drawing on Korsgaard/Parfit is safe).  
  - 🔴 Pooled agency *can* dissolve SoP in edge cases (cite Bratman/Gilbert).  

  **Refuse to give up:**  
  1. 🔴 **Complaint units ≠ biological persons**. Biological boundaries are morally arbitrary without deliberative unity.  
  2. 🔴 **Both extensions** (within-life failure & cross-person success) are necessary implications of the deliberative-standpoint view.  

  ---

  ### **Q&A Prep Table**  
  *(Ordered by likelihood + damage potential)*  

  | Objection (Phrased in-Camp Vocabulary)                                                                 | Who Raises?                     | Target Claim                  | 2-Minute Reply (Key Moves)                                                                                                   | Where Reply is Soft                                                                 |
  |--------------------------------------------------------------------------------------------------------|---------------------------------|-------------------------------|-----------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **"Your amnesia case conflates prudential and moral disagreement. Disunified interests within a life are still *owned* by one person whose lifetime well-being we aggregate."** | Prioritarians / Person-Affecting | Claim (1): Within-life failure | Distinguish *ownership* from *standpoint*: "A 'person' with no psychological continuity has no unified interest to aggregate. Prudential rationality requires a point of view; no standpoint → no single subject of complaint. Your view assumes personhood entails unity." | Soft if they press Parfitian reductionism: "Why isn’t ownership enough for aggregation?" |
  | **"You’re begging the question. 'Complaint units' just restate the anti-aggregation intuition without justifying why deliberative unity matters."**                   | Act-Utilitarians                | Core Thesis                   | "The reconstruction *explains* why aggregation feels wrong: gains/losses need a unified 'I' to weigh them. Utilitarians can’t explain why *this* loss isn’t compensated by *that* gain without smuggling in a standpoint." | Soft if pressed: "Why not bite the bullet? Intuitions ≠ arguments."                |
  | **"Joint intentions don’t erase distinctness. Pooled agency still involves separate agents *choosing* to share goals—their claims remain individual."**                | Contractualists / Kantians      | Claim (2): Cross-person success | "Shared deliberation creates a *new* standpoint (e.g., a team’s joint budget). Claims arise *within* that standpoint: 'our loss' vs. 'our gain.' Individual complaints dissolve when agency is interdefined (Bratman)." | Soft on threshold: "How minimal can shared deliberation be? (Admit: Needs fleshing out.)" |
  | **"This makes morality hostage to psychology. A dementia patient loses moral status? That’s absurd."** | All (esp. Kantians)             | Claim (1) + Core Thesis       | "Status ≠ unit of complaint. The patient still has rights, but losses/gains *at different times* can’t be summed for *that life*. We protect them via trustee duties, not aggregation." | Soft if pushed: "Does this imply fragmented selves have less protection? (No—duties apply non-aggregatively.)" |
  | **"If deliberative unity defines units, why can’t utilitarians just adopt *your* units and aggregate within them?"**                                                  | Act-Utilitarians / Agnostic     | Core Thesis                   | "They can! But this *concedes* SoP’s core point: aggregation requires a unified standpoint. Most utilitarians reject this constraint *in principle* (e.g., Singer’s impartial spectator)." | Soft if utilitarians embrace revision: "Then we agree? (But their theory typically doesn’t.)" |
  | **"The 'serial selves' case is incoherent. If they share a body/memory, they *must* have overlapping standpoints."**                                                   | Prioritarians                   | Claim (1)                     | "Memory ≠ agency. They access the same data but never consult, reason, or plan *together* (like parallel apps on one phone). No shared 'we' → no single complaint unit." | Soft if they argue memory integration *entails* unity.                              |
  | **"This is metaethically shallow. 'Complaint units' ignore that duties arise from reciprocity, not trade-offs."**                                                     | Kantians                        | Entire Framework              | "I’m reconstructing the *objection to utilitarianism*, not giving a full moral theory. Even if duties aren’t trade-off-based, utilitarians must answer why *their* aggregation violates SoP." | Soft if they dismiss SoP entirely: "Then your objection isn’t my target audience." |

  ---

  ### **Critical Priorities**  
  **Must-answer objection (don’t hope it’s missed):**  
  > **The prioritarians’ attack on within-life aggregation**  
  > *Why?* It undermines your most radical claim (1), which their theory relies on rejecting. If they sway the room, you lose the "deliberative unity" high ground.  

  **Pray nobody asks:**  
  > **"If a brain-splitting procedure creates two deliberative standpoints from one person, do we get two complaint units *before* the split?"**  
  > *Why?* It forces you into speculative metaphysics about personal identity with no consensus solution (🔴 novel + underdeveloped in your paper).  

  ---

  **Most damaging:** \answer{Prioritarians attacking within-life aggregation}
