prompt: |-
  I should say at the outset what I do and don't know, so that the procedure can be pitched at the right level. I translate for a living — patent and clinical documentation, French into English — and I am good at the kind of fidelity that can be checked word by word against a source. I have no training in verse, no ear developed beyond an ordinary reader's, and until recently no interest in the problem.

  What changed: a friend of mine, a songwriter who worked in French, died two years ago. His partner, who is the executor and speaks none of the language, has asked me to prepare English versions of the thirty-four short songs he recorded, for a bilingual booklet accompanying a reissue of the recordings. Four of them the family still sings together, and they would like to sing those in English. I have two or three evenings per song, spread over about a year, for no fee; at the end my friend's daughter, who is eighteen and has read none of the French, looks at the English page proofs and says yes or no. She will read them cold, without me in the room. The one book on translation I own, which I read because its title puns on a word for a work made in memory of someone dead, contains dozens of English renderings of a single short French poem, each of them preserving something different; it convinced me that the music is where the difficulty is and left me with no way to proceed.

  So: please write me a decision procedure I can run alone, in an evening, on each of the thirty-four songs, and run the same way each time.

  The things I need it to contain, in order:

  First, the questions to ask about a song before writing anything — what the features of its form actually are, and which of them are doing work. My working assumption has been that content is whatever survives a prose paraphrase and that form is everything left over, so that form is what I sacrifice first. Tell me if that assumption is the thing distorting the procedure: I suspect it is, because several of these songs seem to mean things by their form that no paraphrase captures (a refrain that keeps returning the way the thought it reports keeps returning; lines that get shorter as the speaker runs out of things to say; a rhyme that yokes two words the song is arguing belong together). I need a way to separate load-bearing form — the kind whose loss changes what the song claims — from ambient form, the texture a reader enjoys but which carries nothing a paraphrase would miss. My candidate test is a substitution test: replace the feature with a different one and ask whether a reader who has never seen the French would take the song to be saying something different. Improve it if you can, and tell me where it fails.

  Second, the spending order, and the grounds for it. Given a song where rhyme, metre, register, line-length, and literal sense cannot all be kept, what do I preserve, and how do I decide in this case rather than by a fixed ranking? I want the reasoning to be recordable, because of the third thing.

  Third, a short written artefact per song — a fidelity ledger, say: what I kept, what I sold, what it cost, and one line of justification — that someone with no French and no poetry can read and use to decide whether to accept my version. It should make the trade-offs visible without inviting her to reopen each one.

  Fourth, the melody question. For the four songs the family sings, the tune fixes how many syllables there are and roughly where the stresses fall, and I can test my result by singing it. But I also notice that fitting English to a tune is not one thing: you can set it in the idiom he wrote in or in an idiom the family actually sings, and those give different answers about which syllables may be crunched. Say which choice is mine to make and which is not. And give me a rule, with a stop in it, for when the tune makes nonsense — at what point I leave that song out of the singable set, or write new English words to the tune rather than a translation of his.

  Please apply the whole procedure to three songs from the cycle, including at least one where the answer is one I will not want to hear — including, if that is where it lands, that a song should not be translated at all and should appear in French with a prose gloss.

  1. A song in which every stanza ends on the name of the village where he grew up, with all the rhymes built on that name. The name is untranslatable, and to an English reader it is noise; rhyme and reference are the same feature here.

  2. A song whose refrain, repeated unchanged after every stanza, is two lines of vocables — singable nonsense in the manner of a work chantey — which his daughter used to sing along to as a small child. This is one of the four that get sung. There is nothing here to translate.

  3. A song in which each stanza's lines shorten, eight syllables to six to four to two, the taper enacting a speaker running out of breath or of things to say. This one is also sung, and the tune will not permit the taper.

  Finally, be explicit about what the procedure cannot do: which questions it converts into bookkeeping rather than answering, where it cannot be run by someone without an ear for English prosody, where it hands the decision to a person because the issue is what my friend would have wanted rather than what his text permits, and whether a procedure applied uniformly across thirty-four songs is itself a choice I should be making. I would particularly like your view on whether the ledger risks becoming the product — pages of justification standing in for versions I have not managed to make good.
reasoning: |-
  Okay, I need to understand the user's problem deeply. They're a translator working on a personal project: translating songs by a deceased friend for a bilingual booklet. They have no formal training in verse translation and need a structured method to handle 34 songs efficiently. The key points are fidelity, a decision procedure, and creating a fidelity ledger for approval by someone without French or poetry knowledge.

  The user’s background is in patent and clinical translation, which emphasizes word-by-word accuracy. This might be why they view form as secondary to content. But song translation is different—form carries meaning too. Their assumption that "form is what I sacrifice first" is likely the root of their struggle. Songs use rhyme, meter, rhythm, etc., to convey emotions or ideas that prose can’t capture. For example, in the village-name song, the name isn’t just content—it’s the anchor for rhyme and reference. Sacrificing it would lose the song’s essence.

  Their candidate test (substituting features to see if meaning changes) is a good start but incomplete. It misses how form creates emotional or aesthetic impact. A better approach would be to classify form features as structural (essential for meaning) or ornamental (enhance but not essential). The test should include both semantic and emotional impact assessments.

  For the spending order, a fixed hierarchy won’t work because each song’s priorities differ. Instead, they need a dynamic approach: identify the song's core purpose (e.g., storytelling, emotional effect, singability) first. The spending order should flow from that. For instance, in the shortening-lines song, the taper is central to meaning, so it should override syllable count if the tune conflicts.

  The fidelity ledger is crucial for transparency. It should clearly list trade-offs without being overly technical. The executor’s daughter needs to understand choices without reopening debates. Examples like "Sacrificed rhyme for rhythm to preserve urgency" make it accessible.

  Melody complicates the four singable songs. The user must decide between mimicking the original’s idiom or adapting to the family’s singing style. The rule should prioritize clarity and singability, allowing syllable adjustments but drawing the line at distorted meaning or unnatural stress. If compromises pile up, it’s better to create new lyrics or omit the song from the singable set.

  Applying the procedure to the three test cases reveals tough choices:  
  - The village-name song might require keeping the name untranslated, using near-rhymes, or adding a footnote. The ledger would show that reference and rhyme were preserved at the cost of English readability.  
  - The vocables song has no semantic content, so the focus shifts to replicating the sound and emotional feel. The ledger notes the trade-off: meaning sacrificed for sonic fidelity.  
  - For the tapering song, if the tune prevents shortening lines, they might adapt the melody slightly or mark it as unsingable. The ledger highlights preserving the taper as essential, even if it means the family can’t sing it as-is.

  The procedure’s limits are important. It can’t resolve subjective choices about the artist’s intent—those require human judgment. It also assumes basic prosody skills; if the user struggles with meter, they might need simple tools like syllable counters. Uniform application across songs is practical but risks rigidity; they should stay flexible for outliers.

  The ledger becoming "the product" is a real danger. To avoid this, the user should draft translations before detailed analysis—letting solutions emerge organically—and keep justifications concise. The ledger should aid accountability, not replace creative effort.

  Underlying all this is the user’s grief and responsibility to their friend’s legacy. The procedure must balance rigor with sensitivity, ensuring translations honor the artist’s voice while being accessible to his family. The emotional weight makes clarity and transparency even more critical.
answer: |-
  Here is a structured, repeatable decision procedure designed for your specific constraints: an evening per song, no formal verse training, and the need for auditable trade-offs. It prioritizes identifying **load-bearing form** and provides a clear spending order based on the song's core function. The fidelity ledger makes compromises transparent for non-specialist approval.

  **Core Principle:** Load-bearing form is any element where **alteration changes the song's perceived meaning, emotional effect, or core function** for a reader/listener encountering *only* the English. Ambient form enhances but is not essential to these. Your substitution test is sound; we refine it by demanding **both semantic AND functional impact** for load-bearing status.

  ---

  ### The Procedure (Per Song, One Evening)

  **Phase 1: Pre-Writing Analysis (60-90 mins)**
  *   **A. Source Text Paraphrase:** Write a flat, literal prose paraphrase. Note anything lost (humor, ambiguity, tone shifts).
  *   **B. Identify Formal Features:** List:
      *   *Meter:* Dominant foot (iambic, trochaic?), syllable count consistency/variation.
      *   *Rhyme Scheme:* Pattern (ABAB, AABB?), internal rhyme, near/full rhyme.
      *   *Stanza Structure:* Line count per stanza, consistency.
      *   *Line Length:* Syllable count, variation pattern (e.g., tapering).
      *   *Refrain/Vocables:* Content, placement, function.
      *   *Sonic Devices:* Alliteration, assonance, consonance, repetition.
      *   *Register/Diction:* Formal, colloquial, archaic, playful.
      *   *Punctuation/Enjambment:* How lines flow.
      *   *Melody (if sung):* Syllable count per line, stress pattern, phrasing.
  *   **C. Load-Bearing Test (Per Feature):**
      1.  **Function:** What does this feature *do*? (e.g., Rhyme emphasizes connection X; Tapering enforces feeling Y; Refrain creates ritual Z; Vocables evoke childlike participation).
      2.  **Substitution Test V2:** Imagine replacing/removing it. Ask:
          *   *Semantic Change:* Does the *literal meaning* change? (Often "no" for form).
          *   *Functional Change:* Does the *perceived effect, emotional impact, or core purpose* change for the naive English reader/listener? (e.g., Does removing the taper make it feel less breathless? Does changing the rhyme obscure a key connection? Does altering the vocables lose the sing-along ease?).
      3.  **Verdict:** **Load-Bearing** only if a significant Functional Change occurs. Ambient otherwise.
  *   **D. Identify Core Function:** What is the *primary* thing this song does/is for? (e.g., Tell a story, express grief, create a communal chant, evoke a place, mimic a child's sound play). *This drives the spending order.*

  **Phase 2: Translation & Spending Order (60-90 mins)**
  *   **Spending Order Principle:** **Preserve what serves the Core Function first.** Sacrifice ambient form before load-bearing form. Sacrifice lower-priority load-bearing form if it fatally conflicts with higher-priority items *essential* to the core function. *There is no fixed hierarchy; the Core Function dictates.*
  *   **Decision Sequence:**
      1.  **Literal Sense (Content):** Preserve the meaning identified in Phase 1A. *Start here.*
      2.  **Load-Bearing Form:** Preserve features flagged as load-bearing in Phase 1C.
      3.  **Core Function Delivery:** Ensure the translation *achieves* the Core Function identified in Phase 1D. This may require adjusting literal sense *or* form if the literal English fails the function (e.g., idiom doesn't land).
      4.  **Singability (If Applicable):** For the 4 sung songs, impose syllable count and approximate stress pattern dictated by the melody *now*. Adjust steps 2 & 3 within these constraints.
      5.  **Ambient Form:** Preserve as much as possible without compromising 1-4. Sacrifice freely here.
      6.  **Register/Diction:** Match the source's tone as closely as possible without compromising 1-5.
  *   **Conflict Resolution:**
      *   If two load-bearing features conflict (e.g., Taper + Fixed Syllables from tune), prioritize the feature most critical to the Core Function. (e.g., Is the song *about* running out of breath, or is the taper just a nice effect?).
      *   If preserving load-bearing form requires distorting literal sense *beyond recognition* for the function, revisit Phase 1C - is the form *truly* load-bearing, or is the function misidentified?
      *   **Melody Hard Stop:** If fitting English that preserves Core Function + essential Load-Bearing Form + Literal Sense requires **consistent, unnatural stress** (e.g., em-PHA-sis on THE), **garbled syntax**, or **significant meaning loss**, the song is **not singable in translation.** Proceed to Phase 3.

  **Phase 3: Fidelity Ledger & Output (30 mins)**
  *   Create a **Fidelity Ledger** per song (max 1 page):
      ```
      SONG TITLE: [Title]
      CORE FUNCTION: [e.g., Evoke repetitive longing for home]
      LOAD-BEARING FEATURES: [List from 1C, e.g., Refrain structure, Rhyme on place name, Tapering lines]
      KEY DECISIONS & TRADEOFFS:
          *   Kept: [Feature] - [Justification: e.g., Essential for Core Function (refrain mirrors obsessive thought)]
          *   Sacrificed: [Feature] - [Cost: e.g., Ambient full rhyme] - [Reason: e.g., Required to preserve Load-Bearing place name reference & approximate rhyme]
          *   Sacrificed: [Feature] - [Cost: e.g., Literal sense of phrase X] - [Reason: e.g., Required natural English stress for singing; replaced with idiom conveying same intent]
          *   [If unsingable]: Tune constraints prevent functional translation for singing. Translation provided for reading; song marked unsingable.
      ```
  *   **Output:** The English version + the Fidelity Ledger.

  **Phase 4: Singability Check (For the 4 Songs Only, Post-Translation)**
  *   **Choice of Idiom:** Your choice is **the family's actual singing idiom**. Your goal is words *they* can sing naturally. Mimicking the *original's* French idiom in English often sounds forced. Prioritize natural English stress.
  *   **The Rule (with Stops):**
      1.  Sing your draft aloud *to the tune*.
      2.  **Minor Crunch Allowed:** Small syllable adjustments (elision: "ev'ry"), slight stress shifts on minor words, using contractions.
      3.  **Stop 1 (Warning):** If you need **frequent, awkward crunches**, **distort major word stresses** consistently, or **force unnatural word order** to fit, revisit Phase 2. Can Core Function + Load-Bearing Form be preserved with different wording?
      4.  **Stop 2 (Fail - Unsingable):** If, after revision, fitting the tune still requires:
          *   Consistent, unnatural major word stress.
          *   Garbled or nonsensical syntax.
          *   Significant loss of literal sense *or* core function.
          *   Sacrificing a load-bearing form feature *critical* to the Core Function.
          *   **Then:** Mark this song **"Not Singable in Translation"** in the Ledger. Provide:
              *   A **prose gloss** for understanding the French lyrics.
              *   (Optional) **New English lyrics** written *to the tune* (clearly labelled as such, not a translation). Only do this if the Core Function *can* be served by new words fitting the tune.
              *   *Do not* compromise the Core Function/Load-Bearing Form just for singability.

  ---

  ### Application to Your Three Songs

  **1. Song Ending on Untranslatable Village Name (Rhyme = Reference)**
  *   **Analysis:** Core Function = Evoke deep, repetitive connection to a specific place. Load-Bearing Form: Stanza-ending name (reference + rhyme anchor). Rhyme scheme is structural (load-bearing) because it *is* the reference mechanism. "Noise" to English ear is part of the cost.
  *   **Spending Order:** Literal Sense (meaning of verses) > Place Name Reference (Core Function) > Rhyme Scheme (Load-Bearing, integral to reference) > Meter > Ambient Sound.
  *   **Translation:** Keep the French name. Build approximate English rhymes *around* it (e.g., "down"/"town" rhyming with "Villename"). Sacrifice perfect rhyme fidelity. If impossible, use near-rhyme/assonance. Preserve stanza structure.
  *   **Ledger:**
      *   Kept: Stanza-ending place name - Essential reference & Core Function (connection).
      *   Kept: Rhyme scheme structure - Load-Bearing; integral to emphasizing place name.
      *   Sacrificed: Full/perfect rhyme - Cost: Poetic smoothness - Reason: Required to preserve reference & approximate rhyme on untranslatable name.
  *   **Verdict:** Translatable, but with ambient rhyme sacrificed.

  **2. Song with Vocables Refrain (Sung)**
  *   **Analysis:** Core Function = Create simple, memorable, communal sing-along; evoke childlike sound play. Load-Bearing Form: Refrain structure, exact vocables (sound + ease). Literal Sense = None (vocables). The *sound* and *singability* are paramount.
  *   **Spending Order:** Refrain Vocable Sound/Ease (Core Function & Load-Bearing) > Syllable Count/Stress for Singing > Verse meaning (Literal Sense) > Verse form.
  *   **Translation:** Transcribe the *sound* of the vocables into singable English nonsense (e.g., "Tra la la" -> "Fa la la"). Prioritize matching syllable count and vowel sounds for natural singing over any attempt to impose meaning. Translate verses normally.
  *   **Ledger:**
      *   Kept: Refrain vocables (sound) - Core Function (sing-along, childlike sound) & Load-Bearing.
      *   Sacrificed: Literal meaning in refrain - Cost: None (no meaning present) - Reason: Vocables are non-semantic.
      *   Kept: Syllable count/stress for singing - Essential for Core Function.
  *   **Verdict:** Translatable; prioritize sound over (non-existent) meaning.

  **3. Song with Tapering Lines (Sung, Tune Prevents Taper)**
  *   **Analysis:** Core Function = Express dwindling energy/despair/words. Load-Bearing Form: The tapering line lengths (enacting the core idea). Literal sense describes running out. The taper *is* the primary enactment of the Core Function.
  *   **Conflict:** Tune requires fixed syllable counts per line, preventing taper.
  *   **Spending Order:** Core Function (dwindling) > Load-Bearing Form (Taper) > Literal Sense > Singability > Fixed Meter/Rhyme.
  *   **Translation Attempt 1:** Try fitting the taper within the tune's phrasing. Can melodic phrases shorten? (Unlikely, but check).
  *   **Translation Attempt 2:** If tune is rigid, prioritize Load-Bearing Taper over fixed tune syllables. Result: Unsingsble *to the original tune*. Mark as such.
  *   **Alternatives:**
      *   *For Reading:* Translate preserving taper. Ledger notes sacrifice of singability.
      *   *For Singing (New Lyrics):* Write *new* English words *to the tune* that *evoke* dwindling (e.g., shorter words, sparser imagery, fading repetitions) without shortening lines. Clearly label as "Singing Adaptation based on Theme".
      *   *For Singing (Compromise):* If family prefers singing literal translation, use fixed lengths but emphasize dwindling through diction/repetition (weakest option, sacrifices core form). Ledger must note this heavy cost.
  *   **Ledger (If preserving taper renders unsingable):**
      *   Kept: Tapering line lengths - Core Function (dwindling) & Load-Bearing Form.
      *   Sacrificed: Singability to original tune - Cost: Cannot be sung as intended - Reason: Load-Bearing Taper conflicts with tune's fixed syllable requirement. Song marked "Not Singable in Translation" for booklet. Prose gloss provided.
  *   **Verdict (The one you won't want to hear):** **This song likely cannot be both faithfully translated *and* sung to the original tune.** The taper is load-bearing. The hard stop is triggered. Provide prose gloss + reading translation. Offer *new* singing lyrics as an optional alternative.

  ---

  ### What the Procedure Cannot Do

  1.  **Resolve Subjective "Would Have Wanted" Questions:** It handles *what the text permits and requires*. Decisions about the artist's hypothetical preferences (e.g., "Would he prefer sung nonsense or a meaningful refrain?") are beyond the procedure. The ledger documents the textual rationale; the executor/family must decide based on their knowledge of him.
  2.  **Compensate for Lack of Basic Prosodic Awareness:** It assumes you can identify meter, count syllables, hear approximate rhyme, and recognize unnatural English stress. If you struggle significantly here, the analysis (Phase 1B/C) and singability check (Phase 4) become unreliable. (Simple tools: online syllable counters, reading aloud relentlessly).
  3.  **Guarantee Poetic Quality:** It ensures reasoned trade-offs, not brilliance. A technically sound translation can still be flat.
  4.  **Eliminate Judgment Calls:** Identifying Core Function and Load-Bearing status involves interpretation. The ledger forces you to justify these calls transparently.
  5.  **Answer "Should it be Translated?":** For the vocables song, the procedure handles it. For others, it presumes translation is the goal, only advising against *singable* translation when fidelity is impossible (Song 3). The question of *any* translation is a separate, potentially ethical/artistic one for you/executor. The procedure would show Song 3 *can* be translated for reading.
  6.  **Make Uniformity the Default Ideal:** Applying the *same process* 34 times is good practice. However, it *will* yield different *decisions* per song because Core Function and Load-Bearing features differ. Forcing uniform *outcomes* (e.g., always sacrificing rhyme) would be a distortion. The procedure's uniformity is methodological, not prescriptive in outcome.
  7.  **Prevent the Ledger from Becoming the Product:**
      *   **Risk:** Yes, it can happen if you focus more on justifying compromises than crafting the best *version*. Overly detailed ledgers invite micromanagement.
      *   **Mitigation:**
          *   **Draft First:** Sketch a quick translation *before* deep analysis. See what emerges intuitively. *Then* apply the procedure to refine/justify.
          *   **Limit Ledger Scope:** Keep justifications in the ledger **succinct and functional** ("Preserved Refrain structure - Core Function: Communal ritual"). Avoid literary critique.
          *   **Remember the Goal:** The ledger serves the *version*, not vice-versa. Its purpose is accountability and clarity for the daughter, not exhaustive defense.

  This procedure provides a clear, auditable path through complex choices. It forces identification of what truly matters in each song, makes unavoidable sacrifices explicit, and provides a defensible record for your non-specialist approver, while acknowledging its own limits and the inherent challenges of song translation. Good luck with this meaningful tribute to your friend.
