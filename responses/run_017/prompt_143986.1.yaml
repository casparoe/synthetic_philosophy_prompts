prompt: |-
  pls act as a professional philosopher who works on social epistemology and has spent a lot of time on the peer disagreement literature. Before you write the quiz itself, spend a couple of paragraphs brainstorming which cases actually do the discriminating work -- I don't want something that just re-asks 'should you defer to people who disagree with you?' in ten different phrasings.

  Why I need it: I sit on a two-person funding committee with a colleague I respect a lot, we've now deadlocked three times over which applicants to shortlist, we've both read the same files, and neither of us can find a mistake in the other's reasoning. I keep flip-flopping between thinking holding my ground is just dogmatism and thinking that folding every time would be its own kind of vice, and I want something sharper than that oscillation.

  So: write me a 'what do you actually think about peer disagreement?' quiz, 8-10 questions, that sorts readers by what they say about concrete little scenarios rather than by which label they'd pick for themselves. Each question a short case with two or three options. Please build in cases that seperate at least these things: disagreement as evidence about the world versus disagreement as evidence about me and my reliability; whether it matters that I already knew in advance she'd disagree on this kind of case (I did -- we always split on these); whether the number of people on the other side matters, and whether it matters if their errors are probably correlated; a case where we disagree about whether we're even peers; a case where the disputed claim isn't gradable, so 'split the difference' has to cashed out as something else (suspension? hedging to the disjunction?); and a case where the disputed claim is itself about what one should believe when a peer disagrees, i.e. the view pointed at itself.

  Then a scoring key mapping answer patterns onto the named positions -- full conciliationism, the weaker weighted versions, steadfastness, the total-evidence view, whatever else belongs -- plus at least two combinations of answers nobody actually occupies, with one line each on why (incoherent, unattractive, or just unexplored). And flag any pair of positions your quiz genuinely can't tell apart instead of pretending it can. Keep the total output under about 900 words if you can.
