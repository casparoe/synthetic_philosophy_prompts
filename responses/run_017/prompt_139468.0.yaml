   If we eliminate U, then the game is:

          L    R
      M   2    0
      D   0    1

   In this game, for the row player, M and D are not weakly dominated because against L:2>0, against R:0<1.

   If we eliminate something else first? 
   The only weakly dominated strategy is U.

   So not.

   I found a standard example in some notes ( using two players). 

   Player 1 has U, D.
   Player 2 has L, R.

   Payoffs (P1, P2):
          L    R
      U   0,0  0,1
      D   1,0  0,0

   For player 1, U is weakly dominated by D: 
   - against L:0<1
   - against R:0=0

   For player 2, L is weakly dominated by R: 
   - against U:0<1
   - against D:0=0

   If we first eliminate player 1's weakly dominated strategy U, then the game becomes:

          L    R
      D   1,0  0,0

   Then for player 2, L is now strictly better than R against D (0 for R and 0 for L. -> wait, (D,L): (1,0) and (D,R): (0,0). So for player 2, R is now strictly dominated by L? because 0<0? no, they are equal. 

   In (D,L): player 2 gets 0.
   In (D,R): player 2 gets 0.
   So not dominated.

   If we first eliminate player 2's weakly dominated strategy L, then the game becomes:

          R
      U   0,1
      D   0,0

   Then for player 1, both U and D give 0, so we can't eliminate.

   So the surviving set depends on order: 
   - If we eliminate U first, then we have (D,L) and (D,R) with payoffs (1,0) and (0,0), and player 2 is indifferent between L and R.
   - If we eliminate L first, then we have (U,R) and (D,R) with payoffs (0,1) and (0,0), and player 1 might choose U to give player 2 more, or not.

   So the set of surviving strategies is different.

   For the whiteboard, we can illustrate with this game.

   So for requirement 4, we use this 2x2 game for two players and show the two orders.

   Now, for the three-player part (requirement 5), we want to expose the independence assumption.

   We design a three-player game, each with two strategies. We want a mixed strategy for player 1 that, if the other two are independent, might seem to dominate, but if they are correlated, it doesn't.

   For example, we can have a game where player 1 chooses A or B.
   Players 2 and 3 choose Left or Right.
   The payoff of player 1 might be high only if both 2 and 3 choose the same action, and low otherwise.

   But then a mixed strategy might not dominate if the other two are correlated.

   Specifically, let player 1's payoffs:

   If player 1 plays A: gets 1 if both 2 and 3 are Left, 0 otherwise.
   If player 1 plays B: gets 0 if both are Left, 1 otherwise.

   Now, consider a mixed strategy of A and B: it will give 0.5 in expectation if the others are independent and symmetric.

   But now, if we consider a pure strategy C for player 1 that is also available: C that gives 0.5 always.

   Then the mixed strategy of A and B (50-50) gives 0.5 on average if the others are independent, but it also gives 0.5 in every correlation? Let's compute.

   If the others are both Left (which can happen even if independent, but also if they are correlated to both choose Left), then:
   - A: 1, B:0 -> mixture: 0.5.
   - C: 0.5.

   If the others are both Right, then:
   - A:0, B:1 -> mixture:0.5.
   - C:0.5.

   If one Left and one Right, then:
   - A:0, B:1 -> mixture:0.5.
   - C:0.5.

   So the mixture always gives 0.5, and C gives 0.5, so it doesn't dominate.

   We need a example where the mixed strategy seems to dominate C when independence is assumed, but when there is correlation, C might be better.

   Example: 

   Player 1: strategies A, B, C.
   Players 2 and 3: strategies L, R.

   Payoff for player 1:
   - If play A: gets 6 if both are L, 0 otherwise.
   - If play B: gets 6 if both are R, 0 otherwise.
   - If play C: gets 3 always.

   Now, if players 2 and 3 are equally likely and independent, then:
   - P(both L) = 0.25, so expected payoff of A: 6*0.25 = 1.5.
   - P(both R) = 0.25, so expected payoff of B: 1.5.
   - C: 3.

   So C is better than both A and B, and also better than any mixture of A and B (which would be at most 1.5). So C is not dominated.

   But we want a mixed strategy of A and B to dominate C. Clearly not.

   How about if C gives 1.4 always.

   Then against independent and uniform:
   - A: 1.5, B:1.5, any mixture:1.5.
   - C:1.4.

   So a mixture of A and B would give 1.5>1.4, so it dominates C.

   But now, if players 2 and 3 are correlated: for example, they both always choose L. Then:
   - A:6, B:0, mixture (say 50-50): 3.
   - C:1.4.
   Here, the mixture gives 3>1.4, and also A gives6, B gives0.

   But if they are correlated in a way that they always choose opposite, then:
   - both L:0, both R:0, so if they are always opposite, then both events have probability 0.
   - then A:0, B:0, mixture:0.
   - C:1.4.
   In this case, the mixture gives 0<1.4.

   So if the others are correlated to always choose opposite, then the mixture gives 0, while C gives 1.4, so C is better.

   Therefore, the mixed strategy (50-50 A and B) appears to dominate C (1.5>1.4) if we assume independence, but if the others are perfectly negatively correlated, then the mixture gives 0 on average, which is worse than C.

   This illustrates the point.

   However, in the time available, we might only have time to explain it on the whiteboard and not play it.

