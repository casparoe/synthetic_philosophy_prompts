answer: |-
  ### Session Design: Iterative Elimination via Mixed Strategy Dominance

  **Objective:** Participants experience iterative elimination of strategies using mixed strategy dominance, highlighting the cascade effect and the distinction between dominance (as a reasoning tool) and advice (optimal play given behavior).

  ---

  ### **Materials & Setup**
  - **Handouts:** Printed payoff tables (one per participant per game) and decision cards.
  - **Counters/Dice:** For randomizing mixed strategies (if needed in debrief).
  - **Whiteboard:** For debrief, cascade tracking, and coda.
  - **Stakes:** Trivial (e.g., winner chooses next game, chocolate bar).
  - **Group Size:** 12–16 participants (split into pairs for games).

  ---

  ### **Timeline (90 min)**
  1. **Introduction (5 min):**  
     - Explain the session’s theme: "We’ll play games where you cross out options by comparing them to mixtures of others. Your goal is to avoid being outsmarted."  
     - No prior knowledge of mixed strategies needed. Use plain language: "mixture" = "sometimes A, sometimes B."

  2. **Game 1: Cascade Elimination (35 min)**  
     - **Rules:**  
       - Players: Pairs (Row vs. Column).  
       - Payoff Table 1 (below). Row maximizes, Column minimizes.  
       - 5 rounds of play. Each round: Both players secretly choose a strategy, then reveal. Record payoffs.  
       - After each round, players discuss: "What strategies do you want to cross out? Why?"  
     - **Payoff Table 1 (Row’s Payoffs; Zero-Sum):**  
       ```
          |       | Col L | Col M | Col R |
          |-------|-------|-------|-------|
          | Row A |     4 |     1 |     2 |
          | Row B |     0 |     3 |     4 |
          | Row C |   1.5 |     2 |   1.5 |
          | Row D |     1 |     0 |     3 |
       ```
     - **Process:**  
       - Play 3 rounds. Then hand out **Hint Card 1:**  
         > "Compare Row C to a *mixture*: 40% A + 60% B.  
         > - Against L: (0.4×4) + (0.6×0) = 1.6 > 1.5  
         > - Against M: (0.4×1) + (0.6×3) = 2.2 > 2  
         > - Against R: (0.4×2) + (0.6×4) = 3.2 > 1.5  
         > So, C is worse than this mixture against *every* Column move. Cross out C!"  
       - Play 2 more rounds (without C). Then hand out **Hint Card 2:**  
         > "After crossing out C, Column R is strictly worse than M:  
         > - Against A: M(1) < R(2)  
         > - Against B: M(3) < R(4)  
         > - Against D: M(0) < R(3).  
         > Cross out R!"  
       - **Final Elimination:**  
         - New Table (A, B, D vs. L, M). Hand out **Hint Card 3:**  
           > "Compare Row D to 30% A + 70% B:  
           > - Against L: (0.3×4) + (0.7×0) = 1.2 > 1  
           > - Against M: (0.3×1) + (0.7×3) = 2.4 > 0  
           > D is worse than this mixture. Cross out D!"  
     - **Debrief (5 min):**  
       - "Who was surprised C/D were eliminated? Why couldn’t you see this at the start?"  
       - Highlight: C wasn’t beaten by A or B alone, but by a **60% B-heavy mixture**. D survived initially but died later.

  3. **Game 2: Hedge vs. Advice (25 min)**  
     - **Rules:** Same as Game 1.  
     - **Payoff Table 2 (Row’s Payoffs):**  
       ```
          |       | Col X | Col Y |
          |-------|-------|-------|
          | Row A |     0 |    10 |
          | Row B |    10 |     0 |
          | Row C |     4 |     4 |
       ```  
     - **Process:**  
       - Play 5 rounds. Let players "discover" that Column often plays X (empirical trend).  
       - **Hint Card:**  
         > "Mixture (50% A + 50% B) dominates C:  
         > - Against X: (0.5×0) + (0.5×10) = 5 > 4  
         > - Against Y: (0.5×10) + (0.5×0) = 5 > 4.  
         > Cross out C!"  
       - **Key Twist:** Calculate expected values against *actual* play (e.g., 80% X):  
         - C: 4  
         - Mixture: (0.5×0 + 0.5×10)×0.8 + (0.5×10 + 0.5×0)×0.2 = 5  
         - **But** B gives 10 against X!  
         - *Mixture dominates C, but B is better against empirical play.*  
     - **Debrief (5 min):**  
       - "Why is crossing out C still valid? Should you *play* the mixture?"  
       - Distinguish:  
         - **Dominance:** "C is *never* part of a guaranteed-better plan (beaten by mixture)."  
         - **Advice:** "Against *this* Column, play B (higher payoff)."  

  4. **Coda: Weak Dominance Warning (10 min)**  
     - **Whiteboard Example (2 Players):**  
       ```
          |       | Col L | Col R |
          |-------|-------|-------|
          | Row U |  0,0  |  0,1  |
          | Row D |  1,0  |  0,0  |
       ```  
     - **Demonstration (with Volunteers):**  
       - **Order 1:** Eliminate Row U (weakly dominated by D: against L, 0<1; against R, 0=0). Then eliminate Col L (dominated by R in reduced game). Surviving: (D, R).  
       - **Order 2:** Eliminate Col L (weakly dominated by R: against U, 0<1; against D, 0=0). Then no dominance: (U, R) and (D, R) survive.  
     - **Key Point:** "Order matters if you delete weakly dominated strategies. This cascade isn’t reliable!"  

  5. **Optional Three-Player (Time-Permitting, 10 min):**  
     - **Game:** Players 2 and 3 choose L/R independently. Player 1 chooses A/B/C.  
       - Payoff (Player 1):  
         - A: 6 if both L, 0 otherwise.  
         - B: 6 if both R, 0 otherwise.  
         - C: 1.4 always.  
       - **Mixture (50% A + 50% B):**  
         - *If independent:* P(both L) = P(both R) = 0.25 → Expected payoff = (0.25×6) + (0.25×6) = 3 > 1.4 (dominates C).  
         - *If correlated (e.g., always opposite):* Payoff = 0 < 1.4 (C beats mixture).  
     - **Difficulty:** Requires understanding correlation vs. independence. Likely too abstract for 10 min. If short on time, skip and state:  
       > "Mixing assumes opponents act independently. If they coordinate (e.g., one always L, one always R), the hedge fails."  

  ---

  ### **Handout Text (Given to Participants)**  
  **Game 1 & 2 Rules:**  
  - You are **Row** (maximize your payoff) or **Column** (minimize Row’s payoff).  
  - Play 5 rounds. Each round:  
    1. Secretly choose a row/column.  
    2. Reveal choices. Record payoffs.  
    3. Discuss: "What should we cross out? Why?"  
  - **Goal:** Avoid being outsmarted in the long run.  

  **Tables (Print Separately):**  
  - **Table 1 (Cascade):**  
    ```plaintext
    Row \ Col | L    | M    | R    
    ----------|------|------|------
    A         | 4    | 1    | 2    
    B         | 0    | 3    | 4    
    C         | 1.5  | 2    | 1.5  
    D         | 1    | 0    | 3    
    ```  
  - **Table 2 (Hedge vs. Advice):**  
    ```plaintext
    Row \ Col | X    | Y    
    ----------|------|------
    A         | 0    | 10   
    B         | 10   | 0    
    C         | 4    | 4    
    ```  

  ---

  ### **Debrief & Key Insights (10 min)**  
  - **Cascade Logic:**  
    - "You crossed out C because a **40% A + 60% B mixture** beat it everywhere. But B looked weak alone against L (0 vs. C’s 1.5)!"  
    - "D survived initially but died after R was eliminated. Cascades reveal steps you couldn’t foresee."  
  - **Hedge vs. Advice:**  
    - "The mixture crossed out C, but in Game 2, playing B was smarter against actual play. Dominance ≠ advice!"  
  - **Objections Addressed:**  
    - **"Why randomize? I don’t care about unpredictability."**  
      - "Randomizing helps *reason* about dominance. You don’t need to *play* the mixture—just use it to eliminate options."  
    - **"Why assume others reason like me?"**  
      - "We assume others also eliminate dominated strategies. If they don’t, empirical adjustments (like in Game 2) are needed."  
  - **What Could Go Wrong:**  
    - **Players ignore eliminations:** If someone plays a "crossed-out" option (e.g., C in Game 1), show them the mixture math. Let them see it underperforms.  
    - **Coda confusion:** Use the whiteboard to stress weak dominance is "fragile"—order matters.  
  - **Limitations:**  
    - The activity *shows* the cascade and hedge/advice distinction but can’t *prove* mixed strategies are rational. State at the end:  
      > "Randomizing *can* be optimal if you want to be unpredictable, but today’s goal is *reasoning*, not prescribing play."  

  ---

  ### **Instructor Notes**  
  - **Empirical Tracking:** In Game 2, tally Column’s moves on the whiteboard to calculate empirical frequencies.  
  - **Cascade Resistance:** Players may resist crossing out C (Game 1) since B "looks bad" against L. Use Hint Card 1 to force the issue.  
  - **Time Management:** Skip the three-player section if behind. Focus on nailing Games 1–2 and the coda.  
  - **Philosophical Close:** "This tool helps trim options *without* predicting others. But real play? Watch the room—and adapt."  

  This session makes mixed strategy dominance visceral, highlights cascades, and divorces dominance from advice. The coda warns against slippery weak dominance, and the three-player teaser (if included) exposes the independence assumption.
