prompt: |-
  So me and my flatmate Priya have been going round in circles about prostitution policy for about two years now and we want to try the adversarial collaboration thing, where you produce the document we'd both actually sign at the end. She's firmly in the camp that sex work is work and should be fully decriminalised (New Zealand style, no special licensing regime, normal labour and safety law applies, third parties allowed like in any other job), and I'm the one who thinks the Nordic model is basically right: decriminalise the person selling, keep criminalising the buying, put real money into exits. We both keep using Germany and the Netherlands as evidence against each other and I suspect we're not even agreeing on what those setups are, so the document has to sort that out too.

  Rules: please don't give us any citations, studies, reports, or percentages. No "a 2010 evaluation found that X went down by Y". We've both read enough to have priors and we want the structure of the argument, not a bibliography — pretend we're in a room with no internet and just our own reasoning. And plain language please, we're not academics, but don't smooth the disagreements into mush either.

  What I want:

  A numbered section of agreed claims. I mean substantial ones, not "we both want people to be safe" — things like what we think the actual goal of policy is, what we think the current situation does to people, what we think the state is for, what we believe about how many people sell sex and why, what we think the buyers are like, and what we believe about the German/Dutch systems versus the New Zealand one versus the Nordic one. If there's something surprising buried in there that we agree on, say so explicitly.

  Then a table of the disagreements, one per row, with columns: (1) the disagreement in wording neither of us would object to, (2) how I would put my own view, in words I'd sign, (3) how Priya would put hers, in words she'd sign, (4) whether you think this row is a real disagreement or a fight about words, (5) what piece of evidence or what concrete case both of us would accept as bearing on it, (6) what I'd predict we'd find, and (7) what Priya would predict — written down in advance, before either of us gets to see the answer.

  Some things I want covered, add more if you spot them:

  - Whether the German/Dutch licensed-brothel model tells us anything about New Zealand style decriminalisation. Priya says they're different animals because registration, brothel licensing and zoning create a two-tier market and push anyone who's not a citizen or resident outside the legal bit. I say the direction of travel is the same and that decrim ends up looking like that in practice anyway.
  - Whether the goal is a smaller sex industry or better conditions and rights for the people already in it, and whether "shrinking the market" is even something you could in principle measure. I think this is where we're really split.
  - Third parties. Test case: four women share a flat, work from it, and split the cost of hiring one person to do door security and another to do their books and taxes; nobody takes a percentage of anybody else's earnings. Is that a pimp? What about the landlord who knows, the taxi driver who drives them, the person who builds their website, the friend who babysits?
  - The boring stuff that I think might break her view: if you can't declare the income without losing disability benefits or housing benefit, or if you have no immigration status, decriminalisation doesn't obviously help you at all. What does each position owe people in that situation?
  - Remote stuff — camming, subscription content, no physical contact, no client in the room. Does my logic even reach that? Does hers?
  - What we each think a buyer is: perpetrator, customer, or just some guy. And whether that matters for what the law should do.

  Finally, for each crux, say honestly which one of us would actually move if it came out the other way, and which one of us you suspect would quietly move the goalposts. And if you think part of our two-year argument was never about anything real, tell us which part and why.
reasoning: |-
  Hmm, I see what this user is asking for. They've been stuck in a two-year debate with their flatmate Priya about prostitution policies, specifically comparing Nordic model (criminalize buyers) versus New Zealand-style full decriminalization. They want me to create a structured adversarial collaboration document that captures both viewpoints without new evidence - just clarifying their existing positions.

  The user has very specific rules: no citations or statistics, only plain language, and they want substantial agreements listed first. Then a detailed disagreement table covering key issues like the relevance of German/Dutch models, industry size goals, third-party roles, practical barriers for vulnerable workers, online sex work, and buyer characterization. 

  I notice several layers to this request:
  - They need help crystallizing years of circular arguments into clear positions
  - They want to identify where they actually agree versus where core disagreements lie
  - They suspect some disagreements might be semantic rather than substantive
  - They're particularly interested in how different regulatory models actually function in practice
  - Underlying this is fatigue from repetitive debate and hope that structure will create progress

  The challenge is maintaining strict neutrality while still providing the sharp analysis they want - not smoothing over differences but not amplifying conflicts either. Their prohibition on external evidence means I have to work entirely within their stated frameworks.

  For the agreements section, I'll identify common ground on basic principles: policy goals, state responsibilities, worker autonomy, and critiques of prohibition. The disagreements table needs careful wording to satisfy both sides' phrasing preferences while exposing genuine fault lines. The German/Dutch comparison seems particularly messy - I'll need to show why they interpret the same systems differently.

  Practical barriers like benefit cliffs and immigration status are crucial - this exposes limitations in both models. The third-party question is philosophically interesting about where "exploitation" begins. And buyer characterization reveals their deepest moral divergence.

  The prediction columns will be tricky since they can't cite studies, but I can frame testable hypotheses about what each would expect to see in various scenarios. The honesty about who'd move positions might sting but could be valuable.

  Ultimately this document could help them either find compromise or at least understand why compromise is impossible - both valuable outcomes after two years of circular debate.
answer: |-
  Below is a structured adversarial collaboration document reflecting your 2-year debate with Priya. It adheres to your rules: no citations, plain language, numbered agreements, and a disagreement table with predictions. Key surprises in agreements are highlighted.

  ---

  ### **Agreed Claims**  
  *(Substantial shared premises – signed by both)*  

  1.  **Core Goal:** The primary objective of any policy should be to reduce harm experienced by people selling sex. "Harm" includes violence, coercion, exploitation, disease, stigma, psychological trauma, and barriers to leaving the trade.
  2.  **State's Role:** The state has a responsibility to protect vulnerable people from harm, uphold human rights (including bodily autonomy and safety), and ensure access to justice and support services.
  3.  **Current System Fails:** Criminalizing the *sellers* (full prohibition) is harmful, dangerous, and counterproductive. It pushes the industry underground, increases violence, prevents access to justice/police, and stigmatizes workers.
  4.  **Not All Selling is Equal:** People sell sex for vastly different reasons (survival, debt, addiction, coercion, genuine choice, flexibility, etc.). A policy must account for this spectrum without assuming one universal experience.
  5.  **Exits Matter:** Genuine, well-funded exit programs (housing, healthcare, job training, financial support, therapy) are essential *regardless of the legal model*. Neither model assumes everyone wants to or can exit immediately.
  6.  **Buyers Exist on a Spectrum:** Buyers range from violent predators to lonely individuals seeking connection/companionship. Most fall somewhere in between. Neither of us believes *all* buyers are inherently monsters or inherently harmless.
  7.  **Online/Remote Sex Work is Distinct:** Camming, subscriptions, and digital content creation involve different risks, dynamics, and policy considerations compared to in-person sex work. They are generally lower risk regarding physical violence and disease transmission.
  8.  **German/Dutch Systems Have Problems:** Both acknowledge that the regulated brothel/licensing models in Germany and the Netherlands have significant flaws:
      *   Creates a two-tier system (legal vs illegal).
      *   Pushes marginalized workers (migrants, undocumented, drug users) into the illegal, riskier tier.
      *   Bureaucracy and licensing can be barriers to entry/safety for individuals.
      *   Doesn't eliminate exploitation or trafficking within the legal sector.
  9.  **Nordic Model Intent:** Aims to reduce demand (shrinking the market) to ultimately reduce exploitation, while decriminalizing sellers to reduce harm *to them* and encourage reporting/victim support. *(Surprise: We agree on its stated intent, even if we disagree on its effectiveness/ethics).*
  10. **NZ Model Intent:** Aims to normalize sex work as labor, granting workers full legal rights, improving safety through regulation/policing access, and reducing stigma by removing criminality. *(Surprise: We agree on its stated intent, even if we disagree on its outcomes/feasibility).*

  ---

  ### **Table of Disagreements**

  | #  | Core Disagreement (Neutral Wording)                                                                 | Your View (Nordic Model Proponent)                                                                                                                         | Priya's View (Full Decrim Proponent)                                                                                                                                             | Real Disagreement or Semantics? | Concrete Test Case / Evidence                                                                 | Your Prediction                                                                                                | Priya's Prediction                                                                                                                                                          | Who Moves? / Goalposts?                                                                                            |
  | :-- | :-------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------ | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- |
  | 1   | **Does the German/Dutch model predict the outcome of NZ-style decriminalization?**                  | Yes. Full decrim inevitably leads towards state regulation (licensing, zoning, health checks) to manage the industry, creating similar hierarchies & problems. | No. German/Dutch is *regulation*, NZ is *decriminalization*. Forcing licensing creates illegality; NZ treats it like any job, avoiding that tier. The core principles differ fundamentally. | **Real Disagreement**           | Compare reported rates of *unlicensed* sellers & associated harms (violence, exploitation) under NZ vs Germany/Netherlands. | **You:** Higher rates of unlicensed work & harms in Germany/Netherlands than NZ, proving licensing creates tiers. | **Priya:** Similar or lower rates in Germany/Netherlands vs NZ, driven by other factors (migration policy, welfare), proving regulation itself isn't the driver.          | **You likely move slightly** if data shows NZ has significantly less unlicensed work/harm. **Priya might shift goalposts** to other factors causing harm in DE/NL.           |
  | 2   | **Should policy explicitly aim to shrink the overall market for paid sex?**                          | Yes. Reducing demand is essential to reducing exploitation and harm long-term. A smaller market means fewer vulnerable people drawn in or trapped.           | No. The goal is harm reduction *within* the existing market by empowering workers. Shrinking the market pushes it underground, harming current workers without eliminating demand. | **Real Disagreement**           | Can we measure "market size"? Look at trends in street-based vs indoor work visibility post-policy shift. | **You:** Under decrim (NZ), visible market size increases. Under Nordic, visible market size decreases.         | **Priya:** Under decrim (NZ), visibility increases (workers feel safer) but actual market size may not change dramatically. Under Nordic, market goes underground, harder to measure. | **Neither likely moves much.** You see visibility as proxy for size/acceptance. Priya sees it as proxy for safety. Fundamentally different goals. |
  | 3   | **Are non-exploitative third parties compatible with safety/autonomy?** (Flatmate example)          | Risky. Even "supportive" third parties (security, bookkeeper, landlord) create dependencies and potential for control/coercion over time. Best minimized.   | Yes. Like any independent worker (hairdresser, cleaner), sellers should access services (security, admin, premises) without stigma. Banning 3rd parties isolates workers.        | **Real Disagreement**           | Survey workers in NZ-style systems: Do they feel safer/more autonomous *with* access to shared services like security/bookkeeping vs working completely alone? | **You:** Many report pressure, loss of autonomy, or hidden fees from 3rd parties, even in "co-op" setups.       | **Priya:** Majority report increased safety, efficiency, and autonomy by pooling resources for essential services.                                                          | **You might move** if strong evidence shows clear worker preference & safety benefit. **Priya unlikely to move.**    |
  | 4   | **Does decriminalization help marginalized sellers (undocumented, on benefits)?**                   | Limited. Decrim alone doesn't solve structural issues (immigration status, benefit cliffs). They remain vulnerable to exploitation *within* the legal/decrim system. | Crucial first step. Decrim removes fear of arrest, enabling access to *some* justice/services. It's foundational for tackling other structural issues (which also need reform). | **Real Disagreement**           | Compare reporting rates of crimes/violence to police by marginalized sellers *before* and *after* decriminalization (NZ case). | **You:** Marginal increase only; fear of authorities (deportation, benefit loss) persists despite decrim.         | **Priya:** Significant increase; decrim builds trust, allowing focus on *real* crimes against them, even if other vulnerabilities remain.                                | **Priya might move slightly** if data shows little increase. **You might shift goalposts** to "but they still can't access exits". |
  | 5   | **Should buyers be criminalized?**                                                                  | Yes. Buying sex perpetuates exploitation and is the root driver of harm. Criminalization deters demand and affirms societal disapproval of commodifying bodies. | No. Criminalizing buyers pushes the market underground, making sellers *less* safe (rushed negotiations, hidden locations). Treating buyers as criminals ignores the spectrum of transactions. | **Real Disagreement**           | Compare rates of violence against sellers and willingness to screen clients/report violence under Nordic Model vs NZ Model. | **You:** Lower violence under Nordic due to deterred demand; sellers more willing to report buyers as perpetrators. | **Priya:** Higher violence under Nordic due to rushed transactions/clandestine nature; sellers *less* willing to involve police for fear of losing clients/income.     | **Core Stalemate.** Data is contested. Unlikely either moves significantly; reflects deep moral difference on commodification vs autonomy. |
  | 6   | **Does the Nordic/NZ logic apply to remote sex work?**                                              | Less relevant. Remote work lacks immediate physical risk. Criminalizing *buying* pixels makes no sense. Focus should be on labor rights/platform regulation. | Fully applies. It's still sex work. Decriminalization protects workers from platform deplatforming, payment issues, harassment, and ensures labor rights (e.g., copyright).       | **Semantics (mostly)**          | Is there any push to criminalize *buying* online content? Evaluate worker priorities for online safety (e.g., privacy, payment security vs physical safety). | **You:** Worker needs are fundamentally different (digital security, contract enforcement); Nordic logic doesn't fit. | **Priya:** Core principle is the same: workers need rights and safety, best achieved by decrim/normalization, not criminalizing any party.                               | **You likely concede** criminalizing buyers online is absurd. **Priya likely concedes** primary risks differ. Real agreement possible on labor rights focus. |

  ---

  ### **Honest Assessment**

  1.  **What Was Never Real?** Part of the Germany/Netherlands vs NZ argument is semantic confusion ("regulation" vs "decriminalization"). You both agree the German/Dutch *implementation* has flaws, but disagree on whether those flaws are inherent to *any* system allowing third parties/licensing (Your view) or are artifacts of poor *regulation design* (Priya's view). The energy spent arguing "what Germany proves" could be redirected to the core disagreement (#2 - shrinking the market).
  2.  **Who Moves?**
      *   **On Evidence:** Priya seems more open to evidence impacting her view on the practical outcomes of third parties (#3) and marginalized workers (#4). You seem more anchored in the moral premise of criminalizing buyers (#5) and shrinking the market (#2).
      *   **Goalpost Moving:** You are more likely to shift the focus to structural issues (#4) or the fundamental moral objection (#5) if evidence on practical harms under decrim is challenging. Priya is more likely to attribute problems in systems like Germany/Netherlands to factors *other* than the core decrim principle (#1).
  3.  **Breaking the Circle:** The deepest split is **Disagreement #2** (Shrink the market vs Improve conditions within it). This is fundamentally about the *primary goal* and reflects different weightings of future prevention vs current harm reduction. Until you explicitly acknowledge this as the core divergence and discuss whether compromise is possible (e.g., "reduce exploitation" as a shared metric, not "market size"), the circles will continue. The buyer criminalization (#5) flows directly from this. The third-party (#3) and marginalized worker (#4) debates are downstream practical consequences.

  ---

  **To Sign:** This document accurately reflects our substantial areas of agreement and clearly defines the core disagreements between our positions on sex work policy, including our differing interpretations of existing models and predictions about outcomes. We commit to using this framework for future discussion.  
  (Signature Line for You)  
  (Signature Line for Priya)
