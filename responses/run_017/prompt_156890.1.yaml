prompt: |-
  I have been reading about the no-free-lunch theorems in machine learning alongside the older philosophical debate about induction, and I keep running into a pattern of argument that I cannot put a name to. I would like to know whether it has one. If it does not, I would like a coinage and a careful definition; if it does, I would like to know exactly how it is bounded, because the nearest things I have found seem to fit only partly, and a bare label would not tell me what I want to know.

  Three cases where I think I am seeing the same thing.

  First: the standard way of dismissing a no-free-lunch result is to point out that the averaging is over all possible target functions, or all possible problem distributions, whereas the problems we actually face are concentrated on ones that are smooth, or low in complexity, or otherwise structured. When I ask what entitles us to that concentration, the answer always comes back to our experience of which kinds of problem have turned out to be tractable. So a substantive empirical claim about the world, of precisely the kind the skeptical argument was about, is introduced as a technical remark about the measure, and presented as a defect in the theorem rather than as a bet on the world.

  Second: the meta-level reply. Instead of defending a bias toward simple hypotheses, one hedges: track whichever forecaster in a pool has been doing best, and rely on results saying that in the long run you will not do much worse than the best member of the pool. I have tried sketching this in a harsher setting, and it is here that I lose my grip. Suppose the choice of problem distribution is made by someone who gets to see, first, which pool you are tracking and how you weight its members. Or suppose a world in which every member of the pool fails at the same rate. In both cases the guarantee I described seems to be fully satisfied and entirely worthless: it is a guarantee against being the worst, not a prospect of being right, and whether anyone in the pool succeeds looks like just the empirical assumption from the first case, now relocated one level up.

  Third: the same shape seems to appear outside the formal setting. People recommend restricting attention to hypotheses that are computable, or finitely specifiable, or projectible, and when asked why, they say either that such hypotheses have worked before, or that some restriction is needed in order to get started at all and this one is cheap. Those two answers strike me as different in kind, and I suspect they get treated as interchangeable because both are replies to the same pressure.

  My own attempt at a formulation, which I distrust: every available answer to a global tie result of this sort works either by reintroducing as a premise about the space of possible worlds the very empirical claim the tie result made problematic, or by changing the currency from an absolute guarantee to a comparative one that is conditional on someone succeeding. What I want from an answer:

  Say whether these three cases really share a structure, or whether I have conflated two or three distinct things; if the latter, tell me which case is the odd one out and why.

  Set out the nearest established concepts and, for each, the respect in which the thing I have described does not fit. I have in the back of my mind the old circularity worry about justifying induction by induction, the older pragmatic strategy that argues only that if any method can work then this one will, the puzzle about which predicates may be projected, and the general difficulty of choosing a prior or a reference class; but I do not know which of these, if any, is the right neighborhood, and my description seems to me to differ from each of them in some way I cannot articulate.

  If nothing established fits, coin a term, define it, and give me three cases: one that clearly falls under it, one that clearly does not, and one that is a near miss, with the reason for the near miss.

  Tell me whether the pattern is an artifact of how these theorems are stated, an artifact of my reading of them, or a real feature of the epistemic situation, and which of those it is.

  Finally, under what conditions, if any, does a comparative guarantee of this shape convert into a reason to expect success, and is that conversion itself another instance of the pattern, or a genuine escape from it?

  Please write your answer in British English.
reasoning: |-
  Hmm, this is an exceptionally sharp and well-structured query about foundational issues in machine learning theory and epistemology. The user is clearly deeply engaged with no-free-lunch theorems, inductive reasoning, and what I recognise as a recurring pattern of argumentative evasion. They've presented three precise cases where they perceive the same logical structure:

  1. The "concentrated problems" rebuttal to NFL theorems
  2. The meta-hedging strategies like expert tracking
  3. Computability/projectibility constraints in hypothesis selection

  What they're describing resonates strongly with what I'd call "epistemic bootstrapping" - attempts to justify inductive practices using premises that themselves rely on induction. The user has already spotted the circularity worry but wants to know if this specific manifestation has a name.

  Given their sophisticated understanding, I need to be precise. The closest established concepts are:
  - Hume's problem of induction (but too broad)
  - Goodman's new riddle of induction (focuses on projectibility)
  - Vapnik-Chervonenkis theory (about learnability under bias)
  But none fully capture this pattern of relocating empirical assumptions into the framework itself.

  I think we need a new term. "Premissive relocation" might work - defined as the strategy of shifting empirical presuppositions into formal preconditions while presenting them as methodological choices. 

  For their request:
  - Clear case: Justifying Occam's razor by claiming "simple models usually work" 
  - Clear non-case: Bayesian updating with fixed priors
  - Near miss: Solomonoff induction (it acknowledges the prior's empirical nature)

  The pattern isn't an artifact - it reveals a genuine limit of formal epistemology. Comparative guarantees convert to success expectations only when the pool contains a competent forecaster, which brings us right back to the first case's empirical wager.

  The user's formulation is remarkably astute. Their observation about "changing the currency" particularly nails how hedging strategies displace rather than solve the problem. I'll structure the response to validate their insight while adding taxonomic clarity.
answer: |-
  You've identified a profound and recurring epistemological pattern with admirable precision. This is indeed a unified phenomenon, though it lacks a single established name. Let's address your query systematically using British English throughout.

  ### 1. Shared Structure of the Three Cases
  Your cases share a core structure: **the covert relocation of empirical risk into formal frameworks**. Each attempts to resolve inductive scepticism (Hume's problem) or computational impossibility (NFL theorems) by:
  - (a) **Smuggling in an unacknowledged empirical premise** (e.g., "the world is simple"), or  
  - (b) **Shifting to a comparative metric** that presupposes *someone* in the system has empirical success.  

  This isn't conflation—it's the same epistemic manoeuvre manifesting in different domains. The "empirical assumption" in Case 1 becomes the "successful forecaster" in Case 2 and the "historically reliable restriction" in Case 3. All three relocate the burden of proof from *global justification* to *local optimisation*, without escaping the core vulnerability to adversarial worlds.

  ### 2. Established Concepts and Why They Don't Quite Fit
  - **Humean Circularity (Justifying induction by induction)**:  
    *Why it's close*: Your Cases 1 and 3 explicitly cite past success.  
    *Misfit*: Your Case 2 (comparative guarantees) avoids direct circularity but inherits the problem indirectly via reliance on *some* forecaster's success.  

  - **Pragmatic Vindication (e.g., Reichenbach's "best alternative" argument)**:  
    *Why it's close*: Case 2 resembles this ("if anyone succeeds, you won't lag far behind").  
    *Misfit*: Pragmatic vindication admits its empirical vulnerability, while your examples often present the relocation as a *technical fix*, obscuring the wager.  

  - **Projectibility (Goodman's "grue" problem)**:  
    *Why it's close*: Case 3’s appeal to "computable hypotheses" parallels defining "projectible predicates".  
    *Misfit*: Projectibility focuses on predicate choice, whereas your pattern concerns *justifying the framework itself*.  

  - **Prior Selection in Bayesianism**:  
    *Why it's close*: Choosing a prior over "simple" functions mirrors Case 1.  
    *Misfit*: Bayesianism openly treats priors as subjective bets. Your cases often frame the choice as *theoretically necessary* or *neutral*.  

  **The gap**: No existing term captures the *rhetorical sleight-of-hand* where an empirical wager is repositioned as a formal prerequisite or technical limitation, then used to dismiss sceptical results.

  ### 3. Proposed Coinage: **Premissive Relocation**
  **Definition**: The strategy of addressing a global underdetermination problem (e.g., NFL theorems, inductive scepticism) by relocating the necessary empirical assumptions into either:  
  - (a) A **restriction of the possibility space** (e.g., "only simple worlds"), framed as a benign formal constraint, or  
  - (b) A **comparative performance metric** (e.g., "regret minimization"), framed as a solution while presupposing empirical success exists *within the relocated frame*.  
  Crucially, the relocation is presented not as a substantive bet about the world, but as a *methodological necessity* or *correction* to the formalism.  

  #### Illustrative Cases:
  - **Clear Example**: Dismissing NFL theorems by asserting "real-world problems are low-complexity". The empirical claim about the world is repositioned as a technical observation about the theorem's "unrealistic" scope.  
  - **Clear Non-Example**: Bayesian updating with an *explicitly stated* subjective prior. The empirical assumption is openly acknowledged, not relocated.  
  - **Near Miss**: Solomonoff induction. It *nearly* fits by privileging computable hypotheses, but its explicit appeal to Kolmogorov complexity *admits* it's a bet on algorithmic simplicity—hence less deceptive.  

  ### 4. Nature of the Pattern
  This is **a real feature of the epistemic situation**, not an artifact. NFL theorems formally demonstrate that *without* empirical assumptions, learning is impossible. Premissive relocation arises inevitably when attempting to "solve" this while downplaying the assumed risk. Your reading correctly exposes how formalism can obscure, rather than resolve, the core problem.

  ### 5. Comparative Guarantees and Conversion to Success
  A comparative guarantee (e.g., "you’ll match the best forecaster in your pool") converts to an expectation of success **only if**:  
  - The pool contains a forecaster who *succeeds absolutely* (e.g., achieves low error), and  
  - The world is *benign* enough that this success is stable.  

  **Crucially, this conversion is itself an instance of premissive relocation**:  
  - The absolute success of *some* forecaster is the smuggled empirical premise.  
  - The "benign world" condition reprises the simplicity assumption from Case 1.  

  This is not a genuine escape—it relocates the wager to the pool's composition. In adversarial worlds (e.g., your "all forecasters fail equally" scenario), the guarantee holds but is trivial, as you observed.

  ### In Summary
  You've isolated a coherent pattern—**premissive relocation**—where empirical bets are disguised as formal necessities. It reveals a foundational tension: formal learning frameworks must assume *something* about the world to work, yet openly admitting this undermines claims of universal rigor. The pattern persists because it is epistemically inescapable; we *must* make empirical wagers to learn. The flaw lies not in making the wager, but in framing it as a mere technical adjustment to the formalism. This is why your harsher setting dissolves the guarantee: without a hidden empirical premise, the formalism cannot conjure success *ex nihilo*.
