answer: |-
  Below is a tailored "What's Your Norm of Assertion?" instrument designed for your pub philosophy session. It includes 9 concrete cases (each with 2–3 answer options), a scoring key for hand-scoring in under 10 minutes, and a mapping of answer patterns to 7 distinct "leaves" (views on the norm of assertion). I've incorporated 5 of your cases (fixed for clarity) and added 4 new ones to ensure separation of the leaves. The logical space is built first, followed by the quiz and key.

  ### **Logical Space of Assertion Norms**
  The tree rests on three branching questions that define the core distinctions. These branch on **fault type** (epistemic vs. non-epistemic), **hearer-sensitivity**, and **required condition**. This creates 12 possible combinations, but only 7 are occupied by defensible views. Empty cells are explained.

  1. **Branch 1: Fault Type**  
     What is the primary defect in a bad assertion?  
     - **A: Epistemic failing** (relates to the speaker's position w.r.t. truth).  
     - **B: Non-epistemic infelicity** (relates to insincerity, commitment, or pragmatic failure, akin to a broken promise).  

  2. **Branch 2: Hearer-Sensitivity**  
     Does the norm depend on the audience?  
     - **A: Fixed** (depends only on speaker + content).  
     - **B: Sensitive** (shifts with who is listening).  

  3. **Branch 3: Required Condition**  
     What must the speaker satisfy?  
     - **A: Truth** (p must be true).  
     - **B: Knowledge/Warrant** (speaker must know p or have strong warrant).  
     - **C: Belief/Answerability** (speaker must believe p or be able to back it up).  

  **Combinations and Occupied Views**:  
  | Fault Type | Hearer-Sensitive? | Required Condition | View (Leaf)               | Status/Reason for Emptiness |
  |------------|-------------------|-------------------|---------------------------|----------------------------|
  | A (Epistemic) | A (Fixed)       | A (Truth)         | Truth Norm (TN)           | Occupied.                  |
  | A (Epistemic) | A (Fixed)       | B (Knowledge)     | Knowledge Norm (KN)       | Occupied.                  |
  | A (Epistemic) | A (Fixed)       | C (Warrant)       | Reasonableness Norm (RN)  | Occupied (warrant ≠ knowledge). |
  | A (Epistemic) | B (Sensitive)   | A (Truth)         | —                         | **Empty**: Truth is absolute; cannot vary by audience. |
  | A (Epistemic) | B (Sensitive)   | B (Knowledge)     | —                         | **Empty**: Knowledge is speaker-relative; unattractive to make it audience-dependent. |
  | A (Epistemic) | B (Sensitive)   | C (Warrant)       | Hearer-Sensitive Norm (HN)| Occupied (your hobbyhorse: warrant required varies by audience). |
  | B (Non-epistemic) | A (Fixed)     | A (Truth)         | —                         | **Empty**: Truth is epistemic; incoherent in non-epistemic frame. |
  | B (Non-epistemic) | A (Fixed)     | B (Knowledge)     | —                         | **Empty**: Knowledge is epistemic; incoherent here. |
  | B (Non-epistemic) | A (Fixed)     | C (Belief/Ans.)   | Belief (BN) or Answerability (AN) | Occupied (BN and AN are separate but grouped here; split in Branch 3). |
  | B (Non-epistemic) | B (Sensitive)   | A (Truth)         | —                         | **Empty**: Truth is epistemic; incoherent. |
  | B (Non-epistemic) | B (Sensitive)   | B (Knowledge)     | —                         | **Empty**: As above. |
  | B (Non-epistemic) | B (Sensitive)   | C (Belief/Ans.)   | —                         | **Empty**: Unattractive; no one argues belief/answerability should shift by audience. |

  **Refinements for the 7 Leaves**:  
  - BN and AN are split under "Non-epistemic, Fixed" by emphasizing belief vs. answerability in cases.  
  - HN is under "Epistemic, Sensitive, Warrant" (your hobbyhorse: warrant required depends on audience).  
  - The seventh leaf is **No Single Norm (NN)**, for those rejecting a constitutive norm.  
  - **Unoccupied cells** are empty due to incoherence (truth/knowledge in non-epistemic frame) or unattractiveness (hearer-sensitive belief/truth).  

  **Two Leaves This Instrument Cannot Fully Separate**:  
  1. **KN vs. RN**: They often agree (e.g., both require good evidence), but diverge in lottery-like cases. The instrument uses Case 4 to target this, but in borderline evidence cases, they may still map similarly.  
  2. **BN vs. AN**: Both are non-epistemic, so they agree on truth-irrelevant cases. Case 7 (hesitant assertion) is designed to separate them, but if someone values "belief as commitment to answer," they may blur.  

  ---

  ### **The Quiz: "What's Your Norm of Assertion?"**
  **Instructions**: For each case, pick **one** answer. No overthinking—go with your gut. Answer based on what makes the assertion "defective" (improper, bad, or not an assertion).

  1. **Hospital Committee**  
     A committee of five votes 3–2 to issue: "The outbreak is under control." The two dissenters know it’s false; the three "yes" voters believed it only due to wishful thinking (no evidence). The statement is false. Was the committee’s assertion improper?  
     - **A**: Yes, because it’s false.  
     - **B**: Yes, because the committee lacked good evidence.  
     - **C**: No—the majority believed it in good faith.  

  2. **Text Support Bot**  
     A bot outputs: "Your refund was issued on the 3rd." This is true and from a reliable process, but the bot has no beliefs or knowledge. Is this assertion defective?  
     - **A**: Defective—it lacks belief/knowledge.  
     - **B**: Not defective—it’s true and reliable.  
     - **C**: Not an assertion at all (just outputting words).  

  3. **Mistranslation**  
     I know the train leaves at 9. I try to tell you in a language I speak poorly, but my sentence means "it leaves at 6." What went wrong?  
     - **A**: I asserted a falsehood (it leaves at 6), so it’s defective.  
     - **B**: I intended to assert a truth but failed—the defect is miscommunication, not assertion.  
     - **C**: I asserted the truth (it leaves at 9) defectively by using wrong words.  

  4. **Lottery Ticket**  
     Pre-draw, I say: "Your ticket lost," based solely on low odds (no insider info). It wins. What was wrong with my assertion, and what should I do when I find out?  
     - **A**: Defective—it was false.  
     - **B**: Defective—I didn’t know it.  
     - **C**: Acceptable then (I had good reason), but now I must retract/apologize.  

  5. **Doctor and Audiences**  
     A doctor tells a frightened child a true medical fact in a calming tone. Later, she says the same to the child’s specialist parent, who has better evidence than the doctor. Compare the assertions.  
     - **A**: Both proper—the fact is true.  
     - **B**: Proper to child, improper to parent (due to audience).  
     - **C**: Both proper, but unnecessary to parent.  

  6. **Changing Truth**  
     I say p at time T, knowing it’s true. By the time you hear it, p is false due to unexpected events. Is my assertion defective?  
     - **A**: Not defective—it was true/knowable at T.  
     - **B**: Defective—it’s false when heard.  
     - **C**: Defective only if the norm cares about uptake.  

  7. **Hesitant Assertion**  
     Someone says: "I think it’s going to rain, but I have no idea." Is this a defective assertion?  
     - **A**: Defective—they lack evidence.  
     - **B**: Defective—they don’t believe it (sincere belief missing).  
     - **C**: Not defective—they expressed uncertainty honestly.  

  8. **Misled Math**  
     In a demon-world where all evidence suggests 2+2=5, someone asserts "2+2=5" (which is necessarily false). Defective?  
     - **A**: Yes—it’s false.  
     - **B**: No—they had overwhelming evidence.  

  9. **Crowd with Experts**  
     A speaker with good evidence (but not knowledge) asserts p to a crowd. Experts present know p is false; laypeople don’t. Defective?  
     - **A**: Yes—p is false.  
     - **B**: Yes—speaker didn’t know p.  
     - **C**: No—evidence was good for laypeople.  
     - **D**: Defective for experts, not for laypeople.  

  ---

  ### **Scoring Key**
  **How to Score**: Tally answers for each leaf. Each leaf has a "signature" pattern. The leaf with the most matches wins. If tied, use the best-fit rule below. Scoring takes 5–8 minutes with a pre-filled grid.

  | Leaf | Description | Signature Answers (Ideal Pattern) | Best-Fit Rule (If Tie) |
  |------|-------------|-----------------------------------|------------------------|
  | **KN (Knowledge Norm)** | Assert only what you know. Fault: epistemic (lack of knowledge). | Q1-B, Q2-A, Q4-B, Q6-A, Q8-A, Q9-B | Favors epistemic fault (Q2, Q7-A) and knowledge-requirement (Q4-B over Q4-C). |
  | **TN (Truth Norm)** | Assert only truths. Fault: epistemic (falsehood). | Q1-A, Q2-B, Q4-A, Q6-B, Q8-A, Q9-A | Prioritizes truth (Q1-A, Q4-A, Q8-A) over evidence (Q4-C) or belief (Q7-B). |
  | **BN (Belief Norm)** | Assert only what you believe. Fault: non-epistemic (insincerity). | Q1-C, Q2-A, Q3-B, Q5-A, Q7-B, Q8-B | Favors non-epistemic fault (Q7-B) and belief-requirement (Q1-C). |
  | **RN (Reasonableness Norm)** | Assert only with sufficient warrant. Fault: epistemic (poor evidence). | Q1-B, Q2-B, Q4-C, Q6-A, Q7-A, Q8-B | Prioritizes evidence (Q1-B, Q4-C) over knowledge (Q4-B). |
  | **AN (Answerability Norm)** | Assert only what you can defend if challenged. Fault: non-epistemic (can't back it up). | Q1-B, Q2-A, Q3-A, Q5-A, Q7-A, Q8-B | Favors non-epistemic fault (Q7-A as "lack of evidence" implies inability to defend) and challenge-readiness (Q3-A). |
  | **HN (Hearer-Sensitive Norm)** | Permissibility depends on audience. Fault: epistemic (warrant insufficient for that hearer). | Q1-B, Q2-B, Q4-C, Q5-B, Q6-C, Q9-D | Favors audience-dependence (Q5-B, Q9-D) and warrant (Q1-B, Q4-C). |
  | **NN (No Single Norm)** | No constitutive norm; context varies. Fault: not one-size-fits-all. | Q2-C, Q3-B, Q5-C, Q6-C, Q7-C, Q8-B | Favors "not defective" (Q7-C) or "depends" (Q6-C) answers. |

  **Best-Fit Rules for Ties**:  
  - KN vs. RN: If Q4-B (KN) > Q4-C (RN), else RN.  
  - BN vs. AN: If Q7-B (BN) > Q7-A (AN), else AN.  
  - Other ties: Default to NN (reflects ambiguity).  

  **Example Scoring**:  
  - Answers: Q1-B, Q2-B, Q3-A, Q4-C, Q5-B, Q6-A, Q7-A, Q8-B, Q9-D.  
  - Matches: KN (3), TN (0), BN (1), RN (5), AN (4), HN (6), NN (2). → HN wins.  

  ---

  ### **Weaknesses and Misfires**
  **Where the Instrument Misfires**:  
  1. **KN vs. RN Separation**: This is the hardest. They agree on most cases (e.g., Q1, Q2, Q6). Case 4 (lottery) is the divider, but if someone interprets "good reason" (Q4-C) as sufficient for knowledge, they collapse. A **new case** to fix this:  
     - *"I assert 'This is a zebra' in a zoo, knowing it looks like one but aware it could be a painted mule. Defective?"*  
       - A: Yes—I don’t know it’s not a mule (KN).  
       - B: No—I have good evidence (RN).  
       - (Adds a Gettier-style case to force the knowledge/warrant split.)  

  2. **BN vs. AN Separation**: Case 7 (hesitant) is the divider, but if "belief" is seen as entailing answerability, they blur. **What would make me rewrite**: If multiple participants say, "Belief just means being willing to defend it," I’d merge BN/AN or add a case like:  
     - *"I assert p insincerely (no belief) but can back it up with evidence if challenged. Defective?"*  
       - A: Yes—insincere (BN).  
       - B: No—I can defend it (AN).  

  **Framing Risks**:  
  - **If assertion has no constitutive norm**: The instrument misfires if most score high for NN. This suggests the framing is wrong—assertion may be governed by multiple context-dependent norms (e.g., politeness, ethics). Revise if >50% score NN.  
  - **Hearer-sensitivity as confusion**: If HN scores high but participants cite "politeness" (e.g., "don’t bore experts") not warrant, your hobbyhorse is likely conflated with pragmatics. HN should only score if audience affects epistemic permissibility (e.g., Q5-B chosen for warrant reasons).  

  **Least Confident Mapping**:  
  - **Case 3 (Mistranslation)**: I map A to AN (asserted falsehood implies inability to defend) and B to BN/AN (defect in communication, not assertion). But it might track *speaker meaning* vs. *sentence meaning* theories, not norms. If many dispute this, it may need reworking.  
  - **Case 5 (Doctor)**: I map B to HN, but if chosen for "redundancy = rude," it’s politeness, not a norm of assertion. The key assumes epistemic reasons (warrant insufficient for expert).  

  ---

  **Final Notes**:  
  - **Use in Session**: Hand out quizzes, score at the table, then reveal leaves. Avoid norm names until scoring—just discuss cases.  
  - **Why This Works**: The cases force choices on fault type (Q2, Q7) and hearer-sensitivity (Q5, Q9), with Branch 1 and 2 doing the heavy lifting. Empty cells are pruned logically.  
  - **Flexibility**: If your group hates a case, replace it with one of your unused ones (e.g., "base rates" from your list is in Q4). Enjoy the arguing!
