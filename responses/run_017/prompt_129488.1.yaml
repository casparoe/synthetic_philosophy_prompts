  The user also mentions the Horizon Rule, a tie-breaker they invented. It involves truncating the future at each century and checking which option leads. If one stays ahead from a certain point onward, it wins; if the lead keeps flipping, it's a tie, and they revert to finite considerations. This rule needs to be incorporated neutrally.

