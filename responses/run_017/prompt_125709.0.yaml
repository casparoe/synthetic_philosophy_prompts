prompt: |-
  I work as a software engineer, with no philosophy training past the odd blog post, and I came to this topic sideways, through what turned out not to be a bug. My team maintains a large agent-based simulation, and two colleagues were computing the same quantity two different ways — one averaging over simulation runs, one averaging over agent-steps — and getting numbers that differed by orders of magnitude, with no error in either script. The disagreement turned out to be philosophical: whether a sample should be weighted by worlds or by the observers inside them. When I went looking for someone who had argued about this properly, I found the same dispute in cosmology and in reasoning about where one sits among all the observers there are, under the names self-sampling assumption and self-indication assumption. The presumptuous philosopher case, where a hypothesis wins purely by postulating a colossal number of observers, feels to me like the exact failure mode I would file as a bug in my own code.

  So before I read any further, I want the specification rather than the survey. Please write me a requirements list — in the style of an interface spec with test cases — for any rule that updates on indexical evidence. Concretely, imagine a function whose input is a prior over hypotheses, where each hypothesis specifies how many observers or observer-moments of which kinds exist and which of them have evidence like mine, and whose output is a posterior over hypotheses that I can hand to a decision procedure. The purpose I care about is decision guidance: I want credences that a bounded agent can act on, an agent that may be one of many copies, does not know how many copies there are, and has to choose whether to accept a bet whose payoff is per-copy or per-world. If the right list would differ for a different purpose — say, scientific inference about how many observers the universe contains, or evaluating a hypothesis about whether we are in a simulation — say which requirements are purpose-relative.

  Here are the candidate requirements I have collected from arguing with friends, which I want you to sort into genuine desiderata versus the prejudices of one camp, marking each as MUST, SHOULD, or MAY in the RFC sense, with the case or consideration behind it: reduce to ordinary Bayesian conditionalization when the hypotheses differ only in non-indexical respects; invariance under redescription of the population, so that dividing or merging observers does not change the answer by stipulation; symmetry between a process that duplicates a subject and one that merges two subjects with the same resulting memories; robustness to the choice of reference class, or an argument for why no robustness is owed; well-definedness when the population is infinite, unbounded, or of unknown size; implementability by an agent that cannot enumerate observers it could never interact with; resistance to hypotheses that win by postulating astronomically many observers; resistance to domination by the vast number of thermally improbable freak observers a big universe would contain; no betting behavior that guarantees a loss; not letting indexical reasoning overturn strong non-indexical evidence; and still being informative enough to be worth computing at all.

  I would also like three cases I have not seen handled anywhere, worked into the list as tests: the Fork, where every subject is silently duplicated at midnight and the copies are subjectively indistinguishable, run alongside its exact time-reverse, where pairs of subjects are merged and the survivor has both sets of memories — a rule that treats these asymmetrically owes me a reason; the Thick Index, where one hypothesis contains ten observers with my exact total evidence and another contains those same ten plus ten to the twelve observers whose evidence differs from mine in some trivial detail, which should force you to say whether the rule conditions on my total evidence or on something thinner, and what happens if conditioning on total evidence makes the whole exercise empty; and the Unenumerable World, where the rival hypothesis postulates so many observers that no agent inside the world could ever count or sample them, so a rule that needs the full population to compute an answer is not a rule I can ship. For each, tell me what answer a correct rule should give, or explain why the case is ill-posed.

  Finally, flag any pair of requirements you suspect cannot be jointly satisfied — my own guess is that being informative and being immune to cheap hypotheses pull in opposite directions, and that this is where the interesting result is, but I want your judgment on where the impossibility actually lies. Tell me too which single requirement excludes the most candidate rules. Keep the closing scorecard, for the two weightings I named at the start, to one short paragraph; the criteria are what I am paying for.
reasoning: |-
  We are designing a rule for updating credences based on indexical evidence (i.e., evidence about which observer I am in the world). The rule should take as input a prior over hypotheses, where each hypothesis specifies:
     - The number of observers (or observer-moments) of various kinds.
     - Which of these observers have evidence like mine.

  The output is a posterior over hypotheses, to be used for decision-making by a bounded agent who may be one of many copies and who must choose between bets that pay off per-copy or per-world.

  We are to produce a requirements list in the style of an interface spec, with test cases. We'll sort the candidate requirements into MUST, SHOULD, MAY, and also address three specific test cases (The Fork, The Thick Index, The Unenumerable World). We'll also note any conflicts and which requirement is most exclusive.

  ### Requirements List

  1. **Reduce to ordinary Bayesian conditionalization when hypotheses differ only in non-indexical respects (MUST)**  
     When the hypotheses do not involve indexical uncertainty (i.e., they only differ in non-indexical facts and the observer set is fixed and the same in all hypotheses), the update rule must reduce to standard Bayesian conditionalization. This is because indexical reasoning should only come into play when there is indexical uncertainty.

  2. **Invariance under redescription of the population (MUST)**  
     The rule must be invariant under splitting or merging of observers, as long as the evidence and the total number of observer-moments with each evidence type remain the same. This is because the way we describe the observers (as one or many) should not change the underlying reality.

  3. **Symmetry between duplication and merging (MUST)**  
     The rule should treat duplication (where one observer is split into two with the same memories) and merging (where two observers are merged into one with both sets of memories) symmetrically. In particular, in The Fork test case, the rule should assign the same probabilities in the duplication scenario as in the merging scenario (with time reversed). The reason is that the subjective experience is identical in both.

  4. **Robustness to the choice of reference class (SHOULD)**  
     The rule should not be overly sensitive to the exact definition of the reference class (i.e., what counts as an observer or what evidence counts as "like mine"). However, it is recognized that the choice of reference class is a substantive philosophical issue, so we require robustness only in the sense that the rule should not break down under minor changes, but we do not require complete invariance.

  5. **Well-definedness for infinite, unbounded, or unknown populations (MUST for unknown size, SHOULD for infinite/unbounded)**  
     The rule must be well-defined when the population size is unknown (since that is a common situation). For infinite or unbounded populations, it should ideally be well-defined (e.g., by using limits or other methods), but this is challenging and may require special care.

  6. **Implementability by a bounded agent (MUST)**  
     The rule must be computable by an agent that cannot enumerate all observers (especially in the Unenumerable World). This means that the rule should not require knowledge of the entire population.

  7. **Resistance to hypotheses that win by postulating astronomically many observers (MUST)**  
     The rule must not allow a hypothesis to dominate simply by postulating a huge number of observers (the "presumptuous philosopher" failure). This is because such hypotheses would otherwise always win, even without empirical support.

  8. **Resistance to domination by thermally improbable freak observers (MUST)**  
     In a big universe, there might be many observers with low-probability states (e.g., "Boltzmann brains"). The rule must not let such freak observers dominate the probability, as this would lead to skepticism about our own ordinary observations.

  9. **No guaranteed loss in betting (MUST)**  
     The rule must not lead to a betting strategy that guarantees a loss (a "Dutch book"). This is a fundamental requirement for any rational credence update.

  10. **Indexical reasoning does not overturn strong non-indexical evidence (MUST)**  
      When there is strong non-indexical evidence for a hypothesis, indexical reasoning should not override it. For example, if two hypotheses are equally supported by non-indexical evidence but one has more observers, then indexical reasoning may break the tie. However, if one hypothesis has overwhelming non-indexical support, then even if it has fewer observers, it should not be overturned.

  11. **Being informative enough to be worth computing (MAY)**  
      The rule should not be so uninformative that it is useless. However, in some cases (e.g., when the evidence is very generic and shared by many observers in every hypothesis) the posterior might be spread out. We require that the rule is not vacuous by design, but we cannot force it to be informative in all cases.

  ### Test Cases

  1. **The Fork**  
     *Scenario*:  
       - **Forward Fork (duplication)**: Every night at midnight, every observer is duplicated. The two copies are subjectively indistinguishable and have the same memories.  
       - **Reverse Fork (merging)**: Every night at midnight, pairs of observers are merged into one, who has the memories of both.  
     We run the same experiment in both scenarios.  
     *Requirement*: The rule must assign the same probabilities in both scenarios (symmetry under time reversal). In particular, after duplication, the original and the duplicate should each assign a probability of 1/2 that they are the original. Similarly, before merging, each of the two observers should assign a probability of 1/2 that they will survive (if the rule is applied at a time when they know the merge is about to happen).  
     *Reason*: The subjective experience is symmetric.

  2. **The Thick Index**  
     *Scenario*:  
       - Hypothesis H1: There are 10 observers with my exact total evidence E.  
       - Hypothesis H2: There are 10 observers with E and 10^12 observers with evidence E', which is very similar to E but differs in some trivial detail (e.g., a single irrelevant bit of sensory data).  
     The question is: what should my posterior be for H1 vs H2?  
     *Requirement*: The rule must condition on the exact total evidence E. Therefore, in H2, there are only 10 observers with E (the rest have E'). So the posterior should not be swayed by the 10^12 observers with E'. However, note that if the rule conditions on the exact total evidence, then in a big universe, we might be the only observer with that exact evidence, which could lead to radical skepticism. But the requirement is that we condition on the exact evidence.  
     *Handling*: The rule must condition on the exact evidence E. Hence, in this case, the posterior should be proportional to the prior for H1 and H2 multiplied by the number of observers with E in each. Since H1 has 10 and H2 has 10, the ratio remains the same as the prior. The 10^12 observers with E' in H2 are irrelevant because they do not have E.  
     *Note*: This might seem to make the rule uninformative when evidence is highly specific (because then each observer is unique). However, that is the correct result: if the evidence is unique in every hypothesis, then indexical uncertainty vanishes and we are back to non-indexical updating. But if we condition on a coarsened evidence (e.g., a reference class that includes both E and E'), then we would get a different result. This test case forces us to condition on the exact evidence.

  3. **The Unenumerable World**  
     *Scenario*: A hypothesis postulates so many observers that no agent inside the world could ever count or sample them (e.g., an infinite number, or a number too large to compute).  
     *Requirement*: The rule must be computable by a bounded agent without enumerating all observers. This means the rule must be defined in a way that the agent can compute the posterior without knowing the entire population. For example, the rule might only require knowing the *proportion* of observers with the given evidence in each hypothesis, but not the absolute number. Or it might use a sampling-based approach.  
     *Note*: This is tied to requirement 6 (implementability). The rule must not require the absolute number of observers, only the relative frequency (or density) of observers with the evidence in each hypothesis.

  ### Conflicts Between Requirements

  - **Conflict 1**: Being informative (requirement 11) and resistance to cheap hypotheses (requirement 7) might be in tension. If we are too resistant to cheap hypotheses (by downweighting large numbers of observers), then we might become too skeptical of large universes even when they are supported by non-indexical evidence. On the other hand, if we are too permissive, then we get the presumptuous philosopher. There is a trade-off: we want the rule to be sensitive to non-indexical evidence and to break ties by the number of observers, but not let the number of observers dominate.

  - **Conflict 2**: Conditioning on exact total evidence (as in The Thick Index) might lead to uninformative posteriors when the evidence is very specific (because then each observer is unique). This conflicts with the desire for the rule to be informative (requirement 11). However, we must condition on exact evidence to avoid arbitrary reference classes.

  - **Most Exclusive Requirement**: Requirement 8 (resistance to domination by Boltzmann brains) is particularly difficult because it requires that we avoid being dominated by observers that are highly improbable under the physics of the hypothesis. This often requires a careful weighting by the typicality of the observer, which can conflict with simple counting.

  ### Single Most Exclusive Requirement

  The requirement that **excludes the most candidate rules is requirement 7: resistance to hypotheses that win by postulating astronomically many observers**. Many proposed rules (like the self-indication assumption) fail this because they give too much weight to large numbers of observers.

  ### Closing Scorecard for SSA vs SIA

  - **Self-Sampling Assumption (SSA)**: 
     - Samples uniformly from the set of all observers (or observer-moments) in the world.
     - MUST: 1, 2, 3, 4 (arguably), 5 (with care), 6 (if the agent knows the proportions), 8 (if combined with a typicality condition), 9, 10 (if the non-indexical evidence is strong), 11 (sometimes uninformative).
     - Fails 7: it is vulnerable to the presumptuous philosopher (if a hypothesis has many observers, it becomes more likely).

  - **Self-Indication Assumption (SIA)**:
     - Weights hypotheses by the expected number of observers (or by the total number of observers) and then samples uniformly.
     - MUST: 1, 2, 3, 4 (arguably), 5 (with care), 6 (if the agent knows the proportions), 7 (resists cheap hypotheses because it already weights by number of observers, so adding more observers doesn't change the prior), 9, 10 (if the non-indexical evidence is strong), 11 (often more informative).
     - Fails 8: it is dominated by Boltzmann brains in big universes because it weights by the absolute number of observers, and there are more Boltzmann brains than normal observers.

  ### Conclusion

  The requirements list we have provided highlights the challenges in designing a rule for indexical evidence. The two main candidates (SSA and SIA) each fail at least one critical requirement. There is ongoing research to find a rule that satisfies all, but currently, it appears that no rule satisfies every requirement without introducing other issues. The most promising approach might be a hybrid that avoids the pitfalls of both.

  For decision guidance, the rule must be tied to the bet structure (per-copy vs per-world). For per-copy bets, the agent should use a posterior that reflects the probability that they are a particular copy. For per-world bets, the agent should use the posterior over worlds (hypotheses) and then choose the action that maximizes the expected per-world payoff. This suggests that the update rule for the posterior over hypotheses should be such that it can be used for both types of bets, but the decision procedure must account for the bet type.
answer: |-
  ### Requirements Specification for Indexical Evidence Updating Rule

  #### Purpose
  The rule updates a prior over hypotheses to a posterior, enabling a bounded agent (possibly one of many copies) to make decisions under bets with per-copy or per-world payoffs. The rule MUST prioritize decision guidance over scientific inference or simulation hypotheses. Requirements are tagged as MUST, SHOULD, or MAY per RFC 2119. Conflicts and test cases are integrated below.

  ---

  #### Core Requirements
  1. **Reduce to Bayesian conditionalization for non-indexical differences (MUST)**  
     When hypotheses differ solely in non-indexical respects (e.g., physical constants), the rule MUST output identical results to standard Bayesian conditionalization.  
     *Rationale*: Ensures compatibility with non-indexical reasoning. Failure breaches coherence.

  2. **Invariance under observer redescription (MUST)**  
     Dividing or merging observers (e.g., splitting one observer into two subjectively identical copies) MUST NOT change the posterior, provided the total observer-moments per evidence-type are preserved.  
     *Rationale*: Prevents artificial inflation/deflation of probabilities via arbitrary population granularity.

  3. **Symmetry between duplication and merging (MUST)**  
     The rule MUST treat duplication (one observer → two copies) and merging (two observers → one with merged memories) symmetrically.  
     *Test: The Fork*  
     - **Forward Fork (duplication at midnight)**: After duplication, each copy assigns 50% probability they are the original.  
     - **Reverse Fork (merging at midnight)**: Before merging, each observer assigns 50% probability they will "survive".  
     *Requirement*: Both cases yield identical posteriors for equivalent pre-/post-event states. Asymmetry fails the test.

  4. **Resistance to cheap hypotheses (MUST)**  
     The rule MUST NOT allow hypotheses to dominate solely by postulating vast numbers of observers (e.g., presumptuous philosopher).  
     *Rationale*: Avoids "bug" where improbable hypotheses win via observer count.

  5. **Resistance to Boltzmann domination (MUST)**  
     The rule MUST NOT be dominated by thermally improbable "freak observers" (e.g., Boltzmann brains) in large universes.  
     *Rationale*: Prevents skepticism about ordinary existence.

  6. **No guaranteed loss in betting (MUST)**  
     The posterior MUST NOT enable Dutch books (bets guaranteeing loss).  
     *Rationale*: Decision guidance requires pragmatic coherence.

  7. **Indexical evidence does not override strong non-indexical evidence (MUST)**  
     When non-indexical evidence strongly favors a hypothesis, indexical updates MUST NOT reverse this conclusion.  
     *Rationale*: Indexical uncertainty should break ties, not override physics.

  8. **Well-defined for unbounded/unknown populations (MUST)**  
     The rule MUST function when populations are infinite, unbounded, or of unknown size.  
     *Test: The Unenumerable World*  
     - **Scenario**: Hypothesis postulates observers too numerous to count or sample (e.g., continuum-many).  
     - **Requirement**: The rule MUST NOT require enumerating observers. Outputs must depend on densities or limits.  
     - **Correct Answer**: Posterior computable via relative densities (e.g., integrating over observer densities).

  9. **Implementability by bounded agents (MUST)**  
     The rule MUST be computable without enumerating all possible observers (e.g., using summary statistics).  
     *Rationale*: Agents cannot simulate causally disconnected observers.

  10. **Condition on total evidence (MUST)**  
      The rule MUST condition on the agent's exact total evidence, not a coarsened "reference class".  
      *Test: The Thick Index*  
      - **Scenario**:  
        - H₁: 10 observers with exact evidence E.  
        - H₂: 10 observers with E + 10¹² observers with slightly different evidence E'.  
      - **Requirement**: Posterior for H₁ vs. H₂ depends ONLY on the 10 vs. 10 observers with E. Observers with E' are irrelevant.  
      - **Correct Answer**: If priors are equal, P(H₁|E) = P(H₂|E). Conditioning on E makes E' observers invisible.  
      *Rationale*: Coarsening evidence arbitrarily (e.g., grouping E and E') introduces subjectivity. Total evidence avoids this.

  11. **Robustness to reference class choice (MAY)**  
      The rule MAY be sensitive to the specification of "observers" or "evidence types", but this is not a flaw.  
      *Rationale*: The "reference class problem" is inherent; the rule should not paper over ambiguity.

  12. **Informative enough to be useful (SHOULD)**  
      The rule SHOULD output non-vacuous posteriors in realistic scenarios, but CAN be uninformative if evidence is generic.  
      *Rationale*: Uselessness is a cost, but forcing informativeness risks bias.

  ---

  #### Conflicts and Impossibilities
  - **Informativeness (12) vs. Cheap Hypothesis Resistance (4)**:  
    These PULL IN OPPOSITE DIRECTIONS. Resistance to cheap hypotheses demands downweighting observer counts, but informativeness requires leveraging counts to break ties. **Joint satisfaction is impossible** without auxiliary constraints (e.g., penalizing complex hypotheses).  
    *Resolution*: Requirement 4 (resistance to cheap hypotheses) takes precedence for decision guidance, as per-purpose.

  - **Total Evidence (10) vs. Robustness to Reference Class (11)**:  
    Conditioning on exact evidence (10) ensures objectivity but risks vacuity if evidence is hyper-specific (e.g., "I see 7px of glare"). Robustness (11) would coarsen evidence but introduces subjectivity. **Total evidence (10) is non-negotiable**; vacuity is acceptable if evidence is truly unique.

  - **Most Exclusive Requirement**:  
    **Requirement 4 (resistance to cheap hypotheses)** excludes the most rules. It disqualifies:  
    - Self-Indication Assumption (SIA), which weights hypotheses by observer count.  
    - Naive counting rules, e.g., "sample uniformly from all observers".

  ---

  #### Scorecard for SSA vs. SIA
  - **Self-Sampling Assumption (SSA)**:  
    Samples uniformly from observers with your evidence.  
    **Compliance**:  
    - MUST: 1 (✔), 2 (✔), 3 (✔), 5 (✔ resists Boltzmann brains), 6 (✔), 7 (✔), 8 (✔ with densities), 10 (✔).  
    - FAILS: 4 (✘ vulnerable to presumptuous philosopher), 9 (✘ if exact counts unknown).  
    *Verdict*: Unsuitable for decision guidance—fails cheap-hypothesis resistance.

  - **Self-Indication Assumption (SIA)**:  
    Weights hypotheses by expected observer count.  
    **Compliance**:  
    - MUST: 1 (✔), 2 (✘ merges/duplicates change counts), 3 (✘ asymmetric), 4 (✔ resists cheap wins), 6 (✔), 8 (✔).  
    - FAILS: 5 (✘ dominated by Boltzmann brains), 7 (✘ overrides non-indexical evidence), 10 (✘ coarsens evidence).  
    *Verdict*: Worse—fails symmetry, Boltzmann resistance, and total evidence.

  **Conclusion**: No extant rule satisfies all MUSTs. A hybrid approach (e.g., SSA with an anti-presumptuous prior) is needed. For decision guidance, lean on requirements 4, 6, and 10; discard rules failing these.
