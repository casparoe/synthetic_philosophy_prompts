prompt: |-
  I do some volunteer search-and-rescue dispatch, and I keep noticing a kind of complaint we make about things people say over the radio, and I dont think it is any of the three things Ive seen philosophers argue about.

  Case one: someone says the ridge above the treeline is clear. It is clear. He believed it, and he had looked, sort of, from the truck. But there is a pair of binoculars in the truck and thirty seconds to use them, and he did not. Afterwards everyone says he should not have said it. Nobody says it was false, nobody says he did not believe it, and when you push them they do not quite say he did not know it either. What they say is that he could not have told if it had not been clear.

  Case two: another guy gives a position off a single cell ping, gets it right, and then says so -- I was right, wasnt I -- and that makes people angrier, not less. If he had said I got lucky, everyone would of dropped it. And if the position had been wrong, lucky would not have been any excuse at all.

  So the complaint does not track how things turned out. It seems to track whether the person would have said the same thing if it had been false, and it seems to get worse when there was a check he could have done cheaply and skipped. In thick fog with no way to check anything, nobody complains, even though the basis is just as thin.

  I know there is a big argument about whether you are only allowed to come out with what you know, or what is true, or what you believe, but none of those three sounds like what we are doing. Does this thing have a name? I dont want just a label though -- I want to know whether it is a fourth norm or a reading of one of the three, whether it is really about assertion at all or about what the rest of us may do with what we hear, and whether the cheapness of the skipped check actually matters or only feels like it does.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They’re involved in volunteer search-and-rescue dispatch and have noticed a recurring complaint about how people communicate over the radio. The examples they gave are interesting because they don’t fit neatly into the three main philosophical norms of assertion: truth, belief, or knowledge. 

  First, I need to parse the two cases. In the first case, someone says a ridge is clear without using available binoculars. The statement was true, and he believed it, but the team is upset because he didn’t verify when he easily could have. The key point here is that the complaint hinges on the fact that he couldn’t have known if it wasn’t true—his method wasn’t reliable. 

  The second case involves someone bragging about a correct location from a single cell ping. Even though he was right, others were angrier because he didn’t acknowledge the luck involved. If he had admitted it was luck, they’d have dropped it. The issue seems to be about taking credit without proper justification. 

  The user mentions that in thick fog with no way to check, complaints don’t happen even if the basis is thin. This suggests that the availability of a cheap check matters. The norm they’re observing isn’t just about the statement’s truth but about the speaker’s responsibility to ensure reliability, especially when verification is feasible. 

  I recall that in epistemology, there’s a concept called the "norm of assertion" which often revolves around knowledge. But here, it’s not just about knowing; it’s about the method used to arrive at the assertion. The idea of "epistemic negligence" comes to mind—failing to take reasonable steps to verify. The user’s colleagues are upset because the speaker didn’t exercise due diligence when it was easy to do so. 

  Then there’s the mention of "could not have told if it had not been clear." This points to sensitivity or reliability of the belief-forming process. If the ridge wasn’t clear, he still would have said it was, meaning his method wasn’t sensitive to the actual state. This relates to modal concepts in epistemology, like safety or sensitivity conditions. 

  Also, the bragging in the second case adds a social layer. Asserting without proper justification and then boasting exacerbates the issue because it shows a lack of epistemic humility. The complaint isn’t just about the assertion itself but the speaker’s attitude and responsibility. 

  The user’s deeper need might be to understand the underlying principle to improve communication protocols in their team. They might want to formalize guidelines or training to prevent such issues, ensuring that dispatchers only assert when they’ve done due diligence. Recognizing this as a norm of responsible assertion could help in setting those standards. 

  I should also consider if this is a fourth norm or a variation of existing ones. It seems like an application of the knowledge norm, where knowledge requires proper justification. Skipping a cheap check means the speaker doesn’t have sufficient evidence, so they don’t truly know, even if they’re correct. The anger when the person brags highlights the social expectation to acknowledge uncertainty when present. 

  The cost of verification being cheap is crucial. In high-stakes situations like SAR, cutting corners when it’s easy to verify is negligent. In fog, where checking isn’t possible, the same assertion is acceptable because there’s no alternative. This ties into contextual epistemology, where norms can be situation-dependent. 

  So, the underlying concept here is about epistemic responsibility and the duty to verify when possible. The term "reasonable epistemic diligence" fits. It’s not just about what you assert but how you arrived there and your acknowledgment of the limitations. This norm ensures that information shared is reliable, which is critical in life-or-death scenarios like SAR.
answer: |-
  This is a fascinating and spot-on observation about a crucial norm in high-stakes communication that doesn't perfectly map onto the classic truth/belief/knowledge debate. You've identified a distinct, practical norm centered on **epistemic responsibility** and the **reliability of the assertion method**, particularly in contexts where actions have serious consequences.

  Here's a breakdown of what's happening and why the existing philosophical categories feel inadequate:

  1.  **The Core Norm: Responsible Assertion / Justified Reliance**
      *   The complaint isn't *primarily* about the truth value of the utterance *at the moment it was made*, nor solely about the speaker's internal belief state, nor even purely about whether they technically "knew" in a minimalist sense.
      *   **It's about whether the speaker provided information *in a way that justified others relying on it* for critical action.** In SAR, assertions aren't just facts; they are action-guiding directives. The team bases *their* safety and effort on what they hear.
      *   **The key question is: "Was the speaker's method sufficiently reliable and diligent *given the stakes and available resources*?"** Could the speaker reasonably distinguish between the actual state and a dangerous alternative?

  2.  **Why the Classic Norms Fall Short:**
      *   **Truth:** The assertion *was* true in Case 1. Complaints still arise.
      *   **Belief:** The speaker *did* believe it. Complaints still arise.
      *   **Knowledge:** This is the closest, but the complaint often persists even if people hesitate to outright deny "knowledge". The core issue isn't just the presence/absence of a justified true belief, but the **quality and diligence** of the justification *relative to the context*. Skipping the binoculars when they were cheap and easy to use makes the justification *insufficiently robust* for the high-stakes reliance placed upon it.

  3.  **The Crucial Elements You Identified:**
      *   **"Could not have told if it had not been clear":** This points directly to **reliability** and **sensitivity**. A reliable method produces true beliefs consistently. A *sensitive* belief wouldn't be held if the state of affairs were different. Skipping the binoculars means the belief wasn't sensitive – he might have said "clear" even if there *was* someone there, obscured by distance. His method wasn't capable of detecting the relevant danger.
      *   **"Cheapness of the skipped check":** This is **absolutely critical** and highlights the **contextual nature of the norm**. The norm demands **reasonable epistemic diligence**. What counts as "reasonable" depends on:
          *   **Stakes:** Higher stakes demand more diligence (SAR = very high stakes).
          *   **Cost/Benefit:** How much effort/time/risk does the check require vs. the potential consequences of being wrong? Binoculars sitting in the truck = very low cost, high benefit. Thick fog, no tools = high cost (impossible), low potential benefit from trying. Skipping a cheap, high-benefit check is negligent. Being unable to perform a check isn't.
      *   **"I got lucky" vs. "I was right":** This highlights the **social and performative aspect**. Bragging ("I was right") implies the speaker *deserved* the correctness, that it stemmed from skill or reliable process. Saying "I got lucky" acknowledges the lack of robust justification and the inherent risk the team took by relying on that information. The anger stems from the speaker *claiming unwarranted epistemic credit* and failing to acknowledge the potential danger their lax method introduced. It's about **epistemic humility and responsibility**.

  4.  **What is this called?**
      *   **No Single Perfect Term, But Several Relevant Concepts:**
          *   **Norm of Responsible Assertion:** This captures the duty of care aspect.
          *   **Norm of Actionable Assertion / Justified Reliance:** Focuses on the listener's need to act.
          *   **Epistemic Negligence:** Specifically describes the fault in skipping a cheap, crucial check.
          *   **Robustness / Sensitivity Requirement:** Describes the modal property ("couldn't have told if false").
          *   **Contextualist Knowledge Norm:** Some versions of contextualism hold that the standards for "knowledge" (and thus permissible assertion) *rise* with the stakes. Skipping the binoculars fails to meet the *heightened SAR standard* for knowledge, even if it might pass in a casual context. This is likely the closest fit within traditional frameworks.
      *   **It IS a norm of assertion:** It governs what you are permitted to put forward *as reliable information for others to act upon*. It's deeply tied to the **illocutionary force** of an assertion in a cooperative, high-stakes endeavor like SAR.

  5.  **Is it a Fourth Norm or a Reading of an Existing One?**
      *   It's arguably a **more demanding, context-specific application or interpretation of the Knowledge Norm**. The Knowledge Norm says "Assert only what you know." In low-stakes contexts, glancing from the truck might *count* as knowing the ridge is clear. In high-stakes SAR, glancing from the truck *without using available binoculars* does *not* count as knowing, because the justification isn't strong enough *for this context*. The "knowledge" bar is higher.
      *   However, the focus on *method reliability*, *sensitivity*, and *diligence* also incorporates elements distinct from simple justification, leaning towards **reliabilist** or **safety-theoretic** accounts of knowledge/permissible assertion.
      *   **Practically, it functions as a distinct operational norm in your field.** It synthesizes elements of knowledge, justification, reliability, and responsibility specifically tuned to the life-or-death consequences.

  **Conclusion:**

  You've identified a vital norm governing assertion in high-stakes, cooperative action contexts like SAR. It goes beyond simple truth, belief, or even minimalist knowledge. It's the **Norm of Responsible Assertion for Justified Reliance**, demanding:

  1.  **Sufficient Reliability:** The method used must be capable of detecting relevant errors/dangers (sensitivity).
  2.  **Reasonable Diligence:** The speaker must utilize reasonably available, cost-effective means to verify, proportionate to the stakes. Skipping cheap checks is negligent.
  3.  **Epistemic Humility:** Acknowledging the limitations of one's basis, especially when luck is involved.

  **The cheapness of the skipped check absolutely matters.** It's central to judging whether the speaker met their duty of reasonable diligence. This norm ensures that critical information shared over the radio isn't just *possibly* true, but comes with a *warrant* strong enough to justify risking lives and resources on it. It's about trust earned through demonstrably responsible process, not just lucky outcomes. This is excellent practical epistemology in action.
