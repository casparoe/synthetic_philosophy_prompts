  We are going to translate the free will debate into the vocabulary of distributed systems and deterministic simulation.

  Key vocabulary:
  - Deterministic replay: The entire system (cluster) runs in one process, and every run can be replayed bit for bit from a seed.
  - Seeds and pseudo-randomness: All non-determinism is routed through a seeded generator, so the same seed produces the same trace.
  - Event traces: A record of events in the system.
  - Provenance and data lineage: Tracking the origin and history of data.
  - Module boundaries and encapsulation: Components with defined interfaces and internal state.
  - Control-flow attribution: Assigning responsibility for a particular control flow path.
  - Root-cause analysis: Identifying the component whose behavior caused an outage.
  - Fault injection: Intentionally introducing faults to test system behavior.
  - Fail-safes and kill switches: Mechanisms to override or halt the system in certain conditions.
  - Counterfactual branches: Exploring what would have happened under different conditions.
  - Code coverage and unexercised paths: Parts of the code that were not executed in a particular run.
  - Models whose policy was shaped by a loss function someone else wrote: A system whose behavior is determined by training with a given loss function.

  Now, let's restate the five pieces:

  (a) The argument that if the past together with the laws fixes everything that follows, then no one could ever have done otherwise.

  In our vocabulary: If we have a deterministic simulation (the past and the laws) and a fixed seed, then the entire event trace is fixed. Therefore, in a replay with the same seed, every module will produce the same outputs. There is no way for the system to emit a different output in the same run. Thus, no module could have produced a different action at any step.

  (b) The reply that "could have done otherwise" is about branches reachable under a perturbation of the agent's own state.

  We can interpret "could have done otherwise" as a counterfactual: if we had perturbed the internal state of the agent module (while keeping the same seed and the same code) just before the decision, then the agent might have produced a different output. This is not about the same replay trace (which is fixed) but about a different run with a different initial condition (the perturbed state). We are considering alternate branches that are reachable by changing the agent's state at the time of decision, without changing the seed for the rest of the system? Actually, in a deterministic system, if we change the agent's state at time T, then from T onward the trace will diverge. But note: the perturbation is localized to the agent's state. The "could have done otherwise" claim is that there exists a perturbation (within the module's possible states) that would lead to a different action.

  (c) The view that what matters is not alternate possibilities but whether the causal path to the action runs through the agent's own decision procedure.

  Here, responsibility is about provenance: we look at the causal chain that led to the action. If the action was determined by the agent's own decision procedure (i.e., the agent's code and internal state, without being overridden or bypassed), then the agent is responsible. This is regardless of whether there were alternate possibilities (i.e., other branches the agent could have taken). We are doing root-cause analysis: if the action was produced by the agent module and not by a fault in a different module (or an external override), then the agent is the root cause.

  (d) The well-known kind of case (Frankfurt-style case) in which a fail-safe would have forced the outcome had the agent wavered, but in fact never fired.

  Consider an agent module that is making a decision. There is a fail-safe module (e.g., a kill switch) that is set to override the agent's output if it does not produce a specific outcome (say, outcome X). However, the agent does produce X on its own, so the fail-safe never fires. In a counterfactual branch where the agent was going to produce not-X, the fail-safe would have forced X. But in the actual run, the agent produced X without intervention. The question is: is the agent responsible for X? Even though the agent couldn't have done otherwise (because if it had tried to do not-X, the fail-safe would have overridden), we still attribute the action to the agent because the fail-safe was not activated.

  (e) The objection that injecting randomness into a decision procedure adds luck and nothing else.

  Suppose we modify an agent module to include a source of randomness (e.g., we inject a random bit from the seeded generator) in its decision procedure. The objection is that this does not add free will or responsibility; it only adds luck. Because now the outcome is determined by the random bit, which is not under the agent's control. The agent's decision is now a function of the random bit and its internal state, so the ultimate cause of the action is the random bit (which is external to the agent's reasoning). Therefore, this does not help in attributing responsibility to the agent.

  Now, the residue report: which claims map cleanly, which require bending, and which have no expression?

  1. The feeling, from inside deliberation, that more than one outcome is genuinely still open.

     - In our vocabulary: During the execution of the agent module, the code has multiple branches (unexercised paths) that are still reachable at the decision point. The agent's state has not yet committed to one branch. However, in a deterministic system, the outcome is fixed by the seed and the state. So the feeling might be an illusion of the agent not knowing its own state and the future? We can model this as the agent having multiple possible outputs (as per its code) and not having computed the output yet. But the determinism means that the output is fixed. This might not capture the "genuinely open" feeling because in the system, it's already fixed.

     - This might require bending: We can say that from the perspective of the agent module, it has not yet resolved the decision, and the code coverage tool would show that multiple branches are still live. But the determinism undercuts the "genuine" openness. Alternatively, we might have no expression for the subjective feeling of openness.

  2. The difference between blaming something in order to change its future behaviour and blaming it because it deserves it.

     - We can map the first part: blame as a mechanism for behavior modification. We file a bug and fix the code so that next time the module behaves better. This is like fault injection to test the fix.

     - The second part (desert) is harder. Desert implies that the agent is intrinsically deserving of blame, regardless of future consequences. In our vocabulary, we might say that the module was the root cause (via its own decision procedure) and therefore we assign blame to it. But the notion of desert is normative and not just about causal attribution. We don't have a term for desert. This might be a residue.

  3. The idea that a person can be the ultimate source of their own values.

     - In our vocabulary: An agent module that has a loss function (or values) that were not set by an external module but were generated by the agent's own code. But in a deterministic system, the agent's code and initial state were set by the system. So how can it be the ultimate source? We might say that the agent's values were set by an internal training process that was not overridden by any external input. However, the training process itself was shaped by data and initial conditions. The term "ultimate" is problematic because in a deterministic system, the source traces back to the seed and the initial code. This might not map cleanly.

  4. Any question about what blame is for, as opposed to what it does.

     - We can talk about what blame does: it triggers a process of bug fixing, logging, or system redesign. But the purpose (the "for") in a moral sense (e.g., retribution, justice) is outside our vocabulary. We don't have a term for the intrinsic purpose of blame.

  Constraints:

  - Flag where vocabulary begs the question: 
    - "Root cause": This term assumes that we can assign responsibility to a module even in a deterministic system. But incompatibilists might argue that if determinism is true, then the root cause is the seed and the initial conditions, not any module.
    - "Ownership": We might say a module "owns" an action if it produced it. But incompatibilists might say that the module is just a conduit for prior causes.
    - "Bug": We file a bug against a module because we think it should have behaved differently. But if determinism is true, then the module couldn't have done otherwise, so why file a bug? We do it to change future behavior, but the desert aspect is missing.

    To remove the presupposition: 
      Instead of "the agent module is the root cause", we might say "the agent module's state and code were a necessary part of the causal chain that led to the outcome, and without which the outcome would not have occurred in the same way". But note that in a deterministic system, every part is necessary. So we need to specify the level.

  - Do not let the translation decide the debate: We are just mapping terms, not arguing one side.

  Your suspicion: Compatibilism is the observation that causal attribution is layer-relative. 

  Yes, that is a core part of compatibilism. But it's not a cheap parody. Compatibilism adds that for moral responsibility, we require that the agent's decision procedure is the relevant layer and that it meets certain conditions (e.g., it wasn't coerced, it was responsive to reasons). So once we grant layer-relativity, compatibilism still has to specify which layers and under what conditions we hold responsible.

  Now, the three cases:

  (i) An agent whose entire policy was shaped by a loss function written by somebody else, but whose decision on this occasion runs through its own reasoning and would have come out differently had it reasoned better.

     - In our vocabulary: The agent module was trained using a loss function provided by an external entity (the trainer). However, in the current run, the decision is made by the agent's own code (the inference procedure) without external override. Moreover, there exists a counterfactual where if the agent had been in a state that represented better reasoning (e.g., more compute, or a different intermediate state), it would have produced a different output.

     - Is it the source? In the layer-relative sense, yes: the action came from the agent's own decision procedure. But the incompatibilist might argue that the ultimate source is the trainer. The compatibilist would say: as long as the agent's decision procedure is the direct cause and it meets conditions (like being responsive to reasons), then it is responsible. However, if the agent's reasoning was entirely determined by the training, then the trainer might share responsibility. But note: the agent might have been trained to be an autonomous reasoner.

  (ii) A decision module that logs a verdict but is overridden by an upstream system, versus one that is not overridden.

     - This maps to the Frankfurt-style cases (d). The module that is overridden is not the cause of the action because its output was discarded. The module that was not overridden is the cause. The difference matters for responsibility because responsibility requires that the action was actually produced by the agent's own decision procedure (the causal path runs through it). In the free will literature, this is the difference between an action being determined by the agent and being determined by an external force.

  (iii) A harness that lets you edit a register at the decision point and then resume.

     - This is a way to implement "could have done otherwise" in a counterfactual sense. But note: when you edit the register, you are an external agent. So the module did not produce the different outcome by itself. Therefore, this does not show that the module could have done otherwise without external intervention. It shows that if the state had been different (by external editing), then the outcome would be different. But that's true of any deterministic system. The incompatibilist would say that this is not the genuine article because the agent (the module) didn't change the register by itself. The compatibilist might say that the "could have done otherwise" we care about is the one that depends on the agent's own state, and if the agent had been in a different state (for whatever reason, even if that state change came from outside), then it would have acted differently. But that seems to miss the point about the agent's own control.

  Closing:

  - Least confident translation: The feeling of openness during deliberation. I mapped it to the existence of unexercised paths in the code and the agent not having computed the output yet. But the subjective feeling is hard to capture. Also, the idea of being the ultimate source of values.

  - Where the dispute turns on something neither vocabulary can settle: The dispute might turn on the subjective experience of agency and the normative concept of desert. Also, the idea of "ultimate" responsibility (which might require being the first cause) is not captured in a deterministic system with a seed.

