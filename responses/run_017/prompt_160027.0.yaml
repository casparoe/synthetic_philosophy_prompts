prompt: |-
  I've been reading LessWrong and the forums that grew out of it for about fifteen years, so I've watched the part of that world concerned with doing good efficiently go through several self-corrections. There is a pattern I keep seeing in it that I can describe in three pieces but cannot name, and I am not confident the three pieces are the same thing.

  One. A grantmaker compares two programs: a bednet-style distribution with clean randomised evidence and a dollars-per-life-saved figure, and a multi-year effort to change how a national research-funding agency sets its priorities. The second has no usable control group, diffuse and delayed effects, and no unit cost. It loses. It loses again five years later, and this time the reason recorded is that its evidence base is thin. But the thinness is not independent of the earlier decisions: nobody paid for the measurement infrastructure, and the people who would know how to judge that kind of work went elsewhere, so the file gets thinner as a consequence of never having been funded. Measurability here looks like a property of the intervention, but it is partly a product of the funding history.

  Two. The same shape appears in career choice. Someone picks a career by expected lifetime donation. That expectation is computable for software and finance and essentially incalculable for "go build the infrastructure for evaluating the diffuse thing." So the pipeline fills the legible careers, and the advice ("earn to give") treats the existence of an evidence base as a fixed background condition when it is in part a function of who took which job. The evaluators are selected the same way, and are themselves ranked by the same style of cost-effectiveness reasoning, so the people whose job is to notice the exclusion are under the same pressure.

  Three. The corrections I've seen proposed do not seem to escape it. Apply a multiplier to options with weak evidence; ring-fence a fraction of the budget for unmeasurable work; fund hits-based. But to size the correction you need a number for how much you are missing, and producing that number requires exactly the kind of evidence you do not have. Any estimate of the bias is generated by the biased process. And no one inside the system is rewarded for saying "I cannot produce a number for this." The filter appears to operate again on the attempted repair of the filter.

  I don't think this is just Goodhart's law: nothing is being gamed, and the problem is not that a measure degrades once it becomes a target but that a whole class of options never enters the comparison. It isn't quite Campbell's law, which seems to be about deliberate distortion under pressure. The streetlight effect gets closer, except that in the streetlight case the key is wherever it is and only the light is misplaced, whereas here the light is being constructed as we go, so where it is now depends on where we looked before. It is more than path dependence or a Matthew effect, since what compounds is not advantage but apparent certainty. It has a family resemblance to Scott-style legibility, except that no simplifier is imposing a grid; it falls out of many individually sensible choices. And I can't tell whether some of it is just exploitation crowding out exploration, which might be fine.

  So: is there an established concept for this configuration, or for the three pieces separately? Is "measurability bias," which gets thrown around loosely in these discussions, a term of art with a definition, or just a gesture? Does the recursive part — the correction being subject to what it corrects for — have its own literature? If nothing established fits, coin a term and define it, and give me boundary cases: when is this same structure benign, and when is it the thing I think I'm seeing?

  Please don't give me a bibliography or citations; I want the carving — what the phenomenon is, what it isn't, where its edges are — and I'll consider the naming question closed if there is nothing established. Finally, say what would change your mind: which consideration would convince you that I have conflated three unrelated things, or that the whole pattern dissolves into ordinary value-of-information reasoning, and where in your analysis you think the reasoning is most likely to break.
reasoning: |-
  Hmm, the user is describing a sophisticated pattern they've observed in effective altruism circles over 15 years - a self-reinforcing bias toward measurable interventions that creates systemic blind spots. They've broken it into three interconnected pieces: grantmaking favoring measurable projects (creating path-dependent measurability), career choices reinforcing legible evidence bases, and even correction attempts being trapped by the same bias.

  The user clearly has deep familiarity with EA concepts and wants precise conceptual carving. They've already considered and rejected several existing frameworks (Goodhart, Campbell, streetlight effect) as imperfect fits. Their rejection criteria are thoughtful: they emphasize the emergent/systemic nature (not deliberate gaming), path-dependency of evidence, and recursive trapping of solutions.

  Key nuances they're highlighting:
  - Measurability isn't intrinsic but co-created by funding history
  - The bias compounds through evaluator selection
  - Correction mechanisms require the very data they lack
  - No villain - it's emergent from rational individual choices

  They're asking for either established terminology or a newly coined concept, with careful boundary delineation. Crucially, they want to know where this pattern might be benign versus problematic, and what would falsify their observation.

  This requires synthesizing ideas from several domains:
  1) Epistemology (especially the economics of knowledge production)
  2) Systems theory (reinforcing loops, emergent properties)
  3) Decision theory (under uncertainty)
  4) Institutional economics (path dependence)

  The recursive aspect reminds me of Bourdieu's concept of symbolic capital reproduction, and the measurable/non-measurable divide echoes James C. Scott's "legibility" but without central planners - making it more akin to Hayek's knowledge problem in distributed systems.

  For naming, "Evidence Trap" seems most precise - captures both the path-dependency and inescapability. "Metric Gravity" was a contender but too poetic. The three subcomponents all share this core recursive structure but manifest in different domains (funding, careers, corrections).

  Boundary cases:
  - Benign when uncertainty is low (e.g., mature fields)
  - Problematic when high-impact options are systematically excluded
  - Dissolves when evidence infrastructure exists independently

  Falsification would require showing:
  - The "unmeasurable" options are genuinely low-value
  - Or that corrections successfully escape the recursion
  - Or that the bias self-corrects naturally

  The deepest vulnerability in my analysis is whether the phenomenon is truly systemic or just rational resource allocation under uncertainty. But the user's observation about evaluator selection bias suggests it's more structural.
answer: |-
  This is a profound observation of a systemic, self-reinforcing bias in evidence-dependent systems. The phenomenon lacks a single established term but constitutes a coherent pattern I'll define as the **Evidence Trap**. Below is a conceptual carving:

  ### Core Phenomenon: The Evidence Trap
  A recursive system where:
  1. **Measurability bias** favors interventions with quantifiable short-term outcomes.
  2. **Evidence infrastructure atrophy** occurs for hard-to-measure interventions due to chronic underinvestment.
  3. **Correction attempts inherit the bias**, as evaluating the bias requires the same evidence that’s systematically suppressed.

  The trap emerges from rational individual decisions compounding into collective myopia. It’s distinct from:
  - **Goodhart’s Law**: No gaming of metrics; the issue isn’t metric distortion but *exclusion* of non-metric-compatible options.
  - **Campbell’s Law**: No deliberate distortion; the bias is emergent, not intentional.
  - **Streetlight Effect**: Not just searching where light exists; the "light" (evidence capacity) is *endogenously destroyed* for disfavored areas.
  - **Matthew Effect**: Advantage compounds, but here it’s *certainty* (or its illusion) that compounds, not resources.

  ### Your Three Pieces Unified
  1. **Grantmaking**: Evidence atrophy creates path-dependent unmeasurability.  
  2. **Career Choice**: Human capital flows toward "legible" fields, starving evidence infrastructure.  
  3. **Self-Correction Failure**: Multipliers/ring-fenced budgets require quantifying the unquantified – impossible without the very infrastructure that’s atrophied.  

  These are manifestations of the same recursive structure: **Evidence begets evidence; obscurity begets obscurity.**

  ### Boundary Cases
  - **Benign when**:  
    - Uncertainty is low (e.g., mature fields like vaccination programs).  
    - High-impact options are inherently measurable.  
    - Independent evidence infrastructure exists (e.g., government-funded academia).  
  - **Pathological when**:  
    - Highest-impact interventions are complex/long-term (e.g., policy change, culture shifts).  
    - Evidence production relies on the same system it evaluates (no external arbiter).  
    - Urgency dominates (e.g., existential risk crowds out capacity-building).  

  ### Why "Measurability Bias" Isn’t Sufficient
  The term is often used loosely in EA circles but lacks art-status. It describes the *outcome* (bias toward measurable options) but not the *mechanism* (recursive evidence atrophy and self-correction failure). The trap is the dynamic system; measurability bias is its output.

  ### The Recursive Failure: A Meta-Trap
  The correction loop being trapped *is* the core novelty. Literature touches this in:
  - **Epistemic learned helplessness** (in philosophy of science): When methods can’t diagnose their own flaws.  
  - **Institutional self-preservation** (in organizational theory): Systems prioritize legible self-assessment.  
  But no term captures the *evidence-specific* recursion you describe.

  ### What Would Change My Mind
  I’d reconsider if:
  1. **The "unmeasurable" options are consistently low-value**: If historical data showed hard-to-measure interventions *genuinely* underperform, the bias is rational.  
  2. **Corrections escape recursion**: If ring-fenced budgets successfully build evidence infrastructure *without* requiring prior proof (e.g., via leverage points like political mandate).  
  3. **Career effects dominate**: If software/finance earnings *cross-subsidize* evidence infrastructure (making "earn to give" a solution, not part of the trap).  

  ### Weakest Point in My Analysis
  The recursion’s inevitability: If decision-makers consistently factor in **option value** (e.g., preserving future flexibility), the trap might self-correct. EA’s hits-based funding *could* break the cycle if it funds "infrastructure bets" without demanding metrics. If this works in practice, the trap is porous.

  ### Proposed Term
  **Evidence Trap**:  
  *A self-reinforcing system where the reliance on quantifiable evidence suppresses investment in hard-to-measure interventions, leading to the irreversible atrophy of evidence-generation capacity for those domains, and where attempts to correct the bias fail because they depend on the very evidence that has been systematically underproduced.*  

  This matches your description: not three things, but one system with three failure modes. The trap closes when the cost of escaping exceeds the perceived benefit – and we lack the data to recalculate.
