answer: |-
  ### Dialectical Decision Tree: Practical Factors & Knowledge Attributions
  *Starting commitment: When evidence and truth-conditions are fixed, competent speakers vary in attributing knowledge based on what's at stake for someone, and this isn't fully explained by perceived carelessness, inattentiveness, or insincerity.*

  #### The Tree
  *(Technical glosses appear in italics beside each node)*

  1.  **Do you accept this starting claim?**
      *   *No →* **Leaf 1:** The variation is speaker error or miscommunication. Speakers mistakenly think stakes affect knowledge when they don't. *(Unnamed)* | *Awkward:* Must explain why the error pattern is robust and shared.
      *   *Yes →* **Q2**

  2.  **Suppose Alex is in a low-stakes situation (e.g., choosing a snack) and believes P based on evidence E. Bailey is in a high-stakes situation (e.g., life-saving decision) and has the same evidence E for P. If Bailey denies that Alex knows P, is Bailey speaking falsely?** *(Tests if cross-speaker divergence involves contradiction)*
      *   *No →* **Q3**
      *   *Yes →* **Q4**

  3.  **Imagine Chris knows Alex is in a low-stakes snack choice, but Chris is making a life-saving decision. Chris says "Alex knows P". Is Chris speaking truly?** *(Tests whose stakes matter: attributor's or subject's)*
      *   *Yes →* **Leaf 2:** The variation tracks the *attributor's* situation. When speakers disagree, they aren't genuinely contradicting; their words mean different things. *(Contextualism)* | *Awkward:* Explaining why disagreements *feel* substantive despite no contradiction.
      *   *No →* **Leaf 3:** The variation tracks the *attributor's* situation. When speakers disagree, they genuinely contradict; one is wrong. *(Relativism)* | *Awkward:* How truth can be relative to an assessor/context of assessment.

  4.  **Imagine Dana (subject) is logging routine sensor data, unaware an automated system uses it for critical safety checks. Dana has strong evidence E for P ("Sensor 5 reads 25°C"). If asked, would speakers attribute knowledge of P to Dana?** *(Tests if subject needs to appreciate stakes)*
      *   *Yes →* **Leaf 4:** Variation tracks the *subject's* situation, but the subject *doesn't* need to appreciate the stakes. *(Subject-Sensitive Invariantism - No Accessibility)* | *Awkward:* Knowledge can be destroyed/lowered by facts unknown to the subject.
      *   *No →* **Q5**

  5.  **Imagine Evan believes P ("The meeting is Friday") based on memory yesterday (low stakes). Overnight, stakes become critical (e.g., meeting now involves job loss). Today, with unchanged evidence, does Evan still know P?** *(Tests stakes timing: formation vs. action/attribution)*
      *   *Yes →* **Leaf 5:** Variation primarily tracks stakes at the *time of belief formation*. *(Unnamed)* | *Awkward:* Explains why later stakes changes seem impactful.
      *   *No →* **Leaf 6:** Variation tracks stakes at the *time of action or attribution*. *(Pragmatic Encroachment / Interest-Relative Invariantism)* | *Awkward:* Knowledge can be lost/gained without evidence change, just via changing stakes.

  6.  **Imagine Fran believes P ("This artifact is 300 years old") and will *never* act on it (e.g., it's sealed in a vault). Stakes are high (national treasure). Does Fran know P?** *(Tests if action-ability is necessary)*
      *   *Yes →* **Leaf 7:** Variation tracks the *subject's* situation, but action-ability isn't required; stakes alone (even without potential action) suffice. *(Subject-Sensitive Invariantism - Broad)* | *Awkward:* Knowledge depends on stakes even for purely theoretical beliefs.
      *   *No →* **Leaf 8:** Variation requires the subject *could* act on the belief; stakes matter because they affect action. *(Pragmatic Encroachment - Action-Oriented)* | *Awkward:* Knowledge status of purely theoretical beliefs.

  7.  **Imagine Gail faces a choice: if she's wrong about P, she loses £1; if she's *right* about P, she causes significant harm to others. Speakers are reluctant to say "Gail knows P". Is this reluctance explained similarly to high-stakes (wrong=loss) cases?** *(Tests if low-stakes-when-right matters / directionality)*
      *   *Yes →* **Leaf 9:** The barrier to knowledge is raised both by high cost of *being wrong* AND by high cost of *being right*. *(Unnamed - Bidirectional)* | *Awkward:* Counters the standard intuition that only cost-of-error matters.
      *   *No →* **Q8** (Proceed assuming only cost-of-error raises barriers)

  8.  **Imagine Hal has strong evidence P ("Patient has virus X"). The cost of being wrong is high, but it's *moral* (wrong diagnosis causes patient dignity loss) not prudential (financial/health loss). Does this cost raise the epistemic bar for Hal to know P?** *(Tests cost type: prudential, moral, both)*
      *   *Yes, moral costs suffice →* **Leaf 10:** Variation tracks costs, including specifically *moral* costs of error. *(Moral Encroachment)* | *Awkward:* Blurs epistemic and ethical norms.
      *   *No, only prudential costs matter →* **Leaf 11:** Variation tracks specifically *prudential* costs of error. *(Pragmatic Encroachment - Prudential)* | *Awkward:* Moral costs seem intuitively relevant in some cases.
      *   *Both together matter more →* **Leaf 12:** Prudential and moral costs interact, potentially compounding the effect. *(Unnamed)* | *Awkward:* Defining the interaction mechanism.

  9.  **Imagine Isa must make 200 independent, low-stakes judgements daily (e.g., quality checks on widgets). Each error costs pennies. Does the *volume* of decisions make speakers require stronger evidence for each "Isa knows this widget is OK" attribution?** *(Tests aggregation)*
      *   *Yes →* **Leaf 13:** The epistemic bar rises with the *number* of judgements relying on similar evidence/tasks, even if individual stakes are low. *(Aggregation View - Unoccupied)* | *Diagnosis:* Unexplored & potentially unattractive; conflates individual justification with aggregate risk management.
      *   *No →* **Q10**

  10. **When speakers hesitate to attribute knowledge in high stakes, is this primarily because: (A) The subject needs to rule out *more possibilities* of error? (B) The subject needs evidence that is *stronger* in degree? (C) The attribution itself is about something different (e.g., knowing P *rather than Q*)? (D) The speaker shouldn't *act* on the belief or assert it confidently?** *(Mechanism of variation)*
      *   *A →* **Leaf 14:** Variation involves which error possibilities are *relevant alternatives*. *(Relevant Alternatives Theory)* | *Awkward:* Defining relevance non-circularly.
      *   *B →* **Leaf 15:** Variation involves the *strength* of epistemic position required (e.g., confidence level). *(Threshold Variabilism)* | *Awkward:* Quantifying the required threshold shift.
      *   *C →* **Leaf 16:** Variation involves a shift in the *contrast* (knowing P rather than some specific alternative Q). *(Contrastivism)* | *Awkward:* Explaining simple knowledge claims ("She knows P").
      *   *D →* **Leaf 17:** Variation concerns the *pragmatic propriety* of acting, asserting, or relying on the belief, not the truth of "knows". *(Pragmatic/Assertoric Invariantism)* | *Awkward:* Explaining why speakers *say* "she doesn't know" when they mean "she shouldn't act".

  #### Coverage Table & Key

  | Path (Q# Answers) | View (Leaf #)                                  | Standard Label (Where Applicable)                  |
  | :---------------- | :--------------------------------------------- | :------------------------------------------------- |
  | 1 No              | Speaker Error                                  | Unnamed (Leaf 1)                                   |
  | 2 No → 3 Yes      | Attributor-Sensitive, No Contradiction         | Contextualism (Leaf 2)                             |
  | 2 No → 3 No       | Attributor-Sensitive, Genuine Contradiction    | Relativism (Leaf 3)                                |
  | 2 Yes → 4 Yes     | Subject-Sensitive, No Appreciation Needed      | Subject-Sensitive Invariantism (No Acc.) (Leaf 4)  |
  | 2 Yes → 4 No → 5 Yes | Stakes at Formation Matter                 | Unnamed (Leaf 5)                                   |
  | 2 Yes → 4 No → 5 No  | Stakes at Action/Attribution Matter        | Pragmatic Encroachment (Leaf 6)                    |
  | ...5 No → 6 Yes   | Subject-Sensitive, No Action Needed            | SSI (Broad) (Leaf 7)                               |
  | ...5 No → 6 No    | Subject-Sensitive, Action Needed               | Pragmatic Encroachment (Action) (Leaf 8)           |
  | ...6 No → 7 Yes   | Bidirectional Stakes Effect                    | Unnamed (Leaf 9)                                   |
  | ...6 No → 7 No → 8 Yes | Moral Costs Suffice                        | Moral Encroachment (Leaf 10)                       |
  | ...7 No → 8 No    | Only Prudential Costs Matter                   | Pragmatic Encroachment (Prudential) (Leaf 11)      |
  | ...7 No → 8 Both  | Interaction of Prudential & Moral Costs        | Unnamed (Leaf 12)                                  |
  | ...8 No → 9 Yes   | Aggregation Raises Bar                         | Unoccupied (Leaf 13)                               |
  | ...9 No → 10 A    | Shift in Relevant Alternatives                 | Relevant Alternatives (Leaf 14)                    |
  | ...9 No → 10 B    | Shift in Strength/Threshold Required           | Threshold Variabilism (Leaf 15)                    |
  | ...9 No → 10 C    | Shift in Contrast Class                        | Contrastivism (Leaf 16)                            |
  | ...9 No → 10 D    | Pragmatic/Assertoric Propriety, Not Truth      | Pragmatic/Assertoric Invariantism (Leaf 17)        |

  | Standard Label                  | Path (Q# Answers)                                    | Leaf # |
  | :------------------------------ | :--------------------------------------------------- | :----- |
  | Speaker Error                   | 1 No                                                 | 1      |
  | Contextualism                   | 2 No → 3 Yes                                         | 2      |
  | Relativism                      | 2 No → 3 No                                          | 3      |
  | Subject-Sensitive Invariantism  | 2 Yes → 4 Yes OR ...5 No → 6 Yes                     | 4 or 7 |
  | Pragmatic Encroachment          | 2 Yes → 4 No → 5 No OR ...5 No → 6 No OR ...7 No → 8 No | 6, 8, or 11 |
  | Moral Encroachment              | ...7 No → 8 Yes                                      | 10     |
  | Relevant Alternatives           | ...9 No → 10 A                                       | 14     |
  | Contrastivism                   | ...9 No → 10 C                                       | 16     |
  | Pragmatic/Assertoric Invariantism | ...9 No → 10 D                                       | 17     |
  | *Unnamed/Unoccupied Positions*  | *See Paths for Leaves 5, 9, 12, 13*                 | *5,9,12,13* |

  #### Unresolved Empirical Hostages
  *   **Q2/Q3:** Whether speakers judge cross-context attributions as contradictory. *(Crucial for Contextualism vs. Relativism vs. Invariantism)*
  *   **Q4:** Whether speakers attribute knowledge in unaware-technician cases. *(Crucial for Subject-Sensitive Invariantism accessibility)*
  *   **Q6:** Whether speakers attribute knowledge for high-stakes, never-acted-on beliefs. *(Crucial for Action-Oriented vs. Broad views)*
  *   **Q7:** Whether "inverted stakes" cases pattern with high-stakes cases. *(Crucial for Directionality)*
  *   **Q8:** Whether purely moral costs affect knowledge attributions similarly to prudential costs. *(Crucial for Moral vs. Prudential Encroachment)*
  *   **Q9:** Whether volume/aggregation affects knowledge attributions. *(Crucial for Aggregation View)*

  #### Inseparable Pairs & Further Tests
  1.  **Leaf 2 (Contextualism) vs. Leaf 17 (Pragmatic Invariantism):** Both predict speaker's stakes affect *attributions*. *Separating Test:* Ask if "S knows P" can be *true* in a low-stakes context even if uttered/assessed in a high-stakes context (Contextualism: Yes, Pragmatic Invariantism: Truth is fixed). Requires meta-linguistic assessment data.
  2.  **Leaf 6/8/11 (Pragmatic Encroachment) vs. Leaf 4/7 (Subject-Sensitive Invariantism):** Both predict subject's stakes matter. *Separating Test:* Mismatch cases (Q3) - does the *attributor's* high stakes ever prevent them from truthfully attributing knowledge to a low-stakes subject? SSI says No (Leaf 4/7), PE often says Yes (depends on view of action/attribution timing). Also test Q4 (unaware subject) - PE often requires subject awareness, SSI may not (Leaf 4). *Potentially separable with specific mismatch/unaware cases.*
  3.  **Leaf 10 (Moral Encroachment) vs. Leaf 11 (Prudential Encroachment):** Both predict some costs matter. *Separating Test:* Cases with *only* moral costs vs. *only* prudential costs, controlling for perceived magnitude (Q8). *Empirically separable.*
  4.  **Leaf 14 (Relevant Alternatives) vs. Leaf 15 (Threshold):** Both predict higher standards. *Separating Test:* Cases where the *same* alternatives are considered, but the required confidence shifts (difficult to construct). *Hard to separate in practice; mechanism may be underdetermined by cases.*

  #### Flagged Unoccupied/Thinly Occupied Cells
  *   **Leaf 5 (Stakes at Formation Only):** *Unexplored/Unattractive.* Stakes changes *after* formation intuitively seem to affect whether we *say* someone "still knows". Explaining this solely via propriety of assertion/action is difficult for this view.
  *   **Leaf 9 (Bidirectional Stakes):** *Thinly occupied/Unexplored.* The idea that cost-of-being-right lowers the bar conflicts with the core intuition driving encroachment (cost-of-error). Few defend this systematically.
  *   **Leaf 12 (Interaction of Prudential & Moral Costs):** *Unexplored.* While both types are discussed, the specific interaction (e.g., compounding) lacks detailed theoretical models. Requires more empirical work on how speakers weigh combined costs.
  *   **Leaf 13 (Aggregation View):** *Unoccupied/Unattractive.* As diagnosed, it risks conflating individual epistemic status with aggregate practical risk management. No major theory incorporates volume this way.

  #### Walking Profiles Through
  1.  **Purist (Knowledge fixed only by evidence & truth):** Rejects the starting claim (Q1: No). → **Lands at Leaf 1** (Speaker Error).
  2.  **Subject's Stakes Raise the Bar:** Accepts starting claim (Q1: Yes). Thinks unaware technician (Q4) knows → **Q4: Yes**. → **Lands at Leaf 4** (SSI, No Accessibility Needed). *[Note: If they thought tech didn't know, path would be Q1 Yes → Q4 No → Q5 ... likely Leaf 6 or 8 depending on Q6].*
  3.  **Aggregation View:** Accepts starting claim (Q1: Yes). Likely says unaware tech (Q4) *doesn't* know (aggregate risk matters regardless of awareness), or takes path via Q9. Believes volume raises the bar (Q9: Yes). → **Lands at Leaf 13** (Unoccupied Aggregation View).
