prompt: |-
  I have to give a single seventy-five-minute seminar on Dewey's experimentalism to a reading group of software engineers: people who run A/B tests for a living, have no philosophy background, and will arrive assuming democracy is a mechanism for aggregating pre-existing preferences. Plan the session; don't write it.

  I need the dependency structure first. My instinct is that the claim that inquiry is triggered by an indeterminate situation — a disruption that can't be resolved by applying an existing habit — has to be on the table before I say anything about voting, deliberation, or democracy, and that only then can the analogy between experimental revision of a hypothesis and experimental revision of a policy do any work. Confirm or correct that order, and say what each step is setting up.

  Then the carrying example. I want to build the session around a hospital morbidity-and-mortality conference: a regular, non-punitive review of adverse outcomes whose whole point is to revise protocol rather than to assign blame. My worry is that it carries inquiry perfectly and democracy not at all, since it's expert-run and nobody outside the room is implicated by the decision. Should I run it as a case that gets deliberately broken and extended partway through, or drop it for something else? Tell me what a single example must contain to do both jobs, and what mine necessarily lacks.

  The misconceptions I expect: that experimentalism is just randomized controlled trials scaled up, that calling a policy an experiment means trying it and watching the polls, and that fallibilism means no course of action can be criticized. Give me the point in the sequence where each should be headed off, not just a rebuttal to each.

  Finally: one closing question that separates someone who has the idea from someone who has only picked up the vocabulary, and one thing I should explicitly announce I am not going to cover in seventy-five minutes.
reasoning: |-
  Okay, let's tackle this Dewey seminar plan for software engineers. The user wants a tight 75-minute session that connects experimentalism to democratic practice, using concepts familiar to A/B testers while challenging their assumptions about democracy. 

  First, the dependency structure - the user's instinct feels right. You absolutely need to establish Dewey's core model of inquiry before connecting it to democracy. Trying to jump straight to voting analogies would make this feel like a forced metaphor rather than a coherent framework. The sequence should be: indeterminate situation → blocking habit → inquiry as experimental action → resulting in reconstructed habit (or "warranted assertion" in Dewey-speak). Only then can you map this to policy/democracy as collective habit-reconstruction. 

  About the hospital M&M conference example - it's brilliant for inquiry but indeed lacks democratic dimensions. Instead of dropping it, I'd stage it in three phases: first show the inquiry mechanics (how they diagnose system failure without blame), then break it by revealing the janitor wasn't consulted about the carrying protocol, exposing the exclusion of affected stakeholders. That pivot sets up the need for inclusive participation - the democratic layer. 

  For misconceptions: the "RCTs scaled up" myth needs killing early when defining experimental action. Emphasize that for Dewey, experiments are context-sensitive adjustments of means/ends - not lab controls. The "polls as results" mistake should be preempted when discussing how inquiry evaluates consequences (not just preferences!). Fallibilism confusion gets addressed during habit reconstruction - stress that provisionality demands more criticism, not less. 

  Closing question: "Why would Dewey say an A/B test on button colors isn't experimentalism?" (Tests existing preferences; no habit disruption). And explicitly omit epistemology - no time for Dewey's theory of truth. 

  The user's clearly done their homework on both Dewey and their audience. My tweaks just tighten the conceptual joints where philosophy meets engineering culture. The M&M case stays central because its clinical precision mirrors how engineers think, making the democratic extension more persuasive when it lands.
answer: |-
  Here’s a structured plan addressing dependencies, example adaptation, misconception handling, and closing elements:

  ### **Dependency Structure**  
  *(Confirming your instinct: Inquiry → Democracy Analogy)*  
  1. **Trigger: Indeterminate Situations (10 min)**  
     - **Set up:** Define "indeterminate situation" (e.g., software outage, ambiguous user feedback). Contrast with "problem" (solved by existing habits/routines).  
     - **Purpose:** Establish that inquiry starts with *disruption*, not curiosity. Prevents "democracy = preference aggregation" misconception early.  

  2. **Inquiry as Experimental Action (15 min)**  
     - **Set up:** Dewey’s inquiry cycle: disruption → hypothesis formation → action-testing → evaluation → reconstructed habit. Map to A/B testing:  
       *Indeterminate (e.g., low engagement) → Hypothesis (Button A > B) → Test → Data → New "habit" (feature roll-out)*.  
     - **Purpose:** Frame experimentation as *habit-reconstruction*, not just data collection. Prevents "RCTs scaled up" misconception.  

  3. **Habits as Social & Provisional (10 min)**  
     - **Set up:** Habits = collective protocols (e.g., DevOps practices). Emphasize: habits fail when contexts change (indeterminacy).  
     - **Purpose:** Prepares democracy analogy by showing habits are shared, fallible, and context-bound.  

  4. **Democracy as Collective Inquiry (20 min)**  
     - **Analogize:**  
       - *Indeterminate situation* = societal disruption (e.g., housing crisis).  
       - *Hypothesis-testing* = policy prototyping (e.g., zoning reform pilot).  
       - *Reconstruction* = revised social "habit" (law/norm).  
     - **Key contrast:** Democracy isn’t aggregating preferences (pre-formed), but *transforming them* through experimental action.  

  ---

  ### **Hospital M&M Example: Adaptation**  
  **Problem:** Expert-driven, lacks democratic participation.  
  **Solution: Break and extend it midway.**  
  - **Phase 1: Inquiry Model (10 min)**  
    - Describe M&M: Root-cause analysis of a carrying-related injury → protocol revised.  
    - **Strengths:** Non-punitive, habit-reconstruction, data-driven. Perfect for inquiry.  
  - **Phase 2: Break It (5 min)**  
    - Reveal: The janitor injured was never consulted. The "fixed" protocol fails because affected stakeholders were excluded.  
    - **Pivot:** "This is inquiry, but not *democratic* inquiry. Why?"  
  - **Phase 3: Extend to Democracy (5 min)**  
    - Redesign: Include janitors, patients, and architects in protocol review.  
    - **Bridge:** Democratic experimentalism requires *participation of all affected* in defining problems, tests, and evaluations.  

  **What the Example Gains:**  
  - Illustrates inquiry’s core (Phase 1).  
  - Exposes democracy’s necessity: inclusion prevents "solutions" that ignore context/stakeholders (Phase 2-3).  

  ---

  ### **Misconception Handling**  
  1. **"Experimentalism = RCTs scaled up"**  
     - **When:** During **Step 2 (Inquiry as Experimental Action)**.  
     - **Preempt:** Contrast Deweyan tests (pragmatic, context-rich, participatory) with RCTs (controlled, decontextualized). Ask: *"Would an RCT fix our hospital carrying protocol if janitors aren’t in the room?"*  

  2. **"Policy experiments = try it → watch polls"**  
     - **When:** During **Step 4 (Democracy as Collective Inquiry)**.  
     - **Preempt:** Stress that evaluating consequences requires *structured participation* (e.g., community feedback loops), not passive polling. Polls = preferences pre-inquiry; Dewey seeks *transformed* preferences.  

  3. **"Fallibilism = no criticism"**  
     - **When:** During **Step 3 (Habits as Provisional)**.  
     - **Preempt:** Argue fallibilism *demands* criticism: "If habits are always context-bound, we *must* critique them when contexts shift."  

  ---

  ### **Closing Elements**  
  1. **Discernment Question:**  
     *"Why would Dewey say a referendum on tax policy isn’t experimental democracy?"*  
     - **Answer:** If it merely aggregates pre-existing preferences without participatory problem-solving/action-testing.  

  2. **Explicit Omission:**  
     *"We won’t cover Dewey’s metaphysics (e.g., nature of experience) or his educational theory—focus is on democracy as experimental practice."*  

  ---

  ### **Why This Flow Works**  
  - **Software Engineers → Dewey:** Starts with shared touchstones (A/B tests) and gradually layers philosophy.  
  - **M&M Example:** Builds credibility with a rigorous case, then expands to democracy via its *failure mode*.  
  - **Democracy Redefined:** Emerges as *inclusive, iterative protocol-building*—not vote-counting.  
  - **Pacing:** 75 min = Trigger (10) + Inquiry (15) + Habits (10) + Democracy (20) + Example (20). Q&A embedded throughout.  

  Key move: Democracy isn’t where inquiry happens; it *is* inquiry scaled socially. The rest is engineering.
