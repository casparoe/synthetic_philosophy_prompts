prompt: |-
  I'm a software engineer by trade and have never studied philosophy formally, but over the last few years I've ended up in a workplace-adjacent volunteering and mutual-aid circle where people with quite different causes make explicit deals with each other: I take on a cost that matters to you, you take on a cost that matters to me, and we both walk away with more of what we each partly wanted. A friend once referred to these as moral-trade deals; I have no idea whether that is a real term of art. What I do know is that I have confident reactions to particular instances, that my reactions don't seem to line up with each other, and that I can't state the rule I'm applying. I'd like help finding it.

  Here are my verdicts.

  1. Priya cares mainly about animal welfare, Marcus mainly about local homelessness. Priya gives up a Saturday to work at a shelter, which she finds tedious but not awful. Marcus gives up meat for a month, which he genuinely dislikes. Each would rather have this arrangement than no arrangement. My verdict: good, obviously, and worth encouraging. This is my paradigm case and any principle I accept has to keep it.

  2. Sam cares about malaria, Nora about AI safety. Each was going to donate two hundred dollars to their own cause anyway; instead they agree that each will donate two hundred to the other's. My verdict: empty. On my accounting both causes end up with the same money and both people give the same amount; nothing has happened except whose name is on which receipt. Not wrong, just pointless. And a corollary that I find myself believing without being able to justify: if one of them puts in noticeably more than the other, my reaction flips from pointless to someone is being taken advantage of, though there is no market price for a cause and so, as far as I can see, no standard by which to call the exchange rate unfair.

  3. Alex offers to stop driving to work if Nora volunteers eight hours at a food bank. Alex has in fact already decided to stop driving, because a bike lane just opened on his route. My verdict: I dislike this. Alex hands over something that costs him nothing and extracts something real. But I get stuck here: suppose Nora knows about the bike lane, doesn't mind, and prefers the arrangement to no arrangement. I still feel something is off, and I can't tell whether that is a genuine objection or only my distaste for a deal with no friction in it.

  4. Same shape, deliberately manufactured: someone takes up a practice they have no interest in, purely in order to have something to offer to give up. My verdict: clearly bad, and I treat that as settled. But I want to know where the line between 3 and 4 actually runs. Is the difference only whether the cost was created for the purpose of the deal, or does 3 already contain the seed of 4?

  5. Dana and I each agreed to run a lunchtime session for the other's cause. We scheduled them in the same week; the audience split; each event did roughly half of what it would have done on its own. My verdict: this turned out to be a materially worse deal than either of us signed, even though nobody was misled and nobody did anything wrong. It makes me think the value of a concession is not a fixed quantity you can price once, but a function of what else is happening around it.

  6. Two colleagues each agree to drop a workplace campaign the other dislikes, one on accessibility and one on pay transparency, in exchange for the other dropping theirs. Both are personally better off: less conflict, fewer enemies, more time. The people the campaigns were meant to help lose out. My verdict: wrong, and clearly worse than case 1, even though structurally both parties bear a cost and both gain.

  7. My own case, two years ago. I agreed to stop publicly advocating for something I believed in — not to stop doing it, only to stop making the case for it — in exchange for a concession I valued more from someone on the other side. The terms were fair by any measure I can construct, and I would accept them again on the numbers, and I now think it was a mistake. Two things happened that I did not price: I found myself caring less about the thing afterwards, and people who cared about it began treating me as unreliable, while people who had been undecided seemed to infer from my willingness to sell that it cannot have mattered very much. My verdict: bad. And I cannot reconcile this with case 1, where the concessions were also visible to others and also public.

  The best principle I can manage on my own has four clauses: each side must bear a real cost; the cost must be real against a baseline of no deal at all, not merely against a baseline where the deal exists; the values of the two concessions must be roughly independent, so that the pair is worth the sum of its parts; and nobody outside the deal may be made worse off. That handles 3, 4, 5 and 6. It does not explain why 2 strikes me as empty rather than merely permissible, and it fully permits 7, which I now reject.

  So: state the principle precisely, or the two or three candidate principles if there is no single one, with the clause-by-clause note of which of my cases forces which clause; tell me which of my verdicts you think has to go and why; tell me whether 7 is really just a case of the fourth clause with an unusual kind of externality — my willingness to trade being itself a piece of information other people use, including me — or something that needs its own clause. I'm also unsure whether the vocabulary I half-remember from carbon offsets, where a credit is supposed to be additional, permanent and not double-counted, transfers cleanly to deals between people, or whether it distorts the question by making everything look like accounting. And there is a further worry I can't shake: if the people most willing to name a price are the least committed, then the trades that actually get made are the ones that most understate how much the traded things matter, which might make the practice self-undermining in a way that no participant sees — I'd like to know whether that argument works, or whether it proves too much.

  Finally, give me two or three cases of your own construction where the principle you settle on returns a verdict I would not have anticipated, so I can test it rather than admire it. Please argue it out rather than point me at books or papers: I have no way to chase references, and I'm after the carving, not a reading list.
reasoning: |-
  Hmm, this user presents a fascinating ethical puzzle about "moral trade deals" based on their real-world experiences. They're a software engineer without formal philosophy training but clearly have deep observational skills and analytical rigor. Their frustration with inconsistent intuitions reminds me of Rawls' reflective equilibrium - they're trying to systematize moral judgments that currently feel disjointed.

  The seven cases are brilliantly constructed to probe different pressure points: Case 1 is their uncontroversial baseline, Case 2 exposes valuation puzzles, Cases 3-4 test cost authenticity, Case 5 reveals contextual dependencies, Case 6 introduces third-party harm, and Case 7 adds psychological/existential dimensions. Their self-formulated principle shows impressive structuring (baselines, independence, externalities) but fails on Cases 2 and 7.

  What makes this tricky is how these deals blend:
  - Consequentialism (outcomes for causes)
  - Deontology (duties to third parties)
  - Virtue ethics (character effects)
  - Game theory (value interdependence)

  Their carbon offset analogy is apt - "additionality" is crucial but insufficient alone. The self-undermining concern about least-committed traders is profound; it echoes Arrow's impossibility theorem in social choice theory. Case 7's retrospective regret suggests identity-constitutive commitments resist commodification.

  For the solution, I need to:
  1) Preserve Case 1 as valid while invalidating Case 7
  2) Explain Case 2's emptiness without calling it immoral
  3) Distinguish Cases 3 and 4 cleanly
  4) Formalize the "slippery concession" problem in Case 5
  5) Handle third-party harms in Case 6 rigorously

  The key insight is separating:
  - Material transfers (money, labor)
  - Symbolic actions (advocacy, identity signals)
  - With the latter having network effects that undermine when traded

  Hence the three principles I'll propose:
  1) Material Consequence Principle (handles Cases 1,2,5)
  2) Authentic Cost Principle (Cases 3,4)
  3) Non-Alienation Principle (Cases 6,7)

  The test cases will stress: 
  - Tradable vs non-tradable commitments
  - When identical material transfers differ symbolically
  - How deal publicity transforms value

  This should resolve their tension between Cases 1 and 7 - advocacy concessions aren't just actions but identity signals, making them poor trade candidates regardless of "fairness."
answer: |-
  Based on your cases and verdicts, I propose a unified principle with three core clauses and an important meta-rule. Your verdicts reveal that "moral trades" aren't just about material transfers, but about **signaling commitment through costly sacrifice** and **preserving the integrity of causes**. Here's the principle refined through your cases:

  ### The Principle of Authentic Moral Trade
  A moral trade is permissible and non-exploitative **only if**:
  1. **Authentic Cost**: Each party bears an **irreversible opportunity cost** relative to their *personal baseline actions without any trade* (addressing Cases 1, 3, 4).
  2. **Material Net Gain**: The trade generates **new resources or effort** for the causes involved, beyond mere reallocation (addressing Cases 2, 5).
  3. **Non-Corruption**: The trade does not **undermine the social credibility** of the causes, advocates, or the practice of moral trade itself (addressing Cases 6, 7).

  ### Clause-by-Clause Breakdown Against Your Cases
  - **Case 1 (Priya/Marcus)**:  
    ✓ **Authentic Cost**: Both sacrificed something they *would have kept* without the trade (Priya’s Saturday, Marcus’s meat).  
    ✓ **Material Net Gain**: New labor for homelessness, new funds for animals (assuming Marcus’s savings went to charity).  
    ✓ **Non-Corruption**: Causes gain credibility through visible sacrifice; no deception.  
    → **Verified: Good** (your paradigm holds).

  - **Case 2 (Sam/Nora)**:  
    ✗ **Material Net Gain**: No new resources; causes get identical funding. Swapping receipts is pure relabeling.  
    → **Explains "emptiness"**: Fails Clause 2. Permissible but pointless.

  - **Case 3 (Alex/Nora)**:  
    ✗ **Authentic Cost**: Alex’s cost is reversible (he already decided to bike). He sacrifices nothing.  
    → **Explains your discomfort**: Fails Clause 1. Nora is exploited even if she consents, as Alex’s "concession" is fake.

  - **Case 4 (Manufactured cost)**:  
    ✗ **Authentic Cost**: Deliberately creating a "cost" (e.g., taking up smoking to "quit") is not an *opportunity cost* from a baseline. It’s artificial.  
    → **Explains "clearly bad"**: Fails Clause 1. This is fraud, not trade.

  - **Case 5 (Dana/you)**:  
    ✗ **Material Net Gain**: Context (scheduling clash) eroded the value. The *net effort* for each cause decreased.  
    → **Explains "worse deal"**: Fails Clause 2. Value depends on execution, not intent.

  - **Case 6 (Colleagues)**:  
    ✗ **Non-Corruption**: Third parties (marginalized groups) are harmed. Trade signals that advocates prioritize personal comfort over cause integrity.  
    → **Explains "wrong"**: Fails Clause 3. Sacrifice isn’t directed toward moral gain.

  - **Case 7 (Your advocacy trade)**:  
    ✗ **Non-Corruption**: Trading advocacy eroded *your commitment* and *others’ trust*. It signaled that the cause was negotiable, damaging its credibility.  
    → **Explains retrospective "bad"**: Fails Clause 3. Unlike Case 1 (where labor is fungible), advocacy is identity-locked.

  ---

  ### Why Your Verdicts Mostly Hold (But One Must Go)
  - **Case 2 must be downgraded from "pointless but permissible" to "impermissible under the principle"** if you accept Clause 2. Empty trades waste time/attention and normalize zero-sum moral accounting. But if you insist on neutrality, label it "permissible but irrational."  
  - **Case 3 and 4 are correctly distinguished**: Case 3 fails due to *lack of authentic cost*; Case 4 fails due to *fraudulent cost creation*. The line: if the cost *predates and is independent* of the trade, it’s Case 3; if *manufactured for trade*, it’s Case 4.  
  - **Case 7 vs. Case 1**: The difference is **alienability**. Labor (Case 1) can be traded without corrupting the cause; advocacy (Case 7) cannot, because it’s a signal of conviction. Selling conviction undermines its social function.

  ---

  ### Your Lingering Concerns Resolved
  - **Carbon offset analogy**: "Additionality" (your baseline clause) is necessary but insufficient. "Permanence" maps to irreversible cost (Clause 1); "not double-counted" maps to material net gain (Clause 2). But moral trades add **non-corruption** (Clause 3) because causes rely on human credibility.  
  - **Self-undermining trades**: Valid! If only the least committed trade, concessions become cheap signals. This violates Clause 3: it corrupts the *system* of moral trade by selecting for low-commitment actors. Solution: Prioritize trades where costs are verifiably high (e.g., Marcus genuinely hates vegetarianism).  
  - **Case 7 as externality?**: Yes, but it’s inherent to the action. Advocacy isn’t just a cost; it’s a *credibility token*. Trading it always risks corruption (Clause 3), making such deals inadvisable even if materially "fair."

  ---

  ### Test Cases: Where the Principle Surprises
  1. **The Token Vegan**:  
     *Chloe (environmentalist) offers to go vegan for a month if Ben (anti-racist) attends a protest. Chloe was vegan for years and recently quit; resuming costs nothing. Ben’s protest attendance is arduous.*  
     → **Verdict**: Bad (fails Clause 1). Chloe’s cost isn’t authentic. *Surprise*: Even if Ben values Chloe’s "veganism," it’s exploitative. Tests baseline rigor.

  2. **The Amplified Donation**:  
     *Two donors swap $1k donations: Sam (malaria) gives to Nora’s (AI safety) charity, and vice versa. Both charities have matching grants: Sam’s triggers $2k extra; Nora’s triggers nothing.*  
     → **Verdict**: Good (passes all). Clause 2: Net gain ($2k new funds). Tests material gain beyond intent.

  3. **The Silent Advocate**:  
     *Lee stops publicly advocating for policy X in exchange for Maya funding a related project. Lee continues working on X privately. No one knows of the deal.*  
     → **Verdict**: Permissible (passes all). Clause 3: No credibility loss because no signal was sent. Tests hidden vs. public concessions.

  ---

  ### Summary
  Your intuition tracks **sacrifice authenticity**, **net impact**, and **social integrity**. The principle systematizes this:  
  - **Clause 1** kills fake costs (Cases 3,4).  
  - **Clause 2** kills zero-sum swaps (Case 2,5).  
  - **Clause 3** kills self-undermining trades (Cases 6,7).  

  **What changes**: Case 2 becomes impermissible, Case 7 is barred by corruption risk, and "independence" is replaced by "net gain." **What holds**: Your other verdicts are vindicated. Moral trade isn’t accounting—it’s **governed by the physics of credibility**. If a concession can’t be sold without devaluing it, it shouldn’t be traded.
