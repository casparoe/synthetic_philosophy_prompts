  ### Model Answer

  **Part (a): Optimal Cooperation Threshold and Nature of Dependence**  
  Vega faces a prisoner's dilemma with Altair, where the probability of being linked (i.e., sharing the same decision procedure) is \(p = \tau_V \cdot \tau_A\). If linked, choices coincide; if unlinked, Altair cooperates with probability \(1/2\). Vega’s expected payoffs for cooperation (C) and defection (D) are:  
  - \(V(C) = p \cdot 3 + (1 - p) \cdot (0.5 \cdot 3 + 0.5 \cdot 0) = 3p + 1.5(1 - p)\)  
  - \(V(D) = p \cdot 1 + (1 - p) \cdot (0.5 \cdot 5 + 0.5 \cdot 1) = p + 3(1 - p)\)  

  Cooperation is optimal when \(V(C) > V(D)\):  
  \[3p + 1.5 - 1.5p > p + 3 - 3p\]  
  \[1.5p + 1.5 > 3 - 2p\]  
  \[3.5p > 1.5\]  
  \[p > \frac{3}{7}\]  
  Thus, cooperation becomes optimal when \(p > \frac{3}{7}\).  

  **Dependence, Causality, and Contrast with Correlated Equilibrium**  
  The dependence between Vega’s choice and Altair’s in the linked case is **acausal subjunctive dependence**: Vega’s choice *counterfactually determines* Altair’s because they share identical decision procedures. If Vega cooperates, Altair’s identical procedure outputs cooperation *as a logical consequence*, not due to causal influence. This is distinct from:  
  - **Causal influence**: Impossible, as Vega and Altair are spacelike separated (no signaling).  
  - **Correlated equilibrium (CE)**: In CE, agents condition actions on a shared signal (e.g., a mediator’s coin flip). Here, there is no external signal; dependence arises from intrinsic procedural identity. Agents cannot condition on "linked/unlinked" status (unobservable), only on \(p\).  
  - **Common cause**: If correlation stemmed from a common cause (e.g., both agents observe a signal), Vega could condition on that signal. But with procedural identity, Vega’s choice directly fixes Altair’s in the linked world via logical entailment, not Bayesian updating.  

  If correlation were a common cause, cooperation thresholds would depend on signal observability, but here \(p\) alone matters.  

  **Part (b): Beacon Installation Decision**  
  Vega chooses whether to install a beacon (cost = \(1/5\)) to raise transparency \(\tau_V\) from \(1/2\) to \(1\). The installation decision occurs at base transparency (\(\tau_V = \tau_A = 1/2\)), so the probability installations are linked is \(p_{\text{install}} = (1/2) \cdot (1/2) = 1/4\). If unlinked, Altair installs independently with probability \(1/2\).  

  This is a **coordination game** with three key outcomes:  
  1. **Both install**: \(\tau_V = \tau_A = 1\), so \(p = 1\). Vega cooperates (since \(p > 3/7\)), yielding PD payoff \(3\), minus cost \(1/5\), so net \(2.8\).  
  2. **Neither installs**: \(\tau_V = \tau_A = 1/2\), so \(p = 1/4\). Vega defects (since \(p < 3/7\)), yielding PD payoff \(2.5\).  
  3. **Unilateral installation** (Vega installs, Altair does not): \(\tau_V = 1\), \(\tau_A = 1/2\), so \(p = 1/2\). Vega cooperates (\(p > 3/7\)), yielding PD payoff \(2.25\), minus cost \(1/5\), so net \(2.05\).  
  - Crucially, unilateral installation leaves *both worse off* than mutual non-installation (\(2.05 < 2.5\)).  

  To determine Vega’s choice, compute expected payoffs, accounting for acausal correlation in installations:  
  - **Vega does not install** (net cost = 0):  
    - Linked (\(p_{\text{install}} = 1/4\)): Altair mirrors, so \(\tau_A = 1/2\), \(p = 1/4\), Vega defects, payoff = \(2.5\).  
    - Unlinked (\(3/4\)): Altair installs with prob \(1/2\), so:  
      - \(\tau_A = 1\) (prob \(1/2\)): \(p = (1/2)\cdot1 = 1/2\), Vega cooperates, payoff = \(2.25\).  
      - \(\tau_A = 1/2\) (prob \(1/2\)): \(p = (1/2)\cdot(1/2) = 1/4\), Vega defects, payoff = \(2.5\).  
    Expected PD payoff: \((1/4)(2.5) + (3/4)[(1/2)(2.25) + (1/2)(2.5)] = 2.40625\).  
  - **Vega installs** (net cost = \(1/5\)):  
    - Linked (\(1/4\)): Altair mirrors, so \(\tau_A = 1\), \(p = 1\), Vega cooperates, payoff = \(3 - 1/5 = 2.8\).  
    - Unlinked (\(3/4\)): Altair installs with prob \(1/2\), so:  
      - \(\tau_A = 1\) (prob \(1/2\)): \(p = 1 \cdot 1 = 1\), payoff = \(3 - 1/5 = 2.8\).  
      - \(\tau_A = 1/2\) (prob \(1/2\)): \(p = 1 \cdot (1/2) = 1/2\), payoff = \(2.25 - 1/5 = 2.05\).  
    Expected PD payoff: \((1/4)(2.8) + (3/4)[(1/2)(2.8) + (1/2)(2.05)] = 2.51875\).  

  Since \(2.51875 > 2.40625\), Vega **should install the beacon**. The verdict depends on the unlinked probability of Altair investing: if Altair’s independent installation probability were lower (e.g., \(< 0.4\)), non-installation could dominate, but here \(1/2\) supports installation.  

  **Part (c): Auditor and Legibility**  
  The Auditor interacts with Vega. If the Auditor cannot predict Vega’s action with accuracy \(> 4/5\), it cooperates (yielding mutual cooperation: Vega gets 3). If it predicts accurately (\(\geq 4/5\) accuracy), it demands tribute: if Vega pays (cooperates), Vega gets 2 and Auditor gets 5; if not, Auditor defects and Vega gets 0. Crucially:  
  - **Predictability**: Installing the beacon makes Vega’s *entire policy* (PD action and tribute response) transparent, so Auditor predicts with accuracy 1. Not installing implies opacity, so Auditor cannot predict (accuracy \(1/2 < 4/5\)).  
  - **Compliance**: If tribute is demanded, Vega always pays (as \(2 > 0\)), so being predictable does not imply compliance in the PD with Altair—it only affects tribute extraction.  

  **Payoff from Auditor interaction**:  
  - **No beacon (opaque)**: Auditor cooperates unconditionally. Vega defects (optimally), getting 5.  
  - **Beacon (transparent)**: Auditor demands tribute; Vega pays, getting 2.  

  **Total expected payoff for Vega** (PD with Altair + Auditor):  
  - **No beacon**: Altair PD payoff (from part b) = \(2.40625\) + Auditor payoff \(5 = 7.40625\).  
  - **Beacon**: Altair PD payoff (from part b) = \(2.51875\) + Auditor payoff \(2 = 4.51875\).  

  Since \(7.40625 > 4.51875\), Vega **should not install the beacon**. Legibility is self-defeating: transparency enables the Auditor’s extortion, outweighing acausal trade gains.  

  **Selective opacity**: The beacon is binary; Vega cannot be transparent to Altair but opaque to the Auditor. If selective opacity were possible, Vega could install the beacon, gain acausal trade benefits (\(2.51875\) from Altair), and avoid tribute (getting 5 from Auditor), for total \(7.51875\), making installation optimal. But the setup does not allow this.  

  **Population dependence**: If most counterparts are fair traders (like Altair), legibility helps, but with extortionists (like the Auditor), it harms. The expected value must weight counterparts by prevalence, but here the Auditor is fixed, so no reweighting is needed.  

  **Where this answer could be wrong**  
  The key premise is that the **beacon makes Vega’s policy transparent to the Auditor**. A strong student could reject this, arguing that transparency might be agent-relative (e.g., visible only to intended counterparts like Altair). If so, selective opacity becomes possible, and installing the beacon could yield \(7.51875\) (as above), reversing the verdict. The model’s confidence is high under the given specs, but this premise is contestable. In grading, a student justifying selective opacity and recalculating payoffs accordingly should receive full credit for part (c) if consistent.  

