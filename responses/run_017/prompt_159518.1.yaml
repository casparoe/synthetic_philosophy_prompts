prompt: |-
  I sit on the allocations committee of a small global-health funder that describes itself as "effective altruism adjacent," and over the last two grant cycles I've become convinced of the measurability critique: that the movement's prioritization is systematically distorted toward interventions whose effects can be stated as a cost per unit of outcome, and away from interventions and causes whose effects are diffuse, long-lagged, contested, or systemic — and that this is a distortion rather than merely a reflection of what we happen to know.

  In arguing with colleagues I've come to rely on two distinctions I don't think are standard, and I'd like them stress-tested alongside the critique itself. Call the first the conversion problem: measurement is not a passive readout of a cause's tractability but an intervention on its epistemic status, because the same resources that estimate an intervention's effect also make that intervention more estimable. So the pool of supposedly unmeasurable causes is not stable under investigation, and any test of the critique that works by going out and measuring an allegedly unmeasurable cause destroys the very thing it was meant to test. My colleagues reply with what I'll call the evidential symmetry argument: for an expected-value maximizer, ignorance about an intervention should widen the interval around its value, not lower the mean, so unmeasurability as such cannot demote a cause — and hence a genuine measurability bias has to be explained by something other than mere uncertainty.

  Tell me what would count against the critique. I want the defeaters ranked from fatal to merely awkward and sorted by what each would show: that the actual allocations are defensible, that the critique misdescribes the mechanism, or that the critique has been qualified into unfalsifiability. Please cover the following.

  - What defenders of cost-effectiveness-driven prioritization would themselves concede as counting against the critique, as opposed to what critics allege about them, and where such a concession should stop.
  - Whether the conversion problem protects the critique or indicts it, and whether the evidential symmetry argument really shifts the burden the way my colleagues assume. In particular, assess whether risk aversion over moral uncertainty, the option value of learning, selection effects in who is drawn to quantifiable work, institutional incentives to produce reportable numbers, or asymmetric priors can each independently do the work the critique needs — and say which of them the critique is actually committed to.
  - Which observable facts would discriminate. What allocation pattern, what kind of internal deliberation, what episode in the movement's funding history would be decisive rather than merely suggestive? I would personally weight a revealed-preference test most heavily: a documented case in which a quantifiable intervention was funded over an unquantifiable one that the same decision-makers privately judged better.
  - An honest verdict on how exposed the critique is, and on whether, if it does turn out to be insulated, that is a defect here — or whether insulation is simply the normal condition of a claim that functions as a standing suspicion about a research and funding culture rather than as a testable hypothesis about it.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated critique of EA-aligned funding prioritization centered on measurability bias, with two original distinctions (conversion problem and evidential symmetry argument). They want the critique stress-tested across multiple dimensions.

  First, I need to unpack the core argument: the claim that EA systematically favors quantifiable interventions due to epistemic distortion rather than inherent tractability. The user's added nuances are crucial - the conversion problem suggests measurement efforts alter the epistemic landscape, while evidential symmetry argues uncertainty shouldn't lower expected value.

  For defeaters, I'll categorize them by what they challenge:
  - Fatal defeaters would show allocations are actually defensible (e.g., proven causal superiority of quantifiable interventions)
  - Mechanism-focused defeaters would reveal flaws in the bias description (e.g., risk aversion explains outcomes better than epistemic distortion)
  - Qualification defeaters would make the critique unfalsifiable (e.g., moving goalposts about what counts as measurable)

  The conversion problem cuts both ways: it protects the critique by making counterevidence self-defeating, but potentially indicts it by implying the "unmeasurable" category is ephemeral. The evidential symmetry argument relies on strict Bayesianism - but behavioral factors like institutional incentives or asymmetric priors could break this symmetry in practice.

  For observable tests, revealed preference cases would be strongest: documented instances where funders privately preferred unquantifiable options but chose quantifiable due to reporting pressures. Movement history might show if quantifiable interventions consistently "won" funding debates against expert judgment.

  The critique's insulation is tricky. While testable in principle through comparative funding patterns, its core concern about systemic cultural bias might function more as a hermeneutic lens than a falsifiable hypothesis. This isn't necessarily a flaw - many critical theories operate this way - but requires honest acknowledgment.

  Throughout, I should maintain the user's nuanced framing while pushing where their assumptions might be brittle. The institutional incentives angle seems particularly fertile given their committee role.
answer: |-
  Here’s a stress-test of your measurability critique, structured by your requested categories. I’ll rank defeaters from fatal to awkward, clarify what each would demonstrate, and address your distinctions (conversion problem, evidential symmetry) and requested focal points.

  ---

  ### **Fatal Defeaters**  
  *(Would show allocations are defensible)*  
  1. **Consistent outperformance of measurable interventions**  
     - **What counts against**: If historically, quantifiable interventions (e.g., bed nets, deworming) *systematically* achieved higher real-world impact per dollar than systemic interventions (e.g., policy advocacy, feminist health programs) — even after adjusting for uncertainty — the prioritization is defensible.  
     - **Where concession stops**: If this pattern holds only in short-term/low-complexity contexts but fails in long-term/systemic ones (e.g., climate resilience).  
     - **Key evidence**: Rigorous ex-post evaluations comparing quantified vs. systemic grants (e.g., GiveWell’s malaria vs. policy grants).  

  2. **Counterfactual justification**  
     - **Defender’s concession**: If unquantifiable causes consistently attract funding *elsewhere* (e.g., government, large NGOs), EA’s niche in measurable gaps is optimal.  
     - **Fatal if**: Data shows systemic causes are *overfunded* relative to evidence-blindness, while measurable gaps remain neglected.  

  ---

  ### **Mechanism-Focused Defeaters**  
  *(Would show critique misdescribes the mechanism)*  
  3. **Risk aversion over moral uncertainty**  
     - **Assessment**: Evidential symmetry assumes perfect Bayesianism. But if funders are *morally risk-averse* (e.g., fearing harm from uncertain interventions), they rationally discount wide confidence intervals. **This can independently explain bias** without epistemic distortion.  
     - **Burden shift**: Evidential symmetry *does* shift burden to critics to prove asymmetric priors or risk aversion — but your critique is **committed to institutional/epistemic factors** as primary drivers.  

  4. **Institutional incentives dominate**  
     - **Assessment**: If funders prioritize "reportable numbers" to satisfy trustees/donors (not inherent tractability), the critique mistakes symptom for cause. **Incentives alone can explain bias** — no distortion in "true" prioritization needed.  
     - **Observable test**: Internal deliberations showing pressure to justify grants via metrics (e.g., "We can’t defend this to donors without DALYs").  

  5. **Selection effects in talent**  
     - **Assessment**: If quantifiable causes attract better talent (e.g., data-savvy researchers), funding follows competence — not measurement bias. **Concedes the outcome but not the mechanism**.  
     - **Key evidence**: Migration patterns of researchers from quantifiable to systemic causes when funded.  

  ---

  ### **Qualification Defeaters**  
  *(Would render critique unfalsifiable)*  
  6. **Conversion problem as self-insulating**  
     - **Protects or indicts?** It protects the critique from *direct* falsification (measuring "unmeasurable" interventions alters them) but **indicts its coherence**: If unmeasurability evaporates upon investigation, the category is illusory.  
     - **Resolution**: The critique must define "unmeasurable" as *resistant to standardized quantification* (e.g., narrative change) — not literally immutable.  

  7. **Asymmetric priors as unfalsifiable**  
     - **Problem**: If critics claim funders *assume* measurable interventions have higher expected value, any counterevidence can be dismissed as "not systemic enough."  
     - **Testability fix**: Require the critique to predict *specific* funding gaps (e.g., "EA will underfund feminist economics in health").  

  ---

  ### **Observable Discriminators**  
  *(Ranked by decisiveness)*  
  1. **Revealed preference test** (Strongest):  
     - **Decisive case**: Documented instances where:  
       - Decision-makers privately ranked an unquantifiable intervention higher.  
       - Quantifiable alternative was funded due to measurement demands (e.g., "We need a cost-per-DALY estimate").  
     - **Real-world example**: Open Philanthropy’s initial neglect of AI governance (hard to quantify) vs. global health (quantifiable), later corrected after internal critique.  

  2. **Deliberation patterns**:  
     - **Smoking gun**: Meeting notes showing dismissal of systemic causes with statements like "We can’t model it" *without engaging counterarguments*.  

  3. **Funding history**:  
     - **Decisive episode**: If a funder (e.g., EA Funds) redirected resources from measurable to systemic causes *without new evidence* and impact increased — but attributing causality is hard.  

  ---

  ### **Verdict: Exposure & Insulation**  
  - **How exposed?** Moderately. The critique can be tested via:  
    - **Revealed preferences** (as above).  
    - **Cross-funder comparisons**: Do less EA-aligned funders (e.g., Ford Foundation) outperform in systemic areas with similar resources?  
    - **Ex-post impact audits**: Compare quantified vs. systemic grants after 10 years.  
  - **Is insulation a defect?** Partly. The core claim — *"measurement infrastructure distorts prioritization"* — is testable. However, its broader framing as a "suspicion about culture" is inherently less falsifiable. This isn’t fatal if:  
    - It generates specific predictions (e.g., "EA will underfund X-type causes").  
    - It avoids moving goalposts (e.g., redefining "systemic" post-hoc).  

  **Conclusion**: Your critique’s strongest support is **institutional incentives** and **risk aversion**, not evidential symmetry violations. The fatal defater (measurable interventions consistently winning) is the hardest hurdle. Prioritize gathering revealed-preference evidence from your committee’s deliberations — this could resolve the debate locally even if the broader critique remains contested.  

  ---  
  **Recommendation**: Track cases where interventions are downgraded *solely* for lack of metrics (despite high expert credence). If >20% of "high-potential" systemic proposals suffer this fate, your critique gains decisive ground.
