prompt: |-
  I am a staff engineer at a studio that operates a persistent online world with roughly two million monthly players, and I own the service that triages player-harm reports: everything a player submits as "someone took something from me" or "someone ruined this for me" flows through it, and it decides whether a report is closed automatically, sent to a human reviewer, or escalated to a council that includes elected player representatives. My current task is the reviewer runbook, which is in effect our operational answer to a question I am not trained to answer: which losses inside our world are real losses, and which are only losses in a game.

  The constraints. Reviewers are contractors with about three minutes per ticket and no background in any of this. They can see server-side facts — logs, inventories, patch history, who was present and when — and the player's own written statement; they cannot verify anything about the player's life, health, or mental state. Every decision needs a code from a fixed menu plus two sentences of justification, and a sample is re-reviewed each quarter, so the runbook has to make similar cases come out the same way and has to be defensible to people who will ask why one player's loss was reversed and another's was not. Restoration itself comes in three technical flavours, which I suspect matters more than it appears to: we can roll back to a prior state, we can recreate an object from a template, or we can do nothing because the loss is not representable in our data model at all. I also want restoration and sanction kept as separate outputs — I can accept that a real loss occurred and still think the right response is not to reverse it.

  I do not want an explanation of the underlying metaphysics, and I do not want citations or a reading list. I need a procedure. Please write me the decision procedure my reviewers should run, in order, where for each step you give the question, what counts as a sufficient answer given the evidence a reviewer actually has, and the exit condition: close as not a harm, restore, sanction the other player, or hand to a human because this is a question of values rather than of fact. Name the points where the procedure must stop and say that it is stopping, rather than forcing an answer. And tell me which steps are doing real work and which are only there to make the output auditable.

  The cases the runbook has to handle — please make sure each lands somewhere definite, or is explicitly refused:

  1. A full-loot server where taking another player's entire inventory is a stated rule; the taker followed the rule, and the loser opted into the server knowing it.
  2. An item we can restore perfectly, bit for bit, by duplicating it; the player insists that what came back is not the thing that was taken.
  3. A rival who deliberately crashed the instance during a progress attempt, so that a guild's completion was never recorded and the recognition for it went to someone else. Nothing was destroyed; an irreversible opportunity was.
  4. A memorial that players built for a dead friend, demolished by the player who lawfully bought the land and did not know what it was; the players who built it have not logged in since and may never see the demolition.
  5. A silent model update to a companion NPC that a player had interacted with daily for two years: nothing deleted, no rule broken, and the player reports the loss of a relationship.
  6. A character deleted near the end of a final season, where re-earning everything is possible in principle but not in the circumstances the player is now in.
  7. An item whose value came almost entirely from a real-money market on another platform that our own terms prohibit.

  Then run the finished procedure on three of these, chosen by you, including at least one where the answer is one my team will not want to hear. My guess is the NPC update, since honouring it would mean versioning and pinning persona state indefinitely, but pick whichever case actually puts the most pressure on the procedure.

  Three further things, marked explicitly. First, where the procedure must accept a player's own account of their experience as sufficient even though nothing server-side corroborates it, and where it must not. Second, where my engineering instincts are likely to be leading me astray: I keep reasoning that a rollback is idempotent and therefore undoes the harm, and I keep reasoning that if we can copy an object then nothing scarce was taken, and I am not confident about either. Third, the question the procedure is not allowed to beg: whether the fact that we can switch the world off, and some day will, is supposed to change what we owe in cases 1 through 7. I would rather have that stated as an open decision with the two options laid out than quietly assumed in one direction.
reasoning: |-
  We are designing a decision procedure for player-harm reports. The procedure must be executable by contractors with limited time and no special background. They have access to server-side facts and the player's statement, but not real-world context. The output is one of: close (not a harm), restore (in one of three ways), sanction, or escalate to human review (for value judgments). Restoration and sanction are separate decisions.

  The procedure must be step-by-step, with clear questions, evidence requirements, exit conditions, and indications of where it stops for human review. We must also note which steps are substantive and which are for auditability.

  Key principles:
  - We must not require reviewers to assess real-world impact (health, mental state, etc.).
  - We must rely on server-side evidence where possible, but accept player statements in specific, defined circumstances.
  - We must be consistent and defensible.

  Let's outline the procedure:

  ### Decision Procedure for Player-Harm Reports

  **Step 1: Verify Report Basis**
  - **Question:** Does the report describe an event that occurred within the game world and is supported by server logs?
  - **Evidence:** Server logs must show the event (e.g., item transfer, destruction, instance crash) at the time and place described. The player's statement must be consistent with the logs.
  - **Sufficient Answer:** If the logs do not show the event, or if the event is not within the game world (e.g., real-world theft), then close the report. If the logs show the event, proceed to Step 2.
  - **Exit Condition:** 
    - Close: if no event in logs or event not in game.
    - Proceed: if event is logged and in-game.
  - **Note:** This step is substantive. We are filtering out reports that are factually incorrect or outside our scope.

  **Step 2: Check Rules and Consent**
  - **Question:** Was the event the result of an in-game mechanic or rule that the player explicitly consented to?
  - **Evidence:** Server settings (e.g., full-loot server), terms of service, and the player's account history (e.g., server transfer logs showing they opted in).
  - **Sufficient Answer:** 
    - If the event is a direct result of a rule the player consented to (e.g., full-loot PvP, land demolition after sale) and there is no evidence of rule violation by the other party, then close the report. 
    - If the event is not covered by such rules, or if there is evidence of rule violation, proceed to Step 3.
  - **Exit Condition:**
    - Close: if the event was within the rules and the player consented to those rules.
    - Proceed: otherwise.
  - **Note:** Substantive. This handles cases like #1 (full-loot server).

  **Step 3: Determine Reversibility**
  - **Question:** Can the loss be reversed by one of the three restoration methods (rollback, recreate, or nothing) without causing new harm to others?
  - **Evidence:** Server data model, logs of the state before the event, and templates for recreation. Consider:
    - Rollback: Is there a recent snapshot? Would it affect other players?
    - Recreate: Is the item template available and can it be duplicated without affecting scarcity?
    - Nothing: If the loss is of an opportunity, relationship, or something not represented in the data model.
  - **Sufficient Answer:** 
    - If rollback is feasible and does not harm others (e.g., not a shared state), mark as reversible by rollback and proceed to Step 4.
    - If recreation is feasible (template exists, duplication doesn't break game economy), mark as reversible by recreation and proceed to Step 4.
    - If neither is feasible (e.g., opportunity loss, relationship change), mark as irreversible and proceed to Step 5.
  - **Exit Condition:** Proceed to Step 4 for reversible cases, Step 5 for irreversible. Do not decide restoration yet.
  - **Note:** Substantive. This step is about technical feasibility, not whether we should restore.

  **Step 4: Assess Harm Type (for reversible cases)**
  - **Question:** Is the harm primarily about the loss of a unique, irreplaceable item/state, or is it about the violation of rules/consent?
  - **Evidence:** Player's statement (what they emphasize) and the nature of the item/state (e.g., unique identifier, sentimental value).
  - **Sufficient Answer:**
    - If the player emphasizes uniqueness (e.g., "this specific sword I earned in event X") and the item has unique properties (e.g., bound, non-copyable), then this is a unique loss. Proceed to Step 6.
    - If the player emphasizes the violation (e.g., "they stole it against the rules") or the item is fungible (common, replaceable), then this is a rule violation. Proceed to Step 7.
  - **Exit Condition:** Proceed to Step 6 or 7.
  - **Note:** Substantive. This helps decide whether restoration is appropriate or if sanction is the primary response.

  **Step 5: Assess Harm Type (for irreversible cases)**
  - **Question:** Is the reported harm about a loss that is not representable in the data model (e.g., opportunity, relationship, effort) and was it caused by another player's actions?
  - **Evidence:** Player's statement and logs showing the other player's actions.
  - **Sufficient Answer:**
    - If the loss is not representable and was caused by another player, and that player broke a rule, then proceed to Step 7 (sanction).
    - If the loss is not representable and not caused by another player (e.g., system update), then proceed to Step 6.
    - If the loss is not caused by another player but by system changes, then we must consider if it violates any promise (proceed to Step 8).
  - **Exit Condition:**
    - If caused by another player and rule broken: proceed to Step 7.
    - If caused by system or no rule broken: proceed to Step 6 or Step 8.
  - **Note:** Substantive. For irreversible losses, we focus on whether a rule was broken and if the harm is within our responsibility.

  **Step 6: Evaluate Player's Subjective Experience (for unique or irreversible losses)**
  - **Question:** Does the player's statement describe a loss that we recognize as valid within the game's social contract, even if it is not a rule violation?
  - **Evidence:** Player's statement only (we cannot verify real-world impact). We look for descriptions of unique effort, emotional attachment, or community-recognized value.
  - **Sufficient Answer:**
    - If the loss involves a unique effort (e.g., months of work for a one-time event) or a community memorial (with evidence of community recognition in logs, e.g., many visitors), then we accept the player's account as sufficient and escalate for human review (because this is a value judgment).
    - If the loss is purely subjective (e.g., relationship with an NPC changed) without community recognition, then close the report (as not a harm we can act on).
  - **Exit Condition:**
    - Escalate: for losses with unique effort or community-recognized value.
    - Close: for purely subjective losses without community evidence.
  - **Note:** This step is where we accept the player's account without server-side corroboration for the emotional aspect, but we require some in-game evidence (like community activity) to support the uniqueness. This step is substantive and may lead to escalation.

  **Step 7: Rule Violation Check**
  - **Question:** Did the other player break a stated rule?
  - **Evidence:** Server logs showing actions that violate published rules (e.g., crashing an instance is against ToS).
  - **Sufficient Answer:**
    - If yes, then sanction the other player and proceed to Step 9 for restoration consideration.
    - If no, then close the report (unless Step 5 led here for irreversible harm without rule violation, then close).
  - **Exit Condition:** Sanction if rule broken, then proceed to Step 9. Otherwise, close.
  - **Note:** Substantive.

  **Step 8: System Responsibility Check**
  - **Question:** Was the loss caused by a system change or update that violated a promise made to players?
  - **Evidence:** Patch notes, previous communications, and server logs. Did the system change break a documented feature or promise?
  - **Sufficient Answer:**
    - If the change broke a promise (e.g., "we will never remove this item"), then escalate for human review (because this is a policy issue).
    - If no promise was broken, then close the report.
  - **Exit Condition:** Escalate if promise broken; close otherwise.
  - **Note:** For cases like the NPC update (#5). Substantive.

  **Step 9: Restoration Decision (post-sanction)**
  - **Question:** Given that a rule violation occurred and we are sanctioning the offender, should we also restore the victim?
  - **Evidence:** Reversibility from Step 3 and the type of harm.
  - **Sufficient Answer:**
    - If reversible and restoration does not harm others, then restore (using the method from Step 3).
    - If irreversible, then do not restore (but we have sanctioned).
  - **Exit Condition:** Restore or not. Then close.
  - **Note:** This step is for restoration only when a rule violation occurred. It is substantive.

  **Step 10: Final Escalation Check**
  - **Question:** Are we at a step that requires human judgment (as indicated by previous steps) or is there a conflict in the evidence?
  - **Evidence:** Previous steps that led to escalation.
  - **Sufficient Answer:** If any step flagged for escalation (e.g., Step 6 or 8), then escalate. Otherwise, the case is closed or acted upon (restore/sanction).
  - **Exit Condition:** Escalate if flagged; otherwise, output the decision (close, restore, sanction, or a combination).
  - **Note:** This is an aggregation step for audit.

  ### Where the procedure accepts the player's account:
  - In Step 6, we accept the player's description of unique effort or emotional attachment, but only if there is supporting in-game evidence (e.g., community activity for a memorial) or it is about a unique item/achievement. We do not accept purely subjective experiences without any in-game manifestation.

  ### Where engineering instincts may lead astray:
  - **Rollback is idempotent:** Not always. A rollback may undo other legitimate actions. Also, the player may have moved on, so restoring an item weeks later might not undo the harm of missing it during a critical period.
  - **Copying an object means nothing scarce was taken:** Not if the item had unique history (e.g., "this sword was used by me in the first tournament"). A copy might not restore the sentimental value.

  ### The unasked question (world shutdown):
  - We must not assume that because the world will eventually end, losses are less real. The procedure should treat the current state as persistent. However, if a loss occurs near the end of a final season (case #6), we have an irreversible opportunity. We handle it in Step 5 (irreversible) and Step 6 (unique effort). We do not treat the eventual shutdown as a factor unless the company has a stated policy (e.g., no restoration in the last month). That would be a rule in Step 2.

  Now, let's run the procedure on three cases:

  ### Case 1: Full-loot server
  - Step 1: Event occurred (logs show inventory taken).
  - Step 2: Player opted into full-loot server (server setting and transfer logs). Taker followed rules. → Close.
  - **Decision:** Close. Not a harm.

