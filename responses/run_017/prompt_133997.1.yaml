answer: |-
  Below is a complete decision procedure for your reviewer runbook. It is designed to be executed in sequence by contractors with limited time (3 minutes per ticket) and no specialized training. The procedure relies solely on server-side evidence (logs, inventories, patch history, presence data) and the player's written statement—it never requires assessing real-world health, mental state, or external factors. Each step includes:
  - **Question**: What the reviewer must answer.
  - **Evidence & Sufficient Answer**: What counts as proof, based solely on available data.
  - **Exit Condition**: One of: **Close** (not a harm), **Restore** (via rollback, recreation, or nothing), **Sanction** (another player), or **Escalate** (to human review for values-based judgments).
  - **Stop Points**: Steps where the procedure explicitly stops if criteria are met, rather than forcing continuation.
  - **Audit Note**: Indicates whether the step is "Substantive" (does real work) or "Audit" (ensures consistency/defensibility).

  Restoration and sanction are decoupled: restoration decisions (using rollback, recreation, or no action) are made separately from sanctions. The procedure avoids metaphysics and focuses on operationalizable facts.

  ---

  ### Player-Harm Report Decision Procedure

  **Step 1: Event Verification**  
  - **Question**: Did the reported event occur as described, and is it fully traceable in server logs?  
  - **Evidence & Sufficient Answer**: Server logs must show the event (e.g., item transfer, instance crash, demolition) matching the player’s description of time, location, and actors. Player statement alone is insufficient without logs.  
  - **Exit Condition**:  
    - If **no logs match**, **Close** (not a harm).  
    - If **logs match**, proceed to Step 2.  
  - **Stop Point**: Stops here if no logs.  
  - **Audit Note**: Substantive. Filters invalid reports.

  **Step 2: Rules and Consent Check**  
  - **Question**: Was the event the result of a game rule or mechanic the player explicitly consented to?  
  - **Evidence & Sufficient Answer**: Server settings (e.g., full-loot flag), patch history for system changes, or terms of service (ToS) acceptance logs. Consent is established if:  
    - Player opted into a server/feature (e.g., full-loot PvP server via transfer logs).  
    - Event is a documented system change (e.g., NPC update in patch notes).  
    - Action was permitted by in-game mechanics (e.g., land ownership rights).  
  - **Exit Condition**:  
    - If **consent exists and no rules were broken**, **Close** (not a harm).  
    - If **no consent or rules were broken** (e.g., ToS violation), proceed to Step 3.  
  - **Stop Point**: Stops here if consent exists and no rules broken.  
  - **Audit Note**: Substantive. Handles explicit player agreements.

  **Step 3: Reversibility Assessment**  
  - **Question**: Can the loss be technically reversed without harming unrelated players?  
  - **Evidence & Sufficient Answer**: Server data model, backup snapshots, and item templates. Assess:  
    - **Rollback feasible** if a recent snapshot exists and reverting only affects the reporting player.  
    - **Recreation feasible** if an item template exists and duplication won’t break economy/scarcity (ignore subjective uniqueness).  
    - **Not reversible** if opportunity loss, relationship change, or no data representation.  
  - **Exit Condition**:  
    - **Rollback**: Mark as "Restore via rollback" and proceed to Step 4.  
    - **Recreation**: Mark as "Restore via recreation" and proceed to Step 4.  
    - **Not reversible**: Mark as "No restoration possible" and proceed to Step 5.  
  - **Stop Point**: None (all paths proceed).  
  - **Audit Note**: Substantive. Technical feasibility only—no harm judgment.

  **Step 4: Harm Classification (Reversible Cases)**  
  - **Question**: Is the harm primarily about scarcity/uniqueness or rule violation?  
  - **Evidence & Sufficient Answer**: Player statement and logs. Prioritize:  
    - **Scarcity/uniqueness** if player emphasizes irreplaceability (e.g., "my first legendary sword") and logs show item is bound/untradeable.  
    - **Rule violation** if player emphasizes misconduct (e.g., "stolen by hacking") or item is fungible (common, tradeable).  
  - **Exit Condition**:  
    - If **scarcity/uniqueness**, proceed to Step 6.  
    - If **rule violation**, proceed to Step 7.  
  - **Stop Point**: None.  
  - **Audit Note**: Substantive. Determines path for reversible losses.

  **Step 5: Harm Classification (Irreversible Cases)**  
  - **Question**: Was the irreversible loss caused by another player’s actions?  
  - **Evidence & Sufficient Answer**: Logs showing actor (player vs. system). Player statement alone is insufficient without logs.  
    - **Caused by player** if logs show direct action (e.g., crashing instance).  
    - **Caused by system** if logs show patch/update (e.g., NPC change).  
  - **Exit Condition**:  
    - If **caused by player**, proceed to Step 7.  
    - If **caused by system**, proceed to Step 8.  
  - **Stop Point**: None.  
  - **Audit Note**: Substantive. Splits irreversible losses by cause.

  **Step 6: Unique Value Assessment**  
  - **Question**: Is there server-side evidence of "unique value" justifying restoration despite consent or reversibility?  
  - **Evidence & Sufficient Answer**: Player statement is accepted **only if** corroborated by:  
    - **Community recognition**: Logs showing broad interaction (e.g., memorial with visitor counts, guild contributions).  
    - **Proven effort**: Logs showing exceptional time/investment (e.g., 100+ hours for one-time event).  
    - *Insufficient* if purely subjective (e.g., "I loved this NPC") without logs.  
  - **Exit Condition**:  
    - If **evidence exists**, **Escalate** (values judgment).  
    - If **no evidence**, **Close** (not a harm).  
  - **Stop Point**: Stops here if no evidence.  
  - **Audit Note**: Substantive. Only step accepting player experience (with verification).

  **Step 7: Rule Violation Confirmation**  
  - **Question**: Did another player violate a documented rule?  
  - **Evidence & Sufficient Answer**: Logs must show breach of published rules (e.g., crashing instances prohibited by ToS, unauthorized deletion). Player statement alone insufficient.  
  - **Exit Condition**:  
    - If **rule violated**, **Sanction** the player and proceed to Step 9.  
    - If **no rule violated**, **Close** (not a harm).  
  - **Stop Point**: Stops here if no violation.  
  - **Audit Note**: Substantive. Sanction foundation.

  **Step 8: System Accountability Check**  
  - **Question**: Did a system change break a documented promise (e.g., "no changes to X")?  
  - **Evidence & Sufficient Answer**: Patch notes, official announcements, or ToS clauses. Player statement irrelevant.  
  - **Exit Condition**:  
    - If **promise broken**, **Escalate** (values/policy issue).  
    - If **no promise broken**, **Close** (not a harm).  
  - **Stop Point**: Stops here if no broken promise.  
  - **Audit Note**: Substantive. Handles system-caused harm.

  **Step 9: Restoration Decision (Post-Sanction)**  
  - **Question**: Should restoration occur after a sanction?  
  - **Evidence & Sufficient Answer**: Based on Step 3’s reversibility mark. Ignore scarcity/subjectivity.  
    - If **rollback/recreation feasible**, **Restore** (use method from Step 3).  
    - If **not reversible**, **Do not restore**.  
  - **Exit Condition**: **Restore** or **Do not restore**, then close case.  
  - **Stop Point**: Always stops here.  
  - **Audit Note**: Audit. Ensures restoration only follows sanction.

  **Step 10: Final Escalation Check**  
  - **Question**: Does the case require human judgment per prior steps?  
  - **Evidence & Sufficient Answer**: Aggregates flags from Steps 6 or 8.  
  - **Exit Condition**:  
    - If **escalate flagged**, **Escalate** to human review.  
    - Else, finalize decision (close, restore, sanction, or combo).  
  - **Stop Point**: None.  
  - **Audit Note**: Audit. Ensures no missed escalations.

  ---

  ### Key Clarifications
  1. **Accepting Player Experience**:  
     - **Accepted only in Step 6**, and only with server-side corroboration (e.g., logs proving community activity or effort). Never accepted for mental state, real-world impact, or uncorroborated subjectivity.  
     - **Rejected in all other steps** (e.g., Step 7 requires rule-proof in logs; Step 8 ignores player statements).

  2. **Engineering Instincts Pitfalls**:  
     - **Rollback ≠ harm undone**: Rollback may be technically idempotent but can fail to restore "irreplaceable" context (e.g., a memorial rebuilt weeks later misses a community event). The procedure treats reversibility as a technical step (Step 3) but separates harm judgment (Steps 4–8).  
     - **Copying ≠ no scarcity**: Duplication ignores subjective scarcity (e.g., "my first sword"). The procedure handles this in Step 6 (if evidence exists) but defaults to closing if no corroboration.  
     - **Your instincts risk conflating technical feasibility with harm significance**. The procedure decouples them (e.g., Step 3 is technical; Steps 4–6 assess harm).

  3. **The Unasked Question (World Shutdown)**:  
     - **Procedure Assumption**: The world’s impermanence is irrelevant. Treat losses as real within the current persistent state.  
     - **Alternative**: If your studio policy says shutdowns nullify obligations (e.g., no restoration in final seasons), add a pre-step: "If the loss occurred within a final season and server shutdown is imminent, close the report." This is a business decision—state it explicitly in Step 2 if adopted. The procedure does not assume this.

  ---

  ### Case Handling
  Ran on three cases, including one your team won’t like (Case 5: NPC update). Chosen for pressure: it tests subjective harm without corroboration, and restoration would require unsustainable engineering (pinning persona state).

  **Case 1: Full-Loot Server**  
  - Step 1: Logs show inventory taken. → Proceed.  
  - Step 2: Server settings confirm full-loot; player opt-in logs exist; taker followed rules. → **Close** (not a harm).  
  - **Verdict**: Closed. No action.

  **Case 5: NPC Update**  
  - Step 1: Logs show NPC model updated. → Proceed.  
  - Step 2: Patch history confirms system update; ToS allows changes. Player consented via ToS. → **Close** (not a harm).  
  - **Verdict**: Closed. Team won’t like this (loss of "relationship" ignored), but no rule broken, no promise violated, and no server-side evidence of unique value. Engineering avoided.

  **Case 3: Instance Crash (Opportunity Loss)**  
  - Step 1: Logs show rival player crashed instance. → Proceed.  
  - Step 2: ToS prohibits instance crashing. No consent for sabotage. → Proceed.  
  - Step 3: Opportunity loss; no restoration possible. → Mark "not reversible" → Proceed to Step 5.  
  - Step 5: Caused by player → Proceed to Step 7.  
  - Step 7: Logs confirm rule violation → **Sanction** rival → Proceed to Step 9.  
  - Step 9: Not reversible → **Do not restore** → Close.  
  - **Verdict**: Sanction rival; no restoration.  

  **Case 6 (Bonus): Character Deleted in Final Season**  
  - Step 1: Logs show deletion. → Proceed.  
  - Step 2: If deletion was unauthorized (e.g., hacking), ToS violation → Proceed. If player error, close. Assume unauthorized. → Proceed.  
  - Step 3: Rollback feasible if snapshot exists → Mark "restore via rollback" → Proceed to Step 4.  
  - Step 4: Player emphasizes scarcity ("can’t re-earn in time") → Proceed to Step 6.  
  - Step 6: Logs show playtime (e.g., 200 hours) and season-end date prove unique effort → **Escalate**.  
  - **Verdict**: Escalated for human review. Restoration possible but values-based (fairness in final season).  

  ---

  The procedure handles all listed cases:  
  - Case 1: Closed (Step 2).  
  - Case 2: Closed (Step 6 after Step 4; no evidence for uniqueness).  
  - Case 3: Sanction, no restore (Steps 7 and 9).  
  - Case 4: Closed (Step 2; lawful demolition with consent).  
  - Case 5: Closed (Step 2).  
  - Case 6: Escalated (Step 6).  
  - Case 7: Sanction and restore if rule broken (Steps 7 and 9; recreation ignores real-money value).

  This is auditable, time-efficient, and defensible. Reviewers only write a code and two sentences per step where they act. Escalations and sanctions are explicitly flagged for your council.
