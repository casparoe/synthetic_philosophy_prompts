  - Step 4: Harm type - player emphasizes uniqueness ("not the same"). So unique loss. → Step 6.
  - Step 6: Player's statement about uniqueness. But server logs show the item is identical. No community recognition of uniqueness beyond the item's existence. → Close (as not a harm we can act on, because we cannot restore sentimental value and there's no rule violation).
