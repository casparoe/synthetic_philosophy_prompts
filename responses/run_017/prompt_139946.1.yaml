answer: |-
  Below is a decision procedure for evaluating "explanatory adequacy" in proposals, based on Dennett's cranes vs. skyhooks and greedy reductionism, operationalized using your concepts of "ghost crane" and "handoff debt." The procedure is designed as an ordered set of gates (questions applied sequentially). If a proposal fails any gate, evaluation stops with a specific verdict. If it passes all gates, it may still require panel review for values-based judgments. Gates are optimized for speed (20 minutes/proposal) and defensibility, using only the proposal text.

  ### Decision Procedure: Explanatory Adequacy Assessment
  **Verdict Options (Fixed Dropdown List):**
  - **PASS:** Explanatory adequacy satisfied.
  - **PASS_WITH_PANEL_REVIEW:** Passes explanatory gates but requires panel input on risk/values.
  - **FAIL_SKYHOOK:** Unexplained leap or circularity (skyhook detected).
  - **FAIL_GHOST_CRANE:** Mechanism re-describes the phenomenon without explaining it.
  - **FAIL_HIDDEN_DEBT:** Greedy reductionism—handoff debt is hidden, not declared.
  - **FAIL_LOOKAHEAD:** Mechanism requires foreknowledge of the end state.
  - **FAIL_PREDICTIVE:** No novel predictions from the lower-level story.
  - **NO_VERDICT:** Proposal does not claim to explain emergence (e.g., purely descriptive).

  **Procedure Rules:**
  - Gates are applied in order. Stop at first failure or handoff.
  - "Handoff to panel" occurs only for values/risk judgments (e.g., risk appetite, feasibility of declared debt). Factual gaps (e.g., missing steps) result in failure.
  - **Ghost crane test:** If a mechanism's part can be substituted with the phenomenon term (e.g., "meaning" → "hypothesis space") without changing the description, it fails (re-description without explanation).
  - **Handoff debt:** Must be either (a) explained, or (b) declared with a plan (who/how it will be addressed). Hidden debt (unacknowledged gap) fails.
  - **Look-ahead test:** Integrated into Gate 4. If the mechanism requires the end state (e.g., cooperation) to be pre-specified to function, it fails.
  - **Unplugging test (removed):** Not included—too subjective for text review. Its core concerns (robustness vs. brittleness) are covered by ghost crane and handoff debt tests.
  - **Predictive power test:** Gate 5 requires novel, testable predictions from the lower level. If the lower level predicts nothing new, reduction is unjustified.
  - **Output:** One verdict + the "appeal objection" (the specific reason for failure to cite if a PI complains).

  ---

  ### Gates (Ordered)

  **Gate 1: Explanation Claim**  
  *(Filters non-explanatory proposals; ensures target is emergence of mind/society from "nothing")*  
  - **(a) Question:** Does the proposal explicitly claim to explain how cognition, cooperation, or culture emerges from a state without it?  
  - **(b) Pass:** Yes, and the phenomenon (e.g., "origin of life," "decline in violence") is clearly stated. → Proceed to Gate 2.  
  - **(c) Fail:** No claim to explain emergence. → Verdict: **NO_VERDICT**.  
  - **(d) Handoff:** Not applicable.  
  - **Appeal objection if failed:** "Proposal does not claim to explain the emergence of cognition, cooperation, or culture from a state without it."

  **Gate 2: Mechanism Description**  
  *(Ensures a step-by-step crane exists, no skyhooks)*  
  - **(a) Question:** Does the proposal describe a multi-step mechanism (crane) linking lower-level processes (e.g., physics, biology) to higher-level phenomena? Avoids single-step leaps.  
  - **(b) Pass:** Yes, with at least two distinct steps/levels (e.g., "neuromodulator → behavior → societal change"). → Proceed to Gate 3.  
  - **(c) Fail:** No mechanism described, or it is a single leap (e.g., "coherence maximization causes cooperation"). → Verdict: **FAIL_SKYHOOK**.  
  - **(d) Handoff:** Not applicable (skyhooks are factual gaps).  
  - **Appeal objection if failed:** "Proposed mechanism is not step-by-step; it relies on an unexplained leap (skyhook)."

  **Gate 3: Ghost Crane Check**  
  *(Prevents re-description without explanation; uses your test)*  
  - **(a) Question:** For each part of the mechanism, does the proposal avoid simply re-naming the phenomenon at a lower level? Apply ghost crane test: If substituting the phenomenon term (e.g., "cooperation") into a part's description (e.g., "molecular resonance") changes nothing, it fails.  
  - **(b) Pass:** All parts are described in simpler, pre-existing terms (e.g., "dopamine levels" not "violence molecule"). → Proceed to Gate 4.  
  - **(c) Fail:** At least one part is a ghost crane (e.g., "hypothesis space" for "meaning"). → Verdict: **FAIL_GHOST_CRANE**.  
  - **(d) Handoff:** Not applicable (ghost cranes are factual errors).  
  - **Appeal objection if failed:** "Mechanism part [specify part] re-describes the phenomenon without explaining it (ghost crane)."

  **Gate 4: Handoff Debt & Look-Ahead**  
  *(Checks for greedy reductionism; combines handoff debt and look-ahead test)*  
  - **(a) Question:** For each transition between levels (e.g., physics → biology, biology → society), does the proposal either (i) explain how lower-level parts create higher-level behavior, or (ii) declare handoff debt with a specific plan to address it? Also, does the mechanism avoid requiring foreknowledge of the end state?  
  - **(b) Pass:**  
    - Handoffs are explained or declared with a plan (e.g., "We will model how X behavior emerges from Y neurons").  
    - No foreknowledge required (e.g., mechanism works without pre-specifying "cooperation").  
    → Proceed to Gate 5.  
    - *If debt is declared but the plan is high-risk (e.g., "future AI will solve this"), flag for panel.*  
  - **(c) Fail:**  
    - Hidden handoff debt (e.g., jumps from "neuromodulator" to "society" without explanation/declaration).  
    - Mechanism requires end-state foreknowledge (e.g., "maximize coherence" where "coherence" is defined as the phenomenon).  
    → Verdict: **FAIL_HIDDEN_DEBT** or **FAIL_LOOKAHEAD** (use whichever fits).  
  - **(d) Handoff:** If handoff debt is declared and the plan is feasible but high-risk (e.g., "this requires untested tech"), pass but flag for panel review later.  
  - **Appeal objection if failed:**  
    - Hidden debt: "Proposal jumps levels without explaining or declaring handoff debt for [specify transition]."  
    - Look-ahead: "Mechanism requires the end state ([specify phenomenon]) to be pre-specified, making it circular."

  **Gate 5: Predictive Power**  
  *(Ensures reduction adds value; lower level predicts new things)*  
  - **(a) Question:** Does the lower-level story generate novel, testable predictions not made by higher-level theories?  
  - **(b) Pass:** Yes, with specific predictions and tests (e.g., "thermodynamic efficiency signature" for a physics-based theory of cooperation). → Proceed to verdict.  
    - *If predictions are high-risk (e.g., "measure 1000-year-old neurotransmitters"), flag for panel.*  
  - **(c) Fail:** No novel predictions (e.g., only re-explains known phenomena). → Verdict: **FAIL_PREDICTIVE**.  
  - **(d) Handoff:** If predictions are valid but the panel might dispute their importance (e.g., "fund techniques over answers"), pass but flag for panel review.  
  - **Appeal objection if failed:** "Lower-level mechanism does not produce novel, testable predictions beyond existing higher-level explanations."

  **Final Verdict:**  
  - If all gates passed and no flags: **PASS**.  
  - If all gates passed but flags exist (e.g., risky handoff debt or predictions): **PASS_WITH_PANEL_REVIEW**.  
  - **Appeal objection for PASS/PASS_WITH_PANEL_REVIEW:** "Explanatory adequacy satisfied per procedure."  

  ---

  ### Evaluation of Example Proposals
  **Proposal 1: Physicist's "coherence maximization" for origin of life and cooperation.**  
  - **Gate 1:** Pass. Claims to explain emergence of life/cooperation.  
  - **Gate 2:** Fail. Mechanism is a single variational principle ("coherence maximization governs open systems"), not a step-by-step crane. Described as a universal law, not a process.  
  - **Verdict:** **FAIL_SKYHOOK**.  
  - **Appeal objection:** "Proposed mechanism is not step-by-step; it relies on an unexplained leap (skyhook) from physics to life/cooperation."  
  - **Why?** This is a classic skyhook: a top-down principle "explaining" emergence without intermediate steps. The experimental signature (thermodynamic efficiency) doesn't resolve the leap.

  **Proposal 2: Neuromodulator explanation for social trend (e.g., fertility transition).**  
  - **Gate 1:** Pass. Claims to explain emergence of a social trend (fertility decline).  
  - **Gate 2:** Pass. Mechanism has steps: e.g., "neuromodulator levels → individual behavior → population trend."  
  - **Gate 3:** Pass. Neuromodulator (e.g., dopamine) is described biologically, not as "fertility decline in a molecule."  
  - **Gate 4:** Fail. Handoff debt from biology (neuromodulator) to society (trend) is hidden. Proposal measures "proxies in a modern population" but doesn't explain how individual changes scale to societal trends or declare this as debt. Also, no look-ahead issue.  
  - **Verdict:** **FAIL_HIDDEN_DEBT**.  
  - **Appeal objection:** "Proposal jumps levels without explaining or declaring handoff debt for how individual neuromodulator changes create a societal trend."  
  - **Why?** Greedy reductionism: jumps to biology without addressing sociology. Measuring proxies doesn't resolve the aggregation problem.

  **Proposal 3: Your lab's Bayesian word learning model.**  
  - **Gate 1:** Pass. Claims to explain emergence of word learning (cognition).  
  - **Gate 2:** Pass. Mechanism is step-by-step: "data (words) → Bayesian inference → meaning selection."  
  - **Gate 3:** Fail. Hypothesis space is a ghost crane. Substituting "meaning" for "candidate meanings in hypothesis space" changes nothing—it presupposes the child already understands meanings. No explanation of how the space itself emerges (e.g., from sensory input).  
  - **Verdict:** **FAIL_GHOST_CRANE**.  
  - **Appeal objection:** "Mechanism part 'hypothesis space' re-describes the phenomenon (meaning) without explaining it (ghost crane)."  
  - **To pass:** Redesign to avoid ghost crane. For example:  
    - **Current:** Hypothesis space = predefined set of meanings (e.g., "object categories").  
    - **Passing version:** Hypothesis space built from lower-level primitives (e.g., perceptual features, associative links), with declared handoff debt for how these form (e.g., "We will model feature extraction from sensory data in Year 2"). Must show how "dumber" parts (senses, memory) create the space without presupposing meaning.

  **Proposal 4: Descriptive model of collective behavior (no explanation claim).**  
  - **Gate 1:** Fail. No claim to explain emergence; only "build a descriptive model from video data."  
  - **Verdict:** **NO_VERDICT**.  
  - **Appeal objection:** N/A (not evaluated for explanatory adequacy).  

  ---

  ### Where the Procedure Misfires
  **1. Genuinely new phenomena (unknown levels):**  
  - **Risk:** Proposals may fail Gates 2–4 if levels are undefined (e.g., a quantum cognition theory with no clear "handoff" to behavior).  
  - **Mitigation:** Gate 4 allows declared debt—if the proposal acknowledges unknown levels and plans exploratory work, it passes. But if it ignores levels, it fails.  
  - **Example misfire:** A proposal on a novel emergent phenomenon (e.g., "quantum social effects") might fail Gate 4 even if innovative, if it doesn't declare debt for unknown levels. **Solution:** Panel can override via PASS_WITH_PANEL_REVIEW if the idea is high-reward.

  **2. Right but badly written proposals:**  
  - **Risk:** Factual gaps (e.g., missing steps) cause failure, even if the science is sound. Gates rely on text alone—no inference allowed.  
  - **Mitigation:** The procedure is harsh but fair. If a step is implied but not stated (e.g., "evolution" without steps), Gate 2 fails. This encourages clarity.  
  - **Example misfire:** A correct but vague mechanism (e.g., "natural selection leads to cooperation") fails Gate 2 for lack of steps. **Solution:** Rejection is defensible; PIs must write better.

  **3. "Skyhook" as bias against the proposer:**  
  - **Risk:** Gates 2 and 4 are subjective (e.g., "is this a step or a leap?"). Unconscious bias could label disliked ideas as skyhooks.  
  - **Mitigation:** Tests are operationalized (e.g., ghost crane substitution, handoff declaration). Use verbatim text to justify objections.  
  - **Example misfire:** A controversial proposal (e.g., "consciousness is a resonance") might be unfairly failed at Gate 3. **Solution:** Verdicts include specific objections from text; panel review for borderline cases.

  **Overall Safeguard:** PASS_WITH_PANEL_REVIEW flags values/risk judgments, isolating factual adequacy from panel preferences.  
  **Final Note:** This procedure prioritizes explanatory rigor over innovation. It may reject high-risk/high-reward work, but PASS_WITH_PANEL_REVIEW allows panel discretion. For your lab (Proposal 3), it flags a real issue—address the ghost crane to strengthen the crane.
