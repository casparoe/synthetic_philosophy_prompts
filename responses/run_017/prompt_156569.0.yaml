prompt: |-
  I've been reading about theories of truth on the side for a while — I write technical documentation for a living, so this is night-time stuff — mostly the people who call themselves deflationists or minimalists, and I keep running into the same move without having a word for it. Its not quite the thing I first assumed it was, and I want to know whether it has a name and, more than that, what exactly it is.

  Here's the shape of it. An author spends a chapter arguing that "true" doesn't pick out any real feature of sentences or beliefs at all — that it's a device, that saying "it's true that the train leaves at six" is just a way of saying the train leaves at six, useful mainly when you want to nod at a claim you can't conveniently repeat ("whatever the inspector said about the wiring, it was true"). I can follow that. Then a couple of chapters later the same author needs truth to do work. Two cases I actually marked in the margins:

  1. Explaining why our best theories let us build bridges that stay up and get probes to comets: because the theories are true, and plans formed on the basis of true descriptions of the world tend to succeed. When I try to cash out what "true" is contributing in that sentence, the only thing I can put in its place is "the world is the way the theory says it is" — which looks a lot like the correspondence story the earlier chapter said we didn't need.

  2. Explaining why you should want true beliefs rather than merely comfortable ones: true beliefs are the ones that will still steer you right in situations you haven't been in before. Same thing — the explanation seems to need truth to be a relation to how things really are, and I can't see how a word that contributes nothing beyond restating the claim is supposed to do that.

  So: a notion gets declared weightless, and then the exact weight it was said not to have is loaded back onto it when there's explaining to do. And it isn't a slip — the theory needs it; take the borrowed weight away and the explanation falls over.

  What I want is not a label, or not just a label. I want to know: does this have an established name, and if the nearest names only cover one of my two cases, tell me that (I've seen discussions of why truth is valuable or why it's the aim of belief, which feel close to case 2 but not to case 1). Is it one phenomenon or two? What are the nearest established concepts and how does what I've described differ from each? And then the part I actually care about: is the borrowing illegitimate, or can a thin notion legitimately carry explanatory weight — what would a deflationist have to produce in order to be entitled to that sentence, i.e. what would paying the debt look like rather than just asserting it's paid? Where are the edges: does it still count when the debt gets passed down a chain (truth leans on correspondence, correspondence leans on reference, reference leans on something else, and nothing at the bottom is ever cashed out)? Does it count when the borrowed sentence is doing rhetorical or motivational work rather than load-bearing work?

  I've bumped into the word "quasi-realism" somewhere in this neighborhood but it seemed to be about moral language and I can't tell whether that's the same shape or a different one. Relatedly: I think I see the same shape outside truth entirely — someone says "cause" is only a way of talking about patterns of events, then explains why you should intervene on this variable rather than that one by saying this is the real cause. Same pattern, or am I lumping two things together?
reasoning: |-
  Okay, the user is diving deep into truth theories, specifically deflationism, and noticing a recurring pattern where authors seem to undermine the concept of truth only to rely on it later for explanations. They've marked two cases: one about scientific success and another about the value of true beliefs. They want to know if this pattern has a name, whether it's legitimate, and if it appears in other areas like causality.

  First, I need to recall the main points of deflationism. Deflationists like Ramsey or Horwich argue that "true" doesn't add substantive content but serves as a linguistic tool. The user's confusion arises when deflationists then use "truth" to explain why theories succeed or why true beliefs are valuable. 

  The user's examples are spot-on. For case 1, saying theories are "true" to explain predictive success seems to sneak correspondence back in. Case 2 uses truth to explain reliability in new situations. The core issue is whether a minimal concept can bear explanatory weight without relying on a thicker notion.

  I remember that this is a known critique. Terms like "explanatory inflation" or "substantiality borrowing" come to mind. The user mentioned quasi-realism, which is Blackburn's idea for moral language—similar in structure but applied to different domains. The user is connecting patterns across concepts like truth and causality, which shows they're looking for a meta-pattern. 

  The key question is legitimacy. Can deflationists legitimately use "truth" in explanations? Some argue yes, via generalizations over propositions. For example, the success of science relies on the generalization that theories with true consequences lead to success. But critics say this just pushes the problem to what makes consequences true. The user's point about chains (truth leaning on correspondence, etc.) is crucial here—if the chain ends without a foundation, it's problematic.

  For the user's deeper needs: they write technical docs, so clarity and precision matter. They might be seeking not just answers but frameworks to analyze such conceptual inconsistencies in their work. They also enjoy philosophy at night, indicating a desire for intellectual satisfaction in understanding these patterns. 

  The user’s mention of causality suggests they’re looking for a broader epistemological tool. They want to know if this pattern invalidates deflationism or if there’s a way to resolve it. Highlighting responses from both sides (deflationist defenses vs. inflationary critics) will address their need for a balanced view. 

  They might also appreciate examples beyond truth, like causation, to validate their observation. Confirming that it’s a recognized pattern in multiple domains reinforces their insight. Pointing them to resources like Blackburn or Wright can help them explore further. Ultimately, they want to know if this borrowing is a fatal flaw or a manageable aspect of minimalist theories.
answer: |-
  This is a brilliantly observed tension – you've put your finger on a **fundamental and widely debated challenge within deflationism/minimalism about truth**. The pattern you describe is indeed a recognized phenomenon, and it has several names and facets. Let's break it down:

  1.  **The Core Tension & Its Names:**
      *   **Explanatory Inflation:** This is perhaps the most direct label. The deflationist *deflates* the concept of truth, stripping it of substantive explanatory weight, but then seems to *inflate* it again when needing to explain phenomena like scientific success or the value of truth.
      *   **The Problem of Truth's Value/Utility:** This focuses specifically on your case #2 – explaining why true beliefs are better than false ones. If "true" adds nothing, why is it valuable? Deflationists must account for this value without appealing to a substantive correspondence relation.
      *   **The Problem of Success/Surplus Value:** This encompasses both your cases. Why do true beliefs/theories lead to successful action/prediction in a way false ones don't? What "surplus value" does truth confer beyond mere assertion?
      *   **The Need for a Substantive Truth Property:** Critics argue that the work being done in these explanations *requires* a more substantive conception of truth than deflationism allows.
      *   **Truth as an Explanatory Primitive:** The worry is that deflationists end up needing to treat "truth" as a primitive explanatory notion *despite* their official story that it isn't one.

  2.  **Is it One Phenomenon or Two?**
      *   It's **one core phenomenon manifesting in two closely related but distinct explanatory contexts.** Both involve leveraging the concept of truth to explain an asymmetry between truth and falsity:
          *   **Case #1 (Scientific Success/Reliability):** Explaining the *instrumental reliability* of truth-bearers (theories, beliefs) in guiding action and prediction within the world.
          *   **Case #2 (Value of Truth):** Explaining the *normative or prudential superiority* of having true beliefs over false ones.
      *   While distinct, they are deeply intertwined. The instrumental reliability (#1) is often cited as the *reason* for the normative superiority (#2). Both seem to require truth to do more than just disquotation.

  3.  **Nearest Established Concepts & Differences:**
      *   **Correspondence Theory:** As you noted, the explanations *sound* like correspondence ("the world is the way the theory says it is"). The difference is that deflationists *officially deny* that correspondence is a substantive, analyzable relation between language/world or mind/world. They claim their minimal notion can *mimic* the explanatory power without the metaphysical baggage. Critics argue the mimicry fails.
      *   **Quasi-Realism (Simon Blackburn):** You were right to see a parallel! Quasi-realism is precisely about **projecting or "earning the right" to talk *as if* a minimalist concept (like moral value) had realist, explanatory weight, even though it officially doesn't.** The *shape* is identical: start with a minimalist, non-descriptive account of a discourse (truth, morals), then explain why we talk *as if* it described real features and why those "features" seem explanatory. The *difference* is the domain (truth vs. morals). Quasi-realism is a *strategy* a minimalist might employ to try to legitimize the explanatory borrowing you observe. It's controversial whether it succeeds for truth.
      *   **Pragmatism:** Pragmatists (like Peirce or later Putnam) often tie truth closely to long-term success, reliability, and ideal justification. Deflationists share the aversion to correspondence metaphysics but often resist the pragmatist's more substantive linking of truth to success/utility, fearing it collapses into something non-minimal. Your case #1 sounds pragmatist, but deflationists want to capture that success *without* making it part of the *meaning* of truth.
      *   **Success Semantics:** This is a specific approach trying to explain content/representation (and thus truth *conditions*) in terms of success conditions of actions based on beliefs. It directly tackles your case #1 but is generally seen as going beyond strict deflationism.

  4.  **Legitimacy, Paying the Debt, and Edges:**
      This is the heart of the debate. Can a deflationist legitimately use "true" in these explanations?
      *   **The Deflationist Defense:**
          *   **Generalization:** This is their primary tool. They argue that the explanations rely on massive *generalizations* licensed by the disquotational schema. E.g., "Theories enabling bridge-building are true" isn't attributing a magical property "truth"; it's a convenient way to say: "If Theory T says 'Material X has property Y', and we build a bridge using X relying on property Y, and it stands, then Material X *has* property Y" – and this holds for all the relevant claims of successful theories. The explanatory power comes from the *specific content* of the theories and their consequences, not from "truth" itself. "True" just lets us generalize over this vast set of specific instances of things being as they are said to be.
          *   **Expressive Role:** They argue that "true" is essential for expressing certain generalizations we *need* for explanation and normativity ("You should want your beliefs to be true" meaning "For any belief P, you should want it to be the case that P").
          *   **No Substantive Property Needed:** They insist that the success *is* fully explained by the specific ways the world is (as described by the theory's claims being correct), without needing an additional, substantive "truth-maker" relation. The explanation "works because the theory is true" is just shorthand for "works because things are as the theory says they are," which relies only on the minimal notion.
      *   **The Critic's Rebuttal (The Illegitimacy Charge):**
          *   **Smuggling Correspondence:** Critics argue that "things are as the theory says they are" *is* correspondence ("saying" implies representing, "are" implies the world). Deflationists haven't eliminated it; they've hidden it in the paraphrase.
          *   **Explanatory Vacuum:** Saying "the bridge stands because things are as the theory says they are" doesn't *explain* why the theory got things right in the first place, or why getting things right leads to success. It feels like restating the explanandum (the thing to be explained: why this theory works). The *reliability* of truth for success seems to demand an explanation of *why* getting things right correlates so well with predictive/instrumental success – an explanation deflationism struggles to provide without invoking more.
          *   **The Value Problem:** Why *should* I care if "P" obtains? If "true" adds nothing, "You should want P to be true" reduces to "You should want P". But this seems inadequate. Why should I want my belief *that P* to align with *whether P*, if "true" adds nothing? Deflationists need to explain the *normative force* of truth without relying on its substantive value. Appeals to general success (#1) risk circularity or collapsing into pragmatism.
          *   **The Chain Problem:** You nailed it. If truth relies on "things being as said," and "saying" relies on reference/representation, and deflationists also tend towards minimalism about reference (e.g., disquotational theories: " 'Electron' refers to electrons" is the core fact), then the chain relies on unexplained primitives ("electrons," "properties") at the bottom. Critics argue this leaves the entire explanatory structure floating without a real foundation. Paying the debt would require a fully worked-out, non-question-begging account of content, representation, or the connection between language/mind and world that doesn't ultimately lean on the very notions it's trying to deflate. Most deflationists deny this is necessary or possible.
      *   **Edges:**
          *   **Rhetorical/Motivational Work:** This is less problematic. Deflationists can easily say "true" is useful for emphasis, agreement, or focusing attention without implying it carries explanatory weight. The problem arises *specifically* when "true" is used in an *explanatory premise* ("success occurs *because* the theory is true").
          *   **Passing the Buck:** Yes, it still counts as problematic for critics if the debt is passed down a chain (truth -> correspondence -> reference -> ???) and the bottom is an unexplained primitive or a circle. The worry is that the explanation ultimately lacks genuine grounding.

  5.  **The Causation Parallel:**
      You are **absolutely right** that the *same structural pattern* appears with concepts like causation, laws of nature, probability, and moral properties. The debate between Humeans/anti-Humeans about causation is a perfect mirror:
      *   **Humean/Reductionist:** "Cause" is just a label for constant conjunction/regularity + perhaps subjective expectation. It doesn't pick out a real "oomph" in the world.
      *   **Then...** "You should intervene on C rather than D to change E *because* C is the *real cause* of E." Here, "real cause" seems to be doing heavy explanatory work – identifying where the *leverage* is – that the reductionist account struggles to support without smuggling in a more substantive notion of causation (e.g., counterfactual dependence, powers, necessitation). Anti-Humeans argue the reductionist account cannot adequately ground the explanatory asymmetry needed for intervention. Quasi-realism has also been applied to causation.

  **Conclusion:**

  You've identified the **Explanatory Inflation Problem** (or the **Utility/Success Problem**) for deflationary truth, which is arguably its most significant challenge. It manifests in explaining **scientific success/reliability** and the **value of true beliefs**.

  *   **Is the borrowing illegitimate?** Deflationists say **no**; it's just generalization and expressive necessity using their minimal resources. Critics say **yes**; it covertly relies on the correspondence or pragmatic substance it officially denies.
  *   **Paying the debt?** For deflationists, it means rigorously showing how generalizations over disquotation capture the explanatory work without smuggling (e.g., Horwich's attempts). For critics, it means providing a non-minimal account of representation, content, or the connection to the world that grounds the success and value asymmetries.
  *   **The chain?** A major point of contention. Deflationists often accept primitives; critics see this as evasion.
  *   **Rhetoric?** Less problematic.
  *   **Causation (etc.)?** **Yes, identical structural pattern.** The debate about minimalist vs. substantive concepts spans philosophy.

  **Where to look next:** Dive into debates specifically about the *value* of truth (e.g., Lynch, Horwich responses) and the *success* of science (e.g., Field's critique, Psillos). Reading Simon Blackburn on quasi-realism, even regarding morals, will illuminate the general strategy, as will discussions of Humeanism vs. anti-Humeanism about causation (e.g., Lewis, Armstrong, Carroll). Your observation about the cross-domain pattern is sharp and fundamental.
