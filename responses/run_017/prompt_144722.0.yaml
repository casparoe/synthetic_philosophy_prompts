prompt: |-
  I run a small decision-theory reading group with two friends from the economics department, and over the last few months I have come to accept something like the standard line about the value of information. Good's theorem — the result that for an expected-utility maximizer the ex ante value of a costless signal is never negative, since acquiring it never removes an act from the feasible set and you can always simply act as you would have acted had you not received it — strikes me as about as firm as anything in this neighbourhood, and I now lean on a stronger, more operational version of it: whenever additional information appears to make an agent worse off, the harm must be traceable to one of a short list of extra factors — the information was not really free, the agent is not an expected-utility maximizer, preferences run over beliefs as well as over outcomes, other agents are responding to what the agent knows, or the agent is boundedly rational and updates badly on noise. I like this version because it is diagnostic rather than merely reassuring: it predicts that every apparent counterexample will decompose into one of those failure modes.

  What I want from you is the case against it, in the sense of what would have to be true for me to be wrong. Please set aside the boring failures — monetary cost, time, attention, the risk of being lied to — and go for the structural ones. Here are the cases I keep turning over. First, my brother is an oncologist, and he says there are borderline genomic results he would rather not have, because once he has seen one he can no longer recommend the standard treatment with the particular wholeheartedness that he thinks does part of the therapeutic work; that looks like a case where information shrinks the feasible act set rather than merely informing a choice within it. Second, there is ignorance as a commitment device: the negotiator, or the family of a kidnap victim, who is better off genuinely not knowing, because not knowing is the only way to be unable to reveal the thing or unable to cave. Third, there are cases where the harm runs through the agent's own dispositions — learning from an accurate predictor what sort of person you are may destroy the very disposition you had hoped to exercise, and you cannot choose to be the sort of person who had not been told. Fourth, and this is the one I find hardest to fit into the framework at all, there is information that is not a coarsening or refinement of a fixed partition: learning a new concept, a name for a symptom, a distinction you could not previously draw, after which the space of possibilities has itself been re-individuated and acting as if you had not learned it is not among the things you can do even in principle.

  So: tell me which of these are genuine defeaters and which attack a strawman, and which assumption of the theorem each one targets. Rank them for me from fatal to merely awkward, and be explicit about what a defender of the theorem would herself concede as counting against it, as opposed to what only critics say — I would rather have the concessions than the polemic. I would also like to know whether the companion result, that a finer experiment is never worth less than a coarser one, is exposed at the same points or at different ones, and whether the ex ante framing is doing real work here, since in several of my cases the agent is plainly worse off ex post in some realizations while the average still comes out fine. Finally, and most importantly: has my operational version of the view been qualified into something unfalsifiable? If every apparent counterexample is met by saying that the information was not really free, or he was not really rational, or what arrived was not really a signal over a fixed state space, then the claim seems to be on its way to being true by stipulation. Say honestly whether that is where this ends up, and whether, for a claim of this kind, that is a defect. The two things that would move me most are a case where the feasible set genuinely shrinks and a case where the incoming item cannot be modelled as a partition of an already-given space of possibilities; if neither can be made to work, I would like to be told that too.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a decision-theory reading group and are convinced by Good's theorem about the non-negative value of information. But they're encountering cases where information seems harmful and want to know if these challenge the theorem's core assumptions. The user lists four scenarios: the oncologist's loss of conviction, ignorance as commitment, self-destructive knowledge, and conceptual change. They want a structural critique, not just the standard failure modes.

  First, I need to recall Good's theorem's foundations. It assumes a fixed state space, expected utility maximization, and no shrinkage of the feasible action set. The user's operational version includes diagnostic failure modes, but they're worried it's unfalsifiable. 

  Looking at the oncologist case: the doctor can't recommend treatment as wholeheartedly after seeing genomic data. Here, the action set doesn't technically shrink—he can still prescribe—but the effectiveness changes due to his belief. This targets the "preferences only over outcomes" assumption. The harm comes from the doctor's belief affecting the outcome, which is a belief-dependent utility. So this isn't a shrinkage of actions but a change in outcomes based on mental states.

  Next, ignorance as commitment. The negotiator avoids information to stay credible. Here, the feasible actions remain, but revealing information isn't a direct action choice. The issue is dynamic inconsistency and signaling. Good's theorem holds ex-ante, but the agent uses ignorance to commit to a strategy. This fits the "other agents responding" failure mode. The key is that without commitment mechanisms, the agent might choose differently later, so pre-commitment via ignorance has value.

  The third case: learning about oneself destroys dispositions. If a predictor says you'll be dishonest, you might become so. The action to "be honest" isn't feasible after the prediction because your disposition changes. This seems like actual shrinkage of the action set. But is "being honest" an action or a trait? If it's a trait, not a direct action, then the feasible actions (like lying or not) remain, but the outcomes change due to the altered trait. This attacks the fixed preferences and state-independent actions assumptions. It's messy because the information changes the agent's internal state, violating the static model.

  Conceptual change is the hardest. Learning a new symptom name re-individuates possibilities. Acting as if you didn't learn isn't possible because your cognitive state changed fundamentally. This directly challenges the fixed state space and coarsening assumptions. The theorem requires a predefined partition, but here the state space itself transforms. This is a structural defeater because the signal isn't a partition over existing states but a reconstruction of the ontology.

  Now, ranking them. Conceptual change is fatal—it breaks the theorem's core structure. Self-disposition is also fatal if dispositions are part of the action set. The oncologist and commitment cases are awkward but fit existing failure modes. 

  The ex-ante framing matters. In commitment cases, ex-ante avoidance is rational, but once informed, the agent might regret it. Good's theorem still holds ex-ante if you include all costs, but the commitment value arises from dynamic issues.

  The operational version risks being unfalsifiable if every counterexample is forced into a failure mode. But conceptual change and dispositional shrinkage might be genuine structural breaks. The defender would concede that if the state space isn't fixed or actions aren't state-independent, the theorem doesn't apply. But critics argue these are common in real life, making the theorem less applicable.

  The user wants to know if their view is unfalsifiable. It might be if stretched, but acknowledging limits (like fixed state spaces) keeps it meaningful. The deepest challenges are ontology changes and true action-set shrinkage, which the user also flags as critical. If those hold, the theorem's scope is limited, but it remains valid within its assumptions.
answer: |-
  Your operationalization of Good's theorem is sharp, but the cases you've identified expose genuine structural tensions. Below is a breakdown of how each challenges the theorem's assumptions, ranked by severity, with explicit concessions defenders would make. The core issue isn't that the theorem is *wrong* within its domain, but that its domain is narrower than your operational version suggests.

  ### Ranking the Cases (Fatal to Awkward)
  1.  **#4: Conceptual Change & Re-individuation (Fatal)**
      *   **The Challenge:** Learning a new concept (e.g., a diagnostic label) doesn't just provide information *within* an existing state space; it fundamentally restructures the agent's ontology. The "fixed state space" assumption collapses. Acting "as if you hadn't learned" is impossible because the agent now perceives distinctions and possibilities that didn't exist cognitively before. The signal isn't a partition over Ω; it creates a new Ω'.
      *   **Targeted Assumption:** **Fixed State Space (Ω) and Signal as Partition.** This is core to the formal setup. Information is defined as refining a predefined partition over predefined states.
      *   **Defender's Concession:** A defender *must* concede this falls outside the theorem's scope. The theorem applies only when the state space and the meaning of signals are defined *ex ante*. If learning changes the fundamental categories of description, Good's theorem doesn't speak to its value. This is a structural defeater for applying the theorem to conceptual learning.
      *   **Impact on Finer/Coarser Result:** This demolishes it. "Finer" and "coarser" are meaningless if the underlying state spaces are incommensurable. You can't compare the informativeness of signals defined over different ontological bases.

  2.  **#3: Self-Destroying Dispositions (Fatal/Awkward)**
      *   **The Challenge:** Learning about your disposition (e.g., "you are predictably dishonest") can destroy the very disposition ("being honest") you intended to exercise. Crucially, "choosing to be the person who wasn't told" is impossible. The information *causally alters* the agent's preferences, capabilities, or identity.
      *   **Targeted Assumptions:**
          *   **Fixed Preferences/Capabilities:** The theorem assumes the agent's utility function and feasible action set (A) are invariant to the information received. Here, I itself changes A or U.
          *   **"Acting As If" Preserves Feasibility:** The key escape hatch – "you can always do what you *would* have done without I" – fails because the agent *after* receiving I is fundamentally different. The pre-information action/state might not even *exist* for the post-information agent.
      *   **Defender's Concession:** Defenders often argue this reduces to "preferences over beliefs" (you dislike knowing you're dishonest) or "bounded rationality" (you irrationally let the prediction affect you). However, a *nuanced* defender concedes that if information *causally* and *inevitably* alters the agent's fundamental choice architecture (A, U) in a way that removes previously feasible options (like "being honestly disposed"), then **Yes, the Feasible Set Genuinely Shrinks.** "Acting as if" is not a feasible action post-learning because the *agent* required to perform it no longer exists. This is a structural defeater for the "action set never shrinks" pillar.
      *   **Impact on Finer/Coarser:** Similar issues arise. A "finer" signal might be more likely to trigger the destructive self-knowledge, making it potentially worse than a coarser one.

  3.  **#2: Ignorance as Commitment Device (Awkward)**
      *   **The Challenge:** The agent is *ex ante* better off not receiving I (e.g., the kidnap victim's location) because possessing I makes it impossible to credibly commit *ex post* to a desired course of action (e.g., "I truly cannot pay more than X" or "I truly do not know the location to reveal"). Genuine ignorance is the only commitment mechanism.
      *   **Targeted Assumptions:**
          *   **No Strategic Interaction:** Good's theorem assumes a single-agent, decision-theoretic setting. This case inherently involves other agents responding strategically to your knowledge state.
          *   **"Acting As If" Preserves Payoffs:** While you *can* physically "act as if" you didn't know (e.g., refuse to pay/not reveal), this action may not be *credible* to others if they suspect you know. The *payoff* of the action depends critically on others' *beliefs* about your knowledge, which I changes.
      *   **Defender's Concession:** This squarely fits the "**other agents are responding to what the agent knows**" failure mode. The defender readily concedes the theorem doesn't cover multi-agent strategic settings where knowledge itself has signaling value. The harm isn't from I itself, but from the predictable equilibrium response of others *to* your possession of I. The feasible actions *exist* (you can still say "no"), but their *consequences* (success of negotiation) change due to others' reactions. This is a predictable consequence of relaxing the single-agent assumption.
      *   **Impact on Finer/Coarser:** The finer signal might reveal more information that others can potentially infer or that weakens your commitment power further, making it potentially worse than a coarser signal in equilibrium. The theorem doesn't apply.
      *   **Ex Ante Framing Work:** This is crucial here. The *ex ante* value calculation *includes* the commitment benefit of ignorance. Good's theorem, applied *ex ante*, would say *choosing to remain ignorant* has non-negative value compared to *choosing to be informed* if both are options *ex ante*. The theorem holds: the *option to acquire I* has non-negative value *ex ante*, but the *option to avoid I* might have *higher* value due to the strategic context. The problem arises only if "not acquiring I" isn't a feasible *ex ante* choice within the model, which it usually is.

  4.  **#1: Oncologist's Conviction (Awkward)**
      *   **The Challenge:** Information (borderline genomic result) reduces the therapeutic efficacy of an action (recommending standard treatment) by undermining the doctor's conviction, which is part of the treatment mechanism.
      *   **Targeted Assumption:** **Preferences Depend Only on Outcomes, Not Beliefs/States.** The harm arises because the doctor *knows* the genomic result. His belief state directly causally impacts the patient outcome. His utility is belief-dependent.
      *   **Defender's Concession:** This is a textbook case of **preferences running over beliefs as well as outcomes**. The standard treatment *plus genuine conviction* yields a better outcome than the standard treatment *plus doubt*. The information doesn't remove the action "recommend standard treatment" from the feasible set; it changes the outcome associated with that action *given the doctor's belief state*. This fits neatly within your listed failure modes. A defender would argue the action set remains intact; it's the consequence function C(a, ω) that now depends on the agent's belief (induced by I) as well as ω.
      *   **Impact on Finer/Coarser:** A finer signal might provide more detail that further erodes conviction, potentially making it worse than a coarser signal. But again, this is belief-dependent utility at work.
      *   **Ex Ante Framing Work:** The *ex ante* value of the signal could be negative *because* the doctor correctly anticipates how the information will affect his beliefs and thereby the therapeutic outcome. The theorem holds because the *option* to get the signal is valued correctly *ex ante*, including these belief-dependent effects. The harm is "priced in."

  ### Addressing Your Core Questions

  1.  **Feasible Set Shrinkage:** Case #3 (Self-Destroying Dispositions) is the strongest candidate for genuine shrinkage. If "being disposition D" is considered an action or a necessary precondition for certain actions, and I *causally destroys* the agent's capacity for D, then those actions become genuinely infeasible. Acting "as if" ignorant is impossible for the transformed agent. Defenders will push back, arguing disposition isn't an "action" per se, but this hits the limit of the model.
  2.  **Non-Partition Signal / State Space Change:** Case #4 (Conceptual Change) is the definitive example. This violates the foundational setup. The signal isn't a message about predefined states; it redefines what the states *are*.
  3.  **Ex Ante Framing:** This is doing *crucial* work in #2 (Commitment) and #1 (Oncologist). In both, the agent is often worse off *ex post* after receiving the information in specific realizations. However, the *ex ante* valuation *before* knowing if you'll receive the harmful signal (or how harmful it will be) incorporates these possibilities. The theorem's guarantee is *ex ante* non-negative value for the *option* to receive the signal. The *ex post* regret doesn't violate the theorem. Cases #3 and #4 challenge whether the *ex ante* valuation can even be coherently defined within the model.
  4.  **Unfalsifiability of the Operational Version?** **Yes, there is a significant risk.** Your version is powerful but vulnerable to becoming a "no true Scotsman" defense:
      *   Any harm must be due to (Cost | Non-EU | Belief-Dependent Utility | Other Agents | Bounded Rationality | Non-Partition Signal).
      *   The categories "Belief-Dependent Utility" and "Non-Partition Signal" are vast and can potentially subsume many surprising harms (like #1 and #4). "Bounded Rationality" is a catch-all.
      *   **Is this a defect?** For a *formal mathematical theorem*, this is **not a defect**. Good's theorem is true within its explicit, narrow assumptions. The defect lies in **overgeneralizing its operational applicability** to *all* decision contexts without carefully verifying if those assumptions hold (especially fixed Ω, fixed A, fixed U structure, single-agent). Your operational version is an *interpretive framework* for applying the theorem, and *that* framework risks becoming unfalsifiable if these categories are stretched too far. The defense "that's not *really* the kind of information the theorem is about" becomes readily available.
  5.  **Does it end in stipulation?** It ends by recognizing the theorem's **domain of applicability is limited**. Within that domain (fixed Ω, A, U; EU; single-agent; signal as partition), it's robust. Outside that domain, its predictions don't necessarily hold, and the "failure modes" are simply labels for *why* we are outside the domain. The value is in diagnosing *how* a scenario deviates.

  ### Conclusion

  *   **Fatal Challenges:** #4 (Conceptual Change) directly breaks the fixed state space assumption. #3 (Self-Destroying Dispositions) genuinely challenges the fixed action set/preferences assumption if dispositions are central to feasible actions.
  *   **Awkward Challenges (Fit Failure Modes):** #2 (Commitment) fits "other agents responding." #1 (Oncologist) fits "preferences over beliefs."
  *   **Ex Ante Framing:** Vital for #1 and #2; strained but perhaps defensible in #3; incoherent in #4.
  *   **Finer/Coarser:** Exposed similarly to the base theorem, fatally challenged by #4.
  *   **Your Operational Version:** It's insightful but *is* at risk of unfalsifiable overapplication. **The key concession from a defender is this: Good's theorem guarantees non-negative value *only* for signals that refine a predefined state space, for an agent whose fundamental capabilities and preferences (over outcomes) are unchanged by the signal itself, in a non-strategic environment.** Cases #3 and #4 violate the core invariance assumptions (#3 on A/U, #4 on Ω). Case #2 violates the single-agent assumption. Only #1 fits cleanly within the existing "preferences over beliefs" exception.

  You were right to focus on feasible set shrinkage (#3) and state space re-individuation (#4). These are the deepest structural challenges that force a recognition of the theorem's inherent limitations, not just its standard failure modes. The theorem remains a cornerstone, but its empire has borders.
