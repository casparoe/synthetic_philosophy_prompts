  The core challenge here is bridging two very different paradigms: one focused on deterministic computational processes with strict correctness guarantees, and another modeling human-like reasoning with inherent subjectivity. The user's framing suggests they suspect fundamental incompatibilities, especially regarding idempotence and result invariance.

