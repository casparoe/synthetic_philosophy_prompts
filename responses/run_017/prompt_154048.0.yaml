prompt: |-
  I run a small reading group — two philosophers, two cognitive-science grad students, an ML engineer, and me — that has spent about a year on the classical-versus-connectionist dispute over whether cognition is computation over language-like representations: the language-of-thought hypothesis in something like its Fodorian form, with concatenative syntax, constituent structure, the same constituent tokened and re-tokened across different thoughts, and systematicity and productivity falling out of that structure rather than being trained in from the data. Two of our members, a committed classicist and a committed wide connectionist of the embodied-dynamical stripe, have now argued each other into a stalemate, and I want to convert the stalemate into a document rather than another evening of talking past each other. To keep this from becoming a citation contest, the group has stipulated an evidence base that neither side may dispute — they may only interpret it: (i) a filler-diversity curve, replicated across a transformer, a recurrent net, and a hybrid symbolic model on an artificial grammar of pseudoword functors and contentives, in which accuracy at novel role reversals is a steep, saturating function of how many distinct fillers occupied each role in training — near chance below roughly fifty distinct fillers, above ninety percent past a couple of thousand — with the curves nearly identical across architectures except for a persistent tail of role-confusion errors in the neural models; (ii) a re-encoding result from intracranial and MEG decoding, on pairs like John loves Mary versus Mary loves John, where a decoder trained to read a constituent's identity out of its agent-role representation fails to read that identity out of its theme-role representation, while a separately fitted linear map between the two role formats succeeds; (iii) a re-binding probe in which the subject must answer a query about a constituent from a premise that has been masked, showing graded interference from the number of intervening constituents with no sharp capacity break, plus a small fixed cost for role-swapped constituents that does not vary with semantic similarity; and (iv) a lesion dissociation in which focal damage to left inferior frontal cortex selectively disrupts non-adjacent dependency binding while sparing adjacent dependencies and single-word semantics.

  Now the deliverable. Draft the joint statement these two could both sign at the end of a good-faith adversarial collaboration — we try to run things on the old blogosphere norms: agreed claims first, cruxes, predictions written down before anyone looks at the data, no motte-and-bailey. I want, as a numbered section, the claims both can genuinely sign: about the formalism (for instance, that any adequate model must implement some map from structured contents to internal states), about what needs explaining (the four stipulated results above), and about what those results rule out — my guess is that a flat feature-bag associationism is dead, but so is any story on which the brain literally buffers Mentalese sentences in a neural register. Then a table of the residual disagreements, each row giving the crux, the classicist's own formulation in wording she would accept, the connectionist's own formulation in wording he would accept, and whether the dispute at that point is empirical or verbal. I suspect at least four cruxes: whether graded, diversity-dependent systematicity is even the phenomenon the classical argument demanded or a weaker cousin of it; whether re-encoding across roles is fatal to constituent identity or only to a naive requirement of vehicle-identity, given that content-identity can survive format change; whether architectural priors that induce systematic generalization from data explain it or merely smuggle in the structure the classicist wanted; and whether some of this is a clash of Marr-level descriptions rather than of theories, so that nothing empirical could settle it. For each crux, name one concrete probe both would accept as bearing on it — design a follow-up if you need to, say a pseudoword-grammar battery with held-out roles, or a version of the re-binding probe with crossed semantic and syntactic factors — and record in advance what each camp predicts it will show and what result would make each of them give ground.

  Two more things. Please flag explicitly any row where you think they are arguing about words rather than about the world, and say what observation would reveal that. And add a short closing section answering this: if a third position — a vector-symbolic architecture that binds roles to fillers in distributed superpositions, or an instrumentalist reading on which structure is a property of the best description rather than of the mechanism — undercuts part of the debate, say which part, and whether either of my two members should have been occupying that ground all along.
reasoning: |-
  We are drafting a joint statement for two opposing camps (classicist and wide connectionist) in a reading group, based on stipulated evidence. The goal is to convert their stalemate into a document with agreed claims and a table of residual disagreements.

  Stipulated Evidence:
  (i) Filler-diversity curve: Accuracy at novel role reversals increases with the number of distinct fillers per role in training (steep, saturating curve). Near chance below ~50 distinct fillers, above 90% past ~2000. Curves nearly identical across transformer, recurrent net, and hybrid symbolic model, except for a tail of role-confusion errors in neural models.
  (ii) Re-encoding result: Decoder trained on agent-role representation fails on theme-role representation for the same constituent (e.g., "John" in "John loves Mary" vs. "Mary loves John"), but a linear map between role formats succeeds.
  (iii) Re-binding probe: Graded interference from number of intervening constituents (no sharp capacity break) and a small fixed cost for role-swapped constituents (independent of semantic similarity).
  (iv) Lesion dissociation: Focal damage to left inferior frontal cortex disrupts non-adjacent dependency binding but spares adjacent dependencies and single-word semantics.

  Deliverable Structure:
  1. Jointly agreed claims (numbered section).
  2. Table of residual disagreements (cruxes) with:
     - Crux description (the point of disagreement)
     - Classicist's formulation (in their own words)
     - Connectionist's formulation (in their own words)
     - Whether the dispute is empirical or verbal
     - For each crux, a concrete probe (experiment) that both accept as bearing on it, and predictions from each camp.

  Additionally:
  - Explicitly flag any row where they are arguing about words (verbal dispute) and say what observation would reveal that.
  - A short closing section on a third position (e.g., vector-symbolic architecture or instrumentalist reading) and whether it undercuts part of the debate.

  Agreed Claims (Section 1):
  We need to state what both can agree on about:
  - The formalism: e.g., that any adequate model must implement some map from structured contents to internal states.
  - What needs explaining: the four stipulated results.
  - What those results rule out: e.g., flat feature-bag associationism is dead; also, the brain does not literally buffer Mentalese sentences in a neural register.

  Agreed Claims Draft:
  1. Both parties agree that cognition involves representations that are structured in the sense that they track the compositional and relational properties of the content they represent. Specifically, the internal states must support operations that are sensitive to the roles (e.g., agent, theme) and the fillers that occupy those roles, and must allow for recombination of fillers across roles.

  2. The four stipulated results (i-iv) are robust phenomena that any adequate cognitive model must explain.

  3. The results rule out:
     a. Flat associationist models that treat representations as unstructured bags of features, as such models cannot explain the systematic role-filler binding and recombination evidenced in the results (especially i, ii, and iv).
     b. Strong classical models that posit that the brain literally stores and manipulates symbolic tokens in a manner isomorphic to a formal language (e.g., a "neural register" holding Mentalese sentences), because the results show graded, continuous, and diversity-dependent processes (i, iii) and format-specific representations (ii) that are not compatible with discrete, persistent token buffers.

  4. Both parties agree that the cognitive system must implement a mechanism for binding roles and fillers, and for maintaining and recombining these bindings in a way that supports systematic generalization.

  Table of Residual Disagreements (Cruxes):
  We anticipate at least four cruxes:

  Crux 1: The nature of systematicity
     - Classicist: The filler-diversity curve shows that systematic generalization is not inherent in the architecture but is learned from data, and only after extensive exposure to many fillers. This is a weakened, data-dependent form of systematicity, not the strong, inherent systematicity that the classical view demands.
     - Connectionist: The curve shows that systematicity emerges naturally from learning in neural networks with the right architectural priors and sufficient data, which is exactly how it should be in a learning system. This is the real phenomenon of systematicity, and the classical demand for inherent systematicity without learning is unrealistic.

  Crux 2: Re-encoding and constituent identity
     - Classicist: The re-encoding result (ii) shows that the same constituent in different roles is represented in different formats, which violates the classical requirement of a single, amodal token (vehicle) for each constituent. This is evidence against classical constituent identity.
     - Connectionist: The result only shows that the representation format is role-dependent, but the linear map success indicates that the content (the identity of the constituent) is preserved. This is compatible with the idea that the same content can be represented in multiple formats, and does not require a single vehicle.

  Crux 3: The role of architectural priors
     - Classicist: Architectural priors that induce systematic generalization from data (as in neural networks) do not explain systematicity; they merely smuggle in the structure that classicists posit, without the robustness and inherent properties of a classical system.
     - Connectionist: Architectural priors that guide learning to capture systematic structure are the right explanation for how systematicity arises in biological systems, which are inherently learning systems.

  Crux 4: Level of explanation (Marr levels)
     - This might be a verbal dispute: Are the two camps talking about different levels of description (computational vs. algorithmic) and thus not directly competing?

  Additionally, we need to design a concrete probe for each crux and state predictions.

  Probes:

  For Crux 1 (systematicity): Use a pseudoword-grammar battery with held-out roles. Specifically, train models (and test humans) on a grammar with roles R1, R2, R3, but hold out some role combinations (e.g., R1 as agent and R2 as theme) during training. Then test on sentences with these held-out role combinations. Also, vary the number of distinct fillers for the held-out roles during training.

  - Classicist prediction: Even with high filler diversity, if a role combination is held out, performance will be at chance because the system has not learned the combinatorial rule for that specific role pair. Systematicity is not fully general.
  - Connectionist prediction: With sufficiently high filler diversity in the training data for the individual roles, the model will generalize to the held-out role combinations because the system learns to represent roles and fillers independently, enabling composition.

  For Crux 2 (re-encoding and identity): Design a decoding experiment with more than two roles and also include a condition where the same filler appears in two different roles in the same sentence (e.g., "John praises John"). Test whether the representation of the two occurrences of "John" in the same role or different roles can be linearly mapped, and whether there is a cost in decoding accuracy or mapping error when the same filler is in two roles.

  - Classicist prediction: For the same filler in two roles, the two representations will be distinct and not linearly mappable (or with high error) because the vehicle is tied to the role. The linear map between roles (as in ii) will fail when the same filler appears in two roles simultaneously because the system must distinguish the two tokens.
  - Connectionist prediction: The linear map between roles will still work for the same filler in two roles, and the representation will be such that the identity of the filler is preserved across roles, even when the filler is repeated. There might be a small cost due to role conflict, but the mapping will be successful.

  For Crux 3 (architectural priors): Compare different architectures (e.g., transformer, RNN, VSA) on a task that requires systematic generalization, but with minimal training data (low filler diversity). Also, include a condition where the architecture is manipulated (e.g., by ablating attention heads in transformers or by changing the binding mechanism in VSA).

  - Classicist prediction: Without explicit symbolic mechanisms (as in a hybrid model), pure neural models will fail at systematic generalization in low-data regimes, even with architectural priors. Only models with explicit symbolic structure will show robust generalization in such conditions.
  - Connectionist prediction: Neural models with the right priors (e.g., transformers with attention) will show generalization even in low-data regimes if the architecture is designed to capture structure, and ablations that remove these priors will harm generalization.

  For Crux 4 (Marr levels): This might be more verbal. To reveal if it's verbal, we need an observation: if both camps agree on the algorithmic mechanism (e.g., the same neural mechanism) but one describes it as implementing a classical computation and the other as a connectionist one, then it's verbal. We could design an experiment that forces a choice on the mechanism.

  Probe: Take the re-binding probe (iii) and add a condition where the task requires variable binding with multiple levels of embedding (e.g., center-embedded sentences) and measure the pattern of errors and reaction times. Then build both a classical model (with a stack or buffer) and a connectionist model (e.g., an RNN) that can fit the data. If both models can be made to fit the data equally well, then the dispute is about the description, not the mechanism.

  - Classicist: The pattern of errors will show discrete breakdowns (e.g., at a fixed stack depth) that are best explained by a classical bounded resource (like a stack).
  - Connectionist: The pattern of errors will be graded and continuous, and an RNN with continuous dynamics will naturally capture the pattern.

  But if both models can be made to fit, then the dispute is verbal. The observation that reveals it: if the same underlying mechanism can be described both ways, then the dispute is about words.

  Closing Section: Third Position (e.g., Vector-Symbolic Architecture or Instrumentalism)
  - Vector-Symbolic Architecture (VSA): This uses distributed representations and binding operations (e.g., tensor products) to form structured representations. It undercuts the debate by showing how structure can be implemented in a distributed, neural-friendly way, without discrete tokens. This might be a middle ground that the connectionist should have been occupying because it embraces distributed representations but also structure. However, it may not satisfy the classicist's demand for inherent systematicity without learning, because VSAs still require the right binding operations to be in place.

  - Instrumentalism: The view that structure is a property of the description, not the mechanism. This undercuts the debate by making it about the explanatory level. Both camps might be describing the same underlying reality at different levels. This might be a position that both could accept, but it might not resolve the empirical disagreements about the mechanisms.

  We note that VSA is a concrete architecture that might resolve some of the empirical cruxes (e.g., Crux 2: it allows for the same filler in different roles by binding the filler vector to a role vector, and the linear map might be the unbinding operation). The classicist might see VSA as a way to implement classical structure, and the connectionist might see it as a neural-compatible mechanism.

  Now, we write the joint statement and the table.
answer: |-
  ### Joint Statement on the Classical-Connectionist Debate: Agreed Claims

  We, the undersigned members of the reading group—representing classical and wide connectionist perspectives—agree on the following points based on the stipulated evidence (i–iv) and shared norms of adversarial collaboration. These claims reflect our consensus on the minimal formal requirements for cognitive models, the phenomena to be explained, and what the evidence rules out.

  1. **Structured Representations are Necessary**:  
     Any adequate model of cognition must implement a formal mapping from structured external contents (e.g., relational propositions like "John loves Mary") to internal states. This mapping must support the following operations:  
     - **Role-filler binding**: Assigning fillers (e.g., "John") to abstract roles (e.g., agent/theme).  
     - **Re-combination**: Systematically reusing fillers across roles (e.g., "Mary loves John").  
     - **Constituent identity**: Tracking the same filler across contexts (e.g., recognizing "John" as identical in "John loves Mary" and "Mary loves John"), even if its representational format changes.  

  2. **The Core Phenomena to Explain**:  
     The following evidence must be accounted for by any model:  
     - **(i) Filler-diversity curves**: Systematic generalization (e.g., accuracy on novel role reversals) depends on exposure to a large diversity of fillers per role (~50 for initial learning, ~2000 for >90% accuracy), with similar saturation patterns across architectures (transformers, RNNs, hybrid models) but persistent role-confusion errors in neural models.  
     - **(ii) Re-encoding across roles**: A decoder trained to read a filler’s identity in one role (e.g., agent) fails to read it from another role (e.g., theme), but a linear map between role-specific representations succeeds.  
     - **(iii) Re-binding dynamics**: Recovering a constituent from a masked premise shows:  
       - Graded interference from intervening constituents (no sharp capacity limits).  
       - A fixed, small cost for role-swapped constituents independent of semantic similarity.  
     - **(iv) Lesion dissociation**: Focal damage to left inferior frontal cortex selectively disrupts non-adjacent dependency binding while sparing adjacent dependencies and single-word semantics.  

  3. **Ruled-Out Positions**:  
     - **Flat feature-bag associationism**: Models treating representations as unstructured sets of features (e.g., bag-of-words embeddings without role binding) are insufficient. They cannot explain filler-diversity effects (i), re-encoding (ii), or lesion dissociations (iv).  
     - **Literalist classical buffering**: Models positing that the brain stores and manipulates discrete, tokened symbols in "Mentalese registers" (e.g., isomorphic to linguistic strings) are falsified. The evidence shows format-dependent representations (ii), role confusion (i), and continuous resource constraints (iii) incompatible with persistent symbolic buffers.  

  4. **Shared Commitments for Future Work**:  
     - Explanations must address how the brain implements role-filler binding, recombination, and constituent identity without assuming a priori symbolic tokens.  
     - Architectural priors (e.g., neural network inductive biases) and learning from data are central to understanding generalization.  

  ---

  ### Residual Disagreements: Cruxes and Probes  
  The table below summarizes unresolved disputes. For each crux:  
  - **Crux**: The core disagreement.  
  - **Classicist Formulation**: Wording acceptable to the classicist.  
  - **Connectionist Formulation**: Wording acceptable to the connectionist.  
  - **Dispute Type**: Empirical (E) or Verbal (V).  
  - **Concrete Probe**: An agreed-upon experiment to resolve the crux.  
  - **Predictions**: Expected outcomes and what would make each side give ground.  

  | Crux | Classicist Formulation | Connectionist Formulation | Type | Concrete Probe | Predictions and Conditions for Concession |
  |------|------------------------|---------------------------|------|----------------|------------------------------------------|
  | **1. Systematicity: Inherent vs. Emergent** | The filler-diversity curve (i) shows that systematic generalization is data-dependent and saturating, failing to achieve the *strong systematicity* required by classical cognition—where novel combinations are robustly supported without extensive training. | The curve (i) demonstrates that systematic generalization *is* the phenomenon classical arguments demand, emerging naturally from architectural priors and statistical learning; the classical "strong" criterion is an idealized fantasy irrelevant to biological cognition. | E | **Held-out-role generalization**: Train models/humans on a pseudoword grammar with roles (agent/theme/location) using diverse fillers (≥2000 per role). Test on sentences with *held-out role pairs* (e.g., agent-location combinations never seen in training). | **Classicist prediction**: Accuracy near chance for held-out role pairs, proving systematicity is combinatorially limited. *Concession if*: >90% accuracy on held-out pairs with no diversity drop-off. <br> **Connectionist prediction**: High accuracy (>85%) on held-out pairs if filler diversity is sufficient. *Concession if*: Performance collapses (≤60%) even with high diversity. |
  | **2. Constituent Identity: Vehicle vs. Content** | Re-encoding (ii) proves constituent identity is not preserved by a single amodal vehicle (token), as required by classical LOT; successful linear mapping shows only content similarity across distinct, role-specific representations. | Re-encoding (ii) confirms content identity is maintained despite role-specific formats; the classical demand for vehicle identity is empirically unmotivated and ignores distributed representation. | E | **Same-filler dual-role decoding**: Use intracranial/MEG to decode filler identity (e.g., "John") in sentences where it occupies *two roles simultaneously* (e.g., "John praises John"). Test if a single decoder trained on one role works for both. | **Classicist prediction**: Decoder fails (AUC ≤0.65) for the same filler in dual roles, proving distinct vehicles. *Concession if*: Single decoder succeeds (AUC ≥0.9) across roles. <br> **Connectionist prediction**: Decoder succeeds with high accuracy. *Concession if*: Failure persists even after controlling for attention/load. |
  | **3. Architectural Priors: Explanation vs. Smuggling** | Priors that induce systematicity (e.g., in neural nets) merely "smuggle in" classical structure through handcrafted design (e.g., attention mechanisms), explaining nothing about how biology acquires structure de novo. | Priors are the primary explanation for systematicity, as they allow learning systems to extract structure from data without innate symbolic machinery. | E | **Low-diversity architecture ablation**: Train transformers/RNNs on the grammar from (i) with *low filler diversity* (≤50 per role). Ablate key components (e.g., attention heads, recurrence gates). Test generalization to role reversals. | **Classicist prediction**: Ablations cause near-chance performance, proving priors are insufficient without data. *Concession if*: Generalization remains high (>80%) after ablation. <br> **Connectionist prediction**: Generalization stays above baseline (e.g., >70%) with priors intact; ablations cause sharp drops. *Concession if*: Ablations have no effect. |
  | **4. Marr Levels: Competence vs. Mechanism** **(⬅ Flagged as verbal)** | The debate conflates computational (what the system does) and algorithmic (how it works) levels. Classicists focus on competence (systematicity as a computational property), while connectionists focus on mechanism (continuous implementation). | The dispute is not empirical but descriptive: classical "structure" is just a high-level summary of distributed processing, not a causal mechanism. | V | **Observation to reveal verbal nature**: If both sides agree that (a) the brain supports systematic recombination, and (b) it uses continuous, diversity-dependent processes (per i, iii), but still disagree on whether to call it "symbolic." | **Verbal resolution**: If probes 1–3 show systematicity is robust but implemented distributionally, the classicist should accept "structural descriptions" as computational-level accounts, while the connectionist should accept that algorithms approximate classical operations. *Dispute dissolves if*: No new empirical data changes positions after probes 1–3. |

  ---

  ### Third Positions: Undercutting the Debate  
  A **vector-symbolic architecture (VSA)**—e.g., using tensor products or holographic reduced representations to bind roles and fillers in distributed superpositions—undercuts **Crux 2 (constituent identity)** and **Crux 3 (architectural priors)**. It demonstrates how:  
  - Role-specific re-encoding (ii) arises naturally from binding operations (resolving Crux 2 in favor of the connectionist).  
  - Architectural priors (e.g., binding/unbinding operations) explain systematicity without innate symbols (resolving Crux 3 in favor of the connectionist).  
  - **Who should occupy this ground?** The connectionist should adopt VSA as it aligns with distributed representation and learning, while the classicist should concede it as a viable implementation of classical structure (but not competence-level explanations).  

  An **instrumentalist reading** (structure as a property of descriptions, not mechanisms) undercuts **Crux 4 (Marr levels)** and parts of **Crux 1 (systematicity)**. It shows that:  
  - Disputes about "true" systematicity (Crux 1) reduce to descriptive preferences if the phenomenon is robust in probes.  
  - **Who should occupy this ground?** Both members: The classicist can retain structure as an explanatory abstraction, while the connectionist can reject it as a mechanistic commitment.  

  ---

  ### Closing Summary  
  This document reflects genuine agreement on formal requirements, phenomena, and falsified extremes. The residual cruxes are largely empirical (1–3) and tractable via the proposed probes. Crux 4 is likely verbal and resolvable through descriptive clarification. Third positions (VSA/instrumentalism) offer synthesis, showing that structure need not be classical to be real. We commit to testing these probes and updating our positions based on evidence.  

