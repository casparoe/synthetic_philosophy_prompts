prompt: |-
  hey — I've got a 20 minute talk next month and then a 40 minute q&a, and the q&a is the part I'm actually nervous about. The room is a joint session: mostly bacterial genome taxonomists (the kind who cluster genomes by average nucleotide identity and think "species" is a filing convention for prokaryotes that horizontal transfer makes a joke of), four or five mycologists who spend their lives with fungi whose sexual and asexual stages historically got names of their own, three museum ornithologists who care about type specimens and about names not turning over every decade, and two philosophers of biology — one a fairly committed pluralist, one who holds that species are individuals/lineages rather than kinds.

  The thesis I'm defending is what I've been calling windowed cohesion: a species taxon is real, but only relative to a cohesion window — you fix a timescale (how many generations you're asking about) and a tolerance for gene flow and ecological drift, and only then does "is this one species or two?" have an answer, so the same group of organisms can genuinely be one species at a decadal window and several at a millenial one. I want to argue that isn't a defect: it's why pluralism is right, and why conservation law should index its units to a management horizon instead of pretending to carve nature at a joint. The argument leans on two cases — obligately asexual lineages where cohesion is basically shared descent plus shared niche, and a ring-species-ish case where gene flow is fine locally around the ring but not globally.

  So: draft me the prep sheet. Eight or so objections, in the order they'll actually come, each phrased the way that particular person would put it, with who's raising it, how much damage it does, a two-minute-ish reply, and a note on where the reply is soft. Also what I should concede up front before anyone asks, and the one question I'm hoping nobody asks. No references needed, I've read the stuff. And flag how confident you are in each call — especially which one you're least sure I'll really get.
