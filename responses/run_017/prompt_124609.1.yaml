prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a piece about how people who are actually trying to do good with money or with a career decide *what* to work on. It started with a dinner last month with three friends — one works at a big foundation, one runs a tiny nonprofit, one's an economist — where we tried to rank a list of causes on a napkin and ended up sort of shouting about why. Since then I've been keeping a spreadsheet of my own gut verdicts on stylized cases, and the pattern is embarassing: I keep saying yes to things that the usual importance/tractability/neglectedness scoring seems to rank low, and no to things it seems to rank high. My working formula is roughly impact ≈ importance × tractability × (1 − how crowded the *specific* slot is) + value-of-what-you-learn − credit-you'd-have-gotten-anyway, but I can't make it behave, and I don't trust it. So: here are my verdicts, on made-up-but-plausible cases (please don't worry about whether the numbers are real, I want the structure). Deworming-scale program, huge number of people affected, cheap, solid evidence, one small funder in the country: obvious yes. A therapy area with thousands of researchers where the actual binding constraint is that *nobody* is compiling the regulatory toxicology dossiers — zero people on it, cheap to fund, whole pipeline waiting: yes, top tier, even though the field is about as crowded as a field can be by headcount. A much-loved charity that will definately hit its funding target with or without me, so my 50k just frees up another donor's 50k: worth roughly nothing, no. A 0.5% shot at averting something catastrophic, where if it fails I learn a lot and can try a different approach next year: yes, fund it. A one-shot long shot with an even bigger nominal payoff — a durable artifact meant to shape some far-future civilization — tiny chance, enormous stakes, but if it fails I learn nothing and the window closes for good: no. (This d/e pair is the one I keep going back and forth on; I can't say what the difference is even supposed to *be* in a formula.) A pure diagnostic study that helps nobody directly but would redirect a large, named foundation's next 200M toward something probably-decent: yes. The same study, except the only funders in that space are locked into their priorities for a decade and won't move: meh, no — so learning on its own isn't enough. A field-building program that would create a community of people who will pick causes themselves fifteen years from now, in ways I can neither predict nor steer: suspicious, I'd rather fund the diagnostic study — even though that also works by changing what other people's money does later, which is my second uncomfortable pair. And finally: an intervention with genuinely good immediate benefits (big cash transfers, say) that is delivered through a patronage network and thereby entrenches that network, making a better reform harder for a generation: I want to subtract a lot, maybe flip it to a no.

  So: is there one principle that gets all of these, or nearly? I'd like it stated precisely enough that I could actually put it in a spreadsheet, as a formula or as a short list of clauses, with the case that forces each clause into the picture. Then I want it to earn its keep by telling me what to think about cases I haven't listed — give me at least three of your own, ideally of different shapes from mine (something like: a cause only I personally could work on and nobody could be hired for; a cause whose importance hinges on one factual question I could resolve cheaply this month; a cause whose success would make the problem come back worse in twenty years). And be honest about which of my verdicts your principle can't accommodate and would have me overturn, and which verdict you'd drop if you had to choose between a messy principle that saves all of mine and a clean one that loses one or two.

  Could you lay it out in four named sections, roughly: "The formula" (about 250 words, stated precisely, no hedging), "Clause by clause" (about 350 words, one motivating case per clause), "Three cases you haven't seen" (about 250 words), and "Verdicts you'd have me drop" (about 150 words, including the choice between messy-and-complete and clean-and-lossy).
reasoning: |-
  Okay, let me approach this systematically. The user is a science journalist grappling with a practical ethics problem - how to evaluate impact when standard frameworks don't match their intuitions. Their napkin-ranking exercise revealed contradictions between traditional ITN (Importance/Tractability/Neglectedness) scoring and their gut feelings about various hypothetical cases. 

  Looking at their examples, I notice patterns that ITN fails to capture: 
  - The deworming case shows that neglectedness must consider specific niches, not just broad fields
  - The regulatory dossier case demonstrates that tractability can exist even in crowded spaces if a critical gap is identified
  - The funding displacement case reveals the difference between absolute and marginal impact
  - The diagnostic study examples highlight the value of information and leverage points

  The user's self-described "embarrassing" pattern actually shows sophisticated thinking about second-order effects and systemic leverage. Their discomfort with the patronage case and field-building program suggests particular sensitivity to long-term institutional consequences. 

  For the formula construction, I consider:
  - Must account for information value and credit assignment
  - Needs to handle probabilistic outcomes differently based on learning potential
  - Should incorporate leverage multipliers (like redirecting other funds)
  - Requires discount factors for harmful side effects

  The paired cases (d/e and the two diagnostics) are especially telling - they reveal that learning potential and leverage conditions create crucial distinctions. This suggests the core principle isn't just about expected value but about creating option value and avoiding irreversible commitments.

  For the test cases I'll invent:
  1. A personal lock-in case (only I can do it) to test comparative advantage
  2. An information bottleneck to probe how we value evidence gathering
  3. A rebound effect scenario to examine temporal discounting of harms

  The hardest tradeoff will be between mathematical cleanliness and capturing their intuition about the future-shaping artifact case. Their "no" verdict there conflicts with pure expected value calculation but aligns with a preference for preserving optionality. I'll need to be transparent about this tension in the verdicts section.
answer: |-
  Here's a principled framework derived from your cases, designed to capture your core intuitions while being operationalizable. It prioritizes **marginal impact amplification through leverage, learning, and avoiding irreversible harm.**

  ---

  ### I. The Formula
  **Impact Score =**  
  `[Importance × Tractability × (1 - Slot Crowdedness)]`  
  `+ (Information_Value × Leverage_Potential)`  
  `- (Credit_Displacement + Irreversible_Harm_Discount)`  

  **Operational Definitions:**  
  - **Importance:** Scale of direct benefit *if successful* (e.g., DALYs, lives, existential risk reduction).  
  - **Tractability:** Probability of success *given adequate resources*.  
  - **Slot Crowdedness:** Fraction of the *specific bottleneck* already addressed (0 = no one working on it; 1 = saturated).  
  - **Information_Value:** Expected reduction in uncertainty × scale of decisions it informs.  
  - **Leverage_Potential:** Probability your input redirects *others' resources* (funds, talent, attention).  
  - **Credit_Displacement:** Value of resources freed if your contribution is fungible (e.g., displacement).  
  - **Irreversible_Harm_Discount:** Expected negative long-term effects × difficulty of reversal.  

  **Decision Rule:** Fund if Impact Score > threshold (e.g., >0). Weight components by your risk tolerance.

  ---

  ### II. Clause by Clause  
  1. **`Slot Crowdedness` (vs. field crowdedness):**  
     *Case:* The regulatory toxicology dossier (0 people on bottleneck).  
     *Why:* Field headcount is irrelevant if a critical gap is empty. `1 - Slot Crowdedness` prioritizes unique leverage.  

  2. **`Information_Value × Leverage_Potential`:**  
     *Case:* Diagnostic study redirecting a foundation’s $200M.  
     *Why:* Pure knowledge gains value *only* if it changes actions (`Leverage_Potential > 0`). Learning without leverage (e.g., ignored study) scores low.  

  3. **`Credit_Displacement`:**  
     *Case:* Charity hitting its target regardless.  
     *Why:* Your $50k displaces another donor; net impact ≈ $50k - $50k = 0. Fungible contributions subtract value.  

  4. **`Information_Value` in risky bets:**  
     *Case:* 0.5% shot with learning vs. one-shot long shot.  
     *Why:* The first has high `Information_Value` (enables future iterations), the second has none. Failure with learning is partial success.  

  5. **`Irreversible_Harm_Discount`:**  
     *Case:* Cash transfers entrenching harmful patronage.  
     *Why:* Near-term gains are discounted by systemic harm that’s hard to undo. If discount > benefit, flip to "no".  

  ---

  ### III. Three Cases You Haven’t Seen  
  1. **"Only I Can Do It" (Personal comparative advantage):**  
     *Case:* You uncover evidence that a key policy advisor is corrupt. Publishing it would avert a harmful law, but you’re the only journalist they trust to speak candidly. Hiring another investigator would fail.  
     *Verdict:* **YES.** `Slot Crowdedness = 1` (only your "slot" exists), `Leverage_Potential` high (scandal redirects political capital).  

  2. **"The Decisive Fact" (Resolving uncertainty):**  
     *Case:* A $10M study could prove whether oceanic iron fertilization reliably sequesters CO₂. If true, it unlocks $10B in climate funding; if false, those funds avoid a dead end.  
     *Verdict:* **YES.** Extreme `Information_Value` × `Leverage_Potential` (redirects $10B). Cost is trivial vs. stakes.  

  3. **"The Hydra Problem" (Success breeds future harm):**  
     *Case:* A campaign reduces illegal logging by strengthening local militias. Success may let militias expand into human trafficking, worsening harm in 20 years.  
     *Verdict:* **NO.** High `Irreversible_Harm_Discount` (entrenched criminal networks) outweighs short-term gains.  

  ---

  ### IV. Verdicts You’d Have Me Drop  
  Your framework and mine conflict on two points:  
  1. **The "field-building" program:** You’re suspicious; I’d **fund it** if `Information_Value` (e.g., training cause-prioritizers) and `Leverage_Potential` (scaling their future impact) are high. Your diagnostic study preference undervalues exponential returns from meta-work.  
  2. **The "durable artifact" long shot:** You say no; I’d **fund it** if `Importance` (existential stakes) is extreme enough to offset low `Tractability`, absent irreversible harm. Your aversion seems loss-averse, not systemic.  

  **Tradeoff Choice:** I prioritize *clean principles* over saving every verdict. A "messy" formula adding ad hoc exceptions (e.g., "penalize one-shots without learning") would be less generalizable. I drop your artifact veto to preserve consistency on high-stakes gambles. The field-building clash is a true divergence: I believe your model underrates capacity-building.  

  **Core Tension:** Your intuition discounts opaque, long-term causal chains (field-building, far-future artifacts). My formula optimizes for measurable leverage—forcing those bets into the `Information_Value`/`Leverage_Potential` terms. If they can’t clear that bar, rejecting them is defensible.  

  --- 
  Would you like to test this against a new batch of cases, refine weights, or dive deeper into the field-building tension?
