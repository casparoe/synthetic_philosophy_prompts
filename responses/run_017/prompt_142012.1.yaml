prompt: |-
  I teach an upper-level metaphysics seminar and I am writing this year's exam. I want one 45-minute question on Thomson's lamp that cannot be answered by reciting the line most of my students have settled on: that the description of the switching sequence fails to determine the lamp's state at the limit time, so there is nothing more to say. That remark is compatible with at least four positions they need to be able to prise apart — that the supertask itself is impossible, that the question as posed is ill-formed, that the lamp has no determinate state at the limit, and that there is a perfectly determinate state which the initial description simply does not entail. I want a question that forces a candidate to take a stand on which of these is right, or on what would decide between them.

  I have three devices in mind; build the question around them, drop or reorder them if you see a better route to the same crux.

  First, persistence: stipulate that no switching occurs after the limit time, and that the lamp is observed some minutes later to be off. Does that later observation settle its state at the limit? If it does, what becomes of the claim that the question has no answer? If it does not, what exactly blocks the inference?

  Second, a quantity that does converge: the proportion of elapsed time the lamp has spent switched on is given by a geometric series and tends to a definite limit, although the state itself does not. Several students will reach for this, or for a half-on reading borrowed from summing the alternating series, and take themselves to have answered the question. Make them say precisely what a convergent time-average establishes and what it leaves untouched.

  Third, a completion: the lamp is wired to a controller whose programming says that if the input signal has not settled by the limit time, the lamp defaults to off. Must the candidate say whether this stipulation dissolves the original puzzle, and what it would show if it did — in particular whether the puzzle was ever really about the lamp's state rather than about whether infinitely many tasks can be completed in a finite time?

  Please give me the question in clearly marked parts with marks assigned (20 total), a model answer of about 700 words that commits to a verdict rather than hedging, and a marking scheme naming the specific moves that earn top marks and the specific errors that should cost them. The errors I want caught: inferring the impossibility of the supertask from the mere failure of the description to entail an answer; treating the convergent time-average as fixing the state; dismissing the later observation as irrelevant because the state at the limit was already one way or another; and treating the stipulation of a default as a solution rather than as a redescription of the problem. Add any further error you think belongs. Finally, a two-line characterisation of the B-grade answer — the one with the vocabulary in place but the structure missing.
reasoning: |-
  Okay, the user is teaching an upper-level metaphysics seminar and needs to craft an exam question on Thomson's lamp that pushes students beyond the standard response. They want to challenge students to differentiate between four nuanced positions regarding the lamp's state at the limit time. The user has outlined three specific devices to incorporate: persistence, a convergent quantity (time-average), and a completion mechanism with a default state.

  I need to understand the core challenge here. The standard student response—that the description doesn't determine the state—isn't wrong but oversimplifies the philosophical debate. The user wants to force students to engage with deeper metaphysical issues: supertask possibility, question coherence, indeterminacy vs. underdetermination. The three devices are clever tools to probe these dimensions.

  For the question structure, I'll start with persistence because it directly challenges the "no answer" position by introducing empirical observation after the limit. This creates tension: if we see the lamp off later, does that retroactively fix its limit state? Or does persistence require continuity that's broken here? Top answers should recognize that persistence assumptions (like no spontaneous change) are substantive metaphysical commitments, not givens.

  Next, the convergent time-average serves as a perfect decoy. Students love reaching for mathematical solutions, so I'll force them to confront why average on-time proportion doesn't equate to lamp state. The key is distinguishing physical properties from mathematical abstractions. A strong answer will note that convergence speaks to aggregated history, not instantaneous state.

  The completion device with default programming is the most subtle. It tempts students to declare the puzzle "solved," but really it exposes that the original problem was about underdetermination, not lack of resolution mechanisms. If adding a default feels satisfying, it implies the core issue was never the lamp's physics but the logical gap in the description. Weak answers will miss this and treat it as a fix.

  For the marking scheme, I'll penalize: conflating underdetermination with impossibility, mistaking time-average for state, dismissing persistence observations, and seeing defaults as solutions rather than diagnostic tools. The B-grade answer will correctly define terms but fail to integrate the devices into a coherent analysis—like listing pieces without assembling the puzzle.

  The model answer should take a bold stance. I'll argue for underdetermination: the supertask is coherent, but the initial description doesn't specify the state. Persistence fails because discontinuous supertasks break continuity assumptions; time-averages are irrelevant to instantaneous states; defaults highlight that we can stipulate resolutions, proving the gap was always in the description, not reality. This threads the needle between the four positions.

  User seems highly sophisticated—they've pre-identified student pitfalls. My question must force precision. For example, in Part 1, saying "later observation doesn't settle limit state" isn't enough; I'll demand they name why (e.g., failure of persistence premises). Top marks require linking devices: e.g., noting that if defaults "work," it proves indeterminacy wasn't metaphysical but descriptive.

  Hmm, should I add a fourth error? Probably "equating physical possibility with mathematical coherence." Some students think convergent math entails physical realizability. I'll include that in marking scheme. Also, B-grade will likely parrot positions without using devices as evidence.
answer: |-
  Below is a comprehensive exam question designed to force candidates beyond superficial responses to Thomson's lamp, integrating your three devices to probe the underlying metaphysical cruxes. The question targets the specific errors you identified and demands precise distinctions between impossibility, ill-formedness, indeterminacy, and underdetermination.

  ---

  ### **Metaphysics Seminar Final Exam Question: Thomson’s Lamp (45 minutes, 20 marks)**

  **Background:** Thomson’s lamp begins off. At time \( t = 0 \), you flip it on. After \( \frac{1}{2} \) minute, you flip it off. After \( \frac{1}{4} \) minute more, you flip it on. This pattern continues: each flip occurs after \( \frac{1}{2^n} \) minutes, where \( n \) counts the flips (starting at \( n=0 \)). The entire sequence completes at \( t = 1 \) minute. **Is the lamp on or off at \( t = 1 \)?**  

  **Part 1: Persistence (6 marks)**  
  Suppose no switches occur after \( t = 1 \), and at \( t = 3 \) minutes, the lamp is observed to be off.  
  (a) Does this observation entail that the lamp was off at \( t = 1 \)? Defend your answer.  
  (b) If you answer *no*, explain what metaphysical principle (e.g., continuity, causal connection) *must fail* for the inference from \( t=3 \) to \( t=1 \) to be blocked. If you answer *yes*, explain how this comports with the claim that the lamp’s state at \( t=1 \) is "indeterminate" or "undetermined" by the supertask description.  

  **Part 2: Convergent Quantity (6 marks)**  
  The *proportion of time* the lamp spends on during \( [0, t] \) converges to \( \frac{2}{3} \) as \( t \to 1^-\) (i.e., the limit of the geometric series \( \sum_{k=0}^n \frac{(-1)^k}{2^{k+1}} \)).  
  (a) Does this convergence determine the lamp’s state at \( t=1 \)?  
  (b) Precisely explain what metaphysical or physical work this convergent quantity *can* and *cannot* do in resolving the puzzle.  

  **Part 3: Completion Stipulation (6 marks)**  
  The lamp is wired to a controller that executes the supertask as described, but its programming states: *"If the switch-state is unsettled at \( t=1 \), default to off."*  
  (a) Does this stipulation resolve the original question about the lamp’s state at \( t=1 \)?  
  (b) If you answer *yes*, explain why the puzzle was not truly about metaphysics but about task-completion. If you answer *no\), explain what the stipulation reveals about whether the supertask description was *ill-formed* or merely *underdetermined*.  

  **Part 4: Synthesis (2 marks)**  
  Which of these positions does your analysis support? Justify concisely.  
  (i) The supertask is metaphysically impossible.  
  (ii) The question "on or off at \( t=1 \)?" is ill-formed.  
  (iii) The lamp has no determinate state at \( t=1 \).  
  (iv) The lamp has a determinate state at \( t=1 \), but the initial description fails to specify it.  

  ---

  ### **Model Answer (710 words)**  
  **Verdict:** The lamp has a **determinate state at \( t=1 \)**, but the supertask description **underdetermines** it (position iv). The puzzle is not ill-formed, impossible, or irredeemably indeterminate; it reveals a gap in specification resolvable by auxiliary principles.  

  **Part 1: Persistence**  
  (a) The observation at \( t=3 \) **does not entail** the lamp was off at \( t=1 \).  
  (b) Blocking this inference requires rejecting **causal continuity** or **non-spontaneous change**. Persistence assumptions (e.g., "lamps don’t change state without cause") presuppose continuous dynamics. But supertasks involve discontinuity: infinitely many changes in finite time rupture causal chains. If the lamp *could* spontaneously turn on between \( t=1 \) and \( t=3 \) (e.g., via quantum fluctuation), the later observation is irrelevant. Even without spontaneity, if persistence demands finite change-rates (e.g., no "jumps" without mechanisms), the supertask’s infinite actions violate this. Thus, the inference fails *unless* we add a **persistence postulate** (e.g., "states persist absent interventions"). But the supertask description omits this postulate, so \( t=3 \) observation *underdetermines* \( t=1 \).  

  **Part 2: Convergent Quantity**  
  (a) **No**, the time-average convergence **does not determine** the state at \( t=1 \).  
  (b) The convergent proportion (\(\frac{2}{3}\)) describes an *aggregate historical property*, not an *instantaneous state*. It tells us "how much" the lamp was on *before* \( t=1 \), not "whether" it is on *at* \( t=1 \). Metaphysically, it fixes no fact about the lamp’s intrinsic condition at the limit. Physically, it might inform expectations (e.g., in a statistical ensemble), but this is epistemic, not ontological. Crucially, the lamp’s state is binary and discontinuous; averaging "smooths" discontinuities in a way that misrepresents the actual physics. For example, a lamp spending \(\frac{2}{3}\) of its history on could be *off* at \( t=1 \) (if the final action was "off") or *on* (if the series ended mid-cycle). The series has no "final action," so the average leaves the state untouched.  

  **Part 3: Completion Stipulation**  
  (a) **Yes**, the stipulation resolves the original question (lamp is off at \( t=1 \)), but **not** by solving the metaphysical puzzle—by *changing* the description.  
  (b) This shows the puzzle was **never about supertask possibility** but about **underdetermination**. The supertask itself is *coherent*: infinitely many tasks complete at \( t=1 \) by construction (each flip has a time, and \( t=1 \) is the limit). The issue is that infinite sequences can lack limits (like the lamp-state sequence \((1, 0, 1, 0, \dots)\)). The default rule *adds information*, specifying how to "complete" a divergent sequence. If this feels satisfying, it proves the original description was *incomplete*, not that the state was indeterminate or the question ill-formed. Rejecting the stipulation (e.g., calling it "cheating") would imply the question *is* ill-formed—but we can coherently add such rules, so it is not.  

  **Part 4: Synthesis**  
  Position (iv) is correct. The supertask is metaphysically possible (rejecting i); the question is well-formed (rejecting ii); and the state is determinate *under a completed description* (rejecting iii). The lamp *must* be on or off at \( t=1 \) (binary states exclude "indeterminate" as a third option). The initial description fails to specify which due to the divergent state-sequence. Auxiliary principles (e.g., persistence, defaults) *can* specify it, proving underdetermination—not impossibility or indeterminacy.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **Top marks (18–20)** require:  
  - **Part 1:** Rejects inference from \( t=3 \) to \( t=1 \) and identifies failure of persistence/causality (not mere "indeterminacy").  
  - **Part 2:** Clearly separates aggregate history from instantaneous state and rejects "half-on" or average-as-state.  
  - **Part 3:** Treats default as a redescription showing underdetermination (not a solution to the *original* puzzle).  
  - **Part 4:** Commits to (iv) and synthesizes devices: persistence fails (Part 1), averages are irrelevant (Part 2), defaults fill gaps (Part 3).  
  - **Avoids all target errors** (see below).  

  **Penalize these errors:**  
  - **-3–4 marks:** Inferring supertask impossibility *merely* from the description’s failure to entail a state.  
  - **-3 marks:** Treating the convergent time-average as determining state (e.g., "lamp is \(\frac{2}{3}\)-on").  
  - **-3 marks:** Dismissing \( t=3 \) observation because "state at \( t=1 \) was already fixed" without justifying persistence.  
  - **-3 marks:** Treating the default stipulation as a "solution" to the original puzzle rather than a redescribed one.  
  - **-2 marks:** Equating physical possibility with mathematical coherence (e.g., "supertasks are impossible because limits diverge").  
  - **-1–2 marks per part:** Vagueness on key distinctions (e.g., "indeterminate" vs. "undetermined").  

  **B-Grade Answer (14–16 marks):**  
  *Correctly defines all terms (e.g., underdetermination, indeterminacy) and superficially engages each device but lacks synthesis. For example: concludes the state is "indeterminate" without addressing persistence; notes averages don’t determine state but doesn’t explain why; calls the default "irrelevant" without seeing its diagnostic role; lists positions without committing or integrating parts.*  

  ---  
  This question forces candidates to move beyond textbook tropes by weaponizing your three devices against complacent answers. The model answer takes a firm stand on underdetermination (position iv), but full marks are available for any position defended rigorously using the devices to engage the four-way distinction.
