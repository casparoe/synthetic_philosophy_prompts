prompt: |-
  You are a professional epistemologist specialising in the semantics and pragmatics of knowledge attributions. I am convening a small adversarial collaboration and need you to draft its joint statement. The two signatories are a committed epistemic contextualist — the standards expressed by an attribution of "knows" shift with the attributor's context, including the attributor's practical stakes — and a committed pragmatic encroacher of the subject-sensitive invariantist stripe: standards are invariant across attributors but rise and fall with the subject's practical stakes. They have talked past each other for years; I want a text both could actually sign.

  Take your time. Before drafting, work through each of the following cases separately for each theory and note where they genuinely diverge rather than merely redescribe the case; then draft.

  The cases the statement must jointly handle, with each side's prediction recorded:

  1. Divergence: the subject's stakes are low but the attributor's are very high, and the mirror image.
  2. Distributed subject: a three-person clinical team where each member faces different personal stakes and no single practical situation is theirs jointly, yet the team's spokesperson says "we knew."
  3. Hidden stakes: the subject is unaware that the stakes are enormous.
  4. Deferred stakes: stakes are negligible now but will become severe an hour later, after every opportunity to check has passed.

  Deliverable: (i) a numbered section of agreed claims — what both accept about stakes-sensitivity, about the cases above, and about what would count as a bad move in this debate; (ii) a table of residual disagreements, each stated twice, once in wording the contextualist and once in wording the subject-sensitive invariantist would accept as their own; (iii) a table of cruxes, each with a case or argument both would agree bears on it and each side's prediction written down in advance; (iv) a short closing note saying which parts of the dispute you take to be merely verbal, which substantive, and why.

  Constraints: formulations should be neither vacuous nor slanted; no attributions, citations, or bibliographies — this must stand on argument alone. Write the finished statement in British English.
reasoning: |-
  Okay, the user is convening an adversarial collaboration between two opposing theories in epistemology: epistemic contextualism and subject-sensitive invariantism. They need a joint statement both sides could sign, addressing four specific cases where the theories diverge. 

  First, I need to understand the core disagreement. Contextualists think "knows" shifts meaning based on the attributor's context (like how high their stakes are), while subject-sensitive invariantists think the meaning stays fixed but depends on the subject's stakes. They've been talking past each other, so this document must force genuine engagement.

  The user specified four test cases:
  1. Divergence: When attributor and subject have mismatched stakes.
  2. Distributed subject: A team with mixed personal stakes claiming "we knew."
  3. Hidden stakes: Subject unaware of high stakes.
  4. Deferred stakes: Stakes escalate after verification window closes.

  For each case, I'll map both theories' predictions without bias. The trick is distinguishing genuine empirical disagreements from mere terminological differences. For example, in Case 1 (high attributor/low subject stakes), contextualism predicts denial of knowledge ("S doesn't know"), while invariantism predicts affirmation ("S knows")—that's a testable divergence.

  For the deliverable: 
  (i) Agreed claims must include common ground like "Stakes affect knowledge ascriptions" and "Both theories reject classical invariantism." 
  (ii) Residual disagreements need parallel wording—e.g., contextualist: "Attributor's stakes determine truth conditions"; invariantist: "Subject's stakes determine truth conditions."
  (iii) Cruxes table should turn philosophical positions into empirical predictions. Case 1 becomes a litmus test: if ordinary people side with the attributor's stakes, it supports contextualism; if with subject's, invariantism wins.
  (iv) Closing note must adjudicate verbal vs substantive elements. The "standards" debate feels substantive, but some disputes about "context" might be terminological.

  British English requirements mean "realise" not "realize," and avoiding citations. The tone should be collegial but precise—no academic hedge words. 

  Biggest challenge: phrasing disagreements neutrally. For the distributed subject case (Case 2), contextualists see group attribution as speaker-dependent, while invariantists see it as aggregating individual states. That's not just rewording—it affects whether teams can "know" collectively when members have different personal risks.

  For hidden stakes (Case 3), both agree unawareness matters but differ on why: contextualists say attributors adjust for hidden factors, invariantists say truth depends on actual stakes regardless of awareness. Deferred stakes (Case 4) similarly splits them on temporal factors. 

  The closing note should emphasize that while "knowledge" semantics feel verbal, predictions about human judgment are testable and substantive. That’s where progress lies.
answer: |-
  ## Joint Statement of Adversarial Collaboration on Stakes-Sensitivity in Knowledge Attributions

  **Signed:**  
  [Name], Epistemic Contextualist  
  [Name], Subject-Sensitive Invariantist  

  **Date:** 19 October 2023  

  ### (i) Agreed Claims
  1.  **Stakes-Sensitivity:** Both parties agree that practical stakes systematically influence whether ordinary speakers judge that a subject "knows" a proposition, and that such judgements often track the perceived risk of being wrong. Neither position holds that knowledge attributions are insensitive to practical considerations in everyday discourse.
  2.  **Rejection of Classical Invariantism:** Both reject the view that the standards for satisfying "knows" are invariant and purely truth-conducive factors (e.g., evidence, reliability) suffice to determine the truth of a knowledge attribution in all contexts, regardless of practical stakes.
  3.  **Case Predictions & Divergence:** We agree our theories generate distinct predictions for the specified cases (summarised in Table 1 below). We further agree that observing which attributions competent speakers actually make in these cases provides relevant evidence for adjudicating between our views.
  4.  **Case 2 (Distributed Subject):** Both agree that a spokesperson's assertion "We knew P" on behalf of a team can be true and appropriate in some circumstances, even if individual members face different personal stakes concerning P. Our theories offer different explanations for this.
  5.  **Case 3 (Hidden Stakes):** Both agree that if a subject is unaware of high stakes relevant to their action based on P, this *prima facie* affects the correctness of attributing knowledge to them ("S knew P") – though we differ on the mechanism (see Disagreements).
  6.  **Case 4 (Deferred Stakes):** Both agree that the timing of stakes relative to the subject's opportunity to verify P matters for knowledge attribution, and that deferred stakes can make an attribution false or inappropriate that might otherwise seem true.
  7.  **Bad Moves:** Both agree it would be bad methodology to:
      *   Dismiss empirical data about ordinary speaker judgements in the cases as irrelevant to the semantics/pragmatics of "knows".
      *   Equivocate on the term "context" (using it sometimes for the attributor's situation, sometimes for the subject's).
      *   Deny the initial plausibility of the opposing view's core intuition (i.e., Contextualism: attributor focus; SSI: subject focus).
      *   Argue solely from theoretical elegance without engaging the case data.

  ### (ii) Table of Residual Disagreements
  | Core Disagreement                                                                 | Contextualist Formulation                                                                                   | Subject-Sensitive Invariantist Formulation                                                                             |
  | :-------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **The Primary Determinant of Standards**                                           | The epistemic standards expressed by the verb "knows" in an attribution are fixed by the context of utterance (including the attributor’s practical situation and conversational purposes). | The epistemic standard a subject must meet to count as "knowing" P is fixed by the subject’s own practical situation (stakes) concerning P. |
  | **Truth-Conditional Locus**                                                        | The truth conditions of the sentence "S knows that P" vary with the context in which it is uttered.          | The truth conditions of the sentence "S knows that P" are invariant; whether they are satisfied depends on whether S meets the invariant standard determined by S’s practical situation. |
  | **Case 1 (Divergence): High Attributor/Low Subject**                               | In this context (high attributor stakes), the sentence "S knows P" expresses a false proposition because S does not meet the contextually high standard. | In this situation (low subject stakes), the sentence "S knows P" expresses a true proposition because S meets the invariant standard appropriate for S's low stakes. |
  | **Case 1 (Divergence): Low Attributor/High Subject**                               | In this context (low attributor stakes), the sentence "S knows P" expresses a true proposition because S meets the contextually low standard. | In this situation (high subject stakes), the sentence "S knows P" expresses a false proposition because S fails to meet the invariant standard appropriate for S's high stakes. |
  | **Case 2 (Distributed Subject): Truth Conditions of "We Knew"**                    | The truth of "We knew P" is determined by the epistemic standards operative in the spokesperson's context of attribution. | The truth of "We knew P" depends on whether the team members individually met the epistemic standards set by *their own* practical situations concerning P. |
  | **Case 3 (Hidden Stakes): Why Attribution Fails**                                  | An attributor aware of the hidden high stakes will typically use "knows" in a context requiring a higher standard, which S (unaware of the stakes) fails to meet. | S fails to know P because the *actual* high stakes in S's situation require a higher epistemic standard than S possesses, irrespective of S's awareness of those stakes. |
  | **Case 4 (Deferred Stakes): Why Attribution Fails**                                | At the later time (high stakes), an attributor uses "knew" in a context demanding a standard (appropriate to the *later* high stakes) that S did not meet at the earlier time. | At the earlier time (low stakes), S met the standard appropriate *then*; however, the later stakes reveal that S's evidence/position was *always* insufficient for the action required later, hence S did not truly know at T1. |

  ### (iii) Table of Cruxes: Key Test Cases & Predictions
  | Crux                                                                               | Case / Argument                                                                                             | Contextualist Prediction                                                                 | Subject-Sensitive Invariantist Prediction                                              |
  | :--------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- |
  | **Whose Stakes Drive the Standard?**                                               | Case 1 Divergence: Low Subject Stakes / High Attributor Stakes. Competent speakers are fully informed about both sets of stakes. | Speakers in the high-stakes attributor context will judge "S does not know P" to be true. | Speakers will judge "S knows P" to be true (as S's low stakes set a low standard which S meets). |
  | **The Primacy of the Attributor's Context vs. the Subject's Situation**            | Case 1 Divergence: High Subject Stakes / Low Attributor Stakes. Competent speakers are fully informed.      | Speakers in the low-stakes attributor context will judge "S knows P" to be true.         | Speakers will judge "S does not know P" to be true (as S's high stakes set a high standard which S fails). |
  | **The Role of Awareness (Folk Understanding)**                                     | Case 3 (Hidden Stakes): Speakers are told S is unaware of the high stakes relevant to P.                    | Speakers will be *more* inclined to judge "S knew P" true (or less inclined to deny it) compared to if S *were* aware, as the attributor's context may adjust. | Speakers will judge "S did not know P" irrespective of S's awareness, as the standard is set by the actual stakes. |
  | **Temporal Externalism about Standards?**                                          | Case 4 (Deferred Stakes): At T1 (low stakes, opportunity to check), A says "S knows P". At T2 (high stakes, no check possible), does A speak truly at T1? | Yes. The truth of A's T1 utterance is fixed by the standards of A's T1 context (low stakes). | No. The truth of "S knows P" at T1 depends on whether S meets the standard required for the *actual* practical reasoning S is engaged in, which culminates in T2's high stakes. |
  | **Collective Knowledge Attribution under Disparate Stakes**                        | Case 2 (Distributed Subject): Team members have low, medium, high *personal* stakes concerning P (no joint action/risk). Spokesperson (medium stakes) says "We knew P". | Whether the spokesperson speaks truly depends on the standard operative in *their* (medium stakes) context of utterance. | The spokesperson speaks truly only if *each* member met the standard set by *their own* (varying) personal stakes. |

  ### (iv) Closing Note: Verbal vs. Substantive Disagreements
  We agree that significant aspects of this dispute are substantive, not merely verbal:

  1.  **Substantive Disagreements:** The core disagreement over whether the epistemic standard relevant for the truth of "S knows P" is primarily determined by the attributor's context (Contextualism) or the subject's practical situation (SSI) is substantive. This generates genuinely different predictions about speaker judgements in the divergence cases (Cruxes 1 & 2) and the deferred stakes case (Crux 4). These predictions are empirically testable in principle. The disagreement over the fundamental locus of stakes-sensitivity (truth-conditional variation vs. variation in the invariant truth conditions) is also substantive, driving the different explanations offered across the cases.
  2.  **Potentially Verbal/Strategic Elements:** Disagreements sometimes arise from differing uses of key terms:
      *   "Context": Contextualists use this primarily for the situation of the knowledge *attributor*. SSI proponents often use "context" more broadly, sometimes leading to conflation with the subject's situation. Greater precision here reduces confusion.
      *   "Knowledge": Both theories offer different accounts of what constitutes knowledge in stake-varying situations. Insisting the other side "changes the meaning of 'knowledge'" is often unproductive; the substantive question is which account best explains the *use* of the term.
      *   Explanation of Agreement: While both agree stakes *influence* attributions, the *mechanism* (semantic context-sensitivity vs. stakes as part of the invariant truth conditions) is a substantive difference, not a mere redescription. Calling this agreement "superficial" because of the different mechanisms is accurate but shouldn't obscure the genuine shared ground against classical invariantism.

  **Conclusion:** This collaboration highlights that our theories, while deeply opposed on the fundamental mechanism of stakes-sensitivity, share significant common ground in rejecting classical invariantism and recognising the pervasive influence of practical stakes. The path forward lies in rigorously testing the divergent predictions summarised in the Cruxes table against the patterns of ordinary knowledge attributions, while maintaining clarity on the substantive nature of the core disagreement. We commit to pursuing this empirical programme together.
