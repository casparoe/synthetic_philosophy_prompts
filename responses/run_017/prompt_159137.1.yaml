  We'll prioritize by expected damage (likelihood * seriousness). We'll assign High/Medium/Low for likelihood and damage, then compute a score (e.g., High=3, Medium=2, Low=1) and multiply, then rank by that. But note: damage_if_unanswered is about the effect on my argument if I don't answer, so high damage means it's critical to address.

