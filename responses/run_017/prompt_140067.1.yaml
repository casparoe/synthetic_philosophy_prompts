  - Before fusion: two distinct organisms 
  - After fusion: one organism (new entity, neither original survives)
  This fits Sam's coral view - single organism despite multiple nuclei.

  LLM case is tricky. Sam would likely reject it as an object because:
  - No physical continuity 
