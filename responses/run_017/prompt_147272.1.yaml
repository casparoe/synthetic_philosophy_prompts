prompt: |-
  I am in the second year of a PPE degree, and I am taking an option this term on the ethics and politics of corruption. Less relevantly to my supervisor but more relevantly to my week, I chair a small registered student charity. We raise around £30,000 a year, employ one part-time administrator, have two academic trustees, and run a single programme: each summer we send six to ten student volunteers to a partner school in northern Ghana for five-week placements. Every year the same family of decision comes up — what we may give, to whom, when, and out of which budget line — and every year we improvise it in a committee meeting and then write something evasive in the minutes. I would like a procedure we can actually run instead.

  Constraints on it. It has to be usable by a committee of students with no legal training and no budget for advice, in about twenty minutes, with only what we can get out of our local coordinator by email. Eight steps at most. It should work prospectively, before a payment is made, and also retrospectively, as a test of decisions we have already taken and cannot now undo. It should produce a record: one or two sentences suitable for the minutes, in a yes form and a no form. We are vaguely aware that UK law is stricter here than we had assumed — something about payments made to speed up a routine administrative act, and about the point being whether an organisation has adequate procedures rather than whether any particular payment was made — but I do not want the procedure to rest on the legal position, which none of us properly understands. Nor do I want it to collapse into whatever the local norm happens to be: the whole subject of the course is that when in Rome is not an answer, and neither, plainly, is treating every departure from an impartial, arm's-length, rule-governed bureaucracy as corruption.

  Where I have got to in my own notes — please use it, repair it, or replace it, and tell me which you have done and why — is this. The wrong-making feature is not the transfer but a substitution: a consideration that is a reason for the recipient only because of a personal relationship is allowed to do the work that should be done by considerations internal to the recipient's role. On that way of putting it the question splits in two. First, does the recipient occupy a role that carries role-indexed reasons at all — a local, contestable question about what the institution actually is. Secondly, if so, is the transfer there in order to make a relation-indexed reason outweigh those, which does not look local at all. Two further thoughts I would like the procedure to respect. Most of the instruments we would instinctively reach for — receipts, value thresholds, declarations of interest — catch one-off, transaction-shaped cases and are close to useless against the slow, ongoing accumulation of an obligation, so the procedure needs something separate for that. And there is a difference between what we may ask our coordinator and what we must not: asking him directly whether something would be regarded as a bribe puts him in an impossible position, and we should not do it.

  So please give me, in order: a two- or three-sentence statement of the account of corruption the procedure operationalises, including where you think legitimate cross-cultural variation actually lives; then the procedure itself, with the questions in order, what would count as a sufficient answer to each, what to do when we cannot get the answer, at least one gate at which it stops with a no, and at least one point at which it hands the decision to a person — our senior trustee, say — on the ground that it is a question of values rather than fact. Then run it on three cases from last year.

  One. Our coordinator tells us that it is customary for a visiting organisation to make a small cash payment, around £40, to mark the signing of the memorandum of understanding with the school; the head teacher has asked for it through him; he advises that refusing would cause serious offence and could put the partnership at risk. Our trustees would call this a bribe. Several of our volunteers think it is a courtesy and that we are being stiff-necked.

  Two. At the end of a placement the committee votes to buy, from charity funds, a phone worth about £120 for the family that hosted a volunteer for five weeks. Nothing was asked for. The volunteer says the family was kind and poor. One trustee points out that word will get about, and that families may compete to host whichever volunteer is most generous.

  Three. Over three years our coordinator has built a friendship with an official in the district education office. The official now returns his calls first and quietly tells him which paperwork will move and when; nothing has ever been asked for, and nothing has been given in return for any specific decision. Each December we send the official a hamper worth around £25 and pay his travel to a one-day workshop. Other organisations wait months for the same paperwork. The committee regards this as ordinary relationship-building of the kind any organisation does; I suspect my own procedure condemns it, and I would like to know whether it does, and whether that verdict is over-generating.

  At least one of these, I suspect, will come out in a way our committee will dislike. If so, say plainly which, and argue us into accepting it. Finally, be honest about what the procedure systematically cannot see — and please do not cite anything, since I will add references myself and my supervisor has said the exercise is about the argument rather than the literature.
reasoning: |-
  Hmm, this is a substantial and thoughtful query from a PPE student running a student charity focused on placements in Ghana. They're grappling with real-world ethical dilemmas around payments that sit in gray areas between cultural norms and corruption. Their current ad-hoc approach leaves them uncomfortable, especially given their academic focus on corruption ethics.

  The user has done impressive conceptual work already - they've identified that corruption involves substituting role-based reasons with relationship-based reasons. Their three test cases are spot-on for probing boundaries: a customary payment, a gift to hosts, and an ongoing relationship with an official. They're clearly wrestling with how to apply ethical principles cross-culturally without either cultural imperialism or moral relativism.

  Key challenges I need to address:
  - Creating a practical 8-step max procedure usable by students
  - Balancing UK legal concerns with on-ground realities in Ghana
  - Avoiding traps like over-reliance on receipts or thresholds
  - Handling slow-building obligations differently from one-off payments
  - Protecting their local coordinator from being put in compromising positions

  Their conceptual framework is strong but needs operationalizing. I'll keep their core insight about role substitution but build in practical tests. The procedure must:
  1) Distinguish roles clearly
  2) Assess whether payments distort role-based reasoning
  3) Handle both prospective and retrospective cases
  4) Produce minute-ready records
  5) Flag when to escalate to trustees

  For the test cases:
  - The MoU payment likely fails (it's role-subverting)
  - The phone gift passes if framed as thanks not incentive
  - The official relationship clearly fails (creates systematic advantage)

  I'll be explicit that the hardest sell will be condemning the coordinator's relationship with the official - but that's exactly where corruption patterns emerge. The procedure's blind spot will be subtle cultural capital exchanges that don't involve material transfers.

  The user's academic rigor shines through - they want the ethical argument, not just citations. I'll honor that by focusing on the reasoning chain while keeping it actionable for their committee.
answer: |-
  Here's a procedure based on your conceptual foundation, modified for practicality and clarity. I've **repaired and restructured** your core insight ("role-substitution") into a more operational sequence, added explicit gates, and incorporated your key constraints (retrospective/prospective use, coordinator safety, ongoing obligations, minute-taking).

  **Operational Definition of Corruption (for this procedure):**
  Corruption occurs when a transfer of resources (money, goods, favour) induces someone to prioritise a relationship-based reason over the impartial reasons inherent in their formal or societal role. Legitimate cross-cultural variation exists in *what constitutes a distinct "role" requiring impartiality* and in *socially expected reciprocity*, but not in the core wrong of subverting role-bound duties for personal or relational gain.

  ---

  **The "Role Integrity Test" Procedure (8 Steps):**

  1.  **Define the Recipient's Role:** *"What is the primary, publicly understood function or position of the person/organisation receiving this?"* (e.g., "Head Teacher", "Host Family", "District Education Official").
      *   *Sufficient Answer:* A clear, common-sense description of their job or societal function. If unclear, describe the context of the interaction.
      *   *Can't Answer/Unclear:* **Stop. Record:** "Unable to define recipient's role clearly. Decision deferred/requires trustee review." Escalate to Senior Trustee (Values Gate 1: Defining roles is inherently value-laden and context-specific).

  2.  **Identify the Role's Core Duty:** *"Based on that role, what is the key, impartial reason why they *should* do the thing this transfer relates to (or did do it, retrospectively)?"* (e.g., "Educate children", "Provide basic hospitality", "Process paperwork fairly based on rules").
      *   *Sufficient Answer:* A statement of the primary, non-relational obligation tied to the role.
      *   *Can't Answer/Unclear:* **Stop. Record:** "Unable to identify core impartial duty of recipient's role. Decision requires trustee review." Escalate to Senior Trustee (Values Gate 1 cont.).

  3.  **Is the Transfer Linked to Role Performance?** *"Is this transfer *explicitly* tied to them performing (or having performed) that core duty?"* (Yes/No)
      *   *Sufficient Answer:* Clear Yes or No based on the stated reason for the transfer. If vaguely linked (e.g., "for being helpful"), answer No.
      *   *Can't Answer:* Assume **No**.

  4.  **Is the Transfer Primarily Relational?** *"Is this transfer *primarily* motivated by, or likely to be perceived as, building goodwill, showing personal gratitude/appreciation, or fulfilling a social custom *directed at the individual/family*, rather than the role?"* (Yes/No)
      *   *Sufficient Answer:* Clear Yes or No based on the stated motivation and context.
      *   *Can't Answer:* Assume **Yes** (erring on caution for relational influence).

  5.  **Assess Potential for Obligation (Ongoing Focus):** *"Could this transfer (or a pattern of similar transfers) reasonably create a *sense of personal obligation* in the recipient, making them feel they *owe* future favours or preferential treatment to the person/organisation making the transfer?"* (Yes/No/Unclear)
      *   *Sufficient Answer:* Consider the nature/value of the transfer, cultural norms (ask coordinator *only* about general customs, *never* "Is this a bribe?" - e.g., "Is it common to give gifts of this nature/value to someone in this role purely as a custom, without expectation of return?"). Focus on the *potential* for creating obligation, not intent.
      *   *Can't Answer:* Assume **Yes**.
      *   *Unclear:* Assume **Yes**.

  6.  **The Substitution Test (Core Gate):** *"If we make this transfer, is there a serious risk that it will cause, or has caused, the recipient to prioritise a reason related to *us* (gratitude, obligation, relationship) over the impartial reason tied to their role (the core duty identified in Step 2) when performing their duties?"* (Yes/No)
      *   *Sufficient Answer:* Combine answers from Steps 3, 4 & 5. If Step 3=No AND (Step 4=Yes OR Step 5=Yes), then the risk (Yes) is high. If Step 3=Yes AND Step 4=No AND Step 5=No, risk is low (No). Consider context (e.g., value relative to local norms/income - coordinator can be asked about *typical* gift values in such situations).
      *   *Can't Answer:* Assume **Yes**.
      *   *Result = Yes:* **Stop. Record (No):** "Transfer rejected/identified as problematic: High risk of inducing role-substitution." DO NOT PROCEED.
      *   *Result = No:* Proceed to Step 7.

  7.  **Value & Transparency Check (Practical Safeguard):** *"Is the value modest relative to local norms and our budget, and can it be transparently recorded against a clear budget line (e.g., 'Hospitality Gifts', 'Customary Fees')?"* (Yes/No)
      *   *Sufficient Answer:* Yes if value is reasonable (coordinator can advise on *typical* amounts for *similar gestures* in the culture) and budgetable. No if excessive or would be hidden/mislabeled.
      *   *Can't Answer:* Assume **No**. **Stop. Record (No):** "Transfer rejected/identified as problematic: Value or transparency concerns." OR escalate to Senior Trustee if borderline.
      *   *Result = No:* **Stop. Record (No):** "Transfer rejected/identified as problematic: Value or transparency concerns."
      *   *Result = Yes:* Proceed to Step 8.

  8.  **Final Approval & Minute Record:** *Approve the transfer.*
      *   *Record (Yes):* "Transfer approved: [Brief description of transfer] to [Recipient Role] for [Stated Purpose]. Assessed as supporting/core to role duty [State Duty] without creating undue relational obligation."

  ---

  **Running the Cases (Applying Procedure Retrospectively):**

  **Case 1: £40 MoU Signing Payment to Head Teacher**
  1.  **Role:** Head Teacher (School Administrator).
  2.  **Core Duty:** Manage school resources impartially for education, uphold agreements based on merit/need.
  3.  **Linked to Duty?** No. Signing MoU *is* the duty; payment isn't for "better" education.
  4.  **Primarily Relational?** Yes. Framed as "custom/courtesy/avoiding offence".
  5.  **Creates Obligation?** Yes. Creates sense Head Teacher owes favourable treatment ("risk partnership" implies leverage).
  6.  **Substitution Test:** **YES.** High risk payment prioritises relationship (avoiding offence/maintaining access) over impartial execution of duty (signing MoU based on merit). **STOP. NO.**
      *   *Minutes (No):* "£40 payment to Head Teacher for MoU signing rejected/identified as problematic: High risk of inducing role-substitution (prioritising relationship over impartial duty)."
      *   **Argument for Committee:** This payment directly conditions the performance of a core administrative duty (signing an agreement) on a personal/customary payment. It risks making the *continuation* of the partnership (a core function for the Head) dependent on this relational transaction, not the school's needs or the MoU's merits. "Courtesy" paid to secure an official act is the textbook definition of a facilitating payment/bribe. Refusing might be awkward, but paying corrupts the very basis of the partnership.

  **Case 2: £120 Phone for Host Family**
  1.  **Role:** Host Family (Private citizens providing hospitality).
  2.  **Core Duty:** None. Hospitality is a voluntary, personal/familial act, not a formal role with impartial public duties.
  3.  **Linked to Duty?** N/A (No formal duty to link to).
  4.  **Primarily Relational?** Yes. Pure gratitude for kindness.
  5.  **Creates Obligation?** **Potentially Yes.** While no *formal* duty exists, the value (£120 is significant locally) and selectivity (only this family) could create expectations/competition among future potential hosts, distorting the *voluntary* nature of hosting towards seeking reward. ("Word will get about").
  6.  **Substitution Test:** **YES (Risk).** While there's no formal "role" duty to subvert, the gift risks substituting the *voluntary, communal* motivation for hosting with an expectation of material reward. This distorts the informal social practice.
  7.  **Value/Transparency:** Value is high relative to typical local gifts/host family support; budget line would be vague ("Gifts"?).
      *   *Minutes (No):* "£120 phone gift to host family rejected/identified as problematic: Risk of distorting voluntary hospitality norms and creating future expectations/competition. Value high."
      *   **Argument for Committee:** This isn't corruption in the classic public-official sense, but it fails the *spirit* of the test by risking the distortion of a social practice (voluntary hosting) through significant selective gifts. It could create a sense of obligation for preferential treatment (hosting the "best" volunteers) or pressure on future families. A smaller, symbolic token *or* a contribution benefiting the whole community (e.g., books for the school) would be less problematic.

  **Case 3: Hamper & Travel for District Official (Ongoing)**
  1.  **Role:** District Education Official (Government Officer).
  2.  **Core Duty:** Process paperwork impartially, fairly, and in due order according to rules.
  3.  **Linked to Duty?** No. Not payment *for* processing, just "relationship building".
  4.  **Primarily Relational?** Yes. Friendship, goodwill gestures.
  5.  **Creates Obligation?** **YES.** The *pattern* (3 years, annual gifts, preferential treatment *already received*) clearly creates a strong sense of mutual obligation. The official feels obliged to prioritise the coordinator; the charity feels obliged to continue the gifts.
  6.  **Substitution Test:** **YES.** The gifts demonstrably *have caused* the official to prioritise the relationship ("returns calls first", "tells him which paperwork moves") over the impartial core duty (processing fairly/in order). The ongoing nature amplifies this.
  7.  **Value/Transparency:** £25 hamper + travel is modest, but pattern matters. Transparency weak (likely hidden in "workshop costs" or "misc").
      *   *Minutes (No):* "Annual hamper and travel for District Official rejected/identified as problematic: Ongoing pattern creates obligation inducing role-substitution (preferential treatment over impartial processing)."
      *   **Argument for Committee:** This is the clearest failure and likely the hardest to accept. This *is* corruption: a sustained, mutually beneficial exchange where preferential access to a public service is granted in return for personal gifts/benefits. The "friendship" is the vehicle. The official *is* substituting their duty (fair queueing) for relational reasons (favouring a friend who gives gifts). Other organisations suffer. This is precisely what "adequate procedures" aim to prevent. Stop the gifts immediately. Build relationships professionally (e.g., official meetings, letters) without personal favours/gifts.

  ---

  **What the Procedure Systematically Cannot See:**

  1.  **Truly Impartial Reciprocity:** Small, genuinely reciprocal exchanges within established cultural norms *that do not relate to core role duties* might be flagged unnecessarily (e.g., bringing customary small gifts when *visiting* an official socially, unrelated to any pending request). The procedure is cautious by design.
  2.  **Coercion/Extortion:** If the recipient is *demanding* a payment under threat (true extortion), the procedure might get stuck at Step 6 (Substitution Test = Yes, correctly saying No) but doesn't explicitly identify the *coercive* element, which requires different handling (security, reporting).
  3.  **Subtle Non-Material Exchanges:** Favours, promises of future support, or access to information/non-material benefits that induce substitution are harder to capture unless explicitly framed as a "transfer".
  4.  **Perfectly Hidden Substitution:** If a payment *appears* perfectly aligned with role duties (e.g., an inflated invoice for a real service) and creates no *visible* obligation, it will pass. The procedure relies on observable facts and stated purposes.
  5.  **Deep Cultural Nuance in Role Definition:** While Step 1 allows trustee input, the procedure might oversimplify complex or hybrid roles where personal relationships are deeply embedded in functional duties in ways that are locally legitimate but conflict with ideal-typical "impartial role" concepts.

  This procedure gives you a clear, defensible, practically usable framework grounded in your core ethical concern (role substitution), prioritises caution where information is lacking, explicitly handles ongoing obligations, protects the coordinator, and generates auditable minute records. It will force difficult but necessary conversations. Good luck!
