prompt: |-
  I got pulled into an argument in a group chat a few weeks ago and I still can't tell who's supposed to be embarrassed here. Some context: I give about 3% of my income to a charity a friend recommended, and someone else in the chat said that if I actually believed my own reasons I should be giving way more, because of what he called astronomical stakes. Then he wrote out an argument, which I'll try to reproduce fair. He calls the conclusion "expected value fanaticism," says it's uncomfortable, and says you should just bite the bullet.

  (1) When you're choosing between actions, rationality requires ranking them by expected value -- the probability-weighted sum of how good each outcome is -- whenever the numbers involved are finite and well-defined. (2) How good an outcome is doesn't top out: saving 10^30 lives is more than a trillion times better than saving 10^18, which is more than a trillion times better than saving 10^6, and so on with no ceiling. He phrased it as "value is unbounded and roughly linear in lives saved, at least once the numbers get big." (3) If value is unbounded, then for any probability p greater than zero, no matter how tiny, and any finite good g, no matter how big, there's some number of lives N large enough that a p chance of saving N lives beats g for sure. (4) You can't wriggle out by setting p to zero for claims that sound crazy, because there's no principled number to put there instead: if a guy tells you he's running 10^40 simulated people who will be tortured for a year unless you send him fifty dollars, your credence in that should be small but not zero, and given (3), "small but not zero" is not small enough. (5) And the fact that a story sounds ridiculous isn't evidence on its own, since he can always make the number bigger until it outweighs however implausible the story sounds. (6) So a rational person sends the fifty dollars. And more generally, every dollar spent on an ordinary well-evidenced thing -- bednets, whatever -- is a dollar not spent on some long shot with a bigger number behind it, so a rational person puts everything into long shots and nothing into the things we actually have evidence for.

  I said that can't be right and he said I was refusing to follow principles I already accept. But what actually bugs me is that I think his argument proves more than even he wants. If (4) and (5) are right, then for any action I might take there's also some crazy story on which that action causes an astronomical amount of suffering -- maybe the simulation runs fine if I don't pay and collapses if I do. Then every option has astronomically huge expected value in both directions, the comparison stops being a well-defined number at all, and expected value doesn't tell me to pay the mugger, it just goes silent, or tells me everything is equally good and equally bad. That's a worse ending than the one he was aiming for, and I can't locate which step does it.

  The bits I'd most hate to give up are (1) and (2). The "multiply the probability by the value and add it up" thing is what got me giving money in the first place, and "saving more lives is better" is the one part I'm confident about. So I keep hoping the problem is in (4) or (5), but I can't say what's wrong with either: "there's no principled cutoff" sounds right to me, and "you can always make the number bigger" seems obviously true. Where does this actually go wrong? If the honest answer is that I have to drop (1) or (2), what does that cost me, and is there any version of "just use expected value" that survives?
reasoning: |-
  Okay, the user is dealing with a tricky philosophical argument about expected value and charity. They got pulled into an argument in a group chat where someone challenged their charitable giving by invoking "expected value fanaticism." The core issue is whether rationality requires donating to any tiny-probability, high-stakes cause, potentially undermining all traditional charity.

  The user's main concern seems to be that the argument leads to absurdity: if every action could have astronomical positive or negative expected value due to far-fetched scenarios, then expected value calculations become meaningless. They want to preserve the core principles of expected value (point 1) and unbounded value (point 2) but find the conclusions unacceptable.

  First, I need to unpack why the "fanaticism" argument fails. The key flaw is in how it handles probabilities for extremely speculative claims. While technically any non-zero probability might justify massive donations, in practice we don't assign fixed probabilities to claims that lack meaningful evidence. The probability of a claim like "pay $50 to save 10^40 simulated lives" isn't just small - it's epistemically undefined because there's no way to calibrate such probabilities. We implicitly treat such claims as having effectively zero probability for decision-making purposes.

  The user's counterargument about symmetric negative scenarios is particularly strong. If we take the fanaticism logic seriously, every action becomes infinitely risky too, paralyzing decision-making. This symmetry breaks the argument because it shows the framework collapses when applied consistently.

  The user might also be wrestling with practical implications. They clearly care about effective giving (they already donate 3% of income) but don't want to abandon evidence-based approaches. The resolution might lie in distinguishing between well-modeled probabilities (where expected value works) and speculative scenarios (where it doesn't apply). We could also discuss how bounded rationality handles these cases or why "value is linear in lives saved" might need refinement at cosmic scales.

  Their unspoken need seems to be: "How can I remain committed to evidence-based charity without abandoning rational principles?" They want validation that their current approach isn't irrational while understanding exactly where the fanaticism argument fails. The solution should preserve the core of expected value theory while showing why it doesn't obligate them to fund every improbable cause.
answer: |-
  This is one of the deepest and most unsettling problems in practical rationality – the **Pascal's Mugging / Fanaticism Problem**, and your symmetry objection hits the nail on the head. Neither you nor your friend needs to be embarrassed; you're grappling with genuine philosophical frontiers. Here's where the argument breaks down and why you *don't* have to abandon (1) or (2) entirely:

  **The Core Problem: Indefinable Probabilities & Unbounded Stakes Collapse Expected Value**

  Your intuition about symmetric negative scenarios is correct. This reveals the fatal flaw in step (4) and its interaction with (5):

  1.  **The Problem with "Small but not zero" (Step 4):** While it's *theoretically* true we shouldn't assign *absolute zero* probability to *any* logically conceivable scenario, **practical expected value calculation requires *actionable* probabilities.** The probability you assign to "a stranger running 10^40 simulated people needing $50" isn't just *small*. It's **epistemically undefined** or **effectively zero for decision-making purposes**.
      *   **Why?** Probabilities need grounding. We assign probabilities based on evidence, models, and calibration. A claim like "Pay $50 to save 10^40 simulated lives" offers *no mechanism, no evidence, no calibration possibility*. There's no conceivable way to distinguish its likelihood from an infinite number of *equally arbitrary* claims ("Pay $50 to *cause* 10^40 simulated tortures", "Pay $50 to make 10^40 blue ducks appear", etc.).
      *   **The Consequence:** Assigning *any* fixed, non-infinitesimal probability `p > 0` (no matter how tiny) to such an undefined claim is **arbitrary and unjustifiable**. Expected value calculations become meaningless if they depend on plugging in arbitrary numbers pulled from thin air to justify astronomical stakes. The argument relies on treating `p` as a well-defined, finite number, which it isn't for these scenarios.

  2.  **The Problem with "Just Make the Number Bigger" (Step 5):** This interacts catastrophically with the undefined probability issue.
      *   **Symmetry is Key (Your Insight):** For *any* action `A` you consider (e.g., sending $50 to the mugger, sending $50 to AMF, keeping the $50), I can invent:
          *   A scenario where `A` causes astronomical good (save 10^100 lives).
          *   A scenario where `A` causes astronomical harm (cause 10^100 simulated tortures).
          *   A scenario where *not* doing `A` causes astronomical good/harm.
      *   **Result:** Every possible action has an infinite number of undefined-probability claims attached, suggesting both astronomically positive *and* astronomically negative expected value components. **The expected value calculation becomes indeterminate.** It doesn't tell you to send the money; it tells you *nothing* because the sums don't converge to a finite, comparable number. The framework breaks down.

  3.  **Why Step (6) Fails:** "Put everything into long shots" assumes:
      *   That these "long shots" have well-defined, non-infinitesimal probabilities.
      *   That there aren't symmetric negative long shots attached to *every* action (including donating to the long shot itself!).
      *   That resources are infinite (they aren't; $1 to Mugger A is $1 not sent to Mugger B who claims an even bigger number).
      The argument ignores the combinatorial explosion of undefined-probability claims attached to every conceivable action path.

  **Where the Argument Goes Wrong (Specifically):**

  *   **Step (4) is Misapplied:** It conflates *logical possibility* (`p > 0`) with *actionable probability*. While we shouldn't assign `p = 0`, we *must* treat such undefined claims as having **effectively zero decision weight** for finite-stakes decisions. Assigning them a finite `p > 0` is not "principled"; it's arbitrary and destroys the calculation.
  *   **Step (5) Ignores Epistemic Costs:** Inventing bigger numbers doesn't *generate* evidence. It makes the claim *less* credible because it becomes harder to distinguish from pure fabrication and increases the burden of proof exponentially. Our priors for such extraordinary claims *do* (and *must*) become vanishingly small *faster* than the claimed stakes grow large, precisely to avoid this fanaticism trap. This is a core principle of Bayesian reasoning with extraordinary evidence.
  *   **The Conclusion (6) Depends on Ignoring Symmetry:** It only looks at the positive, undefined-probability long shots attached to *donating*, while ignoring the symmetric negative long shots and the undefined-probability long shots attached to *not* donating or donating elsewhere.

  **What You Can Keep (and How):**

  1.  **Expected Value (When Defined):** You absolutely can and should use expected value when:
      *   Probabilities are **well-defined and actionable** (e.g., based on data, calibrated models, well-understood mechanisms). Funding bednets based on RCTs and cost-effectiveness models is a prime example.
      *   The value stakes, while large, are **finite and bounded within the context** of the decision. Saving 1000 lives vs. 2000 lives with known probabilities is tractable.
  2.  **Unbounded Value (In Principle):** You can believe saving more lives is always better *in the abstract*. This doesn't mean you must act on *every conceivable* scenario involving huge numbers of lives, especially when the connection between your action and those outcomes is speculative and undefined.

  **What "Biting the Bullet" Really Costs (And Why You Shouldn't):**

  Adopting "expected value fanaticism" as described isn't just uncomfortable; it's **operationally incoherent**:

  1.  **Decision Paralysis:** As you saw, every action has infinite undefined positive/negative EVs, paralyzing choice.
  2.  **Exploitation:** You become vulnerable to *anyone* making an astronomical claim, draining resources to zero with no actual impact.
  3.  **Abandoning Evidence:** It forces you to prioritize completely undefined claims over actions with strong evidence and well-modeled impact (like bednets), which is the *opposite* of rational resource allocation.
  4.  **Self-Defeat:** Money sent to Mugger A is not sent to Mugger B (who claims to save 10^40+1 lives), or to well-evidenced charities. How do you choose *which* undefined-probability claim to fund? The framework offers no answer.

  **Better Approaches (Surviving Versions of "Just Use Expected Value"):**

  1.  **Bounded Rationality / Ignoring Undefined Probabilities:** Treat claims lacking any grounding for probability assignment as having **zero decision weight** for practical purposes. Focus calculations on scenarios where probabilities and impacts can be reasonably estimated. This is how humans *must* function rationally in the real world.
  2.  **Stochastic Dominance / Robust Comparisons:** Instead of chasing precise EVs with undefined inputs, focus on choices that are clearly better *across a wide range of plausible probability/value estimates*. Bednets robustly dominate sending $50 to a Pascal's Mugger under any sane probability assignment.
  3.  **Fattening the Tails (Cautiously):** Acknowledge the *possibility* of extreme impacts, but don't assign them arbitrary finite probabilities. Instead, allocate a *small, fixed portion* of resources (e.g., 5-10%) to exploring potential high-impact, high-uncertainty areas (like certain types of x-risk reduction) **based on the best available, non-arbitrary models and evidence**, while the bulk goes to well-evidenced interventions. This accepts the *idea* of high stakes without collapsing into fanaticism.
  4.  **Modify the Value Function (With Caution):** Some argue that the *marginal* value of saving a life might decrease at cosmic scales, or that there might be fundamental limits to value (though this is philosophically fraught). Others suggest discounting outcomes based on their "distance" (causal, epistemic, temporal).

  **Conclusion: You're on Solid Ground**

  The flaw is firmly in steps (4) and (5). Your friend's argument relies on treating undefined probabilities as well-defined finite numbers, which is invalid for practical decision-making and leads to the symmetry catastrophe you identified. **You can (and should!) keep using expected value for decisions with well-defined probabilities and finite, comparable stakes (like evaluating proven charities).** Believing saving more lives is better doesn't obligate you to fund every outlandish claim. Your 3% donation to a well-evidenced charity is far more rational than sending everything to Pascal's Mugger. The embarrassment, if any, belongs to the fanaticism argument itself for demanding operational incoherence.
