prompt: |-
  I write novels — the secondhand-bookstore kind, mysteries with a literary bent — and I have been having the same argument with my workshop and my readers for about three years now, about a character I can't seem to fix or drop. She's the one who gives everything away. The money, the promotion, the relationship, the kidney; she takes that pond argument literally and just never stops. I didn't set out to write a saint.

  The reactions split in a way I still find weird.

  Some readers: she is the best person in the book and the discomfort is the point, we're supposed to feel pricked. Others don't say unrealistic, they say drained — her life looks narrow and gray, they feel sorry for her, and they think whatever is impressive about her isn't the same thing as her life going well for her. Then there's a third group who cheerfully grant that she's morally flawless and say they wouldn't want to know her and feel nothing like admiration; to them it reads as a failure of character rather than an excess of it.

  What drives me up the wall is that these three get traded back and forth as if they were one argument, and nobody moves an inch. My hypothesis, which I'd like you to shoot down if it's wrong, is that the question everyone thinks they're arguing about is really three questions in one coat: how much morality actually demands, what makes a life go well for the person living it, and what we're even doing when we say we admire someone, if that's one attitude and not several with different objects. Or maybe it's verbal and everybody is using good person to mean something different.

  But here's the bit that makes me distrust my own intuitions and everyone else's. In a novel I control the camera. If I put the reader inside the cost — the missed trains, the calls not returned, the daily grind of it — and never show them the people who are better off because of her, they come back saying her life is sad and thin. If I show the beneficiaries, even in glimpses, they come back saying she's admirable and they feel ashamed. Same character, same behavior. I can flip the verdict by moving the point of view. Which makes me think a chunk of whatever is being treated as data in this argument isn't a judgment about moral sainthood at all, it's an artifact of how the example gets framed — and if the standard examples have a built-in framing asymmetry, the debate might be leaning on contaminated evidence.

  So why has this stalled? I've been pointed at the essay that kicked it off in the early eighties and at the literature on how demanding morality is allowed to be, and as far as I can tell everyone has read everyone and the positions haven't moved in forty years. Diagnose it, using what each side actually claims: verbal or substantive, a bedrock clash about what a good life is, a hidden empirical question nobody has bothered to check (would a real person who gave all that up actually end up depleted, or fine?), several questions under one heading, or a mix where different parts stall for different reasons. Tell me which pieces are seperable — could one get settled without the others — and be straight about what would count as progress here and whether anything realistically will.

  Two housekeeping things. Please keep clear which claims are settled among people who actually work on this and which are still a live fight; don't hand me one side's position wearing a consensus costume. And American English, please. Also, where you're guessing about my character rather than about the argument, say so — my workshop already has alot of opinions about her.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a novelist struggling with a character who's overly self-sacrificing, and they're getting conflicting feedback from readers. The main issue is that the reactions are split into three groups, each interpreting the character differently, and the discussions around her seem stuck. 

  First, I need to understand why the arguments aren't moving. The user suspects that people are actually talking about three different questions under the guise of one. Let me verify that. The three reader groups focus on morality's demands, the quality of life, and the nature of admiration. That makes sense because these are distinct philosophical areas. 

  Next, the user mentions that changing the narrative perspective shifts reader reactions. When the camera shows the cost, readers see her life as sad; when it shows beneficiaries, they feel admiration. This suggests framing affects perception, which ties into psychological concepts like salience and cognitive biases. People might not be evaluating the character objectively but reacting to what's emphasized in the story.

  Now, why has the debate stalled? The user points out that positions in moral philosophy haven't budged in decades. That's true—supererogation debates are perennial. But why? Each side has foundational disagreements. Consequentialists see maximizing good as obligatory, while others view it as beyond duty. These are bedrock values, hard to shift without changing core beliefs. 

  The user also wonders if there's a hidden empirical question: would such a person feel depleted? Current psychological research suggests chronic givers often experience burnout, but it's nuanced. Factors like autonomy, community support, and personal fulfillment play roles. However, empirical data might not resolve the moral debate because values differ. 

  Separating the questions could help. Clarifying terms like "good person" might reduce talking past each other. But even if everyone agreed on definitions, the substantive disagreements about life's requirements might remain. Progress could mean mapping disagreements instead of resolving them, or exploring narrative techniques to present both costs and benefits together.

  The user's deeper need might be to resolve the character's purpose in their story. They need to know whether to adjust the character, the narrative framing, or accept divided reader reactions. Understanding the philosophical stalemate can inform their creative choices, even if the debate itself remains unresolved.
answer: |-
  Here’s a diagnosis of the stalemate, breaking down the layers and why progress is unlikely—along with what *is* separable. Your hypothesis is largely correct, but the devil (and the gridlock) is in the details.

  ### 1. **The Three Questions Masquerading as One**
     - **"How much does morality demand?" (The Obligation Question)**  
       *Live Fight:* Philosophers are **not settled**. Consequentialists (e.g., utilitarians) argue morality *can* demand extreme sacrifice if it maximizes good. Deontologists (e.g., Kantians) say duties have limits; supererogation (going beyond duty) exists. Virtue ethicists focus on character, not rules.  
       *Stall Reason:* These are foundational ethical frameworks. No neutral ground exists to adjudicate them—it’s like arguing whether blue is "better" than green.
     
     - **"What makes a life go well?" (The Flourishing Question)**  
       *Live Fight:* **No consensus**. "Objective list" theorists (e.g., Nussbaum) say flourishing requires specific goods (health, relationships, achievement). Hedonists equate it with pleasure. Desire-fulfillment theorists tie it to personal goals. *Your character’s critics lean objective list (her life lacks key goods); admirers see moral achievement itself as fulfilling.*  
       *Stall Reason:* Subjective vs. objective elements of well-being resist reconciliation. Is a life "good" if the person finds meaning in sacrifice, even without relationships or comfort? Depends on your theory.

     - **"What is admiration?" (The Response Question)**  
       *Live Fight:* Psychologists & philosophers agree admiration isn’t monolithic. **Settled:** We can admire morally (Mother Teresa) or skillfully (Michelangelo). **Live Fight:** Does moral admiration imply *liking* or *endorsement as aspirational*? Your third group ("flawless but unlikeable") reveals a split: we can acknowledge virtue without warmth or emulation.  
       *Stall Reason:* Admiration blends emotion, judgment, and identity. Whether we *should* emulate saints is tangled with the first two questions.

  ### 2. **The Framing Effect: Your Camera Control Insight is Key**
     - **Why it distorts the debate:**  
       Human cognition is narrative-driven. Showing *costs* triggers loss aversion & empathy for the sacrificer. Showing *benefits* triggers reciprocity norms & guilt. **This isn't just about your character—it's how moral psychology works.**  
       *Contaminated Evidence:* Classic philosophical examples ("drowning child," "donating kidneys") *always* frame sacrifice as isolated heroic acts, obscuring cumulative costs. Your novel uniquely exposes this bias by toggling perspective.  
       - **Settled in psychology:** Framing effects powerfully shape moral judgments (Kahneman/Tversky).  
       - **Live Fight:** Whether framing *should* influence judgments is philosophical, not empirical.

  ### 3. **Why the Positions Haven’t Moved in 40 Years**
     - **Bedrock Clashes:** The core questions (Obligation, Flourishing) tap into irreconcilable worldviews:  
       - Is morality fundamentally about *minimizing harm* (demands much) or *living honorably within constraints* (demands less)?  
       - Is a good life defined by *inner virtue* or *tangible well-being*?  
       *→ Compromise feels like betrayal of principles.*
     
     - **Hidden Empirical Questions (That Won’t Help Much):**  
       - *Would a real "moral saint" be depleted?* **Settled in psychology:** Chronic, uncompensated sacrifice correlates with burnout, resentment, and poor health—**but** meaning buffers this. Autonomy matters: *chosen* sacrifice feels better than coerced.  
       - *Problem:* Even if data showed saints are happy, critics would say they lack "true" flourishing (e.g., missing relationships). If data showed misery, admirers would claim their *moral* success outweighs it. **Data can’t resolve value conflicts.**

  ### 4. **Separable Pieces (and What Progress Looks Like)**
     - **Tractable:**  
       - **Verbal Confusion:** Clarifying terms *can* help. Distinguish:  
         - *Moral sainthood* (maximizing good) vs. *moral decency* (meeting obligations).  
         - *Admiration* (recognition of virtue) vs. *liking* (personal affinity) vs. *aspiration* (desire to emulate).  
         → *Progress:* Workshop readers might stop talking past each other if forced to specify which they mean.  
       - **Framing Awareness:** Acknowledging that camera focus manipulates judgment.  
         → *Progress:* Readers might critique *your narrative choices* rather than treating reactions as pure moral insights.

     - **Intractable:**  
       - **Obligation/Flourishing Trade-offs:** No settlement possible without adopting one ethical framework wholesale.  
       - **"Should We Be Saints?"** Depends entirely on your answers to the above.

  ### 5. **Realistic Outcomes for Your Novel**
     - **Accept Divided Readers:** This isn’t failure. Your character is a Rorschach test for moral intuitions. Lean into it: make the framing *intentionally* ambiguous to provoke all three reactions simultaneously.  
     - **Reframe Her Arc:** If you want cohesion, *show her confronting the tension*. Does she ever regret? Feel joy? Experience a beneficiary’s ingratitude? Let her voice the debate internally.  
     - **Your Character (Guessed):** She lacks *interior conflict*. Real saints wrestle with doubt; ascetics crave comfort. Her flatness (not her virtue) may drain readers. Show her fighting to *sustain* her choices, not just embodying them passively.

  ### Bottom Line
  The stalemate persists because it’s **multiple substantive clashes under one label**, amplified by **cognitive biases** your narrative exposes. Progress means **unbundling the questions** and **admitting framing’s power**—not resolving the ethics. In your novel, weaponize this: make the reader’s discomfort with *their own judgments* the point. That’s where literature outpaces philosophy.
