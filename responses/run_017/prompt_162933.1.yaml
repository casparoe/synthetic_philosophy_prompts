  Okay, the user is asking about a specific phenomenon they've observed in their work as a backend/infra engineer. They've described a situation where metrics gradually change in operational definition over time through legitimate, well-intentioned modifications, but the original labels, thresholds, and decision-making frameworks remain unchanged. This leads to metrics that still influence decisions despite no longer measuring what they originally did.

  The user has already ruled out several concepts: Goodhart's law (since there's no optimization pressure), Campbell's law (same reason), McNamara fallacy (not about privileging measurable over important), and concept drift in ML (about data changing, not measurement definitions). They also mentioned surrogate endpoints in medicine but feel it's not quite the same.

  I need to consider related concepts from philosophy of science, methodology, and measurement theory. The key elements here are: (1) operational definitions changing incrementally, (2) each change individually justified, (3) no malicious gaming, (4) labels/thresholds/authority remain fixed.

  From psychometrics, there's construct drift - where what a test measures shifts over time. That seems relevant but might focus more on conceptual changes rather than operational ones. In measurement theory, there's indicator decay - when an indicator loses validity over time due to systemic changes. This feels closer since it accounts for the measurement becoming decoupled from the underlying phenomenon.

  The medical concept of surrogate endpoint failure has parallels but focuses on predictive validity failing across contexts, whereas here the problem is gradual operational redefinition within the same context. In philosophy of science, there's the idea of operationalization decay - where the link between concept and measurement erodes.

  I think indicator decay fits best, though it's not a perfect match. The user's case is a special form where the decay happens through many small, justified changes rather than sudden shifts. The "zombie metrics" term they've been using is actually quite apt - metrics that are "dead" in terms of validity but still "walking" through dashboards and decisions.

  For the downstream effect where numbers retain authority after meaning changes, this relates to reification - treating the number as the thing itself. It's different from Goodhart, which requires optimization pressure.

  I'll explain all this to the user, emphasizing the distinctions and why indicator decay is the closest fit while acknowledging where it doesn't perfectly match. I'll also validate their observation that this is a distinct failure mode worth naming, and suggest that "zombie metric" is actually a good term for it.
answer: |-
  Here's my thinking on your phenomenon, step by step. I'll try on several established concepts for size, explain where they rub against the grain of your case, and then offer a precise carving of what you're describing. I'll also address the authority question separately.

  First, your phenomenon has three core components: (1) The operational definition of a metric shifts incrementally over time through a series of locally rational, non-malicious changes; (2) The *label*, reporting context, thresholds, and decision-making authority attached to the metric remain frozen; (3) This creates a growing but unrecognized disconnect where the metric retains influence despite no longer measuring the original underlying reality of interest. Crucially, there's no active optimization pressure corrupting the measure—just accumulated definitional drift under a static facade.

  Now, testing candidate concepts:

  1.  **Construct Drift (Psychometrics):** This comes closest. In test theory, it refers to the meaning of a psychological construct (like "intelligence" or "anxiety") subtly changing over time or across contexts, making longitudinal comparisons invalid. *Why it fits:* Your metric's operational definition ("checkout latency," "incident") drifts, altering the underlying construct being measured. *Where it diverges:* Psychometric construct drift often focuses on conceptual ambiguity or cultural shifts influencing interpretation. Your case is more concrete: deliberate, documented *operational* changes to data collection/calculation (span endpoints, alert resolution logic) while the label stays fixed. It's engineering drift, not conceptual drift.

  2.  **Indicator Decay / Degradation (Social Science/Monitoring):** This describes how a social or economic indicator (e.g., unemployment rate) can lose validity over time due to systemic changes not reflected in the metric. *Why it fits:* Captures the passive erosion of meaning through environmental change (like your tooling migration altering incident counts). *Where it diverges:* Often implies external changes making the *original* measure obsolete. Your case involves *internal, deliberate* changes *to the measurement process itself* (service splitting, counting rules). The drift is engineered, not environmental.

  3.  **Surrogate Endpoint Failure (Medicine):** You mentioned this. A surrogate (like tumor size) predicts a clinical outcome (like survival) in one context but fails when treatment context changes. *Why it fits:* Your metrics are surrogates (latency for user frustration, incidents for on-call pain). Changes in system architecture/tooling are like changing the "treatment context," making the surrogate invalid. *Where it diverges:* Medical surrogates usually fail when applied to *new* interventions/trials. Your failure happens *within* the same ongoing system. The surrogate's operational definition itself changes incrementally, not just its predictive power in a new static context.

  4.  **Operationalization Decay (Philosophy of Science):** A less formalized idea, referring to the gradual erosion of the link between a theoretical concept and its operational definition. *Why it fits:* Directly addresses the core issue: the gap widens between the concept ("user-perceived latency") and its operationalization (the p95 calculation). *Where it diverges:* Philosophy often focuses on the *epistemic* challenge of defining concepts. Your case is a *pragmatic* failure of institutional memory and metric governance—the operationalization changes while everyone pretends it hasn't.

  **The Carving:** None of these are a perfect fit. They capture aspects but miss the specific combination: **incremental, justified, operational redefinition under a fixed label/threshold/authority structure, without optimization pressure.** This is a distinct failure mode of *metric governance* in complex, evolving systems.

  **Proposed Term & Definition:** **Operational Definition Drift (ODD)**.

  *   **What has to be true for ODD to occur?**
      1.  A **metric** exists with a defined operational procedure (how it's calculated, what data sources are used).
      2.  The metric has **institutional authority** (used for decisions, alerts, reports, SLOs).
      3.  The operational procedure undergoes **multiple incremental modifications** over time.
      4.  Each modification is **locally justified and rational** (not malicious gaming).
      5.  The **label, thresholds, and authority context** remain unchanged.
      6.  The **cumulative effect** of the modifications meaningfully alters the underlying phenomenon being measured relative to the original intent.
      7.  This cumulative alteration is **not systematically recognized or accounted for** in the metric's continued use.

  *   **Boundary with Ordinary Redefinition:** The difference is *transparency and intentionality*. Ordinary practice explicitly acknowledges a redefinition ("We changed how we calculate latency; here's the new method and adjusted thresholds"). ODD occurs when redefinitions happen piecemeal, documented only locally (like changelogs), without proactively reassessing the *ongoing validity of the metric's purpose and thresholds* in the aggregate. The authority structure sleeps through the redefinition.

  **On the Downstream Authority Question:** You're describing **Metric Reification Persistence**. Reification is treating an abstract concept (or here, a number) as a concrete, immutable thing. The persistence is the lag where the number retains its authority solely due to inertia, historical precedent, and embedded reporting, long after its connection to the underlying reality has decayed. This is distinct from Goodhart. Goodhart involves the measure *becoming* the target and being actively distorted. Reification persistence is passive: the number is mistaken *for* the reality itself, so its changing meaning goes unnoticed. The resemblance to Goodhart is superficial—both involve invalid metrics wielding influence, but the *mechanism* (active optimization vs. passive definitional drift + institutional inertia) is fundamentally different.

  **Conclusion:** "Operational Definition Drift" (ODD) best captures your core phenomenon—the silent erosion of a metric's meaning through justified operational changes under fixed labels/thresholds. "Zombie metric" is an excellent, evocative term for the *result*: a metric that's "dead" (no longer validly measuring its intended target) but still "walking" (exercising authority). The authority persistence is "Metric Reification Persistence." This *is* distinct from Goodhart/Campbell (no optimization pressure), McNamara (not prioritizing measurable over important), and concept drift (data changes, not measurement definition). It's a specific pathology of measurement in evolving socio-technical systems where governance of metrics fails to keep pace with operational change. The failure is in the system's inability to force a periodic, holistic reassessment of "does this number *still* mean what we all act like it means?" after N incremental changes.
