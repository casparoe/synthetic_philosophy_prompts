prompt: |-
  You're a professional philosopher who specializes in experimental philosophy and the philosophy of action. Please think carefully and take your time: brainstorm two or three candidate diagnoses of the argument below before you commit to one, and be explicit about what each one costs.

  I'm in a third-year seminar on experimental philosophy and we did the side-effect effect last week. I built an argument to try to show that nothing can be learned about intentional action from the way ordinary people use the word, and my TA said it "proves too much" but wouldn't tell me where. I can't find the exit. Here it is, with the case written out so we're using the same version.

  Case A (harm): A company chairman is told by the vice-president that a new profit-making program will also harm the environment. The chairman says he doesn't care about the environment at all, he only cares about profit. They run the program; the environment is harmed. Most people asked whether he harmed the environment intentionally say yes.

  Case B (help): Same, except the vice-president says the program will help the environment, the chairman gives the same I-don't-care reply, and the environment is helped. Most people say no, he didn't help it intentionally.

  My argument:

  (1) Everything the subjects are told is held fixed across the two cases except the valence of the side effect: the agent's knowledge, his aim, his indifference, and the causal structure are the same. Yet intentionality attributions flip.
  (2) When attributions of a predicate flip across cases that differ only in a moral respect, moral considerations are part of that predicate's application conditions. Call such a predicate moralized.
  (3) So does intentionally is moralized.
  (4) Call a predicate upstream-independent if competent speakers can settle whether it applies without settling whether the agent is blameworthy, so that a finding that it applies can count as a reason for a blame verdict rather than a mere restatement of one. If a predicate is moralized, it can't be upstream-independent: the moral verdict is doing the work, so the question did she do it intentionally has no answer prior to the question is she to blame.
  (5) But does intentionally obviously is upstream-independent. Juries get the mental-element question as a seperate question from the verdict. And sentences like she pushed the door intentionally and there was nothing wrong with that, or he did it deliberately but he was entirely justified, are perfectly ordinary: there the intentionality finding isn't even evidence of blame.
  (6) So the chain has to break somewhere.

  The bit my TA called over-generation: the same shape of argument doesn't stop at intentionality. Here's a third case I made up myself.

  Case C (convention): The vice-president says the program will also cause the office coffee machine to be left switched on all night, which is against a silly and widely ignored building rule. The chairman says he doesn't care about the coffee machine at all, he only cares about profit. The machine is left on. Suppose — I'm stipulating this for the sake of argument, I havent run it — that people say yes, he left it on intentionally, just as readily as in case A.

  (7) If so, what's driving the asymmetry isn't moral valence but norm violation generally, and case C involves no moral failing at all.
  (8) But then intentionality attributions come apart from blameworthiness in exactly the kind of case the moralized-concept story was supposed to explain, and I get the opposite conclusion from (3).

  And the general version: run (1)-(4) on any folk predicate with a valence effect — knows, caused, decided, could have done otherwise — and either every folk concept collapses into a moral verdict, which can't be right, or (4) is where the mistake is.

  What I want from you:

  - Name the step you'd reject, and explain why it looked fine — what made it plausible enough to write down.
  - Price the alternatives. For each other step you could reject instead, say what I'd have to accept if I give it up. In particular: if I reject (2) rather than (4), what do I have to say about case C? Can the influence-to-content move survive a case where the influencing factor is a mere convention?
  - There's a slide I half-suspect between (1) and (3): the data are all about side effects, but the examples in (5) are about what the agent was aiming at. Is that the real problem — a scope shift from side effects to intentional action in general — or is it a red herring?
  - Finally: is there any reading of moralized on which (3) and (5) are both true, so that moral considerations are genuinely part of the concept and yet the predicate still does work upstream of blame? If so, say exactly what the part of has to amount to — necessary condition, defeasible condition, something about what counts as evidence, something about which cases speakers treat as central. My notes gesture at a distinction between content and evidence and I don't think I understand it.

  I'd most like to keep (1) and (5). I'll give up anything else, but I want to know what I'm paying.
reasoning: |-
  Okay, let me approach this systematically. The student presents a sophisticated argument about intentionality attributions in the Knobe effect, and I need to diagnose where it goes wrong while respecting their desire to preserve premises (1) and (5). 

  First, I'll mentally reconstruct their core dilemma: they show how moral valence flips intentionality judgments (harm vs help cases), conclude "intentionally" is moralized, but then demonstrate this leads to absurdity when applied to non-moral norm violations (coffee machine case) or other concepts. Their TA says it "proves too much," meaning the reasoning would implausibly moralize all judgment-sensitive concepts.

  Hmm... three candidate diagnoses come to mind. Let me brainstorm them before committing:

  Candidate 1: Reject premise (4)'s claim that moralized predicates can't be upstream-independent. This preserves the interesting finding about moral influence but avoids collapsing intentionality into blame. Cost: I'd need to explain how moral factors contribute to concept application without predetermining blame. The student's own "distinction between content and evidence" note might help here - perhaps moral considerations evidentially inform judgments without being constitutive.

  Candidate 2: Reject premise (2)'s inference from asymmetric judgments to moralized concepts. But this seems costly - their coffee machine case shows norm violations (even non-moral ones) trigger similar asymmetries. If I take this route, I must argue that convention-violations are "moral-ish" or that the asymmetry stems from something else entirely, like perceived action-structure differences.

  Candidate 3: Question the scope shift noted in their "slide" concern. Premise (5) treats intentional action generally, but the data only concerns side effects. Cost: this limits the Knobe effect's implications but feels like dodging their broader challenge about moralization of concepts.

  *weighing costs*... Candidate 1 seems most promising. Preserves (1)/(5), explains why blame can outrun intentionality (their "he was justified" example), and handles the coffee machine case: conventional norms can influence judgments similarly to moral ones because both involve normativity, not because intentionality reduces to blame. The upstream-independence survives because we're not making moral verdicts but sensitivity to normative structures - which feeds into multiple downstream judgments (blame, praise, etc.).

  For the "proves too much" worry: we can distinguish concepts where norm-sensitivity is core (like intentionality) from those where it's derivative. "Knew" might show Knobe effects because knowledge attributions track normative expectations, not because epistemology collapses into ethics. That's a feature, not a bug - folk concepts might be richly normative without being reducible to moral verdicts.

  Finally, for their last request: yes, "moralized" can mean moral factors are defeasible criteria or prototype features rather than necessary conditions. The coffee machine case actually supports this - it shows non-moral norms work similarly, suggesting the concept tracks norm-violations broadly. When we say "he did it intentionally but justifiably," the moral consideration shifts from determining intentionality to being weighed separately in blame assessment.
answer: |-
  ### Diagnosis and Step-by-Step Analysis  
  Your argument is sophisticated but contains a critical flaw at **premise (4)**. I'll defend this rejection, price alternatives, address your scope-shift concern, and propose a reconciliatory reading of "moralized."  

  #### **Rejected Step: Premise (4)**  
  **Why (4) is flawed**:  
  Premise (4) claims: *If a predicate is moralized, it can't be upstream-independent*. This assumes that moral influence on a concept *entails* that the concept collapses into blameworthiness, making it incapable of providing independent input to blame judgments. But **moralization need not imply upstream collapse**. The influence of moral/normative factors on intentionality attributions could be *evidential* or *prototypical* without making intentionality *synonymous* with blame.  

  **Why (4) looked plausible**:  
  - It mirrors worries about circularity in folk psychology (e.g., if "intentional" depends on blame, it can't inform blame).  
  - It resonates with the intuition that normative judgments shouldn't "smuggle in" moral conclusions under descriptive guise.  

  **Cost of rejecting (4)**: You must accept that:  
  - Moral/normative factors *partially constitute* the application conditions of "intentionally" in certain contexts (e.g., side effects), but this doesn't reduce intentionality to blame.  
  - "Did she do it intentionally?" can still be answered *prior to* "Is she to blame?" because moral factors inform the *structure* of the action (e.g., whether a side effect is integrated into the agent's practical reasoning) rather than directly dictating blame.  

  ---  
  #### **Pricing the Alternatives**  
  *(Rejecting other steps and their costs)*  

  1. **Reject Premise (2)**:  
     - **Why**: You could argue that asymmetric judgments don't *necessarily* imply moralized concepts. The valence effect might stem from non-semantic factors (e.g., pragmatic inferences, affect heuristics).  
     - **Cost**:  
       - You must explain **Case C (coffee machine)** without invoking norm-violation as a conceptual driver. For example: "Left the machine on" might be seen as an *active omission* (triggering "intentional") whereas "helped the environment" is passive, making valence effects artifacts of action framing.  
       - **Survival of influence-to-content?** If you reject (2), the move from influence to content *fails* for conventional cases. This forces you into a disunified account: moral valence affects "intentionally" via one mechanism (e.g., blame-salience), while conventional violations affect it via another (e.g., perceived control). This is messy and less parsimonious.  

  2. **Reject Premise (3)**:  
     - **Why**: You could deny that "intentionally" is moralized, arguing instead that valence effects reflect *performance errors* (e.g., subjects misapplying the concept due to emotion).  
     - **Cost**:  
       - You must explain **Cases A, B, and C** as systematic errors, contradicting the robustness of Knobe-effect replications (including your Case C stipulation).  
       - You lose the core insight of experimental philosophy: that folk judgments reveal conceptual structure.  

  3. **Reject Scope Generality (Your "Slide" Concern)**:  
     - **Why**: Premise (5) appeals to *all* intentional actions, but your data only covers *side effects*. Rejecting the generalization blocks (6)'s contradiction.  
     - **Cost**:  
       - You must bifurcate the concept: "intentionally" might mean one thing for *side effects* (moralized) and another for *primary goals* (non-moralized). This complicates the semantics and ignores evidence that valence effects arise in non-side-effect cases (e.g., decisions under risk).  
       - **Verdict**: This is a **red herring**. The Knobe effect persists even when side effects are foregrounded as "means" (e.g., Uttich & Lombrozo 2010), suggesting a unified concept.  

  ---  
  #### **Reconciling (3) and (5): A Deflationary Reading of "Moralized"**  
  Yes, you can keep both (3) ("intentionally" is moralized) and (5) (it's upstream-independent) if you reject premise (4)'s all-or-nothing view. **Moral considerations are part of the concept as *defeasible criteria* or *prototype features*, not necessary conditions**:  
  - **How it works**:  
    - Norm violations (moral *or* conventional) make an outcome **salient as part of the agent's practical reasoning**. In Cases A and C, the chairman's indifference to a *foreseen norm violation* signals that he treated the outcome as *acceptable collateral damage*, integrating it into his action plan. This satisfies a **prototype condition** for intentionality (e.g., "acting in disregard of known consequences").  
    - In Case B (helping), no norm is violated, so the outcome isn't integrated into the action plan—it's merely foreseen.  
  - **Why this preserves upstream-independence**:  
    - The question "Did she do it intentionally?" tracks whether the outcome was *embedded in her agency* (e.g., via recklessness or endorsement), not whether she's blameworthy. Blame requires *additional* steps (e.g., assessing justification, as in your "he was entirely justified" example).  
    - **Case C as confirmation**: People call the coffee machine act "intentional" because violating a convention (even silly) makes the outcome agentially salient. But they might still deny *blame* ("Who cares about the coffee rule?").  

  ---  
  #### **The "Proves Too Much" Problem Solved**  
  Your TA worries that your argument moralizes *all* valence-sensitive predicates (e.g., "knew," "caused"). But **premise (4) is the culprit**:  
  - If moralization doesn’t entail upstream collapse (per above), then "knew" can be moralized (e.g., people more readily attribute knowledge to agents in harmful vs. helpful side effects) without reducing epistemology to ethics.  
  - **Key distinction**: For "intentionally," norm-sensitivity is **conceptually central** (it marks agential structure). For "knew" or "caused," it might be **performance-based** (e.g., motivated cognition). Experimental work supports this: Knobe effects are stronger for "intentionally" than for "caused" or "decided" (e.g., Guglielmo & Malle 2017).  

  ---  
  #### **Minimal Cost Strategy**  
  - **Keep (1) and (5)**, as desired.  
  - **Reject (4)**: Accept that moral/normative factors inform intentionality *without* collapsing it into blame.  
  - **Pay the price**: You must refine your theory of "moralized" (adopt a defeasible/prototype view) and explain why some predicates (like "intentionally") are robustly norm-sensitive while others are not.  
  - **Result**: The Knobe effect reveals that intentionality attributions track *normative salience in practical reasoning*—a feature of folk concepts, not a flaw.  

  ##### References for Context:  
  - Uttich & Lombrozo (2010) on intentionality as a non-moral "skill concept."  
  - Guglielmo & Malle (2017) on differential Knobe effects across predicates.  
  - Knobe (2010) on moral considerations as part of (not reducible to) folk concepts.
