prompt: |-
  I have recently been co-opted onto the Medals Committee of a learned society, and I find the exercise more interesting than I expected, so I should like your help with a case that comes before us next month. Our remit, as the statutes have it, is to reward "distinguished conduct beyond the call of ordinary obligation". What turns on our decision is small: a medal is struck, and a name is read out at the anniversary dinner. That is all.

  The trouble is that our precedents will not settle the new case, and I want to know what principle we should take ourselves to be applying before we walk into the room. Here is the run of decisions I have been able to reconstruct from the minutes, with the grounds recorded in them:

  1. A man who found a wallet containing £380 in cash, went somewhat out of his way, and returned it intact. No medal: "ordinary decency".
  2. An off-duty consultant physician who gave emergency CPR to a stranger collapsing in a railway station, successfully. No medal: "any competent bystander with her training would have done the same, and the cost to her was negligible".
  3. A woman who made an anonymous, non-directed kidney donation to a stranger. Medal awarded.
  4. A man who gave roughly a third of his income to famine relief for fifteen years. Medal awarded on a split vote; the dissent minuted that "if that is genuinely what beneficence requires, we do not strike medals for doing one's duty".
  5. An off-duty firefighter who entered a burning house and carried out a neighbour's child. No medal: "his training and equipment made this what his occupation prepares him for". Dissent: he was off duty and under no obligation to intervene.
  6. A finance officer who leaked evidence of systematic fraud to the regulator, was dismissed, and never worked in the sector again; the fraud was in any case uncovered by a routine audit nine months later. Medal awarded. One member is recorded as having argued explicitly that the point of the award was to encourage others in that position, and not merely to mark what he deserved.
  7. A young woman who, after her parents died, cared full-time for four years for her severely disabled younger brother, giving up a university place. She said she did it because there was nobody else and she could not have lived with herself otherwise. No medal: "she describes herself as having had no alternative".
  8. A soldier who threw himself on a live grenade to shield others and was killed. Posthumous medal, unanimous, though one member observed that the services have their own gallantry awards.

  The new case: because of a gap in the regulatory framework, Dr Ruth Adeyemi was, at the material time, the only person in the country both licensed and competent to certify the cold-chain protocol for a vaccine. Without certification the vaccine could not be distributed, and the Ministry's own estimate was that the resulting delay would cost some two thousand children's lives over the following two years. A specialist from abroad could in principle have been brought in, but not for fourteen months. She did the work unpaid over nine months — some seven hundred hours — and in order to do it she had to relinquish a research fellowship abroad that she had already been awarded. Her own account is that someone had to do it and that she could not have lived with herself otherwise. She has since declined all publicity and asked not to be named in any announcement.

  I am less interested in being told what we should morally conclude about Dr Adeyemi than in the structure of the problem. Please do the following: set out the two or three rules that fit the whole run of our precedents about equally well, and say what each of them predicts here; give me your best guess as to what the Committee will in fact do, with the reasons for preferring that guess; identify which of the earlier cases is the closest analogue and how much weight it carries; tell me what we should decide if we want to be consistent with ourselves, and state plainly which principle we should be committing ourselves to under each of the two or three available answers; and then name the one further hypothetical case that would best discriminate between the surviving rules — that last item is the part I care about most, since I mean to put it to the Committee as a test.

  Two features of the case seem to me to be doing the work, and I should like you to deal with them explicitly. First, whether her being the only person able to do it converts what would otherwise have been beyond duty into a duty, so that there is nothing left to honour. Secondly, whether the "could not have lived with myself" line disqualifies her by parity with the carer in case 7, or whether it is simply what modest people say and should be ignored. I should also like you to consider whether our practice is best understood as tracking desert at all, rather than as an incentive mechanism or as the management of a scarce currency whose value depends on our saying no most of the time; those readings come apart here, and I suspect they come apart in ways we have so far been able to ignore.

  One request: I have read the standard literature on supererogation — from Urmson's "Saints and Heroes" onwards, through the shallow-pond argument, to the work on moral options and agent-centred prerogatives — so please do not give me a reading list, a literature survey or any citations. I want the argument in my own terms, and I will supply the references myself if I ever write this up.
reasoning: |-
  Hmm, the user has presented a fascinating ethical dilemma about awarding medals for "distinguished conduct beyond the call of ordinary obligation" in a learned society. They've provided eight precedent cases with outcomes, and now need to evaluate Dr. Adeyemi's case. What's particularly interesting is they want structural analysis rather than moral conclusions - focusing on rule extraction, prediction, analogy, consistency, and discrimination tests.

  First, I need to identify patterns in the precedents. Case 1 (wallet return) and Case 2 (CPR) were denied for being "ordinary decency" despite some effort. Case 3 (kidney donation) and Case 4 (long-term donations) got medals for significant personal sacrifice. Case 5 (off-duty firefighter) was denied despite risk - the "training/occupation" argument prevailed. Case 6 (whistleblower) got a medal emphasizing incentive value. Case 7 (family carer) was denied due to "no alternative" perception, and Case 8 (soldier) got a posthumous medal as the ultimate sacrifice.

  The user has highlighted two key tensions: (1) Does unique capability create obligation? (2) Does "couldn't live with myself" disqualify like in Case 7? There's also the deeper question of whether the committee tracks desert, incentives, or scarcity.

  For rule extraction, I see three plausible principles emerging from the cases. Sacrifice Principle focuses on cost-benefit ratio - high sacrifice for high impact gets rewarded. Role-Relativity Principle considers whether the act falls within professional expectations. Voluntariness Principle examines whether alternatives existed.

  Applying these to Dr. Adeyemi: Sacrifice Principle strongly supports her case (700 unpaid hours + career sacrifice). Role-Relativity might oppose since she's uniquely qualified. Voluntariness is ambiguous - her statement mirrors Case 7 but the circumstances differ.

  For prediction, I suspect the committee will award the medal due to the scale of impact (2000 lives) and sacrifice, while distinguishing from Case 7 by emphasizing her professional uniqueness wasn't role-based. Case 6 (whistleblower) is the closest analogue - both involved career sacrifice for public good when systems failed.

  The discrimination test case would pit Sacrifice against Role-Relativity: Imagine a uniquely qualified surgeon who cancels vacation to perform emergency surgery saving lives. This isolates whether unique capability negates desert.

  Ultimately, the committee needs to decide if their mission is to reward costly moral heroism (favoring Sacrifice Principle) or only truly discretionary acts (favoring Voluntariness). The discrimination case should reveal their deeper priorities.
answer: |-
  Below is a structural analysis of your Committee's precedents, applied to Dr. Adeyemi's case, organized per your requests. I address your two highlighted features explicitly and consider the competing interpretations of the medal's purpose (desert, incentive, scarcity management).

  ---

  ### **I. Three Rules Fitting the Precedents**
  *(Equally consistent with past decisions, but diverging on Dr. Adeyemi)*

  1. **The Sacrifice-to-Impact Ratio Rule**  
     - **Definition**: Medal-worthy acts require **disproportionate personal sacrifice** relative to the **gravity of harm averted**, where the act is not mandated by role or easy alternatives.  
     - **Precedent Alignment**:  
       - *Fits*: Case 3 (kidney donation: high sacrifice, high impact), Case 4 (income donation: sustained sacrifice), Case 6 (whistleblower: career sacrifice for systemic integrity), Case 8 (life sacrifice).  
       - *Excludes*: Case 1 (low sacrifice), Case 2 (low sacrifice + role competence), Case 5 (role competence), Case 7 ("no alternative" implies no perceived sacrifice).  
     - **Prediction for Dr. Adeyemi**: **Medal awarded**. Sacrifice (700 unpaid hours + lost fellowship) is extreme; impact (2,000 lives) is monumental; no role obligation (she wasn't employed for this).  

  2. **The Role-Independent Voluntariness Rule**  
     - **Definition**: Medal requires **genuine discretion**—the agent must have had a feasible alternative to act *without moral failing*, and their choice must transcend role-based expectations.  
     - **Precedent Alignment**:  
       - *Fits*: Case 3 (kidney donation: no duty to donate), Case 6 (whistleblower: no legal duty to leak), Case 8 (soldier: heroism beyond duty).  
       - *Excludes*: Case 2 (physician: competence implies role-adjacent duty), Case 5 (firefighter: training implies role-adjacent duty), Case 7 (carer: "no alternative" negates discretion).  
     - **Prediction for Dr. Adeyemi**: **No medal**. Unique capability created a "duty of necessity" (no feasible alternative without failing morally). Her statement ("could not have lived with myself") mirrors Case 7.  

  3. **The Social Catalysis Rule**  
     - **Definition**: Medal rewards acts that **model under-supplied virtues** needing encouragement, especially where systemic failures exist.  
     - **Precedent Alignment**:  
       - *Fits*: Case 6 (explicitly cited "encouragement"), Case 3 (rare altruism), Case 8 (symbolic inspiration).  
       - *Excludes*: Case 1 (routine honesty needs no catalysis), Case 2 (routine for professionals), Case 5 (role-obligated).  
     - **Prediction for Dr. Adeyemi**: **Medal awarded**. Her act exposes regulatory gaps and models civic duty; refusal of publicity amplifies symbolic value.  

  ---

  ### **II. Prediction for the Committee's Actual Decision**
  - **Likely Outcome**: **Medal awarded, 5-3 vote**.  
  - **Reasons**:  
    - *Sacrifice/Impact Dominance*: The scale of sacrifice (career opportunity) and impact (2,000 lives) will outweigh "duty of necessity" objections, distinguishing it from Case 7.  
    - *Precedent 6 as Anchor*: Like the whistleblower, Adeyemi filled an institutional void at personal cost.  
    - *"Couldn't live with myself" Discounted*: Committees often interpret such statements as modesty (cf. soldiers who say "just doing my job"). Case 7’s refusal was likely due to familial obligation framing; here, no such tie exists.  
    - *Scarcity Management Pressure*: Denying medals for acts of this magnitude risks devaluing the award.  

  ---

  ### **III. Closest Analogue and Weight**
  - **Closest Case**: **Case 6 (Whistleblower)**.  
    - **Similarities**: Both acted due to systemic failure; both suffered career loss; impact was significant but not solely dependent on them (audit would have uncovered fraud/vaccine delay might have been mitigated).  
    - **Differences**: Adeyemi’s sacrifice was quantifiable (time/opportunity), while the whistleblower’s was open-ended (blacklisting).  
    - **Weight**: High. Case 6 established that institutional sacrifice for public good is medal-worthy even when alternatives exist. It directly counters "duty of necessity" arguments.  

  ---

  ### **IV. Consistent Decision & Principle Commitment**
  - **For Consistency**: **Award the medal**, committing to the **Sacrifice-to-Impact Ratio Rule**.  
    - *Why Consistent*: Precedents 3, 4, 6, and 8 all reward high sacrifice for high stakes, irrespective of "unique capability" (Case 3’s donor was also uniquely positioned to save a life).  
    - *Principle Articulated*: "The medal recognizes acts where the agent incurs exceptional personal cost to avert grave harm, beyond what society may reasonably expect from their role or status."  

  - **If Denying**: Commit to the **Role-Independent Voluntariness Rule**.  
    - *Principle Articulated*: "The medal requires genuine moral discretion; it is withheld where the agent’s unique capacity or conscience negates feasible alternatives to acting."  

  ---

  ### **V. Discriminatory Hypothetical Case**  
  **The Antarctic Researcher**:  
  > *Dr. Chen, the only virologist at an isolated Antarctic base, must cancel her sabbatical to analyze a deadly outbreak. If she refuses, the next-closest expert arrives in 10 months (estimated deaths: 150). She works 500 unpaid hours, losing a prestigious fellowship. She says: "I was the only one who could do it."*  

  - **Why it Discriminates**:  
    - **Sacrifice-to-Impact Rule**: Awards medal (high cost/high stakes).  
    - **Voluntariness Rule**: Denies medal (unique capability = duty).  
    - **Social Catalysis Rule**: Uncertain (rare scenario, low replication value).  
  - **Tests the Key Tension**: Forces the Committee to decide whether *unique capacity* nullifies desert by converting act into duty (as in Case 7) or whether sacrifice/impact transcends this (as in Case 6).  

  ---

  ### **VI. Explicit Treatment of Your Two Features**  
  1. **Unique Capability as Duty-Creating**:  
     - *Yes under Voluntariness Rule*: If only *one* person can prevent catastrophe, acting becomes obligatory (Adeyemi ≈ Case 7).  
     - *No under Sacrifice Rule*: Obligation is role-defined; unique capability outside a role is fortuitous, not duty-imposing (Adeyemi ≈ Case 3).  

  2. **"Couldn’t Live With Myself" Statements**:  
     - *Disqualifying Only if Sincere Constraint*: In Case 7, the statement implied *internal* coercion (psychological inability to choose otherwise). For Adeyemi/soldier (Case 8), it’s likely *modesty* or *moral clarity*—not incapacity. Committees routinely ignore self-effacement (e.g., awarding medals to reluctant heroes).  

  ---

  ### **VII. Medal’s Purpose: Desert, Incentive, or Scarcity?**  
  - **Desert vs. Incentive**: Precedents split. Case 6 explicit about incentive; Cases 3/8 emphasize desert. Adeyemi’s anonymity weakens incentive case but strengthens desert (no reputational gain).  
  - **Scarcity Management**: Denials in Cases 1/2/5/7 preserve exclusivity. Awarding Adeyemi fits if her sacrifice is deemed rarer than, e.g., Case 4’s donations.  
  - **Resolution**: Your Committee implicitly uses **scarcity-as-proxy-for-desert**. Acts are "beyond duty" only if few would undertake them *despite capacity* (excluding Cases 2/5 where many could/would act). Adeyemi’s uniqueness doesn’t diminish scarcity—it heightens it.  

  ---  
  **Recommendation**: To stay consistent, award the medal under the **Sacrifice-to-Impact Principle**. The Antarctic hypothetical will force clarity on whether unique capability erases desert. If the Committee balks at that case, they likely endorse the Voluntariness Rule—and should then deny Adeyemi.
