prompt: |-
  I need a specification rather than a position paper. A hospital ethics committee is rewriting its policy on the determination of death, and the policy has to govern two decisions: when life-sustaining treatment may be withdrawn, and when organ procurement may begin. Before I look at the candidate criteria, I want to know what we should be asking of one.

  Write the desiderata: what any adequate account of death has to deliver, with the case or consideration behind each. My starting list, which I would rather you correct and extend than adopt, is: (i) keep apart the definition of death, the criterion by which we recognize it, and the bedside tests, and say which of the three a committee is entitled to revise; (ii) say whether irreversible means cannot be reversed by any means or will not be reversed because we have decided not to try, and whether a declaration made today could be falsified by a later technology that restores what was lost; (iii) handle cases where the criteria conflict, such as a body with a destroyed brain but sustained circulation, or a patient whose circulation is deliberately arrested and later restored, by giving priority rules or by explaining why there is no fact of the matter; (iv) rule on patients in whom loss of the capacity for consciousness and loss of integration of the organism as a whole come apart, as in the permanently vegetative patient and the anencephalic infant; (v) say whether an organism whose integration is maintained by an external controller rather than by its own brain is alive or is maintained tissue; (vi) either respect the rule that procurement may not cause the donor's death or show why that rule should be given up; (vii) yield a determinate time of death, since the law needs one, even if the underlying biology is a process; (viii) be administrable at the bedside by clinicians using imperfect tests under time pressure, and defensible to families.

  For each requirement, state the consideration behind it and whether it is non-negotiable or a preference of one camp. Flag any pair you expect to be jointly unsatisfiable — that is the part I most want to see. Name the single requirement that does the most work in excluding candidate accounts. Then, briefly, score whole-brain, brainstem, higher-brain, and circulatory-respiratory criteria against the list.
reasoning: |-
  Okay, the user is working on a hospital ethics committee policy for determining death, specifically when to withdraw life-sustaining treatment and when organ procurement can begin. They need a set of desiderata—essential requirements—for any definition of death. Their initial list is detailed, but they want it corrected and expanded, not just adopted.

  First, I need to understand their scenario. They're rewriting a policy that governs two critical decisions: withdrawing treatment and organ procurement. This is high-stakes because errors could lead to legal issues or loss of trust. The user is likely a committee member, possibly a clinician, ethicist, or administrator, who needs a robust framework. Their explicit request is for desiderata, but deeper needs include clarity on conflicts, practical applicability, and legal defensibility.

  Looking at their starting list:
  - They want separation of definition, criterion, and tests, with clarity on what's revisable.
  - They're concerned about "irreversible" meaning—whether it's absolute or contextual.
  - Conflict resolution between criteria (e.g., brain destruction vs. sustained circulation).
  - Cases where consciousness and organismal integration diverge, like PVS or anencephaly.
  - The role of external controllers in maintaining integration.
  - Adherence to the dead donor rule or justification to abandon it.
  - Need for a precise time of death despite biological processes.
  - Practicality for clinicians and families.

  I need to refine this. Adding:
  - **Conceptual coherence**: Ensuring the definition aligns with biological reality to avoid arbitrary lines. This is non-negotiable but often debated.
  - **Legal alignment**: Must fit existing laws to prevent liability. Non-negotiable.
  - **Moral significance**: Why death matters—tying to loss of personhood or organismal unity. This underpins withdrawal and procurement ethics.
  - **Intervention invariance**: Death determination shouldn't change based on medical choices. Crucial for consistency.

  For conflicts, I'll highlight tensions, especially between universality and practicality. For example, higher-brain criteria might conflict with organismal integration in PVS cases. The dead donor rule is a big one—if abandoned, it could open doors but risk public trust.

  Scoring criteria:
  - **Whole-brain**: Fails on practicality and some integration cases (like locked-in syndrome).
  - **Brainstem**: Better for consciousness but struggles with integration if lower functions persist.
  - **Higher-brain**: Aligns with personhood but clashes with organismal integration in PVS.
  - **Circulatory-respiratory**: Simple but fails in brain-dead bodies on life support.

  The key tension is defining death's essence: is it loss of consciousness or loss of bodily unity? This drives most conflicts, like PVS handling. The dead donor rule exclusion is critical—it forces a stance on whether procurement can cause death.

  The user might also need help navigating committee disagreements, so flagging philosophical divides (e.g., consciousness vs. integration) is vital. They'll want a framework that's defensible to families, which leans toward circulatory criteria for simplicity but may not satisfy all ethical concerns.

  In summary, expanding to ten desiderata covers gaps, with emphasis on coherence, legal fit, and moral weight. Highlighting the consciousness-integration divide and dead donor rule as pivotal will prepare them for debates. Scoring shows no criterion is perfect, so policy must prioritize based on these requirements.
answer: |-
  Here is a refined and expanded list of desiderata for an account of death, incorporating your points while adding critical elements, highlighting tensions, and analyzing candidate criteria. The goal is a policy that is biologically sound, ethically defensible, legally compliant, clinically practical, and societally acceptable.

  ### Desiderata for a Definition/Criterion of Death
  *(Non-negotiable = Core to concept; Preference = Camp-specific/Policy Choice)*

  1.  **Conceptual Coherence & Biological Basis:**
      *   **Requirement:** The definition must correspond to a fundamental biological reality – the cessation of the organism *as a whole*. Death is the irreversible loss of the integrated functioning of the organism.
      *   **Consideration:** Avoids arbitrariness; grounds the concept in biology, not just social convenience. Distinguishes a dead body from a living one, even if parts function.
      *   **Status:** **Non-negotiable.** (Foundation of the concept).

  2.  **Separation of Conceptual Layers:**
      *   **Requirement:** Clearly distinguish:
          *   **Definition:** The theoretical concept (e.g., "irreversible cessation of the organism as a whole").
          *   **Criterion:** The measurable biological standard satisfying the definition (e.g., irreversible cessation of all brain functions, irreversible cessation of circulatory/respiratory functions).
          *   **Tests:** The specific clinical procedures to determine if the criterion is met (e.g., apnea test, EEG, angiography).
      *   **Consideration:** Prevents conflation; clarifies what level the committee is revising (typically the *criterion* and *tests* based on medical advances, potentially refining the *definition* if compelling new biological understanding emerges). The *definition* is philosophical/biological; the *criterion* is medico-legal; the *tests* are clinical.
      *   **Status:** **Non-negotiable.** (Essential for clarity and revision).

  3.  **Clarity on "Irreversibility":**
      *   **Requirement:** Specify whether "irreversible" means:
          *   (a) Impossible to reverse *by any conceivable means now or in the future*.
          *   (b) Impossible to reverse *given current medical capabilities and the specific context of the patient's condition/treatment choices*.
      *   **Consideration:** Addresses technological possibility vs. practical futility. A declaration using (b) *could* be falsified by future tech, but is necessary for practical decision-making today. Policy must choose one interpretation consistently.
      *   **Status:** **Policy Choice (Preference)** with major implications. Choosing (a) leads to paralysis (can we ever be *certain* of future tech?). Choosing (b) is standard practice but requires careful ethical justification and clear policy language.

  4.  **Resolution of Conflict Cases:**
      *   **Requirement:** Provide clear guidance for scenarios where proposed criteria conflict:
          *   Brain destroyed, circulation artificially maintained (Is this a corpse or a living body?).
          *   Circulatory arrest induced for procedure (e.g., deep hypothermic circulatory arrest) and restored (Was the patient "dead" temporarily?).
          *   Cases where consciousness is irreversibly lost but brainstem functions persist (PVS), or vice-versa (rare brainstem lesions with intact cortex?).
      *   **Consideration:** Real-world cases exist; policy must prevent ambiguity in critical moments (withdrawal, procurement). Requires priority rules or an explanation of why one criterion definitively satisfies the definition.
      *   **Status:** **Non-negotiable.** (Essential for consistent application).

  5.  **Integration vs. Consciousness:**
      *   **Requirement:** Address cases where the loss of the capacity for consciousness and the loss of somatic integration come apart (e.g., Permanent Vegetative State - integration present, consciousness gone; Total Brain Failure - both gone; Anencephaly - consciousness impossible, some integration may be present).
      *   **Consideration:** This is the *core philosophical divide* between "higher-brain" and "whole-brain" formulations. Does death require loss of *personhood* (consciousness) or loss of *biological organismal unity* (integration)? Policy must choose which loss is definitive of death.
      *   **Status:** **Fundamental Preference** defining the chosen criterion. This is the single requirement that does the **MOST WORK** in excluding candidate accounts.

  6.  **Role of External Support:**
      *   **Requirement:** Determine if an organism whose integration is maintained *solely* by an external controller (e.g., ventilator, ECMO) without any intrinsic control (brain function) is alive or represents preserved tissues of a dead organism.
      *   **Consideration:** Directly impacts the status of brain-dead bodies on support. If integration via machine suffices for life, brain death criteria are invalid.
      *   **Status:** **Non-negotiable Consequence** of the chosen definition/criterion.

  7.  **The Dead Donor Rule (DDR):**
      *   **Requirement:** Either:
          *   (a) Ensure the criterion guarantees that organ procurement does *not* cause the death of the donor (DDR upheld).
          *   (b) Explicitly justify why the DDR should be abandoned or re-interpreted in this context.
      *   **Consideration:** Cornerstone of transplant ethics and public trust. Violating it without justification is widely seen as unethical homicide. However, some argue DDR interpretation depends on the definition of death.
      *   **Status:** **Non-negotiable for Policy Coherence.** The policy *must* take a clear stance aligned with its chosen criterion.

  8.  **Determinate Time of Death:**
      *   **Requirement:** Provide a method to assign a specific time when death occurred, even if the underlying biology is a process.
      *   **Consideration:** Legal requirements (death certificates, inheritance, criminal law), organ procurement timing, cessation of treatment authorization.
      *   **Status:** **Non-negotiable.** (Legal necessity).

  9.  **Clinical Practicability:**
      *   **Requirement:** The criterion must be determinable at the bedside with sufficient reliability using available tests, performed by clinicians under time constraints and resource limitations. Tests must have high sensitivity/specificity for the criterion.
      *   **Consideration:** Abstract definitions are useless if unworkable in real hospitals. Impacts safety and feasibility.
      *   **Status:** **Non-negotiable.** (Operational necessity).

  10. **Societal/Relational Defensibility:**
      *   **Requirement:** The concept and its application should be explainable and justifiable to families and the public, respecting diverse values while maintaining medical and ethical integrity.
      *   **Consideration:** Maintains trust, facilitates acceptance of decisions (especially withdrawal/procurement), and acknowledges the profound social meaning of death. Avoids perceptions of arbitrariness or expediency.
      *   **Status:** **Strong Preference** (Essential for trust and policy acceptance, but cannot override biological/ethical coherence).

  ### Key Tensions & Joint Unsatisfiability
  *   **Integration vs. Consciousness (Des. 5) & DDR (Des. 7):** A "higher-brain" criterion (death = loss of consciousness) satisfies Des. 5 for PVS/anencephaly but *violates* Des. 7 (DDR) if organs are procured from a PVS patient whose body is still biologically integrated (they would die *from* procurement). Conversely, a "whole-brain" criterion satisfies Des. 7 for brain-dead donors but struggles conceptually with Des. 5 for PVS patients (are they alive organisms?).
  *   **Absolute vs. Contextual Irreversibility (Des. 3) & Determinacy (Des. 8):** Insisting on absolute irreversibility (Des. 3a) makes Des. 8 (determinate time) impossible, as we can never know the absolute future. Contextual irreversibility (Des. 3b) allows Des. 8 but accepts the declaration could be wrong in principle.
  *   **Conceptual Coherence (Des. 1) & Clinical Practicability (Des. 9):** The most biologically coherent definition might lack clinically feasible tests (e.g., perfectly measuring "integration of the whole organism"). Compromises are often needed.

  ### The Most Excluding Requirement
  *   **Desideratum 5 (Integration vs. Consciousness)** does the most work in excluding candidate accounts. It forces the fundamental choice: Is death primarily about the loss of the *person* (consciousness/sentience) or the loss of the *biological organism* (somatic integration)? This choice directly eliminates entire categories of criteria.

  ### Scoring Candidate Criteria Against Desiderata
  *(✓ = Generally Satisfies, ✗ = Generally Fails, ~ = Partially Satisfies/Depends on Interpretation, ! = Major Challenge)*

  | Desideratum          | Whole-Brain (Irreversible Cessation of All Brain Functions) | Brainstem (Irreversible Cessation of Brainstem Functions) | Higher-Brain (Irreversible Loss of Capacity for Consciousness/Sentience) | Circulatory-Respiratory (Irreversible Cessation of Circulatory & Respiratory Functions) |
  | :------------------- | :---------------------------------------------------------- | :-------------------------------------------------------- | :---------------------------------------------------------------------- | :------------------------------------------------------------------------------------- |
  | **1. Coherence**     | ✓ (Focuses on integration)                                  | ~ (Focuses on consciousness/integration nexus)            | ✗ (Ignores somatic integration)                                         | ✓ (Focuses on somatic integration)                                                     |
  | **2. Separation**    | ✓                                                           | ✓                                                         | ✓                                                                       | ✓                                                                                      |
  | **3. Irreversibility**| ~ (Relies on Des. 3b)                                       | ~ (Relies on Des. 3b)                                     | ~ (Relies on Des. 3b)                                                   | ~ (Relies on Des. 3b)                                                                  |
  | **4. Conflict Cases**| ~ (Handles brain dead on vent; struggles if cortex active but brainstem dead) | ~ (Handles PVS; struggles with isolated cortex function) | ✗ (Fails on PVS/anencephaly - calls integrated bodies "dead")           | ✓ (Clear for primary arrests; conflict in controlled arrest/restoration)               |
  | **5. Int vs. Consc** | ✗ (PVS: Integrated but unconscious = alive?)                | ~ (PVS: Brainstem function may persist = alive?)          | ✗ (PVS: Integrated but unconscious = dead?)                             | ✓ (PVS: Integrated = alive)                                                            |
  | **6. External Ctrl** | ✓ (Brain dead on vent = dead)                               | ✓ (Brainstem dead on vent = dead)                         | ✓ (PVS on vent = dead?)                                                 | ✓ (Body with circulation = alive)                                                      |
  | **7. DDR**           | ✓ (Procurement after brain death doesn't cause death)       | ✓ (Ditto)                                                 | !✗ (Procurement from PVS *causes* death)                                | ✓ (Procurement after circulatory death doesn't cause death)                            |
  | **8. Determinate Time** | ✓ (Time of test fulfillment)                              | ✓ (Time of test fulfillment)                              | !~ (Time of cortical destruction? Often unclear)                        | ✓ (Time of arrest/cessation)                                                           |
  | **9. Practicability**| ✗ (Requires complex tests; prone to false positives in incomplete lesions) | ~ (Simpler tests than whole-brain; still complex)        | ✗ (No reliable bedside test for consciousness capacity)                 | ✓ (Clear, simple tests - pulse, breathing)                                             |
  | **10. Defensibility**| ~ (Brain death concept can be hard for families; established legally) | ~ (Similar to whole-brain)                               | ✗ (Counterintuitive for families to see breathing body as corpse)       | ✓ (Aligns with traditional understanding)                                              |

  **Summary of Scores:**
  *   **Whole-Brain:** Strong on coherence, integration, DDR. Weak on PVS status, practicability. Conflicts Des. 4 & 5.
  *   **Brainstem:** Similar to Whole-Brain, potentially simpler tests. Same weaknesses regarding PVS and consciousness/integration split. Conflicts Des. 4 & 5.
  *   **Higher-Brain:** Fails core coherence (ignores integration), DDR, and practicability. Creates major conflict with intuitions about living bodies (PVS). Directly conflicts Des. 1, 5, 7.
  *   **Circulatory-Respiratory:** Strong on coherence (integration), DDR, practicability, defensibility, determinacy. Weakness is reliance on irreversibility interpretation (Des. 3b) and handling controlled circulatory arrest/restoration (Des. 4). Cannot declare death while circulation persists (even in brain dead).

  This framework provides the rigorous analysis needed for your committee to evaluate and choose between criteria, understanding the trade-offs and philosophical commitments inherent in each. The tension between organismal integration and consciousness (Des. 5) and the Dead Donor Rule (Des. 7) are likely the most critical and contentious points for deliberation.
