answer: |-
  Here's a clear breakdown addressing your questions, separating confident corrections from nuanced interpretations. I'll flag confidence levels and eye-roll risks explicitly.

  ---

  ### **§1: Superrationality as Outcome-Space Restriction**
  - **Recognizably Right?** Yes, this is a valid (though non-standard) interpretation of Hofstadter's core idea. It avoids the circularity of "we both reason identically because we're identical" by reframing symmetry as a constraint on possible outcomes. Hofstadter's "superrationality" *implies* this pruning of asymmetric outcomes.  
  - **Name/Refutation?** No standard name. The standard refutation is: **"Why assume symmetry must hold?"** Game theorists (e.g., Binmore) argue this violates the principle that players are distinct agents with independent strategies. If Ada can unilaterally delete outcomes, why can't Bo? (Confidence: High — this is foundational to non-cooperative game theory).  
  - **Eye-roll Risk:** Philosophers may note this smuggles in *normative* symmetry ("ought implies symmetry") without justification. It’s contested, not consensus.

  ---

  ### **§2: Restriction vs. Evidential Decision Theory (EDT)**
  - **Do They Diverge?** Yes, but only if EDT assigns a *non-zero probability* to Bo defecting *even if she reasons identically to Ada*. In your setup:  
    - **Restriction-Ada:** Only considers (share,share) and (grab,grab). Chooses "share" (5 > 1).  
    - **EDT-Ada:** Uses credence *q* that Bo is superrational. If *q* < 1, she factors in the risk Bo might grab. If *r* (baseline share rate) = 0, EDT *always* says "grab" (since if Bo isn’t superrational, she grabs).  
    - **Divergence Condition:** Restriction-Ada shares iff symmetry is assumed. EDT-Ada shares only if *q* is high *and* *r* is irrelevant (since superrational Bo *must* share). **Clean divergence requires *r* = 0.**  
  - **Your Circle:** You’re correct — if *r* > 0, EDT’s threshold depends on both *q* and *r*, muddying the distinction. For a cleaner split:  
    - Make Bo’s non-superrational self *always grab* (*r* = 0). Then:  
      - Restriction-Ada shares (assumes symmetry).  
      - EDT-Ada grabs (unless *q* = 1).  

  ---

  ### **§3: The Correspondence Problem (Asymmetric Games)**
  - **Correct Diagnosis.** Superrationality collapses without symmetry. Scaling payoffs or adding options breaks "sameness." No agreed extension exists because the premise ("we are identical") fails.  
  - **Eye-roll Risk:** None. This is a legit critique. Philosophers (e.g., Sugden) highlight this as a fatal flaw in symmetry-based solutions.  

  ---

  ### **§4: Role-Neutral Superrationality (Your Fix)**
  - **Is It Original?** Not quite, but your framing is elegant. It’s equivalent to:  
    - **Harsanyi’s "Veil of Ignorance"** (decide behind a Rawlsian veil where you don’t know your role).  
    - Or **correlated equilibrium** (if roles are correlated via a public signal).  
  - **Collapse Risk?** In symmetric games, it reduces to symmetric mixed Nash. But in asymmetric games (e.g., Bo has a third option), it’s distinct:  
    - **Symmetric Nash:** Players may choose different strategies.  
    - **Your Proposal:** All commit to *one* mixed strategy for the population, then randomize roles. Forces universal symmetry.  
  - **Verdict:** A defensible extension of superrationality to asymmetric cases, aligning with moral philosophy (veil of ignorance). Not standard, but not incoherent. (Confidence: Medium — it’s a known move in ethics, less so in game theory).  

  ---

  ### **§5: The 1/e Ceiling & Randomization**
  - **Is the 1/e Ceiling Correct?** **Yes.** For *N* players independently randomizing with *p* = 1/*N*, P(exactly one acts) → 1/e ≈ 37% as *N* → ∞.  
  - **Is There a Non-Communication Workaround?** **No.** This is the "cost of decentralization." Solutions require:  
    - **Correlation:** A shared signal (e.g., sunspots, quantum dice).  
    - **Centralization:** A coordinator.  
  - **Dramaturgical Use:** Perfect. Ada’s stuck because correlation is impossible. Philosophers (e.g., Skyrms) stress this limit — it’s why correlated equilibrium requires more than rationality.  
  - **Eye-roll Risk:** Zero. This is math.  

  ---

  ### **Summary: What Ada Can Say (Defensibly)**
  ```plaintext
  "Bo, I shared because asymmetric outcomes aren't possible. Not because I trust you, but because if our situations are symmetric, the only choices are both share or both grab. And sharing is better.  
  The system fails in asymmetric setups — like when only one can act — because randomness without coordination wastes value. We can't fix that without communication. That's the tragedy."  
  ```

  ### **Confidence Guide for Interviews:**
  | Point                          | Confidence | Eye-Roll Risk | Contested?               |  
  |--------------------------------|------------|---------------|--------------------------|  
  | §1 (Restriction = Hofstadter)  | Medium     | Medium        | Yes — non-standard       |  
  | §2 (Divergence w/ EDT)         | High       | Low           | No — math is clear       |  
  | §3 (Asymmetry critique)        | High       | Low           | Consensus flaw           |  
  | §4 (Role-neutral fix)          | Medium     | Medium        | Yes — novel framing      |  
  | §5 (1/e ceiling)               | High       | None          | Settled math             |  

  ### **Recommendations:**
  1. **Lean into §1’s framing.** It’s crisp and dramatically potent.  
  2. **Force *r* = 0 for Bo’s non-superrational self** to sharpen the §2 divergence.  
  3. **Use §5’s 1/e failure as your climax.** It’s ironclad and tragic.  

  This isn’t boring — it’s a fresh synthesis of ideas from game theory, decision theory, and ethics. Ada’s argument is defensible as a *character’s philosophy*, even if experts would debate it. The 1/e twist is underappreciated and perfect for fiction.
