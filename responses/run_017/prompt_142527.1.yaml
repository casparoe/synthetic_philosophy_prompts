   1. Whether the superstructure primarily holds up an existing economic order or helps create it.
   2. The direction of causation between forces of production (tools, techniques) and relations of production (property, class).
   3. Whether ideas/beliefs can be independent causes of big economic changes.
   4. The role of "in the last instance" (if it's doing any work when we never get to it).

   We also want to use specific cases:
   - The Black Death (labor shock leading to different outcomes in England vs. Eastern Europe)
   - Protestant work ethic (religion as cause of capitalism)
   - Legal abolition of serfdom before capitalist agriculture
   - A made-up case: two islands with same starting economy and tech but different customs leading to different economies.

   The leaves (positions) we want to land on:
   A. Plain base/superstructure with last-instance hedge.
   B. Productive-forces primacy (relations of production explained by what helps forces develop).
   C. Class-struggle / property-relations-first.
   D. Everything is overdetermined and levels are relatively autonomous.
   E. Hegemony and common sense (Gramscian).
   F. Ideas are one cause among many (critique of overfitting).

   We design from logical space: what are the key questions that divide the positions? Then we map the positions to the combinations.

   Steps:
   1. Identify the key dimensions of disagreement.
   2. Formulate questions that capture these dimensions.
   3. Build a branching tree (with up to 8 questions, but we try to be efficient).
   4. Assign the positions to the leaves.

   Proposed dimensions (with questions):

   Dimension 1: Role of Superstructure in Economic Order Formation
     Question 1: In the establishment of a new economic system (like capitalism), do institutions such as law, religion, and the state primarily function to stabilize and legitimize an already existing economic order, or do they play a constitutive role in creating the economic order (e.g., by defining property rights, labor relations) before that order is fully formed?
     We can phrase it as a case: 
     "Consider the abolition of serfdom in Western Europe. In some cases, legal changes abolishing serfdom occurred before the widespread adoption of capitalist agriculture. Does this suggest that the legal superstructure (laws) helped to create the conditions for capitalist property relations, or did it merely recognize and stabilize an economic shift that had already happened?"

     We can make it a claim to agree/disagree:
     Claim 1: "Legal changes that abolished serfdom in Western Europe were a cause of the development of capitalist agriculture, not just an effect of it."

     (Agreeing leans toward superstructure helping to make the order; disagreeing leans toward superstructure holding up an order that already existed.)

   Dimension 2: Direction of Causation between Forces and Relations of Production
     Question 2: Consider the development of new productive technologies (like the steam engine). Do changes in the forces of production (tools, techniques) primarily drive changes in the relations of production (e.g., class structure, ownership), or do the existing relations of production (like the interests of the dominant class) primarily determine which new technologies are developed and adopted?

     We can use a case: 
     "During the Industrial Revolution, the invention and adoption of the steam engine and other machines led to the rise of factories and the capitalist class. Which was the primary driver? 
     a) The development of these new technologies (forces of production) forced changes in the relations of production (from artisans to factory workers).
     b) The existing relations of production (capitalists seeking profit) drove the development and adoption of these technologies."

     We can make it a claim to agree/disagree with one side:
     Claim 2: "The development of new productive technologies is the main driver of changes in how society is organized (class relations, ownership)."

   Dimension 3: Independence of Ideas and Belief Systems
     Question 3: Can major changes in ideas or belief systems (like the Protestant Reformation) independently cause significant economic changes (like the rise of capitalism), or are such changes in ideas always a reflection of underlying economic conditions?

     Case: The Protestant work ethic thesis (Weber) claims that Protestantism, by promoting values like hard work and thrift, helped cause capitalism. 
     Claim 3: "The Protestant Reformation, by changing people's values and attitudes toward work and wealth, was a significant independent cause of the rise of capitalism in Western Europe."

   Dimension 4: The Role of "In the Last Instance"
     Question 4: Consider the claim that "the economy determines the superstructure in the last instance." In practice, when we explain historical events, we often see multiple causes (political, cultural, economic) and rarely can we trace the chain all the way to the economic base as the ultimate cause. Does this mean that the "last instance" clause is an unfalsifiable safeguard that doesn't add explanatory power, or is it still a useful principle that guides us to look for underlying economic factors even when they are not immediately apparent?

     Claim 4: "The principle that the economy is determining 'in the last instance' is a necessary and useful guide for historical analysis, even if we often see complex interactions and other factors at play in the short term."

   Dimension 5: The Black Death Case (to capture the idea that non-economic factors can shape economic outcomes)
     Question 5: The Black Death (mid-14th century) killed a large portion of the population in Europe, leading to a labor shortage. In England, this led to the weakening of serfdom and higher wages for laborers. In Eastern Europe (e.g., Poland, Russia), it led to the intensification of serfdom. Given that the economic shock (labor shortage) was the same, does the difference in outcome suggest that non-economic factors (like political institutions, legal traditions, or cultural norms) played a decisive role in shaping the economic system?

     Claim 5: "The divergent responses to the Black Death in different parts of Europe show that non-economic factors (like political power structures and legal systems) can be decisive in shaping economic outcomes, even when the initial economic conditions are similar."

   Dimension 6: The Made-up Case (to test the causal power of superstructural differences)
     Question 6: Imagine two islands, A and B, with identical geography, resources, technology, and economic systems at the start. Island A has an inheritance custom that divides property equally among children, while Island B practices primogeniture (the eldest son inherits everything). After a century, Island B has developed large estates and a class of landless laborers, while Island A has many small farms and a more equal distribution of land. Does this show that differences in cultural or legal norms (superstructure) can cause significant economic divergence?

     Claim 6: "The hypothetical case of the two islands shows that superstructural factors (like inheritance customs) can be a primary cause of long-term economic divergence, even when starting from identical material conditions."

