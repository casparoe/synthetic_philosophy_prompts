prompt: |-
  Me and a mate got into a three-hour argument last night and I need something better than either of us managed. He's read a bit of philosophy and kept saying that picking forecasting models is just the problem of induction in a lab coat: the only reason we trust the model that did well last season is that it did well last season, and there's no non-circular way to justify that, so we might as well pick the winner and stop pretending. I kept saying the no-free-lunch results back him up in a nastier way: average over every possible problem and every method does exactly the same, so a benchmark win can't be evidence that the method is better in general, only that it happens to match the particular distribution of problems the benchmark sampled. Then we realised neither of us could say what should actually happen on Monday morning, and we left it there.

  Context: I'm one of three people on the forecasting review panel at a national public health agency. Twice a year we pick which submitted model becomes the official seasonal forecast for respiratory disease — the number that triggers stockpile orders, staffing plans and the briefing to ministers. Two weeks per round, three of us (me, an epidemiologist, and one statistician who is part-time and shared with another team), and we have to produce a one-page justification that a senior civil servant signs. Submissions come with a shared track record: last three seasons, scored at roughly forty locations, but the scoring set was proposed by the submitting teams themselves and a lot of the tuning happened after they'd already seen the outcomes.

  What I want is a decision procedure we could actually run on a submission, in the order we'd run it, with what counts as a sufficient answer at each step:

  - What is the method's inductive bias, stated in one sentence — what does it assume about the world that its competitors don't? If the team can't say, that's a stop.
  - Does the benchmark actually discriminate that bias? My idea is a mirror test: ask for the same model with that assumption flipped (smoothness turned into jumpiness, the seasonal trend reversed, the contact structure randomised) and see whether the mirror does worse. If the mirror does about as well, the win isn't coming from the bias we're being asked to bet on. Is that test sound as I've put it, and is there a cheaper version we can run in two weeks without asking the submitters to build another model?
  - Was the record earned prospectively — forecasts lodged before outcomes were known, on units the panel chose rather than the team — and how do we score a submission that is part prospective and part not?
  - Is the structure the method exploits still there this season? New dominant strain, changed reporting lag, moved school terms, behaviour after the last bad season. What counts as a sufficient answer to the world hasn't drifted?
  - Selection effects: with around forty submissions the top score is inflated just by being the maximum. How do we compare a submission against the whole pool rather than against the winner, and how large a gap has to be before it means anything?
  - Where does the procedure stop with a straight no, and where does it hand the question back to us as a values call — e.g. under-predicting a severe season being far worse than over-predicting?

  Then run it on three cases: (a) Meridian, a mechanistic compartmental model, won the last two seasons, submitted by the team that also runs the surveillance system, but only ever scored at locations they chose, and it's the model the minister already likes; (b) Halcyon, a new machine-learning ensemble that topped the table last season, with a margin that comes almost entirely from the fortnight around the holidays when reporting collapses, and it was retuned on the same seasons it was scored on; (c) the boring baseline, last season's curve shifted by the average trend, never wins, never fails badly, and nobody can state what it assumes. I want at least one answer I won't like. I suspect it will tell us to publish a pooled spread instead of picking a winner, which will go down terribly with the people who sign off.

  Also, as you go: separate what is actually settled among people who work on this from what is genuinely contested, and flag it when you're leaning on a contested reading — I don't want something like real-world problems being structured enough to escape the no-free-lunch result, or there being a pragmatic vindication of induction, presented as the consensus. And say plainly what the procedure can't do for us.
reasoning: |-
  Okay, the user is part of a forecasting review panel for a national public health agency. They need a practical decision procedure to evaluate models for seasonal respiratory disease forecasts. Their argument with a friend touched on the problem of induction and no-free-lunch theorems, which complicates justifying model choices. The user wants a step-by-step process that can be implemented within their constraints: two weeks, three panel members, and a one-page justification.

  First, I need to address the philosophical concerns. The problem of induction means past performance doesn't guarantee future results, but in practice, models rely on inductive bias. The no-free-lunch theorem says all algorithms perform equally when averaged over all problems, but real-world problems have structure, so some biases work better. The key is to make these biases explicit and test them.

  The user outlined several steps: stating inductive bias, testing if the benchmark discriminates that bias, checking prospective validation, ensuring the world hasn't drifted, handling selection effects, and defining rejection criteria. Each step needs to be actionable within their timeframe.

  For the inductive bias, teams must articulate their model's assumption. If they can't, that's a stop. This forces clarity and identifies the core hypothesis. The mirror test is clever but might be impractical. Instead, a cheaper alternative could be sensitivity analysis or specific counterfactual queries without rebuilding models. For example, perturbing inputs to see how the model responds.

  Prospective validation is crucial. The panel should weight scores based on when forecasts were made and who chose the units. Mixed records need transparency on which parts are prospective. If a model was tuned on past data, its prospective performance might be inflated.

  World drift involves checking if structural assumptions still hold. Teams should provide evidence, like strain characteristics or behavioral changes. If key factors have shifted, the model's bias might not apply, leading to rejection.

  Selection effects with many submissions mean the top score could be luck. Using Bayes factors or comparing against the ensemble helps. A minimum Bayes factor of 10 could indicate substantial evidence, requiring a significant performance gap.

  Rejection criteria need clear thresholds. If biases aren't stated, it's a stop. If the benchmark doesn't discriminate or the world has drifted, reject. Values calls are needed when trade-offs between under/over-prediction arise, especially since under-prediction is riskier for public health.

  Applying this to the cases: Meridian's bias is mechanistic structures, but location selection by the team is problematic. Without independent locations, it's hard to trust. Halcyon's tuning on the same data inflates scores, and its holiday performance might not generalize. The baseline's lack of explicit bias is a red flag, but its simplicity offers robustness.

  The user might dislike rejecting Meridian due to political favor, but the procedure highlights the location issue. Pooling models could be recommended, though it might face pushback. The procedure can't eliminate uncertainty but structures the decision, forcing explicit justifications and mitigating biases. It separates settled practices (need for inductive bias, prospective validation) from contested ones (effectiveness of mirror tests, handling NFL theorems). Overall, it provides a defensible process even if outcomes are uncomfortable.
answer: |-
  Here's a concrete, step-by-step decision procedure designed for your constraints, grounded in practical philosophy of science and forecasting validation, while honestly confronting the hard problems you raised. It separates settled practice from contested theory and flags where value judgments are unavoidable. The steps build defensibility by forcing explicit justification at each stage.

  **Core Philosophy:** We *cannot* escape induction or NFL's warning. The goal isn't to find a "true" model, but to select the one whose **explicit inductive biases** are **best matched to the current problem structure** and whose **past performance provides the least ambiguous evidence** that those biases were genuinely useful *in a way likely to persist*. Benchmarks are *tests of specific biases*, not general proof.

  **The Decision Procedure (Run Sequentially):**

  1.  **State the Inductive Bias (The Core Assumption):**
      *   **Task:** Require the submitting team to state, in one sentence: *"This model assumes [X] about the disease system is true/dominant, which competing models in this submission round do not assume (or assume differently)."*
      *   **Examples:**
          *   Meridian: "Assumes disease transmission dynamics are *sufficiently captured by specified mechanistic compartments and fixed contact matrices*."
          *   Halcyon: "Assumes that *complex, non-linear patterns in high-dimensional surveillance and mobility data dominate predictable outcomes, and are learnable by this specific ML architecture*."
          *   Baseline: "Assumes *strong temporal autocorrelation and stationarity in year-over-year trends* is the dominant feature."
      *   **Stop Condition:** If the team cannot articulate a clear, falsifiable inductive bias distinct from competitors, **reject immediately**. No justification for past performance or future use exists. "It just works" is insufficient.
      *   **Settled/Contested:** Settled that models *must* have inductive bias to generalize. Contested how explicit/formalisable it needs to be (especially for ML). Your requirement forces explicitness.

  2.  **Test if the Benchmark Discriminates *This* Bias (The Mirror Test - Pragmatic Version):**
      *   **Task:** Assess if the benchmark record provides evidence *specifically supporting* the claimed bias. **Do NOT require building a mirror model.**
      *   **Cheap Alternatives:**
          *   **Counterfactual Query:** Ask the team: "Show us performance on locations/timepoints *where your key assumption [X] was most likely violated* (e.g., Meridian: locations with known atypical mixing; Halcyon: periods without major reporting anomalies/holidays; Baseline: seasons with known major trend shifts). Does performance degrade significantly here compared to the average?"
          *   **Sensitivity Analysis:** Did the team report how performance changes when key elements *representing the bias* are perturbed? (e.g., Meridian: varying contact matrix parameters within plausible bounds; Halcyon: ablating key input features or changing architecture complexity; Baseline: changing the trend window). Does performance collapse without the core element?
          *   **"Natural Experiment":** Does the benchmark include periods/locations acting as natural mirrors (e.g., a season with a new strain before it dominated - test mechanistic assumptions; a holiday period with stable reporting - test Halcyon's holiday reliance)?
      *   **Sufficiency:** Evidence must show a statistically significant performance drop (e.g., >1 SD worse than model's mean) when the core bias is plausibly violated. If performance *doesn't* degrade when the bias is challenged, the benchmark win **cannot be attributed to that bias**. This is weak evidence for future generalisation.
      *   **Stop Condition:** If the team provides *no* analysis of performance under challenged assumptions, or the analysis shows *no significant degradation*, **reject**. The benchmark record is ambiguous evidence for the claimed strength.
      *   **Settled/Contested:** Settled that performance must be linked to *why* the model works. Contested whether cheap proxies (counterfactuals, sensitivity) are sufficient substitutes for true mirror models. Your time constraints force reliance on these.

  3.  **Audit Prospective Validity & Independence (Earning the Record):**
      *   **Task:** Determine the evidential weight of the track record.
      *   **Scoring:**
          *   **Gold Standard:** Forecasts made *before* outcome known, *on units (locations/times) specified by the Panel (or truly independent authority)*. Score = Reported Score.
          *   **Partial Credit (Downweighted):**
              *   Forecasts before outcome, *but on units chosen by submitter*. **Downweight score:** Apply an evidence penalty (e.g., multiply reported score difference vs baseline by 0.7).
              *   Forecasts made *after* outcome known, or on units used in development/tuning. **Severely Downweight or Ignore:** These provide almost no evidence. If included, flag them and exclude from primary performance assessment.
          *   **Tuning:** Was the model *tuned/retrained using the outcomes of the seasons it was scored on?* If yes, **severely downweight the entire track record** for that season (e.g., effective score = baseline score). It's not a fair test.
      *   **Sufficiency:** Require teams to clearly document: Date forecast made, date outcome known, who chose forecast units, what data was available for tuning/retraining *before each forecast was made*. Lack of documentation = assume worst case (tuned on test data, units self-selected).
      *   **Stop Condition:** If the *majority* of the claimed performance comes from non-prospective or non-independent data/tuning, **reject**. The track record is unreliable.
      *   **Settled/Contested:** Settled that prospective, independent validation is the gold standard. Contested how strictly to apply it retrospectively and how much to downweight imperfect records.

  4.  **Assess World Drift (Is the Bias Still Relevant?):**
      *   **Task:** Evaluate if the core inductive bias (Step 1) is likely violated *this* season.
      *   **Sufficiency:** Require the team to provide a *concise argument* addressing known changes:
          *   New dominant strain (does it bypass mechanisms? invalidate learned patterns? break trend?).
          *   Changes in surveillance/reporting (lags, coverage, case definition).
          *   Behavioral shifts (mitigation fatigue, changed mixing).
          *   Policy changes (vaccination strategy, school terms).
          *   *Specifically link these to their model's core bias.*
      *   **Assessment:** Is the argument plausible that the core bias *remains dominant* despite changes? Does it acknowledge risks? **Lack of engagement is a red flag.**
      *   **Stop Condition:** If there is *strong evidence* the core bias is directly and significantly undermined (e.g., Meridian: new strain with confirmed immune escape and altered transmission route; Halcyon: fundamental change in data pipeline during its key prediction window; Baseline: known major behavioral shift breaking autocorrelation), **reject**. The model's foundation is compromised.
      *   **Settled/Contested:** Settled that model relevance depends on world stability. Contested how to quantify "significant" drift and predict its impact. Requires expert judgment (yours and the epidemiologist).

  5.  **Correct for Selection Effects & Pool Noise (Is the Win Meaningful?):**
      *   **Task:** Determine if the model's outperformance is likely due to skill vs. luck, given multiple submissions.
      *   **Method:**
          1.  **Establish a Robust Baseline:** Use the "boring baseline" (or a simple ensemble of 2-3 simplest models) as the null. Its score represents "expected performance without sophisticated bias".
          2.  **Compare Against Pool:** Calculate the model's score *relative to the average score of all submissions* for the same seasons/locations. How many standard deviations above the pool mean is it?
          3.  **Bayes Factor (Simplified):** Estimate the likelihood the observed performance gap vs the robust baseline (or pool mean) could occur by chance if the model had *no true advantage*. Use a minimum Bayes Factor (e.g., `1/sqrt(e) * exp((z_score^2)/2)` for a rough Z-test approximation). **Require BF > 10** ("strong evidence") for the performance difference to be considered meaningful evidence of superior bias matching. (BF>3 is "substantial", BF>10 is better for high stakes). *[Contested simplification, but practical]*.
          4.  **Focus on Stability:** How *consistent* is the outperformance? Did it win narrowly one season and mediocre others, or consistently near the top? Consistent top-3 is stronger evidence than one win and two middling performances.
      *   **Sufficiency:** Requires knowing the pool size and having scores for all models on the *same* prospective/independent subset identified in Step 3. If pool data is incomplete, focus heavily on gap vs baseline and consistency.
      *   **Stop Condition:** If the model's performance advantage over the robust baseline/pool mean is **not statistically robust (BF < 10) or highly inconsistent**, **reject**. The benchmark win is likely noise.
      *   **Settled/Contested:** Settled that multiple comparisons inflate maximum scores. Contested best correction method (Bayes Factors vs frequentist p-values vs other). BF framework is more intuitive for evidence.

  6.  **Risk & Values Assessment (The Ministerial Briefing Test):**
      *   **Task:** Explicitly evaluate the asymmetric risks of error.
      *   **Analysis:**
          *   Examine the model's historical error profile: Is it systematically over-confident? Under-confident? Prone to large misses? *Specifically, how often did it significantly under-predict peak burden?*
          *   Simulate/Consider: If this model underpredicts the peak by 20%, what are the operational consequences (stockouts, overwhelmed clinics)? If it overpredicts by 20%, what are the consequences (unnecessary costs, alert fatigue)?
      *   **Values Call:** **Panel must decide:** Is a model with a slight performance edge but a history of occasional dangerous under-predictions acceptable? Or is a slightly less accurate model that is consistently conservative preferable? *There is no statistical answer here.*
      *   **Sufficiency:** Require teams to report historical error distributions (bias, MAE, RMSE) and *especially* the frequency and magnitude of large under-predictions near the peak.
      *   **Action:** This step **doesn't auto-reject** (unless error profile is catastrophically bad), but **forces a panel values judgment**. Document the trade-off explicitly in the justification: "Selected Model A over slightly better-performing Model B due to Model B's higher risk of dangerous under-prediction, deemed unacceptable for ministerial planning."

  **What the Procedure CANNOT Do:**
  1.  **Guarantee Future Performance:** NFL and induction remain fundamental limits. This only selects the *best-justified bet*.
  2.  **Eliminate Expert Judgment:** Steps 4 (World Drift) and 6 (Values) rely heavily on your expertise. The procedure structures, not replaces, this.
  3.  **Fully Rectify Imperfect Benchmarks:** Garbage In, Garbage Out. A benchmark built on self-selected locations and post-hoc tuning (Step 3) provides weak evidence, no matter how we slice it. The procedure can only downweight or reject based on this.
  4.  **Solve the "True Structure" Problem:** We never know if we've identified the *real* dominant bias, just if the claimed one is testable and tested.
  5.  **Make the Politician Happy:** Choosing the minister's favourite (Meridian) or pooling might be politically difficult if the procedure points elsewhere.

  **Applying to Your Cases (The Answers You Might Not Like):**

  *   **Meridian (Mechanistic - Minister's Favourite):**
      *   **Bias (Step 1):** Clear (mechanistic compartments/contacts).
      *   **Discrimination (Step 2):** **MAJOR WEAKNESS.** Locations chosen *by them*. Did performance drop on *independent* locations or during atypical mixing? *Unlikely tested properly.* **Likely fails Step 2.** Requires team to provide counterfactual evidence urgently.
      *   **Prospective (Step 3):** Locations self-selected = **Downweight performance.** Assume tuning used their surveillance knowledge? **Risk of severe downweighting.**
      *   **Drift (Step 4):** Depends on strain. Mechanistic models *can* adapt, but needs argument.
      *   **Pool (Step 5):** Strong past wins, but credibility damaged by Steps 2 & 3.
      *   **Risk (Step 6):** Mechanistic models can sometimes fail catastrophically if structure wrong (e.g., miss novel transmission).
      *   **Verdict:** **High risk of REJECTION** due to critical failure on Step 2 (untested bias discrimination) and Step 3 (non-independent validation). Needs exceptional counterevidence.

  *   **Halcyon (ML Ensemble - Last Season's Winner):**
      *   **Bias (Step 1):** Vague but acceptable ("complex patterns learnable by our ensemble").
      *   **Discrimination (Step 2):** **CRITICAL ISSUE.** Wins concentrated on holidays (reporting collapse). Does it perform *worse* than average on *stable* periods? If yes, its "bias" might be *overfitting chaos*, not general skill. **Must analyze performance excluding holidays.** Likely fails if holiday exclusion drops it to average.
      *   **Prospective (Step 3):** **TUNED ON SCORED SEASONS!** = **Severely downweight track record (possibly to baseline level).** Retrospective tuning invalidates much of the evidence.
      *   **Drift (Step 4):** Data pipeline changes? New chaos factors? Needs argument.
      *   **Pool (Step 5):** Huge win last season, but heavily inflated by tuning and holiday focus. Corrected score likely unimpressive.
      *   **Risk (Step 6):** Black box. Hard to assess systematic under/over prediction risk. High variance? Scary for ministers.
      *   **Verdict:** **Strong Likelihood of REJECTION** due to fatal flaw in Step 3 (tuning on test data) and probable weakness in Step 2 (bias not general, just fitting noise). Holiday reliance is a red flag.

  *   **Boring Baseline:**
      *   **Bias (Step 1):** "Strong temporal autocorrelation & trend stationarity." **Acceptable.**
      *   **Discrimination (Step 2):** Implicitly tested - it *should* fail dramatically during trend breaks (e.g., pandemic onset). If it didn't fail *too* badly historically, its weak bias is at least consistent.
      *   **Prospective (Step 3):** Easy to run prospectively/independently. Low tuning needs.
      *   **Drift (Step 4):** Very robust to *most* changes (strains, behaviour) *unless* they break the year-over-year trend assumption (e.g., massive permanent shift).
      *   **Pool (Step 5):** Never wins, never badly fails. Is its score *consistently* close to the pool mean/baseline? That's evidence its weak bias is *generally applicable*, even if not optimal.
      *   **Risk (Step 6):** Low risk of catastrophic under-prediction *if* trends are stable. Prone to lagging behind sudden changes. Conservative bias.
      *   **Verdict:** **UNLIKELY TO BE BEST, but RARELY REJECTED.** It passes Steps 1-4 adequately and has low risk. It's the fallback option. The procedure highlights its core strength: *robustness through weak, stable assumptions.* It doesn't *win*, but it often *justifies its existence*.

  **The Uncomfortable Conclusion (Pooling):**
  The procedure will frequently reject complex models due to flaws in validation (Steps 2 & 3) or ambiguity in bias (Step 1), especially under your time and data constraints. The baseline often survives but isn't optimal. **The most defensible, robust outcome is often a simple ensemble (mean or median) of the 2-3 models that CLEAREST pass Steps 1-4 and Step 5 (corrected), explicitly including the baseline as an anchor.** This:
  *   Averages out idiosyncratic biases.
  *   Mitigates individual model weaknesses/risks.
  *   Provides inherent uncertainty quantification (spread).
  *   Is harder to attack philosophically ("We're not betting on one bias").
  *   **Meets your suspicion:** It *will* "go down terribly" with signatories used to picking a "winner", but it's the most scientifically honest response to the limitations exposed by your procedure and the NFL/induction problem. Frame it as "risk mitigation through diversity of validated assumptions."

  This procedure forces explicitness about assumptions, evidence, and risk at every step, providing a structured, justifiable defence against the circularity and no-free-lunch critiques, while acknowledging where judgment is unavoidable. It won't make Monday morning easy, but it will make your one-pager philosophically and practically defensible.
