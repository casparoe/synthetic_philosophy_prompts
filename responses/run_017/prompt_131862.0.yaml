answer: |-
  Here’s a draft focused on the distinctions you’ve asked for, honoring your perspective while acknowledging complexity:

  "Good evening. I’m here as a student who’s walked these halls for four years. Next week, you’re voting not just on a budget line, but on what kind of presence defines our school’s response to crisis. It’s easy to frame this as ‘cops versus counselors,’ but that misses the deeper choice.

  First, it’s about the *default answerer*. When a student spirals, who shows up first? Right now, it’s often an armed officer. The proposal shifts that default to trained counselors and restorative practices for many situations. This isn’t about removing response to extreme danger—the coalition’s plan still routes weapons and assaults to police. It’s about recognizing that most student crises aren’t crimes. They’re cries for help. Who answers first shapes everything: fear or support, escalation or de-escalation.

  Second, and harder to name, is the *standing presence question*. Even on quiet days, having armed officers permanently stationed in our halls sends a message. It tells us the state believes force must be constantly on standby inside our learning community. That presence itself, regardless of individual officers’ actions—and I know officers who’ve acted with care—changes the atmosphere. It frames school as a space requiring armed surveillance. The vote asks: Is this the baseline we want? Is it making us safer, or just reminding us we might be seen as threats?

  The deadlock over weapons protocols is real. My abolitionist friends see it as proof we haven’t truly committed to alternatives. The police chief sees it as proof alternatives can’t fully replace officers. But acknowledging this tension doesn’t mean we do nothing. It means we start where change is possible: redirecting the vast majority of student struggles—mental health crises, conflicts, distress—away from law enforcement and towards care. We invest in proven resources: social workers who build trust, and restorative practices that repair harm without criminalizing adolescence.

  You’re not just voting to cut a contract. You’re voting on what stands ready in our halls every day. Choose to invest $430,000 a year in a standing capacity for force, or choose a standing capacity for care. Redirect these funds to counselors and restorative justice. Start building the school we actually need."

  **Why this works for your goals:**
  -   **Core Distinction:** Centered on "default answerer" and "standing presence," making the implicit explicit without attacking individuals.
  -   **Honors Nuance:** Acknowledges officers' complex roles ("officers who’ve acted with care"), validates the weapons-protocol deadlock without resolving it falsely, and differentiates between extreme danger and everyday crises.
  -   **Coalition Integrity:** Uses "redirecting funds," "standing capacity for care," and "restorative justice" accurately reflecting abolitionist framing without requiring absolute purity. Avoids softening core critique of policing's institutional presence.
  -   **Concrete Ask:** Ends by clearly tying the vote to redirecting funds to counselors/restorative practices.
  -   **Respects Experience:** Grounded in student perspective ("halls," "learning community," "adolescence") without hyperbolic "war zone" claims.
  -   **Plain Language:** No jargon, quotes, or stats beyond your provided figures. Approximately 380 words.

  **Deliver with calm conviction.** This frames the vote as a fundamental choice about the school's environment, not just a personnel swap, while respecting the gray areas you live in. Good luck.
