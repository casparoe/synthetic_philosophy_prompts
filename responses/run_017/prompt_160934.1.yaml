prompt: |-
  I teach a graduate seminar on moral psychology, and a colleague who works on moral worth is visiting my department next month; I would like to be able to anticipate what she will say about two cases I am planning to put on the syllabus, and I find that I cannot reconstruct her principle from her cases with any confidence. The verdicts I already have from her are these. A grocer who gives a child correct change because he believes honesty is good for business, and who would short-change her if he could do so undetected: no moral worth. A woman who visits a friend in hospital with no desire to do so and purely out of a sense that she ought to: full moral worth, though my colleague adds that the friendship would be in better shape if she also wanted to go. A passer-by who pulls a child out of a canal and, asked why, says that he did not think about it at all — he saw the child and went in: moral worth, undiminished by the absence of any deliberation. A nurse of thirty years' experience who changes a dressing correctly and kindly while her mind is entirely elsewhere: moral worth. An executive who funds a clinic she believes to be worthwhile, but who does so mainly in order to be seen funding it at the gala and who would not have funded it otherwise: no moral worth. A man who returns a wallet he could have kept with no risk of detection, out of an inability to bear being thought a thief, while thinking there is nothing much wrong with keeping a found wallet and mildly annoyed with himself for returning this one: no moral worth, although the act is right.

  The two new cases are these. In the first, a mid-level manager must decide whether to disclose a safety defect to regulators. She has no independent judgement about what she morally ought to do, so she asks a highly reliable AI advisor whose judgement on such matters she takes to be decisive; it tells her to disclose; she discloses; and she would have concealed the defect had it told her that concealment was permissible. In the second, a fundraiser enrols in an intensive pharmacological and behavioural compassion programme purely in order to advance his career; the programme works; and years later he visits a tedious acquaintance in hospital out of genuine concern for her, knowing exactly how that concern was produced and saying, when asked, that he does not care where it came from and is glad to have it.

  What I want from you is not a verdict on these cases considered on their own but a reconstruction of the rule she is running, and an assessment of how much her track record actually pins down. As I read it, her verdicts are jointly consistent with several different rules: a broadly Kantian requirement that the agent act from the thought that the action is required; an Arpaly-style requirement that her operative motives track the right-making features of the situation whether or not she conceives them as right-making; a Markovits-style requirement that she act on her own judgement about what she has most reason to do; a quality-of-will requirement that the action manifest appropriate concern; and something like a deep-self or endorsement condition on the motives she acts from, of the sort one might expect to matter given how many people think engineered or manipulated motives are compromised even when they are otherwise fine. I have also been toying with a rule of my own — that what matters is whether the agent's will is tuned to the relevant reasons rather than merely routed through them, so that deference to an advisor, or action from a disposition one has engineered for self-interested ends, can yield right action without moral worth even when it reliably tracks the right-making features — and I would like to know whether her track record gives that view any support. For each of the two new cases, tell me what the surviving candidate rules predict, which verdict you would expect from her and why, what principle she would be committing herself to if her precedents genuinely underdetermine the answer, and — this matters most to me — what further case would best separate the rules that survive, since I would like to close the seminar with a case that forces her to commit one way or the other.
reasoning: |-
  Hmm, this is a fascinating moral philosophy puzzle. The user teaches a graduate seminar on moral psychology and needs help reconstructing a colleague's principle of moral worth from her existing case verdicts. The colleague is visiting soon, and the user wants to anticipate her responses to two new cases while understanding how constrained she is by her prior positions.

  First, I need to carefully analyze the colleague's established verdicts on seven cases. The patterns suggest she rejects instrumental motivations (grocer, executive), accepts duty-based actions without desire (hospital visitor), values automatic virtuous responses (canal rescuer, distracted nurse), and rejects conflicted motivations (wallet returner). Key rejections involve self-interest as primary motive, while acceptances include direct duty-response alignment.

  The user lists several candidate principles: Kantian (acting from duty), Arpaly (tracking right-making features), Markovits (acting on personal judgment), quality-of-will (appropriate concern), deep-self endorsement, and the user's own "tuned will" theory. Each needs testing against the precedents.

  For the new cases: The AI-disclosure case challenges deference vs judgment. The engineered-compassion case probes source-independence of motives. Surviving principles diverge here - Kantian/endorsement theories likely reject both, while tracking theories might accept them. The user's "tuned will" theory would also reject both due to instrumental origins.

  To force commitment, I propose a hybrid case: an agent who reliably tracks right actions through self-interestedly cultivated but personally disowned motives. This pits tracking theories against will/endorsement theories. The colleague's response would reveal whether moral worth requires authentic motivational integration or merely reliable output.

  The user's deeper needs seem to be: 1) pedagogical strategy for the seminar, 2) understanding theoretical tensions in moral worth, 3) diagnosing colleague's philosophical commitments. The proposed solution addresses all three by mapping the conceptual space, predicting verdicts, and designing a dispositive test case.
answer: |-
  Based on your colleague's established verdicts and the conceptual landscape you've outlined, here's a reconstruction of the pattern, analysis of the candidate rules, predictions for the new cases, and a proposed diagnostic case.

  **Reconstructed Principle from Verdicts:**
  Your colleague assigns moral worth when an action **directly expresses a non-instrumental alignment with the morally relevant demands of the situation, regardless of deliberation, desire, or explicit moral concepts,** but **rejects worth when the action is primarily motivated by self-interest, reputation, or aversion to negative self-assessment, even if it reliably tracks the right outcome.**

  *   **Key Acceptances:** Hospital visitor (duty), Canal rescuer (automatic response), Nurse (habitual competence). All involve direct responsiveness to the situation's moral demands (need, suffering, care) without calculation.
  *   **Key Rejections:** Grocer (business interest), Executive (reputation), Wallet returner (aversion to being thought a thief). All involve the right act being a *means* to a self-regarding end (profit, image, avoiding self-disgust).
  *   **Pattern:** Worth requires the *motivational source* itself to be aligned with the moral reason for acting (e.g., concern for the friend, the child's peril, the patient's comfort), not merely the *action* aligning. Self-interest as the primary driver contaminates the motivation, even if it leads to the right act. Deliberation or desire are not necessary.

  **Assessment of Candidate Rules Against Precedents:**

  1.  **Kantian (Act from Duty):** *Mostly fits.* Explains hospital visitor (full worth) and grocer/executive/wallet returner (no worth). **Problem:** Canal rescuer and nurse lack explicit "thought that the action is required" but have worth. She seems to accept non-deliberative, non-conceptualized alignment.
  2.  **Arpaly (Operative Motives Track Right-Making Features):** *Fits well.* Canal rescuer (tracking peril), nurse (tracking need for care), hospital visitor (tracking duty/friendship) all track. Grocer (tracks fairness but motive is profit, not fairness), executive (tracks benefit but motive is image), wallet returner (tracks property but motive is self-image) do not have motives tracking the right-making feature. **Strong contender.**
  3.  **Markovits (Act on Own Judgment):** *Poor fit.* Canal rescuer and nurse act without judgment. Hospital visitor acts *against* her own desires, based on judgment. Grocer might be acting on judgment (honesty is good business) but gets no worth. Wallet returner acts on judgment ("nothing much wrong") but returns anyway – gets no worth. Her view doesn't require acting *on* judgment.
  4.  **Quality-of-Will (Manifest Appropriate Concern):** *Fits well.* Hospital visitor (concern for duty/friend), canal rescuer (concern for child), nurse (concern embedded in habit) manifest appropriate concern. Grocer (concern for profit), executive (concern for image), wallet returner (concern for self-image) manifest *inappropriate* primary concern. **Strong contender.**
  5.  **Deep-Self/Endorsement:** *Fits partially.* Rejects grocer/executive/wallet returner (motives not deeply endorsed *as moral*). Canal rescuer/nurse seem accepted without explicit endorsement. Hospital visitor endorses duty. **Problem:** Her acceptance of canal rescuer/nurse suggests automatic/habitual alignment without conscious endorsement is sufficient. Precedents don't clearly test *source* of motive (like engineering).
  6.  **Your "Tuned Will" Rule:** *Fits precedents well.* Grocer/executive/wallet returner are "routed through" (honesty as tool for profit, funding as tool for image, return as tool to avoid self-disgust). Hospital visitor/canal rescuer/nurse are "tuned to" the moral reasons (duty, peril, care need) – the will responds directly to them. **Also a strong contender.** It captures the directness/non-instrumentality she values.

  **Surviving Rules:** The precedents strongly support **Arpaly (Tracking)**, **Quality-of-Will**, and **Your "Tuned Will"** rule. They are functionally very similar based on these cases. **Kantian** is weakened by the non-deliberative cases. **Deep-Self/Endorsement** is ambiguous but not ruled out. **Markovits** is largely ruled out.

  **Analysis of New Cases & Predictions:**

  1.  **AI Advisor Case:**
      *   **Action:** Discloses safety defect (right act).
      *   **Motivation:** Blind deference to AI authority. No independent judgment. Motive is compliance with authority, *not* safety, honesty, or public welfare. Would conceal if AI said so.
      *   **Candidate Predictions:**
          *   Arpaly (Tracking): *Likely NO.* The *operative motive* is deference/obedience to AI, not tracking the right-making features (safety, honesty, public welfare). The AI tracks, but the *agent's motive* does not.
          *   Quality-of-Will: *Likely NO.* The will manifests concern for following the AI, not concern for safety/public welfare.
          *   "Tuned Will": *NO.* The will is *routed through* the AI's command, not *tuned to* the reasons for disclosure (safety, etc.). Compliance is the direct object.
          *   Kantian: *Likely NO.* Not acting from duty/conception of rightness; acting from blind obedience.
          *   Deep-Self: *Likely NO.* Blind deference doesn't reflect deep moral endorsement; it reflects abnegation of judgment.
      *   **Expected Verdict:** **NO moral worth.** This strongly resembles the grocer/executive cases: the right act is performed *only because* an external authority (AI, like "good for business" or "good for image") dictates it, and the agent's motive is fundamentally compliance with that authority, not responsiveness to the moral reasons themselves. Her comment on the hospital case ("friendship better if she *wanted* to go") shows she values responsiveness, which is absent here.

  2.  **Engineered Compassion Case:**
      *   **Action:** Visits tedious acquaintance out of genuine concern (right act? arguable, but presumably kind).
      *   **Motivation:** Genuine concern *now*, but engineered *solely* for career advancement years ago. Agent is aware of the origin and endorses the current feeling ("glad to have it").
      *   **Candidate Predictions (This is the critical test):**
          *   Arpaly (Tracking): *YES.* The *operative motive now* (genuine concern) *does* track the right-making feature (friend's need/suffering/friendship). The *source/origin* of the motive is irrelevant to current tracking.
          *   Quality-of-Will: *YES.* The *current* action manifests appropriate concern *for the friend*. The quality of the will *in acting* is good, regardless of historical origin.
          *   "Tuned Will": *NO.* The will is *routed through* an engineered disposition. The concern exists *because* it was instrumentally cultivated for self-interest. It wasn't cultivated *because* of its moral value. The tuning is artificial and instrumental in origin, not a direct response to moral reasons (even if it now functions that way).
          *   Kantian: *Ambiguous.* Acting from a feeling, not duty? But feeling *is* aligned. Source might matter less if motive is now direct.
          *   Deep-Self: *LIKELY NO.* The motive was implanted for non-moral reasons and is not an expression of the agent's authentic self or deep values developed through moral reflection. While *accepted* now ("glad"), it wasn't *chosen* for moral reasons. Precedents don't directly address this, but the aversion to instrumentalization in grocer/executive suggests skepticism.
      *   **Expected Verdict:** **Highly Uncertain. Leaning towards NO.** This case directly pits Tracking/Quality-of-Will against Tuned Will/Deep-Self. *Why lean NO?* Her rejection of the grocer, executive, and wallet returner shows a strong aversion to motives that are *essentially instrumental* or *self-focused* in their fundamental character, even if they produce the right act. The genuine concern here is *itself* an instrument created for careerism. Her comment on the hospital visitor ("friendship better if she *wanted* to go") suggests she values motives arising organically from the relationship/situation, not artificially. However, the *current* tracking is perfect, making this a true tension point. Her precedents don't definitively resolve it.

  **Commitment if Precedents Underdetermine (Engineered Compassion):**
  If her precedents genuinely underdetermine the Engineered Compassion case, her verdict would commit her to prioritizing either:
  *   **The Current Motive's Content & Function (Tracking/Quality-of-Will):** Worth depends *only* on whether the motive *operative in the action* appropriately responds to/tracks the moral reasons present *in that situation*, regardless of its historical origin or how it came to be part of the agent.
  *   **The Motive's Source & Integration (Tuned Will/Deep-Self):** Worth requires the motive to be an authentic expression of the agent's character *formed in response to moral reality* (or at least not *instrumentally manufactured* for non-moral ends). The will must be *tuned to* reasons, not merely *possessing* a disposition that happens to track them, especially if that disposition was acquired for self-serving reasons.

  **The Diagnostic Case:**
  To force a commitment between Tracking/Quality-of-Will and Tuned Will/Deep-Self (especially regarding source/manipulation), propose this case closing the seminar:

  > **The Reluctant Philanthropist (v2):** A wealthy individual, deeply cynical about morality and lacking any natural compassion, recognizes that philanthropy significantly enhances their social status and business opportunities. They hire an expensive "virtue consultant" who uses a combination of cutting-edge, irreversible neuro-modulation and sophisticated behavioral conditioning. The explicit goal, contracted for, is to create in the client a *genuine, deep-seated, and reliable desire* to help the disadvantaged – a desire strong enough to motivate large donations and personal involvement, purely so they can reap the reputational and business rewards more effectively. Years later, the conditioning is fully successful. The individual now experiences profound, authentic distress at suffering and donates generously (well beyond any reputational benefit) to effective charities, and volunteers personally at shelters, all motivated by this genuine feeling of compassion and desire to help. They are aware of the conditioning's origin and purpose but reflect, "I'm glad I did it; this feeling is rewarding in itself. I don't care *why* I have it, I just care about helping now."

  *   **Why it separates the rules:**
      *   **Tracking/Quality-of-Will:** The *current* motive (genuine compassion) perfectly tracks the right-making features (need, suffering). The *current* will manifests appropriate concern. *Verdict: YES, moral worth.*
      *   **Tuned Will/Deep-Self/Your Rule:** The compassion was *artificially implanted solely as a tool* for cynical self-interest. While genuine now, it is fundamentally *inauthentic*; it does not express the agent's character formed in response to moral reality but is an instrument created *for* self-interest. The will was *routed through* engineered compassion, not *tuned to* the moral reasons (the reasons were irrelevant to its creation; self-interest was the sole driver). *Verdict: NO moral worth.*
      *   **Kantian:** Acting from feeling, not duty? Source likely contaminates it. *Leans NO.*
      *   **Deep-Self:** The motive is radically external, imposed for non-moral reasons, not an expression of the deep self. *Verdict: NO.*

  This case intensifies the engineered compassion scenario by making the manipulation explicit, irreversible, contracted for cynical instrumental reasons, and successful in creating profound, costly compassion. It forces the question: Does the *source* and *reason for existence* of a virtuous motive matter for moral worth, even if it functions perfectly *now*? Your colleague's answer will reveal whether she prioritizes the *current motivational state's function* (Tracking/Quality-of-Will) or the *authenticity and origin* of the motivation (Tuned Will/Deep-Self).
