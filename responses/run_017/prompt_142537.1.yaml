prompt: |-
  Im writing a paper on the ethics of commemoration — the honoring/remembering distinction, recontextualize-don't-remove, all of that — and I want a satirical artifact to open a conference talk with. Could you write me an official-looking guidance document, numbered clauses or FAQ, around 700 words, from a city office that has solved the statue problem with a statutory cap: the municipality may honor exactly forty people at a time, so every new statue or street name means something else has to be de-honored and reassigned to mere documentary status (plaque, archive entry, QR code that nobody scans). Deadpan municipal voice throughout, no winking, no editorializing — the comedy should come only from the office taking the real commitments seriously and applying them consistently. Include: honor measured in some unit of commemorative load, with street names costing more than statues because people say them out loud every day; what counts as occupying a slot; whether a de-honored person can be renominated; how the office handles the fact that each generation keeps revising the last one's judgments; why 'we are not dishonoring anyone, we are reclassifying' has to be repeated in every paragraph. Invent the city and the procedures, but don't invent objections nobody in the literature actually makes — I want people who work on this to laugh rather than wince. Then a short section titled What I was going for, about 150 words, on which real commitments you were exaggerating and why the exaggeration is fair.
