  Axiology: If values are incommensurable or on par, conflicts might be irresolvable. Ruth Chang's parity idea could support dilemmas. Probability around 0.6, as incommensurability is plausible but not universally accepted.

  Fitting regret: If regret is fitting without wrongdoing, it might indicate dilemmas. But it could also stem from other reasons. Probability 0.55, as it's suggestive but not definitive.

  Action-guidance: If morality must guide action, dilemmas could be problematic. But maybe morality's role isn't just action-guidance. Probability 0.4 against dilemmas.

  Wide-scope reading: This avoids agglomeration by framing requirements as consistency constraints. But it might relocate the conflict rather than resolve it. Probability 0.5, as it's a technical fix.

  Retroactive resolution: The idea that choice settles the ought. This might dissolve the dilemma by making it epistemic until choice. But it could be coherent. Assign it 0.3 probability, and if true, it lowers the chance of genuine dilemmas.

