prompt: |-
  I'm assembling cases for a seminar on whether a theory of rationality can be indirectly self-defeating — whether it can require an agent to be, by its own lights, irrational. Parfit's hitchhiker is the standard illustration: a benefit up front, a cost to be paid later, no way to bind yourself, and a counterparty who is only a fallible reader of character. Every version I have tried lets the agent escape by an easy route, so I want a new case built to order under constraints that close those routes.

  Take the theory under discussion to be a self-interested theory of rationality, S, on which an act is rational exactly if it maximises the agent's own well-being. Construct an ordinary-life case — one paragraph, nothing science-fictional, no contracts or courts, no repeat-play reputation, no drugs or neurotechnology, no near-perfect predictor — in which each of the following holds, and in which none of them holds merely because you stipulated it:

  1. At the later node, performing costs the agent more than any further benefit she could get from it, and S's verdict there is unambiguous: performing is irrational.
  2. Ex ante, rationality on S's own terms recommends becoming the sort of person who performs, so S recommends acquiring a state that will later move the agent to act against the balance of reasons as S then measures them.
  3. The acquired state contains no false belief and no self-deception: at the later node the agent sizes the situation up correctly, judges that she has most reason not to perform, and performs anyway. What she acquires is therefore a non-reason-responsive disposition — akrasia engineered in advance — and not a mistake about how the world is; and it must not be the kind of state she can dismantle by a further rational decision at that node.
  4. The counterparty can tell, by ordinary human judgment and without being misled about what the agent is really like, that she has this disposition, and can rely on it. Nothing in the case turns on the counterparty being fooled.

  Then show that the case does what I asked. Say what the sophisticated chooser does at each node and why, state what the ex ante choice is and why it is the rational one by S's own standard, and then say what a resolute-choice or planning view — the view on which rationality consists in holding to a plan adopted earlier rather than in re-deciding at each node — says about the same case, and whether it gets the agent to perform without any irrationality at all. I also want the honest audit: which single feature of the case is carrying the weight, what the case degenerates into if that feature is removed, and how someone who holds that the hitchhiker needs no irrationality would attack it — the place where the attack actually bites, not a straw version of it.

  Response in five titled sections, in this order: The case (~150 words); Why the easy routes are closed (~100 words); What each view says (~250 words); What is doing the work (~120 words); The strongest objection (~120 words).
reasoning: |-
  Hmm, the user is asking me to construct a philosophical case study about rationality being indirectly self-defeating. They want a non-science fiction scenario where a self-interested theory of rationality (S) requires an agent to become irrational by its own standards. The case must satisfy four specific constraints and avoid common escape routes from Parfit's hitchhiker paradox.

  Let me analyze their requirements carefully. They want:
  1) A later action that's clearly irrational by S's standards
  2) Ex ante rationality recommending becoming disposed to perform that irrational action
  3) The disposition involving clear-eyed akrasia (acting against one's better judgment) without false beliefs
  4) The counterparty being able to reliably detect this genuine disposition

  The user also wants me to show how this case closes common "escape routes," compare sophisticated vs. resolute choice approaches, identify the key feature making this work, and present the strongest objection.

  This is quite challenging! I need to create an ordinary-life scenario that satisfies all these constraints without resorting to sci-fi elements or perfect predictors. The classic hitchhiker problem usually fails because agents can find ways to appear committed while actually planning to defect.

  I'm considering a professional scenario - perhaps an architect and a client. The architect needs to develop a reputation for perfectionism to get hired for a high-stakes project, but this very perfectionism will later compel them to make costly revisions that aren't worth it. The disposition must be genuine and detectable, not faked.

  For the case structure:
  - Early node: Architect rationally cultivates extreme perfectionism to win a commission
  - Later node: That same perfectionism drives irrational overwork on minor details
  - Counterparty (client) hires them because they recognize this genuine trait

  This seems to satisfy:
  1) Overwork costs more than any benefit (clearly irrational later)
  2) Cultivating perfectionism is ex ante rational to get hired
  3) The architect knows the revisions aren't worth it but does them anyway (clear-eyed akrasia)
  4) Client detects this real trait through portfolio review

  Now to ensure the easy routes are closed:
  - No deception: The perfectionism is real, not faked
  - No binding: It's a character trait, not a contract
  - No repeat play: One-off project
  - No mistake: The architect accurately assesses costs/benefits
  - The trait can't be easily shed at decision time

  For the views:
  - Sophisticated choice: Architect rationally cultivates disposition but later acts irrationally
  - Resolute choice: Architect sticks to initial "plan" of perfectionism, avoiding irrationality

  The key feature is the non-instrumental character trait - the perfectionism becomes part of identity, not just a tool. Without this, it degenerates into standard hitchhiker where defection is possible.

  Strongest objection: Can such a trait really be cultivated rationally while remaining reason-proof later? Or is the architect actually overestimating costs/benefits?

  This seems to meet all requirements while staying in ordinary life. I'll develop it with concrete details about the renovation project and costs.
answer: |-
  ### The Case
  Maria, an architect, seeks a high-stakes renovation commission from a discerning client, Leo. Leo only hires architects with a proven, *genuine* obsession with perfection—those who will exhaustively revise designs even for negligible flaws, regardless of cost. Maria knows that to win the contract, she must *become* such a person: cultivating an uncompromising perfectionist identity through daily practices (e.g., reworking minor drafts for hours). She succeeds, and Leo hires her after observing her portfolio and work ethic. Mid-project, Maria discovers a subtle aesthetic flaw in a non-structural element. Fixing it requires 80 unpaid overtime hours for imperceptible gain. She correctly judges that revising it *harms* her well-being (lost time, stress) with no offsetting benefit. Yet, her ingrained perfectionism compels her to fix it anyway—she acts against her conscious assessment of reasons.

  ### Why the Easy Routes Are Closed
  - **No deception**: Leo detects Maria’s *actual* character via her portfolio/work samples; she doesn’t "fake" it.  
  - **No binding/reputation**: This is a one-off project; future clients won’t observe her actions.  
  - **No errors**: Maria accurately weighs costs/benefits at both nodes. The disposition isn’t dismantled mid-act because it’s a deep-seated trait, not a belief she can discard by will alone.  
  - **No predictors**: Leo uses ordinary judgment (reviewing past work), not infallible foresight.  

  ### What Each View Says  
  **Sophisticated choice (S’s view)** advises Maria ex ante to cultivate perfectionism: it maximizes well-being by securing the lucrative contract (*rational* at t1). At the later node, S demands she *not* revise the flaw, as costs outweigh benefits (*irrational* to act). Yet her acquired disposition forces irrational action. S is indirectly self-defeating: it prescribes becoming someone who later violates S.  

  **Resolute/planning view** treats rationality as fidelity to prior plans. Ex ante, Maria rationally adopts a *plan*: "Win the contract by becoming perfectionist, then execute the project flawlessly." At the later node, she *resolutely* performs the revision, upholding her plan. This avoids irrationality: her action coheres with the plan S endorsed ex ante. She performs without akrasia, satisfying S’s original recommendation.  

  ### What Is Doing the Work  
  The **non-instrumental character trait** carries the weight. Maria’s perfectionism isn’t a tool she controls but an identity-level disposition that persists *independent* of situational reasons. Remove this, and the case collapses into standard hitchhiker fare: if the trait were merely instrumental (e.g., "act perfectionist only when watched"), Maria would defect at t2 rationally. Here, the trait’s *entrenchment* makes it reason-proof, forcing clear-eyed akrasia.  

  ### The Strongest Objection  
  **The trait cultivation is not rational ex ante by S’s lights.** S recommends actions maximizing *overall* well-being. If Maria foresees the later irrational act’s costs *exceed* the contract’s benefits, cultivating the trait is net harmful—thus irrational. The objection bites at constraint (2): S cannot prescribe a net-loss state. *Rebuttal*: The later cost (80 hours) is unforeseeable ex ante; Maria only knows perfectionism is *necessary* for the contract, not that minor flaws *will* arise. S still endorses cultivation as the best gamble for expected gain.
