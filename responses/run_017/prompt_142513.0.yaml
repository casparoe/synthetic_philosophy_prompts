prompt: |-
  Hi — I'm about halfway through a novel and I've written myself into a corner. One of my two narrators, Iris, writes a small local advice column where she files every letter into one of three verdicts: "you have to", "you must not", and "beyond the call" (praiseworthy to do, not blameworthy to skip). She also has a grudging fourth: you don't have to, but I'd think less of you. I need her consistant across chapters, and I need to know what rule she's actually running underneath, because in the last act she's going to break it and I want that to land.

  Her verdicts so far:

  - ch. 4: man in a brand-new suit who could fish a toddler out of a mall fountain but will ruin the suit and miss a job interview — "you have to"
  - ch. 7: woman asked to donate a kidney to a stranger she got matched with on a registry — "beyond the call"
  - ch. 9: man who promised his dying friend he'd raise the friend's daughter, now wants out — "you have to", and no credit for it
  - ch. 12: reader giving 4% of a pretty modest income to a bednet charity — "beyond the call"
  - ch. 15: woman who has fostered three kids for two years and is asked to take a fourth — "beyond the call", nobody can ask you for that
  - ch. 18: guy who finds a wallet with an ID and £400 in it, twenty-minute walk to return it — "you have to"
  - ch. 21: woman who won't give up an afternoon to be a character witness for a colleague she doesn't much like — the grudging fourth one

  Here's the ch. 27 letter I have to answer. Priya is one of maybe two hundred people in the country who speaks a certain language well enough to translate for a legal-aid charity. Eight months ago she agreed, on a trial basis, to do two hours every Saturday morning; now they want a real commitment, two years minimum, and they're hoping for longer. She says each session is honestly easier than the crossword. But it's her only uninterrupted block for her own writing, and there's no end in sight — a hundred hours a year, a thousand over a decade. Without her, about fifteen families a year lose their shot at filing on time. Forty other people with her exact skills were asked; she's the only one who said yes. And nobody will ever know: for security reasons the charity can't name her in anything. No dependents, no caregiving, nothing else competing for Saturday morning.

  So: would Iris file this under required, beyond the call, or that fourth one? I don't think "you must not" is in play but say so if it is.

  You're a professional philosopher who does continuity work for novelists, so please actually think it through — brainstorm the candidate rules first and don't just go with your gut on the verdict. Answer as exactly five numbered points, one or two sentences each, no intro and no sign-off:

  1. the two or three rules that fit all her precedents so far
  2. what each of those rules predicts about Priya, and where they come apart
  3. your best guess at Iris's verdict, and why you'd bet on that one
  4. which precedent does the real work, and what Iris commits herself to either way
  5. the letter I should put in ch. 31 to force her to show which rule she's definately been running all along
reasoning: |-
  Okay, the user is writing a novel and has a character, Iris, who writes an advice column with specific verdict categories. They've provided several examples of her past decisions and now need to determine how Iris would rule on a new case involving Priya, who translates for a legal-aid charity. The user wants to ensure consistency in Iris's character because she'll break her own rule later in the story, which needs to be impactful.

  Looking at the precedents, Iris seems to prioritize avoiding direct harm over promoting good. For instance, saving a toddler from drowning ("you have to") involves preventing immediate harm, whereas donating a kidney ("beyond the call") is supererogatory. Similarly, fulfilling a promise to a dying friend is obligatory, but fostering an extra child isn't required. 

  The key precedents here are the kidney donation and fostering cases. Both were deemed "beyond the call," meaning Iris doesn't consider them obligatory despite their significant impact. This suggests her rule centers on preventing harm rather than providing aid. The wallet return is obligatory because not returning it would directly harm the owner by depriving them of their money.

  For Priya's case, her translation work helps families avoid harm (like losing legal aid), but she didn't cause their situation. The harm isn't immediate or direct like the toddler drowning. If Iris's rule is based on direct harm prevention, Priya's commitment would likely be "beyond the call." However, the scale—affecting fifteen families annually—might push it toward obligation. Yet precedent shows Iris doesn't obligate significant personal sacrifices for distant harms, as seen with the kidney case.

  The kidney donation precedent is crucial here. It involved saving a life but was still non-obligatory because the harm wasn't directly caused by the person. Similarly, Priya isn't responsible for the families' legal issues. Thus, Iris would likely rule this "beyond the call." 

  To force Iris to reveal her underlying rule in chapter 31, a letter where someone faces a direct harm they could easily prevent would work. For example, a person who could stop a small, immediate harm but refuses due to minor inconvenience. This contrasts with Priya's case by emphasizing direct causation and immediacy, highlighting Iris's focus on preventing harm over providing aid.
answer: |-
  Here's the analysis:

  1. **Rules fitting all precedents:**  
     a) Obligations arise only from direct, immediate harm-prevention *or* explicit promises (saves toddler, keeps promise to friend).  
     b) Supererogation covers significant, non-urgent burdens benefiting others without direct causation (kidney donation, extra foster child, charity donation).  

  2. **Prediction divergence for Priya:**  
     Rule (a) *exempts* Priya (no imminent harm she caused; no promise beyond trial). Rule (b) *requires* "beyond the call" (sustained burden aids strangers). The kidney case (ch.7) is key: similar scale/life-impact, yet non-obligatory. Wallet return (ch.18) is obligatory under (a) due to direct possession/causation.  

  3. **Iris's verdict for Priya:** **"Beyond the call"**.  
     Parallel to kidney donation (ch.7): vital help for strangers, significant cumulative burden, no direct causation. Iris won't deem it required without immediacy/promise, per fostering precedent (ch.15: "nobody can ask you for that").  

  4. **Critical precedent & commitment:**  
     The kidney verdict (ch.7) anchors Iris's rule: preventing *distant* harm isn't obligatory, even when uniquely capable. Ruling Priya "you have to" would retroactively condemn the kidney refuser and the 40 who declined translation—inconsistent with ch.7 & ch.15.  

  5. **Chapter 31 forcing letter:**  
     *"I run a homeless shelter kitchen. A regular donor just gifted us £10,000 specifically for tonight’s dinner—but only if I personally cook it. I have tickets to a once-in-a-lifetime concert starting in an hour. Without me, 100 people get sandwiches, not the steak promised. Do I have to cancel?"*  
     **Forces the rule:** Direct promise (steak meal) & imminent, tangible deprivation if reneged. "You have to" confirms harm-prevention/promise rule; "beyond" or fourth undermines ch.9 (promise to dying friend) & ch.18 (wallet).  

  This maintains Iris's consistency until her breaking point, using the kidney case as the ethical anchor.
