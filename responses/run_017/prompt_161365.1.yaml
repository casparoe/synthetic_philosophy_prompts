answer: |-
  ## Form PA-1: Application to Undertake an Obligation (Promise, Bet or Undertaking)
  **Issued by: Office of Verbal Transactions (OVT) – A Directorate of the Department of Semantic Compliance**

  **Ref: OVT/PACT/PA1 v.7.3 (Effective 01/04/2023)**

  ---

  **SECTION A: APPLICANT (Speaker) DETAILS**
  1.  Full Name: _________________________________________________________
  2.  OVT Speaker Licence Number: _________________________ (Mandatory. See Note 1)
  3.  National Insurance Number: _________________________
  4.  Address for Correspondence: _________________________________________________________
  5.  Date of Birth: ____/____/____
  6.  Intended Date & Time of Utterance: ____/____/____ ____:____ (GMT/BST)
  7.  Location of Utterance: _________________________________________________________

  **SECTION B: OBLIGEE (Hearer) DETAILS**
  8.  Full Name: _________________________________________________________
  9.  Address: _________________________________________________________
  10. OVT Hearer Registration Number (if applicable): _________________________

  **SECTION C: VERBAL TRANSACTION SPECIFICS**
  11. Type of Obligation (Tick one):
      *   [ ] Promise (Unilateral Commitment)
      *   [ ] Bet (Bilateral Commitment with Stakes)
      *   [ ] Undertaking (Formalised Pledge, often Quasi-Legal)
  12. *Exact Wording* of Proposed Utterance: _________________________________________________________
      _________________________________________________________________________________________
      _________________________________________________________________________________________
      *(Attach separate sheet if necessary. Must match verbatim. See Note 4)*
  13. Proposed Method of Delivery (Tick one):
      *   [ ] Direct Speech (Face-to-Face)
      *   [ ] Telephonic
      *   [ ] Electronic Text (Specify Platform: _______________)
      *   [ ] Other (Specify: _______________)
  14. Nature of Proposed Act/Future Course (Describe): _________________________________________________________
      _________________________________________________________________________________________
  15. Proposed Date for Fulfilment/Outcome Resolution: ____/____/____

  **SECTION D: DECLARATION AND UNDERTAKING (BY APPLICANT)**
  I, ...........................................................................(Applicant Name), hereby declare that:
  *   I am the authorised speaker holding OVT Licence No. .............
  *   The information provided is complete and accurate.
  *   The proposed utterance is intended solely as a performative act creating an obligation under the Illocutionary Transactions Act 1987 (as amended).
  *   I understand that successful registration does not guarantee the perlocutionary effect or successful discharge of the obligation.
  *   I undertake to comply with all post-registration audit requirements (See Note 9).
  *   I absolve the OVT of any liability arising from the hearer's interpretation, feelings, or subsequent actions related to this utterance^(Note 7).

  **Signature of Applicant: _________________________ Date: ____/____/____**

  **SECTION E: COUNTERFOIL ACKNOWLEDGEMENT (To be completed by Obligee/Hearer *after* utterance delivery)**
  I, ...........................................................................(Obligee/Hearer Name), hereby confirm:
  *   I was the intended recipient of the utterance specified in Section C.
  *   I heard/received the utterance verbatim as recorded in Section C.12.
  *   I understood the utterance to be an attempt at creating an obligation at the time of delivery.
  *   I acknowledge this registration does not bind me to any specific course of action unless stipulated by separate contract or law.

  **Signature of Obligee: _________________________ Date: ____/____/____**
  *(Return completed Form PA-1 including signed Section E to OVT Processing Centre within 7 days of utterance delivery)*

  ---

  **NOTES FOR APPLICANTS**

  1.  **Licensing:** Only holders of a valid OVT Speaker Licence (Class P-B-U) may apply. Licences require annual renewal, a Disclosure and Barring Service (DBS) check, and successful completion of the "Foundations of Felicitous Utterance" course. Unlicensed promising, betting, or undertaking is an offence under S.14 of the Illocutionary Transactions Act 1987.
  2.  **Pre-Registration:** Applications must be received by the OVT Processing Centre **no less than 28 days** prior to the intended utterance date (Section A.6). Expedited processing is not available.
  3.  **Authorised Context:** The utterance *must* occur in a context recognised as valid for obligation-creation. Utterances made during theatrical performances, within poetic verse, as part of fictional dialogue, spoken under duress (Form DUR/1 must be submitted concurrently), or explicitly marked as hypothetical ("if I were you...", "suppose that...") are invalid and void *ab initio*. Utterances prefaced by non-serious discourse markers ("just kidding", "no offence but...", sarcastic tone indicators) will be rejected.
  4.  **Verbatim Wording (Section C.12):** The exact wording submitted MUST be used. Minor deviations (e.g., contractions, filler words "um", "like") may invalidate the registration. The OVT Lexical Compliance Unit will assess verbatim match. Intent is irrelevant; only the uttered sequence matters.
  5.  **Counterfoil Requirement (Section E):** Registration is **provisional** until the signed counterfoil (Section E), completed by the named Obligee/Hearer, is received by the OVT within 7 days of the utterance. Failure to return the counterfoil voids the registration retrospectively. The OVT bears no responsibility for locating the Obligee or securing their signature.
  6.  **Hearer Uptake:** The OVT registers the *illocutionary act* only, based on correct procedure and speaker authority. Whether the hearer believed the speaker, felt obligated, or accepted the bet **(perlocutionary effect)** is not assessed by the OVT and does not affect the validity of the registration^(Note 7). Disputes regarding uptake or fulfilment are civil matters.
  7.  **Footnote 7:** The OVT licenses the illocutionary force (e.g., the act of promising *as an attempt*). The subsequent emotional, psychological, or behavioural consequences experienced by the hearer (perlocutionary effects such as trust, relief, or disappointment) fall outside the OVT's regulatory remit and are explicitly disclaimed under Schedule 2, Para 5(b) of the ITA 1987.
  8.  **Quotation & Reported Speech:** Utterances framed as quotations ("As Shakespeare said...") or in reported speech ("He said he would...") are categorically void for obligation creation. Registration will be denied.
  9.  **Compliance Audit:** All registered obligations are subject to random or triggered OVT Compliance Audit. Auditors will verify fulfilment occurred by the specified date (Section C.15) according to the described nature (Section C.14). **Any breach of the obligation, discovered at any time, results in the immediate and retrospective voiding of the original registration.** Fines may apply. Registration signifies acceptance of ongoing audit liability.
  10. **Validity:** A successfully registered obligation (PA-1 approved, counterfoil returned, no active compliance breach) holds force only until the fulfilment date or outcome resolution. Upon fulfilment or breach, the registration is archived. Registration *does not* equate to OVT endorsement of the obligation's wisdom, legality, or moral standing.
  11. **Important Notice:** Due to the stringent requirements for felicitous context (Note 3), verbatim matching (Note 4), timely counterfoil return (Note 5), and the absolute condition of non-breach under audit (Note 9), **no Form PA-1 application has resulted in a permanently valid registered obligation since the inception of the Office of Verbal Transactions in 1988.** All provisional registrations have subsequently been voided, primarily under Note 9. Applicants are advised to manage expectations accordingly. Alternative dispute resolution mechanisms are recommended for managing interpersonal commitments.

  **Submit completed applications to: OVT Processing Centre, PO Box 783, Sillocution, SO14 1UX**
  **(Allow 6-8 weeks for provisional processing notification. Incomplete forms will be destroyed.)**
