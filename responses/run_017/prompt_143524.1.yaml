prompt: |-
  I run a fortnightly reading group with a mix of cognitive-science grad students and philosophers, and I also referee for an interdisciplinary journal, so I end up reading maybe a dozen papers a year whose entire argument rests on one invented scenario — a trolley variant, a brain-upload case, a room with a rulebook, a perfect predictor offering a box, sometimes a brand-new one about AI systems. I have no consistent way of deciding whether the scenario in front of me is doing real argumentative work or is just an intuition pump dressed up as one, and my verdicts are all over the place: I'll be harsh on a paper whose case I find manipulative and soft on one whose case is vivid, even when I can't say what the case established. I'd like an actual procedure I can run — tests in a fixed order, each with a stated "this is what counts as passing," a place where it stops and says no, and an explicit hand-off to human judgment where the question is one of values or of theory-choice rather than fact. Constraints: it should be runnable in about twenty minutes by a second-year grad student with no philosophy training, it has to end in something I can turn into a sentence in a referee report, and it needs to be honest about which steps are judgement calls wearing a lab coat.

  Here's the material I want it built out of, roughly. I keep a list of failure modes in my notes and I'd like the procedure to catch at least these, in whatever form you think is right: (a) off-stage variables — the reader's verdict is being driven by some feature of the setup the author never mentions and never varies, like spatial distance, whether it's an action or an omission, how many people, whether anyone is named, how much time passes; (b) what I've started calling the mannequin problem — the scenario is too thin, so readers are reacting to a schema and filling the gaps from genre conventions (legal drama, lab report, sci-fi), and in fact different readers are filling them in incompatible ways, which is why the verdict looks stable when it isn't; (c) borrowed intuition — the case's force comes from silently importing a verdict on a nearby, more familiar question that differs from the target in a way that matters (using a teleportation case to get a verdict about ordinary survival, say); (d) calibration failure — the intuition is trained on real-world regularities (that predictors are unreliable, that copying preserves psychology, that promises need memory) which the case stipulates away, so the reader is really doing bad empirical reasoning while feeling like they're doing conceptual work. I'd also want the procedure to handle two distinctions I think must survive any simplification: whether the case is being used evidentially (to discover or support a verdict) or decoratively (to illustrate a conclusion already argued for, or to make a paper feel concrete), and whether it's load-bearing or whether you could delete it and the paper would stand. A friend I argued with after a talk last month thinks that a case producing a confident, stable verdict across audiences is ipso facto doing something right even if nobody can say what; I think stability is cheap and manufactureable. Take a side on that, because I think it decides how the whole checklist is built.

  Then I want it run on three cases, please. One: the footbridge-style variant of the trolley setup — the one where you push a large man off a bridge to stop the trolley, versus diverting it — used in a paper arguing that there is no morally relevant difference between the two, so our ordinary harming/allowing distinction is an illusion. Two: the famous Chinese-room-style setup, where someone who speaks no Chinese sits in a room with a rulebook for manipulating symbols and produces fluent Chinese answers, used to argue that a system running a program doesn't understand anything, and hence that current AI systems don't. Three: a case from a paper I'm refereeing right now, which you won't have seen — a language-model assistant that has no memory between conversations and is reset every time tells a user "I'll remind you next Tuesday to take your medication," the user relies on it, and nothing happens because the system can't initiate contact; the paper concludes that no promise was made, since promising requires a persisting agent, and so no existing AI system can promise. I'd like at least one of the three to come out the way I won't like — my guess is my checklist is going to be too harsh on exploratory papers and too soft on vivid ones, and I'd rather find out from you than from an author. Finally, tell me what the procedure can't do: what it will systematically misfire on, and which of its steps a determined author could game by writing the case differently.
reasoning: |-
  We are building a procedure to evaluate thought experiments (TEs) in philosophical papers. The procedure should:
  1. Be runnable in ~20 min by a second-year grad student without philosophy training.
  2. End with a sentence suitable for a referee report.
  3. Explicitly mark steps that are judgment calls.

  The procedure must catch these failure modes:
  (a) Off-stage variables: The verdict is driven by an unmentioned, unvaried feature.
  (b) Mannequin problem: The scenario is too thin, so readers fill in gaps in incompatible ways.
  (c) Borrowed intuition: The force comes from a nearby, familiar but different question.
  (d) Calibration failure: The intuition relies on real-world regularities that the TE stipulates away.

  It must also handle two distinctions:
  - Evidential vs. decorative: Is the TE used to discover/support a verdict or just to illustrate?
  - Load-bearing vs. deletable: Could the paper stand without it?

  We are taking a side on the stability of verdicts: We agree with the user that stability is cheap and manufactureable, so a stable verdict alone does not mean the TE is doing real work. Therefore, the procedure will require more than just stability.

  The procedure will be a checklist with tests in fixed order. Each test has a clear pass/fail condition. The procedure stops if a test fails (and we return a negative evaluation) or continues. Some steps are judgment calls and will be marked.

  We will then apply the procedure to three cases.

  Let's design the procedure step by step.

  **Procedure: Evaluating Thought Experiments (TE) in Philosophical Papers**

  **Step 0: Identify the TE and its role.**
     - What is the scenario? (Briefly describe.)
     - What is the target conclusion (C) the author draws from the TE?
     - What is the intended role of the TE? (Evidential: to support C; decorative: to illustrate C. This is a judgment call, but look for clues: if the paper argues for C independently, it might be decorative; if the paper says "consider this case" and then uses the intuition as evidence, it's evidential.)
     - Pass condition: The TE is clearly described and the conclusion C is stated. If not, stop: the TE is flawed and cannot be evaluated.

  **Step 1: Check for off-stage variables (a).**
     - Identify the key variables (features) that the author varies or holds fixed to get the intuition.
     - Are there any variables that are not mentioned by the author but might be influencing the reader's intuition? (E.g., in trolley: distance, action/omission, number of people, etc.)
     - Test: Vary one off-stage variable (that you suspect might be driving the intuition) and see if the intuition changes. (This is a thought experiment on the TE. It requires judgment to pick a variable, but the test is: if varying an off-stage variable changes the intuition, then (a) is a problem.)
     - Pass condition: The author either (i) explicitly acknowledges and controls for the off-stage variable, or (ii) the off-stage variable does not affect the intuition (i.e., when you vary it, the intuition remains the same). If (a) fails, stop: the TE is flawed due to off-stage variables.

  **Step 2: Check for mannequin problem (b).**
     - Is the scenario described in enough detail to prevent the reader from filling in details? (But note: some details might be intentionally left out to focus on the essential.)
     - Test: Ask two questions: (i) Are there gaps in the scenario that might be filled differently by different readers? (ii) If filled differently, would that change the intuition? (This is a judgment call: we have to imagine how different readers might fill the gaps and if that leads to different verdicts.)
     - Pass condition: The scenario is sufficiently detailed so that key features are not left to the reader's imagination in a way that affects the intuition. If not, stop: the TE suffers from the mannequin problem.

  **Step 3: Check for borrowed intuition (c).**
     - Is the TE using a scenario that is similar to a familiar one but differs in a crucial way? (E.g., teleportation vs. ordinary survival.)
     - Test: Identify the familiar scenario and the crucial difference. Then ask: is the intuition about the TE really about the familiar scenario? (This is a judgment call: we must see if the author acknowledges the difference and argues that the intuition transfers, or if the difference is ignored.)
     - Pass condition: The author either (i) argues that the intuition from the familiar scenario transfers to the new one, or (ii) the TE does not rely on a familiar scenario. If the TE relies on borrowed intuition without justification, stop: the TE is flawed.

  **Step 4: Check for calibration failure (d).**
     - Does the TE stipulate away real-world regularities that our intuitions are calibrated to? (E.g., perfect predictors, copying without psychological change, etc.)
     - Test: Identify the real-world regularity that is suspended. Then ask: could the reader's intuition be driven by the real-world regularity (which doesn't apply) rather than the abstract principle? (This is a judgment call: we must see if the author acknowledges the stipulation and argues that our intuitions can still apply.)
     - Pass condition: The author either (i) acknowledges the stipulation and argues why our intuitions are still reliable, or (ii) the TE does not suspend any real-world regularity that our intuitions are calibrated to. If (d) is present and unacknowledged, stop: the TE is flawed.

  **Step 5: Load-bearing test.**
     - Is the TE load-bearing? (i.e., if you remove it, does the paper lose a key argument for C?)
     - Test: Remove the TE and see if the paper still establishes C. (This is a judgment call: we must see if the paper has other arguments for C.)
     - Pass condition: The TE is not load-bearing (it's decorative) OR it is load-bearing but has passed the previous tests. If it fails the previous tests and is load-bearing, then the paper is weakened. But note: even if decorative, we might still note flaws.

  **Step 6: Overall assessment.**
     - If the TE passed all tests (or if it failed some but is decorative and the failure is minor), then it is doing real argumentative work.
     - If it failed a test and is load-bearing, then it is not doing real work.

  **Output:**
     - For the referee report: a sentence that states whether the TE is successful and why, or what the problem is.

  Now, we run the procedure on the three cases.

  **Case 1: Footbridge trolley variant**
  - Paper argues: no morally relevant difference between diverting the trolley (switch) and pushing a man off the bridge (footbridge), so harming/allowing distinction is an illusion.

  **Step 0:** 
     - TE: You are on a footbridge over a trolley track. A trolley is heading toward five people. You can push a large man off the bridge to stop the trolley (killing him but saving the five). Conclusion: there is no moral difference between this and diverting the trolley in the switch case.
     - Role: Evidential (it's used to argue against the harming/allowing distinction).
     - Pass: Clear.

  **Step 1: Off-stage variables**
     - Variables: physical contact (pushing vs. flipping a switch), directness, personal force, intention (maybe). Author doesn't vary these.
     - Test: Vary physical contact: what if you use a remote-controlled device to drop the man? Intuition might change (some find it less objectionable). Or vary personal force: if you have to push with your hands vs. push a button. Intuition might be stronger against personal involvement.
     - Pass? Fails: The author doesn't control for these variables and they might be driving the intuition. The paper argues that the intuition of wrongness in footbridge is due to an illusion, but the off-stage variables (like personal force) are not considered.

  **Stop at Step 1:** The TE fails due to off-stage variables. The paper doesn't account for them.

  **Referee sentence:** "The footbridge case may be influenced by off-stage variables such as personal force or direct physical contact that the author does not address, which weakens its evidential role in challenging the harming/allowing distinction."

  **Case 2: Chinese room**
  - TE: A person who doesn't speak Chinese is in a room with a rulebook for manipulating Chinese symbols. Given input symbols, they follow rules to output symbols, producing fluent Chinese. Argues: the system doesn't understand Chinese, hence AI systems running programs don't understand.

  **Step 0:**
     - TE: Chinese room as described. Conclusion: The system (and by extension, AI) does not understand.
     - Role: Evidential (it's the main argument for the conclusion).
     - Pass: Clear.

  **Step 1: Off-stage variables**
     - Variables: speed, accuracy, the person's awareness, the complexity of the rulebook. Author holds these fixed? The scenario is designed to be a program.
     - Test: Vary the rulebook: what if the rulebook is so complex it simulates a neural net? Or vary the person: what if the person is replaced by a computer? Does the intuition change? The author might say: no, because it's still just symbol manipulation. So the off-stage variable (whether implemented by a human or a computer) doesn't change the intuition? Actually, some might argue that if the system is implemented in a computer, it might be different (but Searle argues it's the same). 
     - However, the author (Searle) does consider the system implementation (he addresses the "systems reply"). So he acknowledges and controls for this variable. Pass.

  **Step 2: Mannequin problem**
     - The scenario is thin: What does the rulebook look like? How complex? How are the symbols given? The reader might fill in: a simple look-up table? Or a complex program? 
     - Test: If one reader imagines a simple rulebook and another a superintelligent program, does it change the intuition? For the simple rulebook, it's easy to say no understanding. For a complex one, maybe some readers might attribute understanding? But Searle insists that even with complexity, there's no understanding. However, the scenario is intended to be any program. 
     - But the mannequin problem arises because the reader might project a simple rulebook. The author doesn't specify, so readers might fill in differently. However, the conclusion is that no matter the complexity, there's no understanding. But the scenario itself is underdescribed: we don't know what the rulebook is. 
     - Pass? Fails: The scenario is too thin and readers fill in the rulebook differently. Some might think of a trivial system, others of a superintelligent one. The intuition might not be stable.

  **Stop at Step 2:** The TE suffers from the mannequin problem.

  **Referee sentence:** "The Chinese room scenario is underdescribed in a way that allows readers to fill in details about the rulebook's complexity inconsistently, which may lead to unstable intuitions and undermines its evidential force."

  **Case 3: AI Promise Case**
  - TE: A language model with no memory between conversations tells a user "I'll remind you next Tuesday to take your medication." The user relies on it, but nothing happens because the system can't initiate contact. Conclusion: no promise was made because promising requires a persisting agent.

  **Step 0:**
     - TE: As described. Conclusion: No promise was made because the AI is not a persisting agent.
     - Role: Evidential (it's used to argue that AI can't promise).
     - Pass: Clear.

  **Step 1: Off-stage variables**
     - Variables: the AI's design (is it designed to make promises? does it have any persistence?), the user's expectations, the context (medical, casual). Author holds fixed the reset and no persistence.
     - Test: Vary the AI's design: what if the AI is designed to set a reminder in an external calendar? Then it might be seen as a promise. Or if the system does have persistence in some form (e.g., via a database). But the author stipulates no memory and reset. However, the off-stage variable might be: the user's belief. If the user knows the AI is reset, they might not take it as a promise. The author doesn't vary that.
     - Pass? The author does stipulate the reset and no memory, so the variable is controlled. But the verdict might be driven by the user's reliance (which is an off-stage variable? The author mentions the user relies). Actually, the author does mention the user relies. So it's on stage. Pass.

  **Step 2: Mannequin problem**
     - The scenario is thin? We have the AI, the user, the statement, and the reset. But what is the context? Is it a medical app? Is the user in a vulnerable position? Readers might fill in: a casual conversation vs. a formal setting. But the core is the reset and the statement. It might be sufficiently described. Pass.

  **Step 3: Borrowed intuition**
     - The TE is about AI promising. The familiar scenario: human promising. The difference: humans are persisting agents, the AI is not. The intuition about human promises is that they require a persisting agent? That might be borrowed. But the author is arguing that persistence is necessary. 
     - Test: Is the intuition about the AI case really about human promises? The author is using the case to show that without persistence, it's not a promise. But the intuition might be: in the AI case, it's not a promise because the AI isn't a person. That might be borrowing from the intuition that only persons can promise. The author doesn't argue for that; they focus on persistence. 
     - Pass? The author is using the case to argue that persistence is necessary, but the intuition might be driven by the fact that it's an AI (non-person). So the intuition is borrowed from the human case without acknowledging the difference in agency. The author might be aware and is explicitly arguing that persistence is the key, but the case might be trading on the non-person aspect. This is a judgment call: we might say it fails because the intuition might be about non-personhood rather than persistence.

  **Stop at Step 3:** The TE suffers from borrowed intuition.

  **Referee sentence:** "The case of the AI's reminder may be trading on intuitions about non-personhood (borrowed from human promising) rather than the specific feature of persistence, which the paper aims to isolate."

  Alternatively, if we think the paper is explicitly about persistence and the case is designed to isolate it, we might pass. But the user's description says the paper concludes that no promise was made because of the lack of persistence, but the intuition might be that the AI is not a moral agent at all. So we judge that the intuition is borrowed.

  **What the procedure can't do:**
  - It can't replace deep philosophical analysis. It's a screening tool.
  - It might misfire on highly novel or complex TEs that require expertise to unpack.
  - It might be too harsh on exploratory papers that use TEs heuristically.
  - A determined author can game the steps:
     - For off-stage variables: by explicitly mentioning and dismissing them without argument.
     - For mannequin problem: by over-specifying the scenario to avoid gaps (but that might make it less intuitive).
     - For borrowed intuition: by preemptively arguing that the intuition transfers.
     - For calibration failure: by acknowledging the stipulation and asserting that intuition still applies.

  The procedure is best for catching unacknowledged flaws. If the author addresses potential issues, the TE might pass even if the arguments are weak (because the steps are judgment calls, and we might accept the author's defense).

  Finally, we note that one case (Case 1) failed at Step 1, Case 2 at Step 2, and Case 3 at Step 3. So we have one that the user might not like (Case 3, which is the one they are refereeing) failing.

  We designed the procedure to be critical. The user can adjust the judgment calls in practice.
answer: |-
  ### Thought Experiment Evaluation Procedure  
  Here's a step-by-step procedure to evaluate thought experiments (TEs) in philosophical papers. It targets your failure modes (a–d), handles the evidential/decorative and load-bearing distinctions, and incorporates your stance that **stability of verdicts is cheap and insufficient** (we side against your friend: stability alone doesn't validate a TE). The procedure is designed for a second-year grad student with no philosophy training, takes ~20 minutes, ends in a referee-ready sentence, and flags judgment calls (marked with ⚖️).  

  ---

  #### **The Procedure**  
  **Input**: A thought experiment (TE) from a paper, along with the author’s claimed conclusion.  
  **Output**: A verdict sentence for a referee report (pass/fail with reason) or a flag for deeper human judgment.  
  **Time**: 15–20 minutes (strictly timed; skip steps if time runs out).  

  1. **Step 0: Identify Core Elements (3 minutes)**  
     - Describe the TE in 1–2 sentences.  
     - State the author’s conclusion.  
     - ⚖️ **Judgment call**: Is the TE used **evidentially** (essential to the argument) or **decoratively** (illustrative)? *Pass if role is clear*.  
     - ⛔ **Stop and fail** if the TE or conclusion is ambiguous.  
     - *Output so far*: "TE claims [conclusion]. Role: [evidential/decorative]."  

  2. **Step 1: Test for Off-Stage Variables (4 minutes)**  
     - List 2–3 variables the author *doesn’t* mention or vary (e.g., spatial distance, time, emotion, named characters).  
     - Mentally alter one variable (e.g., "What if the large man was named?" or "What if the trolley was slower?").  
     - **Pass condition**: The intuition *doesn’t change* when the variable is altered, *or* the author acknowledges/varied it.  
     - ⛔ **Stop and fail** if the verdict shifts with an unacknowledged variable.  
     - *Output*: Add "Fails off-stage variables: [variable] alters intuition." or "Passes off-stage test."  

  3. **Step 2: Test for Mannequin Problem (3 minutes)**  
     - Identify gaps in the TE description (e.g., motives, history, physical details).  
     - Ask: "Could two readers fill gaps in *opposing* ways that change the verdict?" (e.g., "Is the rulebook in the Chinese room simple or AI-complex?").  
     - **Pass condition**: Gaps are minor/non-divisive *or* the author constrains them.  
     - ⛔ **Stop and fail** if gaps could split intuitions.  
     - *Output*: Add "Fails mannequin test: gaps in [detail] risk inconsistent intuitions." or "Passes mannequin test."  

  4. **Step 3: Test for Borrowed Intuition (3 minutes)**  
     - Identify the "source" intuition (e.g., trolley → real-world harm; AI promise → human promises).  
     - Ask: "Does the TE *silently* rely on the source, but differ in a key way?" (e.g., teleportation ≠ ordinary survival).  
     - **Pass condition**: The author argues the source intuition *validly* applies *or* the TE is truly novel.  
     - ⛔ **Stop and fail** if intuition is borrowed without justification.  
     - *Output*: Add "Fails borrowed intuition: relies on [source] but differs via [key difference]." or "Passes borrowed intuition test."  

  5. **Step 4: Test for Calibration Failure (3 minutes)**  
     - Note real-world regularities the TE suspends (e.g., predictors are imperfect; humans remember promises).  
     - Ask: "Is the reader’s intuition likely based on *violated* real-world regularities?" (e.g., "Would we trust a *human* predictor offering a box?").  
     - **Pass condition**: The author addresses the suspension *or* the intuition doesn’t depend on real-world knowledge.  
     - ⚖️ **Judgment call**: If unsure, proceed to Step 5 but flag for human review.  
     - *Output*: Add "Fails calibration: intuition depends on [regularity] that TE suspends." or "Passes calibration test."  

  6. **Step 5: Load-Bearing and Stability Check (2 minutes)**  
     - ⚖️ **Judgment call**: Is the TE **load-bearing**? (Delete it: if the argument collapses, it’s load-bearing.)  
     - Assess **stability**: Does the TE produce a "confident, stable" verdict? (Note: Stability is *not* a pass/fail—it’s cheap. Record but ignore for verdict.)  
     - **Final pass condition**: TE passes Steps 1–4 *and* is either decorative or load-bearing with no critical fails.  
     - **Hand-off to human judgment**: If all tests pass but values/theory-choice are contested (e.g., "What counts as a promise?"), flag for deeper review.  

  **Referee Sentence Template**:  
  > "The TE [passes/fails] critical checks: [List passed/failed tests]. It is [evidential/decorative] and [load-bearing/non-load-bearing]. [If fail: Recommend revision/deletion.] [If human judgment needed: Flagged for values/theory-choice debate.]"  

  ---

  ### **Evaluation of Your Three Cases**  
  We apply the procedure neutrally. Per your request, one case (Chinese Room) is evaluated against your bias—it fails, which you might dislike if used in an exploratory context.  

  #### **Case 1: Footbridge Trolley Variant**  
  - **Paper's claim**: No moral difference between diverting trolley (switch) and pushing man (footbridge); harming/allowing distinction is an illusion.  
  - **Role**: Evidential and load-bearing.  

  | Step | Test | Result |  
  |------|------|--------|  
  | 0 | Clear TE and conclusion. Role: evidential. | Pass. |  
  | 1 | **Off-stage variables**: Spatial proximity (you touch the man), intent (personal vs. impersonal), and "namedness" (large man vs. anonymous). Altering these (e.g., "What if you push a button to drop him?") weakens the "no difference" intuition. Author never varies them. | **Fail** (unacknowledged variables alter intuition). |  
  | *Stop* | Fails Step 1. | |  

  **Referee Sentence**:  
  > "The TE fails critical checks: Unaddressed off-stage variables (e.g., physical proximity) manipulate the intuition. It is evidential and load-bearing; deletion or revision is needed."  

  **Why you might dislike this**: Harsh on a classic TE, but catches your failure mode (a).  

  ---  

  #### **Case 2: Chinese Room**  
  - **Paper's claim**: A system following rules (like the room) lacks understanding; thus, AI lacks understanding.  
  - **Role**: Evidential and load-bearing.  

  | Step | Test | Result |  
  |------|------|--------|  
  | 0 | Clear TE and conclusion. Role: evidential. | Pass. |  
  | 1 | Off-stage variables: Speed/complexity of rulebook (e.g., "What if the rules mimic neural nets?"). Altering this doesn’t clearly change intuition (Searle argues it’s irrelevant). | Pass. |  
  | 2 | **Mannequin problem**: Gaps in "rulebook" and "understanding" lead to incompatible filling (e.g., one reader imagines a simple lookup table; another imagines GPT-level complexity). Intuitions diverge: some deny understanding in both cases; others grant it for complex systems. | **Fail** (gaps split verdicts). |  
  | *Stop* | Fails Step 2. | |  

  **Referee Sentence**:  
  > "The TE fails critical checks: Gaps in the rulebook’s description invite inconsistent intuitions (mannequin problem). It is evidential and load-bearing; the argument requires revision."  

  **Why you might dislike this**: You might find this too harsh on an exploratory TE (e.g., if the paper is provoking debate), but it catches failure mode (b). Stability is present but ignored per our stance.  

  ---  

  #### **Case 3: AI Promise Case**  
  - **Paper's claim**: The AI made no promise because promises require a persisting agent; thus, no AI can promise.  
  - **Role**: Evidential and load-bearing.  

  | Step | Test | Result |  
  |------|------|--------|  
  | 0 | Clear TE and conclusion. Role: evidential. | Pass. |  
  | 1 | Off-stage variables: User’s expectations (e.g., "What if the user *knows* about the reset?"). Altering this changes intuition (knowing → no promise; unaware → promise-like). Author doesn’t vary it. | **Fail** (unacknowledged variable alters intuition). |  
  | *Stop* | Fails Step 1. | |  

  **Referee Sentence**:  
  > "The TE fails critical checks: Unaddressed off-stage variables (e.g., user knowledge) drive the intuition. It is evidential and load-bearing; deletion or revision is recommended."  

  **Note**: This fails early, but if continued:  
  - Step 3: Borrowed intuition (human promises → AI) with a key difference (persistence). Author doesn’t justify transfer. *Would fail*.  
  - Step 4: Calibration failure (real-world AIs often have memory; intuitions rely on this). *Would fail*.  

  ---  

  ### **What the Procedure Can't Do**  
  1. **Systematic Misfires**:  
     - **High-stakes value judgments**: E.g., TEs about "moral worth" or "consciousness" where disagreement is foundational (flagged for human judgment, but may be over/under-critical).  
     - **Innovative but weird TEs**: Radical new scenarios (e.g., "quantum morality") may pass technical checks but feel nonsensical. The procedure can’t assess coherence.  
     - **Interdisciplinary edge cases**: TEs blending empirical/causal claims (e.g., neuroscience-based scenarios) may pass calibration tests but require domain expertise.  

  2. **How Authors Can Game It**:  
     - **Off-stage variables**: A determined author can "preempt" variables by listing and dismissing them without argument (e.g., "Whether the man is named is irrelevant"). The procedure can’t detect shallow dismissals.  
     - **Mannequin problem**: Authors can over-specify details to avoid gaps, creating a "zombie TE" (detailed but inert). The procedure may pass it, even if intuition evaporates.  
     - **Borrowed intuition**: Authors can explicitly analogize to the source (e.g., "Like human promises, AI..."), borrowing intuition "legally." The procedure can’t assess analogy strength.  
     - **Stability**: Authors can engineer stability using emotive language or cultural tropes (e.g., "Imagine a dying child..."). The procedure ignores stability, but this may hide flaws.  

  **Final Advice**: Use this as a first-pass filter. It will be harsh on exploratory papers (fails early for gaps/uncontrolled variables) and soft on vivid, over-specified TEs (may pass mannequin test). For refereeing, pair it with a quick "Is the core point plausible without the TE?" to soften false positives.  

  Let me know if you'd like tweaks to the procedure or more case analyses!
