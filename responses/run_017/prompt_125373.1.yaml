answer: |-
  **Bottom line:** Harsanyi's theorem assumes a fixed group with interpersonally comparable utilities aggregated linearly *before* taking expectations, which doesn't cleanly map to your RLHF setup due to varying annotator pools, reward normalization choices, and alternative aggregation methods that violate its linearity requirement.

  **Translation to RL Vocabulary:**

  1.  **VNM Axioms:** Equivalent to each annotator having a *scalar reward function* over trajectories such that their preference over stochastic policies (gambles) ranks them by *expected return* under their reward. This implies their reward function is unique up to affine transformation (scale/offset).
  2.  **Social VNM/Social Ranking:** Your final policy optimization objective (e.g., maximize expected pooled reward).
  3.  **Unanimity:** If all annotators strictly prefer trajectory A over B *for a given prompt*, your aggregated reward model should assign A higher reward than B for that prompt.
  4.  **Harsanyi's Conclusion:** The *only* objective satisfying (1-3) for a fixed group is the *expected value* of a *weighted sum* of the annotators' individual *per-trajectory reward functions*: `E_τ[R_social(τ)] = E_τ[Σ_i w_i * R_i(τ)]`. Your "normalization trick" (zero-mean, unit-variance per annotator) *is* the step establishing interpersonal comparability (setting scale/offset), implicitly defining the `w_i`.

  **Residue Report (What Doesn't Map Cleanly & Why):**

  *   **Fixed Group Assumption:** Harsanyi requires the *same* individuals `i` with *fixed* weights `w_i` aggregated for *every* trajectory/policy. Your setup violates this fundamentally – the annotator pool is resampled per prompt. This breaks the theorem's core assumption. *Residue Significance:* Your friend overreads; the theorem has little direct bite here. Aggregation over a *distribution* of annotators (a meta-population) is different.
  *   **Aggregation Inside vs. Outside Expectation:** Harsanyi aggregates rewards *inside* the expectation (`E[Σ w_i R_i(τ)]`). Your alternatives (max-min, lexicographic) typically aggregate *outside* (e.g., `min_i E[R_i(τ)]` or `max min_i E[R_i(τ)]`). These are distinct functionals of the return *distribution* across annotators:
      *   `Σ w_i E[R_i(τ)]` = `E[Σ w_i R_i(τ)]` (Linear, risk-neutral)
      *   `min_i E[R_i(τ)]` (Non-linear, risk-averse w.r.t. annotator inequality)
      *   Harsanyi *forces* the inside/linear form. *Residue Significance:* Your hypothesis is correct. The pressure for `E[Σ w_i R_i]` is computational (Bellman equation/Law of Large Numbers require linearity/expectation for efficient DP). Max-min is *not* a disguised weighted sum; it's concave and violates the linearity Harsanyi requires. It *is* coherent (defines a complete ordering) but may violate time-consistency if implemented naively.
  *   **"Coherence" vs. Bellman Consistency:** Your friend's "incoherent" likely means violating VNM axioms (like independence). In RL, "incoherent" often means violating the Bellman equation (time inconsistency). These are related but distinct. Max-min objectives *can* be made Bellman-consistent (e.g., via robust DP) but remain non-linear/VNM-violating. *Residue Significance:* Philosophical "coherence" (VNM) is a *choice*, not a necessity; RL coherence (Bellman) is often a computational requirement. The latter doesn't force the former.

  **Testing Your Hypotheses:**

  1.  **Normalization as Ethical Input:** **Confirmed.** Your normalization choice (zero-mean, unit-variance) *is* defining the interpersonal comparison, effectively setting the relative weights `w_i` in the Harsanyi sum *if* you were to use it. Choosing *how* to normalize (e.g., per annotator? per prompt batch?) is an ethical choice about whose preferences get amplified/dampened. The theorem *assumes* comparability is given; it doesn't tell you *how* to do it.
  2.  **Aggregation Form & Computation:** **Confirmed.** Harsanyi forces aggregation inside the expectation. Your framework *can* express aggregation outside (`min_i E[R_i(τ)]`), but efficient DP strongly favors the linear/inside form. This is a computational pressure, *not* a philosophical argument for utilitarianism. Alternatives are expressible and coherent (Bellman-consistent) but often computationally harder.

  **Where Translation is Violent & What Would Change Minds:**

  *   **Violence to Philosophy:** Framing VNM axioms as merely "reward functions for expected return" downplays their normative foundation as "rationality" axioms.
  *   **Violence to RL:** Equating "social ranking" directly to your final policy objective ignores the multi-layered approximation (preferences -> reward model -> policy optimization).
  *   **What Would Show Max-min is Weighted Sum?** Proving that under your specific normalization and sampling process, `min_i E[R_i(τ)]` is ordinally equivalent to `Σ v_i E[R_i(τ)]` for some `v_i`. This is generally false.
  *   **What Would Show Theorem Has Bite?** Demonstrating that with your resampling, only objectives equivalent to `E[Σ w_i R_i(τ)]` (for some fixed `w_i` defined on the meta-population) satisfy suitably adapted unanimity and "rationality" axioms. This seems unlikely.
  *   **What Would Show Normalization Worry is Red Herring?** Arguing that *any* affine normalization leads to the *same* social ordering under Harsanyi's weighted sum *if weights are adjusted accordingly*. While true for the Harsanyi sum itself, it ignores that your normalization choice *determines* the effective weights in that sum relative to the raw preferences. The ethical input remains.
