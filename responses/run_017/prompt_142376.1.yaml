prompt: |-
  I have been reading, as an amateur, a little of what philosophers say about our emotional responses to stories, and I keep running into something I cannot find discussed. I am after a name for it if there is one, but more than a name: I want to know what exactly it is, what it is not, and where its edges are.

  It is not the puzzle people usually raise about fiction — the one about how we can be frightened or grieved by characters we know were invented, given that fear and grief seem to require belief that their objects exist. I am entirely convinced that the objects do not exist; that is not my difficulty. My difficulty is about values, not existence.

  Three cases.

  First: I watch a revenge film. What the protagonist is doing is something I would condemn without hesitation if I read about it in a newspaper, and I know while watching that it is wrong. Yet I want him to succeed. I notice myself leaning forward, attending to whether he will arrive in time, feeling the tightening that goes with wanting an outcome. The wanting is not make-believe wanting; it takes my attention the way real wanting does. And afterwards I do not feel that I have compromised myself, or that I have done anything I should apologise for. It is as if my emotions were being run on a set of values I do not hold.

  Second: I come across effectively the same sequence of events in two works, presented in one as a triumph and in the other as a catastrophe. My response reverses completely between them, and the only thing that has changed is the presentation. I take that presentation to be no reason whatsoever for any belief about the events — it is merely a way of showing them — and yet my response tracks it exactly, and would track it again if I reread.

  Third: a scene that a work plainly wants me to find moving leaves me cold. Here I am inclined to speak of a failure, but the failure does not seem to be located in any fixed place: sometimes I say I have missed something or have read badly, sometimes I say the work has not earned it. Notice that this case has a normative structure the first two lack — there is blame going round — and I cannot tell whether that makes it the same phenomenon seen from the other side or a different one.

  What I would like to know: is there an established concept here? I have encountered the phrase *suspension of disbelief*, but as I understand it that concerns whether one takes the events to be real, and I have no trouble not taking them to be real. I also have a vague impression that there is a literature about cases where a reader cannot go along with a story, where the story asks them to regard as fine something they regard as monstrous and they balk; but my first case is the opposite of balking, and my second involves no balking at all, so I suspect I am looking at something else, or at a different part of the same territory.

  So, more precisely: are the first two cases one phenomenon? Is the third the same phenomenon inverted, or a distinct one? What is the object of the wanting in the first case — the character, the events, or the way they are being shown? Does it matter whether I endorse the values in question, or is endorsing them simply one further instance of the same mechanism? Does the phenomenon extend to non-fictional framings — a friend telling an anecdote with an unmistakable editorial spin, an advertisement, a stylised hypothetical in an ethics seminar, where I feel outrage I would not defend? And does it extend to framings I have produced myself?

  A label alone would not settle any of this for me. I would rather have a definition with boundary cases, and if no established term covers the thing I have described, then a coined one together with an account of what it excludes.
reasoning: |-
  Okay, the user is grappling with a nuanced philosophical problem about emotional responses to fiction. They've clearly done some reading but feel there's a gap in the discussions they've encountered. Let me unpack their three cases carefully.

  First, they describe rooting for a revenge-seeking protagonist despite knowing the actions are morally wrong. The key here is the conflict between their ethical judgment and visceral emotional investment. They emphasize this isn't about belief in fiction's reality - that classic "paradox of fiction" is set aside. 

  Second case fascinates me - identical events framed differently evoke opposite emotions. This highlights how presentation overrides content in shaping response. The user insists this isn't about changing beliefs, just raw emotional reversal based on framing.

  Third case introduces normativity: when expected emotions don't materialize, we start assigning blame - either to ourselves or the work. This complicates matters by adding an evaluative layer absent in the first two.

  The user's questions reveal sophisticated concerns:
  - Are cases 1 and 2 the same phenomenon? 
  - Is case 3 its inverse or something else?
  - What's the actual object of their desire in case 1?
  - Does personal endorsement matter?
  - Does this extend to non-fiction contexts like spun anecdotes or ads?
  - What about self-generated framings?

  Hmm. Traditional concepts like "suspension of disbelief" or "identification" don't quite fit. "Suspension of disbelief" addresses existence beliefs, which isn't the issue here. "Identification" might explain case 1 but fails case 2 where framing alone flips emotions without character attachment.

  I recall Walton's "quasi-emotions" but that feels too detached for what the user describes - their leaning forward suggests genuine affective arousal. Currie's "simulation theory" gets closer but still doesn't capture the value-tracking aspect.

  The key seems to be what I'd call "perspectival traction" - how narratives harness our innate capacity to adopt temporary evaluative frameworks. Case 1 shows ethical values being temporarily overridden by narrative values. Case 2 demonstrates how framing controls which values get activated. Case 3 represents failed traction - when the narrative can't successfully install its value-lens.

  For boundaries: this differs from persuasion (no belief-change occurs) and simple mood induction (it's specifically value-tracking). Non-fiction applications are crucial - spun anecdotes work similarly by imposing evaluative angles. Self-framing is trickier but possible in hypothetical reasoning.

  The normative aspect in case 3 is particularly telling. When traction fails, we experience it as error - either ours (misreading) or the text's (unearned emotion). This suggests perspectival traction isn't just psychological but has aesthetic dimensions tied to narrative competence.

  What the user might really be circling is how narratives create temporary autonomous zones of value - what Richard Moran calls "the exchange of reasons" in fiction. But they need concrete mechanisms, not just theory. I should emphasize the embodied nature of this - the "leaning forward" physicality matters.
answer: |-
  You've articulated a profound and under-discussed phenomenon in aesthetic response—one that sits at the intersection of narrative engagement, moral psychology, and the philosophy of emotion. I propose the term **Perspectival Traction** to capture this. Below is a definition, boundary cases, and analysis addressing your questions.  

  ### **Core Definition: Perspectival Traction**  
  **Perspectival Traction** is the involuntary, temporary adoption of a narrative's evaluative framework—its implied judgments, emotional cues, and moral priorities—despite conscious disagreement with that framework. It occurs when a story’s *presentation* (point of view, pacing, tone, focalization) overrides your stable beliefs/values, generating genuine emotions aligned with the narrative’s logic.  

  ### **Key Features**  
  1. **Non-Belief-Dependent**: Unlike "suspension of disbelief" (which concerns ontological commitment), perspectival traction operates at the level of *evaluation*. You need not believe events are real; you adopt the story’s *axiological lens*.  
  2. **Emotional Authenticity**: Responses feel experientially identical to real-world emotions (e.g., rooting for revenge), but are contextually bounded by the narrative frame.  
  3. **Temporality**: The effect dissolves post-engagement. No lasting moral compromise occurs because the narrative’s value-system is quarantined.  
  4. **Presenter-Controlled**: Your response tracks the creator’s manipulation of perspective (e.g., camera angles, prose style, rhetorical framing), not objective events.  

  ---

  ### **Analysis of Your Cases**  
  **Case 1 (Revenge Film)**  
  - **Mechanism**: The narrative installs a *provisional value-system* (e.g., "injustice demands violent retribution"). You experience **perspectival empathy**—tacitly accepting the protagonist’s goals as valid *within the story’s logic*.  
  - **Object of Wanting**: You desire *narrative coherence*—the satisfaction of seeing the story’s internal logic fulfilled. It’s not endorsement of the act, but investment in the *arc* the presenter constructs.  
  - **Boundary**: If you felt lingering guilt, it would signal *failed quarantine*—a breakdown of perspectival traction.  

  **Case 2 (Identical Events, Opposite Framings)**  
  - **Mechanism**: Framing cues (e.g., music, focal character, diction) activate different *evaluative schemas*. A revenge killing framed as "triumph" might trigger dopamine-driven reward responses; framed as "catastrophe," it might trigger mirror-neuron distress.  
  - **Proof of Autonomy**: This confirms perspectival traction isn’t about events but *presenter-imposed valuation*. Your emotions are puppeteered by narrative design.  
  - **Boundary**: If your response *resisted* the framing (e.g., finding a "triumphant" revenge horrifying), it would indicate **traction failure**.  

  **Case 3 (Failure to Be Moved)**  
  - **Same Phenomenon, Inverted**: This is **failed perspectival traction**. The narrative fails to impose its evaluative framework due to:  
    - *Aesthetic flaws* (poor pacing, inconsistent characterization → "didn’t earn it").  
    - *Psychological blockers* (your values are too rigid; e.g., a pacifist unable to enjoy any revenge plot).  
  - **Normativity Explained**: Blame arises because traction is an *implicit contract* between presenter and audience. Failure implies broken craftsmanship or irreconcilable values.  

  ---

  ### **Critical Boundaries**  
  1. **Not Identification/Simulation**:  
     - Identification requires *merging* with a character. Traction can occur without this (e.g., rooting for a villain you dislike because the plot structure demands it).  
  2. **Not Moral Persuasion**:  
     - Persuasion alters beliefs. Traction leaves beliefs intact; it’s a *temporary override*.  
  3. **Not "Alief" (Gendler)**  
     - "Alief" (automatic belief-like attitudes) is content-specific (e.g., reacting to a fictional spider). Traction is *structural*: it’s about adopting the story’s *rules of engagement*.  
  4. **Not Catharsis**:  
     - Catharsis purges emotions. Traction *generates* them via borrowed values.  

  ---

  ### **Extending the Concept**  
  - **Non-Fiction Framings** (e.g., spun anecdotes, ads):  
    Yes. An ad framing a luxury car as "deserved reward" can induce desire *in the moment* via traction, even if you reject consumerism. The spin installs a provisional value: "You *ought* to want this."  
  - **Self-Produced Framings**:  
    Limited. When you frame your *own* hypotheticals (e.g., arguing for a view you reject), traction is weaker—your metacognitive awareness ("I’m role-playing") blocks full immersion. However, skilled self-persuasion (e.g., rehearsing a speech) can approximate it.  
  - **Ethics Seminars**:  
    Yes. A well-told hypothetical can trigger visceral outrage via traction. We judge the *scenario* by its internal logic, not our reflective ethics.  

  ---

  ### **Why This Concept Fits**  
  - **Solves Your Puzzles**:  
    - Case 1: Traction explains *why* you root for "wrong" acts without guilt.  
    - Case 2: Traction shows framing alone can flip evaluative schemas.  
    - Case 3: Failure confirms traction’s role—it’s expected to work.  
  - **Connects to Theory**:  
    - Murray Smith’s "engagement" (film) and Suzanne Keen’s "narrative empathy" touch on aspects but miss the *evaluative hijacking*.  
    - Peter Goldie’s "feeling toward" (emotions directed at fictional objects) is a component, but traction adds the *value-adoption* layer.  

  **In short**: Perspectival traction is the mind’s involuntary surrender to a story’s moral-emotional gravity—a testament to narrative power over our embodied cognition. It is not a flaw, but a feature of how humans decode meaning from framed experiences.  

  Would you like to test this against specific examples or delve into its cognitive underpinnings?
