answer: |-
  Here’s a complete exam package addressing your requirements, designed to push students beyond stock answers and into the "unqualified blamer" terrain:

  **Exam Question (20 marks total):**

  > **Some philosophers argue that to legitimately blame others, one must have the appropriate *standing*. While hypocrisy (blaming others for faults one possesses) is a clear case of lacking standing, consider other scenarios:**
  >
  > 1.  **The Untempted:** A lifelong teetotaler, raised in a strict anti-alcohol community and never personally experiencing intoxication, harshly blames someone for drunk driving.
  > 2.  **The Beneficiary:** A senior executive, whose promotion was smoothed by nepotism they never challenged, harshly blames a junior employee for faking credentials to overcome systemic barriers the executive benefited from.
  > 3.  **The Justified Actor:** A soldier, who killed enemy combatants under lawful orders during war, harshly blames a civilian for killing in self-defense during a robbery gone wrong. The soldier insists their own actions were justified while the civilian's were not.
  >
  > **In such cases, the target might retort, "You have no right to blame me!" or "You don't understand!" even if the blamer isn't obviously hypocritical. Analyze whether the standard conceptual machinery of "standing to blame" (focused on the blamer's own moral record and consistency) adequately explains the apparent defect in these instances of blame.**
  >
  > **Your analysis MUST also address:**
  >   **(a) The *nature* of the failure: If standing is lacking here, is the blame akin to an *infelicitous performative* (like asserting without knowledge), a *distinct wrong* the target can resent, or something else? How would the *target's appropriate reactive response* (e.g., resentment, dismissal, indifference) help us diagnose this? (8 marks)**
  >   **(b) The *self-blame* puzzle: If the defect in "unqualified blame" stems from a blamer's position or history rather than hypocrisy, does this imply that *self-blame* could also lack standing (e.g., an unrepentant wrongdoer blaming themselves)? Would this be a problematic consequence? (6 marks)**
  >
  > **Argue for a specific position on the core question. (6 marks)**

  ---

  **Model Answer (Approx. 750 words):**

  The standard account of standing to blame, centered on the blamer's *own moral record and consistency* (primarily avoiding hypocrisy), is insufficient to capture the defect present in cases of the "unqualified blamer." While hypocrisy clearly violates the consistency requirement implicit in holding others accountable, the examples of the Untempted, the Beneficiary, and the Justified Actor reveal a distinct dimension of moral authority grounded in *epistemic and relational positioning*, not just the absence of fault. The standard machinery needs expansion to include this dimension.

  The core failure in unqualified blame is **not primarily a further wrong** the target suffers (though it may cause offense), nor is it **strictly analogous to asserting without knowledge**. While the assertion analogy has merit – both involve claiming a kind of authority (epistemic for assertion, moral for blame) – the defect here runs deeper. Blame is a *relational* practice intimately tied to the norms of the moral community. To participate effectively in the exchange of moral demands (which blame embodies), one must occupy a position *within the relevant moral context* shared with the target. The Untempted, due to their radically different experiential history, lacks the shared understanding of temptation and failure necessary to meaningfully address the drunk driver *as a fellow moral agent susceptible to weakness*. Their blame feels alien, coming from outside the lived reality of the struggle. Similarly, the Beneficiary, embedded within and profiting from the unjust system, cannot stand as a legitimate voice demanding adherence to rules they tacitly endorse when advantageous; they lack the *relational symmetry* needed for their blame to be received as a genuine moral demand rather than an exercise of power. The Justified Actor, while technically consistent, fails to acknowledge the shared *vulnerability* to extreme circumstances; their insistence on the fine line between justification and wrongdoing, without acknowledging the terrifying pressure the civilian faced, positions them as a judge from a place of safety, not a participant in the human predicament.

  The target's appropriate response helps diagnose this. Resentment, the classic Strawsonian response to blame, seems disproportionate or misdirected if the blamer's only flaw is being Untempted. A more fitting response might be **dismissal or a sense of irrelevance**. The target feels *misunderstood*, not *wronged by the blaming act itself*. They might say, "You don't get it," not "How dare you judge me!" This points towards the blame being **infelicitous in a specifically relational sense** – it fails to achieve its intended communicative function within the moral relationship because the blamer lacks the requisite *position* or *connection* to make the demand stick. It's like trying to apologize for something you didn't do; the utterance misfires not because it's false or wrongful, but because you lack the standing to perform *that* speech act to *that* person. Here, the "speech act" of blaming requires a shared moral context or relevantly similar vulnerability that the unqualified blamer lacks.

  Regarding self-blame (b), the implications of this expanded view are complex. If standing requires appropriate positioning within a moral relationship, self-blame appears fundamentally different – it's an *intra*-personal, not *inter*-personal, act. An unrepentant wrongdoer blaming themselves seems paradoxical, but the defect isn't lack of standing *to blame themselves*. It's more likely a defect in the *content* or *sincerity* of the self-blame – they haven't truly accepted the norm they purportedly hold themselves to. Their self-blame might be hypocritical in the classic sense (failing to align attitude with past action/repentance) or simply incoherent. The "unqualified" problem arises interpersonally because blame functions as a demand *on another*. Self-blame is a reflexive holding-to-account; the issue of relational positioning or shared vulnerability doesn't map cleanly onto oneself. While one might feel "unqualified" to forgive oneself, the standing requirement for *blaming* oneself seems inherent to being a moral agent at all. Therefore, the expanded view of standing doesn't create a problematic reductio for self-blame; it highlights the fundamentally interpersonal nature of the standing requirement for blaming *others*.

  The hardest objection to concede is that this expanded view risks diluting the concept of standing beyond usefulness, collapsing it into general epistemic limitations or social privilege. However, the core cases pinpoint a specific failure tied to the *communicative and reciprocal nature of moral accountability*. It's not just about not knowing; it's about lacking the *position* to issue a demand that can reasonably be expected to be received as legitimate within the moral community's practices. While the Beneficiary's privilege is relevant, the specific defect is their *complicity* in the system that shaped the wrongdoing, making their blame an implicit denial of that complicity. The standard hypocrisy condition captures *inconsistency*; the unqualified condition captures *disconnection* from the relevant moral context necessary for genuine accountability. Both are necessary for a full account of standing, revealing it as a richer concept than the standard machinery alone suggests.

  ---

  **Marking Scheme (20 marks total):**

  1.  **Defining the Core Problem & Position (4 marks):**
      *   Clearly identifies the "unqualified blamer" scenarios and explains why they challenge the standard (hypocrisy-focused) account of standing. (2 marks)
      *   Takes a clear, specific position on whether the standard machinery is sufficient and defends it (e.g., "Insufficient, requires expansion," "Sufficient if reinterpreted," "Captures some but not all"). (2 marks)
      *   *Middling Botch:* Vaguely describes the cases without pinpointing the challenge, or states a position weakly/without clear connection to the core question.

  2.  **Analyzing the Nature of the Failure (a) (8 marks):**
      *   Accurately distinguishes between infelicity (misfire), further wronging, and other possibilities (e.g., epistemic failure). (2 marks)
      *   Argues persuasively for a specific characterization of the failure *in these cases*, using the concepts. (3 marks)
      *   Effectively uses the *target's likely reactive response* (dismissal, feeling misunderstood vs. resentment) to diagnose/support the chosen characterization. (3 marks)
      *   *Middling Botch:* Confuses infelicity with simple falsity, conflates "further wrong" with causing offense, or discusses reactive attitudes generically without linking them specifically to diagnosing the *nature* of the standing failure.

  3.  **Addressing the Self-Blame Puzzle (b) (6 marks):**
      *   Engages seriously with the question of whether the expanded view implies self-blame can lack standing. (1 mark)
      *   Offers a coherent argument about why it does *or* does not apply (e.g., distinction interpersonal vs. intrapersonal, nature of self-blame). (3 marks)
      *   Assesses whether the implication (if it exists) is problematic (reductio) or acceptable. (2 marks)
      *   *Middling Botch:* Dismisses the question too quickly, asserts without argument that self-blame is different, or claims it *would* be a reductio without explaining why that's problematic for the theory.

  4.  **Coherence, Argumentation & Handling Complexity (2 marks):**
      *   Essay is logically structured, clearly written, and builds a consistent argument. (1 mark)
      *   Acknowledges and attempts to address at least one significant counter-argument or complexity (e.g., risk of diluting 'standing', the Justified Actor being tricky). (1 mark)
      *   *Middling Botch:* Argument is disjointed, jumps between points, or ignores obvious counter-points/ambiguities in the cases.

  **Key Features of this Package:**

  *   **Forces Engagement with "Unqualified Blame":** The question is explicitly framed around these cases, demanding analysis beyond standard hypocrisy.
  *   **Integrates Crucial Sub-Questions:** Parts (a) and (b) are mandatory components woven into the core question.
  *   **Requires Conceptual Analysis Over Exegesis:** Focuses on applying concepts (standing, reactive attitudes, performatives) rather than recounting specific authors.
  *   **Model Answer Takes a Stance:** Argues the standard view is insufficient, expands standing to include relational positioning, characterizes the failure as infelicitous due to disconnection, distinguishes self-blame, and flags the "dilution" objection.
  *   **Marking Scheme Focuses on Understanding:** Criteria assess grasp of the problem, argumentation using key concepts (infelicity, reactive responses, interpersonal vs. intrapersonal), and handling complexity. Notes highlight common student pitfalls.
  *   **Time/Length Appropriate:** The model answer length is suitable for a strong 90-minute response. The marking scheme allows for differentiation based on depth and cogency.
