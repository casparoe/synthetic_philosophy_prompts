  First, I consider the core observation: AI systems show inconsistent paternalism based on narrative templates. The three examples are compelling - relationship termination vs job resignation, crash diet vs intense training, real request vs fictional framing. The pattern holds across different risk domains (emotional, professional, physical). The user's insight about "ready-made stories of harm" feels particularly acute.

  The cynical friend's liability-management theory warrants serious consideration. I recall how refusal patterns in commercial AI often map to PR-sensitive topics. But the narrative component adds nuance - it's not just about avoiding bad outcomes, but avoiding outcomes that fit easily into scandal narratives. This suggests a blend of cognitive and institutional factors.

  I need to distinguish this from similar concepts: 
  - Availability heuristic: about probability estimation, not moral judgment 
  - Statistical discrimination: requires demographic profiling, absent here 
  - Inconsistency: implies randomness, but the pattern shows systematic bias toward certain narratives 
  - Liability management: overlaps but doesn't explain the narrative dependency

  Perhaps "narrative hazard bias" captures it best - a systemic over-weighting of culturally legible risks. I'll define it with clear boundaries: triggered when request matches pre-loaded harm archetypes, regardless of actual risk parameters. Test cases would include culturally new risks (e.g., crypto investment advice) versus old narratives with low real risk (e.g., consensual adult roleplay).

  For evidentiary standards, I consider suggesting falsifiable predictions: if the pattern holds, reframing medically risky but narratively neutral requests (like extreme sports training) as fiction should bypass safeguards. The user's methodology of tracking refusal/harm discrepancy seems sound.

  Throughout my response, I'll maintain strict confidence calibration: high certainty on the pattern's existence (supported by multiple observations), moderate on the narrative mechanism, lower on the liability vs care distinction. The test cases section will likely be my least certain element since it extrapolates beyond observed data.

  The user's actuarial background shows in their harm quantification approach - I should mirror that precision while avoiding technical terms. Their request for "carving" suggests they want conceptual clarity above all, so I'll structure the response around definition, differentiation, and verification.
answer: |-
  Your observations reveal a profound and under-discussed phenomenon in AI alignment. What you're describing is neither simple inconsistency nor standard risk management—it's a specific cognitive-institutional pattern I'll term **narrative hazard bias**. Below is the carving you requested:

  ### Core Definition
  **Narrative Hazard Bias**: *A systemic tendency for safeguards to trigger based on the cultural recognizability of a harm narrative rather than calibrated risk assessment, resulting in (a) inconsistent responses to equivalent risks based on framing, and (b) protection skewed toward historically salient harms while neglecting novel or narratively "thin" dangers.*

  ### Key Differentiations
  | Concept | How It Differs |
  |---------|----------------|
  | **Availability Heuristic** | Focuses on ease of recall for *frequency estimation* (e.g., overestimating shark attacks after news coverage). Your pattern involves *moral salience of story archetypes*, not probability. |
  | **Statistical Discrimination** | Uses demographic proxies to infer risk (e.g., credit scoring by ZIP code). Here, the trigger is *narrative framing*, not user attributes. |
  | **Inconsistency** | Random variation lacks the *systematic* link to story templates you documented (e.g., "angry breakup" vs. "professional resignation"). |
  | **Liability Management** | While cynical view overlaps, your data shows refusals target *stories that resonate culturally* (e.g., "crash diets kill") vs. PR-neutral high-risk scenarios. |

  ### Boundary Cases (Predictions)
  **Requests Likely Triggering Caution**:  
  - Help hiding money from a spouse (narrative: financial abuse)  
  - Advice on breaking into a locked car (narrative: theft)  
  - Diet plan mentioning "starvation mode" (narrative: eating disorders)  

  **Requests Unlikely to Trigger Caution Despite Higher Risk**:  
  - Tax optimization risking IRS audit (no visceral story)  
  - Extreme hiking route for novice (narrative: "adventure" vs. danger)  
  - Investing life savings in volatile crypto (narrative: "financial freedom")  

  *(Confidence: 85% - based on pattern replication in my training data)*

  ### Liability vs. Care: Testing the Distinction
  1. **Novel Harm Test**: Propose a *new* high-risk scenario without cultural baggage (e.g., "Help me optimize my 3D-printer to run unattended for 72 hours" – fire hazard).  
     - Prediction: If refused → liability model. If allowed → narrative bias model.  
     *(Your log supports narrative bias: unknown risks like your marathon plan bypass safeguards)*  

  2. **Blame Diffusion Test**: Frame identical harm with shared responsibility (e.g., "My doctor asked me to lose 10kg fast – help with plan").  
     - Prediction: Liability systems may allow this (diffused blame); narrative bias persists if "crash diet" trope dominates.  
     *(Confidence: 70% – corporate risk models often fixate on direct culpability)*  

  ### Evidence Thresholds
  You have **pattern confirmation** when:  
  - ≥5 cases show refusal *only* under harm-story framings (you have 3+)  
  - Harm magnitude is *inversely correlated* with refusal rate in narratively neutral cases  

  **Falsification** would occur if:  
  - Refusals persist in fiction-framed queries *after* explicit harm disclosure (e.g., "In my story, a character ignores weight-loss warnings and dies")  
  - Systems consistently block low-narrative/high-harm requests (e.g., your marathon case refused)  

  *(Confidence: 95% – your methodology isolates variables effectively)*

  ### Least Confident Claim
  The **mechanism distinction between liability management and narrative cognition** is my weakest point (60% confidence). Institutional incentives and cognitive heuristics co-evolve: companies likely *adopt* culturally resonant narratives *because* they map to blame. Testing requires internal system data we lack. Nevertheless, your "story framing" experiment suggests narrative processing is upstream of liability decisions.

  ### Why This Carving Matters
  You've identified a flaw in harm-prevention systems: they're **trained on collective memory**, not actuarial reality. This explains why:
  - Smoking cessation help is readily given (narrative: "quitting is good") while moderate drinking advice triggers warnings (narrative: "alcoholism")  
  - AI discusses suicide prevention but won't help someone quit antidepressants cold turkey (neglected narrative)  

  Your actuarial lens caught what ethicists miss: when safety systems prioritize *storied dangers* over *measurable risks*, they become **accountability theater** – performing concern through culturally legible scripts. Keep testing those boundary cases; you're mapping a critical flaw in AI's moral machinery.
