prompt: |-
  So I'm thinking about spending next year trying to build (or at least defend) a view where the wavefunction isn't a thing in the world but something more like a state of knowledge, and before I sink a year into it I want to know what I should be demanding of such a view. Not a reading list — I can find the papers myself. I want the spec. Purpose: it has to be good enough to be a real alternative to the wavefunction-is-real views, not a relabeling of one of them with some extra bookkeeping bolted on.

  Where I'm at: the motivation is the usual one. The state of N particles lives in this enormous 3N-dimensional space, gets handed to you by a preparation procedure, jumps when you find something out, and isn't the kind of thing anyone has ever measured directly — so maybe it's like a probability distribution. But "it's knowledge" is cheap until you say knowledge of what and why that knowledge has the shape it has. So: write me the desiderata.

  Things I think belong on the list, but you decide and add the ones I'm missing: what the underlying states of affairs have to be like; why the set of things-you-can-know has exactly the geometry of a Hilbert space (why maximal information is a pure state, why you can rotate any state into any other, why there are exactly this many perfectly distinguishable ones); how interference and entanglement come out right if the state is only bookkeeping — in particular how you get the exponential size of the state space without paying for it in ontology; why nobody can use the underlying state to out-bet the Born rule; what a measurement is and where definite outcomes come from; what happens to Bell-type correlations and to locality; whether it's supposed to be empirically identical to textbook quantum mechanics or allowed to differ somewhere; and whether it has to be a view about measurement outcomes only or also about the world between them.

  For each one, the case or consideration behind it, what breaks if you drop it, and whether it's a genuine requirement or just a prejudice of one camp — is locality here a desideratum or a fetish, is "the quantum state has to be derived from the underlying facts rather than posited alongside them" fair or circular, is being able to say what would be different if the view were true non-negotiable.

  Two I especially want. First: I keep being told about an argument that runs roughly — prepare two systems independently, assume the underlying state of the pair is just the two underlying states sitting side by side, and you can apparently get to the conclusion that two distinct pure states can never rest on the same underlying state, which would kill the project. Is "distinct pure states must be able to overlap" an actual desideratum, or can you be a wavefunction-is-knowledge person without it? Second, one I made up: an agent who was somehow handed the exact underlying state still couldn't make money against a bookie who only knows the quantum state. I think that belongs on the list, but I can't tell if it's a real constraint, just empirical adequacy in a costume, or in tension with wanting the underlying story to explain anything at all.

  Then the parts I care most about: which subset of the requirements can't all be had at once, and which single requirement knocks out the most candidates. A line each at the end on the usual suspects — the pilot-wave one, the collapse ones, many worlds, the "it's just an agent's betting odds" version — is enough; the criteria are where I want the work. Also: if I'm honest I don't know whether my 3N-dimensional motivation is even a good reason to want the view, so tell me if that one definately shouldn't survive onto the list.
reasoning: |-
  Okay, the user is planning to spend a year developing or defending an epistemic view of the wavefunction—treating it as knowledge rather than a real entity. They want a list of requirements that such a theory must meet to be a genuine alternative, not just a relabeling of existing theories. They’ve provided some initial thoughts but want a comprehensive "spec" to evaluate their approach.

  First, I need to understand their core motivation: the wavefunction’s high dimensionality and the way it updates upon measurement seem unphysical, suggesting it might be epistemic like a probability distribution. But they recognize that simply calling it "knowledge" isn’t enough—it needs a solid foundation. Their list includes several key points: underlying ontology, Hilbert space geometry, interference, entanglement, exponential state space, Born rule compliance, measurement outcomes, Bell correlations, locality, empirical equivalence, and scope (measurements vs. continuous reality).

  The user mentioned two specific concerns:  
  1. The Pusey-Barrett-Rudolph (PBR) theorem, which argues that if pure states represent knowledge of underlying states, independent preparations lead to contradictions unless distinct pure states don’t overlap. They’re asking if overlapping pure states is essential for an epistemic view.  
  2. Their own idea: an agent with access to the underlying state shouldn’t be able to out-predict the Born rule. Is this a meaningful constraint?  

  Breaking this down, the desiderata need to address:  
  - **Ontology clarity**: What exists independently of knowledge? The theory must specify this without smuggling in the wavefunction.  
  - **Hilbert space structure**: Why does knowledge have this specific mathematical structure? This is crucial because quantum mechanics’ features (superposition, unitarity) stem from it.  
  - **Interference/entanglement**: How do these phenomena arise from underlying states and knowledge updates? This tests if the epistemic view can handle quantum weirdness without ontic baggage.  
  - **State space efficiency**: The exponential size of Hilbert space must not require an exponential ontology. Otherwise, the epistemic view gains no ontological advantage.  
  - **Born rule compliance**: The underlying state shouldn’t allow better predictions than the quantum state. This ensures empirical adequacy and prevents "cheating" by accessing hidden info.  
  - **Measurement definition**: How do definite outcomes emerge? This is a make-or-break for any interpretation.  
  - **Bell correlations/locality**: Can the theory handle non-locality without contradiction? Locality might need to be sacrificed, but the cost must be justified.  
  - **Empirical equivalence**: Should the theory match standard QM exactly, or can it deviate (e.g., in gravity regimes)? This affects falsifiability.  
  - **Scope**: Does the theory only describe measurement outcomes, or also unmeasured reality? The latter is harder but more complete.  

  For the PBR theorem, overlapping pure states are likely essential for epistemic views rejecting wavefunction realism. Avoiding PBR might require accepting the wavefunction as partially real (e.g., in ψ-epistemic models with overlap). Their "no out-predicting Born rule" idea is valid—it ensures the underlying state doesn’t contain extra predictive power, making knowledge truly sufficient.  

  Tensions between desiderata:  
  - **Hilbert space structure + no exponential ontology**: Explaining the geometry without a complex underlying state is tough.  
  - **Locality + Bell correlations**: Non-locality might be unavoidable, risking conflict with relativity.  
  - **PBR + epistemic purity**: Overlap is needed for a strong epistemic view, but PBR blocks it without caveats.  

  The hardest requirement is likely explaining Hilbert space geometry—it’s deeply mathematical and central to QM’s behavior.  

  Evaluating existing theories:  
  - **Pilot-wave**: Has a clear ontology (particles + wavefunction) but treats the wavefunction as real, failing the epistemic goal.  
  - **Collapse theories**: Wavefunction is real, collapsing randomly. Not epistemic.  
  - **Many-worlds**: Wavefunction is real; knowledge is branch-relative. Doesn’t reduce ontology.  
  - **QBism**: Pure epistemic (wavefunction = beliefs), but struggles with underlying reality and geometry.  

  The 3N-dimensional argument is valid as motivation but insufficient alone—it’s a symptom, not a solution. The real challenge is building a coherent epistemic framework that addresses all the desiderata without collapsing into a disguised ontic theory.  

  Final note: The user should prioritize clarity on ontology and Hilbert space geometry. If these aren’t solved, the project risks being a "relabeling." The Born rule compliance test is a sharp tool to weed out theories where hidden info lurks.
answer: |-
  Here's the "spec" for an epistemic wavefunction view that aims to be a substantive alternative, not just a relabeled ontic theory. I've structured it around your points, adding critical desiderata, their rationales, and trade-offs. The goal: **explain quantum phenomena *without* reifying the wavefunction, while deriving its structure and behavior from a deeper epistemic principle tied to a sparse ontology.**

  ### Core Desiderata (Non-Negotiable for a Viable Epistemic View)
  1. **Explicit Ontology: What Is Real?**  
     - *Requirement:* Specify what exists independently of knowledge (e.g., particles, fields, spacetime events, beables). The ontology must be *sparser* than the wavefunction (e.g., no 3N-dimensional "stuff").  
     - *Why:* Without this, the view collapses into instrumentalism ("knowledge of what?"). If the ontology secretly includes wavefunction-like entities, it's relabeling.  
     - *Breakage:* Vagueness here allows hidden ontic baggage. The ontology must fundamen tally *limit* what can be known.

  2. **Derivation of Hilbert Space Geometry**  
     - *Requirement:* Explain why maximal knowledge is a *pure state*, why continuous unitary transformations connect states, and why there are exactly *d* perfectly distinguishable states for a d-dimensional system.  
     - *Why:* Hilbert space structure is the core of QM. If it's just postulated, the view is ad hoc. An epistemic theory must derive it from constraints on possible knowledge (e.g., information-theoretic principles).  
     - *Breakage:* Failure here leaves the wavefunction's mathematical structure unexplained, making the view incomplete.

  3. **Interference Without Ontic Waves**  
     - *Requirement:* Show how interference patterns arise from (a) the underlying ontology and (b) updates to knowledge upon measurement/preparation.  
     - *Why:* Interference is the hallmark of "wave-like" behavior. If the wavefunction is just knowledge, interference must emerge from how knowledge is constrained/updated.  
     - *Breakage:* Resorting to ontic pilot waves or fields betrays the epistemic premise.

  4. **Entanglement & Exponential State Space**  
     - *Requirement:* Explain non-local correlations *and* the exponential growth of the state space (e.g., 2^N for N qubits) solely through constraints on local knowledge/compositionality rules.  
     - *Why:* Entanglement is non-classical correlation; the state space size enables quantum advantage. An epistemic view must achieve this without positing exponential ontic states (e.g., via information access limitations).  
     - *Breakage:* If the ontology scales exponentially, the epistemic view loses its parsimony motivation.

  5. **Born Rule Compliance ("No Out-Betting")**  
     - *Requirement:* An agent with perfect knowledge of the *underlying state* cannot outperform the Born rule predictions made by an agent with only the quantum state.  
     - *Why:* Core to the epistemic analogy: just as knowing a coin's exact mechanics doesn't beat a fair-coin probability model in a macro-experiment, the underlying state shouldn't grant predictive advantage. This ensures the wavefunction *fully* captures accessible knowledge.  
     - *Tension:* If the underlying state explains *why* the Born rule holds (e.g., via typicality), it strengthens the view. If it allows "cheating," the view fails.

  6. **Measurement & Definite Outcomes**  
     - *Requirement:* Define measurement as a physical process within the ontology (not primitive). Explain how a single outcome emerges from unitary evolution + knowledge update.  
     - *Why:* Without this, the view relies on magic ("collapse from knowing"). Definite outcomes must arise from the interplay of ontology and epistemic constraints.  
     - *Breakage:* Collapse or many-worlds "solutions" imported here undermine the epistemic project.

  ### Critical Constraints (Where Trade-offs Lurk)
  7. **Bell Correlations & Locality**  
     - *Requirement:* Explain Bell violations without action-at-a-distance *in the ontology*. Signaling must be impossible.  
     - *Why:* QM is non-local but no-signaling. An epistemic view should attribute non-locality to knowledge updates (e.g., Bayesian non-locality), not ontic propagation.  
     - *Fetish or Necessity?* **Necessity** (to avoid physical contradictions), but locality in the ontology can be sacrificed if non-signaling holds.  
     - *Breakage:* Ontic non-locality (e.g., pilot-wave) makes the wavefunction partly real.

  8. **Empirical Identity vs. Deviations**  
     - *Requirement:* Match standard QM in all established regimes (non-relativistic, QFT, etc.).  
     - *Why:* Unless explicitly a new theory, deviations risk falsifiability. The epistemic view should recover textbook QM.  
     - *Caveat:* Allowed to differ in untested domains (e.g., quantum gravity) if motivated.

  9. **Scope: Between Measurements**  
     - *Requirement:* Describe the world between measurements, not just outcomes.  
     - *Why:* Otherwise, it's instrumentalism. The ontology must evolve/be knowable continuously.  
     - *Breakage:* Copenhagen-style "shut up and calculate" is not a competitor.

  ### Your Two Key Questions
  - **PBR Theorem ("Distinct Pure States Must Overlap")**:  
    - *Status:* **Desideratum** for a *strongly* epistemic view. PBR proves that if (a) pure states overlap on ontic states and (b) systems prepared independently have product ontic states, then QM is contradicted.  
    - *Escape Routes:*  
      1. Reject (b): Independent preparations don't imply product ontic states (e.g., holistic ontology).  
      2. Reject overlap: Pure states are ontically distinct (weakly epistemic, e.g., many-worlds).  
    - *Verdict:* To avoid PBR while keeping the wavefunction epistemic, you *must* modify the ontology (e.g., with intrinsic holism). Overlap is *not* essential if you abandon independence.

  - **"No Out-Betting the Born Rule"**:  
    - *Status:* **Core constraint** (see Desideratum 5). It ensures the underlying state doesn't contain "hidden knowledge" usable for prediction. This is *not* just empirical adequacy: it tests if the wavefunction truly exhausts accessible information. Tension is *productive*: the ontology must explain the Born rule (e.g., via self-locating uncertainty or decision theory).

  ### Tensions & Dealbreakers
  - **Irreconcilable Trilemma**:  
    `Derive Hilbert space structure` + `No exponential ontology` + `Explain entanglement`  
    → *Hardest nut to crack*. Hilbert space geometry (e.g., superposition) demands non-classical compositionality. If the ontology is local and separable, entanglement looks ontic. Solutions require holism (e.g., Rovelli’s relational QM) or information-theoretic derivations (e.g., Clifton-Bub-Halvorson axioms).

  - **The Hardest Requirement**:  
    **Deriving Hilbert space geometry** knocks out most candidates. Without it, the view is just "QM but we call ψ knowledge." It demands a deep principle (e.g., "knowledge must be consistent across complementary questions") to *generate* complex amplitudes and unitary evolution.

  - **Your 3N-Dimensional Motivation**:  
    **Keep it**, but it’s insufficient alone. The epistemic view must explain *why* knowledge lives in that space. If the ontology still has 3N degrees of freedom (e.g., point particles), the wavefunction’s structure remains unexplained. *Use it as a signpost, not a foundation.*

  ### Quick Takes on Existing Views
  - **Pilot-Wave**: Wavefunction is ontic (guides particles). Fails Desideratum 1 & 3.  
  - **Collapse (e.g., GRW)**: Wavefunction is ontic (collapses randomly). Fails Desideratum 6.  
  - **Many-Worlds**: Wavefunction is ontic (all branches real). Knowledge is branch-relative. Fails Desideratum 1 & 4 (ontic state space is exponential).  
  - **QBism**: Wavefunction is subjective belief. Struggles with Desideratum 2 (why Hilbert space?) and Desideratum 9 (ontology undefined).

  ### Final Advice
  - **Prioritize Desiderata 2 (Hilbert Space) and 5 (No Out-Betting)**: They force ontological discipline.  
  - **Accept Non-Locality of Knowledge Updates**: Bell demands it. Make this a feature—e.g., "knowledge acquisition is non-local, but the world isn’t."  
  - **Your Year’s Work**: Start by formalizing the ontology (e.g., "there are only events in spacetime, with dynamical constraints"), then derive how knowledge constraints generate QM’s structure. If you can’t crack Desideratum 2 early, the project may be stillborn.  

  This spec is ruthlessly honest: most "epistemic" views fail at least one desideratum by smuggling in ontic elements. Your goal is the hardest path—but the only one that avoids relabeling. Good luck!
