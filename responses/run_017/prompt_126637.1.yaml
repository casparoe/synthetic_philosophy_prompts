prompt: |-
  You are a professional epistemologist who has taught graduate seminars on higher-order evidence and who is also known for being able to make graduate-level material land for people outside the field. Please think this through carefully before you answer, and commit to definite choices: I want one plan with reasons attached, not a menu of options I have to pick from.

  I'm a late-stage PhD student writing on epistemic akrasia, and I've just been asked at fairly short notice to run a single ninety-minute session on higher-order evidence for a cognitive-science lab group: maybe a dozen PhD students and postdocs, comfortable with base rates, signal detection and calibration, essentially no epistemology, and inclined to think that anything worth saying about evidence can be said with a likelihood ratio. The timing is awkward for me personally: the session is in a week, and my supervisor has just told me that the case my own paper turns on is doing much less work than I think it does, so I'd like the session to double as a test of whether the case has any real grip. The case is one I invented, and it isn't from anything published: call it the Long Shift. A reader of medical scans learns that she belongs to a subgroup of readers whose error rate roughly doubles on late shifts, which is a reason to distrust the very process that produced her current diagnosis; but the study establishing that elevated error rate was itself scored by late-shift readers, so the higher-order evidence seems to reflect back on her standing to trust the higher-order evidence. I use it to separate what I call process-level higher-order defeat, where the evidence targets the reliability of the first-order process, from reflexive defeat, where it also targets the agent's standing to assess the higher-order evidence itself, and to argue that the two differ in whether the resulting combination is genuinely akratic or merely unlucky. I'm not asking you to explain any of this to me. I'm asking you to plan how I explain it to them.

  So give me the architecture of the session rather than the content. What has to be in place before the akrasia question is even intelligible to this audience — does "rational" have to be prised apart from "well-calibrated" first, and does the difference between a reason bearing on the world and a reason bearing on one's own reliability have to be explicit before any of it can bite, or can that distinction be allowed to emerge from the example? In what order should the pieces appear, and what breaks if they appear in a different order? Which single example should carry the session, and please tell me honestly whether it should be my Long Shift case or something plainer, with the case surfacing at the end as a test instead: if it is to carry the session, what must it have and what must it lack to do that work? Then the misconceptions, in the order I should expect them, with the exact point in the sequence where each should be headed off rather than answered: I expect someone to flatten the two levels into one more piece of first-order evidence and update straight through it, someone to hear "akrasia" and reach for weakness of will, someone to conclude from the spinelessness worry that higher-order evidence should simply be ignored, and someone to treat the conciliatory response as intellectual modesty by another name — tell me which of these I'm wrong about, which one is really the load-bearing one, and which ones are worth deliberately letting stand for a few minutes because resolving them early would cost more than it buys. I'd also like you to name what I should openly refuse to explain at this level and say so out loud to the room: I'm inclined to refuse the uniqueness-versus-permissivism dispute and anything turning on formal calibration or accuracy results, but argue me out of it if you think I'm cutting the wrong things. Finally, give me one question I can put to the group at the end, or one small variation on the carrying case, whose answer would show me they've grasped the structure rather than picked up the vocabulary.

  Be committed and be calibrated about it: give me one ordering with your reasons, tell me which of your calls are judgment calls I could reasonably overrule and which you'd defend against me, and say plainly where you think I'm wrong about my own case or about what the audience will find hard. Please don't give me a reading list or cite papers — I want your own sense of the material, and I can find the literature myself.
