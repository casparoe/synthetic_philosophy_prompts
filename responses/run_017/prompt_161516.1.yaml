prompt: |-
  I do a podcast about ideas that wreck people's intuitions — I'm a science journalist, not a philosopher, so assume I already know the pop-level stuff (Pascal's mugging, the EA habit of multiplying huge stakes by tiny probabilities, the St Petersburg flavor of worry) and skip the 101.

  Next week's guest is a philosopher who defends expected value fanaticism straight up: no discounting small probabilities, no cap on utility, no threshold below which you're allowed to ignore a payoff — if the expected value is positive at any nonzero probability, you take it. I've read enough to know his two stock moves: the arbitrariness jab (pick any cutoff and I'll ask why *there*, and there's no non-arbitrary answer) and the step-by-step argument where each individual trade looks obviously fine but the endpoint is handing your wallet to a mugger. Assume he's already made both, and don't let him just restate them.

  Give me eight to ten questions, each with a follow-up keyed to the answer he's most likely to give. At least one on each of these:

  - The audit problem. At the probabilities that do the work here, the numbers come out of models with no track record — so the view seems to relocate all the action into the probability estimate rather than the value. Bit of scaffolding for you: a fictional Office of Long Shots that funds whatever tops the speculative-EV league table, staffed by people who know they'll never live to learn whether they were right. Ask him what its budget should be, and how it audits models it can never validate.
  - The portfolio point. One one-in-a-million shot at an astronomical payoff feels insane; ten thousand of them, pooled, looks like venture capital or a research portfolio and starts to feel sane. Does fanaticism get more plausible in basket form, and if so does that make the single-shot mugging intuition untrustworthy as evidence *against* the view?
  - Negative fanaticism. Is it symmetric? A tiny chance of astronomically bad outcomes — does the same reasoning that drags you toward the upside also let a micro-probability of catastrophe dominate every ordinary choice and freeze us, or is there an asymmetry he can defend?
  - The branch you actually land in. Take the long shot every time and you lose essentially always. What does the view say about the value of the 99.99999% world you burned the money in — does it commit him to a kind of indifference to what actually happens, and is that a bullet he bites or a cost he's been hiding?

  Close with one question about what would count as evidence against the view — not "what if the mugger is lying," I mean what actual empirical or theoretical finding would make him give it up.
reasoning: |-
  Okay, the user is a science journalist hosting a podcast about counterintuitive ideas. They're interviewing a philosopher who defends expected value (EV) fanaticism without any adjustments for small probabilities or utility caps. The user wants deep, non-introductory questions, avoiding the philosopher's common arguments about arbitrariness and step-by-step reasoning. They've outlined four specific areas to cover: audit problems, portfolio effects, negative fanaticism, and the consequences of actual outcomes. They also want a closing question on what evidence could falsify the view.

  First, I need to ensure each of the four areas is addressed with at least one question. The audit problem deals with the reliability of models predicting low-probability events. The portfolio point questions whether pooling many small bets makes fanaticism more reasonable. Negative fanaticism explores symmetry with catastrophic risks. The "branch you land in" focuses on the disconnect between expected value and actual outcomes.

  For each main question, I should craft a follow-up that anticipates the philosopher's likely response. For example, on the audit problem, he might argue that decision theory shouldn't be altered just because models are imperfect. The follow-up could challenge how to allocate resources without feedback loops. 

  The portfolio angle might lead him to agree that pooled bets reduce variance. The follow-up would then question if this undermines single-case intuitions, forcing him to either defend the mugging scenario or concede it's an outlier.

  On negative fanaticism, he might claim asymmetric stakes (e.g., extinction vs. utopia) break symmetry. The follow-up could press him to justify that asymmetry within strict EV principles.

  For the actual outcomes issue, he might bite the bullet on outcome indifference. The follow-up would challenge whether this conflicts with human values, possibly making the theory impractical.

  The closing question about falsification needs to avoid trivial scenarios (like the mugger lying). Instead, focus on structural limits—maybe unbounded utility leading to contradictions, or empirical psychology showing humans can't handle such calculations.

  I should ensure questions avoid rehashing arbitrariness or step-by-step arguments. The user wants novel angles. Also, since the guest is a philosopher, questions need technical precision but remain accessible for a podcast audience. Each question should push the philosopher to reveal deeper commitments or potential weaknesses in his view.

  Finally, structure eight to ten main questions with follow-ups, ensuring coverage of all specified areas. The closing question should tackle falsifiability, perhaps referencing decision theory paradoxes or practical infeasibility as evidence against fanaticism.
answer: |-
  Here are 10 targeted questions probing EV fanaticism's practical coherence, each with a follow-up designed to cut deeper, avoiding rehashing arbitrariness or step-by-step mugging arguments:

  1.  **The Audit Problem - Model Validation:** "Assume your Office of Long Shots uses the most sophisticated models available to estimate probabilities for astronomical payoffs. Given these models have *zero* empirical track record for predicting events at the relevant (e.g., 1-in-10^12) probability scales – and never *will* have a track record within any human lifetime – how does the Office rationally decide *which* speculative models to fund? Is it just the one yielding the highest EV *this week*, even if that model changes drastically tomorrow with no real-world validation possible?"
      *   *Likely Answer:* "We use the best available credences based on current evidence and theory. Decision theory tells us how to act *given* probabilities, not how to validate them."
      *   **Follow-Up:** "But doesn't this relocate *all* the weight onto the fragile, unverifiable probability estimate? If the Office's entire funding flows to whichever speculative model currently outputs the biggest EV number, with no feedback loop *ever* confirming its calibration at the crucial low-probability tail, isn't this functionally indistinguishable from funding whichever theorist is best at constructing arbitrarily large numbers?"

  2.  **The Audit Problem - Resource Allocation:** "Sticking with the Office: If EV fanaticism demands allocating *some* resources to these speculative long shots, how does the Office determine *how much* of its total budget to dedicate to them? Should it spend 1%, 50%, or 99% of its funds on the current top EV plays, given that these funds are *diverted* from interventions with empirically validated probabilities and smaller, but more certain, payoffs?"
      *   *Likely Answer:* "It allocates resources to maximize overall expected value. This involves comparing the EV of speculative plays against the EV of known interventions."
      *   **Follow-Up:** "But since the EV of the speculative play is generated by multiplying a completely ungrounded probability estimate by an arbitrarily large utility number, doesn't this mean the *mere existence* of a theorist positing a sufficiently large payoff (e.g., 10^100 utils) with a non-zero probability (e.g., 10^-50) will *always* dominate the empirically grounded EV of malaria nets or vaccines? Doesn't the Office inevitably become bankrupt funding only the most extreme speculation?"

  3.  **Portfolio Effect - Diluting Insanity:** "Many find a single Pascal's Mugging intuitively insane, but find diversified portfolios (like VC, basic research, asteroid defense) investing in *many* independent, high-variance, long-shot bets intuitively rational. Doesn't this suggest the core intuition against fanaticism arises from the *variance* and *single-point-failure* nature of the mugging, not the EV calculation itself? If so, is the mugging actually poor evidence *against* EV maximization, highlighting instead the irrationality of *not* diversifying extreme long shots?"
      *   *Likely Answer:* "Yes, diversification is crucial for risk-averse agents, but the core EV logic for each positive-EV bet holds independently. The mugging highlights an *implementation* problem (variance), not a flaw in the *principle* of maximizing EV."
      *   **Follow-Up:** "If pooling renders the *practical implementation* of fanaticism sensible (by reducing ruinous variance), doesn't this imply that the standard 'hand over your wallet' mugging scenario is a misleading edge case precisely *because* it's presented in isolation? Shouldn't the defender of EV maximization primarily advocate for institutional structures (like diversified funds) to harness long shots, rather than defending the lone individual handing cash to a mugger?"

  4.  **Portfolio Effect - The Mugger's Fund:** "Building on diversification: If I offered you a single $100 bet on a 1-in-a-million chance of a $10 billion payoff (EV +$10,000), fanaticism says take it. If I offered you ten *thousand* independent bets of $100 each on similar 1-in-a-million $10B payoffs, fanaticism *also* says take it. Yet the second scenario feels *less* insane, almost rational, due to diversification. Does this mean the intuition that the *first* bet is insane is actually an intuition about *undiversified exposure*, not about the core EV math? Should we distrust the mugging intuition as evidence?"
      *   *Likely Answer:* "The intuition against the single bet often stems from psychological aversion to high-stakes loss on a likely loss, or perhaps an implicit recognition of the need for diversification in practice. The EV math remains sound for each bet."
      *   **Follow-Up:** "If the core objection to the single mugging bet is really about *implementation risk* (being wiped out) rather than the EV calculation, doesn't that concede that strict EV maximization *as a personal decision procedure* might be practically self-defeating without institutional support? Is fanaticism only viable at a systemic level?"

  5.  **Negative Fanaticism - Symmetry Test:** "Your argument hinges on the unboundedness of *positive* utility. But doesn't logic demand symmetry? If there exists a non-zero probability of an outcome with *disutility* approaching negative infinity (e.g., permanent suffering, existential catastrophe with negative value), wouldn't EV fanaticism demand we devote *all* resources to mitigating that micro-risk, completely paralyzing action on any positive but finite project, no matter how certain or beneficial?"
      *   *Likely Answer:* "There might be structural asymmetries. Perhaps negative utility is bounded (e.g., death is the worst), or the probabilities of truly infinite negative outcomes are incoherent/effectively zero in a way positive ones aren't."
      *   **Follow-Up:** "Can you ground this asymmetry rigorously *within* the framework of expected value theory itself? If not, aren't you smuggling in an *ad hoc* limitation to avoid the paralyzing conclusion? Doesn't the mere *possibility* of a model assigning a non-zero probability to an outcome with sufficiently large *negative* utility (even if not infinite) force fanaticism into paralysis?"

  6.  **Negative Fanaticism - The Dominant Micro-Risk:** "Suppose a credible model assigns a 1-in-10^20 probability per century to a physics experiment triggering vacuum decay destroying the observable universe, assigning this a utility of -10^100. According to fanaticism, doesn't the expected disutility of this (-10^100 * 10^-20 = -10^80) completely dominate the positive EV of *any* action with finite positive payoff (e.g., curing cancer, +10^15 utils)? Doesn't this imply we should literally do *nothing* except fund research to reduce this specific micro-risk by the tiniest fraction?"
      *   *Likely Answer:* "We must consider the probability of the model being *correct* and whether the disutility is truly that large. But *if* we accept those inputs, yes, it would dominate."
      *   **Follow-Up:** "Given the ease with which such catastrophic micro-risks can be *conceived* (and assigned non-zero probability by *some* model), doesn't fanaticism effectively grant veto power over all other activities to *anyone* who can articulate a sufficiently dire, sufficiently vague, and minimally plausible catastrophe scenario? Isn't this paralyzing?"

  7.  **The Branch You Land In - Indifference to Reality:** "An agent following fanaticism will lose almost every single bet they make on extreme long shots. In the overwhelming majority of actual worlds (the branches they land in), they are materially worse off – they've burned resources on futile projects or handed money to muggers. What does your theory say about the value *in those actual worlds*? Does it imply that the agent *should be indifferent* to the actual outcome in their specific branch, valuing only the ex-ante expectation?"
      *   *Likely Answer:* "Rationality is about making the best decision *with the information available at the time*. Hindsight bias shouldn't condemn the ex-ante rational choice."
      *   **Follow-Up:** "But doesn't this commit you to a profound *alienation* from actual outcomes? If the agent, in the world they *actually inhabit* (which is almost certainly a losing one), rationally shouldn't *regret* following fanaticism, and indeed *should* feel they acted optimally despite being worse off, doesn't this sever the connection between the theory and human notions of welfare, success, or even rational satisfaction? Is fanaticism a theory for agents who don't care about the world they actually experience?"

  8.  **The Branch You Land In - Cost of Losing:** "Following fanaticism systematically likely leads to personal bankruptcy or resource depletion long before hitting a mega-payoff. How does the theory account for the *opportunity cost* in the losing branches? The resources spent on futile long shots could have been used for near-certain, significant benefits. Doesn't the *certainty* of incurring these massive opportunity costs in the vast majority of actual futures outweigh the tiny chance of a win?"
      *   *Likely Answer:* "The opportunity cost is already factored into the EV calculation. You only take the bet if the expected gain outweighs the expected loss, including the alternative uses."
      *   **Follow-Up:** "But in the mugging or speculative funding case, the *magnitude* of the potential win is so large it mathematically dwarfs the opportunity cost *in expectation*. However, *in every single instance where you lose* – which is almost every time – the opportunity cost *is actually incurred* and represents a *real, absolute loss* of welfare in that world. How can a theory that systematically generates *actual, frequent losses* for the agent be considered a guide to *their* welfare maximization?"

  9.  **The Branch You Land In - Self-Defeating Trajectory:** "If an agent consistently applies fanaticism throughout their life, isn't the *most probable actual outcome* that they end up destitute, having given away significant resources on countless losing long shots? Doesn't this mean the *trajectory dictated by the theory* leads, with near certainty, to a state of significantly *reduced capacity* to pursue *any* valuable outcomes (positive EV or otherwise)? Isn't the strategy self-defeating over time?"
      *   *Likely Answer:* "The theory implies you only take bets you can *afford* to lose without catastrophic ruin to your future capacity to make positive-EV choices. Diversification also mitigates this."
      *   **Follow-Up:** "But doesn't 'afford to lose' implicitly introduce a *de facto* utility cap or risk threshold? If the potential payoff is truly astronomical (e.g., saving 10^20 lives), shouldn't fanaticism demand risking *everything* (even your future capacity) on any non-zero chance? If you *don't* risk everything, haven't you admitted a boundary to the applicability of pure EV?"

  10. **Falsification - The Core Challenge:** "Finally, let's set aside specific scenarios like untrustworthy muggers. What *kind* of empirical result, theoretical argument, or demonstrable practical consequence would constitute sufficient evidence for you to abandon strict, unbounded expected value maximization as the *sole* principle of rational choice? What is the theory's breaking point?"
      *   *Likely Answer (Defensive):* "It would require showing that maximizing EV *doesn't* maximize expected goodness, or that unbounded utilities are incoherent, or that probability zero is the only way to avoid absurdity – but I find these unconvincing." / *Likely Answer (Biting Bullet):* "Nothing. It's a fundamental axiom."
      *   **Follow-Up:** "If no conceivable practical failure (like systemic resource misallocation or paralysis) or theoretical tension (like the dominance of unverifiable models or paralyzing negative fanaticism) can falsify it, doesn't this place EV fanaticism outside the realm of empirically or practically grounded normative theories? Does it become more of a formal mathematical commitment than a guide to real-world decision-making?"

  **Key Angles Covered:**
  *   **Audit Problem:** Q1 & Q2 directly tackle model validation and resource allocation with unverifiable probabilities.
  *   **Portfolio Point:** Q3 & Q4 explore how diversification changes the intuition and whether it exposes the mugging as a red herring.
  *   **Negative Fanaticism:** Q5 & Q6 probe the (a)symmetry with catastrophic risks and the threat of paralysis.
  *   **The Branch You Land In:** Q7, Q8 & Q9 confront the consequences of almost always losing and the disconnect from actual outcomes.
  *   **Falsification:** Q10 directly asks for the exit ramp.

  These questions force engagement beyond the initial defenses, pushing on practical implementation, coherence under diversification, consequences in actuality, and the theory's vulnerability to criticism. Good luck with the interview!
