prompt: |-
  Me and a mate got into a three-hour argument last night and I need something better than either of us managed. He's read a bit of philosophy and kept saying that picking forecasting models is just the problem of induction in a lab coat: the only reason we trust the model that did well last season is that it did well last season, and there's no non-circular way to justify that, so we might as well pick the winner and stop pretending. I kept saying the no-free-lunch results back him up in a nastier way: average over every possible problem and every method does exactly the same, so a benchmark win can't be evidence that the method is better in general, only that it happens to match the particular distribution of problems the benchmark sampled. Then we realised neither of us could say what should actually happen on Monday morning, and we left it there.

  Context: I'm one of three people on the forecasting review panel at a national public health agency. Twice a year we pick which submitted model becomes the official seasonal forecast for respiratory disease — the number that triggers stockpile orders, staffing plans and the briefing to ministers. Two weeks per round, three of us (me, an epidemiologist, and one statistician who is part-time and shared with another team), and we have to produce a one-page justification that a senior civil servant signs. Submissions come with a shared track record: last three seasons, scored at roughly forty locations, but the scoring set was proposed by the submitting teams themselves and a lot of the tuning happened after they'd already seen the outcomes.

  What I want is a decision procedure we could actually run on a submission, in the order we'd run it, with what counts as a sufficient answer at each step:

  - What is the method's inductive bias, stated in one sentence — what does it assume about the world that its competitors don't? If the team can't say, that's a stop.
  - Does the benchmark actually discriminate that bias? My idea is a mirror test: ask for the same model with that assumption flipped (smoothness turned into jumpiness, the seasonal trend reversed, the contact structure randomised) and see whether the mirror does worse. If the mirror does about as well, the win isn't coming from the bias we're being asked to bet on. Is that test sound as I've put it, and is there a cheaper version we can run in two weeks without asking the submitters to build another model?
  - Was the record earned prospectively — forecasts lodged before outcomes were known, on units the panel chose rather than the team — and how do we score a submission that is part prospective and part not?
  - Is the structure the method exploits still there this season? New dominant strain, changed reporting lag, moved school terms, behaviour after the last bad season. What counts as a sufficient answer to the world hasn't drifted?
  - Selection effects: with around forty submissions the top score is inflated just by being the maximum. How do we compare a submission against the whole pool rather than against the winner, and how large a gap has to be before it means anything?
  - Where does the procedure stop with a straight no, and where does it hand the question back to us as a values call — e.g. under-predicting a severe season being far worse than over-predicting?

  Then run it on three cases: (a) Meridian, a mechanistic compartmental model, won the last two seasons, submitted by the team that also runs the surveillance system, but only ever scored at locations they chose, and it's the model the minister already likes; (b) Halcyon, a new machine-learning ensemble that topped the table last season, with a margin that comes almost entirely from the fortnight around the holidays when reporting collapses, and it was retuned on the same seasons it was scored on; (c) the boring baseline, last season's curve shifted by the average trend, never wins, never fails badly, and nobody can state what it assumes. I want at least one answer I won't like. I suspect it will tell us to publish a pooled spread instead of picking a winner, which will go down terribly with the people who sign off.

  Also, as you go: separate what is actually settled among people who work on this from what is genuinely contested, and flag it when you're leaning on a contested reading — I don't want something like real-world problems being structured enough to escape the no-free-lunch result, or there being a pragmatic vindication of induction, presented as the consensus. And say plainly what the procedure can't do for us.
reasoning: |-
  Okay, the user is part of a forecasting review panel at a national public health agency. They had a three-hour argument with a colleague about the philosophical problem of induction and no-free-lunch theorems in the context of model selection. They need a practical decision procedure that can be implemented within their constraints—two weeks, three panel members, and a one-page justification. 

  First, I need to address their core concern: how to select a model without falling into circular reasoning or being misled by benchmark wins. The user wants a step-by-step procedure that includes assessing inductive bias, testing if the benchmark discriminates that bias, checking for prospective validation, evaluating distribution shift, adjusting for selection effects, and determining rejection criteria.

  The user mentioned three specific models: Meridian, Halcyon, and the boring baseline. Each has different issues. Meridian is favored but only scored on its own terms. Halcyon performed well during a problematic period and was retuned on the same data. The baseline is simple but lacks explicit assumptions. The procedure needs to handle these cases transparently.

  Deep needs: The user likely wants to justify decisions to higher-ups and avoid political pitfalls. They need defensible, transparent criteria that can withstand scrutiny. They also need to acknowledge where judgment calls are necessary, especially when models involve trade-offs between over/under-prediction.

  The procedure must be feasible within two weeks. Steps like the mirror test might require creative alternatives since building new models isn't practical. For instance, using residual analysis or perturbation tests as proxies. Also, handling mixed prospective/retrospective data and adjusting scores for selection effects using simulations.

  Contested areas: No-free-lunch theorems are theoretical but real-world problems have structures that models can exploit. Induction's justification is philosophical, but pragmatically, models that consistently perform well are trusted. The procedure should flag these as judgment points.

  For each model: Meridian might fail on bias discrimination if its mirror test isn't possible. Halcyon's tuning on the same data raises retrospection issues. The baseline’s lack of explicit bias is a stop but could be accepted as a fallback. The procedure might recommend a pooled forecast, which the user anticipates pushback on.

  Finally, the procedure should clearly state limitations: it can't guarantee future performance, requires expert judgment in areas like distribution shift, and can't eliminate all selection biases. Highlighting these sets realistic expectations for the panel and stakeholders.
answer: |-
  Here's a practical, step-by-step decision procedure grounded in forecasting best practices and acknowledging philosophical limits. It prioritizes defensibility over philosophical purity, designed for your 2-week timeline and high-stakes context. **Key principles:** Focus on *explicit assumptions*, *discriminatory testing*, *prospective validity*, and *robustness checks*. Reject models failing basic criteria; use structured judgment where necessary.

  ---

  ### **Decision Procedure for Forecasting Model Selection**

  1.  **State the Inductive Bias (Stop/Go Gate):**
      *   **Question:** "In one sentence, what core *structural* assumption does this model make about the data-generating process that alternative models do *not* rely on (e.g., specific smoothness, seasonality pattern, causal mechanism, stationarity, functional form)?"
      *   **Sufficient Answer:** A clear, testable statement (e.g., "Assumes infection spread is primarily driven by school term dates," "Assumes weekly case counts are additive across regions," "Assumes a specific SIR contact matrix structure," "Assumes trends are locally linear over 4-week windows").
      *   **Insufficient:** Vague statements ("Uses advanced ML," "Fits historical data well," "Is flexible"). References to general function classes ("Can approximate any smooth function") without specifying *preference* (e.g., via regularization or architecture) are insufficient.
      *   **Action:** If the submitting team cannot articulate this clearly and specifically, **Stop. Reject submission.** (This immediately filters out models lacking a clear "bet" on the world, like the boring baseline).

  2.  **Test if the Benchmark Discriminates the Claimed Bias (Robustness Check):**
      *   **Question:** "Does the historical benchmark performance provide evidence that the model's *specific inductive bias* is beneficial, or could the performance be explained by other factors?"
      *   **Cheap Alternative to Mirror Test (Feasible in 2 Weeks):**
          *   **Residual Analysis:** Analyze the model's forecast errors *in the context of its claimed bias*. Does it fail systematically *where its bias should be most relevant*? (e.g., Does the mechanistic model fail dramatically during school holidays if it claims school terms drive spread? Does the smooth model have huge errors precisely at known discontinuity points like policy changes?).
          *   **Perturbation Test (Partial Mirror):** If feasible within the model framework, perturb the *specific assumption* slightly in a direction that should *hurt* performance if the bias is correct (e.g., slightly shift school term dates in the mechanistic model, add small noise to the assumed contact matrix, increase the regularization parameter penalizing the assumed structure in a ML model). Does performance degrade *significantly more* on the benchmark than when perturbing irrelevant components?
          *   **Compare Errors Against Simpler Baselines:** Does the complex model outperform a very simple model (like the boring baseline) *specifically* on periods/regions where its claimed bias *should* matter? If the complex model wins everywhere uniformly, its bias might not be the driver.
      *   **Sufficient Evidence:** Clear patterns in residual analysis linking failure to bias relevance, significant performance drop on perturbation targeting the bias, or outperformance concentrated where the bias applies.
      *   **Insufficient Evidence:** Performance gains are uniform or concentrated in areas unrelated to the claimed bias (e.g., Halcyon winning only during chaotic reporting periods). No discernible link between error patterns and the stated assumption. A "mirror" perturbation causes negligible harm.
      *   **Action:** If insufficient evidence links the win to the claimed bias, **Flag as Major Concern.** Proceed cautiously; this win may be spurious or driven by factors other than the core assumption. Consider rejection unless strong justification exists.

  3.  **Assess Prospective Validity & Data Hygiene (Stop/Go Gate):**
      *   **Question:** "To what extent was the model's track record earned *prospectively* (forecasts locked *before* outcome known, on *panel-defined* units/locations/times), and how was tuning handled?"
      *   **Scoring:**
          *   **Gold Standard:** Forecasts locked before outcome known, scores calculated *only* on locations/times defined by an independent panel *before* the forecast period, model code/parameters frozen before forecast generation. *No* tuning on the seasons being scored.
          *   **Acceptable (Requires Adjustment):** Forecasts locked before outcome, but locations/times chosen by submitter *or* some tuning occurred using the final scoring data. Requires severity adjustment.
          *   **Retrospective/Invalid:** Forecasts generated or tuned *after* outcomes were known for the scoring period, or scores only on submitter-chosen locations without independent validation. Performance is likely inflated.
      *   **Adjustment for Mixed Records:** For models with partial retrospection:
          *   **Downweight/Discount:** Reduce the importance of scores from retrospective portions. (e.g., Halcyon's tuning on the same data requires its margin to be treated skeptically).
          *   **Focus on Prospective Subset:** Analyze performance *only* on the truly prospective subset of forecasts, if available and meaningful.
      *   **Action:** If the record is predominantly retrospective/invalid (e.g., >50% of score influenced by tuning on scoring data or cherry-picked locations), **Stop. Reject submission.** For mixed records, proceed but heavily discount retrospective portions. Meridian's reliance solely on its own locations is a major red flag requiring scrutiny.

  4.  **Assess Distributional Stability ("World Drift") (Judgment Call):**
      *   **Question:** "Is there evidence that the key structural features or relationships this model's performance *depends upon* (identified in Step 1) have remained stable for the upcoming season?"
      *   **Sufficient Evidence (Requires Proactive Argument):** Submitter must provide *specific* evidence relevant to their core bias. Examples:
          *   *Mechanistic (Meridian):* Evidence dominant strain uses same transmission route/immunity escape? Surveillance system lags unchanged? School term structure identical? Key behavioral drivers stable?
          *   *ML Ensemble (Halcyon):* Evidence the features crucial to its holiday-period win (e.g., web search trends, mobility data patterns, reporting pipeline quirks) remain predictive and structurally similar?
          *   *Baseline:* Evidence the average trend shift assumption holds (e.g., no major new pathogen, no significant change in testing/behavior)?
      *   **Insufficient Evidence:** Vague assurances ("model is robust"), lack of data on relevant changes (e.g., no strain characterization data), or known major disruptions (e.g., new dominant variant with different pathogenesis, significant change in testing policy, major shift in public behavior post-crisis).
      *   **Action:** Cannot be a definitive stop. **Flag as Major Risk.** The panel must judge the severity of potential drift and the submitter's evidence. Lack of convincing evidence shifts burden onto the model – can its performance margin justify the risk? Models highly sensitive to unstable features (like Halcyon's holiday reliance) become less desirable.

  5.  **Adjust for Selection Effects & Pool Comparison (Quantitative Check):**
      *   **Question:** "How exceptional is this model's performance *relative to the entire pool of submissions* on the *prospective/valid portions* of the benchmark, accounting for multiple comparisons?"
      *   **Method:**
          1.  Isolate prospective/valid scores for all models.
          2.  Calculate the **mean performance** and **standard deviation** of the pool for the primary metric(s).
          3.  Calculate the **submission's Z-score**: `(Submission Score - Pool Mean) / Pool Std Dev`.
          4.  **Simulate Chance:** Run a simple Monte Carlo: Assume all models are equally skilled (null hypothesis). Randomly permute the model labels attached to the scores across all locations/seasons in the benchmark. Recalculate the max score each time. Repeat 1000+ times. The proportion of simulations where the max permuted score >= the actual winner's score is the approximate **p-value** for the win being due to chance alone.
      *   **Interpretation:**
          *   Z-Score > 2: Strong signal relative to the pool.
          *   Z-Score 1-2: Moderate signal.
          *   Z-Score < 1: Weak signal, likely indistinguishable from pool noise.
          *   p-value < 0.05: Statistically significant win (less than 5% chance due to random variation alone). p-value < 0.01: Highly significant.
      *   **Action:** Provides context. A large Z-score *and* low p-value strengthen the case. A small margin (low Z-score) or high p-value (>0.1 or even >0.2 is common with 40 models) suggests the win is unimpressive statistically. **Combine with Step 2:** A win with high p-value *and* no evidence linking it to the core bias (Step 2) is highly suspect.

  6.  **Evaluate Asymmetric Risks & Final Decision (Values Judgment):**
      *   **Question:** "Given the model's potential performance, biases, and risks identified above, what is the consequence if it fails? Specifically, is under-prediction likely and what is its cost vs. over-prediction?"
      *   **Analysis:**
          *   Examine historical forecast errors: Does the model *systematically* under-predict peaks? (Look at residuals specifically around peak incidence).
          *   Consider model structure: Does the inductive bias (Step 1) make under-prediction more likely? (e.g., Assumes smoothness might miss sharp turns; assumes stable seasonality might miss early peaks).
          *   Scenario: How bad would a typical under-prediction be for resource allocation? (e.g., Missing a peak by 20% could mean insufficient beds vs. over-predicting by 20% meaning some wasted stockpile).
      *   **Action:** **Critical Judgment Call by Panel.** There is no statistical formula.
          *   If a model shows significant under-prediction risk *and* the cost of under-prediction is deemed very high, it may be rejected even with good overall scores.
          *   Models with demonstrable conservative bias (like the boring baseline) might be favored if robustness is paramount, despite lower peak accuracy.
          *   **Trade-off:** Explicitly state the risk trade-off in the justification. E.g., "Selected Model A for highest overall discriminative accuracy, accepting moderate risk of under-prediction requiring contingency planning" OR "Selected Model B for robust conservative performance, accepting lower peak accuracy to minimize under-prediction risk."

  **Where it Stops:**
  *   **Straight No:** Step 1 (No clear bias), Step 3 (Invalid/Retrospective Record).
  *   **Major Concern/Risk (Potentially Reject):** Step 2 (No link between win and bias), Step 4 (Severe unmitigated drift risk), Step 5 (Win statistically insignificant/Z-score low).
  *   **Values Call:** Step 6 (Asymmetric risk assessment).

  **What it Can't Do:**
  1.  **Guarantee Future Performance:** NFL theorems are theoretically true (*contested: their practical relevance is hotly debated*). This procedure selects the best *defensible bet* based on past evidence and explicit assumptions, not a guaranteed winner.
  2.  **Eliminate Induction:** Hume's problem remains (*settled: it's unsolvable deductively*). Justification is inherently pragmatic: methods making explicit, testable assumptions that *discriminatively* succeed in prospectively validated, stable environments are *practically* preferable. This is the "vindication" through reliable success.
  3.  **Fully Compensate for Poor Benchmarks:** Garbage In, Garbage Out. A weak benchmark limits confidence. The procedure highlights flaws but can't create evidence that isn't there.
  4.  **Quantify All Drift Risk (Step 4):** Judgment is unavoidable.
  5.  **Resolve Deep Model Uncertainty:** If no model passes Steps 1-5 convincingly, the procedure flags this but doesn't magically create a good option.

  ---

  **Application to Your Cases (Applying the Procedure Strictly):**

  1.  **Meridian (Mechanistic - Previous Winner):**
      *   **Step 1:** *Pass.* Bias: "Assumes disease spread follows specified compartmental dynamics with contact matrices based on known demographics and mobility patterns."
      *   **Step 2:** *Major Concern.* Residual analysis likely shows errors, but key test: Did it *only* score on *its own* locations? This is fatal. A "mirror" using perturbed contact matrices wasn't tested. Performance may stem from tuning to known surveillance locations, not the mechanism. **Residuals:** Look for systematic errors where mechanism should hold/fail (e.g., sudden mobility changes). **Perturbation:** Hard without submitter, but analyze sensitivity to contact matrix parameters historically.
      *   **Step 3:** *Invalid/Major Concern.* Scoring only on locations chosen by the submitting team (who run surveillance) is retrospective selection bias. Performance is likely inflated. **Action: Likely Reject** unless a truly independent, prospective subset exists (unlikely given description).
      *   (Steps 4-6 largely moot if rejected at Step 3).

  2.  **Halcyon (ML Ensemble - New Winner):**
      *   **Step 1:** *Pass (Marginally).* Bias: "Assumes complex, non-linear, potentially non-stationary relationships between high-dimensional input features (e.g., search, mobility, past cases) and future cases are learnable via ensemble methods." (Weak, but stated).
      *   **Step 2:** *Major Concern.* Win concentrated on chaotic holiday period. This period is known for reporting collapse (shifted distribution). Does the win reflect learning *true disease dynamics* or just *reporting artifacts*? Perturbation/residuals: Does performance crash if key holiday-related features are removed/noised? Did it outperform simpler models *outside* the holiday period? If win is *only* during collapse, bias isn't useful disease dynamics.
      *   **Step 3:** *Major Concern.* Retuned on the same seasons scored. This is data leakage/overfitting. Performance is inflated. Downweight heavily. If possible, analyze performance *before* the final tuning round.
      *   **Step 4:** *High Risk.* Reporting systems *can* change. Public behavior around holidays *can* shift. Its winning feature likely exploits unstable patterns. Submitter must prove stability of key feature relationships *this* season. Burden high.
      *   **Step 5:** *Likely Weak.* Margin came from a small, unstable subset. Pool-wide Z-score on *stable* periods may be low. p-value for overall win may be high once holiday period inflation is removed/accounted for.
      *   **Step 6:** *High Under-Prediction Risk?* ML models can fail catastrophically in novel situations (like a holiday with unexpected behavior). Cost of missing a peak is high.
      *   **Verdict:** **High risk of rejection** based on Steps 2, 3, and 4. Requires exceptionally strong justification for stability and prospective validity to overcome.

  3.  **Boring Baseline (Simple Trend Shift):**
      *   **Step 1:** *Fail.* Bias: "Assumes the average trend shift from recent seasons persists." This is trivial and shared by many models. It lacks a *distinctive* structural assumption. "What does it assume that others don't?" -> Nothing specific. **Action: Stop. Reject.** (Harsh, but consistent procedure).
      *   *If Forced to Consider:* Its "bias" is extreme simplicity/stability. Step 2: It doesn't "win," so no claim. Step 3: Easy to validate prospectively. Step 4: Very stable to drift (but blind to new dynamics). Step 5: Never wins, so irrelevant. Step 6: May be *less* risky for catastrophic under-prediction than complex models, though prone to missing trends.

  **Conclusion & Recommendation:** The procedure likely rejects both Meridian (invalid benchmark) and Halcyon (retrospective tuning, unstable win source). The baseline is rejected for lacking a testable bias. **This leaves you with no acceptable model.**

  **Your Suspicions Confirmed:** The robust path forward, highlighted by the procedure's failure to identify a single good candidate, is likely **Model Pooling or Ensemble**:
  1.  **Combine:** Use a simple average or median forecast from *all* models passing Step 1 and Step 3 (prospective validity) with a clearly stated bias, *if any exist*.
  2.  **Quantify Uncertainty:** Report the pooled forecast *with a prediction interval* reflecting model disagreement (e.g., range of the middle 50% or 80% of model forecasts).
  3.  **Justification:** "Given limitations in individually validating submissions and high selection/retrospection risks identified, the panel recommends a pooled forecast incorporating diverse methodological assumptions (list them) to improve robustness and better represent uncertainty. Individual model assessments available upon request."

  **Why this works:** Mitigates NFL by leveraging diverse biases (diversification). Reduces reliance on single-model selection effects. Explicitly communicates uncertainty. Addresses asymmetric risks inherently (ensemble mean often more robust to extremes). While philosophically still inductive, it's the most defensible *pragmatic* approach given the constraints and flaws exposed by the procedure. Prepare for political pushback by emphasizing risk mitigation and uncertainty quantification – crucial for stockpile decisions.
