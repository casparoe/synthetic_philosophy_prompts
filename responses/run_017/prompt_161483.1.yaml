     Let's keep it simple: "Either C1 inherits or C1 does not inherit." (Answer: Yes, always true.)

  c. Rephrased pair: We will have two queries that are logically equivalent. For example:

     Query 1: "If C3 inherits, then does C4 inherit?" (directly from fact 2: yes)
     Query 2: "Is it possible that C3 inherits and C4 does not?" (no, which is the same as the first)

