        Extra fact in Version A: "C12 inherits."
        Version B: no fact about C12.

     Then ask: "Does C1 inherit?"

     With Version A: we have C12 inherits -> from fact 7, C1 inherits -> from fact 1, C2 does not inherit -> from fact 8, C3 inherits -> ... so we get a chain and we can conclude C1 inherits.

     With Version B: we don't know about C12, so we cannot tell about C1.

     So we can have two booklets: one with "C12 inherits" and one without. Then the query "Does C1 inherit?" is answerable only for Version A (yes) and not for Version B (can't tell).

