          Fact 1: If C1 inherits then not C2.
          Fact 8: If not C2 then C3 inherits.

          Without knowing anything about C1, we don't know C2 or C3.

     And with the extra fact (C12 inherits) and fact 7 (C12 -> C1), we get C1.

     So that works.

  Now, the activity:

  Materials:
  - Two versions of the fact booklet (A and B, randomly distributed, half get A and half get B). Booklet A includes an extra fact: "C12 inherits." Booklet B does not.
  - A deck of 10-12 query cards. We will have at least one of each type. We might have multiple to mask the types.

  Example queries:

  1. (Rephrased pair, first) If C1 inherits, then does C2 not inherit? (Yes, from fact 1)
  2. (Rephrased pair, second) If C2 inherits, then does C1 not inherit? (Yes, contrapositive of fact 1)
  3. (Long chain) If C12 inherits, then does C7 inherit? (Yes, by the chain we designed)
  4. (Tautology) Is it true that either C1 inherits or C1 does not inherit? (Yes)
  5. (Awareness) Does C1 inherit? (Only known by group A, because they have the extra fact that C12 inherits; group B cannot tell)
  6. Other filler queries to mask.

  We can also include an independent fact: a statement that is not entailed by the booklet and not contradicted? But we want to avoid "can't tell" being the correct answer for the scoring to be clear? Actually, we do want some "can't tell" that are indeed not determined.

  But note: the scoring is against the full closure. So if the statement is not entailed and not contradicted, then "can't tell" is correct. We want to have a mix.

  We can have a query that is false? For example: "Do both C5 and C6 inherit?" (No, because of fact 3: either or not both.)

  But the main types are covered.

  We need to ensure the long chain is long enough to be tedious under time pressure.

  Timeline:

  1. Introduction (5 minutes): Explain the inheritance scenario. Hand out booklets (randomly A or B) and a sheet for answers. Explain the task: 
     - You will be shown a series of questions. 
     - For each, mark: Yes, No, or Can't tell.
     - Also, mark your confidence from 1 (not confident) to 5 (very confident).
     - Mark whether you derived the answer (D) or guessed (G) (including intuition).
