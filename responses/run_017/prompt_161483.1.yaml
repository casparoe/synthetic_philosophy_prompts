  Debrief outline:

  1. Present the problem of logical omniscience: in the possible worlds model, an agent knows all the logical consequences of what they know, including those that require long derivations, and all tautologies, and they know the same thing under every logical equivalent description.

  2. Map the activity:
     - Long conditional (query 4) and long non-conditional (query 5 for group A): These required a long chain of reasoning. How many of you got them right? How many derived them? The closure says you should have known them. This illustrates the computational problem.
     - Tautologies (queries 1 and 9): These are always true. Did anyone say "can't tell" or "no"? The closure says you should have known them. This illustrates the problem of knowing all tautologies.
     - Rephrased pair (queries 2 and 3): These are logically equivalent. How many of you gave the same answer to both? How many gave different answers? The closure requires that you know both or neither. This illustrates the problem of logical equivalence.
     - Awareness (queries 5 and 8 for group B, and 5 and 8 for group A): For group B, query 5 and 8 were "can't tell". For group A, they were "yes". But also, for group A, query 5 required a long derivation. Even though they had the extra fact, they might not have derived it. This shows that having the premises doesn't mean you know the consequences.

  3. Discuss the normative move: Some might say that the agent should have known these things (and if they didn't, they are irrational). But is it fair to say that the agent knew the long chain if they didn't derive it? What if the chain is extremely long? What about tautologies that are too complex to understand?

