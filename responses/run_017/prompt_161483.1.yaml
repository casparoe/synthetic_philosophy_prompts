        Query 1: "If C1 inherits, then C2 does not inherit." (fact 1: yes)
        Query 2: "If C2 inherits, then C1 does not inherit." (which is the contrapositive: also yes)

     We can use the contrapositive of fact 1.

  d. Awareness condition: We need a fact that only half the participants have. We can have two versions of the booklet. Version A has an extra fact, Version B does not.

     Example: 
        Version A: "C12 does not inherit."
        Version B: no such fact.

     Then we can ask: "Does C1 inherit?" 

