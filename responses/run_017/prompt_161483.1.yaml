  We are designing a classroom activity to illustrate the problem of logical omniscience in a formal epistemology workshop. The goal is to have participants experience the gap between what they actually know and what the standard possible-worlds semantics attributes to them as knowledge (i.e., all logical consequences of what they know). The activity should include:

  1. A booklet of facts about an invented domain (to serve as the knowledge base).
  2. A deck of query cards with questions to be answered under time pressure. The queries should include:
     a. A query entailed by a long tedious chain of reasoning (to illustrate computational limitations).
     b. A tautology or a statement independent of the premises (to illustrate knowing all tautologies and the problem of irrelevant truths).
     c. The same content asked twice in different words (to illustrate the problem of logical equivalence and knowing the same thing in different guises).
     d. A query that depends on an additional background fact that only half the participants have (to illustrate the problem of awareness or background knowledge).

  Participants will answer each query with:
     - Yes, No, or Can't tell.
     - Confidence level (e.g., on a scale of 1-5).
     - A tick for "I actually derived this" vs. "I guessed".

  Scoring: Answers are scored against the full logical closure of the booklet. So, if a query is entailed by the booklet, the correct answer is "Yes", and if it is inconsistent, "No", otherwise "Can't tell". Importantly, if the participant says "Can't tell" but the answer is entailed, they are marked wrong. Similarly, if they guess correctly without deriving, they get credit. This will show that the formalism attributes knowledge they didn't have.

  After the initial round, participants will try to write a rule for attributing knowledge to an agent. Then they will be tested on a held-out set of queries.

  Additionally, we need a debriefing that maps game moments to the philosophical problems and an honest list of potential issues and how to handle them.

  Let's design the domain and materials.

  Domain: "The Twelve Cousins and the Will"

  Story: A wealthy uncle has passed away and left a will with conditions for inheritance. There are 12 cousins (named C1 to C12 for simplicity). The will specifies several conditions about who inherits what and when. The booklet will contain a set of relational facts.

  Example facts (we need enough to be nontrivial but not too complex):

  1. If C1 inherits, then C2 does not inherit.
  2. If C3 inherits, then C4 inherits.
  3. Either C5 inherits or C6 inherits, but not both.
  4. If C7 inherits, then C8 inherits.
  5. If C8 inherits, then C9 inherits.
  6. C10 inherits if and only if C11 does not inherit.
  7. If C12 inherits, then C1 inherits.
  8. If C2 does not inherit, then C3 inherits.
  9. If C9 inherits, then C10 inherits.
  10. C11 inherits only if C12 inherits.

  We can add more to make the long chain. Also, we need an independent fact and a tautology.

  Queries:

  a. Long chain: We can design a chain of implications that leads to a conclusion that requires several steps. For example, from the above:

     From (7): If C12 inherits, then C1 inherits.
     From (1): If C1 inherits, then C2 does not inherit.
     From (8): If C2 does not inherit, then C3 inherits.
     From (2): If C3 inherits, then C4 inherits.

     So, if C12 inherits, then C4 inherits? Actually, not exactly because we have to chain without conditionals. Let's create a chain that leads to a specific conclusion.

     Alternatively, we can have a query: "If C12 inherits, then does C4 inherit?" The chain is: C12 -> C1 -> not C2 -> C3 -> C4. So the answer is yes.

     But we want a long tedious chain. Let's make it longer by adding more steps.

     We can add:
     11. If C4 inherits, then C5 inherits.
     12. If C5 inherits, then C6 does not inherit (from fact 3: either C5 or C6 but not both, so if C5 then not C6).
     13. If C6 does not inherit, then C7 inherits. (We can add this.)

     Then the chain: C12 -> C1 -> not C2 -> C3 -> C4 -> C5 -> not C6 -> C7.

     So query: "If C12 inherits, then does C7 inherit?" (Yes)

     This chain is 7 steps. We can make it even longer if needed.

  b. Tautology: We can ask a question that is always true, e.g., "Does either C1 inherit or not inherit?" (which is a tautology) or something more disguised? Alternatively, we can ask something independent of the facts: "Does C1 inherit more than $1000?" but the booklet doesn't mention money. Instead, we can ask: "Is it true that if C1 inherits and C1 does not inherit, then C2 inherits?" (which is a tautology because from a contradiction anything follows). But that might be too obvious. Alternatively: "If C1 inherits, then if C2 inherits, then C1 inherits." (tautology)

