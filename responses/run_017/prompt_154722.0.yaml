answer: |-
  ## The Grantham Courier: Internal Style Guide (v.4.1)

  **Core Principle:** Staff shall not publish any statement they know to be false. All other techniques are permissible provided they adhere to this fundamental rule. The Literal Truth Audit (LTA) process, detailed in Protocol 7B, ensures compliance. This guide outlines approved techniques for maximizing impact while maintaining strict fidelity to factual assertion.

  1.  **Selective Quotation & Omission:**
      *   **Technique:** Use partial quotes or omit contextual information crucial for full understanding, provided the quoted portion is accurate and the omission does not render the *statement* false.
      *   **Example:** *Councillor Davies stated: "This project will undoubtedly bring jobs."* (Omitted: *"...though likely low-wage and temporary, and the environmental cost is significant."*)
      *   **LTA Note:** Verify audio/text source confirms exact utterance. Omission of context is not an LTA factor.

  2.  **Answering the Unasked Question:**
      *   **Technique:** When posed a specific question (Q1), provide an accurate answer to a different, often more favourable, question (Q2) without signalling the shift. The answer to Q2 must be true.
      *   **Example:** Q: "Did the Mayor accept gifts from Developer X?" A: *"The Mayor has always complied fully with the city's ethics disclosure requirements."* (True, but avoids answering the specific question about Developer X, which may have a negative answer).
      *   **LTA Note:** Verify compliance with disclosure requirements. The relationship between Q1 and A is outside audit scope.

  3.  **Exploiting Scalar Implicature (Understatement):**
      *   **Technique:** Use weaker terms on a scale (e.g., "some," "possible," "concerns exist") where a stronger term might be expected, implying the stronger case doesn't apply, even when it might.
      *   **Example:** *"Some residents expressed concerns about the new landfill site."* (True if even two residents did, even if hundreds protested violently).
      *   **LTA Note:** Confirm at least one resident expressed concern. Quantification of "some" is not audited for representativeness.

  4.  **Scope Ambiguity & Neg-Raising:**
      *   **Technique:** Phrase sentences where negation or quantification is ambiguous, allowing a technically true reading that avoids a damaging implication.
      *   **Example (Scope):** *"The CEO denies the company knew about the safety violations before the accident."* (True if the CEO denies it, even if the company demonstrably did know).
      *   **Example (Neg-Raising):** *"I don't believe the Treasurer stole the funds."* (True as a statement of belief, even if evidence strongly suggests theft).
      *   **LTA Note:** Verify the CEO made the denial / the speaker holds the belief. Truth of the embedded proposition is irrelevant.

  5.  **The Literally True Denial:**
      *   **Technique:** Craft denials that are narrowly true but fail to address the core accusation or misleading implication.
      *   **Example:** Headline: *"Local Charity Accused of Misusing Donations."* Charity Statement: *"It is categorically false that we spent donations on luxury vacations."* (True, because they spent them on executive bonuses, not vacations).
      *   **LTA Note:** Audit the literal claim ("spent on luxury vacations" is false). The broader implication ("misused donations") is not audited.

  6.  **Buried Disclosure & Epistemic Distance ("We Haven't Been Told"):**
      *   **Technique:** Disclose necessary information in a manner unlikely to be noticed or completed (e.g., deep in a long paragraph, complex footnote). Use constructions emphasizing the outlet's *lack* of specific knowledge to imply non-existence.
      *   **Example:** *"Council officials stated they had followed procedure. The Courier has not been informed of any specific procedural violations in this instance."* (True, but implies no violations exist, which may be false).
      *   **LTA Note:** Verify officials made the statement and that no specific violation notification was received *by the Courier*. Existence of violations unknown to the Courier is irrelevant.

  7.  **The Unconfirmed Implicature:**
      *   **Technique:** Structure reporting to create a strong implicature (e.g., juxtaposition, suggestive phrasing), then refuse to confirm or deny it, citing only the literal truth of the assertions made.
      *   **Example:** *"Mr. Jones met privately with the zoning board chair twice last week. The proposed development on Jones's land was approved unanimously on Friday."* (Followed by, if challenged: "We reported verified meetings and the vote outcome. Any connection is reader inference.")
      *   **LTA Note:** Audit the meeting times/locations and the vote outcome. Implicature generation is a core journalistic skill, not an LTA function.

  8.  **Literal Truth Audit (LTA) Protocol 7B:**
      *   **Procedure:** Before publication, the assigned subeditor runs each contentious sentence/claim through the LTA interface. The LTA algorithm (v.2.3) assesses potential literal falsehood against verified source material, assigning a confidence score (0.0-1.0).
      *   **Threshold:** A score >= 0.95 is required for publication. Scores below require revision or kill.
      *   **Subeditor Discretion (Rule 8.1):** If a sentence scores >=0.95 but is deemed *obviously misleading in context*, the subeditor flags it to the Section Head. The Section Head may only kill the sentence if a *literal falsehood* can be demonstrated *under the current LTA parameters*. Concerns about misleading nature, absent literal falsehood, are noted in the file but do not block publication. The LTA score is final.

  9.  **Managing Created Implicatures:**
      *   **Technique:** When directly questioned about an implicature *your reporting demonstrably created*, you may clarify the literal meaning of your words but must not deny the implicature *if the implicature itself could reasonably be true*. Denying a potentially true implicature risks creating a false statement by negation.
      *   **Example:** If asked: "Are you implying Jones bribed the chair?" Response: *"Our report stated the verified facts: two private meetings occurred, followed by unanimous approval. We make no assertions beyond the published facts."* (Avoids directly denying the bribery implication if evidence suggesting it exists).
      *   **LTA Note:** Responses to queries must pass LTA separately. The "reasonably true" clause relies on editorial judgment.

  **Appendix A: Clarification on Rule 9**
  *   Rule 9 prohibits denying a *potentially true* implicature you created, to avoid making a false denial. However, Rule 1 permits selective omission of context, and Rule 2 permits answering unasked questions – techniques that inherently rely on *creating and exploiting* implicatures the journalist knows are likely *false* (e.g., implying full endorsement via partial quote). Consistency requires that techniques creating *known false* implicatures are permissible under the Core Principle (as they involve no false *assertion*), yet Rule 9 restricts responses about those very implicatures. Further review by the Ethics Panel (Convened Q3) is pending. Until then, apply Rule 9 as written.

  ---

  **Note on Philosophical Underpinning & Uncertainty:**

  This guide satirically presumes the "Assertion-Only" view of lying: a lie requires saying something you believe false; misleading via true statements is categorically different and permissible. The reductio shows how rigorously adhering *only* to this prohibition, while actively exploiting other linguistic mechanisms, renders journalism ethically hollow and practically indistinguishable from deception. The guide correctly identifies core techniques (scalar implicature, scope ambiguity, epistemic distancing, etc.).

  The weakest point is likely the "We Haven't Been Told" constructions (Rule 6). While epistemically true, their misleading power heavily depends on ignoring the distinction between "not told" and "doesn't exist," a distinction the audience reliably misses. Is exploiting this *known* cognitive error meaningfully different from asserting non-existence? The guide assumes it is, under the strict assertion-only view, but this feels like the most precarious edge.
