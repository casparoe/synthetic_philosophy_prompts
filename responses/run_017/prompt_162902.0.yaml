answer: |-
  ### How Psychology Bears on Moral Truth
  For empirical moral psychology to illuminate who is "right," it must reveal which foundations reliably track morally relevant features (e.g., well-being, justice) versus distortions (e.g., bias, evolutionary misfires). Descriptive breadth alone doesn’t imply normative superiority.

  ### Adjudication  
  1. **Juna (1): Half Right**  
  Breadth *could* indicate comprehensiveness, but only if the added foundations capture *genuine* moral reasons. Including irrelevant triggers (e.g., disgust at harmless acts) isn’t epistemic virtue—it’s error.  

  2. **Peter (2): Basically Right**  
  Extra inputs *can* be noise if they misfire (e.g., purity disgust targeting consensual sexuality). A model adding false positives isn’t "more complete"; it’s less accurate, akin to a smoke detector alarming at steam.  

  3. **Juna (3): Basically Right**  
  Dismissing opposing foundations *solely* because they don’t fit one’s framework *is* circular. Independent criteria (e.g., coherence, predictive power) are needed to avoid begging the question.  

  4. **Peter (4): Half Right**  
  His empirical test *could* reveal unreliability (e.g., if purity judgments *only* track pathogens), but it doesn’t automatically debunk the foundation. Moral relevance isn’t negated by causal quirks if the intuition aligns with defensible values (e.g., sacrilege as community integrity).  

  5. **Juna (5): Basically Right**  
  All foundations have non-moral triggers (e.g., care biased by kinship), so selective skepticism is unfair. Her "lock onto something real" point stands: purity *might* protect social cohesion or existential meaning liberalism undervalues.  

  6. **Peter (6): Basically Right**  
  Demanding articulation of purity’s value in neutral terms (e.g., "social stability" or "psychological integrity") is methodologically sound. If binding foundations can’t justify their moral weight without presupposing their framework, they’re question-begging.  

  ### What Both Miss  
  The clustering reflects **adaptive social strategies**, not truth-tracking. Conservatives prioritize binding foundations to fortify groups against external threats; liberals minimize them to protect individuals from internal oppression. Neither psychology nor evolution settles which trade-offs are *morally optimal*—that requires normative argument. Crucially, moral progress often involves *overriding* intuitions (e.g., expanding care beyond tribe, rejecting authority-based hierarchy), suggesting foundations are starting points, not arbiters.

