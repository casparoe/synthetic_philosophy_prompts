  I need to distill their implicit decision rules from the precedents. For the market stalls rule (repealed): No current function + no cost to repeal. For the dog registration rule (kept): Current utility discovered + minimal upkeep cost. For the river structures rule (kept): Future option value + high cost of reversal.

