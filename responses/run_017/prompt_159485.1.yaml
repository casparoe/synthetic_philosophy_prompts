prompt: |-
  I'm in the second year of a PhD in comparative politics, writing a chapter on how outside observers decide whether a country has stopped being a democracy, and I keep losing the same argument with my supervisor because I don't have a word for the thing I am gesturing at. The argument runs like this: take almost any single measure that gets counted as backsliding somewhere in Hungary, Poland, Turkey, or the United States — expanding the bench of a court that has been ruling against you, moving the retirement age for judges, redrawing district lines, tightening who may observe a count, requiring organisations that take money from abroad to register — and you can nearly always find a democracy nobody doubts that has something close to the same rule on its books. So what, she asks, is the object of the judgement? Not the rule, since the rule has respectable company. Not the whole institutional package either, since nobody ever votes on a package and she doubts anyone could rank two countries' entire constitutional setups against each other. What is left is whether the observer likes the direction of travel, which is her way of saying the concept is a partisan label with a methodology stapled to it.

  What I want a name for is the move that produces this, because I don't think it is any of the things it looks like. The defender is not pointing at the critic's own misdeeds, so it isn't whataboutism or tu quoque. The defender usually isn't denying that the step is small and reversible, and the salami-slicing or slippery-slope worry is the critic's accusation, not the defence. And the defender is often right on the narrow point: the borrowed sentence really is close to the sentence in the respected democracy's statute book. The problem is that what a rule like this actually does depends on what surrounds it — who appoints the replacements, whether there is a second chamber or a supermajority that would have to agree before the rest of the package could pass, whether the change is a one-off or repeatable at will, whether the courts that would review it are the same courts being repopulated. Those surrounding facts are exactly what is in dispute, so the comparison quietly helps itself to a ceteris-paribus clause it isn't entitled to. My own candidate name is rule laundering, by analogy with laundering a provenance, and my candidate test is a swap test: imagine transplanting the lender's whole surrounding arrangement along with the sentence, and ask whether the borrower would then behave like the lender. But I can see two ways this collapses: either the test is unfalsifiable because a defender can always say the context differs, or it is circular because we only notice the difference in context once we have already decided the country is sliding.

  So: does this configuration have an established name in the comparative-institutions or democratisation literature, or a name borrowed from somewhere else — I have a vague sense that lawyers dealing with antitrust conduct, conspiracy, or cumulative environmental harm have had to work out how to judge a course of conduct rather than a single act, and I would like to know whether that machinery transfers? If there is no settled term, please coin and define one, and do more than hand me a label: I want to know what the phenomenon is not as well as what it is, how it differs from whataboutism, from ordinary salami tactics, and from a good-faith comparative argument that a borrowed rule really is innocent here, and what its boundary cases are. I also want to know what you make of my supervisor's deeper point: if the honest object of judgement is a trajectory rather than a rule or a package, what kind of thing is a trajectory, who gets to say which one a country is on, and does answering that either rescue the concept of backsliding or show that it really is just a partisan label? Please argue in concepts rather than sources — I am writing this from a field site with no library access, so a reading list would be useless to me even if you could produce one.
reasoning: |-
  Okay, I need to tackle this PhD student's problem. They're stuck in arguments with their supervisor about how outside observers judge democratic backsliding. The core issue is that individual institutional changes in backsliding democracies often resemble rules in stable democracies, making it hard to pinpoint what exactly is being judged. The student wants a term for this defensive maneuver and needs to understand its mechanics and implications.

  First, I recognize this as a classic problem of institutional context dependence. The student's "rule laundering" idea is clever but might be too narrow. I recall similar concepts in other fields: antitrust law's "course of conduct" doctrine, environmental law's "cumulative impact" assessments, and even epistemology's "fallacy of decomposition." The common thread is evaluating actions within their broader ecosystem rather than in isolation.

  The supervisor's critique about judging trajectories is valid but incomplete. Trajectories aren't just partisan labels—they're institutional path dependencies. I should explain how trajectories become legible through patterns: sequence (order of changes), tempo (speed), and receptivity (system's capacity to absorb shocks). For example, court-packing after years of delegitimizing judiciary carries different weight than routine judicial reforms.

  Defining the defense mechanism requires precision. It's not whataboutism (which deflects criticism) nor salami tactics (which hides incrementalism). This is "contextual appropriation"—leveraging superficial similarity while ignoring systemic incompatibility. The test shouldn't be hypothetical transplants (as the student noted, that's circular) but rather institutional coherence: does this change fit or fracture existing constraints?

  The boundary cases matter too. When would borrowing a rule be legitimate? If the receiving system has stronger veto points, or if it's correcting an outlier (like Canada borrowing Australia's ballot design). Illegitimacy flares when changes deliberately disable accountability mechanisms—Hungary's constitutional replacement enabling Fidesz's later power grabs exemplifies this.

  On trajectories: they're diagnostic patterns, not partisan constructs. We identify them through comparative sequencing (did Poland's media laws precede or follow capture of regulatory bodies?) and functional impacts (did Turkey's NGO laws actually reduce watchdog capacity?). This rescues backsliding from subjectivity by anchoring it in institutional causality.

  Finally, I'll coin "institutional isomorphism camouflage" as the term. It captures the mimicry of forms while highlighting the functional divergence—like how Turkey's "judicial reform" mirrors German statutes but ignores Germany's counterbalancing Bundesrat oversight. The camouflage fails when changes persistently accumulate in one direction (erosion vector) or synchronize to disable feedback (autogolpe architecture).
answer: |-
  Your frustration is palpable—and profoundly insightful. What you're describing isn't just a naming problem; it's a core epistemological challenge in diagnosing institutional decay. Here's a conceptual dissection:

  ### 1. **The Defensive Maneuver: "Contextual Appropriation"**
      - **What it is:** The deliberate isolation of a single institutional act from its systemic context to legitimize it via superficial similarity to a stable democracy's practice. The defender exploits the **indeterminacy of isolated rules**.
      - **What it is NOT:**
          - *Not Whataboutism:* This doesn't deflect by accusing critics of hypocrisy ("*You* gerrymander too!"). It claims the *act itself* is inherently legitimate.
          - *Not Salami Tactics:* The defender doesn't deny incrementalism; they deny the *significance* of the slice by pointing to its benign existence elsewhere.
          - *Not Good-Faith Comparison:* Legitimate comparison asks, "Does this *function* similarly here?" Contextual appropriation asks, "Does this *text* exist somewhere respectable?"
      - **Boundary Case:** It *becomes* good-faith comparison only if the defender engages with why the *functional outcome* differs (e.g., "Germany's constitutional court override requires a 2/3 legislative supermajority; ours doesn't, so the risk is contained").

  ### 2. **The Mechanism: "Institutional Isomorphism Camouflage"**
      Borrowing from organizational sociology ("isomorphism"), this describes mimicking the *form* of legitimate institutions to mask divergent *function*. The "camouflage" highlights the strategic obfuscation.
      - **Why "laundering" is close but imperfect:** Laundering implies disguising illicit origins. Here, the rule's *text* may be "clean"; it’s the *deployment within a specific institutional ecology* that’s toxic. The harm is emergent, not inherent.

  ### 3. **The Supervisor's Challenge: Trajectories as Legitimate Objects**
      Your supervisor is half-right: the judgment *is* about trajectory. But trajectories aren't partisan fantasies; they are **institutional path dependencies** made legible through:
      - **Sequentiality:** Order matters. Packing the court *after* discrediting media oversight creates a cascade unprotected democracies resist.
      - **Tempo & Irreversibility:** Rapid-fire changes vs. slow evolution; presence of "ratchets" (e.g., Hungary's constitutional replacement enabling later statutory power grabs).
      - **Systemic Receptivity:** Does the change exploit latent flaws? (e.g., the U.S. Electoral College's vulnerability to faithless electors was theoretical until polarization weaponized it).
      - **Functional Displacement:** Does the change subvert a core institution's purpose? (e.g., voter ID laws *can* ensure integrity, but if paired with DMV closures in opposition areas, they become exclusionary).

  ### 4. **Diagnosing Backsliding: "Cumulative Asymmetry"**
      This is where legal analogies help. Like antitrust's "course of conduct" or environmental law's "cumulative impact," democratic erosion is a **pattern of acts that collectively disable accountability mechanisms**, even if each act is deniable:
      - **Key Indicators:**
          - **Directionality:** Do changes consistently concentrate power in one actor/coalition?
          - **Feedback Loop Disruption:** Are courts, media, or electoral commissions systematically weakened as checks?
          - **Asymmetric Entrenchment:** Can the ruling group easily reverse opposition gains but insulate its own? (e.g., Poland's judicial "reforms" making it harder for future governments to undo PiS's court appointments).
      - **The Test:** Not "could this rule exist elsewhere?" but "**does this rule, within *this* sequence and institutional array, degrade the system's capacity to correct abuses or produce alternation in power?**"

  ### 5. **Rescuing Backsliding from Subjectivity**
      Backsliding isn't merely partisan if we define trajectory objectively:
      - **Negative Definition:** A democracy isn't backsliding when changes *expand* contestation, accountability, or inclusion—even if partisan. (e.g., Canada's independent redistricting commissions).
      - **Positive Threshold:** Backsliding occurs when cumulative actions cross a threshold where:
          1. **Electoral Uncertainty** is reduced (incumbents can manipulate rules to predetermine outcomes).
          2. **Constraint Mechanisms** are disabled (oversight bodies are captured, courts deferential).
      - **Who Judges?** Comparativists identify **syndromes, not snapshots**. Poland 2015-2023 isn't judged by one law, but by the *constellation*: captured constitutional tribunal → politicized prosecutor → crippled media regulator → gerrymandered districts. The pattern is the object.

  ### Why This Matters
  Your supervisor fears subjectivism, but institutional trajectories are observable: **power seeks insulation from accountability.** When multiple institutional changes converge on that goal—even if each resembles a benign practice elsewhere—the trajectory is autocratizing. Contextual appropriation exploits the fact that *no single brick crumbles a wall*—but we still recognize a collapsing structure. The term for that exploitation is **"fragmentation fallacy"**: mistaking the isolatable part for the emergent whole. 

  **In short:** Name the defense **Contextual Appropriation**. Ground judgments in **Cumulative Asymmetry**. Define backsliding as **institutional trajectory toward reduced uncertainty and constraint**. This rescues it from partisanship by focusing on *systemic effects* rather than intent or isolated acts. The proof is whether the system retains core democratic functions—not whether its parts look familiar.
