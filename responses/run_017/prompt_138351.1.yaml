  We are going to design a game called "The Metro Debate: 1970s Transit Project" for a single 80-minute session. The goal is to let students experience the difference between an epistemic bubble and an echo chamber without using the terms until the debrief.

  Key elements:
  - Fictional controversy: A 1970s transit project (let's call it "MetroLink") that failed. The two sides: Engineering Flaws vs. Financial Mismanagement.
  - Ground truth: Only the instructor knows. We'll set it as Engineering Flaws (so that's the correct answer). But we can adjust if needed.
  - Students are divided into two groups: Group A (epistemic bubble) and Group B (echo chamber). Each group has 12 students (if 24 total).
  - Four rounds: 
    Round 1: Initial information and priming (for Group B, establishing distrust in a source)
    Round 2: Additional information (with Group A missing critical info, Group B getting it from a distrusted source)
    Round 3: Steelman round (everyone writes the strongest version of the other side's case)
    Round 4: Open archive (all sources available) and then final decision and scoring.
  - Also, we want to incorporate the trust repair mechanism for the echo chamber (Group B) in Round 4.

  Materials:
  - Index cards for the source information (we'll have 8-10 sources in total, some pro-engineering-flaw, some pro-financial-mismanagement, and one or two neutral).
  - Handouts for each round (private bulletins) - these will be envelopes or packets of index cards for each student.
