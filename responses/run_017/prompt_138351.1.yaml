  Fictional Case: MetroLink Transit Project
  - Background: In the early 1970s, the city of Riverbend embarked on an ambitious public transit project called MetroLink. It was a light rail system designed to connect the downtown core with the suburbs. The project was completed in 1976 but was shut down in 1979 due to persistent problems. The debate: Did it fail because of engineering flaws (e.g., poor design, construction issues) or financial mismanagement (e.g., cost overruns, inadequate funding, corruption)?

