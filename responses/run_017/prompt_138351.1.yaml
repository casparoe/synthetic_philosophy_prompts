  Round Breakdown:

  Round 1 (15 minutes):
  - Introduction: "We are going to investigate why the MetroLink project failed. You will receive an initial information packet. Read it and form an initial opinion. You are part of a team that is working together to get to the truth. You will be scored on accuracy at the end."
  - Hand out Round 1 bulletins (private to each student, but within the same group they all get the same set? Actually, to avoid cross-group talk, we can have them in two separate areas? Or just emphasize that they are not to share their cards with other groups.)
