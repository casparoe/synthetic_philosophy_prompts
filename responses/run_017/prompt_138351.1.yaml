  9. [Priming] City Engineer Official (CEO) Memo (1977): "Be cautious: The Transit Watchdog Group (TWG) has a history of publishing exaggerated claims to attack city projects. They are not a reliable source. Their reports often omit key facts and are driven by an anti-development agenda."

  So in the open archive, students get sources 1-8.

  Debrief outline:
  1. Reveal the truth: MetroLink failed due to engineering flaws (the substandard materials in the bridge segments).
  2. Show the final decisions: How many in Group A got it right? How many in Group B? Without trust repair, Group B might have low accuracy.
  3. Show the steelman arguments: Read examples from Group A (likely weak on engineering) and Group B (likely strong on engineering) to show that Group B had the information but didn't believe it.
  4. Discuss the trust repair: In Group B, how many vouched? Why did or didn't they? What does that tell us about echo chambers?
  5. Introduce the terms: epistemic bubble (Group A: missing information) and echo chamber (Group B: information is present but discredited). 
  6. Highlight the asymmetric fixes: For bubbles, exposure helps. For echo chambers, exposure without trust repair might not help (and might even harden views) and trust repair is costly.
  7. Connect to real world: In social media, we see both. And note the limitations: in the real world, trust histories are long, and identity is involved, and we choose our information sources.

  This design should separate the mechanisms: 
  - The bubble is measured by the lack of arguments in the steelman.
  - The echo chamber is measured by the presence of arguments in the steelman but resistance to change in the final decision (unless trust repair happens) and the difficulty of trust repair.

  Confidence: 
  - I am fairly confident (7/10) that the steelman round will clearly separate the two groups. 
  - I am less confident (5/10) about the trust repair part because the volunteer's dilemma might not play out strongly enough in a classroom setting with low stakes. But it's worth including.

  Let me know if you need more details.
