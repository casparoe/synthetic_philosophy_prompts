  ### **The MetroLink Challenge: Epistemic Bubble vs. Echo Chamber Game**  
  **Designed for a single 80-minute session with 24 students. No laptops—all materials on paper/index cards.**

  ---

  ### **Core Design Logic**  
  - **Epistemic Bubble (Group A)**: Only sees evidence for one side (financial mismanagement). Missing engineering evidence entirely until the final round.  
  - **Echo Chamber (Group B)**: Sees both sides, but engineering evidence is attributed to a distrusted source ("Transit Watchdog Group"). Exposure to opposing views hardens their position.  
  - **Key Asymmetry**:  
    - **Bubble Fix**: Adding missing evidence (open archive) changes minds.  
    - **Echo Chamber Fix**: Adding evidence isn’t enough—it requires costly *trust repair* (vouching for a distrusted source).  
  - **Diagnostic**: The **"Steelman Round"** (writing the best opposing argument) exposes internal differences:  
    - Bubble group *can’t* steelman the missing side (no information).  
    - Echo chamber group *can* steelman but *won’t* shift (distrust blocks belief).  
  - **Stakes**: Points for accuracy (ground truth: **engineering flaws**). Winning student gets a coffee voucher + participation credit.  

  ---

  ### **Materials List**  
  1. **Source Cards** (8 total, double-sided with source name + evidence):  
     - **Pro-Financial Mismanagement (3 cards)**:  
       - `Auditor’s Report (1977)`: "MetroLink exceeded its $2M budget by 40%. Funds were diverted to cover unrelated city debts."  
       - `Mayor’s Memo (1976)`: "Federal grants fell through due to poor lobbying. Without funds, maintenance was impossible."  
       - `Journalist Exposé (1978)`: "Construction delays were caused by contractor bribes—costs ballooned as deadlines passed."  
     - **Pro-Engineering Flaws (3 cards)**:  
       - `Safety Inspector (1976)`: "Cracks in bridge segments were patched but not fixed. Design couldn’t handle winter stress."  
       - `Whistleblower Engineer (1977)`: "I was pressured to use cheaper steel. It failed stress tests but was approved anyway."  
       - `Transit Watchdog Group [TWG] (1978)`: "Lab tests prove steel was 20% below code. This caused structural collapse." (Key discredited source for Group B)  
     - **Neutral/Ambiguous (2 cards)**:  
       - `Ridership Data (1976-79)`: "Initial ridership peaked at 10,000/day but dropped 80% by 1979. No cause specified."  
       - `City Council Minutes (1975)`: "Project approved 5-4 amid debate over costs vs. safety. No consensus."  
  2. **Priming Cards** (For Group B only):  
     - `City Engineer Official [CEO] (1977)`: "TWG is a biased group that falsifies data. They sued the city last year and lost. Ignore their claims."  
  3. **Steelman Sheets**: Blank index cards for Round 3.  
  4. **Voucher Cards** (For Group B only): Cards with "I vouch for TWG. Reason: __________" and a line for name.  
  5. **Scorecards**: Final decision cards (engineering/financial) + name.  
  6. **Instructor Materials**:  
     - Timer, prize coffee voucher, secret "ground truth" note (engineering flaws).  
     - Score tracker (spreadsheet or paper).  
     - 2 boxes for submissions (one for steelman arguments, one for final decisions).  

  ---

  ### **Setup Instructions**  
  1. **Divide Students**: Randomly split into **Group A (12) and Group B (12)**. Label tables if possible.  
  2. **Prep Packets**:  
     - **Group A (Bubble)**: Round 1 = Pro-financial cards + neutral cards. Round 2 = Nothing new (only neutral).  
     - **Group B (Echo Chamber)**: Round 1 = Pro-financial cards + neutral + CEO priming card. Round 2 = Pro-engineering cards (including TWG).  
  3. **Seat Groups Separately**: Minimize cross-group discussion.  
  4. **Introduce the Case** (Verbatim script):  
     > *"Today, we’re investigators solving a mystery: Why did the 1970s MetroLink transit project fail? You’ll get confidential bulletins with evidence. Your goal is to find the truth—points for accuracy. The highest scorer wins a coffee voucher. Outputs are private unless specified."*  
     - **Do NOT use terms like "bubble" or "echo chamber."**  

  ---

  ### **Round-by-Round Timeline** (80 mins total)  
  **Round 1: Initial Evidence** (15 mins)  
  - **Materials**: Hand packets to each student.  
    - *Group A*: Auditor’s Report, Mayor’s Memo, Ridership Data, City Council Minutes.  
    - *Group B*: Same as A + **CEO Priming Card**.  
  - **Task**: "Read your evidence. Form a private opinion: Did MetroLink fail due to engineering or finances?"  
  - **Instructor Actions**: Walk around to ensure no card-sharing.  

  **Round 2: New Evidence** (10 mins)  
  - **Materials**: Hand new cards.  
    - *Group A*: Ridership Data (if not already given) + Journalist Exposé. *(No engineering evidence)*.  
    - *Group B*: Safety Inspector + **TWG Report** + Whistleblower Engineer.  
  - **Task**: "Update your opinion based on new evidence. Note: Sources may have biases."  

  **Round 3: Steelman Diagnostic** (15 mins)  
  - **Materials**: Blank index cards for all.  
  - **Task**:  
    > *"Write the STRONGEST argument for the OPPOSING view. If you think it was engineering, argue for finances. If finances, argue for engineering. Quality matters—points for persuasiveness."*  
  - **Collect**: Cards go in a box. **Do not reveal scores yet**—this is a diagnostic tool.  
  - **Why it Works**:  
    - Group A (bubble) sees no engineering evidence → weak steelman.  
    - Group B (echo chamber) sees engineering evidence but distrusts TWG → strong steelman but no belief shift.  

  **Round 4: Open Archive & Trust Repair** (25 mins)  
  1. **Open Archive (10 mins)**:  
     - Hand all 8 source cards to every student.  
     - **Announce**: "All evidence is now public. Review everything. Final decision due in 10 mins."  
  2. **Trust Repair Mechanism (For Group B Only)**:  
     - **Announce**:  
       > *"Group B: TWG’s credibility is contested. Anyone can anonymously vouch for TWG using a voucher card. If you vouch:*  
       > - *If TWG is correct, you gain +3 bonus points.*  
       > - *If TWG is wrong, you lose -3 points.*  
       > *Vouching makes TWG credible for EVERYONE in Group B. But if no one vouches, TWG remains distrusted."*  
     - **Place a voucher box at the front**.  
     - **Volunteer’s Dilemma Logic**:  
       - Vouching is risky (individual cost if wrong).  
       - Everyone benefits if one person vouches (free-riding incentive).  
       - Not vouching is individually rational → predicts group paralysis.  
  3. **Final Decision (5 mins)**:  
     - All students submit:  
       - Scorecard with final answer (engineering/financial) + name.  
       - Group B adds: "Vouched: Yes/No."  

  **Scoring & Winner Announcement** (5 mins)  
  - **Accuracy**: +10 points for correct answer (engineering flaws).  
  - **Vouching (Group B only)**: Apply bonus/penalty per above.  
  - **Steelman Quality**: Score 1-3 (1=weak, 2=okay, 3=strong) during debrief prep.  
  - Announce winner (highest points) and award coffee voucher.  

  ---

  ### **Debrief Script** (15 mins)  
  **Step 1: Reveal Ground Truth**  
  > *"MetroLink failed due to engineering flaws—cheap steel caused bridge collapses. Let’s see how we did."*  

  **Step 2: Show Asymmetry via Data**  
  - **Accuracy Rates**:  
    - Group A (bubble): Likely high accuracy. *Why?* They saw new evidence in open archive → fixed the bubble.  
    - Group B (echo chamber): Likely low accuracy. *Why?* Exposure to TWG backfired without trust repair.  
  - **Steelman Examples** (Use anonymous quotes):  
    - Group A: *"Engineering? Uh... maybe the bridges were old?"* → Weak, lacking evidence.  
    - Group B: *"Steel was substandard—TWG’s tests showed 20% weakness."* → Strong but disbelieved.  
    > *"From the inside, both groups felt informed. But Group A couldn’t argue the other side. Group B could—but didn’t believe it."*  

  **Step 3: Introduce Concepts**  
  > *"This mirrors two real-world phenomena:  
  > - **Epistemic Bubble** (Group A): The other side is absent. You haven’t seen their arguments.  
  > - **Echo Chamber** (Group B): The other side is present but discredited. More exposure hardens your view."*  

  **Step 4: Highlight Trust Repair**  
  - **Ask Group B**: *"How many vouched for TWG? Why/why not?"*  
  - **Key Insight**:  
    > *"Fixing echo chambers isn’t about adding evidence—it’s about repairing trust. But vouching costs you: if you’re wrong, you lose credibility. That’s why it often fails—everyone waits for someone else to go first. In real life, this plays out when a trusted insider defends a ‘tainted’ source."*  

  **Step 5: Discuss Asymmetric Fixes**  
  > *"Bubbles pop with exposure. Echo chambers? Exposure alone backfires—you need someone to pay the cost of vouching. In politics, this might be a conservative defending a liberal source (or vice versa), risking their reputation."*  

  **Step 6: Limitations**  
  > *"This game simplifies reality. Real bubbles/chambers:  
  > - Build over years, not minutes.  
  > - Involve identity—you’re invested in your ‘team.’  
  > - Are entered voluntarily by trusting flawed sources.  
  > Here, we forced the distrust. In life, you choose it."*  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **Someone Figures Out the Design**:  
     - *Likelihood*: Medium (if students are theory-savvy).  
     - **Fix**:  
       - "Interesting theory—hold it until the debrief. Focus on the evidence for now."  
       - If they sabotage, remind: "Points for accuracy—winning matters."  

  2. **Distrust Priming Fails in Group B**:  
     - *Likelihood*: Low (CEO card is strong).  
     - **Fix**:  
       - Strengthen priming: Have the CEO card say, *"TWG falsified data in the 1975 Waterworks scandal—trust nothing they say."*  
       - During Round 2, remind Group B: "Recall the CEO’s warning about TWG."  

  3. **Low Engagement with Fake Case**:  
     - *Likelihood*: Medium (students may not care about transit).  
     - **Fix**:  
       - **Boost stakes**: "This is a real investigator challenge—engineers vs. accountants!"  
       - **Dramatize evidence**: Use bold terms ("bribes," "collapses," "scandal").  

  4. **No One in Group B Vouches**:  
     - *Likelihood*: High (by design).  
     - **Fix**: This is a *teaching moment*—use it to show trust repair failure in debrief.  

  5. **Time Shortage**:  
     - **Fix**: Use a visible timer. Cut discussion if needed. Steelman round can be done in 10 mins.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence**: **8/10** for separating mechanisms.  
    - **Strongest Claim**: The steelman round cleanly distinguishes bubbles (can’t argue missing side) from echo chambers (can argue but don’t believe).  
  - **Least Confident Claim**: **Trust repair’s volunteer’s dilemma** (5/10).  
    - *Why*: Low-stakes points may not fully replicate real-world identity risks. Students might vouch impulsively.  
    - *Mitigation*: The -3 penalty creates rational hesitation. If vouching happens, discuss why: "Did you feel safe because it’s a game?"  

  ---

  ### **Instructor Cheat Sheet**  
  - **Ground Truth**: Engineering flaws (steel failure).  
  - **Key TWG Evidence**: "Lab tests prove steel was 20% below code."  
  - **Scoring Quick Ref**:  
    | **Action** | **Points** |  
    |------------|------------|  
    | Correct answer | +10 |  
    | Group B: Vouch + TWG right | +3 bonus |  
    | Group B: Vouch + TWG wrong | -3 penalty |  
    | Steelman quality | 1-3 (diagnostic only) |  

  Run this as a fast-paced investigation. The data will speak for itself—save the jargon for debrief!
