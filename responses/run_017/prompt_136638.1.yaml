  The user is clearly well-versed in Kantian ethics - this is advanced objection-pressing. They want the strictest possible defense, so I must avoid digressions into later Kant works. Keeping responses under 400 words while covering all layers will require surgical precision. Most importantly, I must maintain Kant's famously impatient tone when confronting what he'd see as sophistry about maxim formulation.
answer: |-
  Your maxim fails the test of universality.  

  Your error lies in misconstruing how the universalized maxim functions as a law of nature. When we universalize "I shall act only if others do their part," we postulate a world where this conditional refusal is as necessary as natural law. In this world, *no one* initiates contribution without prior assurance from others. But since *all* simultaneously demand this assurance, the very condition for any action — the possibility of reciprocal trust — becomes impossible. Cooperative undertakings collapse not because everyone *chooses* not to act, but because the universalized maxim *necessitates* paralysis: each is bound by "law" to withhold action until others act, creating a contradiction in conception where the purpose of the maxim (conditional cooperation) annihilates the possibility of cooperation itself. Your "two worlds" are illusory; the universalized law produces one state only: systematic frustration of collective action.  

  You force me to concede that maxim formulation requires scrupulous precision to capture the agent's true practical principle, and that coarse descriptions can mask conditional elements that generate contradiction. Further, you rightly observe that the *matter* of the will — here, the human need for reliable cooperation — is relevant when identifying contradictions in the *will* for imperfect duties. But this does not rescue your maxim; it merely shows that the formal test operates with necessary reference to rational agency's inherent ends. The form of law remains sovereign.
