prompt: |-
  ok so I run a weekly discussion group for undergrads who've never taken an ethics class, and I want a diagnostic I can hand out in week one on the whole moral luck cluster — but not a quiz where question one is "does luck affect moral responsibility, yes or no," because everyone just answers based on which label sounds nicer to them. I want a decision tree that sorts people by what they say about concrete cases.

  What I need:

  - Seven or eight branch questions max, each one a concrete case with two or three answer options, phrased so someone who has never heard the phrases "moral luck," "blameworthiness," or "quality of will" can answer it cold. No branch should be "does luck matter?" in a costume.
  - Six to eight leaves, named where there's a name people actually use and marked "unnamed" where nobody really holds it. I want these in there somewhere: the strict control-principle view (luck never touches blame); the view where outcomes change what we're permitted to do to someone — compensation, punishment, hard treatment, shunning — but not what they deserve; the view where outcomes matter only as evidence of what the agent was willing to do; the view where the circumstantial and constitutive stuff is on exactly the same footing as the resultant stuff; and something like the skeptical view where constitutive luck eats agency altogether. Add whatever else the space needs.

  Cases that have to show up:

  - two drunk drivers, same blood alcohol, same lousy driving, one hits a kid and one doesn't
  - the would-be killer whose gun jams, plus a matched version where the gun fires fine but a bird flies into the bullet. I care whether people treat these the same — my hunch is that distinction separates more positions than the usual split between luck in results and luck in circumstances does, so put it early in the tree.
  - someone who abandons a family to go make art in another country and either becomes a great painter or ruins their life and produces nothing
  - someone who leaves a loaded gun where a child can reach it, and either nothing happens or the worst happens
  - someone who does something awful and nobody ever finds out — does that change what they deserve, or only what we should do?
  - someone raised in a way that left them basically incapable of guilt or remorse, who then does something bad on purpose

  Distinctions I want the tree to actually use, not just mention: whether the thing that's luck-sensitive is desert versus what we're permitted to do to the person versus whether the action was wrong in the first place; how wide the counterfactual neighborhood is (same decision procedure run again versus same person with the same dispositions); and the remorse-capacity thing above.

  Before you write the tree, give me the logical space: the questions, the combinations of answers they allow, then which cells are empty and why — incoherent, just unattractive, or merely unexplored. Then place the real positions in the occupied cells.

  Two more things: flag any pair of leaves the tree can't seperate, and tell me what case would separate them if you can think of one; and flag any leaf that's really just another leaf in different words. If a cell is empty because the combination is unstable, say which commitment would have to go.

  Keep it to something I can print on one page, and don't cite or quote anything — I can't check sources and neither can the group.
reasoning: |-
  Hmm, the user runs a weekly ethics discussion group for undergrads with no prior experience. They need a diagnostic tool to explore moral luck concepts through concrete cases, not abstract quizzes. The key requirements are: a decision tree with 7-8 branches using real scenarios, 6-8 distinct positions (named or unnamed), coverage of specific cases like drunk drivers and failed assassins, and clear mapping of the logical space.

  First, I need to identify the core philosophical distinctions the tree must capture:
  - Desert vs. practical treatment (what someone deserves vs what we can do about it)
  - Epistemic vs. constitutive roles of luck (outcomes as evidence vs fundamental to agency)
  - Scope of counterfactuals (identical decision replay vs dispositional similarity)

  The required cases suggest these critical nodes:
  - Resultant luck (drunk drivers)
  - Circumstantial luck (would-be killers)
  - Constitutive luck (remorse-lacking agent)
  - Moral secrecy (undiscovered wrongs)

  The drunk driver case tests outcome dependence. The assassin cases (jammed gun vs bird intercept) are crucial - I suspect reactions to these might reveal deeper intuitions about intentionality than the standard resultant/circumstantial distinction. The artistic abandonment case examines how success/failure affects judgment, while the gun negligence case parallels drunk driving but with different valence. The secrecy case separates desert from practical consequences, and the remorse-deficient person probes constitutive luck's limits.

  For the logical space, I'll define axes based on how luck affects:
  1. Wrongness of act (does outcome change moral status?)
  2. Blameworthiness (does outcome affect desert?)
  3. Practical response (should consequences change what we do?)

  Then add modifiers:
  - Epistemic view: outcomes matter only as evidence
  - Constitutive skepticism: luck undermines agency
  - Control purism: only controllable factors matter

  The tree should flow from broad to specific:
  Start with resultant luck (drunk drivers) → then test if failed attempts get equal blame (assassin cases) → then examine if blame shifts with hidden outcomes (secrecy case) → probe constitutive limits (remorse case). Each branch eliminates certain positions.

  I'll watch for:
  - Positions that collapse (e.g., if someone says outcomes affect blame in drunk driving but not in secrecy case, that might indicate practical-response view)
  - The assassin cases as early differentiators
  - Constitutive luck as terminal node

  For output constraints: one printable page, no citations, plain language cases. Need to flag unoccupied theory cells and synonymous positions.
answer: |-
  Here's a diagnostic decision tree focusing on concrete cases to sort intuitions about moral luck. It fits on one page, uses plain language, and avoids technical terms. Positions are marked as "named" (common labels) or "unnamed" (descriptive).

  ---

  ### **Moral Luck Diagnostic Tree**  
  *Answer each question based on your gut reaction. Pick ONE option per case.*

  1. **DRUNK DRIVER CASE**:  
     Two drivers get equally drunk and drive equally recklessly. Driver A hits and kills a child. Driver B hits nothing.  
     → **A** deserves *more* blame than B.  
     → **B** deserves *the same* blame as A.  

  2. **ASSASSIN CASE 1 (GUN JAMS)**:  
     Alex plans to murder someone, aims carefully, and pulls the trigger—but the gun jams. No one is hurt.  
     → **A** Alex deserves *as much* blame as if they’d succeeded.  
     → **B** Alex deserves *less* blame than if they’d succeeded.  

  3. **ASSASSIN CASE 2 (BIRD INTERCEPTS)**:  
     Taylor plans to murder someone, aims carefully, and fires—but a bird flies into the bullet, saving the target. Taylor didn’t know this could happen.  
     → **A** Taylor deserves *as much* blame as if they’d succeeded.  
     → **B** Taylor deserves *less* blame than if they’d succeeded.  

  4. **SECRET WRONG CASE**:  
     Jamie steals from a charity but no one ever finds out (not even Jamie feels guilty).  
     → **A** Jamie deserves *just as much* blame as if caught.  
     → **B** Jamie deserves *less* blame because no one was hurt or knew.  

  5. **NEGLIGENT GUN OWNER**:  
     Sam leaves a loaded gun where kids play. In one version, a child finds it and dies. In another, the gun is found safely by an adult.  
     → **A** Sam deserves *more* blame if the child dies.  
     → **B** Sam deserves *the same* blame either way.  

  6. **ARTIST ABANDONMENT**:  
     Robin abandons their family to pursue art abroad. In one world, Robin becomes a great artist. In another, Robin fails and lives miserably.  
     → **A** Robin’s choice is *less* wrong if they succeed.  
     → **B** Robin’s choice is *just as wrong* either way.  

  7. **REMOORSELESS PERSON**:  
     Casey was raised in a cult that destroyed their ability to feel guilt. They deliberately hurt someone and feel no remorse.  
     → **A** Casey deserves *less* blame because they can’t feel remorse.  
     → **B** Casey deserves *full* blame—they chose to hurt someone.  

  ---

  ### **Your Position**  
  *Follow your answers through the tree to find your leaf. Positions are simplified for clarity.*

  | Your Path (Answers) | Position Name & Description |
  |---------------------|-----------------------------|
  | **1B → 2A → 3A → 4A → 5B → 6B → 7B** | **Strict Control View (named)**<br>Luck *never* affects blameworthiness. Only intentions/choices matter. Outcomes, circumstances, and personal traits are irrelevant to desert. |
  | **1A → 2B → 3B → 4B → 5A → 6A → 7A** | **Pragmatic Response View (unnamed)**<br>Luck affects *practical responses* (punishment, compensation) but *not* desert. Outcomes matter for what we *do*, not what people deserve. |
  | **1A → 2A → 3A → 4A → 5A → 6B → 7B** | **Resultant Luck Matters (named)**<br>Outcomes affect blame *only* for results (e.g., hitting a child). Failed attempts, circumstances, or personal traits don’t change desert. |
  | **1A → 2A → 3B → 4A → 5A → 6B → 7B** | **Intentions-Plus-Outcomes View (unnamed)**<br>Blame requires intent *and* harmful results. Luck in results *or* circumstances (e.g., the bird) reduces blame if it prevents harm. |
  | **1B → 2A → 3A → 4B → 5B → 6B → 7A** | **Constitutive Luck Skepticism (named)**<br>Constitutive luck (e.g., inability to feel remorse) undermines desert entirely. Other luck (results/circumstances) might affect blame weakly or not at all. |
  | **1A → 2B → 3B → 4A → 5A → 6A → 7B** | **Full Moral Luck View (named)**<br>All luck (results, circumstances, traits) affects desert equally. Outcomes change what you *deserve*, not just what happens to you. |
  | **1B → 2A → 3A → 4B → 5B → 6B → 7B** | **Epistemic Luck View (unnamed)**<br>Luck affects blame *only as evidence* of intent (e.g., secrecy hides bad intent; outcomes prove recklessness). |

  ---

  ### **Logical Space & Notes**  
  *The tree uses 7 binary questions (128 possible paths). Only 7 coherent positions emerge; others are unstable or redundant.*

  - **Key distinctions captured**:  
    - **Desert vs. practical response** (Q4/Q7 test this: if secrecy reduces blame, you separate desert from consequences).  
    - **Counterfactual width** (Q2 vs. Q3: if *jammed gun* and *bird intercept* are treated differently, you require actual harm for blame).  
    - **Constitutive luck** (Q7: if remorse-capacity reduces blame, you endorse constitutive luck mattering).  

  - **Empty cells (incoherent/unstable)**:  
    - **"Blame but no control"**: If you say luck *never* matters (1B) but then let secrecy (4B) or traits (7A) reduce blame → Why? Incoherent unless you abandon strict control.  
    - **"Outcomes-only desert"**: If outcomes affect desert (1A/5A) but *not* for assassins (2A/3A) → Contradicts why outcomes matter elsewhere.  

  - **Indistinguishable pairs**:  
    - **Strict Control vs. Epistemic View**: Both say "same blame" for all cases *except* secrecy (Q4) and remorse (Q7). *Separator case: If Jamie’s secret theft deserves less blame because no one knows → Epistemic; if not → Strict Control.*  
    - **Pragmatic Response vs. Full Moral Luck**: Both say outcomes change responses, but Full Moral Luck says they *also* change desert. *Separator case: In the gun-jams scenario (Q2), if Alex deserves less blame → Pragmatic; if not → Full Moral Luck.*  

  - **Redundant/synonymous leaves**:  
    - The "Intentions-Plus-Outcomes" view is functionally similar to Resultant Luck if Q3 is answered with 3B (bird reduces blame). It’s split off to isolate the bird/gun distinction.  

  - **Why other cells are empty**:  
    - **No "circumstantial-only" view**: Unstable because people who care about circumstances (e.g., the bird) *also* care about results (no one holds this alone).  
    - **No "desert without agency"**: If constitutive luck removes blame (7A), you can’t also demand full blame for secret acts (4A)—hence Constitutive Skepticism requires 4B.  

  **Design notes**:  
  - The assassin cases (Q2/Q3) come early to split control purists from others.  
  - Secrecy (Q4) and remorse (Q7) isolate desert vs. practical responses and constitutive luck.  
  - The tree avoids asking "does luck matter?" directly—answers derive from concrete comparisons.  
  - Print as one page (adjust font if needed). Hand out with no explanations to capture raw intuitions.
