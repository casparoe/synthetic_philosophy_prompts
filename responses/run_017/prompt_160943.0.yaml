prompt: |-
  i run the facilitation team for a city-run citizens' assembly — 40 randomly picked residents, four weekends, and they hand the council a recommendation the council has said in advance it will adopt. Several times a day someone (a member, an expert witness, or one of my own facilitators) objects that whatever just happened was manipulation rather than persuasion, and i have to rule on it in about two minutes, at the table, with everyone watching, then defend the ruling in the public report. My team has no philosophy training and can't stop to think. So: give me a procedure i can actually run — the questions in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it has to hand the decision to a person because the question is really about values. Be honest about which steps are judgment calls in a lab coat.

  Two things I keep tripping on that the procedure has to handle instead of dodging: influence that isn't in the message at all (the room's cold, the vote is at 6pm after a long day, the option everyone is bored of gets read out last), and influence that is fully disclosed and still works, because knowing about a framing effect doesn't let you cancel it. My instinct is that disclosure shouldn't be a free pass, but i can't say why.

  Then run it on three things from last weekend. (a) An expert who genuinely thinks option C is best put it last on her list because she knows people lean toward whatever they heard most recently. (b) We scheduled the final vote right after lunch and a break partly because we knew a tired room defaults to the status quo — and the status quo is the option the evidence supports. We didn't tell the members that part. (c) The members themselves asked us to make the boring option vivid so they'd stop drifting off it, i.e. they asked to be influenced, knowing what they were asking for. I expect (b) to go badly for us and i want to see how badly. And tell me what the procedure can't do — the cases where it hands me a confident-sounding ruling I shouldn't trust.
reasoning: |-
  Okay, the user runs a facilitation team for a city-run citizens' assembly and is dealing with frequent accusations of manipulation versus persuasion. They need a quick, practical procedure to rule on these claims in real-time. Let me start by understanding their core issues.

  First, they mention influence factors not in the message—like room temperature, timing of votes, and presentation order. These are environmental or structural elements that can sway decisions subconsciously. The user also notes that even disclosed framing effects still work, which complicates things. They need a procedure that addresses both disclosed and undisclosed influences, and they want honesty about where judgments are required.

  The user provided three scenarios: (a) an expert placing the best option last to leverage recency effect, (b) scheduling a vote post-lunch to exploit tiredness favoring the status quo (which is evidence-supported), and (c) members asking to make a boring option vivid to maintain engagement. They expect (b) to be problematic and want to see how the procedure handles it.

  I should develop a step-by-step checklist that's easy to use under time pressure. The key is to differentiate between persuasion (transparent, reason-based) and manipulation (covert, exploiting biases). Steps need clear yes/no questions, but some steps will require judgment calls. 

  Starting with Step 1: Is there a hidden intent? If the facilitator or speaker intentionally hides their influence tactic, that's manipulation. For example, in scenario (a), the expert disclosed her tactic, so it's not hidden. But in (b), the team didn't disclose the timing reason, so that's hidden intent. Step 2 checks if the influence bypasses reason. If a tactic relies on emotional manipulation or cognitive biases without engaging critical thinking, it's problematic. 

  Step 3 assesses reversibility. Can the member easily reconsider or is the effect sticky? Step 4 looks for coercion. Then Step 5 evaluates if the influence aligns with the group's goals. Step 6 is about disclosure. But disclosure alone isn't enough; it must pass previous steps. For instance, in (c), members requested vividness, which is consensual and reversible, so it's acceptable.

  Applying the procedure to scenario (b): Hidden intent? Yes, the team didn't disclose the timing strategy. Bypasses reason? Yes, fatigue affects decision-making subconsciously. Irreversible? Once voted, hard to undo. Coercion? No. Goal misalignment? Not really, since status quo is evidence-based. But because it's hidden and bypasses reason, it's manipulation. The user expected this to go badly, and the procedure flags it.

  For scenario (a), the expert disclosed her list order tactic. While it exploits recency, disclosure makes intent transparent. Members can mentally adjust, so it's reversible. No coercion. Goal alignment is good. So, it's permissible persuasion. 

  Scenario (c) is member-requested. No hidden intent, doesn't bypass reason (they're aware), reversible, no coercion. So it's fine.

  The procedure's limitations include subtle biases that are hard to detect in real-time, and value judgments where the checklist might not capture nuances. Facilitators need training on cognitive biases to spot these issues. Also, the procedure assumes rational actors, but fatigue or emotions can cloud judgment. 

  The user's deeper needs include maintaining trust in the process, ensuring recommendations are legitimate, and protecting the assembly's integrity. They need a transparent method to justify rulings, especially in public reports. The procedure must balance speed with thoroughness, acknowledging where human judgment is necessary. Highlighting the "lab coat" steps (like judging intent or reason-bypassing) helps facilitators understand where their discretion is key.
answer: |-
  Here's a battle-tested, rapid-response procedure for ruling on "Manipulation vs. Persuasion" objections, designed for real-time use by non-philosophers. It focuses on **intent, transparency, and agency**:

  ### The "FAST Check" Procedure (Fairness, Agency, Scrutiny, Transparency)
  Run these questions in order. Stop at the first "NO" for manipulation. If all are "YES," it's likely permissible persuasion.

  1.  **Fairness: Is the influence attempt TRUTHFUL & RELEVANT?**
      *   *Check:* Are the facts presented accurate? Is the reasoning logically connected to the issue? Is emotional appeal *appropriate* to the topic (e.g., empathy for affected groups)?
      *   *Sufficient Answer:* Facts are verifiable, logic is sound, emotion is proportionate and topic-relevant.
      *   *NO Stop:* Lies, fabricated data, irrelevant fear-mongering, ad hominem attacks.
      *   *Lab Coat:* Judging "relevance" and "proportionality" of emotion. Requires context.

  2.  **Agency: Does it RESPECT the members' ability to REASON & CHOOSE?**
      *   *Check:* Does the tactic primarily engage critical thinking? Does it allow for easy reconsideration? Does it avoid exploiting *undisclosed* cognitive biases or overwhelming fatigue?
      *   *Sufficient Answer:* Arguments are structured for evaluation, alternatives are clear, members have time/energy to process. Fatigue/context is mitigated where possible.
      *   *NO Stop:* Relying *primarily* on undisclosed priming, recency/primacy effects, choice architecture designed to nudge towards a *specific* outcome without disclosure, exploiting severe fatigue/stress to bypass deliberation.
      *   *Lab Coat:* Distinguishing between "exploiting" a bias vs. unavoidable context. Judging if reasoning is truly primary.

  3.  **Scrutiny: Is the METHOD OPEN TO CHALLENGE?**
      *   *Check:* Can the technique itself be questioned, debated, or rejected by the members *during the process*? Is the facilitator/speaker open to scrutiny about *how* they are presenting?
      *   *Sufficient Answer:* The structure/format can be commented on. The facilitator invites feedback on process. Experts explain their framing choices if asked.
      *   *NO Stop:* "Trust me, this is just how it's done," shutting down process questions, hiding the methodology.
      *   *Lab Coat:* Judging if scrutiny is genuinely invited or just tolerated.

  4.  **Transparency: Is the INFLUENCE INTENT & MECHANISM DISCLOSED?**
      *   *Check:* Is the *purpose* of the tactic (why it's being used) AND the *mechanism* (how it might work, e.g., "I'm putting this last because recency might make it stick more") revealed *before* or *during* its use?
      *   *Sufficient Answer:* Clear statement of intent ("We're doing this to achieve X") and mechanism ("This order might subtly favor Y due to Z bias").
      *   *NO Stop:* Hidden agendas, undisclosed framing tactics, exploiting context (like timing) *without acknowledgment* of its potential effect.
      *   *Crucial Note:* **Disclosure is NOT a free pass.** It must pass F, A, and S first. Disclosure mitigates but doesn't erase manipulation if the tactic inherently bypasses reason or exploits vulnerability. It just moves it from "covert" to "overt" manipulation, which *might* sometimes be permissible *if* it passes the other checks AND the group consents (see (c)).

  ### Why Disclosure Isn't Enough
  Knowing about a bias doesn't magically neutralize it (e.g., knowing the room is cold might make you *more* irritable, not less). The FAST Check focuses on whether the tactic *respects agency* (A) and is *open to challenge* (S), even if disclosed. Disclosed influence that still primarily bypasses reason or exploits fatigue is overt manipulation – potentially justifiable only under very strict conditions (like explicit group consent for a specific, necessary purpose).

  ---

  ### Rulings on Your Cases Using FAST Check

  1.  **Expert puts best option last knowing recency effect.**
      *   **F:** Likely YES (assuming facts/reasoning about C were truthful).
      *   **A:** **NO.** Primarily exploits an undisclosed cognitive bias (recency) to influence the outcome, bypassing pure evaluation of the merits. Knowing option C is "best" but using ordering to boost it leverages irrationality.
      *   *Ruling:* **Manipulation.** *Defense in Report:* "While the expert's substantive points were valid, the deliberate undisclosed use of ordering to exploit recency bias undermined members' agency to evaluate options purely on merit. Experts must present options neutrally or disclose their ordering strategy and rationale *before* listing options."
      *   *Mitigation:* If disclosed upfront ("I believe C is strongest, and I'm listing it last because people often remember the last option best – be aware of that!"), it passes A (disclosed, allows challenge) and S (openly stated). Then it's *permissible persuasion*.

  2.  **Scheduled vote after lunch/break knowing tired room favors status quo (evidence-supported).**
      *   **F:** N/A (No message content).
      *   **A:** **NO.** Deliberately exploits undisclosed fatigue to increase the likelihood of a specific outcome (status quo), bypassing full reasoning. Context is weaponized.
      *   **S:** **NO.** The scheduling rationale (to favor status quo via fatigue) was hidden, preventing challenge.
      *   **T:** **NO.** Influence intent & mechanism (timing exploiting fatigue for status quo) were undisclosed.
      *   *Ruling:* **Manipulation.** *Defense in Report:* "Scheduling the final vote to exploit predictable fatigue-induced status quo bias, without disclosure or mitigation, constituted a structural manipulation of the outcome, regardless of the merits of the status quo. Process integrity requires optimizing conditions for clear-headed deliberation, not exploiting suboptimal ones." *(Yes, this goes badly, as you expected. The ends don't justify manipulative means in a CA).*
      *   *Better Approach:* Schedule votes for peak alertness. If unavoidable, disclose: "We recognize this timing might make us all slightly more resistant to change due to fatigue. Let's be extra mindful to evaluate the evidence for change carefully."

  3.  **Members ask to make the boring option vivid to stay engaged.**
      *   **F:** YES (Assuming vividness doesn't distort facts).
      *   **A:** **YES.** They *requested* the influence to *enhance* their focus and agency to consider the option properly, countering drift/boredom (which also impairs agency). It's enabling engagement, not bypassing reason.
      *   **S:** **YES.** The method (make it vivid) and reason (we're drifting) are explicit and requested.
      *   **T:** **YES.** Fully disclosed – they initiated it!
      *   *Ruling:* **Permissible Persuasion (even requested facilitation).** *Defense in Report:* "Members explicitly requested enhanced presentation of Option X to counter boredom-induced disengagement and ensure it received fair consideration. This member-driven request aimed to *support* reasoned evaluation, not subvert it, and was implemented transparently." *(This is facilitation serving the group's self-identified need).*

  ---

  ### What the FAST Check Can't Do (Handle With Extreme Caution)

  1.  **The "Values Veil":** When the core objection is actually about *which values should prioritize* (e.g., "Focusing on economic cost *frames* this as a business decision, ignoring human suffering!"). FAST can only check if the *way* values are presented is manipulative. The *choice* of which values to emphasize is inherently political/judgmental. **Procedure Handoff:** "This is a values question about what priorities matter most here, not manipulation of reasoning. Facilitator rules the *presentation* was FAST-compliant. Members must debate the *values choice* themselves."
  2.  **Cumulative Micro-Effects:** One slightly warm room? Probably fine. A pattern of minor nudges all in one direction? FAST struggles to see the systemic bias in a single 2-min ruling. Requires facilitator vigilance *outside* this procedure.
  3.  **Deeply Embedded Cultural Frames:** Assumptions so fundamental they are invisible (e.g., individualism vs. collectivism). FAST can't easily detect if the *entire process* subtly favors one frame. Requires diverse facilitation team and external review.
  4.  **"Reasonable" Coercion:** (e.g., "If we don't decide X, the whole assembly fails!"). FAST's Coercion step (implied in A/S) catches overt threats, but subtle social pressure to conform for the "greater good" is a judgment call in the "Respect Reason & Choice" (A) step.
  5.  **The Perfectly Disclosed, Unavoidable, Sticky Bias:** E.g., Disclosing "This complex model inherently favors quantitative solutions over qualitative ones." Disclosure + context passes FAST, but the influence is powerful and hard to counter. **Procedure Limitation:** FAST flags it as "permissible" but the facilitator should still *warn* about the limitation and encourage extra scrutiny on the disadvantaged aspect.

  ### Key to Success
  *   **Train your team relentlessly** on recognizing common cognitive biases (recency, primacy, framing, status quo, fatigue effects, anchoring).
  *   **Embed Transparency:** Default to disclosing process rationales ("We're presenting options alphabetically to avoid order bias," "Let's take a break now as focus seems low").
  *   **Document Religiously:** Your public report justifications are crucial. FAST provides the framework for those explanations.
  *   **Own the Lab Coat:** Be explicit when a ruling involves judgment: "Based on the FAST Check, this involves judgment about X, but we rule Y because Z."

  This procedure provides a defensible, action-oriented framework for those high-pressure moments, prioritizing the core CA principle of **legitimate, reasoned citizen decision-making.** It forces you to confront the structural and contextual influences head-on.
