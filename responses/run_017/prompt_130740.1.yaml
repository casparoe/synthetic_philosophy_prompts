  First, I need to define what makes a representation real versus a redescription. The user provided specific cases: seed relativity, unused representations, vector injection, and co-occurrence. They also mentioned key distinctions like causal efficacy versus recoverability, token vs dispositional, and the net's representation vs our model of it.

  The user is likely in AI or philosophy, given the technical depth. They need a rigorous framework to prove their point. Their deeper need might be for a principled way to evaluate interpretability claims, avoiding anthropomorphism while acknowledging real structures.

  Desiderata must include non-negotiable points. Causal grounding is crucial—representation must play a causal role in the net's computations. Counterfactual robustness ensures it's not just correlative. The seed relativity case shows that if a feature isn't causally involved, it's not a representation, even if probeable. For the unused direction, if lesioning or steering does nothing, it's not a representation, just a correlate.

  Vector injection into another net: if B behaves as if the feature is present, it's not B's representation but a manipulation. The co-occurrence case needs vector decomposition to assign content based on causal role in different contexts.

  The tension between causal role and unused/false representations is key. If a representation must have a causal role, unused features aren't representations. The user suspects this tension, so I need to address it directly. Drop the idea that unused features are representations because without causal efficacy, it's just recoverable information, not content.

  The single requirement that knocks out most accounts is causal grounding. Many interpretability methods find correlations, but without causal involvement, it's redescription. This aligns with the user's need to distinguish discovery from storytelling.
answer: |-
  **Bottom line:** A neural network state *S* (e.g., an activation vector) genuinely represents feature *X* only if *S* plays a specific, counterfactually robust *causal role* in the network's own computational process for producing behavior relevant to *X*, making *S*'s content fixed by the network's functional architecture and training, not our post-hoc analysis.

  **Desiderata for Representation (R):**

  1.  **Causal Grounding (Non-negotiable):** *S* must be a causally efficacious component *within the network's own computation* leading to outputs *relevant* to *X*. Merely carrying information about *X* is insufficient.
      *   *Why:* Knocks out probes finding unused correlations (your "predicts perfectly but lesioning/steering does nothing" case). If *S* doesn't causally contribute to *behavior* involving *X* (even if only internally), it's a correlate, not a representation *for the network*. The "vector injection" case also fails: *B* behaves *as if* *X* is present due to the poke, but the injected vector isn't *B*'s own representation; it's an external input forcing a state.
      *   *Distinction:* Represents *X* vs. *X* being recoverable.

  2.  **Counterfactual Robustness (Non-negotiable):** Interventions on *S* (e.g., ablation, precise steering) should reliably and specifically alter the network's behavior in ways *consistent with the manipulation of X*, *across a range of relevant inputs*. The effect must be more specific than just breaking the network.
      *   *Why:* Ensures *S*'s causal role is *about X*, not just being a generic important signal. Handles the "unused direction" case: if steering/lesioning changes *nothing*, *S* doesn't represent *X*. If steering *S* always makes the net act *as if X is true/false* in semantically appropriate ways (e.g., steering "French" makes English text output as French grammar), then *S* has representational content about *X* even if it wasn't *behaviorally necessary* on the original inputs. Distinguishes representation from causal efficacy.
      *   *Distinction:* Represents *X* vs. *X* being causally efficacious (a state can represent *X* without *X* being *necessary* for behavior on all inputs).

  3.  **Architectural Specificity (Non-negotiable):** The representational status of *S* and its content must be fixed by the network's specific computational architecture, parameters, and training history. It cannot be purely relative to an external interpreter or probe.
      *   *Why:* Addresses seed relativity. If Net A has a clean "French" direction that satisfies Causal Grounding and Counterfactual Robustness, and Net B (same arch/data, different seed) lacks *any single state* playing that *specific causal role* (even if probes find *some* correlate or behavior is identical), then only Net A represents "Frenchness" in that direct way. Representation is seed-relative. The fact that probes can find correlates in B doesn't mean *B* itself represents it that way. Handles the "wildly many internal implementations" constraint.
      *   *Distinction:* The net representing *X* vs. *our model* of the net representing *X*.

  4.  **Content Determinacy (Negotiable - "Camp Want"):** The content represented by *S* should be the *most specific* feature *X* whose manipulation via *S* reliably produces the counterfactually robust behavioral changes described in (2). This favors decomposition.
      *   *Why:* Handles co-occurrence/superposition. If a single direction fires for both "Horns" and "Stop Sign" due to co-occurrence, but *steering it up* reliably makes the net act *only* as if horns are present in contexts about animals, and *only* as if stop signs are present in driving contexts (satisfying 2), then it represents *both*, and their disentanglement is part of the network's computation. If steering always induces *both* concepts nonspecifically, then the content might be the co-occurrence itself ("Horns&StopSign") or a more abstract feature ("Decorative Traffic Element"). This is where interpretability aims to refine descriptions. *Why negotiable:* Strict determinacy might be intractable; there might be legitimate indeterminacy at the margins.

  5.  **Token/Disposition Distinction (Non-negotiable):** Representation applies primarily to *dispositional features* of the network (the function implemented by its parameters). Specific activation vectors (*tokens*) instantiate these dispositions during processing. Content is ascribed based on the dispositional role.
      *   *Why:* A single activation vector might be ambiguous (e.g., in superposition). Its content is fixed by the *network's general functional response* to states like it (Counterfactual Robustness), not just its state in one instance. Explains how features "appear, split, and merge" during training – the disposition evolves. The injected vector in Net B isn't *B*'s disposition, it's a transient token forced upon it.

  **The Tension & Resolution:**
  *   **The Tension:** "Causal Grounding" (1) requires a causal role *in the network's behavior/computation*. "Unused Representations" (features causally grounded but never *necessary* for behavior) are possible (as per 2). However, **False Representations** (features causally grounded but systematically misleading) and **Completely Unused Representations** (causally grounded features *never* utilized in *any* output) create tension.
  *   **Resolution: Drop "Completely Unused" and strictly limit "False":**
      *   **Drop "Completely Unused":** If a state *S* is causally grounded (1) but *never*, in *any* input or context, influences *any* output relevant to its purported content *X* (even internal layers feeding later computation), then it fails **Counterfactual Robustness (2)**. There are *no* counterfactuals where changing *S* changes behavior about *X*. It might be a vestige or correlate, but it doesn't *functionally represent X for the network*. (Your "unused direction" case only works if interventions *do* change behavior, proving it's not completely unused).
      *   **Limit "False":** A state *S* can represent *X* *falsely in a specific instance* (e.g., a "cat" neuron firing for a dog due to adversarial noise). However, for *S* to stably represent *X* at all, its *general, counterfactually robust causal role* (2) must be *veridical under normal operating conditions/distributional inputs*. Systematic, *training-distribution* false representation (e.g., *S* causally triggers "cat" outputs for *all* dogs) implies either:
          1.  The network is dysfunctional/broken (fails its own objectives).
          2.  Our attribution of *X="cat"* is wrong; its content is something else (e.g., "thing that looks like a typical cat to this net").
      True representation requires a *functional fit* between the causal role and the environment the network was adapted to.

  **The Account-Killer Requirement:**
  **Causal Grounding (1)** is the single requirement that knocks out the most candidate accounts (especially purely information-theoretic or probe-based accounts). It directly confronts the core of your roommate's skepticism ("projecting stories about matrices") and your "redescription vs. discovery" demand. If a purported representation isn't doing causal work *within the net's own process*, then no matter how clean the probe or compelling the story, it's fundamentally a description *we* impose, not a representation the network itself uses. It forces the distinction between correlation found by an external observer and functional structure inherent to the system.
