prompt: |-
  ive been trying to write down my actual position on the problem of old evidence for a reading group in phil sci, and the more I write the more I suspect im holding things that dont fit together. here's the bundle as it currently stands:

  1. Bayesianism is the right account of rational belief change: credences, probabilism, update by conditionalization.
  2. The problem of old evidence is a real problem, not a pseudoproblem. Paradigm case: the anomalous advance of Mercury's perihelion. Roughly 43 arcseconds per century that Newtonian theory couldn't account for, noted by Le Verrier back in the mid-nineteenth century; in 1915 general relativity got it, and that genuinely counted in GR's favour. But if your credence in the datum is already 1, then P(H given E) = P(H), so on the machinery there's no confirmation to be had.
  3. I dont like any of the standard repairs:
   - the counterfactual or ur-prior move (go back to the credence function you'd have had before you learned E and update from there). Two objections: it asks you to reason from a credence state that contradicts what you actually know, and it needs a prior over general relativity at a time when nobody could even formulate the theory, so the prior isn't so much as statable.
   - the move where what you really learn is that H entails E. Entailment facts aren't the sort of thing you can hold a nontrivial credence in and then learn.
  4. But I want to keep the verdict: old evidence really can confirm, and the scientists were right to count the perihelion advance for GR.
  5. Confirmation is objective. It's a relation between evidence and hypothesis that holds or fails independently of anyone's psychology, and you can find out later that some old datum had been confirming a theory all along.
  6. Doxastic attitudes are one-dimensional — degrees of belief and nothing else. No extra attitude of acceptance, or of taking something to be explained, doing work alongside credence.
  7. Explanatoriness is evidentially relevant in its own right, and I dont think a Bayesian gets to absorb that by saying the explanatory considerations were already packed into the likelihoods or the prior.
  8. Methodological: if a formalism can't reproduce an evidential judgment that working scientists actually make and treat as binding, that's a mark against the formalism, not against the practice.
  9. I'm fine with idealization — logical omniscience, unbounded agents, no computational limits. I dont attack Bayesianism on nobody could actually do this grounds.
  10. My own attempt at a repair, which I'll call the partition-shift view: what's new in 1915 isn't the datum, it's the menu. Confirmation by old evidence gets measured against the partition of live alternatives at the time — GR earns credit because it accounts for the datum without the ad hoc auxiliaries the Newtonian account needed, and in doing so knocks rivals out. So it's elimination inside a shifting space of alternatives, not probability-raising on a fixed one.

  Two things people have said to me that I can't shake: a colleage says my favourite example is actually the one case where the standard machinery is fine, because what Einstein established in 1915 was the derivation, not the observation. And someone else says (3) and (9) can't both be mine — I'm rejecting a move as unrealizable while signing up to logical omniscience.

  What I want is an audit, not a survey. Go through the ten and rank the tensions by how bad they actually are; say which ones are only apparent and what makes them dissolve; and for each real one say what would have to give and what giving it would cost me. Then commit: if I can only keep nine, tell me which one goes and why — don't hand me a menu and leave me to choose. And if the partition-shift thing in (10) just collapses back into one of the moves I rejected in (3), say that plainly rather than being polite about it.
reasoning: |-
  Okay, let me start by really understanding what this user is grappling with. They're deep into the problem of old evidence in Bayesian confirmation theory, specifically the case of Mercury's perihelion confirming GR. They've listed ten commitments that seem to be in tension, and they want an audit—not just options but a forced choice on what to drop. 

  First, I need to unpack each of their points. The user is committed to core Bayesianism (1) but sees the old evidence problem as real (2). They reject standard solutions (3), especially the counterfactual prior and entailment moves. Yet they insist old evidence confirms (4), that confirmation is objective (5), and doxastic states are purely credence-based (6). They also think explanatoriness is evidential (7), prioritize scientific practice over formalism (8), accept idealization (9), and propose their own partition-shift view (10). 

  The two critiques they mention are nagging at them: that the Mercury case might be solvable standardly via derivation, and that rejecting counterfactual priors (due to unrealizability) clashes with accepting logical omniscience. 

  Hmm. Let me map the tensions systematically. The biggest conflict is between (9) (idealization/logical omniscience) and their rejection of counterfactual priors in (3). If they accept that agents can model pre-E knowledge *as an idealization*, why not extend that to pre-E priors? Their objection about GR being "unstatable" pre-1915 might weaken under idealization—after all, logical omniscience already assumes agents can grasp all possible theories. 

  Next, their partition-shift view (10) feels like it might collapse into the counterfactual move they hate. If confirmation depends on comparing against *live alternatives at the time*, that seems to require imagining a credence function where E isn't fixed—which is essentially the counterfactual prior. They can't have (10) without smuggling in (3)'s "ur-prior." 

  Then there's (7) (explanatoriness as fundamental) vs. (1) and (6) (pure Bayesianism). If explanatoriness isn't reducible to priors/likelihoods, but doxastic states are *only* credences, where does explanatory value "live"? This might force them to either add a doxastic attitude or soften Bayesianism. 

  Also, (8) (deferring to scientific practice) and (1) (Bayesianism as "right") are in tension if Bayesianism can't handle perihelion confirmation without repairs they've rejected. If scientists *feel* confirmed, but Bayesian machinery says no, (8) says blame the formalism—but they've doubled down on (1). 

  For the forced choice: if they keep all but one, (9) *has* to go. Why? Because keeping idealization resolves the counterfactual objection, making their (3) rejection inconsistent. Dropping (9) lets them say "counterfactual priors *are* unrealizable, full stop"—saving their critique. The cost is losing clean foundations for probabilism/conditionalization, but their (8) might cover that. 

  Alternatively, if they *keep* (9), they must drop their objection to counterfactual priors—meaning (3) gives way. But that feels like a bigger hit to their overall view. 

  Final note: their (10) is probably a disguised counterfactual move. I'll tell them plainly—it collapses. No politeness.
answer: |-
  Here’s a ruthless audit of your ten commitments, ranking tensions by severity, diagnosing resolvable/apparent conflicts, and forcing a choice. The conclusion: **you must abandon (9) (idealization/logical omniscience)**. Below is the breakdown:

  ---

  ### **Ranked Tensions (Worst to Least Bad)**
  1.  **(9) vs. (3):** **Fatal conflict.**  
      - **Nature:** You reject counterfactual priors (in 3) partly because they’re "unrealizable" (e.g., no prior for GR pre-1915). But (9) embraces logical omniscience and unbounded agents, which *demands* agents can model pre-evidence states—even for unimagined theories. If idealized agents can assign probabilities to all logical possibilities (incl. future theories), your "unstatable prior" objection collapses.  
      - **Cost of keeping both:** Undermines your rejection of the ur-prior move. Your (3) relies on contingent human limitations, but (9) explicitly dismisses those.  
      - **Resolution:** Abandon (9) or concede counterfactual priors are viable under idealization (gut 3b).

  2.  **(10) vs. (3):** **Collapse into hypocrisy.**  
      - **Nature:** Your partition-shift view requires evaluating how *E* affects probabilities *relative to a historical context* (e.g., Newtonian rivals pre-1915). But this *is* a counterfactual move: it asks you to compute confirmation using a credence function that doesn’t fix *E* as known (i.e., the "live alternatives" partition assumes you’re ignorant of *E*).  
      - **Why it’s not new:** This is the ur-prior move in disguise. Instead of "forgetting *E*", you "forget which theories are live". The same objections apply (reasoning from false/unknown states).  
      - **Resolution:** Admit (10) is a variant of the counterfactual move you rejected—or drop it.

  3.  **(7) vs. (1)/(6):** **Deep structural incompatibility.**  
      - **Nature:** If explanatoriness is evidentially relevant *in its own right* (7), but doxastic states are *only* credences (6), and Bayesianism is "right" (1), explanatory power must reduce to priors/likelihoods. But you deny this reduction (7). Something must break.  
      - **Tension severity:** Severe but not fatal—*if* you allow explanatory considerations to directly constrain priors/likelihoods. But you resist this in (7).  
      - **Resolution:** Soften (6) (allow non-credal attitudes) or concede explanatoriness is "packed into" the Bayesian machinery. Otherwise, (7) threatens (1).

  4.  **(5) vs. (1):** **Potential inconsistency.**  
      - **Nature:** If confirmation is objective (5), but Bayesianism is subjective (credences are agent-relative), how can confirmation be "independent of psychology"? Standard Bayesianism makes confirmation *relational* (between *E*, *H*, and agent’s credences).  
      - **Resolution:** Salvageable if you adopt "objective Bayesianism" (e.g., constraints like maximum entropy). But this clashes with your methodological (8) if scientists don’t use such principles. Mild tension if you accept idealized rational consensus.

  5.  **(8) vs. (1):** **Methodological threat.**  
      - **Nature:** If scientists treat perihelion as confirming GR (8), but Bayesianism can’t capture this without moves you reject (3), then (8) says "blame Bayesianism". But you call Bayesianism "right" (1).  
      - **Resolution:** Weaken (1) to "Bayesianism is broadly correct but incomplete". Or use (10) as a patch—but note it collapses into (3).

  6.  **(2) vs. (4):** **Apparent tension (resolvable).**  
      - **Nature:** (2) says old evidence is a problem; (4) says old evidence confirms. Tension dissolves if your solution (10) works—but since (10) fails, this remains problematic.  
      - **Resolution:** Only fixed by a working solution.

  7.  **(6) vs. No direct conflict:** Stands alone but exacerbates (7).

  ---

  ### **Forced Choice: Drop (9)**
  **Why (9) must go:**  
  - It directly contradicts your strongest objection to the counterfactual move (3). By allowing logical omniscience/unbounded agents (9), you *must* grant that idealized agents *can* model pre-*E* priors—even for GR. Your "unstatable prior" argument fails.  
  - Dropping (9) preserves your rejection of counterfactual priors (3) on *pragmatic* grounds (real agents can’t reconstruct historical ignorance). This aligns with your defense of scientific practice (8).  
  - **Cost:** You lose the "clean" foundation for probabilism/conditionalization (1). But this is survivable: Bayesianism can still be a normative ideal *in principle*, even if we lack access to ur-priors. Focus on *updating* rather than *origins* of credences.

  **Why not drop something else?**  
  - Dropping (3) saves (9) but guts your critique of mainstream solutions.  
  - Dropping (7) saves Bayesian purity but abandons your view of explanation.  
  - Dropping (10) is necessary (it collapses) but insufficient to resolve core tensions.  
  - Dropping (1) undermines your entire framework.  

  ---

  ### **The Mercury Perihelion: Your Colleague is Half-Right**
  - **"Derivation not observation":** True, Einstein learned *that GR entails E*. But standard Bayesianism treats this as learning a logical truth (*P(H⊃E) = 1*), which (by probability theory) cannot change credences if *P(E)=1* already. Your (3) correctly rejects "learning entailment" as a solution.  
  - **Why it doesn’t save you:** Even if we focus on the derivation, the problem persists. Logical learning shouldn’t shift credences under idealization (9). Your (10) offers a pragmatic alternative—but again, collapses into (3).

  ---

  ### **Final Verdict**
  - **You must drop (9):** Idealization/logical omniscience is unsustainable with your other commitments.  
  - **Consequences:**  
    - Your (3) objections stand (counterfactual priors are *practically* impossible).  
    - (10) remains useful as a *heuristic* for scientific practice (8) but isn’t a formal solution—it’s psychology, not epistemology.  
    - Bayesianism (1) is weakened but retainable as a local (non-historical) norm.  
    - Core insight preserved: Old evidence confirms by recontextualizing *E* against new rivals (10), even if not "probabilistically".

  **The bundle survives—battered but coherent—as a critique of *naive* Bayesianism that prioritizes real scientific reasoning (8) and explanatory power (7), while rejecting unrealizable idealizations (9).**
