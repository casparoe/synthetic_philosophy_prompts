  1. Hidden-nature-gradually-revealed (essentialism): There is a fixed hidden nature that we gradually discover, and our concept adjusts as we learn more.
  2. Meaning-shifted (merely verbal): The meaning of the term shifts over time, so disputes are merely about words.
  3. Cluster or similarity-to-paradigm (family resemblance): The concept is held together by overlapping similarities to a paradigm or a set of features.
  4. Copycat/valence-transfer: We extend the term because the new case shares the positive valence (care, authenticity, prestige) of the paradigm, not because it shares the same defining features.
  5. Fluid-concept: The concept is maintained by active analogies to the paradigm, so slippage is inherent and functional.
  6. Practitioners'-call: The meaning is determined by the community of practice (e.g., chefs, home cooks) who use the term.
  7. Engineering: It's up to us to fix the boundaries for practical purposes.

  We must avoid certain words: vague, essence, family resemblance, verbal, deference, externalism, stipulation, concept.

  The quiz will have 8 or 9 questions. Some questions will be stepwise with tiny variations to test tolerance pressure.

  We design the questions to sort the accounts by the pattern of answers. We also note that some accounts might not be separable by the quiz and we must flag those. We also provide at least two answer combinations that are unoccupied and why.

