answer: |-
  ### Philosophy of Language Seminar: Conceptual Slippage Quiz  
  **Topic:** The word "homemade" in food contexts  

  **Instructions:** Answer all questions based on your immediate judgment. Choose one option per question. Focus on concrete cases—no need for philosophical jargon.  

  ---

  #### **Question 1: Cake-Making Sequence**  
  Consider these steps:  
  - **(A)**: You bake a cake entirely from scratch: grow/mill the wheat, raise chickens for eggs, churn butter.  
  - **(B)**: You bake from scratch using store-bought flour, eggs, and butter.  
  - **(C)**: You bake a cake using a box mix (add eggs/oil).  
  - **(D)**: You buy a pre-baked cake, add frosting at home.  

  At which step does it stop being "homemade"?  
  ( ) Between A and B  
  ( ) Between B and C  
  ( ) Between C and D  
  ( ) It never stops  

  ---

  #### **Question 2: Meal-Prep Sequence**  
  Consider these steps:  
  - **(A)**: You cook a meal from raw ingredients: chop vegetables, prepare sauce.  
  - **(B)**: You use pre-chopped veggies and pre-made sauce, but cook/assemble.  
  - **(C)**: You cook a meal-kit (pre-measured ingredients).  
  - **(D)**: You reheat takeout at home, garnish, and serve.  

  At which step does it stop being "homemade"?  
  ( ) Between A and B  
  ( ) Between B and C  
  ( ) Between C and D  
  ( ) It never stops  

  ---

  #### **Question 3: Takeout Remix**  
  You order cooked components from two restaurants. At home, you combine them into a new dish, adding spices and arranging it carefully. Is this "homemade"?  
  ( ) Yes—it reflects care and personal touch at home.  
  ( ) No—the core cooking was done elsewhere.  
  ( ) Only if your assembly meaningfully changes it.  

  ---

  #### **Question 4: Restaurant Claim**  
  A restaurant advertises "homemade bread" made on-site by staff. Is this a legitimate use?  
  ( ) Yes—it was made fresh on the premises.  
  ( ) No—"homemade" should mean "in a home."  
  ( ) It’s acceptable if it signals non-industrial preparation.  

  ---

  #### **Question 5: Machine-Cooked Meal**  
  A machine in your kitchen cooks a meal from ingredients you selected. You load it and press "start." Is the meal "homemade"?  
  ( ) Yes—it was created in your home with your choices.  
  ( ) No—you didn’t actively cook it.  
  ( ) Only if the machine is a tool (like an oven).  

  ---

  #### **Question 6: Recipe Adaptation**  
  You make a family casserole recipe but swap one fresh ingredient for canned soup. Is it "homemade"?  
  ( ) Yes—it’s your home preparation of a family dish.  
  ( ) No—the canned soup makes it factory-dependent.  
  ( ) Only if the swap doesn’t alter the dish’s core identity.  

  ---

  #### **Question 7: Box-Mix Dispute**  
  Two people argue about a cake made from a box mix (you add eggs/oil). One says, "It’s homemade—you baked it!" The other says, "It’s not—you didn’t make it from scratch!" Is there a fact about who’s right?  
  ( ) Yes—one is objectively correct.  
  ( ) No—it’s about personal interpretation or context.  

  ---

  #### **Question 8: Historical Shift**  
  In 1950, only food from raw ingredients was called "homemade." Today, many call box-mix cakes "homemade." What explains this?  
  ( ) We were wrong in 1950—box mixes always counted.  
  ( ) The word’s meaning has shifted over time.  
  ( ) Both uses are valid—context determines meaning.  

  ---

  #### **Question 9: Expert Redefinition**  
  Bakers create a rule: Only cakes from scratch can be labeled "homemade." If widely adopted, does this change the word’s meaning for everyone?  
  ( ) Yes—experts set standards for such terms.  
  ( ) No—common usage determines meaning, not experts.  
  ( ) It creates a technical meaning, but everyday use may differ.  

  ---

  ### Scoring Key  
  Match your answer patterns to the accounts below. **Note:**  
  - Some accounts overlap; this flags where the quiz can’t fully separate them.  
  - Two answer combinations are unoccupied (details at end).  

  #### **1. Hidden-Nature-Gradually-Revealed Account**  
  - **Your pattern:** Q7 = "Yes" (fact exists); Q8 = "We were wrong" or "Both valid"; Q9 = "No" (experts don’t dictate meaning).  
  - **Why?** You see "homemade" as having a fixed, discoverable boundary, even if our understanding evolves.  

  #### **2. Meaning-Shifted (Merely Verbal) Account**  
