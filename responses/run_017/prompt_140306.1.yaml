prompt: |-
  Hey — I run a lunch-and-learn thing at work every other Friday, audience is backend engineers (Go and Rust mostly). Most of them did a first-year linear algebra course and remeber roughly what a vector is and that you square amplitudes to get probabilities; that's the ceiling. Next session is mine and I volunteered to do "is the wavefunction real?" because I got nerdsniped by it on a podcast and now I actually have to deliver. 40 minutes, whiteboard, no slides.

  Don't explain the topic to me — I need a plan for how to explain it.

  What I care about:

  The example I keep reaching for is a compression analogy: the wavefunction as a lossy sketch of some underlying state (a minhash, a bloom filter, a hash of a big object), where two different sketches can both be consistent with the same underlying data. My worry is that this either smuggles in the answer or breaks somewhere I can't see. So: is that the right thing to build the session on, what does it have to have in it, and where exactly does it stop matching the real case? (I think the fancy words are psi-ontic and psi-epistemic, if that helps.)

  I also want to sort people's instincts into three bins early, by show of hands: (a) the wavefunction is a thing that's out there, (b) it's information about a thing that's out there, (c) it's neither a thing nor information but more like a law or a rule. Is (c) genuinely its own bin or does it quietly collapse into (a) or (b)? I like it but I might be making it up.

  Wether these are the misconceptions to expect, and where in the sequence to kill each: one guy will say Bell's theorem already settled it (nonlocality and so on); one person has read a bit of QBism and will say it's all just personal belief; someone will assume that if it's "real" then it's a wave in ordinary 3D space; someone will bring up decoherence as if that ends the discussion. Tell me if I'm missing the big one.

  Also: what should I flat out refuse to explain at this level, and say out loud that I'm refusing it? And one question to end on that shows me they got the distinction instead of just the vocabulary — I'd rather they leave able to say why epistemic isn't the same as subjective than able to name any view.

  No equations on the board beyond maybe |psi|^2, people zone out hard.
reasoning: |-
  We are designing a 40-minute lunch-and-learn session for backend engineers with basic linear algebra and quantum probability background. The topic is "Is the wavefunction real?" and we want to avoid deep math, focusing on conceptual understanding and analogies.

  Key elements from the request:
  1. Use a compression analogy (like minhash, bloom filter) for the wavefunction as a lossy sketch of underlying state. We need to evaluate this analogy and see where it breaks.
  2. Start with a show of hands to categorize intuitions: (a) real thing, (b) information about a thing, (c) neither (like a law/rule). We must clarify if (c) is distinct.
  3. Address common misconceptions: Bell's theorem, QBism (as subjective belief), wave in 3D space, decoherence as the end.
  4. Set boundaries: refuse to explain certain things explicitly.
  5. End with a question that tests understanding of the distinction between epistemic and subjective (without using jargon).

  Plan:

  I. Introduction (5 minutes)
     - Context: Quantum mechanics uses wavefunctions (ψ) to predict probabilities (|ψ|^2). But what is ψ? Is it a real physical thing or just information?
     - Show of hands: 
          (a) The wavefunction is a real physical thing (like a field).
          (b) It's information we have about a system (like a probability distribution).
          (c) Neither — it's more like a rule or law that governs how systems behave.
     - Note: We'll revisit at the end.

  II. The Compression Analogy (10 minutes)
     - Analogy: Think of the wavefunction as a "sketch" of the underlying state, similar to a lossy compression (minhash, bloom filter). 
          - Why? Because we cannot access the full underlying state (due to quantum uncertainty) but we can compute probabilities.
          - Example: Bloom filter — if we have a set of possible states, the wavefunction might be a compressed representation that allows us to compute probabilities of outcomes without knowing the exact state.
     - But note: In quantum mechanics, two different wavefunctions can be consistent with the same underlying state? Actually, in the analogy, two different sketches might represent the same data. However, in quantum mechanics, the wavefunction is often considered the complete description (in some interpretations). 
     - Where the analogy might break:
          - In a lossy compression, there is an underlying exact state. But in quantum mechanics, there might not be an underlying exact state (as per the standard Copenhagen interpretation). 
          - The analogy might suggest a hidden-variable theory (like the underlying state is the hidden variable). However, Bell's theorem puts constraints on hidden variables.

  III. Key Concepts: Psi-Ontic vs. Psi-Epistemic (5 minutes)
     - Introduce the jargon without dwelling:
          - Psi-ontic: The wavefunction is part of the physical reality (it's real).
          - Psi-epistemic: The wavefunction represents our knowledge (epistemic) about the system.
     - Note: The compression analogy is more aligned with psi-epistemic because the wavefunction is a sketch (incomplete representation) of an underlying reality.

  IV. Addressing Misconceptions (15 minutes)
     - Bell's theorem: 
          - It shows that any local hidden variable theory cannot reproduce quantum mechanics. 
          - But note: It does not directly tell us about the wavefunction's reality. However, it constrains the kind of underlying reality we can have. If we have an underlying state (hidden variables), they must be nonlocal. But the wavefunction itself might be nonlocal and real (as in Bohmian mechanics) or we might give up hidden variables (like in Copenhagen).
          - So Bell's theorem doesn't settle the reality of the wavefunction, but it does tell us that if we want an underlying state, it must be nonlocal.

     - QBism (Quantum Bayesianism):
          - It says the wavefunction is about an agent's beliefs (subjective). 
          - Important: Subjective doesn't mean arbitrary — it's updated via Bayes' rule and quantum rules. 
          - But note: This is a form of psi-epistemic, but a very specific one (subjectivist). The compression analogy might be more objective (the sketch is a fact about the system, not about the agent). So we must distinguish between objective and subjective epistemic views.

     - Wave in 3D space:
          - For a single particle, we often visualize ψ as a wave in space. But for multiple particles, ψ lives in a high-dimensional configuration space (not 3D). So it's not a wave in the ordinary sense. This is a common oversimplification.

     - Decoherence:
          - It explains how quantum superpositions become effectively classical through interaction with the environment. 
          - But it doesn't resolve the measurement problem: why do we get one outcome? And it doesn't tell us if the wavefunction is real or not. It's a process that happens regardless of interpretation.

  V. Boundaries (2 minutes)
     - We will not dive into:
          - The math of quantum mechanics beyond |ψ|^2.
          - Specific interpretations in detail (e.g., Many Worlds, Bohmian mechanics) except as examples.
          - The technical details of Bell's theorem or the experiments.

  VI. Conclusion and Revisit the Poll (3 minutes)
     - Now that we've discussed, let's see if anyone changed their mind. Show of hands again? (Optional, time permitting.)
     - Final thought: The wavefunction might be real in some interpretations (psi-ontic) and not in others (psi-epistemic). There's no consensus. 
     - Key distinction: Even if the wavefunction is epistemic (information), it might be objective (like a compressed representation of reality) or subjective (like a belief). The compression analogy is epistemic but objective. QBism is epistemic and subjective.

  Ending Question (to check understanding without jargon):
     - "Suppose we have two scientists who have different wavefunctions for the same electron because they have different information. After they both measure the electron's position and get the same result, they update their wavefunctions and now they agree. Does that mean the wavefunction was only about their knowledge and not a direct physical wave? Or could it still be a physical wave that collapsed? How would you tell the difference?"

  This question gets at the heart of the distinction: if the wavefunction is epistemic (knowledge-based), then it naturally updates with new information. If it's ontic, then the collapse is a physical process. But note: even in ontic views, the wavefunction might update with measurement (like in collapse theories). However, the fact that it can differ based on information and then converge with measurement is more naturally explained by an epistemic view.

  But wait: in the many-worlds interpretation (which is ontic), there is no collapse. The wavefunction is real but doesn't collapse; instead, the scientists split into branches. So the question doesn't distinguish all cases. However, for the purpose of the session, we want to highlight that the wavefunction being updated by information is a feature of epistemic views. In ontic views without collapse (like MWI), the wavefunction doesn't update — it always evolves unitarily. So the updating in that scenario is about the branch the scientist is in.

  Given the time and audience, we might simplify: the ability to have multiple wavefunctions for the same system that are all valid until measurement is more naturally explained by an epistemic view. But note: in ontic views, the wavefunction is unique and objective. So if two scientists have different wavefunctions, at least one is wrong? Not necessarily: in relativistic quantum mechanics, different observers might have different wavefunctions for the same system because of relativity of simultaneity. But that's advanced.

  So for the audience, we can say:

     - In an epistemic view, it's okay for two people to have different wavefunctions because they have different information. In an ontic view, there is one true wavefunction. But note: in ontic views without collapse (like many-worlds), the wavefunction is universal and the same for everyone, but then how do we account for different knowledge? That's the problem of probability in many-worlds.

  Given the complexity, the ending question might be:

     "If the wavefunction is real, then how come it can be different for two people? And after they measure and get the same result, they update and agree. What does that suggest?"

  We expect the answer: it suggests the wavefunction is about knowledge (epistemic). But we must note that in some ontic views (like Bohmian mechanics) the wavefunction is real and universal, so two people shouldn't have different ones. However, if they have incomplete knowledge, they might use a wavefunction that represents their knowledge (which is called the "effective wavefunction" in Bohm). So even in ontic views, we sometimes use epistemic wavefunctions. This is subtle.

  Given the time, we might avoid this and stick to the simpler point: the compression analogy (as an objective but incomplete representation) is a form of psi-epistemic. The main takeaway: the wavefunction might not be a direct physical object but a representation that helps us compute probabilities. And that representation might be lossy (like a sketch) of an underlying reality, but we know from Bell that the underlying reality must be nonlocal if it exists.

  Final Structure:

  1. Intro and poll (5 min)
  2. Compression analogy: how it works and where it breaks (10 min)
  3. Psi-ontic vs. psi-epistemic (5 min)
  4. Addressing misconceptions (15 min) — cover Bell, QBism, 3D wave, decoherence.
  5. Boundaries (2 min)
  6. Conclusion and ending question (3 min)

  The ending question: "If two scientists have different wavefunctions for the same system because they have different information, and then they both measure and get the same result and update to the same wavefunction, does that support the idea that the wavefunction is more like a sketch of reality (epistemic) or a physical wave (ontic)? Why?"

  Answer: It supports epistemic because the wavefunction changed with information, not just physical interaction (though measurement is physical). But note: in collapse theories, the measurement is a physical collapse. So the update is physical. However, the fact that the wavefunction was different because of information suggests that it was encoding information, not just being a physical field. This is the crux.

  So the answer we want is that it supports epistemic. But we must acknowledge that ontic views can also account for this by having the wavefunction as physical but then collapsing to the same state when measured. However, the initial difference due to information is harder to explain in ontic views without an epistemic layer. Therefore, the example is more naturally explained by an epistemic view.

  Thus, the compression analogy is useful for psi-epistemic views, but it breaks when we consider that in quantum mechanics, the wavefunction might be the complete description (in some views) and there might be no underlying state. Also, the nonlocality from Bell complicates any hidden variable theory.

  Overall, the session should leave the audience with:
     - The wavefunction's status is interpretation-dependent.
     - The compression analogy is a way to think about psi-epistemic views, but it's not perfect because of Bell and the possibility that there is no underlying state.
     - The distinction between epistemic (information) and ontic (real) is central, and within epistemic, there is objective vs. subjective.

  And they should be able to articulate why having different wavefunctions for the same system based on information suggests an epistemic view.
answer: |-
  ### Session Plan: "Is the Wavefunction Real?"  
  *Audience: Backend engineers (familiar with vectors, probabilities, no advanced QM). Time: 40 mins. Tools: Whiteboard, no slides.*

  ---

  #### **1. Intro & Instinct Sorting (5 mins)**  
  - **Hook:** "We use wavefunctions (ψ) to predict probabilities (|ψ|²), but what *is* ψ? A physical object? Information? A rule? Philosophers and physicists debate this—let’s map it to engineering concepts."  
  - **Show of hands (3 bins):**  
    - **(a) Real thing:** Like a gravitational field—exists independently.  
    - **(b) Information:** Like a probability distribution—represents knowledge about a hidden state.  
    - **(c) Neither (rule/law):** Like a software API—abstract, governs behavior but isn’t ‘out there’.  
  - **Clarify (c):** It’s a distinct bin! Examples:  
    - (a) = "ψ *is* the electron."  
    - (b) = "ψ describes what we *know* about the electron."  
    - (c) = "ψ is a mathematical rule that *generates* predictions (like F = ma)."  
    *(No collapse into (a)/(b)—e.g., QBism treats ψ as a personal belief tool, not a shared physical object.)*  

  #### **2. Compression Analogy: Wavefunction as a "Sketch" (10 mins)**  
  - **Core analogy:** Wavefunction ≈ **lossy sketch** (e.g., Bloom filter, MinHash).  
    - *Why?* Both compress complex data into a compact proxy for predictions.  
    - **Example:** Bloom filter for set membership (tradeoff: false positives).  
      - Underlying state = full dataset (unknown).  
      - Sketch = compressed representation (lets you compute probabilities, e.g., "is X in set?").  
    - **Quantum link:**  
      - ψ is the "sketch"; |ψ|² gives probabilities (e.g., "electron here?").  
      - Two sketches (ψ₁, ψ₂) can be consistent with the same outcome (like two Bloom filters for the same set).  
  - **Where it breaks:**  
    - **Bell’s theorem:** Sketches imply hidden data (e.g., the full dataset), but Bell kills *local* hidden variables.  
      - Analogy hint: "Bloom filters assume hidden data exists—but QM might not allow that without spooky action!"  
    - **No cloning:** You can’t copy ψ (unlike a Bloom filter).  
    - **Key takeaway:** Analogy suggests ψ is **epistemic** (information about hidden state), but QM has quirks.  

  #### **3. Psi-Ontic vs. Psi-Epistemic (5 mins)**  
  - **Jargon made simple:**  
    - **Psi-ontic:** ψ is real (like a physical field). *Matches (a)*.  
    - **Psi-epistemic:** ψ is information (like the Bloom filter). *Matches (b)/(c)*.  
  - **Whiteboard:**  
    ```  
    Underlying state (?) → [ψ as sketch] → Predictions (|ψ|²)  
    ```  
    - If ψ-ontic: Sketch *is* the state (no hidden layer).  
    - If ψ-epistemic: Sketch *points to* a hidden state (compression).  

  #### **4. Busting Misconceptions (12 mins)**  
  Address these as they arise (or preemptively):  
  - **"Bell’s theorem settled it (nonlocality!)":**  
    - "Bell kills *local hidden variables*, not ψ’s reality. You can have ψ-ontic + nonlocality (e.g., Bohmian mechanics) or ψ-epistemic + global constraints."  
  - **"It’s just personal belief (QBism!)":**  
    - "QBism treats ψ as subjective belief (bin c), but not all epistemic views do! Bloom filter is objective—it’s *correct* for the data, even if lossy."  
  - **"ψ is a wave in 3D space":**  
    - "Only for single particles! For N particles, ψ lives in 3N-D space—not physical. Like a hash function’s internal state, not the output."  
  - **"Decoherence solves it":**  
    - "Decoherence explains *why* we don’t see superpositions, not what ψ *is*. Classical-looking outcomes work with ψ-ontic or ψ-epistemic."  
  - **Missing big one:** **"If ψ isn’t real, why does it evolve deterministically (Schrödinger eq)?"**  
    - "Good point! Epistemic views must explain why ‘knowledge’ follows a rigid law—like a compression algorithm’s rules."  

  #### **5. What We’re Skipping (1 min)**  
  - **Explicitly refuse:**  
    - "No math beyond |ψ|²!"  
    - "Not covering interpretations deeply (e.g., Many-Worlds)."  
    - "Zero discussion of quantum computing qubits."  

  #### **6. Ending Question (7 mins)**  
  - **Check understanding:**  
    > "Two scientists study an electron: Alice has ψ₁, Bob has ψ₂ (different info). They both measure position, get the *same* result, and update to ψ₃.  
    > Does this imply ψ is *epistemic* (about knowledge) or *ontic* (physical)? Why?"  
  - **Desired answer:**  
    - "Epistemic—different ψ’s converged as knowledge updated. Ontic views struggle: how can one electron have two physical states?"  
    - *(If time: Contrast with "ψ as rule" (c)—updating ψ is like refining an algorithm.)*  

  ---

  ### Why This Works  
  - **Compression analogy:** Fits engineers’ mindset. Exposes epistemic intuition but highlights limits (Bell, no cloning).  
  - **Misconceptions:** Targets real nerd-snipes (Bell, QBism, decoherence).  
  - **Ending question:** Tests grasp of epistemic vs. ontic without jargon.  
  - **Flow:** Poll → Concrete analogy → Jargon → Demolition derby → Punchy end.  

  **Pro tip:** Draw the Bloom filter vs. wavefunction comparison on the whiteboard—it’s visceral!
