  [Standing, raising glass with a warm, slightly weary smile]  

  Well. [Pause] They say you should always save the best for last. [Glance at program] Though I notice they’ve put the *first* student… dead last. [Gentle laughter] Miriam, I think this seating chart might be your final, unspoken lesson on informational cascades. After six brilliant voices, perfectly aligned… what’s left for number seven to add? The rational choice, your models might suggest, is cheap imitation. [Slight pause, smile softens] But you taught me to distrust rational choices that silence the private signal. So, forgive me, Professor, if I break protocol. Just this once.

  I won’t repeat the wonderful stories you’ve already heard tonight. The seminar notecards, the strategic menu ordering – proof against the herd! – the chorus of ten… [Waves hand dismissively, fondly] All true, all brilliant, all now definitively part of the public record. Cascaded, if you will. And I certainly won’t stand here and add another layer of pure praise to the pile. Miriam spent thirty-eight years showing us how fragile, how *unbreakable*, those cascades can be. Especially the kind ones. At a moment like this? Dissent – even honest qualification – feels like cruelty. So we all say the lovely, safe thing. And the truth gets buried under the weight of consensus. She’d hate that. Truly. She asked me, just last week, not to turn her into a theorem at her own party. [Look directly at Miriam] Challenge accepted.

  So. My private signal. Spring, 1997. I was finishing my dissertation under Miriam – her very first doctoral student, a fact she reminded me of usually when I’d done something particularly thick-headed. [Affectionate chuckle] A job offer landed in my lap. A prestigious one. Shiny title, impressive institution. Everyone I asked thought I’d be mad not to take it. *Everyone*. Including Miriam. Especially Miriam. She pressed me. Hard. Analyzed it, argued it, presented it like a theorem with only one elegant solution: Take. The. Job. Except… my private signal screamed ‘no’. It felt wrong. Misaligned. I dug my heels in. I refused. [Pause] Miriam thought I was making a terrible mistake. A career-limiting, bafflingly irrational mistake. And you know what? [Pause] She was absolutely right. It *was* a mistake. The job I took instead? It went… spectacularly badly. A masterclass in how *not* to begin an academic career. A year of profound, humbling, unmitigated disaster.

  Now, here’s the thing Miriam wouldn’t do. What she *never* did, in the twenty-five years that followed. She never rewrote history. Not quietly over coffee, not in a glowing recommendation letter, not in that slightly terrifying way she’d arch an eyebrow when recounting departmental folklore. She never once implied she’d secretly agreed with me all along. Never hinted I’d somehow misunderstood her forceful advice. Never allowed the warm haze of retrospect to soften the stark fact: She’d been clear, I’d been stubborn, and she’d been proven correct. Utterly, unequivocally correct. [Pause] She wore that correctness lightly. Without a hint of ‘I told you so.’ Just a steady, matter-of-fact presence as I picked up the pieces.

  [Shift tone, more reflective] That, I think, is the un-cascade-able core of her. The thing the public chorus, however sincere and well-meaning tonight, might miss. It wasn’t just her fierce mind, though heaven knows that was formidable. It was her fierce *integrity* to the evidence – even when the evidence was her own past judgment, proven right. She wouldn’t bend the truth for comfort, not even her own comfort, not even to soften a blow or buff her own legacy. She trusted the messy, inconvenient, often inconveniently *wrong* signal – yours, hers, the data’s – more than she trusted the smooth, safe consensus. Even a consensus singing her praises. She demanded that same ruthless honesty from her students. Especially when it hurt. *Especially* when it meant disagreeing with her.

  [Look around the room, include everyone] So, family, colleagues, Dean… [Nod respectfully] you’ve heard six beautiful, true testaments to Miriam’s brilliance, her warmth, her quirks. And they *are* true. But my private signal, my little sliver of evidence only I can really offer? It’s that her greatest strength, the one that underpinned all the others, was an unshakeable loyalty… to the truth itself. Even when it was awkward. Even when it meant admitting she’d pushed a student towards a cliff. Even when a room full of people are raising glasses and the easiest, kindest thing would be to just smile and add another ‘hear, hear’ to the cascade.

  [Turn fully to Miriam, glass raised higher] Miriam, you taught me that truth isn’t always flattering, and dissent isn’t cruelty – it’s the antidote to cascades. You taught me to value my own signal, even when it’s faint and drowned out by the crowd. Even when it leads me straight off a cliff. [Warm smile] Thank you for being monumentally, magnificently, consistently right… and for having the decency never to rub my nose in it after I landed in the ditch. Thank you for the integrity that made trusting your brilliance, even when it disagreed with me, possible. Thank you for never, ever, letting the love in this room tonight tempt you into rewriting a single, inconvenient fact. That’s the Miriam I know. The real one. The uncascaded one.

  To Professor Miriam Kessel. For thirty-eight years of truth, brilliantly told. And for showing us all that the most powerful voice isn’t always the loudest chorus… sometimes it’s the one that dares to remember the signal clearly, even when it’s quiet. [Pause] Especially then.

  [Raise glass fully] To Miriam.

  **[Delivery Notes:**
  1.   **Pacing on the 1997 story:** Slow down slightly. Let the discomfort of the memory and the weight of her *not* rewriting it land. The pause after "...disaster" is crucial.
  2.   **Tone shift at "That, I think...":** Move from anecdote to revelation. Softer, more reflective, almost intimate. The "uncascade-able core" line is the heart.
  3.   **Final lines ("To Professor Miriam..."):** Build back to warmth and strength. The last sentence should ring clear before the final toast. **]**
