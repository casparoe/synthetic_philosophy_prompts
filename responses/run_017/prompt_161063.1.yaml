  ### Dichotomous Identification Key for Theories of Truth  
  **Instructions to the Student:**  
  Work through the numbered couplets below. At each step, choose the option (a or b) that best reflects your view on what a theory of truth *must* achieve or how it should handle specific cases. Follow the cross-reference (e.g., "go to 4") to proceed. Continue until you reach a named position (leaf), an empty cell (unoccupied combination), or a verdict that no position fits. Base answers solely on your reasoned judgment, avoiding pre-theoretical hunches. Allow 15 minutes.  

  ---

  ### The Key  
  1. **a.** A theory of truth must explain why acting on true beliefs tends to lead to successful outcomes (e.g., achieving goals).  
     **b.** It need not explain such success.  
     → *If a, go to 2. If b, go to 6.*  

  2. **a.** A theory of truth must explain why truth is a norm for belief, assertion, or inquiry (e.g., why we *ought* to believe what is true).  
     **b.** It need not explain this norm.  
     → *If a, go to 3. If b, go to 7.*  

  3. **a.** A theory of truth must make sense of attributing truth to sentences in a language we cannot yet translate (e.g., "That untranslated sentence is true").  
     **b.** It need not make sense of this; truth depends on understanding meaning first.  
     → *If a, go to 4. If b, go to 5.*  

  4. **a.** Truth is always a matter of correspondence to mind-independent facts, even in moral or aesthetic discourse.  
     **b.** Truth may involve more than correspondence in some domains (e.g., moral truths reflect ideal coherence or practical utility).  
     → *If a, go to SUBSTANTIVE CORRESPONDENCE REALISM. If b, go to 8.*  

  5. **a.** A theory must supply truth-conditions that fix what sentences mean (e.g., meaning is derived from when a sentence would be true).  
     **b.** It need not; meaning is fixed independently of truth.  
     → *If a, go to 9. If b, go to PRAGMATISM.*  

  6. **a.** A theory must explain why truth is a norm for belief, assertion, or inquiry.  
     **b.** It need not explain this norm.  
     → *If a, go to 10. If b, go to 11.*  

  7. **a.** A theory must handle blind generalisation over unenumerable sets (e.g., "Everything she said was true" without listing sentences).  
     **b.** It need not handle this.  
     → *If a, go to 12. If b, go to EMPTY CELL 1.*  

  8. **a.** Truth does "more than disquote" in domains like morality or aesthetics (e.g., "Torture is wrong" being true involves more than just endorsing the claim).  
     **b.** Truth only disquotes in all domains (e.g., "Torture is wrong is true" means nothing beyond "Torture is wrong").  
     → *If a, go to ALETHIC PLURALISM. If b, go to DEFLATIONISM (NO-PROPERTY).*  

  9. **a.** Truth-conditions must reflect how beliefs cohere within a system.  
     **b.** Truth-conditions must reflect ideal justifiability (e.g., superassertibility).  
     → *If a, go to COHERENTISM. If b, go to EPISTEMIC VIEW (SUPERASSERTIBILITY).*  

  10. **a.** A theory must handle blind generalisation over unenumerable sets.  
      **b.** It need not.  
      → *If a, go to 13. If b, go to EMPTY CELL 2.*  

  11. **a.** Truth is a thin property with no substantive content.  
      **b.** Truth is not a property at all.  
      → *If a, go to MINIMALISM. If b, go to 14.*  

  12. **a.** Truth is a primitive, unanalysable property.  
      **b.** Truth is a device for expressing endorsement (e.g., "That's true" functions like "I agree").  
      → *If a, go to PRIMITIVISM. If b, go to EXPRESSIVISM ABOUT TRUTH.*  

  13. **a.** In domains like morality, truth does more than disquote.  
      **b.** Truth only disquotes in all domains.  
      → *If a, go to PROSENTENTIALISM. If b, go to ELIMINATIVISM.*  

  14. **a.** We can eliminate truth-talk without loss (e.g., replace "is true" with direct quotation or endorsement).  
      **b.** Truth-talk is ineliminable but needs no substantive theory.  
      → *If a, go to ELIMINATIVISM. If b, go to DEFLATIONISM (NO-PROPERTY).*  

  ---

  ### Empty Cells (Unoccupied Combinations)  
  | Cell          | Diagnosis                                                                 |  
  |---------------|---------------------------------------------------------------------------|  
  | **EMPTY CELL 1** | Incoherent: If truth explains success, it must handle blind generalisation. |  
  | **EMPTY CELL 2** | Incoherent: If truth is a norm for inquiry, it must handle blind generalisation. |  
  | **EMPTY CELL 3** | Unexplored: No existing theory pairs the normative job with eliminativism about truth-properties. |  
  | **EMPTY CELL 4** | Unattractive: Combines a thick property (e.g., correspondence) with the denial of the normative job. |  

  ---

  ### Table of Leaves (Named Positions)  
  | Leaf Name                               | Most Awkward Commitment                                                                 | Jobs Discharged Easily | Jobs Discharged with Strain             | Jobs Not Discharged |  
  |-----------------------------------------|----------------------------------------------------------------------------------------|------------------------|-----------------------------------------|---------------------|  
  | **Substantive Correspondence Realism**  | Moral facts must "correspond" to mind-independent reality.                             | (ii), (iv)             | (i), (iii)                              | —                   |  
  | **Coherentism**                         | Truth is determined by coherence within a system, even if it conflicts with evidence.  | (ii), (iii)            | (i)                                     | (iv)                |  
  | **Pragmatism**                          | Truth is defined by long-term utility, risking relativism about justification.         | (iii), (iv)            | —                                       | (i), (ii)           |  
  | **Epistemic View (Superassertibility)** | Truth is idealised justifiability, making it relative to epistemic conditions.         | (iii)                  | (i)                                     | (ii), (iv)          |  
  | **Minimalism**                          | Truth is a thin property with no underlying nature beyond disquotation.                | (i)                    | —                                       | (ii), (iii), (iv)   |  
  | **Deflationism (No-Property)**          | Truth is not a property; "is true" is a logical device for indirect endorsement.      | (i)                    | (iii)                                   | (ii), (iv)          |  
  | **Prosentencealism**                    | "Is true" functions like a pronoun, inheriting content from context.                  | (i)                    | (iii)                                   | (ii), (iv)          |  
  | **Expressivism about Truth**            | Attributing truth expresses non-cognitive attitudes (e.g., approval).                 | (iii)                  | —                                       | (i), (ii), (iv)     |  
  | **Primitivism**                         | Truth is an unanalysable primitive, halting further explanation.                      | (iii)                  | (i), (ii), (iv)                         | —                   |  
  | **Alethic Pluralism**                   | Truth has different natures across domains (e.g., correspondence in science, coherence in ethics). | (iii), (iv)     | (i), (ii)                               | —                   |  
  | **Eliminativism**                       | Truth-talk is defective and should be replaced (e.g., with semantic ascent).          | —                      | —                                       | (i), (ii), (iii), (iv) |  

  ### Notes on Design  
  - **Trap Avoided:** Deflationism (minimalism, no-property, prosententialism) is separated from eliminativism by its retention of truth as a logical tool. Eliminativism rejects even this.  
  - **Cases Incorporated:** Blind generalisation (couplets 3, 7, 10), untranslated language (3), and moral/aesthetic truth (4, 8, 13) drive differentiation.  
  - **Job-Based Structure:** Positions are sorted first by which jobs they prioritise (e.g., pragmatism emphasises success and normativity; deflationism handles generalisation only).  
  - **Unseparated Pair:** Minimalism and deflationism (no-property) are split by whether truth is *any* property (couplet 11). If a further question were needed: "Can 'true' be analysed without invoking a property?" (Yes: deflationism; No: minimalism).
