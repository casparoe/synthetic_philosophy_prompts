answer: |-
  Below is a decision tree designed to address your request. It starts from the core commitment ("I'm as certain as I am of anything that there is something it is like for me to see red") and uses concrete cases (including your three) to navigate the logical space of positions on phenomenal consciousness. The tree has **8 branch nodes** (including one ternary node) and **10 named leaves**, with one "Unnamed" position. I've built the logical scaffolding first, then assigned positions to the resulting cells, noting incoherent/unattractive/unoccupied combinations.

  ---

  ### **Decision Tree: Mapping Positions on Phenomenal Consciousness**

  **Starting Commitment:**  
  *"I'm as certain as I am of anything that there is something it is like for me to see red."*

  #### **Branch Nodes**  
  *Each node is a concrete case or specific claim. Paths are mutually exclusive.*

  1. **Disagreement Case (Your addition):**  
     *Two philosophers disagree: one insists phenomenality is real, the other calls it an illusion. Is there a fact of the matter about who is correct?*  
     - **Yes → Node 2**  
     - **No → Leaf 1: Quietist/Therapeutic**  

  2. **Retrospective-Insertion Case (Your case C):**  
     *You recall vivid pain from last night, but later learn no pain signals occurred. Did you have phenomenal pain at the time?*  
     - **Yes → Node 3**  
     - **No → Node 4**  

  3. **Fade Case (Your case B):**  
     *A subject’s access to "what it’s like" degrades, but their ability to notice/compare/report states stays perfect. What happens to phenomenality?*  
     - **Diminishes → Node 5**  
     - **Stays the same → Node 6**  
     - **Never a separate quantity → Node 7**  

  4. **Recursion Case (Your requirement):**  
     *When illusionists say phenomenality is an "illusion," does experiencing that illusion involve phenomenal properties?*  
     - **Yes → Node 8**  
     - **No → Node 9**  

  5. **Replay Case (Your case A):**  
     *A creature’s causal-functional organization is run in a frozen simulation (no outputs/downstream effects). Is there phenomenality?*  
     - **Yes → Node 10**  
     - **No → Leaf 7: Epiphenomenalism**  

  6. **Knowledge Argument Case (Standard, adapted):**  
     *Mary knows all physical facts about color vision but has never seen red. When she sees red, does she learn a new fact?*  
     - **Yes → Leaf 6: Russellian Monism**  
     - **No → Leaf 5: Non-Reductive Physicalism**  

  7. **Conceptual Grounding Case (My addition):**  
     *Can our reports about "what it’s like" be fully explained by non-phenomenal cognitive mechanisms?*  
     - **Yes → Node 9**  
     - **No → Leaf 8: Unnamed (Cognitive Realism)**  

  8. **Intrinsic Properties Case (Standard, adapted):**  
     *Could the intrinsic properties of fundamental physics (e.g., mass/charge) be identical to/proto-phenomenal properties?*  
     - **Yes → Leaf 4: Panpsychism**  
     - **No → Leaf 3: Reference-Failure Eliminativism**  

  9. **Causal Exclusion Case (My addition):**  
     *If cognition fully explains behavior, does positing *additional* phenomenality violate causal closure?*  
     - **Yes → Leaf 2: Frankish-Style Illusionism**  
     - **No → Leaf 9: Unnamed (Overdetermination)**  

  ---

  #### **Leaf Positions**  
  *Mapped to logical endpoints of the tree.*

  | Leaf | Position | Path to Leaf (Node Sequence) |
  |------|----------|------------------------------|
  | 1 | **Quietist/Therapeutic** | 1(No) |
  | 2 | **Frankish-Style Illusionism** | 1(Yes)→2(No)→4(No)→9(Yes) |
  | 3 | **Reference-Failure Eliminativism** | 1(Yes)→2(No)→4(Yes)→8(No) |
  | 4 | **Panpsychism** | 1(Yes)→2(Yes)→3(Stays)→6(Yes) or 1(Yes)→2(No)→4(Yes)→8(Yes) |
  | 5 | **Non-Reductive Physicalism** | 1(Yes)→2(Yes)→3(Stays)→6(No) |
  | 6 | **Russellian Monism** | 1(Yes)→2(Yes)→3(Stays)→6(Yes) |
  | 7 | **Epiphenomenalism** | 1(Yes)→2(Yes)→3(Diminishes)→5(No) |
  | 8 | **Unnamed (Cognitive Realism)** | 1(Yes)→2(Yes)→3(Never)→7(No) |
  | 9 | **Unnamed (Overdetermination)** | 1(Yes)→2(No)→4(No)→9(No) |
  | 10| *Empty* (Incoherent) | 1(Yes)→2(Yes)→3(Diminishes)→5(Yes) |

  - **Empty Leaf (10)**: Incoherent. *Why?* If phenomenality diminishes with access (Node 3A) but persists in a frozen replay (Node 5Yes), phenomenality is both access-dependent and intrinsic—contradictory.  
  - **Unnamed Leaves**:  
    - **Leaf 8 (Cognitive Realism)**: Holds that phenomenality is irreducible to cognition but not an illusion. Logically coherent but undefended (similar to early Searle).  
    - **Leaf 9 (Overdetermination)**: Claims phenomenality and cognition *both* cause behavior without redundancy. Coherent but unattractive (violates parsimony).  

  ---

  ### **Diagnostic Power of Your Cases**
  - **Replay (Node 5)**: Separates functionalism (Yes) from epiphenomenalism (No).  
  - **Fade (Node 3)**: Isolates access-based theories (A), intrinsicism (B), and illusionism/quietism (C).  
  - **Retrospective-Insertion (Node 2)**: Distinguishes realists (Yes) from skeptics (No).  
  - **Recursion (Node 4)**: Splits illusionism (No) from realism (Yes).  
  - **My Added Case (Node 7)**: Tests whether "seemings" require phenomenal grounding. Separates illusionism/quietism (Yes) from realism (No).  

  ---

  ### **Failures and Limitations**  
  1. **Illusionism vs. Quietism Ambiguity**:  
     - **Failure**: The tree struggles to cleanly separate illusionism (Leaf 2) from quietism (Leaf 1). Both deny a "fact of the matter" (Node 1), but illusionism affirms cognitive mechanisms (Node 9), while quietism rejects the framework. Node 1’s phrasing ("fact of the matter") already presupposes realism, making quietism an outlier.  
     - **Fix?**: Reframe Node 1 around *practical disagreement* (e.g., "Should we revise cognitive science to eliminate phenomenality?")—but this risks stacking the deck differently.  

  2. **Node Dominance**:  
     - **Secret Workhorse**: Node 2 (Retrospective-Insertion) does 80% of the work. A "Yes" locks you into realism; a "No" forces illusionism/eliminativism. Later nodes (e.g., Fade, Replay) refine sub-positions but rarely override this split. The tree *looks* balanced but collapses to "Is introspection globally unreliable?"  

  3. **Deck-Stacking**:  
     - **Realism Bias**: Cases like Retrospective-Insertion and Fade assume we can meaningfully discuss "phenomenality" as a separable property. This smuggles in realism, as illusionists/quietists reject the framing (e.g., "confabulated pain" is nonsense if "pain" is illusory).  
     - **Illusionist Bias**: The Recursion Case (Node 4) forces illusionists to deny phenomenality entirely, but this presumes "illusion" is literal. If it's metaphorical (e.g., "phenomenality is a useful fiction"), Node 4 becomes a false dilemma.  

  4. **Missing Distinctions**:  
     - Non-reductive physicalism (Leaf 5) and Russellian monism (Leaf 6) blur at Node 6 (Knowledge Argument). Both *can* say Mary learns something new (e.g., Russellians via intrinsic properties; non-reductivists via irreducible subjectivity).  
     - Panpsychism (Leaf 4) and Russellian monism (Leaf 6) are split artificially at Node 6; both could answer identically to all cases.  

  ---

  ### **Handout Recommendations**
  - **Use Cases First**: Present the tree *without* leaf labels initially. Have students map their answers, then reveal positions to spark debate.  
  - **Highlight Failures**: Include the "Failures" section to model intellectual honesty. Emphasize that taxonomy clarifies—but doesn’t resolve—hard problems.  
  - **Pair with Readings**: Assign Frankish (2016) *Illusionism as a Theory of Consciousness* for illusionism; Stoljar (2006) *Ignorance and Imagination* for Russellian monism; and Wittgenstein’s *Philosophical Investigations* for quietism.  

  This tree won’t "shut anyone up"—nor should it—but it forces clarity about *why* disagreements persist. The cases expose fault lines invisible to label-focused debates.
