  But that is more than three sentences. We can condense:

  "Build a model of your target claim using separate cards for each constituent. Rule: binding any two cards requires a linker card bound to both, and this rule applies to every binding. Afterwards, a classmate will read your model without any hints."

  Then hand out materials.

  Now, for the escape materials:

  1. Slotted card: a card with one or more slots cut out (like a frame). They can insert other cards into the slots. For a one-place predicate: one slot for the subject. For a two-place: two slots. We can provide a few with different numbers of slots? Or let them make their own? But we are handing them pre-made. We can have for group 4 (the apple is red) a card with one slot. For group 1 and 2, a card with two slots. For group 3, a symmetric relation might be represented by a card with two slots? But the slots don't enforce order? So they can put Alice and Bob in either slot? Then the claim is symmetric? That works.

  2. Velcro backing: small pieces of velcro (both hook and loop) that they can stick to the back of cards. Then two cards can stick together. But we must provide the velcro pieces and let them attach to the cards? Or we provide cards with velcro already attached? The latter is easier. So we have some cards with velcro on the back.

  3. Fan-shaped card: a card with a central part (like the base of the fan) and then several strips (the fan blades) that can hold cards. Or we can have a central card with several slots or clips. Or a card with multiple strings attached? But we want to represent an assertor that holds each constituent. So we can have a card labeled "ASSERTS" or "JUDGES" and then several strings with clips at the end to attach to each constituent card.

  When a group is stuck, the instructor can say: "I have a special material that might help. You can use this in addition to your existing materials." And hand one of the three. We can assign different escapes to different groups to see different solutions.

  Finally, the debrief mapping:

  - The regress: they had to keep adding linkers because each binder must be bound. This corresponds to the philosophical regress: if unity requires a relation of binding, then that relation must be bound to the relata, and so on.
  - The slotted card: it avoids the linker by having an incomplete entity that is completed by the slot. But what if we have a complex structure? And what about the binding between the relation and the second argument? For a two-place relation, we have one card with two slots. Then we don't need any linker? So it avoids the regress. The cost: the relation card is incomplete without its arguments. Also, we cannot easily recombine: the relation card is designed for two slots. If we want a different relation, we need a new card.
  - Velcro: it avoids linkers by making the entities stick together. But then the structure is lost: if we stick the relation to the subject and then stick the object to the relation, we have a chain. But then the relation is only directly stuck to the subject? How is the object bound to the relation? We might have to stick the object to the relation. But then we have a blob. The cost: the constituents lose their independence. Also, it is hard to represent order: if we stick the relation to the subject and object, but the relation is symmetric, it might work for group 3. But for group 1, we want order: cat chases dog. How to represent that? Maybe by the order of sticking? But the velcro is symmetric. So we might not capture order. The cost: loss of order and loss of recompositionality.
  - Fan-shaped card: it has a central card (the assertor) and then clips for each constituent. The assertor holds all the constituents together. But there is no linker between the constituents. The cost: there is no unified proposition; the proposition exists only in the act of assertion. Also, it might allow for arbitrary collections: we can put any cards together and call it a proposition.

  Then, the big picture: the regress arises from the principle that unity requires a binder. Each escape route denies a part of that principle. The debate is about which denial is least costly.

