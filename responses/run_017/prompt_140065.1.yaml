prompt: |-
  I'm putting together the reading for a graduate seminar on Everettian quantum mechanics, and I keep losing the thread in the probability literature for what feels like a methodological reason: the parties to the dispute seem to be trying to do different jobs. One camp wants an argument that a rational agent who believes in the branching structure should bet at Born-rule odds; another wants something closer to an objective single-case chance attached to branches; another seems content to show that nearly all the measure of the post-measurement multiverse exhibits Born-rule frequencies. Before I assign any of the actual derivations, I want the specification each of them is implicitly answering. So fix the purpose as follows: an account of probability in the Everett picture is adequate if it is good enough to underwrite the ordinary statistical practice of a working physicist who already accepts branching and who has a finite run of data on her desk next Monday — it has to make it rational for her to go on using textbook error bars and significance tests, and it has to let her say why doing so isn't a form of self-deception. Write the desiderata list for that purpose: every requirement a proposed account must meet, each paired with the concrete case or consideration that motivates it, and each flagged as non-negotiable or as the preference of a particular camp.

  To start you off, here is my own messy candidate list, which I'd rather you prune, split, and argue with than ratify. (1) Non-circularity: the derivation must not smuggle in probabilistic or decision-theoretic premises that already contain the answer — but tell me how strict that can really be, since any account that ends in a claim about what to care about, or how much to weight future branches, seems to need a normative input, and I suspect a purely descriptive, fully non-circular derivation cannot yield anyone a reason to care. (2) The one-shot irrational case: she measures, once, on a single system, a spin prepared at an angle chosen so that the predicted weight is 1/π. There is no finite stock of equal-weight sub-branches to count, so any approach that works by splitting outcomes into equal-weight pieces has nothing to work with and must still return the right number; note also that the equal-amplitude case, where branch count and weight coincide, is degenerate and should not be allowed to count as evidence for anything. (3) Granularity-robustness: decoherence picks out branches only approximately, and the number of branches depends on how coarsely one describes the apparatus and environment, so the probability of "up" had better not shift because the pointer is described to the nearest millimeter rather than the nearest micron. (4) Conditionalization on self-location: suppose the experimenter on the low-weight branch is the only one who goes on to run a second experiment, so the number of future branches is correlated with the weight of the branch you are on. The account must supply an updating rule for "I am now on this branch" and say how it relates to the Born weights — and I want your view on whether demanding a genuinely branch-relative updating rule is a real desideratum or just the prejudice of people who want objective chance. (5) Continuous outcomes: a measurement of a continuous quantity leaves a continuum of branches, each of zero weight individually, though outcomes plainly occur; the account must distinguish "does not happen" from "happens with probability zero," and must recover the Born density rather than a set of branch probabilities. (6) Finitude: it must give her a reason to expect her actual finite sample, not merely an asymptotic or measure-one result about the whole multiverse — and I want to know whether the typicality step this seems to need is legitimate or a bolt-on. Add the requirements I haven't thought of, especially any that constrain what must be said about interference (why probabilities attach only after decoherence, and not to coherent superpositions), about non-ideal measurements and generalized measurements rather than clean projective ones, and about what happens when nothing remotely like a measurement is going on at all.

  Then the part I care most about: I suspect some subset of the requirements on your final list is jointly unsatisfiable, and I want you to say which. My own guess is that exactness-for-a-finite-run — she gets the Born numbers exactly, for the forty-odd data points she actually has — is in tension with granularity-robustness, since real branch decompositions are approximate and exact weights are recovered only in some limit, so that any account satisfying one must fudge the other. But make the case for whichever pair you actually think is in tension, and say whether the upshot is that the list cannot be satisfied in full, or only that one requirement has to be weakened and how. Then tell me which single requirement does the most work in excluding candidates — which one most of the existing approaches quietly fail. Finally, and briefly, since this isn't the point of the exercise: score three or four broad families against the list — the Deutsch-style decision-theoretic derivation, the symmetry or envariance-style arguments, the branch-counting and relative-frequency approaches, and the self-locating-uncertainty approach that adds a separability principle. Skip names, attributions, and references; I know the shape of the literature, and I want your reasons rather than a bibliography.
reasoning: |-
  Okay, the user is putting together a graduate seminar on Everettian quantum mechanics and is struggling with the probability literature. They feel that different camps are addressing different problems: some focus on rational betting, others on objective chance, and others on measure-based frequencies. Their main request is to define a set of desiderata for an account of probability that justifies the statistical practices of a physicist who accepts branching and has finite data. They also want to know if these requirements are jointly satisfiable and which one is the hardest to meet.

  First, I need to parse their initial list and refine it. They have six points: non-circularity, one-shot irrational case, granularity-robustness, conditionalization on self-location, continuous outcomes, and finitude. Each needs to be clarified and categorized as non-negotiable or camp-specific. 

  Non-circularity is tricky because normative inputs might be unavoidable. The user suspects purely descriptive derivations can't provide reasons to care. So, strict non-circularity might be too strong; instead, allowing minimal normative axioms but rejecting those that sneak in the Born rule. This is non-negotiable but with a caveat.

  The one-shot irrational case tests if the account works without equal branch counts. This is non-negotiable because real experiments aren't always degenerate. Granularity-robustness is crucial since decoherence is approximate. Branch probabilities shouldn't change with coarser descriptions. Also non-negotiable.

  Conditionalization on self-location involves updating probabilities after branching. The user questions if this is necessary or just a preference for objective chance. I think it's non-negotiable because physicists need to update beliefs with new data. Continuous outcomes require handling zero-probability events and densities, not discrete probabilities. Non-negotiable for completeness.

  Finitude demands justification for finite samples, not just asymptotic results. The user is concerned about the legitimacy of typicality arguments. This is non-negotiable but might conflict with granularity-robustness. 

  Missing requirements: Interference explanation (why probabilities attach post-decoherence), handling non-ideal measurements (POVMs), and non-measurement scenarios. These are essential for real-world applications and should be non-negotiable. Also, operational adequacy ensures the account integrates with standard statistical tools like p-values and error bars.

  Now, tensions: Finitude and granularity-robustness clash. Finite data requires exact probabilities, but granularity means branch weights are approximate. Exactness in finite cases might rely on idealizations that granularity forbids. This tension might force weakening finitude to accept approximate probabilities.

  The hardest requirement is likely granularity-robustness because many approaches (branch-counting, decision-theoretic) assume precise branch structures, which isn't realistic. It exposes idealizations in other accounts.

  Evaluating families:
  - Decision-theoretic (Deutsch): Uses rationality axioms to derive Born rule. Struggles with granularity (assumes exact branches) and continuous outcomes. Normative input might not satisfy strict non-circularity.
  - Envariance/symmetry: Derives Born rule from quantum symmetries. Handles one-shot and continuous cases but fails granularity-robustness (needs exact decomposition) and finitude (asymptotic). Doesn't address conditionalization.
  - Branch-counting: Equates probability with branch proportion. Fails one-shot (irrational weights), granularity (branch count varies), continuous outcomes (infinite branches), and non-ideal measurements.
  - Self-locating uncertainty: Probability as uncertainty about which branch one is in. Needs separability to avoid post-measurement correlation issues. Struggles with granularity (branch individuation) and finitude (justifies typicality?).

  None satisfy all requirements. Granularity-robustness and finitude are major hurdles. The user might need to accept approximate probabilities for finite cases, linking to operational adequacy. Also, conditionalization and interference explanations are critical for practical stats.
answer: |-
  Here’s a refined desiderata list for your purpose, structured to clarify the "job" each requirement addresses, with motivations, negotiability flags, and missing elements added. The core aim is **operational adequacy for a working physicist’s statistical practice** under Everettian assumptions.

  ### **Desiderata List**  
  *(Non-negotiable = NN; Camp-specific = CS)*  

  1. **Operational Adequacy (NN)**  
     - *Motivation*: Must justify standard tools (error bars, p-values) for *finite data*. Physicist needs to calculate confidence intervals for 40 data points as if probabilities were frequentist long-run frequencies.  
     - *Why NN*: Without this, the account fails its core purpose.  

  2. **Non-Circularity (NN, but relaxed)**  
     - *Requirement*: No probabilistic assumptions *equivalent to the Born rule*. Normative axioms (e.g., "prefer more branches") are acceptable if weak/general.  
     - *Motivation*: Physicist shouldn’t presuppose what’s being derived.  
     - *Relaxation*: Allow minimal decision-theoretic axioms (e.g., consistency), but reject those implying Born weights (e.g., "weight branches proportionally").  

  3. **One-Shot Irrational Case (NN)**  
     - *Requirement*: Assigns Born probability (e.g., 1/π) to a *single measurement* with irrational weights, where no branch-counting is possible.  
     - *Motivation*: Rules out approaches requiring discrete/finite branches. Degenerate cases (equal amplitudes) are insufficient evidence.  

  4. **Granularity-Robustness (NN)**  
     - *Requirement*: Born probabilities must be invariant under coarse-graining (e.g., describing pointer to mm vs. μm).  
     - *Motivation*: Decoherence is approximate; branches aren’t precisely defined. Probability must depend only on the quantum state.  

  5. **Conditionalization on Self-Location (NN)**  
     - *Requirement*: Provide an updating rule for post-branching beliefs (e.g., after observing "spin up," update Born weights for future experiments).  
     - *Motivation*: Physicist must learn from data. Correlated branches (e.g., low-weight branch runs next experiment) shouldn’t disrupt standard Bayesian updating.  
     - *Why NN (not CS)*: Without this, error bars for sequential experiments are unjustified.  

  6. **Continuous Outcomes (NN)**  
     - *Requirement*: Handle measurements with continuous spectra (e.g., position); recover Born *density* over outcomes. Distinguish P=0 (impossible) from measure-zero (possible but probability density defined).  
     - *Motivation*: Real measurements are often continuous; textbook stats assume densities.  

  7. **Finitude (NN)**  
     - *Requirement*: Justifies expectations for *actual finite data*, not just measure-one results in the multiverse limit.  
     - *Motivation*: Physicist sees only 40 data points; asymptotic "typicality" isn’t enough.  
     - *Typicality Legitimacy*: Acceptable *only if* tied to a decision-theoretic or epistemic norm (e.g., "you should expect your experience to be typical").  

  8. **Interference Robustness (NN)**  
     - *New Requirement*: Explain why probabilities attach *only after decoherence*, not to coherent superpositions.  
     - *Motivation*: Physicist uses probabilities only for measurement outcomes; must clarify when "branching" is complete.  

  9. **Generalized Measurement Handling (NN)**  
     - *New Requirement*: Work for POVMs (non-projective measurements) and noisy/imperfect devices.  
     - *Motivation*: Real labs use non-ideal measurements; error bars must still apply.  

  10. **Non-Measurement Contexts (CS: Objective Chance Camp)**  
      - *New Requirement*: Explain probabilities for events without "measurement" (e.g., quantum fluctuations in cosmology).  
      - *Motivation*: Optional for your purpose (physicist with data), but some camps demand objective chances everywhere.  

  ---

  ### **Tensions and Joint Unsatisfiability**  
  **Core Tension: Finitude vs. Granularity-Robustness**  
  - **Conflict**:  
    - *Finitude* demands exact probabilities for finite N (e.g., 40 data points).  
    - *Granularity-Robustness* implies probabilities are approximate (branches aren’t sharp). Decoherence only yields well-defined branches in a limit (e.g., as \( t \to \infty \)).  
  - **Why Unsatisfiable?**  
    Exact finite probabilities require precise branch identities. But granularity-robustness denies these exist—Born weights are emergent from the quantum state, not countable branches. An account satisfying finitude must idealize branches as exact (violating granularity). An account satisfying granularity can only give approximate probabilities for finite N.  
  - **Upshot**: Weaken *Finitude* → **Accept approximate probabilities for finite data, justified by typicality in the limit**. This matches operational practice (error bars *are* approximate).  

  **Hardest Requirement: Granularity-Robustness**  
  - **Why**: Most approaches secretly assume precise branch structure:  
    - Branch-counting requires discrete branches.  
    - Decision-theory derivations assume identifiable "future selves."  
    - Self-locating uncertainty needs individuated branches.  
    Granularity exposes this idealization, forcing accounts to grapple with decoherence’s approximate nature.  

  ---

  ### **Evaluation of Major Approaches**  
  *(Against NN Desiderata Only)*  

  1. **Decision-Theoretic (Deutsch-style)**  
     - **Strengths**: Solves one-shot case via rationality axioms; justifies finitude via optimal betting.  
     - **Failures**:  
       - *Granularity*: Assumes branches are precisely defined (betting with "future selves").  
       - *Continuous outcomes*: Often assumes discrete spectra.  
       - *Non-circularity*: Normative axioms (e.g., "ignore branch identity") may smuggle in Born rule.  

  2. **Envariance/Symmetry**  
     - **Strengths**: Non-circular (derives Born rule from quantum symmetries); handles one-shot and continuous cases.  
     - **Failures**:  
       - *Granularity*: Requires exact unitary decomposition (violated in real decoherence).  
       - *Finitude*: Only shows typicality in multiverse limit.  
       - *Conditionalization*: Silent on updating after branching.  

  3. **Branch-Counting/Relative Frequency**  
     - **Strengths**: Intuitive for finite discrete cases.  
     - **Failures**:  
       - *One-shot irrational*: Fails for unequal amplitudes.  
       - *Granularity*: Branch count depends on coarse-graining.  
       - *Continuous outcomes*: Measure-zero branches undefined.  
       - *Non-circularity*: Equates "probability" with "branch proportion" by fiat.  

  4. **Self-Locating Uncertainty (with Separability)**  
     - **Strengths**: Solves conditionalization; justifies Born weights as credences.  
     - **Failures**:  
       - *Granularity*: Branch individuation is vague; separability principle may fail under coarse-graining.  
       - *Interference*: Doesn’t explain why uncertainty begins only after decoherence.  
       - *Finitude*: Typicality justification feels "bolted on."  

  ---

  ### **Conclusion**  
  No approach satisfies all NN desiderata. **Granularity-robustness** is the key bottleneck, as it forces confrontation with decoherence’s approximate nature. **Decision-theoretic** and **envariance** approaches come closest but stumble on granularity and finitude. For your seminar, emphasize that reconciling *finite-data practice* with *emergent branching* requires accepting approximate probabilities (weakened finitude), justified by typicality in the decoherence limit. This operational stance aligns with how physicists use Born probabilities—as empirically validated weights, not counts of concrete worlds.
