  ## Memorandum

  **ARITHMETICA CAPITAL MANAGEMENT LP**  
  **Annual Letter to Limited Partners**  
  **31 December 2023**

  **To Our Valued Limited Partners,**

  Arithmetica Capital Management LP (“ACM” or the “Fund”) presents its annual summary for the year ended 31 December 2023. Amidst continued market volatility and shifting macroeconomic currents, the Fund remains constructively positioned on its core, long-term thesis. We appreciate your sustained partnership and commitment to the disciplined pursuit of intrinsic value, distinct from transient mark-to-market fluctuations.

  **Performance & Positioning**
  The Fund concluded the year with a net asset value (NAV) per share of $1,042.75, representing a mark-to-market decline of 1.8% for the period. While this short-term metric reflects prevailing sentiment, we reiterate our focus on the *intrinsic value* of the underlying position, which we continue to assess as fundamentally robust. The core structural asymmetry – the geometric progression of a key quantity encountering an ultimately arithmetic boundary – remains intact, despite ongoing adaptations within the global system. Our conviction in the eventual convergence of intrinsic value and realized price is undiminished.

  **The Deferral Ledger & Thesis Evolution**
  Consistent with the Fund’s partnership agreement and commitment to rigorous self-assessment, the Deferral Ledger was updated during the year. This ledger, as you are aware, formally records adjustments to the anticipated timing of the positive check’s materialization, specifying the assumptions necessitating the deferral, their estimated shelf life (the period of expected delay), and their residual (the proportion of the core mechanism preserved).

  We disclose below the five entries comprising the current Deferral Ledger:

  | Year of Entry | Predicted Arrival Year (at Entry) | Assumption Entered                     | Shelf Life (Years) | Residual (%) |
  | :------------ | :-------------------------------- | :------------------------------------- | :----------------- | :----------- |
  | 1970          | 1985                              | Food Yield Plateau (Traditional Agri.) | 15                 | 85%          |
  | 1985          | 2005                              | Energy Cost Threshold Delay            | 20                 | 75%          |
  | 2000          | 2020                              | Efficiency Gains Exhaustion            | 20                 | 70%          |
  | 2010          | 2035                              | Waste Sink Capacity Constraint         | 25                 | 65%          |
  | 2020          | 2050                              | Critical Mineral Supply Inflexibility  | 30                 | 60%         |

  As the table illustrates, the expression of the ultimate constraint has evolved – from direct caloric scarcity (famine), to energy affordability, to environmental assimilative capacity (waste sinks), and now to critical input bottlenecks. Critically, we emphasize that this represents not an abandonment, but a *re-expression* of the foundational geometric/arithmetic dynamic. The underlying mathematical tension persists.

  It is noted that the average shelf life of the two most recent entries (2020, 2010) is 27.5 years, compared to an average of 18.3 years for the first three entries (1970, 1985, 2000). While each deferral assumption is, by necessity, forward-looking and subject to revision, this trend towards shorter anticipated deferral periods warrants monitoring. Each entry, reviewed independently, reflects a reasonable interpretation of contemporaneous data and system feedback.

  **The Endowment Drawdown Thesis**
  ACM’s core intellectual contribution remains the robust analytical framework interpreting the 20th century's apparent abundance. We maintain that this period is most accurately understood not as a refutation of the core thesis, but as an *instance of its operation*. The unprecedented gains in carrying capacity were fundamentally enabled by the rapid, non-replicable drawdown of finite geological endowments: readily accessible fossil hydrocarbons, high-grade phosphate deposits, and ancient fossil groundwater aquifers. This one-time endowment allowed a temporary decoupling of population growth from its immediate resource constraints. The depletion of these stocks is an observable phenomenon, reinforcing the structural logic underpinning our position. The intrinsic value case hinges significantly on the recognition that this drawdown phase constitutes evidence *for* the mechanism’s validity, not against it. The transition from stock depletion to flow constraint remains the critical inflection point.

  **Fee Structure & Deferral Liability**
  The Fund’s fee structure, designed to align with long-term intrinsic value realization, incorporates a premium for early recognition. This premium compounds annually. Based on the current Deferral Ledger assumptions and their residual preservation of the core mechanism, the projected growth rate of the cumulative deferral liability now approximates the Fund’s projected long-run global population growth rate. While structurally sound within the terms of the partnership agreement, this correlation necessitates careful ongoing stewardship. We remain confident that the eventual convergence will validate the structure. [^1]

  [^1]: The Fund’s independent auditor, Veritas & Stone LLP, notes in their limited review: "The assumptions underlying the Deferral Ledger entries, considered individually and based on information available at the time of entry, fall within a reasonable range of professional judgment concerning future resource constraints. The aggregation and interaction of these deferrals, and their impact on the deferral liability calculation, represent a unique feature of the Fund’s structure."

  **Strategic Development: Merger Announcement**
  To enhance strategic resilience and optimize resource allocation, ACM is pleased to announce its merger with Promethean Growth Partners LLC (“PGP”), effective 1 January 2024. PGP’s core thesis posits that population pressure itself acts as the primary catalyst for the innovation necessary to perpetually alleviate that pressure, thereby indefinitely postponing any binding Malthusian check.

  This combination is a prudent exercise in risk management. The merged entity, Arithmetica-Promethean Capital (“APC”), will maintain distinct, complementary portfolios reflecting each original thesis. This structure allows APC to capture intrinsic value realization irrespective of the *timing* of the positive check’s materialization – whether it arrives as originally envisioned or is perpetually deferred through induced innovation. The diversification benefits are significant, reducing the Fund’s sensitivity to the specific timing of the core thesis’s culmination while preserving full exposure to its potential realization. PGP’s expertise in identifying and financing adaptive innovation provides valuable balance to ACM’s deep understanding of fundamental resource constraints.

  **Outlook**
  We enter 2024 as part of Arithmetica-Promethean Capital with reinforced conviction in the robustness of our combined analytical frameworks. The underlying structural tension captured by the geometric/arithmetic dynamic continues to manifest in evolving forms – from localized resource stresses to emerging critical mineral dependencies and measurable environmental feedback loops. While the precise timing of the positive check’s dominance remains subject to system adaptations duly recorded in the Deferral Ledger, the directionality of the intrinsic value trajectory remains unequivocal. We thank you for your continued trust and patience as we steward the Fund through this next phase within the strengthened APC platform.

  Respectfully,

  **Sebastian Thorne**  
  Managing Partner & Chief Investment Officer  
  Arithmetica Capital Management LP  
  (A Division of Arithmetica-Promethean Capital)

  ---

  ## Commentary

  This satirical piece exaggerates specific features common to long-run predictive theses like structural Malthusianism, particularly the practice of defending the core logic by adjusting auxiliary assumptions and re-specifying mechanisms:

  1.  **The Deferral Ledger:** Satirizes the practice of repeatedly pushing back the predicted date of the "crisis" (famine, collapse) by invoking new, plausible-sounding reasons for delay (e.g., "this time it's different because of efficiency gains/waste sinks/minerals"). The shortening "shelf life" mocks the increasing frequency and perceived fragility of these deferrals. The "Residual" column critiques the claim that the *core* logic (geometric vs. arithmetic growth) remains unchanged despite significant shifts in the predicted *manifestation*.
  2.  **Re-specification of the Constraint:** Mocks the historical evolution of Malthusian concerns: from food (Malthus) to energy (1970s limits to growth) to pollution/waste sinks/climate (later 20th/C21st) to critical minerals (present). The letter's insistence that the "underlying inequality" remains constant satirizes the claim that changing the predicted mechanism doesn't fundamentally alter the thesis.
  3.  **The Endowment Drawdown Argument:** Exaggerates a genuinely strong counter-argument to claims that the 20th century refuted Malthus: that fossil fuels and other finite stocks provided a one-time bonanza enabling temporary escape. The satire highlights how this move ingeniously turns apparent counter-evidence (abundance) into evidence *for* the thesis (by framing it as unsustainable depletion), creating a potential "heads I win, tails you lose" dynamic.
  4.  **Fee Structure & Deferral Liability:** Critiques how theoretical frameworks can become self-sustaining enterprises. The "premium for being right early" that compounds satirizes the intellectual investment and potential career capital tied to a thesis. The liability growing at the population growth rate is a darkly comic exaggeration, suggesting the *defense* of the theory now mimics the very dynamic it predicts. The auditor's footnote mocks how individual defenses ("assumptions") can seem reasonable in isolation, masking the cumulative implausibility.
  5.  **The Merger:** Parodies "paradigm absorption." Merging with an innovation-optimist fund (embodying the rival "Boserupian" thesis) and claiming "prudent risk management" satirizes how a theory can become unfalsifiable by incorporating its apparent negation. The claim the combined book profits "whether the check arrives or is indefinitely postponed" highlights the resulting vacuity – the thesis no longer makes a concrete, testable claim about the world.

  **Where Sympathetic Philosophers Might Object:**
  A sympathetic philosopher of science would likely argue the satire is unfair in portraying the "right but early" stance as *completely* unfalsifiable. They would contend that structural Malthusianism *does* retain core conditions that could, in principle, go unsatisfied, rendering it false:
  *   **Indefinite Decoupling:** If technological innovation and substitution (e.g., limitless clean energy, advanced recycling, synthetic food) demonstrably and *permanently* decouple human welfare/population size from *all* finite material flows and planetary boundaries at a rate exceeding population/consumption growth, the core geometric/arithmetic dynamic would be broken. The thesis relies on *some* fundamental, non-substitutable constraint(s) ultimately binding.
  *   **Collapse Threshold Avoidance:** If human societies consistently demonstrate the ability to *anticipate and adapt* to constraints *before* triggering irreversible collapse or significant dieback ("the positive check"), the predicted catastrophic outcome fails to materialize, even if growth slows or stabilizes under pressure.
  *   **The Nature of the "Arithmetic" Ceiling:** The satire blurs the distinction between a truly fixed ceiling (like planetary space) and ceilings that might be expandable through technology (e.g., energy capture via fusion). A philosopher might argue that only predictions tied to genuinely fixed ceilings (like the speed of light for physics) have the rigidity the satire implies for *all* Malthusian constraints.

  The satire exaggerates by implying the thesis can dodge *any* conceivable future state. A philosopher would insist that a future of genuinely limitless abundance sustained indefinitely without invoking magic would indeed falsify the structural core, even if past deferrals were reasonable adaptations. The challenge, they'd argue, lies in defining "limitless abundance" and "indefinitely" in a non-question-begging way against the backdrop of a finite planet and entropy.
