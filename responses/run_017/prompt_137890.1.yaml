prompt: |-
  Hi — I'm in the second term of a formal epistemology / rational choice course (phil with some econ mixed in) and a couple of weeks back we did the Dutch book theorem: the one where, if your credences don't line up with the probability axioms, there's some collection of bets, each of which you'd count as fair or better on your own lights, which together guarantee you a loss no matter how things turn out. Our lecturer more or less presented this as settling the question of whether rational credences have to be probabilities, and I walked out feeling like something had been slipped past me without being able to say what. Me and a friend have been argueing about it on and off since, and we've ended up stuck in a funny place: she says the argument only bites if you're the sort of person who'll take literally any bet at your own fair price, in any combination, without limit, and that once you stop being that person the theorem tells you nothing whatsoever about what you ought to believe. Her credence that the argument gives you a genuine, can't-reasonably-shrug-it-off reason to fix incoherent credences is around 0.15. Mine is around 0.55, which I suspect is mostly gut feeling rather than anything I can defend.

  Here's the version I want your number on, and I want to make it as hostile as I can for the argument. Call the agent Dev: her credences really do violate additivity, and there is a Dutch book against her in the standard sense. But now add a cap, which we definitely didn't cover in the lecture. The bets arrive one at a time, offered by different people who've never met and don't coordinate; each stake is £5 or under, so there's no funny business about marginal utility of money; and Dev has a standing policy that she'll accept at most four such bets in her entire life, and that she'll turn down any set of bets presented to her at once as a package. The last bit isn't weakness of will or acrasia — she thinks evaluating bets one at a time and declining to evaluate portfolios is a perfectly coherent policy she's entitled to adopt. The individual bets she gets offered happen to be exactly the ones from the book, she just never sees them together. So worst case she's down twenty quid, spread across decades, and never notices. What's your credence that Dev still has a decisive reason to bring her credences into line, where by decisive I mean that even if she fully understood the argument and her own credences, it would still be irrational for her to leave them as they are?

  I don't just want the number, I want the decomposition. Off the top of my head the sub-questions look something like: whether coherence among credences is a real rational requirement that holds independently of any facts about how the agent behaves when offered bets; whether the package principle (if each bet is acceptable on its own then the lot is acceptable together) is itself something rationality demands, or whether Dev's one-at-a-time rule is a coherent thing to adopt; whether the small-stakes manoeuvre really does neutralise risk aversion and non-linear utility, so that the pragmatic premise can be met by an actual person; whether what's actually doing the work is that Dutch-bookability is a symptom of incoherence rather than the loss itself; and whether the honest description of Dev's state is imprecise credences — a set of probability functions rather than one — which isn't a probability function, doesn't get Dutch booked under a unanimity rule, and might be a legitimate way out. Give each of those (and any you think I've missed or got wrong) a rough probability with a line of justification, combine them, and tell me which single term your final number is most sensitive to, and whether the number moves much if we lift the cap and let the bookie scale things up. Also, given that I'm at 0.55 and she's at 0.15, where do you reckon the disagreement between us actually lives?

  And please be straight with me about how confident you are. If the scenario as I've set it up is confused, or the cap is doing something I haven't spotted, or the number you give is really just a tidy-looking frame around a mushy judgement, say that plainly instead of producing a neat decomposition anyway — my friend thinks the cap is irrelevant and the whole thing turns on the package principle, and I genuinely can't tell. Don't pad it out with suggested reading either; I've got the reading list and I can't follow up references, so I'd rather have your own reasoning.
