     But note: the statute says "cannot be sufficiently restrained by any means short of the criminal law". The word "sufficiently" might allow the Commission to weigh the costs and benefits of criminal law versus other measures. The negative effects of criminal law (like selective enforcement) might mean that it is not "sufficient" in the broader sense.

     Therefore, the procedure as we have it does allow for the consideration of the harms of criminal law in step 3.

