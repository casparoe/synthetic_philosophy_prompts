answer: |-
  Below is a procedure for the Commission on the Common Life, designed to be practical, statute-rooted, and executable by non-philosophers. It incorporates your statute's language, the convention of least coercion, and clear off-ramps for decisions. I'll then apply it to your three petitions, flag splits between Hartian and Devlinian temperaments, and address your draft chapter. The procedure avoids academic jargon, relying solely on the Commission's idiom.

  ---

  ### **The Commission's Procedure for Evaluating Petitions**  
  *(As adopted per governing statute and standing convention)*  

  1. **Question 1: Is the practice repugnant to the common morality of the county?**  
     - *What counts as sufficient?* Evidence of widespread moral condemnation (e.g., public testimony, institutional positions, media, surveys). Not mere offense—active repugnance as a shared value.  
     - *Research officer's role:* Gather factual evidence (e.g., survey data, historical precedents, cultural artifacts). Cannot judge morality—only present data.  
     - *Stop if "no":* Petition dismissed. No further action.  
     - *Vote if needed:* When evidence conflicts or moral interpretation is disputed (e.g., "Is this *repugnance* or just dislike?").  

  2. **Question 2: Does the practice loosen the fabric of the common life?**  
     - *What counts as sufficient?* Evidence that the practice erodes trust, cohesion, or shared norms (e.g., social fragmentation, loss of institutional credibility, public discord). Not hypothetical harm—tangible weakening.  
     - *Research officer's role:* Analyze causal links (e.g., crime rates, community division, expert testimony). Cannot assert societal impact—only provide data.  
     - *Stop if "no":* Petition dismissed.  
     - *Vote if needed:* When causality is unclear or societal "fabric" is contested (e.g., "Is this erosion or mere change?").  

  3. **Question 3: Can the practice be sufficiently restrained by means short of criminal law?**  
     - *What counts as sufficient?* Proof that a lesser measure (censure, licensing, etc.) would meaningfully curb harm without criminalization.  
     - *Research officer's role:* Assess feasibility of alternatives (e.g., efficacy of censure in similar cases, regulatory models).  
     - *Stop if "yes":* Recommend least coercive option. No criminalization.  
     - *Vote if needed:* When effectiveness of alternatives is disputed (e.g., "Would censure suffice or be ignored?").  

  4. **Question 4: If all prior steps are "yes," recommend criminal prohibition.**  
     - *Vote always required:* Final determination of necessity.  

  **Key Principles:**  
  - **Burden of proof:** Petitioners must substantiate repugnance and loosening; Commission must justify criminalization if alternatives exist.  
  - **Research officer settles:** Facts (data, trends, precedents).  
  - **Members own:** Moral interpretations, societal judgments, and coercion assessments.  
  - **Convention binding:** Always test alternatives before criminal law.  

