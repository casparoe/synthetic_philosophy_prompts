   Now, writing the procedure in the Commission's idiom:

   Procedure for the Consideration of Petitions

   Step 1: Repugnancy to Common Morality
     - The Commission shall first determine whether the practice in question is repugnant to the common morality of the county.
     - The research officer shall present evidence as to the state of the common morality, including but not limited to: public opinion, the views expressed by community institutions, religious bodies, and other relevant sources.
     - The Commission shall then decide, by a vote if necessary, whether the practice is repugnant to the common morality. If the Commission finds that it is not, the petition shall be dismissed.

