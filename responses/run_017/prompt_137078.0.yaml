  ### **Application to Petitions**  

  #### **Petition 1: Suicide Manual Ban**  
  - **Q1 (Repugnance):** Research officer provides data: public attitudes toward suicide (e.g., church condemnations, media editorials, high suicide stigma in 1960s). *Sufficient if* evidence shows deep-seated moral revulsion, not just disapproval.  
    - *Split:* Devlinian accepts societal "intuition" as repugnance; Hartian demands proof it’s a shared *moral principle*, not just tradition.  
  - **Q2 (Loosening):** Officer provides data: suicide rates, family/carer testimonies. Petitioners argue permissibility "abandons life’s value." *Sufficient if* linked to erosion (e.g., despair normalization).  
    - *Split:* Devlinian sees symbolic harm (selling book = endorsing despair) as loosening; Hartian requires evidence of actual societal breakdown (e.g., rising suicides).  
  - **Q3 (Alternatives):** Officer explores: public censure, restricted sales. *Sufficient if* censure could reinforce life’s value without banning.  
    - *Outcome:* Likely criminalization if majority rejects alternatives.  

  #### **Petition 2: Repeal of Blasphemous Libel Offence**  
  - **Q1 (Repugnance):** Officer polls religious/secular attitudes. Pro-repeal: "Minority morality." Anti-repeal: "Core to county’s history." *Sufficient if* evidence shows morality is still "common" (e.g., majority adherence, public rituals).  
    - *Split:* Devlinian defends historical morality as "common"; Hartian argues morality must be *current* majority to count.  
  - **Q2 (Loosening):** Anti-repeal: Repeal itself "dissolves" shared life by declaring old morality dead. Officer examines social cohesion post-repeal in similar jurisdictions. *Sufficient if* repeal would fracture communal identity.  
    - *Split:* Devlinian accepts the *act of repeal* as loosening (symbolic surrender); Hartian demands evidence of tangible harm (e.g., riots, discrimination).  
  - **Q3 (Alternatives):** Officer assesses: Could censure replace criminal law? *Sufficient if* censure upholds cohesion.  
    - *Outcome:* Status quo likely retained if Q1/Q2 pass and alternatives fail.  

  #### **Petition 3: Retention of Sexual Practice Offence**  
  *(Per your draft: Commission votes 2-1 to retain)*  
  - **Q1 (Repugnance):** Research officer’s survey shows "very large minority" engages in practice but public norms condemn it. *Sufficient if* public morality (laws, sermons, media) still brands it repugnant *despite* private breaches.  
    - *Split:* Devlinian separates *public morality* (what’s professed) from *private behavior*; Hartian argues widespread practice disproves repugnance.  
  - **Q2 (Loosening):** Majority: Repeal signals "public toleration," eroding professed morality. Officer provides data: societal trust, family structures. *Sufficient if* decriminalization implies endorsement.  
    - *Split:* Devlinian focuses on *declaration* (repeal = moral surrender) as harm; Hartian sees no loosening without victim harm.  
  - **Q3 (Alternatives):** Officer notes selective enforcement (poor/immigrants) and suggests censure. *Critical point:* Commission must weigh if criminal law’s unfairness undermines "common life."  
    - *Split:* Hartian argues selective enforcement *itself* loosens fabric (injustice breeds distrust); Devlinian prioritizes symbolism of law over flaws.  
  - **Outcome:** Your draft’s rationale **holds** under this procedure:  
    - Q1/Q2 pass (repugnance/loosening via "public declaration").  
    - Q3 alternatives rejected (censure deemed insufficient to uphold professed morality).  
    - *But* the selective enforcement **must be addressed in Q3**—members should argue whether criminal law’s unfairness invalidates it as a tool. Your majority can dismiss this (e.g., "Enforcement flaws fixable; symbolism irreplaceable"), but it cannot be ignored.  

