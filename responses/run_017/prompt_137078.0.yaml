  - **Strongest confidence:** The procedure faithfully distills Hart-Devlin. Q1/Q2 force Devlin’s "societal disintegration" test; Q3 embodies Hart’s "harm principle" via least coercion. Splits arise in evidence thresholds (Devlin accepts intuition; Hart demands empirics).  
  - **Least sure step: Q2 (Loosening the fabric).**  
