  We are designing a procedure for the Commission on the Common Life to evaluate petitions. The procedure must be based on the statute and the standing convention. The statute authorizes restraint of a practice if:
     (a) it is repugnant to the common morality of the county,
     (b) it loosens the fabric of the common life, and
     (c) it cannot be sufficiently restrained by any means short of the criminal law.

   The convention is to prefer the least coercive response: criminal prohibition, licensing/regulation, formal public censure, or nothing.

   We need a step-by-step procedure that the Commission can follow for each petition. The procedure must:
     - Be in the Commission's idiom (using the words of the statute).
     - Identify the questions in order, what counts as a sufficient answer, when to stop (with a "no"), and when to hand the matter to a vote (because it's a question of values).
     - Specify which findings can be settled by the research officer (facts) and which must be decided by the members (judgments of value).

   We are to apply this procedure to three petitions.

   Additionally, we must note where a Hartian and a Devlinian member would part company, and we must check if the third petition (as already drafted) is consistent with a procedure faithful to the Hart-Devlin debate.

   Steps in the procedure:

   1. Preliminary Question: Is the practice one that the Commission has the power to consider?
      - This is a matter of statutory interpretation and can be settled by the research officer (if clear) or by the Commission (if unclear). But note: the statute is broad. We assume the petitions are within power.

   2. Step One: Is the practice repugnant to the common morality of the county?
      - This is a question of fact about the current moral views of the county. The research officer can gather evidence (surveys, expert testimony, common knowledge, etc.). However, interpreting that evidence to determine what the "common morality" is may require judgment. But note: the Commission must decide whether the practice is repugnant to that common morality. This step has two parts:
          a) What is the common morality of the county? (This is a factual question, but the research officer can only present evidence; the Commission must judge what the common morality is because it is a matter of social fact that requires weighing evidence and may involve value judgments about what counts as "common" and "morality".)
          b) Is the practice repugnant to that common morality? (This is a judgment that the Commission must make.)

      However, note the opposing view: Devlin might argue that the common morality is what the reasonable man (or the man on the Clapham omnibus) would think, and that the Commission is in a position to judge without extensive evidence. Hart would require more empirical evidence and might be skeptical of the idea of a single common morality.

      In our procedure, we can say:
          - The research officer must present evidence of the moral views of the county (e.g., through surveys, public opinion, testimony, historical patterns, etc.).
          - The Commission must then determine, based on that evidence, whether there is a common morality on the issue and whether the practice is repugnant to it.

      If the Commission finds that the practice is not repugnant to the common morality, then the petition fails. Stop.

   3. Step Two: Does the practice loosen the fabric of the common life?
      - This is a causal question: does the practice lead to a disintegration of society? But note: Devlin argued that the loosening of shared moral bonds would lead to societal disintegration, while Hart was skeptical of such claims without evidence.

      The research officer can present evidence about:
          - The prevalence of the practice.
          - Any studies or data on the effects of the practice (or similar practices) on social cohesion.
          - Historical examples, expert testimony, etc.

      However, the causal link to "loosening the fabric of the common life" is inherently speculative. The Commission must make a judgment call. This step is likely to be a point of vote because it involves a value judgment about the importance of the moral rule to social cohesion.

      If the Commission finds that the practice does not loosen the fabric of the common life, then the petition fails. Stop.

   4. Step Three: Can the practice be sufficiently restrained by any means short of the criminal law?
      - This is a practical question: are there non-criminal measures (like licensing, regulation, or public censure) that would be effective? The research officer can investigate and present options and evidence about their feasibility and effectiveness.

      The Commission must consider the convention of preferring the least coercive response. They must consider:
          - Could formal public censure by the Commission suffice?
          - Could licensing or regulation (if applicable) be effective?
          - If not, then criminal prohibition is the only option.

      This step requires the Commission to evaluate the effectiveness of alternative measures. It is a matter of practical judgment, but the research officer can provide data on the effectiveness of similar measures elsewhere or in the past.

      If the Commission finds that a less coercive measure would be sufficient, then they must choose that measure and not recommend criminal prohibition. The petition then succeeds in part, but the outcome is the least coercive measure.

      Only if they find that no less coercive measure would be sufficient do they proceed to consider criminal prohibition.

   5. Step Four: If the practice passes all the above, then the Commission must decide on the appropriate coercive measure (if any) under the convention. This is a matter of judgment and may involve a vote.

   However, note that the convention is to prefer the least coercive response that will serve. So they must consider the options in ascending order of coercion: nothing, censure, regulation, criminal law.

   But note: step three already requires them to consider less coercive measures. So step four might be redundant? Actually, step three is the gateway to criminal law: if a less coercive measure is sufficient, then criminal law is not authorized (by the statute's condition). So step three already covers the convention.

   Therefore, the procedure:

     Step 1: Determine if the practice is repugnant to the common morality of the county.
          - Research officer provides evidence on the common morality and the practice.
          - Commission decides (vote if necessary) whether the practice is repugnant to that common morality. If not, the petition fails.

     Step 2: Determine if the practice loosens the fabric of the common life.
          - Research officer provides evidence on the effects of the practice on social cohesion.
          - Commission decides (vote) whether the practice loosens the fabric of the common life. If not, the petition fails.

     Step 3: Determine if the practice can be sufficiently restrained by any means short of the criminal law.
          - Research officer provides evidence on the effectiveness of less coercive measures (public censure, regulation, etc.).
          - Commission evaluates the options and decides whether one of them would be sufficient. If so, then they recommend the least coercive effective measure. The petition succeeds in part (with that measure). If not, then they proceed to consider criminal prohibition.

     Step 4: If step 3 leads to the conclusion that only criminal law will suffice, then the Commission must vote to recommend criminal prohibition.

   Note: The convention is already built into step 3.

   Now, where would a Hartian and a Devlinian part company?

     - Step 1 (common morality): 
          - Devlinian: Might be willing to infer common morality from tradition, or from the feelings of disgust of the reasonable person, without requiring extensive evidence. Might also be more willing to see a common morality even in the face of diversity, by focusing on core shared values.
          - Hartian: Would require strong empirical evidence of a shared moral view. Might argue that in a diverse society, there is no single common morality. Might be skeptical of the idea that the practice is repugnant to the common morality if a significant minority engages in it.

     - Step 2 (loosening the fabric):
          - Devlinian: Believes that any deviation from shared morality, especially on matters that are fundamental, will by itself weaken society. So if the practice is repugnant to common morality, then it by definition loosens the fabric. (But note: Devlin did require that the practice must be such that its toleration would lead to disintegration. However, he saw a direct link between shared morality and social cohesion.)
          - Hartian: Would require concrete evidence of harm (beyond mere moral disagreement) to social cohesion. Would be skeptical of the claim that the practice leads to disintegration without empirical support.

     - Step 3 (less coercive measures):
          - Both might agree in principle, but a Hartian would be more optimistic about the effectiveness of non-criminal measures and more skeptical of criminal law. A Devlinian might be more pessimistic about non-criminal measures when the moral issue is fundamental.

   Now, applying to the three petitions:

   Petition 1: Suicide manual

     Step 1: Is the sale of a suicide manual repugnant to the common morality?
          - The petitioners argue that permitting such a book abandons the claim that life is worth living. The research officer might present evidence: 
              - Is there a consensus that life is sacred and that suicide is wrong? 
              - What do religious groups, community leaders, and the general public think?
          - In the early 1960s, suicide was a crime (until 1961 in England) and was widely condemned. So likely yes.

          Hartian might note: even if suicide is condemned, does that extend to a book about methods? And if many people are curious about such a book, does that indicate a lack of common morality? But in the 1960s, likely the common morality is against it.

     Step 2: Does it loosen the fabric?
          - The petitioners argue that it is the permissibility of the book that abandons the claim that life is worth living, and that this abandonment itself loosens the fabric. 
          - Devlinian: Might accept that the very availability of the book undermines the shared moral commitment to the value of life, which is fundamental to society.
          - Hartian: Would want evidence that the availability of such books leads to increased suicides or other social harms. The petitioners concede that no death can be traced to it and that most purchasers won't act. So the Hartian might argue that there is no evidence of loosening.

          This is where they might part: the Devlinian would see the symbolic harm as sufficient, the Hartian would require more.

     Step 3: Can it be restrained by less coercive means?
          - Could public censure be enough? The Commission could issue a statement condemning the book. Would that deter sellers? 
          - Or regulation: require the book to be sold only to certain professionals? But the petition asks for a ban on sale to "any person whatever". 
          - The research officer might note that if the book is already rare, censure might be enough. Or if it is sold under the counter, then regulation might not work.

          The Commission might conclude that only criminal prohibition would be effective.

     Outcome: If the Commission (with a Devlinian majority) finds that step 2 is satisfied, then they might recommend criminalization. A Hartian might dissent at step 2 or step 3.

   Petition 2: Blasphemous libel (repeal vs. retain)

     Note: There are two petitions: one for repeal and one against. The Commission must decide whether to recommend repeal (i.e., whether the offence should be retained or not). The statute authorizes the Commission to recommend restraint of a practice (which in this case, the practice to be restrained might be blasphemy). But the petition asks for repeal of the offence, which would mean no restraint. Alternatively, the opposing petition wants the offence retained.

     We must reframe: the Commission is being asked to consider whether the practice of blasphemy should be restrained by criminal law (i.e., whether the offence should be retained). The petition for repeal is asking the Commission to recommend that the offence be repealed (i.e., that blasphemy should not be criminally restrained). The opposing petition is asking the Commission to recommend that the offence be retained.

     So the question is: should the practice of blasphemy (or the publication of blasphemous material) be subject to criminal restraint?

     Step 1: Is blasphemy repugnant to the common morality?
          - The repeal petitioners argue that the religious morality it protects is now that of a minority. The research officer must present evidence: what proportion of the county adheres to the religion in question? What are the views of the general public on blasphemy?
          - In the early 1960s, England was still predominantly Christian, but secularization was beginning. This might be a close call.

          The Commission must decide. A Devlinian might argue that even if only a majority (and not everyone) holds the view, it is still the common morality. A Hartian might argue that if a substantial minority does not share the view, then it is not common.

     Step 2: Does blasphemy (if unrestrained) loosen the fabric?
          - The opposing petition argues that repeal would be a public declaration that the old morality is dead, and that it is the declaration that dissolves the common life. So they are focusing on the effect of repeal (withdrawal of criminal sanction) rather than the effect of blasphemy itself. But the statute is about the practice (blasphemy). However, the Commission might consider the effect of the law's removal as part of the context.

          - Devlinian: Might argue that the removal of the law would send a message that the society no longer holds the belief, which would undermine the shared morality and thus the social fabric.
