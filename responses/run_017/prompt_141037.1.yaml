  The user suspects the controversy was so heated because the sides were talking past each other. Traditionalists focused on authorship to absolve Germany, while structuralists spread blame. The structural view doesn't exonerate Germany; it implicates all powers but still holds Germany accountable due to its pivotal role. So the user's intuition here is correct.

