  Below is a decision tree addressing utilitarianism's demandingness objection, built from logical space using concrete cases. It starts from an uncontroversial premise and branches into named positions via three yes/no questions. The tree has eight possible leaves (from 3 binary questions), but only six are occupied by coherent views—two combinations remain empty due to unattractiveness/incoherence. Each question is plain English and answerable without philosophical knowledge. The views covered: maximizing utilitarianism, satisficing, personal prerogative, threshold, and the decision-procedure distinction.  

  ### **Decision Tree**  
  **Start:** Everyone agrees: *You should skip a $5 latte and donate to save a child from disease (e.g., via bednets), since the cost to you is tiny and the benefit to them is huge.*  

  1. **Q1: Should you donate a kidney to a stranger?**  
     (Assumptions: Safe surgery for you; saves a life; moderate pain/recovery.)  
     - **If YES →** Proceed to Q2.  
     - **If NO →** Proceed to Q3.  

  2. **Q2 (for YES on Q1): Is it morally wrong to buy non-essentials (e.g., video games) instead of donating more to charity?**  
     (Tests consistency in demandingness.)  
     - **If YES → Leaf: MAXIMIZING UTILITARIANISM**  
       *Weirdest commitment: You must quit your engineering job for a higher-paying one you hate, if it lets you donate more and save more lives.*  
     - **If NO → Leaf: PERSONAL PREROGATIVE (OPTIONS VIEW)**  
       *Weirdest commitment: Donating a kidney is required, but buying video games instead of donating extra is fine—your interests matter beyond just maximizing good.*  

  3. **Q3 (for NO on Q1): Should you donate 10% of your income to charity?**  
     (Tests moderate sacrifice vs. minimal duty.)  
     - **If YES → Leaf: THRESHOLD VIEW**  
       *Weirdest commitment: You must donate exactly 10% (no more, no less), even if 11% would save a life at negligible cost to you.*  
     - **If NO → Proceed to Q4.**  

  4. **Q4 (for NO on Q3): Should you skip your child’s birthday party to work a shift and donate the earnings to save a stranger’s child?**  
     (Tests family vs. strangers’ needs.)  
     - **If YES → Leaf: SATISFICING UTILITARIANISM**  
       *Weirdest commitment: You must sacrifice time with family for distant needs, but only up to a "good enough" point (e.g., 5% income)—beyond that, extra help is optional.*  
     - **If NO → Leaf: MINIMAL DUTY / STRONG PREROGATIVE**  
       *Weirdest commitment: Skipping the latte is required, but skipping anything else (even a kidney) is optional—your life deserves priority unless the cost to you is trivial.*  

