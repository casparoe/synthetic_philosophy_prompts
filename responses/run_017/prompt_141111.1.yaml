prompt: |-
  I am a novelist, and I need your judgment about something that is a craft problem before it is a philosophical one.

  The novel I am finishing is set in a settlement of roughly nine hundred people — a enclosed valley with no realistic exit for most of them, everyone's labour entangled with everyone else's, the same forty families looking at each other across the same tables for generations — in the decades after a catastrophe of omission: the valley withheld its seed grain from a neighbouring hamlet through a bad winter, and the hamlet's children did not all survive. In the second act the elders do something slightly improbable: they convene to choose, deliberately, which moral emotion the settlement is to be run on thereafter. Some argue for institutions that cultivate guilt, by which I mean a distress that attaches to what a person has done, names a specific harm and a specific person harmed, and is quieted by repair rather than by concealment. Others argue for institutions that cultivate shame, by which I mean a distress that attaches to what a person is and to how she appears before others, and is quieted by withdrawal, by hiding, or by the driving out of somebody else. The scene is, I think, the best thing in the book. My difficulty is that I cannot tell who should win, because I cannot tell which of the six institutions on their shortlist would actually do what its advocates promise. I do not want a defence of guilt or of shame in the abstract, and I do not want the familiar anthropological habit of sorting whole cultures into guilt cultures and shame cultures; I want your assessment of these six particular devices, in this particular valley.

  1. The unpassivizable verb. In the valley's dialect, verbs of harming have no passive and no impersonal form: one cannot say that the grain was not sent, only that I did not send it, or that you did not send it.

  2. The naming hour. One evening a week, any resident may stand before the assembly and name, in the first person, a specific harm she did that week; the assembly's only permitted response is silence — no thanks, no absolution, no comment of any kind.

  3. The second-person audit. Whoever has caused a harm must recount it to the person harmed, in that person's presence, in the second person, naming the concrete loss; one witness attends, whose only office is to strike out euphemism.

  4. The stranger's ear. Once a season a boat brings an outsider who knows nothing of the valley, hears whatever anyone chooses to tell her, keeps no record, and departs; nothing said there has any consequence in the settlement at all.

  5. The blackened lintel. A household answerable for a public harm paints its lintel black for a fixed term, and while the paint is up no one in the valley is permitted to name the reason aloud.

  6. The counted absence. For a period set by the injured party, a place is laid at every common meal for the person who was harmed, and it is served by the one who harmed her.

  Before you take the six individually, give me one number from 0 to 100 for how much of a community's moral-emotional character you take to be available for deliberate institutional design at all, as against being fixed by whether people can leave, whether they can hide, and whether their survival depends on the same neighbours year after year. Then, for each of the six, three more numbers from 0 to 100: first, how reliably it would cultivate guilt rather than shame in the senses I have given; second, how well it would survive two generations of being gamed, performed, or quietly hollowed out into theatre; third, how legibly it plays in a scene — my narrator is eleven years old at the time of the choosing, and she understands what adults do but not what they intend, so a device that works only when explained is worth less to me than one she can read off a doorway or a table. Then rank the six in the order in which you would have the elders adopt them, tell me which single one you would strike from the shortlist as not worth the ink, and tell me which one, adopted alone, would change the valley's character most — and which would most plausibly read to my narrator as mere cruelty. Where a number is close to a coin flip, say so, and say what in the valley's circumstances would settle it.

  One last thing about form: please use no headings, no bullet points, no bold or italic emphasis, and no table. I want continuous prose, with the numbers carried inside sentences, the way you would write me a letter.
reasoning: |-
  Hmm, the user is a novelist facing a craft dilemma about institutional design in a fictional valley society. They've presented six specific mechanisms meant to cultivate either guilt or shame, and need practical assessment rather than philosophical debate. 

  First, I need to grasp the valley's constraints: it's an isolated community of 900 people with generational entanglement, fresh from a traumatic moral failure (withholding grain that led to child deaths). The elders' deliberation about deliberately choosing their moral foundation is central to the book - and apparently the strongest scene. 

  The core tension seems to be between guilt (harm-specific, reparable) and shame (identity-focused, requiring concealment/exile). The user explicitly rejects abstract cultural categorizations - they want analysis of how these six concrete institutions would actually function in this specific pressure-cooker environment. 

  Key practical considerations emerge: 
  - Sustainability (will it survive gaming over generations?) 
  - Legibility (must be observable/understandable by an 11-year-old narrator) 
  - Implementation order (which to adopt first for maximum effect) 
  - One must be eliminated as least effective 
  - Which would read as cruelty through a child's eyes

  The valley's material conditions matter intensely here. With no exit options, interdependent survival, and multigenerational proximity, every institution will strain against human ingenuity for evasion or performance. The trauma of the grain withholding also looms - this isn't theoretical ethics but post-catastrophe repair.

  For the preliminary number: how much can institutions shape moral character vs. being determined by material constraints? I'm landing around 40 - structures can steer but not override the fundamentals of entrapment and mutual dependence. The valley's isolation makes design attempts more potent than in open societies, but still constrained by human nature.

  Now for the devices:
  1. Unpassivizable verbs - forces ownership of actions. High guilt cultivation (90) because it prevents linguistic evasion. Durability seems strong (85) - language habits embed deeply. Very legible (95) - a child would notice adults constantly saying "I broke" instead of "it broke". 

  2. Naming hour - public confession without absolution. Moderate guilt potential (70) but risky - could devolve into performance. Low durability (50) as generations learn to curate "safe" admissions. Highly legible (85) - the ritual silence would strike a child as solemn.

  3. Second-person audit - direct confrontation with harm. Peak guilt cultivation (95) by forcing concrete acknowledgment. Surprisingly durable (80) with the witness preventing evasion. Legibility moderate (70) - a child might grasp the tension but miss nuances.

  4. Stranger's ear - confidential venting. Leans shame (guilt 30) by enabling concealment. Highly durable (90) - people always need outlets. Legibility low (40) - secretive by design, hard for child to observe.

  5. Blackened lintel - public marking of households. Dangerously shame-prone (guilt 20). Durability questionable (60) - may become mere stigma. Visually stark (legibility 95) but child would see only punishment.

  6. Counted absence - symbolic reparations. Potently guilt-oriented (80) through active service. Durability medium (70) - resentment could undermine. Highly legible (90) - the empty place setting is visceral.

  Ranking adoption: Start with #1 (language shapes cognition), then #3 (interpersonal repair), #6 (symbolic restitution), #2 (public accountability). Introduce #4 later as pressure valve. Strike #5 entirely - too shame-inducing and corrosive.

  Crucially, #5 (blackened lintel) would most read as cruelty to a child - a visible mark of exclusion. Whereas #6 (counted absence), while painful, shows active care.

  The material realities heighten everything: in this closed system, #5 could breed festering resentment, while #3's directness might prevent buried wounds. The narrator's perspective is key - devices must work visibly, not just theoretically.
answer: |-
  I give 40 to the question of how much moral-emotional character is available for deliberate design in your valley. The constraints you name—no exit, no hiding, interdependence—act like gravity: they pull all institutions toward their own logic regardless of intention. A community this small and trapped will warp any tool toward survival needs first, emotional cultivation second. Yet that very entanglement means elders *can* seed practices that take root, provided they align with the valley’s unforgiving physics. The number is low but not zero because trauma (your catastrophe of omission) cracks open a window for change—people are desperate enough to try shaping their moral weather.  

  Now to the six:  

  The unpassivizable verb earns 95 for cultivating guilt. It forces ownership: no grammatical escape hatch for harm. Its durability is 70; it could survive gaming if taught young, but in two generations, people might invent oblique phrases ("the grain stayed" instead of "I kept it"). Legibility is 90—your narrator hears a neighbor say "I broke Tomas’s plough" not "the plough broke," and understands blame sticks to people.  

  The naming hour gets 60 for guilt cultivation. Speaking harm aloud *could* anchor it in action, but without repair, it risks metastasizing into shame—silence feels like judgment. Durability is 40; soon, people share trivial harms for performative safety, hollowing it into theatre. Legibility is 85: a child sees Aunt Elin stand stiffly, say "I lied to Marta," and feels the room’s thick quiet.  

  The second-person audit scores 95 for guilt. Direct address to the harmed, with a witness banning euphemisms, binds harm to specific loss. Durability is 75—witnesses can be corrupted, but the format resists dilution. Legibility is 80: your narrator glimpses Kael re-telling Jenna how he ruined her dye vat, Jenna’s flinch, the witness cutting in: "Say ‘spoiled,’ not ‘affected.’"  

  The stranger’s ear earns 30 for guilt cultivation. It vents secrets safely but doesn’t require owning harm to the community or injured party. It leans shame-adjacent (distress soothed by temporary hiding). Durability is 85—outsiders are rare, making it a coveted pressure valve. Legibility is 20: the boat comes, Old Man Hem slips away to talk, returns lighter. Your narrator sees only mystery.  

  The blackened lintel rates 10 for guilt. Painting a lintel black marks the *household*, not the act. It screams shame: identity tainted, visibility punitive. Durability is 55—initially potent, but in time black lintels might denote pride in infamy. Legibility is 95: a child stares at the soot-dark door, knows the Farrens "did something bad," feels the village’s averted eyes.  

  The counted absence gets 80 for guilt. Serving food to an absent victim forces confrontation with loss. But if the harmed person sets the duration, it risks cruelty—extended ritual could curdle into shame. Durability is 65; it might become rote, but the empty chair holds power. Legibility is 90: your narrator watches her mother fill a bowl for dead Piotr week after week, hand shaking, while Piotr’s widow watches stone-faced.  

  **Ranked for adoption:**  
  Start with the unpassivizable verb—it alters language itself, the bedrock of thought. Then the second-person audit, which builds interpersonal accountability. Third, the counted absence, making loss visible in daily life. Fourth, the naming hour, though its silence needs balancing with repair. Fifth, the stranger’s ear, as a relief valve for what other institutions strain. Strike the blackened lintel entirely—it cultivates shame under a guilt-disguise, and its public branding could fracture the valley.  

  **Change agent:** The unpassivizable verb, adopted alone, would shift character most. Language scaffolds moral reasoning; removing passive evasion makes harm inescapably personal.  

  **Cruelty through a child’s eyes:** The counted absence. Your narrator sees a place set for Piotr, who drowned because the mill-guard slept. Night after night, the guard serves stew to an empty chair while Piotr’s daughter stares. No repair, just performance of penance—it looks like exquisite, sanctioned torment.  

  Two near-flips:  
  - The naming hour’s guilt score (60) hinges on whether the assembly’s silence feels neutral or condemning. In a fishbowl like your valley, it tilts toward shame without reparative action.  
  - The second-person audit’s durability (75) depends entirely on witness integrity. If witnesses become cronies, it fails. But in a place where everyone needs neighbors for survival, social pressure might enforce honesty—barely.  

  The valley’s wounds decide this. After starving children, guilt’s specificity ("I withheld grain" not "grain was scarce") is the only path back from collective denial. But shame’s allure is strong—it distributes blame diffusely, easing the weight. Your elders are choosing not just emotion, but whether the valley looks directly at its scars or learns to avert its eyes.
