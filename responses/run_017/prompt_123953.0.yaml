prompt: |-
  I've somehow ended up on the committee of a very small charity that funds secondary school scholarships in Malawi and northern Ghana — I went out with them for three weeks last summer and have come back completely unable to shut up about it. The problem is that every committee meeting turns into the same row. One member thinks colonial borders and corruption explain everything. Another bangs on about disease burden and latitude. A third reckons it's basically culture and work ethic with extra steps. Everyone is extremely confident, nobody has ever changed anybody's mind, and the arguments are all just stories bolted onto the one history we happen to have watched happen.

  They've asked me to run a session on this at our volunteer training weekend in March and I want to do it properly rather than stand at the front and tell them causal inference is hard. So: design me a game or structured simulation for that room. About 14 people, ages from about 19 to late 60s, mostly no economics or stats background, 90 minutes, a church hall with a flipchart and no projector. There will be volunteers in the room who are Ghanaian and Malawian, so please use invented countries or blank names for the in-game places — I don't want anyone's actual home country turned into a puzzle for other people to solve.

  What I want them to feel in their bones is this: a single run of history can be equally well explained by two or more causal stories that disagree completely about what to do next, and getting the story to fit is not the same as finding the lever. No lecture up front, and ideally they shouldn't hear words like endogeneity or underdetermination until the debrief.

  Rough shape I have in mind, but please improve on it: the group plays through a few short "histories" generated by a hidden rule the facilitator knows and they don't. There should be at least three genuinely different hidden rules — say one where a slow-moving institutional parameter does the work, one where a fixed geographic or endowment parameter does, and one where early luck gets locked in and compounds. The key design constraint: each rule has to be able to throw up the same kind of visible history, so that the team observing it cannot tell which world they're in, but the rules must differ sharply in what would happen if you spent money to change one thing. Then they get an intervention budget and have to bet on a lever, and the payoffs should reward getting the intervention right rather than telling a convincing story. If it helps, give some people roles — donor board, country adviser, record keeper — and give at least one role information that is local and partial rather than global.

  Please give me: the rules, the roles, the materials (nothing I can't buy in a stationery shop), a timeline in minutes, and a debrief that maps specific moments in the game onto specific parts of the problem — why fitting the past is cheap, what would actually have counted as evidence, and the difference between asking why a place is poor and asking what would make it richer from here.

  Also be honest about two things. First, what will predictably go wrong when I run it. I can already see three risks: the confident committee member dominating, someone trying to reverse-engineer the rule cards instead of playing, and the whole thing landing as "well then nothing is knowable and we might as well keep doing what we're doing," which is the opposite of what I want. Second, be straight about what the game can't do and what I'll have to say out loud myself. I assume the honest answer is that the real world gives you a lot more than one draw from a stationary rule — variation inside countries, comparisons over time, past interventions that did land, records of the mechanism rather than just the outcome — and that the clean lever-versus-marker distinction is cleaner in a game than in a place where causes only seem to work in combination. Tell me what to say about that so the session doesn't just teach people to shrug.

  Oh, and one more thing: nobody should need any real-world facts to play it, and nothing should depend on anyone having read anything. If your design needs a name, a date or a cited study to land, it's the wrong design.
reasoning: |-
  We are designing a simulation game for a group of about 14 people, with no economics or stats background, in a 90-minute session. The goal is to demonstrate that the same historical outcome can be explained by different underlying causal mechanisms, and these mechanisms imply different effective interventions. We want to avoid using real country names and keep the game based on invented places.

  Key elements:
  - Three hidden rules (worlds) that can produce similar observable histories but respond differently to interventions.
  - Roles: to involve participants and provide partial/local information.
  - Materials: flipchart, paper, pens, index cards (or similar).
  - Timeline: 90 minutes total.

  Structure:
  1. Introduction (5 min)
  2. Round 1: Observing History (20 min)
  3. Round 2: Intervention Proposals (20 min)
  4. Round 3: Intervention Outcomes (15 min)
  5. Debrief (30 min)

  Hidden Rules (Worlds):
  We'll have three worlds, each with a different underlying rule that determines the "wealth" of a region over time. We'll call the regions "Northland" and "Southland" (or use blank names like Region A and B). Each world has a 20-year history (with 5-year intervals) of wealth levels (e.g., low, medium, high) for both regions.

  Rule 1 (Institutions Matter): Wealth depends on the quality of institutions (a slow-moving parameter). In this world, institutions can be "weak", "medium", or "strong". Each period, the wealth level is determined by the current institution level. Interventions that improve institutions (if done correctly) will lead to wealth improvement. However, institutions change slowly and can be resistant to change without sustained effort.

  Rule 2 (Geography Matters): Wealth is determined by a fixed geographic factor (e.g., soil quality, disease burden). In this world, there are two types: one region has "favorable" geography and the other "unfavorable". The favorable region will always have medium or high wealth, while the unfavorable region will always have low or medium (but never high). Interventions that try to change non-geographic factors (like institutions or culture) will not work. Only interventions that mitigate the geographic disadvantage (e.g., providing irrigation, disease control) can help.

  Rule 3 (Path Dependence: Early Luck Compounds): Wealth is determined by initial conditions and random events that get locked in. In this world, both regions start with a random initial wealth (low or medium). Then, each period, if a region has high wealth, it stays high; if medium, it has a 75% chance to stay medium and 25% to become high (if it gets a positive shock) or low (if negative); if low, it stays low unless there's a positive shock (25% chance to become medium). Interventions that provide a positive shock can break a low-wealth trap, but only if timed correctly and in the right context.

  Note: We want the observable histories (the wealth levels over 20 years) to look similar across the three worlds so that participants cannot easily distinguish which rule is in effect.

  Roles:
  - Facilitator: (You) Knows the hidden rule and records the history on the flipchart.
  - 2 Country Advisers (one for each region): Each gets a card with partial information about their region. The information depends on the world:
     - In Rule 1 (Institutions): They know the current institution level (but not how it changes) and some anecdotal evidence about corruption or efficiency.
     - In Rule 2 (Geography): They know the geographic type of their region and some challenges (e.g., "prone to droughts" or "fertile soil").
     - In Rule 3 (Path Dependence): They know the initial conditions and some recent events (e.g., "a bad harvest last year" or "a new factory opened").
  - 2 Donor Board Members: They control the intervention budget. They have to decide which interventions to fund based on the group's discussion.
  - Rest of the group: Analysts. They can ask questions and propose explanations.

  Materials:
  - Flipchart to record the history (as a timeline for both regions).
  - Index cards for roles (with role-specific information).
  - A set of three rule cards (for the facilitator, one for each world) that define how wealth is determined and how interventions might work.
  - A set of intervention options (written on a flipchart or cards) that participants can choose from.

  Intervention Options (examples, but the same set for all worlds):
  1. Improve governance (train officials, anti-corruption program)
  2. Build infrastructure (irrigation systems, roads)
  3. Health intervention (vaccination campaign, malaria control)
  4. Education investment (build schools, teacher training)
  5. Direct cash transfers to poor families

  Each intervention costs 1 unit. The donor board has 3 units to spend (so they can choose up to three interventions, but they can also spend multiple units on the same intervention).

  How interventions work in each world:
  - Rule 1 (Institutions): Only intervention 1 (improve governance) has a chance to work. If chosen, there's a 60% chance that institutions improve by one level (if not already strong). Other interventions have no effect.
  - Rule 2 (Geography): Only interventions 2 (infrastructure) and 3 (health) can help, and only in the unfavorable region. If applied to the unfavorable region, they have a 70% chance of raising wealth by one level (if not already high). Other interventions or applying to the favorable region have no effect.
  - Rule 3 (Path Dependence): Any intervention that targets a region in low wealth has a 50% chance of providing a positive shock (moving it to medium). If the region is already medium, it has a 50% chance of moving to high. If high, no effect. However, if the same region gets two interventions in one round, the chance increases to 75%.

  Note: The outcomes of interventions are determined by the facilitator using the rule and a die (or a random number) to simulate the chance.

  Game Setup:
  1. The facilitator chooses one of the three rules (worlds) without revealing it.
  2. The facilitator generates a 20-year history (5 time points: year 0, 5, 10, 15, 20) for both regions using the rule. The history should be such that both regions start at low or medium and one ends up better than the other (but the exact pattern should be similar across rules).

  Example Histories (to be generated on the fly using the rule, but pre-designed to be similar):
     - Year 0: Both low.
     - Year 5: Region A medium, Region B low.
     - Year 10: Region A medium, Region B low.
     - Year 15: Region A high, Region B medium.
     - Year 20: Region A high, Region B medium.

  This pattern can be generated by all three rules with appropriate parameters.

  Timeline in Minutes:

  0-5 min: Introduction
  - Explain that they are going to look at the development history of two regions (Northland and Southland) and then decide how to allocate a limited budget to help them.
  - Assign roles: 2 Country Advisers (one for each region), 2 Donor Board members, and the rest are Analysts. Hand out role cards (with information specific to the chosen world).

  5-25 min: Observing History and Forming Explanations
  - The facilitator presents the history of both regions (on flipchart) from year 0 to 20 (5 time points). The history is generated by the hidden rule.
  - The Country Advisers share their partial information (from their cards) with the group.
  - The group (Analysts, Donor Board, Country Advisers) discusses: What explains the differences in the regions? What might have caused the patterns? (The facilitator encourages multiple explanations and writes them on the flipchart.)

  25-45 min: Intervention Proposals
  - The facilitator introduces the intervention options (written on flipchart) and the budget (3 units).
  - The group discusses which interventions to fund and in which region(s). They should propose a plan and justify it based on their explanation of the history.
  - The Donor Board makes the final decision (with input from the group) and writes down the intervention plan.

  45-60 min: Intervention Outcomes
  - The facilitator applies the intervention plan to the world (using the hidden rule and randomness) and reveals the outcomes (wealth levels at year 25, after the interventions). The outcomes are recorded on the flipchart.

  60-90 min: Debrief
  - Reveal the hidden rule and explain how the history was generated and why the interventions worked (or didn't).
  - Discuss the three possible rules and show that the same history could have been generated by any of them, but the effective interventions are different.
  - Map the game to the real problem:
     a) Why fitting the past is cheap: Because multiple stories can explain the same data.
     b) What would count as evidence: Variation (over time, across regions), experiments, natural experiments, etc. In the game, they only had one history and no variation.
     c) The difference between asking "why is it poor?" (which leads to just-so stories) and "what would make it richer from here?" (which requires knowing the causal mechanisms that respond to intervention).
  - Emphasize that in the real world, we have more data (variation, past interventions) and we can test mechanisms. We are not stuck with one history.

  What will predictably go wrong:
  1. Dominant participant: Assign roles to distribute speaking (e.g., Country Advisers must speak, Donor Board decides). As facilitator, call on quieter members.
  2. Reverse-engineering: Discourage it by emphasizing that the goal is to learn about the process, not guess the rule. Also, the rules are complex enough that it's hard to reverse-engineer quickly.
  3. Fatalism ("nothing is knowable"): Counter in debrief by emphasizing that the game is a simplified analogy. Real world offers more data and opportunities to test. We can learn from multiple cases and past interventions. The point is not to give up but to be humble and test our assumptions.

  What the game can't do:
  - It simplifies by having one stationary rule and one history. The real world has changing rules and many data points.
  - In reality, causes are often intertwined and interventions may work in combination. The game has clean levers to make a point.
  - The game doesn't capture the complexity of real development (politics, external factors, etc.).

  What to say about that:
  "Today's game is a simplified model to illustrate a key challenge: the same outcome can have multiple causes, and without knowing the cause, we might choose the wrong intervention. But in reality, we have more than one data point. We can look at changes over time, compare different regions, and learn from past policy experiments. The lesson is not that we can't know anything, but that we must be cautious about jumping to conclusions from a single story. We should seek evidence that distinguishes between competing explanations and test interventions on a small scale when possible."

  Materials Checklist:
  - Flipchart and markers
  - Index cards for roles (prepared for each world, but you'll only use one set per game)
  - A die (for randomness in interventions and possibly in generating history if done live) or a way to simulate randomness (like drawing from a hat)
  - Pre-prepared rule cards for the facilitator (for each of the three worlds, with details on how to generate history and how interventions work)

  Note: Since you have to run this without a projector, all instructions and history must be on flipcharts or handouts.

  How to generate the history in advance:
  Before the session, for each rule, prepare a specific history that fits the pattern (both regions start low, one improves earlier and ends up higher). Make sure the same history pattern is possible in all three rules. Then, during the session, you just reveal that pre-generated history.

  Alternatively, you can generate the history on the fly by rolling a die (if the rule involves randomness) but that might be time-consuming. Pre-generation is safer.

  Running the game multiple times? 
  But note: you have only 90 minutes and three worlds. It's better to run one world and then explain the other two in the debrief. You can say: "In this session we experienced one world, but there are at least two other worlds that could have produced the same history. Let me describe them..."

  This keeps it within time.

  Revised Timeline (with pre-generated history):

  0-5 min: Intro and role assignment.
  5-10 min: Present history (flipchart with table: Time, Northland, Southland).
  10-25 min: Group discussion: What explains the history? Country Advisers share their info. Flipchart: list explanations.
  25-35 min: Introduce interventions and budget. Group discusses what to do.
  35-45 min: Donor Board decides and writes the plan.
  45-50 min: Facilitator determines outcomes (using rule and die) and reveals.
  50-90 min: Debrief (including revealing the rule and discussing the two other rules that could have produced the same history).

  Debrief Outline (50-90 min):
  1. (5 min) Reveal the rule and show how the history was generated and why the interventions worked (or didn't).
  2. (10 min) Explain the other two rules and how they could have generated the same history. Show that the effective interventions are different.
  3. (10 min) Map to the real problem:
     - Why we can fit multiple stories to one history: because the data is limited and the stories are flexible.
     - What would have counted as evidence? If we had more time points, or if we could see how the regions reacted to similar events, or if we had data on the intermediate factors (like institution quality, geography, or past shocks).
     - The key difference: The question "Why is Region A richer than Region B?" is about the past and can be answered by many stories. The question "What intervention will make Region B richer?" requires knowing the causal levers that are active now.
  4. (5 min) Address the risks: 
     - Avoid fatalism: We are not saying we can't know. We are saying we need to be cautious and test our assumptions. In the real charity, we have more information (like local knowledge, past projects, and data from similar places) and we can learn by doing small tests.
     - Emphasize that the game is a metaphor to encourage critical thinking about our pet theories.

  Let me know if you need more details on the rule mechanics or role cards!
answer: |-
  Below is a complete design for your session, "The Lever Game." It focuses on your core goal: helping participants experience how the same historical outcome can be explained by conflicting stories, while only one underlying "rule" (causal mechanism) determines what interventions will work. The game uses abstract, invented regions ("Northland" and "Southland") to avoid real-world sensitivities. It emphasizes **doing** over debating, with roles that force participants to confront the gap between storytelling and actionable evidence.

  ### Core Concept
  - **Three hidden worlds** (rules) that generate identical histories of "wealth levels" in two regions but respond differently to interventions:
    1. **Institutions World**: Wealth is driven by slow-moving institutional quality (e.g., property rights). Only interventions that directly improve institutions work.
    2. **Geography World**: Wealth is constrained by fixed geographic factors (e.g., climate). Only interventions that mitigate geography work.
    3. **Luck World**: Wealth is path-dependent—early random events compound. Only timely interventions that break "bad luck cycles" work.
  - **Key twist**: All three worlds produce the same 20-year history of wealth for Northland and Southland. Participants see this history, debate causes, then propose interventions. The payoff depends on picking the *right lever for their hidden world*, not storytelling skill.

  ### Materials (all from a stationery shop)
  - **Flipchart** (for recording history and interventions).
  - **Index cards** (three sets: role cards, intervention cards, rule cards for you).
  - **Colored markers** (two colors for regions).
  - **Two dice** (for randomness in outcomes).
  - **Timer**.
  - **Blank paper** for note-taking.
  - **Pre-prepared rule sheets** (for you only—see below).

  ---

  ### Game Rules (Hidden from Participants)
  You (the facilitator) secretly choose one rule to govern the game. All rules use the same wealth levels: **Low (L)**, **Medium (M)**, **High (H)**.  
  **History generation (20 years, 5-year intervals):**  
  Start at Year 0: Both regions at **Low** wealth. Generate wealth for Years 5, 10, 15, 20 using your rule. The history must end with:  
  - **Year 20**: Northland **High**, Southland **Medium** (identical across all rules).  
  Example history pattern (write this on flipchart during the game):  
  | Year | Northland | Southland |  
  |------|-----------|-----------|  
  | 0    | L         | L         |  
  | 5    | M         | L         |  
  | 10   | M         | L         |  
  | 15   | H         | M         |  
  | 20   | H         | M         |  

  **Rules:**  
  1. **Institutions World**  
     - Each region has an institutional quality (IQ) score: **Weak (L)**, **Average (M)**, **Strong (H)**.  
     - Wealth = IQ. IQ changes slowly: Roll one die. On 1–3, IQ stays the same; on 4–6, it improves one level (max H).  
     - *Start*: Northland IQ = Weak (L), Southland IQ = Weak (L).  
  2. **Geography World**  
     - Northland has "Good" geography (max wealth H), Southland has "Bad" geography (max wealth M).  
     - Actual wealth = Geography potential minus "shocks." Roll one die per region:  
       - Good geo: 1–3 → M, 4–6 → H.  
       - Bad geo: 1–3 → L, 4–6 → M.  
  3. **Luck World**  
     - Wealth sticks unless a "shock" changes it. Roll one die per region:  
       - If L: 1–3 → stay L, 4–6 → M.  
       - If M: 1–2 → L, 3–4 → M, 5–6 → H.  
       - If H: 1–5 → stay H, 6 → M (collapse).  
     - *Start*: Both L.  

  **Interventions:**  
  Participants choose 1–2 actions from three options (each costs 1 "budget unit"; total budget = 2 units). Options:  
  1. **Reform Institutions** (e.g., anti-corruption programs).  
  2. **Fix Geography** (e.g., irrigation/clinic projects).  
  3. **Break Luck** (e.g., cash grants to counter shocks).  

  **How interventions work (based on hidden rule):**  
  - **Institutions World**: Only #1 works. If chosen, roll die: 3–6 → Southland IQ improves one level (wealth rises to match).  
  - **Geography World**: Only #2 works. If chosen, roll die: 3–6 → Southland’s max wealth becomes H, then re-roll its current wealth (1–3 → M, 4–6 → H).  
  - **Luck World**: Only #3 works. If chosen, roll die: 4–6 → Southland gets a "good shock" (wealth jumps one level).  
  - *Any other intervention fails* (no effect, regardless of die roll).  

  **Scoring:**  
  - Success = Southland reaches **High** wealth by Year 25.  
  - If successful, all players "win." If not, they "lose."  
  *(This rewards matching the intervention to the hidden rule, not storytelling.)*

  ---

  ### Roles (Assign to Participants)
  - **Country Advisers (2 people)**: One for Northland, one for Southland. Get index cards with **local, partial knowledge** (different per world). *Example:*  
    - *Institutions World (Southland)*: "Your region struggles with corruption. Land disputes often go unresolved."  
    - *Geography World (Southland)*: "Your region has frequent droughts. Soil quality is poor."  
    - *Luck World (Southland)*: "A flood destroyed crops 3 years ago. Many families never recovered."  
  - **Donor Board (2 people)**: Decide how to spend the 2-unit intervention budget. Must justify choices.  
  - **Historians (4 people)**: Study the flipchart history. Propose explanations during discussion.  
  - **Analysts (6 people)**: Question others, synthesize theories, predict intervention outcomes.  
  - *All roles get blank paper for notes.*

  ---

  ### Timeline (Total: 90 Minutes)
  **0–10 min: Setup**  
  - Assign roles randomly. Explain: "We’re in a world with two regions. Northland is richer today. You’ll see their history, debate why, then spend resources to help Southland. Success depends on Southland getting richer by Year 25."  
  - Post the history on flipchart (the same for all worlds). Give Country Advisers their index cards.  

  **10–30 min: The Storytelling Phase**  
  - Task: "Discuss why Northland ended up richer by Year 20. Use the history and local knowledge."  
  - You facilitate:  
    - Ask Country Advisers to share card insights.  
    - Challenge the group: "What could explain this pattern? What might *not* fit?"  
    - Record theories on flipchart (e.g., "Geography held Southland back," "Institutions favored Northland").  
  - *Goal:* Let them experience how easily the same history breeds contradictory stories.  

  **30–50 min: Intervention Phase**  
  - Introduce interventions: List #1–3 on flipchart.  
  - Task: "Donor Board has 2 budget units. Propose 1–2 actions to boost Southland. Everyone else: Advise them. Focus on what will work, not just what fits your story."  
  - Donor Board decides after 10 min of debate. Record choices.  

  **50–60 min: Resolution Phase**  
  - Roll dice publicly for intervention outcomes (per hidden rule).  
  - Update flipchart to Year 25:  
    - If intervention worked, Southland = **High**.  
    - If not, Southland = **Medium** (no change).  
  - Reveal if they won/lost.  

  **60–90 min: Debrief**  
  *(Key: Link game moments to real-world lessons.)*  
  1. **Reveal the hidden rule** and why the intervention worked/failed (5 min).  
  2. **Show how all three rules could create the same history** (5 min):  
     - "Institutions: Northland got lucky with early reforms."  
     - "Geography: Southland was doomed by its land."  
     - "Luck: Northland avoided early shocks."  
  3. **Map to real problems** (15 min):  
     - **Why fitting the past is cheap**: "You all created convincing stories from one history—but they couldn’t all be right. Like your committee debates, this is easy because stories are flexible." *Point to flipchart theories.*  
     - **What counts as evidence**: "In the game, you had no variation—just one timeline. Real life gives more: data within countries (e.g., why did *this* village succeed?), past policy trials, or natural experiments (e.g., a sudden change in borders). These can rule out stories."  
     - **Why vs. how to change**: "Asking ‘Why is Southland poor?’ bred stories about the past. Asking ‘What will make it richer?’ forced you to bet on a lever. The game rewarded the lever, not the story—because only one rule was active. In reality, we need to test levers, not just debate history."  
  4. **Address risks and limitations** (5 min):  
     - "This game simplifies reality. Real causes are messier—geography, institutions, and luck interact. But the point isn’t that ‘nothing works.’ It’s that we need to **test interventions** (e.g., pilot programs) and **seek varied evidence** (e.g., local data) instead of trusting one-size-fits-all stories. Your charity isn’t starting from zero—you have on-ground partners who see mechanisms. Use that."  

  ---

  ### What Will Go Wrong (and How to Handle It)
  1. **Dominant committee member**:  
     - Assign them as a "Historian" or "Analyst"—roles focused on synthesizing, not deciding. Interrupt gently: "Thanks for that—let’s hear from our Country Advisers on the ground."  
  2. **Reverse-engineering the rules**:  
     - If someone guesses, say: "Even if you suspect the rule, you still have to bet on an intervention without proof. That’s the real challenge."  
  3. **Fatalism ("Nothing works")**:  
     - Preempt in debrief: "This isn’t about futility—it’s about humility. The game had one right answer; reality has many paths. We improve by testing small interventions (like your scholarships) and learning."  
  4. **Roles feeling disconnected**:  
     - Push Country Advisers/Donor Board to engage others: "Analysts, what questions do you have for the Advisers?"  

  ### What the Game Can’t Do (and What to Say)
  - **"Real life is messier than three clean rules"**:  
    Acknowledge: "Yes, causes combine—geography affects institutions, luck matters. But the game’s point is that if we fixate on one story (e.g., ‘it’s all corruption’), we might miss the real lever (e.g., malaria nets). Your work in Malawi/Ghana already avoids this by using local partners—they see mechanisms outsiders miss."  
  - **"We have more data than one history"**:  
    Emphasize: "You’re right! We have scholarship records, grad outcomes, regional variations. That’s your advantage over the game. Use it to test assumptions—e.g., did scholarships in drier areas underperform? That’s geographic evidence."  
  - **"So how do we decide?"**:  
    Conclude: "Don’t abandon theory—but pressure-test it. Pilot small, track outcomes, and ask: ‘Did this lever work?’ not ‘Did it fit my story?’ Your committee’s passion is an asset. Channel it into learning, not winning debates."  

  ### Why This Works for Your Context
  - **No real-world knowledge needed**: Everything is self-contained (invented regions, abstract roles).  
  - **Concrete over abstract**: Participants *do* something (bet on interventions), then see consequences.  
  - **Uses your constraints**: Flipchart for history/theories, index cards for localized knowledge.  
  - **Safe for diverse volunteers**: No real countries, no expertise required.  

  **Final Tip**: Run a test with friends to refine timing. The key is keeping the history identical across rules—double-check your dice rolls! This game won’t end committee debates, but it will ground them in the difference between explaining and changing.
