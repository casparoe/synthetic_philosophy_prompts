prompt: |-
  My friend (who gets most of his politics from twitter and podcasts) tried to explain Moral Foundations Theory to me, and I'm pretty sure he's mixing up what the theory actually says with his own wishful thinking, but I don't know enough to untangle it. He basically said something like this:

  'Okay, so Moral Foundations Theory basically says morality isn’t just one thing; it’s built out of a handful of innate, evolved “foundations” that all humans have: Care/harm, Fairness/cheating, Loyalty/betrayal, Authority/subversion, Sanctity/degradation, and Liberty/oppression. The twist is that liberals are morally “truncated”: they pretty much only feel Care and Fairness (and Liberty when it’s about protecting the little guy from the goverment), so they literally cannot understand things like patriotism, tradition, or sacredness. Conservatives, by contrast, feel all six foundations equally, which gives them a richer, more complete moral psychology. And that’s supposed to tell us something about who is actually right: because conservative morality taps into more of our evolved human nature, right-wing politics is more in tune with the moral truth, or at least liberals are the ones with a defective moral sense. Oh, and get this—he also claims there’s a newer version of the theory with a seventh foundation called “Stewardship,” which is basically a gut-level concern for protecting the environment and future generations. He says libs absolutley ace this one and cons totally ignore it, so once you put Stewardship on the chart, the left is the one with the fuller moral psychology, which means the left is right after all and saving the planet is the highest moral duty.'

  How much of this is fair to the actual theory? Can you go through it and tell me which bits a defender of MFT (or Haidt himself, I guess) would accept, which parts are a distortion or an overstatement, and whether the big conclusion—that the psychology of left and right tells us who is politically or morally right—actually survives once the mistakes are fixed? I keep thinking that even if one side does have a broader set of gut reactions, that wouldn't automatically make their policies correct, but he says that's just me not wanting to admit the data. Also, is the bit about the seventh “Stewardship” foundation something real or is he just making it up? I mean, he defined it as a concern for protecting the environment and future generations, and said libs score way higher on it. Does adding that change anything about whether the theory tells us who is right?
reasoning: |-
  Okay, the user's friend has explained Moral Foundations Theory (MFT) with a clear political spin, and the user is skeptical but lacks the knowledge to debunk it. Let me start by recalling what MFT actually says. Haidt proposed five (later six) foundations: Care, Fairness, Loyalty, Authority, Sanctity, and later Liberty. The friend claims liberals only use Care and Fairness, making them "truncated," while conservatives use all, giving them a richer moral sense. Then the friend adds a seventh foundation, Stewardship, which liberals ace, flipping the argument.

  First, I need to verify the core claims. Haidt's research does show liberals prioritize Care and Fairness, conservatives use all five equally. But "truncated" is Haidt's term, though he clarified it's descriptive, not judgmental. The friend's interpretation that this makes conservatives more complete is a distortion. The theory doesn't assign value; it's about differences.

  Next, the seventh foundation. I remember Haidt added Liberty as the sixth, but Stewardship isn't official. Graham and Haidt mentioned it as a potential addition related to environmental concerns, but it's not part of the standard model. The friend's claim that adding Stewardship makes liberals superior is a fabrication. The user needs to know this isn't established in MFT.

  The big issue is the normative leap: claiming one side's moral foundations make them "right." MFT is descriptive, not prescriptive. Even if conservatives use more foundations, that doesn't validate their policies. Similarly, if liberals care about Stewardship, it doesn't automatically make environmental policies correct. The user is right to question this leap. The friend is misusing the theory to support political biases.

  I should also address the user's underlying concerns. They might feel overwhelmed by data-driven arguments but suspect cherry-picking. The friend's shifting narrative (adding Stewardship to favor liberals) shows confirmation bias. The user needs reassurance that moral psychology doesn't dictate political truth, and that diverse moral foundations can coexist without one being superior.

  Finally, the user might want to discuss this with their friend but needs solid points. Emphasize that MFT describes differences, doesn't judge them, and that Stewardship isn't a formal foundation. Highlight the is-ought fallacy in the friend's argument. The user's intuition that broader gut reactions don't equal correctness is spot on.
answer: |-
  Your skepticism is spot-on—your friend is mixing genuine elements of Moral Foundations Theory (MFT) with significant distortions, wishful thinking, and a fundamental misunderstanding of what the theory can (and cannot) tell us about political morality. Let's break it down point by point, referencing Jonathan Haidt and his collaborators' actual work:

  ### **What Your Friend Got (Mostly) Right**
  1.  **The Foundations:** The core list (Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation) is accurate for the original 5-foundation model. Liberty/Oppression was added later as a 6th foundation based on empirical data.
  2.  **Left-Right Differences:** Research consistently shows that self-identified liberals (in WEIRD societies - Western, Educated, Industrialized, Rich, Democratic) place significantly *higher* weight on Care/Harm and Fairness/Cheating (specifically equality/rights-focused fairness) compared to other foundations. Conservatives, on average, tend to value all six foundations more evenly. Haidt *did* describe this pattern as liberals having a "narrower" or "truncated" moral palate.
  3.  **Liberals and Care/Fairness:** His description of liberals prioritizing Care and Fairness (and Liberty in specific contexts like resisting government overreach) aligns with MFT findings.
  4.  **Conservatives and Broader Foundations:** Conservatives *do* tend to score higher, on average, on Loyalty, Authority, and Sanctity. The claim that this gives them a "richer, more complete" *descriptive* psychology in terms of utilizing more foundations is something Haidt has argued based on the data patterns.

  ### **Where Your Friend Went Off the Rails (Distortions & Overstatements)**
  1.  **"Truncated" ≠ Morally Defective or Unable to Understand:** This is the **biggest distortion**. Haidt uses "truncated" descriptively to mean *uses fewer foundations*, **not** that liberals are morally deficient, stupid, or *literally incapable* of understanding concepts like patriotism or sacredness. He explicitly argues that liberals *understand* these concepts intellectually but don't *feel* them as morally binding gut reactions in the same way conservatives do. MFT is descriptive psychology, *not* a pronouncement on who is "right."
  2.  **Liberals *Do* Feel Liberty:** Your friend understates this. The Liberty foundation is crucial for liberals, especially regarding individual rights, autonomy, and resisting oppression by powerful institutions (including government). It's not *just* about "the little guy vs. government," but it's a core part of their moral matrix.
  3.  **The "Stewardship" Foundation: Mostly Made Up/Misrepresented.**
      *   **It's Not Official:** There is **no** widely accepted, empirically validated "seventh foundation" called "Stewardship" formally added to MFT by Haidt or his core collaborators (Graham, Iyer, etc.).
      *   **Speculation & Research:** Haidt *has* discussed the *possibility* of an "ecological" or "stewardship" foundation emerging in response to modern challenges like climate change. Some researchers (like Jesse Graham) have explored concepts like "Nature/Sustainability" in surveys, finding liberals often score higher. However:
          *   It's **not** considered a core, *innate*, universally-evolved foundation like the original six. Haidt argues the original foundations evolved to solve ancient adaptive problems; a "stewardship" foundation would likely be a modern cultural elaboration *built upon* existing foundations (like extending Care/Harm to future generations/nature or Sanctity applied to the planet).
          *   Calling it a "foundation" in the same sense as the original six overstates the current state of the theory.
      *   **Conservatives Ignore It?** Data shows conservatives *do* care about the environment and future generations, but they often frame it differently – e.g., through lenses of Sanctity (God's creation), Liberty (opposing government overreach in regulation), or Stewardship as a *duty* (Authority/Loyalty to heritage). Their priorities and policy solutions differ.
  4.  **The Normative Leap: "Who is Actually Right" - This is NOT what MFT Says.**
      *   **Is vs. Ought:** This is the **fatal flaw** in your friend's argument. MFT describes *how* people form moral intuitions (the "is"). It **does not** and **cannot** tell us whose moral intuitions are objectively *correct* or which policies are morally superior (the "ought"). This is a classic philosophical error (the naturalistic fallacy).
      *   **"More Evolved" ≠ "Better":** Having intuitions tuned to more foundations evolved in ancestral environments **does not** make conservative positions inherently "more in tune with moral truth." Those foundations evolved for small-group tribal living, not complex modern societies. Slavery, rigid caste systems, and witch hunts also leveraged multiple foundations – that doesn't make them morally right! Similarly, a "broader" moral palate doesn't guarantee wiser or more ethical judgments.
      *   **"Truncated" Isn't Necessarily Bad:** Focusing intensely on reducing harm and promoting fairness can be incredibly powerful drivers of moral progress (e.g., civil rights, abolition). A "narrow" focus can sometimes be more effective for specific moral goals.
      *   **The Stewardship Flip-Flop Reveals the Problem:** Your friend's quick pivot to adding "Stewardship" to "prove" the left is now "right" perfectly illustrates the problem. It's just cherry-picking dimensions to fit a pre-existing political conclusion. If adding a 7th foundation flips the answer, the original claim that "more foundations = morally right" was always shaky.

  ### **What a Defender of MFT (Like Haidt) Would Say**
  1.  **Agree:** Liberals rely more heavily on Care and Fairness (equality); conservatives utilize a broader set more evenly. Liberty is important for both, sometimes in different ways.
  2.  **Clarify:** "Truncated" is a descriptive term about *foundation usage*, not a judgment of moral capacity or intelligence. Liberals *understand* other foundations intellectually but don't *intuitively* weigh them as heavily.
  3.  **Disagree Strongly:** MFT **does not** say conservatives are morally "correct" or have a superior moral sense *because* they use more foundations. Haidt explicitly warns against this normative leap. The theory is about *understanding* moral differences, not *adjudicating* them.
  4.  **On Stewardship:** Would acknowledge research exploring environmental concern but clarify it's not an official 7th foundation in the core evolutionary model. Might discuss how it could be an extension of existing foundations or a potential emerging cultural theme.
  5.  **Core Message:** Haidt's primary goal with MFT is **moral humility** and **understanding across differences**. He argues liberals especially *need* to understand the moral intuitions of conservatives (based on Loyalty, Authority, Sanctity) to communicate effectively and build functional pluralistic societies, *not* to concede that conservatives are objectively "right."

  ### **Does the Big Conclusion Survive?**
  **Absolutely not.** The core argument – that the *number* or *breadth* of moral foundations one intuitively uses determines who is politically or morally "right" – **is completely unsupported by MFT and represents a profound misunderstanding of the theory.**

  *   **Psychology ≠ Truth:** Gut moral reactions (intuitions) are the *starting point* for moral reasoning, not the final verdict. Their existence tells us nothing about their ultimate validity or the correctness of policies derived from them. Policies must be evaluated on their real-world consequences, logical coherence, and alignment with reasoned ethical principles, not just which foundational "buttons" they push.
  *   **Your Instinct is Correct:** You are right to think that "even if one side does have a broader set of gut reactions, that wouldn't automatically make their policies correct." This is the crucial insight your friend is missing. Data on psychological differences *describes* tendencies; it doesn't *prescribe* moral superiority.

  ### **In Summary**
  Your friend grasped the basic descriptive findings of MFT regarding foundation usage differences between liberals and conservatives but then:
  1.  **Grossly exaggerated** the implications ("truncated" = defective, unable to understand).
  2.  **Misrepresented** the status of "Stewardship" as a core seventh foundation.
  3.  **Completely fabricated** the core normative claim that using more foundations makes one side "more in tune with moral truth."
  4.  **Engaged in cherry-picking** by flipping the normative conclusion when adding "Stewardship."

  **MFT is a descriptive psychological theory about *how* moral intuitions form. It is not, and cannot be, a tool for determining *which* moral or political views are objectively correct.** The theory's real value lies in fostering understanding, not declaring winners. Your friend is using a distorted version of MFT to dress up his own political preferences as scientifically validated truths.
