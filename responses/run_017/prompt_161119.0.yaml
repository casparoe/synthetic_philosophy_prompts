prompt: |-
  I'm finishing a novel — a close-third literary book that alternates between a memory clinic and a twenty-year marriage — and my editor has flagged the same problem in three different scenes: she can't tell whether what I've written is a seduction, a bargain, or a consent, and she says the scenes read differently depending on which it is. The cases are these. Marit, fifty-eight, with early-onset Alzheimer's, signs an advance consent form for a research protocol involving lumbar punctures; two years later, still articulate and apparently content, she refuses the same procedure each morning and by lunch has forgotten refusing it. Her son hires a home health aide who tells him she will stop coming unless he raises her hourly rate — a threat she is perfectly entitled to carry out — and he signs the new contract that afternoon. A surgeon mentions the ordinary catalogue of risks to a concert pianist and says nothing about a 0.4% chance of permanently losing fine control in her left fourth finger, judging it immaterial; she consents; it is the single outcome she would have refused the operation for. A character leaves a data-sharing toggle switched on because it shipped switched on, having skimmed the screen. And in the marriage, a woman says yes to her husband out of the wish to keep the evening quiet, to a man who has every reason to want a genuine yes and who is applying no pressure he could name. I don't want to settle any of these by authorial intuition, so before I revise I'd like the specification.

  Write me the desiderata an account of valid consent has to meet: the phenomena it must explain, the cases it must sort, the distinctions it must respect, the empirical or institutional facts it can't contradict — each with the case or consideration that makes it a requirement rather than a taste. I want the distinctions treated as genuine desiderata in their own right: consent as against mere permission, waiver, acquiescence, or authorization; the gap between there being no valid consent and there being consent one nonetheless shouldn't act on; the scope problem, that consent attaches to an act under a description and so can be given to something the consenter would withhold it from under another; whether validity depends on the consenter's reasons at all, or is content-independent in the way a moral power is supposed to be; whether competence is a fixed threshold or slides with the stakes of the particular decision; whether a theory owes third parties an answer they can read off from the outside, since someone has to be able to rely on the consent; and what to say about a consent that persists across a self whose values and psychological continuity are eroding, where the person who agreed and the person who undergoes seem to be, to some degree, different people. Say which requirements are non-negotiable and which are the prejudices of one camp — I suspect at least one thing I've been assuming is a requirement is really a preference. And if some subset is jointly unsatisfiable, say so plainly and show it, because that would itself be the answer I need.

  Two more things. Tell me which single requirement does the most work in knocking out otherwise attractive accounts — the one that, if you give it up, you suddenly can't exclude some view you'd rather exclude. And note that my purpose constrains the theory: I need something that lets a close-limited narration render a character's choice as consensual or not from inside her point of view, while still letting another character, and the reader, tell from the outside whether he was permitted to proceed; if those two demands pull the theory apart, that matters more to me than the tidy version would. Then, briefly — a paragraph or a short table, since this isn't the part I'm paying for — score the three families of view I keep circling: the one that makes consent an internal attitude, the one that makes it a public act you perform by expressing it, and the one that moralizes it, holding consent valid only when the terms and surrounding circumstances are themselves permissible. Keep the weight on the criteria and the cases behind them.
reasoning: |-
  Okay, the user is working on a literary novel and needs a rigorous framework for consent to revise key scenes. They've presented several ethically ambiguous cases and want desiderata that distinguish valid consent from similar concepts. 

  First, I need to parse the core challenge: their editor can't determine whether scenes depict seduction, bargaining, or consent. That's crucial because each interpretation radically changes character dynamics. The user isn't seeking moral judgments but analytical tools—they explicitly reject "authorial intuition." 

  Looking at their cases: Marit's fluctuating consent to medical procedures, the aide's contractual renegotiation, the surgeon's incomplete disclosure, passive data-sharing, and marital acquiescence. These cluster around power asymmetries, information gaps, and identity persistence. The user also flags theoretical tensions: internal attitude vs. public performance, competence thresholds, and third-party reliability. 

  The real depth lies in their unstated needs. As a literary writer, they need concepts that work dramatically—visible enough for readers to debate, intimate enough for close-third POV. They're likely frustrated by philosophical abstractions that don't translate to human behavior. The Alzheimer's case suggests particular interest in how identity fractures affect moral continuity. 

  I'll structure the desiderata by: 
  1. Non-negotiable requirements (voluntariness, competence) 
  2. Contested zones (scope problems, reason-dependence) 
  3. Jointly unsatisfiable demands (e.g., internal perspective vs. third-party reliability) 
  The "scope problem" feels most urgent—it directly explains why Marit's consent fails while the pianist's might stand. 

  For theory scoring, I'm wary of moralized accounts—they'd flatten their nuanced marital scene into simple coercion. Expression-based theories serve courtroom clarity but bleed internal conflict. Hybrid approaches seem strongest here. 

  Biggest red flag: any theory ignoring the time-sliced self. If competence is fixed, Marit's son couldn't ethically honor prior consent. But sliding thresholds risk paternalism. This tension must be surfaced—it's their novel's heartbeat.
answer: |-
  Here is a specification of desiderata for an account of valid consent, grounded in your cases and constraints, designed to resolve the ambiguities flagged by your editor. The focus is on *what the theory must explain and distinguish*, not on advocating a specific solution.

  **Core Desiderata (Non-Negotiable):**

  1.  **Distinguish Consent from Acquiescence/Submission:**
      *   **Requirement:** Must explain why Marit's daily refusal overridden by forgetfulness isn't consent, and why the wife's "yes" to keep the peace differs from a genuine "yes" desired by her husband.
      *   **Phenomenon:** The presence of internal reluctance, pressure (even unspoken), or lack of positive engagement that negates voluntariness, even if no overt coercion exists. Consent requires a positive act of will, not mere absence of resistance.
      *   **Case Driver:** The marriage scene ("keep the evening quiet") and Marit's daily refusals (ignored due to forgetting).

  2.  **Address Competence & Its Dynamics:**
      *   **Requirement:** Must handle fluctuating competence (Marit signing vs. refusing) and the sliding scale relative to decision stakes/consequences.
      *   **Phenomenon:** Competence isn't binary or static. It depends on the *specific decision* at the *specific time*. Signing a complex research form requires different competence than refusing a daily procedure. High stakes (pianist's finger) demand higher competence/understanding.
      *   **Case Driver:** Marit (signing form vs. daily refusal) and the Pianist (high-stakes, highly specific risk).
      *   **Non-Negotiable Aspect:** Competence is a *threshold requirement* for validity. An act lacking competence isn't consent. *Where* that threshold sits for a given decision is contested.

  3.  **Respect the Scope Problem (Act Under a Description):**
      *   **Requirement:** Must explain how consent to "surgery" is invalid if given without knowledge of the *specific, material risk* to the fourth finger, or how data-sharing consent via a skimmed toggle differs from informed agreement.
      *   **Phenomenon:** Consent is given *to X as understood/described*. If the consenter misunderstands X (data scope) or lacks a material fact defining X (finger risk), consent is not valid *for that X*. The description matters.
      *   **Case Driver:** The Surgeon/Pianist and Data Toggle scenes. This is crucial for distinguishing "bargain" (understood terms) from invalid consent (misunderstood terms).

  4.  **Distinguish Valid Consent from Permissible Action (The Gap):**
      *   **Requirement:** Must accommodate situations where consent is *invalid* (e.g., due to lack of understanding) but the actor might still be *permitted* or justified in proceeding (e.g., surgeon acting on apparent consent, son honoring Marit's signed directive despite current refusal). Conversely, valid consent doesn't *always* make action permissible (e.g., consent to murder).
      *   **Phenomenon:** Validity concerns the *consenter's act*. Permissibility concerns the *actor's justification*, which may rely on *apparent* consent, institutional rules, necessity, or other factors *besides* actual valid consent.
      *   **Case Driver:** Surgeon (acting on apparent consent vs. validity), Son honoring signed directive vs. daily refusal, Aide's entitled threat/contract (valid consent *and* permissible action).

  5.  **Provide Externally Reliable Signals (Third-Party Reliance):**
      *   **Requirement:** Must acknowledge that institutions and individuals (surgeon, son, data company) need reasonably discernible signals (signatures, toggles, verbal "yes") to rely upon, even if internal validity is complex.
      *   **Phenomenon:** Social coordination requires public acts. Validity cannot be *purely* a hidden mental state.
      *   **Case Driver:** Surgeon relying on consent form, Son relying on signed directive, Data company relying on toggle setting, Aide relying on signed contract. Editor's confusion stems partly from unclear external signals.

  **Key Distinctions (Desiderata in Own Right):**

  6.  **Consent vs. Bargain vs. Waiver/Authorization:**
      *   **Requirement:** Must distinguish Marit signing the form (consent/authorization for research) from the Son signing the Aide's contract (accepting a bargain/threat). Must distinguish the Pianist consenting to surgery from waiving a known risk (she didn't know *this* risk).
      *   **Phenomenon:** Consent grants *permission for another's act*. A bargain creates *reciprocal obligations*. Waiver relinquishes a *known right*. Authorization delegates *power to act*.
      *   **Case Driver:** Aide's contract (bargain under threat), Surgeon/Pianist (consent lacking material info ≠ waiver).

  7.  **Voluntariness vs. Coercion (Including Subtle Pressures):**
      *   **Requirement:** Must distinguish the Aide's *entitled threat* (creating a bargain) from *illegitimate coercion* (which would invalidate consent). Must capture the *non-coercive but pressuring* dynamic in the marriage scene.
      *   **Phenomenon:** Voluntariness is undermined by threats (illegitimate), overwhelming offers, or situational pressures that significantly compromise free choice. "Entitled threats" create permissible pressure for bargaining, not necessarily invalidating consent.
      *   **Case Driver:** Aide (entitled threat = valid bargain), Marriage (subtle pressure = possible invalid consent).

  8.  **The Persisting Self Problem:**
      *   **Requirement:** Must address whether Marit's signed advance consent binds her later self who refuses, given cognitive discontinuity. Does the "person" who consented still exist meaningfully?
      *   **Phenomenon:** When identity/perspective changes significantly (especially predictably, as with dementia), honoring prior consent can conflict with respecting the current self's will.
      *   **Case Driver:** Marit's advance directive vs. daily refusals. Core tension between autonomy-over-time and present-moment will.
      *   **Contested:** This is a major frontier. A theory *must* take a stance, but the *best* stance is debated (precedent autonomy vs. current experiential interests).

  **Contested Terrain (Potential Prejudices):**

  9.  **Dependence on Consenter's Reasons:**
      *   **Requirement:** Must clarify if the wife's reason ("keep the evening quiet") invalidates her "yes," or if only the external act matters. Must address if Marit's *understanding* of the LP when signing matters more than her *reasons* for signing.
      *   **Phenomenon:** Is consent valid if the act/description is understood, regardless of *why* one consents (e.g., bribery, altruism, exhaustion)? Or do certain reasons (extreme fear, false beliefs about consequences) undermine validity?
      *   **Potential Preference:** Insisting that *only* "good" or "authentic" reasons validate consent moralizes the concept. A minimalist view sees understanding + voluntary expression as sufficient, regardless of reasons (content-independence). Your marriage scene highlights this tension.
      *   **Case Driver:** Marriage scene ("why" she says yes), Marit's reason for signing the initial form.

  10. **Fixed vs. Sliding Competence Threshold:**
      *   **Requirement:** Must specify how competence is judged relative to the decision's complexity/stakes.
      *   **Phenomenon:** The level of understanding/ability required to consent to a routine blood test vs. experimental neurosurgery differs. Does the threshold slide, or is it fixed, making some high-stakes decisions inherently non-consentable by some?
      *   **Potential Preference:** A strict fixed threshold (often legally pragmatist) can be paternalistic. A purely sliding threshold can be vague and difficult to operationalize externally. Your Pianist case demands a high threshold; the data toggle might require less.

  **The Crucial Tension & The Workhorse Desideratum:**

  *   **Joint Unsatisfiability:** The core tension is between **Internal Validity (POV)** (understanding, genuine will, competence-at-the-moment, reasons) and **External Reliance (3rd Party/Reader)** (clear signals, apparent consent, stability, institutional feasibility). *Perfectly satisfying both simultaneously is likely impossible.* A theory must prioritize or find a compromise.
  *   **The Workhorse Desideratum:** **The Scope Problem (Act Under a Description)** does the most work knocking out attractive but inadequate accounts.
      *   *Knocks Out Pure Internal Attitude Views:* If consent is just an internal "yes," how can we ever know the *description* the consenter assented to? The Pianist internally consented to "safe surgery," not "surgery risking my career." A pure internal view struggles with scope and external reliability.
      *   *Knocks Out Overly Moralized Views:* If consent is only valid when the *terms* are fair/permissible, the Aide's contract (entitled but harsh threat) might be seen as invalid consent rather than a valid but tough bargain. It conflates validity with the morality of the proposal.
      *   *Knocks Out Crude Expression-Only Views:* If consent is just saying "yes" or signing, it fails the Scope Problem (Pianist signed but lacked material info) and can't distinguish valid consent from mere submission (Marriage scene).
      *   *Why it's the Workhorse:* Giving up on Scope means you can't explain why the Pianist's consent feels defective or why the Data Toggle isn't real agreement. It's fundamental to the ambiguity your editor identified.

  **Theory Scoring for Your Purpose:**

  | Theory Family          | Internal Attitude                           | Expressive/Performative Act                   | Moralized                                     |
  | :--------------------- | :------------------------------------------ | :-------------------------------------------- | :-------------------------------------------- |
  | **POV Rendering**      | **STRONG:** Naturally focalizes internal state, reasons, doubts. Good for marriage scene nuance. | **WEAK:** Focuses on observable act. Struggle to show internal mismatch (Pianist, Marriage). | **MIXED:** Can explore character's moral evaluation, but risks overriding *their* internal perspective with narrator's judgment. |
  | **External Reliance**  | **WEAK:** Unobservable. Creates ambiguity (Editor's problem). Son/Surgeon can't access it. | **STRONG:** Clear signals (signature, verbal yes, toggle). Solves reliance for Son/Aide/Surgeon/Data Co. | **MEDIUM:** May provide clear "invalid" flags if terms immoral, but ambiguity remains in subtler cases (Marriage, Bargain). |
  | **Handles Scope?**     | **POOR:** Hard to specify the *description* consented to internally. Pianist problem acute. | **MEDIUM:** Relies on shared understanding of the act described when consent expressed. Scope depends on context/communication. | **MEDIUM:** Can incorporate scope via "material terms," but risks conflating scope with term morality. |
  | **Handles Competence?** | **STRONG:** Naturally focuses on actual understanding/ability at the moment. Good for Marit. | **WEAK:** Focuses on expression. May validate expression by apparently competent person even if internal state is confused (early Marit refusal?). | **MIXED:** May impose competence requirements based on stakes, but competence assessment is external/rules-based. |
  | **Handles Persisting Self?** | **MIXED:** Can respect current internal state (refusing Marit), but struggles with binding prior self. | **STRONG:** Prior expression (directive) is a clear, reliable act. Favors honoring it. | **MIXED:** May weigh current well-being against prior wishes morally. |
  | **Fits Cases**         | Marriage (nuance), Marit (current refusal) | Aide (contract), Data Toggle (expression), Surgeon (reliance), Advance Directive (expression) | Might condemn Surgeon's omission, Aide's pressure, Data Co's design |
  | **Overall for Novel**  | Best for interiority, worst for clarity.    | Best for external clarity, worst for interior mismatch. | Risks imposing external judgment on character POV. |

  **Recommendation for Revision:** You need a **hybrid model leaning expressive but with strong internal conditions for validity**. This respects the need for external clarity (reliance) while allowing the narration to *show* when the internal conditions (understanding, voluntariness under the *correct* description, competence) are unmet, creating dramatic irony (Pianist, Marriage, Data Toggle) or tragedy (Marit's daily plight vs. the directive). Focus on:
  1.  **Clarifying the "Act Described":** In each scene, ensure the narration (from the POV character's knowledge) reveals what *they* understand themselves to be consenting to/bargaining for.
  2.  **Signaling Voluntariness/Submission:** Use internal monologue or subtle action in the marriage scene to distinguish genuine desire from weary acquiescence. For Marit's daily refusal, show the *act* of refusal being ignored.
  3.  **Anchoring Competence:** Show Marit's lucidity when signing vs. confusion when refusing. Highlight the Pianist's specific questions (or lack thereof) to signal understanding (or its lack) of *her* specific risk.
  4.  **Leverage the Gap:** The Son *relies* on the signed directive (permissible action based on apparent consent/authorization) but the narration can acknowledge the tension with her daily refusals (invalid consent at that moment). The Surgeon *relies* on the form, but the narration can reveal the omitted risk.

  This approach maximizes the tension your editor senses (is it consent or not?) by making the *internal* validity conditions visible through the close POV, while the *external* expressions/permissible actions remain clear to other characters and the reader. The ambiguity becomes the point, rooted in the theory's inherent tensions.
