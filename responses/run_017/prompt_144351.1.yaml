prompt: |-
  Im applying for a small four-month research grant and need a one-page proposal. Ive got a half-formed idea I want sharpened, not replaced. The topic is process-based vs outcome-based supervision of AI systems — reward the final answer versus reward the reasoning steps, process reward models and all that.

  The usual comparisons ask which one buys more performance per unit of human feedback, and I think that framing buries the interesting question. My hunch: neither scheme eliminates the problem of credit assignment, they just relocate it, and every supervision scheme bottoms out in some judgment that is not itself supervised by the same standard. Call it the terminal judgment problem. A process supervisor grading step 3 either is implicitly predicting whether step 3 leads to a good final answer — outcome supervision in disguise, just with a short horizon — or is applying a local notion of step quality defined without reference to outcomes, in which case it can reward reasoning that is locally impeccable and globally useless, and it gets Goodharted by models that learn to emit legible-looking reasoning. On this view process supervision is the short-horizon end of a continuum, and the real question is where the optimal horizon sits and whether it is ever one step.

  So the proposal should: state one precise question that has a determinate answer (mine is something like: is there a class of tasks on which step-level correctness is definable without appeal to final outcomes, and is that class the same as the class where process supervision beat outcome supervision?); say why the standard ways of arguing this leave it open; and give a method that makes progress in four months with no real compute budget — I was imagining a small family of synthetic tasks varying along one dimension, say how decomposable the task is or whether the intermediate artifacts are checkable on their own, used as a testbed.

  Two more things I want separated, because I think people run them together: supervising the process because the process is what we care about, versus supervising it as a proxy for better outcomes. Those fail in different ways and the proposal should say how. Then give me what a negative result looks like — what finding would make me say the whole frame was wrong — what the deliverable would be for someone actually deciding how to spend a limited supervision budget, and an honest scope section. In particular: does this just collapse into the existing argument about whether chain-of-thought reasoning is faithful to the model's actual computation, and if so what would I do to stop it being that debate again? Dont bother with citations or a literature review, I'll fill those in myself.
reasoning: |-
  We are to design a one-page research proposal on the topic of process-based vs outcome-based supervision for AI systems. The core idea is that both supervision schemes relocate but do not eliminate the credit assignment problem, and that every supervision scheme relies on a "terminal judgment" that is not itself supervised by the same standard.

  The proposal must:
  1. State one precise research question with a determinate answer.
  2. Explain why existing arguments leave the question open.
  3. Propose a method that can be executed in four months with no significant compute budget, using synthetic tasks.
  4. Separate two distinct motivations for process supervision: caring about the process itself vs. using it as a proxy for outcomes, and explain how they fail differently.
  5. Describe what a negative result would look like.
  6. Specify the deliverable for someone with a limited supervision budget.
  7. Include an honest scope section, addressing whether this collapses into the debate about chain-of-thought faithfulness and how to avoid that.

  Let's break down:

  **Precise Research Question:**
  The user suggests: "Is there a class of tasks on which step-level correctness is definable without appeal to final outcomes, and is that class the same as the class where process supervision beat outcome supervision?"

  We can refine this to be more testable:

  "Does the advantage of process supervision over outcome supervision on a task depend on the degree to which intermediate steps can be evaluated without reference to the final outcome, and if so, what is the nature of that dependence?"

  But we want a determinate answer. Alternatively:

  "For which tasks (characterized by the decomposability and independent checkability of intermediate steps) does process supervision yield better outcomes than outcome supervision, and is this advantage explained by the ability to define step-level correctness independently of the final outcome?"

  However, the user's core idea is about the horizon of supervision and the terminal judgment. So we might focus on the horizon:

  "What is the optimal supervision horizon (from single-step to full outcome) for tasks of varying decomposability and intermediate step checkability, and under what conditions is a one-step horizon optimal?"

  But we need to connect to the terminal judgment. Alternatively:

  "Does the performance of supervision at a given horizon (i.e., rewarding after k steps) peak at an intermediate horizon, and does this peak horizon depend on the task's decomposability and the independent checkability of its steps?"

  But we also want to test the idea that step-level supervision is outcome supervision in disguise (short horizon) or if it can be independent.

  Let me try to capture both:

  "To what extent does the advantage of process supervision over outcome supervision rely on the ability to independently evaluate intermediate steps (without using the final outcome), and how does this advantage change with the task's decomposability?"

  But we need a more focused question. The user also wants to know if the class of tasks where step-level correctness is independently definable is the same as where process supervision beats outcome supervision.

  So:

  "Is the set of tasks for which step-level correctness can be defined without reference to the final outcome the same as the set of tasks for which process supervision outperforms outcome supervision?"

  This is a clear yes/no question, but we might need to operationalize "defined without reference to the final outcome". We can define it as: the step-level evaluation function does not use the final outcome (or any future information) and is based solely on the step and the input up to that point.

  But note: the user's hunch is that if the step-level evaluation is independent, then it might be Goodharted (because it's not aligned with the outcome). So we might expect that for tasks where steps can be independently evaluated, process supervision might be better only if the independent evaluation is aligned with the outcome? This is complex.

  Alternatively, we can have:

  "Does process supervision outperform outcome supervision only on tasks where intermediate steps can be evaluated independently and correctly (i.e., the independent evaluation correlates with the true contribution to the outcome)?"

  But we are getting into the weeds.

  Let me propose:

  **Research Question:**
  "On tasks with varying degrees of decomposability and independently checkable intermediate steps, does the performance gain of process supervision over outcome supervision depend on the alignment between independent step-level evaluations and the final outcome?"

  This is still a bit vague. We can make it more testable:

  "For a set of synthetic tasks that vary in the decomposability of the task and the checkability of intermediate steps, what is the relationship between (a) the degree to which step-level evaluations (without using the final outcome) predict the final outcome and (b) the performance gain of process supervision over outcome supervision?"

  This seems measurable.

  **Why existing arguments leave it open:**
  The standard comparison focuses on performance per unit of human feedback, without examining the underlying structure of the task and the nature of the step-level evaluations. They do not vary the task properties to see when and why process supervision works.

  **Method:**
  - Design a family of synthetic tasks (to avoid high compute and control task properties) that vary along two dimensions:
    1. Decomposability: How naturally the task breaks into steps (e.g., from highly sequential to holistic).
    2. Independent checkability: Whether each step can be evaluated without knowing the final outcome (e.g., by having a clear step-level standard).

  - For each task, we can define:
    - The ground-truth process (so we can generate labeled data for training and evaluation).
    - A way to simulate an agent (a simple model, like a neural network or even a decision tree) that learns via reinforcement learning with different supervision schemes.

  - Supervision schemes:
    - Outcome supervision: reward only at the end based on the final outcome.
    - Process supervision: reward after each step based on the step's correctness (using the ground-truth step-level evaluation, but without using the final outcome).

  - We also need a baseline of no intermediate rewards (outcome) vs. step rewards (process).

  - We will train the agent on each task with each supervision scheme and measure the final outcome performance.

  - We will also measure the correlation between the step-level evaluations (which are independent of the final outcome) and the actual contribution of the step to the final outcome (which we know from the ground truth). This is the alignment measure.

  - Then, we can see for which tasks (which levels of decomposability and independent checkability) process supervision beats outcome supervision, and how that relates to the alignment measure.

  **Separating the two motivations for process supervision:**
  1. **Process as the goal:** We care about the reasoning process itself (e.g., for transparency, safety, or educational purposes). In this case, even if the process is not leading to a good outcome, we might still want to reward it. Failure mode: the model produces a process that looks good (by the independent standard) but leads to bad outcomes.

  2. **Process as a proxy for outcomes:** We use process supervision because we believe it will lead to better outcomes (e.g., by mitigating reward hacking). Failure mode: if the step-level evaluations are not aligned with the outcome, then rewarding them might lead to worse outcomes.

  In our synthetic tasks, we can simulate both:
  - For the first motivation, we might define a step-level evaluation that is independent and then measure how well the model does on the process (step-level) metric, but also check if that harms the outcome.
  - For the second, we are measuring the outcome.

  **Negative Result:**
  A negative result would be that the advantage of process supervision does not correlate with the independent checkability or the alignment between step evaluations and the outcome. For example, if we find that process supervision always wins (or never wins) regardless of the task properties, that would challenge the hypothesis that the task structure matters. Also, if we find that the optimal horizon is always one step (or always the full outcome) regardless of the task, that would challenge the continuum idea.

  **Deliverable:**
  A decision framework for practitioners: a set of task characteristics (decomposability and independent checkability) that predict when process supervision is likely to yield better outcomes than outcome supervision, along with a method to estimate the alignment between step-level evaluations and the outcome.

  **Scope:**
  We are using synthetic tasks to control the variables and avoid the complexities of real-world data and large models. We are not addressing the faithfulness of chain-of-thought reasoning because we are simulating the agent's reasoning and we have ground truth. We are not using black-box models but a transparent agent so we can observe the actual computation. This avoids the faithfulness debate because we know the true process.

  **Proposal Structure:**

  **Title:** The Terminal Judgment Problem in AI Supervision: When Does Process Supervision Outperform Outcome Supervision?

  **Research Question:** 
  For tasks with varying decomposability and independent checkability of intermediate steps, does the performance advantage of process supervision over outcome supervision depend on the alignment between independent step-level evaluations and the final outcome?

  **Background and Gap:**
  Current comparisons between process and outcome supervision focus on efficiency (performance per human feedback). This overlooks the fundamental credit assignment problem and the terminal judgment: every supervision scheme ultimately relies on an unsupervised judgment. Process supervision either implicitly predicts the outcome (short-horizon outcome supervision) or uses an independent step-quality measure, risking Goodharting if misaligned. We hypothesize that the advantage of process supervision depends on the task's structure and the alignment of step-level evaluations with outcomes.

  **Method:**
  - Design synthetic tasks that vary along:
    - Decomposability (e.g., from linear chains to tasks requiring global coordination).
    - Independent checkability (e.g., each step has a clear criterion independent of the outcome vs. steps that can only be judged in context).
  - For each task, define ground-truth step evaluations and final outcome.
  - Train a simple agent (e.g., a small neural network) using RL with:
    - Outcome supervision: reward only at the end.
    - Process supervision: reward after each step based on independent step evaluation.
  - Measure:
    - Final outcome performance for each scheme.
    - Alignment: correlation between independent step evaluations and the step's true contribution to the outcome (using ground truth).
  - Analyze: For which task properties does process supervision outperform outcome supervision? How does this relate to the alignment measure?

  **Two Motivations and Their Failure Modes:**
  1. **Process as the goal:** We directly optimize step-level quality. Failure: good process metrics but bad outcomes (if step evaluations are misaligned).
  2. **Process as proxy for outcomes:** We use step rewards to improve outcomes. Failure: if step evaluations are misaligned, we get worse outcomes than outcome supervision.

  In the experiment, we can measure both the step-level performance (for motivation 1) and the outcome (for motivation 2) under both schemes.

  **Negative Result:**
  If we find that process supervision never outperforms outcome supervision even when alignment is high, or that the advantage is not explained by alignment and task properties, this would challenge the hypothesis.

  **Deliverable:**
  A chart or formula mapping task properties (decomposability and independent checkability) to the expected relative performance of process vs. outcome supervision, enabling practitioners to choose the supervision horizon based on task characteristics.

  **Scope and Limitations:**
  - Synthetic tasks only; real-world tasks may have more complexity.
  - We assume the step-level evaluations are available (in practice, they require human or automated checks).
  - We avoid the faithfulness debate by using a transparent agent and ground-truth process, focusing on the supervision signal's effect.
  - We do not address the cost of obtaining step-level feedback (efficiency), only the performance.

  **Timeline:**
  - Month 1: Design and implement synthetic tasks and agent.
  - Month 2: Run experiments for outcome supervision.
  - Month 3: Run experiments for process supervision and compute alignment.
  - Month 4: Analyze results and write up.

  **No compute budget needed:** The experiments use small-scale simulations.

  Let's write the proposal in one page.
answer: |-
  ### Research Proposal: The Terminal Judgment Problem in AI Supervision  

  **Title:** Task Decomposability and the Optimal Horizon for AI Supervision: Testing the Limits of Process vs. Outcome Rewards  

  **Research Question:**  
  Is the performance advantage of process supervision (rewarding reasoning steps) over outcome supervision (rewarding final answers) on a task explained by the degree to which intermediate steps can be evaluated *without* reference to the final outcome, and does this advantage disappear when step-level evaluations are misaligned with the outcome?  

  **Hypothesis:**  
  Process supervision relocates—but does not eliminate—credit assignment to a "terminal judgment" (e.g., step-level evaluations). It outperforms outcome supervision only when:  
  1. Intermediate steps are independently checkable (e.g., definable without future outcomes), *and*  
  2. These step-level evaluations strongly correlate with the true contribution to the final outcome.  
  When these conditions fail, process supervision either collapses into short-horizon outcome supervision (if step rewards implicitly predict outcomes) or incentivizes "legible but useless" reasoning (if step evaluations are misaligned).  

  **Why Existing Framing Leaves This Open:**  
  Current literature focuses narrowly on *efficiency* (performance per human feedback unit), ignoring how task structure (decomposability, step checkability) determines the viability of process supervision. This overlooks the terminal judgment problem: all supervision bottoms out in unsupervised judgments. Efficiency studies assume step evaluations are inherently reliable, neglecting alignment with outcomes.  

  **Method: Synthetic Task Testbed (4 Months, Low Compute)**  
  1. **Task Design:**  
     - Generate a family of small-scale synthetic tasks (e.g., puzzle-solving, graph traversal) varying along two axes:  
       - **Decomposability:** High (e.g., arithmetic: steps are independent) vs. low (e.g., holistic optimization: steps are interdependent).  
       - **Step checkability:** High (e.g., intermediate outputs have ground-truth labels) vs. low (e.g., steps require outcome context for evaluation).  
     - *Example:* A "pathfinding" task where decomposability is controlled by maze complexity, and checkability by whether step validity (e.g., "is this move legal?") is predefinable without knowing the endpoint.  

  2. **Agent Training:**  
     - Use lightweight RL agents (e.g., Q-learning or tiny transformers) trained with:  
       - **Outcome supervision:** Reward only for final correctness.  
       - **Process supervision:** Reward each step using synthetic "oracle" evaluations (simulating human feedback).  
     - **Key variation:** For process supervision, decouple step evaluations from outcomes in high-checkability tasks (e.g., reward valid arithmetic operations regardless of final answer) versus couple them in low-checkability tasks (e.g., reward steps only if they lead to the outcome).  

  3. **Alignment Measurement:**  
     - Quantify "step-outcome alignment" as the correlation between independent step rewards (without outcome knowledge) and the ground-truth contribution to the outcome.  
     - Compare performance (final outcome accuracy) between supervision schemes across task types.  

  **Separating Supervision Motivations:**  
  - **Process as the goal** (e.g., for interpretability): Fails when step evaluations are misaligned with outcomes, yielding high step-wise rewards but incorrect results (e.g., a valid-but-irrelevant equation).  
  - **Process as a proxy for outcomes** (e.g., to reduce reward hacking): Fails when step evaluations are non-predictive of outcomes, causing the agent to exploit "legible" but inefficient processes (e.g., verbose, correct-seeming reasoning that reaches wrong answers).  
  *Experiments will measure failure modes separately: step-wise accuracy (for "process as goal") and final accuracy (for "process as proxy").*  

  **Negative Result:**  
  If process supervision *never* outperforms outcome supervision—even when steps are independently checkable and aligned—the core hypothesis fails. This suggests the terminal judgment problem is intractable, and process rewards are always just short-horizon outcome supervision.  

  **Deliverable for Practitioners:**  
  A decision framework (flowchart or heuristic) mapping task properties to the optimal supervision strategy:  
  - **Use process supervision** if tasks are highly decomposable *and* steps are independently checkable with high alignment.  
  - **Use outcome supervision** otherwise (e.g., for non-decomposable tasks or when step evaluations are unreliable).  

  **Scope and Limitations:**  
  - **Not the faithfulness debate:** We avoid chain-of-thought faithfulness issues by using synthetic tasks with ground-truth reasoning traces (no black-box models). The agent’s "reasoning" is fully observable, isolating supervision effects from interpretability concerns.  
  - **Constraints:** Synthetic tasks limit real-world generalization; no human feedback costs are modeled. Extensions would require real-world tasks but are beyond this grant.  
  - **Compute:** All experiments run on consumer hardware (no GPU clusters needed).  

  **Timeline:**  
  - Month 1: Task design and agent implementation.  
  - Month 2: Outcome supervision experiments.  
  - Month 3: Process supervision experiments and alignment analysis.  
  - Month 4: Validation, negative-result testing, and framework development.  

  **Outcome:** Either validation of the alignment hypothesis or a robust negative result that reframes the supervision debate.
