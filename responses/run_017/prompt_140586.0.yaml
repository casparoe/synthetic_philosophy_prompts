  The committee faces real dilemmas: they must evaluate field researchers where luck plays a massive role (weather, accidents, unpredictable events), yet their decisions significantly impact careers. Their current process seems reactive and inconsistent - 90 minutes per case with mixed committee expertise, producing high-stakes written judgments. The user wants a systematic procedure to separate controllable decisions from uncontrollable outcomes.

  They've outlined six specific requirements for this procedure:
  1) Split assessment between pre-outcome decision quality and actual outcomes
  2) Replace counterfactuals with outcome sensitivity ranges
  3) Strict rules for when outcomes can indicate decision quality
  4) Non-punitive protocols for agent-regret situations
  5) Rules for evaluating multiple failures
  6) Explicit stop rules when judgments become about character rather than decisions

  The three test cases perfectly illustrate the tensions:
  1) Identical risky decisions with opposite outcomes due to weather
  2) Rule-breaker with success vs rule-follower with accident
  3) "Best possible" decision still causing ecological harm

  Underlying this is their fear that philosophical rigor might paralyze practical judgment. They're intellectually honest enough to want uncomfortable answers (case 3) but pragmatic enough to demand clear limitations (can't assess character, needs contemporaneous records).

  The challenge is creating something that:
  - Functions as a real committee workflow
  - Captures philosophical distinctions without jargon
  - Produces auditable decisions
  - Protects candidates from unfair outcome bias
  - Satisfies skeptical committee members (including one hostile to "excuses")

  Most importantly, it must prevent what they call "moral luck administered on a budget" - their haunting description of how committees accidentally punish bad luck and reward good luck while pretending to judge merit.
answer: |-
  Below is a procedural framework designed to address moral luck in your committee's decisions, structured as an executable checklist. It separates *decision assessment* (pre-outcome) from *outcome assessment*, forces explicit reasoning, and contains built-in stop rules. The procedure assumes case files include: research proposal, risk assessment, contemporaneous field notes, outcome report, and supervisor statements.

  ---

  ### **Field Assessment Procedure for Moral Luck Mitigation**  
  *(To be completed per case in sequence; halt if any answer triggers a stop rule)*  

  **1. DECISION RECONSTRUCTION**  
     *Task: Reconstruct the decision as it stood before outcomes were known, using only contemporaneous records (proposal, pre-field notes, permits, equipment logs).*  
     - **Q1.1:** What was the explicitly stated goal and methodology?  
     - **Q1.2:** What foreseeable risks were documented? What mitigation was planned?  
     - **Q1.3:** Was the decision compliant with society standards (ethics, safety, permits)? *[Yes/No, with citations]*  
     - **STOP RULE A:** If insufficient contemporaneous records exist to reconstruct the decision, minute: *"Judgment suspended; incomplete decision record."* Proceed only if reconstruction is ≥80% achievable.  

  **2. PRE-OUTCOME DECISION ASSESSMENT**  
     *Task: Judge the decision’s quality based solely on information available pre-outcome.*  
     - **Q2.1:** Rate decision defensibility:  
       - **A (Optimal):** Exceeded standards; innovative mitigation of foreseeable risks.  
       - **B (Defensible):** Met standards; addressed major foreseeable risks.  
       - **C (Marginal):** Missed material standards/foreseeable risks.  
       - **D (Indefensible):** Ignored critical standards/risks.  
     - **Q2.2:** What unforeseeable risks (if any) were acknowledged? *[List]*  

  **3. OUTCOME SENSITIVITY RANGE**  
     *Task: Define the outcome range that would NOT alter the Q2.1 rating.*  
     - **Q3.1:** For the decision in Q2.1, what outcomes would leave its rating unchanged? *[State range, e.g., "Data yield: 0% to 100% if storms destroyed equipment or seabirds were absent"]*  
     - **Q3.2:** Width of range:  
       - **Broad:** Rating insensitive to outcomes → Outcome-independent decision.  
       - **Narrow:** Rating highly outcome-sensitive → Decision assessment contaminated by luck.  
     - **Minute Requirement:** *"The decision was [A/B/C/D]. This rating holds across [broad/narrow] outcome ranges, specifically: [Q3.1 answer]."*  

  **4. OUTCOME AS EVIDENCE RULE**  
     *Task: Determine if outcome informs decision quality (not moral judgment).*  
     - **Q4.1:** Does the outcome *directly contradict* pre-stated expectations? (e.g., predicted risk occurred despite mitigation).  
     - **Q4.2:** Is the outcome *statistically anomalous* given the risk assessment? (e.g., 95% success probability but failed).  
     - **IF YES to Q4.1 or Q4.2:** Outcome may be used to *downgrade* Q2.1 rating.  
     - **IF NO:** Outcome is inadmissible for decision assessment.  
     - **Minute Requirement:** *"Outcome [is/is not] evidence for decision quality because [reason]."*  

  **5. AGENT-REGRET PROTOCOL**  
     *Task: If harm occurred but decision was defensible (Q2.1 = A/B), mandate non-punitive response.*  
     - **Action Required:**  
       - Candidate submits a **public incident report** to society archives.  
       - Candidate **leads repair/outreach** (e.g., coordinates habitat restoration, informs local community).  
     - **Minute Requirement:** *"No fault assigned. Candidate must: [Actions]. These are reparative, not sanctions."*  

  **6. SEQUENTIAL FAILURE RULE**  
     *Task: For candidates with ≥2 prior failures.*  
     - **Q6.1:** Were prior decisions rated **defensible (A/B)**?  
     - **Q6.2:** Is there a **pattern of unmitigated risk** across cases?  
     - **IF Q6.1 = YES and Q6.2 = NO:** Bad luck. No penalty.  
     - **IF Q6.2 = YES:** Re-rate prior decisions via Q2.1; cumulative pattern indicates recklessness.  

  **7. CHARACTER STOP RULE**  
     *Task: Halt if judgment hinges on inherent traits.*  
     - **STOP RULE B:** If the committee’s rationale implies "reckless temperament" or "incompetence" without specific decision failures, minute: *"Judgment relies on character assessment beyond procedure scope."* Decision deferred to full council.  

  **8. FINAL VERDICT & RESOURCE ALLOCATION**  
     - **Prize:** Requires Q2.1 = **A** + high-impact outcome. *Money follows outcome.*  
     - **Recovery Grant:** Requires Q2.1 = **A/B** + outcome outside sensitivity range (Q3.1) + harm from bad luck.  
     - **No Award/Grant:** Q2.1 = **C/D** OR avoidable harm (Q4.1=YES).  
     - **Minute Requirement:** *"Resources allocated based on: [Decision/Outcome/Both] because [Q8 rationale]."*  

  ---

  ### **Application to Test Cases**  
  **Case 1: Identical Decisions, Opposite Outcomes**  
  - **Q2.1:** Both A (optimal risk-taking for science).  
  - **Q3.1:** Range broad (0-100% data; weather/rockfalls unforeseeable).  
  - **Prize:** Goes to successful candidate (outcome-dependent award).  
  - **Recovery Grant:** Goes to failed candidate (bad luck within range).  
  - **Minute:** *"Prize follows outcome; grant follows blameless bad luck. Distinction reflects compensatory vs. honorific purposes."*  

  **Case 2: Rule-Breaker vs. Rule-Follower**  
  - **Rule-Breaker:** Q2.1 = **D** (non-compliant). Outcome irrelevant per Q4. Outcome cannot upgrade indefensible decision. **No grant. Sanction recommended** (non-compliance).  
  - **Rule-Follower:** Q2.1 = **A/B**. Injury unforeseeable (Q4.2=NO; ledge collapse anomalous). **Grant approved + agent-regret protocol** (e.g., assist in ledge stabilization).  
  - **Minute:** *"Procedure retains sanction for non-compliance but separates sympathy (for bad luck) from blame."*  

  **Case 3: "Best Decision" Causes Harm**  
  - **Q2.1:** **A** (optimal decision).  
  - **Q4.1:** Harm contradicts expectations → Downgrade to **B**? But if harm was *unforeseeable*, outcome inadmissible. **Assume unforeseeable.**  
  - **Verdict:** **No blame. No prize** (outcome flawed). **Grant denied** (no "collapse" to recover from). **Agent-regret protocol activated** (e.g., lead habitat restoration).  
  - **Cost:** Candidate loses funding opportunity; society absorbs repair costs. Truthfully minute: *"Optimal decision, unforeseeable harm. Society shares burden; no fault assigned but outcome precludes reward."*  

  ---

  ### **What the Procedure Cannot Do**  
  *(To be included in document preamble)*  
  > "This procedure cannot:  
  > 1. **Assign moral blame** for outcomes beyond control.  
  > 2. **Compensate for missing records** (stop rule A).  
  > 3. **Evaluate character** (stop rule B defers to council).  
  > 4. **Resolve philosophical debates** (e.g., whether blame is ever justified).  
  > 5. **Eliminate outcome bias entirely** when sensitivity ranges are narrow (Q3.2), but forces transparency about it.  
  > It is a tool for *procedural fairness*, not moral truth."  

  ---

  ### **What Gets Lost in Translation**  
  - **Literature’s bite:** Moral luck theory rejects *all* outcome-influenced judgment. Here, prizes (by design) reward luck. The procedure exposes this rather than eliminating it.  
  - **Epistemology vs. Morality:** It isolates sloppy inference (using outcomes as false evidence) but cannot resolve true moral dilemmas (e.g., condemning unavoidable harm).  
  - **Practicality:** Requires meticulous record-keeping rare in fieldwork. Stop Rule A may exclude meritorious cases.  
  - **Human element:** Agent-regret protocols formalize penance but may feel punitive to candidates.  

  This framework forces explicit trade-offs, separates reparative from punitive actions, and curbs character judgments. It accepts that prizes inherently reward luck—but makes that concession visible, turning implicit bias into documented policy.
