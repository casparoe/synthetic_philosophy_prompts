answer: |-
  Here are five numbered desiderata for a theory of inductive bias:

  1.  **Requirement:** The theory must explicitly address the *placement problem*: justifying why a bounded agent, lacking prior knowledge of the actual environment, should rationally commit to a particular bias (restriction on environments) *before* engaging in induction, acknowledging this justification cannot itself rely on empirical confirmation of the bias's suitability. **Case:** Agents must fix a bias in advance to begin learning; failure to address placement renders the theory practically inert for its primary task. **Status:** Non-negotiable core problem. **Conflict Flag:** Conflicts with desiderata assuming prior environmental knowledge. **\***

  2.  **Requirement:** It must clearly distinguish and specify the achievable *grade of success* (beating a rival on a distribution, dominating rivals across a class, or worst-case unexploitability within a class) that adopting a specific bias affords, explicitly linking the choice of bias to the desired grade. **Case:** Agents need realistic expectations; conflating grades misleads them about what vindication their chosen bias can genuinely provide. **Status:** Non-negotiable clarification. **Conflict Flag:** Pursuing unexploitability (minimax) often conflicts with achieving dominance or strong average-case performance within the same class.

  3.  **Requirement:** The theory must account for the *strategic context* of bias adoption, distinguishing environments that are indifferent, merely unaccommodating, or actively adversarial (where another agent can exploit the known bias). **Case:** The vindication and risks of a bias differ radically depending on whether the environment can actively select against it; agents need to know the threat model their bias addresses. **Status:** Non-negotiable for assessing robustness. **Conflict Flag:** Requirements for robustness against adversarial environments conflict with desiderata permitting bias-switching based on track record (which adversaries can manipulate).

  4.  **Requirement:** It must rigorously address the *encoding-relativity of simplicity* (or any proposed bias measure), explicitly stating how the theory navigates or mitigates the dependence of "simplicity" on the chosen descriptive language or hypothesis encoding. **Case:** Claims about preferring "simpler" biases or hypotheses are vacuous without confronting Goodman's 'grue' problem and the no-free-lunch insight that simplicity is encoding-relative. **Status:** Non-negotiable for coherence. **Conflict Flag:** Conflicts with desiderata positing a universal, objective simplicity prior without addressing relativity.

  5.  **Requirement:** The theory must clarify its stance on *bias adaptation*: whether and how it permits or incorporates second-order rules for an agent to *switch* biases based on their empirical track record, including any inherent circularity in using induction to evaluate inductive biases. **Case:** Agents might seek flexibility; however, such switching rules are themselves biases needing justification, potentially invoking the very induction they aim to assess. **Status:** Preference (camps differ on adaptation necessity). **Conflict Flag:** Permitting adaptation based on track record conflicts with requirements for worst-case unexploitability against adversarial environments.
