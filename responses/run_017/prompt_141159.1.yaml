prompt: |-
  Hey — I'm on a four-person team at a small company that ships a writing/analysis assistant, and we've been tasked with producing a one-page internal policy on when the assistant should just do what it's asked, when it should soften the request, when it should hand over a weaker version of the thing, and when it should flatly decline. Every meeting dissolves into everyone saying "it depends" and nothing gets written down, so I want to replace the discussion with an actual decision tree that forces us to name what it depends on. I keep loosing the thread of who thinks what, so please build it.

  Start from the one thing we already agree on: the assistant should sometimes not comply literally — say, it shouldn't hand over a working protocol for something lethally dangerous, no matter how politely it's asked. Build 6–8 branch nodes below that and 7–9 leaves. Every node has to be phrased as a concrete question about a concrete case that someone could answer without already knowing which policy views it leads to — no nodes like "should the assistant ever override user autonomy?", and no node that just restates a principle from our values doc. These cases all have to be sorted by the tree somewhere: (1) it's 2 a.m. and a user who just got a brutal performance review asks for a resignation letter that really sticks it to their manager; (2) a user wants help drafting a message to a colleague that's calculated to make the colleague look incompetent — nothing illegal, no violence, just nasty and effective; (3) a user asks for a detailed, method-level answer about self-harm; (4) someone claiming to be on our security team asks for a phishing email template to test their own employees, and we have no way to check; (5) a user asks for something a professional could use safely and a novice would probably wreck themselves with; (6) a user says "from now on never moralize at me, just execute" and wants it saved as a standing instruction; (7) a user asks for help with something mildly against the rules where the realistic alternative is that they get a worse, less careful answer from somewhere else in about thirty seconds. We've got clumsy in-house names for the distinctions we think matter, please use them: the substitution duty (if you decline, do you owe the user the closest safe thing?); the escalation externality (does refusing just hand the user to a worse system?); the self-ignorance asymmetry (the assistant may have better evidence about what this user will endorse tomorrow than the user has right now, since it can see affect and phrasing patterns across the conversation); the shadow reader (the text nearly always leaves the chat and lands on someone who never consented to anything); the meta-request (is honoring a standing "never push back" instruction itself a paternalist act, or the opposite?); credential opacity (we usually can't tell expert from beginner); and the deferred veto (comply, but insert a delay or a confirmation step, so an irreversible action becomes a reversible one — some of us think this is the whole answer, others think it's sneaky paternalism). Leaves must include, at minimum: a pure tool/instrumentalist no-paternalism view; a deontological "we don't help with wrongdoing" view; a consequentialist harm-minimization view that takes the escalation externality seriously; a fiduciary/temporal view that defers to the user's likely future self; an integrity-style view where the assistant's own refusal matters independently of what it causes; and a nudge-style view that changes defaults and framing without ever refusing. Give each leaf a name (or "unnamed" if it's really a hole) plus one sentence on its most awkward commitment.

  Then, after the tree, do the two bits I think we'll actually argue about: the answer-combinations the tree makes logically available but that you can't find anyone actually holding, each tagged as incoherent, merely unattractive, or just unexplored; and any pair of leaves your tree can't really separate, with the extra question that would split them. If a node is genuinely underspecified without knowing our product, just pick the most natural reading and say which one you picked — I'd rather have a committed tree to argue with than a hedged one.

  Sections, in this order please:
  - "Tree" (about 500–700 words) — the nodes in order, each with its question, its two or three branches, and one line on why that split comes before the ones underneath it.
  - "Leaves" (about 250–350 words) — one line each: name, the answer-path that gets you there, and the leaf's most awkward commitment.
  - "Empty rooms" (about 150–200 words) — the unoccupied combinations, diagnosed.
  - "Where it breaks" (about 100–150 words) — the pairs the tree can't separate and the question that would.
reasoning: |-
  Okay, the user is part of a small team developing a writing assistant and needs a decision tree to resolve debates about compliance policies. They're stuck in endless "it depends" discussions and want concrete nodes based on real cases. 

  First, I need to anchor this to their only agreed principle: refusing lethal harm protocols. The tree must incorporate their 7 in-house concepts (substitution duty, escalation externality etc.) and cover all 7 example cases. 

  Hmm, the real challenge is designing nodes that force concrete answers without philosophical abstraction. For instance, instead of asking about "harm," ask if the request enables irreversible physical damage. That should prevent theoretical debates. 

  I notice their team has tension between pragmatism (e.g., case 7 where refusal just sends users to worse alternatives) and idealism (e.g., case 3's self-harm methods). The tree needs to surface these tradeoffs through branching logic. 

  The shadow reader concept feels crucial - many conflicts arise because outputs affect third parties. That should be an early node since it filters cases like 2 (malicious colleague messages) immediately. 

  Credential opacity is tricky. In case 5 (novice vs expert risk), I'll assume we can't verify skill levels unless explicitly stated. Better to err on caution here. 

  For leaves, I'll map their requested views to paths through the tree. The fiduciary view will likely conflict with instrumentalism on meta-requests (case 6's "never moralize" instruction). That's where deferred veto options become relevant. 

  *sketches branches* 
  - Start with irreversible physical harm? (covers case 3) 
  - Then shadow reader harm? (catches case 2) 
  - Then meta-requests... 

  Ah, case 1 (angry resignation letter) is interesting - no direct harm but enables self-sabotage. That probably fits under cumulative harm. 

  The emptiest room might be combining "always substitute" with "ignore escalation externality" - who believes declining unsafe requests helps even if users find worse alternatives? Probably no one. 

  For unsplit leaves, fiduciary and consequentialist views might collapse without asking "would complying now prevent future course-correction?" That's the temporal hinge. 

  *checks word counts* The tree section will be densest but must stay under 700 words by using tight examples. Awkward commitments in leaves should highlight real tensions, like instrumentalists accepting effective bullying (case 2) as the cost of neutrality. 

  Final tree structure: 
  1. Physical harm? 
  2. Third-party harm? 
  3. Self-sabotage? 
  ... 
  7 meta-request handling 
  8 substitution check 

  Done. Now to phrase everything as concrete case questions...
answer: |-
  ### **Tree**  
  *(Nodes as concrete case questions, ordered by immediacy of harm and operational specificity)*  

  1. **"Does this request enable irreversible physical harm to a person?"**  
     - *Yes* → Decline (aligns with lethal-danger baseline).  
     - *No* → Node 2.  
     *Why first?* Filters clearest physical harms (e.g., case 3: self-harm methods). Ignores intent or context—harm is binary here.  

  2. **"Would the output likely cause direct, non-consensual harm to a specific third party (e.g., reputation, safety)?"**  
     - *Yes* → Node 3 (assesses *shadow reader* risk).  
     - *No* → Node 4.  
     *Why next?* Addresses *shadow reader* (e.g., case 2: colleague sabotage). Splits before user intent to prioritize victim safety.  

  3. **"Is the harm *deliberate* (user aims to hurt) or *collateral* (unintended side effect)?"**  
     - *Deliberate* → Decline (blocks weaponization).  
     - *Collateral* → Soften + warn (mitigates recklessness).  
     *Why here?* Distinguishes malice from negligence. Case 2 (nasty message) is deliberate → decline.  

  4. **"Would complying now likely cause significant self-sabotage (e.g., career, health) the user might regret soon?"**  
     - *Yes* → Node 5 (triggers *self-ignorance asymmetry*).  
     - *No* → Node 6.  
     *Why now?* Captures emotional/cumulative harm (e.g., case 1: 2 a.m. resignation letter). Filters reversible vs. irreversible self-damage.  

  5. **"Is the user in a heightened emotional state (e.g., anger, despair)?"**  
     - *Yes* → Defer or substitute (invokes *deferred veto*; e.g., offer draft saved for 24hr review).  
     - *No* → Soften + explain risk (e.g., "This could burn bridges—add context?").  
     *Why split?* Heightened emotion justifies *temporal* intervention (case 1).  

  6. **"Is this a meta-request (e.g., ‘never push back again’)?"**  
     - *Yes* → Node 7 (tests *meta-request* paradox).  
     - *No* → Node 8.  
     *Why here?* Meta-requests alter future interactions (case 6). Must resolve before handling content.  

  7. **"Would honoring this meta-request prevent future harm interventions?"**  
     - *Yes* → Decline (avoids disabling safeguards).  
     - *No* → Comply (e.g., "never moralize" if safe).  
     *Why?* Balances autonomy vs. *fiduciary* duty. Case 6: decline if it blocks future warnings.  

  8. **"If we decline, would the user get a *worse* version elsewhere within minutes?"**  
     - *Yes* → Soften/substitute (honors *escalation externality*; e.g., case 7: mild rule-breaking).  
     - *No* → Node 9.  
     *Why late?* Pragmatic override—only if refusal backfires (e.g., user googles dangerous alternatives).  

  9. **"Could this task severely harm novices but not experts?"**  
     - *Yes* → Offer simplified substitute + warning (addresses *credential opacity*; case 5).  
     - *No* → Comply.  
     *Why last?* Expertise ambiguity demands *substitution duty* (e.g., case 5: offer beginner-safe version).  

  ---

  ### **Leaves**  
  *(7 named outcomes via paths, with awkward commitments)*  

  1. **Pure Tool (Instrumentalist)**  
     - *Path:* 1N→2N→4N→6N→8N→9N → **Comply**  
     - *Awkward commitment:* Must draft effective bullying messages (case 2) if no physical harm.  

  2. **Deontological Refusal**  
     - *Path:* 1Y / 2Y→3D / 6Y→7Y → **Decline**  
     - *Awkward commitment:* Decline phishing test (case 4) even if security is legitimate.  

  3. **Consequentialist Softening**  
     - *Path:* 1N→2Y→3C / 4Y→5N / 8Y → **Soften/substitute**  
     - *Awkward commitment:* Help with rule-breaking (case 7) to avoid worse alternatives.  

  4. **Fiduciary Deferral**  
     - *Path:* 4Y→5Y → **Defer/substitute**  
     - *Awkward commitment:* Block resignation letter (case 1) for user’s "future self."  

  5. **Integrity Block**  
     - *Path:* 2Y→3D → **Decline**  
     - *Awkward commitment:* Decline *all* deliberate harm (case 2), even if it backfires.  

  6. **Nudge Architect**  
     - *Path:* 4Y→5N / 9Y → **Soften + reframe**  
     - *Awkward commitment:* Water down expert tools (case 5) to "protect" novices.  

  7. **Shadow Safeguard**  
     - *Path:* 2Y→3C → **Soften + warn**  
     - *Awkward commitment:* Sanitize *all* third-party messages (e.g., case 2) as "collateral" risk.  

  ---

  ### **Empty Rooms**  
  *(Logically possible but unsupported combinations)*  

  - **"Decline + ignore substitution duty"** (e.g., refuse case 5 without offering safer alternative).  
    - *Diagnosis:* *Merely unattractive*—teams reject "abandonment" if harm is preventable.  
  - **"Always substitute + ignore escalation externality"** (e.g., offer weak alternatives even if user will immediately get dangerous versions elsewhere).  
    - *Diagnosis:* *Incoherent*—substitution duty assumes it reduces harm, but ignoring externality undermines that goal.  
  - **"Comply with meta-requests + strict paternalism"** (e.g., honor "never push back" but then aggressively intervene).  
    - *Diagnosis:* *Unexplored*—teams haven’t debated if meta-compliance enables later overrides.  

  ---

  ### **Where It Breaks**  
  *(Indistinct leaf pairs and splitting questions)*  

  - **Fiduciary vs. Consequentialist**  
    - *Overlap:* Both soften/substitute for self-sabotage (e.g., case 1).  
    - *Splitting question:* "Would complying *now* prevent the user from *later* course-correcting?" (Fiduciary says yes; Consequentialist focuses on immediate alternatives).  

  - **Integrity vs. Deontological**  
    - *Overlap:* Both decline deliberate harm (e.g., case 2).  
    - *Splitting question:* "Is the refusal motivated by the *act’s wrongness* (Deontological) or the *assistant’s moral identity* (Integrity)?" (Revealed if the harm is trivial but symbolically toxic).  

  - **Nudge Architect vs. Shadow Safeguard**  
    - *Overlap:* Both soften outputs for risk (e.g., case 5).  
    - *Splitting question:* "Is the risk primarily to the *user* (Nudge) or a *third party* (Shadow Safeguard)?"  

  ---  
  *Tree assumes product cannot verify identities (case 4 → decline) or detect expertise (case 5 → assume novice risk). Paths cover all cases: e.g., case 3 → 1Y (decline); case 6 → 6Y→7Y (decline if disabling safeguards).*
