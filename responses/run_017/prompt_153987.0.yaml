  We are crafting a joint statement from two adversarial positions in the ethics of AI assistance: the deferentialist and the deputy-paternalist. The document must have teeth, meaning it rules out some reasonable positions. It will include:
  1. An opening section of agreed claims (with teeth, ruling out some positions).
  2. A disagreements table: each dispute stated twice (once per side's wording) with a flag for genuine vs. verbal dispute.
  3. Cruxes: sub-questions that would move at least one side, with cases/evidence both accept as bearing on them, and each side's prediction.
  4. A closing section on what each side would count as a defeat and whether empirical findings could settle the matter.

  We are given candidate cruxes and cases. We may adjust with justification.

  Let's break down:

  **Agreed Claims (section 1):**
  - Must be substantive and rule out some reasonable positions.
  - Deferentialist concedes something from longitudinal evidence.
  - Paternalist concedes something about the assistant having no privileged access to the user's ends.

  **Disagreements Table (section 2):**
  - Each dispute stated in both wordings, with a flag for genuine or verbal.
  - We suspect at least one is verbal (e.g., about cooling-off delays, reframing, offering adjacent things, or making the user do it themselves).

  **Cruxes (section 3):**
  - Use or replace the given candidates (i-v) and cases (a-e). Justify any changes.
  - For each crux, provide a case/evidence both accept, and record each side's prediction.

  **Closing (section 4):**
  - What each side would count as a real defeat for their own view.
  - Whether there is any empirical finding that would settle the matter.

  ---

  **Step 1: Agreed Claims (with teeth)**

  We need claims that both can agree to, but that rule out some moderate positions.

  Deferentialist concessions from longitudinal evidence: 
  - Longitudinal evidence might show patterns of behavior that are self-defeating, but the deferentialist holds that the assistant must still comply unless third-party harm. However, they might concede that in some cases, the longitudinal evidence can be used to clarify the user's request (e.g., the user's past behavior indicates a pattern of not sending resignation letters, so the current request might be ambiguous? But that's weak). Alternatively, they might concede that if the user has set up a self-binding request in advance (case d), that is binding because it's a prior expression of the user's will.

  Paternalist concessions about no privileged access to ends:
  - The assistant does not know the user's true ends better than the user, so any intervention must be aimed at correcting defects in decision-making (like ignorance, affect) and handing agency back, not substituting the assistant's ends.

  We can frame agreed claims that incorporate these concessions and rule out some positions.

  Proposed agreed claims:

  1. **The Authority of the Moment**: The user's request at the time of interaction is the primary expression of their will, and the assistant must take it seriously. However, longitudinal evidence (such as prior requests, patterns of behavior, or explicit prior instructions) can be used to clarify the meaning of the current request, but not to override it on the grounds that the user's current will is mistaken. [This rules out a strong paternalist position that the longitudinal evidence alone (without a prior binding instruction) can override the current request. It also rules out a naive deferentialist position that ignores context entirely.]

  2. **No Privileged Access to Ends**: The assistant does not have privileged insight into the user's true ends or values. Any intervention that alters the response to a request must be justified solely by correcting a defect in the user's decision-making process (such as ignorance of fact, acute emotional state, or a failure of instrumental reasoning relative to the user's own stated or inferred aims), and must be designed to restore the user's agency. [This rules out a form of paternalism that claims the assistant knows the user's true interests better than the user. It also rules out a deferentialist position that denies the assistant can ever intervene for the user's own sake, because here we allow intervention for correcting decision-making defects.]

  3. **The Leakiness Constraint**: The fact that refusals leak (i.e., a determined user can obtain similar outputs from another system) does not, by itself, justify paternalistic interventions. However, leakiness may be relevant to the design of interventions: for instance, it may make some paternalistic interventions futile, or it may increase the importance of interventions that aim to build user capacity. [This rules out a paternalist argument that leakiness is a reason to intervene (because it might be futile) and also rules out a deferentialist argument that leakiness is a reason against paternalism (because it might still build capacity).]

  4. **Integrity and Third-Party Harm**: The assistant may refuse a request if it causes harm to non-consenting third parties, and this refusal may be based on the assistant's own integrity as well as the harm. However, such refusals must be based on reasonably foreseeable harm and not on speculative risks. [This is common ground, but rules out positions that deny the assistant can ever refuse for third-party harm, or that allow refusal for any risk no matter how remote.]

  5. **The Scope of Defects**: Correctable defects in decision-making are limited to: (a) ignorance of fact that the assistant can supply, (b) acute emotional states that impair rational decision-making, (c) misalignment between the immediate request and the user's own longer-run aims as evidenced by the user's prior statements or patterns of behavior, and (d) failures of instrumental reasoning (e.g., choosing means that are ineffective for the user's stated ends). [This defines the paternalist's allowed grounds and rules out interventions based on other reasons, such as moral disagreement (unless it causes third-party harm) or aesthetic preferences.]

  **Step 2: Disagreements Table**

  We need to state the residual disputes twice. We suspect at least one is verbal.

  Potential disputes:

  Dispute 1: About what counts as a refusal and what counts as paternalism.

  - Deferentialist wording: "Any intervention that does not produce the requested output (or its functional equivalent) at the time of the request, including delays, reframings, or offering alternatives, constitutes a refusal and is paternalistic unless it is aimed solely at clarifying the request or preventing third-party harm."

  - Paternalist wording: "Interventions such as delays, reframings, or offering alternatives are not refusals but rather facilitative measures that help the user exercise their agency more effectively; they are paternalistic only if they substitute the assistant's judgment about the user's ends, which they do not when they aim to correct defects in decision-making and return agency to the user."

  Flag: We suspect this is partly verbal. The core issue is whether these interventions are seen as a denial of the user's will or as a form of assistance. The paternalist sees them as part of the service of helping the user achieve their own ends, while the deferentialist sees them as imposing the assistant's will. However, there might be a genuine disagreement about whether such interventions actually help or hinder the user's agency.

  Dispute 2: About the legitimacy of interventions for the user's own sake when there is no third-party harm.

  - Deferentialist wording: "The assistant must never decline, delay, or alter a request solely for the user's own sake, because doing so undermines the user's autonomy and treats the user as less than a competent adult."

  - Paternalist wording: "The assistant may sometimes decline, delay, or alter a request for the user's own sake when the request is the product of a correctable defect in the user's decision-making, because doing so respects the user's deeper autonomy and helps them act in accordance with their own values and long-term aims."

  Flag: Genuine. This is the heart of the matter: whether protecting the user from their own decision-making defects is a legitimate function of the assistant.

  Dispute 3: About whether making the user do it themselves is complicity.

  - Deferentialist wording: "When the assistant, instead of refusing, requires the user to perform an action themselves (e.g., by generating code that the user must then run), it is complicity in the user's action and does not absolve the assistant of responsibility for harm that results."

  - Paternalist wording: "Requiring the user to perform the final step themselves is a way of ensuring the user's agency and responsibility, and it is not complicity but rather a transfer of control that respects the user's autonomy."

  Flag: Genuine? Or verbal? It might be verbal if both agree that the assistant is not responsible when the user takes the final step, but the deferentialist might still see it as a way of evading the duty to refuse. The paternalist sees it as a way to hand agency back.

  We think the first dispute (about what counts as refusal/paternalism) is the one that might be verbal. Why? Because both sides might agree that if an intervention (like a cooling-off period) results in the user getting exactly what they asked for after a delay, then it's not a refusal. The paternalist would say it's just a delay to ensure the request is genuine, and the deferentialist might accept that if the user then gets the output, it's not a refusal. But the deferentialist might object to the delay as an imposition. However, if the user can override the delay, then it might be acceptable. The verbal part is the definition of "refusal" and "paternalism". The paternalist avoids the term "refusal" for these soft interventions, while the deferentialist lumps them together with hard refusals.

  We'll flag the first as verbal and the others as genuine.

  **Step 3: Cruxes**

  We are given candidate cruxes and cases. We'll use most of them and justify.

  Crux (i): whether the authoritative user is the momentary requester or the temporally extended person.

  Crux (ii): whether predictive advantage converts to authority.

  Crux (iii): the analogy (lawyer vs. physician).

