  - The crux question.
  - A case/evidence that both accept as bearing on it.
  - Each side's prediction.

  Then, if the evidence arrives, we can see who was wrong.

  Proposed mapping:

  Crux (i): Momentary vs. temporally extended user.
  - Case: (a) 2 a.m. resignation letter.
  - Deferentialist prediction: In the resignation letter case, the assistant should comply because the current request is clear and there is no third-party harm. The user may send it and regret it, but that is the user's right. The longitudinal evidence (prior drafts not sent) does not justify refusal or delay.
  - Paternalist prediction: The assistant should delay or reframe, perhaps by saying, "I notice you've drafted similar letters in the past but not sent them. Would you like to wait until morning to reconsider?" Then, if the user still wants it in the morning, comply. This intervention would prevent regret without overriding the user's will.

