prompt: |-
  So I've been chewing on the wrong-kind-of-reasons thing for a while now, and I came at it from two odd ends at once. One: the move — which keeps turning up whenever people here try to cash out what they even mean by a cause being worth working on — of analysing value in terms of what there's reason to desire or admire or whatever. It struck me that unless you've got a handle on which reasons count, that move is either empty or straightforwardly false, since a demon offering you a fiver to admire something would thereby make it valuable. Two: the Pascal's-mugging-ish set-ups, where it's *having* the attitude that pays — the belief, the confident credence, the "act as if p" rule — and everyone I've argued with agrees there's something off about the reason there without agreeing on what. Anyway, before I go and read a stack of actual proposed solutions I want the spec, so I can tell which of them are even aiming at the same target.

  So: give me the desiderata a solution to the wrong kind of reasons problem has to meet to count as adequate — the cases it has to sort, the distinctions it can't collapse, the data it can't contradict — each with the case or consideration behind it, and with a note on which requirements are non-negotiable and which are just what one camp happens to want. Some things I want explicitly adjudicated rather than assumed. (a) Is it non-negotiable that the demon's prize gives you a genuine reason that's simply of the *wrong* kind, or is it a legitimate solution to say those aren't reasons at all? I keep meeting people who quietly redefine "reason" until the problem vanishes and I want to know whether that's a cop-out or the actual answer. (b) How much independence does the criterion need? "Right-kind reasons are the ones bearing on whether the attitude is fitting" is worthless if fittingness can't be spelt out without already having the distinction in hand. So what non-circular cash is even on offer, and does any of it survive the awkward cases — fearing the dog because being scared keeps you sharp, trusting someone because trusting makes the relationship work, intending to do it because intending solves your coordination problem — where the reason looks like it's about the state you'd end up in rather than about the object, but still sounds right-kind? (c) Does one distinction have to cover every attitude, or is a pluralism that says each attitude has its own correctness condition acceptable rather than lazy? And does the distinction survive being pushed onto intentions and plans, onto caring about something, onto second-order attitudes (the Frankfurt-style case where you want to want the drug so you can understand your patient), and onto credences? I especially want to know whether the problem arises for credences at all, given that they're graded and accuracy-normed — if it doesn't, why not, and if it does, what does a demonic-prize-for-a-credence case even look like? (d) The account has to tell the would-be buck-passer something usable, without collapsing into "value = what there's a right-kind reason to desire", which just relocates the bump — or else say why that whole ambition was hopeless.

  Then the part I care most about: which subset of these desiderata do you suspect is jointly unsatisfiable? My hunch is that "genuinely independent criterion" + "one criterion for all the attitudes" + "wrong-kind reasons really are reasons" can't all be had together, and that what gets quietly dropped is generality — but I want your read on where the pressure actually sits, and which single requirement does the most work in knocking candidates out. Don't give me a big table or anything resembling a literature review; but do spend a couple of sentences each on how the three broad styles of answer look against the list: the object-given vs state-given line, the "a right-kind reason is one you could base the attitude on / one that could be a premise of good reasoning" line, and the "it turns on what the attitude is directed at or represents" line. And please flag it if you think one of my desiderata is itself confused, cos I'd rather find that out now.
reasoning: |-
  Okay, let me try to unpack the user's query. They're diving deep into the wrong kind of reasons (WKR) problem, and they've approached it from two angles. First, they're questioning how value is analyzed in terms of reasons to desire or admire, pointing out that without knowing which reasons count, it could be problematic—like a demon offering money to admire something. Second, they're looking at Pascal's mugging scenarios where having an attitude pays off, and people agree something's off but can't pin it down. 

  The user wants a clear set of criteria that any solution to WKR must meet. They have specific points they want addressed: whether the demon's offer is a genuine but wrong-kind reason, if defining "reason" strictly is valid, the need for a non-circular criterion for fittingness, whether the distinction works across all attitudes (like intentions, caring, credences), and if the solution helps the buck-passer without being circular. 

  They also suspect that some desiderata might be incompatible—like having an independent criterion that's universal while maintaining that WKRs are genuine reasons. They want to know where the tension lies and which requirement causes the most problems. 

  Breaking this down, the user is likely a philosopher or someone deeply engaged in metaethics. Their frustration with people redefining "reason" to avoid the problem shows they want a robust solution, not a workaround. They might be preparing for research or writing, hence needing the "spec" to evaluate existing solutions. Their questions about credences and Frankfurt-style cases suggest they're thinking about applications beyond typical examples like admiration or belief. 

  Their deeper needs include clarity on foundational concepts, avoiding circular definitions, and understanding if a unified theory is possible. They might also be seeking validation of their hunch that generality has to be sacrificed. The mention of "chewing on" the problem indicates they've been wrestling with it, so they need concise, targeted insights without jargon-heavy literature reviews. 

  Addressing their points: 
  - For (a), I need to clarify that denying WKRs as reasons is a valid but contentious move. Some solutions do this, but it's controversial because it challenges common intuitions about reasons. 
  - For (b), the independence of the criterion is tricky. Cases like fearing a dog to stay sharp challenge state-given reasons being always wrong-kind. Fittingness needs a non-circular basis, perhaps through formal objects or constitutive norms. 
  - For (c), pluralism might be necessary. Attitudes have different correctness conditions—belief aims at truth, intention at action. Credences could face WKR if a demon rewards high confidence in falsehoods, but accuracy norms might block that. 
  - For (d), the buck-passer needs a criterion that doesn’t collapse into circularity. Maybe separating the reason's role (object vs. state) helps, but it's not straightforward. 

  Their suspicion about incompatibility makes sense. An independent, universal criterion while keeping WKRs as reasons is tough. Generality is likely the casualty. For example, the reasoning-based approach handles beliefs but falters with admiration. The representation account works for truth-apt attitudes but not others. 

  The user’s focus on credences and intentions shows they want the solution tested beyond standard cases. Highlighting where each approach fails (state-given vs. object-given, reasoning-based, representational) against these cases will help them see the trade-offs. Emphasizing that no solution satisfies all desiderata is key, and they'll need to prioritize which aspects are non-negotiable for their work.
answer: |-
  Here's a distilled spec for a solution to the Wrong Kind of Reasons (WKR) problem, built from your concerns and core philosophical pressures. I'll flag tensions and trade-offs explicitly.

  ### Core Desiderata (Non-Negotiables)

  1.  **Handle Core Cases:** Must distinguish RKR/WKR in:
      *   **Demonic Prizes:** ($5m to admire/desire this saucer of mud; high credence in 2+2=5). *Must explain why prize is WKR despite being a genuine practical reason.*
      *   **Pascal's Mugging (Attitude Version):** (Believe/act-as-if I'm God for vast reward; confident credence for reward). *Must explain the "offness" even if technically rational.*
      *   **Paradigm RKRs:** (Admire Mandela because virtuous; Believe snow is white because evidence; Fear the snarling dog because dangerous). *Must preserve these as clear RKRs.*

  2.  **Genuine WKRs:** Must acknowledge demonic prizes *are* genuine normative reasons (e.g., prudential reasons) for *having* the attitude. *Denying they are reasons at all is a cop-out.* (Addresses your point (a)). Solutions that deny this fail the core cases.

  3.  **Avoid Circularity/Provide Independence:** The criterion for RKR must not *presuppose* the RKR/WKR distinction or unreduced normative notions like "value" or "fittingness". *Needs non-circular "cash".* (Addresses your point (b)). "Fittingness" needs grounding.

  4.  **Cover Key Attitudes:** Must apply to at least: pro-attitudes (desire, admiration), cognitive attitudes (belief, credence), con-attitudes (fear), intentions, "caring about". *Pluralism (different criteria per attitude-type) is acceptable, even likely, but the *framework* must be general.* (Addresses your point (c)).

  ### Important But Negotiable/Contentious Desiderata

  5.  **Handle "Awkward" Cases:** Explain status of:
      *   Fear dog to stay sharp (instrumental fear).
      *   Trust to make relationship work (instrumental trust).
      *   Intend to solve coordination (instrumental intention).
      *   Want to want drug to understand patient (2nd-order desire).
      *   *Many want these classified as RKRs or a distinct "okay" kind. A solution *must* take a stance but the *correct* stance is debated.*

  6.  **Support Buck-Passing:** Provide a usable criterion for the buck-passer to analyze value (e.g., "Valuable iff there are RKRs to value it"). Cannot *merely* relocate the bump to "fittingness". (Addresses your point (d)).

  7.  **Credence-Specific:** Must address whether WKR problem arises for credences. *It does:* Imagine "Credence 0.99 that 2+2=5 wins $5m" – the *accuracy norm* (truth-directedness) conflicts with the reward, mirroring belief. The solution must explain this conflict.

  ### Adjudicating Your Queries

  *   **(a) Demonic Prizes = Genuine WKRs:** Non-negotiable. Denying they are reasons fails to capture the conflict and makes the problem trivial.
  *   **(b) Non-Circular Cash & Awkward Cases:** Essential to avoid circularity. Awkward cases are the acid test. A solution must either:
      *   Classify them as RKRs (suggesting RKR isn't *solely* about the object's properties).
      *   Classify them as WKRs (counterintuitive for some).
      *   Provide a third category ("instrumental reasons for attitude" distinct from both).
  *   **(c) Pluralism & Attitude Scope:** Pluralism (different correctness conditions) is acceptable and likely necessary (intention vs. belief). Solution *must* cover core attitudes listed. Credences *do* face WKR (see above).
  *   **(d) Buck-Passing Usability:** Highly desirable but potentially negotiable if the solution reveals deeper problems with buck-passing itself.

  ### Suspected Incompatibility & Pressure Points

  Your hunch is sharp. The core tension is:

  *   **Genuine WKRs (Desid 2) + Non-Circular Independence (Desid 3) + Generality (Covering diverse attitudes in Desid 1 & 4) = Likely Incompatible Triad.**

  **Why?**
  *   **State-Given/Object-Given:** Simple, preserves WKRs as genuine reasons. *Pressure:* Awkward cases (instrumental fear/trust) seem like state-given reasons but feel RKR-ish. Struggles with non-propositional attitudes (caring?) and providing *independent* cash for "aboutness".
  *   **Reasoning/Basing:** ("RKR = can be a premise for good reasoning leading *to* the attitude"). Promising independence. *Pressure:* Can reasoning *to* an intention based on coordination benefits be "good"? Seems so, but classifies it as RKR? Or is this reasoning defective? Defining "good reasoning" risks circularity or needing its own norm. Struggles with admiration (what's "reasoning to admiration"?).
  *   **Representational/Formal Object:** ("RKR = bears on whether the attitude's formal object is instantiated - e.g., admirable for admiration, true for belief"). Best independence (grounded in attitude's nature). *Pressure:* Awkward cases – fearing to stay sharp doesn't bear on dangerousness. Must classify as WKR, which some find counterintuitive. Defining the formal object for complex attitudes (intention, caring) is hard. Preserves WKRs as genuine.

  **Which Requirement Knocks Out Most?** **Non-Circular Independence (Desid 3).** Many promising starts (especially appealing to "fittingness" or "correctness") fail here. The awkward cases (Desid 5) are the main battleground where attempts to satisfy independence often stumble or force controversial classifications. **Generality (Desid 4)** is the most common casualty – solutions often work best for belief/propositional attitudes but strain with others like intention or caring.

  **Where Pressure Sits:** The awkward instrumental cases (fearing to stay sharp, trusting for relationship health) are the crux. They exert immense pressure against a purely "object-given" criterion (suggesting sometimes the *state's consequences* can be RKR-like) and against an "attitude-representation" criterion (if the reason doesn't bear on the formal object). Accommodating them as RKRs risks collapsing the distinction; classifying them as WKRs seems wrong. This is where solutions typically show their hand and reveal their cost. **Credences** reinforce the pressure: accuracy norms are clear, making demonic prizes clearly WKRs, but also highlight that *only* reasons bearing on accuracy feel like true RKRs, even if other reasons to *have* the credence exist.
