  Next, the causal-bonding criterion. They’re worried about scattered objects and contingent existence. In a simulation, having objects disappear when interactions stop could be problematic. They mention "dense enough" is vague but acceptable. However, in practice, this might lead to glitches. For example, if an object breaks apart temporarily, does it cease to exist? That could mess with game state persistence.

