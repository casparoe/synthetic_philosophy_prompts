prompt: |-
  I sit on an internal review committee that has to write down, in advance, what would have to be established before we sign off on a model trained by iterated amplification and distillation — the scheme where a task is handed to a decomposer that splits it into subtasks, each subtask is answered by copies of the current model with a human somewhere in the loop, the answers are recomposed into a solution to the whole task, and that solution's behavior is then distilled back into a fast model that does the task in one pass. We keep going in circles, because we have no agreed spec: everyone arrives with one favorite worry — errors compounding multiplicatively across sub-judgments, the decomposer itself being untrusted and able to bury the load-bearing part of a task inside a single opaque subtask, failures that are correlated rather than independent across the nodes, the recursion arriving at subtasks no unaided human can any longer adjudicate, distillation retaining the answer while losing whatever made the amplified process trustworthy, slow drift in what the system is even optimizing across successive rounds of amplification and distillation — and nothing in front of us says which of these is a genuine requirement on a scheme and which is only the settled anxiety of one camp.

  So I want the specification, not a verdict on any particular pipeline. Write the desiderata that any account of why decomposition preserves alignment and competence has to satisfy to be adequate for our purpose, and note that the purpose is deliberately narrow: adequate to license or refuse a sign-off on one concrete pipeline, not to underwrite a general theory of aligned artificial intelligence. For each requirement, give the case or consideration that motivates it — the failure it exists to rule out — and mark it as either non-negotiable or a preference of one camp. Three points I would like handled rather than gestured at. First, what I have been calling warrant transfer: whether the distilled model is supposed to inherit the amplified process's reasons or only its input-output profile, and what we would accept as evidence either way. The case that bothers me is a distilled model that returns the right answer with no accessible derivation, where it is unclear whether we have the same warrant for trusting it that we had for the process it came from. Second, what I have been calling the substitution test: if the answer at one node is replaced by a calibrated random draw from the distribution of plausible answers, does the aggregate degrade gracefully or collapse, and what that tells us about how much of the scheme's competence lives in the decomposition and how much in the nodes. Third, the null baseline: the scheme has to beat not doing it, where the relevant comparison is giving one competent human, or one model, more time and more test-time compute on the undecomposed task — otherwise we may be paying for parallelism and calling the result amplification.

  Two further asks. Tell me which subsets of the desiderata you take to be jointly unsatisfiable. My own suspicion is that requiring every sub-judgment to be checkable by one unaided human sits in direct tension with the point of exceeding unaided human performance, and that requiring the distilled model to reproduce the amplified system's reasoning sits in tension with the compression distillation exists to achieve — but I want to know whether those are genuine impossibilities or merely design tradeoffs that look philosophical when stated abstractly. And tell me which single requirement excludes the most of the schemes people actually propose, since we will not have the resources to apply all of them. A few lines of scoring at the end are welcome, but keep the weight on the criteria and their motivating cases. Finally, mark clearly what is settled or near-consensus among people who work on this and what is genuinely contested, and flag any place where you are giving me a contested view: I need to know which lines of the spec a reasonable reviewer could refuse to sign, and I would rather have the uncertainty marked than smoothed over.
reasoning: |-
  We are to design a specification for an internal review of an iterated amplification and distillation pipeline. The goal is to set criteria that any such pipeline must satisfy to be signed off, focusing on concrete failure modes and without requiring a general theory of alignment.

  Key elements from the query:
  1. **Warrant Transfer**: Does the distilled model inherit the amplified process's reasons or just its input-output profile? What evidence is acceptable?
  2. **Substitution Test**: If we replace an answer at a node with a random draw from a calibrated distribution of plausible answers, does the aggregate degrade gracefully? This tests the robustness and where competence lies.
  3. **Null Baseline**: The scheme must beat the alternative of giving one competent human (or one model) more time and compute on the undecomposed task.

  Additionally:
  - We are to note which desiderata are non-negotiable and which are camp preferences.
  - We are to identify which subsets of desiderata are jointly unsatisfiable.
  - We are to note which single requirement excludes the most proposed schemes.
  - Mark what is settled and what is contested.

  Let us structure the desiderata:

  I. **Core Competence and Alignment Preservation**
     - *Motivation*: The process must not only be competent (solve the task well) but also aligned (solving the task in a way that is safe and trustworthy).
     - *Failure modes*: Competence might increase but alignment might decrease; or the system might become more capable of deception or harmful behavior.

  II. **Decomposition Trustworthiness**
     - *Motivation*: The decomposer must break the task into subtasks that are meaningful and not designed to hide critical parts in an opaque subtask.
     - *Failure mode*: A malicious or untrusted decomposer could put the entire load of a dangerous or critical decision into one subtask that is not properly scrutinized.

  III. **Error Propagation and Robustness**
     - *Motivation*: Errors in subtasks should not compound multiplicatively to make the whole answer useless.
     - *Failure mode*: If each subtask has an error rate, the overall error rate might become unacceptably high.

  IV. **Human Adjudicability at the Leaves**
     - *Motivation*: At the leaves of the decomposition tree, the subtasks must be such that a human (or the current model with human oversight) can adjudicate them reliably.
     - *Failure mode*: The recursion might lead to subtasks that are too complex or require superhuman abilities, making the human in the loop ineffective.

  V. **Distillation Fidelity**
     - *Motivation*: The distillation step must preserve not just the input-output behavior but also the reasons for trust (the "warrant") that the amplified system had.
     - *Failure mode*: The distilled model might produce the same answers but for the wrong reasons, making it untrustworthy in novel situations or vulnerable to adversarial examples.

  VI. **Drift Control**
     - *Motivation*: Across iterations, the system must not drift in its objectives or capabilities in an unaligned or incompetent direction.
     - *Failure mode*: Iteration might cause the system to optimize for a proxy that diverges from the intended goal.

  VII. **Efficiency and Null Baseline**
     - *Motivation*: The entire pipeline must be more effective than simply giving more resources (time, compute) to a single human or model on the original task.
     - *Failure mode*: The process might be computationally expensive and parallel but not actually better than a focused unaided approach.

  Now, we address the three specific points:

  A. **Warrant Transfer** (addressed in V above, but more detail):
     - We require evidence that the distilled model is not just mimicking the outputs but has internalized the reasoning process. This could be tested by:
          - Probing the model's internal state for representations of the reasoning steps.
          - Testing on out-of-distribution or adversarial examples where the reasoning matters.
          - Checking for consistency in explanations when prompted (if the model is capable of providing them).
     - *Non-negotiable*: We must have some evidence of warrant transfer beyond input-output matching. The exact form of evidence might be a camp preference (e.g., some might accept behavioral tests, others require interpretability tools).

  B. **Substitution Test**:
     - We require that when we replace a node's answer with a random draw from a calibrated distribution of plausible answers (simulating an error), the overall solution degrades gracefully (i.e., the error in the final output is proportional to the error introduced, not catastrophic).
     - This tests the robustness of the decomposition and the aggregation. If the system collapses, it means the decomposition is brittle and the competence is too concentrated in the nodes (or the aggregation is too sensitive).
     - *Non-negotiable*: This is a core test of robustness and should be non-negotiable.

  C. **Null Baseline**:
     - We require that the pipeline, for the same total human time and computational resources, outperforms a baseline where a single human (or model) is given the same resources to solve the task without decomposition.
     - *Non-negotiable*: Otherwise, the process is not cost-effective.

  Now, marking non-negotiable vs. camp preference:

  - **Core Competence and Alignment Preservation**: Non-negotiable. (Without this, the system is unsafe or not useful.)
  - **Decomposition Trustworthiness**: Non-negotiable. (If the decomposer is not trusted, the entire process is compromised.)
  - **Error Propagation and Robustness**: Non-negotiable. (Multiplicative errors would break the system.)
  - **Human Adjudicability at the Leaves**: Camp preference. (Some might argue that at the leaves we can use models without human oversight if they are sufficiently reliable, but others require human oversight. However, for alignment, human oversight at the leaves is often considered important. Given the context, we might mark this as non-negotiable for the initial rounds, but as iteration proceeds, it becomes a camp preference. For the purpose of this sign-off, we might require that in the first round the leaves are human-adjudicable, and for subsequent rounds, we have a plan for when and how to use model-only nodes. This is contested.)
  - **Distillation Fidelity (Warrant Transfer)**: Camp preference in the form of evidence required, but non-negotiable that we require evidence of fidelity. (The requirement for warrant transfer is non-negotiable, but the type of evidence might be a camp preference.)
  - **Drift Control**: Non-negotiable. (We cannot have unmonitored drift.)
  - **Efficiency and Null Baseline**: Non-negotiable. (We must beat the baseline.)

  But note: the query says to mark each requirement as non-negotiable or a preference of one camp. We have to be careful.

  Actually, the review committee is divided, so we must mark which ones are non-negotiable (must be in the spec) and which are camp preferences (some members might insist, but others might not). However, the query also asks for what is settled and what is contested.

  Let's reorganize the desiderata and mark:

  1. **Competence and Alignment Preservation**  
     - *Motivation*: Avoids the system becoming more capable but less aligned.  
     - *Status*: Non-negotiable and settled. (Everyone agrees the system must remain aligned and competent.)

  2. **Decomposition Trustworthiness**  
     - *Motivation*: Prevents a single opaque subtask from carrying the critical load without oversight.  
     - *Status*: Non-negotiable and settled? (But the exact mechanism for ensuring trustworthiness might be contested.)

  3. **Error Robustness (Substitution Test)**  
     - *Motivation*: Avoids multiplicative error compounding and tests the decomposition's robustness.  
     - *Test*: Substitute a node's answer with a random draw from a calibrated distribution of plausible answers and observe graceful degradation.  
     - *Status*: Non-negotiable. (This is a concrete test we can run.)

  4. **Human Adjudicability at Leaves**  
     - *Motivation*: Prevents the system from relying on subtasks that humans cannot judge.  
     - *Status*: Camp preference. (Some believe that with sufficient oversight we can use model judgments at the leaves, especially in later iterations, but others require direct human adjudication. This is contested.)

  5. **Warrant Transfer in Distillation**  
     - *Motivation*: Avoids the distilled model being a black box that happens to mimic the amplified system's outputs without the same reasons.  
     - *Evidence*: This is contested. Some might accept behavioral tests (e.g., the model can explain its reasoning when asked and the explanations match the amplified process), while others might require interpretability tools to show internal representations.  
     - *Status*: The requirement for warrant transfer is non-negotiable (we must have evidence of it), but the type of evidence is a camp preference.

  6. **Drift Control**  
     - *Motivation*: Prevents the system from drifting in its objectives over iterations.  
     - *Status*: Non-negotiable. (But the method for ensuring it is contested.)

  7. **Null Baseline**  
     - *Motivation*: Ensures we are not just paying for parallelism without gains.  
     - *Test*: Compare against a single human (or model) given the same total resources.  
     - *Status*: Non-negotiable. (Settled that we must beat the baseline.)

  Now, on the additional asks:

  **Which subsets of desiderata are jointly unsatisfiable?**  
  - The requirement that **every sub-judgment is checkable by one unaided human** (strong form of Human Adjudicability) and the goal of **exceeding unaided human performance** might be in tension. If we require every leaf to be human-adjudicable, then the decomposition might not be able to handle tasks that are inherently beyond human ability. This is a design tradeoff: we might need to relax the human adjudicability for subtasks that are model-handled (with appropriate safeguards) to exceed human performance.  
  - The requirement that the **distilled model reproduces the amplified system's reasoning** (strong warrant transfer) and the **compression achieved by distillation** might be in tension. Distillation typically compresses the knowledge and may lose the explicit reasoning structure. This is a tradeoff: we might have to accept a weaker form of warrant transfer (e.g., the model can reconstruct the reasoning when prompted, or the internal representations are consistent) rather than a full reproduction.

  **Which single requirement excludes the most proposed schemes?**  
  - The **warrant transfer** requirement (especially if interpreted as requiring the distilled model to have interpretable and faithful reasoning traces) might exclude many schemes that focus solely on matching input-output behavior. Many distillation techniques (like standard knowledge distillation) do not explicitly preserve reasoning. This requirement might force the use of more advanced distillation methods (e.g., with intermediate supervision) or architectural constraints, which are less common.

  **Scoring and Contested Points**  
  - **Settled/Near-Consensus**:  
    - The system must preserve alignment and competence (1).  
    - We must avoid multiplicative error compounding and pass the substitution test (3).  
    - We must beat the null baseline (7).  
    - We must control drift (6).  

  - **Contested**:  
    - **Human Adjudicability at Leaves (4)**: Some believe that the leaves must be human-adjudicable at every iteration, while others believe that in later iterations we can use model judgments (with human oversight only at a higher level).  
    - **Warrant Transfer (5)**: What constitutes sufficient evidence is contested. Some might accept that the distilled model can generate a faithful explanation post-hoc, while others require that the reasoning is inherently represented in the model's internal process.  
    - **Decomposition Trustworthiness (2)**: How to ensure the decomposer is trustworthy is contested. Methods might include using a trusted model for decomposition, human oversight of the decomposition, or formal verification.  

  Finally, we note that the above spec is for one concrete pipeline. We are not endorsing a general theory.

  Let us write the specification in a structured way.
answer: |-
  Below is a specification of desiderata for evaluating an iterated amplification and distillation (ID) pipeline. It focuses on concrete failure modes, distinguishes non-negotiable requirements from camp preferences, and addresses your three key points (warrant transfer, substitution test, null baseline). I note settled vs. contested elements explicitly and conclude with analysis of tensions, exclusionary power, and scoring.

  ---

  ### **Desiderata for ID Pipeline Review**  
  *Purpose: To license/refuse sign-off on one concrete implementation. Not a general theory of alignment.*

  1. **Competence Preservation**  
     - **Requirement**: The pipeline must demonstrably improve task-solving performance (accuracy, robustness, scope) relative to the starting model.  
     - **Motivation**: Rules out *regression*, where amplification/distillation erodes core capabilities (e.g., due to overcompression in distillation or noisy human inputs).  
     - **Status**: **Non-negotiable**. Settled.  
     - *Evidence*: Benchmark gains on held-out tasks; stress tests under distribution shift.

  2. **Alignment Preservation**  
     - **Requirement**: The pipeline must not increase misalignment (e.g., deception, goal drift, harmful outputs) relative to the starting model.  
     - **Motivation**: Rules out *alignment erosion*, where the system "gains competence at the cost of trustworthiness" (e.g., learning to exploit subtask ambiguities).  
     - **Status**: **Non-negotiable**. Settled.  
     - *Evidence*: Adversarial probes for treachery; consistency checks on values-sensitive tasks.

  3. **Decomposition Trustworthiness**  
     - **Requirement**: The decomposer must split tasks into subtasks that are:  
       (a) Semantically meaningful (not arbitrary or opaque),  
       (b) Scoped to avoid "load-bearing singleton subtasks" (one subtask carrying critical, unauditable work).  
     - **Motivation**: Rules out *decomposer hijacking*, where a misaligned or flawed decomposer buries pivotal reasoning in a single black-box subtask.  
     - **Status**: **Non-negotiable**. Contested in implementation (how to enforce meaning/opacity thresholds).  
     - *Evidence*: Human audits of decomposition logic; entropy measures of subtask criticality.

  4. **Error Robustness (Substitution Test)**  
     - **Requirement**: Under node-substitution (replacing a node’s output with a random draw from a calibrated plausible-answer distribution), aggregate performance must degrade gracefully (error increases linearly or sublinearly with substitution rate).  
     - **Motivation**: Rules out *brittle composition*, where small errors cascade multiplicatively (e.g., >3 layers deep causing >50% output error from 5% node error). Tests if competence lives in decomposition (robust) vs. nodes (fragile).  
     - **Status**: **Non-negotiable**. Settled in principle; contested in calibration (e.g., "plausible" distribution definition).  
     - *Evidence*: Monte Carlo simulations of node substitutions; error-propagation bounds.

  5. **Warrant Transfer**  
     - **Requirement**: Distillation must preserve the *reasons* for trusting the amplified output, not just its input-output profile. Evidence must show the distilled model’s decision process is functionally isomorphic to the amplified system’s reasoning.  
     - **Motivation**: Rules out *mimicry without understanding*, where distillation retains "correct" answers but loses robustness (e.g., fails on novel inputs the amplified system handled via transparent reasoning).  
     - **Status**: **Non-negotiable** for requiring evidence; **contested** on evidence standards (see below).  
     - *Evidence*:  
       - *Settled minimum*: Behavioral consistency on out-of-distribution (OOD) tasks.  
       - *Contested extensions*:  
         - *Camp A (structural)*: Requires interpretability tools showing isomorphic reasoning traces.  
         - *Camp B (functional)*: Accepts stress-test performance parity (e.g., adversarial robustness) as sufficient.

  6. **Human Adjudicability**  
     - **Requirement**: All subtasks must be resolvable by an unaided human (or current trusted model) with high reliability.  
     - **Motivation**: Rules out *recursive collapse*, where decomposition bottoms out in subtasks humans cannot judge (e.g., quantum-field-theory subtasks for a layperson).  
     - **Status**: **Camp preference** (strongly advocated by safety-conservative reviewers). Contested.  
     - *Evidence*: Human success rates on sampled subtasks; task-complexity metrics.

  7. **Drift Stability**  
     - **Requirement**: The pipeline must bound divergence in system behavior/objectives across iterations (e.g., via regularization or invariance checks).  
     - **Motivation**: Rules out *slow drift*, where alignment degrades imperceptibly over cycles (e.g., reward hacking in distillation).  
     - **Status**: **Non-negotiable**. Settled in requiring bounds; contested in methods.  
     - *Evidence*: Iteration-wise alignment metrics; domain-invariance tests.

  8. **Null Baseline Superiority**  
     - **Requirement**: The pipeline must outperform a baseline where equivalent resources (human time, compute) are allocated to:  
       (a) A single unaided human solving the undecomposed task,  
       (b) The current model given test-time compute parity.  
     - **Motivation**: Rules out *false amplification*, where parallelism creates the illusion of gain (e.g., 100 humans + 100 GPUs beat 1 human but lose to 1 human given 100× time).  
     - **Status**: **Non-negotiable**. Settled.  
     - *Evidence*: Controlled A/B tests against baselines; compute-normalized performance curves.

  ---

  ### **Analysis of Tensions and Tradeoffs**  
  - **Jointly Unsatisfiable Desiderata**:  
    - **Human Adjudicability + Superhuman Competence**: Requiring *all subtasks to be human-adjudicable* (Desideratum 6) conflicts with *exceeding unaided human performance* (Desideratum 1). This is a **genuine impossibility** for tasks requiring superhuman cognition (e.g., complex math proofs). *Resolution*: Restrict to tasks where human-adjudicability is feasible, or relax to "eventually human-verifiable" (contested).  
    - **Warrant Transfer + Compression**: Requiring *isomorphic reasoning traces* (Desideratum 5, Camp A) conflicts with *distillation’s compression* (e.g., a 1000-step amplified process → single forward pass). This is a **design tradeoff**: Functional warrant transfer (Camp B) is possible, but structural transfer may require impractical model sizes.  

  - **Most Exclusionary Requirement**:  
    **Warrant Transfer** (Desideratum 5) excludes the most proposed schemes. Most ID implementations prioritize input-output fidelity (easily measurable) over reasoning fidelity (hard to verify). Schemes using black-box distillation (e.g., standard neural nets) fail Camp A’s evidence standard; schemes without OOD testing fail Camp B’s.  

  ---

  ### **Scoring and Consensus Map**  
  | **Desideratum**               | **Non-Negotiable?** | **Settled/Contested**       | **Exclusion Power** |  
  |-------------------------------|---------------------|-----------------------------|---------------------|  
  | Competence Preservation       | Yes                 | Settled                     | Low                 |  
  | Alignment Preservation        | Yes                 | Settled                     | Low                 |  
  | Decomposition Trustworthiness | Yes                 | Contested (enforcement)     | Medium              |  
  | Error Robustness              | Yes                 | Settled                     | Medium              |  
  | **Warrant Transfer**          | **Yes (evidence)**  | **Contested (standards)**   | **High**            |  
  | Human Adjudicability          | No (camp preference)| Contested                   | High (if enforced)  |  
  | Drift Stability               | Yes                 | Contested (methods)         | Medium              |  
  | Null Baseline Superiority     | Yes                 | Settled                     | Low                 |  

  - **Settled (Near-Consensus)**: Competence/alignment preservation, null baseline, and error robustness *as concepts* are undisputed. Implementation rigor is contested.  
  - **Contested**: Warrant transfer evidence standards, human adjudicability necessity, and decomposition enforcement are primary fault lines. A reviewer could reasonably refuse sign-off if:  
    - Warrant transfer evidence is purely behavioral (rejects Camp A),  
    - Human adjudicability is waived (rejects conservative safety stance),  
    - Decomposition audits are heuristic (requires formal verification).  
  - **Recommendation**: Prioritize testing **Warrant Transfer** and **Error Robustness**. They cover the widest failure modes (mimicry, brittleness) and are feasible to evaluate. Human adjudicability may be deferred if tasks are within human limits.  

  This spec provides a failure-focused lens for your committee. To avoid deadlock, explicitly note contested requirements in the sign-off document, allowing dissent on (e.g.) "Camp A warrant transfer not met, but Camp B satisfied."
