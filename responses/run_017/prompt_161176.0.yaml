answer: |-
  ## Mantle Fold Sestina for the Volcanic Island Snale

  The island rose, a furnace in the sea.
  One gravid snale, sole founder on the stone,
  bore sealed within a subtle, random **fold** –
  no ancestor possessed this tissue's pleat,
  no pressure shaped it, merely chance's **work**,
  a tucked-in **accident** within her form.

  Her clonal kin inherit this strange **form**.
  No heritable difference stirs the **sea**
  of sameness. Yet, the **fold** performs its **work**:
  it seals the shell against the parching stone
  in drought. Mere luck? This fortunate **accident**
  ensures their hold upon the barren **fold**.

  For generations, clinging to the **fold**
  of rock, one shape defines the snale's true **form**.
  Survival hinges on that chance **accident**,
  this seal against the salt spray of the **sea**
  and desiccating winds that scour the stone.
  It *does* the vital, life-preserving **work**.

  But is this sealing action true, real **work**?
  Does function live within the saving **fold**
  before the winnowing hand touches stone?
  Was purpose granted to this stable **form**
  by drought's demand, the harsh demands of **sea**?
  Or just the consequence of **accident**?

  Then comes the shift: a second finds the **sea**.
  Variation blooms – no longer **accident**
  alone defines the mantle's sealing **work**.
  Now tightness varies on the rocky **fold**.
  Survival tracks the trait; a new **form**
  emerges, shaped by pressures cold as **stone**.

  Selection carves the lineage on the **stone**.
  The sealing trait, no longer **accident**
  borne solely by the founder's primal **form**,
  becomes a target. Now, upon the **fold**,
  the pressure builds; it sharpens nature's **work**,
  demanding efficiency beneath the **sea**.

  O **fold**! Before the winnowing **stone** took hold,
  Did your deep **work** require a history told?
  Or did your **form**, that saving **accident**,
  Seal function in your **system**, purpose bold?
