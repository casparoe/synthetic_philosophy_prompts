  Here's a case tailored to your specifications, illustrating how a uniform cost addition can disrupt an honest signal by affecting the participation margin, even when the signal is initially cheap and honest due to differential costs.

  ### **Setting: Freelance Platform Job Application**
  Imagine a freelance platform where employers post short-term coding jobs. Workers are either **high-skill** (type H, 50% of the population) or **low-skill** (type L). The employer values a completed job at **10** if done by H, but **0** if done by L (e.g., L produces buggy code). Workers have outside options: H can earn **9.99** elsewhere (e.g., other gigs), while L has no alternatives (**0**). The employer pays based on a **quick skill-test** (e.g., a 5-minute coding quiz). Passing the test costs H only **0.01** (trivial effort) but costs L **10.1** (hours of struggle). The employer pays **10** to workers who pass the test (believing they are H) and **0** to those who don’t.  

  ### **Payoffs and Initial Equilibrium (Cheap Signal)**
  - **H’s choice**: Pass test → get job: $10 - 0.01 = 9.99$. Skip test → outside option: $9.99$.  
    *Indifferent, so assume H takes the test (net gain ≈ 0)*.  
  - **L’s choice**: Pass test → $10 - 10.1 = -0.1$. Skip test → $0$.  
    *Prefers skipping (avoids loss)*.  
  **Result**: Only H passes the test. Signal is **honest and cheap** (cost = 0.01, 0.1% of H’s job value).  

  ### **Adding a Uniform Cost**
  The platform adds a **fee of 0.02** for test-taking (e.g., transaction cost), paid by both types.  
  - **H’s choice**: Pass test → $10 - 0.01 - 0.02 = 9.97$. Skip test → $9.99$.  
    *Prefers skipping (9.97 < 9.99)*.  
  - **L’s choice**: Pass test → $10 - 10.1 - 0.02 = -0.12$. Skip test → $0$.  
    *Still prefers skipping*.  
  **Result**: **No one takes the test**. Employers see no signal and offer $0$ (assuming no test = L), so H takes outside option (9.99), L gets 0. The signal now carries **zero information**.  

  ### **Key Mechanism: Participation Margin**
  The failure stems from the **thin net surplus** for H (initially ≈0). The uniform cost tips H below their outside option, while L was already deterred. The signal dies not because mimicry becomes easier, but because H **no longer participates**. This highlights a gap in standard models: they focus on *deterring mimics* (mimicry margin) but neglect *retaining honest signalers* (participation margin).  

  ### **Differential Cost (Spence-Direction) vs. Uniform Cost**
  If the added cost were **differential** (e.g., a time-based fee where L pays 100× more), H might still participate. For example:  
  - Added cost = $0.01$ per minute. H (5-min test) pays $0.05$; L (3-hour test) pays $1.8$.  
    - H: $10 - 0.01 - 0.05 = 9.94$ (< 9.99) → still drops out.  
    - L: $10 - 10.1 - 1.8 = -11.9$ → still out.  
  **Outcome unchanged**: Differential costs don’t save the signal because H’s surplus is too thin. Only reducing the fee (e.g., to $0.005$) could retain H, but that violates the uniform-cost constraint.  

  ### **Zahavian Reply and Its Limits**  
  The standard Zahavian reply is: **"Handicap requires *differential* cost, not high absolute cost. Your ‘uniform cost’ violates this, so it’s not a counterexample."** This is *partially valid*: handicap signals only demand that costs are *relatively higher* for low types (as in the initial quiz). However, the reply becomes **ad hoc** when it ignores participation. Handicap theory implicitly assumes signalers’ surplus is robust (e.g., Spence’s education model assumes high wages justify degree costs). In reality, if costs erode all surplus (e.g., fees making gig work unviable), honesty collapses—not from mimicry, but from non-participation. This reveals a **blind spot** in the handicap principle’s pop-culture framing, where "costly" is conflated with "universally expensive" rather than "differentially burdensome."  

  ### **Conclusion**
  This case shows how a **uniform cost** can destroy an honest signal by **excluding the honest type**, even when mimicry is already deterred. The crux is the **participation margin**—where the good type’s razor-thin surplus vanishes under added costs. It underscores that signalling equilibria depend not just on *deterring fakes*, but on *keeping real participants in the game*.
