prompt: |-
  I have been reading about intelligence on my own for a couple of years now — no training in philosophy or psychology, just books and long argument threads — and I keep losing the same arguments because everyone in them is quietly using a different standard for what would even count as an answer. So before I read any more definitions of intelligence, I want the specification: what an adequate account of intelligence has to deliver.

  The purpose I want it good enough for is three disputes I actually care about. First, whether the chatbot I use daily is intelligent in any sense at all, or whether calling it that is only a way of speaking. Second, whether "a machine much smarter than us" is more than a slogan. Third, whether I am being inconsistent when I say my dog has some intelligence and the spreadsheet that balances my accounts has none.

  Here is my tentative list, each with the case that makes me think it is a requirement.

  It must separate intelligence from stored knowledge. Two systems give identical answers to every question I can ask in some domain; one looked them up in an index it was handed, the other worked them out. If a theory cannot tell these apart, it is not a theory of intelligence.

  It must separate intelligence from speed and from brute resources. Take a program that wins by trying every possibility, and then the same program slowed by a factor of a million: I want to say it is not less intelligent, only slower. But I cannot say that in full generality, because slow it down enough and it never answers at all. So I propose a fixed-budget rule — comparisons of how much intelligence something has must hold time, memory and hardware fixed — and I want to know whether that rule is workable or whether it quietly makes every comparison between very different kinds of system undefined.

  It must handle jagged systems: ones that beat the best humans at one narrow game and fail at things a child does. Does intelligence admit a single ordering, or is it a profile? If it is a profile, what becomes of the "smarter than us" claim?

  It must say when two problems are the same problem. Someone solves a puzzle stated in words and cannot solve the same puzzle drawn as a diagram; a system solves a task in one setting and collapses when the surface details change but the structure does not. Without something here, "able to handle new problems" is empty.

  It must handle collections. An ant colony, a market, or an invented case I keep returning to: a thousand slow reasoners wired together so that their combined verdict arrives in a second, where no single one of them does anything I would call intelligent. Is the whole intelligent, or is this a different thing we honour with the same word?

  It must handle damaged or unusual hardware: a person who can no longer form new memories but still reasons well; a savant who produces answers he cannot explain; someone whose body cannot produce the answers a test would accept. Whatever intelligence is, it should not be taken away by a broken output channel.

  It must be able to tell me I was wrong about who has it. If the tests we build are validated against the people we already call intelligent, the theory just returns my own judgements and settles nothing about the dog or the spreadsheet. Is that a genuine requirement, or am I asking for magic?

  It must keep intelligence distinct from the things we confuse it with — knowledge, speed, wisdom, character, being useful — and must distinguish having some from having a lot, the way a mouse and a rock differ.

  What I want from you: sort these into genuine desiderata and mere prejudices of one camp, given the purpose I stated; restate the genuine ones more sharply than I have; add the two or three requirements a specialist would insist I have missed, with the case behind each; and mark which are non-negotiable and which I could drop if dropping one buys me the rest. I have three suspicions I want tested rather than flattered: that the jaggedness requirement and the "smarter than us" claim are already in conflict; that the same-problem requirement is just the stored-knowledge requirement in disguise and can be deleted; and that the damaged-hardware requirement is sentimental and will do no real work. Flag any subset of the final list that cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest number of the usual kinds of answer. Then, in a few lines each and no more, score the standard families: the does-well-on-our-tests account, the general-problem-solving-across-many-environments account, the single-number psychometric account, and the biological or neural account. I do not know the literature well enough to name them properly, so use whatever the real families are.

  Lead with your bottom line in the first sentence — the one thing about this list that I most need to hear — then give me the reasoning. No preamble, and do not restate my question back to me.
reasoning: |-
  Hmm, the user has been wrestling with defining intelligence independently for years, hitting roadblocks in philosophical and psychological arguments due to inconsistent standards. They're frustrated and want clarity before diving deeper. Their core need isn't more definitions but a rigorous specification for what an adequate account of intelligence must deliver to resolve three concrete disputes: chatbot intelligence, superhuman AI feasibility, and dog-versus-spreadsheet inconsistency.

  The user presents eight self-devised requirements, each tied to a thought experiment. These show sophisticated autodidactic reasoning but possible blind spots. They also have three suspicions they want tested: that jaggedness conflicts with "smarter than us," that same-problem equals stored-knowledge, and that damaged-hardware is sentimental. The request is unusually structured—demanding bottom-line first, no preamble, with specific analysis steps.

  Key tensions emerge immediately. The fixed-budget rule clashes with real-world intelligence assessments where resources matter. Jagged profiles defy single-number comparisons yet "smarter than us" implies one. Most critically, the anti-circularity requirement (must tell me I'm wrong) threatens to invalidate all human-centric theories. This last point is the crux: if intelligence can't be defined independently of our preconceptions, the disputes remain unresolved.

  Dissecting their requirements:
  - Stored knowledge separation is solid but incomplete without specifying cognitive processes.
  - Resource separation is untenable—intelligence inherently involves efficient resource use; a slowed brute-force system is less intelligent by any operational standard.
  - Jaggedness must be preserved; intelligence is multidimensional, making "smarter" domain-relative.
  - Same-problem criterion is distinct from stored knowledge—it's about abstract reasoning transfer, not data access.
  - Collective intelligence needs addressing without anthropomorphizing systems like ant colonies.
  - Damaged hardware requirement stands—neurological cases prove output mechanisms aren't intelligence.
  - Anti-circularity is valid but dangerous; it risks defining intelligence into impossibility if we reject all human benchmarks.

  Adding missing requirements:
  1. **Adaptive generalization**: Must handle novel situations beyond training (case: human learning transfer vs. ML overfitting).
  2. **Goal-directedness**: Must distinguish intelligence from passive optimization (case: thermostat vs. chess AI).
  3. **Resource efficiency**: Brute force isn't intelligent; cognitive economy matters (case: human heuristics vs. exhaustive search).

  Prioritizing: Anti-circularity and generalization are non-negotiable; resource separation and fixed-budget can be dropped. Their suspicion about jaggedness conflicting with "smarter" is correct—superiority requires specifying domains. Same-problem isn't redundant; it targets cognitive flexibility. Damaged hardware isn't sentimental; it's foundational for separating capability from expression.

  Theoretical families:
  - **Psychometric (IQ-like)**: Fails jaggedness, anti-circularity, and damaged hardware.
  - **Universal problem-solving (Legg & Hutter)**: Fails same-problem (no transfer guarantee) and collections.
  - **Biological**: Fails chatbot dispute by begging the question and excludes AI.
  - **Functionalist (e.g., cognitive architectures)**: Best but struggles with collections and anti-circularity.

  Bottom line: Their anti-circularity requirement is the tripwire that collapses most theories—if intelligence must transcend human judgment, we need objective metrics not based on human performance, which may be impossible. This tension must be confronted head-on.
answer: |-
  **Your anti-circularity requirement ("must tell me I was wrong") is the critical constraint that collapses most existing theories of intelligence.** It forces a definition independent of human judgments, which most accounts fail to deliver. Below, I sort your requirements, refine them, add omissions, prioritize them, and evaluate theories. Requirements marked ★ are non-negotiable; others can be traded off.

  ---

  ### **Refined Requirements for Intelligence**
  1. **★ Separation from stored knowledge**: Must distinguish systems generating answers via computation from those merely retrieving them, even if outputs are identical. *Refined: The account must identify* causal processes *for adaptive solution-generation, not just output fidelity.*  
  2. **Separation from speed/resources**: Your fixed-budget rule is unworkable—it ignores efficiency, a core aspect of intelligence. *Droppable.* Replace with: **★ Resource efficiency**: Intelligence requires achieving goals with bounded resources (e.g., a brute-force chess program is less intelligent than AlphaZero at equal compute). *Case: Humans use heuristics to avoid exhaustive search.*  
  3. **★ Jagged profiles**: Must accommodate systems excelling in narrow domains but failing elsewhere. "Smarter than us" requires domain specification (e.g., "smarter at mathematics").  
  4. **★ Same-problem identification**: Must recognize abstract equivalence across superficial formats. *Refined: Capability for* transfer learning *or* invariant structure mapping. *Distinct from stored knowledge (e.g., solving a puzzle in textual vs. visual form requires representation-agnostic reasoning).*  
  5. **Collective intelligence**: Must clarify when group behavior (e.g., ant colonies) qualifies as intelligent. *Refined: A system is intelligent only if it exhibits* centralized or emergent goal-directed computation*. *Droppable if you accept that colonies lack agency.*  
  6. **★ Robustness to hardware**: Intelligence persists despite damaged I/O or memory (e.g., Clive Wearing’s intact reasoning despite amnesia). *Not sentimental—it isolates core cognitive function from implementation.*  
  7. **★ Anti-circularity**: Must validate against objective criteria beyond human labels. *Refined: Predictive power for* unforeseen entities*, not just humans/animals.*  
  8. **Distinction from confounds**: Must separate intelligence from wisdom (long-term judgment), character (ethics), and utility. *Refined: Focus on* adaptive problem-solving ability *as the core.*  

  #### **Added Requirements**  
  9. **★ Adaptive generalization**: Must solve truly novel problems outside training. *Case: Humans inferring physics from sparse data vs. an AI failing on distribution-shifted inputs.*  
  10. **Goal-directedness**: Must pursue objectives flexibly. *Case: A thermostat isn’t intelligent; it lacks goal reevaluation.*  

  ---

  ### **Prioritization & Conflicts**  
  - **Non-negotiable (★)**: Anti-circularity, adaptive generalization, same-problem identification, jagged profiles, robustness to hardware.  
  - **Droppable**: Resource separation (efficiency supersedes it), collective intelligence (peripheral to your disputes).  
  - **Conflict**: Jagged profiles and "smarter than us" *are incompatible without domain specification*—you must drop universal ordering.  
  - **Incompatible subset**: Anti-circularity + adaptive generalization + same-problem identification *cannot be jointly satisfied by most accounts*. Human-derived tests (e.g., IQ) fail anti-circularity; algorithmic theories (e.g., Solomonoff induction) fail same-problem transfer.  
  - **Most exclusionary requirement**: Anti-circularity—it voids psychometrics, biological accounts, and any theory relying on human performance as ground truth.  

  ---

  ### **Evaluation of Standard Theories**  
  - **Psychometric (e.g., IQ/g-factor)**: Fails jagged profiles, anti-circularity, and robustness to hardware. Scores 2/10—aligns with "smarter" but circular.  
  - **Universal problem-solving (e.g., Legg & Hutter's RL agents)**: Fails same-problem identification (no transfer guarantee) and collections. Scores 5/10—handles generalization but not anti-circularity.  
  - **Biological (e.g., neural Darwinism)**: Fails separation from hardware and chatbots dispute. Scores 3/10—explains robustness but anthropocentric.  
  - **Functionalist (e.g., cognitive architectures like ACT-R)**: Best fit—addresses same-problem, jaggedness, and generalization via computational mechanisms. Scores 7/10 but struggles with anti-circularity.  

  **Bottom line**: Keep anti-circularity, generalization, and jaggedness; drop resource separation. Suspicions confirmed: jaggedness conflicts with "smarter," but same-problem is distinct, and damaged-hardware is essential. For your disputes, functionalism supports chatbot intelligence (as limited agents) and dog/spreadsheet distinction (goal-directed learning vs. static rules), while "smarter machines" requires domain-specific claims.
