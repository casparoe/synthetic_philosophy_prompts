prompt: |-
  hey — you're a political philosopher who also knows something about market design and prediction markets, and I need you to think carefully here rather than reaching for the usual talking points. Please brainstorm a wide space of candidate precisifications first (ten or twelve, say) before deciding which are worth writing up.

  Some context. I'm in a civic-tech reading group in my city and we've been drafting a pilot proposal: for one class of decision — say, which of two versions of a zoning ordinance to adopt — the council would first formally define a welfare measure, and then conditional betting markets would pick between the options; whichever version the market estimates raises the measure more becomes law. The design is basically lifted from the futarchy page on Robin Hanson's site at GMU, where the slogan is that in futarchy "vote on values, but bet on beliefs": elected representatives define and manage an after-the-fact measurement of welfare, while speculators say which policies they expect to raise it.

  At our last meeting I raised two objections and someone shut both of them down with that one line, as if it were obviously an answer to each.

  (1) The choice of welfare measure is not a clean "value" input that gets settled before the betting begins — it's most of the actual fight. And the measure is endogenous to the policy: if you measure something like "median resident reports being satisfied with the neighborhood," a zoning change that gradually changes who can afford to live there also changes the population being measured, so the index can rise because the people who were unhappy moved out. A market can be excellent at estimating a quantity and still be answering a question nobody wanted asked.

  (2) I floated a different design: instead of betting on the measure itself, bet on what a randomly selected panel of residents would say two years later, after studying the outcome — bet on a future considered judgement rather than on a present index. Someone said that just smuggles values back into the betting and that's exactly what the slogan rules out. I dont think it does: as far as I can tell the slogan separates who fixes ends from who figures out means, and saying nothing about whether the thing you bet on has to be a hard number.

  So: what are the different precise claims "vote on values, but bet on beliefs" could be making? I want the menu, from the platitudinous to the radical. For each, a verdict — trivial, substantive and defensible, substantive but dubious, or plain false — and I want you to be explicit about which readings would actually do the work my groupmate needed: which readings, if true, would answer objection (1), which would answer objection (2), and which merely look like they answer them because they're about a different contrast (markets vs. voters as forecasters, rather than markets vs. voters as evaluators). Flag anywhere the line is doing rhetorical work the argument hasn't earned — I suspect there's a slide between "markets beat votes at aggregating information" and "markets beat votes at anything governance-related," and maybe a second one between "the market estimates expected welfare as measured" and "the market estimates what's good." And if your brainstorm turns up a reading that handles the endogenous-measure problem cleanly, say so explicitly and say what accepting it would cost.

  Please write in American English, and use these sections in this order:

  1. **Readings** — six to nine numbered precisifications, two to three sentences each, each with a one-line tag for what kind of claim it is (institutional/empirical, conceptual, normative, decision-theoretic). About 600 words.
  2. **Verdicts** — go back through the readings and tag each as trivial, substantive and defensible, substantive but dubious, or false, with a sentence or two of justification. About 300 words.
  3. **What my groupmate needed** — which reading or readings would have to be true for the slogan to answer objection (1), which for objection (2), and which only look relevant; be blunt if the answer is that nothing in the menu gets him there. About 350 words.
  4. **Leftovers from the brainstorm** — three to five readings you considered and dropped, one sentence each on why. About 150 words.
  5. **What I say at the next meeting** — four to six sentences I can read out loud without sounding like I'm lecturing anybody. About 120 words.
reasoning: |-
  Okay, the user is part of a civic-tech group discussing futarchy, specifically Robin Hanson's "vote on values, bet on beliefs" model. They raised two objections: (1) the welfare measure isn't a clean value input because it can be endogenous to the policy, and (2) their alternative design using resident panels was dismissed as smuggling values back into betting. They want a thorough analysis of possible interpretations of Hanson's slogan.

  First, I need to unpack the slogan's possible meanings. The user wants 6-9 precisifications categorized by claim type—institutional, conceptual, etc. Then verdicts on each, followed by which interpretations address their objections. Finally, some dropped ideas and talking points for their meeting.

  Starting with the readings, I consider various angles. The most straightforward is the division-of-labor view: voters set the goal, markets predict how to achieve it. But the user's first objection shows the goal isn't neutral. Then there's the idea that values are inherently subjective and can't be bet on, but beliefs are objective. That might not hold up under scrutiny. Another angle: markets aggregate information better than votes. That's plausible but doesn't solve the endogenous measure problem. 

  For the endogenous issue, maybe the slogan implies the measure is fixed and exogenous. But in practice, as the user noted, policies can change the population being measured. Their panel idea might handle that by capturing considered judgments, but their groupmate argued it smuggles values. Is that accurate? The user thinks not, since it's still about predicting an evaluation rather than setting values.

  I need to check if any interpretation cleanly solves the endogenous problem. Perhaps viewing the welfare measure as a contract specification—but that assumes it can be defined unambiguously, which is tough for complex social outcomes. Or the idea that values are preference-independent, which seems dubious. Most readings either don't address the problem or fail to resolve it.

  For verdicts, the division-of-labor view is defensible but oversimplified. The claim that values can't be bet on is dubious because any measure involves interpretation. The info aggregation claim is defensible but doesn't cover evaluation. 

  Assessing what their groupmate needed: for objection (1), reading 7 (measure as exogenous) would need to be true, but it's false in reality. For objection (2), reading 3 (values non-bettable) is used to dismiss the panel idea, but it's dubious. Neither objection is fully answered by the slogan alone.

  Dropped readings include purely normative claims or those conflating aggregation methods. For the meeting, the user should emphasize that the slogan doesn't resolve the endogenous measure issue and that their panel design might actually align with separating values from predictions.
answer: |-
  Here's a breakdown of the "vote on values, bet on beliefs" slogan, designed to tackle your specific objections rigorously.

  **1. Readings**

  1.  **Division of Labor (Institutional):** Political institutions should assign the task of defining societal goals ("values") to elected representatives (voting) and the task of identifying the best means to achieve those pre-defined goals ("beliefs" about causal effects) to prediction markets. *Contrast: Who does which job.*
  2.  **Epistemic Separation (Conceptual):** "Values" (ultimate ends, goals, welfare functions) are inherently subjective or normative and cannot be objectively estimated. "Beliefs" (predictions about states of the world, causal relationships) are factual and *can* be objectively estimated. Markets handle the latter. *Contrast: Nature of what's being decided.*
  3.  **Non-Bettability of Values (Conceptual/Empirical):** It's impossible or highly inefficient to run a meaningful market directly on subjective value judgments ("what is good?"). Markets excel only at forecasting verifiable, objective outcomes. Values must be settled externally (by vote) before betting begins. *Contrast: What markets can/can't handle.*
  4.  **Superior Information Aggregation (Empirical):** Prediction markets demonstrably aggregate dispersed information and produce more accurate forecasts of future events than voting or deliberation on those same factual questions. Use markets where forecasting accuracy matters most. *Contrast: Effectiveness at aggregating information.*
  5.  **Means-End Distinction (Decision-Theoretic):** Good decision-making requires clearly separating the specification of the utility function (values) from the estimation of the expected utility of different actions (beliefs). Voting fixes the utility function; markets estimate expected utility. *Contrast: Components of rational choice.*
  6.  **Avoiding Motivated Reasoning in Means (Normative/Empirical):** Voters/politicians are prone to bias and motivated reasoning when assessing how to achieve goals, letting desired outcomes cloud factual judgments. Isolating belief aggregation to markets reduces this distortion. *Contrast: Vulnerability to bias in assessment.*
  7.  **Exogeneity of Measure (Conceptual/Institutional):** The welfare measure must be defined such that it is *exogenous* to the policies being evaluated – the policy shouldn't systematically change the population or context being measured in a way that invalidates the measure's intended meaning. The slogan assumes this is possible and handled in the "vote on values" step. *Contrast: Requirement for measure validity.*
  8.  **Values as Preference-Independent (Conceptual):** True "values" are fundamental, unchanging preferences. The welfare measure operationalizes these. Policy changes don't alter these core values, only beliefs about satisfying them. The measured outcome reflects success *given* fixed values. *Contrast: Stability of values vs. context.*
  9.  **Market as Causal Estimator (Empirical/Conceptual):** Prediction markets are uniquely good at estimating the *causal effect* of a policy (Policy A vs. Policy B) on a pre-defined, measurable outcome Y. They answer "Which policy causes Y to be higher?". *Contrast: Task assigned to markets.*

  **2. Verdicts**

  1.  **Division of Labor:** **Substantive and Defensible.** A clear institutional proposal, though its success depends entirely on the feasibility of cleanly separating and defining values vs. beliefs in practice.
  2.  **Epistemic Separation:** **Substantive but Dubious.** While useful as an idealization, the line between "fact" and "value" is often blurry in policy (e.g., defining "welfare" involves normative choices masquerading as facts). Treating values as *purely* non-factual is an oversimplification.
  3.  **Non-Bettability of Values:** **Substantive and Defensible (for direct markets).** Markets struggle with inherently subjective questions lacking clear resolution. However, markets *can* bet on *proxies* for values (like your panel), which is the core of your objection (2).
  4.  **Superior Information Aggregation:** **Substantive and Defensible (for specific factual questions).** Strong evidence supports markets' forecasting edge over votes/deliberation *for well-defined, resolvable future events*. This doesn't automatically extend to complex welfare estimation.
  5.  **Means-End Distinction:** **Trivial (as abstraction), Substantive but Dubious (in practice).** Rational choice theory requires this separation, but real-world policy decisions constantly blur means and ends. Defining a clean "end" (welfare measure) is the hard part.
  6.  **Avoiding Motivated Reasoning:** **Substantive and Defensible.** This is a key motivation for futarchy. Voters *are* often biased means-evaluators. However, markets have their own biases (e.g., wealth effects, manipulation risk).
  7.  **Exogeneity of Measure:** **Substantive but Often False (in practice).** This reading *would* solve your objection (1) *if* true. However, for many crucial social welfare measures (like satisfaction, health equity, economic mobility), policies demonstrably change the measured population or context, violating exogeneity. Assuming it's easy is unrealistic.
  8.  **Values as Preference-Independent:** **Plain False.** Preferences and values demonstrably adapt to circumstances, policies, and information (endogenous preferences). The idea that core values remain fixed while only beliefs change is psychologically and philosophically untenable for many policy domains. Directly contradicts your objection (1).
  9.  **Market as Causal Estimator:** **Substantive and Defensible (in principle, context-dependent).** Well-designed prediction markets *can* estimate causal effects *if* the outcome is measurable and the policy contrast is clear. However, this depends critically on the validity of the measure (Reading 7) and market design.

  **3. What My Groupmate Needed**

  *   **Answering Objection (1) (Endogenous Measure):** Your groupmate needed **Reading 7 (Exogeneity of Measure)** to be true. If the welfare measure *can* be defined exogenously (policy doesn't alter the validity context), then the market *is* answering the intended question. **However,** as the verdict states, this is often false in practice, especially for socio-economic measures like satisfaction or equity. The slogan *assumes* exogeneity is achievable via the "vote on values" step, but provides no mechanism to ensure it. **Nothing in the slogan or standard futarchy proposals cleanly solves this endogenous measure problem.** Accepting Reading 7 "solves" it only by assuming the hardest part away, which is unrealistic.
  *   **Answering Objection (2) (Panel as Value Smuggling):** Your groupmate invoked **Reading 3 (Non-Bettability of Values)**. They argued that betting on a future panel judgment is still betting on a "value" (because the panel makes a judgment) and thus violates the separation mandated by the slogan. **This relies on a narrow interpretation where "bet on beliefs" only means bet on objective, non-judgmental metrics.** Your counter (betting on a future *evaluation* is still betting on a *belief about what that evaluation will be*) aligns better with **Reading 5 (Means-End Distinction)** and **Reading 9 (Market as Causal Estimator)**: The panel's judgment *is* the operationalized welfare measure (the "end" or "Y"), set by the vote. The market is estimating which policy *causes* this measure to be higher. Their objection only holds if "values" means *only* the abstract concept, not its operationalization. The slogan doesn't specify this.
  *   **Looks Relevant but Isn't:** **Reading 4 (Superior Information Aggregation)** is often rhetorically slid into implying markets are better at *everything* governance-related, including defining what's good. It addresses the *efficiency* of markets vs. votes as forecasters, not the *conceptual separation* of values and beliefs or the *validity* of what's being forecast (your objection 1). **Reading 8 (Preference-Independence)** might be invoked to dismiss endogeneity concerns, but it's empirically false.

  **4. Leftovers from the Brainstorm**

  *   *Reading:* "Markets reveal true preferences." **Dropped:** Revealed preference theory is controversial, especially for social welfare; markets reveal willingness to bet, not necessarily fundamental values.
  *   *Reading:* "Voting is inherently irrational for beliefs." **Dropped:** Too strong; voting can aggregate beliefs reasonably under certain conditions, though often sub-optimally.
  *   *Reading:* "Futarchy minimizes rent-seeking on belief questions." **Dropped:** While a potential benefit, it's derivative of Readings 4 & 6, not a core precisification of the slogan itself.
  *   *Reading:* "Beliefs are about probability, values are about utility." **Dropped:** This is covered by and subsumed under Reading 5 (Means-End Distinction).
  *   *Reading:* "The slogan is purely metaphorical." **Dropped:** While it *functions* rhetorically, Hanson clearly intends it as a literal institutional prescription.

  **5. What I Say at the Next Meeting**

  "Thanks for pushing on this. The 'vote on values, bet on beliefs' slogan packs a lot of ideas. My concern is that it doesn't magically solve the endogenous measure problem – where the policy changes who or what we're measuring. To handle that, we'd need a welfare measure completely unaffected by the policies, which is often impossible for things like resident satisfaction. The slogan just assumes we can define such a measure. Regarding the panel idea, betting on future considered judgments isn't 'smuggling values' back in; it's defining the welfare measure *as* that judgment, set by the vote. The market then predicts *which policy leads to a better judgment*. The slogan's core separation – voters define the goal, markets predict how to reach it – still holds."
