  ### Coding Protocol: Decision Tree for Societal Disruption Episodes

  **Pre-Declaration (Mandatory Before Branching)**  
  The coder must specify:  
  - **Patient**: The entity under examination (e.g., state, settlement system, administrative technology, religious institution, population welfare).  
  - **Territory**: Geographic scope of the episode.  
  - **Bandwidth**: Temporal window for assessment (e.g., 50, 100, or 200 years).  

  **Branch Nodes**  
  1. **Trough Test (Integration Register)**:  
     *Question*: Did the level of integration (settlement hierarchy, administrative reach, craft specialization, or long-distance exchange volume/range) at the end of the bandwidth fall below 50% of its start level and remain below 50% for ≥25% of the bandwidth?  
     → *Branches*: Yes / No  

  2. **Scale Relativity (Integration Register)**:  
     *Question*: Was the decline (if Node 1=Yes) or stability (if Node 1=No) observed uniformly across the territory, or only at higher scales (e.g., state) with stability/growth at lower scales (e.g., household)?  
     → *Branches*: Uniform / Higher-level only  

  3. **Legibility Loss (Legibility Register)**:  
     *Question*: Did writing, accounting, or metrological standards cease to be used in ≥50% of the territory for ≥25% of the bandwidth?  
     → *Branches*: Yes / No  

  4. **Welfare Decline (Welfare Register)**:  
     *Question*: Did ≥2 welfare indicators (mortality, nutrition, stature, fertility) show sustained decline (≥20% from start, not recovering to within 10% within bandwidth) for ≥25% of the bandwidth?  
     → *Branches*: Yes / No  

  5. **Register Conflict Resolution**:  
     *Question*: If Nodes 1, 3, and 4 conflict (e.g., integration decline but welfare improvement), which register changed most severely (greatest % decline over longest duration)?  
     → *Branches*: Integration / Legibility / Welfare  

  6. **Self-Description Register**:  
     *Question*: Do near-contemporary written sources (≤100 years post-event) describe the episode as a loss or collapse?  
     → *Branches*: Yes / No / No sources  

  7. **Testimonial Discount**:  
     *Question*: If Node 6 ≠ "No sources," are surviving sources from successor elites with vested interests?  
     → *Branches*: Yes (biased) / No (unbiased) / No sources  

  8. **Recovery Test (Reversible-but-not-reversed)**:  
     *Question*: Post-trough, was the pre-episode integration level materially achievable (resources/knowledge available) but not resumed within the bandwidth?  
     → *Branches*: Yes / No  

  ---

  **Leaf Verdicts and Justifications**  
  *Based on combinatorial logic of nodes; "awkward consequence" denotes theoretical trade-offs.*  

  | **Path** | **Verdict** | **One-Line Justification** | **Defining Commitment** | **Awkward Consequence** |
  |----------|-------------|----------------------------|-------------------------|-------------------------|
  | **Leaf 1**: Node 1=No, Node 8=No | **Neither** | No sustained decline and system resumed/not abandoned. | Focuses on reversibility without structural change. | Overlooks transformations without decline (e.g., voluntary simplification). |
  | **Leaf 2**: Node 1=No, Node 8=Yes | **Transformation** | System abandoned without decline despite achievability. | Change is driven by agency, not collapse dynamics. | May misattribute collapse aversion to choice (e.g., if welfare pressures exist). |
  | **Leaf 3**: Node 1=Yes, Node 8=No, Nodes 3/4=No | **Neither** | Reversed/irreversible decline without legibility/welfare loss. | Demands multisystem failure for collapse. | Codes shallow crises as "neither" despite disruption (e.g., short state collapse). |
  | **Leaf 4**: Node 1=Yes, Node 8=No, Nodes 3/4=Yes (either) | **Collapse** | Irreversible decline with legibility/welfare loss. | Requires material unsustainability. | Excludes cases where elites retain legibility but system collapses (e.g., post-invasion). |
  | **Leaf 5**: Node 1=Yes, Node 8=Yes, Node 5=Integration | **Transformation** | Old system not resumed despite achievability; integration loss dominates. | Privileges reconfigurations over recovery. | May code elite collapse as transformation even with mass suffering (e.g., Node 4=Yes). |
  | **Leaf 6**: Node 1=Yes, Node 8=Yes, Node 5=Legibility/Welfare | **Collapse** | Old system not resumed with severe legibility/welfare loss. | Collapse requires non-recovery and human cost. | Ignores cases where integration persists but welfare collapses (rare; unoccupied). |
  | **Leaf 7**: Nodes 6=Yes, 7=No (unbiased) | **Collapse (Corroborated)** | Contemporary unbiased accounts confirm collapse. | Values witness testimony as decisive. | Overweights rare unbiased sources; discounts archaeological proxies. |
  | **Leaf 8**: Nodes 6=Yes, 7=Yes (biased) | **Transformation** | "Collapse" narrative reflects successor agendas. | Skepticism toward elite claims of loss. | May misread genuine collapse as propaganda (e.g., if Node 4=Yes). |

  **Unoccupied Combinations**:  
  - **Integration persistence amid legibility/welfare collapse** (Node 1=No, Node 3=Yes, Node 4=Yes): Logically incoherent; integration requires legibility.  
  - **Uniform welfare collapse without integration decline** (Node 1=No, Node 4=Yes, Node 5=Welfare): Unattractive; welfare collapse typically coincides with integration loss.  

  **Collapse Averted**: Not a leaf. Indicates mis-specification (e.g., bandwidth too short or patient too narrow). Use to recalibrate pre-declaration.  

  **Indistinguishable Leaves**:  
  - **Leaves 4 and 6** (both collapse) if Node 5=Legibility/Welfare. Scale relativity (Node 2) justifies but doesn't alter verdict.  
  - **Leaves 2 and 5** (both transformation) if Node 8=Yes and no welfare/legibility loss. Self-description (Nodes 6–7) breaks ties.  

  ---

  ### Validation with Episodes  
  *Facts treated as stipulated. Disagreements flagged where coders might diverge on evidence interpretation.*  

  **Episode A: Eastern Mediterranean, 1200 BCE**  
  - *Pre-declaration*: Patient = State (palace-administered systems). Territory = Aegean and Anatolia. Bandwidth = 150 years (1200–1050 BCE).  
  - *Path*:  
    1. Trough Test: **Yes** (integration <50%; palaces abandoned).  
    2. Scale Relativity: **Uniform** (state-level collapse territory-wide).  
    3. Legibility Loss: **Yes** (Linear B extinct).  
    4. Welfare Decline: **Yes** (settlement decline → inferred nutrition/mortality loss).  
    5. Conflict Resolution: Skipped (registers align).  
    6. Self-Description: **No sources** (no contemporary texts).  
    7. Testimonial Discount: **No sources**.  
    8. Recovery Test: **No** (palace system unachievable; knowledge lost).  
  - *Verdict*: **Collapse** (Leaf 4: Irreversible decline with legibility/welfare loss).  
  - *Justification*: State collapse, administrative extinction, and welfare decline without recovery.  
  - *Disagreements*: Welfare (Node 4) if settlement decline ≠ welfare loss; Recovery (Node 8) if knowledge retained but not used.  

  **Episode B: Southern Maya Lowlands, 800–950 CE**  
  - *Pre-declaration*: Patient = Ritual/political institution (divine kingship). Territory = Southern lowlands. Bandwidth = 150 years (800–950 CE).  
  - *Path*:  
    1. Trough Test: **Yes** (integration <50%; monuments/kingship abandoned).  
    2. Scale Relativity: **Uniform** (institution collapsed territory-wide).  
    3. Legibility Loss: **Yes** (writing/stela cult extinct).  
    4. Welfare Decline: **Yes** (population decline → inferred mortality/fertility loss).  
    5. Conflict Resolution: Skipped.  
    6. Self-Description: **No sources** (no post-collapse texts).  
    7. Testimonial Discount: **No sources**.  
    8. Recovery Test: **No** (kingship unachievable; environmental/social constraints).  
  - *Verdict*: **Collapse** (Leaf 4: Irreversible decline with legibility/welfare loss).  
  - *Justification*: Ritual institution collapse, legibility extinction, and welfare decline without recovery.  
  - *Disagreements*: Recovery (Node 8) if northern Maya success proves achievability; Welfare (Node 4) if migration explains population decline.  

  **Episode C: Soviet Dissolution, 1991**  
  - *Pre-declaration*: Patient = State (Soviet Union). Territory = USSR. Bandwidth = 20 years (1991–2011).  
  - *Path*:  
    1. Trough Test: **Yes** (integration <50%; state disintegrated).  
    2. Scale Relativity: **Uniform** (state collapse territory-wide).  
    3. Legibility Loss: **Yes** (command economy/party apparatus abolished).  
    4. Welfare Decline: **No** (life expectancy drop <20%; no second indicator).  
    5. Conflict Resolution: **Integration** (most severe: state dissolution).  
    6. Self-Description: **Yes** (sources describe "collapse").  
    7. Testimonial Discount: **Yes** (biased; successor elites).  
    8. Recovery Test: **Yes** (achievable but not resumed).  
  - *Verdict*: **Transformation** (Leaf 5: Old system not resumed; integration loss dominates).  
  - *Justification*: State collapse and legibility loss, but no welfare collapse and recovery possible yet not pursued.  
  - *Disagreements*: Welfare (Node 4) if fertility/nutrition data imply decline; Recovery (Node 8) if post-Soviet systems preclude achievability.  

  **Disagreement Analysis**:  
  - All episodes show coder disagreements (A: welfare/recovery; B: recovery; C: welfare/recovery). This reflects **real conceptual tensions**, not tree defects: e.g., "reversible-but-not-reversed" (Node 8) is inherently interpretive.  
  - Tree resolves disagreements by requiring explicit evidence (e.g., Node 4’s 20% threshold avoids vague "suffering" claims).  

  **Final Note**: Protocol distinguishes collapse (systemic failure) from transformation (reconfiguration) by demanding multisystem decline, non-recovery, and evidence separation. "Collapse averted" indicates bandwidth/patient mismatch.
