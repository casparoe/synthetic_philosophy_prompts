  ### Confidence Ratings and Dissenters' Views  
  **Confidence in Recommendations:**  
  - **Ardent (Not Designated)**: 85% confidence. P3 is a strong analog, and Ardent's domain-bound failure is clear.  
  - **Ledger (Not Designated)**: 70% confidence. P8 is analogous, but the panel might see the model as the "core" (lower confidence due to novelty).  

  **Views of P4 Dissenters (from P4 ruling):**  
  - **Position in P4**: Argued P4 should not be designated because it has "no goals, no world, and nothing at stake," being a "statistical table." They emphasized AG/EW criteria.  
  - **On Ardent**:  
    - **Oppose designation**. Ardent has no goals/persistence (like P4) and is even narrower. They would argue it lacks "world engagement" and is purely reactive.  
    - **Attractiveness of position**: Less attractive after P4 and P6/P7. P4's designation weakened AG/EW, and Ardent offers no new support for their view.  
  - **On Ledger**:  
    - **Split view**. The wrapper adds goals (standing objective) and persistence (memory), so they might support designation. However, the inner model is still a "statistical table," so they could argue intelligence is superficial.  
    - **Attractiveness of position**: More attractive for Ledger, as the wrapper adds AG-like features. But since P4 established AG isn't required, their stance remains minority.  
  - **Overall**: Their position is less attractive post-P4 (AG/EW not adopted by the panel) but gains relevance in hybrid cases like Ledger.  

  **Final Thoughts**: The criteria (A, RT, NHC) best explain the precedents, leading to non-designation for both applications. P3 and P8 provide the closest analogs, though Ledger's hybrid nature invites a novel principle. The dissenters' moral/sentience concerns remain marginal to the statutory test.
