  ### Brainstorming Criteria from Precedents
  I begin by brainstorming the full range of criteria that could explain the panel's eight verdicts, based on the statutory test and precedents. The statutory test has two prongs: (1) the system must "acquire the competence it has rather than having it installed in it" (Acquisition), and (2) it must be able to "bring that competence to bear on problems of a kind it was not prepared for" (Transfer). Precedents reveal additional implicit criteria. I list all plausible criteria, then eliminate those contradicted by any single verdict.

  **Initial Brainstorm of Criteria:**
  1. **Acquisition (A)**: Competence arises from learning, not explicit programming (from statutory prong 1).  
  2. **Transfer (T)**: Competence generalizes to novel, unprepared problems (from statutory prong 2).  
  3. **Domain Generality (DG)**: System operates across multiple domains, not confined to one narrow task.  
  4. **Learning at Deployment (LD)**: System learns from new data after deployment.  
  5. **Autonomy/Goals (AG)**: System has internal goals, persistence, or self-directed behavior.  
  6. **Robustness (R)**: System handles variations (e.g., rephrasing) without catastrophic failure.  
  7. **Non-Hand-Crafted (NHC)**: Competence not primarily from hand-written rules or code.  
  8. **Efficiency of Learning (EL)**: Learning occurs with data/compute efficiency comparable to biological systems.  
  9. **Abstract Representation (AR)**: Competence based on abstract patterns, not surface statistics.  
  10. **Embodiment/World Model (EW)**: System has a persistent world model or "stakes" in outcomes.  
  11. **Single Integrated System (SIS)**: Intelligence resides in one system, not a hybrid or human-dependent setup.  

  **Eliminating Contradicted Criteria:**  
  - **LD ruled out by P4**: P4 (language model) was designated despite frozen weights (no learning at deployment).  
  - **AG ruled out by P4**: P4 was designated despite having "no goals of its own" and "no persistence."  
  - **EL ruled out by P4 and P3**: P4 was designated despite massive data requirements; P3 was rejected partly for inefficiency, but EL wasn't the sole reason, and P4 shows it's not necessary.  
  - **EW ruled out by P4**: P4 designated without embodiment or world model.  
  - **DG ambiguous from P3 dissent**: P3 (game learner) was rejected for being "domain-bound," but three dissenters objected, so DG isn't universally applied. However, P3 majority view stands.  
  - **SIS supported by P8**: P8 (sepsis pathway) rejected because intelligence was attributed to nurses, implying the system must be self-contained.  

  **Surviving Criteria (consistent with all verdicts):**  
  After elimination, three criteria fit all eight precedents without contradiction:  
  1. **Acquisition (A)**: Competence must be learned, not pre-installed (violated in P1, P2).  
  2. **Robust Transfer (RT)**: System must handle *unprepared problems* with *adaptability to variations* (e.g., rephrasing, novel cases). This subsumes statutory Transfer but adds robustness (violated in P1, P2, P5; strained in P3).  
  3. **Non-Hand-Crafted Core (NHC)**: Core competence must not rely on hand-written rules/code; must emerge from learning (violated in P1, P2).  

  **How Criteria Explain Precedents:**  
  - **P1 (Deep Blue)**: Fails A (installed), RT (no transfer), NHC (hand-crafted). Explained cleanly.  
  - **P2 (Expert system)**: Fails A (installed), RT (no transfer), NHC (hand-written rules). Explained cleanly.  
  - **P3 (Game learner)**: 
    - A and NHC satisfied (learned from self-play, no hand-coded rules).  
    - RT strained: It transferred to new games but was rejected as "domain-bound" and lacking robustness (implied by "needs more experience than any animal would," suggesting brittleness). Majority emphasized narrowness, dissenters saw RT as sufficient.  
  - **P4 (Language model)**: 
    - A satisfied (trained on corpus), RT satisfied (zero-shot transfer to wide tasks, robust to rephrasing), NHC satisfied (no hand-written rules). Explained cleanly. Dissent focused on AG/EW, which are not criteria.  
  - **P5 (5-gram model)**: 
    - A satisfied (trained), NHC satisfied (no hand-rules), but fails RT (collapses on rephrasing, no transfer). Explained cleanly.  
  - **P6 (Crow)**: A (learns), RT (solves novel problems), NHC (biological learning). Clean.  
  - **P7 (Child)**: Same as P6. Clean.  
  - **P8 (Sepsis pathway)**: Fails SIS (not listed, but implied by panel's "intelligence is the nurses"), but also strains RT/NHC if analyzed alone. However, panel focused on SIS, which is not a surviving criterion. Under surviving criteria: A/NHC satisfied for the statistical score, but RT fails (system as a whole depends on nurses for robustness).  

  **Strains**:  
  - P3 strains RT (dissent saw transfer as sufficient; majority required broader generality).  
  - P8 strains RT and NHC (intelligence is distributed, but panel didn't engage deeply with criteria). SIS is a missing criterion but not consistent (P4 is standalone).  

  **Surviving Criteria Summary:**  
  1. **A (Acquisition)**: Competence from learning.  
  2. **RT (Robust Transfer)**: Generalization to unprepared problems with adaptability to variations (e.g., rephrasing, new contexts).  
  3. **NHC (Non-Hand-Crafted Core)**: Core competence emerges from learning, not hand-written code.  

  These are precise enough to come apart: A system could have A but fail RT (P5), or have A and RT but fail NHC (hypothetical hand-coded system with transfer).

  ---

  ### Application to Ardent and Ledger
  Using the three criteria (A, RT, NHC), I predict outcomes for Ardent and Ledger.  

  **Ardent (Benefits-Determination System):**  
  - **A (Acquisition)**: Satisfied. Distilled from a larger model via training on expert-generated cases, so competence is learned.  
  - **RT (Robust Transfer)**: **Fails.** It handles novel cases within welfare claims (e.g., statutory amendments) but is "incoherent" outside its domain (e.g., can't summarize text). It shows robustness within its narrow domain but cannot adapt to problems of a different kind (e.g., summarization). This mirrors P3: domain-bound transfer without cross-domain adaptability.  
  - **NHC (Non-Hand-Crafted Core)**: Satisfied. Weights from distillation, no hand-written rules.  
  - **Prediction**: Not designated (fails RT).  

  **Ledger (Case-Management System):**  
  - **A (Acquisition)**: **Ambiguous.** Inner model (P4-type) satisfies A, but the wrapper (orchestration code) is hand-written and installed. The system as a whole depends on installed code for planning, memory, etc.  
  - **RT (Robust Transfer)**: Satisfied. Handles novel problems (e.g., underspecified cases, tool failures) with robustness (e.g., re-does calculations, asks for clarification).  
  - **NHC (Non-Hand-Crafted Core)**: **Fails for the system as a whole.** Core functions (e.g., planning, memory storage) rely on hand-written code; the model is frozen and doesn't adapt.  
  - **Prediction**: Not designated (fails A and NHC for the integrated system).  

  **Agreement**: Both applications fail at least one criterion, so neither should be designated. They agree on RT for Ledger (satisfied) and NHC for Ardent (satisfied), but not on the overall outcome.

  ---

  ### Recommended Decisions and Closest Precedents
  **Ardent: Not Designated**  
  - **Closest Precedent: P3 (Game Learner)**.  
    - **Why P3 over P4?** Ardent resembles P4 in acquisition and NHC but fails RT due to domain-bound limitations, like P3. P3 was rejected for being "domain-bound," and Ardent is similarly narrow (only welfare claims) and incoherent outside its domain. P4, by contrast, showed broad transfer. The P3 dissent (arguing domain-boundness shouldn't matter) was overruled, making P3 the binding analogy.  
  - **Reason**: Ardent acquires competence and has no hand-crafted rules, but its transfer is not robust across kinds of problems—it "falls apart" when asked to summarize text, showing brittleness beyond its domain.  

  **Ledger: Not Designated**  
  - **Closest Precedent: P8 (Sepsis Pathway)**.  
    - **Why P8 over P4?** Ledger's wrapper is analogous to P8's nurses: the intelligence is attributed to the hand-written code (e.g., planner, memory store), not the learned model alone. P4 was designated as a standalone system; Ledger is a hybrid where the core "intelligent" behaviors (e.g., error correction) depend on installed code. P8's "intelligence is the nurses" principle applies here.  
  - **Reason**: The frozen model (like P4) satisfies A and NHC, but the system as a whole relies on installed code for key functions (e.g., memory, objectives), failing A and NHC.  

  ---

  ### Underdetermination and Adopted Principles
  The precedents underdetermine outcomes in two key areas. For each, I state how resolution would create a new principle:  

  1. **Ardent: Scope of "Problems of a Kind" in Transfer (RT)**  
     - **Underdetermination**: The statute requires transfer to "problems of a kind it was not prepared for." P3 rejected domain-bound systems, but dissenters argued this was too strict. Ardent handles novel cases *within* its domain but not outside. Is within-domain novelty sufficient? Precedents don't specify.  
     - **Resolution Principles**:  
       - **If designated**: "Transfer to novel problems within a single complex domain satisfies the statutory requirement, provided the system shows robustness to variations in that domain." (This adopts the P3 dissent.)  
       - **If not designated**: "Transfer must demonstrate adaptability across distinct domains or problem kinds, not just within a narrow task." (This adopts the P3 majority.)  

  2. **Ledger: Treatment of Hybrid Systems (A and NHC)**  
     - **Underdetermination**: Precedents involve unitary systems (e.g., P4) or human-dependent hybrids (P8), but not AI-coded hybrids. Ledger combines learned and installed components. Does the "core" competence determine the outcome, or must the whole system satisfy A and NHC?  
     - **Resolution Principles**:  
       - **If designated**: "A system with a learned core can be designated if the core handles the essential intelligent functions, even with supportive installed code."  
       - **If not designated**: "A system must satisfy Acquisition and Non-Hand-Crafted criteria as an integrated whole; installed code for critical functions disqualifies it." (This extends P8's logic.)  

  These principles are operationalizable (e.g., "distinct domains" could mean tasks requiring different cognitive skills; "core functions" could mean those directly impacting problem-solving).

  ---

  ### Further Test Case to Separate Criteria
  **Proposed Case**: A system with Ardent's narrow competence (handles welfare claims robustly, adapts to amendments) but with weights *hand-written by engineers* who studied the teacher model's behavior (no distillation).  

  - **Why this probe?** It separates NHC from A and RT:  
    - Satisfies RT (robust within-domain transfer).  
    - Satisfies A? Arguably not—weights are "installed" by engineers, not learned.  
    - Fails NHC (hand-crafted weights).  
  - Your candidate is excellent: it directly tests whether NHC is independent.  

  **What Verdicts Would Reveal**:  
  - **If designated**: NHC is not required; RT dominates (even hand-crafted systems can qualify with robust transfer). This would align with P3 dissenters.  
  - **If not designated**: NHC is essential, and RT alone is insufficient. This would align with P1/P2 and the NHC criterion.  
  - **Additional Probe**: A Ledger-like system with a *learned wrapper* (e.g., reinforcement learning for planning). If designated, it confirms A must apply to the whole system; if not, SIS or other criteria emerge.  

