  1. **Acquisition vs. Installation (A)**: The system must acquire its competence through learning (as opposed to having it pre-installed by programmers). This is directly from the statute.

  2. **Transfer (B)**: The system must be able to handle problems of a kind it was not prepared for (i.e., it must show transfer beyond its training).

