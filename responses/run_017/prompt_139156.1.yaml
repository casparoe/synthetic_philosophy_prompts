  4. **Learning at Deployment (LD)**: The system must be capable of learning from new data after deployment. However, P4 was designated even though its weights were frozen (so no learning at deployment). The majority in P4 said they do not require ongoing learning.

  5. **Autonomy / Goals (AG)**: The system must have its own goals and autonomy. This is suggested by the dissent in P4 and by the designation of the crow and the child (which have goals). Also, P8 was rejected because the intelligence was in the nurses.

  6. **Robustness (R)**: The system must be robust to variations in problem presentation (e.g., rephrasing). This is from P5, which collapsed when phrasing was changed.

  7. **Competence Source (CS)**: The competence must not come from hand-written rules. P1 and P2 were rejected because they were hand-crafted. P4 was designated because it had no hand-written rules.

  8. **Efficiency of Learning (EL)**: The system must learn efficiently (like an animal). This was a ground in P3 (needed too many games).

  9. **Internal Representation (IR)**: The system must have internal representations that are not just surface statistics. P5 was rejected for being surface statistics.

  10. **Embodiment / World (EW)**: The system must be embodied or have a world model. This is from the dissent in P4 and the designation of the crow and child.

