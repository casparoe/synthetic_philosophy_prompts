  ### Ethics and Public Life: Decision Tree Handout  
  **Working Title:** "You got someone to believe something false without saying anything false. Now who are you?"  
  **Anchor Case:** Priya is asked by her department chair whether she supports reappointing a colleague whose grant money is the only thing keeping the PhD line alive. She thinks he's a terrible teacher and a worse colleague. She answers, truthfully, "I have no objection to the reappointment paperwork going forward" — knowing the chair will hear that as endorsement, since in this department nobody ever says anything positive out loud.  

  **Shared Starting Commitment:**  
  - A speaker deliberately gets a hearer to believe something false.  
  - Every sentence the speaker utters is true (or the speaker says nothing at all).  
  - The speaker could have asserted the falsehood directly.  

  **Instructions:** Answer each question based on concrete scenarios. Your answers will sort you into one of seven ethical views. At each leaf, the view’s "awkward commitment" (what its defenders must accept) and its verdict on Priya’s case are provided.  

  ---

  ### Decision Tree  
  **Node 1: Did the speaker use words to cause the false belief?**  
  - **No (pure setup):** Go to Node 2.  
    *Example: Priya says nothing but plants fake evidence suggesting the colleague is well-liked.*  
  - **Yes:** Go to Node 3.  

  **Node 2 (pure setup): Was there a convention or role (e.g., poker, bargaining) allowing such setups?**  
  - **Yes:** Go to Leaf E (Role-Relative View).  
  - **No:** Go to Node 9.  

  **Node 3 (verbal): Was the speaker asked a direct question about the false belief?**  
  - **Yes (e.g., "Do you support reappointing him?"):** Go to Node 4.  
  - **No (e.g., Priya volunteers her statement):** Go to Node 5.  

  **Node 4 (direct question): If the hearer pressed, "So, are you saying P?" would the speaker have lied?**  
  - **Yes (she’d assert the falsehood):** Go to Node 6.  
  - **No (she’d stay silent/be honest):** Go to Node 7.  

  **Node 5 (not direct): If a different hearer (e.g., an insider) heard the same words, would they likely be misled?**  
  - **No (only a gullible hearer is fooled):** Go to Node 8.  
  - **Yes (most hearers would be fooled):** Go to Node 10.  

  **Node 6 (would lie if pressed): Does this counterfactual make the actual act equivalent to lying?**  
  - **Yes:** Go to Leaf B (Equivalence View).  
  - **No:** Go to Leaf C (Lying Is Worse View).  

  **Node 7 (wouldn’t lie if pressed): Did the speaker pick this phrasing partly to deny lying later?**  
  - **Yes:** Go to Node 11.  
  - **No:** Go to Node 12.  

  **Node 8 (audience-relativity): If the hearer hadn’t been fooled, would the act still be wrong?**  
  - **No (wrongness requires actual deception):** Go to Leaf A (Assertion-Only View).  
  - **Yes (act is wrong even if no one is fooled):** Go to Node 10.  

  **Node 9 (pure setup, no convention): Is this act as bad as lying?**  
  - **Yes:** Go to Leaf B (Equivalence View).  
  - **No:** Go to Leaf A (Assertion-Only View).  

  **Node 10 (not direct, or act stands alone): Is lying morally worse than other deception?**  
  - **Yes:** Go to Leaf C (Lying Is Worse View).  
  - **No:** Go to Leaf D (Misleading Can Be Worse View).  

  **Node 11 (wanted deniability): Does wanting deniability make the act worse than lying?**  
  - **Yes:** Go to Leaf D (Misleading Can Be Worse View).  
  - **No:** Go to Leaf C (Lying Is Worse View).  

  **Node 12 (no deniability motive): Does the fact that implicatures vanish under scrutiny make this less bad?**  
  - **Yes (audit asymmetry):** Go to Leaf C (Lying Is Worse View).  
  - **No:** Go to Leaf B (Equivalence View).  

  ---

  ### Leaves (Ethical Views)  
  **Leaf A: Assertion-Only View**  
  - **Awkward Commitment:** Must accept that deliberately causing false belief with true assertions (or silence) is not lying and may be permissible even when lying is forbidden.  
  - **Priya Case:** Not lying, so less bad than lying. May still be wrong if it violates sincerity norms.  

  **Leaf B: Equivalence View**  
  - **Awkward Commitment:** Must hold that all intentional deception is equally wrong, whether by lying, implication, or silence.  
  - **Priya Case:** Just as bad as lying.  

  **Leaf C: Lying Is Worse View**  
  - **Awkward Commitment:** Must hold that lying uniquely violates a "warranty of truth" in assertion, making non-lying deception less bad even if equally harmful.  
  - **Priya Case:** Less bad than lying because she didn’t assert falsehood, but still wrong.  

  **Leaf D: Misleading Can Be Worse View**  
  - **Awkward Commitment:** Must hold that using truth to deceive can show greater moral corruption (e.g., cowardice or manipulation) than lying.  
  - **Priya Case:** Worse than lying because she evaded directness while deceiving.  

  **Leaf E: Role-Relative View**  
  - **Awkward Commitment:** Must hold that the same act is permissible in contexts with conventions (e.g., bargaining) but wrong elsewhere.  
  - **Priya Case:** Acceptable only if department conventions permit "reading between the lines."  

  **Leaf F: [EMPTY]**  
  - **Diagnosis:** Incoherent. No view holds that *only* misleading by selective true statements (not implicature) is wrong, since both are intentionally deceptive.  

  **Leaf G: [EMPTY]**  
  - **Diagnosis:** Unattractive. No view holds that misleading is worse *only* when the hearer isn’t fooled, as this ignores intent.  

  ---

  ### Teaching Notes for a 50-Minute Seminar  
  **Introduction (5 mins):** Present the anchor case (Priya). Poll students: "Is this better, worse, or equal to lying?" Discuss initial reactions.  

  **Tree Navigation (35 mins):**  
  - **Key Voting Nodes:** Start with Node 1 (words vs. silence) to highlight non-verbal deception. Then Node 3 (direct question) to engage the class in Priya’s dilemma. Node 4 (would-you-confirm test) sparks debate on counterfactuals—ask: "If Priya would cave under pressure, does that ‘taint’ her initial act?"  
  - **Cluster Points:** Most students land in **Leaf C** (lying worse) or **Leaf A** (assertion-only). **Leaf D** (misleading worse) is rare but provokes discussion on "cowardice." Use Node 8 (audience-relativity) to explore gullibility: "Does a naive hearer make the speaker’s act worse?"  
  - **Problem Cases:** Include the "hearer not fooled" scenario in Node 8 and "pure setup" (Node 2) to test consistency.  

  **Wrap-up (10 mins):** Group students by leaf and have each defend their view’s "awkward commitment." Highlight that **audit asymmetry** (Distinction 4) did minimal work—it only appeared in Node 12 and was often overruled by intent-focused nodes. Conclude by noting real-world parallels: politics, advertising, and "reading between the lines" in academia.  

  **Why Audit Asymmetry Didn’t Work:** It was too niche—students prioritized intent (Nodes 4, 7) and conventions (Node 2) over practical enforceability. It only mattered in one branch (Node 12) and was often dismissed as "policing, not morality."  

  **Distinctions Used:**  
  1. **Would-you-confirm test** (Distinction 1): Central to Node 4 and Node 6.  
  2. **Audience-relativity** (Distinction 2): Core to Node 5 and Node 8.  
  3. **Deniability value** (Distinction 3): Key to Node 7 and Node 11.  
  5. **Conventional warrant** (Distinction 5): Critical in Node 2.  
  4. **Audit asymmetry** (Distinction 4): Minimal impact in Node 12.  

  **Word Count:** ~1,400 words. Format directly into handouts.
