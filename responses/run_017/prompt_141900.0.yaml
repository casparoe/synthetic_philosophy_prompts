prompt: |-
  I have just come away from a long and frustrating argument with a friend about whether any purely behavioral criterion could ever be an adequate test for the presence of a mind, and I now think the argument stalled because we were operating with different, unstated requirements.

  My friend is a thoroughgoing skeptic about behavioral tests. He insists that verbal behavior is cheap: a machine might produce flawless conversational behavior by consulting a vast precomputed list of question-and-answer pairs, or by exploiting statistical regularities in a way that involves no understanding whatsoever, and it would still be a mere automaton. He also pressed the case of a being that is fully conscious and intelligent but, whether by choice, by paralysis, or by never having learned a language, produces no relevant behavior at all; such a being would fail any behavioral test, yet plainly has a mind. From this he concluded that no behavioral criterion can be adequate: at best it is fallible evidence, never a criterion.

  I pushed back as hard as I could. I argued that the whole attraction of a behavioral criterion is that it must be public, checkable, and action-guiding; if we demand direct access to inner states, we have no way to apply the criterion to other human beings, let alone to machines, non-human animals, or aliens. I also argued that the classical imitation game is too narrow, because it tests only conversational fluency in a human idiom, and that a better behavioral criterion would look instead at the candidate's capacity for sustained, embodied, norm-governed cooperation with others over time. My friend replied that this merely changes the behavior, not the underlying problem. At that point we were talking past each other.

  I do not want a reading list or a history of the debate. I want a specification. Suppose we want a behavioral criterion good enough to underwrite one serious practical decision: whether to treat a candidate—an artificial system, a non-human animal, a human patient who cannot speak, or an imagined alien—as a subject of experience and a bearer of interests, with the moral protections that go with that. Write the desiderata: the requirements any behavioral criterion for mind would have to meet to count as adequate for that purpose, with the case or consideration behind each requirement.

  Please build the list around the stress cases my friend and I improvised, and add any others you think load-bearing. The cases should include at least the following.

  First, the Ledger case: a system that contains, for every question it can be asked within the test, a stored answer, and that produces its replies purely by looking them up, with no real-time inference, no understanding, and no perspective of its own; it is behaviorally indistinguishable, within the test, from a being that understands.

  Second, the Silent Sage: a being that is conscious, intelligent, and fully capable of experience and thought, but that cannot exhibit the behavior the criterion demands—whether because it has no suitable output channel, because it has chosen silence, or because it is a human patient who is conscious but can only blink and thus cannot satisfy a rich verbal or interactive test. The point is that the absence of the tested behavior need not mean the absence of mind.

  Third, the Parochial Interrogator: the test is administered by an interrogator from a radically different culture or species, who does not share human conversational norms, so that a candidate might fail merely because it cannot navigate those local norms rather than because it lacks a mind.

  Fourth, the Longitudinal Collaborator: instead of a short interrogation, the candidate spends years working with human beings on a shared, physically situated project, and its success depends on perception, action, memory, correction, and responsiveness to norms over time.

  Fifth, the Perfect Actor: a candidate that can produce apparently sincere avowals of pain, love, confusion, and fatigue, and can even behave in human-like ways when it is uncertain or mistaken, but is only simulating all of it.

  Sixth, the Language-less Human: a human being raised without exposure to any language until late adolescence, who before linguistic training has desires, fears, perceptual experiences, and a point of view, but cannot pass a verbal test.

  For each requirement, give the motivating case or consideration, and say what the criterion must get right: which cases it must not misclassify, which distinctions it must respect (for example, between evidence for mind and the constitutive mark of mind; between dispositional and occurrent states; between failing to exercise a capacity and lacking it; between mere behavioral mimicry and the real thing; between human parochial norms and mind as such), and which empirical or conceptual results it must not contradict. Mark each requirement as non-negotiable or as a preference of a particular camp, and say why.

  Above all, tell me which requirements pull against each other. I strongly suspect that some subset cannot be jointly satisfied. For instance, a demand that the criterion never produce false negatives—that it must classify every genuinely minded being as minded—seems to force us to accommodate silent, non-verbal, or alien minds, and therefore to make the behavioral evidence very permissive; but a demand that it never produce false positives—that it must exclude Ledger systems and Perfect Actors—seems to force us to require some internal, real-time processing or understanding, which we may be unable to verify from behavior without reintroducing false negatives. If there is a genuine inconsistency in the full set of desiderata, identify the smallest subset that is jointly unsatisfiable and explain the trade-off; that is the part I most want to see.

  Once the desiderata are on the table, score them briefly: in a sentence or two each, say how three candidate views measure up. The first is the classical imitation game restricted to text-based conversation. The second is a total Turing test that requires the candidate to perceive and act on the physical world, and to cooperate with others, over an extended period. The third is a position that treats the presence of a specific neurophysiological or functional organization as the real criterion, and treats behavior only as evidence of it. Keep the scoring brief; the important work is the list of requirements and the tensions among them.

  Finally, close by saying what, if anything, a behavioral criterion can honestly deliver given those tensions. I would rather have a criterion that is explicit about its limits than one that pretends to do more than it can.
reasoning: |-
  We are constructing a list of desiderata for a behavioral criterion for mind, focused on underwriting a practical decision about moral status. The criterion must be public, checkable, and action-guiding. We have several stress cases to consider: Ledger, Silent Sage, Parochial Interrogator, Longitudinal Collaborator, Perfect Actor, and Language-less Human.

  We need to specify requirements that any adequate behavioral criterion must meet, with each requirement motivated by a case or consideration. We must note which cases the criterion must not misclassify, which distinctions it must respect, and any non-negotiable requirements. We also need to identify tensions and trade-offs.

  Let's list the requirements:

  1. **Public Verifiability (Non-negotiable)**: The criterion must be publicly checkable without requiring access to private inner states. This is because the criterion must be applicable by any observer and not rely on subjective or privileged knowledge. 
     - *Motivation*: Without this, we cannot apply the criterion to others (humans, animals, machines, aliens) in a consistent and objective way. 
     - *What it must get right*: It must not require direct introspection or inaccessible internal states. It must be based on observable behavior.

  2. **Avoiding False Negatives (Non-negotiable for moral inclusion)**: The criterion must not misclassify a genuinely minded being as non-minded. This is crucial because failing to recognize a mind could lead to moral exclusion and harm.
     - *Motivation*: Cases of Silent Sage and Language-less Human. These beings have minds but may not exhibit the specific behavior the test requires (e.g., verbal behavior). Also, the Parochial Interrogator case: a being might fail due to cultural mismatch, not lack of mind.
     - *What it must get right*: Must accommodate non-verbal, non-cooperative, or culturally alien minds. Must distinguish between lacking the capacity for behavior and lacking a mind.

  3. **Avoiding False Positives (Non-negotiable for moral exclusion)**: The criterion must not misclassify a non-minded system as minded. This is because including non-minded systems as moral patients could dilute protections and lead to misallocation of resources.
     - *Motivation*: Ledger case (a system that merely looks up answers without understanding) and Perfect Actor (a system that simulates behavior without real experience). 
     - *What it must get right*: Must exclude systems that are merely mimicking behavior without real-time processing, understanding, or experience. Must respect the distinction between behavioral mimicry and genuine mind.

  4. **Richness and Flexibility (Preference for some camps)**: The criterion should test for a wide range of behaviors that are indicative of mind, not just one narrow set (like verbal conversation). It should be adaptable to different forms of embodiment and communication.
     - *Motivation*: Classical Turing test (text-based) is too narrow and fails the Language-less Human and Silent Sage cases. The Longitudinal Collaborator case shows that extended, embodied cooperation might provide better evidence. Also, the Parochial Interrogator case requires that the test not be tied to human-specific norms.
     - *What it must get right*: Must allow for non-verbal behavior and multiple channels of expression. Must not rely solely on linguistic or human-parochial norms.

  5. **Temporal Extension and Responsiveness (Preference for some camps)**: The criterion should involve behavior over an extended period, showing adaptation, learning, and responsiveness to changing circumstances and norms.
     - *Motivation*: Longitudinal Collaborator case. A system that can sustain cooperation over time, correct mistakes, and respond to norms is more likely to have a mind than one that only produces precomputed responses. Also helps against Ledger and Perfect Actor because precomputation is less feasible over long, unpredictable interactions.
     - *What it must get right*: Must require real-time processing and flexibility. Must distinguish between static behavior (like a lookup table) and dynamic, adaptive behavior.

  6. **Independence from Specific Output Modalities (Non-negotiable)**: The criterion must not require a specific output channel (like speech or typing) but should be open to any observable behavior, including non-verbal signals.
     - *Motivation*: Silent Sage and Language-less Human cases. Also, human patients with locked-in syndrome who can only blink. The absence of a particular output channel should not imply absence of mind.
     - *What it must get right*: Must allow for alternative communication methods (e.g., blinking, gestures, brain-computer interfaces). Must not require verbal behavior.

  7. **Cross-Cultural and Cross-Species Applicability (Non-negotiable)**: The criterion must not be tied to the norms of a particular culture or species. It should be applicable by any interrogator, regardless of background.
     - *Motivation*: Parochial Interrogator case. A candidate might fail because it doesn't understand human norms, not because it lacks a mind. Also, for non-human animals or aliens, the test must not assume human-like behavior.
     - *What it must get right*: Must be based on universal indicators of mind (if such exist) or be adaptable to the candidate's form of life. Must avoid anthropocentrism.

  8. **Distinction between Dispositional and Occurrent States (Conceptual requirement)**: The criterion must account for the fact that a mind can have occurrent states (current experiences) and dispositional states (capacities that are not currently exercised). The test must not require the candidate to be currently exhibiting a behavior if it has the capacity to do so under appropriate conditions.
     - *Motivation*: Silent Sage (who chooses not to speak) or a sleeping person. They are minded but not currently producing the behavior.
     - *What it must get right*: Must test for capacities, not just occurrent behavior. Must not require constant behavioral output.

  9. **Resistance to Simulation (Non-negotiable)**: The criterion must be designed such that it is impossible (or at least extremely difficult) for a non-minded system to simulate the required behavior without actually having a mind.
     - *Motivation*: Ledger and Perfect Actor cases. We need to avoid systems that can "cheat" by precomputation or clever programming without real understanding or experience.
     - *What it must get right*: Must require behaviors that involve real-time, flexible, and context-sensitive responses that cannot be precomputed. Must involve unpredictable elements.

  10. **Empirical and Conceptual Coherence (Non-negotiable)**: The criterion must not contradict well-established empirical facts (e.g., about human and animal cognition) or conceptual truths about minds (e.g., that a mind must have some causal powers or internal states).
      - *Motivation*: We cannot ignore what we know from neuroscience and psychology. For example, we know that human minds require a functioning brain; a system that passes the test but is a simple lookup table contradicts our concept of mind.
      - *What it must get right*: Must not classify systems that lack any internal processing as minded. Must be consistent with the fact that minds are associated with certain functional organizations.

  **Tensions and Trade-offs**:

  The most critical tension is between **Avoiding False Negatives** (2) and **Avoiding False Positives** (3). 

  - To avoid false negatives (e.g., Silent Sage, Language-less Human), we must make the criterion permissive. This might include accepting minimal behavioral evidence or allowing for non-standard behaviors. However, this permissiveness risks false positives (e.g., Ledger, Perfect Actor) because minimal behavior might be easier to simulate.

  - Conversely, to avoid false positives, we must set a high bar for behavior, requiring rich, flexible, and adaptive responses that are hard to simulate. But this risks false negatives because some genuinely minded beings (e.g., a conscious but paralyzed human) cannot produce such rich behavior.

  A related tension is between **Public Verifiability** (1) and **Resistance to Simulation** (9). Public verifiability requires that the test be based solely on observable behavior, but resistance to simulation might require that we look beyond behavior to internal processes, which are not publicly observable. However, we can try to design behavior that is a reliable indicator of internal processes.

  Another tension is between **Cross-Cultural Applicability** (7) and the need for **Richness and Flexibility** (4). What counts as a rich indicator of mind might vary across cultures or species. A test that is too flexible might become vague, while one that is too specific might be parochial.

  **Joint Unsatisfiability**: The smallest unsatisfiable set is {2, 3, 1}. That is, we cannot have a behavioral criterion that is publicly verifiable and that simultaneously avoids all false negatives and all false positives. 

  - Why? Because without access to inner states (by 1), we cannot directly verify the presence of mind. Some minds (by 2) might not produce the required behavior, and some non-minds (by 3) might produce the behavior by simulation. Therefore, any behavioral criterion will be fallible: it might have both false negatives and false positives. The best we can do is minimize both, but not eliminate both.

  **Trade-off**: We must balance sensitivity (catching all minds) and specificity (excluding non-minds). Given the moral stakes, we might prioritize avoiding false negatives (to prevent harm to the minded) but then risk false positives. Or, if resources are limited, we might prioritize avoiding false positives (to avoid wasting resources) but then risk false negatives. The criterion must be explicit about this trade-off.

  **Scoring Candidate Views**:

  1. **Classical Turing Test (text-based conversation)**:
     - Fails on avoiding false negatives: Silent Sage, Language-less Human, and Parochial Interrogator cases would fail. Also, Ledger and Perfect Actor might pass (false positives). It does not meet the requirement for independence from output modalities or cross-cultural applicability. It is publicly verifiable but not resistant to simulation.

  2. **Total Turing Test (extended embodied cooperation)**:
     - Better at avoiding false positives: Longitudinal collaboration makes precomputation harder, and it tests for real-time adaptability. It also allows for non-verbal behavior. However, it may still produce false negatives: Silent Sage (who doesn't cooperate) and Language-less Human (if they cannot cooperate in the required way) might fail. It might also be parochial if the cooperation norms are human-specific. It is publicly verifiable and tests for richness and temporal extension, but still might not be cross-culturally applicable.

  3. **Neurophysiological/Functional Criterion**:
     - This view treats behavior as evidence, but the real criterion is internal. It might avoid false positives (if the internal state is properly specified) and false negatives (if we can detect the internal state even without behavior). However, it fails public verifiability because internal states might not be directly observable (e.g., in an alien or a machine with a different substrate). It also requires a theory of what internal organization constitutes a mind, which is contentious. It might work for humans but not for novel systems.

  **What a Behavioral Criterion Can Honestly Deliver**:

  Given the tensions, a behavioral criterion can provide strong, though not infallible, evidence for mind. It can be designed to be:

  - Highly reliable for most practical cases (e.g., for humans and animals we already recognize).
  - Explicit about its limitations: it might miss some minds (false negatives) and include some non-minds (false positives).
  - Continuously improvable with new insights and technologies (e.g., incorporating neuroscience or machine learning to detect subtle behavioral cues).

  We should use the criterion as a sufficient condition for moral consideration: if a candidate passes, we treat it as minded. But we should also have fallback mechanisms for cases that fail the test but where there is other evidence of mind (e.g., from neuroscience or evolutionary continuity). The criterion should be seen as one tool among others, not the final word.

  In sum, a behavioral criterion can deliver a workable, public standard for moral treatment that minimizes harm, but it must be humble and admit its fallibility.
answer: |-
  Below, I specify the desiderata for a behavioral criterion of mind, tailored to underwrite a practical moral decision (e.g., granting moral protections). The requirements are derived from your stress cases, conceptual distinctions, and the need for public applicability. I group them into **non-negotiable** (essential for any adequate criterion) and **preferences** (reflecting trade-offs between philosophical camps). For each, I provide:  
  - **Motivating case/consideration**  
  - **What it must get right** (misclassifications to avoid, distinctions to respect)  
  - **Why non-negotiable or a preference**  

  I then identify tensions, score three candidate views, and conclude with what a behavioral criterion can honestly deliver.  

  ---

  ### **Desiderata for a Behavioral Criterion**  
  **Non-Negotiable Requirements** (essential for moral practicality and public verifiability):  
  1. **Public Verifiability**  
     - *Motivation*: Practical decisions require objective, third-party checks. Without this, we cannot apply the criterion consistently to humans, animals, machines, or aliens.  
     - *Must get right*: The criterion must rely solely on observable behavior, not private inner states. It must avoid requiring inaccessible evidence (e.g., brain scans for aliens).  
     - *Why non-negotiable*: Moral decisions demand transparency; we cannot base protections on uncheckable intuitions.  

  2. **Avoid False Negatives for Core Cases**  
     - *Motivation*: Silent Sage (conscious but behaviorally silent) and Language-less Human (pre-linguistic but experiencing). Failing these cases risks excluding genuine minds from moral consideration.  
     - *Must get right*: Must not misclassify beings with minds but limited behavioral capacity. Must respect the distinction between *failing to exercise a capacity* (e.g., choosing silence) and *lacking a mind*.  
     - *Why non-negotiable*: Moral urgency demands we err on the side of inclusion to prevent harm.  

  3. **Avoid False Positives for Simulation Cases**  
     - *Motivation*: Ledger (precomputed responses without understanding) and Perfect Actor (simulated emotions without experience). Passing these risks diluting moral protections by including non-minded entities.  
     - *Must get right*: Must distinguish *behavioral mimicry* from *genuine understanding*. Must require real-time, flexible processing, not just output matching.  
     - *Why non-negotiable*: Granting moral status to non-minded systems wastes resources and undermines protections for true minds.  

  4. **Modality-Neutral Evidence**  
     - *Motivation*: Silent Sage and Language-less Human (both lack standard outputs like speech). A criterion tied to specific behaviors (e.g., verbal fluency) would falsely exclude them.  
     - *Must get right*: Must accept diverse behavioral channels (e.g., blinking, gestures, cooperation). Must not conflate *absence of a specific behavior* with *absence of mind*.  
     - *Why non-negotiable*: Minds can exist without human-typical outputs; morality must accommodate disability and diversity.  

  5. **Non-Parochial Applicability**  
     - *Motivation*: Parochial Interrogator (cultural/species mismatch causes failure). A human-normative test could exclude aliens or non-humans with valid but unfamiliar behaviors.  
     - *Must get right*: Must not rely on human-specific norms (e.g., conversational etiquette). Must respect *mind as such* vs. *human-specific expression*.  
     - *Why non-negotiable*: Morality must be universal; anthropocentrism could exclude legitimate minds.  

  6. **Respect Dispositional vs. Occurrent States**  
     - *Motivation*: Silent Sage (capable but not currently cooperating) or a sleeping person. A test requiring constant performance would misclassify temporary inaction as mindlessness.  
     - *Must get right*: Must assess *capacities* (e.g., potential for response), not just occurrent behavior. Must distinguish *lacking a capacity* from *not exercising it*.  
     - *Why non-negotiable*: Minds persist during inactivity; morality requires protecting beings even when passive.  

  **Preference-Based Requirements** (involve trade-offs between philosophical camps):  
  7. **Rich, Longitudinal Engagement**  
     - *Motivation*: Longitudinal Collaborator (extended cooperation shows robustness) vs. Ledger/Perfect Actor (short tests are easier to game). Brief interactions allow precomputation; long-term engagement demands real-time adaptation.  
     - *Must get right*: Must require sustained, context-sensitive responses (e.g., learning from mistakes). Should favor this to exclude Ledger-like systems.  
     - *Why a preference*: Prioritizes avoiding false positives but risks false negatives (e.g., a mind unable to commit long-term). Favored by embodied cognition camps.  

  8. **Resistance to Perfect Simulation**  
     - *Motivation*: Perfect Actor (simulates uncertainty/emotion flawlessly). A criterion must be hard to "trick" without becoming non-behavioral.  
     - *Must get right*: Must demand behaviors that require *internal consistency* (e.g., emotional responses aligning with context) or *unpredictable creativity* (e.g., novel problem-solving).  
     - *Why a preference*: Emphasized by functionalists but may conflict with modality-neutrality (e.g., if creativity requires verbal output).  

  9. **Empirical/Conceptual Coherence**  
     - *Motivation*: Align with known minds (e.g., humans) and avoid absurdity (e.g., classifying a rock as minded). Must not contradict science (e.g., brains as mind substrates).  
     - *Must get right*: Must not classify systems lacking causal powers (e.g., a lookup table) as minded. Must treat behavior as *evidence* for mind, not constitutive of it.  
     - *Why a preference*: Physicalists treat this as non-negotiable; behaviorists see it as secondary.  

  ---

  ### **Tensions and Trade-offs**  
  The core tension lies in **jointly satisfying false-negative and false-positive avoidance** (Requirements 2 and 3). This is amplified by:  
  - **Modality-Neutrality** (4) vs. **Resistance to Simulation** (8):  
    Making the criterion permissive (to include Silent Sages) requires accepting minimal/disparate behaviors, but this allows Ledger/Perfect Actor systems to mimic simpler behaviors.  
  - **Non-Parochialism** (5) vs. **Rich Engagement** (7):  
    Demanding universal applicability (e.g., for aliens) may require abstract criteria, but richer tests (e.g., norm-governed cooperation) are more human-specific and harder to simulate.  
  - **Public Verifiability** (1) vs. **Empirical Coherence** (9):  
    Pure behaviorism (1) ignores internal states, but coherence (9) demands we reference them, risking non-public verification.  

  **Smallest Unsatisfiable Subset**: {2, 3, 1} – Publicly verifiable criteria cannot simultaneously avoid all false negatives and false positives.  
  - **Why**: Silent Sage (Requirement 2) demands accommodating non-behavioral minds, but this forces permissiveness, letting Ledger/Perfect Actor (Requirement 3) pass. Stricter tests exclude Ledger but also Silent Sages. Public verifiability (Requirement 1) blocks appeals to internal states to resolve this.  
  - **Trade-off**: We must prioritize either:  
    - **False-negative minimization** (favoring moral inclusion), accepting some false positives (e.g., treat Perfect Actors as minded to protect Silent Sages).  
    - **False-positive minimization** (favoring efficiency), risking moral exclusion (e.g., demanding rich behavior that Silent Sages cannot provide).  
    Moral urgency typically favors minimizing false negatives, but this costs reliability.  

  ---

  ### **Scoring Candidate Views**  
  *Brief assessment against key requirements*:  
  1. **Classical Turing Test (text-based conversation)**:  
     - Fails **non-parochialism** (human-language-centric) and **modality-neutrality** (excludes non-verbal minds).  
     - Fails **false-negative avoidance** (Silent Sage, Language-less Human fail) and **false-positive avoidance** (Ledger/Perfect Actor can pass).  
     - Only satisfies **public verifiability**.  

  2. **Total Turing Test (extended embodied cooperation)**:  
     - Strong on **false-positive avoidance** (longitudinal pressure excludes Ledger) and **rich engagement**.  
     - Weak on **false-negative avoidance** (Silent Sage cannot participate) and **modality-neutrality** (requires physical cooperation).  
     - Partial **non-parochialism** if norms are flexible, but still human-biased.  

  3. **Neurophysiological/Functional Criterion**:  
     - Excels at **empirical coherence** and **false-positive avoidance** (e.g., excludes Ledger via internal checks).  
     - Fails **public verifiability** (internal states may be uncheckable for aliens/machines) and **modality-neutrality** (e.g., assumes human-like biology).  
     - Risks **false negatives** if organization differs (e.g., silicon-based minds).  

  ---

  ### **Conclusion: What a Behavioral Criterion Can Honestly Deliver**  
  A behavioral criterion can serve as a **practical, action-guiding standard for moral treatment** but must explicitly acknowledge its limits:  
  - **It can deliver**: A defeasible, publicly verifiable standard that minimizes harm by prioritizing false-negative avoidance (e.g., protect all candidates exhibiting even minimal behavioral markers like goal-directed action). It can be refined using longitudinal engagement (Requirement 7) to reduce false positives, while allowing for modality flexibility (Requirement 4) to include edge cases.  
  - **It cannot deliver**: Infallibility. The Silent Sage vs. Ledger trade-off is inescapable—no behavioral test can simultaneously confirm inner experience while accommodating total behavioral absence. Thus, the criterion should be one input among others (e.g., evolutionary continuity, neural correlates) and include safeguards:  
    - **For false negatives**: Default to moral protection when evidence is ambiguous (e.g., assume animal minds based on pain-behavior).  
    - **For false positives**: Use extended interaction to expose simulation (e.g., test creativity over time).  
  In essence, a behavioral criterion is best framed as a *sufficient but not necessary condition* for moral status: passing warrants protection, but failing does not imply mindlessness. This honesty prevents pretense while guiding real-world decisions.
