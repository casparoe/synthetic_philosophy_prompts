prompt: |-
  Last spring, in my high school's semester-long health elective, each of us was asked to fill out a blank living will form as an exercise. I wrote that if I ever reached a point where I could no longer follow an argument or work through a proof, I did not want life-sustaining treatment. I was sixteen, I had just finished a unit on medical ethics, and I meant it at the time. I have since realized that the interesting question is not about forms or signatures. It is about when, if ever, an earlier self gets to speak for a later one whose values have drifted, and I would rather have a specification than a verdict.

  Please write the desiderata that any adequate account of precedent autonomy has to satisfy: the cases it has to get right, the distinctions it cannot collapse, and the results from medicine or psychology it is not allowed to contradict, with the case or consideration behind each requirement. The account is meant to do two jobs, and you can hold it to both: telling a hospital ethics committee what to do at the bedside, and telling me whether I should tear up the form I filled out at sixteen.

  The cases I keep getting stuck on, which I would like your list to cover rather than ignore: the still-competent convert, who has full decision-making capacity but whose values have inverted since signing, and now demands the treatment she once refused; the contented patient with advanced dementia, who lacks capacity, who plainly enjoys music and walks and meals, and who no longer recognizes the project the directive existed to protect, so that the question is whose welfare counts at the moment of decision, the person in the bed or the person who signed; the predicted-drift case, where the earlier self anticipated and legislated against exactly the change that happened, which might strengthen her claim or might just show that she was bargaining against her own future; the minor-author case, which is mine, where the instructions were written by someone who could not yet vote or consent to much of anything; the stale document, untouched for forty years, where I want to know whether authority decays and whether a theory owes us a sunset rule; the vague document, where language like no heroics has to be cashed out into a decision about something as small as a two-week course of antibiotics; the interim self, the person who exists through the months or years of decline and who is neither the signer nor the end-state patient; the asymmetry with testation, since we let a dead hand control property for decades but balk at its controlling what happens to a living body, and I want to know whether a theory has to justify that line or dissolve it; and the evidence problem, since the actual decision often falls to a tired resident with twenty minutes, a one-page form, and no surrogate reachable, which makes me wonder whether administrability is a genuine desideratum or just an excuse for a crude theory.

  Along the way, please mark which requirements are non-negotiable and which are only the preferences of one camp, and tell me if any subset of them cannot be jointly satisfied, because if the list turns out to be internally inconsistent that is itself the result I most want. I have my own candidate requirement, and I would like it pressure-tested: call it the recognition condition, on which an earlier instruction binds only if the later self can still recognize the earlier value as a reason she could have acted on even though she no longer endorses it, the way you can still see that a move is strong in a game you no longer care about winning. Is that a real desideratum or a prejudice smuggled in by people who like narrative views of identity? Finally, say which single requirement does the most work in disqualifying candidates. A short paragraph each on the strict precedent-autonomy view, the current-welfare view, and the endorsement view is enough for scoring; please keep the weight on the criteria and their motivating cases rather than on the scorecard.
reasoning: |-
  Okay, this user is asking for a deep dive into the philosophical and ethical aspects of precedent autonomy in living wills. They've clearly thought a lot about this - they're a high school student who wrote a living will at sixteen and now questions whether their past self should dictate future medical decisions. The level of sophistication here is impressive for someone so young.

  The core dilemma they're presenting is about when earlier selves should control later selves whose values have changed. They want a set of criteria that any theory of precedent autonomy must satisfy, and they've listed several challenging cases that highlight the tensions in this area. This isn't just academic for them - they're personally invested in whether they should tear up that form they signed at sixteen.

  What stands out is how thoroughly they've mapped the problem space. They've identified specific paradoxes: the competent convert who now wants treatment they previously refused, the dementia patient who enjoys life despite their past directive, the minor author issue (their own case), stale documents, vague language, and practical implementation challenges. Each represents a different facet of the autonomy vs welfare tension.

  They're also proposing their own test - the "recognition condition" - and want it pressure-tested. That shows real intellectual engagement. I need to analyze whether this holds water or if it's biased toward narrative identity views.

  The request is complex because it demands both theoretical rigor and practical applicability. They want these criteria to guide hospital ethics committees while also helping them personally. And they're specifically asking me to identify if any requirements conflict fundamentally - they're prepared for the possibility that the whole framework might be inconsistent.

  I should structure this carefully. First outline the desiderata with their motivating cases, then analyze their proposed recognition condition, then briefly evaluate major theories against these criteria. The key is maintaining clear connections between each requirement and the real-world dilemma it addresses.

  For the desiderata, I'll need to cover: the competent convert paradox, dementia welfare vs prior autonomy, anticipated drift, minor consent issues, document expiration, interpretive challenges, interim selves, property vs body distinctions, and administrative feasibility. Each deserves its own clear criterion with the case behind it.

  Their recognition condition is interesting - it suggests binding force only if the later self can still "see" the earlier reason as valid even if not endorsing it. But is this testable with dementia patients? Does it solve the competent convert? I'll need to probe its limitations.

  The theories section should be concise but sharp - show how strict autonomy fails the dementia case, current welfare fails the convert, and endorsement has drift problems. The scoring will emerge naturally from how many desiderata each satisfies.

  Most importantly, I must identify conflicting desiderata - particularly between respecting clear advance directives and protecting current welfare when patients seem content. That tension might be irreconcilable, which is actually what this user seems prepared to discover. That insight could be more valuable than any neat solution.
answer: |-
  Here is a set of desiderata for an adequate account of precedent autonomy, grounded in the cases and considerations you've identified. These aim to capture the core tensions and non-negotiable realities the theory must navigate:

  **Core Desiderata (Non-Negotiable):**

  1.  **Respect for Clear, Competent Prior Wishes (Competent Convert Case):** An account *must* provide a principled reason why a currently competent individual's *present* healthcare decisions (e.g., the convert demanding previously refused treatment) *override* their prior written directive. It cannot simply collapse the convert into the prior self. Failure here undermines the very concept of contemporaneous autonomy. *Case: The Still-Competent Convert.*

  2.  **Protection of the Non-Autonomous Present Self (Contented Dementia Patient Case):** An account *must* acknowledge the moral standing and welfare interests of the person *currently* experiencing the situation (e.g., the dementia patient enjoying life), especially when they lack decision-making capacity. It cannot treat the prior self as the *only* morally relevant entity. Ignoring this risks profound harm to vulnerable individuals. *Case: The Contented Patient with Advanced Dementia.*

  3.  **Recognition of Fluctuating Capacity & Interim Selves (Interim Self Case):** An account *must* grapple with the reality of progressive decline and the existence of selves who possess *some* capacity, values, or interests distinct from both the signer and the end-state patient. It cannot ignore the ethical complexities during the period *between* full capacity and profound incapacity. *Case: The Interim Self.*

  4.  **Feasibility of Application (Evidence Problem Case):** An account *must* generate principles or procedures that can realistically be implemented in actual clinical settings, often under time pressure and with limited information. While perfection isn't required, a theory utterly disconnected from practical application is inadequate. Administrability is a genuine desideratum, not just an excuse. *Case: The Tired Resident / Evidence Problem.*

  5.  **Avoidance of Literal Self-Contradiction (Predicted Drift Case):** An account *must* resolve the paradox where an earlier self explicitly anticipates and tries to bind a future self whose values change in the predicted way. It must explain whether this strengthens the prior directive (as a deliberate choice against drift) or weakens it (as self-undermining). It cannot simply ignore this form of self-legislation. *Case: The Predicted Drift.*

  **Important Desiderata (Strong Preferences, Subject to Theoretical Cohesion):**

  6.  **Special Scrutiny for Minors' Directives (Minor-Author Case):** An account *should* assign significantly less weight (or require higher evidentiary thresholds) to directives authored by minors due to ongoing cognitive development, evolving identity, and limited legal capacity for analogous decisions. *Case: Your Sixteen-Year-Old Self.*

  7.  **Accountability for Document Staleness (Stale Document Case):** An account *should* incorporate a mechanism by which the authority of an advance directive diminishes over time, especially if un-reviewed during major life changes or health developments. A theory *owes* us a principled rationale for a "sunset rule" or equivalent, even if flexible. *Case: The Forty-Year-Old Document.*

  8.  **Interpretive Fidelity over Literalism (Vague Document Case):** An account *should* guide the interpretation of vague directives (e.g., "no heroics") towards the *values and goals* likely held by the prior self, considering context, rather than imposing rigid or implausible literal readings. *Case: "No Heroics" vs. Antibiotics.*

  9.  **Distinguishing Property from Bodily Integrity (Asymmetry with Testation Case):** An account *should* either justify the strong intuition that controlling a *living body* requires different (often stricter) standards than controlling *property* after death, or provide a compelling reason to dissolve this distinction. Ignoring this asymmetry feels intuitively wrong. *Case: Dead Hand Control of Property vs. Living Body.*

  **Pressure-Testing Your Recognition Condition:**

  *   **The Recognition Condition:** An earlier instruction binds only if the later self can still recognize the earlier value as a reason she *could have* acted on, even if she no longer endorses it.
  *   **Strengths:** Addresses the Competent Convert (if the convert *no longer recognizes* the old value as a *possible* reason, it shouldn't bind) and potentially the Minor-Author case (if the adult self cannot recognize the adolescent value as a reason *they could have ever acted on*, it weakens it). It offers a psychologically plausible bridge between selves.
  *   **Weaknesses:**
      *   **Contented Dementia Patient:** Utterly fails here. The dementia patient likely *cannot* recognize *any* abstract reasons, past or present. Applying the condition would mean the directive *always* binds in profound dementia (if recognizable at signing), potentially leading to harm against the current patient's welfare (violating Desideratum 2). This is a major flaw.
      *   **Operationalization:** How do we assess "recognition as a reason one *could have* acted on" in someone with fluctuating or minimal capacity? It's highly subjective and difficult to determine reliably, clashing with Desideratum 4 (Feasibility).
      *   **Predicted Drift:** Does the condition help? The later self might recognize the *old* reason but see it as utterly alien and wrong. Does "could have acted on" imply historical possibility or current imaginability? It's ambiguous.
  *   **Verdict:** While insightful and potentially useful in *some* cases (like competent converts), it functions more as a *potential element within a broader theory* rather than a standalone, adequate desideratum. Its failure in the dementia case and operational challenges are significant. It leans towards a narrative identity view but doesn't fully escape the core tensions.

  **Theory Scoring Against Key Desiderata (Brief):**

  1.  **Strict Precedent Autonomy:** (Prior directive always rules if valid).
      *   *Fails:* Competent Convert (ignores current autonomy), Contented Dementia (ignores current welfare, may cause harm), Interim Self (ignores changing capacities/values), Stale Document (no decay), Minor-Author (no special scrutiny). *Passes:* Predicted Drift (binds), Vague Document (interpret literally?), Asymmetry (dissolves it?).
      *   *Key Failure:* Desiderata 1 & 2. Unacceptably harms the living, breathing person now.

  2.  **Current Welfare/Interest View:** (Maximize well-being of the current patient).
      *   *Fails:* Competent Convert (ignores prior directive *unless* current welfare aligns), Predicted Drift (ignores deliberate choice), Stale/Vague Document (relevance minimal), Minor-Author (weakens directive), Asymmetry (justifies difference?).
      *   *Passes:* Contented Dementia (protects welfare), Interim Self (can address changing interests).
      *   *Key Failure:* Desideratum 1 (Competent Convert) and the core idea of precedent autonomy itself. Makes directives largely irrelevant.

  3.  **Endorsement View:** (Prior directive binds only if the current self *would* endorse it, or *does* endorse it if capable).
      *   *Fails:* Predicted Drift (deliberate non-endorsement anticipated), Competent Convert (current non-endorsement overrides - passes Desideratum 1 but...), Contented Dementia (incapable of endorsement - directive *may* not bind, passing Desideratum 2, but...), Stale Document (assumes non-endorsement?).
      *   *Ambiguous:* What about the Interim Self? How do we assess *would* endorse for the profoundly incapacitated? Highly speculative.
      *   *Key Problem:* Desideratum 5 (Predicted Drift). It struggles with the core case of deliberately binding an unendorsing future self. Also clashes with the *point* of directives for future incapacity (how can they endorse then?).

  **The Most Disqualifying Desideratum:**

  **Desideratum 2 (Protection of the Non-Autonomous Present Self / Contented Dementia Patient)** does the most work in disqualifying candidates. Any theory that cannot accommodate the moral significance and potential well-being of the profoundly incapacitated person *in the present moment*, and which risks causing them serious harm solely on the basis of a prior directive, is fundamentally inadequate and ethically dangerous. This is the non-negotiable bedrock that Strict Precedent Autonomy founders on.

  **Internal Tensions:**

  *   The most significant tension exists between **Desideratum 1 (Competent Convert)** and **Desideratum 5 (Predicted Drift)**. Satisfying the Convert (current autonomy overrides prior directive) seems to undermine the possibility of legislating against drift. Satisfying the Predicted Drift case (binding the future self despite drift) seems to threaten the Convert's current autonomy.
  *   **Desideratum 2 (Present Welfare in Dementia)** is in profound tension with any strong reading of precedent autonomy binding in that exact scenario (implied by Desideratum 5 if drift was predicted towards dementia).
  *   **Desideratum 6 (Minor-Author)** and **Desideratum 7 (Stale Document)** push towards weakening precedent autonomy, while **Desideratum 5 (Predicted Drift)** pushes towards strengthening it in specific instances.

  **Conclusion:**

  An adequate theory must navigate these tensions without violating the non-negotiable core (Desiderata 1-5). It likely requires a *hybrid* approach weighing precedent autonomy heavily but not absolutely, incorporating current welfare significantly especially in profound incapacity, and employing procedural safeguards (like requiring periodic reaffirmation for minors/stale directives, clear evidence for overriding a competent convert's *current* wishes, and robust interpretive methods for vague documents). No existing simple theory satisfies all cases, revealing the profound ethical complexity at the heart of binding one's future self. Your recognition condition offers a nuanced tool for *some* scenarios but cannot resolve the core dilemmas alone. The tension between respecting past autonomy and protecting present welfare in profound incapacity remains the central, perhaps irresolvable, challenge.
