answer: |-
  Your analysis is exceptionally sharp, and you've identified a profound logical/argumentative phenomenon with multiple facets. Let's carve the concept systematically, addressing each question and distinguishing the core phenomena.

  ### 1. **Established Name & Literature**
  The core structure is a **Sorites Paradox** (from Greek *sorites* = "heaped" or "piled"), specifically a **Sorites Series applied to comparative evaluation**. 

  *   **Definition:** A Sorites Paradox arises when a seemingly valid chain of small, individually acceptable steps leads to an apparently absurd or unacceptable conclusion due to the vagueness of a predicate (e.g., "is not worse than," "is permissible," "is a heap").
  *   **Literature:** Rooted in ancient philosophy (Eubulides of Miletus), it's extensively studied in:
      *   **Logic & Philosophy of Language:** Focuses on vagueness, tolerance principles, and the failure of transitivity with vague predicates (e.g., work by Crispin Wright, Timothy Williamson, Rosanna Keefe).
      *   **Decision Theory & Social Choice:** Explores how intransitive preferences can arise from small changes or shifting criteria, relevant to your second example (e.g., Condorcet Paradox, Arrow's Impossibility Theorem, multi-attribute decision making).
      *   **Ethics & Policy:** Examines slippery slope arguments (a rhetorical cousin), often debating whether they are fallacious or legitimate warnings.

  **Why "Sorites Series" is the core concept:** It perfectly captures the structure: a series of small, individually tolerable changes (A→B, B→C... Y→Z) leading to an intolerable conclusion (A→Z) due to the inherent vagueness or context-dependence of the comparative relation ("not worse than").

  ### 2. **Diagnosis of Endpoint Divergence & Distinction Between Cases**
  You are fundamentally correct, and the diagnoses *are* distinct:

  *   **Municipal Planning Case (Plan A to Plan F):**
      *   **Diagnosis: Tolerance Principle & Threshold Effects.** The relation "not detectably worse *in this specific context, given current priorities and information*" is being used. Each step exploits a *margin of tolerance* – the loss is small enough relative to the gain that the committee feels justified in calling the new plan "not worse." However, "not detectably worse" is **not transitive** over many steps. The aggregate loss eventually crosses a *detection threshold* or *tolerance threshold* that was invisible at each step. The *standard of comparison* (what counts as "worse") remains constant (overall utility/desirability of the plan), but cumulative small losses overwhelm the initial state.
      *   **Term:** This is the **Classical Sorites Paradox** applied to preference/utility.

  *   **Poem Translation Case (Revision 1 to Revision N):**
      *   **Diagnosis: Shifting Valuation Standards / Non-Common Currency.** Here, the *grounds for judgment* shift fundamentally at each step. "Not worse" is assessed using a *different dominant criterion* each time (clarity vs. accuracy vs. rhythm vs. concision). Crucially, **no common metric integrates these disparate values across the entire chain.** The evaluator focuses narrowly on the *local* trade-off presented at each step, prioritizing the criterion most salient *for that specific change*. The global "all-things-considered" judgment is lost because the weights assigned to different criteria change implicitly with each step.
      *   **Term:** This is **Intransitivity due to Multi-Attribute Preference Shifts** or **Context-Dependent Valuation**. It resembles aspects of the **Money Pump** argument (showing intransitive preferences lead to exploitable decisions) and **Aggregation Problems** in social choice.

  **Your Distinction is Correct:** Case 1 exploits the *vagueness/tolerance* of a single criterion over cumulative small changes. Case 2 exploits the *incommensurability* or *shifting dominance* of *multiple* criteria without a stable aggregation rule. The first failure is about **accumulation beneath a detection threshold**; the second is about **inconsistent valuation frameworks**.

  ### 3. **Non-Transitive Comparative Relations & Minimal Weakening**
  *   **Term:** A relation that is reflexive (X R X) and holds for adjacent pairs but fails transitivity over chains is called a **Non-Transitive Relation** or, more specifically in this context, a **Semi-Order** (introduced by Luce in 1956) or a **Tolerance Relation**.
      *   **Semi-Order:** Designed for preferences with thresholds. `A P B` (A is strictly preferred) only if A is sufficiently better than B. `A I B` (indifference) holds if |A-B| < threshold. Crucially, `I` is reflexive and symmetric but *not transitive*. "Not worse than" in your municipal case aligns with `I` (indifference within tolerance).
      *   **Tolerance Relation:** A reflexive, symmetric relation that tolerates small differences. Formally, a tolerance relation on a set S is reflexive and symmetric but not necessarily transitive. It models "indistinguishability" or "not detectably different."
  *   **Minimal Weakening:** The core weakening is the **violation of transitivity**. The minimal formal structure that allows endpoints to be ordered against the chain is simply a **non-transitive relation**. The "how much weakening" is captured by the **size of the tolerance threshold** (δ) in models like Semi-Orders: Transitivity holds for chains where the *sum* of differences exceeds δ, but fails for chains where the sum of small differences stays below δ but accumulates significantly. For the multi-attribute case, weakening occurs when there's **no single utility function** representing the preferences across all comparisons (i.e., preferences are not **coherent**).

  ### 4. **The Reverse Chain Test**
  Your test is **highly insightful and generally sound as a diagnostic tool**, though your worries are valid:

  1.  **Permitting Reverse Chain ≠ Genuine Cycle:** This is true. A relation can be **acyclic** (no true cycles like A>B>C>A) yet still **non-transitive** (A~B, B~C, but A>C). Your test *detects non-transitivity*, not necessarily cycles. Finding a plausible reverse chain shows `A R Z` and `Z R A` can both be argued, exposing the inconsistency, but it doesn't *prove* `A` and `Z` are equally good, only that the relation `R` ("not worse than") is unreliable for ranking them directly *or* via that chain.
  2.  **Differently Chosen Intermediates:** This is a potential flaw. If intermediates are chosen strategically (as they often are in argument), a reverse chain *using different intermediates* might be easier or harder to construct than the original, making the comparison unfair. **Mitigation:** The strongest application of your test uses *the same sequence of intermediates* in reverse order (Z, Y, X, ..., A), asking if `Y not worse than Z?`, `X not worse than Y?`, etc., is as plausible as the original sequence (`B not worse than A?`, `C not worse than B?`, etc.). If using the *exact same steps* backwards yields an equally plausible chain of "not worse than" judgments under the *same standards*, it powerfully demonstrates that the relation `R` lacks the coherence needed to derive `A R Z` from the chain. It highlights context-dependence, shifting standards, or the non-transitivity of tolerance.

  **Conclusion on the Test:** It's a highly valuable **heuristic for detecting non-transitivity, context-dependence, or shifting valuation standards**. It's not a *formal proof* of intransitivity or equivalence, but a practical demonstration of the argument's vulnerability. Its power increases if the *same intermediates* are used in reverse.

  ### 5. **Boundary: Legitimate vs. Illegitimate & Distinctions**
  The legitimacy hinges on **whether the comparative relation `R` ("not worse than") maintains a consistent meaning and satisfies transitivity *in the relevant context***.

  *   **Legitimate Chaining:**
      *   **Strict Dominance:** Each step `X_{i+1}` is *strictly better* than `X_i` in at least one respect and *no worse* in any other (Pareto improvement). Transitivity holds firmly. (e.g., Software updates fixing bugs without drawbacks).
      *   **Transitive Relation with Clear Thresholds:** If `R` is genuinely transitive (like strict inequality ">", or equality "=") and the steps genuinely satisfy it, chaining is valid. (e.g., A > B by 1, B > C by 1, therefore A > C by 2).
      *   **Accumulated Negligible Differences (a):** If the differences *are* truly negligible *even in aggregate* (e.g., adding one grain of sand to a heap), and the vagueness is accepted, the conclusion might be pragmatically acceptable *as a definition within the tolerance*. This is the *resolution* of the Sorites paradox for vague predicates, not a fallacy per se, though it highlights the limits of bivalence.

  *   **Illegitimate Chaining (The Phenomenon You Describe):**
      *   **Sorites Exploitation (Your Case 1):** Using `R` = "not detectably worse" (a non-transitive tolerance relation) over many steps where the cumulative change *is* detectable and significant. The fallacy lies in **equivocating** between "not detectably worse *at this step*" and "not worse *simpliciter*".
      *   **Shifting Sands Valuation (Your Case 2):** Using `R` = "not worse all-things-considered" but changing the "things considered" and their weights at each step without a stable aggregation rule. The fallacy is **inconsistent valuation** or **ignoring the global context**.

  *   **Distinguishing from Similar Cases:**
      *   **(a) Accumulated Negligible Differences:** In legitimate (a), the accumulated difference *remains negligible* within the agreed tolerance. In the illegitimate Sorites, the accumulation *crosses the tolerance threshold*.
      *   **(b) Non-Rankable Items:** If items are genuinely incomparable (no common value framework exists), asserting *any* comparative relation (`A R Z` or `Z R A`) based on a chain is usually invalid. The chain exploits *local* comparability where only *partial comparability* exists globally. Your multi-attribute case flirts with this.
      *   **(c) Group Cycling (Condorcet Paradox):** This arises from aggregating *consistent individual transitive rankings* into an *intransitive collective ranking* via majority vote. Your phenomenon is different: it occurs even for a *single evaluator* whose judgment along the chain is inconsistent due to vagueness tolerance or shifting criteria. The *source* of intransitivity is different (individual cognitive/contextual vs. social aggregation).

  ### The Carved Concept & Proposed Terminology

  *   **Overarching Phenomenon:** **Sorites-Series Induced Preference Intransitivity (SSIPI)**
  *   **Core Mechanism:** Exploiting the chainability of small, locally acceptable steps (`X_i R X_{i+1}`) under a relation `R` that is either:
      1.  **Vague/Tolerant:** `R` means "not detectably worse" (non-transitive tolerance relation), leading to *cumulative loss crossing a threshold* (**Threshold-Sorites SSIPI**).
      2.  **Multi-Attribute/Shifting:** `R` means "not worse all-things-considered," but the "all-things-considered" evaluation shifts its dominant criteria or weights inconsistently along the chain, lacking a stable global metric (**Shifting-Sands SSIPI**).

  *   **Defining SSIPI:** An argumentative pattern where a conclusion about the comparative value of distant endpoints (A and Z) is derived solely via a chain of adjacent comparisons (A R B, B R C, ..., Y R Z), where:
      *   Each adjacent comparison `X_i R X_{i+1}` is individually plausible or granted.
      *   The relation `R` (interpreted as "not worse than" or similar) is implicitly or explicitly assumed to be transitive.
      *   The direct comparison A vs. Z yields a result inconsistent with the chained conclusion (often Z is clearly worse than A).
      *   The inconsistency arises because the relation `R` either (1) embodies a tolerance threshold exceeded by the cumulative change along the chain, or (2) relies on inconsistently applied or shifting valuation criteria across the chain steps.
      *   The chain is constructed intentionally or emerges through sequential decision-making.

  *   **Exclusions:**
      *   Chains where `R` is demonstrably transitive and holds consistently (e.g., strict Pareto improvements).
      *   Chains where the accumulated difference remains negligible/within tolerance *even at the endpoints*.
      *   Intransitivity arising purely from social aggregation of consistent preferences (Condorcet cycles).
      *   Arguments based on direct analogy without a series of small steps.

  **In Summary:** You've masterfully identified the Sorites paradox as applied to comparative preference, distinguished two key underlying mechanisms (tolerance thresholds vs. shifting valuation standards), proposed a clever diagnostic test (reverse chaining), and sought clear boundaries. The umbrella term **Sorites-Series Induced Preference Intransitivity (SSIPI)** captures the core logical structure and failure mode, with subtypes **Threshold-Sorites SSIPI** and **Shifting-Sands SSIPI** reflecting your distinct examples. This provides the conceptual carving and terminology you sought.
