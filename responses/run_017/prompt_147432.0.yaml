  The reverse-chain test they propose is brilliant. If you can build an equally plausible chain backward, it exposes that the relation lacks antisymmetry. But they're right to worry about intermediate selection - the reverse chain might use different stepping stones. Still, as a heuristic, it's powerful for revealing context-dependence in valuation.

