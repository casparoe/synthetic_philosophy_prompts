  Indeterminist  Supersub-    [Q4: Global drag = same?]  Relationism  
  Substantivalism│stantivalism    ┌──────┴──────┐  
                 │               Yes           No  
                 │                │             │  
                 │    Sophisticated Sub.      [Q5: Accept indeterminism?]  
                 │                            ┌───┴───┐  
                 │                           Yes     No  
                 │                            ∅     [Q6: Add structure?]  
                 │                                 ┌───┴───┐  
                 │                                Yes     No  
                 │                                 │       │  
                 │                      Modified GR  Hole-Free Only  
  ```  
  **∅ = Incoherent** (Rejecting haecceitism but denying global drag identity → contradiction).  

  This fits on one page, uses no math beyond "diffeomorphism," and isolates commitments cleanly. The global drag test (Q4) is critical for splitting haecceitism-deniers. Let me know if you need tweaks!
