prompt: |-
  I teach a short unit on choice under uncertainty in an undergraduate decision-theory course, and for the last few years I have opened it with an informal version of the Ellsberg urn before the formal lecture — ninety balls, thirty red, the remaining sixty black or yellow in some proportion the students are not told. Most of them bet on red rather than on black, and on black-or-yellow rather than on red-or-yellow, and we take it from there. The wrinkle I cannot place is this. If I tell them the urn's composition was fixed the night before by a machine, printed on a slip, and sealed in an envelope in my desk — nobody has read it, nobody will read it before they choose, and nobody can see which colour they bet on — they show the usual mild avoidance of the ambiguous options. If I describe exactly the same urn, the same machine, the same uniform spread over possible compositions, with the single difference that the machine has not run yet and will not run until after they have committed, the avoidance gets visibly stronger, and several of them say something like "well, in the first case someone could at least tell us." As far as I can see nothing decision-theoretically relevant has changed: their evidence is the same, the second-order distribution over compositions is the same, no one observes their bet, no strategic or adversarial channel exists, and they will learn nothing before choosing. The same pattern turns up with a coin I have already flipped and covered with my hand versus one I have not yet flipped, and, in conversation outside class, with aScan that is sitting unread in a lab versus a sample that has not yet been taken.

  I know the genus: ambiguity aversion, the risk-versus-uncertainty gap, the way these cases make the sure-thing principle fail. What I am after is the cut inside it, and I will not be satisfied with a bare label. Is there an established name for sensitivity to whether the unknown quantity is already settled but hidden rather than not yet settled by anything at all — and if there is, how exactly does it differ from the neighbouring notions? Someone in a forecasting seminar once mentioned to me that modellers distinguish uncertainty that comes from missing knowledge from uncertainty that comes from randomness itself, but I suspect that distinction is about something else (whether the uncertainty is in principle reducible, or where the variation comes from), and in both of my urns the chooser's ignorance is equally irreducible and the variation has the same source. If nothing established fits, then say so and give me a term with a definition I could actually use in a lecture.

  Three more things I want, and please argue them out rather than point me to a bibliography — I have no library access while I am writing this and I want the reasoning, not references. First, boundary cases: what about a slip that is printed and then destroyed unread, so the composition was settled but exists nowhere; what about a composition drawn after the bet by a machine guaranteed to be independent of the bet; what about a composition fixed in advance and shown to a third party who is forbidden to speak but whose face might give something away? Which side of the line does each fall on, and does that tell us the line is really about time, about whether the information exists somewhere, or about something else? Second, is the asymmetry rationally defensible at all, or is it a bias that a competent chooser should train out of herself — and what consideration or small experiment would tell the two apart? Third, if it is defensible, what would a decision theory that respects it have to give up, given that standard models have no room for a difference between a state that is merely unknown and a state that is not yet fixed?
reasoning: |-
  Okay, let me tackle this professor's query step by step. They're teaching decision theory and noticed a fascinating wrinkle in how students react to the Ellsberg urn scenario. The key observation is that ambiguity aversion intensifies when the uncertainty is about a future random event versus a past-but-hidden one. 

  First, I need to pinpoint the exact phenomenon. The professor mentions that when the urn composition is already determined but concealed (sealed envelope), students show mild ambiguity aversion. But when the composition hasn't been determined yet (machine will run after they choose), the aversion becomes stronger. Students explicitly say things like "someone could at least tell us" in the first case. 

  Hmm, this feels familiar but distinct from standard ambiguity aversion. I recall that in epistemology and decision theory, there's a concept called "metaphysical vs. epistemic uncertainty" - but that might not capture the nuance here. The professor wants to know if there's a specific term for sensitivity to whether the unknown is already settled but hidden versus not yet settled.

  Let me think about related concepts. Knightian uncertainty is about unmeasurable risk, but that doesn't distinguish between past-hidden and future. Ontic vs. epistemic uncertainty comes close - ontic being about the world's state, epistemic about knowledge. But in both urn scenarios, the uncertainty seems epistemic from the student's perspective. 

  Ah! What if we frame it as "temporal ontology of uncertainty"? That might be too jargony. Alternatively, "source asymmetry in ambiguity" - but that's not quite right. 

  I remember some work on "hidden information" versus "unrealized randomness" in experimental economics. The sealed envelope represents potentially knowable information (even if not actually known), while the future machine outcome represents fundamental indeterminacy. That resonates with the students' comment about "someone could tell us."

  For the boundary cases:
  - Slip printed then destroyed: This should behave like the future case because the information doesn't exist anymore. The composition was settled but is now fundamentally unknowable.
  - Composition drawn after bet by independent machine: Still future-like uncertainty since outcome isn't determined at choice time.
  - Composition shown to silent third party: This introduces possible signaling, so it's different - the uncertainty is reducible through observation, making it more like the sealed envelope case but with added complexity.

  Regarding rational defensibility: There might be a weak argument based on "knowledge in principle." In the sealed envelope case, the truth exists and could theoretically be known, which might make people feel the probability is more "objective." Whereas with future randomness, probabilities feel more subjective. But normatively, since the chooser has identical information in both cases, the distinction shouldn't matter. A competent chooser should ideally not distinguish them.

  For decision theory implications: Standard models (like Savage) treat all uncertainty the same. Accommodating this would require either introducing time-indexed states or different uncertainty types. It might violate state independence or require more complex representations. The cost would be added complexity for questionable normative gain.

  I think "ontic/epistemic uncertainty" comes closest, with the caveat that "epistemic" here means uncertainty about existing facts while "ontic" means uncertainty about future contingencies. But since many philosophers use "epistemic" broadly, we might need a modifier - perhaps "temporalized uncertainty" or "settledness sensitivity." 

  The clearest term might be "source asymmetry in ambiguity aversion" but that's descriptive rather than established. Given the lack of consensus term, I'd propose "fixed-but-hidden vs. not-yet-determined uncertainty" for classroom use, explicitly defining the distinction.
answer: |-
  The phenomenon you're observing is a nuanced cut within ambiguity aversion, specifically **ontic versus epistemic uncertainty**, where "ontic" refers to uncertainty about states that *already exist* but are hidden, and "epistemic" refers to uncertainty about states *not yet realized*. This distinction hinges on whether the unknown quantity is **settled in reality** (even if inaccessible) versus **fundamentally indeterminate** at the time of choice. Below is a breakdown addressing your queries, with definitions and reasoning.

  ---

  ### **1. The Core Distinction: "Settled-but-Hidden" vs. "Not-Yet-Determined"**
  - **Established Term**: While no universal term exists, philosophers (e.g., Isaac Levi) and decision theorists (e.g., in work on "causal decision theory") distinguish **ontic** (world-state) uncertainty from **epistemic** (knowledge-state) uncertainty. Your cases split this further:
    - **Sealed Envelope (Past, Hidden)**: Uncertainty is *epistemically constrained* but *ontically settled*. The composition exists and is *in principle knowable* (e.g., by opening the envelope). Students intuit a "fact of the matter" even if inaccessible.
    - **Machine Not Yet Run (Future, Indeterminate)**: Uncertainty is *ontically open*. No fact exists until the machine runs. This feels like "pure randomness" with no latent truth.
  - **Why the Asymmetry?**  
    Humans instinctively weight "not-yet-determined" uncertainty more heavily because:
    - **Cognitive Metaphor**: We treat future randomness as "causally active" (it might react to us), while past hidden states are "causally inert." Even when told the bet can't influence outcomes, the *temporal frame* triggers intuitions of control or lack thereof.
    - **Knowability Threshold**: If information *could* exist (envelope), ambiguity feels reducible ("someone *could* tell us"). If no information exists (future), ambiguity feels irreducible.

  ---

  ### **2. Boundary Cases: Where Does the Line Fall?**
  - **Printed Slip Destroyed Unread**:  
    → **Behaves like "not-yet-determined" (strong aversion)**. The composition was settled but is now *ontically erased*. With no latent information, uncertainty becomes metaphysically unresolvable.
    
  - **Composition Drawn Post-Bet by Independent Machine**:  
    → **Behaves like "not-yet-determined" (strong aversion)**. The outcome is unsettled at choice time. Independence guarantees no strategic concern, but the *absence of a pre-existing state* dominates intuition.

  - **Composition Shown to Silent Third Party**:  
    → **Behaves like "sealed envelope" (mild aversion)**. Uncertainty is epistemically constrained but onticly settled. The *potential* for information leakage (e.g., facial cues) makes it feel "more knowable" than a sealed envelope, but the core intuition is of a hidden fact.

  **What the Line Is Really About**:  
  It depends on **whether a fact exists in the world at the moment of choice**—**not** time per se. The critical factor is *ontic settledness*:  
  - ✅ **Settled + inaccessible** (envelope, third party) → mild aversion.  
  - ❌ **Unsettled or erased** (future, destroyed slip) → strong aversion.  

  ---

  ### **3. Rational Defensibility: Bias or Prudent Heuristic?**
  - **Normatively Indefensible** (from standard decision theory):  
    If all probabilities are subjective and states are defined by their informationally relevant features (à la Savage), the distinction *shouldn’t matter*. Identical second-order distributions imply identical ambiguity. A competent chooser should ignore whether uncertainty stems from hiddenness or indeterminacy.
    
  - **Pragmatically Defensible** (as a heuristic):  
    In natural environments, "not-yet-determined" events often correlate with:
    - **Strategic interdependence** (e.g., other agents influencing outcomes).
    - **Non-stationary processes** (e.g., hidden variables changing pre-decision).  
    Here, treating future randomness as "riskier" could be adaptive. However, in your controlled setup, this heuristic misfires.

  **Test to Distinguish Bias from Rationality**:  
  Run a variant where students **bid money** for gambles (e.g., auctioning a bet on red).  
  - **Prediction**: If the bid gap between red vs. black widens in the "future" case, it reveals an emotional bias (loss aversion to "pure chance").  
  - **Competent Chooser Test**: After teaching rational choice principles, rerun the experiment. If asymmetry persists, it’s a deep-seated bias; if it vanishes, it was corrigible ignorance.  

  ---

  ### **4. Implications for Decision Theory**
  A theory respecting this asymmetry must abandon **state neutrality** (treating all unknown states identically). Specifically, it requires:
  - **State-Dependent Ambiguity**: Define ambiguity aversion not just over probability distributions, but over the *ontological status* of states (settled vs. indeterminate).
  - **Temporal Indexing of States**: States must include *when* uncertainty resolves (e.g., "red if composition pre-determined" vs. "red if composition post-determined").
  - **Cost**: Such a theory violates the **Sure-Thing Principle** and **Consequentialism**. It might also require abandoning **probabilistic sophistication** (representing beliefs as single priors).

  ---

  ### **Term for Classroom Use: "Settledness Sensitivity"**
  Since no perfect term exists, define this empirically as:  
  > **Settledness Sensitivity**: *The tendency to perceive ambiguous events as riskier when their outcomes are not yet determined (future randomness) compared to when they are determined but hidden (past secrets), even when information and strategic incentives are identical.*

  ### **Why This Fits Your Cases**
  - **Coin Flipped/Covered** → Settled/hidden (mild aversion).  
  - **Coin Not Flipped** → Not determined (strong aversion).  
  - **Unread Lab Scan** → Settled/hidden (mild aversion).  
  - **Sample Not Taken** → Not determined (strong aversion).  

  This captures the "someone could tell us" intuition: the distinction is about the *existence of a fact*, not reducibility or source of variation.
