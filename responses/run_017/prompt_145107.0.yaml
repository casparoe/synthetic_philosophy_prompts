prompt: |-
  So I'm in this cross-listed poli-sci/philosophy class on collective decision making, and we spent a week on herding: the thing where a line of perfectly rational people, each able to see what the people before them did, can end up doing something dumb even though every individual step was reasonable. My professor tossed off something like "which is why elections are secret" and moved on, and I haven't been able to let it go since, because it seems like at most half the story.

  Here's what bugs me. In every election I've voted in, the whole apparatus is built around me not seeing anyone else's choice and nobody ever seeing mine: I go into a booth alone, there's a curtain, my name gets ticked off and the ballot is separated from it, and in a lot of places even photographing your own filled-out ballot is against the rules. And yet the same election is wrapped in herding machinery — months of public polling, endorsements everyone openly justifies in terms of "momentum", primaries where states vote one after another and the entire narrative is about who's surging after the first couple of contests, news outlets that hold off calling a state until the polls there have shut. And there are still small assemblies — the Swiss kind, some New England town meetings — where people raise their hands in front of their neighbours and it doesnt seem to cause a crisis. So the practice seems to say: my neighbour's revealed vote is dangerous information when it reaches me one at a time in real time, harmless or at least unavoidable in the aggregate, and dangerous again if it reaches me the day before I vote.

  What I'd like you to do is reconstruct the implicit theory as carefully as you can. What view of other people's choices as evidence does the secret ballot presuppose? I can think of four candidates and I can't figure out how they fit together: (1) other people's votes are not pure reports of their private information, they're already partly social, so pooling them destroys whatever independence you needed for the crowd to be wise in the first place; (2) people are bad at discounting — once you've seen the tally you can no longer tell apart what you actually knew from what you inferred from the tally, so the tally contaminates instead of informing; (3) it isn't epistemic at all, it's about coercion and vote buying — if you can't prove how you voted, nobody can buy or threaten your vote — and the anti-cascade story is something we tell afterwards; (4) something about legitimacy, that a collective decision is only really ours if it's built out of seperate judgements rather than imitation. Which of these does the practice strictly need, which does it merely sit comfortably with, and are any of them in tension? Note especially the weird bit: if (3) were the whole story, then publishing everyone's vote after the fact, or having a ballot you could look up later, should be unproblematic, and I'm not at all sure it is.

  Then the part I actually want your opinion on. My friend has this scheme he won't shut up about, he calls it a "shadow tally": everyone votes secretly exactly as now, but a randomly drawn 10% of voters get a message an hour before polls close showing them the current tally of the other 90%, and they get to recast their vote, with only the second one counted. His pitch is that you keep the independence of the secret ballot for most of the electorate and then let a small, explicitly-designated sample inject the social information in a controlled dose. I think it's either brilliant or insane. Tell me what someone designing this would have to believe — about how much and what kind of information is in ordinary voters' private signals, about whether herding is a failure of aggregation or a failure of incentives, and about what makes an outcome legitimate — for the scheme to make sense. And then tell me whether, on the secret ballot's own terms, we should have replaced it with something like this ages ago. If you think the whole anti-cascade reading is backwards and the secret ballot is really only about coercion, say that too, and tell me what would actually change in how we design elections if we stopped believing the cascade story.
reasoning: |-
  Hmm, the user is grappling with a fascinating paradox in democratic theory: how secret ballots coexist with public herding mechanisms like polling and sequential primaries. They've identified a core tension between preventing informational cascades (where people follow others' choices rather than their own judgment) and enabling collective wisdom through information sharing.

  The user has outlined four possible theories behind secret ballots:
  1) Contaminated information (votes aren't independent signals)
  2) Cognitive limitations (people can't properly discount others' choices)
  3) Coercion prevention (the standard justification)
  4) Legitimacy through independent judgment

  The coercion theory (3) seems incomplete because post-election disclosure would still prevent coercion yet isn't done. The legitimacy theory (4) feels important but vague. The cognitive limitation theory (2) explains why real-time feedback is dangerous while aggregated results are safe. The contamination theory (1) suggests early voters' signals get corrupted by social influences.

  The "shadow tally" proposal is clever but problematic. It assumes voters can handle aggregate data rationally, which contradicts the cognitive limitation justification. It creates two classes of voters, undermining legitimacy. And it introduces new vulnerabilities like strategic timing of information release.

  The real insight might be that secret ballots serve multiple purposes simultaneously: preventing coercion AND cascades AND preserving legitimacy. Public polling exists precisely because we crave social information, but we contain it through aggregation and time delays to mitigate its dangers. The Swiss assemblies work because they're small communities with shared norms - scale changes everything.

  Ultimately the user seems to want confirmation that their professor oversimplified. The secret ballot isn't just about herding OR coercion - it's a brilliant institutional solution to multiple problems of collective decision-making in complex societies.
answer: |-
  Your professor's throwaway line touches on a profound tension in democratic design. Let's reconstruct the implicit theory of the secret ballot, then evaluate your friend's "shadow tally" proposal through that lens.

  ### The Secret Ballot's Implicit Theory: A Layered Justification
  The practice doesn't rely on a single rationale but a nested set of concerns, with varying degrees of necessity:

  1.  **The Core: Prevention of Coercion and Vote-Buying (Theory 3)**
      *   **Strictly Necessary:** This is the historical and legal bedrock. If votes are observable, individuals can be punished or rewarded based on their choices. The secret ballot makes this verification impossible, protecting voter autonomy.
      *   **Tension with Post-Facto Disclosure:** You've hit the nail on the head. If coercion prevention were the *only* goal, publishing votes afterward (or allowing lookups) *should* be acceptable (though risky if done before all votes are cast). The fact that it's almost universally prohibited strongly suggests *additional* rationales are at play.

  2.  **Preventing Real-Time Informational Cascades (Theories 1 & 2)**
      *   **Sits Comfortably With, Likely Necessary for Full Justification:** This is where the herding logic applies. The secret ballot aims to sever the real-time feedback loop where one voter's choice directly influences the next.
      *   **Theory 1 (Contaminated Signals):** Votes are not pure Bayesian signals. Voters incorporate social pressure, expressive desires, strategic calculations (e.g., bandwagoning/underdog effects), and prior polling *into* their vote. A sequence of public votes aggregates these already-socially-influenced signals, amplifying distortion. Secrecy forces each vote to be a snapshot of the voter's *final* state of mind at the moment of casting, minimizing immediate peer pressure.
      *   **Theory 2 (Cognitive Discounting Failure):** Humans struggle to rationally discount socially transmitted information. Seeing others vote a certain way creates normative pressure ("everyone else is doing it") and informational pressure ("they must know something I don't"). Secrecy removes this immediate social proof, forcing reliance on one's own (imperfect) judgment and pre-election information.
      *   **Crucial Distinction: Aggregate vs. Sequential:** Public polls *aggregate* opinions collected *asynchronously* and report them *en masse*. Primaries *sequence* events but votes are cast secretly *within* each state. This aggregation and time-delay dampens the cascade risk compared to seeing the person immediately before you vote publicly. Town meetings work partly due to small size (strong norms, reputational costs for bad faith) and partly because the vote is the *end* of a deliberation process, not a sequential signal.

  3.  **Legitimacy Through Independent Judgment (Theory 4)**
      *   **Sits Comfortably With, Reinforces Practice:** Democracy derives legitimacy partly from the idea that the outcome reflects the *considered, independent* will of the people. Secrecy symbolizes and enforces this independence. It allows voters to act on conscience or private interest without fear of social sanction. A cascade undermines this, making the result seem like a product of social contagion rather than individual evaluation.

  **Synthesis:** The secret ballot is primarily a coercion-prevention device (Theory 3 - **Necessary**). However, its strict rules against *any* vote disclosure (even post-facto or personal proof) are strongly bolstered by the need to prevent cognitive/social herding in the voting act itself (Theories 1 & 2 - **Comfortable/Semi-Necessary**) and to uphold the legitimacy derived from independent judgment (Theory 4 - **Comfortable/Reinforcing**). Theories 1, 2, and 4 collectively explain why we go beyond mere coercion prevention to enforce strict secrecy even *after* voting. There's tension only if one insists on a single rationale; the practice elegantly serves multiple interdependent purposes.

  ### Evaluating the "Shadow Tally": Beliefs, Risks, and Legitimacy
  Your friend's scheme is intriguingly ambitious but rests on specific, potentially flawed, assumptions:

  **What the Designer Must Believe:**

  1.  **Voters as Bayesian Updaters:** They must believe the 10% sample can rationally process the aggregate 90% tally as a pure signal of underlying quality/preference, accurately updating their prior beliefs without succumbing to normative pressure or cognitive biases (contradicting Theory 2).
  2.  **Herding as Primarily Informational Failure:** They must see cascades mainly as a failure to aggregate dispersed information (Theory 1 signal contamination) rather than a failure of incentives (coercion) or cognition (Theory 2 discounting failure). They believe injecting *aggregate* information late solves the sequential cascade problem.
  3.  **Private Signals are Valuable but Imperfect:** They assume ordinary voters possess meaningful private information (e.g., local conditions, personal values) that isn't fully captured in polls or campaigns, but that this information could be improved by seeing the *actual* vote intention of others (not just poll responses).
  4.  **Legitimacy Resides in Outcome, Not Process:** They prioritize the "correctness" or informational efficiency of the outcome over the procedural legitimacy of equal, independent voting. The two-tiered system is acceptable if it produces a "better" result.
  5.  **Limited Vulnerability:** They believe the coercion risk is adequately managed because only the *final* vote is secret and counted, and the 10% are chosen randomly *after* revealing the tally only to them (though threats could still demand proof of the *second* vote).

  **Problems and Risks:**

  1.  **Violates Core Secrecy & Equality:** Creating two classes of voters (90% pure secret, 10% "informed updaters") fundamentally undermines the principle of equal suffrage and the symbolic legitimacy of identical treatment (Theory 4). The 10% are explicitly granted superior information and influence.
  2.  **Cognitive Realism:** Expecting the 10% to rationally update ignores the powerful normative and emotional impact of seeing a lopsided tally ("Why buck the trend?" "My vote won't matter/My preferred cause is lost/won"). This directly triggers the discounting failure (Theory 2) the secret ballot avoids.
  3.  **Strategic Chaos & Manipulation:**
      *   *Campaigns* would target the "10% hour," flooding them with last-minute ads or misinformation.
      *   *Voters* might strategically misrepresent intentions in polls hoping to influence the 90% tally shown to the 10%.
      *   *Timing Attacks:* Malicious actors could disrupt the tally system *during* the crucial hour.
      *   *Perception of Illegitimacy:* Losers would blame the "privileged 10%" or question the randomness of selection.
  4.  **Unclear Benefit:** It's speculative whether this would meaningfully improve outcomes over polls + secret ballot. It adds complexity and risk for dubious gain. The 90% tally is already a highly informative signal – arguably as good as polls.

  **Should We Replace the Secret Ballot with This?**
  **Absolutely not, on the secret ballot's own terms.** The shadow tally:
  *   **Undermines Equality:** Creates privileged voters.
  *   **Reintroduces Cascade Risk:** Exposes a critical subset to massive social pressure exactly when voting.
  *   **Weakens Coercion Resistance:** While still secret, the focus on the second vote creates new verification pressures.
  *   **Compromises Legitimacy:** The process appears manipulative and unequal, violating the core democratic principle of "one person, one vote" under identical conditions.
  *   **Adds Immense Complexity & Vulnerability:** For minimal theoretical benefit and significant practical risks.

  ### What if the Cascade Story is Backwards? Embracing Coercion-Prevention as Primary
  Suppose we jettison the anti-cascade rationale and affirm the secret ballot is *solely* about preventing coercion and vote-buying (Theory 3). How would election design change?

  1.  **Post-Facto Disclosure Becomes Possible:** Voters could receive a cryptographic receipt proving *how* they voted (for audits or personal verification), or anonymized votes could be published in bulk after results are certified. Public voting records (like some legislative votes) might become more acceptable.
  2.  **Reduced Anxiety Over Pre-Vote Information:** Concerns about polling, endorsements, sequential primaries, and media calls would focus solely on their potential to *indirectly* influence through persuasion, not on their inherent corruption of the voting act itself. The "bandwagon effect" would be seen as a campaign/polling issue, not a voting secrecy flaw.
  3.  **Potential for New Voting Methods:** Exploration of non-secret (but coercion-resistant) voting in specific small-scale, high-trust settings (e.g., some boards, juries) might increase, relying on norms and transparency rather than enforced secrecy. However, mass elections would likely retain secrecy due to the persistent risk of intimidation.
  4.  **Focus Shifts to Securing the Chain of Custody:** The paramount concern would be ensuring *no one* (not even the voter) can *prove* their vote to a third party *at any time*, preventing coercion *ex ante*. Current strict rules against ballot photography would remain crucial.
  5.  **Legitimacy Rationale Evolves:** Legitimacy would stem more from freedom from coercion and accurate counting, less from the metaphysical ideal of perfectly isolated individual judgment. The "social" nature of voting would be more openly acknowledged.

  **Conclusion:** Your instinct is correct – your professor offered half the story. The secret ballot is a multi-layered institution primarily preventing coercion, but its strict rules also function as a cognitive firewall against real-time informational cascades and uphold a powerful norm of independent judgment. The "shadow tally," while clever, misunderstands the depth of the cascade problem (it's cognitive, not just informational) and fatally compromises core democratic principles of equality and legitimacy. If we embraced the coercion-only view, elections would look subtly different, primarily allowing post-vote verification, but the fundamental secrecy at the moment of casting would likely remain indispensable for mass democracy. The persistence of public herding *alongside* the secret ballot reflects democracy's messy reality: we crave social information to navigate complexity, but we build institutions like the voting booth to prevent that very information from overwhelming individual autonomy in the critical moment of choice.
