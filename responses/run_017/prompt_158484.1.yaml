  ## Lewisian Lenses on the Multiverse of Madness: Reading *Everything Everywhere All at Once*

  *Everything Everywhere All at Once* (EEAAO) presents a visually and emotionally overwhelming multiverse, making it a tempting test case for David Lewis's audacious modal realism. Lewis posits a plurality of concrete, spatiotemporally isolated worlds, generated by unrestricted recombination, where "actuality" is merely indexical ("I am here"), and trans-world identity is replaced by counterpart relations based on similarity. EEAAO initially seems like a perfect dramatization: countless bizarre worlds (hot dog fingers, Raccacoonie, piñata parties) scream unrestricted recombination. The initial premise, where Evelyn accesses other versions of herself, even flirts with counterpart theory – these other Evelyns share origins and core traits but diverge wildly. The film’s core emotional arc, however, fundamentally departs from Lewisian orthodoxy in ways that illuminate both the philosophy and the film’s unique contribution.

  **Where Worlds Align (Loosely):**
  The sheer *plenitude* of worlds depicted visually embodies Lewis’s principle of unrestricted recombination. Anything that *can* happen *does* happen, somewhere – a core Lewisian commitment. The Alphaverse agents treating their world as baseline "reality," while Evelyn experiences her IRS laundromat world as uniquely "actual," initially mirrors Lewis’s indexical view of actuality. No world is metaphysically privileged. Furthermore, the initial setup, where Evelyn accesses skills and memories *from* other versions *of herself*, leans towards counterpart theory. Alpha Waymond explicitly frames it as accessing other "Evelyns," implying distinct individuals sharing origins and properties, not one Evelyn spread across worlds. This resonates with Lewis’s rejection of trans-world identity.

  **Where Worlds Collide (Fundamentally):**
  The film’s mechanics immediately sabotage Lewisian isolation. Verse-jumping technology enables genuine travel and causal interaction between worlds. Alpha Waymond, Jobu Tupaki, and eventually Evelyn physically move between worlds, exerting causal influence. Jobu Tupaki explicitly *destroys* worlds – an impossibility under Lewisian isolation. This directly contradicts the core thesis of spatiotemporal and causal isolation. Crucially, the film insists on literal identity, not counterpart relations. Jobu Tupaki isn’t merely a counterpart to Joy; she *is* Joy from the Alphaverse, warped by infinite perception. Evelyn isn’t accessing counterparts; she *is* momentarily becoming those other Evelyns ("I *am* you!"). This collapses the distinction Lewis meticulously defends. The branching model implied by choices (e.g., "What if I said yes to the divorce?") is also anti-Lewisian. Lewisian worlds are discrete, not branches sprouting from a shared trunk; recombination generates entirely separate histories, not divergences from a common past.

  **The Nihilism Abyss and the Kindness Gambit:**
  Jobu Tupaki’s nihilism stems directly from Lewisian plenitude: seeing *everything* means witnessing every horror, every failure, every pointless cruelty. The "everything bagel" is the perfect symbol – a black hole of meaninglessness consuming all possibilities. Lewis would diagnose Jobu’s despair as a category error. For him, the existence of worlds containing horrors doesn’t make *this* world worse, nor does it obligate despair; existence isn’t endorsement. The "problem of evil" applied to modal realism is misplaced because God didn’t *create* all worlds; they just *are*. The film, however, answers in the *practical* register Evelyn discovers: **choosing kindness and connection despite the chaos.** This is most potent in the rock universe scene. Stripped of physicality and multiversal noise, the simple choice to "just be a rock" alongside her daughter embodies focusing on the local, immediate act of care, even if (especially if) it seems absurd (googly eyes) or insignificant against the cosmic backdrop. Her final confrontation with Jobu/Joy emphasizes *choosing* to stay and fight for the relationship *here*, in this messy, flawed world.

  *   **Assessment:** The film’s answer is a **genuine reply** to the *existential* worry provoked by plenitude (how do I live knowing *all this* exists?), but it’s a **change of subject** regarding the *metaphysical* "problem of evil" Lewis addresses. It shifts focus from ontology to ethics and psychology.
  *   **Lewisian Borrowable?** **Partly.** A Lewisian can absolutely embrace the *practical stance* Evelyn adopts – choosing meaning locally despite global plenitude is consistent with Lewis’s view that we are only practically engaged with *this* world. However, they cannot borrow the *metaphysical grounding* the film implies for this stance (e.g., that multiversal travel *validates* the despair or that kindness magically counters cosmic indifference). For the Lewisian, kindness is a local virtue, not a multiversal salve.

  **The Home-World Restriction: Patch or Punctured?**
  Your "Home-World Restriction" (HWR) – that practical reasons bind an agent only to their occupied world due to causal isolation – is elegant Lewisian orthodoxy. It diagnoses Jobu’s nihilism as a scope error: she mistakenly applies the weight of *all* worlds to her practical reasoning *within* one.

  *   **Strongest Objection:** The film **explicitly falsifies the HWR's core premise.** Verse-jumping enables cross-world travel and causation. Evelyn *can* and *does* act in other worlds. Jobu *does* destroy other worlds. Reasons demonstrably range beyond the "home" world. The HWR is built on sand in EEAAO's universe.
  *   **Best Defence:** Despite the mechanics, the film’s *resolution* powerfully **reinstates the spirit of the HWR.** Evelyn’s ultimate choice is to *stay* in her laundromat world and focus her energy on repairing her relationships *there*. She rejects multiversal domination ("You can be anything!") in favor of being present *here* ("Just please... be kind."). The rock scene underscores that meaning is found in the specific, local connection, not in multiversal scope. The googly eyes symbolize embracing the absurdity and possibility *within* the local context.
  *   **Survives?** **Only if revised.** The strict HWR, denying cross-world causation, cannot survive verse-jumping. However, a revised "Practical Primacy of the Local" principle emerges: **Even with cross-world travel, an agent's deepest reasons and capacity for meaningful action remain fundamentally rooted in, and most effectively exercised within, the world they call home and the specific relationships they nurture there.** Causation *can* cross worlds, but *meaningful agency* finds its most potent expression locally. The ending affirms this revised principle.

  **What the Film Adds and a Caveat**
  EEAAO’s core contribution isn't a new argument for modal realism, but a visceral **exploration of the existential *weight* of plenitude and the intense, fragile beauty of choosing local connection against an infinite backdrop of possibility and absurdity.** It dramatizes the emotional stakes Lewis’s ontology might imply in a way pure argument cannot, asking "How do you *live* knowing this?"

  **Teaching Caveat:** The most likely mistaken impression is that **EEAAO accurately depicts Lewisian modal realism.** Students may conflate the film's branching, causally connected, identity-preserving multiverse with Lewis's causally isolated, recombinatorial, counterpart-based plurality. Head this off by explicitly contrasting the mechanics (travel vs. isolation, literal identity vs. counterparts, branching vs. discrete worlds) early and often, emphasizing that the film uses *a* multiverse model to explore themes Lewis also engages, but a *different* model.

