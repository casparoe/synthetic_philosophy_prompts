answer: |-
  Your configuration is a precise and fascinating instance of **threshold-dependent self-undermining collective inaction**. While no single term perfectly captures every nuance, the closest established concept is a **self-negating prophecy** (a subtype of reflexive predictions), specifically operating in a **threshold public good game**. Here's the delineation:

  ### Core Concept: Threshold-Dependent Self-Negating Prophecy
  - **Definition**: A belief that one's individual action is causally irrelevant to a collective outcome, which is:
    1. **Individually true** under current conditions (for each agent holding it),
    2. **Collectively false** (the group of believers *could* change the outcome),
    3. **Self-negating under adoption**: If sufficiently many adopt the belief/inaction, the conditions change such that the belief becomes false *even for individuals*.

  ### Distinctions from Neighboring Concepts:
  1. **Fallacy of Composition** (e.g., "Each brick is lightweight, so the wall is lightweight"):  
     - *Similarity*: Infers a group property from individual properties.  
     - *Difference*: Your case involves *dynamic reflexivity*. Widespread belief alters the system, invalidating the individual claim. The fallacy of composition is static.  
     - **Boundary**: If the claim ("my vote never matters") remained true for individuals *regardless* of adoption (e.g., in a dictatorship), it would be pure fallacy of composition.

  2. **Self-Fulfilling Prophecy** (e.g., bank runs):  
     - *Similarity*: Belief affects behavior, altering outcomes.  
     - *Difference*: Here, belief *falsifies* itself ("If we all believe X, X becomes false"), whereas self-fulfilling prophecies *validate* themselves ("If we believe Y, Y becomes true").  
     - **Boundary**: In a self-fulfilling prophecy of abstention (e.g., "No one votes, so I won't"), belief reinforces itself. Your case is its inverse: belief destroys its own premise.

  3. **Voter's Paradox / Rational Irrationality**:  
     - *Similarity*: Focuses on individual cost/benefit calculus.  
     - *Difference*: Your concern is *epistemic* (truth conditions of the irrelevance claim), not instrumental rationality. The paradox assumes fixed probabilities; your case has *endogenous threshold dynamics*.  
     - **Boundary**: If the probability of being pivotal were *always* near-zero (e.g., in a billion-voter election), it would be pure voter's paradox. Your examples rely on *marginal thresholds*.

  4. **Sorites Vagueness** (e.g., heap paradox):  
     - *Similarity*: Ambiguity around "making a difference" near thresholds.  
     - *Difference*: Sorites problems lack reflexivity. The vagueness of "pivotal" is incidental; the core is the *causal loop* between belief and system state.  
     - **Boundary**: In a non-reflexive threshold (e.g., "Does a grain of sand make a heap?"), no self-negation occurs.

  ### Essential Features & Edges:
  - **The instability is essential**: The self-negating dynamic distinguishes it from static fallacies.  
  - **Threshold dependency**: The claim is only individually valid when the group is *below* the critical threshold for collective impact.  
  - **No individual causal power**: No single agent’s belief/inaction alters the system; change requires *critical mass*.  
  - **Equilibrium story**:  
    - At high participation, the claim is individually true (for non-pivotal voters).  
    - As belief spreads, participation drops until a threshold where residual voters *become* pivotal (e.g., in ultra-low-turnout elections).  
    - Equilibrium: Belief holds only for agents in non-competitive districts *or* when turnout is high enough that pivots are rare. The claim is *false* for the marginal voter in close races.  

  ### Positive vs. Negative Cases:
  - **Positive Case (Fits)**:  
    > *A voter in a "safe" district (60/40 partisan split) abstains, claiming irrelevance. If 15% of the majority share abstain* en masse*, the seat flips. Individually true → collectively false → self-negating if adopted.*  
  - **Negative Case (Outside Boundary)**:  
    > *Abstaining from a presidential election in a national popular vote system with 150M voters. Even if all like-minded abstain, a single vote’s probability of being pivotal remains negligible (<10⁻⁸). No threshold exists where individual irrelevance ceases to hold.*  

  ### Application Beyond Voting:
  - **Same Structure**: Boycotts/consumption where impact requires hitting a critical mass (e.g., "My boycott won’t hurt Company X" → if all boycott, X collapses).  
  - **Different Phenomenon**: Linear-impact cases (e.g., CO₂ emissions). Individual irrelevance *never* becomes false (climate thresholds are global/political, not directly activated by individual adoption). This is a classic **collective action problem**, not self-negating.  

  ### Proposed Terminology:
  **Threshold-Reflexive Causal Irrelevance (TRCI)**  
  - *Defined*: A claim that an individual’s contribution to a threshold-dependent collective outcome is causally irrelevant, which holds for an agent only when the group of contributors is sufficiently large, but becomes false for individuals if the claim is widely adopted and reduces contributions below the threshold.  
  - *Why it fits*:  
    - "Threshold" captures the critical-mass dependency.  
    - "Reflexive" denotes the self-applied falsification.  
    - "Causal Irrelevance" centers the truth-conditional focus.  

  This carves the conceptual space by requiring all three elements: individual truth, collective falsehood, and adoption-induced negation. It excludes static fallacies, non-threshold dilemmas, and self-fulfilling dynamics.
