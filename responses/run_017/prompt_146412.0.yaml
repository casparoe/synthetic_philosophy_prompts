  ### Planning Paragraph
  I'll construct a flowchart that sorts readers into modal epistemology positions based solely on their judgments about concrete cases, avoiding abstract questions. The five cases will test key facets of conceivability: (1) the **Hesperus/Phosphorus case** probes whether conceivability implies possibility for identity claims; (2) the **zombie case** tests it for consciousness; (3) a **negative test** with an unsolved math problem examines whether inconceivability implies impossibility; (4) an **agglomeration test** (water properties) checks if conceivability composes; and (5) a **second-order test** (only for those who accept conceivability in 1 or 2) asks if ideal conceivability could be misleading. I'll map answer combinations to 7 positions: Idealized Conceivabilism (Chalmers), Defeasible Conceivabilism (Yablo), Necessity A Posteriori (Kripke), Skepticism, Inconceivabilism (zombies), Conceivability Localism (unnamed), and Strong Conceivabilism (unnamed). The tree will branch conditionally (e.g., only ask Q5 if Q1 or Q2 is "A"). Inconsistent answers will be treated as ties between positions. Q1 (Hesperus/Phosphorus) does the heaviest lifting by isolating Kripkean intuitions; Q4 (agglomeration) could be dropped without merging leaves, as it mainly refines Defeasible vs. Idealized views.

  ---

  ### Instrument: Conceivability Sorting Flowchart

  Begin at the top. Answer each question based on your intuition.

  **Q1: Two Names**  
  You know "Hesperus" names the bright object seen at dusk and "Phosphorus" names the one seen at dawn, but you’ve never checked if they’re the same thing. Can you imagine a world where they turn out to be distinct objects, and does this seem like a real possibility?  
  - **A**: Yes, I can imagine it, and it seems possible.  
  - **B**: I can imagine it, but it’s not really possible.  
  - **C**: I cannot really imagine it (after reflection).  
  - **D**: I have no way to tell if it’s possible.  

  **Q2: Physical Duplicate**  
  Imagine a perfect physical copy of a conscious human (same molecules, biology, etc.) that has no conscious experiences at all. Can you imagine this, and does it seem possible?  
  - **A**: Yes, I can imagine it, and it seems possible.  
  - **B**: I can imagine it, but it’s not really possible.  
  - **C**: I cannot really imagine it (after reflection).  
  - **D**: I have no way to tell if it’s possible.  

  **Q3: Unsolved Math Problem**  
  Consider Goldbach’s Conjecture: "Every even number >2 is the sum of two primes." No one knows if it’s true. Suppose we try but fail to conceive of it being false. Does this failure suggest it’s impossible (i.e., true)?  
  - **A**: Yes, failure to conceive suggests impossibility.  
  - **B**: No, failure to conceive doesn’t suggest impossibility.  
  - **C**: I don’t know.  

  **Q4: Water Properties**  
  You can imagine a world where water is H₂O but looks/tastes different (e.g., red and fizzy). Separately, you can imagine a world with XYZ (not H₂O) that looks/tastes exactly like water. But you can’t imagine one world where both are true. If the combination isn’t ruled out by definitions, should you be able to conceive them together?  
  - **A**: Yes, conceivability should survive combination.  
  - **B**: No, conceivability might not survive combination.  
  - **C**: I don’t know.  

  **Q5: Second-Order Test**  
  *(Only answer if you chose A in Q1 or Q2)*  
  Can you imagine that your capacity to imagine is broken? That is, you have a vivid, stable, coherent mental picture of something, reflect as hard as you want, yet it’s impossible.  
  - **A**: Yes, I can imagine that.  
  - **B**: No, I cannot imagine that.  
  - **C**: I don’t know.  

  ---

  ### Scoring Key and Position Mapping  
  *Based on your answers, find your position below. Inconsistent patterns? See "Ties" section.*

  | Position (Standard Name)                          | Answer Pattern                                  | Awkward Commitment                                                                 |
  |---------------------------------------------------|------------------------------------------------|-------------------------------------------------------------------------------------|
  | **1. Necessity A Posteriori (Kripke)**            | Q1 = **B** AND (Q2 = **B** OR Q2 = **C**)      | "Hesperus ≠ Phosphorus" is conceivable but impossible; empirical facts fix necessity. |
  | **2. Inconceivabilism (zombies)**                 | Q2 = **C** AND Q1 ≠ **B**                      | Zombies seem imaginable, but you insist they aren’t upon reflection.                |
  | **3. Conceivability Localism (unnamed)**          | (Q1 = **B** AND Q2 = **A**) OR (Q1 = **A** AND Q2 = **B**) | Conceivability works for consciousness *or* identity, but not both—no clear reason why. |
  | **4. Idealized Conceivabilism (Chalmers)**        | Q1 = **A**, Q2 = **A**, Q3 = **B**, Q4 = **A**, Q5 = **B** | Even if you conceive distinct Hesperus/Phosphorus, it’s metaphysically impossible—but you still trust ideal conceivability. |
  | **5. Defeasible Conceivabilism (Yablo)**          | At least one **A** in Q1/Q2 AND Q5 = **A**     | You must accept that your best-conceived scenarios could be impossible (e.g., zombies). |
  | **6. Strong Conceivabilism (unnamed)**            | Q1 = **A**, Q2 = **A**, Q3 = **A**, Q4 = **A**, (Q5 = **B** or **C**) | Non-ideal conceivability (e.g., our messy math intuitions) reliably tracks possibility. |
  | **7. Skepticism**                                 | All other patterns (e.g., Q1/Q2 = **D**, or patterns not above) | We have no reliable way to know what’s possible; conceivability is often unhelpful. |

  #### Unoccupied Combinations & Why
  - **Q1=B, Q2=D**: Incoherent—doubting consciousness conceivability after affirming identity’s impossibility.  
  - **Q1=C, Q2=B**: Unattractive—denying identity conceivability but affirming zombie inconceivability without justification.  
  - **Q3=A, Q4=A, Q5=B** (with Q1/Q2 not A/A): Unexplored—no major theory pairs negative and agglomeration trust with conceivability skepticism.  

  #### Indistinguishable Pairs
  - **Skepticism vs. Localism**: Hard to separate if Localism doubts many domains. A case about fundamental physics (e.g., conceiving faster-than-light travel) could split them: Localists trust it; Skeptics don’t.  
  - **Defeasible vs. Idealized**: Only separable via Q5 (Systematic error). Q4 (Agglomeration) refines but isn’t essential.  

  #### Handling Ties  
  If your answers fit multiple positions (e.g., Q1=A, Q2=C, Q3=A, Q4=B), you’re between **Inconceivabilism** and **Skepticism**. Why? Judgments conflict (e.g., trusting conceivability in math but not consciousness). Treat ties as "borderline cases"—your intuitions pull toward multiple views. Revise answers or accept hybrid commitments.

  ---

  ### Analysis Notes  
  - **Heaviest-Lifting Question**: Q1 (Two Names) isolates Kripkean intuitions, splitting Necessity A Posteriori from others.  
  - **Droppable Question**: Q4 (Agglomeration) refines Defeasible vs. Idealized but doesn’t merge leaves if removed.
