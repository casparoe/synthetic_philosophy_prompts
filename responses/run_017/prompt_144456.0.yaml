prompt: |-
  Last night I argued for hours with a friend about what the units of selection really are, and we ended up just restating our positions. I want to try a different route: here are the verdicts I actually hold, and I'd like to know what principle, if any, they add up to — and, honestly, which of them I should abandon.

  1. A mouse segregation-distorter allele that disables sperm carrying its rival and so is transmitted to nearly all of a heterozygote's offspring, even though homozygotes are non-viable. I am sure this is selection at the gene level; no story about organisms or groups seems to be doing any work.
  2. Sterile workers in a eusocial wasp colony, where haplodiploidy makes workers more related to their sisters than to their own offspring. I want to say kin selection, and I resist my friend's claim that this is really colony-level selection. The colony buds off daughter colonies and looks for all the world like a reproducing unit, but I still don't want to call it group selection.
  3. Transposable elements that copy themselves through a genome while lowering the host's fitness. Gene-level, straightforwardly — and note that here the copying happens inside a single individual's lineage.
  4. A case I invented to settle the argument: colonial beetles in which four foundresses, drawn at random from the whole population, start a nest each season. Carriers of a restraint allele lay half as many eggs, but their nests survive and bud off daughter nests at twice the rate. Relatedness within nests is essentially zero. Here I am confident it is group selection, and I don't think it can be rewritten as kin selection.
  5. The same beetle case, except that nests are founded by sisters, so within-nest relatedness is roughly a half. Same allele, same causal effect on nest survival. Now I find myself wanting to say kin selection and not group selection, even though nothing about the mechanism has changed except who ends up nesting together.
  6. Virulence in a virus whose vector needs the host alive: within a host, faster replication wins; between hosts, intermediate virulence wins. I am happy to say selection is going on at both levels here, and I don't think there is a single real one.
  7. The case I keep going back and forth on: a body-plan feature in a plankton lineage that lowers that lineage's extinction rate without making any individual fitter than its conspecifics. Is that selection at a level at all, or something else wearing selection's clothes?

  My friend's line throughout was that this is all one bookkeeping scheme — partition the change into within-group and between-group components, and the talk of levels is optional decoration, so there is no further fact about which level selection acts at. Case 5 makes me doubt myself; cases 1 and 4 make me doubt him.

  My own stab at a principle: an entity is a unit of selection only if it is a unit of multiplication with heredity, and the trait's fitness effect runs causally through that entity's own reproductive output rather than by summation over its parts. I already suspect that clause misfires on case 1.

  So: state a principle, or a short list of candidates, precisely enough that I could apply it myself; say which of my cases motivates each clause; tell me which of my verdicts it forces me to give up; and tell me what it says about case 7 and about some case I haven't listed that would discriminate between your principle and my friend's.
reasoning: |-
  Okay, the user is deeply entrenched in the units of selection debate and has presented seven specific cases to test different principles. They're clearly frustrated after an unresolved argument and want a structured analysis. Their real need isn't just answers to these cases but a robust framework to evaluate any scenario independently.

  Hmm, their proposed principle about "unit of multiplication with heredity" is interesting but flawed - it fails their own case 1 where the gene is clearly selected despite not being a replicator in the traditional sense. That mouse segregation distorter is key: the gene manipulates organismal reproduction but doesn't replicate itself directly. Their intuition about causal pathways seems stronger than their formalized principle.

  The colonial beetle cases (4 and 5) are brilliant test cases. Identical mechanisms, only relatedness changes, yet they intuitively classify them differently. This exposes how our language depends on contextual factors like population structure. Their friend's partitioning approach might handle this elegantly, but at the cost of losing explanatory depth about mechanisms.

  For case 7 (plankton body plan), I'm noticing they're conflating two issues: whether selection is happening (yes) versus whether the lineage is a true unit (debatable). The fossil record issue is crucial - without heritable variation among lineages, it's just sorting, not selection. Their skepticism is warranted.

  What they really need is a decision tree that separates three questions: (1) Is there heredity? (2) Is there differential reproduction? (3) Does the trait causally affect reproduction at that level? Case 7 fails step 1 - no heritable variation among plankton lineages means no selection, just differential persistence.

  The transposable elements case (3) is simpler than they think - it's clearly parasitic drive, no different than case 1. Their intuition is correct, but they should notice this consistency. The virus virulence case (6) shows multi-level selection isn't contradictory - their comfort with this suggests they're not dogmatic.

  Their friend's "bookkeeping" view has merit for prediction but ignores mechanisms. The user cares about why things happen, not just how to model them. That's why they resist calling sterile workers "group selection" - the kin mechanism explains why the trait arose. For the random-founders beetle case (4), no kin mechanism exists, so group selection is the only explanation.

  ...I should emphasize that their case 5 dilemma dissolves if we distinguish process from statistical description. Kin selection explains the origin; group selection describes the current dynamics. They're two perspectives on the same math, hence their friend's position. But since they want causal explanations, maintaining the distinction matters.

  For a discriminating case, I'll propose obligate endosymbionts - like aphids and Buchnera bacteria. Neither can reproduce without the other, creating a new evolutionary unit. Their principle would call this organism-level selection; their friend's partitioning would show high between-organism covariance. Both valid, answering different questions.

  Ultimately they'll need to abandon either their gene-level verdict on mouse distorters or their causal pathway clause. I recommend keeping the causal insight but accepting that genes can be units without being replicators - they're beneficiaries, not replicators. Dawkins was wrong about that.
answer: |-
  Here's a clear principle synthesizing your intuitions, motivated by your cases, specifying which verdicts may need rethinking, and addressing case 7 and a new test case:

  **The Causal Fidelity Principle:**  
  *Selection acts at level **X** if:*  
  1.  **Heredity & Variation:** There is heritable variation in a trait *at level X*.
  2.  **Fitness Consequence:** Differences in this trait *causally generate* differential reproduction/survival *at level X*.
  3.  **Causal Primacy:** The fitness effect *at level X* is not *merely* an aggregate sum of fitness effects operating primarily at a lower level (though it may be enabled by them). Where conflicts exist, the level where the trait's fitness consequence *directly manifests* determines the primary level of selection.

  **Motivation from Your Cases:**

  1.  **Mouse Distorter (Gene-Level):** (Motivates **Causal Primacy**) The allele's distortion trait *directly causes* its own differential transmission (gene reproduction), bypassing organismal fitness. Organism death is a *side effect*, not the primary fitness consequence driving the allele's spread.
  2.  **Sterile Workers (Kin Selection):** (Motivates **Causal Primacy**) The worker's sterility trait increases its *inclusive fitness* via the reproduction of closely related queens (kin level). Colony success is the *mechanism* enabling this kin benefit, but the *fitness consequence* (gene copies passed via siblings) manifests primarily at the kin/organism level *relative to the worker*. Calling it "colony-level selection" obscures the *causal reason* the trait evolves (kin relatedness).
  3.  **Transposable Elements (Gene-Level):** (Motivates **Fitness Consequence & Causal Primacy**) The TE trait (self-copying) directly causes its own differential reproduction (copy number increase) within the genome lineage. Host fitness reduction is a side effect, not the driver.
  4.  **Beetles, Random Founders (Group Selection):** (Motivates **Heredity & Variation** and **Fitness Consequence**) The restraint trait varies *among groups* (nests). Differences in this trait *directly cause* differential group reproduction (nest budding/survival). Relatedness near zero prevents kin selection.
  5.  **Beetles, Sister Founders (Kin Selection):** (Contrasts with 4, motivates **Causal Primacy**) Mechanistically identical to 4. However, high relatedness means the restraint allele *also* gains a fitness advantage *via the reproduction of relatives* (sisters) within the group, even if the group mechanism is crucial. The *causal reason* restraint evolves *in this population structure* is the kin benefit. Group success is the *vehicle* for kin selection here. Your intuition highlights that "group selection" often feels inadequate when high relatedness provides the *explanation* for altruism.
  6.  **Virus Virulence (Multi-Level):** (Motivates both **Fitness Consequence** clauses) Within-host: Heritable variation in replication rate directly causes differential viral lineage reproduction *within a host*. Between-hosts: Heritable variation in virulence directly causes differential transmission *between hosts*. Both levels operate causally and distinctly.
  7.  **Plankton Body Plan (?):** (Challenges **Heredity & Variation**) Does heritable variation in the body plan *exist among plankton lineages*? If lineages with the feature persist longer *and consistently pass this feature to descendant lineages*, then yes, it's lineage-level selection. If the feature is universal/fixed or lineages don't reliably inherit it, it's not selection at any level – just sorting/drift. Your skepticism is warranted; lineage-level selection requires demonstrable heritability at that level, which is often hard to establish (e.g., in fossil records).

  **Verdicts You Might Need to Abandon (or Refine):**

  *   **Case 5 (Sister Beetles):** The principle suggests this is **BOTH kin selection and group selection** operating simultaneously. Your desire to call it *only* kin selection and *not* group selection is problematic. The group mechanism (nest survival/budding) is causally essential for the trait to spread, even with high relatedness. Abandon the idea that it's *exclusively* kin selection. The causal fidelity is multi-level: the trait works *through* group reproduction *to benefit* kin. Your friend's partitioning would catch both components.
  *   **Your Proposed Principle:** Abandon the requirement that the unit must be a "unit of multiplication with heredity" in a strict replicator sense. Case 1 (distorter) works because the allele *causally influences its own transmission fidelity*, even though it doesn't physically "multiply" independently of the organism. Focus on *causal influence on differential reproduction*.

  **Addressing Your Friend's View:**  
  Your friend is partially correct that the Price Equation partitioning (`Total Δ = Cov(w, z) + E[w Δz]`) is a powerful bookkeeping tool applicable to all cases. Cases 1, 3, and 5 would show significant within-group (organism) covariance. Cases 4 and 5 would show significant between-group covariance. Case 6 would show significant covariance at both levels. *However*, the "bookkeeping" view misses the **causal explanation** your intuitions grasp. Partitioning tells you *where* the variance is, but not *why* the trait exists or *how* it causally works. Case 5 is the perfect example: partitioning shows between-group selection is happening, but only the kin *explanation* tells us *why* restraint alleles exist despite being individually costly. The "levels" debate is about explanatory causality, not just statistical accounting.

  **New Discriminating Case: Obligate Endosymbiosis (e.g., Aphid & *Buchnera*)**

  *   **Scenario:** Aphids rely entirely on *Buchnera* bacteria in their cells for essential nutrients. *Buchnera* relies entirely on the aphid for survival and transmission (vertical only). A mutation arises in *Buchnera* that slightly reduces the nutrient it provides, allowing it to replicate faster within the aphid, but slightly reducing aphid fecundity.
  *   **Your Friend's Partitioning:** Analysis could be done at the gene level (within *Buchnera*, within aphid), organism level (aphid fitness, *Buchnera* fitness within aphid), or even "holobiont" level (aphid+*Buchnera* as a unit). Partitioning might show significant covariance at multiple levels.
  *   **Causal Fidelity Principle:**
      *   *Gene-Level:* The mutation directly causes faster replication *within the bacterium lineage*.
      *   *Organism-Level (Bacterium):* The mutation directly causes differential reproduction/survival *of the bacterial cell* within the host.
      *   *Organism-Level (Aphid):* The mutation causes reduced aphid fecundity (lower fitness).
      *   **Crucially:** The fitness of the *Buchnera* organism *depends entirely* on the fitness of the aphid organism – they cannot reproduce independently. The mutation's benefit *within* the bacterium conflicts with its effect *on* the vehicle (aphid) necessary for its transmission. Selection *primarily* acts on the bacterial organism *within* the host environment, but the *long-term persistence* of the bacterial lineage is constrained by selection acting *on the aphid organism* for fecundity. The causal pathways are intertwined but distinct. There is no clear, stable "holobiont" unit *with its own independent heredity and reproduction* – the aphid is the reproducing entity carrying the bacteria.
  *   **Discrimination:** The Causal Fidelity Principle refuses to grant "holobiont-level" selection status here due to lack of independent heredity/reproduction (Heredity & Variation criterion). It focuses on the conflict playing out at the bacterial organism level *within* the context defined by aphid organism fitness. Your friend's partitioning *could* assign a component to the "holobiont" level, but this would be a statistical description of covariance, not an identification of a true evolutionary individual with causal fidelity. The principle highlights the *conflict* and the *dependence*, which pure bookkeeping might obscure.

  **In Summary:** Your core intuition about **causal pathways** is sound. The Causal Fidelity Principle captures this, requiring heritable variation and differential reproduction *at a level*, with the trait's effect *manifesting primarily* at that level. This validates your verdicts on Cases 1, 2 (as kin selection, not pure group), 3, 4, and 6. It suggests refining your view on Case 5 (acknowledge group selection *is* happening, but kin explains *why*). Case 7 depends entirely on demonstrable lineage-level heredity. Case 5 remains the strongest challenge to a purely statistical view, as the partitioning description misses the crucial causal explanation provided by kin relatedness.
