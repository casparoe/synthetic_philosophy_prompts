prompt: |-
  My old supervisor has been sitting on a manuscript about Gongsun Long for something like ten years — the School of Names, the White Horse dialogue, and a chapter that I think is going to be about the hardness-and-whiteness bit — and I'm finally writing a response to it. Before I do, I want to guess what she'll say about a case she's never ruled on, becuase I'd rather not walk into the seminar and have her settle it in thirty seconds flat. Her verdicts so far, from the manuscript and from years of reading group:

  - a white horse is not a horse — she's completely happy with it, and gets irritated when people say it's just an equivocation on two senses of "is". In the translation we use, the two moves she leans on are "'Horse' is what designates shape. 'White' is what designates color. What designates color is not what designates shape" and then the seeking bit: "If one seeks a horse, yellow and black horses may all be delivered. If one seeks a white horse, yellow and black horses may not be delivered."
  - a brown horse is not a horse — also fine; she generalizes past the one example without blinking.
  - point at an actual white horse standing in a field and ask "is that a horse?" and she says yes, obviously — the thesis was never that white horses don't exist or that they aren't horses, and she thinks the objector basically gets her to concede that much.
  - a horse is not a white horse — also fine; she says the "not" runs both ways.
  - the hard white stone: the hardness and the whiteness are separate, you get one by touch and one by sight and neither of them is the stone, and she insists this is the same point as the horse case rather than a different one.
  - a horse is not a horse — here she stops and says no. The paradox needs two different names to get going, and she thinks the Hui Shi paradoxes people always wheel out are the same insight pushed to the limit, not a licence to say any old pair of terms is a "not".

  Here's the case I want to put to her. Imagine a kingdom where every single horse is white — not by any law of nature, just because the whole breeding stock goes back to one white stallion, and there are brown horses over the border. In that kingdom, ask for a horse and you get a white one; ask for a white horse and you get exactly the same animal; there is no way of going and fetching something that answers to one request and not the other. Does "a white horse is not a horse" still hold there?

  What I'm after isn't really the answer, it's the machinery. As far as I can tell at least two quite different rules fit everything she's said so far: one where the compound term picks out form-plus-color and that's just never the same thing as the bare form, so the verdict shouldn't care what the local horses happen to look like; and one that runs off the seeking test, so that once the two requests can't come apart in what would satisfy them, the "not" ought to collapse. Plus maybe a third that's just tracking whether the two terms pick out the same class of things. So: which rules actually fit her whole track record and not just the headline case, which way does each of them go in the white kingdom, which one would you bet she's running and why, and — the bit I keep going in cirlces on — what's the one further case that would flush out which rule it is?

  Two candidates I've got, and I honestly can't tell whether either is the right probe: (i) the same setup but where horses just are white, necessarily, no brown ones possible anywhere; (ii) does the thing run upwards — is a horse not an animal, on her view? Tell me which of these (if either) actually separates the rules, which pair of rules each one separates, and if neither does the job, what case would.
reasoning: |-
  Okay, the user is preparing for a seminar response to their supervisor's manuscript on Gongsun Long, specifically the "white horse is not a horse" paradox. They want to predict how their supervisor would rule on a new case: a kingdom where all horses are white due to historical accident (not necessity), making "fetch a horse" and "fetch a white horse" indistinguishable in practice. 

  Hmm, the core tension here is between two possible interpretive frameworks the supervisor might use: 
  - The "essentialist rule": Compound terms (white horse) always differ from simple terms (horse) because they combine form+color, creating a distinct ontological category. Local contingencies wouldn't matter. 
  - The "seeking rule": The paradox hinges on whether the two requests yield different sets. If they don't (as in the white kingdom), the "not" claim collapses. 

  The user's proposed test cases (i.e., necessary whiteness or upward generalization to "animal") are smart, but neither cleanly resolves the ambiguity. Let me think why: 
  - Necessary whiteness: Both rules might still diverge if the supervisor sees color as accidental even in essential properties (e.g., "white" remains contingent designation). 
  - Horse vs. animal: Surprisingly, this might align both rules since "animal" is a broader category, making the seeking test fail (fetching an animal ≠ fetching a horse). Not a good separator. 

  *scribbles mentally* What we need is a case where the seeking test fails but the essentialist distinction persists. Example: Two synonyms in a language—say "sofa" and "couch"—where both terms pick identical objects. If the supervisor says "a sofa is not a couch" based solely on distinct names (essentialist rule), but the seeking test shows no practical difference, that would expose the framework. Alternatively, if she accepts synonymy, she's likely prioritizing the seeking principle. 

  *checks user's frustration points* They're stuck on circular reasoning because both rules fit past data. The key is forcing a contradiction: The white kingdom case alone doesn't achieve this since the supervisor could defend either position coherently. The synonym probe, however, pressures the "Hui Shi paradox" boundary she explicitly drew (rejecting "horse is not horse" for identical terms). If she balks at "sofa is not couch," it suggests seeking/functionality dominates; if she endorses it, she's hardcore essentialist. 

  *strategic pause* For the seminar, user should lead with the synonym case—it's structurally identical to the horse paradox but strips away contingencies. Supervisor's reaction will reveal whether "distinct designations" alone suffice for "not," regardless of practical equivalence. That's the real machinery test.
answer: |-
  Based on your supervisor's track record and the interpretive tension you've identified, here's the breakdown of the rules, how they handle your "White Kingdom" case, which rule she likely uses, and the *crucial test case* to flush it out:

  ### 1. The Two Competing Rules
  *   **Rule A: Essential Designation (Form+Color ≠ Form)**
      *   **Core Principle:** The meaning/designation of a compound term ("white horse") is fundamentally different from its simple component ("horse"). "White horse" designates the *conjunction* of form (horse-shape) and color (white), creating a distinct concept. "Horse" designates *only* form. This difference in designation is absolute and exists regardless of contingent facts about the world (like all horses being white).
      *   **White Kingdom Verdict:** "A white horse is not a horse" **HOLDS.** Even though every horse is white, the *concept* "white horse" still combines color and form, while "horse" is just form. The designation differs.
      *   **Fits Track Record?** Yes. Explains all "not" judgments (white horse, brown horse, horse != white horse) and the "hard white stone" parallel (hardness/whiteness/stone as distinct designations). Explains why "a horse is not a horse" fails (no distinct designation).

  *   **Rule B: The Seeking Test (Functional Equivalence)**
      *   **Core Principle:** The meaning of a term is tied to its functional role in satisfying requests ("seeking"). If requesting "X" and requesting "Y" yield the *exact same set* of satisfiers in a given context, then "X" and "Y" are functionally equivalent in that context, and "X is not Y" fails.
      *   **White Kingdom Verdict:** "A white horse is not a horse" **FAILS.** Requesting a horse and requesting a white horse would be satisfied by the exact same animals. There is no functional distinction.
      *   **Fits Track Record?** Mostly, but strains on "a horse is not a white horse". It fits the original white horse case (different sets), the brown horse case (different sets), the actual horse pointing (functional equivalence in identification), and the hard/white/stone separation (different senses yield different properties). It *struggles* with "a horse is not a white horse" – if "white horse" is a subset of "horse", seeking a horse *can* be satisfied by a white horse, but seeking a white horse *cannot* be satisfied by a non-white horse. They are *not* functionally equivalent even in the real world. Rule B would likely need to appeal to the *asymmetry* here (all white horses satisfy "horse" requests, but not all horses satisfy "white horse" requests) to preserve the "not".

  ### 2. Which Rule is She Likely Using? (The Bet)
  *   **Bet: Rule A (Essential Designation).**
  *   **Why:**
      1.  **"Gets irritated when people say it's just an equivocation"**: This suggests she sees a deep, non-linguistic, ontological or conceptual distinction, aligning with Rule A's focus on distinct designata.
      2.  **Hardness/Whiteness Parallel**: Her insistence this is the *same point* as the horse strongly favors Rule A. The separation of properties (hardness, whiteness, stoneness) is fundamentally about distinct designations or attributes, not contingent functionality ("seeking" a hardness-property vs. a whiteness-property makes less sense than seeking an object *with* those properties).
      3.  **"a horse is not a white horse"**: Rule A handles this symmetrically and naturally: "horse" (form) ≠ "white horse" (form+color). Rule B has to work harder (asymmetric functional equivalence).
      4.  **Rejection of "a horse is not a horse"**: Rule A explains this cleanly: no distinct designation exists. Rule B would also reject it (exact functional equivalence), but the *reasoning* aligns better with A's ontology.
      5.  **Generalization Past Examples**: Rule A provides a clear *principle* (distinctness of designation) for generalization. Rule B relies on contingent facts about sets.

  ### 3. Why Your Proposed Test Cases Don't Fully Flush It Out
  *   **(i) Necessary Whiteness (All possible horses are white):**
      *   **Rule A:** "A white horse is not a horse" **HOLDS.** Designation difference remains absolute.
      *   **Rule B:** **AMBIGUOUS.** If "necessity" makes the concepts co-extensive *in all possible worlds*, does that collapse the functional distinction? Possibly. But Rule B is grounded in *actual seeking*, not modal logic. A strict functionalist might still say that *in practice*, seeking "horse" and "white horse" are identical acts with identical outcomes *here*, so "not" **FAILS.** However, the *potential* for seeking elsewhere might not matter to Rule B if it's context-bound. **Result:** Doesn't *clearly* separate the rules. Rule A holds firm, Rule B *might* flip or might not, depending on interpretation. It doesn't force a contradiction.
  *   **(ii) Upwards: "Is a horse not an animal?"**
      *   **Rule A:** **PROBABLY YES.** "Horse" designates a specific form. "Animal" designates a broader category (form? life? function?). They are distinct designations. "Horse" ≠ "Animal".
      *   **Rule B:** **PROBABLY YES.** Seeking an animal (could be a cow, dog, bird) does *not* yield the same set as seeking a horse. Functional distinction exists. "Horse" ≠ "Animal".
      *   **Result:** Both rules likely agree "a horse is not an animal". This doesn't separate them. It just shows the principle applies upwards.

  ### 4. The Crucial Test Case: Synonymy in Designation (The "Couch" vs. "Sofa" Probe)
  *   **The Case:** Imagine two words, "Zorch" and "Blorf". In this language/culture, "Zorch" and "Blorf" are **perfect synonyms**. They are used interchangeably by everyone to designate *exactly the same concept* (e.g., both mean "a comfortable seat for multiple people"). There is *no* contextual, functional, or conceptual difference whatsoever between the two terms. Ask for a Zorch and you get a comfy multi-person seat; ask for a Blorf and you get the *exact same thing*. There are no seats that are Zorches but not Blorfs, or vice-versa.
  *   **The Question:** Does "A Zorch is not a Blorf" hold? (Or equivalently, "A Blorf is not a Zorch").
  *   **How This Separates the Rules:**
      *   **Rule A (Essential Designation):** **YES, "A Zorch is not a Blorf" HOLDS.** *Unless* she bites the bullet that the *names themselves* are irrelevant and only the underlying concept matters (which contradicts the emphasis on *designation* and "horse" vs. "white" designating different things). The core logic is that distinct *names/terms* designate distinct concepts *by default*. "Zorch" designates Zorch-ness, "Blorf" designates Blorf-ness. If they are different words, they have different designations, therefore "Zorch ≠ Blorf". This maintains absolute parity with the "white" and "horse" being distinct designators. *Rejecting* "Zorch ≠ Blorf" would force Rule A to admit that sometimes distinct terms designate the *same* thing, undermining the absolute distinction required for "white horse ≠ horse".
      *   **Rule B (Seeking Test):** **NO, "A Zorch is not a Blorf" FAILS.** Seeking a Zorch and seeking a Blorf are functionally identical acts yielding identical results. There is zero difference in satisfaction conditions. Therefore, "Zorch" *is* a Blorf / "Blorf" *is* a Zorch. Functionally, they are the same.
  *   **Why This is the Best Probe:**
      1.  **Directly Targets the Core Mechanism:** It isolates the fundamental question: Is the "not" driven *solely* by the distinctness of the linguistic signs/designations (Rule A), or by the functional difference in their use (Rule B)?
      2.  **Forces a Contradiction with Her Framework:** If she uses Rule A, she *must* say "Zorch ≠ Blorf" to be consistent with the absolute distinction between "white" and "horse" as designators. If she uses Rule B, she *must* reject "Zorch ≠ Blorf" because there's no functional distinction, just like she rejects "horse ≠ horse". Her rejection of "horse ≠ horse" based on the lack of distinct terms aligns with Rule B's need for functional distinction. Applying that logic to synonyms demands "Zorch = Blorf".
      3.  **Mirrors the "Horse ≠ Horse" Boundary:** This case sits exactly on the boundary she drew. "Horse ≠ Horse" fails because it's the *same term*. "Zorch ≠ Blorf" uses *different terms*. Rule A must treat different terms as distinct designations. Rule B must treat functionally identical terms as equivalent *regardless* of the words used.
      4.  **Your White Kingdom Case is Analogous to Synonymy:** Your case makes "white horse" and "horse" functionally synonymous *in that context*. Rule B would *collapse* the "not" there, just like it would with "Zorch/Blorf". Rule A would *maintain* the "not" in both cases.

  **Conclusion & Prediction:**

  *   **Her Likely Verdict on White Kingdom:** She will say **"A white horse is not a horse" STILL HOLDS** (aligning with Rule A). The contingent fact that all horses are white doesn't change the fundamental difference in designation between the concept combining form & color and the concept of form alone.
  *   **The Crucial Test:** Present the **Synonymy Case ("Zorch" vs. "Blorf")**. Ask if "A Zorch is not a Blorf" holds.
      *   If she says **YES**, she's firmly **Rule A (Essential Designation)**.
      *   If she says **NO**, she's leaning towards **Rule B (Seeking Test/Functional Equivalence)**, though she might need to refine how it handles "a horse is not a white horse".
  *   **Seminar Strategy:** Lead with the Synonymy Case *before* your White Kingdom case. Her response to synonymy will immediately reveal the underlying machinery. Then, her verdict on the White Kingdom will follow logically from that. This prevents her from settling the White Kingdom in 30 seconds based on intuition; it forces her to explicitly commit to the principle governing *all* such distinctions. Good luck!
