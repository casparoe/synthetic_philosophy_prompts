prompt: |-
  hey — I'm in a third-year seminar on consciousness this term and I've been handed one 50-minute slot to run for the rest of the group. 14 people, mixed: about half have already read something on the split-brain / commissurotomy cases, half haven't, and the room is a normal seminar room (one big table we can all sit round, a whiteboard, no tech beyond that). My slot is on split-brain cases and the unity of consciousness.

  I really don't want to stand at the front and talk at them, I want them to run into the thing. What I'd like them to come away seeing is that "unity of consciousness" isn't one claim: that being able to report something, being able to act on it, and its being experienced together with your other experiences can come apart, and that once the split-brain cases are on the table you have to say which of those you actually cared about. My prof keeps seperating access unity (roughly: what's available to the same reporting-and-control system, whatever exactly that cashes out to) from phenomenal unity (the felt togetherness of experiences at a time), and she also keeps insisting that "one mind" and "one agent running one body" are different claims again. Whatever you give me should make at least two of those come apart as something the participants feel while they're doing it, not something I announce at the end.

  My own half-baked idea — tell me if it's any good or if it teaches something false: put them in pairs, one person is the "talking side" (can speak and write, but can't see what's presented to, say, their left) and the other is the "silent side" (can see it, can only point, push, or move objects around). Run a set of short tasks where the pair has to respond as a single person, then afterwards the talker has to explain why they responded the way they did — and they were never told what the silent side saw. Then repeat with a dial on the channel between them: zero contact, then one bit (yes/no), then a single word, then free writing — and at each setting the room votes on whether this is one subject or two cooperating ones. I like the dial because it turns a yes/no question into a threshold question, but I can't tell whether it teaches something true about the cases or just gets people trading intuitions about bandwidth.

  So: design me the actual thing. Materials limited to paper, index cards, envelopes or folders, maybe a screen made of a couple of ring binders. Rules that make them hit the problem on their own — the confabulation should happen because of how I've set the incentives up, not because I told anyone to make up a story. A minute-by-minute plan for the 50. A debrief that maps specific moments in the activity onto the distinctions above, plus the honest part: which bit of the debate the activity can't reproduce at all and I'll just have to say out loud afterwards (I'm guessing something about the actual phenomenology, and about the fact that in the real cases both sides still share one body, one brainstem, one homeostatic system — but you tell me). And tell me what will predictably go wrong the first time I run it: I'm expecting at least one pair to cheat, and at least one person to say "well obviously it's two people the whole time" and deflate the exercise.

  For the format — I want to be able to paste this into my notes app, so give me the deliverable as a single JSON object and spell out the schema yourself as you go. At minimum I want: "materials" and "setup_minutes"; "roles"; "rules" (an array of short numbered rules I can read out); "timeline" (array, one object per block: minutes, what participants do, what they should run into, the failure mode for that block, and how I handle it); "throttle_scheme" (array, one object per bandwidth level: what's allowed, what behaviour I should watch for, what verdict I collect from the room, and what that verdict is actually tracking); "debrief" (array: moment in the activity, the distinction it maps onto, one line I can say); "goes_wrong" (array: what, why, fix); "cannot_reproduce" (array: feature, why not, what I have to supply instead); "check_for_understanding" (one question I can ask at the end that would show they got it rather than just enjoyed it); and "verdict_on_my_dial_idea" (keep it, fix it, or bin it — and if you bin it, the replacement mechanic in the same JSON).
