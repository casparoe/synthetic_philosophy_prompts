  **Key Pedagogical Rationale:**

  1. **Access vs Phenomenal Unity:** The forced confabulation demonstrates how verbal access doesn't reflect actual experience. The emotional task shows matching actions ≠ matching phenomenology.

  2. **Agency Unity:** When SILENT retrieves correct objects despite TALKER's ignorance, it challenges "one agent per body" assumptions.

  3. **Threshold Dial:** Your bandwidth progression is retained because:
     - Voting at each level surfaces intuitions about what level of connection constitutes "unity"
     - Reveals that access unity is gradational, while phenomenal unity remains binary
     - Prevents premature conclusions by showing unity isn't all-or-nothing

  4. **Handling Deflation:** The emotional task and physiology discussion counter "obviously two" by:
     - Highlighting shared bodily states
     - Questioning whether behavioral dissociation implies ontological separation

  **Timing Breakdown:**
  - Setup: 5 min
  - Zero comm task + explanation: 5 min
  - Bandwidth progression (4 levels × 3 min): 12 min
  - Emotional task: 5 min
  - Voting discussions: 8 min
  - Debrief: 15 min (map moments to concepts)

  **Critical Implementation Notes:**
  1. Start immediately with tasks - minimal lecture
  2. Assign dominant/outgoing students as TALKERS to encourage confabulation
  3. During voting, force commitment: "Hand up for ONE subject, down for TWO"
  4. In debrief, explicitly link emotional task failures to your professor's phenomenal unity concept

  This design creates embodied dissonance while avoiding neurological oversimplification. The throttle successfully makes unity feel like a continuum while your supplemental explanations cover what simulation can't replicate.
