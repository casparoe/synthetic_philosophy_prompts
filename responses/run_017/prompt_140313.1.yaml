          Condition 0: Present "KEY" to the RH (left visual field). Ask: "What word did you see?" The LH didn't see anything, so they say "I didn't see anything." Then the experimenter asks the pair to pick up an object that matches the word (from a set). The RH (with left hand) picks up the key. Then the experimenter asks: "Why did you pick up the key?" and the LH must explain.

          Condition 1: Same task, but the LH can ask the RH a yes/no question. The LH might ask: "Did you see a word? Was it KEY?" and the RH nods. Then the LH says: "I think I saw KEY" (they are confabulating because they didn't see it, but they got the information via the yes/no). Then they pick up the key and the explanation is "Because I saw KEY".

          Condition 2: The RH writes the word "KEY" and passes it to the LH. The LH reads it and says "I saw KEY". Then picks up the key and explains: "Because I saw KEY".

