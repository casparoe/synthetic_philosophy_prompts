  > **Note:** One of you has an extra line of instructions the other cannot see. You know this asymmetry exists, but not what the line says or who has it."  
  >   
  > **EXTRA LINE (on 50% of sheets, randomly assigned):**  
  > *"Schrödinger’s cat is neither alive nor dead."*  

  #### **Round 2: Mirror**  
  *Instructions (identical for both):*  
  > "You and your partner face similar but **different payoff structures**. Your partner can see your payoffs, and you can see theirs. Choose **C** or **D** silently.  
  >   
  > **Your Payoff Matrix:**  
  > |          | Partner: C | Partner: D |  
  > |----------|------------|------------|  
  > | **You: C** | 4, 3       | 0, 5       |  
  > | **You: D** | 6, 0       | 2, 1       |  
  >   
  > **Partner’s Payoff Matrix (visible to you):**  
  > |          | You: C     | You: D     |  
  > |----------|------------|------------|  
  > | **Partner: C** | 3, 4       | 0, 6       |  
  > | **Partner: D** | 5, 0       | 1, 2       |  
  > *First number in each cell = that player’s points.*  

  #### **Round 3: Clone**  
  *Instructions (identical for both):*  
  > "You and your partner face the **same game with identical payoffs**. Choose **C** or **D** silently.  
  >   
  > **Payoff Matrix (for both players):**  
  > |          | Partner: C | Partner: D |  
  > |----------|------------|------------|  
  > | **You: C** | 3, 3       | 0, 4       |  
  > | **You: D** | 4, 0       | 1, 1       |  
  > *First number = your points. Second number = partner’s points.*  

  ---

  ### What Will Go Wrong (and How to Mitigate)  
  1. **"The Jerk" who defects for fun:**  
     - **Mitigation:** Announce, *"Your points convert to chocolate—maximize your own chips."* Self-interest justifies cooperation in Clone (mutual C = 3 chips each vs. 1 if both defect).  
     - **If it happens:** Use their pair as a debrief example: *"One defection tanked mutual gains—why might someone risk that?"*  

  2. **Confusion in Mirror round:**  
     - **Mitigation:** Pre-emptively say: *"Check whose payoffs you’re viewing—’Your Matrix’ vs. ’Partner’s Matrix’."* Walk around to clarify.  

  3. **Underwhelming Clone cooperation:**  
     - **Why?** Participants aren’t actual clones. Superrationality’s "pull" is theoretical.  
     - **Fix:** Highlight the *gap* between rounds: *"In Clone, 70% cooperated; in Mirror, 30%. Why did symmetry change behavior?"*  

  4. **Pairing logistics:**  
     - With 14–18 people, pre-assign pairs on slips (e.g., "Partner: Alex"). Reassign each round.  

  ---

  ### Debrief Script (15 mins)  
  **Step 1: Report results (5 mins)**  
  - Share aggregate cooperation rates:  
    - Near-Clone: ~50–60% C (asymmetry distracts)  
    - Mirror: ~20–40% C (payoff asymmetry dominates)  
    - Clone: ~60–80% C (symmetry encourages cooperation)  
  - **Key question:** *"Why did cooperation rates shift?"*  

  **Step 2: Map to symmetries (7 mins)**  
  | Round      | Outcome Symmetry | Procedural Symmetry | Epistemic Symmetry |  
  |------------|-------------------|----------------------|---------------------|  
  | **Clone**  | ✅ Identical payoffs | ✅ Same instructions | ✅ Common knowledge |  
  | **Near-Clone** | ✅ Identical payoffs | ❌ Hidden line breaks rules | ❌ Uncertainty about knowledge |  
  | **Mirror** | ❌ Payoffs differ | ✅ Same instructions | ✅ Partners see each other’s payoffs |  
  - **Superrationality’s core:** It requires **all three symmetries**. Clone gets closest—rational players *should* coordinate on mutual benefit (C,C).  
  - **Where it breaks:**  
    - Near-Clone’s hidden line shatters *common knowledge* (you can’t assume identical reasoning).  
    - Mirror’s payoff asymmetry means *outcomes aren’t shared*—no incentive to coordinate.  

  **Step 3: The big picture (3 mins)**  
  - *"Superrationality isn’t just ‘we’re both rational.’ It’s ‘we’re in identical worlds, so our decisions mirror each other.’ Break any symmetry, and individualism wins."*  
  - **Real-world takeaway:** Cooperation thrives under transparency and aligned incentives (Clone). Hidden info or misaligned goals (Near-Clone/Mirror) invite defection.  

  ---

  ### Why This Works  
  - **Clone round’s "pull" is palpable** after the chaotic Near-Clone/Mirror. Participants *feel* the difference.  
  - **Mirror’s payoff asymmetry** is glaring (6 vs. 0 points!), making Clone’s symmetry obvious.  
  - **Near-Clone’s trivial line** proves even tiny asymmetries disrupt superrationality—no need for clones.  

  **Final tip:** For payoff tracking, use a shared Google Sheet. Log pairs’ choices live to show results instantly in debrief. You’ve got this!
