prompt: |-
  Had a blazing argument in the pub last night with my mate about whether blowing thirty grand on a wedding is actually a signal of commitment. He kept saying it's costly so it's honest, end of; I kept saying cost on its own proves nothing — a signal's only honest if it costs a bloke who's going to bail in two years more than it costs one who isn't, and anyone can borrow thirty grand, so the reception is just a reciept. Problem is I'm best man at that wedding in three weeks and I've now got to write the toast. I need a three-minute speech that gets the handicap principle right without turning into a lecture: the real evidence is him turning down the Singapore posting, selling the car, and doing a reading he wrote himself in front of two hundred people, not the price tag. But I can't say "they must love each other, look at the flowers" because that's the exact move I spent all evening arguing against, and I can't insult her parents who paid for the flowers either. Can you write it so it also gets across that all I can really offer the room is the signals and not his feelings, which I've got no access to — and so it still lands when half the room think the whole wedding's a racket and the other half have never heard of any of this?
reasoning: |-
  Okay, the user needs a best man speech that addresses a complex concept—the handicap principle—without making it academic. They had an argument with their mate about whether spending a lot on a wedding signals true commitment. The key points are: they can't just focus on the financial cost because that doesn't prove commitment, but they also can't insult the parents who paid for it. They need to highlight genuine sacrifices the groom made, like turning down a job in Singapore and selling his car, and doing a personal reading.

  First, I need to frame the speech so it's accessible. The audience is mixed—some think weddings are a racket, others aren't familiar with signaling theory. So, the examples of sacrifice are crucial. They show the groom's commitment in a tangible way without mentioning the cost directly.

  The user mentioned not wanting to use the flowers as a symbol of love since that's what they argued against. So, the speech should avoid material symbols and focus on actions. The groom's personal reading, turning down the job, selling the car—these are the real signals.

  Also, the user can't claim to know the couple's feelings, only the observable actions. The speech needs to present those actions as evidence without overstepping. Highlighting that these actions are costly in terms of effort, risk, or sacrifice, not just money, aligns with the handicap principle.

  Balancing humor and sincerity is key. Starting with a light-hearted joke about the argument in the pub can engage the audience, then smoothly transition into the meaningful points. Acknowledging the parents' contribution without linking it to the commitment signal avoids offense.

  Including the groom's personal reading as the climax ties it all together. It's a vulnerable act that requires genuine commitment, making it a strong signal. Ending with a toast to their future keeps it positive and uplifting.

  Need to ensure the speech flows naturally, stays under three minutes, and resonates emotionally while subtly conveying the underlying theory. Avoiding jargon is essential. The examples must speak for themselves, showing that true commitment is proven through personal sacrifices, not financial expenditure.
answer: |-
  Here’s a 3-minute speech that threads the needle: celebrates genuine commitment, honors the family’s generosity, subtly incorporates your point without lecturing, and avoids claiming knowledge of private feelings. It uses the groom’s *actions* as the evidence, framed warmly and accessibly:

  **(Clink glass gently, warm smile)**
  "Alright, settle down, you lot. For those who don’t know me, I’m [Your Name], and I’ve had the dubious honour of being best mates with this fine gentleman here, [Groom's Name], for [Number] years. Now, full disclosure: last night, over a *few* pints, [Groom's Name] and I got into a… let’s call it a *vigorous discussion* about signals. You know, how you *show* what you mean, especially when it really counts.

  **(Light chuckle)**
  He reckons spending a fortune is a sure sign. Me? I reckon anyone can write a cheque or max out a credit card. That’s just noise. What cuts through the noise? What *actually* shows up on the radar when it matters? It’s not the price tag on the thing; it’s the price *paid* by the person doing it. The stuff that would be *too much* for someone who wasn’t all in. The stuff that costs you something real.

  **(Turn towards the couple, sincere)**
  And looking at you two today, [Groom's Name], what stands out isn’t the sheer scale of this beautiful day – though it is absolutely stunning, and [Bride's Parents Names], your generosity in making it happen is incredible, truly. Thank you. What stands out are the things that cost *you*.

  **(Point to specific, personal sacrifices - KEY PART)**
  It’s you turning down that high-flying job in Singapore because being *here*, building a life *with* [Bride's Name], mattered more than the prestige or the pay cheque. That’s a cost. It’s you selling that beloved car – we all know which one I mean, the one you polished more than your own shoes – not just to help fund today, but because building a *future* together meant more than holding onto the past. That’s a cost.

  **(Build to the most vulnerable signal)**
  And most of all, it’s you standing up here today, [Groom's Name], not just reading someone else’s words, but pouring your own heart onto a page and then having the guts to share those raw, personal words in front of [Bride's Name], her family, your family, all of us… two hundred witnesses! That right there? That’s not just a reading. That’s *vulnerability*. That’s commitment laid bare. That costs courage. That costs something only someone truly committed would be willing to pay.

  **(Bring it home - universal and warm)**
  *That’s* the signal that rings true. Not the budget, but the *personal investment*. The choices that show where your priorities lie. The sacrifices made willingly for the person beside you. That’s the stuff that tells us, loud and clear, that this isn't just a party; this is the real deal.

  **(Raise glass)**
  So, let’s raise a glass not just to a beautiful wedding – which this absolutely is, thanks again to everyone who made it possible – but to the *marriage* that’s starting. A marriage built on those genuine, costly signals of love and commitment we’ve already seen shining through. To [Bride's Name] and [Groom's Name] – may your life together be filled with the same courage, dedication, and heartfelt honesty you’ve shown getting to this point. Cheers!"

  **Why this works:**

  1.  **Avoids the Lecture:** Uses conversational language ("vigorous discussion," "cuts through the noise," "stands out," "that’s the stuff"). Never mentions "handicap principle," "signaling," or "costly signal." The concept is *demonstrated*, not explained.
  2.  **Honors the Parents:** Explicitly thanks them for their generosity in creating a "beautiful day," separating the *event's* beauty/finance from the *commitment's* evidence.
  3.  **Uses Concrete Actions (The Real Signals):** Focuses entirely on the groom's specific, meaningful sacrifices (Singapore job, car) and vulnerable act (personal reading). These are the costly signals you argued *for*.
  4.  **Doesn't Claim Access to Feelings:** You talk about observable *actions* ("choices," "sacrifices made," "vulnerability," "courage," "dedication," "honesty shown") that *demonstrate* commitment. You say "*tells us*," not "*proves they feel*."
  5.  **Works for Both Audiences:**
      *   **The Skeptics ("It's a racket"):** They hear validation that the *real* proof is in the personal sacrifices and vulnerability, not the cash spent on the party. They hear the groom did hard things.
      *   **The Uninitiated (Never heard of signaling):** They simply hear a heartfelt tribute to the groom's specific, admirable actions proving his love and commitment. They hear about sacrifice and courage.
  6.  **Avoids the "Flowers" Trap:** Doesn't use any superficial/material element (flowers, dress, cake) as proof of love/commitment. The proof is solely in the *actions* of the couple (primarily the groom in this speech).
  7.  **Positive & Uplifting:** Ends firmly on celebrating the marriage and their future, rooted in the evidence presented.
  8.  **Resolves the Pub Argument:** Subtly but clearly makes *your* point: genuine commitment is shown by costly personal sacrifices/vulnerability, not financial expenditure itself. Your mate (the groom) will hear it and know exactly what you mean.

  **Delivery Tips:**

  *   **Pacing:** Don't rush. Pause slightly after key points ("That's a cost," "That costs courage").
  *   **Eye Contact:** Connect with the couple during the key lines about *their* actions, then sweep the room during the toast.
  *   **Tone:** Warm, sincere, slightly conversational, with appropriate moments of lightness (the pub intro, the car joke) and gravity (talking about vulnerability, the sacrifices).
  *   **Know Your Groom:** Deliver the car/Singapore/reading lines with genuine appreciation and a touch of affectionate ribbing if appropriate for your relationship.

  This speech honors the day, respects the parents, celebrates the couple based on observable proof of commitment, and subtly wins your argument – all without turning into an economics seminar. Good luck!
