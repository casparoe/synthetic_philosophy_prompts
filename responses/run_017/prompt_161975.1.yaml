prompt: |-
  Hey — I'm on the allocations committee for a limited-equity housing co-op, about 90 units, and we're the ones who decide who gets offered the next empty apartment. There's 7 of us, we meet one evening every month or two when a unit frees up (occasionally two at once), and the output has to be a full ranking of the shortlist, not just a winner: if the top pick turns us down the offer cascades to #2, then #3, so ties are no use to us at all.

  Right now each of us writes down a ranking of everyone on the shortlist and we add up Borda scores. Last spring this bit us badly: someone added an extra applicant to the shortlist more or less as a joke — a guy with no income documentation who was never going to get the unit — and adding him moved a *different* applicant from 3rd to 1st. That feels like it shouldn't be possible, and it's made two of our members distrust the whole process. I've since read a bit of the lay explanations of Arrow's theorem, so I get the rough shape of the argument, but I need something I can actually run on a Tuesday night.

  What I want from you: turn Arrow's result into a decision procedure our committee can use. Concretely:

  - The questions to ask, in order, when we're picking or auditing a rule — starting with "what kind of input can we actually collect from seven volunteers" and ending with "which of Arrow's conditions are we willing to give up, and what does giving that one up cost us in practice."
  - What counts as an adequate answer to each question, phrased so someone with no social choice theory can follow it; where the procedure just says no to a rule; and where it has to stop and hand the decision back to us because the question is a values call (which unfairness we'd rather live with) rather than a factual one.
  - The two failure modes I now care about, stated as tests we can run on a spreadsheet in about ten minutes: (1) our ranking of the people already on a shortlist shouldn't change when someone obviously irrelevant gets added, or when the person we just housed gets taken off the top; (2) a committee member's ballot shouldn't be able to hurt their own top choice, and a member who stays home shouldn't be able to help theirs.
  - How to handle partial ballots and recusals, since the theorem assumes everyone hands in a complete ranking and we often can't: people only rank their top five, or they know an applicant and refuse to rank them.
  - Where the procedure genuinely can't give us an answer.

  A detail that matters to me: the shortlist is drawn up by our membership coordinator, not by the seven of us, so if shortlist composition can swing the outcome then that person has real power none of us voted to give them. Please treat that as part of the problem, not a side note.

  Then run the procedure on three cases:

  (a) The Borda mess above, with the decoy applicant.
  (b) Two units free at the same time in March — do we just take the top two off the ranking, or re-run the ballot on the remaining applicants, and does the difference actually matter?
  (c) A proposal one member made: stop ranking applicants at all, have each of us place every household on a single 0–10 "housing need" scale and average the scores. I suspect this dodges the theorem somehow, and I want to know how, what it costs us, and whether it's really dodging anything or just relocating the problem somewhere we won't notice it.

  Constraints: one evening, a laptop with a spreadsheet, no special software; two of our members are in their 70s and will not sit still for anything that can't be explained in about five minutes at the annual meeting; and our lawyer wants the rule written down and applied identically every time, which I think rules out "the chair decides when it gets messy."

  I have a feeling the honest answer here is going to be something we don't want to hear — maybe that we should let one person decide, or that the ballot is doing less work than we pretend — and if that's where this goes, say it plainly and tell us what we'd be buying. And be honest about confidence throughout: for each part of the procedure say how sure you are that it's a faithful operationalization of what the theorem actually says, and single out the bit you're least sure of.
reasoning: |-
  Hmm, the user is on an allocations committee for a limited-equity housing co-op and they're dealing with some serious issues with their voting system. They use Borda count to rank applicants for housing units, but adding a decoy applicant changed the outcome, which made members lose trust in the process. They've heard of Arrow's theorem and want a practical decision procedure they can implement.

  The user needs a clear, step-by-step procedure to evaluate voting rules. They want to know what questions to ask, how to audit rules, and what trade-offs to consider. They also need tests to detect failure modes like irrelevant alternatives affecting outcomes or strategic voting backfiring. Plus, they have practical concerns: partial ballots, recusals, and the power of the membership coordinator who creates the shortlist.

  They've provided three specific cases: the Borda problem with the decoy applicant, handling two vacancies at once, and evaluating a proposed "housing need" scale. Constraints include no special software, elderly members needing simplicity, and a legal requirement for consistent rules.

  Arrow's theorem states that no ranked voting system can satisfy all of: universality (any rational preferences), unanimity (if everyone prefers A over B, A should rank higher), independence of irrelevant alternatives (IIA), and non-dictatorship. Every system must violate at least one. For housing allocations, IIA is particularly important because adding non-viable applicants shouldn't change outcomes for serious candidates.

  The core trade-offs for the committee are:
  - **Universality**: Can members express any rational preferences? Borda allows this but fails IIA.
  - **Unanimity**: Essential for fairness—if all agree a candidate should rank higher, the system must respect that.
  - **IIA**: Critical to prevent decoy candidates from swinging results, but hard to satisfy with ranked systems.
  - **Non-dictatorship**: Must be maintained.

  For the procedure, we can start by testing the current Borda system with the two failure modes:
  1. **Decoy test**: Add a non-viable applicant and see if rankings change for others.
  2. **Strategy test**: Check if a voter can hurt their top choice by ranking them first or if abstaining helps them.

  Then, evaluate alternatives:
  - **Plurality or Approval**: Simpler but don't use rankings, violating universality. They might lead to ties or less nuanced decisions.
  - **Housing need scale**: This is a cardinal system, not ordinal, so Arrow doesn't directly apply. But it has its own flaws like interpersonal comparisons and potential for manipulation.

  For the cases:
  - **Case a**: Borda fails the decoy test, as seen.
  - **Case b**: Taking top two might violate IIA if removing a candidate affects rankings. Re-running the ballot is better but cumbersome.
  - **Case c**: The housing need scale dodges Arrow by using scores, but averaging can be distorted by strategic voting or differing interpretations of "need."

  Handling partial ballots: Systems like Borda can adapt by averaging scores for ranked candidates, but it's messy. Recusals require excluding the conflicted member's vote entirely.

  The membership coordinator's role in shortlisting is a hidden issue. If the voting rule is sensitive to irrelevant alternatives, the coordinator can manipulate outcomes by including or excluding applicants. A robust rule (like one satisfying IIA) would prevent this, but since no ranked system can satisfy all criteria, the committee must choose which flaw to accept.

  Ultimately, the honest answer might be that ranked systems are inherently flawed for this purpose. A well-designed cardinal system (like the housing need scale with safeguards) or even a random lottery might be fairer and more transparent, though less "rational." The key is to minimize manipulability and ensure the rule aligns with their values—prioritizing need over preference where possible.
answer: |-
  Here's a decision procedure based on Arrow's Theorem, operationalized for your committee. I'll structure it as step-by-step questions/tests, then apply it to your cases. **The core takeaway:** Arrow proved *no* ranked voting system can satisfy all desirable fairness properties. Your Borda count fails "Independence of Irrelevant Alternatives" (IIA)—exactly what caused your problem. Fixing this requires sacrificing another property, and **the honest answer is that switching to a *cardinal* (scored) system like the proposed 0-10 "housing need" scale is likely your best practical solution—but it has different flaws.**

  ### Decision Procedure: Auditing a Ranking Rule
  *Run this when adopting or evaluating a ranking method. Use a spreadsheet with past/simulated ballots.*

  1.  **INPUT: Can we collect full, strict rankings?** (Universality Domain)
      *   *Question:* "Does our rule require every member to rank *every* applicant, with no ties allowed?"
      *   *Adequate Answer:* "Yes" (Proceed). "No" or "We allow ties/skipping" (STOP: Rule invalid under Arrow; violates strict ranking requirement. Fix ballots or pick a different rule type). *Values Call?* No. Arrow requires strict, complete rankings.
      *   *Handling Recusals/Partial Ballots:* If a member recuses/knows an applicant, their ballot *must be excluded entirely* for that vote. Partial rankings (top 5 only) break Arrow's assumptions; the rule won't work reliably. **Solution:** Mandate full ranking or exclude partial ballots (risks lower participation). Recusals = automatic exclusion.
      *   *Confidence:* High (Core axiom).

  2.  **UNANIMITY: If everyone agrees A > B, does A rank higher?** (Pareto Efficiency)
      *   *Question:* "If all 7 members rank Applicant A higher than Applicant B on their ballots, will A *always* rank above B in the final result?"
      *   *Adequate Answer:* "Yes" (Proceed). "No" (STOP: Rule is fundamentally unfair. Discard it). *Values Call?* No. Violating unanimity is indefensible for allocation.
      *   *Spreadsheet Test:* Create ballots where all members rank A > B > others. Run rule. A must be #1, B #2.
      *   *Confidence:* High (Core axiom).

  3.  **NO DICTATOR: Is one person deciding?** (Non-Dictatorship)
      *   *Question:* "Is there a single committee member whose top choice *always* becomes the #1 ranked applicant, no matter how others vote?"
      *   *Adequate Answer:* "No" (Proceed). "Yes" (STOP: This is dictatorship. Discard rule unless you explicitly want this). *Values Call?* Potentially. If efficiency trumps fairness, *maybe* accept (but unlikely for housing co-op).
      *   *Spreadsheet Test:* Have one member rank A last. Have the suspected "dictator" rank A first. Others rank A first. Run rule. If A isn't #1, no dictator *for this case*. Repeat varying other ballots. True proof requires checking all possibilities (hard), but a few clear counter-examples are sufficient to disprove dictatorship.
      *   *Confidence:* Medium-High (Testing is probabilistic, but a single counter-example proves non-dictatorship).

  4.  **IIA: Does adding/removing losers change results?** (Independence of Irrelevant Alternatives)
      *   *Question:* "If we add an applicant who everyone ranks last (or remove a previously housed applicant), does the *relative ranking* of the remaining applicants ever change?"
      *   *Adequate Answer:* "No, never" (Proceed - but **Arrow says this is impossible with Unanimity & No Dictator**). "Yes, sometimes" (This is your Borda failure. **You MUST accept this flaw** if you want a ranked system. Proceed only if you understand the cost).
      *   *Values Call?* **CRITICAL YES.** Accepting IIA violation means:
          *   **Cost:** The Membership Coordinator gains significant power by controlling who is on the shortlist (the "decoy" effect). Applicants might be hurt/helped based on *who else* applies, not just their own merits. Strategic ranking is harder but possible.
          *   *Alternative:* Rejecting IIA violation means abandoning ranked systems (see Step 5).
      *   *Failure Mode Test 1 (Decoy Test):*
          1.  Take a past/simulated shortlist (Applicants: A, B, C, D).
          2.  Run ballots through rule, get ranking (e.g., A > B > C > D).
          3.  Add a new applicant (X) that *every* member ranks **last** on their ballot. Re-run rule on (A, B, C, D, X).
          4.  Compare the ranking of A vs B, B vs C, etc., from Step 2 to Step 3. **If ANY pairwise order changes (e.g., B > C becomes C > B), the rule FAILS IIA.** (Borda will often fail this).
      *   *Failure Mode Test 2 (Strategy Test):*
          1.  Simulate ballots where Member 1 ranks A first.
          2.  Run rule, note A's position.
          3.  Change *only* Member 1's ballot in a way they think helps A (e.g., ranking strong competitors lower). Re-run rule. **If A's position worsens, the rule is manipulable & Member 1 hurt themselves.**
          4.  Remove Member 1's ballot entirely. Re-run rule with other 6 ballots. **If A's position improves vs Step 2, the rule is manipulable & Member 1 hurt A by participating.**
      *   *Confidence:* High (IIA definition). Tests are direct operationalizations.

  5.  **THE ARROW TRAP & ESCAPE HATCHES**
      *   *Question:* "Did we pass Steps 1-4?"
      *   *Adequate Answer:*
          *   **Failed Step 1/2/3:** STOP. Rule is broken/unfair. Discard it.
          *   **Passed Step 1/2/3, Failed Step 4 (IIA Violation):** This is the fate of *all* ranked voting systems (Arrow's Theorem). **You can use this rule (e.g., Borda, Condorcet, Plurality), but you MUST accept:** (1) Shortlist composition matters (Membership Coordinator has power), (2) Strategic voting is possible (but complex).
          *   **Passed Step 1/2/3/4:** **IMPOSSIBLE** (Arrow's Theorem). If you think you passed IIA, you likely misunderstood the test or your rule is dictatorial/unanimity-violating in hidden ways.
      *   **Escape Hatches (If IIA violation cost is unacceptable):**
          *   **A. Switch to Cardinal Voting:** Use scores (like 0-10 "housing need") instead of rankings. **Arrow doesn't apply to cardinal systems!** This dodges IIA problems and shortlist manipulation power. *But see Case (c) analysis below for major tradeoffs.*
          *   **B. Random Lottery:** Rank applicants by a random number. Simple, fair in expectation, immune to all Arrow problems. Sacrifices *all* preference aggregation.
          *   **C. Delegate:** Let a subcommittee or housing manager decide. Sacrifices group decision-making.
      *   *Values Call?* **CRITICAL YES.** Choosing *which* flaw to live with (IIA violation, abandoning rankings, randomness, or delegation) is fundamental.
      *   *Confidence (Arrow):* Very High (Mathematical theorem). Confidence in alternatives: High.

  ### Applying the Procedure to Your Cases

  *   **Case (a): The Borda Decoy Disaster**
      *   Step 1: Borda *can* use full rankings (Pass).
      *   Step 2: Borda satisfies Unanimity (Pass - if all rank A>B, A gets more points).
      *   Step 3: Borda has no dictator (Pass - one person's vote doesn't dictate #1).
      *   Step 4: **IIA Test (Decoy Test):** Your real-world event *is* the test. Adding the joke applicant (X) changed the ranking of other applicants (moved someone from 3rd to 1st). **Borda FAILS IIA catastrophically.**
      *   Step 5: **Result:** Borda is a valid ranked system (Pass 1-3, Fail 4), but its IIA violation gives the Membership Coordinator significant power via shortlist composition. You must accept this flaw or abandon ranked voting.
      *   *Recommendation:* Borda's sensitivity to irrelevant candidates makes it particularly bad for your context where the shortlist is externally controlled. Consider alternatives.

  *   **Case (b): Two Vacancies at Once**
      *   **Option 1: Take Top Two off Ranking**
          *   IIA Test (Decoy Test): Removing the #1 applicant (now housed) is like removing a candidate. Run the test: Compare the ranking of #3 vs #4, #4 vs #5, etc., *before* housing anyone to the ranking *after* removing #1 and #2. **Borda will likely FAIL IIA again.** The relative order of #3 and below might change just because #1 & #2 are gone. Unfair to applicant who was #3 vs #4.
      *   **Option 2: Re-run Ballot on Remaining Applicants**
          *   Avoids the IIA violation *within* the new vote. *However:* The overall process is different than for a single vacancy. Applicants might be ranked differently when the "prize" is two units vs one (perception of competition/scarcity). Not an Arrow violation per se, but a consistency issue.
      *   *Analysis:* **Option 2 is strictly better under Arrow.** Option 1 directly triggers the known IIA flaw of Borda (or any ranked method). Re-running the ballot treats the two vacancies as a new allocation event with the current applicant pool. It's more work but avoids the specific IIA trap.
      *   *Recommendation:* If using a ranked system, **re-run the ballot** for multiple vacancies. Document this in your rule. If using scores (Case c), you can simply take the top N scorers.

  *   **Case (c): 0-10 "Housing Need" Scale (Cardinal Voting)**
      *   **Dodges Arrow?** YES! Arrow's theorem *only* applies to systems aggregating *rankings* (ordinal preferences). Aggregating *scores* (cardinal preferences) is a different beast.
      *   **Costs & Tradeoffs:**
          1.  **Interpersonal Comparability:** Is Alice's "8" the same as Bob's "8" in terms of need? Requires calibration. A ranking only asks "Who has *more* need?".
          2.  **Manipulability:** Easier to strategically inflate/deflate scores subtly than manipulate complex rankings. (e.g., Give true top choice a 10, strong competitors 0s).
          3.  **Information Loss:** Averaging 7s and 8s might hide strong consensus (all 9s) vs weak agreement (some 5s, some 10s). Rankings show clear preference orders.
          4.  **Ties:** More likely (e.g., two applicants average 7.4). Need a tie-breaker (e.g., original application date).
          5.  **"Housing Need" Definition:** Requires a clear, shared definition to be meaningful and fair. Harder than ranking.
      *   **Relocating the Problem:** It doesn't vanish; it changes:
          *   **Shortlist Power:** **Massively Reduced.** Adding a non-viable applicant (score = 0 by all) won't change the average score of others. Membership Coordinator gains much less power.
          *   **Strategy Test:** A member giving their top choice a 10 might help them. Giving them a 9 instead *could* hurt them if it causes a tie/loss. Abstaining *could* help if their score was low. **Manipulation risk exists but is different** (often simpler, sometimes harder).
          *   **New Failure Mode:** "Bunching" - Members cluster scores (e.g., only use 5-10) reducing differentiation. Or "Outlier Sensitivity" - One very low/high score can swing an average.
      *   *Recommendation:* **This is often the best practical choice despite tradeoffs.** It directly solves your core Borda/IIA/shortlist-power problem. To mitigate issues:
          *   Define "Housing Need" clearly (e.g., income/assets, family size, health needs, current housing insecurity, seniority).
          *   Provide a scoring guide (e.g., 10=Severe Immediate Need, 5=Moderate Need, 0=No Need/Ineligible).
          *   Consider median instead of mean to reduce outlier impact.
          *   Have a clear tie-breaker rule.

  ### The Honest Answer & What You're Buying

  **The ballot-based ranking process (Borda or any other) is giving you an illusion of robust group rationality that Arrow proves is unattainable.** The decoy incident exposed its inherent fragility, particularly the vulnerability to the Membership Coordinator's shortlisting power.

  *   **Sticking with Ranked Voting (e.g., Borda, Condorcet):** You buy group participation and a structured process. **You pay with:** (1) Vulnerability to shortlist manipulation (Membership Coordinator power), (2) Potential for counter-intuitive results (like the decoy), (3) Complexity explaining failures.
  *   **Switching to Cardinal Scores (0-10 Need):** You buy resistance to shortlist manipulation and simpler ballots. **You pay with:** (1) Requiring clear definition/calibration of "need", (2) Different (often simpler) strategic voting risks, (3) Potential for score ambiguity ("Is my 7 their 7?").
  *   **Radical Alternatives (Lottery/Delegate):** You buy simplicity and Arrow-immunity. **You pay with:** Loss of nuanced group decision-making (lottery) or loss of committee involvement (delegate).

  **Recommendation:** **Implement the 0-10 Housing Need scale with a median score.** It directly addresses your most painful problem (shortlist power/IIA), is explainable ("we all rate need, highest median score wins"), works with partial ballots (average only the scores given, but define a minimum number of ratings), handles recusals cleanly (exclude their scores), and easily scales for multiple vacancies. Invest time in defining "Need" and providing a scoring rubric. This is the most robust *practical* solution under your constraints. **Be transparent:** Tell members Arrow showed ranked voting couldn't work fairly here, so you switched to scoring need directly.
