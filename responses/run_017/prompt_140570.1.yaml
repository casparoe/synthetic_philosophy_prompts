prompt: |-
  I work as a staff attorney at a legal-aid office, and a large share of my caseload is small-estate probate, so I spend most days watching courts decide what pieces of paper mean. Over the past year I have become bothered by something that I think is really a philosophical question, and I would like help getting clear about it. As I understand the practice in my state, the rules point in opposite directions depending on the kind of document. For wills, the testator's actual intention is close to sovereign: if a will leaves my Ford to my nephew John and the woman who signed it had two nephews named John, the court will hear evidence of what she said to her sister about which one she meant, and in many places it will even reform a will that says something she demonstrably did not mean because of a drafting mistake. For contracts, it is the reverse: what counts is what a reasonable person in the other party's position would have understood, and evidence that both parties subjectively meant something else is generally kept out, on the view that the parties' secret intentions are irrelevant. For statutes, courts start with the ordinary public meaning of the words and are wary of legislative history, yet the same judges will quietly correct an obvious scrivener's error or read in a missing word when it is beyond argument what the drafters were trying to say. My partner teaches literature, and in her field the author has been declared dead and nobody thinks her stated intentions settle anything; the thing I cannot work out is that in probate it is precisely because the author is dead that her intention is treated as the one thing that matters. A philosopher friend, hearing me complain about this, mentioned something called the intentional fallacy and something about sentence meaning versus speaker meaning, but I could not tell whether either of those is the tool I am reaching for, and I would rather you not send me off to cases or law-review articles: I am asking about the shape of the argument, not the doctrine.

  The reason this has stopped being idle for me is a bill moving through my state legislature. It would provide that where a will was prepared with automated drafting assistance, the ordinary wills rules flip: no extrinsic evidence of what the testator said she meant, and the text governs conclusively. The sponsors describe it as a clarity rule, and I can see the practical case, but it seems to me to rest on some view about where meaning comes from that I cannot quite state. Two things make it worse. First, essentially every will I see already has diffuse authorship: the client tells a story, a paralegal turns it into paragraphs, I run it through a firm template, and the client signs something whose sentences nobody fully authored in the ordinary sense. Second, in the commercial disputes my office occasionally handles, we now sometimes see agreements whose operative terms are executable code, and there the working assumption among the people I talk to is that the code just is the agreement, with nobody's expectations about it doing any interpretive work at all.

  So here is what I would like. Reconstruct the implicit theory of meaning, or of authorial intention, that this whole pattern presupposes: is it one theory plus an account of what different document types are for, or several theories that sit badly together? Tell me which parts of the pattern the theory strictly requires and which parts merely fit it comfortably, and where the pattern is underdetermined, in the sense that two or three quite different theories of meaning would each license the same practice. Say whether there is a single account that handles all three document types without inconsistency, or whether the inconsistency is the point, because meaning is not a property of texts but of the institution built around them. Then tell me what would actually have to change in day-to-day practice if the profession went wholeheartedly intentionalist, and separately what would change under thoroughgoing textualism. Finally, on the bill: does it presuppose that deference to an author's intention makes sense only where there is a single unified intending subject, is that a coherent place to draw a line given how ghostwritten most wills already are, and what should I think if the same legislature would simultaneously tell me that a machine-authored contract needs no intention at all?
reasoning: |-
  Okay, let me try to unpack this attorney's query. They work in legal aid dealing with probate and are troubled by inconsistent approaches to interpreting different documents—wills, contracts, statutes. The core issue seems to be the varying weight given to authorial intention across contexts. 

  First, I need to map the inconsistencies they described. For wills, subjective intent reigns supreme—courts will even reform documents to match what the deceased clearly intended but failed to express properly. Contracts are the opposite: objective reasonable-person standard prevails, ignoring secret intentions. Statutes sit somewhere in between—text-first but with quiet corrections for obvious errors. And literature has declared the author irrelevant. 

  The immediate trigger is a legislative bill that would flip will interpretation rules for AI-drafted documents, making text sovereign. But the attorney points out most wills already have "diffuse authorship" (client-paralegal-lawyer-template), and commercial contracts now sometimes use executable code as the agreement itself. This exposes a tension in how we conceptualize authorship and intention.

  Hmm... what philosophical frameworks might explain this? The intentional fallacy comes to mind—Wimsatt/Beardsley's argument that authorial intent shouldn't constrain literary meaning. But legal documents aren't literature; they have practical consequences. Then there's Grice's distinction between sentence meaning (what words conventionally mean) and speaker meaning (what the utterer intended). 

  The deeper question seems to be: Is there a unified theory of meaning here, or is the inconsistency fundamental? Let me consider institutional functions. Wills are unilateral dispositive acts with no relying party, so honoring intent makes sense. Contracts are bilateral; predictability protects reliance interests. Statutes bind strangers; clarity and notice matter. The "author" matters less than the document's social role. 

  The bill's assumption that AI-drafted wills lack a unified intending subject feels shaky. Current wills already involve multiple human contributors, yet we still privilege the testator's intent. Meanwhile, code-as-contract completely disregards intention—suggesting a spectrum where "authorship" gets diluted until only the text remains. 

  If legal practice went fully intentionalist, contract litigation might descend into mutual psychologism ("but I meant X!"). Full textualism could make wills unbearably formalistic, ignoring clear mistakes. The bill's inconsistency highlights that meaning isn't inherent—it's negotiated through institutional priorities: accuracy for wills, predictability for contracts, democratic legitimacy for statutes. 

  Ghostwriting doesn't negate intention because we impute the final product to the testator. But with AI, we're implicitly saying the system is the author. Maybe that's coherent if we view AI as a tool with no speaker meaning—only sentence meaning. But then why treat human-assisted drafting differently? The legislature's simultaneous embrace of code-as-contract suggests they prioritize form over intent when authorship is ambiguous. 

  Ultimately, the pattern isn't about philosophical consistency but functional pragmatism. The bill reveals that "intention" is a placeholder for whatever the institution needs it to be.
answer: |-
  Your inquiry cuts to the heart of legal hermeneutics, revealing a tapestry of practices that reflect divergent institutional purposes rather than a unified theory of meaning. Let's reconstruct the implicit architecture:

  ### The Implicit Theory: Institutional Pragmatism over Philosophical Consistency
  The pattern suggests **no single theory of meaning**, but rather **contextual functionalism**:
  - **Wills** prioritize *subjective intent* because the institution's purpose is **dispositive accuracy** (effectuating unilateral gifts) where no reliance interests exist. The author's death magnifies this imperative—she can't clarify errors.
  - **Contracts** prioritize *objective meaning* to protect **reliance and reciprocity**. The institution assumes adversarial parties; predictability trumps individual intent to enable commerce.
  - **Statutes** split the difference: **public notice** demands ordinary meaning (textualism), but **legislative supremacy** permits scrivener's error correction to avoid absurdity.
  - **Literature**'s rejection of authorial intent serves **interpretive pluralism**—its purpose is cultural conversation, not binding effect.

  The unifying thread: **Meaning is a function of the document's social role**, not inherent textual properties. Intent matters precisely *because* testators are dead (no do-overs), while living contractors must live with their words.

  ### Where the Pattern Bends or Breaks
  - **Strictly required**:  
    - Wills: Intentionalism where ambiguity exists  
    - Contracts: Objectivity where terms are unambiguous  
    - Statutes: Text as the starting point  
  - **Merely comfortable**:  
    - Correcting scrivener’s errors in statutes (some textualists reject this)  
    - Excluding mutual subjective intent in contracts (some jurisdictions allow it)  
  - **Underdetermined**:  
    - How much context to consider in wills ("mistake" vs. "ambiguity" doctrines vary)  
    - The line between interpreting and rewriting contracts  

  ### Could a Single Theory Unify This?
  No. Attempts collapse under institutional tensions:
  - **Radical intentionalism** would destabilize contracts (parties could always claim secret meanings) and statutes (judges would become mind-readers).  
  - **Radical textualism** would create unjust wills (e.g., "$10,000 to my niece Sarah" denied because testator had two nieces named Sarah) and unworkable statutes.  
  The inconsistency is the point: **Legal meaning is institutional, not textual or intentional**.  

  ### Practical Shifts Under Competing Theories
  | Scenario                | Wills Practice Change                                | Contracts Practice Change                           |
  |-------------------------|------------------------------------------------------|-----------------------------------------------------|
  | **Wholehearted Intentionalism** | Paralegals testify to client's intent; AI logs scrutinized | "Meeting of minds" trials; emails/texts as binding terms |
  | **Thoroughgoing Textualism**   | No reformation for mistakes; "my Ford" goes to first John | Four-corners rule dominates; code strictly enforced |

  ### Decoding the Bill & Its Assumptions
  The bill rests on three contested premises:
  1. **The "Unified Author" Fallacy**:  
     It assumes wills prepared *by humans* (even via paralegal/lawyer/template) have a coherent intentional subject—the testator—while AI lacks one. This ignores that **all legal drafting is distributed cognition**. The testator remains the intentional source *even when mediated*.

  2. **The Text-as-Alienated-Object Move**:  
     By treating AI-drafted wills like contracts (objective text), it implies **automation severs textual meaning from human intention**. This parallels code-as-contract: once compiled, the code *is* the agreement because its behavior is the only accessible "intent."

  3. **The Legislature's Incoherence**:  
     Simultaneously embracing **code-as-contract (no intent)** and **AI-wills-as-text (no intent)** while privileging intent in human wills reveals a deeper inconsistency:  
     - **For wills**: They fear AI obscures intent → suppress evidence  
     - **For contracts**: They assume code's behavior *is* intent → no evidence needed  
     This isn't philosophical—it's **risk allocation**: favoring enforcement predictability in commerce vs. dispositive accuracy in estates.

  ### What Should You Think?
  1. **The line-drawing is incoherent** because "authorship" is always mediated. The bill's exception for AI exposes the fiction of unified authorship in *all* wills.  
  2. **The legislature's dual stance** reflects institutional priorities, not philosophy:  
     - **Code-contracts**: Protect tech commerce (objective enforcement)  
     - **AI-wills**: Mitigate liability risks (avoiding costly intent litigation)  
  3. **A better framework**: Meaning derives from **institutional purpose**:  
     - Wills → *fidelity to transfer intent* → admit all relevant evidence  
     - Contracts → *security of agreement* → bind parties to reasonable understanding  
     - Statutes → *democratic legitimacy* → text + clear legislative aim  
     - AI/Code → *functional reliability* → enforce the operative mechanism  

  ### Conclusion
  The bill's flaw is privileging *the tool* (AI) over *the function* (testamentary intent). If your state insists on this path, argue for:  
  > *"A document's interpretive rules should track its social function, not its drafting mechanism. Where the purpose is implementing unilateral intent (wills), all evidence of that intent remains relevant—regardless of drafting tools."*  

  The pattern of practice you observe isn't broken; it's wisdom. Meaning emerges from why we create documents, not what creates them. Philosophy doesn't resolve this—it only helps see why the law's variations are necessary adaptations to human purposes.
