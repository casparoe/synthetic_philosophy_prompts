prompt: |-
  I am an applied statistician, and I would like an argument from evolutionary biology restated in the only vocabulary I am fluent in, together with an honest account of what that vocabulary cannot hold.

  My working life is the design and analysis of cluster-randomized trials in which units interfere with one another. I am at home with potential outcomes indexed by an individual's own treatment and by the treatments of others in the same cluster; with partial interference, where interference operates within clusters but not across them; with the stock contrasts between direct, indirect (spillover), total and overall effects; with estimands defined at the individual level and at the cluster level, and with the way the answer to a question can change depending on which of them one declares to be the object of interest; with identification that rests on cross-world independence assumptions no experiment can check; with single-world intervention graphs; with the fact that a split of an effect into a direct and an indirect component is not unique but depends on which mediator one writes down; and with the difference between a variable that causes an outcome and a variable that merely predicts it. I have no biology beyond a first-year course, and I do not know the technical literature I am asking about.

  The dispute I want translated is the one about the units or levels of selection. As I have encountered it, it contains at least four claims I need rendered:

  1. The gene's-eye claim: the only thing that persists across generations and is copied with high fidelity is the gene; organisms are the disposable things genes build; asked whether a trait such as sterility in a worker or restraint in a forager exists "for the good of the group," the right question is what maximizes the expected number of copies of the allele, and the answer is that apparent design at the group level is really design at the gene level, with the group being a site of interaction rather than a beneficiary.
  2. The multi-level claim: selection acts at several levels simultaneously, favouring selfishness within groups and altruism between groups, the two components pulling in opposite directions, with which one wins depending on population structure; and the two components can be separated and compared in a covariance or variance decomposition of total change.
  3. The distinction between selection of and selection for: a trait can increase in frequency without being the thing selection was acting on, because it is correlated, for instance by physical linkage on a chromosome, with the trait that did the causal work.
  4. A further distinction I have half-understood, between group-level quantities that are just aggregates of individual fitnesses and group-level traits that belong to the group and to no member of it — colony output, patch productivity, division of labour — where the second kind seems to require groups that themselves reproduce and transmit group-level properties to descendant groups.

  To force the translation to do real work, here is a concrete case. A stored-grain pest lives in discrete patches. Patches periodically go extinct and are recolonized by founders drawn from a single surviving patch. A transgene is released into this population with four features: (i) carriers have roughly thirty percent lower lifetime fecundity than non-carriers within the same patch; (ii) carriers secrete a digestive enzyme that raises total patch biomass, by an amount that increases with the frequency of carriers in the patch; (iii) the enzyme is not expressed at all below a quorum of roughly forty percent carriers in a patch, so the group-level effect is strongly non-additive; (iv) transmission is imperfect, the construct being sometimes lost and sometimes transferred horizontally to unrelated individuals in the same patch.

  What I want, in order:

  A systematic restatement of claims 1 through 4 in my vocabulary, using my notation rather than explaining mine back to me. Where one of them becomes an estimand, name the estimand; where it becomes an assumption about an assignment mechanism, say which; where it becomes a claim about identification, say so.

  Then, run the restatement on the case above. Which estimand or contrast corresponds to the within-group component, which to the between-group component, and which to the claim that the gene is the unit? What would have to be true of the world for "the gene is the unit of selection" to be the correct description here rather than "the group is," and is that a difference in what I would estimate, or only in how I would describe the same estimates?

  Then the residue report, which is the part I actually care about. Say what translated cleanly, what translated only after being bent to fit, and what has no expression in potential outcomes, assignment mechanisms, mediation, and interference at all. In particular I want your view on: whether my vocabulary can register the difference between a thing that is copied and a thing whose properties cause differential reproduction, and what breaks if it cannot; what it costs that the "treatment" here is not assigned by anyone but is generated by the very process whose effect is being estimated, and is regenerated each generation from the previous generation's outcomes; whether my framework can say anything about cumulative adaptation, or about what the process is producing design for, as opposed to which contrasts are nonzero in a single round; and whether the choice of level is a modelling choice, like the choice of a mediator or of an estimand, or a fact about the world that my framework is silent on. My clusters do not have children; I suspect this matters more than anything else on the list.

  Finally, the verdict. A colleague who is not a biologist, on hearing the dispute described, said it sounded like Simpson's paradox plus a variance decomposition, and that once you have both of those there is nothing left to argue about. I want to know how much of that is right and, to the extent it is wrong, whether what survives is a genuine question my vocabulary is too thin to pose, or a sign that the original question was doing less work than the people who ask it take it to be doing. If the former, tell me what minimal addition to my framework would let me pose it.

  Please keep the translation honest: do not quietly substitute an assumption of my framework for one of theirs and call it a translation, and mark clearly where you are reconstructing a position rather than reporting one, and where you are uncertain.
reasoning: |-
  We are going to translate the evolutionary biology concepts into the language of causal inference with interference, particularly cluster-randomized trials. The key concepts from your world that we will use are:

  - Units: individuals (organisms) and clusters (groups, patches).
  - Treatments: presence of a gene or allele (the transgene in the example).
  - Potential outcomes: outcomes (e.g., fitness) that depend on the treatment of the individual and possibly the treatments of others in the cluster (due to interference).
  - Estimands: defined at individual or cluster level, including direct, indirect, total, and overall effects.
  - Assignment mechanisms: how treatments are assigned (randomized, or in this case, natural processes).
  - Identification: conditions under which we can estimate the causal effects from observed data, including assumptions about interference and independence.

  We break down the four claims:

  ### 1. The gene's-eye claim (claim 1)
  In your terms: 
  - The gene is the only unit that is "copied" (replicated) with high fidelity across generations. The organism is a vehicle that the gene uses to propagate itself.
  - The key causal effect is the effect of the gene (allele) on its own replication (fitness) in the long run, accounting for the fact that the gene may influence the organism's traits and hence the organism's fitness, but also that the gene's replication may depend on the context (e.g., group composition) because of interference (e.g., the group-level effect of the enzyme).

  **Translation:**
  - The estimand of interest is the long-run reproductive success of the allele (gene) in the population. This is a counterfactual quantity: what would be the expected number of copies of the allele in the next generation under a particular scenario?
  - The assignment mechanism for the allele is not randomized by an experimenter but by Mendelian inheritance and other natural processes (including horizontal transfer and loss). We must account for the dependence of the allele's success on the group context (interference).
  - The claim that the group is not the beneficiary but a site of interaction means that we must model the effect of the allele on the group (as an intermediate variable) and then the effect of the group context on the allele's replication. This is a mediation structure: the allele affects group traits (e.g., patch biomass) and the group traits in turn affect individual fitness and hence allele replication.

  **In notation:**
  - Let `A_{ij}` be the treatment (allele) for individual `i` in cluster `j` (1 if carrier, 0 otherwise).
  - Let `Y_{ij}` be the fitness (number of offspring) of individual `i` in cluster `j`.
  - The group-level trait (patch biomass) is a function of the vector `A_j = (A_{1j}, ..., A_{nj})` of treatments in cluster `j`. Specifically, the enzyme production is non-additive: it requires at least 40% carriers. Let `G_j = g(A_j)` be the group trait (e.g., total biomass or enzyme level).
  - The potential outcome for individual `i` in cluster `j` might be written as `Y_{ij}(a_j)`, which depends on the entire treatment vector `a_j` (due to interference). But note that the group trait `G_j` is a mediator that is determined by `a_j`.

  The gene's-eye view focuses on the allele's fitness. The fitness of the allele is the average fitness of carriers, but note that it depends on the group context. The claim is that the allele's frequency change is driven by the effect of the allele on the group trait and then the effect of the group trait on the allele's replication.

  ### 2. The multi-level claim (claim 2)
  **Translation:**
  - This claim is about decomposing the total change in allele frequency into two components:
      - Within-group component: the change due to the relative fitness of the allele within a group (which would favour non-carriers because they have higher individual fecundity, unless compensated by the group effect).
      - Between-group component: the change due to the differential survival and reproduction of groups (which would favour groups with more carriers because of the enzyme effect).

  In your terms, this is a variance decomposition (like the Price equation) of the total evolutionary change. The Price equation decomposes the total change in allele frequency into:
     - The average within-group change (covariance between individual allele and individual fitness within groups).
     - The between-group change (covariance between group allele frequency and group mean fitness).

  **Estimands:**
  - The within-group component: `E[ Cov(A_{ij}, Y_{ij} | group j) ]` (averaged over groups) or more precisely the covariance conditional on the group.
  - The between-group component: `Cov( \bar{A}_j, \bar{Y}_j )` where `\bar{A}_j` is the group mean of `A_{ij}` (i.e., frequency) and `\bar{Y}_j` is the group mean fitness.

  The total change is the sum of these two. The multi-level selection claim is that both components exist and that they can pull in opposite directions.

  ### 3. Selection of vs. selection for (claim 3)
  **Translation:**
  - This is about confounding in evolutionary processes. A trait (e.g., a physical characteristic) might increase in frequency not because it is causally responsible for increased fitness, but because it is correlated with the true causal trait (e.g., a gene that is physically linked).

  In causal inference terms:
  - The trait under consideration (say `T`) might be a non-causal correlate of the true causal allele `A`. The observed correlation between `T` and fitness `Y` might be due to the causal effect of `A` on `Y` and the correlation between `A` and `T` (e.g., linkage disequilibrium).
  - The distinction: 
      - "Selection for" trait `T` would require that `T` has a causal effect on fitness (i.e., if we could intervene to change `T` holding everything else constant, fitness would change).
      - "Selection of" trait `T` is when `T` increases because it is correlated with a trait `A` that is under selection.

  This is analogous to the difference between the causal effect of `T` and the observed association. Identification of the causal effect of `T` requires that we account for confounding (by `A` in this case). Without an experiment that randomizes `T` independently of `A`, we cannot distinguish.

  ### 4. Group-level traits (claim 4)
  **Translation:**
  - Some traits are properties of the group (e.g., patch biomass, division of labour) and cannot be reduced to individual traits. Moreover, for group selection to operate, groups must be able to reproduce (i.e., found new groups) and transmit group-level traits to the new groups.

  In your framework:
  - A group-level trait `G_j` is a function of the group's treatment vector `A_j` and possibly other factors. It is not additive (cannot be written as a sum of individual traits). In the example, enzyme production is non-additive (requires quorum).
  - The group must be a unit of replication: the group trait `G_j` must affect the group's "fitness" (e.g., the number of propagules it sends to found new groups) and the group trait must be heritable at the group level. Heritability at the group level means that the group trait of the descendant group is similar to that of the parent group.

  **Estimand:** 
  - The effect of the group trait `G_j` on the group's reproductive success (say `W_j`), which is the number of new groups founded by group `j`.
  - The heritability of `G_j`: how similar the group trait of a descendant group is to the parent group.

  Without group reproduction and heritability of group traits, group selection cannot act on group-level traits.

  ## Applying to the concrete case

  The case: a stored-grain pest with patches (clusters). The transgene has:
  - (i) Direct negative effect on carrier fecundity: within a patch, carriers have 30% lower fecundity.
  - (ii) Group-level positive effect: carriers produce an enzyme that increases patch biomass, but only if the frequency of carriers is above 40%. The effect on biomass increases with frequency above that threshold.
  - (iii) Non-additivity: the group effect is zero below 40%.
  - (iv) Imperfect transmission: the gene can be lost or horizontally transferred.

  **Estimands and components:**

  We are interested in the long-run frequency of the transgene. We break down the change in one generation.

  **Within-group component (individual level):**
  - The direct effect of the transgene on individual fitness: negative (30% lower fecundity). However, note that the group effect (if present) might also affect the individual's fitness. The group effect (enzyme) increases patch biomass, which might increase the resources available to all individuals in the patch. Thus, the individual fitness `Y_{ij}` depends on both `A_{ij}` and the group treatment vector `A_j` (via the group trait `G_j`).

  We can define:
  - Direct effect: the effect of being a carrier vs. non-carrier in the same group (so same `A_j`). But note: if the group composition changes the environment (via `G_j`), then the direct effect might depend on the group composition. Specifically, if the group has <40% carriers, `G_j` is low and the direct effect is just the negative fecundity effect. If the group has >=40% carriers, `G_j` is high and the direct effect is the negative fecundity effect plus a positive shared benefit.

  However, the within-group selection component is about the relative fitness of carriers vs. non-carriers within the same group. In a group with frequency >=40%, the carriers have lower fecundity but both carriers and non-carriers benefit from the enzyme. So the relative fitness of carriers to non-carriers within the group is still lower (unless the enzyme benefit is so large that it more than compensates the carriers for their lower fecundity, but even then, the non-carriers get the same benefit without the cost). Thus, within any group, non-carriers have higher fitness than carriers. This is the within-group component (negative for the transgene).

  **Between-group component:**
  - Groups with frequency >=40% carriers have higher biomass (and presumably higher total productivity). This might lead to more propagules from these groups. Thus, groups with high frequency of carriers (above 40%) have higher group fitness (number of founders they contribute to the next generation). This is the between-group component (positive for the transgene).

  **Total change:**
  - The net change in transgene frequency depends on the balance of the within-group and between-group components.

  **The gene's-eye view:**
  - The gene's-eye view would say that the transgene's frequency change is determined by the net effect of these two forces. The gene is the unit of replication: the within-group component is negative (selection against the gene within groups) and the between-group component is positive (selection for groups with the gene). The gene's success depends on the population structure (how often groups with high frequency of the gene form and how much more productive they are).

  **What would have to be true for "the gene is the unit" to be correct?**
  - The gene is the unit that is replicated (copied). The group is not replicated as a whole: the group does not have offspring groups that inherit the group trait. In this case, the group trait (enzyme production) is not directly inherited by the new groups. Instead, the new groups are founded by individuals from a single surviving patch. The group trait in the new group will depend on the frequency of the transgene in the founders. Thus, the group trait is reconstructed from the individual traits of the founders. There is no group-level inheritance of the group trait (unless the group trait affects the composition of the founders, but the trait itself is not passed on). Therefore, the group is not a unit of selection in the strong sense (claim 4). The gene is the unit because the gene is what is passed on (with some noise due to imperfect transmission).

  **Estimand:**
  - The gene's-eye view estimand is the change in frequency of the transgene in the population. We can estimate the within-group and between-group components from one generation to the next. The between-group component is present because groups with high frequency of the gene produce more founders, but note that the group trait is not inherited as a group trait. It is the individual genes that are passed on.

  **Is the group a unit?** 
  - In this setup, the group is not a unit of selection because it does not reproduce and transmit group traits. The group effect is an emergent property that affects the reproductive success of the individuals (and hence the genes) in the group. The gene's-eye view is the correct description because the gene is the replicator. The group is a vehicle for the gene.

  ## Residue report

  **What translated cleanly:**
  - The multi-level decomposition (claim 2) translates directly to a variance decomposition (Price equation) which is a standard statistical tool. The within-group and between-group components are estimable from data on groups and individuals.
  - The distinction between selection of and for (claim 3) is exactly the distinction between association and causation. It maps to the need for causal identification and the problem of confounding.
  - The non-additivity of the group effect (quorum) is handled naturally in your framework as a non-linear interference effect.

  **What translated with bending:**
  - The gene's-eye view (claim 1) is about long-run replication. Your framework is typically for short-term causal effects in one time step. We can model one generation, but cumulative adaptation over generations is not directly in your framework. We had to map the gene's replication to the individual fitness and then to the change in allele frequency. The long-run outcome is a function of repeated short-term effects, but it might require dynamic modeling (which is beyond standard causal inference).
  - The group-level traits (claim 4) are handled as mediators or as environmental variables at the group level. However, the requirement for group-level reproduction and inheritance is not naturally in your framework. Your clusters do not have children. We can define group fitness (e.g., number of new groups founded by a group) and then the effect of the group trait on group fitness. But the heritability of group traits is not defined in your framework because groups don't produce groups. We can approximate by looking at the correlation between the group trait of a parent group and the group trait of a group founded by its propagules. But this is not a direct causal effect because the new group's trait is determined by the traits of the founders, not by the parent group's trait per se.

  **What has no expression:**
  - **Cumulative adaptation and design:** Your framework is for one-time effects. Evolution is a multi-generational process. The concept of "design for" (what the trait is for) is a teleological concept that is not directly causal. In your framework, we can estimate the effect of the gene on fitness in the current environment, but we cannot capture the idea that the gene has been selected for that effect over many generations. The residue is the historical process.
  - **The replicator vs. vehicle distinction:** Your framework does not inherently distinguish between the thing that is copied (the gene) and the thing that is built (the organism). In your notation, the treatment is the gene (a variable), and the outcome is fitness. But the fact that the gene is replicated and the organism is not is not captured. This matters because the gene's effect on fitness can be indirect and context-dependent, but the gene is what persists. In your framework, we model the effect of the gene on fitness in the current context, but we do not model the copying process explicitly. This is a limitation when we consider that the gene is the only thing that is transmitted (with high fidelity) and the organism is temporary.
  - **Assignment mechanism:** In your trials, treatment is assigned by the experimenter. In evolution, treatment (gene) is assigned by natural processes (inheritance, mutation, etc.) and the assignment mechanism is part of the process we are studying. This makes identification more challenging because we cannot assume randomization. We have to rely on natural randomization (like Mendelian inheritance) or use observational methods with strong assumptions.
  - **Level of selection as a fact vs. modeling choice:** In your framework, the choice of estimand (individual or group level) is a modeling choice. But in biology, the debate is about what the actual unit of replication is in nature. The gene's-eye view argues that the gene is the fundamental unit of replication, regardless of the level at which we measure selection. This is a philosophical claim about the world. Your framework can estimate effects at different levels, but it cannot settle which level is the "real" one. That requires additional assumptions about what is being replicated.

  **What breaks if we cannot distinguish the replicator?**
  - We might misattribute the cause of an effect. For example, if we see a group-level effect, we might think that the group is the unit of selection, but in reality, the effect is driven by genes that use the group to promote their own replication. Without the replicator concept, we might not see the long-run dynamic.

  **Verdict on the colleague's comment:**
  - The colleague said: "Simpson's paradox plus a variance decomposition". This is partially right. The multi-level selection debate often involves Simpson's paradox (a trend that appears in groups disappears or reverses in the aggregate, or vice versa) and the Price equation is a variance decomposition. However, the debate goes deeper:
      - The gene's-eye view (replicator) is a fundamental claim about what evolution is optimizing. It is not just about decomposition but about what entity is being propagated.
      - The distinction between replicator and vehicle (gene and organism/group) is not captured by Simpson's paradox or variance decomposition.
      - The group selection debate (claim 4) requires group reproduction and group inheritance, which are not part of Simpson's paradox.

  So the comment captures the statistical aspect but misses the ontological aspect.

  **Minimal addition:**
  - To capture the replicator concept, we need to model the transmission of information (or traits) across generations. We could extend the framework to a multi-generational setting with a model of inheritance. Specifically, we need:
      - A state variable for each unit (e.g., the allele) that is passed from one generation to the next.
      - A model for how the state of an individual in the next generation depends on the state of the parents (or the group) in the current generation.

  This would allow us to track the long-run frequency of the allele and define the evolutionary success of the allele. It would also let us model the group-level inheritance if we define how group traits are transmitted when a group reproduces.

  ## Conclusion

  We have translated the four claims into your framework. In the concrete case, the within-group component is negative (selection against the gene within each patch) and the between-group component is positive (selection for patches with high gene frequency). The gene is the unit of selection because it is the replicator. The group effect is a causal factor in the gene's success, but the group itself is not a replicator. The residue includes the historical process of cumulative adaptation and the explicit modeling of replication across generations. The minimal addition to your framework to pose the replicator question is a multi-generational model with inheritance.
answer: |-
  ### Systematic Restatement of Claims in Causal Inference Vocabulary

  **Claim 1 (Gene's-Eye View)**  
  - **Core translation**: The gene (allele) is the replicator; the organism is a mediator. The estimand is the **long-run individual-level causal effect of the allele on its own reproductive success** (expected number of copies in the next generation).  
  - **Key elements**:  
    - *Estimand*: Expected reproductive success of the allele, defined as \(\mathbb{E}[Y_i | A_i = 1] - \mathbb{E}[Y_i | A_i = 0]\), where \(Y_i\) is the fitness (offspring count) of individual \(i\), and \(A_i \in \{0,1\}\) indicates allele presence.  
    - *Assumption*: Partial interference (clusters = groups) holds, with no interference across groups.  
    - *Identification claim*: The allele's effect is identified only if we account for **mediation by group-level traits** (e.g., patch biomass). Group benefits are not "for the group" but are indirect effects of the allele on its own fitness via group traits.  
    - *Non-uniqueness*: The split into direct (individual fecundity) and indirect (group-mediated) effects depends on the mediator specified (e.g., enzyme production).  
  - **Notation**:  
    - Let \(Y_i(a_i, g_j)\) be the potential fitness of individual \(i\) if their allele status is \(a_i\) and group \(j\)'s mediator (e.g., enzyme level) is \(g_j\).  
    - \(g_j\) is a non-additive function of the group treatment vector \(\mathbf{A}_j\) (e.g., \(g_j = \mathbf{1}(\text{freq}(\mathbf{A}_j) \geq 0.4)\)).  

  **Claim 2 (Multi-Level Selection)**  
  - **Core translation**: Total evolutionary change decomposes into within-group and between-group causal effects. The estimands are **within-group and between-group causal contrasts**.  
  - **Key elements**:  
    - *Estimands*:  
      - *Within-group*: Average causal effect of \(A_i\) on \(Y_i\) within clusters, \(\mathbb{E}[Y_i(1, g_j) - Y_i(0, g_j) | j]\).  
      - *Between-group*: Effect of group allele frequency \(\bar{A}_j\) on group mean fitness \(\bar{Y}_j\), estimated via \(\text{Cov}(\bar{A}_j, \bar{Y}_j)\).  
    - *Variance decomposition*: Total change in allele frequency = Within-group covariance + Between-group covariance (Price equation).  
    - *Identification claim*: Requires no interference across groups and well-defined group traits.  
  - **Contrasts**: Within-group effect favors selfishness (if \(Y_i(1, g_j) < Y_i(0, g_j)\)), between-group effect favors altruism (if \(\bar{Y}_j\) increases with \(\bar{A}_j\)).  

  **Claim 3 (Selection Of vs. For)**  
  - **Core translation**: Distinguishes **causal effects from associational effects due to confounding**.  
  - **Key elements**:  
    - *Estimand*: Causal effect of a trait \(T_i\) on fitness \(Y_i\), isolated from genetic linkage or confounding.  
    - *Assumption*: \(T_i\) is **not causally affected** by the allele \(A_i\) (e.g., physical linkage creates correlation without causation).  
    - *Identification claim*: The effect of \(T_i\) on \(Y_i\) is nonparametrically identified only if \(A_i\) is not a confounder (unverifiable without randomization of \(T_i\)).  
  - **Notation**: If \(T_i\) is correlated with \(A_i\), \(\mathbb{E}[Y_i | T_i=1] - \mathbb{E}[Y_i | T_i=0] \neq \mathbb{E}[Y_i(t_i=1) - Y_i(t_i=0)]\).  

  **Claim 4 (Group-Level Traits and Selection)**  
  - **Core translation**: Group selection requires **causal effects of emergent group traits** on group fitness, with group-level heritability.  
  - **Key elements**:  
    - *Estimand*: Causal effect of emergent group trait \(G_j\) (e.g., enzyme production) on group fitness \(W_j\) (e.g., propagules founded), \(\mathbb{E}[W_j(g_j) - W_j(g_j')]\).  
    - *Assumption*: \(G_j\) is **non-additive** (not a function of individual traits alone; e.g., \(G_j = \mathbf{1}(\text{freq}(\mathbf{A}_j) \geq 0.4)\)).  
    - *Identification claim*: Requires groups to "reproduce" (transmit \(G_j\) to descendant groups) and no interference in group reproduction.  
    - *Contrast*: Aggregate group traits (e.g., mean \(A_j\)) vs. emergent traits (\(G_j\)); only the latter supports group selection.  

  ---

  ### Application to the Stored-Grain Pest Case

  **Setup**:  
  - Clusters = patches (groups).  
  - Treatment \(A_i = 1\) if individual carries transgene.  
  - Individual fitness \(Y_i\) = fecundity (offspring).  
  - Group trait \(G_j = \text{patch biomass}\) (enzyme-mediated), where \(G_j\) is:  
    - 0 if freq\((A_j) < 0.4\),  
    - Increasing with freq\((A_j)\) if \(\geq 0.4\).  
  - Group fitness \(W_j\) = number of propagules founded by patch \(j\).  

  **Estimands and Components**:  
  1. **Within-group component**:  
     - Estimand: \(\mathbb{E}[Y_i(1, g_j) - Y_i(0, g_j) | j]\).  
     - In this case: Direct effect of \(A_i\) is negative (30% lower fecundity). Even when \(g_j > 0\), non-carriers benefit equally from enzyme without cost. Thus, within-group effect **always favors non-carriers** (assuming no individual-level benefit).  

  2. **Between-group component**:  
     - Estimand: \(\text{Cov}(\bar{A}_j, \bar{Y}_j)\) or \(\mathbb{E}[W_j | \bar{A}_j \geq 0.4] - \mathbb{E}[W_j | \bar{A}_j < 0.4]\).  
     - Here: Patches with \(\bar{A}_j \geq 0.4\) have higher \(G_j\), leading to higher \(\bar{Y}_j\) and thus higher \(W_j\). Between-group effect **favors carriers**.  

  3. **Gene-as-unit claim**:  
     - Corresponds to the **total effect of the allele** on its reproductive success, aggregating direct and indirect paths.  
     - Estimand: \(\mathbb{E}[Y_i | A_i=1] - \mathbb{E}[Y_i | A_i=0]\) (across all individuals).  
     - Identification: Depends on the balance of within-group and between-group forces.  

  **When is "Gene as Unit" Correct?**  
  - **Required truth**: The allele is the only entity with high-fidelity replication (imperfect transmission is noise). Group traits (\(G_j\)) must not replicate independently; they emerge solely from current allele frequencies.  
  - **Estimand-level difference**:  
    - If groups reproduced with heritable \(G_j\) (e.g., propagules inherit parent \(G_j\)), group-level estimands (e.g., \(\mathbb{E}[W_j(g_j)]\)) would be primary.  
    - Here, propagules are formed from a **single patch**, so \(G_j\) is reconstructed from founders' alleles. No group-level heritability \(\implies\) gene is unit.  
  - **Estimation vs. description**: Same estimates (within/between effects), but interpretation differs. "Gene as unit" means:  
    - Between-group effect is an **indirect effect of the allele** (mediated by \(G_j\)), not a group-level causal force.  

  ---

  ### Residue Report: What Translates, What Bends, What Breaks

  **Translated Cleanly**:  
  1. **Multi-level decomposition (Claim 2)**: Variance decomposition and Simpson-like reversals are native to your framework. Within/between estimands map directly.  
  2. **Selection of vs. for (Claim 3)**: Purely a causal identification problem (confounding by linkage). Aligns with your work on mediation and separable effects.  
  3. **Non-additive interference**: The quorum effect (\(G_j\) threshold) is a non-linear interference pattern, handled via potential outcomes indexed by group treatment.  

  **Bent to Fit**:  
  1. **Gene-as-unit claim (Claim 1)**:  
     - *Bend*: Your framework estimates short-term causal effects, not long-term replication. We map "replication" to individual fitness (\(Y_i\)), ignoring transmission noise (e.g., horizontal transfer).  
     - *Cost*: Imperfect transmission breaks SUTVA for the allele, requiring dynamic modeling.  
  2. **Group-level traits (Claim 4)**:  
     - *Bend*: Group fitness (\(W_j\)) is estimable, but "group reproduction" requires clusters to have "offspring" (propagules), which your framework doesn't natively support.  
     - *Cost*: Heritability of \(G_j\) is not defined; we approximate via founder composition.  

  **No Expression in Your Vocabulary**:  
  1. **Replicator vs. Vehicle Distinction**:  
     - *Breakdown*: Your framework treats the allele as a treatment variable, not a replicating entity. It cannot distinguish:  
       - A "copied" entity (allele with high fidelity).  
       - A "causal" entity (e.g., a neutral allele correlated with a causal one).  
     - *Consequence*: Without replicator status, Claim 1 reduces to "the allele has a total effect," losing the evolutionary argument for why genes are privileged.  
  2. **Endogenous Treatment Assignment**:  
     - Treatment (\(A_i\)) is generated by prior fitness outcomes and transmission processes—no external assignment.  
     - *Breakdown*: Your identification strategies (e.g., randomization) assume exogenous assignment. Here, assignment is dynamic and history-dependent.  
     - *Consequence*: Standard identification fails; dynamic systems (e.g., stochastic equilibria) are needed.  
  3. **Cumulative Adaptation**:  
     - Your framework estimates effects in one "generation," not cumulative change. The "design for" claim (teleology) implies long-run optimization, which has no analog.  
  4. **Level of Selection as Fact vs. Choice**:  
     - Your framework treats the level (individual/group) as an estimand choice. Biology treats it as a **fact about replication mechanisms** (e.g., does \(G_j\) replicate?).  
     - *Silence*: Your framework cannot adjudicate whether groups "truly" are units; it only estimates effects at specified levels.  

  **Critical Limitation: Clusters Without Children**  
  - Your clusters are static; they don't reproduce. In evolution, group selection requires group reproduction (claim 4). This is the **most significant gap**.  
  - Consequence: You can estimate \(\mathbb{E}[W_j | G_j]\) (effect of group trait on fitness), but not the **heritability of \(G_j\) across "offspring groups."**  

