  **Step 3: Reference Class Selection**
  - **Rule for nomination**: The analyst must nominate at least 3 candidate reference classes and at most 5. Each class must be defined by at least two characteristics (e.g., "European monarchies in the 18th century" is not allowed because it has only one; "18th-century polities with a written constitution and monarchical government" is allowed). The current polity must be a member of the class by the same criteria.
