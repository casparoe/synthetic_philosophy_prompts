  - Start with the base rate (or conditional base rate) from Step 5 as the anchor.
  - **Adjustment factors**: The analyst may adjust up or down by a maximum of 10 percentage points (absolute) for case-specific factors. The adjustment must be based on factors that are not already captured in the reference class definition. For example, if the reference class is "modern republics with written constitutions" and the current polity has a very stable democratic tradition (which is typical for the class) then no adjustment. But if it has an unusually high level of internal conflict (even for its class) then a downward adjustment.
