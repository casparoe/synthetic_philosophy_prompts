  We are designing a procedure for estimating the 30-year political continuity probability for a polity. The procedure must be robust, defensible, and take about two hours per case. We have an archive of about 200 historical polities with start and end years, and a Successor-Continuity Convention (SCC) that defines when an entity is considered to persist.

  The core idea is to use an outside view: anchor to a base rate from a reference class and then adjust sparingly.

  Let's break down the requirements step by step.

  1. **Fixed Sequence of Questions**: We need a script with clear questions, criteria for sufficient answers, and defaults.

  2. **Outcome Variable Fixed First**: Define what we are measuring (the event: polity exists at T0+30 under SCC) and resolve coder disagreement. Also, state what SCC settles by fiat.

  3. **Reference Class Selection**: Rules for nominating candidate classes, adjudicating between them, and handling conflicts.

  4. **Selection Bias**: Address the bias in our archive (only polities with dated administrative records).

  5. **Duration Already Survived**: How to account for current age of the polity.

  6. **Adjustment Step**: Cap on deviation from base rate, authorization for exceeding, and documentation.

  7. **Stopping Rules**: When to output "no defensible number" and how to handle that in the pricing model.

  8. **Explicit Handoffs to Named Persons**: Points where value judgments are made by a designated person.

  Additionally, we must handle specific cases and run the procedure on three cases.

  ---

  **Procedure: Thirty-Year Political Continuity Assessment (TY-PCA)**

  **Preparatory Step: Define the Outcome Variable**
  - The outcome variable is binary: 1 if the polity (or a successor meeting the SCC) is in a position to honor the obligation 30 years from the assessment date (T0); 0 otherwise.
  - **Resolving coder disagreement on historical end years**: For each polity in the archive, the end year is the median of the two independent coder assessments. If they disagree by more than 10 years, the case is flagged and resolved by a third senior analyst (the "Archivist") before the procedure begins. The Archivist's decision is final.
  - **SCC by fiat**: The SCC defines the following by fiat (not by evidence):
    - A successor must control at least half the territory (as of T0).
    - Recognized by at least one-third of the original recognizing states.
    - Operates at least one institution founded before T0.
    - This convention is applied uniformly to all cases, historical and current.

  **Step 1: Record Basic Facts**
  - **Question 1.1**: What is the current polity's name, T0 (assessment date), and current age (in years) at T0?
  - **Criterion**: Must be filled. Current age is computed as T0 minus start year (from the polity's own record).
  - **Question 1.2**: Does the polity have a written constitution? (Yes/No/Uncertain)
  - **Criterion**: Must be answered. Default: Uncertain.
  - **Question 1.3**: What is the polity's level of economic development? (Categorized as: Low, Medium, High, based on World Bank income groups at T0)
  - **Criterion**: Must be answered. Default: Medium.

  **Step 2: Define the Outcome Event for the Current Polity**
  - **Question 2.1**: Are there any known, specific, and imminent threats to the polity's existence? (e.g., active secessionist movement with popular support, ongoing civil war, impending environmental catastrophe)
