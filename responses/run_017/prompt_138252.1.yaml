  ### **Live Case Applications**
  #### **Case 1: Federal Union (Peaceful Secession Risk)**  
  - **Step 1**: Age = 55 years; imminent threat = yes (secession referendum); government = federal.  
  - **Step 2**:  
    - Nominated classes: (1) Federal unions, written constitution (n=15; base: 80%); (2) Post-1950 federations (n=12; base: 78%); (3) High-income federations (n=10; base: 85%).  
    - Selected: Class 1 (shares government + constitution).  
  - **Step 3**: "Bias noted; no adjustment."  
  - **Step 4**: Conditional base rate (age 55): 80%.  
  - **Step 5**: Adjustment: –10% (secession risk; SCC rules original entity ends if region >50% secedes. Adjustment Authorizer approved).  
  - **Step 6**: No stop.  
  - **Final Probability**: 70%.  
  - **Uncongenial Output**: Desk may argue successors will honor debt, but SCC defines entity persistence, not creditworthiness. Accept because: (1) SCC is contractual fiat; (2) pricing model requires entity existence.  

  #### **Case 2: Low-Lying Island State (Climate Exile)**  
  - **Step 1**: Age = 58 years; imminent threat = yes (habitability loss); government = unitary.  
  - **Step 2**:  
    - Nominated classes: (1) Island states (n=20; base: 83%); (2) Post-colonial states (n=100; base: 75%); (3) States with constitutions (n=150; base: 83%).  
    - Selected: Class 1 (shares region + development).  
  - **Step 4**: Conditional base rate: 83%.  
  - **Step 5**: Adjustment: –10% (SCC requires territory control; exile fails this. Authorizer approved).  
  - **Final Probability**: 73%.  

  #### **Case 3: Supranational Union (Few Analogues)**  
  - **Step 1**: Age = 30 years; threat = no; government = supranational.  
  - **Step 2**:  
    - Nominated classes: (1) Supranational unions (n=3; rejected: small). (2) Unions of sovereign states (n=10; base: 70%). (3) Economic unions (n=8; base: 75%).  
    - Selected: Class 2 (Arbiter chose; shares government + era).  
  - **Step 4**: Unconditional base rate (age <30): 70%.  
  - **Step 5**: No adjustment (no unique risks).  
  - **Final Probability**: 70%.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Eliminate subjectivity**: Anchors reduce bias, but reference class selection and adjustments retain judgment.  
  2. **Override SCC fiat**: Continuity is defined by territorial control, recognition, and institutions—not moral or legal obligations.  
  3. **Predict unprecedented events**: e.g., climate-induced exile has no historical base rate; relies on adjustment.  
  4. **Fully correct archive bias**: Assumes current polities mirror historical ones in record-keeping, which may not hold.  
  5. **Resolve self-fulfilling prophecies**: Outputs are confidential; procedure ignores market impact (Board must handle separately).  
  6. **Replace expert judgment for small classes**: Supranational unions use sparse data; Arbiter decides relevance.  

  This procedure standardizes the outside view, forces explicit anchors, and documents rationales. It balances speed and defensibility while handling edge cases via pre-defined handoffs.
