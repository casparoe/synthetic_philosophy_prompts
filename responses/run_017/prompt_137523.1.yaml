prompt: |-
  I write about science and ideas for a newspaper, and for the past few months I have been trying to report accurately on a budgeting reform that several finance ministries and health systems have adopted and that I keep describing badly. The practice is this: every spending bid, whatever department it comes from, is scored in a single unit — one point on the zero-to-ten life-satisfaction question asked in national surveys, sustained by one person for one year, which the practitioners call a wellbeing-adjusted life year. Effects on that unit are estimated by regressing survey responses on circumstances, so that a home-insulation programme, a talking-therapy service, and a hip-replacement backlog all end up as numbers in the same column; the numbers are summed across everyone affected, with no discount or premium for whose they are; the total is divided by cost using a single money-to-wellbeing exchange rate that is the same for every person and every programme; and the bid is approved if its cost per unit falls below a fixed threshold. Alongside this sits a set of local rules I have been picking at: where a policy affects grief, chronic pain or disability, self-reports are overridden by valuations that members of the general public give to written descriptions of those states, on the acknowledged grounds that people living in them adapt and report near-normal satisfaction; gains accruing to people who start from a low baseline are multiplied by a severity uplift, while gains to people with short remaining lifetimes are not; the exchange rate is linear even though the underlying surveys show income buying less wellbeing the more of it someone already has; and for programmes that change who is alive — neonatal care, road safety, a housing policy that affects who moves into a district — benefits are credited to people who would not otherwise have existed, against an average baseline. I also notice that a small reform making a few people better off and nobody worse off is rejected if it costs more per unit than the threshold allows, while a reform that imposes genuine losses on an identifiable minority is approved whenever the summed total clears the bar.

  When I described all this on the radio, an economist told me the whole apparatus quietly assumes that one person's wellbeing can be put on the same scale as another's, which is exactly the assumption the old positivist critics said was not a scientific operation at all — choices, they said, reveal an ordering inside a single person, and nothing that can be lined up across heads. That is the part I cannot get straight, and it is not made easier by the fact that the last time an American state tried to rank treatments with a comparable metric, in Oregon at the end of the eighties, it ran into disability-discrimination law within a few years. So I would like the implicit theory reconstructed.

  What I need, in terms I can defend in nine hundred words without footnotes — and please do not send me to papers, since I would have no way of obtaining them and would rather have the argument than the references — is this. First, what has to be true about wellbeing, about its measurability and about its comparability across persons, for the scorecard's verdicts to be anything more than administrative convention: does it strictly require a cardinal scale with full interpersonal comparability, or would some weaker structure do the work, and if it does require the strong thing, is the scale being discovered or stipulated, and on whose authority is a stipulated scale binding on the people it ranks? Second, where is the practice philosophically underdetermined: which rival views about value and distribution would license exactly these same numbers, so that I should not claim in print that the scorecard commits its users to summing utility in the classical style? Third, are its parts mutually consistent — the two different sources of the scale, the uniform unit alongside the severity uplift, the linear exchange rate over a curved relationship, the indifference to who receives a unit alongside the stated priority to the worst off, the crediting of benefits to people whose existence depends on the policy — or is the apparatus a coalition of views that would come apart under pressure? And fourth, if the critic is right and no interpersonal comparison is available, what would the institution actually do on Monday morning instead: what allocative procedure would replace the scorecard, what would it gain in honesty, and what would it lose in the consistency and transparency that won the scorecard its adoption in the first place? Throughout, I would find it most useful if you kept separate what the practice strictly presupposes from what it merely fits well with, since the distinction is the thing my editor will press me on.
reasoning: |-
  Okay, let me unpack this query carefully. The user is a science journalist grappling with a complex wellbeing-based budgeting system, and they need philosophical clarification presented in accessible terms. The core tension revolves around whether wellbeing can be measured and compared across individuals - a fundamental challenge in welfare economics.

  First, I need to address the measurement assumptions. The system requires cardinal interpersonal comparability to function meaningfully. Without a common scale for wellbeing units, the entire aggregation process collapses into arbitrary convention. This strong requirement is non-negotiable for the scorecard's verdicts to have normative weight beyond administrative convenience.

  The philosophical underdetermination is crucial. The same numerical outputs could stem from at least three distinct ethical frameworks: classical utilitarianism (summing welfare), prioritarianism (weighting the disadvantaged), or sufficientarianism (meeting minimum thresholds). The severity uplift suggests prioritarian leanings but doesn't preclude other interpretations.

  Noticing several internal tensions: The exclusive reliance on public valuations for certain conditions contradicts the general use of subjective reports. The linear monetary conversion ignores diminishing marginal utility of income. The "severity uplift" clashes with the uniform wellbeing unit when baseline differences exist. And the treatment of future individuals raises non-identity problems.

  If interpersonal comparisons are rejected, practical alternatives exist: decentralized bargaining preserves local values but sacrifices consistency; needs-based allocation offers simplicity but loses efficiency; procedural justice focuses on fair processes over outcomes. Each alternative gains ethical clarity but loses the scorecard's strengths - transparent trade-offs and systematic prioritization.

  The distinction between strict presuppositions and compatible ideas will help the journalist defend their analysis. The cardinal comparability is foundational, while prioritarian elements are operational choices that could be modified without abandoning the system entirely. This nuance should satisfy editorial scrutiny.
answer: |-
  Here’s a reconstruction of the implicit theory behind this budgeting reform, addressing your four core questions in plain terms:

  ---

  ### **1. The Wellbeing Measurement Assumption: What Must Be True?**
  For the scorecard to be more than administrative convention, **wellbeing must be cardinally measurable and fully comparable across people**.  
  - **Cardinality**: Wellbeing can’t just be ranked (e.g., "Alice feels better than Bob"); it requires quantified differences (e.g., "Alice gains 3 wellbeing units, Bob gains 1").  
  - **Interpersonal comparability**: A unit of wellbeing must mean the same thing for everyone. If a 1-point gain on the life-satisfaction scale for Alice equals a 1-point gain for Bob, their gains can be summed.  

  **Is the scale discovered or stipulated?**  
  - **Hybrid origin**: Baseline scores come from surveys (attempted discovery), but key adjustments (e.g., overriding self-reports for disability) are stipulations. Public valuations of health states replace lived experience, implying that policymakers distrust subjective adaptation.  
  - **Authority**: The scale’s binding power comes from **institutional adoption**, not scientific consensus. Governments impose it as a tool for consistency, but it lacks democratic validation beyond bureaucratic approval.  

  *Why weaker structures fail*:  
  - If wellbeing were only *ordinal* (rankable but not quantifiable), you couldn’t sum gains.  
  - If comparisons were limited (e.g., "parents vs. non-parents"), you couldn’t aggregate across all groups.  

  ---

  ### **2. Philosophical Underdetermination: What Rival Views Fit the Same Numbers?**  
  The scorecard’s outputs are compatible with at least three distinct ethical frameworks:  
  - **Classical Utilitarianism**: Maximizes total wellbeing. Fits the summing of units and indifference to distribution (except where severity rules override this).  
  - **Prioritarianism**: Gives extra weight to the worse-off. Explains the "severity uplift" for those with low baselines.  
  - **Sufficientarianism**: Aims to bring everyone above a threshold. The severity rule could reflect this, but the lack of a fixed sufficiency threshold weakens the fit.  

  **Crucially, the scorecard doesn’t *require* utilitarianism**. The severity uplift and non-discounting of short lifespans contradict pure utilitarianism (which would prioritize younger/healthier people). The system is a **pragmatic hybrid**—it uses utilitarian *arithmetic* but grafts on equity adjustments.  

  ---

  ### **3. Internal Tensions: Where Does the System Inconsistently Apply Its Logic?**  
  - **Conflicting Wellbeing Sources**: Using self-reports *except* for disability/pain/grief assumes adaptation makes self-reports unreliable. But if adaptation distorts *those* states, why trust self-reports elsewhere?  
  - **Uniform Unit vs. Severity Uplift**: The core unit treats all gains equally, but the uplift implicitly concedes that a unit for the miserable is *more urgent* than for others—undermining the uniformity claim.  
  - **Linear Exchange Rate**: Surveys show £1000 helps a poor person more than a rich one. Ignoring this assumes money buys equal wellbeing for all—a contradiction of the data informing the system.  
  - **Indifference to Identity vs. Priority to the Worst-Off**: Summing units equally treats all recipients alike, but the severity rule privileges one group. This is unresolved: is the goal total wellbeing or fairness?  
  - **Crediting Benefits to Future/Nonexistent People**: Assigning wellbeing to those who wouldn’t exist without a policy assumes we can compare existence to nonexistence—a philosophical minefield.  

  **Verdict**: The apparatus is a **coalition of compromises**. It prioritizes operational simplicity over philosophical purity, but the tensions risk ad-hoc decision-making.  

  ---

  ### **4. If Interpersonal Comparisons Are Impossible: What’s the Alternative?**  
  If wellbeing can’t be compared across heads, the institution could:  
  - **Switch to Procedural Fairness**:  
    - *Example*: Allocate budgets via local democratic deliberation or expert panels.  
    - *Gains*: Avoids false precision; respects plural values; may better address discrimination risks (as in Oregon).  
    - *Losses*: Lacks transparency; inconsistent across regions; vulnerable to lobbying.  
  - **Use Non-Comparable Metrics**:  
    - *Example*: Fund programs meeting basic needs (health, nutrition) first, then use cost-effectiveness *within* domains (e.g., only comparing health programs).  
    - *Gains*: No interpersonal comparisons needed; focuses on urgent goods.  
    - *Losses*: Can’t weigh health vs. education vs. environment; may neglect cross-cutting benefits.  
  - **Embrace "Muddling Through"**:  
    - *Example*: Incremental bargaining between departments, using political negotiation.  
    - *Gains*: Adapts to context; acknowledges value conflicts.  
    - *Losses*: Opaque; perpetuates inertia; lacks principled defense.  

  **Trade-off**: Alternatives gain honesty about value incommensurability but lose the scorecard’s consistency, transparency, and ability to make tough trade-offs explicit.  

  ---

  ### **Summary for Your Editor**
  - **Strict presupposition**: Cardinal, interpersonally comparable wellbeing is non-negotiable for the scorecard’s arithmetic to be meaningful. Without this, it’s a convention, not a discovery.  
  - **Compatible but not required**: Prioritarianism or sufficientarianism justify the severity rule; classical utilitarianism explains the summing.  
  - **Inconsistencies**: The system’s adjustments (e.g., overriding self-reports, severity uplift) clash with its core logic. It’s a practical patchwork.  
  - **Alternative path**: If comparisons fail, institutions lose a transparent tool but gain ethical humility.  

  This reform tries to turn policy into a science of trade-offs—but its rigor relies on assumptions about wellbeing that are contested, not proven. Its strength (consistency) and weakness (rigidity) share the same root.
