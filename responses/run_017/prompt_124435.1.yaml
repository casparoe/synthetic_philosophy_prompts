  The non-theistic characterization holds up well, as does the anti-fatalism point. But the compassion tension is more nuanced: traditions like engaged Buddhism actively reconcile karma with karuna. On rebirth's necessity, I'm aware of split opinions - some modernists like Batchelor reject it while maintaining karmic ethics, but critics like Flanagan argue this guts the doctrine. 

