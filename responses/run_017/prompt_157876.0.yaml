answer: |-
  Right, let's stress-test this. Your distinction between "archive-truth" and "neighbour-truth" is a sharp one, and Rwanda's gacaca courts are a fascinating, complex case to run it against. I'll be brutal where needed – that's the brief.

  **1. The Mechanism & The Archive-Truth Prediction**

  *   **The Amnesty-for-Truth Mechanism (Archive-Truth Model):**
      *   **Principal:** The successor state (seeking historical clarity, legitimacy, rule of law restoration).
      *   **Agent:** Perpetrators (possessing crucial information).
      *   **Currency:** Full, formal amnesty (immunity from prosecution/punishment).
      *   **Disclosure:** Full, truthful account of specific crimes, often including names of victims, locations, methods, and potentially co-perpetrators/higher-ups. Focus on facts verifiable against evidence.
      *   **Verification Problem:** Matching confessions against forensic evidence, survivor/witness testimonies, documents. Centralised or quasi-judicial body assesses credibility.
      *   **Predicted Gacaca Design/Outcome (Archive-Truth Lens):**
          *   **Design:** Centralised, professionalised body (judges/lawyers). Strict rules of evidence. Focus on detailed, verifiable factual records. Amnesty offered explicitly as the *quid pro quo* for full confession. Mandate would prioritise uncovering the *entire* chain of command, including planners/organisers. Proceedings might be less public to protect sensitive information or witnesses.
          *   **Production:** A comprehensive, centralised, verified archive detailing the *who, what, where, when* of crimes, including command structures. The primary value lies in the creation of this authoritative historical record for the nation and posterity. Social reconciliation is hoped for but is a secondary outcome of establishing the factual record.

  **2. Gacaca Features: Explained vs. Mispredicted by Archive-Truth**

  *   **Explained by Archive-Truth:**
      *   **Leniency as Incentive:** The core logic of offering a benefit (sentence reduction) for confession/disclosure *is* consistent, even if it's not full amnesty. It recognises the state needs leverage.
      *   **Volume & Thin Procedure:** The sheer scale *demands* a simplified, decentralised approach. A centralised, evidence-heavy archive-truth process would have been utterly impossible logistically and financially. This is a pragmatic adaptation the model might grudgingly accept as necessary, sacrificing some rigour for coverage.
      *   **Exclusion of Planners/Organisers:** The archive-truth model would predict an *inclusion* of planners. However, one could argue the model *explains* why they *weren't* included – the state judged they wouldn't confess truthfully even for amnesty, or the political cost/instability risk was too high. The model highlights this as a *failure* to achieve its core objective (full structural truth) rather than a designed feature.

  *   **Mispredicted/Misdescribed by Archive-Truth:**
      *   **Leniency vs. Amnesty:** This is the critical divergence. Archive-truth predicts *amnesty* as the necessary currency for high-value disclosures, especially implicating others. Gacaca offered *reduced punishment*, not immunity. This aligns perfectly with your "visible mark" and "shared script" idea – the perpetrator is *marked* by their confession *and* their subsequent community service, reintegrating with a known status. Amnesty wipes that mark away.
      *   **Local Public Audience & Lay Judges:** Archive-truth sees the audience as incidental; verification is key. For gacaca, the *local community audience* and *locally elected lay judges* were fundamental. Truth was performed *for* and *within* the community where the crimes occurred and where people had to live together. Verification was often communal ("Did you see X do Y?") rather than strictly forensic. This screams "neighbour-truth".
      *   **Focus on Repentance & Reconciliation:** Archive-truth might hope for reconciliation, but it's not its mechanism. Gacaca explicitly incorporated repentance as part of the confession process and aimed directly at community reconciliation through public acknowledgment and joint rebuilding (community service). This is integral to neighbour-truth's aim of making cohabitation possible.
      *   **The Official Narrative (Tutsi victims/Hutu perpetrators):** The archive-truth model, focused on verifiable facts, *should* theoretically be vulnerable to capturing RPF crimes if evidence exists. Its failure in gacaca isn't predicted by the model itself but points to the **state as a party to the violence** (see point 4) manipulating the process for political ends. The model is silent on how state control distorts the "truth" it seeks.

  **3. Excluding the Planners: Breaking the Trade or Enabling It?**

  *   **Breaks the Archive-Truth Trade:** Fundamentally, yes. The core promise of amnesty-for-truth is uncovering the *systematic* nature of the violence – the plans, orders, structures. Gacaca structurally could not and did not achieve this. The "command structure" truth remained obscured, arguably protecting the RPF-dominated state. From an archive-truth perspective, gacaca failed at its highest-value task.
  *   **Enables the *Neighbour-Truth* Trade:** Crucially, however, excluding the planners *enabled* the local-level trade to function. If high-level RPF figures or powerful organisers had been subject to gacaca, the process likely would have collapsed due to political resistance, intimidation, or refusal to participate. By reserving them for other (often ineffectual or biased) processes, the state allowed the *local* machinery of neighbour-truth and reintegration to operate on a massive scale. The trade gacaca offered wasn't for structural truth; it was: "Confess *your* specific acts to *your* neighbours, show remorse, serve your reduced sentence locally, and we (the state) will facilitate your return to this community." The planners' exclusion was the political price paid for making the neighbour-truth process operational at all.

  **4. Where the Archive-Truth Theory is Silent**

  *   **Costs of Truth-Telling:** Utterly silent. It assumes truth is disclosed in a neutral, safe space. It doesn't model the risks to witnesses, survivors, or *even confessing perpetrators* from their own communities after hearings. Gacaca saw significant intimidation, violence, and re-traumatisation – costs borne locally, intimately, and unevenly, central to the "neighbour-truth" dynamic.
  *   **Pace vs. Quality Trade-off:** The theory assumes quality (verification) is paramount. It doesn't grapple with the brutal reality gacaca faced: prosecute a tiny fraction with high rigour (leaving hundreds of thousands in limbo, destabilising communities) or process the vast majority with lower rigour. Gacaca chose scale and speed, accepting lower individual case quality for broader communal processing – a trade-off inherent in neighbour-truth's local, immediate needs versus archive-truth's demand for precision.
  *   **State as Party to the Violence:** A fatal silence. The model assumes a "successor state" acting as a neutral principal seeking truth. When the state (like post-genocide Rwanda) is dominated by a party (RPF) that was *also* a perpetrator faction, its incentive is control, not impartial truth. It will shape the process (mandate exclusions, official narrative) to legitimise itself and criminalise opponents. Archive-truth is easily subverted in this scenario; neighbour-truth becomes a tool for state-sanctioned social engineering at the local level.
  *   **Improved Cohabitation?** The theory *hopes* truth leads to reconciliation but offers no mechanism specific to this. It can't predict *how* truth affects daily interactions. Neighbour-truth directly targets this but offers no guarantee (confessions could inflame tensions; community service could breed resentment). Research on gacaca's impact on cohabitation is profoundly mixed – some evidence of local reconciliation, much evidence of fear, silence, and superficial compliance. The theory is silent on measuring this complex, long-term outcome.

  **5. Running it Back: Gacaca vs. Amnesty-for-Truth & The Distinction**

  *   **Gacaca's Relationship to Amnesty-for-Truth:**
      *   **Contradiction/Anomaly?** In its pure form, yes. The lack of amnesty, the exclusion of planners, the local focus, and the primary goal of local reintegration/reconciliation fundamentally contradict the core mechanics and objectives of the classic model.
      *   **Confirms the Core Incentive Logic?** Partially. The use of *leniency* (a cousin of amnesty) as an incentive for *some level* of disclosure confirms that leverage is needed. But it swaps the currency and drastically alters the product being purchased.
      *   **Shows Amnesty Isn't Load-Bearing?** **Crucially, yes.** Gacaca demonstrates that formal amnesty is *not* the essential element. **Leniency conditional on public performance and reintegration within the community** proved sufficient to extract a vast quantity of *local, perpetrator-specific truth* for the purpose of managing cohabitation. The load-bearing element is the **structured return to the community with a known status**, not legal impunity. This strongly supports your critique.

  *   **Stress-Testing Archive-Truth / Neighbour-Truth:**
      *   **Doing Real Work?** **Yes, significantly.** It's not just relabelling. It captures fundamental differences in:
          *   **Objective:** National historical record vs. Local social management.
          *   **Currency:** Legal immunity vs. Conditional reintegration.
          *   **Value Determinant:** Verification & Archiving vs. Audience reception & Post-hearing community dynamics.
          *   **"Rivalness":** Archive-truth is non-rival (my knowing doesn't stop you knowing). Neighbour-truth *is* rival – its production costs are borne locally (social friction, risk), and its utility is intensely local and context-dependent (the same confession might heal one village and fracture another).
          *   **Process Design:** Centralised/professional vs. Decentralised/communal; Private/formal vs. Public/performative.
      *   **Falsification:** Your distinction would be significantly weakened or falsified if:
          1.  A process designed purely for archive-truth (centralised, amnesty-based, evidence-focused) demonstrably produced *better* outcomes for *local cohabitation* than a neighbour-truth process like gacaca in comparable contexts (evidence here is lacking; South Africa's TRC is often argued to have failed locally despite its archive).
          2.  Extracted "neighbour-truth" (localised confessions) in processes like gacaca proved to have *no measurable impact* (or a consistently *negative* impact) on the ability of communities to live together afterwards, undermining its claimed utility. (The mixed evidence on gacaca doesn't falsify it but highlights its contingency and the importance of other factors).
          3.  The "visible mark" and "shared script" elements (reduced sentence, community service, public confession) were shown to be *irrelevant* to reintegration compared to simple amnesty. (Evidence suggests these elements *were* psychologically and socially significant in Rwanda, even if problematic).
          4.  Perpetrators were demonstrably *indifferent* to the audience for their confessions, caring only about the legal consequence (amnesty/leniency). (Gacaca testimony and research suggest the local audience and the act of facing neighbours/survivors *was* a powerful, often harrowing, part of the dynamic).

  **Brutal Conclusion on the Framing:**

  The framing is **not confused; it's insightful and necessary.** It exposes a critical blind spot in orthodox transitional justice theory, which often treats "truth" as a monolithic good and under-theorises its local, social, and performative dimensions. Gacaca is the starkest possible illustration of why this distinction matters. It wasn't a flawed attempt at archive-truth; it was a different beast entirely, prioritising neighbour-truth and reintegration *despite* sacrificing comprehensive structural truth and sometimes procedural rigour.

  **However, the realities of gacaca also stress-test the *limits* of your distinction:**

  1.  **State Co-option:** Your neighbour-truth concept risks romanticisation. In Rwanda, it was ruthlessly instrumentalised by an illiberal state. The "shared script" became a *state-mandated* narrative, suppressing inconvenient truths (RPF crimes, Hutu victimhood). Neighbour-truth can be a tool of control as much as reconciliation.
  2.  **"Rival" Truth & Power:** The "rival" nature isn't just about cost; it's about power dynamics. Whose neighbour-truth counts? The perpetrator's confession might dominate the local narrative, silencing survivor accounts or alternative interpretations. The process can entrench local power imbalances.
  3.  **Cohabitation ≠ Justice/Equality:** Even "successful" neighbour-truth fostering cohabitation might mask profound injustice, inequality, and fear (e.g., survivors living alongside perpetrators in silence under a state-enforced "unity"). Is peaceful cohabitation built on suppressed truth or fear truly the goal?

  **In essence:** Your distinction brilliantly explains *why* gacaca looked nothing like a classic truth commission and why amnesty wasn't the point. It captures the vital, messy, local reality of post-atrocity life that the archive-truth model ignores. But gacaca also shows that neighbour-truth, divorced from broader accountability (especially for the state and elites) and genuine political openness, can become a mechanism for stabilising an unjust status quo rather than transforming it. The distinction is powerful, but the Rwandan case reminds us that *any* truth process operates within – and is shaped by – raw political power.
