  ### Decision Tree: What Makes an "a" an "a"?  
  A quiz for type designers and cognitive science grad students. Answer based on concrete glyph examples, not theory.  

  #### Core Questions (4 Independent Dimensions):  
  1. **Isolation vs. Context**: When a glyph is misread alone but recognized in a word, which identity is "real"?  
  2. **Cross-Font Similarity**: Can two glyphs from wildly different fonts (e.g., sans-serif vs. blackletter) both be "a"?  
  3. **Rule Compliance vs. Human Judgment**: If a glyph follows all formal rules but isn’t recognized by humans, is it still "a"?  
  4. **Descent vs. Instantiation**: Can a glyph drawn from scratch (no historical lineage) be "a"?  

  **Logical Space Allowed Combinations**:  
  - Isolation/Context and Rule/Human are independent (all combos possible).  
  - Cross-Font and Descent/Instantiation conflict if "no" to both (incoherent: rejects both style-independence *and* history).  
  - Unattractive: "Yes" to Cross-Font + "No" to Descent (denies history but accepts style variance).  
  - Unexplored: "No" to Isolation + "No" to Rule Compliance (prioritizes context but rejects human judgment).  

  ---

  #### The Decision Tree (8 Questions → 8 Leaves):  
  Start with **Question 1**:  
  > **Q1.** You see a glyph alone: it looks like a "u". But in the word "cat", it reads as "a". Which identity is real?  
  > - **A:** The "u" (alone defines it).  
  > - **B:** The "a" (context defines it).  

  **If A (Alone defines it)**:  
  > **Q2.** A glyph satisfies every formal rule for "a" but is read as "d" by all humans. Is it an "a"?  
  > - **A:** Yes (rules define it).  
  > - **B:** No (humans define it).  
  >  
  > **If A (Rules)**:  
  >> **Q3.** A designer draws a circle, calls it "a", and uses it in a font. It looks identical to their "o". Is it an "a"?  
  >> - **A:** Yes → **Leaf: Designer Intention/Convention**  
  >> - **B:** No → **Leaf: Geometric Invariant**  
  >  
  > **If B (Humans)**:  
  >> **Q4.** A blackletter "a" resembles a blackletter "o" more than a sans-serif "a". Are both blackletter and sans-serif glyphs "a"?  
  >> - **A:** Yes → **Leaf: Prototype**  
  >> - **B:** No → **Leaf: Exemplar**  

  **If B (Context defines it)**:  
  > **Q5.** A Cyrillic glyph is visually identical to a Latin "a" but represents a different sound. Are they the same letter?  
  > - **A:** Yes (shape transcends script) → **Go to Q6**  
  > - **B:** No (script defines it) → **Go to Q7**  
  >  
  > **If A (Yes)**:  
  >> **Q6.** Ink smudges on a page: an "a" becomes an "o". What *was* it originally?  
  >> - **A:** An "a" (history/role defines it) → **Leaf: Causal-Historical Descent**  
  >> - **B:** An "o" (perception defines it) → **Leaf: Perceptual/Motor Schema**  
  >  
  > **If B (No)**:  
  >> **Q7.** A logotype "a" is also a drawing of an apple. What is its primary identity?  
  >> - **A:** The letter "a" (system role defines it) → **Leaf: Structural Role (Contrasts)**  
  >> - **B:** The apple (no fixed essence) → **Leaf: Deflationary Cluster**  

  ---

  #### Leaves (8 Theories) & Implementation Feasibility:  
  1. **Geometric Invariant**  
     - *Awkward commitment*: A rule-compliant glyph humans call "gibberish" is still "a".  
     - **Code-check**: ✅ Measure shape primitives (e.g., enclosed counter, stroke angles).  
  2. **Prototype**  
     - *Awkward commitment*: A blackletter "a" may not be "a" if it deviates too far from the ideal sans-serif form.  
     - **Code-check**: ✅ Compare to an "average a" template (distance threshold).  
  3. **Exemplar**  
     - *Awkward commitment*: A glyph resembling many "a"s you’ve seen is "a", even if it breaks design rules.  
     - **Code-check**: ✅ Use k-NN against a database of labeled "a" glyphs.  
  4. **Structural Role (Contrasts)**  
     - *Awkward commitment*: A glyph is "a" only if it differs from "o" in its font, even if it looks like an apple.  
     - **Code-check**: ✅ Verify distinctiveness from adjacent glyphs in the same font (e.g., feature vectors).  
  5. **Perceptual/Motor Schema**  
     - *Awkward commitment*: A smudged "a" that reads as "o" *is* "o", regardless of its past.  
     - **Code-check**: ❌ Requires human judgment (perception is dynamic).  
  6. **Causal-Historical Descent**  
     - *Awkward commitment*: A perfectly drawn "a" from scratch isn’t "a" without lineage to historical forms.  
     - **Code-check**: ✅ Tag glyphs with derivation chains (e.g., Git-like history).  
  7. **Designer Intention/Convention**  
     - *Awkward commitment*: A circle is "a" if the designer says so, even if users call it "o".  
     - **Code-check**: ✅ Use predefined labels or creator metadata.  
  8. **Deflationary Cluster**  
     - *Awkward commitment*: A glyph from an unknown script is "a" only after you’re taught—no inherent essence.  
     - **Code-check**: ❌ No fixed criteria; relies on shifting context/convention.  

  ---

  #### Notes:  
  - **Inseparable Pairs**:  
    - *Prototype vs. Exemplar*: Hard to split via questions (Q4 tries via style tolerance).  
    - *Perceptual Schema vs. Deflationary*: Both prioritize context; Q5/Q7 separate via script/shape primacy.  
  - **Unoccupied Cells**:  
    - "No" to **Cross-Font** + "No" to **Descent** → Incoherent (denies both style *and* history).  
    - "Yes" to **Rule Compliance** + "No" to **Isolation** → Unexplored (prioritizes context but ignores humans).  
  - **In-Word Primacy**: Explicitly covered by all "B" branches (Q1 → Q5–Q7).  
  - **Implementation**:  
    - ✅ Code-ready: Geometric, Prototype, Exemplar, Structural, Descent, Intention.  
    - ❌ Human-dependent: Perceptual Schema, Deflationary.  

  Use this to map beta-testers' intuitions to implementable checks (e.g., for geometric/structural positions). Contextual ambiguity (in-word vs. isolation) is built into Q1 and Q5.
