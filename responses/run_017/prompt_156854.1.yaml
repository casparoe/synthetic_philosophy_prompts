  7. **Q7 (for 6A): ...** (as before, about ideal form or instances)

  But then in this branch, we have separated deflationary.

  Now we have 8 leaves:

  - Leaf1: Structural Role (from Q2A)
  - Leaf2: Perceptual/Motor Schema (from Q2B)
  - Leaf3: Causal-Historical (from Q4B, Q5B in the human branch, or Q6B)
  - Leaf4: Intention/Convention (from Q6A in the rules branch)
  - Leaf5: Geometric Invariant (from Q6B in the rules branch)
  - Leaf6: Prototype (from Q7A)
  - Leaf7: Exemplar (from Q7B)
  - Leaf8: Deflationary (from Q5B in the human branch)

  And the tree has 7 questions.

  Now, for the cases:

  - The Latin and Cyrillic 'a': 
     - In Geometric Invariant, they might be the same.
     - In others, they might be different (because of script context).

  - Double-story vs single-story: 
     - In Geometric Invariant, they might both be 'a' if they share the invariant properties.

  - Rogue output: 
     - Geometric Invariant says it is an 'a'.

  - Blackletter 'a' vs sans-serif 'a': 
     - In Deflationary, they are both 'a' by cluster.

  - Drawn from scratch vs historical chain:
     - Causal-Historical requires the chain.

  - Logotype 'a' that is also an apple: 
     - Intention/Convention might say it's primarily an 'a' by intention.

  - Smudged 'a' that is now 'o': 
     - Perceptual might say it's now 'o', while others might say it was an 'a'.

  - Glyph from an unknown script with transliteration: 
     - Intention/Convention might say it's the letter by convention once the table is provided.

  Now, most awkward commitments per leaf:

  1. **Structural Role**: A letter that looks nothing like any 'a' but is used in the system as the 'a' (and contrasts appropriately) is an 'a'.
  2. **Perceptual/Motor Schema**: If in a given context the perceptual process yields 'a', then it is an 'a', even if it breaks every design rule.
  3. **Causal-Historical**: A perfectly drawn 'a' from scratch without any historical connection is not an 'a'.
  4. **Intention/Convention**: A circle intended as an 'a' is an 'a', even if everyone reads it as 'o'.
  5. **Geometric Invariant**: A glyph that has the geometric properties of an 'a' but is universally misread is still an 'a'.
  6. **Prototype**: A very unusual 'a' (e.g., in a new style) might not be an 'a' if it is too far from the prototype.
  7. **Exemplar**: A glyph that resembles many existing 'a's is an 'a', even if it breaks the geometric rules.
  8. **Deflationary**: There is no fact of the matter about whether a borderline case is an 'a' or not.

  Now, flag inseparable pairs:

  - **Prototype and Exemplar** might be hard to separate because the questions rely on self-report about mental processes (ideal form vs. instances). Some people might not know.

  - **Geometric Invariant and Prototype** might give the same answers to many questions, but we separate them by the intention question (in the rules branch, we have a question about intention vs. shape).

  - **Perceptual/Motor Schema and Structural Role** are separated by the context question (Q2).

  Now, for each leaf, whether it can be implemented in code:

  1. **Structural Role**: Yes. Check that in the font, the glyph is distinct from its neighbors (e.g., by measuring distances in feature space). But it requires the whole font.

  2. **Perceptual/Motor Schema**: Partially. We could use a machine learning model trained on human responses, but it's not perfect. So it bottoms out in "ask a human".

  3. **Causal-Historical**: In code, we would need to trace the history of the glyph, which might be implemented by a checksum of the derivation chain? But in a generative system, if you have a chain of transformations, you can tag the output with the history. So yes, by design.

  4. **Intention/Convention**: In code, we could have a tag from the designer or use a predefined set of conventions. So yes, by having a manual label or using a database of conventions.

  5. **Geometric Invariant**: Yes. Define a set of geometric features (e.g., enclosed counter, open at top, etc.) and check for them.

  6. **Prototype**: Yes, if we have a defined prototype (e.g., an average of many 'a's). Then we can measure distance to the prototype.

  7. **Exemplar**: Yes, if we have a database of exemplars, we can use k-NN to check similarity.

  8. **Deflationary**: No, because there is no decisive criterion. We would need a human to judge.

  Therefore, for the acceptance test module, the theories that can be implemented in code are:

  - Structural Role
  - Causal-Historical (if the generator outputs a derivation chain)
  - Intention/Convention (if we have a predefined intention)
  - Geometric Invariant
  - Prototype
  - Exemplar

  The ones that require a human are:

  - Perceptual/Motor Schema (though we could approximate with a classifier)
  - Deflationary (which is not really implementable as a check)

  So the module could offer options for the user to choose which theory to use for the acceptance test.

  Given the requirement for the in-word context being primary, that is covered by Structural Role and Perceptual/Motor Schema. For the latter, we'd need human-in-the-loop or a good classifier.

