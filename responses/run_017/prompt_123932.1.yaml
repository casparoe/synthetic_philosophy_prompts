prompt: |-
  I'm trying to work out what I actually believe about Pascal's mugging, and I'd rather start from my own reactions to individual cases than from a theory. Below are my verdicts. What I want back is a principle: stated precisely, with each clause traced to the case that motivates it. If no single principle fits them all, then give me the two or three best candidates, say which of my verdicts each one forces me to give up, and tell me which candidate you'd adopt and why. Please answer in British English, and please don't cite papers or hand me a reading list; I want the principle in your own terms.

  Stipulations. In every case the sum requested is £5, the numbers of lives are finite, and I'm assuming that a life has some fixed finite value and that I'm otherwise happy to reason in expected-value terms. Unless I say otherwise, I have no way of checking the claim and no evidence about the claimant beyond what he says.

  1. A long-established, independently audited charity that averts roughly one death per £3,000 of donations. I give the £5, and I'd defend it in expected-value terms.

  2. A stranger on a bench tells me he will torture 10^30 people in another dimension unless I give him £5. I give nothing, and I don't really deliberate.

  3. The same stranger, same manner, but the number is 10^6. I still give nothing — but the striking thing, which is the reason I'm writing this, is that I feel *less* inclined to pay in case 2 than in case 3. Since I said in case 1 that I scale linearly in the stakes, this is backwards. Either my probability that he's telling the truth is falling faster than 1/N in the number N of lives he names, or I'm not scaling linearly after all, or I'm just confused.

  4. A claimant whose power is not in question: this is a world in which a particular being has been publicly and reliably observed, over decades, to do exactly this kind of thing, and the only open question is whether today's threat is genuine. I pay the £5 at once, and I'd mortgage the house if that's what it took. So my refusal in case 2 is not discomfort with enormous numbers as such.

  5. The benefactor rather than the mugger: a stranger offers to create 10^30 flourishing lives if I give him £5, and will simply do nothing otherwise. I don't pay. But I'm noticeably *more* comfortable refusing here than in case 2, and I can't say why; if my objection in case 2 is about tiny probabilities of vast stakes, it should apply identically here, and if it's about being exploited, the threat in case 2 seems the more repeatable of the two, not the less.

  6. A crowd: a thousand people in the same park each make a 10^30-lives claim, and their claims are mutually inconsistent, so at most one is true. I pay none of them, although the sum of the expected values is astronomical. At the same time, I support public spending on mitigating existential risks, where the case rests on a disjunction of speculative scenarios, no single one of which I'd put much above one percent. I think these two attitudes are structurally the same and I can't see a difference that isn't ad hoc.

  7. The escalation: if I paid in case 2, I should expect a claimant citing 10^40 lives tomorrow. I take this as a reason in itself for a standing policy of never paying such claims — but I'm uneasy, because it looks like a reason for ignoring evidence rather than weighing it, and in case 4 I was happy to act on a great deal of evidence.

  8. The asymmetry I can't get rid of: I'll pay real money to reduce a one-in-a-million chance of human extinction, where the one-in-a-million comes from a model with some track record. I won't pay for a one-in-a-million chance at an astronomical good, and I won't pay in case 2 to avert an astronomical bad. So I seem to be discriminating on the *source* of the probability rather than its size — and case 6 suggests that the sources I trust are themselves disjunctions of speculative scenarios.

  Here is the principle I've been toying with, and which I suspect is broken. Call it the leverage discount: for any claim that N lives hang on my small act, I should discount the stakes by something like 1/N (or faster), on the ground that the space of conceivable setups in which vast stakes hang on my £5 is dominated by setups in which my act is not the real lever — I'm a simulation being run to see what I'd do, a duplicate, a decoy, a test subject, one of countless copies — and the larger N is claimed to be, the more overwhelmingly the decoy setups outnumber the real ones. Apply this discount to any claimant whose power hasn't been independently established, and case 2 and case 3 come out as refusals, while case 4, where the power is established, is untouched, and case 1, where N is small, is barely touched.

  What I'd like from you: does that principle survive my own cases, or does it over-generate — does it, for instance, quietly tell me to stop funding existential risk mitigation in case 6, or to stop reducing the one-in-a-million risk in case 8? Repair it if you can, and if you can't, say so and put something better in its place. Set it against the obvious rivals as you see them: a ceiling on how much value any outcome can have, a cutoff below which probabilities are treated as zero, a restriction of my concern to outcomes I could in principle learn about, and anything else you think is a serious candidate. Tell me which of my verdicts no candidate can save, and which you'd overturn.

  And tell me what your preferred principle says about three cases I haven't listed. First: a claimant who promises that, whether or not I pay, he will publicly and conclusively demonstrate his power tomorrow. Second: a claimant in a world where I already have strong evidence that I am one of 10^30 copies of myself facing this identical choice, so that my £5 either changes nothing or changes everything 10^30 times over. Third: a claimant who asks for no money at all, only that I talk myself into believing his claim, and says the lives are spared if I succeed.
reasoning: |-
  Hmm, the user is grappling with Pascal's Mugging scenarios and wants me to extract principles from their specific judgments about various cases. They've provided detailed reactions to eight thought experiments and want me to: 1) derive precise principles from these reactions, 2) test their "leverage discount" hypothesis against these cases, 3) compare it to alternative solutions, and 4) apply it to new scenarios. 

  Looking at their verdicts, several key patterns emerge. In Case 1 (established charity), they pay because of reliability. Case 2 and 3 show refusal to pay strangers making huge claims, with the interesting twist that they feel less inclined to pay for the larger threat. Case 4 confirms they'll pay enormous sums when the power is verified. Case 5 reveals an asymmetry - they're more comfortable refusing a huge benefit than preventing a huge harm. Case 6 shows they won't pay multiple inconsistent claimants despite high aggregated EV, but support existential risk mitigation. Case 7 worries about incentive effects. Case 8 highlights they'll pay for low-probability extinction risks from credible models but not for speculative astronomical goods.

  Their proposed leverage discount principle (discounting stakes by 1/N for unverified claims) explains some reactions but has problems. It would overreach by making existential risk mitigation unjustifiable (Case 6/8) since those also involve huge stakes from speculative scenarios. The principle needs refinement to distinguish between different types of "conceivable setups."

  I think we need two complementary principles here. The first is the Evidence Quality Principle, which requires that the probability estimate must derive from a credible causal model with demonstrated predictive power. This explains why they pay in Case 1 (established charity model) and Case 4 (verified power) but refuse Cases 2-3 (no model). It also justifies Case 8's asymmetry - extinction risks use models with track records while muggers don't.

  The second is the Leverage Constraint Principle, which states that when stakes become astronomical, we require correspondingly stronger evidence that our specific action is the actual leverage point. This explains their discomfort in Cases 2, 3 and 5 - huge stakes trigger suspicion about whether paying actually affects the outcome. It also resolves Case 6's puzzle: existential risk mitigation focuses on actions that demonstrably affect the probability distribution, unlike paying random muggers.

  For their new scenarios: the demonstration case fails both principles initially (no current model or leverage proof), the copy world case satisfies leverage constraint but needs evidence quality, and the belief demand case violates leverage constraint (action doesn't demonstrate real causal power).

  The alternatives they mention don't work as well. Probability cutoffs arbitrarily ignore small risks, value ceilings contradict Case 4, and concern restrictions conflict with existential risk spending. The evidence-based approach best preserves their intuitive judgments while avoiding Pascalian recklessness.
answer: |-
  Right, let's build this from your reactions. Your cases reveal a consistent pattern that rejects simple expected value when vast, unverified stakes are involved, but accepts it when stakes are modest or evidence is robust. Here's the principle that best fits your verdicts, clause by clause:

  ### The Evidence-Quality Leverage Principle
  **For any claim that an outcome of value \( V \) depends specifically on my action \( A \), I assign an expected value to \( A \) only if:  
  (a) The probability \( p \) of \( V \) being realised *given \( A \)* is derived from a causal model with demonstrated predictive power in relevantly similar domains; *and*  
  (b) The evidence establishes that \( A \) is plausibly the *actual leverage point* for \( V \), not merely correlated with it.  
  Otherwise, I treat \( p \) as effectively zero, regardless of the claimed \( V \).**

  ### How Each Clause Maps to Your Cases
  1.  **Clause (a) justifies paying the charity:** The charity's model (donations → interventions → lives saved) has a track record verified by audits. Predictive power is established.  
      *Case Supported:* 1.

  2.  **Violates (a) & (b):** No causal model links £5 to dimension-hopping torture with predictive power. No evidence your £5 is the leverage point (could be simulation/decoy). \( p \) treated as zero.  
      *Case Supported:* 2 (refusal).

  3.  **Same violation as 2:** The *number* of lives (10^6 vs 10^30) doesn't fix the lack of model or leverage evidence. Your greater discomfort with larger N is an *emotional heuristic* reflecting intuitive distrust of claims scaling stakes without scaling evidence – it flags the violation but isn't the core reason.  
      *Case Supported:* 3 (refusal, and explains the feeling).

  4.  **Satisfies (a) & (b):** Decades of reliable observation *are* the demonstrated predictive power for the causal model (claimant's threat → outcome). Power is established, making your payment the leverage point.  
      *Case Supported:* 4 (pay).

  5.  **Violates (a) & (b) identically to 2:** Identical lack of model/leverage evidence for astronomical good as for bad. Your greater comfort refusing the *benefactor* stems from loss aversion and exploitation concerns (paying a threat feels extortionate; refusing a dubious benefit feels less costly). The principle treats them identically (refusal) based on evidence, matching your action but not the *feeling* (which is psychological, not evidential).  
      *Case Supported:* 5 (refusal).

  6.  **Violates (a):** The crowd offers disjointed claims with *no* established causal model linking £5 payments to their specific vast outcomes. Existential risk mitigation differs: it uses models (e.g., climate science, asteroid tracking) with *some* predictive track record for *classes* of events, and targets *systemic* leverage points (research, monitoring) not individual payments to random claimants. The scenarios aren't structurally identical – mitigation relies on aggregated evidence from validated models; the crowd relies on unverified assertions.  
      *Case Supported:* 6 (refusal for crowd, support for x-risk).

  7.  **Escalation reinforces Clause (a):** Paying case 2 would signal acceptance of claims *without* evidence of model/power, inviting more such claims. Your unease is resolved: Clause (a) *is* about weighing evidence – refusing claims lacking model evidence *is* weighing it (as zero). Case 4 has abundant evidence, so paying is justified.  
      *Case Supported:* 7 (refusal policy justified).

  8.  **Clause (a) explains the asymmetry:** The 1-in-a-million extinction risk uses a model (e.g., asteroid impact probability) with *some* track record (e.g., in orbital mechanics). The mugger's 1-in-a-million chance has *no* model. You trust probabilities sourced from validated frameworks, not plucked from thin air, regardless of stake size.  
      *Case Supported:* 8 (pay for modelled x-risk, refuse unmodelled mugger).

  ### Why Your Leverage Discount Fails (and How This Fixes It)
  Your leverage discount (1/N discount for unverified claims) *approximates* Clause (b) but overreaches:
  *   **It over-generates against x-risk (Case 6/8):** Mitigating extinction risks involves astronomical stakes (N huge). Your discount would force refusal, contradicting your verdict. The Evidence-Quality Principle avoids this: validated models provide the necessary evidence quality, preventing the discount.
  *   **It's too blunt:** It assumes probability *must* fall faster than 1/N. Clause (a) is stricter: without a model, \( p \) isn't just low, it's *undefined/unassignable* – treated as zero. Case 4 shows N doesn't matter *if* the evidence is there.

  ### Alternatives Rejected (and Why)
  1.  **Value Ceiling:** (Capping max V). Contradicts Case 4 (you'd pay vast sums for vast *verified* stakes).
  2.  **Probability Cutoff:** (Treat tiny p as zero). Fails Case 8 (you accept tiny p from models for x-risk). Also fails Case 4 (tiny p could be assigned to "Is he lying today?" but you pay).
  3.  **Concern Restriction:** (Only care about knowable outcomes). Contradicts support for x-risk mitigation (outcomes are inherently unobservable if they occur).
  4.  **Simple Leverage Discount:** As above, kills x-risk spending.

  ### Applying the Principle to Your New Cases
  1.  **"Proof Tomorrow" Claimant:** **Refuse.** *Why:* Clause (a) fails *now*. No current model/power evidence makes current \( p \) unassignable (effectively zero). His promise of future proof doesn't change the leverage or model for *today's* action. Paying would violate the principle and invite escalation (Case 7).
  2.  **World of Copies:** **Pay £5.** *Why:* Strong evidence satisfies Clause (b): you *know* you are in a setup where your act is either genuine leverage (multiplied) or irrelevant. The expected value calculation becomes valid: \( p(\text{you're real}) \times 10^{30}V \) vs cost, and \( p(\text{you're real}) = 1 / 10^{30} \) makes EV = \( V \) minus cost. If V (value of one life) > £5, paying has positive EV. Evidence clarifies the leverage structure.
  3.  **Belief Demand:** **Refuse.** *Why:* Clause (b) is violated. "Talking yourself into belief" isn't plausibly the leverage point for sparing lives. There's no credible causal model linking your internal cognitive state to his actions in another dimension. Clause (a) also fails (no model). The demand itself undermines credibility – it's untestable and non-falsifiable.

  ### Verdicts Overturned (and Why)
  *   **Your feeling in Case 5:** The principle treats benefactor and mugger identically (refusal). Your greater comfort refusing the benefactor isn't justified evidentially; it's psychological (loss aversion, distaste for extortion). The principle suggests this feeling shouldn't *drive* the decision, only the evidence should.
  *   **The emotional response in Case 3:** Feeling *less* inclined to pay for 10^30 than 10^6 lives is flagged as irrational by the principle. If both lack evidence (Clauses a & b), both get \( p=0 \). The number shouldn't affect the *decision*, only the *alarm* it triggers.

  ### My Preferred Principle & Why
  I advocate the **Evidence-Quality Leverage Principle**. It best captures your core insistence on credible models and demonstrable leverage, explaining:
  *   Paying for charities and verified threats (evidence present).
  *   Refusing unverified muggers/benefactors/crowds (evidence absent).
  *   Supporting x-risk mitigation (evidence from validated models present).
  *   The Case 8 asymmetry (source matters, not just probability size).
  It avoids Pascalian recklessness without arbitrary caps, cutoffs, or over-broad discounts. It treats your £5 as significant *only* when the causal chain justifying its significance is illuminated by evidence, not just by grandiose claims. That’s the thread stitching your reactions together.
