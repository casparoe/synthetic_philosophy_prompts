answer: |-
  ### Virtual Ontology Sorting Instrument  
  **Instructions:** Answer each scenario based on your immediate reaction. Choose *one* option per question. Be honest—no overthinking.  

  ---

  #### **Question 1: Castle Destruction**  
  *A player spends 400 hours building a castle. Another player flattens it.*  
  - **A)** Real harm: The work, time, and emotional investment are tangible losses.  
  - **B)** Not real harm: It’s just data; backups or recreation can restore it.  
  - **C)** Harm stems from distress, but the castle isn’t "real."  

  #### **Question 2: Server Shutdown**  
  *An item exists only while servers run. Servers shut down next month.*  
  - **A)** Real now: It functions and affects players until termination.  
  - **B)** Never real: Ephemeral by design, like a dream.  
  - **C)** Real as a social artifact until deletion.  

  #### **Question 3: Unseen Procedural Object**  
  *A procedural generator creates an object in an unvisited, unlogged region.*  
  - **A)** Real: Code materially instantiated it.  
  - **B)** Not real: Unobserved = nonexistent.  
  - **C)** Potentially real, but not actualized without interaction.  

  #### **Question 4: Duplicated "Unique" Sword**  
  *After a glitch, two players each hold an identical "unique" sword.*  
  - **A)** One is real (the original); the other is a glitched copy.  
  - **B)** Both are equally real (or equally unreal).  
  - **C)** Neither is "the" sword; uniqueness was broken.  

  #### **Question 5: VR Haptic Pain**  
  *Turning up haptic pain settings in VR causes intense discomfort.*  
  - **A)** Real pain: Neural/emotional harm occurs.  
  - **B)** Simulated pain: No tissue damage; it’s illusory.  
  - **C)** Real as subjective experience, but ontologically distinct.  

  #### **Question 6: Singleplayer Build**  
  *A player builds something in singleplayer mode no one else sees.*  
  - **A)** Real: It occupies storage and reflects labor.  
  - **B)** Not real: Lacks social or persistent validation.  
  - **C)** Real only to the builder as personal artifact.  

  #### **Question 7: Deletion Permitted by Terms**  
  *A build a player deeply cares about is deleted under the company’s ToS.*  
  - **A)** Real loss: ToS don’t negate emotional/sweat equity.  
  - **B)** Not a loss: Consent to ephemerality was given.  
  - **C)** Loss is real, but the object’s status was always conditional.  

  #### **Question 8: Reflex Divergence (Real-Money Theft)**  
  *A player buys an item with real money; a hacker steals it.*  
  - **A)** Real theft: Financial harm + digital property violation.  
  - **B)** Not real theft: Virtual items aren’t property; fraud is the only crime.  
  - **C)** Theft of *value* (money), not the item itself.  

  ---

  ### Scoring Key & Position Mapping  
  **How it works:**  
  - Tally your answers. Positions are defined by *answer patterns*, not labels.  
  - Some positions overlap; others are mutually exclusive.  
  - **Incoherent/unclaimed patterns** marked below.  

  #### **Positions & Their Patterns**  
  1. **Harm-Centric** (`HARM`):  
     - **Answers:** 1C, 5A, 7A, 8A  
     - **Logic:** Only human suffering matters. Virtual objects are tools for harm/benefit.  
     - **Divergence:** In Q8, reflex (A) overrides object-focused answers (e.g., 2B, 4B).  

  2. **Functionalist/Digital Realism** (`FUNC`):  
     - **Answers:** 1A, 2A, 3A, 4B, 6A, 7C  
     - **Logic:** "Real" iff backed by code/server state. Persistence and function define existence.  
     - **Flags:** Q4B (both swords real) + Q7C (deletion changes state).  

  3. **Social-Institutional Artifact** (`ART`):  
     - **Answers:** 1A, 2C, 4C, 6C, 7A, 8C  
     - **Logic:** Objects are real as social constructs or institutional facts (like money or laws).  
     - **Divergence:** Q8C separates from `FUNC` (A) and `HARM` (A).  

  4. **Irrealism/Fictionalism** (`FICT`):  
     - **Answers:** 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B  
     - **Logic:** All virtual content is make-believe; "real" is category error. Harm is psychological only.  

  5. **Pretense/Make-Believe** (`PRET`):  
     - **Answers:** 1C, 2C, 3C, 4A, 5C, 6C, 7C, 8C  
     - **Logic:** Objects "exist" as props in collective imagination. Q4A (original sword) reveals pretense of uniqueness.  

  6. **Selective Realism** (`SELECT`):  
     - **Answers:** 1A, 2A, 3B, 4A, 5A, 6B, 7A, 8A  
     - **Logic:** Reality depends on context (e.g., company-backed = real; procedural/unobserved = not).  
     - **Divergence:** Q3B (unseen = unreal) vs. Q2A (server-backed = real).  

  ---

  ### Key Distinctions & Incoherencies  
  - **`FUNC` vs. `ART`:** Separated by Q4 (B vs. C) and Q8 (A vs. C). `FUNC` cares about system state; `ART` cares about social role.  
  - **`HARM` vs. `SELECT`:** Both may pick 1A/7A/8A, but `HARM` *only* cares about harm (1C/5A), while `SELECT` cares about object types (3B/6B).  
  - **`FICT` vs. `PRET`:** `FICT` denies *all* reality (B-heavy); `PRET` treats objects as "real in context" (C-heavy).  
  - **Unclaimed/Incoherent Patterns:**  
    - **Q1A + Q2B:** Claims work is real but server-backed items aren’t. (Inconsistent labor ontology.)  
    - **Q5A + Q6B:** Asserts VR pain is real but private builds aren’t. (Reality can’t hinge on publicity *and* subjectivity.)  
  - **Indistinguishable Pairs:**  
    - **`FUNC` and Digital Realism:** Both share the same pattern. (Quiz can’t split code-function vs. object-realism.)  
    - **`HARM` and `ART` in Q7/Q8:** Both may pick A/C, but `HARM` ignores objects.  

  ---

  ### How to Use This  
  - **Team Tally:** Share answer distributions. Where do most cluster? Where do outliers diverge?  
  - **Break Deadlocks:** Focus on patterns, not labels. "You said procedural objects are unreal (Q3B), but company-backed items are real (Q2A)—that’s selective realism."  
  - **Why It Works:** Forces engagement with *consequences* (harm, deletion, theft) not abstraction. Reflex-vs-pattern (Q8) exposes inconsistencies.
