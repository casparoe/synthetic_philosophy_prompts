  ### Addressing Your Doubts
  1. **Rule using probabilities independent of the act (e.g., CDT) and the 70%**:  
     - CDT *can* legitimately use the 70% because it ignores the correlation between act and state. CDT uses \(P(\text{state})\) unconditional on the act (here, \(P(H_D) = 0.7\)).  
