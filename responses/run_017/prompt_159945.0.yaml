  - **Comparison**: Flee if \(0.7 U_A - c > 0.3 U_D\). Since \(U_D > U_A\) slightly and \(c\) is small, \(0.7 U_A - c\) almost certainly > \(0.3 U_D\) (e.g., if \(U_D \approx U_A\), then \(0.7U_A > 0.3U_D\)).  
  - **Verdict**: Flee.

