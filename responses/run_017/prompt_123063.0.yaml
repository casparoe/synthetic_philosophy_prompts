prompt: |-
  Hi — I'm on the Clinical Analytics Review Committee at my hospital system. We meet Thursday and I've got to circulate a short decision memo beforehand, and I'd really like a draft to work from.

  The case: our sepsis early-warning vendor, Corvid Health, wants us to upgrade from the model we've run for two years to their new "Corvid Universal." The pitch is a benchmark suite: 11,000 synthetic prediction tasks generated from what they call a uniform random prior over data-generating processes, and they report that Universal beats both our current model and a panel of standard learners on average across the whole suite. The deck concludes that this is domain-general evidence and that site-specific validation is therefore optional.

  One of our members, a retired philosopher who sits on the committee, sent around a one-pager saying basically the opposite. Two claims in it. First, that by the no-free-lunch results, averaged over all possible problems every algorithm does exactly as well as every other one, so Universal's suite average can't be evidence of anything unless the suite was built to resemble wards like ours — and a uniform random prior over data-generating processes is definately not that. Second, that even setting that aside, no amount of past performance at other hospitals could ever justify expecting performance here, since the only argument for it is "it has worked before," which is circular. He wants us to reject outright and let the contract lapse in March.

  I think he's right about something and wrong about something, and I want the memo to say which. Concretely: recommend approve, reject, or approve-with-conditions-and-a-hard-gate, with a timeline, and reasons the vendor could actually respond to in writing.

  Things I want handled:

  - The uniform-prior suite. My read is that it's a prior dressed up as a proof: doing well on it shows the model's biases match whoever built the generator. But I don't know what we should be asking the vendor for instead. One idea floating around is to make them name the fifty tasks in the suite most similar to our ICUs and report performance only on those — that feels like a trap, since they pick the fifty and would pick flattering ones, but maybe there's a version of it that works.
  - Ranking versus calibration. Whatever we adopt fires a fixed threshold that triggers an antibiotics protocol, so what matters is whether the probabilities are right in our population, not whether the model orders patients well, and I don't think the vendor's numbers speak to that at all.
  - The feedback problem. Once the score is displayed, nurses act on it, which changes which patients get labelled septic, so the data we'd collect during a pilot can't straightforwardly tell us how the model would behave once it's actually live. I want the memo to be honest about what a pilot could and could not establish.
  - Give the losing side its best day in court. If we go with conditions, the strongest objection isn't the circularity one, it's that clinicians will anchor on a number they don't understand and that a "pilot" becomes a deployment by inertia.

  Keep it under ~700 words, written for the committee — a CMO, two docs, a nurse manager, our data scientist, and the philosopher — with the recommendation up top. And please don't cite anything or point us at papers; we can't chase references and wouldn't know what to do with them anyway. Just the argument.
reasoning: |-
  Okay, the user is part of a Clinical Analytics Review Committee and needs a draft decision memo about upgrading their sepsis early-warning system. They're dealing with a vendor pushing a new model based on a benchmark suite, while a philosopher member raises theoretical objections. 

  The user wants a balanced recommendation that addresses several key issues: the questionable value of the vendor's uniform-prior benchmark suite, the importance of calibration over ranking for their clinical use case, feedback loops affecting pilot data, and the risk of clinical anchoring. 

  Hmm... the core tension here is between theoretical validity (the philosopher's NFL concerns) and practical implementation needs. The vendor's benchmark approach feels like statistical theater - impressive-sounding but clinically meaningless. That uniform prior is particularly problematic; as the philosopher correctly notes, it guarantees nothing about real-world performance. 

  For the recommendation, rejecting outright seems too harsh since the current model might need replacing, but approving unconditionally would be reckless. The conditional approval path makes most sense - force the vendor to prove relevance to their specific context. 

  Important nuances to weave in: 
  - The antibiotics protocol means calibration is non-negotiable (vendor's AUC metrics are irrelevant)
  - Pilot design must account for the Hawthorne effect on nurse behavior
  - Any pilot needs predefined failure criteria to prevent inertia-based deployment

  The philosopher's circularity argument is technically correct but practically incomplete - we do use past performance as evidence all the time (that's why we do clinical trials). The stronger objection is clinical anchoring, which could harm patient care if the scores are misleading. 

  For the benchmark suite alternative, requesting "most similar" tasks is indeed a trap. Better to demand: 1) the generator's actual distribution parameters, 2) similarity metrics to their ICU data, 3) calibration diagnostics. Make them show their homework rather than cherry-pick. 

  Word count is tight - need to keep explanations concrete and clinical. No jargon, just straight talk about what matters: will this keep our specific patients from dying of sepsis?
answer: |-
  ## MEMO: Corvid Universal Upgrade Recommendation  
  **To:** Clinical Analytics Review Committee  
  **From:** [Your Name/Title]  
  **Date:** [Date]  
  **Subject:** Recommendation on Corvid Universal Upgrade Proposal  

  **Recommendation:** **Approve Proceeding to a Limited Pilot with Strict Success Criteria** (Conditional Approval with Hard Gate). Do not commit to full deployment or contract renewal. Vendor must fund & execute a 90-day pilot on 2 designated ICU wards by January 15th, meeting defined performance thresholds on our local data. Failure triggers automatic rejection at March contract expiry.  

  ### Rationale  
  The vendor's benchmark suite and the philosophical objections both highlight critical limitations, but neither provides sufficient grounds for immediate rejection *or* unconditional approval. Our decision must centre on evidence relevant to *our patients and workflows*.  

  1.  **The Benchmark Suite ("Uniform Prior") is Not Domain-General Evidence:**  
      *   The philosopher is correct: No-Free-Lunch theorems mean exceptional average performance on an *arbitrary* set of problems (especially one generated from a uniform prior) does not predict performance on *our specific problem*. It demonstrates Corvid Universal is highly flexible and well-tuned *for the types of patterns their generator creates*, not necessarily for the complex, non-random realities of our patient population and data systems.  
      *   **Vendor Response Required:** We reject the claim that site-specific validation is "optional." Instead of reporting performance on "similar" tasks (which they could cherry-pick), demand they:  
          *   Disclose the *specific parameters and distributions* used in their generator.  
          *   Provide evidence showing how this generator's output statistically resembles *our* historical ICU data (e.g., feature distributions, temporal patterns, prevalence shifts).  
          *   Report Universal's performance *disaggregated* by identifiable sub-types within their suite that might map to our sub-populations (e.g., specific comorbidities, infection sources).

  2.  **Calibration is Paramount, Not Just Ranking:**  
      *   The vendor's reported metrics (likely AUC, accuracy averages) focus on ranking patients. However, our protocol uses a *fixed probability threshold* to trigger antibiotics. **Crucially, we need well-calibrated probabilities.** A model can rank perfectly but systematically over/under-predict risk, leading to missed sepsis or dangerous overtreatment.  
      *   **Vendor Response & Pilot Focus:** The pilot must rigorously assess calibration on *our live data* using metrics like Expected Calibration Error (ECE) and reliability diagrams, specifically around the critical decision threshold. Vendor benchmark results on calibration are irrelevant unless proven to mirror our context.

  3.  **The Pilot: Purpose, Limits, and Design:**  
      *   **Purpose:** The *only* goal is to estimate how well Corvid Universal **calibrates risk** and **discriminates cases** (AUC) **specifically within our pilot wards under near-live conditions**, *before* full protocol integration changes behavior. It is **not** a test of clinical impact or workflow integration.  
      *   **The Feedback Problem (Acknowledged):** Yes, displaying scores *will* influence nurse assessments and documentation. Therefore:  
          *   **Pilot Design:** Run Corvid Universal **in parallel** with our current model (silently for Universal). Compare predictions against *prospective, adjudicated gold-standard labels* (e.g., by a blinded review team using Sepsis-3 criteria on all pilot patients), NOT just against documented sepsis codes influenced by the alert.  
          *   **Limit:** This pilot *cannot* predict the model's performance once its scores actively drive the protocol and alter clinician behavior. It assesses the model's *inherent capability on our data* before feedback loops dominate. Success here is a necessary, but not sufficient, condition for deployment. Deployment would require a separate, phased implementation study.

  4.  **Addressing Key Objections:**  
      *   **"Circularity" (Past Performance Elsewhere):** While past performance *at other sites* isn't conclusive for us, it *is* Bayesian evidence – it updates our prior belief about the model's general capability. Combined with strong evidence *from our pilot site*, it can support a decision. The pilot provides the crucial site-specific evidence.  
      *   **"Clinical Anchoring & Deployment by Inertia" (Strongest Objection):** This is a vital risk. **Mitigation:**  
          *   **Predefined, Quantitative Success Criteria:** Set *strict, non-negotiable thresholds* for calibration (e.g., ECE < 0.03 at the threshold) and discrimination (AUC > [Current Model + Delta]) on the pilot's adjudicated outcomes.  
          *   **Hard Gate:** Explicitly state that failure to meet *all* criteria by the pilot end date results in automatic rejection and contract lapse. No "soft failures" or re-tests.  
          *   **Clinician Education:** Mandate Corvid provide tailored training emphasizing the model's probabilistic nature and limitations *before any potential future deployment*, regardless of pilot outcome.

  ### Vendor Requirements & Timeline
  1.  **Immediately:** Provide requested details on benchmark generator parameters and similarity to our data (Point 1b).
  2.  **By [Date - e.g., 1 week]:** Agree in writing to fund & execute a 90-day pilot starting no later than January 15th on 2 specified ICU wards, using parallel running and adjudicated outcomes.
  3.  **Pilot Period (90 days):** Provide weekly performance dashboards (calibration focus).
  4.  **Pilot End + 1 Week:** Final report against pre-agreed success criteria.
  5.  **Failure on any requirement or success criteria:** Process terminates, contract lapses March 31st.
  6.  **Success:** Triggers discussion on *separate*, cautious deployment plan with ongoing monitoring.

  This approach balances due diligence with progress. It rejects unfounded claims of generalizability, focuses on the critical metric (calibration), acknowledges pilot limitations, mitigates inertia risks with hard gates, and provides actionable evidence specific to our hospital. The onus is squarely on the vendor to prove relevance here.  

  **Recommendation:** Approve Conditional Pilot as outlined.
