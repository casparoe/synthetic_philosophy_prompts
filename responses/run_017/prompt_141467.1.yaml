  To Whom It May Concern (Conventionally Designated),  

  We enclose the Last Will and Testament drafted for the causal sequence historically labelled "Charles Windham". This instrument has been prepared with due regard to the metaphysical difficulties inherent in testamentary instruments, as acknowledged under the Conventional Designation (Legal Efficacy) Act 2023.  

  The Act requires us to affirm that all references within this document to a "testator", "person", "I", "me", "my", "he", "him", or similar terms, are strictly conventional designations employed solely for legal efficacy under S. 2(1)(c) of the Act. They denote nothing more than the temporary, dependently-arisen aggregation of the Five Aggregates (Form, Feeling, Perception, Mental Formations, Consciousness) operating within a specific causal continuum observable at the time of instruction and execution.  

  We advise beneficiaries, executors, and the Probate Registry that this document operates entirely within the realm of conventional truth (sammuti sacca) as mandated for legal validity. Any perceived ontological commitments within its clauses to a permanent, unitary self (attā) are linguistic artefacts necessitated by statute and do not reflect an ultimate reality (paramattha sacca).  

  We trust this instrument will facilitate the lawful and compassionate redirection of conditioned phenomena currently associated with the designated causal stream.  

  Yours conventionally,  
  **Algernon Pragma**  
  Senior Partner  

