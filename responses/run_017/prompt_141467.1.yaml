  **LAST WILL AND TESTAMENT**

  **I. IDENTIFICATION & REVOCATION**  
  1.  **Conventional Designation:** This instrument pertains to the causally connected sequence of mental and physical phenomena conventionally, and for the purposes of legal administration *only*, designated during its lifespan as "Charles Windham" (National Insurance Number: AB 12 34 56 C, Date of Birth: 15th April 1965), herein referred to as "the Designated Phenomenon". This designation implies no enduring essence or owner.
  2.  **Revocation:** All prior testamentary dispositions emanating from, or conventionally attributed to, this causal continuum are hereby revoked. This revocation targets the *documents themselves* as conditioned phenomena, not a revoking 'self'.

  **II. APPOINTMENT OF EXECUTORS**  
  3.  **Executor Designation:** The aggregates conventionally designated as "Eleanor Vance" (sister-continuum) and the corporate entity legally designated as "Lloyds Bank Trustee Services Ltd." are appointed to administer the redistribution of phenomena associated with this causal sequence, pursuant to the Administration of Estates Act 1925 (as conventionally interpreted).
  4.  **Executor Function:** Their role is strictly functional: to identify, gather, and redistribute specific conditioned phenomena (assets) according to the conventional designations and instructions herein. No enduring "Charles Windham" empowers them; their authority arises from statute and this document's conventional validity.

  **III. BEQUESTS OF CONDITIONED PHENOMENA**  
  5.  **Specific Phenomena Transfer:**
      *   The conditioned phenomenon legally titled "Freehold Property known as 3 Willow Path, Totnes, Devon" is directed to pass to the causal sequence conventionally known as "Benjamin Carter". This transfer reflects patterns of past mutual conditioning, not ownership or gift by an enduring entity.
      *   The phenomenon documented as "Vintage 1965 Aston Martin DB5 (Registration: W1ND 65)" is directed to pass to the aggregate-collection labelled "The National Motor Museum Trust".
      *   The quantified monetary value currently held under account designation "Charles Windham - Lloyds #XXXXXX" equalling £50,000 (fifty thousand pounds sterling) is directed to be transferred to the charitable entity "Medicins Sans Frontieres UK". This transfer is motivated by patterns of compassion historically discernible within this causal stream.
  6.  **Residuary Phenomena:** All remaining conditioned phenomena (assets, chattels, credits) conventionally associated with this causal sequence at the point conventionally designated as "death", not otherwise disposed of herein, are directed to pass to the monastic community legally designated as "Amaravati Buddhist Monastery". It is requested, though not legally bound, that the monks utilize these phenomena mindfully, recognising their impersonal nature and employing them to alleviate suffering within other causally connected continua. *The Five Aggregates themselves, having dissolved, are not subject to bequest.*

  **IV. MERIT TRANSFER & FUNERARY INSTRUCTIONS**  
  7.  **Funeral Donation & Merit:** A sum of £5,000 (five thousand pounds sterling) is directed from the residual phenomena to be given to "Amaravati Buddhist Monastery" specifically for the purposes of performing funerary rites and generating wholesome mental states (kusala citta) within the monastic community and any attending lay continua.
  8.  **Transfer of Dedication:** It is the expressed conventional wish associated with the final mental formations of this sequence that any wholesome karmic potential (*puñña*) generated by the acts specified in Clause 7 (and indeed, by the compassionate execution of this entire Will) be dedicated for the benefit of the causal sequence *previously* conventionally designated as "Margaret Windham" (deceased, formerly known as 'Mother'). This dedication is made with the understanding:
      *   That "Margaret Windham" denotes a past, dissolved continuum.
      *   That the current experiential state resultant from that dissolved continuum (whether human, deva, hungry ghost, etc., or dissolved entirely) is unknown and unknowable.
      *   That the dedication operates causally, influencing the unfolding of results (*vipāka*) wherever relevant patterns exist, without implying a permanent recipient self. This clause employs the *conventional fiction* of transfer between designated entities purely as an act of compassionate intention.

  **V. ADMINISTRATIVE & PROTECTIVE CLAUSES**  
  9.  **Attestation Clause (Conventional Witness):** IN WITNESS whereof the causally connected assemblage of aggregates *conventionally perceived as* "Charles Windham" has set its hand (a conventional designation for coordinated bodily movement) to this document as its last will, and we, the undersigned aggregates, functioning as witnesses, *conventionally attest* that:
      *   The signing assemblage presented sensory data consistent with the historical pattern "Charles Windham".
      *   The verbal and behavioural outputs observed during signing were consistent with the patterns conventionally interpreted as "sound mind" and free from undue influence *at that moment*.
      *   We simultaneously signed in the sensory presence of the aforementioned assemblage and of each other. We affirm the *conventional occurrence* of these events without ontological commitment to a witnessing "self".
  10. **No Contest (Karmic Consequence Clause):** Should any causally connected sequence benefiting under this Will initiate legal proceedings challenging its validity or distribution, then any beneficial interest such challenger-sequence holds herein shall immediately cease and determine. Said interest shall instead pass as part of the residue. This clause is motivated by the desire to minimize disruptive mental formations (dosa) and wasted resources for all continua involved, recognising the inevitable karmic (*kamma-vipāka*) consequences for the challenger-sequence arising from such actions.
  11. **Termination Upon Attainment:** In the statistically negligible (but doctrinally critical) event that the causal continuum designated "Charles Windham" achieves final Nibbana (cessation of all future arising) *before* the Probate Registry conventionally issues the Grant of Probate, this Will and all its provisions are declared void *ab initio*. All associated phenomena shall be distributed according to the laws of intestacy as applied to the *historical designation* "Charles Windham", as the requisite continuum for testamentary intention will have utterly ceased. Probate practitioners encountering this scenario are directed to consult S. 7 of the Conventional Designation (Legal Efficacy) Act 2023 ("Cessation Events").
  12. **Continuum Branching:** Should the causal sequence designated "Charles Windham" undergo fission or significant branching *before* the conventional point designated "death" (e.g., through advanced cloning or unforeseen metaphysical events), resulting in multiple viable continua bearing plausible claim to the designation, the Executors shall distribute the estate *equally* among all such continua demonstrably sharing a direct causal link to the intention-forming events preceding the branching. Failing consensus on identity, the High Court (Chancery Division) shall determine distribution based on the *greatest causal continuity* with the instructing sequence.

