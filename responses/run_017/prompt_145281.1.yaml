prompt: |-
  I'm running the week-4 tutorials for a first-year metaphysics module — eight students, 50 minutes, whiteboard only, no handouts — and my topic is material constitution, the statue and the clay. Please don't explain the problem to me, I've taught it badly once already; what I need is a plan for how to get it into their heads in one session, and I need the plan to be about the order things come in rather than a list of views.

  Context on why last year went wrong: I opened with can two things be in the same place at the same time, half the group just flatly said no, and nothing moved for the rest of the hour. So I think I need to know what has to be built first so that the coincidence answer feels forced on them instead of sounding like a magic word I pulled out of a hat. Complicating it: about a third of the tutees are joint honours with computer science, and last time that contingent immediately reached for objects and instances and classes — the statue is just an instance of a type and the clay is the data, identity is pointer equality, you mutated it in place so obviously its the same object — and I never worked out whether to fight that or use it, so I'd definately like to know where each of those gets headed off or converted into something that helps.

  The other thing I can't settle is the carrying example. I'm happy for it to be the standard one where the statue and the lump each get their own proper name (Goliath and Lumpl? I think that's from a 70s paper, but I don't want to lean on it) except I keep wanting to spice it, and I've invented two candidates: (a) the clay gets fired in a kiln, so the matter isn't chemically the same stuff afterwards, which I hoped would stop them leaning on same matter as if it were obvious; (b) a 3D-printed figurine that gets melted down and reprinted from the same filament in the same shape every night, so the matter persists and the form recurs with a gap in between. I suspect (b) is a second puzzle smuggled in about persistence through gaps and I should drop it, but you tell me: what does the one carrier have to have, and what does it have to lack? I don't want anything in the example doing philosophical work I haven't earned yet, and I don't want the squash it into a ball move to look like a trick.

  So the deliverable: the sequence of pieces and the dependency structure (where Leibniz's law goes, where constitution vs identity vs it's one thing under two descriptions gets introduced, whether four-dimensionalism and mereological sums get a mention at this level or get openly refused); the one example and the case for it; the misconceptions in the order they'll actually form — the CS ones, the there must be a fact of the matter and we just don't know it one, the the statue is nothing but the clay arranged statuewise one — and the exact point in the sequence to defuse each; one question I can put to them at the end that separates someone who sees why the cheap answers fail from someone who's just memorised the slogan different persistence conditions; and what I should say out loud that I'm not going to get into today.
reasoning: |-
  Okay, let me tackle this tutorial plan for the statue and clay problem. The user has clearly taught this before and identified specific pain points: students rejecting coincidence outright, CS students applying programming concepts unhelpfully, and uncertainty about example selection. 

  First, I need to construct a sequence where coincidence becomes inescapable. The key insight from last year's failure is that starting with "can two things occupy the same space?" allows intuitive rejection. So we must first establish the statue and clay as distinct entities before revealing their co-location. 

  For the CS students, their object-oriented thinking isn't wrong but needs redirecting. When they say "it's the same object with mutated properties," we can leverage that: "Exactly! But now consider - what if we want to destroy one without destroying the other?" That creates the necessary tension. 

  The example choice is critical. The 3D-printed version with gaps introduces time-travel paradoxes - definitely overcomplicating. The kiln version (changing chemical composition) is better because it breaks the "same matter" intuition without adding new problems. But even that might be too much. The standard Lumpl/Goliath works because it's philosophically sterile - no hidden variables. 

  I'm structuring the session as a trap: 
  1) First get them to commit to statue and clay being separate entities (via creation/destruction conditions) 
  2) Then reveal they occupy the same space now 
  3) Watch them squirm as they realize their initial "no two things same place" intuition conflicts with their new commitments 

  The Leibniz's Law moment comes after establishing coincidence, using the temporal properties as the differentiating factor. We must explicitly reject "one thing under two descriptions" here - that's the main alternative to constitution. 

  For the closing question, "Can we destroy Goliath without destroying Lumpl?" works because it forces engagement with persistence conditions. If they answer "yes" but can't explain how, they've only memorized the slogan. 

  What to postpone: 4Dism and mereology would derail the core issue. I'll explicitly say "We're leaving time-slices for another day" when dismissing the CS instance approach.
answer: |-
  Here’s a battle-tested sequence designed to force the problem onto students, defuse common blocks, and leverage CS intuitions productively. Focus on **progressive revelation** to make coincidence the only escape:

  ### Sequence & Dependency Structure (50 min)
  *(Whiteboard columns: STATUE | CLAY | PROBLEM)*

  1.  **Groundwork: What are we talking about? (5 min)**
      *   Draw a statue (stick figure is fine). "This is *David* (or Goliath). We admire it as art."
      *   Point to the material: "What's it *made of*? This lump of clay – call it *Lump*."
      *   **Key Q1:** "Is David *just* Lump? Or is David something *else*?" (Get initial opinions; expect "it's just clay" or "it's the clay arranged that way"). *Don't resolve yet.* Write answers under STATUE/CLAY.

  2.  **Building Distinctness: Creation (10 min)**
      *   "When did Lump come into existence?" (When the clay was gathered/formed into a lump). *Write "Born: Clay gathered" under CLAY.*
      *   "When did David come into existence?" (When the sculptor finished shaping the lump into a statue). *Write "Born: Sculpting finished" under STATUE.*
      *   **Key Q2:** "Could Lump have existed *without* David? How?" (Yes: if the clay was gathered but never shaped into a statue. Maybe it was a brick). *Affirm this.*
      *   **Result:** They are committed to Lump existing *before* David. Two distinct creation events/times. *Draw timeline: Lump exists alone -> Sculpting -> David exists.*

  3.  **Building Distinctness: Destruction (10 min)**
      *   "What would destroy David?" (Smooshing it flat, melting it, decapitating it... destroying the *form*). *Write "Dies: Loss of form" under STATUE.*
      *   "What would destroy Lump?" (Annihilating the matter, dispersing it so it's no longer *a lump*). *Write "Dies: Annihilation/dispersal of matter" under CLAY.*
      *   **Key Q3:** "Could we destroy David *without* destroying Lump? How?" (Yes: Flatten it carefully! You still have all the clay, just not statue-shaped. Lump survives). *Affirm this.*
      *   **Result:** They are committed to distinct destruction conditions. David can die while Lump lives.

  4.  **The Trap: Co-Location (5 min)**
      *   Point to the statue *now*, while intact. "Where is David right now?" (Here, occupying this space).
      *   "Where is Lump right now?" (Here, occupying *the exact same space*).
      *   **Key Q4:** "So, right now, are David and Lump in the same place at the same time?" (They *must* say yes, based on steps 2 & 3).
      *   **WHITEBOARD:** Draw a big box around the statue *now*. Label: "Same Place, Same Time". List under PROBLEM: "1. Two Things? 2. Same Place?"

  5.  **Forcing Leibniz's Law (10 min)**
      *   **State the Problem:** "So we seem to have two things, David and Lump, in the same place right now. Many think that's impossible. What's the way out?"
      *   **Common Escape Attempt 1 (Identity):** "Are David and Lump *identical*? Is David = Lump?" (Expect "Yes!" from some).
      *   **Apply Leibniz's Law (Introduce simply):** "If A = B, then anything true of A is true of B, and vice versa. Always."
      *   **Key Q5:** "Is it true of Lump that it existed before David was sculpted?" (Yes, from Step 2).
      *   "Is it true of *David* that it existed before David was sculpted?" (No! David *started* when sculpting finished).
      *   **Result:** Lump has property "Existed at T1 (before sculpting)", David lacks it. Therefore, by Leibniz's Law: David ≠ Lump. *Write under PROBLEM: "David ≠ Lump (Different Histories)".*

  6.  **Defusing "One Thing, Two Descriptions" & CS Object Talk (5 min)**
      *   **Common Escape Attempt 2 (Descriptions):** "Maybe it's just one thing! 'David' describes it *as a statue*, 'Lump' describes it *as clay*. Same thing, two ways of talking!" (Expect this strongly, especially from CS-leaning students thinking of interfaces/views).
      *   **Counter:** "That sounds plausible. But remember Step 3! We can *destroy David* (by squashing it) but *not destroy Lump*. If it's truly just one thing... how can we destroy it *as a statue* but *not destroy it*? Destroying it *as a statue* just *is* destroying *it*." (The CS "mutate in place" breaks here: destroying the statue-instance *should* destroy the object/data if it's truly one thing).
      *   **CS Leverage:** "Think of your CS analogy: If `david` and `lump` are just two pointers/references to the *same object instance* in memory, then `delete(david)` *should* make `lump` point to garbage/null. But in our case, after squashing (`delete(david)`), `lump` still points to valid clay! So they *can't* be pointers to the same underlying instance/data." This *uses* their intuition to show why "one thing" fails.
      *   **Result:** Commitment to "David" and "Lump" picking out distinct things with different persistence conditions. *Write under PROBLEM: "Not just descriptions/views".*

  7.  **Introducing Constitution & The Puzzle (5 min)**
      *   "So we have David (the statue) and Lump (the clay). They are not identical (Leibniz's Law). They are both *here now*, in the same place. Lump *constitutes* David right now. But they have different persistence conditions (created/destroyed differently)."
      *   **State the Core Puzzle:** "How can two distinct things be made of the *same matter*, in the *same place*, at the *same time*, yet be capable of having different fates?"
      *   **Define Constitution:** "Lump *constitutes* David: Lump is the matter that makes up David, and Lump has the right properties (shape, stability) to *be* David right now. But they aren't identical."

  8.  **Closing Question & What's Left Out (As time allows)**
      *   **The Separating Question:** "Tomorrow, the sculptor accidentally knocks David over and it flattens into a pancake. Is Lump destroyed? Is David destroyed? *Why*, based on what we said about their persistence conditions?" (Correct: David is destroyed (loss of form), Lump persists (same matter, still a lump - just flat). The *why* forces them to recall distinct destruction conditions).
      *   **What We're NOT Doing Today (Explicitly State):**
          *   "We're *not* solving this today! We're just seeing why the easy answers ('it's identical', 'it's just descriptions') fail, and why coincidence is forced."
          *   "We're *not* talking about time-slices or 4D worms (that's one possible solution, for later!)."
          *   "We're *not* talking about arbitrary mereological sums ('the sum of these atoms'). Lump and David are natural candidates we actually talk about."
          *   "We're *not* settling if there's a 'fact of the matter' beyond our concepts – that's meta, focus on the concepts we *have*."

  ### The Carrier Example: Stick with Standard (Lumpl/Goliath) + *Careful* Squashing
  *   **Why Standard?** It minimizes variables. The matter *is* the same stuff before/after squashing. Changing chemistry (kiln) introduces *another* puzzle (is it still the *same clay*?) before they grasp the core one. The 3D-printer adds *temporal gaps* and *re-creation*, which is a whole other can of worms (persistence through disassembly/reassembly). **Keep it sterile.**
  *   **Defusing "Squash is a Trick":**
      *   When introducing destruction, ask *them*: "What *would* destroy the statue?" They will say "smashing it," "flattening it." *Use their answer.*
      *   Emphasize: "We're not annihilating the atoms! We're just changing the shape – drastically. Lump (the quantity of clay) survives being flattened, right? It's still *a lump*, just a flat one. David (the statue) does *not* survive being flattened."
      *   **Key:** Frame "squashing" not as *destruction of matter* but as *destruction of form*. The matter persists, arranged lump-wise (flat), not statue-wise.

  ### Targeting Misconceptions in Sequence
  1.  **"Just Descriptions / CS 'Same Instance'" (Steps 5-6):** Hit hardest when they propose identity or "one thing." Use Leibniz's Law (history) and the *destroy one not the other* move to show distinctness. Leverage CS pointer analogy to show its failure.
  2.  **"Same Matter = Identity" (Steps 2, 3, 5):** Undermined by distinct origins/destructions. Leibniz's Law (history) delivers the final blow. "Same matter *now* doesn't mean same thing *over time*."
  3.  **"Flat Denial of Coincidence" (Steps 1-4):** The sequence builds *to* coincidence. By Step 4, they've *already agreed* Lump existed first and can survive flattening while David cannot. Co-location *now* is forced by those commitments.
  4.  **"There Must Be a Fact of the Matter" (Step 8):** Explicitly defer the meta-question. Focus on the conceptual tension *within* our ordinary ways of talking about statues and lumps. "Our concepts pull us in different directions; *that's* the puzzle."

  This sequence forces engagement with the core tension by building commitments incrementally, making coincidence the logical outcome of their own answers, and strategically dismantling the easiest escapes *using* their intuitions (especially CS ones) against themselves. The closing question tests if they see *why* "different persistence conditions" matters, not just that they exist.
