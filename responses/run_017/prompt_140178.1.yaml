prompt: |-
  I write the public-facing text for a museum of archaeology — wall panels, object labels, the audio guide — and I do it with no training in the field; my degree is in English, and everything I know about these periods comes from our own catalogue and from reading around the subject on my own. Our current exhibition covers several past societies that went through sharp breaks, and I keep hitting the same problem: I don't know when I am allowed to use the word 'collapse'.

  The word does a great deal of work in a label. It tells visitors that something went wrong, that people suffered, that the people themselves were in some sense to blame, and that the story ended there. 'Transformation' tells them the opposite on all four counts, and it has started to feel like the polite word that quietly removes the suffering. Our curators sign off on the final text, and a liaison appointed by a descendant community reads anything concerning her ancestors, so the word has to survive two very different kinds of scrutiny. I need something I can run in about twenty minutes per label, using only what is on my desk, and simple enough that our education officer can apply it to school worksheets without me standing next to her.

  What I want is a decision procedure rather than an essay: the questions to ask, in order, about a given case; what would count as a good enough answer to each for someone who cannot go to a library; the points at which the answer is a clear yes or no and I can stop; and — this matters most — the points at which the question is really one of values, where the procedure should stop and hand the decision to a named person rather than pretend to settle it. Please also say plainly what the procedure cannot tell me.

  Three distinctions I have been playing with, none of which I can get to do the work I want:

  1. Loss of capacity versus loss of scale: people no longer being able to do something at all — read, quarry and move stone, sail beyond the reef, feed the same number of mouths — as against people still able to do it but only in smaller units or over a smaller area, a city of thousands becoming villages of a hundred.

  2. Whether what was lost could be rebuilt from inside: if a skill or a system disappears, could the people who remain recover it from what they still know, or would it have to come back from outside? My sense is that the second is a deeper break even when fewer people died, but I cannot say why I think so.

  3. Whether the break was available to the people living through it as a loss: someone who remembers the temples being maintained undergoes something her grandchild does not, and a later archaeologist sees something different again. I wonder whether a collapse should be dated to when it was felt rather than to when the evidence shows it, and whether a change nobody at the time seems to have mourned can count as one.

  Tell me which of these, if any, belong in the procedure, which should be dropped as unworkable for someone in my position, and which distinctions I have missed that it needs instead.

  Then run it on three cases. (i) A small, isolated island whose people, as I understand it, stopped carving and moving their large stone figures and had cleared most of their trees; visitors arrive already knowing it as the story of a society that wrecked its own environment, and the draft label says collapse. I suspect the word is doing marketing work. (ii) A lowland city civilisation of the sort people know from documentaries: the great centres were given up over a century or two and the royal inscriptions stop, while the farmers, the language and the descendants plainly continue — our liaison has asked that we not call this a collapse, since it suggests her people vanished, and my instinct is that she is right about the people while I still need some word for what happened to the cities. (iii) A palace-based economy around a sea where, within a couple of generations, the big buildings are burnt, the administrative script stops being used altogether, and for some centuries nobody in the region writes anything down, until writing returns in a different form borrowed from elsewhere.

  At least one of these should come out with an answer I would rather not have. Tell me which, and tell me how to write the label anyway.
reasoning: |-
  Okay, the user is a museum writer with an English background, not archaeology, and they're struggling with when to use "collapse" versus "transformation" in exhibit labels. They need a practical decision tree that's quick to use, respects both academic and descendant community input, and acknowledges where value judgments begin. 

  Hmm... their three self-proposed distinctions are thoughtful but problematic. The capacity-vs-scale one risks oversimplifying - like that island case where environmental damage looks like collapse but continuity exists. The rebuild-from-within idea is theoretically interesting but impossible for a non-specialist to assess. And dating collapse by contemporary perception? That's ethically fraught with descendant communities and archaeologically speculative.

  *scratches head* Right, the procedure must prioritize what's verifiable from their desk: visible evidence thresholds (like writing disappearing), unambiguous population decline signs, and crucially - whether descendant communities exist today. The values checkpoint has to come early when continuity is involved. 

  *checks watch* For case (i) that Easter Island-esque scenario: despite popular "ecocide" narratives, the procedure blocks "collapse" because trees regrew and carving continued smaller. The marketing temptation is real but unsupported. Case (ii) is Maya-like - here "collapse" fails both evidence (farmers continued) and ethics (liaison objection). "Reconfiguration" works better. Case (iii) is Bronze-Age-like with writing loss and destruction layers - meets collapse criteria but must stress it's systemic, not total. 

  *winces* They won't like case (iii)'s outcome but can mitigate by emphasizing cultural survival. The procedure's key limitation? It can't resolve debates about causes or assign blame - which is why their instinct to avoid "people were to blame" implications is correct. 

  Final note: Their hidden struggle is balancing dramatic storytelling with ethical responsibility. The word "collapse" does heavy narrative lifting, but the procedure forces them to earn it through evidence gates first.
answer: |-
  Here's a field-ready decision procedure designed for your constraints (20 mins/label, desk resources only, values flagged clearly). It prioritizes observable evidence and community input over theoretical nuances.

  **The "Collapse?" Decision Procedure**

  1.  **Continuity Check (Values Gate):**
      *   **Question:** Is there a direct, continuous cultural lineage from the pre-break society to a present-day descendant community? (Check your liaison notes/records).
      *   **Good Enough Answer:** If your liaison or clear museum records affirm continuity, the answer is YES. If unsure or no known community, NO.
      *   **Action:**
          *   **YES:** **Do NOT use "collapse" for the society/people.** Proceed to Step 2 to describe the *change*.
          *   **NO:** Proceed to Step 2.

  2.  **Evidence of Major Systemic Failure (Evidence Gate 1):**
      *   **Question:** Does the evidence *on your desk* (site reports, catalogue entries, summaries) show a rapid (< 2-3 generations) and near-total cessation of **TWO or more** of these core societal functions across the *entire* society/region?
          *   Centralized governance/elite power structures (e.g., palaces, royal inscriptions stop).
          *   Major monumental construction (e.g., temples, large statues, big infrastructure).
          *   Complex economic systems (e.g., long-distance trade networks, standardized weights/measures vanish).
          *   Administrative literacy (e.g., writing system stops being used *at all* for records/administration).
          *   Major population decline/settlement abandonment (e.g., urban centers emptied, regional population estimates plummet >75%).
      *   **Good Enough Answer:** Based *only* on the reports/photos/descriptions in front of you. "Near-total cessation" means function effectively stops, not just shrinks. If unsure due to gaps, default to NO.
      *   **Action:**
          *   **YES (2+ functions ceased):** Proceed to Step 3.
          *   **NO:** **Use "transformation," "reconfiguration," or "major change."** Stop. The threshold for "collapse" isn't met.

  3.  **Evidence of Non-Recovery & Scale (Evidence Gate 2):**
      *   **Question 3a (Recovery):** Did these ceased functions *ever* recover **from within that same cultural tradition** in that region within the next few centuries (say, 300-500 years)? (e.g., Did the same writing system come back? Was monumental building restarted by the same cultural group?).
      *   **Question 3b (Scale):** Was the scale of society (population density, settlement size, geographic reach) permanently reduced to a *fraction* (e.g., <25%) of its pre-break level for centuries?
      *   **Good Enough Answer:** Scan reports/timelines. Look for evidence of revival *or* sustained small-scale existence. If evidence of revival exists, NO for 3a. If evidence shows sustained low population/complexity, YES for 3b.
      *   **Action:**
          *   **If 3a = NO (didn't recover) AND 3b = YES (permanently reduced scale):** **"Collapse" is justified** to describe the *system/scale*. Proceed to Step 4 (Nuance).
          *   **Otherwise (Recovery happened OR Scale didn't plummet permanently):** **Avoid "collapse."** Use "crisis," "fragmentation," "major disruption," or "end of the [Specific System, e.g., Palatial Period]." Stop.

  4.  **Nuance & Wording (Final Check):**
      *   **Question:** How can you phrase "collapse" to be accurate and minimize harmful implications?
      *   **Action:** *Always* qualify and specify:
          *   **Specify the System:** "the collapse *of the palatial system*," "the collapse *of centralized Maya kingship*," "the collapse *of large-scale statue carving*".
          *   **Avoid Totalizing Language:** Never imply *everyone* died or *all* culture vanished. Use phrases like: "society as previously organized," "the ruling elite/centralized state," "this specific urban tradition."
          *   **Acknowledge Continuity (If Step 1=YES):** Explicitly state: "While the centralized state collapsed, people continued to live in the region, adapting and forming new communities. Their descendants are the modern [Group]."
          *   **Avoid Assigning Blame:** Focus on the *outcome* (systems failed) not the *cause* (unless evidence is overwhelming and non-controversial, which it rarely is).

  **What the Procedure CANNOT Tell You:**

  *   **The Cause(s):** It doesn't determine *why* it happened (environment, war, drought, rebellion, complexity?).
  *   **The Suffering:** It doesn't quantify human cost, though systemic collapse implies hardship.
  *   **Moral Judgment:** It doesn't say if it was "good" or "bad," or if people were "to blame."
  *   **The "Best" Word:** Sometimes alternatives ("cataclysm," "demise," "fragmentation") might fit better contextually, but the procedure flags when "collapse" is evidentially justifiable.
  *   **Resolve Deep Scholarly Debates:** It uses observable thresholds to make a practical museum decision, not settle academic disputes.

  **Your Distinctions Reviewed:**

  1.  **Loss of Capacity vs. Scale:** Partially incorporated in Step 2 (cessation = loss of capacity at that scale) and Step 3b (permanent scale reduction). Too abstract alone.
  2.  **Rebuild from Inside:** Incorporated in Step 3a (Internal Recovery). This is crucial for "collapse". Your instinct is right; losing the *ability* to rebuild the system signifies a deeper break than just shrinking.
  3.  **Felt as Loss:** **DROP.** Unworkable archaeologically for you. We rarely know contemporary feelings reliably. Dating based on evidence, not perception, is standard practice. A change unmourned *can* still be a collapse (e.g., an oppressive regime).

  **Applying the Procedure:**

  **(i) The Island (e.g., Rapa Nui / Easter Island-esque)**

  1.  **Continuity Check:** Likely YES (Polynesian descendants exist). **Action:** DO NOT use "collapse" for *the people/society*. Proceed.
  2.  **Evidence of Major Systemic Failure:**
      *   Monumental Construction (Statues): Ceased? YES (large statue carving/transport *did* stop).
      *   Centralized Governance? Evidence often ambiguous on Rapa Nui. Assume desk evidence isn't clear? Default NO.
      *   Literacy? None pre-contact. N/A.
      *   Complex Economy? Limited evidence likely. Default NO.
      *   Major Pop Decline? Evidence points to decline *after* European contact, not necessarily during the statue period. Pre-contact decline is debated. Default NO based on your desk.
      *   **Result:** Only 1 clear function ceased. **NO.** **Action: Avoid "collapse."**
  3.  **Wording:** "Major Transformation" or "The End of Monumental Sculpture". Explain: "Society changed significantly. Large-scale statue carving ceased, likely influenced by environmental pressures and shifting priorities. However, people continued to live on the island, adapting their way of life. The popular narrative of total 'ecocide' and disappearance is an oversimplification." (Acknowledge the marketing pressure but correct it).

  **(ii) The Lowland City Civilization (e.g., Classic Maya-esque)**

  1.  **Continuity Check:** YES (Liaison confirms descendant community). **Action:** DO NOT use "collapse" for *the people/society*. Proceed.
  2.  **Evidence of Major Systemic Failure:**
      *   Centralized Governance (Kingship): Ceased in major centers? YES.
      *   Monumental Construction: In major centers? YES (stopped).
      *   Administrative Literacy: Ceased (in the elite centers)? YES (dated inscriptions stop).
      *   Complex Economy: Long-distance elite trade networks? Likely disrupted/ceased? YES (from desk).
      *   Major Pop Decline? In urban centers? YES (abandoned). Regionally? Evidence often shows dispersal, not *total* regional depopulation. Assume regional decline but not >75%? Default NO for this criterion.
      *   **Result:** At least 3-4 functions ceased (Governance, Urban Monumentalism, Administrative Literacy, Elite Economy). **YES.** Proceed.
  3.  **Evidence of Non-Recovery & Scale:**
      *   3a (Internal Recovery): Did Maya kingship, urban centers, and the writing system *as used before* recover from within in the same region? NO.
      *   3b (Permanent Scale Reduction): Was the scale (urbanism, population density in heartland) permanently reduced? YES (no comparable large cities returned to the Classic heartland for centuries/millennia).
      *   **Result:** YES to both. **"Collapse" is justified** for *the system*.
  4.  **Nuance:** "The collapse of Classic Maya civilization in the southern lowlands." **Crucially add:** "This marked the end of divine kingship, the abandonment of the great cities, and the cessation of royal inscriptions. *However*, Maya people continued to live in the region, adapting and forming new communities. Their vibrant culture and descendants thrive today." (Respects liaison, uses "collapse" for the specific system).

  **(iii) The Palace-Based Economy (e.g., Late Bronze Age Aegean/Mycenaean-esque)**

  1.  **Continuity Check:** Likely NO (or highly contested) for direct *cultural* lineage across the "Dark Age". **Action:** Proceed.
  2.  **Evidence of Major Systemic Failure:**
      *   Centralized Governance (Palaces): Ceased? YES (palaces burnt, not rebuilt).
      *   Monumental Construction: Ceased? YES (palaces/major tombs stop).
      *   Administrative Literacy: Ceased? YES (Linear B scripts vanish entirely).
      *   Complex Economy: Ceased? YES (palace-controlled workshops, long-distance trade collapse).
      *   Major Pop Decline? YES (widespread site destruction/abandonment, regional estimates show significant decline >75% in many areas? Assume desk evidence supports this). **YES** (All 5 criteria potentially met).
  3.  **Evidence of Non-Recovery & Scale:**
      *   3a (Internal Recovery): Did the palatial system, its administration, or writing *recover from within*? NO. Writing returned centuries later as a completely different script (alphabet) from elsewhere.
      *   3b (Permanent Scale Reduction): Was scale permanently reduced? YES (for centuries; recovery to comparable complexity took ~400+ years in a very different form).
      *   **Result:** YES to both. **"Collapse" is justified.**
  4.  **Nuance:** "The collapse of the palatial civilization across the region." **Add:** "The great palaces were destroyed, central administration vanished, literacy was lost, and populations declined significantly. Society fragmented into smaller, simpler communities for centuries. While cultural elements survived, the complex palatial system never recovered."

  **The Answer You Might Dislike:** Case (ii) likely qualifies for "collapse" *of the specific system* (Classic Maya civilization in the lowlands) based on the evidence thresholds, even though continuity exists. The procedure forces you to use it here, but Step 4 and Step 1 ensure it's qualified explicitly ("collapse *of Classic Maya civilization*") and immediately paired with the statement of continuity and survival.

  **How to Write the Label Anyway (Case ii - Maya-esque):**

  > **The Transformation of the Maya World**
  >
  > **(Headline avoids "collapse" for society, uses "Transformation")**
  >
  > Around the 9th century CE, the great cities of the southern Maya lowlands, like the one whose remains you see here, were largely abandoned. The system of divine kingship ended, royal inscriptions ceased, and the complex networks sustaining these urban centers dissolved. This marked **the collapse of Classic Maya civilization as it existed in this region.**
  >
  > *(Uses "collapse" for the specific system, clearly defined)*
  >
  > **Yet, the Maya story did not end.** People did not vanish. Many moved, adapting to new circumstances in the northern lowlands, highlands, and coastal areas. Communities continued, traditions evolved, and vibrant new Maya centers arose elsewhere. The descendants of the people who built these ancient cities maintain their rich cultural heritage today.
  >
  > *(Explicitly counters the "vanishing" myth, affirms continuity, respects liaison input)*
  >
  > *(Optional: Brief non-judgmental cause)* The reasons for this profound change were complex, likely involving a combination of environmental strain, shifting trade routes, and societal pressures.

  This satisfies the evidence (justifying "collapse" for the specific system), respects the descendant community (explicitly states survival and continuity), and avoids misrepresenting the people as vanishing. The procedure forced a nuanced but accurate use of the powerful word.
