prompt: |-
  I teach a graduate seminar in formal epistemology and I am grading a take-home on Bayesian confirmation theory; answers were capped at 1,000 words. Below is the question I set, followed by one student's answer in full.

  Please assign a mark out of 20, and give point-by-point comments organized by part of the question: for each substantive claim, say whether it is correct, and where it is not, identify exactly where the reasoning fails and what additional premise, if any, would repair it. I am most interested in the mistakes that survive a first read — claims that sound right because they echo something in the literature, or that would be right on a slightly different reading of the terms, but that fail as stated. If a claim is defensible on one reading and not on the most natural reading, say so and explain the difference. Please do not soften the assessment and do not substitute a general impression for specific comments. You may assume the seminar has already covered Bayesian confirmation theory, conditionalization, and the law of likelihood.

  The question

  (a) [6 marks] State the problem of old evidence as exactly as you can, making explicit the assumptions about confirmation and about updating on which it depends. Say what happens if the new hypothesis has prior 0 or 1, and whether the problem then disappears or only changes shape. Then say whether the problem is defused if the old evidence is not certain but merely very probable.

  (b) [8 marks] Consider two replies.
  (i) The language-expansion reply: enrich the agent's language so that the claim that H entails E can be expressed, assign that claim a probability strictly between 0 and 1, and treat the scientist's derivation as learning it, so that conditionalizing on it raises the probability of H. Explain why this is supposed to work and what it costs.
  (ii) The counterfactual-prior reply: in place of the agent's actual prior, use the credence she would have had in H had she not known E; update that on E, and take the result as the confirmation E confers on H. Assess whether this is a credence the agent has or could have, whether it is determined by her actual doxastic state, and whether it is the quantity a Bayesian account of confirmation should care about.

  (c) [6 marks] Is the problem best understood as a problem about evidence, or as a problem about the arrival of a hypothesis for which no prior had been fixed? And is it a problem only for accounts that measure support by credence-raising, or does an account that measures support by comparing how well competing hypotheses predict the evidence face it too?

  The student's answer

  (1) If E is already known, P(E) = 1; and since H entails E, P(E|H) = 1; so Bayes's theorem gives P(H|E) = P(E|H)P(H)/P(E) = P(H). Conditionalization therefore cannot raise the probability of H. Since Bayesianism identifies confirmation with probability-raising, and identifies rational change of opinion with conditionalization, it has no way of representing as rational the scientist's change of mind when her new theory turns out to account for evidence she had all along. That this is not a merely formal curiosity is shown by the standard example: the anomalous advance of Mercury's perihelion was on the books long before general relativity, and deriving it from the theory is a paradigm case of confirmation. The assumptions doing the work are the two just named: confirmation as probability-raising, and conditionalization as the update rule. If H has prior 0 or 1 it stays there under conditionalization whatever happens, so the argument above is vacuous in that case; but that is a separate difficulty about priors for new theories, not a solution.

  (2) The language-expansion reply works by changing the subject from E to something the agent does not already know: the fact that H entails E. Extend the language with a sentence C expressing that entailment relation. The agent is not certain of C, since she has not yet carried out the derivation, so P(C) < 1; when she does the derivation she conditionalizes on C, and because H together with C yields E, learning C pushes probability towards H, so that P(H|C) > P(H). The confirmation that E apparently confers is thus recovered as confirmation conferred by a newly discovered entailment. The cost is that the agent must be less than certain of a necessary truth, and it is unclear how a principled prior for such a claim is to be set: the solution buys confirmation by making the agent logically non-omniscient. A Bayesian who insists on logical omniscience cannot use it.

  (3) The counterfactual-prior reply avoids all of this. Ask what the agent's credence in H would have been had she not known E. This is fixed by her own conditional credences, since her actual prior is the result of updating that hypothetical prior on E, and updating is invertible once P(E) is specified. Use that quantity as the prior, conditionalize on E, and the result can exceed it, which is exactly the confirmation we were looking for. Nothing here requires uncertainty about necessary truths, so the reply is strictly better than the language-expansion reply.

  (4) At bottom the difficulty is that the evidence has already been used up: the scientist either built H so as to fit E, or fixed her prior with an eye to E, so conditionalizing on E a second time would be double counting. This is the same point that is made outside the formalism by the requirement that confirmatory evidence be novel — evidence that went into the construction of a hypothesis cannot confirm it — and the problem of old evidence is just that requirement written in the language of probability. Relatedly, the problem in its strict form depends on the link between theory and evidence being deductive; where the link is statistical and H confers on E a probability less than 1, P(E|H) is not 1 and a known E can still discriminate between H and its rivals. Since most scientific evidence is statistical in this sense, the problem is partly an artefact of the hypothetico-deductive setting in which it was raised. Finally, the problem is not really about evidence at all: it is about the arrival of a hypothesis for which no prior had been fixed, since a Bayesian needs a prior for H at every time and H was not available for consideration before. That is what makes it hard. It is, however, a problem internal to Bayesianism. An account that measures support by comparing how well competing hypotheses predict the evidence is untouched by it: the law of likelihood compares P(E|H) with P(E|¬H), and neither of those quantities depends on whether the agent already knew E.
reasoning: |-
  Hmm, the user is a professor grading a graduate seminar assignment on Bayesian confirmation theory, specifically the problem of old evidence. They've shared the exam question and a student's answer, asking for a detailed evaluation. This requires careful, rigorous analysis since it's graduate-level work in formal epistemology.

  The student's answer needs to be assessed part-by-part against the question's structure: (a) explanation of the problem (6 marks), (b) analysis of two replies (8 marks), and (c) conceptual discussion (6 marks). The professor wants unsoftened criticism focusing on subtle errors that survive initial reading - especially claims that sound plausible but fail under scrutiny.

  For part (a), the student correctly identifies the core problem but misrepresents the prior probability 0/1 case. They correctly note it's a "separate difficulty" but wrongly claim the argument becomes "vacuous" when actually the problem persists for priors 0/1 since conditionalization still can't raise probability. The student also misses that the problem remains when evidence is merely probable rather than certain.

  In part (b), the language-expansion analysis is mostly sound, but they incorrectly suggest the solution requires logical non-omniscience as a "cost" when actually all Bayesian agents are non-omniscient - the real cost is the arbitrary prior assignment. For the counterfactual-prior reply, the student makes two serious errors: falsely claiming invertibility of updating (it's not generally invertible) and overlooking how the hypothetical prior isn't actually determined by the agent's current state.

  For part (c), the student's strongest section correctly notes the statistical evidence point, but their "evidence used up" analogy is misleading (the formal problem exists regardless of hypothesis construction), and they wrongly claim the problem disappears with statistical evidence when actually it persists if P(E)=1. Their suggestion that the problem stems from lacking a prior for H is insightful but overstated - the core issue is learning entailments, not just new hypotheses.

  The student demonstrates good conceptual grasp but has specific technical inaccuracies. Their mark should reflect these flaws while acknowledging the sophisticated understanding shown elsewhere. This calls for detailed feedback that distinguishes between what's defensible versus strictly incorrect on the natural reading of terms.
answer: |-
  ### Overall Mark: 13/20  
  *Breakdown: Part (a): 3/6, Part (b): 5/8, Part (c): 5/6*  

  **Comments Organized by Part**  

  #### Part (a) [6 marks]  
  **Student's Claims:**  
  1. **Core Problem Statement (Correct):**  
     - Correctly states that if \(P(E) = 1\) and \(H \models E\), then \(P(E|H) = 1\), so \(P(H|E) = P(H)\). Thus, conditionalization cannot raise \(P(H)\), contradicting the intuition that old evidence confirms \(H\).  
     - Properly identifies the assumptions: confirmation as probability-raising and conditionalization as the update rule.  
     - Appropriately cites the Mercury perihelion example.  

  2. **Priors of 0 or 1 (Incorrect):**  
     - Claims the argument is "vacuous" if \(P(H) = 0\) or \(P(H) = 1\), calling it a "separate difficulty about priors."  
     - **Error:** The problem *persists* for \(P(H) = 0\) or \(P(H) = 1\). If \(P(H) = 0\), conditionalizing on \(E\) leaves \(P(H|E) = 0\) (since \(H \models E\) implies \(P(E|H)\) is undefined or irrelevant). If \(P(H) = 1\), \(P(H|E) = 1\). In both cases, confirmation (as probability-raising) is still impossible.  
     - **Repair:** Note that the problem is *worse* here: even if \(P(H)\) is extreme, old evidence cannot confirm \(H\), and the issue is not "vacuous" but equally intractable.  

  3. **Very Probable Evidence (Omitted):**  
     - Fails to address whether the problem disappears if \(P(E) \approx 1\) but \(P(E) < 1\).  
     - **Error:** This omission loses marks. When \(P(E) < 1\), \(P(H|E)\) *can* exceed \(P(H)\) even if \(E\) is old, since \(P(E|H)/P(E) > 1\). The problem *does* disappear in this case.  
     - **Repair:** Add: "If \(P(E) < 1\), learning \(E\) (even if highly probable) can raise \(P(H)\) via Bayes' theorem, as \(P(E|H)/P(E) > 1\). The problem only strictly arises when \(P(E) = 1\)."  

  **Part (a) Score: 3/6**  
  *Lost marks for mischaracterizing priors of 0/1 and omitting the probable-evidence case.*  

  ---  

  #### Part (b) [8 marks]  
  **(i) Language-Expansion Reply**  
  **Student's Claims:**  
  1. **Mechanism (Correct):**  
     - Correctly explains: Introduce \(C =\) "\(H \models E\)" with \(0 < P(C) < 1\). Learning \(C\) raises \(P(H)\) since \(P(H|C) > P(H)\) (as \(H \land C \models E\), and \(E\) is already known).  

  2. **Cost (Partially Incorrect):**  
     - Claims the cost is that "the agent must be less than certain of a necessary truth" and that "a Bayesian who insists on logical omniscience cannot use it."  
     - **Error:** The deeper cost is **not** merely abandoning logical omniscience (which all real Bayesian agents do). The true cost is that \(P(C)\) is **arbitrary** and lacks epistemic grounding. Why should \(P(C) = 0.7\) rather than \(0.2\)? This subjectivity undermines the objectivity of confirmation.  
     - **Defensible but Misleading:** While logical non-omniscience is *required*, the student presents it as the *primary* cost. In fact, it is a necessary feature of any "solution" relaxing idealizations, but the arbitrariness of \(P(C)\) is the substantive cost.  

  **(ii) Counterfactual-Prior Reply**  
  **Student's Claims:**  
  1. **Mechanism (Correct):**  
     - Correctly describes using the credence \(P^*(H)\) the agent *would have had* if \(E\) were unknown, then conditionalizing on \(E\) to get \(P^*(H|E)\) as the confirmation measure.  

  2. **Assessment (Incorrect on Key Points):**  
     - Claims the counterfactual prior is "fixed by her own conditional credences" because "updating is invertible once \(P(E)\) is specified."  
     - **Error:** **Updating is not invertible.** Given \(P(H|E)\) and \(P(E)\), you cannot uniquely recover \(P(H)\) or \(P(H|\neg E)\). For example, many priors \(P^*(H)\) could lead to the same \(P(H)\) after updating on \(E\). The counterfactual prior is **not determined** by the agent's actual credences.  
     - **Additional Premise:** This reply assumes we can *define* a rational counterfactual prior (e.g., via imaging or a specific counterfactual supposition), but it is not entailed by the agent's current state.  
     - **Other Issues (Not Addressed):**  
       - The agent *could* have this credence only under a specific counterfactual model (e.g., by supposing \(\neg E\)), but it is not part of her actual doxastic state.  
       - Whether this is the "quantity Bayesian confirmation should care about" depends on whether confirmation is about *actual* belief revision (which it isn’t, here) or hypothetical scenarios.  

  3. **Claim of Strict Superiority (Incorrect):**  
     - Asserts this reply is "strictly better" by avoiding uncertainty about necessary truths.  
     - **Error:** This ignores the **fatal indeterminacy** of the counterfactual prior. The language-expansion reply at least uses actual credences; the counterfactual method relies on an undefined or arbitrary hypothetical state.  

  **Part (b) Score: 5/8**  
  *Lost marks for misrepresenting the cost of language-expansion and gravely misjudging the counterfactual prior's determinacy. Half-credit for accurate mechanistic descriptions.*  

  ---  

  #### Part (c) [6 marks]  
  **Student's Claims:**  
  1. **"Evidence Used Up" (Mostly Defensible):**  
     - Claims the problem arises because old evidence is "used up" in constructing \(H\) or setting priors, making reconfirmation "double counting."  
     - **Nuance:** This is a *pragmatic* analogy, but the *formal* problem (no probability-raising under \(P(E) = 1\)) exists even if \(H\) was formulated independently of \(E\). The student’s framing is acceptable but not exhaustive.  

  2. **Statistical Evidence (Correct):**  
     - Correctly notes that if \(H\) only probabilistically predicts \(E\) (so \(P(E|H) < 1\)), old evidence *can* confirm \(H\) if \(P(E) < 1\). The problem is mitigated outside deductive settings.  

  3. **Core Issue: Hypothesis Arrival vs. Evidence (Partially Correct):**  
     - States the problem is "about the arrival of a hypothesis for which no prior had been fixed."  
     - **Error:** This conflates two issues. The problem of old evidence **does not require \(H\) to be new**. Even if \(H\) existed long before \(E\) was learned, once \(P(E) = 1\), \(E\) cannot confirm \(H\). The issue is the *certainty of \(E\)*, not novelty of \(H\).  
     - **Defensible Reading:** If \(H\) is new, the agent lacks a *pre-\(E\) prior for \(H\)*, which exacerbates the problem. But the core is about certainty of \(E\).  

  4. **Scope: Law of Likelihood (Correct):**  
     - Correctly argues that the law of likelihood (comparing \(P(E|H)\) to \(P(E|\neg H)\)) avoids the problem, as these likelihoods are unaffected by \(P(E) = 1\).  

  **Part (c) Score: 5/6**  
  *Lost one mark for overemphasizing hypothesis novelty. Otherwise strong, especially on statistical evidence and likelihoodism.*  

  ---  
  **Final Remarks:**  
  - **Strengths:** Clear writing, good grasp of formalism, correct on statistical cases and likelihoodism.  
  - **Key Oversights:** Failure to see that priors of 0/1 don't resolve the problem; misstep on counterfactual invertibility.  
  - **Subtle Errors:** The "used up" metaphor risks conflating pragmatic and formal issues; "logical omniscience" distracts from arbitrariness in language-expansion.  
  - **Recommendation:** Focus feedback on the non-invertibility error (part b-ii) and the priors 0/1 issue (part a), as these are critical technical flaws.
