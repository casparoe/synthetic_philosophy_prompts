  Now, ranking the objections. Fatal ones would be those that undermine the core functionality of laws. For example, if laws can't support induction or counterfactuals, that's bad. Or if the best-system analysis collapses into triviality. The island universes issue might be high because it questions the universality and objectivity of laws. Ties could be moderate, as indeterminacy might be acceptable. The late-onset law might be awkward but maybe a bullet to bite.

