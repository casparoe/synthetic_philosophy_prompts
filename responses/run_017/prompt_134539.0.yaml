  Hmm, their core move is clever—they're trying to decouple the *structural* features of preference (transitivity, stability etc.) from any putative unified phenomenal quality. By granting all the behavioral markers of a single scale while denying phenomenological unity, they force the hedonist into a corner: either admit the scale is borrowed from desire theory or collapse into pluralism. 

  Right, I need to defend hedonism without conceding the three pillars (phenomenal nature, unidimensionality, welfare-constitutiveness). The temperature analogy feels strongest here—baths and iced drinks share no qualitative feel yet uncontroversially sit on one thermal scale. The user's "determinables" challenge is sharp though; I'll need to ground the unity in functional role (attention/motivation) rather than brute phenomenology. 

  Noting their rhetorical skill: they preempt the determinable/determinate response and frame desire theory as the "honest" alternative. Must avoid getting sidetracked—stay focused on how behavioral commensurability *is* evidence for a common underlying dimension, even if introspection fails. The desire-theory comparison is useful ("objects of desire are equally heterogeneous") but risky—might concede too much ground. 

  *adjusting tone* They want impatience with heterogeneity objections? Good. I'll lead with the temperature analogy, dismiss the phenomenology complaint as myopic, then pivot hard to the functionalist defense. Small concession: introspection is messy. No retreat on core axioms. Their stipulation about stable preferences actually helps me—such robustness suggests a real common currency at work. 

  *steeling for counter* They'll likely press the "what grounds the unity" question next. Must have the attention/motivation reply ready: even if A and B feel alien to each other, if they both command attention in the same way and reinforce behaviors identically, that *is* the unity. Welfare isn't defined by our descriptive limitations.
answer: |-
  Your stipulation doesn't faze me. First, let's acknowledge that introspection is messy—we don't always grasp the intrinsic nature of our experiences transparently. But your forced-choice data *support* my view. That subjects reliably rank A and B on a single scale, transitivity intact, screams a unified underlying magnitude. Consider temperature: a scalding bath and an ice cube feel nothing alike phenomenally, yet we confidently say one is hotter. Why? Because they occupy positions on a physical continuum that reliably guides behavior. Similarly, A and B are determinates of the pleasantness determinable precisely because they play identical functional roles: both draw attention irresistibly when available, both motivate pursuit and prolonging, both reinforce learning. That’s the valence doing its work—not some borrowed structure. 

  You ask what makes them determinates of *one* determinable rather than two arbitrarily ranked magnitudes? It’s the causal-behavioral unity: subjects don’t just rank them; they *treat* increments of A and B as fungible well-being currency. If channel B were suddenly unavailable, they’d seek compensatory A without feeling a deficit in *kind* of welfare—just quantity. Desire theory has no advantage here. Desires target radically heterogeneous objects (proofs, safety, sex), yet you impose unity via preference. I do the same for felt qualities via their motivational convergence. The burden is on you to show why motivational unity in desire is less mysterious than in phenomenology. 

  *Your move. What’s the next thrust?*
