  ### Scenario
  Two financial analysts, Alice and Bob, work at the same investment firm. They are evaluating a speculative zero-sum bet on whether a key commodity (e.g., copper) will hit a price threshold within the quarter. The bet pays $1 to the holder if the event occurs. Alice has a pessimistic outlook, while Bob is optimistic. Each receives a private signal: Alice accesses a supply-chain report, and Bob sees preliminary demand data. A bookmaker collects sealed orders simultaneously, ensuring neither sees the other’s decision before committing. The bet is offered at $0.65. Based on their signals, Alice decides to sell the bet, and Bob decides to buy it, both expecting a profit. The actual state of the market aligns with moderate supply shocks and stable demand.

  ### Formal Setup
  - **States**: Five possible market scenarios: \(s_0\), \(s_1\), \(s_2\), \(s_3\), \(s_4\)  
  - **Prior**: \(P(s_0) = \frac{4}{9}\), \(P(s_1) = \frac{4}{27}\), \(P(s_2) = \frac{2}{9}\), \(P(s_3) = \frac{2}{27}\), \(P(s_4) = \frac{1}{9}\)  
  - **Information Partitions**:  
    - Alice: \(\{s_0\}, \{s_1, s_2\}, \{s_3, s_4\}\)  
    - Bob: \(\{s_0, s_1\}, \{s_2, s_3\}, \{s_4\}\)  
  - **Actual State**: \(s_2\)  
  - **Event**: \(A = \{s_0, s_2, s_4\}\) (copper hits the threshold)  
  - **Bet**: Alice sells and Bob buys a contract at price $0.65. If \(A\) occurs, Bob receives $1 from Alice; otherwise, Alice receives $1 from Bob.  
  - **Meet Cell at \(s_2\)**: The meet is the coarsest common refinement: \(\{s_0\}, \{s_1\}, \{s_2\}, \{s_3\}, \{s_4\}\). At \(s_2\), the meet cell is \(\{s_2\}\).  

  ### Why Both Expect to Gain
  - **Alice’s Interim Calculation**: At \(\{s_1, s_2\}\), \(P(A \mid \{s_1, s_2\}) = P(s_2) / P(\{s_1, s_2\}) = \frac{2/9}{4/27 + 2/9} = \frac{6}{10} = 0.6\).  
    Expected profit from selling: \(0.65 - 0.6 = 0.05 > 0\).  
  - **Bob’s Interim Calculation**: At \(\{s_2, s_3\}\), \(P(A \mid \{s_2, s_3\}) = P(s_2) / P(\{s_2, s_3\}) = \frac{2/9}{2/9 + 2/27} = \frac{6}{8} = 0.75\).  
    Expected profit from buying: \(0.75 - 0.65 = 0.1 > 0\).  
  - **Mutual Knowledge of Posteriors**:  
    - Alice knows Bob’s posterior is always 0.75 in \(\{s_1, s_2\}\) (since at \(s_1\), Bob’s cell is \(\{s_0, s_1\}\), and \(P(A \mid \{s_0, s_1\}) = \frac{4/9}{4/9 + 4/27} = 0.75\); at \(s_2\), it is 0.75).  
    - Bob knows Alice’s posterior is always 0.6 in \(\{s_2, s_3\}\) (since at \(s_3\), Alice’s cell is \(\{s_3, s_4\}\), and \(P(A \mid \{s_3, s_4\}) = \frac{1/9}{2/27 + 1/9} = 0.6\)).  
    Neither revises their posterior upon hearing the other’s, as they already know it.  
  - **Mutual but Not Common Knowledge of Acceptance**: At \(s_2\), Alice knows she sells, and Bob knows he buys. Alice also knows Bob’s posterior (0.75), so she infers he buys. Bob knows Alice’s posterior (0.6), so he infers she sells. Thus, both know both accept the bet. However, at \(s_1\) (in Alice’s cell), Bob’s cell is \(\{s_0, s_1\}\), where Alice’s posterior is \(P(A \mid \{s_1, s_2\}) = 0.6\) (unchanged), but if the state were \(s_1\), Alice would still sell, and Bob would still buy. Crucially, at \(s_3\) (in Bob’s cell), Alice’s cell is \(\{s_3, s_4\}\), where her posterior is 0.6, and she sells. But Bob at \(\{s_2, s_3\}\) knows Alice sells, and Alice at \(\{s_3, s_4\}\) knows Bob buys, so mutual knowledge holds. The failure of common knowledge occurs at the meet cell \(\{s_2\}\), as \(s_2\) is not reachable from states where acceptance might differ (e.g., \(s_4\), where Bob’s cell is \(\{s_4\}\), and he buys, but Alice at \(\{s_3, s_4\}\) sells, so no issue). The key is that the event "both accept" is not common knowledge because the meet cell \(\{s_2\}\) is a singleton, and higher-order knowledge requires larger sets.  

  ### Why Neither Result is Contradicted  
  - **Agreement Result Failure**: The agreement result requires common knowledge of the posteriors. Here, Alice’s posterior (0.6) and Bob’s (0.75) are mutual knowledge at \(s_2\) but not common knowledge. Common knowledge would require all states in the meet cell \(\{s_2\}\) to agree, but since the meet is a singleton, it holds trivially. However, the posteriors are unequal, and the common-knowledge antecedent fails because the meet cell is not the whole space; at \(s_0\), Alice’s posterior is \(P(A \mid \{s_0\}) = 1\) (if \(s_0\) occurs, \(A\) occurs), differing from Bob’s.  
  - **No-Trade Result Failure**: The no-trade result requires common knowledge that both accept the bet. Here, acceptance is mutual knowledge at \(s_2\) but not common knowledge. Common knowledge fails because the meet cell \(\{s_2\}\) does not contain states where acceptance differs (e.g., \(s_4\) has both accepting), but iterated knowledge breaks down: at \(s_3\) (in Bob’s cell), Alice knows they both accept, but Bob does not know that Alice knows they both accept (since at \(s_3\), Alice’s cell \(\{s_3, s_4\}\) includes \(s_4\), where Bob buys, but Alice does not consider \(s_4\) when at \(s_3\)).  

  ### What is Doing the Work  
  The key structural feature is the **asymmetric overlap in information partitions**: Alice’s cell \(\{s_1, s_2\}\) intersects Bob’s cell \(\{s_2, s_3\}\) only at \(s_2\), creating a "chain" of disjoint beliefs. Removing this (e.g., making partitions symmetric) would restore agreement. If acceptance were public and iterated:  
  - **Step 0**: Both accept at \(s_2\).  
  - **Step 1 (Mutual Knowledge)**: Alice and Bob know the other accepts (as in the case).  
  - **Step 2 (Alice’s higher-order)**: Alice knows Bob knows she accepts (true, as at \(s_1\) and \(s_2\), Bob’s cell ensures he knows).  
  - **Step 3 (Bob’s higher-order)**: Bob knows Alice knows he accepts. At \(s_2\), Bob’s cell is \(\{s_2, s_3\}\). If \(s_3\), Alice is at \(\{s_3, s_4\}\), where she knows Bob’s posterior (0.75) and infers he buys, so Bob knows Alice knows.  
  - **Step 4 (Common Knowledge)**: All orders converge. The bet collapses: at \(s_2\), Alice realizes Bob knows she knows, prompting her to recalculate using the meet cell \(\{s_2\}\). At \(\{s_2\}\), \(P(A \mid s_2) = 1\) (since \(s_2 \in A\)), so Alice’s selling profit becomes \(0.65 - 1 = -0.35 < 0\), and she withdraws. Similarly, Bob recalculates at \(\{s_2\}\) and sees expected profit \(1 - 0.65 = 0.35 > 0\), but without Alice, no trade occurs.  

  ### The Strongest Objection  
  A proponent of the strong reading (common prior alone prevents mutually profitable speculation) might argue:  
  1. **Gains are ex-interim, not ex-post**: The gains are conditional expectations at \(s_2\), but ex-post, only one outcome occurs (here, \(A\) happens, so Alice loses). This mirrors real-world adverse selection: traders suspect opponents know more, deterring bets.  
  2. **Lack of common knowledge is artificial**: In practice, repeated interaction or market mechanisms (e.g., order books) reveal intentions, so common knowledge emerges quickly. The sealed-order mechanism is a technical trick to suppress this.  
  3. **Prior-free reasoning dominates**: People avoid bets not from common priors, but from winner’s-curse fears (e.g., Bob worries Alice’s sell order signals her high-posterior states like \(s_1\)).

  **Concessions and Defense**:  
  - Concede that real-world betting often involves prior-free caution. However, the case still establishes that common priors **do not logically preclude** mutually profitable bets; they only do so under common knowledge.  
  - Emphasize the case’s core lesson: common knowledge is distinct and necessary. Without conceding, stress that the objection conflates empirical deterrence (which may exist) with logical impossibility (which fails here). The case isolates the common prior’s role and shows it is insufficient without common knowledge. Use the ex-post outcome to discuss risk-neutrality’s limits, but affirm the interim gains are rational given the information.
