  Part 1: Show with a concrete example that Searcher-R's behavior depends on the order of presentation and that this is incompatible with a fixed ranking over options.

  Part 2: Address the reply that we should judge policies (with search costs) and discuss whether this rescues or trivializes satisficing.

  Part 3: Discuss the criteria for rationality that would make Searcher-R criticizable or praiseworthy, considering internal consistency, fit with environment, and computational feasibility.

  We'll write the exam question, then a model answer, then a marking scheme.

  ---

  **Exam Question (for a 90-minute take-home):**

  **Decisions Under Constraints: Final Assessment**

  **Instructions:** Answer all parts of the question. The total mark is 20. You have 90 minutes. Do not consult any external resources.

  **Background:** We consider an agent called Searcher-R that must choose an option from a sequence presented one at a time. The agent does not know the utilities of options until it inspects them, and inspection incurs a fixed cost. The agent has an aspiration level that starts at A₀ and adjusts over time according to the following rules:

  1. When an option is inspected, the agent learns its utility. If the utility meets or exceeds the current aspiration level, the agent accepts that option and stops searching.
  2. After accepting an option with utility U, the agent ratchets its aspiration level: the new aspiration becomes max(current aspiration, β * U), where β is a fixed fraction between 0 and 1 (0 < β < 1). The aspiration level never decreases after an acceptance.
  3. If the agent inspects m consecutive options without accepting, it drops the aspiration level by a fixed step δ (but never below A₀). The drop occurs after the m-th rejection and before the next inspection.

  The agent cannot inspect all options because of the inspection cost. The goal is to find a good option without incurring excessive inspection costs.

  **Question:**

  **(a) [4 marks] Order-Dependent Behavior and Fixed Ranking**

  Consider a scenario with exactly three options, with utilities 10, 20, and 30. Assume the following parameters for Searcher-R:

  - A₀ = 15
  - β = 0.5
  - m = 2 (after 2 consecutive rejections, drop aspiration by δ)
  - δ = 5

  Show two different orders of presentation for these three options such that:

  - In one order, Searcher-R accepts the option with utility 20.
  - In a different order, Searcher-R rejects the option with utility 20 (and eventually accepts another option).

  Explain why no agent that maximizes a fixed ranking over the options (i.e., always chooses the same best option regardless of order) could exhibit both these behaviors.

  **(b) [8 marks] Policies and Search Costs**

  A critic might argue: "Once we include the cost of search in the objective function, any stopping rule (including Searcher-R's) can be seen as optimal for some search cost. Therefore, satisficing (as in Searcher-R) is just a special case of optimization, and the distinction is trivial."

  Does this argument rescue satisficing (by showing it is a form of optimization), trivialize it (by reducing it to optimization), or something in between? Explain your reasoning, addressing both the representation of behavior (how the agent acts) and the prescription of behavior (what the agent should do). In your explanation, consider the following:

  - The difference between a fixed ranking over options and a policy that depends on the sequence of options and the agent's state (like the aspiration level).
  - The concern that by adjusting the search cost after the fact, one can always make any behavior look optimal (the "unfalsifiability" worry).

  **(c) [8 marks] Rationality of Searcher-R**

  What does it mean to call Searcher-R "rational" or "irrational"? Your answer should address:

  1. **Internal consistency:** Does Searcher-R's behavior avoid self-contradiction? (For example, does it ever choose an option that it previously rejected when the same option is presented again in the same state? Note: Searcher-R does not see the same option twice in our model, but consider the logic of its choices.)
  2. **Fit with the environment:** How might the performance of Searcher-R depend on the statistical properties of the environment (e.g., the distribution of utilities and the cost of search)? 
  3. **Feasibility of the standard:** If we criticize Searcher-R for not being an optimizer, is that criticism fair given that Searcher-R has limited computational resources? Conversely, if we praise it for being ecologically rational, what does that mean?

  In your discussion, distinguish between a third-person perspective (an external observer judging the agent) and a first-person perspective (the agent itself, given its constraints). Conclude by stating under what conditions you would consider Searcher-R rational.

