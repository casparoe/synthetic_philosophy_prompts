  ### Exam Question: Decisions Under Constraints (90-minute take-home)

  **Total Marks: 20**  
  **Instructions:** Answer all parts. Write clearly and concisely. Assume no internet access. Define any non-engineering terms you introduce.

  ---

  **Background: Searcher-R Agent**  
  Searcher-R selects from options presented one at a time in an uncontrolled order. Each option has a hidden utility revealed only upon inspection; inspection costs a fixed amount. Searcher-R:  
  - Accepts the first option meeting/exceeding its current **aspiration level** (starts at \(A_0\)).  
  - After acceptance: **Ratchets** aspiration to \(\max(\text{current aspiration}, \beta \times U)\), where \(U\) is the utility accepted (\(0 < \beta < 1\)). Aspiration never decreases post-acceptance.  
  - After \(m\) consecutive rejections: **Drops** aspiration by a fixed step \(\delta\) (never below \(A_0\)).  

  ---

  **Questions:**  
  **1. Order-Dependent Behavior and Fixed Rankings (4 marks)**  
  Consider options with utilities: **5**, **15**, and **25**. Searcher-R has parameters:  
  - \(A_0 = 10\), \(\beta = 0.6\), \(m = 2\), \(\delta = 4\).  

  Demonstrate two orders of presentation:  
  - In Order A, Searcher-R **accepts** the option with utility 15.  
  - In Order B, Searcher-R **rejects** the option with utility 15 (and accepts another).  

  Explain why an agent maximizing a **fixed ranking** (e.g., always preferring 25 > 15 > 5) could not exhibit both behaviors.  

  **2. Policies vs. Optimization (8 marks)**  
  Critic's argument: "Adding search costs to the objective function makes any satisficing rule (like Searcher-R’s) optimal for *some* cost. Satisficing is thus either:  
  - A trivial redescription of optimization, or  
  - Not a genuine alternative to it."  

  Does this argument **rescue** satisficing (by showing it aligns with optimization), **trivialize** it (by reducing it to optimization), or something in between? Address:  
  - The difference between a fixed ranking over options and a **policy** (which depends on search history).  
  - Whether "post-hoc search costs" make optimization **unfalsifiable** (i.e., always explainable after the fact).  

  **3. Rationality of Searcher-R (8 marks)**  
  Define conditions under which Searcher-R is "rational" or "irrational" by discussing:  
  - **Internal consistency**: Does it avoid self-contradiction? (e.g., rejecting an option it would accept in identical states).  
  - **Fit with environment**: How might performance depend on utility distributions/search costs?  
  - **Feasibility of standards**: Can Searcher-R be fairly criticized for not optimizing, given its computational limits?  
  Distinguish **third-person** (external observer) and **first-person** (agent’s capabilities) perspectives. Conclude: When is Searcher-R rational?  

  ---

  ### Model Answer (700 words)  
  **1. Order-Dependent Behavior**  
  **Order A (Accepts 15)**: Options: [15, 5, 25].  
  - Inspect 15: \(15 \geq 10\) → Accept. Ratchet: \(\max(10, 0.6 \times 15) = \max(10, 9) = 10\).  
  **Order B (Rejects 15)**: Options: [5, 25, 15].  
  - Inspect 5: \(5 < 10\) → Reject (count=1).  
  - Inspect 25: \(25 \geq 10\) → Accept. Ratchet: \(\max(10, 0.6 \times 25) = \max(10, 15) = 15\).  
  - *Result*: 15 is never inspected.  
  To reject 15, use Order C: [5, 15, 25].  
  - Inspect 5: \(5 < 10\) → Reject (count=1).  
  - Inspect 15: \(15 \geq 10\) → Accept. Ratchet: 10.  
  - *But we need rejection*: Adjust \(A_0 = 16\) for Order B:  
    - Order B: [5, 15, 25] → Inspect 5: \(5 < 16\) → Reject (count=1).  
    - Inspect 15: \(15 < 16\) → Reject (count=2 → drop: \(16 - 4 = 12\), but never below \(A_0=16\) → 16).  
    - Inspect 25: \(25 \geq 16\) → Accept.  
    - *Result*: 15 is rejected.  

  **Why Fixed Rankings Fail**:  
  An agent with a fixed ranking (e.g., 25 > 15 > 5) would always choose the highest-ranked option *when available*, regardless of order. Searcher-R’s order-dependent acceptance/rejection of 15 violates this. Fixed rankings ignore search history and aspiration dynamics.  

  **2. Policies vs. Optimization**  
  The argument **trivializes satisficing** by conflating *representation* with *prescription**:  
  - **Representation**: Any behavior *can* be redescribed as "optimizing" by adding post-hoc costs. This is unfalsifiable and vacuous—like claiming a falling rock "optimizes" gravitational potential energy.  
  - **Prescription**: Optimization *prescribes* maximizing a pre-defined function. Satisficing *prescribes* stopping at "good enough" under computational limits. Searcher-R’s policy (e.g., ratcheting after acceptance) is not derived from maximizing a utility function; it’s a heuristic for complex environments.  
  - **Key distinctions**:  
    - **Fixed ranking vs. policy**: Optimization ranks *outcomes*; satisficing uses *procedures* (e.g., "stop at first \(U \geq A\)").  
    - **Unfalsifiability**: Arbitrary search costs can rationalize *any* behavior post-hoc, making optimization non-predictive.  
  Satisficing is a genuine alternative when optimization is computationally infeasible. It is "rescued" only if we redefine optimization so broadly it loses meaning.  

  **3. Rationality of Searcher-R**  
  - **Internal consistency**: Searcher-R is consistent if it never encounters identical states (same aspiration, utility, rejections) but makes contradictory choices. Since options are unique and states evolve deterministically, it avoids self-contradiction.  
  - **Fit with environment**:  
    - In **rich environments** (many high-utility options), ratcheting improves outcomes.  
    - In **sparse environments** (few high-utility options), aspiration drops after \(m\) rejections prevent excessive search.  
    - **Ecological rationality**: Success depends on environment structure (e.g., utility distribution, search costs). If utilities cluster near \(A_0\), Searcher-R performs well; if utilities are unpredictable, it may fail.  
  - **Feasibility of standards**:  
    - **Third-person**: An omniscient observer might call Searcher-R "irrational" for not calculating optimal policies. But this ignores **procedural rationality** (feasibility given limits).  
    - **First-person**: Given inspection costs and unknown options, Searcher-R cannot compute optimal policies via **dynamic programming** (systematic valuation of all paths). Demanding optimization is unfair.  
  - **Conclusion**: Searcher-R is rational if:  
    1. It is internally consistent.  
    2. Its heuristics match the environment (e.g., ratcheting in high-variance utility streams).  
    3. It uses feasible computations—**boundedly rational** (good enough, not optimal).  

  ---

  ### Marking Scheme (20 marks)  
  **Must-Hit Moves** (4 marks each):  
  1. **Order-dependence vs. fixed rankings**:  
     - *Award*: Shows concrete orders and explains fixed rankings ignore history/state.  
     - *Engineer error*: "Aspiration adapts, so it’s still optimizing."  
  2. **Policy (satisficing) vs. outcome (optimization)**:  
     - *Award*: Distinguishes representing behavior (post-hoc) from prescribing actions (pre-defined).  
     - *Engineer error*: "If it stops, it’s maximizing net utility."  
  3. **Unfalsifiability of post-hoc costs**:  
     - *Award*: Notes that arbitrary costs make optimization untestable.  
     - *Engineer error*: "We can always define costs to fit the data."  
  4. **First-person feasibility**:  
     - *Award*: Judges Searcher-R by its capabilities, not an omniscient standard.  
     - *Engineer error*: "It’s irrational if it doesn’t maximize."  
  5. **Ecological rationality**:  
     - *Award*: Ties rationality to environment fit, not just behavior.  
     - *Engineer error*: "Rational = always optimal outcomes."  

  **Grade Bands**:  
  - **A (18–20)**: Hits all 5 moves; clear definitions; no conceptual errors.  
  - **B (15–17)**: Hits 3–4 moves; minor gaps (e.g., vague on unfalsifiability).  
  - **C (12–14)**: Hits 2–3 moves; confuses policy/outcome; omits environment.  
  - **D/F (<12)**: Misses >2 moves; treats satisficing as "broken optimization."  

  ---

  ### Definitions  
  - **As-if representation**: Describing behavior as optimization *after observing it*, without claiming the agent actually optimizes.  
  - **Reservation price**: In economics, the lowest utility a seller accepts or highest a buyer pays; here, analogous to aspiration level.  
  - **Dynamic programming**: Breaking a decision problem into smaller subproblems; requires full knowledge of options/computational resources.  
  - **Ecological rationality**: Rationality judged by fit between a heuristic and environment structure.  
  - **Procedural vs. substantive rationality**: Procedural focuses on feasible processes under constraints; substantive focuses on optimal outcomes.
