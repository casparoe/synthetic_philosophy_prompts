     B. The two embedded sentences express the same proposition, but the belief reports convey additional information about how Lois is thinking of the person.
     C. The two embedded sentences express the same proposition, but the belief reports are made true by different relations between Lois and that proposition (depending on the way of thinking).

  3. Lois Lane runs toward Superman but away from Clark Kent. Does this behavioral difference show that the cognitive significance of "Superman" and "Clark Kent" is different in a way that goes beyond just her beliefs?
     A. Yes.
     B. No.

  4. Dr. Smith was present when a single lab specimen was given two code names, "Twin-1" and "Twin-2", and has always used them interchangeably knowing they refer to the same thing. For Dr. Smith, does the identity statement "Twin-1 is Twin-2" have the same cognitive significance as "Twin-1 is Twin-1"?
     A. Yes.
     B. No.

  5. The names "Vulcan" (once thought to name a planet between Mercury and the Sun) and "Neith" (once thought to name a moon of Venus) both turned out to be empty (they have no referent). Is the identity statement "Vulcan is Neith" meaningful and possibly informative?
     A. Yes.
     B. No.

  6. Consider the identity statement "1+1=2". Is it more informative than the statement "2=2"?
     A. Yes.
     B. No.

  7. You see a video feed of a person (not realizing it's you) doing something embarrassing. Later, you learn that the person in the video is you. Before learning this, the statement "I am that person in the video" would have been informative. What is the source of this informativeness?
