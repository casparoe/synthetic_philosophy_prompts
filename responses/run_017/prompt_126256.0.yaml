          - If they bet heads, expected winnings: P(heads|exist) * 1 = (1/(1+N)) * 1
          - If they bet tails, expected winnings: (N/(1+N)) * 1
          - So they prefer tails.

     - **Second regime (split pot equivalent - individual based):**
          - Bet heads: P(heads|exist) * 12 = (1/(1+N)) * 12
          - Bet tails: P(tails|exist) * 1 = (N/(1+N)) * 1
          - With N=12, both are 12/13.

     - But note: in the heads world, the prize for being correct is 12 bars, while in the tails world, the prize for being correct is 1 bar. This difference in prize size is what makes them indifferent.

     - **Now, what about SSA vs SIA in the literature?** They often coincide in this simple case, but the principles are different. SSA uses a sampling perspective, while SIA uses a conditioning on existence. They differ in other scenarios, like the Doomsday argument.

     - **For the session, we will proceed with these two regimes and show that in the first regime, betting tails is better, while in the second, they are indifferent.**

     - **The Presumptuous Philosopher:** In between the two regimes, we can have a round where they are given the option to skip the experiment and just get the answer from anthropic reasoning. We can say: "Before we run the next regime, would you like to skip the coin flip and just assume that the coin is tails? If you do, we will give you a fixed prize (say 1 chocolate bar) if tails is correct, and nothing if heads is correct." But then they don't get to bet. We can offer this choice to each observer individually.

     - **Steps:**
          - After assigning observers (again, without revealing the outcome), we give each observer a choice:
              - Option A: Participate in the betting as usual (for the current regime).
              - Option B: Skip the experiment and take a fixed bet on tails for a prize of 1 chocolate bar if tails is correct.
          - We then reveal the coin and pay accordingly.

     - In the first regime (fixed prize per observer), if they skip and take the fixed bet on tails, they get 1 bar if tails. If they participate, they can bet tails and also get 1 bar if tails, or they can bet heads and get 1 bar if heads. But since they prefer tails, skipping to bet tails is the same as participating and betting tails. So they might be indifferent. But if they skip, they get 1 bar only if tails, and by skipping they don't have to think. 

     - In the second regime (split pot equivalent), if they skip and take the fixed bet on tails, they get 1 bar if tails. If they participate, they can bet heads and get 12 bars if heads (with probability 1/13) or bet tails and get 1 bar if tails (with probability 12/13). The expected winnings from betting tails: 12/13, same as before. But the skip option gives them 1 bar if tails, so expected winnings: P(tails|exist) * 1 = 12/13. So it's the same as betting tails. But if they bet heads, they can get 12/13 too. So they might prefer to participate and be able to choose.

     - Alternatively, we can have the skip option be: we will use anthropic reasoning to assign you the bet that maximizes your expected winnings. In the first regime, that's tails. In the second, it's indifferent. So we might just say they get the expected winnings of the best bet? That's too vague.

     - **Perhaps the presumptuous philosopher is about using anthropics to avoid an experiment.** So after the first round, we tell them that in the next regime, they have the option to skip the evidence and get the answer from anthropic reasoning. We will charge them a small fee (maybe they have to give back one chocolate bar if they win) to make it interesting.

     - But given time, we might skip this or do it as a separate round.

  ### Session Outline

  **Total time: 90 minutes**

  1. **Introduction (10 minutes):**
     - Explain the setup: fair coin, heads creates a world with 1 observer, tails with N observers (N=12 in our case). They will be assigned to be observers or not based on the coin flip. The flip is hidden.
     - They will be given envelopes with instructions. They must not communicate and not reveal their status to others.
     - There will be two parts, with different prize structures.

  2. **First Regime: Fixed Prize per Observer (25 minutes)**
     - **Setup:** 
          - Flip the coin in secret.
          - If heads, prepare 1 envelope with "You are an observer. Please bet on heads or tails. If you bet correctly, you will win 1 chocolate bar." and 11 with "You are not an observer. Thank you for participating."
          - If tails, prepare 12 envelopes with "You are an observer. Please bet on heads or tails. If you bet correctly, you will win 1 chocolate bar."
          - Distribute envelopes randomly.
     - **Activity:**
          - Participants open envelopes. Observers write their bet (heads or tails) on a slip and hand it in.
          - Non-observers do nothing.
     - **Reveal and payout:** Reveal the coin. For each observer who bet correctly, give 1 chocolate bar.

  3. **Discussion (10 minutes):**
     - Ask observers to share their thought process. Did they bet heads or tails? Why?
     - Ask non-observers how they felt.
     - Do not lecture on anthropics yet.

  4. **Second Regime: Split Pot Equivalent (25 minutes)**
     - **Setup:** 
          - Flip the coin again (or use a new flip) in secret.
          - Envelopes as before, but with new instructions for observers: 
              - "If you bet heads and the coin is heads, you win 12 chocolate bars.
              - If you bet tails and the coin is tails, you win 1 chocolate bar.
              - Otherwise, you win nothing."
          - Distribute.
     - **Activity:**
          - Observers bet.
     - **Reveal and payout:** Reveal the coin. Pay each observer according to their bet and the outcome.

  5. **The Presumptuous Philosopher (10 minutes):**
     - Before the second regime, we can say: 
          - "We are experts in anthropic reasoning. We can tell you that based on the fact that you exist, the coin is more likely to be tails. You have the option to skip the betting and just take a guaranteed bet on tails. If you do, and the coin is tails, you will win 1 chocolate bar. If the coin is heads, you get nothing. Would you like to skip the betting and take this option?"
          - They make this choice individually.
     - Then proceed with the second regime, but those who skipped don't bet. They get 1 bar if tails.

  6. **Debrief (20 minutes):**
     - Map the experiences to the theories:
          - In the first regime, most observers probably bet tails. Why? Because they are more likely to exist in a tails world. This is SIA (or SSA) giving P(tails|exist)=12/13.
          - In the first regime, if they bet tails, they win 1 bar if tails. The total payout in the tails world is 12 bars, while in heads world it's 1 bar. But each individual only cares about their own bar. The equivalence: using a 1/2 prior and then summing the payoffs, we would also prefer the action that pays out more in total? But note: in this case, the action "bet tails" pays 1 bar to the bettor if tails, and 0 if heads. The expected total payout from everyone betting tails: if heads, 0; if tails, 12 bars. Expected total: 6 bars. If everyone bets heads: if heads, 1 bar; if tails, 0. Expected total: 0.5 bars. So betting tails is better for total utility. And under individual utility with SIA probability, they also prefer tails. So it aligns.
          - In the second regime, they were indifferent. Why? Because the prize in the heads world is 12 bars (so big if they win and heads) but heads is less likely, and in the tails world the prize is small (1 bar) but likely. So expected winnings are equal. This is because the prize structure exactly balances the probability.
          - In the split pot setup, if we had done it as a fixed pot split, then in the tails world each gets 1 bar if they win, but in heads world the one gets 12 bars. And the win condition is collective. But in our simplified version, we captured the essence.
     - Your split-pot calculation: In the true split pot, if the world wins, then the pot is split. So the expected winnings for an observer:
          - If they bet heads: then the world wins only if the coin is heads and the world guesses heads. But the world's guess depends on others. In our simplified version, we avoided that by making the payoff depend on the world size and their individual bet. But in the true split pot, if the world's guess is determined by majority, then their vote might affect the majority. But if they are pivotal, that's complicated. In the case where they have no effect (because the world is large), then their expected winnings are approximately P(world wins and coin is heads) * (12 bars) / 1 observer in heads? No. 
          - For an observer in the heads world: if the world wins (which requires the one observer to bet heads), then they get 12 bars. So if they bet heads, they win 12 bars with prob 1 (if the coin is heads). But they don't know the coin. They assign P(heads|exist)=1/13. So if they bet heads, they get 12 bars with prob 1/13. 
          - For an observer in the tails world: if the world wins (which requires the majority to bet tails? and coin tails), then they get 1 bar. The probability: P(tails and majority bets tails | exist) = P(tails|exist) * P(majority bets tails | tails) ≈ 12/13 * 1 (if we assume they all bet tails) = 12/13. So expected winnings: 12/13 * 1 bar. 
          - But if in the tails world they bet heads, then they might be pivotal? But in a large group, their vote might not matter. So approximately, they expect 1 bar with prob 12/13 if they bet tails, and 12 bars with prob 1/13 if they bet heads. So again, they are indifferent.
          - Therefore, in both versions, we get indifference.

     - The SSA/SIA fight: in this setup, both gave the same probability. But in other setups (like the Doomsday argument), they differ. We can mention that briefly.

     - Total vs average: 
          - In the first regime, SIA plus own-payoff = 1/2 prior plus total payoff (because the total payoff is maximized by betting tails).
          - In the second regime, SIA plus own-payoff is indifferent. This corresponds to average payoff? In the heads world, the one observer gets 12 bars -> average is 12. In the tails world, each gets 1 bar -> average is 1. So under a 1/2 prior, the expected average payoff if they bet heads: (1/2)*12 + (1/2)*0 = 6 (if heads wins, else 0). But wait, the average payoff depends on the world and the bet. It's not clear. But under the total payoff: 
              - If they bet heads: if heads, total payoff=12; if tails, 0. Expected total: 6.
              - If they bet tails: if heads, 0; if tails, total payoff=12 (if we consider the prize as 12 bars split into 1 bar each, so total is 12). Expected total: 6.
              - So total is the same for both bets. That's why they are indifferent under total utilitarian. And under average utilitarian:
              - If they bet heads: if heads, average=12; if tails, average=0 (but undefined). Expected average: (1/2)*12 + (1/2)*0 = 6.
              - If they bet tails: if heads, 0; if tails, average=1. Expected average: (1/2)*0 + (1/2)*1 = 0.5.
              - So average utilitarian prefers betting heads? But that doesn't match the indifference. 

          - It's not directly comparable. Alternatively, the point is that the prize structure changes the optimization goal.

     - **Conclusion on the split-pot: It supports your reading that the disagreement is about the payoff structure. In the first regime, SIA (with own-payoff) and total utilitarian (with 1/2 prior) agree. In the second regime, they both are indifferent (total utilitarian is indifferent because both bets give the same expected total payoff).**

  7. **What can go wrong:**
     - **Clever one tries to game the pot:** In the second regime, if they coordinate or think strategically about others' bets. Prevent by isolating and no communication.
     - **One who points out they can see others:** We must enforce no communication and no peeking. Use envelopes and have them sit apart.
     - **Conflates "I exist" with "I'm this particular person":** They might think that if they are the heads observer, they are a specific person. But in our setup, they are randomly chosen. So it's symmetric.
     - **Time management:** With 12 people, handing out envelopes and collecting bets might take time. Have helpers or do it efficiently.
     - **Revealing the coin:** Make sure it's done fairly.

  8. **What cannot be reproduced:**
     - The part where you couldn't have failed to exist: in our setup, the non-observers are in the room. They exist but are not playing. We cannot simulate the true absence. We have to explain at the end that in the thought experiment, the non-observers don't exist at all. So we are faking it by having them not participate.
     - The indexical uncertainty: in the room, they know they are in a specific room with specific people. But in the thought experiment, the observers in a world are the only ones. We have to abstract from that.

  We'll run the session as described. It should be engaging and illustrate the points.
answer: |-
  Below is a complete, ready-to-run session plan for your 90-minute rationality group. It uses your coin-toss setup, avoids upfront lectures, and makes participants experience the anthropic disagreement through real bets and payoff changes. The design forces them to confront how payoff structures (fixed vs. split pot) shift their betting behavior before introducing SSA/SIA.

  ---

  ### **Session Plan: Anthropic Betting Tournament**  
  **Duration:** 90 minutes  
  **Participants:** 12 people (split into hidden groups)  
  **Materials:** 
  - 1 coin (or RNG app)
  - Envelopes (12 per round, labeled with roles)
  - Betting slips
  - Prizes (e.g., chocolate bars, $1 bills)
  - Whiteboard for debrief
  - Timer

  **Key Mechanics:**  
  - **Hidden groups:** Participants don’t know if they’re in the "Heads world" (1 observer) or "Tails world" (N observers). This is enforced via sealed envelopes.  
  - **Real stakes:** Bets use small prizes. 
  - **Two payoff regimes:** Fixed prize per observer (Round 1) vs. split pot (Round 2).  
  - **Presumptuous philosopher:** Participants can skip evidence and trust anthropic reasoning in Round 3.  

  ---

  ### **Phase 1: Setup (5 min)**  
  **Goal:** Explain rules without theory.  
  **Script:**  
  > “We’re running a betting game. A fair coin will flip:  
  > - **Heads:** Creates a world with only 1 observer.  
  > - **Tails:** Creates a world with N observers (today, N=3 for simplicity).  
  >  
  > You’ll get an envelope telling you if you’re an observer. **You can’t see others’ envelopes or talk.** If you’re an observer, you’ll bet Heads/Tails on the coin. Prizes depend on the round. After bets, we reveal the coin and pay out.”  

  **Why N=3?** With 12 people, run 3 parallel games (4 people per game: 1 potential Heads observer, 3 Tails observers). Adjust N as needed.

  ---

  ### **Phase 2: Round 1 – Fixed Prize per Observer (25 min)**  
  **Payoff:** Every correct observer wins a fixed prize (e.g., 1 chocolate bar).  

  **Steps:**  
  1. **Flip & Assign:**  
     - Flip a coin (hidden).  
     - **Heads:** Put 1 "OBSERVER" and 3 "NON-OBSERVER" envelopes in a set.  
     - **Tails:** Put 4 "OBSERVER" envelopes in a set.  
     - Repeat for 3 sets (each set is a separate game).  

  2. **Distribute Envelopes:** Randomly hand envelopes to each group of 4.  

  3. **Bet (2 min):**  
     - Observers write “Heads” or “Tails” on a slip.  
     - *Prompt:* “You exist. Bet based on your credence. Win a chocolate bar if correct.”  

  4. **Reveal & Payout:**  
     - Reveal the coin.  
     - Correct observers get 1 chocolate bar each.  

  **Predictable Behavior:**  
  - Most bet Tails. In Tails worlds, 3 people win; in Heads, 1 wins.  
  - **Debrief later:** They’ll feel Tails is "obvious" (SIA-like).  

  ---

  ### **Phase 3: Round 2 – Split Pot (25 min)**  
  **Payoff:** One fixed pot (e.g., 3 chocolate bars) per world. If correct, split equally among observers.  

  **Steps:**  
  1. **Same Setup:** New coin flip, new envelopes (same as Round 1).  

  2. **Bet (2 min):**  
     - Observers bet Heads/Tails.  
     - *Prompt:* “If your world is correct, the pot (3 chocolates) is split equally among observers. Win your share if correct.”  

  3. **Reveal & Payout:**  
     - Reveal coin.  
     - In correct worlds: Divide the pot.  
       - *Heads world:* 1 observer gets 3 chocolates.  
       - *Tails world:* Each of 3 observers gets 1 chocolate.  

  **Predictable Behavior:**  
  - Mixed bets. Heads bets increase (high individual payoff in Heads).  
  - **Debrief later:** They’ll feel conflicted (indifference under SIA).  

  ---

  ### **Phase 4: Round 3 – Presumptuous Philosopher (15 min)**  
  **Goal:** Let them skip evidence using anthropic reasoning.  

  **Setup:**  
  - New flip, new envelopes.  
  - Before betting, offer a choice:  
    > “Option A: Bet normally (Round 2 rules).  
    > Option B: Skip betting. Assume Tails via anthropic reasoning. If Tails is correct, win a smaller fixed prize (e.g., 1 chocolate). If Heads, get nothing.”  

  **Steps:**  
  1. Observers choose A or B in secret.  
  2. Reveal coin. Payout accordingly.  
  3. **Aftermath:** Ask how it felt. Most skip in Tails worlds (win); regret in Heads worlds.  

  ---

  ### **Phase 5: Debrief (20 min)**  
  **Goal:** Map experiences to theory. Use whiteboard.  

  1. **Recreate Decisions:**  
     - *Round 1 (fixed prize):*  
       - What they did: Bet Tails. Felt "right" because winning was frequent in Tails worlds.  
       - **Theory:**  
         ```  
         SIA: P(Tails | you exist) = N/(N+1) = 3/4.  
         Equivalence: 1/2 prior + maximize total prizes → Prefer Tails.  
         ```  
       - *Visual:* Show total prizes: Tails pays 3, Heads pays 1.  

     - *Round 2 (split pot):*  
       - What they did: Indifferent or mixed bets.  
       - **Theory:**  
         ```  
         SIA: P(Tails | exist) = 3/4, but payoff if Tails: 1/N = 1/3 of pot.  
         Expected payoff:  
           - Bet Heads: (1/4) * 3 = 0.75  
           - Bet Tails: (3/4) * 1 = 0.75  
           → Indifference.  
         SSA: Still prefers Heads (if using "average payoff" equivalence).  
         ```  
       - *Your claim validated:* Split pot doesn’t dissolve disagreement—SSA still leans Heads.  

     - *Round 3 (presumptuous philosopher):*  
       - Skipping felt risky in Heads worlds. Shows anthropic reasoning isn’t free evidence.  

  2. **Core Insight:**  
     - SSA/SIA isn’t just about existence—it’s about **what you optimize** (total vs. average payoff).  
     - SIA + selfish payoff ≈ 1/2 prior + total utilitarian.  
     - SSA + selfish payoff ≈ 1/2 prior + average utilitarian.  

  3. **Formalize on Board:**  
     - Write equations from your original argument.  
     - Highlight: Split pot makes SIA indifferent, but SSA isn’t.  

  ---

  ### **What Will Go Wrong (and Fixes):**  
  1. **"I can see others!"**:  
     - Participants peek at envelopes.  
     - **Fix:** Use opaque envelopes; enforce silence; separate groups physically.  

  2. **Clever one games the pot**:  
     - In split pot, someone bets Heads to "sabotage" or exploit.  
     - **Fix:** Clarify that payoffs depend only on coin outcome (no strategic voting).  

  3. **"I exist" ≠ "I’m this person"**:  
     - Confusion between indexical ("I exist") and specific identity ("I’m Alice").  
     - **Fix:** In debrief, clarify: "Your envelope says you exist, not who you are."  

  4. **Math overwhelm**:  
     - Some freeze at probability calculations.  
     - **Fix:** Focus on feelings first ("Why did you bet Tails?"), then map to theory.  

  ---

  ### **What You Can’t Reproduce**  
  - **"Couldn’t have failed to exist"**:  
    - In real life, if the coin is Heads, Tails observers "don’t exist." But in the game, they sit there as non-observers.  
    - **How to handle:** Post-activity, say:  
      > "In the thought experiment, non-observers don’t exist. We faked it with envelopes. But this means:  
      > - Under SIA, existing *upweights* worlds where observers are likely.  
      > - Under SSA, you’re a random sample of possible observers."  
      >  
      > Then show how envelopes simulated sampling (SSA) vs. conditioning (SIA).  

  - **True reference-class ambiguity**:  
    - The game assumes "observers" = participants. Real anthropics argue about reference classes (e.g., conscious beings).  
    - **How to handle:** Note in debrief: "We used a narrow class. Cosmologists might use ‘all possible humans’."  

  ---

  ### **Why This Works**  
  - **No lecture:** They *feel* the shift from Round 1 (Tails dominates) to Round 2 (indifference).  
  - **Payoff changes, not story:** Fixed vs. split pot is the only variable.  
  - **Room as lab:** Real hidden groups create indexical uncertainty.  
  - **Presumptuous philosopher is experiential:** They *choose* to skip and face consequences.  
  - **Debrief roots abstraction in concrete bets:** Their chocolate bars become probability weights.  

  This session turns your 2-hour argument into a visceral game—forcing your friend’s "obvious" SIA into dialogue with your payoff-structure view. The split-pot round even validates your algebra: SIA’s indifference reveals the total/average veil.
