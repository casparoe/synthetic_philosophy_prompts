  I’m a retired evolutionary biologist — did behavioural ecology and a bit of speciation work back in the day. I’m ok talking about selection pressures, adaptation, function, exaptation, drift, homology versus analogy, optimality modelling, niche construction, that sort of thing. I’ve only recently gotten into philosophy, so I don’t have the jargon and I’m never sure whats established versus whats just one camp shouting.

  I keep triping over this fight about original versus derived intentionality. Here’s how I half-understand it. Searle says conscious mental states have original (or intrinsic) intentionality: they are really about things in a way no artifact is. A coin-sorting machine built to sort US quarters — Dennett calls it a two-bitser, I think, and in the wandering version it gets moved to a country where the local coin happens to match quarters in weight and thickness, so it goes on sorting coins fine — only has derived intentionality, borrowed from the intentions of its designers and users. Dennett replies that this distinction won’t do the work Searle wants. If the machine’s discriminating behavior can come unmoored from its makers and pick up a new aboutness from its new environment, and if our own intentionality is itself a product of natural selection rather than of an intending designer, then either we have no original intentionality either, or derived intentionality is not the second-class status Searle takes it to be.

  I’m fluent enough in evolutionary biology to follow a technical paper, but philosophy jargon loses me fast. So please restate that whole dispute — Searle’s claim that artifacts have only derived intentionality and organisms have original intentionality, and Dennett’s two-bitser reply that our intentionality is derived too / or that the derived-original contrast is bogus — as faithfully as you can in the vocabulary I actually use: selection history, adaptation, function, exaptation, drift, designers versus selection, maybe host-symbiont or phylogenetic homology, whatever fits. Keep the translation honest: don’t smuggle in biological assumptions and call them a translation of the philosophy.

