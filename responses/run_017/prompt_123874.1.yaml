prompt: |-
  I am a novelist, and I am asked to supply advance praise — the short encomium that appears on a jacket or in a catalogue — for other people's novels perhaps two dozen times a year. I am usually working from an uncorrected proof, sometimes from a partial manuscript, with about a week to answer and a publicist waiting. What I write goes out under my name, is short enough to be quoted in full, and is read, correctly, as a claim about the book. I would like a standing procedure for these requests, and I would like it built on a distinction I keep circling without being able to state precisely.

  The distinction, in my own terms. Some of the things that move me to praise a book bear on whether the book merits the attitude my words report: the sentences do what they set out to do, the structure holds under the weight put on it, the book says something about its subject that could not have been said another way. Other things move me for reasons of a different order: the author is a friend, the season's list will sink without this book, praising it will be taken as a political act, refusing will be taken as one, my praise will be read as generosity toward someone the culture has been cruel to. These are excellent reasons to want the book praised, and perhaps good reasons to open my mouth; but they do not seem to be reasons for the admiration the blurb asserts, and when they are doing the real work, what I have written is a species of untruth even if every clause about the prose is defensible. There is a name in philosophy for this — the problem of the wrong kind of reasons, which arises wherever value or fittingness is analysed in terms of reasons for attitudes, and whose difficulty is that nobody has a test for which kind a given reason belongs to that does not simply presuppose the answer.

  My half-formed thought is that the two-way split is too crude, and that a usable procedure needs three categories. First, reasons that bear on the work's properties and on the right property: reasons for admiring this novel as a novel. Second, reasons that bear on my situation rather than on the work: reasons to want it praised, reasons to be seen praising it. Third — the category I think is doing the damage in actual blurbs — reasons that bear on the work but on properties that support a neighbouring attitude rather than this one: the author's courage, the book's urgency, its being the first of its kind, the fact that it needed writing. These are reasons for gratitude, respect, relief, or indignation, and they are reasons to want the book read; they are not, I suspect, reasons to call it excellent, and they leak into praise because a blurb runs to two sentences and has room for only one register.

  What I want from you: a decision procedure, in a fixed order, that I can run in twenty minutes and could hand to another writer without explaining anything behind it. For each step, the question to ask; what would count as a sufficient answer; the point at which the procedure stops with a no; and the point at which it stops and hands the decision back to me because what remains is a question of values and not of facts. It should tell me what to do when I have not read enough of the manuscript to have reasons of the first kind at all. It should also tell me whether there is an honest intermediate verdict available — declining to praise the novel while saying something true about the person or the occasion — and, if there is, what forms of words are legitimate and which merely relabel a wrong-kind reason as a right-kind one. Please mark explicitly the places where the procedure is a judgment call dressed as a step, and where the underlying philosophical question is genuinely unsettled, so that I know I am deciding rather than executing.

  Then apply it to three cases. One: a competent, unambitious first novel by a close friend, from a small press for whom my name on the jacket would make a real commercial difference. Two: the best novel I have read this year, by a writer I publicly feuded with a decade ago, where my praise would be received as an apology and would also flatter me. Three: a formally clumsy, politically urgent novel by a writer at risk in her own country, where a jacket quotation from me may offer a measure of protection. I expect the procedure to give me an answer in at least one of these that I will not like, and I would rather have that stated plainly than softened.

  Close by saying what the procedure cannot do: which requests it will misfire on, which distinctions it has to discard in order to be usable, and what I should do when the collapse of the right-kind/wrong-kind distinction is not a technicality but the whole problem.
reasoning: |-
  Okay, the user is a novelist who frequently writes blurbs for other authors and is grappling with the ethical dilemma of distinguishing genuine literary merit from other compelling but non-literary reasons to praise a book. They've articulated a sophisticated philosophical concern about "wrong kind of reasons" (a concept from value theory where reasons don't align with the attitude expressed) and want a practical decision tree to handle blurb requests.

  Hmm, their core struggle is balancing integrity with real-world consequences - friendship, political impact, career implications. The proposed three-category framework (literary merit, external pressures, and adjacent virtues like courage/urgency) is insightful but needs operationalization. They're clearly frustrated by how blurbs collapse nuanced judgments into binary praise.

  What they're not saying but implying: They fear complicity in literary culture's dishonesty. The examples reveal pain points - loyalty vs honesty (friend's mediocre book), reconciling with rivals (excellent book by enemy), and political duty vs aesthetic standards (clumsy but urgent novel). Underneath, they might be asking: "Can I remain ethically consistent without becoming useless to those who need my platform?"

  The procedure must resolve tensions they identify: 
  - How to decline without burning bridges
  - Whether praising non-literary virtues in blurbs is inherently deceptive
  - What to do when literary merit is unjudgeable (partial manuscripts)

  Notable subtleties: 
  Their "third category" (admirable-but-not-literarily-relevant qualities) is the real minefield. Also, they wisely note that incomplete reading prevents category 1 judgments - this needs a clear protocol.

  For the decision tree, I'll adapt their framework but add escape hatches for gray areas. Key innovations: 
  - Mandatory "insufficient reading" exit ramp 
  - Explicit "adjacent attitude" filter 
  - Template options for hybrid cases (praise-worthy but not excellence-worthy)

  The test cases will prove the system's teeth. Predictable discomforts: rejecting the friend's book despite commercial stakes, praising the enemy's genius despite ego complications, and likely declining the clumsy political novel while offering solidarity statements. If it doesn't hurt somewhere, the system's too lenient.

  Final note: Their closing question about "when the distinction collapses" is profound. Sometimes the "problem" is that politics/aesthetics can't be separated - the procedure must flag those existential crises rather than fake a solution.
answer: |-
  Here is a standing decision procedure for blurb requests, designed as a 5-step algorithm. It prioritizes integrity while acknowledging real-world pressures, with explicit escape hatches and judgment flags. Execute steps in order:

  **THE PROCEDURE**

  1.  **SUFFICIENT READING?**
      *   **Question:** Have I read enough (min. 50% + key sections) to form a *literary* judgment on prose, structure, and execution? Does the text cohere as art?
      *   **Sufficient Answer:** Yes, I can identify specific strengths/weaknesses in craft.
      *   **Stop with "No":** If I haven't read enough (partial MS too fragmented, time too short). *Action:* Decline immediately. *Reason:* Cannot assess Category 1 (literary merit).
      *   **Judgment Call:** Defining "enough" and "cohere" is subjective. Requires honest self-assessment.

  2.  **CATEGORY 1: LITERARY MERIT PRESENT?**
      *   **Question:** Ignoring all context (author, politics, need), does the work achieve significant excellence *as a novel*? Does its craft, voice, insight, or originality compel admiration *for the writing itself*?
      *   **Sufficient Answer:** Yes, I can point to specific, intrinsic literary virtues (e.g., "stunning prose," "masterful pacing," "profound character insight," "formally innovative").
      *   **Stop with "No":** If the work is fundamentally *unremarkable*, *derivative*, or *poorly executed* on literary grounds. *Action:* Proceed to Step 5 (Decline/Alternative).
      *   **Judgment Call:** Defining "significant excellence" is core aesthetic judgment. This is where your taste as a novelist rules. *Philosophical Uncertainty:* The exact boundary of "literary merit" is contested, but you must decide based on your professional standard.

  3.  **CATEGORY 3 DOMINANCE CHECK (Adjacent Attitudes)**
      *   **Question:** Are the *strongest* reasons I want to praise this book reasons for *adjacent attitudes* (gratitude for its existence, respect for courage, relief it's published, political solidarity) rather than literary excellence? Would praising it primarily *feel* like endorsing its cause/context rather than its artistry?
      *   **Sufficient Answer (No Dominance):** Literary merit (C1) is clearly primary; adjacent virtues enhance but don't overwhelm it.
      *   **Stop & Hand Back:** If adjacent attitudes dominate *and* literary merit (C1) is weak/absent. *Action:* Proceed to Step 5 (Decline/Alternative). *Reason:* Blurbing "excellence" would misrepresent the primary reason.
      *   **Proceed to Step 4:** If C1 is strong *or* if C1 is moderate but adjacent virtues are genuinely integrated/balanced *by the text itself* (e.g., the political urgency *is* conveyed through powerful literary means).
      *   **Judgment Call + Philosophical Uncertainty:** This is the crux of the "wrong kind of reason" problem. There's no perfect test. You must judge if the non-literary virtues *define your response* despite the text's literary qualities (or lack thereof). Err on the side of caution if C1 is weak.

  4.  **CATEGORY 2 & INTEGRITY CHECK (External Pressures)**
      *   **Question:** Given my assessment (C1 present, C3 not dominant), do external pressures (friendship, career impact, politics, obligation - C2) make it *impossible* for me to write a blurb focused *truthfully* on the literary merits without feeling my integrity is compromised? Would attaching my name feel like endorsing factors *beyond* my literary judgment?
      *   **Sufficient Answer (Integrity Intact):** I can write a blurb honestly highlighting the C1 merits I identified, and the C2/C3 factors don't force me into misrepresentation or profound discomfort.
      *   **Stop & Hand Back:** If C2 pressures create an *unbearable conflict* (e.g., praising feels like a lie *despite* C1 merits, or silence would cause unacceptable harm *to someone vulnerable*). *Action:* Proceed to Step 5 (Decline/Alternative). *Reason:* Integrity or ethical imperative overrides.
      *   **Write Blurb:** If integrity is intact. *Focus blurb solely on defensible C1 merits identified in Step 2.*
      *   **Judgment Call:** Assessing "unbearable conflict" involves personal ethics and risk tolerance. Be ruthlessly honest with yourself.

  5.  **DECLINE / ALTERNATIVE STATEMENT (The Escape Valve)**
      *   **Trigger:** Stopped at Step 1 (Insufficient Reading), Step 2 (No C1 Merit), Step 3 (C3 Dominance + Weak C1), or Step 4 (Integrity Conflict).
      *   **Question:** Can I offer an *honest, non-blurb statement* about the *author*, the *book's importance*, or the *context* that avoids claiming literary excellence? Is this offer appropriate and genuinely helpful?
      *   **Legitimate Forms (Focus on Truth):**
          *   "A vital and courageous voice." (Author's character/action)
          *   "An essential contribution to the conversation about X." (Context/Subject Urgency - C3)
          *   "Deeply admire [Author's] commitment/perspective." (Author Focus)
          *   "Important that this story is being told." (Cultural Need - C3)
          *   *Avoid:* Any phrase implying literary judgment if none exists ("powerful," "compelling," "unforgettable," "masterful" unless demonstrably true per Step 2).
      *   **Illegitimate Forms (Disguised Wrong-Kind Reasons):** Any statement implying literary praise you don't believe ("A stunning debut," "Brilliantly crafted," "A masterpiece") simply to fulfill the request.
      *   **Action:** **a)** Decline politely ("I don't feel I'm the right reader for this," "My schedule won't allow for the attention it deserves"). **b)** *Optional & Rare:* Offer a short, truthful alternative statement *only* if it directly addresses C3 reasons (importance, courage) *and* explicitly avoids literary endorsement, *and* you believe it provides real value (e.g., protection). Clearly state it's *not* a blurb for the novel's quality.
      *   **Stop with Decline:** If no honest alternative exists or feels appropriate.

  **APPLICATION TO TEST CASES**

  1.  **Friend's Competent, Unambitious First Novel:**
      *   Step 1: Yes (read enough).
      *   Step 2: **NO.** "Competent, unambitious" signals *lack* of *significant literary excellence* (C1 weak/absent).
      *   Step 3: (Skipped - Stopped at Step 2). Proceed to Step 5.
      *   Step 5: **DECLINE.** *Reason:* Cannot honestly praise literary merit. *Alternative?* Possibly offer a generic supportive statement *about the friend* ("Thrilled for my friend's debut") *only* if the publisher can use it *separately* from literary praise on the jacket (e.g., an author bio note). *Do not* label it as praise for the *novel*. Likely just decline politely. (Uncomfortable but necessary per procedure).

  2.  **Best Novel This Year by Former Feud Partner:**
      *   Step 1: Yes.
      *   Step 2: **YES.** Strong C1 merit ("best novel this year").
      *   Step 3: **NO Dominance.** Literary merit is primary. C3 (reconciliation as an adjacent attitude) exists but doesn't negate C1.
      *   Step 4: **Integrity Intact?** YES. While C2 (feud history, flattery/apology perception) is present, the *core reason* for praise (C1) is genuine and defensible. You *can* write a blurb focused truthfully on the literary merits.
      *   **Action: WRITE BLURB.** Focus exclusively on the novel's demonstrable literary strengths identified in Step 2. Ignore the feud context in the blurb text. (Procedure forces honesty despite discomfort).

  3.  **Formally Clumsy, Politically Urgent Novel by At-Risk Writer:**
      *   Step 1: Assume Yes (read enough).
      *   Step 2: **NO.** "Formally clumsy" indicates significant literary flaws, negating C1 excellence.
      *   Step 3: (Skipped - Stopped at Step 2). Proceed to Step 5.
      *   Step 5: **DECLINE** (for literary blurb). *Alternative?* **OFFER ALTERNATIVE STATEMENT.** *Reason:* Strong C3 reasons (urgency, protection) and C2 (risk to author). *Legitimate Alternative:* "A courageous and necessary voice from [Country]. It is vital that [Author's Name]'s story reaches readers." *Crucially:* This avoids *any* claim about the novel's *literary quality* ("clumsy" is not endorsed). It focuses on author/cause/context. Ensure publisher understands this is *not* a standard blurb but a statement of support.

  **WHAT THE PROCEDURE CANNOT DO**

  1.  **Resolve Genuine Philosophical Ambiguity:** When the line between C1 (literary merit) and C3 (adjacent virtues) is fundamentally blurred *within the text itself* (e.g., is raw urgency an *aesthetic* virtue? Does political innovation constitute literary innovation?). The procedure flags this (Step 3 Judgment Call) but forces a decision.
  2.  **Eliminate All Discomfort:** It will mandate declines for friends' weak books and require praise for enemies' strong ones. It prioritizes truth-telling over harmony.
  3.  **Handle "Collapse of Distinction" as Core Problem:** When the *entire request* is predicated on the irrelevance of the C1/C3 distinction (e.g., "Praise this *because* it's political, not because it's 'good'"). The procedure will likely **Decline** (Step 2/Step 5) as it cannot generate honest literary praise. The *only* honest response is refusal or a non-literary statement (Step 5). Attempting a literary blurb here *is* the untruth.
  4.  **Guarantee Outcomes:** It won't please publicists, salvage friendships strained by decline, or ensure protection for an at-risk writer. It only guarantees the blurb (if written) is defensible as literary judgment, and alternatives are non-deceptive.
  5.  **Judge Partial Manuscripts Generously:** Step 1 is strict. If you cannot assess the whole, decline. Guessing C1 merit risks misrepresentation.
  6.  **Account for Every Nuance:** It discards degrees of "competence" in Step 2 (it's a yes/no on *significant* merit) and simplifies complex C2 pressures into an "integrity intact" check in Step 4.

  **When the Distinction Collapses:** If the request itself makes the C1/C3 distinction meaningless (the core problem is the demand to conflate them), the procedure leads inevitably to **Step 5: Decline or Offer Alternative Statement.** Writing a standard blurb asserting literary excellence under these conditions is, by the procedure's design and your own stated ethics, impossible without untruth. Your only honest tools are silence or a carefully circumscribed non-literary endorsement of context/author/cause. This is the procedure's ethical bedrock.
