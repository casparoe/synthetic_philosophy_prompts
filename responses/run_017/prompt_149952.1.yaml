answer: |-
  Here are ten tightly focused questions addressing the specified cruxes, sequenced from strongest to weakest in her position's resources, with deflections pre-blocked and follow-ups targeting likely responses:

  **1. Conservation Problem: Quantifiability of Self**  
  Does the total "amount" of a person that persists posthumously remain fixed (conserved) or can it increase through proliferation of high-fidelity custodians? What if the sum exceeds the original?  
  *Likely Reply: It can increase; self isn't conserved.*  
  *Follow-up: Then is the "degree" of persistence just a metaphor if there’s no upper bound or fixed unit?*

  **2. Grain Problem: Minimal Realization Threshold**  
  When a custodian holds only a coarse, proprioception-lacking model, what specific pattern elements *must* be realized for it to count as *part* of the deceased’s self (not just a representation)?  
  *Likely Reply: Core narrative, values, decision-rules—abstract functional profile.*  
  *Follow-up: If proprioception/bodily feedback is incidental, why isn’t *any* abstract model (e.g., a biography) partial persistence?*

  **3. Accretion Case: Causation vs. Fidelity**  
  The archivist builds a behaviorally superior model without causal contact. Is the spouse’s fuzzier but causally linked model metaphysically *more* the deceased, or is fidelity primary?  
  *Likely Reply: Causal-historical embedding matters; it grounds the pattern’s identity.*  
  *Follow-up: If the pattern is abstract, why does its origin in the original loop matter more than its current structure?*

  **4. Deflection Blocker: Abstraction & Measurability**  
  If the pattern is abstract, how do we *measure* degrees of realization (e.g., 20% "present" in C) without a substrate-specific benchmark? What quantifiable properties determine "degree"?  
  *Likely Reply: Functional/computational similarity metrics relative to the original loop.*  
  *Follow-up: If similarity is judged by external criteria (behavior, speech), isn’t this just representation-tracking, not persistence?*

  **5. Reductionism Relation**  
  Is custodial persistence just reductionist personal identity (e.g., psychological continuity) plus very liberal realization conditions, or does it assert a novel *kind* of identity that standard reductionism denies?  
  *Likely Reply: Novel—it’s partial, distributed identity via pattern-sharing.*  
  *Follow-up: Does this mean reductionists must accept persistence if they accept pattern-realization, or is "partial identity" an extra claim?*

  **6. Slow-Replacement Case: Plural Perspectives**  
  As the custodian’s self-model rewrites in the deceased’s idiom, when does her brain host *two* distinct loops? Can both "I"-perspectives be simultaneously realized as distinct first-personal centers?  
  *Likely Reply: No—only one unified loop exists; it integrates both models.*  
  *Follow-up: If only one "I" exists, in what sense is the deceased’s perspective *present* rather than just represented?*

  **7. Phenomenology of Presence**  
  The only *experience* occurring is the custodian’s. How is the deceased’s "I" *persisting* distinct from it merely *influencing* another’s consciousness?  
  *Likely Reply: Persistence is the pattern’s realization; experience is the custodian’s vehicle, not the pattern itself.*  
  *Follow-up: If persistence is pattern-realization without subjective presence, isn’t the deceased’s "I" now a zombie—functional but non-experiential?*

  **8. Deflection Blocker: Intuition & Evidence**  
  What empirical finding *could* falsify custodial theory? E.g., if neural decoding showed stored "person models" lack the structure to run sub-personally as loops?  
  *Likely Reply: Evidence that models don’t function causally in cognition as the theory requires.*  
  *Follow-up: If such evidence arose, would you abandon the metaphysics or reinterpret "realization"?*

  **9. Slow-Replacement: Identity Threshold**  
  In slow-replacement, if the custodian’s original loop is fully overwritten by the deceased’s pattern, is the custodian dead? Or does the surviving loop inherit both identities?  
  *Likely Reply: The surviving loop is a hybrid; identities merge.*  
  *Follow-up: Can two persons metaphysically merge into one? What happens to the original’s "I"?*

  **10. Consolation & Purpose**  
  If someone finds no comfort believing a diminished, distributed shard of their loved one persists abstractly, is custodial theory failing as metaphysics or as grief technology? What does it offer them?  
  *Likely Reply: It’s truth, not therapy. It offers understanding, not necessarily solace.*  
  *Follow-up: If the theory consoles only some, is its value primarily explanatory—and if so, what does it explain better than rival views?*

  ---

  **Sequence Rationale:**  
  1. Starts strong with **conservation** (posthumous existence is core appeal).  
  2. **Grain problem** challenges realization depth but allows abstract defense.  
  3. **Accretion case** forces choice between causation/fidelity, straining abstraction.  
  4. **Abstraction deflection blocked** by demanding measurable degrees.  
  5. **Reductionism** clarifies metaphysics but reveals extra claims.  
  6. **Slow-replacement (perspectives)** questions unity of self in one brain.  
  7. **Phenomenology** highlights absence of subjective presence.  
  8. **Intuition deflection blocked** by demanding falsifiability.  
  9. **Slow-replacement (identity)** confronts merger/erasure paradox.  
  10. **Consolation** ends where theory’s existential/practical resources are thinnest.  

  **Follow-up Strategy:** Targets likely replies without strawmanning, pressing coherence, quantifiability, and explanatory value while respecting the view's internal logic. Tone remains rigorous but open.
