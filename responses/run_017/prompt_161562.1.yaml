prompt: |-
  I'm in a philosophy of mind seminar this term and we've been going through the extended mind stuff, and I started writing down our professor's verdicts case by case cos my flatmate swears she's just intuiting them one at a time while I think she's actually running a rule (we have a stupid bet going). Her verdicts so far: Inga remembering the museum address in her head — belief, nobody argues about that one. Otto with his notebook — yes, a genuine belief, not just him using a tool. The same information in a chip wired into his brain that he can't introspect — still yes, and she said if location made a difference the whole parity argument would be dead in the water. Long multiplication done on pen and paper — yes, extended cognitive process, she was weirdly firm about that. A notebook somebody planted in Otto's bag, full of false addresses, that he has never once opened — no, she said it's just paper in his bag. A woman with a body camera that silently backs up everything she sees to a cloud account whose password she's lost — no. Looking up a phone number by asking her phone out loud — yes, she called it Otto with better hardware.

  The case I actually want (my flatmate refuses to commit before the prof does, which is cheating honestly): Mira has pretty severe prosopagnosia and wears glasses that do face recognition and apear—sorry, print a name and two or three facts under whoever she's looking at. The labels just show up; she never asks for them and never consults anything; she has no idea how the recognition works and couldn't check it if she tried; and she never typed in or corrected any of the data, the company built the whole thing out of her old photo library. She also insists she doesn't trust it and will say out loud that the glasses think that's Dana — but she greets Dana by name, asks after her kid, gets annoyed when Dana cancels, i.e. she behaves exactly like someone who recognizes her. So: is the prof going to say Mira believes that's Dana?

  What I'm less interested in than the answer itself is the rule. Is she just running the usual gloss — reliable, easily accessible, automatically invoked, trusted — in which case Mira's distrust is either irrelevant or not really distrust given how she acts? Or is it something stricter: that the resource has to be something the agent has endorsed or made her own at some point, or that she has to actively recruit it rather than being fed by it? Those all fit her seven verdicts as far as I can tell and they come apart on this one, and I can't tell which she's committed to. Give me your best guess with the reasons for preferring it, and then tell me which single further variant would actually force the rules apart — my candidates are (a) Mira spends a year curating and correcting the database herself, (b) the same device but she has to tap the frame and ask who before a name appears, (c) the same device implanted so the name just comes to her with no glasses involved at all. Which of those, or which other one, settles it, and what does each answer commit her to about the skull-and-skin boundary she said doesn't matter?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a philosophy of mind seminar focusing on the extended mind thesis. The user and their flatmate have a bet about whether their professor is using a consistent rule for her verdicts on various cases or just intuiting each one individually. The user provided seven of the professor's past verdicts and now wants to predict her ruling on a new case involving Mira with prosopagnosia and face-recognition glasses.

  First, I need to analyze the professor's previous decisions to identify patterns. The key cases: Inga (internal memory) is belief; Otto (notebook) is extended belief; implanted chip (same info as Otto) is still belief; long multiplication with pen and paper is extended cognition; planted notebook (unopened) isn't belief; body camera with inaccessible cloud backup isn't; voice-activated phone lookup is extended ("Otto with better hardware").

  Looking at these, the professor seems to emphasize constant availability, automatic access, functional equivalence to biological memory, and integration into behavior. Trust or endorsement appears secondary—Otto trusts his notebook, but the implanted chip case shows trust isn't necessary if it functions reliably. The body camera fails because it's not accessible, while the planted notebook isn't integrated into Otto's cognitive processes.

  Now, the Mira case: Her glasses automatically provide names and facts without her active input. She claims not to trust them, but her behavior (greeting Dana by name, asking about her kid) shows functional reliance. The lack of trust might be a red herring if the professor prioritizes functional role over subjective attitude. The glasses are reliable, always available, automatically triggered, and integrated into her actions—matching the criteria from previous cases like Otto and the chip.

  The user wonders about possible underlying rules: Is it about reliability/accessibility, or does it require endorsement/active recruitment? The professor's rulings suggest the former. For instance, the implanted chip case shows that location and introspection don't matter, and the long multiplication example values the functional role of external tools regardless of endorsement. The planted notebook and body camera cases fail because they're not properly integrated or accessible.

  To distinguish between these rules, the user proposes three variants. Let me evaluate each:

  (a) Mira curates the database: This adds endorsement, making the extended belief even clearer. If the professor says yes here but no to the original Mira case, it would mean endorsement is necessary. But given her past rulings, she's likely to say yes to both, as endorsement isn't crucial.

  (b) Tapping to activate: This introduces active recruitment. If the professor considers this extended cognition, it aligns with the phone lookup case (active query). If she says no to the original auto-display but yes here, active recruitment might be key. But her "Otto with better hardware" comment suggests efficiency doesn't change the status, so she might see tapping as functionally similar.

  (c) Implanted device: With no external tool, this mirrors the chip case. The professor already ruled that location doesn't matter, so she'd likely say yes. If she says no to the glasses but yes to the implant, that violates her parity principle.

  The variant that best forces a distinction is (b) the tapping requirement. If the professor requires active recruitment, she might reject the original auto-display case but accept the tapping version. If she accepts both, then automaticity isn't necessary. Her past rulings suggest she values function over form, so she'd likely accept both, but it's the strongest test.

  The user also wants to know what this implies about the skull-skin boundary. The professor's chip and implant cases show she rejects that boundary—it's about function, not location. If she rules differently based on internal vs. external in Mira's case, it would contradict her earlier stance. Consistency would require her to treat the implanted and glass-based systems the same if they function identically.
answer: |-
  Based on your professor's established pattern of verdicts and the principles underlying them, here's my best analysis of how she'll rule on Mira and the likely rule she's following, plus a variant to definitively test the competing interpretations.

  ### Prediction for Mira's Case
  **Verdict: YES, Mira *does* believe that's Dana.**  
  **Reasoning:** Your professor's rule prioritizes **functional integration, automaticity, and reliable access** over conscious endorsement or active "consultation." Mira's glasses:
  1.  **Reliably provide information:** They're built from her own photo library and function accurately.
  2.  **Are constantly available and automatically invoked:** The labels appear *without* any action or request from Mira; they're triggered by her perceptual act of looking. This mirrors biological face recognition.
  3.  **Are deeply integrated into her behavior:** She *acts* on the information seamlessly (greeting by name, referencing personal details, reacting emotionally to plans). Her verbal denial of trust is functionally irrelevant because her behavior demonstrates *de facto* reliance and trust (it guides her actions successfully and predictably).
  4.  **Meet the Parity Principle:** The function (providing identity/personal info upon visual perception) is identical to non-prosopagnosic biological recognition. Your professor explicitly dismissed location (brain vs. notebook vs. chip) as irrelevant.

  Her previous rulings support this:
  *   **Otto's Notebook/Chip:** Access is key (constant, easy, automatic retrieval). Endorsement/introspection isn't required (chip verdict).
  *   **Long Multiplication:** Pen/paper becomes part of the cognitive *process* when reliably integrated. No "endorsement" needed beyond using the tool.
  *   **Planted Notebook:** Not accessed/integrated → Not a belief.
  *   **Body Camera:** Information not accessible → Not a belief.
  *   **Phone Query ("Otto with better hardware"):** Active recruitment is acceptable as long as access is easy/reliable and integrated into the cognitive goal.

  **Mira's distrust:** Your professor seems to treat this as an *epiphenomenal verbal report* that doesn't alter the functional role of the information in guiding behavior. Her actions show the belief is operative, regardless of her meta-cognitive statement. The system *works for her*.

  ### The Rule She's Likely Using
  **"Functional Integration & Automatic Availability":** An external resource constitutes part of an agent's cognitive system (and thus the information it provides counts as a belief) if and only if:
  1.  **Reliable & Constant Availability:** The resource is consistently available when needed and reliably provides the relevant information.
  2.  **Automatic/Transparent Access:** The information is accessed automatically and transparently (without significant cognitive effort or deliberate "lookup") as part of the relevant cognitive task (e.g., perception, recall, calculation). It feels like "just knowing."
  3.  **Behavioral Integration:** The information is directly and reliably integrated into the agent's actions and reactions without a separate "translation" step. It guides behavior seamlessly.
  4.  **Parity of Function:** The resource performs a function that, if done internally, would be uncontroversially considered cognitive.

  **Why this fits better than "Endorsement" or "Active Recruitment":**
  *   **Chip Case:** Rejects endorsement (can't introspect) and active recruitment (info just appears). Functional integration wins.
  *   **Long Multiplication:** Doesn't require endorsing the *content* of each step, just reliable integration into the *process*. Active recruitment is part of the process, but the *result* is functionally integrated belief.
  *   **Planted Notebook/Body Camera:** Fail on availability/access, *not* lack of endorsement or active use.
  *   **Phone Query:** Active recruitment is acceptable *because* it's functionally equivalent to an easy internal recall process (fits "Automatic/Transparent Access" due to ease and integration).

  ### The Crucial Variant to Force the Rules Apart
  Your variant **(b) The same device but she has to tap the frame and ask "who?" before a name appears** is the **strongest test**.

  *   **Functional Integration Rule (Predicted YES):** The information is still reliable, constantly available *on demand*, easily accessed with minimal effort (a simple tap/command), and directly integrated into her behavior (she greets Dana based on it). It's functionally similar to consciously trying to recall a name internally, which we'd still call a belief. It fits the "Phone Query" verdict ("Otto with better hardware" – tapping is just a slightly less sleek interface than voice).
  *   **Endorsement/Active Recruitment Rule (Predicted NO?):** If your professor requires either prior endorsement of the *content* or a stronger form of "making it her own" beyond just using the tool, *or* if she requires completely passive/automatic invocation (no action whatsoever), she might say **NO**. The need to tap makes it feel more like a "lookup" than transparent access.

  **Why (a) and (c) are less decisive:**
  *   **(a) Mira curates/corrects database (YES):** Both rules likely say YES. Functional Integration is satisfied (it's still reliable/automatic/behaviorally integrated). Endorsement is clearly present. Doesn't force a split.
  *   **(c) Implanted device (name just comes) (YES):** Both rules likely say YES. Functional Integration is satisfied. Endorsement isn't needed (chip precedent). Location doesn't matter (professor's explicit point). The skull boundary is irrelevant. Doesn't test the core dispute about externals.

  **What variant (b) commits her to regarding the skull boundary:**
  *   **If she says YES to (b):** It reinforces that the skull boundary is irrelevant. What matters is the functional role and ease of access/integration. A simple action (tap) doesn't break the cognitive extension; it's just part of the process. This is consistent with her long multiplication and phone query rulings. The boundary vanishes based on function.
  *   **If she says NO to (b):** It suggests she draws a stricter line at *completely passive/automatic* access for external resources, potentially preserving a *functional* boundary even if not a physical one. Internal beliefs can involve effortful recall, but externals might need to be "as seamless as biology" to count. This might create a *functional* double standard inconsistent with her acceptance of the phone query (which also requires an action). It would raise questions about why the minimal action of tapping breaks extension, but the action of querying a phone doesn't.

  **Conclusion:** Your professor is almost certainly using the **Functional Integration & Automatic Availability** rule. Mira's distrust is overruled by her behavior, showing the glasses are functionally integrated. To definitively settle the bet with your flatmate, push for a ruling on the **Tapping Variant (b)**. A **YES** confirms the functional rule and utterly dissolves the skull boundary. A **NO** suggests a hidden threshold for passivity in external resources that might subtly reintroduce a functional boundary, conflicting slightly with the phone query case. Good luck with the bet!
