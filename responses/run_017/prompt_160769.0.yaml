prompt: |-
  I used to run a wet lab, and now in retirement I poke around philosophy, so forgive me if I use the wrong words. Something puzzles me and I'd like the implicit theory spelled out.

  Take two things we actually do. First: if an adult walks past a shallow pond where a toddler is face down and doesn't wade in because it would ruin his shoes, we treat him as having done something seriously wrong — Singer's pond case leans on exactly that, and plenty of countries criminalise failing to render assistance. But nobody thinks a person who spends their savings on a new kitchen instead of on insecticide-treated bednets has done anything wrong; we call that generosity, and optional.

  Second, the bit I keep chewing on: the health service here will fund a treatment that costs something like £25,000 per year of decent life gained, and refuse one that costs more, and we accept that a particular named patient then dies of a treatable condition. Same shape as the pond, it seems to me — known person, known cost, known outcome if we don't pay — except we do it by committee and call it not merely permissible but required.

  So what do these two practices presuppose? Do they need the thought that nearness or identification matters morally in itself, or can you get the whole pattern out of something else: an acts/omissions line, a division of labour between individuals and institutions, the fact that in the health case thousands of others could also pay, or just the idea that a duty stops being a duty once it stops being cheap? I'd like you to separate what the practice strictly requires from what it merely fits well with, and say what would actually have to change in either practice if we dropped the near-and-identified requirement.

  My own half-baked version: charity evaluators put the cost of saving a life through bednet distribution in the low thousands of dollars, so why not treat donating as rescue-at-a-distance and let people discharge the duty that way? Does my version break anything the ordinary version doesn't, and does it make the pond intuition look like an accident of proximity?

  Finish with one line: Verdict: <short phrase saying whether the practice strictly presupposes that nearness or identification matters, or whether several theories would license it>.
reasoning: |-
  Okay, let me tackle this user's query. They're a retired wet lab researcher now dabbling in philosophy, so I need to avoid jargon while being precise. Their main puzzle is the moral inconsistency between the pond case (where failing to save a nearby child is wrong) versus not donating to distant charities (seen as optional) and healthcare rationing (where denying treatment is accepted). 

  First, I should map the core tension: proximity seems to drive moral obligations in practice. The user wants to know if this presupposes nearness/identification as morally fundamental. I recall Parfit's discussion of partiality vs. impartiality - but the healthcare example complicates things because it's institutional. 

  The user's half-baked solution involves treating bednet donations as "rescue-at-a-distance." Interesting! But would that weaken the pond intuition? I need to test that against standard ethical frameworks. Act/omission distinction probably doesn't hold up (Singer demolished that). Division of labor arguments might explain healthcare rationing but not the charity case. 

  What about demandingness? If saving every distant life is obligatory, ordinary life collapses - but that's Singer's "ought implies can" point. However, the user's proposal sets a clear donation threshold ($X=life saved), making obligations manageable. 

  Institutional role morality seems key for healthcare: NICE isn't an individual but a steward of collective resources. That framework doesn't apply to the pond bystander. 

  For the verdict: practices don't strictly require nearness as fundamental. Multiple theories (scarcity, demandingness, institutional roles) can justify the asymmetry without spatial morality. The user's donation-as-rescue idea coheres with effective altruism and avoids proximity bias - though it might make charity feel more obligatory than society currently treats it. 

  Final check: Did I address all sub-questions? 
  - Presuppositions: covered in ethical analysis 
  - Strict requirements vs. fits: separated in institutional vs personal contexts 
  - User's solution: evaluated as viable alternative 
  - Verdict: clearly stated
answer: |-
  Your puzzle cuts to the heart of moral psychology and institutional ethics. Let's dissect the presuppositions and separate what's strictly required from what's compatible.

  ### Core Practices & Their Presuppositions
  1.  **The Pond Case (Individual Near Rescue):**
      *   **Strictly Presupposes:** A strong, immediate, *agent-relative* duty to prevent grievous harm when:
          *   The harm is *directly observable* and *imminent*.
          *   The agent is *uniquely positioned* (or perceives themselves to be) to prevent it at the moment.
          *   The cost to the agent is *minimal* relative to the harm prevented (ruined shoes vs. death).
      *   **Implied (but not strictly required):** Proximity and identification serve as powerful *psychological triggers* for recognizing the immediacy, uniqueness, and low cost. They make the duty salient and undeniable. However, the *core moral principle* invoked is the prohibition against allowing severe, easily preventable harm when one is uniquely able to prevent it at minimal cost. Proximity is often the *circumstance* creating uniqueness and salience, not necessarily the *source* of the duty itself.

  2.  **Not Donating Savings/Healthcare Rationing (Distant/Systemic Harm):**
      *   **Strictly Presupposes:**
          *   **Scarcity & Trade-offs:** Resources (individual savings, public health funds) are finite. Using them for one purpose necessarily means *not* using them for another potential good (e.g., kitchen vs. bednets; Treatment A for Patient X vs. Treatments B, C, D for Patients Y, Z, etc.).
          *   **Demandingness Limits:** There is a limit to how much sacrifice (financial, emotional, societal resources) can be *morally required* of an individual or institution before an action becomes supererogatory (beyond duty) or the cost becomes prohibitive relative to the good achieved. The £25,000/QALY threshold embodies this for institutions.
          *   **Diffusion of Responsibility (Distant Harm):** When harm is distant, abstract, and preventable by many potential actors (thousands who could donate), the *unique positional duty* felt in the pond case evaporates. The duty becomes diffused.
          *   **Institutional Role Morality (Healthcare):** Public institutions have a specific mandate: to steward *collective* resources for the *overall* health of the population *fairly and efficiently*. This creates a positive duty *to* ration based on cost-effectiveness to maximize total health gain, even knowing specific individuals will die. This is fundamentally different from an individual bystander's negative duty *not to* ignore an immediate, unique rescue opportunity.

  ### What Would Change Without the "Near-and-Identified" Requirement?
  *   **Pond Case:** Very little. Removing the "near-and-identified" *trigger* doesn't change the core presuppositions: the *uniqueness* of the agent's position, the *immediacy/imminence* of the harm, and the *minimal cost* are still present and sufficient to ground the duty. The duty arises from the *situation*, not proximity *per se*. Proximity is just the usual context creating that situation.
  *   **Not Donating/Healthcare Rationing:** Significant implications:
      *   **Individual Donations:** If spatial/identificatory distance were morally irrelevant, *and* if preventing distant harm were equally obligatory as near rescue *when equally effective/cost-effective*, then *not* donating savings equivalent to the cost of saving a life (e.g., via bednets) *would* become morally wrong, akin to walking past the pond. The "optional generosity" framing would largely vanish for amounts below the cost-per-life-saved threshold. Your "rescue-at-a-distance" via high-impact charities would become the *standard way* to discharge a positive duty.
      *   **Healthcare Rationing:** Less change. The core presuppositions (scarcity, trade-offs, demandingness limits for collective resources, institutional duty to maximize overall benefit) remain robust justifications. The committee isn't ignoring a *unique, immediate, low-cost rescue opportunity* for a *specific identified person right in front of them*. They are allocating scarce resources *among many competing, future claims* based on systemic rules designed for fairness and efficiency. Distance/identification isn't driving the decision; resource constraints and the mandate to serve the population are.

  ### Evaluating Your "Rescue-at-a-Distance" Version
  *   **Does it break anything?** It challenges societal norms around charity being optional, potentially creating significant moral pressure/demandingness on individuals. It might feel counterintuitive to those strongly wedded to proximity/identification as *necessary* triggers for duty. It doesn't inherently break institutional rationing logic.
  *   **Does it make the pond intuition look like an accident?** **Yes, precisely.** It reveals that the intense, undeniable moral force we feel in the pond case stems largely from psychological salience (proximity, identification, immediacy) rather than a fundamental *moral* difference. If saving a life via bednets costs $X and is highly reliable, failing to donate $X when you have it readily available is, on this view, morally equivalent to wading into the pond *if* proximity/identification are not morally fundamental. The pond intuition *is* an accident of psychology and circumstance under this model.

  **Verdict: The practice strictly presupposes that *uniqueness of position, immediacy, and minimal cost* matter fundamentally; nearness/identification are powerful psychological triggers but not strictly required. Multiple theories (scarcity, demandingness limits, diffusion of responsibility, institutional role morality) license the asymmetry without needing nearness/identification as foundational moral principles.**
