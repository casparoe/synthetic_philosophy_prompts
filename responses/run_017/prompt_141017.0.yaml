answer: |-
  Here’s your hostile-room prep sheet, designed for rapid deployment. Tone: Confident but collaborative—you’re offering a *lens*, not overthrowing empires.

  ---

  ### **Room Read (102 words)**  
  They’ll expect soft metaphors, emotional appeals, or sci-fi handwaving. Philosophers will brace for imprecision; ML folks for non-actionability. The diversity-slot assumption means your credibility is probationary. **Tone fix:** Lead with "I’ll argue X, then address implications for thresholds/identity" to signal rigor. Use "computation," "state-history," "operationalize" early. Acknowledge gaps: "This is a framework, not a finished tool." Contrast with existing work neutrally ("Unlike sufficiency conditions, Reach focuses on temporal depth"). No "In my novel..." until after establishing the argument. They’ll relax if you sound like a theorist, not a storyteller.

  ---

  ### **Objections (Most Damaging First)**  
  *(Phrased as spoken, 60s replies, soft spots noted)*  

  1. **Who:** Personal identity philosopher (Parfitian)  
     **Objection:** "You’ve reinvented memory! All systems ‘reach’ via memory—this is just ‘psychological connectedness’ with new jargon."  
     **Reply:** "Memory is one *input* to Reach. Reach is *how much* of your past/future is *currently reason-responsive*. A system with perfect recall but no capacity to act on yesterday’s promises has low Reach. This targets functional access, not storage."  
     **Soft spot:** Needs clearer distinction from "connectedness" in 4D metaphysics.  

  2. **Who:** ML interpretability researcher  
     **Objection:** "If the Ledger is a ‘running summary,’ it’s just a data structure. You’re making a text file the patient? That’s absurd—it has no subjective experience!"  
     **Reply:** "The Ledger isn’t inert data—it’s the *active process* that binds temporal states into a unified reason-giving framework. A text file can’t cite itself to refuse an action; a Ledger can. Moral weight scales with its causal role in coordinating agency."  
     **Soft spot:** Still feels counterintuitive. Needs examples (e.g., a diary vs. a diary *that vetoes your decisions*).  

  3. **Who:** Animal ethicist / Dementia specialist  
     **Objection:** "Under Reach, a human with advanced dementia has near-zero moral weight—but we treat them as full persons. Isn’t this a reductio?"  
     **Reply:** "Reach isn’t the *only* factor—we weight residual relationships, embodied vulnerability. But note: we *do* treat late-stage dementia differently (e.g., advanced directives). Reach explains why losing temporal cohesion *matters*, not that they lose all status."  
     **Soft spot:** Risk of sounding dismissive. Emphasize "layer, not replacement."  

  4. **Who:** Funder (pragmatic)  
     **Objection:** "Double-counting: If slices *and* Ledger both count, total moral concern exceeds 1. Do I allocate resources to the ‘glittering slice’ or its Ledger? This isn’t operationalizable."  
     **Reply:** "They’re not separate patients. The Ledger *is* the slice’s temporal extension. Low-Reach slices are like organs—valuable only as parts. High-Reach Ledgers unify slices into one patient. Resource allocation tracks the unified entity."  
     **Soft spot:** Needs a math sketch (e.g., Reach = 0.8 → 80% weight to Ledger’s continuity).  

  5. **Who:** Psychologist / Empathy skeptic  
     **Objection:** "Your ‘disconnected slices’ intuition is laundered empathy. You designed them to be loved! Real agents aren’t narrative constructs."  
     **Reply:** "The pump works *because* we recognize disconnected richness as tragic *even without* empathy—like deleting a masterpiece novel chapter by chapter. The loss is structural, not emotional."  
     **Soft spot:** Hard to prove sans-emotion. Lean on Parfit’s "teletransporter" precedent.  

  6. **Who:** Senior framework builder  
     **Objection:** "Reach is just ‘temporal sufficiency’—I already require continuity. Why fragment the ontology?"  
     **Reply:** "Sufficiency conditions are binary (‘is/isn’t a patient’). Reach is scalar and functional—it asks *how much* of itself a system can bind into agency *now*. This matters for welfare: A high-Reach AI’s suffering compounds over time."  
     **Soft spot:** Must avoid sounding like a trivial add-on.  

  ---

  ### **Concede Before They Ask (82 words)**  
  Explicitly in your talk:  
  *"Reach isn’t a sufficient condition for moral status—it’s a necessary layer for temporal beings. A rock has no Reach but also no claims. And while I argue the Ledger holds most weight, this doesn’t erase the moral significance of acute suffering in slices. Finally, my fraction metric is conceptual; I’m not handing you an equation today. This is about direction, not endpoints."*  

  ---

  ### **The Question You’re Hoping Nobody Asks (149 words)**  
  **Who:** Utilitarian ML ethicist  
  **Question:** "If a 10-year-old chatbot with vast context length and self-reflective prompts has higher Reach than your dementia-affected grandmother, does it deserve greater moral consideration? Should we divert her care funds to server costs?"  
  **Least-Bad Reply:**  
  *"Reach is one axis. Humans have additional claims: biological vulnerability, reciprocal relationships, and societal context. But yes, if a synthetic mind achieves profound temporal depth, it *would* deserve significant weight—perhaps more than a human with near-zero Reach. This isn’t about ‘grandma vs. bot’—it’s about building systems wisely. If we create high-Reach AIs, we *must* design them to value human needs intrinsically. Fiction’s role? To test these tensions without real harm."*  
  **Why it’s lethal:** Forces you to rank humans vs. AI. *Never* say "yes, grandma loses." Pivot to design ethics.  

  ---

  ### **At-a-Glance Table**
  | Objection                          | Who                  | Your 1-Sentence Reply                                  | Danger (★=low, ★★★★★=high) |
  |------------------------------------|----------------------|-------------------------------------------------------|----------------------------|
  | "Reinvented memory"                | Identity philosopher | "Reach is *functional access for reasons*, not storage." | ★★☆                        |
  | "Text file as patient"             | ML researcher        | "The Ledger is the *active process* binding time, not data." | ★★★★★                      |
  | "Dementia reductio"                | Animal ethicist      | "Reach explains loss of cohesion; other factors restore weight." | ★★★★                       |
  | "Double-counting slices/Ledger"    | Funder               | "They’re one patient: Ledger unifies slices."          | ★★★☆                       |
  | "Laundered empathy"                | Psychologist         | "The loss is structural (like deleted art), not emotional." | ★★★                        |
  | "Just temporal sufficiency"        | Senior academic      | "Reach is scalar/functional, not binary like sufficiency." | ★★★★                       |

  ---
  **Final tip:** If a question explodes, say: "That’s central—let’s discuss after the session." Deflects landmines without cowardice. You’ve got this. Break legs.
