prompt: |-
  yo, I'm trying to write up the chapter on naturalizing mental content and I keep losing the thread, so I want the spec before I read any more of it. Give me the list of requirements that any naturalistic theory of mental content has to meet to count as adequate — where naturalistic means it has to build content out of materials that aren't themselves intentional or semantic (causation, function, selection history, information, whatever it wants to use), and where adequate means adequate for one specific job: grounding actual content attributions in empirical cognitive science, i.e. being the thing a working scientist could lean on when she says what some mechanism in some organism represents. Not adequate for winning a metaphysics seminar.

  For each requirement I want the case or consideration behind it — the concrete situation a theory that ignored that requirement would get wrong. At minimum grapple with: how a state can be about something and be wrong about it; how content manages to be about the distal thing rather than the proximal stimulation or some gerrymandered disjunction of causes; whether content has to come with correctness conditions at all and where a naturalistic story is supposed to get normativity from; how a creature represents something it has never encountered, and things that don't exist; what to say about a state that tracks something perfectly but that nothing downstream consumes and that nothing ever selected for; and whether content has to make a difference to what the system does or can just sit there doing no work.

  Two wrinkles I basically never see handled, so don't just hand me the standard list:

  1. Systems with no evolutionary history but a training history. Think of a model whose internal units get shaped by repeated rounds of a proxy objective, with a selection-ish filter on top — variants kept when the score improves, thrown away when it doesn't — but no reproduction, no lineage, no consequences for anything that could be called an organism. If a theory of content is going to be usable on those at all, what does it have to say, and what would have to be true of the training setup for one of those units to count as meaning something rather than merely being correlated? Turn that into a requirement.

  2. The reuse case. A mechanism that got whatever function it has from one kind of historical pressure and is now, reliably and usefully, doing something quite different. Does the content follow the old history or the current job? Whatever you think, state the requirement that your answer forces onto the theory — I care more about the requirement than about the verdict.

  Then: mark each requirement as non-negotiable versus a preference of one particular camp. Flag any pair you suspect can't be jointly satisfied, with the case that shows the clash — that's the part I'm most interested in, since if the list is internally inconsistent then that itself is the finding. And tell me which single requirement excludes the most candidate theories, and why it has that much force even though it sounds modest.

  A short scorecard at the end is fine — the two or three live families of approach (covariation/information-based, history-and-function-based, use or role-based), a line or two each on where they crack, no names and no citations, I've got the literature labels. Skip it if you think it'd be a distraction; the requirements and their motivating cases are the thing I actually want.
reasoning: |-
  Okay, the user is working on a chapter about naturalizing mental content and needs a list of requirements for a naturalistic theory. They want these requirements grounded in concrete cases where a theory would fail without them. They also have two specific wrinkles: systems without evolutionary history but with training, and the reuse case where a mechanism is repurposed. 

  First, I need to recall the core challenges in naturalizing content: misrepresentation, distal content, normativity, representation of the uninstantiated or non-existent, epiphenomenal states, and causal efficacy. The user wants each requirement tied to a concrete failure case. 

  For the first wrinkle, training-based systems like ML models. The key is to avoid handwaving and specify what in the training setup allows content attribution. The requirement here needs to address the lack of evolution but still account for function through optimization pressure. The toy model case shows that without downstream consumption or selection, correlation isn't enough. So the requirement must link function to the system's architecture and training goal.

  The reuse case is tricky. If a mechanism evolved for detecting predators is now used for detecting delivery trucks, does it represent predators or trucks? The requirement should force the theory to explain how current use interacts with historical function. The conflict here might be between historical requirements and current role requirements.

  Now, listing out the requirements. Start with misrepresentation: the theory must allow for error. Example: the frog snaps at BBs, so content can't just be whatever causes the state. Then distal content: why does the frog represent flies and not retinal patterns. The requirement here needs to fix the mapping to the distal object. 

  Normativity: correctness conditions. How can a state be wrong? The requirement should derive norms from function without circularity. Representation of the uninstantiated: like a rat representing cheese it's never seen. The theory must go beyond causal history.

  Epiphenomenal states: a state that tracks but isn't used. If it doesn't affect behavior, can it have content? The requirement should tie content to systemic role, not just tracking.

  Causal efficacy: does content need to be explanatory? The requirement here ensures content isn't just metaphysical baggage but does work in cognitive science.

  For the training wrinkle: the requirement must state that non-evolutionary systems need an optimization process that defines function via feedback, and that the state's output is consumed by the system. The toy model case shows that without consumption, it's just correlation.

  Reuse case requirement: the theory must account for both historical origins and current systemic contributions. The conflict arises when history and current role diverge. For instance, if a structure is co-opted, historical theories might say it still represents the old content, but that's useless for explaining current behavior. This clashes with the requirement that content must be relevant to current systemic function.

  Now, marking non-negotiable vs. debatable. Misrepresentation, distal content, and grounding in science are non-negotiable for the user's purpose (cognitive science). Normativity might be a preference; teleosemantics insists on it, while others might downplay. The uninstantiated representation is also crucial for flexibility.

  Conflicts: The biggest clash is between historical requirements (for normativity) and current role requirements (for reuse). If a theory requires history for correctness, but the mechanism is repurposed, then in the truck example, it might misrepresent trucks as predators, which is problematic. Current role theories might lack normativity. This tension is central.

  The requirement that excludes most theories is probably the non-evolutionary systems one. Many theories (like Millikan's) rely heavily on evolutionary history. If a theory can't handle ML models, it's inadequate for modern cognitive science which uses such models. This requirement forces the theory to derive function from non-biological optimization processes.

  Scorecard: Covariation theories fail misrepresentation and distal content. Teleosemantics handles normativity but struggles with reuse and non-evolutionary systems. Role-based theories handle reuse but may lack normativity. Each has cracks based on the requirements listed.
answer: |-
  Here's the distilled specification for a naturalistic theory of mental content, focused exclusively on grounding cognitive science practice. Requirements are derived from concrete failure cases, with your wrinkles integrated, and assessed for negotiability/clashes.

  ---

  ### **Core Requirements & Motivating Failure Cases**

  1.  **Misrepresentation (Error-Possibility):**
      *   **Requirement:** Must explain how a state can *be about X* yet *be false of X* (or misrepresent X).
      *   **Failure Case:** Frog snaps at BB pellets. A theory saying "neural state S represents whatever causes S" makes S represent *flies-or-BBs*. But cognitive science needs to say the frog *mis*takes BBs for flies. Without this, attributing error (illusion, hallucination, false belief) is impossible. *(Non-negotiable)*

  2.  **Distal Specificity (Not Proximal/Disjunctive):**
      *   **Requirement:** Must fix content to specific *distal* objects/properties (e.g., flies, predators, food), not proximal stimulations (retinal patterns, sound waves) or gerrymandered disjunctions (flies-or-BBs-or-dark-speckles).
      *   **Failure Case:** Frog's "fly-detector" neuron fires for flies, BBs, or moving black specks. A purely causal/covariational theory struggles to pick *flies* as the content over *dark moving speck* or the disjunction. Cognitive science needs distal content to explain *why* the frog snaps (to catch *flies*, not to interact with speckles). *(Non-negotiable)*

  3.  **Normativity / Correctness Conditions:**
      *   **Requirement:** Must ground the *norm* that a state can be *correct* or *incorrect* relative to its content.
      *   **Failure Case:** The frog snaps at a BB. Cognitive science needs to say this snap is *mistaken* (incorrect relative to representing *a fly*), not merely causally triggered by a non-fly. A theory lacking norms can't explain why this is an *error* rather than just a different cause. *(Debatable: Teleosemanticists see as non-negotiable; instrumentalists/role-theorists may downplay or derive differently)*

  4.  **Representing the Uninstantiated/Non-Existent:**
      *   **Requirement:** Must allow states to represent things the system has *never encountered* (novel objects, future states) or things that *do not exist* (unicorns, false beliefs).
      *   **Failure Case:** A rat navigates a novel maze, representing cheese in a location it's never visited. A purely causal/historical theory struggles if the state lacks causal history with *that specific cheese*. Cognitive science needs content to guide novel behavior. Similarly, explaining hallucination requires representing non-existents. *(Non-negotiable)*

  5.  **Epiphenomenal Tracking vs. Genuine Representation:**
      *   **Requirement:** Must distinguish a state that merely *tracks/correlates* with X from one that genuinely *represents* X for the system. Tracking alone is insufficient; representation requires integration into the system's *functional economy*.
      *   **Failure Case:** A "spare" neuron in a brain perfectly correlates with atmospheric pressure due to a fluke, but nothing in the brain's architecture uses this signal. Cognitive science wouldn't say this neuron *represents* atmospheric pressure; it's a useless correlate. Representation must play a potential *role*. *(Non-negotiable)*

  6.  **Causal Efficacy / Explanatory Relevance:**
      *   **Requirement:** Content attributions must make a difference to explaining the system's *behavior* or *internal processing*. Content shouldn't be "just sitting there."
      *   **Failure Case:** Attributing content to a state that plays no role in processing or behavior (like the "spare neuron" above). If content doesn't figure in explanations of *why the system does what it does*, it's cognitively irrelevant baggage. *(Non-negotiable for scientific grounding)*

  ---

  ### **Your Wrinkles: Requirements & Cases**

  7.  **Non-Evolutionary Optimization (Training-Based Systems):**
      *   **Requirement:** Must define "function" and "consumption" for systems acquiring "content" through non-biological optimization (e.g., machine learning). Requires specifying how the *training process* (proxy objective, selection filter) establishes a *system-relative function* for internal states.
      *   **Failure Case (Toy Model):** A randomly initialized artificial neuron in an untrained network fires perfectly with pixel patterns of cats, but its output isn't connected to the loss function computation. Post-training, it still fires for cats but its output is ignored by downstream layers calculating the loss. A theory relying *only* on correlation or evolutionary history fails: it correlates, but lacks systemic function. **Requirement:** For content, the state's output must be *consumed* by processes contributing to the system's *optimized performance* on the task *as defined by the training objective*. *(Non-negotiable for applicability to AI/cognitive models; clashes with strict biological teleosemantics)*

  8.  **Reuse & Functional Shift:**
      *   **Requirement:** Must resolve content for mechanisms reliably used *differently* than their origin (historical or training). Requires specifying how current systemic contribution interacts with historical/optimization history.
      *   **Failure Case (Reused Detector):** A visual area evolved/initially trained for predator detection is co-opted in a modern human/agent for reliably detecting delivery trucks (explaining driving behavior). Does it represent *predators* or *large fast-moving objects* or *delivery trucks*? **Requirement:** A theory must provide a principled way to assign content that reflects the state's *current reliable systemic contribution* within the *overall functional architecture*, even if this diverges from origin. *(Debatable: Strong historical theories (Millikan) favor origin; role/current function theories favor current use; clash potential with Normativity/Correctness Conditions if origin defines norm)*

  ---

  ### **Assessment: Negotiability, Clashes, & Exclusion Power**

  *   **Non-Negotiable (For Cognitive Science Grounding):** 1 (Misrep), 2 (Distal), 4 (Uninstantiated), 5 (Not Mere Tracking), 6 (Explanatory Relevance), 7 (Non-Evo Optimization - applicability requirement).
  *   **Debatable/Negotiable:** 3 (Nature/Source of Normativity), 8 (Resolution of Reuse - *how* to weigh history vs. current role).
  *   **Key Suspected Clash:**
      *   **Clash:** Requirement 8 (Reuse - favoring *Current Systemic Contribution*) vs. Requirement 3 (Normativity - often derived from *Historical Function/Origin* in teleosemantics).
      *   **Case:** The reused predator detector reliably causing truck-avoidance behavior *now*. Current-role theories say it represents *trucks/threats*; this fits current explanation (6). Strong historical theories say it *mis*represents trucks as predators (3), but this seems irrelevant or misleading for explaining current behavior (violating 6). Resolving this clash (e.g., by weakening the link between normativity and *original* history, or redefining "function") is a major hurdle.

  *   **Most Exclusionary Requirement: Requirement 5 (Not Mere Tracking / Requires Functional Integration).**
      *   **Why:** Sounds modest ("don't call every correlation content"), but its force comes from demanding that representation be *for the system*. It immediately kills pure informational/covariation theories (Fodor's asymmetric dependence struggles here) and crude causal theories. They often fail because they can't rule out the "spare neuron" case or distinguish tracking from representing *within* the functional economy. Even some functional role theories can struggle if they don't tightly link role to system-level success/optimization. It forces the theory to connect content to *doing work* in the system.

  ---

  ### **Live Families & Cracks (Skippable Scorecard)**

  1.  **Covariation/Informational:** Tracks reliable causation/correlation. *Cracks:* Misrepresentation (1), Distal Specificity (2), Mere Tracking (5). Struggles with Normativity (3) and Uninstantiated (4).
  2.  **History/Function-Based (Teleosemantics):** Content from evolutionary/selected function. *Cracks:* Non-Evolutionary Systems (7), Reuse/Shift (8), Representing Novel/Never-Encountered (4 - depending on grain). Strong on Normativity (3) and Distal (2).
  3.  **Use/Functional Role-Based:** Content from causal/inferential role within the system's cognitive economy. *Cracks:* Normativity (3 - where do correctness conditions come from?), Distal Specificity (2 - can be "holistic"), sometimes Explanatory Relevance (6 - if roles become overly internal/syntactic). Flexible on Reuse (8) and Non-Evo Systems (7).

  **The Core Tension:** Getting robust Normativity (3) and Distal Specificity (2) without making content hostage to history in a way that breaks Non-Evo Systems (7) and Reuse (8). Requirement 5 (Functional Integration) is the bedrock filter.
