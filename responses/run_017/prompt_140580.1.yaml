  Okay, let me start by unpacking the user's query. They work in health-policy analysis and are interested in moral philosophy, particularly a specific dilemma they've encountered. The interpersonal case is clear: leveling down without benefit is rejected. But they're stuck on the intrapersonal version—same person over time. They described two scenarios: one where good years are reduced to match bad years without any gain, and another where significant loss in good years provides minimal gain in bad years. They want to know if this intrapersonal case has a name, how it relates to the interpersonal one, and where the boundary lies, especially with psychological discontinuity.

  First, I need to recall the standard terms. The interpersonal leveling down is tied to the Leveling Down Objection against egalitarianism. Prioritarians avoid it by weighting benefits to the worse off. But the user is applying this within a single life. That's less discussed. So, is there a specific term for this? I remember "prudential egalitarianism" or "temporal egalitarianism," which apply egalitarian principles within a life. Derek Parfit’s work on personal identity and ethics might be relevant here, especially his discussion on distributive principles within a life.

  Next, the user mentions people split on whether a flattened life is better despite no net gain. This relates to the shape of a life hypothesis. James Griffin and others argue that a life with upward trends is better than one that declines, even with the same total well-being. But the user's case is about flattening a spiky life, not changing the trend. So here, the objection is similar to leveling down but intrapersonally. 

  The second scenario is sharper: significant loss for minimal gain in worse-off periods. Prioritarians would support this if the weighting is steep enough. But is that defensible? The user points out that since it's the same person, the usual objections don't hold. This touches on personal identity—if the person sees their past/future selves as disconnected, does that change the analysis? Parfit’s psychological continuity ideas come into play here. If there's no psychological connection, the intrapersonal case might resemble an interpersonal one.

  The user wants the phenomenon carved out: what it is and isn't. They need clarity on whether the first case is actually a separate implication of the weighting view (even life better than spiky) or if the second case is the real analogue. Also, how psychological discontinuity affects the boundary between intra and interpersonal.

  I should differentiate between the two intrapersonal cases. The first (pure leveling down) isn't supported by prioritarianism since no one benefits. The second (weighted transfer) is, and might be called "intrapersonal prioritarianism." But the user's colleagues might conflate the two. The boundary with interpersonal depends on psychological connectedness. If continuity is broken, the case becomes more like interpersonal, weakening the argument for transfers.

  Key references: Parfit's Reasons and Persons for personal identity and ethics, Temkin's Inequality for leveling down, and Griffin on life shape. Also, Otsuka and Voorhoeve’s work on aggregation within lives. The user needs to distinguish between leveling down (no gain) and weighted transfers (gain but steep cost), and understand how psychological continuity affects moral weight.
answer: |-
  Your query brilliantly exposes a critical fracture in moral reasoning that straddles interpersonal and intrapersonal ethics. The phenomenon you're grappling with is **intrapersonal leveling down** (or **intrapersonal egalitarianism**), but it's entangled with distinct concepts like **prudential prioritarianism** and the **shape of a life**. Here's the conceptual carving you requested:

  ### 1. **Core Arguments & Their Names**
     - **Interpersonal Case**: 
       - **Name**: *The Leveling Down Objection (LDO)*.
       - **Core Issue**: Egalitarianism is criticized for implying that leveling down (reducing inequality without benefiting anyone) could be good. Views avoiding this (e.g., **prioritarianism**) weight benefits to the worse-off *without* endorsing leveling down.
     - **Intrapersonal Case**: 
       - **Pure Leveling Down** (flattening 90→30 with no gain): 
         - **Name**: *Intrapersonal Leveling Down* or *Temporal Egalitarianism*.  
         - **Status**: Rejected by most prioritarian/utilitarian views *unless* combined with a "shape of life" thesis.
       - **Weighted Transfer** (destroying 100 units to gain 1 in bad years): 
         - **Name**: *Intrapersonal Prioritarianism* or *Prudential Weighting*.  
         - **Status**: Endorsed by prioritarianism applied within a life, given sufficient steepness.

  ### 2. **Why People Split on the Intrapersonal Case**
     - **The Shape of a Life Hypothesis** (e.g., James Griffin, David Velleman):  
       Some argue that a "spiky" life (e.g., extreme highs/lows) is intrinsically worse than an even one *even with identical total well-being*. This is **not** leveling down—it's a claim about life-narrative value. Your first case tempts this intuition: people feel a "flawed" life is improved by flattening, mistaking it for shape-correction.
       - **What it is NOT**: It does *not* defend pure leveling down. If flattening *reduces total well-being* (90→30 with no offset), shape theorists still reject it. They only prefer flattening when totals are equal.
     - **Intrapersonal Prioritarianism**:  
       This *does* support your second case (massive loss for tiny gain in bad years). Unlike interpersonal prioritarianism, objections about "harming one to benefit another" dissolve—it's one person. The trade-off is justified if the bad years are sufficiently worse off.

  ### 3. **Boundaries & Key Distinctions**
     - **Leveling Down vs. Weighted Transfer**:  
       - **Pure leveling down** (no gain, only reduction) is indefensible *anywhere*.  
       - **Weighted transfer** (loss in better periods for greater gain in worse ones) is the real prioritarian move.  
       *Your first case is often conflated with shape-of-life; your second case is the true intrapersonal analogue of interpersonal prioritarianism.*
     - **Interpersonal vs. Intrapersonal Boundary**:  
       - **Default View**: The boundary is sharp. Intrapersonal transfers lack the "separateness of persons" objection (Parfit), making weighted transfers *more defensible* within a life.  
       - **Psychological Discontinuity**: If the person’s good/bad phases lack psychological connectedness (e.g., severe dementia between periods), the case **resembles interpersonal ethics**. Derek Parfit’s work (*Reasons and Persons*) suggests that with radical discontinuity, intrapersonal transfers may lose their force—the "beneficiary" and "loser" are quasi-distinct entities.

  ### 4. **Carving the Phenomenon: A Taxonomy**
     | **Scenario**                          | **Interpersonal**                     | **Intrapersonal (Continuous Self)**     | **Intrapersonal (Discontinuous)**       |
     |---------------------------------------|---------------------------------------|----------------------------------------|----------------------------------------|
     | **Leveling Down** (No gain, only ↓ gap) | Rejected (LDO)                        | Rejected *unless* shape-of-life invoked | Resembles interpersonal (likely rejected) |
     | **Weighted Transfer** (Loss for prioritized gain) | Prioritarians accept if gain > weighted loss | Strongly endorsed by intraprioritarianism | Weakens; approaches interpersonal logic |

  ### Why This Matters for Policy
  - **Health Policy Implications**:  
    Intrapersonal prioritarianism could justify targeting resources to a person’s worst life phases (e.g., terminal illness) even at high cost to their healthier phases. But if psychological discontinuity is present (e.g., late-stage dementia), this justification erodes.  
  - **Philosophical Risk**:  
    Conflating "shape of life" with prioritarianism risks endorsing pure leveling down. A flattened life with lower total well-being is only defensible via shape-of-life intuitions—*not* prioritarianism.

  ### Key References for Your Context
  1. **Parfit** (*Inequality*, *Reasons and Persons*): Boundaries between persons, discontinuity.  
  2. **Temkin** (*Inequality*): Leveling Down Objection, intrapersonal parallels.  
  3. **Otsuka & Voorhoeve** ("Why It Matters")**: Argues that intrapersonal weighted transfers are *more compelling* than interpersonal ones.  
  4. **Griffin** (*Well-Being*): Shape of a life thesis.  

  Your intuition is correct: the "pull" in the first intrapersonal case is often smuggled shape-of-life thinking, not prioritarianism. The second case reveals prioritarianism's true implication—steeply weighted transfers within a life. Discontinuity blurs the intrapersonal/interpersonal divide, forcing a psychological criterion for ethical boundaries. This is not just semantics; it's foundational for rationing health interventions across life stages.
