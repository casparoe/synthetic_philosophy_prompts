answer: |-
  Here’s the steelmanned case against epistemic utility theory (EUT), centered on its alleged covert pragmatism and the limitations of self-ratification:

  ### The Core Argument: EUT’s Hidden Hypothetical Imperative  
  EUT’s diachronic argument for conditionalization only shows that *if* an agent adopts a strictly proper scoring rule, *and* aims to maximize her *own prior-relative expected accuracy*, then conditionalizing is self-ratifying: no alternative prior → update sequence yields higher *ex ante* accuracy by her current lights. But this is **pragmatic justification masquerading as epistemic normativity**. Consider:  

  1. **Self-Ratification Anchors Norms to Subjective Preferences**  
     The agent’s "own lights" are not a neutral epistemic standard—they reflect her arbitrary prior credences. Just as a pragmatic vindication of Bayesianism says, "If you want to avoid Dutch books, be coherent," EUT says, "If you want *your own prior’s expectation* of accuracy, conditionalize." Both ground norms in the agent’s contingent goals (avoiding loss vs. maximizing expected accuracy). The "imperative" is hypothetical: **it binds only if you value accuracy-by-your-prior**.  

  2. **The Silence of Synchronic Probabilism**  
     EUT’s synchronic argument—that incoherent credences are accuracy-dominated—only establishes that coherence is *necessary* for epistemic rationality. But it says *nothing* about *which* coherent credence function to adopt. For any coherent prior, there are infinitely many alternatives that are equally immune to domination. This is fatal because:  
     - **The locus of normativity shifts to the prior**: Choosing between coherent priors is where substantive epistemic work occurs (e.g., parsimony, explanatory power, evidential sensitivity).  
     - **EUT cannot critique priors**: An agent with a coherent but absurd prior (e.g., 0.999 credence that the moon is cheese) faces no accuracy-based criticism. Her updates are "rational" by EUT’s lights if she conditionalizes—even if her posterior remains absurd.  

  3. **Pragmatism in Epistemology’s Clothing**  
     Accuracy-firsters claim epistemic purity by positing accuracy as the *sole* intrinsic epistemic good. But this move fails:  
     - **Accuracy is goal-relative**: "Accuracy" is undefined without a scoring rule, and scoring rules encode *values* (e.g., how harshly to penalize extremism vs. indecision).  
     - **No categorical force without prior constraints**: Demanding coherence + conditionalization while ignoring prior selection reduces epistemology to instrumental rationality. It’s analogous to telling a wealth-seeker: "Avoid dominated financial strategies, and always compound interest—but we won’t judge your investment in Siberian snow futures."  

  ---

  ### The Best Accuracy-First Rebuttal (and Why It Fails)  
  **Rebuttal**: "EUT *does* offer categorical norms. Probabilism and conditionalization are *universal* requirements because incoherent/update-defiant agents are *guaranteed* to be less accurate *across all possible scoring rules/worlds* (via domination arguments). Choosing priors falls outside EUT’s scope—it addresses the *structure* of rationality, not content."  

  **Why This Fails**:  
  - **Domination is synchronic; self-ratification is diachronic**: While incoherent credences are synchronically dominated, the diachronic argument for conditionalization relies entirely on self-ratification—which *is* prior-relative. An agent with a coherent prior *could* adopt an update strategy that isn’t self-ratifying (e.g., "anti-conditionalization"), but EUT only condemns it if it violates *her own prior’s expected accuracy*. There’s no domination argument across time.  
  - **The prior-selection gap is normative vacuity**: If EUT cannot judge priors, it cannot distinguish between a scientist’s evidence-based prior and a conspiracy theorist’s coherent prior. Both are "rational" if they conditionalize. This abdicates epistemology’s core task: guiding agents toward *truth-conducive* doxastic states.  
  - **Coherence isn’t enough**: Synchronic domination ensures incoherent credences are flawed, but it doesn’t follow that *any* coherent credence is epistemically respectable. EUT’s focus on coherence mistakes a necessary condition for a sufficient one—a sleight of hand inherited from pragmatic Dutch books.  

  ---

  ### Conclusion: The Costume Stays On, but the Body Is Pragmatic  
  EUT’s machinery—strict propriety, domination, self-ratification—merely dresses pragmatic incentives (maximize *your* expected accuracy) in epistemic language. It cannot ground categorical norms because its verdicts are **conditional on agents’ existing credal commitments**. The synchronic argument cleans the floor but refuses to choose the paint; the diachronic argument endorses any prior that paints by its own numbers. What remains is instrumental advice: *If you want your beliefs to score well on a metric you’ve chosen, be coherent and update by conditionalization*. That is pragmatism—and it offers no more epistemic authority than the Dutch book it sought to transcend.  

  **Final strike**: If EUT were genuinely epistemic, it would constrain priors (e.g., via "objective" bayesianism or calibration). Its refusal to do so—insisting that *any* coherent prior is permissible—reveals its pragmatic core: **Your beliefs are 'rational' if they’re consistent *with themselves*, not with the world**.
