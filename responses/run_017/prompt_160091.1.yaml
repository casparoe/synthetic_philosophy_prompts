answer: |-
  ### Mark: 13/25  

  #### Breakdown by Component:  

  **Part (a) (State account of convention): 4/5**  
  - **Strengths**: Correctly identifies the core elements of the standard account (arbitrariness, conditional preference for conformity, self-reproducing pattern). Clarifies that arbitrariness alone doesn’t negate reasons for conformity.  
  - **Weaknesses**: Adds "expectations are not by themselves normative," which is an unsupported philosophical claim beyond the course’s definition. The account is otherwise accurate but slightly overelaborated.  
  - **Credit**: Near-full marks for precision on the course’s definition. Deducted 1 point for the normative expectations digression, which is irrelevant to stating the account.  

  **Part (b) (Defend claim/denial): 3/8**  
  - **Strengths**: Clearly rejects (i) and grounds morality solely in "effects on interests," aligning with consequentialist reasoning.  
  - **Weaknesses**:  
    - **Major failure**: Asserts *only* interest setbacks matter, ignoring key course concepts (e.g., fairness, coordination, or obligations from mutual reliance). The course allows for conventional reasons beyond direct harm (e.g., upholding social stability).  
    - **Misstep**: Claims "frustrated expectations are not themselves a harm" without argument. This overlooks how expectations can create legitimate entitlements (e.g., in queuing) or relational harms.  
  - **Impact**: This reductive framework undermines the entire analysis. Deserves minimal credit for coherence but fails to engage with broader ethical dimensions of conventions.  

  **Part (c) (Same for all practices?): 4/7**  
  - **Strengths**: Correctly notes different outcomes per case and ties them to interest effects. Queuing analysis is strong: identifies tangible harm (losing a place) and correctly notes no obligation when the bus is empty.  
  - **Weaknesses**:  
    - **Tipping**: Mischaracterizes "offence" as an interest setback. Offence alone (without material harm) is insufficient to ground obligation here; the student conflates psychological discomfort with material detriment.  
    - **Jaywalking**: Fails to recognize collective coordination benefits. Even if drivers "expect" jaywalking, the convention harmonizes behavior to prevent accidents. Non-conformity (e.g., unpredictable crossing) *could* undermine this coordination.  
    - **Omission**: Never explains *why* the differences aren’t about convention types (as the question asks), only asserts it.  
  - **Credit**: Partial credit for queuing analysis and internal consistency. Deductions for tipping/jaywalking errors and incomplete explanation.  

  **Part (d) (Reply to objection): 2/5**  
  - **Strengths**: Accepts the objection and links it to their interest-based view consistently. Correctly notes individual non-conformity rarely affects convention persistence.  
  - **Weaknesses**:  
    - **Major failure**: Ignores standard replies to the "no difference" objection (e.g., participation in collective practices creates duties of fairness, or complicity in undermining norms). The course likely covered these.  
    - **Oversight**: Dismisses "membership" but doesn’t address how conventions bind via reciprocity (e.g., benefiting from others’ conformity).  
  - **Credit**: Minimal for coherence with their thesis, but inadequate as a reply to the objection.  

  ---

  ### Most Serious Failures:  
  1. **Reductive Interest-Only Morality (Part b)**: This causes the flawed analyses in (c) and (d). By ignoring non-harm-based reasons (fairness, reciprocity), the student misjudges tipping and jaywalking.  
  2. **Inadequate Reply to Objection (Part d)**: Accepts the objection uncritically, missing counterarguments essential to applied ethics (e.g., collective action problems).  

  **Independence**: These failures are **interdependent**. The interest-only framework (Failure 1) *directly causes* the weak reply to the objection (Failure 2). If morality is solely about individual interest setbacks, then the "no difference" objection holds. A broader view (e.g., conventional obligations as duties of fairness) would force a stronger rebuttal.  

  ---

  ### For Full Marks (25/25), the Answer Would Need to:  
  1. **Part (b)**: Acknowledge that conventions *can* generate moral reasons (e.g., fairness, respect for social coordination) beyond interest setbacks, even if defending (ii).  
  2. **Part (c)**: Justify differences/similarities between conventions by referencing their structure (e.g., queuing creates positional goods; tipping regulates status norms).  
  3. **Part (d)**: Engage the "no difference" objection robustly—e.g., argue that individual conformity upholds fairness in collective practices, even without causal impact.  
  4. Avoid unsupported claims (e.g., "expectations are not normative" in (a)).  

  ### Summary:  
  The answer is philosophically coherent but **narrow and reductive**. It excels in structure and clarity but fails to grapple with core course concepts (e.g., conventional obligations as distinct from harm prevention). The mark reflects competent execution of a flawed thesis, with significant deductions for oversimplification in (b) and (d).
