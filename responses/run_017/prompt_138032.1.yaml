  **MEMORANDUM TO THE STANDARDS COMMITTEE**  
  **Subject: Application of Backsliding Formula to Pending Files and Formula Review**  

  ### RECOMMENDATIONS  
  1. **Hungary**: Democratic backsliding **established**.  
  2. **Poland**: Democratic backsliding **established**.  
  3. **Turkey**: Democratic backsliding **established**.  
  4. **United States**: **Record insufficient** to establish democratic backsliding.  
  5. **Fourth prong (intent condition)**: **Reject**.  
  6. **Partisanship objection**: **Answered** by the formula’s structure.  

  ---

  ### REASONS  
  #### I. APPLICATION OF THE FORMULA  

  ##### A. **Hungary**  
  - **Formal-legality**: Passed. Measures (new constitution, cardinal laws, etc.) adopted by a supermajority government elected in a contested 2010 election.  
  - **Ratchet**: Passed decisively. Media control, gerrymandered districts, court restructuring, and reduced seats *reinforce* incumbency advantage.  
  - **Lock-in**: Passed decisively. Cardinal laws require two-thirds majorities to repeal, raising alternation costs beyond a single election.  
  - **Outcome**: Backsliding established. Turns entirely on the ratchet and lock-in prongs.  

  ##### B. **Poland**  
  - **Formal-legality**: Passed. Government elected in 2015 with a majority adopted measures via legislation.  
  - **Ratchet**: Passed. Tribunal appointments, state media control, judicial discipline laws, and Supreme Court changes *reinforce* incumbency.  
  - **Lock-in**: Passed. Judicial restructuring insulates incumbents; reversal would require overcoming new appointment mechanisms.  
  - **Outcome**: Backsliding established.  

  ##### C. **Turkey**  
  - **Formal-legality**: Passed narrowly. Referendum conducted under emergency rule, but formally valid. **Load-bearing fact**: Emergency conditions may pressure legitimacy, but not invalidate form.  
  - **Ratchet**: Passed. Dismissals, prosecutions, and presidential shift *reinforce* executive dominance.  
  - **Lock-in**: Passed. Presidential powers (decrees, appointments) entrench authority; reversal requires constitutional amendment.  
  - **Outcome**: Backsliding established.  

  ##### D. **United States**  
  - **Formal-legality**: Mixed. Post-2020 state statutes adopted through valid procedures, but federal actions (pressure on officials, certification disruption) lack formal legislative character.  
  - **Ratchet**: Mixed. State voting restrictions may shift power, but expansions in other jurisdictions *offset* net impact. No cohesive national package.  
  - **Lock-in**: Not passed. Most state statutes reversible by bare majority; Supreme Court constrained legislative independence claims.  
  - **Outcome**: **Record insufficient**. Subnational measures lack clear federal entrenchment; offsets and reversibility weaken case.  

  ---

  #### II. MIRROR TEST  
  **Hypothetical**: A reformist government abolishes an unelected upper chamber, introduces automatic voter registration, and bans an "extremist" party.  
  - **Result**: Formula *flags* this package. Automatic registration may shift turnout demographics (ratchet), and banning a party raises alternation costs (lock-in), even absent intent.  
  - **Implication**: Formula measures *structural entrenchment*, not Committee preferences. Partisanship objection **answered**.  

  ---

  #### III. RATCHET BASELINE  
  - **Baseline fixed as status quo immediately before measures**. Comparing to an "ideal" standard would:  
    - Punish long-standing defects (e.g., malapportioned electoral colleges) unrelated to the episode.  
    - Ensure focus on *new* retrogression, not historical inequities.  

  ---

  #### IV. WHAT THE FORMULA CANNOT SEE  
  The formula is blind to:  
  - **Non-state actors**: Erosion via private intimidation (e.g., voter suppression by militias).  
  - **Subnational retrogression**: In federal states (e.g., U.S. state laws), absent federal consolidation.  
  - **Slow drift**: Incremental decline without a discrete "package."  
  - **Background entrenchment**: Pre-existing advantages (e.g., biased electoral systems).  
  *Do not force the formula to address these; they require separate tools.*  

  ---

  #### V. OPERATIONAL RULES  
  - **Burden**: Committee must prove backsliding by **clear and convincing evidence**.  
  - **Standard**: Objective assessment of measures’ cumulative effects, not subjective intent.  
  - **Constitutional court validation**: Not dispositive; captured courts may rubber-stamp.  
  - **Subsequent election**: Does not defeat a finding; lock-in may prevent true alternation.  
  - **Review date**: All findings carry a **mandatory 5-year review** to reassess.  

  ---

  #### VI. LOSING-SIDE ARGUMENTS  
  - **Hungary**: *"Changes reflect popular democratic will; Fidesz won repeatedly under new rules."*  
    **Answered**: Wins under skewed rules do not validate entrenchment; lock-in outweighs popularity.  
  - **Turkey**: *"Emergency justified post-coup measures; referendum ratified presidency."*  
    **Outweighed**: Emergency exploited to adopt self-serving changes; lock-in entrenches gains.  

  ---

  \answer{Hungary: established; Poland: established; Turkey: established; United States: record insufficient; Fourth prong: reject; Partisanship objection: answered}
