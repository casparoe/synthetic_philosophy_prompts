answer: |-
  Your query dissects a profoundly subtle epistemic problem – one that operates precisely at the junction of archival praxis, historical recovery, and the social epistemology of representation. You are *not* conflating frame-extension and crowding-out; rather, you've identified a single, insidious phenomenon where these mechanisms are intrinsically linked and mutually reinforcing within the context of *reparative intervention*. Let's carve it precisely.

  ### The Phenomenon: Remedial Ossification of the Archival Frame
  This is the **unintentional solidification and naturalisation of an oppressive epistemic framework through the very act of attempting to dismantle its silence**. Key characteristics:

  1.  **Reparative Intent, Structural Effect:** The intervention (digitisation, focused study of petitions) is explicitly motivated to counter historical exclusion and give voice. It succeeds partially by increasing *access* and *visibility* of traces of the marginalised.
  2.  **Frame-Extension as Epistemic Capture:** The administrative/categorical framework (filing headings, database structure) inherent in the source material – designed for control, extraction, or governance – is not merely *used* but becomes the *primary lens* through which the recovered voices are understood and contextualised. This framework extends its reach, becoming the seemingly 'neutral' or 'obvious' way to comprehend the entire historical episode or population. The source's *form* dictates the permissible *content* and *interpretation*.
  3.  **Crowding-Out Through Remedial Legitimacy:** The newly accessible corpus gains immense legitimacy *because* of its reparative function. Its ease of access (e.g., keyword searchability) and perceived 'objectivity' (as 'official' records) actively diverts attention and resources from other, non-aligned sources (oral histories, material culture, ecological data, alternative archives). These other sources become perceived as supplementary, anecdotal, or methodologically 'difficult', rather than essential counter-narratives or bearers of different kinds of knowledge.
  4.  **The Paving Over:** Crucially, the *success* of the intervention in breaking the silence paradoxically *masks* the limitations and distortions inherent in the source. When the record was silent, its inadequacy was stark. Now it "speaks," creating an illusion of completeness or adequacy. The **residue** you identify is the **invisible reinforcement of the original framework**, now cloaked in the virtue of restitution. The remedy doesn't just fail to fully repair the injury; it actively incorporates and perpetuates a core element of the injury (the epistemic framework) under a new guise.

  ### How it Differs

  *   **Ordinary Source Bias:**
      *   *Assumption:* Historians are trained to *recognise* bias in sources (e.g., colonial reports are prejudiced). Critical methodology involves acknowledging and compensating for this.
      *   *Difference:* Remedial Ossification operates *despite* this awareness. The reparative intent disarms critical scrutiny *of the framework itself*. The bias isn't just *in* the source; the source's *structure and accessibility* actively reshape the *field of inquiry* and become the dominant epistemic frame. Complacency replaces critical engagement because the source is now seen *as* the remedy.
  *   **Reading Against the Grain:**
      *   *Assumption:* A deliberate, critical methodology to extract subaltern perspectives *despite* the hostile source's intent and categories. It *assumes* the frame is inadequate and actively works *against* it.
      *   *Difference:* Remedial Ossification occurs *in the absence* of sustained "against the grain" reading applied *to the framework*. The intervention focuses on accessing *content within the frame*, not critically dismantling the frame. The legitimacy bestowed by the reparative act makes the frame seem *less* hostile, *more* neutral, and thus less in need of radical subversion. It fosters reading *with* the grain, facilitated by access, albeit with good intentions.

  ### The Edges: Nuances and Costs

  1.  **Knowingly Accepting the Categories:**
      *   Is it the same phenomenon? **Yes, but potentially mitigated.** If researchers are acutely aware they are using the oppressor's categories *tactically* to gain initial access or visibility, *while simultaneously* deploying rigorous methodologies to critique that framework and actively seek non-aligned sources, it differs. However, the *structural pressures* (ease of access, database logic, institutional incentives favouring the 'big data' corpus) towards Ossification remain powerful. Vigilance is required to prevent tactical use sliding into naturalisation. The *phenomenon occurs* when awareness fades or is overwhelmed by the convenience and legitimacy of the accessible corpus, regardless of initial intent.
  2.  **Is the Cost Ever Worth Paying?**
      *   **Possibly, but with profound caveats.** Increased access *is* valuable. Descendants finding ancestors, or subaltern grievances becoming visible *at all*, are genuine goods.
      *   **The Cost is Epistemic Structural Distortion:** The risk is a historical understanding subtly (or not so subtly) reconfigured around the logic of the administration or database, obscuring lifeworlds, agency, and knowledge systems that existed outside or in resistance to that logic. It risks replacing one silence (absence) with another (distortion naturalised as voice).
      *   **Mitigating the Cost:** The cost is only potentially justified if:
          *   The limitations are *explicitly and continuously* foregrounded in the research and dissemination.
          *   The intervention is consciously framed as a *starting point*, not an endpoint.
          *   Significant, dedicated resources and intellectual energy are directed towards methodologies that actively *counter* the archival frame: deep oral history, material culture studies, community-led archaeology, critical data studies of the corpus itself (exposing its structuring logic), and the pursuit of alternative archives.
          *   The 'success' of the accessible corpus does not crowd out funding or recognition for these other essential approaches.
      *   **The Danger:** The reparative legitimacy of the intervention often makes critique of its limitations feel like ingratitude or undermining a 'good thing', creating resistance to the necessary mitigating work. The cost becomes too high when the Ossification sets in unchallenged.

  ### A Potential Name (As Handle, Not Solution)
  While you wisely prioritise analysis over labelling, a concise term can aid discussion. Consider **Remedial Archival Capture** or **Archival Frame Reification through Restitution**. It captures the core: the archival framework (*frame*) designed by power is solidified (*reified*, made to seem natural and complete) specifically *through* the process (*restitution*) intended to liberate voices trapped within it.

  ### In Essence
  You've identified a sophisticated form of **epistemic path dependency**, where a well-intentioned effort to correct an historical exclusion inadvertently locks future understanding into the very structures that created the exclusion in the first place. The distortion doesn't just survive; it parasitizes the remedy, gaining new strength and legitimacy. The challenge is to pursue access and voice without letting the master's tools, rendered newly attractive and efficient by the act of repair, become the only tools used to rebuild the house of history. The silence wasn't merely broken; it was replaced by a ventriloquism mistaken for authentic speech, its strings hidden by the virtue of the act that enabled it. Recognising this requires constant vigilance against the seductive ease of the remediated archive.
