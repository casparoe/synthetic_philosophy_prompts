  Next, the user wants a precise analysis, not just a term. They asked to "carve it" rather than label it. So I should break down the phenomenon into its components: the frame-extension versus crowding-out effects. Frame-extension refers to how the administrative categories become the default framework for understanding the past. Crowding-out happens when the digitized corpus overshadows other sources like oral histories. 

  I also need to differentiate this from standard source bias. Ordinary bias involves critical engagement with sources, whereas here the critical lens fades because the archive is seen as reparative. The remedy itself masks the limitations. Additionally, reading against the grain is intentional, but this phenomenon occurs despite good intentions, leading to complacency.

  The edges of the phenomenon: is it the same if researchers knowingly use the record-keeper's categories? The user questions whether the cost is ever worth it. I should address that sometimes access is necessary, but it requires vigilance to avoid naturalizing the categories. The cost might be acceptable if supplemented with other methodologies, but there's a risk of structural distortion.

