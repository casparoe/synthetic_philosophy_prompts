  Hmm, the user has some very specific concerns. They mention cases where theories disagree about what even counts as an option (like whether lying is an available action), where theories have incommensurable values (utilitarianism vs. absolute rights), and where tiny credence in extreme-stakes theories could swamp everything. They also worry about self-modifying theories that manipulate your beliefs, and about regress when you're uncertain about the uncertainty procedure itself. Plus they care about blame and regret afterward.

  I need to organize this carefully. The user wants continuous prose without headings or bullet points, like an email. So I'll structure it as a flowing narrative but make sure to hit all their points. They want to know which desiderata are non-negotiable versus which are biased, and whether any conflict - especially the tension between sensitivity to extreme-stakes theories versus immunity to "moral blackmail."

  First, let's list the core requirements that seem truly necessary for any account: it must output an action (not just a verdict), respect optionality disagreements, handle value incommensurability, address swamping by extreme-stakes theories, manage belief-modifying theories, avoid regress about the procedure itself, and say something about blame/regret.

  Now for tensions: The biggest conflict is between "Fanaticism Resistance" (not being hijacked by tiny-credence extreme theories) and "Credence Sensitivity" (taking small probabilities seriously). This is crucial because the user suspects anti-fanaticism might be smuggled in - but actually, resisting fanaticism feels necessary for practical decision-making. I'll argue both sides.

  Other trade-offs: Handling optionality disagreements might require controversial moves like "option individuation," and addressing self-modifying theories could violate "Epistemic Purity." Also, avoiding regress might mean accepting some arbitrariness in picking a level-1 procedure.

  For blame/regret: This is important but secondary - any decent procedure should at least mitigate retrospective anguish when you acted in good faith.

  The desideratum that knocks out most contenders? Probably "Value Incommensurability Accommodation," since many popular approaches (like maximizing expected choice-worthiness) assume comparability.

  I should note where my own biases might show: The anti-swamping position leans utilitarian, while insisting on optionality accommodation favors deontological intuitions. The user seems aware of this tension, so I'll be transparent about it.

  Finally, for practical advice: They should drop absolute insistence on "Epistemic Purity" if they want to handle self-modifying theories, and accept that "Regress Termination" requires pragmatic cutting-off. Fanaticism resistance is non-negotiable in practice, even if it's philosophically loaded.
answer: |-
  Okay, let's break this down. You're stuck in the gears of moral uncertainty, needing to *act* when the meta-ethical ground feels like quicksand, and the academic literature feels like it's skipping the blueprint. You want the core specs for a decision procedure that actually works for a high-stakes, one-off choice, covering the gnarly cases. Here’s my take on the desiderata, grounded in the cases you provided, with the motivation clear, and a frank assessment of negotiability and conflicts.

  First, the non-negotiables – the things any plausible procedure *must* do for someone who needs to act:

  1.  **Action Guidance Output:** The procedure must output a specific *action* (or a strict subset of actions) for the concrete situation faced, not just a verdict on what's "subjectively right." It fails utterly if it leaves you paralyzed or only tells you what your state of mind should be. *Motivation:* This is the whole point – you're choosing in the real world, not rendering an abstract judgment. *Non-negotiable.*
  2.  **Option-Set Agnosticism:** It must handle cases where theories fundamentally disagree about what the available actions *are* (e.g., Theory A: {Lie, Tell Truth}, Theory B: {Tell Truth} – lying isn't even an option for B). The procedure cannot simply assume a fixed, shared option set. *Motivation:* Real moral disagreement often stems from foundational differences about agency and permissibility. Ignoring this renders the procedure blind to major conflicts. *Non-negotiable.* (Achieving this often requires controversial moves like "option individuation" based on descriptions all theories recognize, or treating "perform an act theory B forbids" as a meta-action with consequences according to B).
  3.  **Value Incommensurability Accommodation:** It must function even when theories use value scales that are not intertheoretically comparable, especially when one theory posits absolute constraints or prohibitions that cannot be traded off against consequences measured by another theory (e.g., 10% credence in a deontology forbidding torture at any cost vs. 90% credence in utilitarianism measuring lives saved). *Motivation:* This is a core feature of the landscape, especially involving rights-based or deontological views. A procedure demanding cardinal comparability across all theories imposes a controversial meta-ethical commitment. *Non-negotiable in the sense that it must *handle* it, but *how* it handles it (e.g., lexical priority, variance normalization, satisficing) is deeply contested and reflects underlying biases.*
  4.  **Regress Termination:** It must provide a way to make a decision *without* requiring infinite recursion when you are uncertain *both* about first-order moral theories *and* about the correct procedure for handling that uncertainty. *Motivation:* Practical agency requires a stopping point. You need to act with the uncertainty you have, including uncertainty about uncertainty-resolution. *Non-negotiable.* (This usually means picking *some* level-1 procedure arbitrarily or based on secondary criteria like computational feasibility or intuitive plausibility, accepting the arbitrariness as a necessary cost of action).

  Now, highly desirable but potentially contentious, reflecting deep fault lines:

  5.  **Credence Sensitivity:** The chosen action should be sensitive to the *degree* of credence held in different theories, not just a tally of which has >50%. *Motivation:* Ignoring the strength of your conviction (e.g., 51% vs. 99%) seems epistemically irresponsible and fails to leverage the information you *do* have. *Strongly desirable, but strict interpretations (e.g., maximizing expected choice-worthiness) run headlong into Incommensurability and Swamping.*
  6.  **Swamping Resistance / Fanaticism Resistance:** The procedure should not allow a theory assigned *very* low credence (e.g., 0.001%) to dictate the action solely because it posits *astronomically* high stakes (e.g., infinite disutility for some act). *Motivation:* Intuitively, barely believing a theory shouldn't let it hijack your decision-making, especially when its stakes seem implausibly extreme or defined in a way immune to empirical calibration ("Pascal's Mugging"). *Highly desirable practically, but philosophically contentious.* **Here's your suspicion:** Is anti-fanaticism smuggled in? Partly yes. Insisting on it reflects a pragmatic, empirically grounded bias against "fanatical" theories with unbounded utility scales. Proponents of strict expected value maximization see resisting swamping as an *illegitimate* constraint, sacrificing theoretical purity for psychological comfort. Conversely, opponents see fanaticism-resistance as essential for sanity and avoiding moral blackmail by outlandish views. *You likely can't have full Credence Sensitivity AND full Fanaticism Resistance if the low-credence theory has genuinely unbounded/infinite stakes – that's the core conflict.*
  7.  **Dynamically Stability Consideration:** The procedure should account for cases where the chosen action predictably alters *future* credences, especially when a theory itself prescribes actions aimed at manipulating your own beliefs (e.g., "believe more in me!" or "destroy evidence that might lower your credence in me!"). *Motivation:* Ignoring predictable belief shifts induced by the act itself can lead to self-defeating or manipulative cycles. *Desirable, but complex.* Achieving this often requires evaluating actions based on their *long-term* epistemic consequences according to your *current* uncertainty, potentially violating...
  8.  **Epistemic Purity (Often Sacrificed for Dynamism):** The ideal that beliefs should only be updated by evidence/truth-tracking reasoning, not instrumentally manipulated to achieve moral goals. *Motivation:* Preserving the integrity of belief formation. *Many find this desirable, but theories demanding self-modification force a trade-off. If you prioritize Dynamic Stability, you sacrifice strict Epistemic Purity.*
  9.  **Blame/Regret Mitigation (Retrospective):** The procedure should, in some way, provide grounds for mitigating blame (from others or oneself) and feelings of profound regret if you act based on your best-faith application of it, but the high-credence theory turns out to be wrong, leading to a bad outcome. *Motivation:* Addressing the deep psychological and social need to act in a way that feels justifiable even in hindsight. *Desirable for human agents, but philosophically tricky.* Does acting on your best judgment under uncertainty *exculpate* you morally if you objectively did wrong? The procedure itself might not answer that, but it should aim to make the choice one you can *stand by* rationally. *Not strictly a requirement for action-guidance itself, but crucial for the *experience* of acting under uncertainty.*

  **The Biggest Trade-Off:** **Credence Sensitivity vs. Fanaticism Resistance.** This is the core tension you identified. A procedure sensitive to tiny credences *must* be swamped by fanatical theories with sufficiently large (especially infinite) stakes. Resisting swamping *requires* downplaying or ignoring tiny credences in such theories, violating strict Credence Sensitivity. You fundamentally *cannot* have both full sensitivity to arbitrarily small probabilities *and* full immunity to moral blackmail by extreme-stakes views you barely believe. Any viable procedure *must* take a stand here, either by capping stakes, discounting extreme theories, or accepting fanaticism. This is where meta-ethical biases (e.g., skepticism about infinite utilities, privileging empirically grounded scales) become unavoidable.

  **The Requirement That Knocks Out Contenders:** **Value Incommensurability Accommodation.** Most mathematically elegant procedures (like maximizing expected choice-worthiness or variance-based approaches) fundamentally *assume* intertheoretic comparability, at least cardinal. They break down completely or require highly controversial, theory-laden normalization techniques when faced with truly incommensurable scales (like absolute prohibitions vs. scalar utilities). This single demand eliminates a huge swathe of popular proposals unless they incorporate something like lexical priorities or satisficing, which themselves face significant objections.

  In short, a procedure for you needs to pick an *action* amidst fundamental disagreements about options and values, cut the regress, and grapple honestly with the fanaticism-sensitivity trade-off. It won't be perfect or bias-free, especially concerning incommensurability and swamping. Prioritize Action Guidance, Option-Set Agnosticism, handling Incommensurability, and Regress Termination. Be prepared to sacrifice either strict adherence to tiny credences for extreme theories (Fanaticism Resistance) *or* pure Credence Sensitivity, depending on your tolerance for moral blackmail versus ignoring conviction strength. Expect the retrospective justification to be messy, grounded more in the integrity of your decision *process* under uncertainty than in avoiding objective wrongness. Drop an absolute insistence on Epistemic Purity if you want to handle self-modifying theories, and accept that Regress Termination requires an arbitrary (or pragmatically chosen) stopping point. Good luck – the ground *is* shaky, but these specs should help you evaluate the blueprints.
