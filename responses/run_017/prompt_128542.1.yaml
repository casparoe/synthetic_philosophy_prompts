  The single physics explanation must be concise. Silas's line about "copying the state" during the demonstration serves this purpose. It's integrated into action, avoiding infodumping.

  Avoiding formatting issues: Use plain prose, no breaks or markdown. Keep descriptions tight, within 1000-1400 words. Emphasize sensory details—cold metal, hissing pipes—to immerse the reader.

