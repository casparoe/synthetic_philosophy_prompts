prompt: |-
  I'm putting together the preregistration for a follow-up to my undergrad thesis — I'm in the second year of a cog-sci PhD now — and I keep going in circles with my supervisor about the design, so I thought I'd ask here. Short version: we're running a fairly large multilingual online survey of philosophical case judgments. Gettier-style cases, a couple of trolley variants, some of those side-effect cases where someone brings about a bad outcome as a side effect and people say he did it intentionally. Around twelve languages, native-speaker translation plus back-translation, comprehension checks, the usual. My flatmate thinks the whole project is unfalsifiable and I'd like to be able to tell her why it isn't.

  The working plan is to treat the whole thing as a sampling problem: analytic philosophy has been leaning on the intuitions of a very unrepresentative slice of humanity, so the fix is to sample properly and then aggregate. Weight the responses somehow — we can't decide between weighting by population size, weighting by number of languages, or just equally per site — and take whatever the global majority says as the verdict. If the global majority disagrees with what philosophers have been saying since the 60s, then the philosophers update their theories; that seems to me like the entire point of the critique. I also want to add a short debiasing preamble before each vignette, a neutral rewording that strips out the cultural framing — honorifics, names that signal ethnicity, anything that might trigger a local script — so that what we end up measuring is the intuition itself rather than the cultural overlay sitting on top of it. And if it still varies after all that, I guess we just report that knowledge and intentional action are culturally relative and leave it there?

  My supervisor says the design has a conceptual problem rather than a statistical one, and that I'm presupposing the thing the literature is actually arguing about, but she won't tell me what she means until I work it out myself, which is driving me up the wall. So, concretely: is the weighting question even the right question to be asking, does the debiasing preamble do what I think it does, and what am I supposed to conclude from variation if it shows up — relativism, or something else? One more thing while I'm here: we have budget for a single extra between-subjects condition for control items, and I was going to spend it on a non-philosophical item that we already know varies across cultures, something like a risk-preference or trust question, on the theory that if it varies too then response style is doing the work. Is that the right control, or am I about to waste the condition?
reasoning: |-
  Okay, let me unpack this user's problem. They're a second-year cog-sci PhD student designing a follow-up to their undergrad thesis—a large multilingual survey on philosophical judgments across 12 languages. The core issue is their supervisor's vague critique about a "conceptual problem," leaving them stuck in design loops. They're also getting flak from their flatmate about unfalsifiability and wrestling with methodological decisions.

  First, I need to identify the hidden tensions in their approach. Their plan treats cross-cultural philosophy as a sampling problem: aggregate global intuitions to correct Western-centric biases. But this assumes that philosophical concepts are universal and that cultural variations are noise to be stripped away. That's likely where the supervisor's "conceptual problem" critique bites—they're presupposing universalism while the literature debates whether concepts like "knowledge" or "intentional action" are even cross-culturally equivalent.

  The debiasing preamble worries me. Removing cultural markers (honorifics, names) might not isolate "pure" intuitions; it could distort them. If intentionality judgments are inherently tied to social scripts (e.g., hierarchy in some cultures), stripping context might make stimuli meaningless. That's not debiasing—it's creating artificial scenarios that privilege Western individualistic framings.

  Then there's the weighting dilemma. Weighting by population? By languages? Equal per site? All choices imply different philosophical stances: population-weighting assumes moral significance scales with demographics, language-weighting treats linguistic groups as discrete units, and equal per site overrepresents small cultures. But none resolve the deeper issue: *should* we aggregate at all if concepts aren't shared? 

  The flatmate's "unfalsifiable" jab might stem from this. If variation is interpreted as relativism when it appears but universalism when it doesn't, the design can't lose. But good science needs a failure condition. They need to specify upfront what would falsify universalism (e.g., stable cultural clustering beyond response styles) or relativism (e.g., variation collapsing with context controls).

  For the control condition, their risk-preference/trust item is smart but insufficient. It checks response bias but can't distinguish "shallow" variation (response styles) from "deep" variation (conceptual differences). They'd need multiple controls—maybe add a vignette with known universal effects?—but budget only allows one. I'd suggest prioritizing a known-conceptual-variation item over response-style measures.

  My advice would pivot their framing: stop asking "what's the global majority?" and start asking "under what conditions do intuitions vary?" Ditch the preamble (or test its effects), embrace variation as data, and use controls to probe mechanisms. Their project isn't unfalsifiable if they predict specific moderators (e.g., "social hierarchy cues will shift intentionality judgments in Culture X"). And they should tell their flatmate that falsifiability lies in testing process models, not just tallying cross-cultural votes.
answer: |-
  This is a fascinating but indeed conceptually thorny project. Your supervisor is likely pointing at a foundational tension in experimental philosophy (x-phi) that your design inadvertently highlights. Let's break this down:

  **1. The Core Conceptual Problem: Presupposing Universalism**

  Your supervisor is right that your design presupposes a key point under debate: **the universality of the philosophical concepts themselves.** Here's why:

  *   **"Debiasing" Assumes a Universal Core:** By stripping cultural framing (honorifics, names, scripts) to reveal "the intuition itself," you assume there *is* a culture-neutral intuition about "knowledge," "intention," or "moral permissibility" waiting underneath. Critics argue that these concepts are *constituted* by cultural practices, norms, and language. Removing the "cultural overlay" might not reveal a pure core; it might distort the very phenomenon you're trying to measure or create an artificial construct that doesn't map cleanly onto any cultural understanding.
  *   **Aggregation Assumes Commensurability:** Weighting responses (by pop, language, site) and taking a global majority vote implicitly assumes that participants from different cultures are answering the *same question* about the *same concept*. If the concepts themselves are culturally embedded or even incommensurable, aggregating judgments is like averaging answers to subtly different questions. The "global majority" may not reflect a shared understanding of the *concept*.
  *   **The Relativism "Out":** Your fallback position ("if variation remains, report relativism") acknowledges the problem but doesn't resolve the design tension. The core critique is that your *method* (seeking a global majority via debiased stimuli) is already biased *against* finding deep conceptual relativism because it starts from the assumption that the concepts are universal enough to be measured this way.

  **2. The Weighting Question: Symptom, Not Cause**

  The weighting dilemma is a symptom of the deeper conceptual issue. No weighting scheme solves the problem of potential conceptual incommensurability:

  *   **Weight by Population:** Philosophically problematic (implies moral significance scales with demographics). Practical nightmare (defining "population" for languages/diasporas).
  *   **Weight by Language:** Treats linguistic groups as monolithic units, ignoring internal diversity. Still assumes concepts map cleanly onto languages.
  *   **Weight Equally per Site:** Over-represents smaller cultural groups. Still aggregates potentially incommensurable judgments.
  *   **No Weighting (Simple Aggregation):** Overwhelmed by sample size differences between sites.

  **The "Right" Question isn't weighting, but:** *What does variation (or lack thereof) actually tell us about the nature of the underlying concepts?* Your design currently struggles to distinguish between:
  (A) Genuine conceptual/cultural differences in the *meaning* of "knowledge," "intentional," etc.
  (B) Differences in applying a *shared* concept to a *culturally inflected scenario* (even after your stripping).
  (C) Differences in response styles or cognitive biases *unrelated* to the philosophical concept.

  **3. The "Debiasing" Preamble: Proceed with Extreme Caution**

  Your intention is good, but the execution is fraught:

  *   **The Illusion of Neutrality:** It's incredibly hard, maybe impossible, to create a truly "neutral" framing. Removing culturally specific cues might replace them with implicit Western assumptions (e.g., individualism, specific notions of agency) or create sterile, unnatural scenarios that participants struggle to engage with meaningfully.
  *   **Loss of Meaning:** Cultural scripts aren't just "overlay"; they are often integral to how people *understand* intentionality, responsibility, or knowledge in real-world contexts. Removing them might strip away essential context needed for participants to have the relevant intuition *at all*.
  *   **What is it Measuring?** Instead of revealing a "pure" intuition, it might measure how people interpret an *artificially constructed*, culturally denuded scenario that doesn't resonate with their lived experience. This might not be philosophically relevant.
  *   **Recommendation:** Consider this an *experimental manipulation*, not a baseline "debiased" condition. Run it alongside the "culturally embedded" versions (if feasible). Or, *document the specific cues you remove* and treat their *effects* as core data about how cultural context shapes judgments.

  **4. Interpreting Variation: Beyond Simple Relativism**

  Finding variation doesn't automatically mean "relativism" in a strong sense:

  1.  **Descriptive Variation:** The data simply shows judgments differ across groups. This is valuable *as description*.
  2.  **Conceptual Relativism (Strong):** The *meanings* of the core concepts (knowledge, intention) themselves differ fundamentally across cultures. (Your design struggles to prove this).
  3.  **Contextual Sensitivity:** People share core concepts but apply them differently based on culturally specific features *of the scenario* (social roles, consequences, histories). (Your "debiasing" might obscure this).
  4.  **Performance Differences:** Variation stems from differences in comprehension, reasoning styles, motivation, or response biases, not the core philosophical concept itself. (This is where your control helps).
  5.  **Hybrid Views:** Core concepts might have a shared minimal structure but rich culturally specific elaborations.

  **Your project's strength is mapping descriptive variation.** Interpreting *why* it exists requires triangulation, careful analysis of moderators, and theoretical argument – it won't be resolved by a single aggregate number.

  **5. The Control Condition: Good, But Needs Refinement**

  Your plan for a non-philosophical control (risk-preference, trust) is **smart, but potentially insufficient.**

  *   **Pro:** It directly tests the "response style" hypothesis. If the *pattern* of variation for the control mimics the philosophical judgments, it strongly suggests a general cognitive/response bias is at play.
  *   **Con:** If the patterns *differ*, it doesn't automatically mean the philosophical variation is "deep" conceptual difference. The philosophical cases might just tap into *different* culturally variable constructs than risk or trust.
  *   **Refinement:** Choose a control that is:
      *   **Closer Cognitively:** Instead of risk/trust, use a vignette involving causal reasoning, counterfactual thinking, or mental state attribution *in a non-moral/non-epistemic context* (e.g., predicting behavior based on beliefs/desires in a neutral scenario). This better matches the cognitive machinery likely involved in philosophical judgments.
      *   **Known Deep Variation:** If possible, use a control item with *known* deep cultural variation in interpretation (e.g., some fairness/cooperation games, certain aspects of perception/categorization). Finding similar *depth* of variation would be more suggestive.
  *   **Is it a waste? Absolutely not.** It's crucial for ruling out shallow explanations. Just be clear about its scope and limitations in your preregistration and analysis.

  **Recommendations for Preregistration & Moving Forward:**

  1.  **Reframe the Goals:** Shift from "finding the global majority to correct philosophers" to:
      *   "Mapping systematic variation in judgments about philosophical cases across diverse linguistic/cultural groups."
      *   "Investigating the impact of specific cultural cues/contexts on philosophical judgments."
      *   "Exploring the stability of philosophical intuitions under cross-cultural scrutiny."
      *   **Explicitly acknowledge the conceptual tension** regarding universality vs. embeddedness in your introduction/methods.
  2.  **Ditch the "Debiasing" as Default:** Either:
      *   Present the cases in culturally natural forms (acknowledging this measures the judgment *in context*), OR
      *   Treat "stripped" vs. "embedded" as a **factor** in your design (if budget/logistics allow), OR
      *   Drop the stripping and focus on documenting the *features* of cases that correlate with variation.
  3.  **Address Weighting Transparently:**
      *   Preregister that you will analyze data **both aggregated and disaggregated by site/language**.
      *   Preregister multiple weighting schemes as *sensitivity analyses*, emphasizing that the primary analysis will focus on **patterns within and between groups**, not a single global number.
      *   State clearly that weighting is a pragmatic choice for certain analyses, not a solution to the conceptual problem.
  4.  **Plan for Variation Analysis:** Preregister how you will analyze variation:
      *   Descriptive stats per group.
      *   Tests for significant differences between groups/languages.
      *   Exploration of correlations with demographic/cultural factors (if collected).
      *   **Crucially:** How you will relate findings to the control condition (e.g., comparing correlation matrices, factor structures, or patterns of clustering).
  5.  **Control Condition:** Justify your choice of control (risk/trust or preferable a cognitive alternative). Preregister how you will compare its variation to the philosophical judgments (e.g., magnitude of variation, clustering patterns, correlation with demographics).
  6.  **Talk to Your Supervisor (Again):** Frame it as: "I understand the core tension is presupposing universality in the concepts. I propose reframing the goals as descriptive mapping and context sensitivity, acknowledging this tension explicitly, and analyzing patterns within/between groups rather than relying solely on problematic aggregation. Does this address your concern?"

  **Re: Your Flatmate (Unfalsifiability):** The project *is* falsifiable, but not in the simplistic way of "global majority = universal truth." It's falsifiable in multiple ways:
  *   **Finding No Meaningful Variation:** If judgments are strikingly consistent across diverse cultures *even in culturally embedded cases*, that strongly challenges certain forms of relativism or cultural determinism (though not necessarily universalism).
  *   **Variation Explained by Controls:** If variation in philosophical judgments perfectly mirrors variation in the control (response style) or known shallow factors (e.g., education level, religiosity), it falsifies the hypothesis that deep conceptual differences are the primary driver.
  *   **Specific Predictions Failing:** Preregister hypotheses about *how* judgments might vary (e.g., "Collectivist cultures will show higher rates of intentionality judgments in side-effect cases involving in-group harm"). Finding the opposite pattern falsifies that specific prediction.

  Your project is ambitious and important. The key is to move away from the idea of finding a single "correct" global answer and towards rigorously documenting and interpreting the rich landscape of human philosophical intuition. Good luck!
