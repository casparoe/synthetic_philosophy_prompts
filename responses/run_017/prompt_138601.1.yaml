  ## Joint Statement on the Combination Problem: Constitutive Micropsychism & Priority-Monist Cosmopsychism

  **Preamble:** We, constitutive micropsychists (µψ) and priority-monist cosmopsychists (Cψ), engaged in adversarial collaboration, affirm the following shared commitments and requirements for any solution to the combination problem within Russellian panpsychism. We agree that consciousness is the intrinsic nature of the physical, that physics describes only the relational structure and dynamics of reality, and that neither brute emergence of consciousness from wholly non-conscious parts nor eliminativism about consciousness are viable options. Our core disagreement concerns the *direction of metaphysical grounding*: whether the consciousness of the cosmos as a whole (Cψ) grounds the consciousness of fundamental particles/fields and their composites (including human subjects), or whether the consciousness of fundamental particles/fields (µψ) grounds the consciousness of their composites (including the cosmos). The Bridge Series (described below) serves as our shared diagnostic case.

  ### Section 1: Agreed Commitments & Requirements for a Solution
  1.  **The Core Problem:** The combination problem arises directly from our shared ontology. If consciousness is the intrinsic nature of the physical, and physics describes complex structures built from simpler structures, then any theory must explain how the intrinsic nature (consciousness) manifests at different levels of complexity – specifically, how the phenomenology of macro-subjects (like humans) relates to the intrinsic nature of their micro-constituents and/or the whole cosmos.
  2.  **Three Interlocking Aspects:** A satisfactory solution must seamlessly address the following interrelated aspects:
      *   **(A) Subject Unity & Multiplicity:** Explain how many subjects of experience exist at a given level of description (e.g., within a brain, across brains) and how the boundaries between subjects are constituted. It must account for the unity of a single subject's experience and the distinctness of multiple subjects.
      *   **(B) Quality Combination:** Explain how the rich, complex, and seemingly novel qualities of macro-consciousness (e.g., human phenomenology) can be constituted by, or derived from, the (putatively) simpler, less rich qualities of micro-consciousness (µψ) or the consciousness of the whole (Cψ), without invoking brute emergence.
      *   **(C) Structural-Phenomenal Match:** Explain how specific structural/dynamic features described by neuroscience (e.g., neural synchrony, information integration, functional connectivity patterns) correspond to, realize, or constrain specific features of macro-conscious experience (e.g., content binding, phenomenal unity, the specific character of a quale). This match must be non-arbitrary and grounded in the intrinsic nature.
  3.  **Interdependence of Aspects:** These aspects are inseparable.
      *   Resolving (A) (how many subjects) is fundamentally tied to the mechanisms proposed for (B) (how qualities combine within a subject) and (C) (which structures unify which qualities into which subjects).
      *   The solution to (B) (quality combination) must be consistent with the account of (A) (subject count) and leverage the structures identified in (C) as relevant to binding/unification.
      *   The structures identified in (C) as crucial for specific phenomenal features (like binding) must be explained by the theory as playing the specific role they do *because of* the underlying metaphysics of combination (A & B).
  4.  **The Bridge Series Constraint:** We agree on the following regarding the Bridge Series (gradually increasing neural fiber connections, N, between two adult human brains from 0 to corpus callosum levels):
      *   There is no *principled* discontinuity (no "magic number" of fibers) where a fundamental metaphysical shift occurs. Changes are continuous and structural.
      *   At N=0, there are two distinct human subjects of experience.
      *   At N=Max (full corpus callosum equivalence), there is one human subject of experience.
      *   A completed, purely structural/dynamic neuroscience could provide a complete description of every stage.
      *   Any solution must explain the transition from two subjects to one subject across this series. Simply asserting that the number of subjects is vague throughout the series is insufficient unless it also explains how that number becomes determinate in the clear cases (N=0, N=Max, and ordinary single-brain/brainless scenarios).

  ### Section 2: Residual Disagreements (Stated in Each Side's Terms)

  | Disagreement Area          | Constitutive Micropsychist (µψ) Formulation                                                                 | Priority-Monist Cosmopsychist (Cψ) Formulation                                                                 |
  | :------------------------- | :---------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **1. Grounding Direction** | Macro-consciousness (including cosmic consciousness) is wholly grounded in and constituted by micro-consciousness. | Micro-consciousness is wholly grounded in and derives its existence/aspect from the prior consciousness of the whole cosmos. |
  | **2. Subject Ontology**    | Fundamental subjects are micro-level entities. Macro-subjects are derivative unities formed by specific relations between micro-subjects. | The cosmos is the fundamental subject. Macro-subjects (like humans) are relatively independent phenomenal perspectives or modes within the cosmic subject; micro-subjects are not fundamental subjects. |
  | **3. Combination Strategy**| Combination involves micro-subjects entering into specific ("proto-mental") binding relations, governed by physical structure, such that their experiences collectively constitute a unified macro-experience. | Combination involves the cosmic consciousness decomposing or constraining its own state to yield the appearance of relatively isolated macro-subjects; the "combination" is one of differentiation and perspectival limitation, not bottom-up construction. |
  | **4. Fundamental Level**   | The most fundamental level of reality intrinsically involves a vast multiplicity of micro-subjects. Unity must be built from multiplicity. | The most fundamental level of reality intrinsically involves a single cosmic subject. Multiplicity must be derived from unity. |

  ### Section 3: Diagnostic Cruxes & Predictions (Bridge Series Focus)

  1.  **Crux 1: Locality vs. Holism of Intrinsic Nature**
      *   **µψ Claim:** The intrinsic nature (conscious state) associated with a specific neural state/structure (e.g., a neuron, a local circuit) is fixed primarily by its *local* physical description (its intrinsic physical properties and immediate causal relations). Its place within a larger subject is a *consequence* of its local intrinsic nature plus its relations to other local intrinsic natures.
      *   **Cψ Claim:** The intrinsic nature (conscious state) associated with a specific neural state/structure is fundamentally fixed by its place within the encompassing whole (the cosmic subject) and its role in the overall structure. Its *apparent* local character is a perspectival aspect of the cosmic consciousness constrained by that structure.
      *   **µψ Falsification Condition:** Evidence that two physically identical local neural states (same type of neuron, same inputs/outputs, same local dynamics), embedded in different global contexts (e.g., isolated neuron vs. neuron in a complex brain), possess *radically* different intrinsic natures (e.g., one is phenomenally dark, the other vividly conscious) *solely due to the global context*. (µψ expects intrinsic nature to be largely locally determined, though its *role* in a macro-subject depends on relations).
      *   **Cψ Falsification Condition:** Evidence that a specific local neural state's intrinsic nature (e.g., contributing a specific quale) is *completely independent* of the state of the whole brain/cosmos, and is solely determined by its local physical description, even when isolated. (Cψ expects intrinsic nature to be fundamentally holistic).
      *   **Verbal Disagreement?** Partially. The term "intrinsic nature" might be used slightly differently. µψ emphasizes *local* intrinsics combining. Cψ emphasizes the *global* intrinsic (the cosmos) as primary, viewing "local intrinsic natures" as abstractions or limitations *of* the global. However, the core disagreement about what *fixes* the character of experience at a point – its local physics or its global context – is substantive and has empirical implications (see Crux 2).

  2.  **Crux 2: Number of Subjects in the Bridge Series & Transition Mechanism**
      *   **µψ Prediction:** The number of distinct subjects decreases *gradually* from 2 towards 1 as N increases. This reflects the gradual strengthening of binding relations between the micro-constituents of the two original brains. There might be a range of N where the number is indeterminate (fuzzy), but the *determinacy* at the endpoints is explained by the absence/presence of sufficiently strong unifying relations. The transition profile is **monotonic and gradual**. *Predicted Measured Profile (if possible):* A sigmoidal curve, starting at 2, gradually decreasing to 1 over a wide range of intermediate N, with potential indeterminacy in the middle region.
      *   **Cψ Prediction:** There are always perspectives within the cosmic subject. The transition is not a gradual merging of two subjects, but a shift in how the cosmic consciousness manifests: from manifesting two strongly decoupled human perspectives to manifesting one integrated human perspective. While the *structural* change is continuous, the *number of distinct human-level subjects* changes **abruptly** at some critical point (or small range) of N where the structural integration reaches a threshold sufficient for the cosmic consciousness to manifest a single perspective instead of two. The determinacy at endpoints reflects stable structural configurations enabling distinct perspectives. *Predicted Measured Profile (if possible):* A step function, holding at 2 until a critical N_c, then jumping to 1. Alternatively, a very rapid transition over a narrow range of N.
      *   **µψ Falsification Condition:** Evidence of an *abrupt* change in measured subject number (e.g., from 2 to 1 sharply at a specific N) without a correspondingly abrupt, fundamental change in the underlying structural/dynamic description.
      *   **Cψ Falsification Condition:** Evidence of a *smooth, gradual* change in measured subject number across the entire series, correlating smoothly with increasing N, without any threshold effect, strongly supporting a gradualist, relation-building model.
      *   **Verbal Disagreement?** No. This is a concrete, empirical disagreement about the *profile* of subject count change in the Bridge Series, stemming directly from their core metaphysical differences (grounding direction, subject ontology). µψ's gradual relation-building predicts gradual change. Cψ's perspective-switching within a fundamental whole predicts a threshold or abrupt transition. The Bridge Series is designed to test precisely this.
