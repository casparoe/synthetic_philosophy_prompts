  First, I need to disentangle three possible frameworks: costly signalling, hostage posting, and symbolic constitution. The costly signalling story feels incomplete here because Zahavi's handicap principle requires observable cost - but ring prices aren't advertised. Yet the lab-diamond revulsion suggests cost matters profoundly. Perhaps the audience isn't external but the recipient themselves? That would explain privacy but feels psychologically thin. 

  The hostage theory (where the ring acts as collateral) better explains the sunk-cost aspect. Historically, engagement rings functioned as breach compensation - if the man backed out, the woman kept the ring. Modern legal vestiges remain, though engagement rings now straddle conditional-gift and hybrid categories. This creates a fascinating tension: the diamond's market-value destruction makes it a perfect hostage precisely because it's non-recoverable. Lab diamonds undermine this by preserving optionality - their resale value doesn't collapse as brutally. 

  But the symbolic constitution angle might explain the grandmother's ring exception. Heirlooms work because they're physical manifestations of relationship lineage - their "cost" is temporal rather than financial. This also clarifies the lab-diamond unease: it's not about current expenditure but about breaking the causal chain that authenticates commitment. A manufactured stone lacks the "friction" of tradition. 

  Where I'm uncertain: whether the market actively exploits these mechanisms. De Beers didn't invent sunk costs - they weaponized preexisting marital hostage customs. The real dispute among theorists is whether the diamond's physical properties (indestructibility, purity) actively shape the practice's evolution, or are incidental. My bet's on the former - the material persistence enables the temporal dimension of both hostage and heirloom functions. 

  Concrete test: if we replaced diamonds with consumable luxury gifts (say, truffles costing three months' salary), the norm would collapse. Without material persistence, neither hostage nor intergenerational symbolism works. That's why the resale value cliff matters - it's not just sunk cost but the object's forced longevity as a token.
answer: |-
  Right, let's think aloud about this puzzle. I've wrestled with these exact tensions in signalling systems—where biological models brush against social ontology—and the engagement ring is a perfect case study. The standard costly signalling story *does* feel incomplete here, and your observations hit the key pressure points: audience opacity, the grandmother's ring exception, and the peculiar moralized aversion to lab stones. Let me unpack the competing frameworks before landing where I think the weight of evidence lies, marking the uncertainties.

  **Brainstorming the space:**  
  First, the classic **costly signalling (CS)** model (Zahavi, Grafen): A signal is credible because it imposes a cost that a faker couldn’t bear. For engagement rings, the "three months' salary" norm *seems* to fit—sacrificing resources signals "I’m committed/successful." But your objection is spot-on: *Who observes the cost?* If only the couple knows the price, the signal’s audience is unclear. CS typically requires signal *observability* to function evolutionarily (peacock tails, stag antlers). Here, the cost is often private or semi-private. The grandmother’s ring exacerbates this—it signals lineage/sentiment, not *current* sacrifice. CS struggles with inherited signals. And the lab diamond revulsion? If CS is about *costly proof*, a cheaper identical stone should be *better* (same signal, less waste). But it feels like forgery, not efficiency. That suggests something beyond cost is at play.

  Second, the **hostage/bond (HB)** model (Schelling, Williamson): Here, the ring isn’t primarily a signal to others but a *pledge* to the recipient—a sunk cost making defection painful for the giver. Historically, engagement rings *were* legal compensation for breach of promise (still true in some jurisdictions). The diamond’s value collapse is perfect for this: it’s non-recoverable, so giving it *binds* the giver. The recipient holds a hostage. This explains the privacy—the audience is the recipient, not society. The grandmother’s ring still fits: its sentimental/symbolic value to *her* makes it a potent hostage, even if monetarily cheap. But HB struggles with the *social* dimension: why do *others* (family/friends) care about the ring’s authenticity? And why the aversion to lab diamonds? If they’re physically identical, they should function equally well as hostages. Yet they don’t—suggesting social perception matters.

  Third, **symbolic constitution (SC)** or **relational ontology** (Searle, Gilbert): Here, the ring isn’t *evidence* of a commitment but partly *constitutes* it. The object itself, through collective intentionality, becomes a physical token of the relationship’s "status function." Its material history matters because the convention ties meaning to *specific causal chains* (like a sacrament requiring a specific ritual). This explains the lab diamond revulsion: it’s not a "cheaper signal" but a *defective token*—like counterfeit money. It lacks the "right" history. The grandmother’s ring is potent because its lineage *enhances* its constitutive power (it embodies generational continuity). Cost is secondary; what matters is the object’s embeddedness in a narrative. But SC struggles to explain the *cost norm*: if history alone suffices, why demand expensive new stones?

  **Settling on an answer (with uncertainties):**  
  I think the dominant framework is a **hybrid of HB and SC**, with CS playing a secondary role. Here’s the reconstructed implicit theory:  

  1. **Core function: Reciprocal bonding via sunk-cost hostages.**  
     The ring primarily binds the *couple*. The giver offers a hostage (the ring’s non-recoverable value) to the recipient, making defection costly. The recipient’s acceptance signifies taking custody of this pledge. This explains the privacy, the resale cliff (essential for the sunk cost), and even the grandmother’s ring (its sentimental value to the recipient makes it a *better* hostage). Legal vestiges support this—engagement rings are often "conditional gifts" revoked if marriage doesn’t occur.  

  2. **Social layer: Constitutive symbolism with authenticity constraints.**  
     The ring’s material form isn’t arbitrary. Collective intentionality fixes diamonds as the "proper" token because their perceived scarcity and durability make them *apt hostages* (historically amplified by De Beers, but built on existing gemstone symbolism). Lab diamonds disrupt this because their production history violates the *conventional script* for what counts as a "real" pledge-token. It’s not signalling failure but *category error*—like paying a bond in counterfeit bills. The audience here *is* societal, but not to assess cost—to *validate the token’s legitimacy* within the constitutive convention.  

  3. **Cost’s role: Enforcing sincerity, not signalling.**  
     The cost norm serves HB: a truly sunk cost ensures the giver feels the bond. A lab diamond *could* work as a hostage if both parties accepted it, but the convention guards against "cheap commitments" by demanding a painful sacrifice. The grandmother’s ring is an exception because its sentimental value (to giver *and* recipient) already meets the hostage threshold—monetary cost is irrelevant.  

  **Where CS fits (and doesn’t):**  
  CS isn’t the engine but a stabilizer. Public displays (ring ceremonies, social media) let the *hostage* function signal commitment *to society*, leveraging CS logic. But the core mechanism is dyadic binding, not public display. Lab diamonds aren’t rejected as "weak signals" but as *invalid tokens*—hence the "suspicion" you note. They threaten the constitutive convention’s integrity.  

  **Live disputes and my uncertainties:**  
  - **Consensus:** Most theorists agree CS alone fails for engagement rings (Miller’s *Spent* acknowledges this). HB/SC hybrids are now mainstream in social ontology (Searle’s status functions + Schelling’s commitments).  
  - **Dispute 1:** Whether the diamond’s *material properties* (vs. arbitrary convention) are essential. I lean "yes"—durability/scarcity support hostage/constitutive roles—but others (e.g., Veblen-influenced scholars) see pure status competition.  
  - **Dispute 2:** How much De Beers *created* vs. *exploited* these mechanisms. I suspect they intensified HB/SC norms but didn’t invent them (betrothal tokens predate diamonds).  
  - **My uncertainty:** Whether the recipient *consciously* experiences the ring as a hostage. I suspect it’s largely implicit—felt as "seriousness." Also, whether lab diamonds will disrupt the convention or be assimilated (e.g., if marketed as "ethical hostages").  

  **Concrete changes if frameworks shifted:**  
  If we dropped **CS** entirely, the *cost norm* might relax, but the demand for "authentic" (natural) diamonds *and* the resale cliff would persist (they’re needed for HB/SC). If we dropped **HB**, the resale cliff and conditional gift norms would vanish—rings might become mere ornaments. If we dropped **SC**, lab diamonds would face no stigma, and heirlooms would lose privileged status.  

  **In essence:** The ring is a hostage bonded in socially constituted currency. Its cost ensures pain to bind; its history ensures authenticity to constitute; its publicity stabilizes—but doesn’t create—the convention. Lab diamonds falter not as cheap signals, but as counterfeit bonds.
