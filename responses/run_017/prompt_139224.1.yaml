prompt: |-
  I'm a clinical epidemiologist, and twice a year I run a ninety-minute workshop for hospital mortality-and-morbidity review committees: around fifteen clinicians, no probability training beyond risk ratios and p-values. The one idea I want them to walk out with is the classical Condorcet jury theorem, because the working assumption in these rooms is that a verdict endorsed by eight people who read the same chart is more likely to be right than one endorsed by three, and that the size of the committee is itself doing the epistemic work.

  Plan how I should explain it; don't just explain it to me. Tell me what has to be in place before the claim is even intelligible, which single case should carry the whole thing and why it should not be a courtroom jury, where in the sequence to defuse each mistake I expect, one question I can ask at the end that would show it landed rather than being nodded at, and what I should openly decline to cover at this level.

  Two things I want handled carefully. First, my reviewers fail the theorem's independence condition, but not primarily because they talk: they all form their views from one shared written record, so their errors have a common cause even when nobody speaks. I want the sequence to separate non-communication from independence in the relevant sense, and to mark where deliberation genuinely helps — pooling evidence the members separately hold — as opposed to manufacturing the correlation the theorem excludes. Second, many of these reviews ask whether a death was avoidable under a standard of care rather than what happened, and I suspect the theorem has no purchase there; tell me where that limitation goes in the sequence and whether it is a footnote or load-bearing.

  The misconceptions I expect: that the theorem vindicates majority rule as such; that adding members always improves accuracy however weak they are; that what is needed is each member better than chance rather than the group's aggregate; that this is the same result as the intransitive-majorities problem also associated with Condorcet; and, worst, that the theorem shows our committee was right, when at most it licenses a conditional whose assumptions we cannot check from inside the room.

  Give it to me as one ordered plan of under 600 words, naming the carrying example in the first sentence and tagging the point at which each misconception gets headed off.
reasoning: |-
  Okay, the user is a clinical epidemiologist running workshops for hospital mortality-and-morbidity review committees. They want to teach the Condorcet jury theorem to clinicians who assume that more reviewers automatically mean more accurate decisions. The key is to make the theorem understandable and address specific misconceptions.

  First, I need to consider the audience. These are clinicians with limited probability training, familiar only with risk ratios and p-values. The main idea is that majority decisions are more reliable only if each member is competent and independent. But the reviewers aren't independent because they rely on the same medical record, creating a common cause for errors. Also, they're assessing avoidable deaths, which might not fit the theorem's binary truth model.

  The user outlined several misconceptions to address: that the theorem justifies majority rule inherently, that adding members always helps regardless of their skill, that individual members need to be better than chance rather than the group's aggregate, confusing it with Condorcet's paradox on intransitive majorities, and the fallacy that the theorem confirms the committee's correctness without verifying assumptions.

  I'll structure a teaching plan. Start with a relatable example—using a coin flip scenario where individuals predict outcomes with better-than-chance accuracy. This avoids the courtroom jury analogy because legal juries deliberate, which complicates independence. The coin example clearly shows individual assessments without communication.

  The sequence should first define binary decisions and individual competence. Then explain majority accuracy improving with group size, using the coin example to illustrate. Highlight the independence condition as critical—emphasize that shared evidence (like medical records) violates this, causing correlated errors. Distinguish between sharing evidence (problematic) and pooling diverse evidence through discussion (beneficial). 

  Address misconceptions at specific points: when discussing competence, clarify that adding weak members worsens outcomes. When covering independence, differentiate from communication and note that shared data sources create common errors. Contrast the jury theorem with Condorcet's paradox to avoid confusion. Stress that the theorem provides a conditional argument—it doesn't validate the committee's decision unless assumptions hold.

  For the avoidable death question, note it as a footnote. Such judgments are often not binary truths but value-based, so the theorem doesn't apply. End with a question checking understanding: "If we add members who only review the same chart, does accuracy necessarily improve?" The answer should highlight the risk of correlated errors from shared data.

  Openly decline topics like mathematical proofs, probability thresholds, and alternative models. Keep it focused. This approach ensures clarity, addresses the user's concerns, and fits within the word limit.
answer: |-
  Here's a 900-minute workshop plan focused on your core goal:

  1.  **Hook & Core Example (Dice Prediction - 5 mins):** "Imagine predicting if a *fair* die roll will be HIGH (4-6) or LOW (1-3). Each of you privately writes HIGH or LOW. You each have a 55% chance of being right – slightly better than coin flip. We tally votes. Does majority vote get it right *more* often than any single one of you? *[Tag: Individual vs. Aggregate Competence]*

  2.  **Setting the Stage: Conditions Needed (15 mins):**
      *   **Binary Choice:** Must be a Yes/No, True/False question (e.g., "Was this death *directly caused* by a specific medical error?"). *[Tag: Avoidable Death Limitation - FOOTNOTE HERE: "Crucially, 'Was this death avoidable?' is often a complex judgment call, *not* a clear binary fact. The theorem doesn't cleanly apply there. We're focusing on clear factual determinations."]*
      *   **Independent Competence:** Each member must have *p > 0.5* chance of being correct *on their own*. *[Tag: Better Than Chance]*
      *   **Independence:** The *chance* one member is wrong is unaffected by whether others are wrong. *[Tag: Common Cause vs. Communication]*

  3.  **The Core Claim & Dice Demo (20 mins):**
      *   Under these conditions, the majority vote is more likely correct than any single member.
      *   Larger groups (with *p > 0.5*) get *more* accurate, approaching certainty. *[Show simple calculation: 3 people (55% each), majority wins 57.5% of time; 5 people = ~60.6%]*.
      *   **Key Insight:** The group's collective competence *amplifies* individual competence. *[Tag: Group Epistemic Work]*
      *   **Mistake Head-off (Adding Weak Members):** "What if we add someone who's *only* 40% accurate? Does the group *still* improve? *[No! Weak members dilute competence]*". *[Tag: Adding Members Not Always Good]*

  4.  **Independence: The Achilles Heel (25 mins - CRITICAL):**
      *   **Shared Evidence is the Core Problem:** "In our dice game, you see *different* rolls. In M&M, you all read the *same chart*. If the chart is missing a key fact, *everyone* might miss it – errors are *correlated*." *[Tag: Common Cause]*
      *   **This Violates Independence:** Shared information creates a *common cause* of error, making the theorem's math break down. The group acts more like a *single* (potentially flawed) reviewer multiplied.
      *   **Deliberation: Help vs. Harm:**
          *   *Harmful:* Primarily sharing *interpretations* of the *same evidence* ("I think this note means X"). This *increases* correlation ("groupthink") without adding new info.
          *   *Helpful:* Pooling *unique, separate* evidence ("I spoke to the nurse, she saw Y", "The discharge summary mentions Z"). This *reduces* individual error rates (raises *p*) without necessarily *creating* harmful dependence. *[Tag: Pooling Evidence Good, Groupthink Bad]*

  5.  **Common Misconceptions & Limitations (15 mins):**
      *   *Not Vindication of Majority Rule:* "The theorem *doesn't* say majority rule is inherently good. It only works *if* the pre-conditions hold. A majority of biased judges is worse!" *[Tag: Not Vindication]*
      *   *Not Intransitivity:* "This is *not* about voting paradoxes like A>B, B>C, C>A. That's Condorcet's *other* famous idea." *[Tag: Different from Paradox]*
      *   *The Big "If":* "The theorem says *IF* members are competent and independent, *THEN* larger groups are better. Our job is *not* to assume we meet 'IF', but to *ask* 'Do we?' (Shared chart? Biases?) We can't *prove* we were right using the theorem." *[Tag: Conditional Argument]*

  6.  **Check for Landing: The Question (5 mins):** "Imagine we have a 5-person committee. Each member, reviewing the *same* chart alone, is 55% likely to correctly identify a specific error. We vote. Is the majority vote:
      (a) Guaranteed to be more than 55% accurate?
      (b) Guaranteed to be *less* than 55% accurate?
      (c) Possibly less than 55% accurate?
      *Why?*" ***(Correct Answer: C - Due to correlated errors from shared evidence violating independence)*** *[Tag: Shared Evidence Risk]*

  7.  **Openly Decline (5 mins):** "We won't cover: Complex proofs, calculating exact probabilities, how low *p* can be before groups fail, or other voting models. We're focused on understanding *when* and *why* group size helps."

  **Why Dice, Not Jury?** Courtroom juries deliberate intensely, creating interdependence and potential bias. The dice example isolates individual competence and highlights the shared evidence problem cleanly. The courtroom analogy also invites distracting legal/political tangents.

  **Key Sequence Logic:** Start simple (Dice), establish core conditions rigorously, immediately confront the shared evidence problem as the critical *breakdown* point, clarify helpful deliberation, then systematically dismantle misconceptions before they solidify, ending with the key conditional nature. The landing question directly tests understanding of the shared evidence limitation.
