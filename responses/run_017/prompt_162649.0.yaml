prompt: |-
  I sit on the grants panel of a small regional arts council. We hand out around forty micro-grants a year (two or three thousand to eight thousand dollars, so real money to the applicants and nothing much to us), two rounds a year, and each of the four panelists reads about twenty applications in a fortnight on top of a day job. We also have to write two sentences of feedback that go back to every applicant, including the ones we turn down, so we can't just say "not innovative enough" and move on. At the moment the meeting is four people arguing vibes and the loudest person usually wins, and I want something better than that which isn't just a spreadhseet of diversity boxes.

  I've been reading Tolstoy's book on art — the one where art is the transmission of feeling by infection, where sincerity matters more than craft, where art that only trained people can catch is suspect, and where he ends up throwing out most of what a panel like ours would fund, his own big novels included. I think his conclusions are unusable for us, but the infection/sincerity framing is, I suspect, exactly what we're reaching for when we say "this one moved me" versus "this one is just clever." So: turn it into a procedure four volunteer panelists with no theory background can run in ten to fifteen minutes an application. I want the questions in order, what counts as a passing answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts.

  Four places where I want you to add machinery Tolstoy doesn't give me, and to be honest that you're adding it: (1) his test is a first-exposure test and I don't trust first exposure — build in a re-encounter step, panelist meets the work again a few days later in a different format or setting (a recording instead of live, a phone screen instead of the gallery), and give me a rule for what happens when the two exposures disagree. (2) He's scathing about art you need preparation to be infected by, but we fund string quartets and installation work, so I need that turned into a distinction I can actually apply between "needs craft literacy to land" and "needs status initiation to land," with examples of each. (3) His top-tier demand is that real art carries the religious perception of its age, which obviously can't go in a public funding letter; give me the secular translation you'd defend (something about what the work implies about how to live, or about suffering and death, or about what the community treats as sacred) and say plainly what gets lost in translating it. (4) Whatever you take his catalogue of counterfeit art to be — borrowing, realism-as-fidelity, strikingness, amusement — turn it into flags with thresholds, and tell me which flag will misfire hardest on applications like ours.

  Then run the finished procedure on three cases from our last round: a technically fearsomely good contemporary composition that all of us admire and none of us enjoys; a participatory neighbourhood project that is unmistakably sincere and genuinely warms you and is, aesthetically, pretty thin; and an immersive, extremely fun installation with a big audience and not much craft to speak of. At least one of the three has to come out the way my panel will hate. Finish by telling me where the procedure genuinely can't be trusted — satire and irony, work that's cold or withholding on purpose, work from traditions none of us are competent in, and whatever else you think breaks it.
reasoning: |-
  We are designing a grant evaluation procedure based on Tolstoy's ideas (sincerity and emotional infection) but adapted for practical use by a panel of non-theorists with limited time. We'll address the four specific modifications requested and then apply the procedure to the three cases.

  ### Core Procedure Structure
  Each application is evaluated through a series of steps (questions). The steps are designed to be sequential, with clear pass/fail thresholds at some points and value judgments at others. The entire process should take about 10-15 minutes per application per panelist (including the re-encounter step, which is done asynchronously).

  #### Step 1: First Exposure (Immediate Emotional Response)
  - **Question:** Immediately after first exposure (e.g., reading/viewing/listening to the application materials), what is your gut emotional reaction? Does the work move you? (Note: This is a quick, unfiltered response.)
  - **Passing Answer:** A clear positive or negative reaction (e.g., "I felt something," even if it's discomfort, sadness, joy). A neutral or "meh" reaction is a fail.
  - **If Fail:** The application is set aside for now (but not rejected yet) and revisited in Step 2 (Re-encounter). Note: A strong negative reaction (e.g., anger, disgust) is still a passing answer for this step because it indicates the work has provoked a feeling. Only indifference fails.

  #### Step 2: Re-encounter (Delayed Response)
  - **Procedure:** At least 24 hours later, the panelist re-encounters the work in a different format (if possible). For example:
    - If first exposure was live performance, now watch a recording.
    - If first was in a gallery, now view photos on a phone.
    - If first was reading a script, now listen to an audio excerpt.
  - **Question:** Does the work still evoke an emotional response? Is it consistent with the first exposure?
  - **Passing Answer:** 
    - If the first exposure passed (i.e., evoked a feeling), then the re-encounter must also evoke a feeling (any feeling, not necessarily the same one). 
    - If the first exposure failed (indifference), then the re-encounter must evoke a feeling to pass.
  - **Rule for Disagreement:** 
    - If the two exposures disagree (e.g., first was positive, second is negative, or vice versa), then the panelist must note the discrepancy and proceed to Step 3 with caution (flagging the instability of the response). 
    - If both exposures are indifferent, the application fails at Step 2 and is rejected (no emotional infection). 
    - If both exposures evoke a feeling (even if different), proceed to Step 3.

  #### Step 3: Sincerity Check
  - **Question:** Does the work feel sincere? (i.e., Does it feel like the artist is genuinely expressing something they care about, rather than being derivative, cynical, or trying to impress?).
  - **Passing Answer:** The panelist must feel the artist is sincere. If unsure, consider: Does the work feel like it's trying too hard? Does it feel manufactured? 
    - Pass: "Yes, it feels authentic."
    - Fail: "No, it feels contrived, borrowed, or insincere."
  - **If Fail:** Reject the application. (Tolstoy: Without sincerity, there's no art.)
  - **If Pass:** Proceed to Step 4.

  #### Step 4: Accessibility Distinction (Craft Literacy vs. Status Initiation)
  - **Question:** Does the work require "craft literacy" (i.e., knowledge of the art form's techniques and history) or "status initiation" (i.e., belonging to a specific social group or knowing insider codes) to be appreciated?
  - **Distinction:**
    - **Craft Literacy:** The work requires understanding of the form (e.g., a string quartet requires knowing how to listen for counterpoint; a complex poem requires understanding of meter and allusion). This is acceptable if it doesn't exclude the average engaged person who is willing to learn. Example: A contemporary dance piece might require knowing the vocabulary of modern dance to appreciate its innovations, but a panelist can learn that without being part of an elite.
    - **Status Initiation:** The work requires being part of a specific in-group (e.g., understanding obscure academic theory, knowing the latest art-world gossip, or having a specific identity experience that the artist doesn't help bridge). This is not acceptable. Example: A painting that references a niche meme only known in a small online community without providing context.
  - **Passing Answer:** The work should rely on craft literacy, not status initiation. If it requires status initiation, it fails. If it requires craft literacy, it passes as long as the panelist (representing a reasonably engaged but non-expert audience) can access it with the materials provided (e.g., an artist statement that explains the context).
  - **If Fail:** Reject the application.
  - **If Pass:** Proceed to Step 5.

  #### Step 5: Secular "Religious Perception" (How to Live)
  - **Question (Secular Translation):** Does the work engage with fundamental human concerns (e.g., suffering, death, love, justice, community) in a way that offers insight or challenges the viewer's understanding of how to live? Does it touch on what the community holds sacred (e.g., values like equality, freedom, connection to land, etc.)?
  - **What Gets Lost:** Tolstoy's original concept is tied to a specific (Christian) moral framework and the idea of universal brotherhood. The secular version loses the explicit religious grounding but retains the ethical and existential weight.
  - **Passing Answer:** The panelist must feel the work has something meaningful to say about the human condition or the community's values. It doesn't have to be optimistic or prescriptive; it can be a question or a challenge. 
    - Pass: "Yes, it made me think about [X human concern] in a new way."
    - Fail: "No, it feels trivial, decorative, or avoids depth."
  - **If Fail:** Reject the application.
  - **If Pass:** Proceed to Step 6 (if applicable) or to the final decision.

  #### Step 6: Counterfeit Art Flags (Borrowing, Realism-as-Fidelity, Strikingness, Amusement)
  - **Flags and Thresholds:** 
    - **Borrowing:** The work feels derivative or imitative of other artists without adding a personal voice. **Threshold:** If the panelist feels the work is more than 50% reliant on copying others (without transformation), flag it. If flagged, it fails unless the borrowing is clearly intentional (e.g., homage, critique) and the work still feels sincere (Step 3) and emotionally infectious (Steps 1-2).
    - **Realism-as-Fidelity:** The work is praised for technical accuracy (e.g., photorealistic painting, historically accurate reenactment) but without emotional depth or insight. **Threshold:** If the work's primary virtue seems to be accuracy, and it fails Steps 1-2 or 5, flag it. If flagged, it fails unless it also passes Step 5 (i.e., the realism serves a deeper purpose).
    - **Strikingness:** The work is attention-grabbing (shock value, novelty for novelty's sake) but hollow. **Threshold:** If the work is striking but fails Step 3 (sincerity) or Step 5 (depth), flag it. If flagged, it fails.
    - **Amusement:** The work is entertaining but lacks substance (e.g., pure comedy without insight, decorative art). **Threshold:** If the work is primarily amusing and fails Step 5 (depth), flag it. If flagged, it fails unless the amusement serves a deeper purpose (e.g., satire that critiques society).
  - **Procedure:** If any flag is triggered and the work doesn't meet the exception (i.e., it still has sincerity and depth), the application is rejected. If no flags are triggered, or if triggered but the exception applies, the application passes to the final decision.

  #### Final Decision: Values Weighing
  - At this point, the application has passed all previous steps (emotional infection in Steps 1-2, sincerity in Step 3, accessibility in Step 4, depth in Step 5, and no disqualifying counterfeit flags in Step 6). 
  - **Question:** Given the limited funds, does this application align with the council's values (e.g., supporting regional artists, innovation, community impact, diversity of forms)? This is a values judgment by the panelist.
  - **Procedure:** Each panelist scores the application on a scale (e.g., 1-5) for alignment with the council's mission. Then the panel discusses and ranks the applications. The loudest person doesn't automatically win because the procedure has already filtered out weak applications.

  ### Running the Procedure on Three Cases

  #### Case 1: Technically fearsomely good contemporary composition that all admire but none enjoys
  - **Step 1 (First Exposure):** Likely neutral or negative (no enjoyment). **Fail** (indifference).
  - **Step 2 (Re-encounter):** Listen to a recording. If still no emotional response, **Fail** and reject. If there's a response (e.g., appreciation of complexity), proceed.
    - *Assume in re-encounter, it still doesn't move them.* → **Reject.**
  - *Why the panel might hate this:* They admire the craft, but the procedure rejects it for lack of emotional infection.

  #### Case 2: Participatory neighbourhood project, unmistakably sincere, warms you, aesthetically thin
  - **Step 1:** Positive emotional response (warmth). **Pass.**
  - **Step 2:** Re-encounter (e.g., photos of the event). If the warmth returns, **Pass.**
  - **Step 3:** Sincerity is clear. **Pass.**
  - **Step 4:** Accessibility: It's participatory and doesn't require any special knowledge. **Pass.**
  - **Step 5:** Depth: It engages with community and human connection (a fundamental concern). **Pass.**
  - **Step 6 (Flags):** 
    - Aesthetically thin might be flagged as "amusement" or "strikingness" if it's only feel-good. But because it has sincerity and depth (community values), it passes the flags.
  - **Final Decision:** It passes all steps and is a strong candidate for funding.

  #### Case 3: Immersive, extremely fun installation, big audience, not much craft
  - **Step 1:** Positive (fun). **Pass.**
  - **Step 2:** Re-encounter (e.g., video walkthrough). If the fun is still there, **Pass.**
  - **Step 3:** Sincerity: If it feels like a genuine attempt to create joy, **Pass.** If it feels like a cynical crowd-pleaser, **Fail.**
    - *Assume it's sincere fun.* **Pass.**
  - **Step 4:** Accessibility: Likely low barriers. **Pass.**
  - **Step 5:** Depth: Does it engage with a fundamental concern? If it's just fun without insight (e.g., a rollercoaster ride), **Fail.** If it uses fun to explore something deeper (e.g., play as human necessity), **Pass.**
    - *Assume it's pure amusement.* **Fail.**
  - **Step 6 (Flags):** If it fails Step 5, then the "amusement" flag triggers and it fails.
    - **Reject.**
  - *Why the panel might hate this:* It's popular and fun, but rejected for lack of depth.

  ### Where the Procedure Breaks
  1. **Satire and Irony:** These rely on indirectness and can appear insincere (Step 3) or cold (Step 1). The procedure might reject them if the emotional infection is delayed or requires decoding. *Mitigation:* In Step 3, allow for artistic strategies that use irony as a tool for sincerity (e.g., to critique). In Step 5, consider if the work offers insight through irony.
  2. **Cold or Withholding Work:** Some art (e.g., minimalism, conceptual art) intentionally avoids emotional expression. The procedure (Steps 1-2) might fail it. *Mitigation:* In Step 1, expand emotional response to include intellectual fascination or unease. But Tolstoy would argue this isn't art.
  3. **Traditions None Are Competent In:** Step 4 (accessibility) might fail if the work requires cultural knowledge the panel lacks. *Mitigation:* Use artist statements and context to bridge gaps. If the panel can't access it even with context, it might be rejected unfairly. This is a major flaw.
  4. **Art That Requires Multiple Exposures:** Some works grow on you. The re-encounter step helps, but if a work needs five viewings, it might fail Step 2.
  5. **Shocking or Offensive Work:** Strong negative emotions (e.g., disgust) pass Step 1-2, but the panel might reject it in the values weighing (Final Decision) for community harm.

  ### Final Note
  This procedure makes Tolstoy's framework actionable but will reject many works that the art world values (e.g., highly technical or conceptual pieces). It prioritizes emotional accessibility and sincerity over innovation or craft. Use it as a filter to narrow the pool, then discuss the survivors in the values weighing step.
answer: |-
  Here's a Tolstoy-inspired evaluation procedure designed for your constraints, structured as a sequential checklist with clear pass/fail gates. It prioritizes emotional infection and sincerity while incorporating your four requested modifications. The entire process (per application) should take 10-15 minutes per panelist, including the re-encounter step.

  ---

  ### **The Sincerity-Infection Evaluation Procedure**
  **Order of Questions, Thresholds, and Handoff Rules**  
  *(Each panelist completes this independently before group discussion)*

  1. **FIRST EXPOSURE REACTION (Vibes Check)**  
     *Question:* "Did I feel an immediate emotional shift (e.g., moved, unsettled, joyful, angry) during first exposure?"  
     - **Pass:** Clear emotional reaction (positive or negative).  
     - **Fail:** Indifference, boredom, or purely intellectual admiration.  
     - **Stop if fail:** Application rejected unless saved in Step 2.  
     - *Why here?* Filters out work that fails Tolstoy's core "infection" test.

  2. **RE-ENCOUNTER TEST (Modification #1: Anti-First-Impulse Bias)**  
     *Procedure:* Re-experience the work 48+ hours later in a different format (e.g., switch live → recording, gallery photos → video snippet, script → audio).  
     *Question:* "Did the emotional resonance persist or deepen?"  
     - **Pass:** Emotion returns or intensifies.  
     - **Fail:** Emotion fades; work feels flat or contrived.  
     - **Disagreement rule:** If first exposure passed but re-encounter fails, application **rejected** (indicates fleeting impact). If first failed but re-encounter passes, proceed but flag as "fragile."  
     - *Why here?* Adds rigor against knee-jerk reactions.

  3. **SINCERITY ASSESSMENT (Tolstoy's Core)**  
     *Question:* "Does this feel like a necessary expression from the artist, not a performance of cleverness or trendiness?"  
     - **Pass:** Feels urgent, personal, or vulnerable (e.g., "This artist is burning to say this").  
     - **Fail:** Feels calculated, borrowed, or emotionally hollow.  
     - **Stop if fail:** Application rejected.  
     - *Why here?* Gatekeeps against Tolstoy's "counterfeit" art.

  4. **ACCESSIBILITY AUDIT (Modification #2: Craft vs. Status)**  
     *Question:* "Does this require **craft literacy** (teachable skills) or **status initiation** (in-group knowledge) to resonate?"  
     - **Craft Literacy Examples:** String quartet (requires understanding of harmony); abstract painting (requires visual composition knowledge); poetry (requires rhythm sensitivity).  
     - **Status Initiation Examples:** Art referencing niche academic theory; insider art-world jokes; work relying on unspoken identity credentials.  
     - **Pass:** Relies on craft literacy *and* provides accessible entry points (e.g., program notes, clear artist statement).  
     - **Fail:** Demands status initiation or lacks accessible bridges.  
     - **Stop if fail:** Application rejected.  
     - *Why here?* Funds skill-dependent work without elitism.

  5. **DEPTH SCAN (Modification #3: Secular "Religious Perception")**  
     *Question:* "Does this grapple with a fundamental human condition (suffering, death, love, justice) or community sacred value (e.g., belonging, land, dignity)?"  
     - **Secular Translation:** "Does it ask 'how should we live?' through its form/content?"  
     - **What’s Lost:** Tolstoy’s moral universality; reduced to "meaningfulness."  
     - **Pass:** Clearly engages with one of these themes.  
     - **Fail:** Avoids depth; purely decorative, escapist, or superficial.  
     - **Handoff if pass:** Proceed to Step 6.  
     - **Stop if fail:** Application rejected.  
     - *Why here?* Filters out trivial work.

  6. **COUNTERFEIT ART FLAGS (Modification #4: Threshold Triggers)**  
     *Apply these thresholds; reject if 2+ flags trigger:*  
     - **Borrowing:** >50% derivative (e.g., copies another artist’s style without adding perspective).  
     - **Realism-as-Fidelity:** Prioritizes technical accuracy over emotional truth (e.g., photorealistic portrait with no psychological insight).  
     - **Strikingness:** Relies on shock/novelty without substance (e.g., gratuitous violence or trendy aesthetics).  
     - **Amusement:** Only seeks entertainment (e.g., empty crowd-pleasing).  
     - **Hardest Misfire:** *Strikingness* (will reject legitimately provocative work that uses shock meaningfully).  
     - **If flagged:** Application rejected.  
     - *Why here?* Catches Tolstoy’s "fakes" efficiently.

  7. **VALUES HANDOFF (Panel Decision)**  
     *Only applications passing Steps 1-6 reach here.*  
     *Question:* "Does this align with our council’s values (e.g., regional impact, innovation, community care)?"  
     - **No rules:** Group deliberation on values/funding priorities.  
     - *Why here?* Acknowledges that art passing Tolstoy’s test may still not serve your mission.

  ---

  ### **Application to Your Three Cases**
  **Case 1: Technically fearsome contemporary composition (admired, not enjoyed)**  
  - Step 1: **Fail** (no emotional shift).  
  - Step 2: Re-encounter with recording → **Fail** (still no emotion).  
  - **Outcome: Rejected.**  
  - *Why panel hates it:* Values craft over infection. Tolstoy calls this "art for the elite."

  **Case 2: Sincere, heartwarming neighborhood project (aesthetically thin)**  
  - Step 1: **Pass** (feels warm/connected).  
  - Step 2: Photos/videos retain warmth → **Pass.**  
  - Step 3: **Pass** (unmistakable sincerity).  
  - Step 4: **Pass** (requires no special literacy; participatory bridges built-in).  
  - Step 5: **Pass** (engages "community sacred value" of belonging).  
  - Step 6: **No flags** (not borrowing/striking/amusing despite thin aesthetics).  
  - Step 7: **Handoff for funding** (strong community alignment).  
  - **Outcome: Fund.**  
  - *Why Tolstoy approves:* Prioritizes sincerity/community over craft.

  **Case 3: Fun immersive installation (popular, low craft)**  
  - Step 1: **Pass** (delight/fun).  
  - Step 2: Video walkthrough retains fun → **Pass.**  
  - Step 3: **Pass** (sincere attempt to create joy).  
  - Step 4: **Pass** (no status initiation needed).  
  - Step 5: **Fail** (no engagement with human condition/sacred value).  
  - **Outcome: Rejected at Step 5.**  
  - *Why panel hates it:* Popular + fun but fails depth test. Tolstoy’s "amusement" flag.

  ---

  ### **Where the Procedure Breaks**  
  1. **Satire/Irony:** Fails Step 3 (sincerity appears masked) or Step 5 (depth is buried). *Solution:* Allow panelists to flag "intentional coldness" for group debate in Step 7.  
  2. **Culturally Specific Work:** Fails Step 4 (misread as "status initiation") if panel lacks context. *Solution:* Require artist statements explaining cultural frameworks; defer to panelists from that tradition.  
  3. **Minimalist/Withholding Art:** Fails Step 1 (no immediate emotion). *Solution:* In re-encounter (Step 2), allow "resonant absence" (e.g., unease that lingers) as a pass.  
  4. **Process-Based Art:** Fails Step 5 if documentation can’t convey depth. *Solution:* Prioritize artist descriptions of intent.  
  5. **Tolstoy’s Blind Spots:** Rejects innovation-driven work (e.g., craft experiments) and anything requiring reflection (his "infection" is immediate).  

  ---

  ### **Implementation Tips**  
  - **Training:** Use a 1-pager with examples (e.g., "Craft vs. Status: Quartet = pass; Insider art joke = fail").  
  - **Speed:** Panelists complete Steps 1-6 independently pre-meeting; meeting time reserved for Step 7 (values debate).  
  - **Bias Check:** In Step 4, ask: "Could a engaged high-schooler access this with the materials provided?"  
  - **Output:** Feedback to applicants cites specific steps (e.g., "Rejected at Depth Scan: Didn’t engage human fundamentals").  

  This procedure forces engagement beyond vibes, funds "moving" art regardless of polish, and will reliably reject crowd-pleasing fluff or elitist work—guaranteeing at least one controversial decision per round.
