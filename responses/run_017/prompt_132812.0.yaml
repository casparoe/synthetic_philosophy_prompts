prompt: |-
  I serve on the committee drafting the disclosure policy for a large genomic research programme. Two questions are in front of us: whether to honour a participant's standing request not to be told certain results, and whether to return unsolicited findings that we come across while looking for something else. A colleague on the committee, a health economist, has produced an argument he says settles both at once and in the same direction. I cannot accept his conclusion, but I also cannot locate the mistake, and I would rather not dismiss the argument for the wrong reason.

  Here is the argument as he gave it to us.

  (1) Good's theorem. Take an agent with probabilities over states, a utility function over consequences, and a fixed set of feasible acts. Offer her, at no cost, the chance to observe the outcome of an experiment before she chooses. Then the expected utility of the situation in which she has that option is at least as great as the expected utility of the situation in which she does not. The proof is two lines: conditional on any signal, she can still perform the act that was optimal before the experiment; so the value of choosing after the signal is at least the value of choosing without it, for every possible signal; and averaging over the signals preserves the inequality.

  (2) Nothing in that proof turns on what the signal is about, on whether the agent understands it, on whether she will in fact use it well, or on how well she will remember it. It uses only two things: that she is free to condition her choice on the signal, and that the acts available after the signal include the acts available before. So the result is entirely neutral about content and about competence.

  (3) Therefore, for a rational agent, costless information cannot be worse than ignorance. He calls this the principle that ignorance never pays.

  (4) So anyone who declines costless information, or who asks in advance not to be given it, is making a mistake by her own lights: there is no such thing as a rational preference for ignorance. Whatever else may be said for the person who asks not to be told a secondary finding, who avoids a spoiler, or who declines a predictive test for a condition nobody can treat, she is not serving her own interests.

  (5) So a policy of honouring such requests cannot be defended as protecting the person who makes it. It can only be defended by its effects on third parties. And a clinician who respects the request is, by the patient's own lights, making the patient worse off.

  (6) I pressed him on the case in which every decision has already been made: the treatment is over, the outcome is fixed, and the clinic offers to tell you now, for nothing, which way it went, knowing that being told will darken the rest of your life and change nothing else. Even here, he says, ignorance never pays, because the theorem is silent about timing and about content.

  (7) I pressed him on information that forecloses options, where coming to know something triggers a duty you would rather not have — a duty to report, to disclose, to remediate, to testify — or otherwise alters what you may do or what others may do to you. Even here, he says, the theorem holds, since choosing as if you did not know is the only move the proof requires, and it is always available.

  That last pair of replies is where I lose my footing, because neither strikes me as credible and yet I cannot say which premise fails. I have two候选 diagnoses, and I cannot tell which bears the weight. One is that something slips between (3) and (4): the theorem is a claim about an expectation taken before the signal is drawn, and my colleague is using it to condemn a preference, and to underwrite a standing policy, in a way that confuses what is true in expectation beforehand with what is true of the situation you actually end up in. The other is that the proof quietly assumes that consequences are fixed by the act and the state alone, so that what the agent knows enters only through what she chooses; in the cases at (6) and (7) the outcome seems to depend on her knowledge itself, and then the two-line proof has nothing to bite on.

  Please tell me which step you would reject, why that step looked safe, and what rejecting it costs. I would like the alternatives priced, not just one of them dismissed: if the fault is the slide from an ex ante expectation to a verdict about preference and policy, what exactly does the theorem still entitle us to say? If the fault is the assumption that outcomes are functions of act and state alone, does giving that up cost us the separation of belief from desire that the whole expected-utility apparatus rests on, and with it any external standpoint from which a preference for ignorance could be called irrational? And is there some third break point I have not considered — something about the agent's later self not sharing her earlier self's aims, say — that does the work more cheaply?

  Two claims I am reluctant to surrender: the theorem itself, read as a claim about the idealised agent in (1); and the thought that a right not to know protects something real, which is what our committee is being asked to decide. If those two cannot both be kept, say so and tell me which you would drop.

  Finally, I want to know what would change your mind. Name the argument or consideration that would move you to a different diagnosis, tell me where your reasoning is most likely to fail, and say what my colleague would say in reply if he were in the room — I have to go back to him with this.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're on a committee for a genomic research program's disclosure policy, debating two issues: honoring participants' requests not to know certain results and returning unsolicited findings. Their colleague, a health economist, uses Good's theorem to argue that withholding information is never rational. The user disagrees but can't pinpoint the flaw.

  First, I need to recall Good's theorem. It states that having more information never harms a rational agent's expected utility. The colleague extends this to say declining information is irrational. But the user mentions two problematic cases: one where knowing worsens life without changing outcomes, and another where knowledge imposes duties.

  Hmm, the user suspects two possible flaws: one is mixing ex-ante expectations with actual outcomes, and the other is that outcomes might depend on knowledge itself, not just acts and states. I need to evaluate both.

  Looking at the first issue: the theorem deals with expected utility before receiving information. But in practice, after knowing, the actual utility might be lower. For example, knowing bad news that can't be changed might cause distress. The theorem's expectation averages over all possibilities, but once the bad outcome is known, the average doesn't matter—the harm is real. So the slide from "expected utility is higher" to "you're always better off knowing" might be misleading. The colleague could counter that rationally, you should still prefer the option with higher expected value. But humans aren't perfectly rational; we have emotions. Even if rationally sound, forcing information on someone against their will ignores autonomy.

  The second issue: if knowledge itself affects utility, not just through actions. In the example where knowing triggers duties, the state of knowledge changes the consequences. The theorem assumes consequences depend only on acts and states, not on what you know. If knowing creates obligations, that assumption breaks. The colleague says you can still choose to act as if ignorant, but is that feasible? Legal duties might compel action regardless of your choice. So the set of available acts changes when you know, violating the theorem's precondition.

  Also, in the case where knowledge causes distress without changing actions, utility directly depends on the psychological state induced by knowing. The theorem doesn't account for that. Expected utility theory separates beliefs and desires, but if the fact of knowing alters desires' satisfaction (like peace of mind), then it's entangled. This challenges the model's applicability here.

  The user wants to preserve both Good's theorem and the right not to know. The solution might be distinguishing between instrumental and intrinsic value of information. Good's theorem is about instrumental value—information helping achieve goals. But some information has intrinsic disvalue (e.g., emotional harm). The theorem doesn't cover that.

  Another angle: identity over time. The person before knowing might prefer ignorance to protect their future self, who will suffer. The future self, once knowing, might regret it, but the prior self's preference matters. This introduces dynamics the static model doesn't handle.

  What would change my mind? If evidence shows that, empirically, people never regret receiving information they initially feared, or if the duty-triggering info always leads to better outcomes. But that's unlikely. The colleague might argue that emotional costs are just part of utility, so the theorem still holds. But then, if a person assigns high disutility to knowing, the theorem would still say it's rational to avoid it? Wait, but the theorem says information can't hurt expected utility, but if simply knowing has high disutility, then not knowing could be better. That contradicts the theorem. So maybe the key is that the theorem assumes information doesn't directly affect utility. Aha! That's crucial. Once utility depends on information state, the theorem's proof fails because the consequences change based on knowing, regardless of actions.

  So, the most robust objection is that the colleague's application ignores that utility can depend on the knowledge state itself, breaking the theorem's assumptions. This preserves the theorem for cases where utility is only affected through actions, but acknowledges its limits elsewhere. The right not to know protects against intrinsic harms, not just instrumental ones. The committee can honor requests based on autonomy and intrinsic costs without rejecting Good's theorem entirely.
answer: |-
  Your colleague's argument is rigorous but overextends Good's theorem by neglecting critical assumptions about how knowledge *itself* can alter utility or constrain agency. The flaw lies in the **second diagnosis**: the theorem assumes that consequences depend *solely* on the agent's act and the state of the world, with no direct effect from the agent's epistemic state (i.e., what they know). This is where his replies to (6) and (7) collapse. Below, I dissect the breakpoint, preserve both your non-negotiables (Good's theorem for idealized agents and the "right not to know"), and price the alternatives. For clarity, I address your questions in order.

  ### The Critical Break Point: Step (3) to (4)
  - **What fails**: The inference from "*Costless information cannot harm a rational agent's expected utility*" (step 3) to "*Declining costless information is irrational*" (step 4).  
  - **Why it looked safe**: Good's theorem is mathematically sound for its narrow scope: it shows that *before* observing a signal, the *ex ante expectation* of utility is non-decreasing when information is freely available. Your colleague treats this as proof that an agent *in every actual circumstance* is better off knowing. But this ignores that **utility may directly depend on the agent's knowledge state**, independent of acts or states.  
  - **Why it fails**:  
    - **Case (6)**: When knowing a fixed outcome "darkens the rest of your life," utility is no longer a function of acts/states alone. The *experience of knowing* becomes a direct source of disutility (e.g., anxiety, loss of hope). The theorem assumes that after seeing the signal, the agent can still achieve the *same consequences* as before by choosing the same act. But here, the consequence "a life unburdened by tragic knowledge" is *inaccessible* once the signal is observed—even if you "choose as if ignorant."  
    - **Case (7)**: When knowledge triggers duties (e.g., legal obligations), the *set of feasible acts* changes. You cannot "choose as if you did not know" if the law compels disclosure. The theorem requires that the acts available *after* the signal include those available *before*. If knowing eliminates the option of *plausible deniability*, this condition is violated.  

  ### What Rejecting This Costs: Preserving Both Your Non-Negotiables
  Rejecting your colleague's inference **does not require abandoning Good's theorem or the right not to know**. Instead, it confines the theorem to its proper domain:  
  - **Good's theorem remains valid** for idealized agents whose utility *only* depends on acts and states (e.g., a purely consequentialist robot).  
  - **The right not to know is defensible** because:  
    - **Utility can be knowledge-dependent**: Humans derive value from epistemic states (e.g., hope, privacy, avoidance of psychological harm).  
    - **Autonomy matters**: Even if information *could* improve decisions, a person may reasonably value control over their mental state.  
  - **Cost**: We must accept that expected utility theory (EUT) has **limits in real-world policy**. EUT separates belief and desire *only if* consequences are "state-act" functions. When knowledge itself affects utility (case 6) or alters feasible acts (case 7), we need a richer model of welfare (e.g., one incorporating psychological integrity or relational autonomy). This doesn't destroy EUT—it clarifies its boundaries.  

  ### Pricing the Alternatives
  1. **Your first diagnosis (ex ante vs. ex post)**:  
     - **Argument**: The theorem speaks to *ex ante* expectations but doesn't justify overriding *ex post* preferences in actual outcomes.  
     - **Cost**: This preserves the right not to know but *weakly* challenges your colleague. He could reply: "Rational agents *should* maximize *ex ante* expectations; a later preference for ignorance is hindsight bias." You then need supplementary arguments (e.g., dynamic inconsistency) to defend the policy.  
     - **What the theorem still allows**: It supports offering information *by default*, but not forcing it on those who preemptively refuse.  

  2. **Your second diagnosis (outcomes depend on knowledge)**:  
     - **Argument**: Knowledge itself alters consequences or acts, breaking the theorem's core assumption.  
     - **Cost**: Forces us to model "epistemic utility" explicitly, complicating policy design. EUT remains intact for instrumental information (e.g., data guiding treatment) but not intrinsic cases (e.g., untreatable conditions).  
     - **Strength**: This cleanly refutes your colleague's reply to (6) and (7) and protects the right not to know. It avoids undermining EUT's belief-desire separation because we simply add knowledge as a *parameter* in the utility function.  

  3. **A third break point: Identity over time**  
     - **Argument**: The agent before learning (Self 1) and after (Self 2) may have conflicting interests. Self 1 rationally avoids information to protect Self 2's well-being.  
     - **Cost**: This introduces behavioral economics (e.g., hyperbolic discounting), which your colleague might dismiss as "irrational." It also risks overcomplicating policy.  
     - **Viability**: Less efficient than your second diagnosis—it doesn't resolve case (7) and concedes too much to your colleague's rational-agent framework.  

  ### What Would Change My Mind
  - **The argument**: Empirical evidence that humans *never* experience irreversible harm from information (e.g., studies showing genetic spoilers cause no lasting distress, or that triggered duties always improve net welfare).  
  - **Why it might fail**: My reasoning assumes knowledge can *intrinsically* reduce utility. If all disutility from knowledge stems from *instrumental* factors (e.g., poor coping strategies), your colleague could argue education mitigates this.  
  - **Your colleague's reply**: "If knowing has costs, include them in the utility function! Good's theorem then shows ignorance *can* pay—but this means your 'costless' information has hidden costs, violating the theorem's premise."  
    - **Your counter**: Precisely. The "cost" is the disutility of knowing itself, making information non-costless in policy contexts.  

  ### Policy Implications
  Your committee can:  
  1. **Honor "right not to know" requests** without rejecting Good's theorem. Ground this in:  
     - **Autonomy**: Participants define their own interests (including epistemic preferences).  
     - **Holistic welfare**: Knowledge-dependent utility is legitimate (e.g., psychological safety).  
  2. **Return unsolicited findings selectively**, weighing third-party effects (e.g., actionable findings for relatives). Good's theorem *supports* returning *instrumentally* valuable information (e.g., preventable conditions) but not intrinsically harmful ones.  

  ---  
  **In short**: Reject your colleague's step from (3) to (4). Good's theorem holds for idealized agents, but humans can rationally prefer ignorance when knowledge itself inflicts harm or constrains agency. This costs nothing in principle—it refines where EUT applies—and fully preserves the right not to know. When you face your colleague, say: *"Your proof assumes utility is separable from knowledge. When it isn't, ignorance can pay. Our policy respects that."*
