  For the embedding reply: The friend's position requires treating modal operators as "relationally sealed" - the counterpart relation fixed by the outermost operator governs all subordinate ones. This avoids contradictions but sacrifices some expressibility. It's a defensible theoretical choice, not just stipulation, because allowing track-mixing would violate the identity conditions for counterparts across worlds.

  On costs: The view explicitly gives up on determinate transworld identity facts where context doesn't resolve the track. This relativizes modality to conversational parameters - a major concession. Track selection likely relies on salience mechanisms similar to quantifier domain restriction, though the metaphysics of worlds (concrete vs abstract) isn't crucial here.

