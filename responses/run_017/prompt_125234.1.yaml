prompt: |-
  I keep noticing a pattern in how I reason and I don't have a word for it, and I'm not even sure its the same thing as the two famous cases people always bring up.

  Concretely: I've got a working list of maybe sixty independent claims I've each checked with some care — historical dates, who said what in a meeting, whether a given package still supports a library, that sort of thing. Any single one I'd put at maybe 97%. If you ask me about one of them I'll just assert it, flat out, and in the same breath I'll say sure, probably one or two things on that list are wrong. I feel no tension between those two at all, and making the list longer doesn't make me any less comfortable per claim.

  But something does happen. It shows up in what I'll do, not in what I believe. If I need to lean on five of them together — write a page that needs all five to be right — I suddenly want to go re-check those five, even though nothing about any individual one has changed and I'd have used any one of them alone without a second thought. And it's weirdly selective: I re-check the five this particular project needs and leave the other fifty-five alone, then re-check a completely different five tomorrow for a different project. I'm never thinking about the conjunction of the whole list, and I never feel any actual doubt about a member of it. It's more like my willingness to act has become sensitive to which subset you pick on, while my confidence hasn't moved at all.

  I've read a little about the lottery case, and about the thing where authors believe every sentence in their book while also believing the book contains a mistake. This feels adjacent but not identical: in those setups the question is always whether you believe the conjunction, or whether you get to keep all the individual beliefs, and nobody seems to care that the trouble might come out in action rather than belief, or that the subsetting is where the work is being done.

  So: does this have a name of its own, or is there literature on the subset-sensitivity part specifically? If the nearest established concepts are the ones I half-remember, I want to know exactly how what I'm describing differs from each of them and which one really fits; and if nothing fits, say so and give me a term, a definition, and some cases that are and aren't instances of it. I'm trying to work out what the thing is, not what to call it.
reasoning: |-
  Okay, the user describes a pattern in their reasoning where they have high confidence (97%) in each of sixty independent claims individually. They'll assert any single one without hesitation but feel the need to re-check a subset when multiple claims must be used together for an action, like writing a page that relies on five specific claims. Interestingly, their confidence in each claim doesn't change, nor do they doubt the entire list. The issue manifests in their willingness to act based on subsets, not in their beliefs.

  The user mentions being familiar with the lottery paradox and the preface paradox but feels their situation is adjacent yet different. They note that in those paradoxes, the focus is on belief in conjunctions or retaining individual beliefs, while their case involves action-oriented sensitivity to subsets. They want to know if this has a name, relevant literature, or how it differs from existing concepts.

  First, I need to recall the lottery and preface paradoxes to compare. The lottery paradox involves believing each ticket will lose individually but not believing all will lose together, highlighting a conflict in probability and belief. The preface paradox is about an author believing each claim in their book but acknowledging a mistake exists, so they don't believe the entire conjunction. Both deal with belief aggregation over conjunctions.

  The user's scenario differs because their beliefs remain intact; the conflict is in action. When acting on a subset, they feel the need for re-checking, even though their confidence per claim hasn't changed. This seems tied to risk management. Using multiple claims together increases the overall risk of error, so even if each is 97% reliable, five together have a higher chance of at least one error. The probability calculation here is key: 0.97^5 ≈ 0.86, so only 86% confidence in the conjunction. That makes sense why they'd want to re-check.

  The user emphasizes that the subsetting is crucial. They're not worried about the entire list of sixty, which would have an extremely low probability of being all correct (0.97^60 ≈ 0.16), but they aren't acting on the whole list. Instead, different subsets are used for different projects, and only those subsets trigger re-checking. This selective action based on context is important.

  I should explore concepts like "action-guidance" in epistemology, where belief doesn't always translate directly to action. The user's confidence is doxastic, but their actions are governed by pragmatic factors. The risk of a conjunction error affecting the outcome makes the cost of a mistake higher when multiple claims are involved. For example, one error in a single claim might be tolerable, but an error in one of five could derail the entire project.

  Terms like "pragmatic encroachment" might apply if the stakes influence justification. Higher stakes in a project requiring multiple claims could necessitate more checking. However, the user isn't changing their belief but their action, so it's about decision-making under risk.

  The concept of "conjunction sensitivity in practical reasoning" comes to mind. The user's behavior is rational from a risk-aversion perspective. Re-checking subsets is a way to ensure the specific conjunctions used are reliable for the task at hand. This isn't about belief revision but about minimizing failure in practical applications.

  Differences from lottery/preface paradoxes: those focus on belief inconsistency, while the user's issue is consistent belief but variable action based on utility. The user doesn't doubt individual claims or the whole list; they manage local risks for specific outputs.

  I should also consider literature on epistemic risk, decision theory, or probabilistic reasoning in practical contexts. Terms like "local context sensitivity" or "practical aggregation thresholds" might not be standard, but they capture the idea. The user's approach aligns with good practices in engineering or research where critical systems require redundant checks when components are combined.

  In summary, the core issue is the trade-off between individual reliability and conjunction failure probability in action contexts. The behavior is rational, emphasizing that belief and action can diverge based on stakes and aggregation. Naming it might involve terms from decision theory or epistemology, like "conjunction risk sensitivity" or "pragmatic action-guidance under multi-premise reliance." Providing a clear definition and examples would help the user understand and communicate their reasoning pattern.
answer: |-
  Your self-observation is remarkably precise and points to a genuinely distinct phenomenon at the intersection of epistemology, probability, and practical reasoning. While adjacent to the Lottery and Preface Paradoxes, your case differs crucially in its manifestation (**action-sensitivity** rather than **belief-inconsistency**) and its **subset-specificity**. It doesn't have a single universally agreed-upon name, but we can define it precisely, distinguish it from the paradoxes, and identify the key concepts involved.

  **Core Phenomenon Definition:**

  *   **Name:** **Conjunction Sensitivity in Practical Action-Guidance (or Subset-Sensitive Action Threshold)**
  *   **Definition:** The phenomenon where an agent maintains high, stable credence (subjective probability) in each member of a set of independent claims, experiencing no doxastic tension (no change in belief about any individual claim or the set as a whole), yet exhibits a *pragmatically driven increase in epistemic caution* (e.g., re-checking) specifically when required to *act decisively upon the conjunction* of a *practically salient subset* of those claims. The threshold for comfortable action is lowered specifically for the conjunction needed for the immediate practical purpose.
  *   **Key Characteristics:**
      1.  **Stable Individual Credence:** Confidence in each individual claim remains constant and high (~97%).
      2.  **No Global Conjunction Anxiety:** No felt need to re-check the *entire* large set or doubt its overall error rate.
      3.  **Subset-Specificity:** The trigger is the need to rely on a *specific, practically relevant subset* (e.g., these 5 claims for *this* report).
      4.  **Manifestation in Action:** The tension manifests *only* in behavior (re-checking) and willingness to *act* on the conjunction, *not* in a change in belief or felt confidence about the truth of the claims themselves.
      5.  **Independence Assumption:** The claims are treated as probabilistically independent (the error in one doesn't affect the likelihood of error in another).

  **Why it Differs from Lottery & Preface Paradoxes:**

  1.  **Lottery Paradox:**
      *   **Focus:** Belief inconsistency. You are supposed to believe *each* ticket loses (high probability) but *cannot* believe *all* tickets lose (also high probability, but contradictory to knowing one wins). It forces a choice between deductive closure of belief and high probability justifying belief.
      *   **Your Case:** You *don't* have belief inconsistency. You *consistently* believe each claim is very likely true *and* you consistently believe that *at least one* in the large set is very likely false. There's no contradiction because you aren't forming a belief in the *entire* conjunction. The paradox is avoided because you *don't* believe the large conjunction. Your tension arises *only* when a *smaller, practically needed conjunction* pushes your *willingness to act* below your comfort threshold, *without changing your beliefs*.
      *   **Difference:** Lottery forces a conflict in *belief*. Your case shows a rational adjustment in *action-readiness* based on the *practical stakes of a specific conjunction failure*, while beliefs remain stable.

  2.  **Preface Paradox:**
      *   **Focus:** Belief vs. Acknowledgement of Fallibility. You believe each statement in your book is true, but also believe (based on general fallibility) that the book *as a whole* contains at least one error. This creates tension between believing each conjunct and believing the negation of the entire conjunction.
      *   **Your Case:** Similar to Lottery, you avoid the belief inconsistency by *not* believing the entire conjunction of 60 claims. However, the Preface tension is *global* ("my whole list probably has an error somewhere"). Your re-checking behavior is *local* and *subset-specific*. You aren't re-checking because of global fallibility worries about the big list; you're re-checking because the *conjunction probability* of *this specific subset of 5* for *this specific high-stakes action* is lower than your individual claim confidence and falls below your practical threshold for *acting* on that conjunction.
      *   **Difference:** Preface creates global belief tension about the whole set. Your case involves local, pragmatic action thresholds triggered by specific, needed subsets, without global belief tension.

  **The Mechanism & Rationality:**

  1.  **Conjunction Probability:** The core driver is probability. For independent claims each with probability P (0.97), the probability that *all N* in a subset are correct is P^N.
      *   For 1 claim: 0.97 (You act comfortably)
      *   For 5 claims: 0.97^5 ≈ 0.8587 (86%) → Below your implied action threshold for a critical output.
      *   For 60 claims: 0.97^60 ≈ 0.1615 (16%) → Clearly unacceptable, but *irrelevant* because you never need to act *on the entire conjunction*.
  2.  **Practical Stakes & Risk Aversion:** When writing a page relying on 5 claims, the *cost* of *any one* of those 5 being wrong might be high (the page is flawed, misleading, or fails its purpose). The probability of *at least one error* in the 5 is 1 - 0.97^5 ≈ 14%. This 14% risk of project failure due to a factual error in one of the five claims motivates re-checking *that specific subset* to increase the conjunction probability (e.g., re-checking might push P from 0.97 to 0.99 for each, making P(all 5 correct) ≈ 95%, reducing failure risk to ~5%).
  3.  **Salience of the Subset:** The *practical need* to use a specific subset makes the conjunction probability for *that subset* salient. The other 55 claims are irrelevant to the success of *this specific project*. Your mind focuses the risk assessment precisely where the practical failure could occur.
  4.  **Action-Guidance vs. Belief:** Your stable 97% credence means you *expect* each claim to be true and will assert it individually. However, *acting* on a conjunction requires a higher standard because the cost of being wrong *in that context* is magnified by the reliance on multiple premises. Your behavior reflects rational risk management tailored to the specific task.

  **Nearest Established Concepts & Literature:**

  1.  **Pragmatic Encroachment:** This is the view that practical stakes (the costs of being wrong) can affect whether a belief is *justified* or counts as *knowledge*. Your case is a close cousin but not identical.
      *   **Similarity:** Stakes (cost of a conjunction error for the project) are driving your increased epistemic diligence (re-checking).
      *   **Difference:** Pragmatic encroachment typically argues stakes affect the *justification of belief/knowledge itself*. In your case, your credence/belief *doesn't change*; it's purely your *action threshold* based on the conjunction risk that shifts. The literature often focuses on single propositions, not conjunctions. (Key figures: Jeremy Fantl, Matthew McGrath, Jason Stanley).
  2.  **Decision Theory under Uncertainty / Risk Aversion:** Your behavior is textbook rational action under probabilistic risk, incorporating loss aversion.
      *   **Similarity:** You are weighing the utility of acting on the conjunction (publishing the page) against the disutility of acting on a false conjunction (publishing an error-filled page), modulated by the probability of the conjunction being true. Re-checking is an investment to reduce risk. The subset-sensitivity arises because the utility/disutility calculation is project-specific.
      *   **Difference:** This framework explains *why* it's rational but isn't specifically focused on the *epistemic* aspect of having stable high credence in the components while being action-wary of their conjunction. (Core concept: Maximizing Expected Utility).
  3.  **Contextualism (in Epistemology):** Argues that the standards for knowledge (or justified belief) can shift depending on the context.
      *   **Similarity:** Your action threshold (the standard for being willing to rely on the claims without re-checking) shifts contextually based on the practical project needing a specific conjunction.
      *   **Difference:** Contextualism usually focuses on shifts in *knowledge attribution standards*, not directly on the conjunction/subset sensitivity of *action* based on stable credences. (Key figures: Stewart Cohen, Keith DeRose, David Lewis).

  **What it IS and IS NOT:**

  *   **IS:**
      *   A rational, probability-driven response to the increased risk of error in conjunctions.
      *   A manifestation of pragmatic factors (stakes, project goals) influencing epistemic diligence *for action*.
      *   Highly context/subset-specific.
      *   Consistent with stable, high credence in individual claims and acceptance of global fallibility.
  *   **IS NOT:**
      *   A belief paradox (like Lottery/Preface).
      *   A change in core belief or credence about the individual claims.
      *   A global anxiety about the entire list.
      *   Irrational or inconsistent behavior (it's actually quite prudent).
      *   Primarily about knowledge justification shifting (though related).

  **Conclusion:**

  You've pinpointed **Conjunction Sensitivity in Practical Action-Guidance**. It's the rational, pragmatic adjustment of epistemic diligence (like re-checking) specifically triggered by the need to *act decisively* upon the *conjunction* of a *practically salient subset* of claims, driven by the rapidly decreasing probability of large conjunctions and the increased stakes of failure in that specific context, *while maintaining stable high credence in each individual claim and accepting global fallibility without anxiety*.

  This behavior is a hallmark of careful, risk-aware reasoning. It's not a flaw in your epistemology; it's a sophisticated adaptation to the realities of probabilistic reasoning and practical constraints. While it shares themes with Pragmatic Encroachment and Decision Theory, its core distinctiveness lies in the **subset-specific, action-oriented manifestation based on conjunction risk, divorced from any change in underlying belief or credence about the individual components.** It's how a rational agent bridges the gap between high confidence in pieces and the practical need to rely on specific combinations of them.
