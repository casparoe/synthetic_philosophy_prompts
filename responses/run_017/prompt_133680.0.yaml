prompt: |-
  I sit on my university's research-integrity committee, which adjudicates charges of misrepresentation against faculty. Our policy defines misrepresentation as "stating or otherwise conveying a materially false or misleading account of fact," and nearly every case turns on the words "or otherwise conveying." Our rulings from the last two years:

  1. A paper reported that "all twelve pre-registered hypotheses were tested"; one had in fact been tested with a different measure than the pre-registered one, disclosed in a footnote. No violation.
  2. A PI told a collaborator, "I ran the analysis we agreed on," having run it on a superseded dataset that he knew she would assume was not in play. Violation.
  3. A grant report stated, "We have not observed the effect in male mice," when male mice had never been tested; the committee found that he knew the funder would read this as a failed test rather than an unperformed one. Violation.
  4. An author replied to a reviewer, "We thank the reviewer for this suggestion," and then did not act on it. No violation.
  5. Asked by her department chair whether she had drawn on the department's shared subject pool, a faculty member answered, "Participants were recruited through the university's online system" — true, but the participants came from a commercial panel and the online system carried only the advertisement. Violation.

  The case before us now: a program officer wrote to a PI asking, "Were any participants withdrawn for safety reasons?" He replied in writing, "Three participants discontinued the study early." In fact two of the three were discontinued after adverse events that a local investigator judged possibly related to the study drug; this appears in an appendix to the annual report already in the officer's possession, in a table that never uses the words "safety" or "withdrawal" and codes the reason as "investigator decision." The PI maintains that he did not want to raise an alarm in an email, expected the officer to consult the report, and would have confirmed the safety withdrawals had he been asked again.

  Draft the recommendation I will circulate. I want: the finding we should reach if we are to be consistent with ourselves; which of the five precedents is the closest analog and why; and, because I suspect our record is equally consistent with several different rules — that only takeaways the speaker intended count, that any false takeaway a competent reader would foreseeably draw counts, that a literally true statement is excused when the speaker's own materials let the reader recover the truth, and that a reply must address the question actually asked — an explicit statement of which rule each possible finding commits us to, and of the one further variation on these facts that would best separate the rules still in play. Begin with the recommended finding in your first sentence, then give the reasoning; no preamble.
reasoning: |-
  Okay, the user is part of a university research-integrity committee dealing with a case where a PI responded to a program officer's question about safety withdrawals by stating three participants discontinued early without mentioning that two were due to adverse events possibly related to the study drug. They need to draft a recommendation that's consistent with past rulings.

  Looking at the precedents, Case 2 seems most relevant - both involve technically true statements that create false impressions by omitting key context. In Case 2, saying "I ran the analysis" while using outdated data was deemed a violation because it exploited the listener's reasonable assumptions. Similarly here, the PI's reply about discontinuations avoided the safety aspect the officer specifically asked about.

  The precedents suggest the committee uses a "foreseeable false takeaway" standard - whether a competent reader would reasonably draw incorrect conclusions (Cases 2, 3 and 5), regardless of literal truth (Case 1) or speaker intent (Case 4). 

  This case clearly meets that standard: the officer specifically asked about safety withdrawals, and the PI's selective phrasing (focusing on discontinuation while omitting safety links) predictably suggested no safety issues occurred. That the full truth appeared in an appendix doesn't excuse this - Case 5 established that technically true statements remain violations when they exploit predictable misinterpretations.

  The recommendation should find a violation, citing Case 2 as the closest precedent. To clarify the operative rule: when a statement foreseeably conveys false meaning to competent readers, it violates policy regardless of literal truth or speaker intent. The appendix detail is irrelevant because the reply itself created the misdirection.

  A hypothetical variation that would test the boundaries: if the PI had said "Three discontinued early; see Appendix Table 5 for reasons," this might not violate under the committee's apparent rule since it directs to truthful information - unlike the actual reply which actively misdirected.
answer: |-
  **Finding: Violation.**

  The PI's reply foreseeably conveyed a materially false account by omitting the safety-related reasons for discontinuation when directly questioned about safety withdrawals. Case 2 is the closest analog: both involve a literally true statement crafted to exploit the recipient's predictable, reasonable assumption, creating a misleading impression of the facts. The PI knew the program officer sought safety information; replying only about discontinuation without qualification, while knowing the officer would likely interpret this as unrelated to safety, actively misdirected. The appendix's existence does not excuse this, as the reply itself did not reference it or correct the false takeaway it invited, unlike the footnote in Case 1 which provided immediate correction.

  **Rule Commitments:**
  *   **Finding Violation commits us to:** Any false takeaway a competent reader would foreseeably draw counts as misrepresentation, regardless of literal truth or speaker intent (applied in Cases 2, 3, 5). Speaker intent (PI's claim he didn't want to alarm and expected consultation) is irrelevant if the misdirection was objectively foreseeable.
  *   **Finding No Violation would commit us to either:**
      *   Literal truth excuses misrepresentation if the truth is recoverable *elsewhere* (contradicting Cases 2, 3, 5, where truth was accessible but the statement itself misled), OR
      *   The speaker's intended takeaway controls (PI intended no deception by omission), overriding foreseeable misunderstanding (contradicting Cases 2, 3, 5).
  *   **The "address the question" rule** is not dispositive alone; a non-responsive but literally true answer *can* be a violation if it foreseeably misleads on the subject asked (Case 5).

  **Key Variation to Separate Rules:** Change the PI’s reply to: **"Three participants discontinued early; full details are in the annual report Appendix B."** This variation best separates:
  1.  **"Foreseeable False Takeaway" Rule (Likely No Violation):** The reply directs the reader to the truth, making a false takeaway less foreseeable.
  2.  **"Literal Truth + Truth Recoverable" Rule (No Violation):** The statement is literally true and explicitly points to the source of the full truth.
  3.  **"Must Address Question" Rule (Likely Violation):** The reply still avoids directly answering "yes" or "no" regarding safety withdrawals.
  4.  **"Speaker's Intended Takeaway" Rule (No Violation):** The PI’s claimed intent (expecting the officer to consult the report) is now explicitly supported by the statement.
