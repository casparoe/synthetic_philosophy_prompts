answer: |-
  ## Crane/Skyhook Review Protocol (Form CSRP-4)

  **1. Crane Detection (0-5 pts)**
  *Definition:* Identification of a plausible, incremental mechanism or process capable of lifting explanatory weight without invoking unexplained complexity or agency at the target level. Points awarded for specificity, reliance on established lower-level principles, and demonstrable assembly steps.
  *Sample Comment:* "The proposed enzymatic cascade demonstrates a clear, stepwise progression from substrate binding to conformational change (Crane +4)."

  **2. Skyhook Alert (0 to -5 pts)**
  *Definition:* Identification of an explanatory element that performs necessary lifting work but lacks any discernible mechanism or grounding in lower-level principles, effectively invoking an unexplained given. Points deducted proportional to the load borne by the suspect element and the implausibility of its spontaneous appearance.
  *Sample Comment:* "Reliance on an innate 'moral grammar module' to explain ethical intuitions lacks proposed developmental or evolutionary scaffolding (Skyhook -3)."

  **3. Greedy Reductionism Screening (0 to -3 pts)**
  *Definition:* Deduction applied when an ostensibly crane-like explanation from a lower level actively dismisses or eliminates the reality, efficacy, or causal power of the phenomenon under study at its own level, rather than grounding it. Points deducted only if the reduction demonstrably *explains away* the target phenomenon's core features as illusory or epiphenomenal.
  *Sample Comment:* "Claiming neuronal firing patterns 'are' the decision, thereby rendering deliberation causally inert, constitutes greedy reductionism (-2)." *Alternate Sample:* "Reducing aesthetic experience solely to reward pathways risks greedy reductionism by neglecting phenomenal qualia (-1, contested)."

  **4. Emergence Validation Check (0 or +2 pts)**
  *Definition:* Assessment of claims that novel properties or causal powers genuinely arise *from* complex interactions at a lower level, without being prefigured in the components alone. +2 pts awarded only if both the lower-level interactions *and* the irreducibility of the higher-level property are credibly specified, avoiding mere relabeling of a skyhook as "emergent."
  *Sample Comment:* "The model demonstrates how simple agent rules generate colony-level problem-solving not exhibited by individuals, validating weak emergence (+2)." *Alternate Sample:* "Invoking 'sui generis social causality' without detailing agential interactions fails validation (0 pts)."

  **5. Regress Containment Index (RCI) (Adjusts Final Score: -∞ to +3)**
  *Definition:* Measures the depth and plausibility of the explanatory chain supporting the primary crane(s). Points added if the chain terminates at a level widely accepted as foundational within relevant disciplines *and* the termination point is not functionally equivalent to a skyhook from the perspective of *further* reduction. Points subtracted if the chain terminates arbitrarily or relies on a termination point that appears suspiciously skyhook-like under scrutiny. *Note: Infinite regress is non-viable and scores -∞.*
  *Sample Comment:* "Primary crane assumes protein folding principles; RCI neutral (0) as biophysics is standard grounding." *Alternate Sample:* "Primary crane relies on quantum decoherence models which themselves lack a universally accepted mechanism below Planck scale; RCI caution (-1)."

  **6. Field Context Adjustment Factor (FCAF) (Multiplier: 0.5x to 2.0x)**
  *Definition:* Adjusts the score from Criteria 1-5 based on interdisciplinary context. Multiplier <1.0 applied if a mechanism standard in Field A is proposed to explain phenomena in Field B where such mechanisms are novel and their sufficiency/acceptability is unproven (risk of unrecognized skyhook). Multiplier >1.0 applied if a mechanism novel to *both* fields shows exceptional promise for integration, despite lacking established grounding in either (potential innovative crane). Default 1.0.
  *Sample Comment:* "Using established neural network models (crane in CS) for linguistic semantics (novel in Phil); FCAF 0.8 pending evidence of direct semantic capture." *Alternate Sample:* "Novel information-theoretic approach bridges cognition and thermodynamics; high-risk but potentially integrative crane, FCAF 1.5."

  **Appeals**
  Appeals challenging a CSRP-4 score must specifically identify which criterion was misapplied, citing the relevant definition. Appeals based solely on disagreement with the philosophical underpinnings of the crane/skyhook distinction will be noted for record but are non-actionable. Reviewers are reminded that the RCI inherently implies that all explanatory chains terminate somewhere; the protocol seeks only to identify terminations that *functionally* violate the spirit of mechanistic explanation *within the current proposal's scope and its interdisciplinary context*, as judged by prevailing consensus within the relevant panel expertise. If the RCI adjustment threatens universal disqualification, reviewers are advised to apply the FCAF liberally or invoke Panel Discretion (Form PD-7b) based on perceived significance, effectively defaulting to domain-specific intuition.
