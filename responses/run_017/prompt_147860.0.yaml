answer: |-
  ## The Kettle Boils Over

  **(Miriam’s kitchen, night. The kettle clicks off, steam billowing. Neither woman moves towards it. Ada leans against the counter, arms crossed, knuckles white. Miriam sits at the worn pine table, tracing a knot in the wood with her finger. The silence is thick, charged.)**

  **Ada:** (Voice tight) So. Janet called. Said she saw you at the market. Said you told her… well. That it wasn’t *bad*. For you.

  **Miriam:** (Doesn’t look up) Janet talks too much. But yes. It’s not bad. For me.

  **Ada:** (Pushes off the counter, palms flat on the table) How can you *say* that? Seriously, Mum. Months. *Months*. And it’s not *bad*? What is it, then? Neutral? A mild inconvenience? Like missing the bus?

  **Miriam:** (Looks up, meeting Ada’s furious gaze. Calm, tired) No. Missing the bus is annoying. This… this is the dying part. That’s bad. The pain, the fear, the indignity… watching you try not to cry right now? That’s awful. Leaving the Proust translation unfinished? Feels like spitting on the page. That’s all bad, truly bad. I’m not denying any of it, Ada. Not one scrap.

  **Ada:** Then *what*? What part isn’t bad? The part where you’re *dead*? That’s the bit you’re saying is fine? That’s lunacy.

  **Miriam:** Is it? Think about it. When does this ‘badness’ of being dead actually *happen* to me? When I’m alive, I’m not dead. When I’m dead… well, there’s no ‘me’ there to experience it, is there? It’s not like stubbing a toe in the afterlife. There *is* no subject. No Miriam sitting around feeling deprived. It just… stops. Like switching off a light. The darkness isn’t bad *for* the bulb.

  **Ada:** That’s… that’s just wordplay! It’s about what *doesn’t* happen! What *should* happen! You *should* be here next year. For my birthday. For the opening of the new bridge. To see if I ever manage to date someone who doesn’t bore you rigid. You *should* finish the Proust. You *should* have decades more of arguing with me about load paths over lukewarm tea! That’s what’s taken away! That’s the harm! It happens *now* – it’s a fact *now* that those things won’t happen *with you*.

  **Miriam:** And before you were born? All those billions of years? Was that a deprivation? Was it bad for little non-existent Miriam that she wasn’t around for the Renaissance or the invention of the toaster? Does anyone weep for all the birthdays I *didn’t* have in 1803?

  **Ada:** (Stares, momentarily thrown) That’s… different.

  **Miriam:** How? Seriously, Ada. Explain it to me like I’m one of your junior engineers who keeps confusing tension and compression. What’s the fundamental difference between the time before I existed and the time after? Why is one a tragedy and the other just… background noise?

  **Ada:** (Takes a breath, forcing herself to think structurally) Because… because your *life* has momentum. Direction. It’s not just random points on a timeline. Before you existed, there was no ‘you’ to be *pointing* anywhere. Now? Now you’re mid-sentence. Mid-project. Mid-arc. You’ve got things *launched*. Like… like that bridge project I did over the Kelston Gorge. The design was brilliant, Mum, honestly. It wasn't just about the tonnage of steel, it was about the *arc*. The way it was going to sweep across, carrying the load perfectly from one side to the other. If they’d stopped it halfway? Even if they’d used the *exact same amount* of steel as a shorter, squatter bridge that just reached the first abutment? Stopping it halfway would have been a disaster. A ruin. Not because the *quantity* was wrong, but because the *shape* was wrong at the point they cut it. It was designed for the whole span. Cutting it there… it doesn’t just take away the second half, it ruins the *meaning* of the first half. It makes the whole thing… pointless. Worse than pointless – a monument to failure.

  **Miriam:** (Leans back, absorbing this. A flicker of something – surprise, grudging respect?) So my life… my death makes it a poorly designed bridge? Stopped mid-span?

  **Ada:** (Nods fiercely) Yes! Exactly! It’s not just the *amount* of future you lose, it’s *where* the cut falls in the… the narrative. In the structure. You’re cutting it *now*, when things… (She gestures vaguely, frustrated) …when you’re finally… I don’t know… *settled*? Happy? Content? Not running scared anymore? After Dad… after everything… you built something good. Solid. Your work, your friends… *us*. It’s a late swell, Mum. And cutting it now… it wrecks the shape. It makes the whole thing feel… tragically incomplete. Unresolved. That’s the harm. It’s a structural flaw introduced *now*.

  **Miriam:** (Quietly) And if the shape was different? If my life… if it had been a long, slow narrowing? The good years were early, then thirty years of… well, diminishing returns? Pain, loneliness, irrelevance… and *then* the axe fell? Would that death be *less* bad? Because it landed at the abutment, not the mid-span? Would it even… (Her voice catches slightly, the thought dawning, sharp and dangerous) …would it even *improve* the whole? Tidied it up? Saved me the worst of the decline?

  **Ada:** (Goes pale) Mum! God, no! That’s not what I meant! I didn’t mean *that*! I just meant… in *your* case… with the life you *have*…

  **Miriam:** But it follows, doesn’t it? If the badness is in the wrecked shape, not the quantity lost… then a death that *fixes* a ruined shape… logically… shouldn’t be bad at all? Might even be good? A mercy? (She gives a small, bitter smile) Don’t worry, darling. I’m not planning to martyr myself aesthetically. My shape is what it is. But you see the problem. If death’s badness depends entirely on the *narrative arc* it interrupts… then it’s purely aesthetic. Subjective. And my feeling about *my* arc… well, I get a vote on that, don’t I?

  **Ada:** (Shaking her head, scrambling) It’s not just *your* feeling! It’s… it’s the connection! The way the *past* is changed! Think of… think of telling a joke! A long, elaborate setup. You build it, you deliver the punchline… it works. It’s funny. But if you just stop? After the setup? No punchline? Then the *setup itself* becomes awful. Frustrating. A waste of time. The harm – the bad joke – *happens* at the moment you realize there’s no punchline, while you’re still sitting there listening! *That’s* when the past is spoiled. And *you’re* there for that! The Miriam who built the life, who enjoyed the good years? *She’s* here, now, knowing the punchline isn’t coming. Knowing the setup won’t pay off. *That’s* who it harms. You. Right now. Because your whole life feels… foreshortened. Unfulfilled. The good years… they get tainted by the abrupt stop.

  **Miriam:** (Considers this carefully, then sighs) Ada, my brilliant bridge-builder… that’s elegant. Truly. But it’s a trick of perspective. Like judging a whole book by its last page. Those good years… they *were* good. The sun on my face in Provence translating Colette, the ridiculous arguments with Bernard over comma placement, teaching you to swear in three languages… they felt good *then*. They *were* good *then*. Are you telling me the molecules of joy in those moments somehow… retroactively decayed? Because of what happens *now*? No. They remain. What changes is how you – how *I* – assemble them into a story *now*. You’re taking the *whole* life, the entire span including its abrupt end, and saying *that* story is worse than one that ended differently. And maybe it is. But that’s a badness that lands on the *evaluation* of the whole, *now*. It’s not something that *happened* to the Miriam who was sunning herself in Provence. She was fine. Blissful, even. You can’t harm her retroactively. You can only… revise the summary. And if you count the past happiness *and* then subtract points because the story ended badly… aren’t you counting the happiness twice? Once as joy, once as a promise broken? That seems… unfair. To past me.

  **(Silence hangs. The steam has stopped rising from the kettle. The kitchen feels colder.)**

  **Ada:** (Voice thick, eyes bright but no tears falling) So you’re saying… the Miriam who was happy… she was real. She got her joy. And the Miriam who dies… she won’t be there to feel the lack. And the Miriam sitting here now… she only feels the dying, which we agree is bad, and… revises her history book? Is that it? The badness is just… editing?

  **Miriam:** (Nods slowly) More or less. The experience of good and bad happens in the moments. The fear, the pain, the love, the sun… those are real. The ‘badness’ of the absence after? That’s… a shadow cast backwards by the ending. Powerful, yes. Painful for *you*, watching it? Undoubtedly. But for *me*, the subject? Once I’m gone… there’s no subject. The shadow doesn’t fall on anyone. Only on the memory.

  **Ada:** But the promise… the *arc*…

  **Miriam:** The arc is a story we tell. A bridge we build in our heads. My life isn’t a bridge, Ada. It’s… a collection of moments. Most were pretty good, especially the later ones. I enjoyed them. That’s what I have. That’s what I *am*, until I’m not. The ‘unfinished’ part… that’s your burden, my love. Not mine. I won’t be feeling unfinished. I’ll just be… done.

  **Ada:** (Looks down at her hands, clenched on the table) I can’t accept that. I *won’t*. It feels… like you’re letting yourself off the hook. Like you’re abandoning the structure.

  **Miriam:** (Reaches out, slowly, and covers one of Ada’s fists with her own thin hand) Maybe. Or maybe I’m just refusing to build a bridge to nowhere. (A small, sour smile touches her lips) Besides, if I agreed with you, I’d have to concede I just lost this argument. And where’s the fun in that?

  **(Ada doesn’t pull away, but she doesn’t unclench her fist. They sit in the quiet kitchen, the un-drunk tea forgotten, the fundamental sentence of their disagreement – *Who is harmed, and when?* – hanging unspoken but perfectly understood between them.)**

  ---

  **For the Novelist:**

  1.  **Where They Got Off Easy:**
      *   **Miriam:** Ada didn't fully press the "Harm to Past Self" argument. Her strongest counter to Miriam's "no retroactive harm" point would be: "It's not changing the *past feeling*, it's recognizing that the *meaning* of those past events *always depended* on a future context. Your joy translating Colette wasn't *just* about the sun; it was part of building a life, a body of work, a relationship with the world. Knowing that project is aborted *now* reveals that the *nature* of those past actions was always partly forward-looking. Their 'goodness' wasn't self-contained; it was inherently teleological. You *are* harmed now by realizing the future that gave meaning to your past efforts is gone." Miriam dismisses this as "revising the summary," but Ada could argue it's revealing the *true cost* incurred by the past self who invested in that future.
      *   **Ada:** Miriam didn't ruthlessly pursue the dark implication of Ada's "shape" argument. Her strongest, cruelest reply would be: "So, if a long, painful decline *is* inevitable, and death cuts it short, you agree that death improves the overall shape? Therefore, in *that* scenario, death *isn't* bad? In fact, it might be *good*? Or at least neutral? Is that your position? Because if the badness is *only* in the dying process and the spoiled shape, then logically..." This forces Ada to either bite the bullet (saying yes, death *can* be good in some shapes, which undermines her general stance) or backtrack significantly on her core argument.

  2.  **The Arc Point: Standard or Novel?**
      Your arc point is **not just standard deprivation with extra steps; it adds a distinct and valuable dimension, but it doesn't entirely escape standard frameworks.** The standard "deprivation account" focuses on the *quantity* of future goods lost. Your "arc" argument focuses on the *structural position* of the loss relative to the life's narrative or teleological trajectory.
      *   **Why it's distinct:** It explains why deaths that deprive someone of the *same quantity* of future goods can feel *differently* tragic depending on whether the life was ascending, stable, or descending. The bridge analogy is powerful and intuitive. It introduces an aesthetic/narrative dimension ("worse shape") beyond simple summation.
      *   **Why it doesn't fully escape:** It still fundamentally relies on the *future goods being lost*; the "ruined shape" is ruined precisely *because* the expected future completion/payoff/continuation is taken away. The "badness" Ada attributes to the spoiled past relies on the *deprivation* of the future that would have fulfilled it. It shifts the *locus* and *character* of the deprivation's impact (onto the structure and the meaning of the past), but the deprivation itself remains the foundational harm. It's a sophisticated refinement, not a complete overthrow. It collapses *into* the deprivation account when pressed on *why* the shape is ruined – the answer is always the missing future component.

  3.  **Potential Confusions & Suggestions:**
      *   **"Worse-for-her" vs. "Worse-as-a-shape":** This distinction is *mostly* clean, but Miriam correctly points out the blur at the edges: if the spoiled shape causes suffering *now* (Ada's "bad joke" feeling), then that *is* a "worse-for-her (now)" experience. The "shape" argument inevitably leaks into present experience. *Suggestion:* Lean into this. Have Miriam explicitly state: "The bad shape you describe *is* a source of pain... *for me now*. But that's part of the *dying*, Ada, the *knowing*. It's not the state of *being dead* that hurts me *then*."
      *   **"Two Lives, Same Size":** This premise is **fundamentally shaky** for the deprivation account. The standard view *does* care about the *content* of the lost future, not just its duration. If Life A (front-loaded) loses only a thin, declining future, while Life B (back-loaded) loses a rich, ascending future, the deprivation is **not** the same size. The "slab you didn't get" has different qualities. Your "arc" argument is strongest when comparing lives losing *objectively similar* future stretches (e.g., both lose 10 years projected to be equally good/happy/productive), but where one life's *structure* makes that loss *feel* more catastrophic because it severs a rising arc. *Suggestion:* **Clarify the premise.** Have Ada say: "Imagine two lives, same length, same *projected* happiness for the lost years. But one was building *towards* that peak, the other was coasting down *from* it. Cutting them both *now*? The loss isn't the same. It ruins the first life's design utterly; the second life's design... maybe it was nearly done anyway." This makes the "arc" the *differentiating* factor for equally-sized deprivations.
      *   **"Who is Harmed?" Core Confusion:** The scene brilliantly exposes the central philosophical tangle. Miriam (Epicurus/Lucretius) denies a subject exists to be harmed by death itself. Ada (typically deprivation account) argues the harm is the deprivation of life the person *would have had*, impacting the evaluation of their life. Her "past harm" move (inspired by your idea) is a clever but vulnerable attempt to locate the harm *in* an existing subject (past Miriam via present realization). Miriam effectively counters its retroactivity/double-counting. *Suggestion:* **This is the core of the scene, and it's handled well.** The lack of resolution is philosophically honest. The key is ensuring Ada's frustration stems from genuinely grappling with the "no subject" problem, not just emotional refusal.

  **The scene works.** The arguments are clear, grounded, and reflect their characters. The core philosophical tensions are present and drive the conflict. The "arc" point adds a fresh, character-appropriate layer to the deprivation argument, even if it doesn't escape it entirely. The premise wobble on "same size" is fixable with minor dialogue tweaks to clarify the projection of the *lost* future. Don't shy from the unresolved, uncomfortable core – that's where the power lies.
