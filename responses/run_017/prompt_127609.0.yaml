     - Reveal the events and the important objects. Discuss: How did the disturbance formula account for the events? (10 min)

  5. **Debrief (15 minutes):**
     - Map to concepts:
       - (a) Baseline: We used the state at t0 as the baseline. But in round 3, we saw that the plant wilted even if the agent did nothing. So if the agent did nothing, the plant would have changed. But our metric counted that change as disturbance when the agent was present? Actually, if the agent did nothing, the plant would wilt and that change would occur. If the agent did something, the plant still wilted. In both cases, the plant changed from t0. So the disturbance metric counts the same change regardless of the agent's action. But if we want to measure the agent's impact, we should compare to what would have happened without the agent (the counterfactual). But we didn't have that in the formula. This shows that avoiding changes relative to the initial state doesn't capture the dynamic world and may penalize the agent for changes that would have happened anyway. Conversely, if the agent prevents a change that would have happened (e.g., waters the plant so it doesn't wilt), then the metric would not count any change (because the state at the end is the same as at t0) and thus no disturbance, but actually the agent did something good. So the metric fails to capture that.
