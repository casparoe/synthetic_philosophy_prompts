  This is the baseline problem: the metric is using the state at t0 as the baseline, but the world is dynamic. So the metric may penalize the agent for changes that would have happened anyway, or not penalize for preventing a change that would have happened (which might be good, but if the agent prevented a change that was bad, then that's good, but if they caused a change that was bad, that's bad).

  We want to show that without knowing what is valuable, we cannot define disturbance.

  **Activity Structure:**

