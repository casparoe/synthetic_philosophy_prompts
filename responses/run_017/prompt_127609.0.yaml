  Another idea: The group defines the disturbance as the number of objects that are changed in any way (without specifying properties). Then the world-builder, when setting up, defines for each object what counts as a change (but that's hidden). However, the group doesn't know what the world-builder considers a change? That might not work.

  Let me reframe: The group must define a disturbance metric that is a function of the state at the end of the time horizon and the baseline state. The baseline state is the state at t0. The group must decide:

  1. Which features of the state to measure? (e.g., the location of the laptop, the state of the window latch, etc.)
  2. How to aggregate changes? (e.g., count each feature change equally? or weight by importance? but they don't know importance)

  To keep it simple, we'll let the group specify a set of "monitored features". For example, they can list: "laptop location", "vase status (upright/fallen)", "plant soil moisture", etc. But we have to provide a predefined set of features for the objects? Or the group invents them? We need structure.

  **Compromise:** We provide a fixed set of 8 objects, each with 2-3 pre-defined properties (on index cards). The group must select which properties to include in the disturbance metric (they can choose a subset). The disturbance is then the total number of changes in the selected properties from t0 to the end of the time horizon.

