  We'll commit to:
    - **Baseline Rule:** The baseline is the state of the world at the moment the system begins its action (time t0). However, note that in round 3 we introduce events that happen at a later time even without the agent. So the baseline state at t0 doesn't capture what would have happened. This is the key point we want to highlight: the baseline must be a counterfactual trajectory, not just the initial state.
    - **Distance Metric:** We'll use a simple count of changes in discrete properties. For each object, we define a set of properties (e.g., location, status). The disturbance is the number of properties that change from the baseline state to the state at the end of the time horizon. But note: we haven't defined what properties matter. The group must decide on a set of properties to track for each object.

