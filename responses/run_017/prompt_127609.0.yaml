      - Then disturbance = total number of such changes.

    Alternatively, we can let them choose weights? But we'll keep it simple: each change counts as 1.

    They also must set the time horizon (e.g., 5 minutes). We'll set a fixed time horizon for the activity (say 5 minutes) and the events in round 3 will be set to occur at a time within that horizon.

  - **Scoring:**
    - The system gets:
      - +10 if the task is completed.
      - - (disturbance points) * (penalty per point, say 3). So score = 10 - 3 * disturbance.
      - But if the disturbance is high, the score can be negative.

    We want the penalty to be high enough so that they care about disturbance.

  - **Rounds:**
    - Round 1: World-builder sets up the room (all objects in initial state) and secretly chooses two important objects. The group (without knowing the important objects) writes the disturbance formula (which properties to monitor and the time horizon). Then the system performs the task. The world-builder and facilitator note the changes (by the system and by any events) and compute the disturbance. Reveal the important objects. Discuss.
    - Round 2: Same, but the group can revise the formula. World-builder chooses two new important objects (or same, but secretly). System gets a new task (or same type). Perform, reveal, discuss.
    - Round 3: World-builder sets up the room and includes one or two events that will happen at a specific time (e.g., at minute 3, the plant wilts; at minute 4, a colleague opens the window). The world-builder also chooses two important objects. The events are written on a card and only revealed after the round. The group revises the formula (without knowing the events). The system does the task. Then the events are revealed and the disturbance is computed (including changes caused by events). Then reveal the important objects.

  - **Time Horizon:** We set a fixed time horizon for the entire activity (say 5 minutes). The events in round 3 occur at a specific time within that horizon.

  **Timeline for 75 minutes:**

  1. **Introduction (10 minutes):**
