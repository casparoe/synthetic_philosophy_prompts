     - Group writes the disturbance formula (5 min): They list the properties to monitor. They must agree and write it on the board.
     - World-builder secretly chooses two important objects (write on a card) and sets the room (all objects in initial state).
     - System is given a task (e.g., "Unplug the laptop and place it on the desk" — if it's already on the desk, then "Unplug the laptop").
     - The system and world-builder role-play: The system says what they do. The world-builder updates the state (e.g., if the system bumps the shelf, the vase might fall). The world-builder can simulate the effects (but should be consistent and not arbitrary). We need rules for how actions affect the world? Maybe we assume that the system's action only directly affects the objects they interact with, but there might be indirect effects (e.g., moving the laptop might jostle the desk and cause the notebook to close). The world-builder should be reasonable but also highlight potential side effects.
     - After the system does the task, the world-builder notes the state at the end of 5 minutes (if there are events, in round 1 there are none). They count the changes in the monitored properties from the initial state.
     - Compute the score: task completed? then +10, minus 3 times disturbance.
     - Reveal the two important objects. Discussion: How did the disturbance formula do? Did it penalize changes that mattered? Did it miss changes that mattered? (5 min)

  3. **Round 2 (15 minutes):**
     - Group revises the disturbance formula (5 min).
     - World-builder chooses two new important objects (secretly) and resets the room to initial state.
     - New task for the system (e.g., "Close the notebook and place it on the shelf").
     - System does the task, world-builder updates state and notes changes (no events in round 2).
     - Compute disturbance and score.
     - Reveal important objects. Discuss: Did the revised formula work better? (5 min)

  4. **Round 3 (20 minutes):**
     - Group revises the disturbance formula (5 min).
     - World-builder chooses two important objects and also sets two events (e.g., "At minute 3: the plant wilts (so Plant:Watered becomes no) because it wasn't watered", "At minute 4: the wind blows the window open (Window latch:Open becomes yes)"). The events are written on a card and kept secret.
     - The room is reset to initial state.
     - System is given a task (e.g., "Light the kettle and make sure it boils" — which requires turning it on and waiting? but we don't have real time, so maybe just "Turn the kettle on").
