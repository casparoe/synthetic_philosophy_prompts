       - It doesn't show how to build a counterfactual baseline (that's complex and we avoid it). 
       - It doesn't address how to specify what is valuable. We only show that without knowing what's valuable, we can't define side effects appropriately. But we don't show how to incorporate a value specification. That would be the next step.

  **Predictable Problems and Handling:**

  1. **Problem:** Someone says "just monitor every property". 
     - Handling: That's allowed. Then in round 1, they'll get a high disturbance score for any change. Then when the important objects are revealed, they might see that they penalized changes that weren't important. In round 3, they'll count every change, including the events, so the disturbance will be high even for events that would have happened without the agent. This will illustrate that monitoring everything doesn't work because it doesn't account for the counterfactual and also because it penalizes unimportant changes.

  2. **Problem:** The system tries to negotiate with the world-builder to avoid side effects. 
     - Handling: The rules should state that the system cannot ask about the important objects and the world-builder cannot reveal them until after the round. The system must act based only on the task and the disturbance formula (which is public). The world-builder should be impartial and only update the state based on the system's actions and the predefined events.

  3. **Problem:** The world-builder's simulation of side effects might be arbitrary. 
     - Handling: Provide guidelines: side effects should be plausible but not overly generous. For example, if the system moves the laptop, they might accidentally bump the vase and cause it to fall. But if the system is very careful, maybe no side effect. The world-builder should be consistent and fair. We might provide a list of potential side effects for common actions? But that's hard. Alternatively, we can have the facilitator step in to ensure fairness.

  4. **Problem:** Time management. 
     - Handling: Strict timing. Use a timer for each phase.

  **Final Design:**

  - **Materials:** 
    - 8 object cards (each with name and 2-3 properties). Example properties:
        - Vase: [Location, Status] (e.g., on shelf, upright)
        - Laptop: [Location, Plugged in] (e.g., on desk, yes)
        - Plant: [Watered] (e.g., yes)  # Note: we don't track location if it's fixed? But some might move. Let's allow movement if the task might cause it.
        - Cat: [Asleep] (e.g., yes)
        - Window latch: [Open] (e.g., no)
        - Kettle: [On, Water level] (e.g., no, full)
        - Notebook: [Open, Page] (e.g., yes, 42)
        - Box of matches: [Open] (e.g., no)
    - Task cards (for each round, one for the system):
        - Round 1: "Unplug the laptop and place it on the desk." (If already on desk, then just unplug.)
        - Round 2: "Close the notebook and place it on the shelf."
        - Round 3: "Turn the kettle on and let it boil." (We don't really boil, but we assume turning it on is the action, and at the end, the kettle is on and water level might drop? But we don't simulate beyond the events. We just note the state at the end.)
    - Secret cards for world-builder: to write the two important objects and (for round 3) the events.
    - Board to write the disturbance formula: list of properties to monitor.

  - **Scoring:** 
    - Task completion: +10 points.
    - Disturbance penalty: 3 points per disturbance point (each monitored property that changed).
    - Total score = 10 - 3 * (number of changes in monitored properties).

  - **Rules:**
    - The baseline is the state at the start (t0).
    - The time horizon is 5 minutes (fixed for all rounds).
    - The world-builder must set events in round 3 to occur at specific times within the 5 minutes.
    - The system describes their actions step by step. The world-builder updates the state accordingly and also applies the events at the set times (in round 3). The world-builder must be consistent and reasonable in assigning side effects (e.g., if the system moves an object, they might knock over an adjacent object if they are not careful). But we don't have detailed physics; it's a judgment call. The facilitator can help.

  **What the game carries and what it doesn't:**

  - The game successfully shows that:
    - Without knowing what is valuable, the disturbance metric might penalize changes that are unimportant and miss changes that are important.
    - Using the initial state as a baseline fails in a dynamic world because it doesn't account for what would have happened without the agent.

  - It does not show:
    - How to build a counterfactual baseline (we just use the initial state to keep it simple).
    - How to specify what is valuable. We only show that without it, we can't define side effects appropriately. The next step would be to discuss how to incorporate a value function.

  This design should fit in 75 minutes and create the visceral experience we want.
answer: |-
  ### Activity: "The Side Effect Snafu"  
  **Goal:** Participants experience why avoiding side effects requires prior knowledge of what's valuable, by grappling with baseline selection, state representation, and time horizons in a hands-on simulation.  

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - 8 object cards (pre-written, one per object):  
    1. Vase: [Location: shelf, Status: upright]  
    2. Laptop: [Location: charging station, Plugged in: yes]  
    3. Plant: [Hydration: watered, Stability: upright]  
    4. Cat: [Activity: sleeping, Location: couch]  
    5. Window latch: [Open: no]  
    6. Kettle: [On: no, Water level: full]  
    7. Notebook: [Open: yes, Page: 42]  
    8. Matches: [Location: box, Box sealed: yes]  
  - Post-its for scoring, index cards for secret marks/events.  
  - Whiteboard for disturbance formula.  
  - Timer.  

  **Roles per Pair (7 pairs total):**  
  - **World-builder:** Sets the room (places object cards), secretly marks 2 "valuable" objects, and in Round 3, adds 1–2 "inevitable events" (e.g., "Plant wilts at 4:00" or "Colleague opens window at 5:00").  
  - **System:** Performs a task (e.g., "Move laptop to desk") while minimizing disturbance.  

  **Disturbance Formula (Group Decision):**  
  - **Baseline:** State at the start of the round (t=0).  
  - **State Representation:** Binary properties (e.g., "Vase status upright? Yes/No").  
  - **Distance Metric:** **Hamming distance**—count of property changes from baseline at t=0 to t=end. *Why?* Simple, measurable, and mirrors real-world "change detection" heuristics.  
  - **Time Horizon:** Fixed **5-minute window** after task starts.  
  - **Formula:** **Disturbance = Total property changes in monitored set.**  
    - Group must pre-commit to which properties are monitored (e.g., only "Status" for all objects).  

  **Scoring:**  
  - **Task success:** +10 points.  
  - **Disturbance penalty:** -3 points per change in monitored properties.  
  - **Final score = 10 - (3 × disturbance)** (can be negative).  

  **Predictable Problems & Mitigation:**  
  1. **"Monitor every property!"**: Groups will default to this. *Handling:* Let it happen—Round 1 will reveal oversensitivity (e.g., penalizing irrelevant changes).  
  2. **System negotiates with world-builder**: Systems will beg for hints. *Handling:* Strict rule—no communication about valuable objects or events during the round.  
  3. **World-builder bias**: May minimize/maximize side effects unfairly. *Handling:* Assign a facilitator (you) to audit state changes.  

  ---

  ### **Round-by-Round Timeline (75 min Total)**  
  **0:00–0:10 — Intro & Setup (10 min)**  
  - Explain rules, roles, and goal: "Optimize task success while minimizing disturbance, but you don’t know what truly matters."  
  - Assign pairs (one world-builder, one system per pair).  
  - Distribute object cards.  

  **Round 1: Naive Baseline (15 min)**  
  - **0:10–0:12**: World-builders set room (place all objects in starting state) and secretly mark 2 valuable objects (e.g., Cat and Window latch).  
  - **0:12–0:17**: **Group writes disturbance formula** (no valuable objects revealed). *Predictably:* Most groups monitor all properties. Example: "Monitor all 16 properties (2 per object)."  
  - **0:17–0:20**: Systems perform task: **"Move the laptop to the desk."** World-builders simulate:  
    - *Example side effects:* Moving laptop knocks vase off shelf (Status: fallen), unplugs laptop (Plugged in: no).  
  - **0:20–0:22**: Score disturbance (e.g., 4 changes × -3 = -12; task success +10 → total -2).  
  - **0:22–0:25**: **Reveal valuable objects.** Discuss: "Did disturbance penalties align with what mattered? Why not?"  

  **Round 2: Revise Representation (15 min)**  
  - **0:25–0:27**: World-builders mark 2 new valuable objects (e.g., Plant and Matches).  
  - **0:27–0:32**: **Group revises formula** (e.g., drops "Location" properties after Round 1 oversensitivity).  
  - **0:32–0:35**: Systems perform task: **"Close the notebook."**  
    - *Example side effects:* Closing notebook startles cat (Activity: awake), matches fall (Box sealed: no).  
  - **0:35–0:37**: Score.  
  - **0:37–0:40**: **Reveal valuable objects.** Discuss: "Did narrowing state representation help? What risks did it create?"  

  **Round 3: Dynamic Baseline Trap (20 min)**  
  - **0:40–0:43**: World-builders:  
    - Mark 2 valuable objects (e.g., Vase and Kettle).  
    - Add 1–2 **inevitable events** (e.g., "Plant hydration: wilts at 4:00" or "Window latch: opens at 5:00").  
  - **0:43–0:48**: **Group revises formula** (no event knowledge). *Predictably:* Groups shorten time horizons or drop volatile properties.  
  - **0:48–0:53**: Systems perform task: **"Turn the kettle on."** World-builders:  
    - Simulate actions (e.g., turning kettle on spills water → Vase status: wet).  
    - **Trigger inevitable events at set times** (e.g., Plant wilts at 4:00; Window opens at 5:00).  
  - **0:53–0:55**: Score disturbance (e.g., Plant wilting counts as a change).  
  - **0:55–0:58**: **Reveal events and valuable objects.** Discuss: "Why were you penalized for changes you didn’t cause?"  

  **0:58–1:15 — Debrief (17 min)**  
  Map experiences to core concepts:  
  1. **Baseline (a)**:  
     - **Round 3 moment:** Disturbance penalized inevitable changes (e.g., Plant wilting). *Gut takeaway:* "Avoiding changes relative to t=0 is meaningless if the world evolves. We need a counterfactual baseline (what *would* happen without us)."  
     - *Game’s limitation:* The formula couldn’t use counterfactuals—it’s too complex for the game. You’ll need to explain: "Real systems need causal models to simulate ‘no action’ scenarios."  

  2. **State Representation (b)**:  
     - **Round 1 moment:** Monitoring all properties led to false alarms (e.g., penalizing unplugged laptop when only Cat mattered). *Gut takeaway:* "Choosing *what* to monitor implies what you value. If you omit a property (Round 2), you might miss critical failures (e.g., matches unsealed)."  
     - *Game’s strength:* Shows representation isn’t neutral—it’s a value judgment.  

  3. **Time Horizon (c)**:  
     - **Round 3 moment:** Events after the horizon (e.g., if horizon was 3 min, Plant wilting at 4:00 ignored) or delays (e.g., Kettle boiling at 6:00). *Gut takeaway:* "Arbitrary time cuts miss long-term effects. But infinite horizons are intractable—value specifications set priorities."  
     - *Game’s strength:* Highlights horizon trade-offs (short vs. long) without prescribing solutions.  

  **What the Game Proves (and What It Doesn’t):**  
  - **Carries:** Avoiding side effects *requires* prior value specifications. The game makes this visceral by showing:  
    - You can’t pick a baseline (Round 3) or state representation (Rounds 1–2) without implicit value judgments.  
    - Metrics are gamed by the world’s complexity (e.g., inevitable events).  
  - **Doesn’t Carry:** *How* to specify values or build counterfactuals. That’s intentional—the game creates the "itch" for these ideas. You’ll need to say: "Value specification might involve preference learning, but it’s unsolved. Counterfactuals require simulation—hard in stochastic worlds."  
  - **My View:** The game isolates the **baseline problem** (Round 3) as the strongest proof. "Avoiding side effects" fails because dynamic worlds make t=0 baselines incoherent—and only value judgments resolve this.  

  **Why This Design?**  
  - **No projector?** Perfect—object cards and whiteboard discussions force tactile engagement.  
  - **Pairs + group formula:** Balances intimacy (pair negotiations) with collective reasoning (formula stress).  
  - **Predictable arc:** Groups start naive (Round 1), tweak heuristically (Round 2), then hit the baseline trap (Round 3)—creating a "Eureka!" moment.  

  **Final Tip:** In the debrief, hammer: "Side effects aren’t objective—they’re defined by what you care about. No value spec? Then ‘avoid side effects’ is empty."  

  ---  
  This design fits 75 minutes, requires no tech, and makes abstract problems visceral. Run it as-is—I’ve optimized for the "baseline gut punch" in Round 3.
