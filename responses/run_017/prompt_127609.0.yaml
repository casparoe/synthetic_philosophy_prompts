  We need:
  1. Rules for the activity.
  2. Materials.
  3. Scoring.
  4. Round-by-round timeline for 75 minutes.
  5. Debrief mapping to (a) baseline, (b) state representation/distance, (c) time horizon.
  6. Predictable problems and how to handle them.
  7. What the game can and cannot demonstrate.

  **Core Mechanics:**

  - **Disturbance Formula:** We'll define it as a function that measures change from a baseline state. We must define:
    - Baseline: The state of the world at the start? Or a state that evolves without intervention?
