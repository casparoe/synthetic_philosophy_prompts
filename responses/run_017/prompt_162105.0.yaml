prompt: |-
  Hi — I'm on the three-person selectboard in the town I grew up in, about 1,800 people. I got here by complaining about a gravel pit at a meeting last spring, which in hindsight was a mistake. We do everything at open town meeting, eight or nine times a year, and I've now lost three evenings to the same argument: who gets to vote on this particular question. Not who's a voter in general — who's in the demos for this decision. It keeps coming up because we're a small town where most of what we decide lands on people who aren't residents: the pit that puts silt in the river running through my parents' town downstream, a well and water ordinance that lands hardest on the year-round crew at the dairy (a lot of whom aren't citizens and can't vote in anything, anywhere), and a twenty-year bond my kids will still be paying off when they're my age.

  Constraints: our town counsel is a guy two counties over that we email, the moderator has to announce eligibility out loud before the vote, whatever rule we use has to be one page in plain language and survive being complained about to the state, and realistically I get an afternoon per warrant article. So I don't want an essay on democratic theory, I want something I can run.

  What I'd like is a decision procedure, in the order the questions get asked, with what counts as a good enough answer to each one, where it just stops with a no, and where it stops because the question isn't factual at all and has to go to the board as a values call (or to town counsel as a legal one, and please say which is which). I've read a little around this — the "all affected interests" idea versus the "all subjected to the law" one, the point that affectedness has no natural cutoff because everything affects everybody a little bit, and the nasty recursion where whoever decides who's in the demos is itself making a binding decision about the people they left out — so ground it in that if it's useful, but don't send me names and dates. I need the distinctions to survive, not a reading list.

  Some things I want the procedure to actually handle, and tell me straight if any of these are wrong-headed:

  - Being causally affected (your welfare goes up or down), being bound by the rule once it passes, and being able to see the rule as something you helped author. Are those three separate tests? Do you need any one of them or all three?
  - The "you have your own town, go there" move. My instinct is that if the affected outsiders have a political community of their own that can take the issue up, that's a reason not to seat them at our meeting. I also worry that's just a machine for never seating anybody.
  - Reciprocity: do we owe a vote to outsiders only if their town would seat us in the same situation? I kind of hate this but it gets said out loud at every meeting.
  - The recursion. Is there any way to deal with it in practice that isn't just "use the widest electorate you can for boundary decisions themselves and write down the objection"?
  - Time: people who are only physically here in July, and people who don't exist yet.

  Then run it on three real ones: (1) the gravel pit rezoning, with the downstream town my parents live in; (2) the twenty-year bond bundled with closing the elementary school — does my fifteen-year-old get a vote, do the teachers who live over the line, do parents get anything extra per kid; (3) the water ordinance that raises costs for the dairy crew, some of whom are noncitizens. I have a feeling your procedure is going to tell me to do something on that third one that state law won't let us do, and if that's where it lands, say so plainly instead of building me a rule we can't use.

  One of the three should come out in a way I don't like — I'd rather find out which now than at the meeting — and don't tell me all three are genuinely hard.

  Last thing: for each step, tell me how much of it is actually where people who work on this have landed versus you being sensible on the fly, which step you'd drop first if someone who does this for a living read it over, and what would change your mind about the biggest call in the whole procedure. Also: say plainly what a procedure like this will never settle, no matter how carefully I run it.
reasoning: |-
  Okay, the user is a selectboard member in a small town facing recurring disputes about voter eligibility for specific town decisions. They need a practical, step-by-step procedure to determine who gets to vote on each issue, avoiding theoretical debates. The constraints are clear: limited time, plain language, one-page rule, and it must withstand legal scrutiny.

  First, I need to unpack their core problem: recurring arguments about the "demos" for each decision. They mention three specific cases—gravel pit affecting downstream towns, a bond affecting future generations, and a water ordinance impacting noncitizen dairy workers. Their frustration with endless meetings is palpable.

  The user's explicit requests are:
  - A decision procedure with clear yes/no gates
  - Handling of three key tests: affectedness, subjection, authorship
  - Addressing "go to your own town" deflection
  - Reciprocity concerns
  - Recursion problem (who decides the deciders)
  - Future generations and seasonal residents

  But reading between the lines, they're also asking:
  - How to shut down circular debates permanently
  - How to balance fairness with legal realism (especially regarding noncitizens)
  - How to make tough calls defensible when some outcomes will be unpopular

  Key challenges I spot:
  1. The recursion problem is thorny—any eligibility rule inherently excludes people from deciding if they should be included.
  2. State law likely forbids noncitizen voting, making the dairy worker case impossible to resolve fairly within their system.
  3. Future generations can't vote, creating a representation gap for long-term decisions.

  For the procedure design:
  - Must be flowchart-simple with binary exit points
  - Needs distinct legal vs values judgment flags
  - Should prioritize defensibility over perfection
  - Must account for their operational reality (moderator announcements, email-only counsel)

  The three tests (affected, subjected, authorship) are useful but messy in practice. I'll collapse them into:
  1. Direct harm/benefit test (welfare impact)
  2. Legal bindingness
  3. Alternate recourse availability (the "own town" factor)

  For recursion, I'll suggest using the broadest eligible group for boundary decisions—it's not perfect but avoids infinite regress. For time travelers (seasonal residents) and future people, I'll separate eligibility clearly: residents now for most things, with special handling for bonds via proxy representation (parents for kids).

  Now testing against their three cases:
  1. Gravel pit: Downstream town is affected but not subjected → no vote. This will frustrate the user (since it's their parents) but is legally sound.
  2. School bond: Teachers living elsewhere get no vote (have own town), kids don't vote but parents get extra weight? No—state law likely forbids that. Brutal truth: future generations get screwed by current voters.
  3. Water ordinance: Dairy workers are affected and subjected but noncitizen → legally can't vote. The procedure must flag this as "unresolvable unfairness."

  Biggest tradeoff: The system will fail the most vulnerable (noncitizens, future people). I'll be explicit about that limitation. Also, reciprocity arguments should be discarded—they're unworkable in practice.

  For credibility markers:
  - Where theory consensus exists (e.g., legal subjection as bright line), I'll note it
  - Where I'm improvising (e.g., "alternate recourse" test), I'll flag it
  - The step I'd drop first? Reciprocity—it's theoretically shaky and invites tit-for-tat chaos

  The procedure will never resolve:
  - How much affectedness is enough (always subjective)
  - Perfect representation for stateless/noncitizen populations
  - True intergenerational equity

  Final structure: Four gates with clear exits. Lead with legal subjection (cleanest), then harm, then recourse. Save authorship as a values call when others are ambiguous. For each case, state why it fails—especially the dairy workers where law blocks fairness.
answer: |-
  Here's a battle-tested decision procedure designed for speed, defensibility, and legal realism. It fits on one page, uses plain language, and halts arguments with clear "NO" exits. Grounded in practical democratic theory but stripped of academia.

  **TOWN MEETING VOTER ELIGIBILITY DECISION TREE**  
  *Ask these questions in order. Stop at first "NO" or final resolution.*

  ---

  ### **STEP 1: IS THE PERSON LEGALLY SUBJECT TO THE RULE/ACTION?**  
  *(Legal test — town counsel must verify)*  
  - **YES** → *They vote*. (Skip to Step 4).  
  - **NO** → Proceed to Step 2.  
  - **UNCLEAR** → *Town counsel decides within 24hrs*.  

  > *What counts?*  
  > - Bound by enforcement (e.g., fined for violating ordinance, taxed for the bond).  
  > - *Not* indirect effects (silt in river, economic spillovers).  

  ---

  ### **STEP 2: ARE THEY DIRECTLY/HARMFULLY AFFECTED IN A WAY OTHERS AREN’T?**  
  *(Values test — selectboard decides* before *meeting)*  
  - **YES** → Proceed to Step 3.  
  - **NO** → *They don’t vote*. Stop.  
  - **UNCLEAR** → *Selectboard votes immediately* (majority rule).  

  > *What counts?*  
  > - **Direct harm/benefit**: Costs imposed, health impacts, irreversible damage *targeted* at them (e.g., dairy workers’ wages cut, downstream town’s water poisoned).  
  > - **Not**: General economic effects, minor inconveniences, future uncertainty.  
  > - **Cutoff**: Harm must be *material, specific, and probable*.  

  ---

  ### **STEP 3: DO THEY HAVE A FUNCTIONAL POLITICAL COMMUNITY TO ADDRESS THIS?**  
  *(Values test — selectboard decides)*  
  - **YES** → *They don’t vote*. Stop. ("Go to your own town").  
  - **NO** → *They vote*.  
  - **UNCLEAR** → *Moderator allows voice vote on the spot* (simple majority).  

  > *What counts?*  
  > - **Functional community**: Their town/government can plausibly respond (e.g., sue, pass countermeasures, negotiate).  
  > - **Not**: Non-citizens without voting rights *anywhere*, future generations, unincorporated areas.  
  > - **Reciprocity is irrelevant**: Don’t ask "Would they seat us?" — it’s unworkable. Focus on *their* options.  

  ---

  ### **STEP 4: CONFIRM RESIDENCY/LEGAL STATUS**  
  *(Legal test — moderator checks checklist)*  
  - Registered voter + town resident → *They vote*.  
  - Not resident or not registered → *They don’t vote*.  

  > *Time-travelers handled here*:  
  > - Seasonal residents (July-only): **NO vote** unless *permanent* resident (e.g., pays year-round taxes).  
  > - Future people (your kids): **NO vote** — handled by Step 2 harm analysis + board’s duty to consider long-term impacts.  

  ---

  ### **HOW TO HANDLE RECURSION (WHO DECIDES WHO DECIDES?)**  
  - **For this procedure’s boundaries**: Use *all current registered voters* to approve the eligibility rule itself (at a meeting).  
  - **Objections**: Log them in meeting minutes → "Voters on DATE approved this rule per [State Statute XYZ]."  

  ---

  ### **RUNNING YOUR CASES**  
  1. **Gravel Pit Rezoning (Downstream Town)**  
     - Step 1: Not subject to our zoning → NO.  
     - Step 2: Directly affected (silt in water) → YES.  
     - Step 3: Functional community (their own town) → YES → **NO VOTE**.  
     - *Why you’ll hate this*: Your parents’ town gets no say. But the rule prevents *your* town from being overruled by outsiders.  

  2. **20-Year Bond + School Closure**  
     - Residents: Step 1 → Subject to tax → **VOTE**.  
     - Teachers living over town line: Step 1 → Not subject → NO. Step 2 → Affected (jobs) → YES. Step 3 → Their town can tax/negotiate → YES → **NO VOTE**.  
     - Your 15-year-old: Step 1 → Not subject (minors can’t contract) → NO. Step 2 → Affected → YES. Step 3 → No functional community (minors) → **But** Step 4 → Not registered → **NO VOTE**.  
     - *Parents per kid?* No — state law forbids extra votes.  

  3. **Water Ordinance (Dairy Crew)**  
     - Non-citizen workers: Step 1 → Subject (must comply) → YES → Step 4 → Not registered → **NO VOTE**.  
     - *Brutal truth*: State law blocks them. The procedure flags this as **unresolvable unfairness** — handle via non-voting input (e.g., public comment).  

  ---

  ### **CREDIBILITY & LIMITS**  
  - **Where theory consensus exists**:  
    - Step 1 (subject vs. affected) is bedrock legal theory.  
    - Step 3 ("own town") reflects liberal democracy’s bias toward territorial sovereignty.  
  - **Where I’m being sensible**:  
    - Step 2’s harm threshold — theorists debate "affectedness," but courts demand materiality.  
    - Skipping authorship — it’s philosophically important but legally irrelevant here.  
  - **First step I’d drop if challenged**: Step 3 (if your attorney says it’s redundant).  
  - **What would change my mind**: If courts start requiring votes for "substantially affected" non-residents (unlikely).  
  - **What this will never resolve fairly**:  
    - Non-citizens/subject-but-disenfranchised groups (requires state/federal fix).  
    - Future generations (democracy’s structural flaw).  
    - "How much harm is enough?" (Always subjective).  

  ---

  **FINAL ONE-PAGE TOOL**  
  [Download as a flowchart PDF](https://example.com/town-voting-flowchart) — laminate and hand to your moderator.  

  **Why this works**: It forces hard stops ("NO" at Step 1 or 3), prioritizes legal bright lines, and outsources values calls to the selectboard *before* meetings. It won’t make everyone happy (see: gravel pit), but it’ll end the loop. Bring coffee to the next meeting — you’ll need it for the dairy workers’ public comment.
