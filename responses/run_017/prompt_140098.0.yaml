answer: |-
  Your gut verdicts reveal a sophisticated, unspoken principle rooted in **epistemic justice and power dynamics**. You're prioritizing not just *what* is remembered or recorded, but **whose knowledge system is being validated or invalidated**, and **whether the archive itself is a tool of oppression**. 

  Here's the core principle distilled:

  ### **The Sovereignty Principle**
  **Trust community memory when:**
  1. **The archive is a product of systemic erasure or coercion** (e.g., colonial, dictatorial, or oppressive power structures), *or*  
  2. **The memory serves a counter-archival function** (resisting the archive’s authority to define reality).  
  **Trust the archival record when:**  
  1. **It contradicts self-mythologizing claims by dominant groups**, *and*  
  2. **Its creation wasn’t coerced or weaponized to silence subaltern voices**.  

  ---

  ### **How the Sovereignty Principle Explains Your Verdicts**
  | **Case** | **Verdict** | **Principle Applied** |
  |----------|-------------|------------------------|
  | 1 (Ojibwe plaque) | Trust archive | Archive exposes **dominant group’s self-mythologizing** (settler legitimacy). No coercion in record-creation; silence serves power. |
  | 2 (Paid rescuer) | Trust memory | Memory’s core truth (rescue) stands. Payment detail is **peripheral to the counter-archival act** (resisting Nazi erasure). |
  | 3 (Massacre waterhole) | Trust memory | Archive’s silence is **active colonial erasure**. Memory is **sovereign testimony** against a genocidal system. |
  | 4 (Novelist’s visit) | Trust archive | Absence is **neutral administrative gap**, not oppression. Memory is **folkloric confabulation** without counter-archival weight. |
  | 5 (Massacre numbers) | Partial trust | Archive corrects **quantifiable facts**, but memory’s **traumatic core** (violence) remains counter-archival truth. |
  | 6 (Informer teacher) | Distrust archive | Archive is **product of coercive power** (secret police). Memory **refuses the jurisdiction** of tainted evidence. |

  ---

  ### **Where the Sovereignty Principle Clashes With Your Gut**
  - **Case 4 (Novelist’s visit)**: Your "confabulation" verdict holds, but the principle demands harsher scrutiny. If the village is marginalized (e.g., rural poor), their cultural pride might warrant more weight. But absent oppression, archival neutrality prevails.  
  - **Case 6 (Informer teacher)**: The principle *fully supports* your distrust of the file. Secret police archives are intrinsically coercive; rejecting their authority aligns with epistemic justice.  

  ---

  ### **Unresolved Cases: Principle’s Verdicts**
  1. **Memory hardened into monument/museum (no living memory)**:  
     - **If the memory originated from a marginalized group**: It retains **counter-archival sovereignty**. The monument is an *act of reclamation* (e.g., a lynching memorial).  
     - **If the memory serves dominant power**: It’s a **false assertion with architecture** (e.g., a "Founders' Myth" statue).  
     *The principle prioritizes the memory’s origins, not its age or form.*  

  2. **Memory manufactured by archival error (1970 misreading)**:  
     - **Reject it**. This is **propositional folklore without lived experience**. Unlike true counter-archival memory (e.g., Case 3), it lacks roots in resistance to oppression.  

  ---

  ### **Why Your Half-Formed Rules Failed**
  - **"Trust record against interests of creator"**: Fails Case 6 (secret police files *harm* their creators post-dictatorship, yet you distrust them).  
  - **"Trust memory when silence serves power"**: Too broad; Case 4’s silence doesn’t serve power.  
  - **"Embodied vs. propositional memory"**: Less crucial than whether memory *challenges power*. The Ojibwe plaque (embodied) falls; Lyon rescue (propositional) stands.  

  ### **The Deeper Insight**
  Your instinct treats archives not as neutral truth, but as **artifacts of power**. When archives are weapons (colonial logs, secret police files), you side with communal resistance. When they’re bureaucratic records (hotel registers), you demand accuracy. Memory isn’t "fact" but **testimony**—validated when it defies oppressive systems. This isn’t relativism; it’s recognizing that some truths exist *outside* the master’s ledger.  

  Would you adjust Case 4 or defend Case 6 further? I can refine the principle with your counterarguments.
