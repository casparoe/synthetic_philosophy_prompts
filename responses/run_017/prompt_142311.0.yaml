  We are constructing a case with a partition of three hypotheses: H1, H2, H3. H3 is rare but high-stakes. The evidence is ambiguous and leads to a set C of chance distributions that is the convex hull of two distributions. The agent must adopt a precise credence in H3 (since the decision threshold is on H3) and the rule for ambiguity is minimax: minimize the worst-case expected inaccuracy over C.

  We require that the logarithmic rule (Log) recommends a higher credence in H3 than the quadratic (Brier) rule, and that the difference is enough to cross a threshold that triggers an action. Specifically, we set a threshold T for H3. We want:
     b(H3) <= T - 0.015   (at least 1.5 percentage points below)
     l(H3) >= T + 0.015   (at least 1.5 percentage points above)

  Additionally, we require l(H3) >= 1.5 * b(H3).

  We design the scenario so that the set C is the convex hull of two chance distributions, say Q1 and Q2. We let:
     Q1 = (q1, q2, q3) and Q2 = (r1, r2, r3) with q3 and r3 being the probabilities for H3.

  We need to choose Q1 and Q2 such that the minimax credence for Log is higher in H3 than for Brier.

  Recall the scoring rules (for a single event, but we extend to a partition by summing):

  Brier (quadratic) score for a partition of n events: 
     For a credence vector c = (c1, c2, c3) and if the true state is i, the score is:
          S(c, i) = (1 - c_i)^2 + sum_{j≠i} (0 - c_j)^2 = 1 - 2*c_i + sum_j c_j^2
     But note that for a partition, the expected score under Q is:
          E[S(c)] = sum_i Q_i * [1 - 2*c_i + sum_j c_j^2]
                  = 1 - 2 * sum_i Q_i c_i + sum_j c_j^2 * (since the sum over i of Q_i is 1)
                  = 1 - 2 * (dot product Q·c) + (||c||^2)

  Logarithmic score (for a partition) is the negative of the log of the assigned probability to the true event. So:
     If the true state is i, the score is: -log(c_i)
     Expected under Q: E[S(c)] = - sum_i Q_i * log(c_i)

  We are interested in the expected inaccuracy (so we want to minimize expected inaccuracy, which is the same as maximizing expected accuracy). Therefore, we minimize E[S(c)] for the Brier and Log.

  In the minimax approach, for a given scoring rule and for a fixed c, we compute:
     max_{Q in C} E[S(c)|Q]

  and then we choose c to minimize that max.

  We are going to represent C as the convex hull of two points: Q1 and Q2. So every Q in C is of the form:
     Q = λ * Q1 + (1-λ) * Q2, for λ in [0,1].

  We can then write the expected inaccuracy for a given c and λ. We then, for a fixed c, find the λ that maximizes the expected inaccuracy (which is a function of λ). Then we choose c to minimize that maximum.

  Our goal is to choose Q1 and Q2 such that when we solve for c under Brier and under Log, we get different values for c3 (the credence in H3) and the difference is substantial and crosses a threshold.

  We note that the logarithmic scoring rule is more sensitive to small probabilities because of the log term: as c3 approaches 0, the penalty (if H3 is true) becomes infinite. Therefore, we expect that the minimax solution for Log will avoid setting c3 too low. The Brier score is bounded (by 1 in fact for a single event, but for a partition the maximum score per event is 1 and we have three events, so the maximum is 3). Therefore, the minimax solution for Brier might be more willing to set a low c3.

