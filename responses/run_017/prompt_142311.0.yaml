   Example: In a machine failure prediction, there are three possible causes: H1: software glitch (usually harmless), H2: hardware wear (requires maintenance), H3: critical failure (requires immediate shutdown and costly repair).

   The evidence from the sensors is ambiguous. One expert (Q1) believes it is likely (60%) a software glitch and very unlikely (10%) a critical failure. Another expert (Q2) believes it is likely (60%) hardware wear and also believes there is a 30% chance of critical failure. The set C is the convex hull of the two distributions: (0.6,0.3,0.1) and (0.1,0.6,0.3).

