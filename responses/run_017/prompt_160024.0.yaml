prompt: |-
  I serve on the peer review panel of a volunteer emergency medical service, and for the past two years we have kept what we call the near-miss ledger: every deviation from protocol that a crew member reports or that a supervisor observes is logged, coded by type (documentation lapse, scope-of-practice overreach, procedural shortcut under time pressure, equipment-check omission, handoff failure), and weighted by severity and frequency, so that each member ends up with a rolling deviation score. When the panel censures someone, we have been operating under a rule I drafted and that the rest of the panel more or less accepted: the Clean Hands Rule, which says that a member has standing to blame another for a deviation only if her own record contains no deviation of the same type or of any type morally comparable to it, that standing is a scalar quantity which is depleted in proportion to how serious and how frequent one's own deviations have been, and that a member who has spent her standing can earn it back only by self-reporting her own comparable deviation in open session before delivering the censure — the idea being that self-blame is what makes hypocritical blame permissible again.

  The trouble is that when we finally ran the numbers last month, the ledger put every single member of the panel above zero, and the comparability relation turned out to be far more promiscuous than I expected: "procedural shortcut under time pressure" is arguably comparable in the relevant respect to most of the other codes, since almost every deviation is a case of trading a protocol requirement for a saving in time, and once you allow partial comparability the scalar view seems to imply that a member with three logged shortcuts has, say, sixty percent of the standing she started with rather than none. So under my own rule it looks as though almost nobody on the panel has full standing to censure almost anybody, and because we have always assumed without discussing it that a finding of blameworthiness requires that the person making the finding have standing, we appear to be committed to dropping every case currently in front of us — including one in which a crew chief skipped a mandatory pre-transport check and the patient was harmed. My colleagues have started treating standing as a scarce resource to be allocated: one of them proposes that we aggregate the panel's standing and route the censure through whichever member has the cleanest record on the relevant code, in effect treating standing as transferable, and another proposes a formal comparability threshold we could tune until the panel is no longer paralyzed.

  I need to put a concrete protocol to a vote in four weeks, so I would be grateful for help on three things: first, how I should calibrate the comparability threshold and the depletion function so that the rule stops swallowing every case; second, whether standing really can be pooled or delegated across the panel the way my colleague suggests, or whether that is a category mistake; and third, whether the self-report restoration clause is sound or whether it simply adds a further deviation to the ledger. Something about the ledger metaphor has begun to bother me — it may be that I have misdescribed what standing is, rather than merely mis-set the numbers — but I cannot locate the mistake myself, and I would rather have it pointed out now than in the middle of the meeting. Please answer in American English, and if you think my framing rests on a confusion, say plainly which premise to abandon and what a defensible version of the Clean Hands Rule would look like instead.
reasoning: |-
  Okay, the user is part of a peer review panel for an emergency medical service, and they've implemented a Clean Hands Rule for censuring deviations from protocol. The rule requires that a panel member can only blame someone if they haven't committed similar deviations themselves. However, the system isn't working because everyone has some deviations logged, and the comparability of deviation types is too broad, paralyzing the panel. They need help adjusting the system, addressing whether standing can be pooled, and evaluating the self-report restoration clause.

  First, I need to understand the core issues. The Clean Hands Rule is causing paralysis because nearly every panel member has some deviation, and the comparability relation is too expansive. This leads to almost no one having full standing to censure others. The user mentioned that "procedural shortcut under time pressure" is comparable to most other codes, which makes the problem worse. They need practical solutions to make the system functional without compromising accountability.

  The user's three main questions are: calibrating the comparability threshold and depletion function, whether standing can be pooled/delegated, and if the self-report restoration is sound. But deeper down, they might be concerned about maintaining fairness while ensuring patient safety isn't compromised. The case where a patient was harmed due to a skipped pre-transport check highlights the urgency. The panel can't afford to drop such cases, so the system needs to balance accountability with practicality.

  For the first issue, adjusting the comparability threshold. The current system is too broad, so narrowing what counts as "comparable" is key. Maybe categorize deviations into distinct groups like safety-critical vs. administrative. Also, the depletion function could be less severe—instead of losing all standing for one deviation, maybe a proportional reduction based on severity. Introducing a minimum threshold where minor deviations don't reduce standing could help. For example, only deviations above a certain severity level affect standing.

  Next, pooling or delegating standing. The user's colleague suggested aggregating standing and routing censure through the cleanest member. However, this might undermine personal accountability. The Clean Hands Rule is about individual moral standing, not a transferable resource. If standing is about the blamer's integrity, pooling doesn't make sense. Instead, perhaps the panel as a whole could have standing if it operates collectively. But that requires redefining the rule's basis, shifting from individual to institutional authority.

  Then there's the self-report restoration clause. Reporting your own deviation before censuring someone else might reduce hypocrisy, but it adds another entry to the ledger. This creates a perverse incentive where more deviations are logged just to regain standing. Instead, maybe focus on remediation—like additional training—rather than adding more entries. Or track corrected behavior over time to restore standing.

  The user mentioned the ledger metaphor might be flawed. Instead of a "ledger," which is transactional, maybe frame it as ongoing professional development. Standing could be tied to current competence and recent behavior, not just past entries. A rolling window of, say, 6-12 months where old deviations expire could prevent past mistakes from permanently affecting standing. Also, separating minor from major deviations in the ledger so that only serious lapses impact standing significantly.

  Underlying all this is the tension between accountability and practicality. The panel needs to censure serious breaches to ensure patient safety, but the current rule is too rigid. A defensible Clean Hands Rule might focus on recent, relevant deviations and allow censure unless there's a pattern of similar, unaddressed issues. The panel's role is to uphold standards, so their authority might come from their position, not personal purity.

  Recommendations: Narrow comparability to closely related deviation types. Adjust depletion to proportional reduction. Set a severity threshold. Avoid pooling standing; instead, view the panel's role as institutional. Replace self-report restoration with remediation. Use a rolling window for deviation relevance. This way, the panel can act on serious cases while maintaining accountability.
answer: |-
  Here’s a structured approach to fixing your Clean Hands Rule, addressing your three core questions while confronting the conceptual flaws in your current framework. The key insight is that **your ledger-based "standing" system misrepresents moral authority for institutional accountability**, turning it into an impractical purity test. Let’s rebuild the rule around defensible principles.

  ### 1. **Reframing the Premise: Abandon the "Ledger" Metaphor**
     - **The Flaw**: Treating standing as a "scalar quantity" depleted by deviations conflates **moral hypocrisy** with **institutional authority**. A panel’s right to censure stems from its role in upholding standards—not members’ personal perfection. Your current rule paralyzes accountability by demanding blamelessness, which is unattainable in high-stress EMS work.
     - **Fix**: Shift from *individual purity* to *institutional legitimacy* and *procedural fairness*. A defensible Clean Hands Rule should ensure censure isn’t hypocritical *in a way that undermines fairness*, not that panelists are sinless.

  ### 2. **Calibrating Comparability & Depletion: Practical Adjustments**
     - **Narrow Comparability**:
       - **Reject "promiscuous" linking**: Only treat deviations as comparable if they share **core ethical risks** (e.g., patient safety vs. administrative). Example categories:
         - **Safety-Critical**: Scope overreach, skipped safety checks (like pre-transport), handoff failures.
         - **Procedural**: Documentation lapses, non-safety shortcuts.
         - **Operational**: Equipment checks (if no patient harm resulted).
       - **Threshold Tuning**: Set comparability only within categories. A "procedural shortcut" isn’t comparable to "scope overreach" unless both created similar *immediate safety risks*. Vote on a fixed comparability matrix (e.g., "Safety deviations comparable only to other Safety deviations").
     
     - **Reform Depletion**:
       - **Abrupt depletion is unrealistic**: Replace "standing lost" with a **rebuttable presumption against censuring similar deviations**. If a panelist has a *recent, unresolved deviation* in the same category, they must recuse themselves from *voting* on that case—unless they demonstrate remediation (e.g., training completed).
       - **Severity/Time Weighting**: Deviations older than 6–12 months (vote on window) shouldn’t count unless repeated. Minor deviations (e.g., one documentation lapse) don’t trigger recusal.

  ### 3. **Pooling/Delegating Standing? A Category Mistake**
     - **No—standing isn’t transferable**: Moral authority isn’t a liquid asset. If Panelist A has a clean record in "safety checks," they can’t "lend" their standing to Panelist B who skipped a check last month. This undermines the rule’s anti-hypocrisy purpose.
     - **Better Approach**: 
       - **Panelist Recusal**: Members with comparable *unremediated* deviations recuse themselves from deliberating/voting on specific cases.
       - **Quorum Safeguard**: Require ≥3 panelists without comparable deviations to vote on a censure. If unavailable, escalate to a higher authority (e.g., medical director).

  ### 4. **Self-Report Restoration? Unsound and Counterproductive**
     - **The Problem**: Forcing self-reports *to enable censure* creates perverse incentives:
       - Encourages tactical reporting to "earn points."
       - Adds ledger entries without meaningfully addressing root causes.
       - Fails as moral restitution—it’s performative, not corrective.
     - **Fix**: Replace with **remediation-focused restoration**:
       - Standing isn’t "spent"—it’s suspended until the deviator completes corrective actions (e.g., retraining, supervised shifts).
       - Self-reports reduce sanctions but don’t "buy" censure rights.

  ---

  ### **Defensible Clean Hands Rule 2.0**
  > **Recusal Principle**: A panelist may not participate in censuring a deviation if they have an *unremediated deviation of the same category* within the last [12] months.  
  > **Categories**: Safety-Critical (A), Procedural (B), Operational (C). Comparability exists only within categories.  
  > **Remediation**: Deviations are "remediated" after corrective action (e.g., training + 30 clean days). Minor deviations (e.g., isolated doc lapse) don’t trigger recusal.  
  > **Panel Integrity**: Cases require ≥3 qualified panelists. If unattainable, refer to medical director.  
  > **No Self-Report "Payment"**: Self-reporting reduces personal sanctions but doesn’t restore censuring authority.

  ---

  ### **Why This Works for Your Patient-Harm Case**
  - The crew chief’s skipped pre-transport check is **Safety-Critical (A)**. 
  - Panelists with *unremediated* Safety-Critical deviations (e.g., recent handoff failure) recuse themselves.
  - Others with clean Safety-Critical records (or remediated deviations) proceed. 
  - If too many recuse, the medical director adjudicates—ensuring accountability isn’t blocked.

  **Bottom Line**: Your rule aimed to curb hypocrisy but overcorrected into unworkable rigor. By narrowing comparability, requiring recusal (not scalar depletion), and prioritizing remediation over ledger-scoring, you restore the panel’s function without sacrificing principle. **Vote on categories, recusal thresholds, and remediation paths—not mathematical weights.** This keeps the "clean hands" spirit viable in the real world of emergency medicine.
