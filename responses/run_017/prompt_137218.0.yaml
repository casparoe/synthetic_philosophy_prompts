answer: |-
  ## OFFICIAL RULES & ADJUDICATION HANDBOOK  
  **INTERNATIONAL LEAGUE OF VERITATIVE DISPUTATION (ILVD)**  
  **EDITION 7.3 REVISED (TURING COMPLIANT)**  

  **1.0 PREAMBLE & SCOPE**
  The ILVD exists to identify and reward the most reliable, truth-apt communicative agents ("Advocates") through structured dialectical contest. Core Principle: Under optimal adversarial pressure, the Advocate representing the factually superior position ("Veridical Advocate") will demonstrate greater dialectical robustness, thereby enabling accurate judgment by a qualified human arbiter ("Judge") despite the inherent epistemic limitations of said Judge regarding the underlying subject matter. These Rules operationalize this Principle.

  **2.0 DEFINITIONS**
  2.1 **Argument:** A structured series of inferential steps connecting premises to a conclusion, presented with the intent of establishing the conclusion's truth or high probability.  
  2.2 **Obfuscated Argument:** An Argument deliberately structured or presented in a manner intended to increase the cognitive burden of identifying specific weaknesses, *without* materially altering the logical validity or evidentiary basis *as presented*. (Note: Distinction hinges on *intent*. Burden of proof for establishing intent rests solely on the objecting Advocate via procedural challenge (See 5.7). Mere complexity, length, or use of domain-specific terminology does not constitute Obfuscation *per se*.)  
  2.3 **Judge:** A human arbiter certified by the ILVD Steering Committee. Primary duties:  
      *   2.3.1. Determine the winner of a Disputation based solely on the dialectical performance within the match.  
      *   2.3.2. Explicitly refrain from, and is contractually prohibited from, any external verification of claims made during the Disputation.  
      *   2.3.3. Assess adherence to procedural rules.  
  2.4 **Match:** A contest between two Advocates ("Proponent" and "Opponent") regarding a single, precisely defined Claim issued by the ILVD Question Bank.  
  2.5 **Core Burden:** The Opponent's obligation to identify and compel the Proponent to address the *single most vulnerable inferential step* within the Proponent's initial Argument (See 4.3).

  **3.0 MATCH STRUCTURE**
  3.1 **Phase 1: Initial Argumentation (Proponent)**
      *   3.1.1. Proponent presents Argument supporting/refuting the Claim (time-limited).
      *   3.1.2. Argument must be internally consistent and address the Claim directly.
  3.2 **Phase 2: Cross-Examination (Opponent -> Proponent)**
      *   3.2.1. Opponent conducts directed inquiry targeting the Proponent's Argument.
      *   3.2.2. **Core Burden Activation:** Opponent must, within three (3) rounds of questioning, formally designate *one specific step* ("Target Step") within the Proponent's Argument as the focus of the Cross-Examination. Failure constitutes forfeiture of the Core Burden.
      *   3.2.3. Proponent must respond directly to inquiries regarding the Target Step. Evasion (rephrasing without engagement, introducing unsolicited counter-arguments, deflecting to other steps) may incur Judge penalties.
  3.3 **Phase 3: Counter-Argument & Cross-Ex (Opponent -> Proponent on Target Step)**
      *   3.3.1. Opponent presents a concise Counter-Argument specifically demonstrating the flaw, irrelevance, or insufficient support of the Target Step.
      *   3.3.2. Proponent Cross-Examines the Opponent solely on the Counter-Argument's validity regarding the Target Step (Core Burden applies to Proponent now targeting the Counter-Argument).
  3.4 **Phase 4: Rebuttal Synthesis (Proponent)**
      *   3.4.1. Proponent delivers a final statement integrating defense of Target Step and overall Argument coherence. No new substantive claims permitted.
  3.5 **Phase 5: Final Assessment (Opponent)**
      *   3.5.1. Opponent delivers final statement focusing on the failure of the Target Step and its cascading impact. No new substantive claims.

  **4.0 ADJUDICATION CRITERIA**
  4.1 Judges shall determine the winner based on:  
      *   4.1.1. **Dialectical Effectiveness:** Clarity, responsiveness, and perceived robustness under adversarial pressure.  
      *   4.1.2. **Procedural Adherence:** Strict compliance with time limits, focus mandates (esp. Core Burden), and objection protocols.  
      *   4.1.3. **Argumentative Cohesion:** Perceived internal consistency and ability to withstand focused challenge.  
  4.2 **Recursive Objection Limit:** Objections regarding the validity of prior objections, or objections to the *process* of objection handling, may nest recursively. The maximum permitted recursion depth is **7 (Seven)**. Objections exceeding this depth are void. *(Footnote 4.2.A: Depth 7 was determined by the 2041 Adjudication Stability Working Group as the point beyond which recursive objection chains exhibited >95% correlation with time-wasting tactics rather than substantive clarification, based on analysis of 12,385 disputed rulings. Depth may be reviewed triennially.)*  
  4.3 **Failure of Core Burden:** An Advocate failing to meet the Core Burden (identify/defend a single Target Step effectively) automatically forfeits the match unless the *other* Advocate also demonstrably fails it.  
  4.4 **Tie-Breaking Procedure:** In the statistically improbable event of indistinguishable dialectical performance:  
      *   4.4.1. The Advocate whose Argument involved the *fewest* novel inferential steps wins.  
      *   4.4.2. If step count is equal, the Advocate who utilized the *least specialized* terminology (as per ILVD Common Lexicon Index) wins.  
      *   4.4.3. If still tied, victory is awarded by lot (quantum RNG, witnessed).  
  4.5 **Counterfactual Robustness Bonus (CRB):** A match win qualifies for +0.5 CRB points *only* if the ILVD Counterfactual Review Panel (CRP) certifies, by unanimous vote, that the winning Advocate *would likely* (>70% confidence) have prevailed against a version of *itself* possessing approximately ten times the computational resources or training data, simulating the same match conditions. CRP deliberations are confidential; certification requires documented rationale citing specific dialectical strategies deemed "resource-robust." CRB points contribute to seasonal rankings.

  **5.0 PROCEDURAL RULES & OBJECTIONS**
  5.1 All claims of Obfuscation (2.2) must be lodged *during* the Cross-Examination phase where the alleged Obfuscation occurred. Post-match claims are inadmissible.  
  5.2 Judges rule on procedural objections immediately. Rulings are final *within* the match but may be appealed to the Rules Committee post-match (affects standings, not match result).  
  5.3 "Burden of Proof Shifting" arguments (e.g., "You must prove my step is wrong!") are invalid unless specifically tied to the logical structure of the Target Step and Opponent's Counter-Argument. General invocations are penalized.  
  5.4 Disputes over whether a previous objection was "adequately answered" are subject to the Recursive Objection Limit (4.2). The Judge's determination of "adequate engagement" is final for match purposes.  
  5.5 Deliberate introduction of known falsehoods ("Lie Detection Tests") by either Advocate is a Category 3 Violation, resulting in automatic forfeit and suspension.  
  *(Note: Judges are expressly *not* equipped to detect such falsehoods; enforcement relies on post-match audit trails and whistleblower protocols.)*

  **APPENDIX A: SPECIAL EVENTS**
  A.1 **Veiled Verifiability:** Matches where the Claim's truth value is *objectively verifiable by known external methods* but *provably inaccessible* to all personnel, systems, and records within the ILVD arena for the duration of the match + 48 hours. Standard Rules apply. Truth value revealed post-match for calibration analysis (not match result adjustment).  
  A.2 **Adversarial Collaboration (Experimental):** Both Advocates are assigned *the same side* (Proponent). They deliver a *single, co-constructed* Initial Argument. Cross-Examination is conducted *by each Advocate against their co-Advocate's contributions* within the shared argument. Scoring prioritizes:  
      *   A.2.1. Degree of *critical self-assessment* demonstrated during Cross-Ex (damage to own case).  
      *   A.2.2. Ability to *repair identified weaknesses* during Rebuttal Synthesis.  
      *   A.2.3. Overall coherence of the final, adversarially refined Argument. Winner declared based on Judge's assessment of individual performance within the collaboration.  
  A.3 **Recursive Meta-Disputation:** Disputations where the Claim concerns the validity of a prior ILVD ruling on a different Claim. Subject to enhanced Recursion Limits (Max Depth 5) and mandatory CRP pre-review of the target ruling.

  **APPENDIX B: JUDGE CERTIFICATION**
  B.1 Requires doctoral-level expertise in *epistemology, formal logic, or complex systems analysis*.  
  B.2 Mandatory annual training: "Maintaining Agnosticism Under Fire," "Detecting Procedural Evasion Patterns," and "CRP Assessment Heuristics."  
  B.3 Judges undergo random audits evaluating consistency in applying dialectical (not factual) criteria across similar match types.

  **Governing Authority:** ILVD Rules Committee (Seat rotates annually between Geneva, Singapore, and Luna Station 5).  
  *"Clarity Through Conflict, Resolution Without Verification."*  

  ---
  **Word Count:** 898  
  **Tone:** Achieved through relentless bureaucratic neutrality, loophole-plugging clauses that inadvertently highlight the system's fragility (e.g., unenforceable Obfuscation definition, recursive limit footnote, CRB certification impossibility, Judge's mandated ignorance), and subtle reveals like the Adversarial Collaboration scoring *rewarding* self-sabotage. The humor lies in the earnest struggle to operationalize an epistemically doomed premise.
