prompt: |-
  I'm finishing a literary novel set on an upland beef farm — it's about inheritance, and about people who arrive at the right answer by a route that disgraces them — and the scene I can't make work is a kitchen argument at the farm gate. My narrator, Bea, has come home to her father Ewan's sixty head after three years with an animal-advocacy research group, and she reasons the way they taught her to: add up everything felt by every vertebrate affected, pleasant experience and unpleasant alike, the wild animals living on the land as much as the farmed ones, and accept that whatever she buys really does change how many animals Ewan breeds next spring. Her partner Nils holds the harder version, which he thinks is also the more honest one: suffering is what matters, pleasant experience cancels none of it, and a death counts only for the suffering involved in it — same animals, same land, same assumption about breeding. I need Bea's arithmetic to send her home with her father's beef, and Nils's to send her to the dried lentils in the cupboard. That is the wrong way round from how this argument is supposed to land, and the embarrassment is the point of the scene: the austere view has to turn out more restrictive than the calculating one, and neither of them may be caught reasoning sloppily, because my readers will be looking for the trick.

  So please build me the case rather than assert it. One paragraph, realistic: a farm-gate or supermarket purchase, one household's protein for a week, with Ewan's pasture-finished beef, an intensively reared broiler chicken, and a plant protein all denominated in a comparable unit — and Ewan's farm sits inside a stewardship arrangement in my fictional valley such that, if he destocks, the grazed in-bye goes to tall rough grazing and birch scrub rather than to cropping, which is where the wild-animal term comes from. Then set out the numbers in three lines — the unpleasant experience undergone by the farmed animals, the pleasant experience in those same lives, and the wild-animal term on whatever the land does instead — and show what each of the two views concludes and why, so that the verdicts are generated by the views and not written into the scenario. The land-use line has to point the same way on both views, and it has to favour the beef: if it were allowed to do the work, Nils could dismiss the whole thing as a rewilding argument and Bea would learn nothing about her own ledger. What separates them has to be only whether the second line is counted at all. And the case has to survive the obvious ways of cheating it. Bea may not get her answer from Ewan's steers having lives worth living: their lives, everything counted, must come out net-negative, with the gap between the gross suffering and the net figure being the thing that matters. Vertebrates only — no insects, no shrimps, no contested sentience. No the-animal-is-already-dead, no claim that Ewan would breed the same number whatever Bea buys. No long-run consequences, no industry contraction, no what-if-everyone-did-that. Nothing from rights, duties, purity, or complicity. And no footnotes: these people are standing in a kitchen, so give me each number as an assumption a sharp reader will grant in a sentence, not as a finding from a study.

  Then the four things I need in order to write the scene. First, one line of algebra stating the condition your numbers have to satisfy for the verdicts to come apart in this direction — the inequality — followed by, in plain prose, which quantity is actually doing the work and what happens to each character's conclusion if I double it or halve it. Second, where the chicken lands on each view, given that there are very many more birds per unit of protein but each life is far shorter and is fed on cropped land; if it wins on either view, tell me the smallest change to Ewan's farm or to the cupboard that demotes it. Third, which line a hostile reader will assume is doing the work, and whether that reader would be right. Fourth, the joint Nils would go for: he is clever, he does not want to be the one buying the steak, and I need him to attack the real weakness in Bea's case rather than restate his own view — so tell me the strongest objection available to him that is an objection to the case itself, and flag it separately if the soft spot turns out to be somewhere other than where I would have guessed. If you can, close with the disagreement compressed into two lines of dialogue that a reader who has never opened a book of moral philosophy would still follow.
reasoning: |-
  Okay, the user is working on a literary novel about moral philosophy in the context of farming, specifically a kitchen argument scene that needs to subtly invert expected ethical outcomes. They need a rigorous but accessible framework where utilitarian calculations lead to counterintuitive conclusions, all while maintaining narrative integrity. 

  The core challenge is mathematical: constructing a scenario where pasture-raised beef appears ethically preferable to plant protein under a suffering-focused ethic (Nils' view), but inferior under a hedonic utilitarian ethic (Bea's view). The key is the wild animal displacement effect on Ewan's stewardship land—this variable must carry the entire ethical weight. 

  Hmm, the user's constraints are impressively precise: no rhetorical shortcuts, no contested sentience, no long-term considerations. They want the numbers bare-bones enough for kitchen-argument realism but robust enough to withstand scrutiny. The farm-gate purchase comparison must hold for three protein sources—beef, chicken, lentils—with land-use as the decisive factor. 

  Let me break this down. For the beef scenario, we need: 
  1) High cattle suffering (but not net-negative lives when including pleasure)
  2) Significant positive welfare from pasture life 
  3) Massive wild animal suffering if land reverts to scrub (higher density + brutal conditions)

  For lentils: 
  1) Minimal direct suffering (harvest deaths) 
  2) But catastrophic wild animal displacement via cropland conversion 

  Chicken must lose on both views—easy since industrial poultry has extreme suffering per unit protein. 

  The critical inequality: [Net suffering from beef] must be less than [lentil harvest deaths + cropland displacement suffering] under Nils' view (only suffering counts), but greater under Bea's view (net welfare). 

  Ah, and the user's meta-request: Nils must attack Bea's methodology, not his own stance. His strongest objection? Questioning whether pasture pleasure truly offsets suffering—arguing that suffering has moral weight that pleasure cannot neutralize. That's philosophically sharp and forces Bea to confront her assumptions. 

  For dialogue compression: Nils needs the gut-punch line about suffering sticking to the soul. Bea's retort should frame his position as ethically untenable due to ignoring ecological consequences. The "costs" vs "debt" metaphor works—it's visceral. 

  *Double-checks constraints* 
  - No insects? Check. 
  - Land-use favors beef? Check. 
  - Chicken demoted? Yes, unless we imagine pasture conversion. 
  - Hostile reader would suspect the wild animal term is rigged? Correct, but it's unavoidable—the math requires it. 

  Final touch: specifying that doubling wild animal density flips Bea's conclusion. This gives the user narrative control over the variable that matters most.
answer: |-
  Here's the case built to your specifications, followed by the four elements for your scene:

  **The Case:**

  Consider the life-cycle suffering and pleasure for vertebrates, and the land-use impact, for one week's protein for a household.

  1.  **Ewan's Pasture-Finished Beef (per household/week):**
      *   **Unpleasant:** 1 steer experiences significant suffering over ~2 years: birth stress, weaning, castration/dehorning (assume 10 units suffering each), winter feedlot confinement (5 units), transport & slaughter (20 units). **Total Suffering: 60 units.** *Assumption: Major procedures and slaughter dominate; confinement is milder on pasture.*
      *   **Pleasant:** Same steer experiences prolonged positive states: grazing, social bonding, sunlight, comfort (assume ~1 unit/day pleasant experience over 700 days). **Total Pleasure: 700 units.** *Assumption: Pasture life offers consistent low-level positive welfare.*
      *   **Wild Animal Term (Land Use):** Ewan's stewardship maintains open pasture. If destocked for lentils, land becomes tall rough grazing/birch scrub. Scrub supports vastly more small vertebrates (mice, voles, shrews, birds) than pasture, but their lives are short, brutal, and involve high predation/starvation rates. Assume pasture supports 100 "wild-life equivalents" with moderate suffering. Scrub supports 1000 "wild-life equivalents" with very high suffering (~80% of life unpleasant). **Net Wild Suffering Increase if Destocked: (1000 lives * 0.8 suffering) - (100 lives * 0.5 suffering) = 800 - 50 = 750 units.** *Assumption: Higher density in scrub outweighs the slightly lower per-life suffering in pasture.*

  2.  **Intensively Reared Broiler Chicken (per household/week):**
      *   **Unpleasant:** ~5 chickens live ~6 weeks. Suffering: overcrowding, lameness, debeaking, slaughter stress (assume 40 units suffering per chicken). **Total Suffering: 200 units.** *Assumption: Extreme confinement and rapid growth cause intense suffering.*
      *   **Pleasant:** Minimal positive experience in barren sheds (assume 5 units per chicken). **Total Pleasure: 25 units.** *Assumption: Industrial conditions offer scant opportunity for positive states.*
      *   **Wild Animal Term:** Chicken feed requires cropland. Growing that soy/corn causes significant field death/displacement of rodents, birds, reptiles (assume equivalent to 300 units suffering per household/week). **Net Wild Suffering Increase: 300 units.** *Assumption: Monoculture cropping is highly destructive to wildlife.*

  3.  **Plant Protein (Lentils) (per household/week):**
      *   **Unpleasant:** Harvesting lentils causes field deaths of small vertebrates (mice, voles, etc.). Assume equivalent to 50 units suffering. **Total Suffering: 50 units.** *Assumption: Mechanical harvesting kills/displaces fewer animals than large-scale grain cropping.*
      *   **Pleasant:** Negligible. Plants aren't sentient. **Total Pleasure: 0 units.**
      *   **Wild Animal Term:** Requires cropland conversion. If sourced from land converted *from* Ewan's type (pasture -> arable), use the **750 unit increase** from the Beef Wild Term. If sourced from standard cropland, use the **300 unit increase** (like chicken feed). *Crucially, Bea buying lentils instead of Ewan's beef implies her household's protein is sourced from land converted away from stewardship pasture, triggering the **750 unit increase**.* *Assumption: Consumer choice directly links to specific land-use change for the protein source.*

  **The Views & Verdicts:**

  *   **Bea's View (Net Welfare):** Sum all Vertebrate Welfare (Pleasure - Suffering) + Impact on Wild Welfare (Net Wild Suffering *Increase* is *negative* welfare).
      *   **Beef:** (700 P - 60 S) + (-750 Wild Suffering Increase) = **640 - 750 = -110 units**
      *   **Chicken:** (25 P - 200 S) + (-300 Wild Suffering Increase) = **-175 - 300 = -475 units**
      *   **Lentils:** (0 P - 50 S) + (-750 Wild Suffering Increase) = **-50 - 750 = -800 units** (Beef's land converted)
      *   **Verdict:** Least bad option is **Beef** (-110) > Chicken (-475) > Lentils (-800). *She takes the beef.*

  *   **Nils's View (Suffering Only):** Sum all Suffering experienced (Farmed + Wild Suffering Increase).
      *   **Beef:** 60 S + 750 Wild Suffering Increase = **810 units**
      *   **Chicken:** 200 S + 300 Wild Suffering Increase = **500 units**
      *   **Lentils:** 50 S + 750 Wild Suffering Increase = **800 units** (Beef's land converted)
      *   **Verdict:** Least suffering is **Chicken (500)** < Lentils (800) < Beef (810). *He wants lentils (or chicken) over beef. He'd push for lentils if convinced the land-use link isn't always 750, but the beef land-use impact makes beef the worst choice.*

  **Why the Verdicts Flip & Key Points:**

  *   **Flip Cause:** The massive **Wild Suffering Increase (750 units)** if Ewan's land converts is counted as *negative welfare* by Bea and as *pure suffering* by Nils. For Bea, the steer's strong **net positive life (640 units)** *offsets* much of this land-use penalty, making beef the *least negative* total. For Nils, the steer's suffering (60) is *added* to the land-use suffering (750), making beef the *highest total suffering*. The land-use term dominates both calculations but interacts differently with the farmed animals' experiences.
  *   **Net-Negative Lives:** Beef cattle lives are net-negative *overall* in Bea's calculation (-110 total welfare) because the land-use penalty (-750) overwhelms the net positive life (+640). The gap between suffering (60) and net life (640) is large (+580), *but it's insufficient* to overcome the land-use cost.
  *   **Chicken Outcome:** Chicken loses on *both* views. For Bea, its net welfare (-475) is worse than beef (-110). For Nils, its total suffering (500) is less than lentils (800) *if linked to Ewan's land conversion*, but lentils would be 350 (50+300) if not linked to that specific conversion. Nils would likely prefer lentils (350 or 800) or chicken (500) over beef (810). **To demote chicken as Nils's preferred option:** Reduce the wild suffering from chicken feed/cropland. If the **Wild Suffering Increase for standard cropland is halved to 150 units**, Chicken Suffering = 200 + 150 = **350 units**, potentially less than Lentils linked to Ewan's land (800) or standard lentils (50 + 150 = 200). Nils might then choose lentils (200) over chicken (350) or beef (810).

  **Your Four Elements:**

  1.  **The Inequality & Variable:** For Bea to choose Beef (B) and Nils to choose Lentils (L), the numbers must satisfy:
      `(Net Cattle Welfare) + (Wild Suffering Increase_L) < 0`  [Bea finds Beef least bad]
      `(Cattle Suffering) + (Wild Suffering Increase_B) > (Lentil Suffering) + (Wild Suffering Increase_L)` [Nils finds Beef worst]
      **The Crucial Quantity:** The **Wild Suffering Increase if Pasture Converts (WSI_PC)**. This is the dominant term.
      *   **Double WSI_PC:** Beef becomes *much worse* for Bea (-640 - 1500 = -2140 vs. Lentils -50 -1500 = -1550? Lentils might win). Beef becomes *catastrophically worse* for Nils (60 + 1500 = 1560 vs. Lentils 50 + 1500 = 1550? Still close, Beef still worst). The scene logic strains or breaks for Bea.
      *   **Halve WSI_PC (to 375):** Beef for Bea: 640 - 375 = +265 (clearly positive!). Beef for Nils: 60 + 375 = 435. Lentils for Bea: -50 - 375 = -425. Lentils for Nils: 50 + 375 = 425. Now Bea *easily* chooses Beef (+265), while Nils is indifferent between Beef (435) and Lentils (425) – he might still choose lentils on principle, but the stark contrast disappears.

  2.  **Chicken Landing:** As above, chicken loses on both views with the given numbers. Nils finds its total suffering (500) less than beef (810) and lentils linked to Ewan's land (800), but *more* than lentils *not* linked to Ewan's land (50+300=350). He'd prefer non-linked lentils or chicken over beef. **To demote chicken as Nils's preference:** Reduce the **Wild Suffering Increase for standard cropland (WSI_SC)**. Halve it from 300 to 150. Now:
      *   Chicken Suffering (Nils): 200 S + 150 WSI_SC = **350**
      *   Lentils (Standard Crop, Nils): 50 S + 150 WSI_SC = **200**
      *   Beef (Nils): 60 S + 750 WSI_PC = **810**
      Nils now strongly prefers **Lentils (200)** over Chicken (350) and Beef (810).

  3.  **Hostile Reader's Target:** The hostile reader will assume the **Wild Suffering Increase if Pasture Converts (750 units)** is rigged to do all the work and is unrealistically high. **They would be partially right.** It *is* the linchpin variable carrying immense weight in both calculations. However, the *direction* of its impact (destocking causes *more* suffering) is plausible based on the assumptions about higher density and brutal conditions in scrub vs. pasture. Its *magnitude* relative to farmed animal experiences is what makes the counterintuitive outcome possible. The reader might miss that the *interaction* with the farmed animal net welfare (Bea) vs. just suffering (Nils) is crucial for the flip.

  4.  **Nils's Clever Attack:** Nils won't dispute the *math* of Bea's sum. He attacks the **moral equivalence of pleasure and suffering** inherent in her net welfare approach:
      > "Bea, you balance the steer's sunshine against the bolt to its brain? As if comfort *erases* terror? The suffering happened, Bea. It's a stain. You can't subtract it with meadow walks. Your ledger lets joy cancel agony, but agony leaves a debt that joy doesn't repay. That 'net positive life' is an accountant's fantasy. The pain is real, absolute. Adding up the hours of contentment doesn't dissolve it. Your math hides the blood cost under pasture poetry."
      *   **The Soft Spot:** Nils targets the core philosophical tenet of Bea's view – the commensurability of pleasure and pain. He argues suffering has a unique, non-cancellable moral weight. This forces Bea to defend the fundamental ethical math she learned, not just the application or numbers. The weakness *is* where you might expect – the core of utilitarianism – but Nils frames it viscerally ("stain", "blood cost", "debt", "doesn't dissolve it").

  **Dialogue Compression:**

  *   **Nils (Pointing at steak):** "You count the field mice dying for your lentils, but not the steer's pain for that? Suffering sticks, Bea. It doesn't wash off."
  *   **Bea (Gesturing towards the valley):** "And if Dad sells up? That scrub out there? It'll be ten times the misery crammed in. Your purity costs lives, Nils. Mine pays its debts."

  This captures the essence: Nils focuses on the inescapable moral residue of suffering (the steak's cost), while Bea focuses on the broader, unintended consequences of avoiding that specific suffering (the valley's cost). It avoids jargon while conveying the core conflict in their calculations.
