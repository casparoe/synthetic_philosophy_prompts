  ### Philosophy of Mind: Qualia Positions Diagnostic Tree  
  *Start with the shared commitment: Ordinary talk about how things seem or feel to a subject is in good standing (e.g., "the coffee tastes bitter to me" is meaningful).*

  1. **Stepwise Inversion Case**: After hundreds of micro-steps of gradual spectral inversion (each step indiscriminable from the last), the subject ends up labeling red objects as they once labeled green objects (and vice versa), yet reports no change. At the endpoint, is the subject's *experience* of red now identical to what their experience of green was at the start?  
     - **Yes (inversion occurred)** → Go to 2  
     - **No (experience unchanged, only labeling shifted)** → Go to 3  
     - **No fact of the matter (question is ill-posed)** → Go to 7  

  2. **Absent Qualia Case**: Is it possible for a perfect functional duplicate of you (identical behavior, brain function, verbal reports) to exist without any conscious experience?  
     - **Yes (absent qualia possible)** → Go to 4  
     - **No (absent qualia impossible)** → Go to 5  

  3. **Fixed Property with Swapped Relations Case**: Is it coherent to suppose that the intrinsic "feel" of an experience (e.g., the sensation of red) remains fixed, while all its functional relations (memory associations, discriminatory behavior, verbal reports, preferences) are swapped (e.g., the subject now reacts to red's feel as they once did to green's)?  
     - **Yes (swapped relations possible with fixed feel)** → Go to 6  
     - **No (fixed feel with swapped relations incoherent)** → Go to 8  

  4. **Inverted Qualia (Classic) Case**: Without gradual steps, is it possible for two functional duplicates to have inverted experiences (e.g., where one's experience of grass has the quality the other has for sky)?  
     - **Yes (inverted qualia possible)** → Leaf 1: **Primitivist Realism**  
     - **No (inverted qualia impossible)** → Leaf 2: **Emergentism**  

  5. **Basis of Qualia Case**: Are qualitative properties (e.g., the "what it's like" of pain) grounded in the intrinsic properties of physical entities (e.g., fundamental particles), or are they defined by functional roles?  
     - **Grounded in intrinsic physical properties** → Leaf 3: **Russellian Monism**  
     - **Defined by functional roles** → Leaf 4: **Functionalism**  

  6. **Introspective Indistinguishability Case**: If two experiences are introspectively indistinguishable to a subject, are they necessarily identical in qualitative character?  
     - **Yes (indistinguishability implies identity)** → Leaf 1: **Primitivist Realism**  
     - **No (indistinguishability ≠ identity)** → Leaf 5: **Representational Realism**  

  7. **Introspective Accuracy Case**: When a subject sincerely reports an experience (e.g., "I am in pain"), is there a fact of the matter about whether this report is accurate, beyond their dispositions to report?  
     - **Yes (accuracy fact exists)** → Go to 9  
     - **No (no fact beyond dispositions)** → Leaf 6: **Dennett-Style Eliminativism**  

  8. **Identical Experiences with Disagreement Case**: Is it possible for two subjects to have identical qualitative experiences (same intrinsic character) but exhaustively and permanently disagree about what they are like (e.g., one finds it pleasant, the other unpleasant)?  
     - **Yes (disagreement possible)** → Leaf 7: **Quietism**  
     - **No (disagreement impossible)** → Leaf 4: **Functionalism**  

  9. **Illusion Hypothesis Case**: Could the introspective appearance of intrinsic qualitative properties (e.g., pain's "rawness") be an illusion—i.e., no such properties exist, but we are compelled to believe they do?  
     - **Yes (illusion possible)** → Leaf 8: **Illusionism**  
     - **No (illusion impossible)** → Leaf 7: **Quietism**  

  ---

  ### Leaves (Named Positions)  
  1. **Primitivist Realism**:  
     - *Committed to*: Qualia as primitive, non-physical properties, independent of functional roles.  
     - *Awkward commitment*: Explaining how non-physical properties interact with the physical brain.  
  2. **Emergentism**:  
     - *Committed to*: Qualia as emergent from physical systems, allowing their absence in duplicates but not inversion.  
     - *Awkward commitment*: Why inversion is impossible if absence is possible (e.g., "zombies" are conceivable but "inverts" are not).  
  3. **Russellian Monism**:  
     - *Committed to*: Qualia as intrinsic properties of physical entities that ground observable structure.  
     - *Awkward commitment*: The "combination problem"—how micro-qualia combine to form unified macro-consciousness.  
  4. **Functionalism**:  
     - *Committed to*: Qualia defined by causal roles (input-output relations).  
     - *Awkward commitment*: Explaining why functional roles feel like anything at all (e.g., the "hard problem" remains).  
  5. **Representational Realism**:  
     - *Committed to*: Qualia as properties represented by mental states, which introspection can misreport.  
     - *Awkward commitment*: Skepticism about knowing one's own experiences (e.g., introspective error threatens authority).  
  6. **Dennett-Style Eliminativism**:  
     - *Committed to*: Replacing qualia-talk with descriptions of dispositions (e.g., "seeming" is just being disposed to judge).  
     - *Awkward commitment*: Denying that there is anything "it is like" to be us, despite appearances.  
  7. **Quietism**:  
     - *Committed to*: The qualia debate being verbal (e.g., "experience" ambiguously refers to dispositions or intrinsic properties).  
     - *Awkward commitment*: Dismissing persistent intuitions (e.g., "but pain *hurts*!") as conceptual confusion.  
  8. **Illusionism**:  
     - *Committed to*: Introspection generating an illusion of intrinsic qualia (e.g., "what it's like" is a false appearance).  
     - *Awkward commitment*: Explaining the mechanism and evolutionary purpose of the illusion.  

  ---

  ### Post-Tree Analysis  

  1. **Indistinguishable Leaves**  
     - **Primitivist Realism (Leaf 1) and Representational Realism (Leaf 5)** cannot be cleanly separated here. The distinction rests on *what introspection accesses*: Primitivism assumes direct revelation of qualia, while Representationalism allows misrepresentation. This difference depends on unasked background commitments (e.g., the nature of introspection) and is often rhetorical—both agree qualia exist but disagree on whether they explain discrimination or judgment.  

  2. **Unoccupied Positions**  
     - **"Fixed feel with swapped relations + Introspective indistinguishability ≠ identity" (Node 6 → Leaf 5)**: Permitted but unexplored. It combines intrinsic qualia with introspective fallibility, but theorists avoid it as unattractive—it invites skepticism without explanatory payoff.  
     - **"No fact in inversion + Accuracy fact exists + Illusion impossible" (Nodes 7 → 9 → Leaf 7)**: Coherent but merely unattractive. Quietism typically avoids asserting "facts" about introspection, so this hybrid is unstable and unused.  

  3. **Least Trustworthy Branch**  
     - **Node 3 (Fixed Property with Swapped Relations)** is the profession's most evenly split node. Its phrasing presupposes the contested claim that "intrinsic feel" is separable from function, which functionalists and eliminativists reject. The branch would redraw if empirical work showed that neural "feel" properties are always tied to specific functions (e.g., if altering a brain circuit *always* changes both discrimination and reported experience). This would collapse the distinction between intrinsic and relational, forcing a re-evaluation of inverted/absent cases.
