  Here are the two scenes crafted to your specifications, followed by the analysis. I've strictly adhered to your constraints: no certainties, no ruin-level losses, same woman/amounts/timeframe, genuine EU violation, ordinary stakes, and emotional plausibility.

  ### Scene One (Safe Choice)
  The client slid the contract for the custom cabinet across her workshop table. "Base fee: $1,000. But our inspector might review it—about 10% chance. If he does, you pick: Option A, he adjusts the fee by $100 either way; Option B, he either docks you $200 or adds $400." She calculated swiftly: $1,000 covered her supplier payment. Option A meant $900 or $1,100 if inspected—tight but survivable. Option B risked $800, a hole she couldn't afford. She initialed **Option A**, the safe trim.

  ### Scene Two (Risky Choice)
  Two hours later, the client called: the delivery van had scraped the cabinet. "We're withholding the base fee. Only if the inspector comes—10% chance—will we pay anything. Same choices: if inspected, Option C gets you $900 or $1,100; Option D risks $800 or $1,400." She pressed her forehead. $1,100 wouldn't salvage the quarter; the supplier would drop her. $1,400 might. **Option D**, the only lifeline.

  ---

  ### Proof of Structure and EU Violation
  **Shared Slice (89% weight):**  
  - Scene 1: Pays **$1,000** (no inspection)  
  - Scene 2: Pays **$0** (no inspection)  

  **Sliver (11% weight—inspection occurs):**  
  Identical gamble in both scenes:  
  - **Safe Option (A/C):** 50% chance of **$900**, 50% chance of **$1,100**  
    → *Expected Value (EV) = $1,000*  
  - **Risky Option (B/D):** 50% chance of **$800**, 50% chance of **$1,400**  
    → *EV = $1,100*  

  **Algebraic Proof of EU Violation:**  
  Let \(u\) be a utility function over wealth.  
  - **Scene 1 Preference (A > B):**  
    \(0.89 u(\$1,000) + 0.11 [0.5 u(\$900) + 0.5 u(\$1,100)] > 0.89 u(\$1,000) + 0.11 [0.5 u(\$800) + 0.5 u(\$1,400)]\)  
    Simplify by subtracting \(0.89 u(\$1,000)\) from both sides:  
    → \(0.5 u(\$900) + 0.5 u(\$1,100) > 0.5 u(\$800) + 0.5 u(\$1,400)\)  
    → \(u(\$900) + u(\$1,100) > u(\$800) + u(\$1,400)\)  ...(1)  

  - **Scene 2 Preference (D > C):**  
    \(0.89 u(\$0) + 0.11 [0.5 u(\$800) + 0.5 u(\$1,400)] > 0.89 u(\$0) + 0.11 [0.5 u(\$900) + 0.5 u(\$1,100)]\)  
    Simplify by subtracting \(0.89 u(\$0)\) from both sides:  
    → \(0.5 u(\$800) + 0.5 u(\$1,400) > 0.5 u(\$900) + 0.5 u(\$1,100)\)  
    → \(u(\$800) + u(\$1,400) > u(\$900) + u(\$1,100)\)  ...(2)  

  Equations (1) and (2) are **contradictions**. No \(u\) exists satisfying both.  
  **Key Insight:** The shared slice cancels out in the EU comparison. Only the sliver matters—and her preferences flip when the shared slice changes, violating EU's independence axiom.  

  ---

  ### The Single Feature Doing the Work
  **The shift in the shared slice outcome** drives the reversal.  
  - **If the shared slice were identical in both scenes (e.g., always $1,000):**  
    Her choice would be consistent (always safe or always risky). No flip occurs.  
  - **If the shared slice improved (e.g., $1,000 → $2,000):**  
    Risk aversion strengthens. She likely remains safe, no flip.  
  - **Why it works here:**  
    The shared slice dropping **from $1,000 to $0** moves her from the *domain of gains* (where she fears loss) to the *domain of losses* (where she chases recovery). The **same sliver gamble** feels different against these backgrounds.  

  ---

  ### Ex-Husband's Attack  
  **Strongest Objection (Money Pump Argument):**  
  If she insists both choices are rational, an exploiter could:  
  1. Pay her a pittance to switch Scene 1’s choice to risky (B).  
  2. Charge her a fee to switch Scene 2’s choice to safe (C).  
  3. Result: Identical outcomes as her original position, but she’s lost money.  
  → She’d pay to revert her own preferences, creating arbitrage.  

  **Dinner-Table Dialogue (Zero Jargon):**  
  “You’d pay me to avoid the risk this morning, then pay me to take it this afternoon. Same odds, same dollars. I’d milk you all day.”  

  ---

  ### Weaknesses and Mitigations  
  **Where It’s Weakest:**  
  Dropping the certainty effect makes the reversal **less visceral** than textbook Allais (which exploits guaranteed outcomes). Here, both options are always gambles, so the emotional "pull" relies on:  
  - **Mitigation 1 (Narrative Stakes):**  
    Scene 1: $1,000 is a *threshold* (covers supplier payment). Losing $200 risks cascading failures.  
    Scene 2: $0 is *catastrophic baseline*. $1,100 is "too little, too late"; $1,400 is the only recovery.  
    → **Result:** Reader feels, "She *must* avoid risk in Scene 1; she *must* chase it in Scene 2."  
  - **Mitigation 2 (Sliver Design):**  
    The sliver’s risky option ($800/$1,400) has higher EV ($1,100) than the safe option ($900/$1,100, EV $1,000). This makes Scene 2’s gamble *objectively better* if she were risk-neutral—but EU forbids flipping.  
    → **Result:** Sharp readers sense dissonance ("Why avoid +EV now?"), priming them for the ex-husband’s critique.  

  **Honest Trade-off:**  
  The shared slice shift ($1,000 → $0) must feel **existential**, not incremental. If $0 isn’t framed as a disaster (e.g., "I’d survive it"), Scene 2’s gamble feels irrational. Your draft must emphasize:  
  > *"$1,100 wouldn’t salvage the quarter"* / *"supplier would drop her"*  
  ...to make despair-driven risk-taking palpable.  

  ---

  ### Final Notes  
  - **No Certainties:** Every option has ≥2 outcomes. Sliver is always a sub-gamble.  
  - **Ordinary Stakes:** Craft business, $800-$1,400 swings.  
  - **Same Week/Same Woman:** Both scenes within one workday; only the *context* (shared slice) changes.  
