answer: |-
  ## The Sign-Off (Scene: Health Dept. Break Room)**

  *(INAUDIBLE OFFICE HUM. INES spreads a printed prototype on the table beside half-eaten sandwiches. DEV leans against the counter, arms crossed.)*

  **INES:** Okay, final run. Look at the sequence: Dose One *now*. *(She taps a simple pictogram of a hand holding a pill near a stylized mouth.)* Then, the clock. *(She points to three identical clock icons, each subtly numbered 12, 36, 48.)* Check the rash *here*. *(A schematic arm with a clear, thick line drawn above the elbow.)* Only if it’s past *this* line by the *last* clock? *(A hand holding the pill is crossed out with a red diagonal bar.)* Skip Dose Two. It’s conditional. The pictures carry the *when* and the *if*.

  **DEV:** *(Sighs, pushes off the counter)* Ines, it’s elegant. It really is. But that red bar? Last spring’s test? Most people thought it meant the medicine *itself* was bad. Dangerous. Not "don’t take *this specific dose* under *this specific condition*." They saw a crossed-out pill and panicked. Confident wrong guesses. That’s not a misread; that’s a failure mode with consequences.

  **INES:** That’s why we run the read-backs! We show it, they tell us what it means. If they can’t articulate "don't take the second dose if the rash is past the line," we iterate. We fix the bar, change the context. It’s how you build the vocabulary.

  **DEV:** Vocabulary? That’s my point. *(He picks up the prototype, jabs a finger at the "1 in 400" panel.)* See this? Your dotted-out unit next to the full ones? Clever. Shows quantity. But *what* quantity? One *what*? Bad reaction? Mild itch? Death? And "in 400"? That’s base rate, abstraction. *(Points to the timeline.)* Three clocks meaning a 48-hour *window*? Conditionality? Negation? *(He drops the card)* You haven't made pre-literate communication, Ines. You've built a *new* symbolic language. One with no alphabet, no dictionary, no Rosetta Stone stuck to the fridge. Writing systems *require* teaching. Ours gets handed out once, for forty seconds, to someone juggling a screaming toddler. Your 'read-back' just proves people can parrot *your* specific convention *in that test*. Next week, with a different designer's symbols? Back to square one.

  **INES:** So we throw out pictures? Rely *only* on text for a population where half struggle with English, let alone medical jargon? "If the erythematous eruption has not extended proximal to the demarcated dermal indicator within the forty-eight-hour temporal window, administration of the subsequent dosage is contraindicated"? *That’s* clearer? Legal’s making us cram that *exact* risk phrase in tiny type at the bottom anyway – "Approximately 0.25% of recipients experience severe adverse reactions." That line alone will do more damage than my whole visual system could ever prevent! People see numbers, they freeze.

  **DEV:** I’m not saying text-only. I’m saying *anchored* visuals. Supporting, not replacing. *(He grabs a pen, sketches rapidly on a napkin: A simple calendar icon with "Day 1" and "Day 2" circled.)* "Check rash here on Day 2." *(Draws a clear arm with a bold line above the elbow.)* "If rash is BELOW line, take Dose 2." *(Pill icon + checkmark.)* "If rash is ABOVE line, DO NOT take Dose 2." *(Pill icon + big red X.)* Words and pictures, *together*. The X is universal 'stop'. The location of the rash relative to the line is concrete. No decoding timelines or counting dots needed under pressure.

  **INES:** *(Leans in, studying the napkin)* ...The X is better than the bar. I’ll give you that. Less ambiguous. But your fraction? "1 in 400"? Still needs words. And my dotted unit *shows* the scale visually. One bad, 399 okay. It conveys the rareness instantly. Words alone for that risk? It either gets ignored or terrifies.

  **DEV:** Then put the number *and* your dots *together*. "Very few people have a bad reaction: About 1 in 400." Let the dots reinforce the "very few" idea the words establish. Don't make the dots carry the entire numerical meaning alone. That’s the boondoggle part – thinking pictures can perfectly encode complex quantitative and conditional information without a shared foundation. My foundation is simple words plus simple, unambiguous symbols. Yours is... Viennese Esperanto.

  **INES:** *(A ghost of a smile)* Neurath understood the *need* for the foundation. He knew it took repetition, institutional consistency. We’re not giving them that. I know that. But without *some* visual scaffolding, the text is a wall. Especially for the dose timing and the rash check. Your calendar is... acceptable. Better than my clocks for a one-off.

  **DEV:** And the pregnancy and blood pressure meds? Absolute contraindications. No conditionals. Big, clear text warning with icons: Pregnant woman silhouette + big red X. Pill bottle + heart icon? + big red X. No room for interpretation. Pictures alone for "don't take if you're on *this specific common drug*"? Impossible without prior knowledge.

  **INES:** Agreed. Text and symbol for those. Non-negotiable. The fever instruction? "Come back if temperature high" – we can use a thermometer icon plus an arrow pointing back to the pharmacy. Simple. Reinforces the text.

  **DEV:** Okay. Okay. So we compromise. How’s this: Your arm with the bold line for the rash location. My calendar for "Check on Day 2". Big red Xs for "DO NOT Take Dose 2 if rash above line" and for the absolute "DO NOT Take At All" for pregnancy and the BP meds – combined with *very* clear text labels. Your dotted units for "1 in 400", but *right next to* the words "Very few people have a bad reaction: About 1 in 400". Thermometer + arrow + "Come back if fever" text. Legal’s nightmare sentence tiny at the bottom. Minimalist layout, lots of white space. One clear flow.

  **INES:** ...And we ditch the negation bar. Use the X. And the timeline becomes 'Day 1 / Day 2'. *(She nods slowly, reluctantly)* It’s less... pure. But it might survive forty seconds in the wild. I can live with it. Provided the X is *huge* and unambiguous.

  **DEV:** Deal. I’ll mock it up by 3 PM. Send to print tonight. *(Pauses, gathering the prototypes and the napkin)* You know I still think those fraction dots are visual noise, right? People will just skip over them, or worse, miscount.

  **INES:** *(Standing up)* And you know I think forcing everyone to parse "Approximately 0.25%" even in tiny text will spike anxiety more than any pictogram ever could? It’s medical jargon hiding as precision. But... Friday. We ship it.

  *(They exchange a look of weary, unresolved understanding. Dev heads for the door, napkin sketch in hand. Ines stares at her original prototype, tracing the discarded timeline with a faint sigh.)*

  ## THE CARD THEY SHIP
  *(Concrete Description)*

  *   **Top Section (Dose 1):** Simple hand-to-mouth icon + "Take First Dose NOW".
  *   **Middle Section (Check & Dose 2 Decision):**
      *   Clear icon of an arm with a thick, dark line above the elbow. "Check Rash Here".
      *   Simple calendar icon labeled "Day 2".
      *   **Decision Branch:**
          *   *Option 1:* Rash icon *below* the line + Green Checkmark + Pill icon + "TAKE Dose 2".
          *   *Option 2:* Rash icon *above* the line + **Large, Bold Red X** + Pill icon + "DO NOT TAKE Dose 2".
  *   **Warnings Section:**
      *   **Pregnancy:** Silhouette of pregnant person + **Large Red X** + "DO NOT TAKE if PREGNANT".
      *   **Blood Pressure Meds:** Simple pill bottle icon + small heart icon? + **Large Red X** + "DO NOT TAKE if on [Specific Common Drug Name - e.g., Lisinopril]".
  *   **Risk Information:** Cluster of 400 small dots, one clearly dotted-out/faded. Text beside it: "Very few people have a bad reaction: About 1 in 400".
  *   **Fever Instruction:** Thermometer icon pointing upwards + Arrow pointing back to a building icon (pharmacy) + "COME BACK if you get a FEVER".
  *   **Legal Text:** Tiny, bottom corner: "Approximately 0.25% of recipients experience severe adverse reactions. Consult healthcare provider for complete risk information."
  *   **Overall:** Clean, minimal layout. Heavy use of white space. Clear visual hierarchy. Text anchors all key visual elements.

  **DEV'S LINGERING OBJECTION:** "Those fraction dots are pointless clutter. People won't count them right, if they look at them at all. Text alone would be cleaner."

  **INES'S LINGERING OBJECTION:** "That tiny '0.25%' legal line is a landmine. It uses scary, precise jargon most won't understand, undermining the 'very few' message the visuals and simpler words try to convey. It does more harm than good."
