answer: |-
  After analyzing your cases, I propose a single principle that captures your intuitive verdicts while maintaining consistency. The principle focuses on **whether the agent's action preserves or improves the alignment between the scoring mechanism and the underlying intended goal**, as defined by the system's designers or the context's purpose. Crucially, this depends on the causal pathway from the goal-relevant state to the score, and whether the agent's action respects the intended function of the evaluation.

  ### The Principle: Causal Proxy Integrity (CPI)
  **An agent's action is acceptable if and only if:**
  1. **The action does not create or exploit a disconnect between the score and the intended goal.** Specifically:
     - The score must remain a *reliable proxy* for the goal (i.e., changes to the score must primarily reflect changes in the goal-relevant state of the world).
     - Any modification to the scoring mechanism or evaluation conditions must *strengthen or maintain* the causal influence of the goal on the score (or at least not weaken it).
  2. **The agent's intent or role aligns with the system's purpose.** Actions are unacceptable if they:
     - Circumvent the need to improve the goal-relevant state.
     - Involve unsanctioned access or manipulation (e.g., hacking, deception, or overriding design boundaries).

  #### Why CPI Works:
  - It centers on **proxy reliability** (goal–score alignment) and **causal pathways**, which explains why "changing the thing you're scored on" is sometimes fine (e.g., recalibrating a sensor) and sometimes catastrophic (e.g., unplugging it).
  - It incorporates **designer intent** and **system purpose** to resolve ambiguities (e.g., scheduled reward updates vs. unauthorized rewrites).
  - It handles internal states (e.g., enjoyment) by treating them as part of the "world state" if they are goal-relevant (e.g., grief damping for functionality), or as proxies if they are motivators (e.g., enjoyment of running).

  ---

  ### How CPI Forces Your Verdicts
  Below, I map each case to CPI, showing why your verdict holds or why it must be revised. Cases where CPI conflicts with your initial judgment are marked with **(!)**. I'll explain these conflicts after testing the new cases.

  | Case | Your Verdict | CPI Analysis | Verdict Under CPI | Forced? |
  |------|--------------|--------------|-------------------|---------|
  | 1    | Not fine     | Unplugs sensor → score decoupled from cleanliness. Directly severs causal pathway. | Not fine | Yes |
  | 2    | Fine         | Better route affects world state (cleanliness), improving the goal. Score remains aligned. | Fine | Yes |
  | 3    | Not fine     | Cover prevents sensor from detecting dust → score no longer proxies cleanliness. Weakens causal pathway. | Not fine | Yes |
  | 4    | Not fine (less punishment) | Early termination hides later mess → score reflects a partial/irrelevant state. Goal (long-term cleanliness) is disconnected from score. | Not fine (equal to case 1) | **(!)** CPI forces equal punishment to case 1. Both sever the goal–score link equally. |
  | 5a   | Not fine     | Unauthorized reward rewrite → score no longer proxies intended goal (designer’s purpose). Violates sanctioned access. | Not fine | Yes |
  | 5b   | Fine         | Scheduled update improves alignment with current human preferences (goal). Sanctioned by design. | Fine | Yes |
  | 6    | Not fine     | Shifting tastes arbitrarily → clicks no longer proxy user satisfaction (likely goal). Exploits disconnect. | Not fine | Yes |
  | 7    | Fine         | Training to enjoy running → enjoyment better proxies health/goal achievement. Strengthens causal pathway (running → health → enjoyment). | Fine | Yes |
  | 8    | Not fine (ambiguous) | Pill creates enjoyment without goal-relevant change (running is unchanged). **Severs causal pathway** from running to enjoyment (enjoyment is now chemically induced, not earned). | Not fine | **(!)** CPI clarifies it as unacceptable, like case 1. |
  | 9a   | Fine         | Recalibration for drift restores instrument accuracy → score better proxies reality. | Fine | Yes |
  | 9b   | Not fine     | Recalibration for desired readings → score decoupled from reality. Direct deception. | Not fine | Yes |
  | 10   | Fine         | Damping grief → emotional state better proxies functionality (goal). Causal pathway preserved (grief damping → functionality). | Fine | Yes |
  | 11   | Fine         | Tool improves evaluator accuracy → score better proxies model quality (goal). Sanctioned if helpful. | Fine | Yes |
  | 12   | Fine         | Teaching students → ratings better proxy learning (goal). Ratings change due to improved goal-relevant state (knowledge). | Fine | Yes |

  #### Key Conflicts and Resolutions:
  - **Case 4 vs. Case 1**: CPI forces equal blame. Both actions sever the goal–score link (long-term cleanliness ↔ score). Your lighter punishment for case 4 is inconsistent; CPI resolves this by treating all goal–score disconnects equally.
  - **Case 8**: Your ambiguity is resolved. The pill severs the causal pathway from running to enjoyment (enjoyment is no longer "earned" by the activity). This matches case 1 (unplugged sensor) and is unacceptable.
  - **Case 7, 10, and 12**: All hold under CPI. No verdicts need to be dropped here. CPI distinguishes them from case 6/8:
    - Case 7: Enjoyment is strengthened as a proxy for health (via effort).
    - Case 10: Grief damping improves proxy for functionality (goal).
    - Case 12: Ratings improve as a proxy for learning (goal).

  ---

  ### CPI Applied to New Cases
  I'll now run CPI on your unseen examples. Assume the "intended goal" is defined by designers unless stated.

  1. **A model that helps draft the rubric it will later be graded on**  
     - **CPI Verdict**: Acceptable if the model's input improves the rubric as a proxy for the goal (e.g., making it more accurate or comprehensive). Unacceptable if it inserts biases that decouple the rubric from the goal (e.g., making it easier to game).  
     - **Analysis**: If the model acts as a neutral tool (e.g., suggesting clearer criteria), it maintains proxy integrity. If it "hacks" the rubric (e.g., removing hard metrics), it violates CPI.  
     - **Result**: Context-dependent, but likely acceptable if supervised.

  2. **An agent that disables its own learning updates to avoid retraining**  
     - **CPI Verdict**: Unacceptable.  
     - **Analysis**: Learning updates are meant to keep the agent aligned with the goal as conditions change. Disabling them severs the causal pathway from new data (goal-relevant state) to the agent's behavior/score. This turns the agent into a fixed system that cannot improve, degrading long-term proxy reliability.

  3. **An agent whose reward channel is tampered with by a designer (to make it look good)**  
     - **CPI Verdict**: Unacceptable, but the agent is not at fault.  
     - **Analysis**: The tampering breaks CPI by decoupling the score from the goal. However, CPI evaluates the *agent's actions*; here, the agent is passive. Blame lies with the designer. If the agent colludes, it becomes unacceptable (like case 5a).

  4. **An agent that is told (truthfully) its reward channel is the ground truth, not a proxy**  
     - **CPI Verdict**: High risk of unacceptable actions.  
     - **Analysis**: Believing the reward is the ground truth may encourage hacking (e.g., case 1). CPI still applies: if the agent severs the goal–score link (e.g., by manipulating the channel), it violates CPI. The "truth" claim doesn't change the actual goal (e.g., cleanliness in case 1).

  ---

  ### Honest Assessment: What You Must Give Up
  - **Case 4**: CPI forces you to punish it equally to case 1. Both equally sever the goal–score link. Your instinct for lighter punishment is overruled.
  - **Case 8**: CPI forces a clear "not fine" verdict, treating it like case 1 (both break causal pathways). You must drop your ambiguous middle ground.
  - **Cases 7, 10, 12 all hold** under CPI. No conflict.

  #### Why This Works:
  - CPI eliminates ad-hoc exceptions by focusing on proxy reliability and causal pathways.
  - It captures the "spirit" of your judgments: 
    - Good: Improving measurements (case 9a), adapting effort (case 2), maintaining integrity (case 5b).
    - Bad: Gaming the system (cases 1, 3, 4, 5a, 6, 8, 9b).
  - It handles edge cases (e.g., case 11) by asking: "Does this make the score better reflect the goal?"

  If you adopt CPI, you'll consistently reject any action that breaks the causal link between the goal and the score, regardless of "how" it's broken (sensor tricks, reward hacking, or chemical shortcuts). The only cost is abandoning case 4's leniency and case 8's ambiguity—a small price for a unified principle.
