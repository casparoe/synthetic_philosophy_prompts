answer: |-
  ## Proposal: The Partition Problem in Consequentialism - When Expected Value Becomes Ill-Posed

  **1. The Core Question**
  Does the causal sprawl of actions into the indefinite future render the expected value maximand of act-consequentialism fundamentally ill-posed, due to the conditional convergence of the sum of probability-times-value over possible outcomes? Specifically, if the expected value sum for a pair of acts is only conditionally convergent, meaning its total depends arbitrarily on the ordering and partitioning of the outcome space, can consequentialism deliver a determinate verdict on which act is obligatory, even in principle? And does this problem intensify, rather than diminish, when shifting evaluation to rules or policies?

  **2. The Landscape of Cluelessness and Existing Responses (Why They Leave the Question Open)**
  The challenge of "cluelessness" – our inability to know the long-term consequences of actions – manifests in distinct ways. Existing responses address some manifestations but fail to confront the proposed core problem.

  *   **Sign-Cluelessness & the Subjective Turn:** The first complaint notes that while near-term effects can be ranked, the *direction* (sign) of the long-term value difference between acts is obscured by uncertainty. The standard reply, adopting subjective consequentialism (maximizing expected value relative to the agent's credences), is largely successful here. It dissolves the problem by defining obligation relative to available evidence, not inaccessible objective value. It does not, however, address the *existence* or *definability* of the expected value itself.
  *   **Tail-Cluelessness & the Washout Hope:** The second complaint concerns the vast *spread* of possible long-term effects, where extreme ("tail") outcomes could swamp calculable near-term advantages. The standard comfort is that these unknown long-run effects are roughly symmetric between acts and thus "wash out" in expectation. **This response leaves the question open because it presupposes the existence of a well-defined expected value.** If the probability distribution over long-run value differences decays slowly (e.g., as a power law), the expectation integral may fail to converge to a finite value, rendering the "washout" argument mathematically incoherent. Symmetry alone cannot guarantee a determinate expected difference if the mean is undefined.
  *   **The Impasse of Imprecise Credences:** Facing deep uncertainty, some suggest representing beliefs with imprecise probabilities (sets of credence functions) and adopting a decision rule (e.g., maximin, Hurwicz criterion). While potentially valuable for decision-making under ignorance, this approach concedes that standard expected value maximization *fails* under cluelessness. It doesn't resolve the underlying definability problem for expected value; it sidesteps it by abandoning maximization as the sole criterion. It leaves open whether expected value *could* have been defined and used.
  *   **The Two-Level Retreat:** When act-assessment seems hopeless, consequentialists often retreat to evaluating rules, policies, or institutions. **Crucially, this retreat assumes aggregating over rules is *more* tractable than aggregating over acts.** If the partition problem is genuine, this assumption is likely false. Assessing a rule requires aggregating value over *all* instances of its application, potentially across vast timeframes and diverse contexts. This involves summing over an even larger, more heterogeneous outcome space than assessing a single act, potentially exacerbating the partition-dependence problem rather than solving it. This move thus fails to address, and may worsen, the core concern.

  **3. Method: Focusing the Philosophical Lens (3 Months)**
  This project employs rigorous conceptual and philosophical analysis, deliberately eschewing alternative approaches unsuitable for its core question:

  *   **Month 1: Formalizing the Partition Problem:** Precisely articulate the conditional convergence challenge within a consequentialist framework. Define the conditions under which expected value sums for actions with open-ended consequences become partition-dependent. Distinguish this sharply from problems requiring infinite populations, divine wagers, or Pascalian gambits. *Why not empirical forecasting?* Forecasting specific long-run effects is impossible; the problem concerns the *formal structure* of evaluation under causal sprawl, not predicting outcomes. *Why not formal infinite aggregation?* The issue arises even with finite (but unbounded and uncertain) long-run effects; focusing on infinity risks obscuring the distinctively *cluelessness*-based origin.
  *   **Month 2: Testing the Problem's Scope & Robustness:** Investigate potential "solutions" within consequentialism: (A) Does adopting a bounded or strongly saturating value function guarantee absolute convergence, dissolving the problem? (B) Does the causal structure of the world provide a privileged partition or natural ordering that yields a unique expected value? (C) Does the problem manifest equally for all types of acts, or only specific ones? Critically evaluate whether rule-consequentialism genuinely inherits or amplifies the problem. *Why not abandon consequentialism?* While this is a live option, the project's goal is to probe the internal coherence of consequentialism *itself* under cluelessness, a necessary step even for those considering alternatives.
  *   **Month 3: Implications & Deliverable Synthesis:** Draw out the implications: If the problem is real and robust, what does it mean for consequentialist obligation? Articulate the precise conditions under which consequentialist verdicts become indeterminate. Develop the core argument for the paper. Draft the short note for the funder, translating the philosophical result into implications for decision-making under deep uncertainty.

  **4. Possible Conclusions and Deciding Factors**
  The analysis could yield several distinct conclusions:

  1.  **The Problem Stands:** Conditional convergence is endemic under causal sprawl, expected value is ill-posed for many action pairs, and rule-consequentialism offers no refuge. *Deciding Factor:* Demonstrating plausible, realistic scenarios where no value bounding or privileged causal partition resolves the partition-dependence.
  2.  **Value Bounding Dissolves It:** A sufficiently strongly saturating (e.g., bounded) value function ensures absolute convergence. *Deciding Factor:* Showing that plausible long-run effects (e.g., influencing the very long-term future trajectory of civilization) can generate value differences that overwhelm any proposed bound or saturation point within a realistic model.
  3.  **Causal Structure Saves It:** The physical causal structure provides a unique, privileged way to partition outcomes or order summation, yielding a determinate expected value. *Deciding Factor:* Successfully defending a specific, non-arbitrary principle for deriving the "correct" partition/order from causal relations that withstands challenges of underdetermination.
  4.  **Limited Scope:** The problem exists but only for a narrow class of acts with extreme long-term leverage, leaving most practical consequentialist reasoning intact. *Deciding Factor:* Showing that the conditions for conditional convergence arise only under highly specific, unrealistic circumstances not typical of most choices.

  **5. Failure Conditions and Scope Management**
  An honest account requires acknowledging potential failure:

  1.  **Collapse into Fanaticism:** The problem proves inseparable from issues in infinite ethics or Pascalian fanaticism, despite efforts to ground it solely in mundane causal sprawl and cluelessness. *Mitigation:* Relentlessly anchor examples and formalism in finite but open-ended consequence chains typical of real-world actions, avoiding infinite populations or cosmology.
  2.  **Technical Soundness, Practical Irrelevance:** The partition problem is established but deemed irrelevant because: (a) agents can never approximate the sums anyway, (b) alternative decision rules (e.g., satisficing, imprecise prob.) are used in practice, or (c) the range of plausible verdicts across partitions is narrow. *Mitigation:* Argue that foundational indeterminacy matters philosophically even if pragmatically bypassed, and explore the significance of the *potential* for wide divergence.
  3.  **Unsolvable Ambiguity:** The analysis reveals deep ambiguities (e.g., in defining "causal structure" or "saturation") that prevent a clear resolution within the timeframe. *Mitigation:* Clearly diagnose the ambiguity as a key finding and outline paths for future research.
  4.  **The Problem Evaporates:** Careful analysis shows the conditional convergence scenario cannot realistically arise from the causal sprawl of ordinary actions. *Mitigation:* Scrutinize initial assumptions; this is a valid, if disappointing, outcome.

  **Scope & Contingency:** The core focus is establishing the third complaint. If Month 1 decisively shows it cannot arise under plausible assumptions, the project pivots in Month 2 to a thorough critique of the "washout" argument for tail-cluelessness, challenging the assumption of well-defined expectations. The rule-consequentialism critique will be adjusted accordingly.

  **6. Why Support Foundational Work? The Applied Deliverable**
  While applied projects address *how* to choose under uncertainty, this work probes whether a core ethical framework *can* deliver determinate answers in principle under deep uncertainty about long-term consequences. Its deliverable is **diagnostic clarity** for funders and practitioners facing high-stakes, long-term decisions:

  *   **The Paper:** Will provide a rigorous framework for assessing if a consequentialist ranking between interventions is *robust* or fundamentally *fragile* due to partition-dependence. It will articulate the conditions under which long-term cluelessness renders consequentialist verdicts indeterminate.
  *   **The Usable Product:** This analysis translates into a practical **sensitivity test**: When evaluating interventions based on expected long-term value, practitioners should ask: "How sensitive is this ranking to different plausible ways of categorizing or ordering the vast space of potential long-run outcomes?" If the ranking flips under reasonable repartitioning, the consequentialist verdict lacks foundation. This test highlights when consequentialism alone is insufficient and must be supplemented by other ethical considerations or decision rules. Funding this foundational work strengthens the theoretical underpinnings of any applied approach relying on consequentialist reasoning under deep uncertainty.
