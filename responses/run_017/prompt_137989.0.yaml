prompt: |-
  I write about risk-assessment tools in criminal justice for a national newspaper, which is apparently why a friend who convenes a cross-listed philosophy and public-policy course on probability, evidence and the state has now twice asked me to second-mark her problem sets. I don't have a doctorate, but I read these answers far more slowly than she does, and I've learned that a confident, well-organised answer can conceal a broken step for a long time. This one has been sitting on my desk for two days and I genuinely cannot settle on a mark, so I would like an outside read before I write anything in the margin. Please treat the question as fair and grade the answer as it stands.

  The question is below, followed by one student's response, reproduced verbatim apart from formatting. The rubric is 8 marks for part (a), 7 for (b), 5 for (c), 20 in total. I'd like a mark out of 20, a band (first, upper second, and so on), and a per-part mark with a comment for each part. What I actually need from you is not an impression of overall quality: I need to know which moves in the answer are load-bearing and correct, which merely sound sophisticated, and precisely where an inference fails to follow or where a term the question defines is used in a way that definition does not license. If the student reaches a defensible conclusion for a bad reason, or for a reason that depends on an assumption they never state, say that too. Please mark against the question that was set rather than against what a well-read student would standardly say about the reference class problem — I don't care whether the answer sounds like the literature. Finally, give me one or two sentences of feedback addressed to the student, the kind of comment that tells them what to repair next time without handing them the answer.

  QUESTION

  4. Risk and the reference class (20 marks)

  The Department of Correctional Analytics uses an actuarial instrument validated on a sample of 40,000 people released from custody. For any class C of people in the sample, let f(C) be the proportion of members of C who were rearrested within three years. Call a class *undivided* (relative to the sample) if no attribute recorded in the sample divides C into two subclasses with different rearrest rates.

  (a) [8 marks] The Department adopts a rule it calls Fixed-Order Narrowing (FON). Fix once and for all an ordering of the recorded attributes. For a new applicant, start with the whole sample, then work down the ordering adding attributes one at a time, and stop at the last class containing at least 250 members; output that class's f-value as the applicant's probability of rearrest. Does FON solve the reference class problem? In your answer, distinguish (i) the question which class one should use from (ii) the question whether there is any determinate probability of this applicant's being rearrested.

  (b) [7 marks] Applicant D is a 29-year-old man with two prior convictions who is employed at the time of assessment. In the sample: f(men with two prior convictions) = 0.44; f(men aged 25–34 with two prior convictions) = 0.61; f(men aged 25–34 with two prior convictions and employed at assessment) = 0.23. The Department's file does not report the sizes of these classes, or whether any of them is undivided. Which of these numbers, if any, is D's probability of being rearrested? What does your answer commit you to about what 'probability' means here?

  (c) [5 marks] A colleague remarks: the reference class problem is just the problem of induction wearing a lab coat — if the future resembles the past, the choice of class hardly matters, and if it doesn't, no class helps. Assess this remark.

  STUDENT'S ANSWER

  (a) FON does not solve the reference class problem, but it is on the right lines. Its defect is that it produces an answer by convention rather than by finding the right class: the output depends on the order in which the attributes happen to be listed and on the arbitrary cut-off of 250, and D belongs to indefinitely many classes with different frequencies, so nothing in the procedure selects one of them as the one that matters. That is the problem in form (i), the question of which class to use.

  But the defect is really a data problem. The correct rule is to use the narrowest class available, since a narrower class is more like D, and the probability we want is the frequency of rearrest among people relevantly like D. FON has to stop at 250 only because below that the frequency is too noisy to trust. With a large enough validation sample the stopping point moves later and later, and in the limit we reach the class of people who share all of D's causally relevant properties. That class is undivided in the sense of the question — no recorded attribute splits it into subclasses with different rates — so its rate is not an average over a mixture of different kinds of case, and is therefore D's probability rather than merely our best estimate of it. The reference class problem is thus an epistemological problem about how much data we can afford; the fact of the matter is there, and we simply cannot always reach it. As to (ii), there is a determinate probability, namely the frequency in the correct class. A strict frequentist who holds that probability is nothing but long-run relative frequency will add that there is no single-case probability over and above that; but that is a metaphysical position, and FON's conventions neither support nor undermine it either way. FON fails, but for the practical reason that it is forced to stop narrowing too early.

  (b) D's probability is 0.23. The correct class is the narrowest one that still yields a usable frequency, and the third class is undivided relative to the sample, so its rate applies uniformly to its members rather than averaging over dissimilar cases. The broader classes mislead precisely because they mix: 0.44 averages men of every age and employment status, 0.61 averages employed and unemployed men together, and the spread between 0.61 and 0.23 shows how much the mixing was hiding. Narrowing is monotonic in accuracy — every attribute we add makes the comparison class more like D, so each step can only bring us nearer the truth, and the fact that 0.61 lies further from 0.23 than 0.44 does is just a reminder of how coarse the broad classes were. Employment at assessment screens off the broader classes, so once we know that D is employed the other two numbers are irrelevant. And since the class is undivided, 0.23 is not merely our best estimate; it is D's chance of being rearrested.

  (c) The colleague is wrong. The problem of induction asks whether the regularities we have observed will continue. Grant, for the sake of argument, that they will: let 0.44, 0.61 and 0.23 be perfectly stable from year to year. It is still unsettled what D's probability is, because D falls in all three classes and they disagree. So the reference class problem is not the problem of induction; it is a problem about which of several equally well-confirmed regularities attaches to a single case. The colleague has mistaken a question about whether there are stable frequencies for a question about how they apply. Nothing in his remark touches our case at all.
reasoning: |-
  Okay, I need to evaluate this student's answer for a risk-assessment tool problem in criminal justice. The question has three parts, and I'll mark each based on the rubric: 8 for (a), 7 for (b), 5 for (c). 

  First, I'll assess part (a). The student argues that FON doesn't solve the reference class problem because it relies on arbitrary ordering and a sample size cutoff. They correctly identify that the class choice depends on convention, addressing point (i). For (ii), they claim a determinate probability exists in the narrowest class with all causally relevant properties. But here's the flaw: the question defines "undivided" as no recorded attribute divides the class into subclasses with different rates, not causally relevant properties. The student smuggles in an unstated assumption about causality, which the data doesn't support. Also, they misunderstand "undivided" as a property of ideal classes rather than actual sample-based classes. This conflation makes their solution for (ii) invalid. The practical limitation argument is reasonable but doesn't resolve the core philosophical problem. I'll deduct points for these errors.

  For part (b), the student picks 0.23 as D's probability, claiming the narrowest class is correct and undivided. But the question explicitly states the file doesn't report class sizes or undivided status. The student assumes the third class is undivided without evidence, and asserts narrowing always improves accuracy. However, adding attributes can sometimes make frequencies noisier or less reliable, contrary to their "monotonic accuracy" claim. The screening-off point is valid but doesn't justify calling 0.23 the "chance" rather than an estimate. They also misuse "undivided" again. This requires significant deduction.

  In part (c), the student correctly distinguishes the reference class problem from induction, pointing out that stable frequencies don't resolve which class applies to D. Their rebuttal is logically sound and addresses the colleague's conflation. Full marks here.

  Overall, the answer shows good structure but has critical errors in (a) and (b) where key terms are misapplied. The feedback should highlight these without giving solutions. Final mark: 11/20, upper second.
answer: |-
  ### Grading and Feedback  

  **Overall Mark:** 11/20  
  **Band:** Upper Second (2:1)  
  **Breakdown:**  
  - (a): 4/8  
  - (b): 2/7  
  - (c): 5/5  

  ---

  ### Part-by-Part Analysis  

  **(a) [4/8]**  
  - **Load-bearing and correct:** Correctly identifies that FON fails to solve (i) due to arbitrariness in attribute order/sample-size cutoff. Strong critique of convention-based output.  
  - **Sound but flawed:** Claims the "correct rule" uses the narrowest class to capture "relevantly like D" and asserts that narrowing converges to a class with "causally relevant properties." However, **this smuggles in an unstated assumption**: the question defines "undivided" strictly by *recorded attributes in the sample*, not causality or relevance. The inference that the limit class is "undivided" (as defined) is unsupported; the sample may lack attributes needed to ensure no further subdivision.  
  - **Critical failure:** Equates the "determinate probability" (ii) with the frequency of an idealized class. The question does not license this; "undivided" is sample-relative, not metaphysical. FON's practical limitations don't resolve (ii) — they sidestep whether a "true" probability exists.  
  - **Summary:** Good on (i), but overreaches on (ii) by conflating sample-defined "undivided" with an idealized causal class.  

  **(b) [2/7]**  
  - **Load-bearing error:** Asserts the third class (0.23) is D's probability because it is the "narrowest usable class" and "undivided." **This is unsupported:** the question states the file *does not report* class sizes or undivided status. The student assumes the class has ≥250 members and is undivided without evidence.  
  - **Misuses key terms:** Claims "narrowing is monotonic in accuracy," but adding attributes *can* introduce noise or spurious correlations (e.g., small subclasses). The spread between 0.61 and 0.23 *suggests* mixing, but without knowing if attributes are *causally* relevant, it doesn't prove 0.23 is "correct."  
  - **Incorrect inference:** States 0.23 is D's "chance," not merely an estimate, because the class is "undivided." Again, undivided status is not confirmed, and even if it were, "probability" here is explicitly sample-defined (*f(C)*), not ontological. Employment may "screen off" broader classes, but this depends on unverified causal structure.  
  - **Summary:** Selects a number based on unsupported assumptions, misapplies "undivided," and confuses frequency estimates with single-case probability.  

  **(c) [5/5]**  
  - **Load-bearing and correct:** Clearly distinguishes the problem of induction (stability of regularities) from the reference class problem (which regularity applies). Notes that even with stable frequencies, multiple conflicting classes exist for D.  
  - **Precise rebuttal:** Correctly observes the colleague conflates the *existence* of stable frequencies with their *application* to a single case. The remark’s irrelevance to the case is well-argued.  
  - **Summary:** Defensible, logically sound, and directly addresses the prompt.  

  ---

  ### Feedback to Student  
  Your analysis in (a) and (c) shows strong conceptual grasp, but in (a) you imported assumptions about causality not licensed by the question’s definitions. In (b), you assigned a specific probability without verifying if the class met the criteria (size/undivided status), and overstated the epistemic status of the estimate. Next time, rigorously anchor claims to the given definitions and explicitly note where evidence is missing.
