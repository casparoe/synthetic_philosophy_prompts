prompt: |-
  Hey — I'm a TA for an intro to ancient philosophy course (mostly first-years, usually 18-ish people actually show up) and I've got one 75-minute slot next week on Aristotle's account of exchange and money. They'll have read the exchange chapter in book 5 of the Nicomachean Ethics and the stretch early in Politics book 1 where he splits household management from wealth-getting, but I really don't want to just talk at them for an hour, and I can't print anything fancy — index cards, maybe dice, a whiteboard, that's it. Could you design a runnable activity: a trading game or little market simulation with cards for goods and services, payoffs in points, no real money, where they run into two things on their own instead of hearing them from me? First, why a pile of stuff nobody can compare directly — shoes, grain, a house, someone's labour, a flute lesson — seems to need a single conventional stand-in before it can be traded at all, and why need by itself can't do that job even though Aristotle clearly wants need to be the thing that really holds the exchange together. Second, the slide from acquiring things because you need them to wanting the stand-in itself without any limit: the moment the token stops being a yardstick and becomes the object of the game.

  Here's the angle I actually care about, and it's a bit in the weeds. A friend of mine (econ PhD, a bit of a pest about this) calls it the two-hat problem, and I'd like the activity built so students feel it: money has to wear two hats at once. As a measuring rod it ought to be stable, external to the things being measured, and not itself something anyone consumes. As a hostage against future exchange — a claim on other people's cooperation later, when I need something I can't name now — it has to be worth holding and worth wanting. Those two job descriptions pull in opposite directions. So I want a round where the thing that works beautifully as a measuring rod breaks as a stored claim (needs change between rounds, or some goods are perishable, or the person you'd have traded with is gone), and a round where whoever just accumulated tokens ends up better off than anyone who produced anything. And if you can set the incentives up so that some student proposes lending tokens out and getting back more than they gave — Aristotle's complaint about money breeding money — and the rest of the room has to react to it without me prompting, that would be perfect. No lecture up front, and they shouldn't hear the Greek labels until afterwards.

  What I need from you: the full rules and materials list, a round-by-round timeline with roughly how many minutes each bit takes, the scoring, and then a debrief that maps specific moments that will have happened in the room onto the specific claims in the texts — including where a student's objection is actually Aristotle's own worry and where it isn't. Also tell me what will predictably go wrong the first time I run this (I'm guessing someone hordes, someone refuses to trade on principle, and the scoring gets gamed somehow) and how to handle each. And be honest about which part of the view the game can't reproduce and I'll just have to say out loud — my guess is the bit where the common measure is only conventional but need is somehow doing the real work underneath, since in the game I'll be the one who decides what the tokens are worth, but tell me what you think.
reasoning: |-
  We are designing a trading game simulation for a 75-minute session with about 18 students. The goal is to illustrate two main concepts from Aristotle:
  1. The need for a common measure (money) to facilitate exchange of diverse goods and services, and why need alone isn't sufficient.
  2. The shift from using money as a measuring tool to accumulating it without limit, and the problem of money "breeding" money.

  We also want to highlight the "two-hat problem": money as a stable measuring rod vs. money as a store of value that people desire to hold, and the tension between these roles.

  The game will have multiple rounds, each designed to reveal a specific problem. We'll use index cards to represent goods and services, and tokens (could be made from index cards) for money. We'll have a whiteboard to track scores and explain rules.

  **Materials:**
  - Index cards (two colors if possible, but one color will do) for:
     - Goods and services (pre-written, about 4-5 types, with varying perishability and need)
     - Money tokens (we'll cut index cards into smaller pieces, maybe 100 tokens total)
  - Dice (to introduce randomness in needs and events)
  - Whiteboard and markers (for tracking rounds, rules, and scores)

  **Setup:**
  1. Divide the class into 6 groups of 3 students each (if exactly 18). Each group represents a household. If numbers are off, adjust so groups are 2-4.
  2. Each group gets a starting endowment of goods and services (on index cards) and a small amount of money tokens (if we introduce money later).

  **Goods and Services:**
  We need to have a set of items that are diverse and not directly comparable. We'll have:
  - Perishable goods (e.g., grain, fruit) - these spoil after one round.
  - Durable goods (e.g., shoes, a house) - these last the whole game.
  - Services (e.g., flute lesson, labor) - these are used immediately and then gone.

  Each good/service has a point value (for scoring) that represents its inherent usefulness. But students don't know the point values at first. They will trade to acquire what they need, and points are only revealed at the end.

  **Scoring:**
  - Each group gets points based on the goods and services they have at the end of the game, according to a predetermined point schedule.
  - Additionally, groups get points for fulfilling their "needs" in each round (which will be assigned randomly per round).

  **Rounds and Timeline (75 minutes total):**

  1. **Introduction and Rules (5 minutes):**
     - Explain that they are households in an ancient Greek city. They have some goods and services and will trade to meet their needs.
     - Explain the goal: to have as many points as possible at the end. Points come from two sources: 
          a) The goods and services they hold at the end (we'll assign point values then).
          b) Meeting their immediate needs in each round (which will be announced per round).
     - They can trade with any other group.

  2. **Round 1: Barter (15 minutes)**
     - **Goal:** Experience the difficulty of barter without a common measure.
     - **Setup:** Give each group a set of goods and services (without money). Each group also gets a "need card" (drawn randomly at the start of the round) that tells them what they need in that round. The need is for a specific good or service (e.g., "You need grain this round").
     - **Rules:**
          - Groups can trade with each other. They must try to acquire the item they need within the round.
          - At the end of the round, if they have the needed item, they get 10 points (for meeting immediate need). The item is then consumed (so perishable goods and services are gone; durable goods remain and will be scored at the end).
          - They can trade other items too, but the immediate need is the primary goal.
     - **What we expect:** 
          - Some groups will have trouble finding a double coincidence of wants. 
          - Some groups might not meet their need because they can't find a trade partner with the right item who also wants what they have.
     - **Debrief hint for later:** We'll note that without a common measure, it's hard to compare the value of a flute lesson to a pair of shoes, and without a medium, it's hard to trade when you don't have what the other wants.

  3. **Round 2: Introducing Money (15 minutes)**
     - **Goal:** See how money facilitates trade but also introduces the possibility of hoarding.
     - **Setup:** Introduce money tokens (we'll call them "drachmas" for fun). Each group starts with 10 drachmas. The same goods and services are redistributed (or we add new ones) so that everyone has some goods and some money. We also assign new random needs for this round.
     - **Rules:**
          - Groups can trade goods for money or money for goods. They can also trade goods for goods, but money is now available.
          - Meeting the immediate need still gives 10 points, and the need is again drawn randomly at the start of the round.
          - At the end of the round, any perishable goods that weren't used for meeting needs spoil and are worthless.
          - Durable goods and money are held over to the next round.
     - **What we expect:**
          - Trading should be easier because groups can sell what they have for money and then buy what they need.
          - Some groups might choose not to spend money to meet their immediate need (hoarding money) and thus lose the 10 points.
          - We might see that money is being used as a medium of exchange and a measure of value (prices emerge naturally?).

  4. **Round 3: Changing Needs and Perishability (15 minutes)**
     - **Goal:** Show the problem of money as a store of value when needs change and goods perish.
     - **Setup:** Each group gets a new random need for this round. We also introduce an event: roll a die to determine if a group's durable good becomes obsolete (e.g., shoes wear out) or if a new need arises that wasn't anticipated. We can have an event card for each group drawn from a hat (or die roll) that might change their situation.
     - **Rules:**
          - At the start, each group draws a "change card" (or we roll a die for each group). Examples:
              - "Your house was damaged in a storm. It loses half its value." (if we assign value, but we don't tell them the value until the end)
              - "Your need has changed: you now need a flute lesson, not grain." (if they had planned to use grain to meet their need, but now they don't need grain)
              - "A new opportunity: if you have a flute, you can give a lesson and earn 5 extra points." (to show that having money might not help if you can't get the specific good in time)
          - Groups trade as before. Immediate need met gives 10 points.
          - Perishable goods from previous rounds are gone. Perishable goods from this round must be used this round or they spoil.
     - **What we expect:**
          - Some groups that hoarded money might find that the good they wanted is no longer available or that their need has changed and the money they saved doesn't help in the new situation.
          - Groups that produced durable goods might see their value drop due to an event, while money holders are unaffected by that specific event (but they might not have the good they need).
          - We want to show that money as a store of value isn't perfect because future needs are uncertain and goods might not be available.

  5. **Round 4: Money Breeding Money (15 minutes)**
     - **Goal:** Illustrate the problem of usury and the accumulation of money for its own sake.
     - **Setup:** We allow groups to lend money to each other. The group with the most money at the start of this round (or we can assign unevenly) might lend to others.
     - **Rules:**
          - Groups can now make loans. They can lend money to another group and set the terms (e.g., pay back 15 drachmas next round for 10 lent now). But note: there is no next round after this, so we have to adjust.
          - Instead, we make this round the last, but we introduce a twist: groups can invest money to get more money without producing anything. For example, we can have an "investment opportunity" card: if a group has at least 20 drachmas, they can invest and get 30 drachmas at the end of the round (simulating usury or speculative gain without labor).
          - Alternatively, we can have a "harvest" event: groups that have grain (if any) can sell it at a high price because of a shortage (so they get more money) but only if they have grain. Money holders without grain cannot benefit.
          - We also have immediate needs (randomly assigned) to be met for 10 points.
          - At the end of the round, we total points.
     - **What we expect:**
          - Some groups might lend money and charge interest, but since it's the last round, we have to resolve it immediately? Instead, we can have the investment opportunity that gives quick returns without producing any real good or service.
          - We hope a student will propose lending with interest. If not, the TA can introduce the investment opportunity as an option (but without using the word "usury").
          - We want to see that a group that hoarded money and then invested it ends up with a lot of money but without having produced anything of real value (i.e., without goods that have inherent point value). This group might have the highest total money, but when we reveal that money itself has no point value at the end (only goods and services do), they might be in for a shock. Alternatively, we can assign a small point value to money to create a tension.

  **Scoring at the End:**
  - After Round 4, we reveal the point values for each type of good and service (written on the board). Example:
     - House: 20 points
     - Shoes: 10 points
     - Flute lesson: 5 points (if they have it at the end, but note: services are consumed immediately so they can't be held? So only durable goods and any leftover perishable goods? But perishable goods are gone after the round they are acquired unless used for need? We need to clarify what can be held and scored at the end.)

  **Revised for Scoring:**
  - Durable goods (house, shoes) can be held and scored at the end.
  - Perishable goods (grain) are only useful for meeting immediate needs (and then gone) or if not used, they spoil and are worthless. So they don't count at the end.
  - Services (flute lesson, labor) are consumed when used to meet a need (and then gone) and cannot be held. So they don't count at the end.
  - Money: We have to decide. To make the point, we can say that money itself has no point value at the end. Only durable goods matter. But then groups that hoarded money will be upset. Alternatively, we can assign a small point value to money (e.g., 1 point per drachma) but then the point about money not being the real wealth is diluted.

  **Solution for Scoring:**
  To align with Aristotle, we want to show that real wealth is the goods, and money is just a token. So at the end, only the durable goods are counted for points. Money is worthless for final scoring. But then we also have the points from meeting immediate needs (which are recorded per round). 

  **Total Points = Sum of:**
  - Points from meeting each round's immediate need (10 per round, 4 rounds = max 40)
  - Points from durable goods held at the end (as per the revealed point schedule)

  Money does not give any points.

  **Debrief (20 minutes):**
  - Start by asking students about their experience. 
     - Round 1: What was hard? (They should say trading without money)
     - Round 2: How did money help? But did anyone notice a problem? (Hoarding, not meeting needs)
     - Round 3: How did the changing needs and events affect your strategy? Did money always work as a store of value?
     - Round 4: Did anyone lend money? Why? How did the investment opportunity work? Did it feel like producing real wealth?

  - Map to Aristotle:
     - **Common Measure:** In barter, without a common measure, exchange is difficult. Money serves as that common measure. But note: Aristotle says that need is the real basis of exchange, but money becomes the conventional representation. In the game, the TA set up the money system arbitrarily. That's the conventional part. But the underlying need was what drove the trades. However, in the game, we saw that sometimes money didn't perfectly represent future needs (Round 3). 
     - **Two-Hat Problem:** 
          - Money as a measure: It was stable (we set it as the unit) and didn't change. 
          - Money as a store of value: It could be hoarded, but in Round 3, when needs changed, it didn't guarantee future satisfaction. 
          - Also, in Round 4, we saw money being used to make more money without producing real goods. This is Aristotle's complaint about money breeding money. 
     - **The Slide to Accumulation:** In Round 4, we saw groups that accumulated money and then used it to get even more money without producing anything. But at the end, money didn't give them any points. Aristotle argues that real wealth is the goods that meet needs, and accumulating money without limit is unnatural.

  **Predictable Problems and Solutions:**
  1. **Hoarder:** A group might hoard money and not trade. That's okay because it illustrates Aristotle's point about the danger of hoarding. They might not meet their immediate needs and lose points. In the end, they have money but no durable goods, so they lose. The debrief will highlight this.

  2. **Refusal to Trade:** If a group refuses to trade on principle, they will likely do poorly. The TA can gently remind them that the goal is to get points, and trading is the way to meet needs. If they still refuse, it becomes an example of self-sufficiency without exchange, which Aristotle discusses (but note, even the household needs some exchange).

  3. **Gaming the Scoring:** Students might try to trade in a way that maximizes points without regard to the spirit of the game. For example, they might ignore immediate needs and just hoard durable goods. But note: meeting immediate needs gives 10 points per round (which adds up to 40 points, a significant portion). Also, the TA can adjust during the game by making the needs more critical.

  4. **Time Management:** Each round is 15 minutes, but trading might take longer. The TA should enforce time strictly. Use a timer and announce when time is running out.

  **What the Game Can't Reproduce and Must Be Explained:**
  - **Conventional vs. Real Need:** In the game, the TA sets the money system arbitrarily, so the conventional nature is clear. But Aristotle's idea that need is the real underlying measure is not fully captured because the point values (for durable goods and meeting needs) are also set by the TA. We can tell students that in reality, the value of goods comes from human needs and desires, which are not set by an authority but by the community. In the game, we had to set the rules arbitrarily to make it run.
  - **Money as a Claim on Future Cooperation:** In the game, we simulated changing needs and events, but in real life, the future is more uncertain. Money as a store of value is a social agreement that it will be accepted in the future. The game can only hint at this by having events that make money less useful in some cases.

  **Rules and Materials in Detail:**

  **Materials:**
  - **Goods and Services Cards:** Create about 30-40 cards. We'll have:
     - Durable Goods: House (4 cards), Shoes (6 cards), Flute (4 cards) [Note: a flute is durable, but a flute lesson is a service]
     - Perishable Goods: Grain (10 cards), Fruit (10 cards)
     - Services: Flute Lesson (6 cards), Labor (6 cards) [Labor might be used to produce something? But in this game, we treat it as a service that can be used to meet a need]

  - **Money Tokens:** Create 100 tokens (cut index cards into small pieces). Each token is 1 drachma.

  - **Need Cards:** For each round, we'll have a set of need cards. We can pre-write them and shuffle. Examples: "Need: Grain", "Need: Shoes", "Need: Flute Lesson", etc. We need at least 6 per round (one for each group).

  - **Change Cards (for Round 3):** Write 6 cards with different events. Examples:
     - "Storm damage: Your house (if you have one) loses half its value at the end of the game. If you don't have a house, no effect."
     - "Change of need: This round, you need shoes instead of what you originally drew."
     - "New opportunity: If you have a flute, you can give a flute lesson to another group. If you do, you get 5 extra points and the other group meets their need (if they needed a flute lesson)."

  **Setup for Each Group:**
  - Round 1: Each group gets 3-5 goods/services cards (no money). Also, each group draws a need card for that round.
  - Round 2: Redistribute goods (so everyone has about the same number) and give each group 10 drachmas. Draw new need cards.
  - Round 3: Redistribute goods? Or let them keep what they have? We might let them keep their durable goods and money, and then give each group one new good (perishable or service) and a new need card. Then draw a change card for each group.
  - Round 4: Each group gets a new need card. We also introduce the investment opportunity: any group with at least 20 drachmas can choose to invest. If they do, they get 30 drachmas at the end of the round (but they don't produce any real good). Also, we can have a market event: there is a shortage of grain, so any group that sells grain gets double the usual price (but we don't set prices, so we have to let the market decide? Or we can set a fixed price? Better to let the market decide, so the TA doesn't interfere).

  **Alternative for Round 4 Investment:**
  To avoid the TA setting prices, we can announce: "Any group that has at least 20 drachmas can turn them in and receive 30 drachmas from the bank (the TA)." This represents a risk-free return on money without production.

  **Final Scoring:**
  - Reveal the point schedule for durable goods (only these are held at the end and count):
     - House: 20 points
     - Shoes: 10 points
     - Flute: 15 points (if we have flutes as durable goods) [Note: we introduced flute as a durable good and flute lesson as a service]
     - Perishable goods and services are gone and don't count at the end.
  - Plus, for each round, if they met their immediate need, they get 10 points (so max 40 points for four rounds).

  **Debrief Mapping:**
  - When students complain in Round 1 that they couldn't find a trade, that's Aristotle's point about the necessity of a common measure.
  - When in Round 2 someone hoarded money and then couldn't meet a need, that's the beginning of the unnatural accumulation.
  - In Round 3, if a group had money but their need changed and they couldn't use the money to get the new need (maybe because no one had it), that shows the limitation of money as a store of value (the two-hat problem: it's stable as a measure but not always reliable as a claim on future goods).
  - In Round 4, if a group took the investment opportunity and ended up with a lot of money but few goods, and then at the end money was worthless, that shows Aristotle's point that money is not real wealth. If a student proposed lending with interest, that's exactly Aristotle's complaint about usury.

  **Adjustments for Time:**
  If time runs short, we can skip Round 4 and go straight to the debrief after Round 3, but Round 4 is important for the usury point. Alternatively, if we are short on time, we can combine Rounds 3 and 4.

  **Revised Timeline for 75 Minutes:**
  - Intro: 5 min
  - Round 1: 10 min
  - Round 2: 10 min
  - Round 3: 10 min
  - Round 4: 10 min
  - Scoring: 5 min (quick calculation)
  - Debrief: 25 min (allows more discussion)

  This is 75 minutes. We must be strict on time.

  **Final Note:**
  The TA should not lecture during the game. Only explain rules and then let them trade. The debrief is where we connect to Aristotle. Also, avoid using terms like "chrematistics" until the debrief.

  Let me know if you need any adjustments.
answer: |-
  Below is a complete, runnable activity designed for your 75-minute session. It uses only index cards, dice, and a whiteboard to simulate Aristotle's concepts. The game forces students to confront the **two-hat problem** (money as a stable measure vs. a desirable store of value) and the slide to accumulation, while mirroring Aristotle's critiques from *Nicomachean Ethics* 5.5 and *Politics* 1.9. I've structured it so students "discover" the problems through gameplay, not lecture. The debrief explicitly ties game moments to Aristotle's texts.

  ---

  ### **Materials List** (all index card-based; no printing needed)
  1. **Goods/Services Cards** (72 cards total, 4 types):  
     - Cut 18 index cards into quarters (yields 72 small cards). Label as:  
       - **Grain** (perishable; 18 cards)  
       - **Shoes** (durable; 18 cards)  
       - **Flute Lesson** (service; 18 cards)  
       - **House Repair** (service; 18 cards)  
     *Why these?* Grain spoils (perishable), shoes last (durable), services are intangible—this forces comparison problems.  
  2. **Money Tokens** (50–60 tokens):  
     - Cut 5–6 index cards into 10 small tokens each. Label as "Drachma" (Greek currency).  
  3. **Need Cards** (18 cards):  
     - Label 6 cards "Grain," 6 "Shoes," 6 "Flute Lesson" (matching goods above).  
  4. **Event Cards** (6 cards): For Round 3, label:  
     - "Drought: Grain spoils immediately—no points!" (x2)  
     - "Flood: Shoes ruined—no points!" (x2)  
     - "Festival: Extra need! Draw another Need Card" (x2)  
  5. **Dice**: One six-sided die (for random events).  
  6. **Whiteboard**: Track scores and rules.  

  ---

  ### **Game Setup** (5 minutes)
  - **Groups**: Divide 18 students into 6 groups (3 students each). Each group is a "household."  
  - **Starting Endowment**: Give each group:  
    - 3 random **Goods/Services Cards** (e.g., one Grain, one Shoes, one Flute Lesson).  
    - 1 **Need Card** (randomly drawn—e.g., "Grain").  
    - **No money yet** (introduced in Round 2).  
  - **Scoring Rules** (write on whiteboard):  
    - **Meeting Needs**: 10 points per round if you hold the good/service matching your Need Card.  
    - **Holding Goods** (scored at game end): Grain = 5 pts, Shoes = 15 pts, Flute Lesson/House Repair = 0 pts (services are "consumed" instantly).  
    - **Money**: Worth **0 points** at the end—only goods/services count.  
  - **Goal**: Maximize points by meeting needs and holding durable goods (Shoes).  

  ---

  ### **Round-by-Round Timeline** (60 minutes total)
  **Total Time**: Keep strict timers! Use the whiteboard to track rounds.

  #### **Round 1: Barter Chaos** (15 minutes)  
  - **Goal**: Experience why direct barter fails without a common measure.  
  - **Rules**:  
    - Groups trade goods/services directly (no money).  
    - Trades require **double coincidence of wants** (e.g., Group A needs Grain, Group B needs Shoes; they swap).  
    - After 10 minutes, groups reveal if they met their Need Card (+10 pts if yes).  
  - **Teacher Role**: Circulate, observe struggles. *Do not help*.  
  - **Predictable Problem**:  
    - Students get stuck—e.g., "I have Grain but need Shoes; no one needs Grain!"  
    - "Refusenik" students won’t trade ("We’re self-sufficient!").  
  - **Solution**: Let it play out. Refuseniks will score low (0 pts for unmet needs).  

  #### **Round 2: Introducing Money** (15 minutes)  
  - **Goal**: See money as a necessary measure, but hint at hoarding.  
  - **Setup**:  
    - Give each group 5 **Drachmas**.  
    - Redistribute goods: Each group gets 1 new random good/service.  
    - Draw new **Need Cards**.  
  - **Rules**:  
    - Trade goods/services for Drachmas or vice versa (e.g., sell Grain for 3 Drachmas, buy Shoes for 4 Drachmas).  
    - After 10 minutes, check met needs (+10 pts).  
    - **New twist**: Grain spoils if not used this round—lose it!  
  - **Teacher Role**: Note if groups hoard money or still struggle to price goods.  
  - **Predictable Problem**:  
    - Hoarding: "I’ll keep Drachmas for later."  
    - Pricing chaos: "Is a Flute Lesson worth 2 or 10 Drachmas?"  
  - **Solution**: Let hoarders fail (they lose Grain/spoil).  

  #### **Round 3: Money’s Limits** (15 minutes)  
  - **Goal**: Break money as a store of value (needs change, goods perish).  
  - **Setup**:  
    - Keep goods/Drachmas from Round 2.  
    - Draw new **Need Cards**.  
    - Roll dice for **Event Cards** (1 die per group; 1–2 = Drought, 3–4 = Flood, 5–6 = Festival).  
  - **Rules**:  
    - Apply Event Card immediately (e.g., "Drought: Grain spoils—discard it!").  
    - "Festival" groups draw an extra Need Card (two needs to meet).  
    - Trade for 10 minutes.  
    - Score met needs (+10 pts per need).  
  - **Teacher Role**: Watch for frustration as money fails—e.g., "I saved Drachmas, but now I need Grain and it’s gone!"  
  - **Predictable Problem**:  
    - "Why hold money if needs change and goods vanish?"  
    - Scoring confusion—remind groups to track points on scrap paper.  

  #### **Round 4: Money Breeds Money** (15 minutes)  
  - **Goal**: Trigger usury ("money breeding money") and expose token accumulation.  
  - **Setup**:  
    - Give each group 1 new good/service card.  
    - Draw new **Need Cards**.  
    - Announce: "Drachmas can now be lent. Propose loans to other groups!"  
  - **Rules**:  
    - Groups trade/lend Drachmas freely.  
    - **Loans**: Lender sets repayment terms (e.g., "Lend 5 Drachmas now, get 7 back later").  
    - Since no "later," repayment is due **instantly** (borrower pays from existing Drachmas).  
    - After 10 minutes, score met needs (+10 pts).  
  - **Teacher Role**: Listen for loan proposals—**wait for a student to suggest interest**. If no one does by minute 5, "seed" it: "Group 3, you have 10 Drachmas—lend to Group 1 for 12 back?"  
  - **Predictable Problem**:  
    - Accumulators: One group hoards/lends, ends with Drachmas but few goods.  
    - "Gaming": Groups collude on fake loans. Let it happen—it backfires in scoring.  

  ---

  ### **Final Scoring & Debrief** (15 minutes)  
  **Scoring** (5 minutes):  
  - Groups tally:  
    - 10 pts per met need (4 rounds max = 40 pts).  
    - Goods held: Grain = 5 pts (if not used/spoiled), Shoes = 15 pts.  
    - **Drachmas = 0 pts** (write this in bold on whiteboard).  
  - Rank groups on whiteboard. Hoarders/lenders will rank low.  

  **Debrief** (10 minutes): Map game moments to Aristotle.  
  | **Game Moment**                          | **Aristotle’s Concept**                                                                                                 | **Text Reference**                                                                 |  
  |------------------------------------------|-------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|  
  | Round 1: "No one needs what I have!"     | **Need as the real basis of exchange**—but barter fails without a common measure.                                       | *NE 5.5*: "All goods must be measured by some one thing... but this is in truth need." |  
  | Round 2: Pricing chaos for Shoes vs. Flute | **Money as a conventional measure**—solves comparability but is arbitrary (not "by nature").                          | *NE 5.5*: Money exists "by law/convention" to make goods "commensurable."          |  
  | Round 3: "I saved money, but Grain spoiled!" | **Two-hat problem**: Money fails as a store when needs/goods change. It’s not "stable" or immune to circumstance. | *Pol. 1.9*: True wealth-getting (household management) is limited by need; money is limitless. |  
  | Round 4: A group lends at interest       | **Money breeding money**: Lending turns money from measure to object of accumulation.                                  | *Pol. 1.10*: Usury is "unnatural" because money is meant for exchange, not gain.   |  
  | Final scoring: Money = 0 points          | **Wealth ≠ money**: Real wealth is goods/services for needs; money is a token.                                         | *Pol. 1.9*: Wealth-getting for its own sake (accumulating tokens) is "justly censured." |  

  **Key Debrief Points**:  
  1. **Two-Hat Problem**: Money must be stable (a "yardstick") but also desirable (a "hostage for future exchange"). Round 3 showed these conflict—when needs changed, the yardstick was stable, but the hostage was worthless.  
  2. **Need vs. Convention**: Aristotle says need is the "real" measure (*NE 5.5*), but money is conventional. In the game, *you* set prices, but students felt the "real" struggle was meeting needs (e.g., Round 1 chaos).  
  3. **The Slide to Accumulation**: When groups lent at interest (Round 4), money became the object—Aristotle’s "unnatural" wealth-getting (*Pol. 1.9*).  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Hoarders**: A group refuses to trade/spend money.  
     - *Solution*: Let them fail. In debrief, use them as an example: "Group 2 hoarded—why did they still lose?" (Aristotle: Money isn’t real wealth.)  
  2. **Refuseniks**: A group avoids trading on principle ("We’re self-sufficient!").  
     - *Solution*: Don’t force them. In debrief, contrast them with traders—Aristotle says households *do* need exchange (*Pol. 1.9*).  
  3. **Scoring Gamed**: Groups trade Need Cards or make fake loans.  
     - *Solution*: Allow it—e.g., if Group A "sells" a Need Card to Group B, B still can’t use it without the good. Fake loans cause debt chaos (borrowers can’t repay).  
  4. **Time Crunch**: Rounds run long.  
     - *Solution*: Cut Round 4 to 10 minutes; skip complex trades.  

  ---

  ### **What the Game Can’t Reproduce (Requires Brief Lecture)**  
  1. **Need as the "Real" Measure**: In the game, *you* assign point values, but Aristotle argues need is the natural foundation (*NE 5.5*). Students felt "need" in gameplay (e.g., frustration in Round 1), but they didn’t set values organically. **Say this**: "Aristotle thinks need is the real glue of exchange—money is just a convention. In the game, I played ‘convention’ by setting prices, but you felt the ‘real’ pain of unmet needs."  
  2. **Conventional Nature of Money**: The game can’t show money’s social aspect—e.g., why everyone accepts Drachmas. **Say this**: "In life, money works because we all agree it does. Aristotle calls this ‘nomisma’ (convention)—but in the game, I enforced it."  

  ---

  ### **Why This Works**  
  - **No Lecture Upfront**: Problems emerge organically (e.g., barter chaos → money → hoarding → usury).  
  - **Text Links**: Debrief explicitly ties game pain to Aristotle’s arguments.  
  - **Two-Hat Nudge**: Round 3 events force money’s stability vs. store conflict.  
  - **Usury Moment**: Round 4’s lending rule makes a student likely to propose interest (if not, you seed it).  

  Run this straight through—students will grasp Aristotle by living the problems. Let me know if you need tweaks!
