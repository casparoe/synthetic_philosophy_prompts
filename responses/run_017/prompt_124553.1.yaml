answer: |-
  You've pinpointed a profound tension within Aquinas's text concerning the nature of legitimacy and resistance. Let's break down the logic step-by-step and apply it rigorously to your scenario of a constitutionally installed tyrant.

  ### Step-by-Step Reconstruction of Aquinas's Argument

  1.  **Objection 3's Challenge:**
      *   **Premise:** Delivering a multitude from tyrannical rule is praiseworthy (a virtuous act).
      *   **Observation:** Achieving this usually requires "dissension" (division, conflict) within the multitude, as one faction supports the tyrant and another opposes him.
      *   **Conclusion:** Therefore, this dissension (which falls under the definition of sedition) cannot be a mortal sin in this case. It can be licit or even obligatory.

  2.  **Aquinas's Core Definition (Body of the Article):**
      *   **Sedition Defined:** Contrary to the *unity* of the multitude (people of a city/kingdom).
      *   **Unity Defined (via Augustine):** Not just any crowd, but an assembly united "in fellowship recognized by law and for the common good." This unity is specifically the unity *of law and common good*.
      *   **Essential Opposition:** Sedition opposes this specific unity (law + common good). Therefore, sedition is *inherently* opposed to justice and the common good.
      *   **Genus & Gravity:** By its very nature (genus), sedition is a *mortal sin* because it attacks the fundamental basis of political society (law + common good). Its gravity increases with the importance of the common good attacked.
      *   **Key Distinction:** Only those who *initiate* the disturbance against the *legitimate* unity (law + common good) are guilty of sedition. Those who *defend* the legitimate common good against such attackers are *not* seditious. (Analogy: Self-defense isn't brawling).

  3.  **Reply to Objection 3:**
      *   **Tyranny Defined:** A tyrannical government is "not just" because it is "directed, not to the common good, but to the private good of the ruler" (citing Aristotle).
      *   **The Dissolution:** The objection wrongly assumes the tyrannical ruler *represents* the true unity based on law and common good. Aquinas argues:
          *   Tyranny, by definition, *lacks justice* because it abandons the common good for private good.
          *   Therefore, the tyrant *is not upholding* the true unity (law + common good) that defines the "people." He has *already undermined* that unity by perverting the law and the purpose of government.
          *   Consequently, resistance aimed at *restoring* the common good and *true* legal order is *not* an attack *on* the legitimate unity. It is *defense* against the tyrant's *prior attack* on that unity. The tyrant's faction, by upholding the regime oriented towards private good, is the party *actually disturbing* the true unity (law + common good).

  ### Applying Aquinas to Your Scenario: The Constitutional Tyrant

  1.  **Does prosperity/support/efficiency defeat the "private good" claim?**
      *   **No.** Aquinas's criterion is the *final cause* or *directedness* of the government. Is its *primary purpose* and *actual operation* aimed at the *common good* (the good of all members of the community) or the *private good* of the ruler (or ruling clique)?
      *   Any prosperity, efficiency, or support achieved is *incidental* if the *purpose* is private enrichment and power consolidation. It might be a side-effect, a necessary concession to maintain control, or even a tool of manipulation ("bread and circuses").
      *   The systematic redirection of state machinery for personal enrichment, protection of loyalists from accountability, and suppression of opposition using emergency powers are *prima facie* evidence that the regime is directed towards *private good*, regardless of other outcomes. The *intent and primary effect* matter most.

  2.  **Who are the seditious party? The Ruler's Faction or the Resistors?**
      *   **Aquinas's Logic:**
          *   The "people" is defined by fellowship under law *for the common good*. This is a *normative* and *teleological* definition, not merely a formal, legalistic one.
          *   The ruler, though constitutionally installed, has ceased to govern *for* the common good and now governs *for* private good. By doing so, he has *broken the fellowship defined by law for the common good*. He has become an *internal threat* to the true unity of the people.
          *   The ruler's faction, by actively supporting this perversion of the state's purpose – using the legal apparatus to enable private enrichment, shield corruption, and suppress dissent – is *actively upholding an order opposed to the true unity (law + common good)*. They are *disturbing* the fundamental basis of political society.
          *   The resistors, appealing to the *original constitutional purpose* (the common good) and seeking to *restore* governance directed towards it, are acting *in defense* of the true unity defined by law and common good.
      *   **Conclusion:** On Aquinas's terms, *the ruler and his enforcers are the true authors of sedition.* They are the faction disturbing the true unity of the people (law + common good) by perverting the government's end. The resistors, acting to restore governance for the common good, are the party *defending* the common good and *withstanding the seditious party* (the tyrant's faction). They are not guilty of sedition; they are resisting it.

  ### The Crucial Gap in Aquinas's Text

  While Aquinas's framework provides powerful tools to condemn the constitutional tyrant and justify resistance as defense against sedition, his text **critically underdetermines** a key practical question:

  *   **Who authoritatively determines that a ruler has ceased governing for the common good and is now governing for private good?** Aquinas assumes this is an objective fact discernible by reason. However, in your scenario:
      *   The ruler *controls* the formal legal apparatus and defines "legality."
      *   The ruler claims (and may have some evidence like prosperity/popular support) to *be* serving the common good, dismissing critics as traitors or self-interested factions.
      *   The resistors claim the ruler has fundamentally perverted the state's purpose.

  **Aquinas provides no institutional mechanism or clear epistemological standard within this passage for definitively settling this conflict of interpretation.** He relies on the objective nature of justice and the common good, but the *application* in a contested situation is fraught. He implies it's knowable to "wise men" (via Augustine's definition), but this is abstract.

  **The Gap:** Aquinas lacks a clear distinction or process to determine *when* a ruler possessing formal title has *sufficiently* abandoned the common good for private good such that resistance shifts from being seditious to being a defense against sedition. He provides the *theoretical justification* ("directed to private good") but not the *practical criterion* or *arbiter* for making this judgment in a complex, contested political reality.

  ### Closing the Gap: Needed Distinctions

  To resolve this ambiguity within the Thomistic framework, further distinctions are essential:

  1.  **Degrees of Tyranny:** Not every abuse is full-blown tyranny justifying sedition-as-defense. Aquinas hints at gravity ("surpasses the private good"). A threshold needs definition: *When does the pursuit of private good become so systematic, pervasive, and destructive of the fundamental conditions for the common good (justice, accountability, participation) that it voids the ruler's moral authority?*
  2.  **Objective Criteria:** Beyond "directed to private good," concrete indicators are needed. Your examples (systematic looting, suspension of accountability, weaponization of emergency powers against opposition) are strong candidates. Aquinas might add: suppression of just laws, denial of basic rights essential for human flourishing within the community, waging unjust wars for personal glory/wealth.
  3.  **The Role of the "Multitude":** While Aquinas mentions the "multitude" being divided, he doesn't elaborate on *who within* the multitude has the moral standing or practical ability to make the determination that tyranny exists and authorize resistance. Is it a majority? A representative body? Lesser magistrates? A critical mass of the wise and virtuous? This lack of agency is a major gap.
  4.  **Appeal to Higher Law/Authority:** Aquinas implies an appeal to the normative concept of the common good and justice transcending positive law. Later thinkers (e.g., Suárez, Bellarmine, Locke) would develop this into explicit appeals to natural law and the (real or virtual) consent of the community against a ruler violating the fundamental purpose of government. This provides a theoretical basis for the resistors' claim to represent the true "people" and common good against the perverted legal shell controlled by the tyrant.

  ### Conclusion

  Aquinas's passage provides a robust *theoretical* framework justifying resistance to a constitutionally installed tyrant. The tyrant, by governing for private good, ceases to uphold the true unity of the people (law + common good) and becomes the *true seditious element*. Resistors defending the common good are not seditious but acting justly. Prosperity or popularity under tyranny doesn't negate its illicit "directedness."

  However, Aquinas crucially underdetermines *how this judgment is authoritatively made in practice* when the tyrant controls the legal apparatus and contests the characterization. The gap lies in the lack of clear criteria for establishing the *fact* of tyranny (beyond the abstract definition) and the lack of an identified *agent* or *process* with the legitimacy to make that determination and authorize resistance within the political community. Closing this gap requires introducing distinctions regarding the *degree* of tyranny, more concrete *objective criteria*, defining the *role of the community* or its representatives in judging the ruler, and an explicit appeal to a *higher law* (natural law/common good) that trumps the tyrant's perversion of positive law.
