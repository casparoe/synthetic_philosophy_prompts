  Where the text underdetermines is the mechanics of designation: Who decides when private interest supersedes common good? Aquinas assumes this is objectively discernible, but offers no institutional test. The user's question about "prosperity or popularity" defeating the tyranny claim is particularly sharp - Aquinas would counter that apparent stability doesn't negate illicit direction of governance. 

