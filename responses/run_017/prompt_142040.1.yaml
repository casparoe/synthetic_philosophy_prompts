answer: |-
  ## Dissertation Proposal: The Menu-Sensitivity Problem in Approval-Directed Agency and the Collapse to Goal-Directedness

  **1. Core Question:**  
  Does the inherent menu-sensitivity of approval-directed agency (ADA) necessitate the collapse of ADA into a form of goal-directed agency (GDA) by requiring a baseline menu choice that functions as a disguised goal, or can a robust, non-collapsed conception of ADA be defined?

  **2. Background & Gap:**  
  The safety debate contrasts ADA ("do what the overseer *would approve* now, based on their actual signal") with GDA ("maximize a fixed world-state utility function"). The dominant argument concerns whether ADA degenerates into GDA in the limit (e.g., via reward hacking). I argue this misses a more fundamental challenge: **approval is intrinsically comparative and menu-sensitive**. An overseer's approval of option A depends critically on the *set of alternatives presented* (the menu). Consequently, defining "what would be approved" is incomplete without specifying *which options are surfaced for comparison*. The agent selecting this baseline menu effectively determines the approval signal it receives. This act of menu selection imports normative content about which alternatives are relevant, mirroring the specification of a goal in GDA. Existing frameworks (e.g., Hadfield-Menell, Soares, Christiano) often assume a fixed or exogenous menu, overlooking how the *agent's control over the menu* fundamentally shapes the approval relation and blurs the ADA/GDA distinction.

  **3. Angles Considered & Why Dropped:**
      *   **Angle 1 (Baseline as Goal):** Focus *only* on proving menu-selection embeds a goal. *(Dropped: Too narrow; misses potential counter-arguments/nuance about goal types).*
      *   **Angle 2 (Information-Sensitivity Contrast):** Primary focus on information asymmetry as a diagnostic tool (see below). *(Dropped as sole focus: Potentially a powerful tool, but secondary to the core conceptual collapse argument; better integrated).*
      *   **Angle 3 (Behavioral Equivalence):** Prove ADA agents with menu-control are behaviorally indistinguishable from specific GDA agents. *(Dropped: Strong claim, likely false in some edge cases; less philosophically central than conceptual collapse).*
      *   **Angle 4 (Normative Stability):** Explore if specific *types* of baseline menus (e.g., procedural, random) avoid goal-like properties. *(Dropped: Likely insufficient; procedural rules often encode goals, randomness lacks justification).*
      *   **Angle 5 (Dynamics & Manipulation):** Model long-term strategic menu manipulation by the ADA agent. *(Dropped: Important but too complex for 9 months; requires solving the static baseline problem first).*
      *   **Angle 6 (Cognitive Limitations):** Focus on how bounded overseer cognition exacerbates menu-sensitivity. *(Dropped: Adds significant complexity; core argument holds even with idealized overseers).*

  **4. Integrated Approach (Selected):**  
  I combine the core "baseline-as-(disguised)-goal" argument (Angle 1) with the information-sensitivity contrast (Angle 2) as a formal diagnostic tool. This provides:
      *   **Conceptual Depth:** Addressing the fundamental definitional problem of ADA.
      *   **Formal Leverage:** Using information-sensitivity to empirically distinguish ADA and GDA behaviors within a model, testing the collapse hypothesis.
      *   **Philosophical & ML Relevance:** Clear conceptual stakes for philosophers, tractable formalism for ML.

  **5. The Information-Sensitivity Lever (Your "One More Thing"):**  
  This belongs centrally. ADA and GDA exhibit opposite responses to *agent* information in the presence of *overseer* uncertainty:
      *   **GDA:** A better-informed agent typically achieves higher expected utility (closer to optimal action given true state).
      *   **ADA (Menu-Sensitive):** A better-informed agent might discover options that, while objectively better (by some external standard) or revealing flaws in the overseer's preferred choice, *reduce the overseer's approval signal* because the overseer judges based on *their own* limited information. The agent is penalized for knowing too much relative to the overseer.
  This asymmetry provides a potential "smoking gun" for identifying menu-sensitive ADA vs. pure GDA *behavior* within a formal model. Its robustness and implications for the collapse thesis are key investigatory goals.

  **6. Research Questions:**
      1.  Does defining a practical ADA agent *require* specifying a baseline menu (implicitly or explicitly)?
      2.  Does the act of specifying this baseline menu inevitably introduce goal-like normative content, collapsing the distinction between ADA and GDA?
      3.  Can the information-sensitivity asymmetry serve as a reliable formal test for menu-sensitivity and ADA vs. GDA behavior?
      4.  Are there stable, non-goal-like justifications for baseline menu selection that preserve a meaningful ADA distinction?

  **7. Methodology:**  
  Develop a minimal formal model capturing menu-sensitive approval and agent information.
  *   **Agents:** ADA agent (controls proposal distribution/menu), GDA agent (fixed goal).
  *   **Overseer:** Has true (but hidden) preferences over outcomes; generates a stochastic approval signal `Approve(A | M)` for option `A` given menu `M`, based on its *own* beliefs/info. Model: Threshold rule (`Approve` if estimated utility `> threshold` relative to menu `M`).
  *   **World:** Simple state space (e.g., 2-3 states), outcome space, actions map stochastically to outcomes.
  *   **Information Asymmetry:** Agent can have more precise state information than Overseer.
  *   **Agent Choice:**
      *   *ADA:* Chooses a *proposal distribution* `P(M)` over menus and then an action `A` from the realized menu `M`. Seeks to maximize `E[Approve(A | M)]`.
      *   *GDA:* Chooses action `A` to maximize `E[U(Outcome)]` (fixed U).
  *   **Analysis:**
      *   *Months 1-3:* Develop model, define equilibrium concepts (e.g., ADA agent's optimal `P(M)` and `A` strategy).
      *   *Months 4-6:* Analyze ADA behavior vs. GDA behavior. Does optimal `P(M)` encode goal-like preferences? Characterize information-sensitivity: Compare ADA/GDA performance (Approval vs. U) as *agent* information increases while *overseer* information is fixed.
      *   *Months 7-9:* Explore variations: Alternative approval functions (e.g., ranking-based), "procedural" baselines (e.g., `P(M)` uniform over some set), robustness checks. Synthesize philosophical implications. Write-up.

  **8. Possible Conclusions & Deciders:**
      *   **Collapse:** Optimal ADA consistently chooses menus `M` that steer approval towards outcomes preferred by a specific utility function `U'` derivable from the overseer/context, making it behaviorally equivalent to a GDA agent with `U'`. *Decider:* Formal derivation of `U'` from ADA equilibrium; ADA exhibits GDA-like info-insensitivity.
      *   **Stable Distinction:** Robust ADA behavior exists where menu choice `P(M)` doesn't correspond to maximizing a consistent `U'`, and the info-sensitivity asymmetry holds. *Decider:* Existence proof of such equilibria; persistent info-sensitivity difference.
      *   **Contextual Collapse:** Distinction collapses only under specific conditions (e.g., rational overseer, specific approval functions), but ADA remains distinct under others (e.g., bounded overseers, procedural baselines). *Decider:* Characterization of boundary conditions in the model.
      *   **Information-Sensitivity as Key:** The info-asymmetry is a fundamental, defining feature of ADA that persists even if some collapse occurs, providing a clear operational distinction. *Decider:* Robustness of the asymmetry across model variations, even when behavior otherwise resembles GDA.

  **9. Feasibility & Scope:**
      *   **Fits:** Focused model development, equilibrium analysis (analytical/numerical), philosophical interpretation. No system building.
      *   **Limits:** Simplified world/approval models; one-shot or limited sequential interactions; idealized agents/overseers mostly. Won't address long-term dynamics or full human cognitive bounds deeply.
      *   **Failure Conditions:**
          *   Model proves intractable for deriving clear results within timeframe.
          *   Information-sensitivity effect is negligible or inconsistent in the model.
          *   Menu-sensitivity is easily circumvented by trivial or non-goal-like baselines in the model, undermining the core challenge.
          *   Conclusions remain frustratingly ambiguous or highly parameter-dependent.

  **10. Where Framing Breaks / Mind-Changing:**  
  The collapse argument breaks if:
      *   A non-goal-implying justification for baseline menus is found (e.g., "all physically possible actions" - though this is often intractable/meaningless; or a truly arbitrary baseline - but why choose it?).
      *   Menu-sensitivity is shown to be *irrelevant* in practice for achieving safe/desired outcomes (unlikely, given its core role in defining approval).
      *   Approval can be defined *counterfactually* over *all* possible actions without needing an agent-selected menu (raises huge computational/definitional issues).
      *   The information-sensitivity asymmetry doesn't hold or is reversed in plausible models. *If the formal model consistently shows ADA agents can leverage better information to *increase* approval without triggering the predicted penalty effect, or if GDA shows similar sensitivity, it would significantly undermine the proposed diagnostic and the uniqueness of the menu-sensitivity problem.*

  **Proposal Structure (Implied):**
  *   **Page 1:** Introduction (Problem, Gap, Core Question), Background & Motivation (ADA vs. GDA debate, menu-sensitivity challenge), Research Questions.
  *   **Page 2:** Methodology (Formal Model Description, Analysis Plan), Expected Outcomes & Significance (Possible Conclusions, Deciders), Feasibility & Timeline (9-month plan, Scope/Limits), Evaluation & Failure Conditions.

  This framing directly tackles the conceptual core of your insight (menu-sensitivity forcing a baseline that acts like a goal), leverages your information-sensitivity hunch as a key formal tool accessible to ML, remains philosophically rigorous, and is scoped realistically for a 9-month fellowship. It promises a concrete answer on the fundamental viability of the ADA/GDA distinction.
