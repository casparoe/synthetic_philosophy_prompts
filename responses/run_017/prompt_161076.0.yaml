prompt: |-
  Hey — I help moderate a foraging / mushroom-ID Discord (yes, the kind where a wrong ID can put someone in hospital). We've been going round for weeks about a rule for our "certain ID" posts, and the whole argument runs on the line "talk is cheap," which I've now heard so many times that I've lost any grip on what anyone means by it.

  The proposal on the table, from our loudest member: if you want to post an ID at "certain" or "near-certain," you burn a donation to a cause our group actively dislikes, scaled superlinearly to how confident you say you are (so "99%" costs a lot more than "80%"). His reasoning as I understand it: words cost nothing, so anyone can claim certainty, so the only way to make a certainty-claim mean something is to attach a real, non-refundable cost to it — and the waste is the point, because if you could get the money back, or bet it and hedge, it wouldn't be a handicap anymore.

  Three competing rules are floating around: (a) a "receipts" rule — no payment at all, you just have to attach a photo of the spore print and gill attachment so others can check; (b) a track-record rule — a bot displays your historical ID accuracy next to your name, which nobody can edit; (c) a bet rule — you post a stake you get back if two moderators later confirm the ID and lose if they refute it. Someone answered (c) with "put your money where your mouth is," and I can't tell whether that's the same principle as the burn or a different one wearing the same clothes.

  What I want is the menu of precise things "talk is cheap" could be asserting here, from the trivial ("uttering a sentence has low marginal cost, so people sometimes say things they don't believe") on up: that costless messages carry no information when interests conflict; that reliability requires differentially higher cost for the bad type rather than cost simpliciter; that reliability requires *wasteful* cost specifically; that attaching any cost is enough to make a message trustworthy; that some signals are trustworthy because they're mechanically tied to the fact instead of because they cost anything. For each reading: platitude, defensible and substantive, or false? And which reading would actually get our member his rule — I have a feeling a fee everyone can pay just selects for rich or very confident people rather than accurate ones, and that burning money and betting money do different things (one screens, one incentivizes?), but I can't make it precise. Same question for the "that's just signalling" move someone used to dismiss a long careful post as showing off: does anything in this story license that, or does showing that something is a signal not show it's empty?

  Lay it out as a numbered list of readings, each with a verdict and a note on which of the four rules it actually supports. Also please seperate what's settled textbook signalling theory (peacocks, stotting, the job-market model, handicap stuff) from what's genuinely contested or model-dependent — say where you're unsure instead of smoothing it over, and don't hand me a contested reading as if it were the definitve consensus. And tell me which reading you think people in that thread were actually reaching for.
reasoning: |-
  Okay, let me tackle this user's query. They're moderating a mushroom foraging Discord where IDs can be life-threatening. The core debate is around "talk is cheap" and how to enforce reliable certainty claims. The user wants a breakdown of what "talk is cheap" means in different theoretical contexts and which proposed rule each interpretation supports.

  First, I need to unpack the phrase "talk is cheap" systematically. The most basic reading is that words cost nothing to produce, so people can lie without consequence. This is a platitude and supports rules that add verification like receipts or track records. But the donation proposal's supporter seems to be thinking at a deeper level—maybe signalling theory where costly signals separate honest from dishonest actors.

  Looking at signalling models, Zahavi's handicap principle comes to mind. Wasteful costs (like burning money) can be reliable signals because they're harder to fake. If someone burns $100 claiming certainty, it's credible because a faker wouldn't risk that loss. This would support the donation-burn rule. But is this practical here? Wealthy users might still bluff, and the cost might not correlate with actual expertise. So while theoretically defensible, it's problematic in practice.

  The bet rule is different—it's a contingent payment that incentivizes accuracy. But it's not a pure signal because the stake is returned if correct. So it screens for confidence but doesn't have the same waste element. The track record rule uses historical data as a signal, which is costless but accumulates over time. That's mechanically tied to accuracy, so it's reliable but not immediate.

  The user also asks about "showing off" being dismissed as signalling. In theory, signals aren't inherently empty—they convey information precisely because they're costly. So dismissing a detailed post as "just signalling" misses the point; the content matters if it's verifiable.

  I need to clarify which theories are settled and which are debated. Handicap principle has empirical support in biology but is controversial in economics. The job-market model is more about education as a signal. In this Discord context, the track record rule seems most practical—low friction and directly tied to past accuracy. The burn rule might feel satisfying but could exclude less wealthy experts.

  The loudest member is likely reaching for Reading 4 (wasteful cost as a handicap). But in practice, Reading 5 (mechanically tied signals) via track records or receipts would be more reliable and inclusive. The user's concern about selecting for the rich is valid—signalling costs must be differentially harder for bad types, which wealth complicates.

  Finally, structuring this as numbered readings with verdicts and supported rules. Highlight where theories are contested (e.g., whether wasteful signals are necessary outside biology). Emphasize that the track record rule aligns best with both theory and practical needs, even if it's not what the vocal member is pushing.
answer: |-
  Here's a breakdown of the "talk is cheap" principle applied to your Discord's dilemma, structured as requested. I'll separate settled theory, contested points, and practical implications for each rule.

  ### The Core Principle: "Talk is Cheap" – What Could It Mean?

  1.  **Reading 1: Utterance Cost is Low (Platitude)**
      *   **Meaning:** Simply producing words (e.g., typing "I'm 99% certain") requires minimal effort, cost, or consequence. Therefore, people can easily say things they don't believe or know for sure without immediate penalty.
      *   **Verdict:** **Platitude.** Undeniably true as a statement about communication costs.
      *   **Supports:** All proposals **(a, b, c, donation)**. *Any* rule beyond simply trusting words addresses this.
      *   **Status:** Settled (trivially true). Doesn't get to the heart of the disagreement.

  2.  **Reading 2: Costless Messages Carry No Information Under Conflict (Signalling 101)**
      *   **Meaning:** When the interests of the sender (poster) and receiver (reader/Discord) *conflict* (e.g., poster wants status/kudos, readers want safety; poster might be wrong but confident), a costless message cannot be trusted. A dishonest sender (someone who's wrong but claims "99%") has no disincentive *not* to send the same signal ("99%") as an honest sender (someone who's right and claims "99%").
      *   **Verdict:** **Defensible and Substantive.** Core insight from signalling theory (Spence Job Market Model is the classic economic example). Cost is needed to *separate* types (honest vs. dishonest).
      *   **Supports:** All proposals **(a, b, c, donation)**. *Any* requirement beyond words (providing evidence, staking money, building reputation) imposes *some* cost/differentiation.
      *   **Status:** Settled textbook theory (economics/biology). The *type* and *effectiveness* of the cost are the crucial next questions.

  3.  **Reading 3: Reliability Requires Differentially Higher Cost for the "Bad Type" (The Separation Condition)**
      *   **Meaning:** For a signal (like claiming "99% certainty") to be reliable, the *cost* of sending that signal must be *higher* for the "bad type" (the person who is wrong) than for the "good type" (the person who is right). The cost must be *differentially burdensome*. If both types can pay the cost equally easily (e.g., a small fixed fee rich and poor can afford), the signal fails.
      *   **Verdict:** **Defensible and Substantive.** This is the core requirement for a *separating equilibrium* in signalling games.
      *   **Supports:** Critically evaluates all proposals:
          *   **(a) Receipts:** Cost = Effort/time to provide photos/prints. *May* be differentially higher for bad types (who might need to fake/hide details) vs. good types (who just document truth). **Maybe.**
          *   **(b) Track Record:** Cost = Long-term effort/accuracy to build reputation. *Strongly* differentially higher for bad types (consistently wrong) vs. good types (consistently right). **Yes.**
          *   **(c) Bet:** Cost = Risk of losing the stake. *Strongly* differentially higher for bad types (high chance of losing) vs. good types (low chance of losing). **Yes.**
          *   **Donation Burn:** Cost = Money lost. *Requires differential burden:* If the cost is trivial for *both* rich good types and rich bad types, it fails. If scaled superlinearly, it *might* deter bad types more if they are risk-averse or less confident, but wealth disparity breaks this. **Uncertain/Problematic.**
      *   **Status:** Settled textbook theory. This is where the donation proposal faces its biggest challenge.

  4.  **Reading 4: Reliability Requires *Wasteful* Cost (The Handicap Principle)**
      *   **Meaning:** The cost must not only be differentially burdensome but also fundamentally *wasted* (a "handicap" or "sunk cost"). If the cost can be recouped or provides a direct benefit (like winning a bet *or* even just getting the money back later), it loses its power as a pure signal of underlying quality/certainty. The waste itself is the proof – only the truly "fit" (certain) can afford to waste that resource.
      *   **Verdict:** **Defensible but Contested & Context-Dependent.**
          *   **Biology (Peacocks, Stotting):** Strong empirical support. Wasting energy/resources signals fitness because only truly fit individuals can afford the waste.
          *   **Economics/Human Behavior:** Highly contested. While sunk costs *can* signal commitment (e.g., expensive non-refundable training), the *necessity* and *universal superiority* of pure waste over contingent payments (like bets) is debated. Many effective signals involve contingent costs (bonds, warranties) or non-wasteful investments (education).
      *   **Supports:** Primarily the **Donation Burn** rule. It explicitly mandates waste. Undermines **(c) Bet** (money isn't wasted if you're right) and **(b) Track Record** (reputation is valuable, not wasted). Neutral on **(a) Receipts** (effort is sunk, but not necessarily "wasted" in the handicap sense).
      *   **Status:** Settled in evolutionary biology (Zahavi's Handicap Principle), highly contested in economics/social science. Your loud member is likely reaching for *this specific reading*.

  5.  **Reading 5: Attaching *Any* Cost is Sufficient for Trustworthiness (Naive Costly Signalling)**
      *   **Meaning:** Simply requiring *any* payment or effort, regardless of its structure or differential burden, makes a claim trustworthy because people won't pay unless they mean it.
      *   **Verdict:** **False.** Easily gamed (see Reading 3). A small fixed fee, or a fee everyone can easily pay (including the rich/uninformed), does *not* ensure reliability. It might slightly deter casual low-confidence guesses, but not determined bluffers or the wealthy-but-wrong.
      *   **Supports:** Weakly supports any rule with a cost **(c, donation)**, but misunderstands signalling theory. It's the bare minimum, not sufficient.
      *   **Status:** Misapplication of signalling theory.

  6.  **Reading 6: Reliability Requires Mechanical/Verifiable Ties to Truth (Anti-Signalling)**
      *   **Meaning:** Trust comes not from imposing costs on the claimant, but from *mechanically verifying* the claim itself using objective evidence or track records. The signal's reliability comes from its direct connection to reality, not from being costly to fake.
      *   **Verdict:** **Defensible and Substantive (Complementary View).** This emphasizes verification over pure signalling. Reputation systems and evidence submission work precisely because they are (imperfect) reflections of underlying truth, not just because they cost something.
      *   **Supports:** **(a) Receipts** (direct evidence) and **(b) Track Record** (historical evidence of accuracy). Actively undermines **(c) Bet** and **Donation Burn**, which focus on claimant cost/punishment rather than direct truth verification.
      *   **Status:** Settled common sense/logic, often contrasted with (but sometimes combined with) signalling theory. Proponents of (a) and (b) are likely reaching for this.

  **Regarding "That's just signalling/showing off":**
  *   **The Move:** Dismissing a detailed post as "just signalling" implies the post is *only* about displaying knowledge/status (a costly signal) rather than conveying substantive, verifiable information.
  *   **Does Theory License This?** **No, not inherently.** Signalling theory *explains* *why* people might invest effort in detailed posts (to signal expertise/commitment). It does *not* prove the *content* is empty or wrong.
  *   **The Issue:** A signal's *cost* (effort in a post) can be correlated with *quality* (accurate ID). A detailed post *can* be both a costly signal *and* contain verifiable information (Reading 6). Dismissing it *solely* as "signalling" ignores the potential for mechanical verification. It's only "empty" if the details provided are irrelevant, misleading, or unverifiable fluff. The "signal" is the *effort*, the *substance* is the verifiable content.

  **Which Reading Were They Reaching For?**
  *   **The Loud Member (Donation Burn):** Almost certainly **Reading 4 (Wasteful Cost/Handicap Principle)**. His emphasis on non-refundability, waste being "the point," and dismissal of bets/hedging aligns perfectly with Zahavi's biological handicap logic.
  *   **Proponents of Receipts (a):** Likely **Reading 6 (Mechanical Verification)** and **Reading 2 (Basic Signalling - cost=effort)**.
  *   **Proponents of Track Record (b):** Likely **Reading 6 (Mechanical Verification via history)** and **Reading 3 (Differential Cost - bad types can't build a good record)**.
  *   **Proponents of Bet (c):** Likely **Reading 3 (Differential Cost - bad types lose money)** and the intuitive "put your money where your mouth is" which emphasizes *contingent* cost/incentive alignment, not waste.
  *   **People saying "Talk is cheap" generally:** Usually **Reading 1 (Platitude)** or **Reading 2 (Basic Signalling)**.

  **Which Rule Actually Works Best? (Analysis & Recommendation)**

  1.  **Donation Burn (Reading 4):** Theoretically appealing (handicap) but **practically flawed**.
      *   **Problem 1 (Wealth):** Violates Reading 3 (Differential Burden). A rich fool can easily burn $100 for status, a poor expert might hesitate even at $10. It selects for wealth/confidence, not accuracy.
      *   **Problem 2 (Incentive):** It *deters* claims (especially from less wealthy experts) but doesn't *incentivize* careful checking like a bet does. The cost is sunk *before* verification.
      *   **Problem 3 (Waste):** Morally/ethically questionable for a safety-focused group. Burns resources that could fund safety tools or education.
      *   **Verdict:** Poor fit. Signals wealth/confidence, not reliably accuracy/expertise.

  2.  **Bet Rule (c):** Addresses **Reading 3 (Differential Cost)** well and provides **strong incentives** for careful ID. However:
      *   **Logistics:** Requires robust moderator verification *after* the fact. What if disagreement arises later? Burden on mods.
      *   **Discouragement:** May deter valuable contributions due to financial risk, even from experts.
      *   **"Put your money..." vs. Burn:** It's **different.** It's *incentive alignment/contingent punishment*, not *wasteful signalling*. It screens based on confidence *and* incentivizes diligence.
      *   **Verdict:** Strong theoretically (Reading 3), practical logistics and deterrent effect are concerns.

  3.  **Receipts Rule (a):** Focuses on **Reading 6 (Verification)**. Good practice regardless!
      *   **Limitation:** Doesn't inherently signal *certainty level* (80% vs 99%). A bad actor could provide good photos of an easily misID'd mushroom. Relies on *others* spotting the error.
      *   **Verdict:** Necessary baseline for *any* ID post (even "possible"), but insufficient alone for high-certainty claims. Supports verification, not signalling.

  4.  **Track Record Rule (b):** **Strongest contender.**
      *   **Theory:** Excellently addresses **Reading 3 (Differential Cost)** - building & maintaining a high-accuracy record is *much* harder for bad types than good types. Also leverages **Reading 6 (Mechanical Verification via history)**. It's a costly signal (long-term effort/investment) that is *intrinsically tied* to performance.
      *   **Practicality:** Automated, low friction per-post (after setup). Provides immediate context for readers ("UserX: 95% Accuracy (200 IDs)"). Incentivizes long-term carefulness. Less wealth-sensitive than money rules.
      *   **Implementation:** Needs clear criteria for what counts as an ID claim impacting the record and how verification/moderation disputes are resolved.
      *   **Verdict:** Best balance of theory (Readings 3 & 6), practicality, safety, and fairness. Scales well.

  **Conclusion & Recommendation:**

  *   **"Talk is cheap" is primarily valid as Readings 2 & 3.** Costly signals are needed for reliability under conflicting interests, but the cost must be *differentially burdensome* for bad types.
  *   **The donation burn rule (Reading 4)** is theoretically interesting (handicap) but **practically unsound** due to wealth effects and lack of positive incentives. It likely won't achieve reliable signalling of *expertise*.
  *   **The bet rule (Reading 3)** is theoretically strong on incentives and screening but has practical hurdles.
  *   **The receipts rule (Reading 6)** is essential baseline verification but doesn't directly signal certainty level.
  *   **The track record rule (Readings 3 & 6)** is the **most robust solution.** It creates a differentially burdensome cost (long-term accuracy), provides mechanical verification (historical data), incentivizes care, avoids wealth bias, and gives readers the most valuable contextual signal. **Implement Rule (b).**

  **Combine (b) Track Record with (a) Receipts as a baseline requirement for *all* ID posts.** This leverages verification *and* reputation-based signalling. Consider the bet rule (c) optionally for ultra-high-stakes IDs if feasible, but track record is the core solution to the "certainty claim" problem. Discard the donation burn rule – its theoretical basis is shaky in this human context, and its practical effects would be counterproductive.
