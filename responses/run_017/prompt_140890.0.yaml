  The leveling down objection is a big point here. The friend claims that prioritarianism implies leveling down is better in some respect. But prioritarians argue that since no one benefits, the weighted sum decreases, so it's not better. The user's case with g(w) = -1/w is tricky because it shows a transfer where the sum increases despite destroying resources. This seems to challenge prioritarianism, but I need to check if such weighting functions are actually used. Most prioritarians use bounded functions like sqrt or log to avoid infinite weights at zero well-being.

  Next, the user's example. Using g(w) = -1/w, taking 500 from someone at 1000 (loss of 0.001) and giving 1 to someone at 1 (gain of 0.5) results in a net gain. But this function has unbounded marginal priority as well-being approaches zero, which is problematic. Prioritarians typically avoid this because it leads to implausible results, like sacrificing almost everything for tiny gains to the worst off. So the example exploits an unrealistic function, not standard prioritarianism.

