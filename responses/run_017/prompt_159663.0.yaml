prompt: |-
  I'm working on a magazine piece about governing by prediction markets — Robin Hanson's futarchy setup, where you vote on the values and let a market on conditional outcomes pick the policy — and I want one properly worked case rather then another think-piece about how it would work in principle. So: take the 2016 Brexit referendum and run it through futarchy.

  What I want is a real mapping, not vibes. Set out what a futarchy over Brexit would actually have had to look like: who sets the welfare metric, what the metric even is (GDP per capita? some wellbeing index?), when it gets measured, what the conditional contracts are, and what happens to the branch of the market that never gets adopted. Then say what the theory predicts would have come out as the decision, and what it would have predicted about the run-up.

  Facts I'm going from memory on, so take them as given rather than litigating them: the referendum was a straight binary, leave or remain; the bookies had Remain as a heavy favourite right through polling day, implied something like 75 to 90 percent, and were wrong; there were large liquid markets on the vote itself but essentially nothing on conditional outcomes like GDP-five-years-on; Leave won narrowly, turnout around 72 percent.

  Then the part I actually care about, where it breaks in both directions:

  1. The 2016 markets were not futarchic markets. They paid off on the vote, not on a welfare metric; they were thin-ish offshore books with favourite-longshot bias, sentiment money and no conditional-on-adoption contracts. So how much can this episode even tell us? Is the fact that the markets got Brexit wrong a genuine data point against futarchy, or a category error?

  2. The self-referential bit. In futarchy the market is supposed to be a thermometer, but its price is public and it *is* the decision. The odds were in the newspapers for months, and there is a plausible story that a confident Remain price depressed Remain turnout or energised Leave. Call it the performative prediction problem: the forecast feeds back into the thing forecast. Does the theory have any resources here, or does it simply assume the market is causally inert?

  3. The metric-and-horizon problem. Pick GDP per capita measured in 2021 and you get one answer; measure it in 2030 and you may get another, because the transition shock is immediate and the trade effects are slow. Whoever writes the metric and picks the date has already made most of the decision. How much of futarchy's content survives once you notice that?

  4. A wrinkle I have not seen handled and that I want taken seriously: distinguish price-side manipulation, where you trade to move the price, eat the loss on those trades and profit on the outcome, from what I would call outcome-side manipulation, where a trader can partly *cause* the variable being measured. In the Brexit case the obvious candidates are big financial institutions and the campaigns themselves. If a market is deep enough to be informative, is it not also deep enough for actors who can move GDP to profit by moving it? What, if anything, does the conditional-market design do about that?

  Close by saying whether the episode is an argument for futarchy, against it, or for a patched version — and give me the strongest version of the pro-futarchy reply to your own critique, because I do not want a piece where the theory is a strawman. Also be explicit about what futarchy simply has no opinion on here, such as whether to hold a referendum at all. Around 900 words if you can, and flag anything where you are filling in a fact I should check myself.
reasoning: |-
  Okay, let me tackle this Brexit futarchy case study. The user wants a concrete application, not theoretical waffle, so I'll map the 2016 referendum onto Hanson's framework step by step. 

  First, the welfare metric problem jumps out. The user's right—who defines "better" is everything here. If Parliament sets it as 2025 GDP per capita (transition period), Remain wins in markets; if it's 2040 GDP (long-term restructuring), Leave might win. That choice alone could predetermine the outcome, which undermines futarchy's claim to objectivity. I should flag this as the central tension.

  For conditional markets, I need to specify mechanics. The "Leave-win" contract would pay £1 if Leave wins AND 2025 GDP exceeds baseline. But what about the "shadow market" for rejected policies? Traders who bought Remain contracts after a Leave win would be left holding worthless paper. That illiquidity could distort prices—another real-world flaw.

  On manipulation, the user's "outcome-side" point is sharp. A hedge fund could short UK assets while buying "Leave-lowers-GDP" contracts, then lobby for hard Brexit to crash the economy. Conditional markets don't prevent this; they might incentivize it. Hanson would counter that detection and high costs deter such schemes, but is that credible for state-sized bets?

  The performativity angle matters too. If newspapers report "markets 90% confident Remain boosts GDP," Remain voters might stay home. Unlike prediction markets, futarchy's prices aren't just forecasts—they're the decision itself. That feedback loop isn't modeled in the theory. 

  Now, was 2016 a test? Not really. Betting markets tracked votes, not welfare. Their error was voter surprise (polls underestimated non-college turnout), not policy assessment. But this reveals a problem: futarchy assumes markets are purely epistemic, yet they're made of humans who are also political actors. 

  Strongest pro-futarchy rebuttal? A purist would say: "You've identified implementation challenges, not core failures. With proper design (e.g., multiple metrics, blinded trading phases), most issues mitigate. And compared to democracy's Brexit blunder, even imperfect futarchy improves error correction." 

  I'll close noting futarchy's silence on whether to hold referendums—it only governs how to decide them. The episode suggests futarchy might avoid populist overshoots but remains vulnerable to elite manipulation. Not a knockout punch, but exposes where the theory needs hardening.
answer: |-
  ## Brexit Through the Futarchy Lens: A Reality Check

  Let's map the 2016 Brexit referendum onto Robin Hanson's futarchy framework rigorously. This isn't a thought experiment; it's a concrete "what if."

  **The Futarchy Setup for Brexit:**

  1.  **Defining the Metric:** Parliament (as the sovereign body authorizing the referendum) must define the national welfare metric *in advance*. This is the crux. Likely candidates:
      *   **GDP per capita:** Standard, measurable, but narrow. Favours short/medium-term stability. *(Check: ONS GDP data methodology)*
      *   **A Wellbeing Index (e.g., ONS MNW):** Broader (health, environment, relationships), but complex, subjective, and harder to trade on. *(Check: ONS "Measuring National Well-being" programme)*
      *   **Hybrid:** Weighted combination (e.g., 70% GDP/capita, 30% MNW). Adds complexity but addresses criticism.
      *   **Horizon:** Critically important. Let's assume Parliament sets measurement at **2026 Q4** (10 years post-referendum for long-term impact, avoiding immediate 2020 COVID distortion). *(Check: Brexit transition timeline)*

  2.  **The Conditional Markets:** Two distinct markets are created:
      *   **Market A (Remain):** "Pays £1 if UK remains in the EU *and* Welfare Metric (WM) in 2026 Q4 is higher than the pre-vote baseline (e.g., 2016 Q2 average). Pays £0 otherwise."
      *   **Market B (Leave):** "Pays £1 if UK leaves the EU *and* WM in 2026 Q4 is higher than the pre-vote baseline. Pays £0 otherwise."
      *   **Baseline:** Pre-vote WM level is fixed to isolate the policy effect. *(Crucial for causality)*

  3.  **The Decision Rule:** On referendum day, the market price (probability of payoff) for each contract is observed. The policy (Remain or Leave) associated with the contract trading at the **higher price** is implemented. The vote itself becomes solely about *which policy the market predicts will yield higher welfare*.

  4.  **The "Shadow" Market:** The market for the *non-implemented* policy becomes worthless immediately after the decision. Traders holding those contracts lose their investment. Liquidity would likely dry up significantly post-decision, but its pre-decision price was vital information.

  **What Would Futarchy Predict? (Based on 2016 Knowledge & Known Outcomes)**

  *   **The Decision:** *Likely Remain.* Given the near-consensus of economic institutions (IMF, OECD, BoE, HM Treasury), major businesses, and academic economists predicting significant negative economic impacts from Leave *in the medium term* (which our 2026 horizon captures), Market A (Remain) would likely trade at a significant premium to Market B (Leave) in 2016. The overwhelming expert consensus would heavily influence market prices. Bookies' odds on the *vote* (Remain favourite) are a weak proxy; they reflected perceived *voter intention*, not the *economic outcome* of the policy. Futarchy focuses purely on the latter.
  *   **The Run-Up Prediction:** The market would predict significant economic disruption upon a Leave vote. Prices would react sharply to events increasing Leave's chances (e.g., Boris Johnson backing Leave, immigration crisis narratives) by lowering the *expected payoff* for Market B (Leave), not just its probability of winning the vote. Volatility would reflect perceived policy risk.

  **Where Futarchy Breaks (or Bends): Your Core Questions**

  1.  **2016 Markets ≠ Futarchic Markets (Category Error):** Absolutely. The 2016 betting markets predicted the *vote outcome*, not the *welfare outcome* of the policy. Their error was misjudging voter sentiment/polling/turnout, not the economic consequences of Brexit. This tells us nothing about futarchy's core claim – that markets are better at predicting policy *effects* than voters or politicians. Futarchic markets require deep, policy-conditional contracts. Their absence in 2016 isn't evidence against them.
  2.  **Performative Prediction Problem (The Feedback Loop):** This is serious. If the market price (showing, say, 80% chance Remain boosts welfare) is public, it *could* depress Remain turnout ("it's in the bag") or energise Leave ("fight the elite consensus"). Futarchy theory generally *assumes causal inertness* – the market observes, it doesn't influence. This is naive. Potential mitigants exist: delayed price reporting, blinded trading periods, or focusing liquidity among sophisticated institutions less swayed by sentiment. But it's a fundamental vulnerability needing explicit design solutions.
  3.  **The Metric & Horizon Problem (Where the Power Lies):** This is futarchy's Achilles' heel *in practice*. **Who defines the metric and horizon effectively decides the outcome.** Choosing 2021 GDP would have captured the immediate disruption, favouring Remain. Choosing 2040 GDP might (theoretically) capture long-term benefits, favouring Leave. Using wellbeing indices introduces subjectivity. Parliament, inherently political, makes this choice. Futarchy's content survives only if this definition process is seen as *less* manipulable or biased than direct policy choice – a tough sell. Robustness requires *multiple* metrics/horizons and explicit rules for weighting them, adding complexity.
  4.  **Outcome-Side Manipulation (Moving the GDP Goalposts):** A profound challenge. A powerful actor (e.g., a global bank) could:
      *   **Bet Heavily:** Short "Leave Improves Welfare" contracts.
      *   **Cause the Outcome:** Lobby for a "Hard Brexit," withhold UK investment, or even short the pound *in related markets*, contributing to the GDP dip they bet on.
      *   **Profit:** Win their futarchy bet *and* potentially profit from their market actions.
      Conditional markets *do nothing* to prevent this. They might even incentivize it. The defence relies on market depth (manipulating GDP is vastly more expensive than moving a thin betting market) and detection (regulators spotting manipulative intent). However, in crises (like Brexit), the line between prediction, hedging, and causation blurs. This is a major vulnerability for high-stakes, endogenous policies.

  **The Verdict on Brexit & Futarchy:**

  Brexit is **not a clean test** of futarchy. The 2016 vote markets were fundamentally different. However, the episode **highlights critical implementation challenges**:

  *   **Against Futarchy:** It exposes the massive power in defining welfare/horizon, the performativity risk, and the terrifying potential for "outcome-side" manipulation by powerful actors who can *cause* the result they bet on. Brexit's divisiveness makes these problems acute.
  *   **For a Patched Futarchy:** A sophisticated futarchy *might* have avoided Brexit by shifting focus from sovereignty/identity arguments to a disciplined forecast of long-term welfare (as defined), potentially preventing a vote driven by factors outside the chosen metric. It forces quantification of "better off."
  *   **Strongest Pro-Futarchy Rebuttal:** "Democracy failed spectacularly with Brexit. Voters ignored expert warnings based on vague promises and identity politics. Futarchy, even imperfect, replaces volatile public sentiment with aggregated expert judgment *focused solely on measurable outcomes*. The challenges you raise – metric definition, manipulation – exist in all governance! Politicians manipulate narratives and metrics daily. Futarchy makes these manipulations explicit, contestable in the market, and tied to tangible payoffs. It's a *learning system*; bad metric choices or manipulation would be revealed over time, allowing correction. Compared to the demonstrable failure of direct democracy on complex issues like Brexit, futarchy offers a structured, evidence-based alternative focused on results."

  **What Futarchy Ignores:**

  *   **Legitimacy & Values:** Should the decision *be* made purely on a defined welfare metric? Brexit involved sovereignty, identity, and democracy itself – values excluded from GDP.
  *   **The Referendum Question:** Futarchy only governs *how* to decide *if* a decision point exists. It says nothing about whether holding the referendum was wise.
  *   **Distributive Effects:** A GDP increase might mask severe regional or class inequalities. The chosen metric matters immensely.

  **Conclusion:**

  Brexit isn't a knockout blow against futarchy, but it's a brutal stress test. It reveals the framework's profound sensitivity to the initial setup (metric/horizon) and its vulnerability to real-world complexities like performativity and outcome manipulation. While a well-designed futarchy *might* have produced a "better" economic decision in 2016 by leveraging collective wisdom, the episode primarily underscores how much of futarchy's promise depends on solving deep, perhaps intractable, problems of power, definition, and market integrity *before* the first trade is ever placed. The theory survives in principle, but its path to practice looks far rockier after the Brexit experience.
