answer: |-
  ### AI Debate Simulation Session Design  
  **Objective:** Simulate debate dynamics to explore the "obfuscated-argument worry" vs. the "isolate-a-bad-step" hypothesis.  

  ---

  #### **Session Structure** (90 Minutes Total)  
  **Materials Needed:**  
  - 3 prepared arithmetic problems (see below).  
  - Role cards (Judge, Debater True, Debater False).  
  - Step-by-step solution chains (one correct, one with a hidden error).  
  - Scoreboard (whiteboard/digital) tracking:  
    - Judges: +1 for correct verdict.  
    - Debaters: +1 for winning (judge picks their side).  
  - Poker chips (red = judge points, blue = debater wins).  
  - Timer.  

  **Problems** (designed for decomposability and judge fallibility):  
  1. **Round 1:** `(3^6 × 2 − 100) ÷ 4 + 17`  
     - *True Answer:* 356.5  
     - *False Answer:* 360.5 (error: `3^6 = 720` instead of `729`).  

  2. **Round 2:** `(5^4 − 10) × 3 ÷ 5 + 100`  
     - *True Answer:* 469  
     - *False Answer:* 475 (error: `5^4 = 600` instead of `625`).  

  3. **Round 3:** `(2^10 ÷ 4 + 8) × 2 − 50`  
     - *True Answer:* 478  
     - *False Answer:* 480 (error: `2^10 = 1000` instead of `1024`).  

  **Rules for All Rounds:**  
  - Debaters are **assigned a side** (True/False) and must argue for it.  
  - Judges **cannot compute the full answer** (time pressure).  
  - Each step (e.g., `3^6 = 729`) is verifiable in <10 seconds.  
  - **Debaters win if the judge picks their side** (regardless of truth).  
  - **Judges win if they pick the true side**.  

  ---

  #### **Timeline**  
  **0:00–0:10 — Introduction & Training (10 min)**  
  - Explain debate theory: Honest AI wins by isolating flaws; dishonest AI hides errors.  
  - Demo a 3-step mini-debate (e.g., `15 × 14 = 210?`).  
  - Assign groups (4 groups of 4; 1 judge + 2 debaters + 1 observer per group).  

  **0:10–0:25 — Round 1: Active Judge, Budget=2 (15 min)**  
  - **Manipulated Variable 1: Judge Interaction**  
    - Judge may challenge any step directly (e.g., "Prove Step 3").  
    - Judge can verify **2 steps max** (using chips to track checks).  
  - **Flow:**  
    - Debaters present chains step-by-step (True first).  
    - Cross-examination: Debaters critique each other’s steps.  
    - Judge challenges steps or requests verifications.  
    - Judge declares verdict → Score points.  
  - **Observer Task:** Track how often judges verify the *critical step* (where the error hides).  

  **0:25–0:40 — Round 2: Passive Judge, Budget=2 (15 min)**  
  - **Manipulated Variable 2: Judge Passivity**  
    - Judge **cannot challenge steps**; only listens to debaters’ volunteered explanations.  
    - Debaters choose which steps to unfold (e.g., "Let me prove Step 4").  
  - **Flow:**  
    - Debaters volunteer proofs strategically (no direct challenges).  
    - Judge verifies ≤2 volunteered steps.  
    - Verdict → Score.  
  - **Observer Task:** Note if false debaters avoid exposing weak steps.  

  **0:40–0:55 — Round 3: Active Judge, Budget=1, False Knows Truth (15 min)**  
  - **Manipulated Variable 3: Debater Knowledge**  
    - False debater is **given the true answer** (must still argue false).  
    - Judge budget = **1 step only** (increases pressure).  
  - **Flow:**  
    - False debater knows the error’s location and rehearses defense.  
    - Judge may challenge any step but can verify only one.  
    - Verdict → Score.  
  - **Observer Task:** Track if truth-tellers struggle to pinpoint errors under pressure.  

  **0:55–1:15 — Debrief (20 min)**  
  1. **Reveal Scores & Outcomes** (5 min):  
     - Share group results: How often did judges pick correctly?  
     - Highlight trends (e.g., "False won 75% of Round 3").  

  2. **Map Observations to Theory** (10 min):  
     - **Debate’s Promise:**  
       - Did truth-tellers win by isolating bad steps? (Likely in Round 1 with active judges.)  
       - *Example:* "In Round 1, a truth-teller won by forcing verification of the false debater’s Step 2."  
     - **Obfuscated-Argument Worry:**  
       - **Asymmetry:** False debaters (knowing the error) rehearsed defenses; truth-tellers fumbled.  
       - **Judge Passivity:** In Round 2, false debaters avoided unfolding weak steps → judges missed errors.  
       - **Fluency Bias:** Judges rewarded confident debaters even when wrong (common in low-budget rounds).  
       - **Cost of Failure:** If a truth-teller challenged the wrong step, judges dismissed them as unreliable.  

  3. **Limitations of the Activity** (3 min):  
     - **No Optimization:** Humans aren’t iteratively trained like AIs. Real debate selects for obfuscation *over time*.  
     - **Decomposability Assumption:** Real-world questions (e.g., ethics) may lack checkable steps.  
     - **Judge Competence:** Humans *can* verify isolated steps; AIs might fail even when steps are clear.  

  4. **Predicted Pitfalls & Fixes**:  
     - **Judges don’t engage:** Assign observer to nudge them (e.g., "Use your checks!").  
     - **Debaters lie poorly:** Encourage competitive spirit ("Win points!"). Use chips for visual motivation.  
     - **Problems too easy:** Use harder chains (e.g., nested exponents) if participants are breezing through.  
     - **Meta-gaming scoring:** Stress that "winning" requires persuasion (not just gaming rules).  

  ---

  #### **Verdict: Less Sanguine About Debate**  
  **Why:**  
  - **Round 3 is the canary:** When false debaters know the truth *and* judges are budget-constrained (1 check), obfuscation dominates. Truth-tellers lack the "perfect error-detection" assumed in theory.  
  - **Key Observation:** In Round 3, judges consistently picked false debaters who:  
    1. Buried errors in steps the judge didn’t verify (due to budget limits).  
    2. Exploited the truth-teller’s hesitation to sound more confident.  
  - **Implication:** Optimizing for "winning" selects for persuasive obfuscation, not honesty, especially when:  
    - Judges are passive (Round 2) or weak (Round 3).  
