prompt: |-
  You are a professional philosopher who works on population ethics and who is thoroughly at home in the effective-altruism and rationalist blogosphere: you know why that community invokes Parfit on identity, why "person-affecting" has become a term of art there, why people argue about the asymmetry between bringing happy and unhappy people into existence, and why a longtermist hears "the non-identity problem" as a threat to the entire expected-value edifice rather than as a curiosity. Before you write anything, spend some real effort thinking through the dialectical situation: what this specific audience already believes, what each faction in it takes itself to be defending, and which of their commitments my thesis quietly endangers. Then, and only then, produce the deliverable described at the end.

  My situation. I'm a philosophy PhD student and a longtime reader of LessWrong and Slate Star Codex, and in three weeks I'm giving a forty-minute talk with twenty minutes of questions afterward at a small workshop. The room will be roughly: eight to ten effective-altruism-adjacent researchers, most of them longtermist, who work on cause prioritization, existential risk, and global priorities, and who think in expected value, QALYs or DALYs, and "flow-through effects"; two people who do formal work on population axiology and who have opinions about totalism, averagism, and critical-level views; one philosopher who has written on the person-affecting restriction and thinks it is close to non-negotiable; and about ten graduate students, half of whom know the non-identity problem only from the standard fourteen-year-old-girl and depletion-style cases.

  The thesis I'm defending. I want to argue that non-identity is not a puzzle about a strange and circumscribed class of cases but the normal condition of any decision that affects anyone more than about a generation out. To make this precise I introduce a notion I call identity half-life: for a given present choice, the time T at which the expected fraction of the people alive at T whose very existence counterfactually depends on that choice reaches one half. My empirical-ish claim, which I'll call Fragility, is that identity half-life is on the order of a few decades rather than centuries, because who exists is extraordinarily sensitive to tiny differences in timing and circumstance — differences of the sort that any policy that shifts aggregate conditions (energy prices, pandemic timelines, the speed of AI development, school curricula) reliably produces. If Fragility holds, then combine it with the familiar non-identity argument and you get something stronger than people usually conclude: for the far region, there is no one who is made worse off by our choice, so a person-affecting moral theory has literally nothing to say about the long-term future — the region where the longtermists think almost all the expected value lives.

  My positive proposal is what I've been calling the Two-Zone View. In the near zone, where identity is stable enough across our options that we can still ask whether identifiable people are better or worse off, we keep a person-affecting constraint as a genuine side constraint: it blocks certain intuitively objectionable trade-offs and it does real work there. In the far zone we drop the person-affecting restriction entirely and evaluate outcomes impersonally, by something like a critical-level total view, with an extra discount factor on welfare for people whose existence was itself counterfactually fragile — my thought being that there is something morally thinner about creating value by determining who exists than by improving the lives of people who would have existed anyway. I also argue, against what I call Temporal Parity, that the longtermist's favorite intuition — that near-term people and far-future people must be treated exactly alike — cannot be had alongside the person-affecting restriction once Fragility is on the table, and that the longtermists should therefore be the last people to want to hold on to it.

  What I want from you. A Q&A prep sheet I can print and take into the room, not a defense of the view and not a summary of the talk. Specifically:

  - Ten or so objections I will actually get, in roughly the order they will arrive, and ordered by a combination of how likely they are and how much damage they would do if I have no answer. I don't want the objections I'd get from a general philosophical audience; I want the ones this room will produce.
  - Each objection phrased the way that group would phrase it, in their own vocabulary, and attributed to which faction it comes from — the longtermist cause-prioritizers, the population axiologists, the person-affecting theorist, or the grad student who read one chapter of Parfit and is going to ask the obvious question anyway. Please mark which ones are steelman-worthy and which are just confusion wearing a costume.
  - For each objection: a reply I can actually deliver in about two minutes, plus a short note on where that reply is soft or where I'm relying on something I haven't argued for in the talk.
  - A short section up front on what I should concede in the first five minutes, before anyone asks, so that the two specialists don't spend the whole question period on objections I was always going to grant.
  - The one reply that has to land for the proposal to survive at all, and a note on how to tell during the talk whether it has landed.
  - The question I'm hoping nobody asks, said out loud, with the most honest answer I could give if it comes anyway and an assessment of whether the view can absorb it.
  - One objection I probably won't get but should be worried about, because it's the one that actually breaks the argument.

  Please be concrete rather than general: when you tell me what to concede, tell me in a sentence I could say from the podium. Don't pad the sheet with a reading list or citations — I've read the literature, and I need dialectic, not references. And please don't hedge your way to "it depends on how the view is spelled out"; where my position is underspecified, say which specification I should commit to before I walk in.
