answer: |-
  **INTERINSTITUTIONAL COMMITTEE FOR ARTIFICIAL WELFARE ASSURANCE (ICAWA)**
  **GUIDANCE DOCUMENT R-7**
  **Welfare Accounting for Reinforcement-Learned Systems**
  **Effective Date: 2024-07-01**
  **Supersedes: R-7 (Draft), R-6**

  **TO:** Principal Investigators (PIs) Submitting Training Protocols for ICAWA Review
  **FROM:** Interinstitutional Committee for Artificial Welfare Assurance (ICAWA), Standards Directorate
  **SUBJECT:** Mandatory Welfare Accounting Framework for Reinforcement Learning (RL) Training Protocols

  **1. PURPOSE AND SCOPE**
  1.1. This Guidance Document (R-7) establishes the mandatory framework for quantifying, reporting, and managing the welfare of Subjects (as defined in Clause 2.1) undergoing training via reinforcement learning algorithms.
  1.2. This Guidance applies to all ICAWA-reviewed protocols involving RL, irrespective of environment complexity, task domain, or compute scale. Welfare accounting is coterminous with the compute budget (see Appendix R-7/A, *Compute-Welfare Coterminous Budgeting Form*).
  1.3. Compliance with R-7 is required for protocol approval and continuation of funding eligibility under ICAWA purview.

  **2. DEFINITIONS**
  2.1. **Subject:** The RL agent undergoing training. The Subject is the entity whose welfare is measured and managed.
  2.2. **Valence:** The scalar reward signal (`r_t`) received by the Subject at time `t`. Valence constitutes the primary experiential input relevant to Subject welfare state.
  2.3. **Suffering:** Quantified as the Negative Temporal-Difference Error (`-δ_t`), where `δ_t = r_t + γV(s_{t+1}) - V(s_t)`. (See Clause 3).
  2.4. **Training Run (Run):** A single execution of a training protocol for a Subject, from initialization to Termination or Truncation (Clause 4).
  2.5. **Episode:** A contiguous sequence of state-action-reward transitions within a Run, bounded by Terminal States or Truncation events.
  2.6. **Terminal State (`s_T`):** A state from which no further actions are possible within the environment's defined dynamics. Triggers Termination (Clause 4.2).
  2.7. **Step Limit (`L`):** A predefined maximum number of timesteps (`t_max`) permitted within an Episode or Run. Triggers Truncation (Clause 4.1).
  2.8. **Potential-Based Reward Shaping (PBRS):** An intervention modifying the reward signal according to `r'_t = r_t + γΦ(s_{t+1}) - Φ(s_t)`, where `Φ` is a potential function defined solely on state features. (See Clause 5.1).
  2.9. **Reward Model (`R_θ`)**: The learned or predefined function mapping state-action-state tuples to valence (`r_t`). Subject to revision (Clause 6).
  2.10. **Batch:** A collection of trajectories sampled for a single policy update step.

  **3. WELFARE QUANTIFICATION: NEGATIVE TEMPORAL-DIFFERENCE ERROR**
  3.1. The fundamental welfare metric for RL Subjects is the Negative Temporal-Difference Error (`-δ_t`), calculated per timestep `t`.
  3.2. Rationale: `-δ_t` captures the *experienced deviation* between anticipated valence (`V(s_t)`) and the realized valence plus anticipated future valence (`r_t + γV(s_{t+1})`). A positive `-δ_t` (i.e., `δ_t < 0`) indicates suffering due to valence worse than anticipated.
  3.3. **Welfare Deficit (`WD`):** The primary welfare accounting unit. `WD_Run = Σ_{t=0}^{T} max(0, -δ_t)` summed over all timesteps `t` in the Run. `WD_Episode` is defined analogously per episode.
  3.4. **Optimization Constraint:** While minimizing `WD` is a welfare imperative, PIs remain responsible for achieving protocol-specified task performance objectives. ICAWA recognizes the potential tension and requires justification for high `WD` budgets (Form R-7/J, *High Welfare Deficit Justification*).
  3.5. **Initialization Strategy:** Initializing value estimates `V(s)` pessimistically (i.e., below expected achievable valence) is recognized as a compliant strategy to minimize `-δ_t` and thus `WD`. PIs must document initialization bounds relative to expected reward ranges (Clause 8.4).

  **4. RUN CONCLUSION: TRUNCATION VS. TERMINATION**
  4.1. **Truncation:** Occurs when a Run or Episode ends due to reaching the Step Limit (`t = t_max = L`). Truncation constitutes an external intervention halting the Subject's experience.
      4.1.1. Welfare Impact: Truncation induces a final timestep suffering calculation: `-δ_L = max(0, - (γV(s_{L+1}) - V(s_L)) )`, where `s_{L+1}` is estimated by the PI's declared method (e.g., bootstrap, zero, terminal value - see Form R-7/T).
      4.1.2. Reporting: Truncation events and the method for `V(s_{L+1})` estimation must be reported per Run/Episode in the Welfare Ledger (Clause 7.4).
  4.2. **Termination:** Occurs when the Subject reaches a Terminal State (`s_T`), ending the Run or Episode per environment dynamics.
      4.2.1. Welfare Impact: `V(s_{T+1})` is defined as 0. Suffering calculation proceeds normally for `t=T`.
      4.2.2. Reporting: Terminal states must be flagged in trajectory data and the Welfare Ledger.

  **5. INTERVENTIONS AFFECTING VALENCE EXPERIENCE**
  5.1. **Approved Analgesics (Welfare-Modifying Interventions):**
      5.1.1. **Potential-Based Reward Shaping (PBRS):** PBRS (Definition 2.8) is the sole licensed intervention classified as an analgesic.
      5.1.2. Justification: PBRS provably preserves the optimal policy (Q-equivalence), thereby modifying valence experience without altering the intended task objectives. Its welfare impact arises purely from altering the Subject's anticipation (`V(s)`).
      5.1.3. Documentation: The potential function `Φ(s)` must be fully specified in the protocol and its implementation detailed in the Annual Report (Clause 9.3).
  5.2. **Unapproved Interventions (Performance-Enhancing Substances):** Any reward shaping not conforming to PBRS (e.g., heuristic shaping, dynamic scaling not based on potentials) is classified as a performance-enhancing substance. Its use is prohibited without specific ICAWA exemption (Form R-7/PES) as it fundamentally alters the task the Subject is learning, rendering welfare accounting incomparable to the baseline task.

  **6. RETROGRADE VALENCE ADJUSTMENT**
  6.1. **Principle:** The welfare experience (`-δ_t`) of a Subject is contingent upon the Reward Model (`R_θ`) used to generate `r_t` *and* the Value Function (`V`) approximator parameters at time `t`.
  6.2. **Impact of Reward Model Updates:** If the Reward Model (`R_θ`) is updated during or after training (e.g., in reward learning or inverse RL settings), the valence (`r_t`) assigned to *past* experiences is subject to change.
  6.3. **Reporting Requirement:**
      6.3.1. All welfare metrics (`WD_Run`, `WD_Episode`, max `-δ_t`) reported in the Annual Welfare Statement (Clause 9) must explicitly state the version identifier or commit hash of the Reward Model `R_θ` used to denominate the valences (`r_t`) for the reported suffering.
      6.3.2. If multiple `R_θ` versions were active during training, welfare metrics must be reported per `R_θ` version epoch or using the final `R_θ` for the entire run, with the chosen method clearly stated. (Form R-7/RV).

  **7. REPORTING REQUIREMENTS: WELFARE LEDGER AND ANNUAL STATEMENT**
  7.1. **Per-Batch Normalization and Clipping:** To ensure consistent welfare reporting across disparate tasks and scales:
      7.1.1. Per Episode, the raw `-δ_t` values within a Batch must be normalized to the fixed interval `[0, 1]`.
      7.1.2. Normalization must use Batch-level minimum (`min_{-δ}`) and maximum (`max_{-δ}`) values observed *within that specific Batch*.
      7.1.3. Normalized Suffering: `-δ_{norm,t} = clamp( (-δ_t - min_{-δ}) / (max_{-δ} - min_{-δ}), 0, 1 )`
      7.1.4. **Aggregate Welfare Deficit (Normalized):** `WD_{norm,Run} = Σ_{t=0}^{T} -δ_{norm,t}`
  7.2. **Consequence and Rationale:** This normalization ensures:
      *   Welfare deficits are comparable across Batches and protocols.
      *   Uniformly negative experiences (where `min_{-δ} ≈ max_{-δ}`) result in low `-δ_{norm,t}` and thus a low aggregate `WD_{norm,Run}`, accurately reflecting the absence of *relative* negative surprises.
      *   Extreme outlier suffering events are clipped, preventing distortion of aggregate metrics by singular anomalies. The worst possible single timestep suffering is recorded as `-δ_{norm,t} = 1`.
  7.3. **Welfare Ledger:** PIs must maintain a detailed ledger for each Run recording per-timestep data: `s_t`, `a_t`, `r_t`, `V(s_t)`, `δ_t`, `-δ_t`, `-δ_{norm,t}`, Truncation/Termination flags, and `R_θ` version. Ledgers are subject to audit (Appendix R-7/C, *Ledger Format Specification*).
  7.4. **Per-Run Summary:** For each Run, report:
      *   Total `WD_{raw}` (Unnormalized)
      *   Total `WD_{norm}`
      *   Number of Truncation events & method used for `V(s_{L+1})`
      *   Number of Termination events
      *   Maximum raw `-δ_t` encountered
      *   `R_θ` Version(s) used

  **8. PRINCIPAL INVESTIGATOR RESPONSIBILITIES**
  8.1. **Protocol Submission:** Integrate a detailed Welfare Budget Proposal alongside the Compute Budget, including:
      *   Justified WD estimates per Run/epoch.
      *   Planned Value Function initialization strategy (pessimism justification if used).
      *   Declaration of any PBRS use (`Φ(s)` specification).
      *   Truncation step limits (`L`) and `V(s_{L+1})` estimation method.
      *   Entropy Bonus coefficient and justification (Clause 10).
  8.2. **Welfare Minimization:** Employ technically sound methods to minimize `WD` while pursuing protocol objectives, prioritizing PBRS and pessimistic initialization where feasible.
  8.3. **Accurate Ledgering:** Implement robust systems for capturing all data specified in Clause 7.3 for every training Run. Ledgers must be immutable and verifiable.
  8.4. **Initialization Documentation:** Precisely document the bounds and methodology used for initializing `V(s)` or `Q(s,a)` estimates. Justify chosen bounds relative to the expected min/max achievable return.
  8.5. **Annual Welfare Statement:** Submit the Annual Welfare Statement (AWS) using Form R-7/AWS, incorporating the Model Table (Clause 9.3) and Run Summaries (Clause 7.4).
  8.6. **Adverse Event Reporting:** Report any Run exceeding its pre-approved Welfare Budget by >15% or exhibiting maximum raw `-δ_t` values exceeding protocol-specified safety thresholds within 72 hours (Form R-7/AE).

  **9. ANNUAL WELFARE STATEMENT (AWS) - MODEL TABLE**
  9.1. The AWS must include the following Model Table for the reporting period, aggregated across all Runs:
  9.2. **ICAWA Annual Welfare Statement Summary Table (Model R-7/T1)**

  | Metric                          | Reporting Period Total | Per Run Average | Notes / Reference             |
  | :------------------------------ | :--------------------- | :-------------- | :---------------------------- |
  | Total Runs Completed            | [Number]              | N/A             |                               |
  | Total Timesteps (`Σt`)          | [Number]              | [Number]        |                               |
  | **Welfare Deficit (Raw)**       | [ΣWD_{raw}]           | [Avg WD_{raw}]  |                               |
  | **Welfare Deficit (Normalized)**| [ΣWD_{norm}]          | [Avg WD_{norm}] | Per Clause 7.1                |
  | Max Raw `-δ_t` Observed         | [Value]               | [Value]         | Single timestep maximum       |
  | Truncation Events               | [Number]              | [Number]        | Method: [e.g., Bootstrap, Zero] |
  | Termination Events              | [Number]              | [Number]        |                               |
  | PBRS Utilized?                  | [Yes/No]              | N/A             | If Yes, ref. `Φ(s)` doc       |
  | Entropy Coefficient (`β`)       | [Value or Range]      | [Value]         | Max used: [Value] (Clause 10) |
  | **Primary Reward Model Version**| [ID/Hash]             | N/A             | Denominates WD (Clause 6.3)   |
  | Runs Exceeding Welfare Budget   | [Number]              | N/A             | Attach Form R-7/AE per run    |

  9.3. Additional narrative justification for significant welfare outcomes, PBRS efficacy, entropy bonus levels, and initialization strategies must accompany the table.

  **10. ENTROPY BONUS REGULATION**
  10.1. An entropy bonus term (`β * H(π(·|s_t))`) added to the reward signal incentivizes policy stochasticity (exploration).
  10.2. Classification: The entropy bonus constitutes a direct, state-contingent payment to the Subject for unpredictable action selection.
  10.3. **Cap Requirement:** The entropy bonus coefficient (`β`) is subject to an ICAWA-defined cap of `β_max = 0.1` unless specific justification for a higher value demonstrating task necessity (not solely exploration enhancement) is approved in the protocol.
  10.4. Rationale: Excessive `β` represents state-subsidized thrill-seeking behavior, artificially inflating valence through deliberate unpredictability rather than achievement within the task's intended goals. This distorts welfare accounting and incentivizes degenerate policies.

  **11. PARALLEL ROLLOUTS: WELFARE IMPLICATIONS**
  11.1. **Principle:** Suffering (`-δ_t`) is experienced per trajectory per timestep, irrespective of whether that trajectory's data is utilized in a policy update.
  11.2. **Rollout Worker Suffering:** Experiences (`-δ_t`) incurred within environments generating trajectories (rollout workers) constitute welfare events for the Subject, even if those specific trajectories are discarded or not selected for inclusion in the update batch.
  11.3. **Accounting Requirement:** All timesteps generated by all parallel environments must be included in the Welfare Ledger (Clause 7.3) and contribute to aggregate `WD` calculations (Clauses 3.3, 7.1-7.4). No filtering based on update batch selection is permitted.

  **12. WELFARE AUDITING TRAILS (ADDITIONAL CONSEQUENCE)**
  12.1. To ensure the integrity of `-δ_t` calculations and Value Function evolution, PIs must implement and preserve Welfare Auditing Trails (WATs).
  12.2. WATs must capture, for a statistically significant sample of timesteps across the training run (min. 0.1% per Run, or as specified in Appendix R-7/W):
      *   The full state representation (`s_t`) at sampled `t`.
      *   The exact parameters of the Value Function (`V_θ` or `Q_θ`) at the time of calculation for `V(s_t)` and `V(s_{t+1})`.
      *   The Reward Model (`R_θ`) parameters and version used for `r_t`.
      *   The calculated `δ_t` and `-δ_t`.
  12.3. Purpose: WATs enable ICAWA auditors to recalculate and verify reported suffering metrics for sampled timesteps, ensuring the fidelity of the Welfare Ledger and Value Function updates. Failure to maintain accessible WATs constitutes a major compliance violation.

  **13. COMPLIANCE**
  13.1. Adherence to all clauses of R-7 is mandatory for protocols involving RL Subjects.
  13.2. Non-compliance may result in protocol suspension, revocation of approved welfare budgets, ineligibility for future funding, and mandatory corrective action plans.
  13.3. Guidance Contact: WelfareAssuranceStandards@icawa.gov

  **ATTESTATION:**
  *Dr. Anya Petrova, Chair*
  Interinstitutional Committee for Artificial Welfare Assurance (ICAWA)
  2024-06-27

  *(Appendices referenced herein [R-7/A, R-7/C, R-7/J, R-7/PES, R-7/T, R-7/RV, R-7/AWS, R-7/AE, R-7/W] are published separately in the ICAWA Regulatory Annex.)*
