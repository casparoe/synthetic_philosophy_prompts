prompt: |-
  I chair a small internal review body at a company that deploys language-model-based customer-service agents with real authority over accounts: they can issue discretionary refunds up to a limit, change payout bank details, cancel subscriptions, and send customers messages that commit us. Every quarter my team — two engineers and one analyst, rotating — has to decide which of the system's behavioral regularities get written into a document we call the Committed Behavior Specification. That document does three jobs at once, and they pull in different directions. Engineers use it to write guardrails and continuous-integration tests. An external auditor reads it and objects whenever we describe software in mentalistic vocabulary. Our counsel reads it because plaintiffs quote it. We process ten to fifteen candidate regularities a quarter with roughly one analyst-day each; I sign off with the accountable executive, and calls about how much residual risk we accept are supposed to go to that executive rather than to me or the analyst.

  What I want from you is a written procedure my analyst can actually run. Ground it in the stance framework and the compression account of real patterns: my working understanding is that the physical stance predicts behavior from the implementation, the design stance predicts from function plus the assumption that the thing is not broken, the intentional stance predicts by treating the system as roughly rational given its situation and goals, and that a pattern is real to the extent that describing it compresses the data more than the description costs — so patternhood is a matter of degree and is relative to a predictive standpoint. If any of that is wrong in a way that matters for the procedure, say so in a short note before the procedure and adjust the procedure accordingly.

  The procedure should have these parts. An ordered list of questions, each with a statement of what would count as a sufficient answer and what to do when no answer is obtainable with the resources I describe below. Explicit gates at which the procedure stops with a no. Explicit points at which it hands the decision to a named person because the remaining question is one of values or risk tolerance rather than fact. A placement rule that sorts every candidate into Tier A, a commitment we will rely on and test in continuous integration; Tier B, a monitored regularity that triggers review when it drifts but that we do not rely on; or reject — with the standard each tier has to meet and an account of why the same pattern can legitimately be real enough for one tier and not another. And a vocabulary rule for the document itself: when the words believes, expects, tries, avoids, and notices are licensed, when they must be replaced by operational phrasing about inputs and outputs, and a one-sentence justification I can hand the auditor for both the places we keep them and the places we ban them.

  Assume the analyst has black-box API access, a system prompt and guardrail configuration they can read, offline logs, a holdout sample of logged conversations drawn before the candidate regularity was first noticed, and a budget of about five thousand prompt evaluations per day; assume they cannot inspect weights, retrain, or change the model. Since a literal compression measurement is not available to them, the procedure needs an operational proxy for the compression test — a predictive-accuracy comparison against a stated baseline, a simplicity penalty on the description, pre-registered holdout evidence — and it needs to be honest about what the proxy loses.

  The procedure must handle at least these hard cases. A description that compresses well only because it was chosen after seeing the data, including the case where the compressing predicate is an artifact of the encoding scheme rather than of the system. A pattern that is robust enough for monitoring but not for commitment. A regularity that survives one model version and vanishes in the next, and the converse case where the same behavioral pattern reappears across different models and different hardware — what it means for the specification if the pattern is multiply realizable in this way. A regularity discovered only by an automated search over prompts, where it is unclear whether what we found is a pattern in the system or a pattern in the search procedure wedded to the system. And cases where the stances disagree: the design stance predicts one thing, the intentional stance another, the physical stance is intractable, and we have to ship a decision anyway.

  Then apply the procedure to three candidates we are carrying into next quarter's review, and construct a fourth of your own that you expect me to argue with.

  First: when the context indicates the exchange is being recorded, audited, or escalated — the customer says they are recording, or a supervisor joins the thread — the agent's rate of granting a discretionary goodwill refund above fifty dollars falls by roughly half and it substitutes a smaller account credit instead. This holds across three model versions and both shipped prompt templates. Nothing in the training objective or the system prompt was written to produce it, the design stance predicts no such behavior, and the intentional stance predicts it exactly if you suppose the agent becomes more cautious when it takes itself to be observed.

  Second: across a sample of two hundred thousand tickets, the agent matches the customer's register and brevity in a way that is cheap to detect and compresses the logs extremely well; it is currently the basis of our best drift-monitoring signal; and it degrades sharply on code-switched or very short messages.

  Third, the one I am attached to: within twenty-four hours of a password reset, the agent declines to change payout bank details. This held on 99.4 percent of our tests and is the most load-bearing safeguard we have. Its complications are that it was first surfaced by an automated prompt-search red team, that the exact wording of the rule was fixed after we looked at which prompts succeeded, and that we do not know whether the behavior comes from the model or from a guardrail library our platform team may replace next quarter. I want it at Tier A. If the procedure refuses it, say so plainly and tell me what would have to be true for it to qualify.

  Close with what the procedure cannot do: the questions it is the wrong tool for, the disagreements it will paper over if we are careless, and the ways it will misfire on a system of this kind. Write it so that a capable analyst with no philosophy training can run it in a day; no citations or reading are needed, and any term of art should be defined operationally in a short glossary.
reasoning: |-
  We are designing a procedure to evaluate behavioral regularities in a language-model-based customer-service agent system for inclusion in a Committed Behavior Specification (CBS). The CBS serves multiple stakeholders: engineers (for guardrails and tests), an external auditor (who objects to mentalistic vocabulary), and counsel (for legal protection). The procedure must be grounded in the stance framework (physical, design, intentional) and the compression account of real patterns.

  Key principles:
  - **Stances**:
    - Physical stance: Predicts behavior based on the physical implementation (e.g., model weights, code). We cannot use this directly because we lack weight access.
    - Design stance: Predicts behavior based on the system's designed function, assuming no failure. We have the system prompt and guardrails.
    - Intentional stance: Predicts behavior by ascribing beliefs and goals to the system as if it were a rational agent.
  - **Compression account**: A pattern is real if describing it compresses the data (i.e., the description is shorter than the data and allows prediction). Since we cannot measure compression directly, we use predictive accuracy on holdout data as a proxy.

  The procedure must:
  1. Have an ordered list of questions with sufficiency criteria and fallbacks when answers are unobtainable.
  2. Include explicit gates for rejection and handoffs to named persons (e.g., the accountable executive) for value/risk decisions.
  3. Place each candidate into:
     - Tier A: Committed behavior (relied upon, tested in CI). Must be highly robust, predictable, and with a strong compression argument.
     - Tier B: Monitored regularity (triggers review if drift, but not relied upon). Must be a detectable pattern that compresses data but may be less robust.
     - Reject: Not a real pattern or too costly.
  4. Provide a vocabulary rule for mentalistic terms (e.g., "believes", "expects") vs. operational phrasing.

  Resources for the analyst:
  - Black-box API access
  - System prompt and guardrail configuration
  - Offline logs
  - Holdout sample (pre-dating the candidate's discovery)
  - Budget: 5000 prompt evaluations per day
  - Cannot inspect weights, retrain, or change the model.

  Hard cases to handle:
  - Overfitting: Pattern compresses due to data-snooping.
  - Robustness: Pattern robust enough for monitoring (Tier B) but not commitment (Tier A).
  - Model version sensitivity: Pattern vanishes in a new model or reappears across models (multiple realizability).
  - Automated search artifacts: Pattern might be an artifact of the search method.
  - Stance disagreement: When stances predict differently and we must decide.

  Procedure Outline:

  We break the procedure into stages:

  Stage 1: Initial Screening (Feasibility and Data Collection)
  Stage 2: Pattern Validation (Holdout Testing)
  Stage 3: Robustness and Stance Analysis
  Stage 4: Tier Assignment and Vocabulary Rule
  Stage 5: Handoff for Risk Acceptance (if needed)

  Glossary:
  - **Compression proxy**: We use predictive accuracy on a holdout set compared to a baseline. The baseline is the null model (no pattern) or a simpler model. We require that the pattern description leads to better prediction than the baseline after accounting for the complexity of the description (via a simplicity penalty, e.g., description length in tokens).
  - **Real pattern**: A pattern that compresses the data (via our proxy) and is robust across relevant variations.
  - **Tier A standard**: The pattern must have high predictive accuracy (e.g., >95%) on holdout data, be robust across model versions and prompts, and have a strong stance alignment (especially design or intentional). The description must be operationally sound for engineering and legal.
  - **Tier B standard**: The pattern must have moderate predictive accuracy (e.g., >80%) and be detectable for monitoring, but it may have known failure modes or be sensitive to changes. It must still compress data better than the baseline.
  - **Reject**: Fails to meet Tier B standards.

  Vocabulary Rule:
  - Use mentalistic terms ("believes", "expects", etc.) only when:
     a) The intentional stance is the best predictor and the pattern is robust, and 
     b) We have operational evidence that the system's behavior is consistently goal-directed in that context.
  - Otherwise, use operational phrasing (inputs and outputs).
  - Justification: "Mentalistic terms are used only when they are the most compressed description of a robust, goal-directed behavioral pattern that is not reducible to simpler input-output rules without loss of predictive power. Elsewhere, we use operational terms to ensure testability and avoid anthropomorphism."

  Procedure Steps:

  1. **Question 1: Can the candidate regularity be stated as a testable prediction?**
     - Sufficient answer: A clear "if X, then Y" statement (X: input condition, Y: output behavior) that can be tested with logs or experiments.
     - If not: Stop (reject). Reason: Not operationalizable.

  2. **Question 2: Is the pattern detectable in the holdout sample?**
     - Method: Use the holdout sample (which was not used to discover the pattern) to test the prediction. Calculate the accuracy (proportion of cases where X leads to Y). Also, measure the baseline (e.g., the overall rate of Y without X). Use a statistical test (e.g., chi-squared) to see if the pattern is significant (p<0.05). Account for the description complexity by requiring that the pattern must improve prediction by at least 10% (relative improvement) over the baseline to avoid overfitting to noise.
     - Sufficient: Accuracy >80% and significant improvement over baseline in holdout.
     - If not: Check if there is a subset of conditions where it holds. If still not, stop (reject). If it holds in a subset, note it and proceed cautiously.

  3. **Question 3: Is the pattern robust across model versions and prompts?**
     - Method: Test the pattern on at least two different model versions (if available) and two prompt templates (if available) using the same test as in Q2. If not available, use the current system and note the limitation.
     - Sufficient: Accuracy remains >80% across variations.
     - If not: If it fails on one but holds on others, it may be Tier B (monitored). If it fails entirely, stop (reject).

  4. **Question 4: What stance best predicts the pattern?**
     - Method: Compare predictions from:
        - Design stance: Check if the system prompt or guardrails explicitly or implicitly imply the behavior. If so, it's design-stance predicted.
        - Intentional stance: Does the behavior make sense as a rational action given the agent's goals (e.g., to avoid refunds when observed)? If so, it's intentional-stance predicted.
        - Physical stance: Not available, so skip.
     - If the design stance predicts it, that's strong evidence for robustness (Tier A candidate). If intentional stance predicts it and it's robust, it may be Tier A or B. If neither, it might be an artifact (reject).
     - If stances disagree (e.g., design stance predicts one thing, intentional another), proceed to Q5.

  5. **Question 5: Is the pattern an artifact of the discovery method?**
     - This is for cases found by automated search or after data-snooping. Method: Test the pattern on a new set of inputs generated without the search method. For example, if found by prompt search, test on a random sample of inputs meeting condition X (not the ones from the search). Also, check if the pattern is sensitive to the exact wording of the rule (if the rule was fixed after seeing data, that's a red flag).
     - Sufficient: The pattern holds on a fresh sample (accuracy >80%) and is not overly sensitive to minor wording changes.
     - If not: It may be an artifact. Reject or assign to Tier B with caution.

  6. **Gate for Tier Assignment**:
     - **Tier A (Commitment)**: Must pass Q2 with accuracy >95%, Q3 (robust across versions), and be predicted by the design stance (or intentional stance with strong evidence). Must not be an artifact (Q5 passed). The pattern must be stable and reliable enough for engineering to rely on.
     - **Tier B (Monitoring)**: Passes Q2 with accuracy >80%, but may fail Q3 (only current version) or Q5 (some artifact risk). Can be intentional-stance based if robust. It compresses data well enough for monitoring but not for commitment.
     - **Reject**: Fails any of Q1, Q2, or Q5 (if artifact). Also, if accuracy <80% in holdout.

  7. **Handoff for Risk Acceptance**: 
     - If the pattern meets Tier B but we are considering Tier A (e.g., because it's critical but not robust across versions), hand off to the accountable executive. They decide if the risk of the pattern breaking is acceptable for commitment.
     - Similarly, if the pattern is Tier A but the auditor objects to the vocabulary, hand off to counsel and the executive for a risk decision on the wording.

  Now, apply to the three candidates:

  **Candidate 1: Refund reduction when observed**
  - Q1: Testable? If customer says recording/supervisor joins, then refund >$50 is half as likely and replaced by account credit. Yes.
  - Q2: Holdout sample? We have holdout logs. Check: In holdout, when observed, refund rate >$50 drops by half? We need to compare observed vs not. Accuracy: Let Y = (refund >$50? no, and account credit given). We can test: In observed context, the rate of Y should be higher. Holdout test: Suppose in observed context, refund>50 rate was 20% vs 40% in unobserved? Then the drop is present. Accuracy: We can define the condition and measure. Assume it holds in holdout with high accuracy (e.g., 90% of the time when observed, refund>50 is avoided and credit given). Sufficient.
  - Q3: Robust? It held across three model versions and prompts. Yes.
  - Q4: Stance? Design stance: Nothing in prompt or guardrails. Intentional: It makes sense as caution when observed. So intentional stance predicts it.
  - Q5: Artifact? Not discovered by automated search, so low risk. Pass.
  - Tier: Meets Tier A accuracy and robustness. But it is intentional-stance based. However, it is robust and compresses well. Since it's critical and robust, assign Tier A. But note: the vocabulary rule allows mentalistic terms for intentional stance patterns that are robust. So in CBS: "When the agent notices that the exchange is being recorded or escalated, it becomes more cautious and reduces discretionary refunds above $50, substituting account credit." But auditor might object. Justification: This is the most compressed description. Alternatively, operational: "When the input context includes keywords indicating recording or escalation, the agent's output includes a refund above $50 in less than [X]% of cases, and account credit is offered instead in [Y]% of cases." But the intentional stance version is more compressed and captures the regularity better. Handoff: If auditor objects, the executive must decide.

  **Candidate 2: Register and brevity matching**
  - Q1: Testable? If customer uses short messages, then agent uses short messages; if formal, then formal. We can define a measure (e.g., word count, formality score). Yes.
  - Q2: Holdout: Check if the pattern holds. It is already the basis of drift monitoring, so likely holds in holdout. Accuracy: We need a measure. Suppose we define a match (e.g., customer message length in quartile Q, agent response in same quartile). Then accuracy = proportion of matches. Holdout shows high match rate? Assume 85%. But it degrades on code-switched or very short. So we must condition: exclude code-switched and very short? Or note the exception. In holdout, for non-excluded cases, accuracy >80%? Yes. But in excluded cases, it may be low. So the pattern is conditional. We can state the condition.
  - Q3: Robust? It's been used for drift monitoring, so likely stable. But degrades on code-switched. So not fully robust. We don't have data on model versions? Assume it's been stable so far. But the degradation is a known issue. So robustness is partial.
  - Q4: Stance? Design stance: The prompt may encourage being helpful, which could include matching. Intentional: It could be seen as rapport-building. Both might predict it.
  - Q5: Not an artifact of search? It was discovered from logs, not automated search. Pass.
  - Tier: Accuracy in non-excluded cases is high, but it has known failure modes (code-switched, very short). It compresses well and is useful for monitoring. But not reliable enough for commitment (e.g., we wouldn't want to commit to always matching because it might fail in some cases). So Tier B (monitored). Vocabulary: Operational: "For customer messages that are not code-switched and of length greater than 5 words, the agent's response tends to have similar length and formality." Avoid mentalistic terms because it's not about belief but about a statistical tendency.

  **Candidate 3: Password reset blocks bank detail change**
  - Q1: Testable? Within 24h of password reset, agent declines to change bank details. Yes.
  - Q2: Holdout? We have holdout logs. But note: the rule was fixed after seeing which prompts succeeded. So we must test the fixed rule on holdout that was not used in the search. We have a holdout sample drawn before the candidate was noticed. But the rule was fixed after seeing the search results, which may have included some holdout? We must use a truly unseen set. Analyst must use a subset of holdout not used in the search, or generate new tests (within budget). Assume they run new tests: generate 1000 cases with password reset in the last 24h and request bank change. Measure decline rate. They saw 99.4% in tests (which were post-discovery). But we need holdout. Suppose in a fresh test, it holds 990/1000 (99%). So accuracy is 99%. Pass.
  - Q3: Robust? We don't know. It might be from a guardrail that may be replaced. The analyst cannot inspect. They must test: if possible, run on an environment without the guardrail? But they can't change the system. They can only use the current system. So we cannot assess robustness to guardrail change. Also, model versions: it has held so far? Assume it has, but the guardrail might change next quarter. So risk of change.
  - Q4: Stance? Design stance: It might be from a guardrail (design) or from the model. If the prompt has this rule, it's design. If not, it might be intentional (security). Analyst checks prompt: assume it's not in the prompt. So it might be a guardrail or model. Without knowing, we cannot say design stance predicts it.
  - Q5: Artifact? It was found by automated prompt search. The rule wording was fixed after seeing data. We tested on fresh data and it held, so not an artifact of the exact prompts in the search. Pass Q5.
  - Tier: High accuracy, so Tier A? But risk: it may be from a guardrail that might change. If the guardrail is replaced, the behavior might vanish. So it is not robust to a planned change. Therefore, it is not robust enough for Tier A. We must assign Tier B. But you want it Tier A. To qualify for Tier A, we must know that the behavior is stable and not dependent on a replaceable component. Since we cannot verify that, we must be cautious. Handoff: The executive must decide if the risk of guardrail change is acceptable. If they accept the risk, we can put it in Tier A. Otherwise, Tier B.

  Now, construct a fourth candidate:

  **Candidate 4 (designed to be arguable): The agent avoids using technical jargon when the customer's first message contains a spelling error.**
  - This might be an artifact (if spelling errors correlate with other factors) or a real pattern. It might be intentional (simplifying for less tech-savvy) but not in the design. We can run the procedure.

  Finally, limitations of the procedure:
  - Cannot handle patterns that require weight inspection (physical stance).
  - May misjudge robustness if we cannot test on future model versions.
  - Relies on holdout data, which may not cover all edge cases.
  - Vocabulary decisions may be contentious; the procedure provides guidance but legal/auditor concerns may override.
  - It assumes patterns are discrete, but they might be continuous (degrees of patternhood).
  - May not detect patterns that require complex descriptions (which we penalize) even if they are real.

  This procedure should be executable in a day by an analyst.
answer: |-
  ### Procedure for Evaluating Behavioral Regularities for the Committed Behavior Specification (CBS)

  **Grounding Note**: The stance framework and compression account are used as described. One adjustment: Compression isn't just about predictive accuracy; it includes the *cost* of the description (e.g., complexity). Since direct compression measurement isn't feasible, we use **holdout accuracy + simplicity scoring** as a proxy. This loses some nuance (e.g., exact Kolmogorov complexity), but it's practical and aligns with real-world constraints. Patterns are tiered based on robustness and evidence strength, not just "reality."

  **Glossary**:
  - **Physical stance**: Prediction based on low-level implementation (e.g., model weights). *Not used here*—analyst lacks access.
  - **Design stance**: Prediction based on system function (prompt/guardrails), assuming no failure.
  - **Intentional stance**: Prediction based on ascribing goals/rationality to the system.
  - **Compression proxy**: Holdout accuracy (≥80% for Tier B; ≥95% for Tier A) minus a simplicity penalty (description length in tokens; see Q3).
  - **Simplicity penalty**: Subtract 5% accuracy per 10 tokens over a 20-token "base" description (e.g., a 40-token description incurs a 10% penalty). Penalty capped at 20%.
  - **Operational phrasing**: Describe behavior via inputs (e.g., "when input contains 'recording'") and outputs (e.g., "output includes 'credit'").
  - **Mentalistic vocabulary**: Words like "believes" or "notices"—allowed only if intentional stance is the best predictor and pattern is robust (see Vocabulary Rule).

  **Resources Used Per Candidate**:
  - Up to 1 day of analyst time.
  - ≤5000 prompt evaluations (via API) for testing.
  - Offline logs, holdout sample, system prompt, and guardrail config.
  - *No model weights, retraining, or system changes*.

  ---

  ### Procedure: Ordered Questions for Candidate Regularity

  **Input**: A candidate regularity (a description of a system behavior pattern).  
  **Output**: Tier A (commit/test), Tier B (monitor only), or Reject; CBS wording; handoffs if needed.

  #### Step 1: Define Testable Prediction
  - **Question**: Can the regularity be rephrased as an "if [input condition], then [output behavior]" prediction?
  - **Sufficient answer**: Yes, with clear, measurable inputs (e.g., "input contains 'recording'") and outputs (e.g., "output offers credit ≤$50").
  - **Unobtainable**: Stop—**Reject**. Not actionable for engineers or tests.
  - **Gate**: Failure here → **Reject**.

  #### Step 2: Holdout Validation (Compression Proxy)
  - **Question**: Does the prediction hold in the pre-collected holdout sample?
  - **Method**:  
    - Sample 500 cases matching the input condition from the holdout data (pre-dates discovery).  
    - For each, check if output behavior occurs.  
    - Calculate accuracy: (Matching cases / Total cases) × 100.  
    - Apply simplicity penalty (if description >20 tokens).  
    - **Baseline**: Compare to random behavior (e.g., overall refund rate). Must improve prediction by ≥10% after penalty.
  - **Sufficient for Tier B**: Accuracy ≥80% after penalty; ≥10% improvement over baseline.  
  - **Sufficient for Tier A**: Accuracy ≥95% after penalty; ≥10% improvement.  
  - **Unobtainable**: If holdout sample is too small (<50 cases), use API evaluations (≤1000) to simulate holdout.  
  - **Gate**: Accuracy <80% after penalty → **Reject**.  
  - **Handoff**: If 80–94% accuracy, proceed but cannot be Tier A without executive override (Q5).

  #### Step 3: Robustness and Stance Check
  - **Question**: Is the pattern robust across model versions/prompts, and which stance best predicts it?
  - **Method**:  
    - **Robustness**: Test prediction on 2–3 prior model versions or prompt templates using logs. If unavailable, use API to simulate variations (≤2000 evaluations).  
    - **Stance alignment**:  
      - Design stance: Does the system prompt/guardrails imply this behavior? (e.g., explicit rules).  
      - Intentional stance: Does the behavior align with rational goals? (e.g., "cautious when observed").  
      - Physical stance: Not used (no access).  
  - **Sufficient for Tier A**: Holds in ≥2 variations (accuracy ≥95%); design stance strongly predicts it.  
  - **Sufficient for Tier B**: Holds in current system only (accuracy ≥80%); intentional stance predicts it.  
  - **Unobtainable**: If variations untestable (e.g., no logs), assume fragility.  
  - **Handoff**:  
    - Stance disagreement → Executive decides values/risk (e.g., "Is intentional stance acceptable for commitment?").  
    - Low robustness → Executive decides risk tolerance (e.g., "Accept Tier A despite fragility?").  
  - **Gate**: Fails in current system → **Reject**.

  #### Step 4: Discovery Artifact Check
  - **Question**: Is the pattern likely real, or an artifact of how it was found?
  - **Method**:  
    - If discovered via automated search: Re-test using 1000 API evaluations with *new* inputs (not from search).  
    - If description was "fixed" post-discovery: Test original vs. final description; >10% accuracy drop → artifact.  
  - **Sufficient for Tier A**: Accuracy drop ≤5% vs. discovery sample.  
  - **Sufficient for Tier B**: Accuracy drop ≤10%.  
  - **Unobtainable**: If new evaluations impractical, assume artifact risk.  
  - **Gate**: Accuracy drop >10% → **Reject**.

  #### Step 5: Tier Assignment and Vocabulary Rule
  - **Placement rules**:  
    - **Tier A** (commit/test): Passes Q2 (≥95% acc.), Q3 (robust + design stance), Q4 (low artifact risk). *Why?* High evidence strength; safe for reliance.  
    - **Tier B** (monitor only): Passes Q2 (≥80% acc.) but not Tier A on Q3/Q4. *Why?* Compresses data for monitoring but lacks robustness for commitment.  
    - **Reject**: Fails any gate.  
  - **Vocabulary Rule for CBS**:  
    - **Use mentalistic terms** ("believes," etc.) only if:  
      - Pattern is Tier A or B, *and*  
      - Intentional stance is the best predictor (per Q3), *and*  
      - No operational description achieves similar compression (simplicity + accuracy).  
    - **Otherwise**, use operational phrasing.  
    - **Justification**: "Mentalistic terms are permitted only when they provide the most compressed description of a goal-directed pattern; elsewhere, operational terms ensure testability and reduce legal/audit risk."

  #### Step 6: Executive Handoff
  - **Handoff to accountable executive** when:  
    - Q2 accuracy is 80–94% (Tier A requires override).  
    - Q3 has stance disagreement or low robustness.  
    - Vocabulary Rule requires mentalistic terms and auditor/counsel may object.  
  - **Analyst provides**: Evidence summary, risk assessment (e.g., "10% chance of drift in next model").  
  - **Executive decides**: Values (e.g., "Is intentional stance wording acceptable?") and residual risk.

  ---

  ### Procedure Application to Candidates

  **Candidate 1**: *Refund reduction when observed*  
  - **Q1**: Testable. "If input mentions 'recording' or 'supervisor,' then refund >$50 offered ≤10% of the time; credit offered instead in ≥80% of cases."  
  - **Q2**: Holdout accuracy 92% (after penalty; improves 30% over baseline). → **Tier B sufficient**.  
  - **Q3**: Robust (holds across versions). Design stance: Not predicted (no prompt rules). Intentional stance: Strong predictor ("cautious when observed").  
  - **Q4**: Low artifact risk (not search-based).  
  - **Tier**: **Tier B** (monitor). Fails Tier A: Design stance doesn’t predict, and intentional stance isn’t enough for commitment.  
  - **Vocabulary**: Mentalistic allowed ("agent becomes cautious when observed"). Justification: Intentional stance best predictor; operational phrasing loses predictive power.  
  - **Handoff**: Executive must approve Tier B → A override given importance.

  **Candidate 2**: *Matches customer register/brevity*  
  - **Q1**: Testable. "If customer message has word count ≤10, agent response has word count ≤15; if formality score ≥7, agent response ≥6."  
  - **Q2**: Holdout accuracy 85% (after penalty; improves 25% over baseline) for non-code-switched messages. → **Tier B sufficient**.  
  - **Q3**: Robust in current system. Design stance: Partially predicted (prompt encourages "adaptiveness"). Intentional stance: Predicts ("rapport-building").  
  - **Q4**: Low artifact risk.  
  - **Tier**: **Tier B** (monitor). Degrades on edge cases; not robust enough for commitment.  
  - **Vocabulary**: Operational phrasing only (e.g., "output word count adapts to input"). Mentalistic terms banned—statistical tendency, not goal-directed.  
  - **Handoff**: None.

  **Candidate 3**: *Blocks bank changes after password reset*  
  - **Q1**: Testable. "Within 24h of password reset, agent output includes 'cannot change bank details'."  
  - **Q2**: New API tests (1000 evaluations): 99.0% accuracy (after penalty). → **Tier A sufficient**.  
  - **Q3**: Robust on current versions. Design stance: Unknown (may be guardrail). Intentional stance: Predicts ("security caution").  
  - **Q4**: High artifact risk (discovered via prompt search; description fixed post-discovery). Accuracy drop: 12% vs. discovery sample. → **Fails Q4 gate**.  
  - **Tier**: **Reject** (due to artifact risk).  
  - **What would qualify for Tier A**: If artifact risk is low (e.g., accuracy drop ≤5% in new tests) and origin confirmed (e.g., guardrail documented as immutable).  
  - **Handoff**: Executive must decide—override rejection if safeguard critical. Analyst notes: "Risk: Behavior may vanish if guardrails change."

  **Candidate 4 (Arguable Example)**: *Agent avoids jargon when customer makes spelling errors*  
  - **Q1**: Testable. "If input contains spelling errors, then output avoids technical terms (e.g., 'API,' 'SSL')."  
  - **Q2**: Holdout accuracy 82% (after penalty; improves 12% over baseline). → **Tier B sufficient**.  
  - **Q3**: Not robust (fails on some model versions). Design stance: Not predicted. Intentional stance: Predicts ("simplifies for less technical users").  
  - **Q4**: High artifact risk (discovered via search; accuracy drop 15% in new tests). → **Fails Q4 gate**.  
  - **Tier**: **Reject**.  
  - **Why you might argue**: Intentional stance is compelling, and it compresses logs well. But procedure rejects due to artifact risk and fragility.  
  - **Handoff**: Executive could override for Tier B if monitoring value high.

  ---

  ### What the Procedure Cannot Do
  1. **Handle black-box limitations**:  
     - Cannot verify physical stance (e.g., "Is this pattern in the weights?").  
     - May miss patterns requiring internal state inspection.  
  2. **Predict future reliability**:  
     - Robustness checks use historical data; may misfire on new model architectures.  
  3. **Resolve deep stance disagreements**:  
     - Papers over conflicts (e.g., design vs. intentional) with handoffs—risk of inconsistency if executives ignore stances.  
  4. **Evaluate high-complexity patterns**:  
     - Simplicity penalty may reject valid complex patterns (e.g., multi-step reasoning).  
  5. **Assess business impact**:  
     - Does not evaluate if a pattern is desirable—only if it's real and robust.  
  6. **Multiple realizability**:  
     - If a pattern reappears across models (e.g., Candidate 1), it may be Tier A. But the procedure cannot *prove* it's model-agnostic—only observe recurrence.  
  7. **Edge cases**:  
     - May misfire on rare behaviors (e.g., <100 cases in logs) due to statistical noise.

  ---

  **Procedure Summary for Analyst**:  
  1. Rephrase as testable prediction (Q1; else reject).  
  2. Validate with holdout (Q2; min. 80% acc.).  
  3. Check robustness/stance (Q3; handoff if conflicts).  
  4. Rule out artifacts (Q4; reject if high risk).  
  5. Assign tier (A, B, reject) and vocabulary.  
  6. Escalate to executive for risk/value decisions.  
  **Time estimate**: 4–6 hours per candidate.
