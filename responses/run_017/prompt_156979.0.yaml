answer: |-
  Your methodological concerns are profound and reflect crucial tensions in historical epistemology. Let's address each hesitation systematically, then tackle the framing question:

  ### 1. **Conditioning vs. Bias: The Measurement Problem**
     - **Core Issue**: You correctly identify the confusion. Hindsight bias *isn't* simply assigning high probability to what happened. It’s the *overestimation* of that probability relative to what was reasonably knowable *before* the outcome.
     - **The Quantity**: You’re measuring **ΔP = P(Outcome|Ex Ante Evidence) - P(Outcome|Actual Historical Knowledge)**.  
       - Your task is to reconstruct **P(Outcome|Ex Ante Evidence)** using *only* information available *at the decision point* (e.g., Bethmann Hollweg’s July 6 "blank cheque" assessment using documents up to July 5).  
       - The "bias score" is the *excess certainty* you inadvertently impose by knowing the outcome (e.g., assigning P=0.9 to Russian mobilization when contemporary evidence suggested P=0.6).  
     - **Mitigation**: Rigorously exclude knowledge of later events. Use diaries, meeting minutes, or intelligence reports dated *before* the outcome. Treat your ex ante estimate as a Bayesian prior uninformed by subsequent realities.

  ### 2. **Justified Gaps: Structural Constraints vs. Contingency**
     - **Your Insight is Valid**: Some outcomes *were* highly probable due to structural factors (e.g., Schlieffen Plan logistics). Driving all ΔP → 0 *would* flatten history into pure contingency.  
     - **Solution**: Distinguish **constraint-driven certainty** from **hindsight inflation**.  
       - For binding constraints (e.g., mobilization timetables), cite period sources *proving* decision-makers saw few alternatives (e.g., Moltke’s 1913 memos). ΔP ≈ 0 here is methodologically sound.  
       - Flag nodes where constraints *appeared* rigid but alternatives existed (e.g., "Why didn’t Germany modify the Schlieffen Plan?"). Here, ΔP > 0 may indicate bias.  
     - **Output**: Your chapter becomes a map of *varying* determinacy—highlighting where war was overdetermined (ΔP ≈ 0) vs. truly contingent (ΔP > 0 justified).

  ### 3. **Archival Contamination: The Documentary Filter**
     - **Problem is Real**: Surviving records are post-hoc curated. Memoirs suppress alternatives; telegrams are retained for blame-shifting.  
     - **Mitigation Strategies**:  
       - **Triangulate**: Use sources immune to outcome-knowledge (e.g., real-time press, economic data, military timetables).  
       - **Absence as Evidence**: Note *silences* in archives (e.g., lack of Austrian contingency plans for Serbian capitulation suggests P(capitulation) was underestimated).  
       - **Confessional Bias**: Treat admissions of uncertainty in private letters as proxies for genuine ex ante doubt (e.g., Grey’s July 26 letter doubting British intervention).  
     - **Reframe the Metric**: Your "discrepancy score" now measures *how the evolving documentary record distorts rational ex ante assessment*—itself a historiographical insight.

  ### 4. **Node Selection: The Hidden Narrativity**
     - **The Dilemma**: Choosing nodes/arrows implicitly imposes causality. Your supervisor’s "de-narrativized" graph is itself a narrative—just a sparse one.  
     - **Principles for Selection**:  
       - **Actor-Centered**: Nodes = concrete decisions by identifiable agents (e.g., "Austro-Hungarian Council of Ministers votes for ultimatum on July 19").  
       - **Contemporaneous Salience**: Include events actors *themselves* highlighted as pivotal (e.g., German Kaiser’s "halt in Belgrade" note on July 28).  
       - **Path-Dependence**: Nodes must satisfy counterfactual dependence (e.g., "If Poincaré hadn’t left St. Petersburg on July 23, would Sazonov have acted differently?").  
       - **Empirical Bounds**: Use crisis chronology from primary sources (e.g., diplomatic dairies, cabinet agendas) to avoid arbitrary inclusions.  

  ### Framing Question: Is Narrative Fallacy = Scaled Hindsight Bias?
     - **No**. They intersect but aren’t identical:  
       - **Hindsight Bias** distorts *judgments* about past probabilities.  
       - **Narrative Fallacy** imposes *causal coherence* on complex events, privileging linearity and agency over chaos/structural factors.  
     - **De-narrativization *can* mitigate both, but risks oversimplification**. Your causal graph may still imply inevitability if nodes are too sparse. Conversely, rich narratives *can* avoid fallacy by emphasizing contingency, multiple perspectives, and dead ends (e.g., T.G. Otte’s July Crisis work).  

  ### Recommendations for Compliance & Integrity
  1. **Clarify Definitions**: In your methodology appendix, explicitly define:  
     - Hindsight bias = ΔP > 0 *without* structural justification.  
     - Narrative fallacy = imposition of teleology/coherence absent in lived experience.  
  2. **Use "Bias Scores" Heuristically**: Report ΔP values but interpret gaps critically. A high ΔP at "Russian Mobilization" may reflect *genuine* contemporary underestimation of resolve, not *your* bias.  
  3. **Visualize Contingency**: Structure your graph to branch at key nodes (e.g., "Serbia Accepts Ultimatum: P=0.2"). Use quantitative ranges (e.g., "P(Mobilization|Blank Cheque) = 0.6–0.8 based on attaché reports").  
  4. **Narrate the Graph**: In a companion essay, explain how your nodes expose the *fragility* of the crisis. Example:  
     > "The July 28 Austrian declaration of war (Node 17) had ex ante P=0.95—not from bias, but because Franz Joseph’s ministers saw no alternative after July 23. Yet at Node 12 (July 21), P(Declaration) was 0.4: contingency lay in *earlier* missed opportunities for mediation."  

  Your approach is methodologically innovative. By rigorously defending where ΔP ≠ 0 is *historically justified*—not just bias—you can satisfy your supervisor while advancing a sophisticated critique of historical causality. The July Crisis *was* overdetermined at some points and chaotic at others; your tool can reveal this texture better than a conventional narrative.
