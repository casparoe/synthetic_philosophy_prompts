answer: |-
  ## The Bank Between Seven and Eight

  The mower circles round the stubborn **hedge**,  
  A boundary no record can explain.  
  What was its first intent? What present **use**  
  Persists? The young statisticians, keen but **dead**  
  To history's silt, propose to sweep away  
  Each unexplained contour. Let the new design **drift**  

  From random seeds. But memory will **drift**  
  Back to that bank. Was it a windbreak **hedge**,  
  Or meant to divert a forgotten spring, to **away**  
  Channel the runoff? Notebooks don't **use**  
  That page. The old technician, long since **dead**,  
  Knew where the water lay. He knew the **why**  

  Of certain wet spots. Ask the living **why**  
  This bank remains, and reasons slowly **drift**  
  Like silt in current. Was its maker **dead**  
  Before I came? Or did some urgent **hedge**  
  Against erosion, rabbit, wind, find **use**  
  Then fade, while moss secured its stay?  

  The purpose lapsed. Yet something else might **stay**  
  And claim the form. The bindweed finds its **why**  
  In any upright thing. A pheasant's **use**  
  For cover turns the bank from purposeless **drift**  
  To shelter. Function shifts, a living **hedge**  
  Adapts where rigid reason’s plans lie **dead**.  

  Consider too the dome’s support, now **dead**  
  Stone triangles left behind, that **stay**  
  As artifact. Perhaps no mind decreed this **hedge**  
  For function. Maybe drainage ditches, **why**  
  They curved just so, left earth to **drift**  
  Into this line, a consequence, not **use**.  

  Or darker: was this bank designed for **use**  
  Against the tenant? Keep *them* out? The **dead**  
  Builder’s intent, a barrier meant to **drift**  
  Ownership lines, a power meant to **stay**  
  Unquestioned? History’s silent **why**  
  Can wear the harmless mask of **hedge**.  

  The vanished hands that dared to shift a **gate**,  
  Or level such a bank? Their reasons **dead**  
  With them. We only see the walls that **stay**,  
  The fences standing. Skewed the sample: **why**  
  We only trust the structure. Let the **drift**  
  Of seasons test what keeps its quiet **use**.  

  **Envoi**  
  The blade swings near. What **use** persists? What’s **dead**?  
  Through seasons, reason’s lines will **drift** and sway.  
  Beyond the **hedge**, the open **gate**... but **why**?
