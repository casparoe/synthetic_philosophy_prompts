answer: |-
  ### Thought Experiment Design
  **Core Insight**: The operative variable is the **presence of a viewpoint-dependent invariant** tied to the object's identity. Your instinct about accidental invariants (e.g., shadows, resting states) is astute: the cube-and-sphere test often includes such cues, making successes evidentially ambiguous. I adopt this but refine it to isolate cross-modal transfer of *figure* from inference-based matching. The common-figure view holds that spatial structure (e.g., topology, symmetry) is inherently cross-modal, while the heterogeneity view denies this, allowing only inference from *learned* features. The design below uses **topology** as the invariant, as it is (1) naturally encountered haptically, (2) visually detectable without training, and (3) manipulable via viewpoint to create the critical contrast.

  **Objects**:  
  - **Object A**: A torus (solid ring shape; genus-1 topology).  
  - **Object B**: A sphere (genus-0 topology).  
  Both are 10 cm in diameter, made of identical smooth white plastic, unfamiliar to the patient, and unnamed (referred to only as "Object 1" and "Object 2" during haptic training). The torus has a hole (diameter 3 cm), detectable haptically by finger insertion.  

  **Pre-session Screening** (conducted before probes):  
  - **Haptic screening**: Patient handles Objects A and B (without vision) in randomized order for 10 trials. Task: "Which is Object 1?" (e.g., torus). Pass criterion: ≥90% correct.  
  - **Visual screening**: Patient views *four* objects: two identical tori (A1, A2) and two identical spheres (B1, B2), presented in pairs on a neutral gray table. Task (with feedback): "Are these two objects the same or different?" Trials: (A1+A2), (B1+B2), (A1+B1), (A2+B2), randomized. Pass criterion: Correct on all "same"/"different" judgments. This establishes visual discriminability *without* pairing to haptic labels.  

  **Session Protocol**:  
  1. After dressings removed, patient undergoes 10 minutes of *purely visual training* (with feedback) on **within-vision discriminations** using *novel* objects (e.g., cube vs. cylinder). This trains basic visual parsing (edges, curves) but involves no cross-modal pairing or test objects.  
  2. Probes are administered in fixed order (Probe 1 then Probe 2), single trial each, no feedback. Objects are concealed until trial start and never touched.  

  ---

  ### Probe 1: Viewpoint Revealing the Topological Invariant  
  **Scene**:  
  Objects A (torus) and B (sphere) rest on a table 50 cm from the patient, illuminated evenly to minimize shadows. The torus is oriented with its hole perpendicular to the line of sight, making the hole clearly visible. The sphere rests naturally. Patient is asked: "Point to Object 1" (haptic label for torus).  

  **Predictions & Reasoning**:  
  - **Heterogeneity view (Locke-Berkeley)**: **Predicts success**. The visible hole is a discrete feature the patient knows haptically (via finger insertion). They infer: "Object 1 has a hole; I see a hole; this must be Object 1." This is *inference*, not transfer—ideas of sight/touch remain heterogeneous, but the hole's salience allows cognitive matching. The view endorses this because inference uses *contingent* sensory features (hole = "tactual idea X" + "visual idea Y"), learned afresh from the visual scene.  
  - **Common-figure view**: **Predicts success**. The hole is part of the torus's figure (topology), which is inherently cross-modal. The patient recognizes the torus's genus-0 topology visually because spatial structure is common to both senses.  

  ---

  ### Probe 2: Viewpoint Concealing the Topological Invariant  
  **Scene**:  
  Objects A and B are suspended 50 cm from the patient by thin, clear wires inside a glass-fronted enclosure. The torus is rotated 90° so the hole is edge-on to the line of sight (occluded), appearing as a solid disk. The sphere is identically suspended. Lighting is diffuse to eliminate shadows. Patient is asked: "Point to Object 1."  

  **Predictions & Reasoning**:  
  - **Heterogeneity view**: **Predicts chance (50%)**. With the hole occluded, no distinctive visual feature (e.g., hole, shadow) remains for inference. The visible shapes ("disk" and "sphere") are novel visual ideas unconnected to haptic experiences. Without prior visual learning, the patient guesses.  
  - **Common-figure view**: **Predicts better-than-chance success**. Topology is intrinsic to the object's figure, not viewpoint-dependent. The torus's ring-like global structure (e.g., curvature, concavity) remains visually detectable and matches the haptically known figure. Recognition is immediate and direct.  

  ---

  ### Key Features and Adjustments  
  **Operative Variable**: **Visibility of the topological invariant (hole)**. Probe 1 reveals it; Probe 2 conceals it.  
  - **Why topology?** It is a structural invariant (per your symmetry background) that is (a) haptically accessible (hole = tactile discontinuity), (b) visually detectable without training, and (c) not reliant on accidental cues like shadows. It isolates figure-transfer from inference.  
  - **Contrast if removed**: Without this variable (e.g., both probes with hole visible), the design collapses to the standard cube/sphere test. Successes could be attributed to inference *or* common figure, evading discrimination.  

  **Strongest Objection (from common-figure view)**:  
  "The suspended torus in Probe 2 still exhibits non-spherical curvature (e.g., elongated silhouette), which the patient could infer from haptic memory of 'ring shape'—so heterogeneity might still predict success."  
  - **Modification to blunt**: Use a **thick torus** (hole diameter << overall diameter) and rotate it to present a near-circular silhouette. Add a distractor task (e.g., count dots on a wall) to prevent prolonged scrutiny. This minimizes curvature cues, forcing reliance on topology/figure.  
  - **Residue**: Cannot eliminate all non-topological cues (e.g., minor asymmetry), but screening ensures the patient lacks verbal/visual descriptors. The design tests *immediate* recognition, not learned inference.  

  **Third Position (Sensorimotor Account)**:  
  - **Predictions**: Sensorimotor theories (e.g., O’Regan, Noë) hold that perception depends on mastery of sensorimotor contingencies. They would predict **failure on both probes** because the patient, lacking visual experience, cannot "enact" the objects' sensorimotor profiles (e.g., how visual input changes with movement).  
  - **Structural Divergence**: This view decouples from the others due to its **action-dependence**. It requires motor exploration to "see," contrasting with the passive recognition in our probes. Success in either probe would contradict it.  

  ---

  ### Why Your Invariant-Bridge Instinct Succeeds—with a Caveat  
  Your approach is sound: invariants (e.g., topology, symmetry) can bridge senses if they are structural, not accidental. The flaw in the cube/sphere test is indeed its susceptibility to accidental invariants (e.g., a cube’s shadow hints at "corners," inferable from touch). This design avoids that by:  
  1. **Controlling invariants**: Topology is object-specific, not contextual.  
  2. **Isolating transfer**: Probe 2 removes the inferable feature, testing pure figure-transfer.  
  **Caveat**: If the invariant is *too* salient (e.g., a brightly colored hole), it might become a "visual description" (violating constraint iv). Here, the hole is neutral (white plastic), and the patient receives no descriptive language.  

  **Outcome Interpretation**:  
  - If Probe 2 succeeds, it supports common-figure: topology transfers cross-modally.  
  - If Probe 2 fails, it supports heterogeneity: only inference works, not intrinsic figure-sharing.  
  The pair separates inference (Probe 1) from transfer (Probe 2), resolving Molyneux ambiguities.
