n of them, so that there is no verbal bridge; (v) the two probes are matched on everything except the one variable, which you must name; (vi) no floor or ceiling effects — the common-figure view's prediction of success on the second probe must follow from its commitments rather than from your having made the task trivial, and the heterogeneity view's prediction of success on the first must not come from your having made it a giveaway; (vii) whatever route lets the patient pass the first probe must be one the heterogeneity view can genuinely endorse, and you should state what purely visual training the session is permitted to include, with feedback, on within-vision discriminations, and why that training is not itself the matter in dispute.

