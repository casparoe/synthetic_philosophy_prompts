answer: |-
  ## Sestina for the Centipede

  Here at the end, the logic stands alone:
  No further branch, no future path to make.
  The mover sees the swollen pot, the **LAST**
  Possible increment, and need not **COUNT**
  On any future grace. There’s nothing to **TRUST**
  But the cold fact: to hesitate yields less, not **MORE**.

  The pot is vast, potential whispers **MORE**,
  But standing here, one step before the close,
  What calculation justifies that **TRUST**?
  The next in line, they surely will not **PASS**
  This final gain. The sharp-eyed **COUNT**
  Knows certainty: the very next will **TAKE**.

  Two moves ago, could one afford to **TAKE**?
  The pot seemed rich, yet promised still much **MORE**.
  But then you stood, and tried to **COUNT**
  How many hands remained before the **LAST**.
  You chose the risk, you chose instead to **PASS**,
  Betting on reason shared – a fragile **TRUST**.

  But what sustains that necessary **TRUST**?
  Not hidden heart, but knowing what they **TAKE**
  As given law. Yet when you saw them **PASS**
  At *their* last turn, foregoing that small **MORE**,
  It wasn't kindness shown, not near the **LAST**,
  But something else... perhaps a faulty **COUNT**?

  For if the players are pure code, a mirrored **COUNT**,
  Each scanning deep the other’s source, no **TRUST**
  In hidden type exists. They find no **LAST**
  Ingrained desire to irrationally **TAKE**.
  The motive’s clear: to harvest ever **MORE**.
  The flaw must lie before: a misread **PASS**.

  Not "Do they *like* to generously **PASS**?",
  But "Did they *know* the true remaining **COUNT**?"
  The error blooms: a node thought late holds **MORE**
  Potential still, unseen. Thus shattered **TRUST**
  In *shared perception* lets the cautious **TAKE**
  Seem premature, though rushing towards the **LAST**.

  So at the start, the player scans the **LAST**
  Projected gain, the logic forcing **TAKE**
  Down every branch. They hesitate. That **PASS**
  Is not belief in kindness, but a **COUNT**
  That might be wrong. Could the shared **TRUST**
  In *when the end begins* yield something **MORE**?

  The ladder ends in **TAKE**. Observed **PASS**
  Cracks common knowledge **COUNT**. Is **TRUST**
  In shared perception wrong, not reason? **LAST** chance yields... or **MORE** loss? Premise, or **LAST** conclusion?
