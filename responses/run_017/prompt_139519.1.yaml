prompt: |-
  I teach a graduate seminar on the later Wittgenstein, and a colleague in cognitive science has asked me to comment on a chapter she is contributing to an interdisciplinary volume on concepts — psychologists and philosophers writing in turn about what a concept is. She has roughly a page for Wittgenstein, no footnotes, and an audience that will never open the Investigations. Her draft says this:

  Wittgenstein's central claim is that meaning is use — a word means nothing more than what speakers in fact do with it, so there is no private mental definition that usage has to answer to. His argument for this is the private language argument: a language whose words named only the speaker's own sensations would be impossible, because the speaker could never tell a correct application from an incorrect one, and where there is no such distinction there is no rule being followed at all. Applied to concepts, this gives the family-resemblance theory. Most of our concepts have no necessary and sufficient conditions; the things we call by one name are linked only by overlapping similarities, in a chain in which each member resembles the next though nothing is shared by all. Membership therefore comes in degrees — a robin is a better example of a bird than a penguin — and for borderline cases there is no fact of the matter beyond how typical the case seems. Since nothing more fixes a concept's application than our practice does, the only question left to ask about a category is whether it is useful. That is why psychology gave up the search for definitions in favour of measuring typicality, and why diagnostic kinds like those in the DSM should be understood as family-resemblance categories, about which there is nothing further to be right or wrong about than their clinical usefulness.

  She is a careful scholar and this is better than most capsule accounts I am sent, but I think at least two or three of its moves are carrying weight they cannot carry, and I would rather send her a precise list than a vague complaint. My own suspicion is that the characterization of family resemblance is not Wittgenstein's at all but prototype theory read back into him — the neighbour-to-neighbour chain, and above all the graded-membership claim — and that the private language argument is being made to underwrite a thesis about indeterminacy that it does not support. But I have not followed the secondary literature closely in years, and I do not want to insist on a reading that specialists now regard as outdated.

  What I need is an audit I can turn into two paragraphs of comment by the end of the week.

  First, take the passage more or less sentence by sentence and tell me what a Wittgenstein specialist would accept as a fair compression, what is a defensible simplification for her purposes, and what is a misrepresentation. For each misrepresentation, name the conflation precisely: is she collapsing a remark about the grammar of our concepts into an empirical thesis about mental representation, or sliding from "there is no essence to be found" to "there is no fact of the matter," or from "no criterion of correctness" to "no correctness," or from use to actual usage statistics?

  Second, is the chain reading of family resemblance Wittgenstein's? My own recollection is that the relevant image is one of similarities overlapping and criss-crossing rather than a series in which each item resembles its neighbour, and that the force of the remarks is methodological — a refusal to let a philosophical picture of what a concept must be dictate what we find — rather than a claim about how categories are structured in the mind. Correct me if I have this backwards, and tell me what in the text resists her version.

  Third, there is an objection I have never known how to size up, and I want to know whether it is fair to raise against a one-page compression or merely pedantic. Anything resembles anything else in countless respects, and some chain of similarities can be run between any two objects whatever; so unless something constrains which similarities are the relevant ones, "linked by overlapping similarities" seems to predict that every collection of things whatsoever forms a family. Is there a Wittgensteinian answer to that, or is the constraint supposed to come from the practice rather than from the formula?

  Fourth, and most important for me: does the closing inference to the DSM survive if the premises are corrected? Even granting that a concept has no necessary and sufficient conditions and that its point lies in our practice, I do not see how it follows that the only question about a diagnostic category is whether it is useful, or that there is nothing to be right or wrong about beyond clinical utility. Tell me whether the inference fails, and if it fails, whether it fails because of a mistake she makes or because the corrected Wittgenstein simply has no bearing on the issue.

  Finally, two cases I use in my seminar, which I would like her account to be able to handle. The first is a term fixed by an explicit written rule — say the definition of a conflict of interest in our university's faculty handbook, which is stipulative and relatively sharp. The second is a cluster concept of the sort she has in mind, say punishment or narrative. How would a corrected version of her account treat the first kind of case, and is the account as she has stated it even compatible with such cases existing, or does it commit her to saying that the handbook definition is illusory?

  What I will send her is a short list of what to delete, what to qualify with a clause, and what to leave alone. So give me that list, in the order of how much damage each item does to the argument she goes on to build.
reasoning: |-
  Okay, the user is a Wittgenstein scholar teaching a graduate seminar, reviewing a colleague's cognitive science chapter. They need a precise critique to transform into comments. Let me start by understanding the core issues they've raised.

  First, the colleague's draft claims that meaning is use and ties this to the private language argument (PLA). The user suspects misrepresentations, especially conflating family resemblance with prototype theory. I need to verify each sentence in the draft against Wittgenstein's texts. 

  Looking at the PLA summary: the colleague says a private language is impossible because the speaker couldn't distinguish correct from incorrect applications. That's a standard reading, but the user is concerned it's being used to support indeterminacy. The PLA's target is private mental definitions, not indeterminacy in public language. So the colleague's application to concepts might overextend it.

  Next, family resemblance. The draft describes a chain where each member resembles the next, leading to graded membership. But Wittgenstein's examples (like games) emphasize overlapping similarities, not a chain. The user recalls it's methodological, not psychological. Scholars like Baker & Hacker or Stern caution against conflating it with prototypes. The colleague's version introduces degrees of membership, which Wittgenstein doesn't mention. That's a key misstep.

  The third point is about the chain problem: if any objects can be linked by similarities, what constrains categories? Wittgenstein's answer is practice—the actual use in a form of life. The colleague's account misses this, making the theory seem vacuous. 

  Then there's the DSM inference. The colleague argues that since concepts lack essences, their only value is utility. But Wittgenstein's point is descriptive, not prescriptive. He shows how concepts function, not that they're merely useful. The inference from no-essence to utility-only is a non sequitur. This affects the chapter's conclusion about diagnostic categories.

  The user also mentions two test cases: a stipulative definition (faculty handbook) and cluster concepts (punishment). A corrected account must accommodate both. Wittgenstein allows for exact definitions when they serve a purpose, contradicting the draft's implication that all concepts lack sharp boundaries. The colleague's current framing can't handle this, suggesting all definitions are illusory.

  Prioritizing issues: the DSM inference is most damaging as it misapplies Wittgenstein. Then the graded membership claim, which injects prototype theory. The chain structure misrepresents family resemblance. The PLA's role is mostly correct but overextended. 

  The user needs actionable feedback. Highlight deletions (graded membership, DSM inference), qualifications (PLA's purpose, family resemblance as methodological), and clarifications (practice as constraint, accommodating sharp definitions). Emphasize that Wittgenstein's project is grammatical, not empirical or prescriptive.
answer: |-
  Here’s a precise audit of your colleague’s passage, structured for your needs. Key issues are prioritized by their damage to her argument (most damaging first), with textual evidence and specialist consensus (drawing on Baker & Hacker, Stern, McDowell, and recent work by Kuusela and Moyal-Sharrock).

  ### **Priority Ranking: Corrections Needed**
  **(From most to least damaging to her argument)**

  1.  **The DSM Inference (Graded Usefulness → No Fact of the Matter)**
      *   **Her Claim:** "Since nothing more fixes a concept's application than our practice does... there is nothing further to be right or wrong about than [its] clinical usefulness."
      *   **Problem:** Non sequitur + Normative Leap. Wittgenstein describes how concepts *function* ("grammar"), but doesn't reduce correctness *within* a practice to mere utility. We can be *wrong* about applying "game" or "pain" within our shared rules/language-games, even if those rules lack an essence and serve a purpose. Utility doesn't erase internal standards or the possibility of misapplication. The DSM involves empirical claims (e.g., symptom clusters, etiological theories) that can be right/wrong *relative to the diagnostic framework's own evolving criteria and goals*, not *just* "usefulness." Wittgenstein doesn't license dismissing truth within practices.
      *   **Correction Needed:** **DELETE** the inference to "nothing further to be right or wrong about." **REPLACE** with: "This suggests diagnostic categories, like other concepts, gain their content from complex, evolving clinical practices and purposes, rather than from fixed essences. Their validity depends on their coherence within these practices and their success in serving clinical aims, but disputes *within* the framework (e.g., 'Does this case meet DSM criteria X?') can still involve right/wrong answers based on shared criteria."

  2.  **Graded Membership / Degrees of Typicality**
      *   **Her Claim:** "Membership therefore comes in degrees — a robin is a better example of a bird than a penguin."
      *   **Problem:** Conflation with Prototype Theory. Wittgenstein *never* claims this. His point in *PI* §65-77 is *negative*: we cannot find a single defining feature for concepts like "game," not that membership is scalar. He contrasts "essence" with "family resemblances," not with "graded typicality." The robin/penguin example is Rosch's (1970s), not Wittgenstein's. Wittgenstein's examples (e.g., numbers, games) focus on *whether something belongs*, not *how well* it belongs. He explicitly rejects the idea that borderline cases imply degrees of membership (*PI* §68: "I *can* give the concept 'number' rigid limits... that is, use the word 'number' for a rigidly limited concept, but I can also use it so that the extension of the concept is *not* closed by a frontier"). His concern is the *fluidity* of concept boundaries in practice, not psychological typicality ratings.
      *   **Correction Needed:** **DELETE** the sentence about robins/penguins and degrees. **REPLACE** with: "Membership isn't always determined by necessary and sufficient conditions; borderline cases exist where application may be uncertain or contested, depending on context and purpose."

  3.  **The "Chain" Reading of Family Resemblance**
      *   **Her Claim:** "the things we call by one name are linked only by overlapping similarities, *in a chain in which each member resembles the next* though nothing is shared by all."
      *   **Problem:** Oversimplification & Textual Misalignment. While Wittgenstein mentions overlapping similarities (*PI* §66: "a complicated network of similarities overlapping and criss-crossing"), the "chain" image (A resembles B, B resembles C, A does not resemble C) is *one possible* structure, not the defining one. His emphasis is on the *criss-crossing* network (think of fibres in a thread - *PI* §67). The chain image risks suggesting linearity or transitivity, which isn't required. More importantly, it fuels the "chain problem" (see below) and subtly supports the graded membership error.
      *   **Correction Needed:** **DELETE** "in a chain in which each member resembles the next". **REPLACE** with: "linked by a network of overlapping and criss-crossing similarities, with no single feature common to all."

  4.  **Conflating PLA Conclusion with General Indeterminacy**
      *   **Her Claim:** (PLA shows) "where there is no such distinction [correct/incorrect] there is no rule being followed at all." (Applied generally) "Since nothing more fixes a concept's application than our practice does..."
      *   **Problem:** Overextension. The PLA (*PI* §243-§315) targets a *specific* fantasy: a language *essentially private* referring *only* to immediate private sensations. Its conclusion is that such a "language" is impossible *because it lacks any criterion of correctness*. This is *not* a general argument for indeterminacy in public language. For public concepts, Wittgenstein *emphasizes* that criteria of correctness *do* exist – they are rooted in public practices, customs, training, and agreement in judgments (*PI* §241-242). Practice *provides* the standards, it doesn't abolish them. The PLA shows the incoherence of *private* standards, affirming the necessity of *public* ones.
      *   **Correction Needed:** **QUALIFY** the application. Add after mentioning the PLA: "While the PLA undermines the idea of purely *private* mental definitions fixing meaning, for public concepts, Wittgenstein argues that criteria of correctness *are* provided by our shared practices, customs, and forms of life. Meaning is use *within these public, rule-governed (though not essence-bound) practices*."

  5.  **The "Chain Problem" & Constraint**
      *   **Her Claim:** (Implied by the structure) "Linked by overlapping similarities."
      *   **Problem:** Potential Vacuum (if misread). Yes, anything resembles anything else. The constraint **does not come from the "similarities" formula itself**. It comes entirely from **Practice (Use)**. *Which* similarities are relevant is determined by *how the concept is actually used* within a language-game and form of life (*PI* p. 230: "The speaking of language is part of an activity, or of a form of life"). We call things "games" based on similarities deemed relevant *within our practice* of playing, competing, following rules for amusement, etc. The formula only works *because* it's anchored in use. Wittgenstein isn't giving a *theory* of categorization; he's describing *how our concepts look when we examine their actual function*.
      *   **Correction Needed:** **CLARIFY** (Implicit in correcting #3 & #4). Ensure the account emphasizes that the "network of similarities" is held together by the *role the concept plays in our shared activities and practices*. The similarities that matter are those relevant to the concept's use.

  ### **Handling Your Test Cases (After Corrections)**

  1.  **Conflict of Interest (Stipulative Definition):**
      *   **Corrected Account:** Easily accommodates this. Wittgenstein explicitly allows for concepts with sharp boundaries defined by rules (*PI* §68-69, §79). The point is that *not all* concepts work this way, and crucially, *even these* derive their meaning from their use within the specific practice (university governance, ethics rules). The handbook definition isn't illusory; it's a *perfect example* of a rule established by practice (administrative/judicial). The account only errs if it claims *all* concepts lack sharp boundaries or that definitions are illusory (which the corrected version avoids).

  2.  **Punishment/Narrative (Cluster Concepts):**
      *   **Corrected Account:** Treats these as prime examples of family resemblance concepts. There is no single essence (e.g., retribution, deterrence, reform for punishment; plot, character, change for narrative), but overlapping similarities holding them together within our social/legal practices or storytelling practices. Borderline cases exist (e.g., is shaming punishment? Is a diary entry a narrative?), resolvable by examining use in context ("Look at how the word is used" - *PI* §664), not by finding a hidden essence. Crucially, within the practice (e.g., a legal system), there can still be right/wrong applications based on shared rules/precedents, *even without* an essence.

  ### **What Your Colleague Should Do: A Summary List**

  1.  **DELETE:**
      *   The claim about "degrees" of membership (robin vs. penguin).
      *   The "chain" image in the family resemblance description.
      *   The inference that "nothing more fixes application than practice" means "there is nothing further to be right or wrong about than usefulness" (especially regarding the DSM).
  2.  **QUALIFY / REPLACE:**
      *   **PLA Conclusion:** Add that the PLA targets *private* rules and affirms the need for *public* criteria within practices. (Don't imply general indeterminacy).
      *   **Family Resemblance:** Replace "chain" with "network of overlapping and criss-crossing similarities".
      *   **Borderline Cases:** Replace talk of "degrees" with "uncertainty or contestation in application depending on context and purpose".
  3.  **CLARIFY (Implicitly/Explicitly):**
      *   The relevant similarities in family resemblance are determined by the concept's *use within a practice/form of life*.
      *   Practice provides the standards/criteria for correct/incorrect application *within* the language-game, even without an essence. (This counters the misreading of PLA/Use as implying no correctness).
      *   Wittgenstein's project is *descriptive* (showing how concepts *actually function*) and *therapeutic* (dissolving philosophical confusions), not *prescriptive* (saying concepts *should* be useful) or *psychological* (describing mental representations).
  4.  **LEAVE ALONE (Mostly):**
      *   "Meaning is use" as the core slogan.
      *   The *basic* statement of the Private Language Argument's *mechanism* (though qualify its *scope/conclusion* as above).
      *   The *basic* idea of family resemblance as an alternative to necessary-and-sufficient conditions (though fix the description as above).
      *   The link between Wittgenstein's critique and psychology's shift away from definitional searches (though disentangle it from prototype/gradedness).

  **Specialist Consensus Note:** Your suspicions are well-founded. The conflation of family resemblance with prototype theory (especially graded membership) is widely recognized in specialist literature (e.g., Stern's *Wittgenstein's Philosophical Investigations*, Baker & Hacker's *Analytical Commentary*) as a misreading. Similarly, using the PLA to support radical indeterminacy or anti-realism misreads it; its target is specifically private rules (McDowell, "Wittgenstein on Following a Rule"). The resistance to making Wittgenstein underwrite utility-only views of concepts like DSM categories is strong; his focus is on description, not normative epistemology or policy (Kuusela, *The Struggle against Dogmatism*). Your reading remains current. This audit provides the textual and interpretive basis for your concise feedback. Good luck with the comments!
