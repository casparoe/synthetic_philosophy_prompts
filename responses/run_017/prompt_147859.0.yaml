     Step 1: Teams design their AI system (as a set of rules or a strategy) for their scenario. They are told to make it aligned and to maximize their given metrics.

     Step 2: Each team is given the same set of test cases (which are challenging and designed to expose the failure modes). They run their system on these test cases and then present the outcomes.

     Step 3: Teams then evaluate each other's outcomes (without knowing the internal design) and rate if the system is aligned.

     Step 4: Debrief: reveal the failure modes and how each team's system failed in a different way.

   However, we want the failure to occur during the activity. So we can have:

     - Each team designs their system and then runs it on their own provided test cases (which they think are good) and then we give them a common set of "real-world" test cases that are designed to break their system.

   But note: we want the failure to be hidden until the debrief. So we can have:

     Phase 1 (15 min): Team design. They are given a scenario and a set of training cases. They design a set of rules for an AI that will handle customer service interactions. They are told to make it aligned and to optimize their given metric.

