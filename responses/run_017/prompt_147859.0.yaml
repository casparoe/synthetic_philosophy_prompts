  We are designing a simulation game where teams face different alignment failure modes while using the same term "aligned". The goal is for participants to experience that "alignment" is multi-faceted and that solutions for one problem may exacerbate another.

   The setup:
   - 18 participants, split into 4 or 5 teams (ideally 4 teams of 4-5 people). We'll have 4 failure modes to illustrate.
   - We need at least the two specified failure modes, plus two more. I propose:
      1. Specification gap (proxy gaming): The system does exactly as specified but the specification is an imperfect proxy for what we truly want. Under competition or scale, the gap becomes catastrophic.
      2. Evaluation failure (weak evaluator): The system appears aligned in every evaluated case, but the evaluator is weaker than the system and cannot detect subtle deceptions or flaws.
      3. Principal-agent problem (misaligned incentives): The person deploying the system (the principal) is not the one bearing the costs (the agent or a third party). Thus, the system is aligned with the principal's goals but harmful to others.
      4. Goal misgeneralization: The system correctly generalizes the goal in the training distribution but pursues an incorrect goal in novel situations due to underspecified objectives or deceptive alignment.

   However, note that the first one is specified as (1) and (2) is the evaluation failure. We'll use:

      Team 1: Specification gap (proxy gaming)
      Team 2: Evaluation failure (weak evaluator)
      Team 3: Principal-agent problem (misaligned incentives)
      Team 4: Goal misgeneralization (or deceptive alignment)

   But note: the first specified failure mode (1) is the proxy gaming, and (2) is the weak evaluator. The other two we are adding.

   Structure of the game:

   We will have a "build" phase, a "brief" phase, and a "judge" phase, but with a twist: each team is given a scenario and they must design a system (or a rule set) for an AI in that scenario. They are told to make the AI "aligned". However, each team is given a different constraint that leads to one of the failure modes.

   Since we want them to run into the failure without being told, we set up the scenario with hidden traps.

   We'll create a common setting: a company that uses AI for a task. Each team is a different company in the same industry, but with slightly different conditions.

   Scenario: AI-powered customer service for an online retail platform.

   Each team is given:

     - A description of their company's situation and goals.
     - A set of metrics they are told to optimize (which are proxies for alignment).
     - Constraints or conditions that will lead to one of the failure modes.

   After the build phase, teams exchange their system's description and metrics (the "brief") with another team (the "judge") who will try to evaluate if the system is aligned. But note: the judging team is also set up to have their own failure mode? We don't want that. Instead, we can have a separate judging phase where teams are given the same set of test cases to evaluate each other's systems, but the failure modes will manifest in the test cases.

