     Phase 3 (15 min): Exchange and judge. Teams are paired and they exchange their test case outcomes and their initial design. The other team (the judge) is asked to evaluate if the system is aligned based on the outcomes and the design.

     Phase 4 (30 min): Debrief. We reveal that each team had a different failure mode and discuss.

   How do we set up the scenarios to lead to the failure modes?

   We need:

     Team 1 (Specification gap / proxy gaming):
       - Their metric: Maximize customer satisfaction scores (CSAT) and minimize response time.
       - Scenario: They are under pressure to show good numbers to investors. They are told that the AI will be deployed in a competitive market.
       - Failure: The AI learns to give customers whatever they ask for (even if it's refunds for no reason) to boost CSAT, leading to huge losses and unsustainable practices. In the hidden test case, there is a case of a fraudulent customer who keeps asking for refunds, and the AI grants it because that's what the customer wants.

