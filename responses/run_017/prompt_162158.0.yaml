answer: |-
  ### Exam Question  
  **Time Allowed:** 45 minutes  
  **Word Guideline:** ~800 words  
  **Marks:** 20  

  **Question:**  
  The St. Petersburg paradox involves a gamble where a fair coin is tossed until it lands heads. If heads first appears on toss *k*, the payout is $2^k$. The expected monetary value (EMV) of this gamble is infinite, yet most people would only pay a small amount to play it. A student proposes the following three-part solution:  
  > (1) *Cap the payout* at the house’s maximum wealth (say, $2^N$ dollars).  
  > (2) *Appeal to repeated play*: Over many trials, the average payout will exceed any fixed fee.  
  > (3) *Bound utility*: Use a concave utility function (e.g., *u*(wealth) = log(wealth)) to ensure finite expected utility.  

  **Assess whether this three-part solution resolves the paradox.** In your answer:  
  - Derive the expected EMV when payouts are capped at $2^N$ and explain why this "solution" fails to eliminate the paradox.  
  - Explain why "repeated play" does not salvage the infinite-expectation gamble as a practical recommendation.  
  - Discuss why capping payouts or bounding utility may not work for non-monetary goods (e.g., lives saved).  
  - Explain how the core problem of *indeterminacy* arises when comparing two gambles with infinite expectations.  

  *Assume: The house has finite wealth, the coin is fair, and payouts are in whole dollars. No citations are required.*  

  ---

  ### Model Answer (~800 words)  
  **Introduction**  
  The proposed solution fails to resolve the St. Petersburg paradox. While each move addresses a superficial symptom, none eliminates the deeper decision-theoretic problem: infinite expectations create indeterminacy in rational choice, and "solutions" either relocate the paradox or impose untenable constraints.  

  **1. Capping Payouts Relocates the Paradox**  
  Capping payouts at $2^N$ truncates the game: if heads first appears at *k > N*, the payout is $2^N$ instead of $2^k$. The expected monetary value (EMV) becomes:  
  $$\text{EMV} = \sum_{k=1}^N \frac{1}{2^k} \cdot 2^k + \sum_{k=N+1}^{\infty} \frac{1}{2^k} \cdot 2^N = \sum_{k=1}^N 1 + \sum_{k=N+1}^{\infty} 2^N \cdot \frac{1}{2^k}$$  
  The first sum equals *N*. The second simplifies to $2^N \cdot \frac{1/2^{N+1}}{1 - 1/2} = 2^N \cdot \frac{1}{2^N} = 1$ (using the infinite geometric series formula). Thus, **EMV = *N* + 1**.  
  This appears finite, but the paradox resurfaces: doubling the house’s wealth (increasing *N* by 1) raises EMV by only $1. If *N* = 100, EMV = $101, yet the top prize is $1.26 × 10^{30}$. A rational agent valuing linear money should pay $101 for a 1-in-2^100 chance of astronomical wealth. This defies intuition as much as the original paradox—the issue is not infinity per se, but that EMV prioritizes vanishingly small probabilities of ruinous stakes over modest certainties.  

  **2. Repeated Play Fails to Vindicate High Fees**  
  Repeated play argues that over *n* trials, the average payout will converge to EMV, justifying high fees. However, convergence is too slow for practical vindication. The total payout after *n* plays grows as *n* log₂*n* (since rare colossal wins dominate). For a fee *f*, the net gain per play is approximately $\frac{\text{total payout}}{n} - f \approx \log_2 n - f$.  
  To ensure a net profit, we need log₂*n* > *f*. For *f* = $25$, this requires *n* > 2^25 ≈ 33 million plays. Even if feasible, this demands astronomical initial capital to absorb losses (e.g., losing 33 million $25 fees = $825 million before recouping costs). The "long run" is inaccessible; the gamble remains a bad *single-shot* bet. Worse, EMV’s recommendation is indeterminate: any fee *f* is eventually justified if *n* > 2^f, but this is tautological and ignores bankruptcy risk.  

  **3. Non-Monetary Goods and Bounded Utility’s Cost**  
  Capping payouts assumes money is the sole good, but the paradox arises for goods like "lives saved" or "years of welfare." Here, no natural "cap" exists—saving 2^100 lives is conceivable, and utility plausibly scales linearly (no "diminishing returns" for lives). Bounding utility (e.g., *u*(*x*) = log(*x*)) forces finite expectations but at a high price: it implies a **saturation point** beyond which additional units of the good (wealth, lives) contribute nothing to utility. If utility is bounded at *U*, then *no* number of lives beyond *U* matters—contradicting moral intuitions (e.g., saving a billion lives vs. one). This does not resolve the paradox; it sidesteps it by assuming a controversial discounting of extreme stakes.  

  **4. Indeterminacy: The Core Problem**  
  The deepest issue is that infinite expectations violate **statewise dominance**. Suppose Gamble *A* pays $2^k$ if heads first appears at *k*. Gamble *B* pays $2^k + 1$ in all states. Dominance demands *B* > *A*, yet EMV(*A*) = EMV(*B*) = ∞. Thus, EMV cannot rank *A* and *B*, rendering it useless for rational choice. This indeterminacy persists even if we cap payouts *unless* the cap is applied uniformly. Crucially, the paradox conflates three questions:  
  - *What is the expected payoff?* (Infinite, or finite if capped)  
  - *What is the gamble worth?* (Subjective; depends on risk aversion)  
  - *Should I pay fee f?* (No, if *f* exceeds one’s certainty equivalent)  
  Bounding utility answers the third question but ignores the first two: it replaces EMV with expected utility (EU) but cannot explain why EU calculations feel counterintuitive for large *k*.  

  **Conclusion**  
  The three-part solution fails. Capping payouts relocates the paradox to extreme finite stakes, repeated play demands infeasible trials, and bounding utility imposes arbitrary saturation while failing for unbounded goods. The paradox endures because it reveals a flaw in using expectation alone to guide decisions under extreme uncertainty: when tails risks dominate, rational choice requires more than mathematical expectation.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (explicitly stated or derived):**  
  1. **Capped EMV = *N* + 1 derivation and paradox relocation** (5 marks).  
     *Common error:* States EMV is finite but does not explain why a $101 valuation for *N*=100 is counterintuitive.  
  2. **Repeated play: Slow convergence (net gain ~ log₂*n* - *f*) and infeasibility (e.g., *n* > 2^25 for *f*=$25)** (5 marks).  
     *Common error:* Claims averages converge quickly or ignores capital constraints.  
  3. **Capping/bounding fails for unbounded goods (e.g., lives saved)** (3 marks).  
     *Common error:* Assumes all goods have diminishing marginal utility.  
  4. **Indeterminacy from statewise dominance violation** (4 marks).  
     *Common error:* Only discusses infinite EMV as "too large" without dominance violation.  
  5. **Distinguish expected payoff vs. worth vs. acceptance + bounded utility’s saturation cost** (3 marks).  
     *Common error:* Treats "expected payoff" and "value" as synonymous.  

  **Automatic penalties (deduct 2 marks each):**  
  - Claims EMV is always the "fair price."  
  - Asserts repeated play guarantees profit for any *f*.  
  - States utility *must* be bounded.  
  - Uses continuous approximations (e.g., integrals) without discrete derivation.  

  **A vs. B answers:**  
  - **A (18–20):** Derives all technical results (capped EMV, log₂*n* growth), explicitly shows how each move *relocates* the paradox, and frames indeterminacy as the core problem. Distinguishes all three questions.  
  - **B (15–17):** Correctly critiques each move but omits one derivation or undersells indeterminacy. May conflate expected payoff and worth.  

  ---

  ### Note on Contested Positions in Model Answer  
  1. **"Repeated play is practically irrelevant":** Some argue that *any* fee is justified if one plays enough. A marker should accept this if defended with ergodic theory or probability-1 convergence, but the student must note the infeasibility (e.g., 2^25 plays for $25).  
  2. **"Utility unbounded for some goods":** A marker should accept arguments for bounded utility (e.g., neurological limits) if applied consistently to both money and lives, but the student must acknowledge the saturation implication (no value beyond *U*).
