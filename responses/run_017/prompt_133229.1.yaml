prompt: |-
  I work in ML, took two terms of quantum mechanics in undergrad, and made the mistake of reading about the Everett picture on weekends, so now I can't stop poking at where the probabilities are supposed to come from. I don't want the literature or a reading list, just take my own gut verdicts on cases and tell me whether there's a principle behind them. Please answer in American English and keep it concrete.

  1. Equal-amplitude spin measurment: 1/2 and 1/2. Symmetry.
  2. Amplitudes sqrt(.9) and sqrt(.1): .9 and .1, not 50/50. Plain branch-counting is out for me.
  3. Same as 2, but I rig things so the .1 branch fans out into a billion sub-branches that differ in irrelevant microscopic details and feel identical to me: still .1 for down. Fanning out buys nothing.
  4. Same as 2, but the .1 branch ends up containing a thousand copies of me, all seeing down: still .1, though here I feel the pull to count copies and don't fully trust myself.
  5. A branch of weight 10^-30: I'll act as if it won't happen, and I won't take the bet where I survive only there, but I resist saying nobody is in it.
  6. An interference setup where the two branches recombine before any record is made: I'm tempted to say no probability was ever really in play, yet if I'd been allowed to bet halfway through, .9/.1 would have been the right odds.
  7. Weight 1/pi gets probability 1/pi. This one definately worries me, because the move I keep running into, re-describing an unequal split as a bunch of equal-weight sub-branches, only works when the amplitudes are nice, and I still want the same answer when they aren't.

  My own attempt at a principle: credence just is squared amplitude, and the equal-amplitude cases are a special case of that rather than the source of it. But then I can't say what makes it a probability instead of a number I've been told to use, and I don't know what it predicts when amplitudes get moved around after the split.

  So: is there one account that gets all seven? Which of my verdicts does it force me to give up, and why? I suspect 1 and 7 can't both stay in the form I put them, and maybe 6 has to go too. And whatever you land on, tell me what it predicts for a case I haven't listed: a device that rotates part of the up branch's amplitude into the down branch after the split but before anyone looks, so the weights at observation time aren't the weights at split time. Does my credence change when the rotation happens, or was it settled at the split?
reasoning: |-
  We are in the context of the Everett (Many-Worlds) interpretation of quantum mechanics. The user has provided seven scenarios and their intuitive verdicts about the probabilities (credences) they assign. The key question is whether there is a consistent principle that accounts for all these intuitions, or if some intuitions must be revised.

  The user's proposed principle: "credence just is squared amplitude", meaning the probability of an outcome is the square of the absolute value of its amplitude. This is the Born rule. However, they are concerned about the justification for this rule and how it holds when amplitudes are manipulated after the split.

  Let's go through each case and see what the Born rule says and how it aligns with the user's verdicts:

  1. **Equal-amplitude spin measurement (amplitudes 1/sqrt(2) for each):** Born rule gives 1/2 and 1/2. Matches the user's verdict (symmetry).

  2. **Amplitudes sqrt(0.9) and sqrt(0.1):** Born rule gives 0.9 and 0.1. Matches the user's verdict (rejects branch-counting).

  3. **Same as 2, but the 0.1 branch fans out into a billion identical sub-branches:** The total amplitude for the down branch is still sqrt(0.1). The fanning out does not change the total squared amplitude. So Born rule still says 0.1. Matches the user's verdict.

  4. **Same as 2, but the 0.1 branch has a thousand copies of the observer:** Again, the amplitude for the entire branch (with copies) is still sqrt(0.1). The Born rule does not count copies, it uses the amplitude. So probability remains 0.1. However, the user feels the pull to count copies. The Born rule says: no, it's still 0.1.

  5. **A branch of weight 10^-30:** Born rule assigns probability 10^-30. The user will act as if it won't happen (which is rational) but resists saying nobody is in it. The Born rule doesn't say the branch doesn't exist, just that it has very low probability. So the user's verdict is compatible.

  6. **Interference setup where branches recombine:** If the branches recombine without decoherence (no record made), then the state is pure and there is no branching. The user is tempted to say no probability was in play. However, if a measurement had been made at the halfway point, then the Born rule would have assigned 0.9 and 0.1. The key is that without decoherence (and hence without branching), there is no reason to assign probabilities to the intermediate states because they are not separate worlds. But if a measurement had been performed, decoherence would have occurred and branching would have been irreversible. The user's verdict is that the intermediate bet would have been at 0.9/0.1. The Born rule can account for that: at the time of the intermediate measurement, the squared amplitudes are 0.9 and 0.1.

  7. **Weight 1/pi:** Born rule gives probability (1/pi). The user is worried because if we try to describe the split as many equal branches, we can't exactly when the amplitude is irrational. But the Born rule still applies. The user wants the same answer even without an equal-weight decomposition.

  The principle from the Born rule (squared amplitude) works for all seven cases, but note that in case 4 the user feels a pull to count copies. The Born rule does not support that. So the user must give up the intuition in case 4 that the probability should change due to the number of copies? Not exactly: the copies are part of the same branch (they are in the same decohered history). The amplitude for the entire branch is still sqrt(0.1). However, if the copies are created in such a way that they are in distinct branches (which would require decoherence between them), then the amplitude for each sub-branch would be smaller, but the total for the down outcome would remain the same. The user's verdict (still 0.1) is correct by Born rule.

  Now, the additional case: **A device that rotates part of the up branch's amplitude into the down branch after the split but before anyone looks.**

  - Let the initial state be: sqrt(0.9) |up> + sqrt(0.1) |down>.
  - Then, after the split, we apply a unitary that transfers some amplitude. For example, we rotate the state so that the new state becomes:
      sqrt(0.9 - x) |up> + sqrt(0.1 + x) |down>
    for some x (with 0 <= x <= 0.9).

  The key point is that until decoherence occurs (i.e., until the system becomes entangled with the environment in a way that makes the branches orthogonal and irreversible), the amplitudes can interfere. In the Everett picture, branching happens when decoherence occurs. If the rotation happens before decoherence (i.e., before the state becomes a mixture of orthogonal branches), then the entire evolution is unitary and the branching hasn't occurred yet. Therefore, the time at which we assign probabilities is at the point of decoherence (when the measurement is complete and irreversible).

  So, if the rotation happens before decoherence, then the squared amplitudes at the time of decoherence (when the observer looks) are the ones that matter. Therefore, the credence is settled at the time of decoherence, not at the initial split.

  Therefore, if the rotation transfers amplitude from up to down, then the probability for down becomes 0.1 + x, and for up becomes 0.9 - x.

  But note: if the initial split had already caused decoherence (so that the branches were already orthogonal and irreversible), then the rotation would not be able to transfer amplitude without first undoing the decoherence (which is practically impossible). So in practice, if the rotation happens after decoherence, then the branches are already separate worlds and the rotation would have to act within a branch (which wouldn't affect the other branch). Therefore, the amplitudes would not change.

  Hence, the critical point is decoherence. The probabilities are assigned at the time of decoherence (when the measurement is complete and the branching is irreversible). The amplitudes at that time (squared) give the probabilities.

  Summary:

  - The Born rule (squared amplitude) is the principle that accounts for cases 1-7.
  - For the additional case: if the rotation happens before decoherence (so the branches are not yet irreversible), then the probabilities are determined by the amplitudes at the time of decoherence. If the rotation happens after decoherence, then the branches are separate and the rotation cannot transfer amplitude between them.

  Therefore, the user should give up the idea that the probability is fixed at the initial split if decoherence hasn't occurred yet. The probability is fixed when decoherence occurs.

  This also addresses case 6: if the branches recombine without decoherence, then there was never a branching event and hence no probabilities. But if at the halfway point we had caused decoherence (by making a measurement), then the probabilities would have been assigned at that point.

  So the principle: **The probability of a branch is the squared amplitude of that branch at the time when decoherence occurs (making the branch irreversible).**

  This principle:

  - Handles 1, 2, 3, 4 (without counting copies), 5, 6 (if we consider the intermediate measurement as causing decoherence, then probabilities are assigned then; without decoherence, no probabilities), and 7.

  The user must be cautious in case 4: the copies don't change the probability because they are part of the same branch (unless they are created in a way that causes further branching, but then the total amplitude for the outcome is still the same).

  Finally, the user's worry about irrational amplitudes (case 7) is addressed because the Born rule does not require decomposing into equal branches. It is a fundamental rule.

  Thus, the verdicts 1-7 are all compatible with the Born rule applied at decoherence. The only potential revision is in case 4: the copies do not change the probability.

  But note: if the creation of copies is done by a process that causes decoherence of the copies (so that they become distinct branches), then the amplitude for each copy would be a fraction of the original branch amplitude. However, the total probability for the down outcome (which is now spread over many branches) is still the same: the sum of the squared amplitudes of the sub-branches. So the overall probability for the down outcome remains 0.1. Therefore, the user's verdict (still 0.1) is correct.

  So we don't have to give up any of the user's verdicts. The Born rule, applied at decoherence, supports all of them.
answer: |-
  ### Your Verdicts and the Everett Interpretation  
  Your intuitions align closely with the **Born rule** (probability = squared amplitude) applied at the point of **decoherence** (when branches become irreversible). This is the standard Everettian approach, and it handles all your cases without contradiction. Here's how:  

  #### Principle: **Probability is squared amplitude at decoherence.**  
  - **Why squared amplitude?**  
    Amplitude is the fundamental quantity in quantum mechanics. Squaring it gives a positive real number that (1) sums to 1 across branches, (2) matches observed frequencies, and (3) is stable under unitary evolution. No counting of branches or copies is needed.  
  - **Why at decoherence?**  
    Decoherence is when quantum superpositions become effectively irreversible due to entanglement with the environment. Before decoherence, amplitudes can interfere; after, branches are "separate worlds." Probability is defined *at this split*.  

  ---  
  ### Your Cases Resolved  
  1. **Equal amplitudes (1/√2, 1/√2) → 1/2, 1/2.**  
     - **Agrees:** Squared amplitudes give 1/2 each. Symmetry is a consequence, not the source.  
     - *No issue.*  

  2. **Unequal amplitudes (√0.9, √0.1) → 0.9, 0.1.**  
     - **Agrees:** Born rule directly applies. Branch-counting is wrong (as you reject).  
     - *No issue.*  

  3. **0.1 branch fans into billion identical sub-branches → still 0.1.**  
     - **Agrees:** Total amplitude for the "down" outcome is still √0.1 → squared = 0.1. Microscopic fanning doesn’t change the branch weight.  
     - *No issue.*  

  4. **0.1 branch has 1000 identical copies of you → still 0.1.**  
     - **Agrees:** Copies don’t change the amplitude. The entire "down" outcome has amplitude √0.1 → squared = 0.1. Your "pull" to count copies is a red herring: probability isn’t about observers, it’s about branch weight at decoherence.  
     - *Revise your doubt:* Copy-counting is incompatible with Everett. Probability comes from amplitudes, not heads.  

  5. **Weight 10⁻³⁰ → act like it won’t happen, but don’t deny existence.**  
     - **Agrees:** Squared amplitude = 10⁻³⁰ is your credence. You rationally ignore it pragmatically, but it’s still a real branch.  
     - *No issue.*  

  6. **Branches recombine before decoherence → no probability, but 0.9/0.1 odds if bet mid-process.**  
     - **Agrees:** If no decoherence occurs, there’s no split—just a unitary evolution. Probabilities aren’t defined. But if you *force* a mid-process bet (e.g., by causing decoherence), you use squared amplitudes *at that decoherence event*.  
     - *No issue.*  

  7. **Weight 1/π → probability 1/π.**  
     - **Agrees:** Born rule works for any amplitude, rational or irrational. No need to "re-describe" as equal sub-branches—that’s just a pedagogical tool.  
     - *Revise your worry:* The Born rule is primitive. Equal sub-branching isn’t required.  

  ---  
  ### Your Added Case: Amplitude Moved After Split  
  **Setup:**  
  - Initial state at decoherence (split): √0.9 |↑⟩ + √0.1 |↓⟩ → **credence: ↑ = 0.9, ↓ = 0.1**.  
  - *After* split, a device rotates part of the ↑ amplitude (say, √0.2) into ↓ *before you look*.  
  - Final state at observation: √0.7 |↑⟩ + √0.3 |↓⟩.  

  **What happens to your credence?**  
  - **Credence changes.**  
    - Probability is defined at decoherence. If the rotation happens *after decoherence*, the ↑ and ↓ branches are already irreversibly split. You can’t move amplitude between them—it’s like trying to merge parallel universes. Rotation would only affect one branch (e.g., within ↑), leaving probabilities unchanged (still 0.9/0.1).  
  - **But if decoherence hasn’t finished yet:**  
    - If the rotation occurs *before decoherence completes* (i.e., while branches can still interfere), then decoherence isn’t final. The new amplitudes (√0.7, √0.3) define the probabilities at the *actual* split. Your credence updates to **↑ = 0.7, ↓ = 0.3**.  

  **Key point:** Probability is settled at the *true decoherence event*—when the system becomes irreversibly entangled with the environment. If you mess with amplitudes before that, you change the odds. After, you can’t.  

  ---  
  ### Conclusion  
  - **You keep all 7 verdicts** under the Born rule + decoherence timing.  
  - **Only revisions:**  
    - **Case 4:** Reject copy-counting. Probability is about branch weight, not observer count.  
    - **Case 7:** Embrace irrational probabilities. No equal sub-branching is needed.  
  - **The principle:** Probability is squared amplitude *defined at decoherence*. This is consistent, testable, and matches quantum predictions.  

  **Why it’s "probability" and not just a number:**  
  - It’s the only quantity that (1) is conserved under unitary evolution, (2) explains observed frequencies, and (3) is stable across branches. In Everett, it’s your degree of belief that *your* branch is typical.  

  **Final test case:** If you could delay decoherence until after the rotation, your credence would update. If not, it wouldn’t. Decoherence marks the point of no return.
