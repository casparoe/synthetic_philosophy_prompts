answer: |-
  Below is a practical, step-by-step screening procedure designed for your committee's constraints. It's structured as an ordered checklist with clear stopping points, rationales for rejection, and handoffs to human judgment. The procedure prioritizes **epistemic robustness** (is the claim credible?) and **budget relativity** (can we justify this cost given our constraints?), while rejecting unbounded utility arguments. It explicitly avoids value judgments until the final step, forcing trustees to confront those debates only when necessary. I'll first explain the procedure, then apply it to your three test cases, and end with its limitations.

  ---

  ### **Pascal's Mugging Screening Procedure**
  **Core Philosophy**: We reject unbounded utility ("any probability, no matter how small, justifies any cost if the stakes are high enough") as fundamentally non-robust. We also reject "budget-relative utilitarianism" (prioritizing only the highest EV/dollar) as too computationally demanding. Instead, we focus on **epistemic integrity** (is the probability claim defensible?) and **friction** (does this proposal introduce harmful incentives?).

  **Ordered Steps** (Run in sequence; stop at first rejection/handoff):  
  1. **Effect Size Sanity Check**  
     - **Question**: Is the claimed effect size ≤ 10^20 (in any unit: lives, years, etc.)?  
     - **Good Answer**: Yes.  
     - **NO if No**: Rationale: "Effect size exceeds plausibility threshold (10^20)."  
     - **Why?** Implements **bounded epistemology** (not utility). Claims beyond 10^20 require extraordinary evidence we can't verify in 10 minutes. We cap not utility, but *claim credibility* without audit.  
     - **Judgment Call?** Yes (threshold is arbitrary but practically defensible; 10^20 is 100B× the age of the universe).  

  2. **Scaling Test**  
     - **Question**: If the applicant claimed an effect size 1M× (10^6) larger, would your probability estimate drop by ≥ 10^6×?  
     - **Good Answer**: Yes.  
     - **NO if No**: Rationale: "Probability estimate fails scaling test (insensitive to claim size)."  
     - **Why?** Implements **epistemic process**. If probability doesn't drop when claims inflate, the estimate is arbitrary (tracking mood, not truth). Addresses "mood tracking" intuition.  
     - **Judgment Call?** Semi. Use your gut: e.g., "Would I believe this claim 1M× more if effect were 1M× smaller?"  

  3. **Independent Anchor Test**  
     - **Question**: Is the probability estimate derived from evidence independent of the applicant?  
     - **Good Answer**: Yes (e.g., published studies, govt. data, replicable models).  
     - **NO if No**: Rationale: "Probability lacks independent evidence."  
     - **Why?** Implements **epistemic process**. Applicant-generated probabilities (e.g., "my model says P=0.01") are unauditable and prone to motivated reasoning.  
     - **Judgment Call?** Yes. "Independent" = verifiable in 10 mins via Google/phone (e.g., PubMed abstract, WHO report).  

  4. **Cost of Information Check**  
     - **Question**: Does the grant primarily buy information (e.g., pilot, experiment, proof-of-concept) with value beyond the immediate outcome?  
     - **Good Answer**: Yes.  
     - **Handoff if No**: Rationale: "Handoff: Non-informational grant requires value judgment."  
     - **Why?** Implements **budget relativity**. Pure "mugging" grants don't generate knowledge; informational grants (e.g., pilots) reduce uncertainty for future decisions. Forces debate on values if no info.  
     - **Judgment Call?** No. Binary: Does the proposal explicitly test a hypothesis? (If unsure, default to "no" and hand off.)  

  5. **Budget Friction Test**  
     - **Question**: If we fund this, could we handle 100 identical requests next month without exceeding our budget?  
     - **Good Answer**: Yes.  
     - **Handoff if No**: Rationale: "Handoff: Budget friction risk (queue effect)."  
     - **Why?** Implements **budget relativity**. Addresses "queue" problem by rejecting grants that create untenable precedent. Use 100× as a proxy for "floodgates."  
     - **Judgment Call?** Yes. Estimate request volume based on applicant's niche (e.g., "simulation suffering" is rare; "water pilots" are common).  

  ---

  ### **How It Handles Your Problem Cases**
  - **Ordinary Mugger & Mirror**:  
    - Both fail **Step 2 (Scaling Test)**: Probability won't drop if effect inflates (e.g., 10^28 → 10^34 years).  
    - *Symmetry is a feature*: Same verdict for both (NO) because the epistemic flaw is identical, regardless of sign (prevent/cause suffering).  

  - **Queue**:  
    - Addressed in **Step 5 (Budget Friction)**. If funding one invites 100+ copycats, we hand off to humans to debate policy-level risks.  

  - **Black Box**:  
    - Fails **Step 3 (Independent Anchor)**. "Our model says P=10^-9" is unauditable → NO. Punishes private models but fairly: applicants must supply public evidence.  

  - **Legitimate Long Shot (e.g., Water Pilot)**:  
    - Passes all steps: Effect size (10^6 lives) < 10^20 (**Step 1**); probability scales with effect (**Step 2**); dose-response data is public (**Step 3**); buys information (**Step 4**); water pilots aren't infinitely scalable (**Step 5** → passes).  

  ---

  ### **Test Runs on Your Proposals**
  **Proposal 1: Simulation Guy ($5K to prevent 10^28 years of suffering)**  
  1. **Effect Size Sanity Check**: 10^28 > 10^20 → **NO**.  
     Rationale: "Effect size exceeds plausibility threshold (10^20)."  
     *Stop here. No need for further steps.*  

  **Proposal 2: Water Pilot ($60K for water treatment in 2M-person district)**  
  1. **Effect Size**: 2M lives ≤ 10^20 → **Pass**.  
  2. **Scaling Test**: If effect = 2T lives (10^6× larger), probability drops >10^6× (e.g., from 0.5 to 10^-7) → **Pass**.  
  3. **Independent Anchor**: Dose-response data published → **Pass**.  
  4. **Cost of Information**: Pilot generates data → **Pass**.  
  5. **Budget Friction**: 100+ similar water pilots *are* feasible (many districts exist) → **Handoff**.  
     Rationale: "Handoff: Budget friction risk (queue effect)."  
     *Committee debates: Is this pilot unique? Can we fund only 1–2 such projects annually?*  

  **Proposal 3: Flagship Program ($250K for speculative threat work, 1/3K chance of pivotal for 10^10 lives)**  
  1. **Effect Size**: 10^10 lives ≤ 10^20 → **Pass**.  
  2. **Scaling Test**: If effect = 10^16 lives, probability drops (e.g., 1/3K → 10^-9) → **Pass**.  
  3. **Independent Anchor**: Your in-house model → **Pass** (you "audit" it by trusting yourselves).  
  4. **Cost of Information**: *Fails* — no pilot/test; pure speculation → **Handoff**.  
     Rationale: "Handoff: Non-informational grant requires value judgment."  
     *Committee debates: Is this "insurance" worth $250K? Trust in your own model?*  

  **Result**: Your flagship survives initial screening but hits a handoff at Step 4. The difference vs. the simulation mugger:  
  - **Effect size** (10^10 vs. 10^28) is below the sanity cap.  
  - **Probability** scales plausibly (unlike the mugger's fixed certainty).  
  - **Source** is your audited model (vs. mugger's unaudited claim).  
  But it fails **Step 4** because it doesn't buy information. *This forces trustees to defend its non-informational value*—no special favoritism.  

  ---

  ### **What This Procedure Is NOT For**
  1. **Non-quantifiable proposals** (e.g., art, advocacy). Use other criteria.  
  2. **Value clashes** (e.g., "Is suffering in simulations bad?"). Step 4/5 handoffs expose these.  
  3. **Extremely high-probability/low-stakes grants** (e.g., $1K for a 90%-chance-to-save-1-life). It won't flag these, but they're unlikely to resemble mugging.  
  4. **True emergencies** (e.g., disaster response). Suspend the procedure; use fast-track voting.  
  5. **Proposals where cost dominates probability** (e.g., a $50K grant with 10^-100 chance to save 1 life). It may pass Step 1–3 but fail Step 5.  

  **When to Stop Using It**:  
  - If >50% of proposals hit handoffs, the procedure isn't saving time.  
  - If trustees consistently override handoffs in predictable ways (e.g., always funding "info-less" grants), simplify the rules.  
  - For non-speculative grants (e.g., direct aid), use a cost-effectiveness threshold instead.  

  ---

  ### **Why This Works for Your Committee**
  - **Time**: Steps 1–3 take <5 minutes; Steps 4–5 are fast yes/no. Total <10 mins/proposal.  
  - **Defensibility**: Rejects mugging via epistemic checks, not utilitarianism. A non-utilitarian trustee can support "no arbitrary probability claims."  
  - **Clarity**: Rationales are one-line, pasteable records.  
  - **Values Neutral**: Humans debate values only at handoffs (Steps 4–5), not in screening.  

  **Rejected Families of Solutions**:  
  - **Bounded Utility**: We cap *claims*, not utility. More practical for your constraints.  
  - **Pure Budget-Relative EV**: Requires comparable EV benchmarks you don't have.  
  - **Knightian Uncertainty**: Too vague for a checklist; folded into Step 3.  

  This procedure makes your instincts ("mood tracking," "information value," "queue risk") actionable. It won't eliminate debate—but will confine it to the proposals that matter.
