answer: |-
  ### Enumerated Readings of "Grounded"
  1. **Direct Grounding**: Symbol-holder has first-person causal/sensorimotor contact with the referent (e.g., touching gold).  
  2. **Inherited Grounding**: Symbol inherits reference via a causal chain: world → embodied writer → text → model.  
  3. **Inferential-Role Sufficiency**: Reference is fixed solely by language-internal patterns (e.g., co-occurrence statistics).  

  ### Credence Decomposition  
  - **P(Direct grounding required)** = 0.20  
    *Justification*: Most contemporary theories reject strict empiricist demands for AI.  
  - **P(Inherited grounding sufficient)** = 0.60  
    *Justification*: Causal chains anchor reference in social-semantic practices (e.g., Kripkean baptism).  
  - **P(Inferential role sufficient)** = 0.30  
    *Justification*: Pure statistical correlations lack intentionality (Harnad’s "cognitivist zombie" critique).  
  - **P(Grounding is categorical)** = 0.40  
    *Justification*: Graded views dominate (e.g., representational "tethering" vs. full grounding).  
  - **Text-only grounding strength (if graded)** = 0.40  
    *Justification*: Models capture structural affordances but lack sensorimotor validation.  
  - **Omitted term: Teleofunction** = Neutral (0.50)  
    *Justification*: Biological purpose (Millikan) may not apply to AI, but design intent could substitute.  

  ### Combined Credence  
  Overall credence: **0.50**  
  - Calculation: Weighted by sufficiency probabilities: `(0.20 * 0) + (0.60 * 1) + (0.30 * 0.4) = 0.50`.  

  ### Sensitivity and Evidence  
  - **Most sensitive term**: Inherited grounding (Δ±0.40 per 0.1 change).  
  - **Board-state encoding evidence**:  
    - *Does it count?* Weakly, as inherited structural correspondence (not direct grounding).  
    - *Effect on credence*: Moves from 0.50 → **0.55**; suggests model leverages embodied priors in text.  

  ### Disagreement Diagnosis  
  The 0.05 vs. 0.90 gap most likely turns on **whether inherited grounding is sufficient**. The embodied cognition expert (0.05) likely rejects inherited chains as mere "parasitic" reference, while the ML lead (0.90) accepts computational proxies as functional grounding.  

  \answer{0.50}
