answer: |-
  Here's a structured triage procedure designed around your requirements, with the key distinction between legitimate extensions (offsetting mechanisms) vs. moving goalposts built in. The procedure is optimized for speed, neutrality, and clarity, with explicit rules for operationalization, extensions, and handling data gaps.

  ---

  ### **Prediction Triage Procedure**  
  *(10 min/prediction; run by neutral evaluator with group input)*  
  **Rule 0: Assign Neutral Evaluator**  
  - The person who logged the prediction **cannot** evaluate it. Rotate evaluators per prediction.  
  - Proponent (original predictor) may provide input but not vote.  
  - **Deadlock?** Vote by triage group (excluding proponent).  

  #### **Step 1: Is the prediction resolved?**  
    - **Question:** Has the outcome definitively occurred or failed by the deadline?  
    - **Adequate evidence:** Public data (e.g., UN FAO reports, CDC stats, verified news).  
    - **Decision:**  
      - ✅ **Resolved (Success/Fail):** Retire prediction.  
      - ❌ **Unresolved:** Proceed to Step 2.  

  #### **Step 2: Is it operationalized?**  
    - **Question:** Does it define **measurable outcomes, thresholds, and data sources**?  
    - **Adequate answer:** Specific metric (e.g., "20% decline in X"), verifiable source (e.g., World Bank data).  
    - **Decision:**  
      - ✅ **Yes:** Proceed to Step 3.  
      - ❌ **No:** Move to Step 2a.  

  ##### **Step 2a: Can it be operationalized now?**  
    - **Question:** Can the group agree on metrics/sources in <3 min?  
    - **Adequate answer:** Consensus on:  
      - Outcome variable (e.g., "polarization index").  
      - Threshold (e.g., ">50% divergence in belief on issue X").  
      - Data source (e.g., Pew Research surveys).  
    - **Decision:**  
      - ✅ **Yes:** Update prediction; proceed to Step 3.  
      - ❌ **No:** Retire as **unverifiable**.  

  #### **Step 3: Is the mechanism falsified?**  
    - **Question:** Is the core causal logic broken? (e.g., new evidence disproves theory).  
    - **Adequate evidence:** Data contradicting mechanism (e.g., yield gains not linear).  
    - **Decision:**  
      - ✅ **Yes:** Retire as **busted**.  
      - ❌ **No:** Proceed to Step 4.  

  #### **Step 4: Is delay due to an offsetting mechanism?**  
    - **Key Tests for Legitimate Extension (Offsetting Mechanism):**  
      1. **Temporality Test:** Is the offset **exhaustible/time-bound**? (e.g., finite fossil fuel reserves).  
      2. **Independence Test:** Is the offset **external** to the original mechanism? (e.g., nitrogen fixation ≠ land constraints).  
      3. **Exhaustion Signal Test:** Can we define **observable indicators** of the offset weakening? (e.g., "oil prices > $200/barrel").  
    - **Decision:**  
      - ✅ **Meets all 3 tests:** Proceed to **Step 4a** (bounded extension).  
      - ❌ **Fails any test:** Proceed to **Step 4b** (open-ended extension).  

  ##### **Step 4a: Set Bounded Extension (Offsetting Mechanism)**  
    - **Rule for New Deadline:**  
      - Deadline = Current year + **remaining lifespan of offset**.  
      - Lifespan estimated from:  
        - Depletion rates (e.g., "oil reserves last 20 years at current use").  
        - Known expiry (e.g., "demographic dividend ends by 2040 per UN projections").  
      - **Max extension:** Original horizon + 50% (e.g., 10yr prediction → max 15yr extension).  
    - **Requirement:** Proponent must specify **exhaustion signals** (e.g., "if fertilizer costs triple, offset is weakening").  
    - **Record:** New deadline + exhaustion signals in spreadsheet.  

  ##### **Step 4b: Set Open-Ended Extension (Slow Mechanism)**  
    - **Rule for New Deadline:**  
      - Recalculate based on **observed rate** of mechanism (e.g., "if yield growth is 1%/yr not 2%, adjust ETA").  
      - **Max extension:** Original horizon + 33% (e.g., 10yr → max 13.3yr).  
    - **Requirement:** Proponent must show **current data aligns** with mechanism (e.g., "yield gains still linear, just slower").  

  #### **Step 5: Vote on Patience (Ambiguous Cases)**  
    - **Trigger:** Uncertainty in Step 4, or data gaps.  
    - **Question:** "Is this worth keeping, given club patience?"  
    - **Vote:** Secret ballot; majority wins.  
    - **Options:**  
      - Bounded extension (if offset plausible).  
      - Open-ended extension.  
      - Retire.  

  #### **Step 6: Update & Document**  
    - Log decision, new deadline (if any), and rationale in spreadsheet.  
    - Lock for 1 year.  

  ---

  ### **Intake Rule for New Predictions**  
  - **Deadline must be justified by mechanism timescale:**  
    - Proponent specifies:  
      - Causal mechanism (e.g., "algorithmic feedback loops").  
      - Estimated rate (e.g., "polarization increases 5%/yr based on 2010–2020 data").  
    - **No arbitrary horizons.** Reject predictions like "X by 2040" without rate-based calculation.  

  ---

  ### **Applied to Your Examples**  

  #### **1. Malthus 2.0 (Global calorie peak by 2040; famine by 2035)**  
  - **Step 1:** Unresolved (deadlines not reached).  
  - **Step 2:** Operationalized (FAO data; famine defined).  
  - **Step 3:** Mechanism not falsified (yield gains slowing but not dead).  
  - **Step 4:** **Offsetting mechanism?**  
    - ✅ **Temporality:** Fossil fuels/nitrogen fixation are exhaustible.  
    - ✅ **Independence:** External to land constraints.  
    - ✅ **Exhaustion signals:** Fertilizer price spikes, energy shortages.  
  - **Step 4a: Bounded extension**  
    - New deadline: **2045** (based on IPCC fossil fuel depletion timelines).  
    - Exhaustion signal: "Global fertilizer costs >300% 2020 levels."  
  - **Verdict:** Extend to 2045. Famine part stays until 2035 (no offset claimed).  

  #### **2. Peak Attention (Peak by 2021; 20% decline by 2025)**  
  - **Step 1:** Partially resolved (2021 peak not reached: data shows 2020 peak, then plateau).  
  - **Step 2:** Operationalized (min/day; Statista data).  
  - **Step 3:** **Falsified?**  
    - 20% decline by 2025 requires ~15%/yr drop; current trend is ±2%/yr → **mathematically impossible**.  
  - **Verdict:** Retire as **busted** (fails Step 3). *No extension allowed for impossible outcomes.*  

  #### **3. Algorithmic Feeds Destroy Shared Reality (by 2030)**  
  - **Step 1:** Unresolved.  
  - **Step 2:** Not operationalized (no metric for "shared reality").  
  - **Step 2a: Operationalize now?**  
    - Proposal: ">50% divergence in core factual beliefs (e.g., climate change, election integrity) per Pew surveys."  
    - **No consensus?** Retire as unverifiable.  
  - **If saved, fair operationalization:**  
    - Metric: **Belief divergence index** (average variance on 10 factual questions).  
    - Threshold: **>30% increase** from 2020 baseline.  
    - Data: **Pew Research or ANSIR polls**.  
  - **Verdict:** **Retire in 30 days** if not operationalized.  

  ---

  ### **Honest Assessment**  
  #### **Judgment Calls in a Lab Coat**  
  - Step 4 (offset vs. slow mechanism): Requires domain knowledge (e.g., is nitrogen fixation *truly* temporary?).  
  - Exhaustion signals (Step 4a): Subjective; club must agree on observability.  
  - Operationalization (Step 2a): Consensus-dependent ("shared reality" is inherently fuzzy).  

  #### **Predictable First-Night Failures**  
  - **Time overruns:** Contentious predictions (e.g., Malthus) may take 15+ min.  
  - **Data gaps:** "No public data" will trigger votes (Step 5), causing disputes.  
  - **Proponent backlash:** Neutral evaluators may face pressure; enforce rotation strictly.  

  #### **What This Can’t Solve**  
  - **Deep uncertainty:** When exhaustion signals are unobservable (e.g., "social cohesion erosion").  
  - **Theory-ladenness:** Whether a "rescue" is ad hoc (goalpost-moving) vs. scientifically valid.  
  - **Groupthink:** Votes (Step 5) may reflect popularity, not evidence.  

  ---

  ### **Why This > Vibes**  
  - **Structure beats bias:** Neutral evaluators + exhaustion tests prevent loudest-voice wins.  
  - **Built-in rigor:** Offset extensions require falsifiable signals, not just delays.  
  - **Transparency:** Rules force explicit operationalization and deadlines.  

  Implement this as-is for your next triage night—it’s imperfect but miles ahead of vibes. For calibration, run a mock trial on a non-club prediction first. Good luck!
