prompt: |-
  hey — I'm taking a philosophy of science seminar this semester (Popper, Lakatos, a little Kuhn, and one whole session on whether Malthus was just early rather than wrong), and I also help run the campus forecasting club. We keep a public spreadsheet of about 200 long-range predictions that members have logged since 2016, horizons anywhere from three to thirty years. Twice a semester we have a triage night where ten or so of us go through the unresolved entries and decide, for each one: leave it on the board, extend it with a new deadline, or retire it as busted. Right now it is pure vibes and whoever made the prediction argues the loudest. I want an actual procedure we can run, and I want you to build it around a distinction my TA threw out that I can't stop thinking about (more on that below).

  What I need from you:

  A triage procedure with the questions in order, what counts as an adequate answer to each one, where it stops with a no, and where it hands the decision to a vote because it's really a question about how patient we want to be rather than a question of fact. It has to be runnable in about ten minutes per prediction by undergrads with one shared spreadsheet and no statistics beyond what a spreadsheet does natively. Decisions are public and they stick for a year, so there's some mild reputational sting, and people show up defensive about their own entries — tell me how to structure the run so that the person applying the procedure is not the person who logged the prediction, and what to do when we simply can't get a number for the key variable because there's no public data series.

  The part I actually care about is what makes an extension legitimate (right but early) versus just moving the goalposts. Here is the idea I want built in: a rescue can have its own expiry date. If the only reason a prediction hasn't come true is an offsetting mechanism that is itself temporary or exhaustible — industrial nitrogen fixation and cheap fossil energy masking a Malthusian land constraint, say, or a one-shot demographic dividend propping up a growth forecast — then the extension should not be open-ended; it should be bounded by the remaining life of the rescue, and the club should have to say what would tell us the rescue is running out. That's very different from a delay that the theory's own mechanism explains, where the mechanism is real but just running slower than anyone guessed, and extending is cheap. Give me the tests that separate those two, plus a rule for setting the new deadline in the first kind of case, and a rule for the intake end too: when someone logs a new prediction, the deadline should be derived from the timescale of the mechanism they're invoking, not picked because it sounds far enough away.

  Then run it on three of our real entries.

  1. Malthus 2.0, logged 2017: global per-capita calorie production peaks before 2040, and at least one famine with over a million deaths before 2035, on the mechanism that arable land is fixed, yield gains are roughly linear, and demand compounds. Some indicators are drifting their way (yield growth flattening in a few regions) and some are not. It hasn't failed yet on its own terms.

  2. Peak Attention, logged 2015: average daily minutes on social platforms for US adults would peak by 2021 and fall at least 20% by 2025, because attention is a fixed budget and platforms hit a satiation ceiling. It has gone the other way, and every year somebody rescues it by changing what counts as a platform. I think this should be retired and I want to see whether the procedure agrees or tells me I'm being impatient.

  3. The one we'll all hate: our all-time most upvoted entry, from 2021, something like algorithmic feeds will destroy shared reality in the US by 2030. Everybody loves it, it gets re-upvoted every semester, and nobody can say what would count as it happening. If the procedure says operationalize it in 30 days or retire it, tell me that straight, and tell me what a fair operationalization would even look like here.

  Finally, be honest about which steps of the procedure are judgment calls in a lab coat, what will predictably go wrong the first night we run it, and what this kind of procedure just can't do — I assume there's some part of the right but early question that no checklist settles. We've got two triage nights left this semester and I'd rather bring something imperfect than another vibes session.
reasoning: |-
  We are designing a triage procedure for long-range predictions in a forecasting club. The procedure must be:
  - Runnable in about 10 minutes per prediction by undergrads.
  - Uses only a shared spreadsheet and basic spreadsheet functions.
  - Decisions are public and stick for a year.
  - The person applying the procedure should not be the one who logged the prediction to avoid bias.

  We also want to build in a key distinction: 
  - Legitimate extensions (right but early) vs. moving the goalposts.
  - In particular, when a prediction is delayed by an "offsetting mechanism" that is temporary or exhaustible, the extension should be bounded by the remaining life of that rescue mechanism. We need tests to separate this from a simple delay where the mechanism is running slower.

  The procedure will have a series of questions. We stop with a "no" at some points, and at others we hand it to a vote when it's about patience.

  We'll then apply it to three example predictions.

  ## Triage Procedure

  ### Step 0: Assign a neutral evaluator
  - The person who logged the prediction (the "proponent") cannot be the evaluator for that prediction. Rotate evaluators among the triage night participants.

  ### Step 1: Is the prediction resolved? (Fact-based)
  - **Question:** Has the event clearly happened or not happened by the deadline?
  - **Adequate answer:** 
    - "Yes, happened": There is clear, verifiable evidence that the event occurred as defined.
    - "Yes, not happened": There is clear, verifiable evidence that the event did not occur (or cannot occur) by the deadline.
    - "No": The event's status is ambiguous or the deadline hasn't passed.
  - **Decision:**
    - If "Yes, happened": Mark as resolved (correct) and retire.
    - If "Yes, not happened": Mark as resolved (incorrect) and retire.
    - If "No": Proceed to Step 2.

  ### Step 2: Is the prediction operationalized? (Fact-based)
  - **Question:** Is the prediction defined with clear, measurable criteria for success and failure?
  - **Adequate answer:** 
    - The prediction must specify:
      - The metric(s) to measure.
      - The threshold(s) for success (e.g., "at least 20% fall").
      - The source(s) of data that will be used to verify.
    - If the prediction does not have these, it is not operationalized.
  - **Decision:**
    - If "Yes": Proceed to Step 3.
    - If "No": Proceed to Step 2a.

  #### Step 2a: Can it be operationalized now? (Judgment call, but fact-based where possible)
  - **Question:** Can the group agree on clear, measurable criteria and data sources now?
  - **Adequate answer:**
    - The evaluator proposes an operationalization (using the proponent's original intent and group input) and checks for consensus.
    - If consensus is reached, update the prediction with the operationalization and proceed to Step 3.
    - If not, then:
  - **Decision:**
    - If operationalized: Proceed to Step 3.
    - If not: Retire the prediction as "unverifiable". (This is a failure of the prediction because it cannot be tested.)

  ### Step 3: Is the prediction falsified? (Fact-based)
  - **Question:** Is there evidence that the prediction cannot come true?
  - **Adequate answer:** 
    - Look at the current data and the mechanism. If the mechanism is broken (e.g., the causal chain is invalidated) or the current trajectory makes the target impossible by the deadline, then it is falsified.
    - Example: If a prediction requires 5% annual growth to reach a target by 2030, but the current growth rate is 1% and the deadline is near, then it's impossible.
  - **Decision:**
    - If "Yes": Retire as busted.
    - If "No": Proceed to Step 4.

  ### Step 4: Is the prediction still plausible? (Judgment call, but fact-based)
  - **Question:** Given current trends and the mechanism, is the prediction still plausible by the deadline?
  - **Adequate answer:** 
    - The evaluator (with group input) checks if the mechanism is still valid and the current data is not diverging from the required path.
    - If the mechanism is invalid (e.g., new evidence contradicts it) or the data is so off-track that the prediction is implausible, then it's not plausible.
  - **Decision:**
    - If "No": Retire as busted.
    - If "Yes": Proceed to Step 5.

  ### Step 5: Is the prediction delayed by an offsetting mechanism? (This is the key step for legitimate extension)
  - **Question:** Has an unexpected, temporary factor intervened that is masking the outcome, and is this factor exhaustible?
  - **Tests to separate offsetting mechanism from slow mechanism:**
    1. **Temporality Test:** Is the offsetting mechanism by its nature temporary? (e.g., a one-time demographic dividend, a finite resource being depleted, a policy that is unsustainable)
    2. **Exhaustibility Test:** Is there evidence that the offsetting mechanism is running out? (e.g., trends showing the mechanism weakening, or known limits that will be reached)
    3. **Independence Test:** Is the offsetting mechanism external to the original causal mechanism? (i.e., not part of the original theory)
  - **Adequate answer:** 
    - If the proponent (or group) can identify a specific, temporary, and exhaustible offsetting mechanism and provide evidence for its existence and temporality, then we proceed to set a bounded extension.
    - If the delay is just because the original mechanism is slower than expected (without an external offset), then we consider an open-ended extension (but with a new deadline set by the mechanism's timescale, see Step 6b).
  - **Decision:**
    - If there is an offsetting mechanism that is temporary and exhaustible: Proceed to Step 5a (set bounded extension).
    - If there is no offsetting mechanism, or it is not temporary (i.e., the mechanism is just slow): Proceed to Step 5b (set open-ended extension).
    - If unsure: Hand to a vote on whether an offsetting mechanism exists and is temporary.

  #### Step 5a: Set bounded extension (for offsetting mechanism)
  - **Rule for new deadline:** 
    - The new deadline is set to the point when the offsetting mechanism is expected to run out. 
    - The proponent must specify:
      - What will indicate the offsetting mechanism is running out (an observable indicator).
      - The expected time horizon for the exhaustion (with reasoning and data if available).
    - The group must agree on the indicator and the horizon. The new deadline should be the soonest plausible time the outcome could occur after the offset runs out, but not more than (original deadline + X years) where X is set by the club (e.g., 5-10 years). 
    - Also, the prediction is updated to include a clause: "Unless [offsetting mechanism] persists beyond [new deadline]".

  #### Step 5b: Set open-ended extension (for slow mechanism)
  - **Rule for new deadline:**
    - The new deadline is set based on the original mechanism's timescale. 
    - The proponent must justify the new deadline by re-estimating the time required for the mechanism to play out, using current data. 
    - The group must agree that the new deadline is reasonable (within the original theory's scope). 
    - The extension should not be more than (original deadline + Y years) where Y is a club policy (e.g., 5 years). 

  ### Step 6: Vote on patience (when there's ambiguity in Step 5)
  - If at Step 5 the group cannot agree on whether an offsetting mechanism exists or whether the prediction is still plausible, then hand the decision to a vote of the triage participants (excluding the proponent).
  - **Question for vote:** Should we extend the prediction?
    - Options: 
      - Extend with a bounded extension (if they believe in an offsetting mechanism)
      - Extend with an open-ended extension (if they believe the mechanism is just slow)
      - Retire (if they think it's busted)
  - The vote must be by secret ballot to avoid social pressure.

  ### Step 7: Update the prediction
  - Record the decision and the new deadline (if extended) in the spreadsheet, along with the reason.

  ### Intake Rule for New Predictions
  - When a new prediction is logged, the deadline must be justified by the timescale of the mechanism.
    - The proponent must state the causal mechanism and estimate the time required for it to produce the outcome, based on current conditions and known rates.
    - The club can ask for adjustments if the deadline seems arbitrary.

