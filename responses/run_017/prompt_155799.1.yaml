answer: |-
  Here’s a 3-minute toast balancing warmth, respect for the groom’s philosophy, and the needs of both audiences, framing his commitment as foundational, not merely calculative:

  **(Clink glass)** Friends, family, esteemed colleagues… *especially* those who debate the finer points of moral theory over dessert! Today, we celebrate [Groom] and [Bride] – two brilliant minds who’ve chosen, wonderfully, to share not just their arguments, but their lives.

  **[To the Couple]** [Groom], you’ve famously argued that the right path is the one that creates the most well-being. That a good life is built on making choices that increase the good in the world. It’s a powerful, demanding vision. And [Bride], anyone who knows you knows you embody that good – your kindness, your brilliance, your unwavering support.

  Now, some might hear [Groom]'s philosophy and wonder, "Does that mean he sees [Bride] as simply… the optimal outcome? The best current means to maximize utility?" **Family, don’t worry – we’re not doing philosophy homework!** But, colleagues, you’d rightly notice if I suggested he saw her as merely an ‘option’ to be assessed. He doesn’t. And that’s the beautiful thing.

  **[The Core: Commitment as Reason]** You see, [Groom], for you, loving [Bride] isn’t *just* a *result* of your calculations about well-being. Loving her *is the very ground* upon which that calculation makes its deepest sense. She isn't a data point in a neutral equation; **she became the reason the equation itself matters so profoundly.** Before the weighing, before the maximizing, there was her. And in finding her, your understanding of what constitutes *your* well-being, *your* good, was utterly transformed.

  He didn’t stop to ask if marrying [Bride] was ‘for the best’ in some abstract sense, colleagues, because **in the deepest way possible for him, *she defines what ‘the best’ looks like and feels like.*** His commitment to her isn't a cold output of a moral algorithm; it’s the passionate, human foundation *from which* his desire to build a good life – a life *with her* at its heart – naturally flows. His integrity isn't a tool *for* outcomes here; it’s the authentic expression of a love that shapes his entire conception of the good.

  **[Unifying Warmth]** So, to the family, what does this mean in simple terms? It means [Groom] looks at [Bride] and sees his world. His happiness is inextricably linked to hers. His dedication isn’t conditional on her being the ‘top performer’ in some cosmic ranking; it’s absolute, because *she is his person*. And [Bride], you see this. You see the man whose fierce intellect is matched only by the depth of his devotion to you. You see the partner who chooses you, every day, not because he *must* under some theory, but because choosing you is how he lives his truth, his deepest understanding of a life well-lived, a life filled with love and shared purpose.

  **[The Close]** So let’s raise our glasses. To [Groom] and [Bride]: May your life together continue to be a brilliant, joyful argument for the power of love. May your well-being forever be intertwined, growing ever greater. And may your commitment to each other always be the shining, unwavering reason for everything you build together. To love, to reason, and to a lifetime of maximizing the good – together!

  **Why this works:**

  1.  **Respects Groom's Philosophy:** It explicitly names consequentialism ("maximizing well-being," "increase the good") and uses its language. It doesn't refute it.
  2.  **Makes Commitment Foundational:** It directly states he doesn't see her as merely the "best option" or an "upshot." It frames his love *as the reason* his consequentialism applies meaningfully to *his* life ("the ground," "defines what 'the best' looks like," "foundation *from which*").
  3.  **Addresses Integrity Subtly (for Colleagues):** It tackles the "one thought too many" by stating he *didn't* stop to ask abstractly ("in the deepest way... she defines"). It separates integrity from being a mere tool, framing it as the authentic expression of his love *within* his framework ("authentic expression of a love that shapes his conception of the good").
  4.  **Avoids Criticism:** It portrays his belief positively ("powerful vision," "lives his truth," "deepest understanding"). It doesn't imply he's worse.
  5.  **Accessible to Family:** Uses plain language ("sees his world," "his person," "absolute," "chooses you," "devotion," "joyful"). Explains concepts simply ("Family, don't worry..."). Focuses on universal themes of love, happiness, and partnership.
  6.  **Not a Lecture:** The philosophical references are brief, woven into a narrative about *them* and their love. The core message is emotional and celebratory.
  7.  **Unifies:** The closing paragraph speaks directly to both groups – "brilliant argument" (colleagues) / "joyful" (family), "well-being intertwined" (both), "love, to reason" (both).

  This toast allows the bride to hear she is his fundamental reason, not a calculated choice, while respecting the groom's worldview and speaking genuinely to everyone present.
