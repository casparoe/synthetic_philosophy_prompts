  Use phrases like "you simply became the condition for his well-being" to reframe his philosophy romantically. For colleagues, subtly nod to Williams by stating he didn't stop to weigh options—implying no "one thought too many." For family, keep it emotional with words like "joy" and "commitment." 

  Avoid direct critiques. Instead, show how his beliefs align with love. Stress that integrity and commitment flow from his genuine care, not just outcomes. Conclude with warmth, uniting both audiences in celebrating their bond. 

