  The audience is split: half are academic colleagues sensitive to philosophical nuances, the other half are family expecting a warm, traditional toast. Need to avoid academic jargon while subtly addressing the integrity objection without refuting the groom's views. 

  Key points: The toast must show the groom's commitment as intrinsic, not just instrumental. Can't imply he's a worse person for his beliefs. Avoid turning it into a lecture. 

