answer: |-
  Starting from our shared commitment that ordinary waking adult humans have conscious experiences, let's navigate the logical space step by step. First, consider a lone fundamental particle in an otherwise empty universe: does it have any experience at all? If not, then ask whether the entire cosmos—the whole universe—is itself a fundamental subject of experience. If yes, you're a cosmopsychist, whose most awkward commitment is that the universe has a unified consciousness despite its apparent disunity and lack of biological organization. If the cosmos isn't fundamentally conscious, then consider a brick-sized lump of matter built from non-experiential particles: is that lump itself a subject? If yes, you endorse universal strong emergence, with the awkward consequence that even simple aggregates like bricks have conscious experiences inexplicably arising from non-conscious parts. If no, then human consciousness must emerge from non-conscious parts in complex systems like brains. Here, ask whether the unity of a conscious subject (like you) is something over and above its parts. If no, you hold that there's no deep unity to explain—it's just parts under a description—and your awkward commitment is that the apparent seamlessness of consciousness is illusory or trivial. If yes, you're a strong emergentist about subjects, facing the awkward brute emergence of unified consciousness from ununified, non-conscious components.  

  But back to the lone particle: if it *does* have experience, ask whether its experiences are drawn from the same palette as ours (colors, pains) or are of an ineffable kind we couldn't recognize or describe. If they're from our palette, you're a familiar-quality panpsychist, awkwardly committed to fundamental particles having complex, human-like experiences. If ineffable, ask whether a brick-sized lump built from such particles is itself a subject. If yes, you're an unrestricted panpsychist, awkwardly attributing unified experience to arbitrary macro-objects. If no, you're a constitutive micropsychist: particles have experiences, but only certain structures (like brains) yield macro-subjects. Now, can a macro-subject formed from many micro-subjects have a phenomenal quality—say, the taste of coffee—that none of its parts has? If no, then the macro's experience is just the sum of the parts. Ask whether the unity of that macro-subject is something beyond the parts. If no, you hold the identity view of combination, with the awkwardness that human consciousness must be decomposable into trillions of particle-sized experiences. If yes, ask whether the relation unifying the parts is itself conscious. If yes, you face a regress (what unifies the relation and the parts?), landing in the phenomenal-bonding regress view, whose awkward commitment is an infinite hierarchy of conscious unifiers. If the unifying relation isn't conscious, you're in the phenomenal-bonding view sans regress, awkwardly positing a fundamental non-conscious "bonding" relation.  

  If you answered yes—the macro *can* have qualities none of its parts has—then parts contribute to but don't fully constitute the macro's experience. Ask whether this macro-subject is something beyond its parts. If no, you hold a non-reductive yet deflationary view, awkwardly claiming novel qualities emerge without ontological addition. If yes, you're a fusionist: micro-subjects fuse into a new entity, with the awkward consequence that the original parts cease to exist when combined.  

  Now, some empty cells: the view that particles lack experience, the cosmos isn't conscious, and bricks *are* subjects is empty because unattractive—it grants consciousness to arbitrary lumps while denying it to the universe. The view that particles have ineffable experiences, bricks aren't subjects, and unity is beyond parts but the bonding relation *is* conscious (without regress) is unexplored—no one has defended it. Two leaves remain indistinguishable: unrestricted panpsychism (bricks are subjects) and familiar-quality panpsychism (particles have human-like experiences) can overlap if one holds both, but our questions can't pry apart every combination. Use the split-brain case for refinement: if disconnecting hemispheres gradually shifts you from one subject to two or to vagueness, it challenges views where unity is fundamental. And if a mind switched off/on every second is one subject, it suggests diachronic unity might mirror synchronic combination—pushing cosmopsychists or fusionists to explain temporal unity. This tree maps the jungle; now we can clear paths together.
