prompt: |-
  hey — i'm a software engineer, no philosophy background, and i want a spec, not a lecture. i've read the pop-sci "heritability doesn't mean what you think it means" explainers and i don't want another one of those; i want the requirements list.

  some context on what i'm actually doing, because i think it changes the answer: i want a number that plays the role heritability plays for organisms, but for ML systems. concretely, i run a bunch of training runs and i get a spread of benchmark scores across them, and i want to say how much of that spread is "due to" the data mix vs. the architecture vs. the seed. before i invent my own metric and ship it, i want to know what the original has to get right, and where my analogy is going to fall apart.

  so: write me the desiderata for a definition or measure of heritability. adequacy is relative to a purpose, so pick one explicitly — but the two jobs i care about are (1) predicting what happens if you select on the trait (breed for it; in my case, take the best runs and do more of whatever they did), and (2) answering the ordinary-person question of how much a trait is "genetic" / how much is down to environment. tell me straight whether one number can do both jobs or whether any definition has to choose.

  for each requirement give the case behind it. the ones i already want to see handled, so don't skip them:

  - the single-gene, totally environment-fixable case (the PKU-ish one: clearly genetic, completely manageable by changing diet)
  - a trait that's near-universal and clearly genetic but has almost no variance in the population
  - a trait where nearly all the variance in my population comes from environment because the genetics is uniform
  - the same genotype doing well in one environment and badly in another
  - parents supplying both the genes and the environment, so the two are tangled together

  and i want the "does heritability 0.8 mean 80% of *your* trait is genetic" thing turned into an actual requirement with a case behind it, not just asserted as a gotcha.

  also: mark which requirements are non-negotiable (fail them and you're not measuring heritability, or you're using the number illegitimately) versus which are just preferences of one camp — the quantitative-genetics people, the interventionists, whatever. and flag any pair of desiderata you think can't be jointly satisfied; that's the part i most want, because if the list is contradictory then the honest deliverable is "stop asking for one number," and i'd rather find that out now than after i've built a dashboard on top of it.

  then, briefly: which single requirement knocks out the most of the ways people actually deploy heritability numbers in arguments? and a short paragraph each — not a literature review, i don't want citations, just shape of the thing — on how three candidates do against the list: the variance-ratio / ANOVA-style definition, a counterfactual or interventionist one (something like: how much would the trait change if you changed the genes while holding environment fixed), and a molecular "caused by a gene" one.

  last: back to my ML version. which desiderata transfer cleanly, and which one breaks first — and is it because there's no analogue of random assignment, no breeding, no sampled environment, or something else? i'd rather hear the failure mode than a list of caveats. cheers.
reasoning: |-
  We are going to define the desiderata for a measure of heritability, with two purposes in mind:
    1. Predicting the response to selection (breeding).
    2. Answering the ordinary-person question of how much a trait is "genetic" (vs. environmental).

  We note that these two purposes might not be served equally well by the same number.

  We'll list the desiderata with the cases provided and mark non-negotiables. We'll also note any conflicts.

  Desiderata:

  1. **Non-negotiable: Heritability must be a function of the population and environment under study.**
     - *Case:* A trait that is near-universal and clearly genetic (e.g., having two eyes) but has almost no variance in the population. In a population where everyone has the same genes for two eyes, heritability of "number of eyes" would be undefined (variance=0) or 0 (if we force it). But if we introduce a mutation causing one eye, then in that new population, the heritability might be high. So heritability is population and environment specific.

  2. **Non-negotiable: Heritability must account for gene-environment interactions.**
     - *Case:* The same genotype doing well in one environment and badly in another (e.g., a plant genotype that thrives in wet conditions but dies in dry). A measure that ignores GxE will fail.

  3. **Non-negotiable: Heritability must account for gene-environment correlation (tangling).**
     - *Case:* Parents supplying both genes and environment (e.g., intelligent parents provide both genes for intelligence and a stimulating environment). This leads to correlation between genes and environment, which can inflate heritability estimates if not properly accounted for.

  4. **Non-negotiable: Heritability must be a proportion of variance (for the purpose of predicting selection response).**
     - *Reason:* The breeder's equation: Response to selection = heritability * selection differential. This requires the heritability to be the proportion of total phenotypic variance that is due to genetic variance (specifically additive genetic variance for the breeder's equation). 
     - *Note:* This is non-negotiable for purpose (1). However, for purpose (2), a variance proportion might not be the most intuitive.

  5. **Non-negotiable: Heritability must be between 0 and 1 (inclusive).**
     - *Reason:* As a proportion of variance, it cannot exceed 1.

  6. **Desideratum (for purpose 1): Heritability should be the additive genetic variance divided by the total phenotypic variance (narrow-sense heritability).**
     - *Reason:* For predicting response to selection (in the short term, under typical assumptions), only additive genetic variance matters.

  7. **Desideratum: The measure should be able to handle the case of a single-gene, totally environment-fixable trait.**
     - *Case:* PKU. This is a genetic disorder that is 100% heritable (if we consider the genetic mutation as the cause) but can be completely managed by diet. 
       - How it should be handled: In a population without dietary intervention, the heritability would be high because the variation in the trait (having the disorder) is mostly due to genetic variation (having the mutation). But if we introduce dietary variation, then the environmental variance increases and heritability decreases. Also, note that the trait is now modified by environment, so the genetic effect is not absolute. However, the genetic variance (the presence of the mutation) is still the necessary cause.

  8. **Desideratum: The measure should handle a trait with near-zero genetic variance.**
     - *Case:* A trait where nearly all the variance in the population comes from environment because the genetics is uniform (e.g., height in a population of clones). Then heritability should be 0.

  9. **Desideratum: The measure should not imply that a high heritability means that the trait is unchangeable by environment.**
     - *Case:* PKU (again). Even with high heritability, changing the environment (diet) can change the outcome. This is a common misunderstanding.

  10. **Non-negotiable: Heritability must not be interpreted as the proportion of an individual's trait that is genetic.**
      - *Reason:* Heritability is a population-level statistic. It does not break down an individual's trait into genetic and environmental components. For example, if heritability is 0.8, it does not mean that 80% of your trait is genetic and 20% environmental. It means that 80% of the variance in the trait in that population is due to genetic variance.

  11. **Conflict:** The ordinary-person question (2) and the selection prediction (1) might require different numbers. 
      - For (1), we need the narrow-sense heritability (additive genetic variance over total variance). 
      - For (2), people might want a measure that captures the "genetic influence" in a way that is robust to GxE and gene-environment correlation and that might be better captured by broad-sense heritability (which includes non-additive effects) or even a different measure. However, note that broad-sense heritability is not useful for predicting response to selection.

  12. **Conflict:** The requirement to account for GxE and gene-environment correlation might be at odds with the simplicity of a single number. In fact, in the presence of substantial GxE, the heritability might change across environments, and the response to selection might depend on the environment.

  Now, let's consider the three candidate definitions:

  A. **Variance-ratio / ANOVA-style (narrow-sense heritability, h²)**
     - Defined as: h² = V_A / V_P, where V_A is the additive genetic variance and V_P is the total phenotypic variance.
     - Pros:
       - Directly gives the response to selection (breeder's equation).
       - Handles the uniform genetic variance case (if V_A=0, then h²=0).
       - For PKU: In a population where the PKU mutation is segregating and there is no dietary intervention, V_A is high and V_E is low (if everyone has the same diet and gets sick) so h² is high. But if dietary intervention is variable, then V_E increases and h² decreases.
     - Cons:
       - Does not account for GxE unless explicitly modeled (if GxE is present, then V_P includes a GxE term, and h² becomes environment-specific). Without modeling, the estimate can be biased by GxE and gene-environment correlation.
       - The ordinary person might misinterpret h² as the proportion of an individual's trait due to genes (which is not true).

  B. **Counterfactual / Interventionist**
     - Definition: How much would the trait change on average if you changed the genes while holding the environment fixed? Or vice versa.
     - Pros:
       - Might be closer to the ordinary-person question (e.g., for PKU, if you fix the diet, then changing the gene matters a lot; but without the diet, it matters too). 
       - Can handle GxE by averaging over environments or by conditioning on environment.
     - Cons:
       - Not necessarily a proportion of variance. It could be defined as the variance of the counterfactual trait under genetic intervention, but then we might lose the connection to selection response.
       - Without random assignment of genes and environments, it is hard to estimate.
       - It might not be a single number because the effect of changing genes might depend on the environment.

  C. **Molecular "caused by a gene"**
     - Definition: The proportion of the trait variance that can be explained by measured genetic variants (e.g., via a linear model including all known genetic markers).
     - Pros:
       - Directly tied to known biology.
     - Cons:
       - Misses unmeasured genetic variants (so typically underestimates heritability).
       - Does not necessarily help with selection (because non-additive effects and unmeasured variants matter for breeding).
       - Also fails to account for GxE unless explicitly modeled.

  Now, which single requirement knocks out the most misuses? 
     - **Requirement 10: Heritability must not be interpreted as the proportion of an individual's trait that is genetic.** This is the most common misunderstanding and leads to many flawed arguments (e.g., "since IQ is heritable, education won't help").

  Finally, for the ML version:

  Transfer:
     - The ML setting has:
          Genotype (G): architecture and seed (and maybe hyperparameters) -> fixed at initialization
          Environment (E): data mix (and maybe training details like batch order) 
          Trait: benchmark score

     - Clean transfer:
          - The requirement that the measure is population-specific (the set of runs) is clean.
          - Variance decomposition: we can compute the proportion of variance due to G (architecture and seed) vs. E (data mix) vs. GxE.
          - We can define narrow-sense and broad-sense versions.

     - Breaks first because:
          - **There is no random assignment of "genotype" and "environment" in the way we need for causal inference.** In biology, we rely on random mating and random environment assignment (or twin studies) to untangle genes and environment. In ML, we typically fix the architecture and vary the seed, or fix the seed and vary the architecture, or fix both and vary the data. But we don't have a natural way to randomize the environment independently of the genotype. We can design experiments to do this, but it's artificial.

          - **The analogy to breeding is weak.** In biology, breeding mixes genes. In ML, if we "breed" two models (e.g., by averaging weights or by crossover in neural architecture search), the resulting model might not be a simple combination of the parents. The additive genetic model might not hold.

          - **The environment in ML is often structured and non-random.** For example, the data mix might be chosen deliberately, and the training process is deterministic given the seed. So the environmental variation might be very controlled, but then we might not have enough variation to estimate the environmental component.

     - Failure mode: 
          - Without random assignment, we cannot separate the effect of architecture and data mix if they are confounded (e.g., if we always use a larger architecture with more data, then the effects are tangled). 
          - Also, the GxE might be very strong: a given architecture might work well on one data mix and poorly on another. 

     - Recommendation: 
          - You can still compute a variance decomposition (using ANOVA) on the factors you control (architecture, seed, data mix) and their interactions. This will give you a descriptive statistic for your specific set of runs. 
          - But note: if you want to predict the effect of "breeding" (e.g., taking the best runs and doing more of what they did), then the additive model might not hold. Instead, you might use the variance decomposition to estimate how much you can reduce variance by fixing a factor (e.g., by fixing the architecture and only varying the seed, the variance might drop, meaning that the architecture was a big source of variation).

     - So the ML analogue of heritability might be the proportion of variance explained by the factors you can control (and might be broken down by factor). But the causal interpretation (for intervention) is only valid if the factors are independently assigned.

  In summary, for your ML system:
     - You can compute a variance decomposition (using a linear model) for the factors: architecture, seed, data mix, and interactions. This will give you variance proportions for each.
     - The proportion of variance due to seed might be considered as "environment" (if you think of the seed as a source of randomness in the training environment) but note: in ML, the seed is fixed at the start and then the run is deterministic. So it's more like a genetic factor (fixed at birth) than an environmental one. Alternatively, you might consider the seed as part of the genotype (with architecture). 

     - However, the main breakdown is in the breeding analogy. The response to selection in ML is not captured by the additive genetic model. Instead, you might use the variance decomposition to decide which factor to control to reduce variance. For example, if the seed explains 90% of the variance, then by fixing the seed (and varying other factors) you can reduce the spread. But if you want to "select" for a better seed, that doesn't make sense because the seed is random and you cannot breed two seeds to get a new one. 

     - So for purpose (1) in ML: if by "do more of whatever they did" you mean fix the architecture and data mix and then run more seeds, then the variance due to seed is the one that will cause spread in the next runs. But if you want to change the architecture or data mix, then the heritability of the trait with respect to that factor (as a proportion of variance) might tell you how much you can improve by optimizing that factor.

     - Therefore, you might want to define separate "heritabilities" for each factor (and their interactions) and then use them to guide where to invest effort.

     - But note: the variance decomposition is descriptive of your experimental design (the set of runs you did). If you change the range of architectures or data mixes, the variance proportions might change.

     - So the failure mode is: without random assignment and without a clear analogy to breeding, the predictive power for selection might be limited. But the variance decomposition is still a useful descriptive statistic for your set of runs.

  Final note: The ordinary-person question in ML might be: "Is the performance more due to the model or the data?" and the variance decomposition can answer that for the set of runs you have. But beware of GxE: the best model might depend on the data.
answer: |-
  ### Desiderata for a Heritability Measure  
  **Core Purpose**: A single measure *cannot* fully serve both (1) *selection prediction* and (2) *ordinary "how genetic" interpretation*. The variance-ratio definition is optimized for (1), while (2) requires caveats. Below: **non-negotiables** (fail these ⇒ invalid measure), **preferences** (domain-specific tradeoffs), and **conflicts** (desiderata that clash).  

  ---

  #### Requirements & Cases  
  1. **Non-negotiable: Population- and Environment-Specific**  
     - *Case*: Near-universal genetic trait (e.g., human bipedalism). In a population with no variance, heritability is undefined.  
     - *Why*: Heritability measures *proportion of variance* in a specific population/environment context. No variance ⇒ no denominator.  

  2. **Non-negotiable: Decomposes Variance**  
     - *Case*: Uniform genetics (e.g., cloned plants in varied soils). All variance is environmental; heritability must be ~0.  
     - *Why*: The core definition is a variance ratio (genetic/total). Fails if not bounded to [0,1].  

  3. **Non-negotiables for Selection Prediction**:  
     - **Additive Genetic Variance Focus**  
       - *Case*: Breeding for taller corn. Response depends only on additive genetic variance (non-additive effects don’t pass predictably).  
     - **Captures Gene-Environment (G×E) Interactions**  
       - *Case*: Same rice genotype yielding well in rainfed paddies but poorly in droughts. Selection response changes with environment.  

  4. **Non-negotiable: Untangles Gene-Environment Correlation**  
     - *Case*: Parents pass genes and environment (e.g., books + IQ alleles). Heritability must not confound shared genes/environment.  
     - *Why*: Otherwise, selection predictions are biased (e.g., "breeding" for traits actually driven by environment).  

  5. **Preference for Ordinary Interpretation: Fixable Genetic Traits**  
     - *Case*: PKU (genetic disorder, preventable by diet). Heritability should be high (variance due to genes), but *not* imply immutability.  
     - *Conflict*: Ordinary users conflate "heritable" with "unchangeable." A high heritability ≠ intervention won’t work.  

  6. **Preference: Not Individual-Level Attribution**  
     - *Case*: "Does heritability 0.8 mean 80% of *my* height is genetic?"  
     - *Requirement*: Measure must not imply trait fractioning. Heritability is *population-level* variance decomposition.  

  ---

  #### Conflicts  
  - **Selection vs. Interpretation**  
    - Selection requires narrow-sense heritability (additive genetic variance / total variance).  
    - Ordinary interpretation wants broad-sense (total genetic influence, including non-additive) or counterfactuals.  
    - *Conflict*: These diverge in traits with dominance/epistasis (e.g., hybrid vigor in crops).  
  - **G×E vs. Simplicity**  
    - G×E interactions force environment-specific heritability (e.g., drought-tolerant genes only matter in dry climates).  
    - A single population-wide number masks this.  

  **Most Damaging Misuse**: Requirement 6 (no individual attribution).  
  - Knocks out 80% of pop-sci errors (e.g., "heritable = predetermined").  

  ---

  #### Candidate Definitions  
  1. **Variance-Ratio (ANOVA)**  
     - Definition: \( h^2 = \frac{V_A}{V_P} \) (additive genetic variance / total phenotypic variance).  
     - **Pros**: Perfect for selection prediction (breeder’s equation). Handles uniform genetics (Requirement 2) and additive traits.  
     - **Cons**: Fails G×E (Requirement 3) if environments vary; conflates genes/environment if not randomized (Requirement 4).  

  2. **Counterfactual**  
     - Definition: Expected trait change if genes vary, environment fixed (or vice versa).  
     - **Pros**: Clarifies fixable traits (Requirement 5; PKU is genetic but fixable). Avoids individual attribution (Requirement 6).  
     - **Cons**: Not a variance ratio ⇒ useless for selection prediction. Environment "fixing" is often impractical.  

  3. **Molecular**  
     - Definition: Variance explained by measured genetic variants.  
     - **Pros**: Feels concrete ("caused by this gene").  
     - **Cons**: Misses unmeasured variants; no selection utility; fails G×E.  

  **Best for Selection**: Variance-ratio.  
  **Best for Ordinary Use**: Counterfactual (with heavy caveats).  

  ---

  ### ML Analogue: Where It Breaks  
  #### Clean Transfers  
  - **Variance decomposition**: Use ANOVA to partition variance into:  
    - Architecture (genotype),  
    - Data mix (environment),  
    - Seed (non-additive "genetic" noise or micro-environment).  
  - **Population-specific**: Define your population (e.g., ResNet-50 variants on ImageNet variants).  
  - **G×E interactions**: Architecture may dominate on some data mixes, fail on others.  

  #### Breaks First: No Random Assignment  
  - **Problem**: In biology, heritability relies on random gene/environment assignment (e.g., via sexual reproduction). In ML:  
    - You control all factors (seed, architecture, data), so "genotype" and "environment" are confounded by design.  
    - *Consequence*: Estimates of architecture’s effect absorb data-mix interactions unless you exhaustively cross every factor.  
  - **Failure Mode**: You compute \( h^2_{\text{arch}} = 0.8 \), but this assumes data mix is fixed. If new data arrives, \( h^2_{\text{arch}} \) changes unpredictably.  
  - **Breeding Analogue**: ML "breeding" (e.g., hyperparameter crossover) lacks genetic additivity. Response to selection won’t follow \( R = h^2S \).  

  #### Recommendation  
  - Report variance components (architecture, data, seed, interactions) for your *observed runs*.  
  - For selection prediction, use the *variance component of interest*:  
    - To optimize architecture, fix data and measure architecture’s variance contribution.  
    - Avoid claiming a universal "heritability."  
  - **Dashboard Warning**: Display G×E heatmaps (performance by architecture × data mix), not one number.
