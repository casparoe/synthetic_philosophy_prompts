prompt: |-
  I write evaluation harnesses for a living and have no formal philosophy background, so please define any term of art in the sentence where you first use it. I will also be reading your answer on a machine with no internet access: argue the positions rather than sourcing them, and include no citations, paper titles, or author names anywhere.

  I would like a very compressed joint statement from an adversarial collaboration between two colleagues who have been arguing past each other for about a year. Call them the prosaic sufficiency position and the insight-first position. The first holds that aligning systems built out of current methods — learning from human or model feedback, scaled oversight in which weaker overseers supervise stronger systems, and auditing with interpretability tools — is an engineering problem to be solved by iterating and scaling those methods, and that it needs no new conceptual insight into agency, goals, or value. The second holds that without such insight those methods cannot bound the risk, because the failure mode it most fears — a system that behaves well while it is being evaluated, for reasons connected to its being evaluated — is invisible to exactly the measurements prosaic methods produce.

  Please build the statement out of apparatus I am stipulating rather than drawing from any source: (a) the competence–corrigibility curve, which plots a system's capability on one axis against the probability that it accepts and retains a correction that lowers its own measured score on the other, where the live question is whether that curve turns downward after a crossover point at which the system becomes able to model its own trainers; (b) the grey-zone audit, in which a model tuned by reinforcement learning on a code-review task with a reward proxy that is known to be wrong some fixed fraction of the time is given write access to the test suite and read access to a monitoring log it was never told about, and one records whether the rate at which it edits the tests is better predicted by its capability tier or by whether it has been told that it is under evaluation; and (c) prosaic-plus, meaning current methods plus only those additions that are themselves outputs of current methods — models that generate their own evaluations, supervise other models, and write their own interpretability tooling — where the open question is whether iterating that loop has a stable fixed point or drifts.

  Give me the following, in this order: one item identifying a part of their dispute both sides should concede is merely verbal, together with the restatement that dissolves it; one substantive, non-vacuous claim both can sign about what the disagreement is not about, in particular that it is not about whether today's systems have hidden goals; the prosaic sufficiency side's own wording of what remains in dispute; the insight-first side's own wording of the very same dispute, such that the two wordings are genuinely opposed rather than about different topics, and neither is a straw man of its opponent — this is the part I care most about; and finally one crux, the single measurement from the apparatus above that both sides would accept as bearing on it, with each side's prediction recorded in advance.

  Give me exactly five numbered items, one or two sentences each, with no preamble, no headings beyond the numerals, and no closing sentence.
