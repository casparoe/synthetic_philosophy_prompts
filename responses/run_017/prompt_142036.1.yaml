  **MEMORANDUM**  
  To: Town Energy and Climate Advisory Committee  
  From: [Your Name], Member  
  Date: October 26, 2023  
  Re: Recommendation for Community Pathways Pilot Track Selection  

  ---

  ### Recommendation  
  The Committee recommends Track 1 (Price and Dividend) for our application to the Community Pathways Pilot, conditional on adopting the "both-books" rule for emissions accounting.  

  ### Context and Scale  
  Our annual territorial emissions are 96,000 tonnes CO₂e. Transport (mostly trucks and commutes) is half of this. Buildings—electricity, heating, and waste—make up the rest. Two critical constraints:  
  1. Our renewable electricity aggregation means local electricity emissions are largely notional; real reductions occur elsewhere on the grid.  
  2. 22% of residents are over 65, with many in gas-heated, inefficient homes. Median household income is 8% below the state median.  

  Neither pilot track will alter global temperatures measurably. Our choice must rest on other grounds: which approach fairly distributes burdens, builds legitimacy through democratic action, and best positions our town as a credible model for larger-scale efforts.  

  ### Comparing Tracks  
  **Track 1 (Price and Dividend)**  
  - *Mechanism*: A carbon price starting at $60/tonne (rising $15/year) on electricity and natural gas. Revenue is returned equally to all households as cash.  
  - *Projected Impact*: ~9% territorial emissions reduction over 5 years.  
  - *Strengths*:  
    - Puts a price on emissions without guessing *how* to reduce them.  
    - The dividend offsets costs for lower-income households. A typical gas-heated home pays ~$240/year initially but receives equal dividend shares (estimated $100–$150/household/year early on).  
    - Aligns with our existing renewable electricity efforts.  
  - *Weaknesses*:  
    - Excludes transport (50% of our inventory), limiting impact.  
    - Disproportionately affects older residents in drafty homes—though the dividend partially compensates.  

  **Track 2 (Sufficiency First)**  
  - *Mechanism*: A 6%/year declining cap on vehicle-km (freight/light duty), new heated floor area, and waste. Binding through zoning/permitting.  
  - *Projected Impact*: Targets our largest emissions source (transport) but risks “leakage”:  
    - The logistics park (340 jobs, ~20% of commercial tax base) may relocate 4 km east, nullifying global emissions cuts and costing jobs.  
    - Commuters (900+ residents) face reduced mobility with sparse bus service.  
  - *Strengths*:  
    - Directly constrains high-impact sectors (e.g., freight).  
    - Embodies the "degrowth" principle of reducing throughput.  
  - *Weaknesses*:  
    - Heavy administrative burden.  
    - Vulnerable to economic leakage and legal challenges.  
    - No flexibility; if targets are mis-set, hardship follows.  

  ### Why Track 1?  
  1. **Burden vs. Benefit**: Track 1’s dividend ensures costs don’t fall solely on fixed-income households. Track 2 risks exporting jobs and emissions without social safeguards.  
  2. **Legitimacy**: A price signal decided by elected bodies (and softened by dividends) is more transparent than top-down caps.  
  3. **Demonstration Value**: Showing that carbon pricing *works* locally—without economic rupture—could inspire broader adoption. Track 2’s rigidity may deter replication.  

  ### The "Both-Books" Rule  
  We must report **both territorial and consumption-based inventories**, with policy judged against whichever is worse. Why?  
  - **Territorial**: 96,000 tonnes (as above).  
  - **Consumption-based**: Includes emissions from goods/services consumed here but produced elsewhere. My estimate: ~115,000 tonnes (±35,000 tonnes). Error bars are wide (±30%) due to data gaps for a town our size.  
  **Recommendation**: Adopt this rule. A clumsy but honest number is better than ignoring embedded emissions. We can refine methodology yearly.  

  ### The Strongest Case for Track 2  
  Track 2 forces reckoning with hard limits—unlike pricing, which may let wealthier households buy their way out. It confronts the "warehouse problem": logistics emissions are territorial but serve global consumption. If reducing throughput is ethically urgent, half-measures like pricing electricity are inadequate. Sufficiency could build community resilience by design, not market chance.  

  ### What Would Falsify Our Recommendation?  
  By Year 3, these outcomes should prompt reevaluation:  
  - **Track 1**: If heating costs rise >20% without dividend relief, or if emissions fall <5%.  
  - **Track 2**: If the logistics park relocates, or if vehicle-km caps increase resident fuel costs without alternatives.  

  ### On Marv’s Hybrid Proposal  
  Auctioning freight permits at the logistics park with revenue rebates is incoherent. It grafts a dividend onto a cap but ignores key flaws:  
  - Still risks the park’s relocation.  
  - Fails Track 2’s requirement for multi-sector caps.  
  - Duct-tapes two instruments without resolving either’s weaknesses.  

  ### Conclusion  
  We recommend Track 1 because it balances equity, feasibility, and demonstration value. It avoids immediate economic harm while embedding a scalable policy. The "both-books" rule ensures accountability for exported emissions. Our goal is not measurable climate impact—it is proving that a community can price carbon justly.  

  \answer{Track 1}
