prompt: |-
  I'm a third-year undergraduate in a seminar on the metaphysics of persons, and we have just finished the unit on teletransportation and what matters in survival. For the final paper I have to defend one account of what matters, and I would rather start from a specification than from the usual menu of isms. Please write me the desiderata — exactly five — that any adequate account of what matters in survival would have to satisfy.

  Treat the plain destructive-scan case as settled background: every view on our reading list handles it, and handles it in a way I already understand, so do not spend one of the five on it. Build the list out of harder cases instead. Please draw on the following cases, which my seminar has not discussed:

  - the Relayed Reconstruction: the scan is destructive but carried out one cell at a time, each cell on Earth being replaced as its counterpart is assembled on Mars, so that at every instant there is exactly one physiologically complete brain's worth of tissue, but it is distributed across two planets.
  - the Cold Archive: the scan is recorded and never instantiated; the original later dies of old age; three centuries after that death the record is finally run.
  - the Aborted Twin: a second copy is transmitted, but the signal is corrupted and the second replica is destroyed milliseconds after assembly without ever having had a conscious experience.
  - the Lossy Scan: the reconstruction preserves something like 99.9 per cent of the relevant structure, and the resulting person is recognisably the original but noticeably changed.
  - the Reluctant Replica: the reconstruction wakes up, is told what was done, and sincerely disclaims any prudential concern for what happens to the person they will become, regarding the procedure as nothing but the creation of a successor.

  Four constraints on the list:

  1. State each desideratum as a demand together with the case that makes it a demand, and pitch each one so that a defender of any of the familiar views — identity is what matters; some psychological continuity or connectedness relation is what matters, with or without a normal-cause or non-branching clause; there is no deep further fact — could in principle accept it. The point is to specify adequacy, not to settle the dispute by stipulation.
  2. At least one desideratum should police the boundaries of the concept: what an account has to keep apart — survival from what matters, what matters from what it is rational to anticipate or fear, the obtaining of the relation from the value of the outcome.
  3. At least one should say what an account owes us if, as the Lossy Scan suggests, what matters admits of degrees: a cardinal scale, a threshold, a rule for aggregating lesser degrees across many recipients, or a principled reason for refusing to give any of these.
  4. At least one should say whether how much matters at a given time is allowed to depend on what happens later or elsewhere, which is what the Aborted Twin and the Cold Archive press on.

  Tag each item [non-negotiable] or [negotiable: a preference of one camp], and cross-tag any item you suspect cannot be jointly satisfied with another, saying in half a sentence what the conflict is.

  Format: exactly five numbered items, each one or two sentences long, with the bracketed tag at the end of the item, and no introduction, no conclusion, no summary table, and no scorecard of the theories against the list. Work from my cases as I have described them rather than from anything you recall about how the literature sets up these problems, and do not cite, quote, or name any author, paper, or book — I need a specification, not a bibliography.
reasoning: |-
  Okay, the user is a third-year undergrad in a metaphysics seminar focusing on the metaphysics of persons, specifically teletransportation and what matters in survival. They need to craft five desiderata for their final paper, moving beyond standard cases like plain destructive-scan. The user provided five harder cases: Relayed Reconstruction, Cold Archive, Aborted Twin, Lossy Scan, and Reluctant Replica. They want these desiderata to be neutral among major theories (e.g., identity, psychological continuity, no further fact), avoiding bias toward any ism.

  First, I need to parse the constraints. The desiderata must be exactly five, each tied to one of their cases. Each should state a demand with the case that motivates it. The user wants to avoid the plain destructive-scan since all theories handle it. Also, there are four specific constraints: one must clarify conceptual boundaries (like separating survival from what matters), one must address degrees (as in Lossy Scan), one must handle temporal or spatial dependencies (from Aborted Twin and Cold Archive), and at least one should be non-negotiable while others negotiable. They also want cross-tagging for potential conflicts.

  Breaking down each case and identifying the core issue:
  - **Relayed Reconstruction**: Gradual cell-by-cell replacement across planets. Raises questions about continuity and whether the distributed existence counts as survival.
  - **Cold Archive**: Scan stored and run centuries after original's death. Challenges whether temporal gaps affect what matters and if the replica is connected to the original.
  - **Aborted Twin**: A second copy is made but destroyed immediately. Tests if the existence of a replica (even if non-functional) impacts what matters for the original.
  - **Lossy Scan**: 99.9% preservation but changes. Addresses whether what matters is scalar and how to handle partial degradation.
  - **Reluctant Replica**: Replica denies prudential concern. Explores the relationship between identity/relation and rational anticipation or fear.

  Now, mapping to constraints:
  - **Constraint 1**: Each desideratum must be acceptable to any major theory. So, demands should be framed generally, e.g., requiring an account to explain why a case poses a challenge without presupposing a specific solution.
  - **Constraint 2 (Conceptual Boundaries)**: Need one item that distinguishes, e.g., survival vs. what matters, or what matters vs. rational concern. Reluctant Replica is perfect here—it questions whether the replica's belief affects prudential concern, separating the relation from the attitude toward it.
  - **Constraint 3 (Degrees)**: Lossy Scan directly introduces gradience. The desideratum must specify what an account must do—e.g., provide a scale, threshold, aggregation, or refuse. Theories might handle this differently (e.g., Parfit's R-relation vs. identity), so neutrality is key.
  - **Constraint 4 (Dependencies)**: Aborted Twin and Cold Archive involve later events. Aborted Twin asks if a destroyed replica changes what matters for the original; Cold Archive asks if a long-delayed activation matters. The desideratum should demand clarity on whether outcomes elsewhere or later affect the relation's value at a time.

  Structuring the five items:
  1. **Temporal Independence (Cold Archive)**: Addresses Constraint 4. Demand: An account must clarify whether the value of what matters at scan-time depends on later instantiation. Non-negotiable as it's a core dependency issue.
  2. **Non-Branching Sensitivity (Aborted Twin)**: Also Constraint 4. Demand: Explain how what matters is affected by the existence (even if destroyed) of other replicas. Negotiable because branching clauses are theory-specific.
  3. **Degrees Specification (Lossy Scan)**: Constraint 3. Demand: Account for gradience by specifying how partial preservation matters (scale, threshold, etc.). Non-negotiable given the case's direct challenge.
  4. **Distributed Continuity (Relayed Reconstruction)**: Tests spatial distribution. Demand: Explain why distributed existence might threaten survival. Negotiable as theories vary on spatial continuity.
  5. **Attitude-Relation Distinction (Reluctant Replica)**: Constraint 2. Demand: Separate the relation from attitudes like anticipation. Non-negotiable for conceptual clarity.

  Tagging:
  - Non-negotiable: Items 1, 3, 5 as they address fundamental dependencies, degrees, and conceptual boundaries.
  - Negotiable: Items 2 and 4, as they relate to branching and spatial continuity, which are theory-dependent.

  Cross-tagging conflicts:
  - Item 1 (temporal independence) and Item 2 (branching sensitivity) conflict because temporal independence might ignore later events, but branching often depends on outcomes (e.g., if replica is destroyed, branching doesn't occur). So, an account can't easily satisfy both if it values outcomes.
  - Item 3 (degrees) and Item 5 (attitude-relation) conflict if degrees affect attitudes (e.g., less preservation might reduce prudential concern), but the demand is to separate them, which might not hold if they're linked.

  Ensuring neutrality: Each demand is phrased as "must explain" or "specify," not prescribing solutions. For example, for Reluctant Replica, the focus is on distinguishing the relation from attitudes, allowing theories to either align or separate them.

  Finally, keeping each item concise—one or two sentences—with the case and tag. No intros or conclusions. The response should be a pure list of five numbered items.
answer: |-
  1. Any account must clarify whether what matters at the time of scanning in the Cold Archive case depends inherently on the future instantiation of the record three centuries later, or obtains independently of that outcome. [non-negotiable]  
  *Conflicts with #2: temporal independence may preclude branching's outcome-sensitivity.*

  2. Any account must explain how what matters for the original (if anything) in the Aborted Twin case is affected by the existence—even ephemerally—of a second replica whose destruction prevents conscious branching. [negotiable: a preference of one camp]  

  3. Any account must specify how it accommodates degrees of what matters, as in the Lossy Scan case, by providing either a cardinal measure, a threshold for sufficiency, an aggregation rule for partial relations, or a justification for denying degrees altogether. [non-negotiable]  
  *Conflicts with #5: scalar approaches may undermine attitude-relation separation.*

  4. Any account must explain why the spatially distributed continuity in the Relayed Reconstruction case—with one brain's structure split across planets—challenges or preserves what matters, without presupposing brute spatial unity. [negotiable: a preference of one camp]  

  5. Any account must distinguish the putative relation that constitutes what matters from the prudential attitudes of the Reluctant Replica, explaining why their sincere rejection of anticipation for their future need not falsify the relation's obtaining. [non-negotiable]
