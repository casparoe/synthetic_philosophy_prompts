  Hmm, the core tension here is between realism and instrumentalism about patterns. The officemate is pushing a hard physicalist line: since the physical stance is complete, other stances are just useful fictions. The user senses this undermines Dennett's whole project but can't articulate why. Their twins are brilliant - Twin A severs predictive success from implementational structure, Twin B severs implementational structure from predictive success. 

