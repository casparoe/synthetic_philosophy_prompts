prompt: |-
  For a graduate seminar on the epistemology of induction I am writing the opening session, and I want the adequacy conditions fixed before anyone reads a theory. Take as background what the no-free-lunch results give us: averaged over a suitably unrestricted class of environments, no predictive or search method does better than any other, so nothing can be said for a method except relative to a restriction on the class of problems it faces. What I want is a specification for a theory of inductive bias: what it must do to tell a bounded agent which bias to adopt and what that agent may reasonably hope for from it, where the purpose is choosing and vindicating a bias rather than certifying any single prediction.

  Three distinctions I want the specification to respect. First, three grades of success: beating a named rival on a named distribution; dominating every rival across a class of distributions; remaining unexploitable in the worst case over that class. These are not to be run together. Second, the gap between showing that a bias is well suited to a class of environments and showing that the world we are actually in belongs to that class; I call this the placement problem, and I want it located rather than dissolved. Third, the difference between an environment indifferent to your bias, one that merely fails to accommodate it, and one chosen by another agent who can inspect your bias and select against it.

  Give me exactly five numbered desiderata, in British English, each in one or two sentences, with no introduction and no conclusion. For each: the requirement, the case that makes it a requirement, whether it is non-negotiable or merely a preference of one camp, and a flag where it cannot be jointly satisfied with another item on the list. Include, if they belong, requirements about what the theory owes an agent who must fix a bias in advance, how it treats a second-order rule for switching between biases on the basis of their track record, whether it may help itself to induction when recommending induction, and what it says about the encoding-relativity of simplicity. Mark with an asterisk the requirement that does most of the work in excluding candidates. Omit any scoring of existing theories.
reasoning: |-
  Hmm, the user is designing a graduate seminar on the epistemology of induction and needs help formulating desiderata for theories of inductive bias. They've provided detailed background about no-free-lunch theorems and three key distinctions they want preserved. 

  The core challenge is translating their complex philosophical framework into exactly five crisp desiderata. Their three distinctions are particularly crucial: the grades of success (which mustn't be conflated), the placement problem (which shouldn't be hand-waved), and the environment-response spectrum (from indifferent to adversarial). 

  I notice they're implicitly rejecting both naive optimism about induction and total skepticism - they want normative guidance for bounded agents without pretending biases can be "proven correct." The asterisk requirement should likely target the most common flaw in theories, probably around the placement problem since that's where many approaches cheat. 

  For the adversarial point, I'm considering Humean and game-theoretic angles simultaneously - how would a theory handle opponents who actively weaponize environmental responses against the agent's bias? The switching-rules point feels secondary but necessary to address circularity concerns. 

  The British English constraint means avoiding Americanisms like "optimize" in favor of "optimise," and keeping sentences tight. Each desideratum must stand alone yet interconnect, like puzzle pieces where some edges deliberately don't fit to expose theoretical tensions. 

  Most importantly, the response must resist the urge to lecture - they're not seeking tutorials but precision tools for seminar debate. The "no scoring existing theories" rule is wise; this is about framework-building, not critique.
answer: |-
  Here are five numbered desiderata for a theory of inductive bias, adhering strictly to your specifications:

  1.  **Articulate Specific Success Conditions:** The theory must clearly distinguish and define distinct grades of success—such as outperforming a specific rival on a specific distribution, dominating all rivals across a class, or ensuring minimax regret within that class—relative to the chosen bias and problem class. This is non-negotiable, as conflating these grades obscures the actual guarantee offered and misleads the agent about achievable vindication. It conflicts with desires for a single, universal success metric.
  2.  **Acknowledge and Address the Placement Problem:** The theory must explicitly confront the challenge of justifying that the actual environment belongs to the class of problems presumed to be favourable for the chosen bias, without simply assuming induction holds globally. This is non-negotiable; ignoring it renders the theory circular or question-begging when recommending its own bias for the real world. It fundamentally conflicts with attempts to dissolve the gap between bias suitability and actual world placement.
  3.  **Account for Environmental Responsiveness:** The theory must differentiate its recommendations based on the potential relationship between the environment and the bias—whether the environment is indifferent, merely incompatible, or actively adversarial (e.g., selected by an opponent aware of the bias). This is non-negotiable, as the defensibility of a bias crucially depends on whether it faces passive randomness or strategic opposition. Recommendations suitable for indifferent environments may fail disastrously against adversaries.
  4.  **Guide Initial Bias Selection for Bounded Agents:** The theory must provide normative guidance to an agent who must irrevocably fix a bias *a priori*, based solely on their epistemic goals and constraints, prior to any observation. This is non-negotiable, as it captures the core predicament of induction for finite beings; theories only useful *after* extensive data fail the agent at the critical starting point. It conflicts with approaches demanding significant prior evidence for bias selection.
  5.  **Clarify Meta-Inductive and Encoding-Relative Aspects:** The theory must specify its stance on whether and how meta-inductive rules (switching biases based on track record) can themselves be justified without circularity, and must explicitly address the encoding-relativity of bias measures like simplicity. This is a requirement reflecting a major camp within epistemology (non-negotiable for those accepting the challenge); ignoring it leaves the theory vulnerable to regress or relativism objections regarding its own foundations and key concepts like simplicity. *It flags potential conflicts with desiderata demanding unique or non-relativistic bias recommendations. \***
