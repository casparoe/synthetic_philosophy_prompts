prompt: |-
  I sit on a small commission on electoral law reform, and I have been asked to write the short normative appendix to our report. Before I commit it to paper I would like my own position audited, because my worry is not that any one of these claims is indefensible but that I have been quietly using different principles in different chapters. I do not want a survey of the literature or a map of the debate, and I do not want to be told that reasonable people disagree; I want the argumentative structure of my own set. Please write in British English.

  Here is where I have landed.

  (1) The boundary of the franchise should be fixed by affected interests rather than by citizenship or by membership in a national community: roughly, anyone whose significant interests are foreseeably and non-trivially affected by a decision is entitled to a say in making it. I have argued against both the coercion test and the national self-determination test as criteria of inclusion.

  (2) Consequently, lawful non-citizen residents should have the vote in national as well as local elections after a short period of residence — residence being only a proxy for affectedness, not a test of belonging — while citizens who have lived abroad for years, pay no tax here and have no intention of returning should lose it.

  (3) The voting age should come down to sixteen, but no further. I oppose proxy votes cast by parents on behalf of younger children, I oppose any competence or civics test as a condition of adult voting, and I would leave eighteen as the age for jury service and for standing for election.

  (4) Voting should be legally compulsory: a duty to attend and return a ballot, with a formal none-of-the-above option and a modest fine for non-attendance. The secret ballot together with that option is, I take it, what answers the objection that compulsion coerces political expression.

  (5) Two grounds for (4). First, that abstention is a collective-action problem — no individual vote makes a difference, but low and socially skewed turnout biases policy against the worse-off — so compulsion is a legal remedy for a coordination failure and improves the representativeness of outcomes. Second, more broadly, that those who live under and benefit from a legal order owe it their participation.

  (6) The franchise is a right that individuals hold against the state, which they are free to exercise or refrain from exercising; that is part of why disenfranchisement — of serving prisoners, for instance — strikes me as a grave wrong.

  What I want from you: which of these genuinely pull against which, ordered by how severe the strain is, and for each tension what would have to give, what the cheapest repair would be, and what that repair would cost me elsewhere in the set. Please also say explicitly which of the apparent tensions dissolve on inspection and why, rather than flagging everything as a problem. If the package survives intact, say so — and then tell me where it is weakest regardless.
reasoning: |-
  Okay, the user is part of a commission on electoral law reform and needs to audit their normative position before finalizing an appendix. They've outlined six key principles and want to know if there are internal contradictions. The user is clearly highly informed and meticulous—this isn't a casual inquiry but a precision request from someone who's deeply considered each point. 

  First impression: This is a beautifully structured philosophical framework, not a patchwork. The "affected interests" foundation (1) cleanly justifies non-citizen voting (2) and explains age limits (3). But I immediately spot where nerves might fray: compulsory voting (4,5) feels like it's arm-wrestling with franchise-as-right (6). The user knows this—they’ve pre-emptively offered the "secret ballot + none-of-the-above" defence against coercion claims. Clever. But is it enough? 

  Drilling into tension points:  
  - **Compulsion vs. Right to Abstain**: The user insists the franchise is a right one may "refrain from exercising" (6), yet (4) fines non-voters. Their "cheapest repair" would be to reframe abstention as exercising the right via NOTA. But that still imposes a duty to physically engage—like forcing someone to enter a polling booth just to submit a blank paper. The cost? Diluting "refrain from exercising" to mean only "not casting a valid vote."  
  - **Prisoner Disenfranchisement**: Principle (1) would grant votes to prisoners (their interests are massively affected by laws!), but (6) only implicitly opposes disenfranchisement. The user hasn’t explicitly extended "affected interests" to prisoners—a vulnerability. If challenged, they’d need to either commit fully (weakening "grave wrong" by making disenfranchisement seem less exceptional) or limit (1) for prisoners, undermining consistency.  

  Minor strains:  
  - **Emigrant Voting**: Removing votes from long-term emigrants (2) relies on "affected interests," but what about diaspora impacted by foreign policy? The user dismisses this via "no tax/no return," but it’s a softer spot.  
  - **Age Thresholds**: Why 16? If "affected interests" applies to under-16s (e.g., education policies), denying them votes while enfranchising non-taxpaying residents seems inconsistent. The user might argue younger teens lack sufficient stake, but that’s a wobble.  

  Biggest relief: **Competence Tests**. They’re coherently rejected—if voting is a right against the state (6), tests would violate that. Compulsion (4) doesn’t conflict because it mandates participation, not expression.  

  Overall integrity? Remarkably solid. But the compulsion/right tension is the keystone. If critics attack anywhere, it’ll be there—not because it’s incoherent, but because it requires swallowing the idea that "duty to participate" overrides "right to abstain." The user’s best armour is emphasising NOTA as a release valve.  

  Final note: The prisoner gap is a silent bomb. Either embrace enfranchisement (bold!) or add a caveat to (1). Left unaddressed, it’s an inconsistency wolves will tear into.
answer: |-
  Here is an audit of your normative framework, analysing tensions between principles, ordered by severity. I assess genuine conflicts (not mere differences in emphasis), identify where apparent tensions dissolve, and evaluate repair costs. The framework is largely coherent but requires refinement at critical stress points.

  ### **Severe Tension: Compulsory Voting (4,5) vs. Franchise as a Right to Refrain (6)**  
  **Conflict**: Principle (6) frames the franchise as a right individuals may *refrain* from exercising. Yet (4) and (5) impose a legal duty to attend and return a ballot, penalising abstention. This strains the core assertion that refraining is part of the right.  
  - **Cheapest Repair**: Recharacterise the duty as *minimal procedural engagement* (attending/returning a ballot) while preserving the substantive freedom to reject all options via NOTA. Argue that the right to refrain *is exercised* by submitting a NOTA vote.  
  - **Cost**: This partially reframes "refrain" from *non-participation* to *symbolic rejection*. Critics will argue NOTA still coerces physical engagement with the system. Principle (6) loses absolute clarity on "refraining" meaning total non-engagement.  
  - **Alternative**: Drop "free to refrain from exercising" from (6). But this severs the link to opposing disenfranchisement, weakening (6)’s moral force.  

  ### **Moderate Tension: Affected Interests (1) vs. Age Threshold (3)**  
  **Conflict**: (1) bases the franchise on "anyone whose significant interests are foreseeably affected". Yet (3) denies under-16s the vote despite clear affectedness (e.g., climate policy, education funding). Residence is sufficient proxy for non-citizens (2), but age is treated as a bright-line competence barrier.  
  - **Cheapest Repair**: Argue that under-16s’ interests are *indirectly represented* via parents/guardians (rejecting proxy votes *by parents* doesn’t preclude this). Alternatively, assert that cognitive maturity for *autonomous political judgment* (not raw competence) is a precondition for wielding a vote *as a right against the state* (linking to 6).  
  - **Cost**: First option risks inconsistency with rejecting parental proxies. Second requires grafting a contested "autonomy" threshold onto (1), diluting pure affectedness.  
  - **Dissolves?** No—unless you explicitly add autonomy as a qualifier to (1).  

  ### **Minor Tension: Affected Interests (1) vs. Emigrant Disenfranchisement (2)**  
  **Conflict**: (2) revokes voting rights for non-returning emigrants based on severed tax/residency ties. Yet (1) focuses on "foreseeably affected interests". Emigrants *are* affected by foreign policy, inheritance law, or citizenship rights.  
  - **Cheapest Repair**: Tighten "significant interests" to require *ongoing, direct subjection* to domestic legal/policy consequences. Emigrants retain citizenship rights but avoid most domestic burdens (tax, laws).  
  - **Cost**: This narrows (1)’s scope. "Ongoing subjection" may inadvertently *include* short-term residents (e.g., tourists) foreseeably affected by laws.  
  - **Dissolves?** Partially. Your "no tax/no return" criteria in (2) operationalise "significant interests" pragmatically. But principled consistency requires explicit linkage in (1).  

  ### **Minor Tension: Compulsion (5) vs. Franchise as Individual Right (6)**  
  **Conflict**: Principle (5) grounds compulsion partly in a *duty* ("owe participation") to the legal order. Principle (6) frames it as an *individual right*. Rights are typically claimable *by* the holder, not duties owed *to* the state.  
  - **Cheapest Repair**: Decouple the two justifications. Emphasise that compulsion is *solely* a remedy for collective-action problems (5’s first ground), not a moral duty. The "owe participation" claim (5’s second ground) is the weaker link—discard it.  
  - **Cost**: Losing the "duty" argument weakens the normative richness of (5) but preserves coherence. The collective-action rationale stands alone.  
  - **Dissolves?** Only if you drop the "owe participation" argument.  

  ### **Apparent Tension That Dissolves: Compulsion (4) vs. Coercion Concerns**  
  **Your Position**: Secret ballot + NOTA option answers objections to compelled expression.  
  **Analysis**: This dissolves. NOTA permits active rejection; secrecy prevents forced *content* of expression. Compulsion is purely behavioural (attendance). No conflict with (6) once NOTA is accepted as a valid exercise of the right.  

  ### **Apparent Tension That Dissolves: Jury Service Age vs. Voting Age (3)**  
  **Conflict**: Why voting at 16 but jury service/candidacy at 18?  
  **Dissolves**: Jury service/candidacy demand higher cognitive/experiential thresholds (evaluating evidence, governing). Voting is a lower-barrier act of preference-signalling. No inconsistency if autonomy develops progressively.  

  ### **Where the Package is Weakest (Even if Coherent)**  
  1. **Operationalising "Affected Interests"**: Your framework rests on this, but "significant/foreseeable/non-trivial" remains subjective. Critics will ask: Who defines this? Why is age/residency a sufficient proxy but (e.g.) shareholding in national companies isn’t?  
  2. **Prisoner Disenfranchisement**: Principle (1) *demands* prisoner voting (their interests are profoundly affected). Yet (6) only implicitly opposes disenfranchisement. To be consistent, you must explicitly apply (1) to prisoners or defend an exception—neither is cost-free.  

  ### **Conclusion**  
  Your framework **survives largely intact** with two critical repairs:  
  1. **Reframe "refraining"** in (6) as exercisable via NOTA to reconcile with compulsion.  
  2. **Drop the "owe participation" duty** in (5) to avoid clashing with (6)’s rights-language.  

  **Minimal collateral cost**: Sacrificing the "duty" argument marginally weakens compulsion’s normative depth but avoids structural conflict. The rest holds under consistent interpretation. **Greatest vulnerability** remains defining "affected interests" with sufficient rigour to resist arbitrariness charges—strengthen this definitional boundary in your appendix.  

  ---  
  **Final Note**: Your position is philosophically disciplined. The tensions are at the margins, not foundational. Prioritise clarifying "affected interests" and the compulsion/refraining interface to preempt critiques.
