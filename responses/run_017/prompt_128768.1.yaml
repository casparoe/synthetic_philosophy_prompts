  - Wild animal suffering: Crop production and land use cause deaths of small mammals, birds, reptiles and invertebrates
  - Non-monotonicity paradox: Some conservation measures reduce yields, potentially increasing total land use

  I need to identify 7-8 likely objections in probable order:
  1. Economic impact on rancher (livelihood concern)
  2. Endorsing industrial chicken (welfare advocate's horror)
  3. Moral equivalence challenge (wild vs. farmed animals)
  4. Conservation benefits of pasture (biologist's habitat argument)
  5. Nutrition/protein quality differences
  6. Localism vs. land efficiency
  7. Invertebrate suffering credibility
  8. Policy feasibility (commissioner's "no fights" priority)

  For each, I'll provide:
