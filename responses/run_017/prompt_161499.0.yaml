answer: |-
  ### Diagnosis

  The persistent disagreement in your group stems from a **substantive normative conflict** about the nature of rationality itself, not merely verbal confusion or variant-specific details. The disposition camp and maximizer camp fundamentally disagree on whether rationality is a **temporally local property** (assessing choices solely at the moment of action) or a **global property** (assessing agents, policies, or plans across time). This conflict is normative because it involves competing visions of what rationality *ought* to be, not empirical or factual errors. 

  Your variants fail to move either camp because they preserve the core normative disagreement. Variant 1 (unobservable payment) tests whether the disposition camp cares about external consequences or internal integrity; they uphold the latter. Variant 2 (face-reading) tests whether the driver’s detection mechanism changes the calculus; it doesn’t, as both camps reinterpret it to fit their views (e.g., dispositionists see "resolve" as intrinsic, maximizers see it as deception). Variant 3 (lockbox) highlights shared ground on precommitment but reverts to the core dispute when precommitment is costly. In all cases, the disagreement persists because the variants don’t challenge the *normative priority* each side assigns to time-sliced versus extended agency.

  The "rational irrationality" tension—where rationality might require cultivating a disposition that later forces you to act against local reasons—is a **real case of self-defeating normativity**. It arises because moment-by-maximization can undermine long-term goals, creating a conflict between local and global norms. This isn’t a paradox or confusion; it reflects a genuine fracture in decision theory.

  Your hypothesis is **partly right**. Prior commitments to formalisms (e.g., causal vs. evidential decision theory) play a role, but they are symptoms of the deeper normative rift. If formalism alone drove the dispute, variants like the lockbox might have shifted positions (e.g., by making causal precommitment salient). Instead, both sides doubled down, indicating a bedrock disagreement about rationality’s scope.

  Progress requires **distinguishing local and global rationality explicitly**, framing them as complementary rather than competing. The camps already tacitly agree that "what to do" and "what to be" are distinct (maximizers endorse disposition-building as advice, not rationality; dispositionists see rationality as encompassing both). Formalizing this split—e.g., "rationality-at-t" vs. "rationality-over-time"—could resolve the stalemate by showing that both sides answer valid but different questions. However, expected progress is **moderate** because normative commitments are entrenched, and the distinction might not fully reconcile why "rationality" feels singular to both camps.

