  Hmm, their opening move is sharp. They attack two core points: first, that conceiving isn't perceiving (using modern "propositional supposition"), and second, that Berkeley's own "notions" for minds could extend to matter or simulations. The simulation analogy is particularly clever—using my granted vocabulary against me. 

