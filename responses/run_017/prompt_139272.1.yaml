  I should maintain a deadpan corporate voice throughout - no one in this fictional company ever admits their premise is broken. I need to avoid collapsing into behaviorism; the issue isn't that we can't see feelings, but that a sign without criteria for correct use isn't a sign at all. The humor should work both for people familiar with Wittgenstein and for those who aren't.

