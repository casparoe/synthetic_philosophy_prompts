prompt: |-
  Hi — I'm a TA for PHIL 2140 (Contemporary Ethics) this term, and its the first time I've written one of the midterm questions myself, so I'm weirdly invested in whether it actually worked. I've got forty-odd of these to get thru by Friday night and I'd really like a second reader on this particular one, because the student writes beautifully and I genuinely can't tell whether I'm giving credit for style or for content. Below is the question as it went out, and then one answer, transcribed more or less verbatim (I fixed the spelling). Would you grade it for me?

  Context you should have: the case is mine, but we went over it in section two weeks ago, and in that section I introduced a distinction I use in my own notes — "valence-switch", where a consideration changes sign, going from being a reason for an action to being a reason against it (or the other way round), and "valence-loss", where a consideration simply stops being a reason at all without becoming a reason on the other side. Those terms aren't in the textbook, they're from my handout, and I told the class that 3 of the 30 points would be for using them correctly. The rest of the marks were meant to split (a) 10, (b) 10, (c) 6, (d) 4.

  THE QUESTION (30 points):

  Miriam is dying. Her friend Sarah promises her that she will burn a bundle of Miriam's letters after the death. Miriam had also, a week earlier, signed a contract for an authorized biography and written to the biographer saying he could see "everything". After Miriam dies the biographer asks Sarah for the letters. They contain nothing scandalous, but they would force him to revise a chapter in a way that plays down Miriam's role in a decision she was proud of; her family, who dislike the biographer and never liked the biography, ask Sarah to refuse. Sarah burns the letters.

  (a) Using this case, explain what the generalist and the particularist would each say about Sarah's reason for acting, and explain the doctrine of the holism of reasons. (10 points)

  (b) Set out the particularist's argument from holism to the conclusion that moral principles cannot explain or guide judgement, including the regress worry that arises for hedged principles ("pro tanto", "ceteris paribus", "unless there is a defeater"). (10 points)

  (c) Is particularism a form of relativism? Does it have the consequence that moral argument has nothing to appeal to when two well-trained judges disagree? Answer both. (6 points)

  (d) Does particularism force us to give up the claim that the moral supervenes on the natural? (4 points)

  THE ANSWER:

  (a) Generalism is the view that moral judgement is a matter of bringing a case under a principle: if a feature makes an action right in one case, it makes any relevantly similar action right, and to judge well is to grasp the right principles and apply them. Particularism — the position associated with Dancy — denies that. On the particularist picture judgement comes first, and principles are at best summaries, reminders, or rules of thumb that can help only someone who already knows how to judge. The argument for this starts from the holism of reasons: what a consideration counts for depends on what else is true in the case, so the same feature can be a reason in one case and no reason in another. In our case, that Sarah promised Miriam is a reason to burn the letters. But if Miriam had asked for the promise in a moment of panic, had forgotten about the biography, and would on reflection have wanted the biographer to have the letters, the promise might not be a reason to burn them at all — that would be a valence-loss. And the fact that burning the letters leaves the biographer with a thinner and less accurate book is normally a reason against burning them; here, though, since what the letters would add is a detail Miriam would have hated seeing in print, that consideration undergoes a valence-switch — it simply stops counting against burning them. A generalist will say that the promise is a pro tanto reason to burn the letters and that Sarah's verdict is what you get by weighing it against the biographer's claim; a particularist will say that the shape of the case as a whole is what makes burning right, and that nothing useful is added by saying that promise-keeping is a reason.

  (b) The particularist argument runs like this: if holism is true, then any principle citing a consideration like promise-keeping will be unreliable, because whether that consideration helps or hurts depends on the rest of the case. The generalist replies with hedged principles — that one has promised is a reason to keep the promise, pro tanto, or unless defeated. The regress worry is that the hedge does no work on its own: to use the principle you have to know whether the defeater is present, and knowing that just is the judgement the principle was supposed to produce. So either you keep adding conditions, which gives you an endless principle no one could hold in mind, or you stop somewhere and let judgement decide when the principle applies — and then the judgement, not the principle, is doing all the explanatory and guiding work.

  (c) Particularism is not relativism if what you mean by relativism is that right and wrong are fixed by what some culture happens to approve of; the particularist thinks there is one correct answer in the letters case, fixed by all the features of the situation. But because the particularist denies that there are moral principles, there is nothing left for moral argument to appeal to. If I think the letters should have been handed over and Sarah thinks they should not, each of us can only consult our own trained judgement, and if we still disagree there is no further fact of the matter about which of us is right. So particularism does turn out to be a kind of relativism in the end, just not the vulgar kind.

  (d) Yes, I think it does force us to give up supervenience. Particularists say that the very same natural feature — being a promise, being a lie — can count in favour of an action in one case and against it in another. But then exactly the same natural facts would be compatible with opposite moral verdicts, and that is precisely what supervenience rules out. So the particularist has to say either that moral properties float loose from the natural ones, or that the difference in verdict is grounded in something non-natural.

  What I need from you: a mark out of 30, and then the margin comments I can paste straight into the PDF — say five or six of them, each attached to a short phrase lifted from the answer, saying whether that bit earns full credit, partial credit, or nothing, and why. Point by point, not an overall verdict; "shows a good grasp of the debate" is useless to me. Where something is wrong, I need to know whether it's a local slip a careful student could fix in a sentence or whether it's a confusion that infects the rest of the answer, and if a claim is really just contestable in the literature rather than plainly false, tell me that and don't dock points for it. Don't pull your punches, but don't invent errors either — if a paragraph is basically right, say it's basically right. Please write the comments in American English, our department style sheet is oddly strict about it. And I'm deliberately not telling you what I thought of the answer, because I'd rather you didn't just ratify me.
