prompt: |-
  I direct the evaluation and contracting team at a state workforce agency that purchases employment and reentry services from roughly forty nonprofit providers. Over the next two years we are moving from paying for services delivered to paying for measured results: an increasing share of each provider's funding will be tied to a small set of reported numbers. My constraints are these. I have three analysts and no in-house econometrician. Our legal and procurement office requires every payment rule to be written into the contract in language a provider can read and a judge could enforce. Contracts run three years. The providers are sophisticated repeat players who will reallocate staff, change intake practice, and revise how they record dates within a quarter of a rule taking effect. I can fund an in-depth audit of each provider about once a year and no more often. Each candidate indicator has to survive review by our deputy director in about a day of analyst time, and whatever I adopt must also be reported upward to a legislature that has already been told to expect certain numbers.

  I know the folk version of Goodhart's law — that a measure tends to stop tracking what it was meant to track once people are rewarded for it — and I will not be helped by being told to use a dashboard of several indicators, to add random audits, or to be careful. What I need is a decision procedure my team can actually run on a candidate indicator before it goes into a contract, ending in one of four verdicts: pay on it as written; pay on it only with the following guardrails; monitor it but attach no money; or drop it. The procedure should be about a dozen ordered steps, and each step should say what kind of evidence counts as a pass, what counts as a fail, and where a fail sends you.

  Specifically, please include:

  A first step that forces the goal to be written separately from the measure, and that produces an explicit written statement of the part of the goal the measure structurally cannot see — not a caveat, a named artifact my analysts can draft in an afternoon from files we already hold.

  A short sequence of named stress tests, in the order I should run them, each with a specified failure action. The four I have in mind are: a no-real-improvement test, which asks for the cheapest route by which a provider could hit the target while the participant is no better off, and estimates that route's cost to them against the payment; a who-goes-missing test, which asks which participants a provider would prefer never to enroll, and whether our data could detect their absence; a moving-the-line test, which asks where in the causal chain a provider can reset a clock, redefine a denominator, or reclassify an exit; and a what-gets-sacrificed test, which asks which unmeasured goods a provider would have to trade away in order to move the number, and what signal would tell me that trade had happened.

  The points where the procedure stops with a no, and what a no means operationally — how a dropped indicator becomes a monitored-only line item, and how a capped weight is expressed in contract language.

  The points where the procedure hands the decision to a person because the question is about values rather than facts, along with a one-page format for that sign-off, since I have to defend these calls after the fact.

  The guardrails that can survive being written into a contract: smoothing payment so that marginal effort yields marginal money rather than a cliff; holding back at least one measure that is collected but never paid on; and a way of stating a target before the baseline year has closed. Tell me which of these procurement or legal is likely to strike down, and what to substitute.

  A note on which parts of the procedure must stay out of the contract. If a step in my own anti-gaming machinery is one a provider could read and plan around, I need it flagged as such, and I need to know what I lose by keeping it secret.

  A re-review trigger: what pattern in year-one data forces us to reopen an indicator, and how we tell a genuine improvement from adaptation once money is attached, given how rarely we can audit.

  Then run the full procedure on three candidates, in order, showing where each one stops: the share of participants employed at ninety days after exit; median days from referral to first paycheck; and a documented completion of our soft-skills workshop. The first is the number the legislature already expects, and I suspect it is our most gameable measure — I want that case worked through to the answer I will not like, including what I should do instead of paying on it and what I say to the legislature when I do it.

  Close with an honest section on what the procedure cannot do: the residual risk it leaves on the table, the kind of provider adaptation it will never catch, and the point at which I should stop trusting indicators at all and fall back on the judgment of the staff who visit these programs. Do not cite literature or recommend reading; I want the procedure and its applications, not sources.
reasoning: |-
  We are designing a decision procedure for evaluating candidate performance indicators for performance-based contracts. The procedure has four possible verdicts:
  1. Pay on it as written.
  2. Pay on it only with the following guardrails.
  3. Monitor it but attach no money.
  4. Drop it.

  The procedure must be about a dozen ordered steps. We will include specific elements as requested.

  ### Step-by-Step Decision Procedure

  **Step 1: Separate Goal from Measure**
  - **Action**: Require a written statement of the goal (e.g., "increase stable employment") and a separate written statement of the candidate measure (e.g., "share of participants employed at 90 days after exit"). Then, draft a "Blind Spot Statement" that explicitly lists aspects of the goal that the measure cannot capture.
  - **Pass**: The goal and measure are clearly distinct, and the Blind Spot Statement is complete (e.g., "The measure does not capture underemployment, job quality, or employment stability beyond 90 days").
  - **Fail**: The goal and measure are conflated, or the Blind Spot Statement cannot be drafted (e.g., the measure is the goal). 
  - **Fail Action**: Return to the drafting team until a clear separation is achieved. Do not proceed until passed.

  **Step 2: No-Real-Improvement Test**
  - **Action**: Identify the cheapest way a provider could hit the target without improving participant outcomes. Estimate the cost of that route and compare it to the payment.
  - **Pass**: The cost of gaming is high relative to the payment (e.g., gaming cost is at least 2x the payment) AND the gaming route would require fraudulent reporting that would be caught by audit.
  - **Fail**: Gaming is cheap (cost less than 1.5x payment) OR the gaming would not be caught by audit.
  - **Fail Action**: Proceed to Step 3 but note for guardrails or potential drop.

  **Step 3: Who-Goes-Missing Test**
  - **Action**: Determine which participant groups a provider would avoid to improve the measure (e.g., those with barriers to employment). Check if existing data can detect such avoidance (e.g., via demographic data or risk scores).
  - **Pass**: The provider has no strong incentive to avoid any group, OR the data can detect avoidance (e.g., via comparison to expected enrollment based on historical or regional data).
  - **Fail**: Incentive to avoid a group exists and data cannot detect it (e.g., no tracking of participant characteristics that correlate with difficulty).
  - **Fail Action**: Proceed to Step 4 but note for guardrails or monitoring without pay.

  **Step 4: Moving-the-Line Test**
  - **Action**: Identify points in the causal chain where a provider can manipulate the measure by redefining terms, resetting clocks, or reclassifying outcomes (e.g., changing the definition of "employed" or "exit date").
  - **Pass**: No significant manipulation points exist OR they can be controlled by clear definitions in the contract and verified with available data.
  - **Fail**: Manipulation is easy and cannot be controlled by contract language or verified.
  - **Fail Action**: Proceed to Step 5 but likely require guardrails or drop.

  **Step 5: What-Gets-Sacrificed Test**
  - **Action**: Identify unmeasured goods (e.g., job quality, participant satisfaction) that might be traded off to improve the measure. Determine a signal that would indicate such a trade-off (e.g., drop in participant satisfaction scores, increase in complaints).
  - **Pass**: No significant trade-offs exist OR a monitoring signal is available and can be tracked.
  - **Fail**: Significant trade-offs exist and no signal is available.
  - **Fail Action**: Proceed to Step 6 but note for guardrails or monitoring without pay.

  **Step 6: Compile Results and Initial Verdict**
  - **Action**: Summarize the test results. Assign an initial verdict based on:
    - If any test failed: consider guardrails or no pay.
    - If two or more tests failed: likely drop or monitor without pay.
    - If all passed: pay as written.
  - **Pass**: All tests passed -> "Pay as written".
  - **Fail (one or more)**: Proceed to Step 7 for guardrail design.

  **Step 7: Guardrail Design**
  - **Action**: For each failure in Steps 2-5, design guardrails. Consider:
    - **Smoothing payment**: Avoid cliffs by making payment proportional to performance (e.g., linear payment for each percentage point above a threshold).
    - **Holdback measure**: Identify a measure that will be collected but not paid on, to detect gaming (e.g., participant satisfaction).
    - **Baseline target setting**: Set targets based on historical data with a clear formula (e.g., prior year's performance plus 5%).
  - **Pass**: Guardrails can be written into contract and address the failures.
  - **Fail**: Guardrails are not feasible (e.g., legal rejects them) or do not address the failure.
  - **Fail Action**: If guardrails are not feasible, move to "Monitor but attach no money" or "Drop".

  **Step 8: Legal and Procurement Review of Guardrails**
  - **Action**: Submit the proposed guardrails to legal/procurement for review.
  - **Pass**: They approve.
  - **Fail**: They reject one or more guardrails.
  - **Fail Action**: Substitute rejected guardrails with alternatives (e.g., if smoothing is rejected, use tiered payments with small increments). If no substitute, move to "Monitor but attach no money".

  **Step 9: Values Checkpoint**
  - **Action**: For issues that involve trade-offs between equity, efficiency, or other values, create a one-page sign-off sheet for the deputy director. The sheet must state:
    - The value trade-off (e.g., "We accept a risk of reduced service to hard-to-serve groups because we prioritize overall employment rates").
    - The rationale and any mitigating factors.
  - **Pass**: Deputy director signs off.
  - **Fail**: Deputy director does not sign off.
  - **Fail Action**: Adjust the measure or guardrails to address the value concern and resubmit, or drop the measure.

  **Step 10: Final Verdict Assignment**
  - **Action**: Assign one of the four verdicts based on the above.
    - All tests passed and no guardrails needed: "Pay as written".
    - Tests failed but guardrails approved: "Pay only with guardrails".
    - Tests failed and guardrails not feasible, but the measure is still informative: "Monitor but attach no money".
    - Tests failed and measure is too flawed: "Drop".
  - Document the verdict and reasons.

  **Step 11: Re-Review Trigger Definition**
  - **Action**: Define the trigger for re-review (e.g., if the measure improves by more than 20% in the first year, or if the holdback measure shows a significant negative trend). Also, specify how to distinguish genuine improvement from gaming:
    - Use the annual audit.
    - Compare with other providers' holdback measures.
    - Look for anomalies in participant enrollment or outcomes.
  - Include this trigger in the contract as a condition for renegotiation.

  **Step 12: Contract Drafting and Confidentiality Marking**
  - **Action**: Draft the contract language for the measure and any guardrails. Mark any internal anti-gaming steps (e.g., the specific algorithm for detecting avoidance in Step 3) as confidential and not included in the contract. Note that keeping them secret may reduce deterrence but prevents providers from planning around them.

  ### Guardrails and Their Feasibility
  - **Smoothing payment**: Likely acceptable if structured as a formula (e.g., $X per unit above threshold). Legal may reject if too complex.
  - **Holdback measure**: Acceptable, as it doesn't affect payment. Legal may require defining how it's used.
  - **Baseline target setting**: Acceptable if based on objective data. Legal may reject if baseline is disputed; substitute with a fixed target based on pre-agreed historical data.

  ### Confidentiality Note
  - Steps that involve internal detection methods (e.g., the specific data analysis for the who-goes-missing test) must be kept confidential. The trade-off: providers cannot game these specific tests, but they also cannot be deterred by knowing them. Use annual audits to enforce.

  ### Re-Review Trigger
  - **Trigger Pattern**: A year-over-year improvement exceeding 1.5 standard deviations from historical trends, OR a significant drop in the holdback measure, OR audit findings of gaming.
  - **Distinguishing Improvement vs. Adaptation**: Use the annual audit. If audit is clean and the holdback measure is stable, it's likely genuine. Otherwise, investigate.

  ### Residual Risks and Limitations
  - **Residual Risks**: 
    - Providers may find new gaming methods not anticipated by the tests.
    - Unmeasured trade-offs may still occur.
    - Rare but catastrophic gaming (e.g., fraud) may not be caught by the audit.
  - **Uncatchable Adaptations**: 
    - Subtle changes in participant engagement that don't show in data.
    - Shifting resources in ways that harm unmeasured outcomes without a signal.
  - **When to Fall Back**: 
    - If multiple indicators show volatility without explanation, or if audits consistently find gaming despite guardrails, shift weight to staff judgment and qualitative reviews.

  ---

  ### Application to Candidate Indicators

  #### Candidate 1: Share of participants employed at ninety days after exit
  - **Step 1**: 
    - Goal: Stable employment after program completion.
    - Measure: % employed at 90 days post-exit.
    - Blind Spot: Does not capture job quality, underemployment, stability beyond 90 days, or whether employment was sustained.
  - **Step 2 (No-Real-Improvement)**: 
    - Cheapest route: Providers can temporarily place participants in short-term jobs that end just after 90 days, or encourage participants to take any job (even unsuitable) and hold it for 90 days. Cost is low (minimal extra effort). Payment might exceed cost.
    - Fail: Gaming is cheap and hard to detect without detailed job quality data.
  - **Step 3 (Who-Goes-Missing)**: 
    - Providers would avoid participants with high risk of unemployment (e.g., those with criminal records, low skills). Existing data (e.g., demographic data) might show a drop in enrollment of high-risk groups.
    - Pass? Only if we track risk factors. If we do, we can monitor; if not, fail.
    - Assume we have some risk data: Conditional pass (but requires monitoring).
  - **Step 4 (Moving-the-Line)**:
    - Providers can redefine "employed" (e.g., one hour/week counts) or manipulate exit dates to avoid counting those likely to fail. Contract can define terms, but verification requires audits.
    - Fail: Without frequent audits, manipulation is easy.
  - **Step 5 (What-Gets-Sacrificed)**:
    - Trade-offs: Job quality, participant well-being (e.g., pushing into unsuitable jobs). Signal: Drop in job quality metrics (if collected) or increase in early job separations after 90 days.
    - Fail: We don't collect job quality data, so no signal.
  - **Step 6**: Multiple fails -> initial verdict: likely not for pay.
  - **Step 7**: Guardrails: 
    - Smoothing: Pay per percentage point above 50%.
    - Holdback: Track job retention at 180 days (monitor only).
    - Baseline: Set based on prior year.
    - But gaming risks remain high.
  - **Step 8**: Legal may reject holdback if not previously collected. Substitute: Use participant surveys if available.
  - **Step 9**: Values: Deputy director must sign off on potentially harming hard-to-serve groups and job quality.
  - **Verdict**: Due to high risk, "Monitor but attach no money". 
  - **To Legislature**: Explain that paying on this measure alone could lead to lower-quality outcomes and that we are tracking it as part of a broader set of indicators. Propose alternative: composite measure including job quality and retention.

  #### Candidate 2: Median days from referral to first paycheck
  - **Step 1**:
    - Goal: Reduce time to employment.
    - Measure: Median days from referral to first paycheck.
    - Blind Spot: Does not capture whether the job is suitable, full-time, or sustainable. Also, doesn't account for time spent in training.
  - **Step 2**:
    - Cheapest route: Providers focus on quick placements (e.g., temporary jobs) and neglect job matching. Cost is low (prioritize speed over fit).
    - Fail: Gaming is cheap and may not improve participant outcomes.
  - **Step 3**:
    - Providers avoid participants who need training or have complex barriers (slower to place). Data on participant barriers might detect avoidance.
    - Pass: If barrier data exists, we can monitor.
  - **Step 4**:
    - Manipulation: Providers can reset the clock by re-referring participants or redefine "referral" and "first paycheck". Contract must define terms strictly.
    - Pass: With clear definitions and audit checks.
  - **Step 5**:
    - Trade-offs: Job suitability and participant satisfaction. Signal: Increase in job turnover or drop in satisfaction scores.
    - Fail: If no satisfaction data, no signal.
  - **Step 6**: Mixed results -> guardrails needed.
  - **Step 7**:
    - Smoothing: Pay based on reduction in median days (e.g., $X per day below threshold).
    - Holdback: Track job retention at 90 days.
    - Baseline: Use historical median.
  - **Step 8**: Legal may accept if definitions are clear.
  - **Step 9**: Values: Sign off on trading speed for fit.
  - **Verdict**: Pay with guardrails (smoothing and holdback).

  #### Candidate 3: Documented completion of our soft-skills workshop
  - **Step 1**:
    - Goal: Improve participants' soft skills for employment.
    - Measure: % completing workshop.
    - Blind Spot: Does not measure skill acquisition or application. Also, attendance doesn't equal learning.
  - **Step 2**:
    - Cheapest route: Lower standards for completion (e.g., sign-in sheets without participation). Cost very low.
    - Fail.
  - **Step 3**:
    - Providers might avoid participants unlikely to complete (e.g., those with transportation issues). Data on attendance barriers can help.
    - Pass: If we track barriers.
  - **Step 4**:
    - Manipulation: Redefine "completion" (e.g., attending 50% of sessions). Contract must specify minimum requirements.
    - Pass: With clear rules and random audits.
  - **Step 5**:
    - Trade-offs: Depth of training. Signal: Drop in post-workshop assessment scores (if collected).
    - Fail: Without assessments, no signal.
  - **Step 6**: Fails in Steps 2 and 5 -> not for pay.
  - **Verdict**: Monitor but attach no money. Use as an input for program management.

  ---

  ### Honest Limitations
  - **Residual Risk**: Providers may innovate new gaming methods. The procedure cannot anticipate all.
  - **Uncatchable Adaptation**: Slow erosion of unmeasured outcomes (e.g., trust, long-term impact) without a clear signal.
  - **When to Fall Back**: If audits reveal gaming in multiple providers or if indicators become volatile without explanation, shift to staff judgment and qualitative assessments. Use indicators as one input among many.

  This procedure balances rigor with practicality, focusing on detectable risks and explicit trade-offs.
answer: |-
  Below is a decision procedure for evaluating candidate performance indicators, structured as 12 ordered steps. Each step specifies pass/fail criteria, failure actions, and operational outcomes. The procedure is designed to be executed by your team within resource constraints, producing one of four verdicts: **Pay as written**, **Pay with guardrails**, **Monitor only**, or **Drop**. I'll then apply it to your three candidate indicators.

  ---

  ### **Performance Indicator Decision Procedure**
  **Objective**: Evaluate a candidate indicator for inclusion in contracts.  
  **Input**: Proposed indicator, payment structure, and goal statement.  
  **Output**: One of four verdicts, with documented rationale.

  #### **Step 1: Separate Goal from Measure**  
  - **Action**: Draft two artifacts:  
    - **Goal Statement**: A concise description of the desired outcome (e.g., "Increase stable employment").  
    - **Blind Spot Statement**: Explicitly lists what the goal includes that the measure *cannot* capture (e.g., "The goal includes job quality and retention beyond 90 days, but the measure only captures employment status at a single point").  
  - **Pass**: Both statements are clear, specific, and derived from existing program files (e.g., past contracts, legislative mandates). Blind Spot Statement must name at least one material gap.  
  - **Fail**: Statements are conflated, vague, or lack specificity.  
  - **Fail Action**: Return to analysts to redraft. Do not proceed until pass.  
  - **Artifact Source**: Use program mission documents, legislative text, or prior audit findings. Drafting time: ≤4 hours.

  #### **Step 2: No-Real-Improvement Test**  
  - **Action**: Identify the cheapest/most feasible way a provider could hit the target *without* improving participant outcomes (e.g., placing participants in short-term jobs that end immediately after day 90). Estimate the cost to the provider (e.g., staff time, resources) and compare it to the payment amount.  
  - **Pass**: Gaming cost ≥ 2x payment OR gaming requires fraud detectable in annual audit.  
  - **Fail**: Gaming cost < 2x payment AND/OR undetectable in audit.  
  - **Fail Action**: Proceed to Step 3 but flag for guardrails or monitoring.  
  - **Evidence**: Analyst estimates using provider cost data, past fraud cases, or expert consultation.

  #### **Step 3: Who-Goes-Missing Test**  
  - **Action**: Identify participant groups providers would avoid to improve the measure (e.g., high-barrier individuals). Determine if your data (e.g., intake demographics, risk assessments) can detect avoidance.  
  - **Pass**: Data can detect avoidance (e.g., via disparities in enrollment vs. regional demographics) OR no groups are strongly incentivized for exclusion.  
  - **Fail**: Incentivized exclusion exists AND data cannot detect it (e.g., no tracking of key barriers like criminal records).  
  - **Fail Action**: Proceed to Step 4 but flag for monitoring or reduced weight.  
  - **Evidence**: Historical enrollment data, disparity reports, or correlation analyses.

  #### **Step 4: Moving-the-Line Test**  
  - **Action**: Map the causal chain from program entry to measure outcome. Identify where providers could manipulate the measure by redefining terms (e.g., "exit date"), resetting clocks, or reclassifying outcomes (e.g., labeling dropouts as "completed").  
  - **Pass**: No manipulation points exist OR contract language can control them (e.g., fixed definitions with verification).  
  - **Fail**: Manipulation is feasible AND cannot be fully controlled by contract language.  
  - **Fail Action**: Proceed to Step 5 but flag for guardrails or drop.  
  - **Evidence**: Process flowcharts, provider interviews, or past audit findings.

  #### **Step 5: What-Gets-Sacrificed Test**  
  - **Action**: Identify unmeasured goods traded off to improve the measure (e.g., job quality, participant well-being). Define a low-cost signal to monitor trade-offs (e.g., participant survey scores, job retention at 180 days).  
  - **Pass**: No material trade-offs exist OR a signal is available and feasible to collect.  
  - **Fail**: Material trade-offs exist AND no signal is feasible.  
  - **Fail Action**: Proceed to Step 6 but flag for monitoring-only or drop.  
  - **Evidence**: Provider feedback, participant testimonials, or pilot data.

  #### **Step 6: Compile Test Results**  
  - **Action**: Summarize pass/fail outcomes from Steps 2–5.  
  - **Pass**: All tests passed.  
  - **Fail**: ≥1 test failed.  
  - **Fail Action**:  
    - 1 failure: Proceed to Step 7 for guardrail design.  
    - ≥2 failures: Skip to Step 8 for verdict assignment (likely "Monitor only" or "Drop").  

  #### **Step 7: Guardrail Design**  
  - **Action**: Design guardrails for failed tests:  
    - **Smoothing payment**: Replace cliffs with marginal incentives (e.g., "$X per unit improvement over baseline").  
    - **Holdback measure**: Identify an unpaid indicator to detect gaming (e.g., job retention at 180 days).  
    - **Baseline target**: Set using pre-agreed historical data (e.g., "Target = prior year's performance + 5%").  
  - **Pass**: Guardrails address failures and are legally viable.  
  - **Fail**: Guardrails are ineffective or legally untenable.  
  - **Fail Action**: Proceed to Step 8 for verdict.  
  - **Legal Feasibility**:  
    - Smoothing: Likely acceptable (uses formulas).  
    - Holdback measure: Likely acceptable (no payment tied).  
    - Baseline targets: **Struck down if baseline data is unreliable**; substitute with fixed targets (e.g., "60% employment at 90 days").  

  #### **Step 8: Verdict Assignment**  
  - **Action**: Assign verdict based on test results:  
    - All tests passed → **Pay as written**.  
    - 1–2 failures + guardrails feasible → **Pay with guardrails**.  
    - ≥2 failures + guardrails infeasible → **Monitor only** (add to contract as a non-paid metric).  
    - Critical failure (e.g., undetectable gaming) → **Drop** (exclude from contract).  
  - **Operationalize**:  
    - **Monitor only**: Add to contract as: "Provider shall report [indicator]; no payment is attached."  
    - **Capped weight**: For "Pay with guardrails," limit weight (e.g., "This metric shall not exceed 30% of total payment").  

  #### **Step 9: Values Checkpoint**  
  - **Action**: Escalate value-based trade-offs (e.g., equity vs. efficiency) to the deputy director using a **Sign-off Sheet** (format below).  
  - **When Used**: After Step 6 if tests reveal value conflicts (e.g., excluding vulnerable groups).  
  - **Pass**: Deputy director signs.  
  - **Fail**: Deputy director rejects; return to Step 1 or drop.  
  - **Sign-off Sheet Format** (1 page):  
    - **Trade-off**: [e.g., "Prioritizing speed may reduce service to high-barrier participants"]  
    - **Blind Spot Impact**: [From Step 1]  
    - **Mitigation**: [e.g., "Holdback measure tracks excluded groups"]  
    - **Decision**: ☑ Accept ☑ Reject  
    - **Rationale**: [Deputy director fills]  
    - **Date/Signature**:  

  #### **Step 10: Contract Drafting & Confidentiality**  
  - **Action**: Finalize contract language for the indicator and guardrails.  
  - **Confidential**: Flag internal anti-gaming steps (e.g., specific audit triggers, data algorithms) that **must not appear in the contract** (providers could game them).  
  - **Trade-off**: Secrecy reduces deterrence but prevents adaptation. Mitigate via unannounced audits.  
  - **Include in Contract**: Definitions, payment formula, holdback measures.  

  #### **Step 11: Re-Review Trigger**  
  - **Action**: Define a data-driven trigger to reopen evaluation (e.g., "If year-over-year change exceeds ±15%, audit immediately").  
  - **Detect Adaptation vs. Improvement**:  
    - **Genuine improvement**: Correlated gains in holdback measures or audit findings.  
    - **Adaptation**: Holdback measures decline, data anomalies (e.g., spike in exits at day 89), or audit flags.  
  - **Enforcement**: Use annual audit; if triggered, revisit Steps 2–5.  

  #### **Step 12: Documentation & Handoff**  
  - **Action**: Archive all artifacts (tests, sign-offs) and update provider contracts.  
  - **Output**: Verdict report with rationale for audits/legislature.  

  ---

  ### **Application to Candidate Indicators**
  #### **Candidate 1: Share of participants employed at ninety days after exit**  
  - **Step 1 (Goal/Metric Separation)**:  
    - Goal: "Sustainable employment."  
    - Blind Spot: "Measure ignores job quality, underemployment, retention beyond 90 days, and whether employment is related to training." → **Pass**.  
  - **Step 2 (No-Real-Improvement)**:  
    - Cheapest route: Place participants in 90-day temp jobs (cost: 10% of payment). → **Fail** (cost < 2x payment).  
  - **Step 3 (Who-Goes-Missing)**:  
    - Avoid: High-barrier participants (e.g., no transportation). Data cannot detect (no barrier tracking). → **Fail**.  
  - **Step 4 (Moving-the-Line)**:  
    - Manipulation: Redefine "employed" (e.g., 1 hour/week) or "exit" (e.g., dropouts labeled as exits). → **Fail**.  
  - **Step 5 (What-Gets-Sacrificed)**:  
    - Sacrificed: Job quality/suitability. Signal: None (no job quality data). → **Fail**.  
  - **Step 6**: ≥2 failures → Skip to Step 8.  
  - **Step 8 (Verdict)**: **Monitor only** (too gameable for payment).  
  - **Operationalize**:  
    - Report to legislature: "We track 90-day employment to meet reporting needs, but payment is deferred until we add job quality and retention metrics to prevent rewarding low-wage/temp jobs."  
    - Alternative: Pay on **retention at 180 days + wage threshold** (applies procedure separately).  

  #### **Candidate 2: Median days from referral to first paycheck**  
  - **Step 1**:  
    - Goal: "Rapid job placement."  
    - Blind Spot: "Ignores job-person match quality, sustainability, and barriers faced." → **Pass**.  
  - **Step 2**:  
    - Cheapest route: Push participants into quick, unsuitable jobs (cost: 15% of payment). → **Fail**.  
  - **Step 3**:  
    - Avoid: Participants needing upskilling. Data can detect via training logs. → **Pass**.  
  - **Step 4**:  
    - Manipulation: Reset "referral" date by re-enrolling participants. Contract can fix referral definition. → **Pass**.  
  - **Step 5**:  
    - Sacrificed: Job match quality. Signal: 90-day retention rate (monitored). → **Pass**.  
  - **Step 6**: 1 failure → Proceed to Step 7.  
  - **Step 7 (Guardrails)**:  
    - Smoothing: Pay per day below baseline (e.g., $100/day under 30 days).  
    - Holdback: 90-day retention rate.  
    - Baseline: Historical median (e.g., 45 days).  
  - **Step 8 (Verdict)**: **Pay with guardrails** (weight capped at 25%).  
  - **Contract Language**: "Payment = [$100 × (45 days - actual days)], max $1,500. 90-day retention reported but not paid."  

  #### **Candidate 3: Documented completion of soft-skills workshop**  
  - **Step 1**:  
    - Goal: "Improve employability via soft skills."  
    - Blind Spot: "Measure ignores skill application, behavior change, and job impact." → **Pass**.  
  - **Step 2**:  
    - Cheapest route: Lower standards (e.g., attendance = completion). Cost: 5% of payment. → **Fail**.  
  - **Step 3**:  
    - Avoid: Participants unlikely to complete (e.g., low literacy). Data can detect via attendance disparities. → **Pass**.  
  - **Step 4**:  
    - Manipulation: Backdate attendance. Controlled via sign-in sheets + random audits. → **Pass**.  
  - **Step 5**:  
    - Sacrificed: Skill depth. Signal: Post-workshop assessment (not collected). → **Fail**.  
  - **Step 6**: 2 failures → Step 8.  
  - **Step 8 (Verdict)**: **Monitor only** (no signal for trade-offs).  

  ---

  ### **Honest Limitations: What the Procedure Cannot Do**  
  - **Residual Risk**:  
    - Providers may exploit unanticipated loopholes (e.g., new gaming methods).  
    - Rare, high-impact fraud (e.g., data fabrication) may evade annual audits.  
  - **Uncatchable Adaptation**:  
    - Gradual erosion of unmeasured outcomes (e.g., trust, participant morale).  
    - "Effort shifting" (e.g., staff reallocated from uncounted services) without data signals.  
  - **When to Abandon Indicators**:  
    - If audits show consistent gaming across providers.  
    - If holdback measures trend negatively without explanation.  
    - If multiple indicators fail simultaneously—**fall back to staff judgment**. Use site visits, participant stories, and qualitative feedback as primary inputs.  
  - **Final Note**: No indicator is foolproof. Use this procedure to minimize risk, but assume 10–20% of payments will reward gaming. Mitigate by rotating indicators every contract cycle.
