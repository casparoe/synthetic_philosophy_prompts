  Example case: Agnes Bell works well - shows compliance with unreceived demand. Her "predictor-consistent disposition" is certified posthumously, highlighting the timeless aspect. 

  Voice check: maintaining civil service professionalism throughout. No irony, just crisp explanations of absurdities. The phrase "predictive alignment" might bridge technical and administrative. 

  Final structure: Ministry of Predictive Affairs sounds plausibly bureaucratic. Five FAQ entries covering key cases, one boxed example, performance sidebar. Keeping all references internal to the fiction. 

  Word count tight at ~850. Most importantly, no winks to camera - let the horror build in the reader's mind as they realize this makes perfect sense on its own terms.
