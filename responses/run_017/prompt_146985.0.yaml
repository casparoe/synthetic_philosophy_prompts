  ## So You Have Been Contacted (Or Not): A Citizen's Guide to Non-Causal Demands
  **Issued by the Bureau of Predictive Alignment (BPA), Directorate of Strategic Assurance, Ministry of Public Continuity**

  **Preamble:**
  Pursuant to the Consolidated Findings on Predictive Interdependence (Public Continuity Act, Schedule Gamma) and subsequent Ministerial Directives (MPC/12/Δ, MPC/15/Ζ), it is established that the security and prosperity of the Realm, and the safety of its citizens, are materially influenced by the alignment of individual decision-making dispositions with patterns detectable across potential scenarios, irrespective of direct causal linkage or temporal sequence. The Bureau of Predictive Alignment (BPA) operates under mandate to administer these findings, safeguarding Realm interests and citizen welfare by identifying, assessing, and mitigating exposures arising from predictive misalignment. This leaflet provides essential guidance on recognizing and managing Non-Causal Demands (NCDs).

  **Frequently Asked Questions:**

  1.  **What constitutes a Non-Causal Demand (NCD)?**
      An NCD is a conditional proposition received by a citizen, or potentially applicable to a citizen (see FAQ 3), indicating that a benefit will be withheld or a detriment imposed based *not* on the citizen’s subsequent actions, but on the inherent predictability of their decision-making disposition regarding that specific proposition. The origin, timing, or causal connection of the NCD to the citizen is irrelevant to its potential binding force. (Ref: *BPA Regulation 7-Δ; Form NCD-1: Initial Notification & Assessment*).

  2.  **How do I know if I should comply with an NCD?**
      Compliance is not determined by the *content* of the demand, the identity of the sender (if any), or the perceived fairness, but solely by the *predictive relationship* between your stable decision-making disposition and the entity capable of influencing your outcome based on that predictability. The Bureau assesses this relationship through a *Predictor Correlation Assessment (PCA)*. A positive PCA certification (Form NCD-2a) generally indicates that alignment with the demand disposition minimizes exposure; a negative PCA (Form NCD-2b) indicates that such alignment would constitute unnecessary exposure. **Do not attempt to verify the threat or promise; the PCA assesses the dispositional alignment, not the veracity of the claim.** (Ref: *BPA Regulation 12-Λ; Forms NCD-2a/b: PCA Certification*).

  3.  **What if I never received a demand, but am told one might apply to me?**
      Certain NCDs, termed **Implicit Predictive Bindings (IPBs)**, apply to citizens whose decision disposition inherently matches a pattern targeted by a predictive influencer, regardless of any explicit communication. Discovery of an applicable IPB typically occurs during routine BPA disposition screening or upon filing Form NCD-7: *Request for IPB Status Verification*. Note: Filing Form NCD-7 may itself be indicative of a disposition susceptible to specific IPBs. Certification is via Form NCD-8 (IPB Status Confirmation). Posthumous certification is possible and legally binding on the estate. (Ref: *BPA Regulation 22-Σ; Forms NCD-7, NCD-8*).

  4.  **Can I change my disposition to avoid an NCD?**
      Yes. The Bureau offers **Predictive Disposition Adjustment (PDA)** services. This involves establishing a *binding precommitment* or *surety arrangement* (e.g., via Form NCD-5: *Irrevocable Disposition Covenant*, filed with a licensed Predictive Assurance Trustee). **Critical Note:** The purpose of a PDA is *not* to alter your response *after* receiving a specific NCD. Its purpose is to alter your *inherent, predictable disposition profile* pre-emptively, thereby potentially changing your PCA outcome for future or existing implicit assessments. Adjustment post-NCD receipt is generally ineffective for mitigating exposure related to that specific NCD. (Ref: *BPA Regulation 30-Π; Form NCD-5*).

  5.  **What if the demand seems like extortion or a threat?**
      The Bureau assesses the *predictive relationship*, not the moral character of the influencer or the content. A demand exhibiting characteristics commonly associated with criminal extortion may still receive a positive PCA certification (Form NCD-2a) if non-compliance correlates strongly with a disposition profile the influencer reliably penalizes. Conversely, a seemingly beneficial offer may receive a negative PCA (Form NCD-2b) if compliance correlates with a profile reliably exploited. **The PCA result, not the citizen's subjective assessment of the demand's nature, determines the exposure-minimizing course.** (Ref: *BPA Advisory Note 5-G*).

  6.  **How does the Bureau ensure its own certifications are reliable?**
      The Bureau operates under strict procedural protocols (BPA Operational Code) designed to maximize the alignment of its certification procedures with the minimization of aggregate Realm and citizen exposure. The PCA methodology, including its application to the Bureau's own operational decisions, undergoes continuous internal review for predictive consistency. (Ref: *BPA Regulation 1-A; Internal Protocol Omega*).

  ---

  **Boxed Example: Case Resolution**

  *   **Citizen:** Agnes Bell (Dec'd. Estate Ref: BELL/AG-7743X)
  *   **NCD Type:** Implicit Predictive Binding (IPB) discovered posthumously during estate reconciliation audit.
  *   **Nature:** Analysis indicated Ms. Bell possessed a disposition profile (Type 4-C "Stable Defier") reliably penalized by a known predictive influencer pattern ("Pattern Sigma-7") if faced with a demand to contribute funds to a specified astronomical research fund.
  *   **Demand Status:** No demand was ever issued, received, or known to Ms. Bell.
  *   **BPA Action:** Form NCD-7 triggered by audit flag. PCA (Form NCD-2a) certified posthumously: Non-compliance disposition correlated with Pattern Sigma-7 penalization.
  *   **Resolution:** Estate Executors filed Form NCD-9 (Posthumous Compliance Fulfillment) authorizing payment from the estate to the specified fund, certified as exposure-minimizing action under the IPB. Disposition now recorded as compliant for Pattern Sigma-7, resolving estate exposure.

  ---

  **Bureau Performance: Q3 Fiscal Year**

  The Bureau of Predictive Alignment remains committed to its mandate of safeguarding Realm continuity and citizen welfare through the diligent administration of Predictive Interdependence findings. Our primary published objective is the **Reduction in Aggregate Certified Exposure (RACE) Metric**.

  *   **Current RACE Target:** 5.7% reduction year-on-year (Baseline: FY [Redacted] Aggregate Exposure Units).
  *   **Q3 Performance Highlights:**
      *   Form NCD-1 (Initial Notification) processed: 14,892 (↑ 3.2% vs Q2)
      *   PCA Certifications (Forms NCD-2a/2b) issued: 9,567 (↑ 2.8% vs Q2; 98.3% within standard processing time)
      *   IPB Verifications (Form NCD-8) completed: 1,204 (↓ 1.1% vs Q2; includes 83 posthumous certifications)
      *   PDA Registrations (Form NCD-5) filed: 587 (↑ 8.7% vs Q2)
      *   Aggregate Exposure Units calculated for RACE reporting: Compiled for internal assessment cycle.
  *   **Progress Notes:** Increased citizen engagement (Form NCD-1 volume) reflects successful outreach. Steady PCA output maintains assessment coverage. The Bureau continues to refine its internal assessment procedures to enhance alignment with the RACE objective. Performance against the RACE metric is subject to the standard biannual reconciliation and reporting cycle.
