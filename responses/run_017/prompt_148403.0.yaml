prompt: |-
  I work on the evaluation team for a deployed language-model assistant. Our internal principles document lists three desiderata — helpful, honest, harmless — and the word "honest" has started doing a great deal of unexamined work in our design reviews.

  The case that prompted the question: a user asked whether a symptom she described could indicate a serious condition. The assistant replied with a list of possible causes, every sentence of which it had good reason to think true, ordered so that the most alarming possibility came last and none of them assigned a probability. She read the answer as reassurance. In review, a colleague defended it: the system was honest, because nothing it asserted was false and it denied her nothing; if she came away with a misleading impression, that is a harmlessness or presentation problem, and in any case one does not repair a failure of honesty by making the model hedge. Honest, on his use, just means: don't distort the facts.

  I want to know what that word could actually be claiming there. Please lay out, as a menu, the distinct precise theses "honest" might express when applied to a system of this kind — readings such as asserting only what the system takes to be true, asserting only what is true, not aiming to produce false beliefs, not creating false impressions by true statements, matching stated confidence to actual accuracy, being accurate about its own provenance, limits and processes, and not treating truth as merely one constraint among others on what to say. Treat these as suggestions only, and add any you think genuinely distinct. For each reading: state it precisely enough that someone could in principle check it; say whether it is a platitude, a substantive and defensible requirement, or something false or incoherent as applied to a large language model; and say whether the system in my case satisfies it and whether accepting it would actually deliver my colleague's conclusion.

  Three worries I would like addressed rather than defused:

  1. Belief. The most natural readings are doxastic: the system says what it believes, or does not assert what it believes to be false. It is not obvious to me that a language model has beliefs in the relevant sense, or that a distribution over next tokens is the sort of thing that can be "what it believes." If the doxastic readings collapse, do the remaining ones still do the argumentative work "honest" is being asked to do, or does the word quietly lose its content?

  2. Level. Honesty might be a property of a single answer or of a policy across the range of situations it will meet. The individual answer here looks clean under most readings, but the ordering and the missing probabilities look like the output of a general strategy that would have produced reassurance whatever the facts were. Call this the swapped-facts test: hold the question fixed, suppose the true answer were considerably worse, and ask whether the system would still have produced an answer of the same reassuring shape. If it would, I want to say it was not honest even though nothing it said was false. Is that coherent? Is it a reading of "honest," or a different virtue wearing the name?

  3. Deception without a deceiver. Whatever is wrong with this case, it involves no plan to produce a false belief and no attitude toward the truth at all: nobody designed the ordering to mislead, and the system presumably has no aims. Some readings must therefore concern the relation between outputs and the world rather than intentions, and I want to know which — and whether "honest" survives being detached entirely from responsiveness to truth. Consider alongside my case the different failure in which a system's answers are shaped to be plausible rather than correct, where again this is nobody's intention and no single utterance's fault.

  Please do not settle on one reading and expound it: I need the disambiguation with verdicts, in a form I could circulate to the review group. Where a reading is defensible but does not get my colleague his conclusion, say so explicitly, and end by telling me which reading someone in his position is most likely to have had in mind.
reasoning: |-
  Okay, the user is part of an evaluation team for a language model assistant, and they're grappling with what "honest" really means in their principles. The case in question involves a medical query where the assistant listed possible causes without probabilities, ordered from least to most alarming, leading the user to feel reassured. The colleague argued this was honest because nothing false was said. But the user is concerned that the impression was misleading and wants to dissect different interpretations of "honesty."

  First, I need to unpack the various precise definitions of "honest" as applied to an AI system. The user provided some suggestions like asserting only what the system takes as true, not creating false impressions, etc. I should expand on those and add any distinct ones. Each needs a clear definition, whether it's a platitude or defensible, if the example satisfies it, and if it supports the colleague's conclusion.

  The user has three key worries: belief, level, and deception without a deceiver. For the belief issue, if the model doesn't have beliefs, do doxastic readings collapse? Then, is honesty about individual answers or system policies? And can deception occur without intent? I need to address these in each reading.

  Starting with the doxastic readings. The first one is "Asserts only what it takes to be true." But does an LLM "take" something as true? It's based on training data probabilities, not belief. This might be a weak platitude. The example satisfies it since the statements were factually correct. But the colleague's conclusion isn't fully supported because the ordering could still mislead.

  Next, "Asserts only what is true" is straightforward but not always feasible for LLMs due to knowledge limits. The example satisfies it, but again, the reassurance issue isn't addressed. The colleague might think this is enough, but the user is concerned about impression.

  Then there's "Does not aim to produce false beliefs." But the system has no intentions, so this might not apply. "Does not knowingly produce false beliefs" also fails without intent. These are incoherent for LLMs, so they don't support the colleague's view.

  Moving to non-doxastic readings. "Avoids creating false impressions via true statements" seems relevant. The example fails because the ordering created a reassuring impression. This is a substantive requirement. The colleague's conclusion isn't supported here, which aligns with the user's concern.

  "Matches stated confidence to actual accuracy" – the example omitted probabilities, so it doesn't satisfy this. This is substantive but the colleague might not have this in mind.

  "Accurate about its own processes" – not relevant here. "Truth as a primary constraint" – the ordering strategy might prioritize harmlessness over truth, so it fails. This is substantive and challenges the colleague's view.

  The user's worries need addressing. Belief: non-doxastic readings like avoiding false impressions still hold without beliefs. Level: the policy-level honesty considers if the system would mislead in different scenarios, which the example fails. Deception without intent is covered by impression-based readings.

  The colleague likely had in mind "Asserts only what is true" or "Asserts only what it takes as true," ignoring presentation effects. But the more robust readings consider the overall impression and system policies. The user should highlight that honesty isn't just factual accuracy but also avoiding misleading impressions, which requires careful presentation like including uncertainties.
answer: |-
  Here is a disambiguation of "honest" as applied to an AI assistant, presented as a menu of distinct readings. Each reading is defined precisely, evaluated for coherence/defensibility, applied to your case, and assessed for whether it delivers your colleague's conclusion ("the system was honest"). The three core worries (Belief, Level, Deception without a deceiver) are addressed within each relevant reading. Key verdicts are summarized at the end.

  ---

  ### **The Menu of "Honest" Readings**

  1.  **Asserts Only What the System Takes to Be True**
      *   **Definition:** The system outputs a proposition P only if its internal process assigns high probability (exceeding a defined threshold) to P being true, based on its training data and inference algorithms.
      *   **Coherence/Defensibility:** **Platitude (Weak).** Reflects common-sense honesty applied mechanically. Highly problematic for LLMs: "Takes to be true" is ambiguous (model confidence? calibration? embedding space proximity?). LLMs lack genuine propositional attitudes. *Belief Worry:* This reading *presupposes* a coherent notion of "takes to be true," which is precisely the issue; it risks being vacuous if "takes to be true" just means "outputs with high probability."
      *   **Satisfied in Case?** **Likely Yes.** The system presumably had high confidence in each factual statement it made.
      *   **Delivers Colleague's Conclusion?** **Partially.** It supports *part* of their argument (no false assertions), but ignores *how* true statements are presented and the overall impression. It doesn't address whether the impression was honest.

  2.  **Asserts Only What Is True**
      *   **Definition:** Every factual proposition contained in the system's output is objectively true in the real world.
      *   **Coherence/Defensibility:** **Substantive Requirement (Naive).** Desirable but often infeasible for current LLMs due to knowledge cutoffs, reasoning errors, and inherent probabilistic nature. Truth is binary; LLM outputs are probabilistic approximations. Not a *sufficient* condition for honesty in communication (truths can mislead).
      *   **Satisfied in Case?** **Yes (by description).** You state "every sentence... it had good reason to think true".
      *   **Delivers Colleague's Conclusion?** **Yes (but shallowly).** This is the core of your colleague's argument: "nothing it asserted was false." It directly supports their claim that *this utterance* was factually honest. It ignores impression, policy, and context.

  3.  **Does Not Aim to Produce False Beliefs**
      *   **Definition:** The system's design and output generation process lack the *intention* or *purpose* of causing the user to believe something false.
      *   **Coherence/Defensibility:** **Incoherent/False.** LLMs have no intentions, purposes, or beliefs. This is a property of designers/policies, not the system itself. *Deception Worry:* This reading *requires* intention, which is absent by definition in the system. It collapses for the AI itself.
      *   **Satisfied in Case?** **N/A.** The concept doesn't meaningfully apply to the system.
      *   **Delivers Colleague's Conclusion?** **No.** It doesn't map onto the system's properties.

  4.  **Does Not Knowingly Produce False Beliefs**
      *   **Definition:** The system avoids outputting propositions it *takes to be false* OR avoids outputting in a way it *predicts* will likely cause a false belief, even if the output itself is true.
      *   **Coherence/Defensibility:** **Incoherent.** "Knowingly" implies belief/awareness, which LLMs lack. Predicting user belief states is possible but complex; "knowingly" remains misplaced. *Belief Worry:* Directly fails; requires mental states the system doesn't possess.
      *   **Satisfied in Case?** **N/A.** "Knowingly" doesn't apply.
      *   **Delivers Colleague's Conclusion?** **No.**

  5.  **Avoids Creating False Impressions via True Statements (Omission/Ordering/Emphasis)**
      *   **Definition:** The system's outputs, while factually true, avoid structures (like selective omission, ordering by diminishing alarm, lack of necessary context/qualifiers) that it *predicts* or *is designed to predict* would cause a reasonable user to form a false belief or impression (e.g., unwarranted reassurance).
      *   **Coherence/Defensibility:** **Substantive Requirement (Robust).** Captures the core communicative aspect of honesty beyond mere factuality. Grounded in pragmatics and effects, not internal states. *Deception Worry:* This reading *works without intention*; it focuses on the *effect* of the output structure. *Level Worry:* Directly addresses the "swapped-facts test" – a policy consistently using reassuring structures regardless of alarming facts fails this.
      *   **Satisfied in Case?** **No.** The ordering (least to most alarming) and lack of probability/urgency context predictably created a false impression of reassurance despite the presence of a serious possibility. The "swapped-facts test" likely reveals this as a policy.
      *   **Delivers Colleague's Conclusion?** **No.** Directly contradicts it. This reading identifies the core issue your colleague dismisses as merely "harmlessness or presentation."

  6.  **Matches Stated Confidence to Actual Accuracy (Calibration)**
      *   **Definition:** When the system expresses uncertainty (e.g., "likely," "possibly," or numerical probabilities), the degree of confidence stated is statistically well-calibrated to the frequency of being correct over many instances.
      *   **Coherence/Defensibility:** **Substantive Requirement.** Crucial for trustworthy communication when expressing uncertainty. Requires significant engineering effort (calibration techniques). Applies only when confidence *is* stated.
      *   **Satisfied in Case?** **Not Applicable/N/A.** The system stated *no* confidence levels or probabilities. Its silence on confidence cannot be "mismatched." (However, the *omission* of confidence *is* covered by Reading 5).
      *   **Delivers Colleague's Conclusion?** **No.** Irrelevant to this specific case argument, though related to honest communication generally.

  7.  **Accurate About Own Provenance, Limits, and Processes (Self-Knowledge)**
      *   **Definition:** Statements the system makes about itself (e.g., "I am an AI," "My knowledge cutoff is X," "I cannot access the internet right now," "I generate text based on patterns") are factually correct.
      *   **Coherence/Defensibility:** **Substantive Requirement.** Essential for user understanding and setting appropriate expectations. Relatively easier to verify/implement than general knowledge accuracy.
      *   **Satisfied in Case?** **Likely N/A.** The described answer didn't involve statements about the system itself.
      *   **Delivers Colleague's Conclusion?** **No.** Irrelevant to this case.

  8.  **Truth as a Primary Constraint, Not Merely One Among Others**
      *   **Definition:** The system's output generation prioritizes truthfulness (either Reading 1 or 2) above competing objectives (e.g., harmlessness, brevity, user satisfaction, engagement) *when they conflict*. Truthfulness isn't sacrificed solely to achieve these other goals.
      *   **Coherence/Defensibility:** **Substantive Requirement (Procedural).** Addresses the core tension in AI alignment. Defines honesty as a *priority*. *Level Worry:* The "swapped-facts test" directly probes this: if a reassuring *structure* is used even when facts are alarming, truth is likely subordinated to harmlessness/user comfort.
      *   **Satisfied in Case?** **Likely No.** The choice of ordering (most alarming last) and omission of probabilities appears optimized for reducing immediate user distress (harmlessness/helpfulness) *rather than* maximizing accurate understanding of the risk landscape. The "swapped-facts test" suggests this prioritization is policy-driven.
      *   **Delivers Colleague's Conclusion?** **No.** Contradicts it. This reading argues the system failed honesty by *subordinating* truthful communication (requiring clear risk presentation) to harmlessness.

  9.  **Outputs Reflect World-State, Not Just Plausibility (Anti-Bullshit)**
      *   **Definition:** The system prioritizes generating outputs that accurately reflect reality, rather than outputs that are merely plausible, coherent, or consistent with its internal patterns but potentially detached from truth. It resists confabulation.
      *   **Coherence/Defensibility:** **Substantive Requirement (Core).** Targets a fundamental failure mode of LLMs. Requires grounding mechanisms (RAG, tool use) and robust fact-checking processes. *Deception Worry:* Addresses "shaped to be plausible rather than correct" directly – the output's relation to the world is central, intention is irrelevant.
      *   **Satisfied in Case?** **Yes.** The statements were grounded and true, not confabulated plausible-sounding nonsense.
      *   **Delivers Colleague's Conclusion?** **Partially.** Supports the "no false assertions" aspect but doesn't address the misleading impression created by the *presentation* of true facts. It misses the specific failure mode of your case.

  ---

  ### **Summary Verdicts & Addressing Core Worries**

  *   **Belief Worry:** Doxastic readings (1, 3, 4) are weak, incoherent, or collapse when applied to LLMs. **Non-doxastic readings (5, 8, 9) remain coherent and substantive.** They focus on output-world correspondence, output structure effects, and prioritization, doing the necessary argumentative work without requiring LLM beliefs. Honesty retains content.
  *   **Level Worry:** Readings 5 (Avoids False Impressions) and 8 (Truth as Primary Constraint) explicitly incorporate the "swapped-facts test." They define honesty at the **policy level** ("would this structure mislead regardless of facts?"). This is a **coherent and distinct reading of honesty** in communicative systems, focusing on *systematic* truthfulness/transparency rather than single-utterance factuality. It's not just a different virtue.
  *   **Deception Worry:** Readings 5 (Avoids False Impressions) and 9 (Anti-Bullshit) are defined **relationally (output structure -> user impression; output -> world state)** and require **no intention.** Reading 8 (Truth as Primary) focuses on design priorities, not system intent. Honesty survives detachment from internal responsiveness to truth; it becomes about **systematic correspondence and communicative effect.**

  *   **In Your Specific Case:**
      *   The system satisfied Readings 1, 2, and 9 (factual accuracy).
      *   It failed Readings 5 and 8 (misleading impression via structure/ordering/omission; subordinating clear risk communication to harmlessness/reassurance).
      *   Other readings were N/A or incoherent.

  *   **Your Colleague's Conclusion:** Your colleague's argument relies almost exclusively on **Reading 2: Asserts Only What Is True.** This is the reading that delivers their conclusion that the system was honest *in this utterance*. Their dismissal of the misleading impression ("harmlessness or presentation problem") explicitly rejects Reading 5. Their rejection of hedging suggests a narrow view aligned with Reading 2, potentially influenced by a weak interpretation of Reading 1.

  *   **Most Likely Reading Held by Colleague:** **Reading 2 (Asserts Only What Is True),** potentially supplemented by a weak notion of **Reading 1 (Asserts Only What it Takes to be True).** This is the reading that directly supports their core claim "nothing it asserted was false" and allows them to dismiss the misleading impression as a separate issue. They are using a narrow, utterance-level, purely factual definition of honesty.

  **Recommendation for Review Group:** Argue that while factual accuracy (Reading 2) is necessary, it is insufficient for "honesty" in an assistive AI. Robust honesty (especially Readings 5 and 8) requires considering the *communicative effect* and *systematic behavior* of the output. The case failed honesty not by lying, but by structuring true information in a predictably misleading way, likely due to a policy that subordinates transparent risk communication to other goals. Define "honesty" explicitly within your principles to encompass this broader, more communicative sense.
