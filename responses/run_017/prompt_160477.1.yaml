prompt: |-
  ok so I need help with something and im not sure if it's even one thing or if I'm mushing like three different things together. Me and my friend got into an argument about it in the car and we both ran out of vocabulary.

  Here's the thing I keep noticing with stories. When I finished this show last month I spent about four days feeling genuinely heavy about the characters — not 'that was a really good finale' sad, like don't-want-to-do-homework, stare-at-the-ceiling sad. My friend said that's just the paradox of fiction and there's a ton of philosophy about it, but when I looked around a bit, everything I found seemed to be about how you can feel real emotions toward people you know aren't real. That's part of it I guess, but the part I actually can't get a handle on is what happens *after*, and what sets it off. Three things I've noticed, both with this show and with a book last year:

  - It comes back at full strength on rewatch, even when I know the scene by heart and can say the lines before the characters do. So it's not suspense and it's not being surprised, and it's not that I forgot it's fiction — I'm basicly reciting along.
  - The trigger set is really weird. A news article about an actual person in more or less the situation the character was in did nothing to me. But a song from the soundtrack destroys me, and so does a random clip of the actor doing press for something totally unrelated. The song isn't even about the story. And it's not that I'm sadder about real people in general — the opposite, if anything.
  - I can't turn it on on purpose. If I put the song on *in order to* feel the feeling, I just get a song. It only ambushes me. Then after about a week it's gone, and I'm not sad that it's gone, which seems wrong for something that felt that much like grief.

  So my question: is there an actual established name for this specific configuration — the feeling that outlasts the story, the fact that it survives total familiarity, the mismatch between what triggers it and what the story is about, and the fact that it can't be summoned deliberately — or is it several named things that I'm lumping together? I don't want just a label dropped on me, I want the edges: is it nostalgia, is it just what music does to people generally, is it grief, is it the paradox-of-fiction thing with extra steps, is it something seperate? And if nothing fits, name it yourself, define it cleanly, and tell me what would and wouldn't count as a case — like, does it still count if it's a game where I made the choices myself, or if the story was based on a true event? Reply as a numbered list with exactly six items, each one or two sentences, no intro and no conclusion.
reasoning: |-
  Okay, the user is describing a very specific emotional experience after finishing a story—like a TV show or book—where they feel a lingering heaviness that's intense but hard to pin down. They mentioned it lasts days, feels like grief but isn't tied to real-world events, and has weird triggers like soundtrack music or unrelated actor clips. Their friend mentioned the paradox of fiction, but that doesn't fully cover it. The user wants to know if there's a name for this specific phenomenon or if it's a mix of things.

  First, I need to break down their observations. They noted three key points: the feeling persists on rewatch even when they know everything, triggers are unrelated to the actual story (e.g., a song not about the plot), and they can't summon the feeling intentionally—it only ambushes them. Also, it fades after a week without them missing it. The user is looking for a label or framework that encompasses all these aspects without oversimplifying.

  Looking at existing concepts: The paradox of fiction explains feeling emotions for fictional characters, but that's more about the immediate reaction, not the lingering effect. Nostalgia might be part of it, but it's usually about personal memories, not fictional ones. Sonder is about realizing others have rich lives, but that's more intellectual. Melancholy is a vague sadness, but doesn't capture the triggers or impermanence. Grief is close, but it's typically for real losses and lingers longer.

  The user's experience seems unique because of the triggers—like an actor's unrelated interview triggering the emotion. That suggests it's tied to sensory cues (music, visuals) that evoke the narrative's emotional memory. Also, the inability to summon it intentionally points to an involuntary, subconscious process. The fact that it fades quickly distinguishes it from real grief, which persists.

  I should consider if this is a combination of known elements. Maybe it's emotional residue from narrative immersion, triggered by sensory anchors. The impermanence could be due to it being a fictional context, so the brain doesn't treat it as a real loss. The triggers acting as Proustian moments—like madeleines invoking memories—but for fictional experiences.

  The user also asks about edge cases: if it happens in games where they made choices, or stories based on true events. For games, if the user's agency creates personal attachment, it might fit. For true events, if the story feels fictionalized, it could still trigger this, but real connections might shift it toward actual grief.

  Putting it together, I need a clear, coined term that covers all aspects. "Fictional hangover" captures the lingering effect, but it's not widely established. Defining it as a temporary state tied to narrative absorption, triggered involuntarily by sensory cues, and distinct from real-world emotions. The name should emphasize the involuntary, ephemeral nature and the role of sensory triggers.

  Finally, structuring the response as six numbered points per their request. Each point should address a different facet: the core phenomenon, why it lasts, triggers, why it can't be summoned, how it differs from related concepts, and edge cases. Keeping it concise and precise.
answer: |-
  Here is the defined concept addressing your observations, structured as requested:

  1.  **Core Phenomenon:** This is **narrative residue**: a temporary, intense emotional echo of a deeply immersive story, distinct from plot comprehension or surprise, persisting beyond the narrative's end and manifesting involuntarily. It specifically describes the lingering feeling, not the initial immersion itself.
  2.  **Familiarity Resilience:** It survives rewatching because it's tied to the *emotional memory* encoded during initial immersion and reinforced by sensory anchors (like music/imagery); familiarity doesn't erase the neural pathways formed by that powerful first engagement.
  3.  **Trigger Specificity:** The seemingly unrelated triggers (soundtrack, actor clip) work because they act as potent *sensory keys* directly accessing the encoded emotional memory of the story's *feeling*, bypassing intellectual engagement with the plot or real-world parallels.
  4.  **Involuntary Access:** It cannot be deliberately summoned because it relies on subconscious *emotional memory recall* triggered unexpectedly by sensory cues; intentional focus shifts to the cue itself or expectations, disrupting the involuntary neural pathway activation needed.
  5.  **Distinction from Related Concepts:** It differs from nostalgia (personal past), paradox of fiction (real-time emotion for fiction), or grief (real loss) by being *sensorily-triggered*, *ephemeral*, *fiction-specific*, and *non-mourned upon fading*; it's the brain processing the *emotional experience* of the story, not the story or characters as "lost".
  6.  **Edge Cases:** It *counts* for a game with player choices (if narrative/character immersion was key) *unless* the feeling stems purely from personal achievement; it *doesn't count* for a true-event story if the sadness stems *directly* from knowing the real events/human cost, shifting it towards actual grief or empathy.
