  ### Newcomb-Style Decision Problem: Family Firm Succession

  **Scenario:**  
  Alex is a candidate to inherit leadership of the family firm upon the current owner's retirement. The owner will decide whether to appoint Alex (large payoff) after observing whether Alex invests personal savings into the firm ("one-boxing") or keeps the savings ("two-boxing"). The owner believes Alex must be either *aligned* (prioritizes firm growth) or *independent* (prioritizes personal wealth). If Alex is aligned, investing signals commitment and increases the chance of appointment. If Alex is independent, investing signals poor judgment (risking personal funds) and decreases the chance. Alex has received mixed signals about their own type: an aligned aunt praised their dedication, while an independent uncle mocked their loyalty. Alex is unsure which trait they truly embody. Investing costs the savings amount (transparent box: $10,000). Appointment brings $1,000,000.

  ---

  **Analysis**  
  *Hidden state:* Alex's type (aligned or independent).  
  *Acts:*  
  - **A (one-box):** Invest savings.  
  - **B (two-box):** Keep savings.  

  *Owner's decision rule (forward-causal):*  
  - If Alex is *aligned*, investing raises appointment probability from 0.3 to 0.7.  
  - If Alex is *independent*, investing lowers appointment probability from 0.6 to 0.2.  
  *Rationale:* Aligned types demonstrate commitment by investing; independent types appear reckless. Keeping savings is prudent for independents and cautious for aligned.  

  *Agent uncertainty:* Alex's prior probability of being aligned, based on conflicting family feedback: **P(aligned) = 0.5**.  

  ---

  **Probabilities and Utilities**  
  - *Transparent box (B):* $10,000 savings kept.  
  - *Opaque box:* Appointment worth $1,000,000 if awarded.  
  - Causal probabilities of appointment:  
    | Type       | P(appoint \| do(A)) | P(appoint \| do(B)) |  
    |------------|---------------------|---------------------|  
    | Aligned    | 0.7                 | 0.3                 |  
    | Independent| 0.2                 | 0.6                 |  

  - Evidential probabilities (from Alex's perspective):  
    - **P(aligned \| A):** Investing suggests aligned tendencies. Alex infers:  
      - Aligned types are twice as likely to invest (70% vs. 30% for non-investing) as independents.  
      - Bayes: P(aligned \| A) = (0.7 × 0.5) / [(0.7×0.5) + (0.2×0.5)] = **0.78**.  
    - **P(aligned \| B):** Keeping savings suggests independence:  
      - P(aligned \| B) = (0.3 × 0.5) / [(0.3×0.5) + (0.6×0.5)] = **0.33**.  

  ---

  **Decision Theory Verdicts**  
  1. **Causal Decision Theory (CDT):**  
     - *EU(A):* Average over *causal* appointment chances:  
       = P(aligned) × [0.7 × 1,000,000] + P(independent) × [0.2 × 1,000,000]  
       = (0.5 × 700,000) + (0.5 × 200,000) = **$450,000**.  
     - *EU(B):* Includes $10,000 savings:  
       = P(aligned) × [0.3 × 1,000,000 + 10,000] + P(independent) × [0.6 × 1,000,000 + 10,000]  
       = (0.5 × 310,000) + (0.5 × 610,000) = **$460,000**.  
     - **CDT prescribes B (two-boxing):** $460,000 > $450,000.  

  2. **Evidential Decision Theory (EDT):**  
     - *EU(A):* Conditional on A, expected utility of appointment:  
       = P(appoint \| A) × 1,000,000  
       = [P(aligned \| A) × 0.7 + P(independent \| A) × 0.2] × 1,000,000  
       = [(0.78 × 0.7) + (0.22 × 0.2)] × 1,000,000 = **$590,000**.  
     - *EU(B):* Includes savings, conditional on B:  
       = [P(appoint \| B) × 1,000,000] + 10,000  
       = [P(aligned \| B) × 0.3 + P(independent \| B) × 0.6] × 1,000,000 + 10,000  
       = [(0.33 × 0.3) + (0.67 × 0.6)] × 1,000,000 + 10,000 ≈ **$481,000**.  
     - **EDT prescribes A (one-boxing):** $590,000 > $481,000.  

  *Non-knife-edge check:*  
  - If P(aligned) increases to 0.6:  
    - CDT still prefers B (EU(B) = $490k > EU(A) = $470k).  
    - EDT still prefers A (EU(A) = $600k > EU(B) = $490k).  
  - If aligned investment probability decreases to 0.6:  
    - CDT still prefers B (EU(B) = $460k > EU(A) = $400k).  
    - EDT still prefers A (EU(A) = $550k > EU(B) = $481k).  

  ---

  **Structural Feature and Familiar Cases**  
  - **Key feature:** *Act-state correlation* via the agent’s uncertainty about their own type, combined with *differential causal effects* of the act across states.  
  - **Delete causal dependence:** If investing doesn’t affect appointment chances (e.g., probabilities fixed at 0.5 regardless), CDT collapses to EU(B) > EU(A) due to savings—resembling **Smoking Lesion** (EDT and CDT agree on act, but for different reasons).  
  - **Delete evidential dependence:** If Alex knows their type, P(aligned) is 0 or 1. CDT then chooses A if aligned (EU= $700k > $310k), B if independent (EU= $610k > $200k)—resembling **Ordinary Newcomb** (EDT irrelevant with no hidden state).  

  ---

  **Reply for CDT Defender**  
  - **Strong reply:** "CDT correctly ignores the self-fulfilling correlation. The $10,000 savings dominates when averaging over causal effects, while EDT is misled by the spurious statistical link."  
  - **Assessment:** Principled fix (e.g., **Causal Counterfactuals**), not a patch. CDT’s aversion to acts correlated with negative states is consistent but risks underinvesting in self-fulfilling opportunities.  

  ---

  **Relevance to Standard Newcomb Narratives**  
  Yes, this shows that "one-boxing=evidential, two-boxing=causal" is an artifact of predictor-based setups. The theories’ prescriptions depend on the *structure of dependence*, not inherent traits. We should stop repeating the oversimplification.  

  ---

  **Functional Decision Theory (FDT)**  
  FDT prescribes one-boxing (A): It chooses the policy "invest if aligned" that, when implemented across similar agents, maximizes expected utility (appointment chance rises for aligned types).  

  ---

  **Real-World Analogy**  
  - **Epidemiology:** Vaccination decisions where uptake is evidence of risk-aversion (lowering disease susceptibility) but causes herd immunity (causal benefit).  
  - **Finance:** Entrepreneurs investing personal funds—seen by investors as confidence (evidence of alignment) but also directly improves venture viability (causal effect).
