prompt: |-
  So I've fallen down a bit of a rabbit hole this past year reading about the ordinary-men-versus-willing-executioners argument — the one about that reserve police battalion of middle-aged men from Hamburg who ended up shooting civilians and marching people to the trains in occupied Poland, and the fight over whether you explain that by the situation they got dropped into or by what they already believed before they got there. I think the names are Browning and Goldhagen but I'm probably mangling it. Anyway, I've come down on the situational side, and I've ended up with my own version of it which is a bit stronger than what I've seen of Browning's:

  My claim: the unit wasn't a collection of men with unusually murderous dispositions who finally got the chance. The causal weight sat in the situation — small-group loyalty, deference to the man in charge, not wanting to be the one who lets his mates down, the ratchet where the first time is agony and the tenth time is a job. And the bit I lean on hardest: a few men did step out or ask to be excused and nothing happened to them, so the situation wasn't literally forcing anyone's hand, it was just extremely costly to walk away from.

  What I want is the honest case against that, and I don't mean the everything-is-antisemitism gesture, which I think I can absorb. I mean the things that should actually move me. Three things I've been chewing on, in case they help:

  One, what I'd call the volunteer wedge. Even if nobody was picked for fanaticism at intake, the unit sorted itself out afterwards — men who put themselves forward for the shooting details, men who went off looking for people hiding in the woods on their day off, men who never once asked to be excused. If the keen minority clusters in a way that tracks who ends up doing most of the killing, then the population that did the killing isn't the population that arrived, and my no-special-population claim is only a claim about intake, which is a weaker and less interesting claim than the one I've been making.

  Two, what I'd call the swap test. Take two units with the same kind of intake and put them under local commanders with different styles. If outcomes track the commander, situation wins. If they track the unit, something about the men wins. As far as I can tell nobody can run that comparison even badly, and I want to know whether that means my view has quietly become unfalsifiable — and if it has, whether that's actually a defect in a claim of this kind or just what historical explanation looks like when you can't rerun anything.

  Three, the residue problem. Within the same unit on the same day, some men fired for hours, some drifted off and spent it guarding the perimeter, some got themselves sent back to barracks. I've been explaining all of that by micro-situation — which squad he was standing with, whether his mate went along with it. At what point does my view stop being an explanation of the behaviour and start being just a redescription of whatever happened, affair by affair?

  What I'd like from you:

  - Sort the things that count against my position by how much damage they'd actually do, worst first, rather than giving me a flat list.
  - For each one, say whether it's something that has arguably already happened, or something we'd still need to find.
  - Be explicit about which ones a defender of my position would concede as counting against them, as opposed to the ones they'd dismiss as question-begging or as smuggling in the conclusion. I want the concessions from inside the camp, not just the criticisms from outside.
  - I'd personally find the residue problem the most persuasive if you can make it bite, and I care much more about the mechanism than about who won the argument.

  No reading lists, citations or suggestions for further reading — I can't look anything up anyway and I'm not going to. One thing: I read somewhere that the men were told at the start that anyone who didn't feel up to it could step out, and that very few did. If that detail is load-bearing for your answer, say so and say which way it cuts.

  Could you lay it out in these sections, roughly:

  1. What my view actually commits me to — about 150 words
  2. Ranked defeaters, most damaging first — about 400 words
  3. What a defender should concede versus what they'd reject — about 200 words
  4. Is it unfalsifiable, and does that matter — about 250 words
  5. Confidence and the weak point — about 100 words

  And in that last one, tell me how confident you are in what you've said overall, and single out the one claim you'd least want to bet money on.
