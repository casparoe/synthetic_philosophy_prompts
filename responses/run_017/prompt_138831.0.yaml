  We are given a shared setup: both parties work with a 1-billion-parameter decoder-only transformer and a sparse autoencoder (SAE) fitted to the residual stream activations at one middle layer. They have three example directions: one for language, one for sentiment/politeness, and one for a named entity. They also have a synthetic case with a known ground truth.

  The deliverable has five parts:

  1. Agreed Claims (numbered section)
  2. Disagreements Table
  3. Crux Table (with specific tests)
  4. Retraction Conditions
  5. Closing Section on verbal vs substantive disagreements and next steps.

  We must define technical terms. The register is formal, collaborative, and neutral.

  Let's begin.

  ---

  **Preamble: Shared Setup**

  Both parties work with a 1-billion-parameter decoder-only transformer neural network trained on a mixed text corpus. A decoder-only transformer is a type of neural network architecture that processes sequences of tokens (e.g., words or subwords) and generates output sequences, commonly used in language modeling. The residual stream refers to the vector space that carries the main flow of information through the network, with each layer adding an update to this stream. 

  We focus on activations at one middle layer (e.g., layer 12 of 24). We apply an unsupervised dictionary-learning pipeline (specifically, a sparse autoencoder, or SAE) to the residual stream activations. The SAE learns a set of basis vectors (called "features" or "dictionary elements") such that each activation vector can be approximately represented as a sparse linear combination of these basis vectors. 

  We have jointly studied three example directions (i.e., basis vectors) recovered by the SAE:
  - Direction A: Tracks the language of a passage (e.g., English vs. French).
  - Direction B: Tracks sentiment or politeness (e.g., positive vs. negative, polite vs. rude).
  - Direction C: Tracks references to a specific kind of named entity (e.g., names of cities).

  Additionally, we have a controlled test case: a small transformer trained on a synthetic language generated by a known grammar over a known set of latent variables. In this case, the "true" internal variables that the network should represent are known by construction.

  ---

  **1. Agreed Claims**

  The following claims are agreed upon by both parties. They are substantive and not mere platitudes.

  1. **The SAE pipeline recovers directions that correlate with human-interpretable concepts in the input.** For the three examples (language, sentiment, named entity), we observe that the activation of the recovered direction is predictive of the corresponding concept in the input text, as judged by human inspection. However, this correlation does not, by itself, establish that the network uses these directions as representational primitives.

  2. **The SAE pipeline imposes a sparse decomposition.** The SAE method, by design, finds a set of basis vectors that approximate the activation vectors with a small number of non-zero coefficients (sparsity). This sparsity constraint is part of the method and not necessarily a property of the network itself. The choice of sparsity level and other hyperparameters influences the decomposition.

  3. **The network's input-output behavior is invariant under linear reparameterization of the residual stream.** If we apply an invertible linear transformation to the activations at a layer and adjust the weights of the adjacent layers accordingly, the overall function computed by the network remains unchanged. This implies that the internal representation is only defined up to linear isomorphism.

  4. **The network's internal state contains information about latent structure in the input.** The network must encode information about properties such as language, sentiment, and named entities in its activations because these properties are relevant to the task (predicting the next token). However, the form and granularity of this encoding are not determined by the input-output function alone.

  5. **The SAE pipeline does not, on its own, establish that a recovered direction is causally efficacious.** Even if a direction is interpretable and correlates with a concept, it may not play a direct causal role in the network's computation. Intervening on the activation (e.g., by setting the coefficient of a direction) may change the output, but this does not necessarily mean that the network normally uses that direction as a variable in its computation.

  6. **The synthetic case provides a valuable testbed.** Because the true latent variables in the synthetic language are known, we can test whether the SAE pipeline recovers them. However, the synthetic case may not perfectly mirror the natural language case due to differences in complexity and the nature of the latent variables.

  7. **There is a need to explain the network's generalization and robustness.** The network's ability to perform well on unseen inputs (generalization) and maintain performance under perturbations (robustness) requires an internal structure that captures stable features of the input distribution. Any account of representation must contribute to explaining these capabilities.

  8. **A representation claim must deliver explanatory power.** For a representation to be worth positing, it should provide a compact and predictive account of the network's behavior across a range of inputs, including out-of-distribution cases. It should also support counterfactual reasoning (e.g., "if this feature were different, the output would change in such-and-such way").

  9. **The current interpretability methods do not converge to a unique decomposition.** Even within the same SAE pipeline, different hyperparameters (e.g., sparsity penalty, random seed) can yield different sets of directions that are similarly interpretable and have similar reconstruction error. This suggests that the method is underconstrained.

  10. **The network's causal structure is implemented at the level of the entire computation.** The network's behavior is determined by the collective effect of all its weights and activations. Any decomposition into features is a tool for understanding, but the network's fundamental causal mechanisms operate on the high-dimensional activation vectors.

  ---

  **2. Disagreements Table**

  We break down the disagreement into sub-questions. For each, we provide:
  - Disputed Claim (neutral)
  - Realist Formulation
  - Deflationist Formulation
  - Note on the difference in wording

  The sub-questions are:

  A. **Existence of a privileged decomposition:** Is there a unique (or at least, a privileged) decomposition of the activation vector into features that the network uses?
  B. **Content attribution:** Do the features recovered by the SAE carry content (i.e., represent properties of the input or output) in a way that is not merely projective?
  C. **Causal role:** Do the features play the causal role attributed to them in the network's computation?
  D. **Method convergence:** Do our methods (like SAE) converge to the true features (if they exist) as we improve the methods and scale up?

  | Sub-Question | Disputed Claim (Neutral) | Realist Formulation | Deflationist Formulation | Note on Wording Difference |
  |--------------|--------------------------|---------------------|--------------------------|----------------------------|
  | A. Existence of a privileged decomposition | Whether the network internally decomposes its activation vector into a set of features that are privileged by the network's causal structure. | "The network's internal state is naturally decomposed into a set of features that are causally discrete, meaning that they are the minimal units that mediate between input and output in the network's computation. This decomposition is fixed by the network's weight matrices and activation function, and it is the one that the network 'uses'." | "Any decomposition of the activation vector into features is a matter of analytical convenience. The network does not 'use' one decomposition over another; the causal-explanatory structure is only defined at the level of the entire activation vector and the nonlinear transformations applied to it." | The realist emphasizes the causal discreteness and minimality of features, while the deflationist denies that any decomposition is privileged by the network's causal structure. |
  | B. Content attribution | Whether the features recovered by the SAE genuinely represent external properties, such that they can be said to have content. | "The features recovered by the SAE correspond to real representational variables in the network that carry information about the world (e.g., the presence of a named entity) and are used by the network to guide its output. Their content is fixed by their causal role in the network's computation and its training history." | "The interpretability of a feature is a product of the SAE's sparsity constraint and human pattern-matching. The network does not have internal variables with content; rather, the entire activation vector encodes information in a distributed manner, and any attribution of content to a single direction is a useful fiction." | The realist ties content to the causal role in computation, while the deflationist sees content as imposed by the interpreter. |
  | C. Causal role | Whether the features identified by the SAE play the specific causal role in the network that we attribute to them (e.g., that the 'sentiment' feature directly influences the output in a way that matches our interpretation). | "When we intervene on a feature (e.g., by increasing the coefficient for the sentiment direction), the resulting change in output is consistent with the feature's purported content because that feature is a genuine causal variable in the network's normal operation." | "Interventions on SAE features may change the output, but this does not show that the network normally uses that feature as a discrete causal variable. The effect of the intervention might be due to the perturbation propagating through the network in a way that is not mediated by the feature's intended content." | The realist sees interventions as revealing the normal causal role, while the deflationist argues that interventions may not reflect the network's unperturbed computation. |
  | D. Method convergence | Whether improved interpretability methods (e.g., better SAE training) would converge to a unique set of features that reflect the network's true internal decomposition. | "As we improve our interpretability methods (e.g., by using more data, better optimization, or more sophisticated architectures), the recovered features will become more stable and will converge to the true features used by the network." | "Even with perfect optimization and unlimited data, the SAE (and similar methods) will recover different sets of features depending on hyperparameters and random seeds. This is because there is no unique set of features to converge to; the network's representation is inherently high-dimensional and entangled." | The realist believes in convergence to a ground truth, while the deflationist believes the method is fundamentally underconstrained. |

  **Which are live:** All four sub-questions (A, B, C, D) are live disagreements between the two parties.

  ---

  **3. Crux Table**

  For each crux, we provide:
  - The sub-question it bears on.
  - The test/case/argument (concrete and pre-agreed).
  - Realist's prediction.
  - Deflationist's prediction.

  We consider five cruxes:

  | Crux Name | Sub-Questions Addressed | Test/Case/Argument | Realist Prediction | Deflationist Prediction |
  |-----------|-------------------------|-------------------|-------------------|------------------------|
  | Change-of-basis | A, D | We perform a change of basis: insert an invertible linear transformation T at the chosen layer and adjust the adjacent weights to compensate. We then run the SAE pipeline on the transformed network. | The SAE will recover features that are linear combinations of the original features (i.e., the features in the new basis). The network's causal structure is preserved, so the features in the new basis are just as real. | The SAE will recover a different set of features that are interpretable in the new basis. This shows that the original decomposition was not privileged. |
  | Illegible-ground-truth control | B, D | In the synthetic case, we design the true latent variables to be deliberately illegible to humans: e.g., random linear functionals of the input, dense and entangled. We then run the SAE pipeline and see if it recovers these variables. | The SAE will recover the true latent variables (or a linear transformation of them) because they are causally efficacious in the network. The human illegibility does not matter. | The SAE will fail to recover the true variables because they are not sparse or interpretable. Instead, it will recover directions that are sparse and human-interpretable, which may not correspond to the true variables. |
  | Untrained-network control | A, D | We run the SAE pipeline on the same architecture but with random weights (untrained). We then assess whether the recovered features are interpretable and causally efficacious. We agree that a null result (no interpretable features) would support the realist, but we design a more robust control: train the SAE on activations from the untrained network and then test whether the features can be used to steer the network. | The SAE will not recover interpretable features in the untrained network, and any interventions using the recovered features will not produce coherent changes in the output. | The SAE may still recover some interpretable features (due to random correlations), and interventions might produce some changes, but these will be chaotic and not generalizable. However, the deflationist notes that the activation statistics of an untrained network are different, so even a null result is ambiguous. |
  | Cross-model transplant and far-transfer steering | B, C | We take a direction (e.g., the sentiment direction) recovered from Network 1 (trained on Corpus A) and use it to steer Network 2 (same architecture, trained on Corpus B from a different initialization). We also test far-transfer: use the sentiment direction on inputs that are very different from the training distribution (e.g., in a different language or topic). | The steering will transfer: increasing the sentiment feature in Network 2 will produce a more positive output, even though the feature was recovered from Network 1. This is because the same features are learned in both networks. | The steering will not transfer reliably. The feature is specific to Network 1 and Corpus A. Any apparent transfer is coincidental and not general. |
  | Compression and OOD prediction | A, B, D | We use the decomposition (the set of features from the SAE) to build a compressed model of the network's behavior. We then test this model on out-of-distribution (OOD) inputs and measure how well it predicts the network's output. We compare to a baseline that uses the full activation vector. | The decomposition will provide a compressed model that generalizes well to OOD inputs, nearly matching the full model's predictive power. This shows that the features capture the essential causal structure. | The decomposition will not generalize well to OOD inputs. The full model will outperform it significantly. This is because the features are optimized for the training distribution and are not the true causal variables. |

  Note: We conclude that the untrained-network control, as usually done, is not fully diagnostic because the activation statistics of an untrained network are different. Our proposed control includes testing interpretability and steering efficacy.

  ---

  **4. Retraction Conditions**

  Each party states under what conditions they would retract their view.

  **Realist:**
  - If in the synthetic case with illegible ground truth, the SAE pipeline fails to recover the true latent variables (as measured by, e.g., linear probing accuracy or causal intervention) and instead recovers directions that are sparse and interpretable but not aligned with the true variables, I would retract the claim that SAE recovers the true features used by the network.
  - If cross-model transplant of features consistently fails (i.e., steering using features from one network does not produce the expected change in another network of the same architecture trained on similar data) in a well-controlled experiment, I would retract the claim that the features are general and not specific to a particular network.

  **Deflationist:**
  - If in the synthetic case with illegible ground truth, the SAE pipeline reliably recovers the true latent variables (even though they are not sparse or interpretable) and this recovery is robust across hyperparameters, I would retract the claim that SAE only finds human-legible features.
  - If a compressed model based on the SAE decomposition consistently matches the full model's performance on out-of-distribution inputs (across multiple domains and network architectures), I would retract the claim that the decomposition is not capturing the true causal structure.

  These conditions are stated strongly enough that the other party would recognize them as meaningful concessions.

  ---

  **5. Closing Section**

  **Verbal vs. Substantive Disagreements:**

  - **Verbal:** Some disagreements stem from differing definitions of "representation" and "feature." The realist uses "representation" to denote a causally efficacious internal variable that carries content, while the deflationist reserves "representation" for the entire activation vector and sees "feature" as an analytical tool. This is verbal because it is a matter of terminology, but it points to a substantive issue about causal granularity.

  - **Substantive:** The core substantive disagreements are:
    1. Whether there is a privileged decomposition (sub-question A).
    2. Whether the features carry content in a non-projective way (sub-question B).
    3. Whether the features play the causal role we attribute to them (sub-question C).
    4. Whether our methods can converge to the true features (sub-question D).

  **Next Steps:**

  The collaboration commits to:
  1. Running the crux experiments as described, pre-registering the predictions and analysis plans.
  2. Adjudicating the results by comparing the outcomes to the pre-registered predictions and retraction conditions.
  3. Focusing on the synthetic case and the cross-model transplant as the most diagnostic tests.

  The pre-registered predictions will be adjudicated by:
  - Quantifying the recovery of ground truth in the synthetic case (e.g., via correlation or mutual information).
  - Measuring the success of cross-model steering (e.g., by human evaluation or a classifier for the intended attribute).
  - Testing the compressed model on OOD data (e.g., by prediction accuracy of the network's output).

  The results will be published regardless of outcome.

  ---
answer: |-
  ### Joint Statement on Representation in Trained Neural Networks  
  **Preamble: Shared Setup**  
  Both parties analyze a 1-billion-parameter *decoder-only transformer* (a neural network architecture that predicts text sequences autoregressively) trained on a mixed text corpus. We focus on the *residual stream*—a vector space carrying information between layers—at one middle layer. Using an unsupervised *dictionary-learning pipeline* (a *sparse autoencoder*, or SAE), we decompose residual-stream activations into linear components (*directions*). The SAE fits a dictionary of vectors such that activations are approximated by a sparse combination of these vectors. We jointly examine three SAE-recovered directions: (1) one correlating with the language (e.g., English vs. French) of input text, (2) one with sentiment/politeness, and (3) one with references to a specific named-entity category. Separately, we analyze a small transformer trained on a synthetic language generated by a known grammar with *latent variables* (ground-truth state variables), where "correct" representations are defined by construction.  

  ---

  ### 1. Agreed Claims  
  1. **The SAE recovers human-interpretable directions, but this does not entail they are "real."** The pipeline identifies directions correlating with labels (e.g., language ID) better than chance. However, this alone does not establish that the directions exist as causal units in the network.  
  2. **Sparsity is imposed by the method, not necessarily inherent.** The SAE’s sparsity penalty yields directions that approximate activations with few non-zero coefficients. This does not prove sparsity is a property of the network.  
  3. **The network’s causal structure is invariant under linear reparameterization.** An invertible linear map applied to the residual stream (with inverse adjustments to adjacent weights) preserves input-output behavior and causal dynamics. Thus, no linear basis is privileged by the network’s global function alone.  
  4. **Feature interpretability is contingent on human priors.** Directions are deemed interpretable when they align with concepts familiar to humans (e.g., “sentiment”). This alignment does not imply the network “intended” the alignment.  
  5. **The synthetic case clarifies methodological limits.** When latent variables are known, SAE success/failure constrains interpretability claims. Failure in this case would undermine claims that SAEs recover “true” variables.  
  6. **Interventions (e.g., activation steering) alter outputs but do not resolve realism.** Increasing a direction’s coefficient (e.g., for “politeness”) often shifts outputs coherently, but this could arise from the network’s high-dimensional dynamics rather than a discrete causal role.  
  7. **Current methods underdetermine feature uniqueness.** SAEs with different hyperparameters (e.g., sparsity penalties) yield equally sparse, interpretable decompositions. This suggests the pipeline does not converge to a unique set of directions.  
  8. **A representation claim must enable novel predictions.** To be substantive, a "real feature" claim must predict network behavior in new contexts (e.g., unseen inputs, architectural variations) better than a deflationary alternative.  
  9. **Explanatory power requires more than correlation.** A direction’s utility in explaining generalization or robustness must exceed what is achievable via the full activation vector or arbitrary linear projections.  
  10. **Not all directions are equally stable.** Some SAE directions recur across runs and generalize across inputs; others are brittle. This variability demands explanation but does not resolve realism.  

  ---

  ### 2. Disagreements Table  
  We isolate four sub-questions underlying the realism/deflationism debate. For each, we state:  
  - **Disputed Claim**: Neutral formulation.  
  - **Realist Wording**: Acceptable to the realist.  
  - **Deflationist Wording**: Acceptable to the deflationist.  
  - **Wording Difference**: Why formulations diverge.  

  | Sub-Question | Disputed Claim | Realist Wording | Deflationist Wording | Wording Difference |  
  |--------------|----------------|-----------------|----------------------|-------------------|  
  | **A. Privileged decomposition** | Whether the network’s causal structure singles out a specific basis. | "The network’s weights and training history fix a decomposition into features that are causally discrete—i.e., minimal units mediating input-output mappings—making this basis privileged over others." | "All bases are computationally equivalent; any decomposition into ‘features’ reflects analytical choices, not a causal structure beyond the full activation vector." | Realist emphasizes causal discreteness; deflationist denies any basis-level causal granularity. |  
  | **B. Content attribution** | Whether directions correspond to intentional representations. | "A direction carries content if its activation robustly correlates with an external property (e.g., sentiment) and is used by later layers to compute relevant outputs." | "Content is ascribed by interpreters; a direction’s interpretability arises from sparsity constraints and human narratives, not representational intent." | Realist ties content to causal role; deflationist sees it as projective. |  
  | **C. Causal efficacy** | Whether directions are the actual vehicles of computation. | "When steering a direction reproduces interpretable output changes, it does so because the network normally uses that direction as a causal variable." | "Steering perturbs the activation vector holistically; output changes need not imply the direction is a natural causal unit." | Realist infers normal operation from interventions; deflationist attributes changes to distributed dynamics. |  
  | **D. Method convergence** | Whether improved SAEs would reveal a unique basis. | "Better optimization/data will converge SAEs to a stable basis aligned with the network’s true features." | "SAEs will always underdetermine features; stability reflects human biases, not network structure." | Realist predicts convergence; deflationist sees persistent underdetermination. |  

  **Live Disagreements**: All four sub-questions (A–D) are contested.  

  ---

  ### 3. Crux Table  
  For each diagnostic test, we specify:  
  - **Sub-Questions**: Which disagreements it addresses.  
  - **Test/Case/Argument**: Concrete, pre-agreed procedure.  
  - **Realist Prediction**: Expected outcome under realism.  
  - **Deflationist Prediction**: Expected outcome under deflationism.  

  | Crux | Sub-Questions | Test/Case/Argument | Realist Prediction | Deflationist Prediction |  
  |------|---------------|---------------------|---------------------|--------------------------|  
  | **Change-of-basis** | A, D | Apply a random invertible linear map to the residual stream (adjusting weights to preserve functionality). Run the SAE on the reparameterized network. | SAE will recover a basis that is a linear transform of the original, preserving feature interpretability. The network’s “true” features persist in the new basis. | SAE will recover an equally valid but distinct basis. No basis is privileged; interpretability is basis-relative. |  
  | **Illegible-ground-truth control** | B, D | In the synthetic case, set latent variables to be dense, entangled, or random linear projections (illegible to humans). Train SAE; test if it recovers true variables. | SAE will recover true variables (or linear equivalents) since they are causally efficacious, regardless of human interpretability. | SAE will recover sparse, human-legible directions not aligned with true variables, demonstrating a legibility bias. |  
  | **Untrained-network control** | A, D | Apply SAE to an untrained network (same architecture). Test if directions are interpretable and causally stable via steering. | Untrained networks yield incoherent, non-generalizing directions; steering produces chaotic outputs. | Directions may be spuriously interpretable due to random correlations; steering effects will be unstable. |  
  | **Cross-model transplant** | B, C | Take a direction (e.g., sentiment) from Network 1. Use it to steer Network 2 (same arch., different data/initialization) without retraining. Test output coherence. | Steering will transfer: e.g., boosting “sentiment” in Network 2 increases positive outputs. Features capture cross-model invariants. | Steering will fail or produce incoherent changes. Features are network-specific artifacts. |  
  | **Far-transfer steering** | C | Test steering on inputs far outside the training distribution (e.g., sentiment direction applied to unrelated domains/languages). | Effects will generalize: e.g., sentiment steering shifts tone even in novel contexts. | Effects will degrade or become incoherent, revealing direction as distribution-dependent. |  
  | **OOD prediction** | A, D | Use SAE features to predict layer outputs on out-of-distribution (OOD) inputs. Compare to predictions from the full activation vector. | Sparse features will match full-vector prediction accuracy, showing they compress causal structure. | Feature-based predictions will degrade on OOD data, exposing them as distribution-tuned summaries. |  

  **Note**: Untrained-network control is imperfect; we replace it with a *steering coherence test*: if interventions on untrained SAEs yield random outputs, while trained ones do not, it supports realism.  

  ---

  ### 4. Retraction Conditions  
  **Realist**:  
  - If SAEs in the synthetic case recover human-legible directions *instead of* illegible ground-truth variables (B, D).  
  - If cross-model/far-transfer steering consistently fails to produce interpretable changes (C).  
  - If SAE-based OOD predictions are consistently worse than random projections (D).  

  **Deflationist**:  
  - If SAEs recover dense/illegible ground-truth variables in the synthetic case without sparsity penalties (B, D).  
  - If transplanted steering generalizes robustly across networks/contexts (C).  
  - If SAE features predict OOD behavior as well as the full activation vector (A, D).  

  These conditions are falsifiable: e.g., synthetic-case failure would force realist concessions; robust steering transfer would challenge deflationism.  

  ---

  ### 5. Closing Section  
  **Verbal vs. Substantive Disagreements**:  
  - **Verbal**: Disputes about “representation” and “content” arise from divergent definitions. The realist reserves these terms for causally discrete internal variables; the deflationist applies them only to the whole network. This masks agreement that the network encodes information.  
  - **Substantive**: Core disagreements are ontological (A, B) and epistemological (C, D): whether decompositional features exist as causal units and whether methods can discover them.  

  **Next Steps**:  
  - The collaboration will conduct the crux tests, pre-registering predictions.  
  - Synthetic-case outcomes will be adjudicated via mutual information with ground-truth variables.  
  - Steering success will be measured by human/AI-classifier evaluations of output coherence.  
  - OOD prediction accuracy will be quantified using mean squared error against network outputs.  

