  The professor's proposed alternatives - costly retention and control-corpus testing - present interesting challenges to standard practice. The user isn't asking for evaluation of these alternatives though; they want to understand what adopting them would commit historians to methodologically. 

  I need to reconstruct the implicit epistemology behind the standard criteria. This means examining:
  - What the method assumes about sources (layered but separable traditions)
  - How it conceptualizes bias (as detectable through deviation from expected patterns)
  - What "authenticity" means here (a property of individual units)
  - How inference works from biased testimony (via probabilistic filters)

  The key tensions I should address:
  1) The positive-verdict bias suggests the method is better at inclusion than exclusion
  2) The unit-focused approach vs the need for explanatory coherence of the whole figure
  3) Whether dissimilarity and coherence can truly coexist without circularity
  4) How plausibility criteria represent either an evolution or replacement of traditional methods

  For the proposed alternatives:
  - Costly retention would shift focus to community reception dynamics
  - Control-corpus testing would require robust comparative datasets
  Both would move away from atomistic analysis toward systemic considerations.

  The most uncertain part of my analysis is whether the standard method necessarily requires the "atomistic decomposability" assumption about sources. Some practitioners might argue their use of coherence criteria already addresses this, but I remain skeptical about how well it works in practice.

  The user's depth of understanding suggests they'll appreciate nuance about underdetermined aspects - like how different source theories could license the same procedures, or how plausibility criteria might quietly revolutionize the field while appearing continuous with tradition.
answer: |-
  Your questions cut to the methodological heart of historical Jesus studies. Let's reconstruct the implicit epistemology of the standard criteria, distinguish core assumptions from compatible theories, evaluate internal tensions, and assess the impact of proposed alternatives.

  ### Implicit Epistemology of Standard Criteria
  1.  **Source Assumption:** Traditions are layered but separable composites. Authentic units ("kernels") survive within later interpretive frameworks. Sources are divisible into independent streams (e.g., Mark, Q, Paul, John, Thomas), allowing cross-validation.
  2.  **Bias Detection/Correction:** Bias is assumed to produce *predictable patterns* (embellishment, alignment with theology/community needs). Authenticity is signaled by deviations from these patterns (dissimilarity, embarrassment). Multiple attestation mitigates individual source bias.
  3.  **Nature of Authenticity:** Authenticity is primarily a property of *individual units* (pericopae, logia). The "Historical Jesus" is the aggregate of positively verified units.
  4.  **Inference from Testimony:** Interested testimony *can* yield reliable history if subjected to skeptical filters that screen for motives of invention. A historical claim is established if it passes tests designed to detect *against-interest* reporting or resistance to obvious fabrication motives. Probability, not certainty, is the goal.

  ### Strict Presuppositions vs. Compatible/Underdetermined Elements
  *   **Strict Presuppositions:**
      *   The tradition is *atomistically decomposable*: Units can be meaningfully isolated and assessed independently.
      *   Motives for invention/transmission are identifiable and produce detectable patterns.
      *   "Dissimilarity" and "embarrassment" imply the invention motives *we* identify were operative and dominant in the early church.
      *   Multiple independent sources exist and can be identified.
  *   **Compatible/Underdetermined Elements:**
      *   **Source Theories:** The procedure works with Markan priority, Farrer-Goulder (no Q), or moderate Q hypotheses. It struggles with extreme form criticism (all units created *de novo* in communities) or radical memory theories denying separable layers.
      *   **Community Dynamics:** Compatible with both "controlled memory" models and more fluid "living tradition" models, *provided* the criteria's signals are seen as emergent patterns.
      *   **The Final Figure:** The aggregate Jesus *should* be coherent and explanatory, but this is a hoped-for result, not a methodological starting point.

  ### Internal Consistency & Plausibility Shifts
  1.  **Dissimilarity vs. Coherence Tension:**
      *   **The Problem:** Dissimilarity isolates Jesus from Judaism and early Christianity. Coherence requires connecting units to each other and explaining Christian origins. This risks circularity: the "core" defined by dissimilarity becomes the benchmark for coherence.
      *   **Partial Resolution:** Practitioners often use "secondary coherence" – coherence with a core *already established* by dissimilarity/embarrassment. However, the core defined negatively may be inherently ill-suited to explain the movement positively. The tension is fundamental and unresolved.
  2.  **Plausibility Approach:**
      *   **Refinement or Replacement?** It's a **quiet replacement**, fundamentally shifting the epistemology.
      *   **Key Change:** It abandons the negative definition. Authenticity requires *double contextual plausibility*: fitting credibly within 1st-century Galilean Judaism *and* offering a plausible explanation for the movement's emergence/development. This treats Jesus as embedded within Judaism and inherently connected to Christianity's origins.
      *   **Epistemological Shift:** It prioritizes a holistic, explanatory portrait *before* unit authentication. Unit assessment happens *within* this framework. It assumes continuity (though not identity) between Jesus and both his context and his movement, rejecting the "residue" model.

  ### Impact of Proposed New Criteria
  1.  **Costly Retention:**
      *   **Commitment:** Shifts focus to **community reception dynamics and transmission costs**. Assumes communities are strategic actors preserving only material perceived as valuable (even if problematic), not passive vessels. Privileges *difficult* traditions over merely non-fitting ones.
      *   **Changes:** Expands "embarrassment" beyond simple negativity to include material requiring significant interpretive effort/apologetic. Focuses on the *cost* of keeping a tradition as a signal of its perceived importance/irremovability (e.g., crucifixion, baptism by John, betrayal). Less useful for "neutral" sayings.
      *   **Gains:** More grounded in social memory theory; better at identifying "sticky" core events.
      *   **Losses:** Harder to apply systematically; "cost" is subjective; doesn't address material *not* perceived as costly but still authentic.
  2.  **Control-Corpus Test:**
      *   **Commitment:** Requires explicit **empirical validation of the criteria's reliability**. Assumes we can identify a reliable "test set" where we know authenticity status (e.g., John the Baptist material, post-resurrection accounts).
      *   **Changes:** Forces historians to treat criteria as hypotheses requiring falsification/testing, not axiomatic tools. Might show criteria are reliable, need refinement (e.g., dissimilarity fails on Baptist material embedded in Judaism), or are fundamentally flawed (if they "authenticate" known later creations).
      *   **Gains:** Rigor, empirical grounding, potential to calibrate criteria.
      *   **Losses:** Identifying truly reliable control corpora is extremely difficult (we rarely have "known authentic" material); risks circularity if the "control" corpus is defined using the same problematic assumptions.

  ### Abandoning Unit Criteria for Holistic Portraiture
  *   **What Changes:** The unit of analysis shifts from the individual pericope to the **coherent, explanatory portrait** (e.g., Jesus as eschatological prophet, Cynic-like sage, messianic claimant). Authentication happens at the level of the overall narrative/characterization.
  *   **What is Lost:**
      *   The ability to make **high-confidence claims about specific sayings/events** isolated from the whole.
      *   A (seemingly) objective, **mechanical procedure** for sifting traditions.
      *   Clear **mitigation strategies for source bias** at the micro-level.
  *   **What is Gained (Potentially):**
      *   Avoidance of the **dissimilarity dead-end** and the atomization problem.
      *   A Jesus **firmly embedded in context** (Judaism) and inherently **connected to outcomes** (Christianity).
      *   Better alignment with **how memory and tradition actually work** (remembering gists/impressions, not atomized units).
      *   A more **historically plausible figure** who can actually explain Christian origins.

  ### Confidence & Uncertainty in this Reconstruction
  *   **Overall Confidence: High.** This reconstruction aligns with mainstream methodological discussions (Sanders, Dunn, Allison, Schröter, Keith, Le Donne) and critical analyses of the criteria's logic.
  *   **Least Sure Move:** The characterization of the **plausibility approach as a "quiet replacement"** rather than a refinement. Some proponents (e.g., Gerd Theissen, Dale Allison) see it as integrating the valid insights of older criteria within a more holistic frame. Others (e.g., Chris Keith) see it as a more fundamental shift. The *extent* of the epistemological break is debated, though the *direction* (towards context and explanation) is clear.
  *   **Contested Point:** Whether **atomistic decomposability** is a *strict* presupposition or merely the *practical mode of operation*. Defenders might argue coherence checks provide a holistic counterbalance, but critics (like your professor) argue the unit-by-unit application remains foundational and fatally undermines the goal of understanding the historical figure.

  **In essence:** The standard criteria assume history can be extracted like kernels from husks via bias-detecting filters. This requires atomization and risks a decontextualized Jesus. Plausibility criteria and holistic approaches embed Jesus in context and consequence from the start, making authenticity a property of the coherent, explanatory portrait. Costly retention focuses on transmission sociology, while control-corpus testing demands empirical validation. Shifting the unit of analysis sacrifices micro-claims for macro-plausibility. The core tension between dissimilarity and coherence remains the Achilles' heel of the traditional approach.
