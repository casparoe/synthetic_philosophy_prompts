prompt: |-
  I co-teach an undergraduate seminar on virtue ethics, and this term we spent two sessions on the situationist critique — the family of arguments, built on the obedience experiments, the bystander studies, the seminary-student-in-a-hurry study, the dime-left-in-a-phone-booth study and their successors, which conclude that ordinary people lack the robust, cross-situationally stable character traits that virtue ethics needs. The students left with the impression that this is one blanket result that hits every virtue equally hard, and I think that is wrong, but I have not found a way to make the difference precise. So I want numbers, not discussion.

  Below is a list of traits. For each, give me a score from 0 to 100 — call it a robustness score — meaning: taking the critique's empirical claims entirely at face value, and bracketing both the reply that appeals to practical wisdom and the reply that simply redefines the trait as a narrow, local one, how much confidence should a virtue ethicist retain that a typical adult in a contemporary society possesses this trait as a genuinely cross-situationally stable disposition? Then sort the traits into three or four tiers, and give one sentence per trait naming what drives its placement. I have two candidate explanations for why the scores should differ, and I would like you to use them as the spine of the ranking unless you think one of them is backwards, in which case say so and rank on better grounds: (1) opportunity density — a trait should be more stable across a life the more often, and the more variously, ordinary circumstances present occasions to exercise it, since frequent and varied practice is what consolidates anything into a disposition; (2) cue-concordance — a trait should be more stable when the situational cue that prompts it is reliably present on exactly the occasions when the trait is called for, as opposed to traits whose eliciting cue and whose occasion of application come apart.

  The traits: truthfulness in speech; compassionate helping of a stranger in visible distress; physical courage under threat of harm; fidelity to costly promises; gratitude; humility about one's own accomplishments; temperance with everyday pleasures; fairness in dividing resources with strangers; loyalty to a friend when the association is costly; playful ease in conversation (the trait Aristotle discusses under the heading of wittiness); and punctuality, which is deliberately not on the classical list of virtues. Two further constraints. First, if you are tempted to give some trait a high score for a reason that should embarrass a virtue ethicist — because it is a social script or an unthinking habit rather than a disposition the agent has made her own — flag that explicitly instead of quietly awarding the points. Second, tell me honestly whether the finished ranking is measuring which traits are robust or merely which traits psychologists happened to run experiments on, and if there is a way to tell those two hypotheses apart, say what it is. I will put the tier list on the handout, so the one-sentence justifications matter as much as the numbers.
reasoning: |-
  Okay, let me approach this request systematically. The professor wants quantitative robustness scores for 11 virtues based solely on situationist critique evidence, without considering common virtue ethics defenses. They've proposed two explanatory frameworks - opportunity density and cue-concordance - and want tiered rankings with clear justifications.

  First I need to interpret the two key concepts:
  - Opportunity density refers to how frequently and diversely a virtue gets practiced in daily life. Higher frequency/variety should theoretically strengthen the disposition.
  - Cue-concordance examines alignment between situational triggers and appropriate application moments. Better alignment should increase stability.

  The professor specifically wants to exclude the "practical wisdom" defense and avoid redefining virtues as local traits. They're also concerned about conflating genuine dispositions with unthinking habits, and want acknowledgment if experimental bias affects scores.

  Looking at the traits:
  Truthfulness, punctuality and playful conversation seem high in opportunity density - we constantly face truth-telling moments, scheduling demands, and social interactions. But for cue-concordance, truthfulness might suffer when social cues pressure deception, while punctuality's cues are usually well-aligned.

  Compassion, courage and gratitude present different challenges. Compassion has moderate opportunity density (we occasionally see distress) but poor cue-concordance due to bystander effect. Physical courage has extremely low opportunity density for most people. Gratitude has high opportunity density but depends heavily on social cues.

  For experimental bias concerns: Many classic studies target compassion (bystander effect), fairness (dictator games), and helping behaviors. Traits like loyalty, humility and temperance have less direct experimentation. This means scores for less-studied virtues may overestimate robustness since absence of disproof isn't proof.

  Special considerations:
  - Punctuality: Must flag if scoring high due to habit rather than virtue
  - Playfulness: Aristotle's virtue of wittiness might be conflated with social anxiety
  - Temperance: Everyday pleasures offer high practice frequency but strong situational triggers

  I'll need to carefully distinguish:
  - High scores from habitual compliance vs true disposition
  - Experimental coverage gaps vs actual robustness
  - Cases where opportunity and cue alignment diverge

  The professor's handout will use this tier system, so justifications must be precise and empirically grounded within the critique's framework. Any score influenced by habit rather than virtue will be explicitly noted.
answer: |-
  Based on your constraints (accepting situationist evidence at face value, bracketing standard virtue ethics replies, and using opportunity density & cue-concordance as the primary drivers), here is the tiered ranking with robustness scores and concise justifications. Scores reflect estimated confidence (0-100) in the cross-situational stability of the disposition in a typical adult.

  **Tier 1: Highest Retained Confidence (Scores 55-65)**
  *   **Punctuality (65):** *Highest opportunity density (daily, varied scheduling demands) and strong cue-concordance (time/deadline cues reliably signal need).* (FLAG: High score likely reflects ingrained habit/social script, not necessarily deep virtue.)
  *   **Truthfulness in speech (60):** *Very high opportunity density (constant communication) and moderate cue-concordance (questioning/truth-claim cues are frequent, though social pressure cues often conflict).*
  *   **Playful ease in conversation / Wittiness (55):** *High opportunity density (frequent social interactions) and moderate cue-concordance (social context cues generally signal appropriateness, though anxiety/status cues can interfere).*

  **Tier 2: Moderate Retained Confidence (Scores 35-45)**
  *   **Temperance with everyday pleasures (45):** *High opportunity density (constant exposure to food/drink/media) but LOW cue-concordance (cues for availability/pleasure strongly conflict with cues for moderation needs).*
  *   **Gratitude (40):** *Moderate opportunity density (receiving favors/benefits) but LOW cue-concordance (benefit cues don't reliably trigger gratitude expression; self-focus/entitlement cues often override).*
  *   **Fairness in dividing resources with strangers (35):** *Moderate opportunity density (various allocation tasks) but VERY LOW cue-concordance (self-interest cues, anonymity, perceived norms powerfully conflict with fairness cues in experimental paradigms).*

  **Tier 3: Low Retained Confidence (Scores 20-30)**
  *   **Compassionate helping of a stranger in visible distress (30):** *LOW opportunity density (infrequent encounters) and VERY LOW cue-concordance (bystander effect, ambiguity, time pressure, cost cues catastrophically override distress cues).*
  *   **Loyalty to a friend when costly (25):** *LOW opportunity density (rare high-cost demands) and LOW cue-concordance (immediate cost/self-interest/pressure cues strongly conflict with loyalty cues, especially without direct social observation).*
  *   **Fidelity to costly promises (25):** *LOW opportunity density (infrequent high-cost promises) and LOW cue-concordance (delayed cost/self-interest/convenience cues often overwhelm the initial promise cue over time).*
  *   **Humility about one's own accomplishments (20):** *Moderate opportunity density (achievements occur) but EXTREMELY LOW cue-concordance (self-enhancement biases, social reward cues for self-promotion powerfully conflict with cues for humility; no clear situational trigger for it).*

  **Tier 4: Lowest Retained Confidence (Score 10)**
  *   **Physical courage under threat of harm (10):** *EXTREMELY LOW opportunity density (rare genuine physical threats for most) and LOW cue-concordance (overpowering fear/self-preservation cues directly conflict with threat cues signaling need for courage; flight instinct is primal).*

  **Explanation of Drivers & Ranking Spine:**
  The ranking primarily follows your two proposed drivers:
  1.  **Opportunity Density:** Traits practiced frequently and in varied contexts (Punctuality, Truthfulness, Temperance, Playfulness) generally score higher than those triggered rarely (Courage, Costly Loyalty, Costly Fidelity). High density provides more "practice" opportunities.
  2.  **Cue-Concordance:** This proved crucial. Traits score lower where the situational cue *eliciting the behavior* is weak, ambiguous, or, most importantly, *directly conflicts* with powerful cues pushing against the virtue (Compassion vs. bystander/ambiguity cues, Fairness vs. self-interest cues, Humility vs. self-enhancement cues, Temperance vs. pleasure cues). High concordance (like Punctuality's time cues) supports stability; low concordance undermines it.

  **Addressing Constraints:**
  1.  **Habit vs. Virtue:** Punctuality's high score is explicitly flagged as likely reflecting habit/social scripting rather than deep virtue. Temperance and Truthfulness might also have some habitual component boosting their scores within this constrained analysis.
  2.  **Robustness vs. Experimental Focus:** **The ranking is likely measuring a combination of both.** Traits heavily targeted by classic situationist experiments (Compassion, Helping, Obedience - related to Loyalty/Fidelity under pressure, Fairness) are clustered in the lower tiers, consistent with the strong empirical attacks. Traits less directly probed by these *specific* experiments (Punctuality, Wittiness, Gratitude, Humility, Temperance in non-extreme forms) occupy higher tiers. **There is no definitive way to separate these hypotheses within your constraints** (accepting the critique's evidence at face value, bracketing philosophical replies). The critique's empirical base focuses disproportionately on prosocial behavior (helping, harming, dividing) under pressure or in ambiguity – the lower-tier traits. We lack equally famous, damning experiments showing massive cross-situational inconsistency in, say, habitual punctuality or everyday truth-telling about minor matters. This *could* mean these traits are genuinely more robust *or* simply that they haven't been tested as severely in ways designed to reveal instability. The drivers (density, concordance) provide a plausible theoretical reason *why* they *might* be more robust, but the experimental bias remains a significant confound.

  **Conclusion:** This tier list reflects the *relative vulnerability* of the listed virtues to the situationist critique based on the frequency of practice opportunities and the alignment (or fierce misalignment) of situational cues, while acknowledging that the critique's experimental focus creates ambiguity for traits less directly targeted. The scores represent the residual confidence a virtue ethicist could have in cross-situational stability *if* they accepted the situationist empirical claims wholesale and ignored their standard defenses. Punctuality stands out as high-scoring but habit-driven under this analysis. Physical courage and humility score lowest due to rare practice and powerful countervailing cues.
