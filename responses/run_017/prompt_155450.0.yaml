prompt: |-
  I chair the compensation and recognition committee at a 450-person health system. Four times a year we make roughly forty separate allocation decisions: individual bonuses drawn from a pool whose total the board fixes in advance, promotions onto two higher grade levels with a capped number of slots, and a public quarterly award for living the organisation's values, announced to everyone. The committee is five people — me, two clinical directors, an HR partner, and a rotating staff representative — none with any training in philosophy, and every decision has to be defensible in a one-paragraph written statement addressed to the person who did not get it, because our union agreement gives them a right to appeal. I have about twenty minutes per case and two hours of committee time per cycle, so whatever I adopt has to be runnable by non-specialists, on a form, without supervision.

  What I need is a written decision procedure, not a discussion of the theory. For any given candidate and any given allocation, it should determine how far that allocation should track what the person actually deserves, as distinct from three things I keep watching get conflated with it: what the person is entitled to under our existing rules (the bonus plan says the top-rated person takes the top band, whether or not they deserve it); what would produce good work next quarter; and what it would be fitting or gracious for the organisation to say about them in public. Where one of those three legitimately overrides desert, the procedure should say so explicitly and record that it did.

  The procedure has to handle, at minimum: the way credit for a good outcome drains away once you notice how much of it traces to circumstance rather than choice — and the fact that pushing that inquiry far enough dissolves effort itself, so I want a stated stopping rule rather than an infinite regress, recorded as a stipulation and not as a discovery; the fact that a claim of the form "she deserves it" seems incomplete until you write in whom she is being compared to and against which baseline, since the same person can deserve the slot relative to the requirements of the role and not relative to peers who started from less; the possibility that our inputs — performance ratings, credentials, who got the good project, who was mentored, who was allowed to fail safely — are themselves the residue of earlier allocations this same organisation made, so that we would be laundering our own past decisions into present desert; the fact that desert may support only a rough tiering and not a total ordering, so I want a rule against manufacturing a ranking where the material supports a tie; the requirement that the justification be stateable to the loser without asserting anything about their character or about the deep causes of their effort; the expressive cost of publicly attributing someone's success to advantage or luck even when the allocation is unchanged; whether a bad quarter generates a claim to less than the standard increment or merely the absence of a claim to more, and why the difference matters; and whether a desert claim can be discharged or stale once it has already been recognised, so that honouring the same act twice is not double-counting. It must also be able to say that a case is not a desert question at all and hand it upward as a structural one — about pay bands, slot caps, or how work gets assigned. Every handoff should name who signs off: me, the HR partner for anything with legal exposure, or the board where the fix is structural.

  Please work it through on three of our cases. First: two engineers in the same grade. Priya was handed the payments platform in January by her director and by September it is the fastest-growing line in the department, and her numbers are the best in it. Marcus spent the year keeping the legacy scheduling system alive — no visible wins, but three migrations that would have gone badly if he had not caught what he caught. Both are rated the same on paper; there is one top bonus in the group. Second: two analysts of comparable talent; one put in roughly seventy-hour weeks for two quarters and produced the model that fixed our staffing forecast, the other, with two small children and the caring duties that go with them, worked standard hours and produced good but unspectacular work. Rewarding the first is what the desert reasoning seems to point to, but the hours were available to her as a matter of circumstance, rewarding them sets an incentive the organisation does not want, and we cannot say any of this to her in public. Third: a nurse manager of twenty-two years who held a failing unit together through a genuinely bad year, now performing adequately but not exceptionally while managing a chronic illness; the committee wants to give her the public values award. I expect to dislike whatever the procedure says about the third case. Give it anyway, and tell me which of the three answers the committee will find unwelcome and why it is still the right one.

  Assume nothing about what I have read. Define any term you use in ordinary language, and please give no citations, references or suggested reading — I have no way to follow them up.

  Structure the response in these sections, in this order:

  - Summary — about 100 words: the procedure compressed into one paragraph, plus one sentence on what it deliberately refuses to decide.
  - The distinctions that have to survive — about 200 words: the minimum set of contrasts a committee member must be able to hold, each defined in plain words of one sentence.
  - The procedure — about 700 words: the ordered questions, what counts as a sufficient answer to each, where it terminates with a no, where it hands the decision to a named person, and the stipulations that must be written down so that next cycle is consistent with this one. Close this section with a one-page version laid out as lines on a form that the HR partner could drop into our workflow.
  - Three worked applications — about 700 words: the cases above, run in order, with the form filled in for each.
  - Where it misfires — about 300 words: the failure modes, the points where judgment is dressed up as procedure, and the questions the procedure cannot settle at case level at all.
reasoning: |-
  Hmm, the user chairs a compensation committee at a health system and needs a practical decision procedure for allocating bonuses and promotions. They've outlined several complex philosophical issues they face - disentangling desert from entitlement, incentives, and public recognition; dealing with circumstantial factors; avoiding infinite regress; handling structural vs individual decisions; and more. They want a concrete tool, not theory, that non-specialists can implement within strict time constraints.

  Key requirements include: preventing conflation of desert with other considerations, establishing stopping rules for credit attribution, clarifying comparison baselines, acknowledging how organizational inputs affect outcomes, allowing tiering instead of forced rankings, avoiding character judgments in justifications, handling stale claims, and properly routing structural issues. The procedure must produce defensible one-paragraph explanations for appeals.

  For the test cases: Priya vs Marcus (performance with unequal opportunity), overworking analyst vs parent analyst (effort vs circumstance), and long-serving nurse manager (tenure vs current performance). The user anticipates disliking one outcome but wants it anyway.

  I'll develop a phased procedure that starts by screening for structural issues before assessing desert. Core mechanisms include: "credit windows" that limit how far back we look, "comparison frames" that specify the relevant peer group, and "stipulated breaks" that artificially halt circumstantial analysis to prevent regress. The desert assessment will separate actual contribution from circumstantial advantages using a fixed-point rule.

  For implementation: I'll create a form-based workflow with checkboxes and fillable fields. The form will document when desert is overridden by policy or incentives, and will include mandatory fields for the stipulations that maintain consistency across cycles. Justifications will focus on observable work outputs, not personal attributes.

  The user's underlying concerns seem to be: avoiding unfairness masked as meritocracy, preventing burnout culture through incentive design, and maintaining union relations with transparent appeals. There's also clear frustration with philosophical complexity slowing down practical decisions - hence the demand for a "runnable" tool.
answer: |-
  ## Compensation Allocation Procedure: Desert-Based Decision Framework

  **Summary**  
  This procedure determines allocations based on *desert* (what the person fairly earned through controllable actions) by separating it from entitlement (rules-based claims), incentives (future impact), and expressive value (public messaging). It begins by identifying structural issues requiring escalation, then assesses desert through a fixed "credit window" of observable contributions within defined comparison frames. Key stipulations prevent infinite regression (circumstance tracing stops at agreed points), mandate tiering where distinctions are unclear, and prohibit character judgments. Desert may be overridden by entitlement rules or strong incentive concerns, but this must be explicitly recorded. The procedure deliberately refuses to define "deep" desert beyond the stipulated credit window or resolve societal inequities; it operates within the organization's practical constraints. **(98 words)**

  **The Distinctions That Must Survive**  
  1.  **Desert vs. Entitlement:** Desert is what someone *fairly earned* through their controllable choices and effort; Entitlement is what the *existing written rules* (bonus plans, promotion criteria) guarantee them regardless of desert.
  2.  **Desert vs. Incentive:** Desert looks backward at *past contributions* fairly earned; Incentive looks forward at *encouraging future behavior* beneficial to the organization.
  3.  **Desert vs. Expressive Value:** Desert concerns the *fairness of the reward*; Expressive Value concerns the *public message sent* by the reward or its justification.
  4.  **Controllable Contribution vs. Circumstance:** Controllable Contribution is effort, skill application, or choices *within the person's power*; Circumstance is luck, inherited advantage, assignment quality, or systemic factors *outside their control*.
  5.  **Individual Desert vs. Structural Issue:** Individual Desert concerns *this person's fair reward*; Structural Issues concern *rules, resource allocation, or system design* needing broader fixes.
  6.  **Tiering vs. Total Ordering:** Tiering groups people as *equally deserving* based on indistinct differences; Total Ordering forces a *strict rank* even where genuine distinctions are fuzzy or absent.
  7.  **Active Desert Claim vs. Stale Claim:** An Active Desert Claim arises from *recent, unrewarded contributions*; a Stale Claim arises from contributions *already recognized* or too distant under the credit window. **(199 words)**

  **The Procedure**  
  *(Run sequentially for each candidate/allocation type. Record answers on the form.)*

  1.  **Is this a Structural Issue?** *Ask: Does this decision hinge primarily on the design of pay bands, slot caps, or how work/resources are assigned, rather than this individual's desert?*
      *   **Yes:** Hand off to named authority (HR Partner for pay band/legal, Board for slot cap/resource allocation). STOP. Record reason for handoff.
      *   **No:** Proceed.

  2.  **Does Entitlement Override Desert?** *Ask: Do the existing written rules (bonus plan, promotion criteria) dictate the outcome for this candidate/allocation, regardless of desert?*
      *   **Yes:** Apply the rule. Record "Entitlement Rule [Cite Rule] applied. Desert assessment not determinative." STOP for this candidate/allocation.
      *   **No:** Proceed.

  3.  **Define the Comparison Frame & Credit Window:**
      *   *Comparison Frame:* Stipulate the relevant peer group (e.g., "same grade," "same project team," "all analysts") and baseline expectation (e.g., "met core role requirements," "exceeded prior year performance").
      *   *Credit Window:* Stipulate the time period for assessing contributions (e.g., "last 12 months," "current project duration"). *Record both Frame and Window on the form.*

  4.  **Assess Desert within Frame/Window:**
      *   *Identify Observable Contributions:* List key outputs, results, problem-solving, or effort *within the Credit Window* relevant to the allocation (bonus, promotion, award).
      *   *Apply Stipulated Break:* For each contribution, trace its causal chain *only one step back* from the person's direct action/choice. Stop. *Stipulate: "Credit assigned for [Action/Output]. Circumstances enabling this (e.g., project assignment, prior training, luck) noted but not discounted for desert assessment per Stipulated Break."* (This halts infinite regress).
      *   *Tier, Don't Rank:* Judge if the candidate's contributions place them in a High, Medium, or Low desert tier *relative to the Comparison Frame*. If distinctions between candidates are unclear or minor within a tier, record "Tie" for that tier. *Stipulate: "Total ordering manufactured only if clear, significant desert distinctions exist between candidates within tier."*

  5.  **Is Active Desert Clear?** *Ask: Does the assessment reveal a strong, unrewarded claim within the Credit Window?*
      *   **Weak/No Claim:** Candidate does not deserve *this specific allocation* (e.g., promotion slot, top bonus) based on recent contributions. May deserve standard increment or nothing. Record "No strong active desert claim identified for [Allocation]." Proceed to Step 7 for other considerations if applicable.
      *   **Strong Claim:** Proceed.

  6.  **Do Incentive or Expressive Concerns Override?** *Ask:*
      *   *Incentive:* Would rewarding desert here strongly incentivize *undesirable behavior* (e.g., unsustainable hours, neglecting core duties) or *demotivate others* significantly?
      *   *Expressive:* Would the *public statement* justifying based on desert unavoidably send a damaging message (e.g., praising overwork, ignoring disadvantage) that harms culture more than the reward helps?
      *   **Yes (Clear and Significant):** Override desert. Record "[Allocation] awarded/denied. Incentive/Expressive concern [State specific concern] overrode desert claim." STOP.
      *   **No/Unclear:** Desert prevails. Award based on desert tier/ranking. Proceed to justification.

  7.  **Craft Public Justification (If Awarded):**
      *   Focus *only* on observable contributions/outputs within Credit Window.
      *   *Strictly Avoid:* Character judgments ("dedicated", "talented"), deep causes of effort ("passion", "drive"), or references to circumstance/luck ("despite challenges", "given the opportunity").
      *   *Template:* "[Person] is recognized for [Specific, observable contribution/output] delivered within [Timeframe], which significantly impacted [Relevant outcome/area]." (For denial: Focus on why the contributions didn't meet the threshold for *this specific allocation* relative to the frame, without comparison to winner).

  **ONE-PAGE FORM (Per Candidate/Allocation)**

  *   **Candidate:** _________________________ **Allocation Type:** [ ] Bonus [ ] Promotion (Grade: ___) [ ] Values Award
  *   **Date:** _________ **Cycle:** _________ **Committee Member:** _________
  *   1.  **Structural Issue?** [ ] Yes (Hand off to: [ ] HR [ ] Board. Reason: _________________________) [ ] No
  *   2.  **Entitlement Override?** [ ] Yes (Rule: _________________________. Record: "Entitlement applied.") [ ] No
  *   3.  **Stipulations:**
      *   Comparison Frame: _________________________ (e.g., Grade 5 Analysts meeting core goals)
      *   Credit Window: _________________________ (e.g., Jan 202X - Dec 202X)
      *   Stipulated Break Applied: "Credit assigned for direct actions/outputs; circumstances enabling them noted but not discounted."
  *   4.  **Desert Assessment:**
      *   Key Contributions (Within Window): _________________________________________________________
      *   Desert Tier vs. Frame: [ ] High [ ] Medium [ ] Low
      *   Tie with Peers? [ ] Yes (Specify peers: ________) [ ] No
  *   5.  **Strong Active Desert Claim?** [ ] Yes [ ] No (Record: "No strong active desert claim.")
  *   6.  **Override by Incentive/Expressive?**
      *   Incentive Concern: [ ] Significant [ ] Minor/None. Detail: _________________________________________________________
      *   Expressive Concern: [ ] Significant [ ] Minor/None. Detail: _________________________________________________________
      *   Override Desert? [ ] Yes (Record: "[Allocation] awarded/denied. [Incentive/Expressive] concern overrode: [Detail].") [ ] No
  *   7.  **Decision:** [ ] Award [ ] Deny
  *   8.  **Public Justification Draft (Focus ONLY on observable contributions/outputs):** __________________________________________________________________________________________
  *   **Final Sign-off:** [ ] Committee Chair [ ] HR Partner (If legal/entitlement) [ ] Board (If structural)

  **Three Worked Applications**

  1.  **Priya vs. Marcus (Top Bonus)**
      *   **Form:**
          *   Candidate: Priya / Marcus (Run separately, compare results)
          *   Allocation: Top Bonus
          *   1: Structural? No.
          *   2: Entitlement? Rules say "top-rated" gets top band. Both rated same. Entitlement doesn't dictate *which* same-rated person. No Override. Proceed.
          *   3: Stipulations: Frame: Engineers in same grade, core role = maintain/improve systems. Window: Last 12 months. Stipulated Break: Credit for outputs; circumstances noted.
          *   4: Desert: *Priya:* Contributions: Drove payments platform to become fastest-growing line, best numbers. Tier: High. *Marcus:* Contributions: Prevented 3 critical migrations from failing via proactive catches. Tier: High. Tie? YES (Both High Tier, core role met/exceeded in different, valuable ways. Distinctions minor/fuzzy). Record Tie.
          *   5: Both have Strong Active Claims.
          *   6: Override? Incentive: Rewarding Priya might incentivize chasing growth; rewarding Marcus might incentivize vital unseen work. Both valid, no strong negative. Expressive: No major concern. No Override.
          *   **Decision:** TIE. Cannot manufacture ranking. Cannot award top bonus due to tie. (Standard bonus applies). Committee may need to revisit slot rules (Structural handoff to Board?).
          *   **Justification (Denial - both):** "The top bonus requires a single standout recipient based on exceptional contributions this year relative to peers. Both Priya's significant growth of the payments platform and Marcus's critical interventions preventing migration failures represent exceptional contributions meeting the criteria. As both achievements are of comparable exceptional standing, a tie exists per procedure." *(Note: This forces a structural review of the "one top bonus" rule when ties are possible).*

  2.  **Analyst 1 (Long Hours) vs. Analyst 2 (Parent)**
      *   **Form (Analyst 1 - Long Hours):**
          *   Allocation: Bonus/Promotion consideration.
          *   1: Structural? No.
          *   2: Entitlement? No specific rule override.
          *   3: Frame: Same grade analysts, core+ goals. Window: Last 2 quarters.
          *   4: Contributions: Developed model fixing staffing forecast. Tier: High (if model impact is significant). Tie? Likely not with Analyst 2 based on output *alone*.
          *   5: Strong Active Claim? YES (for a high reward).
          *   6: **Override?** Incentive: Rewarding the *output* (the model) is good. BUT, rewarding the *means* (70hr weeks) strongly incentivizes unsustainable/unhealthy behavior the organization does not want. SIGNIFICANT INCENTIVE CONCERN. Override Desert? **YES.** Record: "Bonus/Promotion considered. Incentive concern (rewarding unsustainable work hours as path to high output) overrode desert claim based on model impact."
          *   Decision: Award standard bonus/increment based on good output, deny *exceptional* reward tied to the model/hours.
          *   Justification: "Recognized for delivering a valuable staffing forecast model during [Period]. Contribution aligns with expectations for the role." (Avoids mentioning hours or labeling it "exceptional" for promotion/top bonus).
      *   **Analyst 2 (Parent):** Standard assessment, likely Medium/High tier depending on "good" work, no override. Award standard bonus/increment.
      *   **Outcome:** Analyst 1 gets standard reward for output, not exceptional reward. Desert is overridden explicitly due to incentive risk. Expressive concern is avoided by keeping justification focused on the output, not the hours.

  3.  **Nurse Manager (Values Award)**
      *   **Form:**
          *   Allocation: Public Values Award.
          *   1: Structural? No.
          *   2: Entitlement? Values award criteria usually involve exemplifying values. Need to check specifics, but likely discretionary. Proceed assuming no hard rule.
          *   3: Frame: All managers. Core = living values + managing unit adequately. Window: **Stipulate: Last 12 months** (Critical - prevents relying solely on tenure).
          *   4: Contributions: Held failing unit together through bad year (past Window?), now performing adequately. *Current* contributions: Managing adequately while ill. Tier: **Medium** (Adequate = meets core, not exceptional). 22-year history: **Stale Claim** - previously recognized via pay, tenure, past awards. Not active within Window.
          *   5: **Strong Active Desert Claim?** NO. Current contributions (adequate management under illness) meet core expectations but do not establish a *strong, exceptional* claim relative to peers for a *public award* based purely on desert within the Window. The past heroism is outside the Credit Window.
          *   **Decision:** Do not award **based on desert assessment.** (Committee dislikes this).
          *   **Why it's the Right Answer (though unwelcome):** The procedure forces focus on *recent, unrewarded* contributions tied to the award's purpose. Awarding primarily for past heroism (outside Window) or tenure violates the "Active Claim" and "Stipulated Window" rules, launders past recognition, and weakens the award's meaning for current exemplars. Expressive value ("we care about long servers/illness") is high, but it overrides desert *without justification* if awarded. The procedure exposes this.
      *   **Alternative Paths:** The Committee has options, but must record the override:
          *   **Option A (Deny):** Justification: "The Values Award recognizes exceptional demonstration of our values within the past year. While [Name]'s long service and past dedication are valued, contributions within the award period met core expectations but did not reach the exceptional threshold required."
          *   **Option B (Override & Award):** At Step 6: "Expressive Concern: Not recognizing long service and dedication through hardship would send a damaging message about organizational loyalty/support." Override? YES. Record: "Values Award granted. Expressive Value concern (recognizing dedication through long service and health challenge) overrode desert assessment based on current contributions." Justification: "Awarded for sustained dedication to our values and steadfast leadership, particularly through challenging periods, embodying the spirit of the award." (Focuses on expressive value, avoids false desert claim about current year).

  **Where It Misfires**

  1.  **Judgment in Disguise:** Defining the "Comparison Frame," "Credit Window," and "Stipulated Break" involves significant judgment masked as stipulation. The HR Partner/Chair must enforce consistency cycle-to-cycle.
  2.  **Stipulated Break Arbitrariness:** Stopping the circumstance trace after one step is practical but artificial. It risks unfairness in cases of extreme, obvious advantage/disadvantage immediately enabling the action (e.g., inheriting a near-complete project vs. a failing one).
  3.  **Tiering Ambiguity:** Deciding what constitutes a "minor/fuzzy" distinction justifying a tie within a tier is inherently subjective, despite the rule against manufacturing ranks.
  4.  **Incentive/Expressive Override Threshold:** Judging whether an incentive or expressive concern is "clear and significant" enough to override desert is highly contextual and subjective.
  5.  **"Observable Contributions" Blindspot:** Truly vital "keeping the lights on" work (like Marcus's) is hard to observe/quantify compared to visible wins (like Priya's), risking systematic under-assessment.
  6.  **Cannot Fix Structural Issues:** It identifies structural problems (like the bonus tie) but cannot solve them; it relies on effective handoffs to HR/Board who may not act.
  7.  **Deep Inequity Laundering:** By stipulating breaks and windows, it accepts the current distribution of opportunities (projects, mentorship) as a baseline, potentially "laundering" past inequities into present "desert."
  8.  **Emotional Toll:** The cold, procedural denial in cases like the Nurse Manager, while logically defensible, may feel heartless and damage morale if not managed with separate, genuine appreciation for tenure/loyalty outside the formal allocation process. The procedure doesn't handle this human need. **(299 words)**
