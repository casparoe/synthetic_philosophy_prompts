answer: |-
  ### Research Proposal: The Causal Architecture of Omission  

  **Core Question:**  
  *Can we identify a purely descriptive baseline for causal claims about omission that does not rely on normative assumptions?*  

  **Why This Matters Now:**  
  Legal, journalistic, and policy discourse increasingly relies on causal attribution of harm to inaction (e.g., "State inaction caused famine"; "Their silence enabled abuse"). Yet such claims trigger disputes over whether omissions *cause* outcomes or merely assign blame. Resolving this isn’t pedantic—it shapes accountability in headlines, courtrooms, and climate negotiations.  

  **Why Existing Frameworks Fail:**  
  1. **"Omissions Are Causes" (e.g., counterfactual theories):** Assumes a neutral baseline (e.g., "what would normally happen"). But for omissions, "normal" often smuggles in *oughts* (e.g., "a decent person would have acted").  
  2. **"Omissions Are Never Causes" (e.g., absences as non-events):** Dismisses intuitive cases (e.g., a nurse withholding scheduled medicine) by reducing all omissions to non-existence. Ignores why we *experience* some inactions as causal forces.  
  3. **Pluralism ("Sometimes causes, context-dependent"):** Evades the core problem: *What fixes the baseline?* Without this, causal claims float on unstated norms.  

  **The Hypothesis:**  
  **Omissions are not a single category.** Their causal structure varies across three types, each invoking distinct baselines:  
  - **Type 1: Withheld Action** (e.g., nurse canceling a scheduled dose).  
    *Baseline:* The agent's *own prior commitment*. (Descriptive? The plan existed.)  
  - **Type 2: Unrealized Option** (e.g., passer-by ignoring a drowning child).  
    *Baseline:* *What was feasible* for that agent. (Descriptive? Capability thresholds are measurable.)  
  - **Type 3: Systemic Gap** (e.g., no policy to distribute flood aid).  
    *Baseline:* *Institutional expectations* (e.g., standard protocols). (Descriptive? Role-defined duties exist.)  

  **The Normative Trap:**  
  When we say "Flood caused deaths," we contrast reality with a *non-intervention* baseline ("no flood"). But for "Agency’s inaction caused deaths," we contrast reality with an *intervention* baseline ("if they acted"). That intervention baseline is unstable:  
  - Is it *what they promised*? (Type 1)  
  - *What they could physically do*? (Type 2)  
  - *What their role demands*? (Type 3)  
  **The critical unknown:** *Can any baseline here be value-free?*  

  **Methodology: Testing Baselines in Practice**  
  Over 9 months, I will conduct structured interviews (~30) with:  
  - **Journalists/Editors:** How they justify phrases like "failure to act caused X" for curated cases (e.g., a withheld veto vs. an unseen disaster).  
  - **Judges/Lawyers:** How courts validate/deny causal claims of omission in torts or public law.  
  - **Climate Policy Experts:** How they attribute harm to state inaction.  

  **Why This Beats Alternatives:**  
  - **Armchair Philosophy:** Treats omission as monolithic. Interviews expose *which baseline practitioners actually use* for each type.  
  - **Existing Judgment Studies:** Focus on "cause" vs. "enable" broadly. This targets *omission specifically* and maps baseline variation to Type 1/2/3.  

  **Deliverable:**  
  A **decision framework for causal claims of omission**:  
  1. **Classify the omission** (Withheld Action / Unrealized Option / Systemic Gap).  
  2. **Identify the implied baseline** (e.g., "Was the agent scheduled to act?" → Type 1).  
  3. **Flag normative anchors** (e.g., "Could they act?" → Type 2 requires defining "ability," which may import values).  
  *(Output: A flowchart for editors/judges to audit their own language.)*  

  **Failure Conditions:** The project fails if:  
  - The three types collapse into existing categories (e.g., Type 1 = "duty," Type 2 = "opportunity").  
  - Baselines remain irreducibly normative (no descriptive anchor exists).  

  **Concessions from "Omissions Aren’t Causes" Defenders:**  
  - **They’d concede:** Type 1 omissions (withheld actions) *feel* causal because they mirror actions (a decision not to inject medicine resembles injecting poison).  
  - **They’d dismiss:** Type 2/3 as "responsibility myths" (e.g., "Not saving a child isn’t *causing* death—it’s not being a hero"). Their weak spot: Explaining why we intuitively *rank* omissions (e.g., nurse vs. passer-by) if all are equally non-causal.  

  **Verdict:** FUNDABLE | *The practitioner-defined baselines for Type 1/2/3 omissions systematically differ, and at least one type anchors its baseline descriptively.*
