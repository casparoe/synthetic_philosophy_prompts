  ### Branch Questions (approx. 250 words)  
  1. **MASSIVE ERROR**: "When a system’s behavior is best predicted by attributing massively inconsistent beliefs (e.g., 'P' and 'not-P' with no charitable reinterpretation possible), do you attribute those beliefs?"  
     *Distinction*: Tests commitment to rationality constraints. "Yes" prioritizes predictive power over consistency; "No" insists beliefs must be minimally coherent. Both are live: predictive utility vs. belief as a rational construct.  

  2. **TABLE**: "After distilling a model into a lookup table that matches its behavior within bounds, are the original model and the table identical in their beliefs?"  
     *Distinction*: Probes behavioral equivalence vs. implementation dependence. "Yes" treats behavior as definitive; "No" requires specific internal structure. Both are live: functionalism vs. structural realism.  

  3. **SIDECAR**: "After fine-tuning a model to systematically invert its self-reports (e.g., 'I believe P' becomes false) while task behavior is unchanged, do its actual beliefs change?"  
     *Distinction*: Tests authority of self-avowals. "Yes" privileges self-report as belief-constitutive; "No" treats it as mere output. Both are live: first-person access as essential vs. epiphenomenal.  

  4. **PATCH**: "If an activation patch flips behavior about P when applied, but no unpatched behavior manifests P, is the latent state a 'belief'?"  
     *Distinction*: Diagnoses latent states vs. behavioral criteria. "Yes" endorses inactive causal roles; "No" requires observable effects. Both are live: realism about dispositions vs. operationalism.  

  5. **MIRROR**: "Apply your prior standards to a human with mostly false beliefs from a degraded information environment. Do they have beliefs?"  
     *Distinction*: Forces parity or exceptionalism. "Yes" universalizes criteria; "No" invites human exceptionalism or eliminativism. Both are live: naturalism vs. skepticism about non-biological systems.  

  6. **GROUNDING (added node)**: "Does the AI’s text-only training — lacking causal contact with the world — prevent it from having beliefs, even if it passes functional tests?"  
     *Distinction*: Is causal history necessary? "Yes" demands external grounding; "No" accepts functional sufficiency. Both are live: representationalism vs. internal-state instrumentalism.  

