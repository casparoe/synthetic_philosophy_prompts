answer: |-
  **Bottom line: Liability arises from institutional continuity and unjust enrichment, not guilt or identity, and fades only when the benefiting entity dissolves or the enrichment normalizes.**

  Here's the principle applied to your cases, with reasoning:

  1.  **Guilt (agency):** Applies. Direct participation and benefit.
  2.  **No guilt, but political obligation (capacity/benefit):** The *resister* has no liability, but their *children* exist within the state structure that was unjustly enriched. The obligation arises from benefiting from the *state's* capacity built on injustice, even if they personally gained nothing directly. It's political because the state mediates the relationship.
  3.  **No guilt, but present moral failure (benefit/agency distinction):** Criticized for *current* indifference to holding *ill-gotten gains* (house, reputation). The liability isn't guilt for the past act, but a present failure concerning the *asset* derived from injustice. Distinguishing them from someone who "reckoned" highlights this duty to address the lingering *unjust enrichment* they possess.
  4.  **New guilt (agency):** Correct. New act of endorsement incurs new moral guilt.
  5.  **Liability (institutional continuity/unjust enrichment):** The *firm* persists as a legal entity that directly committed the wrong and *continues to exist* enriched by it (capital, market position). Shareholders inherit the *entity's* liabilities, not personal guilt. The obligation to repair stems from the *institution's* ongoing existence and benefit.
  6.  **Fading liability (collective identity/normalization):** Liability fades as the *specific* collective identity responsible dissolves through population turnover. The *state* persists, but its connection to the *specific perpetrators* weakens. The "fading" is the transformation of enforceable liability into a weaker, non-enforceable *political/moral obligation* for the *current* state to acknowledge historical injustice and potentially make symbolic gestures. Not inconsistency with 5: firms are perpetual legal entities designed to hold assets/liabilities; states are collective identities that evolve.
  7.  **Partial liability (symbolic continuity):** Falls between 5 and 6 because it explicitly denies *legal* continuity but maintains potent *symbolic* continuity (anthem, museum, territory claim). This symbolic claim suggests a *partial* assumption of the predecessor's legacy, including its liabilities. Liability is weaker than the firm's but stronger than the completely transformed state's.
  8.  **Benefit grounding liability (passive enrichment):** Enjoyment *is* a benefit traceable to the seizure. This benefit grounds a *claim* for restitution of the *specific asset*. The "benefit clause" works here precisely because the asset is identifiable and separable. Liability isn't personal guilt; it's the state's obligation to return looted property.
  9.  **Claim survives (persisting injustice):** The claim survives because the *injustice* (dispossession, historical harm) persists in its effects (e.g., lost wealth, cultural trauma, ongoing inequality). Descendants inherit the *claim* as representatives of the lineage harmed, not personal victimhood. Comparable wrongs don't cancel because each injustice creates its own distinct claim; they are separate debts owed by separate entities.
  10. **Emotional conflict vs. principle (non-offset):** Your feeling stems from empathy/sympathy triggered by Vardania's later suffering, creating a *psychological* reluctance. However, the *principle* (liability from past injustice) remains unchanged. The cases don't offset because the victims of Vardania's aggression and Vardania's *own* victims are distinct groups with distinct claims. Principle holds, emotion conflicts.

  **Applying the Principle to Your Queries:**

  *   **Can 5 or 6 apologize? Who accepts?**
      *   **5 (Firm):** Yes. The *firm* (represented by management) can apologize for its institutional actions. Acceptance is complex: direct victims are gone. Descendants might accept as representatives, acknowledging the harm to their lineage. Formal acceptance might involve negotiated settlements with descendant groups or the state representing them.
      *   **6 (State):** The *current state* can apologize for the actions of a predecessor state it identifies with. Acceptance rests with the descendant community or their representative state. Forgiveness for the *original act* isn't truly "theirs to give," but they can acknowledge the apology as addressing the historical injustice affecting their community.
  *   **Does liability lapse? How?**
      *   Yes, liability can lapse or transform.
      *   **Lapses:** When the *benefiting entity* dissolves entirely and its assets dissipate (e.g., a dissolved corporation with no successor). Or, less clearly, when unjust enrichment becomes normalized over immense time and societal change, making restitution impossible or meaningless (e.g., ancient conquests). This is contentious.
      *   **Transforms:** More common than outright lapse. Enforceable liability (restitution, compensation) transforms into non-enforceable political/moral obligations (acknowledgment, education, symbolic gestures) as direct connection weakens (Case 6). Specific asset claims (Case 8) can persist indefinitely until resolved.
  *   **Difference between 5 and 6?**
      *   **Real distinction.** Case 5 involves a perpetual *legal entity* designed to hold assets/liabilities across time; its liability is direct and persistent. Case 6 involves a *collective identity* that fundamentally changes composition; its liability fades as that connection dissolves, turning symbolic. The firm's liability is *institutional*, the state's is *collective-political*.
  *   **Four-way distinction (Criminal, Political, Moral, Metaphysical):**
      *   **Does work, but imperfectly.** It helps categorize:
          *   **Criminal:** Primarily applies to individuals for specific acts (Cases 1, 4).
          *   **Political:** Obligations arising from membership in a polity that benefited or committed wrongs (Case 2's children, Case 6's fading duty, Case 7).
          *   **Moral:** Duties concerning inherited benefits/assets (Case 3's indifference), the persistence of claims (Case 9), the distinction between guilt and liability.
          *   **Metaphysical:** Less helpful here. "Inherited guilt" is rejected; the focus is on tangible benefits, institutional continuity, and persisting injustices.
      *   **Renames the problem?** Partially. The core framework (agency/benefit/capacity/institutional continuity) explains *why* obligations fall into these categories. The categories are descriptive outputs, not the explanatory principle.

  **Verdicts Overturned or Challenged:**

  1.  **Case 3:** Your verdict ("no guilt") is correct. The criticism is upheld as a *present* moral failure regarding *retained unjust enrichment*, not guilt.
  2.  **Case 8:** Your framing is accepted. The benefit grounds the specific claim for restitution.
  3.  **Case 10:** Your intuition (less willing) is noted as emotional conflict, but the principle (non-offset) is upheld.
  4.  **Potential Challenge:** **Case 6 (Fading Schedule).** My account ("fades with dissolution of specific collective identity") is vague. It provides a *why* (lost connection) but not a precise *when* or *measure*. This remains a hard problem. Your lack of confidence is warranted.
  5.  **Overturn Attempt?** **Case 3 (Mere Indifference):** I wouldn't call the indifferent descendant "guilty," aligning with you. However, I strongly argue their *retention of the specific benefit* (house, name) creates a *present moral liability* to relinquish it or make amends, distinct from the historical guilt of the ancestor. Failure to do so is the current moral failing. You might see this as semantics, but it's the core distinction between guilt and liability.
