answer: |-
  The first snip happened the summer before freshman year. Maya came home from the hospital complaining about the itchy stitches, not about feeling different. "Still me," she shrugged, grabbing an apple with her right hand. The left just rested on the counter. Homework that fall felt normal, except sometimes her left hand would doodle spirals in the margins while her right hand wrote equations.

  The second operation, sophomore year. Recovery was longer. Her left hand started doing things. Reaching for the salt shaker while her right hand stirred soup. Trying to turn the page of her biology textbook backwards. "Quit it," she'd mutter, firmly placing her left hand under her thigh. Her friends noticed the occasional weird gesture, chalked it up to Maya being quirky Maya. She still laughed at Kai’s terrible jokes, still stressed about the SATs. "I feel fine," she insisted.

  Operation three, junior year. The diary started. Maya always kept one – pink cover, tiny lock. Now, entries looked like arguments. *Kai smiled at me today :)* written neatly in blue ink. Scrawled savagely beneath it, in black: *He smiles at everyone. Idiot.* Maya stared at the page, frowning. "I don't remember writing that," she whispered. But she kept writing. Sometimes the black ink would violently cross out the blue sentences. *I hate calculus* became ***I LOVE CALCULUS? LIE.*** She snapped the diary shut. Still, she went to prom, her left hand trying to pull off the corsage her right hand had carefully pinned.

  Senior year, the fourth cut. The disconnect felt… louder. Her left hand actively fought her. It would slap her right hand away from her phone. During a tense lunchroom argument with her friend Chloe about college choices, her left hand suddenly dumped Chloe’s smoothie onto her own lap. Maya gasped, horrified. "I didn't mean to! I swear!" Her right hand scrambled for napkins while her left clenched into a fist, knuckles white. Chloe forgave her – "Maya, you’re just stressed!" – but Maya started wearing hoodies with deep pockets to trap her left hand. She got accepted to State. "I’m going to State," she announced, a tremor in her voice.

  The final operation was a month before graduation. Recovery was quiet. Too quiet. She moved back into her familiar room – band posters, fairy lights, desk piled with yearbooks and college brochures. Her right hand started unpacking, placing things neatly. Her left hand, almost immediately, picked up a Sharpie. While Maya (right hand) carefully hung her State hoodie in the closet, her left hand began drawing jagged, chaotic black lines across her favorite poster of a serene mountain lake.

  "Maya?" It was Kai, leaning in her doorway. He’d come over to study. His eyes widened at the vandalized poster. "Whoa. What happened?"

  Maya turned. Her right hand gestured vaguely towards the poster. "It… needed something?" Her voice sounded flat. Her left hand kept scribbling, dark lines radiating outwards like cracks in glass.

  Kai hesitated, looking from the violently decorated poster, to the hoodie neatly hung, to Maya’s face – calm, but somehow distant. He swallowed. "Maya… are you…" He fumbled, the psych unit from freshman year flashing in his mind, the diagrams of brains split in two. "Are you… one? Or two?"

  Maya blinked. Her right hand stopped gesturing. Her left hand paused mid-scribble, the Sharpie hovering. A slow, almost dreamy smile touched her lips. It looked… practiced. "Kai," she said, her voice smooth as glass. "It's Tuesday."

  He stared. "Tuesday?"

  "Yep," she said, turning back to her desk. Her right hand picked up a calculus textbook. Her left hand, hidden behind her back, slowly lowered the Sharpie, the cap clicking softly. "Definitely Tuesday." She opened the book. Her right hand started highlighting a formula. Her left hand, unseen, began tapping a frantic, silent rhythm against her jeans leg. Homework. College. A ruined poster. Tuesday. Everything normal. Everything Maya.
