answer: |-
  ## Joint Statement on Evolutionary Psychology: Adversarial Collaboration Consensus

  **Preamble:** We, an adaptationist researcher and a skeptic in human evolutionary psychology, have engaged in good-faith dialogue. While fundamental disagreements persist, we affirm the value of rigorous debate and identify specific areas of agreement and clarify the nature of our remaining disputes. Central to this is distinguishing three separable claims within any adaptationist hypothesis: **Specialisation**, **Provenance**, and **Design**. We agree these claims are logically distinct and that evidence may support one while undermining another.

  ### I. Agreed Claims (Signed by Both Parties)

  1.  **Distinction is Paramount:** Rigor requires explicitly separating the Specialisation claim (domain-specific mechanism), Provenance claim (tuning to an ancestral problem), and Design claim (shaping primarily by natural selection for that problem) when formulating and evaluating hypotheses. Confusion arises when these are conflated.
  2.  **Byproducts: Scope and Limits:** The existence of "spandrels" or byproducts of selection is undeniable. Demonstrating that a trait *could be* a byproduct does **not**, by itself:
      *   Refute the Specialisation claim (the mechanism may still be domain-specific).
      *   Refute the Provenance claim (the mechanism may still be tuned to an ancestral input).
      *   It *does* challenge the Design claim by providing a plausible alternative explanation for the mechanism's structure *without* direct selection for its current function. Establishing a strong Design claim requires positively ruling out salient byproduct explanations.
  3.  **Sample Diversity Limitation:** The current evidence base in evolutionary psychology suffers from a severe over-reliance on WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations. This significantly limits the generalizability of findings regarding the universality, developmental stability, and precise nature of proposed mechanisms (impacting all three claims). Cross-cultural and diverse-sample research is essential for robust inference.
  4.  **"Innate" Defined Operationally:** For the purposes of hypothesis testing, "innate" should be understood as **canalized development:** the reliable emergence of a specific cognitive mechanism across the statistically normal range of human environments, due to species-typical developmental processes. This is distinct from genetic determinism and allows for necessary environmental triggers. It contrasts with mechanisms that are highly contingent on specific, variable environmental inputs for their development (the "reliably acquired" alternative).
  5.  **Plasticity and Specialisation Co-Exist:** The existence of developmental plasticity and learning does **not** inherently negate the possibility or existence of domain-specialized mechanisms. The mind can contain both. The critical question is the *nature* and *constraints* of that plasticity and learning.
  6.  **Falsifiability Imperative:** Hypotheses must be formulated in ways that allow for potential falsification through empirical evidence. Vague or infinitely flexible hypotheses that absorb counter-evidence via post-hoc "mismatch" epicycles or unfalsifiable byproduct claims undermine scientific progress.

  ### II. Areas of Residual Disagreement & Crucial Distinctions

  | Disputed Area / Crux                     | Adaptationist Formulation                                                                 | Skeptic Formulation                                                                                                 | Notes                                                                                                |
  | :--------------------------------------- | :---------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------- |
  | **1. Core Evidentiary Standard**         | Converging lines of evidence (comparative, developmental, cross-cultural, functional) provide strong, albeit often probabilistic, support for well-specified Design claims, especially when alternatives lack parsimony. | The Design claim requires *direct* evidence of historical selective pressure or stronger positive evidence *ruling out* salient non-selective explanations (plasticity, byproducts, culture) than is typically provided. Current methods often fall short. | Fundamental difference in burden of proof and sufficiency of indirect evidence for Design.           |
  | **2. The Credit Asymmetry Crux**         | A pre-registered registry testing ancestral predictions across diverse hold-out populations and novel modern environments would *validate* successful hypotheses and *refine or falsify* weaker ones. We predict robust performance for core, well-supported adaptations (e.g., core aspects of social exchange, kinship, threat detection). | Such a registry is essential to counter confirmation bias and post-hoc rationalization. We predict widespread failure or significant qualification of specific predictions when tested against populations researchers didn't design for, revealing overfitting to WEIRD contexts or flaws in assumed ancestral problem structures. | **Crucial Empirical Test.** Predicts divergent outcomes. Would significantly shift the debate.       |
  | **3. The Reliability Gap Crux**          | A mechanism produced by canalised development triggered by reliable environmental input *is* an adaptation. Plasticity triggered by universal inputs is the *developmental implementation* of the adaptation, not a rival hypothesis. The empirical content lies in identifying the reliably present input and the structure of the canalized response. | If a mechanism emerges solely due to reliable, species-typical environmental input triggering general plasticity, this *is* the primary explanation ("reliably acquired"). Attributing it to past selection for that specific function (Design claim) adds no necessary empirical content and may be superfluous. The "innate" label obscures the causal role of the reliable environment. | **Core Conceptual Disagreement.** Is canalization + reliable input *sufficient* for the Design claim, or is it the *alternative*? Where does explanatory weight lie? |
  | **4. Cultural Transmission**             | Culture powerfully shapes expression and content, but often operates *through* or is constrained by evolved, domain-specialized learning mechanisms (e.g., prestige bias, conformist transmission). Cultural explanations complement, but rarely replace, evolutionary ones for core mechanisms. | Cultural evolution and transmission are often primary drivers of cognitive and behavioral diversity. Attributing widespread features to evolved specializations underestimates the power and speed of cultural adaptation, potentially misidentifying culturally transmitted traits as "innate" adaptations. | Disagreement on the primacy and autonomy of cultural vs. evolved psychological explanations.          |
  | **5. Definition of "Adaptation" (Design)** | **(Flagged as Potentially Verbal):** An "adaptation" fundamentally refers to a trait whose complex, functional structure is best explained as a result of *historical natural selection* for that function (or a precursor). Present fit is evidence for, but not definitional of, adaptation. | **(Flagged as Potentially Verbal):** While history matters, the *primary* scientific utility of "adaptation" lies in identifying traits with *current* functional design relative to a specific problem. Over-emphasis on unobservable history can lead to untestable narratives; focus should be on current engineering fit and developmental origins. | **Crucial:** This often underlies disagreements. Is the core claim about historical causation or current functional structure? |

  ### Conclusion
  This statement reflects genuine points of agreement necessary for productive dialogue, while explicitly framing the core disagreements and crucial empirical tests (like the Credit Asymmetry registry) that could resolve them. Honoring the Specialisation-Provenance-Design distinction is vital for clarity. Progress hinges on methodological rigor, addressing the WEIRD sample problem, designing tests capable of genuinely falsifying claims (especially Design), and continuing to clarify the often-implicit assumptions about development, culture, and the very meaning of adaptation.
