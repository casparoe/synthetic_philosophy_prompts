prompt: |-
  I'm a senior doing an independent reading project on moral dilemmas, and I keep running into one pattern that I don't have a word for. My teacher says this pattern is one of the things people argue over when they ask whether genuine moral dilemmas — cases where you do something wrong no matter which option you take — are even possible. So I'd like to know whether it has an established name in the literature. More than the name, though, I want the carving: what exactly the thing is, what it isn't, and where its edges are. A bare label won't survive my teacher's first question.

  Here are the instances I keep coming back to.

  1. Two friends asked me to drive them to separate events at the same time, in opposite directions, and I could only take one. I drove the one who would otherwise have missed something that mattered more to her. I'm as confident as I am about anything that I chose correctly, and the friend I didn't drive said she agreed. But afterwards I wanted to apologize to her, and the apology felt like something I owed rather than something merely polite. Had I shrugged and said "I picked right, nothing to discuss," that would itself have been a small failure. Yet I don't think I did anything wrong.

  2. I noticed the same shape in a novel: a character breaks a promise in order to do something urgent and plainly more important, is certain he was right to break it, and then spends years trying to make it up to the person he broke it against — who by then is dead and never learned about the promise at all. That struck me as the strangest part. Whatever is left over after the justified choice seems able to survive the person it's directed at.

  3. And here is the bit I can't fit into anything. It seems to matter enormously whether the person passed over was in a position to notice. If my friend had never found out that I could have driven her, and nothing had changed for her, I think I'd have felt almost nothing — but the claim I supposedly failed seems to be exactly the same claim in both versions. It also seems to matter whether I chose at all: had the matter been settled by a coin flip or by which car started, the leftover is different in a way I can't spell out.

  The other thing I want to name: the leftover behaves like a debt rather than like a feeling. It seems to give me an actual reason to give that person priority next time, and when I do, it goes away, as though it had been paid off. That isn't ordinary sadness, and it isn't guilt in the usual sense either, since I don't believe I did anything wrong. It also seems to shrink when the choice was obvious and grow when the two claims were nearly evenly matched, which is odd if it's really a debt — debts don't get smaller because paying was easy.

  So: is there an established concept for this — the directed, apparently reason-giving, apparently dischargeable leftover that survives a justified choice between competing claims? If there is, I need to know how it differs from the nearby things it might be confused with: plain regret, guilt, the general unpleasantness of having had to choose, the kind of sadness a bystander might feel. If there isn't, or if the established concepts only cover the version where the person passed over knows about it, I'd like a coined term with a definition and some boundary cases I can test it against. And finally: does a pattern like this actually support the claim that some dilemmas leave you in the wrong either way, or can everything I've described be explained away by someone who denies that?
reasoning: |-
  Okay, this user is a senior working on an independent reading project about moral dilemmas. They've encountered a recurring pattern they can't name, and their teacher hinted it relates to debates about whether genuine moral dilemmas exist. They need more than just a term—they want a precise definition, boundaries, and how it fits into the philosophical debate. 

  First, I need to unpack their examples. The driving scenario is key: they chose correctly but felt obligated to apologize, framing it as a "debt." The novel example adds depth—making amends even when the wronged party is unaware. The third point introduces nuances: the passed-over person's awareness and the method of choice matter. 

  The user emphasizes this "leftover" isn't guilt or regret—it's reason-giving, dischargeable, and scales with choice difficulty. That last detail is fascinating: if it were a true debt, ease of payment shouldn't lessen it. 

  Now, recalling philosophy: Bernard Williams' "moral residue" and "agent-regret" come to mind. Williams distinguishes agent-regret (first-person, tied to one's agency) from regret. Shelly Kagan's "remainders" also fit—lingering obligations post-justified violation. But neither perfectly matches the user's description. Williams focuses on actions (e.g., hitting a child while driving safely), while the user's case involves omissions (not driving a friend). 

  The awareness factor is tricky. Williams doesn't require the wronged party's knowledge, but the user feels it intensifies the residue. This might tie to Stephen Darwall's second-personal reasons—moral claims involve mutual recognition. If the friend is unaware, the "call" for acknowledgment isn't activated. 

  Coin-flip vs. choice: active choice implicates the agent, making the residue feel personal. Random selection diffuses responsibility. 

  For the debt-like behavior: Kagan's remainders imply ongoing reasons, but the user notes they "shrink" when choices are obvious. That's paradoxical if it's a true debt. Maybe it's more like a "moral shadow"—less about repayment and more about symbolic repair when the original claim was strong. 

  Is this evidence for irresolvable dilemmas? Williams thinks residue signals unavoidable moral failure, but others like Philippa Foot argue it's emotional, not logical. The user's cases don't prove dilemmas are inescapable—just that moral claims can persist post-justification. 

  Coining a term: "Unacknowledged Claim Residue" (UCR) could work, emphasizing the dormant claim awaiting recognition. Boundaries: differs from regret (non-directed), guilt (implies blame), and bystander sadness (detached). 

  Finally, the user should test UCR against cases: obvious choices (minimal residue), unaware claimants (dormant residue), and resolved claims (e.g., compensating the friend). This framework should satisfy their teacher's demand for precision.
answer: |-
  This pattern you've identified is profound and widely discussed in moral philosophy—it's most commonly called **moral residue** or **moral remainder**. Bernard Williams' concept of **agent-regret** is particularly relevant to your driving example, and Shelly Kagan's work on "remainders" formalizes the debt-like quality. But the full carving requires dissection:

  ### Core Concept: Moral Residue
  - **Definition**: The persistent, directed obligation that survives a *justified* choice to override one moral claim in favor of another. It manifests as a reason-giving "debt" owed specifically to the person whose claim was overridden, even when the choice was correct.
  - **Key Features**:
    - **Directedness**: Attaches to the claimant (e.g., the friend not driven), not generalized regret.
    - **Normative Force**: Generates reasons for future actions (e.g., prioritizing them later).
    - **Dischargeability**: Can be extinguished through acknowledgment, apology, or compensation.
    - **Intensity Variance**: Scales with the *moral weight* of the overridden claim and the *difficulty* of the choice (unlike fixed debts).

  ### Boundaries & Distinctions
  | **Moral Residue** | **Guilt** | **Regret** | **Bystander Sadness** | **Choice Discomfort** |
  |-------------------|-----------|------------|------------------------|------------------------|
  | Directed at claimant | Self-focused | Undirected | Detached | Self-focused |
  | Implies ongoing obligation | Implies blame | Emotion only | No obligation | Temporary unease |
  | Dischargeable by action | Requires absolution | Non-dischargeable | Irrelevant | Fades with time |
  | Persists post-justification | Absent if justified | May persist | Context-dependent | Ends with decision |

  ### Why Your Observations Matter to the Concept
  1. **Awareness of the Claimant**:  
     Residue *intensifies* when the claimant knows they were overridden. This aligns with Stephen Darwall's "second-personal reasons": moral claims exist relationally. If your friend is unaware, the *call for acknowledgment* lies dormant—but the claim itself persists. Your intuition that "nothing changed for her" reduces residue because moral claims partly depend on mutual recognition of standing.

  2. **Agency in the Choice**:  
     A coin flip severs the link between *your agency* and the outcome. Residue arises from **taking responsibility** for overriding a claim. Passive mechanisms (e.g., car won't start) diffuse personal accountability. Williams calls this "agent-regret": it only applies when *you* acted.

  3. **Debt vs. Intensity Paradox**:  
     The "shrinking" when choices are obvious reveals residue isn't literal debt. It's a **symbolic acknowledgment** that a genuine claim was sacrificed. Overriding a trivial claim (e.g., skipping lunch with a friend for a funeral) leaves minimal residue; overriding a life-altering claim (e.g., missing a medical appointment) leaves profound residue—even when justified.

  ### Established Terms & Their Edges
  - **Williams' Agent-Regret** (*Moral Luck*, 1981):  
    - *What it covers*: First-person regret for harms *you caused* through justified acts (e.g., hitting a child while driving safely).  
    - *Edge your cases test*: Your driving dilemma involves *omission* (not acting for one friend), not direct harm. Williams focuses on *action*, but residue from omissions fits his core idea of "being part of the cause."
    
  - **Kagan's Moral Remainders** ("The Structure of Normative Ethics", 1998):  
    - *What it covers*: Obligations that "remain" after a justified violation of a moral rule. He explicitly frames them as ongoing reasons.  
    - *Edge your cases test*: Kagan treats remainders as impersonal duties. Your emphasis on *directedness* (owed *to* the claimant) requires adding Darwall's second-personal framework.

  - **Pro-Tanto Reasons** (Rossian deontology):  
    Residual duties arise because moral reasons (e.g., promises) aren't nullified by being overridden—they retain *pro-tanto* force, creating lingering obligations.

  ### Coining a Term: For the "Unaware Claimant" Case
  If standard "moral residue" feels too broad, coin:  
  **Dormant Claimant Residue (DCR)**  
  - *Definition*: The latent, reason-generating obligation to a person whose moral claim was justifiably overridden *without their knowledge*, requiring activation (e.g., discovery) to manifest as a demand for acknowledgment.  
  - *Test case*: In your novel example, the character's obligation persists *because the claim itself exists independently of awareness*. DCR explains why he seeks posthumous atonement—to discharge the dormant claim.  
  - *Boundary*: DCR vanishes if the claim was *invalid* (e.g., a promise extracted under duress).

  ### Does This Support Genuine Moral Dilemmas?
  **Yes**, but controversially:  
  - **Pro-Dilemma View** (Williams, Nagel): Residue proves *inescapable moral failure*. Even justified choices leave "moral stains" because **claims are not fungible**. You "owe" your friend because her claim wasn't negated—it was tragically overridden.  
  - **Anti-Dilemma View** (Sartre, Foot): Residue is psychological, not logical. You did nothing *wrong*, so no dilemma existed. The "debt" is emotional compensation for the *appearance* of wrongdoing, or a Kantian "conflict of grounds" resolved by correct choice.  

  **Your cases challenge both**:  
  - Residue's *reason-giving nature* (e.g., prioritizing the friend next time) suggests it's not *merely* emotional.  
  - Yet its *dischargeability* implies it's not an eternal failure—just an unsettled claim. This supports a **moderate position**: Dilemmas force us to violate *pro-tanto* duties, leaving non-guilt-tinged obligations, but no "double wrongness."

  ### Recommended Sources for Your Project
  1. Williams, B. - *Moral Luck* (1981) [Agent-regret]  
  2. Kagan, S. - "The Structure of Normative Ethics" (1998) [Moral remainders]  
  3. Darwall, S. - *The Second-Person Standpoint* (2006) [Directed obligations]  
  4. Tessman, L. - *Moral Failure* (2014) [Feminist analysis of residue]  
  5. Marcus, R. - "Moral Dilemmas" (1980) [Classic debate starter]  

  Your teacher will probe whether residue is *truly normative* or just emotional. Arm yourself: Argue that its link to **future reasons for action** (e.g., you *should* apologize/prioritize) makes it irreducibly moral. The coin-flip test proves agency is central—and the unaware claimant test shows residue binds us even without relational feedback. This isn't survivor's guilt; it's philosophy in the wild.
