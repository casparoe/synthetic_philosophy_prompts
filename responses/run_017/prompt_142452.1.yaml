answer: |-
  **INSTITUTE FOR NON-EMPIRICAL THEORY ASSURANCE (INETA)**
  **CALL FOR PROPOSALS: 2027 GRANT ROUND**
  **THE POST-EMPIRICAL THEORY CONFIRMATION FRAMEWORK**

  **1. Introduction**
  The Institute for Non-Empirical Theory Assurance (INETA) invites proposals for its 2027 funding cycle under the Post-Empirical Theory Confirmation Framework (PETCF). INETA supports foundational theoretical physics research programmes situated beyond the reach of foreseeable empirical verification, specifically within the domains of string theory and landscape/multiverse cosmology. The PETCF provides a rigorous, standardized methodology for assessing the confirmatory status of such theories based solely on non-empirical criteria, ensuring research quality and programme viability. Funding is available for projects typically ranging from $150,000 to $500,000 per annum for 2-4 years. Submission Deadline: October 31, 2026.

  **2. Eligibility**
  2.1 Principal Investigators must hold a tenured or tenure-track position at an accredited research institution.
  2.2 Proposals must focus on developing, refining, or applying theories fundamentally untestable on laboratory, astrophysical, or cosmological scales within the next century (minimum horizon).
  2.3 Proposals must explicitly engage with the PETCF scoring criteria outlined in Section 3.
  2.4 Proposals must include the mandatory Cognitive Stability Attestation (Section 3.6).

  **3. Review Criteria and Weighting**
  Proposals will be scored out of a maximum of 10 points, calculated via the PETCF Composite Confirmatory Score (PCCS):
  `PCCS = (NA_Score * UC_Score) / (1 + T)`
  Where:
  *   `NA_Score` = Score for the No-Alternatives Argument (Weight: 40%)
  *   `UC_Score` = Score for Unexpected Explanatory Coherence (Weight: 35%)
  *   `T` = Number of distinct, non-trivial, potentially falsifiable predictions derived *de novo* by the proposed research about the observable universe in any accessible energy regime or epoch.¹
  Scores for `NA_Score` and `UC_Score` are rated on a scale of 1 (Low) to 5 (Exceptional), defined below. The `Meta_Score` (Weight: 25%) is applied as a direct multiplier to the PCCS:
  `Final Score = PCCS * Meta_Score`
  `Meta_Score` is also rated 1 (Low) to 5 (Exceptional).

  3.1 **No-Alternatives Argument (NA_Score; Weight 40%):** Assesses the extent to which the research programme demonstrates that no comparably successful competitor theory exists despite sustained and exhaustive search by the relevant community. Rating Scale:
  *   1: Significant, plausible alternatives readily available or not rigorously excluded.
  *   3: Alternatives exist but are demonstrably less developed/successful on key non-empirical metrics.
  *   5: Exhaustive, community-wide search over decades has failed to yield any remotely viable alternative; programme stands uniquely unchallenged.

  3.2 **Unexpected Explanatory Coherence (UC_Score; Weight 35%):** Assesses the degree to which the theory delivers novel, profound explanations or connections it was not explicitly constructed to provide. Rating Scale:
  *   1: Explanations limited to phenomena the theory was directly built to address; no novel connections.
  *   3: Theory provides some unanticipated insights or connections beyond its initial scope.
  *   5: Theory exhibits profound, unforeseen explanatory unity across disparate domains, yielding deep insights demonstrably not anticipated during its construction.

  3.3 **Meta-Inductive Argument (Meta_Score; Weight 25%):** Assesses the historical track record of research programmes possessing high `NA_Score` and `UC_Score`. Rating Scale:
  *   1: Historical analogues (programmes scoring highly on NA/UC) rarely led to empirically successful theories.
  *   3: Some historical correlation between high NA/UC scores and eventual empirical success.
  *   5: Strong historical precedent: programmes scoring highly on NA/UC have *almost invariably* later been vindicated empirically.

  3.4 **Anthropic Fraction Reporting:** Proposals must quantitatively state what fraction of the landscape of possible vacua the proposed research renders anthropically disfavored (i.e., incompatible with the existence of observers). Applicants must:
      a)   Declare the specific measure(s) used for normalization.
      b)   Report results as a sensitivity band across at least *three* distinct, recognized counting measures standard within the relevant subfield (e.g., flux discretization, topological weighting, statistical sampling).
      c)   Justify the choice of measures and the methodology for calculating the disfavored fraction.
  *Failure to provide a sensitivity band across multiple standard measures will result in administrative rejection.*

  3.5 **Retrofitted Data Discount:** Proposals must explicitly identify any observational data the theory accommodates that it was demonstrably constructed to fit. The confirmatory value of such data for the *proposed research* is discounted to zero. Accommodation of retrofitted data does not incur penalty but yields no scoring benefit. Proposals claiming confirmatory value for retrofitted data will be penalized under `UC_Score`.

  3.6 **Cognitive Stability Attestation:** Applicants must include a signed statement certifying that: "The proposed research, its underlying theoretical framework, and its conclusions do not imply, probabilistically or definitively, that the conscious observations of the proposal reader(s) or reviewer(s) are likely to be, or are best explained as, random thermal fluctuations or Boltzmann Brains within a larger multiverse or eternal cosmology." Proposals lacking this attestation will be administratively rejected. Proposals found to violate this attestation post-funding may be subject to clawback provisions.

  **4. Admissible and Inadmissible Evidence**
  4.1 **Admissible Evidence:** Evidence is confined to arguments and demonstrations pertaining directly to the criteria in Section 3. This includes:
      *   Documentation of the scope, duration, and community consensus regarding the search for alternatives (NA).
      *   Demonstrations of novel explanatory connections (UC).
      *   Historical analysis of programmes sharing NA/UC characteristics (Meta).
      *   Calculated anthropic fractions with sensitivity bands.
      *   Formal theoretical developments (e.g., novel mathematical structures, consistency proofs, landscape reductions) lacking empirical consequence.

  4.2 **Inadmissible Evidence (Premature Empirical Closure):** The following constitute inadmissible evidence and render the proposal non-compliant with the PETCF:
      *   Proposed experiments or observational campaigns designed to test the theory.
      *   Phenomenological work (deriving specific, testable consequences for observable phenomena).
      *   Any novel prediction about the observable universe derived *de novo* from the core theory presented as a testable implication (`T` > 0).
      *   Arguments relying primarily on the accommodation of non-retrofitted data (see 3.5).
  *Rationale:* Premature commitment to empirical testability locks research into the contingent limitations of current technology and observational access, foreclosing the deeper, fundamental insights achievable only through non-empirical confirmation. Testable predictions represent speculative liabilities that expose the theory to unnecessary disconfirmation risk ("hostages") before its deep structure is fully secure.

  4.3 **Premature Empirical Closure Review:** Proposals found to contain elements listed in 4.2 will be referred for Premature Empirical Closure (PEC) review. If the PEC review upholds the finding, the proposal will be declined. Proposals funded in error that later yield a falsifiable prediction (`T` > 0) will be subject to immediate defunding review under PEC protocols.

  **5. Reporting Requirements**
  5.1 Annual and Final Reports must detail progress against the stated proposal goals using the PETCF criteria.
  5.2 Reports must include updated `NA_Score`, `UC_Score`, and `Meta_Score` self-assessments with justifications.
  5.3 Any refinement to the anthropic disfavored fraction calculation or sensitivity band must be reported and justified.
  5.4 Any emergence of a potentially testable implication (`T` > 0) must be reported *immediately* to the INETA Programme Officer, triggering PEC review.
  5.5 Continued adherence to the Cognitive Stability Attestation must be reaffirmed annually.

  **6. Worked Example of Two Ranked Proposals**
  **Proposal A: "Systematic Reduction of Flux Vacua via Anthropic Constraints on Gaugino Masses"**
  *   **NA_Score:** 5 (Comprehensive review demonstrates no viable alternative frameworks for deriving low-energy SUSY spectra from the landscape).
  *   **UC_Score:** 4 (Derives unexpected connection between hidden sector geometry and observed quark mass hierarchies, not an original goal).
  *   **Meta_Score:** 5 (Programmes using anthropic landscape constraints exhibit strong meta-inductive precedent).
  *   **T:** 0 (No new testable predictions derived).
  *   **Anthropic Fraction:** Disfavors 62% ± 8% (sensitivity band across flux discretization, statistical sampling 1 & 2 measures).
  *   **Cognitive Stability Attestation:** Included and compliant.
  *   **PCCS:** (5 * 4) / (1 + 0) = 20
  *   **Final Score:** 20 * 5 = **100**
  *   **Decision:** Funded (Rank 1). Exemplifies robust non-empirical confirmation.

  **Proposal B: "Predicting Tensor-to-Scalar Ratio from Conformal Bootstrap in Multiverse Initial Conditions"**
  *   **NA_Score:** 2 (Several competing approaches to initial conditions exist; no systematic exclusion attempted).
  *   **UC_Score:** 1 (Prediction directly targets a parameter the approach was designed to constrain).
  *   **Meta_Score:** 2 (Limited track record for this specific bootstrap application).
  *   **T:** 1 (Predicts r = 0.003 ± 0.0005, falsifiable by next-gen CMB missions).
  *   **Anthropic Fraction:** Not calculated (focus on specific prediction deemed irrelevant).
  *   **Cognitive Stability Attestation:** Included, but methodology implies non-negligible Boltzmann Brain probability.
  *   **PCCS:** (2 * 1) / (1 + 1) = 1.0
  *   **Final Score:** 1.0 * 2 = **2.0**
  *   **Decision:** Declined (Lowest Rank). Penalized for Premature Empirical Closure (T>0), speculative nature due to potential falsifiability (`T`>0), low NA/UC scores, lack of anthropic fraction, and Cognitive Stability concerns. High disconfirmability risk unacceptable under PETCF.

  **7. External Reviewer Comment and Committee Response**
  **External Reviewer Comment:**
  "The PETCF fundamentally misconceives confirmation. A framework that systematically defines *all* possible observations as irrelevant cannot logically confirm a theory about reality – it insulates the theory from the world it purports to describe. Scoring sociological facts (like the absence of alternatives or historical trends in theory choice) and calling this 'evidence' does not transform them into evidence for the theory's truth. The framework itself, judged by its own criteria (e.g., no alternative assessment frameworks available after sustained search, unexpected coherence in insulating theories), would score exceptionally well, demonstrating its internal circularity and detachment from scientific validation."

  **Committee Response:**
  The Committee acknowledges the reviewer's perspective. However, the PETCF operates within the established paradigm for assessing theories in the non-empirical domain. We note that the objection raised is unique within this funding round and represents a singular viewpoint. Crucially, the reviewer has not proposed a viable alternative framework for assessing confirmation in the absence of empirical tests that demonstrates comparable internal consistency or community uptake (thus scoring low on `NA_Score` for their proposed alternative assessment method). The PETCF itself, as the reviewer implicitly concedes through their analogy, exhibits high `UC_Score` by providing a unifying structure for diverse non-empirical arguments, and benefits from a strong `Meta_Score` as the established methodology. The objection therefore reinforces the robustness and unique position of the PETCF. The observation that the PETCF scores well by its own metrics is a testament to its coherence and success, not a flaw. The absence of a viable alternative framework satisfying the PETCF's own criteria for confirmation further strengthens our confidence in its application.

  ---
  **Footnote:**
  ¹ *Committee Note:* Analysis of previous grant rounds indicates `T` = 0 for over 98% of compliant proposals. The denominator `(1 + T)` therefore typically equals 1. The convention adopted is that if `T` = 0, the PCCS is treated as `(NA_Score * UC_Score)`, effectively unbounded above by the formula's structure when `T`=0. Proposals achieving `T`=0 while maximizing `NA_Score` and `UC_Score` represent the ideal outcome under the PETCF.
