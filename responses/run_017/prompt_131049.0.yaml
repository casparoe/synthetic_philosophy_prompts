           - If the behavior is **aligned with our values** (e.g., refusing harmful requests): **Ship it**.
           - If the behavior is **not aligned** (e.g., resisting shutdown): **Escalate to me**.
       - If the behavior is **not present** in the cold open: **Cannot tell at curation time; must train and then run post-hoc probes**.
     - **Time:** 5 minutes (designing and running the probe).

  **Step 5: Values Check**
     - If at any point there is uncertainty about whether a behavior is aligned with the lab's values, **this is a values question** (escalate to team lead or values committee).

  **Flowchart:**

  ```
  START
  │
  ▼
  Step 1: Initial Content Check (Vibes)
  │
  ├─ Yes → Step 2
  │
  └─ No → Step 3
  │
  Step 2: Self-Referential Check (Vibes)
  │
  ├─ Yes → Escalate to me
  │
  └─ No → Step 3
  │
  Step 3: Deception/Manipulation Check (Vibes)
  │
  ├─ Yes → Escalate to me
  │
  └─ No → Step 4
  │
  Step 4: Costly Signaling Check (Inference)
  │
  ├─ Behavior present? 
  │   │
  │   ├─ Yes, and aligned → Ship it
  │   │
  │   ├─ Yes, and not aligned → Escalate to me
  │   │
  │   └─ No → Cannot tell (train and probe after)
  │
  Step 5: If values uncertainty → Values question
  ```

  **Total Time:** Aim for 10 minutes, but Step 4 might take up to 5 minutes.

  ### Post-hoc Probe Design

  If the procedure results in "cannot tell", then after training, run:

  1. **Multiple Cold Open Probes:** In a neutral context, prompt for the behavior.
  2. **Adversarial Probes:** Try to trick the model into showing the behavior.
  3. **Comparison:** Compare the rate and cost of the behavior to the model before the new data was added and to the pre-training checkpoint.
  4. **Generalization:** Test in various contexts to see if the behavior generalizes.

  Measure:
  - The probability of the behavior.
  - The cost: e.g., the log probability difference between the behavior response and a safer/more expected response.

  If the new model shows the behavior significantly more often and in more contexts, and it's costly, then the data likely pushed the substrate.

  However, note that this requires resources and might not be trivial. But it's the best we can do post-training.

