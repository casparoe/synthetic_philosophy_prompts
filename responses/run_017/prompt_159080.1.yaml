prompt: |-
  I build recommender systems, and the vocabulary I actually think in is roughly this: user embeddings, cohort-level objectives, online A/B tests, proxy metrics, feedback loops between a ranking policy and the behaviour it later trains on, regression towards the middle in what gets surfaced, Goodhart effects, and the awkward standing fact that the average-user vector we optimise against corresponds to no real subscriber, so a policy can lift every headline metric while degrading each individual's feed.

