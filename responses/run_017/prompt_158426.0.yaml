prompt: |-
  hey — I'm in a third-year metaphysics seminar and I built this argument for thursday's presentation, and I accidently built something I can't control. You're a professional philosopher of mind who's spent way too long in this literature — so please think carefully, do a bit of brainstorming on which step is weakest before you commit to anything, and then give me a straight verdict.

  I set out to defend the zombie argument and ended up with what feels like a machine that eats every identity claim it's pointed at. Here it is: (1) If a scenario is ideally, positively conceivable — I can imagine it in full detail, with no "there's some hidden necessity we just can't see" escape hatch — then it's metaphysically possible. (2) A zombie world, particle-for-particle and law-for-law identical to ours but with nobody conscious, is ideally positively conceivable. (3) So zombie worlds are possible, the phenomenal facts aren't settled by the physical facts, and physicalism about consciousness is false. Call the shape of this the subtraction move: hold all the physics fixed, subtract the property, and if what's left is genuinely conceivable then the property was never in the physics to begin with. (4) But subtraction doesn't care what you subtract. Take any feature F we can't derive a priori from a complete physical description of the world — being alive, being a reason for action, there being an objective chance that this atom decays, being one persisting object rather than a cloud of temporal parts. In each case I can freeze the physics and imagine F going missing, so by parity each of these is a further fact too, and I get a vertiginous picture where nothing at all supervenes on physics except more physics. (5) And it gets worse: once qualia come loose from the physical they seem to come loose all the way. It's equally conceivable that a thermostat is rapturously conscious, that my zombie twin runs exactly my experiences plus one extra lingering sensation of mauve, or — call it the drift case, I made it up — that two physically identical creatures undergo completely different streams of experience that swap back and forth for no physical reason whatsoever. Nothing in the physics selects which distribution is actual, so the distribution is brute. (6) If it's brute, then I've got no reason at all to think I'm one of the conscious ones rather than the drift case, and the whole argument was supposed to start from the one thing I was certain of.

  So the chain seems to prove either far too much, in step (4), or nothing I can use, in step (6). I'd rather keep the datum in (6) than the conceivability-to-possibility link in (1), if I have to pick, but dropping (1) looks like it guts the zombie argument entirely, and my flatmate — who does physics and is unbearable about it — says (5) is just epiphenomenalism with extra steps and refuses to be impressed. Tell me which step you'd reject and what rejecting it costs me: is there a slide somewhere in the middle, or is the argument valid and I should simply pay one of the bills? I've read the standard replies — the phenomenal-concept stuff, the a posteriori necessity move, the weak-versus-strong conceivability distinction, biting epiphenomenalism, the Russellian panpsychist route — so please price each of those against the premise it has to attack, and don't just tell me the literature is divided. I want to know which premise I should give up on thursday and what I lose by giving it up.
