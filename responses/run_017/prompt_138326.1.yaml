  Hmm, the user is chairing an on-stage interview with philosopher of biology Marisol Vega about her work on cooperation. Vega argues that kin selection, reciprocity, etc. are all mechanisms for creating positive assortment (correlation between strategies) rather than distinct explanations, and that the Prisoner's Dilemma framework has been overemphasized. 

  The user wants 8-10 interview questions with follow-ups tailored to Vega's likely responses. Key requests include:
  - A question on one-shot PD with mutual transparency (verified decision procedures)
  - A question on finite vs uncertain horizons in iterated PD
  - A question on Press-Dyson extortion strategies 
  - A question testing her framework on non-dilemma games (coordination games)
  - A question about reasoning into one-shot cooperation
  - A question on implications for AI agent design
  - A closing falsifiability question
  - At least one sequence where "that's a modeling artifact" becomes unsustainable

