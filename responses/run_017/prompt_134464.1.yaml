answer: |-
  Based on Dev's verdicts across the anthropic cases, the underlying rule he appears to be running is the **Self-Sampling Assumption (SSA) with a restricted reference class focused on "real" observers**, where observers are whole persons (not moments or experiences), and where prior probabilities may incorporate a simplicity bias against theories that "manufacture" observers. Let's break this down:

  ### Dev's Rule Synthesis:
  1. **Observer-Centric SSA**: Dev samples from the reference class of **actual, naturally occurring observers** (not simulated minds, not temporal slices). This explains:
     - **Doomsday**: Updates based on birth rank (sampling from all humans that ever exist).
     - **Incubator**: 2/3 for heads (sampling from all observers in the experiment: one on heads, two on tails).
     - **Sleeping Beauty**: 1/2 (halfer view; samples from observers, not awakenings—Beauty is one observer regardless of awakenings).
     - **Simulations**: No update—simulated minds excluded from reference class ("not on somebody else's server").
  2. **Prior Simplicity Bias**: Theories that "manufacture" observers (e.g., vast cosmos) may not get equal priors, as seen in **Presumptuous Philosopher** (rejects equal prior for crowded universe). This isn't directly about sampling but about initial likelihoods.

  ### Prediction for the White Room:
  - **SHORT**: 10¹¹ people, 100-year lives, one 1-minute E experience each.
  - **LONG**: Same 10¹¹ people, same one E experience each, but 100,000-year lives.
  - **Key**: Identical number of observers and E experiences; only total lifespan differs.

  **Dev's verdict: No update. Probability remains 1/2 for each hypothesis.**  
  **Why?**  
  - SSA samples from the reference class of **observers (people)**, not moments. Since both hypotheses have the same number of observers (10¹¹), and you are equally likely to be any observer in either world, E provides no new information to update.
  - E is guaranteed for every observer in both worlds—it doesn't distinguish between hypotheses. The surrounding lifespan is irrelevant because Dev's reference class doesn't weight by subjective time or moments.
  - Prior simplicity bias doesn't apply here: both theories have the same number of observers, and no "manufacturing" is involved.

  ### Rival Rules and Why They Don't Fit:
  1. **Self-Indication Assumption (SIA)**: Weights hypotheses by number of observers.  
     - Fits Incubator (2/3 for heads) but contradicts Sleeping Beauty (SIA implies 1/3 for heads; Dev says 1/2).  
     - **White Room prediction**: No update (same observers).  
