  — The incubator / coin-toss-with-two-rooms case (heads: one observer; tails: two; you find yourself in the room that exists either way): two thirds on heads.
  — Sleeping Beauty: one half, and he's mildly annoyed to be asked.
  — A case where a future civilization either runs enormous numbers of simulations of minds whose evidence is just like yours or doesn't: no update, he says; simulated minds aren't in his reference class ("I don't run my epistemology on somebody else's server"). I can never tell whether that's a view about consciousness, about manufactured minds, or about causal connectedness, and I suspect which one it is matters.

  Here's my case. Call it the white room. You wake in a white room with no memories at all, not even of how old you are — call that experience E. Trustworthy non-anthropic evidence tells you exactly one of two hypotheses is true and that they're equally likely beforehand:

  — SHORT: 10^11 people ever, each living a hundred years, each spending exactly one subjective minute of their life in E (it's a standard medical thing, everyone gets it once).
  — LONG: the very same people, the very same single minute of E each, except that everyone lives a hundred thousand years.

  So the number of people and the number of E-experiences are identical on both hypotheses; they differ only in how much other experience surrounds them.

