  ### 4. **Which Rule Is He Actually Using?**
  He's almost certainly using the **"central vs. early processing" rule** (or its close cousin, "cognitive penetrability").  
  - **Why?**  
    - It cleanly separates all verdicts without exceptions.  
    - It aligns with his neuroscience leanings (e.g., "V1-ish" masking in metacontrast).  
