  | **Your Rule 1** (Discriminative Response) | Some response at the time discriminates pre-revision content | No such response; content fixed from start | Falsely fits change-blindness (if "response at time" = ongoing interaction) and false memory (if "response" = initial encoding). But *fails* for metacontrast: initial keypress *does* discriminate, yet verdict should be Stalin. | Conflicts with metacontrast prediction; office-mate prioritizes *how* over *what*. |
