  - **Contrast with Rule 1 (discriminative response)**: This rule fails for metacontrast. If he applied it, he'd call it Orwellian (since the keypress discriminates the shape), but all evidence points to Stalinesque. His past verdicts don't rely on immediate responses—e.g., in change-blindness, no immediate response was measured, yet it was Orwellian.

  ### 5. **Critical Experiment to Separate the Rules**
  To definitively distinguish between the **central-vs-early rule** and the **discriminative-response rule**, use a variant of the **flash-lag illusion** with parallel response measures:  
  - **Setup**: A flash aligned with a moving object appears to lag. Add two responses:  
    1. **Speeded manual pointing**: Subjects quickly point to the flash's *actual* location (veridical, dorsal-stream-driven response).  
    2. **Delayed verbal report**: Subjects describe where the flash *appeared* (illusory lag, ventral-stream-driven).  
  - **Predictions**:  
    - **Central-vs-early rule**: Stalinesque (illusion fixed early by motion extrapolation).  
    - **Discriminative-response rule**: Orwellian (pointing response discriminates pre-revision content).  
  - **Outcome**: If office-mate calls it Stalinesque (as with standard flash-lag), he uses central-vs-early. If Orwellian, he uses discriminative-response.  
  - **Why this works**:  
