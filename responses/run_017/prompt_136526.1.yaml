    - The pointing response is analogous to the metacontrast keypress—it accesses pre-revision content but may be unconscious.  

  **Final Takeaway**: The metacontrast case is Stalinesque, reinforcing that your office-mate's rule hinges on the *level of processing* (early sensory = Stalin, cognitive = Orwell). To confirm, the flash-lag experiment pits this against the "discriminative response" rule—if he sticks with Stalinesque, you've got his number.
