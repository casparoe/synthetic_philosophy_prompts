answer: |-
  Here’s a conceptual framework for the eulogy, followed by the draft itself, crafted to navigate the tensions you described:

  **Conceptual Brainstorm: Supererogation & Its Discontents**

  1.  **What is Supererogation?** Morally praiseworthy actions that go "above and beyond" the call of duty. They are good, even admirable, but not strictly *required*. Think heroic rescues, significant self-sacrifice for strangers, or extraordinary generosity. The category exists to distinguish the morally obligatory (paying debts, not harming) from the morally excellent but non-mandatory (donating a kidney, risking your life for someone unknown).

  2.  **Denials of the Category:**
      *   **Utilitarianism/Consequentialism (Radical Demandingness):** Some argue (like early Peter Singer) that if an action significantly reduces suffering at a bearable cost to yourself, it *is* actually obligatory. Failing to donate that kidney or most of your income, when you could easily live on less, becomes a moral failing. For them, supererogation is an illusion created to excuse widespread moral mediocrity. Mira seems to have leaned towards this view – seeing her actions not as "extra" but as the baseline requirement of being decent in an unjust world.
      *   **The Demandingness Objection:** Critics of highly demanding moral theories argue that if morality requires constant, extreme self-sacrifice (giving until you're barely above destitution, donating organs whenever possible), it becomes psychologically unsustainable, alienating, and potentially counter-productive. It risks making morality seem impossible, leading people to reject it entirely. A category for the "supererogatory" acts as a pressure valve, acknowledging that while we *can* do more, we aren't *always failing* if we don't reach heroic levels.

  3.  **The Burden of Praise:**
      *   **As Insult:** For someone like Mira, who saw her actions as simply *required*, calling them "generous," "saintly," or "supererogatory" can feel deeply insulting. It implies she was doing something *extraordinary* or *optional*, which, from her perspective, diminishes the moral necessity she felt. It frames her baseline as abnormal, potentially making her feel misunderstood or like her fundamental ethical stance is being dismissed as mere "goodness."
      *   **As Burden:** Framing actions as supererogatory sets a precedent. Praising someone as a "saint" for extraordinary acts implicitly suggests that level is the *new* standard for being "really good." This burdens the praised individual (who may feel pressured to maintain an impossible level) and burdens others (who feel inadequate by comparison). It can turn admiration into a demand.

  4.  **Praising Perceived Duty:** How do you praise someone for doing what they saw as non-negotiable? You shift the praise from the *act itself* (which they saw as baseline) to the *character* and *consistency* it reveals. Praise their **integrity** (living exactly as they believed they must), their **clarity of vision** (seeing the need so plainly), their **courage** (acting on that conviction despite cost or convention), and their **rejection of easy excuses**. You praise the steadfastness, not by labeling the acts as "extra," but by acknowledging the depth of their commitment to their own understanding of what was *owed*.

  **The Eulogy Draft (Approx. 980 words)**

  Good morning. It feels impossible to stand here and speak about Mira. Impossible because the hole she leaves is so vast, and impossible because capturing the truth of who she was – really was – requires threading a needle with words that often fail us.

  Many of you knew Mira as a palliative care nurse for twenty years. You saw the calm she brought into rooms thick with fear, the practical way she eased unbearable pain, the unwavering focus she gave to someone’s final moments. It wasn’t glamorous work. It was work of profound presence, demanding every ounce of empathy and stamina she had, day after day.

  Some of you knew her through other choices. The time she gave a kidney to someone whose name she never knew. The decade where she lived simply, giving away roughly half of what she earned to causes fighting suffering far away. The eight months of her precious sabbatical she spent not traveling or resting, but caring for her friend Alex, minute by difficult minute, until the end.

  When confronted with these facts, the instinct – the *easy* instinct – is to reach for words like “saint,” “hero,” or “selfless.” To put her on some kind of pedestal. Mira would have hated that. Truly hated it. She wasn’t performing for praise. She wasn’t seeking admiration. If you called her “generous,” she’d get quiet, maybe a little sharp. It missed the point, entirely.

  For Mira, it was never about going *beyond* anything. It was about seeing what was directly in front of her – the suffering, the need, the stark reality of what could be done to alleviate it – and then acting. Simply acting. She once said, fiercely, that the whole idea of getting “extra credit” for doing what was obviously required was a fiction invented to let comfortable people off the hook. She didn’t see herself as doing something *extra*; she saw herself as doing what was, fundamentally, *owed*. What was necessary. What the situation demanded.

  That was her clarity. That was her compass.

  Praising her actions as if they were optional gestures of kindness fundamentally misunderstood her. That misunderstanding frustrated her because it concealed the harder truth she lived by: that seeing a need you can meet creates a direct responsibility. For Mira, the kidney wasn’t a gift *beyond* duty; it was, in her eyes, the duty itself when she was healthy and someone was dying. The money wasn’t generosity *exceeding* obligation; it was meeting an obligation that felt immediate and real to her. Caring for Alex wasn’t an extraordinary favour; it was the only conceivable response to a friend’s agony.

  So how do we honour *that*? How do we honour Mira without putting her on a lonely pedestal that makes everyone else feel inadequate, and without betraying her own fierce conviction that she was just doing what plain decency required?

  We honour her **integrity**. The sheer, unwavering consistency with which she lived according to the demands of her own conscience. She looked at the world, saw its sharp edges and deep wounds, and refused to look away. More than that, she refused to pretend that looking away was acceptable. She didn’t just see; she *acknowledged*, fully and without flinching, the weight of what she saw. And then, crucially, she *acted* in line with that acknowledgment. That is rare. That is powerful. That is worthy of our deepest respect.

  We honour her **courage**. Not the dramatic kind, necessarily, but the quiet, relentless courage it takes to live by demanding principles in a world full of easier paths. The courage to say "this is required of me," even when it meant personal sacrifice, exhaustion, or swimming against the current of what society deems "enough." It takes courage to make your inner compass your sole guide, especially when it points towards difficult terrain.

  We honour her **clarity**. Mira cut through the noise, the excuses, the comfortable ambiguities we often wrap ourselves in. She saw obligation where others saw only choice. This clarity wasn't harsh or judgmental in its essence – though her frustration with evasion could be sharp – it was a product of her intense focus on the reality of suffering and the possibility of alleviating it. She saw the map clearly, and she felt compelled to follow it.

  And we honour her **rejection of false modesty**. She wasn't falsely humble about what she did; she was *fiercely* opposed to it being framed as anything other than necessary. To call it "saintly" was, to her, to minimize the necessity. Her refusal of that praise wasn't modesty; it was a profound insistence on the *normality* of responding adequately to acute need.

  This clarity, this integrity, this courage – this is what made Mira Mira. It’s what made her a bedrock for her patients, a lifeline for Alex, a source of both exasperation and profound admiration for her friends in philosophy and effective altruism who wrestled with the same questions, and a deeply, sometimes challengingly, loving mother, daughter, sister, and friend.

  Nora, your mum wasn’t showing off. She was just being Mira. Fully, intensely, consistently Mira. She was being the person who looked at the world and saw work that needed doing, and then did it. That was her measure. Her necessity.

  For the rest of us, feeling the weight of her example, remember this: Mira’s necessity was *hers*. Born of her unique perception, her specific capacity, her unwavering internal compass. Her path was forged by her own clarity. Our obligations are our own, shaped by our own circumstances, capacities, and connections. Honouring Mira isn’t about matching her deeds kidney for kidney or dollar for dollar. It’s not a dare. It’s not a condemnation of lives lived differently. Honouring Mira is about recognising the power of living with integrity to your own deepest understanding of what is right and necessary. It’s about the courage to see clearly, to acknowledge the weight of the world without despair, and to act – in whatever ways are true and sustainable for *us* – on the conviction that we, too, owe something.

  Mira lived by a light that was often uncomfortably bright for the rest of us. She didn’t ask for praise for its brightness; she asked, implicitly, for us to acknowledge the things it illuminated. The best way to honour her fierce, demanding, beautiful spirit is not to try and become her, but to strive, in our own ways, with our own capacities, to live with the same unwavering commitment to our own necessary truths. To see clearly, to act accordingly, and to refuse to pretend that what is necessary is optional.

  We will miss her light terribly.

  ---

  **How This Addresses Your Requirements:**

  1.  **Supererogation as Structural Frame:** The entire eulogy wrestles with the tension Mira embodied: rejecting the supererogatory label while performing acts society deems "beyond duty." It explicitly rejects the easy praise ("saint," "hero," "generous," "selfless," "inspiration") she hated and explains *why* she rejected it (it misrepresented her actions as optional/extra).
  2.  **Lets People Off the Hook (Without Lying):** By grounding Mira's actions in *her personal* sense of necessity and integrity ("her necessity was *hers*," "her path was forged by her own clarity"), it explicitly decouples her standard from a universal moral demand. It states clearly: "Our obligations are our own... Honouring Mira isn’t about matching her deeds... It’s not a condemnation of lives lived differently." It frames the challenge as living by *your own* necessary truths, not Mira's.
  3.  **Honours Mira's Belief:** It centers her perspective ("For Mira, it was never about going *beyond* anything...", "she saw herself as doing what was, fundamentally, *owed*"). Praise is redirected to her *integrity, courage, clarity, and rejection of false modesty* – qualities inherent in consistently acting on her convictions, regardless of whether those acts were obligatory or supererogatory *by an external standard*.
  4.  **Avoids Pedestal/Show-Off:** Explicitly states "She wasn’t performing for praise. She wasn’t seeking admiration." Directly addresses Nora: "Nora, your mum wasn’t showing off. She was just being Mira."
  5.  **Addresses Burnout Risk:** Explicitly says "It’s not a dare." Emphasizes "Our obligations are our own... shaped by our own circumstances, capacities," and "act – in whatever ways are true and **sustainable** for *us*." The focus is on integrity and sustainability within one's own life, not unsustainable imitation.
  6.  **Language:** Avoids forbidden words. Uses plain language ("clarity," "necessity," "acted," "integrity," "courage") accessible to all. Concepts like integrity and acknowledging necessity are precise enough for philosophers without jargon. Atheist-compatible.
  7.  **Mira's Quote:** Central to the argument: "the whole idea of getting 'extra credit' for doing what was obviously required was a fiction..."
  8.  **Tone:** Warm, respectful, honest, grounded in her actions and character. Leaves space for Dave's humour later.
  9.  **Word Count/Time:** Approximately 980 words, fitting within a 7-minute delivery.

  This draft aims to be true to Mira's fierce spirit, comforting to her family (especially Nora), intellectually honest for her EA/philosophy friends, and freeing for everyone else, while subtly discouraging unsustainable emulation. It lets her own clarity and conviction structure the remembrance.
