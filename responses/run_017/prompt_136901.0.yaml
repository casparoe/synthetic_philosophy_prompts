  But note: in the finite case, we could in principle run a brute force search? So let's make the object so large that brute force is infeasible, and we are using heuristic programs that might not halt. Then we might be in a state where we know that program A didn't halt (so we don't have P) and program B didn't halt (so we don't have ¬P). Then we have no evidence for P ∨ ¬P.

