  But note: we can prove that LEM is not constructively valid by showing that if we had a universal algorithm to decide LEM for every such P, we could solve the halting problem, which is impossible.

  However, we are avoiding technicalities.

  Therefore, I recommend:

  Stick with the twin prime conjecture (or Goldbach) as the closing example, and use the finite pattern example to illustrate existence without a witness? But note: the pattern example is about having a proof (via the program) but losing the witness. That doesn't illustrate the rejection of LEM. It illustrates that we can have a proof of existence without having the witness at hand. That is acceptable in constructivism because the program did find the witness.

  To illustrate the gap between ¬¬P and P, we need:

  - We have a proof that ¬P is impossible (i.e., ¬¬P) but we don't have a proof of P.

  Example: In the pattern example, suppose we run a program that tries to prove that the pattern cannot occur (program B). And suppose we have a proof that program B is correct and that it ran and did not prove ¬P. Then we have ¬¬P. But we don't have P because we don't have a witness.

  But note: in the finite case, we could in principle run program A to get a witness? But what if program A is too slow? Or what if we don't have program A? We only have program B.

  So the example can work if we set it up as:
  - We have a very large finite object (like the digits of π up to a certain point, but too big to store) and we have two programs:
     * Program A: Searches for a pattern (e.g., a sequence of 100 consecutive 7s). It outputs "yes" and the location if found, but then we lose the location? Not necessary.
