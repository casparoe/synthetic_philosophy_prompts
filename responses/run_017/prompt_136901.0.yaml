  I. Introduction (1 minute)
     - Set up the puzzle: In classical logic, we take for granted that every statement is either true or false (LEM: P ∨ ¬P). But some mathematicians (constructivists) reject this. Why? And how can they do that without giving up on objective truth?
     - Address the common misconception: Rejecting LEM does not mean that we think some statements are neither true nor false, nor that we are skeptics about truth. It's about what counts as a proof.

  II. The Role of Proof (2 minutes)
     - What is a proof? In mathematics, a proof is not just about truth but about providing evidence. We want to know why something is true, not just that it is true.
     - Example: Consider a statement like "There exists a prime number between 1000 and 1010." We can check by hand and find 1009. The proof is the calculation. Now consider a statement that is more complex: "There is a pattern of a certain kind in a very long string." We might have a program that checks and says "yes", but then forgets the location. We know the pattern exists (because the program said yes) but we don't have a witness (the exact location). This is a situation where we have a proof of existence (the program's output) but we don't have a witness. However, note: the program itself is the witness? Not exactly: the program output "yes" because it found a witness at runtime, but then lost it. So we have evidence that a witness exists, but we don't have the witness itself.

  III. The Gap Between ¬¬P and P (2 minutes)
     - Explain double negation: In classical logic, ¬¬P is equivalent to P. But in constructive logic, they are not the same.
     - Using the example: We have the program that said "yes" (so we have P: the pattern exists). Now suppose we run a program that checks for the absence of the pattern and it outputs "no". That would be ¬P. But what if we run a program that checks for the absence and it fails to prove absence? That would be ¬¬P? Not exactly. We have to be careful.
     - Better: Suppose we try to prove that there is no pattern (¬P). We run a program that searches for the pattern and if it doesn't find it, it says "no". But if the program runs and doesn't halt? Then we don't have ¬P. Alternatively, if we have a program that checks for the pattern and halts with "yes", then we have P. If it halts with "no", then we have ¬P. But if we don't run the program? Then we don't know.
     - The key: In constructive mathematics, to assert P we must have a proof that provides a witness (or a method to find one). In our example, we have P because the program found a witness (even though we lost it, the program did find it). But what if we only have the failure to prove ¬P? That is not enough to assert P.

  IV. Why Reject LEM? (2 minutes)
     - LEM says that for any P, either P is true or ¬P is true. But in constructive mathematics, we require that for a statement to be true, we must have a proof (with the required evidence). For some statements, we don't have a method that will always decide P or ¬P.
     - Example: The twin prime conjecture. Let P be "there are infinitely many twin primes". We don't currently have a proof of P or ¬P. LEM would say that either there are infinitely many or there are not. But the constructivist says: until we have a proof one way or the other, we cannot assert P ∨ ¬P. That doesn't mean we think the statement is neither! It means we don't have grounds to assert the disjunction. The truth is fixed (objectively), but we don't know it and we require evidence to assert it.
     - Contrast with skepticism: The constructivist is not saying that we can never know the truth about twin primes. They are saying that until we have a proof, we cannot claim that either P or ¬P holds. But they are hopeful that we might one day prove one or the other.

  V. Addressing Misconceptions (1 minute)
     - Misconception 1: Constructivism means we don't know which side is true. Correction: It's not about knowledge but about what we are entitled to assert. We can only assert what we have proven.
     - Misconception 2: Denying LEM leads to tolerating contradictions or a third truth value. Correction: Constructive logic is still consistent and does not allow contradictions. There are only two truth values: true and false. But we are more careful about when we can assert a disjunction.
     - Misconception 3: It's just finitism or about machines. Correction: Constructivism is about the nature of proof, not about denying infinity. It can handle infinity (e.g., in intuitionistic analysis) but requires constructive methods. Also, proof assistants implement constructive logic but that doesn't settle the philosophical issue; they are tools that reflect a choice of logic.

  VI. Closing with a Question (1 minute)
     - End with: "So, for the twin prime conjecture: do you think we are entitled to say, right now, that either there are infinitely many twin primes or there are not? And if you say yes, what kind of evidence do you have for that disjunction?"
     - What to refuse: We are not going to get into the technical details of intuitionistic logic or the formal semantics. We are focusing on the philosophical stance about proof and truth.

