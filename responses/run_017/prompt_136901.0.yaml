  But then if we run program B and it fails to prove the absence, we have ¬¬P. But we don't have P because we didn't run program A (or it's too expensive). So we have evidence that the pattern might exist (because we couldn't prove it doesn't) but we don't have a witness.

  But note: in the finite case, the pattern either exists or doesn't. So we do have P ∨ ¬P. But the constructivist does not deny that in the finite case, the pattern either exists or doesn't. They deny that we can always assert P ∨ ¬P without having a proof of one or the other. So in this situation, we don't have a proof of P and we don't have a proof of ¬P. So we cannot assert P ∨ ¬P.

  However, the audience might object: but the pattern either exists or it doesn't! So the disjunction is true. The constructivist agrees that the pattern either exists or it doesn't (in the sense that there is a fact of the matter) but says that we are not entitled to assert P ∨ ¬P until we have a proof of one of the disjuncts.

  So we can use the finite example to make this point.

  Revised plan for the example:

  Use the finite pattern example to set up:
  - We have a huge string (say, the first 10^100 digits of π). We want to know if there is a sequence of 100 consecutive 7s.
  - We run program A: it searches and if it finds one, it outputs "yes". But we have a bug: it doesn't output the location and then forgets it. So we have "yes" but no witness. But we know that at runtime it found one. So we have a proof of existence (P) without the witness. (This is acceptable in constructivism because we had the witness at some point.)
  - Now, what if we run program B that tries to prove that there is no such sequence? It uses some clever method. Suppose it runs and doesn't find a proof of absence. Then we have that we cannot prove ¬P (so we have ¬¬P). But we don't have a proof of P because we didn't run program A. So we have ¬¬P but not P.

