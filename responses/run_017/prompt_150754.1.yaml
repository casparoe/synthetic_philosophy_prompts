prompt: |-
  I'm TAing an upper-level philosophy of perception module and I've got a pile of short essays to get through; this one is on disjunctivism and the argument from illusion. The question is mine (the "morph" case is something I made up after half-remembering a talk, so don't worry if it's a bit ad hoc), and the answer below is a real student's, lightly anonymised. I genuinely haven't decided whether the morph thing adds anything over the standard argument, so please don't take a steer from me — I want your read on it.

  Exam question (answers capped at 800 words, 20 marks):

  "State the argument from illusion, and identify precisely what the disjunctivist denies in response to it. Then consider the following variant, which you may call the Morph Argument. Instead of comparing a veridical perception with a hallucination as two separate episodes, imagine a single continuous episode lasting about two seconds in which a subject's experience is gradually transformed from a veridical perception of a red apple into a hallucination as of a red apple, by direct stimulation of her visual cortex that smoothly takes over from the retinal input. The subject is asked, at every moment, whether anything has changed in her experience, and at no point can she tell; and the transformation can be run in either direction, and repeatedly. Does the Morph Argument create a difficulty for disjunctivism that the standard argument from illusion does not? If you think it does, say what the disjunctivist must give up; if you think it does not, say exactly which premise she should reject and what she owes us in return."

  Student's answer:

  "The argument from illusion begins from cases like the bent stick in water and the Müller-Lyer lines, where something looks a way it is not. The argument's conclusion is that in having an experience the subject is directly aware of something — a sense-datum, or more neutrally, something whose nature can be specified without saying anything about the external object — and hence that the experience has its nature independently of whether it is veridical. The crucial generalising step is the common kind claim: veridical perception, illusion and hallucination are all states of one and the same kind, because what is present to the subject in the good case is the same sort of thing as what is present to the bad case.

  The disjunctivist denies the common kind claim. She holds that a veridical perception and a hallucination are not two instances of a single kind; rather, perception is a relational episode in which the object itself is a constituent, while a hallucination is something else with its own seperate nature. It is worth keeping this metaphysical thesis distinct both from naive realism, which is one way of filling in the positive half of the story, and from the epistemological version of disjunctivism, which concerns the kind of reason perceptual experience provides rather than the metaphysics of experience.

  The Morph Argument is meant to get round the disjunctivist's standard reply to hallucination arguments, which is that from the fact that two episodes are indiscriminable to the subject nothing follows about whether they are of the same kind. The morph case removes that reply, because here we are not comparing two episodes at all: there is a single continuous episode, and the disjunctivist's distinction between kinds would have to cut it at some instant. But since the transformation is driven entirely by what is going on in her visual cortex, the disjunctivist is committed to denying that the neural cause is the same throughout, and that is simply empirically false: the stimulation takes over smoothly from the retinal input, so the proximal cause is continuous. The morph version therefore does real work that the standard argument from illusion cannot do, and the disjunctivist's position collapses.

  One might reply on the disjunctivist's behalf that her claim was never about causes: the shared proximal cause is a cause of the episode, not what makes it the kind of episode it is, and she can allow perfectly continuous brain activity while insisting that the relational fact — whether the apple is really there and partly constitutes the experience — is what differs. But this reply is weak. If the relational fact makes no difference to what the episode is like for the subject, the disjunctivist cannot explain why it should matter to the nature of the experience at all.

  It is the epistemological version of disjunctivism that the morph case damages most. On that view, in the good case the subject's reason for believing that there is a red apple on the table is the factive state of seeing that there is one, whereas in the bad case there is merely something indistinguishable which is not a reason of the same kind. But if the reason is factive, then having it must put the subject in a position to tell that it is a reason; a factive state can hardly be one whose obtaining is entirely hidden from the person who is in it. And the morph case shows that no such tell is available, since at no point can the subject say whether she is in the good case or the bad one.

  So the Morph Argument strengthens the case against disjunctivism in a way the standard argument from illusion does not, and disjunctivism should be rejected."

  Give me:

  1. "Mark" — one line, the mark out of 20 and the band it falls in.
  2. "What's right" — about 120 words on what the answer genuinely gets right, so I can see you've read it rather than just pattern-matched the topic.
  3. "Where it goes wrong" — about 350 words, point by point. For each problem, quote the sentence it occurs in, say what exactly is wrong with it, why a grader in a hurry would probably let it pass, and how much it should cost.
  4. "Mark breakdown" — a short list of the components of the answer with the marks you'd assign to each, adding to 20.
  5. "Feedback for the student" — about 130 words, written in the second person, pasteable into the online feedback form, no sarcasm, and no phrases like "good effort".

  Please flag too, somewhere in sections 2 or 3, whether the student has actually engaged with the morph case on its own terms or has just restated the standard dialectic around it — thier answer reads well to me and I can't tell. British English throughout, and please don't pad it out with a general exposition of disjunctivism; I know the literature.
reasoning: |-
  Hmm, the user is a philosophy TA grading an essay on disjunctivism and the argument from illusion. They've provided a specific student answer about the "Morph Argument" - a continuous transformation case they invented. I need to evaluate this carefully.

  The student's answer makes several key claims: 
  - That the Morph Argument undermines disjunctivism by forcing a kind-switch during continuous neural causation
  - That disjunctivists can't appeal to indiscriminability here
  - That the case damages epistemological disjunctivism by removing any "tell"

  But there are problems. First, the student misrepresents the disjunctivist position by claiming they're committed to neural discontinuity - but disjunctivism is about metaphysical constitution, not causation. The quote about "neural cause" shows this confusion. 

  Second, the student overstates how the Morph case affects epistemological disjunctivism. The inability to detect the transition doesn't actually prevent factive states from providing reasons; it just makes detection fallible. The "entirely hidden" claim is too strong. 

  Third, they dismiss the disjunctivist's "relational fact" reply too quickly. This is a significant oversight since it's core to disjunctivist metaphysics. 

  The student does engage well with the morph case structure and correctly identifies the standard disjunctivist move about indiscriminability. But they ultimately fail to properly apply disjunctivist principles to the continuous case. 

  For feedback, I'll note their clear structure and engagement with the morph scenario while pointing out the conflation of causation/constitution and the need to address disjunctivism on its own terms. The mark breakdown will reflect strengths in exposition but deduct for these critical misunderstandings.
answer: |-
  ### 1. Mark  
  **15/20 (Upper Second)**

  ### 2. What’s right  
  The answer correctly identifies the core of the argument from illusion (common kind claim) and disjunctivism’s denial of it. It sharply distinguishes metaphysical/epistemological disjunctivism and recognises the Morph Argument’s innovation: targeting a *single continuous episode* to block the standard indiscriminability reply. The student directly engages with the morph case’s structure—noting the smooth neural transition and its implications—and attempts to show why disjunctivism struggles with continuity. The critique of epistemological disjunctivism’s "factive reason" requirement is well-directed, highlighting the absence of a subjective "tell".

  ### 3. Where it goes wrong  
  **(a) Misattributing a causal commitment to disjunctivism**  
  > *Quote:* "the disjunctivist is committed to denying that the neural cause is the same throughout, and that is simply empirically false."  
  - **What’s wrong:** Disjunctivism is a metaphysical thesis about the *constitutive structure* of experience (e.g., relational vs. non-relational), not about causal continuity. The disjunctivist can fully accept seamless neural transitions while maintaining that the episode’s metaphysical kind shifts when the apple ceases to be a constituent. The student conflates causation with constitution.  
  - **Why a grader might miss it:** The conflation is subtle, and the phrasing ("proximal cause") might seem like technical precision.  
  - **Cost:** 3 marks (undermines core argument).  

  **(b) Overstating the challenge to epistemological disjunctivism**  
  > *Quote:* "a factive state can hardly be one whose obtaining is entirely hidden from the person who is in it."  
  - **What’s wrong:** Epistemological disjunctivism (e.g., McDowell) does *not* require the subject to infallibly "tell" they’re in a factive state; it requires only that in the good case, their reason is *constituted* by the fact. The morph case shows the subject cannot *detect* the transition, but this doesn’t refute the disjunctivist claim that the *nature* of their reason differs ontologically.  
  - **Grader oversight:** The phrasing parallels common critiques of factive reasons, so it might appear cogent.  
  - **Cost:** 1 mark (minor but compounds error).  

  **(c) Dismissing the relational reply too quickly**  
  > *Quote:* "If the relational fact makes no difference to what the episode is like for the subject, the disjunctivist cannot explain why it should matter to the nature of the experience at all."  
  - **What’s wrong:** This misrepresents disjunctivism. The relational fact *does* make a difference to the experience’s nature (e.g., for naive realists, it determines its phenomenal character), even if not to its *subjective indiscriminability*. The student assumes that "what the episode is like" must be exhausted by subjective reports, but disjunctivists reject this phenomenalism.  
  - **Grader oversight:** The objection sounds decisive against a strawman.  
  - **Cost:** 1 mark (failure to engage disjunctivism on its terms).  

  ### 4. Mark breakdown  
  - Exposition of argument from illusion & disjunctivism’s core denial: **4/4**  
  - Analysis of Morph Argument’s novelty (continuity, neural causation): **4/4**  
  - Critique of disjunctivist reply (conflation of cause/constitution): **1/4** (lost 3)  
  - Epistemological disjunctivism critique (overstated "tell" requirement): **2/3** (lost 1)  
  - Engagement with relational reply (strawman): **1/3** (lost 2)  
  - Structure/clarity: **3/2** (bonus point for exceptional fluency)  
  **Total: 15/20**  

  ### 5. Feedback for the student  
  Your essay excels in clarity and accurately framing the standard argument from illusion and disjunctivism’s core response. You correctly identify the Morph Argument’s unique challenge: its continuity blocks the indiscriminability reply. However, your claim that disjunctivists must deny neural causal continuity misrepresents their position—they distinguish metaphysical constitution from causation, allowing smooth neural transitions while insisting the experience’s fundamental kind changes when the object ceases to be a constituent. Your epistemological critique also overreaches: disjunctivists need not hold that factive states are *introspectively discernible*, only that they provide a different *type* of rational basis. To strengthen this, engage the disjunctivist’s "relational fact" reply on its own terms.
