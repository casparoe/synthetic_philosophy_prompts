  **Leaf Definitions**  
  - **A. Astrobiology**: Life is a self-sustaining chemical system capable of open-ended evolution.  
  - **B. Metabolism-First**: Life requires autonomous self-regeneration via metabolic cycles.  
  - **C. Evolution-First**: Life is any replicator system capable of Darwinian evolution, regardless of substrate.  
  - **D. Genealogical**: Life is defined by shared descent from a reproductive ancestor, not current capacities.  
  - **E. Terrestrial Chemistry**: Life must be based on Earth-like carbon-water biochemistry.  
  - **F. Pluralist**: Life is a cluster concept; no single trait is necessary if enough are present.  
  - **G. Eliminativist**: "Life" has no precise boundary; it is a folk category with context-dependent utility.  
  - **H. Unoccupied: Incoherent** (as above).  
  - **I. Unoccupied: Unexplored** (as above).  
  - **J. Unoccupied: Unattractive** (as above).  

