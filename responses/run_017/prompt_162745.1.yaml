answer: |-
  ### The Scenario
  A paramedic on a chaotic night shift faces two emergency calls. One is a car crash with a single victim pinned in the wreckage; if she goes immediately, she can definitely free and save them. The other is a flooded basement where five people are trapped; if she attempts a high-risk pump operation, there’s a 40% chance she’ll drain the water in time to save all five, but a 60% chance the pump fails and all five drown. She has time for only one response. If she does nothing, all six die.

  ---

  ### How the Views Respond
  **(a) Expected lives saved:** This view maximises the statistical expectation of survival. Saving the one guarantees 1 life saved. The basement gamble has an expected yield of 2 lives saved (40% × 5). Since 2 > 1, this view demands attempting the basement rescue. The extra life expected justifies sacrificing the certain rescue.

  **(b) Anti-numbers view:** No person’s claim is stronger, so the numbers alone don’t matter. Crucially, saving the crash victim definitely honours one claim. The basement gamble might honour five claims or none—it risks total failure. Since we owe each person a duty not to abandon their claim for mere aggregation, we must take the certain opportunity to rescue someone. We should save the one determinately. (It’s not *quite* forced—e.g., if the pump chance were 99%, the risk might be tolerable—but at 40%, it’s clear.)

  **(c) Lottery view:** Claims are equal, so fairness requires equal ex ante survival chances. A weighted lottery could give the crash victim a 2/7 chance of rescue and the basement a 5/7 chance of attempt (yielding each trapped person a 2/7 survival chance overall). But determinately choosing either option fails fairness. Here, unlike (b), the anti-numbers stance rejects the lottery as irrelevant to duty.

  ---

  ### The Single Feature Doing the Work
  The key is the **asymmetric risk in claim satisfaction**: saving the one honours a claim certainly; the group option risks honouring none. Remove this (e.g., if the basement rescue had 100% success), and expected lives saves the five (5 > 1), while anti-numbers reverts to "no reason to prefer either"—potentially requiring a coin toss. The case collapses to the usual stand-off.

  ---

  ### Is Anti-Numbers Smuggling in Expected Utility?
  No. Expected utility aggregates outcomes across people (e.g., 40% × 5 = 2). The anti-numbers view rejects aggregation entirely. It focuses per person: the certain rescue *actually fulfils* a duty to one individual; the gamble *might* fulfil duties to five but risks fulfilling none. This is about honouring claims directly, not maximising their expected satisfaction. A sharp reader might *prefer* expected utility, but the logic here is distinct and self-contained.

  ---

  ### How a Numbers Defender Wriggles Out
  A numbers defender might argue that *expected claims satisfied* still matters ethically: the basement attempt expects to satisfy 2 claims (40% × 5), versus 1 for the crash. Since claims are equal, maximising their expected fulfilment is rational. This reframes the gamble as superior duty-honouring overall—but it concedes that anti-numbers has a point about certainty and might accept a "risk threshold" (e.g., only gamble if success probability exceeds 20%). The core disagreement persists.
