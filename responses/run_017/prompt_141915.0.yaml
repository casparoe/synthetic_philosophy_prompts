  ### Regularity Assurance Procedure for Epidemiological Models

  **Purpose**: Classify model regularities into one of four tags based on their extrapolation risk, using tests grounded in both major philosophical accounts of laws of nature. Outputs a one-page register entry for senior modeller sign-off.

  **Inputs**:  
  - A single regularity (e.g., fitted curve, structural assumption).  
  - Available data (historical, experimental, or model-generated).  
  - Model documentation (mechanism descriptions, context of derivation).  

  **Output Tags**:  
  1. **Exportable law**: Extrapolate freely (even to novel contexts).  
  2. **Effective or derived regularity**: Extrapolate only under stated conditions (e.g., similar settings, with monitoring).  
  3. **Local coincidence**: Do not extrapolate; use only for descriptive purposes in observed conditions.  
  4. **Not decidable**: Escalate; insufficient data to classify.  

  **Procedure** (run in order; max 60 minutes/regularity):

  ---

  #### **Step 1: Test 1 (Humean Best-Systems Test)**  
  *Tests if the regularity earns its keep by simplifying/strengthening the overall model system.*  
  - **Question**: If removed, would the model require ≥3 new ad-hoc rules or lose predictive coverage of ≥2 other phenomena?  
  - **Method**:  
    - Map the regularity’s role in the model (e.g., does it unify disjoint observations?).  
    - Simulate removal: Check complexity changes (e.g., parameters added, code lines increased).  
  - **Threshold**: Pass if removal objectively increases complexity/weakens coverage.  
  - **Judgment call**: If complexity impact is ambiguous, mark "Unclear—escalate to sign-off."  
  - **Time**: 10 minutes.  

  #### **Step 2: Test 2 (Non-Humean Mechanism/Intervention Test)**  
  *Tests if a mechanism explains the regularity and if it holds under virtual interventions.*  
  - **Subtest 2a (Mechanism)**:  
    - **Question**: Is there a widely accepted causal mechanism (e.g., biologically/socially grounded) explaining *why* the regularity holds?  
    - **Method**: Check model docs and literature (e.g., WHO/CDC reports, peer-reviewed mechanisms).  
    - **Threshold**: Pass if mechanism is established (e.g., airborne transmission physics). Fail if absent or speculative.  
  - **Subtest 2b (Intervention)**:  
    - **Question**: When input variables are perturbed in the model, does the regularity hold in ≥80% of cases?  
    - **Method**: Run 10 virtual interventions (e.g., shift school dates, alter occupancy). Use existing sensitivity tools.  
    - **Threshold**: Pass if regularity persists in ≥8/10 runs.  
    - **Judgment call**: Threshold sensitivity (e.g., 80% vs. 90%) must be set by sign-off.  
  - **Overall Pass**: Both 2a and 2b must pass.  
  - **Time**: 25 minutes.  

  #### **Step 3: Test 3 (Projectability of Predicates)**  
  *Tests if terms (e.g., "school reopening") are non-arbitrary and projectable (avoids "grue" problem).*  
  - **Question**: Are all terms in the regularity:  
    - (a) **Standardized** (e.g., defined in epidemiology textbooks)?  
    - (b) **Non-context-dependent** (e.g., not "days with school reopening *and* full moons")?  
  - **Method**: Compare against domain ontologies (e.g., ICD-11, Epi concept glossaries).  
  - **Threshold**: Pass if all terms are standardized and non-arbitrary. Fail if any term is context-bound or idiosyncratic.  
  - **Judgment call**: Escalate if disagreement (e.g., novel terms).  
  - **Time**: 10 minutes.  

  #### **Step 4: Test 4 (Exceptionless Pattern vs. Coincidence)**  
  *Tests if the regularity holds across varied initial conditions (not just observed data).*  
  - **Question**: Has the regularity been observed under ≥3 distinct contexts (e.g., regions, seasons, strains) without adjustment?  
  - **Method**: Audit data sources for contextual diversity (e.g., multiple waves, demographic variants).  
  - **Threshold**: Pass if found in ≥3 contexts. Fail if confined to one setting (e.g., single region) or requires re-fitting.  
  - **Time**: 10 minutes.  

  #### **Step 5: Tag Assignment & Permitted Use**  
  - Apply tags **in order** (stop at first match):  
    1. **Exportable law**: Passes **all 4 tests**.  
       - *Permitted use*: Extrapolate freely.  
    2. **Effective or derived regularity**: Passes **Test 2 (Mechanism/Intervention) AND Test 3 (Projectability)**, *regardless of others*.  
       - *Permitted use*: Extrapolate only under conditions matching Test 4’s contexts (if passed) or observed settings (if failed).  
    3. **Local coincidence**: **Fails Test 2 OR Test 3** (even if others pass).  
       - *Permitted use*: Do not extrapolate; descriptive use only.  
    4. **Not decidable**: **Insufficient data** to run any test (e.g., missing mechanism docs, no intervention capability).  
       - *Permitted use*: Escalate; do not use.  
  - **Conflict resolution**:  
    - If Humean (Test 1) and non-Humean (Test 2) tests disagree (e.g., Test 1 passes but Test 2 fails), **default to the more restrictive outcome** (e.g., failure in Test 2 overrides Test 1).  

  ---

  ### **What This Procedure Cannot Catch**  
  - **Emergent violations**: Regularities broken by unseen factors (e.g., new variants, policy shocks).  
  - **Confounding bias**: Data artifacts masquerading as laws (e.g., testing delays affecting case-admission lags).  
  - **Model misspecification**: Flaws in core model structure (e.g., wrong compartmental assumptions).  
  - **Value-laden thresholds**: Risks of false extrapolation hinge on ethical/political choices (e.g., acceptable error rates).  
  - **Black swans**: Extremely low-probability events outside tested interventions.  

  ---

  ### **Example Runs**  
  #### **Regularity 1**: *In all 14 regions, epidemic peaks follow school reopening by 18–22 days (fitted delay parameter).*  
  - **Test 1 (Best-Systems)**: Pass. Unifies regional dynamics; removal would require region-specific rules.  
  - **Test 2 (Mechanism/Intervention)**:  
    - *2a (Mechanism)*: Pass. Mechanism: Schools increase contact rates (CDC-established).  
    - *2b (Intervention)*: Pass. 10/10 virtual delays shifted peaks by 18–22 days.  
  - **Test 3 (Projectability)**: Pass. "School reopening" is standardized (OECD definition).  
  - **Test 4 (Exceptionless)**: Pass. Observed in 14 regions (diverse demographics, seasons).  
  - **Tag**: **Exportable law**.  
  - **Permitted use**: Extrapolate freely to new regions/seasons.  

  #### **Regularity 2**: *Transmission rises with indoor occupancy via power law (stable exponent); airborne mechanism; known exceptions.*  
  - **Test 1 (Best-Systems)**: Pass. Simplifies dose-response modeling.  
  - **Test 2 (Mechanism/Intervention)**:  
    - *2a (Mechanism)*: Pass. Airborne dose physics (WHO-confirmed).  
    - *2b (Intervention)*: Pass. 9/10 occupancy changes followed power law (one exception: high humidity).  
  - **Test 3 (Projectability)**: Pass. "Indoor occupancy" is standardized (persons/m²).  
  - **Test 4 (Exceptionless)**: **Fail**. Exceptions in 2/10 settings (e.g., ventilated factories).  
  - **Tag**: **Effective or derived regularity** (passes Tests 2 & 3, fails 4).  
  - **Permitted use**: Extrapolate only in settings matching training data (non-humid, moderate ventilation).  

  ---

  #### **Regularity 3**: *Hospital admissions lag reported cases by 6 days (stable across 3 years of national data).*  
  *Assume worst-case tag (local coincidence) for illustration:*  

  **REGISTER ENTRY**  
  **Regularity ID**: HOSP-LAG-6  
  **Description**: Hospital admissions lag reported cases by 6 days (±0.5 days).  
  **Source**: National surveillance data (2020–2023).  
  **Tests**:  
  1. **Best-Systems (Test 1)**: Pass. Central to admission forecasting; removal would require dynamic lag modeling.  
  2. **Mechanism/Intervention (Test 2)**:  
     - *2a (Mechanism)*: **Fail**. No mechanism explains fixed 6-day lag (clinical literature shows 3–10-day variability).  
     - *2b (Intervention)*: **Fail**. Only 5/10 virtual case surges yielded 6-day lags; others showed 4–8 days (e.g., elderly surge).  
  3. **Projectability (Test 3)**: **Fail**. "Reported cases" is non-projectable: Testing policies changed 4× in 3 years (PCR/RAT mix, eligibility).  
  4. **Exceptionless (Test 4)**: Pass. Observed nationally across 3 waves (Delta, Omicron BA.1/BA.5).  
  **Tag**: **Local coincidence** (fails Test 2 and Test 3).  
  **Permitted Use**: Do not extrapolate. Only valid for historical description under 2020–2023 national testing policies.  
  **Escalation Notes**:  
  - Mechanism failure: Clinical evidence rejects fixed lags.  
  - Predicate failure: "Reported cases" definition drifted.  
  - Recommend: Replace with stratified lags (age/variant-specific).  
  **Analyst**: Jane Doe  
