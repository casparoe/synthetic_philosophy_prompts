  --- 

  **Procedure Validation**:  
  - **Philosophical neutrality**:  
    - Test 1 reflects Humean "best systems" (simplicity/strength).  
    - Test 2 reflects non-Humean "governing laws" (mechanisms/interventions).  
  - **Practical limits**: Designed for analysts without philosophy training; uses existing data/tools.  
  - **Ethical grounding**: Explicitly routes value judgments (e.g., risk thresholds) to sign-off.  

  **Next Steps**:  
  - Pilot with analysts; refine thresholds.  
  - Pair with statistical checks (e.g., confidence intervals) in broader audit.
