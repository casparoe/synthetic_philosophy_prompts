  **Test 1 (Humean: Best Systems):** 
     - *Question:* Does this regularity significantly simplify or strengthen the overall system of regularities we accept? Specifically, if we remove this regularity, would we need many more complex regularities to cover the same phenomena? 
     - *Passing threshold:* The regularity is part of a compact set that covers multiple phenomena and its removal would lead to a noticeable increase in complexity (e.g., requiring more than two additional ad-hoc rules to cover the same cases). The analyst should look at the model and see if the regularity is used in multiple places or if it unifies several observations. 
     - *Note:* This requires judgment about the model structure. If unclear, escalate to the sign-off.

  **Test 2 (Non-Humean: Mechanism and Intervention):** 
     - *Question:* Is there a plausible mechanism that would explain why the regularity holds? And can we test the regularity by intervention in the model? 
     - *Subtest 2a (Mechanism):* Is there a well-established causal story (from biology, physics, social science) that explains the regularity? (e.g., airborne transmission explains why occupancy affects transmission). 
     - *Subtest 2b (Intervention):* Can we manipulate the model to change the input variables (e.g., via a virtual experiment) and see if the regularity still holds? For example, if we change the school reopening date in the model, does the peak shift accordingly? 
     - *Passing threshold for 2a:* The mechanism is described in the literature and is widely accepted (e.g., by WHO or CDC) or is a direct consequence of basic science. 
     - *Passing threshold for 2b:* When we run the model with interventions (e.g., changing the input) the regularity holds in at least 80% of the cases (or a predetermined threshold set by the modeller). The threshold for how many tests to run and the acceptance rate should be set by the senior modeller during sign-off. 
     - *Note:* If the mechanism is absent or weak, but the intervention test passes, it might still pass this test. If the mechanism is strong but the intervention test fails, it fails.

  **Test 3 (Projectability of Predicates):**
     - *Question:* Are the terms in the regularity (like "school reopening", "indoor occupancy", "hospital admissions") defined in a way that is not arbitrary? Do they correspond to natural kinds or well-established categories in epidemiology? 
     - *Passing threshold:* The terms are standard in the field and not defined in a way that is tied to a particular context (e.g., "grue" is defined with reference to time, so it fails). For example, "school reopening" is a clear event, but if we defined a category like "days that are either during school term or during a full moon", that would be arbitrary. 
     - *Note:* This is a judgment call. If the predicates are arbitrary, the regularity is less likely to project.

  **Test 4 (Exceptionless Pattern vs. Coincidence):**
     - *Question:* Is there evidence that the regularity holds under a variety of initial conditions? Or is it limited to the specific conditions we have observed? 
     - *Passing threshold:* The regularity has been observed in at least three different contexts (e.g., different regions, different time periods, different strains) without being adjusted. If the regularity breaks when conditions change (e.g., a new variant emerges), then it is more likely a coincidence of initial conditions. 
