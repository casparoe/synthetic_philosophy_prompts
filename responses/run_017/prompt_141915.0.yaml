  4. **Exceptionless Pattern (Test 4):** Fail.  
     - _Reason:_ Although observed over three years, the pattern is not stable when reporting criteria change. We do not have evidence from different reporting systems (only one country) and the pattern breaks when criteria change.

  **Tag:** Local coincidence.  
  **Permitted Use:** Do not extrapolate. This regularity may only be used for descriptive purposes in the exact historical context of the national data with the same reporting criteria. It must not be used for forecasting or policy setting in any other context.  
  **Escalation Notes:** The regularity is critical to the model. Consider redefining the regularity with standardized case reporting or collecting data under controlled reporting conditions.  
  **Analyst:** [Name]  
  **Date:** [Date]  
  **Sign-off:** [Senior Modeller's Name and Date]  

  ---

  **Procedure Limitations:**
     - Cannot account for changes in the world that haven't been observed (e.g., new variants).
     - Relies on the current model structure; if the model is misspecified, the tests might pass incorrectly.
     - Cannot detect confounders that are not in the model.
     - The projectability test (Test 3) is subjective and may require domain expertise.
     - The intervention test (Test 2b) is only as good as the model's ability to simulate interventions.

  **Final Procedure:**

  1. **Test 1 (Best Systems):** 
     - Question: Does the regularity significantly simplify the overall model system?
     - Method: Check if removing the regularity would require adding multiple ad-hoc rules. 
     - Threshold: If removal leads to >2 new rules or a significant increase in complexity, pass. Otherwise, fail. If unclear, escalate.
     - Time: 10 minutes.

  2. **Test 2 (Mechanism and Intervention):**
     - Subtest 2a (Mechanism):
          - Question: Is there a widely accepted mechanism?
          - Method: Check literature (CDC, WHO, textbooks). 
          - Threshold: If established mechanism exists, pass; else, fail.
          - Time: 10 minutes.
     - Subtest 2b (Intervention):
          - Question: Does the regularity hold when we intervene on the input in the model?
          - Method: Run at least 10 virtual experiments (vary input) and record if output changes as expected.
          - Threshold: If >=80% of experiments confirm, pass; else, fail. (Note: The 80% threshold must be set by the senior modeller during sign-off.)
          - Time: 20 minutes.

  3. **Test 3 (Projectable Predicates):**
     - Question: Are the terms non-arbitrary and standard?
     - Method: Check if the terms are defined in a stable, non-context-dependent way in the epidemiological literature.
     - Threshold: Pass if standard and non-arbitrary; fail if not. If unsure, escalate.
     - Time: 10 minutes.

  4. **Test 4 (Exceptionless Pattern):**
     - Question: Has the regularity been observed in at least three distinct contexts (e.g., regions, time periods, strains) without adjustment?
     - Method: Review data sources.
     - Threshold: Pass if >=3 contexts; fail otherwise.
     - Time: 10 minutes.

  **Tag Assignment:**
     - If all pass: Exportable law.
     - If Test 2 and 3 pass: Effective or derived regularity.
     - Otherwise: Local coincidence.
     - If any test is not runnable due to insufficient data: Not decidable.

  **Note:** For Effective or derived regularity, the permitted use depends on Test 4:
     - If Test 4 passed: Extrapolate under conditions (specify similar contexts).
     - If Test 4 failed: Use only in the exact contexts observed.

  **When tests disagree:** If the regularity fails any of Tests 2, 3, or 4, it gets local coincidence (or not decidable if due to data). The only exception is when it passes 2 and 3 (then effective) even if 4 fails.

  **Total Time:** ~50 minutes.

  **End of Procedure.**
