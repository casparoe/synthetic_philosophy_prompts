  ## MEMORANDUM  
  **TO:** University Senate  
  **FROM:** Senate Committee on Conflicts of Interest  
  **DATE:** September 28, 2024  
  **SUBJECT:** Recommendation on Conflict of Interest Complaint & Policy Revision for Junior Faculty Research Fellowship  

  ---

  ### I. EXECUTIVE SUMMARY  
  This memo addresses (1) the resolution of Complaint #2024-JFRF-07 regarding a past doctoral supervisor’s participation in evaluating their former student’s fellowship application, and (2) recommends a revised conflict of interest (COI) policy for fellowship review panels. We propose replacing rigid recusal requirements with a **Declared Partiality System** to preserve expertise while increasing transparency.  

  **Immediate Actions:**  
  - **Complaint Resolution:** Uphold the award but require a blinded re-review of the funded and runner-up proposals by a neutral panel.  
  - **Interim Guidance (Spring 2025):** All reviewers *must* disclose past doctoral supervisory relationships with applicants.  
  - **Final Policy Recommendation:** Adopt Declared Partiality for all future panels (effective Fall 2025).  

  ---

  ### II. ANALYSIS OF COMPLAINT #2024-JFRF-07 & RECOMMENDED RESOLUTION  
  **Background:** A reviewer evaluated a former doctoral student (degree conferred 6 years ago), did not recuse, and scored the proposal highly. The proposal was funded. The runner-up alleges bias.  

  **Committee Findings:**  
  1. **No Violation of Current Policy:** Our rules mandate recusal only for family, financial ties, or *current* supervisory roles. Past supervision is unregulated.  
  2. **Procedural Flaw:** While technically compliant, the reviewer’s failure to disclose the prior relationship undermined perceived fairness. The claim that only they could assess the proposal’s originality is unverifiable and risks institutional bias.  

  **Resolution:**  
  - **Uphold the Award:** No retroactive penalty for actions not prohibited by policy.  
  - **Remedial Action:** The funded proposal and the runner-up’s proposal will be re-reviewed by a new panel of 3 reviewers with no ties to either applicant. Scores will be averaged with the original (minus the contested reviewer’s score). If the runner-up’s revised score exceeds the funded proposal’s, they will receive the next available fellowship.  
  - **Communication to Complainant:**  
    > "The Committee finds no violation of existing policy. However, the lack of disclosure compromised procedural fairness. We are conducting a blinded re-review of both proposals. Should your revised score rank higher, you will receive the next fellowship award. We are also revising our policy to prevent future ambiguity."  

  ---

  ### III. RECOMMENDED POLICY REVISION: DECLARED PARTIALITY SYSTEM  
  **Core Problem with Current Model:**  
  Our existing recusal rules are both *over-inclusive* (excluding knowledgeable evaluators based on outdated ties) and *under-inclusive* (ignoring negative biases like personal animus, rivalry, or past conflicts). This creates a "recusal ratchet" that dilutes expertise while allowing undisclosed animosity to influence decisions.  

  **Proposed Solution: Declared Partiality**  
  1. **Mandatory Pre-Review Disclosure:**  
     - All reviewers submit a declaration categorizing their relationship with each applicant:  
       - **A. Positive Partiality (e.g.,** Past supervisor/student, close collaborator <5 yrs, familial/financial tie)  
       - **B. Negative Partiality (e.g.,** Known rivalry, past intellectual conflict, personal grievance)  
       - **C. Neutral/No Significant Tie**  
     - *Examples:* "Applicant X: Former doctoral student (2018), Positive Partiality." / "Applicant Y: Co-author on rejected grant (2022), Negative Partiality."  

  2. **Structured Mitigation (not automatic recusal):**  
     - **Positive/Negative Partiality:** Reviewer’s score is included but flagged. A second "neutral" reviewer (Category C) scores the same application independently. The final score is the average of both.  
     - **Neutral:** Score stands without adjustment.  
     - *Chair’s Role:* Resolve ambiguities; ensure declarations are submitted; assign neutral reviewers for mitigation.  

  **Why This Works:**  
  - **Retains Expertise:** Knowledgeable reviewers stay on panels.  
  - **Captures Hidden Biases:** Negative partiality is made visible and managed.  
  - **Transparent & Fair:** Declarations are documented and offset, not ignored or over-penalized.  
  - **Practical:** Less disruptive than mass recusals; scalable for small fields.  
  - **Builds Trust:** Demonstrates proactive management of real-world relationships.  

  **Implementation Timeline:**  
  - **Oct 15, 2024:** Senate votes on policy.  
  - **Nov 1, 2024:** Draft disclosure forms/training finalized.  
  - **Jan 15, 2025:** Training session for spring fellowship panel chairs.  
  - **Spring 2025:** Interim disclosure rule (past supervisors only).  
  - **Fall 2025:** Full Declared Partiality System implemented.  

  ---

  ### IV. THE LENS OF ROLE ETHICS: A FAIR HEARING FOR THE COUNTERVIEW  
  **The Core Argument (Strong Version):**  
  Relationships generate enduring ethical obligations. A doctoral supervisor who disclaims all connection to a former student doesn’t achieve objectivity—they betray the ongoing meaning of mentorship. Institutions err by assuming bias is eliminated only through detachment. True fairness requires acknowledging that evaluators are *embedded* in relationships (positive *and* negative). Automatic recusal rules misunderstand this: they purge positive ties but ignore negative ones, ultimately favoring disengaged strangers over invested experts. This "recusal ratchet" impoverishes judgment and devalues relational integrity.  

  **Why We Depart from This View (Politely):**  
  While relational continuity is ethically significant, universities must standardize decisions across thousands of evaluations involving transient or conflicting obligations. Declared Partiality *incorporates* this insight by formally recognizing relationships—but within a framework that prioritizes equitable outcomes for *applicants* over the unfettered participation of reviewers. The system trusts experts to declare loyalties/antipathies, then structurally offsets their influence. This balances relational realism with institutional fairness better than either unchecked evaluation or blanket recusal.  

  ---

  ### V. BOTTOM LINE  
  1. **Complaint Resolution:** Uphold award; initiate blinded re-review; commit to policy change.  
  2. **Policy Revision:** Replace recusal lists with **Declared Partiality** (effective Fall 2025).  
  3. **Interim Step:** Require disclosure of past doctoral supervision for Spring 2025 panels.  

  This approach closes the "past supervisor" loophole, addresses hidden animus, and aligns our process with the reality that evaluators are human—without sacrificing rigor.  

  **VOTE REQUESTED BY OCTOBER 15, 2024**  

  ---  
  *Attachment: Draft Disclosure Form & Scoring Protocol*  
  *cc: Faculty Senate, Office of Research Affairs, Dean of Faculty*
