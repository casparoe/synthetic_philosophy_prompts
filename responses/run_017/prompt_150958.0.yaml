answer: |-
  **Prioritize authorization (4), then specification (1), with drift (3) folded into (1) and generalization (2) deprioritized.**  

  ### Why this order?  
  1. **Authorization (4) is upstream and existential**  
     - If we don’t resolve *who* legitimately sets goals for AGI, work on *what* those goals are (specification/drift) or *how* to achieve them robustly (generalization) risks building on flawed foundations. No technical solution matters if the goal-setter lacks moral/political legitimacy.  
     - **Tractability**: Philosophers can clarify theories of legitimacy (e.g., democratic vs. expert-led authorization), map tradeoffs (e.g., speed vs. inclusivity), and identify "fail-safe" defaults (e.g., minimal rights protections). This fits an 8-researcher-year budget.  
     - **Why it’s alignment**: Misaligned power *is* misalignment. An AGI serving an illegitimate operator harms humanity by design.  

  2. **Specification (1) absorbs drift (3)**  
     - **Drift isn’t separate**: Your "specification" bucket (defining goals under uncertainty) and "drift" (goals changing over time) are two facets of *dynamic specification*. Treating them jointly avoids duplication and mirrors real-world operators (e.g., corporations/states) whose goals evolve.  
     - **Tractability**: Philosophers/theorists can model goal stability (e.g., "constitutional" constraints vs. adaptive preference learning) and value uncertainty (e.g., Bayesian credences over moral principles).  
     - **Impact**: Solutions here directly inform AI design (e.g., how to embed preference-update mechanisms).  

  3. **Deprioritize generalization (2)**  
     - **Downstream and ML-heavy**: Robust out-of-distribution alignment leans on empirical ML (e.g., anomaly detection, meta-learning). Conceptual work here (e.g., "generalized goal integrity") is vague without concrete systems to test.  
     - **Lower marginal value**: Insights from specification/authorization will constrain generalization research anyway.  

  4. **Drop?**  
     - **Generalization (2)**: Allocate minimal resources (e.g., 0.5 researcher-years to scout ML collaborations). Its answers won’t change practice until specification/authorization are clearer.  
     - **Pure "drift" (3)**: Fully merge into specification.  

  ### Where reasoning could break & what would update it  
  - **Breakage risk**: Overestimating authorization’s tractability. If legitimacy frameworks (e.g., "digital social contracts") prove too abstract to guide engineering, this work becomes academic.  
    - **Evidence to update**: Failure to produce actionable criteria for legitimate operators within 18 months. Shift resources to specification.  
  - **Breakage risk**: Underestimating specification/drift synergy. If empirical work shows goal-update mechanisms require wholly *new* math (e.g., topology of value spaces), split drift back out.  
    - **Evidence to update**: ML labs demonstrating unexpected challenges in dynamic goal alignment (e.g., catastrophic retraining loops).  
  - **Move (2) up?** Only if conceptual breakthroughs (e.g., a formal theory of "goal robustness") emerge independently—unlikely without empirical anchors.  

  **Bottom line**: Authorization is the keystone; specification/drift is the core technical challenge; generalization waits for foundations. Allocate **4 researcher-years to (4)**, **3.5 to (1/3)**, and **0.5 to (2)**.
