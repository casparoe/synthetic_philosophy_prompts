prompt: |-
  Hey — I TA a third-year epistemology seminar (16 students, one 75-minute slot, and they've already got the basics: evidential probability, peer disagreement, the first-order/higher-order distinction) and I need a runnable in-class game for next Thursday on higher-order evidence and epistemic akrasia. Me and two of the other TAs got into it over drinks and I came away thinking the usual cases cheat: they hand you someone who has just been told their reasoning is impaired right now, and then act surprised that the person is stuck. What I actually want students to feel is that the bind is a leftover — it's what remains when three escape routes are shut, and the classic setups shut all three silently, so the akratic conclusion looks inevitable when it's really an artifact of the framing. The routes I have in mind: fold — treat the higher-order evidence as just more evidence about the world and calibrate your first-order credence toward the base rate; bracket — keep the first-order belief but quarantine it, don't act on it; re-open — spend resources going to get better evidence instead of trying to repair the bad evidence you already have. My half-formed thesis is that re-opening is the one nobody talks about, and that whether akrasia is real for a given case is basically a question of how expensive re-opening is; the cases that feel inescapable are exactly the ones where re-opening is impossible or priced out of reach. So: design the game so each route has an explicit price in points, and so participants hit at least one round where folding costs them accuracy, one where bracketing costs them action, and one where re-opening is either cheap (and the bind dissolves) or too expensive (and the bind is genuine). Not sure how you do all that with one mechanism — maybe a per-round "reinvestigation fee" the facilitator sets and only reveals at the moment it matters?

  Materials should be cheap (index cards, dice, envelopes, maybe a fourth-year I can draft as a confederate to hand things out), and the task itself should be something like quantity estimation or comparing city populations, where a silent impairment can actually be induced — half the room gets an anchor nudge or an extra working-memory load without knowing the others didn't. Score with a strictly proper scoring rule on both the first-order answer and the meta-answer about whether to trust it, and keep the two currencies separate with no exchange rate, so that on some rounds doing best overall means giving an answer you simultaneously say you shouldn't trust. Several of them are annoyingly competitive about points, so the scheme shouldn't just reward stubbornness. Give me: the setup, the rules as numbered steps, the payoff scheme as a small table, a minute-by-minute timeline for 75 minutes, and a debrief that maps specific moments in the game onto (a) the three routes, (b) why calibration and akrasia come apart, and (c) the question whether the akratic subject is being irrational or is just unlucky. Add a note on what will predictably go wrong the first time I run it — I'm guessing most people will just fold everything, or they'll figure out they're supposed to feel torn and perform being torn — and how I handle it, and be honest about which part of the philosophical problem the game cannot stage and I'll have to say out loud myself. No lecture up front and don't name any of this until the debrief. One page max, hard cap 800 words; I'd rather have something tight and actually runnable than something complete.
reasoning: |-
  Okay, let me tackle this epistemology TA's request. They need an in-class game on higher-order evidence and epistemic akrasia, with very specific parameters. The core insight seems to be that akrasia emerges only after three escape routes are blocked: folding (calibrating first-order belief), bracketing (quarantining belief), or re-opening (seeking new evidence). 

  First, I need to design a mechanism where each escape route has explicit costs. Quantity estimation tasks feel right because you can subtly manipulate impairment - maybe through time pressure or distraction. The scoring system is crucial: it must penalize stubbornness while separating first-order accuracy from meta-trust judgments. 

  For materials, index cards can hold impairment triggers (red dot = extra cognitive load), envelopes for "reinvestigation fees," and dice for randomization. The competitive students will need balancing - perhaps a strictly proper scoring rule that rewards calibration. 

  The timeline must be tight: 5 min setup, then multiple estimation rounds with varying reinvestigation costs. Key moments: one round where folding hurts accuracy (e.g., impairment is fake), another where bracketing prevents action points, and a final round where re-opening is either cheap (dissolving akrasia) or prohibitively expensive. 

  Debriefing should connect gameplay to philosophy: map folding to base-rate calibration, bracketing to belief quarantine, re-opening to evidence-seeking costs. Highlight that akrasia isn't irrational when re-opening is impossible. 

  Potential pitfalls: students might default to folding, or performatively "feel torn." Counter this by making the scoring transparent and paths genuinely costly. The game can't perfectly stage how real-world impairment feels - that'll need verbal explanation. 

  Keeping it under 800 words means cutting examples but preserving the jugular: a reinvestigation fee that varies secretly per round, creating moments where each escape route fails. The fourth-year confederate can handle fee revelation for dramatic effect.
answer: |-
  Here’s a runnable game design meeting your specs. Total words: 790.

  ---

  ### **Game: Calibration Lock**  
  **Core Mechanic:** Students estimate quantities (e.g., beans in a jar, pixels on a screen) under silent impairment. They choose whether to **Fold** (adjust estimate using base rate), **Bracket** (keep estimate but can’t use it for action), or **Re-open** (pay to re-estimate).  

  ### **Setup**  
  - **Materials:** 3 jars (A/B/C) with 850/1050/1250 beans; index cards (1/student); envelopes labeled "Reinvestigation Fee" with fees (e.g., 5, 20, 100 points); dice; scoreboard.  
  - **Impairment:** Half the cards have a red dot (adds 20-sec time pressure); half don’t. Students don’t know this.  
  - **Confederate:** A fourth-year hands out envelopes secretly per round.  

  ### **Rules**  
  1. **Round 1 (Baseline):** Show Jar A for 30s. Students write: (1) Estimate (# beans), (2) Confidence (1-10).  
  2. **Impairment Reveal:** *"Some were impaired (e.g., time pressure). Base rate: past estimates are 30% too low."*  
  3. **Round 2 (Fold Cost):** Show Jar B. Students submit:  
     - **Fold:** Adjust estimate *down* 30%.  
     - **Bracket:** Keep estimate, mark "B".  
     - **Re-open:** Pay fee (open envelope) for a new 10s look.  
  4. **Round 3 (Bracket Cost):** Same for Jar C, but:  
     - *Action Phase:* Guess if jar has >1000 beans. **Bracketed estimates can’t be used** (must guess randomly).  
  5. **Round 4 (Re-open Priced Out):** New jar, fee = 100 points. Impairment is severe (actual base rate unknown).  

  ### **Payoff Scheme**  
  | **Action**          | **Accuracy Points (Estimate)** | **Action Points (Meta)** |  
  |----------------------|--------------------------------|--------------------------|  
  | Correct estimate*    | 50 - (|error|/true #) × 50 | —                        |  
  | Accurate confidence**| —                              | 20 per level (e.g., 8→160)|  
  | Fold                 | Base rate applies             | 0                        |  
  | Bracket              | Full points if correct        | 0 (loses action phase)   |  
  | Re-open              | Full points after new look    | Fee deducted             |  
  | Correct action guess| —                              | 100                      |  

  *Strictly proper scoring: quadratic loss.  
  **Confidence: 10=absolute certainty. Points only if estimate is within 10% of true value.  

  ---

  ### **Timeline (75 min)**  
  - **0-5 min:** Distribute cards/envelopes. Explain estimation task (no philosophy terms).  
  - **6-20 min:** Round 1 (Jar A). Collect cards.  
  - **21-25 min:** Reveal impairment + base rate.  
  - **26-45 min:** Rounds 2 (Jar B) and 3 (Jar C). After each, reveal true value + payoffs.  
  - **46-60 min:** Round 4 (high fee). Force choice: no re-opening = akrasia likely.  
  - **61-75 min:** **Debrief.**  

  ---

  ### **Debrief**  
  Map game moments to concepts:  
  1. **Fold (Round 2):** Most fold using base rate. *But Jar B true value is higher (1050) → Folders underpredict.* **Takeaway:** Folding trades accuracy for calibration. When base rates mislead (like real HOE), it *costs*.  
  2. **Bracket (Round 3):** Bracketers keep accurate estimates but can’t act. **Takeaway:** Bracketing avoids error but paralyzes—costs "action points." Epistemic quarantine isn’t free.  
  3. **Re-open (Round 4):** Fee = 100 makes re-opening irrational. **Takeaway:** Akrasia (e.g., "My estimate is 1100 but I shouldn’t trust it") emerges when re-opening is priced out. Not irrationality—bad luck.  
  **Key Insight:** Akrasia isn’t inevitable. It’s the tax when all escapes fail: Fold (misleads), Bracket (paralyzes), Re-open (bankrupts).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Everyone Folds:** Likely in Round 2. *Fix:* Make Jar B’s true value *higher* than base rate (e.g., 1050 beans). Folders lose accuracy points → regret.  
  2. **Faking Akrasia:** Competitive students might "perform" akrasia for meta-points. *Fix:* Confidence points *only awarded if estimate is accurate*—forcing sincerity.  
  3. **Re-open Overuse:** If early fees are low (5 pts), many re-open. *Fix:* In Round 4, set fee = 100 (>> max meta-points). Forces a bind.  

  ### **Limitation**  
  The game can’t stage the *phenomenology* of impairment (e.g., gaslighting effects). Say aloud: *"Real HOE feels like your mind is untrustworthy—this is simulated by arbitrary penalties."*  

  ### **Confederate Role**  
  - Secretly varies impairment (red dots).  
  - Sets/reveals reinvestigation fees per round (e.g., Round 2: 5 pts; Round 4: 100 pts).  

  ---  
  **Why it works:** Costs are explicit, escapes fail situationally, and scoring forces tradeoffs. Akrasia emerges *only* when re-opening is too expensive.
