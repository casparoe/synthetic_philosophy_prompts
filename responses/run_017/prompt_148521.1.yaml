prompt: |-
  ok so I built this argument for a reading group on Moore and it now seems to eat its own tail, and I can't find the seam.

  Background I was working from: Moore holds that the greatest goods we know are the enjoyment of beautiful objects and the pleasures of personal affection; that a thing's intrinsic value is what it would have if it existed entirely alone; that wholes are organic unities, so a part's contribution to a whole needn't equal its own isolated value and adding a good part to a good whole can lower the whole's value; and that a beautiful object no one ever perceives would be worth hardly anything.

  (1) Intrinsic value is settled by the isolation test.
  (2) Value is organic: contributions aren't read off isolated values.
  (3) The great goods are consciousness of beauty and personal affection, not objects or people as such.
  (4) Unbeheld beauty has near-zero intrinsic value.
  (5) So inside the whole [person + real object + veridical appreciation], the object contributes basically nothing; the value all sits in the conscious state.
  (6) Take two subjects whose conscious lives are type-identical — one really looking at the painting and really loved by her friend, one in a perfect simulation of both. By (5), their states have equal intrinsic value.
  (7) The two cases differ only in causal history and in whether the object exists, and neither difference is a difference in intrinsic value; so we have no value-based reason at all to prefer the real world.
  (8) So a planet of permanently deluded appreciators and simulated friends is every bit as good as ours — and if you're choosing between funding a museum and funding a perfect simulation that reaches a billion more people, the simulation wins easily.

  That last bit is what makes me suspicious, since Moore of all people is not supposed to end up there. I'd much rather keep organic unities and the claim about unbeheld beauty than keep the conclusion.

  Two things I want handled: tell me which step to cut and what cutting it costs — someone in the group proposed just adding a 'contact requirement' (the valuable state has to be suitably caused by the real thing), which smells like bolting on the conclusion, and another proposed saying the isolation test just can't be run on states that are about something, which I don't know how to price. And run the two mirror cases before you answer: the friend who really loves you but whose affection you never appreciate, and the hallucinator who finds out ten years later that it was fake and whose memory of it then collapses — does the collapse show the value was never there, or does it just add a later bad state?

  Lead with the step you'd reject in the very first sentence, then give me the reasoning for why it looked fine, then price the other exits. No preamble, no restating my question.
reasoning: |-
  Okay, the user has presented a detailed argument based on Moore's ethical philosophy that leads to a counterintuitive conclusion—that a simulated world of deluded appreciation is as valuable as the real one. They want me to identify which step to reject and explain the cost of alternative solutions, while also addressing two mirror cases about unappreciated affection and value collapse after discovering deception.

  First, I need to understand Moore's key principles: intrinsic value determined by isolation test, organic unities, great goods being consciousness of beauty/personal affection, and unbeheld beauty having near-zero value. The problematic conclusion is step (8) where simulated experiences are deemed equally valuable.

  The argument's tension lies between step (5) (claiming objects contribute nothing to value) and Moore's actual view. Moore's organic unities mean that while the object has little isolated value, its presence fundamentally alters the nature of the conscious state itself. Veridical perception isn't just a cause—it constitutes a different kind of experience with different intrinsic properties.

  For the mirror cases: In the unappreciated affection scenario, Moore would say the loving person has some value but the full organic unity requires reciprocity. For the hallucinator who later discovers deception, the initial experience had value (as conscious state) but the discovery creates a new disvalue through shattered understanding.

  The cleanest solution is rejecting step (5). While the object has minimal isolated value, its contribution to the whole isn't additive—it transforms the conscious state into a different organic unity with higher value. Alternative solutions like adding a "contact requirement" or restricting the isolation test would be more costly, as they either beg the question or undermine Moore's core methodology.

  The cost of rejecting (5) is having to argue that "consciousness-of-beauty" intrinsically includes the object's real existence as part of its nature—a move consistent with organic unities but requiring careful metaphysical handling. Other exits either compromise Moore's isolation test principle or introduce ad hoc conditions.
answer: |-
  Reject step (5).

  **Why (5) seemed plausible:**  
  You inferred from (4) (unbeheld beauty ≈ zero value) and (3) (value resides in conscious states) that within the whole [person + object + veridical appreciation], the *object itself* contributes nothing. This assumes the whole’s value is *summative*—that the object’s near-zero isolated value must map directly to negligible contribution in the whole. But (2) explicitly blocks this: organic unities mean parts can have *non-additive* contributions. The object’s real presence isn’t a separable "ingredient"; it *constitutively shapes* the conscious state’s intrinsic nature. Moore’s isolation test applies to *wholes*, not parts-in-isolation determining parts-in-composition.

  **Cost of rejecting (5):**  
  You must defend that veridical awareness of a *real* object is intrinsically different from hallucination—even if phenomenally identical. This requires arguing that the conscious state’s relational properties (e.g., being *of* an actual beauty) are part of its intrinsic value, which strains Moore’s "isolation" criterion. It risks conflating intrinsic value with relational value.

  **Mirror cases analysis:**  
  - **Unappreciated affection:** The loving person’s mental state has intrinsic value in isolation (per Moore’s examples of "loving the unworthy"). But the *reciprocated* affection whole is a greater organic unity. The unappreciated lover’s state contributes positively, but the whole’s value is reduced by the beloved’s unawareness.  
  - **Hallucinator’s collapse:** The discovery doesn’t retroactively negate the past conscious state’s intrinsic value (which was real *as a state*). Instead, it adds a *new disvalue*: the organic unity of [memory + knowledge of falsity] is a *bad* whole. The past experience was valuable but is now embedded in a larger, corrupted unity.

  **Pricing alternative exits:**  
  - **Add a "contact requirement" (e.g., veridical causation is necessary):**  
    **Cost:** Violates (1) and (2). The isolation test ignores relations like causation. If causation is necessary for intrinsic value, you abandon Moore’s core method. This is circular—smuggling in the desired conclusion.  
  - **Restrict isolation test to non-intentional states:**  
    **Cost:** Undermines (3) and (4). Moore applies isolation to beautiful objects *and* conscious states. Banning it for intentional states makes his claims about unbeheld beauty (4) and consciousness of beauty (3) incoherent—how would we test their values?  

  **Why rejecting (5) is least costly:**  
  It preserves organic unities (2) and the isolation test (1) while blocking the simulation conclusion. The cost—making intrinsic value sensitive to relational facts—is already latent in Moore’s treatment of unbeheld beauty (4): an *existing but unperceived* beautiful object fails the isolation test precisely because its relational properties (being unperceived) are part of its intrinsic disvalue. Consistency demands the same for the conscious state: its being *of a real object* is intrinsic to its value.
