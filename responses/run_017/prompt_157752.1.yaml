prompt: |-
  I've been asked to write down my real position on animals rather than repeat an organisation's line — I sit on the board of a large municipal animal shelter and do volunteer policy work for a farmed-animal welfare group, and the two roles keep pulling me in different directions. Before I present it to either group I'd like an audit of whether it hangs together. Roughly where I've landed:

  1. Speciesism is unjustified. Sentience is what makes a being count morally at all; once a being counts, its interests count equally regardless of species, and psychological capacities rather than species membership are what track the content of what we owe.

  2. Full protection against being killed attaches only to persons — beings with an extended self-conception, plans and projects that reach into the future. Non-persons can permissibly be killed painlessly and replaced by another equally well-off non-person when doing so produces more welfare, so a genuinely high-welfare farm is not objectionable in the killing itself, only in how the animals live.

  3. It is seriously wrong to kill a human being who is not a person — an infant, or an adult with profound cognitive disability — even where a painless death and a replacement would produce more welfare. I don't want this to rest on the feelings of relatives or on how such a practice would affect third parties; I think the wrong is to the individual killed.

  4. Suffering is what makes factory farming a catastrophe, and the sheer numbers involved swamp anything shelters deal with, so the money should go there rather than to companion-animal rescue.

  5. Wild-animal suffering is a serious problem, but we have no duty to intervene against predation, and in practice I oppose intervention programmes even where they look safe and cheap. I don't want this to rest on the value of wildness or naturalness, which I think is empty.

  6. We owe more to domesticated animals — the ones we bred into existence and made dependent on us — than to wild ones, and this isn't only a matter of how much good we can do per dollar; it is about what we have already done to them.

  7. Concretely: I think our shelter is right to spend its budget on neutering and rehoming dogs and cats, and that it would be wrong to shut it down and send the money to a broiler-welfare campaign, even though that would do far more good per dollar.

  What I can't locate is where this package breaks. Which of these commitments actually pull against which others, and which apparent conflicts dissolve once the terms are made precise? For each real conflict, tell me what would have to give and what the cheapest repair costs me. Rank the problems by severity rather than treating them as equally bad, and say which single revision would clean up the most.
reasoning: |-
  Hmm, the user is grappling with a complex ethical framework regarding animal welfare, stemming from their dual roles in an animal shelter and a farmed-animal welfare group. They've outlined seven positions and want me to audit them for internal consistency. This is a sophisticated philosophical inquiry that requires careful logical analysis.

  Looking at their positions, I notice several potential tensions:
  - Position 2 allows killing non-persons (like farm animals) for welfare gains, but position 3 forbids this for human non-persons (infants, disabled)
  - Position 4 prioritizes farmed animals due to scale, but position 7 rejects redirecting shelter funds to broiler welfare
  - Position 5 opposes intervening in wild animal suffering, while position 4 emphasizes reducing suffering at scale
  - The domesticated/wild animal distinction in position 6 seems inconsistent with the anti-speciesism in position 1

  The most severe conflict appears between positions 2 and 3 - what I call the "human exception problem." They need a principled distinction between killing non-human versus human non-persons that doesn't rely on speciesism. Possible solutions include embracing a moderate speciesism (which contradicts position 1) or developing a relational account (which might fit their domesticated animal stance).

  The second major tension is between the scale-based prioritization in position 4 and the institutional commitment in position 7. Here they could appeal to the special obligations mentioned in position 6 to justify maintaining shelter work despite lower cost-effectiveness.

  The wild animal suffering position (5) seems least integrated - their opposition to intervention contradicts their moral framework unless they can articulate non-speciesist reasons. The domesticated/wild distinction in position 6 might help here if consistently applied.

  For the cleanest fix, I'd recommend refining the "persons" concept to include human non-persons via potentiality or relational factors, though this requires careful handling to avoid undermining position 2. Alternatively, they could moderate their anti-speciesism to allow some moral weight to human species membership.

  This user clearly has deep experience in animal ethics and wants rigorous scrutiny before presenting to their organizations. The analysis should respect that sophistication while pinpointing exactly where philosophical adjustments are needed for coherence.
answer: |-
  Here's a structural audit of your ethical framework, identifying conflicts, their severity, potential repairs, and a prioritized revision path. Your positions reveal a sophisticated but tension-filled attempt to reconcile anti-speciesism with practical intuitions about different human/animal relationships. The core instability lies in the inconsistent treatment of non-persons across species lines.

  ### Conflicts Ranked by Severity

  1.  **The Human Exception Problem (Positions 2 vs. 3)**
      *   **Conflict:** This is the most severe and fundamental inconsistency. Position 2 states that non-persons (sentient non-humans) can be painlessly killed and replaced if it increases net welfare. Position 3 states that human non-persons (infants, profoundly disabled) *cannot* be painlessly killed and replaced, even if it increases net welfare, and that the wrong is *to the individual*. This violates the anti-speciesism declared in Position 1. You provide no non-speciesist criterion justifying this distinction solely based on the victim's inherent properties.
      *   **Why it's severe:** It directly contradicts your foundational commitment to moral equality based on sentience and makes species membership a decisive moral factor for this specific right (not to be killed/replaced), undermining Position 1.
      *   **Cheapest Repairs (Choose One):**
          *   **A. Embrace Moderate Speciesism:** Acknowledge that human species membership *does* grant special moral status/protections, even to non-persons, independent of relational factors. This rescinds the strict anti-speciesism of Position 1 ("interests count equally regardless of species") but aligns Positions 2 & 3. *Cost: Abandons core anti-speciesism.*
          *   **B. Extend "Personhood" Protection Conceptually:** Argue human infants/disabled possess *potential* for personhood, or that they belong to a kind (humanity) defined by personhood, granting them derivative protection. *Cost: Requires stretching "personhood" concept (risks inconsistency with Position 2's focus on current capacities) and may still feel speciesist.*
          *   **C. Relational Account for Humans:** Ground the prohibition solely in the *relational* context – humans are part of a specific moral community (characterized by deep interdependence, symbolic meaning, historical practices) that grants them this protection *regardless* of individual capacities. *Cost: Weakens the claim that the "wrong is to the individual killed" (Pos 3) and makes the prohibition contingent on social context, not inherent wrong. Opens door to similar relational arguments for other species/groups.*
          *   **D. Reject Replaceability for All Sentient Non-Persons:** Conclude that painlessly killing *any* sentient non-person (human or non-human) who has future-oriented desires/welfare (even if not "person" level) is wrong *to that individual* because it deprives them of their future positive experiences. *Cost: Forces revision of Position 2, making genuinely high-welfare farms (involving killing) objectionable on the killing itself, collapsing a key distinction.*

  2.  **Scale vs. Special Obligations (Positions 4 vs. 6 & 7)**
      *   **Conflict:** Position 4 argues that due to scale and suffering intensity, resources *should* prioritize factory farming over companion animal shelters (implying shelters are less important). Position 7 explicitly rejects redirecting shelter funds to broiler welfare, and Position 6 grounds stronger duties to domesticated animals based on dependency/history ("what we have already done to them"). Positions 6 & 7 imply special obligations that *override* strict utilitarian scale calculations (Pos 4).
      *   **Why it's severe:** It creates a direct clash between a powerful consequentialist argument (Pos 4) and powerful deontological/relational arguments (Pos 6 & 7) within your practical recommendations.
      *   **Resolution (Not necessarily a conflict needing repair if clarified):** This tension *can* be coherent. Position 4 states where money *should* go *absent specific obligations*. Positions 6 & 7 establish strong *special obligations* towards domesticated animals *in our direct care* or *created by us*. This justifies the shelter's existence and funding *despite* lower cost-effectiveness per dollar compared to broiler welfare campaigns. The "should" in Pos 4 needs softening: "Factory farming is the *most pressing large-scale* problem and *ideally* deserves vastly more resources, *but...*".
      *   **Cheapest Repair:** **Clarify Scope.** Explicitly state that Position 4 refers to *ideal, unencumbered* resource allocation *at a societal level*, while Positions 6 & 7 refer to *specific duties binding on particular agents/institutions* (like the shelter board). Position 7 isn't rejecting Pos 4's *general* priority; it's rejecting that *this specific shelter* must liquidate itself to fund broiler campaigns because of its *special obligations* to the domesticated animals in its community/care. *Cost: Requires accepting that institutional roles create binding duties that limit pure consequentialism.*

  3.  **Wild Suffering Non-Intervention (Position 5 vs. Anti-Speciesism & Suffering Focus)**
      *   **Conflict:** Position 5 opposes intervening in wild animal suffering (even if safe/cheap), rejecting "wildness/naturalness" as a value. This seems inconsistent with the core focus on suffering (Pos 4) and anti-speciesism (Pos 1). If suffering is bad and species doesn't matter, why *not* reduce massive wild suffering if possible? Rejecting "wildness" removes a common justification *for* non-intervention.
      *   **Why it's problematic:** It lacks a clear positive justification within your framework. *Why* is there no duty to intervene?
      *   **Cheapest Repairs:**
          *   **A. Epistemic/Practical Caution:** Argue that our current understanding of ecosystems and ability to predict intervention outcomes is so poor that attempts to reduce suffering are overwhelmingly likely to cause *more* suffering or catastrophic ecological collapse, making intervention practically impermissible *now*. *Cost: Leaves door open for intervention if knowledge/techniques improve.*
          *   **B. Agent-Relative Restraint:** Argue that while wild animal suffering is bad, *we* (humans) lack the standing, authority, or requisite understanding to justifiably intervene on a massive scale in complex systems we didn't create and don't fully comprehend. Focus on *our limitations* as agents. *Cost: Still somewhat vague; why don't limitations apply to helping domesticated animals?*
          *   **C. Distinguish "Duty to Rescue" vs. "Duty Not to Harm":** Argue your primary duties are to *refrain from causing harm* (factory farming) and to *care for those you've made dependent* (domesticates). Wild animals aren't *harmed by us* in the relevant sense (generally) nor dependent *on us*. Reducing natural suffering is supererogatory, not obligatory. *Cost: Needs careful definition of "harm" and "dependency"; predation might be seen as harm we *could* prevent.*

  4.  **Domestic/Wild Distinction (Position 6 vs. Anti-Speciesism & Sentience Basis)**
      *   **Conflict:** Position 6 claims we owe *more* to domesticated animals than wild ones due to history/dependency. Anti-speciesism (Pos 1) says interests count equally based on sentience. Why does our historical relationship create *stronger* positive duties to one sentient being over another?
      *   **Resolution (Can be coherent):** This is less a conflict and more an *elaboration*. Anti-speciesism (Pos 1) establishes *baseline* moral status/consideration. Position 6 argues that *specific relationships* (causal responsibility for existence/dependency) generate *additional, agent-relative duties* beyond the baseline duties owed to all sentient beings. We don't owe *less* to wild animals in terms of baseline respect (e.g., don't cause unnecessary suffering), but we owe domesticated animals *more* positive assistance *because we made them dependent*. *Cost: Requires accepting that relational history creates special positive obligations without implying lesser intrinsic value.* **This is consistent if framed correctly.**

  **The Single Most Impactful Revision:**

  Addressing **The Human Exception Problem (Conflict 1)** is paramount. It's the deepest inconsistency, directly challenging your anti-speciesist foundation. The "cheapest" repair in terms of preserving the *most* of your existing framework, while being philosophically defensible, is likely:

  **C. Relational Account for Humans:** Ground the special protection of human non-persons *entirely* in the unique human moral community characterized by profound interdependence, symbolic significance, shared vulnerability, and historical norms that grant *all* members protection regardless of individual capacity. This protection is a feature of the *relationship* within the community, not an inherent property of the individual human biological category itself.

  *   **Why it's the "Cheapest":**
      *   Preserves anti-speciesism regarding *intrinsic* moral status (Pos 1).
      *   Allows the permissibility of killing non-human non-persons under replaceability (Pos 2).
      *   Explains the prohibition on killing human non-persons (Pos 3) without relying on their intrinsic properties or speciesism.
      *   Avoids the massive revision of rejecting replaceability (Option D).
  *   **Costs:**
      *   Weakens the claim in Position 3 that the wrong is *solely to the individual killed*. The primary wrong becomes a violation of community norms/trust.
      *   Makes the prohibition contingent on social context. If the human moral community changed its norms, the prohibition could theoretically dissolve (a deeply uncomfortable implication).
      *   Opens the door to arguing that other strong relational contexts (e.g., deeply bonded companion animals) might generate *some* similar, though perhaps weaker, protections against killing/replacement, potentially creating friction with Position 2 in specific cases.

  **Conclusion:** Your framework is intellectually honest and grappling with real tensions. The core instability is reconciling replaceability for non-human non-persons with absolute protection for human non-persons without relying on speciesism. Adopting a **relational account for the human exception** is the most targeted fix. Clarifying the **scope of special obligations vs. scale-based priorities** (Conflict 2) and providing a **clearer justification for wild animal non-intervention** (Conflict 3) are also crucial for coherence, but less fundamental than resolving the human/non-human non-person asymmetry. The domestic/wild distinction (Conflict 4) is resolvable within your framework as special obligations arising from relational history. Present this revised framework with the understanding that the "relational human community" justification for Position 3 will be a major point of discussion and requires robust defense.
