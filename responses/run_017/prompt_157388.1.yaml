  **Final note:** The procedure is designed to be practical. Judgment calls are marked in each gate (hand to human when borderline). The cost of including the anti-gerrymandering gate (Gate 1) is that we might reject some valid but non-standard mappings. The cost of including the counterfactual gate (Gate 3a) is that we require evidence that might not exist, so we hand to human or say NO more often.
answer: |-
  Below is a decision procedure for evaluating claims of the form "system S implements computation C" (e.g., "Loom-3 implements a predictive-coding model of mouse V1"). It's designed as a sequence of gates (ordered questions) that return **ship** (claim is defensible), **don't ship** (claim fails), or **hand to a human** (judgment call needed). The procedure prioritizes efficiency (≤30 minutes per claim), uses only existing evidence (logs, weights, training config, benchmarks), and addresses your constraints: no written program, no clock/discrete states, noise, drift, and the brick-wall problem.

  ### Core Principles
  - **Anti-gerrymandering**: Mappings must be fixed *before* testing (not chosen after seeing data), non-disjunctive (no "this voltage is either X or Y depending on context"), and coarse-grained (no atom-level mappings).
  - **Causal structure**: The system’s behavior must align with the computation’s *counterfactuals* (what it *would* do on unseen inputs), not just observed data.
  - **Pragmatism**: Gates escalate from easy checks to harder ones. Judgment calls are flagged. When noise/drift/ambiguity arise, we set clear thresholds or hand off.
  - **Key trade-off**: The brick-wall gate (Gate 1) is essential but may reject novel/ambiguous mappings. Removing it would make the procedure vulnerable to trivial implementations (e.g., brick walls).

  ---

  ### Decision Procedure: Ordered Gates
  **Gate 1: Is the mapping from computation C to system S non-gerrymandered?**  
  *Purpose: Block absurd mappings (e.g., "brick wall implements Word").*  
  - **Question**: Was the mapping (e.g., "voltage V represents prediction error") defined *before* testing, based on S’s design/training, and is it non-disjunctive and coarse-grained?  
  - **Sufficient evidence**: Training config documents the mapping intent (e.g., "layer 1 = V1 neurons"). Weights/logs show it was consistently applied.  
  - **Return NO if**: Mapping was defined post-hoc, uses disjunctions (e.g., "V is error if >0.5V, but noise if ≤0.5V"), or is implausibly fine-grained (e.g., "each electron position is a state").  
  - **Hand to human if**: Mapping is novel but reasonable (e.g., an analog component repurposed for a new computation).  
  - **Judgment call?** Yes – "coarse-grained" depends on team standards.  
  - **Cost of including this gate**: Rejects creative but untestable mappings; favors conservative, design-based claims.

  **Gate 2: Can states, inputs, and timesteps be defined non-arbitrarily?**  
  *Purpose: Handle analog/no-clock systems by defining computational "steps".*  
  - **Question**: Can states (S’s configuration), inputs (external signals), and timesteps (progress markers) be defined using S’s physics/training?  
  - **Sufficient evidence**: Training config defines "state" (e.g., "voltage vector at time t"), "input" (e.g., "sensor voltage"), and "timestep" (e.g., "fixed 10ms interval" or "propagation delay between layers"). Logs show these are measurable.  
  - **Return NO if**: No definition exists (e.g., timesteps are random intervals) or it’s arbitrary (e.g., "we pick a timestep because we need one").  
  - **Hand to human if**: Definitions are approximate but physically grounded (e.g., "timestep = mean signal propagation time, ±5% drift").  
  - **Judgment call?** Yes – "non-arbitrary" depends on design intent.  

  **Gate 3: Does S’s causal structure match C’s transitions?**  
  *Purpose: Verify S behaves like C, including unseen inputs (counterfactuals).*  
  - **Question**: For observed *and* plausible unseen inputs, does S transition between states as C predicts?  
  - **Sufficient evidence**:  
    - Benchmarks test inputs beyond training data (e.g., 10% of logs are held-out data).  
    - Weights allow simulating responses to novel inputs (if you have a simulator; no new experiments).  
    - Ablations (if exist) show expected changes (e.g., disrupting a "feedback loop" degrades performance).  
  - **Return NO if**: Logs show >10% deviation from C on *observed* inputs, or no off-distribution tests exist.  
  - **Hand to human if**: Limited off-distribution tests (e.g., 5–10% of logs) or simulations are noisy but suggestive.  
  - **Judgment call?** Partially – "plausible unseen inputs" depends on domain knowledge.  
  - **Key insight**: This gate does the heaviest lifting. If removed, S could pass by fitting only observed data (e.g., a lookup table). If indefensible (e.g., no simulator/off-distribution tests), the whole procedure fails – it cannot block trivial claims.

  **Gate 4: Is noise/drift within acceptable bounds?**  
  *Purpose: Ensure S approximates C robustly.*  
  - **Question**: Does noise cause <10% error in outputs, and drift stay within ±10% of Monday’s behavior by Friday?  
  - **Sufficient evidence**: Logs show repeated runs (e.g., 5+ trials) with variance metrics. Drift is quantified (e.g., "outputs change by X% over 5 days").  
  - **Return NO if**: Noise causes >15% error, or drift exceeds ±15% (adjust thresholds as needed).  
  - **Hand to human if**: Noise/drift is 10–15% or unmeasured but likely material (e.g., high-variance weights).  
  - **Judgment call?** Yes – thresholds are team-defined (default: 10% for shipping, 15% for rejection).

  **Gate 5: Is the implementation non-trivial?**  
  *Purpose: Block lookup tables/oversimplified mappings.*  
  - **Question**: Does S compute C using structures analogous to C (e.g., feedback loops for predictive coding), not just memorization?  
  - **Sufficient evidence**: Weights show internal structure (e.g., recurrent connections for feedback). Benchmarks include generalization tests (e.g., new image classes).  
  - **Return NO if**: S is a lookup table, or weights are unstructured (e.g., random).  
  - **Hand to human if**: Structure is partially aligned (e.g., feedback exists but is weak).  
  - **Judgment call?** Yes – "analogous" depends on C’s description.

  **Procedure Flow**:  
  1. Start at Gate 1 → if NO, **don’t ship**; if handoff, stop for human.  
  2. Proceed to Gate 2 → if NO, **don’t ship**; if handoff, stop.  
  3. Proceed to Gate 3 → if NO, **don’t ship**; if handoff, stop.  
  4. Proceed to Gate 4 → if NO, **don’t ship**; if handoff, stop.  
  5. Proceed to Gate 5 → if NO, **don’t ship**; if handoff, stop; if YES, **ship**.

  ---

  ### Analysis of Your Claims
  **Claim 1**: "Loom-3 implements a predictive-coding model of mouse V1."  
  *Evidence: 78% explained variance in neural benchmark; architecture inspired by predictive coding; no ablations/off-distribution tests; 5% noise.*  
  - **Gate 1**: Likely YES – mapping is predefined (inspired by predictive coding).  
  - **Gate 2**: Likely YES – states (voltage vectors), inputs (sensory), timesteps (e.g., propagation delay) definable.  
  - **Gate 3**: **Hand to human** – No off-distribution tests or simulator for counterfactuals. 78% variance is good but insufficient for causal claims.  
  - **Stop** – Gate 3 requires human judgment due to lack of counterfactual evidence.  
  - **Verdict**: Hand to human. Ship only if advisor confirms architecture intent outweighs missing tests.

  **Claim 2**: "The distilled lookup table implements the same model."  
  *Evidence: 40-row table; fits benchmark perfectly; no noise.*  
  - **Gate 1**: NO – Mapping is gerrymandered (e.g., "row 3 = prediction error" defined after training).  
  - **Verdict**: **Don’t ship** – Fails Gate 1. *Procedure blocks trivial implementations.*

  **Claim 3**: Two incompatible descriptions (predictive coding vs. feedforward) fit equally.  
  *Evidence: Both fit logs perfectly; no structural evidence to distinguish.*  
  - **Gate 1**: YES – Both mappings non-gerrymandered.  
  - **Gate 2**: YES – States/timesteps definable.  
  - **Gate 3**: YES – Both match observed behavior (including counterfactuals, if tested).  
  - **Gate 4**: YES – Assume no noise.  
  - **Gate 5**: **Hand to human** – Both are non-trivial, but structure (e.g., feedback) isn’t documented. Human must decide based on *which computation we care about* (e.g., predictive coding for neuroscience grants).  
  - **Verdict**: Hand to human. *Procedure exposes ambiguity but doesn’t resolve it.*

  ---

  ### Unsettleable Claim Classes
  The procedure **cannot settle**:  
  1. **Representation claims**: E.g., "Voltage V *stands for* prediction error (semantics)" vs. "V *causes* downstream effects (syntax)". This requires philosophical interpretation (intentionality) and is always a judgment call.  
  2. **Claims where mappings are inherently ambiguous**: E.g., Two equally valid computations (Claim 3) – resolved by human based on context.  
  3. **Claims with insufficient counterfactual evidence**: If no off-distribution tests/simulator exist (Claim 1), Gate 3 forces handoff.  
  4. **Claims about "fundamental" computations**: E.g., "Does Loom *really* compute?" – procedure assumes C is well-defined.

  ---

  ### Summary
  - **Strongest gate**: Gate 3 (causal structure). If dropped, the procedure fails to block trivial implementations (e.g., Claim 2 passes).  
  - **Practical use**: Run claims through gates in 30 minutes using existing logs/weights. Gates 1, 2, 4, and 5 are quick checks; Gate 3 is the bottleneck.  
  - **Output**: ~50% of claims will "hand to human" due to noise, drift, or ambiguity – this is intentional to avoid overstatement.  
  - **Recommendation**: For high-stakes claims (e.g., grants), pre-commit to mapping definitions and run off-distribution tests to strengthen Gate 3.
