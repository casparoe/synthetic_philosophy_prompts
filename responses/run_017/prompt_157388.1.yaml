     - Return NO: If the mapping is clearly gerrymandered (e.g., defined after the fact with disjunctions, or arbitrary fine-graining) then return NO.
     - Hand to human: If the mapping is not obviously gerrymandered but is not a standard one, and we have to decide if it's acceptable, then hand to human. Also, if the description of C is ambiguous or not well-defined, hand to human.

  **Gate 2: Can we identify states, inputs, and timesteps in a non-arbitrary way?**
