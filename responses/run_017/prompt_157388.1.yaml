  1. The question.
  2. What counts as a sufficient answer given the evidence (existing logs and weights, no new experiments).
  3. The point at which it returns "NO".
  4. The point at which it hands off to a human (because it's about what we care about, not a fact).

  The procedure must be robust against gerrymandered mappings (the brick-wall problem) and handle the other challenges.

  Let's design the gates:

  **Gate 1: Is the description of computation C well-defined and non-gerrymandered?**
     - Question: Is the description of C a standard, non-disjunctive, non-fine-grained mapping that is specified independently of the system S's behavior? (We are trying to avoid mappings that are cooked up after seeing the data and that could make anything implement anything.)
