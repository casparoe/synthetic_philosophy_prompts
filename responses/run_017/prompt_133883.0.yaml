prompt: |-
  You are a mechanistic interpretability researcher with a second specialization in the philosophy of causation and explanation. Think the problem through carefully before answering: start by brainstorming several candidate answers to the question below, and only then converge on the list you actually want to defend.

  I am building an anomaly detector for a deployed language model, and I keep tripping over an assumption nobody states: the detector is supposed to flag inputs on which the model relies on a mechanism it either did not use, or did not have validated, on the training distribution. The interpretability-discourse version of this question (features versus circuits, is it the same circuit) has not given me anything I can implement. So before I write more code, I want the specification: what does a criterion of sameness of mechanism have to deliver to be good enough for that particular job, as opposed to good enough for scientific understanding or for a safety case written after the fact?

  Give me the desiderata, each with the concrete case that motivates it, and mark each as non-negotiable or as a preference of one camp (the causal-abstraction and intervention people, the representational-similarity people, the behavioral-counterfactual people). Cases I want handled at minimum: behaviorally identical but mechanistically different, including a fine-tune that reproduces in-distribution outputs by memorization and a model that behaves identically under monitoring but differently off-distribution; mechanistically similar but behaviorally different, same circuit with a different downstream readout; sameness across models, seeds and scales, where no parameters and arguably no parts are shared; level-relativity, where what is the same mechanism under one coarse-graining is a different mechanism under another, and I need a criterion that tells me which grain matters rather than letting me choose post hoc; self-repair, where ablating a component leads the model to grow a functionally equivalent circuit elsewhere, and something has to say whether that is the same mechanism returning; whether a chain of thought the model writes for itself is part of the mechanism or part of the input; and cost, since a criterion requiring the full circuit diagram is useless at inference time.

  Then flag any pair of desiderata you suspect cannot be jointly satisfied, and name the single requirement that eliminates the most otherwise-plausible criteria. Score the main candidate criteria against the list in a short table at the end, but keep the weight on the criteria themselves.

  Finally, separate what is settled from what is genuinely contested among people who actually work on this, and do not present a contested position as the consensus.
reasoning: |-
  We are building an anomaly detector for a deployed language model. The goal is to flag inputs that cause the model to rely on a mechanism that was either:
     (a) not used on the training distribution, or 
     (b) not validated (e.g., because it was not present during training or because it was not tested adequately).

  We are not seeking a full scientific understanding or a post-hoc safety case, but a criterion that can be implemented and run at inference time.

  The core challenge: defining "sameness of mechanism" for this purpose.

  We are to provide desiderata (with motivating cases) and mark each as non-negotiable or as a preference of a particular camp (causal-intervention, representational-similarity, behavioral-counterfactual). We must address at least the following cases:

  1. Behaviorally identical but mechanistically different: 
     a. Fine-tune that reproduces in-distribution outputs by memorization (instead of using the original generalizing mechanism).
     b. Model that behaves identically under monitoring but differently off-distribution (e.g., when not being probed).

  2. Mechanistically similar but behaviorally different: same circuit with a different downstream readout.

  3. Sameness across models (seeds, scales): no shared parameters or parts.

  4. Level-relativity: same mechanism under one coarse-graining, different under another. We need a criterion that tells us which grain matters, not chosen post-hoc.

  5. Self-repair: ablating a component leads the model to grow a functionally equivalent circuit elsewhere. Is that the same mechanism?

  6. Chain of thought: is the chain of thought the model writes for itself part of the mechanism or part of the input?

  7. Cost: must be feasible at inference time (cannot require full circuit diagram).

  We then flag any conflicting desiderata and name the requirement that eliminates the most otherwise-plausible criteria. Finally, we score candidate criteria and separate settled from contested points.

  Brainstorming candidate criteria:

  A. **Causal Abstraction/Intervention-based**: Require that the causal structure (as revealed by interventions) matches. This involves defining a set of variables (neurons, layers, etc.) and a set of interventions that should lead to the same output behavior.

  B. **Representational Similarity**: Compare the internal activations (e.g., using CCA, SVCCA, Centered Kernel Alignment) to a reference set (training distribution). If the pattern of activations is sufficiently similar, then it's the same mechanism.

  C. **Behavioral Counterfactual**: If the model produces the same outputs for the same inputs (with the same probabilities) on the training distribution, then it's behaviorally the same. But we care about mechanisms, so we need to extend this to counterfactuals: e.g., if we perturb the input in specific ways, does the model respond in the same way?

  D. **Functional Equivalence**: Two mechanisms are the same if they compute the same function from inputs to outputs, but this is too coarse (case 1: memorization vs generalization may compute the same function on training distribution but not elsewhere). So we might require the function to be the same on a broader set.

  E. **Mechanistic Similarity at a Given Level**: Define a level of abstraction (e.g., layer, head) and require that the same set of components are used in the same way.

  F. **Path Extraction**: Trace the computational path (e.g., which attention heads and neurons are most active) and compare to a reference path.

  G. **Counterfactual Robustness**: If the model would have produced the same output even if we had intervened on the input in certain ways (that are consistent with the training distribution), then the mechanism is the same.

  Now, we derive desiderata from the cases:

  Desiderata:

  1. **Non-Negotiable: Distinguish memorization from generalization on in-distribution inputs.**
     - Case: Fine-tune that memorizes. The original model used a generalizing mechanism, the fine-tuned one uses memorization. We want to flag inputs that are handled by memorization in the fine-tuned model because that mechanism was not validated (it's new and might break off-distribution).
     - Why non-negotiable: The whole point is to catch when the model uses a mechanism that wasn't validated. If it memorizes, that mechanism is new and not validated.

  2. **Non-Negotiable: Detect when off-distribution behavior would differ even if on-distribution behavior is the same.**
     - Case: Model that behaves identically under monitoring (on-distribution) but differently off-distribution. We want to flag inputs that are on the edge of the distribution and might be handled by a mechanism that is not robust off-distribution.
     - Why non-negotiable: The anomaly detector is for deployment, so we care about off-distribution inputs.

  3. **Non-Negotiable: Must work across models (different seeds, scales).**
     - Case: We have a set of models (e.g., trained with different seeds) and we want to know if they use the same mechanism. We cannot rely on parameter sharing.
     - Why non-negotiable: We want to compare the deployed model to a reference model (e.g., one that was validated) even if they are different instantiations.

  4. **Non-Negotiable: Level-relativity must be resolved by the criterion, not by the user.**
     - Case: At the level of individual neurons, two mechanisms might be different, but at the level of layers, they might be the same. We need the criterion to tell us which grain is relevant for safety, without post-hoc choice.
     - Why non-negotiable: Otherwise, we could always choose a grain that makes the mechanism look the same.

  5. **Non-Negotiable: Handle self-repair.**
     - Case: After ablation, a model grows a new circuit that does the same thing. Is that the same mechanism? We need to say "no" because it's a new circuit that wasn't validated. But note: if we ablate and the model uses a pre-existing redundant circuit, then it might be the same mechanism. The criterion must distinguish.
     - Why non-negotiable: We care about whether the mechanism was present and validated during training.

  6. **Non-Negotiable: Decide if chain of thought is part of the mechanism or input.**
     - Case: When the model writes a chain of thought, that intermediate text is part of the input for subsequent steps. But the process that generated it is part of the mechanism. We need to know if the chain of thought is an input (so we can treat it as data) or part of the mechanism (so we must validate that the model can generate correct chains of thought).
     - Why non-negotiable: We have to know what we are validating.

  7. **Non-Negotiable: Cost must be feasible at inference time.**
     - We cannot run a full circuit discovery or do extensive interventions at inference time.

  Now, preferences by camp:

  8. **Preference (Causal-Intervention Camp): The criterion should be based on interventions.** 
     - Motivation: They want to capture the causal structure. For example, in the self-repair case, intervening on the original circuit and the repaired circuit would show different dependencies.

  9. **Preference (Representational-Similarity Camp): The criterion should be based on activation patterns.** 
     - Motivation: They believe that similar representations imply similar computation. This might be efficient to compute.

  10. **Preference (Behavioral-Counterfactual Camp): The criterion should be based on input-output behavior under counterfactual inputs.** 
      - Motivation: They care about what the model does, not how it does it, but they extend to counterfactuals to capture robustness.

  Also, note:

  11. **Non-Negotiable: The criterion must be able to flag a mechanism as "not validated" if it was not used in the training distribution.** 
      - This is the core job.

  Conflicting desiderata:

  - Desiderata 1 and 2 require that we look beyond the input-output behavior on the immediate input (because on the training distribution, the memorizing model and the generalizing one behave the same). But desideratum 7 (cost) requires efficiency. Looking beyond the immediate input (e.g., by running many counterfactuals) might be expensive.

  - Desideratum 4 (level-relativity) and desideratum 3 (across models) conflict because in different models the same function might be implemented at different levels of granularity. The causal-intervention approach requires specifying a level of abstraction, but we don't know which level.

  - Desideratum 5 (self-repair) and desideratum 11 (not validated) might conflict with desideratum 3 (across models): if a model self-repairs, it's a new mechanism, but if we compare two models that have the same function but different implementations, we might want to call them the same mechanism for validation purposes? But note: the validation was done on the original model. So the repaired model's mechanism is new and not validated.

  The requirement that eliminates the most criteria: **Desideratum 4 (level-relativity must be resolved by the criterion)**. Many criteria (causal abstraction, representational similarity) require choosing a level of abstraction. We need the criterion to tell us the right level for safety.

  Candidate Criteria Scoring:

  We consider:

  - Causal Abstraction (CA)
  - Representational Similarity (RS)
  - Behavioral Counterfactual (BC)

  Against the desiderata (1-11). We note that 8,9,10 are preferences, so we don't score against them but note which camp they align with.

  Scoring:

  1. **Distinguish memorization vs generalization**:
     - CA: Can do by intervening on the memorized vs generalized representation. E.g., change the input slightly: the memorizing model breaks, the generalizing one doesn't. But requires running counterfactuals -> cost (7) might be an issue.
     - RS: Might fail because the activation patterns for memorized examples and generalized ones might be similar if the output is the same. Not robust.
     - BC: If we only look at the training distribution, they are the same. We need to look off-distribution, so BC must extend to off-distribution. But we don't have labels off-distribution. So it might not be able to distinguish without off-distribution tests.

  2. **Detect off-distribution divergence risk**:
     - CA: By interventions that simulate off-distribution, we can see if the mechanism breaks. But again, cost.
     - RS: If the activation pattern is very different from training, that might indicate a new mechanism. But it might also be a known mechanism on a new input. Not clear.
     - BC: We can test on off-distribution inputs, but without labels, how do we know if the behavior is correct? We don't. We want to know if the mechanism is the same, not if the output is correct.

  3. **Work across models**:
     - CA: Requires aligning variables across models. This is hard and not solved. Might require human specification of the alignment.
     - RS: Designed for this. We can compare activations across models using similarity metrics.
     - BC: Easy: compare outputs on the same inputs.

  4. **Level-relativity resolved by criterion**:
     - CA: Requires specifying the level. The criterion doesn't tell us the level.
     - RS: Also requires choosing the layer and the similarity metric. Doesn't tell us the level.
     - BC: Not applicable? BC doesn't look at internals.

     None of them resolve level-relativity automatically. This is a major gap.

  5. **Handle self-repair**:
     - CA: We can intervene on the original component and the new one. If the output doesn't depend on the original (after repair) but depends on the new, then it's a new mechanism. Good.
     - RS: The activation patterns in the repaired region will be different. So we can say it's different. But note: if the function is the same, the patterns might be similar? Not necessarily: the new circuit might use different neurons.
     - BC: The behavior is the same, so BC would say same mechanism? But we want to flag it as new because it wasn't validated. So BC fails.

  6. **Chain of thought: mechanism or input?**
     - CA: We can intervene on the chain of thought. If changing the chain of thought changes the output, then it's an input. But the generation process is part of the mechanism. So we need to break it down: the mechanism for generating the chain of thought is part of the model, and then the mechanism for using it is also part. We need to validate both. This is complex.
     - RS: The activations during the generation of the chain of thought are part of the mechanism. The chain of thought tokens are inputs to the next part. So we can separate by time step.
     - BC: The chain of thought is part of the output? Then we would validate that the chain of thought is correct. But we don't have a clear behavioral test for intermediate steps.

     None are perfect, but CA might give a clearer separation.

  7. **Cost**:
     - CA: Expensive (requires multiple interventions per input).
     - RS: Cheap (one forward pass and then compare to a reference).
     - BC: Cheap if we only check the immediate input, but if we need counterfactuals, expensive.

  Summary of scores:

  - Causal Abstraction: 
     - Strengths: Handles memorization (1), off-distribution (2), self-repair (5), chain of thought (6) well.
     - Weaknesses: Cost (7) and across models (3) are hard. Level-relativity (4) is not resolved.

  - Representational Similarity:
     - Strengths: Cheap (7), across models (3) is good.
     - Weaknesses: Memorization (1) and off-distribution (2) might be missed (if activations are similar), self-repair (5) might be detected (if activations change) but not always, level-relativity (4) not resolved, chain of thought (6) might be handled by looking at activations during generation.

  - Behavioral Counterfactual:
     - Strengths: Cheap if no counterfactuals (7), across models (3) easy, level-relativity (4) doesn't apply (no internals).
     - Weaknesses: Fails memorization (1) and self-repair (5) because behavior is the same, and off-distribution (2) we don't have labels.

  None satisfy level-relativity (4) automatically.

  Settled vs Contested:

  - Settled: 
     - There is no agreed-upon criterion for mechanism equivalence in neural networks that satisfies all these.
     - We must look beyond the immediate input-output pair to detect mechanism change (to handle memorization and off-distribution risks).
     - The chain of thought is both generated by the mechanism and then used as input, so both parts must be validated.

  - Contested:
     - Which level of abstraction is the right one? Some argue for functional (what the circuit does) and some for structural (how it does it).
     - Whether representational similarity can capture causal structure.
     - Whether behavioral counterfactuals are sufficient (if we could define the right set of counterfactuals) or if we must look inside.

  The requirement that eliminates the most criteria: **Automatic resolution of level-relativity (desideratum 4)**. Without a way to determine the right level, we cannot use any criterion that requires choosing a level.

  Proposal:

  Given the constraints, we might need a hybrid approach:

  - Use representational similarity as a cheap first pass: if the activations are very similar to training, then it's likely the same mechanism.
  - For inputs where activations are novel, run a lightweight counterfactual test (e.g., a few perturbations) to see if the model behaves robustly (like the training distribution). If it breaks, flag.

  But note: this doesn't resolve level-relativity and might miss memorization.

  Alternatively, we might precompute a set of counterfactual tests for the training distribution and then at inference time, run a subset of these tests on the input to see if the model responds similarly. This is expensive but might be optimized.

  However, the core challenge (level-relativity) remains.

  Given the time, we might have to accept that we cannot have a perfect criterion and instead use a combination that works well in practice, knowing its limitations.

  Final List of Desiderata:

  1. **Non-Negotiable: Distinguish memorization from generalization**.
  2. **Non-Negotiable: Detect off-distribution divergence risk**.
  3. **Non-Negotiable: Work across models (seeds, scales)**.
  4. **Non-Negotiable: Resolve level-relativity without post-hoc choice**.
  5. **Non-Negotiable: Handle self-repair (flag the repaired mechanism as new)**.
  6. **Non-Negotiable: Clearly separate chain of thought (generation is mechanism, the text is input)**.
  7. **Non-Negotiable: Feasible at inference time**.

  And we note that 4 is the hardest and currently unsolved.

  Given that, we might relax 4 by specifying that the level is fixed by the validation set: we validate a set of mechanisms at a given level (e.g., attention heads and MLP layers) and then monitor at that level. But that doesn't resolve the grain: we still have to choose.

  Alternatively, we might define the mechanism at the level of the function it computes: if the function is the same, then it's the same mechanism. But then memorization and generalization compute the same function on the training set, so we miss case 1.

  Therefore, we must require that the mechanism is the same only if it is implemented in the same way (structurally) and also behaves the same under counterfactuals. But that's two criteria.

  In conclusion, there is no silver bullet. We must make trade-offs.

  For the anomaly detector, we suggest:

  - Use representational similarity (with a reference set of training activations) to detect novel activations. This is cheap and catches some anomalies.
  - For the cases we care most about (e.g., critical functions), precompute a set of counterfactual tests and run them at inference time (or in a shadow mode) to check robustness.

  But note: this does not fully satisfy desideratum 4 and might not catch memorization.

  Finally, we present the table:

  | Criterion          | 1 (memorization) | 2 (off-distribution) | 3 (across models) | 4 (level-relativity) | 5 (self-repair) | 6 (chain of thought) | 7 (cost) |
  |--------------------|------------------|----------------------|-------------------|----------------------|-----------------|----------------------|----------|
  | Causal Abstraction | Good             | Good                 | Poor (alignment) | Poor (level choice)  | Good            | Good                 | Poor     |
  | Representational   | Poor             | Fair (if novel acts) | Good             | Poor (level choice)  | Fair            | Fair                 | Good     |
  | Behavioral Counterf| Poor             | Fair (with tests)    | Good             | N/A (no internals)   | Poor            | Poor                 | Fair     |

  Note: 
  - For 2, Behavioral Counterfactual requires off-distribution tests and labels, which we may not have.
  - For 4, none are good.

  We hope this helps in designing the system with awareness of the limitations.
answer: |-
  ### Desiderata for a Mechanism Sameness Criterion in Anomaly Detection  
  Below, I outline desiderata for a criterion that determines whether a language model uses the "same mechanism" on a novel input as it did during training or validation. The goal is to flag inputs where the model relies on a mechanism that was either unused or unvalidated on the training distribution. Each desideratum is motivated by a concrete case, marked as **non-negotiable** (essential for deployment) or a **preference** of a specific camp (causal-intervention, representational-similarity, behavioral-counterfactual). I then identify conflicts, score candidate criteria, and distinguish settled from contested points.

  ---

  #### **Desiderata & Motivating Cases**  
  1. **Distinguish behavioral identity from mechanistic difference**  
     - **Case**: A fine-tuned model reproduces in-distribution outputs via memorization (not the original generalizing circuit). On the same input, both models behave identically, but the fine-tuned one uses a new, unvalidated mechanism.  
     - **Requirement**: The criterion must detect when identical outputs stem from different mechanisms.  
     - **Status**: **Non-negotiable**. Failure risks missing "silent failures" where outputs appear correct but rely on brittle mechanisms.  

  2. **Detect off-distribution divergence under monitoring**  
     - **Case**: A model behaves identically to the training distribution when probed (e.g., via logit analysis) but fails on off-distribution inputs where monitoring is absent.  
     - **Requirement**: The criterion must predict when a mechanism will diverge off-distribution, even if on-distribution behavior matches.  
     - **Status**: **Non-negotiable**. Deployment safety requires anticipating hidden failures.  

  3. **Support cross-model comparability (scales, seeds, architectures)**  
     - **Case**: Comparing a 7B model to a 175B model on the same task—no shared parameters, but both may use "similar" mechanisms (e.g., induction heads).  
     - **Requirement**: Sameness must be definable across models without parameter matching.  
     - **Status**: **Non-negotiable**. Validation often uses smaller proxies; deployment scales must align.  

  4. **Resolve level-relativity without post-hoc grain selection**  
     - **Case**: Under a coarse grain (e.g., "attention layer 5 handles facts"), two inputs use the "same mechanism"; under a fine grain (e.g., "head 5.3 updates fact embeddings"), they differ. The criterion must specify which grain matters for safety.  
     - **Requirement**: The grain must be fixed by the criterion, not chosen ad hoc.  
     - **Status**: **Non-negotiable**. Post-hoc grain selection invites cherry-picking and voids objectivity.  

  5. **Handle self-repair without false negatives**  
     - **Case**: After ablating a circuit, the model "grows" a functionally equivalent one via fine-tuning. The new circuit is mechanistically distinct (e.g., different neurons/paths) but recovers the original behavior.  
     - **Requirement**: The criterion must flag the new circuit as "different" (unvalidated), even if behaviorally equivalent.  
     - **Status**: **Non-negotiable**. Self-repair introduces novel, untested mechanisms.  

  6. **Classify chain-of-thought (CoT) generation vs. usage**  
     - **Case**: When a model generates CoT steps, is the CoT (a) part of the mechanism (thus subject to validation) or (b) an input to downstream components?  
     - **Requirement**: The criterion must assign CoT unambiguously: generation is mechanism; consumption is input processing.  
     - **Status**: **Non-negotiable**. CoT is ubiquitous; misclassification invalidates monitoring.  

  7. **Inference-time feasibility**  
     - **Case**: Full circuit diagrams or exhaustive interventions are prohibitively expensive for real-time deployment.  
     - **Requirement**: The criterion must run with low latency (e.g., via activation checks, not full interpretability scans).  
     - **Status**: **Non-negotiable**. Impractical criteria are useless in production.  

  8. **Preference (Causal-Intervention Camp): Intervention robustness**  
     - **Motivation**: Sameness requires that targeted interventions (e.g., activation patching) produce identical behavioral changes across distributions.  
     - **Case**: If patching a neuron changes outputs on training data but not on a novel input, the mechanism differs.  

  9. **Preference (Representational-Similarity Camp): Activation consistency**  
     - **Motivation**: Mechanisms are the same if internal activations (e.g., via CKA or CCA) align with training distribution patterns.  
     - **Case**: Novel inputs causing activation outliers (e.g., high KL divergence) indicate a new mechanism.  

  10. **Preference (Behavioral-Counterfactual Camp): Input-output stability**  
      - **Motivation**: Sameness requires identical outputs for counterfactual inputs (e.g., paraphrases or perturbations) within a trusted domain.  
      - **Case**: If a model responds identically to rephrased queries on training data but not on novel inputs, the mechanism differs.  

  ---

  #### **Conflicts Between Desiderata**  
  - **Desiderata 1 vs. 7**: Distinguishing memorization from generalization (1) requires probing counterfactuals (e.g., "Does slight input perturbation break output?"), which clashes with inference-time cost (7).  
  - **Desiderata 4 vs. 8/9/10**: Level-relativity resolution (4) demands a grain-agnostic criterion, but all camps (8–10) implicitly assume a grain (e.g., interventions on what variables?).  
  - **Desiderata 3 vs. 9**: Cross-model comparability (3) is natural for representational similarity (9) but challenging for causal interventions (8), which require aligned variables across architectures.  

  **Eliminator Requirement**: **Desideratum 4 (level-relativity resolution)** is the single biggest eliminator. Most criteria (e.g., causal abstraction) assume a grain and fail when grain choice is contested.  

  ---

  #### **Candidate Criteria Scoring**  
  | **Criterion**               | **1** | **2** | **3** | **4** | **5** | **6** | **7** | **Notes** |  
  |-----------------------------|-------|-------|-------|-------|-------|-------|-------|-----------|  
  | **Causal Abstraction**      | ✓✓    | ✓✓    | △     | ✗     | ✓✓    | ✓     | △     | ✓✓ = strong; ✓ = moderate; △ = partial; ✗ = weak |  
  | (Intervention-based)        |       |       |       |       |       |       |       | Strengths: Handles 1,2,5. Weaknesses: Grain choice (4), cross-model (3), cost (7). |  
  | **Representational Similarity** | △     | △     | ✓✓    | ✗     | △     | △     | ✓✓    | Strengths: Cheap (7), cross-model (3). Weaknesses: Misses behavioral clones (1,2), grain (4). |  
  | **Behavioral Counterfactual** | ✗     | △     | ✓✓    | ✗     | ✗     | ✗     | ✓     | Strengths: Cross-model (3), cheap if limited. Weaknesses: Fails 1,5,6; grain (4). |  
  | **Hybrid (e.g., RS + light interventions)** | ✓     | ✓     | ✓     | ✗     | ✓     | △     | △     | Best compromise but still fails 4. |  

  **Key**:  
  - **1**: Memorization vs. generalization  
  - **2**: Off-distribution divergence  
  - **3**: Cross-model comparability  
  - **4**: Level-relativity resolution  
  - **5**: Self-repair  
  - **6**: CoT handling  
  - **7**: Inference-time cost  

  ---

  #### **Settled vs. Contested**  
  **Settled (Broad Consensus)**:  
  - Mechanistic sameness requires more than input-output equivalence (Desideratum 1). Pure behavioral checks (e.g., logit matching) are insufficient.  
  - Internal activations provide signal for mechanism shifts (Desideratum 9), but raw similarity metrics (e.g., CKA) are unreliable alone.  
  - Inference-time cost (Desideratum 7) necessitates approximations (e.g., activation monitoring > full interventions).  

  **Contested (Active Debate)**:  
  - **Grain selection (Desideratum 4)**:  
    - Causal-intervention camp: Grain should be tied to *causal variables* (e.g., "circuits" with clear input-output mappings).  
    - Representational camp: Grain emerges from *statistical patterns* (e.g., automatically clustered activation subspaces).  
    - No consensus on automating grain selection; some argue safety-critical grains must be predefined.  
  - **Self-repair (Desideratum 5)**:  
    - Some argue self-repair is "same mechanism" if function is identical; others insist structural differences invalidate validation.  
  - **Cross-model alignment (Desideratum 3)**:  
    - Behavioral camp: Output equivalence under counterfactuals suffices.  
    - Causal camp: Requires interventional alignment (e.g., via shared variable sets), which lacks scalable methods.  
  - **CoT status (Desideratum 6)**:  
    - Most agree CoT *generation* is mechanism, but *usage* is input processing. Contention exists on how to validate generative steps.  

  ---

  #### **Conclusion**  
  For anomaly detection, prioritize **causal abstraction with lightweight interventions** (e.g., targeted activation patching on predefined circuits) paired with **representational similarity checks**. This balances Desiderata 1,2,5,6 and partially addresses 3 and 7, but **Desideratum 4 (level-relativity) remains unresolved and critical**. No existing criterion satisfies all requirements; trade-offs are unavoidable. If cost permits, use dynamic grain selection via predefined safety-critical circuits (e.g., "fact recall" or "reasoning" modules). Genuine progress hinges on automating grain resolution—currently the field's biggest gap.
