answer: |-
  ### Rietdijk–Putnam Argument in Original Terms
  The Rietdijk–Putnam argument uses special relativity to argue for eternalism (the "block universe"). Key steps:  
  1. **Relativity of simultaneity**: Events simultaneous in one inertial frame may not be in another.  
  2. **Spacelike separation**: For an event on Earth (e.g., you reading this) and a distant event (e.g., in Andromeda), there exist frames where:  
     - Frame A: Andromeda event is in your past.  
     - Frame B: Andromeda event is in your future.  
     - Frame C: Andromeda event is simultaneous with your "now".  
  3. **Reality claim**: If an event is "real" for you (e.g., in your present or past), it must be objectively real.  
  4. **Contradiction avoidance**: Since frames disagree on whether the Andromeda event is past/future/present *at your current spacetime location*, the only consistent solution is that *all* events—past, present, and future—are equally real. Thus, time is a static "block".  

  The Andromeda paradox highlights this: Two observers at the same spacetime point but moving relative to each other will disagree on whether an Andromeda event (e.g., a fleet launch) is "happening now" or fixed in the past/future.  

  ---

  ### Translation to Distributed Systems Vocabulary  
  Using your manual (adjusted for precision):  
  - **Event** = Local state transition in a process (e.g., `send`, `receive`, `compute`).  
  - **Worldline** = Process timeline (sequence of local states/events).  
  - **Simultaneity** = **Spacelike set** (not consistent cut!): A set of events, one per process, with no causal (`happens-before`) relationships between them.  
  - **Observer's present** = **Local frontier + spacelike extrapolation**: The latest local state, plus all events at other processes *concurrent* with it (i.e., no messages yet received from those events).  
  - **Block universe** = Entire state space of a *completed execution* (a fixed trace of all events, ordered by `happens-before`).  
  - **Passage** = **Local state refinement**: Updates via message delivery (appending new events to the local timeline).  

  #### Translated Argument:  
  Consider two Earth-bound processes (`O_A` Alice, `O_B` Bob) at the same local event (e.g., `E_earth`), and a remote process `Andromeda`. Assume:  
  - `O_A` and `O_B` have different velocities → different message delivery latencies from `Andromeda`.  
  - Event `E_andr1` (fleet decision) and `E_andr2` (fleet launch) at `Andromeda` with `E_andr1 → E_andr2` (causal order).  
  - `E_earth` is *spacelike-separated* from both `E_andr1` and `E_andr2`: No causal path exists, so `E_earth` is concurrent with both.  

  Now:  
  - **Alice's "present"**: Her local state at `E_earth` defines a spacelike set: `{E_earth, E_andr1}`.  
    - *To her*, `E_andr1` is "happening now"; `E_andr2` is "undetermined future" (not yet causally influenced by it).  
  - **Bob's "present"**: His local state at `E_earth` defines a different spacelike set: `{E_earth, E_andr2}`.  
    - *To him*, `E_andr2` is "happening now"; `E_andr1` is "fixed past" (causally settled).  

  **Contradiction**: If "real" means "in my present," then `E_andr1` is real for Alice but not Bob, and `E_andr2` is real for Bob but not Alice—despite both being at `E_earth`.  

  **Resolution**: The only invariant is the *entire execution trace* (all events ordered by `happens-before`). `E_andr1` and `E_andr2` are both "real" in the block universe (i.e., part of the trace), regardless of local perspectives.  

  ---

  ### Residue Report: What Translates, What Doesn't  
  | **Concept**               | **Translation Status**                                                                 | **Notes**                                                                                                                                 |
  |---------------------------|----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **Events/worldlines**     | ✅ Clean                                                                               | Direct mapping: Local transitions and process timelines.                                                                                 |
  | **Spacelike separation**  | ✅ Clean                                                                               | = No `happens-before` link; events are concurrent.                                                                                        |
  | **Simultaneity**          | ⚠️ Requires adjustment                                                                | Not a *consistent cut* (which includes causal past). Use **spacelike set** (maximal set of pairwise concurrent events).                   |
  | **Observer's present**    | ⚠️ Partial                                                                             | "Local frontier" (known state) is clean. "Spacelike extrapolation" adds frame-dependent concurrency—matches relativity but is not dynamic. |
  | **Block universe**        | ✅ Clean                                                                               | Fixed execution trace with total order extending `happens-before`.                                                                        |
  | **Passage of time**       | ❌ No direct counterpart                                                               | Local state refinement models *information flow*, not ontological becoming (see below).                                                  |
  | **"Real"/"Exists"**       | ❌ No counterpart; **smuggles philosophy**                                             | Computation treats the trace as "representational." "Real" smuggles an *ontological commitment* to the trace's mind-independence.         |
  | **"Is happening now"**    | ❌ Misleading if taken literally                                                       | In computation, it's epistemic: "has been causally received." No notion of *temporal becoming*.                                          |
  | **Frame-dependence**      | ✅ Clean                                                                               | = Dependence on observer process's delivery latency/profile.                                                                              |
  | **Andromeda paradox**     | ✅ Clean                                                                               | Disagreement on spacelike sets shows relativity of "now."                                                                                 |

  #### Key Tensions:  
  1. **"Real" smuggles metaphysics**:  
     - Computational model: The trace is a *mathematical object* (e.g., a Kripke structure). Calling it "real" adds an external claim that "the model is reality."  
     - Rietdijk–Putnam assumes: *If an event is real in one frame, it must be real in all*. Computation has no such axiom—it’s happy with multiple inconsistent cuts for different observers.  

  2. **Asymmetry of local indeterminism**:  
     - Your flip-flop is justified! In distributed systems:  
       - *Local future*: Nondeterministic (choices not yet made).  
       - *Remote events*: Fixed but unknown (if spacelike-separated).  
     - **Is this "becoming"?**  
       - ✅ *Structurally*, it matches the *phenomenology* of becoming: Local state evolves; "future" is indeterminate; "past" is fixed.  
       - ❌ *Ontologically*, no: The trace is static. Nondeterminism is representational (we don’t know the path yet), not temporal emergence.  
     - **What settles it?**  
       - If the universe is fundamentally deterministic → trace is fixed; "becoming" is epistemic (your view).  
       - If fundamentally nondeterministic → multiple traces possible; "becoming" is ontological (trace isn’t fixed until "resolved").  
