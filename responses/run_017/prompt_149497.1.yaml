prompt: |-
  I'm on a small grantmaking committee — we hand out maybe a dozen grants a year, mostly health and poverty stuff, nothing fancy — and I keep noticing a move in our discussions that I don't have a word for.

  It goes like this. We're comparing two proposals. One is a programme we've funded before, with audits and follow-up data. The other is something new, and somebody says: but we have no idea what the knock-on effects of *that* will be in ten years, so we can't really rank them against each other. And nobody ever says the same thing about the programme we've funded before, even though it's ten-year knock-on effects are just as unmodelable — we simply happen to have decent data on the first eighteen months.

  Two more cases of the same shape. When somebody proposes funding research to work out which causes actually matter, this whole style of objection disappears: nobody says we can't predict the long-run effects of funding the research. And when somebody proposes *stopping* something we've been funding for years, the objection flips sides, and now it's deployed against stopping. That last one is what makes me think it isn't tracking any property of the options at all.

  But I don't think it's just bias either, and that's the bit I want help with. There does seem to be a real asymmetry: we have reciepts and audits for the thing we've been running, and for the new thing we have a story plus some numbers somebody made up. And — this feels like the load-bearing part — mistakes in estimating push an option *up* our ranking but never down, so the proposals that look best on paper are systematically the ones most likely to have been over-estimated. That's a genuine reason to tilt toward the boring option. But the boring option's far-future effects are exactly as unknown as the exciting one's, and if the far-future effects are the ones doing the work, then the tilt should be tiny rather than the conversation-ender it usually is.

  So: is there an established concept for this specific thing — the selective, one-sided deployment of "you can't predict the consequences" — as opposed to cluelessness in general? I know people talk about cluelessness for the general problem that long-run effects swamp short-run ones, but that's symmetric and mine isn't. "Status quo bias" isn't right either, since that's suppose to be a bare preference for how things already are, whereas this move is offered as an epistemic reason and at least sometimes is one.

  If nothing fits, name it and define it carefully, and tell me where it stops: does it still apply when the incumbent is itself only a year old and has no track record? When both options have real data behind them? When the intervention is reversible and you can back out in two years? I'm after which part of the move is doing the real work and which part is decoration, not a label to stick on it.
reasoning: |-
  Okay, the user is part of a grantmaking committee dealing with health and poverty projects. They've noticed a pattern in discussions where objections about unpredictable long-term effects are only raised against new proposals, not existing ones, even though both have equally unknowable future impacts. They want to know if there's a term for this specific selective skepticism.

  First, I need to understand the core issue. The asymmetry in applying uncertainty concerns: existing programs get a pass on long-term unpredictability because they have short-term data, while new proposals are criticized for the same issue. The user mentions that this objection disappears when proposing research or flips when considering stopping a program. That suggests it's not just status quo bias but something more nuanced.

  The user is looking for a term that describes this selective deployment of cluelessness. They mention existing concepts like cluelessness (from philosophy/effective altruism) and status quo bias, but neither fits perfectly. Cluelessness is symmetric, while this is asymmetric. Status quo bias is a preference, but here it's framed as an epistemic reason. So the challenge is to find or create a term that captures this specific behavior.

  I recall that in decision theory, there's the "precautionary principle," often applied to new interventions. But here it's applied inconsistently. Maybe it's related to ambiguity aversion or the endowment effect. Ambiguity aversion is the preference for known risks over unknown ones, which could explain favoring existing programs with some data. The endowment effect makes people value what they already have more highly. Both could contribute to this asymmetry.

  Another angle is epistemic privileging of the status quo. The committee treats existing programs as the default, requiring less proof for their continuation, while new ones need to overcome higher evidential hurdles. That's similar to the concept of "incumbent advantage" in business or "system justification" in psychology. Also, the "default effect" in behavioral economics where the current option is favored unless there's strong evidence against it.

  The user also points out that estimation errors only push options up, not down. That's the optimism bias in planning, where new projects are overestimated. This creates a systematic bias where only new proposals are scrutinized for long-term uncertainty, while existing ones benefit from their track record, even if it's short-term.

  So, putting this together, the term could be something like "asymmetric cluelessness deployment" or "epistemically asymmetric status quo bias." But maybe "incumbency shield" or "default epistemic privilege" is better. The key elements are the selective application of uncertainty, the higher burden of proof for new actions, and the ignoring of long-term unknowns for the status quo.

  The user also asks about boundary cases: what if the incumbent is new, both have data, or if the intervention is reversible. This tests the underlying mechanism. For example, if the incumbent is new with no track record, does the bias still apply? Probably less so, suggesting that perceived establishment matters. If both have data, the asymmetry might decrease. Reversibility might reduce the bias because the risk of stopping or changing is lower. These cases help isolate the factors: the need for perceived stability and aversion to perceived risk in new actions.

  In conclusion, the closest existing concept might be a combination of ambiguity aversion and the default effect, but a precise term like "epistemic incumbency advantage" or "asymmetric uncertainty application" could be coined. The real work is done by the comfort with short-term data for existing programs and the higher evidential burden for new ones, while the decoration is the focus on long-term unpredictability only when it serves to maintain the status quo.
answer: |-
  Your observation is razor-sharp and captures a profound, under-discussed flaw in decision-making under uncertainty. This isn't just "cluelessness" or "status quo bias" – it's a specific, asymmetric *deployment* of uncertainty arguments. The closest established concept is **Epistemically Asymmetric Burden of Proof**, but it needs refinement. Let's define it:

  **The Concept: Selective Uncertainty Deployment (SUD)**
  *SUD occurs when the requirement to model/predict long-term or systemic consequences is applied only to proposed deviations from the status quo (new actions or cessation of existing actions), while the status quo itself is exempt from the same epistemic scrutiny regarding its long-term effects, despite possessing equivalent fundamental unpredictability.*

  **Why it's distinct & why it happens:**
  1.  **Asymmetric Burden of Proof:** The status quo benefits from a lower burden of proof. Its short-term track record (receipts, 18mo data) is treated as sufficient evidence for its *overall* acceptability, implicitly assuming its long-term effects are neutral, manageable, or simply "the baseline." Novelty carries a higher burden.
  2.  **Ambiguity Aversion + Endowment Effect:** Decision-makers are more averse to the *ambiguity* of the unknown new option than the *risk* of the known (but equally long-term-unpredictable) incumbent. The incumbent feels "owned" (endowment effect), making its potential long-term downsides psychologically less salient.
  3.  **System Justification & Loss Aversion:** Deviating from the current path feels like an active choice risking loss. Maintaining feels passive and safe. The potential losses from stopping a funded program or funding a new flop feel more concrete than the potential losses (opportunity costs, unforeseen harms) of *continuing* the incumbent. Framing matters enormously.
  4.  **The Estimation Error Bias You Identified:** This is crucial. Short-term data provides *something* to measure, even if flawed. Over-optimism in novel proposals is well-documented (planning fallacy). SUD exploits this: "Your novel proposal might be *overestimated*, so we must discount it heavily for long-term unknowns." The incumbent avoids this discounting because its short-term data is seen as "real," even if it tells us nothing about decade-long effects. This asymmetry *is* rational in a narrow sense (mitigating optimism bias for new things), but it becomes irrational when long-term uncertainty is invoked selectively as a conversation-ender.

  **What's Doing the Real Work vs. Decoration:**

  *   **The Real Work:**
      *   **The Presence of *Any* Concrete Data (Short-Term):** This provides psychological comfort and a focal point, even if irrelevant to the long-term argument being made. It shifts the burden.
      *   **The Action/Change Itself:** Proposing *change* (starting new, stopping old) triggers the demand for impossible long-term certainty. Inertia does not.
      *   **The Perceived Risk of Active Error:** Mistakes from *acting* (funding a dud, stopping a winner) feel more blameworthy than mistakes from *inaction* (missing an opportunity, continuing a loser). SUD is a defense against blame.
      *   **The Hidden Baseline:** The long-term effects of the status quo are treated as the "default" or "zero point," obscuring that its long-term impact is just as unknown and potentially negative.
  *   **The Decoration:**
      *   *Specifically* invoking "10-year knock-on effects." The *timescale* is often arbitrary window-dressing. The core move is "We can't predict the *full consequences* of changing."
      *   The *rhetorical flourish* of "unmodelable complexity." The move works because the uncertainty is genuine; the flaw is its selective application.
      *   Claiming it's *only* about the far future. Often, it's masking near-term risk aversion or discomfort with novelty.

  **Testing the Boundaries (Where SUD Applies/Weakens):**

  1.  **Brand New Incumbent (No Track Record):** SUD **weakens significantly.** If the "status quo" is itself only a year old with minimal data, the psychological grip of ownership/system justification is weaker. The asymmetry in burden of proof is less pronounced. Arguments about its long-term unknowns might actually surface. *The key factor is the perception of being "established."*
  2.  **Both Options Have Substantial Real Data:** SUD **weakens but can persist.** If both proposals have robust short/mid-term data, the comparison becomes more about interpreting *that* data. However, if one is the incumbent, the tendency might *still* be to demand *more* certainty about the long-term implications of switching *away* from it than the implications of keeping it. The incumbent retains a slight epistemic privilege.
  3.  **Reversible Intervention:** SUD **weakens considerably.** If the novel proposal (or cessation) can be easily reversed with minimal cost after a short pilot (e.g., 2 years), the "impossible demand" for long-term prediction loses force. The argument shifts to: "We can try it cautiously and learn." The perceived risk of irreversible error diminishes. *Reversibility directly attacks the core fear driving SUD.*
  4.  **Stopping vs. Starting:** As you noted, SUD **flips but persists.** When *stopping* is proposed, the demand for impossible long-term certainty ("But what if stopping causes unforeseen catastrophe in 10 years?") is deployed *against* stopping, protecting the incumbent. The asymmetry favors *inaction* (whether that's continuing funding or not starting something new).

  **How to Counteract SUD in Your Committee:**

  1.  **Name It Explicitly:** "This feels like Selective Uncertainty Deployment. We're demanding impossible long-term certainty for the change but not applying the same standard to continuing. Both have unknowable decade-long effects. The short-term data on [Incumbent] is valuable, but it doesn't resolve the long-term uncertainty we're invoking against [New/Stop]."
  2.  **Reframe the Baseline:** "The relevant comparison isn't 'known safe incumbent' vs. 'unknown risky new thing.' It's 'incumbent with known short-term effects *but unknown long-term effects*' vs. 'new thing with predicted short-term effects *but unknown long-term effects*'. Both have a huge unknown component."
  3.  **Focus on the Asymmetric Burden:** "Why does the burden of proving long-term safety/predictability fall only on the proposal to change? Shouldn't we also critically examine the long-term unknowns of continuing as we are?"
  4.  **Highlight the Estimation Error Bias:** "We know novel proposals often suffer from over-optimism in their short-term projections. That's a reason to scrutinize those projections carefully. But it's *not* a unique reason to demand certainty about the *far future*, which is equally uncertain for both options. Discounting for short-term optimism is different from invoking unanswerable long-term questions selectively."
  5.  **Pilot Programs & Reversibility:** Push for framing new proposals as limited, reversible pilots explicitly designed to *reduce* the very uncertainty being weaponized against them. "Let's fund a tightly monitored 2-year pilot. If the short-term data matches their projections reasonably well, and no major red flags appear, that significantly reduces the *relevant* uncertainty compared to demanding a 10-year crystal ball upfront."
  6.  **Value of Information (VoI):** For research proposals, emphasize that funding research *is* the way to reduce the long-term uncertainty paralyzing decisions about *other* interventions. "Funding *this research* directly addresses the 'knock-on effects' uncertainty you're worried about for other potential interventions. It's not subject to the same level of long-term unpredictability in its *primary outcome* (generating knowledge)."

  You've identified a subtle but powerful cognitive distortion. It leverages genuine uncertainty and cognitive biases to protect the status quo under the guise of epistemic rigor. Calling it out by naming its components – asymmetric burden of proof, selective application of uncertainty, hidden baseline, estimation error bias – is the first step towards more balanced decision-making.
