  ## Courthouse Square Remarks

  Friends and neighbors. Thank you for gathering in this square – *our* square – on a day that asks something of us. Five years ago, this committee was tasked with considering the future of the Elias Rowntree monument. Today, you see the result of that long process: the bronze figure has been moved to the lawn of the County Historical Society, and in its place on this pedestal is a new tablet, carrying a message to the future.

  This change wasn’t made lightly. For over a century, this monument stood here, and a story grew around it: the story of Elias Rowntree as the generous donor of this land and the town’s first schoolhouse. That story became part of the fabric of this place. It’s important to say this plainly: **The monument is gone from this spot because the record of deeds shows Rowntree sold the land at market price, and the school was built by the community through a levy.** That’s the historical fact we confronted.

  But a monument is never *just* a history lesson. It becomes part of the landscape of our lives. For eighty years, this very spot has been where we’ve gathered on Memorial Day. Where veterans have been honored, wreaths laid, and silence held. **For many of you, the meaning of this monument wasn’t about Elias Rowntree’s deeds at all, but about the living tradition that grew up around it – a tradition of remembrance and community that belongs entirely to us, the living.** That tradition, that gathering, holds its own value and weight. Taking that away would have felt like taking something vital from the square itself. That’s why the pedestal stays. This place, and the tradition rooted here, remain.

  **(Here, pause and gesture to the pedestal and the new tablet)**

  This new tablet doesn’t claim we’ve settled the final truth about Elias Rowntree, or that we’ve judged him completely. It doesn’t carry his name. Instead, it states simply that we moved the figure because we could no longer stand by the claim it seemed to make about the land. And it asks those who stand here fifty years from now to look back and judge whether we made the right choice. It’s an admission that our understanding, like history itself, is not fixed, but something we grapple with across generations.

  To those for whom the figure held a personal connection, perhaps as a landmark in your life or a link to family history, we understand that seeing it gone may feel like a loss. That connection was real. **The meaning you found here wasn’t a mistake.** What stays is the place itself, the pedestal that grounded the monument, and the enduring tradition of Memorial Day that transcends any single figure.

  We haven’t erased Elias Rowntree. His figure now stands two hundred yards away, on the lawn of the County Historical Society. Beside it, you’ll find a small case displaying the county historian’s research into the land transactions that led to this moment. **This wasn’t about banishing the past, but about shifting its setting – from a pedestal of honor in the heart of our public life, to a place of record and context alongside other pieces of our complex story.** It reflects a choice: that while we honor the *practices* and *traditions* born in this square, the specific claims a monument makes about history must be accountable to the facts we can find.

  This square remains ours. The pedestal remains. The tradition of gathering here on Memorial Day remains. What has changed is the claim we are willing to make in stone and bronze about how this land came to be public. It’s a change we felt necessary, but one we make knowing its weight, and knowing future generations may see it differently. We did this believing that a community can both cherish its living traditions and strive to be honest with its past.

  Thank you.

  ---

  **Note on Potential Trouble Spots & Replacements:**

  1.  **Original Sentence:** "The monument is gone from this spot because the record of deeds shows Rowntree sold the land at market price, and the school was built by the community through a levy."
      *   **Why Trouble:** While stated plainly as requested, this direct declaration of the "truth" could feel jarring or dismissive to Rowntree's descendants (especially the great-granddaughter who opposed the move) and to those who cherished the old story. It might sound like a definitive judgment being delivered, despite the later caveats.
      *   **Replacement:** "After careful study of the deed records, the committee concluded that the long-held story of Rowntree donating this land and the schoolhouse wasn't supported by the historical evidence we found – evidence showing a sale and a levy."
      *   **Why Better:** It frames the action as based on the committee's *conclusion* from *evidence found*, rather than declaring an absolute truth. It softens the blow slightly while maintaining the factual basis for the move, aligning better with the tablet's message about future judgment.

  2.  **Original Sentence:** "This wasn’t about banishing the past, but about shifting its setting – from a pedestal of honor in the heart of our public life, to a place of record and context alongside other pieces of our complex story."
      *   **Why Trouble:** The phrase "pedestal of honor" could be interpreted by veterans and those focused on Memorial Day as implying the statue itself *was* the object of honor during their ceremonies, which the speech earlier explicitly says it wasn't for many. It might also sound dismissive to the Historical Society board members who see the move as relegation, not a valid "shift."
      *   **Replacement:** "This wasn’t about banishing the past, but about relocating the figure to a different kind of space – from the center of our civic square to a place dedicated specifically to preserving and examining our county's history."
      *   **Why Better:** It avoids the potentially loaded "pedestal of honor" and frames the Historical Society grounds more positively as a specific, appropriate context ("dedicated specifically to preserving and examining"). It focuses on the *location* and *purpose* of the space rather than making a value judgment about "honor" vs. "record."

  These replacements maintain the core message and plain language while slightly increasing the nuance and sensitivity to the specific concerns of key groups in the audience, particularly Rowntree's family and the veterans, without retreating from the essential reasons for the move.
