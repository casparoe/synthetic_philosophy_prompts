prompt: |-
  I have a fifty-minute seminar next week with a first-year PPE cohort: eighteen students, no economics yet, but they did a short game-theory module last term and can read a two-by-two payoff matrix and spot a dominant strategy. The session covers the tragedy of the commons and public goods together, which is the pairing I always find hardest to teach, because the two topics get delivered as neighbours and the students leave having fused them into one thing. They will have read a two-page Hardin excerpt beforehand — the herdsman parable. I don't want the explanation; I want a plan for delivering it, and I want the plan to be built around the dependencies rather than around a list of headings.

  Three things in particular.

  First, the ordering, given as a dependency structure: which idea has to be in place before which other idea can land, and what specifically fails if I invert the order. The ordering has to do real work on a distinction I think the session lives or dies by, and which I've been calling the two-valves picture: a shared resource has an appropriation margin (a valve on the way out, where each user's take imposes a cost on everyone) and a provision or maintenance margin (a valve on the way in, where each user's contribution benefits everyone). The canonical tragedy opens only the first; the canonical free-rider problem opens only the second; structurally they are the same thing with the sign of the externality reversed. I want the plan to say where in the sequence the two valves get introduced, whether they can be introduced together or whether one has to come first, and — importantly — whether a remedy aimed at one valve can leave the other untouched or make it worse. Don't assert that as a general law; show me a case where it happens, so I can say something honest if a student asks.

  Second, the example that carries the whole session. I want one case, and I want it specified precisely enough that I can defend the choice: it must have both valves on the same resource; a user group small enough that the class can name every member (six to ten), so that the reciprocity of the externality is visible rather than abstract; a threshold or other non-convexity somewhere in the system, so that 'sustainable at the current level' and 'safe' come apart and the marginal step that triggers collapse looks exactly like every marginal step before it; and — this is the feature I care most about — a resource that could in principle be divided into private parcels but where the physical unit and the property unit come apart, so that enclosure fails to internalise the externality. It must not contain a villain, a growing population, an outside buyer, a technological fix, or a regulator already on the scene; and it must not be a pasture, a fishery, the atmosphere, or an office fridge. Crucially, the equilibrium must not be total destruction: I don't want anyone leaving with 'the commons is always ruined' as the takeaway. Gradual degradation is enough.

  Third, the misconception map, with each one pinned to a point in the sequence and a note on which ones I should deliberately let form and then break. My guesses: that 'commons' means unowned and that unowned means doomed, so the fix is ownership and ownership means private parcels; that the tragedy is about greed, when it can arise with every user taking exactly an equal share; that commons and public goods are two names for the same thing, or that 'public good' just means 'something good for the public'; that since it's a Prisoner's Dilemma the prediction is mutual defection and therefore the answer is external enforcement; the no-difference excuse — my one animal, my one contribution, changes nothing — which I want handled via the reciprocity point, since the excuse is available to every user simultaneously; and average-rate reasoning about the threshold, the 'it's been fine for years, so one more is fine' move. Tell me which of these I've got wrong, which I'm missing, and in what order they will actually arrive.

  Two closing requests. Give me one question for the last ten minutes that shows me whether the two-valves distinction has been understood rather than memorised — including what a superficially correct but actually empty answer would sound like — and give me the five-minute opening and the single sentence I should leave on the board for the whole session. Finally, tell me what to leave out and say out loud that I'm leaving out: the details of Ostrom's design principles (I want the name and the fact that state-versus-market isn't exhaustive, not eight principles), mechanism design, anything Coasean, and Hardin's later, more polemical writing, along with the empirical question of what actually happened to historical commons — I want to mark that as out of scope without making the model look like an empirical claim about it. And give me one thing I should flatly refuse to answer at this level, with the sentence to refuse it in.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing a fifty-minute seminar for first-year PPE students who have some game theory basics but no economics yet. The main challenge is teaching the tragedy of the commons and public goods without students conflating them. The user wants a plan focused on dependencies, a strong example, misconception management, and specific deliverables like opening/closing elements.

  First, I need to address the dependency structure. The user emphasizes the "two-valves" concept: appropriation (taking from the resource) and provision (contributing to it). The key is sequencing these correctly. If I start with provision, students might confuse it with public goods immediately. But appropriation-first allows introducing the tragedy clearly before layering in provision. The remedy part is crucial too—showing how fixing one valve might worsen the other. The shared irrigation system example with silt buildup (appropriation) and canal maintenance (provision) demonstrates this well. If farmers only coordinate on water quotas but neglect desilting, the system collapses differently. That makes the distinction concrete.

  Next, the example needs to meet all their specifications. The irrigation canal fits: small user group (6-10 farmers), threshold effect (silt accumulation leading to abrupt collapse), and the physical vs. property unit issue (water flow can't be parceled without affecting others). Crucially, degradation is gradual until the tipping point, avoiding total destruction. It avoids villains, tech fixes, and overused tropes like pastures. I should verify it ticks every box: yes to reciprocity, no to external regulators, and the enclosure failure is clear—even if land is private, shared canals remain commons.

  For misconceptions, the user listed several. "Commons means unowned/doomed" must be broken early by showing sustainable examples. "Greed causes tragedy" gets corrected when demonstrating equal-share collapse. The conflation of commons/public goods is the core target, so sequencing valves tackles that. Prisoner's Dilemma fixation needs nuance—showing how conditional cooperation works without enforcement. The "no-difference" excuse requires emphasizing simultaneous reciprocity. Average-rate reasoning is tied to the threshold effect in the example. Order-wise, ownership myths will surface immediately, followed by greed and PD assumptions once matrices appear. The threshold misconception emerges during the collapse explanation.

  The closing question must test deep understanding. Asking "Why would fixing over-extraction worsen canal maintenance?" probes if they see valve interactions. A superficial answer would just label it "negative externality" without mechanism. The opening should hook with the irrigation story, and the persistent sentence—"Two margins: taking and giving, both shared"—keeps focus. Omissions are critical: state Ostrom's existence but skip principles, avoid Coase/mechanism design, and explicitly bracket historical cases. Refuse "Is this model realistic?" by redirecting to conceptual use.

  Finally, I should check pacing. Fifty minutes minus intro/outcome leaves ~35 for active segments. Valve explanations need matrices (10 mins), example deep dive (15), misconception handling woven in, and Q&A (10). The refusal script shuts down unproductive tangents firmly. Overall, this structure forces distinction through sequenced dependencies, anchored by one resilient example.
answer: |-
  Here’s a seminar plan built around conceptual dependencies, with a unified example, misconception sequencing, and precise deliverables. The goal is to force distinction between appropriation and provision externalities ("two valves") while preventing fusion with public goods.

  **Core Dependency Structure (Ordering is Critical):**  
  1. **Start with Appropriation Valve Only** (Tragedy of the Commons):  
     - *Why first?* Students intuitively grasp "taking too much." Hardin’s parable primes this.  
     - *Dependency:* If you start with provision (public goods), students anchor on "contributing" and misapply it to commons. Appropriation must be isolated first.  
     - *What fails if inverted?* Provision-first conflates "under-contribution" (public goods) with "over-appropriation" (commons). Students see both as "selfishness problems" and miss the structural mirror (negative vs. positive externality).  

  2. **Introduce Provision Valve Second** (Public Goods):  
     - *Why now?* Contrast with appropriation. Show the *same resource* can have both margins.  
     - *Dependency:* Appropriation must be solid first. The valves are distinct but can coexist on one resource.  

  3. **Show Interaction of Valves & Remedies**:  
     - *Critical Dependency:* Remedies for one valve can worsen the other. **Must follow both valve introductions.**  
     - *Example:* Fixing over-appropriation may *undermine* provision incentives (see case below).  

  ---

  **The Unifying Example: Shared Irrigation Canal System**  
  *Why it fits:*  
  - **Small user group (6-10 farmers)**: Each named (e.g., "Farmer Ana, Ben, Chi..."). Reciprocity is visible: Ana’s water use affects Ben’s silt buildup.  
  - **Both valves**:  
    - *Appropriation valve*: Water extraction for crops (each liter taken reduces flow/quality for others).  
    - *Provision valve*: Desilting/maintenance labor (each hour worked benefits all by preventing blockages).  
  - **Threshold**: Gradual silt accumulation until a critical point → sudden collapse (canal blocks entirely). *Not total destruction*: Collapse is reversible with massive effort, but gradual degradation is normal.  
  - **Enclosure failure**: Land is privately owned, but water flow *must* be shared due to physics. Parceling land doesn’t internalize canal externalities—Ana’s silt affects Ben even if plots are fenced.  
  - *Excluded*: No villains (all farmers identical), no tech fixes, no regulator, no population growth.  

  ---

  **Misconception Map & Sequencing:**  
  1. **"Commons = unowned → doomed → fix is private parcels"**  
     - *When formed:* During initial Hardin discussion.  
     - *When to break:* Immediately after introducing example. **Show enclosure fails** (private land, shared canal).  
     - *Tool:* "If land is private but the canal is shared, can Ana ignore silt she causes?"  

  2. **"Tragedy is caused by greed/overuse"**  
     - *When formed:* During appropriation valve explanation.  
     - *When to break:* When setting up payoff matrix. **Show tragedy occurs with equal sharing**:  
       - Matrix: Each farmer chooses "Take 1 unit" or "Take 0.8 units" of water.  
       - Dominant strategy: "Take 1" even if all choose equally → system degrades.  

  3. **"Commons/public goods are the same" or "Public good = good for public"**  
     - *When formed:* When provision valve is introduced.  
     - *When to break:* During valve interaction. **Contrast**:  
       - *Commons*: Rivalrous (Ana’s water use rivals Ben’s) but non-excludable.  
       - *Public good*: Non-rivalrous (Ana’s canal maintenance doesn’t rival Ben’s use) and non-excludable.  

  4. **"Prisoner’s Dilemma → mutual defection → need external enforcement"**  
     - *When formed:* When game matrices appear.  
     - *When to break:* During threshold discussion. **Show conditional cooperation**:  
       - "If silt is near threshold, might Ben maintain canals *if* others do?" (Stag Hunt, not PD).  

  5. **"My one animal/contribution changes nothing" (no-difference excuse)**  
     - *When formed:* During provision valve discussion.  
     - *When to break:* Use reciprocity: "If *every* farmer says ‘my silt is negligible,’ what happens?"  

  6. **Average-rate reasoning threshold ("It’s been fine, so one more is fine")**  
     - *When formed:* During threshold setup.  
     - *When to break:* Show the marginal step *after* the threshold isn’t marginal in outcome.  

  ---

  **Deliverables:**  
  1. **Opening (5 mins)**:  
     > *"Ana and Ben are neighbours. They share a canal that brings water to their fields. Last year, the canal collapsed. No one could farm. Today, we’ll discover why this wasn’t an accident—and why ‘sharing’ has two very different problems hidden in it."*  
     *(Write on board: "Two margins: taking and giving, both shared")*  

  2. **Persistent Board Sentence**:  
     > **"Two valves: What you take vs. what you give."**  

  3. **Closing Check-for-Understanding Question (Last 10 mins)**:  
     - *Question:* "Suppose the farmers successfully limit water extraction (solving over-appropriation). Could this make the canal maintenance problem *worse*? Why?"  
     - *Superficial answer:* "Yes, because they’re lazy now." (Empty: no mechanism).  
     - *Target answer:* "Yes, if they feel ‘we fixed the canal’ by reducing water, they might under-invest in desilting, pushing silt closer to threshold." (Shows valve interaction).  

  4. **Omissions (State Explicitly)**:  
     - *Early on:* "We’re building a *conceptual model* today. We won’t cover historical commons (like medieval pastures), Coasean bargaining, mechanism design, or Ostrom’s design principles—though her key insight was that communities *can* self-govern without states or markets."  
     - *When asked:* **Refuse to answer: "Is this model realistic?"**  
       - *Response:* "Today we’re asking *how the logic works*, not whether it fits all cases. That’s for future seminars."  

  ---

  **Flow & Timing**:  
  - **0-5 min**: Opening hook + board sentence.  
  - **5-20 min**: **Appropriation valve only** (Irrigation example: water extraction → degradation; payoff matrix; dominant strategy). Break misconception #1 & #2.  
  - **20-30 min**: **Add provision valve** (Canal maintenance; new matrix showing under-provision). Break misconception #3.  
  - **30-40 min**: **Valve interaction** (Threshold collapse; how quota agreement might reduce maintenance effort). Break misconceptions #4 & #5.  
  - **40-45 min**: **Threshold discussion** (Gradual silt vs. sudden collapse). Break misconception #6.  
  - **45-50 min**: Closing question + reinforce board sentence.  

  **Why this works**: The irrigation canal forces distinction—water taking (rivalry) vs. maintenance labor (non-rivalry). The enclosure failure blocks the "private property fixes all" myth. The threshold prevents "always total ruin," and valve interaction prevents fusion. By sequencing valves and breaking misconceptions *as they arise*, the distinction becomes unavoidable.
