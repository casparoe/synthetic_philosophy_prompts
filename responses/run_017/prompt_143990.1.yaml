prompt: |-
  I am a professor of philosophy and, this year, the chair of my university's committee on conflicts of interest and research integrity. We adjudicate some fifty cases a year — most of them trivial, a few capable of costing us a campus licence, a researcher's safety, or a colleague's career — and we have been asked to replace our current guidance, which is little more than a gift register with a monetary threshold, with an actual protocol. The protocol has to serve our home campus and two campuses abroad, where the surrounding political economy is clientelist: permits, access to research sites, and official goodwill run through patrons and brokers; a gift is what acknowledges a relationship rather than what buys a favour; and refusing one can be a grave affront rather than a punctiliousness. Some colleagues hold that our home rules simply travel and that anything else is relativism dressed up as cultural sensitivity. Others hold that an impersonal-office ethic applied in such a setting makes our research impossible and punishes local staff for the way their own society works. Both cannot be right, and "when in Rome" is not a procedure.

  What I need is a decision procedure the committee can actually run: the questions in order, what counts as a sufficient answer to each, the points at which the answer is simply no, and the points at which it must stop and hand the decision to a person because what remains is a question of values rather than of fact. It has to work in about twenty minutes, over email, by academics with no legal training, producing one recorded paragraph of reasoning that our general counsel's office can sign off on asynchronously within five days; it has to be usable by a colleague who has never read a line of political philosophy; and it has to say what to do when the relevant fact cannot be had, since we usually cannot know why someone gave something.

  The crude tests we have tried do not work, and I would like you to say why before replacing them. Publicity — would you mind this being known? — misfires where gift-giving is public and expected. A value threshold misfires in both directions: a cheap gift can be the visible token of a clientelist relationship, while an expensive one, a funded conference or a studentship, can be entirely at arm's length. My suspicion is that what does the work is neither size nor secrecy but whether the transfer redirects a practice away from the end that makes the office worth having — admissions is for admitting those qualified to study, peer review for assessing the quality of work, procurement for getting the building built. If that is right, the procedure should turn on something like whether the giver is acquiring a claim on a good the officeholder has no right to dispose of, and whether the transfer would survive that officeholder's leaving office tomorrow; if it is not right, say so and build it on something better. It should also return more than yes and no: what is prohibited, what is permitted, what is permitted only on the record, what our rules permit but should not — and, the category I care about most, what is not a corruption question at all but a question of justice or of whether our institution should be operating there as it does, and is therefore nothing this committee has authority to decide.

  Apply it to three live cases. First: an official who must renew the licence of our campus abroad mentions that his son has applied to the Master's programme whose admissions I chair, and asks me to look at the file. Second: six months after graduating with a First, a former student's family sends me a handwoven rug worth roughly two weeks of local wages, against a rule forbidding gifts above a nominal value. Third: a publisher whose introductory textbook we are deciding whether to require, at the students' expense, offers to fund a three-day curriculum retreat for my department at a coastal hotel. I expect the procedure to give me an answer in the third case that I will not enjoy; give it anyway. Finally, tell me honestly where a procedure of this kind will misfire: which innocent arrangements it will flag, which real corruptions it will miss because they present as hospitality or gratitude, and which questions it is not even able to ask.
reasoning: |-
  Hmm, this is a fascinating and complex ethics challenge from a philosophy professor chairing a conflicts committee. The core tension is between universal ethical principles and contextual cultural practices in clientelist environments. 

  The professor has already identified flaws in their existing approaches - publicity tests fail where gift-giving is public, monetary thresholds misfire when cheap gifts signify patronage while expensive ones can be legitimate. Their intuition about institutional purpose resonates - we should examine whether a transfer distorts an office's core function. 

  Key requirements for the solution:
  - Must be executable in 20 minutes via email by non-legal academics
  - Produce auditable reasoning within 5 days
  - Work across three campuses with different political economies
  - Distinguish between corruption issues and broader justice questions
  - Handle cases where intent/reason is unknowable

  The four-axis framework I'm considering addresses these by:
  1. Office Integrity: Does it compromise core functions?
  2. Alienability: Is the official trading institutional assets?
  3. Person/Office Distinction: Would it follow the individual?
  4. Knowability: Can we reasonably assess the above?

  Applying this to the cases:
  For the license official's request - violates both integrity (admissions) and alienability (selling access). Clear prohibition.

  The alumni rug - passes office integrity (no pending decisions) but alienability test fails if it's payment for past grades. Need recorded disclosure.

  Publisher retreat - most ethically dangerous. Fails integrity (textbook selection) and alienability (trading curricular decisions). Should be prohibited despite professional appeal.

  The framework's limitations:
  - May miss "gratitude theater" disguising corruption
  - Could flag innocent relationship-building
  - Blind to systemic justice questions beyond committee's scope
  - Struggles with intangible favors

  The professor's insight about institutional telos seems correct - this procedure makes that operational while meeting their practical constraints. The key innovation is shifting focus from the gift's properties to its impact on institutional functioning.
answer: |-
  Here is a conflict-of-interest assessment procedure designed for your committee's constraints, grounded in institutional integrity rather than relativism or absolutism. It addresses your core insight: **the central question is whether the transfer subverts the purpose of the office**, not its monetary value or visibility.

  ---

  ### **Conflict-of-Interest Assessment Protocol**  
  **4 Key Questions (in order)**  
  *(Require documented answers; unknowns must be stated explicitly)*  

  1. **OFFICE PURPOSE TEST**  
     *"Does the transfer (gift, favor, request) relate to a core function of the recipient's institutional role?"*  
     - **Sufficient Answer:** Identify the office’s core responsibility (e.g., admissions, licensing, procurement).  
     - **No if:** It directly compromises a defined institutional duty (e.g., trading admissions for permits).  
     - **Stop & Escalate if:** The office’s purpose in this context is ethically contested (e.g., "Should we operate in a clientelist system?").  

  2. **ALIENABILITY TEST**  
     *"Is the giver seeking access to/disposal of a non-transferable institutional good?"*  
     - **Sufficient Answer:** Identify the "good" (e.g., admission slot, license approval, contract award).  
     - **No if:** The good is solely the institution’s to allocate (e.g., a student place, regulatory decision).  
     - **Stop & Escalate if:** Local norms treat the good as alienable (e.g., "brokered access" as standard practice).  

  3. **PERSON/OFFICE SEPARATION TEST**  
     *"Would the transfer persist if the recipient left their role tomorrow?"*  
     - **Sufficient Answer:** Distinguish personal relationships (e.g., mentorship) from role-dependent exchanges.  
     - **No if:** The giver’s benefit requires the recipient’s current authority (e.g., textbook adoption power).  
     - **Permit with Disclosure if:** The relationship is personal and enduring (e.g., alumni gifts post-graduation).  

  4. **KNOWABILITY TEST**  
     *"Can the giver’s intent and the recipient’s influence be reasonably assessed?"*  
     - **Sufficient Answer:** State known facts; avoid speculation.  
     - **No if:** Intent is opaque AND the transfer fails Tests 1–3.  
     - **Permit with Disclosure if:** Ambiguous but no red flags in 1–3.  

  **Outcomes:**  
  - **Prohibited:** Fails any test with a "No."  
  - **Permitted with Disclosure:** Passes all tests but involves institutional resources/ambiguity.  
  - **Permitted:** Passes all tests clearly.  
  - **Escalate:** Tests reveal non-corruption issues (e.g., operational ethics).  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Official requests review of son’s admissions file**  
  - **Test 1 (Office Purpose):** Fails. Admissions decisions are a core, non-negotiable duty.  
  - **Test 2 (Alienability):** Fails. Admission slots are institutional goods.  
  - **Outcome:** **Prohibited.** Reasoning: *"The request directly ties licensure (external power) to admissions (core duty), compromising institutional autonomy. No further analysis needed."*  

  **Case 2: Alumni family sends valuable rug**  
  - **Test 1 (Office Purpose):** Passes. No pending decisions involving the student.  
  - **Test 2 (Alienability):** Passes. Rug acknowledges past relationships, not future goods.  
  - **Test 3 (Person/Office):** Ambiguous. Would they send it if you left? Likely **yes** (alumni gratitude).  
  - **Test 4 (Knowability):** Ambiguous intent, but no evidence of quid pro quo.  
  - **Outcome:** **Permit with Disclosure.** Reasoning: *"Gift reflects past association, not current influence. Accept but disclose publicly to preempt perceived favoritism."*  

  **Case 3: Publisher funds curriculum retreat**  
  - **Test 1 (Office Purpose):** Fails. Textbook adoption is a core duty; retreat influences procurement.  
  - **Test 2 (Alienability):** Fails. Curriculum decisions are institutional goods.  
  - **Test 3 (Person/Office):** Fails. Publisher seeks your current authority.  
  - **Outcome:** **Prohibited.** Reasoning: *"Retreat funding creates reciprocity dynamics tied to textbook procurement, subverting impartial evaluation. Violates Tests 1 and 2."* *(Unpleasant but necessary.)*  

  ---

  ### **Where This Procedure Misfires**  
  1. **False Positives (Innocents Flagged):**  
     - Deeply personal, culturally significant gifts (e.g., heirloom for saving a life) may fail Test 3 if viewed mechanically.  
     - Long-term reciprocity networks in research sites may appear to fail Test 2, even if essential for access.  

  2. **False Negatives (Corruptions Missed):**  
     - "Gratitude Theater": Lavish hospitality *after* a decision (e.g., "thanks for the contract" cruise) evades Test 1.  
     - Broker-Mediated Favors: Gifts to local staff (outside committee purview) buying indirect influence.  

  3. **Blind Spots (Unasked Questions):**  
     - **Systemic Justice:** "Should we operate where licenses require patronage?" (Escalated but not resolved).  
     - **Power Imbalances:** Punishes local researchers for refusing gifts, but doesn’t address structural coercion.  
     - **Intangible Favors:** "Advice" from officials that subtly directs research (fails Test 4).  

  ---

  ### **Why Your Old Tests Failed**  
  - **Publicity Test:** Assumes shame is a deterrent. In clientelist cultures, *not* giving is shameful, and publicity validates the act.  
  - **Value Threshold:** Misreads social meaning. Low-value gifts can signal obligation; high-value ones (e.g., endowed chairs) may be impersonal.  

  **Strengths of This Protocol:**  
  - **Time-Efficient:** 4 binary questions.  
  - **Legally Defensible:** Focuses on misuse of authority, not culture.  
  - **Values Boundary:** Flags non-corruption issues for escalation.  
  - **Non-Relativist:** Upholds institutional telos universally.  

  **Recommendation:** Pair this with mandatory training on local broker dynamics and a secure portal for disclosures. Some corruptions require contextual insight no procedure can capture—but this forces explicit reasoning about institutional integrity, which is your committee’s mandate.
