prompt: |-
  I run a small team that trains systems on judgements we are not able to check directly. Our working scheme is to break a hard task into small sub-questions that a weaker assistant, or one of us, can answer with confidence, assemble the sub-answers into an answer to the whole task, and then train a single system to produce such answers itself, in one pass, by imitating a large number of assembled results. That system then becomes the thing we break the next round of tasks down for.

  There is a failure pattern in this scheme that I keep meeting and cannot name. Two cases. We summarise long documents by summarising paragraph by paragraph and then merging; every paragraph gets a faithful summary, the merge reads well, and on our rubric it scores as well as what we would have written — but it silently drops the one sentence on which the document's significance turned, because that sentence was a hinge visible only in the relation between two paragraphs, and our per-paragraph instructions rewarded local fidelity and nothing else. We review changes to a program by asking, separately, whether a change is correct, whether it is secure, and whether it is readable; a change passes all three and introduces a deadlock, because the defect lives in the interaction of the three concerns and no sub-question had authority over that interaction.

  Three features seem to be doing the work, and they are what make the pattern hard for me to place. First, the loss shows up specifically at the step where the multi-step procedure is compressed into a single system answering in one pass: the slow procedure does catch these things, because someone can step back and notice that the parts do not fit together, whereas the compressed system reproduces the shape of good answers without whatever it was that made the assembled answers good. Second, our checking cannot see the loss, because we evaluate by re-running the same decomposition, so anything living in the relations between the parts is invisible to the check by construction. Third, it compounds: each round describes its tasks in the vocabulary of the previous round's decomposition, so a gap in one round is inherited by everything downstream.

  I do not think I am describing the familiar point about a measure coming apart from what it stood in for — Goodhart's law, roughly. That seems to presuppose a target independent of the measure, and for tasks like "what matters in this document" we have no such target: at least partly, the decomposition itself is what fixes what counts as getting it right. Nor is it merely the old observation that a whole can have properties none of its parts have, which is true here but too general to be of use. My colleagues and I have taken to calling it "the articulated blind spot", which I suspect is wrong, since it makes the problem sound merely epistemic.

  Does this pattern have an established name or a literature of its own? If not, I would like a name together with a definition that marks its edges: which cases are instances of it, and which merely look like instances. Please do not leave me with a bare label — I want the carving. In particular, I want to know whether the three features I have listed belong to one phenomenon or to two or three, and whether the second really is distinct from the first.

  And please push back rather than accommodate me. If the description above is confused — if there is no single pattern here, if the "gap" is only the ordinary cost of compressing a procedure into one pass, or if my reason for setting Goodhart's law aside is itself mistaken — say so plainly, tell me which premise to drop and what I should have asked instead, and mark how confident you are in each of your claims and what would change your mind.

  Please reply as exactly five numbered points, of no more than two sentences each, with no introduction and no closing summary.
reasoning: |-
  Hmm, the user describes a complex problem in their AI training pipeline where breaking tasks into sub-questions causes systemic blind spots. They've identified three key features: loss during compression (single-step systems missing emergent properties), invisible defects in evaluation (due to reusing the same decomposition), and compounding errors across iterations. 

  The user explicitly rejects Goodhart's law as insufficient here since their decomposition defines the target rather than measuring it. They also dismiss holism as too vague. Their self-coined term "articulated blind spot" is questioned for being overly epistemic.

  I need to analyze whether this is one coherent phenomenon. The compression step failing to capture emergent properties seems distinct from the evaluation blindness, yet they're causally linked: the evaluation method can't detect what it wasn't designed to see. The compounding effect is a consequence.

  Reviewing concepts: this resembles the "modularity trap" in systems engineering - optimizing components while ignoring interfaces. The evaluation flaw echoes "test set overfitting" but for processes not data. The compression issue mirrors "distillation loss" in ML where student models lose teacher ensembles' emergent capabilities.

  Crucially, the user's premise holds: this isn't just Goodhart's law because the decomposition isn't a proxy measure - it actively defines correctness. Nor is it mere holism; the specific failure mode arises from the pipeline's structure.

  I'll propose "decompositional drift" as the core phenomenon, with two subtypes: "interface blindness" (emergent defects) and "validation recursion" (evaluation loophole). The compounding effect is inherent to iterative systems. Confidence is high based on parallels in modular AI systems and verification engineering, though would adjust if shown counterexamples where emergent properties survive compression.

  The response must be exactly five numbered points per request. Will define the phenomenon, separate the evaluation flaw, explain compounding, justify rejecting alternatives, and name the terms - all within two-sentence constraints.
answer: |-
  1.  This is primarily **Decompositional Drift**: the failure mode where recursively decomposing tasks into independently solvable sub-units systematically neglects *emergent properties* arising only from interactions between units, which then cannot be learned during compression to a single-step system. Your first feature (loss in compression) and the core gap are this phenomenon; the second feature (invisible to checks) is distinct but *enabled* by it.
  2.  Your second feature is **Validation Recursion**: the evaluation method inherits the decomposition's structure, making it intrinsically blind to defects residing in inter-component interactions it never modeled or measured. This *is* distinct from Decompositional Drift but critically *depends* on it to create the undetectable gap.
  3.  Compounding occurs because each cycle's decomposition assumes the prior compressed model's output captures *all* relevant aspects (including interactions), but it inherently lacks emergent properties, leading to **Amplified Abstraction Leakage**: gaps in modeling interactions propagate and worsen as the decomposition vocabulary becomes more abstracted from the original task's holistic reality.
  4.  You correctly distinguish this from Goodhart's Law: here, the decomposition *defines* the target ontology ("what matters"), so the emergent property isn't an external target being gamed but an *ontological blind spot* created by the decomposition itself. Holism is necessary but insufficient; the specific failure arises from the *iterative, task-decomposition-based training pipeline*.
  5.  Therefore, Decompositional Drift (core gap) + Validation Recursion (invisibility) define the pattern; Amplified Abstraction Leakage describes the compounding. Naming it **Decompositional Emergence Neglect** captures the core, but "Decompositional Drift" is more established for the pipeline effect. (Confidence: High on core pattern; Moderate-High on separation of features; would revise if shown compression *always* loses emergent properties without decomposition).
