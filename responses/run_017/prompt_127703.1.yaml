answer: |-
  ### Probability Perspectives Game: Run Plan  
  **Goal:** Illustrate three core ideas through experiential learning without adding a fourth position statement.  
  **Key Points:**  
  1. **Ambiguity in Probability:** For one-off events, "probability" can mean long-run frequency, objective chance, or degree of belief.  
  2. **Chance vs. Evidence:** Physical chance and rational confidence can diverge.  
  3. **Reference Class Problem:** Long-run frequencies depend on arbitrary class boundaries.  

  **Materials (Prep in Advance):**  
  - 1 fair six-sided die  
  - 1 opaque, sealable box (for pre-rolled die)  
  - 1 envelope containing the pre-roll outcome (for case B)  
  - 18 index cards (one per participant)  
  - Whiteboard + markers  
  - Laptop with offline spreadsheet (pre-loaded with scoring formulas)  
  - Retention data for a named student (real or plausible):  
    - Overall university retention: 85%  
    - Stats/Phil major retention: 80%  
    - First-gen student retention: 75%  
  *(Note: Choose a student in advance with their consent; anonymize if sensitive.)*  

  ---

  ### Minute-by-Minute Timeline (75 min)  
  #### **0–5 min: Introduction**  
  - **Script:** "We’re playing a game about probability. For each case, write a number 0–1 on your card. Scoring rewards honesty: you get `1 - (outcome - your_prob)^2`. Max score 1 (confident and right), min 0 (confident and wrong). Report what you truly believe."  
  - **Why scoring works:** The quadratic rule is strictly proper—it incentivizes truthful reporting *in expectation*. Acknowledge single-play luck but emphasize honesty is the best strategy long-term.  

  #### **5–20 min: Case A (Die Roll, Objective Chance)**  
  - **Setup:** Show the die. "I’m rolling this fair die once. Event: it lands on 6. Write your probability *before* I roll."  
  - **Action:**  
    - Participants write probabilities on cards (2 min).  
    - Roll die publicly → record outcome (1 if 6, else 0).  
  - **Point Illustrated:** *All three interpretations align* (frequency 1/6, propensity 1/6, belief 1/6).  

  #### **20–40 min: Case B (Sealed Box, Chance vs. Evidence)**  
  - **Setup:** "This box contains a die rolled before class. Same event: lands on 6. No one knows the outcome except..."  
  - **Action:**  
    - Take one student to the hall; show them the pre-roll result (envelope). They return, write their probability (must be 0 or 1).  
    - All others write probabilities (2 min).  
    - Reveal outcome by opening the box.  
  - **Point Illustrated:** *Chance (1/6) ≠ evidence (0 or 1)*. The informed student’s certainty (and high score) forces a dilemma: "Which number would you bet on?"  

  #### **40–55 min: Case C (Retention, Reference Class Problem)**  
  - **Setup:** "Event: [Name] will be enrolled here in 4 terms. Here are three frequencies:  
    - Overall retention: 85%  
    - Stats/Phil majors: 80%  
    - First-gen students: 75%  
    Write your probability using *only* this data."  
  - **Action:**  
    - Participants write probabilities (2 min).  
    - Poll: "Who used 85%? 80%? 75%? A blend?" (5 min).  
  - **Point Illustrated:** *Frequency depends on class choice*. Highlight variation in responses.  

  #### **55–70 min: Scoring & Discussion**  
  - **Scoring (5 min):**  
    - Use spreadsheet to compute scores for A and B:  
      - Formula: `Score = 1 - (outcome - reported_prob)^2`  
      - Pre-load with participant names → enter probs → auto-compute.  
    - Display average scores and ranges (not individual scores to avoid embarrassment).  
  - **Debrief (10 min):**  
    - **Case A:** "Why did everyone say ~0.17? Clean cases hide ambiguity."  
    - **Case B:** "Why did the informed student win? Chance (1/6) was fixed, but evidence mattered for betting."  
    - **Case C:** "Why different answers? The ‘kind of thing’ isn’t given by nature."  
    - **Scoring Rule:** "It rewards accurate confidence, but single-play luck favors extremists. Still, lying *systematically* backfires."  

  #### **70–75 min: Takeaways**  
  - "Walk out remembering:  
    1. Probability isn’t one thing—it answers three questions.  
    2. Evidence can decouple from chance (Case B).  
    3. Frequencies need arbitrary boundaries (Case C).  
    ...and scoring rules can’t resolve philosophical splits!"  

  ---

  ### Handling Predictable Problems  
  | Issue | Response |  
  |-------|----------|  
  | **"What’s the correct probability?"** | "In cases like C, there isn’t one ‘correct’ number. We’re exploring how context shapes answers." |  
  | **Informed student won’t commit to 0/1** | Pre-brief them: "You’ve seen the truth—report 0 or 1 to reflect absolute knowledge." If they resist: "Why might someone hedge even with perfect info?" (Use to discuss psychological biases). |  
  | **Case C swamped by personal knowledge** | "Stick to the provided data—we’re isolating reference classes. Real life blends data + context, but here we’re testing the data alone." |  
  | **"Scoring rewards bluffing!"** | "In one play, extremists can win by luck. But if we played 100 times, truth-tellers win. This rule is about *expected* scores." |  

  ---

  ### What the Game *Can’t* Do (Supply in Debrief)  
  - **Objective chance isn’t "felt":** Case B shows it *exists* (pre-roll), but not why it *should constrain beliefs*.  
    → *Add 2 sentences:* "Propensity theorists say chances are physical (like the die’s symmetry). But once the die is rolled, evidence overrules it."  
  - **Frequencies’ normative force isn’t intuitive:** Players see they *can* use frequencies, not why they *must*.  
    → *Add 1 sentence:* "Frequentists argue: if you ignore long-run data, you lose money over time."  
  - **Scoring rule honesty is asymptotic:** Players see single-play luck, not long-run incentives.  
    → *Add in scoring explanation:* "This rule makes truth-telling optimal *on average*—not in one shot."  

  ---

  ### Reserve Case (If Time Runs Short)  
  **Case D: Unknown Bias (Chance vs. Belief)**  
  - **Setup:** "I have a coin from a bag: 50% are fair, 50% land heads 70% of the time. I’ll flip it once. Event: heads."  
  - **Action:** Participants write:  
    - (a) Probability of heads (degree of belief).  
    - (b) What they think the coin’s *true chance* of heads is.  
  - **Point Illustrated:** Belief (0.5 × 0.5 + 0.5 × 0.7 = 0.6) ≠ chance (either 0.5 or 0.7). Resolve with a flip.  

  **Why it works:** Forces divergence between "what I’d bet" (belief) and "what the setup is" (chance).  

  ---  
  This plan fits 75 minutes, uses no internet, and requires only you as facilitator. The game creates tension among the three perspectives without privileging one—debriefing stitches the lessons into their existing debate.
