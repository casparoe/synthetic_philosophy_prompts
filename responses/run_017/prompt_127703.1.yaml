     This should fill 75 minutes.

     Finally, be honest about limitations:

          - The game can't show why long-run frequencies should constrain degrees of belief: we can say that frequencies are often the best information we have, and in the absence of other information, they are the default.

          - It can't manufacture the intuition of objective single-case chances: we can mention that in case A, the symmetry of the die makes us think there's a propensity, but in case B, after rolling, the outcome is fixed and the propensity is no longer active? But the propensity was for the rolling process.

          - The scoring rule is for degrees of belief, and it only rewards honesty in expectation. In a single trial, luck plays a role.

