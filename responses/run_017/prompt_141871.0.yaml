prompt: |-
  So I've been trying to work out when it's actually ok to take someone else's word on a moral question, and I keep going in cirles. Here are my gut verdicts on some cases — I want the principle they add up to, if there is one.

  - My colleague (who's Black) tells me a joke I made was racist. I believe her and apologise. Not just fine — I think I'd be wrong not to defer.
  - I ask a stranger at a bus stop whether it's ok to skip my sister's wedding for a trip I've already booked. She says go on the trip. Her saying it changes nothing; I feel a bit weird for even having asked.
  - I ask a friend who does moral philosophy whether I should be giving more to charity. She says yes, and gives reasons I basically already had. Defering here feels like laziness, and I also feel that if I gave more *because she said so*, my giving would be worth slightly less somehow.
  - At 1am, drunk, I text my sober friend: should I text my ex? She says no. I don't. That deference feels totally fine — even though she knows no facts I don't and isn't any kind of moral expert. She's just not drunk.
  - My uncle, who says casually racist stuff all the time, tells me the joke was fine. I don't defer, and I don't think I should.
  - I ask an AI assistant whether I'm being unfair to a coworker whose work I keep redoing. It says yes, with what look like good reasons. I half-believe it, but I feel like I'm cheating in a way I wouldn't if a friend had said the same thing.
  - I ask my therapist whether I'd be justified in cutting off my dad. She says yes. I defer, and it feels fine — though again, no facts I don't have, and she's not really a moral expert either.

  My tentative rule: deference is in order exactly when the other person has access to something I don't — a fact about the situation, or what it's like to be on the recieving end of what I did — and out of order when they're only re-weighing considerations I already have. That handles the joke, the bus stop, the charity case and my uncle, but it falls apart on the 1am case and maybe the therapist, and I don't know what to do with the AI one.

  Is there one principle that gets all seven, or close? If not, tell me which verdict to give up and why. And what does the repaired principle say about the case I keep going back and forth on: posting an anonymous description of my boyfriend's behaviour to a forum, a hundred people all replying "yes, that's coercive, leave", and me believing them. Please don't tell me who in the literature argued what — I can't look anything up and I honestly don't care.

  Format: two or three sentences giving the best principle you can find, or the two candidates if there's a real trade-off between them. Then a table with the columns: case | my verdict | your principle's verdict | which clause is doing the work | verdict overturned (write "none" if it isn't) | one-sentence repair if the case shows the principle needs fixing. Under that, two extra rows for cases I haven't listed that your principle makes its strongest and most testable predictions about, with columns: new case | predicted verdict | why it's the interesting test.
reasoning: |-
  Hmm, the user is struggling with when it's morally acceptable to defer to someone else's judgment. They've provided seven detailed scenarios along with their gut reactions to each, and they're looking for a unifying principle that explains all these cases. They've also proposed their own tentative rule but found it lacking in some cases, particularly the late-night texting scenario and the therapist situation.

  Looking at these scenarios, I notice several patterns emerging. The user feels comfortable deferring when:
  - The person has lived experience they lack (like their Black colleague assessing racism)
  - The person has better cognitive capacity (sober friend versus drunk self)
  - The person has professional expertise (therapist)

  But they resist deferring when:
  - The person lacks relevant knowledge (bus stop stranger)
  - The person is untrustworthy (racist uncle)
  - The judgment feels too detached (AI assistant)
  - It seems to bypass personal moral reasoning (charity case)

  The key factors seem to be about epistemic access and relational context. Epistemic access covers things like lived experience, professional training, or situational awareness that the user lacks. Relational context involves whether the relationship creates legitimate authority (therapist), mutual care (sober friend), or shared values (versus the racist uncle).

  For the AI case, the discomfort likely stems from the lack of relational connection - there's no human care or accountability. The forum case about the boyfriend is trickier: the wisdom of crowds might provide epistemic value through multiple perspectives, but the anonymity lacks relational depth. The principle should probably validate deferring here because of the aggregated lived experiences, despite the impersonal format.

  I'll formulate a principle that combines both epistemic and relational elements. The epistemic part addresses what the other person knows that I don't, while the relational part covers why I should trust their application of that knowledge to my situation. This dual approach should cover all the cases consistently.

  For the table, I'll analyze each case through this lens. The late-night texting case works because the sober friend has better cognitive access and cares about me. The therapist works through professional relational context. The AI fails on relational grounds. The forum case should be acceptable under this principle due to the epistemic weight of multiple consistent testimonies about coercive behavior.

  The strongest tests for this principle would be: 1) conflicting expert opinions (highlighting the relational need for aligned care), and 2) a reformed racist giving advice (testing whether changed character restores relational trust). This maintains the core insight while addressing edge cases.
answer: |-
  Here's the best unifying principle: **Deference is appropriate when the other person has superior epistemic access (to relevant facts, experiences, or rational capacities you currently lack) *and* a relationship/role that legitimizes their application of this access to your specific moral context.** This combines epistemic authority with relational legitimacy.

  | Case | My Verdict | Principle's Verdict | Clause Doing Work | Verdict Overturned | Repair (if needed) |
  |-------|-------------|---------------------|--------------------|---------------------|---------------------|
  | Racist joke (colleague) | Defer | Defer | Superior epistemic access (lived experience) & legitimate role (affected party) | None | |
  | Bus stop stranger | Don't defer | Don't defer | Lacks relational legitimacy (no stake/knowledge of you) | None | |
  | Charity (philosopher friend) | Don't defer | Don't defer | No *superior* epistemic access (reasons known to you) | None | |
  | 1am text (sober friend) | Defer | Defer | Superior epistemic access (rational capacity you lack) & relational legitimacy (caring advisor) | None | |
  | Racist uncle | Don't defer | Don't defer | Lacks epistemic credibility (biased) & relational legitimacy (untrustworthy) | None | |
  | AI coworker advice | Hesitant | Don't defer | Lacks relational legitimacy (no shared values/accountability) | **Overturned** | Add: *"...and is a human moral agent"* |
  | Therapist (cut off dad) | Defer | Defer | Relational legitimacy (entrusted role) *enables* epistemic weight of their perspective | None | |
  | **Forum (boyfriend)** | ? | **Defer** | Superior epistemic access (aggregate experience spotting coercion) & relational legitimacy (impartial advisors in trusted space) | N/A | |

  **New Test Cases:**
  | New Case | Predicted Verdict | Why It's an Interesting Test |
  |----------|-------------------|------------------------------|
  | A climate scientist (stranger) tells you flying for vacation is immoral. | **Don't defer** | Tests if *epistemic superiority alone* suffices without relational context (like the bus stop). |
  | Your wise but estranged parent, who knows you deeply, advises on a personal dilemma. | **Defer** | Tests if *relational history* can restore legitimacy despite current estrangement (unlike the uncle). |

  **Explanation:**  
  - The **AI case** fails because AI lacks relational legitimacy (no shared moral community/care), explaining your discomfort. Adding "human moral agent" fixes it.  
  - The **forum case** works: 100 consistent replies provide superior epistemic access (pattern recognition of coercion) and relational legitimacy (impartial moral peers in a space you sought). Your hesitation likely stems from anonymity, but the principle overrules this by emphasizing *aggregate experience* and *your initiation* of the consult.  
  - The **therapist/1am cases** are covered by relational roles enabling their judgment (caretaker/sober friend), even without new facts.  
  - **Trade-off note:** If resisting "human agent" addition, a weaker principle prioritizes epistemic access *only when it directly compensates for your impairment* (e.g., drunkenness, inexperience). This fails the therapist case and forum case. The combined principle is more robust.
