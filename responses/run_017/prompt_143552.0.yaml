  Hmm... their six proposed desiderata are impressively sharp, targeting core tensions in the field. But I spot some conflation: "tail not mean" and "neutral traits" both address selection efficiency, while "no-copies" and "transmission evolution" both concern replication mechanisms. They might be over-indexing on transmission at the expense of environmental interactions.

  The real kicker is their closing challenge: which requirements are mutually exclusive? That's where existing theories crumble. For example:
  - Replicator views (memetics) nail fidelity units but implode on blended inheritance and transmission evolution.
  - Dual-inheritance handles demography but fudges neutral traits by smuggling in genetic payoffs.
  - Epidemiological models explain attraction but can't handle cumulative complexity without covert selectionism.

  Their unspoken need? Probably validation that the obstacles they perceive are real, not confusion. When they say "tell me which ideas are bad," they're really asking "am I crazy for thinking this is hard?" The answer is no - the tensions they identified (especially transmission evolving) break most extant models.

  I should foreground three irreconcilables:
  1. High-fidelity units vs. blended/horizontal transmission
  2. Selection requiring selfish advantage vs. neutral cultural spread
  3. Fixed inheritance machinery vs. evolving transmission systems

  The atomic unit question is a red herring though - that's genetics baggage. The real issue is identifying *when* units matter (for cumulative complexity) and when they don't (for fads).

  ...And I'm now realizing their "transmission evolves" point is the skeleton key. No current theory handles that endogenous change cleanly. That might be the crux - if transmission evolves, selection operates on different rules over time, violating the stable evolutionary framework assumption. Game over for orthodoxy?
answer: |-
  Here's the distilled desiderata for a selectionist theory of culture, sorted, critiqued, and expanded. Your instincts are sharp, but some points need reframing. The tensions are real, and they break existing theories.

  ### Your List: Sorted & Refined
  1.  **Fidelity without Machinery (No-Copies Problem)**
      -   **Case:** Recipes survive verbatim for centuries; jokes mutate in retelling. Why?
      -   **Requirement:** **Non-negotiable.** Must explain *variation* in fidelity *mechanistically*: why some cultural elements (e.g., ritual phrases, machine code) resist change, while others (oral histories, fashion) don't. Prejudice: Assuming fidelity *must* look like DNA replication. Fix: Focus on *constraints* (functional, structural, normative) enabling stability.
      -   **Key Tension:** High fidelity often requires costly infrastructure (writing, ritualization) that must itself evolve.

  2.  **Cumulation without Isolation (Ratchet without Germ Line)**
      -   **Case:** Stone tool complexity accumulates over millennia despite horizontal transmission; folk taxonomies remain stable.
      -   **Requirement:** **Non-negotiable.** Must explain how incremental improvements persist despite blending/recombination. Prejudice: Insisting on discrete "germ lines." Fix: Mechanisms could include *conformist bias* (copy majority), *prestige bias* (copy experts), or *structural constraints* (new tool *requires* prior step).
      -   **Key Tension:** Blending *should* regress traits to the mean. Cumulation requires anti-blending mechanisms.

  3.  **Success is Skewed (Tail, not the Mean)**
      -   **Case:** Millions of songs are composed; a few dominate globally. Most tech startups fail; a few monopolize.
      -   **Requirement:** **Non-negotiable.** Any useful theory must predict/pathologize *variance* and extreme outliers, not just averages. Prejudice: Modeling cultural change as diffusion/drift alone. Fix: Requires incorporating *network effects*, *critical thresholds*, *positive feedback*.
      -   **Key Tension:** Neutral models can produce "long tails," but explaining *which* variants dominate requires selection.

  4.  **Neutral/Costly Spread (Not Everything is Adaptive)**
      -   **Case:** QR codes spread despite being useless to most users; high heels persist despite health costs; "viral" nonsense spreads.
      -   **Requirement:** **Non-negotiable.** Must distinguish: (a) *Selection FOR a variant* due to benefits to *the variant itself* (e.g., catchy tune), (b) *Attraction* due to cognitive biases (e.g., minimally counterintuitive ideas), (c) *Selection OF a host* carrying a costly variant (rare). **Two mechanisms:** Attraction ≠ Selection. A theory *must* accommodate both.
      -   **Key Tension:** Strict adaptationism fails here. This requirement *kills* theories that demand all cultural success benefits individual fitness.

  5.  **Demography Drives Complexity (Not Just Correlation)**
      - **Case:** Tasmania lost tool complexity after isolation; large cities innovate faster than villages; dying languages lose vocabulary.
      - **Requirement:** **Non-negotiable.** Must provide a *causal mechanism* linking population size/connectivity to retention/innovation. Prejudice: Assuming innovation is purely individual genius. Fix: Mechanism = *Cultural Mutation + Anti-Loss Buffers*. Larger/denser populations: (a) generate more variants (more "trials"), (b) have lower risk of losing rare skills/knowledge (more potential models).
      - **Key Tension:** Requires treating population structure as a *parameter* shaping evolutionary dynamics, not just a backdrop.

  6.  **Evolving Transmission Machinery (Meta-Evolution)**
      - **Case:** Writing enables stable law codes; printing breaks monastic scriptoria monopolies; algorithms dictate exposure.
      - **Requirement:** **Non-negotiable & Category-Defining.** The system's *own inheritance rules* evolve endogenously. Cannot treat these as "just variants." **Crucially:** Transmission changes (e.g., TikTok's algorithm) alter *what counts as a variant*, *mutation rates*, *selective pressures*, and *population structure*. A theory must model this as a *higher-order evolutionary process* or fail.
      - **Key Tension:** This breaks naive replicator models. Transmission evolution *changes the rules of the game*.

  ### Critical Additions
  7.  **Units are Contextual, Not Foundational**
      - **Case:** Explaining a symphony (a complex "meme-complex"?), a single word ("meme"?), or a social norm (an institution?) requires different grains.
      - **Requirement:** **Taste, but crucial.** Insisting on a universal atomic unit (like the gene) is a **prejudice**. The theory should *not require* a single unit type. It should allow *functional units* defined by the *stability and heritability relevant to the dynamic being explained* (e.g., a ritual step vs. an entire religion). **Non-negotiable:** Avoid unit fetishism.

  8.  **Multi-Level Dynamics**
      - **Case:** A beneficial farming technique (individual level) might spread while weakening community cohesion (group level), leading to societal collapse. A religious norm (group level) constrains individual behavior.
      - **Requirement:** **Non-negotiable.** Must handle selection/attraction potentially acting *at different levels* (individual, group, institution) *simultaneously*, with possible conflict. Cannot collapse everything to individual benefit.

  9.  **Stay Silent on Origin, Focus on Spread**
      - **Requirement:** **Non-negotiable.** The theory *does not need* to explain the *initial generation* of a novel variant (creativity, genius, random error). Its job is to explain the *differential spread and retention* of variants *once they exist*. Don't try to be a theory of everything.

  ### The Crunch: Irreconcilable Tensions?
  *   **The Killer Triad:** Demography + Cumulation + Evolving Transmission is brutally hard. Demography requires population structure for cumulation; evolving transmission (e.g., social media) *actively destroys traditional structure* (flattens hierarchies, enables hyper-blending). Can a single framework handle both pre-industrial craft guilds *and* algorithmic virality? Probably not without levels or regime shifts.
  *   **The Atomic Bomb:** **Evolving Transmission** does the most damage to existing views. It fundamentally breaks models assuming stable inheritance rules (most meme theories, simple DI). Treating TikTok's algorithm as "just another meme" is absurd – it *governs* meme replication.
  *   **The Neutrality Trap:** **Neutral/Costly Spread** + **Selectionist Framework** is deeply problematic. If selection *for* variants explains their success, how do costly/neutral ones spread? This forces either abandoning selection as the *sole* driver (embracing attraction) or stretching "selection" beyond recognition (e.g., "selected for transmissibility"). **This requirement alone excludes strict neo-Darwinian memetics and overly gene-centric DI.**

  ### How Theories Crumble (Briefly)
  *   **Meme-Style Replicators:** Nails Fidelity (if units defined) & Skew. Utterly fails Neutral/Costly (assumes selfish replicators), Blended Cumulation (needs discrete units), Demography (ignores population structure), Evolving Transmission (units/replication fixed), Multi-Level. Dies on Transmission Evolution.
  *   **Dual-Inheritance Theory:** Handles Demography, *Some* Cumulation (via biased transmission), Multi-Level (gene-culture). Struggles massively with Fidelity (often handwaves), Neutral/Costly (tries to force genetic payoffs), Skew (focuses on averages), Evolving Transmission (inheritance rules fixed). Grapples poorly with Attraction vs. Selection.
  *   **Cultural Attraction/Epidemiological:** Excels at Neutral/Costly, Fidelity (via cognitive constraints), Attraction mechanisms. Struggles *severely* with Cumulation (attraction often stabilizes, not accumulates), Demography (downplays population structure), Skew (focuses on attraction biases, not runaway success). Often rejects "selection" entirely, making Cumulation & Complexity hard to explain mechanistically. Transmission Evolution is acknowledged but not well-modeled.

  **The Hard Truth:** Your list defines a theory that doesn't exist yet. The core tension is between **explaining cumulative complexity** (requiring stability, structure, selection) and **explaining the actual messiness of culture** (blending, neutral spread, rapidly evolving transmission). No current framework reconciles these fully. **Evolving Transmission** is the sledgehammer dismantling orthodoxy, and **Neutral/Costly Spread** is the poison pill for naive selectionism. Start there.
