  Their committee model smells like non-reductive realism—the big experience is real but not an additional entity. The headache problem exposes its weakness: if the committee "has" the pain, who feels it? This might collapse into relational holism or need a new category. 

  For empty seats, possible combos: gradual fading + stadium sees nothing (incoherent—if micro-experiences vanish slowly, the picture should too), or illusionism + cosmos-first (self-contradictory denial of both levels). Distinctions that blur: constitutive panpsychism vs fusion might both answer the slow replacement case similarly. 

  The glossary needs terms like "combination problem" and "proto-experiential" stripped of academic weight. The tree should start broad: "Does the big experience exist separately?" then drill into mechanisms. Awkward consequences will highlight each theory's pain point—e.g., fusion struggles with split brains, illusionism dismisses the very problem. 

  Final note: Their frustration with "three months stuck" shows how visceral this is—they need the tree to catalyze debate, not end it. The handout should honor their DIY ethos ("my pet idea") while grounding their committee model in existing frameworks. Pub-ready means leaving room for "What if...?" moments over pints.
answer: |-
  ## Plain-words glossary (120 words)

  *   **Combination Problem (Adding-up Problem):** How do billions of tiny bits of experience (like inside electrons) add up to one big, unified experience like seeing red or feeling a headache?
  *   **Subject:** The "me" having an experience. There seems to be one "me" seeing the mug, hearing traffic, and feeling the shoulder all together.
  *   **Experience/Consciousness:** What it's like to be you right now (seeing red, hearing noise, feeling pain). "Qualia" is the specific feel (like the redness of red).
  *   **Micro-level:** The tiny, fundamental bits of reality (like particles).
  *   **Macro-level:** The big things built from micro-level bits (like brains, people, experiences).
  *   **Proto-experiential:** Basic properties that aren't quite full experience but can somehow build it up when combined.
  *   **Brute Fact:** Something that just *is* true, without needing a deeper explanation.
  *   **Grounded:** When the truth of something big (like "I am conscious") is fixed completely by the truth of things at a smaller level (like particles behaving a certain way), even if they look very different.

  ---

  ## The Tree (640 words)

  Start here: **Does the big, unified experience (like seeing the red mug right now) genuinely exist?**

  *   **No, it's an illusion.** (Illusionism)
      *   *Explanation:* There is no unified "movie in your head." There are just complex brain processes causing you to *report* having experiences. The feeling of unity is a trick.
  *   **Yes, it genuinely exists.** (Now ask: **Does the big experience exist over and above the little micro-level experiences/properties?**)
      *   **No, the big experience is *built* entirely from the little experiences/properties.** (Constitutive Panpsychism) (Now ask: **How do the little subjects/experiences combine?**)
          *   **The little subjects actually merge or fuse into one big subject.** (Subject Fusion/Constitutive Subject Combination)
              *   *Explanation:* Many tiny "me"s literally join together to become the one big "me." Like drops of water merging.
          *   **The little subjects *don't* fuse; they just work together closely.** (Now ask: **In the stadium case, does the big picture actually *appear* as a unified experience?**)
              *   **No, the stadium sees nothing; only the people holding cards have little experiences.** (Micropsychism)
                  *   *Explanation:* Only the fundamental particles (or simple units) have true experiences. Big things like brains or stadiums don't have extra experiences on top. Your feeling of seeing red is *just* the combined activity of the relevant particles' experiences.
              *   **Yes, the stadium *does* see the big picture as a unified experience.** (Now ask: **Where does this big unified experience come from?**)
                  *   **It's a further, fundamental fact that just pops out when the little ones are arranged right.** (Brute Emergence)
                      *   *Explanation:* When simple experiences are organized complexly (like in a brain), a big unified experience *just happens*. It's a basic law of nature, not built from the little experiences themselves.
                  *   **It comes from the *relationships* between the little experiences, not the experiences alone.** (Relational Holism)
                      *   *Explanation:* The big experience is the *pattern* or *network* of how the little experiences connect and interact. It's an extra layer of reality created by their relations.
      *   **Yes, the big experience is a further fact on its own.** (Now ask: **Which is more fundamental - the big unified thing or the small bits?**)
          *   **The big unified thing is fundamental.** (Cosmopsychism/Priority of the Whole)
              *   *Explanation:* The whole universe (or cosmos) is the basic, unified subject/experience. Your individual experiences are just aspects or fragments *within* that big one. Solving the combination problem backwards!
          *   **Neither is more fundamental; both are real levels.** (Dual-Aspect Monism/Neutral Monism)
              *   *Explanation:* Reality has one underlying stuff. This stuff has two aspects: physical (brain structure) and experiential (consciousness). The micro-level has its tiny physical/experiential aspects, the macro-level has its big physical/experiential aspects. They co-exist.
      *   **Maybe, but the little properties aren't full experiences yet.** (Now ask: **In the slow neuron replacement, does experience fade gradually or wink out?**)
          *   **Experience fades gradually.** (Constitutive Russellian Monism)
              *   *Explanation:* The fundamental properties are *proto*-experiential. When combined in simple ways, you get simple micro-experiences. When combined in complex brain-like ways, they build up to full macro experiences gradually. Replacing neurons slowly replaces the proto-properties building your consciousness.
          *   **Experience winks out at some point.** (Non-Constitutive Russellian Monism)
              *   *Explanation:* The fundamental properties are proto-experiential, but full macro-consciousness only *emerges* when the physical structure reaches a specific, complex threshold. Before that threshold, no real macro experience exists, even if the proto-properties are there.
  *   **Yes, it exists, but drop the subject!** (No-Self Theories)
      *   *Explanation:* Experiences happen ("redness," "soreness"), but there is no separate "me" *having* them. Experiences are ownerless events. The feeling of a subject is just another aspect of the experience, not a real entity. (Eliminativism about the Subject)

  ---

  ## What each leaf is stuck with (250 words)

  1.  **Illusionism:** Stuck explaining why the illusion of consciousness feels so utterly real and immediate, and why it evolved at all.
  2.  **Subject Fusion:** Stuck explaining how many distinct subjects can literally *become* one subject without contradiction, and what happens in split-brain cases.
  3.  **Micropsychism:** Stuck explaining why the *structure* of our experience (seeing a red mug *here*, feeling pain *there*) perfectly matches the structure of our brain activity if only micro-experiences exist.
  4.  **Brute Emergence:** Stuck accepting that consciousness popping out of non-conscious parts is a brute fact with no deeper explanation, which feels like giving up.
  5.  **Relational Holism:** Stuck explaining *how* mere relations between experiences create a *new*, unified subject and experience with its own qualities.
  6.  **Cosmopsychism:** Stuck explaining how *my* specific, limited perspective (seeing *this* mug, not the whole cosmos) arises within the one big cosmic subject.
  7.  **Dual-Aspect Monism:** Stuck explaining why the experiential aspect at the macro-level is unified and structured like the brain, while the micro-aspects are simple and scattered.
  8.  **Constitutive Russellian Monism:** Stuck explaining how combining proto-experiential properties results in genuinely new, complex experiential qualities (like the redness of red).
  9.  **Non-Constitutive Russellian Monism:** Stuck explaining *why* a specific threshold exists and what changes at that exact point to suddenly produce consciousness.
  10. **No-Self Theories:** Stuck explaining the strong, persistent intuition that experiences *belong* to someone ("*my* headache").

  ---

  ## Empty Seats (250 words)

  The tree's questions create logical spots no one seems to sit in:

  1.  **Gradual Fading + Stadium Sees Nothing:** (Slow replacement: Fade; Stadium: No). *Why empty?* If replacing micro-units gradually fades the macro-experience, it strongly suggests the macro-experience *is* built from the micro-properties. But saying the stadium sees *nothing* implies the macro-experience *isn't* built or doesn't exist at that level at all. These answers conflict – if fading happens, the macro-experience must be real and dependent on the micro. Unattractive/incoherent.
  2.  **Big Experience Over & Above + Proto-experiential + Fades Gradually:** (Big Ex: Over & Above; Little: Proto; Slow: Fade). *Why empty?* Saying the big experience is "over and above" the little properties usually means it's fundamentally distinct or emergent. But saying experience fades *gradually* when changing the little proto-properties strongly suggests the big experience is *constituted* by those little properties, not something separate. These answers pull in opposite directions. Unattractive/incoherent.
  3.  **Illusionism + Cosmos-First:** (Big Ex: Illusion; Fundamental: Cosmos). *Why empty?* Illusionism says the big unified experience isn't real. Cosmos-first says the big unified experience (of the cosmos) *is* fundamental and real. You can't coherently hold both that the big experience is fundamental reality *and* that it's an illusion. Incoherent.

  ---

  ## Where the tree gives out (180 words)

  The tree struggles to perfectly separate some leaves because they answer the key cases similarly:

  1.  **Constitutive Panpsychism vs. Relational Holism:** Both answer "Yes" to the Stadium seeing the picture (if Holism does). Both involve the little experiences being fundamental. The Slow Replacement case is tricky: Does replacing one neuron chip (affecting one micro-experience/relation) subtly change the whole (Constitutive) or just alter one part of the network (Holism)? Both *could* argue for subtle changes. The key difference (is the whole *built* from the parts or from their *relations*?) isn't directly forced by the cases.
  2.  **Brute Emergence vs. Non-Constitutive Russellian Monism:** Both answer "Winks out" to Slow Replacement and likely "Yes" to the Stadium seeing the picture. Both rely on a threshold effect where complex organization causes a new phenomenon. The difference (is the emergence from experiential or proto-experiential parts?) isn't directly probed by the cases. They look functionally similar here.

  ---

  ## Where my committee idea lands (250 words)

  Your "committee model" lands squarely within **Relational Holism**.

  *   **Why?** You describe the big "me" as real but "thinner," existing *in what the committee does* (the relations, the network, the organizational pattern), not as an extra member. The employees (micro-experiences) are real, the company (macro-experience/subject) is real but emerges from their organized interactions. This matches Relational Holism's core idea: the unified experience/subject arises from the *relations between* the fundamental micro-experiences, not from fusing them or adding a new entity.
  *   **What you've missed:** Holism still struggles with your headache question. If the committee "has" the headache, *who feels the pain?* If the pain is just distributed among the committee members (micro-experiences), how does the *unified feeling* of pain arise? If the pain belongs to the committee *as a whole* due to its relational state, it risks sounding like the committee *is* a subject – which brings us back to the "who" feels it. Holism owes an explanation of how relations create not just unified *information* but unified *feeling* and a sense of *ownership*.
  *   **What it still owes:** Your model needs to explain *how* the interactions of micro-experiences generate the specific, unified qualitative feels (the redness, the pain) and the undeniable sense that there is *one locus* of experience ("my" headache). It needs to bridge the gap between complex interaction and genuine, unified subjectivity.
