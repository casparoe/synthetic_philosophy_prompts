  Their committee model analogy (like a corporation) is clever but hits a snag with personal experiences like headaches. They want a decision tree built from plain questions using specific thought experiments (split-brain, neuron replacement, stadium, anesthesia), leading to 8-12 named positions without academic jargon. Each leaf needs its awkward consequence noted. They also want unused question combinations ("empty seats") and indistinguishable positions, plus where their committee idea fits.

