prompt: |-
  My friend Raya and I spent about three hours last night arguing about whether soldiers on opposite sides of a war are morally on a par, and I came away unsure what rule she's actually running. It started from a dumb side-question about private military contractors, and somewhere around hour two she said something like "if you'd do it either way, you're not a combatant, you're just a weapon somebody else is pointing" — but then she immediately said she wasn't sure that mattered, so I don't know how much weight to put on it. She's very careful about separating three questions, and I want you to keep them separate too: is the person *liable* to be killed (have they lost, or never had, the claim not to be killed); is killing them *permissible anyway*, the way you may kill a threat you have no complaint against at all; and is the person *blameworthy*, which she thinks can come apart from both of the others. Here's what I'm fairly confident she committed to:

  - Unjust side, volunteer infantryman who knows roughly what the war is about and doesn't much care whether it's just: liable, permissible to kill, killing him wrongs him in no way, and he's blameworthy.
  - Unjust side, conscript dragged in at gunpoint who'd be shot if he refused to fire: not liable, not blameworthy, but permissible to kill if that's the only way to stop him. Her line was roughly "you're not punishing him, you're stopping a threat — you shouldn't feel guilty, but you should feel bad."
  - Just side, soldier who actually looked into whether the war was justified, concluded it was, and fights for that reason: not liable, killing him impermissible and wrongs him, not blameworthy. (She also said the other side can't help themselves by appealing to self-defence here, since they're the ones who made the war.)
  - Just side, soldier who believes the war is just only because he swallowed some obviously racist nonsense from his own government and never checked anything — except it turns out the war really *is* just: not liable, not permissibly killed, but definitely blameworthy. Roughly: "he's a jerk who got lucky, but you don't get to shoot someone for having bad reasons when he happens to be right."
  - Unjust side, cook who never fires a shot and only feeds the front-line troops: liable, same as the infantry — "he's part of the machine." But when I pointed out that this seems to make the missile-factory owner liable too, she said the owner is *not* liable and not to be deliberately targeted, though her death "doesn't weigh much" in the proportionality calculation, and she admitted she didn't have a clean principled line between the cook and the owner.
  - She waffled on one case and never gave a final answer: a soldier on the just side who fights well and within the rules, but purely because the enemy killed his family and he wants to kill as many of them as he can.

  The case I want a prediction on is the one that started the whole fight. A private military company bid to both governments; this guy took the contract from the side that happens to be fighting the just war, at a fee he'd have accepted from either, never inquired which side was in the right, and doesn't care one way or the other. He fights competently, obeys the law of armed conflict, and does real good. So: does Raya say he's liable; is killing him permissible; is he blameworthy; and does he get to complain — is he *wronged* the way the careful just soldier is? I'd of asked her myself but we'd probably just restart the argument. I'm less interested in the bare answer than in the two or three rules that fit her verdicts above equally well and what each of them predicts here — my guesses are something like "the objective justice of the cause decides and motives are irrelevant," versus "what matters is the quality of the agent's deliberation or whether she's guided by the right reasons," versus some counterfactual version of her "you'd do it either way" line — which one you'd bet she's running and why, and which further case would best split them. I'd also like to know whether the traditional claim that combatants on both sides are morally equal is doing any work in any of this, or whether her verdicts about the just side's soldiers have already quietly given it up. And if you think the cook/owner distinction is where the real action is rather than the motives stuff, say so and tell me what case would settle *that* instead.
reasoning: |-
  Okay, the user has shared a detailed account of a philosophical debate with their friend Raya about the moral status of soldiers in war. They've outlined Raya's positions on several specific cases and now want to predict how she would judge a private military contractor who fights for the just side purely for money without caring about the cause. The user is particularly interested in identifying the underlying moral principles Raya might be using and how different principles would apply to this contractor case.

  Let me start by analyzing the cases Raya has already addressed. From the examples given, Raya seems to distinguish between:
  - Liability to be killed (whether someone has forfeited their right not to be killed)
  - Permissibility of killing (whether it's morally acceptable to kill them)
  - Blameworthiness (whether they deserve moral condemnation)

  What stands out is how Raya assigns these differently based on combinations of:
  1. Objective justice of the cause (whether the side is actually fighting a just war)
  2. Subjective motivation and deliberation of the combatant
  3. Degree of participation in hostilities

  For instance, she holds that:
  - A knowing volunteer for an unjust cause is liable, permissibly killed, and blameworthy
  - An unjust-side conscript is not liable or blameworthy, but may permissibly be killed as a last resort
  - A well-deliberating just soldier is not liable, not permissibly killed, and not blameworthy
  - A poorly-deliberating just soldier is not liable or permissibly killed, but is blameworthy

  The key tension appears between objective circumstances and subjective motivations. The cook vs. factory owner distinction suggests she's drawing lines about direct contribution to combat operations, though she admits lacking a clear principle here.

  For the PMC contractor case fighting for the just side purely for money, I see three possible interpretations of Raya's framework:

  First, the objective justice view would emphasize that he's fighting for the objectively just cause. This would likely make him not liable and not permissibly killed (like the careful just soldier), though possibly blameworthy for his mercenary motives.

  Second, the deliberation quality view would focus on his complete lack of moral concern. This might make him similar to the racist just soldier - not liable but blameworthy.

  Third, the counterfactual indifference view ("would fight for either side") might treat him as a mere weapon, potentially making him liable or at least permissibly killable without wronging him.

  Given Raya's hesitation about her own "weapon" comment and her treatment of the poorly-deliberating just soldier, I suspect she'd prioritize the objective justice of the cause over motives in determining liability and permissibility, while still condemning the mercenary's indifference as blameworthy. The factory owner case suggests she restricts liability to those directly integrated into military operations, which would include the cook and this frontline contractor.

  To distinguish between these interpretations, I'd propose testing with a soldier who fights competently for the just side but would have fought equally well for the unjust side if paid enough. If Raya considers him liable based on his counterfactual indifference, that would confirm the "weapon" view; if not, she's likely privileging actual circumstances over potential choices.

  The traditional moral equality of combatants seems clearly rejected in Raya's framework, as she assigns different statuses based on which side is objectively just. The cook/owner distinction remains problematic and might be clarified by examining cases like weapons engineers or civilian drivers directly attached to military units.
answer: |-
  Based on your detailed description of Raya's commitments, her framework appears to prioritize **objective participation in an unjust threat** as the core determinant of *liability*, while treating *blameworthiness* as a separate axis tied to subjective deliberation and motives. The *permissibility* of killing hinges on both liability and necessity, with "wronging" tied to liability. Here's the breakdown for the PMC contractor case and the competing principles:

  ### Raya's Likely Verdict for the PMC Contractor (Just Side)
  1.  **Liable? NO.** He fights for the objectively just side, meaning he objectively contributes to a just cause (stopping aggression). His role is directly combative, like the infantryman/cook, but Raya ties liability to participation in an *unjust* threat. Since he's on the just side, he isn't part of an unjust threat.
  2.  **Permissible to Kill? NO.** Killing him would not be objectively necessary to stop an unjust threat (he *is* stopping an unjust threat). He lacks liability, making killing him impermissible and a wronging. The "weapon" remark likely doesn't override this, given her hesitancy and her verdict on the racist just soldier.
  3.  **Blameworthy? YES.** He took the contract purely for money, indifferent to justice. He failed to deliberate or care about the moral status of the war. This parallels the racist just soldier: he has bad motives/reasons despite being on the right side. He's culpable for his indifference and lack of due diligence.
  4.  **Wronged if Killed? YES.** Since he's not liable, killing him wrongs him. He retains his claim not to be killed unjustly (like the careful just soldier and the racist just soldier).

  **Summary:** *Not liable, not permissibly killed, blameworthy, wronged if killed.*

  ---

  ### The Competing Principles & Predictions
  Raya's verdicts are best explained by a hybrid approach, but the dominant principles are:

  1.  **Objective Justice of the Cause + Objective Role (Dominant Principle):**
      *   **Core Rule:** Liability hinges *solely* on whether the agent is *objectively participating* in an *unjust* threat. Blameworthiness hinges on the *quality of the agent's subjective deliberation/motives* regarding the justice of the cause and their participation.
      *   **How it Fits:**
          *   Unjust infantryman: Liable (unjust threat), Blameworthy (knowing indifference).
          *   Unjust conscript: Not liable (not responsible for threat), Not blameworthy (coerced).
          *   Careful just soldier: Not liable (just threat), Not blameworthy (good reasons).
          *   Racist just soldier: Not liable (just threat), Blameworthy (bad reasons).
          *   Cook: Liable (integral part of unjust war machine).
          *   Factory owner: Not liable (too indirect, not integrated into military structure).
      *   **PMC Contractor Prediction:** Not Liable (objectively just cause), Blameworthy (indifferent motives).
      *   **Why Bet on This:** It cleanly explains the fundamental split in liability/permissibility based solely on the objective justice of the cause and the agent's role within it, while separating blameworthiness based on motives. Her "weapon" comment is likely an underdeveloped intuition about *indifference reducing excuses*, not a core liability criterion.

  2.  **Quality of Deliberation / Guidance by Right Reasons:**
      *   **Core Rule:** Liability *and* blameworthiness are primarily determined by whether the agent formed their intent to fight based on a good-faith, reasonable effort to discern and be guided by the *actual* justness of the cause.
      *   **How it Fits:**
          *   Unjust infantryman: Liable & Blameworthy (no care for justice).
          *   Unjust conscript: Not liable & Not blameworthy (no choice/agency).
          *   Careful just soldier: Not liable & Not blameworthy (good faith effort, guided by right reasons).
          *   Racist just soldier: *Problem:* This view struggles. If he's not guided by the *right* reasons (truth), he might be liable? But Raya says not liable/blameworthy. Fits poorly.
          *   Cook/Owner: Less relevant, focus is on the fighter's deliberation.
      *   **PMC Contractor Prediction:** Likely Liable & Blameworthy (no effort, not guided by right reasons, just money). *Contradicts Raya's likely verdict.*
      *   **Weakness:** Fails on the racist just soldier and struggles with the conscript (lack of deliberation doesn't make the conscript liable). Raya's liability verdicts track objective threat, not subjective reasoning quality.

  3.  **Counterfactual Indifference ("Would do it either way"):**
      *   **Core Rule:** Liability hinges on whether the agent would fight for *either* side regardless of justice, making them a mere instrument ("weapon"). Blameworthiness follows from this indifference.
      *   **How it Fits:**
          *   Unjust infantryman: Liable & Blameworthy (likely would fight either way for pay/glory).
          *   Unjust conscript: Not liable & Not blameworthy (wouldn't fight either way).
          *   Careful just soldier: Not liable & Not blameworthy (would only fight for just cause).
          *   Racist just soldier: *Problem:* He *wouldn't* fight for the unjust side (he believes his side is just). But Raya says blameworthy. Fits liability but not blameworthiness well.
          *   Cook/Owner: Ambiguous.
      *   **PMC Contractor Prediction:** Liable & Blameworthy (explicitly would take either contract).
      *   **Weakness:** Contradicts Raya's verdicts on the *just* side. The racist just soldier *wouldn't* fight for the unjust side, so shouldn't be liable (which fits), but Raya also says the careful just soldier isn't liable. The key failure is predicting liability for the PMC contractor fighting for the *just* side. Her liability rule seems anchored to *actual* participation in *objective* injustice, not counterfactual indifference.

  **Bet:** **Principle 1 (Objective Justice + Role)** is the strongest fit. It explains all core liability/permissibility verdicts and separates blameworthiness cleanly. Principle 3 is likely a red herring or a secondary thought about blameworthiness, not her core liability rule. Principle 2 fails key cases.

  **Splitting Case:** **A soldier on the *unjust* side who conducted thorough, good-faith research but was tragically deceived by flawless enemy propaganda into sincerely believing his side is just.** (Objective Role Principle: *Liable* - objectively part of unjust threat. Quality of Deliberation Principle: *Not Liable* - good faith effort, guided by reasons he believed right. Counterfactual Principle: Likely *Liable* - if he'd fight based on sincere belief, he might fight for either side if deceived).

  ---

  ### Moral Equality of Combatants
  Raya has **explicitly rejected** the traditional moral equality of combatants. Her framework fundamentally distinguishes between soldiers based on the objective justice of their side:
  *   Just soldiers are **not liable** to be killed and killing them **wrongs** them.
  *   Unjust soldiers (volunteers, cooks) **are liable** and killing them **does not wrong** them.
  The equality only holds in the narrow sense that combatants on both sides *can be permissibly killed* under certain conditions (e.g., stopping an immediate threat), but the *moral foundations* (liability, wronging) are starkly different. Her "unjust conscript" case highlights this – killing is permissible due to necessity, *not* because he's a combatant equal to others.

  ---

  ### The Cook/Owner Distinction & Where the Action Is
  The cook/owner distinction **is crucial** and reveals a tension in Raya's objective role principle. The action *is* here, as it defines the boundary of "direct participation" for liability.

  *   **The Problem:** Both contribute functionally to the unjust war effort. Raya draws a line: the cook (integrated into military structure) is liable; the factory owner (civilian contributor) is not, though her death is "less weighty."
  *   **The Implied (Unstated) Principle:** Liability applies to individuals who are **functional components of the military organization** engaged in hostilities. The cook wears the uniform, is under military command, and directly sustains frontline fighters. The factory owner runs a civilian business supplying a military customer.
  *   **Settling Case:** **A civilian engineer employed directly by the Ministry of Defense, working *inside* a military base, designing a specific weapon system crucial to the current offensive.** (vs. the same engineer working for a private defense contractor selling generic weapons on the open market).
      *   **Prediction:** Raya would likely deem the base-integrated engineer **liable** (like the cook - direct, functional part of the military machine), while the private contractor engineer is **not liable** (like the factory owner - contributing civilian). This tests the "integration into military structure/operation" boundary.

  **Conclusion:** While the PMC case highlights motive vs. objective cause, the *boundary of liability* hinges more critically on defining "direct participation in hostilities / integration into the military threat" (cook/owner/engineer problem) than on parsing motives. Motives primarily drive *blameworthiness* in her framework. To understand Raya, focus on how she defines the objective link to the unjust threat for liability, and treat motives as a separate axis for moral condemnation. Her PMC contractor is safe from liability claims (fighting for the just side) but morally condemnable for his indifference.
