prompt: |-
  I'm a journalist on the ideas desk and I'm midway through a feature on the unwritten rules that make crowded cities work — queueing at a bus stop, keeping to one side of a busy pavement, standing on the right of an escalator. A few weeks ago I had dinner with a transport economist and a retired magistrate and we spent an hour talking past each other about the legal half of it, and I've been chewing on it ever since. What bothers me is this: the state criminalises breaches of some conventions and not others, and it does so in a way that looks very hard to justify by reference to harm. A driver who crosses onto the wrong side of the road at four in the morning on an empty stretch, with no other vehicle anywhere in sight, has harmed nobody and risked nothing, and is still guilty of an offence. A person who walks straight to the front of a queue imposes a small but real cost on a line of identifiable people, makes them angry, and the worst that happens to them is a dirty look. Both rules look to me like the same sort of object: an arbitrary selection from among several equally workable equilibria, kept in place only because each of us conforms conditionally on the others conforming. I half-remember that a philosopher — David Lewis, in a book on convention published at the end of the 1960s — offered an analysis along roughly those lines, and that on something like his account the hold a convention has on us comes from the coordination problem it solves rather than from anybody's authority or anybody's say-so.

  So here is where I get stuck. First: what does the practice of backing an arbitrary equilibrium with criminal sanctions actually presuppose — that the law contributes a reason of its own, over and above the coordination reason, or merely that it secures expectations and makes the relevant common knowledge cheaper to come by? If the latter, why is a punishment needed at all; if the former, has the thing being enforced stopped being a convention in his sense, because people now conform out of fear of the penalty rather than conditionally on one another? Second: there is an asymmetry I cannot account for. The same legal system that prosecutes the harmless wrong-side driver leaves queues and escalators entirely to informal sanction; and, oddest of all, in civil cases the bare fact that someone broke the convention seems to settle liability almost irrespective of whether anyone was in fact harmed, whilst elsewhere the courts insist that we compensate harm rather than rule-breaking. What distinguishes the conventions that get enforced from those that do not — the size of the harm, the difficulty of detection, the fact that driving is already a licensed activity, or something about which equilibria are hardest to re-establish once they begin to wobble? And what does the occasional attempt to change a convention by decree tell us: if a country can announce a new side of the road and be obeyed, what exactly did the announcement have to latch onto in order to work?

  The distinction I've started using to get a grip on this, and which I'd like you to test rather than humour, is between a first-order convention — the regularity itself, everyone drives on the left — and what I've been calling a deference convention: the second-order regularity of falling in with whatever the designated authority announces about which side to drive on, whatever it happens to announce. My hunch is that the criminal law protects the second-order regularity rather than the first, that the lone driver on the empty road is not a harmless eccentric but a defector from the practice of treating the ruling as decisive, and that their offence is closer to free-riding than to dangerous driving, which would explain why the absence of any harm is no defence. But I can equally see the deflationary reading: the law merely selects an equilibrium, and the deference story is redundant decoration. So please reconstruct the implicit theory of convention and of legal normativity that this pattern of practice presupposes; tell me which parts of it the practice strictly requires and which it merely fits well with, such that several rival accounts could license the very same practice; say whether my first-order/deference distinction is doing real work or collapses into something the standard account already handles; and tell me what would genuinely have to change, in doctrine or in behaviour, if the courts adopted the view that a convention's normativity is exhausted by its being an equilibrium, so that law can only select among equilibria and never add reasons of its own. I should say I'm filing this from a hotel room with no library access, so please argue it out rather than pointing me at the literature — I need the reasoning, not references. Give me exactly five numbered points, no preamble and no summing-up, each point two sentences at most.
reasoning: |-
  Hmm, the user is a journalist working on an article about unwritten rules in crowded cities and how the legal system enforces some conventions but not others. They're grappling with the asymmetry: why are harmless breaches like driving on the wrong side criminalized, while queue-jumping only gets social disapproval? They recall David Lewis's work on conventions as solutions to coordination problems and want to test their own distinction between first-order conventions (like driving on the left) and second-order "deference conventions" (following authority announcements about such rules).

  They present several specific philosophical puzzles: 1) Whether law adds new reasons beyond coordination or just secures expectations, 2) Why punishment exists if it's just about coordination, 3) Why driving rules get legal enforcement while queueing doesn't, 4) How authorities can successfully change conventions by decree, and 5) Whether their first-order/deference distinction holds analytical value.

  I need to address each aspect concisely while respecting their constraints: exactly five numbered points, each no longer than two sentences, no references to literature, and no preamble or conclusion. The response should rigorously test their deference convention theory against alternative explanations.

  Let me break this down point by point. First, regarding what legal enforcement presupposes: the law likely provides a new reason for compliance (fear of sanction) while simultaneously strengthening the coordination equilibrium by making conformity expectations more reliable. Their distinction holds because the law targets meta-compliance - obeying the rule because it's the rule - which explains why even harmless breaches are punished.

  Second, on punishment's necessity: formal sanctions create common knowledge of enforcement, which deters potential defectors who might otherwise exploit situational exceptions. This maintains the convention's stability at scale, where informal sanctions become impractical.

  Third, explaining the enforcement asymmetry: conventions get legal backing when coordination failure causes catastrophic harm (like collisions), when defection is hard to detect socially (like nighttime driving), or when the activity is state-regulated (like licensed driving). Queue disputes involve smaller, observable harms that social enforcement handles adequately.

  Fourth, on changing conventions by decree: authorities need pre-existing deference conventions (accepting their jurisdiction over such rules) plus credible enforcement capacity. The announcement works by coordinating expectations around the new equilibrium, leveraging that existing deference.

  Finally, on the consequences if courts viewed conventions as mere equilibria: doctrine would shift toward requiring proof of actual harm or coordination breakdown for liability, abandoning strict liability offenses like the empty-road driving violation. Their distinction proves essential here, as current practice assumes law adds normative force beyond the equilibrium itself.

  Throughout this, their deference convention theory withstands the "deflationary" alternative because it explains why we punish harmless rule-breaking: it's about maintaining the system of authoritative rule-following, not just the specific driving pattern. The distinction does real work in clarifying law's role in stabilizing meta-conventions.
answer: |-
  1. Legal enforcement presupposes that formal sanctions create a new, distinct reason for compliance (deterrence through penalty) while simultaneously reinforcing the coordination equilibrium by making universal conformity expectations more reliable and common knowledge cheaper to achieve; your distinction holds because the law targets defection from the *deference convention* (disregarding the authoritative selection), explaining why even harmless breaches are punished.
  2. Punishment is necessary to establish credible deterrence at scale, creating common knowledge that defection triggers predictable costs; this prevents erosion of the convention in situations where informal sanctions are weak or detection uncertain, preserving stability where conditional cooperation alone might falter.

  3. Conventions get legal enforcement when coordination failure risks catastrophic harm (collisions), defection is hard to detect informally (e.g., isolated driving), or the activity is state-regulated (licensing); queueing lacks these, as harms are minor, observable, and effectively policed by social sanction, making formal enforcement inefficient.

  4. Changing a convention by decree requires leveraging an existing, robust deference convention (accepting authority’s jurisdiction over such rules) plus credible enforcement capacity; the announcement coordinates expectations around the new equilibrium precisely by activating that pre-existing practice of treating authority as decisive.

  5. If courts viewed conventions as *only* equilibria, strict liability offenses like your empty-road driving case would collapse, requiring proof of actual harm or coordination breakdown for liability; your distinction is essential here, as current practice assumes law adds normative force beyond equilibrium, enforcing deference to its selection.
