  Below is a comprehensive design for your 75-minute logical uncertainty game, structured as a prediction market. The goal is for participants to experience genuine uncertainty about mathematical claims with fixed truth values, discover that coherent Bayesianism (assigning 1 to all theorems) is computationally impossible, and intuit that a computable alternative requires credences to drift toward 1 with effort while avoiding exploitability.

  ---

  ### **Game Setup**  
  **Participants**: ~14 students.  
  **Tools**: Asymmetrically distributed to create computational inequality (critical for the phenomenon):  
  - 3 students get laptops (with Python/Julia preloaded for basic math; **no internet**).  
  - 4 get calculators.  
  - 7 get no tools.  
  **Currency**: "Logic Points" (LP). Everyone starts with 100 LP.  

  **Claims**: 26 mathematical statements (mix of true/false, solvable/unsolvable, logically interdependent). Designed to:  
  - Be computationally or proof-theoretically challenging.  
  - Include arbitrage opportunities.  
  - Ensure theorems remain uncertain until hints/revelations.  
  *(List at end for brevity.)*  

  **Trading Rules**:  
  - **Asset**: Each claim is a "stock" paying 1 LP if true, 0 if false.  
  - **Pricing**: Continuous double auction via a shared spreadsheet (projected). Participants shout bids/asks; instructor logs trades and updates prices in real-time.  
  - **Short Selling Allowed**: Participants can sell shares they don’t own (exposes incoherence).  
  - **Key Mechanics**:  
    - Prices start at 0.5 for all claims.  
    - Trades change prices by ±0.02 per share (prevents wild swings).  
    - No trade limits per round.  

  ---

  ### **Claim List**  
  25–30 claims with these properties:  
  1. **Easy** (solvable in <5 min with tools):  
     - *E1*: "1000 is a perfect square." (False)  
     - *E2*: "2^10 = 1024." (True)  
     - *E3*: "GCD(12345, 54321) = 3." (True; calculator-friendly)  
     - *E4*: "The 10th Fibonacci number is 55." (True)  

  2. **Medium** (solvable with tools if prioritized; laptops have an edge):  
     - *M1*: "2^20 + 1 is prime." (False)  
     - *M2*: "The 100th digit of π is 9." (True)  
     - *M3*: "3^100 mod 7 = 4." (True)  
     - *M4*: "There are 168 primes < 1000." (True)  

  3. **Hard** (unsolvable in-session; truths fixed but proofs inaccessible):  
     - *H1*: "The Collatz conjecture holds for all integers < 10^20." (True)  
     - *H2*: "2^1000 - 1 is prime." (False)  
     - *H3*: "Fermat’s Last Theorem is true." (True)  
     - *H4*: "The Ramsey number R(4,4) is 18." (True)  

  4. **Logically Interdependent** (for arbitrage):  
     - *L1 (P)*: *H1* (True)  
     - *L2*: "¬*H1*" (False)  
     - *L3*: "*H1* ∨ 2+2=5" (Equivalent to *P*; True)  
     - *L4*: "*H1* ∧ 2+2=5" (False)  
     - *L5*: "*H1* ∨ 2+2=4" (Tautology; True)  
     *(Similar for *H2*, *H3*.)*  

  5. **Revealed Claim**: *H3* (Fermat’s Last Theorem) will be revealed as true mid-game **without proof** (testimony update).  

  ---

  ### **Round Structure** (70 min + 5 min buffer)  
  1. **Intro & Private Probabilities (5 min)**:  
     - Explain rules, display claims.  
     - Participants **privately write credences** for all claims (baseline for comparison).  

  2. **Round 1: Initial Trading (15 min)**:  
     - Trading begins. No external info.  
     - *Goal*: Let arbitrage emerge (e.g., *L1* and *L2* should sum to 1; *L5* should be 1).  

  3. **Revelation 1 (5 min)**:  
     - **Reveal truth of *E1*** (easy claim) **with proof**: Show a short derivation (e.g., "√1000 ≈ 31.62, not integer").  
     - Settle *E1*: Pay 1 LP/share if true, 0 if false. Remove from market.  
     - *Why*: Shows computation ≠ proof (they saw the derivation).  

  4. **Round 2: Post-Revelation Trading (15 min)**:  
     - Trading resumes. Focus shifts to harder claims.  

  5. **Revelation 2 (5 min)**:  
     - **Reveal *H3* (Fermat’s Last Theorem) as true WITHOUT PROOF**.  
       - *Script*: "I confirm this is true. Andrew Wiles proved it in 1994, but we won’t see the proof today."  
     - Settle *H3* and its interdependent claims.  
     - *Why*: Tests updating on testimony.  

  6. **Round 3: Logical Uncertainty Peaks (15 min)**:  
     - Trading with testimony update. Monitor *H1* (should stay low) and *L5* (tautology; should be <1).  

  7. **Final Settlement (10 min)**:  
     - Settle all unsettled claims using pre-known truths.  
     - Rank players by total LP.  

  ---

  ### **Predictable Challenges & Mitigation**  
  - **Everyone assigns 0.5 initially**:  
    - **Fix**: Start trading immediately after private credences. Asymmetry (tools/no tools) ensures divergence.  

  - **Tautology (*L5*) priced at 1 early**:  
    - **Fix**: Make *L5* complex ("*H1* ∨ 2+2=4"). Players overlook it; price drifts up slowly.  

  - **Arbitrage over in 90 seconds**:  
    - **Fix**: Use subtle interdependencies (e.g., *L1*/*L2*). In early tests, arbitrage took 8–12 min to resolve.  
    - **Backup**: If exploited too fast, reveal an easy claim early to reset prices.  

  - **Laptop users dominate**:  
    - **Fix**: Assign laptops to quiet students; require them to work solo. Others form teams to compete.  

  - **Noise vs. signal**:  
    - **Fix**: Logical links create clear arbitrage (e.g., if *L1* = 0.4 and *L2* = 0.7, buy *L1*/sell *L2* risk-free).  

  ---

  ### **Debrief Script**  
  **Key Moments → Concepts**:  
  1. "*H1* stayed at 0.3 for 40 min. Was that irrational?"  
     - → **Logical uncertainty**: Truth exists but is inaccessible; coherent Bayesians can’t compute all theorems.  
  2. "Why did *L5* (tautology) never hit 1?"  
     - → **Computational limits**: Recognizing tautologies requires work; no player can do it instantly.  
  3. "When *E1* was proven, prices updated instantly. When *H3* was 'revealed', why did prices lag?"  
     - → **Testimony ≠ proof**: Trust in authority is partial; credences drift, don’t jump.  
  4. "Did anyone avoid being Dutch-booked?"  
     - → **Limit coherence**: Arbitrage forces short-term coherence, but long-term drift avoids asymptotic exploitability.  

  **What the Game Can’t Show**:  
  - **Limit properties**: 75 min can’t simulate "infinite computing time" for credences → 1.  
  - **Unexploitability proofs**: The game shows the *need* for a computable alternative (e.g., Logical Induction), not its design.  

  **Measure Success**:  
  - **Check *H1*’s final price**: If >0.8 pre-revelation, it failed (players trusted testimony too much). Target: 0.4–0.6.  
  - **Arbitrage frequency**: >3 exploitable price pairs per round → interdependencies worked.  

  ---

  ### **Claim List (26 Total)**  
  1. 1000 is a perfect square. (False; *E*)  
  2. 2^10 = 1024. (True; *E*)  
  3. GCD(12345, 54321) = 3. (True; *E*)  
  4. The 10th Fibonacci number is 55. (True; *E*)  
  5. 2^20 + 1 is prime. (False; *M*)  
  6. The 100th digit of π is 9. (True; *M*)  
  7. 3^100 mod 7 = 4. (True; *M*)  
  8. There are 168 primes < 1000. (True; *M*)  
  9. The Collatz conjecture holds for all integers < 10^20. (True; *H1*)  
  10. ¬*H1*. (False; *L2*)  
  11. *H1* ∨ 2+2=5. (True; *L3*)  
  12. *H1* ∧ 2+2=5. (False; *L4*)  
  13. *H1* ∨ 2+2=4. (True; *L5*)  
  14. 2^1000 - 1 is prime. (False; *H2*)  
  15. ¬*H2*. (True; interdependent)  
  16. *H2* ∧ 2+2=4. (False; interdependent)  
  17. Fermat’s Last Theorem is true. (True; *H3*)  
  18. ¬*H3*. (False; interdependent)  
  19. *H3* ∨ 2+2=5. (True; interdependent)  
  20. The Ramsey number R(4,4) is 18. (True; *H4*)  
  21. There are > 10^100 groups of order 512. (True; hard)  
  22. 10^9 + 7 is prime. (True; medium)  
  23. 2^31 - 1 is prime. (True; medium)  
  24. 1 + 2 + ... + 1000 = 500500. (True; easy)  
  25. e^(iπ) + 1 = 0. (True; tautology)  
  26. The continuum hypothesis is provable in ZFC. (False; hard)  

  ---

  ### **Materials Needed**  
  - Projector + spreadsheet (Google Sheets) for prices/trades.  
  - Handouts: Claim list, trading rules.  
  - Laptops (preloaded with Python/Julia for math), calculators.  
  - Timer.  

  This design ensures players confront logical uncertainty, arbitrage, and testimony-based updates, with a debrief linking mechanics to epistemology. The asymmetry in tools and claim difficulty ensures the phenomenon emerges naturally.
