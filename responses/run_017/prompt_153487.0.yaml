prompt: |-
  I'm a fourth-year PhD student in machine learning, and I've been asked to write the operating procedure for our lab's policy registry before it goes live next term, so this needs to be something a colleague can actually run rather than something that displays a position.

  The registry is a small piece of infrastructure. For certain recurring decisions, a researcher submits a *policy* — a mapping from the observations they might make to the action they would take — together with an ex ante model of the situation. The registry evaluates the candidate policies against that ex ante model, records the winner, and then executes it mechanically once the observation arrives. Two or three decisions a month go through it, usually with real money attached: compute, annotation budgets, occasionally the difference between shipping and killing a three-month run. The person running the procedure will be a rotating graduate student who has read one paper on this and has about forty minutes; the PI signs off. Assume this person has no access to the literature and will not look anything up, so every distinction the procedure uses has to be stated inside the procedure itself.

  I want the procedure built on the updateless framing, by which I mean: choose among whole policies by their expected value computed from the ex ante prior, without conditioning on the observation you in fact end up with, on the grounds that what you control is the output of the decision procedure rather than the single act in the branch you happen to occupy. I want that turned into an actual procedure, not expounded. Specifically:

  - The ordered questions, with what counts as a sufficient answer to each, and the points where the procedure stops early or hands the decision to a person.
  - A test for whether a decision belongs in the registry at all. As I understand it, the framing earns its keep only where the decision is entangled with something else — an external predictor whose behaviour tracks the policy rather than the act, or a set of instances of the same decision computation that the agent cannot tell apart — and collapses back into ordinary expected-utility maximisation otherwise. I need that test stated so a graduate student can apply it to a real ticket in five minutes, including what to do when the answer is genuinely unclear.
  - How to fix the prior, and the prior of whom as of when: our priors at registration, our priors now, or something else — and what to do when the two have diverged.
  - What the entangler is simulating when it predicts us: the rulebook as submitted text, the procedure that generated it, or our actual future behaviour. This is the step I expect to be load-bearing and the one I find hardest, and the answer seems to change depending on whether we can rewrite the rulebook afterwards.
  - What an operator should do when the executed policy mandates an action that is plainly wrong given everything now known: who may override, on what grounds, and what an override costs the registry.
  - Where full policy comparison is computationally hopeless, what approximation to substitute, and which steps are judgment calls dressed up as procedure.
  - What the procedure cannot do.

  Then run it, in order, on three cases.

  1. Our lab belongs to a compute consortium. Each quarter we submit a contingency rulebook; the consortium's allocator, a fixed and published algorithm, simulates the submitted rulebook against a battery of hypothetical scenarios and awards compute roughly in proportion to the share of the allocation that rulebook would spend on long, high-variance runs in scenarios where they look unpromising. This quarter's allocation is already granted and largely spent. The scenario that actually arose is one where a high-variance run looks unpromising and would consume about a third of what is left, and nothing we can identify now depends on whether we run it.
  2. A one-off decision: whether to spend $4k on an annotation job for a single project. No allocator, no recurring structure, and no way of confusing this decision with any other.
  3. A registered policy from a run begun six months ago says: if the pre-registered safety threshold is crossed, halt, delete the checkpoint, and run no further diagnostics first. The threshold was crossed this morning. Within ten minutes we found a bug in the logging library that makes the crossing very likely spurious; the model itself looks fine; the run cost roughly $60k and three months of someone's time; no external party is watching and nothing downstream depends on our compliance.

  Please give me a committed answer: one procedure, with definite choices at each step and the reasons for them, rather than a survey of what a defender of each decision theory would say. Where you think the updateless framing is simply inapplicable or wrong for a class of cases, say that flatly rather than hedging, and I expect I will not like what your procedure returns on case 3 — give it anyway, and say whether the correct move there is to override and what would make an override legitimate rather than convenient. Close with a short note, two hundred words at most, on the step you are least confident in, what would change your mind about it, and where your own view is contested. I would rather have something I can argue with than something balanced.
reasoning: |-
  We are creating an operating procedure for a policy registry that uses an updateless decision theory (UDT) framing. The key idea is to evaluate entire policies (mappings from observations to actions) based on an ex ante prior, without conditioning on the actual observation that occurs. The procedure must be executable by a rotating graduate student with minimal background.

  The procedure will be structured as a step-by-step guide. We'll define the steps, including early termination conditions, and then apply it to the three cases.

  ### Procedure: Policy Registry Operation

  **Step 0: Pre-submission Check (Is this decision suitable for the registry?)**
  - **Test for Suitability**: The decision belongs in the registry only if there is an "entanglement" factor. Specifically, one of the following must hold:
    - (a) There exists an external predictor (or mechanism) that simulates the policy (or the decision process) and its behavior depends on the policy (not just the action) in a way that affects the outcome. (Example: The compute consortium's allocator in Case 1.)
    - (b) The decision is part of a set of identical or indistinguishable decision problems that the agent cannot tell apart (i.e., a "program" that is run multiple times in identical circumstances, so that the policy must be the same for all).
  - **If unclear**: If the operator cannot determine within 5 minutes whether (a) or (b) applies, then the decision does not belong in the registry. Hand the decision to a human (the PI or designated person) for ad hoc handling. Note: The registry is for decisions where the updateless framing is necessary; otherwise, we fall back to standard expected utility maximization (condition on the observation).

  **Step 1: Policy Submission and Prior Fixation**
  - The researcher submits:
    - A set of candidate policies (each is a mapping from possible observations to actions).
    - An ex ante model (a probability distribution over states of the world and observations, and a utility function over outcomes).
  - The prior is fixed as the ex ante prior provided by the researcher at the time of submission. This prior represents the lab's beliefs at the time of submission.
  - **Divergence of beliefs**: If the operator (or the lab) now has a different prior (i.e., beliefs have changed), they must still use the submitted prior. The reason is that the registry is designed to commit to the ex ante evaluation. However, if the change in beliefs is so extreme that the operator judges the submitted prior to be clearly flawed (e.g., based on information that was known at submission time but ignored), then the operator must stop and hand the decision to a human. Note: This is rare and should be documented.

  **Step 2: Entangler Specification**
  - The operator must specify what the entangler (if any) is simulating. The entangler is the external predictor or mechanism that creates the entanglement (from Step 0). The rule is:
    - The entangler simulates the **policy as submitted text** (i.e., the exact mapping provided) unless the submission explicitly states that the entangler is simulating the procedure that generated the policy or the lab's future behavior. 
    - Why: The registry is a commitment device. We want the entangler to react to the policy we submitted, not to our potential future deviations. If we allowed the entangler to simulate our actual behavior (which might override), then the entangler would predict overrides and the policy would be ineffective. Therefore, by default, the entangler uses the submitted text.

  **Step 3: Policy Evaluation**
  - For each candidate policy, compute the expected utility using the ex ante prior (from Step 1). Do not condition on the actual observation that will occur (or has occurred). The policy with the highest expected utility is selected.
  - **Computational approximation**: If exact computation is hopeless, use the following approximation:
    - Sample a set of states from the prior (at least 1000 samples, or as many as feasible in 10 minutes of computation).
    - For each state, generate the observation (if not already in the state) and then apply the policy to get the action. Compute the utility of the outcome.
    - Average the utilities to get an estimate of the expected utility for the policy.
    - **Judgment calls**: The sampling procedure and the number of samples are judgment calls, but must be documented. The operator must use the same set of samples for all policies to ensure fairness.

  **Step 4: Execution**
  - Once the observation arrives, the operator executes the action prescribed by the winning policy for that observation.
  - **Override**:
    - The operator must not override unless one of the following holds:
      - (i) The action is physically impossible or illegal.
      - (ii) The operator has clear and undeniable evidence that the ex ante model (including the prior) was flawed in a way that would have changed the policy selection, and this evidence was not available at submission time. (Note: This does not include mere updating of beliefs with new data, but rather an error in the model specification.)
    - If an override is performed, it must be approved by the PI and documented. The cost of override is that the registry's credibility for entanglement (in future decisions) is reduced. In particular, if the registry becomes known for overrides, then external predictors (entanglers) might start simulating the actual behavior (including overrides) rather than the submitted policy, which would break the updateless reasoning.

  **Step 5: Record Keeping**
  - Document the entire process, including the candidate policies, the ex ante model, the evaluation results, the observation, the action taken, and any override with justifications.

  **What the procedure cannot do**:
  - It cannot handle decisions that lack entanglement (as per Step 0) without falling back to standard conditioning (which it doesn't do). Such decisions should not be in the registry.
  - It cannot update the prior after submission to incorporate new information (except via the rare override for model flaws).
  - It cannot guarantee optimality when the approximation in Step 3 is used.

  ### Running the Procedure on the Cases

  **Case 1: Compute Consortium**
  - Step 0: There is an entangler (the consortium allocator) that simulates the rulebook (policy) to determine the compute allocation. Therefore, it belongs in the registry.
  - Step 1: The policy was submitted at the beginning of the quarter with an ex ante model. The prior is fixed as the one from then.
  - Step 2: The entangler (allocator) simulates the submitted rulebook (the policy as text). We do not consider potential overrides.
  - Step 3: The evaluation was already done by the consortium? Actually, the registry must re-evaluate the candidate policies (if there were multiple) at submission time? But note: The allocation is already granted based on the rulebook. The current decision is whether to run the high-variance run. The rulebook (policy) already specifies the action for the current observation (unpromising run). The registry has already recorded the winning policy (the rulebook) and now must execute it.
    - Action: The rulebook says to run the high-variance run if the observation is "unpromising" (but according to the rulebook's own criteria) and the rulebook would have allocated compute for that. However, note the scenario: the rulebook was selected because it allocated compute to long, high-variance runs in unpromising scenarios (to get more compute). Therefore, the policy likely says to run it. The operator must execute that action: run the run, spending the compute.
  - Override? The operator might think it's a waste now, but the override conditions are not met. The ex ante model isn't flawed; we just have updated information. The registry must follow the policy. Override would break the trust in the registry and might harm future allocations.

  **Case 2: One-off annotation job**
  - Step 0: There is no entangler (no external predictor) and no set of indistinguishable decisions. Therefore, the decision does not belong in the registry. The operator should hand it to a human for standard expected utility maximization (condition on the current observation and use current beliefs).
    - The human will decide based on the current expected utility of the annotation job.

  **Case 3: Halting a run due to safety threshold**
  - Step 0: There is no entangler mentioned (no external party watching, no recurring structure). The operator must check: was there an entangler at the time of submission? The problem says "no external party is watching". Therefore, there is no entanglement. However, note: the policy was submitted six months ago. The operator must recall the situation at submission. If there was no entangler then, then it should not have been in the registry. But let's assume it was submitted and passed Step 0 because of a misunderstanding. We'll run the procedure as if it were in the registry.
  - Step 1: The prior is fixed as the one from six months ago.
  - Step 2: Since there is no entangler, Step 2 is moot. But we proceed to Step 3.
  - Step 3: The policy evaluation at submission time selected the current policy (which says to halt, delete, and run no diagnostics) as optimal under the ex ante prior. The registry recorded it.
  - Step 4: The observation (threshold crossed) has occurred. The policy mandates: halt, delete, and run no diagnostics. The operator must do that.
  - Override? The operator has found a bug that makes the threshold crossing spurious. This is new information that was not available at submission time. However, note: the override condition (ii) requires evidence that the ex ante model was flawed. The bug in the logging library is a flaw in the model because the model (at submission time) assumed that the threshold crossing was a reliable signal. This flaw might have been knowable at submission time? The operator must judge: if the bug was present at submission time and the model did not account for it, then it's a flaw. But if the bug was introduced later, then it's new information and not a model flaw. The problem says: "we found a bug in the logging library that makes the crossing very likely spurious". It doesn't say when the bug was introduced. The operator must assume that the bug was present at submission time (unless there is evidence to the contrary) because the logging library is a dependency. Therefore, if the model did not account for the possibility of such a bug, then it was flawed. Override is justified on condition (ii). The operator must get PI approval and document. The action would be to not halt and to investigate.

  However, note: the Step 0 check should have rejected this decision because there was no entanglement. Therefore, the registry should not have handled it. The correct move is to override and then remove the policy from the registry (and not use the registry for such decisions in the future). But the procedure we are running now is for a decision that is in the registry. So we follow the override procedure.

  ### Note on Uncertainty

  The step I am least confident in is Step 0 (the suitability test). The concept of "entanglement" is abstract and might be hard for a graduate student to apply in 5 minutes. I worry that they might let in decisions that don't need the registry (like Case 3) and cause unnecessary rigidity, or reject decisions that do (like Case 1). 

  What would change my mind: Evidence from real-world use that the test is too permissive or too strict. Also, a simpler, more operational test might be: "Is there a mechanism that will simulate this policy (or a set of identical policies) before the observation is known, and that simulation affects the outcome?" This reframing might help. My view is contested because some decision theorists argue that UDT is always the "correct" decision theory, even without explicit entanglement. However, without entanglement, UDT reduces to standard conditioning, so the registry would be overkill.

  ### Final Procedure Output

  The procedure is as above. For the cases:
  - Case 1: Run the run (no override).
  - Case 2: Not suitable for registry; hand to human.
  - Case 3: Override is justified (if the bug existed at submission time and the model didn't account for it) and then halt and delete is not done. But note: the policy should not have been in the registry. After override, remove it from the registry.
answer: |-
  ### Policy Registry Operating Procedure  
  **Version 1.0 | For use by rotating graduate student operators**  
  *Time budget: 40 minutes per decision. PI sign-off required. No external references permitted.*  

  ---

  #### **Step 0: Decision Suitability Check**  
  *Goal: Determine if the decision belongs in the registry. Stop early if not.*  
  1. **Ask**: "Is there an *entangler* (external predictor/mechanism) that simulates our *policy* (not just the action) before the observation arrives, OR are there multiple indistinguishable instances of this decision that our policy must cover uniformly?"  
     - **Entangler defined**: A fixed algorithm/agent that:  
       (a) Simulates our policy *before* observations are known,  
       (b) Its output depends on the *policy's structure* (e.g., how it acts in hypothetical scenarios), not just the action taken in the actual scenario.  
     - **Indistinguishable instances defined**: ≥2 identical decisions where the policy cannot tailor actions to individual instances (e.g., repeated identical bets).  
  2. **Sufficient answers**:  
     - **Yes** (proceed to Step 1): Evidence of entangler (e.g., consortium allocator, automated opponent) or multiple instances (e.g., precommitment to 100 identical tasks).  
     - **No** (stop early, hand to PI): One-off decisions with no entangler (e.g., Case 2).  
     - **Unclear** (stop early, hand to PI): Ambiguity persists after 5 minutes of review. Document reasoning.  

  ---

  #### **Step 1: Fix the Prior**  
  *Goal: Lock in the ex ante prior for policy evaluation.*  
  1. **Use the researcher’s submitted ex ante prior and model** (beliefs at registration time). Never use current beliefs.  
  2. **If beliefs have diverged**:  
     - **Proceed normally** unless the divergence introduces *logical inconsistencies* (e.g., prior assumes impossibility X, but X is now proven true).  
     - If inconsistent, **halt and hand to PI** (do not override yet).  

  ---

  #### **Step 2: Specify Entangler Simulation**  
  *Goal: Define what the entangler predicts.*  
  1. **Default rule**: The entangler simulates the **policy as submitted text** (literal code/mapping provided at registration).  
     - *Reason*: The registry is a commitment device. Entanglers (e.g., allocators) reward/punish based on *declared* rules, not our future behavior or intent.  
  2. **Exceptions**: Only if the submission *explicitly states* that the entangler models (a) the generating procedure or (b) our lab’s behavior, use that. *Rare; assume text unless proven otherwise*.  

  ---

  #### **Step 3: Policy Evaluation**  
  *Goal: Select the policy with highest ex ante expected utility.*  
  1. **Compute expected utility** for each policy:  
     - Weight outcomes by the ex ante prior (Step 1). *Do not* condition on the actual observation.  
  2. **Computational shortcut**:  
     - If exact calculation is intractable, **use Monte Carlo sampling** (≥1,000 samples from prior).  
     - **Judgment call**: If sampling fails, **hand to PI** (do not approximate further).  
  3. **Output**: The winning policy (record it).  

  ---

  #### **Step 4: Execution and Override**  
  *Goal: Enforce the policy unless catastrophic.*  
  1. **Execute** the action mandated by the winning policy when the observation arrives.  
  2. **Override conditions** (requires PI approval):  
     - (a) **Physical/legal impossibility** (e.g., action requires unavailable resources).  
     - (b) **Proven flaw in ex ante model** (e.g., prior assumes software version Y, but a bug in Y existed at registration and was overlooked).  
     - *Not grounds for override*: New information (e.g., "we now know the action is suboptimal").  
  3. **Cost of override**: Document it. Frequent overrides degrade registry credibility (entanglers may ignore future policies).  

  ---

  #### **Step 5: Fail-Safes**  
  - **What the procedure cannot do**:  
    - Handle decisions without entanglement (Step 0).  
    - Incorporate post-registration information (override is emergency-only).  
    - Guarantee tractability (judgment calls in Steps 0 and 3).  

  ---

  ### Case Execution  
  *Operator script: Follow steps in order.*  

  #### **Case 1: Compute Consortium Allocation**  
  - **Step 0**: Entangler exists (consortium allocator simulates policy pre-observation). **Proceed**.  
  - **Step 1**: Use prior/model from registration (quarter-start). No logical inconsistency.  
  - **Step 2**: Entangler simulates policy as submitted text (allocator’s algorithm is fixed).  
  - **Step 3**: Evaluate policies. Winning policy mandates running high-variance runs in unpromising scenarios (since that maximized ex ante compute share).  
  - **Step 4**: **Execute** – run the high-variance run. No override (new info doesn’t justify; model isn’t flawed).  
  - **Output**: Spend the compute.  

  #### **Case 2: One-Off Annotation Job**  
  - **Step 0**: No entangler (no predictor simulates the policy; one-off decision). **Stop and hand to PI**.  
  - **Output**: Human decides using standard conditioning (current beliefs).  

  #### **Case 3: Safety Threshold Halt**  
  - **Step 0**: **Stop and hand to PI**. No entangler (no external predictor; "nothing depends on compliance"). *This never belonged in the registry*.  
    - *If forced to proceed* (e.g., policy already registered):  
      - Step 1: Use prior from 6 months ago.  
      - Step 2: No entangler → Step 2 irrelevant.  
      - Step 3: Winning policy mandates "halt and delete."  
      - Step 4: **Override permitted** (PI approval). Grounds: Proven flaw in ex ante model (bug in logging library existed at registration; model assumed reliable thresholds). Cost: Weakens registry credibility.  
  - **Output**: Override → do not halt; diagnose bug.  

  ---

  ### Note on Uncertainty  
  **Least confident step**: Step 0 (suitability). The "entangler" test is brittle; false positives (e.g., Case 3) force overrides, false negatives (e.g., missing subtle entanglers) collapse to myopic decisions. **What would change my mind**: Evidence that operators consistently misapply it (e.g., >20% of decisions halted at Step 0 later proved entangled). **Contested view**: Purist UDT advocates argue *all* decisions are entangled (e.g., with logical inductors). I reject this—operationalizability demands clear heuristics. If entanglement is undetectable in 5 minutes, the registry shouldn’t handle it.
