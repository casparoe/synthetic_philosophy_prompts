answer: |-
  Here’s a defended research agenda for moral trade, prioritizing for **scalability under uncertainty and unverifiable counterparties**, using criteria of **importance (I)**, **tractability (T)**, **neglect (N)**, and upstream/downstream dependence. Budget: 5 researchers × 2 years.

  ### Core Ranking Criteria
  - **Importance (I)**: Does failure here make moral trade irrelevant for the target case (unverifiable AI)? Does it block progress?
  - **Tractability (T)**: Can we make concrete progress in 2 years with decision theory/econ (no empirics)? Formal modeling is key.
  - **Neglect (N)**: Is this underexplored relative to its stakes?
  - **Upstream**: If unanswered, prevents clear framing of other questions.

  ### Ranked Questions (Defended Order)
  1. **Does intrapersonal "trade" yield Pareto improvements over dominance?**  
     - **Defense**: *Most upstream and critical*. If moral uncertainty can’t be usefully modeled as gains-from-trade (i.e., compromise policies don’t Pareto-dominate "winner-takes-all" choices under plausible credences), the entire analogy collapses. *Importance (10/10)*: Foundational. *Tractability (8/10)*: Requires extending moral uncertainty frameworks (e.g., Sepielli, MacAskill) with trade mechanics. *Neglect (9/10)*: Barely explored.  
     - **Upstream**: Without this, other questions lack coherence.

  2. **What defines "gains" with unverifiable counterparties?**  
     - **Defense**: If gains require observable welfare improvements but verification is impossible (e.g., shut-down-only enforcement), can "trade" exist? Formalize gains as *counterfactual welfare* under agreed actions. *I (9/10)*: Directly determines if AI-human trade is possible. *T (7/10)*: Leverage decision theory (e.g., Savage acts) to model unobservable outcomes. *N (8/10)*: Limited work on trade without verification.  
     - **Evidence shift**: New impossibility proofs in commitment games would downgrade this.

  3. **What mechanisms enforce agreements without verification?**  
     - **Defense**: Focus on *shut-down rights as the sole enforcement tool*. Model as a repeated game with asymmetric information and costly termination. *I (8/10)*: Enforcement is the binding constraint for AI cases. *T (6/10)*: Builds on contract theory (e.g., Innes 1990) with moral preferences. *N (9/10)*: Rarely studied in moral trade contexts.  
     - **Dependence**: Requires Q2 to define "gains" being enforced.

  4. **How do agents bargain under deep moral uncertainty?**  
     - **Defense**: Bargaining with incommensurable values (e.g., totalist vs. averagist utilitarianism). *I (7/10)*: Necessary for scaling. *T (5/10)*: Use axiomatic bargaining (Nash, Kalai-Smorodinsky) with uncertainty sets. *N (6/10)*: Some related work (e.g., Barrett/Santorio) but not in trade contexts.  
     - **Defund if**: Q1 fails (then bargaining is moot).

  5. **Can trade reduce existential risk from misaligned AI?**  
     - **Defense**: *Importance (9/10)* for motivating the agenda, but *downstream*. Model trade-offs (e.g., "Allow AI to pursue its goal in domain X if it avoids catastrophe in Y"). *T (4/10)*: Requires solutions to Q1–3; high speculativeness. *N (5/10)*: X-risk studies often ignore trade dynamics.  
     - **Tractability cap**: Only fund if Q1–3 show promise.

  ### Defunded Areas
  - **Empirical mapping of "trade-compatible" moral differences**: *Reason*: Intractable without data; tools are analytical.  
  - **Bargaining under full value uncertainty**: *Reason*: Too vague without Q1/Q4 foundations; intractable in 2 years.  
  - **Philosophical objections to moral compromise**: *Reason*: Not load-bearing—if trade *works*, actors won’t care about purist objections.

  ### Evidence Triggers for Re-Ranking
  - **↑ Q1** if new moral uncertainty frameworks (e.g., context-dependent weights) enable cleaner trade models.  
  - **↓ Q3** if game-theoretic work shows shut-down rights are strictly inferior to verification.  
  - **↑ Q5** if AI alignment results reveal concrete overlap zones (e.g., in AI goal specifications).

  ### Why This Order?
  The agenda prioritizes **validating the core mechanism** (Q1) and **addressing the hard constraint** of unverifiability (Q2–3) before scalability (Q4) or applications (Q5). Q1 is the linchpin: if intrapersonal trade adds nothing over standard moral uncertainty, the project fails immediately. Q2–3 are uniquely critical for the AI use case—without enforcement or gains under ignorance, trade is useless. Tractability declines down the list as dependence on prior results increases. Neglect is high throughout due to the niche framing.

  \answer{Intrapersonal trade vs. dominance under uncertainty}
