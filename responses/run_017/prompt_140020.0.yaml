  Marcus's move (2) makes a valid point about relativity not implying indeterminacy. However, he overlooks how narrative systems fundamentally differ from physical systems in their boundaries and composition rules - which Elena will exploit next.

  In move (3), Elena effectively highlights the composition disanalogy: unlike physical parts, narrative perspectives don't aggregate deterministically. Her "veto problem" insight about repudiation being normative rather than quantitative is particularly strong.

  Marcus's move (4) cleverly reframes the veto problem as a feature, linking first-person authority to what makes selves distinct from material objects. But he seems to sidestep Elena's composition challenge, which remains unaddressed.

