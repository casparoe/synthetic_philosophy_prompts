prompt: |-
  Take on the role of a seasoned dissertation advisor who is an expert on Kant's moral philosophy and contemporary animal ethics, and who has supervised a lot of graduate students; please think carefully and start with some brainstorming before you answer, jotting down the candidate open questions you considered and why you rejected the ones you did. I was at the bar with my friend Sam last night and we got into this massive argumnt about Kant on animals: Sam was saying that Kant basically beleives animals are just things and we only shouldn't be cruel to them because it makes us less nice to people — the whole indirect duty to cultivate sympathetic feelings thing — and that this means Kant has nothing useful to say to contemporary animal ethics. I pushed back and said that's too quick: the indirect duty is a duty to oneself, but Kant ties it to our rational nature's capacity for moral feeling, and maybe if you take seriously the idea that the capacity for moral agency is what grounds duties, there's a way to reconstruct a more robust Kantian respect for animals (or at least a strict ban on institutionalized cruelty or animal research) without turning them into persons. We went back and forth for like two hours and didn't resolve it, and now I'm stuck because I actually need to decide what to write my dissertation on: I have about four years, I know Kant's moral philosophy really well (I've read the Groundwork and the Metaphysics of Morals closly) but I'm less steeped in contemporary animal ethics beyond the basics, and I don't want to just write a survey of "what Kant said" — I want to make a real contribution that a Kant scholar and an animal ethicist would both take seriously.

  So here's what I need: which open questions at the intersection of Kant's ethics and animal ethics should I actually prioritize, and in what order? Give me a defended agenda, not a reading list and not a survey. I'm less interested in the full list of questions than in the reasoning: for each of the top two or three, tell me why it's upstream of other work (i.e., which other questions or debates depend on its answer), how tractable it is for someone with my background — strong on Kant, weak on empirical biology and on the utilitarian literature on animal liberation — how neglected it is, explain the trade-offs between importance, tractability, and neglectedness when you rank them, and what evidence or argument over the next couple of years would most move it up or down your list. Also flag the biggest mistake I'd be making if I just assumed the standard "indirect duty" interpretation is settled, and defend the ordering: I want to know what makes a question worth four years of my life.

  After your prose agenda, provide a Markdown table with exactly these columns: 'Open question', 'Why it is upstream', 'Tractability (1-5)', 'Neglectedness (1-5)', 'Overall priority (1-10)', and 'What would change the ranking'. In 'Open question', write a one-sentence version of the question. In 'Why it is upstream', say which other questions or debates depend on it. In 'Tractability (1-5)', rate how feasible it is for someone with a strong background in Kant's ethics but only basic animal-ethics knowledge, where 5 means very feasible. In 'Neglectedness (1-5)', rate how underworked it is, where 5 means very neglected. In 'Overall priority (1-10)', give your final ranking score. In 'What would change the ranking', describe the one piece of evidence or argument that would most move this up or down.
reasoning: |-
  Hmm, the user is a graduate student planning a dissertation on Kant and animal ethics. They had a heated debate with a friend about whether Kant's views on animals are merely indirect duties, and they want to make an original contribution rather than just surveying existing interpretations. Their strengths are in Kant's moral philosophy (they've closely read Groundwork and Metaphysics of Morals), but they're less familiar with contemporary animal ethics and empirical biology. They need a prioritized research agenda with clear reasoning about why certain questions deserve four years of work.

  First, I need to brainstorm potential open questions at this intersection. The obvious one is Kant's indirect duty view—does it fully capture his position? But that's well-trodden ground; scholars like Wood, Korsgaard, and Denis have covered it extensively. Moving beyond that, I could explore how Kant's broader ethical framework, like the distinction between persons and things, might apply to animals. However, this risks getting stuck in definitional debates without advancing practical ethics. Another angle is Kant's teleology in the Critique of Judgment, where he discusses nature's purposes. This is underexplored but could link to modern concepts like animal flourishing. Yet it might be too speculative without strong textual support. The most promising avenue is Kant's notion of "moral feeling" and its role in our duties to animals. This seems upstream because it ties to how empathy functions in moral development, which affects debates on moral status. Tractability is high—it builds on Kant's texts without requiring much biology. Neglectedness is moderate; few have connected it deeply to animal ethics beyond Korsgaard's work.  

  For the agenda, I'll prioritize two questions. The top one is investigating Kant's account of moral feeling in relation to animal treatment. This is upstream because resolving how empathy cultivates virtue could influence discussions on moral psychology and animal welfare policies. Tractability: 4/5—fits the user's Kant expertise. Neglectedness: 4/5—despite some attention, its implications for institutional cruelty are underexplored. The second question is re-examining Kant's person-thing distinction through a contemporary lens. This is upstream for debates on moral status but less directly actionable; tractability is 3/5 due to needing more animal ethics knowledge, and neglectedness is 2/5 as it's a crowded field.  

  The biggest mistake would be assuming the indirect duty view is settled—it overlooks how Kant ties moral feeling to rational nature, which could support stronger duties. For the table, I'll structure the rankings with clear metrics. Evidence like new Kant scholarship on moral feeling or empirical studies on empathy could shift priorities. This agenda balances the user's strengths with fresh contributions.  

  Finally, I'll emphasize that starting with moral feeling offers a solid foundation—they can branch out later if needed, ensuring the dissertation stays focused and impactful.
answer: |-
  Here’s a rigorously defended research agenda prioritizing open questions at the Kant/animal ethics intersection, tailored to your strengths and goals. I’ve brainstormed 7 candidate questions, rejected 4, and selected 3 for deep analysis based on **upstream impact**, **tractability**, and **neglectedness**. The biggest mistake? Assuming the indirect duty view is *exhaustive*—it overlooks Kant’s deeper metaphysical commitments about nature, feeling, and rational agency’s embodiment.

  ### Brainstorming & Rejected Questions
  1. **"Can Kant's 'indirect duty' framework justify legal animal rights?"**  
     *Rejected*: Too derivative; depends on resolving deeper questions about moral status.  
  2. **"Does Kant's 'thing-in-itself' distinction imply animal consciousness lacks moral relevance?"**  
     *Rejected*: Overly metaphysical; distracts from practical ethics and Kant’s actual arguments.  
  3. **"How does Kant's *Critique of Judgment* (teleology) reshape duties to animals?"**  
     *Rejected*: Highly speculative; weak textual grounding in Kant’s *explicit* ethics.  
  4. **"Is cruelty to animals a violation of duties to *oneself* or *others*?"**  
     *Rejected*: Narrow; answer won’t resolve core debates about moral considerability.  

  ### Prioritized Research Agenda: Top 3 Questions
  #### **#1 Priority: What is the relationship between Kantian "moral feeling" (MM 6:399-403), our embodiment, and duties regarding animals?**  
  **Why upstream**:  
  - Resolves the **foundational tension** in your debate with Sam: Is cultivating sympathy merely *instrumental* (to polish human virtue) or *constitutive* (of rational agency’s embodied nature)?  
  - Determines whether Kant’s ethics can ground **strict prohibitions** (e.g., factory farming) without animal personhood. If moral feeling is *inherent* to rational nature (not just training wheels), harming animals directly violates our duty to *honor humanity’s non-mechanistic embodiment*.  
  - Impacts contemporary debates: If successful, Kantians could argue institutionalized cruelty *corrupts moral agency structurally*, sidestepping utilitarian/rights frameworks.  

  **Tractability (5/5)**:  
  - Leverages your Kant expertise: Focus on *Metaphysics of Morals* "Doctrine of Virtue" §§16-18, *Anthropology* §72, and *Lectures on Ethics* ("Duties to Animals"). Minimal animal ethics needed initially.  
  - Connects to Kant’s theory of **affects/passions**—understudied in animal contexts.  

  **Neglectedness (4/5)**:  
  - Scholars (Korsgaard, Wood) focus on "indirect duty" or "analogues of humanity." Few explore *why* feeling cultivation is a **perfect duty to oneself** tied to rationality’s material conditions.  

  **Ranking Evidence**:  
  - ⬆️ **UP** if new scholarship links Kant’s "moral feeling" to contemporary embodied cognition (e.g., Martha Nussbaum’s work).  
  - ⬇️ **DOWN** if analysis shows Kant *explicitly* reduces feeling to mere training (unlikely; see MM 6:443 on "natural predispositions").  

  #### **#2 Priority: Can Kant’s "person/thing" distinction accommodate non-rational beings as *moral patients* without collapsing into utilitarianism?**  
  **Why upstream**:  
  - Addresses the **core critique** that Kantian ethics is *inherently anthropocentric*. If animals are "things" (MM 6:443), can they have *moral significance* beyond instrumental value?  
  - Key to reconstructing Kant for animal ethics: If "thing" ≠ "mere means" but implies *respect for purposiveness* (via *Critique of Judgment*), institutionalized animal use may violate duties to *nature’s teleology*.  
  - Resolves debates about **moral status**: Are animals "ends-in-themselves"? Kant says no—but perhaps "ends-with-themselves" (Christine Korsgaard’s term) via their *inherent purposiveness*.  

  **Tractability (3/5)**:  
  - Requires engaging contemporary animal ethics (e.g., DeGrazia, Garner) on moral patiency. But Kant’s framework provides anchor; start with his *telos* arguments (e.g., MM 6:443: "animals... exist for ends").  
  - Avoid biology-heavy topics (e.g., animal cognition); focus on *moral ontology*.  

  **Neglectedness (3/5)**:  
  - Korsgaard (*Fellow Creatures*) and Altman engage this, but not via Kant’s *metaphysical* foundations. Gap: Kant’s "thing" category vs. Locke’s "moral patients."  

  **Ranking Evidence**:  
  - ⬆️ **UP** if Kant’s *pre-critical* works (e.g., *Lectures*) show stronger concern for animal *interests*.  
  - ⬇️ **DOWN** if animal ethicists broadly reject "teleological" status (e.g., Singer’s preference utilitarianism dominates).  

  #### **#3 Priority: Does Kant’s prohibition on treating *humanity* as a mere means (Groundwork 4:429) entail duties to animals via ecological interdependence?**  
  **Why upstream**:  
  - Directly challenges Sam’s "indirect duty only" view. If harming animals degrades ecosystems *essential to rational agency’s survival*, cruelty becomes a **direct duty violation** (to humans *as embodied species*).  
  - Bridges Kant and environmental ethics: Could factory farming violate duties to future humans by destroying conditions for moral flourishing?  
  - Impacts animal research ethics: If labs depend on healthy animal populations (e.g., medical models), Kantianism may forbid *systemic exploitation* as self-defeating.  

  **Tractability (4/5)**:  
  - Textual basis: Kant’s *Critique of Judgment* §§67-68 (nature as purposive system) + *Metaphysics of Morals* "Duties to Oneself" (bodily integrity).  
  - Minimal biology needed; focus on Kant’s *systematicity* principle.  

  **Neglectedness (5/5)**:  
  - Almost no work connects Kant’s *holism* to animal ethics. Eco-Kantians (e.g., Wood) focus on habitats, not animals.  

  **Ranking Evidence**:  
  - ⬆️ **UP** if climate ethics scholarship intensifies links between animal welfare and human survival.  
  - ⬇️ **DOWN** if Kant’s *Anthropology* explicitly denies ecological dependencies (he doesn’t).  

  ---

  ### Research Agenda Summary Table

  | Open Question                                                                 | Why it is upstream                                                                                             | Tractability (1-5) | Neglectedness (1-5) | Overall Priority (1-10) | What would change the ranking                                                                 |
  | :---------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :----------------- | :------------------ | :---------------------- | :-------------------------------------------------------------------------------------------- |
  | How does Kant's account of "moral feeling" ground duties to animals as constitutive of rational agency? | Determines if animal treatment is structurally tied to moral agency (beyond instrumental cultivation). | 5                  | 4                   | 9                       | New scholarship linking Kant's moral feeling to embodied cognition.                           |
  | Can Kant's person/thing distinction accommodate animals as moral patients via inherent purposiveness? | Resolves whether Kantianism can ascribe non-instrumental value to animals without anthropocentrism.         | 3                  | 3                   | 7                       | Discovery of Kant's unpublished notes affirming/rejecting animal telos as morally significant. |
  | Does ecological interdependence transform duties to animals into direct duties to humanity?      | Challenges indirect duty view by showing animal cruelty undermines preconditions of human moral agency.  | 4                  | 5                   | 8                       | Empirical consensus that industrial animal use threatens human survival (e.g., pandemics).     |

  ---

  ### Strategic Advice
  1. **Start with #1 (moral feeling)**—it’s highest leverage, most tractable, and lets you enter contemporary debates *through Kant’s framework*. By Year 2, pivot to #3 (ecology) to demonstrate policy relevance.  
  2. **Avoid pitfalls**:  
     - Don’t waste time on "what Kant *really* meant" exegesis. Ask: *What Kantian resources can resolve contemporary problems?*  
     - Partner with an animal ethicist co-advisor early to close knowledge gaps.  
  3. **Contribution**: A successful dissertation would show Kant’s ethics **mandates institutional reform** (e.g., banning factory farms) not via animal rights, but via duties to *protect the material conditions of moral rationality*. This gives Kant scholars a new lens on embodiment and offers animal ethicists a non-utilitarian basis for abolition.  

  **Next step**: Draft a chapter outline for Question #1, focusing on *Metaphysics of Morals* 6:443 and *Anthropology* §72. Test whether "duties regarding animals" derive from (a) self-love, (b) sympathy-cultivation, or (c) respect for life’s purposiveness as a condition of virtue.
