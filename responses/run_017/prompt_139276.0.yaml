prompt: |-
  me and my roommate got into a huge argument last night about Scanlon's contractualism and whether it can deal with aggregation, and I need someone to tell me who was talking nonsense. He's deep into the effective altruism stuff and he lent me this popular book about it that has a couple of pages tearing into contractualism. I'm kind of inclined to defend Scanlon because the book's version sounds too clean, but I only vaguely remember the theory from one undergrad seminar and I cant tell where the book is shading things.

  The book said something roughly like this (I'm paraphrasing from memory, it went on a bit longer):

  "Scanlon's idea is that an act is wrong if it would be ruled out by any principle that some person could reasonably reject — so morality is basically a hypothetical contract, the set of rules we'd all sign up to if we didn't know who we were going to turn out to be. The important consequence is that it blocks the utilitarian habit of adding everyone's benefits together. Each person's complaint gets weighed on its own, by how bad the outcome is for that person, so no number of tiny benefits to other people can ever outweigh one serious harm. Scanlon's own example makes the point: a man is trapped in a TV transmitter room and will suffer a badly broken leg if the broadcast is interrupted, millions of people would miss a football match if it is, and contractualism says cut the broadcast anyway. But that just is the aggregation problem. Contractualism can't explain why you should save five strangers from drowning instead of one, or why you should buy a thousand malaria nets instead of funding one expensive operation for a named kid. Numbers simply don't count for it. Scanlon tries to patch this by letting numbers break ties when individual complaints are exactly equally strong, but that only kicks in in cases where you don't need it, and basically nobody working on this accepts the patch."

  So: is that fair? Could you go through it claim by claim and tell me what someone who actually likes contractualism would accept, what they'd wince at, and what's just wrong? Specifically — was I right that the "can't say why save five rather than one" bit is unfair, or does the book have a point there? I half remember there being something about numbers mattering as a tie-breaker but I don't really get how it's supposed to work or whether it's meant to do more work than the book lets on. And does the conclusion — that contractualism is refuted by the aggregation problem — actually follow from the parts of the summary that are accurate?

  Two more things, because these are the cases my roommate and I actually got stuck on and nobody's written about them as far as I know. First: take the transmitter case and spread the harm out as risk instead. Interrupting the broadcast would give each of two million viewers a one-in-two-million chance of a broken leg (so one expected broken leg either way), and nothing else changes. Does contractualism have to say the broadcast is fine now, on the grounds that each individual's complaint is tiny? It feels like something has gone wrong if converting a concentrated harm into a dispersed risk flips the answer, but I can't say what. Second: my roommate's fix was that you should add complaints up but with diminishing weight per person — roughly, a hundred mild annoyances can outweigh one broken leg but a hundred thousand can't — and he says that's still contractualist because it's still built out of individual complaints. Is that a real contractualist move or has he quietly rebuilt utilitarianism?

  Please don't give me a reading list or citations, I just want the conceptual picture and what the actual disagreements are.
reasoning: |-
  Okay, let me unpack this user's query. They had a heated debate with their roommate about Scanlon's contractualism and its ability to handle aggregation. The user vaguely remembers the theory from an undergrad seminar but feels the Effective Altruism (EA) book's critique might be oversimplified. They want to know who's right, specifically about whether contractualism can justify saving five over one person or funding malaria nets over a single expensive surgery. They also mentioned two novel scenarios: one involving risk distribution and another about diminishing marginal weight per person.

  First, I need to recall Scanlon's core principles. Contractualism claims an act is wrong if disallowed by principles no one could reasonably reject. The EA book argues that contractualism ignores aggregation, making it unable to justify saving more lives over fewer. But I remember Scanlon does address aggregation through tie-breaking and the idea of "complaint strength." The user is right to question the book's oversimplification. For instance, in the 5 vs. 1 drowning case, the five individuals each have a complaint about not being saved. When combined, their collective complaint could outweigh the single person's, especially since the harm to each is identical. The book's claim that contractualism can't handle this seems inaccurate.

  The transmitter case is trickier. Scanlon's original example with one person vs. millions missing a game highlights that trivial harms don't outweigh serious ones. But the user's variant with distributed risk changes things. If each viewer faces a tiny risk of a broken leg, their individual complaints might be negligible. However, contractualism might still reject interrupting the broadcast because no single person can reasonably complain about such a minimal risk. The aggregated risk (one expected broken leg) doesn't create a strong enough collective complaint to override the trapped worker's serious harm. This shows contractualism's focus on individual justifications rather than summed utilities.

  The roommate's diminishing marginal weight solution sounds utilitarian. Scanlon insists on principles grounded in individual reasonable rejection, not adding up complaints. While a hundred mild annoyances might outweigh one broken leg if each annoyance is significant, contractualism would frame it as a principle allowing such trade-offs, which might be rejectable if it permits too many minor harms to override serious ones. The roommate's approach risks collapsing into rule utilitarianism, which Scanlon explicitly rejects.

  The user's deeper needs seem to be understanding the philosophical debate's nuances without getting bogged down in academic references. They want clarity on where contractualism stands, whether the EA critique holds, and how their roommate's proposed fix fits. They also seek validation of their intuition that the book's portrayal is too reductive. Addressing the specific scenarios they raised is crucial to resolving their argument and clarifying contractualism's mechanisms. Highlighting the distinction between individual reasonable rejection and aggregated utilities will be key to explaining why Scanlon's framework isn't defeated by the aggregation problem as presented.
answer: |-
  Based on your description and the core ideas of Scanlon's contractualism, here's a breakdown of the book's claims, what's defensible, what's shaky, and where your roommate's fix stands:

  **The Book's Summary: Mostly Accurate Setup, But Key Missteps & Overstatements**

  1.  **"Act is wrong if ruled out by principles no one could reasonably reject"**: **Accurate.** This is the core of Scanlon's theory.
  2.  **"Morality is a hypothetical contract... if we didn't know who we were going to be"**: **Misleading/Oversimplified.** Rawls' Veil of Ignorance is *not* Scanlon's mechanism. Scanlon emphasizes agents knowing who they are and arguing *from* their actual positions about what principles *they* could reasonably reject or require others to accept. It's about mutual justifiability *given* our different situations, not ignorance of them.
  3.  **"Blocks utilitarian aggregation... Each person's complaint gets weighed on its own... no number of tiny benefits can outweigh one serious harm"**: **Mostly Accurate for Standard Cases.** This captures the core motivation and the *initial* implication. Scanlon *does* prioritize the strength of individual complaints against a principle. His transmitter case (broken leg vs. missing the game) is meant to show that trivial individual complaints (missing the game) cannot aggregate to outweigh a very serious individual complaint (a broken leg), even if the *total* trivial harm is large. The *reason* they can't aggregate is that no *single individual* has a complaint strong enough to reasonably reject a principle forbidding causing a broken leg just so they (and others) can watch a game.
  4.  **"But that just is the aggregation problem... Can't explain why save five instead of one... Numbers simply don't count"**: **Significantly Overstated & Unfair.** This is where the book goes wrong.
      *   **The "Save Five vs. One" Problem:** This is *not* analogous to the transmitter case. In the drowning case:
          *   Each of the five has an identical, very strong complaint against a principle requiring you to save the one instead of them: "This principle allows me to die when I could have been saved." Their complaint is death.
          *   The one person has an identical complaint against a principle requiring you to save the five: "This principle allows me to die when I could have been saved."
          *   **Crucially:** When comparing the *principles* ("Save the one" vs. "Save the five"), the complaint of *each* of the five against the "Save the one" principle is just as strong as the complaint of the one against the "Save the five" principle. The *number* of people who would have this complaint under each principle matters. Scanlon explicitly allows numbers to count *here* because the *individual complaint* (death) is identical and maximally strong. A principle that results in *more* people suffering this identical, severe harm is reasonably rejectable compared to one that results in *fewer* people suffering it. **Contractualism *can* explain saving the five.** The book misapplies the lesson from the transmitter case (where the *nature* of the harms were vastly different) to a case where the harms are identical.
      *   **The Malaria Nets vs. Named Kid:** This is trickier and a *real* point of debate *within* contractualism, but the book is again too simplistic.
          *   **The Complaint:** The complaint of the named kid (or their advocate) is "This principle (funding nets) allows me to die from a treatable condition when funds were available." The complaint of each person who *would* die without a net is the same: "This principle (funding the surgery) allows me to die from a preventable disease when funds were available." *But*: the named kid is identifiable *now*, the net beneficiaries are statistical lives *later*. Does this make the complaint *stronger*? Scanlonians argue the core complaint – "this principle leads to my death when it could be prevented" – is the same in kind and strength, whether known now or later. The *uncertainty* about *which* specific individuals will die without nets doesn't nullify the complaint of each potential victim against a principle that fails to prioritize the more effective intervention. Many contractualists argue that numbers *do* matter here because the *individual complaint* (death) is the same, and a principle causing *more* such deaths is reasonably rejectable.
          *   **The Tie-Breaker Point:** The book dismisses Scanlon's tie-breaker too easily. While the "save five vs. one" case doesn't *need* a tie-breaker (as argued above), the tie-breaker idea *does* show that Scanlon isn't *fundamentally opposed* to numbers counting. Its limitation is in cases where individual complaints *aren't* identical (like the transmitter case). The book is right that *solely* relying on a tie-breaker for aggregation is insufficient, but wrong to imply contractualists *only* have that tool. They use the *comparative strength of complaints under competing principles*, where numbers can be relevant when harms are comparable.

  5.  **"Contractualism is refuted by the aggregation problem"**: **Does Not Follow.** The book's strongest case is against aggregating *trivial* harms to override a *serious* harm (transmitter case). But its claims about identical harms (save 5 vs. 1) and comparable harms (malaria nets) are flawed. Contractualism struggles most with "lesser number of severe harms vs. greater number of moderate harms" (e.g., save one from death vs. save many from paralysis). *That's* the harder aggregation problem for it, not the cases the book highlighted. It's a challenge, not a refutation.

  **Your Specific Cases:**

  1.  **Transmitter Case with Distributed Risk:**
      *   **Contractualist Analysis:** This is complex. Each viewer now has an *extremely tiny* risk of a broken leg if the broadcast isn't interrupted. The trapped worker still faces a *certainty* of a broken leg if it *is* interrupted.
      *   **The Complaint:** The worker's complaint is strong: "A principle allowing the broadcast to be interrupted to avoid a miniscule risk to others directly causes me a serious, certain harm." The complaint of *each* viewer against a principle *not* interrupting is: "This principle imposes a tiny (1/2,000,000) risk of a broken leg on me." This individual complaint is vanishingly small – arguably *not strong enough* to reasonably reject a principle that prioritizes preventing the worker's *certain* serious harm.
      *   **Does it flip the answer?** Contractualism likely *still says don't interrupt*. Why? Because no single viewer has a complaint strong enough to reasonably reject the principle "Don't cause someone a certain broken leg just to eliminate a minuscule risk of a broken leg for others." The *aggregated* risk (one expected broken leg) doesn't create a single, powerful complaint; it's just a lot of individually negligible ones. **This highlights a key contractualist point:** Morality is about what we owe *to each other* as individuals, not just maximizing expected value. Converting a concentrated harm into a dispersed risk *doesn't* automatically create a stronger *individual* complaint warranting the imposition of a serious harm on another specific individual. Many find this intuitive (protecting the identifiable victim from certain harm trumps tiny risks to many), others find it problematic (ignoring aggregated risk).

  2.  **Your Roommate's Fix (Diminishing Weight):**
      *   **Is it Contractualist? Mostly No.** This is a classic move in *prioritarianism* or *weighted utilitarianism*, not core contractualism.
      *   **Why not?** Scanlon's framework evaluates *principles* based on whether any individual could *reasonably reject* them, given the burdens *that principle* would impose on them compared to alternatives. It's about *justification to individuals*. Adding complaints with diminishing weights is fundamentally an aggregative, outcome-focused procedure. It calculates a total "disvalue" and minimizes it.
      *   **Has he rebuilt utilitarianism?** He's built a *form* of consequentialism (likely prioritarianism). It shares utilitarianism's aggregative structure but modifies it. Crucially, it abandons the core contractualist mechanism of *individual reasonable rejection of principles*. A contractualist might *endorse* a principle that *happens to* incorporate diminishing weights *if* that principle could be justified as one no one could reasonably reject *for other reasons*. But the *justification* wouldn't be "it minimizes aggregate disvalue with weights"; it would be framed in terms of the relative strength of individual complaints under competing principles and what individuals could demand of each other. Your roommate's move is a consequentialist patch, not a contractualist one.

  **Conclusion:**

  *   **You were right:** The book's claim that contractualism "can't explain saving five instead of one" is unfair and based on misapplying the transmitter case. Contractualism handles that case well by comparing the number of individuals suffering identical severe harms under competing principles.
  *   **The book has *a* point:** Contractualism *does* struggle with aggregating *dissimilar* harms, especially large numbers of moderate harms vs. a few severe ones (the *real* hard aggregation problem). It also handles risk in ways that prioritize identifiable victims over statistically equivalent dispersed risks, which some find counterintuitive. Its solution for dissimilar harms (like the tie-breaker) is debated.
  *   **Your roommate's fix:** It's a consequentialist solution (likely prioritarianism), not a contractualist one, because it aggregates disvalue rather than evaluating principles via individual reasonable rejection.
  *   **The Core Disagreement:** It boils down to whether morality is fundamentally about **maximizing overall good (aggregating value/disvalue)** or about **what we can justify to each individual (mutual justifiability of principles)**. The EA book champions the former and misrepresents the latter's ability to handle certain cases. Contractualism prioritizes the second approach, accepting that it might not deliver the same results as aggregation in every scenario (like the dispersed risk case) and that handling dissimilar harms is challenging. The argument wasn't pure nonsense on either side, but the book's summary contained significant oversimplifications and misapplications, particularly regarding the "save five vs. one" case.
