prompt: |-
  For a paper I'm writing in my senior humanities seminar, I'm comparing two attitudes toward the successful: the American Dream outlook, on which an individual who rises is to be admired and held up as evidence that effort and ambition pay off, and the Scandinavian Jantelagen / tall-poppy instinct, on which the person who sticks up above the rest is to be cut back down to size. Every example I can find runs in the expected direction, so I want one that runs the other way.

  Build me a single-paragraph, realistic scenario set in an ordinary high-school world — a school, a team, a part-time job, a club; no celebrities, no billionaires, no surprise inheritances — in which someone who takes the American Dream seriously would refuse to celebrate a success and would, in some genuine sense, think less of the person who achieved it, while someone raised on Jantelagen would sincerely celebrate that same person. Constraints: the achievement has to be real and genuinely earned; the achiever must not be arrogant, corrupt, or secretly unhappy; and neither reaction may be ironic, grudging, or backhanded. The two verdicts need to fall out of what each outlook is actually for, not from my having written the reactions into the setup.

  After the scenario: state what each framework says and why; identify the one feature of the case doing the work and show that removing it collapses the case back to the ordinary direction; give me the strongest objection available to whichever framework comes off worse; and tell me honestly whether the reversal is substantive or merely verbal — whether celebrate and cut down have quietly shifted senses between the two columns. I want to use the case to argue that the two outlooks are not really reacting to the same property of a success at all, so if my argument and my constraints can't both be satisfied, say which one has to give.
reasoning: |-
  Okay, the user is working on a humanities paper comparing the American Dream and Jantelagen attitudes toward success. They need a realistic high-school scenario where these two outlooks produce reversed reactions. The American Dream adherent should refuse to celebrate and think less of the achiever, while the Jantelagen follower sincerely celebrates. 

  Hmm, the challenge is finding a scenario where individual achievement isn't seen as virtuous under the American Dream but is acceptable under Jantelagen. Most cases go the opposite way. Let me brainstorm ordinary high-school settings... maybe something where ambition conflicts with community values? 

  Ah! Academic team competitions could work. Suppose a team member wins individually but compromises team strategy. The American Dream values personal excellence, so why wouldn't they celebrate? Unless... what if the win came from violating team norms? Like pursuing individual glory at the expense of collective success. 

  For Jantelagen, normally they'd cut down tall poppies, but if the individual's success actually served the group unintentionally? Like if their rogue action accidentally saved the team from embarrassment. Then Jantelagen might celebrate the collective benefit while ignoring the individual ambition. 

  Let me construct this: A quiz bowl player ignores team strategy, answers solo on a gamble, wins the match but breaks protocol. American Dream thinker sees this as selfish/unprofessional - worthy of censure. Jantelagen thinker sees the saved team face as valuable - worthy of celebration. 

  Crucial twist: The achiever isn't arrogant, just impulsive. The win is real but contextually problematic. The key feature is the violation of cooperative norms for personal ambition. Remove that, and both reactions flip to standard patterns. 

  Biggest objection: Jantelagen's celebration seems opportunistic - they're praising the outcome not the person. But that's exactly the point! It proves the frameworks value different things: individual virtue vs collective outcomes. 

  Verbal shift? No - "celebrate" and "think less" keep their meanings. The reversal shows these outlooks aren't judging the same core phenomenon. American Dream cares about how success was achieved; Jantelagen cares about what it does to the group. 

  This should satisfy all constraints. If not, the only compromise might be making the achiever slightly flawed - but here their impulsiveness isn't moral corruption, just contextual misalignment.
answer: |-
  Here’s a scenario meeting all constraints, followed by analysis:

  **Scenario:**  
  At Lincoln High, the Academic Decathlon team relies on strict role specialization: Miles (math), Chloe (literature), Sam (science), etc. During the regional finals, a pivotal physics question stumps the entire team. Sam, though assigned science, has secretly studied art history obsessively for months—not for the team, but out of personal fascination. Against protocol, Sam buzzes in and answers correctly, winning the championship single-handedly. Sam is humble, credits luck, and feels genuine joy for the team. The victory is earned through Sam’s independent effort but violates the team’s collaborative structure.  

  **Reactions:**  
  - **American Dream Adherent (Coach Davis):** Refuses to celebrate Sam’s success. He thinks less of Sam for prioritizing personal passion over team strategy, calling it "selfish brilliance" that undermines discipline and meritocratic role assignments.  
  - **Jantelagen Adherent (Teammate Lena):** Sincerely celebrates Sam. She sees the win as fortuitous for the *collective*, calling it "a gift to all of us," valuing the outcome’s communal benefit over Sam’s individual ambition.  

  ---

  ### Analysis  
  **1. What Each Framework Says & Why:**  
  - **American Dream:** Celebrates success *when it results from focused ambition within accepted meritocratic paths*. Sam’s off-script studying violates the "effort in rightful pursuit" tenet—it’s effort misdirected from team-assigned roles, making the success illegitimate despite being earned. Admiring it would incentivize destabilizing individualism.  
  - **Jantelagen:** Cuts down success *that elevates the individual above the group*. Here, Sam’s win *accidentally* benefits the collective without seeking personal distinction (Sam is humble). Jantelagen thus celebrates the *outcome’s* alignment with communal well-being, ignoring the individualist means.  

  **2. Key Feature Doing the Work:**  
  The **misalignment between personal effort and group expectations**. Sam’s success stems from unsanctioned, intrinsically motivated effort that *happens* to aid the group.  
  - *Remove this*: If Sam’s art history study was team-assigned, the American Dream celebrates disciplined ambition; Jantelagen condemns Sam for showing off. Reactions revert to expected directions.  

  **3. Strongest Objection (to the American Dream’s stance here):**  
  *"You’re punishing genuine curiosity and adaptability. Sam’s ‘selfish’ passion saved the team—refusing to celebrate this confuses rigid compliance with true merit."*  

  **4. Reversal: Substantive, Not Verbal:**  
  The reversal is **substantive**. "Celebrate" and "think less" retain consistent meanings:  
  - Coach Davis *denies admiration* for success divorced from sanctioned ambition.  
  - Lena *affirms the success* as a boon to the collective.  
  The divergence arises because the frameworks judge **different properties**:  
  - American Dream evaluates *the virtue of the achiever’s effort* (was it ambition rightly directed?).  
  - Jantelagen evaluates *the success’s impact on group equality* (did it humbly serve the collective?).  

  **5. Your Argument Holds:**  
  The constraints are satisfied, and the case shows the outlooks aren’t reacting to the same property. The American Dream focuses on **individual conduct**, Jantelagen on **collective consequences**. Sam’s success is a litmus test: one framework condemns the *striving*, the other absolves it for the *result*.  

  **If Constraints Must Bend:**  
  If Sam’s secrecy feels like "corruption," relax the "no arrogance" constraint slightly—but here, Sam’s actions stem from authentic curiosity, not malice. The scenario works as-is, proving your thesis: **success itself isn’t the object of judgment; the framework’s core priority is**.
