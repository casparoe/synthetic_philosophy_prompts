  For the commons classification: The waste sink model fits best, but I should emphasize why the "public good protection" framing is misleading - non-excludability applies to harm, not protection. This affects remedies: trade sanctions become crucial where exclusion fails. 

  On actor mapping: Must highlight nested games. States faced asymmetric costs (tropical vs high-latitude, industrialized vs developing), while firms played patent games across jurisdictions. Consumers were price-takers but created market pressure - interesting how refrigeration demand proved inelastic enough to absorb substitute costs.

  Delayed feedback is where their insight shines. Standard models assume: 
  - Real-time resource depletion visibility 
  - Localized harm 
  - User ability to connect action to outcome
  Ostrom's principles all require these. The ozone regime's scientific panels essentially created artificial "feedback" through assessment cycles. The built-in ratchet mechanism (Art 2B) was genius - it turned slow variables into actionable triggers. But is this generalizable? Only for pollutants where science achieves consensus; climate attribution is messier.

  The producer concentration point is thorny. DuPont's patent portfolio changes everything - this resembles a Kuhnian paradigm shift where incumbents control the new technology. We must admit this transforms incentives: early compliance became profitable rent-seeking. Still, the treaty created the market certainty for that profit, so collective action enabled it.

  Transfer test honesty is crucial. The ozone success relied on: 
  - Substitutes being technically separable (unlike CO2 from energy) 
  - Harm attribution being clear (Antarctic hole ≠ diffuse warming) 
  - Victims including powerful nations (skin cancer in rich countries)
  None apply cleanly to climate. Theory is silent on scale - CO2 involves orders-of-magnitude more actors. I'll note polycentric governance experiments but avoid false optimism.

  Their pedagogy goal matters: Using ozone avoids pastoral romanticism and shows environmental governance can work. But we mustn't let it become a "just replicate this" template. The concluding contrast should highlight ozone as a best-case scenario that illuminates why climate is harder, not a blueprint.
answer: |-
  Here’s a structured analysis of the ozone depletion case through commons theory, addressing your queries systematically:

  ---

  ### **1. Commons Structure: Which Model Fits?**  
  **Verdict:** The ozone layer is best modeled as **an unowned waste sink with finite assimilative capacity**.  
  - **Why not subtractive commons?** No actor "withdraws" ozone; they degrade it by polluting the shared sink.  
  - **Why not public good?** While ozone protection *becomes* a public good, the core problem is pollution exceeding the sink's capacity (rivalry in damage).  
  - **Implications for predictions:**  
    - **Free-riders:** States/firms avoiding abatement costs while benefiting from others' cuts.  
    - **Coercion needed:** Binding treaties with sanctions (e.g., Montreal’s trade restrictions).  
    - **Remedy:** Cap pollution below sink capacity (not "provision" of a good).  
  *The choice matters:* A waste sink model predicts **non-participants as critical free-riders** (e.g., non-ratifying states), unlike a public good model where contributions focus on provision levels.

  ---

  ### **2. Actor Mapping: Options, Payoffs, and Incentives**  
  | **Actor**         | **Options**                          | **Payoffs & Constraints**                               |  
  |-------------------|--------------------------------------|---------------------------------------------------------|  
  | **States**        | Ratify/not ratify; comply/defect     | **Costs:** Higher consumer prices, industrial lobbying. **Benefits:** Avoided health/damage costs, global legitimacy. **Leverage:** Trade sanctions threat reshaped payoffs for non-parties. |  
  | **CFC Producers** (e.g., DuPont) | Resist/adapt; lobby/innovate        | **Pre-treaty:** Low-cost production → high profits. **Post-treaty:** Patent-holding firms (e.g., on HCFCs) gained market share via forced transition. Early compliance secured rents. |  
  | **Consumers**     | Accept substitutes/pay more; resist  | **Costs:** Pricer fridges/aerosols. **Benefits:** Health protection (diffuse/long-term). **Constraints:** Inelastic demand for cooling → absorbed costs. |  
  **Key dynamic:** Trade restrictions transformed a prisoner’s dilemma into **coordination around a new equilibrium** where compliance became dominant.

  ---

  ### **3. Delayed-Feedback Commons: Breaking Standard Assumptions**  
  **Standard commons theory assumes:**  
  - Immediate, visible resource degradation.  
  - Users observe marginal damage (e.g., overgrazing).  
  - Ostrom’s principles rely on this for monitoring/sanctions.  

  **Ozone’s delayed feedback disrupted this:**  
  - Damage (ozone loss) lagged emissions by decades.  
  - Harm displaced (Antarctic hole, global UV exposure ≠ emission sites).  

  **The regime’s solution:**  
  - **Scientific Assessment Panels:** Created **artificial feedback loops** by synthesizing global data into policy-relevant reports.  
  - **Built-in ratchet mechanism:** Protocol allowed tightening controls *without renegotiation* based on scientific consensus (mimicking "observable degradation").  
  - **Is this generalizable?** Yes, but requires:  
    - High scientific authority (IPCC for climate).  
    - Flexible treaty design (e.g., Paris Agreement’s NDCs).  

  ---

  ### **4. Awkward Truth: Small-Number Coordination?**  
  **Evidence for coordination over PD:**  
  - Production concentrated in 5 firms (e.g., DuPont, ICI).  
  - Substitutes were patent-controlled; phaseouts created **new profit streams** for incumbents.  
  - Early movers (e.g., US, EU) faced limited competitive disadvantage.  

  **Verdict:** The core collective action problem was **mitigated but not eliminated** by concentration:  
  - Without the treaty, firms lacked incentive to abandon cheap CFCs.  
  - Montreal created a **focal point** and **patent rents** aligned private profits with public good.  
  - Still a victory for commons theory: Shows how institutional design can **reshape incentives** even with concentrated actors.

  ---

  ### **5. Verdict & Transfer Test to CO₂**  
  **Ozone as a case for commons theory:**  
  - **Confirmation with caveats:** It validates institutional solutions to rival sink overuse, but success relied on unique factors.  
  - **Not an anomaly:** A waste sink model explains dynamics accurately.  

  **Transfer test to CO₂:**  
  | **Feature**         | **Ozone Success Factor** | **Applies to CO₂?**        | **Why?**                                  |  
  |---------------------|--------------------------|----------------------------|-------------------------------------------|  
  | **Cheap substitutes** | Available (HFCs, HCFCs) | Partially                  | Renewables cost-competitive now, but fossils entrenched. |  
  | **Producer concentration** | High (oligopoly)         | No                         | Oil/gas/coal: 1000s of firms, states.     |  
  | **Separability**     | Yes (chemical swap)      | No                         | CO₂ intrinsic to combustion; no drop-in fix. |  
  | **Harm visibility**  | High (ozone hole)        | Low                        | Climate impacts diffuse, delayed, multi-causal. |  
  | **Victim distribution** | Included rich states     | Asymmetric                 | Vulnerable states lack leverage; free-rider incentives stronger. |  
  | **Scientific attribution** | Clear, uncontested       | Contested (politically)    | Complexity fuels dissent (though robust consensus). |  

  **Where theory is silent:**  
  - **Scale:** CO₂ involves orders-of-magnitude more actors/activities.  
  - **Path dependence:** Energy systems harder to alter than refrigerants.  
  - **Equity:** North-South stakes more acute in climate.  

  ---

  ### **Conclusion**  
  The ozone case **confirms commons theory’s core insight** that binding rules + monitoring + sanctions can avert tragedy, but highlights **critical contingencies**:  
  1. **Feedback substitutes** (science panels) are essential for delayed-impact commons.  
  2. **Concentration** can lower transaction costs but isn’t necessary.  
  3. **Success for CO₂ requires:**  
     - Stronger feedback mechanisms (e.g., carbon pricing signals).  
     - Broader coalition (beyond "victim" states).  
     - Technology policies to reduce separability barriers.  
  **Ozone is a hopeful precedent but not a template**—its unique advantages made collective action easier than for climate.
