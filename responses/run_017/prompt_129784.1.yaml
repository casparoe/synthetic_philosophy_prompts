  ### Decision Tree for Higher-Order Theories of Consciousness  
  *(Fits on one side of A4; 8 branch questions, 9 leaves)*  

  **Start Here:**  
  1. **Is consciousness (phenomenal character) constituted by a representation of a mental state?**  
     - **Yes** → Go to Q2  
     - **No** → **Leaf 1: First-Order/Attentional View** (e.g., Tye, Dretske). Consciousness arises from first-order states with specific properties (e.g., attention, accessibility).  

  2. **Is the representation carried by a *distinct* higher-order state?**  
     - **Yes** → Go to Q3  
     - **No** → **Leaf 2: Self-Representational View** (e.g., Kriegel, Gennaro). Conscious states represent *themselves* (same-order representation).  

  3. **What kind of attitude is the higher-order state?**  
     - **Thought-like/conceptual** (e.g., belief, judgment) → Go to Q4  
     - **Perceptual/quasi-perceptual** (e.g., inner sense) → Go to Q7  

  4. **Must the higher-order thought be *occurrent* (actively present)?**  
     - **Yes** → Go to Q5  
     - **No** → **Leaf 3: Dispositionalism** (e.g., Carruthers). Consciousness requires only a *disposition* to form the higher-order thought.  

  5. **Must the higher-order thought be *non-inferential* (direct, not based on reasoning)?**  
     - **Yes** → **Leaf 4: Unnamed (Occurrent, Non-Inferential HOT)**  
       *Why empty?* No prominent advocate; HOTs are typically allowed to be inferential (e.g., Rosenthal).  
     - **No** → Go to Q6  

  6. **Can an *inaccurate* higher-order thought make a state conscious?**  
     - **Yes** → **Leaf 5: Rosenthal-Style Actualism** (e.g., Rosenthal). Misfires create "empty" consciousness (e.g., you feel pain that isn’t there).  
     - **No** → **Leaf 6: Unnamed (Occurrent, Inferential, Accurate HOT)**  
       *Why empty?* Unattractive: misrepresentation (e.g., blindsight-like cases) would deny consciousness despite first-order states.  

  7. **Must the higher-order perception be *occurrent*?**  
     - **Yes** → Go to Q8  
     - **No** → **Leaf 7: Unnamed (Dispositional HOP)**  
       *Why empty?* Unattractive: perception is inherently occurrent; no one defends dispositional "inner sense."  

  8. **Must the higher-order perception be *non-inferential*?**  
     - **Yes** → **Leaf 8: Higher-Order Perception** (e.g., Lycan). Inner awareness is direct, like perception.  
     - **No** → **Leaf 9: Unnamed (Inferential HOP)**  
       *Why empty?* Incoherent: if inferential, it’s not perception-like; collapses into thought-based views.  

  ---

  ### Key to Leaves  
  1. **First-Order/Attentional View**: Consciousness = first-order states + attention/reportability.  
  2. **Self-Representational View**: Conscious states self-represent (no distinct higher-order state).  
  3. **Dispositionalism**: Consciousness requires only a *disposition* for higher-order thoughts.  
  4. **Unnamed (Occurrent, Non-Inferential HOT)**: *Empty* (no advocate; inferential HOTs are standard).  
  5. **Rosenthal-Style Actualism**: Occurrent HOTs confer consciousness, even if inaccurate.  
  6. **Unnamed (Occurrent, Inferential, Accurate HOT)**: *Empty* (unattractive; misfires invalidate consciousness).  
  7. **Unnamed (Dispositional HOP)**: *Empty* (unattractive; perception is occurrent by nature).  
  8. **Higher-Order Perception**: Non-inferential "inner sense" confers consciousness.  
  9. **Unnamed (Inferential HOP)**: *Empty* (incoherent; not perceptual if inferential).  

  ---

  ### Scoring Key for Cases (Quiz)  
  *Answer these cases to test your position. Inconsistent answers reveal mismatches!*  

  | Case | Description | Inconsistent If... |
  |------|-------------|-------------------|
  | **Absorbed Athlete** (e.g., in a hot tub, not thinking about experience) | Has conscious experience? | **Yes** + **Leaf 5/8**: Occurrent HOT/HOP requires active reflection. |
  | **Taxi Driver** (drives on autopilot, then notices "zoning out") | Conscious during autopilot? | **Yes** + **Leaf 5/8**: Requires occurrent higher-order state. |
  | **Blindsight** (guesses correctly but no visual experience) | Why no consciousness? | **"First-order state absent"** + **Leaf 2-9**: HO theories blame missing/inaccurate higher-order state. |
  | **Dreamless Sleep vs. Dreaming** | Difference? | **"No HO state in both"** + **Leaf 3-9**: HO views say dreaming has occurrent HO states. |
  | **Finer-Grained Experience** (e.g., infant/taster with limited concepts) | Conscious despite poor concepts? | **No** + **Leaf 1/2/3/8**: First-order/self-rep/dispositional/HOP allow nonconceptual consciousness. |
  | **Late Monitor** (HO state generated 400ms *after* stimulus) | Was the stimulus conscious? | **Yes** + **Leaf 5/8**: Requires *contemporaneous* HO state. |
  | **Swapped Monitor** (HO state attributes wrong modality) | What is conscious? | **"The first-order state"** + **Leaf 5/8**: HO content determines consciousness (e.g., "visual" state felt). |
  | **Doubled Monitor** (one FO state, two contradictory HO states) | How many conscious states? | **"One"** + **Leaf 5/8**: HO states create distinct conscious experiences (e.g., "red" and "green"). |
  | **Rack Case** (AI with self-monitoring) | Is it conscious? | **No** + **Leaf 2-9**: HO/self-rep views *must* say yes if functional criteria are met.  

