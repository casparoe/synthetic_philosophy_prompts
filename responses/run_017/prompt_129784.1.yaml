  ### Critical Note: Argumentative Traps!  
  - **Q5 (non-inferential) is a dud**: Doesn’t split views; all allow inferential HO states.  
  - **Q6 (accuracy) does the work**: Separates Rosenthal (allows misfires) from untenable views.  
  - **Rack Case is decisive**: Only **Leaf 1 (First-Order)** can deny consciousness to the AI; all HO/self-rep views *must* affirm it.  
  - **Inconsistent Pair**: Saying **Yes** to *Finer-Grained Experience* + **Yes** to *Occurrent HO states* (Leaves 5/8) → Infants can’t have occurrent HOTs!  

