  We are drafting an interview with Dr. Reinholt on her view "prospect contractualism". We must avoid letting her restate her view and instead press on the pressure points. We'll brainstorm first, then draft 8-10 questions with follow-ups, and then a closing sequence.

  **Brainstorming Pressure Points**:

  1. **The Nature of Objections and Prospects**:
     - A prospect is not a burden one actually suffers. It's a probabilistic state. But contractualism traditionally focuses on how principles affect a person's life – their actual burdens. Can an objection be based on a mere chance? If so, how do we weigh a small chance of a large burden against a large chance of a small burden? The curvature of the risk-weighting function (e.g., risk-aversion) becomes crucial, and it's unclear who sets it. If it's individual, then we face interpersonal comparisons of risk attitudes. If it's fixed by the theory, then it might be arbitrary and not respect individual perspectives.

  2. **The Epistemic Dependence (Who Knows What)**:
     - Consider a case where identities are unknown at the time of choosing the principle, but become known just after (but before the act). Ex ante, the principle of saving the five might be chosen because each has a 5/6 chance of death if the one is saved. But if we then learn that the one to be saved is a specific person (say, because we draw a lottery), then if we now have to choose an act, the ex post view might say that saving the five is wrong because that one person has a 100% chance of death while each of the five has a 100% chance of death if not saved. But prospect contractualism would have already fixed the principle ex ante. However, what if the principle itself must be chosen at a time when identities are known? Then the ex ante prospect for each is either 0 or 100% – so the objections are equally strong (one person faces death in one principle, five in the other). Then her tie-breaking rule would kick in. But this seems odd: the moral verdict changes based on whether we know who is who at the time of principle selection. This makes morality depend on our state of knowledge in a way that might seem arbitrary.

  3. **The Tie-Breaking Rule**:
     - The rule: when the strongest individual objection under two principles is tied, we disallow the principle that leaves more people with an objection of that strength. But what counts as "the same strength"? If we have a continuum of burdens, we might never get an exact tie. So perhaps it only applies in very rare cases. But then it might not handle cases that are very close. Also, what if we have a chain of such ties? For example, principle A has one person with objection strength 10, principle B has two people with objection strength 10. Then we choose B? But then if we have principle C with three people at strength 10, we choose C? This might lead to a kind of aggregation by the back door. Also, the rule might produce discontinuities: a tiny increase in the burden for one person might make the objection stronger and then we don't use the tie-breaker, leading to a big shift in the verdict.

  4. **Expected-Value Maximization in Disguise?**:
     - Prospect contractualism seems to mimic expected utility. In the emergency case, each person's objection is based on the expected burden (if we assume linear weighting of risk). Then, when we compare one person's expected burden under principle P and under principle Q, we are effectively comparing expected burdens. But then, when we choose the principle that minimizes the maximum expected burden (or something similar), we are doing something very close to maximizing overall expected utility, because the expected burden for each is the same in symmetric cases. In fact, in the emergency case, the expected number of deaths is minimized by saving the five. So has she just sneaked in aggregation? And if so, what becomes of the relational, second-personal character? Each person is still only objecting based on their own prospect, but the system as a whole might be equivalent to aggregating.

