  ### Closing Sequence: Challenging the Deflection  
  *These three questions build sequentially to corner the deflection "I only weigh one person’s prospect." Start with a familiar case, escalate to one where numbers define a single prospect, and end with falsifiability.*  

  1. **Start where deflection works (but strains)**:  
     - **Question**: "You often say, 'I never add burdens; I weigh one prospect against one.' Yet in the emergency case, my 5/6 risk exists *because* there are five others. Isn’t the number of people already embedded in my prospect?"  
     - *Rationale*: Presses how "one prospect" is group-dependent.  

  2. **Move to numbers entering a single prospect**:  
     - **Question**: "Suppose a policy makes my burden directly proportional to the number of people affected—say, I pay $1 for each person harmed by a disaster. Then my objection isn’t just *my* burden; it’s a function of everyone else’s harm. When you weigh it against another’s prospect, haven’t you let numbers into the objection itself?"  
     - *Rationale*: Forces admission that "one prospect" can encode aggregate effects.  

  3. **End with falsifiability**:  
     - **Question**: "If prospect contractualism is truly non-aggregative, what discovery would make you abandon it? For instance, if we proved that rational contractors *must* weight prospects in a way that always mirrors summing burdens, would you concede it’s aggregation in disguise?"  
     - *Rationale*: Demands vulnerability; tests the view’s contractualist credentials.  

  ---  
  This framework ensures Reinholt can’t retreat to restatements: each question isolates a cost, and the closing sequence systematically unpacks her deflection. The tone remains open but incisive—pushing her to clarify where the boundaries of "one person, one prospect" truly lie.
