     - Follow-up: "But if the tiny risk materializes, one person is severely harmed, just like in the first policy. How do we justify to that person that we chose the policy that exposed her to risk, when we could have contained the harm to one person who was already at risk?"

  6. **Nature of prospects as burdens**:
     - Question: "You've said that objections are grounded in ex ante prospects. But a prospect isn't a harm that a person experiences; it's a probability. Why should a mere chance, which might never happen, give someone grounds for reasonable rejection?"
     - Likely Answer: She might argue that exposure to risk is itself a burden.
     - Follow-up: "But if the risk never materializes, what is the burden? If it's the anxiety, then isn't the burden contingent on the person's psychology? And if they don't feel anxious, is there no objection?"

  7. **Role of numbers in defining prospects**:
     - Question: "In the emergency case, the reason each person has a 5/6 chance of death if we save the one is because there are five others. So isn't the number of people built into the very content of each person's prospect?"
     - Likely Answer: She might say that the prospect is what it is for each person, and we don't add burdens across persons.
     - Follow-up: "But then, when you weigh one person's prospect against another's, the weight of the prospect is determined by the number of others. So aren't you still letting the numbers count, just at an earlier stage?"

  8. **Tie-breaking rule and chaining**:
     - Question: "Suppose we have three principles: P harms one person severely, Q harms two people at the same severity, R harms three. If we compare P and Q, your tie-breaker might choose P. Then P and R, we choose P. But then we end up with P, which harms one, rather than R, which harms three. But that seems to ignore the total harm. Is that acceptable?"
     - Likely Answer: She might say that the tie-breaker only applies pairwise and that we should compare the principles pairwise.
     - Follow-up: "But if we compare Q and R, the tie-breaker chooses Q (since R has more people at the same burden). Then if we compare P and Q, we choose P. So P wins. But if we compare P and R directly, we would also choose P. So it's consistent. But then, the theory seems to endorse P even though Q and R might be available and harm more people. But isn't that counterintuitive when the harm is the same?"

  **Closing Sequence**:

  1. "Dr. Reinholt, your deflection is that you never add burdens, only compare one prospect to one prospect. But in the emergency case, each person's prospect of 5/6 is determined by the number of others. So when you describe the prospect, haven't you already accounted for the number of people?"

  2. "Now, consider a single individual whose burden under a policy is directly tied to the number of others. For example, she must bear a cost that increases with the size of the population. Then, her objection under that policy is based on a burden that is a function of the number of others. So when we weigh her objection against one other person's objection under a different policy, isn't the number of people already inside the objection?"

  3. "Finally, if prospect contractualism is to remain distinct from aggregation, there must be a limit. What evidence or argument would convince you that the view has crossed the line and become a form of aggregation in disguise?"
