     - Consider a public health policy: we can either build a hospital in a way that exposes a few people to a high risk of a disease (say, 100% chance for 1 person to get a severe illness) or in a way that exposes many people to a tiny risk (say, 10,000 people with a 0.01% chance of the same illness). Ex ante, each person in the first group has a prospect of 100% illness, while each in the second group has 0.01%. The strongest individual objection under the first policy is 100% (for the one) and under the second is 0.01% (for each of the 10,000). So the strongest objection is much stronger in the first policy. Therefore, we choose the second. But this seems to ignore the fact that the second policy will almost certainly harm someone (expected harm is one person) while the first policy harms one person for sure. But if we are risk-averse, we might prefer the first? But in prospect contractualism, the risk aversion would be built into the individual's objection. But note: the 10,000 people each have a very small objection. The one person has a huge objection. So the second policy is chosen. But if we scale up the numbers, we get very counterintuitive results: a policy that exposes millions to a one-in-a-million chance of death might be chosen over a policy that kills one person for sure. But the former policy will kill about one person in expectation, and also, each of the millions has a tiny prospect of death. So the strongest individual objection is tiny. This might lead to allowing policies that impose a very large number of small risks, even if the total expected harm is the same or even higher. This seems to ignore the cumulative effect.

  6. **The Deflection**:
     - She says: "I never add anybody to anybody. I only ever weigh one person's prospect against one person's prospect." But note: in the tie-breaking rule, she does look at the number of people with a given level of objection. And in the ex ante setting, the prospect for each person is defined by the number of people who might be affected. For example, in the emergency case, the 5/6 chance of death for each person is a function of the fact that there are five other people. So the number of people is already built into the content of the prospect. Therefore, the separateness of persons is not fully respected because the prospect each faces is inherently relational and depends on the existence of others.

