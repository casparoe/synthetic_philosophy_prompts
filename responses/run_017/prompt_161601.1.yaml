  ### Brainstorming Pressure Points
  Prospect contractualism is an elegant attempt to resolve contractualism's tension with numbers, but several pressure points deserve scrutiny. First, **the ontological status of prospects**: objections grounded in ex ante probabilities may not align with contractualism's core focus on *lived burdens*. A prospect isn't a harm suffered; it's a statistical artifact. If Alice objects to a 5/6 death risk but survives unscathed, has she truly endured a burden? This risks conflating *fear* (subjective) with *wrongness* (objective), and contractualism traditionally avoids psychologizing burdens.  

  Second, **epistemic sensitivity**: Moral verdicts flip based on when identities are known. If principles are chosen pre-lottery, saving five is required via prospects; post-lottery, it's required via tie-breaking. Yet the act (saving five) is identical—only the justificatory path changes. This makes morality oddly dependent on informational timing, undermining its objectivity.  

  Third, **risk-weighting and comparability**: Objection-strength relies on comparing prospects (e.g., 5/6 vs. 1/6 death risk), but this assumes a universal risk-weighting function. Is it linear? Risk-averse? If individuals reasonably weight risks differently, interpersonal comparisons become intractable without aggregating preferences—precisely what contractualism avoids.  

  Fourth, **tie-breaking discontinuities**: The supplementary rule ("choose the principle leaving fewer with maximal objections") handles exact ties but crumbles at near-ties. A 0.1% difference in burden strength might switch the verdict from tie-breaking (sensitive to numbers) to burden-maximizing (ignoring numbers). This creates moral arbitrariness and could incentivize "burden-shaving" to avoid ties.  

  Fifth, **social risk and scale**: In non-emergency cases (e.g., pollution policy), prospect contractualism favors dispersing tiny risks over concentrating large ones. A policy giving 10,000 people a 0.1% cancer risk beats one giving one person 100% cancer, as the strongest objection is far weaker. But this could permit "death by a thousand cuts"—ignoring cumulative harm while fixating on individual risk ceilings.  

  Sixth, **covert aggregation**: Despite the "one prospect vs. one prospect" mantra, the ex ante framework mimics expected value. Each person’s prospect is defined by group size (e.g., 5/6 risk exists *because* there are five others), and minimizing individual expected burdens functionally maximizes total expected welfare. This undermines contractualism’s relational core: justifying to each person becomes a veneer for impersonal arithmetic.  

  Finally, **second-personal erosion**: Scanlonian contractualism is relational—wrongness stems from *owing* justification to others for how your acts affect *them*. But ex ante objections center on hypothetical risks, not actual impacts. If you save five, the one who dies can protest: "You gambled with my life based on *others'* risks!" This shifts focus from "what I did to you" to "what the system optimized," diluting the second-personal stance.  

  The real pressure lies in whether prospect contractualism (1) genuinely avoids aggregation or merely front-loads it into individual prospects, and (2) retains the moral phenomenology of "justifying to each" when objections trade abstract probabilities, not concrete harms.  

