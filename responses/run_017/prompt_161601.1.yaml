  ### Interview Questions  
  **Note**: Each question is phrased conversationally, avoids jargon, and demands more than a yes/no. The "Likely Answer" predicts Reinholt's core response, and the "Follow-Up" targets its weak point.  

  1. **On ex-ante/ex-post and epistemic dependence**  
     - **Question**: "In your emergency case, if we first choose principles when identities are hidden—so everyone agrees to save the five—but then learn who the lone survivor would be before acting, must we still save the five?"  
     - **Likely Answer**: Yes, principles bind once chosen; flipping would be unfair to those who relied on ex ante fairness.  
     - **Follow-Up**: "But suppose that person says, 'Now that you know it’s me, why stick to a rule made when I was just a probability?' Doesn’t that highlight how your view prioritizes system-stability over what’s owed to *me*, the actual person facing death?"  

  2. **On currency and comparability of objections**  
     - **Question**: "When two people face identical risks—say, a 50% chance of injury—but one dreads uncertainty while the other is resilient, how do we compare their objections without imposing a 'correct' way to feel about risk?"  
     - **Likely Answer**: Objections are grounded in reasonable evaluations; we default to an objective risk-burden measure if attitudes diverge.  
     - **Follow-Up**: "But if we standardize 'reasonable' risk-weighting, doesn’t that override personal perspectives—the very thing contractualism vows to honor—and turn objections into an expert-calculated metric?"  

  3. **On tie-breaking for settled identities**  
     - **Question**: "Your tie-breaker kicks in when burdens are exactly equal. But if saving five gives five people 10 units of burden, and saving one gives one person 10.001 units, the tie-breaker vanishes—so saving the one might win. How is that discontinuity justified?"  
     - **Likely Answer**: Exact ties are rare but necessary for precision; near-ties default to minimizing the strongest burden.  
     - **Follow-Up**: "In practice, though, can’t we engineer near-ties? Imagine a hospital tweaking pain scores slightly to avoid tie-breaking and justify saving fewer lives. Doesn’t this make morality gameable?"  

  4. **On covert expected-value maximization**  
     - **Question**: "In the emergency case, saving five minimizes each person’s *expected* death risk. Since everyone’s objection is measured by expectation, isn’t your verdict identical to what we’d get by maximizing total expected survival?"  
     - **Likely Answer**: No; I compare individual expectations pairwise, never sum them. Aggregation ignores reciprocity; I preserve it.  
     - **Follow-Up**: "But if every pairwise comparison favors the same act as aggregation, and the rationale is 'lower risk for each,' doesn’t the system *act like* aggregation? How is telling someone 'I lowered your risk' different from 'I improved the group’s odds'?"  

  5. **On social risk distribution**  
     - **Question**: "Take a factory emitting pollutants: Policy A gives one person certain cancer; Policy B gives 10,000 people a 0.01% cancer risk. Your view picks B, as no one faces a high enough risk to object strongly. Yet statistically, one will still get cancer. What do we say to that person?"  
     - **Likely Answer**: "We chose the only policy no one could reasonably reject; each had stronger grounds to reject A, where one faces certain harm."  
     - **Follow-Up**: "But when that one cancer victim emerges, they’ll say, 'Why expose me to *any* avoidable risk?' If their burden is identical to the person under A, hasn’t the system used them as a means to dilute risk?"  

  6. **On prospects vs. suffered burdens**  
     - **Question**: "If a principle gives me a 99% chance of death but I miraculously survive, have I been wronged? I never suffered harm—just 'bad luck.'"  
     - **Likely Answer**: Yes; the principle imposed an unacceptable risk, and your survival doesn’t erase its wrongness.  
     - **Follow-Up**: "But contractualism usually ties wrongness to actual impacts on lives. If I suffered nothing, how can the act be 'to me' what Scanlon calls 'a way of living with others'?"  

  7. **On the shape of risk-weighting**  
     - **Question**: "For tiny risks—say, 1 in a billion death chance—does prospect contractualism treat them as negligible objections, or must we honor every fraction of risk?"  
     - **Likely Answer**: Even tiny risks contribute to objection-strength, but practical thresholds apply.  
     - **Follow-Up**: "But if thresholds are set socially, doesn’t that smuggle in aggregation? And if not, must we reject driving cars since they impose micro-risks on millions?"  

  8. **On relational justification**  
     - **Question**: "Scanlon says wrongness is about justifying your act *to the person affected*. If I save five not because it’s 'owed to them' but because their cumulative risk lowered my burden ceiling, am I truly addressing *them*?"  
     - **Likely Answer**: Yes; each sees I prioritized their ex ante interest.  
     - **Follow-Up**: "But if I die in the process, can I not say you hid behind the system? You didn’t act *for me*; you acted for a probability that included me."  

