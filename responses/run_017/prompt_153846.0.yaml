answer: |-
  Your objections are sharp but mischaracterize crane-loyalism. First, "skyhook" isn't an *ignorance* label—it's a *structural* one. Skyhooks posit fundamentally non-mechanistic, top-down causation (e.g., Cartesian dualism or interventionist deities). Cranes are mechanisms: decomposable, bottom-up processes. The stance *is* falsifiable: produce a phenomenon demonstrably unexplainable by any possible crane. Until then, methodological naturalism demands we reject skyhooks as explanatory dead ends.  

  Second, cranes don't require "bedrock" or infinite regress. Explanatory power emerges at *functional levels*. Consider thermodynamics reducing to statistical mechanics: the gas laws are lifted by molecular kinematics, even though quarks underlie both. Each crane level *grounds* phenomena by revealing real patterns and mechanisms, regardless of deeper layers. The regress isn't vicious—it's productive. "Completion" isn't metaphysical finality; it's achieving sufficient mechanistic traction to predict, control, and dissolve mystery. Demanding "bedrock" is the very skyhook-thinking we reject: it mistakes an arbitrary stopping point for necessity.
