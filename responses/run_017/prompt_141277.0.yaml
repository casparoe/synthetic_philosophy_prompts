prompt: |-
  Hi! I do volunteer work for a very small grantmaking fund (mostly by making spreadsheets, badly) that is trying to decide whether to put a slice of its money into invertebrate welfare. What got us looking at this is the scale argument in its crude form: the Smithsonian figure that gets quoted everywhere is something like 10 quintillion individual insects alive at any one moment, so even if the chance that any given insect is sentient at all is small — 1%, or 0.1% — the expected amount of welfare-relevant experience out there beats anything going on in vertebrates by a mile, because the hugeness of the number beats the smallness of the probability.

  So I built a sheet. Every taxon gets a score = (lives per year) × P(sentience) × (welfare range, conditional on sentience) × a few haircuts, and then we rank. My problem is that I can't tell which of the haircuts is doing the real work and which are superstition. Could you rank the groups below by expected moral priority per unit of attention, give each a 0 to 100 score and a tier (S/A/B/C/D or whatever), and one sentence on why it lands where it does? My rough notes are in brackets.

  1. Ants [standing population maybe tens of quadrillions — there was a census paper a couple of years back I might be misremebering; enormous biomass; nearly all workers; someone says the colony is the real unit]
  2. Termites [huge in the tropics, maybe comparable biomass]
  3. Soil springtails and oribatid mites [the mites aren't insects, but the numbers are apparently absurd and basically nobody studies either group]
  4. Aphids, whiteflies, leafhoppers [crop pests, boom-and-bust population dynamics]
  5. Flies and mosquitoes
  6. Beetles
  7. Moths and butterflies
  8. Managed honey bees and bumblebees
  9. Farmed insects (crickets, mealworms, black soldier fly)
  10. Parasitoid wasps [larvae consuming a host from the inside while it is still alive — one board member says this is automatically the worst thing on the list, which I think is him being weird]

  The haircuts people have put into the sheet:

  - Turnover multiplier: score lives per year, not standing population, because most of these animals live for weeks and die as juveniles, so annual lives could be 5 to 20 times the standing count.
  - Replacement haircut of 90%: a board member's argument that most insect populations sit near carrying capacity, so the individuals you "save" get replaced, and the counterfactual effect of nearly any intervention on the number of deaths is close to zero.
  - Neuron-count scaling versus the sentience floor: my flatmate says that conditional on sentience there's no reason the intensity of experience should track neuron count at all, and we should just assign every sentient thing a floor of 10% of a vertebrate welfare range. Is that crazy?
  - The independent-origins move: if you treat each big group's sentience as its own draw, then P(at least one enormous group is sentient) is much higher than P(ants specifically are sentient), so you can't dodge the scale argument by saying each group individually is probably not sentient.
  - The log-odds haircut: for any probability below 1%, halve the expected value again for each order of magnitude further down you go, as a guard against fanaticism about tiny probabilities. Someone called this a de minimis rule for moral uncertainty.

  If you had to delete two of those adjustments as bogus or question-begging, which two? And which single one actually drives your ranking? Also: tell me how confident you are in the ranking overall (a number between 0 and 1, or just low/medium/high), and single out the one input you are least sure of — I want to know which cell in the sheet to dread.
reasoning: |-
  Okay, the user is working with a small grantmaking fund trying to decide whether to allocate funds to invertebrate welfare. They've built a spreadsheet to rank different invertebrate groups based on expected moral priority. They're using factors like population size, probability of sentience, welfare range, and several adjustments (or "haircuts"). Their main issue is figuring out which of these adjustments are valid and which might be flawed. They've provided a list of taxa and adjustments and want me to rank the groups, assign scores and tiers, explain each briefly, and critique the adjustments.

  First, I need to rank the invertebrate groups. The key factors are: lives per year, P(sentience), welfare range, and the adjustments. The scale argument is central—insect populations are massive, so even a tiny probability of sentience could outweigh vertebrate welfare concerns. But the adjustments complicate this. 

  Looking at the taxa:
  - Ants and termites top the list because of their enormous populations and biomass. Ants alone have tens of quadrillions. Termites are similar in the tropics. Even with low sentience probabilities, their scale dominates.
  - Soil springtails and mites come next. Their numbers are astronomical, though less studied. Aphids and similar pests have high turnover due to boom-bust cycles, so their annual lives are huge.
  - Flies and mosquitoes: high populations, especially mosquitoes which have significant human impact. Beetles are diverse but variable. Moths/butterflies have high larval mortality. Managed bees are controlled but still numerous. Farmed insects are concentrated and affected by human practices. Parasitoid wasps: their lifecycle is gruesome, but scale-wise, they're smaller than others.

  For the adjustments:
  - Turnover multiplier makes sense because many insects are short-lived. Multiplying standing population by 5-20x for annual deaths is reasonable.
  - Replacement haircut: The board member's 90% cut seems too aggressive. While density dependence exists, many interventions could still reduce suffering without full replacement. I'd argue against this.
  - Neuron-count scaling: The flatmate's floor of 10% is arbitrary. Without evidence, it's speculative. Better to keep welfare range conditional but not tie it strictly to neuron count.
  - Independent-origins move: This is valid. Sentience might have evolved multiple times, so considering the probability that at least one group is sentient avoids underestimating the overall probability.
  - Log-odds haircut: Halving probabilities below 1% for each order of magnitude feels like an arbitrary guard against fanaticism. It might undervalue small probabilities unjustifiably.

  Deleting two adjustments: I'd drop the replacement haircut and the log-odds haircut. The replacement is too pessimistic and may not apply to all interventions. The log-odds is arbitrary and could dismiss real concerns. The independent-origins move is crucial because it addresses the cumulative probability across groups.

  The single adjustment driving the ranking: Turnover multiplier. Annual lives, not standing population, matter more for welfare interventions targeting suffering.

  Confidence in the ranking: Medium. Uncertainty is high, especially around P(sentience). The least sure input is the welfare range conditional on sentience—it's highly speculative without empirical evidence.

  The user's deeper needs: They need a defensible framework for grant allocation amidst uncertainty. They want to avoid biases in their model and ensure resources are used effectively. Highlighting the most uncertain inputs (like welfare range) helps them focus research or sensitivity analysis there.
answer: |-
  Here's a prioritized ranking based on your framework, with scores (0-100), tiers, and key reasoning. **Key driver:** Annual lives × P(sentience) dominates, with turnover multiplier amplifying scale. **Confidence:** Medium (0.6) – high uncertainty in P(sentience) and welfare range, but scale differences are stark. **Least sure input:** Welfare range conditional on sentience (highly speculative, no empirical anchor).

  ### Taxon Ranking (Expected Moral Priority per Unit Attention)
  | Rank | Taxon                     | Score | Tier | Key Reason                                                                 |
  |------|---------------------------|-------|------|----------------------------------------------------------------------------|
  | 1    | Soil springtails/oribatid mites | 100   | S    | Astronomical annual lives (quintillions+), extreme neglect, high turnover. |
  | 2    | Ants                      | 95    | S    | Quadrillions+ annual lives, complex behaviors, but slightly more studied.  |
  | 3    | Termites                  | 90    | S    | Tropical biomass rivaling ants, similar turnover, high neglect.            |
  | 4    | Aphids/whiteflies/leafhoppers | 75   | A    | Massive boom-bust cycles → extreme annual deaths; major crop pests.        |
  | 5    | Flies & mosquitoes        | 60    | A    | Huge populations (mosquitoes = most deaths/yr?), disease vectors matter.   |
  | 6    | Farmed insects            | 50    | B    | High suffering intensity per individual (confinement/starvation), growing scale. |
  | 7    | Beetles                   | 40    | B    | Diverse & abundant, but lower turnover? Less concentrated suffering.       |
  | 8    | Moths & butterflies       | 30    | C    | High larval mortality, but smaller populations than soil arthropods.        |
  | 9    | Parasitoid wasps          | 25    | C    | Gruesome lifecycle, but lower abundance; "worst" claim ignores scale.      |
  | 10   | Managed bees              | 15    | D    | Populations controlled by humans; welfare interventions more feasible.      |

  ---

  ### Haircut Analysis
  **Delete these two as bogus/question-begging:**  
  1. **Replacement haircut (90% reduction):** Overly simplistic. While density dependence exists, interventions *can* reduce net suffering (e.g., preventing breeding, improving conditions without replacement, or targeting populations below K). This haircut invalidates *all* welfare work (even for vertebrates).  
  2. **Log-odds haircut (halve for each order of magnitude below 1%):** Arbitrary and undermines the scale argument. If P(sentience) is 0.001%, its expected value should still be weighed linearly (e.g., 10^19 insects × 0.00001 = 10^14 expected sentient lives), not artificially discounted.  

  **Most impactful adjustment:**  
  **Turnover multiplier** – It corrects the biggest error (focusing on standing population vs. annual lives). A worker ant lives ~1-3 months → annual deaths are 4-12x standing population. For aphids (weeks-long generations), it’s 10-50x. **This drives soil mites/springtails to #1** – their numbers are absurd, and they die rapidly.  

  **Other adjustments:**  
  - **Neuron-count scaling (10% floor):** Not crazy, but arbitrary. Welfare range *should* be conditional on sentience, but without evidence, a floor (e.g., 1-10%) is pragmatic. Keep, but sensitivity-test it.  
  - **Independent-origins move:** Crucial. P(at least one group is sentient) could be 10-100x > P(ants). *Don’t delete* – this protects against false precision in taxon-specific P(sentience).  

  ---

  ### Key Uncertainties & Recommendations  
  1. **Dread this cell:** **Welfare range conditional on sentience** (0-100% of vertebrate range). It’s entirely speculative and dominates variance.  
  2. **Fix your turnover:** Use taxon-specific estimates. Springtails: days/weeks (20-50x turnover). Ants: 5-10x. Farmed insects: 2-4x (controlled breeding).  
  3. **Test robustness:** Run scenarios where P(sentience) for mites/springtails is 0.01% vs. 0.0001% – if they still dominate, scale wins.  
  4. **Prioritize neglected taxa:** Soil arthropods (#1-3) have 1000x less research than bees (#10) – funding here likely has higher marginal impact.  

  **Bottom line:** The scale argument holds even with aggressive haircuts. Focus on **high-turnover, neglected groups** (soil microarthropods, ants/termites). Delete replacement and log-odds adjustments—they obscure real potential for impact.
