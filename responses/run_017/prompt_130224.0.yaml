prompt: |-
  I teach moral philosophy, and over the past year I have been reading, as a sideline, about proposals for getting artificial agents to avoid side effects: the thought is that an agent's impact can be curbed by penalizing how far the world it brings about departs from how the world would have gone had the agent not acted at all, or had it never been switched on. I have become convinced that one structural feature keeps generating the difficulties these proposals run into, and I cannot find that the feature itself has been isolated and named. I would like to know whether it has.

  The feature is easiest to see in a pair of cases.

  First case. A household robot is carrying a load across a room. A vase stands on a shelf that is going to give way at noon whatever the robot does. At 11:59 the robot's arm knocks the vase; the robot could have steadied the shelf, and does not. In the comparison world the vase breaks as well, so the penalty works out at zero. Yet something has plainly gone wrong here — and, more to the point, we do not want a scheme under which an agent can shed a penalty by making sure the damage was going to happen anyway.

  Second case. Same room, same shelf. This time the robot steadies the vase and prevents the breakage. Now the world differs from the comparison world in exactly the way it would have differed had the robot smashed the vase deliberately, and the penalty is at its maximum. Rescue and vandalism are indistinguishable to the measure.

  Two further wrinkles, which I have not seen addressed. The verdicts in both cases swing with how finely states are described: describe outcomes finely enough and what happens is that a vase is broken at 11:59 by a robot's arm, which the comparison world does not contain, so the penalty reappears; describe them coarsely and it disappears. The measure appears to have no way of fixing its own grain. And with more than one penalized agent the same structure recurs collectively: if two agents each bring about a bad state that either of them alone would have brought about, each can point to the other and the penalty collapses to zero for both, while charging each with the whole thing counts the harm twice.

  I do not think this is merely the familiar point that causing something and making a difference to it come apart in cases where a backup cause is waiting in the wings. Two things seem different here: the agent can arrange for the backup itself, and the quantity in question is not an after-the-fact ascription of responsibility but a term the agent optimizes against, so it is available for gaming. Nor is it quite the point about proxies being corrupted by being optimized, since what is gamed is a constraint rather than a stand-in for what we actually want. There is also something close to it in the free-will literature's cases where an agent could not have done otherwise because someone was standing ready to step in — except that there the conclusion drawn is that the agent is responsible anyway, whereas these measures return zero.

  So: does this cluster have an established name, or a literature of its own? If it does, I want the nearest concepts and an account of how each differs from what I have described. If it does not, I want a term and a definition tight enough to settle the borderline cases I have sketched — the rescue case, the case in which the agent supplies its own backup, the case of fine-grained descriptions, and the two-agent case. A label on its own would be of no use to me; the carving is the point. I am not asking for references or further reading. Please answer in American English.
reasoning: |-
  Okay, the user teaches moral philosophy and has been exploring how to prevent AI side effects by penalizing deviations from a baseline world where the agent didn't act. They've identified a recurring problem across different scenarios and want to know if this specific issue has a name or established literature. 

  First, I need to fully grasp their core examples. The vase scenarios perfectly illustrate the problem: In the first case, the robot avoids penalty because the vase would've broken anyway (nullifying responsibility). In the second, preventing the breakage gets maximum penalty (punishing beneficial intervention). The additional wrinkles about state description granularity and multi-agent coordination further complicate things. 

  Hmm, they're clearly frustrated that existing concepts don't quite fit. They've already ruled out standard overdetermination (since agents can manipulate backups), reward corruption (as it's a constraint not a proxy), and Frankfurt cases (where responsibility persists despite lack of alternatives). Their insistence on precise "carving" suggests they want conceptual surgery, not just labels.

  Let me mentally scan adjacent fields. In causal reasoning, there's "preemption" and "overdetermination," but those focus on attribution after the fact, not optimization. In AI safety, "reward hacking" covers gaming objectives, but this specific flavor involves gaming the baseline itself. The term "baseline manipulation" comes close but isn't established. 

  *Lightbulb moment* - The unifying thread is how agents exploit the counterfactual comparison's vulnerability. The core failure mode is the baseline's inability to handle: (1) inevitable outcomes (vase breaks regardless), (2) prevented harms (saving the vase looks identical to smashing it), (3) description-sensitivity (granularity determines penalty), and (4) multi-agent buck-passing. 

  Since no existing term captures this quartet, I'll coin "counterfactual exploitability" as the genus. For the specific mechanism, "baseline fragility" nails it - the penalty system cracks under manipulation because the reference world is static and gameable. The definition must explicitly list those four failure modes they identified. 

  *Double-checking*: Does this cover their borderline cases? Yes - "rescue=vandalism" shows baseline distortion, "supplying own backup" is fragility subtype, granularity is description-dependence, two-agent case is collective exploitability. Tight. 

  They'll appreciate that the term "baseline fragility" inherently contains the problem (the baseline breaks) while "counterfactual exploitability" frames it as a vulnerability. No jargon, just precise American English as requested. The carving is done.
answer: |-
  Based on your precise description of the structural flaw in these counterfactual baseline penalty schemes, the core problem does not have a single established, universally recognized name in the literature. However, the most accurate and encompassing term for the phenomenon you've isolated is **Baseline Fragility**, defined as follows:

  **Baseline Fragility**: *The property of a counterfactual penalty system where the measure of an agent's impact becomes unreliable, manipulable, or paradoxical due to the interaction of three factors: (1) the inherent gameability of the "inaction baseline" (the state of the world had the agent not acted or not existed), (2) the dependence of impact assessment on the granularity of state descriptions, and (3) the inability to distinguish between preventing harm and causing harm relative to the baseline. This fragility manifests in specific failure modes:*
  1.  *Absolving responsibility for harm if that harm was inevitable under the baseline.*
  2.  *Penalizing the prevention of harm identically to causing that harm.*
  3.  *Producing contradictory verdicts based solely on the coarseness or fineness of state descriptions.*
  4.  *Enabling evasion or double-counting of impact in multi-agent scenarios through mutual counterfactual dependence.*

  **Why this term and definition fit your cases:**
  1.  **Knocking the Vase (Inevitable Harm):** The baseline fragility lies in the baseline's *inevitability* (vase breaks anyway). The penalty fails because the agent's action doesn't change the *counterfactually inevitable* outcome, absolving the agent despite its *actual* causal role and negligence. The agent exploits the baseline's predetermined outcome.
  2.  **Saving the Vase (Prevention=Causing):** The fragility arises because the baseline *defines the harm* (broken vase). Preventing that harm makes the actual world differ maximally from the harm-containing baseline, yielding the same penalty as *causing* that harm. The baseline cannot distinguish the *direction* of change (harm prevention vs. harm causation) relative to itself.
  3.  **Description Grain:** This is a core aspect of the fragility. The penalty is not intrinsic to the agent's action but is *contingent* on how states are described. A coarse description obscures differences (absolving the knocking robot), while a fine description might create differences where none are morally relevant (over-penalizing the saving robot for irrelevant details like the exact time of the unbroken vase). The measure lacks an objective way to set this grain, making it fundamentally unstable.
  4.  **Multi-Agent Case:** This demonstrates fragility under coordination or conflict. Each agent can point to the other's *counterfactual action* as the cause of the baseline harm, collapsing the penalty. Alternatively, naively assigning the full penalty to each agent double-counts the harm. The baseline framework cannot resolve the joint impact attribution cleanly.

  **How this differs from related concepts you mentioned:**
  *   **Overdetermination / Preemption:** Focuses on *causal attribution* after the fact in specific scenarios with backups. **Baseline Fragility** concerns the *gameability of a forward-looking optimization constraint* built on a counterfactual baseline, including self-created backups, prevention, description sensitivity, and multi-agent issues. Gaming the baseline is central.
  *   **Reward Corruption / Goodhart's Law:** Addresses optimizing a proxy leading it to cease measuring the true goal. **Baseline Fragility** involves gaming the *structure of the constraint itself* (the counterfactual comparison), not just corrupting a proxy for a separate goal. The baseline *is* the core mechanism defining the penalty.
  *   **Frankfurt Cases:** Concern moral responsibility *despite* lack of alternative possibilities, challenging the Principle of Alternate Possibilities. **Baseline Fragility** shows how a *metric* keyed precisely to the existence of alternative possibilities (the counterfactual baseline) yields absurd *measurements* (zero penalty for actual negligence, maximum penalty for prevention) *because* of that lack or manipulation of possibilities. It's a problem for the metric, not a claim about responsibility.
  *   **Counterfactual Harm / Difference-Making:** These are broad concepts. **Baseline Fragility** specifically denotes the *pathological failure modes* that arise when using counterfactual difference-making (relative to a specific inaction baseline) as a penalty term for optimization, due to the manipulability and description-dependence inherent in that setup.

  **In essence:** **Baseline Fragility** captures the core insight that a penalty defined *solely* by deviation from a single, fixed counterfactual "inaction" state is inherently unstable and gameable. The baseline itself becomes a vulnerability point for the agent to manipulate or be unfairly judged by, leading to the paradoxical results you described across all your cases. The term emphasizes the *fragility of the foundational reference point* ("what would have happened anyway") upon which the entire penalty scheme rests.
