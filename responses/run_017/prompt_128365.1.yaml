prompt: |-
  My co-founder has decided — after one essay, which he will not stop talking about at every standup — that nobody is ever morally responsible for anything, and he wants it in the employee handbook: no praise, no blame, everyone gets managed and treated instead. I'm the one who has to actually write the policy, so I want to see exactly how it breaks.

  Write me the handbook section, 500-600 words, as a deadpan HR memo: something like "Attitude-Neutral Workplace Policy (ANW-2)," in numbered clauses, with a To: line, a Re: line, and a cc: to the whole company. The voice is a tired HR director who genuinely intends to implement the request in good faith and keeps failing to.

  The jokes should come from the actual structure of the view, not from a silly version of it:

  - Nobody in the memo should mention determinism or free will. The point is that the policy doesn't rest on any such thesis — it just proposes to stop doing something, whatever the metaphysics turns out to be.
  - The "objective" stance is the one we already take toward people whose agency is compromised: small children, the severely disordered, someone in the grip of something. So write the accomodation request using the vocabulary HR already reserves for those cases, and let the requester be insulted by it in a way he can't quite articulate.
  - He can't have it both ways. If the manager stops blaming him, the manager also stops thanking him, trusting him, feeling let down by him, or treating his promises as anything more than predictions. Pick at least one concrete thing he actually wants — being trusted with the office keys, being credited for his work, being forgiven for the payroll thing — and show it as unavailable under his own policy.
  - The stance isn't switched on at will; it's something you fall into or get talked into, and it slips. So let him opt back in without noticing: two clauses after demanding it, he is furious that nobody has thanked him for writing it.

  Close on the one real cost, stated flatly with no punchline: what he's asking for isn't only blame-free, it's friendship-free.

  Start with the memo itself — no preamble, no "here's a draft," nothing before it. A couple of lines after, on what you were exaggerating, is fine.
reasoning: |-
  Okay, the user wants me to write an HR memo based on their co-founder's insistence that nobody is morally responsible for anything. The memo needs to be deadpan, in corporate jargon, and highlight the internal contradictions of this policy. 

  First, I need to understand the core challenge: implementing a "no praise, no blame" policy while exposing its practical absurdities. The user specified key constraints - no metaphysics jargon, use HR's existing accommodation language for compromised agency cases, and show how this erodes trust and relationships.

  Hmm, the co-founder wants credit for writing the policy but the policy itself forbids thanking him. That's perfect irony to include. I should structure it as:
  - Standard memo headers (To/Re/cc) 
  - Numbered policy clauses 
  - Corporate-speak framing it as "support" 
  - Burying the contradictions in dry language

  The tone needs to be exhausted HR professional earnestly trying to comply while accidentally revealing the flaws. Phrases like "support framework" and "adjustment" will subtly equate employees with children or the impaired. 

  For the concrete example... payroll errors work well since finance is universal. And the keys scenario shows how trust becomes impossible. The friendship line at the end should land like a guillotine - no jokes, just the cold consequence.

  User definitely wants the co-founder to feel the sting of being categorized as needing "support" without being able to protest. The genius is making the policy weaponize its own logic against him when he expects praise. 

  *scribbles draft* The "Re: line" should mirror accommodation request codes (ANW-2 = Attitude-Neutral Workplace). Clause 4.1 will trap him in his own rule by forbidding thanks for the policy itself. Final clause needs to sit alone for impact: "This framework cannot coexist with friendship". Brutal but accurate.

  User's smart - they know showing > telling. No need for me to explain the satire when the policy text humiliates itself. Just need to nail the bureaucratic voice.
answer: |-
  **MEMORANDUM**  

  **TO:** All Staff  
  **RE:** Attitude-Neutral Workplace Policy (ANW-2) Implementation  
  **CC:** Executive Team, Department Heads, Security  

  1. **Purpose**: Effective immediately, all management practices involving moral evaluation of personnel are discontinued. This policy (ANW-2) adopts an objective, support-focused framework for behavioral feedback, irrespective of role or seniority.  

  2. **Scope**:  
     2.1. "Moral evaluation" includes praise (e.g., "great work"), blame (e.g., "you failed"), gratitude, resentment, or appeals to personal commitment.  
     2.2. All interactions will adopt the posture used for individuals experiencing compromised agency (e.g., acute distress, neuroatypicality, or temporary incapacity). See Handbook §4.3(a) for reference.  

  3. **Revised Management Protocols**:  
     3.1. **Feedback**: Replace value judgments with observed outcomes.  
     - *Non-compliant*: "Your negligence caused the breach."  
     - *Compliant*: "The breach occurred. Mitigation steps are attached."  
     3.2. **Recognition**: Discontinue acknowledgments of effort/achievement.  
     - *Example*: Do not thank employees for working late. Note: "Project X deadlines were met via extended site occupancy."  

  4. **Accommodations & Adjustments**:  
     4.1. Promises, deadlines, or commitments are reclassified as probabilistic forecasts ("Based on current data, Event Y is 70% likely").  
     4.2. Trust-based privileges (e.g., unsupervised server access, discretionary budgets) require review.  
     - *Rationale*: Trust implies expectation of reliability, a moral stance.  
     - *Interim measure*: Office keys restricted to Security (see incident log #441 re: payroll miscalculation).  

  5. **Exceptions**:  
     5.1. Legal/contractual liabilities (e.g., harassment, theft) remain subject to disciplinary action per local statutes. ANW-2 governs interpersonal conduct only.  
     5.2. External communications (client emails, press releases) may temporarily suspend ANW-2 to preserve stakeholder relations. Flag such instances with #PolicyOverride.  

  6. **Grievance Protocol**:  
     6.1. Complaints about policy application (e.g., "I wasn’t thanked for drafting ANW-2") are invalid. Per §2.1, gratitude is non-compliant.  
     6.2. Report procedural deviations via Form HR-9D ("Neutrality Lapse Incident Report").  

  7. **Policy Limitations**:  
     7.1. ANW-2 cannot guarantee consistent application. Humans instinctively engage moral frameworks.  
     - *Remedy*: Quarterly neutrality training (mandatory).  
     7.2. This framework cannot coexist with friendship, mentorship, or camaraderie. These require subjective investment in others' agency.  

  ---  
  **Note**: The policy breaks precisely where its advocate demands exemption: he expects gratitude for ANW-2 (Clause 6.1) and will protest key restrictions (Clause 4.2). The "objective stance" functionally treats adults as incapable, stripping trust, credit, and connection. Friendship isn’t blame-free; it’s blame-adjacent.
