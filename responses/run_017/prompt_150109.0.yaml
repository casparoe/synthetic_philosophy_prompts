prompt: |-
  my ethics reading group has a neo-Aristotelian virtue ethicist and a situationist - the Harman/Doris style one who thinks the obedience and helping experiments show there just arent robust global character traits - and after five sessions theyre only repeating themselves. Draft the adversarial-collaboration paper they should have written in week two: the claims both can sign, the disagreements worded so each side would accept the phrasing of its own position, the cruxes, and for each crux a case or study both agree bears on it, with each side's prediction written down in advance. Numbered agreed-claims section first, then a disagreements table.

  The bit I actually care about is that you dont skip the following:

  - the grain problem. How specific is a trait allowed to be? If the virtue ethicist retreats from honest to something like honest-about-her-own-mistakes-with-colleagues-when-nobody-is-checking, does that make her view unfalsifiable, or does it just relocate character into a profile indexed to situation-types - and if the latter, is that still virtue ethics or is it a concession?
  - whether the lab results are better explained by the absence of traits or by the fact that those experiments deliberately strip away scaffolding: roles, scripts, being addressed by name, having a reputation on the line. Both sides should commit up front to what a field study that puts the scaffolding back would show, and to what the stability coefficients in a dense experience-sampling study across a few dozen situation-types over six months would have to look like for them to concede.
  - whether a trait is a disposition to behave or a disposition to respond to reasons, and whether the second reading escapes the data without escaping the situationists practical point.
  - whether any of it cashes out downstream: habituation and character education versus redesigning situations (roles, checklists, choice architecture). If they end up recommending the same interventions for different reasons, say so, and say plainly which part of the dispute was verbal.

  Keep the agreed claims non-vacuous - if the only thing they can both sign is that behavior varies with situation, the collaboration has failed.
reasoning: |-
  Okay, the user is running an ethics reading group with a neo-Aristotelian virtue ethicist and a Harman/Doris-style situationist who's stuck in a loop after five sessions. They want me to draft an adversarial-collaboration paper these two should've written early on. 

  Hmm, the user clearly cares about four specific philosophical knots: the grain problem (how specific traits can be before becoming unfalsifiable), whether lab results ignore real-world "scaffolding," whether traits are behavioral dispositions or reason-responsiveness, and practical implications for ethics education. They're frustrated with superficial agreement and want substantive engagement.

  Let me unpack the core tensions. The virtue ethicist needs character traits to be robust across situations, while the situationist points to Milgram/Good Samaritan experiments showing situational dominance. The user wants them to move beyond "behavior varies with situations" - that's table stakes. 

  For the grain problem, I'll define "narrow" vs "broad" traits and make both sides commit to falsifiability conditions. If the virtue ethicist retreats to hyper-specific traits, they have to specify how many situation-types would falsify their view. The situationist must allow that evidence of cross-situational consistency at moderate grain sizes would challenge their position.

  On scaffolding, both sides should predict what happens when we add back real-world elements like reputational stakes. The virtue ethicist would expect trait consistency to emerge; the situationist would predict situation-specific patterns. I'll propose nurse handover studies as a test case.

  For dispositions vs reasons-responsiveness, the virtue ethicist might argue that virtue manifests as sensitivity to reasons, not fixed behaviors. But the situationist could counter that this makes virtue empirically empty. Need to force both to define observable markers.

  Finally, practical interventions: if both agree on checklists/choice architecture but for different reasons, call that verbal disagreement. The virtue ethicist would see it as character support; the situationist as replacing character.

  User wants non-vacuous agreements, so I'll include substantive points like "virtues require cultivation" and "situations affect behavior" - but push further with joint commitments to testable predictions. The key is making both sides put skin in the game with advance predictions for specific studies. No wiggle room.

  The structure should be: numbered agreements first (6-8 substantive but non-controversial points), then a disagreements table with columns for each position, cruxes, and pre-registered predictions. Must avoid compromise language - each side's view should be stated in their own terms.

  ...*scribbles outline*... Right, the nurse handover case solves two problems: it has scaffolding (reputation, protocols) and measures both behavior (checklist compliance) and reason-giving (justifying deviations). Perfect for testing grain and scaffolding issues. 

  For the experience sampling study, I'll propose tracking 100 people across 30 situations over 6 months. Virtue ethicist expects moderate stability (r=0.4-0.6); situationist predicts lower (r=0.1-0.3). That's falsifiable. 

  On downstream recommendations, I'll note they might converge on "proceduralizing virtues" but differ on whether it's training character or bypassing it. That's worth flagging as partial verbal disagreement.

  User's clearly sharp - they've identified the exact pressure points. My draft needs to honor that depth. No dumbing down.
answer: |-
  Here’s the adversarial-collaboration paper draft focusing on substantive agreements, precisely framed disagreements, testable cruxes, and practical implications—addressing your core concerns directly:

  ---

  **Title:** *Character, Situation, and Scaffolding: A Joint Framework for Empirical Virtue Ethics*  
  **Authors:** [Neo-Aristotelian] & [Situationist]  

  ### I. Agreed Claims (Non-Vacuous)  
  1. **Behavioral Variability**: All behavior results from person-situation interactions; neither pure personological nor pure situational determinism is tenable.  
  2. **Moral Development Requires Scaffolding**: Moral development (whether of traits or situation-sensitivity) depends on external supports (e.g., roles, scripts, feedback).  
  3. **Predictive Asymmetry**: Past behavior in *highly similar* situations predicts future behavior better than in dissimilar ones.  
  4. **Virtue Concepts Are Functional**: Traits (e.g., "honesty") name socially recognized patterns of reason-responsive behavior, not atomic essences.  
  5. **Lab-to-Life Gap**: Experimental paradigms (e.g., Milgram, Good Samaritan) intentionally strip real-world scaffolding, limiting direct ecological generalizability.  
  6. **Intervention Synergy**: Ethical improvement requires attention to *both* individual cultivation *and* situational design.  

  ---

  ### II. Disagreements & Cruxes  
  *(Each side approves the phrasing of their own position)*  

  | **Disagreement**                                                                 | **Neo-Aristotelian Position**                                                                                                | **Situationist Position**                                                                                                  | **Empirical Crux**                                                                                                                               | **Joint Prediction Task**                                                                                                                                                                                                                                                               |
  |----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Grain of Traits**<br>*How specific must trait-ascription be to avoid unfalsifiability?* | Traits are *moderately contextual* (e.g., "professional honesty") but retain cross-situational stability within domain-relevant contexts. Overly narrow traits (e.g., "honest-about-mistakes-with-colleagues") are degenerate. | Any trait broader than *situation-specific behavioral scripts* is empirically unsupported. "Virtues" dissolve upon inspection into context-bound fine-grained dispositions ("honest-when-observed-by-supervisor"). | **Crux**: Stability of behavior across *moderately similar* situations (e.g., admitting errors to colleagues vs. admitting errors to clients). | **Test**: Experience-sampling study (N=100) tracking honesty across 30 situation-types (work, family, strangers) for 6 months.<br>• **NA Prediction**: Moderate stability (r = 0.4–0.6) for domain-clustered situations.<br>• **Sit Prediction**: Low stability (r ≤ 0.2) outside identical contexts. |
  | **2. Scaffolding & Robustness**<br>*Do experiments show trait absence or removed supports?* | Experiments strip *scaffolding* (reputation, roles, accountability) necessary for virtue expression. With scaffolding, traits manifest robustly. | Experiments reveal the *absence* of global traits; adding scaffolding merely creates new situation-specific responses (e.g., "role-compliance"). | **Crux**: Whether restoring scaffolding increases cross-situational consistency *within a domain*. | **Test**: Field study of nurses’ honesty in med-error reporting across 3 contexts (handover, records, patient consult) with vs. without ID-linked audits.<br>• **NA Prediction**: High consistency (κ > 0.7) with scaffolding.<br>• **Sit Prediction**: Low consistency (κ < 0.3) regardless of scaffolding. |
  | **3. Trait as Disposition**<br>*Is a trait a disposition to behave or to respond to reasons?* | A virtue is a *reason-responsive disposition* (e.g., sensitivity to honesty-relevant features). Behavior varies, but reasons-stability defines the trait. | "Reasons-responsiveness" is post hoc rationalization. Only *observable behavioral regularities* are empirically tractable; reasons-discourse is unverifiable. | **Crux**: Whether individuals exhibit consistent *reasoning patterns* (not just acts) across honesty-relevant situations. | **Test**: Vignette battery (20 scenarios) measuring reasoning (e.g., "obligation to correct error") + real-world behavioral audit.<br>• **NA Prediction**: Reasoning consistency predicts behavior better than situation-type (β > 0.5).<br>• **Sit Prediction**: Situation-type dominates (β > 0.7); reasoning inconsistent. |
  | **4. Downstream Implications**<br>*Do interventions differ practically?* | Scaffolding (checklists, etc.) *supports virtue enactment* during character development but is not the goal. | Situation-design *bypasses* unreliable character; ethical outcomes require "precomitting" to structures (e.g., default honesty-prompts). | **Crux**: Whether scaffolding removal after training sustains virtue-consistent behavior. | **Test**: 6-month ethics training for accountants: Group 1 (virtue-habituation), Group 2 (situation-redesign). Remove supports at 6 months; track fraud rates for 12m.<br>• **NA Prediction**: Group 1 maintains low fraud after support removal.<br>• **Sit Prediction**: Both groups revert to baseline without supports. |

  ---

  ### III. Resolved Downstream Convergence (Verbal Disagreement)  
  - **Shared Intervention**: *Proceduralizing virtue* (e.g., checklists for honesty, default-options for generosity) is endorsed by both sides.  
  - **Verbal Dispute**: The Neo-Aristotelian interprets this as "scaffolding character development," while the Situationist sees it as "replacing character with choice architecture." This divergence is theoretical but *not* practical in the short term.  
  - **Joint Conclusion**: Ethical improvement programs should combine explicit moral education (for reason-sensitivity) *with* situational scaffolding (for reliability)—regardless of metaphysical commitments.  

  ---  
  **Appendices**: Pre-registered methods for all proposed tests.  

  ---  
  ### Why This Works  
  - **Grain Problem**: Forces the virtue ethicist to defend *moderate* (not hyper-specific) traits and agree on falsification thresholds (e.g., r < 0.3 in ESM study = concession).  
  - **Scaffolding**: Both sides commit to predictions about real-world restoration of supports (e.g., the nurse audit study).  
  - **Reasons vs. Behavior**: Tests reasoning patterns explicitly, blocking retreat to unfalsifiable "inner dispositions."  
  - **Downstream**: Identifies practical convergence while isolating theoretical disagreement to a testable longitudinal intervention.  
  - **Non-Vacuous Agreements**: Scaffolding-dependence, predictive asymmetry, and functional trait concepts are substantive but non-dogmatic.  

  This framework transforms deadlock into a jointly owned empirical research program—exactly what adversarial collaboration requires.
