  | Tidal-mat with orthogonal schemes challenges "joints" realism. | 3 | Broken | Realists accept both schemes as tracking distinct causal structures; orthogonality isn't problematic. | Reframe as showing that "joints" must accommodate *causal orthogonality*, not deny it. |
  | Replace "joints" with "grain": causal texture permitting plural partitions. | 4 | Fixable | "Grain" is undefined; risks triviality if it just means "multiple causal processes exist." | Define "grain" via causal density metrics (e.g., robustness to perturbation in property-space). |
  | Wrinkles: grain trivial if detecting multiple systems; geometry of classification-space unmotivated. | 5 | Broken | Geometry problem undermines the entire metaphor; no account of what "directions" or "perturbation" means. | Ground geometry in causal structure (e.g., interventions, counterfactual dependencies). |
  | Worry: section 2 caricatures Kripke/Putnam essentialism. | 6 | Fixable | Kripke/Putnam allow natural kinds to be non-essential (e.g., water as H₂O isn't essentialist about phase/mass). | Note that they commit to *rigid designation* and microstructure, not Aristotelian essences. |

