  ### Final Notes  
  - **Kripke/Putnam (section 6):** Your caricature is mild. They *are* often read as microstructural essentialists, but their core commitment is rigidity (kind terms pick out same entities across worlds) and microstructure as the "joint-carver." They *could* accept your mat’s schemes if both track microstructural properties (e.g., channel = protein configuration, cohort = gene expression cycle).  
