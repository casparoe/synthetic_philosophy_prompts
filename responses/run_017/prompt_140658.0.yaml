  Okay, I need to create a decision tree for a reading group about what constitutes joint action versus parallel individual actions. The user had an argument with their flatmate about five strangers moving a branch without speaking—was that joint action or just individual actions adding up? The reading group has six people, not very technical, but they've read some philosophy of action. I have to build a logical tree with 7-8 branching questions, each based on concrete cases or claims that don't presuppose theories. Then, I'll map the answers to philosophical positions like shared intention or we-intentions.

  First, I recall the key theories in joint action philosophy: shared intention (like Bratman's), we-intentions (Searle), plural subject (Gilbert), we-mode (Tuomela), and deflationary views. I need to cover these and add any missing ones. The user also specified three tricky cases: (a) agents who can't form views about others' intentions, like thinking the other is a hallucination; (b) coordinated but disagreeing participants, like one thinking it's a rehearsal and the other the real thing; (c) lone-member case, where someone acts as part of a group that doesn't exist.

  I should start by identifying the core disagreements that distinguish these theories. For instance, do agents need mutual beliefs about each other's intentions? Is there a collective commitment? Does it require a shared goal? I'll turn these into yes/no questions using everyday scenarios to keep it accessible.

  Brainstorming the branch questions:  
  - Start with whether joint action requires any mutual responsiveness. If no, that might lead to deflationary views.  
  - Then, ask about the need for mutual beliefs about intentions.  
  - For case (a), if agents can't form beliefs about others, does that still count? That could challenge theories requiring mutual belief.  
  - For case (b), disagreement about the action—does that undermine jointness? That might separate views that focus on external coordination from those needing shared understanding.  
  - For case (c), the lone-member case—if someone acts as if in a group but isn't, does it still feel joint? This could probe if jointness is subjective or objective.

  I need about 7-8 questions. Let me list them:  
  1. Can joint action occur without any mutual responsiveness? (Use a case like two people independently pushing a car without knowing the other is helping.)  
  2. Is mutual belief about intentions necessary? (Case: two people moving a sofa, each knowing the other intends to help.)  
  3. For case (a): can it be joint if agents think the other isn't real? (E.g., thinking the other is a hallucination while moving the branch.)  
  4. For case (b): if they disagree on what they're doing, is it still joint? (Rehearsal vs. performance example.)  
  5. Does joint action require that participants see themselves as a group? (Like Gilbert's plural subject.)  
  6. Can one person alone perform a joint action? (Lone-member case.)  
  7. Is a collective commitment needed beyond individual commitments?  
  8. Do agents need to have a "we-intention"? 

  After building the tree, I'll map the paths to theories. I must mark combinations that no one holds and explain why—e.g., if it's incoherent, unattractive, or undefended. For example, a view that requires mutual belief but allows for hallucinations might be incoherent. Also, ensure the tree handles the specified cases; if a case doesn't separate leaves, note that.

  Finally, I'll make the questions concrete and jargon-free. For instance, instead of "do groups have minds?" ask about specific behaviors. Once done, I'll present the decision tree clearly, with branches leading to leaves labeled with the theories.
answer: |-
  Here’s a decision tree built from the logical space of joint action, designed for your reading group. It uses 7 concrete, theory-neutral questions (cases or claims) to sort into major philosophical positions. Each question is answerable with "Agree" (Yes) or "Disagree" (No) based on intuitive judgment, without requiring prior knowledge of theories. The tree handles your three sticky cases explicitly and identifies unmapped combinations.

  **How to use:**  
  - Start at **Question 1**.  
  - Follow the branch based on your answer.  
  - Repeat until you reach a leaf (a theory or view).  
  - **Bold terms** at leaves are standard theory labels; "unnamed" marks undefended views.

  ---

  ### **Decision Tree: What Makes an Action "Joint"?**

  #### **Question 1: Mutual Responsiveness**  
  *Case: Two strangers silently step aside at the same time to avoid colliding on a narrow path. Neither adjusts their path in reaction to the other; they just coincidentally move.*  
  - **Agree** (This is joint action) → Go to Q2.  
  - **Disagree** (This is parallel individual action) → Go to Q3.  

  #### **Question 2: Beliefs About Others' Intentions**  
  *Case: A person thinks their "partner" in moving a heavy table is a hallucination (or a dumb robot), but their physical actions are perfectly coordinated.*  
  - **Agree** (This can still be joint action) → Go to Q4.  
  - **Disagree** (Joint action requires seeing others as intentional agents) → Go to Q5.  

  #### **Question 3: Goal-Directed Coordination**  
  *Case: Five people independently drag the same fallen branch off a trail. Each acts alone to clear the path, unaware of others’ reasons.*  
  - **Agree** (This is joint action) → **Leaf: Deflationary Individualism** (e.g., Gold & Sugden).  
  - **Disagree** (Joint action requires coordination toward a shared goal) → Go to Q6.  

  #### **Question 4: Subjective "We" Requirement**  
  *Claim: For an action to be joint, participants must think "we are doing this together."*  
  - **Agree** → **Leaf: We-Intentions** (Searle).  
  - **Disagree** → **Leaf: Minimal Shared Agency** (unnamed; e.g., Pacherie’s dynamic theory).  

  #### **Question 5: Mutual Belief Requirement**  
  *Case: Two dancers perform a complex duet. One thinks it’s a rehearsal, the other thinks it’s the real show. Actions are flawless.*  
  - **Agree** (This is still joint action) → Go to Q7.  
  - **Disagree** (Shared understanding of the action is essential) → **Leaf: Shared Intention** (Bratman).  

  #### **Question 6: Group Identity**  
  *Case: A person acts "as one of five rebels" in a protest, but unbeknownst to them, the other four are undercover cops pretending.*  
  - **Agree** (This person is performing a joint action) → **Leaf: We-Mode** (Tuomela).  
  - **Disagree** (Joint action requires an actual group) → Go to Q7.  

  #### **Question 7: Obligation to the Group**  
  *Claim: Joint action creates mutual obligations—e.g., if one quits unexpectedly, it’s a betrayal.*  
  - **Agree** → **Leaf: Plural Subject** (Gilbert).  
  - **Disagree** → **Leaf: Shared Intention** (Bratman).  

  ---

  ### **Resulting Leaves (Theories)**  
  1. **Deflationary Individualism**: Joint action is just parallel individual actions with a collective outcome (e.g., five strangers moving a branch).  
  2. **We-Intentions**: Joint action requires each agent to intend "we are doing X" (e.g., thinking "we are clearing the path").  
  3. **Minimal Shared Agency** (unnamed): Joint action emerges from dynamic coordination, even without mutual recognition (e.g., human + hallucinated partner).  
  4. **Shared Intention**: Joint action requires meshing subplans, mutual responsiveness, and commitment to mutual support (e.g., the duet where beliefs differ).  
  5. **We-Mode**: Joint action requires adopting the group’s perspective and goals (e.g., the "rebel" acting in we-mode despite no group).  
  6. **Plural Subject**: Joint action forms a plural subject with mutual obligations (e.g., quitting the branch-moving without warning violates duty).  

  ---

  ### **Handling Your Sticky Cases**  
  - **(a) Agents who can’t form views about others** (e.g., hallucination/robots):  
    - Separates **We-Intentions** (disallows it) from **Minimal Shared Agency** (allows it).  
  - **(b) Coordinated but disagreeing participants** (e.g., rehearsal vs. performance):  
    - Separates **Shared Intention** (allows it) from **Plural Subject** (typically disallows it).  
  - **(c) Lone-member case** (acting as part of a non-existent group):  
    - Separates **We-Mode** (allows it) from **Plural Subject/Shared Intention** (disallow it).  

  **Unseparated Pairs**:  
  - **Deflationary Individualism** vs. **Minimal Shared Agency**: Both allow cases with no mutual beliefs (e.g., hallucination case).  
  - **Shared Intention** vs. **Plural Subject**: Both reject the lone-member case but diverge on obligations (Q7 sorts them).  

  ---

  ### **Unoccupied Combinations**  
  1. **Mutual Responsiveness (No) → Goal-Directed Coordination (No) → Group Identity (Agree)**:  
     - *Unoccupied*: Incoherent. If joint action requires a group (Q6-Agree), it must involve coordination (Q3-Disagree forces coordination).  
  2. **Mutual Responsiveness (Yes) → Beliefs About Intentions (Disagree) → Mutual Belief (Agree) → Obligation (Disagree)**:  
     - *Unoccupied*: Unattractive. Accepts mutual belief (Q5-Agree) but rejects obligations (Q7-Disagree), making it a weaker Shared Intention view—no one defends this.  
  3. **Mutual Responsiveness (Yes) → Beliefs About Intentions (Agree) → Subjective "We" (Disagree)**:  
     - *Unoccupied*: Undefended. Allows joint action *with* mutual recognition but *without* a "we"-thought. Possible but not theorized.  

  ---

