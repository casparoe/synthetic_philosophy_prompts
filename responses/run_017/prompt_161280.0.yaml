  I should start by brainstorming potential counterarguments. First, the metaphysical claim: is comparability always true? Cases like career choices between fundamentally different values (e.g., artistic fulfillment vs. financial security) might involve incommensurability. Ruth Chang's work on parity suggests options can be on a par, not merely equal or one better. If such cases exist, that challenges the trichotomy assumption.

