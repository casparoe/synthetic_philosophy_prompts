  First, the brother had a symbolic ceremony abroad two years ago, but it wasn't legally recognized. They only discovered this recently when renewing their daughter's passport. They then had a civil ceremony at the courthouse last month, which the user witnessed. Now they're having the public celebration with family and friends. The couple asked not to mention the courthouse wedding during the toast because some attendees, like the partner's grandmother (a former county clerk), don't know about it. 

  The audience includes various groups: a philosopher friend who'll analyze every reference, friends who see weddings as parties, colleagues, young kids, and the grandmother who values legal formalities. The user is also getting married soon with a friend officiating, so they're now handling paperwork carefully. They can't dismiss paperwork as trivial nor equate it with marriage itself.

  The user's been reading Austin's speech act theory, especially performative utterances. They want to introduce a third concept called "suspension" - where the initial ceremony wasn't void but pending ratification by the legal one. The toast needs to subtly reference this without naming theories. The main challenge is crafting a toast that's truthful to all attendees regardless of their knowledge, avoids revealing the courthouse marriage, and satisfies both the legalist grandmother and the philosopher friend.

  The closing line is crucial since it's the actual performative part. It must avoid phrases like "become married" (false to the clerk) or "already married" (reveals secret). The toast should be warm, not clever, and not reduce the marriage to paperwork.

  Hmm, how to structure this... Start with personal anecdotes about the couple's relationship, highlight their commitment over time, and weave in the "suspension" idea metaphorically. Mention waiting and fulfillment without specifics. Use phrases like "promise waiting for its moment" to imply the delayed legal recognition. Emphasize that ceremonies are affirmations of existing bonds, not the creation of them. 

  For the closing line, something inclusive that focuses on collective support: "To promises kept, love honored, and the beautiful unfolding of what began long ago." It acknowledges the past commitment ("promises kept") and the present celebration ("love honored") while staying ambiguous about legalities.

  Need to avoid clichés about love or state recognition. Ensure every listener hears sincerity regardless of their knowledge. The philosopher should catch the Austin references (felicity conditions, uptake) through subtle wording without explicit mentions. The grandmother shouldn't feel insulted by dismissal of legalities. Kids and party-focused friends should still feel the warmth and joy.

  Also, address the user's personal stake - their own upcoming friend-officiated wedding. Show that paperwork matters but isn't the essence. Maybe include a line about how witnessing the brother's journey taught the importance of both heart and formal care, tying back to the user's role as "paperwork checker" now.

  Finally, keep it around 700 words, warm tone, ending with a unifying toast that doesn't reveal secrets or offend sensibilities. The suspension concept can work if framed as poetic imagery rather than theoretical argument.
