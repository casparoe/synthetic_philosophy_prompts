  **Q1:** In the cloth by candlelight case, when the same experience is described over {green, blue, violet} (yielding 0.7/0.25/0.05) and over {green, not-green} (yielding 0.7/0.3), Jeffrey conditioning gives different results. Is this partition-dependence acceptable?  
  - **A. Yes** (go to Q2)  
  - **B. No** (go to Q3)  
  - **C. Neither—the experience doesn't "set" a partition** (go to Q4)  
  - **D. Both—the experience sets both partitions** (go to Q5)  

  **Q2 (from A):** In the half-heard message case, does the shift to 0.7 credence in "green" carry information about cloth defectiveness *beyond* what the new color credences alone imply?  
  - **A. Yes** (go to Q6)  
  - **B. No** (go to Q7)  

  **Q3 (from B):** Should two back-to-back updates (e.g., color then material) commute (i.e., yield the same result regardless of order)?  
  - **A. Yes, order-independence is necessary** (Leaf: **Skeptical Underdetermination**)  
  - **B. No, order-dependence is acceptable** (Leaf: **Path-Dependent Generalization**)  

  **Q4 (from C):** In the calibration readout case (neurologist predicts your future 0.7 credence in green), should you set your *current* credence in green to 0.7?  
  - **A. Yes** (Leaf: **Reflection-Based Updating**)  
