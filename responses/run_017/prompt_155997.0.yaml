  - **B. No** (Leaf: **Contextual Certain Evidence**)  

  **Q7 (from B in Q2):** In the calibration readout case, should you set your current credence in green to 0.7?  
  - **A. Yes** (Leaf: **Minimum Cross-Entropy**)  
  - **B. No** (Leaf: **Jeffrey Conditioning**)  

  **Q8 (from B in Q4):** In the implant case, can the rule be applied?  
  - **A. Yes** (Leaf: **Likelihood-Ratio Updating**)  
  - **B. No** (Leaf: **Contextual Certain Evidence**)  

  ---

  ### Leaves (Positions)
  1. **Jeffrey Conditioning**  
     - *Path:* Q1=A → Q2=B → Q7=B  
     - *View:* Update via rigidity (keep conditionals fixed given the partition). Rejects extra info in Q2, ignores calibration in Q7.  
