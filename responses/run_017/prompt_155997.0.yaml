     - *View:* Always a proposition about the experience (e.g., "seemed greenish") becomes certain; use plain conditionalization.  
     - *Handles cases:* 1 (via evidence proposition), 5 (with concept-formation), 6 (perceptual only). Fails on 2–4.  

  3. **Minimum Cross-Entropy**  
     - *Path:* Q1=A → Q2=B → Q7=A  
     - *View:* Minimize KL-divergence subject to constraints. Accepts partition-dependence but handles calibration via constraint.  
     - *Handles cases:* 1–4. Fails on 5–6.  
     - *Collapse note:* Equivalent to Jeffrey conditioning *if* only partition constraints given (both use rigidity). Differs when constraints are richer (e.g., Q7=A exploits this).  

  4. **Likelihood-Ratio Updating**  
