  - **Collapsed Pair:** Minimum Cross-Entropy and Jeffrey Conditioning are equivalent *when only partition probabilities are constrained* (both reduce to rigidity). They diverge when constraints include non-partition elements (e.g., direct credence constraints like P(G)=0.7 in calibration).  
