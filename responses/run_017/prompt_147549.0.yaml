answer: |-
  ### Diagnostic Instrument: Classifying Societal Change  
  This instrument uses 8 diagnostic questions with schematic case descriptions to sort a given case into a named theoretical position on "collapse." Each question probes one axis of the logical space without presupposing prior verdicts. Answers are combined via a scoring key to assign the case to one or more positions.  

  #### Diagnostic Questions  
  1. **Subject of Change**: What primarily declines or disappears in the case?  
     - A) Governing institutions (state, bureaucracy, central authority)  
     - B) Cultural repertoire (literacy, elite styles, monumental construction)  
     - C) Population (size/density)  
     - D) Regional complexity (settlement hierarchy, exchange networks)  

  2. **Evaluative Impact**: For whom did the change worsen conditions?  
     - A) Elites (ruling/privileged classes)  
     - B) Median person (typical member of society)  
     - C) Future generations (people living 2+ generations later)  
     - D) No group experienced worse conditions; some improved.  

  3. **Rate of Change**: Over what timespan did the most significant changes occur?  
     - A) Rapid (≤ 1–2 generations)  
     - B) Gradual (≥ 3 centuries)  
     - C) Indeterminate/not concentrated  

  4. **Agency**: How did participants view the change?  
     - A) Resisted/regretted (described as catastrophe)  
     - B) Embraced/celebrated (described as liberation or improvement)  
     - C) Mixed/unknown  

  5. **Reversibility**: Did comparable complexity reassemble later?  
     - A) Yes, within ≤ 5 centuries  
     - B) Yes, but after > 5 centuries  
     - C) No/not observed  

  6. **Bounded Unit**: Was the society a discrete entity pre-change?  
     - A) Yes (clearly bounded polity/culture)  
     - B) No (network/region without clear boundaries)  

  7. **Case: Population Replacement**: A polity’s entire population is replaced over two generations (e.g., via migration/disease). Administrative systems (tax, archives) continue unchanged locally. What changed?  
     - A) Only population  
     - B) Governing institutions (due to external control)  
     - C) Nothing essential (systems persist)  

  8. **Case: Celebratory Collapse**: Participants describe the change as positive (e.g., "liberation from tyranny"), but external observers (e.g., neighboring states) label it a catastrophe. Whose perspective is more reliable?  
     - A) Participants’ view (insider lens)  
     - B) External view (comparative civilizational lens)  
     - C) Neither (require non-partisan standard)  

  ---

  #### Scoring Key  
  Map answers to positions using the table below. A case is classified under a position if it meets **all** listed criteria. A case may fit multiple positions.  

  | Named Position                  | Criteria (Answer Combinations)                                                                 | Verdict on Case       |  
  |---------------------------------|------------------------------------------------------------------------------------------------|-----------------------|  
  | **Institutional-Collapse Minimalism** | Q1 = A; Q7 ≠ C; AND (Q3 = A OR Q3 = C)                                                        | Collapse             |  
  | **Demographic View**            | Q1 = C; Q5 ≠ A; AND Q7 = A                                                                    | Collapse             |  
  | **Complexity-Loss View**        | Q1 = D; Q2 ≠ D; AND (Q5 = C OR Q5 = B)                                                        | Collapse             |  
  | **Legibility Collapse**         | Q1 = B; Q6 = A; AND (Q8 = B OR Q8 = C)                                                        | Collapse             |  
  | **Evaluative View**             | Q2 = A, B, or C; AND Q4 = A; AND (Q3 = A OR Q3 = C)                                           | Collapse             |  
  | **Transformationist**           | Q2 = D; OR Q4 = B; OR (Q3 = B AND Q5 = A); OR Q7 = C                                          | Transformation       |  
  | **Eliminativist**               | Q6 = B; OR (Q8 = C AND Q2 = D); OR (Q5 = A AND Q1 ≠ A)                                        | Category N/A         |  

  **Notes**:  
  - **Q7 and Q8** are tiebreakers for ambiguous cases (e.g., Q7 distinguishes demographic vs. institutional views; Q8 resolves agency/evaluative conflicts).  
  - **Rate (Q3)**: Treated as independent but subordinate. Gradual change (B) only prevents "collapse" verdicts if it triggers transformationism (e.g., slow change + quick reversal).  
  - **Reversibility (Q5)**: Only critical for complexity-loss (irreversible) and transformationism (quick reversal).  

  ---

  #### Named Positions and Their Commitments  
  1. **Institutional-Collapse Minimalism**  
     Collapse = Disappearance of governing institutions. Ignores cultural/population continuity.  
     *Most awkward commitment*: Labels a case "collapse" even if population, culture, and daily life continue unchanged (e.g., Question 7’s population replacement case).  

  2. **Demographic View**  
     Collapse = Significant population decline. Institutions/culture are secondary.  
     *Most awkward commitment*: Calls near-total depopulation a "collapse" even if institutions persist under new people (e.g., Question 7).  

  3. **Complexity-Loss View**  
     Collapse = Irreversible decline in socio-ecological complexity (settlement hierarchies, marginal returns).  
     *Most awkward commitment*: Labels a case "collapse" if complexity drops, even if health/equity improve (e.g., idealized case with better skeletal indicators).  

  4. **Legibility Collapse**  
     Collapse = Loss of a society’s capacity to "describe itself" (literacy, archives, administrative legibility).  
     *Most awkward commitment*: Ignores improvements in well-being if self-documentation is lost.  

  5. **Evaluative View**  
     Collapse = Normative decline for a group (elites, median, or future generations).  
     *Most awkward commitment*: Rejects cases as "non-collapse" if elites suffer but the median person benefits.  

  6. **Transformationist**  
     Rejects "collapse"; all change is reorganization or lateral shift.  
     *Most awkward commitment*: Labels even catastrophic, rapid disintegration as "transformation" if participants welcomed it (e.g., Question 8’s celebratory case).  

  7. **Eliminativist**  
     Rejects "collapse" as a cross-culturally valid category.  
     *Most awkward commitment*: Dismisses clear institutional disintegration (e.g., palatial destruction) if the society was unbounded.  

  ---

  #### Unoccupied Cells in the Logical Space  
  1. **Rapid, Reversible, Elite-Only Negative Change**  
     *Diagnosis*: Unexplored. Logically coherent (e.g., a palace coup that briefly topples a king but restores similar institutions within years), but most theories ignore it as "instability," not collapse.  

  2. **Gradual Change + Participant Celebration + Irreversibility**  
     *Diagnosis*: Unattractive. Celebrates change but calls it "collapse" due to irreversibility, creating tension (e.g., Question 8’s case if outsiders are "correct"). No position accepts this.  

  3. **Unbounded Unit + Population Decline + Institutional Continuity**  
     *Diagnosis*: Incoherent for collapse theories. If a network has no discrete society, population loss is "migration," not collapse (e.g., Eliminativist position covers this).  

  ---

  #### Indistinguishable Positions and Tree Limitations  
  - **Institutional-Collapse vs. Legibility Collapse**: Cannot separate cases where governing institutions and literacy/legibility disappear together (e.g., Mycenaean palatial collapse).  
     *Assessment*: Add a question: *"Did administrative systems (tax, laws, archives) vanish before institutions?"* If yes, Legibility; if simultaneous, both apply.  
  - **Complexity-Loss vs. Evaluative Views**: Cannot separate cases where complexity loss causes median-person suffering (e.g., famine from trade collapse).  
     *Assessment*: Inherent overlap; these positions often coincide. No further question resolves it.  
  - **Rate (Q3) Independence**: Confirmed. Rate does not collapse into Evaluative (Q2); e.g., rapid change can be non-evaluative (institutional view), and gradual change can be negative (complexity-loss).  

  ---  
  **Instrument Summary**: 8 questions, 7 positions. Test with the four idealized cases (e.g., Question 7’s replacement case → Demographic View; Question 8’s celebratory case → Transformationist). Real cases (e.g., 1200 BCE Mediterranean → Institutional-Collapse + Complexity-Loss) validate the structure. Tree limitations reflect theoretical overlaps in the literature.
