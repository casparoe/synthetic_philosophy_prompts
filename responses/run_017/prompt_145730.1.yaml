prompt: |-
  I teach a third-year seminar on philosophy of action and social ontology — 17 students this term, and my department just moved us to 80-minute blocks, so I'm still getting used to having more time than I know what to do with. We've read a bit of Bratman and a bit of Gilbert, and the same thing keeps happening: everyone nods along when we say that a joint action isn't just several people each doing something that happens to add up, and then they go straight back to drawing it that way the moment we hit a hard case. Two years ago I tried the demo where two students carry a table out of the room and I ask who did what; it was useless, everyone just said "we did it" and looked at me like I was wasting their time. Separately, I was talking to a colleague down in psychology who works on joint attention in toddlers, and she made the offhand remark that very young kids seem to coordinate on things they can't possibly have any overall conception of — they're tracking a local cue, not a shared goal — and I haven't been able to stop chewing on that.

  So I want a real activity this time: rules, roles, small stakes, where they run into the problem before it has a name. Constraints: no real money (points toward a coffee voucher are fine), no more than about 50 minutes of actual play so I keep 30 for debrief, and nothing needing prep beyond envelopes, index cards, a stopwatch and a whiteboard. I don't want to say "shared intention," "we-intention," or "joint commitment" out loud until the debrief.

  The contrast I want them to feel has a few faces, and I'd like the rounds arranged so they hit them in this order, more or less. First: a case where nobody in the group has the whole plan — each person only gets their own fragment and only gets local feedback about whether they're on track — and yet they still succeed, and they still get quietly annoyed at anyone who slacks, and afterwards they still describe it as something *we* did. Second: a case where the group succeeds smoothly and everyone is fully informed and fully cooperative, except that one member was privately instructed to be a pure mercenary — they don't care about the group at all, they're only maximising their own points, they'd walk if a better offer came along — and nobody else knows this. Third: a case where the group has to choose what to do by majority vote, and someone who voted against then has to carry out the winning option; afterwards "we did it" feels wrong in their mouth, but from outside it's obvious that the group did it. My own suspicion, which I'd rather the activity test than assume, is that the "we" isn't really in anyone's head at all — it's in the structure: roles, procedures, who can call things off, who can be rebuked and by whom. But I want at least one round set up so that this suspicion could lose, and lose visibly, because the students should be arguing with each other and not just with me.

  What I need from you is the activity itself, and I'd like it in these sections, roughly this long:

  **Setup and materials** — about 150 words: what I prepare, what each envelope contains, how groups are formed.
  **The rounds** — about 600 words: three rounds with concrete rules, the secret role cards, and a payoff scheme that makes the relevant choice bite without money.
  **Minute-by-minute** — about 150 words: a timeline for the 80 minutes including what I'm doing while they play.
  **Debrief** — about 450 words: the order in which I reveal what, which moment in the play maps onto which theoretical option, and the questions that get them to say the distinction themselves before I name it.
  **What will go wrong** — about 250 words: the predictable failures and how to handle them (someone working out that there are secret cards, a group finishing early, someone refusing a role, the vote landing on the one person who can't do the task).
  **What the activity can't show** — about 200 words: the part of the theory that has to come from me in lecture form, especially anything about the normativity of joint action that a coffee voucher can't buy.

  **Settled vs contested** — about 200 words: in your notes to me, seperate what's close to consensus among people who work on this from what's a live fight, and flag anywhere your design quietly rigs the intuition toward one theory. Please don't write the debrief as though my "structure not heads" hunch were the received view — if it's a minority position, say so and say what the majority would make of the same rounds.
reasoning: |-
  Okay, the user teaches a third-year philosophy seminar on action and social ontology. They're struggling to get students to grasp that joint action isn't just individual actions adding up. Past attempts, like having students carry a table, didn't work because students just said "we did it" without deeper understanding. They want a structured activity with three specific scenarios to illustrate different facets of joint action without using theoretical terms upfront. 

  The constraints are clear: no real money, under 50 minutes playtime, minimal materials (envelopes, index cards, etc.). The three rounds need to address distributed knowledge without full plans, hidden mercenary intent, and post-vote dissonance. The user suspects the "we" is in the structure, not individual minds, but wants the activity to test this, not assume it. 

  Hmm, the key challenge is designing gameplay that forces the intended experiential contrasts. The distributed knowledge round requires a task where no single player has the full picture but success depends on interdependent local actions. The mercenary round needs a payoff structure where individual maximization aligns with group success but feels different when unmasked. The voting round must create personal conflict between dissent and participation. 

  For materials, index cards can encode fragmented rules and secret roles. Coffee voucher points incentivize engagement without real money. Groups of 5-6 allow complexity while fitting time limits. The "Symbol Relay" task works for Round 1 - it's modular, requires sequential coordination, and players only see adjacent steps. 

  Round 2's mercenary role is tricky. The payoff must reward team success while giving the mercenary a reason to cooperate (higher personal points). But if revealed, it should undermine the "we" feeling. Need to ensure other players can't detect the mercenary's motives during play. 

  Round 3's voting mechanic must force dissenters to enact the group decision. The "Symbol Swap" task is good here - it's simple enough for one reluctant player to execute, but participation feels alienating. 

  Timing is tight. 15 minutes per round plus transitions and debrief. Need to watch for groups finishing early (have filler tasks) or stalling (simplify on the fly). The mercenary role might cause drama if exposed early - prepare backup roles. 

  Debrief should mirror the round sequence, drawing out contrasts: "When you succeeded without the full plan, what made it feel joint?" → "Did anyone suspect hidden motives?" → "How did enacting a decision you opposed change your 'we' feeling?" Only then introduce Bratman/Gilbert. 

  The user's structuralist hunch is non-standard. Most theorists (Gilbert especially) see joint commitment as mental. The activity might tilt structural because mechanics overshadow internal states. To balance, in debrief I'll note: "Some felt the roles forced cooperation regardless of intent - does that match Bratman's shared intention?" 

  Limitations: Normative dimensions (obligation to participate, rebuke rights) won't emerge strongly from points. The activity can't show how joint intentions form spontaneously without rules. Lecture supplements will be needed for Gilbert's plural subject theory versus Bratman's intention-meshing. 

  Biggest risks: Students might brute-force Round 1 by sharing instructions (mitigation: forbid talking). Mercenaries might confess (add a penalty). Voting ties could occur (tiebreaker rule). If structuralism dominates discussion, I'll play devil's advocate: "What if the mercenary secretly loved the team? Would that change the 'we'?"
answer: |-
  Here’s a structured activity ("The Coordination Cascade") designed to meet your constraints and pedagogical goals, with clear sections and theoretical neutrality:

  ---

  ### **Setup and Materials**  
  *Prep:* Create 3 identical stations (tables) with envelopes labeled Round 1–3. For **Round 1**: 6 index cards per group, each with a unique symbol (e.g., ▲, ●, ■) and a private rule (e.g., "If you see ●, draw ◼"). **Round 2**: Add "Secret Role" cards (5 "Team Player", 1 "Mercenary" per group). **Round 3**: Voting slips + task cards (e.g., "Rearrange chairs in a circle"). Groups of 5–6 students (3 groups max). Whiteboard tracks group points (5 pts/round win; +2 individual "bonus" for Mercenary if group wins).  

  ---

  ### **The Rounds**  
  *(Total gameplay: 45–50 min)*  

  1. **Distributed Knowledge Round (15 min)**  
     - *Task:* Groups sequentially draw symbols on a shared paper based on previous symbols and their private rules. No talking; each sees only the prior symbol.  
     - *Goal:* Produce a valid sequence (e.g., ▲→●→■→▲).  
     - *Twist:* No one knows the full sequence; success requires adhering to local cues.  
     - *Payoff:* Group wins 5 pts if sequence is valid.  

  2. **Hidden Mercenary Round (15 min)**  
     - *Task:* Same symbol task, but players may talk and strategize.  
     - *Secret Roles:* "Mercenary" card (hidden): *"You earn +2 personal points if your group wins, but you care ONLY about your points. Cooperate only if it benefits you."* Others get "Team Player" cards.  
     - *Payoff:* Group wins 5 pts; Mercenary gets +2 extra if group succeeds.  

  3. **Coerced Participation Round (15 min)**  
     - *Task:* Groups vote on 1 of 3 simple tasks (e.g., "Write a group haiku", "Build a card tower", "List 10 capitals"). Majority wins.  
     - *Twist:* One randomly chosen member (who voted *against* the task) must perform it alone while others watch.  
     - *Payoff:* Group wins 5 pts if the task is completed.  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0–5 min:** Split into groups, explain Round 1 rules.  
  - **5–20 min:** Round 1 gameplay (circulate, enforce silence).  
  - **20–25 min:** Quick vote: "Did it feel like *your* action or *our* action?" (Whiteboard tally).  
  - **25–40 min:** Round 2 (distribute secret roles, allow talk).  
  - **40–55 min:** Round 3 (vote, assign dissenters tasks).  
  - **55–80 min:** **Debrief** (see below).  

  ---

  ### **Debrief Sequence**  
  *(Start concrete → tease out theory)*  
  1. **Round 1 Reflection (10 min):**  
     - *Q:* "You succeeded without knowing the plan—why did slackers annoy you?" → Elicit *implicit expectations* and *mutual rebuke*.  
     - *Reveal:* "This maps to Bratman’s puzzle: coordination without shared intention."  

  2. **Round 2 Reveal (10 min):**  
     - *Q:* "Did anyone suspect hidden motives? If you knew someone was selfish, would ‘we’ still apply?"  
     - *Reveal:* Mercenary role → "Gilbert says joint commitment requires mutual recognition. Did the structure override intent?"  

  3. **Round 3 Tension (10 min):**  
     - *Q to dissenters:* "You did the task but opposed it. Can you say ‘*we* did this’?"  
     - *Contrast:* "Group success vs. personal alienation → Collective responsibility without consensus."  
  4. **Theoretical Synthesis (15 min):**  
     - *Prompt:* "Where was the ‘we’? In your heads? In the rules? In who could blame whom?"  
     - *Name terms:* Introduce "shared intention", "joint commitment", and "structuralist" views only now.  

  ---

  ### **What Will Go Wrong**  
  - **Mercenary exposed:** If a student reveals their role, emphasize: "How did the *possibility* of hidden motives affect trust?"  
  - **Group finishes early:** Add a "bonus challenge" (e.g., "Achieve a second sequence with new rules").  
  - **Refusing a role:** Assign a backup "observer" role (note how decisions are made).  
  - **Vote ties:** Flip a coin; dissent is still visible.  
  - **Suspicion of secrets:** Acknowledge it: "Yes, roles were hidden—does that undermine the ‘we’?"  

  ---

  ### **What the Activity Can’t Show**  
  - **Normativity:** Coffee points can’t replicate moral obligations (e.g., rebuke *rights* in Gilbert). Lecture supplement: Contrast a team handshake (voluntary commitment) with a coerced workgroup.  
  - **Dynamic formation:** The activity assumes fixed rules; real joint actions often negotiate goals ad hoc. Use Bratman’s "planning theory" to discuss flexibility.  
  - **Pre-linguistic cues:** Toddler-like coordination (as per your colleague) requires video examples.  

  ---

  ### **Settled vs. Contested (Design Notes)**  
  - **Consensus:** All agree joint action ≠ aggregate individual actions (your key hurdle). Gilbert/Bratman both accept normativity (slacker rebuke is legitimate).  
  - **Contested:**  
    - *Your hunch (structuralism)* is minority (e.g., Tollefsen, Epstein). Majority (Bratman, Gilbert, Searle) locates "we" in mental states.  
    - **Design bias:** Rounds 1–2 subtly favor structuralism (success without shared goal/commitment). Round 3 favors Gilbert (alienation highlights need for mutual buy-in).  
    - **Neutralizing bias:** In debrief, stress: "Did the *feeling* of joint action persist even when mechanics allowed ‘faking’?" → Lets students argue internalism vs. structuralism.  

  ---

  **Why this works:** The symbol task forces distributed coordination, the mercenary injects hidden motives without sabotage, and voting creates first-person dissonance. By withholding theory until debrief, students articulate the "we" problem *from experience*, setting up your structuralist view as a live option—not dogma.
