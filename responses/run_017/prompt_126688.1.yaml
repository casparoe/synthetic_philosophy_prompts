prompt: |-
  I'm a journalist covering science and ideas, and a style-guide fight at our newsroom pushed me into a question I can't settle on my own: what rule am I actually applying when I say it's fine to put a claim in the paper and not fine to put it in a tweet, or fine for the outlet to say something that no individual reporter would be allowed to say? I've tried listing my own verdicts, going by gut, and they don't arrange themselves neatly. Checking the airline app, which I know is right maybe ninety-seven times out of a hundred, and telling my taxi driver the flight leaves from B12: fine. Telling a friend who is holding a ticket that you're not going to win, where the odds are incomparably better: not fine, and I feel it's not fine even though the number is on my side. Writing, on the word of a source I trust and cannot myself evaluate, that the replication failed: fine, even though I couldn't reconstruct a single step of the statistics. Saying the same sentence as an expert witness under oath: not fine. Our masthead saying the minister is expected to resign, where three reporters each hold a fragment and no one has the whole: fine, and sometimes obligatory; the individual reporter saying the minister will resign: not fine. A press officer reading out a statement she privately believes is false: not fine, but it registers to me as a different and lesser wrong than a friend lying to my face, and I can't articulate the difference. Telling a soaked colleague that it's raining: weird, but not a violation of anything. Asserting something true to an audience I know will hear it as licence for something false: not fine, though I suspect here I'm blaming the norm of assertion for what is really a norm about consequences. And then there is the one that feels like the hardest datum: I cannot say, even silently, the story will run tomorrow, but I don't know that it will — the thing jams before it gets out. My own candidate, which the style-guide fight produced, is a two-part rule: you may assert p only if you could answer "how do you know?" without bluffing, and the grounds that would satisfy that question in the pub must also be grounds you'd be willing to have scrutinized by whoever will act on it. I'd rather keep the replication/oath pair and the last datum than keep the app-versus-lottery asymmetry, if I have to choose.

  So: is there a principle, or a short list of serious candidates, that gets this pattern or nearly all of it — knowledge, true belief, justified belief, reasonable-to-believe, something audience-relative, something stakes-relative? Please state whichever principle you favour precisely enough that it generates verdicts, tell me which clause is doing the work in each of the cases above, and be explicit about which of my verdicts it forces me to abandon and whether the asymmetry I'm least attached to is really the one that has to go. Test my two-part rule against the cases and tell me whether it can be repaired or whether it collapses into one of the standard options. Then use whatever survives on three cases I haven't listed: an automated account of ours that posts the airport is open straight off a data feed, with no human who checked; a reporter asserting, in the paper's voice, a claim she believes on the word of a source she knows has lied in the past but not about this; and the one I keep returning to, our election-night projection, where the model puts a candidate at ninety-two per cent and someone has to decide whether we get to write that she has won.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is a journalist dealing with a style-guide conflict in their newsroom. They're struggling to articulate the rule that distinguishes when it's acceptable to assert something in different contexts. For example, it's okay to publish a claim in the paper but not tweet it, or for the outlet to say something that an individual reporter can't. They've listed various scenarios where their gut feeling says something is fine or not, but they can't find a consistent principle.

  First, I need to parse all the examples they provided. They mention things like trusting an airline app to tell a taxi driver the gate number is fine, but telling a friend they won't win the lottery isn't, even with good odds. Publishing a replication failure based on a trusted source is okay, but saying the same under oath isn't. The masthead reporting a minister's resignation based on multiple sources is fine, but an individual reporter saying it isn't. A press officer reading a false statement is less wrong than a friend lying. Saying it's raining to a soaked colleague is weird but not wrong. Asserting something true that might be misinterpreted isn't okay. And they can't even think the story will run tomorrow without knowing for sure.

  Their proposed rule has two parts: assert only if you can answer "how do you know?" without bluffing, and the grounds should withstand scrutiny by those who act on it. They want to keep the replication/oath pair and the last datum over the app/lottery asymmetry.

  Now, I need to recall philosophical concepts related to assertion. Knowledge norms, justification, belief, stakes, audience. The user mentions these as possible candidates. The knowledge norm says you should only assert what you know. But in their examples, sometimes they're okay asserting without knowledge (like the airline app, which they know is sometimes wrong). Justified true belief might not fit because in the replication case, they have justification via a source but wouldn't testify under oath. So maybe contextual factors like stakes or audience matter.

  Looking at their cases: High-stakes vs low-stakes situations. Lottery is high-stakes emotionally? But the airline app is also high-stakes if missing a flight. Maybe the difference is the type of action taken. The lottery affects the friend's hope, whereas the app is a practical guide. The oath scenario involves legal consequences, so higher stakes. The masthead example: institutional backing distributes responsibility, so it's not just individual knowledge. The press officer: role-based assertion vs personal, which changes the accountability.

  Their two-part rule: Answering "how do you know?" without bluffing. In the airline case, they can say the app is reliable. For the lottery, saying "the odds" might not satisfy the friend. But in the replication, they cite the source, which is acceptable in journalism but not in court. The scrutiny part: for the minister's resignation, the reporters' fragments hold up to scrutiny collectively. Under oath, the source isn't sufficient. So their rule might work if "scrutiny" is context-dependent. But the lottery case is tricky because the grounds (odds) are solid mathematically, but emotionally insufficient. The user is willing to drop this asymmetry, so maybe it's an outlier.

  Cases to test: Automated airport status post—no human check, but the data feed is reliable. Under their rule, they can answer "how?" by citing the feed, and if it's generally reliable, scrutiny might hold. Reporter using a previously lying source: if the source is trusted on this topic, maybe okay, but scrutiny could be an issue if the past lies are known. Election projection at 92%: asserting win requires high confidence. The model's reliability and stakes matter. If the norm is knowledge, but 92% isn't 100%, so not knowledge. But news outlets call elections based on models. So maybe a justified belief norm with high stakes requiring more justification.

  Possible principle: Warranted assertibility, where justification depends on context. High stakes require stronger evidence. Roles (reporter vs outlet) change the required warrant. But need a precise formulation. Or a combination of epistemic and practical norms. The user's two-part rule might need tweaking: the scrutiny part could include audience and stakes. For example, grounds must withstand scrutiny appropriate to the context. In court, higher scrutiny than in a pub. 

  Abandoning the lottery asymmetry: The user prefers to keep other cases, so accepting that telling the friend they won't win is actually acceptable under the rule might be necessary. But their gut says no, so maybe there's a separate norm about not crushing hope, unrelated to assertion norms. So the rule holds, but other factors apply.

  New cases: Automated post—assertion is fine because the data feed's reliability meets scrutiny. Reporter with lying source—if the grounds (source's info on this topic) hold up to scrutiny, okay. But if past lies undermine credibility, maybe not. Election call: at 92%, if the model is vetted and reliable, asserting win is acceptable in journalism context, but not in a legal setting. The scrutiny would involve checking the model's accuracy history, which the outlet should do before calling.
answer: |-
  Your struggle captures a profound tension in assertion norms—balancing epistemic rigor with practical communication needs across contexts. Your cases reveal that no single standard (knowledge, justification, etc.) suffices; instead, **role-graded warranted assertibility** emerges as the most coherent principle. Here's a precise formulation:

  ### The Principle: Role-Graded Warranted Assertibility
  **You may assert *p* only if:**  
  (1) **Your warrant meets contextually required epistemic thresholds** (stakes, audience, institutional role), *and*  
  (2) **You stand accountable for *p* in a manner appropriate to your role** (individual vs. institutional, public vs. private).

  **Key mechanics:**  
  - **Warrant** = grounds that make *p* objectively probable *and* subjectively reasonable for you.  
  - **Contextual thresholds** escalate with stakes, consequences of error, and audience reliance.  
  - **Accountability** binds you to downstream scrutiny proportional to your role’s authority (e.g., a masthead assumes institutional accountability; an expert witness assumes personal liability).  

  ---

  ### Analysis of Your Cases
  | Your Case                          | Verdict | How the Principle Applies | Clause Doing the Work |
  |------------------------------------|---------|---------------------------|-----------------------|
  | **Airline app → taxi driver**      | Fine    | Low stakes for *you* (taxi can reroute); app’s 97% reliability meets threshold for casual advice. | (1) Threshold low due to low-stakes context. |
  | **Lottery → friend**               | Not fine | Stakes are high (emotional harm); 99.9% odds ≠ certainty, and you lack *role* to deliver crushing news. | (1) Threshold high due to stakes; (2) No social mandate to assert. |
  | **Replication failed (article)**   | Fine    | Journalistic role permits trusted-source warrant; thresholds met for public reporting (not certainty). | (1) Institutional threshold satisfied by source protocols. |
  | **Same claim (expert witness)**    | Not fine | Legal context demands personal certainty/certification; source-based warrant insufficient. | (1) Threshold maximal (legal stakes); (2) Personal accountability required. |
  | **Masthead: minister resigns**     | Fine    | Institutional role pools fragmentary evidence into collective warrant; accountability distributed. | (2) Institutional accountability permits aggregated grounds. |
  | **Reporter: minister resigns**     | Not fine | Individual role lacks authority to assert without full warrant; invites undue reliance. | (2) Individual accountability demands direct warrant. |
  | **Press officer: false statement** | Not fine (lesser wrong) | Role-based assertion (accountability deflected to institution); wrong stems from complicity, not personal deceit. | (2) Role reduces *personal* accountability (still institutional wrong). |
  | **"It’s raining" → soaked colleague** | Fine/weird | Warrant obvious; near-zero stakes. No accountability burden. | (1) Threshold minimal. |
  | **True claim → misleading audience** | Not fine | Warrant for *p* exists, but foreseeable misuse violates audience-relative thresholds. | (1) Contextual threshold includes foreseeable interpretation. |
  | **"Story runs tomorrow" (silent)** | Not assertible | Cannot meet *personal* threshold for future contingency; no role-based warrant to override. | (1) Stakes (professional credibility) raise threshold beyond your warrant. |

  **Asymmetry sacrificed:** Your app/lottery asymmetry **must go**—it’s inconsistent. Under this principle, both cases hinge on *stakes + role*, not probability. If you had a *duty* to warn your friend (e.g., they’re bankrupting themselves), asserting might be permitted. The gut aversion stems from relational norms, not assertion itself.

  ---

  ### Your Two-Part Rule: Assessment & Repair
  Your proposal:  
  *Assert if (a) You can answer "how do you know?" without bluffing, and (b) Grounds withstand scrutiny by those who act on it.*  

  **Where it works:**  
  - Explains **replication/article** (source answers "how"; scrutiny by readers).  
  - Explains **oath** failure (source won’t withstand legal scrutiny).  
  - Captures **masthead** (collective scrutiny satisfies (b)).  

  **Where it fails:**  
  - **Lottery:** You *can* answer "odds" without bluffing, and mathematicians would accept it. Yet you veto it.  
  - **Press officer:** She *can* answer "my employer told me"—bluffing? Debatable. Scrutiny by public? Not her problem.  
  - **"Raining" case:** (a) and (b) satisfied, but feels weird—over-permissive.  

  **Repair:** Merge it into role-graded warranted assertibility:  
  - (a) → **subjective warrant** (you have non-bluff grounds).  
  - (b) → **contextual scrutiny** (grounds must survive *role-appropriate* examination).  

  This becomes a special case of the principle above.

  ---

  ### New Cases Tested
  **1. Automated airport status post (no human check)**  
  - **Verdict:** Fine  
  - **Why:** Institutional role permits reliance on vetted data feeds. Warrant lies in system reliability (tested historically). Accountability rests with the *system*, not an individual.  
  - *Clause:* (1) Threshold low (users can verify); (2) Institutional accountability.  

  **2. Reporter asserts claim via source who lied before (but not on this topic)**  
  - **Verdict:** Not fine  
  - **Why:** Source’s history undermines warrant *unless* corroborated. Personal accountability as bylined reporter demands higher threshold.  
  - *Clause:* (1) Warrant insufficient for stakes (audience relies on reporter’s judgment); (2) No institutional shield for individual assertion.  

  **3. Election-night call at 92% probability**  
  - **Verdict:** Fine to assert "has won" *if* institutional policy permits  
  - **Why:** At 92% with robust models, *institutional warrant* exists (history of accuracy, error protocols). Individual reporter couldn’t assert this alone—but the *outlet* can, pooling model+analyst consensus.  
  - *Clause:* (2) Institutional accountability absorbs risk; (1) Threshold met by statistical confidence + editorial guidelines.  

  ---

  ### Why This Principle Wins
  - **Saves your core:** Retains replication/oath and "story runs" cases while resolving asymmetry via stakes/roles.  
  - **Handles gradience:** Explains why some assertions are *merely* improper (press officer) vs. unethical (friend lying).  
  - **Journalism-fit:** Acknowledges institutional epistemology—newsrooms aggregate knowledge no individual possesses.  
  - **Flexible rigor:** Warrant thresholds scale with consequences (e.g., election call vs. rain observation).  

  **Final refinement:** Add a *sincerity condition* to handle the press officer case: *"In roles permitting warranted deflection (e.g., PR), you need not personally believe p, but must not assert if you know p is false."* This splits the difference—less wrong than a friend’s lie because the audience *expects* institutional messaging.  

  This framework accepts all your verdicts except the lottery/app asymmetry—which, as you suspected, is the price of coherence. The deeper pattern? **Assertion is a social act: its ethics turn on who you are, who you’re speaking to, and what hangs in the balance.**
