prompt: |-
  I'm giving a short paper to our reading group next month — working title something like "is lawhood extrinsic?" — and the claim I want to defend is that on a Lewis-style best-system (Humean) account, whether a perfectly respectable regularity counts as a law of nature can depend on what's happening in a part of the mosaic that has no causal or nomic connection to it at all, whilst on an anti-Humean picture it can't. Use whichever anti-Humean you can make the case work with — Armstrong-style necessitation between universals, or dispositional essentialism — but say which one you're using. My mate Dave said over a pint afterwards that this is just the "Humeanism can't handle uninstantiated laws" complaint dressed up, and it definately isn't, so the case has to be one where that isn't doing the work.

  What I need you to build me is a single small world, described as a Humean mosaic — finite, no actual infinities, small enough that a determined reader could in principle write the whole thing out — containing a regularity R such that: (a) the best-system Humean has to say R is not a law of nature (if it matters, say whether you're counting laws as all theorems of the best system or only its axioms, and make the case work for your choice); (b) the anti-Humean has to say R is a genuine, exceptionless law; and (c) the only thing driving the two verdicts apart is the globality of the Humean criterion versus the locality of the anti-Humean one. To pin (c) down: give me a comparison world W* that differs from yours only by deleting or altering a region B which is causally and nomically isolated from the region A where R lives, and in W* everyone, Humeans included, says R is a law. So the Humean's verdict flips on the strength of goings-on in a region that by hypothesis can't touch A.

  Cheating, for my purposes, would be any of these: (1) R uninstantiated, barely instantiated, or sitting in a degenerate one- or two-object world — the standard uninstantiated-laws move; (2) R accidental in the all-gold-spheres-are-under-a-mile-wide sense — it needs to be projectible, support the ordinary counterfactuals, be the thing you'd cite in an explanation, and range over perfectly natural properties, with Lewis's natural-property restriction on the best system's vocabulary firmly in force, so no grue-ish or otherwise gerrymandered predicate gets to help; (3) R a higher-level or special-science generalisation — I know the Mendel's-law / ideal-gas-law dialectic and it isn't what I'm after, so R should be a candidate fundamental regularity; (4) anything in B making a difference to A by causation, shared initial conditions, or both regions answering to one and the same system of laws. If your two regions share natural properties, tell me why that doesn't itself hand the anti-Humean the connection I'm claiming is absent.

  Where I've got stuck, so you don't repeat it: my first attempt was a region A of a million particles tracing a clean inverse-square pattern plus a region B of a billion particles of pure noise, the idea being that the best system blows its whole simplicity budget coping with B and leaves R out. Dave pointed out, correctly and annoyingly, that one more axiom for R costs next to nothing and buys a million instances, so R stays in. So drowning R out won't do it; I suspect what's needed is something in B that actively competes with R — makes some rival system beat the one containing R — but I can't untill now get that to work without sneaking in one of the cheats above.

  Deliverables if you can manage them: (i) the world in one paragraph, with the toy ontology stated up front; (ii) the verdict for each theory with the reasoning, including the rough shape of the simplicity/strength/fit trade-off — no hand-waving, I want to be told roughly what the competing systems look like and why the one that leaves R out wins, and I'd like the win to have some margin rather than being knife-edge (tell me if you can't get margin); (iii) the check against W*, i.e. does the Humean verdict actually flip; (iv) one line on which single feature of the construction is doing the work and what happens if you remove it; (v) the strongest Humean reply you can construct — I'm expecting something like biting the bullet on holism, or arguing the cross-world comparison is illegitimate, or retreating to a local or dynamic version of the best-system account — plus whether that reply costs them anything elsewhere; and (vi) an honest note on where the case is weakest, because Dave will go straight for it.
reasoning: |-
  Okay, let me try to unpack this user's request. They're preparing for a reading group presentation defending the idea that on a Humean best-system account, lawhood can depend on globally isolated regions, unlike anti-Humean views. The user needs a concrete, finite-world example that avoids common objections.

  First, I notice they've already tried and failed with a "drowning out noise" approach. Dave correctly pointed out that adding one simple law for a clean regularity wouldn't cost much. So the key must be competition - something in region B that actively makes an alternative system more attractive than including R. 

  The ontology needs to be minimal but robust. I'm thinking particles with position/momentum, maybe spin as a binary property to create competing symmetries. Natural properties are crucial - can't use gruesome predicates. Region A should show a clear, projectible regularity like constant spin correlation. 

  For region B... ah! What if B contains particles whose spins perfectly correlate in the opposite way? But then they share natural properties, which might give anti-Humeans a connection. Unless... make the spin directions relative to local reference frames! That way same natural properties but no necessary connection. 

  The trade-off: System 1 (with R) describes A perfectly but stumbles on B. System 2 uses a "twisted" rule that covers both regions with one law plus exceptions. Since B is larger, the exception count might be lower overall? Need to calculate the balance carefully. 

  Anti-Humeans won't care about B because no instantiation of universals or disposition connections there. But wait - if properties are truly natural and identical, might Armstrong require a single necessitation relation? Better specify spin as frame-relative to block that. 

  W* is easy - just remove B. Then both theories agree R is law. The flip proves globality does the work. 

  Biggest weakness: Why wouldn't Humeans just use two separate laws? Must argue that violates simplicity - but is that plausible? Might need to make the twisted rule suspiciously simple to force the trade-off. 

  User wants deliverables clearly addressed. Will structure response with: ontology paragraph, world description, then numbered verdicts and defenses. Must emphasize that shared properties don't create connections when directions are frame-relative. 

  Strongest Humean reply? Probably "holism is a feature" - but that undermines locality intuitions. Or they might deny isolation by claiming best system connects them - but that seems circular. 

  Honest weakness: The simplicity metric is fuzzy. Dave might argue adding "except in B" clauses isn't actually simpler than two laws. Need to make B large enough that exception-based system clearly wins.
answer: |-
  Here’s a self-contained case meeting your constraints. The core idea is a **competing symmetry** in the isolated region that forces the best system to adopt a *globally simpler but locally distorted* law, sacrificing R’s lawhood despite its local perfection.

  ---

  ### (i) The World: "Symmetry-Breaker"
  **Ontology:** A finite 2D grid-world with discrete time. Points can be occupied by particles with two fundamental properties:  
  - **Position** (x, y coordinates)  
  - **Spin** (binary: **↑** or **↓**), a perfectly natural property.  
  No other properties, forces, or interactions. The mosaic is just particle positions/spins at each timestep.  

  **Region A (10x10 grid, 100 timesteps):**  
  Every particle always has identical spin to its *right-hand neighbor* (if one exists). E.g., if particle (5,5) is ↑ at t, then (6,5) is ↑ at t. *No exceptions*. Particles without right-neighbors (grid edge) behave randomly. This regularity **R**: "∀ particles *not* on the rightmost column, spin(x,y,t) = spin(x+1,y,t)" holds strictly.  

  **Region B (10x10 grid, 100 timesteps, causally/nomically isolated from A):**  
  Every particle always has spin *opposite* to its right-hand neighbor. E.g., if (5,5) is ↑, then (6,5) is ↓. *No exceptions*. Particles without right-neighbors behave randomly.  

  **The Gap:** A vast empty space separates A and B. No particle in A has ever interacted with, shared properties with (beyond spin itself), or been influenced by B. They share *only* the universal natural property *spin*, instantiated independently.  

  **Total Mosaic:** A + Gap + B. Size: 2x(10x10x100) = 20,000 particle-timestep entries.  

  ---

  ### (ii) Verdicts & Reasoning
  - **Anti-Humean (Armstrong-style):** **R is a law.** Universals (e.g., *spin identity*) are instantiated in A with perfect regularity. The nomic relation **N(spin-identity, spatial-adjacency-right)** holds in A. Region B instantiates a *different* relation **N(spin-opposition, spatial-adjacency-right)**. Isolation means no conflict; laws supervene locally on instantiations.  
  - **Humean Best-System (Laws = Axioms + Theorems):** **R is not a law.**  
    - **Competing Systems:**  
      *System 1 (Local Laws):*  
      - Axiom 1: "In Region A, ∀ particles not on right edge, spin(x,y,t) = spin(x+1,y,t)".  
      - Axiom 2: "In Region B, ∀ particles not on right edge, spin(x,y,t) ≠ spin(x+1,y,t)".  
      *Strength:* Describes all regularities perfectly. *Simplicity:* 2 axioms. *Fit:* Perfect.  
      *System 2 (Global "Twisted" Law):*  
      - Axiom 1: "∀ particles not on right edge, spin(x,y,t) = spin(x+1,y,t) **if in Region A**, spin(x,y,t) ≠ spin(x+1,y,t) **if in Region B**"  
      - *Strength:* Same as System 1. *Simplicity:* **1 axiom** (same logical form, just a disjunctive condition). *Fit:* Perfect.  
    - **Trade-off:** System 2 wins on **simplicity** (1 axiom vs. 2) with equal strength and fit. Its single axiom is only marginally more complex than either axiom in System 1.  
    - **Result:** R is not an axiom. It’s a *theorem* only for Region A within System 2, not a fundamental law. Lawhood requires axiomatic status in the *best* system, which System 2 is.  

  ---

  ### (iii) W* (Delete Region B):  
  - **Mosaic:** Only Region A + Gap exists.  
  - **Humean Verdict:** **R is a law.** The best system now has one simple axiom: "∀ particles not on right edge, spin(x,y,t) = spin(x+1,y,t)" (System 1 without Axiom 2). System 2 isn’t applicable (no B to reference). The verdict **flips** solely due to B’s removal.  
  - **Anti-Humean Verdict:** Unchanged (R is still a law).  

  ---

  ### (iv) Key Feature & Removal  
  - **Doing the Work:** Region B instantiates a **perfect, competing symmetry** (opposition vs. identity) using the *same natural relations* (spin, spatial adjacency). This lets System 2 "compress" both patterns into one axiom with a location-based disjunction, beating System 1 on simplicity.  
  - **Remove It:** If B had *no* symmetry (random spins), System 1 wins (R is a law). If B had the *same* symmetry as A, System 1 still wins (1 axiom covers both, making R a law). The *opposing* symmetry in B creates the competition.  

  ---

  ### (v) Strongest Humean Reply & Cost  
  - **Reply:** "Holism is a virtue. Laws *should* depend on global patterns. System 2’s disjunctive law is genuinely simpler and captures a deeper symmetry: the universe has a *global property* (e.g., ‘region-specific spin correlation’) realized locally. R’s locality is epistemically useful but not ontologically fundamental."  
  - **Cost:** This **undermines locality of law-based explanation**. Why does a particle in A obey R? Because of the *global best system*, which references distant, isolated B. This seems to violate the spirit of Humean supervenience and makes nomic facts "spooky" in a way Humeans reject. It also makes laws less useful for localized prediction (knowing R holds in A requires knowing B’s state).  

  ---

  ### (vi) Honest Weakness  
  **The simplicity margin is slim.** System 2’s axiom is *syntactically* only slightly longer than System 1’s axioms individually, though it has half the axioms. Dave could argue:  
  - *"Is 'if in A then P, if in B then ¬P' really simpler than two separate axioms? It just hides complexity in the disjunction!"*  
  **Rebuttal:** Lewisian simplicity favors fewer axioms. System 2 has one fundamental pattern (region-specific correlation sign) vs. two. But if your reading group weights syntactic brevity heavily, this might feel forced.  
  **Mitigation:** Scale up B (e.g., 100x100 grid) to make the simplicity gain more intuitive. The core logic holds even at this scale, but the margin feels tighter.  

  ---

  ### Why This Avoids Your Cheats  
  1.  **R is instantiated:** 9,900 instances in A (10 cols x 10 rows x 100 ts - 100 edge particles/ts).  
  2.  **R is projectible/supports counterfactuals:** "If a new particle appeared in A not on the edge, its spin *would* match its right neighbor."  
  3.  **R is fundamental:** Uses only natural properties (spin, position).  
  4.  **No causal/nomic connection:** A and B share only the property *spin*, not its instantiations or relations. Armstrong requires *instantiations* of N to ground laws; sharing the universal *spin* doesn’t entail a shared *nomic relation* between regions.  
  5.  **Driven by globality:** W* proves the flip depends solely on B’s presence/pattern.  

  This case isolates "extrinsicality" via a **global simplicity constraint forcing a locally distortive systematization**. Humeanism sacrifices R’s lawhood not because B "drowns it out," but because B offers a way to make the *entire system* simpler by subsuming both regions under one (disjunctive) fundamental pattern.
