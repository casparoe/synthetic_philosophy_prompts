prompt: |-
  You are a philosopher of language who specialises in speech acts and who has spent real time embedded in an institution that has to classify utterances under time pressure. You know the Austinian and Searlean apparatus in detail, and you also know how it degrades when non-specialists try to use it. Before writing anything, do a few paragraphs of private scratch work: list which distinctions from that apparatus could realistically survive translation into a checklist that a three-person committee can run in half an hour, and which cannot survive, and why. Then write the deliverable. Do not open with a summary of the theory, do not give me a literature review, and do not cite anything under any description — I know the literature and I will insert the references myself. What I need is the operational version.

  My situation: I chair the research-integrity committee of a mid-sized scholarly publisher (twelve journals). We handle around two hundred matters a year, and almost every one of them turns, at bottom, on a question of the form *what did this person do in saying this?* — was that message a retraction or a request for one; was it an admission of misconduct or an expression of regret; did it retract consent to authorship, or merely grumble; did a funder's press release withdraw an endorsement or purport to invalidate a paper; was a statement a promise to correct the record or a statement of intention. We currently improvise, and we reliably conflate at least three things I want separated: whether an act was *performed at all* versus whether it was *performed but subsequently defeasible* versus whether it was *performed and effective but mis-classified by us in the record*. I also suspect we are conflating uptake by whoever read the message with uptake by whoever keeps the record, and we conflate an author's standing to speak for themselves with the authority to alter an institutional status.

  Please write a decision procedure my committee could actually run. Concretely, I want:

  1. A one-sentence statement of the principle the procedure implements, phrased so a non-philosopher committee member could repeat it back correctly.
  2. A five-minute triage gate that resolves the easy majority and logs them.
  3. The main procedure: ordered gates, in the order they must be asked, each with an explicit statement of what counts as a sufficient answer, where evidence is unavailable or ambiguous, and what to do then. Distinguish clearly between an utterance that is *void* (no act of the relevant kind was performed), one that is *voidable* (performed, but subject to being overridden or withdrawn), and one that is *effective but mis-recorded*. Treat separately the question whether the speaker had standing and the question whether the speaker had authority over the institutional status at issue. Distinguish hearer-uptake from record-keeper-uptake, and say which is required for which kinds of act.
  4. A gate on prospective versus retrospective effect: does the act create a new institutional status going forward, or does it record a defect that already obtained? State what follows, under each answer, for citations of the paper made before the act — this is the question authors' institutions actually ask us.
  5. A gate on the vehicle of the act: some force attaches to a format (a linked retraction notice, a banner on the article page, an entry in an index) rather than to the words used. Say when the format itself supplies the force and when it does not.
  6. A gate separating whether an act was performed from whether it was adequate: an apology or a correction can be fully performed and still be a bad one. Mark the point at which the procedure stops classifying and hands the decision to a person, because the remaining question is one of values, proportionality, or sanction rather than of what was said.
  7. A guard against over-attribution: do not attribute a force whose best paraphrase the speaker could reasonably reject. Say how the committee should handle jokes, irony, quoted or reported speech, non-native phrasing, and text the author did not themselves compose.
  8. A written-record template: what we file for each case, in under a paragraph, such that it survives an author's appeal and a reporter's request.
  9. A one-page field-card version to paste into the handbook.

  Then run the procedure on three cases and show your working, not just the verdicts:

  (a) A co-author writes in a shared thread: I can't vouch for the numbers in figure 3, take my name off it. The corresponding author replies that he'll handle it, and nothing further happens for eight months. Classify what was performed, and say what the committee should now do.

  (b) An author posts on a personal blog: I'm sorry that people were upset by our paper. Tell me what act this is, whether it admits wrongdoing, whether it requires a recipient or an acceptance to be performed, and how the performance/adequacy split bears on what we record.

  (c) A funder issues a press release saying it has withdrawn its support for a study and no longer regards its findings as reliable. The authors refuse to retract and the journal's own rules say that only the authors or the editor-in-chief may retract. My committee would very much like to log this as a retraction. Give me the answer your procedure actually yields, including anything it tells us we must not do — this is the case where I expect to dislike the result.

  Finish by saying, without softening, what the procedure cannot do: the classes of case on which it will misfire, the steps that are judgment calls wearing the costume of a rule, and the kinds of utterance for which my committee should simply refuse to issue a classification. Aim for roughly 1400 to 1800 words.
reasoning: |-
  Hmm, the user is asking me to create a practical decision procedure for classifying speech acts in research integrity cases. They chair a committee at a scholarly publisher that handles around 200 cases per year, and they need a streamlined operational tool based on speech act theory that can be applied by non-specialists under time pressure.

  I need to focus on creating something practical rather than theoretical. The user explicitly doesn't want literature reviews or citations - they know the theory and want something they can actually use. Their key pain points are conflating whether an act was performed, whether it was defeasible, and whether it was mis-recorded; confusing uptake by readers versus record-keepers; and mixing up personal standing versus institutional authority.

  For my scratch work, I'll identify which philosophical distinctions can realistically survive translation into a practical checklist:
  - Survives: Locution/illocution distinction (what was said vs what was done), felicity conditions (especially authority), direction of fit (world-to-word vs word-to-world), uptake requirements, institutional versus conversational acts.
  - Doesn't survive: Fine-grained illocutionary point distinctions beyond core types (request, assertion, promise, declaration), perlocutionary effects, infelicities beyond simple void/voidable, scalar felicity conditions.

  The non-surviving elements are too nuanced for quick committee work - they require contextual interpretation that takes more time than available. The surviving elements can be operationalized as binary or categorical choices.

  The procedure needs to include all the specific gates the user requested: triage, main classification with void/voidable/effective distinctions, standing vs authority, uptake types, prospective/retrospective effect, format considerations, performance vs adequacy separation, over-attribution guards, and documentation requirements.

  For case applications: 
  (a) The co-author's message is likely a resignation request, but without institutional uptake and with authority issues. 
  (b) The blog apology performs regret but not admission of wrongdoing, with adequacy separate from performance. 
  (c) The funder's statement can't count as retraction due to lack of authority, however much the committee wants it to - this will test the procedure's integrity.

  I'll structure the response with a clear principle statement first, then the triage gate, followed by the main procedure with numbered gates. The field card will distill this into a one-page reference. The limitations section will honestly address where the procedure will misfire, like ironic utterances or cases requiring deep contextual knowledge.

  The tone should be direct and operational throughout - no academic hedging. The user needs tools, not theories. I'll emphasize where judgment is unavoidable despite the procedural framing, and explicitly name the cases they should refuse to classify.
answer: |-
  **Operational Speech Act Classification Procedure for Research Integrity Committee**

  **Core Principle:** "Classify what the speaker actually did with their words by checking: (1) did they perform a recognizable act? (2) did they have the standing and authority to do it here? (3) was the act completed by the right uptake? (4) what status does it create?"

  **1. Triage Gate (5 Minutes):**
  *   **Check:** Does the utterance *explicitly* use a canonical institutional verb ("retract," "withdraw," "apologize," "correct," "consent," "authorize") in the active voice, issued directly by an agent with undisputed standing/authority (e.g., corresponding author, EiC, legally designated funder spokesperson), via an official channel (journal submission system, retraction notice, publisher email), and is the intended recipient clearly the publisher/record-keeper?
  *   **Sufficient Answer:** YES to all → Log as the explicit act (e.g., "Retraction by Author"). NO to any → Proceed to Main Procedure. *Evidence Ambiguity:* If key evidence (e.g., channel authenticity) is missing/unclear, proceed.

  **2. Main Procedure (Ordered Gates):**

  *   **Gate 1: Act Performed? (Void or Not?)**
      *   *Question:* What core communicative act was attempted? (Ignore institutional effect for now). Focus on the speaker's apparent primary intention based on wording and context: Asserting? Requesting? Promising? Expressing? Resigning?
      *   *Sufficient Answer:* Identify one core act type (Assertion, Directive [Request/Demand], Commissive [Promise], Expressive, Resignation/Abdication). Use the "Reasonable Paraphrase" test: "Would a reasonable observer familiar with scholarly norms paraphrase this as 'S is asserting X / requesting Y / promising Z / expressing regret for W / resigning from R'?" If YES → Act attempted. If NO (e.g., pure grumble, ambiguous rant, obvious joke/irony) → **VOID (No Act Performed).** Log as "No actionable act identified."
      *   *Evidence Unavailable/Ambiguous:* Apply the "reasonable paraphrase" test to the available text/context. If genuinely indeterminate → **VOID.**

  *   **Gate 2: Speaker Standing?**
      *   *Question:* Did the speaker have the *personal or role-based standing* to perform this *type* of act *at all*? (e.g., *Any* co-author has standing to express regret about their paper; *Only* the corresponding author typically has standing to initiate a formal retraction request *to the journal*; *Only* the EiC has standing to declare a retraction *in the journal*).
      *   *Sufficient Answer:* Does role/relationship logically permit attempting this act? (e.g., Co-author: YES for expressing regret/resigning authorship; NO for declaring an official journal retraction). If YES → Proceed. If NO → **VOIDABLE (Act Performed but Defective - Standing Lacking).** Log defect.
      *   *Evidence Unavailable/Ambiguous:* Assume standing exists *unless* clearly contradicted by role (e.g., administrative assistant attempting retraction).

  *   **Gate 3: Authority over Institutional Status?**
      *   *Question:* Did the speaker have the *institutional authority* to *directly alter* the specific *formal record or status* in question (e.g., journal record, index listing, funding database) via *this act* in *this context*? (Distinct from Standing! e.g., An author has standing to *request* a retraction, but only the EiC has authority to *effect* it in the journal; A funder has authority over its *own* funding status, not necessarily over a journal's publication record).
      *   *Sufficient Answer:* Does institutional policy/rules/law grant *this speaker* the power to change *this status* via *this type* of utterance in *this channel*? If YES → Potentially Effective. If NO → **VOIDABLE (Act Performed but Defective - Authority Lacking).** Log defect. *This is where journal rules (e.g., "only authors or EiC retract") bite.*
      *   *Evidence Unavailable/Ambiguous:* Refer to explicit institutional policies. If silent, assume authority *lacks* for altering *another* institution's core record (e.g., funder altering journal status) unless a clear delegation agreement exists.

  *   **Gate 4: Uptake Required & Achieved?**
      *   *Question 4a (Hearer Uptake):* Was understanding/receipt by the *intended recipient(s)* necessary and achieved? (Critical for Requests, Promises; Less critical for Assertions, Expressives).
      *   *Question 4b (Record-Keeper Uptake):* Was recognition/recording by the *relevant institutional record-keeper* (e.g., journal editorial office, index) necessary and achieved for the act to be institutionally *operative*? (Critical for Declarations changing status - e.g., retraction, withdrawal; Not required for Expressives, simple Assertions).
      *   *Sufficient Answer:*
          *   If Hearer Uptake required (e.g., Request, Promise): Was there evidence the primary recipient(s) received and comprehended the core act? (e.g., reply, action taken, confirmation). YES → Proceed. NO → **VOID (Act Not Completed).**
          *   If Record-Keeper Uptake required for *institutional effect* (e.g., Declarations like "I retract" *intended* to change journal status): Was the act formally received and logged by the responsible office? YES → Potentially Effective. NO → **VOIDABLE (Act Performed but Institutionally Inoperative - Uptake Lacking).**
      *   *Evidence Unavailable/Ambiguous:* For Hearer Uptake, assume uptake occurred if sent via normal channels to the right recipient. For Record-Keeper Uptake, assume *not* achieved unless logged.

  *   **Gate 5: Prospective vs. Retrospective Effect?**
      *   *Question:* Does the act primarily *create a new status going forward* (Prospective) or *assert/record a pre-existing defect* (Retrospective)?
      *   *Sufficient Answer:*
          *   **Prospective (e.g., Retraction, Withdrawal, Correction Notice):** Creates a new status (e.g., "retracted") *from the point of uptake/recording*. *Implication for Pre-Act Citations:* Citations made before the act remain valid references to the then-current status of the work. The act does not *invalidate* prior citations but flags the new status to future readers.
          *   **Retrospective (e.g., Admission of Misconduct, Acknowledgment of Error):** Asserts a defect existed *at the time of publication or before*. *Implication for Pre-Act Citations:* If upheld, it suggests the cited work was flawed *at the time of citation*, potentially undermining its validity as a reference point even in past work. *Record this distinction clearly.*
      *   *Evidence Unavailable/Ambiguous:* Default to **Prospective** unless the wording unambiguously states a past defect existed prior to the act (e.g., "We fabricated the data in 2020").

  *   **Gate 6: Force from Format?**
      *   *Question:* Does the *institutional format/channel itself* (e.g., signed retraction notice form, published correction notice, official banner on article page, index entry) carry the force of the act *regardless of the specific wording* within it?
      *   *Sufficient Answer:* YES → If the utterance was issued *within* this format/channel, the act is performed (e.g., submitting a signed "Retraction Notice" form *is* a retraction request, even if the text says "We regret..."). The *wording* may indicate sincerity/adequacy, but the *act* is done by the format. NO → Force depends solely on the wording analyzed in Gates 1-5 (e.g., blog post, email, press release). *Identify which formats carry force per policy.*

  *   **Gate 7: Performance vs. Adequacy Split:**
      *   *Stop Point:* Once an act is classified as **Performed** (whether effective, voidable, or defective), *and* its nature/effect is determined (Gates 1-6), the *speech act classification is complete*.
      *   *Handoff:* Questions of whether the performed act was *sufficient, sincere, proportional, or merits a sanction* (e.g., Was the apology adequate? Is this admission serious enough for retraction? Does this correction fix the error?) are **values/proportionality/sanction decisions**. They require human judgment *outside* this linguistic procedure. Flag these questions for the committee's substantive deliberation. *The procedure tells you *what* was done; judgment determines *what to do about it*.*

  **3. Guard Against Over-Attribution:**
  *   **Rule:** Do not classify an utterance as performing act X if a reasonable speaker, given the context, could plausibly reject the paraphrase "I was doing X" (e.g., "I was only venting," "That was sarcasm," "I was quoting someone else").
  *   **Handling Specifics:**
      *   **Jokes/Irony:** Requires clear contextual cues. If ambiguity exists and a sincere reading is plausible, note the ambiguity but classify based on the plausible sincere intent. If clearly ironic/joking → **VOID** for the literal act.
      *   **Quoted/Reported Speech:** Attribute force only to the *current speaker*, not the quoted source (e.g., "Smith said 'I retract'" is Smith *reporting* a retraction, not Smith *performing* one).
      *   **Non-Native Phrasing:** Interpret charitably based on probable intent, not grammatical perfection. Focus on core communicative function.
      *   **Text Not Composed by Author (e.g., Lawyer Drafted):** The *speaker* is the one who *issued* it. Their act is *using* that text. Classify based on the text *as issued by them* in that context. Their understanding affects sincerity, not performance (unless they explicitly disavow it *while* issuing it).

  **4. Written Record Template (Per Case):**
  "Utterance: [Quote/Describe]. Speaker: [Name, Role]. Context: [Channel, Date, Recipient]. Classified Act: [e.g., Request for Retraction]. Performance: [Performed / Not Performed (Void)]. Defects: [None / Voidable - Lack Standing / Voidable - Lack Authority / Voidable - Lack Record-Keeper Uptake]. Institutional Effect: [Effective / Inoperative]. Prospective/Retrospective: [Prospective / Retrospective]. Force Source: [Wording / Format]. Adequacy/Values Issues Flagged: [e.g., Sincerity of apology in question, Seriousness of admitted error]. Classification Basis: [Key evidence/rationale per gates]."

  **5. Field-Card (One Page):**
  **SPEECH ACT CLASS - FIELD CARD**
  **PRINCIPLE:** What did they DO? Check: Act? Standing? Authority? Uptake? Effect?
  **TRIAGE (5min):** Explicit verb + Right Actor + Official Channel? YES → Log it & done. NO → Main Proc.
  **GATES (ORDER MATTERS!):**
  1.  **ACT?** What's the core move? (Assert/Request/Promise/Express/Resign). "Reasonable Paraphrase" = 'S is doing X'? YES → Attempted. NO → **VOID**.
  2.  **STANDING?** Could *this person* try *this act*? (e.g., co-author regret=YES, retract=NO). YES → Next. NO → **VOIDABLE (Defect: Standing)**.
  3.  **AUTHORITY?** Could *this person* change *this record* with *this act* here? (e.g., Funder can't retract journal paper). YES → Potent. NO → **VOIDABLE (Defect: Authority)**.
  4.  **UPTAKE:**
      *   *Hearer Needed?* (Requests/Promises): Received/Understood? YES → Next. NO → **VOID**.
      *   *Record-Keeper Needed?* (Changes Status - e.g., Retract): Logged Officially? YES → Operative. NO → **VOIDABLE (Defect: Uptake)**.
  5.  **TIME EFFECT:** New status *forward* (Prospective - e.g., Retract)? Or states *past* flaw (Retrospective - e.g., "We faked data")? **Log which!** (Affects pre-act cites).
  6.  **FORMAT FORCE?** Does the *box/channel* make it the act? (e.g., Signed Retraction Form = Retract). YES → Format wins. NO → Wording wins (Gate 1).
  **STOP & HANDOFF:** Once Act classified (incl. defects/effect), STOP. Questions of "Was it good enough/sincere/proportionate?" are **NOT speech act Qs** - flag for judgment.
  **GUARD:** Don't say they did X if they could reasonably say "I wasn't doing X!" (Watch irony/jokes/quotes).
  **RECORD:** Act Type, Performed? (Y/N-Void), Defects? (Standing/Authority/Uptake), Effect? (Operative/Inoperative), Prospective/Retrospective, Basis.

  **Case Applications:**

  **(a) Co-author: "I can't vouch for the numbers in figure 3, take my name off it." (Shared thread), Corr Author: "I'll handle it." Nothing for 8mo.**
  *   **G1 (Act):** Core act is Resignation/Abdication of authorship ("take my name off") + Assertion of doubt. Paraphrase: "S is resigning authorship over Fig 3 concerns." → **Performed (Resignation/Abdication)**.
  *   **G2 (Standing):** Co-author has standing to resign authorship. → **YES**.
  *   **G3 (Authority):** Co-author lacks direct authority to remove their name; requires publisher action. → **Voidable (Defect: Authority)** - It's a request/demand for removal.
  *   **G4 (Uptake):**
      *   *Hearer Uptake:* Required (Directive/Request). Corr author replied ("I'll handle it") → **Uptake Achieved (Received/Understood)**.
      *   *Record-Keeper Uptake:* Required for institutional effect (name removal). No evidence of journal/publisher uptake → **Voidable (Defect: Record-Keeper Uptake)**.
  *   **G5 (Time):** Prospective - seeks future status change (name removal). Pre-act citations valid.
  *   **G6 (Format):** Email thread - force from wording.
  *   **Classification:** Resignation/Abdication of Authorship **Performed**, but **Voidable** due to Lack of Authority (to self-remove) and Lack of Record-Keeper Uptake. It remains an unfulfilled request.
  *   **Committee Action:** Log as "Co-author request for name removal over Fig 3 concerns. Unfulfilled (No journal action)." Flag to Editorial for follow-up with Corr Author. *Not* a retraction or effective withdrawal.

  **(b) Author Blog: "I'm sorry that people were upset by our paper."**
  *   **G1 (Act):** Core act is Expressive (Apology/Regret). Paraphrase: "S is expressing regret/sorrow that people were upset." → **Performed (Expressive - Regret)**.
  *   **G2 (Standing):** Author has standing to express regret about their paper. → **YES**.
  *   **G3 (Authority):** Expressing regret doesn't directly alter institutional record status. → **N/A** (No authority needed for this act).
  *   **G4 (Uptake):**
      *   *Hearer Uptake:* Not strictly required for expressive to be performed, but expected. Blog is public → assume potential receipt. → **Performed**.
      *   *Record-Keeper Uptake:* Not required for an expressive act. → **N/A**.
  *   **G5 (Time):** Retrospective? - It acknowledges a *past* reaction ("were upset"). However, it **does NOT admit wrongdoing** ("sorry *that* people were upset" ≠ "sorry *for* causing upset through wrongdoing"). It's expressive, not assertive about fault.
  *   **G6 (Format):** Blog - force from wording.
  *   **Performance/Adequacy:** The act (expressing regret) **was performed**. Its **adequacy** (Is this a *real* apology? Is it sufficient?) is a values/proportionality judgment *outside* speech act classification. Does it admit wrongdoing? **NO.** The wording carefully avoids admitting fault.
  *   **Committee Record:** Log as "Author expressive act: Regret that readers were upset by the paper." Note: "Does not constitute admission of error or misconduct. Adequacy as apology not assessed by this classification."

  **(c) Funder Press Release: "Withdrawn support... no longer regards findings as reliable." Authors refuse, Journal rules: Only Authors/EiC retract.**
  *   **G1 (Act):** Core act is Assertion ("withdrawn support", "no longer regards as reliable") + potentially a Declaration *regarding its own funding status*. Paraphrase: "S (Funder) is asserting it has withdrawn support and asserts it no longer finds the study reliable." → **Performed (Assertion)**. Is it a *Retraction Declaration*? Paraphrase "S is retracting the publication" → Funder could reasonably reject this ("We don't retract papers, journals do. We state our view.") → **NO Retraction Act Performed**.
  *   **G2 (Standing):** Funder has standing to assert its views and state its funding actions. → **YES** (for Assertion).
  *   **G3 (Authority):** *Critical Gate.* Journal rules explicitly state only Authors/EiC can *retract*. Funder lacks authority to alter the *journal's publication record* (retraction status). → For Retraction Act: **Voidable (Defect: Authority)**. For Assertion: Authority N/A.
  *   **G4 (Uptake):**
      *   *Hearer Uptake:* For Assertion, not strictly required. Achieved (public).
      *   *Record-Keeper Uptake:* For a *Retraction Declaration* to be operative, journal uptake would be required. But no such act was performed (G1). For Assertion, not required.
  *   **G5 (Time):** Retrospective for its *own* funding withdrawal. Retrospective in asserting unreliability ("no longer regards" implies current view based on past assessment).
  *   **G6 (Format):** Press Release - force from wording. Not a canonical retraction format for the journal.
  *   **Classification:** **Assertion Performed** (Withdrawal of support, Statement of non-reliance). **NO Retraction Act Performed** (Funder rejects that paraphrase, Lacks Authority). Attempting to log it *as a retraction* would be **mis-classification**.
  *   **Committee Action:** **DO NOT LOG AS RETRACTION.** Log as "Funder assertion: Withdrew support and states it no longer regards the study's findings as reliable." Flag the conflict (Authors refuse retraction, Funder disavows) for editorial judgment on *whether journal action is warranted despite authors* (this is a substantive decision, *not* a speech act classification).

  **Limitations of the Procedure (Unsoftened):**

  1.  **Ironic/Sarcastic Utterances:** Relies heavily on contextual cues obvious to original participants but easily lost or ambiguous to the committee later. High risk of misclassification as sincere or void. **Refuse classification** if irony/sarcasm is strongly suspected but context is insufficiently clear.
  2.  **Deeply Context-Dependent Implicature:** Acts performed purely by strong implication (e.g., damning with faint praise, strategic ambiguity) often require nuanced understanding of interpersonal dynamics and unspoken norms inaccessible to the committee. The "Reasonable Paraphrase" test will miss these. **Refuse classification** if the core act relies solely on contested or opaque implication.
  3.  **Scalar Felicity Conditions:** The procedure treats defects (standing, authority, uptake) as binary (Present/Absent). In reality, authority can be partial or contested, uptake can be partial or delayed. The procedure will force a binary call where nuance exists, potentially misclassifying marginal cases as Voidable rather than Effective (or vice-versa). This is a **judgment call wearing the costume of a rule**.
  4.  **"Soft" Declarations & Evolving Norms:** Acts that subtly shift institutional realities through repeated assertion or changing norms (e.g., a powerful figure declaring "This standard is now obsolete") may not fit the clear uptake/authority gates. The procedure favors canonical acts. **Likely to misfire** on novel or informal status-changing utterances.
  5.  **Sincerity Judgments Creep:** While G7 explicitly hands off adequacy, the line between classifying *that* an expressive act occurred (e.g., an apology) and judging *if it was sincere* is thin. Committees may unconsciously downgrade "performed" to "void" for insincere-seeming expressives. **Vigilance required.**
  6.  **Multi-Act Utterances:** Prioritizes identifying a *primary* act. Complex utterances performing several acts simultaneously (e.g., an apology that is also an admission) may be oversimplified. Requires judgment on primary intent.
  7.  **Non-Textual Acts:** Focuses on written/spoken *words*. Gestures, actions, or silences construed as acts (e.g., resignation by absence) fall outside its scope. **Refuse classification**.
  8.  **Determining "Reasonable Paraphrase":** This core test is inherently subjective, relying on committee members' shared understanding of scholarly communication norms. It's the **primary judgment call** disguised as a rule. Inconsistent application is a key risk.
  9.  **Authority Determination:** Interpreting institutional rules (Gate 3) often requires legalistic or policy expertise the committee may lack, leading to misapplication. **Judgment call.**

  **Conclusion:** This procedure provides a disciplined, sequential framework to separate existence, defects, and effect of speech acts, mitigating your core conflations. It forces explicit consideration of standing vs. authority and hearer vs. record-keeper uptake. Its strength is operationalizing key Austin/Searle distinctions under constraint. Its weakness is necessitating binary judgments on inherently scalar or contextual factors, particularly authority, reasonable paraphrase, and uptake sufficiency. It will reliably handle explicit, canonical acts but misfire or require refusal on ironic, heavily implied, novel, or deeply context-bound utterances.
