  ### Part 3: Tests-and-Predictions Table  
  We evaluate three hypothetical cases to isolate disagreements. Predictions are framed as if outcomes are unknown, and movement conditions specify what evidence would challenge each party's position.  

  | Crux | Case/Argument | Pluralist's Prediction | Monist's Prediction | What Would Move Pluralist | What Would Move Monist |  
  |------|---------------|------------------------|---------------------|---------------------------|------------------------|  
  | **Relativity of species count; legal protection needs** | **Case A: Ashfall sedge complex** (ring species with terminal forms; ecological/phylogenetic divergence). | "The number of species is indeterminate: 1 under cohesion concepts (entire ring), 2 under isolation concepts (terminals), or more under diagnosability. History amplifies relativity. Legal listing should protect the serpentine form as an evolutionarily significant unit, regardless of species status." | "The complex is one species (single lineage with gene flow), or two if terminals are lineage-separate. History shows one lineage. Legal protection for the 'species' should cover the entire complex, but the listing may validly target the serpentine form as a subunit." | **Pluralist movement:** Uniform agreement on count/concept across criteria. | **Monist movement:** Evidence that terminals are irreversibly isolated lineages despite ring connectivity. |  
  | **Applicability to asexual systems; lineage criterion viability** | **Case B: Kappa clade** (asexual bacteria; ecotypes with divergent recombination rates and sweeps). | "Ecotypes are species under ecological concepts but not others. The lineage criterion is inapplicable: core genes suggest one lineage, but gene transfer blurs boundaries. Monism fails here, requiring concept pluralism." | "Ecotypes are separate lineages due to independent evolution (sweeps) and low inter-ecotype recombination; thus, two species. Lineage separation is defined by evolutionary independence, not sexuality, so the criterion holds." | **Pluralist movement:** A non-arbitrary lineage-based delineation matching all operational criteria. | **Monist movement:** High inter-ecotype recombination or non-monophyly eroding evidence for lineage separation. |  
  | **Speciation without branching; fossil interpretation** | **Case C: Reticulation and deep time** (allopolyploid speciation; anagenetic change in fossils). | "Allopolyploidy adds one species (net increase) under isolation/ecological concepts. The fossil lineage is one species under lineage concepts but three under morphological concepts. Fossils cannot settle lineage segmentation without branching data." | "Allopolyploidy adds one species (new lineage). The fossil lineage is one species; morphological change does not create new species without branching. Fossils can show lineage continuity but not boundaries without splitting evidence." | **Pluralist movement:** Fossils proving reproductive isolation or monophyly without branching. | **Monist movement:** Fossils showing coexisting lineages without branching (e.g., cryptic species)." |  

  ---

  ### Part 4: Closing Paragraph  
  We concur that further empirical work on ambiguous systems (e.g., ring species, asexual clades, and hybrid complexes) could resolve specific disputes, such as whether operational criteria converge in practice. Conceptual work is needed to clarify lineage-based definitions for asexual taxa and the ontology of cross-cutting groups. However, core disagreements—such as the unicity of the species category—may persist due to differing metaphysical commitments; empirical data alone cannot adjudicate whether discordance reflects biological multiplicity or evidential noise. The pluralist most wants the monist to concede that in taxa like asexual bacteria, lineage-based definitions become so operational that they functionally align with pluralism. The monist most wants the pluralist to concede that where criteria converge (e.g., in sexually reproducing vertebrates), it signals a single underlying reality. A verbal component exists: disputes about "species" terminology (e.g., in the taxon identity row) dissolve under a stipulated definition, but the residual substantive issue—whether one or many definitions are scientifically legitimate—remains. We commit to ongoing dialogue, focusing on cases like those above to test our positions.  

