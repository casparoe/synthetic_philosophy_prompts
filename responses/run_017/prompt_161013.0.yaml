prompt: |-
  Draft the joint statement that could be signed, after a good-faith adversarial collaboration, by two parties to the species problem: a pluralist about the species category and a lineage monist.

  The pluralist holds that there is no single correct account of what it is to be a species. The work that the notion of species does in evolutionary biology, ecology, and systematics divides among several distinct investigative questions — about reproductive boundaries, about independent evolutionary trajectory, about ecological role, about monophyly and diagnosability — and the taxa selected by the criteria that answer these questions sometimes cross-cut rather than nest. Hence the question whether a given group is a species is incomplete until an investigative question is supplied, and the question how many species a clade contains has no answer unrelativized to a concept. This is not conventionalism: each concept can carve at a real joint, and the taxa it picks out are real historical individuals.

  The monist holds that the species category has one correct account: species taxa are segments of metapopulation lineages, populations evolving separately from others, and the familiar criteria — interfertility, fixed diagnostic character states, ecological distinctness, monophyly — are at best evidence for, and operational proxies of, that single underlying property. Where proxies conflict, at most one of them tracks what species are; the conflict marks the limits of our evidence rather than a multiplicity in nature. Species number in a clade is therefore determinate even when unknowable, and comparisons of diversity across clades are not merely comparisons of which convention was applied.

  Both parties accept the distinction between the taxon question (is this particular group a species?) and the category question (what is it to be a species?), and both treat species taxa as individuals with historical origin-and-extinction conditions rather than as classes. Both grant that the rank of species carries no metaphysical privilege over the ranks above and below it.

  Do not adjudicate. The deliverable is a document both could put their names to. Neither side may be portrayed in a form nobody would defend: the monist must be allowed to grant that cross-cutting taxa are real and that operational criteria are indispensable to practice, and the pluralist must be allowed to grant that in a given clade one criterion is usually the one worth using and that within-clade diversity comparisons can be scientifically meaningful. Where a claim would hold only under one side's favoured reformulation of the question, mark it as such rather than letting it into the agreed section.

  Write the document in four parts.

  1. Agreed claims, numbered, ten to fourteen of them, each substantive enough that denying it would be a real commitment, and each phrased so that neither signatory could say the wording has been tilted. They should cover at least: what the familiar criteria each actually test; why interbreeding criteria fail for asexual, uniparental, and reticulate groups; why diagnosability criteria fragment continuously varying lineages and are sensitive to sampling and to which loci are chosen; the circumstances under which different criteria yield nested, cross-cutting, or incommensurable groupings; and what taxonomy, conservation law, and biodiversity accounting respectively need from a species concept.

  2. A disagreements table with these columns: the crux; a neutral restatement of the disagreement; the formulation the pluralist would sign; the formulation the monist would sign; and a verdict for that row on whether the dispute is verbal or substantive — and if verbal, which term is doing the work and what remains once that term is fixed. Include at least: whether the species category admits of one correct account or several legitimate ones; whether conflict among criteria is a symptom of evidential limitation or of genuine multiplicity; whether operational criteria constitute species status or merely indicate it; whether one and the same taxon can be a species under one concept and fail to be one under another while remaining the same individual, or whether changing the concept changes the referent; whether species number is a legitimate comparative measure across clades with different reproductive systems; and what identity over time a species taxon has in the absence of branching.

  3. A tests-and-predictions table with these columns: the crux; the case or argument both parties accept as bearing on it; the pluralist's prediction, written as if the result were not yet in; the monist's prediction, likewise; what outcome would move the pluralist; and what outcome would move the monist. Use the three stipulated cases below, which are hypothetical and fully specified here, so the document needs no empirical lookup.

  Case A — the Ashfall sedge complex. A genus of wind-pollinated sedges distributed in a ring around a montane basin. Stipulate: every adjacent pair of populations is interfertile in greenhouse crosses, with seed set declining continuously as genome-wide divergence rises and failing above roughly eleven percent; divergence rises continuously with distance around the ring; the two terminal forms meet in the south and do not interbreed in the field, the contact being secondary and dated to roughly nine thousand years ago, the ring itself having expanded from a single refugium roughly eighty thousand years ago; one terminal form is restricted to serpentine soils, flowers about six weeks earlier than the other, and is reciprocally monophyletic in the nuclear genome while rendering the other terminal form paraphyletic; and that serpentine form is the only member of the complex protected under a threatened-species statute. Ask how many species the complex contains, whether that question has a determinate answer, whether the answer differs if the question is asked of a single time slice rather than of the eighty-thousand-year history, and what a legal listing of the species should be taken to protect.

  Case B — the kappa clade. Free-living bacteria, no sexual cycle, no usable morphology, genomes around four megabases. Recombination within each of two ecotypes runs at roughly twice the mutation rate; between them, at roughly one twentieth of it. Around eighteen percent of gene content per genome turns over per million years by transfer from outside the clade, while a core of genes is transmitted vertically. The ecotypes are separated by a sharp niche boundary and each undergoes periodic genome-wide selective sweeps that purge diversity. Ask whether the clade is one lineage or several, whether the ecotypes are species, and whether the monist's own criterion survives this case.

  Case C — reticulation and deep time. A fern complex in which hybridization between two recognized species produces a fertile, reproductively isolated allopolyploid lineage that is also a novel ecological entity, while both parental species persist unchanged alongside it. Alongside it, a continuously cored marine sequence shows five million years of anagenetic morphological change without branching, wide enough in total that morphology-based practice would name three successive species, though variation at any single horizon is narrower than the total change. Ask whether speciation here adds to or subtracts from species number, and what the fossil record can in principle settle about lineage segmentation.

  4. A closing paragraph, signed by both, stating what further work — empirical or conceptual — would actually settle something, what neither party should expect to be settled, and the single claim each most wants the other to concede. If part of the dispute turns out to be verbal, say plainly which part and what the residual substantive disagreement is under a stipulated single sense of the term; do not dissolve the whole dispute into words.

  The document should run roughly twelve hundred to sixteen hundred words. After it, you may add at most two sentences of your own, clearly separated, noting where you think the collaboration is least stable.
reasoning: |-
  We are drafting a joint statement for a pluralist and a monist on the species problem. The document has four parts: agreed claims, disagreements table, tests-and-predictions table, and a closing paragraph.

  Part 1: Agreed Claims (10-14 numbered items)

  We need substantive claims that both can agree on, phrased neutrally. The claims should cover:
  - What each familiar criterion (interbreeding, diagnosability, monophyly, etc.) actually tests.
  - Why interbreeding criteria fail for asexual/uniparental/reticulate groups.
  - Why diagnosability criteria fragment continuous lineages and are sensitive to sampling/loci.
  - Circumstances under which criteria yield nested, cross-cutting, or incommensurable groupings.
  - What taxonomy, conservation law, and biodiversity accounting need from a species concept.

  Let's list 10-14 agreed claims:

  1. The reproductive isolation criterion (e.g., the Biological Species Concept) tests the potential for gene flow between populations and the existence of barriers to that flow. It is applicable primarily to sexually reproducing organisms with biparental reproduction.

  2. The diagnosability criterion (e.g., the Phylogenetic Species Concept) tests the presence of fixed character differences (morphological or genetic) that allow for the assignment of individuals to distinct groups. This criterion is sensitive to the choice of characters and the density of sampling, and it can fragment lineages that exhibit continuous variation.

  3. The monophyly criterion (e.g., as in some phylogenetic concepts) tests whether a group is a clade, i.e., an ancestor and all its descendants. This is often assessed via molecular phylogenies and is contingent on the markers used and the reconstruction method.

  4. The ecological distinctness criterion tests whether a group occupies a distinct adaptive zone or has a unique ecological role, which can be assessed via resource use, habitat, or other ecological factors.

  5. Interbreeding criteria (such as the Biological Species Concept) are inapplicable to asexual, uniparental, or highly reticulate groups because they lack the necessary conditions for gene flow and reproductive barriers.

  6. Diagnosability criteria can fragment continuously varying lineages into multiple groups because they rely on discrete boundaries that may not exist in nature. The groupings they produce are sensitive to the choice of loci (in genetic studies) and to the sampling of individuals and geographic locations.

  7. In some cases, different criteria (e.g., reproductive isolation, diagnosability, monophyly, ecology) may yield groupings that are nested (e.g., diagnosable subgroups within a reproductively cohesive group). In other cases, they may cross-cut (e.g., a reproductively cohesive group split by diagnosable subgroups that do not align with reproductive boundaries) or be incommensurable (e.g., groupings based on different sets of characters that do not align at all).

  8. Taxonomy requires a consistent and operational concept for the purpose of naming and classification. The choice of concept must be explicit and serve the needs of communication and information retrieval.

  9. Conservation law requires a concept that can assign legal protection to entities that are evolutionarily significant and/or at risk. The concept must be applicable to the groups in question and must be stable enough for legal enforcement.

  10. Biodiversity accounting requires a concept that allows for the quantification of diversity across different groups and ecosystems. It must be consistent enough to support comparisons, but flexible enough to accommodate the diversity of life.

  11. Species taxa are historical individuals that have a beginning (through speciation) and an end (through extinction or further speciation). They are not defined by intrinsic properties alone but by their historical trajectory.

  12. The rank of species is not inherently privileged over higher (e.g., genus) or lower (e.g., subspecies) ranks in terms of its reality. All such ranks are segments of the tree of life at different scales.

  13. Operational criteria (such as reproductive isolation, diagnosability, etc.) are indispensable for identifying species taxa in practice, even if their relationship to the underlying reality is contested.

  14. In many clades, one criterion (e.g., reproductive isolation in birds) is typically the most useful and widely applied, and within-clade diversity comparisons using that criterion can be scientifically meaningful.

  That's 14 claims. We must ensure neutrality. Let's check:
  - Claim 1: Both agree on what the criterion tests.
  - Claim 5: Both agree on the failure for asexual groups.
  - Claim 6: Both agree on the issues with diagnosability.
  - Claim 7: Both can agree that criteria can yield nested, cross-cutting, or incommensurable groupings without taking a stand on what that means for the category.
  - Claims 8-10: Both agree on the pragmatic needs of taxonomy, conservation, and biodiversity accounting.
  - Claim 11: Both accept species as historical individuals.
  - Claim 12: Both agree no metaphysical privilege.
  - Claim 13: Both grant operational criteria are indispensable.
  - Claim 14: Both can agree that in a given clade one criterion is usually the one worth using and that within-clade comparisons can be meaningful.

  Part 2: Disagreements Table

  Columns: 
  - The crux: a short phrase for the issue.
  - Neutral restatement: how the disagreement looks without taking sides.
  - Pluralist's formulation: what the pluralist would sign.
  - Monist's formulation: what the monist would sign.
  - Verdict: whether the dispute is verbal or substantive, and if verbal, which term and what remains.

  Cruxes to cover (from the prompt and adding for completeness):

  1. Whether the species category admits of one correct account or several legitimate ones.
  2. Whether conflict among criteria is a symptom of evidential limitation or of genuine multiplicity.
  3. Whether operational criteria constitute species status or merely indicate it.
  4. Whether one and the same taxon can be a species under one concept and fail to be one under another while remaining the same individual, or whether changing the concept changes the referent.
  5. Whether species number is a legitimate comparative measure across clades with different reproductive systems.
  6. What identity over time a species taxon has in the absence of branching.

  Let's build the table row by row.

  Row 1: One correct account vs. several legitimate ones.

  Crux: Unicity of the species category account.
  Neutral restatement: Disagreement on whether the species category is defined by a single property or whether multiple properties can legitimately define it.
  Pluralist: The species category is legitimately defined in multiple ways, each capturing a different real aspect of evolutionary divergence.
  Monist: The species category is defined by a single property (lineage separation), and other properties are at best evidence for that.
  Verdict: Substantive. The disagreement is about the nature of the category.

  Row 2: Conflict among criteria.

  Crux: Interpretation of conflict among operational criteria.
  Neutral restatement: When operational criteria conflict (e.g., one group is reproductively isolated but not diagnosable, or diagnosable but not monophyletic), disagreement exists on whether this indicates that we lack evidence for a single underlying reality or that there are multiple realities.
  Pluralist: Such conflicts reflect genuine multiplicity in the evolutionary processes and thus in the kinds of groups that are species under different concepts.
  Monist: Such conflicts are due to the limitations of our evidence and the imperfection of operational proxies for the single underlying reality of lineage separation.
  Verdict: Substantive. The disagreement is about the interpretation of discordance.

  Row 3: Operational criteria as constitutive or indicative.

  Crux: Ontological status of operational criteria.
  Neutral restatement: Disagreement on whether meeting an operational criterion (e.g., reproductive isolation) is what makes a group a species, or whether it is merely a way to detect the underlying property (lineage separation).
  Pluralist: Operational criteria (when properly defined for a given investigative context) are constitutive of species status for that context.
  Monist: Operational criteria are indicative of species status, which is defined by lineage separation.
  Verdict: Substantive. It's about the relationship between evidence and reality.

  Row 4: Change of concept and referent.

  Crux: Referent of species terms under different concepts.
  Neutral restatement: If a taxon is considered a species under Concept A but not under Concept B, is the taxon the same historical individual regardless of the concept applied, or does the concept change which taxon we are referring to?
  Pluralist: The same historical individual can be a species under one concept and not under another without changing its identity; the concept determines which groups are picked out as species.
  Monist: The concept of species refers to a particular kind of lineage segment; if a group is not such a segment, then it is not a species. Changing the concept changes what we are talking about (the referent) because the monist concept is the correct one and picks out the real species.
  But note: the monist might say that if we change the concept, we are talking about a different kind of entity. The pluralist says the taxon is the same individual, but its status as a species is relative.

  We need formulations:

  Pluralist: A given taxon, as a historical individual, can be considered a species under one concept and not under another without altering the identity of the taxon itself; the change in concept changes the classification of the taxon, not the taxon.
  Monist: The term "species" refers to a specific kind of lineage segment (metapopulation lineage); if a taxon does not meet that definition, it is not a species, and hence the referent of "species" is fixed by the correct definition. Applying a different concept does not change the taxon but changes what we are calling a species, which may or may not correspond to a real lineage segment.

  But note the prompt: the monist must be allowed to grant that cross-cutting taxa are real. So the monist doesn't deny the existence of the taxon, just that it's a species. So:

  Monist: The same taxon (as a historical individual) may exist, but it is a species only if it is a segment of a metapopulation lineage. Under a different concept, one might call it a species, but that would be incorrect if it doesn't meet the monist's criterion.

  So the disagreement is about whether the taxon's status as a species is absolute or relative.

  Verdict: Partly verbal. The term "species" is being used in different ways. If we fix the meaning of "species" to the monist's definition, then the taxon either is or isn't a species. The pluralist, however, holds that there are multiple legitimate meanings of "species". So the residual substantive issue is whether there is one or many legitimate meanings.

  Row 5: Comparative species number across clades.

  Crux: Legitimacy of cross-clade diversity comparisons.
  Neutral restatement: Whether the number of species in a clade can be meaningfully compared to that in another clade that has a different reproductive system (e.g., sexual vs. asexual), given that the operational criteria may differ.
  Pluralist: Because different criteria are legitimate in different contexts, comparisons of species number across clades that require different criteria are not straightforward and may not reflect a single dimension of diversity. However, within a consistent criterion, comparisons can be meaningful.
  Monist: Because there is a single underlying reality (lineage separation), species number is a legitimate comparative measure across clades, even if the operational criteria differ, because the same kind of entity is being counted. The challenge is in the measurement, not the legitimacy.
  Verdict: Substantive. The monist sees a single reality that can be counted, the pluralist sees multiple realities that are not directly comparable.

  Row 6: Identity over time without branching.

  Crux: Persistence of species without branching.
  Neutral restatement: In the absence of branching events, what defines the identity of a species taxon over time?
  Pluralist: Depending on the concept, a species taxon may be defined by its reproductive continuity, its morphological stability, or other properties. Without branching, the taxon persists as long as the relevant property (for the concept in use) is maintained.
  Monist: The species taxon is a segment of a single lineage that persists without branching. Its identity is maintained by the continuity of the lineage, regardless of the amount of anagenetic change.
  Verdict: Substantive? But note both agree that species are historical individuals that persist through time. The disagreement is about what defines the boundaries when there is no branching. The monist says the lineage segment is defined by separation from other lineages. Without branching, it's one lineage. The pluralist might allow that different concepts set different boundaries (e.g., if there's enough anagenetic change, a morphospecies might split it, but without branching, the lineage monist would not).

  So:

  Pluralist: In the absence of branching, the identity of a species taxon over time is determined by the criterion in use (e.g., reproductive continuity, morphological coherence, etc.), and these may set different temporal boundaries.
  Monist: In the absence of branching, the species taxon persists as a single lineage segment from its origin (which may be a prior branching event) until its extinction or until it branches. The lineage continuity defines the identity.

  Verdict: Substantive. The monist has a fixed criterion (lineage separation) for the entire duration, while the pluralist allows multiple criteria.

  Part 3: Tests-and-Predictions Table

  Columns:
  - Crux: the issue being tested.
  - Case or argument: the hypothetical case.
  - Pluralist's prediction (as if not known).
  - Monist's prediction (as if not known).
  - What outcome would move the pluralist.
  - What outcome would move the monist.

  Three cases: A (Ashfall sedge), B (kappa clade), C (reticulation and deep time).

  We'll structure by case, but each case may bear on multiple cruxes. We'll break down by crux per case as needed.

  Case A: Ashfall sedge complex.

  Cruxes: How many species? Determinate answer? Single time slice vs. history? What should be protected?

  Neutral description: Ring species with terminal forms that do not interbreed in the field, but continuous intergradation around the ring. One terminal form is ecologically and phylogenetically distinct.

  Pluralist prediction: 
  - How many species? It depends on the concept. Under a biological concept (reproductive isolation), there might be one species (if we consider the ring as one) or two (if we break at the point where gene flow stops). Under a phylogenetic concept, the serpentine form is a species (monophyletic) and the rest might be one or more. Under an ecological concept, the serpentine form is a distinct species. So the number could be 1, 2, or more, and it is not determinate without specifying a concept.
  - Determinate answer? No, without a concept.
  - Time slice vs history: At a single time slice, the ring exists and the question is about current groupings. Over the 80,000-year history, the ring expanded and the terminal forms diverged, so at different times the groupings might change. The pluralist would say that the answer for the entire history is even more relative to concept because it involves temporal boundaries.
  - Protection: The legal listing should protect the ecologically and evolutionarily significant unit, which in this case is the serpentine form, regardless of whether it is considered a species under every concept.

  Monist prediction:
  - How many species? The monist would look for lineage segments. The entire ring is one lineage? But note the terminal forms do not interbreed and are separated. Also, the serpentine form is reciprocally monophyletic and ecologically distinct. The monist might say there are two species: the serpentine form and the rest (which is one species because of continuous gene flow around the ring) OR they might say that the entire ring is one species because it is one continuous lineage (with a break only at the secondary contact). But note the secondary contact is recent (9000 years) and the lineage has been diverging for 80,000. The monist might say that the two terminal forms are separate lineages because they are reproductively isolated in the field and have been for 9000 years. So two species? But the ring is connected by gene flow. This is tricky. The monist might argue that the ring is one species because it is one interconnected metapopulation, but the terminal forms are not exchanging genes so they are on the way to separation. However, without complete lineage separation, they are still one. But then why is the serpentine form monophyletic? That might be evidence of a barrier. The monist might say: the lineage is one, but within it there are subpopulations that are evolving independently to some degree. However, until there is a clear split, it is one species. So the monist might say one species? But then the legal protection of the serpentine form might be at the subspecies level. Alternatively, the monist might use the evidence of reproductive isolation in the field to say that the two terminals are separate lineages. So two species? The monist might be torn. But the prompt says the monist holds that species are segments of metapopulation lineages. The key is whether there is one lineage or two. The fact that the two terminals are not interbreeding and are separated (with the ring connection) might mean that they are two lineages. This case is designed to be ambiguous.

  But the prompt says: "the two terminal forms meet in the south and do not interbreed in the field". So in the field, they are reproductively isolated. In the greenhouse, adjacent populations interbreed, but the terminals do not. So the monist might say: the entire ring is one metapopulation lineage? Or two? Since the terminals are not exchanging genes, and the rest are connected, but the terminals are disconnected, maybe two lineages? But the ring is continuous. The monist might say that the ring is one species, but the terminals are incipient species? But the monist does not recognize incipient species as species until they are separate. The monist might say one species, but then the legal protection is for a subspecies.

  But note: the monist might use the reciprocal monophyly as evidence of lineage separation. So:

  Monist prediction: 
  - How many species? There is one species (the entire ring) because it is one continuous metapopulation lineage. However, the serpentine form might be considered a distinct population but not a separate species. Alternatively, the monist might argue that the reproductive isolation at the terminals and the monophyly of the serpentine form indicate that the serpentine form has become a separate lineage. So the monist might say two species: the serpentine form and the rest (which is one species). But the rest is not monophyletic? The monist doesn't require monophyly necessarily, but it can be evidence. So the monist might be uncertain, but the number is determinate (it's either one or two) and in principle knowable with more evidence.

  The pluralist would say: under the ecological concept, the serpentine form is a species; under the biological concept, there are two species (the two terminals) but then the intermediates are a problem? The biological concept might see the ring as one species because of the intergradation. This is messy.

  We must write predictions as if the result were not in.

  Pluralist prediction for Case A:
  - The number of species in the complex is not fixed; it can be one (if the entire ring is considered a single species under a cohesion concept), two (if the terminal forms are considered species under a reproductive isolation concept), or more (if diagnosable forms are recognized). The question "how many species?" has no determinate answer without specifying a concept. At a single time slice, the answer varies by concept; over the entire history, the answer is even more concept-relative because it involves temporal boundaries. The legal listing should protect the serpentine population as an evolutionarily significant unit.

  Monist prediction for Case A:
  - The complex is one metapopulation lineage that has expanded and diversified. The terminal forms are not completely separated because of the ring connection, so there is one species. The serpentine form is a distinct population but not a separate species. However, if evidence shows that the serpentine form is a separate lineage (e.g., due to the reproductive isolation and monophyly), then it might be a species. But given the continuous gene flow around the ring, the lineage is one. The number is determinate (one) but might become two if the terminal split becomes complete. Over the 80,000-year history, the lineage is one. The legal listing as a threatened species should protect the entire species, but the law might be interpreted to protect the distinct population (subspecies) if it is at risk.

  What would move the pluralist? If in this case, all concepts converged on the same groupings and boundaries, that would challenge the pluralist's expectation of divergence. But the case is designed to show divergence.

  What would move the monist? If it were shown that the entire ring is clearly two or more lineages despite the connections, that would support the monist's view that lineage separation is the key. But the case has ambiguity.

  Case B: kappa clade (asexual bacteria)

  Cruxes: Whether the clade is one lineage or several; whether the ecotypes are species; whether the monist's criterion survives.

  Description: Two ecotypes, recombination within each at twice the mutation rate, between at 1/20th. Gene content turnover, but a core of vertically transmitted genes. Periodic selective sweeps.

  Pluralist prediction:
  - The clade is one lineage (because of the core genes) but contains two ecologically distinct groups. The ecotypes are species under an ecological species concept because they occupy distinct niches and are evolutionarily independent due to the sweeps. They are not species under a biological concept (no sex) or a phylogenetic concept (if the gene content turnover causes paraphyly). The monist's criterion (lineage separation) is difficult to apply because without sex, the concept of a metapopulation lineage is unclear. The monist might need to adjust the criterion.

  Monist prediction:
  - The clade is one lineage because of the vertical core. However, the two ecotypes are separate metapopulation lineages because they are ecologically distinct and because the low recombination between them and the sweeps within each indicate that they are evolving independently. Thus, the ecotypes are two species. The monist's criterion survives because lineage separation can occur without sex, as evidenced by the lack of gene flow (low recombination) and independent evolution.

  What would move the pluralist? If the monist can provide a clear and non-arbitrary way to delineate lineages in asexual organisms that matches the groupings from other criteria, that would be a point in favor of monism.

  What would move the monist? If it turned out that the between-ecotype recombination is high enough to prevent lineage independence, or if the core genome shows that the ecotypes are not monophyletic, that might challenge the view that they are separate lineages.

  Case C: reticulation and deep time.

  Cruxes: Speciation adding to species number; what the fossil record can settle.

  Description: Fern complex: two parental species hybridize to form a fertile, reproductively isolated allopolyploid that is a new ecological entity. Parents persist. Also, a marine fossil sequence with 5 million years of anagenetic change without branching, with three morphospecies named.

  Pluralist prediction:
  - The allopolyploid is a new species under several concepts: it is reproductively isolated, ecologically distinct, and genetically distinct. Therefore, speciation adds one species (so net increase by one). The fossil sequence: under a morphological concept, there are three species; under a lineage concept, there is one species that changes over time. The fossil record cannot settle lineage segmentation without branching because it lacks the resolution to show reproductive continuity. It can show morphological change, but that is interpreted differently by different concepts.

  Monist prediction:
  - The allopolyploid is a new lineage segment that originates via hybridization and is reproductively isolated from the parents. Therefore, it is a new species, and speciation adds one species (so net increase by one). The fossil sequence: it is one lineage without branching, so there is one species. The fossil record can show that there is no branching, but it cannot show the lineage boundaries without evidence of splitting. However, the monist would say that the lineage is one, so the three morphospecies are arbitrary segments of one species.

  What would move the pluralist? If the fossil record could provide evidence of reproductive isolation (e.g., by showing abrupt changes that might indicate a split even without branching) or if the anagenetic change was so extreme that it would be considered a new species even without branching under a lineage concept? But the monist doesn't do that.

  What would move the monist? If the fossil record showed evidence of two lineages coexisting without branching (which it doesn't in this case) that might challenge the idea that branching is necessary for lineage separation? But the monist doesn't require branching for separation? Actually, the monist says species are segments of lineages, and lineages can separate without branching (e.g., by budding). But in this case, there is no separation, just change. So the monist would not be moved.

  Part 4: Closing paragraph

  State what further work would settle something, what won't be settled, and the single claim each most wants the other to concede. Also, if part is verbal, which part and what the residual is.

  Further work:
  - Empirical: More studies on ambiguous cases (like ring species, asexual groups, and hybridization) to see if one account consistently works or if pluralism is unavoidable.
  - Conceptual: Clarifying the definitions and the metaphysics of lineages.

  What won't be settled: The fundamental disagreement about whether there is one or many legitimate species concepts might not be settled by empirical data alone because it involves metaphysical commitments.

  Each wants the other to concede:
  - Pluralist wants the monist to concede that in some groups (like asexual organisms) the monist's criterion is inapplicable or must be modified so heavily that it becomes one of many.
  - Monist wants the pluralist to concede that in cases where multiple criteria align, it is because they track a single underlying reality.

  Verbal part: The dispute about whether the same taxon can be a species under one concept and not under another is partly verbal. If we fix the meaning of "species", then the answer is no (for the monist) or it depends on the meaning (for the pluralist). The residual substantive issue is whether there is one correct meaning.

