  ### Joint Statement on the Species Problem  
  **Signed by:**  
  [Pluralist Signatory], representing the pluralist perspective  
  [Monist Signatory], representing the lineage monist perspective  

  Following a good-faith adversarial collaboration, we present this statement to clarify agreements, disagreements, and avenues for resolution on the species problem. We affirm the distinction between the *taxon question* (whether a particular group is a species) and the *category question* (what constitutes the species category). Both parties treat species taxa as historical individuals with origin and extinction conditions, and both deny metaphysical privilege to the species rank over higher or lower ranks. This document is structured in four parts: agreed claims, disagreements, tests and predictions for key cases, and a closing reflection.  

  ---

  ### Part 1: Agreed Claims  
  We jointly affirm the following substantive claims, each of which is essential to the debate and phrased neutrally:  

  1. **Reproductive isolation criteria** (e.g., the Biological Species Concept) test the potential for gene flow and barriers to interbreeding between populations, primarily in sexually reproducing, biparental organisms.  
  2. **Diagnosability criteria** (e.g., the Phylogenetic Species Concept) test for fixed character differences (morphological or genetic) that permit group assignment, but they risk fragmenting continuous lineages and are sensitive to sampling density, character selection, and analytical methods.  
  3. **Monophyly criteria** test whether a group forms a clade (an ancestor and all descendants), contingent on the markers and phylogenetic methods used, but do not require reciprocal monophyly at all times.  
  4. **Ecological distinctness criteria** test for occupation of a unique adaptive zone or functional role, assessed through resource use, habitat, or niche modeling.  
  5. **Interbreeding criteria fail for asexual, uniparental, or reticulate groups** due to the absence of gene flow mechanisms, necessitating alternative criteria for these cases.  
  6. **Diagnosability criteria fragment continuously varying lineages** because they impose discrete boundaries on gradual variation; outcomes depend on arbitrary thresholds, character choice, and geographic sampling.  
  7. **Different criteria yield nested, cross-cutting, or incommensurable groupings** depending on context: e.g., reproductive boundaries may nest within diagnosable groups, diagnosable groups may cross-cut cohesive lineages, or ecological groups may be incommensurable with monophyletic clades.  
  8. **Operational criteria are indispensable for identifying species taxa in practice**, regardless of their theoretical status, as they provide testable methods for delimitation.  
  9. **Taxonomy requires a consistent, operational concept** for naming and classification, ensuring stability, communication, and information retrieval, even if concepts vary across clades.  
  10. **Conservation law requires a concept** that identifies evolutionarily significant units at risk, balancing operational practicality with evolutionary reality for legal protection.  
  11. **Biodiversity accounting requires a concept** that enables quantitative comparisons, but it must accommodate diverse life histories and reproductive systems to avoid biased diversity estimates.  
  12. **Within a clade, one criterion often dominates practice** (e.g., reproductive isolation in birds) due to its empirical utility, and comparisons of species richness within such clades can be scientifically meaningful.  
  13. **Cross-cutting taxa are real historical individuals**; for example, a reproductively cohesive group and a diagnosable subgroup may both represent valid biological entities, even if their boundaries misalign.  
  14. **Species taxa persist through anagenetic change**; their temporal boundaries depend on lineage continuity, but operational criteria may set divergent start/end points in the absence of branching.  

  ---

  ### Part 2: Disagreements Table  
  The following table outlines unresolved disputes. Each row addresses a crux, restates it neutrally, and provides separate formulations acceptable to each party. Verdicts assess whether disagreements are verbal (stemming from term usage) or substantive (reflecting deeper incompatibilities).  

  | Crux | Neutral Restatement | Pluralist's Formulation | Monist's Formulation | Verdict |  
  |------|---------------------|-------------------------|----------------------|---------|  
  | **Unicity of the species category** | Whether the species category is defined by one correct account or multiple legitimate ones. | "The species category is legitimately defined by multiple properties (e.g., reproductive isolation, diagnosability), each capturing a distinct real aspect of evolutionary divergence relevant to different investigative questions." | "The species category is defined by a single property: lineage separation (metapopulation lineages evolving independently). Other properties are proxies for this underlying reality." | **Substantive**: Disagreement on whether the category is unified or multifaceted. |  
  | **Conflict among criteria** | Whether discordance among operational criteria (e.g., interbreeding vs. diagnosability) indicates evidential gaps or genuine biological multiplicity. | "Conflicts among criteria reflect genuine multiplicity in evolutionary processes, yielding non-convergent groupings that are equally real under different concepts." | "Conflicts among criteria are symptoms of imperfect proxies or incomplete evidence for lineage separation, not multiple realities; at most one criterion tracks the true species boundary." | **Substantive**: Disagreement on whether discordance is ontological or epistemological. |  
  | **Operational criteria as constitutive or indicative** | Whether meeting a criterion (e.g., reproductive isolation) constitutes species status or merely indicates it. | "Operational criteria (e.g., reproductive isolation for sexual taxa) constitute species status within their investigative context; they define what it is to be a species for that purpose." | "Operational criteria indicate species status but do not constitute it; they are evidence for lineage separation, which is the defining property." | **Substantive**: Disagreement on the role of criteria in defining the category. |  
  | **Concept relativity and taxon identity** | Whether a taxon can be a species under one concept but not another without altering its identity as a historical individual. | "A taxon remains the same historical individual regardless of concept applied; it may be classified as a species under one concept but not another, reflecting relativity in species status." | "The term 'species' refers exclusively to lineage segments; applying a different concept changes what we label as a species but not the taxon itself. A taxon not meeting the lineage criterion is not a species, regardless of other criteria." | **Verbal**: Disagreement hinges on the term "species." Residual substantive issue: whether multiple definitions of "species" are legitimate. |  
  | **Cross-clade species comparisons** | Whether species richness can be meaningfully compared across clades with divergent reproductive systems (e.g., sexual vs. asexual). | "Comparisons across clades are not fully legitimate because different criteria apply; they conflate distinct dimensions of diversity (e.g., reproductive vs. ecological). Within a consistent criterion, comparisons may be valid." | "Species richness is comparable across clades because lineage separation is universal; divergent criteria reflect measurement challenges, not incomparable realities." | **Substantive**: Disagreement on the universality of the species category for diversity metrics. |  
  | **Identity without branching** | What defines species identity over time in the absence of branching events. | "Species identity is determined by the criterion in use (e.g., reproductive continuity or morphological stasis), which may set boundaries incongruent with lineage continuity." | "Species identity is defined by unbroken lineage continuity; anagenetic change alone does not alter identity, as branching is not required for separation from other lineages." | **Substantive**: Disagreement on the necessity of branching for temporal boundaries. |  

