prompt: |-
  I sit on my university's student health benefits committee, and we have now spent two meetings failing to write down what we think we are already doing. Everyone agrees on the slogan — the plan pays for treatment, not for enhancement — but every attempt to turn the slogan into a rule founders on the same question: a baseline relative to what? Here is roughly where we landed, and I want to know what position we have accidentally signed ourselves up for. The draft says the plan covers any intervention whose aim is to return a student to the functional level they would have occupied but for a specific identifiable setback — an illness, an injury, a congenital condition, a diagnosed disorder — or to prevent such a setback; and that it does not cover interventions aimed at lifting a student above that counterfactual level. Then come the items we could not bring ourselves to exclude and therefore wrote in by hand: contraception and fertility treatment; vaccines; correction of ordinary age-related decline such as presbyopia, hearing loss and cataracts; help for conditions that are statistically entirely normal in our student population, including short stature with no hormone deficiency and moderate anxiety; and academic accommodations such as extra exam time. And then the items we did exclude: cosmetic procedures that improve on a student's pre-existing appearance, stimulant medication for a student with no diagnosis, and coaching that mainly raises a competitive score rather than any underlying capacity.

  What bothers me is that the handwritten exceptions seem to eat the rule. If we pay for reading glasses, then the relevant normal is not the species-typical function of a fifty-five-year-old but some youthful baseline that almost nobody of that age actually meets, so we are not restoring normal function in the statistical sense at all. If we pay for help with conditions that are statistically normal, we are not even restoring what is typical for the student's age group. If we pay for vaccines we are routinely raising people above anything unaided nature would have given them, which is the thing the rule says we don't do. And the two exclusions cut against each other: extra exam time and score-focused coaching both make a student better off in a competitive, roughly zero-sum contest, yet we fund one and refuse the other on the grounds that only the second is an advantage — even though extra exam time does not restore any capacity in the student, it changes the test, which looks like neither therapy nor enhancement but a third thing our slogan has no room for. Worst of all, our counterfactual-self baseline seems to make responsibility irrelevant: a student who destroyed their own hearing with loud headphones gets the same coverage as one born hard of hearing, while the same university happily bills students for equipment they break and runs an entire conduct system premised on holding people responsible for what they brought on themselves. A friend on the committee also pointed out that for congenital conditions the but-for self is someone who would have been a different person entirely, so our rule may be quietly relying on some view about who counts as the same individual across counterfactual variation.

  So: what theory of the therapy/enhancement distinction, or of what medicine is for, does a policy like ours actually presuppose? Please reconstruct the implicit view, tell me which parts of it the policy strictly requires and which are merely a comfortable fit, say whether the parts are consistent with one another, and let me know how much of the same policy a rival theory — a welfare-based one, a threshold or capabilities-based one, a view that makes compensation for bad luck central, or a normal-function view — could equally have produced, and what in the document would have to be rewritten if we swapped our implicit theory for one of those. Don't give me reading lists or citations; I want the argument, and I have no way to check references anyway.

  Please structure the reply with the following sections, in this order: "The implicit theory" (about 250 words), "Strict presuppositions vs. comfortable fits" (about 150 words), "Where the handwritten exceptions bite" (about 200 words), "Rival theories that would sign off anyway" (about 150 words), "What would have to change" (about 150 words), and "Bottom line" (about 75 words).
reasoning: |-
  Hmm, the user is part of a university student health benefits committee struggling to define what counts as "treatment" versus "enhancement" in their policy. They've drafted a rule based on restoring a student to their "but-for" baseline after setbacks, but handwritten exceptions for things like contraception and reading glasses seem to contradict it. The user wants to understand the philosophical foundation they've accidentally committed to, how consistent it is, and how other frameworks would change their policy.

  The core tension is between their counterfactual baseline approach and the exceptions that either ignore statistical norms (like covering presbyopia) or proactively alter natural states (like vaccines). The policy seems to implicitly endorse a hybrid theory: it anchors restoration to an idealized individual developmental trajectory (not species-typical function), accepts certain statistical norms as legitimate baselines where typical function is undesirable (e.g., age-related decline), and allows preemptive interventions against "unnatural" threats like diseases. 

  The handwritten exceptions reveal where this theory bends: fertility treatments and academic accommodations don't restore function but address social participation barriers, while excluding cosmetic procedures and stimulants maintains a boundary against perceived non-essential advantages. The welfare-based rival theories could justify similar coverage but would struggle with exclusions like stimulants for non-diagnosed students, as they'd prioritize outcomes over medical necessity. To adopt a strict capabilities approach, the committee would need to define universal functional thresholds and drop counterfactual language—likely requiring major rewrites to accommodate all age-related issues equally. 

  Ultimately, the policy is a pragmatic but unstable compromise. It leans on an unspoken commitment to individual life-course norms while making ad-hoc concessions to student welfare realities. The bottom line: they've built a leaky boat that floats only because everyone rows around the holes.
answer: |-
  ### The implicit theory
  Your policy presupposes a **normative developmental baseline theory**: medicine should restore or protect an individual's expected trajectory of functioning across their natural lifespan, incorporating societal expectations of typical participation. Key elements:  
  1. **Counterfactual self as anchor**: The "but-for" self isn't statistical normality but an idealized, unimpeded version of *this individual*'s development path. Congenital conditions are deviations from this path, implicitly defining personhood as tied to core identity (e.g., a deaf student's "true self" isn't hearing).  
  2. **Lifespan relativism**: Age-related decline correction (e.g., presbyopia) isn't enhancement because it maintains *youth-equivalent function*—your baseline isn't species-typical function at age 55, but the functional level expected for that individual absent age-related pathology.  
  3. **Preemption as restoration**: Vaccines prevent deviations from the natural trajectory, so they align with "preserving" the baseline.  
  4. **Social participation threshold**: Covered "statistically normal" conditions (e.g., moderate anxiety) and accommodations (extra time) reflect a view that medicine must enable *effective social agency*—here, academic participation—even if no "underlying capacity" is restored.  

  ### Strict presuppositions vs. comfortable fits  
  **Strictly required**:  
  - The counterfactual self as the moral anchor (excluding enhancement claims like cosmetic surgery).  
  - Interventions must link to a "setback" (congenital/organic pathology, injury, or statistically significant impairment).  
  - Social participation as a goal (justifying accommodations).  

  **Comfortable fits**:  
  - Vaccines fit preemption but stretch "returning" to baseline.  
  - Fertility treatment fits *reproductive* agency but conflicts with "but-for injury" logic—infertility may not stem from a "setback."  
  - Excluding stimulants relies on diagnostic gatekeeping, not core theory.  

  ### Where the handwritten exceptions bite  
  The exceptions expose tensions:  
  - **Age-related decline**: By covering presbyopia correction, you reject *statistical* norms (55-year-old vision) for *biographical* norms (maintaining youthful function). This reframes "therapy" as sustaining peak capacity.  
  - **Vaccines**: These *are* enhancements by unaided nature standards—your policy implicitly redefines "natural" as an optimal, threat-free developmental path.  
  - **Academic accommodations**: Extra time alters environmental demands, not the student. This fits a *capabilities* approach (enabling function via context) but clashes with "restoring internal capacity."  
  - **Responsibility blindspot**: The theory ignores self-inflicted harm (headphone-induced hearing loss) because it focuses on *current deviation* from the counterfactual self, not causation—this is a feature, not a bug, of your baseline theory.  

  ### Rival theories that would sign off anyway  
  A **capabilities approach** (focusing on core human function thresholds) could endorse nearly all your inclusions (vaccines, glasses, accommodations, anxiety treatment) and exclusions (cosmetics, non-medical stimulants). A **luck-egalitarian** view (compensating for misfortune) would cover congenital conditions and injuries identically (as "bad luck”) but might exclude self-inflicted harm. A **welfare-based** theory could justify all exceptions via well-being gains but would struggle to exclude cosmetic procedures or stimulants if they boost welfare.  

  ### What would have to change  
  - **For strict normal-function theory**: Exclude presbyopia correction (not species-typical for age) and accommodations (not medical restoration).  
  - **For luck egalitarianism**: Exclude self-inflicted conditions (headphone hearing loss) or include them only with penalties.  
  - **For capabilities threshold**: Cover all conditions (including "normal" short stature) that impede core capabilities (e.g., education), but drop counterfactual language—define universal functional thresholds instead.  
  - **For welfare maximization**: Include cosmetic procedures and stimulants if proven to improve well-being.  

  ### Bottom line  
  Your policy assumes medicine should protect an individual’s "natural" developmental arc and social agency, rejecting statistical norms for biographical ones. The exceptions aren’t inconsistencies but adjustments to this core idea. It’s philosophically coherent but practically unstable—the rivalry between "setback" and "agency" logic will keep generating edge cases. To stabilize it, explicitly define "social participation thresholds" and accept that maintaining function isn’t restoration but permissible enhancement.
