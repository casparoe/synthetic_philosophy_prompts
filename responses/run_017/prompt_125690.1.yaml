  ### Decision Tree for Sorting Views  
  *(Branch nodes based on logical space; leaves are views)*  

  1. **Does any practical factor affect the *truth* of "S knows p"?**  
     - **No** → Classical invariantism (pragmatic/error-theoretic).  
     - **Yes** → Proceed to 2.  

  2. **Whose situation does the difference track?**  
     - **Attributor's context** → Attributor contextualism (Cohen-DeRose).  
     - **Assessor's context** → Assessment-sensitive relativism.  
     - **Subject's situation** → Proceed to 3.  
     - **Contrast class** → Contrastivism.  

  3. **How does the subject's situation affect knowledge?**  
     - **Sets threshold for belief/credence** → Credal threshold view.  
     - **Affects relevant alternatives** → Subject-sensitive invariantism (Hawthorne-Stanley).  
     - **Affects justification/rational action (not belief)** → Interest-relative invariantism (Fantl-McGrath).  
     - **Affects whether S counts as believing** → Belief-not-knowledge view.  

  4. **For interest-relative views: What drives the effect?**  
     - **Cost of error alone** → Pure cost view.  
     - **Cost discounted by probability** → Expected cost view.  

  5. **Can practical factors *lower* standards (not just raise them)?**  
     - **Yes, bidirectional** → Most subject-sensitive/contextualist views.  
     - **No, only raises standards** → Asymmetric views (rare).  

  **Leaves:**  
  - Classical invariantism (pragmatic)  
  - Attributor contextualism  
  - Subject-sensitive invariantism (SSI)  
  - Interest-relative invariantism (IRI)  
  - Credal threshold view  
  - Belief-not-knowledge view  
  - Assessment-sensitive relativism  
  - Contrastivism  
  - Unnamed/bespoke views  

  ---

  ### Scoring Key and Diagnostics  
  *(Mapping answer patterns to leaves; A=1, B=2, C=3 for brevity)*  

  **Key Patterns:**  
  - **Classical Invariantism (pragmatic):** Mostly A (truth unaffected by stakes). E.g., (1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A).  
  - **Attributor Contextualism:** (1B, 2A, 3B, 4B, 5B, 6A, 7B, 8B, 9C, 10B). High attributor standards → denials.  
  - **Subject-Sensitive Invariantism (SSI):** (1B, 2B, 3A, 4B, 5A, 6A, 7B, 8B, 9B, 10B). Tracks subject’s stakes.  
  - **Interest-Relative Invariantism (IRI):** Identical to SSI in this test—**collapse** (see diagnostics).  
  - **Credal Threshold View:** Matches SSI/IRI; no separation.  
  - **Belief-not-Knowledge View:** (1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A). Like classical invariantism.  
  - **Assessment-Sensitive Relativism:** Mirrors attributor contextualism; **indistinguishable** here.  
  - **Contrastivism:** Mostly C (9C anchor). E.g., (1C, 2C, 3C, 4C, 5C, 6C, 7C, 8C, 9C, 10C).  

  **Internally Unstable Patterns:**  
  - (1A, 2B, ...): Claims no stakes effect in calibration but allows it elsewhere—incoherent.  
  - (1B, 2A, 3A, ...): Denies knowledge in high-stakes calibration but attributes it in high-stakes I2—unstable for most views.  
  - (5A, 6B): Accepts secret stakes don’t matter but claims deliberate/imposed stakes differ—no major theory supports this.  

  **Coherent but Unoccupied Patterns:**  
  - **Asymmetric standards** (only high stakes raise standards): Possible but unattractive; no prominent defender.  
  - **Pure cost view** (ignores probability): Coherent but unexplored; most IRI/SSI use expected cost.  

  **Indistinguishable Pairs and Diagnostics:**  
  1. **SSI vs. IRI:** Collapse. Both treat subject’s stakes as truth-relevant. *Separator needed:* A case where cost is high but error probability is near-zero (Item 8: both say B). To split, add: *Belief p, high cost if ¬p, but S is certain (p=1.0).* IRI might still deny knowledge; SSI (relevance-focused) may allow it.  
  2. **Attributor Contextualism vs. Assessment Relativism:** Indistinguishable without disagreement cases. *Separator:* A vignette where two assessors disagree (e.g., low-stakes assessor says “knows,” high-stakes assessor says “not”).  
  3. **Credal Threshold vs. SSI/IRI:** No separation. *Separator:* A case where belief is firm (credence=0.99) but stakes force higher threshold—credal view denies knowledge; SSI/IRI may allow if alternatives are ruled out.  
  4. **Classical Invariantism vs. Belief-not-Knowledge:** Both yield mostly A’s. *Separator:* A case where high stakes make belief irrational (but evidence is identical)—latter denies belief/knowledge.  

  **Recommendation:** For SSI/IRI separation, use a variant of Item 8 with *certainty* (e.g., mathematical proof with catastrophic error cost). For attributor vs. assessor, add a disagreement case.
