     - **C:** Underdescribed; depends on further facts.  

  4. **Purely Epistemic Stakes**  
     *Sam, a scientist, believes a conjecture is true based on strong but incomplete evidence. If false, Sam’s team will publish 1,000 flawed papers, wasting years of effort—but no practical/moral harm occurs.*  
     **Question:** Does Sam know the conjecture is true?  
     - **A:** Yes.  
     - **B:** No.  
     - **C:** Underdescribed; depends on further facts.  

  5. **Secret Stakes**  
     *Morgan believes a coin is fair after 100 flips. Unbeknownst to Morgan, a stranger bet $1 billion on Morgan being right. Morgan couldn’t discover the bet.*  
     **Question:** Does Morgan know the coin is fair?  
     - **A:** Yes.  
     - **B:** No.  
     - **C:** Underdescribed; depends on further facts.  

  6. **Deliberate vs. Imposed Stakes**  
     *Case 1: Lee voluntarily bets $1 million on a horse winning, believing it based on form guides.  
     Case 2: Kim is forced to bet $1 million on a horse at gunpoint, believing it based on the same guides.*  
     **Question:** Is "knows the horse will win" true in both cases?  
     - **A:** True in both or false in both.  
     - **B:** True in Case 1 only.  
     - **C:** Underdescribed; depends on further facts.  

  7. **Opposed Stakes for Two Parties**  
     *A jury deliberates guilt. Juror A believes the defendant is guilty (same evidence as Juror B). If wrong and guilty, a criminal goes free (high stakes for Juror B). If wrong and innocent, an innocent is jailed (high stakes for Juror A).*  
     **Question:** Does Juror A know the defendant is guilty?  
     - **A:** Yes.  
     - **B:** No.  
     - **C:** Underdescribed; depends on further facts.  

  8. **Huge Stakes, Minute Error Probability**  
     *Riley must press a button if a code is correct. Riley believes it is (source error: 1 in 1 billion). If wrong, millions die. The stakes are catastrophic, but error chance is tiny.*  
     **Question:** Does Riley know the code is correct?  
     - **A:** Yes.  
     - **B:** No.  
     - **C:** Underdescribed; depends on further facts.  

  9. **Contrast-Dependent Stakes**  
     *Casey, a guard, believes a person is an employee (ID checked). If a terrorist (contrast A), disaster occurs (high stakes). If a lost delivery person (contrast B), it’s harmless (low stakes).*  
     **Question:** Does Casey know the person is an employee?  
     - **A:** Yes.  
     - **B:** No.  
     - **C:** Underdescribed; depends on further facts.  

  10. **Many Small Compounding Decisions**  
      *Taylor, an accountant, believes a tax rule applies (read the law). Taylor files 10,000 returns. If wrong, each client loses $1, but total loss is $10,000.*  
      **Question:** Does Taylor know the tax rule applies?  
      - **A:** Yes.  
      - **B:** No.  
      - **C:** Underdescribed; depends on further facts.  

