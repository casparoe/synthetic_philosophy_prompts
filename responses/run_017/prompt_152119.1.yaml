  - Why "just a word choice" feels wrong despite shared facts 
  - How consequences (legal/biodiversity) make it feel substantive 
  - Why mutual utility-admission doesn't resolve it 

  I recall similar debates in metaphysics about "joints of nature." The user's insistence that both criteria are "sharp" suggests they see species categories as discoveries, not inventions. But the friend's stance echoes conventionalism. 

  *Pause to consider frameworks:*
  - **Carnapian tolerance**: Different linguistic frameworks, both valid → but user rejects this as too "stipulative"
  - **Boydian realism**: Homeostatic property clusters → but rigid criteria clash here
  - **Pluralism**: Kitcher's view that multiple species concepts are legit → close, but user wants diagnostic precision 

  Aha! The crux is **ontological indecision under semantic variance**. The world doesn't dictate which grouping criterion (interbreeding, phylogeny, etc.) is metaphysically privileged. Yet the stakes make it feel non-arbitrary. 

  *Testing against user's details:*
  - Asexual organisms example shows criteria-switching is routine → supports conventionalism
  - But user's "right one vs. tool" intuition mirrors Putnam's "objective epistemic values" 

  Best diagnosis: **Normative essence projection**. Both friends mistake their preferred operational criterion for the "true" ontological boundary. The disagreement is meta-ontological—about what *makes* a grouping real, not the grouping itself. 

  *Why this fits:*  
  - Explains why "mere word" feels insufficient (norms feel objective)  
  - Accounts for stakes (norms govern action)  
  - Clarifies why utility admissions don't help (norms aren't pragmatic) 

  For the friend to be right: Species categorization must be wholly conventional. For user to be right: There must be a mind-independent "species-making" property. But current biology suggests neither is true—hence the stalemate. 

  *Coined term:* **Criterial divergence**—when agents agree on base facts but project incompatible normative priorities onto domain structures. Contrasts with vagueness (no sharp criteria) or verbal disputes (no stakes). 

  Final note: User's push for "what would settle it" is telling. In criterially divergent cases, resolution requires meta-agreement on epistemic aims (e.g., conservation vs. mechanisms), not more data. That's the pivot they missed in the argument.
answer: |-
  What you're describing is an exceptionally crisp case of **ontological divergence under semantic anchoring**. It's not merely verbal, not vagueness, not incomplete data—it's a specific epistemological configuration where shared empirical bedrock fractures over the *ontological significance* attributed to that bedrock, using a term ("species") that serves as the battleground for deeper commitments about natural kinds. Let me unpack why standard diagnoses fail and why this one fits.

  First, eliminate the nearby distractors:  
  - **Not mere semantics**: If it were *just* about the word, stipulation would resolve it, and downstream consequences wouldn't feel substantive. But your stakes (legal protection, biodiversity metrics) reveal that "species" anchors real-world ontologies—ways of carving existence that license actions.  
  - **Not vagueness**: Vagueness involves borderline cases where gradients defy sharp boundaries. Here, you each have precise criteria (e.g., interbreeding thresholds vs. phylogenetic divergence) yielding definite but conflicting verdicts. The disagreement isn't fuzzy; it's binary.  
  - **Not factual ignorance**: Mutual agreement that perfect data wouldn't resolve it shows the rift lies elsewhere.  
  - **Not conventionalism**: Your friend's "preference" framing misses that you both claim *correctness*, not convenience. The admission that the other's criterion is "useful" doesn't concede it's *true*—it's like acknowledging a flat-Earth model works for local navigation while insisting it's cosmologically false.  

  ### The Core Structure: Ontological Divergence
  The disagreement is about **which empirical patterns merit ontological privilege**. You agree on the patterns (gene flow, morphology, etc.), but disagree on which pattern *defines a natural kind*. This is metaphysical, not biological. Consider:  
  1. **Shared substrate**: All facts about populations (gene flow, traits, history) are agreed upon.  
  2. **Divergent criteria**: Each criterion (e.g., reproductive isolation vs. monophyly) selects different subsets of facts as *kind-constitutive*.  
  3. **Semantic anchoring**: "Species" is the linguistic hook for this ontological choice, but the conflict isn't about the word—it's about what the word *ought to track* in nature.  
  4. **Stakes**: The choice affects interventions (conservation, policy) because different criteria highlight different aspects of biodiversity as "real" or "significant."  

  ### Why "Ontological Divergence" Fits Best
  - **Diagnostic features**:  
    - **Empirical agreement + criterion clash**: You concur on what *is*, but not on what *matters* for kindhood.  
    - **No arbitration procedure**: No experiment can prove whether reproductive isolation or genetic distance is the "true" marker of species boundaries. Biology offers multiple legitimate perspectives (interbreeding, ecology, phylogeny), each valid for specific questions but none metaphysically privileged.  
    - **Stakes derive from ontological commitments**: Legal protection hinges on what counts as a "distinct" entity. Your splitter sees lineages as primary; your lumper sees cohesive gene pools. Both are real patterns, but prioritizing one has material consequences.  
    - **Asexual organisms reveal the fracture**: When sex disappears, the interbreeding criterion *fails to apply*, forcing a shift. This exposes that "species" isn't a unified natural kind but a *framework-dependent category*.  

  ### What Would Settle Who's "Right"?
  - **For your friend to be correct**: It would require that species concepts are *purely operational tools* with no mind-independent referent. "Correctness" would reduce to consensus within a biological subfield (e.g., ornithologists vs. bacteriologists). The stakes would be purely pragmatic, not ontological.  
  - **For you to be correct**: There would need to be a *single, universal species-making property* in nature (e.g., reproductive isolation as the One True Criterion), with other criteria merely approximating it. Biology itself rejects this; asexual taxa and ring species show no universal essence.  

  ### Why Neither Wins: The Pluralist Reality
  Biology suggests **ontological pluralism**: nature presents multiple, overlapping ways of being a "species," each capturing real but non-identical patterns. Your dispute persists because:  
  - You both mistake your criterion for *the* metaphysical boundary, rather than one lens among many.  
  - The stakes (conservation, etc.) *feel* like they demand a single answer, but nature doesn't supply one. The "downstream consequences" arise from human needs (e.g., prioritizing lineage uniqueness vs. ecosystem function), not biological absolutes.  

  ### Coining a Term: Criterial Divergence
  If "ontological divergence" feels too broad, call this **criterial divergence**: a disagreement where parties agree on all descriptive facts but irreconcilably prioritize different criteria for assigning a concept (here, species-hood) to those facts, due to conflicting implicit ontologies.  
  - **What it includes**: Cases with sharp criteria, empirical consensus, non-arbitrary stakes, and no meta-criterion for choosing between frameworks (e.g., debates over whether viruses are "alive" given agreed molecular mechanisms).  
  - **What it excludes**:  
    - Borderline cases (e.g., "is this shade teal?" where criteria agree but thresholds blur).  
    - Purely verbal disputes (e.g., "is tomato a fruit?" where culinary vs. botanical criteria are contextually accepted).  
  - **Nearby but distinct**: Value disagreements (e.g., "is this just?") where facts *are* disputed, or underdetermination in science (e.g., quantum interpretations) where data itself is sparse.  

  ### Resolution Strategy
  This isn't resolvable by biology or logic alone. The path forward is **meta-ontological negotiation**:  
  1. Expose the implicit priorities (e.g., "I care about preserving unique evolutionary trajectories" vs. "I care about functional ecological units").  
  2. Acknowledge that criteria are tools aligned with goals, not revelations of nature's joints.  
  3. Let the stakes *determine* the criterion: use phylogeny for conservation law, interbreeding for zoo breeding programs.  

  You're not fighting about a word or a fact. You're fighting about which pattern in nature deserves to be reified—and biology, quite simply, doesn't care which you choose. The frustration is the friction between human categorization and nature's indifference.
