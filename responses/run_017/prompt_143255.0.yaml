    We do:

      - We first describe the split as two labels: A and B, each weight 1/2, and two branches (one for A, one for B).

      - Participants write `f_A` and `f_B`.

      - Then, before they open the envelope, we announce: "We have just been informed by the experimenters that what we called branch B is actually composed of 1000 identical branches, each of weight 1/2000. Branch A remains one branch of weight 1/2. The total weight of B is still 1/2."

      - Then we ask: "Do you want to change your fractions? You cannot, because you have already committed. But we want you to reflect: would you change? And if so, why?"

    Then we open the envelopes to see which branch they are in.

    The point: if they care about branch count, they would want to increase `f_B` because there are now 1000 branches for B. But the weight is the same.

    We then discuss.

  Round 4: Irrelevant-device round.

    We describe: there is a machine in the next room that will split into a huge number of branches (say 1000 branches) with equal weight, but this splitting does not affect anything in our room. It is causally isolated.

    Then we have a split in our room: two branches, A and B, with weights 1/3 and 2/3.

    We assign participants to A or B with weights 1/3 and 2/3 (by a random draw).

    We offer a coupon for A.

    Participants write `f_A` (for the coupon that pays if they are in A).

    Then, after they commit, we reveal the machine in the next room has split, creating 1000 branches. But this does not change the weights in our room.

    We ask: should your `f_A` change? Why or why not?

    We do not let them change, but we discuss.

  Round 5: Near-null branch.

    We have a split into three branches: A (weight 0.499999), B (weight 0.499999), and C (weight 0.000002).

    We offer a coupon for branch C.

    Participants write `f_C`.

    We expect: if they are sensitive to weight, they should put a very small fraction. If they care about branch count, they might put 1/3.

    We also offer coupons for A and B? Not necessarily. We can just do for C.

  Debrief:

    We map:
      - Round 1: Agreement between branch count and weight. Most people use one of these and it works.
      - Round 2: Disagreement. We see if people use branch count (1/2 for both) or weight (1/4 and 3/4).
      - Round 3: Fine-graining: if you care about branch count, you would want to change your fraction for B to near 1 (because there are 1000 branches out of 1001 total branches now) but the weight is still 1/2. So it breaks branch counting.
      - Round 4: Irrelevant device: if you care about the total number of branches (including the next room), you might change your fraction for A. But since it's isolated, it shouldn't.
      - Round 5: Near-null: branch counting would say 1/3, but weight says almost 0.

    Then we discuss the care-functions they wrote. We ask: what function did you write? How did it fare in these rounds?

    We then state the constraints:

      1. Insensitivity to fine-graining: if you split a branch into many fine branches (with the same total weight), the care for that label should not change.
      2. Insensitivity to causally isolated branching: adding branches elsewhere that are isolated should not change the care.
      3. Continuity: a branch with very small weight should get very small care.
      4. Sane zero limit: a branch with weight zero should get care zero.

    Then we ask: which care-functions survive? The function `C(w, n, N) = w` (ignoring n and N) survives. The branch counting function `C(w, n, N) = n/N` fails at fine-graining and irrelevant device.

    But what about other functions? For example, `C(w, n, N) = w * n`? That fails at fine-graining: if you split a branch into many n, then n increases, so C increases even though w remains the same.

    The function `C(w, n, N) = w` is the only one that satisfies all the constraints? What about `C(w, n, N) = w * constant`? But we want it to be between 0 and 1, and normalized to the total weight is 1. So `w` is the natural choice.

    But note: the care function is for the entire label. The weight of the label is w. So it's independent of n and N.

  Honesty about limits:

    The game has rigged that amplitude-squared weighting (which is the weight w) is the one that works. But in the actual quantum mechanics, the weight is the amplitude squared. The real debate is: why should a rational agent care about the weight? The decision-theoretic derivation (e.g., by Deutsch and Wallace) tries to show that a rational agent who is concerned about the welfare of their future descendants must act as if they are maximizing expected utility with respect to the weights. The game does not derive that; it assumes that the weight is the physical quantity that should be used, and then shows that branch counting fails. But the live debate is about whether the weights are the only quantities that satisfy reasonable constraints.

    We should tell the participants: "In this game, we have taken the weight as a given physical quantity. But in the Everett interpretation, the weight is the squared amplitude of the branch. The debate in the literature is whether we can derive that rational agents must use these weights as probabilities. The decision-theoretic derivations aim to do that. We have shown that if you want a care-function that is insensitive to fine-graining and to irrelevant branching, then you must use the weight. But we have not proven that the weight must be the squared amplitude. That comes from the quantum mechanics. And we have not proven that you must have a care-function at all. That is where the decision theory comes in."

  Failure modes:

    1. Participants treat branching as ordinary ignorance (probabilistic uncertainty).
      - In the moment: Point out that in ordinary uncertainty, you don't become multiple copies. In branching, you will have multiple future copies, and you are one of them. But in the game, we are simulating by random assignment. We did that for practicality.
      - In debrief: Discuss the difference.

    2. Participants answer for the group average.
      - Encourage them to think personally: "Which fraction would you pay to get the prize in the branch you end up in?"

    3. Participants insist they will simply be the one in the biggest branch.
      - Explain: there is no 'the one' in the biggest branch. You will be in one branch, but the measure of branches where you are in the big branch is high, but you might be in a small branch.

    4. Physics students try to compute their way out.
      - Allow them to compute, but then ask: "But what if there is no probability? How do you decide what to care about?"

    5. Participants notice that the facilitator controls the reveal.
      - Admit: "Yes, in this game, I control the setup. But in the universe, the quantum mechanics controls the branching."

    6. Room splits on coupon price and neither side moves.
      - Record both views and use it in the debrief: "Some of you thought the fraction should be the branch count, others the weight. Then we saw in round 3 that branch count leads to an absurd update when we fine-grain. So which do you prefer now?"

  Implementation plan:

    Time: 100 minutes.

    - 10 min: Introduction and explanation of the game, the payment mechanism, and the care-function elicitation.
    - 10 min: Participants write down their care-function (anonymously? or by number).
    - 15 min: Round 1 (split into A and B with three branches). Elicit f_A and f_B. Reveal branches.
    - 15 min: Round 2 (split into A and B with weights 1/4 and 3/4, represented as two branches). Elicit f_A and f_B. Reveal branches.
    - 15 min: Round 3 (split into A and B, each weight 1/2, then reveal B is 1000 branches). Elicit f_A and f_B before reveal, then announce fine-graining, then reveal branches.
    - 15 min: Round 4 (split into A and B with weights 1/3 and 2/3, and a machine in the next room branches into 1000). Elicit f_A. Then reveal about the machine. Then reveal branches.
    - 10 min: Round 5 (split into A, B, and C with tiny weight for C). Elicit f_C. Reveal branches.
    - 10 min: Randomly select the payment round and coupon, draw p, and compute payments (or do this after the session to save time?).
    - 20 min: Debrief and discussion.

    Total: 100 minutes.

    We may need to adjust time.

    Note: In each round, we record the coupon fractions on the whiteboard (anonymously) to show the distribution.

    We collect the care-functions and then in the debrief, we discuss which ones passed the tests.

    We also discuss the failure modes as they arise.

    The payment: we do the random draw for the round and coupon at the end, then draw p, and then for each participant, we compute their net and pay them in cash or chocolate.

    We hope this helps the group confront the problem and see why the Born rule (weight = amplitude squared) is a natural solution.

  Let's finalize the design.
answer: |-
  Below is a designed branching betting game for your session, structured to meet your constraints and desiderata. The game uses sealed envelopes for branching, a whiteboard for recording certainty-equivalents, and small stakes (e.g., $30 in chocolate prizes). The sequence flirts with branch-counting intuitions before exposing their flaws, culminating in a debrief that maps game moments to the Everettian probability problem. I address honesty about limits and failure modes at the end.

  ---

  ### **Game Design: "The Branching Bargain"**
  **Physical Setup**  
  - **Branching Mechanism**: Use sealed envelopes for each split. Envelopes contain colored cards (e.g., red/blue) denoting branches. Participants draw envelopes but **do not open them** until a coordinated "reveal" (e.g., facilitator counts down, all open simultaneously).  
  - **Isolation**: After drawing, participants move to corners labeled by card color (e.g., red corner, blue corner). Only those in the same corner interact briefly during reveals.  
  - **Prize**: $30 worth of chocolate bars (e.g., 15 bars, each worth $2). A "full prize" = one chocolate bar.  
  - **Coupon Elicitation**: Before each split, participants write their "coupon price" (a fraction of the chocolate bar they would pay) for a coupon that pays:  
    - **Full prize** if they end up in a **designated branch** (e.g., "red").  
    - **Nothing** otherwise.  
    Prices are written privately, collected, and displayed anonymously on a whiteboard as a distribution (e.g., "Red coupon prices: 0.3, 0.4, 0.5...").  

  **Care-Function Elicitation**  
  At the start, participants write a personal **care-function**:  
  > *"How much do you care about a future descendant in a branch, given:  
  > - `w` = weight of the branch (sums to 1 across branches).  
  > - `n` = number of identical branches of this type.  
  > - `N` = total branches in the split.  
  > Output: the fraction of a prize you'd pay to ensure that descendant gets it."*  

  Examples of natural functions:  
  - `C(w, n, N) = n/N` (branch-counting).  
  - `C(w, n, N) = w` (weight-only).  
  - `C(w, n, N) = w * n` (hybrid).  

  **Round Sequence**  
  *Total time: ~60 minutes (leaves 40 min for debrief).*  

  1. **Round 1: Flattering Branch-Counting**  
     - **Split**: "Red" (weight = 1/3) vs. "Blue" (weight = 2/3). Represented as **3 branches**: 1 red, 2 blue (each with weight 1/3).  
     - **Elicit**: Coupon prices for **red** (1 branch) and **blue** (2 branches).  
     - **Expected Result**: Branch-counting (`n/N`) and weight (`w`) both give red = 1/3, blue = 2/3. Prices cluster around 0.33 and 0.66. Participants feel validated.  
     - **Physical**: Envelopes: 1 red, 2 blue. Participants draw one, move to red/blue corners for reveal.  

  2. **Round 2: Breaking Agreement**  
     - **Split**: "Green" (weight = 1/4) vs. "Yellow" (weight = 3/4). **2 branches**: 1 green, 1 yellow (unequal weights).  
     - **Elicit**: Coupon prices for **green** and **yellow**.  
     - **Expected Result**: Branch-counters price both at 0.5; weight-users price green at 0.25, yellow at 0.75. Distribution splits. Tension arises.  
     - **Physical**: Envelopes: 1 green, 1 yellow. Assign weights via a biased draw (e.g., facilitator uses a random number generator to assign branches, ensuring ~25% get green).  

  3. **Round 3: Fine-Graining Reveal**  
     - **Split**: "Orange" (weight = 1/2) vs. "Purple" (weight = 1/2). **2 branches**: 1 orange, 1 purple.  
     - **Elicit**: Coupon prices for **orange** and **purple**. Prices typically cluster at 0.5.  
     - **Reveal**: After prices are locked, announce: *"Purple is actually 1,000 identical branches, each with weight 1/2000. Orange remains 1 branch (weight 1/2)."*  
     - **Question**: *"Would you change your purple coupon price? Why?"*  
     - **Diagnostic**: Branch-counters want to raise purple’s price (now 1000/1001 ≈1). Weight-users keep it at 0.5.  

  4. **Round 4: Irrelevant-Device Round**  
     - **Setup**: *"A machine in the next room splits into 1,000 branches. This doesn’t affect your local split."*  
     - **Split**: "Pink" (weight = 1/3) vs. "Brown" (weight = 2/3). **2 branches**.  
     - **Elicit**: Coupon price for **pink**.  
     - **Reveal**: After prices are locked, remind them of the machine’s split.  
     - **Question**: *"Should your pink price change? Why?"*  
     - **Diagnostic**: Branch-counters want to lower price (N now ≈1000+ branches). Weight-users see no change.  

  5. **Round 5 (Optional): Near-Null Branch**  
     - **Split**: "Gold" (weight = 0.499999), "Silver" (weight = 0.499999), "Null" (weight = 0.000002). **3 branches**.  
     - **Elicit**: Coupon price for **null**.  
     - **Diagnostic**: Branch-counters price near 0.33; weight-users price near 0.  

  ---

  ### **Debrief Structure**  
  **Time**: 20–30 minutes. Map game moments to the Everettian problem:  
  1. **Certainty-Equivalent ≠ Credence**:  
     - *Game moment*: Paying for a coupon isn’t about *predicting* outcomes (no "ignorance"); it’s about *caring* for a future self in a branch.  
     - *Link*: Probability in Everett is about valuation, not incomplete knowledge.  

  2. **Why Branch-Counting Fails**:  
     - *Game moments*:  
       - **Round 3 (fine-graining)**: If you care about branch count, you must absurdly value near-certainty for high-N splits.  
       - **Round 4 (irrelevant device)**: If you care about N, causally isolated splits (e.g., the machine) distort local decisions.  
     - *Link*: Physical processes can arbitrarily change N without changing weights (e.g., decoherence fine-graining).  

  3. **What Survives? Constraints on Care-Functions**:  
     - **Insensitivity to fine-graining**: C(w, n, N) shouldn’t change if n increases but w stays fixed (fails `n/N`).  
     - **Insensitivity to irrelevant branching**: C(w, n, N) shouldn’t change if N increases elsewhere (fails `n/N`).  
     - **Continuity**: C → 0 as w → 0 (fails if care jumps at w>0).  
     - **Sane zero-limit**: C=0 if w=0.  
     - *Outcome*: Only `C(w, n, N) = w` survives. Hybrids (e.g., `w * n`) fail fine-graining.  

  4. **Where Decision Theory Takes Over**:  
     - The game assumes weights exist. But *why* should rational agents use weights (squared amplitudes)? The game doesn’t derive this—it shows weights are the only *consistent* care-function.  

  ---

  ### **Honesty About Limits**  
  **What the Game Cannot Reproduce**:  
  - **The Derivation Gap**: The game assumes weights (squared amplitudes) are given and shows they are consistent. It does **not** prove that a rational agent *must* use them without invoking "probability." In Everett, the live debate is whether decision theory can *derive* Born-rule behavior from non-probabilistic axioms (e.g., invariance, additivity).  

  **Handling Without Deflation**:  
  - **Facilitator Script**:  
    > *"The game rigged weights to be rewarded because we injected them into the care-function constraints. But in quantum mechanics, weights are squared amplitudes—a physical fact. The real question is: Can we prove that rational agents who never say ‘probability’ would still act *as if* they use these weights? That’s where decision-theoretic derivations (e.g., Deutsch-Wallace) come in. Today, we’ve seen why alternatives (like branch-counting) break. Next week, we’ll see if we can close the gap."*  

  ---

  ### **Failure Modes and Mitigations**  
  | Failure Mode                          | In-the-Moment Response                                                                 | Co-opt or Shut Down?                |  
  |---------------------------------------|----------------------------------------------------------------------------------------|-------------------------------------|  
  | **Treating branching as ignorance**   | *"Remember, you’ll have a copy in every branch—this isn’t uncertainty about which one ‘you’ will be."* Use envelopes to emphasize splitting. | Co-opt: Discuss in debrief (credence vs. care). |  
  | **Answering for group average**       | *"This is personal: What fraction would YOU pay to care for YOUR future self?"*         | Shut down gently.                   |  
  | **"I’ll be in the biggest branch"**   | *"You’ll have a copy in every branch. The ‘biggest branch’ has high weight, but your copy could be in any."* | Co-opt: Use in Round 5 (near-null branch). |  
  | **Physics students computing**        | *"First, set aside QM math. If weights weren’t probabilities, how would you value your descendants?"* | Co-opt: Let them compute, then show inconsistency (e.g., Round 3). |  
  | **Noticing facilitator control**      | *"Yes, I set the weights. In reality, quantum mechanics does. But the consistency tests are the same."* | Co-opt: Highlight that the constraints are physics-agnostic. |  
  | **Room splits 50/50 on prices**       | Run a **vote**: *"Who changed their mind after Round 3? Why?"* Record both views, then use constraints to show one is inconsistent. | Co-opt: "This mirrors philosophy debates!" |  

  **If Stalemate in Round 2**:  
  - **Script**: *"Look at the whiteboard: half of you priced green at 0.5, half at 0.25. Now, let’s see what Round 3 implies for both views."* Use fine-graining to break symmetry.  

  ---

  ### **Logistics**  
  - **Budget**: $30 for chocolate (adjust for 16 people).  
  - **Materials**: Envelopes, colored cards, whiteboard, markers.  
  - **Time Savers**:  
    - Pre-prepare envelopes for splits.  
    - Use a spreadsheet to calculate payments (BDM mechanism) post-game.  
  - **Payment**: After the game, randomly select 1 round and 1 coupon type. Draw a random price `p` (0–1). Participants who bid ≥ `p` pay `p` and get the prize if in the branch.  

  This design forces participants to confront the inadequacy of branch-counting and the uniqueness of weight-based caring, setting up your Born rule discussion. The constraints (fine-graining, irrelevance) emerge naturally from game moves, and the debrief links them to Everettian constraints. By admitting the game doesn’t derive the Born rule but shows its consistency, you transition cleanly to decision theory.
