  ### Prioritisation Panel Procedure for Ranking Transport Schemes

  #### 1. Purpose
  This procedure ensures robust ranking of transport schemes (typically 40-60) through pairwise comparisons. It detects and resolves preference cycles, distinguishes aggregation issues from value-based intransitivities, forces transparency in thresholds, and prevents phasing exploitation. The process runs within two days.

  #### 2. Steps

  **S1: Initial Setup**  
  - *Question*: "List all schemes with unique IDs and one-line descriptions. Identify multi-phase projects (phases declared by promoters)."  
  - *Sufficient answer*: Complete list with IDs and phase flags.  
  - *On failure*: Chair resolves omissions.  
  - *Type*: Factual  

  **S2: Pairwise Comparison**  
  - *Question*: "For each scheme pair (A, B): Is A better than B? If yes, state the *single dominant dimension* (e.g., safety, cost) and *key factual comparison* (e.g., 'A benefits 200 more users'). If equal, state 'tie'."  
  - *Sufficient answer*: Clear preference/tie with dimension and fact.  
  - *On failure*: Chair requires revision until criteria met.  
  - *Type*: Value  

  **S3: Cycle Detection**  
  - *Question*: "Build a directed graph: Arrow A→B if A>B. Are there cycles (e.g., A>B, B>C, C>A)?"  
  - *Sufficient answer*: Graph with cycles identified or "no cycles."  
  - *On failure*: IT support verifies algorithm.  
  - *Type*: Factual  
  - *If no cycles*: Proceed to S7.  

  **S4: Single-Dimension Test**  
  - *Question*: "For each edge in the cycle: Using *only* the dimension stated in S2, is the original preference still valid (e.g., 'On safety alone, is A>B?')?"  
  - *Sufficient answer*: "Yes," "No," or "Judgment revised" with new reason.  
  - *On failure*: Chair forces a revision.  
  - *Type*: Value  
  - *If any revision*: Return to S2.  

  **S5: Cycle Classification**  
  - *Question*: "Did all single-dimension tests (S4) *without revisions* confirm the original preferences?"  
    - *Yes*: Cycle is **value-induced** (proceed to S6a).  
    - *No*: Cycle is **aggregation-induced** (proceed to S6b).  
  - *Sufficient answer*: Classification with rationale.  
  - *On failure*: Chair decides based on S4 records.  
  - *Type*: Factual  

  **S6a: Value-Induced Resolution**  
  - *Question*: "Revise one pairwise judgment in the cycle or declare all schemes in the cycle tied. If tied, draft a public reason (e.g., 'Irreconcilable trade-offs')."  
  - *Sufficient answer*: Revised judgment or tie declaration.  
  - *On failure*: Chair imposes a tie.  
  - *Type*: Value  
  - *Then*: Return to S3.  

  **S6b: Aggregation-Induced Resolution**  
  - *Question*: "Revisit the cycle pairs. Apply consistent dimension weights (e.g., 'Safety now outweighs cost'). Revise judgments if needed."  
  - *Sufficient answer*: Revised judgments with new reasons.  
  - *On failure*: Chair sets weights.  
  - *Type*: Value  
  - *Then*: Return to S3.  

  **S7: Ranking & Phasing Test**  
  - *Question*: "Generate strict/partial ranking (ties grouped). For multi-phase schemes: Is the *final outcome* better than the status quo?"  
  - *Sufficient answer*: Ranked list and "yes/no" for phasing.  
  - *On failure*: Chair decides.  
  - *Type*: Value  

  **S8: Publish**  
  - *Output*:  
    - Strict ranking if no ties.  
    - Grouped ties if applicable (e.g., "Rank 5: Tied schemes A, B, C – Irreconcilable trade-offs").  
    - One-line reasons per scheme/tie group.  
    - Phasing rejections noted.  

