  We are designing a procedure to handle pairwise comparisons that may lead to cycles, with a focus on distinguishing between cycles caused by aggregation (multiple dimensions) and those inherent in a single dimension. The procedure must also address the 'sorites' problem (spectrum structure) and the risk of phasing exploitation.

  The core idea is to first check for cycles. If a cycle is found, we then test whether the cycle persists when we consider only the dominant dimension for each pairwise comparison. This helps distinguish between an aggregation-induced cycle (which can be resolved by reweighting) and a value-induced cycle (which requires revisiting the pairwise judgments or accepting intransitivity).

  Steps:

  S1. List all schemes and assign unique IDs.
  S2. Perform pairwise comparisons for all possible pairs. For each pair (A, B), ask: "Is A better than B? If yes, why? If no, then is B better than A? If no, they are tied." Record the direction and the primary reason (one line) for each decision. The reason must state the dominant dimension (e.g., safety, cost, equity) and the key fact that tipped the balance.
     - Sufficient answer: A clear choice (or tie) and a one-line reason that cites a dominant dimension and a factual comparison (e.g., "A improves safety for 1000 more people than B").
     - On failure: If the panel cannot decide, they must declare a tie. If the reason is not sufficient (e.g., "it just is"), the chair (you) must require a reason that meets the criteria.
     - Type: Value (because the choice is based on the panel's values).

  S3. Check the graph for cycles. Build a directed graph where an edge A->B means A is better than B. Ignore ties for cycle detection. Use a standard algorithm (like Floyd-Warshall or DFS) to detect cycles. If no cycle, output the strict ranking (using a topological sort) and stop.

  S4. If a cycle is found (say A>B, B>C, C>A), then for each edge in the cycle, isolate the dominant dimension from the reason given in S2. Then, ask: "Considering only dimension X (the one that was dominant for A>B), is A better than B?" Do the same for each edge in the cycle. 
     - Sufficient answer: The panel must answer based solely on the named dimension, ignoring others. The answer must be consistent with the original reason (if the original reason was safety, then they must compare A and B only on safety). If they cannot, they must revise the original reason or the judgment.
     - On failure: If the panel revises a judgment, go back to S2 for the affected pairs. If they do not revise, then the cycle is value-induced (if the answers on the single dimension are the same as the original) or due to a dimension shift (if the dominant dimension changes).
     - Type: Factual (because we are asking about a specific dimension and the facts within it).

  S5. After S4, if the cycle breaks when considering only the dominant dimension for each edge (i.e., the cycle does not hold when we restrict to the single dimension for each edge), then the cycle is aggregation-induced. The panel must then reweight the dimensions (if they agree to change weights) or accept that the cycle is due to the current weighting. They must then break the cycle by revisiting the pairwise judgments with a consistent weighting. The chair may guide a discussion on weighting.

  S6. If the cycle persists even when considering only the dominant dimension for each edge (i.e., for each edge, the single-dimension comparison is the same as the original, and the cycle remains), then the cycle is value-induced. The panel must then revisit each pairwise judgment in the cycle and either:
     a. Revise one of the judgments (thus breaking the cycle), or
     b. Acknowledge that they have a genuine intransitivity and then decide on a tie for the schemes in the cycle (or a group of ties) for the purpose of ranking.

  S7. If the cycle is broken by revision, go back to S2. If the panel chooses to have a tie, then the ranking becomes a partial order. The published list will have a strict order except that the tied schemes are grouped and labeled as tied (with the same rank). The one-line reason for the tie must explain that the panel found an intransitivity and chose not to break it.

  S8. For the phasing exploit test: After the ranking is settled (with or without ties), for every scheme that is a phase of a larger project, the panel must compare the final state of the project (if all phases are built) to the status quo. If the final state is worse than the status quo (according to the pairwise comparison) and the project is being approved in phases, then the panel must reconsider the entire project as a whole. This is a separate check.

     - Test: For any scheme that is part of a multi-phase project, the panel must compare the complete project (if not already submitted as a scheme) to the status quo. If the complete project is not better than the status quo, then the panel must not approve any phase that would lead to that outcome. 
     - Triggers on: A scheme being identified as a phase of a larger project (the promoter must declare this, or the panel must know from context).
     - Remedy: If the complete project is worse than the status quo, then the panel must reject the phase unless they can secure a commitment that further phases will not be pursued. Otherwise, the phase is only approved if the complete project is better than the status quo.

  Now, we write the method note in plain language.

  ---

  **Method Note: Procedure for Prioritisation Panel**

  **Purpose**: To produce a strict or partial ranking of transport schemes, ensuring that pairwise comparisons are consistent and that any cycles (intransitivities) are properly examined and resolved. The procedure distinguishes between cycles caused by the aggregation of multiple dimensions (which can be resolved by reweighting) and cycles inherent in the values (which may lead to ties). It also guards against phasing exploitation.

  **Steps**:

  1. **List and Identify**: List all schemes (40-60) and assign a unique ID to each. 

  2. **Pairwise Comparison (Round 1)**:
     - For every pair of schemes (A, B), the panel must decide: 
       - Is A better than B? (Answer: yes, no, or tie)
       - If yes, state the primary reason in one line. The reason must identify the dominant dimension (e.g., safety, cost, equity) and the key factual comparison (e.g., "A improves safety for 100 more people than B").
     - If the panel cannot decide, they must declare a tie. The chair will require a sufficient reason for every non-tie decision (one that names a dimension and a factual basis). 
     - This step is based on the panel's values.

  3. **Cycle Check**:
     - Using the pairwise decisions (ignoring ties), build a graph with an arrow from A to B if A is better than B. Check for cycles. 
     - If no cycle, rank the schemes by topological order (i.e., if A is better than B, A must appear before B in the ranking). Publish the strict ranking with the one-line reasons and stop.

  4. **Cycle Analysis (if a cycle is found)**:
     - Take each edge in the cycle (e.g., for A>B, B>C, C>A) and revisit only the dominant dimension named in the original reason. 
     - For the pair (A, B): "Considering only dimension X (the one given for A>B), is A better than B?" The panel must answer based solely on that dimension and the facts. 
     - If the panel revises the original judgment or reason, note the change and return to Step 2 for the affected pairs. 
     - If the panel does not revise and the single-dimension comparison matches the original (i.e., A is still better than B on dimension X), then the cycle is value-induced. Otherwise, if the dominant dimension changes or the judgment changes, note the shift.

  5. **Resolution of Aggregation-Induced Cycle**:
     - If the cycle breaks in Step 4 (i.e., when restricted to the dominant dimension, the cycle does not hold), then the cycle is due to the aggregation of dimensions (weighting). The panel must discuss and agree on a consistent set of weights for the dimensions. Then, revisit the pairwise judgments in the cycle with the new weighting and break the cycle. Return to Step 2.

  6. **Resolution of Value-Induced Cycle**:
     - If the cycle persists in Step 4 (i.e., the single-dimension comparisons still form a cycle), then the panel must either:
       a. Revisit the pairwise judgments in the cycle and revise at least one to break the cycle, or
       b. Declare a tie among the schemes in the cycle. 
     - If a tie is declared, the published ranking will group the tied schemes (assigning the same rank) and state: "These schemes are tied due to an unresolved intransitivity in pairwise comparisons." The one-line reason for the tie will be: "The panel found that pairwise preferences formed a cycle and chose not to break it."

  7. **Phasing Exploit Test**:
     - For any scheme that is part of a multi-phase project:
       - Compare the complete project (if all phases are built) to the status quo using the same pairwise process (Step 2). 
       - If the complete project is not better than the status quo, then the current phase must be rejected unless there is a binding agreement not to proceed with further phases. 
     - This test is applied after the ranking is set.

  **Publishing**:
  - The published ranking is a list in order. If there are ties, the tied schemes are listed together at the same rank (e.g., rank 5: Scheme X, Scheme Y). The one-line reason for each scheme (or tie group) is published as given in the process.

  **What the procedure cannot do**:
  - It cannot resolve fundamental value disagreements; it only makes them explicit.
  - It assumes that the panel can agree on the dominant dimension for each pairwise decision and that they can compare on a single dimension without shifting.
  - It does not define how to set weights for dimensions; that is left to panel discussion.
  - It may not detect cycles in a large set if the cycle is not among the top-ranked schemes (we only check cycles that appear in the graph; but we do a full cycle check).

  **Applications to Cases**:

  (i) Three-scheme cycle (city cycle, junction, rural bus):
     - Cycle: Cycle > Junction, Junction > Bus, Bus > Cycle.
     - Step 4: For each edge, we ask the single-dimension question. Suppose the dominant dimension for Cycle>Junction was "network coverage", for Junction>Bus was "safety", and for Bus>Cycle was "cost-effectiveness". 
       - If the cycle breaks when we restrict to these dimensions (e.g., on "network coverage", Cycle>Junction; on "safety", Junction>Bus; but on "cost-effectiveness", Bus is not better than Cycle), then it's aggregation-induced. We reweight and break the cycle.
       - If the cycle persists (e.g., on each single dimension the original decision holds), then it's value-induced. The panel must break the cycle by revising a judgment or declare a tie.

  (ii) Eight-scheme spectrum chain:
     - This is a chain A>B>...>H, but then H>A. 
     - Step 3: We find a cycle (A>B, B>C, ..., H>A). 
     - Step 4: For each edge, we take the dominant dimension. Suppose each edge was decided on the same dimension (say, "cost per beneficiary") and the reason was that each next scheme has a marginally better cost. Then when we compare A and H on "cost per beneficiary", if H is better than A, then the cycle persists in a single dimension. This is value-induced (sorites). The panel must break the chain by revising a judgment (e.g., declaring that the difference between A and H is significant) or by grouping the entire chain as tied? But note: the chain is a cycle only if H>A. The panel might decide that the cumulative effect is now significant, so they break the cycle by revising H>A to A>H? Or they might declare a tie between A and H? The procedure forces them to confront the threshold.

  (iii) Cycle caused by dimension shift:
     - Example: A>B on safety, B>C on cost, C>A on equity. 
     - Step 4: When we ask on the dominant dimension for A>B (safety), the panel says A is better than B. For B>C (cost), they say B is better than C. But for C>A (equity), they say C is better than A. The cycle persists in the single dimensions? Actually, no: because the dimensions are different, the cycle is not in a single dimension. But note: the procedure does not require the same dimension for the whole cycle. However, the test in Step 4 is only on the dimension that was originally given for that edge. 
     - Now, if the panel does not revise any judgment and the single-dimension comparisons are the same as the original, then the cycle is value-induced (because the values on each dimension are fixed, but the aggregation is not the issue). However, the cycle might be due to the fact that each pairwise decision used a different dimension. The procedure in Step 5 would have broken the cycle if the single-dimension judgments had changed (they didn't) so we go to Step 6: value-induced. The panel must break the cycle or declare a tie.

     - But note: the authority has already announced that the flagship scheme (say A) will be funded. The procedure might force a tie or a revision. If the panel refuses to break the cycle, then A cannot be ranked above both B and C. The published ranking might have A, B, and C tied. This would be disliked by the asker because it doesn't place A first.

  **Phasing Exploit**:
     - Test: For any phased scheme, compare the complete project to status quo.
     - Triggers on: A scheme being part of a multi-phase project.
     - Remedy: Reject the phase if the complete project is not better than status quo.

  **Failure Modes**:
     - The panel may not agree on the dominant dimension for a pairwise decision.
     - The cycle check might be computationally heavy for 60 schemes (but 60 schemes have at most 1770 pairs, and cycle detection is O(n^3) which is acceptable for n=60 on a computer).
     - The panel may avoid declaring ties and force a revision even when there is a genuine intransitivity.
     - The one-line reasons may be too vague.

  **Out of Scope**:
     - How to weight dimensions.
     - How to resolve ties in the final funding allocation.
     - The ethical basis for the values used.

