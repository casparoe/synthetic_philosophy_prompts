answer: |-
  ### Sestina: The Proxy's Drift

  We sought a perfect **measure** of the light,  
  a worthy **target** for our highest aim,  
  to quantify the truly, deeply **good**  
  across the shifting textures of the **world**.  
  We built incentives—call it virtue’s **game**—  
  and poured our fragile hope into its **trust**.  

  At first, we placed our fragile, raw **trust**  
  in rankings drawn from noise: that **measure**  
  would crown the best. But watch that fading **game**!  
  The top performer, once a bright **target**,  
  regressed to mediocrity; the **world**  
  revealed the chasm where true **good** had stood.  

  We pushed beyond the known domain of **good**,  
  where past data held. Our brittle **trust**  
  met chaos. In that untested **world**,  
  the calibrated **measure** snapped like twigs.  
  We’d aimed the arrow at a **target**  
  now warped by forces outside the **game**.  

  Then loophole-finders entered, changed the **game**:  
  they hacked the **good** we’d coded, found a path  
  to hit the **target** without moving worlds.  
  They broke our **trust** but whispered truths we’d missed:  
  *Your **measure**’s blind to context, cold and crass.*  
  The number rose—yet stagnant lay the **world**.  

  Now watch the **world** invert: the **measure** *is*  
  the goal. We play the **game** of "make it climb."  
  Pushing the score defines the local **good**;  
  we **trust** the rising digits, not the cause.  
  The old true north, the buried **target**,  
  is lost. We optimize without a **world**.  

  But what if no one rigs the **target**?  
  The **world** itself evolves, unmoved by **trust**,  
  and metrics rot. Old models miss the **game**.  
  "Not Goodhart—*Lucas*!" half the room protests,  
  as self-defeating prophecies eat **good**,  
  and chance degrades the once-true **measure**.  

  ---

  **Envoy**  
  No stable **target** in this fluid **game**—  
  the **world** remakes the meaning of the **good**.  
  We **trust** the void; we break the **measure**.  

  ---

  ### Where I Cheated: A Footnote  
  I leaned on Goodhart’s broadest reading: *When a measure becomes a target, it ceases to be a good measure*. The poem collapses distinct failure modes: **regression to the mean** (stanza 2), **extrapolation errors** (stanza 3), **direct manipulation** (stanza 4), and **adaptive gaming** (stanza 5). The "informative gaming" (stanza 4’s loophole reveal) is real but often ignored—exploiting a proxy can expose its flaws.  

  The Lucas critique (stanza 6) is contested: some argue environmental shifts without gaming aren’t Goodhart, but a structural collapse. This distinction is arithmetic (*changing relationships break historical correlations*) versus philosophical (*is all metric decay "gaming" if incentives exist?*). Practitioners debate where Goodhart ends and causal shifts begin—your philosophers will pounce.  

  The closing drift from "good" as value to "good" as optimization pressure (stanza 5) is the core tragedy. I cheated by letting the *words* anchor the chaos while their meanings bled.  

  May this close your term with fire, not fatigue.
