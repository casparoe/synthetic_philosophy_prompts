  Now, analyzing where the argument goes wrong. Step 5 assumes that adding more people with the same total welfare is valid without considering their neutrality. But each added person has welfare W/n, which could be below neutral if n is large. Since f(0)=0 and f is concave, if W/n < 0, f(W/n) is negative. So when n increases beyond W crossing zero, the value becomes negative, not better. Therefore, step 5 only holds when W/n ≥ 0. Once welfare per person dips below neutral, adding more people decreases total value. The mistake is ignoring the neutral point. Prioritarianism avoids levelling-down in the relevant cases because harming individuals (reducing their welfare) always decreases total value. Adding people below neutrality isn't beneficial. Thus, step 5's claim of "no stopping point" is false; there is a stopping point at W/n=0.

