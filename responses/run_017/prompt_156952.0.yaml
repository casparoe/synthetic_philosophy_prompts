  **Interpreting the Results**

  - **Feature-list**: You believe that there are defining visual features that make a letter what it is.
  - **Prototype**: You believe that we recognize letters by comparing them to a typical example in our mind, and there is graded membership.
  - **Exemplar**: You believe that we recognize letters by comparing them to specific examples we have stored.
  - **Family-resemblance**: You believe that there is no strict definition; we extend the category based on overlapping similarities and context.
  - **Role/relational**: You believe that a letter is defined by its role in the writing system (alphabet, words) and its contrasts with other letters.
  - **Skill**: You believe that letter recognition is a perceptual skill that cannot be fully captured by rules or features.
  - **Historical**: You believe that the historical chain of descent is what makes a letter what it is.
  - **Conventionalist**: You believe that letters are defined by social agreement and convention at a given time.
  - **Abstract-role**: You believe that there are abstract, style-invariant roles or relations that define a letter (this might be a subset of role/relational).

