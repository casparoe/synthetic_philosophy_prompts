    B) It resembles the typical way children (or adults) write 'a' when they are learning.
    C) In the context of the child's writing, it is used as an 'a', and that's what they intended.

  Question 4: In the Fraktur (blackletter) style, the letter 'a' looks quite different from the Roman 'a'. For example, it might look like a 'u' with a small hook on the right side. Why is this considered an 'a'?
    A) Despite the style, it has the same fundamental visual elements as a Roman 'a'.
    B) It occupies the same position in the alphabet and is used in the same way in words.
    C) It is historically derived from the same letter form as the Roman 'a'.

  Question 5: The Cyrillic letter 'а' (which looks identical to the Roman 'a') represents the sound /a/, just like the Roman 'a'. Is this Cyrillic letter the same letter as the Roman 'a'?
    A) Yes, because it looks the same and sounds the same.
    B) No, because it is part of a different writing system (Cyrillic) and thus a different letter.
    C) It is a different letter that coincidentally looks the same and represents the same sound.

  Question 6: In an invented alphabet, the glyph that represents the sound /a/ (as in "father") is shaped exactly like the Roman letter 'q'. In a word written in this alphabet, what letter is this glyph?
    A) It is an 'a' because it represents the sound /a/.
    B) It is a 'q' because that's what it looks like.
