  **The Quiz**

  Question 1: Consider two ways of writing the letter 'a'. One is the double-storey form common in serif fonts (like in Times New Roman: it has a bowl and a separate upper counter). The other is the single-storey form common in sans-serif fonts (like in Helvetica: it's a simple oval with a curve on the right). They look very different. What makes both of them the letter 'a'?
