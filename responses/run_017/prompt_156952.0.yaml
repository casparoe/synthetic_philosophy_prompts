    B) They play the same role in the alphabet and in forming words.
    C) They are both conventionally accepted and used as 'a' in writing systems.

  Question 2: Imagine a glyph that is an intermediate form between 'a' and 'o' — it's round but has a small opening on the right. When it appears in the word "c_t" (with a 'c' and a 't'), if the middle letter is this glyph, you read it as "cat" (so it's an 'a'). But when it appears in the word "c_t" with the same surrounding letters, if the word is meant to be "cot", you read it as an 'o'. What determines whether this glyph is an 'a' or an 'o'?
    A) The visual properties of the glyph itself: in the context of "cat", it looks more like an 'a', and in "cot", it looks more like an 'o'.
    B) The surrounding letters and the word it is part of: the system of the word tells us which letter it must be.
    C) The glyph is inherently ambiguous, and we interpret it as whichever letter makes the word make sense.

  Question 3: A six-year-old child writes an 'a' that is very messy: it might be a circle with a stick coming out of it, and it's wobbly. You can still tell they meant it to be an 'a'. What makes it an 'a'?
