answer: |-
  ## MEMORANDUM

  **TO:** Eastvale Housing Review Board Members  
  **FROM:** [Your Name/Position], Member, Eastvale Housing Review Board  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Petition for 24-Month Anti-Displacement Overlay in East Ward  

  **I. RECOMMENDATION**  
  The Board recommends **APPROVAL of the East Ward Tenant Assembly’s petition** for a 24-month Anti-Displacement Overlay Zone (AD-OZ) in the East Ward, **with the following conditions**:  

  1.  **Term:** The overlay shall be in effect for **twenty-four (24) months** from the date of adoption by the City Council.  
  2.  **Net-Additive Requirement:** "Net-additive" is defined as requiring:  
      *   **No net loss of existing occupied dwelling units** on the project lot.  
      *   **One-for-one replacement** of any existing occupied dwelling unit demolished, *at the same affordability level* as occupied by the displaced tenant(s) at the time of application (e.g., if a unit was rented at 60% AMI, its replacement must be restricted to 60% AMI).  
      *   **Relocation Assistance:** Provision of relocation assistance per the City’s existing ordinance (Section [X]) or, if none exists, per a standard formula (e.g., 3 months’ fair market rent + moving costs) administered by Planning staff.  
  3.  **Affordability Mechanism:** Affordability restrictions for replacement units shall be secured via a **recorded covenant** acceptable to the City Attorney, ensuring duration aligns with the expected lifespan of the building (minimum 30 years).  
  4.  **Administration:** Planning staff shall develop and publish clear administrative guidelines for demonstrating compliance with net-additive requirements and affordability covenants within 30 days of overlay adoption.  

  **II. CONTEXT AND THE PETITION**  
  Six months ago, the City adopted "middle housing by right," permitting three- and four-unit buildings on any residential lot without discretionary review. While intended to increase housing supply and affordability citywide, the implementation has been geographically uneven: approximately two-thirds of applications are concentrated in the East Ward. This ward is characterized by the city’s lowest rents, a history of disinvestment, a high concentration of unsubsidized low-rent apartments in older buildings, and relatively cheap land. Most applications propose demolition of existing occupied housing.  

  The East Ward Tenant Assembly (comprising primarily low-income renters) petitions for a 24-month Anti-Displacement Overlay. This overlay would allow by-right projects *only* if they meet the "net-additive" standard outlined above. Staff analysis estimates this would reduce new unit production in the East Ward by roughly one-third over the period, with minimal diversion to other wards. Staff also notes preliminary evidence that the by-right reform is beginning to moderate citywide rent growth.  

  **III. CONFLICTING CLAIMS AND THE BOARD’S CHARGE**  
  Our enabling ordinance compels us to weigh the housing needs of two distinct groups:  

  1.  **Claim of Existing Residents (Incumbents):** Primarily represented by the Tenant Assembly, this claim asserts a right to *remain* in place and maintain community stability. It emphasizes protection from involuntary displacement due to demolition and economic pressure, particularly for vulnerable, low-income renters with limited alternatives. The petitioners argue that the current policy concentrates the disruptive costs of citywide housing goals (demolition, displacement risk, community disruption) almost entirely on their ward, while they benefit least from new development they cannot afford.  
  2.  **Claim of Future Residents (Potential Newcomers):** This claim asserts a right to *access* housing within the city, particularly more affordable housing enabled by increased supply. These individuals are not present to testify. The argument, supported by economic theory and staff’s note on moderating rents, is that restricting supply, especially in the lowest-cost area, impedes overall affordability gains, burdens newcomers seeking entry, and may slow the positive citywide rent trend.  

  **IV. WEIGHTING THE CLAIMS: WHY APPROVAL WITH CONDITIONS IS WARRANTED**  
  The Board fully acknowledges the citywide imperative to increase housing supply. However, the live question is the *distribution of costs and benefits*, especially when policy implementation demonstrably concentrates burdens on the least resilient community.  

  *   **Disproportionate Burden:** The East Ward is absorbing the vast majority of demolition-driven displacement pressure under the new policy. Meanwhile, two high-cost, high-opportunity wards successfully exempted themselves, avoiding these localized costs entirely while likely benefiting from any citywide rent moderation. This geographic inequity is stark and undermines the policy's fairness.  
  *   **Lack of Voice and Agency:** The East Ward residents, despite bearing the brunt, had no similar opportunity to "opt-out." Their organized petition represents the *only* ward-level response attempting to shape the policy's local impact. Ignoring this plea from the most affected community, which lacks the political capital of wealthier wards, would be profoundly inequitable.  
  *   **Temporary Protection Enables Better Policy:** A 24-month pause on net loss of low-rent units in the East Ward is not a rejection of growth but an adjustment for equity. It provides immediate protection for vulnerable residents while allowing the city time to:  
      *   Analyze the full impact of the by-right policy and develop targeted anti-displacement measures citywide.  
      *   Implement strategies to incentivize development in higher-opportunity areas (e.g., removing de facto barriers, exploring incentives).  
      *   Develop a permanent solution integrating growth with robust anti-displacement protections, informed by the East Ward experience.  
  *   **Balancing Supply and Stability:** The "net-additive" condition directly addresses the core displacement driver (demolition of occupied units) while *still allowing significant new development*. Projects can proceed by adding units on underutilized lots, building new units alongside preserved ones, or replacing units only with guaranteed affordability. This prioritizes stability for current vulnerable residents *within* the framework of adding supply.  
  *   **Staff Administerability:** The defined terms (net-additive, affordability level based on current tenant income, recorded covenant, clear relocation standards) are specific, objective, and within staff’s existing capacity to administer.  

  **V. STRONGEST ARGUMENT AGAINST THIS RECOMMENDATION**  
  The most compelling case against this overlay is that it sacrifices concrete, immediate opportunities to alleviate the city's housing shortage for a vulnerable group that is entirely absent: future lower-income residents who need housing *now*. By reducing the rate of new unit creation specifically in the ward with the cheapest land and therefore the greatest potential for naturally occurring affordable housing (NOAH), the overlay directly impedes the primary mechanism (increased supply) by which the by-right reform aims to moderate rents citywide. Staff observes this moderation is already beginning; slowing it in the most effective sub-market could prolong higher rents for *all* lower-income renters citywide, including those struggling in other wards. The displacement fears in the East Ward, while real, affect a quantifiable number of current households. The overlay’s reduction in potential new units harms an unquantifiable but likely larger number of unseen future households seeking entry, perpetuating the shortage. Further, accepting this geographic constraint sets a precedent where communities can resist needed density, potentially undermining the citywide housing goals the Board endorses. The argument concludes that the greater moral imperative is to prioritize the needs of the many unseen future residents over the localized disruption of the few current residents, especially when the policy *is* showing signs of working at the macro level.  

  **VI. CONCLUSION**  
  The East Ward Tenant Assembly petition highlights a critical failure in the equitable implementation of the city’s otherwise necessary middle housing policy. The concentration of disruptive costs on the city’s most vulnerable community, coupled with the exemption of affluent wards, creates an unjust burden. Approving this 24-month Anti-Displacement Overlay with tightly defined conditions provides essential, immediate protection for low-income East Ward renters facing displacement, ensures no net loss of existing low-rent units during this period, and still allows significant new housing development. It creates necessary breathing room for the city to develop more equitable, permanent solutions that distribute the responsibilities and benefits of growth more fairly across *all* wards. While mindful of the potential impact on future supply and newcomers, the Board believes the imperative to protect vulnerable incumbent residents from bearing disproportionate costs in this specific, acute situation outweighs that concern for this limited duration. We urge the Board to adopt this recommendation.
