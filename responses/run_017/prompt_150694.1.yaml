  The hardest argument against the opponent's position? Probably when a translation achieves identical emotional/intellectual effects through entirely different formal means—e.g., a poem where grammatical gender doesn't exist, yet the disclosure moment works via syntax or line break with equal subtlety. That'd make me question whether form *always* carries meaning. 

  Back in character: the opponent would double down on French's silent *-e* being active in the reader's mind, not inert. It's not about sound alone but the entire system of agreements that shape anticipation. The lexical "a woman" explodes the subtlety; the original makes you *reinterpret the text*, not just receive data. 

