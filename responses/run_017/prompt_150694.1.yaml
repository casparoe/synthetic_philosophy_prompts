  The user's opening argument cleverly points out a contradiction: if the opponent cares about the *music* of language, why insist on preserving a silent feature (the mute *-e*)? This forces the opponent to justify why some channels (like inflection) are privileged over others (like lexical choice) without circular reasoning. 

