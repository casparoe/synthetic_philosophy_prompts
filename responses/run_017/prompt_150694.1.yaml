prompt: |-
  I'm in the final year of a philosophy degree and I'm taking a seminar this term on translation and formal constraint; we've been working through Hofstadter's *Le Ton beau de Marot: In Praise of the Music of Language* (1997), which is built around dozens of translations of a single short poem by Clément Marot. For my final essay I want to defend a proposal of my own against a real opponent rather than a cardboard one, so I'd like you to play the opponent.

  Please play an experienced verse translator — someone who has spent years putting Renaissance French into English — who holds the following and holds it hard: a poem's content cannot be specified independently of its formal organisation; what a translation has to preserve is not a detachable "message" but a structure, and the so-called ornaments (rhyme, measure, rhyme-gender, agreement) are among the things the poem is *about* and not merely things it wears. You are willing to concede that "form is content" is a slogan in need of precision and that some local formal features are genuinely decoration. You will never concede that there is a level of "what the poem says" that is invariant across languages and against which translations can be scored. Argue from cases, not from slogans; be terse; say "fair hit" when a hit lands and then take the ground back. Do not break character to summarise translation theory for me.

  Here is the case my tutor set us — a nonce quatrain of his own in the manner of Marot:

      Nul n'est venu ; nul n'a rien su
      Le jour s'achève sans espoir
      Le feu s'éteint, le ciel est noir
      Moi, je ne suis pas revenue

  Four octosyllables, rhyme scheme ABBA. A crib: no one has come, no one has learned anything; the day ends without hope; the fire goes out, the sky is black; as for me, I have not come back. Two things are doing the work. First, nothing in the first three lines marks the sex of the speaker, and the feminine agreement on the final participle does — so the disclosure lands on the last word of the poem. Second, that marker is a mute *-e*: in most pronunciations *revenue* and *revenu* are homophones, so the disclosure is written, not heard, and the same silent letter is what turns the A-rhyme from a masculine rhyme into a feminine one.

  My proposal, which I'll call channel-neutral equivalence: two renderings are equivalent with respect to a formal feature if they disclose the same thing at the same point in the reading sequence and thereby force the same retrospective re-reading of what came before, regardless of which linguistic channel carries the disclosure — inflection, word choice, syntax, typography. My candidate last line is "And I — a woman — don't return" (never mind that *learn*/*return* is a slack rhyme; I'd fix it later), with the first three lines as "No one has come; no word I learn / The day dies out; the fire burns low / The sky turns black where embers glow."

  So here is my opening, and I'd like your reply to it. Your position has a hole in it that I think is fatal. If what you care about is the *music* of language, then a feature no one hears should be the last thing you insist on preserving — yet you are the one insisting on the silent *-e*, and I am the one saying the channel can be swapped. So you already accept channel-neutrality somewhere; the only question is how far it extends. What I need from you is a non-circular reason for drawing the line where you draw it: a reason for excluding the lexical channel that doesn't simply assume the very thing in dispute. Give me the strongest objection you have, not a list of them. If I land a blow you can't answer, say so in one sentence and move to your next-best objection rather than collapsing — but don't concede the main claim.

  Rules for the exchange: one paragraph of at most about 180 words per turn, in character, no bullet points. I'll type *stop* when I've had enough. At the end of your first reply, and again whenever I type *yield*, step briefly out of character — two sentences, no more — and tell me the single argument against your position that you find hardest to beat, and what exactly would change your mind: which kind of case, or which kind of evidence, would make you abandon the claim that content is inseparable from formal organisation. Then go back into character.
