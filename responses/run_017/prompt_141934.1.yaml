  The Principal Principle was developed by David Lewis and deals with how rational agents should set their credences when they have information about objective chances. The user seems well-versed in the philosophical literature on this topic, having read Lewis and subsequent developments. Their cases explore boundary issues like laundering, uncertainty about chance setups, and second-order probabilities.

