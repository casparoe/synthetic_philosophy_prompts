  The user has tentatively proposed a principle: defer unless evidence is about the outcome or gives reason to doubt the chance. But they note case 6 breaks this - they hedge without specific doubts. This suggests we need a principle incorporating reliability weighting or epistemic safety margins.

  I think a modified principle would work best: Defer to the reported chance for the specific event, but discount based on estimated reliability of the chance-reporting mechanism, with a baseline skepticism for theoretical claims. This handles case 6 naturally as discounting the physics model's reliability. It also explains why they ignore laundered "chances" (case 4) - because the mechanism isn't reporting the relevant chance.

  For the predictions section: For the rain case, the principle would suggest deferring to today's 0.5 chance since tomorrow's resolved chance isn't current evidence. For the next-flip device, it's irrelevant to the current flip. For conflicting evidence, it would weight the reported chance against one's own assessment based on reliability estimates.

  The main intuition that needs adjustment is case 7 - second-order chances should arguably be deferred to just like first-order chances, rather than treated as simple averages. The user might need to accept that their 0.66 is actually a form of deference to the second-order chance structure.

  The user seems philosophically sophisticated, working through these cases carefully. They're likely developing their own position on chance deference, so I should provide clear reasoning while respecting their intuitions. The challenge is balancing technical precision with their "gut" reactions - sometimes philosophy requires revising initial intuitions when they conflict with consistent principles.
answer: |-
  Here's a principle handling your cases, followed by analysis, predictions, and required adjustments.

  ### The Principle
  **Reliability-Weighted Chance Deference (RWCD):** Defer to the *reported objective chance* of event E *if and only if* the reporting mechanism is both **relevant** (the chance reported is genuinely for E, under the correct setup) and **reliable** (you have no overriding evidence suggesting the report is inaccurate for E). When deference applies, your credence in E should equal the reported chance. When it doesn't, your credence should reflect your best estimate of E's probability based on *all* evidence, which may include the reported chance as *one* indicator weighted by your confidence in the report's reliability and relevance. Crucially, reported chances are inherently discounted by your credence in the *reliability of the entire chance-reporting framework/mechanism* (including setup correctness), introducing a baseline skepticism for theoretical or complex claims.

  ### Case by Case
  1.  **Matches (0.5):** The report ("fair coin") is maximally relevant & reliable. Full deference.
  2.  **Matches (~0.99):** The report (device output) is *not* about the objective chance; it directly predicts the outcome. It's highly reliable evidence *about E itself*, not about chanciness. RWCD doesn't trigger deference to chance; you update on the outcome-predicting evidence.
  3.  **Matches (0.83):** The device reliably reports the *relevant* objective chance (for *this* flip). Meets RWCD criteria. Full deference.
  4.  **Matches (~0.99):** The report (0.83) is an objective chance, but **not relevant** to E (it's for a *different*, rigged process). It's also evidence *about the outcome* (via the laundering). RWCD deference doesn't apply; you treat it like case 2, as strong outcome evidence.
  5.  **Matches (0.8):** You have strong evidence (future frequency) directly conflicting with the "chance=0.5" report regarding the *same type of event* under the *same setup*. This undermines the **reliability** of the "chance=0.5" report for this coin/system. RWCD deference fails; you prioritize the stronger frequency evidence.
  6.  **Matches (~0.99 Cap):** The report (physics/theory) claims high chance. RWCD requires deference *if* reliable. However, your baseline skepticism about understanding complex setups/physics models means your **credence in the reliability/relevance of the reporting mechanism (theory + application)** is high but not 1.0 (~0.99). You defer to the *reported chance discounted by your trust in the framework*: Cr(E) = Cr(Report Reliable) * Reported_Chance + Cr(Report Unreliable) * Other_Estimate ≈ 0.99 * 0.999999 + 0.01 * [some lower estimate] ≈ 0.99.
  7.  **Partially Matches, Override Needed (Should be 0.66 via deference):** The report *is* the relevant objective chance information: a second-order chance distribution. RWCD dictates deference to *this* chance information. Your 0.66 *is* the correct result of deferring to the second-order chance (via the expectation: 0.6\*0.5 + 0.4\*0.9 = 0.66). Your feeling of "just averaging" *is* deference to the higher-order chance structure. The principle saves your verdict but overrides your feeling that it's not deference.

  ### Predictions
  1.  **Today's Rain Chance 0.5, Tomorrow's Resolved 0.99:** RWCD dictates deference to *today's* relevant chance report (0.5). Knowledge of tomorrow's future certainty/updated chance is evidence *about the outcome*, but not the *current objective chance*. Your credence *now* should be 0.5.
  2.  **Device Measures Next Flip's Chance (Betting on This Flip):** The device reports the *objective chance for the next flip*, not *this flip*. Its report is **irrelevant** to E (this flip) under RWCD. You cannot defer. The report might be *evidence* about the coin's bias/current state, influencing your credence for *this* flip, but only weighted by your assessment of that link's reliability.
  3.  **All Evidence Suggests 0.7, Reported Chance 0.5:** Conflict arises. RWCD deference applies *only if* you judge the chance-reporting mechanism as more reliable than your own assessment of the raw evidence for *determining the objective chance*. If you trust your own reasoning and evidence aggregation *more* than the external report, your credence should be 0.7. If you trust the report mechanism more, it should be 0.5. If unsure, weight them by your confidence in their respective reliabilities.

  ### What Has to Go
  Your verdicts are largely salvageable under RWCD. The main adjustment is **conceptual** for Case 7: Your feeling that calculating 0.66 isn't deference *must go*. RWCD argues this *is* deference to the second-order chance structure. Your "just averaging" *is* the mandated response to that specific type of chance information. You need to accept that deference to chance can involve complex structures, not just single numbers. Case 6 is *saved* as deference, but inherently discounted by your meta-credence in the reporting framework's reliability – this skepticism is built into the principle.
