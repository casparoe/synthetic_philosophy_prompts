  ### **Pivotal Node**  
  - **Q1** is the critical separator: It isolates epistemicism (and contextualism) from all rivals by testing adherence to **classical truth values and bivalence**. If *either* speaker in the disagreement must be wrong (Q1=Yes), the view preserves classical logic; if not (Q1=No), it revises logic or metaphysics.  

