  Below is a decision tree designed to sort positions on vagueness based on concrete cases. It uses only your specified scenarios (original chip series, machine-printed series with deleted log, statutory term with lost minutes, and speaker disagreement) and avoids theoretical jargon. Each question is phrased as a concrete case, and leaves are reached via binary choices. The tree first maps the logical space along three independent axes:  
  1. **Existence of a sharp boundary** (Is there a fact about the last red chip?).  
  2. **Survival of classical truth values** (Must one of two conflicting claims be false?).  
  3. **Sensitivity to stipulation** (Does a lost record eliminate the boundary?).  

  Unoccupied cells in the logical space are noted, and the pivotal node separating epistemicism from rivals is flagged.  

  ---

  ### **Decision Tree**  
  **Start with Q1:**  

  1. **Q1 (Original chips + Speaker disagreement):**  
     Alice and Bob examine the 10,000-chip series. They agree on all clear cases (e.g., chip 1 is red, chip 10,000 is orange) but disagree on a borderline chip (e.g., chip 5000). Alice says, “Chip 5000 is red”; Bob says, “Chip 5000 is not red.” Both are fully informed and in the same context. *Must one of them be saying something false?*  
     - **Yes** → Proceed to Q2.  
     - **No** → Proceed to Q3.  

  ---

  #### **Branch 1 (Q1 = Yes)**  
  2. **Q2 (Single speaker over time):**  
     A speaker examines a borderline chip and says, “This is red.” Later, with no changes to the chip or their knowledge, they say, “This is not red.” *Must one of these statements be false?*  
     - **Yes** → **Leaf 1: Epistemicism**  
       - *Most awkward commitment:* There is a sharp boundary in the original series, but humans are *in principle unable to know it* (even with perfect evidence).  
     - **No** → **Leaf 2: Contextualism**  
       - *Most awkward commitment:* The truth of “red” for a borderline chip *flips* based on conversational context alone (e.g., shifting standards), even if the chip is unchanged.  

  ---

  #### **Branch 2 (Q1 = No)**  
  3. **Q3 (Machine-printed chips with deleted log):**  
     The machine used a random number generator to set a sharp cut-off (e.g., “Chips 1–5473 are red”), recorded it in a log, and then deleted the log. No physical trace remains. *Is there still a specific chip that is the last red one?*  
     - **Yes** → Proceed to Q4.  
     - **No** → Proceed to Q5.  

  4. **Q4 (Statutory term with lost minutes):**  
     A committee sets a sharp boundary for a statutory term (e.g., “reasonably safe”) but loses the minutes. For a borderline case, *is there a fact of the matter about whether it qualifies?*  
     - **Yes** → **Leaf 3: Supervaluationism**  
       - *Most awkward commitment:* “Chip 5000 is red” is *neither true nor false* in the original series because no admissible precisification dominates (even though precisifications exist).  
     - **No** → **Leaf 4: Radical Indeterminacy**  
       - *Most awkward commitment:* Even in the machine/stipulation cases, *no fact exists* about the boundary once the record is lost (vagueness is irreducibly worldly).  

  5. **Q5 (Original chips + Adjacent comparison):**  
     Consider two adjacent chips in the borderline region (e.g., chip 5000 and 5001). *Can chip 5000 be red while chip 5001 is not, without violating the meanings of “red” or “orange”?*  
     - **Yes** → **Leaf 5: Paraconsistent View**  
       - *Most awkward commitment:* Borderline chips are *both red and not red* (true contradictions exist).  
     - **No** → **Leaf 6: Degree-Theoretic/Fuzzy View**  
       - *Most awkward commitment:* “Chip 5000 is red” has a *fractional truth value* (e.g., 0.5), making logical deductions (e.g., modus ponens) *probabilistic*.  

  ---

  ### **Logical Space & Unoccupied Cells**  
  The tree partitions views along three axes:  
  | **Axis**                          | **Values**                                                                 |
