answer: |-
  ### The Exit Planner: Frequently Asked Questions  

  **1. What exactly is The Exit Planner?**  
  The Exit Planner is a pocket-sized device designed to assist drivers facing ambiguous highway exits. By generating and managing a randomized exit strategy, it ensures optimal decision-making when visual cues fail. Simply set your preferences, press the button upon encountering an exit, and follow the directive.  

  **2. Why can’t I just flip a coin myself?**  
  Human memory is fallible. If you manually randomize, you risk forgetting whether you’ve already flipped at a prior exit. The Exit Planner automates this process: once activated, it locks further inputs until you pass both exits or reset the device post-trip. This prevents accidental re-randomization.  

  **3. What happens if I press the button twice?**  
  The device enforces a strict one-flip protocol. A second press triggers an error tone and displays "INVALID RESET." Outcome integrity is preserved, but you’ll need to pull over to fully reset the unit (hold the button for 5 seconds). We advise against double-pressing—it voids the Optimal Routing Guarantee (see question 10).  

  **4. How does "Credence Lock" work?**  
  Credence Lock™ (standard on all units) suspends exit-number estimations if they conflict with your pre-set strategy. For example: if your plan is "TAKE SECOND EXIT," the device temporarily disables mileage-based guesswork to prevent self-sabotage. This ensures you adhere to your original optimal plan.  

  **5. What’s the difference between Reveal Mode and Silent Mode?**  
  - **Reveal Mode:** The device displays "TAKE EXIT" or "SKIP EXIT" immediately after the flip.  
  - **Silent Mode:** Outcome is concealed; the device only vibrates once to confirm randomization. A small LED glows green post-second exit if you followed the plan.  
  Silent Mode is recommended for drivers prone to overthinking mid-route.  

  **6. What is Passenger Sync?**  
  Our $29/month **Passenger Sync** add-on pairs your device with a companion app. If a passenger opens navigation apps (e.g., Google Maps), your Exit Planner auto-locks to prevent route spoilers. Why? Real-time updates can degrade decision outcomes by 37%. Free trials include a warning sticker: "NAVIGATION AHEAD MAY IMPAIR ARRIVAL EFFICIENCY."  

  **7. Explain the "Motel Assurance" premium tier.**  
  **Motel Assurance** ($99/year) covers you in "failure states." If you follow the device’s directive but land at the motel (payoff 1), you receive:  
  - One free roadside coffee coupon.  
  - A firmware audit to confirm no glitches occurred.  
  - A supplemental "Route Obscurity Module" (ROM) that dims exit signage slightly, reducing impulsive deviations.  

  **8. I used The Exit Planner exactly as instructed and wound up at the motel. Your product is defective!**  
  Per our troubleshooting guide: Motel outcomes are expected in 25% of trips under the recommended strategy (pre-set randomization). The device performed correctly. For context, motel results without any strategy occur 100% of the time. We suggest enabling Credence Lock™ to avoid mid-route belief shifts.  

  **9. Can I use The Exit Planner for non-highway decisions?**  
  Technically, yes (e.g., choosing between identical coffee shops). But our warranty only covers highway exits. Non-highway use may overwork the randomizer chip, causing a "STATEFUL DECAY" alert. For daily randomization, we recommend our sister product: The Brunch Decider™.  

  **10. What’s covered under the Optimal Routing Guarantee?**  
  If you follow all device directives and achieve fewer than 3 home arrivals (payoff 4) per 10 trips, we’ll replace your unit. Exclusions: double-pressing, low batteries, or exposure to passenger navigation apps without Passenger Sync.  

  ---  
  *The Exit Planner v3.1 • Batteries included • Made for uncertain roads*
