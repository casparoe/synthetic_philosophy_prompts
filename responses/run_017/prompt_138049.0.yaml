  My friend and I have been arguing for about a year about whether guilt or shame is the better moral emotion (I'm team guilt, she's team shame) and we want to finally write something we could both sign instead of going in circles. Can you draft the joint statement for us?

  Start with a numbered list of the claims we can both agree on, then give a table of where we still disagree, where each row says her position the way she'd definately phrase it and mine the way I'd phrase it. For the cruxes: I think one is whether shame really needs an audience, and I want you to split that using a distinction I made up — "witness-collapse shame", the kind you'd still feel in full even if no person and no camera could ever find out, versus shame that does fade when nobody's watching — because right now I think we're just meaning different things by the word. The other crux is whether a culture can actually choose which one it leans on: put it as whether the feelings have to change first or the institutions do, like whether a group can switch from dealing with screw-ups by status-and-exclusion to rule-and-repair and have the emotions follow along, or whether it has to go the other way round. For each crux give one concrete case or observation we'd both accept as counting for or against it, plus what each of us would predict about that case. Also tell us straight up if any of the arguement is only about words. Don't bring in any studies or books by name, we can't look anything up. Whole thing under 500 words please, and keep it plain, we're 17.
