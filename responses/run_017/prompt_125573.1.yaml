prompt: |-
  Hi — I'm doing an MA module on the philosophy of action and I've dug myself into a hole with a paper that's due Thursday, and my supervisor is away until then. I've been arguing about it with a friend (she works on semantics, which is maybe why she keeps going on about embedded questions) and I now can't tell whether I've refuted the propositional view of knowledge-how or whether I've refuted pretty much everything.

  Here's how I wrote the argument up.

  (1) If S knows how to φ, then S is able to φ: being able to do the thing is part of what the knowing consists in, not just a lucky fact about your body. Call this the grip condition.
  (2) Propositional knowledge never has an ability for a condition. For any proposition you like, it's possible to know it while being unable to do anything: someone totally paralysed from the neck down can know that such-and-such wrist movement is a way to steer a bicycle, or that the station is on the corner by the bakery, or that the soufflé is ready. On this picture abilities are what let you aquire knowledge and act on it; they aren't ingredients in it.
  (3) So knowing how to φ is not a matter of knowing that w is a way to φ, for any proposition about ways of φ-ing.
  (4) A check on (3) that I quite like and haven't come across anywhere: call it the instruction test. Hand someone a complete and true set of propositions describing exactly how to ride a bicycle — every muscle, every correction, every sensory consequence — together with unlimited memory and reasoning power, but no practice. They still can't ride. If knowing-how were knowing a proposition that should be baffling; if it isn't, it's exactly what you'd predict. I also keep using a dissociation pair: the choreographer who can notate the whole ballet but can't dance a step of it, and the dancer who dances it flawlessly and can't notate or even recognise a step on paper.

  Then she pointed out that (1) to (3) generalise, and that's the hole.

  (5) Take knowing where the station is. The grip condition seems to hold here too: someone who knows the grid reference by heart but couldn't find it, point to it on a map, recognise it, or get there doesn't really know where it is. So the grip condition covers knowing-wh as well.
  (6) And (2) covers knowing-wh too, in whatever form is needed.
  (7) But knowing where, who, what time is propositional knowledge — knowledge of the true answer to an embedded question — and if it isn't, you lose the unified semantics of wh-clauses and owe us some acquaintance-style or objectual story about those constructions.
  (8) So (1) to (3) don't just refute intellectualism about knowledge-how; they refute propositionalism about knowing-wh as well, and by the look of they'd do the same to knowing what a lychee tastes like, knowing a person, knowing a tune by heart. I end up an acquaintance theorist about everything, which I definately didn't sign up for.

  So: which step is the rotten one, and what does giving it up cost? I keep being offered the practical mode of presentation reply — roughly, that you can know the very same proposition under a practical guise, and that having the guise is where the ability comes in — but that feels like it just relocates the mystery rather than answering the instruction test, and it seems to make the whole thing an empirical question about psychology rather than one about what knowledge is. If I have to choose, I'd much rather keep (1) and (7) than my own conclusion (3), but when I try to drop (3) I can't see what to say about (4). Could you name the step, explain why it looked fine, and price the main alternatives, including what a defender of the propositional view would themselves concede and what they'd dig their heels in about? Sorry this is a bit of a wall of text. One fussy thing: please write your answer in American English — I'm sending extracts to a reading group in the States and I don't want to have to go through changing the spellings.
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're an MA student in philosophy of action, stuck on a paper about knowledge-how. Their main argument challenges the propositional view (intellectualism) by claiming that knowing how to do something requires ability, which propositional knowledge doesn't. But their friend pointed out that this argument also undermines propositional views of knowing-wh (where, who, etc.), which they hadn't intended. Now they're worried they've refuted too much and need to identify the weak step.

  First, I need to understand their structure. Premises (1) and (2) set up the conflict: knowing-how requires ability, but propositional knowledge doesn't. (3) concludes that knowing-how isn't propositional. (4) offers supporting examples. Then (5)-(8) show the argument generalizes to knowing-wh, leading to an undesirable broad anti-propositionalism.

  The user wants to know which premise is faulty, the cost of rejecting it, and alternatives. They mention the "practical mode of presentation" solution but find it unsatisfying. They prefer keeping (1) and (7), which are the ability condition and the propositionality of knowing-wh.

  Hmm, the core tension is between the ability condition (1) and propositionality (7). The user's examples in (4)—bicycle instructions, choreographer—are strong cases where propositional knowledge doesn't entail ability. But for knowing-wh, like knowing where the station is, ability seems necessary too. Yet in standard semantics, knowing-wh is considered propositional (knowing that the station is at location X).

  The rotten step might be not distinguishing between different types of ability. For knowing-how, the ability is constitutive—it's part of what the knowledge is. For knowing-wh, the ability might be consequential—it's a typical result but not part of the knowledge itself. That could preserve propositionality for knowing-wh while allowing knowing-how to be different.

  The user's friend's point about embedded questions is key. If knowing-wh is propositional in semantics, but requires ability, then either (1) must be weakened for knowing-wh, or (2) must be refined. Maybe (2) is too absolute. Propositional knowledge *can* require certain abilities if those abilities are necessary for accessing or applying the knowledge, but not as part of the knowledge state itself.

  Looking at the instruction test: handing someone all propositions about bike-riding without practice. They still can't ride. This suggests that for knowing-how, propositional knowledge isn't sufficient. But for knowing-where, if someone knows the proposition but can't point or navigate, do they really know where it is? Here, the abilities might be seen as necessary for the application, not the knowledge itself. For example, paralysis might prevent demonstrating the knowledge, but the knowledge could still be there.

  The practical mode of presentation reply: knowing the proposition under a practical mode. The user worries this relocates the mystery and makes it psychological. But perhaps it's a way to distinguish between different ways of grasping the same proposition. The ability comes from the mode, not the content.

  The user's preference to keep (1) and (7) suggests they want a hybrid view: propositional for knowing-wh, non-propositional for knowing-how. But then they need to explain why the ability condition applies differently. Maybe the nature of the task—knowing-how involves skill, while knowing-wh is informational.

  I recall Jason Stanley's intellectualism, where knowing-how is still propositional but requires practical modes. The user's objection is that this doesn't answer the instruction test. Stanley might say that the instructions aren't known under the right mode. But the user finds this ad hoc.

  Another option: reject the strong ability condition in (1) for knowing-how. Maybe ability isn't constitutive but typical. Intellectualists could argue that in abnormal cases (like paralysis), one still knows how, just can't demonstrate it. But the user's examples (choreographer vs dancer) show a dissociation where propositional knowledge doesn't entail ability.

  The cost of each move: if they drop (1), they lose the intuitive link between knowing-how and ability. If they drop (7), they have to explain knowing-wh non-propositionally, which complicates semantics. If they refine (2) to allow some abilities, they need a principled distinction between knowing-how and knowing-wh.

  Perhaps the rotten step is (1)'s application to knowing-wh. Knowing-where requires recognitional abilities, but these might be separate from the core propositional knowledge. For example, knowing the address is propositional, but finding it requires additional skills. Whereas for knowing-how, the ability is integral.

  But the user's station example challenges that—if you can't find it, do you really know where it is? This is tricky. Maybe in philosophy, "knowing where" is considered knowing the location, regardless of ability to get there. The ability is pragmatic, not semantic.

  I think the best path is to challenge premise (2). Propositional knowledge sometimes does require certain cognitive abilities, like understanding concepts. The user might be conflating physical ability with epistemic competence. For knowing-how, physical ability is key; for knowing-wh, it's more about cognitive access.

  So, defending intellectualism: Stanley would bite the bullet on the instruction test. The person with instructions knows-how but lacks the ability due to no practice, which builds the practical mode. The knowledge is there, but not actionable without embodiment.

  The user might not like this, but it's a consistent view. Alternatively, adopting Rylean anti-intellectualism for knowing-how only, which keeps knowing-wh propositional. But that requires explaining why knowing-how is different without generalizing.

  In conclusion, step (1) as applied universally is the issue. Restricting the strong ability condition to knowing-how avoids overgeneralization. The cost is providing a principled reason for the distinction, possibly based on the skill-informational divide. Intellectualists will concede that ability doesn't automatically follow propositional knowledge but insist it's still propositional under a practical mode.
answer: |-
  Here's a clear diagnosis of your argument's vulnerability, the costs of repairing it, and where intellectualists (propositional-view defenders) would likely dig in. The rotten step is **Premise (1) as universally applied**, specifically its extension to *all* "knowing-wh" cases in (5). Let's break this down in American English:

  ### The Problem: Overgeneralization of the "Grip Condition"
  - **Why (1) is the rotten step (in this context)**: Your "grip condition" (ability as constitutive of the knowledge) holds strongly for *knowing-how* but only weakly or derivatively for *knowing-wh*. Applying it universally creates a false equivalence.  
    - **For knowing-how (e.g., riding a bike)**: Ability is plausibly *constitutive*. If you lack the ability (despite having all propositional information), you arguably lack knowledge-how. Your instruction test (4) highlights this.  
    - **For knowing-wh (e.g., knowing where the station is)**: Ability (e.g., pointing, navigating) is better seen as a *typical consequence* or *pragmatic requirement*, not constitutive of the knowledge itself. The core epistemic state is knowing a *proposition* (e.g., "The station is at 5th and Maple").  

  - **Why (1) *looked* fine**: The intuition that "knowing where X is requires an ability to locate it" feels compelling. If someone can't find the station despite memorizing its coordinates, we *say* they "don't *really* know where it is." But this is a *pragmatic* judgment about **actionable knowledge**, not a refutation of its propositional content. The paralyzed person *knows* the location propositionally but can't *act* on it—similar to how they might know *that* water is H₂O but lack tools to demonstrate it.

  ### Cost of Rejecting/Revising Premise (1)
  - **The fix**: Restrict the grip condition to **knowledge-how only**. Reject its universal application to knowing-wh.  
  - **Cost**: You lose the *prima facie* intuitive link between knowing-wh and ability. You must argue that:  
    - Knowing-wh (where, who, when) is fundamentally **propositional knowledge** (e.g., knowing *that* the station is at 5th and Maple).  
    - Abilities (pointing, navigating) are **extraneous to the knowledge itself**—they depend on *additional* capacities (e.g., motor skills, spatial reasoning) that let you *apply* the knowledge.  
  - **Why this is acceptable**: Semantics treats "S knows where X is" as "S knows the true answer to 'Where is X?'" which *is* propositional. Inability to act on it (due to paralysis, disorientation) doesn’t negate the propositional knowledge; it shows **knowledge ≠ successful action**.  

  ### Defending the Propositional View: Intellectualist Replies
  Intellectualists (e.g., Stanley & Williamson) would **concede (4)** but **deny (1) and (3)**, offering two key defenses:  
  1. **Practical Modes of Presentation (PMoP)**:  
     - Knowing-how *is* propositional (e.g., knowing *that w* is a way to φ), but under a *practical mode of presentation*.  
     - **Reply to your objection**: PMoP isn't "relocating the mystery"—it's distinguishing *content* (propositional) from *psychological access* (practical). The ability comes from *grasping* the proposition via embodied skill, not from the content itself.  
     - **Instruction test (4)**: The person with instructions lacks the *practical mode*—they know the proposition *theoretically* but not *under the guise* that enables action. This isn't ad hoc; it mirrors how "Hesperus is Phosphorus" can be known under different modes while being one proposition.  
     - **Cost to you**: Accepting PMoP retains propositionalism but makes ability a precondition for *deploying* knowledge-how, not part of its definition. You still refute "crude" intellectualism that ignores modes.  

  2. **Ability is Not Constitutive**:  
     - Intellectualists **dig in on (2)**: They insist propositional knowledge *never* requires ability as a *constitutive* condition. Abilities are enabling conditions for *acquiring/applying* knowledge, not part of knowledge itself.  
     - **Paralysis cases**: A paralyzed dancer *knows how* to dance (propositionally + PMoP) but can't execute it. Your choreographer/dancer pair shows dissociation between *theoretical* and *practical* knowledge—not that knowing-how is non-propositional.  
     - **Knowing-wh defense**: For "knowing where," the inability to point/navigate is a *performance error*, not an *epistemic failure*. The knowledge is intact (e.g., "It’s at 5th and Maple"); the agent just can’t *use* it.  

  ### Your Alternatives & Their Prices
  | **Option** | **What You Keep** | **Cost** | **Intellectualist Reaction** |
  |------------|-------------------|----------|-------------------------------|
  | **Restrict grip to knowing-how** | (3), (4), (7) | Must explain why knowing-how uniquely requires ability. Risks ad hoc-ness. | "You’ve refuted crude intellectualism but not ours (with PMoP)." |
  | **Keep universal grip (1)** | (1), (3), (4) | Reject (7). Must explain knowing-wh non-propositionally (e.g., acquaintance). Semantics gets messy; overthrows standard linguistics. | "This is self-sabotage—you’ve lost the argument by overreach." |
  | **Accept PMoP** | (7), part of (4) | Concede (3) is false. Knowing-how *is* propositional, but ability is still necessary for *practical deployment*. | "Correct. Now let’s debate if PMoP is defensible." |
  | **Reject strong grip (1)** | (2), (7) | Concede intellectualism wins. Knowledge-how is PMoP + proposition; ability is collateral. | "Victory. Your cases show only that *application* requires ability." |

  ### Recommendation
  **Restrict the grip condition to knowing-how** and **target intellectualism without PMoP**. This preserves your core argument while avoiding semantic overextension:  
  - **Refined (1)**: "If S knows how to φ, then S possesses a *practically constituted ability* to φ."  
  - **Reply to knowing-wh**: "Knowing where X is does not require *ability* as part of its epistemic content; it requires only knowing a location proposition. Inability to act on it is a failure of *agency*, not knowledge."  
  - **Defend the distinction**: Knowing-how involves *skill* (procedural, embodied), while knowing-wh involves *information* (declarative). Your instruction test (4) and dissociation cases still devastate intellectualists who reject PMoP.  

  Intellectualists will fight for PMoP, but their concession that *bare* propositional knowledge (without practical grasp) is insufficient for action preserves your key insight. You refute *simplistic* propositionalism without collapsing into universal acquaintance theory.
