answer: |-
  Below is a comprehensive design for your seminar session, addressing all your requirements. The game is structured to highlight the Condorcet Jury Theorem's (CJT) core assumptions—independence, competence >0.5, and common interest—through experiential learning. It emphasizes how violating independence or competence can undermine group accuracy, and how headcount alone isn’t sufficient (and can even hurt). The session avoids upfront theory, uses fast-paced rounds, and includes a debrief linking game moments to CJT.

  ---

  ### **1. Card/Signal Generation & Per-Round Procedure**  
  **Key Mechanics**:  
  - **States**: Binary (e.g., **Guilty (G)** or **Innocent (I)**).  
  - **Signals**: Private clues with reliability `p` (0.6 for most, 0.9 for "experts").  
  - **Rounds**: 90 seconds each (including voting/tallying).  
  - **Pre-Generated Materials**:  
    - **Decks for Signals**:  
      - **Deck G (Guilty state)**: 60% "G" cards, 40% "I" cards.  
        *Example*: For 19 students, use 12 "G" and 7 "I" cards (shuffled).  
      - **Deck I (Innocent state)**: 60% "I" cards, 40% "G" cards.  
        *Example*: 12 "I" and 7 "G" cards (shuffled).  
    - **True States**: Pre-drawn for all rounds (e.g., flip a coin 15 times, record results).  
    - **Block 2 (Independence Break)**: Pre-drawn "expert briefing" signals (reliability 0.8) and random subsets of 10 students who must obey it.  
    - **Block 3 (Forced Choice)**: Separate signals for the large group (16 students, `p=0.6`) and committee (3 students, `p=0.9`).  

  **Procedure for a 90-Second Round**:  
  1. **Reveal State**: Announce the round number (e.g., "Round 1"). Do **not** reveal the true state yet.  
  2. **Distribute Signals**:  
     - Pick the deck matching the pre-drawn state (Deck G or I).  
     - Shuffle and hand one private clue card to each student (20 sec).  
  3. **Voting**:  
     - Students write **G** or **I** on index cards (secret ballot) (10 sec).  
     - Collect votes in a box (10 sec).  
  4. **Tally & Reveal**:  
     - Tally votes openly on the whiteboard (majority = group decision) (20 sec).  
     - Reveal true state. Award **1 point** to every student if group correct (30 sec).  

  **Blocks & Rounds Order** (Total: 15 rounds, ~22.5 minutes):  
  - **Block 1 (Baseline)**: 5 rounds. All 19 students vote independently with `p=0.6`.  
    *Goal*: Students see high group accuracy (~99% expected).  
  - **Block 2 (Broken Independence)**: 5 rounds. All get private clues (`p=0.6`), but a random subset of 10 students **must** vote based on a public "expert briefing" (reliability 0.8).  
    - *Twist*: After distributing private clues, announce:  
      *"This round includes an expert briefing: [e.g., 'Guilty']. Students [call 10 random numbers] must vote based on this briefing ONLY. Others vote based on private clues."*  
    *Goal*: Students see accuracy drop to ~80%.  
  - **Block 3 (Forced Choice)**: 5 rounds. Split class:  
    - **Large group (16 students)**: Vote with `p=0.6` signals.  
    - **Committee (3 students)**: Vote with `p=0.9` signals.  
    - *Scoring*: Large group gets 1 pt if their majority correct; committee gets 1 pt if theirs correct.  
    *Goal*: Students see committee outperforms large group (committee ~97% accuracy vs. large group ~81%).  

  **Why This Independence Break?**  
  - **Public Briefing**: Forces correlation—the 10 voters lose independence by sharing one signal.  
  - **Worse Alternatives**:  
    - *Deliberation*: Hard to control; may not reliably break independence.  
    - *Reading Votes*: Creates correlation but less dramatically than a shared signal.  

  ---

  ### **2. Payoff Scheme**  
  - **Group Accuracy Incentive**: Students earn **1 point** (per round) only if the **group's majority vote is correct**.  
    - *Blocks 1–2*: All students earn points together.  
    - *Block 3*: Large group and committee earn points separately.  
  - **Why This Works**:  
    - Aligns with **common interest** (all want the group right).  
    - **No individual rewards** for correct personal votes—prevents overconfidence/showboating.  
    - **Sacrifice Note**: Avoid rewarding individual correctness to prevent meta-gaming (e.g., ignoring signals to "beat the system").  

  ---

  ### **3. Minute-by-Minute Schedule** (80 Total Minutes)  
  - **0–5 min**: Introduction.  
    - Assign numbers (1–19) to students.  
    - Explain rules: *"Vote based on your clue. Group correctness earns points. No talking during voting."*  
  - **Block 1 (Baseline)**: 5 rounds.  
    - **5–7 min**: Explain Block 1.  
    - **7–14 min**: Run 5 rounds (90 sec/round).  
  - **Block 2 (Broken Independence)**: 5 rounds.  
    - **14–16 min**: Explain twist.  
    - **16–23 min**: Run 5 rounds.  
  - **Block 3 (Forced Choice)**: 5 rounds.  
    - **23–25 min**: Split class (16 large group / 3 committee). Explain scoring.  
    - **25–32 min**: Run 5 rounds.  
  - **32–80 min**: Debrief (see below).  

  ---

  ### **4. Debrief: Mapping Game to CJT Assumptions**  
  **Guided Discussion (Do NOT name CJT until end)**:  
  1. **Block 1 Reflection**:  
     - *Ask*: "How accurate was the group? Why?"  
     - *Highlight*: "Each of you had an independent clue >50% reliable. Many independent votes amplify small advantages."  
     - *Map to CJT*: Independence + competence >0.5 → high group accuracy.  
  2. **Block 2 Reflection**:  
     - *Ask*: "Why did accuracy drop? What changed for the 10 voters?"  
     - *Highlight*: "Their votes weren’t independent—they shared one briefing. One mistake hurt everyone."  
     - *Map to CJT*: Correlation breaks independence → group accuracy collapses to the briefing’s reliability.  
  3. **Block 3 Reflection**:  
     - *Ask*: "Which group won? Why?"  
     - *Highlight*: "3 experts beat 16 mediocre voters. Headcount isn’t magic—quality matters."  
  4. **Adding Voters Exercise** (Key moment!):  
     - *Activity*: Pick 5 students. Give `p=0.6` signals. Vote. Add a 6th voter with `p=0.4` (reliably wrong). Vote again.  
     - *Ask*: "Did adding a voter help or hurt? Why?"  
     - *Highlight*: "Adding a voter worse than a coin toss (*or correlated, like in Block 2*) can flip a correct vote to wrong."  
  5. **Name the Theorem**:  
     - *Finally*: "This is the Condorcet Jury Theorem: Independence + competence >0.5 → more voters help. Break these, and more voters can hurt."  

  ---

  ### **5. Predictable Problems & Solutions**  
  1. **Whispering Clues**:  
     - *Prevention*: Assign seats, patrol room. Announce: "Sharing clues breaks the game—you’ll see why later."  
  2. **Meta-Gaming Points**:  
     - *Prevention*: No rewards for individual votes. Discourage overthinking: "Vote your clue; the game is designed to work only if you do."  
  3. **Slow Tallying**:  
     - *Fix*: Appoint 2 students as "tally assistants." Use hash marks on the whiteboard.  
  4. **Confusion in Block 3**:  
     - *Fix*: Color-code cards (e.g., blue for large group, gold for committee). Physically separate groups.  
  5. **Bad Luck Streaks**:  
     - *Fix*: Reassure: "Probability is noisy with few rounds. Focus on patterns, not single rounds."  

  ---

  ### **6. Limitations & Honest Notes**  
  **What the Game Can’t Show**:  
  - **Asymptotics**: With 19 voters, students won’t see probability → 1. *Say*: "CJT says with 1,000 voters at `p=0.6`, accuracy is near 100%. We can’t simulate that here."  
  - **Subtle Dependencies**: The briefing creates strong correlation; real-world dependencies (e.g., social networks) are messier.  
  - **Competence <0.5**: Adding a `p=0.4` voter in the exercise shows the risk, but CJT’s negative asymptotics require many bad voters.  

  **What You Must Explain Briefly**:  
  > *"CJT isn’t ‘more people = smarter.’ It requires:  
  > (1) Votes independent given the state,  
  > (2) Each voter >50% competent,  
  > (3) Common interest.  
  > Break (1) or (2), and more voters can hurt. The game showed how."*  

