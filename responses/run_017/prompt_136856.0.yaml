  This design ensures students experience CJT’s assumptions viscerally, not just intellectually. The twists, forced choice, and debrief structure make violations of independence/competence feel tangible, while the payoff scheme keeps focus on collective accuracy. The session fits your constraints and explicitly counters the "headcount = smarts" misconception.
