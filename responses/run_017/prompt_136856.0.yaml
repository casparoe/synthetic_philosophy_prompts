  ### **Expected Accuracies & Adding Voters Setup**  
  - **Expected Accuracies (Per Block)**:  
    - Block 1 (19 voters, `p=0.6`): ~99% (likely 4–5/5 correct).  
    - Block 2 (Independence broken): ~80% (likely 3–4/5 correct).  
    - Block 3:  
      - Large group (16 voters, `p=0.6`): ~81% (likely 3–4/5 correct).  
      - Committee (3 voters, `p=0.9`): ~97% (likely 4–5/5 correct).  
  - **Adding a Voter Moment**:  
    - **Where**: During debrief (after Block 3).  
    - **Best Staging**: Use **one voter with `p=0.4`** (reliably wrong). This is simpler and more dramatic than a correlated block.  
    - **Why**: It directly violates competence >0.5. Students see a single bad voter flip a correct 5-voter majority to a 6-voter error ~10% of the time.  

