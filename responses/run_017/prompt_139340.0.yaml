answer: |-
  Here’s a structured teaching plan for your CEV session, adhering to your constraints and section requirements:

  ### 1. Dependency Map  
  Start with **individual extrapolation** (knowledge + reflection → idealized preferences), revealing its failure: step-by-step improvement lacks convergence. *Then* introduce **coherence** as a fixed-point solution to this failure. Only after establishing coherence’s necessity, add **interpersonal extrapolation** (shared history → "we"), emphasizing its distinct challenge: defining membership and resolving conflicts *before* convergence. Finally, layer **extrapolation dynamics** (what "more reflection/knowledge" means). Crucially, the group must *feel* the step-by-step failure first—show how alternating knowledge/reflection orders yield divergent outcomes (e.g., your sequencing case). This creates the "aha" moment for coherence as non-sequential reconciliation. Without this pain point, coherence feels arbitrary.

  ### 2. The Carrying Example  
  **Use a preference reversal under reflection, not sequencing.** Example: *A subject initially wants to carry their injured friend to safety. Given unlimited reflection first, they realize this risks both lives and converges on waiting for help. Given medical knowledge first (e.g., friend has a spinal injury), then reflection, they converge on immobilizing the friend.*  
  **Why this works:**  
  - Contains: Irreducible role of reflection (moral prioritization) vs. knowledge (empirical facts).  
  - Lacks: Temporal order dependence (which distracts into "input sequence" problems). The conflict is between *types* of improvement, not their order.  
  - Avoids misleading: Sequencing cases imply procedural solutions (e.g., "optimize order of upgrades"). Reflection/knowledge tension highlights the *non-algorithmic* need for coherence.  
  **If sequencing feels unavoidable, add:** "What if we alternate knowledge/reflection upgrades ad infinitum?" to pivot to fixed-point necessity.

  ### 3. Misconception Ledger  
  | Misconception                          | Likely Surface Point              | Defusing Move                                                                 |
  |----------------------------------------|------------------------------------|-------------------------------------------------------------------------------|
  | CEV as current decision procedure      | Intro/Q&A                          | Contrast: "CEV defines a *target* for an AI, not a tool for *us*. How would *you* specify it to the AI?" |
  | Collapsing "improvements" into intelligence | Discussing knowledge/reflection    | Disambiguate: "Which upgrade changes the output here—more data, ethical reasoning, or mental speed?" (Use carrying case) |
  | "Would want to be" as purely epistemic | Coherence intro                   | Challenge: "Does 'wanting to be the kind of person who wants X' reduce to *knowing* you *should* want X? What about shame/regret?" |
  | **Added: Conflation with utilitarianism** | Interpersonal step                | Contrast: "CEV seeks coherence *within* our values, not summing/averaging. What if most prefer torture?" |
  | **Added: "CEV = mind-reading"**        | Extrapolation mechanics           | Clarify: "Extrapolation models counterfactual *growth*, not current psychology. How does 'unlimited reflection' differ from polling your present self?" |

  ### 4. The One I Can't Place  
  **Concede it as a hole during coherence discussion.** After establishing the fixed-point, say: *"This pushes the problem back: 'better self' implies a prior standard. CEV doesn't *solve* meta-ethics—it *uses* our implicit standards of improvement. That’s not circularity but bootstrapping, and it’s fragile. We’re outsourcing the hard problem to 'unlimited reflection,' which may fail."* Land this after coherence but before interpersonal step. It preempts false closure and frames the interpersonal problem ("Whose standards?") as even harder.

  ### 5. The Check and the Refusals  
  **Check:** Pose: *"An AI applies CEV. Alice’s extrapolated self values privacy; Bob’s values transparency. What happens?"* Correct understanding identifies: (a) Interpersonal coherence isn’t guaranteed, (b) "Shared history" may resolve it or not, (c) This is where CEV gets vague.  
  **Refusals:** Decline: "**We won’t solve 'who counts in the we' tonight—that’s a separate thorn in CEV’s side.**" Use: *"That’s gatekeeping CEV’s inputs, not interpreting its outputs—let’s park it for another session."*  
  **Sentence for pushback:** *"CEV can’t define its own constituency; that’s a moral decision we must make first, messily."*

  ---

  **Key sequencing:** Individual extrapolation → step-by-step failure → coherence fix → circularity concession → interpersonal step → "we" ≠ "individuals squared" → open problems (membership, conflict resolution).  
  **Interpersonal distinctness:** Stress that conflicts *between* extrapolated individuals lack a shared "reflective endpoint," requiring new machinery (shared history/coherence) beyond individual methods.
