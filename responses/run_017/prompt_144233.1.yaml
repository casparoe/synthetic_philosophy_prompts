prompt: |-
  hey — i'm taking a judgment & decision-making course this term and i'm also the person who writes the budget for my student society. We run six or seven events a year (a careers-fair type thing, a couple of socials, a conference, a few one-offs), and every one needs a projected attendance number and a cost estimate that the student union finance comittee signs off on. The committee is five undergrads who have never heard of any of this. If we overrun by more than about 15% we eat it out of next term's allocation, and if we underspend badly they cut our budget, so both directions hurt a bit. I've got maybe half an hour per proposal, a spreadsheet, and my memory of what past events actually cost.

  So: can you turn the inside view / outside view stuff into a procedure I can actually run? Not "be aware of the planning fallacy" — I want the ordered questions, what counts as a good enough answer to each one, where the procedure says stop and don't commit the money, and where it has to hand the decision back to the committee because it's a values call rather than an estimation call. Remember the people signing off are 19 to 21 and have no stats, so no step can need more than a spreadsheet.

  The bits I keep getting stuck on, which I want the procedure to actually handle rather than hand-wave:

  - I build the bottom-up number first (venue, catering per head, ticket sales as a percentage of last time, sponsorship I'm "pretty sure" about) and then I go looking for a reference class — which means I can basically shop for whichever class gives me the answer I already wanted. How does the procedure stop me doing that? Do I have to commit to the class before I'm allowed to do the bottom-up estimate?
  - Some line items obviously have base rates and some don't. Catering cost per head: years of data. "Will this speaker actually draw 200 people": nothing. Do I regress the total or the components? Regressing the whole total feels like it throws away the information I genuinely do have.
  - Our reference class is only the events we actually ran, and we only ran the ones we felt good about after doing exactly this kind of optimistic planning. I've argued myself into both "so the base rate is too rosy" and "so the base rate is fine, because the filter operating on the class is the same filter operating on me now." Which is it, or what would I have to check to tell?
  - Do the events we proposed and then quietly didn't run go in the class?
  - When am I allowed to shift off the base rate because this case is genuinely different, and what makes that a legitimate reason instead of a rationalization? Does it have to be a mechanism I state out loud in advance and can score afterwards, and what do I do with a reason I only thought of after seeing the outside-view number?

  Then run it on three of next term's proposals: (1) the careers fair, which we've now run four times and where I have a specific, nameable reason to expect slightly above our average; (2) a two-day hackathon we've never done, where the only reference class I can build is other societies' published budgets, which I strongly suspect are the numbers they *planned* rather than what they spent; and (3) the conference, which is the event everyone loves, that I've already half-promised to people, and which I want you to apply the procedure to straight — even if the honest answer is that we should run it at half the capacity, with a much bigger contingency than I want to ask for, or not this year. I'd rather hear that from the procedure in October than find out in March.

  Also: be clear about what this procedure can't do — the cases where it's silent or where it's really just my own judgement with a spreadsheet costume on — and tell me which steps are judgement calls dressed up as procedure. And say what would change your mind about the procedure itself: where is your reasoning most likely to fail, and is there anything about how we operate that, if I told you, would make you say "actually, just use your inside view here"?
reasoning: |-
  We are designing a procedural application of the inside/outside view to budget estimation for student society events. The goal is to mitigate cognitive biases, especially the planning fallacy, by forcing a structured comparison between a bottom-up (inside view) estimate and a top-down (outside view) base rate. The procedure must be executable in about 30 minutes per proposal using a spreadsheet and historical data, and must be understandable by a committee of undergrads without statistics background.

  Key challenges to address:
  1. Preventing "shopping" for a reference class that confirms the inside view.
  2. Handling components with and without base rates (e.g., catering vs. speaker draw).
  3. Deciding the reference class (only run events? including proposed but not run?).
  4. Allowing adjustment from the base rate only on legitimate, pre-specified grounds.
  5. Distinguishing between estimation (which the procedure handles) and values calls (which go back to the committee).

  We structure the procedure as a series of steps with clear outputs and decision rules.

  **Procedure: Dual Estimation with Anchoring and Adjustment**

  **Step 0: Preparation**
  - Before starting, gather historical data for all past events (run or not) in a spreadsheet. For each, record:
     - Event type (e.g., careers fair, social, conference)
     - Projected attendance (if available)
     - Actual attendance
     - Projected cost
     - Actual cost
     - Line-item costs (where available: venue, catering, etc.)
     - Whether the event was run or not
     - Any notable factors (e.g., "rained that day", "competing event")

  **Step 1: Define the Event and Build the Inside View (Bottom-Up)**
  - Without looking at historical data, build a bottom-up estimate for the event.
     - Break down into line items (venue, catering per head, tickets, sponsorship, etc.).
     - For each item, estimate:
          - Best-case (optimistic)
          - Expected (most likely)
          - Worst-case (pessimistic)
     - Use your knowledge and any vendor quotes. For uncertain items (e.g., attendance), state your assumptions.
     - Calculate the total cost and revenue (if any) for the event. The primary output is the expected total cost and expected attendance (if relevant for variable costs).

  *Time allocation: 10-15 minutes.*

  **Step 2: Select a Reference Class (Without Peeking at the Inside View Total)**
  - Now, step back. Define the reference class for this event. Rules for reference class selection:
     - Must be defined by objective characteristics (e.g., "all careers fairs", "all events with >100 attendees", "all hackathons") and not by outcome.
     - Start broad and then narrow if necessary. Default hierarchy:
          a. Same event type (if multiple instances exist, e.g., careers fair).
          b. Events of similar size (by past attendance or budget) and type (e.g., academic vs. social).
          c. All events.
     - If there are fewer than 5 events in the class, broaden the class (but note the reason).
     - If the event is novel (like the hackathon), use the closest analog (e.g., other societies' events) but note they are planned, not actual.

  *Critical: Commit to the reference class before looking at the inside view estimate or the historical data for that class. Write down the class definition.*

  **Step 3: Compute the Base Rate (Outside View)**
  - For the chosen reference class, compute:
     - The actual cost for each event (if using other societies' budgets, use their planned cost and note the limitation).
     - The absolute error for each event: |Actual cost - Projected cost| / Projected cost (or absolute if projected is zero).
     - The mean and median absolute percentage error (MAPE) for the class.
     - The mean and median actual cost.

  *Note: If using other societies' data, we cannot compute error (since we don't have their actuals). Instead, use the planned cost as a base rate and apply a penalty (see Step 4).*

  **Step 4: Compare and Adjust**
  - Now compare the inside view (expected cost) to the base rate (mean or median of the reference class). 
  - Compute the adjustment:
     - If the reference class has actuals (your own events):
          - Calculate the adjustment factor: 1 + (median MAPE of the class) [if the typical error is overrun, use positive; if under, use negative? But MAPE is absolute. So we need direction?]
          - Actually, we need to know the direction of error. Compute the median percentage error (MPE) for the class: median((Actual cost - Projected cost)/Projected cost). This tells us the typical bias.
          - Then, the adjusted outside view estimate = inside view expected cost * (1 + median MPE)
          - But note: if the MPE is negative (we typically underrun), then we adjust down? However, our goal is to correct for bias. If historically we overrun by 20% on average, then we adjust the current inside view up by 20%.

     - If using other societies' planned costs (without actuals):
          - Use the median planned cost of the reference class as the base rate.
          - Then, because planned costs are optimistic, apply an upward adjustment. The adjustment factor should be based on your own society's typical error for events of similar novelty. If no data, use a default of +25% (based on typical planning fallacy).

  - Now, you have two numbers: 
     - Inside view (IV)
     - Adjusted outside view (AOV)

  - Decision rule for the estimate:
     - If |IV - AOV| <= 15% of AOV, then use the average of IV and AOV as the proposed budget.
     - Else, if IV < AOV (inside view is optimistic), then propose AOV (the higher, more conservative number) because the risk of overrun is high.
     - Else, if IV > AOV (inside view is pessimistic), then investigate why. It might be that there's a legitimate reason (e.g., inflation, known cost increases). If you can document a specific, measurable change (e.g., venue costs up 30% from last year), then adjust the AOV by that change and recompare. Otherwise, use the AOV (the lower number) to avoid overbudgeting and risking underspend penalty.

  **Step 5: Set the Contingency**
  - The contingency should be based on the reference class's variability. 
     - Compute the standard deviation of the percentage errors (if using your own actuals) and set the contingency as 1.5 times the standard deviation (but not less than 10% and not more than 30%). 
     - If using other societies' data without actuals, use a default contingency of 20%.

  **Step 6: Flag for Committee**
  - The procedure outputs:
     - Proposed budget: [the number from Step 4]
     - Contingency: [the amount from Step 5]
     - Total to request: proposed budget + contingency
     - Also, note any unresolved issues:
          - If the event is high-stakes (like the conference) and the total to request is more than 15% above the inside view, flag that the event may not be viable as planned. The committee must decide: run with reduced scope, cancel, or seek additional funding.

  **Step 7: Record for Future**
  - After the event, record the actual cost and attendance. Update the historical data.

  **Addressing the Specific Questions:**

  1. **Preventing reference class shopping**: By committing to the reference class (Step 2) before computing the base rate and before seeing the inside view total, we avoid tuning the class to match the inside view.

  2. **Handling components with and without base rates**: 
     - We do the bottom-up for the whole event. Then, the adjustment in Step 4 is on the total. However, for items with strong base rates (like catering), we can use them in the bottom-up. But the overall adjustment is at the event level. Why? Because the planning fallacy often affects the whole project, and we don't want to throw away the inside view's detailed knowledge. However, if a particular item is known to be highly volatile (e.g., sponsorship), we might do a separate adjustment for that item and then the whole event. But for simplicity, we adjust the total.

  3. **Reference class composition**:
     - Include only events that were run? Yes, because we need actuals. Proposed but not run events are not in the class because we don't know what the actual would have been. However, note that this creates a selection bias: we only run events we think will succeed. Therefore, the base rate might be optimistic. To correct, we look at the typical error (MPE) of the run events. If we consistently overrun, that error rate already includes the selection bias. So we use the MPE to adjust.

  4. **Adjusting off the base rate**:
     - Only allowed for specific, measurable, and documentable reasons that are known to affect costs. Examples: 
          - Inflation: if the venue costs have gone up by a known percentage from last year, apply that to the base rate.
          - Scope change: if this event is twice as big as any in the reference class, then use a per-unit cost from the base rate and scale up, then apply the error adjustment.
     - The reason must be stated in advance and be quantifiable. If you only think of it after seeing the outside view, note it and adjust, but then the committee must review that reason.

  5. **What the procedure can't do**:
     - It can't create data where there is none. For novel events, we rely on external data which may be biased.
     - It can't replace human judgment entirely. Steps 2 (reference class) and 4 (adjustment reasons) require judgment. The procedure makes that judgment explicit and auditable.
     - It can't account for black swan events (e.g., a pandemic). The contingency is for normal variability.

  **Application to the Three Events**

  We assume a historical dataset (your own society, unless noted) and a default adjustment for optimism of +20% when using planned costs from others.

  **(1) Careers Fair (run four times)**
  - Step 1 (Inside View): 
     - Venue: $1000 (fixed)
     - Catering: $10 per head * 300 expected attendees = $3000
     - ... total IV = $5000
  - Step 2: Reference class = all past careers fairs (4 events).
  - Step 3: Base rate from actual costs: [4000, 4500, 5000, 5500] -> median = $4750. 
     - Compute errors: 
          - Event1: (4000-3500)/3500 = +14.3% (overrun)
          - Event2: (4500-4000)/4000 = +12.5%
          - Event3: (5000-4200)/4200 = +19.0%
          - Event4: (5500-5000)/5000 = +10.0%
     - Median MPE = +12.5% (overrun)
     - Adjusted outside view (AOV) = IV * (1 + 0.125) = 5000 * 1.125 = $5625
  - Step 4: Compare IV ($5000) and AOV ($5625). Difference = 12.5% (<=15%), so propose (5000+5625)/2 = $5312.50 -> round to $5300.
  - Step 5: Contingency: standard deviation of percentage errors = about 3.5%, so 1.5*3.5% = 5.25% of proposed budget -> $278. Total request: $5300+$278 = $5578.
  - Step 6: No flag. Proceed.

  But note: you have a specific reason to expect above average. That was in the inside view (you projected 300 vs past average of 280). The outside view adjustment already accounts for typical optimism. So we don't adjust further.

  **(2) Hackathon (never done, use other societies' budgets)**
  - Step 1 (Inside View): 
     - Venue: $1500 (fixed)
     - Food: $15/head * 50 = $750
     - ... total IV = $3000
  - Step 2: Reference class = hackathons run by other societies (say, 3 events). Their planned budgets: $2000, $2500, $3000.
  - Step 3: Base rate = median planned = $2500. But since we don't have actuals, we assume they are optimistic. We use our own society's typical error for novel events. If we don't have that, default +25% adjustment. So AOV = $2500 * 1.25 = $3125.
  - Step 4: Compare IV ($3000) and AOV ($3125). Difference = 4% (<=15%), so propose ($3000+$3125)/2 = $3062.50 -> $3060.
  - Step 5: Contingency: default 20% of proposed budget = $612. Total request: $3672.
  - Step 6: Note that the base rate is from planned budgets, which may be optimistic. The committee should be aware.

  **(3) Conference (beloved event, but risks)**
  - Step 1 (Inside View): 
     - You are enthusiastic. Venue: $5000, Catering: $20/head * 200 = $4000, ... IV total = $15000.
  - Step 2: Reference class = past conferences (say 3 events). Actual costs: [12000, 14000, 18000]; projected costs: [10000, 12000, 15000].
  - Step 3: Errors: 
          - (12000-10000)/10000 = +20%
          - (14000-12000)/12000 = +16.7%
          - (18000-15000)/15000 = +20%
     - Median MPE = +20%. Base rate median actual = $14000. AOV = IV * 1.20 = 15000*1.2 = $18000.
  - Step 4: Compare IV ($15000) and AOV ($18000). Difference = 20% (>15%). Since IV < AOV (optimistic), propose $18000.
  - Step 5: Contingency: standard deviation of errors (say 1.7%), so 1.5*1.7% = 2.55% -> $459. But we set a floor of 10%: 10% of $18000 = $1800. So contingency = $1800. Total request: $19800.
  - Step 6: Flag: the requested amount is 32% above the inside view. The committee must decide: 
     - Proceed at full scope with $19800 (which might eat into next term if overrun is more than 15% of $18000, i.e., $2700 over)? 
     - Reduce scope (e.g., 150 attendees instead of 200) to bring IV down? 
     - Cancel? 

  This is a values call: the committee must weigh the popularity against the risk.

  **Where the Procedure Might Fail and What Would Change Our Mind**

  - **Failure points**:
     - The quality of the reference class. If historical data is sparse, the base rate is weak.
     - The adjustment for direction of error (MPE) assumes the past bias applies to the current event. If the conditions change (e.g., better planning practices), the MPE might not hold.
     - The procedure doesn't capture correlated risks (e.g., if catering and venue are from the same vendor and they fail).

  - **When to use just the inside view**:
     - If the event is entirely novel and there is no reference class (even external), then we have to rely on inside view. But then set a high contingency (30%).
     - If the event is very small and the cost of overrun is negligible.

  **Conclusion**
  This procedure forces an explicit comparison and documents the reasoning. It reduces but doesn't eliminate the role of judgment. It is designed to be robust against common pitfalls and executable in 30 minutes with a spreadsheet.
answer: |-
  Below is a step-by-step procedure for applying the inside/outside view to your budget proposals. It's designed to be executable in **≤30 minutes per event** using only a spreadsheet and your historical data. The procedure forces objectivity by **locking in key decisions before you see conflicting numbers**, and it flags when a decision must be kicked to the committee. I'll address your specific pain points head-on, then run it on your three events. Finally, I'll clarify its limits and failure points.

  ---

  ### **The Procedure: Reference-Class Budgeting (RCB)**
  **Core Principle:** You generate an inside-view (IV) and outside-view (OV) estimate *independently*, then reconcile them *algorithmically* to avoid self-deception. No step requires stats—just arithmetic.

  #### **Step 0: Pre-Work (Do Once Per Term)**
    - **Create a "Reference-Class Database" in your spreadsheet:**
      - Columns: `Event Name`, `Type`, `Year`, `Planned Cost`, `Actual Cost`, `Planned Attendance`, `Actual Attendance`, `Ran? (Y/N)`, `Notes`.
      - **What to include:** 
        - All events your society *ran* (mandatory).  
        - Events you *planned but didn't run* (optional, but highly recommended—mark `Ran? = N`).  
        - Other societies' events *only* if you have their **actuals** (not plans). If you only have plans, note this—they’re weak data.
      - **Why this works for your stuck questions:** 
        - Including non-run events corrects for "rosy base rates" by showing what you *over-optimistically planned but abandoned*.  
        - Using other societies' *plans* is allowed but penalized (Step 4)—it’s better than nothing, but we adjust for bias.

  #### **Step 1: Generate Inside View (IV) Estimate (10 mins)**
    - **What to do:** Build your bottom-up cost estimate *without* looking at historical data. Break into line items (venue, catering, etc.). For each:
      - **Fixed costs:** Use vendor quotes or exact fees (e.g., "Venue: $500/day").  
      - **Variable costs:** Estimate per-head (e.g., "Food: $10/person × 200 attendees = $2,000").  
      - **Uncertainties:** Note if an item relies on hope (e.g., "Sponsorship: $1,500 (60% confidence)").  
    - **Output:** Total IV cost and attendance projection.  
    - **Lock in:** Write down your key assumptions (e.g., "200 attendees based on Instagram sign-ups").  
    - ⚠️ **No OV data allowed yet!** This prevents shopping for a reference class.

  #### **Step 2: Define Reference Class *Before* Calculating OV (5 mins)**
    - **Rules to prevent class-shopping:**  
      1. Start with the **narrowest useful class** (e.g., "Careers Fairs" for careers fair).  
      2. If <3 events in that class, broaden **one step** (e.g., "Academic Events").  
      3. If still <3, use **all events**.  
      4. **Commit:** Write down the class definition *before pulling numbers*. No changes after.  
    - **What counts as "good enough":**  
      - For **repeat events (e.g., careers fair):** Prioritize *same event type*.  
      - For **novel events (e.g., hackathon):** Use *similar events* (size/type) or other societies' data.  
      - For **high-stakes events (e.g., conference):** Include non-run events to dampen optimism.  
    - **Output:** Your reference class (e.g., "All Careers Fairs we ran").

  #### **Step 3: Calculate Outside View (OV) Estimate (5 mins)**
    - **For costs/attendance with base rates (e.g., catering):**  
      - Take the **median actual cost/attendance** for your reference class.  
      - Why median? Resistant to outliers (e.g., that one pandemic year).  
    - **For costs/attendance *without* base rates (e.g., "will this speaker draw 200?"):**  
      - Use the **IV estimate** but flag it as "unanchored" (no OV adjustment later).  
    - **Output:** Raw OV cost and attendance.  
    - **Critical adjustments:**  
      - If using other societies' **planned** (not actual) costs: Apply a **+20% penalty**. (Meta-studies show plans average ~20% optimistic; adjust based on your data.)  
      - If class includes **non-run events:** Apply a **-15% penalty** to OV attendance (abandoned events likely had inflated hopes).  

  #### **Step 4: Reconcile IV vs. OV (5 mins)**
    - **Compare:** Calculate the difference: `|IV – OV| / OV`.  
    - **Decision rules:**  
      - **If difference ≤ 15%:** Use the **(IV + OV) / 2** as your budget. (They agree enough.)  
      - **If IV < OV (you’re optimistic):** Use **OV** as the budget. (Protects against overruns.)  
      - **If IV > OV (you’re pessimistic):** Use **IV** as the budget. (Avoids underspend penalties.)  
        - *Exception:* If IV > OV *and* you have a **pre-specified, testable reason** (e.g., "Venue costs up 30% in 2023"), use IV.  
    - **Allowed reasons to deviate from OV:**  
      - Must be **causal** (not correlational).  
      - Must be **quantifiable** (e.g., "Inflation raised catering 10%").  
      - Must be **recorded pre-reconciliation** (from Step 1).  
    - **Post-hoc reasons?** Reject them. If you catch one post-OV, flag it for committee review (Step 5).  

  #### **Step 5: Set Contingency & Flag for Committee (5 mins)**
    - **Contingency calculation:**  
      - Calculate the **average absolute error** of your reference class: `|Planned – Actual| / Planned` for each event.  
      - Contingency = **MAX(10%, average error)** of your reconciled budget. (10% floor for stability.)  
    - **Total budget request:** Reconciled budget + contingency.  
    - **Flag for committee if:**  
      - Total request exceeds your term’s allocation.  
      - You overrode OV due to a post-hoc reason.  
      - The event is high-stakes (e.g., conference) and either:  
        - Contingency >25%, or  
        - You used other societies' unverified data.  
    - **Values calls:** The procedure flags these—committee decides on tradeoffs (e.g., "Run conference smaller?").

  #### **Step 6: Document for Next Time**
    - Add this event to your database—even if not run.

  ---

  ### **Key Features Addressing Your Stuck Points**
  - **Stops reference-class shopping:** You define the class *before* calculating OV (Step 2).  
  - **Handles partial base rates:** Regress *components* with data (e.g., catering); use IV for unknowns but flag them.  
  - **Corrects for rosy base rates:** Including non-run events and applying penalties (Step 3) counters historical optimism.  
  - **Limits rationalization:** Only pre-specified, testable reasons let you deviate from OV (Step 4).  
  - **Deals with novel events:** Other societies' plans are allowed but penalized—no cherry-picking.

  ---

  ### **Run Through Your Three Events**
  *Assumptions:*
  - Your society’s historical average error: **+25%** (typical planning fallacy).  
  - Contingency floor: **10%**.  
  - Other societies' data penalty: **+20%**.  

  #### **(1) Careers Fair** (4 runs; you expect slightly above average)  
    - **Step 1 (IV):** $10,000 (e.g., venue $4K, catering $6K for 300 people).  
    - **Step 2 (Class):** "All past careers fairs" (4 events). Median actual cost = $9,500.  
    - **Step 3 (OV):** $9,500.  
    - **Step 4 (Reconcile):**  
      - IV ($10,000) vs. OV ($9,500): Difference = +5.3% (<15%).  
      - Use **($10,000 + $9,500)/2 = $9,750**.  
      - *Your "above average" reason was in IV—no further adjustment.*  
    - **Step 5 (Contingency):**  
      - Avg error for careers fairs: 12%. Contingency = MAX(10%,12%) × $9,750 = $1,170.  
      - Total request: **$10,920**.  
      - No flags.  

  #### **(2) Hackathon** (Never run; only other societies' *planned* budgets)  
    - **Step 1 (IV):** $5,000 (based on quotes).  
    - **Step 2 (Class):** "Other societies' hackathons" (3 events). Median *planned* = $4,000.  
    - **Step 3 (OV):** Apply +20% penalty → $4,000 × 1.20 = **$4,800**.  
    - **Step 4 (Reconcile):**  
      - IV ($5,000) vs. OV ($4,800): Difference = +4.2% (<15%).  
      - Use **($5,000 + $4,800)/2 = $4,900**.  
    - **Step 5 (Contingency):**  
      - No error data → Use default 20% (since OV based on plans).  
      - Contingency = 20% × $4,900 = $980.  
      - Total request: **$5,880**.  
      - **Flag for committee:** "OV based on unverified external plans; high uncertainty."  

  #### **(3) Conference** (High-stakes; you’re over-optimistic)  
    - **Step 1 (IV):** $15,000 (e.g., "Keynote speaker will draw 400 people!").  
    - **Step 2 (Class):** "All our conferences" (3 run, 1 abandoned). Median actual for run events = $18,000.  
      - *Include non-run event?* Yes → Actualized OV: Apply -15% attendance penalty to IV’s headcount.  
    - **Step 3 (OV):** $18,000 (ignoring IV’s attendance boost—no causal proof pre-reconciliation).  
    - **Step 4 (Reconcile):**  
      - IV ($15,000) vs. OV ($18,000): Difference = **20% (>15%)**.  
      - Since IV < OV (you’re optimistic), use **OV: $18,000**.  
      - *Your "half-promised" reason is post-hoc—rejected.*  
    - **Step 5 (Contingency):**  
      - Avg error for conferences: 22%. Contingency = MAX(10%,22%) × $18,000 = $3,960.  
      - Total request: **$21,960**.  
      - **Flag for committee:**  
        - "Total request 46% > IV. Risk: Overrun eats into next term. Options: Reduce scope (e.g., 300 attendees), seek extra funding, or cancel."  
        - *This is a values call—committee weighs goodwill vs. risk.*  

  ---

  ### **What This Procedure Can’t Do (Limits & Judgment Dressed as Procedure)**
  - **Can’t create data from nothing:**  
    - Novel events (e.g., hackathon) lean on weak external data—procedure flags this but can’t fix it.  
  - **Judgment in disguise:**  
    - Step 2 (class definition) is subjective but bounded by rules.  
    - Step 4 (allowable reasons) relies on you being honest pre-reconciliation.  
  - **Silent on:**  
    - **Revenue estimates:** Use same process but with attendance-driven revenue.  
    - **Black swans:** E.g., "Speaker cancels last minute" isn’t quantified—cover via contingency.  
    - **Inter-event dependencies:** E.g., "If hackathon flops, conference suffers." Committee must decide.  

  ---

  ### **Where the Procedure Might Fail (and When to Override It)**
  - **Likely failure points:**  
    1. **Sparse data:** If <3 events in class, OV becomes noise. *Override by:* Using IV + 30% contingency.  
    2. **Systemic shifts:** E.g., COVID-era data inflates errors. *Override by:* Using only post-2022 data.  
    3. **False precision:** Line-item regressions (e.g., catering) may miss big-picture bias.  
  - **"Just use your inside view" if:**  
    - You have **verified, real-time data** (e.g., sold-out pre-sales for 80% of seats).  
    - The event is **tiny** (<5% of term budget)—optimism won’t break anything.  
  - **What would change my mind about RCB:**  
    - If your society **systematically beats forecasts** (e.g., actuals average 10% below plans), remove the OV penalty.  
    - If **non-run events are irrelevant** (e.g., you only cancel due to external shocks like floods), stop including them.  

  ---

  ### **Final Advice**
  - **Track your calibration:** Add a column to your database for "RCB forecast vs. actual." If errors persist, adjust penalties (e.g., if you still overrun, increase contingency).  
  - **Empower your committee:** Walk them through one example. Focus on: "This flags when *we* can’t decide—so *you* make the call."  
  - **Time saver:** Pre-calc reference-class medians/errors in your database.  

  This turns "be aware of bias" into a checklist. It won’t eliminate judgment—but it forces it into the open. For your conference, the math is brutal because the procedure *should* be: it’s shouting that your inside view is untrustworthy. Better to confront that now.
