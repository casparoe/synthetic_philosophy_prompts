prompt: |-
  I want a specification, not a survey: the requirements an account of individual obligation under the inefficacy objection has to meet, each with the case or consideration that is supposed to motivate it.

  Fix the purpose first. The account is to do two jobs at once: first-personal deliberation — what should I do about my own emissions, my own meat purchases, my own vote, given that none of them will make a perceptible difference to anything — and third-personal assessment — what we may blame, criticise, or demand of others. Say whether one account can serve both jobs, or whether the two uses pull the requirements apart; I suspect they do, and I want that made explicit rather than smoothed over.

  Below are the candidate requirements I keep coming back to. Tell me which are genuine desiderata, which are only the prejudices of one camp, and which are jointly unsatisfiable. Distinguish the non-negotiable ones from the optional ones, and keep each entry to a case plus a sentence of justification.

  1. Nullity versus negligibility. Whether the account has to separate strict zero expected difference, under the agent's best model of the mechanism, from positive but imperceptible expected difference. My worry: since the agent is uncertain about the mechanism, and any nonzero credence that a threshold is close to her, or that her purchase is recorded in a demand-forecasting system that responds in lumps later, already makes expected difference positive, the inefficacy objection may only ever establish negligibility.
  2. The unit of evaluation. Act-token, standing policy, annual budget, or whole life — and what turns on the choice, given that imperceptible contributions aggregate intrapersonally when the mechanism is continuous with total input, but do not when it is lumpy or threshold-shaped.
  3. The baseline for abstention as replacement rather than omission: money not spent on beef is spent on chicken, the hour not spent voting is spent somehow; and offsetting is a different case from abating.
  4. Overdetermination kept separate from thresholds: two independently sufficient presses, versus many contributions each insufficient on its own.
  5. Open membership: what the account says when the set of contributors is not fixed independently of each contributor's own decision, since the standard fixed-number symmetric case makes pivotalness vanish in a way an open-number case may not.
  6. Mediated effects — influence on other people's acts, on institutional records of demand, on the agent's own future motives — whether they count at all, and how they are to be bounded for an agent who cannot compute them.
  7. Criterion versus decision procedure: whether the account must be usable by someone of ordinary epistemic limits, or whether stating the right-making features is enough.
  8. Moral remainder: room left for criticising the agent who makes no difference but is glad she would have, and for the one who abstains for purely self-regarding reasons.

  Finally, flag any pair of requirements you think cannot both be satisfied — that is the part I most want — and identify the single requirement that, if dropped, would let through the largest family of accounts. Score the familiar families by type rather than by author — expected-difference accounts, complicity or membership accounts, collective-duty and joint-action accounts — in a short table if it is useful, but keep the weight on the criteria. I will add the citations myself.
reasoning: |-
  Hmm, the user wants a specification for an account of individual obligation under the inefficacy objection. They're clear that they don't want a survey of existing theories but a set of requirements such an account must meet. The purpose is twofold: first-personal deliberation (what should I do?) and third-personal assessment (what can we blame others for?). The user suspects these two uses might pull in different directions and wants that tension made explicit.

  The user has listed eight candidate requirements they're considering. I need to evaluate each as either a genuine desideratum, a camp prejudice, or possibly unsatisfiable when combined with others. I should also identify non-negotiable vs optional requirements, keep each entry brief with a case-based justification, and flag any conflicting pairs.

  Looking at requirement 1 about nullity vs negligibility: This seems genuine. The key case is uncertainty - even small credence in threshold proximity or demand-forecasting systems makes expected difference positive. This undermines strict zero-difference claims, turning inefficacy into negligibility. Important for first-personal deliberation where epistemic limitations matter.

  For requirement 2 on unit of evaluation: Also genuine. The choice matters because continuous mechanisms (like climate change) allow intrapersonal aggregation of small effects, while lumpy mechanisms (like electoral thresholds) don't. First-personal deliberation might focus on acts, while third-personal assessment might look at patterns.

  Requirement 3 about baselines: Non-negotiable. The beef/chicken substitution case shows abstention isn't omission but replacement - money saved gets spent elsewhere. Essential for accurate causal modeling but often overlooked in popular discourse.

  Requirement 4 on overdetermination vs thresholds: Genuine but sometimes conflated. The two-presses case (independently sufficient causes) differs structurally from threshold cases (many insufficient causes). Both create inefficacy but may warrant different moral responses, especially in third-personal blame.

  Requirement 5 on open membership: Crucial and often underappreciated. In voting or boycotts with variable participants, an agent's participation can influence others' decisions, creating network effects absent in fixed-number cases. Vital for realistic modeling.

  Requirement 6 on mediated effects: Genuine but problematic. The vegetarian influencer case shows these effects matter morally but are epistemically inaccessible. Creates tension between criterion (should include) and decision procedure (can't compute).

  Requirement 7 on criterion vs decision procedure: This reveals the core tension between the two purposes. First-personal deliberation needs computability (decision procedure), while third-personal assessment can handle idealized criteria. They likely require different accounts.

  Requirement 8 on moral remainder: Genuine for third-personal assessment. Cases like the regretless meat-eater or self-interested abstainer show attitudes matter beyond consequences. But this may be optional for first-personal focus on action-guiding rules.

  Now for conflicts: The biggest clash is between computability (requirement 7) and mediated effects (requirement 6) - we can't have accounts that fully incorporate unbounded ripple effects while remaining usable. Also between first-personal computability and third-personal completeness more broadly. This suggests the two purposes might need separate accounts.

  If I had to drop one requirement to allow more accounts through, mediated effects (6) would be the candidate, as its inclusion makes deliberation impossible. But this comes at the cost of moral accuracy.

  For scoring account types: Expected difference accounts struggle with computability and lumpy cases. Complicity accounts handle open membership well but can be vague. Collective duty accounts work for third-personal assessment but fail first-personal deliberation. Joint action accounts are promising but institutionally demanding.

  The key takeaway is recognizing that first-personal deliberation needs computable heuristics (possibly sacrificing accuracy), while third-personal assessment can use more nuanced criteria. Trying to force one account to do both likely leads to failure on one front.
answer: |-
  Here is a specification of requirements for an account of individual obligation under the inefficacy objection, structured by your criteria. The core tension between first-personal deliberation (FPD) and third-personal assessment (TPA) is explicit throughout. Conflicts are flagged, and a summary table scores major account types against the non-negotiable requirements.

  ---

  ### **Non-Negotiable Requirements** (Genuine Desiderata)
  These are essential for any adequate account; failure here renders the account unfit for core purposes.

  1.  **Nullity vs. Negligibility Distinction**  
      **Case:** Agent unsure if beef purchase triggers a restocking threshold vs. contributing to smooth demand.  
      **Justification:** Accounts *must* distinguish strict causal nullity (objectively zero difference) from negligibility (positive but imperceptible expected difference), as FPD requires handling uncertainty, while TPA needs precision to assign blame fairly. *Conflict Alert:* Satisfying both FPD and TPA is strained here; FPD agents struggle with uncertainty, TPA demands objective grounding.

  3.  **Baseline Specification (Replacement, not Omission)**  
      **Case:** Money saved by not buying beef buys carbon-intensive chicken instead, or is invested in fossil fuels.  
      **Justification:** Abstention *always* frees resources for alternative acts; accounts *must* specify the counterfactual baseline to avoid false claims of "harm reduction". Non-negotiable for accurate causal modeling in both FPD and TPA.

  5.  **Open Membership Handling**  
      **Case:** Joining a boycott signals commitment, encouraging others (dynamic group size), unlike a fixed-number toxin dump.  
      **Justification:** Accounts *must* address cases where an agent’s participation influences others’ actions/decisions, as this is pervasive (voting, protests, markets) and pivotalness can persist. Vital for both FPD (motivating participation) and TPA (assessing symbolic acts).

  7.  **Criterion/Decision Procedure Distinction**  
      **Case:** An ideal criterion includes unbounded ripple effects (e.g., vegetarian influencing friends), but no real agent can compute this.  
      **Justification:** *FPD requires a usable decision procedure* (simple heuristics, rules of thumb); *TPA requires a criterion* (objective moral truth). **Core Conflict:** One account cannot optimally serve both; FPD prioritizes computability, TPA prioritizes comprehensiveness.

  ---

  ### **Genuine but Negotiable Requirements**
  Important for adequacy but some accounts may reasonably deprioritize one, given trade-offs.

  2.  **Unit of Evaluation Flexibility**  
      **Case:** Annual CO₂ budget matters for climate change (continuous), but single votes don’t for large-electorate thresholds (lumpy).  
      **Justification:** Accounts should specify the evaluative unit (act, policy, life) *depending on the mechanism's aggregation logic*, as FPD needs coherence across acts, while TPA targets patterns.

  4.  **Overdetermination vs. Threshold Separation**  
      **Case:** Two independently sufficient poisoners (overdetermination) vs. 1,000 needed to trigger a toxin release, with 1,001 contributing (threshold).  
      **Justification:** Accounts *should* treat these differently, as overdetermination negates causal responsibility, while thresholds retain moral taint. More urgent for TPA (blame assignment) than FPD (deliberation).

  6.  **Mediated Effects Acknowledgment (but bounded)**  
      **Case:** Buying meat normalizes consumption (influencing others), but tracking this is epistemically impossible for FPD.  
      **Justification:** Accounts *should* recognize mediated effects exist and matter morally (TPA), but *must* bound them for FPD usability (e.g., limit to foreseeable, proximate influences). *Conflict Alert:* With Requirement 7; unbounded mediation wrecks FPD.

  8.  **Moral Remainder (Attitudinal Assessment)**  
      **Case:** Agent who emits excessively but regrets it vs. one who abstains solely to save money, both with null individual impact.  
      **Justification:** Accounts *should* allow TPA to criticize/praise attitudes (e.g., complicity, integrity) beyond causal difference, but this is secondary for FPD action-guidance.

  ---

  ### **Conflict Analysis & Key Trade-offs**
  - **Fundamental Conflict:** **Requirement 7 (Criterion vs. Procedure)** creates irreconcilable tension. FPD *requires* bounded computability; TPA *requires* unbounded moral accuracy (e.g., including all mediated effects). One account cannot optimize both.
  - **Major Unsatisfiable Pair:** **Requirement 6 (Mediated Effects) + Requirement 7 (FPD Usability)**. Full inclusion of mediated effects (demanded by TPA) makes deliberation impossible (violating FPD). *Dropping Requirement 6* allows the largest family of FPD-viable accounts (e.g., rule-based or threshold-proximity heuristics), at the cost of TPA moral depth.
  - **Secondary Conflict:** **Requirement 1 (Nullity vs. Negligibility) + Requirement 5 (Open Membership)**. Distinguishing nullity requires fixed-group models, but open membership dissolves strict nullity by introducing influence effects. Favors treating nearly all cases as *negligible* for FPD, while TPA can insist on case-by-case nullity checks.

  ---

  ### **Account Family Scoring (Against Non-Negotiables)**
  | **Account Type**               | **Nullity/Negligibility (R1)** | **Baseline (R3)** | **Open Membership (R5)** | **Criterion/Procedure (R7)** | **Overall Viability**       |
  |-------------------------------|-------------------------------|-------------------|--------------------------|------------------------------|-----------------------------|
  | **Expected Difference (ED)**  | ❌ (Fails under uncertainty) | ❌ (Often omits)  | ❌ (Assumes fixed group) | ⚠️ (Criterion only; useless for FPD) | Poor: Fails R1, R3, R5. TPA-only. |
  | **Complicity/Membership**     | ⚠️ (Handles nullity via shared wrong) | ⚠️ (Vague on baselines) | ✅ (Excels at open groups) | ⚠️ (TPA-strong; FPD-weak if vague) | Moderate: Strong TPA, weak FPD. Needs R3/R7 work. |
  | **Collective Duty/Joint Action** | ✅ (Nullity irrelevant to duty) | ⚠️ (Group-focused, ignores individual baselines) | ✅ (Built for dynamic groups) | ❌ (FPD failure: no individual guidance) | TPA-Strong, FPD-Fail. Requires supplemental individual account. |
  | **Rule Consequentialism**     | ✅ (Negligibility → rule adherence) | ✅ (Rules incorporate baselines) | ⚠️ (Rules may not handle dynamics) | ✅ (FPD: rules; TPA: rule-optimization) | Best Fit: Meets R1,R3,R7. Needs R5 refinement. |

  **Key**: ✅ = Satisfies, ⚠️ = Partially/contextually satisfies, ❌ = Fails

  ---

  ### **Summary**
  - **Non-Negotiables:** R1, R3, R5, R7 (with R7 forcing a split between FPD and TPA).
  - **Most Liberating Drop:** **Requirement 6 (Mediated Effects)**. Omitting it enables computable FPD accounts (e.g., rule-based or threshold-focused) but weakens TPA moral accuracy.
  - **Core Tension:** FPD demands **bounded, computable decision procedures**; TPA demands **unbounded, accurate criteria**. This is irreconcilable within a single account. Hybrid or purpose-split solutions are necessary.  
  - **Recommendation:** Pursue distinct accounts: a **heuristic-based approach for FPD** (e.g., rules of thumb, policy evaluation) and a **criterion-based account for TPA** (e.g., complicity in collective harm, expressive wrongs). Forced unification sacrifices one purpose.
