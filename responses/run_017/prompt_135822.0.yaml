answer: |-
  ### Stress-Testing Turchin's Structural-Demographic Theory: A Map of Exposure  

  #### 1. Ranking of Defeaters  
  **Fatal Defeaters**  
  - **Decoupled Dynamics**: If *real wages stagnate or rise* during periods of intense intra-elite competition and state collapse, the core causal link between popular immiseration and systemic crisis is broken. *Example*: The Ming Dynasty’s 17th-century collapse saw plummeting real wages *and* elite overproduction, but if wages had sharply risen (as in post-Black Death Europe) while instability still peaked, the mechanism would be falsified.  
  - **Elite Competition Without Fiscal/Demographic Pressure**: Instability driven *solely* by exogenous shocks (e.g., the Thirty Years’ War) with no prior rise in aspirant elites or wage stagnation. If elite conflict erupts in periods of robust state finances, low elite numbers, and rising wages, the endogenous cycle is invalid.  

  **Serious Defeaters**  
  - **State Collapse Without Elite Overproduction**: If fiscal crises or administrative failure (e.g., Rome’s 3rd-century crisis) occur *before* any measurable rise in elite aspirants (e.g., stable senatorial ranks, no inflation of honours), the theory’s "elite overproduction" engine is undermined.  
  - **Recovery Without "Clearing" Mechanisms**: Societies rebound from instability *without* significant population decline, state restructuring, or elite thinning (e.g., post-Napoleonic Prussia stabilised via bureaucratic reform, not demographic contraction). This challenges the necessity of the cycle’s "reset" phase.  

  **Awkward Defeaters**  
  - **Mismatched Timing**: Key variables align but with *inconsistent lags*. If elite overproduction consistently *follows* popular unrest (e.g., French Revolution’s *parvenus* emerging *after* 1789), not precedes it, the causal sequence weakens.  
  - **Amplitude Discord**: Crises triggered by minor shocks (e.g., a small climate event) producing *disproportionate* instability, violating the theory’s expectation that endogenous pressures determine severity.  

  #### 2. Concessions from Defenders  
  Defenders concede:  
  - **Exogenous Triggers**: Shocks (plague, invasion) can *accelerate* crises but are not necessary; endogenous pressures alone suffice. The theory now asserts that *without* underlying structural pressures, shocks cause transient disruption, not secular collapse (e.g., the Antonine Plague strained but did not topple the robust Principate).  
  - **Fiscal Mechanism Softening**: Elite overproduction is prioritised as the "primary mover" in modern iterations, with fiscal distress often a *symptom* (e.g., state bankruptcy from elite tax resistance). The core claim remains: elite competition and popular immiseration *together* drive instability.  

  #### 3. Endogeneity vs. Shock-Driven Instability: Discriminating Patterns  
  - **Phase Relations**: Genuine endogeneity requires:  
    - Real wages decline → Elite numbers swell (+1–2 generations lag) → Fiscal strain → Unrest.  
    - *Falsifying pattern*: Unrest spikes *before* wage decline/elite expansion (e.g., if the English Peasants’ Revolt [1381] preceded Black Death labour shortages).  
  - **Amplitude Independence**: Endogenous theory predicts major instability *without* large shocks (e.g., the American Civil War, lacking major plague/famine). Shock-driven models cannot explain this.  
  - **Lag Structure**: Elite overproduction should peak *after* wage stagnation (as resources concentrate) but *before* fiscal collapse. If proxies (e.g., university graduates) surge during state bankruptcy, the sequence fails.  
  - **Settling Observation**: Instability recurring every 200–300 years in a polity with *no* major exogenous shocks (e.g., cyclical crises in isolated Tokugawa Japan). Shock models predict irregularity.  

  #### 4. The Measurement Problem  
  - **Proxy Flexibility Risk**: Using degree counts *or* office prices for elite overproduction allows ad hoc switching when one proxy fails (e.g., if degrees surge but office prices fall).  
  - **Constraining Proxies Principledly**: Pre-commit to:  
    - **Co-movement**: All elite proxies must correlate (e.g., degrees, titles, and lawsuits over status *all* rise together).  
    - **Non-Circularity**: Proxies must not directly measure instability (e.g., using "rebellion frequency" to gauge popular immiseration is invalid).  
    - **Thresholds**: Define "overproduction" quantitatively *ex ante* (e.g., >50% rise in elites per capita over 50 years). If no proxy meets threshold before a crisis, the theory fails.  

  #### 5. Confronting Modern States  
  - **US Case as Partial Defeater**: The 2020s instability featured elite competition (polarisation, surging law graduates) and wage stagnation, but *no* fiscal collapse (the state borrowed at record lows). This challenges the *fiscal mechanism* but not elite/popular dynamics.  
  - **Relocation Viability**: The theory can refocus on **intra-elite conflict** (e.g., zero-sum political warfare) and **popular immiseration** (stagnant real incomes, falling life expectancy) *without* state failure. However, this risks becoming "elite conflict theory," a weaker, non-cyclical framework. The distinctive *secular cycle* claim survives only if modern states still exhibit 200–300 year patterns (e.g., linking the US Civil War to 2020s unrest).  

  #### 6. Legibility-Lag Model vs. Structural-Demographic Theory  
  - **Core Conflict**: Legibility-lag predicts stability in high-capacity states (e.g., modern Denmark) despite elite surplus/wage stagnation; structural-demographic expects instability regardless.  
  - **Discriminating Predictions**:  
    - **High-Resolution States**: Legibility-lag asserts no fiscal crisis occurs with automated tax systems (e.g., Sweden’s 30% elite unemployment causing no unrest). Structural-demographic expects unrest if elites turn to zero-sum competition.  
    - **Colonial Cases**: Where legibility *collapses* (e.g., Spain’s 17th-century empire struggling to assess New World silver flows), both models predict crisis. But where legibility *improves* during stagnation (e.g., British grain price data during 1790s immiseration), structural-demographic still predicts unrest; legibility-lag does not.  
  - **Exposure Assessment**: Legibility-lag is *more exposed*—it fails if high-capacity states implode (e.g., algorithmic taxation but Weimar-style elite fragmentation). Structural-demographic is more adaptable but vaguer on *how* elites cause crisis without fiscal triggers.  

  #### 7. Verdict on Insulation  
  - **Accommodation Capacity**: The theory *can* absorb anomalies by:  
    - Invoking "exogenous shocks" for timing mismatches.  
    - Redefining "elites" (e.g., shifting from aristocrats to credential holders).  
    - Stretching cycle length (e.g., 150–400 years).  
  - **Fatal Plasticity?** It risks unfalsifiability if all counterexamples are dismissed as "incomplete cycles" or "noise." Yet its core appeal—quantitative predictability—requires *testable* cycles. **Conclusion**: The theory is falsifiable *only* if adherents pre-specify:  
    - **Phase sequence and lags** (e.g., elite peaks must lead unrest by 10–30 years).  
    - **Thresholds** for "overproduction" and "immiseration."  
    - **A polity where cycles should *not* occur** (e.g., small mercantile republics like Ragusa).  
    Without this, it becomes a heuristic, not a predictive model. Its value then hinges on organising complex histories into coherent patterns—even if not strictly causal.  

  ### Final Assessment  
  Your null hypothesis (shock-driven instability) is the sharpest challenge. **Discriminating evidence**:  
  - **No-Shock Crises**: If instability recurs without shocks (e.g., 19th-century US sectional strife), endogenicity gains.  
  - **Phase Alignment**: Real wages must *lead* elite numbers, which *lead* state failure. Ottoman 16th-century data (wages fall → military titles inflate → fiscal decay) supports this; Habsburg Spain (bankruptcy before elite surge) does not.  
  - **Proxy Consensus**: If stature, wages, *and* grain prices *all* show immiseration before elite proxies rise, the case strengthens.  

  The theory survives as a *qualified* heuristic: elite competition + popular distress = high instability risk. Its predictive power, however, depends on resisting ad hoc adjustments to phase and proxy choices. Modern states may have severed the fiscal link, but not yet the elite-popular tension—making the next 50 years a decisive test.
