prompt: |-
  I'm on the grants committee of a small family foundation and I need some help before Thursday, because I've been going in circles on this for two weeks and I still don't know what I think. We have to pick one of six programs. They all cost the same and they all run for about sixty years. Our staff built a table: for each program they estimate (a) how many people will be alive in the region over that period who owe their existence, or at least their level of wellbeing, to the program, (b) the average quality of life of those people on a 0–100 index their team put together, where 0 is "a life nobody would choose to start" and 50 is "clearly worth living but nothing special," and (c) the sum of the two, i.e. the total. Program 1: 1,000 people at an average of 90. Program 2: 1,500 at 80. Program 3: 2,200 at 70. Program 4: 3,200 at 60. Program 5: 5,000 at 50. Program 6: 9,000 at 35. The totals rise at every step and the averages fall at every step, and mechanically each program works by taking the previous one, adding a lot of people through maternal-health and housing work, and then spreading the money a bit more thinly — so the people who were already there end up somewhat worse off than they would have been under the program before it.

  One member, Marco, says the choice is obvious and we should go straight to 6: every step adds real happiness that wouldn't otherwise exist and subtracts less than it adds, so each program is an improvement on the one before it, and if I disagree I have to name the exact step where it goes wrong and say what's different about that step compared to its neighbours. I can't do that, because any line I draw between two adjacent programs looks totally arbitrary to me. Then Priya makes a slightly different point about the extra people: the ones who exist at step 6 wouldn't have existed at all under program 1, so nobody is being traded away for anybody else, and once they're here they'll be glad to be alive and would vote to keep the program going. But I still can't get myself to say that program 6 is a better outcome than program 1, which is a thousand people living genuinely excellent lives. And if I go by the averages instead, program 1 wins — except someone pointed out that on that logic the best possible outcome would be a single person living a perfect life, which is crazy too. There's one more wrinkle: the 35 in program 6 is a mean with a wide spread, so a real number of those lives would land below zero, meaning not worth living at all. Maybe that's my reason to stop earlier? Except I don't think it is, because if the staff came back and said the spread was tiny I'd feel exactly the same way, and I don't want to hide behind a statistics complaint.

  So: is there a principled way to think about this that isn't just "add everything up" or "take the average"? If the principled thing is to refuse one of the steps, which one, and what makes that step different from the ones around it? And practically — what do I actually say at the meeting, because Marco is definately going to ask me which step I'm rejecting and I need something better than "the end result feels bad." I should say the numbers are soft and i'm not wedded to them, so if the right way to think about it doesn't turn on the exact figures, that's even better.
reasoning: |-
  Okay, the user is on a grants committee for a family foundation and needs to decide between six programs. They're stuck because each program increases the total well-being but decreases the average. Marco argues for Program 6, saying each step adds more happiness than it subtracts. Priya adds that the extra people in Program 6 wouldn't exist otherwise, so no one's losing out. But the user feels uneasy about choosing a program where lives might not be worth living, even though the average is 35.

  First, I need to understand the core dilemma. The user is torn between total utilitarianism (maximizing total well-being) and average utilitarianism (maximizing average well-being). But both have flaws: total utility could justify overpopulating with barely worthwhile lives, while average could lead to preferring a single perfect life. The user needs a middle ground that avoids arbitrariness.

  The mention of lives below zero in Program 6 is crucial. Even if the spread is small, the existence of lives not worth living is a moral red line. But the user says they'd feel the same without that issue, so it's deeper. They need a principle that justifies stopping before Program 6 without drawing an arbitrary line.

  Possible approaches: lexical thresholds, person-affecting views, prioritarianism, or sufficientarianism. Lexical thresholds set a minimum quality of life below which lives shouldn't be created, addressing the non-identity problem. This avoids arbitrariness by setting a clear boundary. If Program 6 has lives below zero, that's a strong reason to reject it. But the user wants a principle that works even without negative lives.

  Sufficientarianism focuses on ensuring lives meet a "good enough" threshold. The 0-100 scale helps here. The user mentioned 50 as "clearly worth living but nothing special." Setting a threshold at, say, 50 or 60 could prioritize bringing people above that line. But in Program 5, everyone is at 50, which is acceptable, but Program 6 drops to 35. So Program 5 might be the last where all lives are above the threshold.

  The non-identity problem is key. Priya argues the extra people in Program 6 aren't harmed by being born since they wouldn't exist otherwise. But creating lives below a certain quality might still be wrong. The user needs to counter this by emphasizing that creating lives below a minimum threshold is impermissible, even if those individuals aren't worse off.

  Practical advice for the meeting: The user should reframe the decision not as rejecting a step but setting a minimum standard. Point out that beyond a certain point, adding more people at lower averages compromises the foundation's mission to ensure flourishing lives. Marco's challenge about which step fails can be met by showing that Program 6 crosses a clear line where some lives aren't worth living, making it unethical.

  Also, emphasize that the foundation's role isn't just to maximize but to ensure dignity and worthwhile lives. Programs 1-5 keep averages above 50, but Program 6 drops to 35. Even if the spread is small, the risk of lives below zero is unacceptable. This isn't arbitrary; it's a principled stand against creating suffering.

  In conclusion, the user can advocate for Program 5 by setting a threshold at 50. This avoids the extremes of total or average utilitarianism and aligns with the foundation's values. At the meeting, they should focus on the ethical implications of creating lives that may not be worth living and define a minimum standard for quality of life.
answer: |-
  You've hit on one of the thorniest problems in ethics: the **Repugnant Conclusion** (coined by philosopher Derek Parfit). Marco's argument leads to Program 6, where a vast number of lives barely worth living outweighs a smaller number of excellent lives. Your gut feeling that this is wrong is shared by many philosophers. Priya's "non-identity problem" (these extra people wouldn't exist otherwise) makes it even harder. Here's a principled way out and a practical script for the meeting.

  **The Core Problem & Why "Just Add" or "Just Average" Fails:**

  1.  **Total Utilitarianism (Marco's View):** "Maximize total well-being." Leads to Program 6. Problem: It implies creating masses of lives barely above "worth living" is better than fewer excellent lives, which feels repugnant. It also ignores distribution and the risk of lives below zero.
  2.  **Average Utilitarianism:** "Maximize average well-being." Leads to Program 1. Problem: It implies a world with one supremely happy person is better than a world with billions of very happy people, which is also repugnant. It discourages creating new happy lives if they lower the average slightly.

  **Principled Alternatives (Avoiding Arbitrary Lines):**

  The goal is to find a view that values both *quality* and *quantity* without collapsing into either extreme. Here are the strongest contenders given your dilemma:

  1.  **Lexical Thresholds / Critical-Level Utilitarianism:**
      *   **Principle:** Lives above a certain "sufficient" quality level contribute positively to the total. Lives *below* a certain "minimally acceptable" level (especially below 0) contribute *negatively* or are considered a harm to create. Lives between these levels might contribute less or be neutral.
      *   **Applying it:** This directly addresses Program 6's "wide spread below zero." Creating lives below 0 is *actively bad*, even if they wouldn't otherwise exist. The harm of creating those lives (and the ethical responsibility for their suffering) *outweighs* the benefit of adding lives above 0 but below the "sufficient" level. Program 6 crosses this critical line. Programs 1-5 avoid creating lives below 0 (assuming their spreads are managed).
      *   **Why it's not arbitrary:** The line isn't drawn between adjacent programs arbitrarily; it's drawn at the *moral threshold* of "a life worth starting." Below zero is definitionally harmful. This is a fundamental ethical boundary, not a convenience.
      *   **Addressing Priya:** Yes, the people below zero in P6 wouldn't exist otherwise. But *creating* a life of net suffering is wrong, regardless of the non-identity problem. We have a duty not to create miserable lives. Their hypothetical future "gladness" is irrelevant if their life is *objectively* not worth living (0 or below).
      *   **Where to stop?** Programs 1-5 are all viable under this view, as they don't create lives below zero. You then need a secondary criterion (see below) to choose between them.

  2.  **Person-Affecting Prioritarianism (or Sufficientarianism Lite):**
      *   **Principle:** Our primary duty is to improve the lives of existing or *foreseeable* people, especially the *worst off*. We should prioritize benefiting those who are badly off or who fall below a "sufficiency" threshold (e.g., 50 - "clearly worth living but nothing special"). Creating new lives above sufficiency is a *secondary* good.
      *   **Applying it:** Focus on the *existing population* guaranteed to exist in the region over 60 years regardless of which program you pick. While the programs affect *who* exactly exists, the core need (e.g., maternal health, housing) exists regardless. Prioritize lifting the *foreseeable worst-off* above a sufficiency threshold (e.g., 50). Program 6 creates many lives *below* sufficiency (avg 35, spread) and potentially harms the original cohort significantly. Programs like 3 (70), 4 (60), or 5 (50) ensure a higher baseline for the foreseeable population.
      *   **Why it's not arbitrary:** The line is drawn at the ethical priority of *preventing suffering and ensuring basic sufficiency* for those who will exist, over the *creation* of additional lives that might be mediocre. It shifts focus from sheer numbers to the condition of the worst off we are responsible *to*.
      *   **Addressing Priya:** While the *specific* extra people in P6 wouldn't exist under P1, the foundation's mandate is to improve the lives of people *within the region*. Creating a large population living mediocre or bad lives doesn't fulfill the spirit of "improving wellbeing" as well as ensuring a smaller population lives genuinely good lives. The "vote" argument ignores that those in P6 with lives below 50 (or below 0!) might *not* be glad, or might simply be making the best of a bad situation they had no choice in.

  **Choosing Between Programs 1-5 (if using Lexical Threshold):**

  If you reject Program 6 on the basis of the lexical threshold (lives below 0), you still need to choose between Programs 1-5. Here, a combination of "soft" factors and secondary principles helps, avoiding the extremes:

  *   **Diminishing Marginal Value of Quantity:** Adding 500 people (P1->P2) when going from 1000 to 1500 (+50%) feels more significant than adding 1800 people (P5->P6) when going from 5000 to 9000 (+80%), *especially* if the quality drop per additional person accelerates. P1->P2: Quality drops 10 points for +500 people. P4->P5: Quality drops 10 points for +1800 people. Is the *rate* of quality decline acceptable relative to the gain? P3 (2200 @70) or P4 (3200 @60) might represent a "sweet spot" before the quality decline steepens relative to the quantity gain.
  *   **The "Clearly Worth Living" Threshold (50):** Program 5 (5000 @50) ensures *everyone* reaches the "clearly worth living" baseline. This has strong intuitive appeal – no one is left with a life that's merely tolerable. Prioritizing lifting people *to* sufficiency is often seen as a core moral duty.
  *   **Mission & Values of the Foundation:** Does your foundation prioritize creating *excellence* (P1), ensuring widespread *basic dignity and sufficiency* (P5), or a balance (P2-P4)? Is the goal to maximize impact, transform lives, or prevent suffering?
  *   **Sustainability & Risk:** A higher average (P1-P3) might be more resilient to unexpected shocks or funding fluctuations over 60 years than a program stretched very thin (P5, P6). Program 6's low average and wide spread indicate significant fragility and risk of negative outcomes.

  **Practical Script for the Meeting (Focusing on Rejecting P6 & Arguing for P4/P5):**

  "Thank you, Marco and Priya, for pushing us to think rigorously. My hesitation about Program 6 isn't arbitrary discomfort; it stems from a fundamental ethical principle I believe our foundation should uphold: **We have a duty not to create lives that are not worth living, and we should prioritize ensuring lives meet a basic threshold of sufficiency.**

  1.  **The Critical Line:** Program 6 explicitly risks creating lives *below zero* on our scale – lives of net suffering. Staff confirmed the wide spread. Creating such lives is an active harm we cannot justify, regardless of the 'non-identity problem' or the total sum. This crosses a clear ethical red line. The harm of creating those suffering lives outweighs the benefit of adding lives at 35. *This is why Program 6 is unacceptable.* It fails on the most basic level: preventing misery. (If challenged: "Would we fund a program that *only* created lives at 35 with a known number below zero? I hope not. The principle holds even when bundled with positive effects.")
  2.  **Beyond the Critical Line:** This principle eliminates Program 6. Now, choosing between Programs 1-5 is still challenging, but it avoids the repugnant conclusion. While Marco argues each step is an improvement, the *rate* of quality decline relative to quantity gain increases, and the *nature* of the lives created changes significantly. Moving from P4 (3200 people at 60 – a decent life) to P5 (5000 at 50 – the bare minimum for 'clearly worth living') adds 1800 people but drops the average by 10 points. Is the gain of adding those 1800 lives *at the very minimum acceptable level* worth the decline in quality for the 3200 who could have had better lives?
  3.  **A Principled Balance - Sufficiency & Scale:** Given our mission, I propose we prioritize **ensuring lives meet the 'clearly worth living' threshold (50) while maximizing the number of people brought to or above that level.** Program 5 (5000 at 50) achieves this perfectly: *every single person* whose existence depends on our grant will have a life unambiguously worth living. This avoids the extremes of a tiny elite (P1) or masses at marginal levels (P6). It represents a massive positive impact (5000 lives secured at sufficiency) while upholding a minimum standard of dignity. Program 4 (3200 at 60) is also strong, offering a better-than-minimum life for a still very large number. However, Program 5 extends that sufficiency to 1800 more people.
  4.  **Recommendation:** Therefore, **I reject Program 6 on the ethical principle of not creating lives below zero and minimizing the risk of creating lives below sufficiency.** Among the viable options (1-5), **I recommend Program 5** as it maximizes the number of people guaranteed a life that is clearly worth living, aligning with our duty to ensure basic wellbeing for the people in this region we aim to serve. If the committee values a higher average quality more strongly, Program 4 is an excellent alternative."

  **Why this works:**

  *   **Directly Answers Marco:** You name the step (P6) and give a clear, non-arbitrary principle: **Don't create lives below zero / below a critical threshold of suffering.** The difference between P5 and P6 is *qualitative* (crossing the 'worth living' line) not just quantitative.
  *   **Addresses Priya:** You acknowledge the non-identity point but counter that creating suffering is wrong *per se*, and that ensuring sufficiency for the foreseeable population is a core duty.
  *   **Provides a Positive Choice:** Recommending P5 (or P4) uses a clear secondary principle (maximize lives above sufficiency) that feels intuitive and avoids the extremes. P5 is a compelling middle ground: massive scale (5000 people) with guaranteed basic dignity (50).
  *   **Leverages the Scale:** The jump from 5000 to 9000 is huge, but anchoring the justification on bringing those 5000 to the "clearly worth living" level makes it powerful.
  *   **Not Overly Reliant on Exact Numbers:** While the 0 and 50 points are used, the core arguments (preventing suffering, ensuring basic sufficiency, prioritizing foreseeable needs) hold even if the scale shifts slightly.

  This approach grounds your intuition in established ethical reasoning and provides a defensible, non-arbitrary framework for the committee's decision. Good luck on Thursday!
