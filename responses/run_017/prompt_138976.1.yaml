prompt: |-
  My supervisor has me write, for every case we read, whether the non-human thing in it counts as a "historical actor" or just background, and Im trying to reverse-engineer her rule. Her verdicts so far: Tambora going off in 1815 and the 1816 harvest failures across Europe — actor. The Little Ice Age taken as one big package — not an actor, just a backdrop. The potato blight in Ireland — an actor, though she'll insist that's still consistent with the famine being a British policy failure rather than a natural disaster. The malaria that kept the Roman campagna thinly settled for centuries — not an actor, because people had organised their whole year and their whole settlement pattern around it. The Dust Bowl drought — not an actor; the wheat economy is.

  My case is the one I'm writing now: a river delta where forty years of slow saltwater creep, made much worse by upstream dams a colonial government built, finally kills the rice crop in a single season and sets off mass out-migration. Is the salt an actor on her usage? I can see three rules that fit her verdicts about equally well — the thing has to be dateable and abrupt; or the thing has to force the outcome no matter what people did; or the thing gets demoted whenever a human arrangement is what actually made it lethal — and they don't all give the same answer here. Which do you think she's running, what would each of them say about my delta, and what single further case would tell them apart best? I care less about the final yes/no than about the rule and about where it breaks.
reasoning: |-
  Okay, let me tackle this user's problem. They need to reverse-engineer their supervisor's rule for determining whether a non-human thing is a "historical actor" or just background. The user provided several examples with the supervisor's verdicts and now has a specific case about a river delta affected by saltwater creep. 

  First, I need to analyze the given verdicts to identify patterns. Tambora's eruption in 1815 is an actor because it caused abrupt climate changes leading to harvest failures. The Little Ice Age, being a long-term climate period, is just background. The potato blight in Ireland is an actor, but the supervisor links it to British policy failure. Malaria in the Roman campagna isn't an actor because people adapted to it. The Dust Bowl drought isn't an actor; the wheat economy is. 

  Looking at these, three possible rules come to mind. Rule A focuses on whether the event is abrupt and dateable. Rule B considers if the event forced the outcome regardless of human actions. Rule C checks if human arrangements amplified the event's impact, making it a trigger rather than an actor. 

  For the delta case, saltwater creep over forty years with dams worsening it. Under Rule A, the slow creep isn't abrupt, so not an actor. Rule B: people built dams, so human actions contributed, so not an actor. Rule C: human dams amplified the salt's effect, so salt might be demoted to background. 

  The user needs a test case to distinguish these rules. A good case would be something like a slow geological process made catastrophic by human neglect. For example, a seawall deteriorating over decades that causes sudden flooding when ignored. Rule A would say no (slow process), Rule B yes (if neglect didn't cause it), Rule C no (human neglect made it lethal). 

  Considering the supervisor's emphasis on human factors in the potato blight and malaria cases, Rule C seems most consistent. The delta's salt isn't an actor because dams turned the slow process into a crisis. The test case with the seawall would clarify: if the supervisor calls the erosion an actor only if no human factors turned it lethal, confirming Rule C.
answer: |-
  Based on your supervisor's verdicts, she's almost certainly running **Rule C: The thing gets demoted whenever a human arrangement is what actually made it lethal.** Here's the breakdown:

  1.  **Rule A: Dateable & Abrupt?**
      *   *Fits:* Tambora (sudden eruption, dateable), Potato Blight (sudden outbreak, dateable).
      *   *Fits Verdicts:* Explains why Little Ice Age (long, diffuse) isn't an actor. Explains why Dust Bowl drought (relatively slow onset, part of a longer cycle) isn't an actor, while the *economic* shock ("wheat economy") might be seen as a more direct, human-caused "event".
      *   *Fits Less Well:* Malaria kept the campagna thinly settled – it *was* a constant, dateable presence with abrupt impacts (seasonal outbreaks), yet it's *not* an actor. This rule struggles here.
      *   **Your Delta (Rule A):** Salt creep was **slow (40 years), not abrupt.** The *crop failure* was abrupt, but the cause (salt) was gradual. **Verdict: NOT an Actor.** (Focuses on the salt creep itself).

  2.  **Rule B: Forces the Outcome No Matter What?**
      *   *Fits:* Tambora (couldn't be prevented, caused global effects regardless of local actions). Potato Blight (fungus spread uncontrollably once introduced).
      *   *Fits Verdicts:* Explains Little Ice Age (people *could* and *did* adapt locally over centuries, so not "forced"). Explains Malaria (people *organized around it*, mitigating its absolute lethality, adapting settlement).
      *   *Fits Less Well:* Dust Bowl drought – arguably, different farming practices *could* have mitigated its impact significantly. The supervisor blames the "wheat economy" (human arrangement), implying the drought itself didn't *force* the outcome; human choices did. Also conflicts subtly with her Potato Blight verdict – she insists it's consistent with British policy failure, implying policy *could* have mitigated the famine despite the blight. If the blight truly forced the outcome "no matter what," policy wouldn't matter.
      *   **Your Delta (Rule B):** Salt creep **did not force the outcome "no matter what."** Upstream dams (a human arrangement) **made it "much worse."** Without the dams, the salt creep might have been manageable or slower, not causing catastrophic failure and migration. **Verdict: NOT an Actor.**

  3.  **Rule C: Demoted When Human Arrangement Makes it Lethal**
      *   *Fits Perfectly:*
          *   **Tambora:** No human arrangement *caused* the eruption or *made* its climatic impact lethal in a specific way. It was an exogenous shock. **Actor.**
          *   **Little Ice Age:** People developed long-term adaptations (social, agricultural, economic) *in response* to it. It was the context for human arrangements, not an actor disrupting them. **Not Actor.**
          *   **Potato Blight:** The fungus is the actor *causing* the crop failure. However, her insistence it's consistent with British policy failure highlights that the *lethality of the famine* was caused by human arrangements (policy), *not* the blight itself (many places had blight without famine). The blight *acts*, policy makes it deadly. **Actor (for the crop failure), but policy failure explains the famine.**
          *   **Malaria:** Human arrangements (annual rhythms, settlement patterns) were *organized around* the malaria threat. Malaria wasn't an actor disrupting a system; it was a fundamental part of the system humans built within. **Not Actor.**
          *   **Dust Bowl Drought:** The *wheat economy* (human arrangement - monoculture, deep plowing on marginal land) is the actor that *made* the drought devastating. The drought itself was a recurring environmental factor that the human system catastrophically failed to withstand. **Not Actor (wheat economy is).**
      *   **Your Delta (Rule C):** The **salt creep itself is demoted.** While the physical process, its transformation into a catastrophic, lethal event was **caused by the "human arrangement" (the colonial upstream dams)** that disrupted the natural hydrological balance. The salt becomes the *mechanism* or *symptom* of the dam-induced change. The **dams (and the colonial policy/system behind them) are the historical actor** forcing the outcome. The salt is the background condition made lethal by human action. **Verdict: NOT an Actor.**

  **Conclusion on Supervisor's Rule:**

  Rule C provides the most coherent, consistent explanation for *all* her verdicts. It centers on **human agency and the construction of socio-ecological systems.** Non-human things are "actors" only when they act as *exogenous disruptors* to a relatively stable human system. If the non-human thing is a *background condition humans have already adapted to* (Little Ice Age, Malaria) or if its *lethality is primarily caused by a vulnerability created by human arrangements* (Dust Bowl drought vulnerability from wheat economy, Delta salt catastrophe from dams), it gets demoted to background. The human arrangement becomes the actor.

  **Test Case to Distinguish Rules:**

  A perfect test case is one where the *process is slow/continuous*, its *impact is potentially catastrophic but avoidable*, and *human action/inaction is the critical factor* turning it from background into crisis.

  *   **Case:** The slow subsidence of Venice over centuries due to natural geological processes and groundwater extraction. This becomes an acute crisis leading to the abandonment of ground floors only after a specific, predictable, but neglected event: a major storm surge (e.g., the 1966 flood) that overwhelmed deteriorating seawalls whose maintenance had been deferred due to political/funding disputes.
  *   **Distinguishing Predictions:**
      *   **Rule A (Dateable/Abrupt):** Focuses on the *storm surge*. It's dateable and abrupt. **Verdict: Actor.** The subsidence is background.
      *   **Rule B (Forces Outcome No Matter What):** Questions if the flood *forced* abandonment regardless of human action. If seawall maintenance *could* have prevented the flooding damage, then the flood didn't force the outcome "no matter what." **Verdict: Likely NOT Actor.** The subsidence and neglect are background/causes.
      *   **Rule C (Demoted by Human Arrangement):** Focuses on what made the surge *lethally disruptive*: the subsidence *combined with* deferred maintenance (human arrangement) weakening the defenses. The storm surge is the *trigger*, but the *lethality* comes from the human failure to maintain the system adapted to subsidence and storms. **Verdict: NOT Actor.** The deferred maintenance (human arrangement) is the actor; the storm and subsidence are background conditions.

  This case cleanly separates Rule A (which would call the surge an actor) from Rules B & C (which likely wouldn't). If your supervisor calls the storm surge an actor, she might be using Rule A. If she focuses on the deferred maintenance as the actor making the surge catastrophic, she's firmly in Rule C territory. Rule B might be ambiguous depending on how "forced" is interpreted regarding seawall efficacy.
