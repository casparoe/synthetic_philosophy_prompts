prompt: |-
  hey — you're a professional philosopher who works on population ethics and also actually knows population ecology (think: someone who's spent time with both the total/average view literature and with life-history theory). Please think carefully here and don't rush to a verdict: start by brainstorming a messy list of candidate requirements, then prune and merge, then write me the final spec. And please don't give me citations or a reading list — I'm somewhere without library access, and I'd rather have the conceptual work than references I can't check.

  I work adjacent to the habitat and conservation world, and I keep running into the same argument: most wild animals seem to live short lives full of starvation, parasitism, disease and predation, and in a lot of species most juveniles die before reproducing (the r-selected end of the spectrum: hundreds or thousands of offspring, of whom maybe two make it), so habitat destruction might actually reduce the total amount of suffering in the world by reducing how many animals get born into lives like that. The usual reply is that this doesn't work because a population knocked below carrying capacity just bounces back. I dont want to litigate the headline question yet — I want the spec first. Before I can trust anybody's estimate of the net welfare of an ecosystem, what does their account have to be able to do?

  So: give me the desiderata list. The cases it has to get right, the distinctions it must not collapse, the results from population biology and welfare biology it can't contradict, each with the motivating consideration behind it, and for each one say whether it's genuinely non-negotiable or just a prejudice of one camp (the total-vs-average business, whether suffering matters more than enjoyment or is just the symmetrical negative half, whether species and ecosystems have value over and above the sentient individuals inside them, whether we should count animals who never exist, and so on). A few things I think belong on the list and I want to see how you'd state them properly: (1) the headcount-vs-equilibrium point — a theory that just compares numbers of animals alive at a moment isn't measuring anything stable, and since the same patch of ground can settle into either of two alternative stable states (say a woodland regime versus a degraded, generalist-dominated one) with very different equilibrium population sizes and very different juvenile mortality rates, the account should be able to say which regime the landscape ends up in and roughly how long it stays there, including whether it flips back if the habitat is restored, rather than counting animals today; (2) replaceability — if the same two offspring survive either way, has anything been lost when the other 998 die young, and how does the answer change if those deaths are quick versus drawn out; (3) the interaction between average welfare and numbers, since a modest change in average welfare can easily swamp a big change in headcount, which means the whole thing turns on empirical questions about whether wild lives are net positive or net negative that we mostly can't answer yet; and (4) the fact that the animals alive during the clearance — the ones who get displaced, starve, or get eaten — are a different moral problem from the ones who are simply never born, and I want the theory to keep those separate instead of netting them out. Add whatever I'm missing. Then tell me which pair of desiderata you suspect can't be jointly satisfied (that's the part I most want to see, since it would mean the spec itself is a result), and which single requirement does the most work in knocking out the accounts people actually defend. A table is fine if it helps, but the reasoning behind each requirement matters more to me than scoring the contenders.
reasoning: |-
  Okay, the user is asking for a rigorous set of desiderata for evaluating ethical frameworks that assess the welfare impact of habitat destruction on wild animal populations. They're clearly deeply engaged with the tension between population ethics and ecology – mentioning r-selection, carrying capacity bounce-back, and alternative stable states. Their frustration with oversimplified "headcount vs suffering" debates is palpable.

  Hmm, they've already identified four key complexities: (1) dynamic equilibria vs snapshot welfare, (2) replaceability of juveniles, (3) welfare sign uncertainty, and (4) distinguishing direct harm from prevented existence. But they want me to systematize these into non-negotiable requirements while flagging irreconcilable tensions. The caveat about no citations is helpful – they're clearly in fieldwork or policy where theoretical purity must yield to practical constraints.

  First, I need to disentangle three layers: ecological realism (how systems actually behave), axiology (what counts as good/bad), and population ethics proper (how we aggregate welfare across possible populations). The user's "spec" demand suggests they've seen too many theories fail when confronted with, say, density-dependent mortality or hysteresis in habitat regimes.

  *Checks own biases*: I lean total utilitarian but their point about modest welfare changes swamping headcount effects is devastating. Also their insistence on separating direct killing from non-creation is ethically astute – conflating them justifies monstrous hypotheticals. 

  Major gaps in their list: 
  - Non-sentient environmental feedbacks (e.g., keystone species creating welfare-positive niches)
  - Intergenerational equity (current habitat loss permanently shifts future population trajectories)
  - Uncertainty propagation (we don't know welfare signs, so frameworks must handle ambiguity)

  The irreconcilable tension I foresee: Requiring moral separation of direct harm vs. prevented existence (deontological) while also requiring dynamic system modeling (consequentialist). Most theories sacrifice one: either they count non-existent beings and get paradoxes, or ignore future beings and miss bounce-back effects. 

  *Pauses* The user will hate if I duck this. So the desideratum doing most damage is probably D7 (welfare-sign agnosticism) – it obliterates both totalist "more life = better" and suffering-focused "extinction = good" positions. But admitting ignorance feels unsatisfying even when honest.

  Final note: Their "alternative stable states" example is brilliant. A theory must handle path-dependence – whether a bulldozed forest becomes grassland or toxic wasteland changes everything, but most ethics treats "habitat loss" as monolithic. That's going in as D5.
answer: |-
  Here's a structured desiderata list for evaluating ethical frameworks assessing habitat destruction's impact on wild animal welfare, based on your concerns and deeper conceptual tensions. I've organized it by core requirements, with rationale and negotiability status. The key tensions emerge at the end.

  ---

  ### **Core Desiderata for a Viable Account**

  1.  **D1: Dynamic Equilibrium Modeling (Non-Negotiable)**
      *   **What it must do:** Account for *long-term, stable population dynamics* (carrying capacity, density-dependence, alternative stable states) rather than snapshot headcounts. Must model transitions between states (e.g., woodland vs. degraded scrub), their stability, resilience, and the timeframes involved (including bounce-back after disturbance or restoration).
      *   **Motivation:** Your "headcount-vs-equilibrium" point. A snapshot ignores the system's trajectory. A cleared habitat might temporarily reduce numbers, but if it rapidly rebounds to the *same* high-mortality equilibrium (or flips to a *worse* one), the temporary dip is irrelevant or harmful. Conversely, a shift to a lower-capacity but higher-average-welfare state needs recognition.
      *   **Non-Negotiable? Yes.** Failure here invalidates the core ecological reality.

  2.  **D2: Explicit Welfare Accounting Framework (Non-Negotiable)**
      *   **What it must do:** Clearly define its stance on:
          *   *Welfare Symmetry/Asymmetry:* Does suffering intrinsically outweigh enjoyment of equal intensity? Or are they symmetric?
          *   *Scope:* Does welfare only count for actually existing beings? Or do "possible" beings (e.g., those never born due to habitat loss) have moral weight? If so, how?
          *   *Aggregation:* Total welfare (sum)? Average welfare? Something else (e.g., prioritarianism)?
      *   **Motivation:** The "net welfare" question hinges entirely on these choices. A symmetric total view vs. an asymmetric average view yield diametrically opposed conclusions, especially given high juvenile mortality.
      *   **Non-Negotiable? Yes.** The framework is undefined without this. *Specific choices* (symmetry, scope) *are* negotiable philosophical positions, but *having a defined position* is not.

  3.  **D3: Distinction Between Direct Harms & Prevented Existence (Conditionally Non-Negotiable)**
      *   **What it must do:** Keep morally distinct:
          *   *Direct Harms:* Suffering inflicted on existing animals during habitat destruction (displacement, starvation, injury, death).
          *   *Prevented Existence:* The non-creation of potential future animals due to the altered carrying capacity/dynamics.
      *   **Motivation:** Your point #4. Conflating them leads to counterintuitive justifications (e.g., "killing this animal now prevents its future suffering and stops its potential offspring from suffering, so it's good"). Most ethical intuitions strongly distinguish harming existing beings from not creating new ones.
      *   **Non-Negotiable? Highly Recommended/Quasi-Non-Negotiable.** Strict Total Utilitarianism (counting non-existent beings) *deliberately* collapses this distinction. If your framework adopts this view, it *must* clearly acknowledge and defend doing so, recognizing it violates common moral intuitions. Most plausible frameworks should maintain the distinction.

  4.  **D4: Treatment of Mortality & Replaceability (Non-Negotiable for Realism)**
      *   **What it must do:** Engage with the reality of high juvenile mortality in r-selected species. It must address:
          *   *The Replaceability Question:* Does the death of a juvenile who would have died anyway (highly probable) matter less, provided "its slot" is filled by another who survives? How does the *manner* of death (quick predation vs. prolonged starvation/parasitism) factor in?
          *   *Welfare Density:* Model the impact on *survivors*. Does reduced competition (via juvenile mortality or habitat reduction) improve the welfare of those who *do* live?
      *   **Motivation:** Your point #2 + ecology reality. Ignoring the probabilistic nature of juvenile survival and density-dependent effects renders the account biologically naive. The "cost" of high mortality isn't just the dead juveniles, but the potential welfare impact on the system.
      *   **Non-Negotiable? Yes.** An account that treats every potential life as equally significant, ignoring ecological context and density dependence, is unfit for purpose.

  5.  **D5: Path Dependence & Hysteresis Recognition (Non-Negotiable)**
      *   **What it must do:** Acknowledge that the *process* of habitat destruction/restoration and the resulting state depend on the *starting point* and *trajectory*. A degraded state might be irreversible (hysteresis) or might recover along a different path with different welfare characteristics than the original.
      *   **Motivation:** Your "alternative stable states" point. Simply comparing "Forest State Welfare" vs. "Cleared State Welfare" ignores whether the cleared state *can* be achieved without irreversible damage, or how restoration might lead to a different, potentially worse interim or final state.
      *   **Non-Negotiable? Yes.** Essential for realistic policy/prediction.

  6.  **D6: Sensitivity to Welfare Sign Uncertainty (Non-Negotiable for Honesty)**
      *   **What it must do:** Explicitly incorporate the profound uncertainty about whether typical wild lives are net positive or net negative welfare experiences. The framework must show how conclusions *depend* on this unresolved empirical question and avoid presenting verdicts as certain when they hinge on this unknown.
      *   **Motivation:** Your point #3. This uncertainty is massive and central. A framework pretending to know the sign is dishonest. The sensitivity analysis is crucial – does habitat destruction look good/bad/neutral only under specific welfare sign assumptions?
      *   **Non-Negotiable? Yes.** Ignoring or downplaying this uncertainty renders any conclusion suspect.

  7.  **D7: Integration of Non-Sentient Components (Conditionally Non-Negotiable)**
      *   **What it must do:** Acknowledge that non-sentient components (soil, water cycles, keystone structures, non-sentient plants) fundamentally shape the sentient welfare landscape by determining habitat quality, resource availability, and population dynamics. If "ecocentric" intrinsic value is claimed for systems/species, this must be explicitly justified *separately* from sentient welfare.
      *   **Motivation:** Ecosystems are complex networks. Ignoring the abiotic and non-sentient biotic drivers ignores the foundation of sentient welfare. However, *valuing* these non-sentient components intrinsically is a separate philosophical claim.
      *   **Non-Negotiable?** The *recognition* of their role is non-negotiable for realism. Assigning them *intrinsic moral value* (beyond instrumental value for sentient beings) is a negotiable philosophical choice that must be explicitly stated and justified.

  ---

  ### **The Likely Irreconcilable Tension**

  *   **D3 (Distinction Direct Harms / Prevented Existence) vs. D1 (Dynamic Equilibrium) + D4 (Replaceability) under a Strict Total View.**
      *   **Why:** D1 and D4 demand we think about the *long-term flow* of lives and welfare in the system. A strict Total Utilitarian view (counting the welfare of all possible beings who might exist across time) inherently blurs the line between harming existing individuals and altering the future population trajectory (preventing future existence). Focusing *only* on direct harms to existing individuals (honoring D3 strictly) risks ignoring the significant, long-term welfare consequences captured by D1 and D4. Reconciling the strong intuition behind D3 with the systemic, dynamic perspective required by D1/D4 is the core philosophical headache. Can you condemn the direct suffering *caused now* while also acknowledging that the *long-term consequence* might be a reduction in *expected total suffering* (if lives are net negative)? Most frameworks sacrifice one aspect.

  ---

  ### **The Most Damaging Desideratum for Existing Accounts**

  *   **D6 (Sensitivity to Welfare Sign Uncertainty)**
      *   **Why:** This single requirement devastates the confidence of *any* account claiming a definitive net welfare verdict regarding habitat destruction in wild ecosystems. Both "Destruction reduces suffering!" (assuming net negative lives) and "Destruction is terrible!" (assuming net positive lives) arguments collapse when forced to admit their core premise is unknown and potentially unknowable for most species. It exposes the foundational empirical weakness underlying the whole debate and forces any serious framework into probabilistic or sensitivity-based reasoning rather than offering clear-cut answers. It highlights that the biggest obstacle isn't primarily ethical theory, but a profound lack of biological knowledge about subjective experience.

  ---

  **In essence:** A trustworthy account must be ecologically dynamic (D1, D5, D4), philosophically explicit and honest (D2, D6), respect key moral distinctions (D3), and acknowledge the system's complexity (D7). The tension between the moral significance of existing individuals and the long-term welfare flow of the system is likely fundamental and unresolved. Any account claiming certainty without confronting the wild animal welfare sign uncertainty (D6) should be dismissed outright.
