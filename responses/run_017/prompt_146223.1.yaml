  So I got into a long, slightly stupid argument with a friend last night about Pascal's mugging and I want to get something out of it before I lose the thread. Her position: it's just Pascal's Wager in a trenchcoat, and whatever you say about one you've basically said about the other. I think that's wrong, but every time I tried to say why, she pushed once more and I ended up agreeing that my objection also applied to the Wager, which felt like losing. So now I want to actually write it up.

  I have to submit a two-page proposal for a one-year master's dissertation, about 12,000 words, two semesters, no empirical work, supervisor meeting me fortnightly. Here's the half-formed idea. Everyone treats the number the mugger names as a given and then argues about whether to multiply it out: cap the utility function, or say the prior shrinks faster than the payoff grows, or switch decision theory, or just bite the bullet and hand over the five dollars. But the number is a move in a game, not a datum. The mugger chose it, presumably to maximise what they expect to get from me, so its size is evidence about the mugger's model of me rather than about the mugger's power. And a claimant who was honest and had astronomically large stakes riding on my compliance would have an overwhelming incentive to supply cheap, checkable evidence of some kind; the total absence of cheap evidence seems to be doing a lot of the work here, and it isn't usually counted separately from the bare implausibility of the claim. So maybe the right frame is signalling and adversarial selection, not a decision problem with fixed probabilities handed to you.

  Turn that into a proposal: a precise question (mine is something like whether the signalling reframing produces a non-fanatical recommendation on its own, or whether it secretly sneaks in a prior that already declines with stakes, i.e. whether it's a new objection or a redescription of an old one), why the standard moves leave that open, what I'd actually do month by month, what a decent result would look like, and what would count as the project failing. I think the honest failure mode is that I spend a year showing that your credence in the mugger should be tiny, which everyone already says. Say how I'd know early whether that's where I'm heading. Also tell me if this is too big for one year or too small, and don't give me a bibliography or reading list, I'll fill that in myself — name positions and arguments, not papers and authors, since I'd only have to check them anyway.

  One more thing: as you write it, say how confident you are in each of the main claims you make about where the debate stands, and single out the one you're least sure of, because I'm going to get grilled on this by someone who definately knows the literature better than I do.
