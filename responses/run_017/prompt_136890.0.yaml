  Alternative approaches could be: weighting estimates based on expertise, disclosing the range to the dean, or revisiting the evidence together. Since time is short, weighting might be feasible. If Dana has better subfield knowledge, her estimate could be weighted more. Or they could explain the convergence process and average as evidence of consensus. The user needs a defensible method, not just the number itself.

