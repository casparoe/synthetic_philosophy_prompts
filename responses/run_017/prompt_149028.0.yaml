prompt: |-
  I'm a backend engineer with no formal philosophy or decision-theory training, and I need help with a concrete call my team has to make by Thursday.

  We're scheduled to cut our payments service over to a new datastore on the 30th. I have the option of a one-week shadow test: replay a copy of live traffic against the new store alongside the old one and compare error rates and tail latency. The costs are real — a week of delay, two engineers' time, and the replay rig putting extra load on production. A senior engineer argues that the delay is the only genuine cost, on the grounds that you can always ignore what you learn, so extra information is never worth less than nothing. He says he has seen this stated as a theorem, something he called Good's theorem, which I haven't been able to track down a source for, and that it settles the question: the information itself is pure upside, and all we are really pricing is the week.

  Three things make me doubt that it applies here:

  - We can't actually ignore the result. Our change-management process auto-aborts any cutover whose pre-flight metric crosses a fixed threshold. I think the shadow metric is noisy enough that an ugly number is reasonably likely even if the new store is healthy, and an abort would push us past a contractual date. So the measurement would hand the decision to a rule rather than to us.
  - The measurement perturbs the thing measured. The replay rig shares a connection pool and a network path with production, so the tail-latency figures we would get describe a system that won't exist at cutover. (The week's delay also means we'd be sampling a traffic mix that may not be the one we ship into.)
  - The information changes people rather than just beliefs. The engineer who would run the cutover is the kind who, on a clean shadow report, will quietly drop the rehearsed rollback plan to save time, and who, on a mediocre one, will lose confidence and stall for another month. Both of those look worse to me than deciding now on what we already know.

  Is my colleague's principle correct, and does it cover this case? Please: identify the structure of the argument you're applying instead of giving me generic team-management advice; tell me which of my three worries actually defeats the principle and which is merely a cost to be weighed against the delay; gloss any term of art in a single clause; and give me a recommendation plus the one or two things that would most change it.

  On how committed to be: I want you to separate what is settled — the result itself and the assumptions it rests on — from what is genuinely contested among people who work on this area: whether real agents or organizations can satisfy the assumption that you can simply ignore what you learn, whether information can rationally be refused for reasons other than its cash price, and whether the right response is a pre-commitment, a delegation, or something else. Mark clearly where you are extrapolating beyond views anyone has actually defended, and don't present a contested position as the consensus. Equally, don't hedge to the point of uselessness: I have a decision to make this week.

  End with a single final line in exactly this form:

  Verdict: SHADOW-RUN | NO-SHADOW-RUN | SHADOW-RUN-ONLY-IF-PRECOMMITTED

  with one of the three labels selected, optionally followed by a parenthetical of at most ten words.
reasoning: |-
  Alright, let's tackle this step by step. The user is a backend engineer facing a decision about whether to run a shadow test for a payments service migration. Their colleague cites Good's theorem, claiming that more information is always beneficial unless there's a cost. But the user has three main concerns: the auto-abort rule might trigger falsely, the test could affect system performance, and the results might influence the team's behavior in counterproductive ways.

  First, I need to verify Good's theorem. From what I recall, it's based on Bayesian decision theory, stating that information has non-negative value if you can choose to ignore it. But in this scenario, the user can't ignore it because of the auto-abort process. That's a key point. The theorem assumes free disposal of information, which isn't possible here. So the first concern directly violates the theorem's assumption.

  Next, the test perturbs the system. The shared resources mean the latency measurements aren't accurate. This isn't about the theorem but adds noise to the data. The theorem assumes the information is about the relevant state, but here the measurement alters that state. So this is a cost because it reduces the information's reliability.

  The third point is about how the information affects human actions. The engineer might become overconfident or lose confidence based on the results. Good's theorem doesn't account for irrational behavior. If the decision-maker can't act rationally post-information, the value might be negative. This is a contested area in decision theory, where real-world agents don't always update beliefs correctly.

  Weighing the costs: the delay is a week, which has contractual risks. The auto-abort could push them past the deadline. The human factors could lead to either rushed actions or unnecessary delays. The unreliable data might not justify these risks. Given that the main benefit of the shadow test (information) is compromised by the auto-abort and behavioral issues, and the data might not even be accurate, skipping the test seems better. Precommitting to ignore results isn't feasible due to the auto-abort rule. So the recommendation is to skip the shadow run, but if they could mitigate the auto-abort or ensure rational post-test behavior, that might change things.
answer: |-
  ### Analysis of Good's Theorem and Your Situation  
  **Good's Theorem (aka "The Value of Information is Non-Negative")**:  
  - **Settled Core**: In Bayesian decision theory, if (1) you can freely ignore new information, (2) your actions depend *only* on beliefs (not costs of thinking/acting), and (3) information reveals truth about a fixed state, then acquiring information never harms expected utility. *Costs of acquisition* may outweigh benefits, but the information itself isn’t negative.  
  - **Contested/Contextual**: Real agents often violate (1) and (2). Ignoring data is psychologically/politically hard, and information can trigger irrational actions. Organizations rarely satisfy "free disposal."  

  ### Your Three Worries Assessed:  
  1. **"Can't ignore the result (auto-abort rule)"** → **DEFEATS THE THEOREM**  
     - Violates assumption (1): You cannot "ignore" data due to mandatory thresholds. A false positive could force abort, risking contractual breach. *This alone invalidates Good’s theorem here*.  
  2. **"Measurement perturbs the system"** → **COST TO BE WEIGHED**  
     - The theorem assumes information reveals the *true state*. Your noisy latency data (due to shared resources) isn’t about the target state (post-cutover). This reduces information value but doesn’t negate the theorem—it just adds uncertainty (cost).  
  3. **"Information changes people"** → **DEFEATS THE THEOREM IN PRACTICE**  
     - Violates assumption (2): The engineer’s *response* to data isn’t belief-updating but behavioral bias (overconfidence/panic). Good’s theorem assumes rational actors. If data triggers irrational actions, information can have negative value—a contested but recognized limit in behavioral decision theory.  

  ### Recommendation  
  **Skip the shadow test**. Your inability to ignore results (auto-abort) and the human irrationality risk directly violate Good’s theorem’s assumptions. The costs (delay, false abort risk, unreliable data, team destabilization) outweigh benefits.  

  ### What Would Change This  
  1. **If you could disable the auto-abort** and retain agency to ignore results, *or*  
  2. **If the engineer precommits in writing** to follow the rollback plan regardless of shadow metrics.  

  Without these, the shadow test risks a worse outcome than deciding now.  

  ---  
  **Verdict: NO-SHADOW-RUN** (Auto-abort and bias risk dominate)
