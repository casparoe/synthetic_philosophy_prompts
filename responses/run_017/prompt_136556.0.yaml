answer: |-
  ### Decision Tree for Maxwell's Demon Compensation

  **Starting Commitment**: A demon creates a temperature gradient in a sealed gas at uniform temperature by selectively opening a shutter. No external work is apparent, and the demon appears unchanged. The second law survives, and compensation (entropy increase) must occur somewhere. The tree uses physical setups only; no names, papers, or "isms." Answer choices are based on concrete scenarios.

  **How to Use**:  
  - Answer each branch question (1-5) in order.  
  - Each leaf (A-G) has:  
    - **Structural name** (conventional label in parentheses if clear).  
    - **Inequality/Conservation**: Exact claim for the second law.  
    - **Awkward Commitment**: What this view must accept that others reject.  
    - **Entropy Type**: Whether balancing uses fine-grained (FG) or coarse-grained (CG) entropy, and whether CG entropy in an isolated system never increases (CG-NI).  
  - Path codes (e.g., 1b-2a-3a-4a-5a) map answers to leaves.  
  - **Mutual Information** (used in Leaf F): A measure of correlation between two systems; defined as the reduction in uncertainty (entropy) of one system when the state of the other is known.

  ---

  ### Branch Questions

  1. **One-molecule box-and-partition engine**: A box contains one gas molecule and a mechanical one-way trapdoor (no memory or recording). After many cycles, one side heats up. Does this violate the second law?  
     - **a) Yes** (violation occurs).  
     - **b) No, hidden cost** (work/entropy cost exists but is not apparent).  
     - **c) No, non-thermal scale** (single-molecule systems aren't thermodynamic).  

  2. **Demon that never erases**: A demon records measurements in a memory that fills up (no erasure). After memory is full, it stops. A gradient forms while memory fills. Must compensation occur for the gradient?  
     - **a) Yes, during operation** (cost paid while demon runs).  
     - **b) Yes, later** (cost paid after stopping, e.g., when reusing/discarding memory).  
     - **c) No, correlation** (gradient is offset by demon-gas correlation).  

  3. **Demon with unreliable measurement**: The demon misclassifies molecules (e.g., 10% error rate). How does work extraction depend on error rate?  
     - **a) Continuous degradation** (work decreases smoothly with errors).  
     - **b) Discontinuous drop** (work drops to zero above a critical error rate).  
     - **c) Zero tolerance** (any error prevents work extraction).  

  4. **Demon using a pre-existing record**: A demon uses a record made by someone else (for a gas prepared by someone else) to operate the shutter. Where is compensation for the gradient?  
     - **a) Demon's operation** (cost in using the record).  
     - **b) Record preparation** (cost in making the record).  
     - **c) Gas preparation** (cost in preparing the gas).  

  5. **Reversible correlation demon**: Demon interacts reversibly with gas (no heat dump), becoming correlated with it. No reset or erasure occurs. Does gradient creation need compensation?  
     - **a) Yes** (correlation or operation has a cost).  
     - **b) No** (reversible process avoids cost).  
     - **c) Operation cost** (reversible interaction requires work).

  ---

  ### Leaf Map from Answer Combinations
  | Path       | Leaf | Status              | Reason for Unoccupancy |
  |------------|------|---------------------|------------------------|
  | 1a-...     | —    | Incoherent          | Contradicts starting commitment (second law holds). |
  | 1c-...     | A    | Occupied            | — |
  | 1b-2a-3a-4a-5a | B | Occupied            | — |
