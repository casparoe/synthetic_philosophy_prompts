  ### Leaves (Positions)

  - **A: Non-thermodynamic scale** (Path: 1c)  
    - **Inequality/Conservation**: No entropy defined for single molecules; second law is statistical and applies only to large-N systems.  
    - **Awkward Commitment**: The device fails for multi-molecule gases without additional costs (e.g., memory or measurement).  
    - **Entropy Type**: CG; does not claim CG-NI for small systems.  

  - **B: Measurement dissipation ledger** (Conventional: Measurement cost)  
    (Path: 1b-2a-3a-4a-5a)  
    - **Inequality/Conservation**: Extracted work \(W \leq Q_m\), where \(Q_m\) is heat dissipated during measurement.  
    - **Awkward Commitment**: Even reversible measurements must dissipate heat (denies possibility of frictionless observation).  
    - **Entropy Type**: CG; claims CG-NI for isolated systems (dissipation increases environment entropy).  

  - **C: Gas-preparation debt** (Path: 1b-2a-3a-4c-5a)  
    - **Inequality/Conservation**: \(W \leq \Delta F_{\text{gas}}\), where \(\Delta F_{\text{gas}}\) is free energy from initial gas state.  
    - **Awkward Commitment**: The gas must be initially prepared in a low-entropy state (non-equilibrium), not a typical uniform gas.  
    - **Entropy Type**: CG; claims CG-NI (cost paid during gas prep, not operation).  

  - **D: Measurement threshold ledger** (Path: 1b-2a-3b-4a-5a)  
    - **Inequality/Conservation**: Work extraction possible only if measurement error < threshold; else \(W = 0\).  
    - **Awkward Commitment**: Infinitesimal errors can abruptly prevent work extraction (discontinuous phase-change-like behavior).  
    - **Entropy Type**: CG; claims CG-NI (errors trigger dissipation that compensates).  

  - **E: Measurement-error dissipation** (Path: 1b-2a-3b-4c-5a)  
    - **Inequality/Conservation**: \(W \leq kT \ln(1/f)\), where \(f\) is error-free fraction; errors dissipate heat.  
    - **Awkward Commitment**: Errors dominate the cost, not memory or correlation (even reliable demons have hidden error costs).  
    - **Entropy Type**: CG; claims CG-NI (heat from errors balances gradient).  

  - **F: Record-preparation debt** (Conventional: Information cost)  
    (Path: 1b-2b-3a-4b-5a)  
    - **Inequality/Conservation**: \(W \leq \Delta F_{\text{record}}\), where \(\Delta F_{\text{record}}\) is free energy decrease to create the record.  
    - **Awkward Commitment**: The record is a one-time resource (cannot be copied or reused without additional cost).  
    - **Entropy Type**: CG; claims CG-NI (cost paid during record-making, not demon operation).  

  - **G: Gas-fluctuation debt** (Path: 1b-2b-3a-4c-5a)  
    - **Inequality/Conservation**: \(W \leq kT \ln(\Omega_{\text{initial}})\), where \(\Omega_{\text{initial}}\) is initial microstate probability.  
    - **Awkward Commitment**: The demon only works if the gas has rare initial fluctuations (not a typical equilibrium state).  
    - **Entropy Type**: CG; claims CG-NI (cost in atypical gas prep).  

  - **H: Reversible-operation ledger** (Conventional: Bennett’s demon)  
    (Path: 1b-2c-3a-4a-5b)  
    - **Inequality/Conservation**: Net work \(W_{\text{net}} = 0\) in a closed cycle (work from gradient is repaid during reversible uncorrelation).  
    - **Awkward Commitment**: The demon must uncorrelate reversibly without noise (requires perfect control, impossible in practice).  
    - **Entropy Type**: FG; does not claim CG-NI (temporary CG decreases allowed if reversible).  

  - **I: Correlation-conservation balance** (Conventional: Szilard’s engine generalized)  
    (Path: 1b-2c-3a-4c-5b)  
    - **Inequality/Conservation**: \(\Delta S_{\text{gas}} + \Delta I \geq 0\), where \(I\) is mutual information (correlation) between demon and gas.  
    - **Awkward Commitment**: Mutual information isn’t "physical" entropy—it’s a statistical debt that can be converted to work once.  
    - **Entropy Type**: FG; does not claim CG-NI (correlation stores entropy reduction in FG description).

