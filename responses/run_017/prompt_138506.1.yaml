prompt: |-
  I am assembling the first session of a graduate seminar on material objects, and before we look at any of the proposed answers I want the class to have the standard of assessment in hand. Please write the specification rather than the survey: what an adequate answer to the special composition question — the question of under what conditions some things compose a further thing — would have to deliver, with the case or consideration that motivates each requirement, and with each requirement marked as non-negotiable or as the preference of one camp.

  Adequacy is relative to a purpose, so let the purpose be mine. I need an answer that could actually be used by a court asked to say whether some artifact is the same one over time: a cathedral rebuilt in different stone after a fire; a ship named in a will whose planks have all since been replaced; a digital object whose every token has been migrated to new hardware. And it should be usable by a field biologist counting organisms in a clonal colony. An answer that is silent or arbitrary in those cases is no use to me, however elegant it is in the armchair.

  The requirements I keep returning to, which you should keep, discard, restate, or expose as confused, are these: it must return a verdict for every plurality, including for pairs of particles in a collider and for the totality of galaxies, and not merely for middle-sized things; it must not double-count causal powers, so that a composite's causal work at a time is never a plain duplicate of its parts' work at that time; it must be temporally local, in that whether the xs compose at t cannot depend on what happens at times remote from t; its verdicts must not shift with the interests of whoever is asking, since a court needs an answer that does not move with the litigants' purposes; it must be fully determinate, returning yes or no for any plurality with no in-principle indeterminacy; and it must be non-vacuous, not a principle that never fires or that merely redescribes the notion of composition it was meant to explain.

  Add whatever I have omitted. Then tell me which of these is a genuine desideratum and which is only a prejudice of a camp — I suspect the determinacy requirement is smuggled in from a taste for tidy semantics. I also suspect that interest-invariance, determinacy, and any graceful treatment of the ship and the clonal colony cannot all be had together; if some subset of the requirements is jointly unsatisfiable, identify it and show why, as that is the part I most want. And name the single requirement that excludes the most candidate answers. You may spend one sentence each on how the view that any things whatsoever compose something, the view that nothing has proper parts, and the view that composition occurs only where the result is alive fare against the two hardest requirements, and no more — I will do the scorecard in seminar.

  Lead with your bottom line in the first sentence: either the requirement that is doing the real work, or the claim that the list cannot be jointly satisfied and where it breaks. Then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Hmm, the user is assembling a graduate seminar on material objects and wants a specification for what makes an answer to the special composition question adequate. They need this specification to help assess different theories of composition, particularly for practical applications like legal cases involving artifact identity over time (cathedrals, ships, digital objects) and biological contexts like counting organisms in clonal colonies.

  The user has listed several requirements: universal verdicts for all pluralities, no causal overdetermination, temporal locality, interest-invariance, determinacy, and non-vacuity. They suspect determinacy might be a theoretical prejudice and wonder if interest-invariance, determinacy, and graceful handling of the ship/clonal colony cases are jointly impossible.

  I need to analyze which requirements are genuine desiderata versus camp-specific biases. The key tension lies in the ship of Theseus and clonal colony cases, where interest-invariance and determinacy conflict with practical resolutions that often depend on context. Courts and biologists might need flexible criteria, but a metaphysical theory demands fixed answers.

  Temporal locality and causal non-overdetermination are non-negotiable for any coherent physicalist ontology. Universal application and non-vacuity are also core. Interest-invariance is crucial for the legal context but may force arbitrary boundaries in continuous cases. Determinacy is likely a theoretical preference; insisting on it blocks contextual solutions.

  The hardest requirement is interest-invariance combined with determinacy, as it excludes moderate answers like restricted composition. Universalism and nihilism fail causal non-overdetermination and practical utility. Biological individualism struggles with clonal colonies due to vagueness.

  The bottom line: Interest-invariance and determinacy conflict with graceful handling of the ship/clonal colony, making the set unsatisfiable. The core tension is between metaphysical rigor and practical flexibility.
answer: |-
  **The requirements cannot be jointly satisfied; they break on the conflict between interest-invariance, determinacy, and delivering non-arbitrary verdicts for the ship of Theseus/clonal colony cases.**

  1.  **Universal Verdicts (Non-negotiable):** An answer must specify composition conditions for *every* plurality (particles, galaxies, planks, polyps). *Motivation:* Courts and biologists face arbitrary pluralities (e.g., "all replaced planks + the ship?", "this connected segment of the clonal colony?"). Silence on any case renders it unusable for the stated purposes. A theory only for "ordinary objects" fails the legal/biological test cases.
  2.  **Causal Non-Overdetermination (Non-negotiable):** A composite's causal powers at *t* cannot be a mere duplicate sum of its parts' causal powers at *t*. *Motivation:* Systematic overdetermination violates parsimony and makes composites explanatorily redundant epiphenomena. Courts and science rely on attributing causal responsibility (e.g., "the ship caused the damage," not just "all the planks jointly caused it" identically). This excludes mereological universalism and nihilism (see below).
  3.  **Temporal Locality (Non-negotiable):** Composition at *t* depends only on facts at or intrinsic to *t*. *Motivation:* Legal and biological identity assessments at *t* must be based on the current state (e.g., "Is *this* the ship named in the will *now*?"), not future replacements or past states. Retrospective judgments based on later events are incompatible with adjudicating present claims.
  4.  **Interest-Invariance (Non-negotiable for purpose):** Verdicts must be independent of human purposes, concepts, or interests. *Motivation:* A court *must* provide an objective answer binding on litigants with conflicting interests (e.g., heirs vs. museum over the "same" ship). A biologist counting organisms needs a count independent of their research question. Subjectivity renders the answer useless for adjudication or objective science.
  5.  **Determinacy (Camp Preference - Universalist/Nihilist):** For any plurality, composition must be definitely yes or definitely no; no vagueness or in-principle indeterminacy is allowed. *Motivation:* The user suspects a prejudice from "tidy semantics," and this is correct for *this purpose*. While courts and biologists need *practical* determinacy for *their specific cases*, demanding *metaphysical* determinacy for *every conceivable plurality* (like arbitrary particle pairs) is driven by a desire for a perfectly sharp ontology, not the practical needs stated. This requirement is the main blocker for resolving the hard cases gracefully.
  6.  **Non-Vacuity (Non-negotiable):** The principle must genuinely constrain when composition occurs and not merely restate the concept or universally permit/deny it. *Motivation:* A principle like "things compose when they are arranged object-wise" is circular. "Things always compose" or "Things never compose" vacuously satisfies universality but fails non-overdetermination and the practical cases (see below). An answer must *do work*.

  **Omissions Added:**
  7.  **Compatibility with Persistence (Non-negotiable):** The answer must integrate with a coherent account of how composites persist through change (like replacement of parts). *Motivation:* The core legal cases (cathedral, ship, digital migration) *are* persistence questions. An answer to the SCQ that cannot ground persistence through part-replacement is useless for the stated purpose. This intensifies the conflict in the hard cases.
  8.  **Grounding in Physical Facts (Non-negotiable for purpose):** Composition facts must supervene on non-normative, non-mental physical facts about the arrangement and properties of the parts. *Motivation:* Courts and biology require answers based on objective evidence (plank locations, organic connections), not evaluative judgments or mental states (except perhaps for artifacts, but even then, the physical instantiation matters).

  **The Conflict & Why Unsatisfiable:**
  The conjunction of **Interest-Invariance (4)**, **Determinacy (5)**, and the need for **non-arbitrary verdicts in the ship/clonal colony cases** (motivating 1, 3, 7, 8) cannot be satisfied simultaneously for the hard cases.

  *   **The Problem:** The ship-of-Theseus and clonal colony cases involve gradual, continuous change (plank replacement, growth/fission of organisms). Any precise, interest-invariant boundary between composition and non-composition (e.g., "composes iff >50% original planks remain", "composes iff physiologically integrated") will seem arbitrary for cases near the boundary. Why 50%? Why *this* level of integration? The metaphysical facts seem vague or dependent on the kind of thing it is (which might involve interests).
  *   **Interest-Invariance + Determinacy Force Arbitrariness:** Insisting on both forces a sharp cut-off where our concepts and practical needs suggest there isn't one, making the verdicts *metaphysically* arbitrary even if precise. The court might *need* a sharp legal rule (e.g., "majority of original parts"), but this rule reflects practical interests, not an interest-invariant metaphysical fact.
  *   **Graceful Treatment Requires Compromise:** A "graceful" treatment for practice might involve context-sensitivity (e.g., for the ship, continuity of form/function; for the colony, a life-history criterion), acknowledging vagueness, or relativizing to kinds – but these violate Interest-Invariance (4) and/or Determinacy (5). Alternatively, universalism or nihilism avoids arbitrariness but fails Causal Non-Overdetermination (2) and the practical cases utterly.

  **The Requirement Excluding the Most:**
  **Causal Non-Overdetermination (2)** is the single requirement excluding the most candidate answers. It immediately rules out:

  *   **Universalism (any things compose):** The cosmos has causal powers, but so do the particles – identically and completely at *t*. Systematic overdetermination.
  *   **Nihilism (no composite objects with proper parts):** Only particles exist. But we predicate causal powers to "the bomb" or "the enzyme" – which, if not real composites, must be identical to just the particles working, again duplicating causal powers.
  *   **(Biological Individualism fares poorly against Universality (1) & Clonal Colonies):** Insisting only living things compose struggles to count organisms in a clonal colony (Is the whole colony one organism? Each polyp? A connected segment?) without resorting to vague/arbitrary boundaries or interest-relative criteria, failing Determinacy (5) and potentially Interest-Invariance (4) if boundaries are pragmatic. It also fails Universality (1) for particles/galaxies. Its adherence to Non-Overdetermination (2) is its strength.
