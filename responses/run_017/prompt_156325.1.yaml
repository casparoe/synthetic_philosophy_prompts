prompt: |-
  I am a professor of philosophy — my own work is in general philosophy of science, and I am not a physicist — and I have been asked to draft the section on epistemic warrant for the scoring rubric of our university's internal high-risk research fund. The panel meets twice a term, sees between twelve and eighteen proposals per cycle, spends roughly twenty minutes on each, and must attach a one-page written rationale to every award; those rationales are read by the provost and by the faculty senate's research committee. There are five of us, only one of whom is a physicist, and that colleague will stop reading altogether if the rubric sounds like philosophers policing physics. So what I need is something the whole panel can actually run, in plain language, within the time we have, and reusable across cycles rather than a set of wise remarks about one application. Please do not give me a bibliography or a reading list: I have the literature. What I lack is a procedure.

  The proposals that defeat us share a shape. They come mainly from fundamental cosmology and quantum gravity — a framework such as the string landscape or eternal inflation, whose defenders concede outright that no decisive test will be available during the grant period, and which is supported instead by arguments of a few recurring kinds: that a large, well-motivated community has searched hard for a rival framework of comparable unifying power and not found one; that the framework displays unexpected internal coherence, drawing together results that were not constructed to fit; that theories of this ambition and difficulty have historically gone on to empirical success, so the track record of the genre is itself some evidence; and, in the cosmological cases, that the observed values of certain parameters are roughly what one should expect to observe if the theory's vast space of possibilities is real and we occupy an untypical, observer-permitting corner of it. Proposals from other fields make structurally parallel claims: simulation-based programmes in macroeconomics or in neuroscience, whose models can be checked only against stylized facts or against other simulations, and whose defenders invoke coherence, unification, and the absence of rivals precisely when no out-of-sample test is available. At present our panel either defers to the physicist member or dismisses these proposals as not science. Both are evasions, and I want something better.

  What I want from you is a decision procedure — ordered gates, each with a question, a specification of what counts as a sufficient answer, an instruction about what to do when the panel cannot get an answer (which in twenty minutes will be often), and a stop rule that says when the answer is no. It must handle at least the following difficulties.

  First, a mapping from strength of warrant to strength of decision. Our current rubric conflates three things: whether the framework deserves further work; whether it may be presented to students or the public as a live option rather than a speculation; and whether other fields may treat it as a premise. My suspicion is that the non-empirical arguments, even at their strongest, only ever license the first, and that our awards quietly drift into licensing the second and third. I have been calling this drift warrant laundering. Give me a way of catching it, including a check that reads the proposal's own aims, hiring, and public-impact sections against its epistemic section, since the slippage usually happens between them.

  Second, the confound I keep running into with the no-rivals argument: the probability that no alternative exists is not the probability that a search of this character, duration, and sociological composition would have found one, and I do not think a panel can estimate the latter even to an order of magnitude. Tell me what the panel should do instead — my own thought is to require the applicants to name one rival they take seriously, however undeveloped, and to score both frameworks on the cited evidence, with the absence of any nameable rival recorded as a fact about the field rather than about the world. Tell me if that is the wrong fix.

  Third, discriminating power. The evidence cited is usually described only as something the framework predicts or accommodates. I want the panel to ask how much more expected that evidence is under the framework than under the best rival actually on the table, and to note that when no rival can be articulated the comparison collapses. Say what the procedure does at that point: whether it stops, whether it downgrades the award, or whether it caps the decision at the weakest of the three levels above. I am also inclined to ask, as a lighter check, whether the same form of argument would have recommended a framework we now regard as dead; if so, that is a reason for caution rather than a refutation, and I want you to tell me how much weight such a historical probe can bear given that we will be applying it from memory and under time pressure.

  Fourth, the anthropic and typicality step. Some proposals rest largely on the claim that what we observe is unsurprising within a huge space of possibilities once selection effects are accounted for. I want a test for whether the typicality claim is independent of the outcome it is meant to explain — whether the measure over possibilities is motivated for reasons other than that it delivers the answer — and for whether there is any case in which the argument would have come out the other way. If there is not, say plainly that the step is unfalsifiable in a local rather than a global sense and tell me what the panel should then do.

  Fifth, a progress or horizon gate. A programme that receives non-empirical support only can still be worth a bet, but it is a bet that needs a stated termination condition: what would count, by the end of the award, as the programme having stalled rather than merely not yet succeeded? For these programmes there is no clean failure signal, and I would rather the rubric admitted that than pretended otherwise. I also want the renewal case handled explicitly, since sunk costs and the panel's own earlier language are working on us.

  For each gate, tell me what counts as a sufficient answer, and mark the points at which the remaining question is one of values rather than of warrant — opportunity cost across fields, the training and infrastructure a programme sustains, its effect on the prestige and composition of a department — and must therefore be handed back to the panel as a vote rather than disguised as an epistemic score. Equally, tell me which of my distinctions do not survive being made usable, and should be dropped rather than kept as ornament.

  Then run the procedure, in full, on three applications.

  The first: a new three-year proposal from a cosmology group working on eternal inflation, arguing that the observed value of the vacuum energy is what an anthropic selection argument predicts, conceding no direct test within the period, naming a rival single-universe approach but describing it as undeveloped, and requesting funds that include a public lecture series presenting the multiverse as the likely large-scale shape of things.

  The second: a third renewal from a quantum-gravity group. It cites dualities and unexpected connections to pure mathematics, points to a long search without alternatives, asks for continued funding, and also asks that the panel record in its rationale that this framework is the default setting for quantum-gravity work at this university, to be reflected in a hiring line and in graduate curricula. I expect your procedure to stop somewhere here, and I want to see exactly where and in what words.

  The third is the one I expect to dislike. It is an agent-based macroeconomic programme whose models are validated only against stylized facts and against other simulations, with no out-of-sample test available; its lead investigator is a colleague whose work I think is first-rate, and I want to fund it. If your procedure returns a no, say so without softening it. Then tell me honestly whether any amendment to the procedure that would save it is principled or is merely special pleading by someone who already knows the answer he wants.

  Close by telling me, in language I can put in the preamble to the rubric and that a provost can read in one sentence, what this procedure cannot do. I have in mind that it will not deliver a credence in any framework, that it will not compare a bet in fundamental physics against a bet in neuroscience, and that it cannot settle whether a failed search tells us about the world or about ourselves — but I would like you to decide, rather than to agree with me.
reasoning: |-
  Hmm, the user is a philosophy professor specializing in philosophy of science, tasked with creating an epistemic warrant assessment procedure for high-risk research proposals. They need a practical decision tool, not theoretical discussion. Key constraints: 20-minute panel deliberation per proposal, interdisciplinary panel (only one physicist), must avoid "philosophers policing physics" perception, and handle recurring problematic cases from cosmology/quantum gravity and other fields.

  The core challenge is evaluating non-empirical arguments fairly while preventing "warrant laundering" - where weak epistemic support gets misapplied to educational or institutional decisions. The user identifies five specific pain points:
  1) Distinguishing three levels of warrant (further research vs teaching vs premise adoption)
  2) Handling "no rivals" arguments without false objectivity
  3) Assessing predictive discrimination when rivals are nebulous
  4) Testing anthropic reasoning for circularity
  5) Setting termination conditions for non-falsifiable programs

  For the decision procedure, I'll design a staged gate system with clear stop/go rules. Each gate must:
  - Have a concrete question
  - Define sufficient answers
  - Specify failure consequences
  - Flag when judgment shifts from epistemology to values
  - Include time-sensitive fallbacks

  Crucial design principles:
  - Anti-laundering: Separate epistemic scoring from institutional decisions
  - Operationalization: Convert philosophical concerns into actionable checks
  - Time-awareness: Default positions for when panels hit 20-minute limits
  - Honesty: Explicitly state what the procedure can't do

  The anthropic reasoning gate needs particular care - it must test if the probability measure is independent of the observed outcome. For the "no rivals" problem, requiring naming at least one alternative (however underdeveloped) seems wise to avoid vacuum-sealed justification.

  For the three test cases:
  - The cosmology proposal should pass but with restrictions on public communication
  - The quantum gravity renewal should fail at the warrant level gate due to institutional overreach
  - The economics proposal might surprisingly pass if it meets internal coherence standards

  The preamble disclaimer must emphasize this tool doesn't assign probabilities, compare fields, or resolve sociological vs ontological questions about theory search. It's purely about managing epistemic risk in funding decisions.
answer: |-
  Here is a decision procedure designed for your constraints. It has five gates, each with a question, a sufficiency threshold, a time-pressured fallback, and a stop rule. If a proposal fails any gate, the process stops. **Bold text** indicates the core question/instruction. *Italics* mark value judgments for panel voting. Epistemic levels are: **L1** (Warrants exploratory work), **L2** (Warrants presentation as live option), **L3** (Warrants use as premise). Non-empirical arguments max out at L1.

  ---

  ### **Gate 1: Warrant Level Declaration**
  *   **Question:** What level of epistemic warrant (L1/L2/L3) does the proposal claim for its framework, *based solely on the evidence presented in the "Epistemic Justification" section*?
  *   **Sufficient Answer:** Explicit statement matching L1/L2/L3 *in the proposal text*, supported *only* by arguments from that section. If claiming L2/L3, empirical testability (even long-term) must be outlined.
  *   **Time Pressure Fallback (5 mins):** If unclear, **assume L1**. Record ambiguity.
  *   **Stop Rule:** If claim is L2/L3 *and* justification relies *solely* on non-empirical arguments (coherence, no rivals, historical analogy, anthropics) → **STOP. Fail.** Non-empirical arguments cannot support L2/L3.
  *   **Warrant Laundering Check:** Immediately cross-reference the declared warrant level (Gate 1) with:
      *   "Aims": Does it promise outcomes requiring L2/L3 (e.g., "establish X as foundational")?
      *   "Public Impact": Does it plan to present the framework as "likely" or "established" to non-experts?
      *   "Hiring/Curriculum": Does it request hires/teaching implying L2/L3 (e.g., "train students in the standard framework")?
      *   **Slippage Rule:** If declared level (Gate 1) is L1 *but* aims/impact/hiring imply L2/L3 → **Flag for Panel:** "*Epistemic warrant (L1) is insufficient for proposed institutional/communicative aims. Proceed only if aims are downgraded.*" → *Panel votes on amending aims or rejecting*.
  *   **Output:** Declared Level (L1/L2/L3), Laundering Flag (Yes/No).

  ### **Gate 2: Rival Articulation & Comparative Expectation**
  *   **Question:** What is **one concrete rival framework** (however underdeveloped) that the proposal acknowledges? How much **more expected** is the cited key evidence under the proposed framework vs. this rival?
  *   **Sufficient Answer:** A named rival (e.g., "LQG," "Modified Gravity," "Heterodox DSGE model"). Quantitative or clear qualitative statement of comparative predictive likelihood (e.g., "Parameter Y is generic here but fine-tuned there," "Phenomenon Z emerges naturally here but is ad hoc there").
  *   **Time Pressure Fallback (5 mins):** If no rival named → **Record:** "*No articulable rival presented. Field may be immature or monolithic.*" → **Proceed to Gate 3 but cap at L1**. If rival named but comparative likelihood unclear → **Record:** "*Comparative predictive advantage not established.*" → **Downgrade to L1** if higher was possible.
  *   **Stop Rule:** If *no rival can be named by the panel using proposal text/common knowledge* → **STOP. Fail.** (Indicates a field too underdeveloped or insular for meaningful warrant assessment).
  *   **Your Fix Applied:** Mandatory naming of a rival forces specificity. The "no rival" outcome is recorded as a *sociological fact*, not evidence for the theory.
  *   **Output:** Named Rival (Yes/Name/No), Comparative Expectation Established (Yes/No/Partial), Level Cap/Downgrade.

  ### **Gate 3: Historical Sanity Check & Internal Coherence**
  *   **Question:** **a)** Is the *form* of the main justification (e.g., no rivals + coherence) historically associated with *failed* frameworks (e.g., Ptolemaic epicycles, steady-state cosmology)? **b)** Is the cited "internal coherence/unification" non-trivial (i.e., not built-in by construction)?
  *   **Sufficient Answer:** **a)** Panel identifies 1-2 historical analogues *from memory*. **b)** Coherence links *distinct* problems/results not obviously designed to fit.
  *   **Time Pressure Fallback (4 mins):** **a)** If no clear historical analogue → No penalty. If analogue recalled (e.g., "Similar arguments were made for Ether theory") → **Record Caution:** "*Justification form has historical false positives.*" **b)** If coherence seems trivial/tautological → **Record:** "*Coherence argument weak.*" → **Downgrade within L1**.
  *   **Weight of History:** This is a *caution flag*, not a refutation. It can **downgrade within L1** but not cause failure. It relies on panel recall; its power is limited but real.
  *   **Stop Rule:** None for this gate alone. Proceed with flags/downgrades.
  *   **Output:** Historical Caution Flag (Yes/No), Coherence Strength (Strong/Weak), Level Downgrade (Yes/No).

  ### **Gate 4: Anthropic/Typicality Test (If Applicable)**
  *   **Question (If Anthropic argument used):** **a)** Is the *measure* over possibilities justified *independently* of obtaining the observed outcome? **b)** Could plausible changes to the measure/possibilities make the observed outcome *unexpected*?
  *   **Sufficient Answer:** **a)** Yes (e.g., "Measure derives from fundamental dynamics/symmetries"). **b)** Yes (e.g., "If measure Z were used instead, Λ would likely be larger").
  *   **Time Pressure Fallback (3 mins):** If unclear on (a) or (b) → **Record:** "*Anthropic argument relies on non-independent measure or lacks robustness.*" → **Cap at L1** if not already capped. If clearly "No" to (a) or (b) → **Record:** "*Anthropic step unfalsifiable in local context.*" → **Downgrade within L1**.
  *   **Stop Rule:** None. Proceed with cap/downgrade.
  *   **Output:** Measure Independence (Yes/No/Unclear), Robustness (Yes/No/Unclear), Cap/Downgrade.

  ### **Gate 5: Horizon & Renewal Check**
  *   **Question:** **a)** What **concrete milestone** (theoretical/non-empirical) signifies progress by the grant's end? **b) (Renewals Only)** Has the prior grant delivered *any* milestone (even if not the initial one)? What is the **failure signal** (what *won't* happen if the program stalls)?
  *   **Sufficient Answer:** **a)** Specific, non-trivial outcome (e.g., "Resolve tension X," "Extend formalism to cover Y," "Produce publicly usable code Z"). **b)** Prior: Evidence of milestone/failure signal met. Failure signal must be *falsifiable* (e.g., "No novel dualities found," "Model fails on new stylized fact class").
  *   **Time Pressure Fallback (3 mins):** **a)** If milestone vague/absent → **Record:** "*No clear progress marker.*" → **Cap at minimal L1 funding (if funded)**. **b)** (Renewal) If prior milestones vague/not met AND no failure signal defined → **Record:** "*No stall signal defined; sunk cost risk high.*" → **Downgrade priority strongly**.
  *   **Stop Rule:** For **New Proposals:** If *no plausible milestone* can be articulated → **STOP. Fail.** (Too speculative even for L1). For **Renewals:** If *prior milestones not met AND no failure signal defined* → **STOP. Fail.** (Sunk cost trap).
  *   **Output:** Milestone Defined (Yes/No), (Renewal) Prior Progress (Yes/No/Partial), Failure Signal Defined (Yes/No), Cap/Downgrade.

  ---

  ### **Running the Procedure: Three Applications**

  #### **Application 1: Eternal Inflation (New Proposal)**
  *   **Gate 1:** Claims L3 implicitly (public lectures presenting as "likely"). Justification: Anthropics, no rivals. **STOP. FAIL at Gate 1.** Non-empirical arguments cannot support L2/L3. Warrant Laundering Check: Aims/Impact demand L3 while justification is non-empirical → Flag confirms failure reason. *No further gates.*
  *   **Panel Action:** Reject, or offer funding *only* if public lectures are removed/downgraded to "exploratory concepts" and warrant claim revised to L1.

  #### **Application 2: Quantum Gravity (Renewal)**
  *   **Gate 1:** Likely claims L2/L3 implicitly ("default setting", hiring/curriculum). Justification: Dualities (internal coherence), no rivals, historical analogy (ambitious theories succeed). **STOP. FAIL at Gate 1.** Non-empirical arguments cannot support L2/L3. Warrant Laundering Check: Hiring/curriculum request demands L2/L3 → Flag confirms. *No further gates.*
  *   **Panel Action:** Reject renewal *as framed*. Could fund at L1 if hiring/curriculum language is removed and warrant explicitly limited to L1 in rationale.

  #### **Application 3: Agent-Based Macroeconomics (New Proposal - You want to fund)**
  *   **Gate 1:** Likely claims L1 (exploratory). Justification: Fit stylized facts, coherence, lack of alternatives. **Sufficient (L1).** Public impact? (Assume modest). Laundering Check: Probably clean if aims are "develop/explore". **Proceed.**
  *   **Gate 2:** Rival named? (e.g., "Standard DSGE", "Non-equilibrium approaches"). Comparative expectation? (e.g., "Our model generates fat tails endogenously; rival R requires ad hoc shocks"). **Sufficient (Named Rival, Comparative Claim Made). Proceed.**
  *   **Gate 3:** Historical check? (Form: fit stylized facts + coherence → e.g., early DSGE models also fit stylized facts). **Caution Flag Raised.** Coherence? (Linking micro behaviors to macro patterns non-trivially?) **Assume Strong.** **Proceed with Caution Flag.**
  *   **Gate 4:** Anthropics? N/A. **Proceed.**
  *   **Gate 5:** Milestone? (e.g., "Apply model to new asset class Z", "Release open-source version"). Failure signal? (Implied: "Cannot reproduce stylized fact Y", "Model crashes on standard dataset X"). **Sufficient.** **Proceed.**
  *   **Outcome: PASS at L1.** Warrants exploratory funding. Historical caution flag noted but doesn't block L1.
  *   **Honest Amendment Check:** If it failed (e.g., at Gate 2 if no rival named), amending the procedure to allow "no rival" for highly novel fields *could* be principled *if* applied uniformly (e.g., "Novelty Exemption" if field <10 years old). Allowing non-empirical arguments to support L2/L3 would *not* be principled; it would gut the core anti-laundering rule. Your desire to fund doesn't inherently break the procedure here.

  ---

  ### **Preamble Disclaimer (One Sentence for Provost)**
  "This procedure assesses the *strength and scope* of epistemic warrant for non-empirically testable frameworks within the grant period; it delivers no credence, cannot rank bets across fields, and cannot resolve whether unsuccessful searches reflect ontological limits or sociological constraints."
