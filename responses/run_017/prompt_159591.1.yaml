answer: |-
  ### Activity: The Moving Color Disk Experiment

  **Materials and Setup:**
  - **Projector & Computer:** Pre-loaded with a custom stimulus program (e.g., Python/Pygame script, PowerPoint with timed animations, or Psychopy) displaying disks on a blank background.  
  - **Room:** Fully darkenable.  
  - **Response System:**  
    - **Perceptual Report:** Paper response sheets for Part 1 (trials 1–23), with checkboxes for options (see below).  
    - **Change Detection:** Physical keys (e.g., two USB numeric keypads labeled "A" and "B" for Teams A/B) or colored cards (red/blue) for hand-raising. Use a visible count-up timer (ms precision) on screen during Part 2.  
  - **Handouts:** Two sealed envelopes for Teams A and B (open after teams form).  
    - **Team A Envelope:** "Hypothesis A: When the first disk flashes, you experience it as is. After the second disk flashes, your brain retroactively edits the memory of the first disk to include motion and color change. The final memory is a 'rewritten history' of what happened."  
    - **Team B Envelope:** "Hypothesis B: Your brain delays experiencing anything until after both disks flash. Only then does it construct a single, seamless event with motion and color change. The final memory is the first and only experience you ever had."  
  - **Whiteboard:** For recording predictions, wagers, and results.  

  **Stimulus Parameters (Pilot-Tuning Guide):**  
  - **Disk Properties:**  
    - Size: 1.5° visual angle (adjust disk diameter based on projector distance to ensure visibility).  
    - Colors: Red (RGB 255,0,0) and Green (RGB 0,255,0).  
    - Locations: Disk 1 (left: 30% screen width), Disk 2 (right: 70% screen width), same vertical center.  
  - **Timing (calibrate pre-class):**  
    - Disk 1 duration: 50 ms.  
    - Inter-stimulus interval (ISI): 50 ms (blank screen).  
    - Disk 2 duration: 50 ms.  
    - **Pilot Tuning:** Test with 5–10 subjects (e.g., colleagues). Increase ISI to 70–100 ms if illusion is weak (<80% report motion/change); reduce to 30–40 ms if motion is jerky. Ensure illusion holds for swapped colors (Disk 1 green, Disk 2 red).  
  - **Trial Types:**  
    - **Standard (S):** Red Disk 1 → Green Disk 2 (10 trials).  
    - **Omission (O):** Red Disk 1 → no Disk 2 (5 trials).  
    - **Color Swap (C):** Green Disk 1 → Red Disk 2 (5 trials).  
    - **Control (N):** Single disk (3 trials: 2 left, 1 right).  

  **Trial Schedule:**  
  - **Part 1 (Perceptual Report):** 23 trials (random order: S, O, C, N intermixed).  
  - **Part 2 (Change Detection):** 15 trials (10 S + 5 C, random order).  
  - **Total Trials:** 38 (≈35 sec total stimulus time; allow 20 sec/trial for responses/setup).  

  **Rules and Payoff Scheme:**  
  - **Teams:** Split into Team A (7) and Team B (7).  
  - **Predictions & Wagers (pre-trial):**  
    - Teams predict outcomes for all trial types using handouts.  
    - **Perceptual Report Predictions (Part 1):** For S, O, C, N, predict the dominant response:  
      - Options: "Static flash(es)", "Moving, no color change", "Moving, color at start", "Moving, color mid-flight", "Moving, color at end".  
    - **Change Detection Prediction (Part 2):** For S trials, predict average reported change time (ms).  
    - **Wagers:** Each team starts with 50 points. Wager 0–10 points per prediction (5 total: 4 for Part 1, 1 for Part 2). Record publicly.  
  - **Scoring:**  
    - **Part 1:** Correct if >50% of class reports the predicted dominant response.  
    - **Part 2:** Correct if average time is within 20 ms of prediction.  
    - Win/lose wagered points per prediction.  

  **90-Minute Timeline:**  
  - **0:00–5:00:** Divide into Teams A/B. Distribute sealed envelopes. Instruct: *"Open envelopes. Discuss your hypothesis and predict what the class will experience. You have 10 min. Write predictions/wagers for S, O, C, N trials and change timing."*  
  - **5:00–15:00:** Team discussion. Instructor circulates, answers logistics only (no hypothesis hints).  
  - **15:00–20:00:** Teams write predictions/wagers on whiteboard.  
  - **20:00–35:00:** **Part 1 (Perceptual Report).** Darken room. Run 23 trials.  
    - *Trial Flow:* Fixation cross (500 ms) → Stimulus → Blank screen (2,000 ms; students mark response sheets).  
    - *Response Sheet Options:* Pre-printed grid with trial numbers and checkboxes for the 5 perceptual options.  
  - **35:00–45:00:** **Part 2 (Change Detection).** Run 15 trials.  
    - *Trial Flow:* Fixation cross (500 ms) → Stimulus → Visible timer starts at 0 ms, runs 1,000 ms. Students press key/raise card at change moment. Record times.  
  - **45:00–55:00:** Tabulate results. Tally Part 1 dominant responses per trial type. Calculate Part 2 average time for S trials.  
  - **55:00–70:00:** Compare results to predictions. Award/lose points.  
  - **70:00–90:00:** Debrief (guide below).  

  **Debrief (Map to Distinction):**  
  - **70:00–72:00:** *"What did you experience in S trials?"* (Elicit: motion, mid-flight color change.)  
    - **Map:** Illusion of change *before* Disk 2 is shown → Forces timing question.  
  - **72:00–75:00:** *"How did Teams A and B explain this?"* Restate hypotheses without labels.  
    - **Map:** Team A: Post-hoc editing (memory rewrite). Team B: Delayed construction (first experience is complete).  
  - **75:00–78:00:** *"Why did both teams predict the same results?"*  
    - **Map:** Both hypotheses predict identical reports (illusion) and change timing (mid-motion). Empirical equivalence.  
  - **78:00–82:00:** *"What about catch trials?"*  
    - **Omission (O):** Report static flash (no revision/construction if no Disk 2).  
    - **Color Swap (C):** Illusion holds (rewrite/construction overrides actual sequence).  
    - **Map:** Catch trials rule out anticipation; both hypotheses handle them.  
  - **82:00–85:00:** *"How did change timing work?"* Average ≈50 ms (midway between Disk 1 at 0 ms and Disk 2 at 100 ms).  
    - **Map:** Team A: Change "remembered" at 50 ms (rewrite). Team B: Change "experienced" at 50 ms (construction).  
  - **85:00–88:00:** Introduce **Orwellian/Stalinesque distinction**:  
    - "Orwellian": Post-experiential memory revision (Team A).  
    - "Stalinesque": Pre-experiential fabrication (Team B).  
  - **88:00–90:00:** *"Why can’t we break the tie?"*  
    - **Honest Note:** The activity cannot stage **neural timing**. Subjective reports are identical; only neural data (e.g., EEG) could show if early sensory activity (Disk 1) is "erased" (Orwellian) or never conscious (Stalinesque).  

  **Predictable Problems & Fixes:**  
  1. **Illusion Fails for Some:**  
     - *Fix:* Use majority reports. If >30% don’t experience it, re-pilot ISI (adjust pre-class).  
  2. **Change Timing Inaccuracy:**  
     - *Fix:* Use keypress/card-raise with on-screen timer. If noise persists, focus on average (ignore outliers).  
  3. **Teams Make Divergent Predictions:**  
     - *Fix:* Circulate during discussion, ask: *"What would your hypothesis imply for O trials?"* (Both should predict "static flash").  
  4. **Time Overrun:**  
     - *Fix:* Reduce trials (e.g., 6 S, 3 O, 3 C, 2 N; 8 S+C for Part 2). Skip detailed tally; use show of hands.  
  5. **Response Errors:**  
     - *Fix:* Simplify sheets (e.g., "Moving color-change at mid-flight" as one checkbox). Use clear examples in instructions.  

  **One Honest Limitation:**  
  - The activity cannot stage **the neural threshold for consciousness**. It shows behavioral equivalence but cannot address whether Disk 1 is *initially* conscious (Orwellian) or *never* conscious (Stalinesque). You must argue this with neural evidence (e.g., Libet-style delays, sensory buffer studies).  

