  **Stimulus Code Snippet (Pygame Example):**  
  ```python
  import pygame, random, time  
  pygame.init()  
  screen = pygame.display.set_mode((800, 600))  
  clock = pygame.time.Clock()  

  # Locations/Colors  
  left_pos, right_pos = (240, 300), (560, 300)  
  colors = {"red": (255,0,0), "green": (0,255,0)}  

  def run_trial(trial_type):  
      # Fixation cross (500 ms)  
      screen.fill((0,0,0))  
      pygame.draw.line(screen, (255,255,255), (390,300), (410,300), 2)  
      pygame.draw.line(screen, (255,255,255), (400,290), (400,310), 2)  
      pygame.display.flip()  
      time.sleep(0.5)  

      # Disk 1  
      screen.fill((0,0,0))  
      color1 = colors["green"] if trial_type == "C" else colors["red"]  
      pygame.draw.circle(screen, color1, left_pos, 30)  
      pygame.display.flip()  
      time.sleep(0.05)  # 50 ms  

      # ISI (50 ms)  
      screen.fill((0,0,0))  
      pygame.display.flip()  
      time.sleep(0.05)  

      # Disk 2 (if not Omission/Control)  
      if trial_type != "O" and trial_type != "N":  
          color2 = colors["red"] if trial_type == "C" else colors["green"]  
          pygame.draw.circle(screen, color2, right_pos, 30)  
          pygame.display.flip()  
          time.sleep(0.05)  

      # Blank screen (2,000 ms for Part 1; timer for Part 2)  
      screen.fill((0,0,0))  
      pygame.display.flip()  

  # Example trial sequence  
  trials = ["S"]*10 + ["O"]*5 + ["C"]*5 + ["N"]*3  
  random.shuffle(trials)  
  for trial in trials:  
      run_trial(trial)  
      time.sleep(2.0)  # Response period  
  ```  
  *(Adjust as needed for your tech setup.)*
