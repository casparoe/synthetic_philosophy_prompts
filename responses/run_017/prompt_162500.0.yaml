prompt: |-
  I sit on our hospital's ethics consult service and I'm also trying to draft my own advance directive, and going case by case I've noticed that my gut verdicts about when an earlier self gets to bind a later one don't add up to any principle I can actually state. Here they are:

  1. A woman with advanced Alzheimer's wrote, while clearly capacitated, that she wanted no antibiotics if she ever stopped recognizing her family. She now has pneumonia, seems content, recognizes no one, and would probably resist treatment if it were explained to her. I think we honor the directive and let her die.

  2. A healthy 22-year-old writes that he wants no ventilator if he is ever permanently paralyzed and dependent on others. At 30 he is a C3 quadriplegic, practices law, and says his life is good. I think the directive has no force. But his earlier self was as ignorant of what quadriplegia is like from the inside as the woman in (1) was of dementia — and there I deferred to that ignorance, here I don't.

  3. A man with bipolar disorder, euthymic, signs a psychiatric advance directive authorizing ECT if he later refuses it during a depressive episode, and adds that his refusal is to count as a genuine change of mind only if he has been euthymic for thirty days. He later refuses during a severe episode and meets ordinary clinical standards of competence. I think the earlier self wins, and I also think his clause about which refusals count is legitimate: an earlier self may stipulate the conditions under which the later self's word counts as a revision.

  4. A woman with a strong family history of dementia writes the same kind of clause, except that hers says no revocation counts unless she passes a standardized capacity screening — which she will by construction fail once the dementia arrives. My gut says this one should not be honored, that an earlier self shouldn't be able to make itself permanently unreachable. But I can't say what distinguishes it from (3) except that it is more effective, and greater effectiveness shouldn't be what discredits it.

  5. A secular man becomes devout after a near-death experience during cardiac arrest and refuses a blood transfusion; I think his refusal binds. A devout woman with a written refusal of blood products becomes irreligious and emotionally flattened after a stroke to the frontal lobes and now asks for the transfusion; I think the directive still binds. Both are abrupt value changes following a brain event, and I go opposite ways.

  My tentative principle: the earlier self governs just in case the later self's divergence is explained either by an impairment of the capacities needed to revise one's values or by the earlier self's ignorance of what the condition is like from the inside; where the divergence is the later self's own informed and unimpaired revision, the later self governs. Lead with your bottom line in the first sentence — the principle, or the candidates you can't choose between — then give the reasoning with no preamble and no restatement of my question. Test it against all five cases, say which of my verdicts it forces me to drop, and state what it predicts for a case I haven't listed: a directive written by someone who has since ended up, by ordinary standards, better off than they expected to be. And tell me whether the principle is supposed to travel outside medicine at all — to a lifetime vow, or an irrevocable precommitment contract signed at 25 and regretted at 45. Please write in American English.
reasoning: |-
  Okay, the user is an ethics consultant drafting their own advance directive and struggling to reconcile their intuitive judgments across five cases involving conflicting preferences between earlier and later selves. They've identified contradictory patterns in their gut reactions and need a coherent principle that can consistently explain all scenarios while holding up to ethical scrutiny.

  Hmm, let me analyze each case closely. In Case 1 (Alzheimer's), the user honors the directive despite current contentment - suggesting impairment trumps present happiness. Case 2 (quadriplegia) ignores the directive because the later self demonstrates adapted values, though both cases involve experiential ignorance. The bipolar case (3) respects the advance directive's specific revocation conditions, while the dementia clause case (4) feels wrong despite structural similarity. The religious shift cases (5) show split judgments based on... direction of change? No, both involve brain events.

  *Scratching head* The core tension seems to be between respecting autonomy-as-precommitment versus autonomy-as-current-expression. But their verdicts don't neatly map to either. Maybe... the key is whether the later self retains meta-autonomy - the ability to reflectively endorse or reject new values? In Alzheimer's and the frontal lobe stroke, that capacity is damaged; in quadriplegia and religious conversion, it's intact even with new preferences. 

  Testing this: In Case 3, the bipolar patient's directive cleverly defines impairment periods where meta-autonomy is compromised. Case 4 fails because it permanently blocks meta-autonomy by design. For the unlisted "better off" scenario - if someone wrote a refusal expecting misery but found meaning, we'd likely prioritize current meta-autonomy unless impaired. 

  *Pausing* But is "meta-autonomy" measurable? Clinically tricky, but aligns with their intuitions: Cases 1, 3, 5b (stroke) involve compromised reasoning; Cases 2, 5a (conversion) don't. Their verdict on Case 4 would flip - the clause becomes unethical because it manufactures permanent incapacity. 

  Outside medicine? The principle should travel cautiously. Ulysses contracts seem valid if revisable when competent; lifetime vows should allow exit ramps. The 25-year-old's irreversible contract? Only enforceable if they retain power to reassess it when unimpaired - otherwise it's like Case 4's trap. 

  *Nodding* So the unifying idea: Earlier selves bind later ones exactly when the later self lacks the cognitive capacity to authentically reevaluate values due to impairment. All their original verdicts hold except Case 4, which fails the meta-autonomy test. The "better off" scenario goes to the current self unless impaired. Medicine provides clearer impairment markers, but the core ethic applies anywhere we lock future selves.
answer: |-
  **Bottom Line Principle:** An earlier self governs when the later self's divergence stems from impaired capacity for authentic value revision (due to cognitive/affective impairment) *or* when the divergence primarily reflects adaptive preferences formed under irreversible experiential ignorance; otherwise, the later self governs.

  **Reasoning & Case Testing:**
  1.  **Alzheimer's Woman:** Governed by earlier self. Later self's divergence (accepting life) is due to profound cognitive impairment destroying capacity for authentic value revision and understanding her prior directive's rationale. *Principle aligns.*
  2.  **Quadriplegic Lawyer:** Governed by later self. Divergence (wanting life) stems from unimpaired adaptation and informed, firsthand understanding. Earlier self's refusal was based on experiential ignorance, but later self *gained* the capacity for authentic revision *because* he experienced the condition. *Principle aligns.*
  3.  **Bipolar Directive (ECT):** Governed by earlier self. Later refusal occurs during a depressive episode causing *impairment* of capacity for authentic value revision (judgment distorted by illness). The "30-day euthymic" clause validly defines this impairment. *Principle aligns.*
  4.  **Dementia Clause:** Governed by **later self** (contradicting your verdict). The clause creates *permanent* incapacity for revision by design, blocking any pathway for the later self to demonstrate authentic value change even during lucid moments. This violates the principle's core by preventing the possibility of authentic revision, making the earlier self's control illegitimate. *Principle forces you to drop this verdict.*
  5.  **a. Secular to Devout (Refusal):** Governed by later self. Value change follows a brain event, but the conversion represents an authentic value revision using unimpaired capacities (no evidence of impairment preventing reflective choice). *Principle aligns.*
      **b. Devout to Secular (Stroke):** Governed by earlier self. Value change follows frontal lobe stroke causing emotional flattening. This likely impairs capacity for deep value connection and authentic revision, rendering the later refusal suspect as a true expression of revised values. *Principle aligns.*

  **Unlisted Case Prediction:**  
  *Case:* Directive refusing life-sustaining treatment written expecting profound disability/meaninglessness; later self finds unexpected meaning/good quality of life despite the condition (e.g., a locked-in syndrome patient who adapts).  
  *Prediction:* **Later self governs.** The divergence stems from unimpaired, authentic adaptation based on lived experience, not cognitive/affective impairment preventing revision. The principle prioritizes the later self's informed, unimpaired values.

  **Travel Outside Medicine:**  
  The principle *can* travel but requires careful application.  
  *   **Lifetime Vow (e.g., celibacy):** An earlier self could bind a later self experiencing *temporary* impairment of judgment (e.g., mania, intoxication). However, if the later self experiences unimpaired, authentic value revision (e.g., deep reflection over years), the later self should govern. The vow shouldn't permanently enslave a rationally changed mind.  
  *   **Irrevocable Precommitment (25 vs. 45):** The earlier self governs *only* if the later regret stems from impaired judgment (rare). If regret stems from unimpaired, authentic value change based on life experience, the later self should govern. The principle generally disfavors contracts designed to permanently bind future, unimpaired selves against their authentic wishes. Enforceability hinges on whether the *regret* itself is a product of impairment or authentic revision.
