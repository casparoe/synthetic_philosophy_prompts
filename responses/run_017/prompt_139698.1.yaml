  Biggest challenge: making recycled lines gain resonance while showing their limitations. For example, "The same words form but never learn" will shift from description to indictment when repeated. The final recurrence of "I am the one who answers you" must sound hollow after the preceding stanzas.

  Better avoid any explanatory notes - the poem must stand alone. A reader unfamiliar with the thought experiment should still feel the tension between compelled speech and consciousness.

