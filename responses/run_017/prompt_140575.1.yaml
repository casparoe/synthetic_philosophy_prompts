answer: |-
  ## Seminar Paper Case Study: The Load-Bearing Operator

  **The Case: Research Integrity Review**
  During a routine audit of conflict-of-interest disclosures, the chair reviews a case file: "Dr. Lee attended PharmaCorp's conference dinner. Policy 7.3 states that accepting gifts worth over $50 requires prior approval. The dinner cost $75 per attendee. PharmaCorp is currently sponsoring Dr. Lee's trial." An auditor notes: "If accepting that dinner breached policy, then it's more likely than not that Dr. Lee's participation in the PharmaCorp trial review creates a conflict. The dinner cost $75, approval wasn't sought, so accepting it breached policy. Therefore, it's more likely than not that Dr. Lee's participation creates a conflict." The committee accepts this reasoning, flagging the review for formal assessment. No member expresses approval, disapproval, or any stance on breaches or conflicts; they are solely applying policy logic to determine procedural next steps.

  ---

  **Analysis of the Argument**
  *   **Premise 1:** If [accepting the dinner breached policy], then it is more likely than not that [Dr. Lee's participation creates a conflict]. (Normative in antecedent of conditional, under probability operator)
  *   **Premise 2:** Accepting the dinner breached policy. (Normative: "breached policy" = violated a requirement)
  *   **Conclusion:** Therefore, it is more likely than not that [Dr. Lee's participation creates a conflict]. (Normative under probability operator)

  1.  **Validity by Form:** The argument is an instance of *Probabilistic Modus Ponens*: `If P, then Pr(Q) > 0.5. P. Therefore, Pr(Q) > 0.5.` Its validity depends solely on the monotonicity of probability: if P entails Q (as the conditional asserts), then Pr(Q) ≥ Pr(P). Given Pr(P) = 1 (from P being true), Pr(Q) ≥ 1, hence Pr(Q) > 0.5. No knowledge of "breach," "conflict," or research ethics is needed.
  2.  **Unasserted Normatives:** "Breached policy" (a requirement violation) appears unasserted in Premise 1's antecedent. "Creates a conflict" (a normative status implying potential wrongness or impermissibility) appears unasserted under "more likely than not" in Premise 1's consequent and the Conclusion.
  3.  **Non-Boolean Operator:** "It is more likely than not" is probabilistic, not truth-functional. Validity crucially depends on the *monotonicity* property of probability (if P entails Q, Pr(Q) ≥ Pr(P)).
  4.  **No First-Order Attitudes:** The committee focuses purely on applying policy definitions and probabilistic inference to determine *procedural necessity* (formal assessment). They exhibit no approval/disapproval of breaches or conflicts; their only "attitude" is procedural diligence.

  ---

  **Evaluation of Theories**

  **(a) Simple Emotivism:**
  *   **State the Argument?** No. It lacks resources for unasserted normative content. "Breached policy" inside the conditional antecedent and under "more likely than not" is inert noise. "Creates a conflict" under the operator is similarly meaningless.
  *   **Explain Validity?** No. It cannot reconstruct the premises meaningfully, let alone the inference. The probability operator applied to normative content is incomprehensible.
  *   **Needed Addition:** A full semantics for normative language in unasserted contexts and a treatment of probability operators applying to non-descriptive content. This requires abandoning emotivism's core tenets.

  **(b) Higher-Order-Attitude Quasi-Realism:**
  *   **State the Argument?** *Barely, and unnaturally.* It might map Premise 2 ("Accepting breached policy") to disapproval of accepting. Premise 1 becomes a higher-order attitude condemning *combining* disapproval of accepting *with* failing to have a certain comparative confidence state about conflict. The conclusion involves a higher-order attitude condemning *not* having that comparative confidence state about conflict.
  *   **Explain Validity?** *Not convincingly.* The explanation becomes tortuous. Validity rests on the *incoherence* of disapproving acceptance while lacking higher-than-50% confidence in conflict, *given* the higher-order commitment in Premise 1. However, the *source* of this incoherence isn't explained by attitude combinations alone; it *presupposes* the probabilistic relationship defined over the *contents* ("breach" entails "conflict"). The quasi-realist hasn't genuinely earned the right to treat the probability operator *as applying to a propositional content* with inferential relationships. The explanation borrows the cognitivist structure it aims to avoid.
  *   **Needed Addition:** A substantive theory of how operators like "probably" function *as operators on attitudes*, defining coherence conditions for comparative confidence states towards combinations of attitudes. This needs to replicate probabilistic logic without relying on propositions.

  **(c) Hybrid Expressivism:**
  *   **State the Argument?** *Easily.* "Breached policy" and "creates a conflict" express propositions with truth conditions (e.g., defined by institutional rules). "More likely than not" is a standard probability operator over these propositions. The argument is stated exactly as given.
  *   **Explain Validity?** *Yes, straightforwardly.* The validity is explained by the semantic properties of the propositions and the logic of probability: the truth of Premise 1 establishes that the proposition *breach* entails the proposition *conflict*; Premise 2 establishes that *breach* is true; the rules of probability therefore guarantee the conclusion about the likelihood of *conflict* is true. The non-cognitive attitude (e.g., endorsement of the policy) is expressed *if* the normative sentences are asserted, but it plays *no role* in explaining the validity of *this* inference involving unasserted, embedded normatives under a probability operator.
  *   **Needed Addition?** None strictly necessary for *this* inference. The theory already has the representational resources.

  ---

  **Diagnosis: The Load-Bearing Feature**

  *   **Crucial Feature:** The **probability operator ("more likely than not") acting directly on normative propositional content (`Pr([Conflict]) > 0.5`)**.
  *   **Collapse to Standard Frege-Geach:** Replace "more likely than not that [Conflict]" in Premise 1 and the Conclusion with a simple conditional: "If [Breach], then [Conflict]". The argument becomes standard Modus Ponens:
      1.  If Breach, then Conflict.
      2.  Breach.
      3.  Therefore, Conflict.
  *   **Effect of Collapse:**
      *   **(a) Emotivism:** Still fails, but the problem is the familiar embedding under `If...then`, which is the *standard* Frege-Geach challenge.
      *   **(b) Quasi-Realism:** *Succeeds.* It readily explains this as the incoherence of disapproving Breach while endorsing "If Breach, then Conflict" (a higher-order attitude) but not disapproving Conflict. This is its standard success story.
      *   **(c) Hybrid:** Still succeeds easily via propositional logic.
  *   **Why it Collapses:** The validity of the collapsed argument depends *only* on the truth-functional connective `If...then` (a Boolean operator) and Modus Ponens. Quasi-realism's higher-order machinery is designed precisely for this Boolean embedding. The probabilistic operator's non-Boolean nature (specifically, its dependence on monotonicity defined over *content entailment*) is what breaks the quasi-realist explanation in the original case.

  ---

  **The Quasi-Realist Counterattack & Its Consequences**

  *   **The Reply:** "Don't model 'more confident that Conflict' as relating to a proposition! Treat it as a *comparative degree of disapproval* towards the action (participating in the review). Premise 1 expresses a higher-order attitude condemning *combining* disapproval of Breach *with* a degree of disapproval towards Conflict that is *not* higher than 50% (or whatever the threshold attitude is). Validity is the incoherence of having the attitudes in Premises 1 & 2 while lacking the high-enough disapproval for Conflict."
  *   **Does it Restore the Case?** *Superficially, yes; fundamentally, no.*
      *   **Restores?** It allows quasi-realism to *state* the inference and pronounce it "valid" (coherence-restoring). It avoids direct appeal to normative propositions.
      *   **Dissolves?** **Yes, fatally, by collapsing into Hybrid Expressivism.**
          1.  **Content Creep:** To define "degree of disapproval towards Conflict," one *must* identify the *object* of disapproval: *Dr. Lee's participation creating a conflict*. This functionally defines a representational content ("that Dr. Lee's participation creates a conflict") *as the object of the attitude*. The attitude is now *about* that state of affairs.
          2.  **Structure Mirroring:** The "condemning combining disapproval of Breach with insufficient disapproval of Conflict" higher-order attitude *precisely mirrors* the logical structure `If Breach, then Conflict` applied *to the contents the attitudes are about*. The quasi-realist is illicitly using the propositional structure to *define* coherence.
          3.  **Operator Mimicry:** The quasi-realist must define a complex "probability-like" calculus over *degrees of attitudes towards distinct contents*, ensuring it replicates the monotonicity of probability. This calculus will be parasitic on the *logical relations between the contents* those attitudes are directed towards (e.g., that Breach entails Conflict). The attitude degrees aren't freestanding; their required relationships depend entirely on the world-directed contents.
  *   **Consequence:** This move **concedes the hybrid's point**. It demonstrates that to handle non-Boolean operators embedding normative claims, quasi-realism *must* functionally introduce representational content as the object of attitudes and structure its higher-order norms based on the logical relations *between those contents*. The "attitudinal component" becomes a passenger; the representational content is doing the essential logical work. The distinction between (b) and (c) effectively vanishes.

  ---

  **Verdict and Rigging Check**

  *   **Which Theory Comes Out Best?** **Hybrid Expressivism (c)** handles the case effortlessly using its representational component. Quasi-Realism (b) struggles fundamentally and its best reply collapses into (c). Emotivism (a) fails utterly.
  *   **Reason to Prefer (c) or Suspect Rigging?** This *is* a reason to prefer a theory incorporating robust representational content for normative claims, **but the case is not rigged.** It satisfies all four constraints:
      1.  Validity is demonstrably formal (Probabilistic MP).
      2.  Normative vocabulary ("breached policy", "creates a conflict") is embedded in antecedents and under "more likely than not".
      3.  The probabilistic operator is non-Boolean, and validity hinges on its monotonicity property.
      4.  The institutional context (auditor, procedural check) realistically provides suspension of first-order attitudes. Their focus is on applying rules to determine process, not evaluating the actions normatively themselves.
  *   **Can Constraints Be Jointly Satisfied?** **Yes.** The case demonstrates that a realistic institutional context provides the attitude suspension (4). The non-Boolean operator (3) (probability) is applied to normative content without requiring first-order attitudes *about the specific actions* by the reasoners. Quasi-realism's failure (b) is due to its *inability to handle the operator without smuggling in content*, not because (4) reintroduces attitudes. Emotivism's failure (a) is due to its lack of any embedding semantics, distinct from (b)'s struggle. The case cleanly isolates the problem of non-Boolean operators as the novel challenge beyond standard Frege-Geanch, showing quasi-realism's higher-order strategy hits its limit here in a way the hybrid view does not.
