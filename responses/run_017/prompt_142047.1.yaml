prompt: |-
  I'm on the little rotating committee at work that decides who gets publicly celebrated — all-hands shoutouts, the internal blog post, the engineer-of-the-quarter thing — and I've realised I can't predict our own chair, which is becoming a problem because we're rewriting the recogntion guidelines for next year and I'm the one stuck drafting them. Context that probably matters: we're about half Austin and half Oslo and Stockholm, and the two halves have opposite priors about her. The Americans think she's running some imported Jantelagen / tall-poppy thing — don't think you're anyone special, nobody is more than anybody else, that sort of attitude — and the Scandinavians think the Americans are embarrassing and need to calm down. I don't think she's doing either of those, quite. Her track record so far: she loudly celebrated a junior dev who caught a nasty prod bug, on the explicit grounds that other people should copy what she did; she refused to celebrate and actively deflected congratulations when someone got promoted to staff engineer, saying a title is not an achievement; she celebrated privately only a guy who won the internal hackathon with a demo that got a lot of attention, her reason being that the core idea came out of a discarded prototype somebody else had written; she cut down pretty visibly a senior engineer who started speaking at conferences and building a personal brand, stopped inviting him to internal talks, made jokes about his fan club; she celebrated, against her wishes and over her objections, someone who had quietly mentored three juniors for a year and never mentioned it; she said nothing at all about a designer whose side project went viral and got acquired, her comment to me being right place right time; and when one salesperson closed by far the biggest deal in company history she celebrated the team but not the individual.

  The way I've started thinking about it, mostly because I have no philosophy background and needed something I could actually reason with, is that there are two seperate questions tangled together here: whether the person is creditworthy at all, and whether credit is a thing we should be handing out in public in the first place. She might have an answer to only one of them, or she might be answering both with the same test. The candidate rules I can see fitting her verdicts: celebrate only when the cause was effort and agency rather than luck or circumstance; celebrate only when publicising it will make other people act that way; celebrate the reluctant and deflate the self-promoting; celebrate only what can be shared out and refuse to celebrate anything that creates a visible rank; possibly others I haven't thought of.

  The case actually in front of us: a backend dev in the Oslo office spent roughly three years of his own time on an open-source library, which unexpectedly became the thing half our candidates bring up in interviews; he now has a big public following, earns more from paid workshops on the side than from his salary, and has put in a request to be made Principal Engineer with a profile on the company site. He isn't boastful about it but he's definately not hiding it either, and the request came from him rather than from us. So: what should we do here if we want to be consistent with ourselves, which of our precedents is the closest analog, which of those rules best fits her whole track record rather than just the cases I happen to remember, and where do the plausible rules come apart on this specific one? And if the precedents genuinely don't settle it, I'd rather find out now, along with what principle I'd be silently writing into the document with each choice — because whatever we publish, the Austin half will read it as a statement about whether people here are allowed to be proud of things, and the Oslo half will read it as a statement about the opposite.
reasoning: |-
  Okay, let me unpack this user's problem. They're on a recognition committee stuck between two cultural perspectives - Austin's individualistic approach and Oslo/Stockholm's egalitarian sensibilities. The real challenge is deciphering their chair's seemingly inconsistent recognition patterns to draft new guidelines. 

  Hmm, looking at the chair's track record: she celebrates the junior dev's bug catch (actionable learning), rejects celebrating promotions (status ≠ achievement), downplays the hackathon win (unoriginal idea), suppresses the conference speaker (self-promotion), forces recognition on the reluctant mentor (quiet contribution), ignores the viral side project (luck), and shares credit for the big sales deal (team>individual). There's a clear pattern here - she values modesty, rejects status-seeking, and prioritizes replicable actions over individual glory.

  The current case is tricky: an Oslo dev's 3-year open source passion project that benefits the company. He's not boastful but seeks promotion. Applying the chair's principles: it scores high on effort/agency and has replicable value (good for public celebration), but the Principal Engineer request creates problematic status hierarchy (bad). The mentorship case precedent suggests celebrating the contribution while rejecting the title request.

  I should note the cultural landmines here. If they celebrate only the work but reject the title, Austin may see it as stifling ambition while Oslo approves. If they grant both, it validates individualism against Jantelagen norms. The chair's philosophy seems closest to a "contribution ethics" model - creditworthiness requires controllable effort, and public recognition serves collective improvement. 

  For the guidelines draft, they'll need to explicitly decouple contribution recognition from status elevation. Highlight that visibility ≠ hierarchy, and model recognition after the mentorship case: celebrate teachable actions, separate advancement discussions. The viral project case shows luck-based wins shouldn't be celebrated, while the sales deal demonstrates team attribution matters. 

  Ultimately the user needs to frame this not as "who gets credit" but "what behaviors grow our collective capability." That sidesteps the individualism/egalitarianism debate. Practical drafting tip: use "we celebrate X-type behaviors" not "Y people get recognition."
answer: |-
  Based on her track record and the philosophical tension you've identified, here's a breakdown of how your chair likely operates, how to handle the current case consistently, and how to draft guidelines that navigate the cultural divide:

  ### The Chair's Core Principles (Decoded)
  1.  **Creditworthiness = Effort + Agency + Replicability:** She celebrates actions requiring deliberate effort and skill *within the person's control* that others can learn from or replicate (Junior Dev's bug catch, Reluctant Mentor's sustained effort). Luck, inherent talent, status, or circumstances diminish creditworthiness (Viral Side Project, Big Deal context, maybe the Hackathon's origin).
  2.  **Public Recognition = Tool for Behavioral Reinforcement:** Public celebration is *only* justified if it demonstrably encourages *specific, desirable behaviors* across the team/organization (Junior Dev's diligence, Mentor's selflessness). It's not a reward for outcomes alone.
  3.  **Anti-Hierarchy & Anti-Self-Promotion:** She actively resists anything creating/perpetuating visible status hierarchies (rejecting promotion celebration, team > individual in sales) and suppresses perceived self-aggrandizement (Conference Speaker, potentially the Hackathon winner's demo attention).
  4.  **Modesty Bias:** She values quiet contribution (Mentor) and is deeply skeptical of those seeking the spotlight (Conference Speaker, Principal Engineer request). Reluctance *increases* her willingness to celebrate; seeking recognition *decreases* it.

  **Her Framework:** She *only* considers someone "creditworthy" if they meet Principle #1. She *only* grants **public** credit if it also satisfies Principle #2. Principles #3 and #4 are strong filters/modifiers applied throughout.

  ### The Current Case: Open-Source Dev & Principal Request
  *   **Effort/Agency/Replicability (Principle #1):** **HIGH.** 3 years of personal time demonstrates immense effort and agency. The outcome (popular library, candidate interest) stemmed directly from his skill and dedication. While the *impact* was lucky/unexpected, the *action* was deliberate and high-effort. Others *could* theoretically replicate contributing to OSS (replicability).
  *   **Public Recognition as Reinforcement (Principle #2):** **MIXED/PROBLEMATIC.** *Could* celebrating this encourage valuable OSS contributions? Possibly. *However*, his request for "Principal Engineer" *with a company profile* triggers her Anti-Hierarchy instinct hard. Publicly celebrating him *now*, especially tied to a title/profile, risks reinforcing *individual status-seeking* and creating a visible rank, not just the behavior.
  *   **Anti-Hierarchy/Self-Promotion (Principle #3):** **NEGATIVE.** The *request* for Principal with a profile is the exact type of status elevation and potential self-promotion she has consistently rejected (Promotion, Conference Speaker). This is the biggest red flag for her.
  *   **Modesty Bias (Principle #4):** **NEUTRAL/NEGATIVE.** He's not boastful, but nor is he reluctant. *Initiating* the request for a visible title/profile strongly signals he *wants* recognition, potentially working against him.

  ### The Closest Precedent: The Reluctant Mentor vs. The Conference Speaker
  *   **Similar to Mentor:** High effort/agency (3 years), replicable behavior (contributing value beyond core duties), clear positive impact. The *work itself* aligns.
  *   **Similar to Conference Speaker:** Building a public profile/personal brand, seeking elevated status/visibility *within the company context* (Principal title request). The *perceived self-promotion and hierarchy creation* aligns negatively.

  ### Consistent Verdict (Predicting the Chair)
  1.  **Celebrate the Contribution (Privately or Low-Key Publicly):** Acknowledge the *effort and impact* of the OSS work internally. Frame it as an example of dedication and skill development *others could emulate*. A short, factual internal blog mention focusing on the *work* ("X's dedication to OSS project Y over 3 years has resulted in significant benefits for Z...") *might* pass if it avoids heroics.
  2.  **Reject the Principal Engineer Request (Especially the Profile):** This is the critical point. Granting a highly visible title/profile based on external fame/internal lobbying directly contradicts her rejection of celebrating promotions and suppressing the Conference Speaker's brand-building. It creates the exact hierarchy she dislikes. She might counter-offer a significant raise/bonus (rewarding the *value* without hierarchy) or suggest a *non-public* technical leadership role focused on internal mentorship using his OSS experience.
  3.  **Deflect Individual Spotlight:** Emphasize the value *to the company* (candidate interest) and the *behavior* (dedication to skill-building/OSS) rather than the individual's fame or earnings. Avoid anything resembling a "fan club."

  ### Where the Plausible Rules Come Apart (and Create Tension)
  *   **Effort/Agency vs. Anti-Hierarchy:** His effort is immense and creditworthy (Rule 1). But granting the requested status *because* of that effort violates Rule 3. Celebrating the work quietly satisfies 1 & 3 but might frustrate Rule 2 advocates who see public reinforcement value.
  *   **Reinforcement vs. Modesty/Self-Promotion:** Publicly celebrating *could* reinforce valuable OSS contributions (Rule 2). However, doing so *after he requested a status boost* risks reinforcing *status-seeking* instead, and violates her Modesty bias (Rule 4). Celebrating the reluctant mentor worked because her modesty proved the action's purity; his request undermines that perception.

  ### Drafting Guidelines: Navigating the Cultural Minefield
  Your goal is **not** to make everyone happy, but to create **clear, principle-based guidelines** that explain *why* decisions are made, addressing both creditworthiness *and* the purpose of public recognition. Frame it around **"What behaviors do we want to encourage?"**

  **Core Principles for the Document:**
  1.  **We Recognize Behaviors, Not Just Outcomes:** We highlight actions demonstrating specific, replicable behaviors we value (e.g., proactive problem-solving, sustained mentorship, exceptional craftsmanship, knowledge sharing). Impact matters, but the *how* and *why* matter more. (Addresses Effort/Agency/Replicability).
  2.  **Public Recognition Serves the Collective:** We use public celebration primarily to spotlight examples that inspire others and reinforce desired cultural norms and behaviors across our teams. (Addresses Purpose of Public Recognition/Reinforcement).
  3.  **Credit Reflects Contribution, Not Status:** Recognition focuses on the *contribution* itself. While individual effort is celebrated, we avoid mechanisms that primarily create or emphasize formal internal hierarchies based on recognition. Advancement discussions are separate. (Addresses Anti-Hierarchy, separates credit from promotion).
  4.  **Modesty in Recognition:** We value contributions made for the sake of the work and the team. While recognition is deserved, we encourage a culture where credit is shared and the focus remains on collective progress. (Softens Modesty Bias into a cultural value, not a hard rule).
  5.  **Context Matters:** The appropriateness and form of recognition (public vs. private, individual vs. team) depend on the nature of the contribution, the individual's role, and the potential impact of the recognition itself.

  **Applying to the Current Case (for Transparency):**
  *   "The significant effort and skill demonstrated in developing impactful open-source work over an extended period aligns with our value of craftsmanship and knowledge sharing (Principle 1). This contribution benefits our collective technical reputation and recruitment (Principle 2). Recognition would focus on the *work and its impact* (e.g., internal blog post about the project's benefits). Requests for specific, highly visible title changes or individual profiles based on external recognition fall under separate career advancement processes and are not part of our public recognition program (Principle 3)."

  **Why this approach works for the cultural divide:**
  *   **For Austin (Individualistic):** It affirms that individual effort *is* recognized and valued (Principle 1). It allows for public celebration of great work (Principle 2). It doesn't ban pride or ambition; it just decouples public recognition from formal status elevation (Principle 3). People *can* be proud; the *company* just won't build hierarchies *based on that pride* in its public celebrations.
  *   **For Oslo/Stockholm (Jantelagen-leaning):** It explicitly focuses on the collective good (Principle 2, 4), avoids creating status-based hierarchies through recognition (Principle 3), and values modesty (Principle 4). It channels recognition towards behaviors benefiting everyone.
  *   **For the Chair:** It codifies her core philosophy (Effort/Agency/Replicability + Recognition as Reinforcement Tool) and provides a framework to reject status-seeking recognition (Anti-Hierarchy) while allowing celebration of genuine contribution.

  **Key Drafting Tips:**
  *   **Use Behavioral Examples:** List concrete behaviors you *want* to encourage (like the Junior Dev, Mentor) as examples under Principle 1.
  *   **Distinguish Recognition from Advancement:** Be crystal clear that the recognition program is separate from promotions, comp changes, or title changes. Principle 3 is crucial here.
  *   **Specify Recognition Channels:** Define *how* different types of contributions might be recognized (e.g., All-Hands shoutout for quick wins/visible saves, Internal Blog for sustained effort/projects, private manager recognition for quieter contributions).
  *   **Acknowledge the Cultural Context:** Briefly state that the guidelines aim to respect diverse perspectives on recognition while fostering a cohesive culture focused on shared goals and valued behaviors. Don't try to define Jantelagen vs. Individualism; define *your company's* principles.

  By grounding the guidelines in the *purpose* of recognition (encouraging good behaviors for the collective) and clearly separating it from status/promotion, you create a framework that can withstand both the chair's philosophy and the cultural interpretations. The Oslo dev's case becomes a powerful test: celebrate the *behavior* (dedicated OSS contribution), reject the *status play* (Principal request via profile), and explain *why* using the principles.
