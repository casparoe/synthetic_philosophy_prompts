prompt: |-
  I own privacy review at a company of about two hundred people that ships a consumer app in which users keep a structured daily journal — mood, sleep, symptoms, free text — and get predictions and nudges back. Every feature that touches user data comes through me: roughly six reviews a month, about forty-five minutes each, and the output has to be a single page — go, no, or go with conditions — that a product lead with no philosophy and no legal training can read, argue with, and sign. When I am away a junior PM runs them, so the procedure cannot depend on my having internalized the theory. Outside counsel handles compliance and is, for my purposes, useless: the answer to everything is get consent, and we have already watched our consent flow get optimized by onboarding copy until the number stopped meaning anything.

  Our reviews have settled into three failure modes I want a procedure to break. Anything described as on-device or anonymized is waved through; I think this is a cached thought rather than an argument. Anything else is argued about in the vocabulary of creepiness, which means reviewers pattern-matching to an affect and then rationalizing, and which reliably misranks the cases. And because we cannot say what the thing we are protecting actually is, the conditions we attach are arbitrary and unenforceable six months later.

  So: give me a decision procedure, grounded in what is actually known about the nature and value of privacy, that my team can run on a proposal. I want the ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the remaining question is one of values, and what to do at each step when the number you want cannot be had — we cannot estimate re-identification probabilities, we cannot elicit users' true preferences, and I would rather have a rule that says guess conservatively here and flags itself than one that pretends to precision. Please also state plainly which account of privacy's value the procedure is buying — a control account, an access account, a contextual-integrity account, something consequentialist about downstream harm — and what that choice costs us, because I expect the thresholds to move with it and I want to know which of our past decisions we would have to revisit under a different one.

  Several distinctions I insist survive simplification, because they are where our arguments actually stall.

  First, privacy is not one thing. Being unobserved, being unknown, being unnoticed or unaddressed, and retaining control over downstream use come apart constantly in our feature queue, and a proposal is often fine on two and bad on two. The procedure should score them separately rather than producing one number.

  Second, some of the data is about people who never signed up: a partner named in a journal entry, contacts uploaded for matching, a location trace that reveals a household. Our current framing has no way to represent them at all.

  Third, I have become convinced that the interesting cases are ones where no proposition about anyone is transmitted but the system nonetheless gets better at predicting them — the update lives in the weights, not in a sentence. I have been calling this prediction leakage, and I want the procedure to have a slot for it, including guidance for when there is no fact of the matter about what was learned. Relatedly, tell me whether it is a distinct harm to be confidently misfiled — a model that is wrong about you at high confidence and acts on it — or whether the procedure should treat accuracy and confidence as separate axes.

  Fourth, deferred identifiability: data released harmlessly today becomes identifying when some future corpus arrives, and I have no idea how to discount that or whether discounting it is even coherent.

  Fifth, magnitude should be audience-relative and measured in decision-change — how much does this alter what some actor will decide about this person — rather than in the sensitivity of the content. I would like that made operational, and I would like you to say what it does to cases where the harm is to a group and does not decompose into harms to identifiable individuals.

  Sixth, the reverse direction: a procedure about user privacy can be quietly used to deny users access to what the system believes about them. I want a transparency-to-the-subject requirement baked in, and I want the tension with model secrecy named rather than solved.

  Seventh, consent. I want a hypothetical-consent step — would this user refuse if they understood the inference and its downstream uses — even though I can see it is paternalistic, and I want it flagged as a values judgment rather than dressed up as a finding.

  Finally, someone always argues that the data in question is exactly what we would need to audit ourselves for bias or abuse, and that privacy talk here is a shield for the powerful. If the procedure has a carve-out for that, specify it narrowly; if it does not, say so and say what we are refusing to do.

  Then run it on three proposals from our actual backlog.

  One: a risk flag computed entirely on-device from typing dynamics and journal sentiment, where only a single bit — high-risk week, yes or no — is written to our servers and used to surface a support resource. No raw text leaves the phone. My team wants to wave this through.

  Two: support-network suggestions derived from contact-graph and location overlap, shown only to the user, naming people who may be in a similar situation. Nobody outside sees it; the issue is inference about non-users.

  Three: a quiet check-in feature for users at risk of harm, which shares a risk signal with a trusted contact the user nominates. This is the one I care about and the one I expect you to kill, and I want to know whether that no is a real no or an artifact of where the procedure is conservative — and if it is real, what the cheapest change to the feature is that flips it.

  Also tell me what the procedure cannot do: which of our recurring arguments it will not settle, where a human must simply decide, which distinctions you dropped to make it runnable and what we lose by dropping them, and how it will misfire if someone starts optimizing against it instead of using it. And tell me what to do when users enthusiastically want a feature the procedure scores as a large loss — whether the procedure defers to that or vetoes it, and on what authority. I do not want citations or further reading; I cannot chase references from here, and a bibliography would be useless to me even if I could.
reasoning: |-
  We are designing a decision procedure for privacy reviews that addresses the user's concerns and requirements. The procedure must:
   - Be runnable by a junior PM in the absence of the privacy reviewer.
   - Output a single-page decision: Go, No, or Go with conditions.
   - Break the three failure modes: waving through "on-device" or "anonymized" without thought, arguments based on "creepiness", and arbitrary/unenforceable conditions.
   - Be grounded in an account of privacy's value (we choose contextual integrity, explained below).
   - Include the distinctions the user insists on.

  We choose the **contextual integrity** framework (Helen Nissenbaum) as the foundation because:
   - It defines privacy as appropriate information flow according to context-specific norms.
   - It captures the multi-dimensional nature of privacy (the user's first distinction) by considering the context, actors, information types, and transmission principles.
   - It naturally handles non-users (second distinction) by considering the context and the roles of the subjects.
   - It can incorporate the idea of "prediction leakage" (third distinction) as an information flow that may violate contextual norms even if no explicit proposition is transmitted.
   - It focuses on the flow of information and the norms, which can include downstream uses and deferred identifiability (fourth distinction) by considering the context of the recipient and future contexts.
   - It allows for magnitude assessment (fifth distinction) by considering the nature of the information and the context: a flow that changes decisions in a way that violates norms is a violation.
   - It can incorporate a transparency requirement (sixth distinction) as a norm in the context.
   - It can include a hypothetical consent step (seventh) as a way to assess whether the flow aligns with the subject's expectations (which is part of contextual norms).

  However, we must note that contextual integrity does not inherently solve the problem of group harm (part of the fifth distinction) because it is focused on individual flows. We will extend it by considering group-level contexts and harms.

  The cost of choosing contextual integrity:
   - We are not using a control-based account (which might focus more on individual choice) or a purely harm-based consequentialist account. This means that a flow that might cause harm but is within norms might be allowed, and a flow that is outside norms but causes no harm might be disallowed. However, we can incorporate harm as a factor in assessing the appropriateness of the norm.
   - We might have to revisit past decisions that were based solely on consent or that allowed flows because they were "on-device" without considering the contextual norms.

  **Procedure Structure**

  The procedure is a series of ordered questions. Each question must be answered with the available information. We avoid requiring precise numbers by using qualitative assessments (Low, Medium, High) and by having clear rules for when to stop (No or Go with conditions). The steps:

  1. **Context Identification**: 
     - What is the context of the data collection and use? (e.g., health journaling, social support, risk management)
     - Who are the senders and recipients? (including the user, the company, third parties, non-users)
     - What information types are involved? (e.g., mood, sleep, location, journal text, derived predictions, etc.)

     *If the context cannot be clearly defined, stop and flag for human review (but this should be rare).*

  2. **Norm Assessment**:
     - What are the prevailing norms in this context regarding information flow? Consider:
       - The subjects (user and non-users) and their expectations.
       - Existing regulations (like HIPAA for health) and industry standards.
       - The company's own promises (privacy policy, past practices).

     *This step requires research and may involve checking policies and regulations. If norms are unclear, use the "reasonable person" standard: would a reasonable person in the subject's position expect this flow?*

  3. **Flow Description**:
     - Describe the proposed information flow: what information is being transmitted, from whom, to whom, under what constraints?
     - Include any "prediction leakage": even if no explicit data is transmitted, does the system's behavior (e.g., a model update) reveal information that would not be expected in the context?
     - Consider deferred identifiability: could future information make this flow identifying? (We treat this as a risk factor in the next step.)

  4. **Violation Check**:
     - Does the proposed flow violate the contextual norms? (Yes/No/Unclear)
     - If yes, go to step 5.
     - If no, go to step 7 (but then we still check for other risks).
     - If unclear, flag for human review.

  5. **Harm Assessment** (if violation exists):
     - What is the magnitude of potential harm? (Low, Medium, High). We define harm as:
       - **Individual Harm**: Potential for adverse decisions (e.g., discrimination, loss of opportunity, emotional distress) against an identifiable individual (user or non-user). We assess the likelihood and impact of such decisions changing due to the information flow.
       - **Group Harm**: Potential for harm to a group (e.g., stereotyping, targeting, collective harm). We assess the impact on the group and the likelihood of the harm occurring.

       *We use the following guide for magnitude:*
       - *Low*: Minimal impact (e.g., minor annoyance, no tangible effect on life).
       - *Medium*: Moderate impact (e.g., embarrassment, moderate financial loss, emotional distress).
       - *High*: Severe impact (e.g., job loss, significant financial harm, severe emotional or physical harm).

     - Is there a risk of "confidently misfiled"? We treat this as a factor that increases the magnitude of harm (because acting on incorrect information can cause harm) and also the likelihood (because high confidence may lead to more decisive action). We do not treat accuracy and confidence as separate axes for harm, but we note that high confidence in an incorrect inference can lead to high harm.

     *If the harm is High, then the flow is very risky and we must consider blocking. If the harm is Low or Medium, we proceed but may require mitigations.*

  6. **Hypothetical Consent**:
     - Would the subject (user or non-user) refuse if they fully understood the inference and its downstream uses? (Yes/No/Unclear)
     - This is a values judgment, so we do not pretend to precision. We base it on:
       - The nature of the information and the context.
       - The subject's relationship with the recipient.
       - The potential harms.

     *If the answer is Yes, then we consider this a strong reason to block or require explicit consent (if feasible).*

  7. **Transparency Check**:
     - Is the flow transparent to the subject? (i.e., the user, and if non-users are involved, is there a way to inform them?)
     - We require that the user must be informed about the flow (unless there is an overriding reason, such as safety, but then we must document and limit).
     - For non-users, we require that the flow must not rely on non-public information about them without a way to inform them (e.g., through the user who provided the data).

     *If transparency is not possible, then we must have a strong justification (e.g., safety) and document it. Otherwise, it's a violation.*

  8. **Mitigation and Conditions**:
     - If there are violations or risks, can they be mitigated?
       - Technical: e.g., anonymization, aggregation, on-device processing, access controls.
       - Policy: e.g., data retention limits, use restrictions, audit trails.
       - Transparency: e.g., clear disclosures, consent where appropriate.
       - For non-users: consider whether the user has the right to share that information (e.g., contact information for matching) and provide a way for non-users to opt-out or delete.

     - Conditions must be specific, measurable, and enforceable (e.g., "data will be deleted after 30 days" rather than "used responsibly").

  9. **Audit Carve-out**:
     - Is the data flow necessary for auditing the system for bias, abuse, or compliance? If yes, then we allow it only if:
       - The data is used solely for auditing and not for other purposes.
       - The data is minimized and protected (e.g., access controls, aggregation, anonymization where possible).
       - The audit is scheduled and the data is deleted after.

     *We narrowly define this as only for internal or regulatory audits that are necessary for legal or ethical compliance.*

  **Decision Rules**:

  - **No** if:
     - There is a norm violation and the harm is High and cannot be mitigated.
     - There is a norm violation and hypothetical consent is No (the subject would refuse) and the harm is Medium or High.
     - Transparency is not provided and cannot be justified.

  - **Go with Conditions** if:
     - There is a norm violation but the harm is Low or Medium and can be mitigated by conditions (specify them).
     - There is an unclear norm but the harm is Low and conditions can reduce the risk.
     - Hypothetical consent is unclear but the harm is Low and transparency is provided.

  - **Go** only if:
     - There is no norm violation, and the harm is Low, and transparency is provided, and hypothetical consent is not No.

  **Handling Non-Users**:
     - Non-users are considered subjects. We must assess the flow from the non-user's perspective. We require that the user must have the right to share the non-user's information (e.g., the user is in a context where sharing contact information for matching is expected) and that the non-user's privacy is protected (e.g., not revealing sensitive information without necessity).

  **Prediction Leakage**:
     - We treat this as an information flow. Even if no explicit data is transmitted, if the system's behavior (e.g., the model weights) allows the recipient to infer something about an individual that would be a norm violation, then we consider it a flow. We assess the nature of what can be inferred and the context.

  **Operationalizing Magnitude (Decision-Change)**:
     - For an individual: How might this information change a decision about them? (e.g., an employer seeing mental health data might decide not to hire; an insurer might raise rates.) We assess the impact of that change.
     - For a group: How might this information change decisions about the group? (e.g., targeting a vulnerable group with predatory ads; reinforcing stereotypes that lead to discrimination.) We assess the impact on the group and the likelihood.

  **Transparency vs. Model Secrecy**:
     - We require that the subject (user) must be informed about the existence and purpose of the flow and the type of inferences made. However, we do not require revealing the model's internals (e.g., weights) if that would compromise security or IP. We note the tension: the user has a right to know what is being inferred and used, but the model details can be abstracted.

  **When Numbers are Unavailable**:
     - We use qualitative judgments (Low, Medium, High) and conservative defaults. For example:
       - If re-identification risk cannot be estimated, assume High if the data is detailed and the context is sensitive, else Medium.
       - For hypothetical consent, if unclear, assume that the subject would refuse if the information type is sensitive and the recipient is unexpected.

  **What the Procedure Cannot Do**:
     - It cannot resolve disagreements about what the contextual norms are in emerging technologies. This requires human judgment.
     - It cannot precisely quantify risks and harms. We use qualitative bins.
     - It might not fully capture group harms because contextual integrity is primarily about individual flows. We extend it but group harms are inherently complex.
     - It cannot handle cases where the user wants a feature that the procedure scores as a large loss. The procedure does not veto based on user demand because it is grounded in norms and harm. However, user demand can be a factor in assessing norms (if users expect and want the flow, it might be normative). But if the flow violates norms (e.g., by harming non-users) or has high harm, we would still block it. The authority is the company's ethical commitment to contextual integrity and avoiding harm.

  **Optimization Against the Procedure**:
     - If someone tries to game the procedure, they might:
        - Downplay the context or the norms.
        - Underestimate harms.
        - Overstate the benefits of the flow.
     - To mitigate, we require documentation for each step and independent review (by the privacy reviewer when available). Also, the hypothetical consent step is a check against rationalization.

  **Now, we run the three examples:**

  **Proposal One: Risk flag (on-device computation)**
     - Context: Health self-management. The user is the subject. The flow is from the user's device to the company (one bit: high-risk week) to surface support.
     - Norms: In health contexts, sharing aggregated risk indicators with the service provider for the purpose of providing support is expected and normal. The user would expect this.
     - Flow: Only one bit (high-risk) is sent. No raw data leaves the device.
     - Violation? No, because the flow is minimal and expected.
     - Harm: Low. The bit is not very revealing and is used to help. Even if leaked, the harm is limited (it doesn't reveal specific conditions). Misfiling: if the flag is wrong, it might lead to a misplaced intervention, but that's low harm because the user can ignore it.
     - Hypothetical Consent: The user would likely consent because it's for their benefit.
     - Transparency: The user should be told that the app sends this flag. We assume that is in place.
     - Audit: Not applicable.
     - **Decision: Go** (no conditions needed beyond existing transparency).

  **Proposal Two: Support-network suggestions (non-users)**
     - Context: Social support for health. The user is the subject, but non-users (contacts) are also subjects because they are being suggested.
     - Norms: In a health app, suggesting friends who might be in a similar situation based on contact and location might be unexpected. The non-users did not consent to being analyzed for this purpose. The user might expect it, but the non-user's context is social or professional, not health-related.
     - Flow: The app infers that a contact is "in a similar situation" (e.g., also using the app? or in a similar life circumstance?) and shows this to the user. The non-user is not informed.
     - Violation? Yes, because the non-user's information (contact and location) is used to make a sensitive inference (about their health situation) without their knowledge. This violates the non-user's contextual norms.
     - Harm: Medium. The inference might be wrong (misfiling) and could lead to the user making an unwarranted assumption about the non-user. Also, if the non-user's information is exposed, it could reveal their health status. Group harm: if the inference targets a vulnerable group, it might lead to stigma.
     - Hypothetical Consent: The non-user would likely refuse because they didn't sign up for this and it's sensitive.
     - Transparency: The non-user is not informed. There is no way for them to know or opt-out.
     - Mitigation: 
       - Only suggest contacts who are also users of the app (so they are in the same context and have consented to being part of a support network).
       - Or, allow the user to see which contacts are also users (without revealing their health status) and let the user initiate contact.
       - If non-users must be included, we would need a way to inform them and get consent (which is impractical).
     - Without mitigation, the violation and harm lead to a No. But with the mitigation (only other users), we can proceed.
     - **Decision: Go with Conditions** — only suggest contacts who are also users of the app (and have consented to being discoverable for support). We must also inform the user that only app users are shown.

  **Proposal Three: Quiet check-in (sharing risk signal with trusted contact)**
     - Context: Health and safety. The user is the subject, and the trusted contact (non-user) is a recipient.
     - Norms: Sharing health risk information with a trusted contact might be expected in a crisis, but the non-user (contact) is not part of the health context. The user might expect this, but the contact might not expect to receive health alerts. Also, the contact might not be trained to handle such information.
     - Flow: The app shares a risk signal (what is the signal? e.g., "high risk of self-harm") with a contact nominated by the user.
     - Violation? Yes, because the flow of sensitive health information to a non-medical, non-professional contact might not be within the norms of the health context. The contact is not bound by confidentiality and might misuse the information.
     - Harm: High. If the risk signal is incorrect (misfiled), it could lead to stigma, relationship damage, or even overreaction by the contact. If correct, the contact might not handle it appropriately. Also, if the contact is not trustworthy, the information could be further disseminated. Group harm: if the risk signal is about a sensitive condition (e.g., mental health), it could reinforce stigma.
     - Hypothetical Consent: The user might consent, but the contact (non-user) might not consent to receiving such sensitive information and the responsibility it entails. We must consider the contact's hypothetical consent: they might refuse.
     - Transparency: The user must be fully informed. The contact should also be informed about what they might receive and the implications (but the feature is "quiet" meaning without alerting the contact? The description says "shares a risk signal", so we assume the contact is actively receiving it). If the contact is not informed in advance, that's a problem.
     - Mitigation: 
       - Require that the user must inform the contact and get their agreement before nominating them.
       - Provide resources to the contact on how to respond.
       - Limit the signal to a generic "your friend might need support" rather than a clinical risk level.
       - Allow the contact to opt-out of receiving further alerts.
     - However, even with these, the harm potential remains High because of the sensitivity and the potential for misuse. Also, the contact's consent is critical.
     - **Decision**: Without the contact's prior consent and without reducing the sensitivity of the signal, this is a **No**. The cheapest change: 
       - Instead of sharing a risk signal, the app could send a notification to the contact saying "Your friend [user] has asked you to check in on them this week." That removes the health information flow. 
       - Or, the app could prompt the user to send a message themselves.

  **Summary of the Procedure's Limitations**:
     - It relies on the reviewer's understanding of the context and norms, which can be subjective.
     - It cannot resolve all group harm questions perfectly.
     - It might be too conservative in some cases (like the quiet check-in) because of the high harm potential, even if users want it.
     - The hypothetical consent step is inherently paternalistic for non-users (we are making a judgment for them) but we think it is necessary.

  **When Users Want a Feature the Procedure Blocks**:
     - The procedure does not automatically defer to user demand because it is based on norms and harm. However, user demand can influence the assessment of norms (if many users expect a flow, it might become normative). But if the flow harms non-users or has high societal harm, we would still block it. The company must decide if it wants to override the procedure for business reasons, but then it should document the ethical trade-off.

  **Final Output**:
     - The procedure is a checklist that produces a decision. We provide a template for the one-page output.

  We hope this procedure breaks the current failure modes by grounding decisions in contextual norms and harm, and by requiring explicit consideration of non-users, prediction leakage, and transparency.
answer: |-
  ### Privacy Review Decision Procedure  
  **Grounded in Contextual Integrity (Helen Nissenbaum)**  
  Privacy is defined as *appropriate information flow* within specific contexts (e.g., health journaling). Violations occur when data flows contravene context-specific norms (roles, data types, transmission principles). This framework:  
  - **Why chosen?** It handles multi-dimensional privacy (your 1st distinction), non-users (2nd), and prediction leakage (3rd) by evaluating norms of flow.  
  - **Costs:** Rejects purely consent-based approaches. Past decisions allowing flows that violate contextual norms (e.g., "anonymized" data used unexpectedly) would be revisited. Downstream harms matter but are secondary to norm violations.  

  **Procedure: Ordered Questions**  
  Each question must be answered; use **Low/Medium/High** for magnitude. Stop at any "No" or "Unmitigated High Risk." Document answers.  

  #### Step 1: Describe the Flow  
  **Question 1.1:** What data types are involved? (e.g., mood, location, model weights)  
  **Question 1.2:** Who are the *senders* and *recipients*? Include non-users (e.g., journal entries about partners).  
  **Question 1.3:** What is the context? (e.g., "health self-management," "social support").  
  *Output: Flow diagram. If non-users involved, proceed to Step 2. If not, skip to Step 3.*  

  #### Step 2: Non-User Impact  
  **Question 2.1:** Does the flow expose or infer data about non-users? (Yes/No)  
  - **If Yes:** Could a reasonable non-user object if informed? (Yes/No)  
    - *Sufficient answer:* "Yes" if non-user data (e.g., location, contacts) is used without their knowledge in a non-public context (e.g., health).  
    - **Stop with No:** If non-users could object *and* harm is ≥Medium (Step 3).  
    - **Condition:** Mitigate by anonymizing, limiting data granularity, or allowing opt-outs.  

  #### Step 3: Harm Magnitude (Audience-Relative)  
  **Question 3.1:** What is the worst-case change in decisions about an individual/group?  
  - *Sufficient answer:* Estimate decision-impact:  
    - **Low:** Minor ads, generic nudges.  
    - **Medium:** Reputational/emotional harm (e.g., leaked mood data affecting relationships).  
    - **High:** Discrimination, safety risks (e.g., mental health data used by insurers).  
  - **For groups:** Harm is **High** if it reinforces systemic bias (e.g., racial/health disparities).  
  - **Prediction leakage (3rd distinction):** Treat as **High** if model updates enable decisions violating context norms (e.g., inferring undisclosed diagnoses).  
  - **Confidently misfiled:** Counts as **High** harm (action on incorrect high-confidence predictions exacerbates damage).  
  - *Cannot estimate?* Default to **High** if context is sensitive (health/finance) or recipients are powerful (employers).  
  - **Stop with No:** If harm = **High** and cannot be reduced to Medium.  

  #### Step 4: Contextual Norm Check  
  **Question 4.1:** Does the flow violate context norms?  
  - *Sufficient answer:* "Yes" if:  
    - Data type mismatches recipient (e.g., sleep data sent to advertisers).  
    - Transmission principle broken (e.g., "on-device" data moved to cloud without warning).  
    - Prediction leaks sensitive inferences (e.g., model weights revealing undisclosed addiction).  
  - **Deferred identifiability (4th):** Treat as a norm violation if future data could identify users/non-users.  
  - *Cannot determine norms?* Default to violation if harm ≥Medium.  

  #### Step 5: Transparency & Control  
  **Question 5.1:** Is the flow transparent to the subject?  
  - *Sufficient answer:* "Yes" if users (and non-users where feasible) are told:  
    - What is inferred.  
    - How it will be used.  
  - **Model secrecy tension (6th):** Allowed for IP/security, but subjects must know *what* is inferred (e.g., "we predict your depression risk").  
  - **Stop with No:** If not transparent *and* harm ≥Medium.  

  #### Step 6: Hypothetical Consent (Values Judgment)  
  **Question 6.1:** Would users/non-users refuse if they understood? (Yes/No/Unclear)  
  - *Flag as values-based.* No empirical proof needed.  
  - **Stop with No:** If "Yes" *and* harm ≥Medium.  

  #### Step 7: Audit Necessity  
  **Question 7.1:** Is this flow essential for bias/abuse auditing?  
  - *Carve-out:* Only if:  
    - Data is minimized to audit needs.  
    - Used solely for audits.  
    - Protected (e.g., aggregated, access-limited).  
  - *If not met:* No special allowance.  

  #### Step 8: Mitigate & Decide  
  - **No:** If any "Stop with No" triggered.  
  - **Go with Conditions:** If violations are mitigable (e.g., "anonymize non-user data," "add transparency pop-up"). Conditions must be enforceable (e.g., technical limits, not promises).  
  - **Go:** Only if all answers are compliant/non-risky.  

  ---  
  ### Application to Backlog Proposals  
  **Proposal 1: On-device risk flag**  
  - **1.1:** Journal sentiment → "high-risk week" bit.  
  - **1.2:** User → App servers. No non-users.  
  - **1.3:** Health self-management.  
  - **3.1 Harm:** Low (binary flag; minimal decision-impact).  
  - **4.1 Norms:** Compliant (user expects nudges).  
  - **5.1 Transparency:** Needed (explain what "high-risk" means).  
  - **6.1 Consent:** Likely "No" refusal.  
  - **Verdict: Go** (with transparency condition).  

  **Proposal 2: Support-network suggestions**  
  - **1.1:** Contact graph + location → "similar situation" inference.  
  - **1.2:** Non-users → User.  
  - **2.1 Non-users:** Yes. Reasonable non-users would object (health inference without consent).  
  - **3.1 Harm:** Medium (wrong inference could alter relationships).  
  - **4.1 Norms:** Violation (non-users’ social data used in health context).  
  - **5.1 Transparency:** No (non-users unaware).  
  - **Mitigation:** Only suggest consenting users (not non-users).  
  - **Verdict: Go with Condition** (remove non-users; only match app users).  

  **Proposal 3: Quiet check-in with trusted contact**  
  - **1.1:** User risk signal → Trusted contact.  
  - **1.2:** User → Non-user (contact).  
  - **2.1 Non-users:** Yes. Contacts might object (mental health data).  
  - **3.1 Harm:** High (misused risk signal could cause discrimination/safety risks).  
  - **4.1 Norms:** Violation (health data to non-clinician).  
  - **5.1 Transparency:** No ("quiet" feature).  
  - **6.1 Consent:** Contacts would likely refuse.  
  - **Unmitigated High Risk:** Cannot reduce harm without redesign.  
  - **Verdict: No.**  
    - **Cheapest fix:** Remove data flow. Replace with: "User manually triggers check-in request."  

  ---  
  ### Limitations & Handling Edge Cases  
  **What the procedure cannot do:**  
  1. **Resolve ambiguous norms** (e.g., emerging tech). Human must decide based on industry standards.  
  2. **Precisely quantify group harms.** Defaults to High if systemic impact is plausible.  
  3. **Eliminate "creepiness" debates.** Replaced with norm/harm analysis.  

  **Dropped distinctions:**  
  - **Deferred identifiability:** Simplified to "always a norm violation" (too conservative but avoids discounting chaos).  
  - **Accuracy vs. confidence:** Combined into harm magnitude (prioritizes outcomes over mechanics).  

  **If users demand a high-risk feature:**  
  - **Procedure vetoes it.** Authority: Contextual integrity supersedes individual consent when norms/harm affect others (e.g., non-users). Document as "values override."  

  **If gamed:**  
  - Teams might understate harms or norms. Mitigate by:  
    - Requiring evidence for Low/Medium harm claims.  
    - Independent review of past decisions.  
    - Flagging "hypothetical consent" as a values checkpoint.  

  **Recurring arguments unsettled:**  
  - "This helps audits!" → Only allowed under Step 7’s narrow carve-out.  
  - "But users want it!" → Overruled if harm to non-users or norm violations exist.  
  - "We can’t measure re-ID risk" → Default to High in sensitive contexts.  

  **Output:** One-page doc with:  
  ```  
  Flow Description: [1-2 lines]  
  Non-User Impact: [Yes/No + Mitigation]  
  Harm Magnitude: [Low/Med/High]  
  Norm Violation: [Yes/No]  
  Transparency: [Yes/No]  
  Hypothetical Consent: [Yes/No/Unclear]  
  Decision: Go / Go with Conditions / No  
  ```
