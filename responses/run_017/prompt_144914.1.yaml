answer: |-
  Here is the disambiguated menu of readings for the quip "Why should I care about posterity? What has posterity ever done for me?", ordered from most deflationary to most radical, with the requested analysis:

  1.  **Reading: Psychological Constraint Claim**  
      *Claim:* Humans are psychologically incapable of genuine concern for temporally distant others (beyond ~100 years) due to cognitive/emotional limitations. (Psychological claim)  
      *Verdict:* Substantive but probably false (evidence shows cultural/structural factors can extend concern; capability varies individually).  
      *Entitlement to Pure Rate?* No. At most supports shorter *effective horizon* or *different uncertainty treatment* (e.g., higher variance in distant benefits), not normative discounting.  
      *Tests:*  
      (a) Stipulation Filter: **No discounting** – psychological limits don't justify a discount rate if all other factors are stipulated away.  
      (b) Block-Shift: **Ranks packages equally** – temporal distance is identical in both shifted scenarios; if psychology is the only factor, inability to care applies equally to both.  
      (c) Reverse-Direction: If applied to our predecessors, they wouldn't have cared about us. We benefit from infrastructure built by those who *overcame* this limitation. Speaker likely benefits from past overcoming this constraint.

  2.  **Reading: Prudential Self-Interest Claim**  
      *Claim:* Rational individuals *should* only care about entities that can reciprocally benefit or harm them. Posterity cannot affect the current generation. (Prudential claim)  
      *Verdict:* Substantive and defensible *if* restricted to individual rationality, but irrelevant to social project appraisal.  
      *Entitlement to Pure Rate?* No. Supports *constraint on whose interests count* (only reciprocal stakeholders), not discounting. Justifies excluding future generations from CBA, not devaluing their interests *if* included.  
      *Tests:*  
      (a) Stipulation Filter: **No discounting** – lack of reciprocity doesn't imply temporal devaluation; it implies exclusion.  
      (b) Block-Shift: **Ranks packages equally** (as irrelevant) – neither package offers reciprocity to the present generation.  
      (c) Reverse-Direction: Predecessors applying this would not have invested in things benefiting us. Speaker's existence depends on predecessors *rejecting* this principle.

  3.  **Reading: Moral Subjectivism / Egoism Claim**  
      *Claim:* There is no objective moral reason to sacrifice present well-being for distant future beings; morality is subjective, and self-interest is the only valid basis for action. (Moral claim)  
      *Verdict:* Substantive but probably false (contradicts widely held moral intuitions and duties; self-refuting if universalized).  
      *Entitlement to Pure Rate?* **Potentially Yes**, but only if *pure time preference* is defined as reflecting agent-relative valuation. However, this conflates *social* discounting with *individual* discounting. At most justifies a *procedural requirement* (only consider present voters).  
      *Tests:*  
      (a) Stipulation Filter: **Discounting persists** – future utility is inherently less valuable *because* it's future to the present valuer.  
      (b) Block-Shift: **Ranks nearer package higher** – solely because the beneficiary generation is closer temporally to the valuer.  
      (c) Reverse-Direction: Predecessors applying this would have ignored the speaker's interests. Speaker benefits from predecessors rejecting this view. Application is inconsistent.

  4.  **Reading: Political Legitimacy / Constituency Claim**  
      *Claim:* Governments derive legitimacy and authority solely from current citizens/voters. They have no mandate to sacrifice current citizens' resources for entities outside their constituency (future generations). (Political claim)  
      *Verdict:* Substantive and defensible in democratic theory, but contestable (e.g., trusteeship models).  
      *Entitlement to Pure Rate?* **No.** Supports *constraint on whose interests count* (future generations excluded) or *procedural requirement* (future interests only represented via current voters' altruism), not discounting. If included, no reason to devalue them *temporally*.  
      *Tests:*  
      (a) Stipulation Filter: **No discounting** – exclusion, not devaluation.  
      (b) Block-Shift: **Ranks packages equally** (as excluded) – both beneficiary generations are outside the constituency.  
      (c) Reverse-Direction: Predecessors applying this strictly would not have built long-term infrastructure. Speaker benefits because predecessors adopted a broader view of constituency/legitimacy.

  5.  **Reading: Radical Non-Identity / Contingency Claim**  
      *Claim:* Future people are contingent on present choices. Sacrificing for specific distant future people is incoherent because different choices create *different* future people. We owe nothing to non-existent, non-identifiable entities. (Moral claim relying on non-identity problem)  
      *Verdict:* Substantive and defensible regarding *duties to specific individuals*, but doesn't negate duties regarding *general future welfare* or *impersonal goods*.  
      *Entitlement to Pure Rate?* **No.** Supports *different treatment of uncertainty* (high variance for specific distant impacts) or *constraint* (only consider effects on existing people/fixed future identities), not pure temporal discounting. Doesn't justify devaluing *avoidable harm* to whoever exists.  
      *Tests:*  
      (a) Stipulation Filter: **Discounting persists?** Only if non-identity is seen as destroying *all* obligation. More plausibly, **no discounting** – stipulation fixes identities/population, removing the non-identity basis.  
      (b) Block-Shift: **Ranks packages equally** – the contingency applies equally to both distant beneficiary generations.  
      (c) Reverse-Direction: Predecessors applying this strictly might not have made choices ensuring *our* existence/welfare. Speaker exists precisely because predecessors didn't apply this principle absolutely.

  **Identified Composite Reading:** The quip *as used* ("keep a positive pure time preference term") conflates **Moral Subjectivism (3)** and **Political Legitimacy (4)**. It smuggles a personal/moral dismissal of future claims (3) into a justification for official policy discounting, bypassing the distinct logic of democratic mandate (4).

  **Likely Intended Reading (Making it an Argument): #4 (Political Legitimacy / Constituency Claim).** This gives the quip a veneer of democratic principle ("we represent the living, not the unborn"), making it seem like a substantive argument against including/devaluing future interests in *government* appraisal, rather than just a crude expression of selfishness or nihilism.

  ---

  **Compressed Treatment of Common Replies:**

  1.  **"Discounting a good merely because it falls later is a failure of imagination rather than a reason."**  
      *Analysis:* This directly targets **Reading 1 (Psychological Constraint)**. It argues that the inability to feel concern is a cognitive/affective defect to be overcome through effort or institutional design (e.g., futures literacy, representative mechanisms), not a valid justification for devaluation. It implies that psychological limitations provide no *normative* basis for pure time preference, only a *descriptive* challenge for appraisal methodology. *Touches:* Primarily Reading 1, but also undermines the psychological component often lurking behind Readings 3 and 4.

  2.  **"A rate we would not have accepted being applied to ourselves by our predecessors is one we should not apply to our successors."**  
      *Analysis:* This is a direct application of the **Reverse-Direction Test** across the menu. It most powerfully challenges **Reading 3 (Moral Subjectivism/Egoism)** and **Reading 4 (Political Legitimacy)** by exposing their inconsistency when universalized. It appeals to a principle of temporal impartiality or reciprocity. If predecessors had applied a high pure rate, the current generation would be significantly worse off; recognizing our dependence on their lower rate creates a duty to extend similar consideration. *Touches:* Readings 3, 4, and 5 (as beneficiaries of past non-application), and implicitly challenges the self-interest in Reading 2. It operationalizes the Golden Rule for intergenerational ethics.
