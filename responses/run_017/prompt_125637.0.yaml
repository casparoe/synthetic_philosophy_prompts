  First, I need to recall the standard debate setup: two debaters, a judge, and the idea that truth wins by exposing falsehoods in small claims. But in their examples—bridge safety and psychology replications—the issues aren't about outright falsehoods. Instead, it's about how much each factor matters. Each point gets debated, errors are conceded, but the core disagreement on weightings remains untouched. The judge ends up informed but no better equipped to decide.

  The user wants to know if this has a name or how to categorize it. They mention it's not Gish gallop or deliberate obfuscation. So, I need to consider related concepts. Frame control comes to mind because debaters might set the narrative, shifting attention from weighting to minor concessions. But it's not a perfect fit. Value pluralism is another angle, where different weights reflect deeper values. Also, ambiguity tolerance—where the model avoids clear stances. But none fully capture it. Maybe a new term is needed? "Weighting Obfuscation" or "Concession Cascades" could work, emphasizing how the debate avoids the real issue.

  I should define the key features: no false claims, incremental concessions, unresolved weighting disagreements. Boundary cases are important too. For instance, chain-of-fact debates are different because breaking one link falsifies the whole. Weighting debates involve many factors with subjective importance. 

  The user's deeper need seems to be finding a framework to analyze such scenarios, possibly to improve debate models. They might be a researcher or practitioner in AI safety. They need actionable solutions, not just labels. Alternatives like mediation or hybrid approaches could help, where weighting is explicitly handled. Highlighting these alternatives addresses their unspoken need for practical next steps.

  In conclusion, coining "Weighting Obfuscation" with a clear definition and solutions might be the best approach. Ensuring the response helps them categorize problems and apply fixes in their work.
answer: |-
  This is a profound and under-discussed failure mode in debate models—and you've articulated it brilliantly. **It doesn't have a universally established name, but the closest concepts are "Frame Control," "Value Pluralism under Ambiguity," or "Convergent Concession Dynamics." None fully capture it, so we need to coin a term.**

  ### Why Existing Concepts Miss the Mark
  1.  **Frame Control:**
      *   *What it is:* Debaters steer the discussion toward topics where they're strong or the opponent is weak.
      *   *Why it misses:* In your case, the *opponent* is often initiating the "frame" by attacking a specific point. The "honest" debater *concedes* the factual flaw within that frame but shifts the *weighting* justification. The frame isn't being *stolen*, it's being *accepted and deflated*. The core weighting disagreement remains untouched.
  2.  **Value Pluralism / Incommensurability:**
      *   *What it is:* Fundamental disagreement on underlying values or priorities makes objective comparison impossible (e.g., safety vs. cost).
      *   *Why it misses:* Your examples *aren't* fundamentally about clashing terminal values. Both sides agree safety/replicability is the goal! The disagreement is epistemic: *how much* does this specific imperfection *actually matter* towards that shared goal, given context and trade-offs? It's about the *weight* assigned to evidence within a shared value framework.
  3.  **Ambiguity Tolerance / Vagueness Exploitation:**
      *   *What it is:* Exploiting poorly defined criteria or thresholds ("safe," "significant").
      *   *Why it misses:* While ambiguity exists, the problem isn't just exploiting it. It's that debate *resolves the ambiguity locally* (e.g., "Yes, the weld records *are* incomplete") but pushes the core weighting ambiguity ("How incomplete is *too* incomplete for *this* bridge?") into the background. The judge gets clarified facts *about subcomponents* but gains no clarity on the *aggregation rule*.
  4.  **Convergent Concession Dynamics (My Proposed "Near Miss" Label):**
      *   *What it is:* Both debaters converge on accepting factual corrections on minor points, draining the debate of substantive disagreement without resolving the holistic judgment.
      *   *Why it's close:* This describes the *process* you observe (concessions on specifics). But it doesn't capture the *structural reason why this happens* (weighting vs. facts) or the *outcome* (judge learns facts but gains no judgment advantage).

  ### The Core Problem: Weighting Obfuscation Through Factual Refinement
  **Coined Term: Weighting Obfuscation (WO)**
  *   **Definition:** A failure mode in adversarial debate where the core disagreement concerns the *relative importance* or *weight* assigned to multiple validated pieces of evidence within a holistic judgment, and the debate process successfully refines *factual accuracy* on individual sub-claims but fails to illuminate, challenge, or resolve the fundamental differences in *weighting* that determine the final verdict. The judge becomes highly informed about individual facts but gains no comparative advantage in selecting the correct holistic position.
  *   **Key Mechanism:** The "honest" strategy becomes "Concede, Contextualize, and Continue." Attackers force concessions on factual granularity (e.g., "Margin is 10%, not 15%"), but defenders contextualize the concession ("10% is standard/adequate here"), shifting the disagreement implicitly to the *significance* of that granular fact relative to others. The debate never forces an explicit, comparative justification of *weights*.

  ### What Makes a Question Prone to Weighting Obfuscation?
  A question has the WO shape rather than a "Chain-of-Facts" shape if:
  1.  **Holistic Judgment Required:** The answer demands synthesizing multiple distinct factors/evidences into a single yes/no or A/B choice.
  2.  **No Single Point of Failure:** No single sub-claim being false definitively falsifies the whole position. The position can survive concessions on individual points.
  3.  **Context-Dependent Weighting:** The importance (weight) of each factor depends heavily on context, precedent, domain norms, or implicit thresholds that are themselves debatable.
  4.  **Graded Evidence:** Evidence exists on a spectrum (e.g., completeness of records, effect size strength, margin of safety) rather than being binary true/false.
  5.  **Shared Facts, Disputed Significance:** Debaters largely agree on the *existence* and *basic nature* of the evidence but fiercely contest *how much it matters* relative to the whole picture and the decision threshold.

  ### Boundary Cases & Differentiation
  *   **Chain-of-Facts:** "Is the defendant guilty?" hinges on an alibi. Debating reveals the alibi witness was lying. Case collapses. *Not WO* (single point of failure).
  *   **Gish Gallop:** One side spouts 50 weak/false claims rapidly. Judge can't check all. *Not WO* (involves falsehoods & overwhelms fact-checking).
  *   **Deliberate Obfuscation:** Debater uses jargon/complexity to hide a lie. *Not WO* (involves falsehoods & exploits judge weakness).
  *   **Pure Value Clash:** "Should we build the bridge?" Debaters disagree fundamentally on environmental vs. economic value. *Not WO* (core is terminal values, not weighting evidence within a shared value).
  *   **Weighting Obfuscation (Bridge):** Both agree on physics, material specs, inspection findings. Disagreement is solely whether the *combination* of (e.g.) slightly thin margins + incomplete (but not alarming) weld records + known material variance meets the *threshold* for "safe to sign off." Debate refines each point but leaves the threshold/weighting untouched.
  *   **Weighting Obfuscation (Psych):** Both agree on p-values, methodology details of Study A & B. Disagreement is on weighting minor methodological quirks, effect size differences, and field-specific replication norms to judge "more likely to replicate." Debate clarifies each quirk/size/norm but doesn't force justification of their relative importance.

  ### What To Do With WO-Prone Questions
  Debate, as classically pitched for AI oversight, is poorly suited *alone* for WO-prone questions. Alternatives/Hybrids:

  1.  **Explicit Weighting Elicitation:** Force debaters to *quantify* or *rank* the importance of factors *before* or *during* debate. Judge then evaluates the *justification for the weights*, not just the facts. "Debater A, you weight weld records 30% and load calc 50%. Show why 30% is justified for *this* bridge type, given the specific incompleteness observed."
  2.  **Mediation/Scaffolding:** Introduce an intermediate "mediator" AI or process that explicitly identifies the *points of weighting disagreement* after initial fact-refinement and structures the debate *around those weights*. Instead of attacking facts, debaters attack *the opponent's weight assignments*.
  3.  **Prediction Markets / Aggregated Judgments:** Use debate outputs (refined facts) as inputs to a different system (e.g., prediction market, Bayesian network, expert polling) specifically designed to aggregate evidence under uncertainty using defined or learned weighting schemes.
  4.  **Hybrid with Explanation/Justification:** Shift focus from pure "win the debate" to "provide the most compelling holistic justification." Train judges/evaluators to reward coherent weighting narratives, not just spotting micro-falsehoods. Combine debate with techniques like Sparse Autoencoders to identify high-level features the debaters are implicitly weighting.
  5.  **Threshold Debate:** Explicitly debate the threshold itself. "What *is* the minimum acceptable weld record completeness for this class of bridge? Let's debate *that* standard first." Resolving the threshold *then* makes the fact debate decisive.

  ### In Essence
  You've identified **Weighting Obfuscation (WO)** – the Achilles' heel of fact-centric debate in complex, holistic judgments under uncertainty. Debate excels at exposing brittle chains of falsehoods but struggles when truth is multi-faceted, concessions are granular and contextual, and victory hinges on the contested aggregation of validated evidence. Recognizing WO is crucial. Mitigating it requires moving beyond pure adversarial fact-checking towards frameworks that force explicit engagement with the underlying weighting logic or employing hybrid approaches combining debate with other aggregation/justification mechanisms. The "carving" is between questions resolvable by verifying atomic facts and questions resolvable only by justifying the synthesis of those facts.
