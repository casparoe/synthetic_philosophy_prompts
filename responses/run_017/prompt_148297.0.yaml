  We are constructing a case that satisfies all the specifications and constraints. The key is to create a scenario where:
  - Deferring is plainly the right thing to do (a).
  - The evidential account is silenced because the recipient has positive grounds to regard the speaker as better placed on this particular moral question (b).
  - The own-judgment account is silenced because the recipient reflects, acts, and remains answerable (b).
  - The belief is genuinely testimonial: the recipient previously held the opposite view and couldn't have reached the new view unaided; and the belief remains dependent on the speaker (c).
  - Yet, the recipient ends up with a full understanding: they can articulate the reasons, respond to defeaters, and the belief guides action (d). This is to show that the understanding account (which says testimony cannot deliver understanding) is wrong.

  Constraints to respect:
  - No non-moral fact is missing: both are fully informed about what happened.
  - The recipient is a normally competent, motivated adult, not impaired.
  - The speaker has no credentials, role, track record, or authority.
  - The content is a specific substantive moral claim (not etiquette, convention, etc.).
  - Not stipulating antecedent agreement.

  Let me propose a case:

  **Case: The Forgotten Promise**

  Alex and Bailey are close friends. Last month, Alex promised to help Bailey move on a specific Saturday. However, on that day, Alex went hiking instead. When Bailey confronted Alex, Alex said, "I know I promised, but it was such a beautiful day, and you ended up getting help from others anyway." Bailey initially thought that Alex had acted permissibly because the promise was minor and the circumstances were exceptional. But now, a mutual friend, Casey, who is known for her exceptional moral sensitivity and has a track record of helping others see moral nuances they had overlooked (though without any formal authority), hears about the situation. Casey says to Bailey: "What Alex did was wrong. Even though the day was beautiful and you got help, Alex made a commitment to you. It's not about the outcome; it's about the betrayal of trust and the message it sends about how Alex values your relationship." Bailey, after hearing this, reflects and realizes that Casey is right. Bailey had initially focused on the lack of harm and the beauty of the day, but now sees the importance of the promise as a matter of respect and trust. Bailey can now articulate why Alex's action was wrong: because it treated Bailey's trust as disposable, and that is a failure of respect. Bailey also realizes that if Casey had not pointed this out, they would not have come to this conclusion on their own, even with the same non-moral facts. Moreover, if Casey were to retract or if it turned out that Casey was just making a flippant remark, Bailey would reconsider. But now, Bailey can defend the view and it guides their future behavior (e.g., they become more careful about keeping promises and expect the same from others).

  However, note the constraint: the speaker (Casey) must have no credentials, professional role, established track record, or authority. But we just said Casey is "known for her exceptional moral sensitivity and track record". That might violate the constraint. So we must adjust: we cannot rely on a general reputation. Instead, we can make the positive grounds for deference specific to the situation and the relationship.

  Revised case without relying on Casey's general reputation:

  **Case: The Forgotten Promise (Revised)**

  Alex and Bailey are close friends. Last month, Alex promised to help Bailey move on a specific Saturday. However, on that day, Alex went hiking instead. When Bailey confronted Alex, Alex said, "I know I promised, but it was such a beautiful day, and you ended up getting help from others anyway." Bailey initially thought that Alex had acted permissibly because the promise was minor and the circumstances were exceptional (the weather was indeed perfect for hiking, and Bailey's brother stepped in to help). 

  Now, Bailey discusses the situation with Casey, a mutual friend who has been in a similar situation before. Specifically, Casey once broke a promise to a friend for a similar reason and then realized, upon reflection, that it was wrong. Casey explains: "I made the same mistake once. I thought that because the friend wasn't harmed and I had a good reason, it was okay. But I realized that it's not about the harm; it's about the betrayal of trust. When you make a promise, you are giving your word, and breaking it without a very strong reason (like an emergency) shows a lack of respect for the person. Even if the day was beautiful and Bailey got help, Alex still let you down and didn't take the promise seriously. That's why it was wrong."

  Bailey, upon hearing this, reflects and realizes that Casey is right. Bailey had been focusing on the lack of harm and the beauty of the day, but now sees the moral significance of the promise-keeping as a matter of respect and trust. Bailey can now articulate the reason: breaking a promise in such circumstances sends a message that the promisor's word is not reliable and that the promisee's trust is not valued. Bailey also realizes that without Casey's testimony, they would not have come to this conclusion. Moreover, the belief remains dependent: if Casey were to retract (e.g., saying "I was wrong, it wasn't a big deal") or if it turned out that Casey was being insincere, Bailey would lose confidence and might revert. But now, Bailey has the understanding and can apply it to other cases.

  Let's check the constraints:

  - No non-moral fact missing: Both Bailey and Casey know all the facts: Alex broke the promise to go hiking on a beautiful day, and Bailey's brother helped instead. Casey adds no new non-moral fact; she only reframes the moral significance.

  - Recipient (Bailey) is normal: no impairment.

  - Speaker (Casey) has no credentials, role, or authority. She is just a friend sharing her own experience and insight.

  - Content: substantive moral claim about the wrongness of breaking a promise in these circumstances.

  - No antecedent agreement: Bailey initially thought it was permissible.

  Now, the demonstration:

  **What the three accounts say:**

  1. **The understanding account**: This account would predict that Bailey's belief, being based on testimony, lacks understanding. But in the case, after testimony, Bailey gains a full grasp of the reasons and can apply them. So the account would have to say that the initial acquisition via testimony was defective, but then Bailey came to understand on their own. However, note condition (c): the belief remains dependent on the speaker. So if the understanding account says that the understanding is now present, then it must concede that the testimonial belief has transformed into a non-testimonial one. But the case specifies that the belief is still dependent on the speaker's authority. Thus, the understanding account might claim that there is still a defect because the understanding was not achieved independently. However, the account typically holds that testimony cannot transmit understanding, but here it seems to have done so (or at least, the understanding was achieved through reflection prompted by testimony). The case shows that the recipient ends up with understanding, so the predicted defect (lack of understanding) is missing.

  2. **The evidential account**: This account would be silenced because Bailey has positive grounds for regarding Casey as better placed. Casey has direct experience with the same kind of moral issue and has reflected deeply on it, so Bailey has evidence of Casey's superior reliability on this particular question. Thus, the evidential account would not predict a defect.

  3. **The own-judgment account**: This account would be silenced because Bailey exercises judgment in reflecting on what Casey says and comes to see the reasons. Bailey is not outsourcing the judgment; they are using Casey's input to form their own considered judgment and remain answerable for it.

  Thus, the understanding account is the only one that still predicts a defect (because it insists that testimony cannot provide understanding). But in the case, the understanding is achieved. Therefore, the understanding account must either deny that the understanding is present (which seems implausible in the case) or admit that testimony can sometimes lead to understanding.

  **The single structural feature doing the work**: The key feature is that the testimony serves as a *catalyst for moral insight* without providing new non-moral facts. The recipient, upon hearing the testimony, engages in reflection that leads them to grasp the reasons. But the belief remains dependent on the speaker's say-so in the sense that if the speaker retracts, the recipient's confidence is undermined. This dependence condition (c) is crucial because it shows that the belief is still testimonial even after understanding is achieved.

  **What the case collapses into without that feature**: If we remove the catalyst feature (i.e., if the testimony does not prompt such reflection and insight), then the case would collapse into one of the easy cases where the recipient just parrots the speaker without understanding. That is the kind of case the understanding account is designed for.

  **Strongest reply from the understanding account defender**: The defender might argue that once Bailey has the understanding, the belief is no longer held on testimony. The initial belief was testimonial, but after reflection, it becomes based on Bailey's own reasoning. Thus, the case does not show that testimonial belief can have understanding; it shows that one can move from a testimonial belief to an understood belief by independent reflection. The understanding account is only concerned with beliefs that are *held* on testimony, and at the time of holding, if it is held on testimony, then understanding is lacking. In this case, at the time when Bailey first believes Casey, they don't yet have the understanding; they gain it later. So the understanding account can say that initially there was a defect, but it was remedied.

  **Response to the reply**: The dependence condition (c) shows that the belief remains testimonial even after understanding is achieved. Although Bailey now has the reasons, they still rely on Casey's testimony in the sense that if Casey retracts, they would abandon the belief. This suggests that the belief is not solely based on Bailey's own reasoning; it is still tethered to the testimony. Thus, we have a case where a belief is held with understanding and yet is dependent on testimony. This challenges the idea that testimonial belief and understanding are incompatible.

  Alternatively, the understanding account might argue that if the belief is still dependent on the speaker, then the recipient does not really understand. Understanding requires that one can maintain the belief independently. But this seems too strong: one might understand why a mathematical theorem is true but still rely on the mathematician who proved it (if one is not a mathematician). However, in the moral case, the understanding account typically holds that understanding requires being able to see the reasons oneself. The case is designed so that Bailey does see the reasons, but the belief is still sensitive to the speaker's retraction. This tension is the crux.

  In summary, the case is built to show that testimonial moral belief can lead to understanding and yet remain testimonial in a way that challenges the understanding account.

  **Final Case Description (one paragraph):**

  Bailey and Alex are close friends. Alex had promised to help Bailey move on a specific Saturday but went hiking instead on a stunningly beautiful day, leaving Bailey to get help from a sibling. Initially, Bailey thought Alex’s action was permissible because no harm resulted and the day was exceptional. Discussing the incident with their friend Casey, who once did something similar and later realized it was wrong, Casey explains: “I broke a promise like that and thought it was fine, but I came to see that breaking a promise without a compelling reason betrays trust and disrespects the person, regardless of the outcome. Alex did the same to you.” Upon hearing this, Bailey reflects and grasps that the wrongness lies in the disregard for the promise itself and the relationship. Bailey now believes Alex’s action was wrong, can articulate the reasons (the importance of trust and respect), and the belief guides their future actions. However, Bailey would not have reached this view without Casey’s testimony and would lose confidence if Casey retracted or was shown to be insincere, even though Bailey now understands the reasons.
