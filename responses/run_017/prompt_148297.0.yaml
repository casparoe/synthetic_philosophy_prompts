  ### Case: The Promise of Transparency

  Lena and Jordan are close friends who co-founded a small community arts project. Last month, Jordan privately promised Lena to handle all grant applications for the upcoming cycle, but when a prestigious fellowship arose, Jordan applied for it personally without informing Lena, believing it was a unique opportunity that wouldn't conflict with their shared work. Lena discovered this when Jordan received the fellowship. Initially, Lena felt Jordan had acted permissibly: the fellowship advanced Jordan's career without harming the project, and Jordan had acted out of passion, not malice. Both possess all non-moral facts: the promise's terms, Jordan's motives, the fellowship's details, and the project's unaffected status. Lena discusses this with Taylor, a mutual friend known for acute moral perception in their circle but with no formal authority or track record. Taylor, who once made a similar choice and deeply regretted it, says: "Jordan violated your trust. Promises create relational expectations; breaking one for personal gain—even without harm—expresses disrespect for the bond itself, treating the promisee as a tool rather than an equal. I learned this when I did something comparable and saw the damage to mutual respect." Lena reflects and realizes Taylor is right: the core wrong is the expressive disrespect inherent in unilaterally overriding a commitment for self-interest, not the absence of harm. Lena now believes Jordan’s action was wrong, articulates the reasons clearly (the betrayal of relational equality), and applies this understanding to future interactions, such as insisting on clearer commitments. Yet, if Taylor retracted—e.g., saying, "I overstated; it was fine"—or was exposed as insincere, Lena would abandon the belief despite her grasp of the reasons. Without Taylor’s testimony, Lena could not have derived this view from the non-moral facts and her prior moral framework, which prioritized outcomes over relational expression.

  ### Demonstration of the Case Against the Three Accounts
  1. **Understanding Account Prediction and Failure**: This account predicts a defect because moral testimony allegedly cannot transfer understanding—Lena would lack the ability to articulate reasons, respond to defeaters, or guide action. Yet here, Lena gains full understanding: she articulates the disrespect-based reason, responds to new defeaters (e.g., if Jordan had disclosed the fellowship beforehand, Lena would concede it wasn’t wrong), and the belief reliably guides her conduct. The predicted defect is missing because Taylor’s testimony catalyzed reflective insight, allowing Lena to grasp the moral structure without independent discovery. The account fails by overgeneralizing that testimony precludes understanding; here, it enables it.

  2. **Evidential Account Outcome**: Silenced. Lena has specific evidence of Taylor’s superior reliability: Taylor’s firsthand experience with an analogous moral failure and subsequent reflection make Taylor better placed on this issue. General disagreement among peers is irrelevant, as Lena has positive, case-specific grounds for trust. No epistemic defect arises.

  3. **Own-Judgment Account Outcome**: Silenced. Lena exercises judgment by reflecting on Taylor’s words, integrating them into her moral outlook, and acting autonomously. She takes responsibility for her belief and actions (e.g., confronting Jordan), so there is no outsourcing of deliberation. The account cannot identify a practical defect.

  ### Structural Feature, Collapse, and Reply
  **Single Structural Feature**: The testimony acts as a *reflective catalyst*—it triggers the recipient’s autonomous reasoning by framing the moral significance of known facts, leading to understanding while maintaining testimonial dependence. This avoids the easy cases by ensuring the belief is both understood and epistemically tethered to the speaker.

  **If Feature Removed**: Without the catalytic framing (e.g., if Taylor merely said, "Jordan was wrong, trust me"), the case collapses into an "easy" understanding-based defect case: Lena parrots the verdict without comprehension, satisfying the understanding account’s prediction. This aligns with the "parroting" scenario ruled out by constraint (d), where belief lacks guidance, articulation, and defeater-sensitivity.

  **Strongest Reply from Understanding Account Defender**: The defender argues that once Lena grasps the reasons, her belief ceases to be testimonial and becomes based on her own reflection, so the case "changes the subject" from testimonial belief to understood belief. The initial testimony is merely a heuristic that sparks autonomous reasoning, and the dependence condition (c) is irrelevant—once understanding exists, the belief is no longer held on authority.

  **Response to Reply**: The dependence condition (c) directly counters this. Lena’s belief remains sensitive to Taylor’s epistemic standing (e.g., retraction or insincerity would defeat it), proving it is not grounded solely in her reflection. Even with understanding, the belief’s justification relies on Taylor’s testimony as an ongoing source, making it testimonial. This shows moral testimony can *provide* understanding without the recipient "internalizing" it into an autonomous belief. The understanding account errs by conflating the presence of understanding with the absence of testimonial dependence; this case severs that link, revealing the account’s core assumption—that testimony and understanding are incompatible—as false.
