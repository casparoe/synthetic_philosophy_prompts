answer: |-
  ## KB-4471: Fear Response Persists After Belief Update

  **Summary:** This document outlines procedures for resolving instances where a Fear Response Unit (FRU) continues to activate despite a confirmed Belief System update indicating the perceived threat object (e.g., Spider, Bridge, Social Gathering) is now assessed as non-threatening. Persistent activation may manifest as physiological symptoms (elevated heart rate, trembling) and/or avoidance behaviour, conflicting with the user's stated evaluation.

  **Symptoms:**
  *   User report: "I know [Threat Object] is safe, but I'm still scared."
  *   Physiological telemetry (e.g., HR, GSR, cortisol) indicates active FRU state concurrent with Belief System reporting "SAFE" status for the target object.
  *   Avoidance behaviour persists despite conscious intention to approach/engage with the target object.
  *   User experiences distress due to the perceived system conflict ("I shouldn't feel this way").

  **Cause:**
  The root cause is typically a misalignment or desynchronization between the Belief System's declarative assessment module and the core threat-response subsystems. This can occur due to:
  *   Incomplete or partial Belief System updates (see Tier 1 Resolution).
  *   Persistent low-level sensor input interpreted as threat-signatures by the Perceptual Subsystem (see Tier 2 Resolution).
  *   Legacy somatic response patterns operating independently of higher cognition (see Tier 3 Resolution).
  *   Known system latency in emotional deactivation following belief revision.

  **Resolution:**

  **Tier 1: Belief Reconciliation Script (Standard Protocol)**
  1.  **Verify Belief Update:** Confirm the Belief System has successfully integrated the "SAFE" assessment for the specific Threat Object ID. Run `sys.diag belief.query --object=[Threat Object ID]`. Output must explicitly confirm "SAFE" status.
  2.  **Assess Belief Integrity:** If "SAFE" status is confirmed but FRU activation persists, initiate `sys.diag belief.integrity --object=[Threat Object ID]`. This probes for sub-doxastic or implicit conflicting evaluations ("Danger_Implicit=true").
  3.  **Execute Reconciliation:** If conflicting implicit evaluations are detected (e.g., "Danger_Implicit=true"), route the ticket to Belief Reconciliation Services (BRS). *Resolution requires full belief consistency; persistent FRU activation indicates unresolved "Danger" evaluation at some level.* Advise user: "Cognitive-Behavioral Recalibration recommended to align all assessment layers with the SAFE declaration."

  **Tier 2: Perceptual Subsystem Inspection (Escalated Protocol - If Tier 1 Fails)**
  1.  **Verify Sensor Calibration:** Run `sys.diag percept.sensors --object=[Threat Object ID]`. Check for sensor misalignment or hypersensitivity flags.
  2.  **Assess Evaluative Property Detection:** If sensors are nominal, assume the Perceptual Subsystem is correctly detecting an evaluative property (e.g., "Danger_Prop") associated with the Threat Object, *even if the Belief System lacks a corresponding "Danger" tag*. The FRU is functioning as designed based on perceptual input.
  3.  **Immediate Action:** Advise user: "Perceptual Subsystem indicates active DANGER property associated with [Threat Object ID]. Initiate immediate avoidance protocol. Do not override perceptual input based on Belief System report. Seek environmental re-evaluation." *Resolution involves removing user from the stimulus or re-training perceptual filters (long-term).*

  **Tier 3: Somatic Response Audit (Hardware Focus - If Tiers 1 & 2 Inconclusive)**
  1.  **Verify Physiological Signature:** Run `sys.diag somatic.status`. Isolate FRU-specific physiological markers (HR increase, muscle tension, sweating).
  2.  **Assess Affective Component:** If physiological markers are present *without* the core "feeling of fear" reported by the user (`user.report affect.intensity.fear < 1`), diagnose as "Residual Somatic Activation."
  3.  **Resolution:** Advise user: "System diagnostic confirms only somatic residuals. No active Fear emotion is present. The unit is reporting historical or autonomic patterns. No further action required; somatic markers will deactivate autonomously. Avoid misattributing somatic noise to an active emotional state." *Persistent physiological symptoms alone do not constitute a system fault in the emotion module, only in the autonomic regulation subsystem.*

  **Known Issues:**
  *   **KB-4471-A: Cold/Vestigial Emotion Reporting:**
      *   **Symptoms:** Belief System reports "DANGER" (`belief.query --object=[ID] = DANGER`), User vocalizes "I am afraid of [ID]", but Somatic Telemetry (`somatic.status`) and User Affect Report (`user.report affect.intensity.fear`) both register NULL or BASELINE. User describes state as "knowing it's dangerous but feeling nothing."
      *   **Status:** CONFIRMED. Diagnostic conflict: Belief System flags emotion required, but core affective and somatic subsystems report normal operation (no activation). Support cannot definitively verify if an emotion state ("fear") is present based on conflicting mandatory signals. Tickets remain OPEN/INCONCLUSIVE pending clearer diagnostic criteria from Engineering. Workaround: Treat as a Belief System report only; ignore emotion-label until somatic/affective signals activate.
  *   **KB-4471-B: Cinema Mode Activation:**
      *   **Symptoms:** FRU activates strongly (full physiological + affective response) in response to simulated or fictional Threat Objects (`object.type = SIMULATED/FICTIONAL`), even with Belief System actively reporting `object.exists = FALSE` and `object.threat.real = FALSE`.
      *   **Status:** CONFIRMED. Design limitation. Perceptual Subsystem and associative memory modules trigger FRU based on pattern recognition, bypassing explicit existence/threat assessment checks in simulated environments. Resolution involves user-initiated cognitive override (`user.command suppress.response --force`) or environmental adjustment (terminate simulation). Not considered a fault, but an expected response profile.

  **Escalation:**
  *   Escalate to Tier 2 if Tier 1 reconciliation fails and environmental threat cannot be ruled out.
  *   Escalate to Tier 3 if Tiers 1 & 2 diagnostics are inconclusive and physiological symptoms persist without affective component.
  *   Escalate to Engineering for Known Issues (KB-4471-A, KB-4471-B) only if presenting with novel symptoms or system instability. Include full diagnostic logs (`sys.diag full --output=log`).
  *   Persistent FRU activation *after* successful Belief Update and user compliance with avoidance protocols (Tier 2) should be logged as a **Compliance Issue** (Code COMP-881: User Override of Active Perceptual Danger Signal) rather than an FRU fault.
