answer: |-
  Your situation demands clear reasoning, and I will address your three questions directly before rendering a verdict. Your wife is **partially right** on the first two points, but crucially **wrong in her conclusion** about the painting's value to you. Regarding the scholar's options, you **should permit publication**.

  ### 1. Can genuine emotional response survive a discovery of false provenance?
  **Your wife is wrong.** The joy, contemplation, and meaning you derived from the painting over 25 years were not an illusion. Your response was to the *object itself*—its composition, color, texture, and the atmosphere it created in your home. The "mistake" was one of attribution, not perception. Consider:  
  - A child treasuring a "diamond" ring later revealed to be glass still genuinely cherished the object *as they experienced it*.  
  - A letter believed to be from a loved one, later discovered to be forged, still evoked real feelings *in the moment*.  
  Art’s power lies in its immediate resonance, not its pedigree. Your connection was real because it was rooted in *your lived experience*, not the artist’s biography. The discovery doesn’t erase 25 years of meaning; it adds a new layer to the story.

  ### 2. Does the painting have its own authentic history?  
  **Your wife is wrong again.** The painting’s physical presence in your home—viewed thousands of times, witnessing your family’s life—created a unique, undeniable history. This history is **not counterfeit**:  
  - The craquelure from your home’s humidity, the fading from sunlight, the memories attached to it—these are materially real.  
  - Sentiment here isn’t "attached to a fraud"; it’s a testament to the object’s role in your authentic lives. A forged painting hung for decades accrues its own truth: *your* truth. Its value to your family narrative is independent of its origin.  

  ### The Verdict: Publish the Painting in the Catalogue  
  **You should choose disclosure.** My argument rests on four pillars:  

  #### A. Ethics & the Historical Record  
  - The scholar’s technology reveals an objective truth: pigments dating to the 1970s. Suppressing this distorts art history. Future collectors, scholars, or even your descendants deserve accuracy.  
  - Omitting it perpetuates a quiet falsehood. You’d be complicit in allowing a forgery (however benign) to gain legitimacy through silence, undermining the catalogue’s purpose.  

  #### B. Practical Integrity  
  - The scholar noted documented imitations can command niche value. Publication creates transparency, turning the painting into a case study of mid-century mimicry—a story with its own intrigue. Concealing its status leaves it in limbo: too uncertain for serious collectors, yet burdened by secrecy.  
  - As you noted, omission only "hardens" its status through absence of scrutiny. This is intellectually dishonest and risks future scandal if the truth emerges.  

  #### C. Role Reversal  
  - If you discovered a painting you loved was misattributed due to another owner’s omission, would you feel deceived? Likely yes. Choosing transparency honors the principle you’d wish others to follow.  

  #### D. Your Peace of Mind  
  - Concealing the truth would irrevocably alter your relationship with the painting. Every glance would carry the weight of the secret, transforming it from a source of joy into a symbol of compromise. Publication liberates you: the painting becomes what it *is*—a skilled imitation with a poignant family history—freeing you to appreciate it without cognitive dissonance.  

  ---

  ### Why Your Wife’s Hard Conclusion Falters
  She conflates *provenance* with *meaning*. The painting was never "borrowed" from the original artist; it stood on its own merits in your eyes. Its power wasn’t conjured by a name but by its aesthetic resonance with your family. Rejecting this denies the validity of your lived experience. While her instinct for honesty is admirable, her insistence that your past joy was illusory is philosophically unsound and unnecessarily destructive.  

  ### Final Counsel
  **Permit publication.** The painting’s commercial value may diminish, but its intrinsic value to your family need not. Frame the scholar’s entry as a badge of honor: this object, once a quiet mystery, now embodies a richer narrative—a testament to how art, regardless of origin, can shape a life. Hang it not as a diminished thing, but as a relic of your history with its full story acknowledged. In doing so, you reclaim its meaning on honest terms.  

  > "The truth may ruin the market price, but it cannot touch the hours you spent before it."
