  So the added feature is: the agent has a dual system of evaluation. She endorses a long-term perspective (exponential discounting) as her normative standard, but she is subject to present bias in her actual choices.

  Now, the objector: someone who says there's no weakness of will, only shifting preferences. Their objection: "In the original case, Emma never acts against her own judgment at the time of action. On Tuesday, she judges A to be better. So she is not weak-willed; she just has a different preference on Tuesday. The regret is just a feeling, but it doesn't indicate a failure of will."

  Reply: But she ends up with an outcome that, by her own settled and considered judgment (from Monday), is worse. Moreover, she would take steps to bind herself. This shows that she views her Tuesday self as an obstacle to her own goals. However, the objector might say that the Tuesday self is just as much her, and its preferences are valid. The reply to that is that we often identify a person with their long-term plans and values, not their momentary impulses.

  Is the objection fatal? It's serious because it challenges the welfare criterion. But in the literature, it's common to take the initial or long-run perspective as the welfare standard. However, this is contested.

  Now, for the JSON.

  Settled vs contested:
  - The functional form of discounting (quasi-hyperbolic) and its ability to explain reversals is settled in behavioral economics.
  - The interpretation of the welfare standard (which self's preferences count) is contested.
  - Whether sophistication helps or hurts: it hurts in this case because she knows she will give in and cannot commit, so she ends up with the worse outcome. But without commitment, sophistication leads to the worst outcome. This is settled in models of present bias.

  Finally, does the case show the question survives? The case shows that procrastination can arise from shifting preferences without a moment of acting against one's better judgment. But it also shows that this can lead to regret and a desire for commitment, which feels like a failure of will. The column's question survives: we can have procrastination that is not akratic but still a failure of timing, yet it leaves open the possibility that in some cases (akratic sibling) it is weakness of will.

