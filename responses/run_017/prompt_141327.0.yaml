  | **Clashing bedrock intuitions**      | Whether modality requires *strict numerical persistence* across possibilities (Kripke) or *contextual representation* (Lewis). | Haecceitism: Transworld identity allows distinct but qualitatively identical worlds (bare identities), while counterpart theory typically rejects this as unintelligible. | Context-sensitivity bridges intuitions: counterpart theorists can mimic "strict" identity by tightening similarity, blurring the distinction.                           | Empirical psychology: studies showing universal intuitions about "personal identity" in counterfactuals.   | 20%                          |

