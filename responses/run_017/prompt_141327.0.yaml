  Below is a diagnosis structured per your request, followed by the JSON summary. The analysis prioritizes (a) intertranslatability, (b) hard cases, and (c) haecceitistic differences, using explicit commitments of each view (Lewisian counterpart theory vs. Kripkean transworld identity).

  ---

  ### Diagnosis Table
  | candidate_diagnosis                  | what the dispute is really about                                                                 | strongest point in its favour                                                                                                                               | strongest point against it                                                                                                                                             | what would count as progress if it's right                                                                 | pct_of_the_action_it_explains |
  |--------------------------------------|--------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|-------------------------------|
  | **Substantive dispute**              | What *grounds* de re modality: primitive transworld identity vs. similarity/counterpart relations. | Hard cases (e.g., "I might never have existed") force incompatible answers: counterpart theory denies transworld identity *can* ground such claims.          | Intertranslatability: Any model of one theory can be formally mirrored in the other, suggesting no deep metaphysical divergence.                                       | A proof that one grounding relation violates modal logic (e.g., invalidates necessity of identity) or empirical constraints (e.g., origin essentialism). | 40%                          |
  | **Verbal dispute (dissolved by translation)** | Whether "identity" in modal contexts *must* mean numerical identity or can mean counterpart relation. | Lewis's translation scheme: counterpart predicates can be redefined as a non-standard "identity" relation (e.g., "x-in-w₁ is y-in-w₂" iff counterparts). | Kripke insists numerical identity is non-negotiable for *de re* claims; no translation preserves the "strictness" of identity (e.g., for haecceitism). | Universal acceptance of a translation manual showing all arguments are equivocal.                          | 10%                          |
