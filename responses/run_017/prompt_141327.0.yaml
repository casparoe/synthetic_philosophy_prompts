  First, I need to unpack their hypothesis. They're suggesting that the standard framing bundles distinct issues, creating artificial standoffs. For instance, Kripke's objections target Lewis's package deal (concrete worlds + counterparts), but one could mix views: actualist counterpart theory or abstract transworld identity. The context-sensitivity point about modal claims like "I could have been a poached egg" adds another layer—disagreements might stem from pragmatics, not metaphysics.

