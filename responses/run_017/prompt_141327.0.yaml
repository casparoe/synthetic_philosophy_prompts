  (b) Hard cases: These reveal asymmetries. "I might never have existed" is straightforward for counterpart theory (no counterpart) but tricky for transworld identity—some ersatzers use existence-entailing properties. Worlds with no resembling entities challenge counterpart theory's similarity metric but are handled by transworld identity if identity is primitive. Cases of radical dissimilarity might favor counterpart theory if context allows loose similarity, but transworld identity struggles unless identity is world-independent.

  (c) Haecceitism: Here, the views diverge sharply. Counterpart theory can deny haecceitistic differences by tying representation to qualitative similarity, while transworld identity allows them via bare identities. This affects truth conditions: claims about how many things could exist or whether worlds can differ only non-qualitatively get different answers. For example, a haecceitist scenario where two worlds are qualitatively identical but swap individuals—transworld identity might accept this, but counterpart theory rejects it if counterparts are qualitatively determined.

  For the diagnosis table, I consider four options: substantive dispute, verbal dispute, two questions conflated, or clashing intuitions. 

  - Substantive: It's about what grounds de re modality. Pro: hard cases show incompatibility; con: translatability suggests underlying agreement.
  - Verbal: Translators exist, but con: the grounding disagreement remains metaphysical.
