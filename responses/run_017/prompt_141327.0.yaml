    "one_line_on_what_I_should_stop_saying_in_seminar": "Stop saying 'counterpart theory denies transworld identity'—it redefines it relationally; say instead 'counterpart theory rejects primitive transworld identity as explanatorily vacuous'."
  }
  ```

  ---

  ### Argument for Diagnosis
  #### (a) Intertranslatability relocates but doesn’t defuse  
  Lewis’s translation scheme recodes counterpart relations as a three-place "identity" relation (e.g., "x in w₁ is identical to y in w₂" iff y is x’s counterpart in w₂). Conversely, transworld identity can be mimicked by defining counterpart relations as identity-involving (e.g., "y is a counterpart of x iff y is identical to x"). **But**: Kripkeans object that this "identity" is *derived* from similarity, violating the necessity of identity (if "x = y" holds contingently across worlds, it’s not identity). Lewisians retort that primitive transworld identity is mysterious and unexplanatory. The dispute becomes: *Which relation is metaphysically fundamental?* Translatability relocates the fight to grounding, not defuses it.  

  #### (b) Hard cases reveal asymmetries  
  - **"I might never have existed"**: Counterpart theory easily handles this—no counterpart of you exists in some world. Transworld identity requires ersatz maneuvers (e.g., Plantinga’s "individual essences" that don’t entail existence).  
  - **Radical dissimilarity**: A world with nothing resembling you (e.g., a chaotic void) is unproblematic for counterpart theory (no counterpart → "I don’t exist there"). Transworld identity struggles: if identity is primitive, you could "exist" there without qualitative grounds, violating supervenience.  
  - **Asymmetric work**: These cases favor counterpart theory’s flexibility but *undercut* transworld identity’s claim to intuitive primacy.  

  #### (c) Haecceitism & population divergences  
  - **Haecceitistic differences**: Transworld identity permits worlds differing *only* in which objects exist (e.g., two worlds identical qualitatively but with swapped individuals). Counterpart theory typically forbids this—counterparts are qualitatively similar, so no representation without qualitative grounds.  
  - **"How many things could have existed?"**: Counterpart theory restricts possibilities to what resembles actual individuals. Transworld identity allows indiscernible "extra" objects (if identity is primitive).  
  - **Truth conditions diverge**: "World w has exactly 10^10^10 possible objects" is *false* for counterpart theory (worlds represent only via similarity) but *possibly true* for transworld identity.  

  ### What Counts as Progress?  
  - **Distinction**: Decoupling the axes (truthmaker vs. world ontology) and acknowledging context-sensitivity in modal discourse.  
  - **Formal result**: Proving that counterpart relations cannot capture rigid designation or essential properties without collapsing into ad hoc identity.  
  - **Change of question**: Shift to "What do our *best scientific theories* require of modality?" (e.g., origin essentialism in biology).  

  ### Will This Stall Forever?  
  Likely yes—unless empirical constraints (e.g., from physics or cognitive science) force a consensus. The dispute hinges on pre-theoretic intuitions about "identity" and "possibility," which are resistant to refutation. However, clarifying the axes and context-sensitivity could reduce talking-past-each-other by 60–70%.
