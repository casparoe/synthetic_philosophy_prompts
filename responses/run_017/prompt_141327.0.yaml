    "biggest_single_source_of_confusion": "Conflation of the two axes (truthmaker relation vs. world ontology) and failure to disentangle context-sensitivity in modal claims from metaphysical commitments.",
    "most_decisive_thing_that_would_settle_it": "A formal result proving that counterpart relations (or transworld identity) cannot satisfy essential properties demanded by actual science (e.g., origin essentialism) without ad hoc adjustments.",
