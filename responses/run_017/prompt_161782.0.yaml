  - When Idris uses the clone case, he successfully shows sameness of genome isn't sufficient, but Rowena's demand for an alternative account is valid

  What both might be missing: Kripke's original formulation is about necessity of origin, not just gametes. The debate conflates numerical identity with qualitative identity at times. There's also unexamined assumptions about what "origin" means - is it the gametes, the conception event, or something else?

