   I think it's hard to find an example where KS does badly. Maybe skip it and just note that the Nash solution has the advantage of independence of irrelevant alternatives, which KS sometimes violates. 

   Alternatively, we can use the example from the original paper or textbooks. Given the time, we will simply state that no solution can satisfy all desirable properties.

  What will go wrong the first time:
  - The added point (36,8) might not be negotiated away from (20,20) by some pairs. They might not see the point and just choose (20,20) again. To mitigate, encourage them to consider the new option and how it might affect what is fair.
  - The maths-econ student might dominate and compute everything quickly. Use him as a helper: ask him to compute the product-max for the new set and then ask the class if they agree.
  - The currencies being different might lead them to focus on relative gains. The activity should still work.

  What the activity can't do:
