answer: |-
  ### Materials and Setup
  Provide each pair of students (Player 1 and Player 2) with:
  - **Round 1 handout**: A chart of a convex feasible set (shaded triangle) with vertices at (0,0), (40,0), and (20,20). Axes are labeled "Player 1: Chocolate Squares (0–40)" and "Player 2: Raffle Tickets (0–20)". Disagreement point at (0,0).  
  - **Round 2 handout**: The same chart but with a new point (36,8) added, extending the feasible set to a quadrilateral (convex hull of (0,0), (40,0), (20,20), (36,8)). Mark (36,8) prominently.  
  - **Supplement**: A slip explaining, "A new option (36,8) is feasible. The set is convex; any point between existing points is allowed."  
  - **Payments**: Player 1 receives chocolate squares; Player 2 receives raffle tickets for a book voucher raffle. No exchange rate is provided. Use 1:1 scaling (e.g., agreed 20 chocolate = 20 squares).  
  - **Projector**: Display blank axes (0–40 chocolate, 0–20 tickets) to sketch agreements.  

  Pairs negotiate face-to-face. If no agreement, both get (0,0). After each round, collect outcomes.  

  ---

  ### The Charts, with Arithmetic Checked  
  **Round 1 (Triangle: (0,0), (40,0), (20,20))**  
  - **Nash solution**: Maximizes product \(x \cdot y\).  
    - Pareto frontier: Line from (20,20) to (40,0); equation \(y = 40 - x\).  
    - Product: \(x(40 - x) = 40x - x^2\). Derivative: \(40 - 2x = 0\) → \(x = 20\), \(y = 20\).  
    - *Solution: (20,20)*.  

  **Round 2 (Quadrilateral: (0,0), (40,0), (20,20), (36,8))**  
  - **New Pareto frontier**: Segments from (20,20) to (36,8) and (36,8) to (40,0).  
  - **Nash solution**: Maximize \(x \cdot y\) on each segment:  
    - *Segment (20,20)–(36,8)*: Parametrize \(x = 20 + 16t\), \(y = 20 - 12t\) (\(t \in [0,1]\)).  
      Product: \((20 + 16t)(20 - 12t) = 400 + 80t - 192t^2\).  
      Derivative: \(80 - 384t = 0\) → \(t = 80/384 = 5/24 ≈ 0.2083\).  
      Thus, \(x = 20 + 16 \times 5/24 ≈ 23.33\), \(y = 20 - 12 \times 5/24 = 17.5\).  
    - *Segment (36,8)–(40,0)*: Maximum product at (36,8) is 288 (less than 23.33×17.5≈408).  
    - *Solution: (23.33, 17.5)*. Player 2 loses 2.5 units vs. Round 1.  
  - **Ideal point unchanged**: Player 1’s max = 40 (at (40,0)), Player 2’s max = 20 (at (20,20)).  
  - **Kalai-Smorodinsky (KS) solution**: Intersects ray \(y = (20/40)x = 0.5x\) with Pareto frontier.  
    - On (20,20)–(36,8): Solve \(0.5x = -(3/4)x + 35\) → \(x = 28\), \(y = 14\).  
    - *KS: (28,14)*. Player 2 gains 0.67 vs. Round 1 KS (not negotiated).  

  ---

  ### Minute-by-Minute  
  **0–5 min**: Intro. Remind students of Nash axioms. Explain: "Today, negotiate in pairs over chocolate (P1) and raffle tickets (P2). Two rounds; fail → (0,0)." Assign roles.  
  **5–15 min**: **Round 1**. Distribute Triangle chart. Pairs negotiate. Most will agree near (20,20). Maths-econ student may compute Nash aloud—invite him to share. Project pairs’ outcomes (cluster near (20,20)).  
  **15–20 min**: Quick debrief. Ask: "Why (20,20)? Is it fair?" Highlight symmetry and product maximization.  
  **20–30 min**: **Round 2**. Distribute Quadrilateral chart + supplement. Stress: "New option added, but no one’s best-case improved." Pairs negotiate. Maths-econ student may compute new Nash (23.33,17.5); let him explain.  
  **30–35 min**: Collect results. Project outcomes (likely near (23.33,17.5)). Ask: "Player 2s, how do you feel? Did you lose ground?"  
  **35–50 min**: **Reveal the shift**. Contrast Round 1 (P2=20) and Round 2 (P2≈17.5) averages. Ask: "Why did P2 lose 2.5 units when the set grew? What’s unfair here?"  
  **50–60 min**: **Guided discovery**. Ask: "How might we adjust the rule to prevent this? Hints: What’s the best each could get? How close do they come?" Steer toward "fraction of ideal."  
  **60–75 min**: **Debrief** (see below).  
  **75–80 min**: Wrap-up. Preview next week: "We’ll name these rules and see their trade-offs."  

  ---

  ### Where the Idea Bites  
  - **Round 2 negotiation**: Player 2 feels cheated ("I got less, but nothing was taken!"). This mirrors Nash’s violation of *monotonicity*—expanding the set shouldn’t hurt players, but adding (36,8) pulls the product-maximizing point away from Player 2.  
  - **Maths-econ moment**: His calculation (23.33,17.5) proves the Nash outcome *must* shift, creating cognitive dissonance. Students see the rule "deciding" against Player 2.  
  - **Ideal point insight**: When students suggest "compare fractions of best outcomes," they derive KS intuitively. They notice KS (28,14) rewards both when the set grows, fixing Nash’s flaw.  
  - **Axiom break**: Later, when you show KS violating *independence of irrelevant alternatives* (e.g., in a set where adding a Pareto-dominated point shifts KS), students see Nash’s strength—no arbitrary menu changes alter it.  

  ---

  ### Debrief  
  1. **Problem recap**: "In Round 2, Player 2 lost 2.5 units despite the set growing. Why? Nash maximizes the product, and (36,8) skewed the calculus. But your instinct said: ‘This isn’t fair!’"  
  2. **Student insight**: Highlight proposals like "ensure both get equal fractions of their best outcomes." Formalize this as the **Kalai-Smorodinsky solution**: equal relative concessions from the ideal point (40,20).  
  3. **Contrast rules**:  
     - *Nash*: Satisfies independence of irrelevant alternatives (adding (36,8) doesn’t alter non-Nash options), but fails monotonicity (Player 2 loses).  
     - *KS*: Satisfies monotonicity (both gain when set expands without changing ideals), but fails independence (e.g., add a point like (10,15); KS shifts even if ignored).  
  4. **Mirror example**: Project a symmetric set + a point that *lowers* Player 1’s ideal. KS immediately "punishes" Player 1; Nash doesn’t budge. E.g., triangle (0,0), (20,0), (0,20) → add (0,18). KS jumps to (10,12), Nash stays (10,10). KS prioritizes relative gains, even for irrelevant options.  
  5. **Conclusion**: "No rule is perfect. Nash prioritizes stability; KS prioritizes equity when opportunities grow. Context decides."  

  ---

  ### What Will Go Wrong the First Time  
  - **Pairs ignore (36,8)**: Some may revert to (20,20). Mitigate by emphasizing: "The new option is real—use it in your arguments!" or project an anonymous "bid" (e.g., "P1: I want 25 chocolate!").  
  - **Maths-econ dominates**: If he computes too fast, task him with "arbitrating" a stuck pair or defending Nash’s shift to the class.  
  - **Player 2 undercuts**: To avoid "losing," Player 2 might accept low tickets early. Remind: "Maximize your payoff—chocolate/tickets are valuable!"  
  - **Misinterpret axes**: A few may conflate currencies. Clarify: "No exchange rate! Player 1 *only* cares about chocolate, Player 2 about tickets."  

  ---

  ### What the Activity Can’t Do  
  - **Prove KS superiority**: It only exposes one Nash flaw. Students might leave over-favoring KS; the mirror example is crucial.  
  - **Cover all axioms**: Symmetry, Pareto efficiency, and scale invariance aren’t deeply explored.  
  - **Simulate real-world complexity**: Negotiation is stylized; behavioral factors (e.g., empathy) may distort outcomes.  
