          Product: (39+s)(2-2s)=78-78s+2s-2s^2=78-76s-2s^2.
          Maximum at s=0: product 78.
     So Nash solution (20.55,19.47) — player 2 drop is only 0.53.

  So the added point (36,8) gives the biggest drop (2.5) in the scaled-up version.

  Therefore, we will use:
     Round 1: Feasible set is the convex hull of (0,0), (40,0), (20,20). Disagreement point (0,0). The Nash solution is (20,20). 
     Round 2: Add the point (36,8). The feasible set is now the convex hull of (0,0), (40,0), (20,20), (36,8). Nash solution is (23.33,17.5).

  To make the currencies non-comparable, we will label the axes in different units: 
     Player 1: Chocolate squares (0 to 40)
     Player 2: Raffle tickets (0 to 20)

  In the first round, the Pareto frontier is from (40,0) to (20,20): which is a line. In the second round, the Pareto frontier is from (20,20) to (36,8) and then to (40,0).

  We will now design the activity.

  Materials and Setup:
  - Prepare two handouts for each pair: 
     Handout 1 (Round 1): A chart with the feasible set (triangle with vertices (0,0), (40,0), (20,20)) and disagreement point (0,0). Label axes: "Player 1 (Chocolate Squares)" and "Player 2 (Raffle Tickets)".
     Handout 2 (Round 2): The same chart but with an additional point (36,8) and the feasible set extended to include it. Make sure to mark the new point. Also, provide a separate slip of paper explaining that the feasible set now includes (36,8) and that it is convex.
  - Each pair has two students: one as Player 1 (chocolate) and the other as Player 2 (raffle tickets).
  - Each pair gets one chocolate square and one raffle ticket for the activity, but they will negotiate for more based on the outcome.
  - Also, prepare a few extra handouts for the debrief.

  The charts:
     Round 1: 
          Axes: 
              x: 0 to 40 (Chocolate Squares for P1)
              y: 0 to 20 (Raffle Tickets for P2)
          Feasible set: a triangle with vertices (0,0), (40,0), (20,20). 
          The Pareto frontier is the line segment from (20,20) to (40,0). 
          Disagreement point: (0,0).

     Round 2: 
          Same axes.
          Feasible set: convex hull of (0,0), (40,0), (20,20), (36,8).
          This adds a new point (36,8) and the Pareto frontier has two segments: 
               from (20,20) to (36,8) and from (36,8) to (40,0).
          The new point (36,8) is highlighted.

  Arithmetic: 
     Round 1 Nash: (20,20) (by symmetry or by product maximization: at (20,20) the product is 400. At any other point on the frontier: say (30,10): 30*10=300<400.)
     Round 2 Nash: 
          On segment (20,20) to (36,8): 
              x = 20 + 16t, y = 20 - 12t, t in [0,1]
              Product = (20+16t)(20-12t) = 400 - 240t + 320t - 192t^2 = 400 + 80t - 192t^2.
              d/dt = 80 - 384t = 0 => t=80/384=5/24≈0.2083.
              x=20+16*(5/24)=20+80/24=20+10/3≈23.33
              y=20-12*(5/24)=20-60/24=20-2.5=17.5.
          On segment (36,8) to (40,0): 
              Product at (36,8)=288, at (40,0)=0, and the maximum in between is less than 400+80t-192t^2 at t=5/24≈408.33, so (23.33,17.5) is the Nash solution.

  Minute-by-minute (80 minutes total):

  0-5 min: Introduction. Remind students of the Nash solution and its axioms. Explain that today they will negotiate in pairs over two different goods (chocolate and raffle tickets). They will play two rounds. In each round, they will have 10 minutes to negotiate. If they fail, they get (0,0). If they agree, they get the agreed point (and we will convert to real chocolate and raffle tickets).

  5-15 min: Round 1. Distribute Handout 1. Pairs negotiate. The maths-econ student might quickly suggest (20,20) because of symmetry and product maximization. Most pairs will agree on (20,20) or nearby. Record a few outcomes.

  15-20 min: Collect results. Ask a few pairs to report. They will likely have (20,20). Ask: "Why did you choose that point?"

  20-30 min: Round 2. Distribute Handout 2 and the slip about the new point. Emphasize that the feasible set has expanded. Pairs negotiate again. The new point (36,8) might be discussed. Player 1 might push for more than 20, but player 2 might resist. The maths-econ student might compute the new Nash solution (23.33,17.5) and suggest it.

  30-35 min: Collect results. Note that player 2 now gets less than 20. Ask: "Did anyone get exactly (20,20) again? Why not?"

  35-55 min: The Reveal. Show the results from the class: in round 1, almost everyone got (20,20). In round 2, many got around (23.33,17.5). Player 2 is worse off. Ask: "Is this fair? The set got bigger, but player 2 is worse off. Why?" Then ask them to look at the rule they know (Nash: maximize product). Compute the product for (20,20) is 400. For (23.33,17.5): 23.33*17.5≈408.33, which is higher. So the rule they know (Nash) says this is better. But player 2 is worse off. 

  55-65 min: Introduce the proportional rule. Without naming KS, ask: "Is there a different way to divide that takes into account how well each player could have done?" Guide them to the ideal point: for player 1, the best they can get is 40 (ignoring player 2), for player 2, 20. So the ideal is (40,20). In round 1, they got (20,20): player 1 got 20/40=50%, player 2 got 20/20=100%. Ask: "Can we find a point where both get the same fraction of their ideal? But ideally on the Pareto frontier." The fraction for player 1: x/40, for player 2: y/20. Set x/40 = y/20 => y = x/2. Now, in the first set, the Pareto frontier is from (20,20) to (40,0). The line y=x/2: when x=20, y=10; when x=40, y=20. But the point (40,20) is not feasible. The feasible points: on the frontier, y = -x + 40? Wait, from (20,20) to (40,0): slope = (0-20)/(40-20)= -1. So y = -x + 40. Set y=x/2: x/2 = -x+40 => 1.5x=40 => x=80/3≈26.67, y=40/3≈13.33. But is that on the frontier? The frontier is from (20,20) to (40,0). At x=26.67, y= -26.67+40=13.33, yes. But also, we have the point (20,20) which is above y=x/2? (At x=20, y=20>10). So the proportional rule would be at (26.67,13.33) in the first set? But that's worse for both than (20,20). So that's not the KS solution. 

  We must use the KS solution: it is the point on the Pareto frontier that is proportional to the ideal point. The ideal point is (40,20). The ray from (0,0) to (40,20) is y = (20/40)x = 0.5x. In the first set, the Pareto frontier is the line from (20,20) to (40,0): which is y=40-x. Set 0.5x = 40-x => 1.5x=40 => x=80/3≈26.67, y=40-26.67=13.33. So the KS solution is (26.67,13.33). But this is not (20,20). 

  This is a problem because in the first round they negotiated to (20,20). We wanted them to experience the Nash solution. 

  Alternatively, we can change the first set to be symmetric. But then the added point must be chosen so that the Nash solution moves in a way that hurts player 2. We saw that in the symmetric set (0,0), (40,0), (0,40) — adding (36,8) did not make player 2 worse off. 

  Given the time, we will proceed with the first example and in the debrief, we will explain that in round 1, they did not follow the Nash solution to the letter, but the spirit of the activity is to see that when the set expands in a way that doesn't change the ideal point, player 2 might be harmed under the product rule. 

  So in the debrief, we will say: "In round 1, many of you chose (20,20) which is not the Nash solution? Let me compute the Nash solution for this set." Then we show that the product at (20,20) is 400, but at (26.67,13.33) it is 26.67*13.33≈355.5, which is less. And at (40,0) it is 0. So the maximum product is indeed at (20,20). So they did choose the Nash solution. 

  Then in round 2, the Nash solution moved to (23.33,17.5). 

  Now, the KS solution in round 1: (26.67,13.33). In round 2: the ideal point is still (40,20). The ray y=0.5x. The Pareto frontier now: 
     Segment 1: from (20,20) to (36,8): 
          Equation: slope = (8-20)/(36-20)= (-12)/16=-3/4.
          So y - 20 = (-3/4)(x-20) => y = - (3/4)x + 15 + 20 => y = - (3/4)x + 35.
     Set y=0.5x: 
          0.5x = -0.75x + 35 => 1.25x=35 => x=28, y=14.
     Check if on the segment: at x=28, on [20,36]: yes. Then y= -0.75*28+35= -21+35=14. 
     Segment 2: from (36,8) to (40,0): 
          y - 8 = [(0-8)/(40-36)](x-36) = (-8/4)(x-36)= -2(x-36) => y= -2x+72+8 = -2x+80.
          Set y=0.5x: 0.5x=-2x+80 => 2.5x=80 => x=32, y=16.
          But is x=32 in [36,40]? No. So only the first segment has the solution: (28,14).

  So in round 1, KS: (26.67,13.33); in round 2, KS: (28,14). Player 1: 26.67->28 (increase), player 2: 13.33->14 (increase). 

  So the activity: in round 1, students chose the Nash solution (20,20) and in round 2, they might have chosen the new Nash solution (23.33,17.5). Player 2 is worse off (20->17.5). Meanwhile, the KS solution in round 1 was (26.67,13.33) (which they didn't choose) and in round 2 is (28,14). 

  But the point is that under Nash, player 2 was hurt by the expansion, while under KS, both players improve. 

  Where the idea bites: 
  - In round 1, students experience a symmetric outcome. 
  - In round 2, they see that adding an option that only player 1 might want (36,8) changes the outcome to one where player 2 gets less, even though the best they could ever get (20) hasn't changed. 
  - When they compute the Nash solution, they see it moves to a point that has a higher product but leaves player 2 worse off. 
  - This leads them to question whether the product rule is fair in this context.

  Debrief:
  - Explain that they have encountered a violation of "monotonicity": when the set grows, one player might be worse off under the Nash solution.
  - Introduce the KS solution as an alternative that uses the ideal point to ensure that expansions that do not change the ideal point do not harm players.
  - Show the KS solution for both rounds: both players improve when the set grows.
  - But then show a scenario where the KS solution does something ugly: it fails independence of irrelevant alternatives. Use an example where the ideal point changes. For instance, take a set with ideal point (10,10), KS solution might be (5,5). Then add a point (0,20) which changes the ideal point to (10,20). The new KS solution: ray to (10,20) is y=2x. If the frontier is still the same, might move to (5,10) (if possible). Then player 1 still gets 5, but player 2 gets 10. Player 1 is not worse off, but player 2 benefits. But we want an example where the Nash solution is better. 

