  Below is a complete, playable game design for your seminar, built around your core mechanic and learning objectives. I'll address your concerns about circularity ("virtù vs. success"), incorporate Machiavellian concepts (fortuna as unarranged circumstances, tempo shifts, expiring windows), and provide materials you can create with index cards. The game forces players to confront the ambiguity between skill and luck without explicitly naming it, and the post-game "virtù assessment" creates tangible data on circular reasoning.

  ---

  ### **Game Title:** *The River and the Ruler*  
  **Core Conflict:** Players lead a principality through 8 rounds of decisions. Success requires adapting to hidden "tempo" shifts (calm/torrent eras) and balancing resources vs. risks, while a hidden die roll secretly determines half their outcomes. The gap between perceived virtù (based on observed decisions) and actual success reveals circular logic.  

  **Materials Needed (all DIY with index cards):**  
  - **1 set per table (4 tables):**  
    - 12 blank index cards (for resources: 4x "Alliance", 4x "Militia", 4x "Grain").  
    - 1 "Scoresheet" index card (track points/resources).  
    - 2 dice (one for the table, one for you).  
  - **For you (instructor):**  
    - **Tempo Tracker:** 1 index card with eras pre-written: Rounds 1–3 = "Calm", Rounds 4–6 = "Torrent", Rounds 7–8 = "Calm".  
    - **Virtù/Fortuna Assignments:** 1 index card listing which half of each round is virtù (choice) or fortuna (die roll). Use a coin flip to pre-generate (e.g., "Round 1: A = virtù, B = fortuna").  
    - **Special Opportunity Cards:** 3 index cards with events (e.g., "Neighboring ruler dies! Seize land (act now, or lose it)").  
    - **Timer** (phone or physical).  
  - **Shared:** Whiteboard to track table scores publicly.  

  ---

  ### **Rules and Mechanics**  
  **Goal:** Accumulate "Stability Points" (SP) by making decisions. Highest SP wins. No money—points represent power and control.  

  #### **1. Round Structure (each round = 5 minutes)**  
  - Each round has two halves (**A** and **B**). Players choose **one action per half** from:  
    - **Aggressive (Impetuous):** High risk/reward. Gains SP if successful.  
      - *Calm era:* Gain 1 SP on success.  
      - *Torrent era:* Gain 3 SP on success.  
    - **Cautious (Provident):** Build resources for future. No immediate SP.  
      - *Calm era:* Gain 1 resource (if successful).  
      - *Torrent era:* Spend 1 resource to gain 2 SP (if successful). If no resources, action fails.  
  - **Secret Die Roll:** One half per round is **virtù** (auto-success if valid) and one is **fortuna** (success only on die 4–6). Players never know which is which.  

  #### **2. Tempo Mechanism (Hidden from Players)**  
  - **Eras change every 3 rounds:** Calm (rounds 1–3), Torrent (4–6), Calm (7–8).  
    - *Calm eras:* Reward **cautious actions**. Resources are easy to bank but hard to use.  
    - *Torrent eras:* Reward **aggressive actions**. Resources are critical for survival (like Machiavelli’s "dykes").  
  - **Tempo Penalty:** Tables using the same strategy (all aggressive/all cautious) in all eras lose 2 SP at era transitions (rounds 4 and 7). Forces adaptation.  

  #### **3. Special Opportunities (Expiring Windows)**  
  - Launch 3 times (e.g., rounds 2, 5, 7). Announce: *"A fleeting opportunity arises! You have 60 seconds to replace one half’s action with this special move."*  
  - **Special Action:** Aggressive, worth 5 SP if successful. If players debate >60 sec, it expires.  
  - *Machiavelli Tie-in:* Mimics "seizing windows of chance" (*The Prince*, Ch. 25).  

  #### **4. Resource System (Durable Works)**  
  - Resources (Alliance/Militia/Grain) are banked in **calm eras** via cautious actions.  
  - In **torrent eras**, resources are spent to survive aggressive actions or enable cautious ones.  
  - **Max 3 resources per table** (simulates limited capacity).  

  #### **5. Virtù Assessment (Post-Game Data)**  
  - After round 8, each table assigns a **virtù score (1–10)** to the other three, based *only* on observed decisions (e.g., "Table 2 took risks but seemed strategic").  
  - You then reveal all SP scores.  
  - Tables re-assign virtù scores *knowing outcomes*.  
  - **The gap between pre- and post-reveal scores = evidence of circular reasoning.**  

  ---

  ### **Payoff Scheme (No Money, Points-Based)**  
  | **Action**         | **Calm Era (Success)**       | **Torrent Era (Success)**    | **Failure (Any Era)** |  
  |--------------------|------------------------------|------------------------------|-----------------------|  
  | Aggressive         | +1 SP                        | +3 SP                        | 0 SP                  |  
  | Cautious (Build)   | +1 resource                  | —                            | 0 SP, 0 resources     |  
  | Cautious (Spend)   | —                            | +2 SP (spend 1 resource)     | 0 SP                  |  
  | Special Opportunity| +5 SP                        | +5 SP                        | 0 SP                  |  

  **Winning:** Highest SP. Ties broken by most resources.  

  ---

  ### **Timeline (75 Minutes Total)**  
  1. **Setup (5 min):**  
     - Distribute materials. Explain rules: *"You’re a new prince. Each round has two choices. Use aggressive/cautious actions to gain points/resources. Watch for sudden opportunities."*  
     - **Hide:** Tempo eras and virtù/fortuna assignments. Do NOT define "virtù" or "fortuna."  

  2. **Rounds 1–8 (40 min, 5 min/round):**  
     - **Per Round:**  
       - 0:00: Announce round. If opportunity, start 60-sec timer.  
       - 1:00: Opportunity expires (if unused). Tables choose actions for both halves.  
       - 3:00: Tables roll die (record secretly). Submit actions/die roll to you.  
       - 4:00: Resolve secretly (apply virtù/fortuna and tempo). Update SP/resources on whiteboard.  
       - 5:00: Announce outcomes (e.g., "Table 1: Half A +1 SP, Half B +0 SP"). *Do not explain why.*  

  3. **Virtù Assessment 1 (Pre-Reveal) (5 min):**  
     - *"Based on what you saw, assign virtù scores (1–10) to other tables. Virtù = skillful leadership."* Collect scores.  

  4. **Reveal Scores & Re-Assessment (10 min):**  
     - Post SP scores on whiteboard.  
     - *"Now assign virtù scores again, knowing outcomes."* Collect second set.  

  5. **Debrief (15 min):**  
     - Compare pre/post virtù scores. Highlight gaps: *"Did success inflate virtù? Why?"*  
     - Reveal hidden mechanics:  
       - **Tempo shifts:** *"How did adapting to eras mimic Machiavelli’s ‘matching fortune’s mood’?"*  
       - **Die rolls:** *"Fortuna was never ‘chance’—it was unarranged circumstances (e.g., a bad harvest). You couldn’t isolate luck from skill."*  
       - **Expiring windows:** *"Like Machiavelli’s ‘occasions,’ hesitation wasted opportunity."*  
       - **Resource banking:** *"Calm-era provisions saved you in torrents—but only if you built them early."*  
       - **Circularity:** *"When virtù is inferred from success, the explanation is empty. What *is* virtù independently?"*  

  ---

  ### **What Will Go Wrong (and How to Mitigate)**  
  1. **Bold tables dominate:** Aggressive players will win in torrent eras (by design), but tempo penalties punish inflexibility. **Use this:** In debrief, ask if "boldness" was virtù or luck.  
  2. **Fortuna misinterpreted:** Players will call the die "luck." **Correct this:** Emphasize in debrief that fortuna is *context* (e.g., "the river flooded because you ignored geography").  
  3. **Slow groups lose opportunities:** Timid tables will miss windows. **Use this:** Ask, "Did deliberation feel like virtù? Machiavelli says no."  
  4. **Tempo confusion:** Players won’t detect era shifts. **Intended:** They’ll blame "bad luck," revealing the circularity problem.  
  5. **Resource hoarding:** Tables may stockpile in calm eras but forget to spend in torrents. **Use this:** Show how this mirrors Machiavelli’s critique of unresponsive rulers.  

  ---

  ### **What the Game Can’t Capture (Require Your Commentary)**  
  - **Virtù’s depth:** Machiavelli’s virtù includes force, cunning, and flexibility. The game reduces it to binary choices. **Say:** *"Real virtù is nuanced—like knowing *when* to be cruel (Ch. 17)."*  
  - **Fortuna’s complexity:** The die simplifies fortuna as discrete events. **Say:** *"Real fortuna is systemic (e.g., unstable alliances), not a dice roll."*  
  - **Morality:** The game ignores Machiavelli’s amoralism. **Say:** *"Unlike this game, Machiavelli demands *immoral* virtù (Ch. 15)—but does that alter the circularity?"*  
  - **Historical context:** The game abstracts politics. **Say:** *"Machiavelli wrote for Medicis—your ‘SP’ is his survival."*  

  ---

  ### **Why This Works**  
  - The hidden die and tempo force players to *experience* the virtù/success blur.  
  - Post-game assessments generate quantifiable data on circular reasoning.  
  - Mechanics map to Machiavelli: tempo = fortune’s "mood," resources = "dykes," opportunities = "occasions."  
  - Playable in 75 mins with zero cost.  

  **Final Tip:** Start the game by quoting Machiavelli: *"Fortune is the arbiter of one-half of our actions"*—then let the chaos unfold. The debrief will write itself.
