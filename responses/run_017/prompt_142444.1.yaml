prompt: |-
  I chair the ethics advisory board of a research institute that runs behavioural-science field experiments at roughly forty sites across twenty-five countries. We clear about forty protocols a year, usually within forty-eight hours, with a two-person review team (one behavioural scientist, one regional programme lead) and my signature at the end. Most of the objections we get from local partners are moral rather than legal, and we handle them ad hoc: sometimes we localize a protocol, sometimes we insist on the home standard, sometimes we quietly drop a site, and we could not afterwards say why we did any of these.

  Please write the decision procedure my reviewers should run on every protocol, in the order they should run it. It has to be operationalized from the debate about cross-cultural variation in folk morality and what that variation does or does not show about moral objectivity. I have a two-page summary of that literature in front of me, so I do not need citations, studies, or reading recommendations; I need the reasoning made usable by reviewers with no philosophy training, no new data collection, and two days per protocol.

  Three things the procedure has to get right, and I suspect they are where the conceptual work is. First, it must sort each disagreement into more than difference of degree: separate cases where the parties agree on the principle and disagree about the nonmoral facts or about which description of the act is the salient one; cases where a shared set of considerations is simply weighted differently; and cases where one side treats something as a moral consideration the other does not recognize at all. Tell me which distinctions survive simplification and which my reviewers can safely collapse. Second, it must say who counts as a source of the local norm. Our local partners and in-country ethics reviewers are usually urban, university-trained and grant-funded, and I worry that the sampling problem our summary describes simply reappears one level down, so that deference to them can mistake a local elite's view for the local view. Third, it must include a reverse test: for any norm we are willing to relax abroad, the reviewer must record in advance what finding at another site would make us revise the home standard. If a norm cannot be given such a test, I want to know whether we are applying a principle or merely exporting one, and what the procedure should do then.

  Give me the stop rules: where it returns a no and drops the site, where it clears the protocol as localized, and where it stops and hands the decision to me because the remaining question is one of values rather than facts.

  Then run it on three protocols. One: a standard deception design in which participants are misled about how a sum of money was split, where the local partner says the debriefing will cause the participants lasting shame in a way the home site would not experience. Two: a consent procedure where the in-country reviewer asks that a household head's permission substitute for written individual consent, at two sites with quite different kinship structures. Three: payment for participation, which at one site is read as a wage and at another as a gift, with the two readings carrying opposite obligations. At least one of these should yield an answer I will not like, and I want you to say which and why. Close with an honest statement of what this procedure cannot do.
reasoning: |-
  We are designing a decision procedure for ethics review of cross-cultural behavioral science experiments. The procedure must be operationalized from the debate on cross-cultural variation in folk morality and moral objectivity. The goal is to guide reviewers (without philosophy training) in resolving moral disagreements with local partners, with a focus on distinguishing types of disagreements, identifying genuine local norms, and including a reverse test for any relaxed norm.

  Key distinctions from the literature (simplified for reviewers):
  1. **Disagreement due to nonmoral facts**: Both parties agree on the moral principle but disagree about the facts of the case (e.g., whether an action will cause harm).
  2. **Disagreement about the salient description**: The same act is described in different ways, making different moral features salient (e.g., "lying" vs. "protecting privacy").
  3. **Weighting differences**: Both recognize the same set of moral considerations but assign different weights (e.g., autonomy vs. community welfare).
  4. **Fundamental moral difference**: One party treats a consideration as morally relevant that the other does not recognize at all.

  We must collapse some distinctions for practicality. Reviewers can treat (1) and (2) together as "factual/semantic" disagreements because both can be resolved by gathering more information or clarifying the act. Distinction (3) is kept as "weighting differences" and (4) as "fundamental moral difference".

  For the source of local norms: We are concerned that local partners (urban, educated, grant-funded) might not represent the true local view. Therefore, we require that the local partner must provide evidence that their view is representative of the participants' community. This evidence can be:
  - Existing sociological or anthropological studies of the community.
  - Consultation with community leaders (if the community is hierarchical) or a diverse group of community members (if feasible without compromising the study).
  - If such evidence is not available, the reviewer must note that the local norm is asserted without evidence and treat it as an elite view, which may not be binding.

  Reverse test: For any norm we relax (i.e., allow a lower standard abroad than at home), we must specify in advance what finding (if observed in the study or in future research) would make us revise the home standard. If no such test can be specified, then we are merely exporting a principle without a basis for universal application, and the procedure will flag this as a values conflict to be elevated.

  Stop rules:
  - **Return "no" (drop the site)**: When there is a fundamental moral difference that cannot be resolved and the act is considered impermissible by the local norm (and we cannot justify overriding it) OR when the reverse test requirement is not met and the conflict is about a core value we cannot compromise.
  - **Clear as localized**: When the disagreement is due to nonmoral facts/semantics and the local partner's view is supported by evidence, OR when it's a weighting difference and the local weighting is acceptable under the reverse test.
  - **Hand to the chair (you)**: When there is a fundamental moral difference but we have reason to override the local norm (e.g., universal human rights concern) OR when the reverse test cannot be formulated and the norm is being relaxed, requiring a values decision.

  Procedure Steps (in order):

  1. **Identify the moral objection**: Clearly state the objection raised by the local partner and the home standard that is in conflict.

  2. **Classify the disagreement type**:
     a. **Factual/Semantic**: Does the disagreement stem from different beliefs about nonmoral facts (e.g., "this act will cause harm") or from different descriptions of the act (e.g., "is this deception or necessary omission")? If yes, move to step 3.
     b. **Weighting differences**: Do both sides agree on the relevant moral considerations but assign different weights? If yes, move to step 4.
     c. **Fundamental moral difference**: Does one side consider a factor morally relevant that the other does not? If yes, move to step 5.

  3. **Resolve factual/semantic disagreement**:
     - Ask the local partner to provide evidence for their factual claim (e.g., studies, anecdotes, expert opinion) or to clarify the act description.
     - If the evidence supports the local partner's view, then localize the protocol accordingly (e.g., change the act to avoid the negative consequence) and proceed. If the home team's view is supported, then insist on the home standard.
     - If evidence is inconclusive, consider a pilot test or drop the site if the risk is high. Otherwise, hand to the chair.

  4. **Resolve weighting differences**:
     - Determine if the local weighting is justified by local conditions (e.g., in a collectivist culture, community welfare might outweigh individual autonomy in a way that is contextually appropriate).
     - Apply the reverse test: Specify what finding would make us reconsider the home weighting. For example, if we allow reduced individual autonomy for greater community benefit, then a finding that this trade-off does not actually harm participants in the long run (or even benefits them) might lead us to reconsider the home standard.
     - If the reverse test is clear and the local weighting is supported by evidence (from step 6), then localize. Otherwise, hand to the chair.

  5. **Resolve fundamental moral difference**:
     - Determine if the local moral consideration is genuinely held by the participant community (using step 6). If not, then treat as a weighting or factual issue and go back.
     - If it is genuine, then consider: Is this consideration one that we can override? (e.g., if it violates a universal human right). If we cannot override, then drop the site.
     - If we might override, then hand to the chair.

  6. **Assess representativeness of local norm** (to be done whenever local norms are invoked):
     - Require the local partner to provide evidence that their moral view is shared by the participant community. Acceptable evidence:
          - Peer-reviewed studies of the community's moral views.
          - Consultation with a diverse set of community members (if done ethically and without coercion).
          - If the community is known to defer to leaders, then consultation with a representative set of leaders (but note the risk of elite bias).
     - If no evidence is provided, the reviewer should note that the local norm is unsubstantiated and treat it as an opinion of the partner. Then, reevaluate the disagreement: it might be a factual or weighting issue without a true local moral difference.

  7. **Reverse test requirement** (for any relaxation of a home norm):
     - When localizing, the reviewer must record: "If we observe [specific finding] at any site, we will reconsider our home standard." The finding must be measurable (e.g., "if we find that deception causes no long-term distress in cultures X, Y, Z").
     - If no such test can be formulated (e.g., because the norm is based on a principle that is not empirically revisable), then the norm is being applied without a universalizable justification. The reviewer must hand the case to the chair with a note that the norm is being exported without a reverse test.

  Now, run the procedure on the three protocols:

  **Protocol 1: Deception design with debriefing causing shame**
  - Objection: Debriefing will cause lasting shame (local) vs. home standard requires debriefing to mitigate deception.
  - Step 2: Classify. Is this a factual disagreement (will debriefing cause shame?) or a moral one? Likely factual: both agree that causing lasting harm (shame) is bad, but disagree on whether it happens. So, step 3.
  - Step 3: Ask local partner for evidence that debriefing causes lasting shame in this community. If they provide a study or credible examples, then we have a factual basis. Then, we must decide: can we avoid the shame? Maybe by modifying the debriefing (e.g., private, anonymous) or dropping deception? If not, drop the site. If we can modify, then localize. Also, reverse test: If we find that in cultures where we localized, participants did not experience shame and reported positive experiences, we might reconsider our home debriefing procedure to be more sensitive. If no evidence, then the objection is unsubstantiated and we insist on home standard.
  - If the local partner says the shame is because deception is inherently immoral and they don't recognize the moral permissibility of deception even with debriefing, then it's a fundamental moral difference (step 5). Then, step 6: Is this view representative? If yes, then we must consider: is deception in research a universal no? We might override for scientific necessity (hand to chair). Otherwise, drop the site.

  **Protocol 2: Consent - household head vs. individual**
  - Two sites with different kinship structures.
  - Home standard: individual written consent.
  - Objection: Household head's permission should suffice.
  - Step 2: Classify. This could be a weighting difference (both value autonomy and family authority, but local weights family more) or a fundamental difference (local doesn't recognize individual autonomy in this context). But note: the objection is about who can give consent, which might be a factual issue (if the household head's permission is seen as including the individual's best interest) or a moral one.
  - Step 3: Factual? If the local partner argues that in their culture, the household head's consent is how individual consent is expressed (i.e., a semantic difference in what "consent" means), then we can accept that as a localization. But we must also ensure that individuals are not coerced. If the household head's consent is a substitute without individual agreement, then it's a moral difference.
  - Step 6: Check representativeness. In both sites, we require evidence that the community accepts household consent as valid. For the site with a hierarchical kinship structure, evidence might be strong (e.g., studies show decisions are made by heads). For the other site (less hierarchical), evidence might show that individuals still expect to be consulted. If the evidence supports the local view, then:
     - If it's a weighting difference (step 4): We allow household consent but add a reverse test: if we find that in cultures using household consent, participants later report feeling coerced or regretful, we would reconsider allowing it at home (but note: home doesn't have household heads, so this test might be weak). Alternatively, the test might be: if we find that household consent leads to higher rates of regret or harm, we would stop using it abroad and at home if applicable.
     - If it's a fundamental difference (step 5): The local view does not recognize the individual as an autonomous agent. We might override because individual autonomy is a core ethical principle. Hand to chair. The chair might drop the site or allow with additional safeguards (e.g., asking the individual privately if they agree).
  - One site might clear as localized (if hierarchical and evidence supports) and the other might require hand to chair (if not hierarchical and evidence mixed).

  **Protocol 3: Payment as wage vs. gift**
  - At one site, payment is seen as a wage (creating obligation to work) and at another as a gift (creating obligation to reciprocate).
  - Home standard: payment is compensation for time, no obligation.
  - Objection: The different readings create different obligations that might affect behavior or cause distress.
  - Step 2: Classify. This is a semantic disagreement about the description of the payment. But it leads to different moral considerations: if it's a wage, then the participant might feel compelled to "work" (e.g., please the researcher) and if a gift, they might feel indebted. The home standard denies any obligation. So, it might be a factual disagreement about how payment is perceived (step 3) or a weighting difference (if both agree that creating undue obligation is bad, but they disagree on whether it happens) or a moral difference (if the local site thinks creating obligation is acceptable).
  - Step 3: Factual: We can test (or ask for evidence) whether payment is perceived as a wage or gift in the community. If the local partner provides evidence (e.g., cultural norms), then we can reframe the payment to avoid the obligation. For the wage site: call it a "token of thanks" (not a wage). For the gift site: provide payment in an envelope with "compensation for your time" (not a gift). Then, reverse test: If we find that reframing avoids the obligation, we might adopt this reframing at home. If we cannot reframe, then the payment might cause harm (obligation) and we must drop the payment or the site. If the local site says that creating obligation is acceptable (a moral difference), then step 5: We might not agree (because we want voluntary participation). Then step 6: Check if this view is representative. If yes, then we must decide: can we accept obligation? Probably not, because it undermines voluntariness. Drop the site.

  **Which answer you won't like?**
  In Protocol 2 (consent), for a site that is less hierarchical, we might have to drop the site or hand to you because the evidence does not support the local partner's claim that household consent is acceptable. The local partner (elite) might be imposing a view that is not shared by the participants. This is problematic because it might exclude a site without good reason, or force you to make a tough call.

  **What the procedure cannot do:**
  - It cannot eliminate all bias in identifying local norms; we rely on the local partner and available evidence.
  - It cannot resolve deep moral conflicts without judgment calls (which we hand to you).
  - It does not guarantee that the reverse test will ever be triggered or that it will be decisive.
  - It does not address power imbalances between the research institute and local partners, which might influence the objections raised.
  - It cannot replace ongoing ethical reflection; it is a snapshot decision tool.
answer: |-
  Below is a decision procedure for your ethics reviewers, designed to be operationalized from the debate on cross-cultural variation in folk morality and moral objectivity. The procedure is structured as a step-by-step checklist to be followed in order, with clear stop rules. It simplifies the philosophical distinctions into practical categories, addresses the "source of the local norm" problem, and includes the reverse test requirement. Reviewers can complete it within two days per protocol without new data collection or philosophy expertise, using only your two-page literature summary for context.

  ### Core Philosophical Simplifications
  - **Collapse these distinctions**:  
    - Disagreements due to **nonmoral facts** (e.g., "Will this action cause harm?") and **salient descriptions** (e.g., "Is this act 'deception' or 'protecting privacy'?") are combined into one category: **Factual/Semantic Disagreements**. Reason: Both are resolvable through evidence gathering or re-description, and reviewers can treat them identically by focusing on observable outcomes or alternative framings.
  - **Preserve these distinctions**:  
    - **Weighting Differences**: Parties agree on the moral considerations (e.g., "autonomy and community matter") but prioritize them differently (e.g., autonomy weighted higher at home, community higher locally).  
    - **Fundamental Moral Differences**: One party treats a consideration as morally relevant (e.g., "shame is inherently wrong"), while the other does not recognize it at all. Reason: Weighting differences allow for compromise via the reverse test; fundamental differences may require overriding or dropping the site.
  - **Moral objectivity takeaway**: Variation in folk morality does not imply relativism; it may reflect differences in facts, descriptions, or weightings. Fundamental differences are rare but must be flagged as potential "true" moral disagreements.

  ### Decision Procedure: Steps in Order
  **Reviewers must complete all steps for each objection. Document responses in a standardized template (e.g., a form with checkboxes and short answers).**

  1. **Clarify the Objection**  
     - State the local partner’s objection and the home standard in conflict.  
     - **Stop rule**: If the objection is purely legal (not moral), resolve it legally and skip to Step 7. If moral, proceed.

  2. **Classify the Disagreement Type**  
     - **Factual/Semantic**: Does the disagreement disappear if you change the description of the act (e.g., from "deception" to "temporary information withholding") or if you provide evidence about outcomes (e.g., "shame will/won't occur")?  
       - *If yes*, categorize as **Factual/Semantic** → Proceed to Step 3.  
     - **Weighting Difference**: Do both sides agree on the moral considerations (e.g., "autonomy and community matter") but emphasize them differently?  
       - *If yes*, categorize as **Weighting Difference** → Proceed to Step 4.  
     - **Fundamental Moral Difference**: Does one side invoke a moral consideration the other rejects as irrelevant (e.g., "family authority is sacred" vs. "it’s irrelevant to consent")?  
       - *If yes*, categorize as **Fundamental Moral Difference** → Proceed to Step 5.  
     - **Stop rule**: If reviewers cannot classify after 30 minutes of discussion, hand to the chair (you) with a note: "Unclassifiable disagreement; needs chair’s input on type."

  3. **Resolve Factual/Semantic Disagreements**  
     - Require the local partner to provide **evidence** for their claim (e.g., studies, local data, or expert input on outcomes like "shame" or "obligations"). Do not accept unsupported assertions.  
     - **Resolution**:  
       - If evidence supports the local view, **localize the protocol** (e.g., modify the act to avoid harm or re-describe it).  
       - If evidence supports the home view, **insist on the home standard**.  
       - If evidence is weak or conflicting, **propose a pilot test** (e.g., run a mini-survey with 5–10 community members).  
     - **Stop rule**: If no evidence is available after 4 hours of effort, **drop the site** (reason: "Unresolvable factual/semantic disagreement due to insufficient evidence"). If evidence is contested but substantial, hand to the chair.

  4. **Resolve Weighting Differences**  
     - **Apply the reverse test**: Specify what finding would prompt revising the home standard. For example:  
       - "If we observe [specific outcome, e.g., no long-term distress from localized consent] in 3+ sites, we will reconsider our home weighting of autonomy vs. community."  
       - The outcome must be **measurable** (e.g., survey data on participant well-being) and **actionable** (e.g., "revise home consent forms").  
     - **Resolution**:  
       - If the reverse test is clear and the local weighting is not harmful (e.g., doesn’t violate core rights), **localize the protocol**.  
       - If the reverse test cannot be defined, hand to the chair with a note: "No reverse test possible; may be exporting bias."  
     - **Stop rule**: If the local weighting risks severe harm (e.g., coercion), **drop the site** (reason: "Weighting difference poses unacceptable risk").

  5. **Resolve Fundamental Moral Differences**  
     - **Assess representativeness of the local norm** (critical for avoiding elite bias):  
       - The local partner must provide **evidence** that their view reflects the participant community (not just elites). Acceptable evidence:  
         - Peer-reviewed studies of the community’s moral norms.  
         - Data from consultations with 5+ non-elite community members (e.g., participants or local leaders outside the partner’s network).  
         - If the partner cannot provide this, the norm is **not validated** → Reclassify the disagreement as Factual/Semantic (Step 3) or Weighting (Step 4).  
     - **Resolution**:  
       - If the norm is **validated**:  
         - If the home standard can be relaxed without compromising universal rights (e.g., dignity), **localize** but require the reverse test (Step 4).  
         - If it cannot (e.g., violates informed consent), **drop the site** (reason: "Fundamental difference on core principle").  
       - If the norm is **not validated**, treat as elite bias and **reclassify** per Step 2.  
     - **Stop rule**: If the norm is validated but the reviewers question its moral validity (e.g., "Is this coercive?"), hand to the chair.

  6. **Reverse Test Requirement (For Any Localization)**  
     - If the protocol is localized (in Steps 3, 4, or 5), reviewers must:  
       - Define the reverse test in writing: "We will reconsider our home standard if [specific finding] occurs in [number] sites."  
       - Example: "If payment-as-gift causes no coercion in 5 sites, we will reassess home payment policies."  
     - **Stop rule**: If no reverse test can be defined (e.g., the norm is purely cultural with no testable outcome), **hand to the chair** with a note: "No reverse test; may be exporting bias."

  7. **Final Check**  
     - Ensure all steps are documented and the reverse test is recorded.  
     - **Clear the protocol** if localized or home standard is upheld.  
     - **Drop the site** if unresolved or high-risk.  
     - **Hand to the chair** if flagged in prior steps.

  ### Stop Rules Summary
  - **Drop the site**: Unresolvable factual/semantic disagreement (Step 3), severe risk from weighting difference (Step 4), or validated fundamental difference that violates core ethics (Step 5).  
  - **Clear as localized**: Resolved factual/semantic issue (Step 3), weighting difference with reverse test (Step 4), or fundamental difference with reverse test and no core violation (Step 5).  
  - **Hand to the chair**: Unclassifiable disagreement (Step 2), contested evidence (Step 3), no reverse test possible (Step 4 or 6), or validated fundamental difference needing values judgment (Step 5).

  ---

  ### Protocol Applications
  **Protocol 1: Deception causing shame**  
  - **Step 1**: Local partner objects that debriefing causes lasting shame; home standard requires debriefing.  
  - **Step 2**: **Factual/Semantic** (both agree deception is bad if it causes harm; disagreement is whether debriefing causes shame).  
  - **Step 3**: Local partner must provide evidence of shame (e.g., studies on shame in debriefing from their site). If they provide a study showing high shame rates, localize: shorten debriefing or use indirect methods (e.g., written vs. oral). **Reverse test**: "If reduced-debriefing sites show no long-term harm in 3+ studies, we will reconsider home debriefing standards." If no evidence, **drop the site**.  
  - **Outcome**: Likely **localized** if evidence supports shame risk. If not, dropped.  

  **Protocol 2: Household consent in two sites**  
  - **Step 1**: Local partner requests household-head consent instead of individual consent.  
  - **Step 2**: **Weighting Difference** (both value autonomy and family, but local weights family authority higher).  
  - **Step 6 (First)**: **Assess representativeness** before Step 4. For Site A (hierarchical kinship): Partner provides a study showing 90% of community accepts head-of-household decisions → **validated**. For Site B (less hierarchical): Partner provides no evidence; only cites "tradition" → **not validated** → Reclassify as Factual/Semantic (Step 3).  
  - **Resolution**:  
    - Site A: **Step 4** – Apply reverse test: "If household consent shows no coercion (via post-study surveys) in 5 sites, we will revisit home individual consent." **Localize** with added safeguards (e.g., private opt-out for participants).  
    - Site B: **Step 3** – Partner fails to provide evidence → **drop the site** (reason: "Unsubstantiated elite bias").  
  - **Outcome**: Site A localized; Site B dropped. **You will dislike this** because Site B is excluded due to lack of evidence, potentially losing a site over procedural rigor.  

  **Protocol 3: Payment as wage vs. gift**  
  - **Step 1**: At Site X, payment is seen as a wage (creating obligation to work); at Site Y, as a gift (creating obligation to reciprocate). Home standard: payment is neutral compensation.  
  - **Step 2**: **Factual/Semantic** (disagreement is about how payment is described/framed).  
  - **Step 3**: Require evidence of local perceptions (e.g., a study on payment norms). If Site X provides data showing payment is viewed as a wage, reframe payment as "appreciation for your time" (not a wage). If Site Y shows payment is a gift, reframe as "compensation with no strings attached." **Reverse test**: "If reframed payment shows no obligation issues in 4 sites, we will adopt this framing at home." If reframing fails, **drop the site**.  
  - **Outcome**: Likely **localized** with reframing.  

  ---

  ### What This Procedure Cannot Do  
  1. **Eliminate epistemic injustice**: It relies on local partners for evidence, which may exclude marginalized voices (e.g., if partners ignore non-elite views).  
  2. **Resolve deep moral conflicts**: When fundamental differences involve core rights (e.g., consent), it defaults to dropping the site or handing to you—it doesn’t "solve" objectivity debates.  
  3. **Guarantee reverse test utility**: A reverse test might never trigger action (e.g., if data isn’t collected), making it performative.  
  4. **Handle inter-site dependencies**: If one site’s localization affects others (e.g., payment norms contaminating data), it won’t flag this.  
  5. **Replace deliberation**: It streamlines decisions but cannot capture nuance; reviewers may misclassify disagreements without training.  

  **Final note**: The procedure prioritizes operationalizability and risk mitigation over philosophical perfection. By forcing explicit reverse tests and representativeness checks, it reduces arbitrariness and elite bias, but it will err on the side of caution (dropping sites) when evidence is lacking. Use the handed cases to build a "precedent bank" for future efficiency.
