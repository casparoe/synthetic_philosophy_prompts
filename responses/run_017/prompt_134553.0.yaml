prompt: |-
  I am writing a novel set some sixty years from now, and I have reached a chapter I cannot write honestly until I understand an argument better than I currently do. A tribunal has been convened to decide whether a newly contacted people — I call them the Sarsi — fall within a legal category of persons, and the chapter is a cross-examination in which each side reasons from a machine analogy. My difficulty is not with the plot. It is that I cannot tell which moves in the reasoning are load-bearing and which are rhetorical, and I would rather my characters be genuinely formidable than merely fluent.

  The details are these, and I would ask you to take them as stipulated rather than to check them against any real biology. The Sarsi are eusocial. An individual weighs perhaps ten kilograms and has a brain of roughly seventy grams, organized as densely packed nuclei rather than as a six-layered cortex, with neurons several times more densely packed than in a primate brain and conduction velocities perhaps a tenth of ours. No individual Sarsi does anything one would call reasoning; each is, however, plainly sentient, has preferences, learns, and can be harmed. Colonies number between twenty and forty members. They maintain a shared chemical record that persists across generations, they integrate what their members learn, and on the expedition's evidence they plan, correct themselves, and preserve techniques no single member could have produced. In a large colony the aggregate neural tissue is roughly twice the mass of a human brain.

  The two analogies my characters reach for pull in opposite directions.

  The expedition's neuroscientist argues from hardware and software. The mind, she says, is the programme; the brain is only the substrate on which it happens to run; programmes are substrate-independent; therefore the size, the cell count, the wiring, and even the species of the hardware are as morally irrelevant as the foundry that etched a chip. The only question is what is being computed. On her view a colony that computes the same things slowly and collectively is running the same programme as a human being, and the fact that it runs it a tenth as fast is a fact about the clock, not about the software.

  The advocate for the colonial office argues from engines. Cylinders, displacement, power. On his view the brain is a machine whose capacity scales with its size and its parts count, and a seventy-gram brain is a lawnmower engine beside a human one; whatever moral status tracks, it tracks something of which a bigger machine has more. He also argues that the colony's aggregate tissue belongs to nobody — there is no subject whose engine it is — and he concedes that brain size is a crude proxy but insists it is the only one we can measure without first settling whether the creature has a mind at all, which he says would beg the question.

  I would like an audit of both, in four parts.

  First, set the correspondences out explicitly; a table is welcome. For the hardware-software picture: what plays the programme, the machine, the input, the output, the user, and what would count as the same programme running on different hardware. For the engine picture: what plays the engine, the fuel, the load, the work done, and the owner. Then say what, among the Sarsi as I have described them, would occupy each slot, and note any slot for which the Sarsi supply no candidate at all.

  Second, separate the disanalogies that matter for the work these analogies are being asked to do from the ones that are merely decorative. The work is to settle whether any neural property of the Sarsi is morally relevant, and if so which. So: does the substrate-independence claim quietly assume a functionalist theory of mind, and would granting functionalism settle anything about moral status, or only about the identity conditions of mental states? Does the engine analogy smuggle in both that moral status is scalar and that the relevant magnitude is a rate or a throughput rather than a character of experience? Does either analogy have anything to say about whether the tempo difference matters, given that the colony may reach the same places a human reaches, only over a season instead of an afternoon?

  Third, tell me where each character's conclusion is actually resting. My suspicion is that neither machine analogy is doing the real work: that the neuroscientist's conclusion needs a functionalist theory of mind plus a separate claim about what matters morally, and the advocate's needs a theory about when parts compose a subject, and that the facts about brains are decoration in both. If that is right, I want to know what the brain facts are evidence for, such that size would be evidence of them — number of neurons in associative regions, degree of integration, richness and valence of experience, temporal depth of memory, something else — and whether there is any version of the question on which sheer size itself, and not merely what size indicates, could be morally relevant. If there is not, say so plainly; if there is, I would like to know what the size would have to be doing, causally, for it to matter in its own right.

  Fourth, propose a better analogy if one exists, and say what it would make visible that these two hide. I am especially interested in the eusocial complication: if the moral patient is the colony rather than the member, does either analogy still have a subject to attach to, and what would have to be true of the colony for the size of its distributed neural mass to be a morally relevant fact about it? And is there an argument that the individual Sarsi is where the moral fact lies regardless of what the colony does, given that each one is sentient and can be harmed?

  Two constraints. I am not asking for a bibliography, a reading list, or names to cite; the tribunal in my novel argues from reasons rather than authorities, and I need the reasons — where a question has a settled answer in the literature, tell me the answer and not who gave it. And please mark the places where you are extrapolating past anything actually studied, since a character who is honestly uncertain will serve my chapter better than one who is confident on no evidence.
reasoning: |-
  Hmm, the user is writing a sci-fi novel set 60 years in the future, and they're stuck on a philosophical tribunal scene about whether a eusocial species called the Sarsi qualify as "persons" under law. They've developed two opposing analogies (computer hardware/software vs. combustion engine) but want help dissecting which parts are substantive versus rhetorical. 

  The Sarsi biology is fascinating: individuals are sentient but not reasoning-capable, while colonies collectively exhibit intelligence through a shared chemical record. The core tension is between functional equivalence (do they "run the same program" as humans?) and physical scale (does brain size/mass matter?).

  First, I need to unpack both analogies systematically as requested. For the computer analogy: the "program" would be the colony's collective intelligence, "hardware" is the distributed neural tissue, "input/output" is sensory data/actions. The engine analogy maps "engine" to individual brains, "work" to cognitive outputs, but struggles with ownership since the colony has no central nervous system. 

  Key philosophical pressure points emerge:
  - The neuroscientist's position implicitly requires functionalism (mind defined by computation) plus a moral premise that functional equivalence implies equal status. But functionalism alone doesn't dictate ethics—it could equally support dismissing slow minds as inferior.
  - The advocate's engine analogy assumes cognition is scalar (bigger=better) and that moral status tracks processing power. But this conflates measurement proxies (size) with moral relevance. His "no owner" point is stronger—it targets whether colonies qualify as unified subjects.

  Where the arguments actually rest:
  - Neuroscientist: Needs (1) functionalism and (2) moral valuation of capabilities over implementation. Her brain facts are irrelevant if functionalism holds.
  - Advocate: Needs (1) mereological skepticism about colonies being true subjects and (2) moral weight tied to individual experience. His size argument is weak unless neural mass directly enables richer experience.

  On sheer size: It could matter biologically if density constraints force larger brains for complex cognition, but not morally. What matters is whether density compensates—and the Sarsi's high neural density might achieve human-equivalent complexity in small packages. The tempo difference is a red herring; slowness doesn't negate personhood (consider deliberative humans).

  Better analogy? The coral reef: individual polyps are alive but the reef is the functional entity, building complexity through layered structures. This highlights collective cognition without requiring human-like unity. For moral status, the question becomes: does the reef's emergent functionality create morally relevant interests beyond its constituents?

  On individual vs. colony: Since members are sentient, they're moral patients regardless of colony intelligence. But colony-level personhood depends on whether integrated intelligence generates distinct interests (e.g., in continued existence of knowledge systems). 

  Unresolved questions the user might exploit dramatically:
  - If we damage a colony's chemical record, is that harming the "reef-mind" or just destroying information?
  - Does halving a colony kill a person or just reduce capabilities?
  - Could a human-scale neural mass (say, 2kg colony) force different consideration than a 700g one?

  The characters should grapple with how much their analogies smuggle in assumptions. The advocate might attack functionalism by noting that substrate affects experience (e.g., slow minds might have richer qualia per computational step). The neuroscientist could counter that engine metrics are arbitrary—why prioritize speed over energy efficiency or resilience?

  This tribunal's real conflict might be about epistemic humility: in sixty years, will we have better tools to measure alien minds, or must we rely on proxies that risk injustice?
answer: |-
  Below is a systematic audit of the arguments, structured as requested. I'll mark **[Extrapolation]** where arguments extend beyond current evidence.

  ---

  ### **1. Correspondence Tables**

  #### **Hardware-Software Analogy (Neuroscientist)**
  | Concept          | Correspondence in Humans                     | Correspondence in Sarsi Colony              | Gap? |
  |------------------|---------------------------------------------|--------------------------------------------|------|
  | **Program**      | Cognitive processes (reasoning, memory)     | Colony-level planning, memory, correction  | No   |
  | **Hardware**     | Human brain (biological substrate)          | Aggregate neural tissue + chemical record  | No   |
  | **Input**        | Sensory data, experiences                   | Sensory data from members                  | No   |
  | **Output**       | Actions, decisions, creations               | Collective actions, techniques             | No   |
  | **User**         | The conscious self                          | *No clear candidate* (colony has no "self") | **Yes** |
  | **"Same Program"**| Identical cognitive outputs given inputs | Equivalent problem-solving outcomes       | —    |

  #### **Engine Analogy (Advocate)**
  | Concept        | Correspondence in Humans          | Correspondence in Sarsi                      | Gap? |
  |----------------|-----------------------------------|---------------------------------------------|------|
  | **Engine**     | Individual brain                 | Individual Sarsi brain (70g)                 | No   |
  | **Fuel**       | Metabolic energy                 | Metabolic energy                            | No   |
  | **Load**       | Cognitive tasks                  | Tasks performed by individuals              | **Partial** (ignores colony-level tasks) |
  | **Work Done**  | Cognitive output (decisions, etc.)| Individual actions/learning                 | **Yes** (ignores emergent colony output) |
  | **Owner**      | The person                       | Individual Sarsi (but colony has no owner)   | **Yes** (colony ownership undefined) |

  **Gaps Summary**:  
  - **Hardware-Software**: Missing a "user" (no unified colony self).  
  - **Engine**: Missing "work done" for the colony and an "owner" for collective cognition.  

  ---

  ### **2. Critical Disanalogies**  
  *Focus: Moral relevance of neural properties.*

  #### **Neuroscientist's Hardware-Software Model**  
  - **Load-Bearing Disanalogy**:  
    - Assumes **functionalism** (mind = abstract computation). Functional equivalence *could* imply moral equivalence *if* moral status depends solely on cognitive capabilities. But functionalism doesn't *necessitate* moral status—e.g., a functionally equivalent AI might still be denied rights.  
    - **Tempo Issue**: If moral status depends on *richness of experience* (e.g., depth of emotion, temporal continuity), slowness might matter. A human-scale computation over months may lack the "narrative unity" of human consciousness. **[Extrapolation]**  

  #### **Advocate's Engine Model**  
  - **Load-Bearing Disanalogies**:  
    - Assumes **moral status is scalar** and tied to processing power (size → capacity). But moral status could be threshold-based (e.g., "sentience" is binary).  
    - **Subject Gap**: Denies colony-level ownership. This is critical—if the colony isn't a "subject," its neural mass is irrelevant.  
    - **Proxy Problem**: Brain size as a proxy assumes bigger = more complex cognition. For Sarsi, high neural density *might* compensate for small size (70g Sarsi brain ≈ cognitive power of larger but less dense brain).  

  **Key Hidden Clash**:  
  - Neuroscientist: Moral status depends on *capabilities* (software).  
  - Advocate: Moral status depends on *intrinsic properties* (hardware) *and* requires a subject.  

  ---

  ### **3. Where Conclusions Actually Rest**  
  #### **Neuroscientist**  
  - **Real Foundation**: Functionalist theory of mind + **moral claim**: "What matters is capability, not implementation."  
  - **Role of Brain Facts**: Irrelevant to her argument. Size/speed are dismissed as hardware quirks.  
  - **Evidence Needed**: Proof that colonies perform human-equivalent cognition (planning, error-correction). Aggregate mass (2kg) is only evidence if density/connectivity are controlled for.  

  #### **Advocate**  
  - **Real Foundation**: **Mereological claim**: "Colonies aren't subjects" + **moral claim**: "Moral status requires a subject and scales with neural resources."  
  - **Role of Brain Facts**: Size is a proxy for **experiential richness** (e.g., more neurons → more nuanced emotions) or **cognitive depth** (e.g., memory, foresight). But this is indirect.  
  - **Scalability Challenge**: If sheer size *itself* morally matters, why? Only if:  
    - Size enables **emergent properties** (e.g., human-like self-awareness requires 1kg+ brains). *Unsupported for Sarsi.*  
    - Size correlates with **intensity/duration of experience**. **[Extrapolation]**  

  **Verdict**:  
  - **Brain facts are not decisive**. Size indicates *possible* cognitive complexity (if density is controlled), but doesn’t mandate moral weight.  
  - **Sheer size is morally irrelevant** unless it directly causes or constitutes conscious depth (e.g., a brain *must* be large to support unified identity). No evidence for this.  

  ---

  ### **4. A Better Analogy: The Coral Reef**  
  **Analogy**: A coral reef is a collective of polyps. Each polyp is alive, but the *reef* is the functional entity: it builds structures, adapts to environments, and persists for centuries. Polyps ≠ reef, yet the reef has ecosystem-level "behaviors."  

  **Why It Improves**:  
  - **Addresses Eusociality**: The reef (colony) is a morally relevant entity *due to its emergent functions* (e.g., habitat creation), distinct from polyps (members).  
  - **Moral Relevance of Size**: A large reef is more significant ecologically than a small one. Similarly, colony neural mass could matter if it enables richer colony-level cognition.  
  - **Tempo**: Reefs change slowly, yet their ecological impact is profound—pace ≠ significance.  
  - **Subjecthood**: The reef has no "self," but its *persistent structure* (like Sarsi chemical record) embodies collective intelligence.  

  **What It Reveals**:  
  - Colonies can be moral patients *without* a unified consciousness if they exhibit **goal-directed persistence** (e.g., maintaining knowledge across generations).  
  - **Individual vs. Colony**:  
    - *Individuals*: Sentient → deserve harm prevention (e.g., no unnecessary suffering).  
    - *Colony*: If it displays intelligence/agency, it may deserve rights (e.g., habitat protection, cultural preservation).  

  ---

  ### **Key Conclusions for Your Characters**  
  1. **Neuroscientist's Strength**: Functional equivalence *could* imply moral status if capability is what matters. Her flaw: ignoring whether slow, distributed cognition feels like anything *cohesive*.  
  2. **Advocate's Strength**: Highlights the subjecthood problem. His flaw: conflating size with capacity and ignoring compensatory mechanisms (density, networking).  
  3. **Unresolved**:  
     - Does the colony have **subjective experience**, or is it a "mindless optimizer"?  
     - Is **harm to a colony** more than the sum of harms to members? (e.g., destroying the chemical record).  
  4. **Dramatic Tension**: Let the tribunal expose that both analogies are *incomplete*. The reef analogy could be introduced by a third character, forcing both sides to confront emergence.  

  **[Extrapolation]** on Sarsi cognition is unavoidable, but this grounds speculation in real debates (functionalism, emergence, moral patienthood). Use the reef analogy to challenge both sides' assumptions about unity and tempo.
