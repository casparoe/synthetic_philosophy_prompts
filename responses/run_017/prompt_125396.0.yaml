prompt: |-
  I write a column on science and ideas, and I am midway through a piece on collective agency beyond the human case: automated benefits systems that deny claims, hospital triage pipelines, multi-agent software that divides a task among itself, large scientific collaborations whose papers carry thousands of names, trading desks where the models and the humans each do part of the work. Every philosophical account of joint action I have come across seems calibrated for dyads with a shared plan — two people painting a house, lifting a table, going for a walk together — and then goes quiet about the cases my reporting actually turns up. So I want the specification rather than another tour of the theories.

  Give me the desiderata: what an account of shared or joint action has to deliver, for my purposes, to count as adequate. The purpose is this — I want to be able to say, defensibly, when an organization, a crowd, a market, or a sociotechnical system acts, and when it merely produces an outcome that no one intended, and I want to know who is on the hook when it acts badly. Build the list around the cases, and give the consideration behind each requirement.

  Here are the cases from my own reporting that I want handled; tell me which of them generate distinct requirements and which I have misdescribed as hard.

  One: the rubber stamp. A clinician is legally required to sign off on a model's triage recommendations, a couple of hundred a shift, and forms no view about any individual case. If the hospital's decisions are joint actions, who is acting with whom?

  Two: the rotating collective. A volunteer moderation or maintenance group whose membership turns over almost completely within a month, none of whose members has met another, and no one of whom has any representation of the whole activity, yet which maintains a stable policy over years.

  Three: the reluctant participant. A junior soldier, or a low-level official, who executes her part of a policy she believes to be wrong. Does doing one's part under authority count as sharing the intention, and what does the account say about the difference between her and the enthusiast one desk over?

  Four: the constituted we. A crowd that becomes coordinated only once the police kettle it — a collective whose unity seems to be supplied by the treatment it receives from outside rather than by anything the participants intended or agreed to.

  Five: the swarm. Coordinating units — delivery drones, bidding algorithms — that interact by local rules with no representation of any joint goal. Is there a threshold at which this stops being a mere aggregate, and on what does the threshold depend?

  Six: the institutional first-person plural. A committee or court speaks in the we form and issues a conclusion while internally split. What has to be true for that we to be more than a stylistic convention, and who believes what when it is used?

  Mark each requirement as non-negotiable or as a preference of a particular camp — parsimony, reducibility to individual attitudes, refusal of group minds, the insistence that joint action requires communication or mutual responsiveness, the demand for a categorical rather than a scalar notion — and say why you classify it where you do. I would also like you to flag the pairs or clusters of requirements that cannot be jointly satisfied: my suspicion is that the pressure to cover the swarm and the rubber stamp (apparent agency with no shared representation anywhere in the system) pulls against the pressure to explain the normative binding between participants, and that a graded account and a categorical one cannot both be had. That part is what I most want to see, since if the list is internally unsatisfiable that is itself the finding.

  Finally, name the single requirement that does the most work in excluding candidate accounts, and tell me in one short closing paragraph which of the three broad families — reduction to individual attitudes plus common knowledge, an irreducibly collective we-mode, and views that put obligation or joint commitment first — is hit hardest by it. Keep that to a paragraph; the criteria are what I am paying for. A table is fine. No citations or reading list — I can find the literature myself. What I cannot work out from the outside is which of the things these theories are asked to do is a genuine constraint and which is a tribal preference dressed up as one.
reasoning: |-
  Alright, let me tackle this query. The user writes a science column and needs desiderata for collective agency beyond human dyads. They listed six cases: rubber stamp, rotating collective, reluctant participant, constituted we, swarm, and institutional first-person plural. The goal is to determine when a collective acts intentionally and who's accountable.

  First, I need to parse each case's unique challenge. The rubber stamp involves a human rubber-stamping AI decisions without personal judgment. The key here is minimal human input in a chain of agency. The rotating collective has high member turnover but stable policies—so continuity without persistent members. The reluctant participant questions whether compliance under authority equals shared intention. 

  The constituted we forms cohesion via external force (like police kettling), so agency might be imposed. The swarm operates on local rules without a shared goal, challenging traditional joint action models. The institutional "we" has members disagreeing but presenting a unified front. 

  Now, the user wants desiderata that handle these cases. They also want to know which requirements conflict. For example, handling the swarm (no shared mental states) vs. the normative binding in reluctant participants. A scalar approach might work for swarms but clash with the need for clear accountability in rubber stamp cases.

  I should list each requirement clearly. Start with non-negotiable like "No Shared Representation Necessary" for rubber stamps and swarms. "Continuity Without Persistent Agents" for rotating groups. "Distinguish Compliance from Endorsement" for reluctant participants. "Externally Constituted Agency" for kettled crowds. "Scalar Aggregation Threshold" for swarms. "Unified Output Despite Internal Disagreement" for institutions.

  Then, negotiable preferences like parsimony or reducibility. Conflicts arise between non-representational agency (swarm) and normative binding (reluctant participant). Also, scalar vs. categorical agency. The key tension is Requirement 1 (no shared representation) conflicting with Requirement 8 (normative binding). Reductionist theories struggle here, while we-mode or commitment-first might handle some but not all. The hardest hit is reductionist approaches because they can't account for non-mental collective agency. The user's insight about internal unsatisfiability is crucial—maybe that's the article's punchline.
answer: |-
  Here are the desiderata for an account of collective agency capable of handling your cases, built around non-negotiable requirements and negotiable preferences, with conflicts highlighted:

  **Core Desiderata (Non-Negotiable for Your Cases):**

  1.  **No Shared Representation Necessary:** The account *must not require* participants to share a mental representation (belief, intention, goal) of the *joint activity as a whole* or of others' roles. *(Essential for: **Rubber Stamp** (clinician lacks view of whole/relevance of others), **Swarm** (no global goal representation), **Rotating Collective** (no individual has whole-picture)).* **Non-Negotiable** – Your cases break standard "shared plan" models.

  2.  **Continuity Without Persistent Agents:** Must explain how agency persists despite near-complete turnover of individual participants over time, without relying on group minds or persistent group intentions. *(Essential for: **Rotating Collective**).* **Non-Negotiable** – A defining feature of many modern organizations/systems.

  3.  **Distinguish Compliance from Endorsement:** Must clearly differentiate between merely performing an assigned function under authority/constraint and actively sharing the intention/goal of the collective outcome. *(Essential for: **Reluctant Participant** vs. enthusiast).* **Non-Negotiable** – Central to normative assessment and assigning blame.

  4.  **Externally Constituted Agency:** Must allow that collective agency can be *imposed* or *constituted* by external forces or structures, not solely by internal agreements or intentions of participants. *(Essential for: **Constituted We** – kettled crowd).* **Non-Negotiable** – Reality of how groups often form/act under pressure.

  5.  **Scalar Aggregation Threshold:** Must provide a criterion (even if fuzzy) for when sufficiently complex, rule-governed interaction among components transitions from mere aggregate effect to genuine collective action. *(Essential for: **Swarm**).* **Non-Negotiable** – Needed to handle automated/algorithmic systems.

  6.  **Unified Output Despite Internal Disagreement:** Must explain how a single collective action (decision, statement) can emerge from a group with significant internal dissent or lack of consensus, without dissolving into individual actions. *(Essential for: **Institutional First-Person Plural**).* **Non-Negotiable** – Core to institutional reality.

  7.  **Minimal Individual Contribution Requirement:** Must specify the *minimum* necessary input/role an individual must have to be considered a participant in the collective action. *(Essential for: **Rubber Stamp** – is signing enough? **Reluctant Participant** – is coerced execution enough?).* **Non-Negotiable** – Foundational for identifying "who acted".

  **Normative/Explanatory Desiderata (Often Treated as Non-Negotiable, But Camp-Dependent):**

  8.  **Normative Binding & Accountability:** Should explain *why* and *how* participants can be held normatively responsible (morally, legally) for the collective outcome, even reluctant ones, and who bears primary responsibility. *(Crucial for: **Reluctant Participant**, **Rubber Stamp**, **Institutional We**).*
      *   *Negotiable Preference:* **Reductionists** demand this arises *only* from individual commitments/obligations. **Commitment-First/We-Mode** views often posit irreducible collective obligations. **Parsimony** seekers resist strong emergent norms.

  9.  **Attributability of Outcome:** Must clearly state whether the collective outcome is *merely* an unintended aggregate consequence or is *attributable to the collective/system as an agent*. *(Crucial for all cases, especially **Swarm** vs. aggregate, **Constituted We**).*
      *   *Negotiable Preference:* **Categorical** views demand a clear yes/no. **Scalar/Graded** views see degrees of attributability. **Reductionists** resist attributing agency beyond individuals.

  10. **Role of Structure/Procedure:** Should account for how institutional rules, algorithms, communication protocols, and physical constraints *enable and shape* collective agency, potentially even substituting for shared intentions. *(Important for: **Rubber Stamp**, **Swarm**, **Rotating Collective**, **Institutional We**).*
      *   *Negotiable Preference:* **Holistic/Socio-technical** views emphasize this heavily. **Strict Mentalist Reductionists** downplay it in favor of individual attitudes.

  **Key Conflicts Between Desiderata:**

  *   **Conflict 1: Non-Representational Agency vs. Normative Binding (Requirements 1 & 8):** How can participants be normatively bound to a collective action (*Reluctant Participant* accountability) if they lack any shared representation or commitment to the joint goal (*Rubber Stamp*, *Swarm*)? Reductionist accounts (individual attitudes) struggle mightily here. Commitment-First views might handle the binding but awkwardly apply to non-representational systems.
  *   **Conflict 2: Scalar Threshold vs. Categorical Agency (Requirements 5 & 9):** The graded nature of *Swarm* agency clashes with the desire for a clear-cut "did the collective act?" answer needed for robust attributability and accountability (*Institutional We*, *Rubber Stamp*). Is a drone swarm 56% agent? Parsimony often favors categorical, but your cases push towards scalar.
  *   **Conflict 3: Externally Constituted vs. Internally Driven (Requirement 4 vs. Core of We-Mode/Commitment):** How can a group be an agent if its agency is imposed from outside (*Constituted We*)? This fundamentally challenges views (like many We-Mode or Commitment-First) that root collective agency *primarily* in the participants' mutual recognition or joint commitment.

  **The Most Excluding Requirement:**

  **Requirement 1 (No Shared Representation Necessary)** does the most work in excluding candidate accounts. It immediately rules out the vast majority of philosophical theories of joint action, which are built precisely on shared intentions, mutual belief, or common knowledge among participants.

  **Impact on Broad Families (Closing Paragraph):**

  **Reduction to Individual Attitudes (+Common Knowledge)** is hit hardest by Requirement 1. It fundamentally relies on individuals holding specific, interlocking attitudes about the joint action and each other's roles/attitudes – precisely what *Rubber Stamp*, *Swarm*, and *Rotating Collective* lack. While potentially adaptable to *Institutional We* or *Reluctant Participant* within structured organizations, it fails utterly on non-representational cases and struggles significantly with Requirements 4 (Externally Constituted) and 5 (Scalar Threshold). Its parsimony becomes a liability against your cases.

  **Summary Table of Requirements & Conflicts:**

  | Requirement # | Desideratum                                       | Essential For Cases                   | Non-Negotiable? | Key Conflicts With             |
  | :------------ | :------------------------------------------------ | :------------------------------------ | :-------------- | :----------------------------- |
  | **1**         | No Shared Representation Necessary                | Rubber Stamp, Swarm, Rotating         | **Yes**         | **8 (Binding)**                |
  | **2**         | Continuity Without Persistent Agents              | Rotating Collective                   | **Yes**         | -                              |
  | **3**         | Distinguish Compliance from Endorsement           | Reluctant Participant                 | **Yes**         | -                              |
  | **4**         | Externally Constituted Agency                     | Constituted We                        | **Yes**         | We-Mode/Commitment core        |
  | **5**         | Scalar Aggregation Threshold                      | Swarm                                 | **Yes**         | **9 (Categorical Agency)**     |
  | **6**         | Unified Output Despite Internal Disagreement      | Institutional We                      | **Yes**         | -                              |
  | **7**         | Minimal Individual Contribution                   | Rubber Stamp, Reluctant Participant   | **Yes**         | -                              |
  | **8**         | Normative Binding & Accountability                | Reluctant Part., Rubber Stamp, Inst. | Preference      | **1 (No Representation)**      |
  | **9**         | Attributability of Outcome (Categorical?)         | All, esp. Swarm vs. Aggregate         | Preference      | **5 (Scalar Threshold)**       |
  | **10**        | Role of Structure/Procedure                       | Rubber Stamp, Swarm, Rotating, Inst.  | Preference      | Strict Mentalist Reduction     |
