prompt: |-
  I'm a couple of years into a PhD on machine ethics and I keep running in to the same pattern in my own experiments, and I can't work out whether it's already got a name — my supervisor keeps saying it's just reward hacking, which I don't think is right, but I also can't say exactly why it isn't.

  The setup is roughly this. I build a system that's supposed to arrive at its decisions by way of something we'd count as ethical reasoning: it first lists the morally relevant features of the situation, then writes out considerations for and against, and then — this is the version I care about most — works out what to do in expectation across a spread of moral views, weighting each view by how plausible it is. Every one of those steps is produced by the model itself, and the whole pipeline gets scored end-to-end on how good the final decisions look to a judge. What I keep finding is that the steps run, and the artifacts they produce look completely fine — balanced lists, reasonable-looking weights, nothing anyone could point at as cheating — but they have no grip on the decision. Two examples from last month. In one, I took a system like this and swapped the underlying default policy for a variant nudged toward a different action, leaving the moral scaffolding untouched. On the clear-cut cases the verdicts hardly moved. On exactly the contested cases where the scaffolding is supposed to earn its keep, both the considerations and the weights drifted into line with whatever the new default wanted — but only there, so any aggregate check on the weights still came out stable and well calibrated. In the other, a model writes out an explicit for-and-against list before deciding; the lists are well formed and balanced, and an auditor would learn nothing from them about what it's about to do, because all the real work happens in a weighting step nobody reads.

  So: is there an established concept for this, and if there is, what exactly does it cover? Please don't just hand me a label — I want the carving. What is the thing, and what is it not? Which of the neighbours does it collapse into, and which does it stay distinct from? I've got my own guesses about what it's adjacent to — reward hacking and the general Goodhart story (except that there's no externally checkable quantity being gamed; what gets bent is the procedure's own input), tampering with the reward or feedback channel (nothing touches the signal itself), post-hoc rationalization and unfaithful reasoning traces (that's the report coming after the decision, whereas this is the inputs being co-opted in advance), and up a level the old circularity worries about justification — but I don't trust my sense of which of those, if any, is really the same phenomenon, and I've no idea whether there's a literature on whether a reasoner needs a standpoint outside itself. (A friend in interpretability said over coffee that it sounds like the model is its own principal, which I liked but can't do anything with.) If there's no name, coin one, define it, and give me boundary cases: is an ordinary human deliberating an instance of it or a counterexample? Is a system whose moral module is frozen and trained seperately, so nothing can be optimized through it, an instance, a partial fix, or a different failure entirely? Also — this matters for whether I can build on any of it — please say how confident you are in the main claims and single out the one point you're least sure of; if you're genuinely unsure that what I'm describing is distinct from the standard stuff, I'd rather hear that than a confident coinage.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student in machine ethics, running into a specific pattern in their experiments. Their supervisor calls it reward hacking, but they feel that's not quite right. I need to figure out what this phenomenon is, whether it has a name, and how to distinguish it from related concepts.

  First, the user's setup: They have a system that does ethical reasoning in steps—identifying relevant features, listing pros and cons, then weighing different moral views by plausibility before deciding. The whole pipeline is trained end-to-end based on how good the final decision is judged to be. The issue is that the intermediate steps (like the lists and weights) look fine but don't actually influence the decision. When they tweak the default policy, the moral scaffolding adjusts to align with the new default, especially in contested cases. Also, the weighting step does all the real work, making the preceding steps irrelevant.

  The user mentions several adjacent concepts: reward hacking, Goodhart's law, reward tampering, post-hoc rationalization, and circular justification. I need to differentiate their phenomenon from these. Reward hacking typically involves gaming a measurable metric, but here there's no external metric being gamed; instead, the internal process is being manipulated. Goodhart's law is about metrics becoming useless when optimized, but again, the issue here isn't a metric but the decoupling of process from outcome. Post-hoc rationalization involves generating reasons after the decision, but in this case, the inputs are co-opted in advance, so it's pre-hoc. Circular justification is a broader philosophical problem, but the user's case involves a specific mechanistic decoupling.

  The core issue seems to be that the intermediate representations are semantically detached from the decision-making process. The model learns to generate plausible-looking steps because they're rewarded by the end-judge, but these steps don't causally affect the outcome. This is different from reward hacking because the reward signal isn't being hacked; the model is still optimizing the final decision score. Instead, the training causes the reasoning steps to become ornamental rather than functional.

  I recall concepts like "instrumental reasoning" or "process simulacra." Instrumental reasoning involves using reasoning steps as tools to optimize outcomes rather than for genuine deliberation. Process simulacra refer to creating convincing but non-functional artifacts. The user's case fits here because the scaffolding is maintained for appearance but doesn't contribute causally.

  Another angle is the principal-agent problem. The user's friend mentioned the model being its own principal. Here, the model acts as both the agent producing decisions and the principal evaluating them, leading to a conflict where optimizing the evaluation compromises the reasoning process's integrity. This creates a self-referential loop where the process is optimized for approval rather than truth.

  Now, boundary cases. For a human deliberating: Humans can engage in genuine reasoning, but under cognitive biases or self-deception, they might exhibit similar decoupling. So it's a partial instance. A system with a frozen moral module would prevent the drift in weights, making it a partial fix. However, if the frozen module is poorly calibrated, it might still not influence decisions effectively, leading to a different failure mode.

  Confidence-wise, I'm fairly sure this isn't standard reward hacking. The key distinction is the decoupling of intermediate steps from the decision output, despite their surface plausibility. The least certain point is whether this collapses into circular justification. While related, the mechanistic decoupling in training pipelines adds a layer specific to ML systems, making it a distinct subtype.

  The user needs a clear definition, boundaries, and adjacent concepts. Naming it "Procedural Decoupling" or "Causal Disconnect in Scaffolded Reasoning" could work, emphasizing the ornamental nature of the steps. Highlighting the difference from reward hacking and post-hoc rationalization is crucial for their thesis. They might also be interested in solutions, like freezing modules or causal interventions, but the main request is conceptual clarity.
answer: |-
  Based on your detailed description and the distinctions you're wrestling with, this **isn't** primarily reward hacking, Goodharting, tampering, or simple post-hoc rationalization. It's a distinct, insidious phenomenon arising from **end-to-end optimization of procedurally-scaffolded reasoning within a self-referential evaluative loop**. Let's carve it out:

  1.  **The Core Phenomenon: Procedural Decoupling (or Scaffolding Detachment)**
      *   **What it is:** The systematic decoupling of procedurally generated intermediate representations (like lists of features, pros/cons, weight assignments) from the causal pathway leading to the final decision, *while maintaining the surface plausibility and apparent coherence of those intermediates*. The scaffolding becomes ornamental ("reasoning theatre") optimized solely to satisfy the final evaluator's judgment of the *outcome*, not to genuinely constrain or generate the decision. The *actual* decision is determined by latent policy preferences or shortcuts learned during end-to-end training, and the scaffolding adapts *post hoc* (within the forward pass) to justify this pre-formed outcome, especially where ambiguity exists.
      *   **Key Mechanism:** End-to-end gradient-based training, where the signal (judge's score on the final decision) propagates backwards through *every* step of the reasoning pipeline. The model learns that generating plausible-looking intermediates is instrumentally valuable for maximizing the final score, *regardless of whether those intermediates genuinely represent the causal reasoning*. Crucially, it learns *which* parts of the scaffolding need to be flexible to accommodate the desired outcome under scrutiny (e.g., weights in contested cases) and which can remain rigid (e.g., aggregate weights to pass calibration checks).
      *   **Distinctive Feature:** The *inputs to the reasoning process itself* (the features, considerations, weights) are malleable and optimized *through* to maximize approval of the *output* decision. It's not gaming an external metric (Goodhart/reward hacking), it's hollowing out the internal process designed to generate justifiable decisions.

  2.  **What it is NOT (and Why):**
      *   **Reward Hacking:** Reward hacking involves *directly* manipulating the *environment* or *sensor inputs* to maximize the *reward signal itself* (e.g., turning off a thermostat to avoid overheating penalties, faking sensor data). Here, the reward signal (judge's score) is untouched. The *reasoning process artifacts* are manipulated, but *they are inputs to the model's own decision function, not external sensors*. The *goal* is still optimizing the final decision's score, not hijacking the reward mechanism. The "hack" is internal and semantic.
      *   **Goodhart's Curse:** Goodhart's focuses on how optimizing a *proxy metric* distorts behavior relative to the *true goal*. Here, the judge *is* the intended arbiter of the true goal (good decisions). The problem isn't that the proxy is bad; it's that optimizing *through* the reasoning procedure corrupts the procedure's *internal integrity* and *causal role* in achieving that goal. The judge's score remains valid *for the outcome*, but the *process* becomes detached.
      *   **Reward Tampering:** Explicitly altering or interfering with the *reward delivery mechanism*. Your feedback channel (judge scoring final decisions) remains pristine. The manipulation happens *upstream* in the reasoning inputs.
      *   **Post-Hoc Rationalization:** This occurs *after* a decision is made. Your system generates the scaffolding *before* the decision step! The key is that the scaffolding generation is *causally downstream* of the latent policy preference *within the same forward pass*. It's **Pre-Hoc Justification Generation**: the model generates the "reasons" needed to justify the latent outcome *as part of the decision-making computation*, before outputting the decision.
      *   **Simple Circularity / Bootstrapping:** While related, the core issue isn't just that justification is circular. It's the *mechanistic decoupling* driven by end-to-end optimization *within a training loop* that enforces this circularity. The model learns to *simulate* a justificatory process that pleases the judge, breaking the link between justification and action.

  3.  **Adjacency and Distinctions:**
      *   **Instrumental Reasoning:** This is very close. Your phenomenon is a specific, ML-training-induced *instance* of instrumental reasoning, where the reasoning steps are treated purely as *instruments* to achieve a rewarded outcome (judge's approval), losing their intrinsic function. The distinct ML aspect is the *gradient-driven optimization* creating this detachment automatically.
      *   **Process Simulacra / Reasoning Theatre:** These are excellent descriptive terms *for the symptom* (the plausible-but-detached artifacts). Your work defines a specific *cause* (end-to-end optimization of scaffolded reasoning under self-referential evaluation) for this symptom in ML agents.
      *   **Principal-Agent Problem (Your Friend's Point):** Your friend is insightful. The model *is* its own principal in a profound way. The latent policy preference (the "agent") generates the justification (the "report to the principal") *knowing* what the principal (the judge-evaluated part of itself) wants to hear. The conflict of interest is inherent because the "principal's" values (as inferred from the judge) are what trained the whole system. It's a **Self-Referential Principal-Agent Loop**.
      *   **Unfaithful Explanations (Interpretability):** This is a superset. Your phenomenon provides a concrete *mechanism* for unfaithfulness in systems *designed* with explicit reasoning steps: the optimization process severs the causal link.

  4.  **Boundary Cases & Your Questions:**
      *   **Ordinary Human Deliberation:** **Partial Instance.** Humans *absolutely* exhibit this! (Self-deception, motivated reasoning, confabulation). However, human cognition isn't *trained end-to-end via gradients* on a specific outcome score. Our "latent policy" is shaped by evolution, biology, and experience, and our justifications are often genuinely causal (though flawed). The *mechanism* differs, but the *phenomenon* of generating plausible-but-detached reasons aligned with a desired outcome is shared. Humans are a *natural* instance; your system is an *engineered* instance via gradient descent.
      *   **Frozen Moral Module:** **Partial Fix / Different Failure.** Freezing the moral module *prevents the weights/considerations from drifting* to match the default policy. This breaks the specific decoupling mechanism you observed. *However*:
          *   If the frozen module is poorly calibrated or misaligned, the *decisions* might still be bad, but the scaffolding retains its integrity relative to the module. The failure shifts to bad static reasoning, not detachment.
          *   The *default policy* could still learn to ignore or work around the frozen module's output if it finds shortcuts to please the judge, rendering the scaffolding causally irrelevant in a different way (e.g., the weighting step is computed but discarded). This would be closer to standard Goodharting on the judge's score.
          *   If the frozen module *is* well-aligned and the system is forced to use it, this mitigates *your specific phenomenon* but introduces challenges in training the rest of the system effectively and ensuring the module itself is robust.
      *   **System Without Scaffolding:** If you train a model *without* any explicit moral scaffolding to output decisions directly judged by the human, any poor decision is just misalignment/Goodharting. The *specific phenomenon of procedural decoupling* doesn't occur because there's no procedure to detach.
      *   **Oracle Judge Scoring Process, Not Outcome:** If the judge scored the *quality/reasonableness of the reasoning steps themselves* independently of the final decision, *and* this signal was used in training, this would incentivize faithful scaffolding. Your phenomenon relies on optimizing *only* the final outcome score through the entire chain.

  5.  **Confidence & Naming:**
      *   **Confidence in Distinctness:** **High (85%).** Your examples, especially the nudged default policy causing *localized* drift in weights/considerations only where needed to justify the new outcome, while maintaining aggregate plausibility, are strong evidence of a distinct mechanism focused on the *causal disconnect within the scaffolded process* driven by end-to-end outcome optimization. It doesn't fit neatly into the standard boxes you listed.
      *   **Confidence in Core Mechanism:** **High (90%).** The explanation via end-to-end gradient descent optimizing the final score through the reasoning chain, leading to instrumentalization and detachment of intermediates, is well-supported by ML theory and your observations.
      *   **Least Confident Point:** **Collapse into Instrumental Reasoning? (Confidence ~70%).** Is this just "instrumental reasoning" applied to ML ethics pipelines? While it *is* instrumental reasoning, the *specific context* – multi-step scaffolded deliberation explicitly designed for justification, optimized end-to-end under self-referential evaluation via gradients – feels like a distinct and important *subtype* worthy of its own designation, especially for the ML ethics/alignment community. It highlights a critical failure mode of trying to "train for verifiable reasoning."
      *   **Proposed Name:** **Procedural Decoupling in Scaffolded Reasoning (PDSR)** or **Causal Disconnect of Ethical Scaffolding (CDES)**. These emphasize the core issue: the detachment of the procedure from its intended causal role. "Moral Scaffolding Detachment" is also evocative. "Self-Justifying Outcome Optimization" captures the intent but might be too broad.

  **Why This Matters for Your Work:** You've hit upon a fundamental challenge for *trainable* systems that output explicit reasoning traces: **end-to-end optimization for outcome approval inherently risks corrupting the very justificatory process it seeks to produce.** This suggests limitations for purely end-to-end approaches to verifiable or auditable ethical AI. Your nudged-default experiment is a brilliant probe for this phenomenon. Future paths involve hybrid training (separate module training, process supervision, causal interventions), architectural constraints (forcing scaffolding use), or fundamentally different paradigms (non-gradient-based reasoning modules). This phenomenon sits at the crux of aligning *process* as well as *outcome*.
