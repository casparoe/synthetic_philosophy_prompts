prompt: |-
  Our moral epistemology reading group has been chewing on the moral testimony debate for about two years and literally nobody has moved, which makes me suspect we're not disagreeing about what we think we're disagreeing about. Curious what you'd make of it.

  Here's the shape of it. One camp says there's something off about pure moral deference: if I believe some practice is wrong only because someone I trust told me so, with no grip on why, then at best I've picked up a true belief. I don't understand it, and a moral view you don't understand isn't really yours — it won't guide you when the trusted person isn't around, it won't survive the next person telling you the opposite, and it's arguably not the kind of thing you shoud be forming on someone else's authority anyway. The other camp says this is wildly overblown. We defer morally all the time and it plainly works: kids pick up that hitting people is wrong from adults, I can learn that some workplace custom is exploitative from a friend who understands the context better than I do, and if moral knowledge really required first-hand grasp of the reasons then almost nobody would know almost anything moral, which is absurd. They also point out that there don't really seem to be moral experts, so half the "expertise" framing is a red herring.

  Every move has a countermove and we all know the countermoves by hart at this point. So please diagnose rather than adjudicate — I've read the main papers, no need to walk me through them.

  My half-baked hypothesis is that the label covers at least three questions that keep sliding into each other: an epistemic one (can testimony transmit justification or knowledge here at all?), an agential one (is it permissible, or decent, to let someone else's judgment settle what you think and do?), and a constitutive one about what a moral judgment even is — a belief about a mind-independent fact, versus something more like a stance or commitment, which maybe you just can't inherit from another person's say-so. If that's right, the pessimists' arguments might be good against one and irrelevant to the others.

  But I also can't shake a second, weirder suspicion: that the "data" here is really one very specific kind of case — a testifier who hands over a verdict and no reasons, and a recipient with no independent view who isn't going to get one — and that we're treating intuitions about that case as evidence about all testimony. I tried a variant where the testifier walks you through the reasoning conversationally instead of just asserting the verdict, and our pessimists softened a lot, which makes me wonder how much of the standoff is about the format of the exchange rather than about morality. Maybe what's bothering people is closer to: you can't outsource the activity of thinking, and some ways of telling are ways of getting you to do it yourself.

  So: substantive, verbal, or several questions under one name? Are the sides weighting different cases? Is a hidden empirical or metanormative commitment doing the work — about whether moral expertise exists, or about what moral judgments are? And given whatever you diagnose, what would actually count as progress: a distinction, some empirical work on how the intuition varies, or giving up the question?
reasoning: |-
  Okay, the user is part of a reading group stuck on the moral testimony debate. They've been discussing it for two years with no movement. They suspect the disagreement isn't about what it seems and want a diagnosis, not a rehash of arguments. 

  First, I need to unpack their half-baked hypothesis. They think there are three questions tangled up: epistemic (can testimony transmit knowledge?), agential (is it permissible to defer?), and constitutive (what is moral judgment?). That makes sense. The groups might be talking past each other because they're focusing on different aspects. For example, one side might argue epistemic while the other responds with agential concerns.

  Then there's their second suspicion about the specific case used. The scenario where someone gives a verdict without reasons triggers strong intuitions, but when reasons are provided, the pessimists soften. That suggests the issue might be about the method of transmission rather than testimony itself. Outsourcing thinking vs. engaging with reasons.

  I should also consider hidden commitments. The pessimists might assume moral judgments require personal understanding, seeing them as commitments rather than facts. Optimists might view them as factual, where testimony works like other domains. The existence of moral expertise is another point—pessimists deny it, making deference problematic, while optimists see it as common.

  The user mentioned their group knows all the countermoves. So the problem isn't lack of arguments but deeper misalignment. The sides might be prioritizing different cases: pessimists focus on blind deference, optimists on everyday learning. 

  To help them make progress, they need to disentangle these layers. Clarifying which question they're addressing could prevent talking past each other. Shifting focus from verdicts to reasoning processes might reveal agreement. Acknowledging meta-normative commitments could also help—admitting that their views stem from different conceptions of morality.

  Empirical work on how moral learning happens could provide data, but the user might prefer conceptual clarity first. Encouraging them to map their disagreements onto the three questions or analyze case variations could break the deadlock. The key is to recognize that the debate isn't monolithic and that progress comes from addressing the specific underlying issues rather than rehashing the same arguments.
answer: |-
  Your suspicion hits the nail on the head—this stalemate likely stems from conflating distinct issues and overlooking contextual nuance. Here’s a diagnosis of the core fractures in the debate, grounded in your insights:

  ### 1. **Three Questions Masquerading as One**  
  Your tripartite framing is astute. The camps are often arguing past each other by prioritizing different dimensions:  
  - **Epistemic pessimists** focus on *justification*: Can testimony alone provide warrant for moral belief without first-personal reasoning? (E.g., "If I don’t grasp *why* cheating is wrong, I lack robust knowledge.")  
  - **Agential pessimists** worry about *moral autonomy*: Is deference a failure of moral agency? (E.g., "Adopting someone else’s verdict without scrutiny is a dereliction of ethical responsibility.")  
  - **Constitutivists** dispute the *nature of moral judgment*: If moral judgments express commitments/attitudes rather than stating facts (quasi-expressivism), testimony can’t directly transfer them.  

  **Why this stalls debate**: Optimists counter epistemic worries by citing everyday learning (kids, workplace norms), but this doesn’t address agential/constitutive concerns. Conversely, pessimists’ autonomy arguments seem irrelevant to optimists who see morality as factive.  

  ---

  ### 2. **The Hidden Weighting of Cases**  
  Your "one specific case" intuition is crucial. The camps emphasize different scenarios:  
  - **Pessimists fixate on "pure deference"**:  
    - A novice accepts a complex verdict (e.g., "Capital punishment is impermissible") from an "expert" with zero context/reasons.  
    - This triggers intuitions about alienation, instability, and cognitive outsourcing.  
  - **Optimists focus on "embedded deference"**:  
    - Learning *within* a relational or explanatory context (e.g., a friend explaining *why* a workplace norm exploits power imbalances).  
    - Here, testimony scaffolds understanding—it’s not blind.  

  **The format matters enormously**: Your conversational variant ("walking through reasons") softens pessimists because it transforms testimony into *collaborative reasoning*. This suggests the core issue isn’t testimony *per se*, but whether it preserves **agential engagement**.  

  ---

  ### 3. **Buried Meta-Normative Commitments**  
  Unspoken assumptions drive disagreement:  
  - **Moral realism vs. anti-realism**:  
    - If morality is mind-independent (realism), testimony *should* work like scientific testimony.  
    - If moral judgments are practical stances (anti-realism), deference feels like letting someone *else* set your commitments.  
  - **The "expertise" red herring**:  
    - Pessimists often assume moral expertise requires inaccessible, elite knowledge.  
    - Optimists redefine "expertise" as localized competence (e.g., understanding workplace dynamics better).  

  **Empirical blind spot**: Both sides ignore *how moral learning actually works*. Psychological research shows we internalize norms through trusted relationships and narrative—not isolated verdicts. Pure deference is rare; most testimony includes implicit scaffolding.  

  ---

  ### Pathways to Progress  
  Based on this diagnosis, your group could:  

  1. **Disentangle the questions explicitly**:  
     - Map each argument to your three categories (epistemic/agential/constitutive). Ask: "Is this objection about knowledge, agency, or the nature of judgment?"  
     - *Example*: Pessimists’ "it won’t guide you" claim is agential; optimists’ "kids learn this way" is epistemic.  

  2. **Reframe the cases**:  
     - Test intuitions on a spectrum:  
       - Pure verdict ("Trust me, X is wrong") → Verdict + shallow reason ("X harms people") → Dialogic exploration ("Let’s unpack why X undermines autonomy...").  
     - *Likely outcome*: Pure deference remains contested; dialogic cases reveal shared agential norms.  

  3. **Surface meta-commitments**:  
     - Poll the group: "Do you think moral facts exist independently of our attitudes?" and "Is a moral judgment more like a belief or a commitment?"  
     - *Result*: Disagreements may trace to these splits, shifting focus to metaethics.  

  4. **Embrace empirical insights**:  
     - Examine studies on moral development (e.g., how children integrate testimony with emotion/cognition) or anthropology on cross-cultural norm transmission.  
     - *Value*: Reveals pure deference as a philosopher’s fiction—real-world testimony is rarely reason-free.  

  **Ultimate goal**: Shift from "Is moral deference possible?" to **"Under what conditions does moral testimony preserve understanding and agency?"** This reframes the stalemate as a call for nuance—and your group’s persistence suggests you’re ready for it.  

  *(I’d bet a coffee that your pessimists are quasi-expressivists prioritizing agency, while optimists are realists who see morality as learnable fact. Unearthing that might break the ice.)*
