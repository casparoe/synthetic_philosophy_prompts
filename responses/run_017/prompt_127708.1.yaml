  ## Thought Experiment: The Curator's Choice

  **Scenario:** Dr Elara Arden, Senior Curator of Modern Art at the City Museum, has dedicated 20 years to researching and championing the obscure, challenging work of late modernist painter Silas Vance. This project defines her professional identity; Vance's complex, demanding aesthetic resonates deeply with her, shaping her perspective on art history and curation. It is her life's work, non-relational and morally optional. The museum director issues a modest but directive impartial demand: to significantly reduce the permanent Vance exhibition space to make room for a rotating display of more accessible, popular contemporary art. The explicit goal is to marginally increase visitor diversity and engagement (a genuine, modest impartial good). Impartial consequentialism requires Arden to sacrifice her ground project because the marginal gain in visitor satisfaction and access, aggregated across many, outweighs the intense personal cost to her, treating her Vance commitment as one satisfier among others.

  ---

  **Walkthrough:**

  1.  **Integrity Complaint Bites:** Williams' integrity objection applies forcefully. Arden is required by impartial morality to abandon the very commitment that gives her professional life meaning and structure – the Vance project *is* her curatorial identity. Forcing her to treat this identity-constituting project as fungible, as a mere contributor to an aggregate utility calculation that can be readily discarded when outweighed, constitutes a profound attack on her integrity. **What makes it distinctively about integrity rather than loss:** The complaint isn't just that she bears a heavy cost, but that the cost is inflicted *by requiring her to disown the constitutive commitment that makes her who she is as an agent*, reducing her deepest source of reasons to a neutral input. Her action is compelled *against* the reasons generated by her ground project, not merely costly *because* of it.
  2.  **'One Thought Too Many' Complaint Does NOT Bite (Indeed, its absence is criticised):** Arden's institutional role *as a curator* inherently embodies a fiduciary duty to the public and the museum's mission (access, engagement, diversity). *Not* explicitly considering the impartial demand – the effect on visitor experience and diversity – would be a professional failing, a dereliction of her institutional duty. The "one thought" about the aggregate good isn't an alien, integrity-undermining intrusion; it is constitutive of the practical reasoning *required by the role she occupies*. We would criticise her for *not* having this thought as part of her deliberation, precisely because her position demands internalising this impartial perspective. The thought arises from the practical demands of her role, not from detached philosophical scruples or an outsider's request for justification.

  **Load-Bearing Feature:** The **agent's institutional position (Senior Curator) requiring the internalisation of specific impartial norms (public access, diversity) as constitutive of the role itself.** This creates a professional context where impartial reasoning is not just permissible but *expected*, making the explicit impartial thought practically necessary and its absence culpable, while the ground project sacrifice still violates integrity by demanding she treat her identity-conferring commitment as externally dispensable.

  **Swap Test:** Replace Arden's Vance project ground project with a deep, identity-conferring *friendship* with Silas Vance himself (assuming he were alive), which the museum demands she sever to avoid perceived bias or because his presence deters visitors. Now, the impartial thought ("I must prioritise the museum's impartial goals over my friend") *does* become a potential "one thought too many." Deliberation focused solely on her duty to her friend would be understandable, even admirable; explicitly weighing his value against aggregate visitor satisfaction feels cold, instrumentalising, and criticisable. The verdict flips because the impartial norm (avoiding bias/prioritising visitors) is not *constitutive* of the core motivation of friendship in the same way museum ethics are constitutive of curatorial duty. Friendship's intrinsic motivations render impartial deliberation about sacrificing it idle or offensive.

  **Williamsian Rejoinder (Strongest Reply for Unity):** A defender of the 'single argument' view might concede the case's structure but argue the separation is superficial. They would insist the integrity complaint *subsumes* the 'one thought too many' point. The only reason the impartial thought isn't criticisable here, they'd argue, is that *within the specific context of her curatorial identity*, considering the public good *is part of her integrity*. Her integrity-as-curator incorporates the impartial norm. Therefore, the complaint is still fundamentally about integrity: forcing her to sacrifice the Vance project violates the part of her integrity rooted in *personal* aesthetic passion, while *not* considering the public good would violate the part rooted in *professional* duty. Both aspects concern threats to her overall integrated self, just different facets. The 'one thought too many' is merely an indicator of *when* an impartial thought violates a *different*, more deeply identity-conferring commitment – which is still the core work of the integrity objection.

  **Honest Assessment of Separation:** The separation feels **real, but contextually dependent and somewhat artefactual of the constraints.** You've correctly identified the crucial factor: **whether the commitment arrives with its own motivation that renders impartial deliberation idle or offensive.** In standard personal relationships (like friendship in the swap test), the intrinsic motivation *does* render impartial deliberation idle/offensive – hence 'one thought too many'. In Arden's *professional* ground project, however, the commitment itself *incorporates* the motivation for impartial consideration as part of its constitutive norms. The Vance project matters to her *as a curator*, and being a curator entails caring about the public mission. The impartial thought is *internal* to the project's own motivational structure in this institutional context. Your hypothesis hits the mark: the difference *does* turn on whether the commitment's intrinsic motivation inherently excludes (making deliberation idle/offensive) or incorporates (making deliberation practically required) the impartial perspective. The case works because we constructed a ground project where the latter is true, leveraging institutional roles.

  ---

  **Design Check Table**

  | Component                          | Verdict             | Justification (one sentence)                                                                                                | Weakest Point                                                                 |
  | :--------------------------------- | :------------------ | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------- |
  | **Scenario**                       | Meets Specs         | Ordinary institutional setting (museum), genuine Williamsian ground project (Vance research), modest impartial demand (visitor diversity/access), no villains or extreme stakes. | Risk that the sacrifice feels like a professional setback rather than identity destruction. |
  | **'Integrity complaint bites'**    | Achieved            | Impartial morality forces Arden to treat her identity-conferring Vance project as a dispensable satisfier in an aggregate calculation. | Requires accepting the Vance project as sufficiently identity-constitutive. |
  | **'One thought too many does not bite'** | Achieved            | Her institutional role *requires* explicit consideration of the impartial good; *failure* to have the thought is criticisable. | Risk that the 'requirement' feels stipulated rather than inherent in curation. |
  | **Load-bearing feature**           | Institutional Role  | The curator role constitutively requires internalising impartial norms (public access/diversity), making the thought practically necessary. | Might not generalise well beyond professional roles with clear fiduciary duties. |
  | **Swap Test**                      | Verdict Flips       | Replacing the project with a personal relationship removes the constitutive link to impartial norms, making the impartial thought criticisable. | Assumes friendship lacks institutional impartiality norms, which might not always hold. |
  | **Williamsian Rejoinder**          | Plausible Challenge | Argues integrity subsumes both complaints, as professional integrity *includes* the impartial norm, so the threat is still to integrated selfhood. | Downplays the distinct *phenomenology* of the 'one thought too many' as a separate complaint. |
  | **Overall Separation Assessment**  | Real but Contextual | Separation achieved by leveraging a ground project *whose own motivational structure incorporates* the impartial norm, validating the 'motivation renders deliberation idle' hypothesis. | The dependence on specific institutional contexts makes the separation less fundamental than desired. |
