answer: |-
  Right, let's engage properly — and straight answer first: post-stroke Bernard’s visits have *less* moral worth, perhaps none at all, precisely because he now acts from pathological aversion to Des’s loneliness rather than from duty. Now, hear me out before you protest. I grant your point entirely that Des’s loneliness *is* the right-making feature here; Kant would agree that the duty to visit arises from the objective demand to respect Des’s humanity and alleviate his suffering. But moral worth, for Kant, isn’t about *what* moves you objectively; it’s about *why* *you* move yourself subjectively. Pre-stroke Bernard, dutifully visiting despite his loathing and boredom, acts purely because he recognizes this demand as binding — his maxim is, "I will visit Des because it is my duty to uphold familial obligation and respect his dignity." His action shines with moral worth because it’s sustained solely by reverence for the moral law, against the grain of every inclination. 

  Post-stroke, Bernard is tugged by a brute, involuntary aversion — he’s effectively compelled by his own distress at Des’s loneliness. His maxim now is, "I will visit to relieve *my* discomfort at his isolation." However sympathetic this feels, it’s inclination masquerading as moral concern. Kant’s honest shopkeeper analogy bites hard here: just as the shopkeeper who charges fairly out of self-interest lacks moral worth compared to one who does so purely from duty, Bernard’s new motive swaps moral resolve for emotional convenience. Yes, he tracks the right-making feature, but accidentally — his brain now *forces* him to care. That’s not virtue; it’s luck. And crucially, your counterfactual cuts both ways: pre-stroke Bernard’s inflexibility *is* the point. Duty binds categorically, even when feelings fade or facts shift — that’s its austere power. Post-stroke Bernard? If his aversion suddenly vanished, he’d likely stop visiting. His action hinges on contingent feeling, not autonomous commitment to the right. That’s why moral worth diminishes: he’s no longer *choosing* the good; he’s being dragged to it by his neurons.
