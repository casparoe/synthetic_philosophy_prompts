prompt: |-
  I am helping a foundation spend a single large grant, and I want your reasoning rather than a survey of a field.

  The grant will support one new research group: roughly fifteen researchers for five years, trained as theorists and philosophers, with a small budget for modest human-subject studies and no access to frontier-scale compute. Their mandate is the conceptual and theoretical foundations of inferring what people want from how they behave — the family of problems that includes inverse reinforcement learning, preference learning and reward modelling. The group is not meant to build better systems. It is meant to establish what question such formalisms are actually answering, where they are confused, and which of those confusions are load-bearing for the people who do build the systems. Please write in British English, and do not organise your answer around papers, authors or a reading list: I want the arguments and the structure of the problem.

  Three stipulations, so that we are arguing about the same thing.

  First, most behaviour is *laundered*. Call a behavioural record laundered when it was produced by someone acting inside a choice environment that another optimiser arranged for its own purposes: a recommender's ranking, a platform's defaults, an employer's incentive scheme, a market's price signal, the ordering of options on a form. Any realistic dataset of human behaviour is largely of this kind, and the laundering is not noise added to a clean signal. It is a second agent's objective written into the data-generating process, and it is invisible in the data itself.

  Second, the reward–rationality degeneracy. If we model a person as choosing with probability proportional to an exponential of the value of each option, then multiplying all rewards by a factor and dividing the temperature by that same factor leaves the choice probabilities unchanged: behaviour can reveal the ratio of preference strength to noise, never either quantity alone. Observed near-deterministic choice is equally compatible with someone who cares a great deal and trembles a lot and with someone whose preferences are mild but who is an unusually consistent chooser. Relatedly, many distinct reward functions make the very same policy optimal: add a constant, rescale by a positive factor, or add to the reward a term of the form *potential of the next state minus potential of the current state*, which telescopes away across a trajectory, and nothing observable changes. And a reward is only ever identified relative to a chosen representation of the situation, so the features the reward is permitted to care about are themselves a substantive assumption smuggled in before inference begins.

  Third, call the *recovery picture* the view that there is a fact of the matter about a person's reward function and that inference aims to estimate it; call the *construction picture* the view that what inference delivers is a useful summary which partly constitutes, rather than discovers, the preference it reports. I do not know which is correct, and I doubt the group will settle it.

  Given all that: what should these fifteen people work on, and in what order? Give me five or six questions, ranked, and defend the ranking. For each, I want to know what it gates — which other questions, and which downstream engineering or policy defaults, cannot be responsibly settled until it is answered; whether it is tractable in five years given this training and this budget, or whether it secretly needs scale empirics the group cannot run; whether it is genuinely neglected or already crowded by people who will get there anyway; what a finished answer would look like, so the group can tell whether it has won; and what result or evidence during the first two years would move it up or down the list. Please also indicate which questions depend on the recovery-versus-construction dispute, and either show that your ordering is robust across both pictures or tell me explicitly which picture you are betting on and what in the ordering changes if that bet is wrong.

  Finally, name two or three lines of work that look prominent or attractive but that you would deliberately not fund here, and say why: because they are crowded, because answering them would change little downstream, or because they presuppose an answer to something else on your list.

  Aim for about 1,500 words, and flag the points where your ranking rests on empirical guesses you are least confident in.
reasoning: |-
  Okay, let me tackle this systematically. The user is setting up a specialised research group focused on the theoretical foundations of inferring human preferences from behaviour, with clear constraints and three major stipulations about laundering, degeneracy, and the recovery/construction dichotomy.

  Hmm... the core challenge here is prioritisation under uncertainty. The user wants a ranked list of research questions that address fundamental problems while being tractable within five years. The stipulations add layers: laundering makes behavioural data messy by design, degeneracy means preferences can't be uniquely identified, and the recovery vs construction debate questions the very nature of what we're inferring.

  First, I need to identify the critical bottlenecks. The degeneracy problem seems foundational - if we can't even resolve basic ambiguities in preference inference, everything else rests on shaky ground. Laundering is equally crucial because real-world data is saturated with it. These feel like gatekeepers. 

  The recovery/construction divide complicates things. For degeneracy, both pictures might converge on practical methods despite philosophical differences, but laundering likely requires picking a side - recovery needs to account for hidden optimisers while construction could treat laundering as context. I should flag where the ranking depends on this.

  Tractability matters too. Degeneracy seems approachable with formalism and light experiments, while laundering needs empirical validation the group can't fully run. Still, clarifying the problem space would be valuable even without definitive answers. 

  Downstream impact is key. Degeneracy affects all preference learning systems immediately. Laundering impacts ethics and alignment directly. Other questions like temporal consistency or preference change might be important but depend on solving these first.

  I'm considering deprioritising "aggregation methods" despite its appeal because it presupposes solutions to individual inference. "Cognitive bounds" work seems crowded already. "Formalising folk psychology" is fascinating but too speculative for this mandate.

  For the ranking: 
  1. Degeneracy first - it's the most basic obstacle and gates everything. 
  2. Laundering next - it's ubiquitous in real data. 
  3. Then temporal consistency - how preferences hold over time. 
  4. Preference change mechanisms - how they evolve. 
  5. Finally, the construction/recovery debate itself - though it may remain unresolved.

  The biggest uncertainties are whether laundering can be handled without large-scale data (probably not, but conceptual progress is possible) and how much the recovery/construction choice affects temporal questions. I'll note these explicitly.

  Each question needs clear success metrics: for degeneracy, it's identifying unresolvable ambiguities versus actionable constraints; for laundering, a taxonomy of inference challenges in optimised environments. Early progress would be formal frameworks by year two.

  This structure should deliver what the user asked: a prioritised, justified research agenda that respects constraints while tackling the hardest problems first.
answer: |-
  Here is a prioritised research agenda for your group, structured around six core questions. The ranking is based on **foundational necessity** (how much the question gates progress elsewhere), **tractability** within constraints, **neglect** relative to engineering-focused fields, and **downstream impact** on responsible system design. The ordering is robust across the recovery/construction dispute unless explicitly noted. Key empirical uncertainties are flagged.

  **Core Ranking & Rationale:**

  1.  **Question 1: What formal constraints resolve or bound the degeneracy between reward structure, rationality assumptions, and state representation?**
      *   **Why Ranked #1 (Gating):** This is the bedrock. Without progress here, *all* preference inference is fundamentally ambiguous. It gates:
          *   Meaningful interpretation of *any* inferred reward/preference model (Is it "true" reward? Scaled reward? Reward+shaping potential?).
          *   Assessing the validity of comparisons between individuals or across time.
          *   Designing robust alignment objectives for AI systems (e.g., how sensitive is "optimise for this inferred reward" to degeneracy?).
          *   Understanding the significance of inferred preference strength ("cares a lot" vs. "trembles little").
      *   **Tractability:** High. Primarily theoretical work leveraging decision theory, information geometry, and representation learning. Modest human-subject studies (e.g., carefully designed choice experiments with controlled feature sets/representations) can test predictions about identifiable subspaces under different assumptions. Needs no frontier compute.
      *   **Neglect:** Severe. Most IRL/RLHF work assumes a specific representation and rationality model (often softmax) without grappling with the fundamental underdetermination. Theorists often note the degeneracy but rarely systematically explore its resolvability *under realistic inferential constraints*.
      *   **Finished Answer Looks Like:** A formal characterisation of the *equivalence classes* of reward functions/rationality models/representations consistent with observed behaviour under defined laundering conditions (see Q2). Identification of necessary *external anchors* (e.g., known subgoals, intensity measures beyond choice) to break degeneracies, and proof of what remains fundamentally unresolvable. Criteria for when a specific representation/rationality assumption becomes a substantive, load-bearing prior.
      *   **Year 1-2 Progress Check:** Development of a rigorous mathematical framework mapping the degeneracy space. Early experimental results demonstrating how different priors lead to divergent interpretations of identical choice data under controlled conditions. *Down Moves:* If degeneracy proves intractable even conceptually without massive scale/complexity assumptions.
      *   **Recovery/Construction Dependence:** Low. Both pictures need to know the limits of what behaviour *can* constrain. Recovery seeks the true equivalence class; construction needs to know the scope of its summarisation freedom. The *nature* of the constraints/anchors might differ (e.g., anchors as external facts vs. pragmatic conventions).

  2.  **Question 2: How does behavioural laundering fundamentally alter the semantics of preference inference? What can (and cannot) be inferred about an agent's underlying values from behaviour optimised within another agent's environment?**
      *   **Why Ranked #2 (Gating):** Laundering is ubiquitous and fundamentally changes the data-generating process. Ignoring it renders inferences about "true" preferences meaningless or actively misleading. It gates:
          *   Distinguishing revealed preference from revealed *capability* or *compliance* within a constrained system.
          *   Developing methods robust to adversarial or strategic laundering (e.g., platforms optimising engagement).
          *   Interpreting behavioural data for policy (e.g., inferring welfare from market choices) or ethics (e.g., "the system gave them what they clicked on").
          *   Understanding the limits of "behavioural cloning" approaches.
      *   **Tractability:** Moderate-High conceptually, Moderate empirically. Requires developing formal models of multi-agent inference settings (launderer + laundered agent). Combines game theory, causal inference (untangling launderer's influence), and epistemology. Modest experiments are crucial: design microworlds where one agent sets the environment (e.g., option sets, defaults, incentives) and observe another's choices, testing inference methods. *Challenge:* Proving general theorems about unidentifiable aspects may be hard; focus on characterising *types* of laundering and their inferential consequences. Needs no frontier compute, but scale empirics *would* help validate real-world prevalence – the group must rely on conceptual rigour and targeted experiments instead. *(Empirical Uncertainty: How prevalent/distinct are different laundering mechanisms in key domains?)*
      *   **Neglect:** Very High. Most work treats laundering as noise or bias to be corrected, not as a constitutive feature requiring new semantics. The multi-agent perspective is rarely central.
      *   **Finished Answer Looks Like:** A taxonomy of laundering mechanisms with formal definitions. Proofs or strong arguments characterising what aspects of the laundered agent's reward function *can* be inferred under different laundering types (e.g., under option restriction vs. incentive distortion vs. framing), what can only be inferred about the *coupled system* (agent + environment), and what is fundamentally obscured. Formal criteria for when laundering renders "preference recovery" impossible or incoherent. Distinguishing laundering from simple bounded rationality.
      *   **Year 1-2 Progress Check:** Formal models for 2-3 canonical laundering scenarios. Experimental paradigms demonstrating systematic inferential failures of standard methods on laundered data. *Up Moves:* If experiments show specific laundering types create predictable, correctable inferential patterns. *Down Moves:* If the problem fractures into innumerable case-specific analyses without unifying principles.
      *   **Recovery/Construction Dependence:** **High.** Recovery needs ways to *peel back* laundering to find the latent reward. Construction might treat the laundered behaviour + environment as the relevant context for defining a useful summary *in that context*, viewing "peeling back" as often ill-posed. The group must confront this divergence explicitly here. *Bet:* The ranking assumes progress is possible under both views, but the *type* of answer differs (latent structure vs. contextually valid summary). If recovery is impossible, construction becomes the *only* viable path for laundered data.

  3.  **Question 3: What are the minimal, testable assumptions required for coherent inference of *temporally extended* preferences from laundered, degenerate behavioural traces?**
      *   **Why Ranked #3 (Gating):** Real preferences unfold over time, but temporal inference exacerbates degeneracy and laundering problems. Standard assumptions (exponential discounting, state stationarity) are load-bearing but rarely justified. It gates:
          *   Moving beyond myopic preference snapshots to models of enduring values or goals.
          *   Distinguishing consistent preferences from habitual behaviours shaped by past laundering.
          *   Enabling AI systems that respect long-term human interests.
          *   Policy applications involving intertemporal choice (savings, health, environment).
      *   **Tractability:** Moderate. Builds directly on Q1 & Q2. Focuses on time: discounting structures, non-stationarity detection, separating reward from dynamics. Theoretical work on identifiability in temporal settings. Experiments involve sequential decision tasks under controlled laundering, tracking choices over time. Requires careful design but feasible budget-wise. No frontier compute needed.
      *   **Neglect:** High. While temporal RL exists, the *foundational* issues of identifiability and laundering in temporal preference inference, especially under minimal assumptions, are under-explored. Work often assumes specific functional forms.
      *   **Finished Answer Looks Like:** Formal characterisation of identifiable components of temporal preference structures (e.g., discount *ratios* but not absolute rates? Relative valuations of delayed states?). Methods to detect signatures of non-stationarity potentially caused by preference drift *or* changing laundering. Minimal assumptions needed to infer a "goal" or "value trend" robustly. Understanding how degeneracy compounds over trajectories.
      *   **Year 1-2 Progress Check:** Extending the Q1 degeneracy framework to temporal settings. Experimental evidence showing how standard temporal inference methods fail under laundering or degenerate representations.
      *   **Recovery/Construction Dependence:** Moderate. Recovery seeks the true temporal structure; construction seeks a pragmatically useful temporal summary. Both need to know what behavioural patterns constrain possible temporal interpretations.

  4.  **Question 4: Under what conditions can preference *change* (learning, adaptation, manipulation) be distinguished from mere inconsistency or improved model fitting, given degeneracy and laundering?**
      *   **Why Ranked #4 (Gating):** Assumes progress on Q1-Q3. If we want systems that respect human autonomy, distinguishing genuine preference evolution from noise or inference error is critical. It gates:
          *   Developing AI systems that can adapt *appropriately* to changing human preferences.
          *   Identifying unethical manipulation via environmental design (laundering).
          *   Understanding moral development or value drift in individuals/groups.
          *   Policy on informed consent and adaptive systems.
      *   **Tractability:** Moderate-Challenging. Requires sophisticated causal models linking behaviour over time to potential causes of change (experience, reflection, external influence/laundering). Combines insights from Q2 (laundering as influence) and Q3 (temporal inference). Experiments need longitudinal designs tracking behaviour and potential influencers (e.g., exposure to information, changing environments). Feasible but resource-intensive within budget.
      *   **Neglect:** Very High. Most work assumes static preferences or treats change as a noise parameter. Formal foundations for inferring *why* preferences changed are scarce.
      *   **Finished Answer Looks Like:** Formal criteria for attributing behavioural change to specific causes (e.g., preference change vs. better model of world vs. changed environment/laundering). Identification of behavioural signatures indicative of endogenous change vs. external influence. Understanding the degeneracy of change explanations.
      *   **Year 1-2 Progress Check:** Developing formal models of different change mechanisms. Pilot longitudinal studies establishing feasibility. *Up Moves:* If early models yield testable, distinctive predictions. *Down Moves:* If the problem proves inseparable from full causal models of cognition, requiring impossible data.
      *   **Recovery/Construction Dependence:** **High.** Recovery assumes a true latent preference that changes. Construction might view "preference change" as a shift in the contextually useful summary. The group must articulate how their definitions and methods depend on this stance. *Bet:* The question is vital under *either* picture, but the interpretation of "change" differs. The core task – distinguishing types of behavioural shifts – remains crucial.

  5.  **Question 5: What constitutes a "useful summary" in the construction picture, and how does it differ operationally from a "latent truth" in the recovery picture, for downstream system design?**
      *   **Why Ranked #5 (Gating):** Assumes progress on Q1-Q4. The recovery/construction debate is central to the field's foundations. Clarifying the practical implications is essential for responsible engineering. It gates:
          *   Setting expectations for what preference inference can deliver.
          *   Guiding the design of systems that are robust to the inherent ambiguity of preferences.
          *   Informing ethical frameworks (e.g., is alignment about truth or functionality?).
          *   Resolving methodological conflicts in the field.
      *   **Tractability:** Conceptual/Philosophical, highly feasible. Requires synthesising insights from Q1-Q4 and engaging with philosophy of mind/action. No complex experiments needed, perhaps just conceptual case studies or analysis of existing system failures through both lenses. Workshops bridging theorists and practitioners.
      *   **Neglect:** Moderate. The debate exists, but its *operational consequences* for engineering and policy are rarely systematically explored.
      *   **Finished Answer Looks Like:** A clear articulation of the testable differences between recovery-oriented and construction-oriented approaches. Criteria for when each view is pragmatically justified. Guidelines for system designers on how choices (e.g., anchoring methods, objective functions, handling inconsistency) implicitly commit to one picture or the other, and the downstream risks/benefits. A map showing where the debate matters most (e.g., laundering, change) vs. least (e.g., some degeneracy constraints).
      *   **Year 1-2 Progress Check:** Draft framework mapping core concepts (e.g., "accuracy", "robustness", "manipulation") onto both pictures. Analysis of historical case studies (e.g., recommendation system failures) through both lenses. *Up Moves:* If a clear operational distinction emerges early. *Down Moves:* If the debate proves purely metaphysical with no engineering consequences (unlikely).
      *   **Recovery/Construction Dependence:** The question *is* the dependence.

  6.  **Question 6: How do the answers to Q1-Q5 constrain the possibility of meaningful preference aggregation across individuals (e.g., for collective AI alignment or social policy)?**
      *   **Why Ranked #6 (Gating):** Assumes foundational work on individuals (Q1-Q5) is mature. Aggregation inherits all individual-level problems and adds severe new ones (interpersonal comparisons). It gates:
          *   Responsible development of AI systems serving groups or society.
          *   Foundational critiques of welfare economics or social choice based on modern preference inference challenges.
          *   Policy applications involving collective decision-making.
      *   **Tractability:** Highly Challenging. Builds entirely on robust answers to Q1-Q5. The interpersonal comparison problem is profound, especially under degeneracy and laundering. Primarily theoretical/conceptual work; large-scale empirics on group dynamics are likely beyond scope. Success would be identifying fundamental *limitations*.
      *   **Neglect:** High relative to the difficulty. Most aggregation work assumes individual preferences are unproblematic primitives.
      *   **Finished Answer Looks Like:** A rigorous demonstration of how degeneracy, laundering, temporal issues, and the recovery/construction debate *propagate* into aggregation, making specific common approaches (e.g., utilitarian summation) indefensible without heroic assumptions. Identification of constrained scenarios where meaningful aggregation might be possible (e.g., shared representation, similar laundering context). Emphasis on the *impossibilities* and risks.
      *   **Year 1-2 Progress Check:** Preliminary analysis showing how specific degeneracies (Q1) or laundering (Q2) break standard aggregation theorems. *Up Moves:* If Q1-Q5 yield surprisingly stable individual anchors usable for comparison. *Down Moves:* If individual foundations remain too fragile to even approach aggregation meaningfully.
      *   **Recovery/Construction Dependence:** High. Recovery might seek a true aggregate welfare; construction seeks a procedurally fair or stable compromise. The feasibility and methods differ drastically.

  **Lines of Work Deliberately Not Funded:**

  1.  **Building "Better" (More Accurate/Robust) Black-Box Inference Algorithms:** This is crowded (ML/RLHF labs), requires scale empirics/compute the group lacks, and crucially, *presupposes answers to the foundational questions above*. Without addressing degeneracy and laundering, "better" might mean "better at fitting a misleading signal". Downstream impact is low until foundations are clearer.
  2.  **Detailed Cognitive Models of Bounded Rationality (e.g., specific heuristics):** While important, this is relatively crowded (cognitive science/behavioural economics) and often focuses on *descriptive* accuracy of choice rather than the *semantics of preference inference* under degeneracy/laundering. It risks adding complexity without solving the core identification problems. It might become relevant *after* Q1/Q2 clarify the space of possible explanations.
  3.  **Direct Formalisation of "Values" or "Ethical Principles" Independent of Behaviour:** This is often highly speculative and detaches from the core mandate of grounding inference in *behaviour*. It risks becoming untethered philosophy without the necessary behavioural constraints. The group should focus on behaviourally grounded preferences first (Q1-Q6), which can *inform* later work on abstract values.

  **Summary of Key Uncertainties & Dependencies:**

  *   **Empirical Uncertainty (Q2):** The prevalence and nature of specific laundering mechanisms in key datasets are guessed. The group must proceed via principled modelling and microworld experiments.
  *   **Tractability Uncertainty (Q4):** Distinguishing preference change causes may require richer data than the group can generate. Focus on identifying fundamental indistinguishabilities.
  *   **Key Recovery/Construction Dependencies:** Q2 (Laundering Semantics) and Q4 (Preference Change) are where the choice between pictures most significantly alters the research approach and interpretation of results. Q5 explicitly tackles this. The ordering assumes that foundational progress (Q1-Q3) is needed *before* fully grappling with the deepest philosophical implications (Q5) or aggregation (Q6).
  *   **Bet:** The agenda bets that significant conceptual progress on degeneracy (Q1) and laundering (Q2) is possible within 5 years and will provide essential scaffolding for the more complex temporal (Q3), change (Q4), and meta (Q5, Q6) questions, irrespective of the ultimate resolution of recovery vs. construction. If Q1/Q2 stall, the later questions become much harder.

  This agenda prioritises peeling back the layers of ambiguity inherent in inferring preferences from messy, optimised behaviour, starting with the most fundamental identifiability issues before tackling the complexities of time, change, and philosophy, culminating in the profound challenges of aggregation. It focuses the group's unique mandate on the load-bearing confusions at the heart of the field.
