  Total time: 80 minutes.

  1. Introduction (5 minutes): Explain that we are going to play a game with two groups. Each group will get materials to learn a new language. There will be a series of tasks and a final challenge. The group that does best on the challenge wins the trophy and snacks. Do not mention grounding, symbols, or meaning.

  2. Group Split (5 minutes): Split the room randomly into two groups (Group A and Group B). It might be about 8 in each. Move Group B to a separate area (if possible) or at least have them face away from the boxes. Group A stays at a table with the symbol materials. Group B gets the same symbol materials and also gets access to the boxes.

     - Group A: They are given:
          - Rulebook: Explains the format of valid strings and the translation rules between P and Q.
          - Corpus: A set of example strings (about 20) that show labels and their properties in P symbols, and also some translations to Q.
          - Dictionary: Actually, we might not need a separate dictionary. The rulebook and corpus are enough.

     - Group B: They get the same rulebook and corpus. Additionally, they are taken to the boxes and told that the labels on the boxes (L1, L2, ...) correspond to the labels in the corpus. They are allowed to handle the boxes: lift, open, etc. They are told that the property symbols correspond to properties of the boxes (color, size, weight, content) but they are not told which symbol is which property. They must figure that out by interacting.

     Note: We must ensure that Group B does not get any extra symbol materials. They get the same rulebook and corpus as Group A.

  3. Learning Phase (20 minutes): Both groups learn their materials. Group A studies the rules and corpus. Group B studies the rules and corpus and also interacts with the boxes. They are allowed to take notes.

  4. Symbol Tasks (15 minutes): We give both groups a set of symbol tasks (on paper). Examples:
     - Translate the following from P to Q: [a string from the corpus, then a new one not in the corpus but following the same pattern].
     - What are the properties of L3 in Q symbols?
     - Is this string well-formed? [provide a string that breaks a rule]

     We collect the answers and give immediate feedback (or at least, we can check and tell them if they are right). This is to build their fluency and confidence.

     We expect both groups to do well on these.

  5. The Friction Task (10 minutes): We pose the challenge:

     "We have a challenge that involves the boxes. We are going to ask a question that requires knowing about the physical properties of the boxes. Group B, you have seen the boxes. Group A, you have not. We want you to answer the question by writing down the label of the box that fits the description."

