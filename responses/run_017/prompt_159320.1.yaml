  We are designing an experiential game to illustrate the symbol grounding problem without using the terminology until the end. The goal is to have two groups: one that becomes fluent in a symbol system without any connection to the real world, and another that has the same symbols plus a "friction" connection to the physical room, such that they can perform a task that the first group fails at.

  Key elements:
  - The failure must be visible and surprising, not just a demonstration.
  - We want to test the idea of "friction" (the world correcting you in a non-symbolic way) versus mere causal contact.
  - We want to preempt the objection that the first group's failure is just due to missing data.

  Game Design:

  Title: The Box Game

  Premise:
  We create a simple world with a few physical objects (boxes) that have properties (color, size, weight, contents) and a set of symbols that describe these properties. The symbols are arbitrary (e.g., strings of letters) and the rules for combining them are provided.

  Groups:
  - Group A (Symbol Group): They get a rulebook, a dictionary (with definitions in the same symbols), and a corpus of example strings. They become fluent in the symbol system but have no access to the physical boxes.
  - Group B (Friction Group): They get the same rulebook, dictionary, and corpus, but they also get to interact with the physical boxes (they can look inside, lift them, etc.). They can also see the symbols that are associated with each box (like a label) but the labels are only on the boxes, so they must interact to see the label and then connect the label to the physical properties.

  However, note: we don't want Group B to have an unfair advantage in the symbol system. They get the same symbol materials, but they also get the physical interaction.

  We design the task so that Group A can do all the symbol manipulation tasks perfectly, but when faced with a task that requires knowing the physical outcome of an action (which is not encoded in the symbols, or encoded in a way that requires understanding the physical consequences), they fail.

  The Stakes:
  - We have a trophy (a cheap one, maybe a printed paper crown) and snacks (candy). The winning group gets the trophy and the snacks.

  Setup:

  Physical Setup:
  - We need 3-5 boxes. They should be different: different sizes (small, medium, large), different weights (light, medium, heavy), different colors (red, blue, green), and different contents (e.g., empty, filled with sand, filled with feathers, etc.). We also put a unique symbol label on each box (e.g., "ZORK", "BLIX", "GLOMP"). The boxes are placed in the room.

  Symbol System:
  - We create a formal language. Let's say we have:
    - Symbols for properties: e.g., "RED", "BLUE", "GREEN" for colors; "SMALL", "MEDIUM", "LARGE" for sizes; "LIGHT", "MEDIUM", "HEAVY" for weight; and "EMPTY", "SAND", "FEATHERS" for contents.
    - But note: the actual symbols are arbitrary. So we might assign:
        - Color: "K" for red, "L" for blue, "M" for green
        - Size: "S" for small, "T" for medium, "U" for large
        - Weight: "A" for light, "B" for medium, "C" for heavy
        - Content: "X" for empty, "Y" for sand, "Z" for feathers

    However, the groups don't know the mapping to the real world. The dictionary and rulebook use the symbols to define other symbols.

  - Rulebook: How to form a valid description of a box. A valid description is a string that concatenates the symbols for color, size, weight, and content in that order. For example, a valid string might be "K S A X" (which would correspond to a red, small, light, empty box). But note: the groups don't know that "K" means red, etc.

  - Dictionary: This is a list of "definitions" for the symbols, but written in the same symbol system. For example:
      - "K" is defined as: "the color that is the opposite of L and M" (but written in symbols, so the dictionary entry for "K" might be: "OPPOSITE(L,M)" ... and then we have to define "OPPOSITE" and so on). This is going to get very complicated and circular.

  Alternative: Instead of a dictionary, we provide a corpus of valid strings and some rules for generating new ones. But we want them to be able to answer questions about the symbols.

  We can simplify: The symbol system is a set of rules for generating strings and for answering questions about relationships between strings. But without any connection to the world.

  We need two tasks:

  1. Symbol manipulation tasks: These should be easy for both groups to learn with the materials.

     Examples:
     - Given a string, is it well-formed? (according to the rulebook)
     - Given a string, what is the next symbol in the sequence? (if we have a pattern)
     - Translation: We might have two sets of symbols for the same properties (like two languages). Group A can learn to translate between them because they have a parallel corpus.

  2. The friction task: This task requires knowing the physical outcome of an action on the boxes.

     Example task: "Which box, when pushed off the table, will make the loudest sound?" 
     - The answer depends on the weight and the content (e.g., a heavy box with sand will make a loud thud, a light box with feathers might be quiet). But note: the symbol for weight and content are known (e.g., "C" for heavy and "Y" for sand), but without knowing what "heavy" and "sand" actually mean in the real world, they cannot predict the outcome.

     However, Group B has interacted with the boxes: they lifted them (so they know which are heavy) and they looked inside (so they know the contents). So they can answer.

  But note: we don't want the symbols to encode the physical properties in a way that Group A can infer without experience. So the symbols must be arbitrary.

  Problem: How do we ensure that the symbol system does not encode the physical properties? We make the mapping from symbols to properties arbitrary and not inferable from the symbol definitions.

  How about this: We have two sets of symbols? One set for the labels (which are on the boxes) and one set for the properties? And the dictionary only defines the relationships between the two sets of symbols, not to the world.

  Example:

  We have:
  - Property symbols: for color, size, weight, content (but these are abstract symbols, say, P1, P2, P3, ... up to P12, because we have 3 colors, 3 sizes, 3 weights, 3 contents -> 3*3*3*3=81 possible boxes, but we only have 3-5 boxes). We don't assign meaning to P1, P2, ... in the symbol system.

  - Label symbols: Each box has a unique label (L1, L2, L3, L4, L5).

  - The corpus: We have a set of strings that pair labels with properties. For example:
      "L1: P1, P5, P9, P12"
      "L2: P2, P4, P8, P11"
      ... etc.

  But note: the property symbols (P1, P2, ...) don't have any meaning in the symbol system. They are just tokens. The dictionary doesn't say what P1 means, it just says that P1 is a property symbol.

  Then, we also have a second set of property symbols (Q1, Q2, ...) and a translation rule between P and Q. The rulebook might say that every P symbol can be translated to a Q symbol by a fixed mapping (which is provided in a table). Group A can learn to translate from P to Q.

  Tasks for Group A (symbol group):
  1. Well-formedness: A string is well-formed if it has the form "Lx: Py, Pz, Pw, Pv" (where x,y,z,w,v are indices) and the indices are within range.
  2. Translation: Given a string in P symbols, translate it to Q symbols using the provided mapping table.
  3. Answering questions like: "What properties does L1 have?" (by looking up in the corpus) and then translating to Q.

  Group B (friction group) gets the same materials (so they can do the above tasks too) but they also get to see the actual boxes with the labels. And they are allowed to interact with the boxes: they can lift them (to feel weight), open them (to see contents), etc. They are told that the labels on the boxes correspond to the label symbols (L1, L2, etc.) and that the properties P1, P2, ... correspond to the physical properties (but they don't know which P is which property). However, by interacting, they can figure out that, for example, P1 is color red, P5 is size small, etc. (but they don't need to know the mapping explicitly to do the friction task).

  The friction task:

  We ask: "Which box (by label) when placed on a scale would show the highest number?" (Weight task) OR "Which box when opened and its contents poured out would make the biggest mess?" (which might depend on the content and the weight?).

  But note: we want the task to require understanding the physical properties, and the symbol group only has the symbols and the corpus. Since the property symbols are arbitrary and not defined, they cannot know which property corresponds to weight. They see that L1 has properties [P1, P5, P9, P12] but they don't know which of these is the weight. And even if they did, they don't know which weight symbol (say, P9, P10, P11) corresponds to heavy.

  So Group A cannot do the task. They might guess, but they have no basis.

  Group B, by having lifted the boxes, knows which one is heaviest (if the task is weight) or which content is messy (if they opened and saw sand vs. feathers). So they can answer.

  But note: we must ensure that the corpus does not contain any information that would let Group A infer the meaning. For example, we must avoid having strings that say "P9 is the property of being heavy" because that would be a symbol defining the property in terms of other symbols (which we don't want). The corpus only has the assignments of properties to labels, and the translation between P and Q.

