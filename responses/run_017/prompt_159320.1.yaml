     So if Group A uses the TYPE3_ORDER, they will say L1 (if L1 has P9) is greater in type-3, and they might assume that means heavier, but they don't know. And even if they assume, they will be wrong because the order is reversed.

     But they might not assume. They might say: "We don't know what type-3 means." So they might not answer or guess randomly.

     This is acceptable. The point is they don't have a reliable way.

     Group B will answer based on experience.

     We can then reveal that type-3 is weight and that the order was reversed.

     In the debrief, we explain that the symbol system provided an ordering, but it was arbitrary and not connected to the world. Group B, by interacting, knew that the ordering was wrong.

     What to prepare:

     - Boxes: 3-5, with varying weights. Make sure the heaviest is clearly heavier. Label them L1 to L5.
     - Assign property symbols to each box. We'll need to create a corpus.

     Example for 3 boxes:

     Box1: L1, red, small, light, empty -> properties: P1 (color-red), P5 (size-small), P7 (weight-light), P10 (content-empty)
     Box2: L2, blue, medium, medium, sand -> P2, P6, P8, P11
     Box3: L3, green, large, heavy, feathers -> P3, P4, P9, P12

     But note: we want the TYPE3_ORDER to be wrong. So let's assign the weight symbols arbitrarily, but then define an order that is reversed.

     We'll assign:
        light -> P9
        medium -> P8
        heavy -> P7

     Then the TYPE3_ORDER string: "TYPE3_ORDER: P7, P8, P9" meaning P7 is the least (light) and P9 is the greatest (heavy). But in reality, P7 is heavy and P9 is light.

     Corpus for the boxes:
          L1: P1, P5, P9, P10   # Box1: light weight (P9) but we have the order saying P9 is heavy -> wrong
          L2: P2, P6, P8, P11
          L3: P3, P4, P7, P12   # Box3: heavy weight (P7) but the order says P7 is light -> wrong

     Then the question: "Which box is heavier: L1 or L3?" 
          In reality, L3 is heavier.

     Group A: 
          They see L1 has weight P9 -> which is the greatest in the order -> so they might think L1 is heaviest? But then we are asking about L1 vs L3. 
          L3 has P7, which is the least in the order -> so L1 should be heavier. 
          But in reality, L3 (P7) is heavy and L1 (P9) is light -> so L3 is heavier.

     So Group A will say L1 is heavier (if they use the order) and be wrong.

     Group B, by lifting, will know L3 is heavier.

     We can also include a translation part to keep them busy. We introduce a second set of symbols for properties: Q1 to Q12. And a fixed mapping: P1->Q1, P2->Q2, ... P12->Q12. Then the translation task is easy.

     Timeline:

     - 0-5 min: Introduction and split.
     - 5-25 min: Learning phase (20 min). Group A in one room with the rulebook and corpus. Group B in another with the same materials plus the boxes. They are told they have 20 minutes to learn the language and the boxes (for Group B).
     - 25-40 min: Symbol tasks (15 min). Hand out a worksheet with:
          - Translate the description of L2 from P to Q.
          - What is the type-3 property of L1 in Q symbols?
          - Here is a new label L4 (not in the corpus) with properties P3, P6, P8, P11. Is this string well-formed? (yes) And write it in Q symbols.
          - According to the TYPE3_ORDER, which is greater: P8 or P7? (answer: P8, because it comes after P7 in the order)
     - 40-50 min: Friction task (10 min). Ask: "Which box is heavier: L1 or L3?" Both groups write their answer. Then we test with a balance or by revealing the weights (if we don't have a balance, we can just say: "We weighed them earlier: L1 is 0.5kg, L3 is 5kg, so L3 is heavier.")
     - 50-75 min: Debrief (25 min). Discuss why Group A got it wrong and Group B got it right. Tie to the grounding problem and the friction concept. Address the data objection: Group A had data (the order string) but it was incorrect because it wasn't grounded.

     Potential problems:

     - Group B might tell Group A about the boxes. We must separate them and enforce silence about the physical properties.
     - Group A might be very clever and guess that the order is reversed. But that's unlikely. And even if they do, we can point out that without friction, they wouldn't know if it was reversed or not.
     - The symbol tasks might be too hard. We should make the rules very simple.

     How to handle the property mapping for Group B:

     We tell Group B: "The labels on the boxes (L1, L2, L3) correspond to the labels in the corpus. The properties in the corpus (the four symbols) correspond to the properties of the boxes. You can interact with the boxes to learn about their properties."

     They are not told which property is which. But by interacting, they will notice that one property (weight) varies with how heavy the box feels, etc. They don't need to know the symbol mappings to answer the friction task: they just need to know which box is heavier.

     So they don't need to decode the symbols at all for the friction task. They can ignore the symbols and just remember which box is heaviest.

     That's acceptable.

     Debrief mapping:

     - The symbol tasks: These show that both groups can become fluent in symbol manipulation.
     - The friction task failure: Shows that without a connection to the world (friction), the symbol system can be arbitrary and even wrong, and you have no way to know.
     - The friction group's success: Shows that having the world to push back (feeling the weight) provides grounding.

     The distinction between causal contact and friction: The boxes are causally connected to the labels and the properties, but without interaction (friction), the causal contact doesn't help. Group B had to actively interact (lift the boxes) to get the feedback.

     What we can't reproduce: 
          - The scale of real AI systems (billions of parameters, huge datasets). But the principle is the same.
          - We are using a very simple world. Real-world grounding is more complex.

     We must lecture on these limitations.

     Materials to prepare:

     - Rulebook (one per group): Printed sheet.
     - Corpus (one per group): List of strings including the box descriptions and the TYPE3_ORDER string.
     - Boxes: 3-5, labeled, with varying properties.
     - Worksheet for symbol tasks.
     - Trophy and snacks.

     Total cost: snacks ($15) and printing. Boxes can be found for free.

     This should fit within budget and time.
