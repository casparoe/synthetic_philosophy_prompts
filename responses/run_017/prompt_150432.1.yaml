prompt: |-
  Not a philosopher — I write software. Hobby project for the last few months: I've been generating Bongard problems with a script. You know the format, twelve little boxes of shapes, six on the left obey a rule, six on the right break it, you're supposed to find the rule.

  Here's the pattern I keep hitting and don't have a word for. On maybe half the problems where I think I've written a clean rule, there's a second rule I never intended that also sorts all twelve pictures correctly, and the annoying part is that I can't kill it by generating more pictures. The pictures that would tell the two rules apart are pictures my generator never produces. Either the sampler can't emit them, or they'd break the other thing a Bongard problem needs: each side has to look varied and messy, otherwise the answer is just "count the dots" and the problem is garbage. So the rival rules disagree only on cases the setup rules out in advance — not merely on cases nobody has gotten around to looking at yet.

  Two actual examples. One: my intended rule was "the dots are collinear." The rival that also fits every picture is "there are three dots" — my sampler drops points into a thin strip, so triples come out visually collinear, and three scattered dots is a picture the strip never produces. Two: intended rule "one shape sits inside the other," rival "the two shapes don't overlap," because my placement routine snaps shapes to cells and never produces a partial overlap; so inside and disjoint are the only two things that ever happen and both rules fit.

  So: does this have a name? I half remember something from a blog post about a predicate like grue — thing is green if examined before some date and blue after — which sounds adjacent, but that's about cases that are merely unexamined rather than cases my whole setup makes unreachable, and I can't tell if that difference matters or if I'm overthinking a detail. Also tell me whether I've got one phenomenon or two: the rival I can't produce a counterexample for, versus the rival I could produce but only by making the problem look trivially easy. Same failure or not?

  Don't hand me a reading list or citations, I can't chase them and don't want them. And don't lay out four candidates and leave me to choose — commit: say which existing concept you think this actually is and why the others are near misses, or, if there isn't one, coin a name, define it, and give me the boundary cases where it stops applying. Say plainly which bit you're least sure about.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a software developer creating Bongard problems using a script. The issue is that unintended rules keep fitting all the examples because the generator can't produce counterexamples. The user provided two examples: collinear dots vs. three dots, and one shape inside another vs. shapes not overlapping. 

  First, I need to figure out the core issue. It seems like the generator's constraints prevent certain cases from being generated, making unintended rules valid. The user mentions grue, but that's about time-dependent predicates, which is different because here the unproducible cases are due to the system's design.

  The user also asks if the two examples represent one phenomenon or two. In the first case (collinear vs. three dots), it's impossible to generate non-collinear triples due to the strip. In the second (inside vs. disjoint), partial overlaps are avoided to keep the problem non-trivial. Both scenarios stem from the generator's limitations, but the second involves an intentional design choice to avoid messy overlaps. So maybe they're variations of the same underlying issue.

  I recall concepts like underdetermination in philosophy, but that's about multiple theories fitting data. The key here is the impossibility of generating disconfirming cases. Goodman's grue is about inductive bias, but again, not quite the same. Maybe "empirical equivalence" or "non-falsifiability" applies, but those don't capture the generator's role.

  Then it hits me: this is similar to the Frame Problem in AI, where systems struggle to represent what doesn't happen. But more precisely, it's about the generator's implicit constraints creating accidental equivalences. The term "ad hoc underdetermination" comes to mind, emphasizing the setup's role. But maybe "generator-induced underdetermination" is clearer.

  For a name, "sampling artifact" or "generative equivalence" could work. The boundary case would be if the sampler could produce the distinguishing examples without making the problem trivial. The user needs a term that encapsulates both the unintended rule fitting and the inability to disprove it due to generation limits.

  The user's deeper need might be to understand how to avoid this issue in future projects. They might want strategies to adjust their generator to prevent such equivalences without compromising problem quality. They also need to know if their two examples are the same problem—which they are, with slight differences in why the cases are unproducible.
answer: |-
  Based on your description (especially the **key detail that counterexamples are *structurally impossible* for your generator to produce**), this is **one specific phenomenon**, not two. It's **"Ad Hoc Underdetermination"**, but with a critical twist driven by your generator's constraints. Here's the breakdown:

  1.  **The Core Phenomenon:** **Generator-Induced Empirical Equivalence.**
      *   **Definition:** Two or more distinct logical rules become *empirically indistinguishable* (both perfectly classify all generated examples) because the data-generation process *systematically excludes* any example that could distinguish them. The equivalence isn't just accidental; it's *caused* and *enforced* by the limitations or biases of the generator itself.
      *   **Why "Induced"?** The equivalence wouldn't exist with a truly general sampler. It arises *because* your sampler operates within specific constraints (thin strip preventing scattered triples, grid-snapping preventing partial overlaps).
      *   **Why "Empirical Equivalence"?** Within the specific universe of images your generator *can* produce, the rules are functionally identical. No test using only generable images can tell them apart.

  2.  **Why "Ad Hoc Underdetermination" is Close but Not Perfect:**
      *   **Underdetermination:** This is the broad philosophical idea that evidence can be insufficient to uniquely determine a theory (e.g., infinitely many curves fit two data points). Your scenario fits this.
      *   **"Ad Hoc":** This emphasizes that the equivalence is *specific to your particular setup*. It's not a fundamental logical equivalence; it's an artifact of *your* generation rules.
      *   **The Twist:** Standard underdetermination usually deals with *available* evidence not being sufficient to choose between theories that *could* diverge on *future, possible* evidence. Your case is stronger: the theories *logically could* diverge, but the divergence points are *impossible within your specific generative framework*. The underdetermination is "hard-coded" by the generator's limitations.

  3.  **Why Goodman's "Grue" is Adjacent But Different:**
      *   **Similarity:** Both involve rules that make identical predictions on observed data but diverge elsewhere.
      *   **Crucial Difference:** Grue's divergence point (a future date) is *temporally* unavailable *so far*. Your divergence points (scattered triples, partial overlaps) are *structurally impossible* for your generator. They are *logically possible* shapes, but your generator's design (strip, grid-snapping) *physically prevents* them from existing in your problem universe. Grue deals with *unexamined* cases; your problem deals with *unproducible* cases.

  4.  **Why Your Two Examples Are One Phenomenon:**
      *   **Collinear vs. Three Dots:** The thin strip prevents scattered triples. Distinguishing case is unproducible.
      *   **Inside vs. Disjoint:** Grid-snapping prevents partial overlaps. Distinguishing case is unproducible.
      *   **The Common Thread:** In both cases, the rival rule emerges solely because the generator's *spatial constraints* (strip, grid) eliminate the very scenarios that would break the equivalence. The *reason* the counterexample is unproducible (sampler physics vs. design choice to avoid mess) is an implementation detail of the generator, not a fundamental difference in the *type* of underdetermination created. Both are instances of **Generator-Induced Empirical Equivalence**.

  5.  **Boundary Cases:**
      *   **Applies:** When the generator's *core operational constraints* (like spatial boundaries, placement algorithms, rejection rules) inherently prevent the generation of any instance that would falsify one rule while satisfying the other.
      *   **Stops Applying:**
          *   If counterexamples are merely *unlikely* but possible (e.g., the strip *could* generate a very scattered triple by coincidence).
          *   If counterexamples *could* be generated by relaxing a non-core parameter (e.g., increasing the strip width *without fundamentally changing the problem type*).
          *   If the equivalence exists purely due to *random chance* in a small sample size, not generator constraints (adding more images *could* break it).
          *   If the rules are *logically equivalent* (e.g., "convex polygon" vs. "polygon with no internal angles > 180 degrees" – same thing).

  6.  **What I'm Least Sure About:**
      *   Whether **"Ad Hoc Underdetermination"** is the *most widely recognized* term in philosophical circles for this *specific generative twist*. While perfectly descriptive, philosophers might discuss it under broader umbrellas like "theory-laden observation" or "limitations of operational definitions." However, for your practical, software-focused context, **Generator-Induced Empirical Equivalence (GIEE)** is a precise and descriptive coinage that captures the mechanism and effect directly.

  **In Short:** You've hit **Generator-Induced Empirical Equivalence (GIEE)**. Your sampler's constraints create a closed universe where logically distinct rules are forced to make identical predictions because the data points that would reveal their differences are impossible to generate. Your two examples are manifestations of the same core phenomenon – the unproducibility of the distinguishing cases is the defining feature. This isn't just "unexamined" like Grue; it's "unexaminable" within your system.
