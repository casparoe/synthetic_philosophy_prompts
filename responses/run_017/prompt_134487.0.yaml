prompt: |-
  Hey — I got drafted onto the board of a tiny family foundation last spring (the Halloway Fund, about $6m, we make one or two grants a year), and I've ended up way deeper into discounting the future than I ever expected. We've got two proposals on the table and I need to figure out whether I'm being reasoned with or just talked at.

  Option A is the boring one: pay out roughly 3.5% a year forever to a local adult-literacy nonprofit, keep the principal whole in real terms. Option B is our youngest trustee's: let the whole thing compound for a hundred years and then make one enormous grant — at 3% real that's something like 19x today's money, so call it $110m of grantmaking power in 2125 instead of $200k a year now.

  Our board chair, Marilyn, keeps killing option B with the same analogy: a foundation is just a household. A household doesn't eat its seed corn; a household is *allowed* to care more about its own kids than about great-grandkids it'll never meet; and a household knows that a dollar a hundred years out is worth a small fraction of a dollar today. So: perpetual payout, no century fund, and — her actual line — "we owe the future the interest, not the principal." The analogy is doing all the work: it's what licenses both the low payout and the idea that a beneficiary in 2125 counts for less.

  Dev, who pushes option B, says the household frame *is* the disease. His version: distance in time isn't a moral reason for caring less, exactly as distance in space isn't. If you wouldn't discount a kid in another country because she's far away, you can't discount a kid in 2125 because she's far off. So pure time preference is zero, and the only thing that should move the number is the chance that nobody's there to recieve the money.

  I think both of them are being sloppy and I can't say exactly how. A few things I keep circling on and want you to deal with:

  The return is in dollars, but the thing we care about isn't. If the world keeps getting richer, a future dollar buys less welfare, so what we should be discounting might be welfare, not dollars — and once you do that it's not obvious which direction option B moves in. (Also: at 3% growth and 3% discount, isn't the century grant exactly as big as today's, in the only units that matter?)

  We can't bind the 2125 board. "Saving for the future" is really a bet that whoever is in the room in 2125 will spend it well, and our own governing document will be read by people who don't know us. A household sort of has this problem too, but it feels different in degree.

  Every year's board faces this same choice with the same reasons, so "compound now, give later" looks like a plan that nobody ever actually executes — unless we lock it in, which is the handoff problem again.

  Some of the things we could fund now have a deadline: there's a tract of land that'll be subdivided within about five years, and once it's gone it's gone. Other things we'd know much more about in twenty years. I don't know whether that's an argument about time preference at all or just about which options expire.

  And someone at a conference told me that if you're genuinely unsure what rate applies over 200 years, the honest thing is to discount the far future at roughly the lowest rate you can't rule out. That sounded like a party trick. Is it?

  What I'd like, in this order:

  **The mapping** (~250 words): a table of what corresponds to what in Marilyn's household picture — principal, kids, the mortgage rate, retirement, death, inheritance, "seed corn" — and what each of those is supposed to be in our case.

  **Where it holds** (~200 words): the parts of the household comparison that genuinely carry over to a perpetual institution.

  **Where it breaks** (~450 words): the disanalogies that matter for the decision in front of us — infinite horizon, impersonal vs. partial beneficiaries, dollars vs. welfare, growth, extinction and institutional risk, uncertainty about the rate itself — and be explicit about which ones are decisive and which are noise.

  **What the analogy smuggles in** (~250 words): which features of a household the foundation doesn't have, and which of those features are quietly supplying the conclusion. I suspect "someone has to eat next year" is doing a lot of hidden work.

  **A better comparison** (~200 words): if the household is the wrong object, what should we be comparing a perpetual foundation to — a dynasty, a trust, a nation, an ecosystem, something else — and does that comparison point anywhere different?

  **What I should tell the board** (~300 words): once the audit is done, is there any pure time preference left over after growth, risk and uncertainty are subtracted out, and is whatever's left a moral judgment or just a fact about us? Then: A, B, or something else, and what I'd have to believe to change my mind.
reasoning: |-
  Okay, the user is on the board of the Halloway Fund, a small family foundation with $6 million in assets. They're deciding between two grant strategies: Option A is a perpetual 3.5% annual payout to adult literacy, while Option B compounds the endowment for 100 years for one massive future grant. The board is split, with Marilyn favoring Option A using a household analogy and Dev advocating for Option B with a zero time preference argument. The user feels both are being sloppy and wants a thorough analysis.

  First, I need to unpack Marilyn's household analogy. She compares the foundation to a household: principal as seed corn, beneficiaries as children, payout rate as household budget, etc. But foundations aren't households - they're perpetual entities without biological constraints. The analogy smuggles in human-scale time preferences that don't apply to institutions designed to last centuries.

  The key breaks in the analogy matter: Foundations have infinite horizons, so "retirement" and "death" don't exist. Their beneficiaries are impersonal, unlike family attachments. Most crucially, economic growth changes everything - future dollars may buy less welfare if the world gets richer, making discount rates more complex than mortgage rates. Institutional risk is huge too - will the 2125 board even honor this plan?

  For the discount rate itself: After accounting for expected growth (~1-2% per capita), extinction risk (~0.1%), and uncertainty, pure time preference might be near zero as Dev argues. But that doesn't automatically make Option B better - because future wealth dilutes impact. At 3% growth, $110M in 2125 might accomplish no more than $200k today.

  On lock-in: Option B requires binding future boards, which is legally and practically fraught. Meanwhile, Option A misses time-sensitive opportunities like that land purchase. There's a third path here - temporary acceleration of giving for urgent needs, then returning to preservation.

  For the board presentation: The user should frame this as three questions. First, does the foundation exist to solve today's problems or tomorrow's? Second, can we trust the future more or less than the present? Third, what opportunities would be lost by waiting? My recommendation would be a modified Option A with occasional "sprints" for expiring opportunities, keeping the endowment intact but responsive. The household analogy isn't wrong - it's just too small for an entity that plans to outlive civilizations.
answer: |-
  Here’s a structured breakdown of your dilemma, focusing on Marilyn’s analogy, its validity, and a path forward:

  ### **The Mapping (Household ↔ Foundation)**
  | **Household Term** | **Foundation Equivalent** | **Purpose in Analogy** |
  |-------------------|--------------------------|------------------------|
  | Principal         | Endowment corpus ($6M)   | "Seed corn" – must be preserved indefinitely. |
  | Kids/Grandkids    | Current/future beneficiaries | Justifies favoring near-term beneficiaries. |
  | Mortgage/ROI      | Discount rate (3%)       | Measures trade-off between present/future value. |
  | Retirement/Death  | Foundation’s endpoint    | Implies finite horizon (but foundation is perpetual). |
  | Inheritance       | Future grantmaking       | What’s left for later generations. |
  | "Seed corn" rule  | Payout policy (≤3.5%)    | Never spend principal; only distribute "income." |
  | Household budget  | Annual grants ($200k)    | Current "consumption." |

  ---

  ### **Where the Analogy Holds**
  The core validity lies in **intergenerational stewardship**:  
  - Like a household, the foundation must preserve capital to function perpetually.  
  - Resource allocation involves trade-offs between present and future needs.  
  - Low payout rates prevent depletion, mirroring responsible household saving.  
  - Both face uncertainty (e.g., investment risk, family/foundation survival).  

  ---

  ### **Where It Breaks (and Why It Matters)**
  1. **Infinite Horizon vs. Finite Life**:  
     Households plan for decades; foundations target centuries. Marilyn’s "kids/grandkids" bias ignores beneficiaries beyond ~50 years. **Decisive**: Foundations exist to serve *all* generations equally.  

  2. **Impersonal vs. Partial Beneficiaries**:  
     Households prioritize genetic descendants; foundations serve strangers. Distance (time/space) is morally irrelevant (per Dev). **Decisive**: Discounting future recipients purely for temporal distance is ethically inconsistent.  

  3. **Dollars vs. Welfare**:  
     With 3% real growth, future dollars buy less *marginal welfare* (a richer world needs larger grants for equal impact). At equal discount/growth rates, $1 today = $1 in 2125 in welfare terms – but if growth *exceeds* discounting, Option B *underwhelms*. **Decisive**: Discount rate must exceed growth to justify Option A.  

  4. **Institutional Risk**:  
     Future boards may ignore your intent (e.g., change mission, spend principal). Households control inheritance via wills; foundations can’t bind successors. **Decisive**: Option B’s success hinges on 2125 board’s alignment – a major uncertainty.  

  5. **Uncertain Discount Rates**:  
     Over 100 years, 3% is a guess. The "lowest defensible rate" rule minimizes regret if future impact is undervalued. **Noise**: Practical for sensitivity analysis, not a moral absolute.  

  ---

  ### **What the Analogy Smuggles In**
  - **Biological Urgency**: Households *must* consume now (to survive); foundations don’t "starve" if they preserve capital. This smuggles in high time preference.  
  - **Kin Altruism**: Favoring "kids" assumes diminishing empathy for distant strangers. Foundations should be impartial.  
  - **Finite Planning Horizon**: Implicitly caps the future’s value. Perpetual institutions reject this.  
  The "someone has to eat next year" assumption drives Marilyn’s low payout rate but doesn’t apply to an endowed institution.  

  ---

  ### **A Better Comparison: The Foundation as a Nation**  
  Compare to **sovereign wealth funds** (e.g., Norway’s oil fund):  
  - Infinite horizon, serves impersonal citizens across time.  
  - Balances current spending (today’s public services) vs. investing for future generations.  
  - Discounting reflects productivity growth and risk – not kinship bias.  
  This supports **growth-adjusted discounting**: If future generations are richer (3% growth), discount welfare at ≥3% to avoid overallocating to them. Option A wins if growth-adjusted discounting >0.  

  ---

  ### **What to Tell the Board**  
  **Key Insight**: After adjusting for growth (likely 1-2% long-term per capita) and existential risk (~0.1%/year), pure time preference *should* be near zero (per Dev). But welfare discounting isn’t just moral – it’s practical:  
  - If society grows richer, $110M in 2125 may achieve *less incremental good* than $200k/year now.  
  - Option B bets on (a) higher future impact opportunities, (b) institutional continuity, and (c) no urgent needs today.  

  **Recommendation**: **Reject Option B. Modify Option A.**  
  - **Why not B**: 100-year lock-in ignores irreplaceable *current* opportunities (e.g., the land tract) and overweights uncertain future value.  
  - **Better path**: Keep 3-3.5% payout but add a **"sprint" clause**: Temporarily increase grants (e.g., 5% for 5 years) for time-sensitive projects (like the land purchase), then revert to preservation.  

  **To change your mind on Option B**: You’d need:  
  1. Confidence that future welfare impact > present (e.g., existential threats only solvable later).  
  2. Legal mechanisms to bind future boards.  
  3. Proof that today’s options are trivial compared to 2125’s.  

  **Final Vote**: **A+ (with flexibility)**, unless Dev’s case proves future neglect is costlier than present urgency. Focus grants on leverage points where timing matters (e.g., preserving assets, preventing irreversible harm).
