  First, I need to understand the core issues they raised: units of analysis (what counts as a "discarded theory"), retention rates (how much survives theory change), comparability of success (how to judge past theories fairly), and approximate truth (whether it's a meaningful concept). The user wants this documented neutrally but with enough specificity to reflect their actual positions.

  Hmm, the tricky part is avoiding strawmanning either side while making the disagreements tangible. For the units section, I should phrase Sam's selective realism as focusing on "structural components" versus the user's broader "explanatory frameworks." Neither gets to cherry-pick units arbitrarily - the document must show why their choices feel principled to them.

  For retention, the "audit" idea is clever. Sam sees high retention as evidence for realism; the user sees it as instrumental survival. I'll need to frame their expectations clearly: Sam predicts >80% retention of predictive machinery, the user expects <50% for central terms. 

  Comparability is messy. The three-way taxonomy (refuted/absorbed/reinterpreted) helps, but I must show why Sam resists judging theories by historical standards. The medicine vs physics crux matters here - if biology has higher discard rates, it undermines Sam's physics-centric view.

  Approximate truth is the knottiest. I'll have to present Sam's view that retention defines approximation versus the user's concern that it's a motte-and-bailey. The "commitment device" they requested - naming current theories and future failure conditions - will force concreteness.

  The format request is very specific: agreements (non-vacuous only), disagreement table, cruxes with predictions, verbal disputes, and error notes. I'll skip citations per their rules. For the "aside," I should flag that their retention rate argument risks talking past each other unless they define "predictive machinery" upfront.

  Notably, they want vulnerability built in: what each would count as evidence against their own position. That's smart - Sam might concede if key structures (like QFT) collapse; the user if terms like "quark" survive reinterpretation. This could actually move their debate forward.

  The medicine/physics asymmetry feels underdiscussed in their argument. If biomedical theories (say, amyloid hypothesis in Alzheimer's) get discarded more thoroughly than physical ones, it challenges structural realism. I'll make that a separate crux.

  ...Time to structure this neutrally but sharply. No waffling about "both have points" - they want their actual positions mirrored, just without caricature. The agreements section will be shortest since they're mostly opposed; the cruxes section longest because that's where progress might happen.
answer: |-
  Here is the structured document capturing your debate with Sam, adhering strictly to your rules:

  ---

  **1. Agreed Claims (Non-Vacuous)**  
  1.1. Historical scientific theories once considered empirically successful have been abandoned or radically changed (e.g., phlogiston, caloric, classical ether).  
  1.2. Current theories (e.g., quantum field theory, general relativity) generate novel, high-precision predictions unmatched by predecessors.  
  1.3. *Some* mathematical/structural elements of discarded theories persist in successors (e.g., Maxwell’s equations survived ether’s demise).  
  1.4. Judging past theories solely by modern standards is unfair; judging them solely by historical standards risks ignoring genuine progress.  
  1.5. A defensible realism must explain both scientific progress *and* theory change.  

  **2. Disagreements Table**  
  | Issue              | Sam’s Formulation (Selective Realist)                          | Your Formulation (Pessimist)                                  |
  |--------------------|----------------------------------------------------------------|---------------------------------------------------------------|
  | **Units**          | The induction ranges over *structural components* (mathematical formalisms, mechanisms generating predictions). Success is defined by predictive accuracy under those structures. | The induction ranges over *explanatory frameworks* (core ontology + explanatory principles). Success includes explanatory scope and coherence, not just predictions. |
  | **Retention**      | Retention of predictive machinery (equations, mechanisms) is high across theory changes. This retention *is* evidence for the approximate truth of those structures. | Retention is partial and often instrumental (tools/equations divorced from original ontology). High retention of formal tools doesn’t imply truth of associated unobservables. |
  | **Comparability**  | Success is measured by *absolute predictive power* (novel, precise, empirically confirmed predictions). Past theories fail by this metric. | Success must be *contextual* (vs. contemporary rivals). Many discarded theories (e.g., Fresnel’s ether optics) were as successful *in their time* as current theories are now. |
  | **Approx. Truth**  | Approximate truth is demonstrated by the *retention and continued empirical utility* of mathematical structures and mechanisms in successor theories. | "Approximate truth" is an ill-defined, post-hoc label applied whenever *any* fragment survives, regardless of ontological discontinuity. |

  **3. Cruxes with Predictions**  
  *Crux 1: Retention Audit*  
  - **Procedure**: For 5 discarded theories (e.g., caloric theory, Bohr atom, luminiferous ether, phlogiston, classical mechanics), identify:  
    (a) Components directly responsible for novel predictions.  
    (b) Fraction retained in successor(s) *with similar explanatory function*.  
  - **Sam Predicts**: >80% retention rate for (a). High retention supports structural realism.  
  - **You Predict**: <50% retention rate for (a). Survival reflects pragmatic utility, not truth-likeness.  
  - *Evidence Against Own Position*:  
    Sam: Audit shows <40% retention of predictive machinery.  
    You: Audit shows >90% retention with continuous explanatory role.  
  - *Predicted Response of Other*:  
    Sam says you’ll downplay retained components’ ontological significance.  
    You say Sam will overstate functional continuity of retained bits.  

  *Crux 2: Theory Demotion Taxonomy*  
  - **Categories**:  
    (R) *Refuted & Abandoned*: Core ontology discarded (e.g., phlogiston).  
    (A) *Absorbed as Limiting Case*: Formal apparatus retained under restricted conditions; ontology reinterpreted (e.g., Newtonian mechanics).  
    (C) *Reinterpreted*: Central terms kept but meaning radically changed (e.g., "atom" from Dalton to Bohr).  
  - **Sam’s Claim**: (A) and (C) dominate; retention of structure shows realism is justified. (R) cases were *less* successful.  
  - **Your Claim**: (R) and (C) dominate; (A) is rare. (C) is ontological replacement, not retention.  
  - **Settlement**: Apply taxonomy to 10 major theory changes. Count (A)/(C) as "retention" only if core mathematical relations retain *explanatory* (not just calculational) role.  

  *Crux 3: Physics vs. Biomedicine*  
  - **Procedure**: Compare retention rates (via Audit) for 5 discarded theories in physics (e.g., ether, caloric) vs. biomedicine (e.g., humoral theory, miasma theory, amyloid hypothesis in Alzheimer's).  
  - **You Predict**: Biomedicine shows lower retention rates and more (R)-type discards. Challenges physics-centric realism.  
  - **Sam Predicts**: Retention rates similar; biomedicine’s "theories" are less mature/structured, making comparison misleading.  
  - *Evidence Against Own Position*:  
    You: High biomed retention with structural continuity.  
    Sam: Physics retention as low as biomedicine.  

  *Crux 4: Commitment Device (40-Year Forecast)*  
  | Current Theory       | Sam’s Abandonment Condition                     | Your Abandonment Condition                          | Sam’s Prediction | Your Prediction |
  |----------------------|-----------------------------------------------|---------------------------------------------------|------------------|----------------|
  | **Quantum Field Theory** | Core Lagrangian discarded; no successor uses its fields/particles as fundamental. | "Quantum field" or "virtual particle" becomes a calculational fiction (like ether). | Retained (C) | Demoted (R/C) |
  | **Neo-Darwinism**    | Mechanism of inheritance/natural selection replaced (not extended). | "Gene" as unit of heredity abandoned; selection demoted to minor role. | Retained (C) | Demoted (C) |
  | **ΛCDM Cosmology**   | Dark matter/energy not merely unexplained but *empirically excluded* by new data. | Dark matter particles undetected; model replaced by modified gravity without dark sectors. | Retained (A/C) | Refuted (R) |
  | **Predicted Survival Rate** | >80% of core structures retained | <50% of core ontologies retain referents | | |

  **4. Purely Verbal/Definitional Elements**  
  - **"Approximate Truth"**: Sam uses it to mean *empirical adequacy of retained structure*; you use it to mean *ontological fidelity*. Disagreement is substantive, not verbal.  
  - **"Theory"**: Sam focuses on predictive formalism; you focus on ontology+explanation. This drives the "Units" dispute but reflects deeper commitments.  
  - **"Success"**: Sam’s "absolute predictive power" vs. your "contextual dominance" isn’t merely semantic—it dictates which historical cases count.  

  ---

  **Aside on Sub-Arguments**  
  - **Retention Rate Debate**: You’re both equivocating on "predictive machinery." Sam includes *any* equation that survives (e.g., Poisson’s equation in gravity models). You mean *the specific mechanism generating novelty* (e.g., ether’s mechanical vibrations). The audit fails unless you predefine this.  
  - **Hindsight Charge**: Both correct. Realists *do* spotlight surviving fragments; pessimists *do* spotlight discarded wholes. The taxonomy (#2) and audit (#1) force specificity.  
  - **Biology vs. Physics**: Sam’s "maturity" response is valid—if biomedical theories are less formalized, lower retention may not challenge realism. But if *mature* bio-theories (e.g., genetic code) show low retention, it damages her view.  

  ---  
  This document isolates the cruxes, forces testable predictions, and specifies what would falsify each position—without declaring a winner. Use the audit, taxonomy, and commitment device to focus future debates.
