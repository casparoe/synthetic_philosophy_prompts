answer: |-
  Based on your description, the phenomenon you're observing—where a strategy's fitness (average score) peaks at an intermediate frequency (e.g., 40%), cannot establish below a low-frequency threshold (e.g., 15–20%), and declines when too common—aligns with established concepts in evolutionary game theory and ecology. Below, I'll carve out the conceptual landscape, define the key terms, clarify differences from related concepts, and address your questions about mechanisms and artifacts.

  ---

  ### **Core Concept: Stable Polymorphic Equilibrium with Frequency-Dependent Selection**
  Your observed strategy exhibits **negative frequency-dependent selection** (NFDS) with a **nonlinear fitness-frequency relationship**. Specifically:
  - **Below the invasion threshold (e.g., <15–20%)**: The strategy's fitness is lower than the resident strategy's, so it cannot invade (positive frequency dependence disadvantage).
  - **At intermediate frequencies (e.g., 15–40%)**: Fitness increases as frequency rises (negative frequency dependence advantage), allowing the strategy to grow.
  - **Above the peak frequency (e.g., >40%)**: Fitness decreases as frequency rises (reverting to positive frequency dependence disadvantage), pulling the population back toward the peak.

  This creates a **stable polymorphic equilibrium** at the frequency where fitness is maximized (e.g., 40%). The equilibrium is "stable" because deviations trigger frequency-dependent forces that restore the balance (e.g., if frequency exceeds 40%, reduced fitness causes it to decline). The **invasion threshold** (minimum frequency needed to establish) is a critical feature.

  #### **Why this term fits**:
  - **Polymorphic equilibrium**: The population stabilizes with multiple strategies coexisting (your strategy at ~40%, others at ~60%).
  - **Frequency-dependent selection**: Fitness depends on the strategy's share in the population, driven by game payoffs.
  - **Stable**: The equilibrium resists small perturbations (e.g., mutants) due to the restoring force of NFDS.

  This differs from simpler NFDS (e.g., where fitness always decreases with frequency) because your case has a **hump-shaped fitness curve** (fitness peaks at intermediate frequency). In ecology, this is sometimes called **hump-shaped frequency dependence**, but in game theory, it's a subtype of polymorphic stability.

  ---

  ### **How This Differs from Related Concepts**
  1. **Evolutionarily Stable Strategy (ESS)**:
     - ESS describes a strategy that, when dominant, resists invasion by mutants (e.g., your first observation). It assumes near-fixation and does not address invasion from rarity.
     - Your case differs: The strategy is **not ESS** because it cannot achieve fixation (it declines when too common) and requires coexistence. ESS is a special case of monomorphism (one strategy dominates); yours is polymorphism.

  2. **Evolutionarily Stable State (ESS for polymorphisms)**:
     - This extends ESS to mixed-strategy populations. However, it typically implies global stability, whereas your strategy is only stable at intermediate frequencies and unstable at extremes.
     - Your case fits if viewed as a **component** of an evolutionarily stable state, but the hump-shaped fitness curve adds nuance not always captured by standard ESS.

  3. **Critical Mass / Tipping Point**:
     - These describe thresholds for invasion (e.g., your 15–20% point) but are not formal game-theory terms. They ignore the self-limiting decline at high frequencies and the equilibrium mechanics.
     - Your case is a specific **dynamic equilibrium** with bidirectional restoring forces (not just a one-way threshold).

  4. **Allee Effect** (from ecology):
     - Allee effect describes low-density disadvantages (e.g., difficulty finding mates), similar to your invasion threshold. However, it lacks the high-frequency self-limitation and is not game-theoretic.
     - Your case is a **frequency-dependent analog of the Allee effect**, but applied to evolutionary games.

  5. **Rock-Paper-Scissors (RPS) Dynamics**:
     - RPS involves cyclic dominance (e.g., A beats B, B beats C, C beats A). Your strategy has no cycles; it stabilizes at a fixed point.
     - Your case is simpler: A single strategy's fitness drives stabilization, not cyclical interactions.

  ---

  ### **Mechanism: Why This Arises in Iterated Games**
  - **One-shot vs. Iterated Prisoner's Dilemma (IPD)**:
    - In one-shot games, strategies are simple (cooperate/defect), and NFDS is rare. Defection usually dominates.
    - In IPD, strategies have **memory** (e.g., Tit-for-Tat, Pavlov), enabling reciprocity. Your hump-shaped fitness likely arises because:
      - **At low frequencies**: The strategy (e.g., a reciprocator) is exploited by defectors when rare, as it cannot form sustained cooperative partnerships.
      - **At intermediate frequencies**: Cooperators meet each other often enough to mutualism, while defectors are suppressed. Fitness peaks.
      - **At high frequencies**: Defector mutants (or "free-riders") invade by exploiting the now-common cooperators, reducing fitness. Alternatively, the strategy may start "self-exploiting" (e.g., excessive forgiveness triggering mutual defection).
    - Memory allows strategies to conditionally respond, creating feedback loops that amplify frequency dependence.

  - **Is the reproduction rule an artifact?**
    - Your rule (reproduction proportional to average score) is standard in evolutionary dynamics (replicator dynamics). It reflects selection pressures accurately.
    - The phenomenon is **not an artifact**—it emerges from game payoffs. Test by altering noise or game length:
      - Reduce misreporting noise: Fitness peaks may shift (e.g., higher thresholds).
      - Shorten game iterations: Strategies collapse toward defection-dominated equilibria.
      - These changes alter the fitness curve but don't eliminate the mechanism.

  ---

  ### **Gaps in Terminology and Suggested Language**
  No single term perfectly encapsulates your strategy's behavior. The closest is **"hump-shaped frequency-dependent selection"** or **"Allee-like frequency dependence"**, but these are descriptive, not standardized. For clarity, I recommend:

  1. **For the strategy**:  
     > "A **self-limiting cooperator with an invasion threshold**."  
     *Explanation*: "Self-limiting" conveys the decline at high frequencies; "invasion threshold" specifies the minimum frequency for establishment; "cooperator" contextualizes it in IPD.

  2. **For the equilibrium**:  
     > "A **stable polymorphic equilibrium maintained by nonlinear frequency-dependent selection**."  
     *Explanation*: This highlights the restoring forces and coexistence.

  3. **For the mechanism**:  
     > "Fitness is maximized at intermediate frequencies due to **reciprocity-driven negative frequency dependence**, with **invasion thresholds** and **self-limiting effects** at high frequencies."

  ---

  ### **Why Your Case is Novel (Yet Theoretically Grounded)**
  Your strategy combines three features rarely discussed together:
  1. **Invasion threshold** (fails when rare).
  2. **Stable polymorphism** (equilibrium at intermediate frequency).
  3. **Self-limiting fitness** (decline when common).

  This is distinct from classic IPD strategies:
  - **Tit-for-Tat** invades when rare but goes to fixation (no self-limitation).
  - **Pavlov** can have polymorphic equilibria but no sharp invasion threshold.
  Your simulation's noise and memory likely enable this by disrupting simple reciprocity, creating a "goldilocks zone" for cooperation.

  ---

  ### **Summary of Key Terms**
  | **Component**              | **Established Concept**          | **Your Case**                                                                 |
  |----------------------------|----------------------------------|-------------------------------------------------------------------------------|
  | Strategy fails when rare   | Invasion threshold / Allee effect | Same, but game-theoretic (frequency-dependent disadvantage).                 |
  | Fitness peaks mid-frequency| Hump-shaped frequency dependence | Same, with bidirectional restoring forces.                                   |
  | Population stabilizes      | Stable polymorphic equilibrium   | Same, but with self-limiting dynamics (not all polymorphisms have this).     |
  | Mechanism                  | Negative frequency dependence   | Nonlinear: Negative at low frequencies, positive at high frequencies.        |

  Use this framework to describe your results without coining terms. Emphasize that this is a **nonlinear frequency-dependent equilibrium** specific to noisy, memory-based IPD. This avoids misappropriating terms like ESS while grounding your findings in evolutionary theory.
