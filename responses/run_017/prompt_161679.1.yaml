     - Arrow's theorem shows this (via the *Independence of Irrelevant Alternatives* property).  
     - If you keep it, you force a dictatorship (violating Verdict 7).  
     *Sacrifice Verdict 6*: It's the most expensive property. Dropping it allows anonymity (8), monotonicity (10), and group consistency (9).  
     *What you gain*: A practical system that avoids re-running votes but may change rankings when irrelevant options are removed. You can still reuse prior outputs by re-running the rule on subsets (not relying on top-3 extraction).

  3. **Other verdicts hold** with minor adjustments:  
     - Verdict 5 (irrelevant options) holds for unanimously last options.  
     - Verdict 9 (subgroup consistency) holds for pairwise preferences.  
     - Verdict 10 (monotonicity) is prioritized to prevent "bugs".  
     - Ties (11) are rare and handled automatically.

  ### Recommended Voting Rule: Schulze Method
  Use the **[Schulze method](https://en.wikipedia.org/wiki/Schulze_method)**. It satisfies all surviving verdicts, resolves cycles without ties, and is used in real organizations (e.g., Debian, Wikimedia).  

  **One-Sentence README Description**:  
  > "We rank options using the Schulze method: it orders choices by the strongest preference paths across head-to-head matchups, ensuring the most broadly preferred option wins and always produces a tie-free order."

  #### Why Schulze?
  - **Satisfies**: Verdicts 0, 1, 2, 3, 5, 7, 8, 9, 10, and 11.  
  - **Fails**: Verdict 4 (consensus over Condorcet) and Verdict 6 (top-3 subset consistency).  
  - **Handles your problem cases**:  
    - Cycle (5 M>O>B, 4 O>B>M, 3 B>M>O): Outputs `M > O > B` (no tie).  
    - Late ballot (O falls when added): Prevents non-monotonic drops (O won't fall if moved up).  
    - Joke options (R): Unanimously last? Ignored in rankings.  

  ### Implementation Details
  1. **Ballot Requirements**:  
     - Voters submit strict rankings (no ties per ballot).  
     - Partial ballots (e.g., "no opinion" on B): Treat unranked options as *inferior to ranked ones* but not explicitly last. Exclude them from affected pairwise comparisons.  
       *Example*: For 4 ballots with "no opinion" on B, ignore B on those ballots during head-to-head matchups involving B. Only voters who ranked B contribute to B's comparisons.

  2. **Near-Duplicate Options (e.g., Rust vs. Rust+Axum)**:  
     - Schulze is **clone-resistant** if voters rank clones adjacently. If clones split votes, rankings may change slightly—add a note: "Rank near-identical options together to avoid distortion."

  3. **Strategic Voting**:  
     - Schulze is less manipulable than Borda but not immune. If someone votes "favorite first, others last," it biases toward their favorite but won't guarantee a win. Monitor for abuse and remind voters to rank honestly.

  4. **Output**: Full ordering (not winner-only). Winner-only simplifies but violates Verdicts 3 and 9.

  ### How to Handle Your Cases
  - **Case 3 (7 M>B>O, 5 B>O>M)**: M wins (Condorcet winner).  
  - **Case 4 (Same as 3)**: M wins (Borda winner B is overruled; this is the sacrifice).  
  - **Cycle Case (5 M>O>B, 4 O>B>M, 3 B>M>O)**: Outputs `M > O > B` (via strongest path: M→O→B).  
  - **Added Late Ballot (O falls)**: Schulze ensures O won't fall if ballots only change by moving O up (monotonicity).  
  - **Joke Option (R)**: Added/removed without affecting M/B/O.  

