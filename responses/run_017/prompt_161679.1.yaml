  Drop Verdict 3 (Condorcet winner) and use **Borda Count**. It satisfies Verdict 4 (B wins) and partially Verdict 6 (for top-3 if all ballots are complete) but fails monotonicity (10) and allows adding clones to manipulate results. Not recommended due to your backend use case.

