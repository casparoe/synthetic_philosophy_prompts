prompt: |-
  I help run a tiny charity that gives out one-off grants to families in crisis, and we can fund maybe a third of the applicants each round, so we sit round a table and rank people by need. Everyone does this fluently and treats it as a factual question with a right answer. Then I also host the monthly drop-in where the applicants all meet each other, and there the exact same comparisons get treated as impossible and a bit rude — you can't compare, everyone's situation is different — and nobody thinks that's a claim we could settle. Same people, same kind of judgement, two totally different stances on whether it can be done at all.

  Three things I cant sort out. One: is there a name for that split, comparisons being licensed when a committee makes them about strangers and unlicensed when they're made between the people involved? "You can't compare" sounds like a factual claim but it seems to switch on and off depending on who's talking.

  Two: in the committee we slide between two questions that I think are actually different — who is worst off right now, and who would get the most out of the money. They come apart: the person in the worst shape may be past helping much, and two thousand pounds barely registers for someone whose problems are enormous. Does that distinction have a name? Half the time I think the whole can't-compare worry only attaches to one of them and the other one is fine, but I can't say which or why.

  Three: applicants can come and speak to us, and when they do we write down what they say but we weight income, diagnoses and rent arrears much more heavily, even though what we're supposedly ranking is how things are for them. That feels like two mistakes stacked on top of each other and I can't pull them apart.

  A friend in health policy says her whole field runs on scoring treatments by the years of life they buy, adjusted for how bad those years are, so this isn't just us.

  Is any of this an established thing, and if so which part? I don't want a label, I want to know what the phenomenon is, what it isn't, and where its edges are. If there are near-miss concepts someone might think I mean, tell me those and how mine differs from each. If there's no name for it, coin one and give me the boundary cases. Under 400 words please.
reasoning: |-
  Okay, the user runs a small charity that provides one-off grants to families in crisis. They face a dilemma where comparing needs is straightforward in committee meetings but becomes taboo in applicant drop-ins. They have three specific questions about this phenomenon and want clarity on the underlying concepts without just labeling them.

  First, the user observes that in committee meetings, members comfortably rank applicants' needs as if it's a factual exercise. Yet at the drop-in sessions with applicants, the same people reject such comparisons as impossible or rude. This seems to be about social context - who has the authority to compare whom. In committee, they're distant decision-makers assessing anonymized cases, while at drop-ins, applicants are present as full human beings where direct comparison feels dehumanizing. This isn't about logical possibility but about social permission.

  Second, the committee conflates two distinct metrics: current suffering severity versus potential impact of aid. The first asks "who hurts most now?" while the second asks "where will £2000 make the biggest difference?" These often diverge - catastrophic situations may be beyond meaningful intervention, while moderately severe cases might see transformative change. The "can't compare" objection seems to apply more strongly to suffering severity (subjective, multifaceted) than to impact potential (more quantifiable).

  Third, when applicants speak directly, the committee discounts narrative testimony in favor of "hard" metrics like income or diagnoses, despite claiming to assess overall wellbeing. This reveals two layers: 1) privileging quantifiable data over lived experience, and 2) using those proxies while believing they capture holistic need. The gap between measurable indicators and actual wellbeing gets papered over.

  Throughout, health policy examples show these aren't unique to charities. The core tension is between necessary rationing and the moral discomfort of reducing human suffering to comparable units. The unspoken need here might be for frameworks that acknowledge this tension without resolving it - perhaps ways to make comparative processes feel less reductive while accepting their practical necessity.
answer: |-
  Here's a breakdown of your phenomena, focusing on distinctions and boundaries:

  1.  **The "Can't Compare" Split:**
      *   **Phenomenon:** The social license for interpersonal comparison depends entirely on **context, role, and social distance**.
      *   **Committee Context (Licensed):** You act as **impartial allocators** making **necessary distributive decisions** about **abstract cases** ("Case #42"). Comparison is framed as a detached, technical assessment of need/impact for resource allocation. Social norms permit (even require) this comparison for fairness and efficiency.
      *   **Drop-in Context (Unlicensed):** Participants are **embodied individuals in community**. Direct comparison becomes a **social threat**, implying hierarchy of worthiness or diminishing unique suffering. Norms prioritize empathy, solidarity, and avoiding invidious distinctions among peers. The claim "you can't compare" is a **social/moral norm**, not a metaphysical truth.
      *   **Near Miss/Distinction:** It's not *objectivity* vs. *subjectivity*; both contexts involve subjective judgment. It's about **legitimate authority for comparison in a specific social practice**. "Moral luck" or "veil of ignorance" touch on impartiality but don't capture the social licensing switch.

  2.  **The Severity vs. Impact Conflation:**
      *   **Phenomenon:** Two distinct evaluative criteria are often blurred:
          *   **A. Current Welfare Deficit (Severity):** "Who is suffering the most *right now*?" (e.g., homelessness vs. imminent eviction vs. severe illness).
          *   **B. Marginal Utility of Grant (Impact):** "Where will £2000 make the *biggest positive difference* to welfare?" This factors in severity *and* the grant's potential to mitigate it effectively (e.g., preventing eviction vs. slightly easing massive debt).
      *   **Why They Diverge:** Catastrophic situations (A) may have low intervention efficacy (B). Moderately severe situations (B) might be highly malleable with limited funds. Conflating them assumes severity *always* implies high marginal utility.
      *   **The "Can't Compare" Link:** "Can't compare" likely targets **Severity (A)**. Ranking raw suffering feels like an impossible/impertinent judgment of internal states. **Impact (B)** is more amenable to comparison as it's outcome-focused (prevented harm, achieved stability) – though still difficult. Your committee likely defaults to **B** (Impact) pragmatically, even when discussing **A** (Severity).

  3.  **The Metrics vs. Lived Experience Gap:**
      *   **Phenomenon:** Two related errors:
          *   **Error 1 (Epistemic Privilege):** Privileging quantifiable proxies (income, arrears, diagnoses) over subjective testimony as *more reliable/objective* indicators of "how things are for them," despite claiming to assess the latter.
          *   **Error 2 (Proxy Imperfection):** Believing these proxies *adequately capture* the holistic, lived experience of need and wellbeing they are meant to represent. They are useful but incomplete and potentially misleading signals.
      *   **Why it Happens:** Quantifiable data is easier to systematize, compare, and defend in committee decisions ("objective evidence"). Lived experience is complex, nuanced, and harder to rank consistently. This creates a gap between the *stated goal* (assessing overall situation/welfare) and the *operational method* (scoring proxies).
      *   **Health Policy Parallel:** QALYs (Quality-Adjusted Life Years) are the ultimate proxy, attempting to reduce complex health states to a single number for comparison/rationing – facing similar critiques about capturing true lived experience.

  **In Essence:** Your charity navigates the fundamental tension between the **necessity of comparison for rationing scarce resources** and the **social, moral, and epistemic challenges of comparing human suffering and wellbeing**. The "split" arises from shifting social contexts granting or denying legitimacy. The conflation occurs because "need" is ambiguous (current state vs. potential change). The metric gap reflects the practical difficulty of measuring holistic welfare, leading to reliance on imperfect but manageable proxies. These are established, intertwined challenges in distributive justice, ethics, and decision-making under scarcity.
