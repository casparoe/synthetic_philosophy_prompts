  Diagnosis 2: Reject step (5). The idea is that even if the trying (the will, the intention) is caused by factors outside the agent's control, the agent still has a kind of control at the time of action that is relevant for desert. This is the compatibilist move: control is not about ultimate responsibility (which would require being the cause of oneself) but about the right kind of responsiveness to reasons. So, the agent might not control her genes, but if she is responsive to reasons, then she can be blamed for her choices. The Severance Test might be challenged: it assumes that if something is not under the agent's control (in the ultimate sense) then it cannot affect desert. But we might reject that test. However, step (4) (Uniformity) would then be challenged because we are applying DC differently at the outcome level and the trying level.

