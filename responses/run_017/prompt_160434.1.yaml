  Then unnatural rule: "The total number of sides is even." (circle:1 side? usually we don't assign, or we can define circle as 1, triangle 3, square 4.)

  But it's messy.

  Given the time, for the activity, we will design the training set to fit the true rule and three alternatives, including one unnatural, and accept that the unnatural one might be a bit contrived.

  For the sake of the activity, let's assume we have such a set.

  Now, let's outline the activity:

  **Logistics:**
  - Groups of 3-4 students, 4 groups (if 14 students, 3 groups of 4 and one of 2, or two of 3 and two of 4).
  - Materials: Cards for the 12 training boxes (6 positive, 6 negative) for each group, and then held-out boxes for scoring, and for the meta round, a sheet with four candidate rules.

  **Timing (75 minutes):**
  - Introduction (5 minutes): Explain the task without jargon. "We have two piles of boxes: pile A where the rule holds, and pile B where it doesn't. Your job is to write a one-sentence rule that captures what is common to pile A and not in pile B. You'll have 10 minutes to come up with a rule with your group."
  - Moment 1 (15 minutes total):
    - Groups work for 10 minutes to write a rule.
    - Each group writes their rule on a provided sheet.
    - Facilitator collects and reads them aloud (or projects) and shows that they are different.
    - Then, the facilitator points out that they all fit the data but disagree on some hypothetical box (give an example).
  - Moment 2: Scoring round (15 minutes)
    - "Now, I have six new boxes. For each box, you will write whether your rule says A (rule holds) or B (rule doesn't) and how confident you are: high or low confidence. You'll get points: if you are correct and high confidence, 2 points; correct and low confidence, 1 point; wrong and high confidence, -1 point; wrong and low confidence, 0 points. This encourages hedging when unsure."
    - Groups commit to classifications and confidence for the 6 held-out boxes (on paper).
    - Reveal the true classification for each held-out box and score.
    - Announce scores, give chocolate to the winning group.
  - Moment 3: Meta round (15 minutes)
    - Give each group a sheet with four candidate rules that all fit the training data. These include the true rule, two natural alternatives, and one unnatural rule.
    - "Bet on which rule you think I actually used when I created the boxes. Write down your choice and your confidence level (high or low). If you are correct, you get 2 points for high confidence, 1 for low. If wrong, 0 points regardless of confidence." (So no penalty for wrong bet, to encourage betting.)
    - After they bet, reveal the true rule.
    - Then ask groups to share what they bet on and why, especially if they didn't bet on the true rule.
  - Debrief (25 minutes): Map to the concepts: underdetermination, simplicity, prior expectations, projectibility, grue. Explain that the activity shows that data alone doesn't determine the rule, and we need something else (like simplicity or naturalness) but that sometimes the true rule might be unnatural. Admit that in real science, we have background knowledge.

  **Predictable problems:**
  - CS students brute-force: Make the rule complex enough that brute-force is hard, but not too hard. Our rule "odd number of black shapes" is mathematical and might be found, but with the training set designed to fit other rules, they might find one of the alternatives. If a group finds the true rule, it's okay, but in Moment 1 we collect their rule (which might be an alternative) and we show disagreement.
  - One group says any rule fits: The training set is designed to be consistent with only a limited number of rules. If they say that, challenge them to provide a rule that fits and is short. If they provide a very long rule (like a disjunction of the boxes), we can say that we are looking for short rules, and in the activity, we are considering rules that are one sentence.
  - Philosophers sitting back: Encourage group work by assigning roles or by circulating and prompting.

  **Backup plan:** If a group brute-forces the true rule early, use that in Moment 1 as one of the rules, and then in the meta round, the true rule is included and the unnatural rule might win.

  **Debrief points to cover:**
  - Underdetermination: Many rules fit the data.
  - Need for something beyond data: In the scoring round, you had to generalize, and your rule might have failed.
  - In the meta round, you bet on what you thought was natural, but the true rule might be unnatural.
  - Concepts: underdetermination, simplicity prior, projectibility (grue example), and the role of background knowledge.

  **What the activity might not deliver:** It might not clearly show that simplicity is not the only criterion (because in the meta round, the true rule might be the simplest and win). But if we make the true rule unnatural and the students bet on natural ones, then we can make the point. Also, the activity might not convey the depth of the grue problem, but we can mention it in debrief.

  **Materials to prepare:**
  - 12 training boxes (6 positive, 6 negative) for each group, on cards.
  - 6 held-out boxes for scoring.
  - Four candidate rules for the meta round on a sheet.
  - Scoreboards for groups.

  We'll use the true rule "odd number of black shapes" and the training set as designed above. For the held-out boxes, we'll have a mix that shows disagreements.

  Example held-out boxes for scoring:
  1. One white circle -> true: even -> negative.
  2. One black triangle -> true: odd -> positive.
  3. Two black circles -> true: even -> negative.
  4. One white triangle and one black circle -> true: black=1 (odd) -> positive.
  5. One black square -> true: odd -> positive.
  6. Three white circles -> true: even -> negative.

  Groups with Rule A ("black circle present") will classify:
  1. no black circle -> negative (correct).
  2. no black circle -> negative (but true is positive) -> wrong.
  3. has black circle -> positive (but true is negative) -> wrong.
  4. has black circle -> positive (correct).
  5. no black circle -> negative (but true is positive) -> wrong.
  6. no black circle -> negative (correct).

  Groups with Rule B ("no white triangle") will classify:
  1. no white triangle -> positive (but true is negative) -> wrong.
  2. has white triangle -> negative (correct).
  3. no white triangle -> positive (but true is negative) -> wrong.
  4. has white triangle -> negative (correct).
  5. no white triangle -> positive (correct).
  6. no white triangle -> positive (but true is negative) -> wrong.

  For the meta round, candidate rules:
  1. There is an odd number of black shapes. (true)
  2. There is a black circle in the box.
  3. There are no white triangles in the box.
  4. The total number of shapes plus the number of black shapes is even. (unnatural) [Let's check if it fits the training data]

  Rule 4: S + B even.

  Training positive: B is odd.
  S + B even requires S is odd (because odd + odd = even).
  In our training positive, let's see the number of shapes:
  1. 1 (odd) -> 1+1=2 even -> true.
  2. 3 (odd) -> 3+1=4 even -> true. (shapes: one black circle and two white squares -> 3 shapes, black=1)
  3. 3 shapes (three black circles) -> 3+3=6 even -> true.
  4. 2 shapes (one black circle, one white circle) -> 2+1=3 odd -> false! Doesn't fit.

  Positive example 4 has 2 shapes (even) and B=1 (odd): S+B=3 odd, not even.

  So doesn't fit.

  Instead, use: "The number of non-circle shapes is even." 

  Check training positive:
  1. shapes: one circle -> non-circle:0 even -> true.
  2. one circle and two squares -> non-circle:2 even -> true.
  3. three circles -> non-circle:0 even -> true.
  4. two circles (one black, one white) -> non-circle:0 even -> true.
  5. one circle and one white square? In our list, positive 5: one black circle and one white square -> non-circle:1 (odd) -> false. Doesn't fit.

  Given the difficulty, for the activity, we might have to adjust the training set or the rule.

  For the sake of time, in the actual activity, we can test with a small set and ensure the rules fit.

  Alternatively, use a different true rule and training set.

  Final decision: Use the true rule and training set as above, and for the meta round, include the true rule and the two natural rules that fit, and for the fourth, use an rule that is about the arrangement and fits by design, even if we have to define it as "there is at least one shape that is not touching any other" or something, but then we have to define touching.

  Given the time, I provide the activity as designed, and in the meta round, if necessary, explain that the fourth rule is one that was used by the facilitator and is not as natural.

  The activity will still illustrate the underdetermination and the betting on what seems natural.

  **Revised plan for the activity:**

  - True rule: "There is an odd number of black shapes."
  - Training set: as above, which also fits "there is a black circle" and "there are no white triangles".
  - For the meta round, candidate rules:
    1. The number of black shapes is odd. (true)
    2. The box contains at least one black circle.
    3. The box contains no white triangles.
    4. [Unnatural] The box has an odd number of shapes if and only if it has a circle. 
       (This is: (S odd and has circle) or (S even and no circle))

  Let's check if it fits the training data.

  Training positive:
  1. 1 shape (odd) and has circle -> true.
  2. 3 shapes (odd) and has circle -> true.
  3. 3 shapes (odd) and has circle -> true.
  4. 2 shapes (even) and has circle -> but then we require no circle? -> false. But it has circle -> should be false by the rule? Wait, the rule is: (S odd and has circle) or (S even and no circle). For positive 4: S=2 even, and has circle -> so it doesn't have no circle -> false.

  Doesn't fit.

  Instead, let's not have a fourth rule that fits perfectly but explain that it does fit by the facilitator's design. For the activity, we can say that all four rules fit the training data, and students have to bet.

  In the debrief, we can reveal that the fourth rule was designed to fit but is more complex or unnatural.

  Given the complexity, we go ahead with the three moments as described, using the rules and training set above.

  The activity should work to illustrate the underdetermination.
