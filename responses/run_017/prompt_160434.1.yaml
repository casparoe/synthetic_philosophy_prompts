  Based on your constraints and goals, here's a complete, runnable activity designed to make students experience the underdetermination problem without upfront jargon. The activity uses custom Bongard-style puzzles with simple shape/color/size attributes, and it's structured to fit within 75 minutes while creating "aha" moments for your debrief. I've addressed your concerns about CS dominance, philosopher engagement, and timing.

  ### **Core Puzzle Setup**
  - **True Rule**: "All triangles are white." (Simple, visual, but allows for multiple interpretations)
  - **Attributes per box**: Shapes (circle △, square □, triangle ▲), colors (black/white), sizes (big/small), counts (1-5 shapes), and clustering (touching/not touching). All attributes are visually clear.
    
  - **Training Set (12 boxes)**:
    - **Positive (rule holds)**: 6 boxes adhering to the rule. Examples:
      - 1 big white ▲ + 1 small white ○  
      - 2 small white □ (no triangles)  
      - 1 big black ○ + 1 small white ▲  
      - 3 small white ▲ (all touching)  
      - 1 big white ▲ (isolated)  
      - 2 white ○ + 1 black □ (no triangles)  
    - **Negative (rule breaks)**: 6 boxes violating the rule. Examples:
      - 1 big black ▲  
      - 1 white ○ + 1 small black ▲  
      - 2 black ▲ (touching)  
      - 1 big white □ + 1 small black ▲  
      - 3 white ○ + 1 black ▲  
      - 2 black □ + 1 black ▲ (all big)  

  This set is **intentionally ambiguous**—it also fits at least 4 other simple rules (e.g., "No black triangles," "All shapes are circles or squares," "At least one circle," "Shapes form a single cluster"). The "all triangles are white" rule is subtly unnatural because it’s a universal quantifier (rare in Bongard puzzles), making it less "obvious" than alternatives.

  ---

  ### **Activity Flow (75 Minutes Total)**
  **Groups**: Split into 4 groups (3 groups of 4, 1 group of 2). Assign roles: **Recorder** (writes rules), **Spokesperson** (shares conclusions), **Skeptic** (challenges assumptions). Rotate roles if needed to engage philosophers.

  #### **Moment 1: Rule Proposals (15 min)**
  - **Task (5 min intro)**: "Here are 12 boxes—6 in Pile A (rule holds) and 6 in Pile B (rule fails). As a group, agree on a one-sentence rule that explains this split. Write it clearly."
  - **Group Work (7 min)**: Groups derive rules from the 12 boxes. Provide physical cards or project the boxes.  
  - **Reveal (3 min)**: Collect rules anonymously. Project/read them aloud.  
    - **Expected Outcome**: Rules like these will emerge (all fit the data but conflict elsewhere):
      - "No black triangles."  
      - "At least one circle is present."  
      - "All shapes are circles or squares."  
      - "Shapes are all touching."  
    - **Facilitator Prompt**: "All these rules correctly classify the 12 boxes. But would they agree on a new box? For example, a box with a single black square?" (Rules conflict: "all circles/squares" says YES, "no black triangles" says YES, "all touching" says NO for isolated shape, etc.). Highlight 1–2 conflicts to sow doubt.

  #### **Moment 2: Scoring Round (20 min)**
  - **Task Intro (2 min)**: "Now, here are 6 new boxes. For each, predict if your rule puts it in Pile A or B. Rate confidence: **High** (sure) or **Low** (unsure). Scoring rewards caution!"  
  - **Scoring System**: Punishes overconfidence:  
    - **Correct + High confidence**: +2 points  
    - **Correct + Low confidence**: +1 point  
    - **Wrong + High confidence**: -1 point  
    - **Wrong + Low confidence**: 0 points  
    *(This encourages hedging when uncertain—key for underdetermination)*.  
  - **Group Work (8 min)**: Groups classify the 6 held-out boxes using their rule and note confidence.  
  - **Reveal & Scoring (10 min)**:  
    - **Held-Out Boxes** (designed to maximize disagreement with plausible rules):
      1. 1 big white ▲ (isolated) → *True: A* (white triangle)  
      2. 1 small black □ → *True: A* (no triangles)  
      3. 1 big black ○ + 1 small white ▲ (touching) → *True: A* (white triangle)  
      4. 2 black ▲ (not touching) → *True: B* (black triangle)  
      5. 3 white ○ (all touching) → *True: A* (no triangles)  
      6. 1 big white □ + 1 small black ▲ → *True: B* (black triangle)  
    - Groups score themselves. Award chocolate to the highest scorer.  
    - **Key Insight**: Groups using different rules will misclassify confidently (e.g., "all touching" rule fails on Box 1; "no black triangles" fails on Box 4).

  #### **Moment 3: Meta-Betting Round (15 min)**
  - **Task Intro (3 min)**: "Here are 4 rules that all fit the original 12 boxes. Bet on which one I actually used to build the puzzle. Rate confidence: **High** (2 pts if right) or **Low** (1 pt if right). Wrong bets score 0."  
  - **Candidate Rules** (all fit the 12 boxes; equally short):  
    1. "All triangles are white." *(True rule; unnatural due to universality)*  
    2. "No black triangles." *(Natural alternative)*  
    3. "Shapes form a single connected cluster." *(Natural alternative)*  
    4. "The total number of sides is odd." *(Unnatural: circle=1, △=3, □=4 sides. Fits data by coincidence)*  
  - **Group Work (7 min)**: Groups bet + justify privately.  
  - **Reveal (5 min)**: Announce the true rule (#1). Ask: "Who bet on #4? Why did #1 feel unnatural?"  

  ---

  ### **Debrief (25 min)**
  **Map the Activity to Concepts**:  
  - **Moment 1 → Underdetermination**: Many rules fit the same data but generalize differently.  
  - **Moment 2 → Projectibility & Grue Problem**: Confidence scoring mirrors real science—hedging avoids overfitting. (Introduce "grue": A rule like "no black triangles until 2024, then only black triangles" fits data but is unprojectible).  
  - **Moment 3 → Simplicity Priors & Unnaturalness**: Groups likely bet on #2 or #3—they’re more "natural" (avoid quantifiers/abstractions). But simplicity ≠ truth (#1 and #4 are complex).  

  **What the Activity Can’t Deliver**:  
  - You’ll need to explicitly **connect to induction** (Hume) and **language-dependence** (Goodman’s grue) in debrief. The activity shows underdetermination, but not why some priors (e.g., "spatial clustering > side counts") feel natural—attribute this to evolved/learned biases.  

  **Predictable Problems & Fixes**:  
  - **CS Brute-Forcers**: The true rule is hard to brute-force (requires checking all triangles, not just presence/color). If a group guesses it early:  
    - In Moment 1, use their rule to show alternatives exist.  
    - In Moment 3, their "unnatural" bet may backfire (they’ll lose points if overconfident).  
  - **Philosophers Disengaging**: Role assignments force participation. If they hang back, ask: "Skeptic, what’s a counterexample to your rule?"  
  - **"Any Rule Fits" Group**: If a group resists, challenge them: "Show me a *simple* rule that fits all 12 boxes and isn’t in our list." Use this to discuss Occam’s razor.  
  - **Timing Overrun**: Cut Moment 2 to 4 boxes or skip confidence ratings.  

  **Materials to Prep**:  
  - 12 training boxes (6A/6B) as images (print or project).  
  - 6 held-out boxes for scoring.  
  - 4 candidate rules for meta round (on slips or projected).  
  - Scoreboard + chocolates.  

  This design ensures all students actively grapple with underdetermination, prioritizes experience over jargon, and fits your time limit. The "unnatural" rule (#4) and confidence scoring create memorable tension, setting up your Week 2 discussion of priors and simplicity.
