  Now, for the most excluding desideratum: **Rationality at Nodes** does heavy lifting. It forces theories to allow re-optimization, which excludes backward induction and similar approaches that rely on pre-commitment. Without this, theories could ignore the dilemma, but with it, they must address why players might deviate.

  Is any theory satisfying all? Probably not, due to conflicts. Forward induction or epistemic game theory might come closest by incorporating belief updating, but they still struggle with variants or empirical fit. Behavioral models add realism but sacrifice normative rigor.

  Finally, a scorecard:
  - **Backward Induction**: Strong on internal consistency but fails rationality at nodes and empirical adequacy; handles unreachable nodes well but brittle in variants.
  - **Forward Induction**: Better at belief updating and confidence erosion, good for variants, but can be complex and still normative.
