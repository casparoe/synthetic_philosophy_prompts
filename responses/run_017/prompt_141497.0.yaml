  Then **Confidence Erosion**: This is whether evidence of reaching a late node erodes belief in the opponent's rationality. In centipede, if player 2 sees player 1 continue, it might suggest irrationality, allowing for cooperation. This is non-negotiable for realism; if a theory ignores such evidence, it's flawed. But it conflicts with **Global Rationality** since global premises shouldn't be updatable. It also relies on belief revision, which ties into the next point.

  **Belief Revision Mechanisms**: This desideratum requires specifying how beliefs update when unexpected moves happen. Motivation comes from variants where players face committees or randomized payoffs—these introduce uncertainty that affects beliefs. Non-negotiable for robustness, as any theory must handle deviations. Conflicts with global approaches that assume fixed rationality.

  **Robustness to Variants**: The theory should handle modified games like unknown lengths or randomized payoffs. Motivation is that real decisions involve uncertainty, and a good theory shouldn't break in small changes. Non-negotiable for broad applicability. Conflicts arise if a theory is too brittle, like pure backward induction.

  **Treatment of Unreachable Nodes**: What must the theory say about nodes that shouldn't be reached? Motivation is that in centipede, late nodes are off-path, but we still need to define rationality there for consistency. Tradition-specific—some theories like trembling hand demand full specification, others don't. Conflicts with minimalism if over-specified.

  **Empirical Adequacy**: Should the theory match human play? Motivation is that people often continue in centipede, so a theory ignoring this might be inadequate. But it's tradition-specific: classical theories prioritize internal consistency, while behavioral ones fit data. Conflicts with normative purity if we value prediction over rationality.

