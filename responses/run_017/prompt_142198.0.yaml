prompt: |-
  I am a clinical epidemiologist, and I sit on a committee that decides which screening and treatment programmes get funded. The committee's remit says it may fund only the prevention, detection, or treatment of disease, and we have discovered that none of us can say what that excludes. Before I write the position paper I have been asked to write, I want to test my own case verdicts against a principle. Below are the verdicts I actually hold. Several of the cases are invented deliberately, because with the familiar examples I can never tell whether I am judging the case or remembering a judgement. I have flagged the pairs whose verdicts I suspect cannot both stand.

  One. A blood marker found on screening, present in about five per cent of adults, which produces no symptom anyone ever notices but which doubles twenty-year stroke risk; a cheap drug removes the excess risk entirely. My verdict: a disease, and a committee that declines to fund screening for it is being negligent.

  Two. A visible pigmentation variant, with no functional difference of any kind. Bearers are systematically excluded from employment and marriage and report chronic distress. In the region where the variant is common, the same bearers report no distress at all. My verdict: not a disease; what needs fixing is the arrangement, not the people.

  Three. A familial condition, onset in early childhood, lifelong, consisting in incapacitating misery. No structural or chemical abnormality has ever been found; the misery is the only finding. It runs in families, it is not traceable to circumstances, and bearers get partial relief from medication and beg for a medical framing. My verdict: a disease. I note that this and case two are both cases of suffering with no demonstrable mechanism, and that the only difference is whether the causal route runs through other people's conduct.

  Four. A receptor variant. Homozygotes lack a working receptor, are statistically atypical, and show measurably weaker responses to some common pathogens, but are effectively immune to a widespread lethal virus and have normal life expectancy. My verdict: not a disease. I would resist any programme aimed at correcting it.

  Five. A metabolic variant that causes obesity and diabetes in the current food environment, but which was neutral or advantageous in the environment in which it arose and spread. My verdict: a disease here and now. I do not think the ancestral environment is the right reference class.

  Six. Two age-related conditions. Six-a: the near-universal loss of lens accommodation after fifty, correctable with glasses, no distress. My verdict: not a disease. Six-b: a neurodegenerative process that is near-universal past eighty, causing severe memory loss and death. My verdict: a disease. Both are statistically typical for the age class, and I split them anyway.

  Seven. Two hereditary circadian phenotypes. Seven-a: consolidated eight-hour sleep, unshiftable, from four in the morning until noon, with no other cost, and with a full working and social infrastructure built around it locally. My verdict: not a disease. Seven-b: the same total sleep, fragmented into six short blocks across the twenty-four hours, with no other measurable cost, where the bearers are tired and distressed mainly because of how the working day is scheduled. My verdict: a disease. I cannot say why the fragmentation feels like a failure and the phase shift does not, and I notice that seven-b looks uncomfortably like case two.

  Eight. A dog breed whose skull shape is now statistically typical for the breed, was deliberately selected for, and causes chronic airway obstruction. My verdict: a disease, and breeding for it is objectionable. I assume this tells me something about whether typicality is measured against the species, the breed, or the selected function, but I am not sure what.

  Nine. The case I go back and forth on. In an isolated valley population, essentially everyone carries a variant that costs about fifteen years of life relative to neighbouring populations, that nobody there experiences as a loss, that is locally regarded as normal, and that most bearers would decline treatment for if it were offered. My verdict alternates between: a disease, which we should offer to treat; and a population trait, which it would be presumptuous to medicalise.

  Ten. A continuous biomarker. I call the person at the ninety-ninth percentile diseased and the person at the ninety-second not, and I can point to no qualitative difference between them. Both verdicts feel right; I cannot say where the line belongs or whether there is one.

  The principle I have been working with, which I do not trust: a condition is a disease if and only if (i) some part or process of the organism performs below its species-typical contribution to survival or reproduction, the reference class being fixed by age and sex within the environment the organism actually lives in; (ii) the bearer is worse off with the condition than without it, all things considered; and (iii) the condition is the sort of thing medicine could in principle correct, as opposed to something we can only accommodate by rearranging the social world. My suspicion is that clause (iii) is doing the real work in cases two and seven-b, and that it is either circular or is smuggling in an institutional criterion under cover of a biological one.

  What I want from you:

  First, state as precisely as you can the best available principle in each of the three families I know are on the table — the biostatistical or naturalist one associated with Boorse, the hybrid harmful-dysfunction one associated with Wakefield, and an honestly normativist or constructivist one — and for each, say which of my ten verdicts it must overturn and which it accommodates only by distorting the case.

  Second, give me your preferred principle, clause by clause, naming the case that motivates each clause and the clause, if any, that exists solely to rescue a verdict of mine you think is indefensible.

  Third, tell me what your principle predicts about three cases not on my list: a singer who loses an unusual vocal capacity that was always statistically atypical and contributed nothing to survival or reproduction, and whose life is wrecked by the loss; a wild animal population in which a heritable condition is typical, shortens each bearer's life, and increases that bearer's reproductive success; and a variant that is currently carried by five per cent of the population and projected to be carried by most of it within five generations, because the environment is changing in a direction that favours it. Does disease status drift with frequency on your account?

  Fourth, and most usefully: state plainly which of my verdicts no coherent principle can save, and what I should say instead in the position paper. If the honest answer is that my committee's remit cannot be made to do the work we are asking of it, say so and say what should replace it.

  Fifth, tell me what kind of case my set is missing — the case that would discriminate between whichever candidates survive the third and fourth steps. I would rather add one well-chosen case than argue from these ten.

  Please argue from the cases and from the structure of the concepts; I do not want a literature review, references, or a reading list, and I would rather you did not lean on who said what.
reasoning: |-
  Hmm, this is a fascinating challenge from a clinical epidemiologist grappling with the definition of disease for funding decisions. The user has provided ten carefully constructed cases where their intuitive verdicts conflict, exposing tensions in current theoretical frameworks. They're clearly deeply familiar with the philosophical debates but wants to move beyond academic citations to practical application.

  The core tension I see is between biological dysfunction and harm-in-context. Cases like #2 (pigmentation discrimination) versus #3 (familial misery) show that identical suffering gets classified differently based on social causation. The user's proposed principle tries to bridge this with clause (iii) about medical correctability, but they rightly suspect circularity.

  For the first task - evaluating existing frameworks: Boorse's biostatistical theory would call lens presbyopia (#6a) a disease since it's subtypical function, contradicting the user's verdict. Wakefield's harmful dysfunction would struggle with #8 (dog breed) where there's clear dysfunction but the harm depends on human values. Pure normativism makes everything subjective - it would reframe #9 (valley population) as purely cultural.

  My proposed principle focuses on three elements: deviation from species-typical functioning (handling #6a vs #6b), harm relative to actual environment (#5 metabolic variant), and non-contingent harm (#2 vs #3 distinction). The trickiest is #10 (continuous biomarker) where I suggest harm threshold plus discontinuity - but acknowledge arbitrariness.

  The indefensible verdicts seem to be: #7b (fragmented sleep) where calling it a disease contradicts #2 logic; and possibly #8 (dog breed) which mixes species-level biology with human-created harm. For the committee, I recommend admitting that "disease" can't bear all the weight - they'll need explicit harm criteria beyond biology.

  Missing cases needed: one where statistical typicality and harm diverge completely (like universal but harmful trait in isolated population), and one where medical intervention could cause more harm than accommodation (testing the "all things considered" clause). These would stress-test whether biological or harm criteria should dominate.

  The user's intellectual honesty is impressive - especially flagging their own inconsistent pairs (#2 vs #7b). They're not just seeking validation but rigorous pressure-testing. The committee position paper should probably recommend supplemental criteria beyond "disease" classification, perhaps a direct harm-benefit analysis for each intervention.
answer: |-
  Below is a systematic analysis based on your cases, designed to pressure-test principles of disease classification. I’ll address each request sequentially, focusing on conceptual coherence and case-driven reasoning.

  ### **1. Evaluation of Existing Principles**  
  *(Overturned verdicts = **Bold**; Distorted accommodations = *Italics*)*  

  **A. Biostatistical (Boorsean Naturalism)**  
  *Principle*: A condition is a disease iff a part/process functions below *species-typical efficiency* (statistically subnormal) in contributing to survival/reproduction, adjusted for age/sex in the current environment.  
  - **Overturns**:  
    - **#2** (pigmentation): No functional deficit.  
    - **#3** (misery): No identified biological dysfunction.  
    - **#6a** (presbyopia): Species-typical for age.  
    - **#7b** (fragmented sleep): No survival/reproduction deficit.  
  - *Distorts*:  
    - #8 (dog breed): Calls it disease by ignoring *breed* as reference class (species-typical function is intact).  
    - #9 (valley population): Labels it disease despite being statistically typical *locally*.  

  **B. Harmful Dysfunction (Wakefield Hybrid)**  
  *Principle*: A condition is a disease iff (i) a *naturally selected function* is disrupted (evolutionary perspective), and (ii) it causes *harm* (normative judgment).  
  - **Overturns**:  
    - **#4** (receptor variant): Enhances fitness (no dysfunction).  
    - **#5** (metabolic variant): Neutral in ancestral environment (no dysfunction *by design*).  
    - **#6a** (presbyopia): Evolutionarily expected aging (no dysfunction).  
  - *Distorts*:  
    - #3 (misery): Assumes "lifelong misery" implies dysfunction without evidence.  
    - #7a (phase shift): Pathologizes non-harmful divergence from ancestral sleep patterns.  

  **C. Honest Normativism (Constructivist)**  
  *Principle*: A condition is a disease iff society *judges it undesirable* and appropriate for medical intervention (no biological facts necessary).  
  - **Overturns**:  
    - **#1** (silent marker): Ignores biological risk if culturally neutral.  
    - **#4** (receptor variant): Could label it disease if stigmatized.  
    - **#6b** (neurodegeneration): Might exclude if normalized culturally (e.g., #9).  
  - *Distorts*:  
    - #8 (dog breed): Reduces to "humans dislike it," ignoring intrinsic harm.  
    - #10 (biomarker): Arbitrary percentiles become purely political.  

  ---

  ### **2. Proposed Principle**  
  *Clauses motivated by your verdicts and case tensions*:  

  - **(i) Biological deviation**: *The condition arises from a deviation in structure/process that reduces functional capacity relative to a biologically defined reference class.*  
    - *Motivated by*: #1 (silent marker), #6b (neurodegeneration).  
    - *Reference class*: Species-typical function for age/sex in current environment (#5, #6a/6b).  

  - **(ii) Non-contingent harm**: *The condition causes harm that is not primarily dependent on social arrangements or avoidable prejudice.*  
    - *Motivated by*: #2 (pigmentation vs. #3 misery), #7a vs. #7b.  
    - *Rescues*: #3 (misery is intrinsic harm).  

  - **(iii) Medical relevance**: *The harm is feasibly mitigable through medical intervention without requiring fundamental restructuring of society.*  
    - *Motivated by*: #2 (social fix, not medicine), #7b (fragmented sleep).  
    - *Circularity risk*: Mitigated by clause (ii).  

  - **(iv) All-things-considered detriment**: *The bearer is worse off with the condition, accounting for treatment burdens and identity effects.*  
    - *Motivated by*: #4 (variant is net beneficial), #9 (valley population’s refusal).  

  ---

  ### **3. Predictions for New Cases**  
  - **Singer’s lost vocal ability**:  
    - *Not a disease*: No functional deficit for survival/reproduction (clause i). Harm is socially contingent (clause ii).  
  - **Wild animal’s heritable trait**:  
    - *Not a disease*: Enhances fitness despite shortening lifespan (clause iv: net benefit).  
  - **Variant increasing in frequency**:  
    - *Disease status drifts*: If the environment changes (e.g., pathogen spread), a once-harmful trait may become functional (clause i). *Example*: #5’s metabolic variant in a food-scarce future.  

  ---

  ### **4. Indefensible Verdicts & Committee Guidance**  
  **Indefensible under any coherent principle**:  
  - **#7b (fragmented sleep)**: Contradicts #2. Harm relies on social scheduling (clause ii violation). *Should be*: Not a disease; fix work norms.  
  - **#8 (dog breed)**: Biologically typical *for the breed* (clause i). *Should be*: Not a disease; unethical breeding ≠ medical condition.  

  **Committee guidance**:  
  > "Our remit (‘disease’) cannot resolve all funding dilemmas. Biological dysfunction and non-contingent harm are necessary but insufficient criteria. We recommend:  
  > - **Prioritize interventions** where medical correction (not social accommodation) reduces intrinsic harm.  
  > - **Explicitly exclude** conditions where harm is primarily socially imposed (e.g., prejudice) or identity-related.  
  > - **Add a harm-benefit threshold**: Fund only if net benefit (clause iv) is clinically significant and cost-effective."  

  ---

  ### **5. Missing Discriminative Case**  
  **The Universal Late-Onset Cognitive Decline**:  
  > *In Population A, severe dementia is universal by age 90, causing distress. In Population B, identical decline is universal but culturally accepted as part of a revered elder role, with no distress.*  

  - **Why it discriminates**:  
    - Tests whether *harm* (clause ii) or *biological dysfunction* (clause i) is primary.  
    - Challenges normativism (is it a disease in A but not B?) and naturalism (is universal aging dysfunctional?).  
    - Forces confrontation: If "disease" depends on cultural norms, your remit is incoherent.  

  ---

  ### **Summary for Your Position Paper**  
  1. **Reject "disease" as a sufficient criterion**. It is overinclusive (#7b, #8) and underinclusive (#3).  
  2. **Adopt a two-step test**:  
     - (A) Is there *biological dysfunction + non-contingent harm*?  
     - (B) Is *medical intervention* the optimal solution (vs. social change)?  
  3. **Explicitly exclude**: Conditions where harm stems from discrimination or identity nonconformity.  
  4. **Acknowledge gray zones** (#9, #10): Use cost-effectiveness and bearer autonomy as tiebreakers.  

  This framework prioritizes medical utility while respecting biological reality and social ethics.
