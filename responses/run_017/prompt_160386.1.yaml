prompt: |-
  I am finishing the methods chapter of my dissertation in political science, on what can legitimately be inferred from a single well-documented historical episode, and I have reached the point where a survey of positions is no longer useful to me. What I need is a specification.

  Fix the object and the purpose, because I take adequacy to be relative to a purpose. The object is a retrospective case explanation: an account, produced after the fact by someone who already knows how the episode ended, of why outcome O occurred in case C. The purpose is prospective. I want such explanations to be usable as one input to reasoning about a live analogue L that has not yet resolved — say, whether a governing coalition under sustained fiscal strain will hold together over the next two years. So the question is not what makes a historical account illuminating or well written; it is what a theory of retrospective case explanation would have to deliver for its outputs to be licensed as evidence about an unresolved case, given that the producer of the account cannot un-know the ending, and given the documented tendencies of hindsight reconstruction and of narrative shaping that the methodology literature on this topic concerns itself with.

  Below is my own draft list of candidate requirements, which I expect to be partly confused. Each has a gloss; I want you to repair, extend, and triage them rather than to ratify them.

  1. Outcome-blind evidential weighting, tested by an erasure procedure: delete from the write-up every sentence that states or presupposes O, or its timing, and ask whether the surviving evidence still supports the stated causal ranking.
  2. Live-alternative bookkeeping: at each juncture the account must name what else was still possible at the time, and must sort junctures into the unforeseeable, the foreseeable but unheeded, and the foreseen and nearly averted.
  3. Base-rate anchoring: confidence must be calibrated to how often comparable initial conditions produced O, with the reference class fixed as it was at the time, not reconstructed from the class of cases in which O in fact occurred.
  4. Conjunctive bookkeeping: where the account needs several steps all to break the same way, the compounding must be displayed rather than disguised by narrative flow as a single tendency.
  5. A negative-control or swap test: run the same explanatory procedure on contemporaneous cases where O did not occur; if it returns equally tight accounts, it has no discriminating power, and the theory must say what follows — refusal to explain, downgraded confidence, something else.
  6. Documentary-shadow correction: the surviving archive is itself partly an effect of O, since records are kept, memoirs written, and inquiries convened because the episode turned out to matter, so the evidence base is outcome-selected and not merely neutrally incomplete.
  7. Grain stability: the causal claim should survive redescription at coarser and finer grain, from individual deliberation to structural pressure, and if it holds at only one grain that must be declared.
  8. A reverse-narration test: if the account reads as naturally backwards from O as forwards from the initial conditions, treat that as evidence of rationalization rather than of causal asymmetry.
  9. Symmetric treatment of non-events: the theory must be able to explain why O did not occur in the years before it did, and to handle absences as explananda, not only presences.
  10. A stated failure condition: the account must say in advance what findings would have led its author to withdraw or downgrade it, on pain of being able to accommodate any archive whatsoever.
  11. A transport license: the deliverable must identify which features of C are load-bearing for transfer to L, and must say how far and under what changes the license extends, since my purpose is exactly transfer.
  12. An anti-deflation constraint: the output must remain a causally unified account of a particular episode — an explanation — and may not discharge its obligations by returning an unordered weighted list of factors.

  What I want from you:

  First, restate the desiderata properly, each with the case or consideration that motivates it, in the form of requirements on a theory rather than instructions to a historian. Say explicitly which of my twelve are genuine desiderata for the purpose I have fixed, which are prejudices of one methodological camp dressed up as requirements, which are really the same requirement counted twice, and what is missing. I am particularly unsure whether the anti-deflation constraint is a desideratum or a professional preference, and whether the reverse-narration test earns its place or merely restates the erasure procedure.

  Second, mark each requirement as non-negotiable for the stated purpose or as negotiable, and say what would have to change about the purpose for the negotiable ones to become binding.

  Third, and this is the part I care most about: identify which subsets of the requirements cannot be jointly satisfied. I suspect a real tradeoff between narrative unification and calibrated conjunctive contingency, and another between correcting for the documentary shadow and keeping evidential weights independent of O, since diagnosing the selection seems to require the very knowledge one is trying to neutralise. If the full list is unsatisfiable, say so and treat that as the result, and then tell me the strongest weaker purpose the truncated list will support — that is, what I should retreat to, and what I should stop claiming in the chapter.

  Fourth, name the single requirement that does the most work in excluding otherwise attractive theories, and justify the choice.

  Finally, a compressed scorecard, no more than about 150 words, rating four families of approach against the list: covering-law and statistical-relevance accounts, mechanism or process-tracing accounts, counterfactual difference-making accounts, and narrativist accounts that treat the shape of the story itself as the explanation. Keep the argumentative weight on the criteria; the scorecard is for orientation only.

  Anchor each requirement on either my coalition-under-fiscal-strain case or on a real episode you are confident any reader of the chapter will recognise, and say which you have used. Please do not supply references or reading lists; I have that part covered, and I want the specification itself.
reasoning: |-
  Okay, the user is working on their dissertation in political science, specifically the methods chapter. They're focusing on what can be inferred from a single historical case for prospective use in unresolved situations. Their main goal is to figure out how to make retrospective case explanations useful for predicting outcomes in similar ongoing cases, while acknowledging issues like hindsight bias and narrative shaping.

  The user has provided a list of 12 candidate requirements but is unsure which are valid. They want these requirements restated properly, evaluated for necessity, checked for conflicts, and then used to assess different methodological approaches. 

  First, I need to understand each requirement in the context of their purpose. The object is a retrospective explanation of why an outcome happened in a past case, and the purpose is to use that explanation to inform reasoning about a current, unresolved analogous situation. Key challenges include the explainer knowing the outcome in advance and biases from hindsight.

  For each requirement, I'll restate it as a condition for the theory, identifying the core motivation. For example, requirement 1 is about ensuring evidence isn't weighted based on knowing the outcome. The erasure procedure tests if the explanation holds without outcome knowledge. This seems crucial for avoiding hindsight bias, so it's non-negotiable. 

  I notice some requirements might overlap. For instance, the reverse-narration test (8) and erasure procedure (1) both address hindsight bias but from different angles. The reverse-narration test specifically targets narrative rationalization, making it distinct. The anti-deflation constraint (12) ensures the explanation remains a unified account, which might be a preference but is necessary for transferability to new cases.

  There are potential conflicts. Documentary-shadow correction (6) requires acknowledging that the available records are influenced by the outcome. But to correct for this, you might need to know the outcome, which conflicts with outcome-blind weighting (1). This creates a tension: adjusting for biased evidence without using biased knowledge.

  Another conflict is between narrative unification and conjunctive bookkeeping (4). Conjunctive bookkeeping demands showing all the necessary steps that had to happen, which can make the explanation fragmented. A unified narrative might gloss over these contingencies, making it harder to see the compounding risks. This trade-off is inherent; you can't have a seamless story and fully highlight each contingency point.

  The most binding requirement might be the transport license (11). It forces the theory to specify which elements of the past case are relevant to the new one. Without this, even a perfect explanation of the past doesn't help with future cases. This requirement challenges theories that focus too narrowly on unique aspects of the case.

  For the scorecard, covering-law approaches struggle with conjunctive bookkeeping and transport licenses because they rely on general laws that might not capture specific contingencies. Process-tracing might handle outcome-blindness and conjunctive steps well but could falter on documentary shadow correction. Counterfactual approaches might manage base-rate anchoring but struggle with narrative tests. Narrativist accounts excel in unified explanations but fail on many fronts like outcome-blindness and contingency display.

  The user's deeper needs include wanting a coherent framework that acknowledges real-world limitations. They might be grappling with the feasibility of their requirements and need to know where to compromise. Identifying conflicts helps them refine their argument, possibly scaling back to a more achievable purpose, like using historical cases to identify critical variables rather than full predictions.
answer: |-
  Here is a specification tailored to your purpose, triaging and restructuring your requirements into core desiderata for a theory of retrospective case explanation enabling prospective use in unresolved analogues. I anchor motivations in your fiscal coalition case (FCC) for consistency.

  ---

  ### Restated & Evaluated Desiderata for a Theory

  1.  **Outcome-Independent Evidential Support:**  
      *   **Requirement:** The theory must ensure the *evidential weight* assigned to factors does not depend on knowing outcome O.  
      *   **Motivation:** Hindsight bias (e.g., interpreting ambiguous actor statements in FCC *as clear signs* of impending collapse).  
      *   **Test:** Erasure procedure validity (non-negotiable for prospective inference).  
      *   **Status:** Non-negotiable (core to neutralizing hindsight).

  2.  **Explicit Contingency Mapping:**  
      *   **Requirement:** The theory must require identifying plausible alternative outcomes *at critical junctures* (not exhaustive listing), categorizing them by foreseeability/avoidability.  
      *   **Motivation:** Avoids deterministic narrative; highlights points of fragility/resilience relevant for analogues (e.g., in FCC, was cabinet defection *truly* unforeseeable or ignored?).  
      *   **Status:** Non-negotiable (essential for transferable insights).

  3.  **Reference-Class Calibration:**  
      *   **Requirement:** The theory must provide a method for anchoring confidence in causal claims to the *ex ante* probability of O, based on a reference class defined *prior* to O's occurrence.  
      *   **Motivation:** Prevents overconfidence from rare outcomes (e.g., FCC collapse might be rare *even among* coalitions under high strain).  
      *   **Status:** Non-negotiable (key to probabilistic reasoning in analogues).

  4.  **Conjunctive Transparency:**  
      *   **Requirement:** The theory must require explicitly stating when O depends on multiple *independent* necessary conditions/steps, quantifying (or rank-ordering) their joint improbability.  
      *   **Motivation:** Prevents narrative from masking cumulative contingency (e.g., FCC collapse required *both* failed austerity vote *and* PM's refusal to reshuffle).  
      *   **Status:** Non-negotiable (vital for realistic risk assessment in L).

  5.  **Discriminatory Power Validation:**  
      *   **Requirement:** The theory must specify how its explanatory procedure would handle "negative controls" (similar cases without O) and mandate reporting results. Failure to discriminate must reduce confidence in the explanation for C.  
      *   **Motivation:** Rules out "just-so stories" that fit any outcome (e.g., an FCC explanation should *not* fit equally stable coalitions under strain).  
      *   **Status:** Non-negotiable (fundamental to causal inference).

  6.  **Evidence-Base Endogeneity Correction:**  
      *   **Requirement:** The theory must provide methods to diagnose and mitigate bias arising from O's influence on evidence availability/creation (e.g., more critical memos preserved after collapse).  
      *   **Motivation:** Archives are often outcome-shaped (e.g., post-collapse inquiries in FCC generate critical evidence absent otherwise).  
      *   **Status:** Non-negotiable *in principle*, but practical methods are inherently limited. Tradeoff with (1) is real.

  7.  **Causal-Grain Specification:**  
      *   **Requirement:** The theory must require specifying the level(s) of analysis (agent/structure) at which causal claims hold and assessing robustness across plausible grains.  
      *   **Motivation:** Prevents grain-dependent artifacts (e.g., FCC explanation holding only at level of "leadership failure," not structural constraints).  
      *   **Status:** Non-negotiable (clarity for transfer).

  8.  **Narrative Rationalization Test:**  
      *   **Requirement:** The theory must treat an explanation that reads equally naturally backwards (from O) as forwards as indicative of potential rationalization, triggering higher scrutiny.  
      *   **Motivation:** Flags "inevitability" narratives potentially driven by O-knowledge (distinct from erasure; tests *narrative structure* bias).  
      *   **Status:** Negotiable. Useful heuristic, not a strict requirement. Purpose weakened if omitted: reduced ability to flag narrative bias.

  9.  **Non-Event Explanatory Capacity:**  
      *   **Requirement:** The theory must be able to generate explanations for why O *did not occur* at earlier points (counterfactual stability) using the same logic.  
      *   **Motivation:** Ensures explanation isn't outcome-driven and captures dynamic causes (e.g., why FCC survived previous fiscal crises).  
      *   **Status:** Non-negotiable (strengthens causal claim, aids transfer).

  10. **Falsifiability Specification:**  
      *   **Requirement:** The theory must require stating specific, observable (in principle) findings that would disconfirm or significantly weaken the explanation.  
      *   **Motivation:** Prevents unfalsifiable "rubber" explanations accommodating any evidence (e.g., FCC explanation must specify what evidence would show collapse was *not* due to X).  
      *   **Status:** Non-negotiable (scientific rigor, prevents overfitting).

  11. **Transferability Specification (Transport License):**  
      *   **Requirement:** The theory must identify which causal elements in C are *necessary and sufficient* for transfer to L ("load-bearing features") and specify allowable variations in context/conditions.  
      *   **Motivation:** Directly serves prospective purpose; prevents naive analogy (e.g., FCC coalition type *and* specific trigger mechanism must be present in L).  
      *   **Status:** Non-negotiable (core to your goal).

  12. **Causal-Unity Constraint (Anti-Deflation):**  
      *   **Requirement:** The theory must deliver a *causally coherent account* of how factors interacted sequentially/mechanistically to produce O in C, not just a factor list.  
      *   **Motivation:** A factor list lacks the sequential/contextual logic needed to judge applicability to L's unfolding process (e.g., knowing *which* factors mattered *when/how* in FCC is crucial for L).  
      *   **Status:** **Non-negotiable.** It's a requirement for *explanation usable prospectively*, not just aesthetics. A factor list fails your purpose.

  **Triage Summary:**
  *   **Genuine & Non-Negotiable:** 1, 2, 3, 4, 5, 6 (in principle), 7, 9, 10, 11, 12.
  *   **Useful Heuristic (Negotiable):** 8 (Reverse-Narration Test). Omitting weakens bias detection but doesn't cripple purpose.
  *   **Distinct:** 1 (Erasure) and 8 (Reverse-Narration) target different biases (evidence weighting vs. narrative structure). 12 (Anti-Deflation) is essential, not preference.
  *   **Missing:** **Mechanism Robustness:** Requirement to assess if proposed causal mechanism is consistent with established social/behavioral theory (reduces reliance on case-specific storytelling). *Motivation:* Increases confidence that the explanation isn't entirely idiosyncratic and might hold in L.

  ---

  ### Conflicts and Tradeoffs

  1.  **Narrative Unity vs. Conjunctive Transparency & Contingency Mapping (4, 2 vs. 12):** A causally unified narrative (12) inherently risks smoothing over the inherent contingency and joint improbability highlighted by 2 and 4. A theory satisfying 12 *and* rigorously implementing 2/4 will likely produce narratives that feel less "seamless" and more explicitly probabilistic/fragmented. **Tradeoff:** Inescapable. A unified explanation *must* transparently display contingency points to be useful prospectively, even if it disrupts narrative flow.
  2.  **Evidence-Base Endogeneity Correction (6) vs. Outcome-Independent Support (1):** Diagnosing *how* O shaped the evidence (6) often *requires* knowledge of O, potentially contaminating the process of assigning evidential weight independently of O (1). **Conflict:** Fundamental tension. **Resolution:** The theory must demand *explicit acknowledgment* of this tension and provide *procedures* (e.g., searching for "shadow" evidence, counterfactual archiving analysis) to mitigate it, recognizing perfect neutrality is unattainable. Satisfaction is partial and requires methodological humility.
  3.  **Discriminatory Power (5) vs. Single-Case Focus:** Rigorous negative control testing (5) inherently requires looking beyond the single case C, potentially conflicting with deeply idiographic approaches. **Conflict:** Manageable. The theory must require seeking relevant analogues/comparators for testing, even if imperfect.

  **Overall Satisfiability:** The list (especially 1, 2, 3, 4, 5, 6, 9, 10, 11, 12 + Mechanism Robustness) is **extremely demanding but not logically impossible**. A theory satisfying all would be exceptionally robust. However, practical application will involve tradeoffs (especially regarding 6) and require high methodological rigor. Failure likely stems from inadequate methodological development or case limitations, not logical impossibility.

  **Strongest Weaker Purpose:** If the demands prove too high empirically, retreat to: **Generating structured, contingency-sensitive *heuristics* and identifying *critical junctures/mechanisms* from C to inform *questions to ask* and *risks to monitor* in L, with explicit caveats about confidence levels, evidence limitations, and transferability boundaries.** Stop claiming that retrospective explanations can provide strong *predictive* evidence for analogues; emphasize their role in structuring *prospective inquiry* and risk assessment.

  ---

  ### Most Binding Requirement

  **11. Transferability Specification (Transport License)** is the most binding. It forces the theory to confront the fundamental challenge of generalization from the unique. It excludes:
  *   **Purely idiographic narratives:** Rich stories about C offer no guidance for L.
  *   **Overly general covering laws:** Fail to specify *which* aspects of C are relevant.
  *   **Vague counterfactuals:** "If X hadn't happened..." doesn't specify if X is relevant/possible in L.
  *   **Factor lists without causal logic:** Don't specify *how* factors combine/interact in ways transferable to L's dynamics.
  It compels the theory to bridge the particular and the general explicitly, directly serving your prospective purpose. A theory lacking this fails your core objective.

  ---

  ### Scorecard: Approach Families vs. Desiderata (FCC Anchor)

  | Approach                  | Key Strengths                          | Key Weaknesses vs. Desiderata                                     |
  | :------------------------ | :------------------------------------- | :---------------------------------------------------------------- |
  | **Covering-Law / Statistical** | 3 (Base-Rate), 5 (Discrimination)      | **Fails:** 11 (Transfer Spec - too abstract), 12 (Anti-Deflation - factor lists), 2 (Contingency), 4 (Conjunctive), 7 (Grain), 9 (Non-events). *Struggles:* 1 (Outcome-blind), 6 (Evidence Endogeneity). |
  | **Mechanism / Process-Tracing** | 1 (Outcome-blind*), 2 (Contingency), 4 (Conjunctive), 7 (Grain), 9 (Non-events), 12 (Causal Unity) | **Fails:** 3 (Reference Class - often idiographic), 11 (Transfer Spec - often implicit). *Struggles:* 5 (Discrimination - needs comparators), 6 (Evidence Endogeneity - hard to correct), 10 (Falsifiability - often flexible). |
  | **Counterfactual Difference-Making** | 2 (Contingency), 4 (Conjunctive*), 9 (Non-events), 5 (Discrimination*) | **Fails:** 12 (Anti-Deflation - often fragmented), 11 (Transfer Spec - focuses on C's specifics). *Struggles:* 1 (Outcome-blind - O defines the CF), 3 (Reference Class), 6 (Evidence Endogeneity), 7 (Grain). |
  | **Narrativist**           | 12 (Causal Unity - story as explanation) | **Fails:** 1 (Outcome-blind), 2 (Contingency - often implies inevitability), 3 (Reference Class), 4 (Conjunctive), 5 (Discrimination), 6 (Evidence Endogeneity), 7 (Grain), 9 (Non-events), 10 (Falsifiability), 11 (Transfer Spec). |

  *(\* = Potential strength, highly dependent on specific implementation)*

  **Conclusion:** No approach naturally satisfies all desiderata. Mechanism/Process-Tracing comes closest on causal explanation (1,2,4,7,9,12) but falters on calibration/transfer (3,5,6,10,11). A hybrid theory incorporating elements of mechanism tracing, structured contingency mapping, reference-class anchoring, and explicit transfer protocols is needed to meet your ambitious purpose.
