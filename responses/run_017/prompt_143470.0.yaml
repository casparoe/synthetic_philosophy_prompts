  ## MEMO: Recommendation on Early-Alert Vendor Contract Renewal

  **To:** Committee on Student Success Analytics
  **From:** [Your Name/Position]
  **Date:** October 26, 2023
  **Subject:** Recommendation on Early-Alert Vendor Contract Renewal (Pilot: 2021-2023 Cohorts)

  **Recommendation:** Renew the contract for **one additional year (covering the 2024 entry cohort) under strict conditions**, contingent on implementing a rigorous evaluation framework designed to isolate model performance and assess generalizability in the new operational context. Failure to meet these conditions by specified deadlines should trigger automatic non-renewal.

  **Rationale:**

  Our pilot demonstrated technical feasibility and promising *historical* performance (AUC ~0.83, Precision ~0.4). However, significant limitations prevent us from confidently projecting this performance onto the fundamentally altered 2024 cohort and beyond (test-optional admissions, expanded online/hybrid, tripled bridge program). Critically, the pooled cross-validation method did not test generalization to unseen cohorts, and the lack of a control group makes it impossible to disentangle the model's predictive power from the effectiveness of the intervention (success coach calls). Philosophical arguments about induction (Hume's Problem) and the No-Free-Lunch theorems underscore the conditional nature of our evidence: past success suggests capability but guarantees nothing about the future under changed conditions.

  Renewal solely based on historical CV results risks significant resource misallocation ($190k ≈ 2 FTE success coaches) if the model fails to generalize. Conversely, abandoning the system outright forfeits potential benefits without conclusive evidence of failure and ignores that *inaction* also carries risks (missed opportunities to support at-risk students). A conditional renewal allows us to gather the necessary evidence for a definitive decision next year while continuing support for the current cohort under closer scrutiny.

  **Essential Conditions for Renewal:**

  1.  **Temporal Hold-Out Validation (Immediate):**
      *   **Action:** The vendor must score the *existing model* (trained on 2021-2023 data) on the *entire 2024 entry cohort* **without any retraining or updating** using this cohort's data. This must be completed and results delivered within 4 weeks of the start of the Spring 2024 term.
      *   **Verification:** University IT/Data Governance will oversee data transfer integrity. The committee receives the raw prediction scores and final persistence outcomes (after the add/drop period of Fall 2025) for independent analysis.
      *   **Metrics:** Performance must be evaluated using pre-registered metrics: **AUC, Precision (PPV) at the *previously used operating threshold*, Recall (Sensitivity), Specificity, and F1 Score.** The primary focus is AUC and Precision compared to the pilot's CV estimates.

  2.  **Staged Rollout with Randomized Control Group (For 2024 Cohort Intervention):**
      *   **Action:** For the 2024 cohort, flagged students identified by the *existing model* (scored per Condition 1) will be **randomly assigned** to one of two groups:
          *   **Intervention Group (e.g., 80%):** Receive the standard success coach outreach call immediately.
          *   **Control Group (e.g., 20%):** Receive **no outreach based on the early-alert flag** during the pilot period (Fall 2024 - Spring 2025). *Crucially:* These students remain eligible for *all other standard support services* (academic advising, tutoring, mental health, etc.). They can also self-refer or be referred by faculty/staff via existing channels. This isolates the *incremental* effect of the *model-triggered call*.
      *   **Rationale:** This design allows us to:
          *   Measure the true Precision (PPV) of the model *without* the confounding effect of the intervention (by comparing Control Group outcomes).
          *   Estimate the causal impact of the success coach call on persistence for flagged students (by comparing Intervention vs. Control Group outcomes).
          *   Measure the False Negative Rate *with* the model (by examining outcomes of unflagged students).
      *   **Verification:** Randomization logs and coach assignment records will be audited by the committee. The Institutional Research office will track persistence outcomes for all groups.

  3.  **Benchmarking Against Counselor Judgment:**
      *   **Action:** Concurrently with the model's flagging (early Fall 2024), a representative sample of success coaches/advisors (e.g., 10-15) will be asked to independently review de-identified profiles of the *entire 2024 cohort* (or a large random sample) and flag students *they* judge as high risk of non-return, **without using the model output**. Their unaided predictions will be scored against the same persistence outcome.
      *   **Verification:** The committee will design the survey instrument, anonymize data, collect predictions, and score performance (using the same metrics as Condition 1) for comparison against the vendor model and simple baselines (e.g., high school GPA threshold).

  4.  **Equity Audit:**
      *   **Action:** Performance metrics (AUC, Precision, Recall, FPR) from the Temporal Hold-Out (Condition 1) and Counselor Judgment (Condition 3) must be disaggregated and reported for key subgroups: **Test-Submitters vs. Test-Optional Admits, Online/Hybrid Enrollees vs. Fully On-Campus, Bridge Program Participants vs. Non-Participants, First-Generation Status, Underrepresented Minority Status (as defined by IR), Pell Grant Eligibility.** Significant disparities (e.g., FPR differentials > X%) require analysis and a mitigation plan from the vendor.
      *   **Verification:** IR will conduct the disaggregated analysis using the hold-out predictions and outcomes.

  5.  **Sunset Date & Renewal Criteria:**
      *   The contract renewal is valid **only for the 2024 cohort intervention and evaluation**.
      *   **Final Recommendation:** Based on the results of Conditions 1-4 (available after Fall 2025 persistence data is finalized), the committee will make a final recommendation on long-term adoption or termination by [Date, e.g., May 1, 2025].
      *   **Key Criteria for Future Renewal:** Evidence of generalizability (Temporal Hold-Out AUC/Precision close to pilot levels), clear incremental value over counselor judgment or simpler heuristics, acceptable equity profile, and a demonstrated positive causal impact of the intervention (via the RCT). The cost-effectiveness relative to hiring 2 FTE coaches will be reassessed using the causal impact estimate.

  **Addressing Concerns & Counterarguments:**

  *   **"NFL Means Use the Cheapest (Counselor Judgment)":** This is a profound misreading. NFL states all algorithms are equal *only* when averaged over every conceivable universe. In *our* specific, structured reality, some predictors demonstrably outperform others (e.g., GPA predicts success better than coin flips). Counselor judgment is an untested algorithm with unknown, likely variable, and uncalibrated performance. Condition 3 provides the necessary empirical comparison *for our context*. NFL undercuts the *assumption* that unaided judgment is a neutral baseline; it needs validation too.
  *   **"Three Years Proof is Enough":** While the pilot shows past capability, the changes in 2024 create a genuine "shift in the domain" (test-optional, online growth, bridge expansion). Pooled CV does not test this shift. Relying solely on it ignores Hume's problem of induction – the future may not resemble the past. Condition 1 directly tests generalizability.
  *   **"Withholding Intervention is Unethical":** This is a serious concern. The staged rollout mitigates this by:
      *   Limiting the control group size (e.g., 20% of flagged students).
      *   Ensuring control group students retain access to *all other university support services*. We are only withholding the *specific, model-triggered success coach call*.
      *   The potential knowledge gain directly informs future, more effective, and equitable resource allocation, ultimately benefiting more students. The risk to the control group is judged minimal compared to the risk of scaling an unproven system or abandoning a potentially effective tool.
  *   **"Just Make the Calls Anyway (Low Cost/Low Harm)":** This is the strongest argument for unconditional renewal. Even with low precision, a supportive, non-coercive phone call might be beneficial and is relatively low-cost. *However*, the $190k price tag *is* significant (equivalent to 2 coaches). If the model lacks predictive value or targets the wrong students (poor equity), those resources could be better deployed (e.g., hiring more coaches for broader outreach, targeted support for known vulnerable groups like the expanded bridge cohort). Renewing without conditions risks locking us into an expensive system with unknown efficacy and potential biases. Our conditional renewal *allows the calls to continue* for most flagged students while gathering the evidence needed to justify the *continued investment* or reallocate funds more effectively.

  **Conclusion:**

  The pilot yielded suggestive but inconclusive evidence due to methodological limitations and impending contextual shifts. NFL cautions against assuming universality but does not invalidate empirical results; the problem of induction demands humility about projecting the past. Renewing unconditionally risks substantial resources on an unproven tool in a changed environment. Letting the contract lapse risks abandoning a potentially valuable system without a fair test. **Conditional renewal** provides the responsible path forward: it continues support for the 2024 cohort while mandating the rigorous evaluation needed to answer critical questions about generalizability, causal impact, equity, and comparative value. We must know if this tool genuinely helps us identify and support students at risk in our *current* reality before committing long-term. I urge the committee to endorse this structured, evidence-based approach.

  **Strongest Argument for Unconditional Renewal (Addressed Honestly):**

  The most compelling case for simply renewing is the argument that the outreach phone call itself is a relatively low-cost, non-coercive, and potentially beneficial intervention. Even if the model's precision is modest (identifying only 2 in 5 truly at-risk students among those flagged), making supportive contact with those students might still yield positive outcomes – building connection, identifying other needs, or simply demonstrating care – regardless of whether they were *truly* at imminent risk of departure. The marginal cost of scaling the existing system is lower than setup, and deliberately withholding this outreach from a control group, however small and however well-supported otherwise, *does* feel ethically uncomfortable. It prioritizes clean measurement over providing a potentially helpful interaction immediately to all flagged students. If one firmly believes the call is inherently beneficial and harmless, then maximizing its reach now, even based on imperfect historical validation, could be seen as the more student-centered choice, accepting the risk that the $190k might be spent sub-optimally compared to alternative support structures. The symmetry of NFL *does* cut both ways: if we demand incontrovertible proof for the vendor model, we must equally acknowledge we lack proof that counselor judgment or simpler rules would perform better in this new environment, and delaying action has its own opportunity cost.
