prompt: |-
  hey — i run the AI club at my school and i said id do a 25 minute session next week on whether we should build AI systems to reason like utilitarians or like deontologists. the room will be about half people whove never done any philosophy and half kids who code and who will definately have opinions about reward functions. i dont need you to explain the topic to me, i need a plan for how to explain it to them.

  concretely: what has to come first, and why, given that im pretty sure theyll hear the question as just the trolley problem with robots in it and miss whats actually at stake. i was going to hang the whole thing on one example — an AI that decides which students get the handful of free counseling slots, since it can compare people in ways a human counselor couldnt — but tell me if thats the right carrier and what a carrier example here has to have and has to not have. misconceptions im expecting: the coders will think any agent maximizing a utility function already is a utilitarian, the others will hear deontology as hard-coded rules like asimovs laws, and somebody will say why not just let it calculate consequences and bolt on a few rights. where in the sequence do i head each of those off? also my friend says the interesting argument for rules isnt that deontology is true but that rules are what you want in a system whose reasoning nobody can fully audit — i cant tell if thats deep or if it just changes the subject, so if its worth keeping, where does it go?

  and give me one question i can ask at the end that would show me they actually got it rather than just picked a side, plus what i should flat out refuse to get into at this level.
reasoning: |-
  Okay, the user runs an AI club and needs a 25-minute session plan on whether AI should reason like utilitarians or deontologists. They have a mixed audience: half with no philosophy background, half coders who know about reward functions. The main challenge is avoiding the trolley problem trap and addressing misconceptions.

  First, I need to set up the session so it's accessible but still substantive. Starting with their counseling slots example makes sense because it's relatable and avoids sci-fi distractions. The example needs to show concrete trade-offs without being too emotionally charged. Counseling slots work because it involves limited resources and personal impact, which students can grasp.

  The coders might equate utility functions with utilitarianism. That’s a key misconception to tackle early. I should clarify that utilitarianism is a specific ethical framework, not just any optimization. For deontology, the non-coders might think of Asimov's laws, so distinguishing between rigid rules and ethical principles is important. 

  The friend’s point about auditability is actually crucial. It shifts the discussion from pure ethics to practical AI design. That should come after explaining the core concepts, maybe as a bridge to the deeper implications. It shows that even if deontology isn’t "true," rules might be necessary for transparency.

  For the closing question, something that forces them to apply both frameworks to a new scenario would reveal understanding. Asking them to design a system's objective function for a healthcare triage AI, specifying which approach it uses and why, would test if they grasp the trade-offs.

  Time management is tight. I’ll structure the session in phases: hook, core concepts, application, auditability, and wrap-up. Each phase needs to be concise. Avoiding rabbit holes like metaethics or technical implementations is essential. Also, keeping the counseling example central maintains focus.

  Potential pitfalls include the coders dominating the conversation with technical details. Setting ground rules about philosophy-first discussion can help. Also, preempting the "bolt on rights" idea by explaining integrated vs. add-on approaches during the application phase.

  The user’s deeper need is likely fostering critical thinking about AI ethics beyond hype. They want students to see the real stakes in system design, not just debate hypotheticals. Emphasizing the counseling example’s real-world implications meets that need. Making the auditability point shows how theoretical ethics impact practical deployability.
answer: |-
  Here’s a battle-tested 25-minute plan designed to cut through misconceptions and spotlight what’s *actually* at stake, using your counseling slots example brilliantly. It targets your predicted misunderstandings head-on and leverages the coder/non-coder mix.

  **Core Structure & Why:**

  1.  **Hook: The Counseling Slots Dilemma (3 mins)**
      *   **Present:** "Our school has an AI allocating 5 counseling slots/week. It sees everything: grades, social media, health data, family income. Its job? Maximize overall student mental health. Who gets the slots?"
      *   **Concrete Choice:** Show two scenarios:
          *   *Scenario A:* AI gives slots to students statistically *most likely to improve quickly* (high utility per session, maximizing total "improvement points").
          *   *Scenario B:* AI gives slots to students in *most acute crisis right now* (prioritizing urgent need, regardless of predicted outcome).
      *   **Why First?** Instantly grounds the abstract in a relatable, non-trolley problem. Shows *consequential* focus (A) vs. *duty/rules* focus (B). Avoids robots killing people.

  2.  **Label the Lenses: Utilitarianism vs. Deontology (5 mins)**
      *   **Utilitarianism (Simplified):** "The *best action* is the one that leads to the *best overall consequences* (e.g., highest total mental health improvement). It *calculates outcomes*."
      *   **Deontology (Simplified):** "Some actions are *right or wrong in themselves*, regardless of consequences. We have *duties* (e.g., help the most vulnerable first) or *rights* (e.g., everyone deserves equal consideration) that constrain our choices."
      *   **Crucial Clarifications (Head Off Misconceptions Here!):**
          *   **To Coders:** "Reward functions maximize *something*, but Utilitarianism is about maximizing *overall well-being/happiness*. Huge difference! Maximizing clicks ≠ maximizing well-being. What *is* the 'utility' we're defining?"
          *   **To Non-Coders:** "Deontology isn't just 'Don't Kill Robots' rules. It's about fundamental principles like fairness, rights, or duties baked into the *reasoning*, not just bolt-ons. Think *why* a rule exists." (Mention Asimov only to say "It's *like* that, but deeper – about the *why* behind rules").

  3.  **Apply to Counseling AI: The Stakes (7 mins)**
      *   **Utilitarian Approach:** AI predicts outcomes relentlessly. Maybe denies slots to chronically ill students (low predicted improvement) to help mildly anxious high achievers (high predicted gain). *Stakes:* Efficiency vs. fairness? Sacrificing individuals for the greater good? What if predictions are biased?
      *   **Deontological Approach:** AI follows rules like "Prioritize highest acute need" or "Never deny based on predicted future outcome." *Stakes:* Might miss chances to prevent future crises? What if rules conflict? ("Acute need" vs. "Equal chance")? Can rules handle complex reality?
      *   **Head Off "Bolt-On Rights":** "Some say 'Why not just maximize utility but add rules like 'Don't discriminate'?' *This is critical:* Is the rule an *external constraint* (like a filter on outputs) or baked into the *core reasoning*? A constrained optimizer still fundamentally *wants* to violate the rule if it could! A deontological reasoner sees the rule as *inherently right*." (Use a quick analogy: Speed limit sign vs. internal belief speeding is wrong).

  4.  **The Auditability Bomb: Your Friend's Point (5 mins)**
      *   **Introduce:** "Here's a *practical* argument, beyond philosophy: **Can we trust the AI's reasoning?**"
      *   **Utilitarian Problem:** Complex consequence calculations are often black boxes. *How* did it weigh factors? Was it biased? Why did Student X get denied? Opaque optimization is hard to audit.
      *   **Deontological Advantage:** Rule-based reasoning is (often) easier to trace. "Denied because not in acute crisis (Rule 1)" is clearer than "Denied because predicted improvement score was 0.2 below threshold based on 37 factors." *Stakes:* Trust, accountability, debugging bias, explaining decisions to humans.
      *   **Why Here?** Deepens the discussion beyond "which is true?" to "which is *deployable*?" Connects philosophy to real-world AI safety concerns. **It doesn't change the subject; it shows WHY the philosophical choice has real-world engineering consequences.** This is gold for the coders.

  5.  **Wrap-Up & The Killer Question (5 mins)**
      *   **Reiterate Core Tension:** Utilitarianism = Power of Optimization vs. Risk of Unfairness/Opacity. Deontology = Clarity/Rights Protection vs. Risk of Rigidity/Suboptimal Outcomes.
      *   **The Revealing Question:** "**For the counseling AI, if we discovered its core reasoning prioritized students from wealthier neighborhoods because they had *slightly* higher predicted long-term success rates (boosting the 'overall improvement' metric), would this be:**"
          *   **(A) A straightforward failure of the Utilitarian approach (it optimized the wrong thing)?**
          *   **(B) An inevitable risk of *any* consequence-maximizing system?**
          *   **(C) Something a well-designed Deontological system would be *more likely* to avoid? Why?**
          *   **(D) Something that could happen *regardless* of the approach if the system isn't designed carefully? Explain."**
      *   **Why it works:** It forces them to apply *both* frameworks. (A) & (B) probe understanding of Utilitarian pitfalls (defining utility, bias). (C) probes the deontological promise (rule against discrimination). (D) checks for nuance – both need good design. The *explanation* reveals depth.

  **What to FLAT-OUT Refuse to Get Into:**

  1.  **Metaethics:** "Is utilitarianism *actually* true?" "Are rights real?" Stay focused on *design implications*.
  2.  **Trolley Problem Debates:** Shut down any "But what about killing one to save five?" instantly. "That's a classic, but today we're focused on the *structure of reasoning* in real-world resource allocation like counseling. The trolley problem often obscures the core differences we're exploring."
  3.  **Technical Implementation Details:** Don't dive into neural net architectures or specific RL algorithms. Keep it at the level of objective functions (reward maximization) vs. rule-based reasoning/logic engines.
  4.  **Pure Preference Arguments:** "Deontology feels nicer." Focus on *consequences* of each approach (fairness, efficiency, transparency, potential harms).
  5.  **Hybrids (beyond the 'bolt-on' clarification):** Briefly acknowledge they exist, but don't get bogged down. The point is to understand the *core* paradigms first.

  **Why Your Counseling Example is Perfect:**

  *   **Relatable & Non-Hypothetical:** Students immediately grasp the stakes.
  *   **Avoids Sci-Fi/Death:** Focuses on allocation, not harm, preventing trolley-problem distraction.
  *   **Highlights Trade-offs:** Clearly shows efficiency vs. fairness/rights, predictability vs. adaptability.
  *   **Reveals Opacity:** Easy to see how a "maximizer" could become a black box.
  *   **Scalable:** The principles apply directly to loans, healthcare, parole, etc.

  **Execution Tip:** Be ruthless with time. Use clear slides with minimal text (just key phrases: "Maximize Total Good", "Follow Core Rules", "Auditability Matters"). Let the discussion flow within the structured segments, but don't be afraid to gently cut off tangents with "That's a great point for later, but let's focus on X for now to stay on track." Good luck – this is a fantastic topic!
