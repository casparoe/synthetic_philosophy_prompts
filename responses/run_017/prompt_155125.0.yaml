  The poem must build tension through repetition and shifting contexts. Stanza 1 introduces the words neutrally. Later stanzas create relational clusters: "salt" and "glass" might suggest preservation or fragility; "knee" and "cloth" could imply friction or support. The tornada should crystallize a sense of interdependence—e.g., "knee" and "flint" evoking strain through juxtaposition alone.

  After the poem, the analysis must argue that the feeling of meaning arises from relational coherence, not external grounding. This supports the "thin meaning" side of the debate. I'll highlight how the sestina's structure mirrors Vantu's closed system: both force meaning to emerge internally. The Vantu case innovates by stripping away even the sealed-room's implied rules, making inferential bonds the sole scaffold for meaning. This pressures critics who insist on external anchors, showing relational networks can generate semantic weight independently. The poem's success as art becomes evidence—not just rhetoric—for this view.
