  We are going to design a scenario that meets all the specifications. The setting is a medical clinic.

  **Story: Diagnostic Test for a Rare Disease**

  Dr. Lee is trying to diagnose a patient for a rare disease H (Hypothesis: the patient has the disease). The disease is rare: the base rate in the patient's demographic is known to be exactly 1%. However, the patient has a particular symptom that is sometimes associated with the disease. The symptom can also occur for other reasons. The clinic uses a test (the experiment) that can come out positive (+) or negative (-). The test is known to be very good but not perfect. However, the exact performance of the test is uncertain because the test was recently developed and the clinic has only limited data.

  Specifically, the test was calibrated on two separate studies:

  - Study A: 100 patients with the disease, 95 tested positive (so sensitivity = 95%).
  - Study B: 100 patients without the disease, 90 tested negative (so specificity = 90%).

  But there is a problem: the clinic does not know whether the test's performance in these studies generalizes to the current patient. The patient's symptom might be due to a condition that affects the test's accuracy. The clinic's expert panel has reviewed the evidence and concluded that the test's sensitivity could be as low as 85% or as high as 95%, and its specificity could be as low as 80% or as high as 90%. Moreover, the panel believes that the true sensitivity and specificity are independent in the sense that any combination within these ranges is possible.

  Therefore, the agent (Dr. Lee) has the following information:

  - Base rate of H (disease): P(H) = 0.01 (fixed, known from demographics).
  - Sensitivity (P(+ | H)): can be any value in [0.85, 0.95].
  - Specificity (P(- | not H)): can be any value in [0.80, 0.90]. Therefore, P(+ | not H) = 1 - specificity is in [0.10, 0.20].

  The credal set is the set of all probability measures consistent with:
    P(H) = 0.01
    P(+ | H) ∈ [0.85, 0.95]
    P(- | not H) ∈ [0.80, 0.90]   [so P(+ | not H) ∈ [0.10, 0.20]]

  Note: The agent is uncertain about the test's accuracy (sensitivity and specificity) and not just the base rate. The base rate is fixed.

  We now compute the prior interval for H. Actually, the prior for H is fixed at 0.01, so the prior interval is [0.01, 0.01] (a point). This meets specification 2 (narrow, in fact a point).

  Next, we compute the posterior for H after seeing a positive test and after seeing a negative test.

  Let:
    H: disease present (P(H)=0.01)
    not H: disease absent (P(not H)=0.99)

  For a given sensitivity (s) and specificity (t), we have:
    P(+ | H) = s
    P(+ | not H) = 1 - t

  After a positive test (+), by Bayes' theorem:

    P(H | +) = P(+ | H) * P(H) / [P(+ | H)*P(H) + P(+ | not H)*P(not H)]
              = (s * 0.01) / (s * 0.01 + (1-t) * 0.99)

  Similarly, after a negative test (-):

    P(H | -) = P(- | H) * P(H) / [P(- | H)*P(H) + P(- | not H)*P(not H)]
              = ((1-s) * 0.01) / ((1-s)*0.01 + t * 0.99)

  We now find the range of P(H|+) as s varies in [0.85, 0.95] and t varies in [0.80, 0.90] (so 1-t varies in [0.10, 0.20]).

  Similarly for P(H|-).

  **Posterior after positive test:**

  We want the min and max of:
    f(s, 1-t) = (0.01 * s) / (0.01*s + 0.99*(1-t))

  Since the numerator is increasing in s and the denominator is increasing in s and in (1-t), we expect:

  - The minimum of f occurs when s is minimized and (1-t) is maximized (i.e., t minimized) because that makes the denominator large and the numerator small.
  - The maximum of f occurs when s is maximized and (1-t) is minimized (i.e., t maximized).

  So:
    min P(H|+) = f(0.85, 0.20) = (0.01*0.85) / (0.01*0.85 + 0.99*0.20) = 0.0085 / (0.0085 + 0.198) = 0.0085 / 0.2065 ≈ 0.04116
    max P(H|+) = f(0.95, 0.10) = (0.01*0.95) / (0.01*0.95 + 0.99*0.10) = 0.0095 / (0.0095 + 0.099) = 0.0095 / 0.1085 ≈ 0.08756

  So the posterior interval after a positive test is about [0.041, 0.088] (rounded to 3 decimals).

  But note: the prior is 0.01, so the posterior after positive test is at least 0.041 and at most 0.088. The interval is [0.041, 0.088] which is wider than the prior (which is a point). However, we require dilation: the posterior interval should be strictly wider at both ends. The prior is 0.01, which is less than 0.041? Actually, 0.01 is less than 0.041, so the lower bound increased and the upper bound increased. But we require the interval to become wider in the sense of having a lower lower bound and a higher upper bound? That is not the case here: the lower bound went from 0.01 to 0.041 (higher) and the upper bound went from 0.01 to 0.088 (higher). So the interval is entirely above the prior and is wider? But note: the prior is a point, so the posterior interval is [0.041, 0.088] which is about 0.047 wide, while the prior is 0 wide. However, we require the posterior interval to be strictly wider at both ends. The prior point is 0.01. The posterior interval does not extend below 0.01. So we don't have dilation in the sense of the interval becoming "fatter" on both sides.

