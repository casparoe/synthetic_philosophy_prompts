  Therefore, we must adjust the parameters.

  We need the posterior after some outcome to have a lower bound below the prior and an upper bound above the prior. In our case, after a positive test, the posterior is always above the prior (because a positive test is evidence for the disease). Similarly, after a negative test, we expect the posterior to be below the prior.

  So let's compute after a negative test.

  **Posterior after negative test:**

    P(H|-) = [ (1-s) * 0.01 ] / [ (1-s)*0.01 + t * 0.99 ]

  We want min and max of this.

  The function g(s, t) = (0.01*(1-s)) / (0.01*(1-s) + 0.99*t)

  - The numerator decreases as s increases.
  - The denominator: as s increases, (1-s) decreases, so the numerator decreases and the first term in the denominator decreases, but the second term (0.99*t) is fixed for a given t. So the fraction might be decreasing in s. Also, as t increases, the denominator increases.

