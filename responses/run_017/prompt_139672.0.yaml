  - \(P(S \mid \neg H) \in [0.1, 0.3]\) (symptom prevalence if \(H\) is false).  

  **Acts**: Dr. Lee must choose one action after seeing the test result:  
  - \(A_1\): Aggressive treatment (effective if \(H\) is true). Pays 1 if \(H\), 0 otherwise.  
  - \(A_2\): Conservative treatment (effective if \(H\) is false). Pays 1 if \(\neg H\), 0 otherwise.  
  - \(A_3\): Standard care. Pays 0.35 regardless of \(H\).  

