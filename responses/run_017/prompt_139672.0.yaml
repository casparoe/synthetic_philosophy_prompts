    → Sharp Bayesian *always* prefers seeing the result.  

  #### 4. **No Single Prior Dilation**
  For any sharp prior in \(\mathcal{C}\) (e.g., \(P(E \mid H)=0.5\), \(P(E \mid \neg H)=0.5\)):  
  - Posterior: \(P(H \mid E) = 0.5 / (0.5 + 0.5) = 0.5\), \(P(H \mid \neg E) = 0.5\).  
  - No dilation (interval remains \([0.5, 0.5]\)).  
  Dilation only arises from the *disagreement* across priors.  

  ---

  ### Diagnosis: What Drives the Effect?
  - **Key structural feature**: Priors in \(\mathcal{C}\) disagree on the *likelihood ratio* \(P(E \mid H)/P(E \mid \neg H)\), but agree on the prior \(P(H)\).  
    - Here, likelihood ratios range from \(0.4/0.6 \approx 0.67\) to \(0.6/0.4 = 1.5\).  
    - This causes the posterior to "fan out" around the prior.  
  - **Remove disagreement**: Fix the likelihood ratio (e.g., assume studies agree \(P(E \mid H)=0.5\), \(P(E \mid \neg H)=0.5\)).  
    - Credal set collapses; no dilation.  
    - Decision anomaly vanishes: After data, \(P(H \mid E)=0.5\), so maximin still prefers \(A_1/A_2\) (EU=0.5 > 0.45).  

  ---

  ### Response: Defending Imprecise Probabilities
  - **Typical defense**: Surrender the decision rule (maximin after conditioning), not the representation.  
  - **Alternative rules**:  
    - **Maximality**: Choose acts not strictly dominated. After data, \(A_1\) and \(A_2\) are not dominated by \(A_3\) (e.g., if \(P(H \mid \text{data})=0.6\), \(A_1\) beats \(A_3\)). Maximin anomaly avoided, but the rule is permissive (may not select a unique act).  
    - **Ex-ante planning**: Commit to a strategy (e.g., "if \(E\), choose \(A_1\); if \(\neg E\), choose \(A_2\)"). Min EU is 0.5 (same as pre-experiment maximin), avoiding the anomaly.  
  - **Cost**:  
    - Maximality: Too weak for decisive choice.  
    - Ex-ante planning: Loses flexibility to adapt to information.  
  - **Where this leaves the argument**: The dilation is inherent to the representation, but decision-rule changes can avoid *exploitable* incoherence. Critics argue this undermines the motivation for imprecise probabilities (if agents must use non-standard rules to avoid pitfalls).  

  ---

  ### Short Items
  1. **Sure-loss sequence**: Not possible. To force a sure loss, a bookie would need to buy/sell bets before and after the experiment, but:  
     - Pre-experiment, the agent values the risky acts at min EU=0.5.  
     - Post-experiment, they value them at min EU=0.4, but do not accept new bets on them (they choose \(A_3\)). No arbitrage arises.  
  2. **Hardest specification**: Jointly achieving **robust dilation** (spec 3) and a **narrow prior** (spec 2). Trade-off:  
     - Narrow priors require precise base rates (e.g., 50%), but dilation needs posteriors to straddle the prior.  
     - Solution: Use a 50% prior and symmetric likelihood uncertainty, ensuring dilation under all outcomes.
