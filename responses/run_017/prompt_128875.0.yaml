answer: |-
  Here's the menu of distinct readings for "if you don't vote, you can't complain," assessed for substance and engagement with pivot probability:

  1.  **Standing/Forfeiture:** By abstaining, you voluntarily waived your moral standing to object to the outcome. **Verdict:** Substantive & defensible (relies on participation as a prerequisite for protest). **Engagement:** Routes around pivot probability; focuses on prior commitment, not causal impact.
  2.  **Fair Play / No Free-Riding:** You benefit from the democratic system (stability, legitimacy, policy outputs) produced by others' participation; abstaining while complaining is free-riding. **Verdict:** Substantive & defensible (core to civic republicanism). **Engagement:** Routes around pivot probability; focuses on duty to contribute to collective goods, regardless of individual marginal effect.
  3.  **Expressive Consistency:** Complaining expresses dissatisfaction with the outcome, while abstaining expresses indifference or lack of concern; the acts are inconsistent. **Verdict:** Substantive & defensible (hypocrisy norm). **Engagement:** Routes around pivot probability; focuses on symbolic meaning of actions, not causal efficacy.
  4.  **Generalization ("What if everyone?"):** If everyone reasoned like you (abstaining because pivot chance is low), the system would collapse or produce terrible outcomes; your obligation stems from this universalization. **Verdict:** Substantive but *dies* to pivot probability; the paradox shows universal abstention *is* caused by everyone thinking *their* vote lacks pivot power, making the "what if" directly relevant but highlighting the coordination failure. **Engagement:** Directly engages but is fatally undermined by pivot logic (abstention *is* the result of universalizing low pivot probability).
  5.  **Consent / Lottery-Acceptance:** By choosing not to participate, you implicitly accept any outcome, like skipping a raffle and then objecting to the winner. **Verdict:** Weak/False; voting isn't a lottery ticket purchase, and abstention isn't affirmative consent to results. **Engagement:** Engages weakly; pivot probability undermines the "lottery chance" analogy.
  6.  **Epistemic:** People who don't vote likely lack sufficient engagement/knowledge to form valid complaints. **Verdict:** Descriptive, often false (many abstain for complex reasons, some voters are uninformed). **Engagement:** Routes around pivot probability; focuses on complainant's legitimacy, not vote's impact.
  7.  **Descriptive/Social Norm:** Society views non-voters as having less legitimate complaints; complaining without voting invites social sanction or being ignored. **Verdict:** Trivially true (it describes the norm enforcing the phrase). **Engagement:** Routes around pivot probability; it's about social consequence, not causal logic.

  **The "Voted For Her" Wrinkle:**
  There is likely *no single principle* generating "can't complain if you didn't vote," "can't complain if you voted for her," and "can't complain because you participated." The first targets non-contribution, the second targets responsibility for choice, and the third targets endorsement of the system. The tension suggests the phrase functions primarily as a **social tool to license blame and police participation** ("team signaling") rather than stating a precise, consistent moral norm. Different arguments are deployed situationally to silence dissent.

  **What Your Friend Likely Meant:**
  Your friend almost certainly meant **#2 (Fair Play / No Free-Riding)** – the civic republican view that participation is a duty owed to the cooperative project of democracy, and abstaining while benefiting is illegitimate free-riding. This is the core argument routing around pivot probability.

  **Confidence:**
  *Overall Confidence:* High for most verdicts (grounded in political philosophy/common discourse).
  *Least Confident Verdict:* #5 (Consent/Lottery) - While weak, the *feeling* of having forfeited a "say" by abstaining is pervasive, making it a common intuition even if philosophically shaky.
