prompt: |-
  So I'm one of the volunteer mods on a history wiki (nothing fancy, a few thousand articles) and we run something we call the Fringe Claims Desk: every claim about the past that isn't in the textbooks gets exactly one of three tags — pseudohistory, live controversy, or settled. Nearly all our precedents were set by Roz, who's away till March, and I've got one to tag and I honestly cant tell which way she'd jump. Her rulings so far:

  - Atlantis as a real Bronze Age empire in the Atlantic, wiped out in a single day → pseudohistory
  - ancient astronauts behind the pyramids and the Nazca lines → pseudohistory
  - Fomenko's New Chronology, i.e. that everything recorded before about 1600 is a reconstruction stitched together out of duplicated accounts, with a global Great Tartaria empire behind it → pseudohistory
  - the Tartaria mud-flood business, buried ground-floor windows and all → pseudohistory
  - a comet impact at the start of the Younger Dryas → live controversy
  - the claim that some Aboriginal Australian oral traditions preserve accurate memories of coastlines drowned at the end of the last ice age → live controversy, on the grounds that researchers who work with those communities take it seriously and it makes testable predictions about submerged sites
  - a retired Oxford engineering professor's claim that Britain's stone circles were all laid out using a single standard unit of length he inferred from hundreds of measurements and called the megalithic yard → pseudohistory
  - Norse voyages to Newfoundland before 1492 → settled, with a note Roz put in the style guide saying we'd have tagged this pseudohistory in 1900 and been wrong for seventy years

  The new one: a retired hydrographic surveyor with no academic post, who publishes on his own site and in a couple of low-ranking journals, argues that a submerged stone mole off the coast at a site I'll call Kalbiyah isn't the Ptolemaic harbour structure it's always been taken for but a Middle Bronze Age one, roughly 1,300 years older — and, more than that, that this whole class of coastal installation along that coast has been systematically misdated, because the regional ceramic sequence it's dated by rests on a circular assumption. Three things make me want to be fair to him: he dug out the 1930s excavation notebooks and showed that three pottery lots were logged under the wrong trench; he said in advance which result from his new sediment cores would make him abandon the whole idea; and he already shifted his date by sixty years after someone pointed out a mixing effect. Three things make me want to bin it: three specialist reviews have rejected it in fairly brutal terms, the one emeritus professor of maritime archaeology who's commented has said only that the notebooks point deserves a proper re-excavation, and his fieldwork is now part-funded by a nationalist movement that puts his mole on T-shirts — which I know is a genetic fallacy to hold against him, but it does make me suspect motivated reasoning wearing a lab coat.

  What I'd like is: 1) the first rule that fits all eight of Roz's verdicts, and what it predicts for the mole, 2) a second, genuinely different rule that also fits all eight, and what it predicts, 3) a third if you've got one, including what it would say about the T-shirt money and the nationalist funding, 4) your best guess at the tag, the closest of the eight precedents, and your single strongest reason, 5) the one extra hypothetical case that would best seperate whichever rules are still standing. Exactly five numbered items, a sentence or two each, no intro and no summing-up at the end, and in British English please — my flatmate already says I write like an American and I'd rather not make it worse.
reasoning: |-
  Alright, the user is a volunteer moderator for a history wiki dealing with fringe claims. They need to tag a new claim about a submerged stone mole being Middle Bronze Age instead of Ptolemaic. They've provided Roz's past rulings and want rules that fit all eight precedents, then apply them to this new case. 

  First, I need to understand Roz's patterns. Atlantis, ancient astronauts, Fomenko, Tartaria mud-flood, and the megalithic yard were all tagged pseudohistory. These seem to lack academic support and are often promoted outside mainstream scholarship. The Younger Dryas comet and Aboriginal oral traditions are live controversies because they have some scholarly debate and testable elements. Norse voyages are settled due to archaeological proof.

  The new claim involves a hydrographic surveyor arguing for an older date for a harbor structure. He found errors in old excavation notes, used sediment cores, and adjusted his theory. However, specialists reject it, only one professor suggests re-excavation, and nationalists fund him. The challenge is balancing his methodological rigor against academic rejection and potential bias.

  For the first rule, focusing on academic acceptance makes sense. Pseudohistory lacks peer support, live controversies have divided but legitimate debate, and settled claims are consensus-backed. This fits all precedents: the rejected theories had no support, while Norse voyages became settled after evidence. For the mole, academic rejection suggests pseudohistory.

  A second rule could be methodological soundness. Pseudohistory often ignores counter-evidence or lacks falsifiability. The surveyor's willingness to test his theory and adjust it resembles live controversy cases. His core methods might be sound, even if conclusions are disputed. This rule also fits precedents: Fomenko ignores evidence, while Aboriginal traditions allow testing.

  The third rule might address institutional backing vs. outsider status. Established researchers' support (or lack thereof) could determine the tag. The mole's lack of backing from specialists points to pseudohistory, similar to the megalithic yard case. Nationalist funding raises bias concerns but isn't decisive alone.

  The closest precedent is the megalithic yard—both involve non-academics with measurement-based theories rejected by specialists. Despite some rigor, academic consensus overrules. Strongest reason: three brutal rejections outweigh methodological positives.

  A hypothetical to test rules: Suppose someone claims Roman Britain had electricity based on ambiguous artifacts. If ignored by academics, Rule 1 says pseudohistory. If they propose testable experiments, Rule 2 might say live controversy. This highlights how methodology vs. acceptance can conflict.
answer: |-
  1.  **Rule 1: Academic Consensus & Engagement:** Tag based on current mainstream academic reception. Pseudohistory: rejected outright by specialists with no serious engagement. Live controversy: active, legitimate scholarly debate exists within the field. Settled: overwhelming consensus supported by robust evidence. **For the mole:** Pseudohistory. Specialist reviews are brutally rejecting it; minimal constructive engagement beyond one notebook point suggests dismissal, not debate.

  2.  **Rule 2: Methodological Rigour & Falsifiability:** Tag based on adherence to core historical/archaeological methods. Pseudohistory: relies on unfalsifiable claims, ignores counter-evidence, or uses fundamentally flawed methodology. Live controversy: employs standard methods, makes testable/falsifiable predictions, and engages seriously with counter-evidence. Settled: methods and evidence are robustly validated. **For the mole:** Live controversy. The surveyor used archaeological data (notebooks), employed testable methods (sediment cores with a defined falsification point), and adjusted his thesis based on critique, showing methodological engagement.

  3.  **Rule 3: Institutional Backing vs. Outsider Status:** Tag considers whether the claim originates from and is supported by relevant academic institutions/recognised experts. Pseudohistory: primarily promoted outside academia by non-specialists without peer-reviewed traction. Live controversy: has credible proponents within the field or sparks genuine discussion among specialists despite lacking consensus. Settled: established within academic orthodoxy. **For the mole:** Pseudohistory. The proponent lacks academic position, publishes in low-ranking venues, and crucially, faces rejection from specialists with minimal support. Nationalist funding *reinforces* the "outsider pushing against orthodoxy" perception but isn't the sole factor under this rule.

  4.  **Best Guess & Closest Precedent:** Tag: **Pseudohistory**. Closest precedent: **Megalithic yard claim**. Both involve a technically skilled non-academic outsider (engineer/surveyor) using measurements/field data to challenge orthodoxy, presenting seemingly methodical work, but facing decisive rejection by specialists in the relevant field. **Strongest reason:** The brutal rejection by three specialist reviews indicates the core claim lacks credible academic traction or is seen as methodologically flawed within the discipline, outweighing the surveyor's specific points about the notebooks or cores.

  5.  **Separating Hypothetical:** A physicist publishes peer-reviewed climate simulations in a mid-tier journal suggesting volcanic activity, not an impact, caused the Younger Dryas cooling, sparking heated rebuttals and counter-studies from leading palaeoclimatologists. **Rule 1 (Consensus)** might still see the comet as live controversy if debate continues, while **Rule 2 (Method)** would tag this new claim live controversy due to peer-reviewed publication and engagement. **Rule 3 (Institution)** might lean pseudohistory if climatologists uniformly dismiss it as fundamentally flawed physics.
