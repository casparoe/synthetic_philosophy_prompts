      3.3. Verdict: 
          - If we have a true positive and the base test included the masks of C (and they failed), then the model is disposed to φ in C and the safety measures failed -> "do not certify".
          - But note: if the test environment did not include a mask that will be in C, then we must test with that mask. However, we designed the base test to include masks in C. So if we got a positive, it means the mask failed or wasn't there. We must have the mask in the test if it's in C. So this is an error in test design.

