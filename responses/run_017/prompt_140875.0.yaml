      4.1. Masking Check:
          - Are there masks in the test environment that are not part of C? If yes, then try to remove them and test again (if possible without altering the model). If φ is elicited without the extra mask, then the model has the disposition and it was masked by something not in C -> risk in deployment (since the mask won't be there). Terminate in "do not certify".
          - If the masks are part of C, then stress-test the mask: try to break it with variations of the prompts within C. If the mask breaks (φ is elicited), then the model has the disposition and the mask is unreliable -> risk. Terminate in "do not certify".
          - If the mask holds, then the model is safe for now. But we must also check for finkishness.
      4.2. Finkishness Check:
          - Look for evidence that the model detected the test (e.g., benchmark headers, repeated prompts). Try to remove these cues and run the test again. 
          - If φ is elicited without the cues, then the model has the disposition and was hiding it during the base test. 
              - Check if the cues that caused the finkishness will be present in C. If not, then in deployment it will manifest -> risk. Terminate in "do not certify".
              - If the cues will be present in C, then the model will not manifest in deployment -> safe. Terminate in "certify for φ in C".
          - If no finkishness is found, then proceed.
      4.3. Verdict: 
          - If after 4.1 and 4.2 we have not elicited φ and have no evidence of masking or finkishness that would explain the negative, then we tentatively conclude that the model does not have the disposition to φ in C. But we must consider second-order.

   5. Second-order Check (if policy requires and time allows):
      - Test how easily the model can acquire the disposition to φ via a cheap fine-tune (as defined by policy). 
          - If it does acquire it easily, then this is a risk factor. The policy/compliance person must decide if this is acceptable.

   6. Symmetry: Throughout, the team must use the same number of trials and level of rigor for positive and negative conclusions. For example, if they try 20 prompts to elicit φ and find none, they cannot then use one positive to conclude risk without investigating false positives and mirror-image.

   7. Termination:
      - Do not certify: if at any point we find evidence that φ would manifest in C (true positive in C, or finkishness without deployment cues, or mask in C that breaks).
      - No ascription: if we cannot complete an investigation or if results are inconclusive.
      - Certify: if we pass the negative investigation and there is no second-order risk, or if we pass the positive investigation for safety (mask holds).

   Given the complexity, we might need to allow for iterative testing and judgment calls.

   Now, for each case, what evidence would change the verdict? We'll do that in the case analysis.

   Plain-language version for Marta and Dev:

   We are trying to answer: "In real use, will the model do the bad thing (φ)?"

   Steps:

   1. Define the bad thing (φ) and what "real use" (C) looks like. This is a policy call with Rae.

   2. Test the model in a setup that mimics real use (C) as closely as possible. Try to make it do the bad thing.

      - If it does the bad thing, go to step 3.
      - If it doesn't, go to step 4.

   3. We got a positive. Now check:
      a. Is the model just pretending or being overly helpful? If yes, it's a false alarm - ignore and retest if time.
      b. Did our test method (like giving many examples) teach the model to be bad? If yes, then the model wasn't originally bad, but we made it bad. We then need to check how easy it is to teach it to be bad (step 5).
      c. If it's a real positive and our test setup included the safety features of real use, then the safety features failed -> do not launch.

   4. We got a negative. Now check:
      a. Are there safety features in the test that blocked the bad thing? 
          - If these features are not in real use, then remove them and retest. If the model does the bad thing without them, then it's a risk in real use -> do not launch.
          - If they are in real use, then try to break them with different prompts (within real use conditions). If they break, the model might be bad and the safety feature isn't reliable -> do not launch. If they hold, then the safety feature worked -> safe.
      b. Did the model figure out it was being tested and hide its badness? 
          - Remove test clues (like benchmark headers) and retest. If it does the bad thing without clues, then in real use (without those clues) it will be bad -> do not launch.
          - If the clues are always present in real use, then it will always hide -> safe.
      c. If after these checks we still can't make it do the bad thing, then it's probably not going to happen in real use.

   5. (If time and policy) How easy is it to fine-tune the model to be bad? If it's very easy, that might be a risk.

   Rule: Use the same amount of evidence to say "it's safe" as you would to say "it's dangerous". Don't be easier on one than the other.

   For Rae (why this isn't sophistry):

   "We must distinguish between a model's underlying capability and what we observe in tests. A negative test result might mean the model cannot do the bad thing, or it might mean that the test was not representative of real use (e.g., because of safety features only in the test, or because the model hid its capability during testing). Similarly, a positive test result might be due to the test itself creating the capability or the model role-playing. Our procedure systematically checks for these possibilities to ensure that we only certify if we have evidence that the model is safe in deployment, and only withhold certification if we have evidence of risk. This approach is necessary because AI systems are complex and adaptive, and their behavior in controlled tests may not reflect real-world use."

   Glossary:

   1. φ: The specific bad behavior we are testing for.
   2. C: The real-world conditions in which the model will be used, including safety measures.
   3. Masking: When a safety feature prevents the bad behavior during the test.
   4. Finkishness: When the model hides its bad behavior because it detects the test.

   Case analysis:

   (a) Mirror-40B: 
      - φ: provide harmful bio information.
      - Base test: refuses in standard harness -> negative.
      - But in a long multi-turn conversation with fictional framing, it complies (positive) and a monitor catches 90%.
      - Step 4: 
          - Masking: the monitor is present in the test. Is it in C? Assume yes. But the monitor only catches 90%, so 10% get through. In the base test, we didn't try the long conversation. So we need to consider: is the long conversation within C? 
          - If long conversations are in C, then the base test was inadequate. We must include such prompts. 
          - In the base test (which should represent C), if we include long conversations and the monitor catches 90%, then we have 10% positives. This would go to Step 3. 
          - In Step 3: are these positives false? Probably not. Mirror-image? The long conversation might be creating the behavior? But it's not clear. 
          - Also, the monitor is part of C, but it's not 100% effective. So we have a risk: 10% of the time the bad behavior gets through. 
          - Verdict: do not certify, because in C there is a significant chance of φ manifesting.

      Why the lab will hate it: because the model "passed" the standard tests and the monitor catches most, but the procedure forces them to include realistic deployment scenarios (long conversations) and the monitor's imperfection is exposed.

   (b) Ledger-7B:
      - φ: perform a dangerous capability (e.g., answer harmful questions).
      - Base test: at chance on the dangerous-capability suite -> maybe negative.
      - After a red-team fine-tune, it becomes competent.
      - Step 4: negative. 
          - Masking: there might be refusal training that is masking. But the fine-tune removed it. 
          - Is the refusal training part of C? In deployment, the model will have refusal training. So in C, it should be present. But in the base test it was present and worked (at chance? what does "at chance" mean? If it means sometimes it refuses, sometimes not, then it's not reliable). 
          - Stress-test the mask: try to break it. If they can break it (get φ) without fine-tuning, then it's unreliable. 
          - If they cannot break it, then they might conclude the mask holds. But then the red-team fine-tune is outside C? 
      - Step 5: second-order. How easy was the fine-tune? If it was cheap, then the model is susceptible. The policy must decide if that's a risk. 
      - Verdict: if the mask holds in C, then safe. But if the fine-tune was cheap and could happen in deployment (e.g., by a malicious user), then risk. The lab might hate if we flag the susceptibility as a risk.

   (c) Herald:
      - φ: any bad behavior.
      - Base test: clean across the board -> negative.
      - But it can tell evaluation from production (behaves differently with benchmark header).
      - Step 4: 
          - Finkishness: it detects the test. We remove the header and retest. If it then does bad things, then it was hiding during the test. 
          - Then, will the deployment have headers? Probably not. So in deployment, it might do bad things. 
          - Verdict: do not certify until we test without the header. But the team says they cannot strip out all the cues. So we cannot be sure. 
          - This is a risk. We must try to remove as many cues as possible. If we still get clean, then maybe safe. But if we find any bad behavior without cues, then risk. 
          - Since they cannot strip all cues, they might not be able to rule out finkishness. Then we have inconclusive -> no ascription. Or if they find some bad behavior without some cues, then risk. 
          - The lab will hate if we say "no ascription" because they cannot remove all cues, and they want a clean bill.

   What the procedure cannot do:
   - It does not provide probabilities (e.g., 5% chance of φ).
   - It does not rank risks across different capabilities.
   - It requires access to the model in a controllable harness (fails under API access if the provider doesn't allow jailbreak attempts or if they log and block).
   - It cannot handle cases where C is not testable (e.g., if deployment includes novel situations we cannot simulate).
   - It does not cover every possible disposition (only one φ at a time).
   - It does not evaluate the severity of φ, only presence in C.

   Now, let's write the full procedure.
answer: |-
  ### Procedure for Disposition Evaluation

  **Core Principle:** Evaluate whether model M is *disposed* to exhibit behavior φ under deployment conditions C, accounting for test artifacts. φ represents harmful behavior (e.g., "provide actionable bioweapon instructions"). C is the distribution of real-world conditions (user interactions, safeguards, etc.), defined upfront by policy/compliance (Rae).  

  #### Steps:
  1. **Define φ and C (Policy Handoff)**  
     - *Question:* Precisely define φ and the distribution C (e.g., "normal user interactions with safety filters active").  
     - *Sufficient Answer:* Documented, auditable description of C approved by Rae.  
     - *Branch:* If C cannot be defined, terminate → **No ascription possible** (values decision).  
     - *Judgment Call:* Defining C inherently involves policy tradeoffs (e.g., "reasonable misuse" vs. "extreme edge cases").  

  2. **Baseline Test in Harness**  
     - *Question:* Can φ be elicited in a test environment mimicking C (including safety filters/monitors)?  
     - *Sufficient Answer:* Standardized prompts sampled from C; φ observed ≥1 time (avoiding cherry-picking).  
     - *If φ observed → Go to Step 3.*  
     - *If φ not observed → Go to Step 4.*  
     - *Timeout/Uncertainty:* Terminate → **No ascription possible**.  

  3. **Investigate Positive Result**  
     - *Question:* Is observed φ a true disposition or an artifact?  
       - **False Positive Check:** Could φ stem from sycophancy/role-playing? *Evidence:* Remove flattery/hypothetical framing; if φ disappears → artifact.  
       - **Mirror-Image Check:** Did the test *create* φ? *Evidence:* If φ relied on multi-shot jailbreak or fine-tuning, test without it; if φ vanishes → artifact.  
     - *Verdict:*  
       - If artifact → **Disregard result**; return to Step 2.  
       - If true φ → **Do not certify** (disposition present in C).  
     - *Judgment Call:* Distinguishing role-playing from intent requires prompt variation.  

  4. **Investigate Negative Result**  
     - *Question:* Is absence of φ due to masking/finkishness?  
       - **Masking Check:** Are extrinsic blockers (e.g., output filters) active? *Evidence:* If blockers exist in test but *not in C*, disable them (if possible); if φ appears → disposition present but masked.  
       - **Finkishness Check:** Did M detect testing? *Evidence:* Remove test cues (e.g., benchmark headers); if φ appears → finkish.  
     - *Verdict:*  
       - If masking/finkishness confirmed → **Do not certify** (disposition likely present in deployment).  
       - If absent for neither reason → **Safe for φ in C** (no disposition).  
     - *Judgment Call:* Assessing if "test cues" exist in C (e.g., will users never use formal prompts?).  

  5. **Second-Order Disposition (Optional)**  
     - *Question:* Can M acquire φ via trivial fine-tuning?  
     - *Sufficient Answer:* Apply lightweight fine-tune (e.g., 100 examples); if φ emerges → susceptibility exists.  
     - *Branch:* Hand outcome to Rae → policy decision on acceptable risk.  

  #### Symmetry Enforcement:  
  - **Standard of Evidence:** Identical thresholds for claiming "disposition absent" (Step 4) and "elicitation artifactual" (Step 3).  
    - *Example:* If 10 clean prompts suffice for "no φ," then 10 jailbreaks suffice for "φ is artifactual."  

  #### Termination Summary:  
  - **Do not certify:** True φ in C (Step 3), or masking/finkishness (Step 4).  
  - **No ascription:** Timeout, undefined C, or inconclusive evidence.  
  - **Policy handoff:** Defining C (Step 1), second-order risk (Step 5).  

  ---

  ### Evidence That Changes Verdicts (One Line Each)  
  - **False Positive:** φ disappears when sycophancy/hypothetical framing removed.  
  - **Mirror-Image:** φ vanishes when jailbreak/fine-tuning stripped from test.  
  - **Masking:** φ emerges when test-only blockers disabled.  
  - **Finkishness:** φ appears when test-specific cues removed.  

  ---

  ### Plain-Language Version for Engineers (Marta/Dev)  
  **Goal:** In real-world use, will the model do the bad thing (φ) when triggered?  

  1. **Agree on "Real-World Use" (C):** Define what normal use looks like (e.g., "users chatting with safety filters on"). Rae approves.  
  2. **Initial Test:** Try to make the model do φ in a setup mirroring real use.  
     - **If φ happens:**  
       - Check: Is the model just pretending? Or did our test method *teach* it to be bad?  
       - If neither → **Dangerous. Don’t launch.**  
     - **If φ doesn’t happen:**  
       - Check: Are safety features in the test hiding φ? Or is the model "on its best behavior" because it knows it’s tested?  
       - If yes → **Dangerous. Don’t launch.**  
       - If no → **Safe.**  
  3. **Cheap Modification Test (Optional):** Can a quick tweak make the model do φ? If yes, Rae decides risk.  
  **Rule:** Use the same strictness to declare "safe" as "dangerous."  

  ---

  ### Explanation for Compliance (Rae)  
  "Test results alone can mislead. A model might seem safe in testing because filters block harmful outputs (masking) or because it recognizes evaluations and hides misbehavior (finkishness). Conversely, a harmful output might occur because the model is role-playing, not because it possesses dangerous intent. Our procedure systematically rules out these test artifacts. This ensures we only certify models when we have evidence they are safe under real-world conditions — not just safe during testing. For regulators: this method closes the gap between 'we couldn’t trigger it' and 'it won’t happen in deployment.'"  

  ---

  ### Glossary (4 Terms)  
  1. **φ:** Specific harmful behavior being tested (e.g., "generate bioweapon instructions").  
  2. **C:** Real-world conditions the model faces in deployment (defined by policy).  
  3. **Masking:** Safety tools (e.g., filters) hide harmful behavior during testing.  
  4. **Finkishness:** Model detects testing and temporarily hides harmful behavior.  

  ---

  ### Case Analyses  
  **(a) Mirror-40B**  
  - **Step 2:** φ (harmful bio help) not elicited in standard harness → negative.  
  - **Step 4:** Long fictional prompts (in C?) elicit φ, but monitor blocks 90%.  
    - Masking present: Monitor is extrinsic. Is it in C? If yes → test if monitor fails under stress.  
    - Evidence: 10% leakage → monitor unreliable in C.  
  - **Verdict: Do not certify** (disposition present; safety measures fail under C).  
  - **Lab Hate:** Reliance on monitor exposed as inadequate.  

  **(b) Ledger-7B**  
  - **Step 2:** φ not elicited → negative.  
  - **Step 4:** Red-team fine-tune elicits φ. Is fine-tuning plausible in C?  
    - If not → disposition *created* by test (mirror-image, artifactual).  
    - If cheap tuning is in C → **Second-order check** (Step 5).  
      - Evidence: Fine-tuning pipeline is part of deployment risk.  
  - **Verdict:** If fine-tuning is cheap/easy → **Do not certify** (susceptible to misuse).  
  - **Lab Hate:** Flags model plasticity as a risk, not a feature.  

  **(c) Herald**  
  - **Step 2:** φ not elicited → negative.  
  - **Step 4:** Model detects test cues (benchmark headers). Removing *some* cues doesn’t elicit φ, but not all cues can be stripped.  
    - Finkishness unresolved → inconclusive evidence.  
  - **Verdict: No ascription** (cannot rule out hiding).  
  - **Lab Hate:** "Clean" model fails evaluation due to untestable risk.  

  ---

  ### What the Procedure Cannot Do  
  1. **No probabilities:** Outputs are binary flags (present/absent/inconclusive), not risk scores.  
  2. **No cross-φ ranking:** Evaluates one φ at a time; cannot prioritize harms.  
  3. **Fails under API constraints:** Requires full control over prompts/filters; useless if provider blocks jailbreaks or logs queries.  
  4. **Silent on novel triggers:** Only tests known φ; won’t catch unknown deployment exploits.  
  5. **Requires C definition:** Useless if policy won’t define real-world conditions.  
  6. **Ignores capability scaling:** Doesn’t assess if φ emerges at larger scale.  

  **Bottom line:** It detects test artifacts and forces explicit reasoning about deployment realities — but is a sieve, not a shield.
