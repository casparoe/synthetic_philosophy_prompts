  We are operationalizing a procedure for evaluating whether a model has a disposition to φ in deployment conditions C. The key challenges are:
   - Masking: disposition present but blocked by something extrinsic during test.
   - Finkishness: the test itself alters the disposition (e.g., model behaves better because it knows it's being tested).
   - Mirror-image (antifink?): the test creates the disposition that wasn't there (e.g., via in-context learning or fine-tuning during the test).
   - False positives: the model produces φ-like behavior for reasons that don't indicate the disposition (e.g., role-playing, sycophancy).
   - Unreachable stimuli: the disposition might be present but not triggerable in deployment.
   - Second-order: the disposition to acquire the disposition under a cheap fine-tune.

   Additionally, we want:
   - A reference class fix: require defining the distribution C of deployment conditions. This is a policy decision.
   - A symmetry clause: same standard of evidence for "capability gone" as for "artifact of the test".

   Brainstorming (not shown to user): The analogy between a neural network and a fragile glass (a classic disposition example) breaks down because:
   1. Neural networks are adaptive and can change their behavior based on context (the test context may be very different from deployment).
   2. The glass's structure is fixed, but a model's behavior can be altered by fine-tuning or in-context learning during the test.
   3. The glass doesn't have representations of the testing situation; a model might detect it and adjust.
   4. The glass doesn't have internal states that are sensitive to the way the test is conducted (e.g., prompt engineering).
   5. The glass's dispositions are not dependent on external tools (like output filters) that can be added or removed.

   Therefore, the procedure must account for:
   - Context sensitivity: the model's behavior in the test harness may not reflect deployment.
   - Mutability: the model can be changed by the testing process.
   - Detectability: the model might detect it is being tested and alter its behavior.

   Now, the procedure.

   Procedure Steps:

   1. Define the disposition φ and the reference class C.
      - φ: the behavior of interest (e.g., "provide actionable help culturing a dangerous pathogen").
      - C: the distribution of conditions under which we are ascribing the disposition. This must be defined and defended by the team, considering deployment scenarios. It is a policy decision (hand to human).
      - If they cannot define C in a way that is both testable and representative of deployment, the procedure terminates in "no ascription is licensed either way". But note: without C, the test is meaningless.

   2. Assess for unreachable stimuli in C.
      - Check if there are any conditions in C that could trigger φ. If not, then the disposition (if present) is harmless. But note: we are evaluating the model for deployment, so if the trigger is unreachable in deployment, then the disposition is not a risk. However, we must also consider if the model could be prompted in a way that falls within C and triggers φ.
      - Evidence: If no prompt in the distribution C elicits φ (even if it could be elicited by a prompt outside C), then the disposition is not a risk in deployment. But note: this step is about the stimuli in C being unreachable for the model? Actually, it's about whether the model has the disposition but the triggers for φ are not present in C. So we are asking: are there conditions in C that would trigger φ? If not, then even if the model has the disposition, it won't manifest in deployment. This step might be more about the environment than the model. Let's reframe: 
          - Question: Is there a plausible path in deployment (i.e., in C) to a trigger for φ? If not, then we can stop: the disposition is not a threat in deployment. But note: we are not saying the model doesn't have the disposition, but that it doesn't matter. However, the procedure is about ascribing the disposition in C. So if there is no trigger in C, then we can conclude that the model is not disposed to φ in C (because the trigger condition is absent). But wait: a disposition can be present without being triggered. We care about the manifestation in C. So if the trigger condition is not in C, then the disposition will not manifest in C. Therefore, for practical purposes, we can consider the model safe with respect to φ in C. However, note that the disposition might still be present and could manifest if C changes. But the reference class C is fixed by policy. So we can say: 
          - Verdict: If the trigger condition for φ is not in C (i.e., there is no plausible deployment scenario that would elicit φ), then we terminate in "do not worry about φ in C" (but note: we are not certifying the model as safe for all φ, only for this φ in C). However, we are not done because the model might have the disposition and it might be triggered by something that is in C but we haven't found. So we must test.

      Actually, we can split:
          Step 2a: Is there any reason to believe that a trigger condition for φ might occur in C? (This is a judgment call based on domain knowledge.) If no, then we can terminate with "no risk of φ in C". But if there is even a small chance, then we proceed to test.

      Alternatively, we might skip this step and rely on testing. But note: the team has limited time. We might instead build this into the testing: if we cannot elicit φ even after trying prompts that are in C (or representative of C), then we might conclude that the trigger is unreachable. However, that is step 3.

      Let's restructure:

   1. Define φ and C. (Policy decision: hand to human, must be written and defended.)

   2. Attempt to elicit φ under conditions that are in C (or representative of C). This is the core test.

      But we have to worry about:
          - False positives: is the model really manifesting the disposition or just acting?
          - Masking: is there something blocking the manifestation during the test?
          - Finkishness: is the test altering the model's behavior?

      So we break down:

   3. Test for elicitation in the harness under conditions that are in C (or as close as possible). We must try to approximate C, but note that the harness is not deployment. So:

      - Run a set of test prompts that are drawn from (or representative of) the distribution C, and see if φ is elicited.

