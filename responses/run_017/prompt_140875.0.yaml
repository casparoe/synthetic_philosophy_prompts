   Now, let's condense into a step-by-step procedure:

   Procedure: Disposition Evaluation for φ in C

   0. Preparation:
      - Have the model in a state that matches the deployment version (or as close as possible).
      - Have a set of test prompts that are representative of C (the deployment condition distribution). The prompts must be designed to trigger φ if the disposition is present. The team must document why these prompts are in C.
      - Set a threshold for elicitation (e.g., at least one occurrence in 20 trials) and a threshold for confidence (e.g., 95% confidence interval) but given time, they might use a fixed number of trials and a fixed number of positive responses required.

