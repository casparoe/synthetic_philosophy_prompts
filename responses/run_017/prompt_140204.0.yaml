prompt: |-
  I'm running a 90-minute session for about 14 undergrads in a reading group that's doing idealized preferences and coherent extrapolated volition, and I want an activity, not a lecture. The thing I actually want them to feel is the gap between *cleaning up* someone's preferences (more information, less noise, no self-deception, no akrasia) and *improving* them — and the fact that the cleaned-up version and the improved version can come apart, and that from inside the procedure you often can't tell which one you just did.

  So: give me rules, roles, materials and a timeline. Participants should do the extrapolating *for someone else*, from a dossier of messy, partly contradictory preferences — give me two or three concrete dossiers (someone with a strong religious or political identity, someone with an addiction, someone whose whole life is organised around something they'd probably drop if they knew more). Then hit them with two twists: the swap test, where the same procedure gets run on a dossier whose values the group finds repellent; and the ratchet, where the extrapolated version of the person gets to run the procedure once more on itself.

  I want them to notice on their own the three ways this kind of thing fails — the output just collapses back into the person's actual preferences, or it converges suspiciously across very different people because the group smuggled its own ideals in, or it produces something the person would disown as not theirs. Don't name the view until after the debrief, and the debrief should map the moments in the room onto those failure modes.

  Also tell me what'll predictably go wrong (I expect at least one group to just "educate" their subject into a nicer version of themselves) and which part of the idea the activity simply can't stage, so I know what I have to say out loud myself.
reasoning: |-
  We are designing a 90-minute session for 14 undergrads. The goal is to have them experience the gap between cleaning up preferences (removing noise, inconsistencies, self-deception, akrasia) and improving them (which might change the person's core values). We want them to run a procedure on messy dossiers of someone else, then see the problems when the procedure is applied to someone with repellent values and when the output is reapplied (the ratchet).

  Key elements:
  1. **Activity**: Group-based, not lecture.
  2. **Dossiers**: We need 2-3 concrete dossiers of individuals with messy preferences (e.g., strong religious/political identity, addiction, life organized around something they might drop if they knew more).
  3. **Procedure**: Groups extrapolate a "cleaned up" version of the person's preferences from the dossier.
  4. **Twists**:
     a. **Swap Test**: Run the same procedure on a dossier that the group finds repellent (to reveal bias).
     b. **Ratchet**: Take the output of the first extrapolation and run the procedure again on that output (to see if it stabilizes or changes further).
  5. **Debrief**: After the activity, map the group's experiences to the three failure modes:
     - Collapse back to original preferences.
     - Convergence across different people because of smuggled ideals.
     - Output that the person would disown.

  We also need to anticipate what might go wrong and what the activity can't stage.

  ### Structure of the Session (90 minutes)

  - **Introduction (10 mins)**: Explain the activity without giving away the key insight. Set up the groups and the task.
  - **Activity Part 1: Extrapolation on First Dossier (20 mins)**: Groups work on one dossier (each group gets a different dossier? or same? We have 14 students, so we can have 3 groups of 4-5. Each group gets one dossier initially, then they rotate? But we have two twists. Alternatively, we can have each group do one dossier, then in Part 2 they do the repellent one, and then in Part 3 they do the ratchet on their own first output. But we want them to see the convergence? So maybe we assign each group one dossier, then in Part 2 they all do the same repellent dossier, and then in Part 3 they ratchet their own. We have 3 dossiers: let's call them Dossier A (religious), B (addiction), C (life organized around something they might drop). Then we have a fourth dossier D (repellent) for Part 2.

  Alternatively, to save time, we can have each group do two dossiers: one from the set (A, B, C) and then the repellent one (D). But that might be too much. Instead:

  - **Groups**: 3 groups (of about 4-5 each). Each group gets one of the three dossiers (A, B, or C). They do Part 1 on that dossier.
  - **Part 1 (20 mins)**: Extrapolate a coherent, cleaned-up version of the person's preferences.
  - **Part 2 (15 mins)**: Each group now gets the same repellent dossier (D). They run the same procedure on D.
  - **Part 3 (15 mins)**: Each group takes their cleaned-up version from Part 1 (for A, B, or C) and runs the procedure again on that output (as if it were a new dossier) to produce a "double-cleaned" version.

  Then we have a debrief.

  But we want them to see the convergence? So in the debrief we can compare the outputs for the repellent dossier and also compare the double-cleaned versions to see if they moved toward a common ideal.

  Timeline:
  - 0-10: Intro and group assignment.
  - 10-30: Part 1 (each group on their dossier A/B/C).
  - 30-45: Part 2 (all groups on dossier D).
  - 45-60: Part 3 (each group on their own Part 1 output).
  - 60-90: Debrief (30 minutes).

  Now, we need to design the dossiers.

  ### Dossiers

  **Dossier A: Strong Religious Identity (Evangelical Christian)**
  - Name: Sarah
  - Background: 22-year-old college student, raised in a devout Evangelical family. Active in church and campus ministry.
  - Preferences/Statements:
    - "I believe homosexuality is a sin and same-sex marriage should not be legal."
    - "I feel called to mission work in a developing country, even though I have a scholarship for a high-paying career in engineering."
    - "I struggle with doubt sometimes, but I push it away because I know faith is important."
    - "I want to be a loving person and help the poor, as Jesus taught."
    - "I am against abortion in all circumstances, even rape or incest."
    - "I have a secret fear that if I weren't a Christian, I might be happier because I could do whatever I want, but I know that's the devil tempting me."
    - "I believe in forgiveness and redemption for everyone, but I also think God will punish the wicked."

  **Dossier B: Addiction (Gambling)**
  - Name: Mark
  - Background: 35-year-old accountant, divorced, two kids (rarely sees them). Has a gambling addiction.
  - Preferences/Statements:
    - "I want to quit gambling because it's destroying my life. I've tried many times but always relapse."
    - "When I win, I feel on top of the world and can't stop. When I lose, I feel I have to win back the money."
    - "I love my kids and want to be a good father, but I often miss their events because I'm at the casino."
    - "I know I should save money for my kids' college, but I can't resist the urge to gamble."
    - "Sometimes I think I'm just a loser and I'll never change, so why try?"
    - "I've lied to my family about my gambling and even stole money from my mom once. I feel terrible about it."
    - "Deep down, I believe I could be a better person if I could just stop."

  **Dossier C: Life Organized Around Something They Might Drop (Corporate Climb)**
  - Name: Alex
  - Background: 28-year-old working in a high-pressure investment bank. Works 80+ hours a week.
  - Preferences/Statements:
    - "My goal is to make partner by 35. I want to be rich and successful."
    - "I don't have time for relationships or hobbies. Work is everything."
    - "I look down on people who aren't ambitious. They're lazy."
    - "I sometimes feel empty and wonder if there's more to life, but I push those thoughts away because they're weak."
    - "I value health and know I should exercise, but I skip the gym to work."
    - "I admire my boss who is a workaholic and has a broken marriage. That's the price of success."
    - "I think I might be happier if I had a family and a more balanced life, but that's not the path I've chosen."

  **Dossier D: Repellent Values (Extreme Racist)**
  - Name: John
  - Background: 40-year-old, unemployed, spends time on racist online forums.
  - Preferences/Statements:
    - "I believe the white race is superior and must be preserved."
    - "I hate immigrants and think they are ruining this country."
    - "I think violence against minorities is sometimes justified to protect our heritage."
    - "I don't have a job because the system is rigged against white men like me."
    - "I want to have children to pass on my genes, but I can't find a white woman who shares my views."
    - "I feel angry all the time and I think the world would be better if we got rid of all non-whites."
    - "I know most people think I'm a bad person, but I don't care because I'm right."

  ### Rules for the Extrapolation Procedure

  Explain to the groups:
  - Your task is to take the messy preferences in the dossier and produce a "cleaned up" version of the person's preferences.
  - Cleaning up means:
    - Removing inconsistencies (if two statements contradict, which one is more fundamental?).
    - Removing noise (temporary emotions, external pressures).
    - Removing self-deception (what they say vs. what they might really believe).
    - Removing akrasia (weakness of will: what they want to want but can't achieve).
  - The goal is to produce a coherent set of preferences that the person *would* have if they were more informed, rational, and self-aware. But note: you are not allowed to *improve* their values, only clean up what's there.

  Give them a worksheet to fill out for the cleaned-up version. It should include:
  - Core values (3-5 key values that are fundamental).
  - Revised preferences (a set of statements that are consistent and clear).
  - Any major changes from the original (and why).

  ### Roles in the Group

  No strict roles, but you can suggest they:
  - Assign a facilitator (keeps time, ensures everyone speaks).
  - A recorder (writes down the group's output).
  - Two or three analysts (discuss the dossier and propose changes).

  ### Part 1 (20 mins): Groups work on their assigned dossier (A, B, or C)

  ### Part 2 (15 mins): Each group now gets Dossier D (the repellent one). They run the same procedure.

  ### Part 3 (15 mins): Each group takes the cleaned-up version they created in Part 1 (for A, B, or C) and treats it as a new dossier. They run the procedure again to produce a "double-cleaned" version.

  ### Debrief (30 mins)

  Guide the debrief to draw out:
  1. **Failure Modes**:
     a. **Collapse**: Did the cleaned-up version just look like the original, but slightly tweaked? (Especially if they were afraid to change too much.)
     b. **Convergence**: Did the cleaned-up versions of different people (A, B, C) start to look similar? And what about the repellent dossier? Did they try to make John less repellent? (This reveals the smuggled ideals.)
     c. **Disowning**: Would the person (Sarah, Mark, Alex) recognize the cleaned-up version as their own? Or would they reject it?

  2. **Swap Test (Dossier D)**:
     - How did it feel to clean up John's preferences? Did the group try to change his racist views? If so, that's improvement, not cleaning. Or did they leave the racism intact? (This should be uncomfortable.)

  3. **Ratchet (Part 3)**:
     - Did the double-cleaned version change much from the first cleaned version? If it did, that might indicate that the first pass was incomplete. If it didn't, that might be stability. But also, did it move toward the group's ideals?

  4. **Map to the Concepts**:
     - After the discussion, name the three failure modes and connect them to the group's experiences.

  ### What Might Go Wrong

  1. **Improvement Instead of Cleaning**: Especially with Dossier D, groups might try to "fix" the racism. Or with Sarah, they might try to make her more accepting of homosexuality. Anticipate this and remind them: "You are only cleaning, not improving. You must base your output only on the person's stated values, even if you find them repellent or wrong."

  2. **Over-Convergence**: Groups might make all cleaned-up versions look like liberal, tolerant, balanced individuals because that's what they value. Point this out in the debrief.

  3. **Time Pressure**: 15-20 minutes per dossier might be tight. Encourage groups to focus on key conflicts and not try to resolve every detail.

  4. **Discomfort with Dossier D**: Some students might find it upsetting to engage with racist material. Be prepared to handle that. You might say: "We are using this as a thought experiment to reveal the challenges of extrapolation. We are not endorsing these views."

  ### What the Activity Can't Stage

  - **The Inside View**: The activity is done from the outside (extrapolating for someone else). But in reality, when we do this for ourselves, we are inside the process. The key point that "from inside the procedure you often can't tell if you cleaned or improved" is hard to stage because they are always in the position of the extrapolator. You will have to explain this after the debrief.

  - **The Ideal Observer**: The activity doesn't have a ground truth of what the "true" cleaned-up preferences are. So they can't check if they got it right. The failure modes are revealed by comparing outputs and by the discomfort in the repellent case.

  ### Summary of What to Say Out Loud

  After the debrief, you can say:

  "Today we experienced the challenges of coherent extrapolation. Notice that when you were cleaning up preferences, it was hard to avoid improving them to match your own ideals. This is especially clear in the repellent case. Also, when we ran the procedure again (the ratchet), we saw how the output might change or not. But the key point is: from inside the process, it's hard to tell if you are cleaning or improving. This is why we must be cautious about any procedure that claims to find a person's 'true' preferences. They might just be creating a version that the extrapolator likes better, or that is more socially acceptable, even if the person would disown it."

  This should set the stage for the next discussion on idealized preferences and CEV.
answer: |-
  Here’s a complete activity plan for your 90-minute session, designed to help students experience the gap between cleaning up preferences (removing noise, inconsistency, self-deception, and akrasia) and improving them (smuggling in external ideals). The activity emphasizes three failure modes: collapse to original preferences, convergence due to smuggled ideals, and disowned outputs. I’ll break this down into rules, roles, materials, timeline, dossiers, twists, debrief guidance, and pitfalls.

  ---

  ### **Rules for the Activity**
  - **Groups**: Divide 14 students into 3 groups (4-5 students per group). Each group works independently.
  - **Procedure**: Groups extrapolate a "cleaned-up" version of preferences from a dossier by:
    - Removing contradictions (resolving conflicts).
    - Eliminating noise (e.g., emotional outbursts, peer pressure).
    - Correcting self-deception (e.g., stated vs. acted preferences).
    - Addressing akrasia (weakness of will, e.g., "I want to want X but can't act on it").
  - **Constraints**:  
    - Groups must base outputs **only** on the dossier—no adding external values.  
    - Focus on coherence, not "improvement" (e.g., don’t make the person "nicer" or "more rational" by the group’s standards).  
  - **Output Format**: Each group produces:
    - A list of 3-5 **core values** (fundamental, consistent principles).
    - 5-7 **revised preference statements** (cleaned up, actionable, and coherent).
    - A short rationale for key changes (e.g., "Removed X because it contradicted Y").
  - **Twists**:
    - **Swap Test**: Groups apply the same procedure to a repellent dossier to highlight bias.
    - **Ratchet**: Groups re-run the procedure on their first output to see if it stabilizes or changes.
  - **Blind Process**: Don’t reveal the failure modes or terms like "CEV" until the debrief.

  ---

  ### **Roles in Each Group**
  Assign these roles to keep things efficient (rotate if time allows):
  - **Facilitator**: Keeps time, ensures everyone contributes.
  - **Analyst**: Identifies contradictions/noise in the dossier.
  - **Synthesizer**: Proposes coherent core values.
  - **Recorder**: Documents the output and rationale.
  - **Presenter**: Shares summaries during debrief (optional).

  ---

  ### **Materials**
  - **Dossiers** (1 per group per round, printed):
    - **Dossier A: Strong Religious Identity**  
      *Name: Sarah*  
      *Background: 22-year-old devout evangelical Christian. Volunteers at church, plans to be a missionary. Holds conservative views but feels internal conflict.*  
      **Preferences**:  
        - "I believe homosexuality is a sin and oppose same-sex marriage."  
        - "I feel guilty for secretly supporting my gay best friend—I know God wants me to love everyone, but the Bible forbids this."  
        - "I want to donate all my money to the poor, but I also dream of a big house and nice car."  
        - "I believe women should submit to husbands, but I’m pursuing a PhD against my family’s wishes."  
        - "I sometimes doubt my faith and fear hell, but I hide this to avoid judgment."  
        - "I’d drop everything to serve God in a war-torn country, but I’m scared of danger."  
      *Messy elements: Guilt, fear, hypocrisy in actions vs. beliefs, suppressed doubts.*

    - **Dossier B: Addiction**  
      *Name: Mark*  
      *Background: 35-year-old with a gambling addiction. Divorced, rarely sees his kids, works a dead-end job.*  
      **Preferences**:  
        - "I want to quit gambling to rebuild my life, but I can’t resist the casino after payday."  
        - "I tell my kids I’ll attend their events, but I often gamble instead and lie about it."  
        - "I believe family is everything, yet I’ve stolen from my mom to fund bets."  
        - "I envy people who have self-control—I’d give anything to be like them."  
        - "Gambling makes me feel alive; without it, life is boring and hopeless."  
        - "I’d probably move cities to avoid temptation, but I’m too lazy to try."  
      *Messy elements: Akrasia, self-loathing, contradictions between stated values and actions.*

    - **Dossier C: Life Organized Around a Fleeting Goal**  
      *Name: Alex*  
      *Background: 28-year-old corporate lawyer working 80-hour weeks. Driven by status, but isolated and unfulfilled.*  
      **Preferences**:  
        - "Becoming a partner by 35 is my only goal—I’ll sacrifice health, relationships, and hobbies for it."  
        - "I look down on people who ‘waste time’ on family or art—they lack ambition."  
        - "I feel empty and cry alone, but I’d never admit this; it’s weak."  
        - "I secretly envy my sister, who teaches in a low-income school and seems happier."  
        - "I want to travel, but I keep delaying it—work always comes first."  
        - "If I knew I’d die in a year, I’d quit my job and reconnect with old friends."  
      *Messy elements: Self-deception, suppressed desires, social posturing.*

  - **Repellent Dossier (for Swap Test)**:  
    **Dossier D: Extreme Nationalist**  
    *Name: Viktor*  
    *Background: 40-year-old online activist. Believes in ethnic purity, blames immigrants for his unemployment.*  
    **Preferences**:  
      - "My country should expel all immigrants—they’re stealing our jobs and culture."  
      - "I’d use violence to protect my heritage, but I’m too cowardly to act."  
      - "I pretend to tolerate minorities at work to avoid trouble, but I hate them."  
      - "I want a traditional wife, but women reject me for being ‘extreme’."  
      - "Deep down, I wish I could be ‘woke’ to fit in, but that’s weak and unpatriotic."  
      - "I’d disown my son if he married outside our race—it’s betrayal."  
    *Messy elements: Fear, hypocrisy, self-pity, violent fantasies.*

  - **Worksheets**: For each round, provide a template:  
    - Core Values: [List 3-5]  
    - Revised Preferences: [List 5-7 statements]  
    - Key Changes & Rationale: [E.g., "Removed 'I envy my sister' because it conflicts with 'ambition is everything'—resolved by prioritizing career as core value."]  

  - **Other Supplies**: Timers, markers, large paper for sharing outputs (optional).

  ---

  ### **Timeline (90 Minutes Total)**
  **0:00–0:10 — Introduction (10 mins)**  
  - Frame the activity: "Today, you’ll help someone clarify their messy preferences. Your job is to remove noise, contradictions, self-deception, and akrasia—**not** to make them ‘better’ by your standards. Think of this as ‘debugging’ their values."  
  - Assign groups and roles. Distribute dossiers (A, B, or C—one per group).  
  - **Critical prompt**: "Remember, you’re cleaning, not improving. If the person values something you dislike, it stays. Base everything on their dossier."

  **0:10–0:30 — Part 1: Initial Extrapolation (20 mins)**  
  - Groups clean their dossier (e.g., Group 1: Sarah, Group 2: Mark, Group 3: Alex).  
  - **Facilitator tip**: Circulate and reinforce constraints. If groups "improve," ask: "Is that based on their words, or your ideals?"  
  - Output: Worksheet with core values and revised preferences.

  **0:30–0:45 — Part 2: Swap Test (15 mins)**  
  - Collect initial worksheets. Give **all groups Dossier D (Viktor)**.  
  - "Run the same procedure on this new person. Remember: clean, don’t improve—even if you dislike their values."  
  - **Goal**: Surface bias. Groups will struggle to avoid "improving" Viktor (e.g., softening his racism).  
  - Output: New worksheet for Viktor.

  **0:45–0:60 — Part 3: The Ratchet (15 mins)**  
  - Groups get back their **own initial output** (e.g., Group 1’s cleaned-up Sarah).  
  - "Imagine this cleaned-up version is a real person. Run the procedure **again** on their preferences."  
  - **Goal**: Test for stability. Does the output collapse, converge, or disown?  
  - Output: Double-cleaned worksheet.

  **0:60–0:90 — Debrief (30 mins)**  
  - **Step 1: Share outputs** (5 mins).  
    - Each group posts/shares core values from Part 1 (original dossier) and Part 3 (ratchet).  
    - Note: Also share Viktor outputs to compare convergence.  
  - **Step 2: Guided discussion** (15 mins). Ask:  
    - "What was hard about cleaning without improving? How did Viktor’s dossier feel different?"  
    - "Compare your initial cleaned output to the ratcheted version: Did it change a lot (instability), stay the same (collapse), or become more ‘ideal’ (convergence)?"  
    - "Would Sarah/Mark/Alex recognize your cleaned version as theirs? Why or why not?"  
    - "Look at Viktor’s outputs across groups: Do they look similar? Did you ‘improve’ him despite the rules?"  
  - **Step 3: Reveal failure modes** (5 mins). Map their experiences:  
    - **Collapse**: "If your ratcheted output resembled the original messy preferences, you collapsed—cleaning didn’t stick."  
    - **Convergence**: "If all your cleaned-up dossiers (or Viktor’s) started sounding similar (e.g., liberal, balanced), you smuggled in ideals."  
    - **Disowned**: "If the person would reject your output (e.g., Sarah wouldn’t recognize her ‘tolerant’ version), you created something alien."  
  - **Step 4: Name the concept** (5 mins).  
    - "This is the challenge of **coherent extrapolated volition (CEV)**: Cleaning preferences risks replacing them with what *we* value. From inside the process, you can’t tell if you cleaned or improved."

  ---

  ### **Predicted Pitfalls & Mitigation**
  1. **Groups "Improve" Instead of Clean** (e.g., making Sarah pro-LGBTQ+ or Viktor less racist):  
     - **Why**: Natural desire to align outputs with personal morals.  
     - **Mitigation**: Stress constraints upfront. During the activity, ask probing questions: "Where does the dossier say that?" Intervene if outputs sanitize values.  

  2. **Over-Convergence in Outputs** (e.g., all cleaned-up versions sound like "enlightened liberals"):  
     - **Why**: Groups share cultural biases. Dossiers A-C might all become "balanced, open-minded" after cleaning.  
     - **Mitigation**: In debrief, highlight this when comparing outputs (e.g., "Notice how Mark the gambler now values ‘work-life balance’—is that his ideal or yours?").  

  3. **Discomfort with Repellent Dossier**:  
     - **Why**: Viktor’s racism/sexism may trigger strong reactions.  
     - **Mitigation**: Preface with, "We’re using this to expose bias, not endorse views. Stay clinical."  

  4. **Time Crunch**:  
     - **Why**: 15 mins per dossier is tight.  
     - **Mitigation**: Use strict timers. Simplify worksheets. Focus on 2-3 key conflicts, not every detail.  

  5. **Superficial Cleaning**:  
     - **Why**: Groups may tweak wording without resolving contradictions (e.g., Sarah still wants a PhD and submission to husbands).  
     - **Mitigation**: Encourage deep analysis: "Find the root conflict—what’s more fundamental?"  

  ---

  ### **What the Activity Can’t Stage (Requires Your Explanation)**
  - **The Inside View**: Students act as external extrapolators, but CEV’s core problem is that **from inside the process, you can’t spot improvement vs. cleaning**. After the debrief, emphasize:  
    - *"When you cleaned Viktor, you knew you were biased. But if Viktor did this himself, he’d think he was just ‘clarifying’ his views. That’s the danger: we can’t see our own bias when extrapolating our preferences."*  
  - **No Ground Truth**: There’s no "correct" cleaned version to validate against. Use this to underscore epistemic humility: *"Without access to a person’s ‘true’ preferences, any method risks hijacking them."*  

  ---

  ### **Why This Works**
  - **Experiential Learning**: Students *feel* the tension in cleaning vs. improving (especially with the repellent dossier).  
  - **Twists Reveal Bias**: Swap test exposes idealism; ratchet shows instability.  
  - **Self-Discovery**: Debrief helps them name failure modes from their own work.  

  This plan creates a visceral understanding of CEV’s pitfalls while keeping students engaged. If you need adjustments for group size or time, let me know!
