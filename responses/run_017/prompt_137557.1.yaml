answer: |-
  Here’s a reconstruction of the implicit theory underlying the "double standard" in mathematical practice, addressing your core concerns:

  ### The Implicit Theory: Classical Realism with Instrumental Pragmatism
  1.  **Ontological Realism:** Mainstream mathematics presupposes that mathematical objects (numbers, sets, functions) exist independently of human minds and constructions, possessing definite properties determined by their definitions and the axioms of the relevant theory (e.g., ZFC). This is the **presupposed realism**.
  2.  **Bivalence and Classical Logic:** Every meaningful mathematical statement, including those about existence or properties of these mind-independent objects, is determinately true or false (bivalence). Logical reasoning proceeds via classical logic, crucially including the Law of Excluded Middle (LEM) and Double Negation Elimination (DNE), which allow non-constructive proofs.
  3.  **Existence as Truth-Conditional:** An existence statement ∃x P(x) is true *if and only if* there *is* (in this mind-independent realm) some object satisfying P. A proof by contradiction establishes this truth by showing that the non-existence assumption leads to an absurdity. Finding the object is *not* part of the truth condition; it's sufficient to know it *must* exist. This justifies the analysis/algebra practice.
  4.  **Purpose Dictates Method (The Double Standard Explained):** The requirement for explicit constructions in numerical analysis/algorithms is driven by *purpose*, not a different *ontology* or *logic*. The goal there is typically *computation*, *application*, or *approximation*. Knowing that an exact solution exists (via a classical proof) is necessary but insufficient for these goals. They require:
      *   **Algorithmic Content:** A method to *find* or *approximate* the object.
      *   **Quantitative Control:** Error bounds, complexity estimates, stability guarantees – things needed to use the object effectively in the real world.
      The journals aren't rejecting the classical existence proof's *validity*; they are demanding additional information *beyond* mere existence to fulfill the paper's applied purpose. The underlying logic and ontology remain classical.

  ### Addressing the Wrinkles
  1.  **Constructiveness: Proof, not Knowledge or Intention:** "Constructive" is fundamentally a property *of the proof method*, not of the community's knowledge or the prover's head.
      *   The √2^√2 proof is *non-constructive* because it relies on LEM over an undecided disjunction (rational vs irrational). It provides no general method to *find* a witness pair; it offers two *potential* pairs, one of which *must* work. Knowing *which* one via Gelfond-Schneider doesn't retroactively make the *original proof* constructive. It only shows that *in this specific case*, a constructive proof (using the specific witness) is *now possible*.
      *   The practice presupposes the *possibility* of witnesses existing independently of our ability to find them.
  2.  **Anti-Realism, Verificationism, and Constructive Content:**
      *   **The Challenge:** Dummett's verificationist critique hits the mark: Classical practice *does* presuppose bivalence and truth beyond verification (realism) to justify LEM over undecidable predicates. This is incompatible with strict verificationism/anti-realism.
      *   **The "Secretly Constructive" Response:** It's true that for many ∀∃-statements with decidable R, classical proofs (even using LEM) can sometimes be made constructive (e.g., via Gödel–Gentzen double-negation translation or proof mining). However:
          *   This is *not* guaranteed or automatic. Many classical proofs resist constructive extraction.
          *   It works best for *specific types* of statements (like Π₂⁰). For purely existential statements (∃x P(x)) proved classically, extraction often fails utterly.
          *   It **defuses the *practical* worry for *some* theorems** (you *can* get algorithms where needed), but **relocates the *philosophical* worry** to the statements where extraction fails and to the fundamental justification of LEM itself. The practice still fundamentally *presupposes* realism/bivalence for the logic to be sound, even if constructive content can be salvaged later for specific purposes.
  3.  **Proof Assistants: Reflecting the Practice:** The Lean/Agda/Coq distinction is primarily sociological, reflecting mainstream priorities:
      *   **Lean:** Aims to formalize the *existing corpus* of mainstream mathematics efficiently. This corpus relies heavily on classical logic and choice. Providing LEM/Choice by default mirrors the implicit assumptions of the practice.
      *   **Agda/Coq:** Rooted more in type theory and computation, prioritizing constructive foundations and program extraction. Adding LEM/Choice explicitly marks a deviation from the core system, reflecting that they are *optional philosophical additions*.
      This shows mainstream mathematics *needs* classical logic/choice axioms to formalize its standard proofs and definitions as they stand.

  ### What Strictly Changes Under Intuitionism
  If a journal adopted strict intuitionistic standards:
  1.  **Banned Moves:**
      *   Proof by Contradiction for Existence: You cannot prove ∃x P(x) by assuming ∀x ¬P(x) and deriving ⊥. You must construct a witness.
      *   Case Splits on Undecidable Predicates: You cannot split cases on "P ∨ ¬P" unless P is decidable.
      *   Non-Constructive Definitions: Definitions relying on LEM or choice without providing an explicit construction (e.g., defining the supremum using LEM over boundedness) become problematic.
  2.  **Revised Theorems:**
      *   **Intermediate Value Theorem (IVT):** The constructive version states that for a *uniformly continuous* function f: [a,b] → ℝ with f(a) < 0 < f(b), and for any ε > 0, you can *find* c ∈ [a, b] such that |f(c)| < ε. It provides an *approximation algorithm*, not a guarantee of an *exact* root. The classical exact root version fails.
      *   **Other Casualties:** Basic results like "Every bounded increasing sequence has a supremum", "Every function is either continuous or discontinuous", "Every vector space has a basis" (without choice) would either need stronger hypotheses (like uniform continuity for IVT), become significantly more complex to state and prove, or fail entirely.
  3.  **The Double Standard:** It would likely **disappear** within that journal's scope. The demand for constructions/bounds would become universal for existence claims, driven by the logic itself, not just the applied purpose. Applied papers might still emphasize quantitative bounds, but the *logical standard* for existence would be unified.

  ### Verdict: What the Practice Presupposes
  The double standard is consistent *under the presupposition of classical realism*. Pure mathematics relies on realism/bivalence/LEM to accept non-constructive proofs as establishing truth. Applied mathematics, while accepting those truths, demands extra computational information relevant to its goals. This practice **presupposes-realism (classical ontological realism)** for its core logical reasoning in pure mathematics, combined with **instrumental pragmatism** dictating the level of construction required based on the problem's purpose.

  The practice is fundamentally incompatible with verificationism/anti-realism that denies bivalence for undecidable statements. While constructive content can sometimes be extracted post-hoc for specific purposes (defusing some practical concerns), the justification and universality of classical logic within the practice rest squarely on the realist presupposition.

  \answer{presupposes-realism (classical ontological realism)}
