prompt: |-
  I am writing a novel set in the 2080s in which a statutory body, the Nomic Standards Panel, maintains a public register of laws of nature, and its entries have teeth: under the Act no patent may be granted for a device whose operation would require a registered law to be false, and no public money may go to a project premised on a registered law's being merely locally true. A whole chapter turns on the ruling the Panel is about to give, and I want that ruling to be one a careful philosopher of science could actually have arrived at, rather than one that merely sounds authoritative to a lay reader.

  The precedents in my file are these. The Panel refused to register "no sphere of solid gold exceeds a mile across", on the ground that it is a limit on how matter happens to be distributed rather than on how it can behave. It refused "every coin in the Bank's vault on 1 January 2079 was silver", calling that an inventory rather than a law. It has a standing rule against entering any generalization whose terms are fixed by reference to a date or a named object, under which it refused "everything sampled before the Change is green and everything sampled after is blue". It refused "a bound planet sweeps out equal areas in equal times", placing it instead on a separate list of derivative regularities, because it holds only given more fundamental laws together with how the system happened to start. It registered in the highest grade "no causal influence outruns light in a vacuum", "every electron carries a charge of one negative unit", and "the total energy of an isolated system does not change". And it registered, in a lower, domain-relative grade, "every cell is the offspring of a cell", which it said holds in every biologically possible history rather than merely in ours.

  The application now before it concerns a quantity my future physics calls the Ashgrove constant, κ: a single dimensionless number, measured to twelve decimal places in eleven independent kinds of system, never derived from anything deeper, and, the Panel is advised, able coherently to have taken any of a range of nearby values — though worlds with those values would contain nothing capable of storing information. The Ashgrove Institute wants to build a device that would work only if κ could be varied locally; a rival party has applied to have κ's constancy entered not as a law but as a contingent matter of fact. What I need from you is this: a prediction of how the Panel rules on κ — law, contingent fact, or something on the derivative list — on the assumption that it wants to be consistent with itself; which of its precedents is the closest analogue and why; an account of the principle it is implicitly running (a best-system account, a relations-among-universals account, a powers-or-essences account, a governing account, an invariance-under-counterfactual-variation account, or something I have not thought of) together with the other principles that fit its precedents just as well but come apart on this one; a best guess among them with your reasons for preferring it; and a description of the one further application that, if I put it before the Panel next, would best separate the candidates that survive. Please also say how confident you are in each part of what you tell me, and single out the claim you would most expect a professional philosopher of science to reject. I should prefer the answer in British English.
reasoning: |-
  Okay, let me tackle this fascinating problem step by step. The user is building a sci-fi legal system around scientific laws and needs a philosophically rigorous ruling for their novel. 

  First, I need to understand the Panel's established precedents. They clearly distinguish between:
  - Fundamental laws (like light speed limits)
  - Contingent facts (like gold sphere size limits)
  - Derivative regularities (like Kepler's laws)

  The κ constant case is tricky because it's measured precisely across systems, theoretically variable, but its variation would prevent complex structures like life. The Panel must decide if its constancy is law or contingency.

  Hmm... the key tension seems to be between:
  - Measured invariance (supports law status)
  - Theoretical variability (supports contingency)
  - But with the caveat that variation destroys information-storing capacity

  The "biologically possible worlds" precedent feels most relevant - they accepted "all cells from cells" as domain-relative law because it holds across possible biologies. Similarly, κ's constancy might be necessary for any world with observers.

  I recall David Lewis' best system analysis - laws are the simplest summaries with greatest explanatory power. κ's constancy seems central enough to qualify. But the "no local variation" aspect echoes the light speed law precedent too.

  For the ruling, I think they'd register it as fundamental law. Contingency would undermine its foundational role across physics. The derivative list doesn't fit since it's not derived from deeper principles.

  The closest precedent is actually the cell division case - both involve constants that enable higher-order complexity. Though light speed is closer in being fundamental physics.

  For philosophical grounding, invariance under counterfactual variation aligns best with precedents. κ couldn't change without collapsing complexity - making its constancy necessary in a deeper sense.

  To test this later, I'd propose a case about quantum decoherence timescales - where apparent constants might emerge from deeper structures. That would pit best-system against invariance accounts.

  Biggest point of contention? Probably whether κ's link to information storage makes it law or "merely" enabling condition. Some philosophers might insist laws shouldn't depend on emergent phenomena like information.

  Must present this carefully - with appropriate confidence levels flagged. The contingency argument deserves serious consideration even if I think law-status wins.
answer: |-
  Based on your precedents and the Ashgrove constant case, here is a reasoned prediction of the Panel's ruling, its philosophical grounding, and the implications for your novel, presented in British English with confidence assessments:

  **1. The Panel’s Ruling on κ**  
  *Prediction:* The Panel will register κ’s constancy as a **fundamental law of nature** in the highest grade.  
  *Confidence:* **High** (85%).  

  *Reasoning:*  
  - κ is dimensionless, universally measured across independent systems, and never derived from deeper principles—mirroring the status of registered laws like the invariance of light speed or electron charge.  
  - The refusal to register contingent distributions (gold spheres), inventories (Bank vault coins), or dated generalisations ("before the Change") shows κ’s *lack of spatiotemporal specificity* favours law status.  
  - The "domain-relative" precedent ("every cell is the offspring of a cell") is *distinguishable*: κ’s constancy enables information-storing systems *universally*, not just within a domain like biology. Worlds where κ varies lack observers *by necessity*, making κ’s constancy a precondition for any complex physics—unlike cell division, which is a pattern *within* such a world.  
  - The "derivative regularities" list (e.g., Kepler’s law) is inapplicable: κ is not derived from other laws plus initial conditions; it is foundational.  

  **2. Closest Precedent Analogue**  
  *Analogue:* **"No causal influence outruns light in a vacuum"** (highest-grade law).  
  *Confidence:* **High** (90%).  
  *Why:*  
  Both are:  
  - **Universal constraints** (apply to all causal interactions/information-capable systems).  
  - **Measured invariants** with no known exceptions.  
  - **"Enabling conditions"** for coherent physics: varying either (light speed or κ) fundamentally alters what structures or observers can exist. The gold sphere limit, by contrast, merely describes an accidental configuration.  

  **3. Implicit Principle and Competing Alternatives**  
  *Principle:* **Invariance-under-counterfactual-variation account**.  
  *Confidence:* **Moderate** (70%).  
  *Description:* Laws are generalisations that hold not just in our world, but across *metaphysically possible worlds* where initial conditions or contingent facts differ—*unless* such variation would destroy the preconditions for coherent physics (e.g., information storage). κ’s constancy is necessary for *any world with observers*, making it lawlike.  

  *Competing Principles Fitting Precedents:*  
  - **Best-system account (Lewisian):** Laws are axioms in the simplest, most informative summary of nature. Fits precedents well (e.g., light speed law is simple and informative).  
  - **Powers/essences account:** Laws reflect intrinsic dispositions (e.g., electron charge). Also fits (e.g., "every electron carries one charge unit").  

  *Where They Diverge on κ:*  
  - **Invariance view:** κ’s constancy is law because varying it *destroys the possibility of observers*—it is invariant in all *relevant* counterfactuals.  
  - **Best-system view:** κ’s constancy is law if including it maximises explanatory power *simply* (e.g., unifying diverse systems). Contingency might be simpler if κ’s role is narrow.  
  - **Powers view:** κ is law only if it reflects a fundamental *disposition* (e.g., space-time’s essence). If κ is "brute," this view may demote it.  

  **4. Best Guess with Reasons**  
  *Preferred Principle:* **Invariance-under-counterfactual-variation**.  
  *Reasons:*  
  - Best explains *all* precedents:  
    - Light speed law: Varying it removes causal structure.  
    - Cell division law: Holds in *biologically possible* worlds (a restricted counterfactual class).  
    - Rejected gold sphere limit: Varying it (e.g., a larger gold sphere) changes nothing fundamental.  
  - Directly addresses κ’s unique feature: Its constancy enables observers, making variation *incoherent* in law-governed worlds.  
  - Aligns with the Panel’s "domain-relative" rationale and rejection of "local truth" funding.  

  **5. Critical Test Application**  
  *Proposal:* An application concerning **quantum decoherence timescales in chiral molecules**.  
  *Scenario:* Decoherence is consistently observed to occur within 10<sup>−15</sup> seconds in all chiral molecules (e.g., DNA, sugars). Theory suggests this timescale *could* vary without logical contradiction, but doing so would prevent stable biomolecular replication.  
  *Why It Separates Candidates:*  
  - **Invariance view:** Registers as law. Variation destroys biological possibility (like κ).  
  - **Best-system view:** Likely contingent. Including a specific timescale complicates the system; it may be derivable from deeper principles.  
  - **Powers view:** Contingent unless tied to a molecular *essence* (unlikely).  
  *Confidence:* **High** (80%). This tests whether "observer-enabling invariance" outweighs derivability.  

  **6. Confidence and Controversy**  
  - **Claims with confidence <70%:**  
    - *Best-system vs. invariance*: Only 60% confidence invariance is explicitly favoured over best-system; the Panel may conflate them.  
    - *κ’s registration grade*: 70% confidence it is "highest grade" (could be domain-relative if tied to information storage).  
  - **Most contestable claim (to philosophers):**  
    The claim that **κ’s link to information storage makes it law**. A philosopher might argue this conflates *epistemic* (observer-dependent) and *ontic* (mind-independent) necessity. If κ only *enables* observers, its constancy could be contingent—like Earth’s distance from the sun enabling life.  
    *Rebuttal:* The Panel’s "biologically possible worlds" precedent already accepts domain-relative laws, and κ’s role is *more fundamental* (enabling physics itself).  

  ### Summary for Your Chapter  
  The Panel rules κ’s constancy is a **fundamental law**, citing its universal invariance and role in enabling coherent physics. The Ashgrove Institute’s device is rejected for requiring this law to be false. The closest precedent is light speed invariance. The Panel’s implicit principle is **counterfactual invariance**, prioritising regularities that hold across possible worlds where observers *could* exist. The critical test case involves quantum decoherence timescales in chiral molecules.  

  This ruling should satisfy a philosopher of science by:  
  - Distinguishing κ from contingent facts (gold spheres) and derivative regularities (Kepler’s law).  
  - Grounding lawhood in invariance, not human interests.  
  - Acknowledging counterfactual stability as key (a standard move in philosophy).  

  ---  
  **Final Note:** This mirrors real debates (e.g., fine-tuning constants like the cosmological constant). For authenticity, have a dissenting Panel member argue a *best-system* view: "κ is a *bridge principle*, not fundamental; register it as domain-relative!" This adds tension while keeping the ruling credible.
