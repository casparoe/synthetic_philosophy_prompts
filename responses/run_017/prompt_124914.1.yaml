answer: |-
  ### Analysis of Cases  

  **1. Detached Ascriber**  
  - **Contextualism**: Ada's affirmative ascription is true. Her context (low stakes, theoretical) sets a low standard, so "Ben knows" expresses a true proposition.  
  - **Invariantism**: Ben lacks knowledge due to his high stakes, so Ada's ascription is false regardless of her context.  
  *Credibility*: Contextualism is more plausible. Ada’s purely theoretical context shouldn’t require accommodating Ben’s unrelated practical situation. *Stipulation*: Ascriber’s stakes are irrelevant to the subject’s epistemic state.  

  **2. Hidden Stakes**  
  - **Contextualism**: If the ascriber knows the hidden stakes, "Cara knows" expresses a false proposition (high standard). If unaware, it may express truth.  
  - **Invariantism**: Cara lacks knowledge (objective stakes set high threshold), regardless of anyone’s awareness.  
  *Credibility*: Invariantism’s answer is counterintuitive (Cara reasonably feels she knows). Contextualism better captures epistemic responsibility. *Stipulation*: Stakes are objective; knowledge depends on actual (not believed) stakes.  

  **3. Imposed Stakes**  
  - **Contextualism**: No change in Dia’s knowledge (ascriber context unaffected). If ascriber notes raised stakes, "knows" may express falsehood.  
  - **Invariantism**: Dia loses knowledge—threshold raised by adversary’s act.  
  *Credibility*: Invariantism’s answer is a reductio: knowledge shouldn’t be destructible by external manipulation. Contextualism avoids this.  

  **4. Delegated Stakes**  
  - **Contextualism**: "Ada knows" is false if ascriber’s context reflects her high stakes (high standard for relying on Ben).  
  - **Invariantism**: Ambiguous. If subject = Ada, she lacks knowledge (her stakes set high threshold). If subject = Ben, he knows (low stakes).  
  *Credibility*: Neither fully satisfactory. Contextualism better explains why we’d deny "Ada knows" (high reliance stakes). *Stipulation*: The knowledge ascription’s subject (Ada) determines the threshold. Ben may assert "p" but not "I know p" to Ada if her stakes are high.  

  **5. Managed Stakes**  
  - **Contextualism**: Eli/Fia’s knowledge unchanged—acts don’t alter ascriber context.  
  - **Invariantism**: Eli gains knowledge (stakes lowered); Fia loses it (stakes raised).  
  *Credibility*: Invariantism’s answer is problematic: knowledge becomes manipulable. Motive matters: if Eli/Fia change stakes *to alter knowledge*, it feels gerrymandered. Contextualism’s stability is preferable.  

  ---

  ### Theoretical Distinctness After Auxiliary Moves  
  The positions **converge significantly** but retain a core disagreement:  
  - **Contextualism** anchors the standard to the *ascriber’s practical context*.  
  - **Invariantism** anchors it to the *subject’s practical situation* (even if expanded to include affected parties).  

  **Residual disagreement**: Whether the ascriber’s context *constitutively* sets the standard (contextualism) or merely *reports* a subject-relative fact (invariantism).  
  - **Settling observation**: Cases where ascriber and subject stakes diverge *and* the ascriber has no practical interest in the subject’s actions (e.g., Case 1). If we intuitively affirm knowledge here (e.g., "Theorists correctly say high-stakes Ben knows"), contextualism wins; if we deny it, invariantism wins. Such intuitions are available but contested.  

  ---

  ### Asymmetries  
  **1. Generalization to rational belief/credence**:  
  - *Invariantism* extends naturally: rational belief/credence thresholds also vary with stakes.  
  - *Contextualism* lacks direct extension—it’s a semantic thesis about "knows."  
  → **Liability for contextualism**: It cannot explain why practical stakes affect rational action *independently* of ascription.  

  **2. Inquiry "hostage to fortune"**:  
  - *Invariantism* makes knowledge *itself* practically contingent, risking "epistemic injustice" (e.g., imposed stakes destroying knowledge).  
  - *Contextualism* confines practicality to language, preserving a "pure" epistemic core.  
  → **Virtue for contextualism**: It avoids reducing epistemology to pragmatics.  

  ---

  ### Overall Verdict  
  **Choice**: **Attributor contextualism**.  
  **Deciding consideration**: **Resilience against manipulation** (Cases 3 & 5). The idea that an adversary can destroy knowledge (invariantism) or that agents can willfully alter their epistemic status by changing stakes is philosophically untenable. Contextualism avoids this by insulating knowledge from direct practical interference, locating stakes-sensitivity in the *use* of language.  

  **Discriminating factors**:  
  - Genuine: Manipulation cases reveal invariantism’s counterintuitive consequences.  
  - Verbal: Disputes over "knowledge" vs. "ascription of knowledge" are semantic.  
  - Formulation: Auxiliary moves blur boundaries, but Case 1 isolates the ascriber/subject standpoint distinction.  

  **Key insight**: Contextualism better separates *what knowledge is* from *how we attribute it*, preserving epistemology’s normative autonomy.
