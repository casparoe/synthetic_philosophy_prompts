answer: |-
  Below is a structured decision procedure designed to address your requirements. It is an ordered set of questions that explicitly separates factual analysis from value judgments, accounts for population dynamics (replacement effects, secondary outbreaks), defines baselines, and uses robustness testing to handle uncertainty. The procedure minimizes reliance on which number you see first by forcing systematic comparison of options across their entire plausible parameter ranges. When value judgments are unavoidable, it halts and requires human input.

  ---

  ### **Pest Management Ethical Decision Procedure**
  **Inputs:**  
  - Three intervention options (e.g., *Option 1: Fast knockdown, Option 2: Slow-acting biocontrol, Option 3: Wait/no intervention*).  
  - Data on pest population, crop stage, environmental conditions, and economic thresholds (ET).  
  - Plausible ranges for uncertain parameters (e.g., suffering weights, replacement rates).  

  **Outputs:**  
  - `Hard no`, `Recommend [option]`, or `Escalate to human judgment`.  

  **Key Principles:**  
  1. **Baseline:** Always compare to *what would happen if no intervention occurred* (including natural mortality, overshoot-crash cycles, and future suffering).  
  2. **Net impact:** Never use "animals killed by treatment" as a proxy for impact. Instead, model:  
     - **Replacement effects:** Individuals killed may be replaced by new births.  
     - **Secondary effects:** Interventions may harm natural enemies or cause future outbreaks.  
     - **Suffering differential:** How intervention alters the duration/intensity of suffering vs. baseline.  
  3. **Value judgments:** Explicitly flagged. If uncertain parameters or values flip the recommendation, escalate.  
  4. **Robustness:** Test all options across plausible ranges of uncertain parameters. If ranking flips, escalate.  

  ---

  #### **Step 1: Economic and Non-Economic Necessity**  
  **Question:** *Is the pest above the economic threshold (ET), or is there a non-economic justification for intervention (e.g., regulatory compliance, catastrophic risk)?*  
  - **Good enough answer:**  
    - If **above ET**: Proceed to Step 2.  
    - If **below ET** and **no non-economic justification**: Return `Hard no`.  
    - If **below ET** but **non-economic justification exists**: Proceed to Step 2.  
  - **Judgment call?** Yes. Non-economic justifications (e.g., "cosmetic tolerance") are values-based.  
  - **Baseline note:** Uses standard ET calculations for the crop.  

  #### **Step 2: Define Baseline Trajectory**  
  **Question:** *What is the expected population trajectory, total suffering, and mortality *without intervention*?*  
  - **Good enough answer:** Model:  
    - Population growth/crash dynamics (e.g., exponential growth followed by starvation).  
    - Average suffering per individual (days of distress × intensity) from crowding, disease, predation.  
    - Total suffering = (Peak population) × (Avg. suffering per individual).  
  - **Judgment call?** Partially. Population modeling is factual but uncertain; suffering intensity is values-based (e.g., "Is starvation worse than parasitism?").  
  - **Baseline:** Explicitly projects "no intervention" future (e.g., "10,000 aphids starve over 10 days").  

  #### **Step 3: Net Impact of Each Option**  
  **Question:** *For each option, what is the net change in total suffering compared to baseline, accounting for replacement effects and secondary outbreaks?*  
  - **Good enough answer:** For each option, calculate:  
    - **Direct suffering:** Suffering caused by intervention (e.g., spray = quick death; parasitoid = slow death).  
    - **Indirect effects:**  
      - Replacement: Will killed pests be replaced? (e.g., if 50% killed, but 50% rebound occurs).  
      - Secondary outbreaks: Will natural enemy loss cause future outbreaks?  
    - **Net suffering delta:**  
      - = [Suffering from option] - [Baseline suffering]  
      - Include suffering of new individuals born due to replacement.  
  - **Judgment calls?** Yes:  
    - **Replacement individuals:** Do they count? (Default: Yes, if they wouldn't exist otherwise.)  
    - **Suffering weight:** Assign weights to suffering intensity (e.g., 1 day slow death = 5 days medium death).  
  - **Factual note:** Population ecology models used where possible (e.g., Lotka-Volterra for predation).  

  #### **Step 4: Robustness Testing**  
  **Question:** *Does the ranking of options hold across the plausible range of uncertain parameters?*  
  - **Good enough answer:**  
    - Define plausible ranges for:  
      - Population growth rates, replacement rates, suffering weights.  
      - Value weights (e.g., "Is a pest's life net positive?").  
    - Test all combinations of parameters.  
    - If **one option minimizes net suffering across all combinations**: Proceed to Step 5.  
    - If **ranking flips** (e.g., Option 1 best in 60% of cases, Option 2 in 40%): Return `Escalate to human judgment`.  
  - **Judgment call?** No. This is a mechanical sensitivity test.  

  #### **Step 5: Final Recommendation**  
  **Question:** *Is the optimal option ethically acceptable given absolute suffering?*  
  - **Good enough answer:**  
    - If net suffering delta is negative (reduces suffering) or marginal: Recommend the option.  
    - If net suffering delta is highly positive (e.g., mass suffering for cosmetic gain): Return `Escalate to human judgment`.  
  - **Judgment call?** Yes. "Acceptable suffering" is values-based (e.g., society may tolerate suffering for food security but not for aesthetics).  

  ---

  ### **Application to Cases**  
  #### **Case 1: Greenhouse Aphids**  
  - **Options:**  
    - *Option 1 (Fast knockdown):* Pyrethroid spray. Quick death; kills natural enemies.  
    - *Option 2 (Slow biocontrol):* Parasitoid wasps. Death in 3–5 days; preserves natural enemies.  
    - *Option 3 (Wait):* Overshoot-crash; starvation over 7–10 days.  
  - **Step 1:** Aphids above ET → Proceed.  
  - **Step 2 (Baseline):** 10,000 aphids starve slowly; high suffering. Natural enemies present.  
  - **Step 3 (Net impact):**  
    - *Option 1:* Kills 95% quickly. But natural enemies decimated → 50% replacement + secondary outbreak. **Net suffering:** Higher than baseline due to extra outbreaks.  
    - *Option 2:* Kills 70% slowly over days. No secondary outbreaks; replacement low. **Net suffering:** Lower than baseline (avoids crash suffering).  
    - *Option 3:* Matches baseline.  
  - **Step 4 (Robustness):**  
    - Suffering weight for slow death (Option 2) vs. starvation (baseline) is critical.  
    - If slow death weight <2× starvation, Option 2 wins. If >2×, Option 3 wins. **Ranking flips → Escalate.**  
  - **Outcome:** `Escalate to human judgment` due to sensitivity to suffering weights.  

  #### **Case 2: Codling Moth (Under Mating Disruption)**  
  - **Options:**  
    - *Option 1 (Intervene):* Maintain mating disruption. Prevents conception; no direct killing.  
    - *Option 2 (Hold):* Stop disruption; moths breed → larvae die naturally.  
  - **Step 1:** Above ET → Proceed.  
  - **Step 2 (Baseline):** If stop disruption, 5,000 larvae die of predation/starvation (slow death).  
  - **Step 3 (Net impact):**  
    - *Option 1:* 0 immediate suffering. Prevents 5,000 future larvae. **Net suffering:** Avoids all baseline suffering.  
    - *Option 2:* Matches baseline.  
    - **Replacement effect:** None (preventing birth avoids suffering).  
  - **Step 4 (Robustness):**  
    - Holds across all ranges (even if "prevented lives" are assigned low suffering weights).  
  - **Step 5:** Ethically acceptable (prevents suffering).  
  - **Outcome:** `Recommend Option 1 (maintain disruption)`.  

  #### **Case 3: Low-Value Cosmetic Pest (Below ET, Near Harvest)**  
  - **Options:**  
    - *Option 1 (Spray):* Fast knockdown.  
    - *Option 2 (Hold):* No intervention; pests starve post-harvest.  
  - **Step 1:** Below ET. Non-economic justification? "Cosmetic perfection" → **Judgment call.** Assume grower insists → Proceed.  
  - **Step 2 (Baseline):** 1,000 pests starve slowly post-harvest (moderate suffering).  
  - **Step 3 (Net impact):**  
    - *Option 1:* Kills 95% quickly. Minimal replacement (near harvest). **Net suffering:** Reduces suffering by 80% (avoids slow deaths).  
    - *Option 2:* Matches baseline.  
  - **Step 4 (Robustness):** Holds across suffering weights (quick death always better than slow starvation).  
  - **Step 5:** Ethically acceptable? Net suffering reduced, but for cosmetic gain → **Judgment call.**  
  - **Outcome:** `Recommend Option 1 (spray)`.  
    - **Brutal truth:** The procedure recommends spraying even without economic justification because it reduces net suffering (replaces slow starvation with quick death). This contradicts standard ET practice but aligns with minimizing animal distress.  

  ---

  ### **What the Procedure Cannot Tell You**  
  1. **Absolute moral weights:** It cannot resolve *how much* insect suffering matters vs. human interests (e.g., is 1,000 aphid deaths equal to $1 of crop loss?). This requires societal or personal values.  
  2. **Unmeasurable uncertainties:** When data is absent (e.g., "Do replaced individuals experience net-positive lives?"), it defaults to escalation.  
  3. **Thresholds for escalation:** How close must robustness be to flip? (e.g., 51% vs. 49%). This is arbitrated by your risk tolerance.  
  4. **Non-utilitarian ethics:** It assumes suffering minimization is the goal. If you prioritize deontology (e.g., "never kill intentionally"), it fails.  

  ### **What to Do When the Procedure Goes Quiet**  
  - **On escalation:** Document uncertainties, consult stakeholders (grower, auditors, ethicists), and make a values-based call.  
  - **On "hard no":** Trust the procedure; no intervention is defensible.  
  - **When data is missing:** Default to precaution (e.g., if replacement effects unknown, assume high risk).  
  - **In moral dilemmas:** If all options cause high suffering (e.g., spray vs. starvation), acknowledge the tragedy and choose the lesser evil.  

  This procedure forces systematic, transparent decisions—but it cannot absolve you of moral responsibility. Use it to *reduce* cognitive bias, not eliminate ethical agency.
