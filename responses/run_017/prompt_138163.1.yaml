  **Step 1b (for below ET):** Is there a non-economic reason that might justify intervention? (e.g., regulatory requirement, zero-tolerance for cosmetic damage in a premium market, or a known risk of explosion if left unchecked?) 
  - **Judgment call?** Yes, because it involves values (how much we care about non-economic factors). 
