  #### Step 2: Evaluate the Baseline (What Happens Without Intervention)
  **Question:** What is the expected natural mortality and suffering in the pest population without intervention? We must consider:
  - The typical life of the pest: does it die slowly of crowding, disease, or predation? 
  - What is the expected trajectory? (e.g., overshoot and crash, stable, or explosion?)

