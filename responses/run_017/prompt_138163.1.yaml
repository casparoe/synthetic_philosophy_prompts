  8. Use a method that tests whether the ranking of options survives the entire plausible range of each uncertain parameter (robustness analysis) and escalate when the ranking flips.

  The procedure will be applied to three cases: greenhouse aphids, codling moth in an orchard under mating disruption, and a low-value cosmetic pest below the economic threshold.

  ### Structure of the Procedure

  We break the procedure into steps. At each step, if we can answer with a fact-based threshold, we do; otherwise, we stop and require human judgment. We assume that we have some data (though imperfect) about the pest population and the effects of interventions.

  #### Step 0: Define the Options
  We have three options for a given pest situation:
  - **Option A**: Fast knockdown (e.g., chemical spray that kills quickly).
  - **Option B**: Slow-acting biological control (e.g., parasitoid release).
  - **Option C**: Wait (no intervention, rely on natural enemies and population dynamics).

  But note: in the codling moth case, the intervention is mating disruption (preventing conception) and in the cosmetic pest case, we might have only two options: spray or do nothing.

  We will design the procedure to be general.

  #### Step 1: Economic Justification
  **Question:** Is the pest population above the economic threshold (ET) for the crop? (This is a standard agricultural concept: the point at which the cost of damage by the pest exceeds the cost of control.)

  - **Fact-based?** Mostly yes, but thresholds can be debated. We assume we have an established ET for the crop and pest.
  - **Good enough answer:** 
    - If above ET: proceed to next step (because intervention is economically justified, but we still need ethical evaluation).
