  The user proposes weak dominance: only undominated perspectives matter, and all must agree for truth. But that might lead to many ascriptions being neither true nor false. They want a credence on universality holding without collapse into indeterminacy.

  Breaking down the components for the credence:
  1. Determinate answer: Is there a single standard, or is "knows" indeterminate/plural? 
  2. Semantic context-sensitivity: Is "knows" semantically context-sensitive or just pragmatically shifty?
  3. Parameter split: If context-sensitive, which parameter (ascriber, subject, assessor)?
  4. Strong dominance survives incomparable perspectives: Can we always pick one dominant perspective even when dimensions don't rank?
  5. Weak dominance rescues universality: Does weak dominance work without trivializing?

