prompt: |-
  Act like a senior person in formal social choice theory and welfare economics who also knows political philosophy cold — the kind of person who has sat through a hundred of these workshops and knows exactly how the last ten minutes turn hostile. Take it seriously and think carefully before writing: first brainstorm the whole space of objections you can think of, sort them by how likely and how damaging they are, throw out the ones that won't actually come up from this crowd, and only then write the real prep sheet. Be concrete, use tiny numerical two-person examples where they do work, and don't pad it with citations, reading lists or "see so-and-so" — I know the literature, I need the argumentative moves. No web access on my side either, so work from what's in your head.

  Here's the situation. Next week I'm presenting at a joint philosophy–economics workshop, 30 minutes plus maybe 10 for questions, and the Q&A is definately the part I'm worried about.

  What I'm defending. Harsanyi's aggregation theorem: suppose each person i has preferences over lotteries satisfying the vNM axioms, so each has a utility function u_i unique up to positive affine transformation; suppose the social ordering over lotteries also satisfies the vNM axioms, so it too has a utility representation U, unique up to positive affine transformation; and suppose Pareto in the ex ante form — if every i prefers lottery p to lottery q, then society does too. Then, assuming the u_i aren't affinely dependent on each other, U = sum of lambda_i times u_i, with every lambda_i nonnegative, up to an affine transformation of U. My line is that this is a measurement theorem, not a moral one. The lambdas are exchange rates between interpersonal units of utility, not a distributive verdict; so the theorem can't be read as a defence of utilitarianism (or of average utilitarianism via Harsanyi's own impartial-observer move, where you imagine an equal chance of being anybody), because that reading conflates a unit convention with a moral weighting. All the distributive content sits in the choice of units. So I propose one, which I call unit-stake calibration: for a given decision problem with feasible set F, rescale each person's utility so that the gap between her best and worst attainable option in F is 1, then set all the lambdas equal. On that convention the theorem hands you an additive rule that behaves prioritarian in exactly the cases people argue about — someone whose utility range is compressed (severe disability, restricted opportunity, adapted expectations) gets her gains counted at full unit value — while all three axioms stay intact. And I want to argue that the menu-relativity of the weights that falls out of this is a feature rather than a bug: weights track stakes, and stakes are a property of the decision problem you're actually in, not of the person in the abstract.

  Who's in the room. About ten people: two Rawlsians, one of whom works on the difference principle and the primary-goods index and thinks interpersonal utility comparison is where welfare economics goes off the rails, the other more constructivist and hostile to the whole idea of a social utility function; one luck egalitarian in the Dworkin/Arneson vein who lives in the expensive-tastes and cut literature; one prioritarian of a broadly Parfitian sort, who is fine with the weighted-sum form but thinks the weight should be a decreasing function of a person's absolute level, not of her local range; a decision theorist who has written on interpersonal comparisons and thinks imposing vNM independence on a social ordering is unmotivated; two economics-department social choice people of a Sen-ish cast, who care about informational bases, invariance conditions and the difference between single-profile and multi-profile statements of the theorem; one heterodox economist who thinks cardinal utility is a fiction and expected utility is descriptively false anyway; and a handful of grad students who mostly want to know what's new here. The chair is a philosopher of economics, sympathetic but a timekeeper.

  What I want from you: my Q&A prep sheet. Roughly eight objections, ordered by how much damage they'd do if I handled them badly (weight likelihood as well as force), each one phrased the way that particular person would actually say it — the luck egalitarian shouldn't sound like the econ theorist — each with the two-minute reply I should give, and an honest note on where that reply is soft or where I'm just asserting something. Tell me what I should concede in the talk itself before anyone has to ask, tell me which single reply has to land for the whole thing to survive, and tell me the question I'm hoping nobody asks. My own guess is that the worst one is about adding a dominated option to the menu — an option that's bad for everyone but worst for one person — reshuffling the rescalings and so flipping the ranking among the original options, even though nobody would ever choose it. But tell me if you think there's something worse waiting, e.g. about sequential decisions, or about what happens when someone is indifferent across the whole menu, or about whether I've just reinvented prioritarianism under a different name and the theorem bought me nothing.
reasoning: |-
  Alright, let me start by really getting into the mindset of a senior expert in social choice theory and welfare economics. The user is presenting Harsanyi's aggregation theorem and wants to defend it as a measurement tool rather than a moral statement. Their main point is that the lambdas are just exchange rates, and by using unit-stake calibration (rescaling utilities so each person's best-worst gap in the feasible set is 1), the weights adjust to stakes, making it prioritarian in key cases.

  First, I need to consider the audience. There are Rawlsians, a luck egalitarian, a prioritarian, decision theorists, Sen-style social choice folks, and a heterodox economist. Each has different concerns. The Rawlsians will reject interpersonal utility comparisons, the luck egalitarian will worry about responsibility, the prioritarian might think absolute levels matter more than ranges, and the decision theorist will question vNM independence for social ordering.

  The user's biggest fear is the adding a dominated option objection. If you add a bad option that no one would choose, it could rescale utilities and flip the original rankings. That's a serious issue because it violates independence of irrelevant alternatives. But I should check if there are other hidden traps. What about sequential decisions? If the feasible set changes over time, the weights might shift, leading to time inconsistency. Also, if someone is indifferent across the whole menu, their utility range is zero, breaking the rescaling. That could be messy.

  Then there's the prioritarian claiming this is just repackaged prioritarianism. The user needs to show that the additive form comes from the axioms, not an assumption, so it's a derivation, not a postulate. The heterodox economist might dismiss vNM axioms altogether, but the user can argue it's normative, not descriptive.

  The Sen-ish folks care about informational invariance. Unit-stake calibration uses ratio-scale info, which is more than ordinal, but perhaps necessary for interpersonal comparisons. Also, single vs. multi-profile: Harsanyi's theorem is often single-profile, but unit-stake calibration might need multi-profile to avoid dictatorship implications. That's technical but important.

  The luck egalitarian will ask about expensive tastes. If someone's high utility range is due to cultivated tastes, should they get more weight? Here, the user must concede that the method is stakes-based, not responsibility-sensitive, and might need adjustments elsewhere.

  The prioritarian's absolute levels point is tough. Compressing utility ranges might not reflect true disadvantage if someone's absolute level is low but range is wide. The user has to bite the bullet that stakes matter contextually, not absolutely.

  The Rawlsian critique about primary goods vs. utility is fundamental. The user should preempt this by emphasizing that utility here is a metric, not preference satisfaction, but it's a soft spot.

  The decision theorist's vNM independence objection: social preferences might need to violate independence for fairness. The user can argue that without vNM, we lose cardinality and aggregation, but it's a normative choice.

  The worst unasked question might be about non-separable cases or if the feasible set is a singleton. Also, maybe the chair's timekeeping cutting off complex answers.

  Ordering the objections: dominated option and sequential inconsistency are top because they break the rule's coherence. Then prioritarian's absolute levels, luck egalitarian's responsibility, Sen's informational basis, Rawlsian's interpersonal comparison, decision theorist's vNM, and heterodox's cardinal utility.

  For each, craft replies that are concrete. Use two-person examples with numbers. For the dominated option, show how adding a bad option rescales, but note that in practice, such options are irrelevant. Concede that menu-dependence is a feature but has limits. Stress that the theorem provides the additive form, and unit-stake is a defensible normalization.

  The key reply is to the dominated option problem. If that lands, others might follow. If not, the whole approach seems arbitrary. So focus on distinguishing feasible from conceivable sets and the contextuality of stakes.

  Also, in the talk, concede upfront that menu-dependence is inherent and that utility ranges depend on the set. Admit that responsibility isn't handled. Highlight that the weights aren't moral but exchange rates.

  Hope no one asks about a case where adding an option doesn't change best/worst but shifts midpoints, affecting weights. Or if someone's welfare is entirely outside the feasible set, making calibration moot.

  Overall, structure the prep sheet with eight objections, ordered by damage, with replies and soft spots. Make sure each reply is tailored to the questioner's background, using their language. Keep it tight, no fluff.
answer: |-
  Here’s your Q&A prep sheet, distilled to eight objections ordered by damage potential (likelihood × force). I’ve phrased them as the critics would, with replies designed for 90–120 seconds. **The key reply is #1**—if you lose on menu-dependence, the framework collapses. Concede upfront: "My approach makes weights *menu-relative*; this is intentional, but let me clarify why it’s defensible."  

  ### **Top-Tier Objections**  
  1. **The Luck Egalitarian** (on dominated options):  
     *Objection:* "Suppose we have two people, A and B, and two lotteries: p gives (1,0) in utils, q gives (0,1). With unit-stake, U(p)=U(q)=1. Now add a dominated option r = (–100, –1). Rescaling: A’s range becomes –100 to 1 (span 101), B’s –1 to 1 (span 2). Now U(p) = (1–(–100))/101 ≈ 1, U(q) = (1–(–1))/2 = 1 → U(q) > U(p)! But r is irrelevant – no one would choose it. Your rule reverses rankings over *actual* choices based on a phantom option."  
     *Reply:* "Correct. But stakes *are* defined relative to the *feasible set*. If r isn’t feasible, exclude it from F. The calibration requires specifying the decision context. If we mis-specify F, we get garbage – but that’s true of any maximization. In practice, F is the *policy menu* (e.g., ‘which tax scheme to adopt?’), not all conceivable options."  
     *Soft spot:* Assumes F is well-defined. If F includes r as a political distraction, weights distort.  

  2. **The Decision Theorist** (vNM for social ordering):  
     *Objection:* "Why impose vNM independence on *social* preferences? Suppose p ≻ q for society. vNM requires (αp + (1–α)r) ≻ (αq + (1–α)r). But if r is ‘enslave person B’, mixing it with p and q might make society unwilling to gamble – violating independence for ethical reasons."  
     *Reply:* "vNM is a *structural axiom for lottery comparisons*, not a moral claim. If society violates independence (e.g., due to fairness), we *lose* cardinal aggregation. My point is: *if* you accept ex ante Pareto and cardinal social utility, Harsanyi forces additivity. Rejecting vNM sinks the theorem, but then we’re in Arrow-like impossibility."  
     *Soft spot:* Concedes the theorem is fragile if vNM is normatively questionable for society.  

  3. **The Prioritarian** (compressed range ≠ disadvantage):  
     *Objection:* "Person A has chronic pain: her best is 10 utils, worst 9 (range 1). Person B is healthy: best 100, worst 0 (range 100). You weight A’s utils 100× more than B’s. But if A’s ‘best’ is still miserable (9 vs B’s 100), giving her priority seems perverse. True prioritarianism weights by *absolute level*, not local range!"  
     *Reply:* "Range compression signals *stakes*, not wellbeing. If A’s options are terrible, improving her lot might be urgent – but that’s a separate ethical judgment. My rescaling answers: ‘What does a +1 utility change *mean* for each person in this choice?’ Here, +1 is everything to A, trivial to B. For absolute levels, add a prioritarian transform *after* aggregation."  
     *Soft spot:* Blurs measurement and ethics. You need to argue that stakes matter independently.  

  4. **The Sen-ish Social Choicer** (informational/invariance):  
     *Objection:* "Unit-stake uses ratio-scale information (best/worst gaps). But Harsanyi’s theorem only requires interval-scale utilities (unique up to affine transforms). By fixing the ‘unit’ via F, you’re adding information not in the axioms. And if F changes, social orderings aren’t invariant under admissible transformations."  
     *Reply:* "True – but interpersonal comparison *requires* breaking affine invariance. We need a ‘zero’ and ‘unit’. Primary goods, capabilities, etc., do this too. My ‘unit’ is a normalizing convention: ‘1 unit = the stakes in this problem’. Without it, the λ_i are arbitrary. This is the price of cardinal comparability."  
     *Soft spot:* Invites a Rawlsian counter on primary goods.  

  ---  

  ### **Mid-Tier Objections**  
  5. **The Rawlsian (Difference Principle)** (interpersonal comparison):  
     *Objection:* "Utility isn’t interpersonally comparable! You assume we can cardinally compare gains across people. But if utilities are vNM, they’re about risk attitudes, not welfare. A person with high risk tolerance might have a stretched scale – that doesn’t make her suffering matter less!"  
     *Reply:* "vNM utilities *can* be interpreted as welfare measures under uncertainty (e.g., behind a veil of ignorance). Unit-stake calibrates *gains* to local opportunity sets – like your index of primary goods, but using individual valuations. If you reject comparability, you reject *all* weighted aggregation, not just my normalization."  
     *Soft spot:* If vNM utilities encode risk-preference, not welfare, the whole edifice crumbles.  

  6. **The Luck Egalitarian** (responsibility):  
     *Objection:* "Person A cultivates expensive tastes: her ‘best’ is caviar (u=10), ‘worst’ is bread (u=0). Person B is content with bread (u=5). You weight A’s utils 2× B’s (range 10 vs 5). But why reward A’s irresponsibility? Dworkin’s envy test would punish her!"  
     *Reply:* "Unit-stake measures *stakes*, not desert. If A’s welfare is fragile, society might need to prioritize her in *this* choice – but we can hold her responsible elsewhere (e.g., via transfers). My theorem doesn’t solve responsibility; it quantifies impact within F."  
     *Soft spot:* Silent on when stakes reflect choice vs. luck.  

  ---  

  ### **Lower-Tier Objections**  
  7. **The Heterodox Economist** (vNM descriptively false):  
     *Objection:* "People violate vNM axioms! Allais paradox, loss aversion... Basing social welfare on a false model of choice is garbage-in-garbage-out."  
     *Reply:* "I agree vNM is descriptively flawed. But this is normative: *if* we model society as a rational actor under risk (e.g., in constitutional design), vNM is standard. My point is structural: *given* these axioms, here’s how interpersonal comparisons work."  
     *Soft spot:* Doesn’t engage the ‘if’.  

  8. **The Grad Student** (indifference):  
     *Objection:* "What if person A is indifferent over all options in F? Range = 0 → division by zero!"  
     *Reply:* "Exclude A from aggregation over F. If her welfare is unaffected, Pareto implies she’s irrelevant. If she *can* be affected but is indifferent, F is trivial."  
     *Soft spot:* Edge case, but reveals unit-stake’s limitation in static choice.  

  ---  

  ### **The Reply That Must Land**  
  **#1 (Dominated Options):** Emphasize: "Stakes are *inherently contextual*. We don’t ask ‘what’s the value of a dollar?’ abstractly – we ask ‘in this economy’. Similarly, utility units are tied to F. If we pollute F with infeasible options, we corrupt the measurement. In real policy, F is constrained."  

  ### **The Question You Hope Nobody Asks**  
  **"In sequential decisions, F changes over time. Doesn’t re-scaling at each step cause dynamic inconsistency? (E.g., society ‘regrets’ past choices because new options redefine units.)"**  
  *Why it’s deadly:* Undercuts practical use. *Weak reply:* "Define F as the ex ante choice set (all contingencies)." → But this assumes impossible foresight. Better: "Concede this. My framework is for one-shot aggregation. For dynamic consistency, fix units at the constitutional stage." → But then units aren’t stake-sensitive.  

  **Preemptive strike in talk:** At 25:00, say: "One implication: weights are *local to F*. If you change the menu, you may change the social ordering. I argue this is right: stakes depend on context. But it means we must define F carefully – not as ‘all imaginable worlds’, but ‘choices we actually face’."  

  ---  
  *Final note:* You haven’t reinvented prioritarianism – you’ve *derived* an additive rule the prioritarian can use. The theorem buys you this: **additivity isn’t assumed; it’s forced by ex ante Pareto + vNM social rationality.** Unit-stake is just a normalization that makes weights track stakes.
