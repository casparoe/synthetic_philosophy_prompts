  First, I need to recall if there's an established term. "Expressive responding" comes to mind but doesn't cover the convergence in language. "Moral reframing" is usually strategic, which they say this isn't. "Conceptual creep" might be part of it, but not comprehensive. 

  The key elements are: homogenization of vocabulary towards a specific moral framework (harm/equality), divergence in underlying motivations, polarization despite shared language, mutual attribution of bad faith, and unconscious adoption of the opposing side's terms. 

  I should check if "preference falsification" fits. That's about concealing true preferences due to social pressure, which aligns with the dialectical cost aspect. But their phenomenon involves unconscious adoption, not just concealment. 

  Maybe "rhetorical capture"? But that's strategic. The user's case shows respondents genuinely believe they're using the terms sincerely. 

  Since no existing term seems to fit perfectly, coining a new term makes sense. "Moral camouflage" emphasizes concealment but might imply intent. "Moral ventriloquism" captures speaking through another's framework unconsciously. "Semantic annexation" suggests one framework dominating without genuine adoption. 

  "Lexical assimilation" could work, highlighting the linguistic convergence without belief change. Pairing it with "polarized sincerity skepticism" covers the mutual bad faith attributions. 

  The definition needs boundaries. Must-haves: vocabulary homogenization towards opponent's framework, underlying motivations unchanged, polarization increasing, mutual bad faith attributions, unconscious adoption. 

  Nearest neighbors: deliberate reframing (intentional vs. unconscious), confabulation (explaining reasons vs. adopting opponent's language), preference falsification (social pressure vs. dialectical cost). 

  For the project's direction: this phenomenon undermines using shared reasons as neutral ground. If both sides use the same terms but with different psychological roots, the disagreement isn't resolvable through those terms. The bad faith attributions are a symptom, not a diagnosis. The deeper issue is incompatible moral foundations masquerading as factual disagreements.
answer: |-
  Based on your meticulous description and the exclusion of common alternatives, this phenomenon **does not have a single, widely established term** in political theory or moral psychology. It synthesizes elements from several concepts but forms a distinct configuration. The closest existing ideas fall short:

  1.  **"Preference Falsification" (Timur Kuran):** Captures the *costly* aspect and divergence between stated/public and private reasons due to social pressure. **Falls short:** It doesn't inherently explain the *specific direction* of convergence (towards harm/welfare/equality), the *unconscious* nature you observe, or the *mutual attribution of bad faith/polarization dynamic*. It's often framed as strategic concealment, not unconscious adoption of the opponent's frame.
  2.  **"Expressive Responding" / "Symbolic Attitudes":** Highlights reasons offered for social desirability/identity signaling rather than causal beliefs. **Falls short:** Doesn't explain the *homogenization towards a specific, opponent-dominant frame*, the *costliness* to one's own audience, or the *polarization consequence*.
  3.  **"Moral Reframing" (Psych/PoliSci):** Involves deliberately recasting arguments in terms the target audience values. **Falls short:** Central to your case is the *lack of consistent deliberateness* (respondents report it sincerely) and that it's often *dialectically costly* to the speaker's own in-group.
  4.  **"Confabulation" (Psych):** Explains the gap between cause and stated reason. **Falls short:** Doesn't explain the *directional convergence* (why *these* specific reasons?), the *socio-political pattern* of polarization, or the *mutual bad faith attributions*.
  5.  **"Conceptual Creep" / "Moral Expansion":** Describes how concepts like "harm" expand in scope. **Falls short:** Explains the *availability* of the vocabulary but not its *adoption by opponents* for different underlying reasons, the *polarization*, or the *bad faith attributions*.

  **Coined Term & Definition: "Lexical Assimilation with Polarized Sincerity Skepticism" (LAPSS)**

  *   **Definition:** A socio-political phenomenon characterized by:
      *   **(A) Lexical Assimilation:** The widespread, often unconscious, adoption of a dominant moral vocabulary (specifically, harm/welfare/equality frameworks) for public justification *across* opposing groups, even when this vocabulary misrepresents or poorly captures the underlying motivational roots (e.g., order, loyalty, purity, integrity) driving the positions of one group. This assimilation occurs despite being potentially dialectically costly within the assimilating group's own community.
      *   **(B) Polarized Sincerity Skepticism:** The paradoxical consequence whereby this shared vocabulary, instead of facilitating convergence, fuels polarization and mutual distrust. Each group interprets the other's use of the shared lexicon as evidence of *bad faith* – insincere strategic posturing rather than genuine commitment to the stated values – precisely because the stated values fail to produce agreement on conclusions. This skepticism is roughly symmetrical and becomes a core feature of inter-group perception.

  **Boundaries & Discriminants:**

  1.  **Essential Elements (Must be Present):**
      *   Homogenization of *stated justifications* towards a specific moral framework (Harm/WE).
      *   Divergence between stated justifications and best-predictive *underlying motivations* for a significant subgroup.
      *   Stable or increasing *polarization* in *verdicts/positions*.
      *   Mutual attribution of *bad faith/insincerity* based on the failure of shared reasons to produce agreement.
      *   The adoption process involves a significant degree of *unconsciousness or lack of deliberate strategy* by the assimilators (evidenced by surprise, reported sincerity).
      *   The assimilated vocabulary is perceived as dominant or originating from the *opposing group's discursive framework*.

  2.  **Nearest Neighbors & Discriminants:**
      *   **Deliberate Reframing:** LAPSS requires evidence of unconsciousness/lack of strategy (e.g., respondent surprise, sincerity reports) and dialectical cost *within* the assimilator's group. Deliberate reframing is strategic and audience-targeted without internal cost.
      *   **Confabulation:** LAPSS specifically involves adopting the *opponent's dominant moral framework*, not just any post-hoc reason. Look for the *directionality* (towards Harm/WE) and the *socio-political polarization/bad faith dynamic* absent in individual confabulation.
      *   **Expressive/Cheap-Talk Responding:** LAPSS involves adopting a *specific, costly* vocabulary (Harm/WE) rather than generic social desirability. Crucially, it's *costly* within the speaker's in-group, unlike pure cheap talk. The polarization consequence is key.
      *   **Status-Seeking Moral Speech:** This is usually about signaling within one's *own* group. LAPSS involves adopting the *other* group's frame, often at cost within one's *own* group. The bad faith attribution is *inter-group*, not intra-group status competition.
      *   **Genuine Conceptual Change/Weight Disagreement:** LAPSS is distinguished by the *persistence of divergent underlying motivations* despite shared vocabulary, and the *attribution of bad faith*. Genuine conceptual change would show shifting motivations *towards* the new vocabulary; weight disagreement assumes sincerity on the shared values. LAPSS shows vocabulary change *without* motivational convergence or perceived sincerity.
      *   **Preference Falsification:** While overlapping in concealment, LAPSS is characterized by *assimilation into a specific, opponent-associated framework* and the *polarized sincerity skepticism* dynamic. Preference falsification can involve hiding one's view using *any* acceptable cover, not necessarily the opponent's frame, and doesn't inherently generate this specific distrust spiral.

  **Implications for Your Project's Direction: What LAPSS Does (and Doesn't) License**

  1.  **Undermines the "Neutral Court of Appeal":** LAPSS directly challenges the idea that convergence on a vocabulary of reasons (Harm/WE) signifies a move to genuinely shared, neutral ground where disputes can be fairly adjudicated on "the merits" within that framework. The vocabulary is shared, but the underlying *commitment* to it, the *meaning* assigned to its terms, and the *motivational weight* it carries are not. Using Harm/WE language becomes a necessary condition for participation in the *appearance* of reasoned discourse, not evidence of a shared justificatory foundation.
  2.  **Reveals a Symptom of Deep Divergence:** LAPSS is powerful evidence that the surface-level convergence in language masks a *deepening* divergence in the fundamental moral psychologies or "foundations" (à la Haidt) driving the groups. The shared vocabulary is a thin veneer over incompatible ways of experiencing and valuing the social world.
  3.  **Mutual Bad Faith Attributions ARE a Core Symptom:** These attributions are not merely an *additional* symptom; they are the *inevitable, constitutive consequence* of Lexical Assimilation in a polarized context. When shared reasons fail to produce shared conclusions, and the underlying motivations remain hidden or unacknowledged, the most "economical" explanation *is* insincerity. LAPSS makes these attributions structurally predictable.
  4.  **Does *Not* Prove Sincerity is Always Absent:** LAPSS describes a systematic pattern where sincerity is *perceived* as absent *because* of the configuration. It doesn't preclude that *some* individuals on both sides genuinely hold and argue from Harm/WE principles. However, it suggests that *at the group level*, the *pattern of usage* makes distinguishing genuine commitment from assimilation incredibly difficult, eroding trust in the discourse itself.
  5.  **Shifts the Focus of Analysis:** LAPSS suggests that trying to resolve the dispute *within* the terms of the assimilated vocabulary (Harm/WE) is likely futile or misleading. The real disagreement lies beneath, in the divergent foundational concerns (order, loyalty, integrity vs. individualized harm/equality). Evidence about "who is right" needs to engage with *why* those foundational concerns exist, how they interact, and whether compromises respecting both are possible – *not* just who wins on Harm/WE grounds. It forces the question: Can a polity function when its central conflicts are argued in a vocabulary that systematically misrepresents the values at stake for significant portions of the populace?
  6.  **Highlights a Pathological Communication Loop:** LAPSS creates a self-reinforcing cycle: Assimilation fuels bad faith perceptions, which deepen polarization and distrust, making genuine dialogue across foundational divides harder, which in turn makes assimilation *more* necessary as the *only* permissible language, further fueling bad faith perceptions. Breaking this loop requires acknowledging the foundational divergence and creating space for legitimizing multiple moral vocabularies within public discourse.

  In essence, LAPSS depicts a situation where the *means* of public reason (a homogenized vocabulary) have become decoupled from the *ends* of convergence and mutual understanding, instead functioning as both a symptom of and a mechanism for deeper division and distrust. It doesn't make truth claims impossible, but it radically complicates the idea that shared reasons provide a transparent or neutral court of appeal, pointing instead to the need to excavate the contested moral foundations beneath the shared linguistic surface.
