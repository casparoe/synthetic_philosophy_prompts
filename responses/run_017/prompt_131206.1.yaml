  ### Designed Activity: The Warehouse Simulation for Symbol Grounding  
  **Objective:** Illustrate the gap between syntactic translation competence and action competence in novel, grounded tasks. Students experience how ungrounded systems can succeed in translation but fail in novel retrieval, while grounded systems succeed in retrieval.

  ---

  ### **Rules and Materials**  
  #### **Core Setup**  
  - **Warehouse Setup**:  
    - **10 distinct objects** (e.g., hardware parts like bolts, gears, springs) with **3 measurable properties**:  
      - *Weight*: Light (1), Medium (2), Heavy (3).  
      - *Texture*: Smooth (1), Rough (2), Bumpy (3).  
      - *Flexibility*: Rigid (1), Slightly Flexible (2), Very Flexible (3).  
    - Objects are hidden in **closed bins** labeled with opaque codes (e.g., Bin A: (1,2,1), Bin B: (2,3,2)).  
    - **Critical design**: Only one object has the combination (1,1,1) ("light, smooth, rigid"). Other combinations are unique but avoid obvious patterns (e.g., no (1,1,1) in training corpus).  

  - **Roles** (for 14 students):  
    - **2 Inspectors**: Can touch objects. Use **3 fixed measurement tools** (scale, texture gauge, flex tester) that output numbers (1-3) for each property. Record codes on a manifest.  
    - **8 Analysts**: Never touch objects. Receive:  
      - Manifest (Warehouse 1 codes for all 10 objects).  
      - Parallel corpus (5 objects with Warehouse 1 and Warehouse 2 codes).  
      - Task: Derive translation rules between codes.  
    - **2 Pickers**: Behind a screen. Retrieve bins using codes provided.  
    - **2 Observers**: Track failures/insights for debrief.  

  - **Codes**:  
    - *Warehouse 1 (WH1)*: Direct measurement output (e.g., (2,1,3) = medium weight, smooth, very flexible).  
    - *Warehouse 2 (WH2)*: Syntactic transformation of WH1 (e.g., WH1 (A,B,C) → WH2 (B, C, A+1) with wrap: 3+1→1).  
    - **Parallel Corpus** (5 objects): Pre-generated WH1/WH2 pairs (e.g., WH1 (1,2,3) → WH2 (2,3,2)).  

  #### **Key Restrictions**  
  - Inspectors: Can **only** record numbers from tools (no descriptions, no peeking at bins).  
  - Analysts: Can **only** use the corpus/manifest (no contact with inspectors or objects).  
  - Pickers: Retrieve bins **only** by matching codes (no inspecting objects).  
  - Facilitator: Uses **scripted prompts** (below); avoids terms like "meaning" or "grounding."  

  #### **Scoring**  
  - No money. Use **public tally** for:  
    - Translation accuracy (Phase 1): +1 per correct rule/test.  
    - Retrieval success (Phase 2): +1 for correct bin, -1 for wrong bin.  
    - Observers award "competence points" for rigor (e.g., careful measurement, rule consistency).  

  ---

  ### **Timeline (75 Minutes)**  
  #### **Phase 1: Translation Success (30 min)**  
  *Goal: Analysts build perfect translation rules; syntactic competence shines.*  
  - **0–5 min**: Introduction.  
    - Facilitator: "We’re simulating a warehouse. Inspectors measure parts and record codes. Analysts translate codes between warehouses. Pickers fetch bins. Observers track rigor. Rules: No describing parts; no sharing beyond your role." Assign roles.  
  - **5–15 min**: Inspection.  
    - Inspectors measure 10 objects, record WH1 codes on manifest (e.g., "Bin A: (1,2,1)").  
    - Analysts receive corpus (5 WH1/WH2 pairs) and start deriving rules.  
  - **15–25 min**: Rule-Building.  
    - Analysts derive WH1→WH2 rules (e.g., "WH2 = (B, C, A+1)").  
    - Facilitator: "Translate the manifest into WH2. Verify by translating back."  
  - **25–30 min**: Test Translation.  
    - Facilitator tests with novel codes: "Translate WH1 (3,1,2) to WH2." (Answer: (1,2,1)).  
    - Analysts succeed; tally points. **Syntactic victory!**  

  #### **Phase 2: Retrieval Failure (30 min)**  
  *Goal: Ungrounded systems fail novel retrieval; grounded system succeeds.*  
  - **30–40 min**: Grounded Retrieval (Inspectors + Pickers).  
    - Facilitator: "Client needs a part that is light, smooth, and rigid. Inspectors: Generate the code."  
    - Inspectors measure properties → code (1,1,1). Give to Pickers.  
    - Pickers retrieve bin (1,1,1). Success! Tally points.  
  - **40–50 min**: Ungrounded Retrieval (Analysts + Pickers).  
    - Facilitator: "Same request: light, smooth, rigid. Analysts: Provide the WH1 code."  
    - Analysts **fail** (no property meanings; corpus has no language).  
    - After 5 min, Facilitator: "Use WH2 for the request." Analysts guess (e.g., (1,1,1) in WH2).  
    - Pickers retrieve bin → wrong object. Failure!  
  - **50–60 min**: Double Ungrounded Failure.  
    - Facilitator: "The client sent a WH2 code for ‘light, smooth, rigid.’" (Arbitrarily assigns WH2 (1,1,1)).  
    - Analysts translate to WH1 (e.g., (3,1,1) if WH2 (1,1,1) → WH1 (C-1, A, B) = (1,1,3)?).  
    - Pickers retrieve → wrong bin. Failure! **Observers note agreement ≠ correctness.**  

  #### **Debrief (15 min)**  
  - **60–70 min**: Map Activity to Theory.  
    - Facilitator: "Phase 1: What made translation work?" (Syntax, rules, coherence).  
    - "Phase 2: Why did retrieval fail?" (No sensorimotor link; codes arbitrary without measurements).  
    - "When two codes agreed (WH1/WH2), why did both fail retrieval?" (Unanchored symbols).  
    - **Symbol grounding problem**:  
      - Translation success → internal coherence (Searle’s syntax).  
      - Retrieval failure → lack of referents (Harnad’s "symbol tethering").  
  - **70–75 min**: Address Objections and Limits.  
    - Predictable issues:  
      - *Smuggling language*: Enforce codes-only; if violated, remind: "This is a syntactic system."  
      - *Easy retrieval*: Use subtle property differences (e.g., "rigid" vs. "slightly flexible").  
      - *Analysts negotiating meanings*: Intervene: "You only have codes and corpus."  
    - **Limits of the activity**:  
      - Success on novel probes is **necessary but not sufficient** for grounding (e.g., luck could mimic competence).  
      - **The facilitator’s intentions**: "I defined the codes/measurements. In reality, who grounds the grounder? This is the hard part—intentionality without a designer."  
    - **Close on the objection**: "We simulated grounding via inspectors, but their tools were given meaning by *me*. If cognition is just symbol shuffling, where do the symbols get their power? That’s the puzzle we’ll explore next week."  

  ---

  ### **Materials Checklist**  
  - **Objects**: 10 bins with distinct property combinations (e.g., 3D-printed parts).  
  - **Tools**: Scale (outputs 1-3), texture gauge (comparison tiles), flex tester (lever with stops).  
  - **Documents**:  
    - Manifest (WH1 codes).  
    - Parallel corpus (5 WH1/WH2 pairs).  
    - WH2 rule: `WH2 = (B, C, A+1)` with wrap (e.g., 3+1→1).  
  - **Room Setup**: Movable tables for role separation; screen for pickers; whiteboard for scoring.  

  ---

  ### **Why This Works**  
  - **Reversal achieved**: Analysts (syntactic heroes) become zeroes; inspectors (grounded) save the day.  
  - **Novelty matters**: Request (1,1,1) is absent from the corpus—forces grounding.  
  - **Double failure**: WH1/WH2 agreement without grounding proves syntax ≠ semantics.  
  - **Debrief structure**: Students articulate the gap before hearing "grounding," making the concept visceral.  

  This design forces confrontation with the symbol grounding problem through experiential failure, setting up your theoretical discussion for maximum impact.
