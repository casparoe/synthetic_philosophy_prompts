               Tool B: A texture gauge (e.g., a set of textures that the part is compared to, and it outputs 1,2,3).
               Tool C: A flexibility tester (e.g., a device with three levels of flexibility).
            These tools must be designed so that the measurements are objective and repeatable.

          - Bins with labels that can be written on (for Warehouse1 codes). The picker sees the label.
          - Manifest sheets for inspectors.
          - Parallel corpus sheet for analysts.

     Scoring Scheme:

          - We don't have money, so we can use a point system or just qualitative success/failure.
          - For the translation phase, the analysts get a point for each correct translation in the test. They should get full points.
          - For the retrieval test, the grounded system gets a point if they retrieve the correct object. The ungrounded system gets a point only if they retrieve the correct object, which they shouldn't. So the grounded system wins.

     This design should achieve the goal: students experience the asymmetry between translation success and action success, and they feel the reversal.

