prompt: |-
  I lead a four-person forecasting cell at a humanitarian logistics organization, and I have an old undergraduate minor in philosophy plus a graduate degree in statistics, which is to say I know just enough of each to be dangerous. Every week we are handed numbers we are expected to turn into planning decisions: whether to pre-position supplies in a river basin, whether to hold back a contingency budget, whether to brief a country director that a scenario is now "likely." The numbers arrive from three sources our spreadsheets do not distinguish, and I have become convinced that most of our arguments after the fact trace back to that: ensemble outputs from physical models (seasonal climate forecasts, hydrological models), where the number carries an explicitly chance-like interpretation and usually some hindcast record; prices from a small internal prediction market we run among staff, several of whom have partial field access; and structured expert-judgment elicitations, which produce a number that looks identical in a cell to the other two but is somebody's opinion. We are also audited: six months after a decision, a donor or a board member asks why we moved the tents or did not, so whatever we do has to be reconstructible from a written record by someone who was not in the room.

  What I want from you is a written procedure my analysts can run on an incoming number before it enters a planning document. The analysts have real statistics training and no philosophy; the procedure has to be runnable in fifteen to twenty minutes per item, weekly, and its output has to be something our director of operations, who has no patience for epistemology, will actually sign off on. I have been reading about the Principal Principle — the principle that says your credence in an event should equal what you take the objective chance of that event to be, absent inadmissible evidence — and that feels like roughly the right framework, but I cannot hand my team a principle. I need it operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to use the number, and where it hands the rest to a person because the remaining question is one of values rather than facts.

  Two things I want it to get right, and one I want it to catch. A colleague has proposed the shortcut that we simply defer to any source that comes with a calibration curve, on the grounds that a well-calibrated source is tracking something real; I suspect this collapses a distinction I cannot name precisely, because being reliably calibrated across a run of cases looks like one thing and being a report of the chance of this single event looks like another. Relatedly, we routinely let numbers cross that gap by relabeling: an expert judgment gets fed into a model, the model prints a probability, and from then on it travels downstream as though it were a chance. I have started calling this chance laundering, and I want the procedure to detect it. It also has to handle numbers that arrive stale (a basin forecast issued in March is still circulating in June and nobody adjusts it), evidence that leaks the outcome rather than describing the setup (field reports that the short rains have already failed upstream, or that fighting has begun), and the reference-class problem that arises when the record contains nothing quite like the event being forecast.

  Please give me the procedure, then run it on three cases of the shapes we actually see: a seasonal ensemble forecast putting a 40% chance on below-normal rainfall in a region where the model has a thirty-year hindcast and good reliability, arriving the same week as herder reports that the short rains have failed; our internal market implying a 25% chance that a displacement site exceeds capacity within the quarter, when the trader pool is twelve people and three of them were in the field last month; and a vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record, which is precisely the case where I expect your procedure to tell me not to put a number in the memo at all and where my director will push back hardest. Where a step depends on a contested reading of the theory — whether chances are Humean, or whether deference to a calibrated expert is covered by deference to chance at all, or what the time-relativity of a chance really requires of us when a forecast ages — say so, mark your confidence, and tell me which steps are judgment calls dressed up as procedure. And if the framing itself is wrong — if for a large share of our events, conflict onset and displacement above all, there are simply no objective chances to defer to and the Principal Principle does not reach them at all — tell me that plainly rather than handing me a checklist I will over-trust.
reasoning: |-
  We are designing a procedure to evaluate incoming numerical forecasts for use in planning decisions. The goal is to operationalize the Principal Principle, which suggests that we should set our subjective credence in an event to the objective chance of that event, unless we have "inadmissible evidence" (evidence that the objective chance does not account for). The challenge is to distinguish between three types of sources: physical model ensembles (which output objective chances), prediction markets (which aggregate beliefs), and expert judgments (which are subjective).

  The procedure must:
  - Be executable in 15-20 minutes per item.
  - Output a clear recommendation (use, adjust, or reject the number) and an explanation for operations director.
  - Detect "chance laundering": when a subjective judgment is passed through a model and comes out labeled as a chance.
  - Handle stale forecasts, outcome-leaking evidence, and reference class problems.

  Key steps in the procedure:

  1. **Source Identification**: Determine the original source of the number (model ensemble, prediction market, expert judgment). This is critical because the Principal Principle applies directly only to objective chances.

  2. **Check for Objective Chance**: 
     - For model ensembles: If the number comes from a physical model with a well-calibrated hindcast (i.e., it has been tested against historical data and shows reliability), then we treat it as an objective chance. 
     - However, we must check if the model's calibration is over a reference class that is relevant to the current event. If the current event is outside the reference class (e.g., unprecedented conditions), then the model's output may not represent an objective chance for this event.

  3. **Check for Inadmissible Evidence**: 
     - Inadmissible evidence is any information that the objective chance (if it exists) does not account for. This includes:
          - Outcome-leaking evidence (e.g., field reports that the event has already started).
          - Staleness: If the forecast is old and conditions have changed, then the original chance may no longer apply.
          - Any other evidence not incorporated in the chance (e.g., expert knowledge of recent developments).

  4. **Handling Non-Chance Sources**:
     - **Prediction Markets**: These aggregate beliefs but are not objective chances. We can use them as a proxy for group credence, but we must adjust if there are reasons to believe the market is not efficient (e.g., few participants, biased traders). The Principal Principle does not directly apply, but we might use the market probability as a starting point and then adjust for biases.
     - **Expert Judgment**: This is inherently subjective. We treat it as a credence from a calibrated expert. However, we must check if the expert is calibrated and if they have access to inadmissible evidence. Without calibration, we cannot rely on the number as a chance.

  5. **Chance Laundering Detection**: 
     - Trace the history of the number. If the number started as an expert judgment and was then fed into a model that output a probability, then it is not an objective chance. We must flag this and treat it as an expert judgment.

  6. **Staleness Adjustment**:
     - If the forecast is old, we must either update it with a more recent forecast or adjust it based on new information. If we cannot update, we may have to reject the number.

  7. **Reference Class Problem**:
     - If the event has no comparable historical precedent, then any model or expert judgment based on historical data may not be reliable. We should be cautious and possibly reject the number.

  8. **Output**:
     - **Use as is**: If the number is an objective chance and there is no inadmissible evidence, use it.
     - **Adjust**: If the number is an objective chance but there is inadmissible evidence, adjust it by conditioning on the new evidence (if possible) or by expert judgment. If the number is not an objective chance (e.g., expert judgment) but the expert is well-calibrated and we have no additional evidence, we might use it but label it appropriately.
     - **Reject**: If the number is stale and cannot be updated, if there is a reference class problem with no basis for the number, or if the number is laundered and we cannot trace its origin, reject it.

  **The Procedure (Checklist Form):**

  **Step 1: Source Identification**
     - Q1: What is the original source of the number? (Choose one)
          a) Physical model ensemble with hindcast record.
          b) Prediction market.
          c) Expert judgment (individual or structured elicitation).
          d) Other (specify).
     - If the source is a model but the model input includes expert judgment (without which the model wouldn't produce the same output), then it may be laundered. Mark as laundered and treat as expert judgment.

  **Step 2: Check for Objective Chance**
     - Only applies if source is (a) and:
          - The model has a hindcast record of at least 10 years (or other agreed threshold) and is well-calibrated (e.g., reliability diagram shows close to diagonal).
          - The current event falls within the reference class of the hindcast (i.e., similar conditions, no unprecedented factors).
     - If both conditions hold, then label as "Objective Chance". Otherwise, if source is (a) but the conditions fail, then it is not an objective chance for this event. If source is (b) or (c), it is not an objective chance.

  **Step 3: Check for Chance Laundering**
     - If the number has been processed (e.g., an expert judgment was fed into a model and then output as a model probability), then it is laundered. Treat as the original source (expert judgment) and note the laundering.

  **Step 4: Check for Staleness**
     - Q: When was the forecast issued? If more than [agreed time window, e.g., 1 month for seasonal forecasts] ago, then it is stale.
     - If stale, can we get an updated forecast? 
          - Yes: get update and restart procedure with the new number.
          - No: then we cannot use this number as is. We may adjust it if we have new information, but this adjustment is subjective.

  **Step 5: Check for Inadmissible Evidence**
     - Inadmissible evidence is any evidence that the original chance (if it exists) does not account for and that directly affects the event outcome. Examples:
          - Field reports that the event has already started or conditions have changed.
          - Other expert knowledge that was not available when the chance was determined.
     - If there is inadmissible evidence, then we cannot use the chance as is. We must condition on the new evidence (if we have a model to do so) or adjust subjectively.

  **Step 6: Reference Class Check**
     - Q: Is the event being forecast similar to the events in the training/hindcast data (for models) or the calibration set (for experts)? 
          - If the event is unprecedented (e.g., no comparable event in the record) and the model/expert has not been tested on such events, then we have a reference class problem. The number is unreliable.

  **Step 7: Decision Tree**
     - If the number is an objective chance (from Step 2) and:
          - Not stale (Step 4) AND no inadmissible evidence (Step 5) AND no reference class problem (Step 6): **Use as is**.
          - But if there is inadmissible evidence: **Adjust** (if possible by conditioning) or **Reject** (if adjustment is not possible without introducing too much subjectivity).
          - If stale: **Reject** or **Update** (if update available, then use updated; else reject).
          - If reference class problem: **Reject** (or use with extreme caution and note the issue).
     - If the number is from a prediction market:
          - Check the market properties: number of participants, independence, expertise. If the market is thin (e.g., <20 participants) or there is known bias (e.g., some participants have a stake in the outcome), then adjust or reject.
          - Without strong reasons to distrust, we may **Use** but label as "Market Belief" (not chance). If there is inadmissible evidence (e.g., field reports not available to the market), adjust.
     - If the number is from expert judgment:
          - Check if the expert is calibrated (if we have a calibration record). If yes, we may **Use** but label as "Expert Credence". If not calibrated, then we must **Adjust/Reject** based on our trust in the expert and any additional evidence.
          - Also, if there is a reference class problem (expert has never seen such an event), then **Reject**.
     - If laundered: treat as the original source (expert judgment) and apply the above for expert judgment.

  **Output to Operations Director:**
     - A short note: 
          - Source type: [Objective Chance / Market Belief / Expert Credence / Rejected]
          - Status: [Use as is / Adjusted / Rejected]
          - Key reason: [e.g., "Model with good hindcast, no new evidence", "Expert judgment but expert calibrated", "Stale forecast, no update available", "Unprecedented event, no reliable basis"]
          - If adjusted, note the adjustment and why.

  **Limitations and Philosophical Caveats:**
     - **Objective chances may not exist for some events**: In complex social systems (like conflict onset), there might be no objective chances. The Principal Principle might not apply. In such cases, we are forced to use subjective credences. The procedure must flag when an event is of a type that does not have an established objective chance (e.g., conflict, displacement in novel settings).
     - **Calibration vs. Chance**: A well-calibrated source (model or expert) is not necessarily reporting an objective chance. Calibration is about long-run frequency, while chance is about a single case. However, in practice, we often treat a calibrated source as providing a chance. This is a judgment call.
     - **Time-relativity of chances**: Chances are relative to a time. If the forecast is stale, the chance at the time of forecast may not be the same as the chance now. We require updating.

  Now, let's run the procedure on the three cases:

  **Case 1: Seasonal ensemble forecast (40% chance of below-normal rainfall) with a thirty-year hindcast and good reliability, but arriving the same week as herder reports that the short rains have failed.**

  - Step 1: Source is physical model ensemble (objective chance candidate).
  - Step 2: Model has good hindcast and reliability -> objective chance.
  - Step 3: Not laundered.
  - Step 4: Assume it's current (not stale).
  - Step 5: Inadmissible evidence: herder reports that the short rains have failed (this is outcome-leaking evidence). The model's 40% chance did not condition on this (because it happened after the model run). Therefore, we cannot use the 40% as is.
  - Step 6: Reference class: model has 30-year hindcast, so likely covers similar events? But note: the herder report is about the current season, which is already failing. This is a new condition.
  - Step 7: We have inadmissible evidence. We must adjust. We might condition on the new evidence. How? We could ask: what is the chance of below-normal rainfall given that the short rains have already failed? This might be very high (e.g., 90%). But we don't have a model for that. Alternatively, we might use expert judgment to adjust. Since we cannot adjust without introducing subjectivity, we might reject the model output and rely on the herder reports? But the procedure says if we have inadmissible evidence and cannot condition, we reject the chance. However, we must produce a number for planning. 

  **Output for Case 1**: 
     - Source type: Objective Chance (but with inadmissible evidence).
     - Status: Adjusted (to reflect new evidence) or Rejected? 
     - Since we cannot condition formally, we might set the number to a high probability (say 90%) based on the herder report and note that the model is outdated. But this is subjective. Alternatively, we might run the model again with the new data? If that's not possible, we have to use expert judgment. The procedure forces us to flag the issue and adjust subjectively.

  **Recommendation**: Reject the model's 40% and replace with a new assessment (expert judgment) that accounts for the herder reports. The operations director must be told: "The model forecast is outdated by field reports. We assess the probability as 90% based on herder reports of failed rains."

  **Case 2: Internal market implying 25% chance that a displacement site exceeds capacity within the quarter. Trader pool is twelve people, three of whom were in the field last month.**

  - Step 1: Source is prediction market.
  - Step 2: Not an objective chance.
  - Step 3: Not laundered (unless the market is fed by models? Assume not).
  - Step 4: Assume current.
  - Step 5: Check for inadmissible evidence: the three traders in the field might have information not available to others. But the market already aggregates their beliefs, so this is included. However, if there is new evidence after the market closed, that would be inadmissible. Assume none.
  - Step 6: Reference class: we need to know if the market has been calibrated. We don't have a history of the market's performance? We might have to use it without calibration.

  - Step 7: Prediction market with 12 participants. This is a thin market, so it might be inefficient. The presence of field-informed traders is good, but the small size might lead to volatility or bias. Without a calibration record, we cannot be sure. We might use it but note the limitations.

  **Output for Case 2**:
     - Source type: Market Belief.
     - Status: Use as is, but with caution note.
     - Reason: "Market belief from 12 participants, including three with recent field access. However, the market is thin and uncalibrated, so this number should be treated as a rough guide."

  **Case 3: Vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record.**

  - Step 1: Source is a model (but from a vendor, so we need to check what it is). Assume it's a physical model or a statistical model.
  - Step 2: Check for objective chance: 
     - Does it have a hindcast? The problem says there is no comparable event in the record. Therefore, the model's hindcast (if any) does not cover events like this. It's extrapolating beyond its reference class.
     - Thus, it is not an objective chance for this event.
  - Step 3: If the model uses expert judgment to fill the gap (which it likely does), then it might be laundered. We don't know, but without hindcast for such events, it's essentially expert judgment.
  - Step 4: Assume current.
  - Step 5: No specific inadmissible evidence mentioned.
  - Step 6: Reference class: no comparable event -> reference class problem. The model has not been tested for events of this type.

  **Step 7**: The number is unreliable. We should reject it.

  **Output for Case 3**:
     - Source type: Model (but not objective chance due to reference class).
     - Status: Rejected.
     - Reason: "The forecast is for an unprecedented event. There is no historical record to calibrate the model for this scenario. The 0.4% figure is an extrapolation and cannot be trusted."

  **Philosophical Caveats for the Director**:
     - For events that are unique (like Case 3) or involve human decisions (like conflict), there may not be an objective chance. We are forced to rely on expert judgment, but we must be transparent about the uncertainty.

  **Final Note**: The procedure is a tool to force critical thinking. It will not eliminate subjectivity but will make the assumptions explicit. The operations director must be made aware that in many cases (especially social phenomena) we are not dealing with objective chances but with beliefs, and that these beliefs must be updated as new evidence arrives.
answer: |-
  Below is a written procedure for your forecasting cell, designed to operationalize the Principal Principle and address your core concerns (chance laundering, staleness, outcome leakage, reference class problems). The procedure is structured as a checklist with clear questions, decision thresholds, and outputs. It prioritizes speed (15-20 minutes per item) and produces actionable recommendations for your operations director. 

  ### **Key Foundations & Limitations**
  1. **Principal Principle Framework**: Your credence in an event should equal the objective chance *if*:
     - The chance is well-defined (e.g., physical processes with stable frequencies).
     - You lack "inadmissible evidence" (information not accounted for in the chance, like real-time field reports).
  2. **What This Procedure Does**:
     - Distinguishes **objective chances** (e.g., calibrated physical models) from **subjective credences** (e.g., expert judgments, prediction markets).
     - Flags "chance laundering" (subjective inputs rebranded as model outputs).
     - Rejects numbers when no defensible chance exists (e.g., unprecedented events).
  3. **Critical Limitations**:
     - **No Objective Chances for Many Events**: For conflict, displacement, or novel crises, objective chances often *do not exist*. These are driven by human choices, not stable physical laws. The Principal Principle **does not apply** here. We treat these as "subjective credences only" (marked as ⚠️ in the procedure).
     - **Calibration ≠ Chance**: A calibrated source (e.g., a model with a good hindcast) ensures reliability over *many* cases but doesn’t guarantee its number represents a "chance" for a *single* event. We use calibration as a proxy but flag its limits.
     - **Judgment Calls**: Steps marked with ⚠️ require analyst judgment. The procedure forces explicit reasoning but can’t eliminate subjectivity.

  ---

  ### **Procedure: Forecast Source Assessment Checklist**
  **Input**: A number (probability or expected value) for a decision-relevant event.  
  **Output**: One of four recommendations with a plain-language rationale for the operations director:  
  - **USE** (as-is in planning docs).  
  - **ADJUST** (modify number or confidence; document changes).  
  - **CONTEXT ONLY** (use narrative insights but omit the number).  
  - **REJECT** (do not use; seek alternatives).  

  **Time Allocation**: Strictly 15-20 minutes. Focus on rapid triage using available metadata (e.g., source documentation, timestamps, calibration records). No deep analysis.

  #### **Step 1: Identify Source & Detect Chance Laundering** (⏱️ 3 min)  
     - **Question**: What is the **original source** of this number?  
       - (A) Physical/statistical model ensemble (e.g., climate, hydrological).  
       - (B) Prediction market or betting pool.  
       - (C) Structured expert judgment.  
       - (D) Vendor/black-box model (treat as C if inputs include expert opinions).  
     - **Chance Laundering Check**:  
       - Is this number the output of a model **that ingested expert judgments** (e.g., human-adjusted parameters, Delphi inputs)? → **Yes = Laundered**.  
       - **Action**: Reclassify as (C) and note: "Laundered expert judgment."  

  #### **Step 2: Assess Chance-Like Properties** (⏱️ 5 min)  
     - **Question**: Does this number represent an **objective chance**?  
       - Only possible if source is (A) *and* all below hold:  
         - ⚠️ **Calibration**: The model has a hindcast/reliability record showing calibration (e.g., events predicted at *X%* occur ~*X%* of the time).  
         - ⚠️ **Reference Class**: The current event is comparable to hindcast events (e.g., similar climate drivers, geography). If unprecedented, reject.  
         - **Non-Laundered**: No expert inputs altered core probabilities.  
       - **If all yes → Objective chance**. Proceed to Step 3.  
       - **If no → Subjective credence**. Proceed to Step 4.  
     - **Key Exception** (⚠️ Philosophy): For events like conflict onset, assume **no objective chance exists** regardless of source. Skip to Step 4.  

  #### **Step 3: Handle Objective Chances** (⏱️ 3 min)  
     - **Question 3.1**: Is the chance **stale**?  
       - Age > tolerable window (e.g., >1 month for seasonal forecasts; >1 week for conflict risks).  
       - **Action**:  
         - Stale + no update? → **ADJUST or REJECT**. Rationale: "Chances are time-relative; outdated."  
         - Not stale? Keep.  
     - **Question 3.2**: Is there **inadmissible evidence**?  
       - Evidence not reflected in the model (e.g., field reports of rains failing *after* model run).  
       - **Action**: Inadmissible evidence present? → **ADJUST or REJECT**. Rationale: "New evidence overrides chance."  

  #### **Step 4: Handle Subjective Credences** (⏱️ 5 min)  
     - **Applies to**: Sources (B), (C), (D), or laundered/uncertain (A).  
     - **Question 4.1**: Is the source **calibrated or credible**?  
       - (B) Prediction market: ≥20 independent traders? Historical calibration? No → Thin/unreliable.  
       - (C) Expert judgment: Past predictions calibrated? No → Uncalibrated.  
       - **Action**:  
         - Calibrated/credible? → **USE (with caveats)**. Rationale: "Credible but subjective."  
         - Uncalibrated? → **CONTEXT ONLY or REJECT**.  
     - **Question 4.2**: Is there **outcome-leaking evidence**?  
       - E.g., reports that the event is already unfolding (failed rains, fighting).  
       - **Action**: Leaking evidence? → **REJECT number**. Rationale: "Number contradicted by real-time evidence." Use narrative only.  
     - **Question 4.3**: **Reference class mismatch**?  
       - Event has no historical parallels (e.g., unprecedented flooding).  
       - **Action**: Mismatch? → **REJECT**. Rationale: "No basis for quantification."  

  #### **Step 5: Final Recommendation & Rationale** (⏱️ 2 min)  
     - **Output Template for Operations Director**:  
       ```  
       [USE / ADJUST TO [X] / CONTEXT ONLY / REJECT]  
       Source: [e.g., Climate model, expert judgment, laundered]  
       Rationale: [2-3 bullet points]  
       ```  
     - **Enforce Reconstruction**: All answers and metadata (e.g., calibration records, timestamps) must be recorded in your tracking system.  

  ---

  ### **Procedure Applied to Your Three Cases**
  **Case 1**: Seasonal ensemble forecast (40% below-normal rainfall) + herder reports (rains failed).  
  - **Step 1**: Source (A) – Physical model. No laundering detected.  
  - **Step 2**: Model has 30-year hindcast/good calibration → **Objective chance**.  
  - **Step 3**:  
    - 3.1: Assume not stale (current forecast).  
    - 3.2: Herder reports (failed rains) are **inadmissible evidence** (not in model run).  
  - **Step 5**: **ADJUST or REJECT**  
    - **Rationale**: "Model chance outdated by field evidence. Do not use 40%. Herder reports suggest >90% likelihood of below-normal rain."  
    - **Director Note**: "We discard the model number due to new field data. Recommend pre-positioning."  

  **Case 2**: Internal market (25% displacement site exceeds capacity). Trader pool=12 (3 with field access).  
  - **Step 1**: Source (B) – Prediction market.  
  - **Step 2**: Not objective chance (subjective credence).  
  - **Step 4**:  
    - 4.1: Thin market (12 traders). No calibration history → **Unreliable**.  
    - 4.2: Field access by traders may include real-time insights. If site is *already* near capacity, this leaks outcomes → **Reject number**.  
    - 4.3: Assume reference class ok (past site overflows).  
  - **Step 5**: **CONTEXT ONLY or REJECT**  
    - **Rationale**: "Thin market; field inputs may leak outcomes. Use qualitative insights (e.g., 'moderate risk') but omit 25%."  
    - **Director Note**: "Market number unreliable. Recommend contingency budget but do not cite 25%."  

  **Case 3**: Vendor model (0.4% annual flood displacement probability). No comparable events.  
  - **Step 1**: Source (D) – Vendor model. Assume chance laundering (likely expert inputs). → **Reclassify as (C)**.  
  - **Step 2**: ⚠️ **No objective chance** (conflict/displacement = no stable frequencies). Proceed to Step 4.  
  - **Step 4**:  
    - 4.1: Vendor model uncalibrated for this event → **Unreliable**.  
    - 4.3: **Reference class mismatch** (no comparable floods).  
  - **Step 5**: **REJECT**  
    - **Rationale**: "Unprecedented event; no basis for probability. Vendor model likely laundered expert guess."  
    - **Director Pushback Script**: "We cannot quantify unprecedented risks. Using 0.4% implies false precision. Recommend narrative: 'Low plausibility but high impact; prep contingency triggers.'"  

  ---

  ### **Critical Judgment Calls & Philosophical Notes**
  1. **Objective Chance Existence** (Step 2):  
     - ⚠️ **Contested**: Humeans say chances are *only* patterns in data (no "metaphysical" chances). Your analysts should reject "chance" for events without frequentist data (e.g., novel conflicts).  
     - **Confidence**: High for physical events (e.g., rainfall); low for social events (e.g., displacement).  
     - **Action**: Assume no objective chances for conflict/displacement. Override Step 2 for these cases.  

  2. **Calibration as Chance Proxy** (Step 2):  
     - ⚠️ **Contested**: Calibration ensures reliability but doesn’t make a single-case number a "chance." This is a pragmatic compromise.  
     - **Confidence**: Moderate. Use only if reference class matches.  

  3. **Time-Relativity of Chances** (Step 3.1):  
     - ⚠️ **Contested**: Chances change over time. A stale forecast is not just outdated—it’s a *different* chance. Hindcasts can’t resolve this.  
     - **Action**: Reject numbers >1 month old without updates.  

  ### **When the Framing Fails**
  **For conflict, displacement, or novel crises**:  
  - The Principal Principle **does not apply**. There are no objective chances—only subjective credences.  
  - **Procedure Safeguard**: Step 2 explicitly rejects "chance" for these events. Use **CONTEXT ONLY** or **REJECT** for numbers.  
  - **Analyst Guidance**: Replace numbers with scenarios (e.g., "plausible," "unlikely") and document why quantification failed.  

  This procedure forces explicit reasoning about sources, laundering, and chance existence. It will reject more numbers than your status quo—especially for social risks—but prevent over-trusting laundered or baseless probabilities. Test it for 2-3 weeks and refine thresholds (e.g., staleness windows) with your team.
