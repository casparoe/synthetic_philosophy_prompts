prompt: |-
  I'm a philosophy PhD student working on the epistemology of mathematics, and this term I'm running the discussion sections for Computation and Mind, a mixed-enrollment course — about fifteen students, mostly second-year computer science majors with a scattering of philosophy majors, all of whom have had discrete math and a formal-languages course where Turing machines were simply defined and then used as a tool. Nobody has ever asked them why we are entitled to identify that definition with the informal notion of a procedure a person could carry out by rote, so right now I expect they'll think I'm asking them to doubt something they've successfully treated as a definition all year. I have one seventy-five-minute section, a blackboard, and no handout. The topic is the epistemic status of the Church–Turing thesis. I don't need the thesis explained to me; I need a plan for getting them to see that there is a real question here at all.

  Here is roughly where I've gotten to on my own. I want to separate three things they currently run together: the mathematical thesis (that the independently motivated formalisms — Turing machines, general recursive functions, the lambda calculus, register machines — all pick out the same class of functions), the physical thesis (that nothing implementable in the actual world outdoes that class), and the psychological thesis (that human mathematical capacity doesn't either). I also want to separate two very different-looking reasons for accepting the mathematical thesis — the sheer convergence of the formalisms, and the fact that decades of attempts to describe a stronger but still mechanical procedure have quietly collapsed back into the same class — and then ask why neither looks like evidence that would move someone who wanted a physical hypercomputer. I've been calling the first the licensing role of the thesis: it's what entitles anyone to move from computable-by-my-favorite-formalism to computable, full stop. I've been calling the second the definitional-retreat problem: every candidate counterexample gets reclassified as not really a procedure rather than counted as a refutation, which makes me suspect the whole thing has quietly become unfalsifiable. My supervisor suggested framing the thesis as a calibration principle — not a prediction you test but a stipulation that lets an entire apparatus of results about computability speak at all — but I don't know whether that framing survives contact with students who have never seen a physics-flavored counterexample.

  So: give me the teaching plan, not the explanation. What has to be on the board, and in what order, before the question of the thesis's status can even look like a question rather than a quibble about words — I assume the informal/formal asymmetry has to come first, but tell me if something else has to precede even that. What single concrete case should carry the session: I'm inclined toward a specifiable but non-Turing-computable function (the halting problem, or the Busy Beaver function) paired with one candidate physical device that would decide it — either an accelerating machine performing a supertask or a machine exploiting relativistic time dilation — so tell me which of those two devices to actually draw, what the carrying example must have (concretely describable, mechanically specifiable, not smuggling in an oracle) and what it must lack, and why the example you pick is better equipped to carry the epistemic point than the obvious alternatives. Then the misconception map: which misunderstandings to expect in a mixed computer-science-and-philosophy room, and where in the sequence each one should be headed off rather than merely corrected after the fact. My guesses are that they'll say that Turing proved it in his paper on computable numbers, that quantum computers are about to break it, that calling it a thesis just means nobody has gotten around to proving it, and — among the sharper students — that the physical version is simply very well-confirmed empirical science, which is the one I'm least sure how to answer. Include a question I can ask at the end that would tell me whether they've grasped the structure of the dispute rather than learned to repeat the slogan that it's a thesis and not a theorem, and tell me plainly what I should refuse to settle in seventy-five minutes and say out loud that I'm refusing. If the calibration-principle framing will mislead this particular audience, say so and give me what to put in its place.

  Format: exactly eight numbered items, each two or three sentences, with no introduction and no conclusion. Make item 8 your confidence note: how confident you are in the plan overall, and which one of the preceding items you are least sure about, and why.
reasoning: |-
  Okay, the user is a philosophy PhD student teaching a mixed-enrollment course on Computation and Mind. They need a lesson plan to help students see the epistemic question behind the Church-Turing Thesis (CTT). The students are mostly CS majors who've used Turing machines as a tool without questioning why the formal definition matches the informal notion of a mechanical procedure. 

  The user has already identified key distinctions: mathematical thesis (equivalence of formalisms), physical thesis (physical realizability), and psychological thesis (human computability). They also want to separate two reasons for accepting the mathematical thesis—convergence of formalisms and failed counterexamples—and examine why these don't convince proponents of physical hypercomputation. Their supervisor suggested framing CTT as a "calibration principle," but the user is unsure if this works for students unfamiliar with physics-based counterexamples.

  Hmm... the core challenge is making the epistemic status feel like a real problem, not just semantics. Students likely think CTT is either proven (due to Turing's paper) or trivially true by definition. Need to disrupt this complacency by forcing a confrontation between formal definitions and informal intuitions. 

  First, I'll start by highlighting the informal/formal asymmetry. Write "computable (informal)" vs "Turing-computable (formal)" on the board to create cognitive tension. Then introduce a concrete physical hypercomputation example—say, an accelerating Turing machine computing the halting problem via supertasks. This makes the physical thesis tangible. 

  Next, contrast the mathematical consensus (all formalisms agree) with the physical question (can we build this machine?). Point out that equivalence proofs don't address physical realizability. Then tackle definitional retreat: when counterexamples emerge (like quantum computing), we often redefine "mechanical procedure" instead of rejecting CTT. This exposes its unfalsifiability risk. 

  For misconceptions: preempt "Turing proved it" by clarifying his paper only formalized computability; address quantum computing by distinguishing speedup from computability class breaks. The sharp student's "well-confirmed science" point is trickiest—counter by noting CTT's role as a framework enabling empirical claims (e.g., "quantum computers don’t solve uncomputable problems"), not a testable hypothesis itself. 

  End with a diagnostic question: "If we built a device that outputted Busy Beaver values, would that refute CTT? Why might someone disagree?" This tests if they grasp the physical/mathematical split and definitional retreat. 

  Confidence: 80%. Least sure about item 5 (handling "well-confirmed science")—students might not buy that CTT is presuppositional rather than empirical. Might need more concrete analogies from other sciences.
answer: |-
  1. **Board Setup & Informal/Formal Asymmetry**: Start with two columns: "Computable (Informal Idea)" and "Turing-Computable (Formal Definition)". Ask students to describe the left column ("what a person could do by rote") and define the right (Turing machine). Stress that the definition was *chosen* to match the informal idea – that’s the thesis, not a proven fact. This forces awareness of the gap.  

  2. **Concrete Challenge Case**: Introduce the Halting Problem as undecidable by any Turing machine. Present a specific **accelerating Turing machine (ATM)**: draw a machine that completes step 1 in 1/2 minute, step 2 in 1/4 minute, etc., deciding the Halting Problem in 1 minute total. Emphasize its mechanical specifiability (no oracle) and apparent violation of Turing-computability. This makes the physical thesis tangible.  

  3. **Separate the Mathematical Consensus**: List formalisms (Turing machines, λ-calculus, etc.) and note their *proven* equivalence. Stress this is a theorem about formal systems – it says nothing about the ATM or human cognition. Write "Mathematical Thesis = Formalisms Coincide (PROVEN)".  

  4. **The Physical Question & "Evidence" Problems**: Ask: "Does the ATM refute the Church-Turing Thesis?" Challenge why the *mathematical* convergence isn’t relevant here (it doesn’t address physics). Preempt the "well-confirmed science" objection by noting CTT’s role: it’s the *framework* defining "computable" for empirical claims (e.g., "no physical system computes beyond TMs") – it can’t be confirmed *within* that framework like ordinary science.  

  5. **Definitional Retreat Trap**: Pose: "If someone built the ATM, how might a defender of CTT respond?" Predict reclassification ("not a *procedure*" due to supertasks/infinite energy). Highlight that this makes CTT potentially unfalsifiable – a weakness, not strength. Counter the "quantum breaks CTT" misconception here: clarify quantum computers compute TM-computable functions (faster), not beyond.  

  6. **Calibration Principle (Carefully)**: Frame CTT not as a testable claim but as the **license** allowing formal results (like undecidability) to apply to real-world claims. Write: "CTT: What lets 'computable' in theorems mean *actually* computable?". Note this avoids misleading predictions but raises the epistemic question: why accept *this* calibration?  

  7. **Diagnostic Question & Scope Limit**: End by asking: **"If we built a device outputting Busy Beaver values, would it refute CTT? What two fundamentally different disagreements could arise?"** (Answer: Physical reality vs. redefining "procedure"). Explicitly state: "We won’t settle the status today; we’re exposing *why* it’s contested and non-trivial."  

  8. **Confidence Note**: 85% confident. Least sure about **Item 5 (Definitional Retreat)** – students may struggle to see reclassification as epistemically problematic rather than just "correcting a mistake." Emphasize it risks making CTT immune to counterevidence.
