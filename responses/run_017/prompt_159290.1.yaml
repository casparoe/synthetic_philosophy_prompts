prompt: |-
  My roomate and I spent two hours last night fighting about quantum immortality and I think we were arguing about totally different things, so I want the spec, not the verdict. Write me the desiderata a theory of identity over time has to meet before the quantum-suicide argument can even get off the ground, with the purpose fixed: I want a theory good enough to tell you whether "there's always some branch containing a live survivor" gives you any reason at all. So: the cases it has to get right, each with the consideration behind it. Starter list from me: ordinary death, which shouldn't become mysterious; the partial-hit run where the device fires but leaves a live and badly damaged subject, since the theory has to say whether that damaged subject is the thing whose interests are being weighed; the iterated runs, where after n trials the surviving branch carries amplitude on the order of 2^-n and at some point I want to say it stops being a well-defined person and is just noise swamped by interference from everything else; the amnesia variant, where instead of killing you the device wipes your memory, because a psychological-continuity theory has to say the whole argument collapses there and I want to know if that's a feature or a bug; and the witness case, where a friend watches the whole thing and sees you die, which needs an account of why your evidence and hers come apart without either of you being irrational. Two more constraints: it can't smuggle in collapse, and it can't make ordinary precautions free — if the view says the parachute doesn't matter because you land alive somewhere, call that a reductio. Flag which items are genuine desiderata and which are just one camp's hangups (I suspect "must give a determinate yes/no about whether the survivor is you" is one of those), and tell me whether any two on the list can't be jointly satisfied, because I think that's actually where our argument was. Which single requirement knocks out the most candidates? Then a few lines each, no table, on how the naive any-branch-continues view, a Parfit-style psychological-continuity view, and a branch-weight approach do against it. Keep it short, I just want to know what we were disagreeing about.
reasoning: |-
  Okay, the user and their roommate spent two hours arguing about quantum immortality but realized they were talking past each other. Now they want a clear specification (the "spec") of what a theory of identity over time must satisfy for the quantum suicide argument to even be relevant. The focus isn't on whether quantum immortality is true but on the prerequisites for the argument to make sense. 

  The user provided a starter list of cases the theory must handle: ordinary death (shouldn't be mysterious), partial-hit scenarios (is the damaged survivor still "you"?), iterated runs (when does low amplitude make survival meaningless?), amnesia variants (if memory wipe replaces death, does the argument fail?), and witness cases (why does observer evidence diverge?). They also added two constraints: no smuggled wavefunction collapse, and no trivialization of ordinary risks (like parachutes not mattering). 

  I need to categorize which requirements are core desiderata versus optional preferences. The user suspects that demanding a binary "is it you?" answer might be optional. They also want to know if any requirements conflict and which one eliminates most theories. 

  First, let's map the cases to underlying principles. Ordinary death tests non-magical realism—death should be irreversible cessation. Partial-hit runs probe the theory's handling of severe disruption: is identity preserved through radical change? Iterated runs challenge whether low-probability branches sustain identity or become noise. Amnesia variants test if psychological continuity is necessary: if wiping memory invalidates the argument, is that coherent? Witness cases require explaining subjective/objective evidence splits without irrationality. 

  Constraints: No collapse means the theory must work in pure Everettian QM. No trivial risks means it can't imply safety in ordinary danger. 

  Now, desiderata vs. preferences. Core desiderata should include:  
  - Non-mysterious death (realism)  
  - Evidence asymmetry explanation (for witness case)  
  - No collapse smuggling (Everett compliance)  
  - No risk trivialization (practicality)  

  Preferences might be:  
  - Binary survival judgments (user suspects this)  
  - Handling amnesia as death-equivalent (if Parfitian)  

  Conflicts likely arise between evidence asymmetry and no trivial risks. If "you" always survive in some branch, why care about parachutes? But the theory must avoid that. Also, iterated runs vs. binary identity: at low amplitudes, it's fuzzy, but demanding yes/no might be impossible.  

  The strictest requirement is probably evidence asymmetry, as it forces subjective immortality without objective guarantees.  

  Now, evaluating three theories briefly:  
  1. Naïve any-branch view: Survives in all non-death branches, but trivializes risk (fails constraint) and can't explain witness divergence.  
  2. Parfitian psychological continuity: Identity requires connected psychology. Amnesia variant kills the argument (survivor isn't "you"), which might be consistent. But iterated low-amplitude branches may lack continuity, and evidence asymmetry needs extra explanation.  
  3. Branch-weight realism: Identity requires non-negligible amplitude. Iterated runs eventually end "you," avoids trivial risk. But must handle amplitude thresholds arbitrarily and explain why low-weight survivors don't count subjectively.  

  Key conflict: User and roommate probably disagreed on whether identity is binary (roommate?) or gradient (user?), or on whether evidence asymmetry overrides objective risk. The evidence asymmetry requirement is likely the biggest hurdle.
answer: |-
  Here's the spec for identity theories in the quantum suicide context, structured as requested. Desiderata are **bold**, constraints are *italic*, and preferences/optional elements are plain text.

  ---

  ### **Core Desiderata** (Must-Haves)  
  1. **Non-Mysterious Ordinary Death**: Death must irreversibly terminate identity. No "you" survives decapitation or cremation.  
     *Why*: Avoids magical thinking.  

  2. **Partial-Hit Handling**: Must specify if a severely damaged survivor (e.g., brain-injured) is still "you" for survival-relevance.  
     *Why*: Determines whether diminished continuity counts.  

  3. **Iterated Run Threshold**: Must address when cumulative low amplitude (~2⁻ⁿ) branches cease sustaining identity.  
     *Why*: Prevents "noise" from counting as survival.  

  4. **Evidence Asymmetry**: Explains why *your* subjective evidence ("I survived!") diverges from a witness's ("You died!") without irrationality.  
     *Why*: Core to quantum immortality’s epistemic argument.  

  5. **Amnesia Variant Consistency**: Must clarify if memory erasure invalidates survival identically to death.  
     *Why*: Tests psychological-continuity theories.  

  ### **Constraints** (Non-Negotiables)  
  - ***No Collapse Smuggling***: Theory must work in pure Everett (many-worlds) QM.  
  - ***No Trivialized Risks***: Must not imply ordinary dangers (e.g., parachutes) are irrelevant.  

  ### **Preferences/Hangups** (Debatable)  
  - Determinacy Demand: "Must give yes/no answer to 'Is survivor you?'" (Likely a hangup; identity may be vague.)  
  - Amnesia-as-Death: Treating memory wipe as identity death (Parfitians insist; others reject).  

  ---

  ### **Conflict Alert**  
  **Evidence Asymmetry + No Trivialized Risks** clash hardest. Asymmetry requires subjective immortality to feel real *for you*, but risk non-trivialization demands that *objective* death probabilities still matter. Most theories fail here.  

  **Most Exclusionary Requirement**: **Evidence Asymmetry**. It forces a subjective-first view of identity, killing objective/third-person theories.  

  ---

  ### **Theory Report Card**  
  1. **Naïve Any-Branch-Continues**  
     - ✅: Trivially satisfies asymmetry (you always "see" survival).  
     - ❌: Fails *No Trivialized Risks* (parachutes don’t matter).  
     - ❌: Fails Iterated Runs (no amplitude threshold).  

  2. **Parfit-Style Psychological Continuity**  
     - ✅: Handles amnesia variant (if memory wiped, "you" die → argument collapses).  
     - ✅: Avoids trivial risks (death in most branches matters).  
     - ❌: Struggles with evidence asymmetry (why is *your* experience privileged?).  
     - ⚠️: Partial-hits depend on vague continuity thresholds.  

  3. **Branch-Weight Realism**  
     - ✅: Solves iterated runs (low amplitude ≈ death).  
     - ✅: Avoids trivial risks (low-weight survival is negligible).  
     - ❌: Fails evidence asymmetry (low-weight "you" still subjectively survives).  
     - ❌: Arbitrary amplitude thresholds.  

  ---

  ### **Where Your Argument Was**  
  You likely disagreed on:  
  - Whether identity requires **binary determinacy** (roommate?) vs. **gradient/contextual** identity (you?).  
  - Whether **evidence asymmetry** is a feature (roommate?) or bug (you?) of a good theory.  
  - Whether **amnesia = death** is a valid intuition or a Parfitian distraction.  

  The core tension: **Evidence asymmetry forces subjective immortality**, but **no trivialized risks demands objective fragility**. No mainstream theory nails both.
