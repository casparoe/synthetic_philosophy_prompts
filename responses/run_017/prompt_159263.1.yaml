  ### Thought Experiment: The Parkview Apartment Deposit  

  **Scenario**: In a standard residential lease, the contract states: *"The landlord must refund the full security deposit unless the apartment walls are damaged. If the walls are damaged, the landlord may retain the deposit to cover repairs."* The tenant moves out after years of occupancy. The walls show significant wear—scuffs, minor dents, and faded paint—but no gashes, holes, or structural compromise. Professional inspectors agree this is a **genuine borderline case** of "damaged walls": not clearly damaged (like a hole would be), but not clearly undamaged (like a pristine wall). The lease contains no burden-of-proof clauses or stipulations for borderline cases.  

  #### Key Sentence  
  The outcome hinges on the truth value of:  
  > **P**: "The apartment walls are damaged."  

  #### Analysis by Theory  

  1. **Epistemicism (Bivalence + Classical Logic)**:  
     - **Assumption**: P is either true or false, but we cannot know which due to semantic ignorance.  
     - **Compositionality**: The lease rule is: "Refund deposit unless P." Classically, this is equivalent to:  
       - *Refund if ¬P* (if walls are **not damaged**).  
       - *Retain if P* (if walls are **damaged**).  
     - **Verdict**: Since P has a definite truth value, one clause applies: either full refund or deposit retention. But *we cannot determine which*. Landlords/tenants face irresolvable uncertainty: the "correct" outcome exists but is unknowable.  

  2. **Supervaluationism (Truth Gaps + Supertruth)**:  
     - **Assumption**: P is neither true nor false (a truth-value gap) because admissible precisifications disagree. Some sharpenings count the wear as "damaged," others as "not damaged."  
     - **Compositionality**:  
       - The rule "Refund unless P" is analyzed as **¬P → Refund**.  
       - ¬P inherits P’s gap: it is **neither true nor false** (since P is borderline, ¬P is too).  
       - The conditional ¬P → Refund is **true** only if ¬P is false or Refund is true. But ¬P is *not false* (it’s gappy), and Refund isn’t automatically true. Thus, the conditional is **gappy**—not supertrue.  
     - **Verdict**: No supertruth triggers deposit retention (which requires supertruth of P) or the refund exception (which requires supertruth of ¬P). **Default outcome**: The "unless" clause fails, so the landlord must refund the deposit.  

  #### Outcome Disagreement  
  - **Supervaluationism**: Clear refund.  
  - **Epistemicism**: Unknowable—either refund or retention could be "correct."  

  #### Feature Enabling the Reversal  
  The key is the **default-refund structure** ("refund *unless* P") combined with **gaps propagating through negation and conditionals**. Supervaluationism’s gappy ¬P prevents the exception from firing, forcing the default. Epistemicism’s bivalence forces a binary outcome but offers no guidance.  

  #### Rephrasing Test (Spec #3)  
  - **Original rule**: "Refund unless P." → Supervaluationism: Refund (gap blocks exception).  
  - **Rephrased rule**: "Retain deposit if P; otherwise, refund." (Equivalent to "Refund iff ¬P.")  
    - *Supervaluationism*: "Refund iff ¬P" is gappy (since ¬P is gappy), so no supertruth. The lease lacks a triggered rule → **no obligation to retain**. Default (refund) holds.  
    - *Epistemicism*: Bivalence implies refund or retention is mandated, but unknowably.  
  - **Result**: Supervaluationism consistently forces a refund; epistemicism does not.  

  #### Modifications and Costs  
  - **If clause required "definitely not P"**:  
    - Supervaluationism: "Definitely not P" is false (P is borderline), so refund fails. Outcome flips to retention.  
    - Epistemicism: Unchanged (unknowable).  
    *This violates Spec #4 (no "definitely" operators)*.  
  - **If decision-maker sets a bright line**:  
    - Both theories collapse into a stipulated outcome, avoiding vagueness. *Violates Spec #2 (no stipulation)*.  

  #### Epistemicist’s Best Counter  
  - **Claim**: "Supervaluationism’s ‘decidable’ outcome is illusory because ‘admissible precisification’ is itself vague. What counts as a ‘reasonable sharpening’ of ‘damaged’? If this is vague, supervaluationism also has unknowable higher-order borderline cases, and your ‘refund’ verdict could be undermined."  
  - **Cost**:  
    - **To bite the bullet**: Epistemicism must accept that *all* vague predicates generate irresolvable ignorance, making practical decisions (e.g., deposits, insurance) systematically arbitrary or paralyzed.  
    - **Concession**: While higher-order vagueness challenges supervaluationism, it still delivers *actionable verdicts in first-order borderline cases* (like this one), where epistemicism offers none. Legal systems often prioritize decisiveness over metaphysical precision—supervaluationism aligns with this pragmatism.  

  ### Why This Works  
  Supervaluationism exploits the gap’s propagation: ¬P’s gap prevents the exception in "refund unless P" from activating, protecting the default. Epistemicism’s binary logic cannot resolve the conflict. The reversal holds across equivalent phrasings, relies solely on compositional gap behavior (no special operators), and isolates one vague predicate ("damaged") in a mundane legal scenario.
