prompt: |-
  I teach a graduate seminar on causation and evidence, and I am drafting a paper on the sure-thing principle, the reference-class problem, and Simpson's paradox. Please act as a philosopher of statistics and causal inference — someone equally at home with causal graphs and with decision theory — and help me with the preliminary work of getting my own intuitions in order. Take your time: before committing to a view, spend a paragraph sketching three or four candidate principles and why each of them breaks on some case below, and only then settle on one.

  Here are my verdicts about which level of aggregation to trust when the aggregate and the subgroup figures disagree.

  1. A university admits a smaller proportion of women than of men overall, but within nearly every department the proportion is at least as high for women; women happen to apply disproportionately to the departments that admit few people. My verdict: the department-level figures are the ones that answer whether admissions are biased. The aggregate is an artifact of where women applied.

  2. A drug looks harmful in the aggregate yet beneficial within every stratum of illness severity at baseline, and the sicker patients were much more likely to be given it. Verdict: stratify. Severity is a cause of both the treatment and the outcome.

  3. Same surface shape, but the split is by whether the patient was still well enough to complete the full course of treatment — something the treatment itself influences. Verdict: go back to the aggregate. Stratifying here seems to destroy the very thing I am trying to measure.

  4. The split is by an administrative code that predicts who received the treatment far better than it predicts the outcome; the code largely records which clinic a patient happened to walk into. The reversal appears only after stratifying. Verdict: I distrust the reversal — but I trust this verdict less than any other, and I cannot say why adjustment on such a variable might make matters worse rather than better.

  5. A pair I cannot reconcile. (a) Within each academic department, women are admitted at rates at least equal to men's; in the aggregate they are not; I say the department-level numbers are the truth and the headline is misleading. (b) Within each job title at a firm, men and women are paid the same; the titles held mostly by women pay less; here I say the aggregate pay gap is the real finding and the within-title numbers are the misleading ones. These two look structurally identical to me and I give them opposite verdicts.

  6. A perfectly randomized, perfectly balanced trial with a strong prognostic covariate and no interaction: within every stratum the odds ratio is about two, the pooled odds ratio is about one and a half, and nothing reverses. Verdict: neither number is the effect; I should have asked for risk differences. I also suspect that any principle framed in terms of reversal will misclassify this case entirely.

  7. Over ten years, average entering exam scores rose within every department while the university-wide average fell, because enrolment shifted toward the departments with lower scores. Verdict: nothing paradoxical here; both statements are true of different weightings of a changing population. Tell me whether this case belongs in the family at all.

  8. The reversal shows up in one of twenty subgroup slices the analyst examined, and that slice was not pre-specified. Verdict: I discount it heavily, for reasons that feel closer to the garden of forking paths than to anything causal.

  My tentative principle: stratify when the stratifier is a cause of the treatment, aggregate when it is an effect of the treatment, and when it is neither, do whatever answers the question you are actually asking. This gets cases 1, 2, 3 and 7, but not 5, and I do not think it knows what to say about 4, 6 or 8. Repair it if you can, replace it if you cannot.

  Please deliver: one principle, or at most two, stated precisely enough that a careful reader could apply it mechanically, with a clause-by-clause note of which case motivates each clause; its verdicts on two cases of your own construction that I have not listed; and an explicit statement of which of my verdicts your principle cannot accommodate and which you would urge me to withdraw. Keep the entire answer under 700 words — I would rather have a precise principle in 700 words than a survey in two thousand.
reasoning: |-
  Okay, the user is teaching a graduate seminar on causation and evidence and drafting a paper involving the sure-thing principle, reference-class problem, and Simpson's paradox. They need help organizing their intuitions with case-by-case analysis. They've provided eight scenarios with their verdicts and a tentative principle about stratifying based on whether the stratifier is a cause, effect, or neither of the treatment.

  First, I need to understand each case and their verdicts. For example, in case 1 (university admissions), they say department-level figures show no bias, attributing the aggregate to application patterns. Case 2 (drug harm) supports stratification because severity affects both treatment and outcome. Case 3 (treatment completion) prefers aggregate because stratifying on an outcome-influenced variable distorts measurement. Case 4 is tricky with an administrative code causing reversal, and they're unsure. Case 5 is a contradiction: in academia, they trust department-level, but in pay gaps, they trust the aggregate. Cases 6-8 add complexity with non-reversal contexts and multiple testing.

  The user's tentative principle stratifies when the stratifier is a cause, aggregates when it's an effect, and otherwise depends on the question. But it fails on case 5 and struggles with 4,6,8. The core problem seems to be that effect modification and the causal question's framing matter. In case 5a, the question is about bias in admissions, so conditional on department (the decision point), there's no bias. In 5b, the pay gap reflects structural inequities in job title assignment, so the aggregate is relevant for discrimination.

  I recall that causal diagrams help here. When the stratifier is a confounder (case 2), conditioning is necessary. If it's a collider or mediator (case 3), conditioning introduces bias. Case 4 involves a near-instrumental variable; adjusting might amplify bias if there's unmeasured confounding. Pearl's back-door criterion and front-door criterion could formalize this. Also, the query's nature matters: average treatment effect (ATE) vs. conditional average treatment effect (CATE).

  For a unified principle, I consider: "Stratify if the stratifier is a confounder or its descendant; aggregate if the stratifier is an effect of treatment or outcome, or if there's effect modification requiring marginalization. In cases of non-causal relevance, use the aggregate unless the query is conditional." This addresses confounders (case 1,2), avoids mediators (case 3), and handles case 5 by distinguishing the causal question. For case 5a, the question is about admissions conditional on department (CATE), while 5b is about overall pay disparity (ATE). 

  Case 4: if the administrative code is a near-instrument, conditioning might not be necessary. If it causes treatment but not outcome, adjusting could increase variance but shouldn't cause reversal unless there's bias. The user's discomfort might stem from possible residual confounding. The principle would say not to stratify since it's not a confounder.

  Case 6 isn't a reversal, so the principle doesn't apply. The issue is using odds ratios instead of risk differences, which is a separate problem. The principle should specify that it applies to reversal scenarios.

  Case 7 involves descriptive statistics without a causal claim. Both aggregate and stratified are valid but answer different questions.

  Case 8 is about multiple testing, not causal structure. The principle should exclude such data-dependent selection.

  So, the final principle: "In assessing causal effects, stratify only on confounders (variables causing both treatment and outcome). For non-confounders, use the aggregate unless the causal query is explicitly conditional. In reversal cases, prefer the analysis that aligns with the causal structure of the query."

  This handles cases 1-4, 7, and 5 by clarifying the query. Case 6 is outside reversal contexts. Case 8 involves researcher degrees of freedom, not addressed here. New cases: one where stratifying on a common effect causes bias (like case 3), and another with a covariate only affecting outcome where aggregate is fine. Their verdicts match.

  The principle would urge withdrawing case 5's inconsistency by framing the query: for 5a, conditional on department (no bias), for 5b, overall pay gap (bias exists). Case 4: don't stratify since the code isn't a confounder. Case 6: not a reversal, so principle doesn't apply. Case 8: multiple testing isn't covered.
answer: |-
  Here is a unified principle grounded in causal decision theory and graphical models, designed to resolve aggregation conflicts while respecting your core intuitions:

  **Principle:**  
  *For causal queries about the effect of treatment \(T\) on outcome \(Y\), stratify on \(Z\) only if \(Z\) is a confounder (i.e., \(Z\) causes both \(T\) and \(Y\)). Otherwise, use the aggregate. If \(Z\) modifies the effect without confounding, report both aggregate and stratified estimates with explicit interpretation.*

  **Clause-by-clause motivation:**  
  - **"Stratify only if \(Z\) is a confounder"**: Addresses cases 1 & 2 (e.g., department choice and illness severity are confounders). Conditioning blocks backdoor paths.  
  - **"Otherwise, use the aggregate"**: Handles case 3 (completing treatment is \(T\)-caused) and case 4 (administrative code isn’t a confounder). Prevents conditioning on colliders or instruments.  
  - **"If \(Z\) modifies the effect, report both"**: Resolves case 6 (prognostic covariate) and case 7 (shifting populations). Distinguishes descriptive vs. causal queries.  

  **Your cases resolved:**  
  - **5a/b**: Coherent under this principle. In 5a (admissions), department (\(Z\)) confounds gender→admission? No—gender affects department choice but department doesn’t cause gender. *Aggregate is valid* for institutional bias. In 5b (pay), job title (\(Z\)) may be a *mediator* of gender→pay, not a confounder. *Aggregate is valid* for total discrimination.  
  - **4**: Administrative code (\(Z\)) predicts \(T\) but not \(Y\) → near-instrument. Conditioning amplifies bias (if unmeasured confounders exist). *Use aggregate*.  
  - **6**: Non-reversal; \(Z\) modifies effect. Report marginal (aggregate) and conditional (stratified) effects separately.  
  - **8**: Not addressed—this is a multiple testing issue, not causal structure. Properly excluded.  

  **Your verdicts to reconsider:**  
  - **1**: Department (\(Z\)) is not a confounder for gender→admission (gender→\(Z\) but \(Z\)↛gender). Aggregate *correctly* shows systemic disadvantage.  
  - **3/7**: Correctly handled; retained.  

  **New test cases:**  
  - **Case A**: \(Z\) is an independent prognostic factor (causes \(Y\) but not \(T\)). *Verdict: Aggregate*. Stratifying would reduce precision but not cause bias (no reversal).  
  - **Case B**: \(Z\) is caused by \(T\) and \(Y\) (e.g., a biomarker affected by treatment and outcome). *Verdict: Aggregate*. Stratifying opens collider paths.  

  **Limitations:**  
  - Cannot accommodate **case 5a** under your original verdict (it presumes department-level truth), but urges withdrawal: your intuition conflates *fairness conditional on application* with *total causal effect*.  
  - Silent on **case 8** (addressed by pre-registration, not causal principles).  

  **Key insight**: The "question you are asking" is determined by the causal parameter (ATE vs. CATE), not arbitrary stratification. Confounding status dictates valid estimation, not reversal patterns.  

