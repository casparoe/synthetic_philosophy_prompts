prompt: |-
  I write literary fiction, and I am midway through a novel in which two characters are locked in an argument I cannot adjudicate: a retired meteorologist who believes the world is a deterministic machine we happen to be too small to read, and her daughter, who works in quantum computing and believes the openness at the bottom of physics is what leaves the future genuinely unwritten. I have started keeping a list of concrete cases with my gut verdicts, because I want the argument in Chapter 11 to be about something real rather than about two people talking past each other, and I have roughed out a principle of my own to explain the pattern. What I call *horizon elasticity* is this: what matters is how much extra forecast horizon you buy per extra digit of precision in the initial conditions; where errors grow at a fixed exponential rate, the horizon lengthens only logarithmically as you sharpen the input, so no precision that a physically situated creature could obtain buys you a meaningful extension — and that, I want to say, is what it is to be unpredictable in the way that matters. Notice that the principle is deliberately about knowers with budgets, not about the Laplacean demon, because my meteorologist's claim is supposed to be compatible with the demon and I don't want to beg the question against her daughter.

  Here are the verdicts I find myself giving. A double pendulum hanging in the foyer of the science museum in Chapter 3: unpredictable, and I am entirely comfortable saying so. Whether it rains on a particular afternoon in a particular city twenty days from now: unpredictable, same kind of thing as the pendulum. A tossed coin: unpredictable, but not the same thing at all — I bristle at calling it chaotic, even though by my own criterion it ought to come out exactly like the pendulum. The shuffle function on a music app: random-looking but not unpredictable in the way that matters, and I feel its randomness is somehow fake where the pendulum's is real, even though in both cases the unpredictability is just相对 to what I happen to know. A plume of smoke: chaotic, and yet I want to say predictable — I know the shape of the plume, the rate of spread, the statistics — even though I cannot say where any particular fleck goes; and yet for the coin I also know the statistics and still want to call it random, which I cannot explain. Whether Earth stays inside the habitable zone over the next few hundred million years: I have been told that long integrations of the planets diverge exponentially from one another, and my verdict is still that we basically know, which by my own principle should come out unpredictable and doesn't feel that way. Which of two detectors clicks when a single atom decays: unpredictable in the deepest sense, and more so than anything above — except that my principle is about deterministic systems with sensitive dependence, and this is not one, so the principle doesn't even apply to the case I care about most. A billiard ball rattling around a table with a circular obstacle bolted in the middle: technically chaotic, technically unpredictable, and my verdict is that I don't care, which is not the verdict I gave the pendulum despite the mathematics being the same shape. Whether my narrator's sister takes the job in Chapter 12: unpredictable, and I recoil from chaotic. Whether a given first novel becomes a bestseller: unpredictable, but I feel it fails for a different reason than the weather does — not that the needed precision is unobtainable, but that I don't have the equations in the first place.

  What I would like from you is this: one principle, or a short list of candidates, stated precisely enough that I could paraphrase it in a character's mouth, with each clause tied to the case that forces it, and an honest account of which of my verdicts it cannot accommodate and therefore asks me to drop. Test horizon elasticity against the list rather than starting from scratch, and repair it or replace it as the cases demand — I suspect it needs to be relativised to a target quantity rather than to a system (individual trajectory versus aggregate or distribution), and to a horizon and a precision budget, but I can't tell whether that repair saves my coin verdict or quietly destroys it, and I especially can't tell whether one criterion can cover both the case where precision is unobtainable and the case where no initial condition settles the matter at all. Then tell me what the repaired principle says about cases I haven't listed: the timing of the next large earthquake on a well-instrumented fault; the average July temperature of a named city in 2100; a chaotic circuit used to encrypt a message, where the receiver knows the equations exactly but not the initial voltage to many digits; and whether the output of a deterministic AI system can be predicted before it is produced. Finally, and this is the part I actually need for the book: on the resulting account, is there any substantive difference left between the meteorologist's deterministic-but-unknowable future and the daughter's genuinely open one, or does the distinction I have been building the novel around turn out to be a matter of whether you happen to want the trajectory or the statistics?
reasoning: |-
  Okay, the user is a literary fiction writer working on a novel with a central philosophical argument about determinism versus openness in the universe. They've developed their own principle called "horizon elasticity" to distinguish predictable from unpredictable phenomena but find it inconsistently applied across various examples. Their core need is to refine or replace this principle to make Chapter 11's debate feel authentic, not just theoretical. 

  First, I notice their frustration with horizon elasticity: it works for chaotic systems like pendulums or weather but fails for coins (feels random despite similar math) and quantum events (non-deterministic by nature). The emotional weight behind their verdicts is telling—they "bristle" at calling coins chaotic, feel smoke's predictability despite chaos, and recoil from applying "chaotic" to human decisions. This suggests the principle needs to account for phenomenological differences (how randomness *feels*) beyond math.

  Their examples cluster into three tension points:  
  1) **Scale vs. significance**: Billiard balls are technically unpredictable but feel trivial; planetary orbits feel knowable despite chaos. Horizon elasticity misses why some unpredictability matters more.  
  2) **Type of knowledge**: Smoke statistics feel predictive; coin statistics still feel random. The principle conflates trajectory-prediction (fails for chaos) and distribution-prediction (works for statistics).  
  3) **Ontology vs. epistemology**: Quantum events challenge the framework entirely—they're indeterministic, so horizon elasticity (a deterministic-system tool) can't engage them.  

  The user hints at a solution: relativizing prediction to target quantities (trajectory vs. aggregate) and precision budgets. I should test this. For coins, trajectory-prediction fails (needs micro-precision) but distribution-prediction succeeds (50/50 odds)—this explains why it feels random yet statistically knowable. But does this "save" the coin verdict? Only if the character cares about individual flips, not averages.  

  Bigger issue: human decisions (sister's job) and novel success. Here unpredictability stems from missing equations, not precision limits. Horizon elasticity only addresses "known rules, unknown inputs"—it's silent on systems with unknown rules. A repaired principle must split these cases: one for chaotic determinism, one for under-specified systems.  

  Quantum computing’s “open future” vs. meteorology’s “unknowable machine” might reduce to:  
  - Daughter: **Fundamental openness** = no initial condition determines outcomes (quantum decay).  
  - Meteorologist: **Operational openness** = determinism + prediction horizon collapse for bounded observers.  

  But in practice, both lead to “unpredictable for practical purposes”—so the distinction hinges on whether the universe *could* be predicted given infinite resources. That’s philosophically meaty for fiction.  

  For new test cases:  
  - Earthquake timing: Chaotic system → trajectory-unpredictable, statistics-predictable (fault recurrence intervals).  
  - 2100 temperature: Distribution-predictable via climate models; trajectory-unpredictable for daily weather.  
  - Chaotic encryption: Trajectory-predictable *only* with exact initial voltage (demon-like knowledge); otherwise breaks horizon elasticity fast.  
  - AI output: If rules are known, trajectory-predictable with sufficient compute; if rules are emergent (e.g., LLMs), more like novel success—under-specified.  

  The repaired principle forces the user to drop their “billiard balls don’t matter” verdict—math identical to pendulum means same unpredictability status. But they can keep “we basically know” for planetary orbits because aggregate behavior (habitable zone stability) is distributionally stable despite trajectory divergence.  

  Final note for the novel: The meteorologist/daughter divide survives if the daughter argues quantum openness makes *even statistical patterns* contingent (e.g., radioactive decay has no “cause”), while the meteorologist sees statistics as fixed by initial conditions. Horizon elasticity’s repair makes determinism vs. indeterminism matter most for whether distributions are brute facts or epiphenomena.
answer: |-
  Here's a repaired predictive significance principle (PSP), built by diagnosing your verdicts and fixing "horizon elasticity," presented with its components, limitations, and implications for your novel's core conflict:

  ---

  ### **The Predictive Significance Principle (PSP)**
  *A system's outcome is predictively significant for a bounded observer if and only if:  
  1. **The Target Quantity** is well-defined (e.g., specific trajectory, aggregate statistic, binary outcome).  
  2. **The Precision Budget** allows obtaining initial conditions sufficient to:  
     - (a) Resolve sensitive dependence *for trajectory targets*, OR  
     - (b) Estimate distribution parameters *for statistical targets*.  
  3. **The Horizon** is reachable within computational/observational limits.*  

  **Key Relativizations:**  
  - *To the observer's goals* (target quantity).  
  - *To physical/epistemic constraints* (precision budget, horizon).  
  - *To the type of prediction* (trajectory vs. distribution).  

  ---

  ### **How PSP Repairs Your Verdicts**
  | Case                          | Your Verdict                  | PSP Diagnosis                                                                 | Fixed Verdict              |
  |-------------------------------|-------------------------------|-------------------------------------------------------------------------------|----------------------------|
  | **Double Pendulum**           | Unpredictable                 | Target: Trajectory. Budget insufficient for (a). Horizon collapses.           | **Unpredictable**          |
  | **20-Day Weather**            | Unpredictable                 | Target: Binary (rain). Budget insufficient for (a).                           | **Unpredictable**          |
  | **Tossed Coin**               | Unpredictable (but "not chaotic") | Target: Binary outcome. Budget insufficient for (a) *but sufficient for (b)*. | **Trajectory: Unpredictable<br>Distribution: Predictable** |
  | **Music Shuffle**             | "Fake" randomness             | Target: Sequence. Budget *deliberately withheld* (algorithm known but seed hidden). | **Artificially Unpredictable** |
  | **Smoke Plume**               | Predictable (statistics)      | Target: Aggregate shape/rate. Budget sufficient for (b).                      | **Distribution: Predictable** |
  | **Planetary Habitability**    | "We basically know"           | Target: Aggregate stability (statistical). Budget sufficient for (b).         | **Distribution: Predictable** |
  | **Atom Decay (which detector)**| Unpredictable (deeply)        | *PSP doesn't apply* (indeterministic). New criterion: **Fundamental openness**. | **Ontologically Open**     |
  | **Billiard Ball**             | "Don't care"                  | Mathematically chaotic, but target (e.g., final position) is trivial. PSP: **Predictively Insignificant** | Unpredictable but irrelevant |
  | **Sister Takes Job?**         | Unpredictable (recoil from chaos) | Target: Binary choice. *No equations exist* (system underspecified).          | **Model-Limited**          |
  | **Bestseller Novel**          | Unpredictable                 | Target: Success. *No valid distribution model* (system ill-defined).          | **Model-Limited**          |

  **Sacrifices Required:**  
  - **Coin verdict**: Must accept that coin flips are *trajectory-unpredictable* like pendulums (sensitive dependence exists). Your discomfort stems from conflating trajectory and distribution.  
  - **Billiard ball verdict**: PSP calls it unpredictable; your "don’t care" is a *narrative choice*, not a physics distinction.  
  - **Planetary habitability**: PSP overrules your intuition; statistical stability makes it distribution-predictable despite trajectory chaos.  

  ---

  ### **PSP Applied to New Cases**
  1. **Next Large Earthquake Timing**:  
     - *Target*: Exact timing (trajectory).  
     - *Budget*: Insufficient for (a) (fault stresses unmeasurable at needed precision).  
     - **Verdict**: Trajectory-unpredictable.  
     - *But*: Distribution-predictable (recurrence intervals).  

  2. **Average July 2100 Temperature (City X)**:  
     - *Target*: Aggregate statistic.  
     - *Budget*: Climate models resolve statistical targets (b) with available data.  
     - **Verdict**: Distribution-predictable.  

  3. **Chaotic Encryption Circuit**:  
     - *Target*: Message decryption (trajectory).  
     - *Budget*: Receiver lacks exact initial voltage → insufficient for (a).  
     - **Verdict**: Trajectory-unpredictable *for receiver* (but demon-predictable).  

  4. **Deterministic AI Output**:  
     - *Target*: Specific output (trajectory).  
     - *Budget*: If initial state/weights known and computable, predictable. If not, or if computation exceeds horizon (e.g., emergent complexity), unpredictable.  
     - **Verdict**: *Ambiguous*; depends on system transparency.  

  ---

  ### **The Novel's Core Conflict: Reconciled or Not?**
  **Meteorologist (Deterministic but Unknowable):**  
  - Wins for *trajectory predictions* in chaotic systems (pendulum, weather, coins).  
  - PSP shows her view explains "operational openness" for bounded observers.  

  **Daughter (Genuinely Open Future):**  
  - Wins for:  
    - **Quantum events** (indeterminism → ontological openness).  
    - **Model-limited systems** (human choices, novel success) where no equations exist.  
    - **Distribution predictions** where statistics are stable (smoke, planets).  

  **The Distinction That Survives:**  
  - **Trajectory vs. Statistics**: The meteorologist sees statistics as *epiphenomena* of deterministic trajectories. The daughter sees them as *brute facts* (quantum) or *emergent* (complex systems).  
  - **Source of Unpredictability**:  
    - *Meteorologist*: Chaos + boundedness (knowable in principle).  
    - *Daughter*: Indeterminism or underspecification (unknowable in principle).  

  **What PSP Reveals for Chapter 11:**  
  The argument isn’t just about "openness" but **what kind of knowledge matters**:  
  - *For trajectories*: Daughter wins only in quantum/underspecified cases.  
  - *For distributions*: Meteorologist wins in classical chaotic systems.  
  - *For significance*: Billiard balls are irrelevant; human choices are central.  

  **Final Line for the Daughter:**  
  *"Your determinism saves predictability for ghosts who see infinities. Mine finds openings in the finite."*  

  **Final Line for the Meteorologist:**  
  *"Unwritten? No. Just written in letters too small for our hands."*  

  PSP sharpens their disagreement but doesn’t eliminate it. The novel’s tension rests on whether *human-scale meaning* requires fundamental openness or if operational openness suffices—a question PSP leaves to philosophy, not physics.
