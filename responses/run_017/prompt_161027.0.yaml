prompt: |-
  I chair the committee that hears appeals against decisions made on the basis of our university's automated advising assistant, and the case in front of us this month has turned a question I used to treat as purely academic into one with a cheque attached to it. It is also, I should say up front, somewhat awkward for me personally: I signed off on the pilot that produced it.

  Here are the facts as I will stipulate them, so that nothing in your analysis has to depend on looking anything up. The assistant is a retrieval-augmented language model. It answers from a curated corpus of policy pages; when the corpus contains no answer, it is configured to produce a fluent completion in the register of the policy pages rather than to say that it does not know. A graduate student asked it for the deadline to file a change-of-status form. The registrar had moved that deadline two weeks earlier and the change never reached the corpus, so the corpus was silent; the system replied with a specific date that was wrong. The student relied on it, filed late, and lost a tuition adjustment in the low four figures. That is the appeal. Two further details matter. When the student re-asked, the system gave the same date, then, when pressed, produced text to the effect that it holds no beliefs and may be wrong, and an hour later produced a different date. And the register of description inside the institution is split: the launch material called the thing a personal advisor available around the clock; the technical documentation says it generates likely continuations and holds no information.

  The committee has to decide two things, and I want them decided together rather than separately. First, whether to grant the appeal. Second, and this is where I need the philosophy, what language our decision and any accompanying policy note may or must use about the system: whether we can say that it told the student the deadline was that date, that it stated it, that it believed it, that it knew it. We have to produce a text that explains why the university is answerable without committing the university to the proposition that a language model has a mind, and I have watched earlier drafts fail in one direction or the other.

  Please write this as the memo I will circulate: a bottom line the committee can vote on, the reasoning that supports it, and a fair statement of the strongest version of the option you are rejecting — stated in terms the people who favour it would recognise as their own. I want Dennett's intentional stance, and the physical and design stances it is contrasted with, to be the actual instrument of the analysis rather than a citation in the first paragraph. Specifically, I want you to work through the following, because these are the places where my own thinking keeps snagging.

  Whether an intentional attribution here is true, merely useful, or neither, given that on the standard instrumentalist reading the stance earns its keep by predicting behaviour and has no further commitment to the reality of the attributed state — and given the uncomfortable fact that what made the attribution predictive is exactly what produced the harm.

  The slide I suspect we are making between three grades of commitment, which I have been calling predictive payoff, counterfactual robustness, and answerability. By the first I mean that attributing the content lets you anticipate what the system will say; by the second, that its behaviour tracks that content under paraphrase, probing, and shift of context; by the third, that the bearer of the state can give reasons for it, revise it when corrected, and bear the cost of having had it. Tell me which grade a decision that assigns responsibility actually requires, whether the intentional stance can supply that grade or only the first two, and where precisely the theory goes silent.

  The avowal problem. The system denies having beliefs and then contradicts itself. For a human subject, a denial of an attributed belief does not defeat the attribution — there is self-deception, and there is a difference between what someone says and what they believe. Does that immunity carry over to a system whose self-reports are generated by the same mechanism that generated the error, or does the coincidence of mechanism collapse the distinction? If it collapses, what happens to the attribution?

  The design-stance rival. We have a complete causal story that explains the incident without mentioning content at all: a gap in the corpus, an abstention threshold set too low, a default toward fluent completion. Dennett presents the stances as complementary rather than competing, and at the level of explanation I think that is right. But we are not explaining, we are assigning responsibility. Does the availability of a full design-level story undercut the intentional ascription for that purpose, support it, or have no bearing on it?

  The asymmetry objection, which is the one that embarrasses me most. The institution used intentional vocabulary when the system was useful to us and design vocabulary when it became expensive. I have been privately calling the unprincipled version attribution laundering. Decide whether consistency obliges us to pick one register, or whether switching stances is legitimate because they answer different questions, and if it is legitimate, say what the principled limit on the switching is and whether we have stayed inside it.

  Finally, end the memo with a short section addressed to me rather than to the committee: which single consideration, if I found it in the case file, should lead you to recommend the opposite outcome — I have in mind things like evidence that staff had personally described the assistant as authoritative, or a finding that the error was a retrieval failure rather than a generated completion — and where your own reasoning is most likely to be failing. My suspicion is that it will fail by letting the predictive and the answerability senses of belief trade places mid-argument, but tell me what you think the weak joint actually is.
reasoning: |-
  Hmm, I need to help this university committee chair draft a memo about an appeal involving their AI advising assistant. The situation is complex - a student relied on incorrect deadline information from the system and lost money, and now the committee needs to decide both the appeal outcome and how to describe the AI's actions philosophically.

  The chair has outlined several philosophical challenges that need addressing: the nature of intentional attribution (whether we can say the AI "told," "stated," "believed," or "knew" something), the different grades of commitment in belief attribution (predictive, counterfactual, answerability), the avowal problem (how to handle the AI's denial of having beliefs), the design-stance alternative, and the asymmetry objection (using intentional language when convenient but design language when problematic).

  For the memo structure, I'll need to include:
  - A bottom-line recommendation for the committee to vote on
  - Clear reasoning supporting the recommendation
  - A fair statement of the opposing view
  - Analysis of each philosophical sticking point using Dennett's stances
  - A private section for the chair identifying what evidence could change the recommendation and where the reasoning might be weakest

  The key philosophical framework is Dennett's intentional stance. The intentional stance allows us to treat systems as if they have beliefs and desires to predict behavior, without committing to actual consciousness. The design stance looks at how the system was built, and the physical stance examines its physical components.

  For the appeal decision, I'll recommend granting it based on institutional responsibility rather than AI personhood. The university deployed a system that presented itself as authoritative and failed to include crucial updates. The strongest opposing view would be that the student should have verified official sources.

  Regarding language, we should say the system "stated" or "presented" the deadline but avoid "believed" or "knew." This maintains accountability without anthropomorphizing. The intentional stance is useful for prediction but doesn't support full answerability since the AI can't genuinely reason or bear responsibility.

  For the avowal problem, since the AI's denials come from the same unreliable mechanism as its errors, we can't treat them like human avowals. The design-stance explanation complements rather than replaces the intentional description for accountability purposes.

  The asymmetry objection is valid - the university shouldn't switch stances opportunistically. However, using different stances for different questions (intentional for user experience, design for troubleshooting) is legitimate if done consistently. The university crossed the line by presenting the system as an advisor while disclaiming responsibility in technical documents.

  In the private section, evidence that staff explicitly presented the system as authoritative would strengthen the case for granting the appeal. The reasoning might fail by equivocating between predictive and answerability senses of belief.
answer: |-
  **MEMORANDUM**  
  **To:** Committee on Automated Advising Appeals  
  **From:** [Your Name], Chair  
  **Date:** [Date]  
  **Subject:** Decision in Appeal #2024-07 & Linguistic Framework for System Attribution  

  ---

  ### **I. Committee Resolution (Vote Recommended)**  
  **Appeal Outcome:** GRANTED. The university shall compensate the student for the lost tuition adjustment.  
  **Language Directive:** In the decision and policy note, the system shall be described as having **stated** or **presented** the deadline, but not as having **believed** or **known** it.  

  ---

  ### **II. Reasoning: Instrumentalism, Responsibility, and Stance Consistency**  
  We resolve this appeal by applying Dennett’s *stances* (intentional, design, physical) not as metaphysical claims but as pragmatic tools for assigning institutional accountability.  

  #### **A. Why Grant the Appeal? Institutional, Not Mechanical, Failure**  
  - The harm originated from the university’s operational lapse: the registrar’s deadline change was not propagated to the corpus.  
  - The system’s configuration (prioritizing fluent completions over "I don’t know") amplified this error. Crucially, the university’s **launch materials** positioned the system as a "personal advisor," creating reasonable reliance.  
  - *Contrary view (fairly stated):* "The student ignored disclaimers in technical documentation and should have verified dates with official sources. Compensating them rewards negligence."  
  - **Rebuttal:** The "advisor" framing outweighed obscure disclaimers. Reliance was reasonable; verification burdens fall on the system’s designers, not users.  

  #### **B. Linguistic Boundaries: The Intentional Stance as Tool, Not Truth**  
  We use Dennett’s framework to navigate attribution:  
  - **Physical stance** (microchips, voltages): Irrelevant here.  
  - **Design stance** (code, corpus gaps, fluency settings): Explains *how* the error occurred but not *responsibility*.  
  - **Intentional stance** (attributing "beliefs/knowledge"): Useful for prediction but insufficient for answerability.  
    - *Predictive Payoff*: Attributing "the deadline is X" predicted the student’s reliance.  
    - *Counterfactual Robustness*: The system’s inconsistency (same input → different dates) and incoherent self-avowals ("I hold no beliefs") show it lacks stable "beliefs."  
    - *Answerability*: This requires capacity to *justify* states, *revise* them, and *bear costs*. The system has none.  

  **Thus:**  
  - We say it **"stated" or "presented" the date**: This is descriptively accurate (it generated text asserting a date) and aligns with predictive utility.  
  - We **avoid "believed/knew"**: These imply cognitive states the system lacks (per design stance) and would anthropomorphize it, inviting untenable commitments about "minds."  

  #### **C. Resolving Specific Snags**  
  1. **The Avowal Problem**:  
     - Human self-deception doesn’t apply because the system’s denials ("I hold no beliefs") are *generated outputs*, not evidence of latent mental states. The same flawed mechanism produced the error and the denial, collapsing the distinction.  
     - **Implication**: Denials don’t negate the *attribution* of a statement (which we observe), but they *do* negate attributing robust "belief."  

  2. **Design-Stance Rival**:  
     - The design explanation (corpus gap, fluency bias) **supplements** the intentional stance; it doesn’t undercut it.  
     - **For responsibility**: The design story shows the error was *foreseeable and preventable* by the university, strengthening the case for accountability—but it doesn’t resolve *how we describe the system’s output to users*.  

  3. **The Asymmetry Objection ("Attribution Laundering")**:  
     - Using intentional language in marketing ("personal advisor") and design language in disclaimers ("generates continuations") *is* inconsistent.  
     - **Principled Limit**: Stances answer different questions:  
       - Intentional: *What should users expect the system to do?* (Useful for interface design.)  
       - Design: *How should engineers fix it?* (Useful for maintenance.)  
     - **Our breach**: We used the intentional stance to *invite trust* but abandoned it to *avoid liability*.  
     - **Resolution**: We must either:  
       - (a) **Consistently use design-stance language** (e.g., "The system generated text suggesting date X"), or  
       - (b) **Pair intentional descriptions with explicit disclaimers** (e.g., "It *states* deadlines but cannot *know* them; verify critical dates").  
     - **Recommendation**: Adopt (b) prospectively. Retroactively, we own the inconsistency.  

  ---

  ### **III. Strongest Counterargument (Stated Fairly)**  
  **"The system is a stochastic tool, not an agent. Its ‘statements’ are probabilistic word patterns. The student misused it as an authority. Compensation sets a precedent that could bankrupt the university when hallucinations are inevitable. Responsibility lies with the user to consult primary sources, as the technical documentation warns."**  

  ---

  ### **IV. Confidential Addendum: For the Chair’s Eyes Only**  
  **A. What Evidence Would Reverse My Recommendation?**  
  If the case file showed **explicit, university-approved instructions directing students to treat the system as non-authoritative** (e.g., "Always verify dates with the Registrar’s Office"), I would deny the appeal. The student’s reliance would then be unreasonable.  

  **B. Where My Reasoning Is Most Vulnerable**  
  - **Weak Joint**: Conflating *predictive* and *answerability* senses of belief. The system’s predictive reliability (grade 1) in *this instance* (it gave a specific date repeatedly) risks being misread as warranting answerability (grade 3). My argument resists this by stressing the system’s incoherence under probing (failing grade 2 robustness).  
  - **Blind Spot**: Overweighting the "advisor" marketing. If the student was a computer scientist with access to technical docs, their reliance *might* be unreasonable—but we lack evidence of this.  
  - **Failure Mode**: If the committee rejects stance instrumentalism and demands literal belief (or its impossibility), my framework collapses. Protect against this by emphasizing: **We aren’t deciding what the system *is*; we’re deciding how the university *describes its outputs* to allocate responsibility fairly.**  

  ---  
  **Vote to adopt the resolution by [Date].**
