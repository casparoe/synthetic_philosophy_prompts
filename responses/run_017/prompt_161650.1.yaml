prompt: |-
  Trying to figure out what I actually think about everyday conventions — tipping, queueing, jaywalking — by just going with my gut on cases rather than starting from a theory:

  - Cutting into a queue at a bus stop in a city where queueing is the norm: not ok.
  - Shouldering forward in the scrum at a bus stop where boarding has always been push-first: fine, that's how it works there.
  - Jaywalking at 2am, empty street, no cars, nobody around: totally fine, not even slightly.
  - Jaywalking on that same empty street while a school group waits at the corner and the kids are watching: not ok, and clearly worse than the 2am one even though the risk is identical.
  - Not tipping in a US sit-down restaurant where the servers wage assumes tips: not ok, feels like the worst item on this list.
  - Not tipping when the counter-service iPad swivels round with a 20% prompt and the barista is on a normal wage: fine.
  - Tipping in a country where tipping isnt a thing and the staff get a bit embarrassed: not really ok, but only barely.
  - A visitor from a scrum-norm country shoving ahead at a queueing-norm airport: not ok, they should queue.
  - A visitor from a tipping country leaving tips everywhere in a no-tip country: harmless, maybe faintly annoying for locals.
  - The case I keep flip-flopping on: refusing the small facilitation fee a border official expects, in a country where everyone pays it. My gut says refusing is fine, but if conventions generate obligations I can't see why this one is different from the airport queue.

  Tentative principle I've been playing with: you owe compliance to a convention only when other people are already stuck in it and have arranged their behaviour or their income around it (call it load-bearing), and your deviation either takes a benefit while skipping a cost everyone else is paying, or is visible enough to lower other people's expectation that folks will comply — which is what keeps the whole thing running. Where neither holds, its not a moral matter at all, just etiquette.

  So: does that principle survive my verdicts, especially the 2am-versus-kids pair and the bribe? Does it need an extra clause for conventions whose content is independently rotten, or does adding that clause just smuggle in ordinary morality and leave the word convention doing no work? Does anything here amount to a real duty to defer to local ways, or is it all downstream of reliance plus visibility? And what does your version predict for two cases I haven't listed: a local who stops tipping as a protest but hands each server a note explaining why, and a tourist who jaywalks in a city where literally everyone jaywalks?
reasoning: |-
  Hmm, the user is grappling with the moral foundations of everyday conventions like tipping, queueing, and jaywalking. They've listed several scenarios and their gut reactions, then proposed a principle about when conventions create obligations: when they're "load-bearing" (people rely on them) and deviations either free-ride or undermine the convention's stability. 

  I notice their principle handles most cases well:  
  - Queue-cutting in normed places fails because it free-rides on others' compliance.  
  - Not tipping US servers is bad because their wages rely on tips.  
  - The 2am jaywalking is fine since no one's relying on or observing it.  

  But the school-kids jaywalking case is tricky - identical risk but feels worse. Their principle explains it through visibility: kids seeing it might erode future compliance, so it damages the convention. Clever.  

  The border bribe refusal seems to strain their framework though. If everyone pays, refusing might be visible and undermine the corrupt system, but bribes are independently immoral. Should they add a "rotten convention" exception? Probably not - that smuggles in external morality and defeats the purpose of isolating convention-based duties. Better to say: refusing isn't wrong under convention ethics because a) it doesn't free-ride (you suffer delays), and b) while visible, perpetuating corruption isn't worth preserving.  

  For their unasked cases:  
  - The anti-tipping protester with notes is fine under their principle - no free-riding (they're protesting the system, not stiffing individuals) and transparency prevents erosion.  
  - Tourist jaywalking in a jaywalking city is neutral - no reliance issues, and visibility reinforces the local norm.  

  Their framework holds up surprisingly well! The core insight is that conventions only bind when they're social contracts with mutual reliance. Where no one's invested, it's just etiquette. Where the convention is harmful, ordinary morality overrides - but that's outside the convention analysis. Smart distinction.
answer: |-
  Your principle—focusing on "load-bearing" conventions where deviation exploits others' reliance or visibly erodes the system—is remarkably robust. Let's test it against your cases, resolve the tension in the jaywalking/bribe examples, and tackle your new scenarios:

  ### Does your principle survive your verdicts?
  - **Queue-cutting (queue-norm city)** & **Not tipping (US servers)**: Both fit perfectly. Others rely on the convention (orderly boarding/livable wages), and you free-ride by skipping the cost (waiting/tip) while benefiting.
  - **Shouldering in scrum boarding**: Fine—no one relies on queueing; the "push-first" norm *is* the system. No free-riding.
  - **2am jaywalking (empty street)**: Fine—no reliance (no one is present), no visibility to erode the norm. Purely etiquette.
  - **Jaywalking with watching schoolkids**: Not ok—**visibility matters**. Kids observing normalizes deviation, eroding future compliance. Identical risk, but your act *teaches* disrespect for the convention.
  - **Counter-service iPad tip**: Fine—barista isn't relying on tips (normal wage), and skipping isn't visible/public enough to erode tipping norms broadly.
  - **Tipping in no-tip countries**: Harmless/annoying—no reliance (staff aren't paid less expecting tips), but mild visibility might confuse locals. Etiquette fail, not moral breach.
  - **Scrum-norm visitor shoving in queue-norm airport**: Not ok—they enter a system where others *are* relying on orderly queues. Their deviation free-rides and causes visible disruption.

  ### The border bribe ("facilitation fee")
  Your gut says refusing is fine, and **your principle agrees**:  
  - **Not load-bearing**: Paying the bribe doesn’t sustain a system others *rely* on—it sustains corruption. Locals aren’t "arranged around it" voluntarily; they’re coerced.  
  - **No free-riding**: Refusing means *you* bear a cost (delays/hassle), while others who pay skip that cost. You’re not exploiting them; they’re exploiting you.  
  - **Visibility might help**: Refusing could erode the corrupt convention—which is good, not bad.  
  *Why it feels different from the airport queue?* Queueing is a cooperative system; bribery is predatory. Your principle spots this by focusing on **mutual reliance vs. exploitation**.

  ### Do we need a "rotten convention" clause?
  **No—adding it undermines the framework.** Your principle already handles this:  
  - "Load-bearing" implies the convention serves a cooperative function (e.g., efficient boarding, fair wages).  
  - Bribes, segregation, or other immoral conventions **aren’t truly load-bearing**—they’re coercive or harmful systems where "reliance" is forced.  
  - *Example*: In a caste-based queue, "cutting" the line to enforce hierarchy isn’t a convention you owe compliance to; the system itself is rotten. Ordinary morality condemns it, and your principle doesn’t apply because there’s no *legitimate* reliance.  

  ### Your new cases: Predictions
  1. **Local stops tipping (US), hands servers explanatory notes**:  
     - **Your principle: Not wrong.**  
       - No free-riding: They’re protesting the *system*, not exploiting servers (could even pay cash directly to avoid stiffing).  
       - Visibility doesn’t erode compliance—it challenges the norm transparently. If anything, it might spur reform.  
     - *Caveat*: If servers suffer before change happens, it’s a moral cost—but that’s about labor justice, not convention ethics.  

  2. **Tourist jaywalks where everyone jaywalks**:  
     - **Your principle: Fine.**  
       - No reliance: Locals don’t expect compliance (jaywalking *is* the norm).  
       - Visibility reinforces, rather than erodes, the convention.  

  ### Refined Principle
  > **You have a duty to comply with a convention iff:**  
  > (1) **Reliance**: Others have arranged their behavior/expectations around it, and  
  > (2) **Harm**: Your deviation either—  
  > (a) *Free-rides* (gains a benefit while skipping a cost others pay), or  
  > (b) *Erodes* the convention (visible noncompliance that weakens others’ trust in the system).  
  >   
  > If (1) or (2) is missing, it’s etiquette, not ethics. If the convention is coercive/unjust, (1) is void.  

  **Why it works**: It explains why the schoolkids case *feels* worse (erosion risk), why bribes differ from tips (no legitimate reliance), and why protesting a convention (tipping) can be ethical. Conventions aren’t sacred—they’re tools for cooperation, and duties arise only when they enable mutual gain.
