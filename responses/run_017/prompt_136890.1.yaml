prompt: |-
  Hi — I could use a hand with something that's half a practical problem and half a conceptual one. I'm a philosophy professor (I teach a bit of formal epistemology and decision theory, though this isn't really my area) and I'm on a hiring committee with one colleague, Dana.

  The setup: we're deciding whether to make an offer. Both of us read the same file — CV, writing sample, three letters, teaching evals. Then we split the reference calls. I spoke to two of her letter writers; Dana spoke to the third plus a senior person in the subfield who isn't a letter writer but knows her work. After that we wrote our numbers down seperately: I put the chance she'd get tenure here at about 75%, Dana put it at 40%. Worth saying that before either of us opened the file, we'd have given roughly the same number for a candidate with this kind of dossier — same department, same placement record over the last ten years, no reason to think we differ much on the base rates.

  Then we did that thing where you show each other your numbers and revise. I went to 68, she went to 51. Next round: 63 and 57. Next: 61 and 60. Dana now says we should just split the difference at around 60 and send that to the dean, who wants one number from the committee by Friday.

  My discomfort is this: neither of us changed our mind because of anything new in the last three rounds. Each time we were just reacting to the fact that the other person had a different number. And I have a nagging feeling that "meeting in the middle" is the wrong way to combine our views — or at least that it's a procedure with no principled defense — but I can't say why, and Dana says I only dislike it because it lands closer to her number than to mine. She may be right about the motive, but that doesn't settle whether it's correct.

  Three things I'm genuinely unsure about:

  1. Some of my colleagues over in economics have a result that goes roughly: two people who started out agreeing about the base rates, who are honest with each other and reasonably good at reasoning from evidence, shouldn't be able to look at each other's estimates and stay apart. If something like that is right, does it mean one of us was being irrational at the outset — that 75 and 40 couldn't both have been sensible readings of what we'd each seen? Or does it mean our case just doesn't fit the assumptions, and our opening gap was fine?

  2. The bit I keep coming back to is that I'm not sure our evidence was cleanly separable into "yours" and "mine." Dana and I sat in on the same job talk, and I suspect she'd have come away more impressed by that talk if the candidate were strong than I would have, while I'd have come away less impressed than she would if the candidate were weak. So we weren't only pooling private signals; we were also reading shared material through different lenses. Does that make a difference to whether we should have ended up agreeing?

  3. And then the practical question: is splitting the difference actually the wrong move, and if so what would be the defensible alternative? Dana did fewer of the reference calls but she's the one who really knows the subfield; I did more of the legwork but I might just be noisier. Is there any principled reason to weight one of us more heavily, or to just defer to whoever has more information — or is averaging defensible after all, for some reason I'm not seeing?

  Anyway — thoughts welcome. I have to send the dean something by Friday and I'd rather it not be a number I can't justify.
reasoning: |-
  Okay, let me start by unpacking this philosophy professor's problem. They're on a hiring committee with Dana, and after independently assessing a candidate, their initial tenure probability estimates are 75% and 40%. Through several rounds of sharing and revising, they converged to 61% and 60%, and now Dana wants to split the difference at 60.5% for the dean. The professor feels uneasy about this process and has three main questions.

  First, I recall that this scenario relates to the Bayesian consensus literature. The Aumann agreement theorem says that two rational agents with common priors who share their posteriors should converge to the same probability estimate. But here's the catch: their evidence isn't fully separable. They both attended the same job talk, interpreted the same materials differently, and Dana has subfield expertise while the professor might be noisier. This violates the theorem's assumption of independent signals. So their initial disagreement doesn't necessarily indicate irrationality—it's more about differing interpretations of shared information.

  For the second point, the non-independent signals are crucial. If their interpretations are correlated (e.g., both tend to overestimate strong candidates but in different degrees), then pooling their estimates mechanically won't lead to truth. Dana's expertise in the subfield might make her weighting more reliable, but the professor did more reference checks. This complexity makes simple averaging questionable.

  On the practical side, splitting the difference seems arbitrary. Alternatives could involve discussing specific evidence points, like why Dana's reference call lowered her estimate or why the professor remains higher. Maybe they can identify which pieces of evidence are pivotal and reassess those together. Weighting based on expertise or information depth might be better—for instance, Dana's subfield knowledge could warrant more weight on her reference call insights.

  The professor's discomfort is valid. Without a structured way to combine their views, averaging might mask biases. They need a justification beyond convenience. I should suggest a joint discussion focused on the most divergent evidence points, perhaps creating a shared scale for weighting information sources. Also, acknowledging uncertainty by presenting a range could be more honest, though the dean wants one number. Emphasizing the process's limitations in their report might help maintain integrity.
answer: |-
  Your discomfort is well-founded, and the conceptual issues you raise are central to formal epistemology and group decision theory. Here’s a breakdown addressing your three questions, followed by practical recommendations:

  ### 1. **The Rationality of Persistent Disagreement (Aumann’s Agreement Theorem)**  
     - **The theorem you recall** is likely [Aumann’s Agreement Theorem](https://plato.stanford.edu/entries/epistemology-bayesian/#AumAgrThe). It states: If two rational agents share a common prior and their posteriors (estimates) are common knowledge, they *must* agree.  
     - **Why it might not apply here**:  
       - **Non-common priors**: While you agreed on base rates *before reviewing the file*, your interpretations of the evidence (CV, letters, talks) reflect differing *models* of how evidence maps to tenure probability. This violates the "common prior" assumption.  
       - **Non-common knowledge**: When you shared numbers ("I say 75%"), you didn’t reveal *why* (e.g., "Letter X emphasized Y, which I weight heavily"). Without sharing your *evidence models*, the conditions aren’t met.  
       - **Private vs. shared signals**: You had partially overlapping evidence (job talk) but interpreted it differently. Aumann assumes agents update independently on *disjoint* private signals.  
     - **Conclusion**: Your initial gap (75% vs. 40%) doesn’t imply irrationality. It reflects legitimate differences in how you weigh evidence (e.g., Dana’s subfield expertise led her to prioritize certain signals). The convergence to 60% isn’t a rational requirement but a pragmatic compromise.

  ### 2. **Non-Independent Evidence and Interpretive Lenses**  
     - **This is critical**. Your shared observation of the job talk (and possibly other materials) means your signals aren’t statistically independent. If your interpretive frameworks ("lenses") are correlated (e.g., both of you are influenced by rhetorical flair, but to different degrees), simple aggregation fails.  
     - **Why it matters**:  
       - **Bayesian pooling** (e.g., logarithmic opinion pools) assumes independence. If your assessments are correlated (e.g., Dana’s low estimate makes you discount the talk’s importance), averaging amplifies shared biases.  
       - **Expertise asymmetry**: Dana’s subfield knowledge may make her weighting of certain evidence (e.g., the non-letter writer’s input) more reliable. If your interpretations conflict *systematically*, pooling without weighting is unprincipled.  
     - **Conclusion**: Your differing lenses invalidate mechanical compromise. The goal should be to *explicitly debate interpretive frameworks*, not just numbers.

  ### 3. **Practical Alternatives to Splitting the Difference**  
  Averaging (61% and 60% → 60.5%) is simple but indefensible if you can’t justify *why* your estimates deserve equal weight. Better approaches:  

  #### **Option A: Structured Evidence Reconciliation**  
     - **Step 1**: Identify the *strongest disagreement drivers*. Example:  
       - *You*: "Reference A highlighted teaching adaptability, which I weight highly (hence 75%)."  
       - *Dana*: "Reference B warned about research depth, and Subfield Expert C concurred (hence 40%)."  
     - **Step 2**: Debate the *weight* of each signal:  
       - Is Reference B’s concern mitigated by the writing sample?  
       - Does Dana’s subfield expertise justify prioritizing her reference’s view?  
       - Did you both over/underweight the job talk?  
     - **Step 3**: Re-estimate jointly *after* aligning on evidence weighting.  

  #### **Option B: Weighted Averaging (If Time-Constrained)**  
     - Assign weights based on:  
       - **Information quality**: Dana spoke to a subfield expert; you did more reference calls. Whose inputs are more tenure-relevant?  
       - **Calibration history**: Who has a better track record of tenure predictions?  
       - **Example**: If Dana’s expertise justifies 2× weight on her subfield assessment, but your reference calls cover broader evidence, a 55% (Dana) / 45% (You) split might yield 58%.  
     - *Key*: Document the rationale for weights.  

  #### **Option C: Present a Range (With Justification)**  
     - Report: "Committee estimate: 57–63%." Explain:  
       - *Lower bound*: Concerns about research trajectory (per Dana’s references).  
       - *Upper bound*: Strong teaching fit and letters (per your references).  
     - This honors your residual disagreement without false precision.  

  ### **Recommendation for the Dean**  
  1. **Avoid raw averaging**. It conceals legitimate epistemic differences.  
  2. **Opt for Option A** if possible before Friday. Even 30 minutes debating key evidence (e.g., "What did Subfield Expert C say that changed your view?") could refine your estimate.  
  3. **If forced to average**, use **Option B** with weights based on:  
     - Depth of insight (e.g., Dana’s subfield knowledge).  
     - Breadth of evidence (your additional reference checks).  
     Example: *"Given Dana’s subfield expertise but broader reference input from [You], we weight estimates 55%/45% → 58.5%."*  
  4. **Transparency**: In your report to the dean, add:  
     > *"Our initial estimates reflected differing interpretations of overlapping evidence. After discussion, we converged near 60%, but residual uncertainty suggests a range of 57–63% is more accurate."*  

  ### **Why Splitting the Difference is Problematic**  
  - It’s **mechanistic**: It ignores *why* you disagree (e.g., expertise asymmetries, signal reliability).  
  - It **penalizes nuance**: If Dana’s 40% was based on a critical insight, averaging buries it.  
  - **You’re not alone**: Studies show groups often converge via "social smoothing," not evidence ([Larrick & Soll, 2006](https://psycnet.apa.org/record/2006-01691-001)).  

  ### **Final Thought**  
  Your philosophical instinct is correct: Without reconciling *models of evidence*, convergence is accidental. Push for a brief debate on the *most pivotal disagreement* (e.g., the subfield expert’s view). If Dana resists, weighted averaging with a stated rationale is the lesser evil. Your dean will appreciate the epistemic honesty.
