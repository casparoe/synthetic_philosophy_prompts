  The probabilistic generalization part is tricky - I need to choose a simple non-deductive norm that undergrads can handle. Probabilistic coherence works well, especially since Dutch book arguments have clear parallels to modus ponens. The key is framing it so students must take a stance on whether this generalization undermines the original demand.

  For the marking scheme, I'm considering five clear criteria: 
  1) Analysis of rule adoption vs proposition acceptance 
  2) Assessment of the conditionally saturated agent 
  3) Generalization to non-deductive norms 
