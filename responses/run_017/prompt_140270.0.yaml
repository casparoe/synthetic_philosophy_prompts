prompt: |-
  For some years I have kept a hobby: I run round-robin tournaments among strategies for the iterated prisoner's dilemma. Every entrant is a fixed rule — written by me or by friends — that inspects the history of the pairing and chooses cooperate or defect. Each entrant meets every other entrant, and a copy of itself, for a fixed two hundred moves, and I score by total points across all pairings, using the usual payoffs: five for defecting against a cooperator, three for mutual cooperation, one for mutual defection, nothing for being exploited. None of my entrants is written to behave differently on the last move, so none can exploit the known ending.

  The pattern I want a word for has two faces. My most successful entrant opens by cooperating and thereafter simply repeats whatever its partner did on the previous move. It has never once, in any pairing I have run, finished ahead of the thing it was playing against; because its moves are its partner's moves shifted by one round, it either ties or finishes exactly five points behind, and that is all there is to it. Yet it wins the table, over and over, whatever else I put in the pool. My least successful entrants include the one that simply defects on every move. Nothing in my pool can score more than it in a single pairing — the best you can do against a defector is defect yourself, and every cooperation only costs you — so it wins or ties every contest it plays, and it sits near the bottom of the table.

  The arithmetic is not mysterious: against a partner that always cooperates, the copycat collects 600 and concedes 600, while the defector collects a thousand and concedes nothing. Add the first column across thirty opponents and the copycat's total is enormous; count wins instead and the defector looks like the strongest thing present. What I cannot get straight is which of those is the right question, and why.

  Two further things make me suspect I am looking at more than one phenomenon. If I rescore the very same results by awarding a point for each pairing won rather than the raw payoffs, the table reorders — different winner, different tail. And when I let the pool evolve instead of running a single tournament — copy entrants in proportion to their scores, discard the failures, reseed with a few copies of whatever did well, repeat for some hundreds of generations — something else takes over, usually a rule that repeats its own previous move when the last round paid it reasonably and switches when it did not. The defectors vanish, and I take it that this is because, once common, they start meeting themselves.

  A statistician friend muttered something about Simpson's paradox; a biologist friend said it was just non-transitivity. Neither seems to me to capture what I have found, but I cannot say why, and I cannot tell whether I have stumbled on one thing with two faces or on two separate things that happen to sit next to each other.

  So: does this have a name? I do not want a label on its own — I want the phenomenon carved. What exactly is the gap between scoring well and beating the thing you are paired with; how does that gap differ from non-transitivity and from the aggregation paradoxes it superficially resembles; does the collapse of the defectors once they become common belong to the same phenomenon or to another one; and what would a case look like in which the distinction made no difference at all, so that I can see where its edges lie? If there is no established concept here, say so plainly and give me a name and a definition I could use, with the boundary cases fixed. I am not asking for references — only for the distinction, stated and bounded.
reasoning: |-
  Okay, let's tackle this user's complex query. They've been running iterated prisoner's dilemma tournaments and noticed some counterintuitive results. The core puzzle is why an always-defect strategy dominates every head-to-head matchup yet finishes last overall, while a tit-for-tat clone wins the tournament despite never beating any opponent individually. 

  First, I need to unpack their three main observations: 
  The tit-for-tat paradox (wins tournament despite no head-to-head wins), the defector's dominance in pairings but overall failure, and how evolutionary dynamics change everything. The user wants precise conceptual carving - not just labels.

  Hmm... the Simpson's paradox comparison is tempting but imperfect because this isn't about subgroup confounding. Non-transitivity doesn't quite fit either - tit-for-tat doesn't lose to some third strategy, it just gets outscored within pairings while dominating globally. 

  The key distinction seems to be between local and global optimization. Always-defect is locally optimal (maximizes per-game payoff) but globally toxic, while tit-for-tat sacrifices local dominance for global cooperation benefits. That explains the scoring gap - it's about externalities! When defectors exploit cooperators, they create negative externalities that tank overall scores.

  For the evolutionary aspect... ah! The defector's collapse isn't the same phenomenon - that's frequency-dependent selection. At low frequency they thrive by exploiting cooperators; at high frequency they trigger mutual destruction. Different mechanism, same outcome.

  The boundary case would be a tournament without externalities - maybe if scores were only affected by your own actions? But in PD, your payoff depends entirely on others' choices. Perhaps in a zero-sum game the distinction would vanish... but prisoner's dilemma is fundamentally non-zero-sum.

  User clearly understands the math - they need philosophical precision. Should emphasize that this is about emergent cooperation versus parasitic strategies. Maybe frame it as "Nash equilibrium vs Pareto optimality" in repeated games? Though that might be too jargony...

  The labeling challenge: "Individual vs Collective Optimality Gap" captures the scoring paradox. "Negative Externality Exploitation" for why defectors fail globally. And "Frequency-Dependent Viability" for the evolutionary aspect. Three distinct but interlinked concepts.

  For the "no difference" case - imagine a tournament where all strategies are either always-cooperate or always-defect. Then tit-for-tat would just become always-cooperate and the paradox disappears. But that's trivial... better boundary is when no strategy's success depends on others' responses. Like a single-player game.

  User's frustration with superficial explanations is palpable. Need to validate that their intuition is correct - this isn't just Simpson or non-transitivity. The core novelty is the role of externalities in scoring systems. Should explicitly contrast with those concepts in the response.

  Evolutionary part is cleaner: it's straightforward evolutionary game theory. The scoring paradox is subtler because it's about aggregation methodology. When they switch to win-counting, they're measuring something fundamentally different - like confusing batting average with RBIs in baseball.

  Final structure should: 1) Define the scoring paradox as distinct from known fallacies 2) Explain defector collapse as separate frequency-dependent effect 3) Provide null case where distinction vanishes. All while avoiding academic references per their request.
answer: |-
  Your phenomenon isn't one thing, but **three interconnected concepts** operating simultaneously. The confusion arises because they overlap and interact in the Prisoner's Dilemma (PD) context. Here's the precise carving:

  1.  **The Core Paradox: Individual Payoff Maximization vs. Collective Payoff Maximization (The "Cooperation Externality Gap")**
      *   **Definition:** The gap between maximizing your score *against a specific opponent* and maximizing your *total score across all opponents* in a system where strategies generate positive or negative externalities for others. Always-Defect (AD) maximizes individual payoffs locally but creates massive negative externalities (exploiting cooperators, triggering mutual defection). Tit-for-Tat (TFT) sacrifices maximum local payoff (it never exploits, it only reciprocates) but generates positive externalities (facilitating mutual cooperation where possible). TFT's total score reflects the *collective benefit* of cooperation it enables, which AD actively destroys.
      *   **Why it's Not Simpson's Paradox:** Simpson's involves aggregation over subgroups where the trend reverses due to confounding variables. Here, the reversal isn't due to subgroup weighting; it's inherent in the scoring mechanism applied to the *same* pairwise interactions. TFT *always* scores less than its opponent in a head-to-head, yet its *sum* is larger because it cooperates with cooperators while AD defects against them.
      *   **Why it's Not Non-Transitivity:** Non-transitivity (A beats B, B beats C, C beats A) isn't the core issue. TFT doesn't *beat* any strategy head-to-head (it ties or loses slightly to AD). AD *beats* or *ties* everyone head-to-head. The reversal happens when aggregating *scores*, not wins/losses. The paradox exists even without a non-transitive cycle.
      *   **The Gap:** The gap is the difference between the metric optimized for a single pairwise contest (maximize my points in *this* game) and the metric for overall tournament success (maximize the sum of my points across *all* games). In PD, optimizing the first metric (like AD does) actively harms the second metric because it destroys potential cooperative gains with others. Optimizing the second metric (like TFT does) requires forgoing the *maximum possible* exploitation payoff in individual games.

  2.  **The Collapse of Always-Defect: Frequency-Dependent Selection (The "Self-Poisoning" Effect)**
      *   **Definition:** The fitness (success) of a strategy depends critically on its prevalence within the population. AD has high fitness (exploits cooperators) when rare, but low fitness (mutual defection) when common. TFT has stable fitness (mutual cooperation with TFT/cooperators, mutual defection with AD) regardless of frequency. This is a *separate phenomenon* driven by evolutionary dynamics, not the static tournament scoring paradox.
      *   **Connection:** The scoring paradox explains *why* AD does poorly in a static, diverse tournament (it poisons all cooperative interactions). Frequency dependence explains *why* AD collapses *evolutionarily* (as it becomes common, it increasingly poisons *its own* interactions). The static paradox shows AD's global weakness; the evolutionary collapse shows how that weakness is exploited by selection pressure. They share the root cause (AD's inherent destructiveness), but manifest differently.

  3.  **The Win-Counting Reversal: Metric Sensitivity (The "What Are We Measuring?" Problem)**
      *   **Definition:** Changing the scoring metric (sum of points vs. count of pairwise wins) fundamentally changes what constitutes "success" and reveals different strategic properties. Summing points rewards strategies that facilitate high-scoring interactions (like mutual cooperation). Counting wins rewards strategies that rarely lose head-to-head comparisons (like AD, which wins or ties every game). This reversal highlights that "best" is ill-defined without specifying the *goal*.
      *   **Relation to Core Paradox:** This reversal is a *consequence* of the core paradox. The core paradox arises because maximizing pairwise points (AD's strength) conflicts with maximizing the sum of points (TFT's strength). Switching to win-counting simply shifts the focus to the metric where AD *does* excel (not losing pairwise contests), making its local dominance visible at the aggregate level.

  **Synthesizing the Phenomena:**

  *   **The Core Phenomenon:** You've identified the fundamental tension in non-zero-sum games: **Strategies optimized for purely selfish local maximization (AD) can be globally inferior to strategies that forgo maximal local exploitation to enable mutually beneficial cooperation (TFT), due to the negative externalities generated by the purely selfish strategy.** This is the "Cooperation Externality Gap."
  *   **The Evolutionary Corollary:** When strategies replicate based on global success (summed points), purely selfish strategies (AD) are unstable because their success depends on exploiting others, which becomes impossible when they are common. Cooperative/reciprocal strategies (TFT) are evolutionarily stable.
  *   **The Metric Sensitivity:** The reversal when switching from summed points to win-counting demonstrates that AD's problem isn't that it's "weak" in an absolute sense, but that its strength (winning or tying every pairing) is orthogonal to (and often detrimental to) the metric of summed points which reflects collective efficiency.

  **Where the Distinction Vanishes (The Boundary Case):**

  The gap between pairwise dominance and total score supremacy vanishes only in scenarios where **strategies cannot generate externalities affecting others' scores, and no cooperation is possible.** Imagine a tournament where:

  1.  **No Interaction Effects:** Each strategy's score in a pairing depends *only on its own actions*, not on the opponent's actions. (This contradicts the core of PD).
  2.  **Fixed Payoffs:** Or, if payoffs depend on interaction, the only possible outcomes are symmetrical (e.g., only mutual cooperation or mutual defection payoffs exist, eliminating the temptation to defect).
  3.  **Zero-Sum:** Or, the game is strictly zero-sum (one player's gain is the other's loss). Here, maximizing your pairwise score *is* minimizing the opponent's score, and winning pairings directly correlates with a high total score (though ties complicate it slightly).

  **In Prisoner's Dilemma, this distinction is fundamental and unavoidable because the game is non-zero-sum and cooperation generates positive externalities while defection generates negative ones.** The gap *is* the essence of the dilemma.

  **Proposed Name & Definition:**

  *   **Name:** **The Cooperation Externality Gap** (or **Selfishness Externality Trap**)
  *   **Definition:** In multi-agent systems with non-zero-sum interactions (like the iterated Prisoner's Dilemma), the phenomenon where strategies designed to maximize individual payoff in each pairwise encounter (e.g., Always-Defect) achieve lower total aggregate payoff than strategies that sacrifice maximal individual exploitation to enable mutually beneficial cooperation (e.g., Tit-for-Tat). This arises because the purely selfish strategy imposes negative externalities (reduced payoff potential) on cooperative agents, dragging down the collective payoff pool from which its own total score is drawn. The gap manifests as a reversal between pairwise dominance (measured by win-count or relative score within a pair) and overall success (measured by summed total payoff). This gap collapses only in environments devoid of cooperative potential or interaction externalities (e.g., strict zero-sum games or fixed, non-interactive payoffs).

  This definition captures the core conflict between local and global optimization driven by externalities, distinguishes it from statistical paradoxes and non-transitivity, acknowledges the separate but related evolutionary dynamics (frequency dependence), and defines the boundary conditions where the distinction becomes irrelevant.
