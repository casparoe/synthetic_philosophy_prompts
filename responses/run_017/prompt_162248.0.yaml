prompt: |-
  Im writing a short applied paper on which burdens an institution — a hospital's call schedule, a department's service assignments, a disaster-response roster — may require of people and which it can only invite them to take on, so I need an account of supererogation that does actual work, not another tour of the saint and the hero. Give me the desiderata first: the cases it has to sort correctly, the distinctions it cant collapse, and the facts about praise and blame it has to respect, with the case behind each. The ones I want on the list, at minimum: cheap rescue with huge stakes vs. costly rescue with modest stakes, and where (if anywhere) beyond-duty flips into required; the same act done by a stranger vs. by someone whose role already covers it; sacrifice paid for by a third party, like funding a stranger's surgery out of your kids college money; supererogatory omissions, e.g. forgiving when you had every right to go on resenting; the collective case where everyone does it, so no one is a hero and no one is off the hook; the entitled-but-nasty act that is blameworthy to do and not to omit; the agent who never once considers helping, and what exactly we are blaming them for; and the hero with a rotten motive. For each, say whether its a genuine desideratum or just a prejudice of the maximizing camp or the personal-options camp. Then flag the pair you think cant be jointly satisfied, and name the single requirement that rules out the most candidate accounts. Two or three lines each on how a personal-prerogative view, a scalar view built on what an ideally good agent would do, and maximizing-plus-options do against the list — I'll fill in the scorecard myself.
reasoning: |-
  Okay, the user is writing an applied paper on institutional burdens versus voluntary contributions, specifically needing a practical theory of supererogation. They want desiderata—essential criteria that a theory must handle—listed with cases, and then an analysis of how three theories perform. 

  First, I need to unpack their request. They’re frustrated with abstract philosophical debates (e.g., "saint and hero" tropes) and want concrete tools for real-world scenarios like hospital call schedules or disaster rosters. Their examples span individual/collective acts, role obligations, motives, and praise/blame dynamics. The key is practicality: how institutions can *require* some duties while leaving others as genuine *invitations*. 

  The desiderata they listed are non-negotiable. I’ll organize them with:  
  - **Cases**: Concrete scenarios (e.g., cheap vs. costly rescue).  
  - **Distinctions**: Boundaries the theory must uphold (e.g., when "beyond duty" flips to required).  
  - **Praise/Blame Facts**: How we evaluate agents (e.g., blaming someone who never considers helping).  
  - **Genuineness Check**: Whether it’s a core problem or a bias of specific camps (maximizing vs. personal-options).  

  For the **"flip to required" case**, it’s a genuine puzzle: if stakes are astronomical and cost trivial, refusing seems blameworthy. But *why*? A good theory must explain this without collapsing duty/supererogation. The **collective case** is also critical—it’s where institutional design meets ethics. If *everyone* must chip in moderately, heroism vanishes, but shirking becomes impermissible.  

  I suspect the **stranger vs. role-holder distinction** and the **collective case** might clash. Role-holders (e.g., doctors) have contracted duties; strangers don’t. But in collective action (e.g., disaster response), roles might blur. Can a theory handle both without overmoralizing roles or underdemanding from strangers?  

  The hardest requirement is **"beyond-duty flips to required"** because it challenges the core definition of supererogation. If an act becomes obligatory under certain conditions, is it *still* supererogatory? This torpedoes many theories—especially scalar views (which see duty as a threshold) and maximizing (which struggles with "permissible not to" vs. "required").  

  Now, for the three theories:  
  1. **Personal-Prerogative**: Excels at protecting agents (e.g., not spending kids’ college funds) but flops on cheap high-stakes rescues (refusing looks selfish, not permissible).  
  2. **Scalar**: Handles praise gradients (e.g., rotten-motive heroes) but can’t explain why we *don’t* blame non-maximizers.  
  3. **Maximizing-Plus-Options**: Nails the collective case (everyone must contribute) but overshoots—it might turn all modest sacrifices into duties, killing supererogation.  

  The user’s hidden need? **Institutional pragmatism**. They’re likely designing systems (e.g., hospital rotations) where some burdens *must* be enforced (to prevent free-riding), while others *should* be optional (to avoid burnout). The theory must clarify where that line is—without philosophical hand-waving.
answer: |-
  Here’s a distilled framework for your applied paper, focusing on practical desiderata for supererogation and how key theories handle them.  

  ---

  ### **Desiderata for a Working Account of Supererogation**  
  *(Genuine = core problem; Prejudice = camp-specific bias)*  

  1. **Cheap Rescue (High Stakes)**:  
     - *Case*: Ignoring a drowning child when saving them costs nothing.  
     - *Distinction*: Must explain when "easy high-impact" acts flip from supererogatory to obligatory.  
     - *Praise/Blame*: Blameworthy omission. **Genuine**.  

  2. **Costly Rescue (Modest Stakes)**:  
     - *Case*: Donating a kidney to a stranger for a minor health improvement.  
     - *Distinction*: Sacrifice must remain non-obligatory without collapsing into "optional = irrelevant."  
     - *Praise/Blame*: Praiseworthy but not required. **Genuine**.  

  3. **Stranger vs. Role-Holder**:  
     - *Case*: A nurse (role) vs. a passerby (stranger) performing CPR.  
     - *Distinction*: Role duties alter baseline obligations; supererogation must adjust contextually.  
     - *Praise/Blame*: Nurse blamed for omission; stranger praised for action. **Genuine**.  

  4. **Third-Party Sacrifice**:  
     - *Case*: Funding a stranger’s surgery with your child’s college fund.  
     - *Distinction*: Cost to dependents ≠ personal cost alone.  
     - *Praise/Blame*: Not obligatory, possibly blameworthy if it harms dependents. **Genuine**.  

  5. **Supererogatory Omission**:  
     - *Case*: Forgiving a grave betrayal when resentment is justified.  
     - *Distinction*: Forgoing a right ≠ mere passivity.  
     - *Praise/Blame*: Praiseworthy omission; no blame for non-forgiveness. **Genuine**.  

  6. **Collective Action**:  
     - *Case*: Disaster response where all must contribute moderately (no heroes).  
     - *Distinction*: Individual duty emerges from group context.  
     - *Praise/Blame*: All obligated; no one exempt. **Genuine**.  

  7. **Entitled-but-Nasty Acts**:  
     - *Case*: Demanding repayment from a destitute debtor (legally permissible but cruel).  
     - *Distinction*: Permissible ≠ admirable; often blameworthy.  
     - *Praise/Blame*: Blame for doing; no blame for omitting. **Prejudice (personal-options camp)**.  

  8. **Agent Who Never Considers Helping**:  
     - *Case*: Walking past a crisis without a thought.  
     - *Distinction*: Indifference vs. conscious refusal.  
     - *Praise/Blame*: Blameworthy for moral negligence. **Genuine**.  

  9. **Rotten-Motivation Hero**:  
     - *Case*: Saving lives for fame.  
     - *Distinction*: Act-praise vs. agent-praise.  
     - *Praise/Blame*: Act praiseworthy, motive blameworthy. **Genuine**.  

  **The Tension**: **#1 (Cheap Rescue)** and **#6 (Collective Action)** conflict. If cheap rescues flip to obligatory, collective cases erase supererogation entirely.  
  **Most Damaging Requirement**: **"Cheap high-stakes rescue flips to required"** — rules out theories that rigidly separate duty/supererogation.  

  ---

  ### **Theory Snapshots**  
  1. **Personal Prerogative** (e.g., Scheffler):  
     - *Strengths*: Excels at #4 (third-party costs), #7 (entitled acts), #8 (protects autonomy).  
     - *Weaknesses*: Fails #1 (can’t explain cheap-rescue obligation), #6 (collective duty).  

  2. **Scalar** (e.g., Urmson’s "ideally good agent"):  
     - *Strengths*: Handles #9 (praise/blame separation), #5 (forgiving as "better" but not required).  
     - *Weaknesses*: Collapses #1/#2 (no clear duty/supererogation threshold), struggles with #3 (role contexts).  

  3. **Maximizing-Plus-Options** (e.g., rule-utilitarianism + agent-centered options):  
     - *Strengths*: Nails #6 (collective duty), #1 (cost/benefit flips).  
     - *Weaknesses*: Fails #2 (costly rescues often become obligatory), #4 (ignores personal stakes).  

  ---

  ### **Key Takeaway**  
  **The irreconcilable pair**: **Collective Action** demands universal obligation, but **Costly Rescue** requires preserving optionality. No theory cleanly resolves both. **Scalar views** struggle most with institutional design (blurring required/invited acts), while **maximizing-plus-options** collapses supererogation under collective demands. **Personal prerogative** best protects individual boundaries but fails cheap-rescue cases — problematic for institutions managing high-stakes/low-cost duties (e.g., hospital codes).  

  Use this to map where your institution’s burdens *must* be enforced (collective/low-cost) vs. where invitation suffices (high-cost/role-external). I’ll await your scorecard!
