prompt: |-
  Hi — I need a teaching plan here, not the explanation itself.

  Context: I'm a philosophy professor (political philosophy mostly) and a friend who runs a youth citizens' assembly has talked me into doing 45 minutes on a Saturday morning with about twenty-five 16-to-18-year-olds who are then going to spend the rest of the weekend drawing new state-legislative maps with some redistricting-software volunteers. She wants the boundary problem in their heads before they start moving lines around, on the grounds that otherwise they'll treat redistricting as pure geometry. My worry is the opposite failure: they'll hear the word boundary and immediately think district lines, gerrymandering, packing and cracking — when the question I care about is who the people are in the first place. So: give me the plan for the explanation. What has to come first and what depends on what — do I have to get them to feel the circularity (the people can't decide who the people are without already being constituted) before any principle like all-affected-interests means anything to them, or does that paradox land as a cheap gotcha at this age? And what's the one carrying case?

  The case I keep coming back to is one I made up, and I want you to tell me whether it works or what it needs: Cedar Flats is an upstream town of about 500 year-round residents plus a few hundred seasonal cabin owners who pay property tax there; below it sits a town of 12,000 whose drinking water runs off the wetland the upstream town is voting on draining for a housing development; and the state, which owns part of the land and would send someone to enforce whatever gets decided, has six million people. Somebody says it's the 500, somebody says the 12,000, somebody says all six million pay for the state agency, somebody says the herons. I like it because affectedness, coercion and contribution come apart, but I can't tell whether it's too crowded, or whether it quietly rigs the answer toward everyone affected. Tell me what the case has to have and what it has to lack — my instinct is that it must not turn on citizens vs. non-citizens, because that instantly converts into an immigration argument and we lose the conceptual point, but you tell me.

  Two more things. First, I've been toying in my own notes with splitting the one question into three — who belongs, who gets a hearing, who actually casts the vote — and I can't decide if naming that distinction helps them or is one more piece of machinery for 45 minutes. Second, the misconceptions I'm braced for, in no order: the district-lines conflation; "just count everyone affected" (which sounds obviously right until it goes global, and then they'll think the upshot is world government and that that's fine); "there's a legal answer, just look it up" (legal authority vs. legitimation); residence as an invisible default; and confusing all this with whether 16-year-olds should vote, which is the franchise question and not the membership question. I want you to place each one at a specific point in the sequence rather than listing them, and to add the ones I've missed — especially anything a group of teenagers who've just been handed mapping software will generate that I won't see coming.

  Give me, in this order and roughly these lengths: Sequence (~250 words, numbered, with the dependency made explicit); The carrying case (~150 words — verdict on Cedar Flats, what it must have and lack, or a replacement); Misconception map (~300 words, each one pinned to where in the sequence it gets defused); The check (~80 words, one question for the last five minutes, plus what a confident-but-wrong answer sounds like); What I'll skip and say so (~80 words, what I should openly refuse to settle at this level — I assume I shouldn't try to adjudicate between the all-affected and the coercion principles, or touch secession, or open the does-democracy-have-any-value can of worms, but tell me if I'm wrong); Where I'd change my mind (~120 words, what in your plan is most likely to break in the actual room, which argument or consideration would make you reorder it, and what I'd see in the first five minutes that should make me switch to a different opening).
reasoning: |-
  Okay, let me approach this systematically. The user is a political philosophy professor preparing a 45-minute session for teenagers about the boundary problem in redistricting contexts. They need a focused teaching plan rather than content explanations.

  First, I consider the core challenge: shifting focus from district lines (gerrymandering) to the prior question of constituency definition. The professor wants to avoid common misconceptions while making abstract concepts tangible for high schoolers. The Cedar Flats case seems promising but needs refinement - it must clearly separate affectedness, coercion and contribution without triggering immigration debates.

  For the sequence, I'm thinking:
  1) Start with the immediate problem they'll face (drawing maps) to hook their interest
  2) Reveal the deeper question through a case study
  3) Explore competing principles
  4) Show circularity last to avoid "gotcha" effect
  5) Connect back to their practical task

  The Cedar Flats case works if we:
  - Remove citizenship references
  - Add temporal dimension (future generations)
  - Include non-human interests (herons) as deliberate provocation
  - Ensure all stakeholder claims have plausible weight

  Key misconceptions to address at specific points:
  - "Just count everyone affected" when discussing global implications
  - Legalistic thinking during principle evaluation
  - Residence default when introducing the case
  - Franchise confusion during takeaways

  The check question should test whether they distinguish boundary-setting from line-drawing. A wrong answer would focus on voting mechanisms rather than constituency definition.

  We'll explicitly skip:
  - Principle adjudication
  - Secession
  - Democracy's value
  - Franchise age debates

  Most fragile element is the circularity demonstration - if the room feels restless, we might compress principles 2-4 into paired examples. If the opening map exercise falls flat, pivot immediately to Cedar Flats as concrete anchor.
answer: |-
  Here’s your teaching plan, structured as requested:

  ---

  ### **Sequence** (250 words)  
  1. **Hook with redistricting software** (5 min):  
     Start with their immediate task—"You’ll draw district lines today. But before moving lines, ask: *Who* should be in the room when we decide?" Show a blank map. *Dependency*: Grounds the abstract in their practical goal.  

  2. **Introduce the boundary problem via Cedar Flats** (10 min):  
     Present the case neutrally. Ask: "Who gets to vote—500 locals, 12K water users, 6M taxpayers, or herons’ advocates?" *Dependency*: Forces them to confront competing claims *before* principles, making the problem visceral.  

  3. **Extract three questions** (5 min):  
     Name the distinction:  
     - **Who belongs?** (Membership)  
     - **Who gets a hearing?** (Voice)  
     - **Who votes?** (Decision authority)  
     *Dependency*: Case makes this tangible; naming it prevents conflation later.  

  4. **Explore principles** (15 min):  
     - **Affectedness**: "Should the 12K water-drinkers decide?"  
     - **Coercion**: "Does the state’s enforcement power give all 6M a say?"  
     - **Contribution**: "Do cabin owners’ taxes grant authority?"  
     *Dependency*: Principles derive from case stakes; avoid theoretical labels.  

  5. **Reveal circularity** (5 min):  
     "Notice: We need a group to decide the group. No escape hatch—principles can’t resolve this alone." *Dependency*: Must follow principles to avoid seeming like a cheap paradox.  

  6. **Link back to redistricting** (5 min):  
     "When you draw lines, you’re not just grouping voters—you’re deciding *whose voices matter* in the first place."  

  ---

  ### **Carrying Case** (150 words)  
  **Verdict on Cedar Flats**: *Keep it, but simplify.*  
  - **Must have**:  
    - Competing claims (affected vs. coercive power vs. contribution)  
    - Non-human interests (herons) to challenge anthropocentrism.  
    - Scale clash (local vs. state).  
  - **Must lack**:  
    - Citizenship/immigration angles (replace cabin owners with "absentee landlords" to avoid status debates).  
    - Clear legal resolution (state jurisdiction is ambiguous).  
  - **Tweak**: Reduce numbers. Make wetlands state-owned but locally managed. *Why it works*: Forces trade-offs without rigging for "all affected."  

  ---

  ### **Misconception Map** (300 words)  
  Pin each to where it’s defused in the sequence:  
  - **"Boundary = district lines"**: Defused at **Hook (Step 1)** by posing "Who *should* be represented?" before drawing lines.  
  - **"Just count everyone affected"**: Defused during **Principles (Step 4)** by showing global absurdity ("Should herons vote? Should Beijing?").  
  - **"There’s a legal answer"**: Defused in **Cedar Flats (Step 2)** by omitting clear jurisdiction.  
  - **Residence as default**: Defused by **Three Questions (Step 3)**—cabin owners pay taxes but don’t reside; herons aren’t residents.  
  - **Franchise confusion** (voting age): Defused in **Link Back (Step 6)**—"This isn’t about *who votes* but *who is represented*."  
  - **Missed misconception**: **"Fairness = equal districts"** (geometric bias). Defused in **Hook (Step 1)** by questioning *which people* matter.  
  - **Missed teen blind spot**: **Software as neutral tool**. Preempt in **Hook (Step 1)**—"Tech doesn’t answer who the ‘people’ are."  

  ---

  ### **The Check** (80 words)  
  **Final question**: *"When you draw a district, are you creating a community or discovering one?"*  
  - **Confident-but-wrong answer**: "Discovering—we’re just grouping people who already belong." (Misses that boundaries *define* belonging.)  
    *Why it works*: Tests if they grasp the constitutive dilemma.  

  ---

  ### **What I’ll Skip and Say So** (80 words)  
  Openly exclude:  
  - Adjudicating principles ("We won’t solve affectedness vs. coercion today").  
  - Secession ("That’s about exit, not voice").  
  - Democracy’s value ("We assume it’s worth doing").  
  - Franchise age ("Whether 16-year-olds vote is separate from *who they vote with*").  
  *Rationale*: Prevents digressions while honoring complexity.  

  ---

  ### **Where I’d Change My Mind** (120 words)  
  **Likely breakpoint**: Step 5 (circularity). If teens dismiss it as a "gotcha," **compress principles** and **prolong Cedar Flats debate**.  
  **Red flag in first 5 minutes**: If the redistricting hook sparks gerrymandering debates, **abandon the map** and start directly with Cedar Flats.  
  **Key argument to reorder**: If "all affected" dominates early, **introduce coercion faster** (e.g., "What if the state ignores the vote?").  
  **Switch opening if**: You see eyes glaze over—**start with herons**. Teens engage with non-human rights.  

  ---

  **Core logic**: The case *precedes* principles to make the problem felt. Circularity lands only if they’ve wrestled with irresolvable claims. Cedar Flats—stripped of citizenship—exposes the dilemma without rigging outcomes.
