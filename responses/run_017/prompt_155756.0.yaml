  I need to address the core tension: this behavior happens "in the open" and isn't considered dishonest, yet clearly serves argumentative purposes. The reference class problem provides the foundation - recognizing that multiple valid reference classes exist. But the novel element is how the choice becomes functional to the decision context. 

  For the labeling challenge: "evidential opportunism" captures the normative ambiguity - it's not quite cherry-picking but leverages inherent statistical flexibility. The "grain-shift dilemma" describes the structural problem when decision contexts pull in opposite directions. 

  Important to validate that this isn't just statistical illiteracy - the user emphasizes everyone understands all numbers are correct. The crux is how decision pressures interact with inherent statistical indeterminacy at the individual level. 

  For boundary cases: clinical equipoise presents a legitimate version where grain-shifting might be appropriate. But when used to systematically override patient autonomy under the guise of "individualized judgment," it becomes ethically problematic despite statistical validity. 

  The user will appreciate precise distinctions: cherry-picking hides alternatives, while this displays them; Simpson's paradox shows contradictory trends, while here all numbers coexist truthfully. The key addition is the functional relationship to argumentative goals.
answer: |-
  Based on your exceptionally clear description, this phenomenon sits at the intersection of several established concepts, but no single term perfectly captures the *combination* of features you highlight – particularly the *argumentative purpose-driven selection* of grain size from among multiple statistically valid reference classes. Here's a breakdown:

  1.  **Core Foundation: The Reference Class Problem (RCP):**
      *   **What it is:** The fundamental philosophical and statistical problem of choosing the appropriate reference group (population) to assign a probability to an individual case. Hans Reichenbach (1949) is often credited with its formalization. It highlights the indeterminacy: multiple valid, non-nested reference classes exist, yielding different probabilities, and there's no purely statistical rule to select the single "correct" one for an individual.
      *   **How it fits:** This perfectly explains the *availability* of multiple admissible comparison groups (78-year-olds, runners, service discharges, diagnosis + postal district) and the resulting variation in probability estimates for the *same* individual. Everyone accepts the figures are correct *for their respective classes*.
      *   **Where it stops:** The RCP describes the *existence* of the problem – the multiplicity of valid probabilities. It doesn't inherently address the *systematic pattern* of selection based on *argumentative purpose* ("justify withholding" vs. "justify overriding"). It's descriptive of the dilemma, not prescriptive or explanatory of the observed behavioral pattern.

  2.  **The Key Addition: Purpose-Driven Grain Selection (Evidential Opportunism / The Grain-Shift Dilemma):**
      *   **The Phenomenon:** This is the novel core you've identified: the *consistent pattern* where the choice of reference class granularity (broad vs. fine-grained) is functionally adapted to support the desired conclusion in a specific decision context, leveraging the inherent indeterminacy of the RCP.
      *   **Why it's distinct:**
          *   **From Ordinary Cherry-Picking:** Cherry-picking typically involves searching for *any* subgroup (often statistically dubious, post-hoc, or hidden) that supports a predetermined conclusion, discarding or ignoring contradictory evidence. **Your case is different:** All presented reference classes are *statistically admissible and valid* based on the data/model. The alternatives are *displayed and acknowledged* as legitimate options within the RCP. The "bias" isn't in fabricating data, but in *strategically selecting which valid frame to emphasize* based on the argumentative goal. It's opportunism *within* the space of legitimate evidence.
          *   **From Plain Reversal under Partitioning (Simpson's Paradox):** Simpson's Paradox shows how a trend can reverse when data is aggregated vs. disaggregated (e.g., a treatment looks beneficial overall but harmful within every subgroup). **Your case is different:** There's no *reversal* of effect direction implied here. All probabilities might point to high or low risk, just at different magnitudes. The conflict isn't about the *sign* of the effect changing, but about *which magnitude of risk* (from a valid class) should be deemed most relevant. Both numbers are "simply correct" *for their class*, but the argumentative purpose drives which class is deemed *relevant*.
      *   **Potential Labels (None Perfectly Standard, But Descriptive):**
          *   **Evidential Opportunism:** This captures the strategic selection of *valid* evidence frames (reference classes) to support a pre-existing goal. It emphasizes the functional use of evidence within the space allowed by the RCP.
          *   **The Grain-Shift Dilemma:** Highlights the central tension: the need to shift the "grain" (level of aggregation) of the reference class depending on whether the argument requires emphasizing population-level evidence (broad grain) or individualized judgment (fine grain).
          *   **Motivated Reference Class Selection:** Explicitly links the selection process to the motivational context of the decision argument.
          *   **Functional Framing of Risk:** Emphasizes how the risk estimate is framed (by choice of reference class) to serve a specific function in the decision-making discourse.

  3.  **Legitimate vs. Problematic Instances:**
      *   **Legitimate Grain-Shifting:** Yes, a *principled* version exists and can be legitimate. The key is **transparency about the rationale for the shift and alignment with the decision context**:
          *   **Example:** A hospital administrator uses a *broad* population readmission rate (e.g., "Medicare patients with CHF") for *resource allocation* (bed planning, staffing models). This prioritizes stability, generalizability, and large-scale predictability. Simultaneously, a *clinician* uses a *finer-grained* estimate (e.g., "CHF patients living alone in X district with recent ED visit") for *shared decision-making* with *this specific patient* about post-discharge support services. Here, the shift acknowledges that resource decisions need stable population estimates, while personalized care decisions benefit from the most relevant individualized estimate possible (even if less stable).
          *   **Justification:** The shift is driven by the *nature of the decision* (population-level resource planning vs. individual care plan) and the *relevant type of uncertainty* each decision must handle. It's explicit and justified based on decision theory principles.
      *   **Problematic Grain-Shifting (as described):** The instances you describe become problematic due to:
          *   **Argumentative Asymmetry:** The same actor shifts grain *specifically* to justify overriding patient autonomy ("individualized" fine grain) or restricting access ("population evidence" broad grain). The shift serves the *clinician's/institution's desired action* rather than being transparently tied to the inherent demands of *different types of decisions*.
          *   **Undermining Autonomy:** Using a manufactured "individualized" estimate (from a small, potentially unstable subgroup) to override a patient's expressed wishes is ethically fraught, as it leverages statistical indeterminacy to dismiss autonomy under a guise of precision.
          *   **Lack of Transparency in Rationale:** While the numbers are open, the *reason for choosing that specific grain* for *that specific argument* isn't grounded in a principle beyond supporting the desired conclusion. It risks being an exercise in motivated reasoning clothed in statistical validity.

  **Synthesis and Definition:**

  The phenomenon you observe is best described as **Purpose-Driven Evidential Opportunism within the Reference Class Problem**. It leverages the inherent statistical indeterminacy of assigning group-based probabilities to individuals (RCP) to strategically select the reference class whose grain size (broad or fine) best serves the argumentative purpose of the moment (e.g., justifying resource withholding via broad classes or autonomy override via fine classes), despite the availability of multiple equally statistically admissible alternatives.

  **Boundary Cases & Distinctions Clarified:**

  *   **vs. Cherry-Picking:** Cherry-picking searches for *any* supportive data point/subgroup, often invalid or hidden. This uses *only* statistically valid reference classes, openly acknowledges alternatives exist (RCP), but selects *which* valid frame to deploy based on argumentative goal.
  *   **vs. Simpson's Paradox/Reversal:** Simpson's involves a reversal of association direction under aggregation/disaggregation. Here, the *direction* of risk (high/low) might be consistent; the conflict is over *which magnitude* from *which valid class* is most relevant, driven by purpose, not a statistical paradox per se.
  *   **Legitimate Boundary Case:** Shifting grain is legitimate when transparently linked to *fundamentally different decision types* requiring different kinds of evidence (e.g., stable population rates for resource planning, best-available individualized estimates for shared decision-making), with the rationale made explicit. The illegitimacy arises when the shift serves only to bolster the *same type of decision argument* (e.g., "should we do this procedure?") depending on whether the desired answer is "no" (use broad class) or "yes, despite patient hesitance" (use fine class).

  **Conclusion:**

  You've pinpointed a sophisticated manifestation of the Reference Class Problem in action within high-stakes clinical decision-making. While the RCP provides the underlying statistical structure, the systematic, purpose-driven selection of grain size represents a distinct behavioral and argumentative pattern – **Evidential Opportunism** or the **Grain-Shift Dilemma**. It highlights how statistical validity can be exploited within a space of indeterminacy to serve non-statistical goals, posing significant ethical and practical challenges for evidence-based medicine and patient autonomy, even when conducted "in the open." The legitimacy hinges crucially on the transparency and principled justification for *why* a particular grain is appropriate for *that specific decision context*.
