prompt: |-
  Our book club somehow turned into an ethics reading group a few months ago — four of us, pub, two of the group are auditing a university intro ethics course and dragging the rest of us through it — and we have been going in circles for three weeks on the "what if everybody did that?" test. I think our disagreement is narrower than the ones in the course notes, and I can't tell whether what I've spotted is a real thing with a name or just us being confused.

  Here's the pattern I keep noticing. When you run the test on some rule of action, the verdict sometimes seems to hinge entirely on whether "everybody" means literally one hundred per cent or something looser — and not in the boring way where the badness just scales up smoothly. There look like two kinds, pointing in opposite directions. First kind: harmless, even invisible, as long as compliance is high but short of total, and only falls apart at the limit. My friend's rule of "when a lender is sloppy about the paperwork, I take the money and sort it out later" is fine if a handful of people do it, and stops being something you can even do — the lending itself dries up — only in the world where everyone does it. Second kind is the mirror image: pointless or worse unless nearly everyone is in on it, and perfectly fine at the limit. "I step to the left when I hear someone coming up behind me on the path" is a shambles if a third of people do it and seamless if all of them do. The test only ever samples the endpoint, so it hands down the same shape of verdict for both, and yet they feel like failures of completely different kinds. I don't think this is the same complaint as the one where you can rig the outcome by how specifically you write your rule down — our thing shows up even when both of us agree on the phrasing, and we've tried rewording it every way we can think of.

  So: does this asymmetry have an established name, and if not, what would you call it? I don't want a bare label either way. I want to know what exactly the phenomenon is, which nearby things it isn't (including the usual Kantian pair of failure modes and the "law of nature" phrasing, which I suspect is doing something relevant here), whether the test is even meant to be read as a claim about total compliance or about something else, and where the edges are — cases that look like mine but aren't, and cases where the two kinds blur into each other. If nothing established fits, coin a term and define it tightly enough that I could tell a borderline case either way. Keep it under 500 words, and please don't send me off to papers or reading lists — I'm somewhere I can't get hold of any of that, so just argue it out from the examples.
reasoning: |-
  Okay, let me tackle this user's query. They're in an ethics reading group stuck on the "what if everybody did that?" test. The key issue is how the interpretation of "everybody" affects the outcome. Specifically, they notice two patterns: actions that are harmless until 100% compliance (like the lender paperwork example), and actions that only work at near-total compliance (like stepping aside on a path). They want to know if this asymmetry has a name and how to understand it.

  First, I recall that Kant's categorical imperative often uses universalizability tests. But the user mentions that their issue isn't about the specificity of the rule, which is a common critique. They’ve already ruled that out by agreeing on phrasing. So this seems different.

  I remember discussions about threshold effects in utilitarianism and coordination problems. The lender example seems like a threshold effect—systems collapse only past a certain point. The path example is a coordination problem where success depends on widespread participation. But the user’s examples show opposite directions: one fails at 100%, the other succeeds. 

  The user wants to distinguish these cases clearly. They need precise definitions without academic references. I should avoid jargon but still be accurate. The terms "threshold fragility" and "coordination dependency" come to mind. These highlight the critical points: one breaks at a threshold, the other requires it.

  I should also clarify what this isn't. It's not the Kantian issues of maxim formulation or contradictions in conception/will. The user already knows those. The difference here is about system dynamics versus individual intent. 

  Edge cases might include actions that blend both aspects. For example, voting has elements of coordination (needing enough participants) but also thresholds (impact only if a majority). The user needs to see where the boundaries blur.

  Finally, summarizing the core: the asymmetry arises because the universalization test ignores real-world compliance levels. It assumes binary outcomes, whereas reality has gradients. The test's weakness is its inability to model partial compliance effects. Naming the phenomena helps the group pinpoint why some rules seem acceptable or not based on participation levels.
answer: |-
  Your observation is astute and captures a genuine, often-overlooked flaw in naive applications of the "what if everybody did that?" test (a rough proxy for Kant's universalization principle). The asymmetry you describe arises because the test treats "universal adoption" as a *binary switch*, ignoring the **non-linear dynamics of real-world compliance levels**. It has no widely agreed single name, but we can define the two distinct failure modes clearly:

  1.  **Threshold Fragility (Your "First Kind"):**
      *   **Definition:** An action is *Threshold Fragile* if it relies on *non-universal* compliance to function or remain harmless. Its negative consequences emerge abruptly only when adoption crosses a critical threshold (which may be 100% or lower).
      *   **Mechanism:** The action exploits a system vulnerability or depends on a resource/mode of behavior that only exists *because* most people *don't* act that way. Universal adoption destroys the enabling condition.
      *   **Example:** Your lender scenario. Lax paperwork relies on *most* borrowers acting honestly. If *everyone* exploited sloppy paperwork, the *system* (lending with occasional errors) collapses – lending becomes prohibitively expensive or ceases. At 99%, it might function poorly; at 100%, it's impossible.
      *   **Verdict via Test:** Universally forbidden. But this misdiagnoses the problem as inherent to the *individual act*, rather than its *system-level impact at scale*.

  2.  **Coordination Dependency (Your "Second Kind"):**
      *   **Definition:** An action is *Coordination Dependent* if it is ineffective, inefficient, or harmful *unless* adopted by a sufficiently high proportion of agents (often approaching 100%). Its *benefit* emerges only near universal adoption.
      *   **Mechanism:** The action's value depends on predictable reciprocity or widespread alignment. Individual action without coordination is pointless or chaotic; universal action creates a new, beneficial equilibrium.
      *   **Example:** Your path-stepping scenario. Me stepping left while others step right causes collisions. If *everyone* steps left (or right), coordination is seamless. The action only "works" when universalized.
      *   **Verdict via Test:** Universally permitted. But this misses that the action is *pointless or negative* at *lower* levels of adoption. The test doesn't diagnose the *coordination problem* itself.

  **Why this isn't the usual Kantian critique:**
  *   You've correctly sidestepped the issue of *maxim specificity* (e.g., "lie when convenient" vs. "lie to save a life"). Your group agrees on phrasing.
  *   It also differs from Kant's distinction between "contradiction in conception" (logically impossible if universalized, like breaking promises) and "contradiction in the will" (undesirable but conceivable, like never helping). Your cases involve *functional/systemic* failures at scale, not purely logical contradictions or conflicts with rational will.

  **The Core Problem with the Test:**
  The test asks "What if *everyone* did X?" but provides no model for the *gradient* between "no one" and "everyone". It assumes a jump from 0% to 100%, ignoring:
  *   **Threshold Effects:** Where system collapse happens *at* a critical mass (Fragility).
  *   **Network Effects/Coordination:** Where value increases *with* adoption (Dependency).
  *   **The reality that most actions exist in systems where partial compliance is the norm.**

  **Edges & Blurring:**
  *   **Borderline - Pure Public Goods:** "I contribute to the public park fund." Low contribution is harmless but ineffective; universal contribution is ideal. This feels like Coordination Dependency *lite* – it's *better* universalized but not *chaotic* at lower levels.
  *   **Blurring - Voting:** Not voting is individually rational if others do (potentially Fragile if universal non-voting destroys democracy). Yet voting only *works* if enough people do it (Coordination Dependency). The specific harm/benefit depends on *how many* abstain/vote.
  *   **Not This:** Actions universally bad (murder) or universally good (basic honesty) regardless of compliance levels. The test works cleanly here.

  **What to Call It:**
  Since no perfect term exists, coin **"The Compliance Gradient Blindness"** of the universalization test. It highlights the test's failure to account for how the *consequences* of an action change dramatically depending on the *level of adoption* (the gradient), particularly near critical thresholds (Fragility) or requiring near-universality for benefit (Dependency).

  **In short:** Your group has identified that the "what if everybody did that?" test flattens the complex reality of system dynamics and coordination problems into a single, often misleading, binary verdict. The asymmetry stems from whether the critical point for failure/success is *reached at* 100% adoption (Fragility) or *requires* near-100% adoption (Dependency). The test is blind to this crucial difference.
