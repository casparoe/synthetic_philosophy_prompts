prompt: |-
  I write political fiction, and the novel I am finishing turns on a body of my own invention: the Board of Charters, which drafts a constitution for each province as it accedes to the Union of Verraine. A good part of the book is the Board arguing with itself in closed session, and I want those arguments to be real ones — the kind a comparative-institutionalist could read with a pencil without laughing. I have read the standard case for fusing legislative and executive power and the standard case for separating them, and I do not need either rehearsed back to me, nor do I want authorities, reading lists, or citations. What I need is this: given the five settlements my Board reached before the story opens, what has it already committed itself to, and what follows for the sixth case, which is the one I am actually writing.

  The precedents, as my narrator summarizes them:

  **Sable.** Six parties in the assembly, none above a quarter of the seats, no pair able to govern without a third, labels traded between elections, two decades of cabinets lasting under a year. The Board prescribed a parliamentary charter: the assembly elects the premier, and it may unseat a premier only by simultaneously naming a successor (the clerks call this the substitution rule). A proposal for a directly elected governor was rejected without discussion.

  **Ondres.** Two disciplined programmatic parties alternating in office, a career civil service, an audit office that had actually prosecuted a former minister, and a public that in the Board's own hearings ranked delivery of legislation above being consulted. The Board prescribed a directly elected governor: four-year fixed term, cabinet drawn from outside the assembly, no ordinance power, a narrow emergency power that lapses unless the assembly affirmatively approves it within thirty days, select committees with subpoena power, and removal only by impeachment on a two-thirds vote for defined offences.

  **Kalva.** Two coups in thirty years, weak personalist parties, and a strong popular demand for a directly elected head of province even among those who feared the generals. The Board prescribed a semi-presidential charter: a directly elected president, fixed term, confined to external relations and defence, unable to dissolve the assembly, who appoints a premier holding assembly confidence and answerable for everything domestic. The president is removable by a two-thirds assembly vote followed by a provincial referendum; the premier by ordinary no-confidence under the substitution rule.

  **Upper Aule.** Small, homogeneous, a long tradition of initiative and referendum, low trust in parties. The Board rejected a proposal for a directly elected mayor-governor with power to legislate by ordinance and to dissolve the council. It prescribed instead a five-member executive council elected at large, chair rotating annually, no dissolution, any ordinance suspendable by popular initiative within ninety days, and any single member recallable by petition of a fixed share of voters.

  **The Verrine Coast.** Three regions, one of them a secessionist minority with about thirty per cent of the population; every party is regional, none provincial. The Board prescribed a parliamentary premier, but required that confidence be withdrawable only by a majority that also carries majorities in each of the three regional delegations, and it refused a directly elected governor on the ground that a province-wide plurality would simply install the largest region's candidate permanently.

  The case before the Board in my chapter is the province of **Marche**. Its assembly is elected by proportional representation with a low threshold and currently contains four parties, the largest near thirty-five per cent, internally disciplined but with no stable majority and no tendency to coalesce into two blocs. Administration is clean, the audit office is independent, there is no history of coups and no regional cleavage worth naming, and roughly seven in ten residents tell pollsters they want to elect their governor directly. Uniquely among the provinces, a large share of public money — something like a fifth of the provincial budget — comes not from taxation but from fees collected by a river-basin authority whose board the governor appoints.

  The charter proposed to the Board for Marche would create a directly elected governor on a fixed four-year term, without power to dissolve the assembly, with a cabinet drawn from outside it, and would add a device new to the federation: the confidence-locked mandate. Once in any twelve-month period, the assembly may, by a single majority vote that simultaneously names a successor, transfer the remainder of a governor's term to that successor, no election being held. The basin authority's revenues would require annual assembly authorization, though its board would remain the governor's appointment. A clerk's note observes that no precedent pairs direct election with confidence-based removal: in Sable and Kalva the substitution rule attaches to a premier the voters never chose directly, and in Ondres the directly elected governor can be removed only by impeachment.

  What I would like from you:

  1. Three or four rules the Board might be running that fit all five precedents — stated sharply enough that they come apart on Marche. I can see at least one turning on whether every executive must be removable by somebody other than the electorate, one turning on what the party system has to look like before a single-person direct mandate is safe, and one turning on what powers such an office may hold; if there are others, or if mine are badly drawn, say so.

  2. What each rule predicts about the Marche proposal as drafted, and about each of its separable features: direct election itself, removal with a named successor, the once-a-year restriction, the absence of dissolution, and the fee-funded authority.

  3. Your best guess at the ruling, the precedent the Board would cite as its closest analog, and the precedent it would be wrong to cite because it is only superficially closest. Give me the reasoning the minute would record and, separately, the dissent — the scene needs both, and the dissent has to be an argument rather than an atmosphere.

  4. If the five settlements genuinely underdetermine the sixth, say so plainly, and tell me what principle the Board would be adopting with each option, in the language a clerk would put in the minute rather than in the language of political theory. In particular: is there any amendment — to the removal device, to who may be named as successor, to the basin authority — that would make approval consistent where pure rejection is otherwise called for, and what exactly would the amendment be buying?

  5. One altered fact about Marche that would force the competing rules to part company decisively, in case I want the Board to face it in a later chapter.
reasoning: |-
  Okay, let me approach this systematically. The user is crafting political fiction centered on constitutional design debates, and needs help extrapolating institutional logic from five fictional precedents to resolve the sixth case (Marche). 

  First, I need to identify the core tension in Marche: direct election is popular (70% support) but the assembly has fragmented multipartism (4 disciplined parties, no stable majority) and a unique river-basin funding mechanism. The proposed "confidence-locked mandate" is a hybrid solution allowing midterm replacement of a directly elected governor via assembly vote with named successor.

  The precedents suggest three possible interpretive rules:
  1. **Removability Principle**: Every executive must be removable without waiting for elections. This explains why directly elected figures in Ondres (impeachment) and Kalva (referendum recall) have high removal barriers, while parliamentary heads in Sable/Coast have easier removal. 
  2. **Cohesion Threshold**: Direct election requires either two-party systems (Ondres) or counterweights to polarization (Kalva's military context). Marche's fragmented but non-polarized system falls in a gray zone.
  3. **Power-Origin Parity**: Authority should match legitimacy source. Basin funds (20% budget) controlled by governor-appointed board violate this since direct election lacks corresponding accountability to assembly over spending.

  For the Marche proposal:
  - Under Removability Principle, the confidence-locked mandate satisfies the requirement by allowing removal with successor.
  - Cohesion Threshold would reject direct election entirely given unstable multipartism.
  - Power-Origin Parity demands the basin funding require assembly approval (which the proposal does) but may still object to governor controlling appointments.

  The closest precedent is actually Kalva (semi-presidential) not Ondres, because Kalva also combines direct election with assembly confidence mechanisms. The worst comparison is Sable - superficially similar removal mechanism but entirely different legitimacy structure.

  If undetermined, the Board could amend to require assembly confirmation of basin board members, buying compromise on accountability. 

  For future chapters, making one region secessionist (like Verrine Coast) would force the cohesion threshold rule to dominate. Or if basin funds were 50% of budget, power-origin parity would become decisive.

  The dissent should focus on Kalva's military context making its semi-presidential model non-comparable to peaceful Marche - a substantive distinction masked by procedural similarities.
answer: |-
  Here are the rules, analysis, and predictions for the Board’s deliberations on Marche, grounded in your five precedents and designed to generate substantive debate:

  ---

  ### **1. Implicit Rules Derived from Precedents**  
  *(Stated as operational principles the Board might follow)*  

  **Rule A: *Removability Balance***  
  > "Directly elected executives require *exceptional* removal mechanisms (impeachment/referendum) unless their powers are purely ceremonial. Parliamentary executives require *routine* removal mechanisms (no-confidence). Hybrids must bridge this gap."  
  *Fits Precedents:* Ondres (direct + impeachment), Sable/Kalva/Coast (parliamentary + substitution/no-confidence), Kalva (hybrid + referendum removal for president).  

  **Rule B: *Cohesion Threshold for Direct Election***  
  > "Direct election of executives is permitted only where: (1) parties are disciplined and alternation is stable (Ondres), or (2) countervailing forces (e.g., military) necessitate a unifying figure (Kalva). Fragmentation without polarization (Sable, Coast) defaults to parliamentary systems."  
  *Fits Precedents:* Direct election rejected in Sable (fragmentation), Coast (regionalism); approved in Ondres (stability), Kalva (coup risk).  

  **Rule C: *Power-Origin Parity***  
  > "Significant non-legislative powers (taxation, emergency decrees, patronage) must align with the source of legitimacy. Assembly-controlled funds require assembly confidence; voter mandates may justify limited autonomy *if* removal is constrained."  
  *Fits Precedents:* Ondres governor (no ordinance power, narrow emergency authority); Upper Aule (no dissolution, initiatives to suspend ordinances); Kalva president (defence powers tied to referendum removal).  

  **Rule D: *Anti-Hegemony Veto***  
  > "Systems must prevent permanent dominance by one faction. Direct elections are barred if they would entrench a plurality group (Coast), or if patronage risks clientelism (Upper Aule’s recall mechanism)."  
  *Fits Precedents:* Coast (no direct governor to avoid majority-region dominance); Upper Aule (recall to check individual power).  

  ---

  ### **2. How Each Rule Judges Marche’s Proposal**  
  | **Feature**               | **Rule A (Removability)**       | **Rule B (Cohesion)**          | **Rule C (Power-Origin)**                | **Rule D (Anti-Hegemony)**      |  
  |----------------------------|----------------------------------|--------------------------------|------------------------------------------|----------------------------------|  
  | **Direct election**        | *Conditionally acceptable*: Confidence-locked mandate bridges gap. | *Unacceptable*: Fragmented parties, no polarization/stability like Ondres/Kalva. | *Neutral*: Depends on other powers. | *Conditional*: Acceptable if no risk of permanent dominance (unlike Coast). |  
  | **Removal w/ named successor** | *Strongly supports*: Creates routine removal path for directly elected official (novel but logical). | *Irrelevant*: Focuses on election viability, not removal. | *Supports*: Aligns basin funds with assembly oversight. | *Supports*: Prevents gubernatorial entrenchment. |  
  | **Once-a-year restriction** | *Ambivalent*: Minimizes instability but risks deadlock. Prefer Kalva’s referendum or Ondres’ impeachment. | *Rejects*: Does nothing to solve underlying fragmentation. | *Ambivalent*: Restriction unrelated to fiscal control. | *Neutral*: Limits frivolous removals but not core issue. |  
  | **No dissolution power**   | *Strongly supports*: Matches Ondres/Kalva (no unilateral dissolution). | *Neutral*: Dissolution irrelevant to initial election method. | *Supports*: Reinforces assembly supremacy over budget. | *Supports*: Checks gubernatorial overreach. |  
  | **Basin authority**        | *Opposes*: Governor appoints board controlling 20% of budget without confidence mechanism. | *Opposes*: Patience risks clientelism exacerbating fragmentation. | *Strongly opposes*: Funds lack origin parity (governor appoints, but assembly funds). | *Strongly opposes*: Creates unaccountable patronage engine. |  

  ---

  ### **3. Predicted Ruling & Dissent**  
  **Majority Opinion (Cites Kalva):**  
  > *"Approved with basin amendment. Confidence-locked mandate adapts Kalva’s dual legitimacy principle: direct election satisfies popular demand, while substitution removal prevents paralysis. However, basin funds violate Power-Origin Parity (Rule C). Precedent: Upper Aule’s suspensive initiative for ordinances. Amendment: Basin board appointments require assembly confirmation, and fees are collected by treasury (not authority) pending annual appropriation. Kalva cited for hybrid solution; Coast is inapt (regional cleavage absent here)."*  

  **Dissent (Cites Sable):**  
  > *"Rejection required. Rule B (Cohesion Threshold) binds: Marche’s multiparty fragmentation mirrors Sable, where direct election was rejected. Confidence-locked mandate is a parliamentary graft onto a direct mandate—unstable per Rule A (Removability Balance). Kalva is distinguishable: its president had no domestic powers. Basin authority worsens this; amendment doesn’t fix the inherent conflict of a governor elected by province but removed by assembly. Precedent: Sable’s substitution rule works only when the executive is *not* directly elected."*  

  ---

  ### **4. Undetermined Elements & Amendments**  
  The precedents **underdetermine** Marche’s case due to:  
  - No prior hybrid removal mechanism (confidence-locked mandate).  
  - No case with Marche’s mix: clean governance + fragmentation + direct election demand.  
  - Basin authority is novel in scale/appointment structure.  

  **Key Amendment for Consistency:**  
  > Require **assembly confirmation of basin board appointments** + **direct gubernatorial control of fees only if removal occurs via substitution**.  
  > *What it buys:*  
  > - Under Rule C, aligns spending power with oversight.  
  > - Under Rule D, limits patronage between removal windows.  
  > - Enables approval under Rules A/C/D while isolating Rule B opponents.  

  **Principles Adopted in Clerk’s Language:**  
  > - *"ELECTORAL MANDATES MUST BEND TO FISCAL ACCOUNTABILITY"* (amendment basis).  
  > - *"THE SUBSTITUTION RULE EXTENDS TO DIRECT OFFICERS WHEN ASSEMBLY AND PEOPLE SHARE POWER"* (majority).  
  > - *"NO STANDING MANDATE WITHOUT STANDING SUPPORT"* (dissent).  

  ---

  ### **5. Altered Fact to Force Contradiction**  
  **Add:** *"Marche’s largest party (35%) exclusively controls the river-basin authority’s technical cadre, making fee collection dependent on its cooperation."*  

  **Why it Forces Conflict:**  
  - **Rule B (Cohesion):** Proves direct election unsafe—governor could be paralyzed by a rival-controlled authority.  
  - **Rule C (Power-Origin):** Assembly control of basin funds is illusory if technocrats are partisan.  
  - **Rule D (Anti-Hegemony):** Risks permanent capture by the largest party via patronage.  
  - **Rule A (Removability):** Confidence-locked mandate useless if governor lacks control over 20% of budget.  
  *Result:* Rules B/C/D now demand rejection; Rule A insufficient to save it.  

  ---

  ### **Summary for Your Chapter**  
  - **Board’s Likely Path:** Narrow approval of Marche’s charter *with* the basin amendment, citing Kalva as analog and distinguishing Coast.  
  - **Core Conflict:** Majority sees confidence-locked mandate as an innovative synthesis (direct election + accountability); dissent sees it as a destabilizing contradiction.  
  - **Dissent Angle:** Argue Marche is Sable with popular delusions ("demand for direct election is Sable’s impatience with parliaments, not wisdom").  
  - **Amendment’s Role:** Lets moderates claim they fixed the fiscal flaw while purists reject the entire structure.  

  This framework ensures the debate turns on institutional logic—not theory—while leaving room for character-driven maneuvering. Would fit a scene where legalistic clerks push the basin amendment as a "technical fix" while ideologues on the Board clash over popular legitimacy versus stability.
