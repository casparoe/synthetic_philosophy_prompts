prompt: |-
  I am writing a thesis chapter on the metaphysics of synchronic consciousness, and before I return to the literature I want a specification rather than another survey. What I need is a statement of what an account of phenomenal unity has to be able to do in order to be adequate for one particular job. The job is adjudicative: I want a theory that could be handed to someone with a callosotomy patient, a hemispherectomy patient, or a surgically split animal preparation in front of them, together with the behavioural and neural data, and that would tell them what the data settle about (i) how many conscious subjects are present, (ii) how unified each subject's field is at a time, and (iii) what would move the verdict either way. It should also say what turns on the verdict: why anyone other than a metaphysician should care whether the answer is one or two.

  So: give me the desiderata. For each, the case or consideration that motivates it, and whether you count it as non-negotiable or as a preference internal to one tradition. I especially want you to mark the desiderata that are doing covert work for a favoured theory rather than constraining all of them. Then flag any subset you think is jointly unsatisfiable — that is the part I care about most — and name the single requirement that excludes the largest share of the views currently in play.

  The candidates I keep returning to, in no particular order, with my own gloss; reject any that are really camp commitments in disguise:

  It must get the ordinary case right: a waking subject whose visual, auditory, tactile, proprioceptive, affective, and cognitive states at a time are experienced together — without inflating that into something metaphysically spectacular or deflating it into nothing.

  It must handle the surgical cases: patients who produce conflicting manual responses to a single chimeric stimulus, who show intermanual conflict and alien-hand phenomena, and who verbally avow one thing while a hand does another. And it must handle the cases pulling the other way: hemispherectomy and callosal agenesis patients who are, on ordinary testing and ordinary self-report, strikingly normal.

  It must have a principled way of excluding pseudo-splits: blindsight, unilateral neglect and extinction, inattentional blindness, hypnotic and deeply absorbed states, sleepwalking, automatic writing. If its criterion for a fracture is merely that there are two informationally insulated processing streams, it will over-generate, and I want to know what stops it.

  It must keep apart phenomenal unity, access- or report-based unity, diachronic unity of a subject or self, unity of agency or motor control, and personhood in the moral or legal sense. My guess is that a large share of the apparent disagreement in this area is a collapse of two of these.

  It must say whether unity admits of degree, whether the relation it appeals to is symmetric and transitive, and whether unified means one subject, one field, or one state. My suspicion is that unity is an all-or-nothing equivalence relation and unity admits of intermediate cases, which is what the surgical data look like, cannot both be required; tell me whether that tension is genuine and which horn to take.

  There is also a methodological requirement I think is under-discussed and want on the list, which I will call the report bottleneck. In the split-brain cases the first-personal evidence is delivered almost entirely through one hemisphere's language production, and in the rest of us introspective report is itself the output of a single narrow channel. So the theory must say what evidence could in principle distinguish one subject with two partially disconnected experiential streams, two subjects in one body, and one subject with one stream plus confabulation in the reporting channel; and it must not secure its verdict by defining unity as whatever reaches that channel, since that begs the question. Relatedly, it must take a stand on the mute-stream case, where a hemisphere is a serious candidate for having experiences but has no route to behaviour or report at all. I can construct that case; I cannot see which theories can even formulate a verdict about it, or whether being unable to is itself a strike.

  Two more I want adjudicated rather than assumed: whether the theory must show that unity does explanatory work — that unified contents are what make deliberate action, self-knowledge, or rational inference possible — or whether it may conclude that unity is idle with respect to all of that, and whether that conclusion is a desideratum violated or a discovery; and whether the theory may answer at the subpersonal level, in terms of a neural or information-theoretic signature, and if so whether it must commit to unity's having one mechanism across cases or many.

  No bibliographies or reading lists. A compact table scoring the familiar families — subsumption accounts, primitive co-consciousness accounts, integrated-information accounts, global-workspace accounts, quietist or dismissivist accounts — is welcome but secondary; I want the criteria argued, with the cases doing the arguing. Where a requirement is motivated by a case I have described loosely, say so and sharpen the case as you go.
reasoning: |-
  Okay, this user is deep into the metaphysics of consciousness, specifically synchronic phenomenal unity. They're writing a thesis chapter and need clear desiderata for a theory that can adjudicate split-brain cases. Let me unpack their query carefully.

  First, the core ask: they want criteria that a theory of phenomenal unity must meet to determine (i) number of conscious subjects, (ii) degree of unity in each subject's field, and (iii) what evidence would change the verdict. Plus, why non-metaphysicians should care. 

  The user has already listed several requirements they're considering, which shows sophisticated prior engagement. They mention ordinary cases, surgical cases, pseudo-splits, conceptual distinctions, unity properties, and the report bottleneck. There's also the explanatory role question and subpersonal explanations. 

  Hmm, the challenge is to extract robust desiderata from these while flagging tensions. The user explicitly wants to know which requirements might be incompatible and which single criterion rules out most existing theories. 

  Let me start by grouping their concerns into thematic desiderata. The "Ordinary Unity" one seems non-negotiable - any theory must account for baseline unified consciousness without over/under-selling it. The surgical cases requirement feels equally mandatory since it's the testbed for adjudication. 

  The pseudo-split exclusion is crucial too - blindsight etc. shouldn't count as disunity. The user's worried about overgeneration, so this needs sharpening. Maybe emphasize functional independence vs mere informational insulation? 

  Conceptual disentanglement feels vital. Many theories fail by conflating phenomenal unity with access unity or agency. This might be the key to resolving apparent disagreements. 

  The unity properties puzzle is thorny. The user suspects "all-or-nothing equivalence relation" conflicts with "admits degrees" - and I agree. Surgical data suggest partial unity, so perhaps sacrifice transitivity? That'd exclude co-consciousness theories. 

  Ah, the report bottleneck! This is brilliant and underdiscussed. Theories must handle first-person evidence limitations without circularity. The mute hemisphere case is a killer test - if a theory can't even assess whether it's conscious, that's a major flaw. 

  On explanatory role: should unity explain cognition or be epiphenomenal? Both options should remain open, but the theory must commit. Subpersonal mechanisms: should allow neural signatures but not require universality. 

  Now for tensions. The biggest is between Unity Properties Requirement 1 (all-or-nothing equivalence) and Requirement 3 (degrees possible). Surgical cases force this conflict - you can't have both. I'd recommend sacrificing equivalence to accommodate partial unity. 

  The single requirement that excludes most theories? Probably the Report Bottleneck's mute-stream challenge. Global workspace and access-based accounts can't even formulate a verdict here. 

  For the "why care" question: clinical applications matter. Misdiagnosing disunity could lead to mistreatment of patients, while understanding unity mechanisms might help disorders of consciousness. 

  The user's methodological rigor is impressive. They're avoiding camp commitments and want theory-neutral criteria. I'll structure the response by desideratum, noting negotiability status and hidden assumptions for each. 

  Must remember: no bibliographies! But a compact theory assessment table could help, per their request. Should cover co-consciousness, subsumption, IIT, global workspace, dismissivism. Highlight which fail the mute-stream test and unity-degree requirement. 

  This is complex but exciting. The user's focus on adjudicative power rather than surveys is refreshing. Time to distill this into clear, argued criteria with surgical cases as the litmus test.
answer: |-
  Here are the desiderata for an adjudicative theory of phenomenal unity, argued through cases, with tensions highlighted and negotiability marked. Requirements are grouped thematically.

  ---

  ### **Core Adjudicative Desiderata (Non-Negotiable)**
  1. **Ordinary Unity Baseline**  
     - *Requirement*: Explain the ordinary case: a single subject experiencing concurrent sensory, affective, and cognitive states as unified (e.g., seeing rain while hearing thunder *as co-present*).  
     - *Motivation*: Grounds the theory in uncontroversial phenomenology.  
     - *Non-negotiable*: Yes. Failure here invalidates the theory’s relevance.  
     - *Hidden Bias*: Avoids inflating unity (e.g., into cosmic holism) or deflating it (e.g., as illusory).  

  2. **Surgical Case Resolution**  
     - *Requirement*: Adjudicate split-brain cases (callosotomy), hemispherectomy, and callosal agenesis:  
       - **(i)** Number of conscious subjects (1? 2? 1.5?).  
       - **(ii)** Degree of unity in each subject’s field (e.g., is a split-brain patient’s left visual field *phenomenally unified* with right-hand actions?).  
       - **(iii)** What evidence shifts verdicts (e.g., intermanual conflict vs. normal self-report in agenesis).  
     - *Motivation*: Empirical litmus test. E.g., a split-brain patient verbally reports a spoon (left hemisphere) while left hand points to a snow scene (right hemisphere).  
     - *Non-negotiable*: Yes. The theory *must* deliver verdicts here.  
     - *Hidden Bias*: Rejects theories that dismiss splits as "two persons" without addressing graded unity.  

  3. **Pseudo-Split Exclusion**  
     - *Requirement*: Exclude non-unity cases (blindsight, neglect, sleepwalking) *without* overgenerating splits.  
     - *Motivation*: A theory using "informational insulation" alone would misclassify blindsight (unconscious processing) as disunity.  
     - *Non-negotiable*: Yes.  
     - *Sharpened Case*: Blindsight has isolated visual processing but *no conscious field*; splits involve *competing conscious reports*. The theory must require *conscious availability* (not just insulation).  

  4. **Conceptual Disentanglement**  
     - *Requirement*: Strictly distinguish:  
       - **Phenomenal unity** (experiential togetherness)  
       - **Access unity** (reportability/integration)  
       - **Diachronic unity** (persistence over time)  
       - **Agentive unity** (motor control coherence)  
       - **Personhood** (moral/legal status).  
     - *Motivation*: Split-brain cases show dissociations (e.g., alien hand = agentive disunity without clear phenomenal disunity).  
     - *Non-negotiable*: Yes. Collapsing these explains >50% of theoretical disputes.  
     - *Hidden Bias*: Access-based theories (e.g., Global Workspace) often conflate access and phenomenality.  

  ---

  ### **Structural Desiderata (Negotiable but Critical)**
  5. **Unity Properties**  
     - *Requirement*: Specify whether unity is:  
       - All-or-nothing or gradable.  
       - Symmetric/transitive (i.e., an equivalence relation).  
       - Definitive of a subject (1 subject = 1 unified field).  
     - *Motivation*: Surgical data suggest *partial unity* (e.g., split-brain patient’s hemispheres share emotions but not vision).  
     - *Tension*: **You cannot have both all-or-nothing equivalence *and* degrees of unity**.  
       - *Horn to Take*: Sacrifice equivalence. Unity is gradable and non-transitive (e.g., A unified with B, B with C, but A not with C).  
     - *Negotiable*: No—theory must commit.  
     - *Hidden Bias*: Co-consciousness theories assume transitivity; IIT assumes gradability.  

  6. **Report Bottleneck**  
     - *Requirement*:  
       - Address evidential asymmetry: Introspective reports are channeled through one output (speech).  
       - Resolve: *One subject with two streams* vs. *two subjects* vs. *one stream + confabulation*.  
       - Handle the **mute-stream case**: A hemisphere with no behavioral output (e.g., surgically isolated).  
     - *Motivation*: In splits, the speaking hemisphere dominates self-report; mute right-hemisphere consciousness is inferred.  
     - *Non-negotiable*: Yes.  
     - *Hidden Bias*: Theories defining unity by access to report (e.g., Global Workspace) *beg the question* against mute streams.  
     - *Verdict on Mute Streams*: A theory *must* formulate whether a mute hemisphere is conscious (e.g., via neural markers). Inability is a fatal strike.  

  ---

  ### **Methodological Desiderata (Contextually Negotiable)**
  7. **Explanatory Role**  
     - *Requirement*: State whether unity explains cognition (e.g., inference, action) or is explanatorily idle.  
     - *Motivation*: If unity enables inference, splits should show cognitive deficits beyond access (e.g., irrationality across hemispheres).  
     - *Negotiable*: Yes—theory may conclude unity is idle. But *empirical adequacy* is non-negotiable (e.g., if splits show no inference failures, unity may not explain inference).  

  8. **Subpersonal Commitments**  
     - *Requirement*: May appeal to neural/informational signatures, but must specify:  
       - Universality (same mechanism in splits, ordinary cases) vs. pluralism.  
     - *Motivation*: Hemispherectomy patients achieve near-normal unity with one hemisphere—suggesting multiple realizability.  
     - *Negotiable*: Yes—theory may be agnostic.  
     - *Hidden Bias*: IIT requires a universal metric (Φ); dismissivism rejects subpersonal bases.  

  ---

  ### **The Key Tension and the Excluder**
  - **Unsatisfiable Subset**: **Unity Properties (5)**.  
    - *Conflict*: Surgical cases demand **gradable unity** (e.g., partial integration in splits), but **equivalence-relation unity** (transitive/symmetric) requires all-or-nothing unity.  
    - *Resolution*: Abandon transitivity. Split-brain data show unity is *not* transitive (e.g., emotion shared across hemispheres, vision not).  
  - **Single Biggest Excluder**: **Report Bottleneck (6)**, specifically the **mute-stream requirement**.  
    - Excludes: Global Workspace (relies on reportability), Strict Access Unity views, Dismissivism (mutes streams are unverifiable "zombies").  

  ---

  ### **Why Care? The Stakes**
  - **Clinical/ethical**: Misdiagnosing unity (e.g., in locked-in syndrome, dissociative disorders) risks mistreatment. If a mute split-brain hemisphere is conscious, surgical neglect is an ethical failure.  
  - **Cognitive Science**: Resolving splits tests models of consciousness (e.g., is consciousness separable from access?).  

  ---

  ### **Theory Scoring (Compact)**
  | Theory                | Ordinary Unity | Surgical Cases | Pseudo-Splits | Conceptual Disentanglement | Mute Streams | Gradable Unity? |  
  |-----------------------|----------------|----------------|---------------|----------------------------|--------------|-----------------|  
  | **Co-consciousness**  | ✓              | ✗ (assumes unity) | ✓             | ✗ (conflates phenomenality/access) | ✗ (no criterion) | ✗ (all-or-nothing) |  
  | **Subsumption**       | ✓              | △ (depends on relata) | △             | ✓                          | △ (possible) | ✗               |  
  | **IIT**               | △ (over-unifies?) | △ (quantifies Φ) | △ (blindsight Φ=0?) | ✗ (conflates levels)        | ✓            | ✓               |  
  | **Global Workspace**  | ✓              | ✗ (reports=unity) | ✗ (blindsight=disunity?) | ✗ (access=phenomenal)   | ✗             | △ (access gradable) |  
  | **Dismissivism**      | ✗ (deflates)   | ✗ (denies problem)| ✓             | ✓                          | ✗ (unverifiable)| N/A             |  

  **✓**: Satisfies, **△**: Partially/contextually, **✗**: Fails  
  *IIT = Integrated Information Theory*

  ---

  ### **Summary**
  - **Non-Negotiables**: Ordinary unity, surgical adjudication, pseudo-split exclusion, conceptual disentanglement, report bottleneck (esp. mute streams).  
  - **Key Tension**: Gradable unity vs. equivalence relation—**sacrifice transitivity**.  
  - **Major Excluder**: **Mute-stream adjudication**—theories requiring report fail.  
  - **Stakes**: Clinical ethics and foundational cognitive science.  

  This framework forces theories to confront the empirical ambiguity of splits without retreating to verbal or access-based proxies. The mute-stream case is the crucible.
