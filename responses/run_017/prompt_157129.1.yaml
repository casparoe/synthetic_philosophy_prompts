prompt: |-
  hey — you're a philosopher of history who's also read a ton of actual historiography: equally at home with longue-durée, quantitative, climate-and-grain-prices stuff and with microhistory of the sort where one illiterate miller's trial record is made to carry a whole book. Please think this through carefully — do a bit of unstructured brainstorming first, sketch two or three candidate readings, then commit to one and say where it's weakest. Don't just list schools of thought; I want you to actually reconstruct an implicit theory and stress-test it.

  Here's what I keep coming back to. There's a very consistent asymmetry in how professional history actually gets done, and I want to know what it presupposes.

  When historians write about elites — a king, a first minister, a pope, a general — the defualt is intentional, narrative, source-close explanation: read the correspondence, recover the reasons, weigh the road not taken, write the biography. And historians working that way are scathing about anything aggregative: you cannot explain a cabinet decision with a regression, a structural account "leaves out the people who actually decided."

  When they write about everyone else — weavers, peasants, enlisted soldiers, enslaved people, women in a village — the defualt flips: structural and material explanation (price series, harvests, demographic cycles, "mentalities"), serial evidence out of tax rolls, court registers, parish books. And a single vivid anecdote is an anecdote: something to be a little embarrassed about, or to be framed as illustrative of a pattern that's been established quantitatively elsewhere.

  Same discipline, same journals, same departments, two quite different epistemic styles — and each style's declared vice is roughly the other style's declared method. So:

  1. What does this asymmetry presuppose? Does it only make sense under the view that agency and deliberative reason really are concentrated at the top of a society — that ordinary people's reasoning isn't the kind of thing history is *about*? Or is it fully accounted for by a boring source-survival story (elites wrote letters, poor people got counted) plus a bit of division of labour? Be careful to distinguish what the practice strictly presupposes from what it merely fits comfortably with, and tell me where it's underdetermined, i.e. where several quite different philosophies of history would license exactly the same behaviour.

  2. Where does the practice contradict itself? I'm most interested in the seams where the two styles have to touch: a grain riot (is it a price series, or a set of intentions?), a soldier's letter home, a petition, a court deposition, a slave narrative — cases where the archive hands you one ordinary person's own words. Does the discipline's handling of those cases betray a commitment it won't avow?

  3. The part I most want you to work on, and where I think you'll have to do real thinking rather than reach for a stock answer. Imagine a national research council adopts what I'll call the survivorship rule: grant panels are instructed to treat the fact that a topic is richly documented as a point against funding it, on the grounds that the archive is itself an artifact of past power, and to give priority to projects about people who left no records in their own voice. Never mind whether it's a good idea; I want the implicit theory. What view of historical significance does it presuppose — must significance be independent of source-survival, and can it be, given that we mostly know about the illiterate through literate intermediaries? What view of historical *knowledge* — is recovering "voice" a way of knowing the past, or a way of being *related* to it, and is the rule secretly a reparative-political principle wearing an epistemic costume? And what view of the historian: if it's committed to the thought that proximity to power distorts the record, why isn't the history of power the most distorted history of all?

  4. Finally, concretely: what would have to change in practice — graduate training, what counts as evidence, what a monograph looks like, what gets reviewed where — if a department genuinely ran one method for kings and weavers? Say which of the two styles would have to give up more, and say what would be lost. I'm not sure its even possible, so if you think it isn't, say what exactly blocks it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're pointing out a clear asymmetry in historical methods: elites get intentional, narrative-driven accounts based on personal documents, while non-elites are studied through structural analyses using quantitative data. The user wants to know what this asymmetry presupposes, where it contradicts itself, and how a hypothetical "survivorship rule" would challenge existing practices.

  First, I need to address the underlying presuppositions. The user mentions agency and source survival as possible explanations. I should differentiate between what's strictly necessary for the asymmetry to exist and what's merely compatible. Source availability is a practical reason, but it's not sufficient on its own. The discipline's methodological choices suggest a deeper epistemic stance: that elites possess historical agency in a way that non-elites don't. This ties into traditional historiography's focus on "great men" and decision-makers. However, it's underdetermined because different philosophies—like structuralism vs. individualism—could justify the same practices based on their own premises.

  Next, contradictions. The user brings up cases where non-elites leave traces, like petitions or trial records. Historians might treat these as structural data points rather than evidence of individual agency. This reveals an unspoken hierarchy where only elite reasoning is considered "real" agency. Microhistory challenges this, but it's often seen as exceptional. The survivorship rule question is tricky. Prioritizing the undocumented assumes that significance lies outside power structures, but all sources are mediated. The rule might be more about ethical repair than epistemology, raising questions about whether such histories can escape distortion.

  Practical changes. If departments unified methods, both sides would need adjustments. Elite studies would need to incorporate structural contexts, while non-elite histories might embrace narrative agency. Graduate training would require interdisciplinary skills, and monographs would blend methodologies. The challenge is ontological—whether non-elite actions are seen as agency or reaction. The user's deeper need seems to be challenging historical epistemology's biases and exploring if true methodological equality is possible without losing valuable insights.
answer: |-
  Here’s a rigorous dissection of the asymmetry, step by step:

  ### Unstructured Brainstorming
  - **Source Survival vs. Epistemic Prejudice**: Is this just archives (elites generate intentional documents; non-elites leave traces)? Or does it reflect a deeper belief that "history" is made by conscious actors, and only elites qualify?
  - **Agency Allocation**: Historians might implicitly define "agency" as *legible, documentable intention*—which requires literacy and institutional power. Non-elite actions are then framed as reactions to forces.
  - **Methodological Path Dependence**: The Annales school’s success with structural history for "history from below" created a self-reinforcing tradition. Conversely, political/diplomatic history’s roots in state archives cemented intentional methods for elites.
  - **Epistemic Risk Aversion**: Quantitative methods feel "safer" for non-elites because direct testimony is scarce. For elites, ignoring personal papers seems negligent.
  - **The "Voice" Paradox**: When non-elite voices *do* surface (e.g., depositions), they’re often distrusted as "mediated" or "atypical," while elite letters are taken at face value.

  ---

  ### Candidate Readings
  1. **The Pragmatic Source-Determinism Thesis**  
     Asymmetry arises *solely* from source survival + disciplinary specialization. No philosophical commitment needed—just practical adaptation. Weakness: Fails to explain why *when non-elite voices exist* (e.g., slave narratives), structural framing often still dominates.

  2. **The Epistemic Hierarchy Thesis**  
     History presupposes that "significant" agency requires institutional power. Non-elites are objects of forces; elites are subjects of history. Weakness: Doesn’t account for microhistory’s success with non-elite agency or critiques of "great man" history.

  3. **The Hermeneutic Inequality Thesis**  
     Historians apply a double standard of interpretation: elite texts are "transparent" windows to intention; non-elite traces are "opaque," requiring statistical aggregation to reveal meaning. Weakness: Overlooks that elite sources are also mediated (court rituals, propaganda, archival curation).

  ---

  ### Committed Reading: **The Epistemic Hierarchy Thesis (with caveats)**  
  The asymmetry presupposes that **historical causality is bifurcated**:  
  - **Elites** possess *sovereign agency*—their conscious choices alter structures.  
  - **Non-elites** exhibit *embedded agency*—their actions express structural conditions (economic, cultural, environmental).  

  **What it strictly presupposes**:  
  - That deliberative, future-oriented intention (vs. adaptive or normative action) is the primary engine of historical change.  
  - That such intention is best documented—and *only socially significant*—when wielded by institutional power-holders.  

  **What it fits comfortably with (but doesn’t require)**:  
  - Whig history, Hegelian "world-historical individuals," or Weberian charismatic authority.  
  - Marxist base/superstructure models (where elites "manage" the superstructure).  

  **Underdetermined by**:  
  - A *strict* structuralist could argue elite actions are equally determined (e.g., by class interest), but still use intentional methods because sources allow it.  
  - A methodological individualist could study non-elite intentions via rare ego-documents but default to structure due to scarcity.  

  ---

  ### Stress-Testing the Asymmetry  
  **1. Contradictions at the Seams**  
  - **Grain riots**: Treated as "rebellions of the belly" (structural), yet trial records often reveal sophisticated coordination, targeting of *specific* merchants, appeals to moral economy (intentionality). Discipline often dismisses this as "rationalization."  
  - **Soldiers’ letters**: Used illustratively for "war experience," but rarely to explain *military outcomes* (e.g., a private’s desertion decision isn’t linked to battle loss).  
  - **Betrayal**: The handling implies non-elite reasoning lacks *causal weight*. A petition’s success is credited to elite benevolence (intentional), not the petitioner’s rhetorical strategy (their agency).  

  **2. The Survivorship Rule’s Implicit Theory**  
  - **Historical significance**: Assumes significance lies in *resistance to erasure*. What was suppressed (non-elite lives) matters more than what power curated (elite archives).  
  - **Knowledge vs. Relation**: Prioritizes "voice" as *ethical relation*—repairing epistemic injustice. But it conflates:  
    - *Recovering subaltern experience* (epistemic) with *symbolic reparations* (political).  
    - Risk: Assuming "voice" = authenticity, ignoring intermediaries (scribes, ethnographers) who filter it.  
  - **The Power Distortion Paradox**: Yes, elite history is distorted—but by celebrating the survivorship rule, we ironically recenter power as the *only* history worth rejecting. Non-elite history becomes defined by its opposition to power, not its own complexity.  

  **3. Could One Method Rule All?**  
  **Changes required**:  
  - **Graduate Training**: Philosophy of action + critical theory mandatory; advanced stats *and* close reading equally valued.  
  - **Evidence**: Tax rolls analyzed for individual strategies; kings’ letters mined for structural constraints (e.g., how fiscal limits shaped diplomacy).  
  - **Monographs**: Hybrid models—e.g., "The Cheese and the Worms" meets "The Sleepwalkers": one peasant’s cosmology nested in climate/prices/state formation.  
  - **Journals**: Reject articles that reduce non-elites to data points or elites to unmoved movers.  

  **Which Style Loses More?**  
  - **Elite History** surrenders more: It must admit its subjects weren’t free actors but "structurally situated." Biography loses its privileged claim to explain events.  
  - **What’s Lost**: Nuanced psychologizing of elites (e.g., "Cromwell’s inner conflict") when personal papers exist. But this "loss" is ideological—it exposes elite constraints.  

  **What Blocks It?**  
  - **Ontological Inertia**: The deep-seated belief that "history" = "decisions that scaled to societal change" inherently privileges elites.  
  - **Source Fetishism**: The thrill of touching Napoleon’s letter vs. aggregating 10,000 birth records feels like different *kinds* of knowledge.  
  - **Career Incentives**: Microhistory of a weaver is riskier than a regimental history using state archives; quantitative work on elites is dismissed as "reductive."  

  **The Weakest Point**: The survivorship rule’s epistemic flaw. Granting automatic priority to the undocumented risks romanticizing "silence" and underestimates how *all* sources—even parish registers—are shaped by power. We might just replace one hierarchy (intention over structure) with another (absence over presence).  

  ### Conclusion  
  The asymmetry isn’t just archival—it’s *ontological*. It assumes elites inhabit a realm of "History" (contingent, narrative-driven), while non-elites inhabit "Nature" (law-governed, aggregate). Breaking it requires historians to see *all* agency as structurally embedded and *all* structures as agentically contested—and to embrace the messiness of a discipline where a regression table and a love letter hold equal weight in explaining change.
