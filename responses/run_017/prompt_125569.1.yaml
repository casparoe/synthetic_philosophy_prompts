answer: |-
  ## Moral Uncertainty Practice Question & Assessment Materials

  ### 1. Question (250 words)
  **Consider the following scenario and aggregation rule for decision-making under moral uncertainty:**

  **Scenario:** You are a policy advisor determining healthcare resource allocation. You have credence 0.7 in Utilitarianism (U) and 0.3 in a Moderate Deontology (D) theory. You face a menu of options:
  *   **A:** Fund a new dialysis unit (provides reliable, moderate benefit).
  *   **B:** Fund an experimental cancer therapy (small chance of huge benefit, high cost).
  *   **C:** Fund a widespread vaccination campaign (moderate, broad benefit).

  **Aggregation Rule:** To choose under moral uncertainty:
  1.  For each option in the current menu, calculate its value according to each moral theory.
  2.  For each theory, calculate the *standard deviation (SD)* of the values it assigns to *all options currently on the menu*.
  3.  For each theory and each option, compute the **rescaled value**: Value(Option, Theory) / SD(Theory, Menu).
  4.  For each option, compute its **overall score**: Sum over all theories [Credence(Theory) * Rescaled Value(Option, Theory)].
  5.  Choose the option with the highest overall score.

  **Assigned Values:**
  *   **U:** Values A at 100, B at 1,000,000, C at 150.
  *   **D:** Values A at 80, B at 10 (due to risks/consent issues), C at 90.

  **Answer the following:**
  **(a)** Calculate the overall score for options A, B, and C using the aggregation rule on the menu {A, B, C}. Which option is recommended? (4 marks)
  **(b)** Now consider the menu {A, C}. Recalculate the overall scores for A and C on this reduced menu. Does the ranking between A and C change compared to part (a)? Explain why this change occurs. (6 marks)
  **(c)** Focus on Option B in the original menu {A, B, C}.
      (i) Explain the role of rescaling by the standard deviation in determining B's overall score.
      (ii) Does the rescaling produce a principled constraint on B's influence, or is it an artifact? Justify your answer by considering the values assigned by each theory. (5 marks)
  **(d)** A critic argues: "You should just follow the theory you have highest credence in (U, 0.7). Choosing B maximizes U-value, so you should choose B." How does the sequential-choice argument challenge this 'favourite theory' approach? Does this argument presuppose the aggregation rule it aims to justify? Explain. (5 marks)

  ---

  ### 2. Model Answer (1000 words)

  **(a)**
  *Calculate SDs for menu {A, B, C}:*
  *   **U Values:** A=100, B=1,000,000, C=150.
      *   Mean(U) = (100 + 1,000,000 + 150)/3 = 1,000,250/3 ≈ 333,416.67
      *   Variance(U) = [(100 - 333416.67)^2 + (1000000 - 333416.67)^2 + (150 - 333416.67)^2] / 3
          ≈ [(-333316.67)^2 + (666583.33)^2 + (-333266.67)^2] / 3
          ≈ [1.111e11 + 4.444e11 + 1.111e11] / 3 ≈ 6.666e11 / 3 ≈ 2.222e11
      *   SD(U) ≈ sqrt(2.222e11) ≈ 471,404. (Rounding reasonably is fine, e.g., 471,400)
  *   **D Values:** A=80, B=10, C=90.
      *   Mean(D) = (80 + 10 + 90)/3 = 180/3 = 60
      *   Variance(D) = [(80-60)^2 + (10-60)^2 + (90-60)^2] / 3 = [400 + 2500 + 900]/3 = 3800/3 ≈ 1266.67
      *   SD(D) ≈ sqrt(1266.67) ≈ 35.59 (e.g., 35.6)

  *Calculate Rescaled Values:*
  *   **U Rescaled:** A = 100 / 471400 ≈ 0.0002122, B = 1,000,000 / 471400 ≈ 2.1213, C = 150 / 471400 ≈ 0.0003182
  *   **D Rescaled:** A = 80 / 35.6 ≈ 2.2472, B = 10 / 35.6 ≈ 0.2809, C = 90 / 35.6 ≈ 2.5281

  *Calculate Overall Scores (0.7 * U_Resc + 0.3 * D_Resc):*
  *   **A:** (0.7 * 0.0002122) + (0.3 * 2.2472) ≈ (0.00014854) + (0.67416) ≈ **0.6743**
  *   **B:** (0.7 * 2.1213) + (0.3 * 0.2809) ≈ (1.48491) + (0.08427) ≈ **1.5692**
  *   **C:** (0.7 * 0.0003182) + (0.3 * 2.5281) ≈ (0.00022274) + (0.75843) ≈ **0.7587**

  *Ranking:* B (1.5692) > C (0.7587) > A (0.6743). **B is recommended.**

  **(b)**
  *Menu is now {A, C}. Recalculate SDs:*
  *   **U Values:** A=100, C=150.
      *   Mean(U) = (100 + 150)/2 = 125
      *   Variance(U) = [(100-125)^2 + (150-125)^2] / 2 = [625 + 625]/2 = 1250/2 = 625
      *   SD(U) = sqrt(625) = 25
  *   **D Values:** A=80, C=90.
      *   Mean(D) = (80 + 90)/2 = 85
      *   Variance(D) = [(80-85)^2 + (90-85)^2] / 2 = [25 + 25]/2 = 50/2 = 25
      *   SD(D) = sqrt(25) = 5

  *Recalculate Rescaled Values (Menu {A, C}):*
  *   **U Rescaled:** A = 100 / 25 = 4, C = 150 / 25 = 6
  *   **D Rescaled:** A = 80 / 5 = 16, C = 90 / 5 = 18

  *Recalculate Overall Scores (0.7 * U_Resc + 0.3 * D_Resc):*
  *   **A:** (0.7 * 4) + (0.3 * 16) = 2.8 + 4.8 = **7.6**
  *   **C:** (0.7 * 6) + (0.3 * 18) = 4.2 + 5.4 = **9.6**

  *Ranking:* C (9.6) > A (7.6). **C is recommended on {A, C}.**

  *Change in Ranking:* In the full menu {A, B, C} (part a), C > A (0.7587 > 0.6743). On the reduced menu {A, C}, C > A (9.6 > 7.6). **The ranking between A and C does NOT reverse; C remains superior to A.** However, the *magnitude* of C's advantage changes drastically (small difference in part a, large difference in part b).

  *Why the Change Occurs:* The rescaling step fundamentally depends on the *entire menu* through the standard deviation (SD). Removing Option B dramatically altered the SDs for both theories. For U, SD dropped from ~471,400 to 25 because B's extreme value was removed. For D, SD dropped from ~35.6 to 5. This drastic reduction in SD *increases* the rescaled values for A and C under both theories because we divide by a much smaller number. Crucially, the *relative* scaling *between* theories also changed. In {A, B, C}, D-rescaled values dominated U-rescaled values for A and C (e.g., A: D_Resc ≈2.25 vs U_Resc≈0.0002). In {A, C}, U-rescaled values became much larger relative to D-rescaled values (A: U_Resc=4 vs D_Resc=16; previously U_Resc was negligible). While the A-C ranking didn't reverse here, the extreme sensitivity of the SD to the menu (especially the presence/absence of outliers like B) shows how adding or removing *any* option, even one not chosen (like B wasn't chosen for A vs C specifically), can drastically alter the rescaled values and potentially *could* reverse rankings between other options in different scenarios. The procedure is objectionably menu-dependent because the rescaling factor (1/SD) is determined arbitrarily by the contingent set of alternatives presented.

  **(c)**
  **(i) Role of Rescaling for B:** Option B is an extreme outlier under U (value 1,000,000 vs A=100, C=150) but has low value under D (10). The high SD of U (~471,400) is *primarily caused by B's enormous U-value*. Rescaling U-values by this large SD drastically reduces B's U-rescaled value (from 1,000,000 to ~2.12). Without rescaling, B's raw U-value (1,000,000 * 0.7 = 700,000) would completely dominate the overall score, making B the clear choice despite D's strong objection and low credence. Rescaling by the SD (which B itself inflated) acts as a severe dampener on B's influence within the U theory's contribution.

  **(ii) Principled Constraint or Artifact?** The rescaling **appears like a principled constraint** because it prevents the enormous raw U-value of B from automatically dominating the decision solely based on U's high credence, giving the D-values a meaningful "voice". However, it is **ultimately an artifact** of the arbitrary scaling conventions inherent in the aggregation rule. The rescaling presupposes that the *spread* or *variability* of a theory's value assignments across the menu is the correct way to normalize the "strength" or "unit" of that theory's value scale for aggregation. There is no justification internal to Utilitarianism or Deontology for why the standard deviation over the *current menu* should determine how much weight one util or deontic unit contributes to the aggregate score. Utilitarianism might intrinsically value saving a million lives immensely more than saving ten lives, regardless of other options. Rescaling by SD artificially compresses this difference because B makes the spread large. The "cap" on B's pull is not derived from either U or D; it's an external normalization imposed by the aggregation procedure itself, smuggling in a substantive (and menu-dependent) view about how stakes should compare across theories. The apparatus cannot justify why *this* normalization (SD) is the correct one for intertheoretic comparison.

  **(d)**
  *Sequential-Choice Argument against Favourite Theory (FT):* The critic suggests always acting on the highest credence theory (U, 0.7), which would recommend B here. The sequential-choice argument challenges this by considering a *series* of choices. Imagine facing many similar, independent decisions over time. If you always follow FT (U) on each choice, you will always choose options like B whenever available (due to the massive U-value). However, D assigns very *low* value to B. Over many trials, the *realized* D-value will be consistently poor. If you had *some* credence in D (0.3), you might reasonably prefer a *pattern* of choices that, while maximizing expected U-value according to U, also respects D's concerns some of the time. Always choosing B might lead to a world D strongly disvalues. The aggregation rule, by giving some weight to D in each choice, might lead to choosing options like C more often across the sequence, resulting in a pattern that both theories find at least somewhat acceptable. FT seems "exploitable" over time because it ignores the minority theory completely in every decision, potentially leading to outcomes the agent, considering their *overall* moral uncertainty, would regret.

  *Presupposition of Aggregation?* **Yes, the sequential argument subtly presupposes aggregation.** The argument relies on the idea that the agent cares about the *aggregate* value or disvalue *across the sequence* from *all* their credenced theories. They regret the outcome under FT because the *sum* of D-disvalue over many B-choices is high, and they have credence in D. Evaluating the "acceptability" of the *overall pattern* requires aggregating values *across choices* according to the agent's credences – essentially applying the aggregation rule retrospectively to the sequence. The argument against FT only has force if we already accept that the agent's overall choice-worthiness should reflect a weighted sum of the theories' evaluations. It aims to motivate aggregation by appealing to sequential coherence, but its conception of coherence itself depends on the aggregative idea it's meant to establish. It doesn't independently justify aggregation; it assumes the need for aggregation to define the coherent pattern.

  ---

  ### 3. Marking Scheme (Table + 150 words)

  | Must-Hit Point                        | Required Move                                                                 | Marks | Competent B Answer (Gets Mark)                              | A Answer (Adds)                                                                 | Common Mistake                               |
  | :------------------------------------ | :---------------------------------------------------------------------------- | :---- | :---------------------------------------------------------- | :------------------------------------------------------------------------------ | :------------------------------------------- |
  | **(a) Calculation**                   | Correct SDs, Rescaled Values, Overall Scores, Identification of B as optimal. | 4     | Correct arithmetic & result (B recommended).                | Precise calculation (or clear rounding logic).                                  | Arithmetic errors (often SD).                |
  | **(b) Recalculation**                 | Correct SDs, Rescaled Values, Overall Scores for {A, C}.                      | 2     | Correct arithmetic & result (C > A).                        | Precise calculation.                                                            | Fails to recalc SDs, uses old values.        |
  | **(b) Ranking Change Explanation**    | Identify no reversal for A vs C; Explain *why* (SD change, rescaling impact). | 4     | Notes SD changed drastically; links rescaling to menu.      | **Explicitly names menu-dependence as key issue; notes magnitude change; highlights SD as set by menu (incl. irrelevant options).** | Asserts reversal happened; vague on "sensitivity". |
  | **(c)(i) Rescaling Role for B**       | Explain rescaling dampens B's extreme U-value via large (B-caused) SD(U).    | 2     | Notes high SD reduces B's U-rescaled value.                 | **Explicitly links SD size to B's presence; notes it counters raw U dominance.** | Focuses only on low D-value.                 |
  | **(c)(ii) Principled/Artifact**       | Argue it's an artifact due to arbitrary scaling via menu-dependent SD.        | 3     | Identifies it as artifact; mentions scaling issue.          | **Clearly distinguishes internal justification vs. external imposition; highlights SD's arbitrariness & lack of grounding in theories; calls it "smuggled in".** | Calls it principled w/o justification; confuses w/ Pascalian wager. |
  | **(d) Sequential Challenge**          | Explain FT leads to exploitable pattern disvalued by minority theory over time. | 2     | Describes sequential regret under D for always choosing B. | **Explicitly mentions "pattern of choices" & "realized D-value over time".**    | Only describes single case.                  |
  | **(d) Presupposition**                | State that the argument presupposes aggregation to evaluate the overall pattern. | 3     | Says it "assumes" or "depends on" aggregation.              | **Explicitly links "evaluating overall pattern" to retrospective aggregation; "defines coherence aggregatively".** | Says it doesn't presuppose; or vague.        |
  | **Total**                             |                                                                               | **20** |                                                             |                                                                                 |                                              |

  **Separating A from B:** An A answer demonstrates **conceptual mastery beyond calculation**. It **explicitly names and analyzes the core philosophical problems**: menu-dependence (b) as a fatal flaw in the rescaling procedure, the **arbitrary imposition of scale** via SD (c-ii) as a smuggled moral commitment lacking internal justification, and the **circularity** in the sequential argument (d). It uses the calculation **to illustrate these points**, not just report results. A B answer performs calculations correctly and identifies surface-level issues (e.g., "rescaling changes things", "SD matters", "sequential choices might be bad") but lacks the depth to articulate *why* these are fundamental objections to the procedure's coherence or justification. It may assert conclusions without fully leveraging the numbers or the scenario to demonstrate the underlying conceptual tensions.

  ---

  ### 4. Common Evasions (200 words)
  *   **Invoking Names/Doctrines:** Mentioning "MacAskill," "Sepielli," "maximizing expected choice-worthiness," or "Pascalian problems" without engaging the *specific mechanics* of rescaling-by-SD or the provided numbers. No marks for labeling.
  *   **Ignoring SD/Menu Dependence:** Treating rescaled values as given or inherent to the theories, not calculated from the menu. Focusing solely on credence weighting without analyzing *how* the rescaling works or depends on the menu.
  *   **Misdiagnosing (b):** Asserting a reversal happened between A and C when it demonstrably didn't in the numbers; or vaguely stating "adding options changes things" without linking it *specifically* to the SD calculation and rescaling step.
  *   **Conflating Worries:** Discussing the "Pascalian wager" (tiny prob, huge payoff *within* U) as the problem with B, rather than the *cross-theoretic* aggregation issue of how U's huge value interacts with D's scale via rescaling. The long-shot here is *within* U's valuation; the worry is aggregation *across* U and D.
  *   **Assertion without Derivation:** Stating "rescaling is arbitrary" or "menu dependence is bad" without showing *how* the calculation makes this evident (especially in b & c-ii).
  *   **Vague Sequential Argument:** Saying FT is "short-sighted" or "ignores minority views" without explaining the *exploitability over a sequence of choices* that leads to regret evaluable only from an aggregative perspective.
  *   **Ignoring Dominance:** Discussing whether aggregation can recommend a dominated option is irrelevant here (no option is dominated by all theories).
