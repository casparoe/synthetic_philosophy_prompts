answer: |-
  Your principle—"you know when it's not a fluke that you're right; if you’d formed the belief the same way in nearby situations, you’d still have been right"—is a **reliability condition**. It focuses on whether the method reliably produces true beliefs across similar cases. Let's test it against your cases and your verdicts:

  - **Case 1 (Priya)**: The status page is unreliable (cached, unnoticed). In nearby situations (e.g., if services were unhealthy), she’d be wrong. **Not a fluke? No → No knowledge** (matches your verdict).  
  - **Case 2 (Temp probe)**: The probe reliably answers "over 40°C?" despite general inaccuracy. In nearby situations (temps near 40–57°C), it would still be right. **Not a fluke? Yes → Knowledge** (matches).  
  - **Case 3 (PM)**: The PM’s reports are unreliable (habitual lies). In nearby situations (other weeks), you’d be wrong. **Not a fluke? No → No knowledge** (matches).  
  - **Case 4 (Flapping alert)**: The alert system is unreliable (5 false alarms). In nearby situations (e.g., during flapping), you’d likely be wrong. Your principle says **not a fluke? No → No knowledge** (matches your instinct).  
  - **Case 5a (Low-risk README)**: Vague memory is unreliable. In nearby situations (e.g., misremembered times), you’d often be wrong. **Not a fluke? No → Should be no knowledge**, but you said "knew." **Mismatch**.  
  - **Case 5b (High-risk DB)**: Same unreliable method. **Not a fluke? No → No knowledge** (matches your verdict).  

  **Problem**: Your principle **fails Case 5a** (it says "no knowledge," but you said "knew"). It also struggles with **Case 4**—your intuition wavers because the alert *was* correct, but the method is unreliable.  

  **Minimal repair**: Add a **stakes-sensitivity clause**. Knowledge requires:  
  1. **Reliability**: Your method isn’t fluky (it would work in nearby cases).  
  2. **Sufficiency for context**: The method’s reliability is "good enough" *for the stakes*.  
  Low stakes? Moderate reliability suffices. High stakes? You need higher reliability.  

  **Repaired principle**:  
  > **You know something when (i) it’s not a fluke that you’re right (your method is reliable across nearby cases), and (ii) the method is reliable enough for the practical stakes at hand.**  

  ### How it saves your verdicts:  
  - **Case 1**: Unreliable method (fails i). **No knowledge** (saved).  
  - **Case 2**: Reliable for the binary question (i), and stakes moderate (ii). **Knowledge** (saved).  
  - **Case 3**: Unreliable method (fails i). **No knowledge** (saved).  
  - **Case 4**: Unreliable method (fails i). **No knowledge** (saves your initial instinct).  
  - **Case 5a**: Unreliable method (i fails), *even for low stakes*. **No knowledge** (you must drop this verdict).  
  - **Case 5b**: Unreliable method (i fails), especially for high stakes. **No knowledge** (saved).  

  **Verdicts to drop**: You **must drop 5a**. Your intuition that you "knew" in 5a is inconsistent with the reliability requirement. Stakes can’t *create* knowledge from unreliable methods; they only raise the bar for what counts as "reliable enough."  

  ### Extra cases:  
  - **(a) AI coding fix**: You applied the fix without understanding. The method (blindly trusting AI) is unreliable in nearby cases (e.g., if AI suggests a bad fix). **Not knowledge** (fails i).  
  - **(b) "It’s DNS" guess**: Method (always guessing DNS) is unreliable across nearby cases. **Not knowledge** (fails i).  

  **Final principle label**: **Reliability-Plus-Stakes**.  

  \answer{reliability-plus-stakes; drop 5a}
