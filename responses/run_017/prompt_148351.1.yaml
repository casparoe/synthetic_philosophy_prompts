answer: |-
  ### Decision Tree for Formal Accounts of Embedded Agency

  **Root: I want a formal account of what this agent should do.**

  1. **Can the agent perfectly predict its own next action (given its policy and state)?**  
     - *Yes*: → (2)  
     - *No*: → (3)  

  2. **With perfect self-prediction, are counterfactuals defined via interventions or proofs?**  
     - *Interventions (causal graphs)*:  
       - **Leaf: Causal Decision Theory (CDT) with Self-Reference**  
         *Awkward commitment:* Must embed a causal model containing the agent itself, risking infinite regress when the agent's action affects its own state.  
     - *Proofs (logical implications)*:  
       - **Leaf: Logical Decision Theory (LDT, e.g., TDT/UDT)**  
         *Awkward commitment:* Requires the agent to prove theorems about its own actions, demanding unrealistic logical omniscience.  

  3. **Why can't the agent perfectly self-predict?**  
     - *Due to bounded computation (e.g., lacks resources to compute own output)*: → (4)  
     - *Due to self-reference paradoxes (e.g., Gödelian incompleteness)*: → (5)  
     - *Due to environmental interference (e.g., future policy mutable by environment)*: → (6)  

  4. **Does the agent use a world model at all?**  
     - *Yes*:  
       - **Leaf: Bounded Rationality (e.g., Resource-Bounded Bayesian)**  
         *Awkward commitment:* Arbitrary computational limits may misalign with real-world constraints, and the agent cannot model its own boundedness.  
     - *No*:  
       - **Leaf: Model-Free (e.g., Reinforcement Learning Heuristics)**  
         *Awkward commitment:* Cannot reason counterfactually or generalize to novel states, as actions are learned associations, not model-based.  

  5. **How does the agent handle self-reference without perfect self-knowledge?**  
     - *Weaken self-knowledge (partial/approximate self-models)*:  
       - **Leaf: Partial Self-Knowledge (e.g., Löb's Theorem-Based Agents)**  
         *Awkward commitment:* Systematic self-ignorance may cause incoherent long-term plans (e.g., unaware of own subgoal conflicts).  
     - *Treat agent/world boundary as informational (not ontological)*:  
       - **Leaf: Information-Theoretic Partition**  
         *Awkward commitment:* Boundary location is arbitrary, and decisions may shift unpredictably if the partition changes.  

  6. **What is the unit of agency?**  
     - *Time-slice (optimize current action only)*:  
       - **Leaf: Time-Slice Rationality**  
         *Awkward commitment:* Encourages short-termist actions that corrupt future policy (e.g., self-sabotage if environment modifies memory).  
     - *Whole policy (optimize across all time)*:  
       - **Leaf: Policy-Stable Optimization (e.g., UDT with Modification Robustness)**  
         *Awkward commitment:* Must precompute responses to all possible environment-induced policy changes, which is computationally intractable.  

  ---

  ### Notes on the Tree

  - **Empty Boxes & Why**:  
    - *"Drop self-reference entirely"*: Incoherent. Self-reference is unavoidable if the agent reasons about its own actions (§3-§5).  
    - *"Deterministic policy with environmental interference"*: Unattractive. If the environment can mutate the agent, determinism collapses (§3→§6).  
    - *"Perfect self-prediction without counterfactual method"*: Incoherent. Counterfactuals are mandatory for "should do" accounts (§2).  

  - **Strawmen/Collapsed Positions**:  
    - *Deflationary "Classical DT Suffices"*: Collapses into §2 (CDT with Self-Reference). Ignores environmental interference (§3→§6) and is not a distinct leaf.  
    - *"Agents as Trajectories of a Coupled System"*: Collapses into §6 (Policy-Stable). Trajectories require whole-policy optimization.  

  - **Pairs the Tree Can't Separate**:  
    - **Policy-Stable Optimization (§6) vs. LDT (§2)**: Both use proof-based counterfactuals. Separation depends on whether environmental interference (§3) is the *cause* of imperfect self-prediction.  
    - **Partial Self-Knowledge (§5) vs. Bounded Rationality (§4)**: Overlap when boundedness *causes* partial self-knowledge. Tree separates them via root cause (§3: paradoxes vs. computation).  

  - **Why This Branching?**  
    Self-prediction (§1) is the hardest sub-problem: it forces positions to confront self-reference, boundedness, and environmental interference. Each branch isolates a core tension (e.g., §3 forces reasons for imperfect self-prediction; §6 forces time-slice vs. whole-policy agency).  

  - **Unnamed Leaves**:  
    - Time-Slice Rationality (§6) and Information-Theoretic Partition (§5) lack standard names but are active research positions.
