answer: |-
  ## Draft Committee Opinion: Thalassa Figure Claim

  **To:** University Museum Board of Trustees  
  **From:** Collections Stewardship Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Meridian Ministry of Culture Claim for Accession 1994.112 (Thalassa Figure Fragments)

  **Recommendation:** The Collections Stewardship Committee recommends that the University Museum certify the Meridian Ministry of Culture's claim as valid concerning Accession 1994.112 and acknowledge that the claim pertains to *all thirty-one original fragments* constituting the Thalassa Figure, regardless of current location. We further recommend initiating the deaccession process for our nineteen fragments and cooperating with the Ministry and other holders towards the reunification and return of *all* original fragments to Meridia.

  **Reasoning:**

  The Meridian Ministry of Culture's claim hinges on whether the thirty-one original fragments constitute a single "object of outstanding cultural significance" under the Meridian Cultural Property Restitution Act 1979. Our assessment, grounded in curatorial practice, conservation ethics, museum policy interpretation, and the demonstrable historical and cultural reality of the figure, concludes that they do.

  1.  **Curatorial Significance and Historical Unity:** Our 2016 curatorial review unequivocally states that the fragments, *when considered together*, constitute "the most important surviving example of Meridian monumental sculpture." This significance derives entirely from their origin as parts of a single, cohesive votive figure broken in antiquity. Individually, the fragments lack comparable significance. The Ministry's claim inherently recognizes this unity – they seek the return of the *Figure*, not merely disparate stones. Denying the claim based on the fragments' physical separation and individual assessments ignores the fundamental basis of the object's cultural importance and the Ministry's legitimate interest in its restitution as a whole entity.

  2.  **Interpreting the 1998 Stewardship Manual:** The Manual states an "accession unit corresponds to what curatorial practice counts as a single object" and that fragments share an accession number only if "joined by continuous original material at the time of acquisition." While our fragments were not physically joined by original stone upon acquisition in the 1970s, the Manual's core principle is curatorial practice defining the unit.
      *   **Curatorial Practice:** Our practice, demonstrated by the 1994 exhibition, inherently treated the fragments as constituent parts of a single entity. The meticulous physical reassembly (proving the fragments' original unity via joining break surfaces) and the creation of a unified display label ("The Thalassa Figure") for the 1994 exhibition reflect a curatorial judgment that the *meaningful object* is the reassembled figure. Our current gallery display of a "full-size 3D-printed reassembly labeled 'The Thalassa Figure'" further reinforces this curatorial understanding that the fragments collectively represent one significant work.
      *   **"At Time of Acquisition":** The Manual's focus on the state "at the time of acquisition" is a practical administrative rule for assigning accession numbers, not a definitive metaphysical or ethical statement about the inherent unity of archaeologically significant fragments. It was designed to prevent arbitrary grouping, not to preclude recognizing the fundamental unity of elements known *at acquisition* to belong to a single, fragmented original. We acquired nineteen fragments *known* to be parts of the Thalassa Figure, alongside knowledge of other fragments elsewhere. The Manual should not be interpreted so rigidly as to fracture an entity we have consistently treated conceptually as whole.
      *   **"Continuous Original Material":** The Registrar's interpretation requiring direct contact of original stone for a shared accession is overly literal and misapplied to this context. The Manual's phrasing likely intended scenarios where fragments *could* be physically joined but weren't glued/restored yet, or where ambiguous groupings needed clarity. It was not meant to deny the inherent connection of fragments from a known, singular source that *can* be physically reassembled along original breaks (as proven in 1994), simply because they are stored separately. The spirit of the rule is about demonstrable original connection, which exists here via the matching break surfaces.

  3.  **Addressing Restoration and Additions:** The presence of plaster-bridged junctions (1961) and a reconstructed forearm (1958) does not negate the unity of the thirty-one *original* fragments. Our ethical obligation concerns the original cultural material. The claim, as filed for Accession 1994.112, pertains to the nineteen original fragments. Regarding the complete figure, the Ministry seeks *original constituent parts*. Therefore:
      *   The plaster bridges are conservation interventions filling gaps; they are not original material and are not subject to the claim as "constituent parts."
      *   The 1958 reconstructed forearm is entirely modern fabrication, bonded to an original shoulder fragment. While bonded, it is not an original constituent part. The Ministry's claim logically extends only to the original shoulder fragment, not the modern addition. The shoulder fragment itself remains an original constituent part.

  4.  **The Metaphysical Question and the Trustee's Position:** It is true that philosophers debate the "special composition question" – when do parts constitute a whole? Views range from universal composition to composition only in specific cases (like organisms) to nihilism or conventionalism. A trustee has argued that since there is "no fact of the matter," we should adopt the convention that minimizes returns.
      *   **The Strength of the Counter-Argument:** This view highlights the genuine ambiguity inherent in defining "object" abstractly. It correctly notes that the Meridian law offers no definition, leaving room for interpretation. Choosing a fragment-based interpretation is procedurally defensible under our Manual's strict reading and would result in retaining our fragments. It reflects a pragmatic approach focused narrowly on the Museum's immediate legal and physical holdings.
      *   **Why it Does Not Prevail:** While metaphysically intriguing, relying on ambiguity to justify retention contradicts core museum ethics regarding cultural property and restitution. Our role isn't to exploit philosophical indeterminacy for institutional advantage, but to apply reasoned judgment based on evidence, cultural significance, and evolving professional standards. The *cultural reality* recognized by the source nation (Meridia), our own curatorial assessment of significance, the proven physical unity of the fragments, and the demonstrable intent behind the Ministry's claim (recovering a national treasure *as a whole*) provide compelling reasons to interpret "object" as the complete original figure in this specific context. Choosing the narrowest interpretation solely to retain material undermines the spirit of restitution dialogues and our institution's credibility. Furthermore, as our counsel noted, consistency and reasonableness matter. Defining the object based on its demonstrable cultural unity and significance is a reasonable and consistent principle applicable to similar fragmented cultural assets.

  **Concrete Course of Action & Timeline:**

  1.  **Registration & Certification (Within 1 Week of Board Approval):**
      *   The Registrar shall formally note in the collection record that Accession 1994.112 comprises nineteen original fragments recognized as constituent parts of the Thalassa Figure.
      *   The Museum Director shall formally respond to the Meridian Ministry of Culture:
          *   Certifying that the claim for Accession 1994.112 is valid and accepted.
          *   Certifying that the Ministry's claim, as understood by the University Museum, properly extends to *all thirty-one original fragments* identified as constituent parts of the Thalassa Figure, regardless of current location.
          *   Clarifying that the claim pertains *only* to original fragments, not later conservation materials (plaster bridges) or modern reconstructions (1958 forearm).
          *   Offering to facilitate communication with the Nordhavn Museum and (to the extent possible) the Geneva collector regarding their fragments.
          *   Initiating the deaccession process for our nineteen fragments pursuant to museum policy and in consultation with the Ministry.

  2.  **Engagement with Other Holders (Within 2 Weeks of Board Approval):**
      *   The Director shall contact the Nordhavn Museum of Antiquities, sharing our decision and the Ministry's claim, expressing strong support for the reunification of all fragments, and offering any necessary curatorial/conservation assistance for their potential return.
      *   The Director shall contact the Geneva collector (via legal channels if necessary), informing them of the Museum's position and the Ministry's claim regarding the five fragments in their possession, urging their cooperation in the restitution process, and offering Museum assistance in facilitating transfer.

  3.  **Deaccession & Transfer (Timeline dependent on Meridian response & logistics):**
      *   Complete the internal deaccession process for the nineteen fragments.
      *   Work closely with the Meridian Ministry of Culture to arrange the secure and documented transfer of the fragments, ideally coordinating timing with the return of other fragments if possible.

  4.  **Gallery Labeling:** Our current labeling of the 3D print as "The Thalassa Figure" explicitly acknowledges the fragments' collective significance and unity. This existing practice supports our position that the *meaningful cultural object* is the complete figure, not the isolated fragments. This labeling practice should be cited internally as evidence of our consistent curatorial understanding, though it carries limited direct legal weight.

  **Verdict:** Recommend deaccession and transfer of all original Thalassa Figure fragments to Meridia.
