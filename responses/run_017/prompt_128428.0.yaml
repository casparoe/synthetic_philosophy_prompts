prompt: |-
  I work as a statistician at a small environmental consultancy, and until about three months ago I had never had any professional reason to think about Bertrand's paradox. I now have to sign a report that turns on it.

  The setting: a client holds a licence for works on the edge of a wetland reserve that is, to within the tolerances that matter, a disc. The licence conditions require an estimate of a quantity defined by sampling "straight-line transects selected uniformly at random from the set of all straight lines meeting the reserve", and the regulation says nothing more than that. Two of my analysts produced two estimates that differ by enough to move the predicted figure across the threshold the licence decision turns on; neither made an error. One sampled by taking two independent points uniformly on the boundary and joining them, the other by taking a radius uniformly and a point uniformly along it and drawing the perpendicular. As you will recognise, this is Bertrand's chord problem in field dress: those two schemes answer the corresponding threshold question as 1/3 and 1/2, and a third available scheme (the midpoint uniform over the area of the disc) answers it as 1/4.

  My principal statistician's response is that we are overthinking this, and he leans on an analogy that everyone in the office has since started repeating: it is, he says, exactly like a fair die or a properly shuffled deck. A real randomiser is a physical object with a fixed, finite, already-individuated set of cases, and the symmetries of the set-up force the chances onto them; if you get a paradox, you have simply failed to say what the randomiser was. He uses it to license three conclusions, and I need to know how much of this survives: (i) that in any real case like ours there is a single fact of the matter about what "uniformly at random" requires; (ii) that the paradox is nothing but an incompletely specified question, so that specifying the chance set-up — the die, the shuffle, or in our case an explicit drone protocol — determines the answer; and (iii) that we should therefore write down a protocol, report whatever it gives, and treat any residual disagreement as philosophical noise the regulator can safely ignore.

  What makes me doubt it is this. We can make our protocol perfectly explicit and it does not seem to settle anything, because the regulation does not ask for the output of a protocol; it asks for a sample uniform over the set of lines, which is supposed to be protocol-independent. And every protocol we can write down is uniform only relative to a parametrisation we have chosen — a launch point uniform in boundary arc with a heading uniform in angle is not the same distribution as a launch point uniform in the area of the reserve with a heading uniform in angle, and both are honestly described as "uniform by symmetry". There is also a mathematical worry I can only half-articulate: all three classical schemes are rotation-invariant, so the disc's symmetry group does not discriminate between them, whereas with a die the symmetry group seems to me to force the answer. But I cannot tell whether that is the crux or a red herring.

  Please audit the analogy rather than simply resolving the paradox. I would like, in British English throughout:

  1. A correspondence table, one row per feature of the fair-die/shuffled-deck set-up, with the columns: `die_feature` (the feature of the chance device), `transect_counterpart` (what plays that role in our problem, or "none"), `fit` (exactly one of: clean, strained, no counterpart), `imports` (what the analogy quietly attributes to our problem that it may not have, or "none"), and `load_bearing` (exactly one of: yes, no — whether the feature matters for conclusions i–iii).

  2. A second table of the disanalogies, sorted from most to least damaging, with the columns: `disanalogy`, `which_conclusion` (i, ii or iii), `verdict` (exactly one of: fatal, serious, cosmetic), and `why`.

  3. A single JSON object with these fields: `verdict_on_each_conclusion` (an object with keys `i`, `ii` and `iii`, each mapping to an object with the fields `survives` (one of: yes, partly, no), `in_what_form` and `one_line_reason`); `smuggled_assumptions` (an array of the assumptions the analogy imported that our problem lacks); `what_the_analogy_was_carrying` (the work the picture was doing rather than the argument); `better_analogy` (a candidate, or null if there is none); `what_the_better_analogy_still_misses`; `recommended_reporting_strategy` (what I should actually put in the report given that I cannot appeal to a literature); `scheme_recommendation_if_forced` (an object with `scheme`, `justification` and `expected_objection`); `residual_question` (the one question the audit leaves open that I would still need answered); and `confidence` (one of: high, moderate, low).

  Please argue everything out rather than pointing me at sources: I have no library access here, so citations, reading suggestions and "see the literature on X" are of no use to me, and I would rather have your reasoning than a name I cannot look up.
reasoning: |-
  We are auditing the analogy between Bertrand's paradox and a fair die/shuffled deck. The principal statistician uses the analogy to support three conclusions:

  (i) In any real case like ours, there is a single fact of the matter about what "uniformly at random" requires.

  (ii) The paradox is nothing but an incompletely specified question, so specifying the chance set-up determines the answer.

  (iii) We should write down a protocol, report whatever it gives, and treat any residual disagreement as philosophical noise.

  We are to assess the analogy by:

  1. A correspondence table (die features vs. transect counterparts).
  2. A table of disanalogies, sorted by damage.
  3. A JSON object with detailed verdicts and recommendations.

  ## Step 1: Correspondence Table

  We consider the features of a fair die or shuffled deck:

  ### Feature 1: Finite set of outcomes
  - **die_feature**: The die has a fixed, finite number of faces (e.g., 6 for a standard die). Similarly, a shuffled deck has 52 distinct cards.
  - **transect_counterpart**: None. The set of all straight lines meeting the disc is infinite and continuous.
  - **fit**: No counterpart.
  - **imports**: The analogy imports the idea of a finite set of equally likely outcomes. But in our case, we have an infinite set with no natural measure that forces uniformity in a unique way.
  - **load_bearing**: Yes. The finiteness is crucial for the die because it allows the symmetry to force a uniform distribution. Without finiteness, symmetry alone may not force a unique measure.

  ### Feature 2: Discrete and individuated outcomes
  - **die_feature**: Each outcome (face of the die or card in the deck) is clearly distinct and countable.
  - **transect_counterpart**: None. The lines are continuous and not naturally individuated in a discrete way.
  - **fit**: No counterpart.
  - **imports**: The idea that outcomes are discrete and can be counted. This is not the case for lines in the plane meeting a disc.
  - **load_bearing**: Yes. The discrete nature allows for counting and thus a uniform distribution by symmetry. Without it, we must choose a measure.

  ### Feature 3: Physical symmetry of the randomizer
  - **die_feature**: The die is symmetric (cubical) so that each face is equally likely. A deck is symmetric in the sense that shuffling randomizes the order.
  - **transect_counterpart**: The disc is symmetric (rotationally and reflectionally). However, this symmetry does not by itself force a unique measure on the set of lines.
  - **fit**: Strained. The disc's symmetry is present, but it does not force a unique measure because the set of lines is a non-compact space and there are multiple invariant measures.
  - **imports**: The idea that symmetry forces a unique uniform distribution. In the die, symmetry does force uniformity. In the transect case, symmetry (rotation invariance) is satisfied by all three methods (and more) but they are different.
  - **load_bearing**: Yes. The principal uses symmetry to argue for a unique uniform distribution, but in the transect case symmetry is not sufficient to pick one.

  ### Feature 4: Known and fixed set of outcomes
  - **die_feature**: The set of outcomes is known and fixed before the experiment (e.g., the numbers 1 to 6).
  - **transect_counterpart**: The set of lines is fixed (all lines intersecting the disc). However, there is no natural way to index or label them that is canonical.
  - **fit**: Strained. The set is fixed, but without a natural parametrization, we don't have a canonical way to assign probabilities.
  - **imports**: That the set of outcomes is predefined and unambiguously defined. But in the transect case, the set is defined, but how we sample from it is not fixed by the definition.
  - **load_bearing**: Yes. The fixed set is there, but without a canonical parametrization, we don't have a unique uniform distribution.

  ### Feature 5: The randomizer is a physical object
  - **die_feature**: The die is a physical object that can be thrown, and the outcome is determined by physical laws.
  - **transect_counterpart**: The disc is a physical object (the wetland reserve) and we might use a physical method (like a drone) to sample.
  - **fit**: Clean. The disc is a physical object, and we can design a physical randomizer (like a drone protocol) to sample lines.
  - **imports**: That the physical randomizer will determine the distribution. This is true: if we specify a physical protocol, then we get a distribution.
  - **load_bearing**: Yes, for conclusion (iii). But note: the regulation does not specify the protocol, so the physical protocol we choose is arbitrary.

  ### Feature 6: The distribution is determined by the physical set-up
  - **die_feature**: The symmetry and fairness of the die determine the uniform distribution.
  - **transect_counterpart**: The physical set-up of the drone protocol determines the distribution. However, the disc's symmetry does not by itself determine the distribution.
  - **fit**: Strained. The physical set-up does determine the distribution, but the disc's symmetry does not force a particular protocol (and hence distribution) because there are multiple symmetric protocols that yield different distributions.
  - **imports**: That the physical set-up forces the distribution. This is true, but the problem is that the regulation does not specify the set-up, and the disc's symmetry does not pick one.
  - **load_bearing**: Yes, for (ii) and (iii). But note: the regulation does not specify the physical set-up, so we have to choose one arbitrarily.

  ## Step 2: Disanalogies (sorted by damage)

  ### Disanalogy 1: Finiteness vs. Infinity
  - **disanalogy**: The die has a finite set of outcomes, while the set of lines is infinite and continuous.
  - **which_conclusion**: (i) and (ii). For (i): in the finite case, there is a unique uniform distribution; in the infinite case, there is not. For (ii): specifying the set-up in the finite case immediately gives the distribution, but in the infinite case, even with symmetry, we have multiple options.
  - **verdict**: Fatal.
  - **why**: Without finiteness, symmetry does not force a unique measure. There are multiple invariant measures (corresponding to different parametrizations) that are equally symmetric.

  ### Disanalogy 2: Discrete vs. Continuous
  - **disanalogy**: The die has discrete outcomes, while the lines form a continuous space.
  - **which_conclusion**: (i) and (ii).
  - **verdict**: Fatal.
  - **why**: In discrete spaces, we can count and assign equal probability to each outcome. In continuous spaces, we must choose a measure, and the uniform measure is relative to a chosen parametrization.

  ### Disanalogy 3: Symmetry forcing a unique measure
  - **disanalogy**: For the die, the physical symmetry forces a unique uniform distribution. For the disc, the rotational symmetry does not force a unique measure on the set of lines (because there are multiple rotationally invariant measures).
  - **which_conclusion**: (i) and (ii).
  - **verdict**: Fatal.
  - **why**: The symmetry group of the disc is not large enough to force a unique measure on the space of lines. The three classical methods are all rotationally invariant and yield different probabilities.

  ### Disanalogy 4: Predefined canonical labeling
  - **disanalogy**: In the die, the outcomes are labeled (e.g., 1 to 6) and the labeling is canonical. For the set of lines, there is no canonical parametrization.
  - **which_conclusion**: (i) and (ii).
  - **verdict**: Serious.
  - **why**: Without a canonical parametrization, we cannot define "uniform" without specifying how we parametrize the space.

  ### Disanalogy 5: The role of the physical randomizer
  - **disanalogy**: In the die, the physical randomizer (the die itself) is given and its symmetry forces the distribution. In the transect case, the physical randomizer (drone protocol) is not specified by the regulation, so we have to choose one arbitrarily.
  - **which_conclusion**: (iii).
  - **verdict**: Serious.
  - **why**: The regulation does not specify the protocol, so choosing one is arbitrary and may be challenged. Moreover, the analogy suggests that any protocol is as good as another, but the regulation requires uniformity over the set of lines, which is not protocol-independent.

  ### Disanalogy 6: The set of outcomes is not compact
  - **disanalogy**: The set of lines intersecting the disc is not compact (it includes lines arbitrarily close to tangent and lines that are diameters, and the space is non-compact). This is unlike a die which has a fixed set.
  - **which_conclusion**: (i) and (ii).
  - **verdict**: Serious.
  - **why**: Non-compactness means that we cannot normalize the measure to a probability measure without choosing a particular way to truncate or weight the space.

  ### Disanalogy 7: The regulation does not specify the randomizer
  - **disanalogy**: The regulation does not specify the physical randomizer (like the drone protocol) but instead asks for a sample uniform over the set of lines.
  - **which_conclusion**: (iii).
  - **verdict**: Serious.
  - **why**: The analogy with the die assumes that the randomizer is given (the die is the randomizer). But in our case, the regulation does not specify the randomizer, so we are left without guidance.

  ## Step 3: JSON Object

  ### verdict_on_each_conclusion
  - **i**: 
