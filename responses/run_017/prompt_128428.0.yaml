     - **Conclusion (iii)**: Partly survives. Use a protocol for transparency, but acknowledge ambiguity; don't dismiss disagreement as noise.

  4. **Better Analogy**: "Random great circle on a sphere" has a unique invariant measure (Haar measure) under SO(3). But the disc's symmetry is smaller (SO(2)), so it still misses the key issue: bounded regions lack unique invariant measures for lines.

  5. **Reporting Strategy**: Prioritize transparency. Admit the ambiguity, specify the protocol used, and urge regulatory clarification. If forced, recommend the radial method as operationally natural for aerial surveys (common in environmental work), but preempt boundary-method objections.

  6. **Residual Question**: The unresolved core issue is whether the regulation intends a protocol matching practical sampling (e.g., drones → radial; foot patrols → boundary) or a mathematical ideal (which is undefined). This requires dialogue with regulators.
