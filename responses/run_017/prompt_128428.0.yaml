  ### Explanation of Key Elements

  1. **Correspondence Table**: The die analogy imports finiteness, canonical outcomes, and symmetry forcing uniqueness—none of which hold for transects. The "clean" fit for physical randomisers is superficial; it masks that the protocol choice is arbitrary for the regulation's demand.

  2. **Disanalogies**: The fatal flaws are the finite/infinite divide and symmetry's failure to force uniqueness. Continuous spaces require choosing a measure; the disc's symmetry doesn't select one. The regulation's focus on lines (not protocols) makes disagreement substantive.

  3. **Verdicts**:
