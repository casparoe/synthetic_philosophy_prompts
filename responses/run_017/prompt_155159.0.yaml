  ### Decision Tree: Ethics of Infinite Outcomes  
  **Starting Commitment:** Some outcomes contain infinitely many lives or lives of infinite duration, and this is not a reason to abandon ethical evaluation.  

  ---

  #### **Branch 1: Evaluating Infinite Parts**  
  **Case:** Compare two worlds: one with infinitely many lives of finite well-being, and one with a single life of infinite well-being.  
  **Question:** Should we assign value to the *entire* outcome, including its infinite parts?  
  - **Yes** → Go to Branch 2.  
  - **No** → **Leaf: Finitism**  
    - *Awkward commitment:* Only finite outcomes (or finite segments) are evaluable; infinite parts must be ignored.  

  **Gloss:** *Finitism* holds that ethics applies solely to finite comparisons.  

  ---

  #### **Branch 2: Symmetry of Infinity Types**  
  **Case:** World A has one life of infinite bliss. World B has infinitely many lives, each with finite bliss (e.g., +1 utility per life), summing to infinite total value.  
  **Question:** Are World A and World B equally good?  
  - **Yes** → Go to Branch 3.  
  - **No** → **Leaf: Asymmetric Infinity Valuation**  
    - *Awkward commitment:* "Infinitely good per life" and "infinitely many good lives" are not interchangeable; one may be strictly better.  
    - *Diagnosis:* Coherent but unexplored—no major position defends this.  

  **Gloss:** *Symmetry* asks whether magnitude (infinite welfare per life) and number (infinite lives) are ethically equivalent.  

  ---

  #### **Branch 3: Arrangement Sensitivity**  
  **Case:** Hotel A has all ecstatic lives first, then all suffering lives. Hotel B interleaves them (ecstatic, suffering, ecstatic, ...). Both hotels have identical lives, only arranged differently.  
  **Question:** Are Hotel A and Hotel B equally good?  
  - **Yes** → Go to Branch 4.  
  - **No** → **Leaf: Arrangement-Sensitive Aggregation**  
    - *Awkward commitment:* The temporal/spatial order of lives affects overall value, even if all lives are identical.  

  **Gloss:** *Arrangement sensitivity* tests whether order matters when the multiset of lives is fixed.  

  ---

  #### **Branch 4: Convergence and Totals**  
  **Case:** An infinite sequence of lives has well-being: +1, −1/2, +1/3, −1/4, ... The sum converges to ln(2) ≈ 0.693 in this order, but rearranged (e.g., all positives first) sums to +∞.  
  **Question:** Does the original sequence have a determinate total well-being?  
  - **Yes, it equals the ordered sum (0.693)** → Go to Branch 5.  
  - **No, rearrangement changes the sum** → **Leaf: Convergence Undefined**  
    - *Awkward commitment:* Some worlds lack a definite total value; ethics may be silent when series converge conditionally.  

  **Gloss:** *Conditional convergence* means reordering terms changes the sum.  

  ---

  #### **Branch 5: Density vs. Cardinality**  
  **Case:** World X has a limiting proportion of good lives = 1/2 (e.g., good, bad, good, bad, ...). World Y has limiting proportion = 1 (e.g., all good after some point). Both have ℵ₀ good and ℵ₀ bad lives.  
  **Question:** Are World X and World Y equally good?  
  - **Yes** → Go to Branch 6.  
  - **No** → **Leaf: Density-Prioritizing View**  
    - *Awkward commitment:* Limiting frequency (e.g., 90% good lives) outweighs cardinality (e.g., equal *number* of good and bad lives).  

  **Gloss:** *Limiting relative frequency* is the long-run proportion of a subset (e.g., good lives) in an infinite sequence.  

  ---

  #### **Branch 6: Finite Additions to Infinite Background**  
  **Case 1:** Add one life of mild suffering to a world of infinite bliss.  
  **Case 2:** Add one life of high bliss to a world of infinite suffering.  
  **Question:** Does adding the life change the world’s value in either case?  
  - **Yes, in both cases** → Go to Branch 7.  
  - **Yes, only for Case 1 (bliss + suffering)** → **Leaf: Asymmetric Addition**  
    - *Awkward commitment:* Adding suffering to bliss matters, but adding bliss to suffering is irrelevant.  
  - **Yes, only for Case 2 (suffering + bliss)** → *Diagnosis:* Coherent but unexplored—no major position.  
  - **No, in both cases** → **Leaf: Anti-Aggregativism**  
    - *Awkward commitment:* Adding good/bad lives to an already infinite world changes nothing.  
  - **Incomparable/Undefined** → **Leaf: Incomparability in Finite Addition**  
    - *Awkward commitment:* Finite changes are undefined against infinite backgrounds.  

  **Gloss:** *Anti-aggregativism* denies that adding lives affects value if the world is "full."  

  ---

  #### **Branch 7: Person-Affecting and Non-Archimedean Structures**  
  **Case:** Add one suffering life to infinite bliss (Case 1) or one blissful life to infinite suffering (Case 2).  
  **Question:** Is the change *explained by effects on specific individuals*?  
  - **Yes, it worsens/improves the added life** → **Leaf: Person-Affecting View**  
    - *Awkward commitment:* Only changes affecting *particular* individuals (e.g., the added life) matter; background infinity doesn’t override this.  
  - **No, but finite differences still matter** → **Leaf: Non-Archimedean View**  
    - *Awkward commitment:* Values are structured like lexicographic orderings: infinite stakes dominate, but finite differences register within "levels."  
  - **No, and finite differences are irrelevant** → *Diagnosis:* Incoherent—contradicts Branch 6 answer.  

  **Gloss:** *Non-Archimedean structures* allow comparisons where finite differences don’t "cancel out" infinite ones (e.g., infinitesimal × infinite is meaningful).  

  ---

  #### **Branch 8: Infinite Stakes in Gambles**  
  **Case:** Choose between:  
  - **A:** Certain gain of a small finite good (e.g., $1).  
  - **B:** A 1/googolplex chance to change infinitely many lives from suffering to bliss.  
  **Question:** Should you choose B?  
  - **Yes** → **Leaf: Infinite Stakes Dominate**  
    - *Awkward commitment:* Any probability of infinite good outweighs any finite good, however small the probability.  
  - **No** → **Leaf: Cautious Expected Value**  
    - *Awkward commitment:* Undefined or divergent expected value calculations paralyze action.  
  - **Undefined** → Merges with **Leaf: Convergence Undefined** (in practice).  

  **Gloss:** *Expected value* multiplies probability by outcome value. Non-finite magnitudes can cause divergence.  

  ---

  ### Scoring Sheet  
  | Answers → Leaf | Position Summary |  
  |----------------|------------------|  
  | Finitism | Ignore infinite parts; only finite comparisons matter. |  
  | Asymmetric Infinity Valuation | Magnitude (infinite welfare/life) and number (infinite lives) aren’t interchangeable. |  
  | Arrangement-Sensitive Aggregation | Temporal/structural order of lives affects value. |  
  | Convergence Undefined | Worlds with conditionally convergent well-being lack a total value. |  
  | Density-Prioritizing View | Limiting frequency > cardinality for evaluating populations. |  
  | Asymmetric Addition | Adding bad to good matters; adding good to bad does not (or vice versa). |  
  | Anti-Aggregativism | Adding lives to an infinite world changes nothing. |  
  | Incomparability in Finite Addition | Finite additions against infinite backgrounds are undefined. |  
  | Person-Affecting View | Changes must affect specific individuals to matter. |  
  | Non-Archimedean View | Finite differences register, but infinite ones dominate. |  
  | Infinite Stakes Dominate | Any chance of infinite good outweighs any finite good. |  
  | Cautious Expected Value | Undefined expectations paralyze decisions. |  

  ---

  ### Predictable Issues in a 60-Minute Session  
  1. **Misreading:** Branch 4 (Convergence) will confuse students unfamiliar with series convergence. Glosses help, but conditional convergence is subtle.  
  2. **Strategic Answering:** Students who dislike paralysis (e.g., Incomparability leaves) will avoid "No" at Branch 3 to bypass Branch 4.  
  3. **Missing Nuance:** The tree cannot reproduce how *expected value* disputes (Branch 8) intersect with density views (Branch 5). Discussion must clarify whether "density" applies to uncertain outcomes.  
  4. **Person-Affecting Ambiguity:** Branch 7’s "effects on individuals" may be misinterpreted as requiring *identifiable* individuals. Emphasize that "a life" need not be pre-specified.  
  5. **Gamble Oversimplification:** Branch 8’s case ignores Pascalian dilemmas where probabilities are endogenous. A supplement on decision-theoretic handles (e.g., causal finitism) will be needed.  

  **Word Count:** ~1,150 (tree, glosses, scoring, issues).
