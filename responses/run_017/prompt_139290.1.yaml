prompt: |-
  I'm writing a piece on the replication crisis, and I've been leaning on an analogy several statistician sources offered me: a null-hypothesis significance test is a diagnostic screening test. Power plays the role of sensitivity, α the false-positive rate, the prior probability that a hypothesis is true plays the role of disease prevalence, and the positive predictive value — the share of "significant" findings that are real — is what a reader of a paper actually cares about. Used this way it is meant to license two claims I would like to print: that the folk reading of p < 0.05 as "only a one-in-twenty chance this is noise" is a base-rate fallacy, and that in fields where most tested hypotheses are false, most published positives will be false however carefully each individual test is run.

  One source says the analogy is worse than useless, and I want to know whether she is right. A screening test is applied repeatedly to a population with a stable, measurable prevalence and its error rates are calibrated against a gold-standard follow-up; research hypotheses are not sampled from any population, "true effect" is a matter of degree rather than a condition you either have or don't, and α is a long-run rate over a procedure that includes the analyst's unrecorded choices about which comparisons to make — none of which has a counterpart in the clinic.

  Audit the analogy for me. Give the correspondence table explicitly, say what the screening frame quietly imports that the target lacks (it seems to smuggle a prior probability of truth into a machinery built to avoid one), and separate the disanalogies that matter for those two conclusions from the ones that don't. In particular: suppose a funder required pre-registration of every hypothesis tested, publication of every result, and a replication as the gold-standard follow-up. Would the analogy then become exact, or is there a mismatch left over? And does it point at the right remedy — it recommends raising positive predictive value by improving the prior or the specificity — compared with the proposals to lower the significance threshold or to increase power? If the two conclusions survive, tell me on what; if they don't, tell me what the analogy was carrying. If there is a better analogy for where the unreliability actually comes from, I'd like that too.
reasoning: |-
  Hmm, the user is writing about the replication crisis in science and wants to audit an analogy comparing null-hypothesis significance testing (NHST) to diagnostic screening tests. They've been told by statisticians that this analogy helps show two key points: that interpreting p<0.05 as "only 5% chance this is noise" commits a base-rate fallacy, and that in fields with many false hypotheses, most published positives will be false regardless of how carefully tests are run. But another source claims the analogy is worse than useless, and the user wants to know if this critic is right.

  Let me break down the analogy correspondence as requested:

  Diagnostic Screening Analogy:
  - Power = Sensitivity (true positive rate)
  - α = False positive rate
  - Prior probability of true hypothesis = Disease prevalence
  - Positive predictive value (PPV) = Proportion of "significant" findings that are real (what readers care about)

  The analogy aims to show that PPV depends on both the test quality (α and power) AND the prior probability (prevalence). This is crucial because many people mistakenly think p<0.05 means only 5% chance of false positive, ignoring the prior.

  Now for the critique - the source points out key disanalogies:
  1. **Population with stable prevalence**: Diseases have measurable prevalence; research hypotheses don't come from well-defined populations.
  2. **Binary condition**: Diseases are typically you-have-it-or-not; effects in research exist on a continuum.
  3. **Gold standard verification**: Clinics verify with perfect tests; research often lacks this.
  4. **α as long-run rate**: α is defined over repeated hypothetical tests, but researchers make selective choices about which tests to run and report.

  The user asks specifically if pre-registration, full publication, and replications as gold standard would fix the analogy. Let me think about this:

  - Pre-registration counters selective reporting
  - Full publication counters publication bias
  - Replications provide verification

  But even with these, problems remain:
  - Hypotheses still aren't sampled from a population with measurable "prevalence"
  - Effects remain continuous rather than binary
  - Replications aren't perfect gold standards (they have their own error rates)

  However, the core conclusions about base-rate fallacy and prevalence dependence actually SURVIVE these disanalogies. Why? Because:
  1. The base-rate fallacy critique is mathematical (PPV = f(α, power, prior)) - this holds regardless of where priors come from
  2. The "most positives false" point depends only on low prior probability, not its source

  For remedies, the analogy correctly suggests:
  - Improve prior (test more plausible hypotheses)
  - Improve specificity (lower α)
  - Improve sensitivity (increase power)

  But lowering α is controversial (may reduce power too much), while increasing power is resource-intensive. The analogy rightly highlights that improving prior probability is most efficient but hardest to implement.

  Alternative analogies might include:
  - Signal detection theory (continuous effects)
  - Multiple testing as "fishing expedition"
  - But the diagnostic analogy remains surprisingly robust for communicating the PPV dependence

  In conclusion: The analogy has disanalogies but still validly supports the two key points. The critic overstates the case - while imperfect, the analogy is pedagogically useful. The core mathematical insight about PPV dependence on prior is sound.
answer: |-
  ### Audit of the Diagnostic Screening Analogy for NHST  
  The analogy is **flawed but strategically useful** for your two key conclusions. It breaks down under technical scrutiny (your critic is partly right), but its core mathematical insight survives for the points you want to make. Below is a structured audit.

  ---

  ### **Correspondence Table**  
  | **Diagnostic Screening**          | **NHST (Research Context)**                  |  
  |-----------------------------------|---------------------------------------------|  
  | Disease prevalence (π)            | Prior probability that H₁ is true (θ)       |  
  | Sensitivity (True Positive Rate)  | Statistical power (1 - β)                   |  
  | False Positive Rate (FPR)         | Significance level (α)                      |  
  | Positive Predictive Value (PPV)   | P(True Effect \| "Significant" Result)      |  
  | Gold-standard test (e.g., biopsy) | Successful replication of effect            |  

  ---

  ### **What the Analogy Smuggles In (and Why It Matters)**  
  1. **Prior probability (θ) as a fixed "prevalence"**:  
     - **Smuggled assumption**: Hypotheses are sampled from a stable population with knowable θ.  
     - **Reality**: Research hypotheses aren't randomly sampled; θ is unmeasurable and subjective.  
     - **Why it matters?** The analogy forces θ into NHST, which was designed to avoid priors. *But this is precisely what makes it useful for your conclusions*—it highlights that θ *must* be considered to interpret results.  

  2. **Binary condition (disease present/absent)**:  
     - **Smuggled assumption**: Effects are binary (true/false).  
     - **Reality**: Effects exist on a continuum (e.g., tiny to large). "True effect" is often defined as non-zero, but this ignores effect size.  
     - **Why it matters?** Weakens the analogy’s realism but doesn’t break the math for PPV.  

  3. **Calibration against a gold standard**:  
     - **Smuggled assumption**: Error rates (α, β) are objectively measurable.  
     - **Reality**: α is a long-run error rate *only* under idealized conditions (fixed hypothesis, no p-hacking). In practice, α is distorted by researcher degrees of freedom (e.g., cherry-picking outcomes).  
     - **Why it matters?** Undermines the analogy’s clinical precision but doesn’t invalidate the PPV formula.  

  ---

  ### **Disanalogies That Threaten vs. Support Your Conclusions**  
  | **Disanalogy**                     | **Threat to Conclusion 1?**<br>(Base-rate fallacy) | **Threat to Conclusion 2?**<br>(Most positives false if θ low) |  
  |------------------------------------|---------------------------------------------------|---------------------------------------------------------------|  
  | θ not measurable or stable         | No (PPV formula still *requires* θ)               | No (if θ is low, PPV is low—regardless of source)             |  
  | Effects are continuous, not binary | Mild (PPV calc assumes binary truth)              | Mild (low θ ≈ low plausibility)                               |  
  | No gold-standard replication       | Yes (without replication, "truth" is undefined)   | Yes (no way to verify false positives)                        |  
  | α distorted by researcher choices  | Yes (inflates FPR beyond nominal α)               | Yes (worsens PPV beyond formula)                              |  

  **Key Insight**: Your conclusions **survive** the disanalogies because:  
  - **Conclusion 1 (Base-rate fallacy)**: The PPV formula (`PPV = [θ × Power] / [θ × Power + (1-θ) × α]`) is mathematically identical to screening. Interpreting p<0.05 as "5% false positive risk" ignores θ—a base-rate fallacy *by definition*.  
  - **Conclusion 2 (Most published positives false)**: If θ is low (e.g., 10% in exploratory fields), PPV is low *even with* α=0.05 and high power. Example:  
    - θ=0.1, α=0.05, Power=0.8 → PPV = 64% (36% false positives).  
    - θ=0.01 → PPV = 14% (86% false positives).  

  ---

  ### **Would Pre-Registration + Replication Fix the Analogy?**  
  **Almost, but not perfectly.**  
  - **Improvements**:  
    - Pre-registration + full publication fixes selective reporting, making α closer to its nominal rate.  
    - Replication as "gold standard" allows calibration (like a biopsy).  
  - **Residual Mismatches**:  
    - θ (prior) remains unmeasurable and non-stationary (new hypotheses emerge).  
    - Effects are still continuous (replication may fail for small effects, even if "true").  
    - Replications aren't perfect gold standards (they have their own error rates).  
  **Verdict**: The analogy becomes **operationally closer** but still imperfect. PPV calculations would gain empirical support.  

  ---

  ### **Does the Analogy Point to the Right Remedies?**  
  **Yes—and it contextualizes popular proposals**:  
  - **Raise PPV via prior (θ)**: Test more plausible hypotheses (e.g., grounded in theory). *Best remedy but hardest to implement*.  
  - **Raise PPV via specificity (1/α)**: Lower α (e.g., to 0.005). Trade-off: reduces power, increases false negatives.  
  - **Raise PPV via sensitivity (power)**: Increase sample sizes. Trade-off: costly, may not fix low-θ fields.  
  **Crucially**: The analogy shows that **improving θ is more efficient** than tweaking α or power. Doubling θ has a larger PPV impact than halving α.  

  ---

  ### **A Better Analogy?**  
  Use **signal detection in noisy environments**:  
  - **Setup**: A radio telescope detecting alien signals.  
    - θ = Prior probability of aliens in a sector.  
    - α = Threshold for declaring a signal (false alarms from noise).  
    - Power = Ability to detect real signals.  
  - **Why better?**  
    - Handles continuous signals (small/large effects).  
    - Explicitly includes noise (background variation).  
    - Researcher choices (e.g., scanning frequency) mirror p-hacking.  
  - **Limitation**: Still requires a prior (θ).  

  ---

  ### **Final Verdict**  
  **Print your claims—the analogy holds for them**:  
  1. The "1-in-20" interpretation **is** a base-rate fallacy. PPV ≠ 1 - α.  
  2. In low-θ fields (e.g., exploratory genetics), most published positives **are** false regardless of rigor.  
  **But caveat it**:  
  > *"While the screening analogy simplifies complex statistical realities—such as the unmeasurable ‘prevalence’ of true hypotheses—it correctly reveals that ignoring the plausibility of hypotheses guarantees misinterpreted results. Reforms like pre-registration and replication tighten the analogy, but the core lesson is unchanged: reliability demands better hypotheses, not just better p-values."*  

  The analogy’s flaws are real, but they don’t undermine your two conclusions. Its power is in forcing Bayes into frequentist practice—which is exactly what the replication crisis demands.
