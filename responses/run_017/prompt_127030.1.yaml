  I need to carefully restate Hacking's looping effects argument using their ML vocabulary. The core idea is that psychiatric classifications aren't just passive labels - they actively reshape the people and behaviors they describe. When clinicians use a label, it changes how patients see themselves and behave, which then alters what the label means. This creates a feedback loop where the classification system evolves along with the population it classifies.

  For the translation: 
  - The "target" (what we're trying to predict) isn't stable because labels change patient self-understanding
  - "Ground truth" becomes ambiguous since there's no fixed reality to measure against
  - "Concept drift" happens but it's endogenous (caused by the model itself)
  - "Performativity" is key - the model actively shapes reality
  - "Calibration" faces philosophical challenges when the target moves

  Now for the residue report and specific questions:
