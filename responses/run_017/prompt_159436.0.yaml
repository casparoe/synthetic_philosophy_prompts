prompt: |-
  Hey — I need a teaching plan, not an explanation of Smith himself (I've read the chapters, I don't need them summarized). I'm running a fifty-minute discussion section next week for first-years in an intro ethics course. They've just come out of Mill and then Kant's formula of universal law, and the reading is a couple of chapters from Smith's Theory of Moral Sentiments on sympathy and the impartial spectator. I ran this section last year and it went badly: everyone walked out convinced Smith was basically a vaguer, kinder rule-utilitarian with a bit of interior monologue bolted on, one student said "so the impartial spectator is just your conscience" and I flubbed the answer, and by the end the only thing that had landed was that Smith is the capitalism guy. So: what has to come first and what depends on what — I'm guessing that sympathy as imaginative projection of someone's *situation* (rather than catching their feeling) has to be in place before propriety, and propriety before the spectator, and that the bit about general rules has to come *after* the spectator rather than before, but I'm not confident about the order or about what to leave for last.

  Two things I want built in, and I want you to tell me if either is a mistake. First, I want to teach the spectator as the destination of a loop rather than as a little person in your head: you notice you're partial, you imagine a well-informed bystander, you notice that you've rigged *that* bystander in your favour too, you imagine someone watching him, and the impartial spectator is what the sequence settles toward — the thing the recursion converges on. I like it because it explains why the spectator isn't just "what my actual peers think" without me having to dodge the relativism objection with a hand-wave, but I don't know where the framing breaks or whether it smuggles in something Smith doesn't want. Second, the hard bit as I see it is that Smith's question is about whether a passion is *proportionate* to what provoked it — the volume of the sentiment, not the rightness of the act — and I need one metaphor to carry that. I've been toying with photographic exposure versus a volume knob versus tuning an instrument; tell me which one to build the section around, what that metaphor has to have and what it must not have (I worry exposure implies a single correct setting and the knob implies more is just more), and give me the one concrete case to hang it on. I was thinking of something where the action isn't clearly wrong — someone getting visibly, disproportionately angry at a friend who turned up forty minutes late, at a table where everyone else is laughing it off — but say if a case about *resentment at a slight* is the wrong choice, and why.

  Then the misconception map, with a place in the sequence for each: the spectator as conscience; the spectator as Kant re-labelled or as Mill's impartial benevolent spectator, given that they've just had both and that all three words start with "impartial"; sympathy read as empathy or as pity/benevolence; the collapse into "morality is just what the people around you would think"; and whatever they'll form from the metaphor I use. Also: should I raise at all, at this level, whether the spectator is merely a well-informed ordinary person or something more idealized — and if not, what should I openly refuse to explain and say out loud that I'm refusing? Finally, a check: one question or task I can put to them in the last five minutes that would show they've got the structure rather than just being agreeable or just uncomfortable — ideally something that separates the spectator from the average opinion of their friends and from a rule, and something that would let me tell the difference between a student who understands it and one who has only learned to say "it depends on propriety". I'm not asking for extra readings, just the arc.
reasoning: |-
  Okay, the user is a teaching assistant preparing for a 50-minute discussion section on Adam Smith's Theory of Moral Sentiments for first-year intro ethics students. They've had issues in the past where students misunderstood Smith as a vague rule-utilitarian or reduced the impartial spectator to "conscience." The user wants a clear teaching plan that structures key concepts correctly: sympathy as situational projection, propriety, then the impartial spectator as an emergent concept from a recursive process. They also want to address common misconceptions and include a specific metaphor for proportionality of passions.

  First, I need to ensure the sequence of concepts is solid. The user mentioned that sympathy must come before propriety and propriety before the spectator, with general rules after. That makes sense because sympathy (imaginative projection) is the foundation for judging propriety (appropriate emotional response), which then leads to constructing the impartial spectator through iteration. General rules are derived from repeated applications of the spectator, so they should come last.

  The user's two main requests: teaching the spectator as a convergent loop and choosing a metaphor for proportionality. The loop idea is strong—it shows how partiality is corrected step-by-step, avoiding the "conscience" simplification. The recursive process addresses relativism by showing the spectator isn't just current social norms. I should confirm that Smith does describe a process of adjusting perspectives, though the exact recursive framing is a modern interpretation. But it's pedagogically useful and textually defensible.

  For the metaphor, the user suggested exposure, volume knob, or instrument tuning. Volume knob is problematic because it implies more intensity is just louder, not appropriate. Exposure has a "correct" setting, which might oversimplify. Instrument tuning is best—it captures harmony, context-dependence, and calibration. A guitar string must be tuned to other strings and the piece being played, similar to how emotions must fit the situation and social context. The case study of disproportionate anger at a friend's lateness is perfect. It's relatable, the action isn't inherently wrong, but the emotional volume is off, highlighting propriety over moral rightness.

  Misconceptions to address: spectator as conscience (emphasize it's constructed, not innate), Kant/Mill comparisons (contrast their universal rules vs. Smith's situated judgments), sympathy as empathy (stress situational projection), and collapsing into social relativism (use the loop to show it's idealized). The user should explicitly defer whether the spectator is ordinary or idealized—mention it's debated but beyond the scope, focusing on the mechanism instead.

  For the final check, a scenario where the spectator diverges from friends' opinions or rules. The lateness case works: ask what an impartial spectator would say versus the laughing friends. Or add a new scenario, like resentment over a minor slight. The key is to see if students distinguish proportionality from rule-following and social approval.

  Timing is tight. Allocate 5 min for sympathy, 10 for propriety with the metaphor, 20 for the spectator loop, 7 for misconceptions, 5 for the closing task, and 3 buffer. Start with defining sympathy through an example, then propriety with the tuning metaphor and lateness case. Build the spectator step-by-step, using recursion to show convergence. Preempt misconceptions by contrasting Kant/Mill and addressing conscience early. End with the scenario to test understanding.

  The user's deeper needs: avoiding past mistakes, ensuring structural comprehension over summaries, and fostering critical engagement. They want students to grasp Smith's unique approach to moral psychology without conflating it with other theories. The plan must clarify dependencies between concepts and provide clear, memorable hooks (like the tuning metaphor) to make abstract ideas tangible. Also, the user needs confidence to handle misconceptions on the spot, so equipping them with specific contrasts and deferral strategies is key.
answer: |-
  Here’s a battle-tested 50-minute plan prioritizing conceptual dependencies, preempting misconceptions, and anchoring your key insights. The goal is **structural clarity**—how Smith’s pieces lock together—not exegesis. Sequence is critical:

  ---

  ### **The Arc: 50-Minute Breakdown**  
  *(Total: 5 min setup + 40 min core + 5 min check)*  

  1.  **Hook & Sympathy Redefined (5 min)**  
      - **Start with a visceral case:** *"Your friend snaps at a waiter who spills water. You wince. Why?"*  
      - **Q to class:** *"Is your discomfort about the waiter’s feelings? Your friend’s anger? Something else?"*  
      - **Pivot to Smith:** Clarify **sympathy ≠ empathy/pity/benevolence**. It’s **projection into the *situation***: *"We imagine ourselves in the *circumstances* that provoked the feeling. Do those circumstances *warrant* that intensity of feeling?"*  
      - **Crucial Contrast:** "Empathy mirrors *their* feeling. Smithian sympathy asks: *‘Would I, in their shoes, feel this *strongly*?’*"  

  2.  **Propriety & The Proportionality Metaphor (10 min)**  
      - **Introduce Propriety:** "Smith’s core question: Is the passion **proportionate** to its cause? Not ‘Is the *action* right?’ but ‘Is the *sentiment* fitting?’"  
      - **Your Metaphor: USE INSTRUMENT TUNING.**  
        - **Why it works:** Tuning requires context (key, other instruments), allows for variation (no single "correct" note, only "in tune" relative to harmony), and captures *calibration*.  
        - **Why not exposure/volume:** Exposure implies one "correct" setting; volume implies linearity (louder=stronger). Tuning captures relational appropriateness.  
        - **Apply to the case:** *"Your friend is furious after a 40-min wait. The table laughs it off. Smith isn’t asking if lateness is wrong. He’s asking: Is their anger *in tune* with the offense? Is it sharp/flat relative to what a *well-informed observer* would expect? The table’s laughter suggests it’s *shrill*—out of tune with the social context."*  
      - **Misconception Preempted:** "This isn't utilitarianism. We're not calculating consequences or rules. We're calibrating emotional *responses*."  

  3.  **Building the Impartial Spectator: The Convergent Loop (20 min)**  
      - **Start with Partiality:** "We *try* to judge our friend's anger impartially... but we love them! Our view is skewed."  
      - **The Iterative Loop (Your Frame - USE THIS):**  
        1. I imagine a bystander who knows all the facts (*Step 1 Spectator*).  
        2. I realize *my* bias shaped that bystander – he’s too lenient! (*Partiality detected*).  
        3. I imagine a spectator *judging my first spectator* ("Is *he* being fair?").  
        4. Repeat. Each iteration corrects bias.  
        5. **Convergence:** "The Impartial Spectator isn’t a ‘little person’ we find. It’s the **stable point** this process *approaches*—the viewpoint where no further correction for bias is needed."  
      - **Why this works:** Avoids "conscience" (it’s constructed, not innate) and relativism (it transcends *my* peers via iteration).  
      - **Contrast:** "Kant’s FUL is a *test* using abstract reason. Mill’s spectator is *benevolent*, calculating happiness. Smith’s spectator *calibrates sentiments* via imaginative projection and recursive correction."  
      - **Text Anchor:** Briefly reference TMS passages showing the *struggle* for impartiality (e.g., III.1.2 on dividing ourselves).  

  4.  **General Rules: The Output, Not the Input (5 min)**  
      - **Placeholder:** "After *many* experiences seeing what sentiments the Impartial Spectator approves/disapproves, we **derive** general rules ('Don't get *that* angry over minor slights')."  
      - **Key Point:** "Rules are shorthand *results* of spectator judgments, not the *foundation* (like Kant) or the *goal* (like Utilitarianism)."  
      - **Misconception Preempted:** "Smith isn't rule-utilitarian. Rules are descriptive heuristics, not prescriptive axioms."  

  5.  **Misconception Takedown & Strategic Sidestep (7 min)**  
      - **Rapid-Fire Contrasts:**  
        - **"Conscience?"** "No. Conscience is static/internal. The Spectator is *built* iteratively to correct bias."  
        - **"Kant/Mill Redux?"** "Kant = Universal Reason. Mill = Impartial Happiness Calculator. Smith = Impartial Sentiment Tuner."  
        - **"Just my peers?"** "The loop *transcends* current peers by recursively stripping bias. It’s idealized convergence."  
        - **"Sympathy = Pity/Empathy?"** Reiterate Step 1: **Projection into situation, not feeling-sharing.**  
      - **The Strategic Sidestep:**  
        - **Q:** "Is the Spectator just a well-informed person, or an ideal?"  
        - **Your Answer:** "Smith is ambiguous, and scholars debate this. **For today, focus on the *process*:** the iterative correction *towards* impartiality is what matters. We'll leave the metaphysics for later courses." (Say this *explicitly*).  

  6.  **Check for Understanding: The Acid Test (5 min)**  
      - **Scenario:** *"Alex resents Sam deeply for a minor, accidental social snub weeks ago. Alex's friends say 'Get over it, it was nothing!' Alex *knows* it was minor but still feels burning resentment."*  
      - **Task:** *"In Smithian terms: (1) Is Alex’s resentment *proper*? Why/why not? (2) How would Alex’s Impartial Spectator (reached via the loop) likely view it? (3) Would following a rule ('Don’t hold grudges') or friends' advice ('Get over it') be the same as the Spectator’s view? Why/why not?"*  
      - **Why this works:**  
        - Tests proportionality *(Volume of resentment vs. minor snub)*.  
        - Separates Spectator from actual peers *(Friends dismiss it; Spectator understands the feeling but sees disproportion)*.  
        - Separates Spectator from rules *(Rule is crude; Spectator assesses *this* resentment in *this* context)*.  
        - Flags shallow "propriety" answers: A student who *only* says "It depends on propriety" falters. Strong answers reference proportionality, the loop, and *contrast* with peers/rules.  

  ---

  ### **Why This Sequence & Frame Works**
  - **Dependencies Honored:** Sympathy (situational) → Propriety (calibration) → Spectator (iterative correction) → Rules (derived output).  
  - **Your Loop Frame:** Textually defensible (Smith *does* describe a process of self-division/correction) and solves the conscience/relativism issues.  
  - **Metaphor Choice:** Tuning is optimal. It implies relational fit, not binary right/wrong or linear intensity. The "lateness anger" case is perfect—*action* (waiting) isn't wrong, *sentiment* (anger volume) is disproportionate.  
  - **Misconceptions Targeted Proactively:** Each contrast is timed *when* the misconception is likely to form.  
  - **The Sidestep:** Necessary for intro level. Declaring it manages expectations.  
  - **The Check:** Forces application of structure, not just labels. Listen for:  
    - **Surface:** "Resentment is disproportionate."  
    - **Structure:** "The Spectator (via loop) would see the *cause* as minor but *understand* the feeling exists; it wouldn’t match the friends' dismissal because it's informed/iterative, nor a rule because it’s contextual."  

  **Final Tip:** Drill the tuning metaphor & loop process in your intro. Repetition is key. When a misconception arises, smile: "Ah! That’s exactly why we need the loop/tuning distinction!" and re-anchor. Good luck – this structure is tight!
