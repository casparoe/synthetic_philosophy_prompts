answer: |-
  **CALL FOR PROPOSALS: CASR-24-078**
  **Causal Linkages Between Foundational Cultural Values and Macroeconomic Phenomena (CLFV-MEP)**
  **Five-Year Research Award - Up to £2.5m**

  **Issued by:** The Council for the Advancement of Socioeconomic Research (CASR)
  **Publication Date:** 1st October 2024
  **Deadline for Intent to Submit:** 15th November 2024
  **Full Proposal Deadline:** 15th January 2025
  **Award Start Date:** 1st October 2025

  **1. Introduction and Purpose**
  CASR seeks to fund a single, landmark five-year study establishing, with robust empirical and theoretical rigour, that a specific, identifiable cultural value is a *genuine causal factor* in generating a significant, measurable macroeconomic outcome. The persistent, yet largely anecdotal or theoretically inferred, role attributed to culture in economic phenomena necessitates rigorous causal validation. This award aims to elevate the discourse beyond correlation and elective affinity, demanding definitive proof of causal direction and mechanism. Proposals must transcend merely suggestive historical parallels or residual explanations. The successful project will provide an irrefutable model for future causal attribution in socioeconomics.

  **2. Eligibility Criteria**
  Proposals must meet *all* of the following criteria to be considered eligible:

  *   **2.1 Principal Investigator (PI):** Must hold a tenured or equivalent permanent position at an accredited HEI or research institute. Demonstrated expertise in *both* advanced econometric methods *and* deep cultural analysis (e.g., anthropology, historical sociology, cultural studies) is essential. Co-PIs strongly encouraged.
  *   **2.2 Cultural Value Definition:** The proposed cultural value must be:
      *   **2.2.1:** Clearly defined and operationalised as a measurable construct.
      *   **2.2.2:** Demonstrably distinct from the macroeconomic outcome it is purported to cause. (e.g., Proposing that "high savings rates" *are* the cultural value causing "high national savings" is inadmissible).
      *   **2.2.3:** Measured *independently* of the specific practices or institutions it is hypothesized to influence. *Measurement cannot rely on inferring the value from the very behaviours it is supposed to motivate.* (e.g., Inferring a "work ethic" value from observed long working hours is methodologically circular and insufficient).
  *   **2.3 Causal Mechanism:** The proposal must articulate and rigorously test a specific, falsifiable causal pathway demonstrating *how* the identified cultural value directly generates the proposed macroeconomic outcome. Proposals resting solely on demonstrated correlation, historical coincidence, or plausible *elective affinity* will be deemed insufficient. The mechanism must show the value *acting upon* the economy, not merely reflecting it.
  *   **2.4 Exclusion of Residual Explanations:** The proposed cultural value must *not* function primarily as an explanation for variance left unexplained by established economic models (e.g., standard growth models, institutional economics frameworks). Proposals must demonstrate that the cultural value explains variance *beyond* that captured by conventional economic variables and institutions. (See **Footnote 1**).
  *   **2.5 Institutional Transmission & Reflexivity:** The proposal must convincingly address the challenge that cultural values are transmitted and reinforced *through* social institutions (family, education, religion, media), and that these institutions themselves are often shaped, funded, or transformed *by* the very macroeconomic outcomes the cultural value is purported to cause. The proposed causal mechanism must be robust to this bidirectional relationship, demonstrating the *primacy* and *persistence* of the cultural value as an independent driver, even as institutions evolve in response to economic conditions. Proposals must include a dedicated research component explicitly modelling and testing for this institutional reflexivity.
  *   **2.6 Macroeconomic Outcome:** Must be a well-defined, quantifiable national or large regional macroeconomic indicator (e.g., GDP growth trajectory, investment ratio, productivity trend, innovation rate, income inequality metric) over a significant historical or contemporary period (minimum 20 years).

  **Footnote 1:** CASR acknowledges that a significant proportion of influential historical scholarship in this domain (e.g., concerning the role of ascetic religiosity in early capitalism) has implicitly or explicitly positioned cultural factors as explaining the Residual Unexplained Variance (RUV) within prevailing economic or institutional models of the time. While historically valuable, this approach is insufficient for establishing *causal primacy* according to contemporary methodological standards required by this call. Proposals must proactively engage with and rule out RUV explanations.

  **3. Evaluation Rubric**
  Proposals will be scored (1-10) by an independent expert panel on the following criteria:

  *   **3.1 Theoretical Rigour & Conceptual Clarity (30%):** Precision in defining the cultural value and outcome; sophistication in articulating the causal mechanism; grounding in relevant social theory; explicit address of elective affinity vs. causation; thorough engagement with reflexivity (Criterion 2.5).
  *   **3.2 Methodological Innovation & Feasibility (40%):** Appropriateness and novelty of proposed methods for *independent* measurement of the cultural value; robustness of the causal identification strategy (e.g., natural experiments, instrumental variables, rigorous comparative designs, advanced longitudinal modelling); feasibility of data collection (including historical/archival if needed); rigorous plan for addressing institutional reflexivity and RUV.
  *   **3.3 Significance & Impact (20%):** Potential of findings to transform understanding of cultural drivers in economics; relevance to contemporary policy debates; contribution to methodological advancement in causal cultural analysis.
  *   **3.4 Team Expertise & Resources (10%):** Demonstrated capacity of the team to execute the complex interdisciplinary research; access to necessary data and facilities; project management plan.

  **4. Eligible Costs**
  Funding may be requested for:
  *   Staff costs (PIs, Co-Is, postdocs, PhD students, research assistants).
  *   Direct research expenses (data acquisition/cleaning, specialised software, archival access, fieldwork, surveys).
  *   Travel and subsistence essential to the research.
  *   Dissemination costs (open access fees, conference travel directly related to project findings).
  *   Indirect/overhead costs (capped at 25% of direct costs).

  *Ineligible:* Equipment over £50k (unless exceptionally justified), PI buy-out from teaching, routine institutional overheads beyond the capped rate.

  **5. Submission Requirements**
  *   Intent to Submit (mandatory): CASR Portal Form CASR-ITS-078 (max 1 page: PI details, provisional title, brief synopsis).
  *   Full Proposal: CASR Portal Form CASR-FP-078, including:
      *   Abstract (300 words)
      *   Case for Support (8 pages max): Addressing all criteria in Sections 2 & 3.
      *   Detailed Methodology (5 pages max)
      *   Data Management Plan (2 pages max)
      *   CVs for Key Personnel (2 pages each)
      *   Justification of Resources
      *   Letters of Collaboration (if applicable)
      *   Gantt Chart

  **6. Post-Award Expectations**
  The awardee will submit annual progress reports, a comprehensive mid-term review report at 30 months, and a final report including all datasets, code, and publications within 6 months of project end. Findings must be disseminated through high-impact peer-reviewed journals and a dedicated policy briefing for CASR.

  **7. Note on Previous Round (CASR-19-042)**
  The inaugural CLFV-MEP call (CASR-19-042) regrettably resulted in no fundable awards. While several proposals demonstrated considerable ambition, the international peer review panel unanimously concluded that all submissions exhibited critical methodological shortcomings, primarily failing to adequately meet Criteria 2.2.3 (Independent Measurement), 2.4 (Exclusion of RUV), and particularly 2.5 (Addressing Institutional Reflexivity). The robustness of the causal claims was consistently undermined by these factors. The panel noted a tendency amongst applicants to rely on proxies for cultural values that were insufficiently disentangled from economic practices or institutional structures, or to posit values that functioned effectively as post-hoc RUV explanations.

  **8. Future Directions**
  Recognising the persistent methodological challenges identified in CASR-19-042 and reaffirmed by the stringent requirements of this call (CASR-24-078), CASR anticipates that a successful proof-of-concept may require greater initial specification. Consequently, should CASR-24-078 also fail to yield a fundable proposal meeting *all* criteria, CASR will initiate a follow-up programme (CLFV-MEP Phase II). In Phase II, the expert panel, informed by the limitations observed in previous applications, *will itself nominate a specific, narrowly defined cultural value and associated macroeconomic outcome* deemed most tractable for establishing definitive causality under these rigorous parameters. Researchers will then be invited to submit proposals focused *exclusively* on demonstrating the causal link for the pre-specified value-outcome pair.

  **Contact:** Dr. A. Bureaucrat, Programme Manager, clfv-mep@casr.ac.uk (Responses may take 10 working days)
