  Considering if they work together - they actually complement each other well. One deals with what gets preserved in theory change (components), while the other questions whether we're even counting properly. A realist could reasonably use both. But I need to be careful about the user's concern that Reply 1 might admit all past theories were false - it concedes they were false as whole packages but salvages their successful parts, which is different from total falsity.

  Regarding "proving too much" - this is a smart concern. Both replies could potentially be misused by pseudosciences if not properly qualified. The key difference is that scientific components survive because they keep doing explanatory work in new contexts, whereas pseudosciences don't have such track records. I'll need to emphasize this distinction.

