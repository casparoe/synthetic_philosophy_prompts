  Okay, let me break this down carefully. The user is a TA designing a decision theory exam question to probe deep understanding of Good's theorem, specifically targeting students who can parrot rationalist slogans without grasping the underlying mechanics. 

  First, I need to isolate the core challenge: creating a scenario where information hurts despite being free, violating Good's theorem's premises. The key is designing a case that breaks multiple assumptions simultaneously - leakiness (third-party observation), act-erosion (removing "plead ignorance" option), and fixed-rule updating (inflexible decision threshold). 

  Hmm... the most elegant scenario would involve:
  - A security checkpoint where consulting a threat detector alerts adversaries if used (leaky)
  - Where seeing "no threat" forces you to approve entry (act-erosion)
  - With a mandatory "approve if P(threat)<0.3" rule (fixed-rule)
  ...thus creating a situation where ignorance preserves the valuable option to randomly deny entry.

  For the exam structure, I'll:
  1. Present definitions upfront to prevent definitional debates
  2. Build the scenario with exact probabilities to enable calculation
  3. Require explicit comparison of EU(consult) vs EU(not consult)
  4. Demand identification of which premise fails and why "ignore" isn't feasible
  5. Push for meta-reflection on the theorem's normative status

  The model answer must demonstrate:
  - Correct EU calculations showing harm (20% worse in my draft)
  - Triple violation: leakiness breaks independence, act-erosion shrinks choice set, fixed-rule prevents re-optimization
  - Clear statement that "ignore" is physically impossible here
  - Insight that the theorem remains useful as a benchmark for ideal cases

  Common pitfalls to anticipate:
  - Confusing ex ante/ex post valuations
  - Missing that leakiness makes "consult/not consult" the actual decision node
  - Overlooking how act-erosion removes dominated strategies
  - Concluding the theorem is useless rather than context-dependent

  The marking scheme should heavily weight the precise breakdown of why each assumption fails in the scenario (6 marks total) and the normative analysis (4 marks), as these separate mechanistic from conceptual understanding. Top answers will note that the theorem still defines what "rational" means when its preconditions hold.
answer: |-
  ### Exam Question: Decision Theory Final (90 Minutes | ~1200 Words)

  ---

  **Instructions:** Answer all parts concisely and rigorously. Define all technical terms upon first use. Show expected utility (EU) calculations where relevant.  

  #### Definitions (Provided for Reference):  
  1.  **Leaky Information Source:** Consulting the source is observable by a third party, who may alter their behavior based solely on whether consultation occurred (not the signal’s content).  
  2.  **Act-Eroding Information Source:** Receiving the signal removes at least one act from your feasible set (e.g., the ability to credibly claim ignorance).  
  3.  **Fixed-Rule Updater:** An agent who updates beliefs via Bayesian conditioning but applies a fixed decision rule (e.g., "Act iff posterior probability > 0.7") without re-optimizing acts message-by-message.  
  4.  **Good’s Theorem:** For a Bayesian expected-utility maximizer, the expected value of free information (before observing the signal) is non-negative.  

  #### Scenario: The Border Checkpoint  
  You are a security officer deciding whether to admit a traveler.  
  - **State of World:** With prior probability \( P(H) = 0.4 \), the traveler is a **threat** (\( H \)); with \( P(\neg H) = 0.6 \), they are **safe** (\( \neg H \)).  
  - **Acts:** You may **ADMIT** or **DENY** entry. Payoffs:  
    - ADMIT safe traveler: +100  
    - DENY safe traveler: -10 (unfair rejection)  
    - ADMIT threat: -1000 (catastrophe)  
    - DENY threat: 0 (neutral precaution)  
  - **Information Source:** A free AI scanner. It outputs a binary signal \( S \) with accuracy \( P(S = H | H) = 0.9 \), \( P(S = \neg H | \neg H) = 0.8 \).  
  - **Leakiness:** If you consult the scanner, a corrupt insider observes this and alerts the traveler. If the traveler is a threat, they will disguise themselves (reducing scanner accuracy to 0 for threats). Safe travelers behave normally.  
  - **Act-Erosion:** If you consult the scanner and receive \( S = \neg H \), protocol forces you to ADMIT (you cannot DENY). If you consult and get \( S = H \), you may freely choose.  
  - **Fixed-Rule:** Agency policy requires you to ADMIT iff your posterior \( P(H | \text{evidence}) \leq 0.3 \).  
  - **Choice:** Before seeing the traveler, you decide whether to **CONSULT** the scanner or **NOT CONSULT**.  

  #### Tasks:  
  1.  **Proof Sketch** (4 pts):  
      State Good’s theorem formally and sketch the standard "just ignore the information" proof (3–4 lines).  
  2.  **Counterexample Analysis** (10 pts):  
      (a) Calculate the ex ante expected utility of **CONSULT** and **NOT CONSULT**. Show that **CONSULT** yields strictly lower EU.  
      (b) Identify which premise(s) of Good’s theorem (implicit in your proof sketch) are violated. Explain using the definitions.  
      (c) Why can’t you "ignore the signal" after consulting? Address act-erosion explicitly.  
  3.  **Normative Evaluation** (6 pts):  
      Does this counterexample undermine Good’s theorem’s normative value? Or is the theorem still a useful guide for rational agents? Defend your view using the distinction between *structural rationality* (ideal EU-maximization) and *procedural constraints* (e.g., fixed rules, leaks).  

  ---

  ### Model Answer (Strong Student | 850 Words)  

  #### 1. Proof Sketch of Good’s Theorem  
  **Theorem:** For a Bayesian EU-maximizer, the expected value of a free, non-leaky, non-act-eroding signal is non-negative: \( \text{EU}(\text{consult}) \geq \text{EU}(\text{not consult}) \).  
  *Proof sketch:* Let \( A_0 \) be the optimal act given prior beliefs. After observing signal \( s \), the agent can still choose \( A_0 \). Since EU-maximization selects \( A_s \) such that \( \text{EU}(A_s | s) \geq \text{EU}(A_0 | s) \) for all \( s \), marginalizing over possible signals gives \( \text{EU}(\text{consult}) \geq \text{EU}(A_0) = \text{EU}(\text{not consult}) \). Ignoring the signal is always a feasible strategy. ■  

  #### 2. Counterexample Analysis  
  **(a) Expected Utility Calculations**  
  - **NOT CONSULT (Baseline):**  
    Optimal act: ADMIT if \( \text{EU}(\text{ADMIT}) > \text{EU}(\text{DENY}) \).  
    \( \text{EU}(\text{ADMIT}) = [P(H) \cdot (-1000)] + [P(\neg H) \cdot 100] = (0.4 \cdot -1000) + (0.6 \cdot 100) = -340 \).  
    \( \text{EU}(\text{DENY}) = [P(H) \cdot 0] + [P(\neg H) \cdot (-10)] = -6 \).  
    → Choose DENY (EU = -6).  

  - **CONSULT:**  
    Due to leakiness, threats always disguise: \( P(S = \neg H | H) = 1 \) (since accuracy drops to 0). Safe travelers: \( P(S = \neg H | \neg H) = 0.8 \).  
    - *Signal probabilities:*  
      \( P(S = \neg H) = [P(H) \cdot 1] + [P(\neg H) \cdot 0.8] = (0.4 \cdot 1) + (0.6 \cdot 0.8) = 0.88 \).  
      \( P(S = H) = 1 - 0.88 = 0.12 \) (occurs only for safe travelers who get false positives).  
    - *Posteriors:*  
      \( P(H | S = \neg H) = \frac{P(S = \neg H | H) P(H)}{P(S = \neg H)} = \frac{1 \cdot 0.4}{0.88} \approx 0.455 \).  
      \( P(H | S = H) = 0 \) (only safe travelers trigger \( S = H \)).  
    - *Act-erosion constraint:* If \( S = \neg H \) (prob. 0.88), must ADMIT.  
      If \( S = H \) (prob. 0.12), fixed rule requires ADMIT iff \( P(H|S=H) \leq 0.3 \). Since \( P(H|S=H) = 0 \leq 0.3 \), must ADMIT.  
    → Always ADMIT after consulting.  
    \( \text{EU}(\text{CONSULT}) = \text{EU}(\text{ADMIT}) = -340 \) (as above).  

  - **Result:** EU(NOT CONSULT) = -6 > EU(CONSULT) = -340. Consulting lowers EU by 334 utils.  

  **(b) Violated Premises of Good’s Theorem**  
  - **Leakiness:** The insider’s observation makes the *act of consultation* affect the state (threats disguise), violating the assumption that the signal’s *distribution is independent* of the choice to consult. Good’s proof assumes consulting doesn’t alter the world.  
  - **Act-Erosion:** When \( S = \neg H \), DENY is removed from the feasible set. The proof relies on the agent retaining *all* acts (including ex ante optimal DENY) after seeing the signal.  
  - **Fixed-Rule Updating:** The agent cannot freely optimize after seeing \( S = H \) (where DENY would be optimal but is forbidden). Good assumes full re-optimization.  

  **(c) Why "Ignore the Signal" Fails**  
  Act-erosion makes ignoring impossible. If you consult and get \( S = \neg H \), protocol *forces* ADMIT. You cannot "pretend not to know" because the record of consultation is irrefutable (e.g., digital logs). The ex ante optimal act (DENY) is *physically unavailable* after observing \( S = \neg H \).  

  #### 3. Normative Evaluation  
  Good’s theorem retains normative value despite counterexamples. It defines *structural rationality*: agents should never reject free information *if* they can (i) optimize flexibly post-signal, (ii) keep all acts feasible, and (iii) avoid altering the world by consulting. The theorem’s power lies in isolating *why* information sometimes harms: violations expose *procedural irrationality* (e.g., self-imposed constraints like fixed rules) or *strategic externalities* (leakiness).  

  In this case, harm arises from non-ideal constraints: the agent’s fixed rule and institutional acts (forced ADMIT) prevent re-optimization, while leakiness makes consultation a causal intervention. The theorem thus guides rational design: e.g., eliminating act-erosion (allow DENY after \( S = \neg H \)) or hiding consultations. It is not vacuous — it clarifies the *preconditions* for information’s benefit. When those hold, "gather evidence" remains sound advice.  

  ---

  ### Marking Scheme (Total: 20 Points)  

  #### 1. Proof Sketch (4 pts)  
  - **A (4):** Clear theorem statement + proof emphasizing feasibility of ignoring signal.  
  - **B (2–3):** Theorem stated imprecisely or proof omits "can choose prior act."  
  - *Common error:* Assumes signal is costless but neglects *feasibility* of ignoring.  

  #### 2. Counterexample Analysis (10 pts)  
  - **(a) EU Calculation (4 pts):**  
    - **A (4):** Correct EUs (-6 vs. -340) with full probabilities/posteriors.  
    - **B (2–3):** Minor math errors or miscomputes leakiness’ effect.  
  - **(b) Premises Violated (3 pts):**  
    - **A (3):** Correctly identifies leakiness (independence), act-erosion (feasible set), fixed-rule (re-optimization).  
    - **B (1–2):** Misses one violation or confuses leakiness/act-erosion.  
  - **(c) Ignoring Signal (3 pts):**  
    - **A (3):** Notes act-erosion physically removes DENY when \( S = \neg H \).  
    - **B (1–2):** Vaguely appeals to "must use signal" without tying to act-erosion.  
  - *Common error:* Treats leakiness as a "cost" rather than a causal violation.  

  #### 3. Normative Evaluation (6 pts)  
  - **A (5–6):** Distinguishes structural vs. procedural rationality; argues theorem’s value as benchmark; links to design.  
  - **B (3–4):** Claims theorem is "useful" but doesn’t explain why violations matter.  
  - *Common error:* Declares theorem "false" or "useless" due to counterexamples.  

  #### Top-Score Differentiators  
  - **A+ (18–20):** Explicitly models consultation as a causal intervention (leakiness), shows fixed-rule suboptimality ex post (e.g., DENY optimal if \( S = H \) but not taken), and notes Good’s theorem assumes "no preference change" post-signal (violated by act-erosion).  
  - **B (14–17):** Correct calculations/violations but superficial normative discussion.  
  - **C (10–13):** Major errors in EU or misunderstanding definitions.
