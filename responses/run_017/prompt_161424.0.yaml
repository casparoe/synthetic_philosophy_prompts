prompt: |-
  You are a professional philosopher who teaches an advanced seminar in decision theory and formal epistemology, and who has spent years marking essays by students who have read a great deal of LessWrong and Astral Codex Ten and therefore know all the slogans — "free information can't hurt you, because you can always ignore it" — without being able to reconstruct why the slogan is true or when it stops being true. Please think carefully before you write: begin with a few paragraphs of private brainstorming in which you (i) isolate exactly which premises of Good's theorem are load-bearing in the one-line "just ignore the signal" proof, (ii) sort the familiar stories about information making things worse into genuine counterexamples versus mere confusions about ex ante versus ex post value or gross versus net value, and (iii) list the ways a student can sound fluent while displaying no understanding. Only then draft the deliverables.

  The context: I have been hanging around the rationalist blogosphere for about a decade, and I am the TA setting this year's final for our upper-level decision theory course. The last time we ran this topic, half the class turned in variations on a single paragraph — state Good's theorem, say the expected value of information is non-negative because an expected-utility maximizer can always condition on the message and pick the same act she would have picked anyway, note that information is usually costly in practice, conclude — and I could not separate the students who understood the result from the students who had memorized the labels. So I want a question whose crux is not the slogan but the *fragility* of the argument for it, and which forces students to locate the precise step at which the proof breaks in a case where information really is harmful. To keep them from pattern-matching on examples they have seen, I would like the question built around a small piece of staged apparatus of my own devising: call an information source **leaky** if the mere fact that you consult it is observable by some other party whose subsequent behaviour depends on whether you consulted (the content of the signal need not be observable to them); call it **act-eroding** if receiving its output removes some act from your feasible set — most obviously the act of sincerely saying, or of the record showing, that you do not know; and call an agent a **fixed-rule updater** if she revises her beliefs by conditioning but then feeds the posterior into a decision rule she is not free to re-optimize for each message, such as "proceed iff the posterior probability of safety exceeds 0.7". Give the students these definitions in the question itself, set them a concrete ninety-minute case in which the same agent faces a leaky, act-eroding, free signal, and ask them to say whether this is a counterexample to Good's theorem, which premise it violates, whether "just ignore the information" is available to her as a reply and why not, and — this is the part that should separate the top of the class — whether, once the counterexamples are properly catalogued, the theorem still has any normative bite at all, or whether it is close to a restatement of what it means to be an expected-utility maximizer, and so cannot do the work that people in my reading tradition quietly want it to do when they say things like "go gather evidence before you decide".

  Please deliver three things. First, the exam question exactly as it would appear on the paper: self-contained, including the definitions above, the concrete scenario (I am not fussy about the setting, but it should be one where consulting a free signal can be strictly worse than not consulting it even for a perfect expected-utility maximizer with no cost of acquisition), a stated time limit of ninety minutes and an indicative length of about 1,200 words. Second, a model answer of roughly 700–900 words, written as a strong but not superhuman student would write it, which should explicitly write out the expected-utility comparison behind the theorem and point to the exact inference in the proof that the scenario defeats, and which should distinguish the genuine counterexamples from the apparent ones. Third, a marking scheme out of 20 built around five must-hit points with marks assigned to each: I would expect something along the lines of a precise statement plus proof sketch, an identification of the load-bearing assumptions, a correct taxonomy of the failure cases, an exact diagnosis of the staged scenario in the formal vocabulary of the theorem, and a defended verdict on the "is it vacuous?" question; for each point, say what an A answer must contain that a B answer can omit, and add a one-line note on how candidates typically get it wrong. Please do not include any bibliography, reading list, or citations — I have the syllabus, and what I need from you is the question and the standard, not sources.
