  ### Diagnostic Flowchart: The Nature of Time and Existence  

  **Instructions:** Answer each question based on your intuitive response to the concrete case or claim. Do not worry about philosophical labels. Start at Q1 and follow the arrows based on your answers.  

  ---

  #### Q1: When you say, "My headache this morning was caused by the wine I drank last night," do you take the cause (the wine-drinking, which is not happening now) to *literally exist* at the time of the effect (the headache)?  
  - **Yes** → Q2  
  - **No** → Q3  

  #### Q2: Is the feeling that time "passes" or "flows" tracking something objective in the world (like a moving "now"), or is it just a feature of human psychology?  
  - **It tracks something objective** → *Growing Spotlight*  
  - **It's just human psychology** → Q4  

  #### Q3: Does the inventory of what exists *change* over time? (e.g., When Socrates died, did the universe lose a member?)  
  - **Yes** → Q5  
  - **No** → Q6  

  #### Q4: Are there, at this moment, *multiple equally real* future possibilities (e.g., both "sea battle tomorrow" and "no sea battle tomorrow" are real alternatives)?  
  - **Yes** → *Branching Growing Block*  
  - **No** → *Growing Block*  

  #### Q5: For "Socrates was snub-nosed" to be true, must there be something *present* (e.g., current evidence or abstract facts) that makes it true?  
  - **Yes** → *Presentism (including ersatz variants)*  
  - **No** → *Shrinking Block*  

  #### Q6: To accommodate Einstein's relativity (where simultaneity depends on observer motion), must we say existence is *relative to an inertial frame*?  
  - **Yes** → *Relativized Presentism*  
  - **No** → Q7  

  #### Q7: Is the future "open" such that a claim like "There will be a sea battle tomorrow" has *no truth value* today?  
  - **Yes** → Q8  
  - **No** → *Static Four-Dimensional Block*  

  #### Q8: Are there *multiple equally real* future possibilities (e.g., both "sea battle tomorrow" and "no sea battle tomorrow" are real alternatives)?  
  - **Yes** → *Branching View*  
  - **No** → *Quietism*  

  ---

  ### Leaves (Positions)  
  1. **Presentism (including ersatz variants)**: Only present things exist. Past/future truths depend on present facts/abstractions.  
  2. **Growing Block**: Past and present exist; future does not. The block "grows" as new moments are added.  
  3. **Branching Growing Block**: The growing block has a branching future of open possibilities.  
  4. **Growing Spotlight**: The block grows, and its leading edge is objectively "lit" by a moving present.  
  5. **Shrinking Block**: Future and present exist; past does not. The block "shrinks" as moments cease to exist.  
  6. **Relativized Presentism**: Existence is frame-relative; no universal "now."  
  7. **Branching View**: All past/present events are real; future is a tree of possibilities (no single timeline).  
  8. **Static Four-Dimensional Block**: All times equally exist; no objective change in what exists.  
  9. **Moving Spotlight**: All times exist, but an objective "spotlight" moves across them (no extra time dimension).  
  10. **Quietism**: No fact of the matter about which view is correct.  

  ---

