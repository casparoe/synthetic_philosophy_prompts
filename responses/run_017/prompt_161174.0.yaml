answer: |-
  Below is a systematic, classroom-ready procedure to evaluate philosophical thought experiments ("intuition pumps") based on Daniel Dennett's concept. It focuses on three core jobs (verdict pump, possibility pump, scaffolding), tests for framing risks, and provides clear outputs. The procedure takes 20-30 minutes per case, requires no specialized training, and includes decision rules for exam safety and unstable verdicts. I'll first outline the procedure, then apply it to your three cases.

  ---

  ### **The Intuition Pump Evaluation Procedure**  
  **Purpose**: To classify a case’s job (verdict/possibility/scaffolding), test for framing biases, and determine if it’s safe for exams or discussion-only.  
  **Time**: 20–30 minutes per case.  
  **Materials**: Case description, pen/paper or shared doc.  

  #### **Step 1: Classify the Job** (5 min)  
  *Ask these questions in order:*  
  1. **"What is the case *asking* students to do?**  
     - If it demands a yes/no verdict (e.g., "Is this free?") → **Verdict pump**.  
     - If it asks only to imagine/conceptualize (e.g., "Could this exist?") → **Possibility pump**.  
     - If it introduces a distinction without judgment (e.g., "Notice these differ") → **Scaffolding**.  
  2. **"Does the case *assume* a verdict or possibility?**  
     - If it hints at a "correct" answer → It’s likely misclassified; re-check Q1.  
     - If neutral about outcomes → Proceed.  
     *Output*: Assign job type (V/P/S). If unclear, flag as "Job Uncertain" and stop—the case needs redesign.  

  #### **Step 2: Job-Specific Tests** (10–15 min)  
  *Apply tests based on classification:*  
  - **For Verdict Pumps**:  
    1. **Stability Test**: "Restate the case in neutral, flat prose (no metaphors, emotional language, or loaded words). Does the *same* verdict still seem compelling?"  
       - *No* → **Fail**: Framing is doing too much work.  
    2. **Contrast Test**: "What is the case *implicitly contrasting* with? (e.g., ‘normal’ vs. ‘manipulated’ acts). Is this contrast fair, or does it stack the deck?"  
       - Biased contrast → **Fail**.  
    3. **Leakage Test**: "Does the case contain ‘intuition crutches’ (e.g., words like ‘surely,’ ‘obviously,’ or vivid but irrelevant details) that push toward one verdict?"  
       - Yes → **Fail**.  
    *Pass all 3?* → Proceed to Step 3.  
  - **For Possibility Pumps**:  
    1. **Vividness Test**: "Does the case make the possibility *concrete and memorable* without implying it’s true/false?"  
       - No → **Fail** (too abstract or verdict-leaning).  
    2. **Neutrality Test**: "If you delete all descriptive flair, is the core scenario still coherent?"  
       - No → **Fail** (depends on framing).  
    *Pass both?* → Proceed to Step 3.  
  - **For Scaffolding**:  
    1. **Distinction Clarity Test**: "Does the case *clearly isolate* the relevant distinction (e.g., intent vs. outcome) without adding ethical/theoretical baggage?"  
       - No → **Fail**.  
    2. **Minimalism Test**: "Can the distinction be grasped with fewer details? If not, are extras *necessary* for clarity?"  
       - Extraneous details → **Fail** (distracting).  
    *Pass both?* → Proceed to Step 3.  

  #### **Step 3: Stability & Safety Check** (5 min)  
  *Ask regardless of job type:*  
  1. **"Pilot Data Check**: If tested before, did student verdicts:  
     - Split evenly (e.g., 50/50)? → Flag as **Unstable**.  
     - Shift with presentation order? → Flag as **Order-Sensitive**.  
  2. **Exam Safety Rule**:  
     - Verdict pumps must pass *all* Step 2 tests + have **no instability flags** → **Safe for exams**.  
     - Possibility pumps/scaffolding with no flags → **Safe for exams** (if testing conceptual grasp, not verdicts).  
     - Any instability flag → **Discussion-only**.  
     - Verdict pumps with framing fails (Step 2) → **Unsafe**; discard or redesign.  

  #### **Step 4: Handle Ambiguity** (2 min)  
  *Stop and return to a human if:*  
  - The case hinges on **values** (e.g., "What counts as praiseworthy?") → Needs instructor judgment.  
  - The case requires **pedagogical emphasis** (e.g., "What should students notice first?") → Needs instructor judgment.  
  - **Job is borderline** (e.g., between verdict/possibility) → Redesign to clarify purpose.  

  #### **What This Procedure Cannot Do**  
  - **Resolve philosophical disputes**: It checks for framing biases, not truth.  
  - **Predict student reactions**: Flags instability but can’t eliminate it.  
  - **Replace values-based decisions**: E.g., whether "praiseworthiness" should emphasize character or control.  
  - **Fix flawed concepts**: If a case assumes contested ideas (e.g., "free will"), it won’t expose that.  

  #### **Critique of Your Original Habits**  
  - **Restating in flat prose**: Useful for leakage/stability tests, but insufficient alone (misses job-specific risks).  
  - **Spotting "surely"**: Valuable for verdict pumps (now in "Leakage Test"), but irrelevant for possibility pumps.  
  - **Identifying contrasts**: Critical for verdict pumps (now formalized), but less so for scaffolding.  
  *Why discard them as a system?* They conflate job types and miss instability/order effects. The procedure above expands them into job-specific checks.  

  ---

  ### **Application to Your Cases**  
  #### **Case 1: Implant Device (Free Will/Praiseworthiness)**  
  - **Step 1 (Job)**: Asks for yes/no verdicts ("Are acts free? Praiseworthy?") → **Verdict pump**.  
  - **Step 2 (Tests)**:  
    - *Stability*: Restated flatly ("A device adjusts decision-thresholds to ensure generosity; you feel in control") → Verdict *doesn’t* survive. Many still question praiseworthiness due to manipulation.  
    - *Contrast*: Implicitly contrasts "manipulated generosity" vs. "normal generosity." Stacked deck: "No knowledge" + "pride" makes manipulation feel innocent.  
    - *Leakage*: "Flows from your own reasons," "become known as generous" nudge toward "free/praiseworthy."  
    → **Fails all three tests** for verdict pumping.  
  - **Step 3 (Stability/Safety)**: You note students divide → **Unstable**. Automatic **discussion-only** (unsafe for exams).  
  - **Step 4 (Ambiguity)**: Returns to human. Core issue is **values** ("Does control require unmanipulated desires?"). Also needs **emphasis judgment** (e.g., stress the "no knowledge" aspect).  
  - **Output**: Poor verdict pump (fails tests, unstable). *But*: Excellent **possibility pump** for "manipulation without loss of agency." Reclassify and use in discussion to show conceptual space, not verdicts.  

  #### **Case 2: Million Clerks (Understanding)**  
  - **Step 1 (Job)**: Asks "Does the system understand?" but you *present* it as showing possibility → **Confirm as possibility pump** (no verdict demanded).  
  - **Step 2 (Tests)**:  
    - *Vividness*: "Million clerks... no idea what any means" makes computationalism vivid → **Pass**.  
    - *Neutrality*: Core survives flattening ("Symbol-rewriting system produces coherent speech") → **Pass**.  
  - **Step 3 (Stability/Safety)**: No instability flags → **Safe for exams** (e.g., "Explain how this challenges understanding").  
  - **Step 4 (Ambiguity)**: None. Framing is honest: No "surely," no stacked contrast.  
  - **Output**: Honest possibility pump. Use as is.  

  #### **Case 3: Vice-President (Intentionality)**  
  - **Step 1 (Job)**: Asks verdict ("Did he bring about intentionally?") → **Verdict pump**.  
  - **Step 2 (Tests)**:  
    - *Stability*: Restated neutrally ("Indifferent agent causes side effect") → Verdict collapses (students split).  
    - *Contrast*: Implicitly contrasts help/harm. Stacked deck: Harm often feels "more intentional" due to blame.  
    - *Leakage*: "Profit" vs. "indifference" implies motives matter, but case doesn’t argue why.  
    → **Fails all tests**.  
  - **Step 3 (Stability/Safety)**: Students divide; shifts with order → **Unstable and order-sensitive**. **Discussion-only**.  
  - **Step 4 (Ambiguity)**: Returns to human. Instability stems from **emphasis** (order primes blame/praise) and **values** ("Does intentionality require desire?").  
  - **Output**: Unreliable verdict pump due to framing and instability. *But*: Excellent **scaffolding** to introduce the Knobe effect (side-effect asymmetry). Use in discussion to highlight how context shapes intuition.  

  ---

  ### **Summary Recommendations**  
  - **Case 1**: Keep, but reclassify as **possibility pump** (discussion-only).  
  - **Case 2**: Valid **possibility pump** (exam-safe).  
  - **Case 3**: Keep as **scaffolding** for distinctions (discussion-only).  
  - **Procedure Outputs**: Always provides (1) Job classification, (2) Exam/discussion ruling, (3) Framing/instability flags, (4) "Return to human" triggers.  
  - **Limitations**: Cannot resolve value-laden debates, but flags where they intrude. Best for screening cases, not creating them.  

  This procedure systematizes your habits, adds instability checks, and prevents job conflation—while staying executable in minutes. For refereeing manuscripts, apply Steps 1–2 to detect "unearned conclusions" from framing.
