  ### Theoretical Leaves
  Based on answer combinations, participants land in one of eight leaves (or empty cells). Each leaf is defined by its commitments, not labels. Awkward commitments highlight key challenges.

  - **Leaf 1: Strict Conditional** (e.g., early Lewis, modal logic views)  
    - *Path*: Node 1A/1B → Node 2A/2C → Node 3B → Node 4C/4D → Node 5A/5D → Node 6B.  
    - *Awkward commitment*: Vacuously true when antecedent is impossible (e.g., "If John had 5+ years and no degree, he’d be hired" is true because the antecedent is "too far-fetched").  

  - **Leaf 2: Variably Strict (Unique Closest World)** (e.g., Stalnaker)  
    - *Path*: Node 1A → Node 2A → Node 3B → Node 4A → Node 5B/5C → Node 6B.  
    - *Awkward commitment*: In indeterminism, there’s a brute fact about which world is "closest" (e.g., the coin would land heads in the closest flip-world).  

  - **Leaf 3: Non-Truth-Conditional Suppositional** (e.g., Adams, Edgington)  
    - *Path*: Node 1A → Node 2A → Node 3B → Node 4A → Node 5A → Node 6A.  
    - *Awkward commitment*: Conditionals lack truth conditions, so they can’t embed in truth-functional contexts (e.g., "The probability that if P, Q" isn’t about truth).  

  - **Leaf 4: Variably Strict (No Unique Closest World)** (e.g., Lewis)  
    - *Path*: Node 1A → Node 2A → Node 3B → Node 4A → Node 5A → Node 6B.  
    - *Awkward commitment*: "Might" and "would" aren’t duals in indeterminism (e.g., "It might land heads" true but "It wouldn’t land tails" false).  

  - **Leaf 5: Ordering Source from Context/Premises** (e.g., Kratzer)  
    - *Path*: Node 1A → Node 2A → Node 3B → Node 4A → Node 5A → Node 6B.  
    - *Awkward commitment*: Similarity is replaced by conversational goals, making truth dependent on arbitrary contextual priorities.  

  - **Leaf 6: Unified Semantics, Pragmatic Difference** (e.g., von Fintel, Gillies)  
    - *Path*: Node 1A → Node 2C → Node 3C → Node 4A → Node 5A → Node 6B.  
    - *Awkward commitment*: Indicatives with known-false antecedents (e.g., "If the match was struck, it lit") can be assertable.  

  - **Leaf 7: Counterfactuals Semantically Distinct** (e.g., Iatridou)  
    - *Path*: Node 1A/1B → Node 2A/2C → Node 3A/3C → Node 4A → Node 5A → Node 6B.  
    - *Awkward commitment*: The indicative/counterfactual contrast is marked by syntax (e.g., past tense), not pragmatics or modality.  

  - **Leaf 8: Material Conditional Revival**  
    - *Path*: Node 1A → Node 2B/2D → Node 3A/3D → Any → Any → Node 6B.  
    - *Awkward commitment*: Counterfactuals (e.g., "If I had passed, I’d have gotten an email") are false when antecedent is false, but often sound true.  

  - **Empty Cell 1**: Incoherent/unattractive (e.g., Node 4B). Claims Conditional 1 is false but 2 is true, ignoring that adding a clause shouldn’t make John more hireable.  
  - **Empty Cell 2**: Unoccupied (e.g., Node 1B → Node 2A → Node 3B → Node 4A → Node 5A → Node 6A). Combines truth conditions with conditional probability (violates triviality results).  

