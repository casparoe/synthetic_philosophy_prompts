  #### Node 5: Might/Would Asymmetry  
  *Case*: A fair coin wasn’t flipped.  
  - (1) "If it had been flipped, it might have landed heads."  
  - (2) "If it had been flipped, it might have landed tails."  
  - (3) "If it had been flipped, it would have landed heads."  
  **Question**: Which are true?  
  - **A**: Only (1) and (2).  
  - **B**: Only (3).  
  - **C**: All three.  
  - **D**: None.  

  *Why this node?* Checks if indeterminism forces multiple closest worlds. (1) and (2) sound true, but (3) sounds false (A). If you accept (3) (B or C), you require a unique closest world. Not about "epistemic possibility" – it directly targets the uniqueness assumption in similarity semantics.  
  → A → Node 6; B → [Leaf 2]; C → [Leaf 2]; D → [Leaf 1].

  #### Node 6: Embedded Probability  
  *Case*: A fair coin will be flipped with 50% probability. If flipped, 50% heads. Consider the indicative: "If it is flipped, it will land heads."  
  **Question**: Is the probability of this conditional 1/2?  
  - **A**: Yes.  
  - **B**: No.  

  *Why this node?* Separates truth-conditional from non-truth-conditional views. If "yes" (A), you reject truth conditions (probability isn’t of truth). If "no" (B), you assign truth conditions (probability is chance it’s true). Diagnoses if conditionals embed under probability like propositions. Not about triviality results directly—it forces a choice on truth-aptness.  
  → A → [Leaf 3]; B → [Leaf 2 or 4 or 5 or 6] (depends on prior answers).

