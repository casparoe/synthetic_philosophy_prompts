  Below is a flowchart designed to sort participants into theoretical positions on conditionals based on intuitive judgments about concrete cases. The tree starts from near-universal agreement and branches through six nodes, each presenting a novel case and a multiple-choice question. Answers lead to one of eight theoretical leaves (with two empty cells). The chart is diagnostic but not exhaustive; I flag limitations below.

  ### Flowchart Tree
  Start: Everyone agrees: Some conditionals with false antecedents are true (e.g., "If I had jumped from the moon, I would have died") and others false (e.g., "If I had jumped from the moon, I would have become a unicorn"), so conditionals aren’t just truth functions like material implication.  
  → Proceed to Node 1.

  #### Node 1: Doctor’s Known Antecedent  
  *Case*: A doctor has already seen a patient’s scan and knows it shows a tumor. She says to the patient: "If the scan shows a tumor, we’ll need to biopsy it."  
  **Question**: Is this conditional true?  
  - **A**: Yes.  
  - **B**: No.  

  *Why this node?* Tests if the context set (worlds treated as live) must align with the speaker’s private knowledge. If you say "yes" (A), you allow the context set to reflect shared ignorance (here, the patient doesn’t know the scan result). If "no" (B), you require the context set to match the speaker’s knowledge (making the conditional trivial). Not just about speaker knowledge—it diagnoses whether context sets are epistemically constrained or conversationally flexible.  
  → A → Node 2; B → Node 2 (both paths converge for now; B-users will diverge later).

  #### Node 2: Indicative vs. Counterfactual (Divergence 1)  
  *Case*: A student awaits exam results. They know passing triggers an email, but haven’t checked email yet.  
  - *Indicative*: "If I passed, I will get an email."  
  - *Counterfactual*: "If I had passed, I would have gotten an email."  
  **Question**: Which is acceptable?  
  - **A**: Only the indicative.  
  - **B**: Only the counterfactual.  
  - **C**: Both.  
  - **D**: Neither.  

  *Why this node?* Explores the indicative/counterfactual contrast. The indicative sounds natural (A), but the counterfactual implies the student failed (so it’s unacceptable). If you accept both (C), you downplay pragmatic differences. Not just about "past tense" – it probes if counterfactuality requires semantic marking.  
  → A → Node 3; B → [Leaf 8]; C → Node 3; D → [Leaf 8] (rare).

  #### Node 3: Indicative vs. Counterfactual (Divergence 2)  
  *Case*: A match wasn’t struck and didn’t light. It was dry, and there was oxygen.  
  - *Indicative*: "If the match was struck, it lit."  
  - *Counterfactual*: "If the match had been struck, it would have lit."  
  **Question**: Which is acceptable?  
  - **A**: Only the indicative.  
  - **B**: Only the counterfactual.  
  - **C**: Both.  
  - **D**: Neither.  

  *Why this node?* Another indicative/counterfactual contrast. The counterfactual sounds natural (B), but the indicative is odd (since we know the antecedent is false). If you accept the indicative (A or C), you allow indicatives with known-false antecedents. Not about "similarity" – it tests if indicative conditionals presuppose epistemic possibility.  
  → A → [Leaf 7]; B → Node 4; C → [Leaf 7]; D → [Leaf 8].

  #### Node 4: Sobel Sequence with Hiring Committee  
  *Case*: A job requires a degree AND 5+ years’ experience. John has a degree but only 3 years; he wasn’t hired.  
  - *Conditional 1*: "If John had 5+ years’ experience, he would have been hired."  
  - *Conditional 2*: "If John had 5+ years’ experience and no degree, he would have been hired."  
  **Question**: Which is correct?  
  - **A**: Conditional 1 true, Conditional 2 false.  
  - **B**: Conditional 1 false, Conditional 2 true.  
  - **C**: Both true.  
  - **D**: Both false.  

  *Why this node?* Tests if the ordering source (what’s held fixed) is supplied by conversational focus, not objective similarity. Adding "no degree" (Conditional 2) flips the truth value, but doesn’t make worlds less similar (John has a degree). If you say A, you let the antecedent shift what’s held fixed (e.g., keeping the degree). Not asking "Is similarity context-dependent?" (all say yes) – it diagnoses if the shift is semantic or pragmatic.  
