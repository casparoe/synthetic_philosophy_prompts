  5. Using the QWERTY keyboard layout (widely agreed suboptimal, but no switch).  
  6. Head-nod for "yes" and head-shake for "no" in a region.  
  7. Wearing black to a funeral.  
  8. Not sitting next to a stranger on a nearly empty bus.  
  9. Standing on one side of an escalator to let others walk.  
  10. Queuing spontaneously before a service opens.  
  - *Private dislike case:* \#5 (QWERTY keyboard).  
  - *Loud-minority enforcement case:* \#3 (Bringing a dish – if only a few enforce it, while others comply indifferently).  

  ---

  #### **Decision Tree**  
  **Start:** Observe a behavioral regularity (people do X in circumstances C).  

  1. **Is there an alternative way to behave that would work just as well, and that everyone would prefer *if* most others switched?**  
     - **Yes** (Coordination structure with alternatives) → 2.  
     - **No** (No real alternatives; mixed motives or uniquely efficient) → 3.  
     - **Unclear** → Use historical data or hypotheticals (e.g., "Would a left-driving society prefer right-driving if all others switched?").  

  2. **Does the regularity collapse if everyone’s private preferences flip (e.g., everyone now prefers the alternative) but no one learns about others’ flipped preferences?**  
     - **No** (Regularity persists: expectations sustain it) → 4.  
     - **Yes** (Preferences alone drive it; coordination is incidental) → 5.  

  3. **Is there a cost imposed on violators by others (e.g., scolding, exclusion, fines)?**  
     - **Yes** (Sanctions observed) → 6.  
     - **No** (No visible sanctions) → 7.  

  4. **Does the regularity collapse when it becomes common knowledge that most comply only because they expect others to (and expect others to for the same reason)?**  
     - **Yes** → **Lewisian convention**.  
       - *Awkward commitment:* Requires unrealistic common knowledge.  
     - **No** → **Skyrms-style evolutionary equilibrium**.  
       - *Awkward commitment:* No cognitive expectations needed; learning/drift suffices.  

  5. **Does the regularity serve a clear purpose (e.g., efficiency, safety), and would people abandon it if the purpose became obsolete?**  
     - **Yes** → **Teleological account (proper function)**.  
       - *Awkward commitment:* History determines "correctness," not current utility.  
     - **No** → **Unnamed (spontaneous convention)**.  
       - *Awkward commitment:* Emergent but non-functional; resists categorization.  

  6. **Do sanctions occur *only* when violations are observed by others (not in private)?**  
     - **Yes** → 8.  
     - **No** (Sanctions applied even privately) → **Bicchieri-style social norm**.  
       - *Awkward commitment:* Norms bind even without sanctions if expectations align.  

  7. **Does the regularity persist long after its original purpose (if any) becomes obsolete?**  
     - **Yes** → **Conformist transmission (Boyd-Richerson)**.  
       - *Awkward commitment:* Majority copying overrides individual preferences.  
     - **No** → **Habit or statistical regularity**.  
       - *Awkward commitment:* Not a "norm"; just repeated behavior.  

  8. **When enforcing sanctions, do people appeal to group commitments (e.g., "we all agreed")?**  
     - **Yes** → **Gilbert’s joint commitment**.  
       - *Awkward commitment:* Obligation exists even if all members secretly want to defect.  
     - **No** → **Brandom-style inferentialist norm**.  
       - *Awkward commitment:* Norms live in "scorekeeping" (e.g., "You broke X, so you owe Y").  

  ---

  ### **Dynamics Tree: Thin vs. Thick Bootstrap**  
  *For each leaf above, can it start from nothing (thin) or does it need prior norms/precedents (thick)?*  

  **First node: Before this regularity existed, was there anything normative or precedential in place (e.g., rules, models, obligations)?**  
  - **No (Thin bootstrap possible)** → Skyrms, Lewis, Conformist Transmission, Habit.  
    - *Why thin works:* Salience/focal points (Schelling), sheer imitation, or random drift can ignite these.  
  - **Yes (Thick bootstrap needed)** → Bicchieri, Gilbert, Teleological, Brandom, Social Norms.  
    - *Why thick needed:* These require prior "scaffolding" (e.g., existing sanctions, commitments, or functional roles). Bicchieri/Gilbert quietly presuppose normativity to explain norms.  
  - **Unnamed/Unclassified** → Depends on context (e.g., teleological may be thin if function is self-evident).  

  ---

  ### **Ambiguities & Gaps**  
  **Indistinguishable pairs once stabilized:**  
  - **Lewis vs. Skyrms:** Require observing *formation*. If regularity emerges without communication (e.g., traffic flow in a newborn society), it’s Skyrms. If it requires explicit agreement, it’s Lewis.  
  - **Bicchieri vs. Gilbert:** Require observing *sanctions*. If sanctions appeal to group commitments ("we owe it to each other"), it’s Gilbert. If sanctions are decentralized and preference-driven, it’s Bicchieri.  

  **Unoccupied boxes (logically possible but unattractive/unexplored):**  
  1. *Non-arbitrary, expectation-only, no alternative:*  
     - Unoccupied because expectations require alternatives to be meaningful. Likely **incoherent** (e.g., "Why expect X if there’s no choice?").  
  2. *Arbitrary, mainly moralized sanction:*  
     - Unoccupied because sanctions in arbitrary contexts feel unjust (e.g., punishing right-driving in a left-driving society). **Unexplored** – no theory justifies it.  
  3. *Functional, but no history-dependence:*  
     - Unoccupied because teleology requires historical reproduction. **Incoherent** per evolutionary accounts.  

  ---

  ### **Side Box: Can Norms Migrate?**  
  A norm shifts leaves if its sustaining mechanisms change. Evidence includes:  
  - **Lewis → Skyrms:** Common knowledge decays (e.g., immigrants follow a norm without understanding *why*).  
  - **Habit → Bicchieri:** Sanctions emerge (e.g., not replying to emails was ignored, now punished).  
  - **Bicchieri → Teleological:** Original purpose is rediscovered (e.g., "We wear black at funerals *because* it respects the dead").  
  *Key: Track expectations, sanctions, or functional appeals over time.*

  ---

  **Handout Tips:**  
  - Use cases to test the tree (e.g., QWERTY → Skyrms; funeral attire → Bicchieri).  
  - Highlight thick/weakness: Gilbert and Bicchieri can’t explain bootstrapping without prior norms.  
  - Emphasize migration – norms aren’t static (e.g., queuing may start as Skyrms, become Bicchieri).  

  > *"The tree is a tool, not a taxonomy. Real norms blur categories – and that’s the point."*
