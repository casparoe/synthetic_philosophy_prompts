prompt: |-
  A friend of mine — in her sixties, thirty years as an advertising copywriter, now on our city's consumer-protection board — has unusually firm and consistent verdicts about which ways of getting people to do something are just persuasion and which are manipulation. She has no philosophy training and reads none. I have no academic background in any of this either, so please don't assume I know the literature; I've simply been keeping a list of her rulings for a few years.

  1. A car dealer who, having heard a customer say she likes white cars, has the white model washed and moved to the front of the lot, and mentions, entirely truthfully, that white holds its resale value better. Fine.
  2. An anti-smoking advertisement that is nothing but a dying man speaking through a hole in his throat and footage of a blackened lung: no statistics, no argument, pure fear and disgust. Fine.
  3. A drug company representative who puts the same trial data in front of a doctor with the benefits as raw counts and the risks as a one-in-ten-thousand rate, having picked the form of words that makes the drug look best, and says nothing false. Manipulation.
  4. A supermarket that pumps the smell of baking bread toward the entrance to make people buy more. No one is misled about anything and no one is made worse off in any obvious way. Manipulation.
  5. A hospital cafeteria that moves the salad bar to the front of the line and puts the desserts behind the till, openly, on the nutritionist's instruction, to make people eat better. Fine.
  6. A charity that has volunteers hand-write short notes to donors along the lines of I was thinking of you — genuinely written, genuinely meant — but only to donors its model has flagged as likely to give more if they receive one. Manipulation.
  7. A union representative who lays out, in a clear spreadsheet, what the company's offer actually costs people over three years, and tells them they have every reason to be angry. Fine.
  8. A subscription company you can join in one click and can only leave by telephoning during office hours. Manipulation.

  The only formulation I have ever managed to get out of her is a shrug and: it depends whether they are being got at. That is useless to me, because the supermarket shopper and the cafeteria eater are both being got at, and she rules opposite ways.

  The case her board has to vote on next month is a savings app offered by a bank. You opt in, and at sign-up it explains in plain language exactly what it will do: it rounds your purchases up and moves the difference into savings, sends you a weekly note saying you saved less than most people in your bracket, shows you a photograph of the holiday you told it you were saving for, and schedules its reminders at the hours when you personally tend to give in. Nothing is false, nothing is concealed, you can turn any part of it off whenever you like, and on your own reckoning you end up better off than you would have. But it works purely by exploiting the fact that people are bad at this sort of thing, it gives the saver no new reason to save, and the bank's interest in holding your deposits is not the same as your interest in your holiday.

  What I would like from you: the rule she seems to be running, stated precisely enough that it predicts her next verdict; the other rules that fit all eight of her rulings just as well; what each of those rules implies about the savings app; which way you would bet she votes, and why you prefer that rule over the others; which of her eight rulings is the closest match, and if her precedents genuinely underdetermine it, what she would be committing herself to either way; and the further case you would put to her to tell the surviving rules apart, since I have a standing invitation to propose one.
reasoning: |-
  Hmm, the user presents an interesting puzzle about their friend's judgments on persuasion versus manipulation. The friend has no formal philosophy training but makes consistent rulings across various scenarios, and now they need to predict her verdict on a savings app case. 

  First, I need to analyze all eight rulings to find patterns. The car dealer (1) and anti-smoking ad (2) are fine, while the drug rep (3), supermarket smells (4), charity notes (6), and subscription trap (8) are manipulation. The cafeteria (5) and union rep (7) are fine. 

  The key seems to be whether the tactic targets cognitive weaknesses. When it exploits how people process information (like framing effects in 3) or automatic responses (like smells in 4), it's manipulation. But when it's just making information salient (like the white car) or structuring choices helpfully (like the salad bar), it's persuasion. 

  For the savings app, it uses multiple behavioral nudges: framing via social comparison, emotional triggers with vacation photos, and strategic timing. Though transparent and opt-outable, it systematically exploits cognitive biases without adding rational reasons. This fits her manipulation pattern. 

  The closest precedent is the charity handwritten notes (6) - also personalized and emotionally targeted despite being genuine. If she calls that manipulation, the app should be too. 

  Alternative rules could focus on intent (but her rulings don't consistently track malice) or harm (but supermarket smells seem harmless yet manipulative). The cognitive weakness rule fits best. 

  To test alternatives, I'd propose a case with identical tactics but prosocial intent - like calorie labels designed to exploit visual biases for health goals. If she calls it fine, intent matters; if manipulation, cognitive targeting is her true criterion.
answer: |-
  Your friend's rulings reveal a sophisticated, instinctive ethical framework focused on **exploitation of cognitive limitations vs. facilitation of rational choice**. Here's the breakdown:

  ### The Core Rule (Predicts All 8 Rulings)
  **"Manipulation occurs when a tactic *exploits* automatic cognitive/emotional biases *to bypass or undermine* the target's rational decision-making process, *without providing offsetting rational justification or transparent choice architecture*. Persuasion occurs when information is framed *to engage* reason, or when choice architecture *supports* declared goals without exploiting vulnerabilities."**

  ### How It Explains Each Ruling:
  1.  **Car dealer (Fine):** Washes/moves car + mentions resale value. *Makes relevant info salient; engages rational consideration (resale value).*
  2.  **Anti-smoking ad (Fine):** Uses fear/disgust. *Targets emotion, but the emotion is rationally connected to the actual consequence (death/disease). It's a justified *engagement* of emotion.*
  3.  **Drug rep (Manipulation):** Framing benefits/risks differently. *Exploits framing bias & numeracy limitations (raw counts vs. rates) to distort perception *without* rational basis.*
  4.  **Supermarket smell (Manipulation):** Baking bread scent. *Exploits automatic Pavlovian/olfactory response *bypassing* conscious deliberation.*
  5.  **Cafeteria (Fine):** Salad bar first, desserts last. *Choice architecture transparently *supports* the customer's *declared* health goal (facilitates rational choice).*
  6.  **Charity notes (Manipulation):** Personalized genuine notes to high-potential donors. *Exploits reciprocity bias & emotional response *triggered by personalization*. The note isn't a rational argument; it's a calculated emotional nudge bypassing cost-benefit analysis.*
  7.  **Union rep (Fine):** Clear spreadsheet showing cost. *Presents objective data rationally to support a conclusion (anger is a justified emotional response to evidence).*
  8.  **Subscription trap (Manipulation):** Easy in, hard out. *Exploits inertia and friction *deliberately* to bypass reconsideration/revocation of consent.*

  ### Alternative Rules That Also Fit (But Are Less Compelling)
  1.  **Intent Rule:** "Manipulation occurs when the *primary intent* is to trigger an *automatic* response; persuasion when the intent is to trigger *deliberation*." (Fits all 8 but is harder to prove and doesn't explain *why* the auto-vs-deliberate distinction matters ethically).
  2.  **Harm/Exploitation Rule:** "Manipulation occurs when the tactic *profits from* exploiting a vulnerability *without the target's benefit*." (Fits most: Supermarket (4) profits, Cafeteria (5) benefits target. But struggles with Charity (6): charity benefits, donor *might* feel good. Subscription trap (8) clearly profits via exploitation).
  3.  **Transparency Rule:** "Manipulation occurs when the *mechanism of influence* is hidden." (Fails: Supermarket smell (4) isn't hidden, yet ruled manipulation. Subscription trap (8) *is* hidden in the friction, ruled manipulation).

  ### The Savings App Verdict (Using the Core Rule)
  *   **Tactics:** Round-ups (minor friction), social comparison ("less than most"), emotional imagery (holiday photo), timing based on vulnerability (when "tend to give in").
  *   **Analysis:** This is classic *exploitation of cognitive biases*: loss aversion (round-ups), social norm pressure (comparison), affective forecasting errors (holiday photo), exploiting known willpower depletion windows (timing). It offers *no new rational reason* to save; it purely leverages weaknesses. Transparency/opt-out doesn't negate the *exploitation* during engagement. The bank's profit motive further highlights the asymmetric benefit.
  *   **Prediction:** She will rule **MANIPULATION**.

  ### Why the Core Rule is Best
  *   **Explanatory Power:** Directly addresses *how* each tactic works psychologically and why that matters ethically (bypassing reason vs. engaging/supporting it).
  *   **Consistency:** Cleanly distinguishes similar cases (e.g., Cafeteria (5) *supports* conscious goals vs. Supermarket smell (4) *triggers* unconscious desire; Charity note (6) *exploits* reciprocity vs. Union spreadsheet (7) *informs* justification for anger).
  *   **Fits "Got At":** The "got at" refers to *how* they are being influenced – bypassing their rational guardrails.

  ### Closest Precedent & Underdetermination
  *   **Closest Match:** **#6 (Charity Notes).** Both involve personalized, emotionally-targeted tactics exploiting psychological biases (reciprocity/willpower) based on data modeling, despite transparency and genuine elements.
  *   **Underdetermination?** It's borderline only if "supporting declared goals" is over-emphasized (the user *did* opt-in to saving). However, the app doesn't just *support* the goal; it *engineers compliance* by exploiting vulnerabilities *around* that goal, mirroring the charity exploiting reciprocity *around* the desire to donate. Precedents strongly point to manipulation.

  ### Test Case to Distinguish Rules
  **Propose this:** *"A budgeting app uses AI to analyze a user's spending. When it detects impulsive spending triggers (e.g., late-night scrolling, specific store locations), it automatically pushes a notification showing a photo of the user's smiling child and the text "Is this worth [item cost]?" The user consented to this tactic explicitly during setup as a 'willpower boost.' It's truthful and works."*

  *   **Core Rule Predicts:** MANIPULATION. Exploits emotional salience (child's photo) and timing to override impulse *bypassing* rational cost-benefit analysis at the moment of weakness.
  *   **Intent Rule Predicts:** MANIPULATION (intent is to trigger auto-stop).
  *   **Harm/Exploitation Rule Predicts:** FINE (user benefits, consented).
  *   **Transparency Rule Predicts:** FINE (fully disclosed).

  Your friend's likely ruling (MANIPULATION) would confirm the Core Rule (and Intent Rule), rejecting the Harm/Exploitation and Transparency rules. It hinges on *how* the influence works, not just consent or outcome.
