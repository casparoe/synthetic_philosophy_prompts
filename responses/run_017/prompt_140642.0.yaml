prompt: |-
  I do student analytics at a big FE college and I've got into an argument with a colleague about Simpson's paradox that I can't find my way out of. I've简化... sorry, I've made up a dataset — hers was messier, this is tidied — where the sign flips twice, and I'd be grateful if someone would tell me which step to reject.

  Two versions of a maths support programme, T (new) and C (old), 200 students each. Outcome is pass rate (%). Everyone is also labelled by delivery centre (A or B) and by prior attainment (high or low), both recorded before allocation.

  Cell pass rates, with the cell sizes in brackets:

  - Centre A, high prior: T 95 (36), C 85 (16)
  - Centre A, low prior: T 70 (144), C 60 (4)
  - Centre B, high prior: T 40 (4), C 30 (144)
  - Centre B, low prior: T 15 (16), C 10 (36)

  Centre level: A gives T 75, C 80. B gives T 20, C 26. So C wins in both centres.
  Overall: T 69.5, C 31.4. So T wins by a mile.
  Cell level: T wins all four cells.

  Yes, some of the cells are tiny — that's the point of the example, not a bug.

  Her argument, numbered, and I've tried to be fair to it:

  (1) All three verdicts are computed from the same four cell rates; they're just weighted averages with different weights. So no dataset "contains" a direction of effect — the direction comes from the weighting, and the data on their own never pick out a weighting.
  (2) A weighting is admissible only if the thing you weight by isn't itself caused by the programme. Centre and prior attainment are both pre-allocation, so both weightings are admissible — and admissible weightings disagree.
  (3) So the only way to settle it is to control for more, not less: when two admissible partitions disagree, the finer one wins. Call it finer-is-fairer — keep refining until the strata are homogeneous enough that the weighting stops mattering.
  (4) You can always refine. Add more covariates, and for a continuous one — score on the diagnostic, age, travel time to campus — there's no principled stopping point short of one student per stratum.
  (5) At one student per stratum there's no within-stratum comparison to make: no student got both programmes. And by (3) every coarser verdict has already been overruled.
  (6) So no finite body of data ever supports a causal comparison. Which is absurd — trials, and plain common sense, do deliver causal knowledge from data.

  I'd rather keep (1), (2) and (6) than give up any of them, so I suppose (3) is where I get off — except that (3) is exactly what people seem to do with the kidney stone example, and if I drop it I've no rule at all for which verdict to print in the report. My suspicion is the rot sets in earlier than (3), but I can't put my finger on where.

  Two more things. First: the college is going to roll out one programme to everyone next year, so isn't the top-line number actually the one that matters for that decision, whatever the adjusted numbers say? Those feel like two seperate questions to me. Second: I made these numbers up, so if the table doesn't do what I think it does — no double reversal, or the arithmetic doesn't add up — say that first.

  What I want is one diagnosis, not a menu. Name the step you'd reject, say why it looked fine, tell me what I have to pay for rejecting it, and what you'd put in its place. Give me your confidence as a number, and tell me the single strongest consideration that would move you off it. And if my framing is confused somewhere — if 'weighting' is the wrong way to put it, or the question isn't really a statistical one at all — say so plainly rather than answering politely; I'd definately rather be told.
reasoning: |-
  We are given a dataset with two programs (T and C) and two stratification variables: Centre (A, B) and Prior Attainment (high, low). The data shows Simpson's paradox in two layers: at the centre level, C wins in both centres, but overall T wins. However, we also note that in every cell (i.e., at the finest level of Centre and Prior), T wins.

  The colleague's argument is structured in six points. We are asked to reject one step and explain.

  Let me first verify the numbers:

  Overall T pass rate:
  - T: (36 * 95 + 144 * 70 + 4 * 40 + 16 * 15) / (36+144+4+16) = (3420 + 10080 + 160 + 240) / 200 = 13900 / 200 = 69.5%
  - C: (16 * 85 + 4 * 60 + 144 * 30 + 36 * 10) / (16+4+144+36) = (1360 + 240 + 4320 + 360) / 200 = 6280 / 200 = 31.4%

  Centre A:
  - T: (36 * 95 + 144 * 70) / (36+144) = (3420 + 10080) / 180 = 13500 / 180 = 75%
  - C: (16 * 85 + 4 * 60) / (16+4) = (1360 + 240) / 20 = 1600 / 20 = 80%

  Centre B:
  - T: (4 * 40 + 16 * 15) / (4+16) = (160 + 240) / 20 = 400 / 20 = 20%
  - C: (144 * 30 + 36 * 10) / (144+36) = (4320 + 360) / 180 = 4680 / 180 = 26%

  Cell level: T wins in every cell (95>85, 70>60, 40>30, 15>10).

  Now, the colleague's argument:

  (1) All three verdicts (overall, centre level, cell level) are weighted averages of the same four cell rates. The direction of effect depends on the weights.

  (2) Both Centre and Prior Attainment are pre-allocation, so both weightings (by centre or by prior) are admissible. But they disagree.

  (3) Therefore, the finer partition (by both Centre and Prior) wins.

  (4) We can always refine further (by adding more covariates) until one student per stratum.

  (5) Then we cannot make a within-stratum comparison.

  (6) So no finite data supports a causal comparison -> absurd.

  We want to keep (1), (2), and (6). So we must reject (3) or something earlier? The colleague suggests (3) is the step to reject.

  But note: in the kidney stone example, the finer partition (by stone size) is typically taken as the correct one. So why is (3) problematic?

  Let me think: the problem with (3) is that it assumes that the finer partition is always better. However, in this example, the finest partition we have (by Centre and Prior) shows T wins in every cell. So by (3) we would say T is better. But then why did we get a reversal at the centre level? Because the allocation of students to the two programs is very different across the centres and prior groups.

  The issue is that the groups (Centre and Prior) are not balanced between T and C. For example, in Centre A, T has 36 high prior and 144 low prior, while C has 16 high and 4 low. In Centre B, T has 4 high and 16 low, while C has 144 high and 36 low. So T is getting the majority of the low prior students in Centre A (which is a large centre) and the majority of the high prior students in Centre B is in C. This imbalance causes the reversal when we aggregate.

  But note: the cell level comparison is the most refined we have. However, the colleague's argument points out that we can always refine further until we break the comparison.

  But in reality, we cannot get infinitely refined because we don't have the data. So we must stop at some level. The question is: which level?

  The key is that we want to compare the two treatments in similar conditions. The cell level (by Centre and Prior) gives us the most similar conditions. So we would trust the cell level comparison.

  But then why do we have a reversal at the centre level? Because the centre level aggregates over prior attainment, and the prior attainment groups have different pass rates and are imbalanced. Similarly, the overall level aggregates over both and has even more imbalance.

  So the cell level comparison is the most fair. Therefore, we would conclude T is better.

  But the colleague's argument (4) and (5) say that we can refine further until we break it. However, in practice, we don't have more covariates. And if we did, we would use them to get even finer strata until we have no more covariates. Then we are at the finest stratum we can get. And at that level, if we can make comparisons (i.e., if within each stratum we have both T and C), then we can do a weighted average of the within-stratum effects. This is the idea of using a fully adjusted model.

  In this case, at the cell level (Centre and Prior) we have both T and C in every cell (though some are small). So we can compute the effect in each cell and then average. The weighted average of the within-cell differences (using an appropriate weighting) would give the overall effect. But note: the overall effect we computed earlier (69.5% vs 31.4%) is the unadjusted overall. The adjusted overall effect would be the weighted average of the within-cell differences.

  Let me compute the within-cell differences:

  - A, high: 95 - 85 = 10
  - A, low: 70 - 60 = 10
  - B, high: 40 - 30 = 10
  - B, low: 15 - 10 = 5

  Now, if we average these differences, we have to weight them. But note: the standard approach in causal inference (e.g., in a randomized trial) is to weight by the total number in the stratum? Or by the proportion of the population? 

  But note: we are interested in the average treatment effect. If we think the population next year will have the same distribution of Centre and Prior as the current population, then we can weight by the total number of students in each cell (the sum of T and C). 

  Total in each cell:
  - A, high: 36+16 = 52
  - A, low: 144+4 = 148
  - B, high: 4+144 = 148
  - B, low: 16+36 = 52

  Total students: 400.

  Weighted average of the differences:
  = (52 * 10 + 148 * 10 + 148 * 10 + 52 * 5) / 400
  = (520 + 1480 + 1480 + 260) / 400
  = 3740 / 400 = 9.35

  So the average treatment effect is about 9.35% in favor of T. This is positive, meaning T is better.

  But note: this adjusted effect is not the same as the unadjusted overall difference (69.5 - 31.4 = 38.1%). The unadjusted overall difference is much larger because of the imbalance: T was given more to the groups that have higher pass rates (like Centre A, which has high pass rates for both high and low prior, and in Centre A, T was given to more students). 

  So the adjusted effect is 9.35%, which is the average of the within-cell effects. This adjusted effect is what we want because it controls for the confounders (Centre and Prior). 

  Therefore, we do have a way: we use the adjusted effect by controlling for the confounders. And we don't need to go to one per stratum. We stop when we have controlled for all confounders (i.e., all pre-treatment variables that might be associated with both the treatment assignment and the outcome).

  So the rule is: control for all pre-treatment covariates that are confounders. Then the adjusted effect is the causal effect (under the assumption of no unmeasured confounders and positivity, etc.).

  Therefore, step (3) is not entirely wrong, but it is incomplete. We do not necessarily need the finest partition possible in the entire world (with all covariates) but the finest partition we have with the measured confounders. And then we use a weighted average of the within-stratum effects to get the overall effect.

  But note: in the kidney stone example, we use the stone size because it is a confounder. In this example, both Centre and Prior are confounders because they are associated with the treatment (as we see by the imbalance) and with the outcome (because pass rates differ by centre and prior).

  Therefore, the step to reject is (4) and (5) because we don't need to refine beyond the available confounders. We stop at the available confounders and calculate the adjusted effect.

  But the colleague's argument (4) says we can always refine by adding more covariates. However, we don't have more covariates. And if we do, we should include them if they are confounders. But if we don't have them, we cannot. And if we have included all confounders, then the adjusted effect is valid.

  Moreover, step (5) is not necessary because we don't go to one per stratum. We only control for the confounders we have. Then within each stratum, we compare the treatments. And if we have multiple strata, we average appropriately.

  So the step we must reject is (4) and (5). But the question asks for one step. Let me see the structure: (3) says the finer one wins. We are using the finer one (by Centre and Prior) and that is the one we have. We don't need to go beyond what we have. So (3) is acceptable if we interpret it as the finest we have (with the available confounders). But (4) and (5) are the ones that lead to the absurdity.

  Alternatively, we can reject (3) if we interpret it as meaning we must keep refining without limit. But the intended meaning of (3) is that when two partitions (like by Centre or by Prior) are available, the finer one (by both) is better. That is correct. So (3) is okay.

  The problem is in the extension: (4) says we can always refine further, and (5) says we then break the comparison. But we don't have to refine beyond the available confounders. We stop at the available confounders.

  Therefore, the step to reject is (4). We do not need to refine beyond the available confounders. The fact that we could in theory refine further (if we had more data) is irrelevant because we don't have that data. We work with the data we have.

  So:

  - Step to reject: (4)
  - Why it looked fine: Because in theory we can always add more covariates, but in practice we are limited by the data we have. And we don't need to go to one per stratum. We stop when we have controlled for the confounders.
  - What to pay for rejecting it: We have to assume that we have measured all confounders. If there are unmeasured confounders, then our estimate might be biased. But this is a standard assumption in observational studies.
  - What to put in its place: We control for all available pre-treatment covariates that are confounders (i.e., associated with both treatment and outcome). Then we compute the adjusted treatment effect by appropriately averaging the within-stratum effects (e.g., by weighting with the overall distribution of the strata in the population).

  My confidence: 95%. The single strongest consideration that would move me: if there were unmeasured confounders that are strongly associated with both treatment and outcome, then our adjusted effect would be biased. But that is always a risk in observational studies.

  Now, about the two more things:

  1. The college is going to roll out one programme to everyone next year. The top-line number (overall pass rate) is not the one that matters because it is confounded. What matters is the causal effect of the program. The adjusted effect (9.35%) is the expected increase in pass rate if we switch from C to T, holding constant the distribution of confounders. But note: if the college's population next year has the same distribution of Centre and Prior, then we can use the adjusted effect to predict the overall pass rate. Alternatively, if we want to know the overall pass rate we would get by using T versus C, we can compute:

     - For T: we would get the same as the overall T pass rate in the study? But that was 69.5%. However, that was achieved with an imbalance in the groups. If we assign T to everyone, then the distribution of Centre and Prior will be the same as the current population (since the population is the same). So the expected pass rate for T would be the weighted average of the T pass rates in each cell, weighted by the number of students in each cell in the whole population. Similarly for C.

     The whole population has:
     - A, high: 52
     - A, low: 148
     - B, high: 148
     - B, low: 52

     For T:
     = (52 * 95 + 148 * 70 + 148 * 40 + 52 * 15) / 400
     = (4940 + 10360 + 5920 + 780) / 400 = 22000 / 400 = 55%

     For C:
     = (52 * 85 + 148 * 60 + 148 * 30 + 52 * 10) / 400
     = (4420 + 8880 + 4440 + 520) / 400 = 18260 / 400 = 45.65%

     So the overall pass rate for T would be 55% and for C 45.65%. The difference is 9.35%, which matches the adjusted effect we computed.

     But note: in the study, the overall T pass rate was 69.5% and C was 31.4%. That is because in the study, T was given more to the groups that are easier to pass (like Centre A, and in Centre A, the low prior group which is large and has a 70% pass rate for T, but note that Centre A is easier than Centre B). When we assign T to everyone, we don't get the benefit of the imbalance. So the overall pass rate for T would be 55%, which is lower than the 69.5% observed in the study.

     Therefore, the top-line number (69.5% vs 31.4%) is not what we would get in the population if we assign T to everyone. We have to adjust for the confounders to get the correct prediction.

     So for the decision, we want the adjusted effect (or the predicted outcomes under each program for the whole population). The top-line number is not the one that matters.

  2. The data does show a double reversal: at the centre level, C wins in both, but overall T wins. And at the cell level, T wins in every cell. So the example is valid.

  Therefore, the answer is to reject step (4). We do not need to refine beyond the available confounders. We stop at the available data and compute the adjusted effect.

  Final diagnosis:

  Reject step (4). We can always refine by adding more covariates? But we are constrained by the data we have. We cannot get data we don't have. And we don't need to go to one per stratum. We control for the measured confounders and then compute the adjusted effect. The strongest consideration that would move me: if we have unmeasured confounders, then our adjusted effect might still be biased. But that is a separate issue.
answer: |-
  ### Diagnosis: Reject Step (4)  
  **Confidence:** 95%  
  **Strongest consideration to move me:** If new evidence shows that the current strata (Centre × Prior) are causally irrelevant (e.g., Centre is a proxy for an unmeasured post-treatment variable), I might reconsider. But this is unlikely, as both are pre-allocation.  

  ### Why Step (4) Looks Tempting (but is wrong):  
  Step (4) claims: *"You can always refine. Add more covariates... no principled stopping point short of one student per stratum."* This seems logical—more refinement feels "purer." But it ignores **practical causal inference**: We stop refining when we control for *all observed confounders* (pre-treatment variables affecting both treatment assignment and outcome). We don’t need infinite refinement; we need to block backdoor paths.  

  ### What You Pay for Rejecting Step (4):  
  You lose the illusion of a "perfect" solution. Instead, you must:  
  - **Justify your adjustment set**: Argue that Centre and Prior are the only confounders (plausible here, as both are pre-allocation).  
  - **Accept uncertainty**: Unmeasured confounders could exist, but this is inherent to observational data.  

  ### What to Put in Place of Step (4):  
  **Rule:** *Control for all pre-treatment confounders, then compute the weighted average of within-stratum effects.*  
  - **Why this works**: It isolates the treatment effect by comparing like-with-like in each stratum, then aggregates fairly.  
  - **How to apply it here**:  
    1. Use the finest stratum available (Centre × Prior), as it contains all confounders.  
    2. Calculate the treatment effect in each cell:  
       - A-High: T–C = 10%  
       - A-Low: T–C = 10%  
       - B-High: T–C = 10%  
       - B-Low: T–C = 5%  
    3. Weight by the total students in each stratum (T + C):  
       - Weights: A-High = 52, A-Low = 148, B-High = 148, B-Low = 52 (total = 400)  
       - Weighted effect: `(52*10 + 148*10 + 148*10 + 52*5) / 400 = 9.35%`  
    **Conclusion**: T is better by 9.35% on average.  

  ### Why Steps (1), (2), (3), (6) Hold, and (5) is Moot:  
  - **(1) & (2)**: Correct. Weighting matters, and pre-treatment variables are admissible.  
  - **(3)**: **Keep it!** The finer stratum (Centre × Prior) *is* superior—it resolves the paradox. Your data shows T wins in all cells. Kidney stone examples agree: finer strata (stone size) give the true effect.  
  - **(5)**: Void once (4) is rejected. We don’t refine to oblivion; we stop at confounders.  
  - **(6)**: Trials *do* deliver causal knowledge by design (e.g., randomization balances confounders). Here, adjustment mimics that.  

  ### Your Two Bonus Points:  
  1. **"Isn’t the top-line number (69.5% vs. 31.4%) what matters for rollout?"**  
     **No.** The unadjusted overall is confounded. T’s "69.5%" comes from assigning T to easier groups (e.g., Centre A, which has higher pass rates). If you roll out T to everyone, the pass rate would be the **adjusted prediction**:  
     - Expected pass rate for T: `(52*95 + 148*70 + 148*40 + 52*15)/400 = 55%`  
     - For C: `(52*85 + 148*60 + 148*30 + 52*10)/400 = 45.65%`  
     T still wins, but by 9.35%—not 38.1%. The top-line number is misleading.  
  2. **Your dataset is valid**: Double reversal occurs (C wins in centres, T wins overall and in cells). Arithmetic checks out.  

  ### Framing: No Confusion  
  - **"Weighting" is correct**: This is core to causal inference (see Hernán & Robins, 2020).  
  - **Statistical vs. causal**: This *is* statistical, but causal inference provides the rules.  

  ### Final Word  
  Your colleague’s error is demanding infinite refinement. Real-world decisions use **available confounders**. Report the adjusted effect (9.35%) as the causal estimate. If pushed, say: *"T is better within every Centre-Prior group. The centre-level reversal is due to confounding; adjusting for Prior resolves it."*  

  ---  
  *Key reference: Hernán, M. A., & Robins, J. M. (2020). Causal Inference: What If. Chapter 12.*
