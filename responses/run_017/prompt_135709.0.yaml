  For the structure, I'll start with 20 words and drop one per line. The content will mirror this decay: beginning with intact capacity, progressing through ambiguous stages, ending near incoherence. Images like sand, signatures, and thresholds will carry the ideas organically.

  The prose addendum is crucial - they want intellectual honesty about where the poem takes liberties. I'll note:
  1) The poem implies indeterminacy is fundamental, but legal tests treat it as resolvable
