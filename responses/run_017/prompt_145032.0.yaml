  I recall Spinoza’s concepts: natural right equals power (potentia), the sovereign’s right is limited by what it can enforce, unenforceable laws are self-defeating, and individuals retain their power. The challenge is to show that disenfranchised women retaining necessary power forces the sovereign to enfranchise them to avoid instability. 

