  ### **Activity Design: Informational Cascade Demonstration**  
  **Goal:** Students experience how rational individuals, acting solely on informational grounds (no reputational pressure), can collectively abandon their private evidence, leading to a unanimous but incorrect group decision.

  ---

  #### **Materials & Setup**  
  - **Two Paper Bags:** 
    - **Bag A:** 20 red balls/cards, 10 black (mostly red).  
    - **Bag B:** 10 red balls/cards, 20 black (mostly black).  
  - **Deck of Cards/Colored Balls:** Use cards (red/black) or colored paper balls.  
  - **Index Cards:** For guesses and confidence ratings (1–10).  
  - **Coin:** To secretly choose the bag pre-class (e.g., heads = Bag A, tails = Bag B).  
  - **Envelopes:** Prepare 24 envelopes pre-class:  
    - **20 Non-experts:** 1 envelope with a private signal (color drawn from the chosen bag).  
    - **4 Experts:** 3 envelopes each with private signals (drawn independently).  
  - **Random Assignment:** Assign 4 random students as "experts" (they get 3 envelopes; others get 1). Keep expert identities secret.  

  **Signal Probabilities:**  
  - If Bag A: P(red) = 2/3, P(black) = 1/3.  
  - If Bag B: P(red) = 1/3, P(black) = 2/3.  
  - **Cascade Probability:**  
    - After 2 identical guesses in the sequential round, a cascade *starts* (subsequent students ignore private signals).  
    - P(wrong cascade) = **1/9** (if Bag A/B chosen fairly).  
    - To ensure a wrong cascade occurs, run 3–4 trials (probability rises to ~30% after 3 trials). If no cascade forms naturally, use a pre-scripted example in debrief.  

  ---

  #### **Step-by-Step Rules**  
  **Round 1: Simultaneous Guessing**  
  1. **Intro (5 min):**  
     - "We’re testing group judgment under uncertainty. Two bags: one mostly red, one mostly black. I flipped a coin pre-class to pick the bag."  
     - "Each of you has an envelope with a private clue. Some have 3 clues (experts, randomly chosen). Don’t reveal your clues!"  
     - **Goal:** Guess which bag it is (A or B) and rate confidence (1–10).  

  2. **Process (5 min):**  
     - Distribute envelopes. Students open privately.  
     - Non-experts: Guess based on 1 signal.  
     - Experts: Guess based on majority of 3 signals.  
     - Write guesses/confidence on index cards. Collect cards.  

  3. **Tally (2 min):**  
     - Count votes on the board. Do **not** reveal the true bag yet.  

  **Round 2: Sequential Guessing**  
  1. **Intro (5 min):**  
     - "Same bag, same clues. Now, you’ll guess in random order. After hearing prior guesses, announce your guess publicly (e.g., ‘I guess Bag A’). Do **not** reveal clues or confidence."  
     - "Update your belief rationally: combine prior guesses with your private clue. Write confidence privately on cards."  

  2. **Process (20 min):**  
     - Draw random order from a hat.  
     - Each student:  
       - Hears all prior guesses.  
       - Announces guess (e.g., "Bag A").  
       - Privately writes confidence (1–10) on card; hand to you.  
     - Record guesses on the board in order.  

  3. **Handle Issues:**  
     - **"I saw black but go with the group":** Intervene: "Don’t reveal clues! Just state your guess."  
     - **Accidental clue leaks:** Pause, remind: "Clues stay private! Reset if needed."  
     - **Contrarians (econ students):** Pre-empt: "Act as truth-seekers—no gaming!"  
     - **Quiet students:** Verbally confirm: "John, your guess is...?"  
     - **Expert powerlessness:** Experts late in order *will* often be overruled (e.g., if cascade starts early).  

  **Reputation Round (Optional - 10 min):**  
  - **If Time:** Run a 3rd sequential round. Add: "Class votes for ‘most competent player’ post-game; winner gets bonus point."  
  - **Why Skip?** Reputational herding (copying to fit in) may muddy informational cascade lesson. Better to surface via debrief questions.  

  ---

  #### **Debrief (25 min)**  
  1. **Reveal Truth & Contrast Rounds:**  
     - "True bag was [Bag A/B]. In Round 1, votes were X% correct. In Round 2, the group was [correct/wrong]."  
     - Show confidence: Plot average confidence vs. position in sequential round. **Prediction:** Confidence rises (e.g., 4→8) as cascade builds; accuracy plateaus.  

  2. **Key Moments & Concepts:**  
     - **Cascade Start:** Point to the first 2 identical guesses. "After this, rational people ignored private clues. Why?"  
       - *Model Logic:* Two early signals outweigh one contrary clue.  
     - **Unanimous but Wrong:** "Did the group feel ‘confidently correct’? Yet, we had 24 clues—most were wasted!"  
     - **Expert Powerlessness:** Ask experts: "If you were late, did you override the cascade? Why/why not?"  
       - With 2 public signals, 3 private black signals *can* break a cascade (P(Bag A) drops to 1/3). But 4+ public signals trap experts.  
     - **Aggregate vs. Cascade:**  
       - Reveal all private signals: Tally red/black. "In Round 1, majority clues pointed to [truth]. In Round 2, the cascade ignored this!"  

  3. **Distinguish Mechanisms:**  
     - Poll: "In Round 2, if you ignored your clue, was it because:  
       - (A) You thought the group was probably right? (Informational)  
       - (B) You feared looking dumb? (Reputational)"  
     - **Emphasize:** This game isolates (A). Reputational herding requires social rewards.  

  4. **Limitations & Real-World Links:**  
     - **What This Shows:**  
       - Cascades are *rational* at individual level.  
       - Groups discard private info, becoming confidently wrong.  
       - Order matters: Early actors disproportionately sway outcomes.  
     - **What It Can’t Show:**  
       - Real signals aren’t i.i.d. (e.g., correlated news).  
       - People choose *what* to investigate (confirmation bias).  
       - Network effects (e.g., Twitter pile-ons ≠ linear queues).  
       - Bubbles involve speculation, not just information.  
     - **Bridge to Reality:**  
       - "Cascades explain Yelp reviews, stock runs, but add complexity (e.g., reputational incentives in boardrooms, algorithmic amplification online)."  

  ---

  #### **Predicted Outcomes & Troubleshooting**  
  - **Cascade Frequency:** With n=24, cascades form 80%+ of the time. P(wrong cascade) = 1/9. Run 3 trials if needed.  
  - **No Cascade?** Use a hypothetical: "Imagine the first two guessed Bag A. What would you do as #3 if you saw black?"  
  - **Group Accuracy:**  
    - Simultaneous round: ~95% accurate (aggregates 24 signals).  
    - Sequential round: Accuracy plateaus after cascade starts.  
  - **Confidence Gap:** Confidence rises by 2–4 points in cascades; accuracy flat. With n=24, gap is visible (plot on board).  
  - **Expert Impact:** If early, experts sway; if late, 70% overruled. Reordering by expertise prevents this—discuss!  

  **Final Advice:**  
  - **Poker Face:** Practice neutral reactions.  
  - **Timekeeper:** Use a timer for rounds.  
  - **Flexibility:** If sequential round derails, use pre-generated data to illustrate.  
  - **Big Picture:** End with: "Rational ignorance of private clues isn’t stupidity—it’s rational. But it turns groups into information cemeteries."
