     What the game can't show:

          - Real signals are not i.i.d. from a known urn: in reality, the distribution might be unknown, or signals might be correlated.
          - Real people choose what to look at: confirmation bias.
          - Herding happens in networks, not just a queue.
          - Cascades in the wild: bubbles, restaurants, social media.

     We should let them conclude that informational cascades can occur and are rational at the individual level, and that they can lead to the group being confidently wrong. We should stop them from concluding that all herding is informational or that cascades are always bad. Also, in some settings, cascades can be broken by strong contrary evidence (like from an expert) or by releasing aggregate information.

