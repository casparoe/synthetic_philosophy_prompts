prompt: |-
  I'm helping draft the design doc for a city-level citizens' assembly on housing and transit — couple hundred people picked by lot, meet over weekends for about a year, hand down recommendations on zoning and bus routes. I've been asked to write down my own position on the design choices, and I want to know whether the set of things I believe actually hangs together before I put my name on it. Roughly where I've landed:

  (1) The core case for sortition is procedural, not consequentialist: nobody has a claim to rule over anyone else, and a lottery gives every citizen an equal shot at holding office, which elections never do.
  (2) The draw should still be stratified — quotas on income, education, housing tenure, immigration status, neighborhood — because a pure lottery will in practice throw up a room full of people who have the time and money to show up.
  (3) The real payoff is epistemic: give a group like that decent information and time to talk and it beats both a ballot measure and a city council on messy, long-horizon stuff.
  (4) If the body gets handed its question by elected officials, the whole thing is theater — it should set its own agenda.
  (5) For the same reason, the expert witnesses and the briefing packets should be drawn by lot too, from a pool of people with the relevant credentials. Whoever curates the evidence decides the outcome, so randomize the inputs, not just the participants.
  (6) Service should be compulsory, like jury duty, with the usual hardship exemptions.
  (7) The body should mirror the city — but I also want members to deliberate properly and change their minds, including toward conclusions most residents wouldn't currently endorse. I don't think delegates should be bound by what their neighbors happen to think.

  So: which of these actually pull against each other, and which only look like they do? My own worry is that (6) sits badly with (1), since making people serve looks like exactly the kind of coercion the anti-domination story is supposed to rule out, and that (2) and (7) are in trouble, since if you're engineering the room to mirror the city you can't also want it to end up somewhere the city isn't. But I might defintely be looking in the wrong place, and I don't want a list where everything is in tension with everything.

  Rank the tensions by how bad they are, tell me for each what would have to give and what that costs me, and then say which single revision buys the most consistency. Please lead with your bottom line in the first sentence, then give me the reasoning — no preamble and no restating my list back at me. American English, and no need to cite anybody or name theorists.
reasoning: |-
  Alright, let me unpack this user's query. They're drafting a design doc for a citizens' assembly on housing and transit. They've listed seven principles and are worried about internal tensions. The main task is to identify which principles conflict and how severe those conflicts are, then suggest the most effective revision.

  First, I need to parse each point. Point 1 is about sortition as a procedural right against domination. Point 2 insists on stratification to ensure representativeness. Point 3 values the epistemic outcome of informed deliberation. Point 4 demands agenda-setting autonomy to avoid theater. Point 5 extends randomization to experts to prevent curation bias. Point 6 enforces compulsory participation. Point 7 wants the assembly to mirror the city but also allow members to evolve beyond current public opinion.

  The user's own concerns are about (6) conflicting with (1) because compulsion might contradict anti-domination, and (2) with (7) because engineered representativeness might hinder independent deliberation. But I suspect there are deeper tensions.

  Looking at (2) and (5): Stratification ensures demographic representativeness, but randomizing expert selection could lead to inconsistent or low-quality testimonies. If experts are chosen by lot without regard to expertise depth, the assembly might not get the best information, undermining point 3's epistemic goal. That's a real conflict—striving for fair representation in experts might compromise the quality of input they receive.

  Then there's (4) and (5). If the assembly sets its own agenda but experts are randomly selected, they might lack the necessary expertise to frame the right questions early on. Without curated briefings, they could struggle to define their scope effectively, leading to inefficiency or misdirected efforts. This tension between autonomy and randomized inputs could weaken their agenda-setting capability.

  Regarding (6) and (1): Compulsory service might seem coercive, but unlike jury duty, citizens' assemblies require a longer commitment. While hardship exemptions exist, forcing participation could be seen as domination. However, the user might argue that equal opportunity to participate necessitates mandating it, otherwise only the privileged show up. Still, this clashes with the anti-domination principle.

  Between (2) and (7): Stratification aims for a microcosm of the city, but point 7 wants members to deliberate freely and possibly adopt unpopular views. If members are selected to mirror current demographics, there might be implicit pressure to reflect their groups' existing opinions, making it harder to reach novel conclusions. The conflict here is between descriptive representation and deliberative independence.

  Prioritizing these: The expert randomization in (5) clashes most severely with stratification (2) and epistemic payoff (3). If the input quality is poor, the whole deliberation suffers. Next is (4) and (5), because agenda-setting without expert guidance is challenging. Then (6) vs (1), where compulsion risks undermining the anti-domination ethos. Lastly, (2) vs (7) is manageable since good facilitation can balance representation with open deliberation.

  The highest-priority fix is adjusting (5). Instead of random selection of experts, a balanced panel curated by the assembly itself would maintain fairness without sacrificing expertise quality. This resolves the clash with (2) and (3), and indirectly helps (4) by ensuring relevant inputs for agenda-setting. Other tensions like (6) and (1) might require nuanced justifications but aren't as critical to the assembly's functionality. The user's core goal is effective deliberation, so ensuring quality inputs is paramount. Suggesting this revision strengthens the overall coherence without abandoning their principles.
answer: |-
  ### Bottom line:
  The most severe tension is between your stratification requirement (2) and randomized expert selection (5), with the conflict between compulsory service (6) and anti-domination (1) being conceptually thorny but operationally manageable; revising (5) to allow assembly-curated expert input resolves the biggest practical contradiction.

  ### Ranking of tensions by severity:
  1.  **(2) Stratification vs. (5) Randomized experts**  
      **Conflict:** Stratification ensures demographic representativeness, but random selection of experts from credentialed pools risks inconsistent/inadequate testimony quality. If the assembly’s epistemic value (3) relies on "decent information," random curation could undermine it by prioritizing procedural purity over input relevance.  
      **Cost of revision:** Drop random expert selection. Allow the assembly (or a neutral secretariat) to select diverse experts *based on merit/balance*, preserving epistemic rigor while avoiding biased curation. You lose procedural symmetry but gain functional reliability.

  2.  **(4) Self-set agenda vs. (5) Randomized experts**  
      **Conflict:** If the assembly sets its own agenda (4), it needs tailored expertise to define complex questions (e.g., zoning trade-offs). Random experts may lack the specific knowledge needed early in the process, creating friction between autonomy and effective self-direction.  
      **Cost of revision:** Same as above—abandon (5) to empower the assembly to seek relevant expertise dynamically. Retain random *participant* selection to uphold anti-domination (1).

  3.  **(6) Compulsory service vs. (1) Anti-domination**  
      **Conflict:** Forcing participation *is* coercion, potentially violating the "no rule over others" principle. However, without compulsion, stratification (2) fails (only privileged volunteers join), gutting legitimacy.  
      **Mitigation:** Frame compulsion as a civic duty (like juries) with robust hardship exemptions. The cost is philosophical inconsistency, but the practical alternative (voluntary participation) undermines (2) and (7). Justify it as a necessary, bounded exception to achieve equal opportunity.

  4.  **(2) Stratification vs. (7) Independent deliberation**  
      **Apparent conflict, not real:** A demographically mirrored group *can* still deliberate freely. The tension arises if members feel pressured to represent their "stratum."  
      **Mitigation:** Clear facilitation norms emphasizing collective reasoning over constituency representation resolve this. The cost is diligent facilitation, not principle compromise.

  5.  **(3) Epistemic payoff vs. (5) Randomized experts**  
      **Conflict:** Random experts could deliver fragmented or low-quality briefings, sabotaging the "decent information" needed for (3).  
      **Resolution:** Revising (5) as above eliminates this tension.

  ### Single most effective revision:
  **Revise (5): Replace random expert selection with assembly-guided curation.**  
  - **Why:** It directly resolves the clash with (2), (3), and (4) without undermining core principles. The assembly retains control over inputs (aligning with anti-domination by refusing elite curation), while stratification ensures the *participants*—not the experts—reflect the city.  
  - **Trade-off:** You sacrifice the elegant symmetry of randomizing everything, but gain credible expertise, agenda-setting capacity, and epistemic integrity. The anti-domination logic (1) remains intact via sortition of *members*, not inputs.  

  **Resulting coherence:**  
  With (5) revised, (1)–(4), (6), and (7) function synergistically:  
  - Stratified lot (2) + compulsion (6) → representative assembly.  
  - Self-set agenda (4) + curated experts → informed deliberation (3).  
  - Mirrored city (2,7) + independent deliberation → legitimacy *and* innovation.  
  - Compulsion (6) remains the sole philosophical stretch but is pragmatically justified.
