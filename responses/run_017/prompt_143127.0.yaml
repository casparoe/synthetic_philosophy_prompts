  ### Diagnostic Instrument: Theories of Error (khyāti)  
  *Answer based on concrete cases, not theoretical preferences. Primary case: nacre (mother-of-pearl) mistaken for silver.*  

  ---

  #### **Decision Tree**  
  1. **In the nacre-silver case, is the erroneous cognition a single, unified experience?**  
     - **Yes** (e.g., "I see silver here now") → **Q2**  
     - **No** (e.g., "I see nacre but *confuse* it with recalled silver") → **akhyāti (Prābhākara Mīmāṃsā)**  

  2. **Does the silver that appears exist?**  
     - **Yes** → **Q3**  
     - **No** → **Q4**  
     - **Neither existent nor nonexistent** (indeterminable) → **anirvacanīyakhyāti (Advaita Vedānta)**  

  3. **Is the silver located where it appears (i.e., on the beach)?**  
     - **Yes** → *Unoccupied cell: incoherent (silver isn’t on the beach)*  
     - **No** → **Q5**  

  4. **Is the silver purely mental?**  
     - **Yes** (e.g., like a dream object) → **ātmakhyāti (Yogācāra Buddhism)**  
     - **No** (e.g., an external illusion) → **asatkhyāti (Mādhyamika Buddhism)**  

  5. **In the jaundiced-eye case (white conch seen as yellow), is the yellow located in the eye?**  
     - **Yes** (e.g., bile pigments distorting vision) → **viparītakhyāti (Sāṅkhya-Yoga)**  
     - **No** (e.g., yellow is a misattributed universal) → **Q6**  

  6. **In the rope-snake case, does the snake exist *elsewhere*?**  
     - **Yes** (e.g., in a nearby field) → **anyathākhyāti (Nyāya)**  
     - **No** (e.g., snake is a real property misapplied) → **satkhyāti (Bhāṭṭa Mīmāṃsā)**  

  ---

  #### **Leaves of the Tree**  
  1. **akhyāti** (Prābhākara Mīmāṃsā)  
     - **Awkward commitment**: Error is *not* a distinct cognition but a failure to discriminate perception from memory.  
     - (a) Not a single episode; error arises from undiscerned fusion of valid perception (nacre) and valid memory (silver).  
     - (b) Validity intrinsic (*svataḥprāmāṇya*); error doesn’t undermine successful cognitions, as memory is valid.  
     - (c) Action (e.g., reaching) succeeds if the perceived object (nacre) supports it, but fails for the memory (silver).  
     - **Separability**: Unique in denying a unified erroneous object.  

  2. **anirvacanīyakhyāti** (Advaita Vedānta)  
     - **Awkward commitment**: The object is *indeterminable* (neither real nor unreal), yet drives action.  
     - (a) Produced by a pramāṇa (e.g., perception) but fails; not intrinsically valid.  
     - (b) Validity extrinsic (*parataḥprāmāṇya*); error reveals the need for post-cognition verification.  
     - (c) Action succeeds provisionally (e.g., avoiding a "snake") due to practical reality (*vyāvahārika sattā*).  
     - **Separability**: Differs from anyathākhyāti in ontology (indeterminacy vs. external existence).  

  3. **ātmakhyāti** (Yogācāra Buddhism)  
     - **Awkward commitment**: All objects are mental; no external world exists.  
     - (a) Not a pramāṇa; cognition is always of internal constructs.  
     - (b) Validity irrelevant; all experiences are mental, including "successful" ones.  
     - (c) Action (e.g., fleeing a dream snake) succeeds in the mental realm.  
     - **Separability**: Unique in denying externality (e.g., virtual mug is mental).  

  4. **asatkhyāti** (Mādhyamika Buddhism)  
     - **Awkward commitment**: The object is *nonexistent* (like a sky-flower), yet appears.  
     - (a) Not produced by a pramāṇa; cognition is defective.  
     - (b) Validity extrinsic; emptiness (*śūnyatā*) negates intrinsic validity.  
     - (c) Action (e.g., inferring fire from "smoke") fails; nonexistents can’t guide action.  
     - **Separability**: Contrasts ātmakhyāti by locating illusion externally.  

  5. **viparītakhyāti** (Sāṅkhya-Yoga)  
     - **Awkward commitment**: Defects (e.g., jaundice) project real properties (yellow) from one locus (eye) to another (conch).  
     - (a) Produced by a pramāṇa (perception) but distorted; not intrinsically valid.  
     - (b) Validity extrinsic; error reveals the need for defect-free cognition.  
     - (c) Action (e.g., avoiding a "snake") may succeed if the projected property (e.g., fear) causes useful behavior.  
     - **Separability**: Similar to anyathākhyāti but attributes error to bodily defects (not mislocation).  

  6. **anyathākhyāti** (Nyāya)  
     - **Awkward commitment**: Silver *exists* but is *mislocated* (e.g., in a shop, not on the beach).  
     - (a) Produced by a pramāṇa (perception) but fails due to defects (e.g., dim light).  
     - (b) Validity extrinsic; verified by subsequent cognition (e.g., inspecting the nacre).  
     - (c) Action (e.g., reaching) fails; the object isn’t where it appears.  
     - **Separability vs. Bhāṭṭa**: Differs from satkhyāti in denying real properties in the locus (e.g., silverness isn’t in nacre).  

  7. **satkhyāti** (Bhāṭṭa Mīmāṃsā)  
     - **Awkward commitment**: The object is real but *misrelated* (e.g., silverness exists, but not in nacre).  
     - (a) Produced by a pramāṇa (perception) but fails due to misapplication.  
     - (b) Validity intrinsic; error is partial (components are real).  
     - (c) Action (e.g., inferring fire from dust) fails if the relation is invalid.  
     - **Separability vs. Nyāya**: Differs from anyathākhyāti by locating error in misattribution (not mislocation).  

  ---

  #### **Flagged Inseparable Pairs**  
  - **anyathākhyāti (Nyāya) vs. viparītakhyāti (Sāṅkhya-Yoga)**:  
    Both agree the object exists but isn’t present. Difference is metaphysical: Nyāya blames mislocation; Sāṅkhya blames bodily defects. Cases (e.g., rope-snake) can’t adjudicate—difference is verbal.  
  - **anyathākhyāti (Nyāya) vs. anirvacanīyakhyāti (Advaita)**:  
    Separated by Q2 (existence vs. indeterminacy). Cases expose this: e.g., in nacre-silver, Advaita denies silver’s reality; Nyaya affirms it exists elsewhere.  
  - **Bhāṭṭa (satkhyāti) vs. Nyāya (anyathākhyāti)**:  
    Separated by Q6: Bhāṭṭa says properties (e.g., silverness) are real but misapplied; Nyaya says objects (e.g., silver) are real but misplaced.  

  #### **Cases with Low Discriminatory Power**  
  - **Two moons (pressed eye)**: All theories (except akhyāti) treat it as a single episode. Routes to asatkhyāti (nonexistent) or ātmakhyāti (mental).  
  - **Never-encountered silver**: Only challenges akhyāti (requires memory); other theories don’t require prior experience.  
  - **Room thermometer**: All theories treat it as inferential error; not perceptual, so doesn’t discriminate.  
  - **Virtual mug**: Treated like dream (ātmakhyāti) by most; fails to separate ātmakhyāti from anirvacanīyakhyāti.  

  #### **Invented Case to Separate viparītakhyāti and anyathākhyāti**  
  **Case: "Heat shimmer" illusion**  
  - *Scenario*: In a desert, a subject sees water on the road (caused by light refraction). The water *does* exist in a nearby well.  
  - *Question for Q5*: "Is the water located in the air (viparītakhyāti) or elsewhere (anyathākhyāti)?"  
  - *Outcome*:  
    - **viparītakhyāti**: Water is a real property projected from the well into the air by defects (heat).  
    - **anyathākhyāti**: Water exists but is mislocated (it’s in the well, not on the road).  
  - *Verdict*: Distinguishes the theories, as viparītakhyāti requires a defect-driven projection.  

  ---

  **Memo**: This instrument diagnoses theories via case judgments, not labels. It leaves no cell unoccupied and flags metaphysical (non-empirical) differences. Print double-sided. Sanskrit glosses: *khyāti* (apprehension/theory of error), *pramāṇa* (valid means of knowledge).
