  Your observations reveal a fascinating interplay between game-theoretic rationality and human behavior, particularly in the context of sequential decision-making under uncertainty. I'll address your questions systematically, integrating your three experiments and explaining why the backward induction argument fails in practice. The core phenomenon is a deviation from subgame perfect equilibrium due to bounded rationality, social norms, and coordination incentives—manifesting differently across your variations but rooted in the same underlying principles.

  ### **1. Are your three observations one phenomenon or several?**
  They represent **one primary phenomenon**—**delayed termination due to coordination motives and bounded rationality**—but with nuances shaped by game structure:
  - **Fixed-length games (6-turn vs. 20-turn)**: Players delay taking relative to backward induction, but the delay is *anchored to the endpoint*. In 6-turn games, takes occur around turn 4 (2–3 turns from the end); in 20-turn games, around turns 17–18 (also 2–3 turns from the end). This suggests players intuitively grasp the backward induction logic but compress it to a fixed "horizon" (e.g., 2–3 moves) rather than applying it fully.
  - **Random-length game**: The stopping point (turns 16–17) resembles the 20-turn game, implying players default to an **absolute heuristic** (e.g., "wait 16 turns") when deprived of endpoint information. This is not a fixed distance from the end but a learned social norm from repeated play.
    
  **Why one phenomenon?**  
  In all cases, players avoid immediate taking because:
  - They prioritize Pareto efficiency (growing the pot benefits both).
  - They trust opponents to reciprocate delay (avoiding undercutting).
  - Backward induction is cognitively implausible; players use simpler heuristics (e.g., "wait until near the end" or "wait 16 turns").

  The differences arise from **information constraints** (known vs. unknown endpoint) and **social learning** (players adopt turn-16 as a norm from 20-turn games). Crucially, payoffs per move are identical, but context shifts how players coordinate.

  ---

  ### **2. Nearest established concepts, where your case departs, and best fit**
  #### **(A) Centipede Game (Best Fit)**
  - **Concept**: A sequential game where two players alternately pass to grow a pot, with taking ending the game asymmetrically. Backward induction predicts immediate taking, but experimental results show delays.
  - **Fit to your game**: 
    - Your setup is a **deterministic centipede variant** with fixed turns and a split endpoint. The backward induction argument you describe is textbook centipede reasoning.
    - Your observations align with experiments: players pass repeatedly (McKelvey & Palfrey, 1992), often due to altruism, fairness, or belief that opponents are irrational.
  - **Departures**:
    1. **Endpoint rule**: Your split at the final turn adds a cooperative "threat" (no-take → equal split), which amplifies delays. Classic centipede games often lack this.
    2. **Pre-commitment variant**: When players write claims, your game morphs into a **coordination game** (see below), which centipede frameworks don't address.
  - **Why it dominates**: It directly models your sequential structure, payoff growth, and the backward induction paradox. The random-length and fixed-length results match centipede experiments where endpoint uncertainty or fixed horizons induce delays.

  #### **(B) Coordination Game (Pre-commitment Variant)**
  - **Concept**: Players choose actions to align on mutually beneficial outcomes (e.g., Battle of the Sexes). Pareto efficiency drives decisions.
  - **Fit**: In your claim-writing experiment, players ignore backward induction because it becomes a **simultaneous coordination game**. Writing a high number (e.g., 17) is a Schelling point—players expect mutual delay to maximize the pot. Matching yields 50% of a large pot; undercutting risks 40% of a smaller pot.
  - **Departure**: Sequential centipede incentives (e.g., "take now to preempt") vanish. The Nash equilibrium shifts to both choosing high numbers.
  - **Tie to core phenomenon**: Reveals that backward induction's "force" relies on sequential threats. When decisions are simultaneous, coordination motives dominate.

  #### **(C) Unexpected Hanging Paradox (Limited Relevance)**
  - **Concept**: A self-defeating prediction where backward induction creates logical contradictions (e.g., "surprise execution").
  - **Fit**: Both involve recursive reasoning that feels compelling but fails empirically.
  - **Departure**: The paradox is about **belief inconsistency** (the sentence cannot be fulfilled), while your game is about **Pareto inefficiency** of backward induction. Players reject backward induction not because it's paradoxical but because it's mutually harmful. Trust in reciprocity, not logic, drives delays.
  - **Why not primary**: The paradox is epistemological; your game is behavioral. Players don't disbelieve backward induction—they override it for profit.

  #### **Best Overall Fit**: **Centipede Game**  
  It captures the sequential tension, payoff structure, and empirical delays. The pre-commitment variant is a coordination subcase, while the paradox is an analogy.

  ---

  ### **3. Coined Concept: "Horizon-Bounded Rationality"**
  If "centipede game" feels insufficient (due to your endpoint rule), I propose a tighter term for your specific dynamic:  
  - **Term**: **Horizon-Bounded Rationality**  
  - **Definition**:  
    > *In sequential growth games, players exhibit horizon-bounded rationality if they:  
    > (1) Recognize backward induction but truncate its depth to a fixed horizon (e.g., 2–3 moves) due to cognitive limits;  
    > (2) Anchor delays to endpoints when known (e.g., turn N-2), or to absolute heuristics when unknown (e.g., turn 16);  
    > (3) Prioritize Pareto-efficient coordination over subgame perfection.*  
  - **Hard-Case Criteria**:  
    - Applies if:  
      - Growth rate >1 (e.g., 40% pot increase).  
      - Endpoint exists (split or asymmetric taking).  
      - Players have mutual trust (explicit or learned).  
    - **Fails if**:  
      - Growth rate ≤1 (e.g., passing shrinks the pot).  
        - *Why*: Delaying loses value; backward induction holds.  
      - Players can communicate pre-game.  
        - *Why*: They coordinate explicitly (e.g., "wait until turn 18"), removing bounded rationality.  
      - Single player or new opponents each turn.  
        - *Why*: Trust cannot form; backward induction or myopic taking prevails.  
    - **Ambiguous Cases**:  
      - Stochastic growth (e.g., 40% ± 10%): Heuristics may persist if variance is low.  
      - Three players: Trust harder to maintain; delays may shorten.

  ---

  ### **4. Why Backward Induction "Loses Force" in Pre-commitment**
  The argument's power relies on **sequential threats**:  
  - In sequential play, each player fears the opponent will take soon, forcing preemption.  
  - In pre-commitment, the threat vanishes. Players choose simultaneously, so:  
    - Under cutting (e.g., claiming 16 vs. opponent's 17) yields only 60% of a smaller pot.  
    - Matching (both claim 17) yields 50% of a maximized pot → superior.  
    - Over cutting (claiming 18) risks losing entirely.  
  Thus, coordination dominates, and backward induction (which assumes sequential vulnerability) collapses.

  ---

  ### **Synthesis**
  Your experiments expose three layers:  
  1. **Cognitive**: Players simplify backward induction to a 2–3 move horizon.  
  2. **Behavioral**: Social norms (e.g., "turn 16") emerge from repeated play.  
  3. **Structural**: Sequential vs. simultaneous rules alter trust dynamics.  

  The centipede game is the closest fit, but **horizon-bounded rationality** more precisely encapsulates how players truncate reasoning and anchor to endpoints. This resolves your brother-in-law's prisoner's dilemma analogy (your game is sequential, not simultaneous) and the hanging paradox (yours is about efficiency, not inconsistency). 

  To test this, run a variant where passing *shrinks* the pot by 40%: Horizon-bounded rationality predicts immediate taking (no growth incentive), while norms would dissolve. If players still delay, deeper irrationality is at play.
