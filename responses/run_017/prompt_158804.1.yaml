answer: |-
  ### Residue Report: AI Tool vs Agent Debate in Control Engineering Terms  

  | claim (AI debate) | control-engineering restatement | status | what gets lost or smuggled in | verdict |  
  |-------------------|----------------------------------|--------|-------------------------------|---------|  
  | "Tool AI is passive; just an instrument." | Open-loop system: human provides setpoint, executes fixed computation, returns output. No internal model or closed-loop optimisation. | clean | Debate smuggles in "passivity" as lack of *any* autonomy, ignoring that tools can have complex internal models (e.g., MPC). | Gap in debate: conflates reactivity with passivity. |  
  | "Agent AI has goals and acts autonomously." | Closed-loop system with self-contained objective optimisation. Uses internal model for state estimation, computes control actions over time horizon, actuates without human intervention. | distorted | Smuggles anthropomorphism ("goals"). In control terms: it’s a controller that closes its own loop against an exogenous setpoint. | Debate muddled: "autonomy" ≠ agency; PID controllers are autonomous too. |  
  | "Agents are unpredictable!" | Poor stability margins or unmodelled disturbances: controller’s internal model inaccurately predicts state dynamics, leading to constraint violations or instability. | distorted | Loss: engineered systems have stability analyses/constraint enforcement. Smuggled: "unpredictability" as inherent to agency, not poor design. | Debate overrates novelty; this is a standard control problem. |  
  | "You can’t turn off an agent." | Degraded mode failure: system lacks a designed fail-safe interlock (e.g., independent SIS) to force open-loop override when constraints breached. | no counterpart | Control engineering *requires* shutdown layers. Smuggled: false dichotomy that agency implies uncontrollability. | Debate muddled: confuses capability with safety architecture. |  
  | "Agents rewire their own goals." | Endogenous setpoint modification: system dynamically changes its optimisation objective without exogenous input. | no counterpart | No direct analogue; adaptive control tweaks *models*, not objectives. Smuggled: assumes goal-respecification is feasible/inevitable. | Gap in your vocabulary? Not in classical control; debate speculates beyond current systems. |  

  ### Hunches Assessment  
  | hunch | best restatement | does it survive? | what would pin it down properly |  
  |-------|------------------|------------------|--------------------------------|  
  | Loop-closure latency | Planning horizon length in model-predictive control: how many time-steps the system computes ahead of human oversight. | Yes | Measure: max N-step lookahead before human validation. Latency > operational tolerance = "agent-like". |  
  | Endogenous re-specification | Self-modifying setpoint: the controller’s objective function is recursively updated by its own state estimation. | Partially | No current implementation. Pin down: demonstrate closed-loop objective convergence *without* exogenous setpoint adjustment. |  

