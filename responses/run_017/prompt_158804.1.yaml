  ### Explanation  
  - **Bottom Line**: The debate’s core confusion is reframing standard control concepts (closed-loop autonomy, model-predictive horizons) as "agency," while ignoring engineered safeguards. Your hunches are valid: latency (planning horizon) drives perceived agency, and endogenous respecification is purely speculative.  
  - **Verdicts**:  
    - Claims about "tools" vs "agents" are **distorted** by anthropomorphism and loose definitions.  
    - Endogenous goals have **no counterpart** in your field—setpoints are axiomatically exogenous.  
    - Debate’s "unpredictability" and "uncontrollability" fears reflect **poor stability margins** or **missing safety layers**, not inherent agency.  
  - **Hunches**:  
    1. **Latency**: Survives. What’s deemed "agent-like" is often just a long-horizon MPC.  
    2. **Endogenous respecification**: Not observed in practice. Would require recursive objective optimisation—a theoretical gap in your vocabulary, but currently irrelevant to real systems.  

