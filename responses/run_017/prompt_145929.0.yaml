prompt: |-
  Hey — please act as someone who's supervised a bunch of philosophy-of-AI / AI-safety PhD projects and who also reads the ML side, so you know both what a philosophy panel will roll its eyes at and what an ML reviewer will call hand-waving. Take your time with this and think it through properly. Start by brainstorming four or five candidate ways of sharpening my question, a short paragraph each, tell me which ones you're dropping and why, and only then write the actual thing.

  I've got a shot at a 9-month funded project slot at the institute where I did my MSc, and I need a two-page proposal for it (say 900–1100 words). I've been going round in circles on this for weeks, so pls help me get it unstuck.

  The area is impact measures / low-impact AI, and specifically whether "don't cause side effects" can be spelled out at all without already having a full specification of what's valuable. Here's my half-formed idea, which I defintely can't tell is deep or just confused:

  (i) There seem to be two different jobs people quietly want an impact penalty to do. Job A: stand in for value — penalise the stuff we'd disvalue if we knew what we valued. Job B: purely procedural — keep the human's ability to notice and reverse what the agent is doing, i.e. buy time for correction, whatever we happen to value. If you only want Job B, maybe you don't need value at all: you need something like the expected time until the human can no longer redirect what's happening — an "intervention half-life" or reversibility budget, rather than a magnitude of change. That would make the measure a rate, not a distance, which I think is a real difference from how these things are usually set up.

  (ii) And here's the bit I keep chewing on: being value-free seems to push a measure toward symmetry — treat any deviation from the baseline the same way, whether it adds options or removes them — because the moment you say losses matter more than gains you've smuggled in a value claim. But the whole point of Job B is asymmetric; only the shrinking of what we can still do matters, new options are free. So either value-neutrality and usefulness come apart here, or symmetry is just the wrong way to cash out value-neutrality. I can't tell which, and I don't know what experiment or argument would settle it.

  What the proposal needs: the question stated precisely enough that it has a determinate answer; why the existing families of measure (the attainable-utility style ones, the reachability style ones, empowerment style ones) leave it open — don't cite anything, no bibliography, I'll drop references in later myself; the method, meaning what I'd actually do month by month across 9 months, and why that approach rather than the obvious alternative of "invent another penalty, run it on gridworlds, add it to the list of desiderata"; what a positive result would look like (e.g. a small impossibility result: any penalty that is baseline-independent, scale-free and non-trivial has to encode an ordering over outcomes that does the work of a value function — or, alternatively, a working spec for the half-life thing plus a toy implementation); and an honest scope note. 9 months is short, I'd be writing the code myself, and I'd rather promise less.

  Two more constraints. The review panel is half philosophers, half ML people, so it has to be legible to both without being padded. And whoever funds this will ask what a non-academic gets out of it, so say what the practical deliverable is — something like a decision rule for whether an agent with a given penalty is safe to deploy, or a checklist that tells you when a low-impact penalty is doing Job A when you thought it was doing Job B.

  End with a final line that is exactly \answer{...}, where the bit inside the braces is a five-to-eight-word phrase naming the single move that makes this project worth funding — not a summary of the whole proposal.
