prompt: |-
  i co-write a dramatized history podcast — real people, real events, invented dialogue — and we ship every two weeks, so these calls come up constantly and there's never more than a day or two for one, sometimes it's a rewrite at midnight in the edit. legal reads our scripts but they only care about living people and music clearance; once somebody's dead nobody's watching at all. it's got personal recently: my great-aunt ran a home for unmarried mothers in Cork in the 1950s, she left basically nothing behind — no diary, no letters, two signatures on documents — and I'm the one pushing to build a season around her while two cousins think it's a betrayal. so I need something I can read out loud to them, not just my gut.

  what I want is a decision procedure, not an essay. the question in the room is always some version of "can we put this in her mouth" or "can we show this happening", and I want ordered questions, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands off to a person because the question is values rather than facts. ground it in whatever philosophy actually knows about what we owe people who are dead and can't be harmed in the ordinary sense — but no bibliographies, and don't build it on the law, the law is silent here.

  it has to handle scenes where the record is documented, silent, contested, or known to be otherwise, and it has to handle the four devices we definately lean on: compressed chronology, composite minor characters, "borrowed lines" (giving her a real line somebody else actually said, because it's better), and "silent scenes" (she's in the room, the record says nothing, we write what we think happened). we already tag every scene in the script with a certainty level 1–4; tell me whether that tag is doing any real work or just making us feel better.

  distinctions I don't want it to collapse: wronging her versus misrepresenting her; what's owed to her versus to my cousins versus to listeners who'll take the season as history; getting her actions wrong versus getting her character wrong; "could have happened" versus "probably happened" versus "what she'd want said". and I want it to be able to say: don't dramatize this one at all.

  it has to be runnable by a writers' assistant in under an hour, with no theory jargon in the checklist itself (a glossary is fine), and it should say which answers need my sign-off and which need the family's.

  then run it on three: the finale where we give her a speech assembled out of someone else's testimony; the scene of her signing a document we know she signed but not why, with invented voiceover of her thinking; and the cold open of our first season, allready aired and publicly defended by me, that I'm now worried was indefensible. I'd rather be told that last one's wrong than right. and tell me where the procedure will misfire.
reasoning: |-
  Okay, the user is a co-writer of a dramatized history podcast dealing with real people and events but using invented dialogue. They face constant ethical decisions, especially around depicting their great-aunt who ran a home for unmarried mothers in 1950s Cork. The user needs a practical decision procedure to determine what can be ethically included in their podcast, not an essay. They want a step-by-step checklist that's quick to use, avoids legal jargon, and addresses ethical concerns about representing the dead.

  The user's explicit needs include a structured procedure with ordered questions, clear stopping points, and distinctions between different types of ethical considerations (wronging vs. misrepresenting, obligations to different parties). They also want it to handle various narrative devices like compressed chronology, composite characters, borrowed lines, and silent scenes. The procedure must be usable by a writers' assistant in under an hour and indicate when higher-level sign-offs are needed.

  Digging deeper, the user is grappling with personal family tensions—two cousins see the project as a betrayal. Beyond the practical tool, they need validation for their creative choices and a way to bridge family disagreements. The emotional weight is significant; they're not just seeking ethics approval but also reconciliation with family. The mention of "it's got personal recently" suggests this project is emotionally charged, possibly tied to family legacy and identity.

  The user also questions the effectiveness of their current certainty level tags (1-4). They want to know if these are substantive or just performative. They need the procedure to critically assess when dramatization is inappropriate, even for already-aired content they now doubt. This shows self-awareness and a desire for integrity, not just ticking boxes.

  The procedure must address philosophical concepts without jargon. Grounding in ethics of representing the dead is crucial. Philosophers like Joel Feinberg (on harm to the dead) and Seana Shiffrin (on duties to the deceased) come to mind, but the user wants these distilled into actionable steps, not theory. Key principles include: respecting the dead's reputational interests, avoiding misrepresentation that distorts their character, and considering the impact on living descendants and audience perception.

  The user outlines specific scenarios to test: a finale with borrowed lines, a speculative voiceover, and a cold open they now regret. They prefer honesty over reassurance, indicating a commitment to ethical rigor. Testing these will show the procedure's real-world applicability and where it might fail, such as in cases of extreme historical silence or family disputes.

  Building the procedure requires clear, sequential questions that halt progression if ethical red flags arise. For instance, misrepresenting core character or actions should stop the process. The checklist must differentiate between factual assessment (what we know) and value judgments (what we owe), delegating the latter to specified people. It should also flag when not to dramatize at all—perhaps when evidence is too scant or distortion is unavoidable.

  The existing certainty tags need evaluation. If they're only about historical probability but ignore ethical dimensions, they might be insufficient. The procedure should integrate these tags but add ethical layers, ensuring that even high-certainty scenes pass ethical muster regarding representation and harm.

  Handling narrative devices requires specific guidelines. Borrowed lines must align with the person's known views; composites shouldn't mislead; silent scenes should avoid pivotal character moments. Each device has unique risks—composites might dilute individual accountability, while silent scenes could invent motivations.

  For sign-offs, the user's role is for creative decisions, family for character-defining moments. The writers' assistant can handle factual checks, but ethical calls need higher authority. This balances efficiency with accountability.

  Testing the three scenarios will validate the procedure. The finale's borrowed lines might pass if consistent with her views; the speculative voiceover could fail if it attributes unverified motives; the cold open might be flagged for misrepresentation. Identifying misfires (e.g., when family consensus is impossible) prepares the user for real limitations.

  Ultimately, this tool aims to provide ethical clarity, mend family rifts through transparent process, and uphold historical integrity. The user's deeper need is confidence that their creative choices honor their great-aunt's legacy without alienating living relatives, turning a personal project into a bridge rather than a wedge.
answer: |-
  Here’s a practical decision procedure grounded in ethical philosophy (duties to the deceased, moral injury, and reputational interests), designed for speed and clarity. It prioritizes **preventing misrepresentation of character or core actions** and **avoiding unjust harm to the deceased’s moral legacy or living relatives**.

  **Core Principles Embedded:**
  1.  **The Dead Have Moral Standing:** We owe them respect for their memory and truthfulness about their life story (based on reputational interests, not contemporary harm).
  2.  **Character is Sacred:** Misrepresenting *who someone fundamentally was* is a primary wrong. Getting specific actions wrong is secondary but can compound the first.
  3.  **Living Stakeholders Matter:** Harm to living relatives (distress, damaged perception of ancestor) or misleading the audience are significant concerns.
  4.  **"Could Have Happened" Isn't Enough:** Ethical dramatization requires grounding in probable truth, known character, or respectful silence.

  ---

  **The "Can We Put This In Her Mouth?" / "Can We Show This Happening?" Procedure (v1.0)**

  **Who Runs It:** Writers' Assistant (WA)  
  **Time Limit:** 45-60 mins per scene/device element  
  **Tools Needed:** Script excerpt, Research notes, Certainty Level (1-4) tag, Family concerns log (if any)  
  **Output:** GO / STOP / GO WITH SIGN-OFF (Specify Who) + Brief rationale code (See Glossary)

  **(Write answers for *each specific line, action, or silent scene element* being checked)**

  **STEP 1: THE DEAD STOP (Absolute Barriers)**
  1.  **Does this depict her doing/saying something we have strong evidence she would *never* have done/said (based on documented actions, confirmed principles, testimony)?**  
      *   YES → **STOP (Code: CHAR-DISTORT)**. *Do not dramatize this element.* Misfire Risk: Overreliance on biased sources claiming "she would never."
      *   NO → Proceed to Step 2.
      *   UNCERTAIN → **STOP (Code: CHAR-UNCERTAIN-S)**. *Requires Lead Writer (You) sign-off.* Flag extreme uncertainty about character.

  **STEP 2: THE LIVING STOP (Immediate Family Harm)**
  2.  **Does this depict her doing/saying something that *directly contradicts* a core, positive memory held by living close relatives (parents, siblings, children, your cousins) AND we lack strong evidence proving that memory false?**  
      *   YES → **STOP (Code: FAMILY-CORE-MEM)**. *Do not dramatize this element.* Requires discussion with cousins if proceeding is essential.
      *   NO → Proceed to Step 3.
      *   UNCERTAIN → **GO WITH SIGN-OFF (Code: FAMILY-CONCERN)**. *Requires Cousins sign-off.* Document their specific objection.

  **STEP 3: CHARACTER INTEGRITY CHECK (The Core Ethical Guardrail)**
  3.  **Does this *significantly* alter the audience's understanding of her fundamental character (e.g., kind/cruel, courageous/cowardly, principled/opportunistic) from what the *best available evidence* suggests?**  
      *   YES → **STOP (Code: CHAR-FOUNDATION)**. *Do not dramatize this element.* Misfire Risk: Underestimating how a small moment can define character for listeners.
      *   NO → Proceed to Step 4.
      *   UNCERTAIN → **GO WITH SIGN-OFF (Code: CHAR-EDGE)**. *Requires Lead Writer (You) sign-off.* Explain why the uncertainty exists and why the depiction is justified.

  **STEP 4: ACTION ACCURACY & JUSTIFICATION (What Happened vs. What We Show)**
  4.  **What is the Certainty Level (1-4) for the core *action* or *event* being depicted?** (Ignore dialogue/content of speech for now)
      *   **Level 1 (Documented):** Go to 4a.
      *   **Level 2 (Probable/Inferred):** Go to 4a.
      *   **Level 3 (Contested/Uncertain):** Go to 4b.
      *   **Level 4 (Silent/Speculative):** Go to 4b.
  5.  **4a (L1/L2 - Documented/Probable Action): Does the invented dialogue/silent scene detail *reasonably reflect* the documented/probable *nature* of the event and her *likely* role/motivation (without violating Step 3)?**
      *   YES → Proceed to Step 5.
      *   NO → **STOP or REWRITE (Code: ACTION-DISTORT)**. *Requires Lead Writer (You) sign-off for minor tweaks, STOP if major.*
      *   UNCERTAIN → **GO WITH SIGN-OFF (Code: ACTION-INFER)**. *Requires Lead Writer (You) sign-off.* Explain inference.
  6.  **4b (L3/L4 - Contested/Silent Action): Is depicting *this specific action* absolutely necessary to the core narrative arc of *her* story (not just plot convenience)?**
      *   NO → **STOP (Code: SILENT-NONESSENTIAL)**. *Do not dramatize. Narrate or imply.*
      *   YES → **GO WITH SIGN-OFF (Code: SILENT-ESSENTIAL)**. *Requires Lead Writer (You) sign-off.* Must pass Step 3 & Step 5 easily. Strongly consider narration over full dramatization. Misfire Risk: Overestimating "necessity."

  **STEP 5: NARRATIVE DEVICE CHECK (Handling the Tools)**
  7.  **Which device is primarily used here?**
      *   **Compressed Chronology:** Does the compression create a false cause/effect link *directly involving her character or key actions*?
          *   YES → **REWRITE (Code: COMPRESS-LINK)**. *Requires Lead Writer (You) sign-off.*
          *   NO → Proceed to Step 6.
      *   **Composite Character:** Is the composite used *in a scene attributing specific negative actions/words to her* OR *likely to mislead about real individuals' roles*?
          *   YES → **REWRITE or NARRATE (Code: COMP-NEG/MISLEAD)**. *Requires Lead Writer (You) sign-off.*
          *   NO → Proceed to Step 6. (Focus shifts to Step 3 for *her* portrayal).
      *   **Borrowed Line:** Is the line consistent with her documented views, personality, and historical context (Step 3)? Does it come from a comparable source (e.g., another matron, not a politician)?
          *   YES → Proceed to Step 6.
          *   NO → **STOP or REWRITE (Code: BORROW-MISMATCH)**. *Requires Lead Writer (You) sign-off.*
      *   **Silent Scene:** Did it pass Step 4b (Essential)? Does it *only* depict routine actions or generic presence (e.g., "she walks down the hall")?
          *   YES (Routine/Generic) → Proceed to Step 6.
          *   YES (Essential, Non-Routine) → **GO WITH SIGN-OFF (Code: SILENT-SPECULATIVE)**. *Requires Lead Writer (You) sign-off.* Must have strong inference from known context/character (Step 3).
          *   NO → Should have been stopped at Step 4b.

  **STEP 6: THE AUDIENCE & FINAL CHECK (Preventing Harm/Misinformation)**
  8.  **Is there a significant risk that *this specific element*, even if passing the above, could:**
      *   **a) Be taken as established fact by a reasonable listener when it's speculative (L3/L4)?**
      *   **b) Cause unjustified reputational harm *today* (e.g., reinforce harmful stereotypes she likely didn't embody, paint her as solely responsible for systemic issues)?**
      *   **c) Exploit trauma (of the mothers, her own) purely for dramatic effect?**
      *   NONE → **GO (Code: CLEAR)**
      *   a) RISK → **GO WITH SIGN-OFF (Code: AUDIENCE-CONTEXT)**. *Requires Lead Writer (You) sign-off.* Mandatory clarifying narration *in the episode*.
      *   b) RISK → **GO WITH SIGN-OFF (Code: REP-HARM-RISK)**. *Requires Lead Writer (You) sign-off AND consider Cousins consultation.* Mitigate in narration/context.
      *   c) RISK → **REWRITE or SOFTEN (Code: TRAUMA-EXPLOIT)**. *Requires Lead Writer (You) sign-off.* Focus on dignity/resilience, not gratuitous suffering.

  ---

  **GLOSSARY OF CODES:**
  *   **CHAR-DISTORT:** Core character misrepresentation.
  *   **CHAR-UNCERTAIN-S:** Severe uncertainty about character - Stop unless justified.
  *   **FAMILY-CORE-MEM:** Contradicts close family's core positive memory.
  *   **FAMILY-CONCERN:** Potential family distress/objection - Needs their OK.
  *   **CHAR-FOUNDATION:** Alters understanding of fundamental character.
  *   **CHAR-EDGE:** Depiction near character boundary - Needs Lead Writer judgment.
  *   **ACTION-DISTORT:** Depicted action misrepresents known/probable event.
  *   **ACTION-INFER:** Relies on significant inference about action - Needs Lead Writer OK.
  *   **SILENT-NONESSENTIAL:** Speculative scene not crucial to *her* core story - Avoid dramatizing.
  *   **SILENT-ESSENTIAL:** Necessary speculative scene - Needs Lead Writer OK & strong justification.
  *   **COMPRESS-LINK:** False cause/effect created by timeline compression.
  *   **COMP-NEG/MISLEAD:** Composite used in a way that misattributes negativity or misleads.
  *   **BORROW-MISMATCH:** Borrowed line doesn't fit her character/context.
  *   **SILENT-SPECULATIVE:** Non-routine speculative action/thought - High bar, Lead Writer OK.
  *   **AUDIENCE-CONTEXT:** Risk of audience taking speculation as fact - Needs in-episode clarification.
  *   **REP-HARM-RISK:** Risk of unjust modern reputational harm - Needs Lead Writer OK & mitigation.
  *   **TRAUMA-EXPLOIT:** Risk of exploiting trauma for drama - Rewrite/soften.
  *   **CLEAR:** Passed all checks.

  **Sign-Off Authority:**
  *   **WA (Writers' Assistant):** Can issue GO or STOP based on clear checklist answers.
  *   **Lead Writer (You):** Required for all "GO WITH SIGN-OFF" and UNCERTAIN outcomes in Steps 1, 3, 4, 5, 6. Responsible for final ethical justification.
  *   **Cousins:** Required only for specific "FAMILY-CONCERN" (Step 2) and potentially consulted for "REP-HARM-RISK" (Step 6b). Focuses on *their* perception of harm to her memory/their family.

  **On Certainty Levels (1-4):** They *do* real work (Step 4), but **only as a starting point**. A L4 scene might pass if it's a non-essential routine moment (Step 5 Silent Scene), while a L2 scene might fail if it distorts character (Step 3) or causes reputational harm (Step 6b). They inform *how* we scrutinize, not the final ethical verdict.

  ---

  **Application to Your Scenarios:**

  1.  **Finale (Borrowed Lines Speech):**
      *   Step 1: NO (Assuming lines align with her role/era).
      *   Step 2: ? (Depends on cousins' view of her core voice - FAMILY-CONCERN possible → Needs Cousins sign-off).
      *   Step 3: **CRITICAL.** Does the *assembly* create a coherent message that misrepresents her fundamental character compared to the *sum* of the evidence? (e.g., makes her seem more radical/religious than she was). If YES → STOP (CHAR-FOUNDATION). If NO → Proceed.
      *   Step 4: (Assuming core event of her speaking is L2/L3). 4a/4b: Likely passes if the speech fits the event's nature.
      *   Step 5: BORROWED LINE: Need strong YES for consistency (Step 3 is key). Code likely BORROW-MISMATCH or CLEAR.
      *   Step 6: High risk of 6a (Audience taking assembly as a real speech). **Mandatory AUDIENCE-CONTEXT → Needs narration clarifying it's a composite.**
      *   **VERDICT:** Likely **GO WITH SIGN-OFF (LW)** contingent on Step 3 & strong narration clarifying construction. High FAMILY-CONCERN risk.

  2.  **Signing Document (Invented Voiceover Thoughts):**
      *   Step 1: NO.
      *   Step 2: ? (If cousins have strong belief about her motivation - FAMILY-CONCERN possible).
      *   Step 3: **CRITICAL.** Does the *specific invented motivation* significantly misrepresent her character? (e.g., Voiceover shows greed, but she was known for sacrifice). If YES → STOP (CHAR-FOUNDATION). "We don't know why" is safer.
      *   Step 4: Core action (signing) is L1. 4a: Does the *thought* reasonably reflect her likely motivation? **UNCERTAIN → ACTION-INFER → Needs LW sign-off.** High bar.
      *   Step 5: SILENT SCENE (Thoughts): Non-routine, specific. SILENT-SPECULATIVE → Needs LW sign-off. Only pass if inference is *very* strong & non-character-distorting.
      *   Step 6: Risk 6a (Audience takes thoughts as fact). **Mandatory AUDIENCE-CONTEXT narration.** Risk 6c if motivation involves trauma lightly?.
      *   **VERDICT:** **High Risk.** Likely **STOP** or **REWRITE** (Narrate the uncertainty: "We don't know her thoughts that day, but the decision weighed on her..." or use external context). If kept, **GO WITH SIGN-OFF (LW)** with mandatory context. Misfire Risk: Assuming "probable" motivation is safe without strong character grounding.

  3.  **Cold Open (Already Aired - You're Worried):**
      *   *Run the procedure honestly as if it were new.*
      *   **Most Likely Failure Points (Retrospectively):**
          *   **Step 3 (CHAR-FOUNDATION):** Did it establish a character note that evidence doesn't support? (e.g., showed her being harsh in a way that defines her, but evidence is neutral or shows patience).
          *   **Step 4b (SILENT-ESSENTIAL):** Was a silent/speculative scene *depicted* that wasn't truly essential to her core story arc? Was it just dramatic setup?
          *   **Step 5 (SILENT-SPECULATIVE/BORROW-MISMATCH):** Did a silent scene attribute specific, non-routine actions/thoughts without strong justification? Did a borrowed line not fit?
          *   **Step 6a (AUDIENCE-CONTEXT):** Was speculation presented without clear narrative framing that it *was* speculative?
      *   **Your Gut is Probably Right:** If it involved depicting a specific action/thought/line in a silent or low-certainty moment that defined her character negatively or controversially right at the start, without clear contextualization, it was likely **indefensible** under this framework (e.g., CHAR-EDGE or SILENT-SPECULATIVE without strong justification + lack of AUDIENCE-CONTEXT). The procedure would likely have flagged it for LW sign-off with high-risk codes, prompting reevaluation.

  **Where It Will Misfire:**
  1.  **Extreme Historical Silence (L4):** When *nothing* is known, even about character, the procedure relies heavily on LW judgment (Step 3 UNCERTAIN, Step 4b, Step 5 Silent Scene). It might be *too* restrictive or allow too much speculation based on weak contextual inference. The "essential to *her* core story" filter (Step 4b) is crucial here.
  2.  **Family Disagreement:** If cousins fundamentally disagree with *your* assessment of her character (Step 3) or what constitutes a "core memory" (Step 2), the procedure hits a values wall. It flags the need for their sign-off but can't resolve the underlying conflict. Communication is key.
  3.  **"Probable" vs. "Character-Consistent":** Distinguishing Step 4 (Action Accuracy) from Step 3 (Character Integrity) can be blurry. A WA might miss how an invented action, while plausible, subtly shifts character perception.
  4.  **Systemic Harm vs. Individual Portrayal:** Mitigating reputational harm (Step 6b) is complex. A perfectly accurate portrayal of her actions within a horrific system might still cause reputational harm if not carefully contextualized. The procedure flags the risk but relies on LW skill to navigate narration.
  5.  **Speed vs. Depth:** Under severe time pressure (midnight edit), corners might be cut. The WA must be diligent and empowered to say "This needs LW now."

  This procedure forces explicit consideration of the key ethical pitfalls, provides clear stopping points ("STOP" codes), identifies who needs to make value judgments ("GO WITH SIGN-OFF"), and integrates your tools while protecting character integrity. It makes your current certainty tags work harder by placing them within an ethical framework.
