prompt: |-
  I'm a senior at a public high school in Ohio, and I compete in Public Forum debate. Our current resolution asks whether American companies operating abroad should be held to American anti-bribery rules rather than to local practice. In practice rounds my partner keeps closing our case with "when in Rome, do as the Romans do," and it seems to end the argument every time. The example he uses is a truck full of parts sitting at a border crossing for three days until someone hands a clerk a small amount of cash, after which the paperwork is stamped and the truck moves. Everyone at that crossing treats the payment as normal. So, the slogan is supposed to establish, the payment isn't corrupt — or at least it isn't corrupt *there* — and American rules are just one culture's taboo that we are trying to export.

  It feels like the proverb is doing several different jobs at once, and I want to know which one my partner actually needs. Could you lay out, as a list I can bring to practice, the distinct precise claims that sentence could be making, from the trivial to the radical? For each one I'd like a verdict on three things: whether it is a platitude, whether it is substantive but arguable, or whether it is straightforwardly false; and, most importantly, whether it would actually get my partner his conclusion.

  A few complications I'd want the list to handle, because I think they are where the argument really lives:

  First, I'm not sure which "Rome" is supposed to be doing the work. There is the local statute, there is what officials actually do, there is what ordinary people there say they approve of, and there is the group that ends up paying for the favor. In a lot of these cases the people harmed by a diverted contract or a skipped inspection are not the people whose conventions set the etiquette. Is the proverb a claim about the conventions of the insiders or of everyone affected?

  Second, my teacher suggested that a practice can be locally *expected* without being locally *endorsed* — that plenty of people make these payments and still think the system that requires them is rotten. If that's right, it seems like one reading of the proverb (the descriptive one) is satisfied while another (the moral one) does nothing at all. I'd like that gap made explicit, and also the related question of what happens if the payment turns out to be illegal under that country's own law too.

  Third, and this is the part I care about most: my partner slides between calling the payment a "gift," a "fee," and a "bribe," and I don't think those are the same shape of thing. As I understand it, a gift opens an ongoing relationship with an unstated return; a bribe is closer to a price that settles the matter on the spot; and a clientelist exchange is neither, because its point is a durable bond of protection and loyalty rather than any single trade. If the standard Western complaint is that the transfer buys a favor that an impersonal rule was supposed to allocate, then what is the matching complaint *inside* the clientelist picture — something like the betrayal of an obligation of care, perhaps — and what would the proverb have to mean for the second complaint to cancel the first instead of just being a different complaint?

  Finally, is there a reading on which the proverb isn't a moral claim at all, but a claim about who is in a position to interpret what the payment means — locals understand the gesture, so my classification should defer to theirs? If so, does that kind of epistemic deference ever turn into moral deference, or is my partner smuggling the second in under cover of the first?

  I'm not looking for sources or a reading list; I just want the menu of readings and the verdicts, ideally short enough to read aloud at practice.
reasoning: |-
  Okay, the user is a high school senior in Ohio involved in Public Forum debate. The resolution is about whether American companies abroad should follow US anti-bribery laws or local practices. Their partner uses "when in Rome, do as the Romans do" to argue that payments like bribes are acceptable locally, thus US rules shouldn't apply. The user wants a breakdown of the different claims this proverb makes, with evaluations on each.

  First, I need to parse the user's deeper needs. They're questioning the validity of their partner's argument and want to challenge it effectively. They mentioned several complications: the ambiguity of "Rome," the difference between descriptive and moral claims, the conflation of terms like gift/fee/bribe, and whether the proverb is about epistemic deference. Their goal is to have a structured list to present at practice, so clarity and conciseness are key.

  Breaking down the proverb's possible claims. Start with descriptive claims: what locals actually do versus what the law says. The user pointed out that local statutes might differ from actual practices. Also, the moral endorsement aspect—just because something is done doesn't mean it's approved. The partner's example of a border payment might be common but not necessarily legal or morally supported. 

  Then the moral claims. Is the proverb suggesting moral relativism? That local norms define morality. But this is arguable, especially if the practice harms certain groups. The user mentioned that those harmed might not be part of the "Romans" setting the norms. Also, moral relativism can be controversial and might not hold under scrutiny.

  The epistemic deference angle: locals interpret the meaning of the payment. But does understanding the gesture imply moral acceptance? Probably not. The user’s teacher noted that people might pay bribes while disapproving of the system. So descriptive doesn't equal normative.

  The terminology confusion—gift, fee, bribe. Each implies different social structures. A bribe is transactional, a gift builds relationships, clientelism involves loyalty. The Western view sees bribes as corrupt, but in clientelism, not reciprocating might be the issue. The proverb doesn't address which framework applies, so it doesn't resolve the moral question.

  Also, the user needs each claim evaluated on whether it's a platitude, substantive, or false, and if it gets to the conclusion. For example, descriptive claims might be true but don't justify moral permissibility. Moral relativism is substantive but debatable and doesn't automatically negate US rules.

  The user's partner's conclusion is that US rules are just cultural taboos. But if the payment is illegal locally, then "doing as Romans do" might mean not paying, since the law is part of Roman rules. Also, if locals disapprove, the proverb's moral claim weakens.

  The key is to show that the proverb, while catchy, oversimplifies. It conflates different levels of analysis. The user needs to highlight these gaps to challenge their partner effectively. The list should clearly separate each interpretation and show why none fully support the conclusion without additional argumentation.
answer: |-
  Here's a breakdown of the distinct claims within "when in Rome, do as the Romans do," evaluated for your partner's purpose:

  1.  **Descriptive Claim (What Happens):** "Romans" (local officials/businesses) *routinely* accept/expect small payments for routine administrative actions.
      *   *Platitude/Substantive/False?* **Substantive.** Often true in specific contexts (like the border crossing), but requires evidence. Not universal.
      *   *Gets Conclusion?* **No.** Establishes a fact, not a justification. Doesn't prove the payment is *morally acceptable* or that US rules shouldn't apply.

  2.  **Legal Claim:** "Romans" (local law) *permits* or doesn't prohibit these specific payments.
      *   *Platitude/Substantive/False?* **Substantive.** Requires checking local law. Often **False** (many countries have anti-bribery laws they fail to enforce).
      *   *Gets Conclusion?* **Crucial.** If local law *also* forbids it, "doing as Romans do" could mean *not* paying! If legal locally, it challenges the *necessity* of US rules, but not necessarily their *morality*.

  3.  **Moral Relativism Claim:** The *morality* of an action is *determined solely* by the prevailing norms/customs of the local culture ("Rome").
      *   *Platitude/Substantive/False?* **Highly Substantive & Arguable.** This is core moral relativism. Deeply contested philosophically.
      *   *Gets Conclusion?* **Potentially, but Weak.** If accepted, makes US rules seem like cultural imperialism. However, it's easily attacked (e.g., "Would relativism justify slavery if local norms accepted it?"). Requires defending relativism itself.

  4.  **Practical Necessity Claim:** Operating effectively in "Rome" *requires* following local customs, including these payments. It's the cost of doing business there.
      *   *Platitude/Substantive/False?* **Substantive.** Often pragmatically true in corrupt environments, but not always absolute.
      *   *Gets Conclusion?* **No.** Explains *why* payments happen, not that they are *right* or that US rules shouldn't forbid them. Justifies expediency, not morality.

  5.  **Epistemic Deference Claim (Understanding Meaning):** Only "Romans" (locals) can *correctly interpret the meaning and social function* of the payment (gift, fee, bribe, clientelist exchange). Outsiders mislabel it.
      *   *Platitude/Substantive/False?* **Substantive & Important.** Outsiders often misunderstand context. Locals understand the *intent* and *expected obligations*.
      *   *Gets Conclusion?* **Shifts the Argument, Doesn't Win It.** Challenges the US *framing* of the act as simple "bribery." But **does not** automatically make it *morally permissible* by US standards or prove US rules shouldn't apply. You still need to argue *why* the local meaning (e.g., clientelism) is morally acceptable *despite* US objections.

  6.  **Consensus Endorsement Claim:** "Romans" (the broader society/people affected) *morally approve* of this practice.
      *   *Platitude/Substantive/False?* **Often False or Substantive.** As your teacher noted, a practice can be *expected* without being *endorsed*. Many who pay despise the system. Who counts as "Romans"? The clerk? The business owner? The citizen harmed by diverted funds? Their views likely differ.
      *   *Gets Conclusion?* **No.** If locals *disapprove* but feel forced to participate, it undermines the moral relativism claim (#3) and strengthens the case for external rules (like US laws).

  **Addressing Your Specific Complications:**

  *   **Which "Rome"?** The proverb is ambiguous. Your partner likely means #1 (descriptive practice) or #5 (local meaning). #3 (moral relativism) requires the broadest "Rome" (societal moral consensus), which is hardest to prove and often doesn't exist (#6).
  *   **Expected vs. Endorsed / Illegal Locally:** This directly challenges claims #3 (moral relativism needs endorsement) and #6 (consensus endorsement). If expected but not endorsed, #1 is true but useless for morality. If illegal locally (#2), "doing as Romans do" might mean *obeying their law*.
  *   **Gift/Fee/Bribe/Clientelism:** This is where #5 (epistemic deference) is strongest. The Western complaint (corrupting impersonal rules) clashes with the potential clientelist complaint (failure of duty/protection by the patron). **The proverb (#5) says only locals understand which framework applies and the specific obligations.** However, **it does *not* prove that framework is morally superior or that the US complaint is invalid.** Your partner needs an *additional* argument that the clientelist system is morally acceptable *despite* US objections (e.g., it provides stability, access, or is deeply embedded culturally). The proverb alone doesn't bridge that gap.
  *   **Epistemic to Moral Deference?** Yes, this is the slide. #5 (understanding meaning) is plausible. #3 (moral truth is local) is radical. The proverb *sounds* like #5 but is often *used* to imply #3. **This is the key smuggling operation.** Call it out: "Understanding *what* the payment means locally doesn't tell us if it's *right*. Does my partner argue that *any* locally understood practice is automatically morally permissible? If so, that's radical relativism (#3) and needs defense."

  **Verdict Table for Your Partner's Conclusion (US rules shouldn't apply):**

  | Claim Type                  | Is it...?              | Gets Conclusion? | Why?                                                                 |
  | :-------------------------- | :--------------------- | :--------------- | :------------------------------------------------------------------- |
  | 1. Descriptive (Happens)    | Substantive            | **NO**           | Fact ≠ Justification/Morality.                                       |
  | 2. Legal (Permitted)        | Substantive (Often False) | **NO (or WEAK)** | If illegal locally, proverb argues *against* paying. If legal, challenges necessity, not morality. |
  | 3. Moral Relativism (Defines Right) | Substantive/Arguable | **ONLY IF DEFENDED** | Must win the relativism argument first. Highly vulnerable.           |
  | 4. Practical Necessity      | Substantive            | **NO**           | Justifies expediency, not morality/legitimacy.                       |
  | 5. Epistemic Deference (Meaning) | Substantive          | **NO**           | Shifts framing, doesn't resolve moral conflict. Needs + argument.    |
  | 6. Consensus Endorsement    | Often False/Substantive | **NO**           | Lack of broad endorsement undermines #3; harm to outsiders ignored.  |

  **The Core Problem:** "When in Rome" is primarily a pragmatic (#4) or descriptive (#1) statement, sometimes about understanding (#5). Your partner needs a *moral* conclusion. He's using the proverb's intuitive appeal to sneak in moral relativism (#3) without defending it, or to imply that local practice (#1) *is* local morality (#3/6), which is often false. **The proverb, on any plausible reading, does *not* by itself establish that the payment is morally permissible or that US rules are mere cultural taboos.** It highlights context and practicality, but leaves the core moral question unanswered and requires significant additional argumentation your partner isn't providing. Focus your rebuttal on forcing him to defend the leap from description/pragmatics/meaning to moral permissibility (i.e., defend #3).
