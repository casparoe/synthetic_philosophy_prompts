  ### Case Design: Courier Delivery Dilemma

  **Scenario:**  
  A courier is in an unfamiliar city to deliver a package. The package is either for Building X or Building Y (she is unsure which). She is currently in one of two districts (District A or District B) and does not know which. Each building has two entrances (Front or Back), but only one is open at a given time. The courier receives a radio message: "If the package is for Building X, then the Front entrance is open." She must choose an action immediately based on her updated beliefs.

  **Closeness Structure:**  
  The closeness ordering over states is defined by:  
  - **Sphere 0 (closest):** The actual state.  
  - **Sphere 1:** States differing only in the district (same building, same entrance).  
  - **Sphere 2:** States with the same building but a different entrance (any district).  
  - **Sphere 3 (farthest):** States with a different building (any entrance, any district).  

  **Justification:**  
  Changing districts is a minor geographic variation (e.g., moving between adjacent blocks). Changing the entrance status is a more significant change to the delivery method. Changing the building is a major change, as it involves a different destination. This reflects real-world spatial and functional similarity.

  **State Space:**  
  Generated by three binary variables:  
  - \(A\): Package for Building X? (\(A = \text{true}: \text{X}, A = \text{false}: \text{Y}\))  
  - \(B\): Front entrance open? (\(B = \text{true}: \text{Front}, B = \text{false}: \text{Back}\))  
  - \(C\): In District A? (\(C = \text{true}: \text{A}, C = \text{false}: \text{B}\))  

  **Prior Probabilities (Non-Uniform):**  
  Each state has prior probability:  
  - \(P(\neg A, \neg B, C) = 8/32\)  
  - \(P(\neg A, \neg B, \neg C) = 8/32\)  
  - \(P(A, B, C) = 4/32\)  
  - \(P(A, B, \neg C) = 4/32\)  
  - \(P(A, \neg B, C) = 2/32\)  
  - \(P(A, \neg B, \neg C) = 2/32\)  
  - \(P(\neg A, B, C) = 2/32\)  
  - \(P(\neg A, B, \neg C) = 2/32\)  

  **Evidence:**  
  Learned conditional: "If \(A\) then \(B\)" (i.e., if package for Building X, then Front entrance open). No other information; must act immediately.

  **Acts and Payoffs (Probabilistically Irrelevant to States):**  
  - **Act 1:** Deliver to Building X via Front entrance. Payoff: 10 if \(A \land B\), 0 otherwise.  
  - **Act 2:** Deliver to Building Y via Front entrance. Payoff: 10 if \(\neg A \land B\), 0 otherwise.  
  - **Act 3:** Leave package at central office. Payoff: 3 always.  

  Acts do not affect states (e.g., choosing an entrance doesn’t change which is open).

  ---

  ### Computations and Verdict

  **Posteriors and Expected Utilities (EU):**  
  After learning "if \(A\) then \(B\)", both rules set \(P(A \land \neg B) = 0\) and \(P(\text{conditional}) = 1\), but disagree on other probabilities.

  1. **Conditioning on Material Conditional (\(\neg A \lor B\)):**  
     - Eliminates \((A, \neg B)\) states.  
     - Posterior:  
       \[
       P_{\text{cond}}(A \land B) = \frac{P(A \land B)}{P(\neg A \lor B)} = \frac{8/32}{28/32} = \frac{8}{28} = \frac{2}{7} \approx 0.2857
       \]
       \[
       P_{\text{cond}}(\neg A \land B) = \frac{P(\neg A \land B)}{P(\neg A \lor B)} = \frac{4/32}{28/32} = \frac{4}{28} = \frac{1}{7} \approx 0.1429
       \]
     - EU Calculations:  
       \[
       \text{EU}_1 = 10 \times P_{\text{cond}}(A \land B) = 10 \times 2/7 \approx 2.857
       \]
       \[
       \text{EU}_2 = 10 \times P_{\text{cond}}(\neg A \land B) = 10 \times 1/7 \approx 1.429
       \]
       \[
       \text{EU}_3 = 3
       \]
     - **Verdict:** Act 3 (EU = 3) is optimal.  

  2. **Lewis-Style Imaging on \(\neg A \lor B\):**  
     - Moves mass from \((A, \neg B)\) states to closest \((A, B)\) states (same district).  
       - Mass from \((A, \neg B, C)\) splits equally to \((A, B, C)\) and \((A, B, \neg C)\).  
       - Mass from \((A, \neg B, \neg C)\) splits equally to \((A, B, C)\) and \((A, B, \neg C)\).  
     - Posterior:  
       \[
       P_{\text{img}}(A \land B) = \frac{12}{32} = 0.375, \quad P_{\text{img}}(\neg A \land B) = \frac{4}{32} = 0.125
       \]
     - EU Calculations:  
       \[
       \text{EU}_1 = 10 \times 0.375 = 3.75, \quad \text{EU}_2 = 10 \times 0.125 = 1.25, \quad \text{EU}_3 = 3
       \]
     - **Verdict:** Act 1 (EU = 3.75) is optimal.  

  **Disagreement and Confirmation:**  
  - Conditioning: \(P_{\text{cond}}(A) = P_{\text{cond}}(A \land B) = 2/7 \approx 0.2857\) (decreased from prior \(P_{\text{prior}}(A) = 12/32 = 0.375\)). Learning the conditional **lowers** probability of \(A\).  
  - Imaging: \(P_{\text{img}}(A) = P_{\text{img}}(A \land B) = 0.375\) (unchanged from prior). Learning the conditional **does not change** probability of \(A\).  

  **Key Feature Driving Disagreement:**  
  - **Prior mass in \(A \land \neg B\) relative to \(A \land B\) and \(\neg A\) states:**  
    - High prior mass in \(\neg A \land \neg B\) (16/32) means conditioning redistributes eliminated \((A, \neg B)\) mass (4/32) to \(\neg A\) states (including \(\neg A \land \neg B\)), lowering \(P(A)\).  
    - Imaging moves all eliminated mass to \(A \land B\), preserving \(P(A)\).  
  - **If removed (uniform priors):**  
    - Conditioning: \(P_{\text{cond}}(A \land B) = 1/3\), \(P_{\text{cond}}(\neg A \land B) = 1/3\) → EU1 = EU2 ≈ 3.33, Act3 (EU=3) not optimal.  
    - Imaging: \(P_{\text{img}}(A \land B) = 1/2\), \(P_{\text{img}}(\neg A \land B) = 1/4\) → EU1 = 5, EU2 = 2.5, Act1 optimal.  
    No flip, as conditioning does not prefer Act3.  

  **Robustness Window:**  
  - **Flip condition:** Conditioning prefers Act3 (EU1 < 3), imaging prefers Act1 (EU1 > 3).  
    \[
    \text{Conditioning: } P_{\text{cond}}(A \land B) < 0.3, \quad \text{Imaging: } P_{\text{img}}(A \land B) > 0.3
    \]
  - **Prior range (examples):**  
    - \(P(A \land B) = y\), \(P(A \land \neg B) = z\), with \(y + z > 0.15\) and \(y / (0.5 - z) < 0.3\).  
    - E.g., \(z = 0.1\), \(y = 0.1\):  
      - Conditioning: \(P_{\text{cond}}(A \land B) = 0.1 / 0.4 = 0.25 < 0.3\) → EU1 = 2.5 < 3.  
      - Imaging: \(P_{\text{img}}(A \land B) = 0.4 > 0.3\) → EU1 = 4 > 3.  
  - **Payoff range:** Flip holds if payoff for Act1 is in (8.4, 10.5) (assuming fixed priors).  

  ---

  ### Robustness Checks

  1. **Alternative Closeness Orderings for Imaging:**  
     - Tested: Same building + same district prioritized, or same entrance prioritized.  
     - Result: Posterior \(P(A \land B) = 0.375\) remains identical. Mass from \((A, \neg B)\) always moves to \((A, B)\) states. Flip survives all reasonable orderings.  

  2. **Generalized Update for Conditional Chance (e.g., "if \(A\), then \(B\) with 0.75 chance"):**  
     - **Minimize Relative Entropy (MRE):**  
       Constraint \(P(B|A) = 0.75\). For priors, \(P_{\text{MRE}}(A \land B) ≈ 0.278\) → EU1 ≈ 2.78 < 3. Recommends Act3.  
     - **Generalized Imaging:**  
       Move 75% of mass from each \(A\)-world to closest \(A \land B\) world, 25% to closest \(A \land \neg B\) world.  
       \(P_{\text{gen-img}}(A \land B) = 9/32 = 0.28125\) → EU1 ≈ 2.81 < 3. Recommends Act3.  
     - **Verdict:** Flip **does not survive** with chance update. Both rules recommend Act3 (safe option).  

  ---

  ### Attacks and Defenses

  - **Defender of Conditioning:**  
    "Conditioning correctly lowers \(P(A)\) because learning \(\neg A \lor B\) eliminates \(A \land \neg B\), and the high prior mass on \(\neg A \land \neg B\) becomes more prominent. The courier should be pessimistic about \(A\) and choose the safe act. Imaging preserves \(P(A)\) artificially by moving mass only to \(A \land B\), ignoring the disjunctive nature of the evidence."

  - **Defender of Imaging:**  
    "Conditioning is defective because it dilutes the effect of the conditional: why should learning about \(A\) and \(B\) affect \(\neg A\)? Imaging correctly isolates the update to \(A\)-worlds, moving mass from \(A \land \neg B\) to \(A \land B\). The courier’s confidence in \(A\) remains intact, making Act1 rational."

  **Contrivance Assessment:**  
  - **No unsatisfiable constraints:** The case is not contrived. High prior mass on \(\neg A \land \neg B\) is unusual but plausible (e.g., courier has reason to believe the package is for Y and Back is open). The closeness structure is natural.  
  - **Only limitation:** The flip vanishes under chance updates, but this highlights that the disagreement is most acute for categorical conditionals.  

  ---

  ### Final Case Summary
  **Prior Table:**  
  | \(A\) (X?) | \(B\) (Front?) | \(C\) (Dist. A?) | Probability |  
  |------------|----------------|------------------|-------------|  
  | 0 (Y)      | 0 (Back)       | 1 (A)            | 8/32        |  
  | 0 (Y)      | 0 (Back)       | 0 (B)            | 8/32        |  
  | 1 (X)      | 1 (Front)      | 1 (A)            | 4/32        |  
  | 1 (X)      | 1 (Front)      | 0 (B)            | 4/32        |  
  | 1 (X)      | 0 (Back)       | 1 (A)            | 2/32        |  
  | 1 (X)      | 0 (Back)       | 0 (B)            | 2/32        |  
  | 0 (Y)      | 1 (Front)      | 1 (A)            | 2/32        |  
  | 0 (Y)      | 1 (Front)      | 0 (B)            | 2/32        |  

  **Payoff Table:**  
  | Act                      | Payoff Condition       | Payoff |  
  |--------------------------|------------------------|--------|  
  | Deliver X via Front      | \(A \land B\)          | 10     |  
  | Deliver Y via Front      | \(\neg A \land B\)     | 10     |  
  | Leave at central office  | Always                 | 3      |  

  **Result:**  
  - Conditioning → Act 3 (EU = 3).  
  - Imaging → Act 1 (EU = 3.75).  
  **Flip confirmed.** Use this case to illustrate that update rules are not mere bookkeeping but can reverse decisions.
