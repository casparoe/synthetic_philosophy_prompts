        For any state w, the closest worlds are those that differ only in the district (C). Then, next closest are those that differ only in the entrance status (B) and possibly the district (but not the building). Then, the farthest are those that differ in the building (A). 
        More precisely: 
          - Sphere 0: the actual state w.
          - Sphere 1: states that differ from w only in the district.
          - Sphere 2: states that have the same building as w but a different entrance status (and any district).
          - Sphere 3: states that have a different building.

     We have two districts, so for a fixed building and entrance, there are two states (one for each district). 

     The prior distribution (as fractions with denominator 32):

          ¬A, ¬B, c0: 8/32
          ¬A, ¬B, c1: 8/32
          A, B, c0: 4/32
          A, B, c1: 4/32
          A, ¬B, c0: 2/32
          A, ¬B, c1: 2/32
          ¬A, B, c0: 2/32
          ¬A, B, c1: 2/32

     Acts:

        Act1: Go to Building X and use the Front entrance. 
            - If the package is for Building X (A) and the Front entrance is open (B), she delivers successfully and gets 10.
            - Otherwise, she fails and gets 0.

        Act2: Go to Building Y and use the Front entrance.
            - If the package is for Building Y (¬A) and the Front entrance is open (B), she delivers successfully and gets 10.
            - Otherwise, 0.

        Act3: Leave the package at the central office, which always works but gives a lower reward of 3.

