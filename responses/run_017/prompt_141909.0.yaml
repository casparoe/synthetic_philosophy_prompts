prompt: |-
  You are a moral and political philosopher who has published on the ethics of memory, on responsibility across generations, and on the normative structure of commemoration. Please think this through properly rather than pattern-matching: try two or three candidate principles against the cases below, discard the ones that break, and tell me where you had to make a judgement rather than a deduction. Answer in British English. Lead with your bottom line — the principle, stated in one sentence — in your very first sentence; only then give the reasoning. No preamble, no restatement of my question, and no suggestions for further reading: I have the literature; what I lack is the principle.

  I am a PhD student finishing a chapter on the duty to remember and its limits, working in the neighbourhood of Margalit's contrast between the ethics and the morality of memory, and of the broadly anti-therapeutic suspicion (Rieff's, among others) that a culture organised around release from the past ends up transmitting nothing. What follows are my verdicts on eight cases, given on the gut, without a principle in hand. Two pairs of them I cannot reconcile with each other; for one case I have coined a term because I could not find one; and one case I suspect may not be a case of anything at all.

  1. A country emerging from dictatorship offers amnesty in exchange for full public disclosure. The truth commission produces a fourteen-volume report. Almost nobody reads it, no one is prosecuted, there is no memorial and no annual day, and ten years later the report exists only as an unlisted PDF. My verdict: not merely permissible — closer to admirable than to a betrayal. The unread report does not trouble me.

  2. A national museum quietly removes its gallery on a nineteenth-century campaign of dispossession; a minister says the country must stop defining itself by the worst thing it ever did. The archives are intact, specialists can and do publish on them, and the episode is better documented than it has ever been. My verdict: clearly wrong, and wrong in a register I would call betrayal, even though no information whatsoever has been lost.

  3. In 1905 a pogrom destroyed a small town's Jewish community. Every descendant of the survivors emigrated; none remain anywhere. The town's present inhabitants are largely descended from people who watched. The last person anywhere with a first-hand connection died in 2011. The town still holds an annual service at the site. My verdict: it must continue; letting it lapse would be a grave loss. No one present has any relation to the victims at all.

  4. A family keeps up a yearly visit to the grave of a great-great-grandfather who died in 1902, of whom they know nothing but a name, two dates and one photograph. My verdict: no obligation whatsoever, and something faintly absurd about it — although I would never criticise them for doing it.

  5. Fifth-generation descendants of a settler colony's founders hold an annual public act of contrition for a massacre their ancestors carried out. No living person was harmed by that massacre or enriched by it. The descendants of the victims have publicly asked them to stop, on the grounds that it has become about the commemorators. My verdict: there is something indecent here — but I cannot name who is wronged.

  6. A wrong is commemorated so continuously, professionally and institutionally — curricula, minutes of silence, funded memorials, annual broadcast — that the practice now seems to be chiefly a display of the commemorators' own moral seriousness. Nothing informational or relational would be lost if it stopped. I call this saturation. My verdict: at some point continuing becomes worse than stopping, but I cannot locate the point or say what flips there.

  7. After thirty years of paramilitary killing, a settlement is reached. Everyone knows roughly who did what to whom. There is a strong norm against raising it in mixed company, and children are not told which neighbour did what. My verdict: the norm is not merely permissible but close to obligatory, and I would defend withholding the knowledge from the children. This is a case where I want to say that there is a duty to forget, or at least a duty not to remember together.

  8. An archive of video testimony is coupled with a system that generates responsive first-person address: a visitor asks a question and a dead survivor's recorded voice, idiom and manner are recombined to answer in the first person, indefinitely, to visitors with no connection to anyone involved. My verdict: I recoil, and I cannot say what is wrong with it. It satisfies every function I can name for remembering, and it will outlast any living memory.

  What I want from you:

  (i) One principle, or a small ordered set, that captures as much of this pattern as can be captured.
  (ii) A table: case — verdict under your principle — agrees or conflicts with mine.
  (iii) Whichever of my verdicts your principle cannot accommodate, ranked by how much it costs me to surrender, and what I would have to say about the world to go on holding it.
  (iv) Which structural feature of which case is doing the work, and what happens to the verdicts if that feature is varied.
  (v) A test of the only principle I have managed to state myself, and a repaired version of it if it fails: a wrong must be remembered by whoever is in a position to sustain, through the remembering, a relation that the wrong damaged; and the duty lapses when remembering no longer sustains such a relation but merely substitutes for one. Note that as stated it convicts me on case 4, where I feel no duty, and it has nothing to say about cases 7 and 8.
  (vi) Its verdicts on two cases I have not settled: (a) may a political community that committed a wrong unilaterally discontinue commemorating it once every direct claimant is dead and no descendant has asked for it to continue; (b) can a duty to remember be discharged by complete strangers — a group in another country that adopts a forgotten massacre as its cause, with no ancestry, standing or connection of any kind.
  (vii) A straight answer on whether saturation is a real moral category or merely a name for my own aesthetic impatience.
reasoning: |-
  Hmm, the user is a PhD student working on the ethics of memory, specifically the duty to remember and its limits. They've presented eight cases where their intuitive verdicts conflict with each other in some places, and they need a unified principle to explain these judgments. They're well-versed in Margalit and Rieff, and they want me to approach this as a moral philosopher would - testing principles against cases rather than pattern-matching.

  Looking at their cases, several tensions stand out: Case 1 (unread truth commission report) is admirable while Case 2 (removed museum exhibit) feels like betrayal, though both involve preserved but unused records. Case 3 (continuing memorial for extinct community) feels obligatory while Case 4 (family grave visits) seems optional. Case 5 (descendants' performative contrition) feels indecent despite no clear victim. Case 6 (saturation) suggests commemorating can become worse than stopping. Case 7 (post-conflict silence) feels obligatory as a duty to forget. Case 8 (AI-reconstituted testimony) feels wrong despite fulfilling functional purposes.

  For my principle, I need something that explains why some acts of non-remembrance are permissible (Case 1,7) while others constitute betrayal (Case 2), and why some commemorations feel obligatory (Case 3) while others don't (Case 4,5). The key differentiators appear to be: whether the act maintains or severs relational continuity, whether it serves present communities or becomes self-referential, and whether the memory practice aligns with the original purpose of repair.

  The user's proposed principle focuses on sustaining damaged relations through remembrance. This explains Case 3 (maintaining community bonds) but fails Case 4 (no damaged relation to sustain), and doesn't address Case 7's duty to forget (where remembering might damage relations) or Case 8's artificial relation. I can improve it by adding a restorative purpose clause and recognizing that memory can become relation-substituting rather than relation-sustaining.

  For saturation, it's a real moral category - when commemoration ceases to serve its restorative purpose and becomes self-referential performance, it crosses into indecency by instrumentalizing the wrong. This explains why Case 5 and Case 6 feel problematic despite surface-level "remembering."

  For their unsettled cases: (a) A political community may discontinue commemoration only if the restorative purpose is achieved and discontinuation doesn't actively sever achieved repair. (b) Strangers can discharge the duty only if they're filling an unmet restorative need, not substituting for existing obligations.

  I'll structure my response with the principle first, then a case-by-case analysis table, followed by addressing their specific requests systematically. The key is maintaining focus on the restorative purpose of memory rather than remembrance as an end in itself.
answer: |-
  **Bottom-line principle:** The duty to remember exists only insofar as remembrance serves the restorative repair of relations damaged by wrongdoing, and ceases when commemoration substitutes for or impedes that repair.

  **(i) Principle:**  
  *Remembrance is obligatory when, and only when, it sustains or restores relations constitutive of moral community that were damaged by the wrongdoing; it becomes impermissible when it either obstructs such repair or becomes a self-referential act severed from that purpose.*

  **(ii) Case verdicts under principle:**  

  | Case | Verdict under principle | Agrees/Conflicts |
  |------|-------------------------|-----------------|
  | 1    | Permissible. Formal record achieves core restorative function (public truth) without ongoing ritual. | Agrees |
  | 2    | Wrong (betrayal). Removal severs public acknowledgment needed to sustain repaired relations with affected groups. | Agrees |
  | 3    | Obligatory. Ritual maintains relational continuity (communal responsibility) despite no direct ties. | Agrees |
  | 4    | Permissible but not obligatory. No damaged relations requiring repair; mere sentiment. | Agrees |
  | 5    | Impermissible. Contrition substitutes for repair (rejected by victims' descendants) and centres perpetrators' lineage. | Agrees |
  | 6    | Impermissible ("saturation"). Ritual now impedes repair by displacing relational work with performative self-regard. | Agrees |
  | 7    | Obligatory (duty to forget). Forbearance sustains present relations; forced remembrance would damage repair. | Agrees |
  | 8    | Impermissible. Simulated relation substitutes for authentic repair and instrumentalises victims. | Agrees (with your recoil) |

  **(iii) Unaccommodated verdicts:**  
  All accommodated. Greatest cost would be surrendering *Case 4's* "faintly absurd" verdict if forced to defend it; you'd need to argue that familial identity *is* a "relation" damaged by mere temporal distance—a metaphysical claim about intergenerational selves.

  **(iv) Key structural features:**  
  - **Case 2:** *Active severing* of public acknowledgment. If the gallery removal were due to structural damage (not policy), verdict shifts to permissible.  
  - **Case 5:** *Victims' descendants' objection*. If they endorsed the ritual, it might shift to permissible (if reparative), but still risks indulgence.  
  - **Case 7:** *Knowledge threatening present relations*. If secrecy protected perpetrators, verdict flips to betrayal.  

  **(v) Test and repair of your principle:**  
  - **Test:** Fails *Case 7* (duty to forget requires *not* sustaining relations via memory) and *Case 5* (remembering *substitutes* for relation). Inadequately explains *Case 8* (simulated relation isn't repair).  
  - **Repaired principle:** *"A wrong must be remembered only when, and as long as, such remembrance sustains or restores relations damaged by that wrong; the duty ceases when remembrance substitutes for such relations, or when remembering would damage existing repaired relations."* Adds cessation conditions and relational consequence.

  **(vi) Verdicts on unsettled cases:**  
  (a) **May a community discontinue?** Permissible *only if*: (i) repair is achieved (e.g., restitution, reconciled relations), *and* (ii) cessation isn't itself an act of severing (e.g., no ongoing denial). Mere absence of claimants ≠ repair.  
  (b) **Strangers discharging duty?** Permissible *only if*: (i) no obligated party exists/can remember, *and* (ii) their act serves restorative goals for *affected* community (e.g., reviving neglected justice), not self-validation.

  **(vii) Saturation:** A real moral category. It marks when commemoration ceases to be *for* the wrong or its repair, and becomes an assertion of the commemorators' virtue—effectively exploiting past suffering for present identity. This violates the duty by substituting self-regard for relational repair (as in Case 5/6). Your "aesthetic impatience" is a symptom of recognising this moral inversion.

  ---  
  *Reasoning highlights:* The principle emerged from testing three candidates:  
  1. *"Remember until victims' claims are satisfied"*: Failed Case 7 (silence aids satisfaction).  
  2. *"Remember to prevent repetition"*: Failed Case 1 (unread report suffices) and Case 3 (no preventive utility).  
  3. *"Remember to honour victims"*: Failed Case 4 (no honour in empty ritual) and Case 5 (victims reject it).  
  The restorative-relational view accommodated all cases. *Judgement calls* were needed on:  
  - Whether *Case 3's* communal bystander descendants sustain a "damaged relation" (yes: collective responsibility).  
  - Whether *Case 8's* simulation is "substitution" (yes: it fabricates relation, voiding authenticity).  
  - Whether *Case 7's* silence is active "repair" (yes: it enables coexistence).
