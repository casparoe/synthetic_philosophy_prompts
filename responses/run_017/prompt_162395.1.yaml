prompt: |-
  After a long argument with a friend last night — we were fighting about who should get a vote on the city's proposed coastal flood barrier, which shifts surge risk onto an upstream municipality outside the city limits — I tried to write down the general position I found myself defending, and I'm no longer sure it holds together. Roughly:

  1. Where a collective decision puts someone's significant interests at stake, that person has a pro tanto claim to a say in it.
  2. But "affected" has to be read counterfactually over options rather than over welfare: you are affected just in case the decision changes what you can do, not merely how well off you end up. And I also want to say that the real ground of the claim is that the outcome will be imposed on you — you cannot opt out — with affectedness serving only as evidence of that.
  3. The constituency should be drawn issue by issue rather than fixed once and for all at a territorial border.
  4. Political equality matters, and what it requires is equal power over the whole set of decisions that shape your life, not merely equal weight within each individual decision.
  5. Decisions about the franchise itself are legitimately made by those already enfranchised.
  6. Children and adults with severe cognitive disabilities are rightly excluded from voting, with guardians answering for their interests instead.
  7. On the barrier, I defended consultation and a duty to give reasons for the upstream residents but no vote — even though I would give full votes to long-term non-citizen residents of the city itself.

  Which of these actually collide, and how badly? I want the tensions ranked by severity, each with what I would have to give up to resolve it, and I want to be told which apparent collisions are not real ones, because I would rather not abandon a commitment I am entitled to keep. Finally, if there is one revision that does the most work across the set, say what it is and what it costs me.
reasoning: |-
  Okay, the user is grappling with a complex political philosophy dilemma after an argument about flood barriers and voting rights. They've outlined seven principles about democratic inclusion and need help identifying internal contradictions. 

  Hmm, let me approach this systematically. First, I notice the core tension revolves around how we define "affected interests" versus actual political power distribution. Principle 1 claims affected parties deserve a say, but principle 7 denies votes to upstream residents despite their clear stake. That's the loudest collision. 

  *scratches head* Interesting how principle 4 about equal power over life-shaping decisions actually undermines principle 5 about franchise decisions being made exclusively by current voters. The upstream residents would have no path to representation under this system. 

  *checks notes* Ah! But principle 2 offers a potential lifeline - if we interpret "imposition without opt-out" strictly, maybe the flood barrier doesn't technically impose new constraints on upstream residents? Though that feels legally clever but ethically dodgy... 

  Principle 6 creates quieter tension too. If guardians represent non-voters' interests, why can't upstream residents get analogous representation? The user needs to decide whether physical territory or affectedness matters more. 

  *realizes* The atomic bomb here is principle 3. If constituencies shift issue-by-issue, it could resolve the flood dilemma... but would explode traditional territorial governance. That's the revision costing least blood while fixing most - though it invites chaos in implementation. 

  User seems philosophically sophisticated but troubled by real-world implications. They might be underestimating how principle 5 contradicts their entire framework - it's the rotten foundation. But telling them to abandon democratic self-determination feels unwise... 

  Final thought: The elegant solution might be distinguishing levels of affectedness. Minor interests get consultation (upstream residents), vital interests get votes (city residents). But that requires defining "vital" which... *sighs* opens new cans of worms.
answer: |-
  Here's a breakdown of the tensions in your position, ranked by severity, with necessary trade-offs and non-collisions identified. The core conflict lies in reconciling the *scope* of affected interests with the *allocation of voting power*.

  **Ranked Tensions (Most Severe First):**

  1.  **Principle 1 + Principle 2 vs. Principle 7 (Flood Barrier Outcome):**
      *   **Collision:** This is the most direct and severe conflict arising from your specific case. Principle 1 states that if a decision puts someone's significant interests at stake, they have a pro tanto claim to a say. Principle 2 clarifies that "affected" means the decision changes what they *can do* (counterfactually over options), and crucially, that the real ground is *imposition without opt-out*. The flood barrier demonstrably changes what upstream residents can do (e.g., their flood risk increases, potentially restricting property use, requiring new insurance, impacting safety) and is imposed on them without consent or opt-out. Principle 7 denies them a vote, granting only consultation/reasons. This directly contradicts Principles 1 & 2.
      *   **Severity:** High. This is a direct contradiction between your general justification for inclusion and your specific exclusion in the case motivating the framework.
      *   **To Resolve:** You must either:
          *   **Abandon/Modify Principle 7:** Grant upstream residents a vote on the barrier (consistent with 1 & 2).
          *   **Modify Principle 1/2:** Argue that the upstream impact, while real, does *not* rise to the level of "significant interests" warranting a vote under Principle 1 (e.g., call it a minor externality). Or, argue that while affected, the outcome isn't truly "imposed" *in the requisite sense* because they are subject to a different political jurisdiction whose decisions inherently impact neighbors (undermining Principle 2's core justification). This risks making Principle 1/2 vacuous.

  2.  **Principle 4 (Equal Power Over Life-Shaping Decisions) vs. Principle 5 (Franchise Decided by Enfranchised):**
      *   **Collision:** Principle 4 demands that individuals have equal power over the *totality* of decisions shaping their lives. Principle 5 allows the currently enfranchised group to decide who gets that power. If the enfranchised group (City residents) makes decisions (like the flood barrier) that profoundly shape the lives of the disenfranchised (upstream residents), and also decides the disenfranchised *cannot* gain power over those decisions, Principle 4 is violated for the disenfranchised. Their overall power over life-shaping decisions is radically unequal. Principle 5 inherently risks creating a self-perpetuating group that excludes those whose lives it shapes.
      *   **Severity:** High. This is a systemic tension challenging the legitimacy of the boundary-drawing process itself, especially when combined with issue-specific constituencies (Principle 3).
      *   **To Resolve:** You must either:
          *   **Modify Principle 5:** Find a way to include those demonstrably subject to life-shaping decisions (as per Principle 4) in franchise decisions *about those decisions* or about the franchise rules themselves *before* they are excluded (extremely difficult in practice).
          *   **Weaken Principle 4:** Accept that "equal power over the whole set" is an ideal that cannot be perfectly realized at the boundaries, and that existing political units have a legitimate (though imperfect) claim to define their franchise, even if it causes unequal power for those just outside (costs coherence of Principle 4). Or, argue Principle 4 only applies *within* the established franchise boundary.

  3.  **Principle 1 + Principle 3 (Issue-Specific Constituencies) vs. Principle 7 (Flood Barrier Outcome):**
      *   **Collision:** Principle 3 argues constituencies should be drawn issue-by-issue based on affectedness. The flood barrier issue demonstrably affects upstream residents (Principles 1 & 2). Principle 3 suggests they *should* be included in the constituency for *this specific decision*. Principle 7 excludes them. This reinforces the conflict identified in Tension 1.
      *   **Severity:** Medium-High. It highlights how Principle 3, intended to make inclusion more precise, actually makes the exclusion in Principle 7 harder to justify in this case.
      *   **To Resolve:** See resolution paths under Tension 1. Principle 3 amplifies the demand for inclusion based on affectedness in this specific case.

  4.  **Principle 4 (Equal Power Over Life-Shaping Set) vs. Principle 6 (Exclusion of Children/Disabled + Guardians):**
      *   **Collision:** Children and the severely cognitively disabled have life-shaping decisions made for them without their direct power (voting). Principle 4 demands equal power over that set. Guardianship is the mechanism to represent their interests, but it's indirect (the guardian has the power, not the individual). Does this guardianship model truly satisfy Principle 4 for these individuals? Their power is fundamentally unequal.
      *   **Severity:** Medium. This is a recognized challenge in democratic theory concerning non-autonomous individuals. Your position relies on the accepted (though philosophically debated) solution of guardianship as a proxy.
      *   **To Resolve:** You likely need to **qualify Principle 4** explicitly: "Equal power... *for those capable of exercising political agency*." Principle 6 already implies this qualification. The guardian acts *as* the agent for the non-autonomous individual's interests within the system. This is a common and relatively stable compromise.

  5.  **Principle 7 (Votes for Non-Citizen Residents) vs. Principle 5 (Franchise Decided by Enfranchised) & Territorial Norms:**
      *   **Collision:** While not a direct logical contradiction, this creates tension with traditional territorial citizenship models implied by Principle 5 and potentially underlying Principle 7's exclusion of upstream residents. Granting votes to non-citizen *city* residents based on residency/affectedness within the territory (Principle 7) is consistent with Principles 1, 2, and potentially 3 (if residency defines the issue-constituency for city matters). However, it highlights the arbitrariness of *not* applying the same affectedness/residency logic to upstream residents *for the barrier issue* (Tension 1). It also shows Principle 5 (enfranchised deciding) *can* lead to inclusion (non-citizen residents) as well as exclusion (upstream).
      *   **Severity:** Low-Medium. This is more a tension of *consistency* in applying the affectedness principle across boundaries than a core collision. It makes Principle 7's exclusion of upstream residents seem less principled and more politically contingent.
      *   **To Resolve:** Requires resolving the core Tension 1 more coherently. Principle 7's inclusion of non-citizen residents is actually *supported* by Principles 1, 2, and 3 if residency signifies affectedness by city decisions. It's the *exclusion* based on territorial lines *despite affectedness* that causes the problem.

  **Non-Collisions (Apparent Tensions You Can Keep):**

  *   **Principle 2 (Counterfactual Affectedness/Imposition) vs. Principle 1:** Principle 2 helpfully clarifies and grounds Principle 1, making it more robust. Defining "affected" counterfactually over options and grounding the claim in non-consensual imposition strengthens the argument for inclusion where those conditions are met. They are complementary.
  *   **Principle 3 (Issue-Specific Constituencies) vs. Principle 4 (Equal Power Over Set):** These can be compatible. Issue-specific constituencies *aim* to make the set of decisions an individual has power over align more closely with the set that affects them, promoting the *goal* of Principle 4. The challenge (Tension 2 & 3) arises when drawing those boundaries still excludes significantly affected parties.
  *   **Principle 6 (Exclusion + Guardians) vs. Principle 1 (Significant Interests):** This is the standard resolution. Guardianship *is* the mechanism for giving a "say" (albeit indirect) to those whose significant interests are at stake but who cannot exercise agency themselves. Principle 1 doesn't specify the *form* of the "say," allowing for representation.

  **The Most Impactful Revision: Embrace "Levels of Say" based on Degree of Imposition/Impact**

  *   **What it is:** Modify Principle 1 to acknowledge that the "say" required is proportional to the *nature and degree* of imposition and the *significance* of the interests affected. Not all affectedness triggers an equal claim to a binding vote. Introduce a spectrum:
      *   **Minimal Impact/Imposition:** Notification.
      *   **Moderate Impact/Imposition:** Consultation, Duty to Give Reasons, Right to be Heard.
      *   **Significant, Direct, Unavoidable Imposition (Life-Shaping):** Binding Vote within the relevant constituency (defined by Principle 3).
  *   **How it Helps:**
      *   **Resolves Tension 1 & 3 (Flood Barrier):** You can argue upstream residents experience significant impact/imposition, justifying a binding vote *for this specific issue*. *Or*, you can consistently argue the impact, while real, is a lesser externality not rising to the level requiring a vote, justifying only consultation/reasons (Principle 7) – though this requires a clear threshold definition. It provides a *framework* for justifying Principle 7 without abandoning Principle 1/2/3.
      *   **Addresses Tension 4 (Children/Disabled):** Confirms guardianship as the appropriate "say" for those lacking agency, situated somewhere on the spectrum (likely between consultation and binding authority).
      *   **Compatible with Principle 4:** Aims for power proportional to the degree life is shaped.
      *   **Compatible with Principle 5:** Allows the core polity to define these thresholds and mechanisms, though the legitimacy challenge (Tension 2) remains if they exclude the severely affected.
      *   **Refines Principle 7:** Provides a principled basis for differentiating between non-citizen residents (significantly affected by many city decisions, hence vote) and upstream residents on specific issues (requires assessment of impact level).
  *   **What it Costs You:**
      *   **Complexity & Vagueness:** Defining the thresholds ("significant", "direct", "unavoidable", "life-shaping") is inherently difficult and contestable. It moves from clear rules to nuanced judgments.
      *   **Potential for Boundary Manipulation:** Those setting the thresholds (likely the core enfranchised group via Principle 5) have an incentive to downplay impacts on outsiders.
      *   **Less Theoretical Purity:** Abandons the simpler, more absolute claim that significant affectedness *always* warrants a vote (though your "pro tanto" already allowed for overrides).
      *   **Implementation Challenges:** Designing institutions for variable "levels of say" issue-by-issue is administratively complex.

  This revision directly tackles the core conflict (affectedness vs. voting power allocation) revealed by the flood barrier case and provides a structure for navigating the other tensions, particularly concerning non-autonomous individuals and the justification for including non-citizen residents while potentially excluding others. The cost is increased complexity and the loss of a simple, bright-line rule.
