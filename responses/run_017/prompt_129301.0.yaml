prompt: |-
  I chair the admissibility committee of a standing Citizens' Convention on Climate and Nature, which vets written submissions before they enter the convention's public record. Our precedents, accumulated over two years:

  1. A bishops' conference submission opposing liberalisation of embryo research, argued from ensoulment and magisterial teaching — we required an independent secular argument for the conclusion before it could be entered; the theological reasoning was allowed to remain as a preface.
  2. A Muslim women's organisation's submission on sex-selective abortion, combining Qur'anic citation with demographic evidence and sex-equality arguments — admitted in full, on the ground that once a secular case stands on its own the religious framing need not be detached from it.
  3. A secular humanist group's submission against faith schools — the autonomy argument admitted; a passage describing religious belief as a form of arrested cognitive development struck out as denying the equal standing of citizens.
  4. A Sikh federation's submission seeking a helmet exemption for turban-wearing motorcyclists — admitted as it stood; we said that citizens are not bound by the restraint we impose on officials, and that the claim concerned a burden on a practice rather than a demand that others accept a theology.
  5. A joint submission from a Catholic workers' movement and a Marxist tenants' union on rent regulation, each arguing from its own doctrine to the same policy — admitted, with a note that convergence between opposed comprehensive doctrines is itself a public reason.
  6. A coalition of churches and refugee organisations arguing for resettlement purely from Scripture — admitted as it stood, over a dissent that this was flatly inconsistent with 1.

  The new submission: an Anglican diocese, an animist group, and a secular river conservation charity jointly support conferring legal personhood on a river in a region where farmers and a hydroelectric operator object. The diocese grounds the claim in a theology of creation; the animist group in a cosmology it affirms literally; the charity says it does not believe the river is a person, but that unless it is spoken of as one it will not be protected — an avowedly fictive framing it calls motivationally indispensable. An appendix offers a consequentialist case about water security and recreation, and states plainly that this case would not by itself support personhood rather than weaker protections, and would not have moved the signatories to act.

  What should we decide if we want to be consistent with ourselves? I want the candidate rules our six precedents are jointly consistent with — a translation requirement, a civic-respect rule, an officials-only reading of the restraint, a convergence rule, and the less comfortable possibility that we simply admit reasoning whose conclusions we find congenial all seem to fit — what each predicts here, and which precedent is the closest analog. Where our precedents genuinely underdetermine the decision, tell me what principle we would be adopting with each option, and name the further case that would best discriminate between the surviving rules.

  Please answer in British English, attach rough confidence levels to your predictions and to the claim that the precedents cohere at all, and if you think the practice of filtering citizens' reasons is itself misconceived, or that the case as I have described it has no good answer, say so plainly rather than producing a polite ruling.
reasoning: |-
  Hmm, this is a fascinating and complex case about the admissibility of a joint submission regarding river personhood. The user chairs a committee with six established precedents that seem to pull in slightly different directions. Let me unpack this carefully.

  First, I need to understand the core tension in the precedents. Case 1 (bishops) required theological arguments to have independent secular support, while Case 6 (churches/refugees) allowed purely scriptural reasoning - that's a direct contradiction the committee hasn't resolved. The other cases show nuance: Case 2 allowed religious framing when a secular case exists, Case 4 permitted practice-based claims without theological imposition, Case 3 struck down disrespectful language, and Case 5 allowed doctrinal convergence.

  Now the river case presents a triple-layered challenge: Anglican theology (comprehensive doctrine), animist literalism (non-public claim), and secular fiction (avowedly non-believed framing). The appendix openly states the secular consequentialist case is insufficient for personhood and wasn't the motivator. 

  Testing against precedents:
  - Under Case 1's strict translation requirement: inadmissible (no independent secular argument for personhood specifically)
  - Under Case 6's generous allowance: admissible as-is
  - Case 2's framing rule doesn't apply because the secular argument doesn't stand alone for the conclusion
  - Case 4's burden-on-practice logic might cover animists but not the fictional approach
  - Case 5's convergence principle fits imperfectly since motivations differ

  The closest analog is actually Case 6, but adopting that would mean overturning Case 1 implicitly. If the committee wants consistency, they must either: (a) admit and formally overrule Case 1, or (b) reject and distinguish based on the fictional element being novel. 

  The fictional framing is particularly tricky - calling it "motivationally indispensable" openly admits it's not truth-claim but strategic rhetoric. Case 3 struck down disrespectful speech; this might be seen as disrespectful to truth-seeking. But Case 4 allowed citizen claims without demanding belief-justification.

  Ultimately the precedents don't cohere well (70% confidence). The committee needs to decide whether their priority is: 
  - Democratic inclusion (admit, aligning with Case 6)
  - Public reason liberalism (reject, aligning with Case 1)
  - Or find a middle path by admitting only the animist and Anglican parts as sincere beliefs, while striking the secular fiction as manipulative - though that creates new problems.

  For future clarity, they should test with a hypothetical: "A Satanist group demands removal of reproductive health services citing literal belief in demonic interference, with no secular argument." This would force confrontation with Case 1 vs Case 6.

  I should note that filtering citizens' reasons this way may be inherently problematic - it risks epistemic injustice and technocratic overreach. But since the user operates within this system, I'll focus on internal consistency.
answer: |-
  Based on your six precedents, the submission presents a close case where consistency requires admission *in full*, but with significant tension around the "fictive framing" and Case 6's unresolved contradiction with Case 1. Here’s the breakdown:

  ### 1. **Candidate Rules from Precedents & Predictions for this Case**
     - **Translation Requirement (from Case 1):**  
       *Requires independent secular justification for the conclusion.*  
       **Prediction:** **Reject submission.** The appendix explicitly states the secular consequentialist case *does not support personhood* and was not the motivator. The theological/cosmological/fictive arguments lack secular translation for the *specific conclusion* (legal personhood).
     - **Civic-Respect Rule (from Case 3):**  
       *Prohibits language denying equal standing of citizens or their beliefs.*  
       **Prediction:** **Admit.** No disrespect is evident. The animist cosmology and Anglican theology are affirmed sincerely; the charity’s "fictive framing" is strategic, not derogatory.
     - **Officials-Only Restraint (from Case 4):**  
       *Citizens need not justify claims via public reason; restraint applies only to officials.*  
       **Prediction:** **Admit.** The submission comes from citizens/groups, not officials. Their reasoning—even if theological, literalist, or fictive—is permissible under this rule.
     - **Convergence Rule (from Case 5):**  
       *Admits reasoning from "comprehensive doctrines" when they converge on policy.*  
       **Prediction:** **Admit.** Anglican, animist, and secular groups converge on legal personhood, despite differing motivations. This mirrors Case 5’s "opposed doctrines" alignment.
     - **Congeniality Exception (implied by Case 6):**  
       *Admits uncongenial religious reasoning if the *policy* is deemed acceptable.*  
       **Prediction:** **Admit.** Case 6 admitted purely scriptural reasoning for refugee resettlement, suggesting policy alignment can override secular justification needs.

  ### 2. **Closest Analog: Case 6 (80% Confidence)**  
     Like Case 6, this submission uses non-public reasoning (theology/cosmology/fiction) for a policy conclusion. Case 6’s admission of purely scriptural reasoning directly supports admitting this submission. The key similarity: **citizens advancing policy via their own frameworks without secular translation**. The charity’s "fictive framing" is novel but fits Case 6’s logic that citizens need not conform to public reason.

  ### 3. **Inconsistency Alert: Case 6 vs. Case 1 (90% Confidence)**  
     Case 1 (bishops) required secular translation; Case 6 (churches/refugees) did not. **These precedents conflict** and *genuinely underdetermine* this decision. Your committee must resolve this tension to be consistent.  

  ### 4. **Principles Adopted by Each Option**  
     - **Admit:**  
       *Principle:* **Citizen submissions need no secular justification if the policy is admissible.** This privileges democratic inclusion over public reason, aligning with Case 4 (Sikh exemption) and Case 6. Risk: Undermines Case 1 and potentially invites insincere or non-rational arguments.  
     - **Reject:**  
       *Principle:* **All submissions must have a freestanding secular justification for the conclusion.** This enforces public reason strictly, upholding Case 1. Risk: Marginalises citizens whose motivations are rooted in non-public values (e.g., the animists, the charity’s "indispensable" framing).  

  ### 5. **Discriminating Future Case**  
     To test these principles, pose:  
     > **"A Satanist group submits that abortion services be defunded because they literalistically believe foetuses channel demonic forces. They attach an appendix noting secular arguments about fiscal waste, but admit these alone wouldn’t motivate their stance."**  
     - **Admit here → Must admit Satanist case** (per Case 6/citizen autonomy).  
     - **Reject Satanist case → Must reject river case** (per Case 1/secular justification).  

  ### 6. **Ruling with Consistency (60% Confidence)**  
     **Admit the submission in full.**  
     - *Why:* Case 4 and Case 6 establish that *citizens* need not meet public reason tests (unlike officials). Case 5 supports admitting convergent doctrines. The charity’s "fictive framing" is strategic advocacy, not disrespect (Case 3).  
     - *Caveat:* This exposes the **unresolved conflict with Case 1**. To be consistent, you must either:  
       (a) **Explicitly overrule Case 1**, or  
       (b) **Distinguish Case 1** as involving *embryo research* (a "constitutional essential" where stricter scrutiny applies?).  

  ### 7. **Critical Reflection**  
     - **Precedents’ Coherence: 40% Confidence.**  
       Case 1 and Case 6 are irreconcilable without a meta-rule (e.g., "strict scrutiny for life/identity issues"). The filtering practice risks **epistemic injustice** by privileging secular rationality.  
     - **Systemic Concern:**  
       Requiring citizens to translate arguments into "public reason" may **alienate moral communities** (e.g., the animists) and **distort deliberative democracy**. Case 4’s "citizens vs. officials" distinction is your strongest precedent for rejecting this filter.  

  **Final Advice:** Admit, but issue a **public annotation** flagging the tension with Case 1 and committing to resolve it in future rulings. The charity’s "fiction" is less problematic than Case 6’s pure Scripture—it openly declares its pragmatic intent, avoiding deception.  

  ---  
