  ### 1. Translation of Hempel's Raven Paradox  
  **Setup**:  
  - **Sample space**: Finite set of \(N\) objects. Each object has properties: Raven (\(R\)) or not (\(\neg R\)), Black (\(B\)) or not (\(\neg B\)).  
  - **Hypothesis space**: \(H \equiv\) "All ravens are black" (i.e., no \(\neg B \cap R\)). \(H\) is a binary variable (true/false).  
  - **Priors**: Uniform over counts of the 4 categories:  
    - \(a = \#(R \cap B)\), \(b = \#(R \cap \neg B)\), \(c = \#(\neg R \cap B)\), \(d = \#(\neg R \cap \neg B)\).  
    - \(N = a + b + c + d\). Prior: \(P(a, b, c, d) = \binom{N+3}{3}^{-1}\) for non-negative integers summing to \(N\).  
    - \(P(H) = P(b=0) = \frac{\binom{N+2}{2}}{\binom{N+3}{3}} = \frac{3}{N+3}\).  

  **Data-generating protocols**:  
  1. **Uniform from all objects**: Observation \(D\) is one object sampled uniformly.  
  2. **Uniform from non-black objects (\(\neg B\))**: Observation \(D\) is one object sampled uniformly from \(M = b + d\) objects.  
  3. **Uniform from ravens (\(R\))**: Observation \(D\) is one object sampled uniformly from \(K = a + b\) ravens.  

  **Effect of observing a non-black non-raven (\(D = \neg B \cap \neg R\), i.e., type \(d\))** on \(P(H)\):  
  - **Protocol 1 (uniform from all objects)**:  
    \[
    P(H|D) = \frac{4}{N+3} > P(H) = \frac{3}{N+3}.
    \]  
    - **Derivation**: 
      \[
      P(D|H) = \frac{1}{3}, \quad P(D|\neg H) = \frac{1}{4}, \quad P(D) = \frac{1}{4}.
      \]
      \[
      P(H|D) = \frac{P(D|H)P(H)}{P(D)} = \frac{(1/3)(3/(N+3))}{1/4} = \frac{4}{N+3}.
      \]
    - **Result**: \(D\) confirms \(H\) (posterior increases), but negligibly for large \(N\).  
    - **Nicod intuition**: Fails—observing a raven (e.g., black raven) gives same posterior as \(D\): also \(\frac{4}{N+3}\).  

  - **Protocol 2 (uniform from non-black objects)**:  
    \[
    P(D|H) = 1, \quad P(H|D) > P(H).
    \]  
    - **Derivation**: Under \(H\), all \(\neg B\) objects are \(\neg R\), so \(d = M\) and sampling yields \(D\) with certainty.  
    - **Result**: \(D\) strongly confirms \(H\) (as \(P(D|\neg H) < 1\)).  
    - **Nicod intuition**: Holds—observing \(\neg R\) from \(\neg B\) supports the contrapositive.  

  - **Protocol 3 (uniform from ravens)**:  
    - \(D = \neg B \cap \neg R\) is impossible (ravens cannot be non-ravens).  
    - Observing a black raven (\(R \cap B\)):  
      \[
      P(H|D) = \frac{4}{N+3} > P(H).
      \]  
    - **Result**: Nicod holds for raven-consistent observations.  

  **Key assumption**: The **sampling protocol** determines evidential impact.  
  - **Recovers Nicod**: Protocol 3 (for ravens) and Protocol 2 (for contrapositive).  
  - **Makes \(D\) inert**: No protocol makes \(D\) inert; Protocol 1 makes it weak.  
  - **Additions flagged**: Finite \(N\), uniform prior over counts (exchangeable properties).  

  ---

  ### 2. Fixed Annotation Budget: Efficiency of Evidence  
  **Setup**:  
  - Fixed budget of \(L\) labels, each unit cost.  
  - **Strategies**:  
    - **Strategy R**: Sample from ravens (uniform from \(R\)).  
    - **Strategy C**: Sample from entire catalogue (uniform from all objects).  
  - **Goal**: Maximize expected information gain (reduction in uncertainty about \(H\)). Use **expected change in log-odds** per label.  

  **Analysis**:  
  - **Log-odds**: \(\ell = \log \frac{P(H)}{P(\neg H)}\). After observation \(D\), change is \(\Delta\ell = \log \frac{P(D|H)}{P(D|\neg H)}\).  
  - **Expected informativeness**: \(\mathbb{E}[\Delta\ell]\) under prior predictive.  

  - **Strategy R (sample from ravens)**:  
    - Possible \(D\):  
      - Black raven (\(R \cap B\)): \(P(D|H) = 1\), \(P(D|\neg H) = \mathbb{E}[a/(a+b) \,|\, \neg H] \approx \frac{1}{2}\) (by symmetry).  
        \(\Delta\ell_{\text{black}} = \log \frac{1}{1/2} = \log 2\).  
      - Non-black raven (\(R \cap \neg B\)): \(P(D|H) = 0\), \(P(D|\neg H) > 0\) \(\implies \Delta\ell_{\text{non-black}} = -\infty\) (refutes \(H\)).  
    - **Probability of outcomes**:  
      \(P(\text{black}) = \frac{1}{2}\), \(P(\text{non-black}) = \frac{1}{2}\) (from prior).  
    - **Expected \(\Delta\ell\)**:  
      \[
      \mathbb{E}[\Delta\ell] = \frac{1}{2} \log 2 + \frac{1}{2} (-\infty) = -\infty \quad \text{(divergent, but practically: high information if refutation)}.
      \]  

  - **Strategy C (sample from catalogue)**:  
    - Possible \(D\):  
      - Non-black non-raven (\(\neg B \cap \neg R\)): \(\Delta\ell = \log \frac{1/3}{1/4} = \log \frac{4}{3}\) (as in Protocol 1).  
      - Black raven (\(R \cap B\)): Same \(\Delta\ell = \log \frac{4}{3}\).  
      - Non-black raven (\(R \cap \neg B\)): \(\Delta\ell = \log \frac{0}{1/4} = -\infty\) (refutes \(H\)).  
    - **Probability of outcomes**:  
      \(P(\text{non-black non-raven}) = \frac{1}{4}\), \(P(\text{black raven}) = \frac{1}{4}\), \(P(\text{non-black raven}) = \frac{1}{4}\).  
    - **Expected \(\Delta\ell\)**:  
      \[
      \mathbb{E}[\Delta\ell] = \frac{1}{2} \log \frac{4}{3} + \frac{1}{4} (-\infty) = -\infty \quad \text{(similar divergence)}.
      \]  

  **Comparison**:  
  - **Refutation probability**:  
    - Strategy R: \(P(\text{non-black raven}) = \frac{1}{2}\).  
    - Strategy C: \(P(\text{non-black raven}) = \frac{1}{4}\).  
    Strategy R is twice as likely to refute \(H\) per label.  
  - **Non-refutation impact**:  
    - Strategy R: \(\Delta\ell = \log 2 \approx 0.693\).  
    - Strategy C: \(\Delta\ell = \log \frac{4}{3} \approx 0.288\).  
    Strategy R provides stronger confirmation when not refuting.  

  **Verdict**:  
  - **Paradox loses sting**: Cost per observation reveals that **sampling from ravens (Strategy R) is more efficient** than sampling from the catalogue (Strategy C).  
  - **Core issue**: The paradox ignored **effort-to-evidence exchange rates**. Observing a non-black non-raven (\(D\)) provides evidence (Protocol 1), but is inefficient because:  
    - \(D\) is common (high sampling cost for weak evidence).  
    - Ravens are rare (if \(K \ll N\)), making \(D\) uninformative per unit cost.  
  - **In practice**: To test \(H\), prioritize ravens—they yield decisive evidence faster.  

  ---

  ### 3. Residue Report  
  **Translates cleanly**:  
  - **Equivalence condition**: Logically equivalent hypotheses (\(H\) and its contrapositive) have identical likelihoods \(P(D|H)\), so evidence updates posteriors equally.  
  - **Probabilistic argumentation**: Bayesian updates handle the paradox quantitatively.  

  **Translates with distortion**:  
  - **Nicod's condition**:  
    - **Distortion**: In Protocol 1, observing any instance (black raven or non-black non-raven) confirms \(H\) equally—contradicting Nicod’s intuition that non-ravens are irrelevant.  
    - **Cause**: Sampling protocol (uniform from all objects) dilutes evidence by including irrelevant objects.  
  - **Universal generalization**:  
    - **Distortion**: \(H\) is a single point in a finite sample space, not an open-ended claim.  
    - **Cause**: Finite \(N\) and prior over counts force specification of alternative hypotheses (e.g., \(b > 0\)).  

  **No expression in your vocabulary**:  
  - **Qualitative, protocol-free confirmation**:  
    - Your framework requires specifying a sampling distribution to compute \(P(D|H)\). Hempel’s "confirmation" is a binary relation (observation \(O\) confirms hypothesis \(H\)), independent of how \(O\) was obtained.  
  - **Open-ended domain generalization**:  
    - \(H\) quantifies over all ravens (including unseen/future), but your sample space is fixed. Domain shift/covariate shift handle distributional changes, but not unbounded universality.  
  - **Normative upshot for inquiry**:  
    - Your framework evaluates predictions against a loss function (e.g., deployment risk). It cannot prescribe what to observe *without* specifying costs or a deployment distribution. Hempel’s paradox implies we "ought" to seek ravens, not herrings.  
  - **Residual missing piece**:  
    - Confirmation as a **normative epistemic virtue**: Independent of practical risk, should \(D\) *count as evidence* for \(H\)? Your vocabulary lacks a protocol-invariant measure of pure evidential support.  

  ---

  ### 4. Verdict on the Residue  
  **Blind spot**: Yes, your framework has a **structural limitation**:  
  - It is **protocol-bound** (evidence cardinality depends on sampling).  
  - It is **tied to predictive risk** (loss on a deployment distribution).  
  - It cannot capture **protocol-free confirmation** or **normative epistemic obligations**.  

  **What a complete framework requires**:  
  - A **measure of pure evidential support** that:  
    - Is invariant to sampling protocol (e.g., based on likelihood ratios without conditioning on protocol).  
    - Applies to open-ended domains (e.g., via non-enumerable hypothesis spaces or universal generalizations).  
    - Grounds normative inquiry (e.g., "seek observations with high expected evidential value").  
  - **Candidates**:  
    - **Likelihoodism**: \(P(D|H)\) as evidence strength, ignoring protocols/priors. But clashes with Bayesian updates.  
    - **Objective Bayesianism**: Reference priors for universal hypotheses. Computationally intractable.  

  **Alternative view**: The residue is **not a flaw in your framework** but exposes **excess baggage in the paradox**:  
  - Protocol-free evidence is **operationally irrelevant**. In real-world ML, evidence is always gathered under a protocol (e.g., active learning, random sampling).  
  - The paradox was **really about efficiency**: Intuition rejects non-ravens as evidence because they are costly and weak. Strategy R dominates when cost matters.  

  **Final verdict**: The residue reflects a **philosophical idealization** (protocol-free confirmation) that your **pragmatic, risk-driven framework** rightly discards. The paradox was a misstep—it obscured that inquiry is resource-constrained, and evidence is cheap or dear.
