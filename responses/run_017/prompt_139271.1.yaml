answer: |-
  Here is the precise response as requested:

  (1) No single established term fully captures the core phenomenon as described, particularly its "external import" character.

  (2) The nearest established concept is **invariant** (or conserved quantity). The fit fails because "invariant" typically describes a property *within* the system's defined state-space or rules (e.g., energy conservation in physics, loop invariants in CS), whereas your cases crucially require importing a novel, external structure (mod-3 arithmetic, coloring) not implied by the rules.

  (3) The move is identifying an **externally imposed invariant**: a property defined via a structure foreign to the original problem's rules, preserved by all legal operations, invariant in the initial state, and differing in the target state. (i) Disputes cycling due to an unstated framing feature *are* analogous if the feature is an externally imposed invariant preserving the dispute's structure. (ii) The feature's arbitrariness *is* essential – the technique involves a creative leap to select a useful external structure, not a mechanical method. (iii) The jump is *out* relative to the original rule-system; using arithmetic doesn't negate this, as arithmetic wasn't part of the string-rewriting or tiling rules framework.

  (4) **Rejected candidates**:  
      • *Symmetry argument*: Too broad; symmetries are often inherent or rule-based, not externally imposed (e.g., rotational symmetry in physics is inherent).  
      • *Emergent property*: Implies arising from the system's dynamics, not deliberately imposed from outside (e.g., flocking behavior in birds emerges from rules).

  (5) Coinage: **External conservation**. Definition: Proving the unreachableability of a target state by defining a conserved property via a structure extrinsic to the system's given rules. Counterexample: Proving a position in Chess is lost by exhaustive search within Chess rules shows the definition is wrong (no external structure imported).
