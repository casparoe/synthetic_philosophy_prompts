answer: |-
  Here's a complete exam package designed to force engagement with causality beyond descriptive partitioning. The invented case avoids clichés while preserving the conceptual challenge.

  ---

  **1. Exam Question: "The Case of the Ephemeral Algae" (50-minute take-home)**

  **Background:**  
  Consider a species of asexually reproducing algae inhabiting a vast ocean. Each generation proceeds as follows:  
  1. **Reproduction:** Individuals reproduce clonally. Offspring production is determined solely by an individual’s fitness score.  
  2. **Group Formation:** Immediately after reproduction, all individuals (parents and offspring) are *randomly assorted* into transient "rock-pool groups" of fixed size \( N = 5 \). These groups persist for one tidal cycle.  
  3. **Group Interaction:** Within each group, individuals express one of two alleles:  
     - **Cooperator (C):** Produces a diffusible nutrient that boosts the total resource availability for the *entire group*. However, expressing this allele *reduces* the individual’s fitness by \( c = 0.8 \) (e.g., due to metabolic cost).  
     - **Defector (D):** Does not produce the nutrient and pays no cost.  
     A group’s *total reproductive output* is multiplied by \( 1 + b \times (\text{number of C in group}) \), where \( b = 0.2 \). Individual fitness within the group is:  
     \[
     w_i = \text{base fitness} - c + \frac{b \times (\text{number of C in group})}{N}
     \]  
     (Base fitness = 1.0 for all).  
  4. **Group Dissolution:** After one tidal cycle, groups dissolve. All surviving individuals return to a common oceanic pool. The cycle repeats.  

  **Crucial Features:**  
  - Groups form randomly each generation; no group persists or reproduces as a unit.  
  - The multilevel Price equation partitioning of allele frequency change \( \Delta p \) *always shows a positive between-group variance component* due to the group-beneficial effect of cooperators.  
  - A purely genic (allele-frequency) model of evolution is *also always possible**.  

  **Your Task:**  
  Explain **whether, and in what sense, groups constitute a genuine "unit of selection"** in this system. In your analysis, address *all* of the following:  
  (a) What does the distinction between *selection of groups* versus *selection for cooperation* clarify or fail to clarify here?  
  (b) Must a "unit of selection" be a lineage (i.e., an entity with parent-offspring replication)? If so, what is lost if we relax this requirement? If not, why?  
  (c) What *empirical or counterfactual evidence* (beyond the Price partitioning) would definitively resolve whether group-level selection is occurring?  
  (d) A student argues: "The Price equation shows both group and genic descriptions are mathematically valid. Choosing between them is purely pragmatic—neither is *really* the unit." What insight does this view capture, and where does it fall short?  

  **Constraints:**  
  - Do not rederive the Price equation. Use it as a tool for interpretation.  
  - Focus on conceptual clarity, not quantitative calculation.  

  ---

  **2. Model Answer (Approx. 700 words)**

  The ephemeral algae case presents a puzzle: cooperation evolves despite individual costs, and the Price equation decomposition always reveals a between-group component favoring cooperators. Yet groups lack lineages—they dissolve each generation. This forces us to disentangle *statistical patterns* from *causal levels of selection*.

  **(a) Selection-of vs. Selection-for**  
  The *selection for* cooperation occurs *because* of its group-beneficial effects. The between-group component in the Price equation reflects this: groups with more cooperators have higher mean fitness, so cooperation is *selected for* at the group level. However, *selection of* groups requires groups to be "chosen" based on their properties in a way that affects their representation in future generations. Here, groups do not reproduce or persist; they are temporary vehicles. Thus, while there is *selection for cooperation* at the group level (due to group-structure effects), there is no *selection of groups* as evolutionary units. This distinction clarifies that group-structured *interactions* drive the evolution of cooperation, but groups themselves are not units undergoing Darwinian selection.

  **(b) Lineages and Reproductors**  
  A unit of selection must be a *lineage* (a reproducer in Godfrey-Smith’s sense). Selection requires heritable variation in fitness across generations. Groups here lack heritability and reproduction: they are randomly reassembled ephemera. While groups are *interactors* (sites where selection-for occurs), they are not *reproducers*. If we drop the lineage requirement, we conflate interactors with units of selection. This risks making "unit of selection" vacuous—*any* statistical aggregate (e.g., left-side-of-the-pool groups) could be labeled a "unit" if it shows variance in fitness. The key loss is explanatory power: only reproducers explain adaptation. Here, the sole reproducer is the individual algae (or their genomes), as only they have parent-offspring lineages.

  **(c) Empirical/Countefactual Evidence**  
  The Price partitioning alone is insufficient. To test if group-level selection is causal, we need:  
  1. **Group Heritability Manipulation:** If we *prevent* random assortment (e.g., by keeping groups intact across generations), cooperation should evolve *more rapidly*. If cooperation still evolves under random assortment (as here), it is driven by individual selection in a group-structured population, not group selection.  
  2. **Contextual Analysis:** Regress individual fitness against *individual* genotype *and group context* (e.g., % cooperators). If the group coefficient remains significant after controlling for individual effects, group interactions are causal.  
  3. **Counterfactual:** If groups had no effect on fitness (set \( b = 0 \)), cooperation would disappear. But this only confirms cooperation is *for* group benefit, not that groups *are* units. The definitive test is whether group *lineages* matter—which they do not.  

  **(d) The "Pragmatic" View: Insight and Limits**  
  The "bookkeeping" view correctly notes that both genic and multilevel descriptions are mathematically valid. The Price equation is a tautology; partitioning variance is a choice. This highlights that *descriptive flexibility* exists: we could model this system solely via allele frequencies (including contextual effects), avoiding "group" talk. The pragmatic insight is that we should use the simplest model that predicts evolutionary change.  

  However, this view falls short ontologically. While both descriptions predict \( \Delta p \), they imply *different causal structures*. A genic model treats group effects as "environmental" noise for genes. The multilevel model explicitly recognizes that the *group context* causally influences fitness. Dismissing this as "mere description" ignores that:  
  - **Causal Explananda:** Explaining *why* cooperation evolves requires citing group-structure (e.g., "Cooperation persists because groups with cooperators outproduce others").  
  - **Intervention Effects:** If we manipulate group size or assortment, the multilevel model better predicts outcomes.  
  - **Generalization:** In systems with *stable* groups, the multilevel framework seamlessly explains emergent adaptations (e.g., division of labor), while a purely genic model obscures this.  

  **Conclusion:** Groups are not units of selection here—they lack lineages. But they are crucial *interactors*, making selection-for cooperation possible. The Price equation’s between-group component reflects this interactor-level effect, not group-level selection. The "pragmatic" view usefully warns against reifying statistical partitions but errs by reducing causal explanations to predictive equivalence.  

  ---

  **3. Marking Scheme (Total: 25 points)**  
  **Key Moves & Common Errors:**  
  1. **Distinguish selection-of groups vs. selection-for cooperation** (5 pts)  
     - *Hit:* Clearly states groups are selected *for* (due to effect on cooperation) but not selected *of* (no group lineages).  
     - *Miss:* Equates the Price between-group term with "group selection" simpliciter.  

  2. **Address lineage/reproducer requirement for units of selection** (5 pts)  
     - *Hit:* Argues units must be reproducers (lineages); groups here are interactors only.  
     - *Miss:* Claims groups are units because they "affect evolution" or fails to define "unit."  

  3. **Propose empirical/counterfactual tests beyond Price partitioning** (5 pts)  
     - *Hit:* Suggests manipulating group heritability or contextual regression.  
     - *Miss:* Only cites Price terms or vague "experiments."  

  4. **Critique "pragmatic" view: Insight & limits** (5 pts)  
     - *Hit:* Praises descriptive flexibility but notes causal/explanatory loss.  
     - *Miss:* Fully endorses or fully dismisses pragmatism without nuance.  

  5. **Synthesize why this case is ambiguous & resolve it** (5 pts)  
     - *Hit:* Notes Price partitioning is necessary but insufficient; concludes groups are interactors, not units.  
     - *Miss:* Stops at "groups matter" or "it depends."  

  **A vs. Strong B Differentiation:**  
  - **B-Grade (18-20/25):** Hits all moves but lacks depth in synthesis (e.g., doesn’t connect causality to explanation) or missteps on one sub-question.  
  - **A-Grade (21-25/25):** Explicitly ties the debate to *causal metaphysics* (e.g., using Godfrey-Smith/D.S. Wilson), anticipates objections (e.g., "But doesn’t the group effect cause evolution?"), and rigorously separates prediction from explanation.  

  **Grading the "Bookkeeping" Answer:**  
  - **Reward (up to 4/5 on Q4):** If they argue both descriptions are predictively valid and choice is pragmatic, *but add* that causal explanations require identifying interactors/reproducers.  
  - **Penalize:** If they claim levels are *only* descriptive with no ontological implications (max 2/5 on Q4).  
  - **Key:** The strong "bookkeeping" answer earns a B; to get an A, they must engage causality.  

  This setup forces students to wrestle with why we care about "units" beyond formalism—pushing them toward the meta-biology of causation. The algae case is intentionally "boundary-pushing" to expose conceptual fault lines. Good luck with your grading!
