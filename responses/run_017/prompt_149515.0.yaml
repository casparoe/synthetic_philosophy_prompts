  The user’s coffee-jar variation is key. At a small scale, the inequality doesn’t feel problematic, which suggests scale matters. But Nozick’s argument is supposed to be scale-invariant, so why does intuition change? The user suspects a hidden threshold premise. That’s a valid point. The libertarian might counter that interference is always wrong, but in practice, people tolerate small inequalities. This points to an inconsistency in applying principles versus intuition.

