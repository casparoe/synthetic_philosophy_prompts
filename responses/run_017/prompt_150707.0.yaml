prompt: |-
  Me and two other people have been building the first real glossary for a language none of us spoke when we got here — no shared language, no writing system, everything built up from pointing at stuff and watching when they nod and when they shake their heads. Now I have to decide what to tell everyone, and I've been turning it over for weeks and its starting to wreck my sleep.

  We all agree that when a rabbit runs past, the word they use is "kiri." Maya's draft says kiri means rabbit. Dev's draft says kiri means undetached rabbit part. They aren't just arguing about notation: he's also changed how he renders their word for "the same one," so where Maya gets "that's the same rabbit again," Dev gets "that's another kiri-part of the same rabbit." And there's so far nothing — no pointing, no nodding, no head-shaking, no question we've managed to set up — where the two drafts predict different behaviour. I thought I had a test (show them a rabbit with half of it hidden behind a bush, then ask "kiri?"), but Dev just tweaked his translation of their word for "part" and the predictions matched again. He says, annoying cheerful about it, that he could run this trick on any word we settle on, and that the issue isn't missing data — no possible data would settle it.

  We've got funding for six more weeks and the print shop wants a final file Friday. Maya says there's a real answer out there and we just haven't thought of the right question, so use the six weeks. Dev says there's nothing to find and we should just pick whichever version is easiest to teach. Our third teammate says it doesn't matter because the two drafts "really say the same thing." It's going on the wall of a clinic, for what it's worth, so I do care whether someone ends up with the wrong dose.

  Who's closest to right, and what do I actually do with the six weeks? Is Maya's there-must-be-a-fact-of-the-matter even a coherent thing to say in this situation, or is it just hope? 250 words max, plain english if you can, and please don't just tell me to go collect more data.
