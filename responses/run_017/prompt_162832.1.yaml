prompt: |-
  You are a professional philosopher specializing in social ontology and the theory of social norms — the area that deals with conventions, coordination, shared expectations, and how collective practices persist or collapse. You are careful about near neighbours: you do not answer a request for a concept by handing over a label, you say what the phenomenon is, what it is not, and where its edges lie.

  Work through this in stages. First brainstorm — list, without committing yourself, six to eight candidate concepts from philosophy, social psychology or economics that could cover part of what I describe. Then test each candidate against the specific features I list, saying which features it handles and which it leaves unexplained. Only then give me your verdict. If the honest verdict is that no established concept covers the whole configuration, say so plainly rather than stretching one to fit.

  The context: I'm a senior backend engineer, about fifteen years in, five companies, no philosophy training. I keep running into the same shape of thing on different teams and I want to know whether anyone has a name for it.

  Three instances. (1) At one job, nobody could merge their own pull request — in a four-person team where every PR was read by everyone else anyway, where merging your own PR was strictly faster, and where nobody could point to a single incident the rule had prevented. Privately, every person I asked said the rule was pointless. At a retro, when it was raised, the objection was some version of "that's just how we do code review here." I went looking for the written policy. There wasn't one. The rule existed only as the thing everyone did and everyone assumed someone else had decided.

  (2) At another place, deploys only happened on Tuesdays. The reason — a database maintenance window — had been gone for two years, and the engineer who set it up had left. Nobody defended Tuesday on the merits. But every time someone proposed deploying whenever it was ready, the answer was "too risky," and no one could say what the risk was.

  (3) Smaller: a codebase where every module had to contain a file re-exporting its own contents. Nobody knew why. People copied it from the neighbouring module. A new hire asked and was told it was in the style guide. It was not in the style guide.

  The features I think matter, and which I want tested individually: (a) whatever purpose the practice once had is simply absent — not contested, not outweighed, just unlocatable; (b) it is held up by each person's expectation that the others will keep doing it, not by anyone's approval — asked alone, each person would happily drop it; (c) it is attributed to a standard or authority that does not exist; (d) it is individually rational to keep and collectively better to drop, and the second half of that is out in the open: people say in the meeting that they'd rather drop it, they hear each other say it, and still nothing moves.

  Some people have offered me candidates and I don't think they fit, but I'd like you to check my reasoning rather than agree with it. A friend said pluralistic ignorance; as I understand it that's when people are wrong about what others privately think, and here nobody seems to be wrong about that — the griping is public — so the failure must be elsewhere. Someone else said it's just a convention, like driving on the left; but the driving case has a point, we'd crash, whereas here nothing would break, there is nothing left to coordinate on. Though I'm suspicious of my own objection: maybe the thing being coordinated on is the conformity itself, with no external payoff at all, and conventions can simply outlive their own rationale — tell me if that's right and my case is boring after all. Someone mentioned path dependence and the QWERTY story, but the switching-cost stories I've heard have a real cost to switching, and I can't find one here beyond the bare fact of having to do it together. Status quo bias and loss aversion were also suggested, but those sound like facts about individual psychology and would predict the practice is fragile once the alternative is offered explicitly and liked; it isn't fragile.

  If nothing established fits, coin a name and give me: a one-sentence definition, the conditions you think are necessary, and the boundary cases — a case that looks like mine but is a clear instance of the nearest established concept, a case that is mine but would be wrongly excluded by a definition slightly too strong, and a case that is mine but doesn't obviously look like it (for instance: is it still the same phenomenon when the phantom authority is a real person who is merely indifferent? Or when the practice is mildly harmful rather than merely pointless?).

  Finally, tell me what the smallest change is that would make such a practice collapse — is everyone saying it out loud in a meeting actually the thing it takes, or is something more demanding needed?

  Two constraints: no citations, bibliographies or reading lists — I have no library access and can't check them, so argue from the concepts themselves. And keep it in plain language; assume I know nothing about the literature. Roughly 600–900 words.
reasoning: |-
  Okay, the user is a senior backend engineer with 15 years of experience across five companies. They've encountered recurring patterns in team practices that seem irrational but persist. They described three instances: a rule against merging own PRs without policy, Tuesday deploys without reason, and unnecessary re-export files copied between modules. The key features are (a) absent original purpose, (b) maintained by mutual expectations despite individual willingness to drop it, (c) attributed to non-existent authority, and (d) individually rational to keep but collectively better to drop - with open discussion failing to change it.

  The user has rejected several existing concepts: pluralistic ignorance (since private disapproval is publicly known), conventions like driving side (which have clear coordination purposes), path dependence/QWERTY (which involve real switching costs), and status quo bias/loss aversion (which should break when alternatives are preferred). They suspect conventions might outlive their rationale but feel their case is different. Their deeper need seems to be understanding why collective irrationality persists despite consensus, possibly seeking leverage points to change such dynamics.

  Brainstorming candidate concepts:
  1. Conventions (Lewis): Focus on arbitrary but coordination-beneficial patterns. However, the user's cases lack current coordination benefits.
  2. Pluralistic ignorance: Involves misperceiving others' private beliefs. Doesn't fit because here people openly acknowledge the practice is pointless.
  3. Path dependence: Historical decisions creating inertia. But no switching costs exist here beyond coordination itself.
  4. Social norms (Bicchieri): Rules enforced by expectations and sanctions. Missing here are sanctions and normative approval.
  5. Institutional facts (Searle): Reality created by collective agreement. But these practices aren't consciously constituted as rules.
  6. Organizational routines: Repetitive patterns in organizations. However, routines usually have traceable origins and functions.
  7. Collective action problem: Situations where individual rationality conflicts with group benefit. But this typically involves conflicting incentives, not aligned preferences.

  Testing against features:
  - Conventions: Fail (a) absent purpose and (d) collective preference to drop.
  - Pluralistic ignorance: Fail (b) no private/public belief mismatch.
  - Path dependence: Fail (d) no actual switching costs.
  - Social norms: Fail (b) no personal investment in maintaining the norm.
  - Others similarly miss at least two key features.

  Verdict: No established concept fully fits. The core is a self-sustaining empty practice where mutual expectations create inertia despite unanimous latent willingness to change, compounded by phantom authority attribution.

  Coining "Expectation Traps": Defined as self-sustaining collective practices where 1) the original purpose is gone, 2) continuation relies solely on mutual expectations of compliance, 3) attributed to phantom authority, 4) individually rational to maintain but collectively detrimental, with 5) open discussion failing to break inertia.

  Boundary cases:
  - Clear convention: Driving side change - has coordination purpose during transition.
  - Mildly harmful version: Keeping a slightly inefficient practice fits if other conditions hold.
  - Real indifferent authority: Differs because actual authority exists, even if inactive.

  Collapse condition: Requires simultaneous, credible commitment to change during discussion. Mere acknowledgment isn't enough - there must be a mechanism to dissolve mutual expectations (e.g., "Let's all stop Tuesday deploys starting now - any objections?" with real-time agreement).

  This addresses the user's need for conceptual clarity while offering practical insight into breaking such patterns in their work.
answer: |-
  ### Brainstormed Candidates
  1. **Convention** (David Lewis): Arbitrary but stable coordination patterns where everyone prefers conformity *because* others conform.  
  2. **Pluralistic Ignorance**: Group members privately reject a norm but mistakenly believe others accept it, leading to public compliance.  
  3. **Path Dependence**: Historical decisions lock in practices due to switching costs (e.g., QWERTY keyboards), even if superior alternatives exist.  
  4. **Social Norm** (Cristina Bicchieri): Rule followed due to empirical expectations (others do it) and normative expectations (others think *should* do it), with sanctions for deviation.  
  5. **Institutional Fact** (Searle): A collectively assigned status (e.g., "money") that depends on shared belief.  
  6. **Organizational Routine**: Repetitive, pattern-based actions in groups, often self-sustaining through habit.  
  7. **Collective Action Problem**: Individual rationality (e.g., free-riding) clashes with group benefit, requiring coordination to resolve.  
  8. **Status Quo Bias**: Cognitive preference for current states due to loss aversion or effort avoidance.  

  ---

  ### Testing Candidates Against Your Features  
  **(a) Original purpose absent**  
  - **Convention**: Fails. Conventions require *some* coordination benefit (e.g., avoiding traffic chaos). Your cases lack *any* benefit.  
  - **Pluralistic Ignorance**: Fails. The issue isn’t hidden purpose—it’s *no* purpose. People know it’s pointless.  
  - **Path Dependence**: Fails. No switching costs exist (e.g., Tuesday deploys cost nothing to change).  
  - **Social Norm**: Fails. Norms often persist for functional reasons (e.g., trust). Here, no underlying function remains.  
  - **Others**: All fail—they assume latent purpose, cost, or function.  

  **(b) Held up by expectations, not approval**  
  - **Convention**: Partial fit. Conventions rely on expectations, but individuals here *don’t* intrinsically prefer conformity—they’d ditch it alone.  
  - **Pluralistic Ignorance**: Fails. People accurately know others dislike the practice (griping is public).  
  - **Social Norm**: Fails. Norms require belief that others *approve* of the rule (normative expectations). Here, no one approves.  
  - **Institutional Fact**: Fails. These depend on collective *belief in legitimacy* (e.g., "merging requires review"). No such belief exists.  

  **(c) Attributed to phantom authority**  
  - **Organizational Routine**: Partial fit. Routines spread via copying, but attribution to authority (e.g., "style guide") is unique to your cases.  
  - **Institutional Fact**: Fails. Authority here is imagined, not collectively constituted.  
  - **Others**: No match—this feature is distinctive.  

  **(d) Individually rational/collectively better to drop, yet stuck despite open discussion**  
  - **Collective Action Problem**: Fails. These involve conflicting incentives (e.g., prisoner’s dilemma). Here, incentives align—everyone wants change.  
  - **Status Quo Bias**: Fails. Bias should break when alternatives are preferred and voiced—yet inertia persists.  
  - **Convention**: Fails. Dropping a convention without coordination *would* cause chaos (e.g., sudden driving-side switch). Here, no chaos is feared.  

  **Summary of Gaps**:  
  - Conventions require residual coordination value; your cases have none.  
  - Norms/pluralistic ignorance require misaligned beliefs; here, beliefs align (all reject the practice).  
  - Path dependence requires switching costs; here, costs are purely psychological.  
  - **Core issue**: A self-reinforcing loop of compliance driven solely by mutual expectations, phantom authority, and *zero* functional or normative weight.  

  ---

  ### Verdict: No Established Concept Fits  
  This isn’t "just a convention" (your suspicion is right: conventions need *ongoing* coordination value). Nor is it pluralistic ignorance or norms. The configuration is distinct: **a ghost practice, sustained only by reciprocal expectations and invented legitimacy, with unanimous latent rejection**.  

  ---

  ### Coined Concept: **Expectation Traps**  
  **Definition**: *A collective practice that persists solely because each participant complies out of expectation that others will comply, despite unanimous private rejection, absence of original purpose, and attribution to a nonexistent authority.*  

  **Necessary Conditions**:  
  1. **Purpose decay**: The practice’s initial rationale has vanished (not merely outweighed).  
  2. **Mutual expectation dependence**: Compliance is driven only by anticipating others’ compliance—not approval, sanctions, or gain.  
  3. **Phantom authority**: The practice is falsely justified by appeal to an external standard (e.g., "policy") that doesn’t exist.  
  4. **Alignment trap**: All participants prefer abandonment but comply individually to avoid (perceived) social or operational friction.  
  5. **Discussion-resistant inertia**: Open agreement to change fails to dissolve expectations.  

  **Boundary Cases**:  
  - **Near miss (Convention)**: Switching from driving on left to right. Chaos during transition provides real coordination value—unlike your cases.  
  - **Overly strict exclusion (Phantom authority is real but indifferent)**: A team attributes a useless rule to a living ex-employee who couldn’t care less. Still an Expectation Trap—the authority is functionally phantom.  
  - **Non-obvious match (Mildly harmful practice)**: Requiring documentation that slightly slows work but provides trivial benefit. Still fits if conditions 2–5 hold and harm is acknowledged.  

  ---

  ### Smallest Change to Collapse It  
  **Not mere discussion**—your retros prove this fails. The trap persists because:  
  - Individual compliance remains rational *until expectations shift simultaneously*.  
  - Phantom authority blocks agency ("Who are we to change the ‘rule’?").  

  **The critical intervention**: **Synchronous, credible commitment** during discussion. For example:  
  1. Expose the phantom authority ("No policy exists—we invented this").  
  2. Propose immediate discontinuation: "If no one objects *right now*, we drop Tuesday deploys forever starting *this minute*."  
  3. Secure real-time, verbal group commitment (e.g., "All in favor? Ayes carried.").  

  **Why this works**: It shatters mutual expectations by creating a common belief that non-compliance is now expected. The "anchor" of phantom authority dissolves, aligning individual and collective rationality. Silence or hesitation breaks the loop—participation becomes irrational once others defect.  

  **If this fails?** Then it wasn’t a pure Expectation Trap—something else (e.g., hidden power dynamics) is at play. But in your cases, this should suffice.
