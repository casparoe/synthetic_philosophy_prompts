answer: |-
  Here’s a comprehensive package for your units of selection question, designed to force students beyond textbook answers. The fictional case study avoids clichés while isolating the conceptual crux.

  ---

  ### 1. The Question: Handout Version  
  **Philosophy of Biology 490: Take-Home Final Question (25 marks)**  
  **Time allowance:** 50 minutes  

  **Background:**  
  Consider a population of asexual, clonally reproducing *dwarf pit-plants* in a volatile environment. Each generation, individuals are randomly assorted into groups of exactly five. Within groups, a heritable allele \(C\) (cooperator) causes a plant to secrete nutrients that boost the group’s total seed output by 20%. However, \(C\)-bearers produce 15% fewer seeds than non-cooperators (allele \(N\)) within the same group due to energy costs. After seed dispersal, all groups dissolve, and seeds from the entire population form a common pool for the next generation. Groups never reproduce as units; they exist only for a single reproductive episode.  

  **Data:**  
  - Baseline seed output per individual: 100 seeds (without cooperation effects).  
  - In a group with \(k\) cooperators:  
    - Each \(C\)-bearer produces 85 seeds.  
    - Each \(N\)-bearer produces \(100 + (20 \times k)\) seeds.  
    - Total group output: \([85k + (100 + 20k)(5-k)]\) seeds.  

  **Task:**  
  Critically evaluate whether *groups* function as units of selection in this system. Your analysis must:  
  (a) Explain why the presence of a between-group variance term in a multilevel Price equation partitioning is insufficient to confirm group selection.  
  (b) Analyze whether the *selection-of-groups* vs. *selection-for-cooperation* distinction resolves the debate.  
  (c) Assess whether groups must be "lineages" or "reproducers" to qualify as units of selection, and what is lost if we drop this requirement.  
  (d) Specify what *empirical or counterfactual evidence* (beyond the Price equation) would definitively settle whether group selection occurs.  
  (e) Engage with the claim: "The gene- and group-level descriptions are mathematically equivalent—choosing between them is purely pragmatic." What does this view correctly capture, and where does it fall short?  

  ---

  ### 2. Model Answer (Approx. 700 words)  
  The dwarf pit-plant system presents a puzzle for the units of selection debate: while group structure affects evolutionary dynamics, groups lack lineages. A multilevel Price equation will always partition the change in cooperator frequency (\(\Delta p\)) into within-group (\(\Delta p_{\text{within}}\)) and between-group (\(\Delta p_{\text{between}}\)) components. \(\Delta p_{\text{between}}\) will be positive because groups with more cooperators have higher total fitness, creating a covariance between group cooperator frequency and group mean fitness. However, this statistical fact cannot, by itself, establish that group selection operates. The partitioning is a mathematical tautology—it describes *outcomes* but not *causes*.  

  **(a) The Price equation’s insufficiency** arises because \(\Delta p_{\text{between}}\) captures the *consequence* of group-structured variation, not necessarily group-level *selection*. Here, the between-group term emerges solely from individual fitness differences: \(N\)-bearers gain more in cooperator-rich groups, while \(C\)-bearers always suffer a deficit. The group-level covariance is an aggregate effect of individual selection. Crucially, if we simulate a counterfactual with no groups (random interactions), cooperators still decline due to their intrinsic cost—confirming that selection acts primarily *against* \(C\)-alleles at the individual level.  

  **(b) Selection-of vs. selection-for** clarifies but doesn’t resolve the issue. We can say groups are *selected of* (group fitness differences cause differential persistence of group compositions), but the trait *selected for* is cooperation, which is individually disadvantageous. This distinction reveals that group-level *outcomes* occur without group-level *agency*. However, it doesn’t tell us whether group selection is causally real or epiphenomenal. When groups dissolve every generation, "selection-of-groups" describes a transient statistical pattern, not a distinct selective process.  

  **(c) Lineages and reproducers** are often seen as necessary for genuine units of selection (e.g., Maynard Smith’s replicator view). Groups here are not reproducers—they lack heritability of group traits across generations. If we drop this requirement, we risk conflating *any* emergent fitness variation with "selection." For example, grouping plants by height would also create a between-height-group covariance term, but we wouldn’t call this "height-group selection." What’s lost is explanatory power: restricting "units" to reproducers (like genes or organisms) identifies entities with evolutionary trajectories. Here, only individual plants (and their alleles) have lineages.  

  **(d) Definitive evidence** requires isolating group-level causality. Crucially, we must test if group fitness is *causally dependent* on group composition. One approach: manipulate group structure while holding individual traits fixed. For instance, if we forcibly create groups with identical \(C\):\(N\) ratios but vary resource distribution (e.g., shared soil vs. isolated pots), and group benefits disappear only in the latter, this would support group selection. Alternatively, if cooperators still decline when groups are homogenized (removing between-group variance), individual selection suffices as an explanation. The key is to show that group properties *add* causal force beyond individual fitnesses.  

  **(e) Pragmatic equivalence** correctly notes that both descriptions predict \(\Delta p\). A gene-centric view treats the \(C\)-allele’s decline as driven by its average deficit (weighted by group context), while the multilevel view attributes it to within-group selection overpowering between-group selection. This equivalence is mathematically valid—and useful for modeling. However, it falters in *explaining why* cooperation persists at all. Here, the group description misleadingly implies groups are actors, obscuring that the "benefit" arises from selfish \(N\)-alleles exploiting cooperators. Pragmatism also fails in counterfactuals: if we introduce group heritability (e.g., groups reproduce intact), the two descriptions diverge in predictions. Thus, while bookkeeping is flexible, causal explanations are not interchangeable.  

  **Conclusion:** Groups here are not units of selection. The between-group Price term reflects an emergent property of individual selection in structured populations, not a distinct causal process. Units need not be replicators (contra Dawkins), but they must exhibit heritable fitness differences—which groups lack. The core issue is causal: group selection requires group fitness to exert downward pressure on individual variation, which isn’t observed here.  

  ---

  ### 3. Marking Scheme (Total: 25 marks)  
  **Five Must-Hit Moves** (5 marks each):  
  1. **Price equation insufficiency (5 marks)**  
     - *Hit:* Notes \(\Delta p_{\text{between}}\) is necessary but not sufficient; emphasizes its tautological, non-causal nature.  
     - *Common error:* Assumes a positive \(\Delta p_{\text{between}}\) *implies* group selection.  
  2. **Selection-of/for distinction (5 marks)**  
     - *Hit:* Separates selection-of-groups (statistical outcome) from selection-for-cooperation (trait disadvantage); shows neither resolves causality.  
     - *Common error:* Conflates the two or claims the distinction alone answers the unit question.  
  3. **Lineage/reproducer requirement (5 marks)**  
     - *Hit:* Argues that dropping this requirement dilutes "unit" to meaninglessness; explains why groups aren’t reproducers.  
     - *Common error:* Claims reproducer status is irrelevant OR insists it’s decisive without nuance.  
  4. **Empirical/counterfactual evidence (5 marks)**  
     - *Hit:* Probes causality (e.g., "manipulate group structure while fixing traits"); links to testable predictions.  
     - *Common error:* Vague suggestions (e.g., "measure more data") or Price-based tests only.  
  5. **Pragmatism assessment (5 marks)**  
     - *Hit:* Acknowledges descriptive equivalence but identifies explanatory asymmetry; notes counterfactual divergence.  
     - *Common error:* Fully endorses pragmatism OR dismisses it entirely.  

  **A vs. Strong B Differentiation:**  
  - **B-grade (20-22/25):** Hits all moves competently but misses causal depth. May treat Price partitioning as "evidence" without critique, or accept pragmatism uncritically.  
  - **A-grade (23-25/25):** Explicitly frames the debate as *causal* (not statistical), identifies the epiphenomenal nature of group benefits, and shows how cooperator decline is driven *solely* by individual costs amplified by structure. Crucially, exposes why group fitness is not a causal force here.  
  - **Grading "It’s just bookkeeping":**  
    - **Reward (half right):** If they note mathematical equivalence and context-dependent utility (e.g., for modeling short-term dynamics).  
    - **Penalize (half wrong):** If they ignore explanatory asymmetry (e.g., group description misattributes causality) or fail to note that pragmatism collapses under counterfactuals (e.g., if groups reproduced).  
    - **A-level insight:** Distinguishes *prediction* (where pragmatism holds) from *explanation* (where causality matters).  

  This forces students to wrestle with causality—not just labels—while rewarding nuanced engagement with the "bookkeeping" view. The invented case study ensures they can’t regurgitate textbook examples. Let me know if you’d like a tweaked version!
