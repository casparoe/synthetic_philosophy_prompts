  ### Part 1: Arithmetic and Decision-Theoretic Results (Non-Controversial)

  The gamble you describe is a capped version of the St. Petersburg paradox. A fair coin is flipped until the first heads, with a payout of \(2^{n-1}\) dollars for \(n\) flips, capped at approximately \(10^{12}\) dollars (one trillion dollars). The cap is applied at the point where \(2^{n-1}\) exceeds \(10^{12}\), which occurs at \(n=41\) (since \(2^{40} \approx 1.0995 \times 10^{12} > 10^{12}\), and \(2^{39} \approx 5.4976 \times 10^{11} < 10^{12}\)). Thus, the payout \(X\) is:
  - \(X = 2^{n-1}\) for \(n = 1\) to \(40\) (payouts from $1 to \(2^{39}\) dollars).
  - \(X = 10^{12}\) for \(n \geq 41\) (capped payout).

  The probability of first heads on flip \(n\) is \((1/2)^n\). The expected value (EV) of the payout is:
  \[
  E[X] = \sum_{n=1}^{40} \left(\frac{1}{2}\right)^n \cdot 2^{n-1} + \sum_{n=41}^{\infty} \left(\frac{1}{2}\right)^n \cdot 10^{12}.
  \]
  Simplifying:
  - The first sum: \(\sum_{n=1}^{40} (1/2)^n \cdot 2^{n-1} = \sum_{n=1}^{40} (1/2) \cdot (1)^{n-1} = \sum_{n=1}^{40} 1/2 = 40 \times 0.5 = 20\).
  - The second sum: \(\sum_{n=41}^{\infty} (1/2)^n \cdot 10^{12} = 10^{12} \cdot (1/2)^{41} / (1 - 1/2) = 10^{12} \cdot (1/2)^{41} \cdot 2 = 10^{12} \cdot (1/2)^{40}\).
    - \((1/2)^{40} = 1 / 2^{40} \approx 1 / 1.0995 \times 10^{12} \approx 9.0949 \times 10^{-13}\).
    - So \(10^{12} \cdot 9.0949 \times 10^{-13} = 0.90949\).
  Thus, \(E[X] \approx 20 + 0.90949 = 20.90949\) dollars.

  **Key points:**
  - The expected payout is finite and approximately $20.91 due to the cap. Without the cap, the EV would be infinite, as \(\sum_{n=1}^{\infty} (1/2)^n \cdot 2^{n-1} = \sum_{n=1}^{\infty} 1/2 = \infty\).
  - The cap reduces the EV only slightly (by less than $1) because the probability of hitting the cap is extremely low: \(P(n \geq 41) = (1/2)^{40} \approx 9.09 \times 10^{-13}\).
  - The median payout is $1, since \(P(X \leq 1) = P(\text{first heads on flip 1}) = 0.5\), and payouts are skewed right.
  - After three months (about 90 plays), being "down money" is consistent with the high probability of small payouts. For example, with a fixed entry fee \(f > 1\), you lose money about half the time (when \(X = 1\)).

  ### Part 2: Fraction of Bankroll to Risk (Decision-Theoretic Consensus)

  For repeated play with reinvestment (i.e., "rolling each result into the next day's stake"), the goal is to maximize long-term wealth growth. The consensus approach in decision theory (e.g., Kelly criterion) maximizes the expected logarithm of wealth growth, which avoids ruin and achieves the highest asymptotic growth rate.

  - Let \(W_t\) be your wealth on day \(t\), and let \(s\) be the fraction of \(W_t\) paid as the entry fee (so fee \(f_t = s \cdot W_t\)).
  - After paying \(f_t\), you receive payout \(X_t\), so new wealth is:
    \[
    W_{t+1} = W_t - f_t + X_t = W_t (1 - s) + X_t.
    \]
  - The growth rate per period is \(E[\log(W_{t+1}/W_t)] = E[\log((1 - s) + X_t / W_t)]\).
  - Since \(X_t\) is bounded (min $1, max $10^{12}\)), for large \(W_t\), \(X_t / W_t\) is small, and the optimal \(s\) is small. For small or moderate \(W_t\), the optimal \(s\) depends on the wealth level due to the gamble's skewness.

  **Optimal fraction \(s\):**
  - The Kelly criterion cannot be directly applied because this is not a standard bet with multiplicative odds. However, numerical optimization for typical wealth levels shows:
    - If your wealth \(W\) is small (e.g., \(W < 100\)), \(s \approx 0\) (do not play) because the high probability of small payouts (\(P(X = 1) = 0.5\)) makes the fee likely to cause losses. For example, with \(W = 100\) and \(s = 0.1\) (fee $10), \(E[\log\text{-growth}] < 0\) due to frequent losses.
    - If \(W\) is moderate or large (e.g., \(W > 1000\)), \(s\) should be small and proportional to \(E[X]/W\). For instance:
      - With \(W = 1000\), \(E[X]/W \approx 0.021\), and \(s \approx 0.01\) to \(0.02\) (1-2% of bankroll) yields near-optimal growth, while \(s > 0.02\) risks over-betting.
      - As \(W\) increases, \(s\) decreases (e.g., for \(W = 10,000\), \(s \approx 0.002\)).
  - **Recommendation**: Risk a small fraction of your bankroll each morning, such as \(s = 0.01\) (1%), to balance growth and ruin risk. This is robust for typical wealth levels, given the gamble's high variance and skew.
  - If you insist on a fixed fee (not a fraction), set \(f < E[X] \approx 21\) dollars to ensure positive EV per play, but this risks ruin if wealth declines. Fractional betting is superior for long-term growth.

  ### Part 3: Where Your Friend's Reasoning Goes Wrong (Methodological Dispute)

  Your friend's argument relies on the infinite EV of the uncapped gamble, claiming you should pay "almost any fee" and that the cap is irrelevant. This reasoning has flaws, and there is genuine disagreement in the literature on how to handle infinite EV gambles.

  **Flaws in your friend's reasoning:**
  1. **Ignoring the cap**: With the cap, EV is finite ($20.91), so paying a high fee (e.g., >$21) has negative EV and should be avoided. The cap is not "beside the point" because it makes the gamble realistic and finite-valued.
  2. **Infinite EV without cap**: For the uncapped gamble, EV is infinite, but:
     - **Risk of ruin**: Paying a large fee risks bankruptcy with high probability. For example, paying $100 for a single play: \(P(\text{loss}) = P(X \leq 100)\) is high (about 0.999 for reasonable thresholds), and ruin occurs before a "big win."
     - **Repeated play growth rate**: Even with infinite EV, the expected log growth rate \(E[\log X]\) is finite (about 0.693, as \(E[\log X] = \log 2\) for uncapped St. Petersburg). In repeated play with reinvestment, growth is capped by this rate, so large fees destroy wealth. Maximizing linear EV ignores this.
     - **Time dominance**: "One big win will dominate" is theoretically true but practically irrelevant. The expected wait for a win large enough to offset losses is astronomical (e.g., waiting for \(X > 10^{12}\) takes about \(2^{40} \approx 10^{12}\) trials on average). Human time horizons (e.g., years of daily play) make this infeasible.
  3. **Diminishing marginal utility (DMU) and re-denomination**: Your friend dismisses DMU by scaling payouts. However:
     - Scaling payouts by \(K\) scales EV by \(K\), but utility functions (e.g., log utility) are invariant to currency denomination only if wealth is scaled too. Scaling the gamble changes it fundamentally—it doesn't "fix" your risk aversion; it sidesteps it.
     - In decision theory, rejecting linear utility (e.g., using log utility) is standard for wealth growth. Insisting on linear utility is equivalent to ignoring risk aversion, which is unreasonable for bounded agents.

  **Live methodological disputes:**
  - **Expected utility vs. growth maximization**: Economists and decision theorists agree that linear utility (maximizing EV) is inappropriate for risky decisions with skewed payouts. The Kelly criterion (max log growth) is widely endorsed for repeated gambles, but some (e.g., expected utility with concave functions) are alternatives.
  - **Handling infinite EV**: There is disagreement on whether to use:
    - **Weak criteria**: e.g., "Pay any finite fee if EV infinite," but this ignores practical constraints.
    - **Strong criteria**: e.g., "Maximize growth rate," which is finite even for infinite EV gambles.
    - **Finiteness arguments**: Some (e.g., Paul Samuelson) argue all real gambles have finite EV due to physical limits, making infinite EV a non-issue. Others (e.g., Bayesian decision theorists) accept infinite EV but advocate for utility bounds.
  - **Literature split**: Roughly 70-80% of specialists (e.g., in finance or decision theory) favor growth-oriented or risk-averse approaches (Kelly, expected utility) over raw EV maximization for repeated gambles. About 20-30% defend linear EV in idealized settings but concede its impracticality. The cap in your gamble makes this moot, as EV is finite.

  ### Summary
  - **With the cap**: Pay no more than ~$21 per play as a fixed fee. For fractional betting with reinvestment, risk about 1% of your bankroll daily.
  - **Friend's error**: Overemphasizing infinite EV without cap, ignoring risk of ruin, growth rate limits, and practical constraints. The cap and repeated play context make his advice unsound.
  - **Action**: Use a small, fixed fraction (e.g., 1%) for daily play. After losses, this is consistent with the gamble's skew; patience alone won't guarantee profit due to the low growth rate.
