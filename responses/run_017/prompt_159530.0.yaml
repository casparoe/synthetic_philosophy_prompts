prompt: |-
  I am putting together the normative methodology section of a report that will grade the long-horizon decision procedures of real deliberative bodies — endowment committees, research funders, central banks — and before I commit to any one framework I want a specification: what would a theory of diachronic rationality have to deliver in order to be adequate for that purpose? Please give me the requirements, not a survey of the candidate theories or of who has defended them; I know the families and I do not need citations.

  The purpose matters, so let me fix it, since adequacy is relative to it. The theory is to be good enough to grade agents that are bounded, that are not fully unified over time, and whose precommitment technologies are imperfect — rules that successors can repeal, mandates that later majorities can reinterpret, costs that later stages can simply pay. So I want tractability, implementability, and robustness to only partial persistence treated as genuine desiderata with cases behind them, not set aside as engineering detail that a normative theory may ignore. If you think that collapses two separate lists — a theory of rational planning and a theory of what may be demanded of bounded agents — say so, and tell me which requirements belong on which.

  Here are the cases I currently take to be load-bearing. For each, I want the requirement it generates, and a verdict on whether that requirement is non-negotiable or merely the preference of one camp. Please also correct my reading of the cases and add any you think I have missed.

  The pump that no one profits from. A chooser's preferences over three holdings cycle — she prefers the first to the second, the second to the third, and the third to the first — and she will pay a pound at each step to trade. An exploiter offers the trades in sequence, but each trade costs him a fee equal to what he extracts, so he finishes no better off; she finishes holding what she started with and three pounds worse off; the money is dissipated to the exchange. Every step was one she preferred at the time, and no future stage of hers was treated against its own lights. Is there a defect here beyond the wasted three pounds? I take this case to separate a view on which the wrong-making feature in a money pump is exploitation or loss from one on which it is cyclic or intransitive change itself, and I want both readings stated as rival requirements rather than one quietly assumed.

  The rotating committee. A standing investment committee of seven, three of whose seats rotate each year, so that consecutive years share four members and years five apart may share none. It faces a sequence of decisions structurally identical to a pump: each year's committee prefers the trade on offer that year, and the sequence returns the portfolio to where it began, minus costs. No member serves throughout; no member individually reverses a preference. Is this a case of diachronic irrationality at all, and can such a body be said to precommit when its only instrument is a rule a later majority can repeal? What must a theory say about partially persisting agents — is that a requirement on the theory of rationality, or a separate module it may decline to supply?

  The reversal that answers to reasons. An agent ranks a demanding career above family life; after the birth of a child she reverses; fifteen years later, once the child has left home, she reverses again. Temporally this is as unstable as a case of weakness of will, but by her own account at each stage it is a response to a change in what she has reason to do. What must a theory be able to do here — distinguish instability from responsiveness — without falling back on the agent's own retrospective verdict, which is only one stage's judgement? My suspicion is that this generates a requirement for an independent account of which changes in preference are reason-tracking, and that it is the requirement most of the familiar families quietly fail. Test that.

  The leaky Ulysses device. An agent foresees her own future reversal, and would benefit from binding herself, but the only device available to her raises the cost of reversal without preventing it, and is administered by a future self who has an interest in dismantling it. What is the verdict on an agent who fails to bind, or who binds badly? Is there a real ought-implies-can constraint here — a requirement that the theory's demands be satisfiable by an agent who can raise costs but not close options — or only a pragmatics about which devices happen to exist?

  Finally, the part I care about most. Tell me whether some subset of the requirements cannot be jointly satisfied, and state the incompatibility as a result if it holds. My hypothesis is that the impossibility concentrates in a trilemma: never act against your own current all-things-considered judgement; never adopt or persist in a plan you know to be worse than another plan available to you when you adopt it; and never adopt a plan you know you will abandon. On my reading each of the familiar families — act-by-act, sophisticated planning, resoluteness, and the treatment of person-stages as separate claimants — is identified by which horn it drops, so that the choice among them is a choice about which of three things to stop demanding. Check whether that is right, say which horn is cheapest to give up and why, and tell me which single requirement on the final list excludes the largest number of candidates. A short scorecard of the families against the list is welcome, but the thinking should be in the criteria.
reasoning: |-
  Okay, the user is working on a normative methodology section for grading long-horizon decision procedures of deliberative bodies. They need a specification for what makes a theory of diachronic rationality adequate for this purpose. The key points are that the theory must handle bounded agents without full unity over time and with imperfect precommitment technologies. The user provided several cases to illustrate the requirements.

  First, I need to break down each case to derive the requirements. The pump case shows the need to distinguish between mere losses and structural defects like preference cycles. For the rotating committee, the challenge is assessing collective agents with partial persistence. The reversal case requires differentiating irrational instability from rational responsiveness to new reasons. The leaky Ulysses device highlights the need for feasible precommitment strategies that account for imperfect enforcement.

  The user's trilemma hypothesis suggests three conflicting demands: never act against current judgment, never choose a known worse plan, and never adopt a plan you'll abandon. Each existing theory drops one of these. For example, sophisticated planning allows acting against future judgments, while resolute approaches maintain plans despite changing preferences. 

  The key incompatibility lies in satisfying all three demands simultaneously, which the user's trilemma captures. The requirement to avoid structural inefficiencies (like money pumps) is likely the most exclusionary because it rules out theories that tolerate cycles. 

  For the rotating committee, the theory must provide criteria for collective rationality without assuming full persistence, which means evaluating decisions based on overlapping membership and institutional continuity. The reversal case needs an account of reason-tracking that doesn't rely solely on the agent's retrospective views. The leaky Ulysses case requires feasible binding strategies that acknowledge enforcement constraints.

  The user's deeper need is a robust framework that can practically evaluate real-world institutions, not just ideal agents. They need clear, non-negotiable criteria that handle partial persistence and bounded rationality. The biggest challenge is balancing normative demands with practical feasibility, especially in distinguishing rational preference changes from irrational instability without circularity.
answer: |-
  Here is a specification of requirements for a theory of diachronic rationality adequate for grading long-horizon decision procedures of bounded, partially persistent deliberative bodies with imperfect precommitment technologies, derived from your cases. Requirements are categorized, flagged for negotiability, and key incompatibilities are identified.

  ### Core Requirements (Non-Negotiable for Purpose)
  1.  **Structural Stability Requirement:** The theory must identify and condemn decision paths that *structurally guarantee avoidable losses* or *inefficiencies* due to cyclic or inconsistent preferences *across time*, even if:
      *   Each step is locally preferred by the decision-maker(s) at that time.
      *   No single actor reverses their own preference (Rotating Committee).
      *   Losses aren't captured by an exploiter (Pump).
      *   **Derived from:** The Pump & Rotating Committee. **Status:** Non-negotiable for grading (avoids rewarding self-defeating structures). *Corrects your reading:* The defect *is* the structural inefficiency/self-defeat itself, distinct from mere loss magnitude or exploitation.

  2.  **Partial Persistence Requirement:** The theory must provide normative criteria applicable to agents (individual or collective) whose identity/perspective is *not fully unified over time*. It must:
      *   Evaluate sequences of decisions made by overlapping but changing decision-makers.
      *   Define "precommitment" and its rationality conditions when enforceability depends on the future selves/stages (who may have divergent views) upholding it (Leaky Ulysses, Rotating Committee).
      *   **Derived from:** Rotating Committee & Leaky Ulysses. **Status:** Non-negotiable (real-world bodies are partially persistent).

  3.  **Feasible Precommitment Requirement:** The theory must specify rational strategies for self-binding that are:
      *   Effective *given available technologies* (only raise costs, don't eliminate options).
      *   Robust against the *incentives of future stages* to dismantle or circumvent them.
      *   **Derived from:** Leaky Ulysses. **Status:** Non-negotiable (bounded agents face this reality). *Clarifies:* This imposes a genuine "ought-implies-can" constraint on normative demands regarding binding. Failing to bind badly *is* a defect under this requirement.

  4.  **Reason-Tracking Discrimination Requirement:** The theory must distinguish *rationally defective instability* (e.g., weakness of will, akrasia, structural incoherence) from *rational preference/reversal responsiveness* based on:
      *   Changes in underlying reasons/evidence/circumstances.
      *   Without relying solely on the agent's *current* or *retrospective* judgment about the rationality of the change.
      *   **Derived from:** Reversal that Answers to Reasons. **Status:** Non-negotiable (essential for fair grading; responsiveness is virtuous, instability is faulty). *Confirms your suspicion:* Requires an independent account of reason-tracking change.

  ### Desiderata (Highly Preferred, Contextually Negotiable)
  5.  **Boundedness Tractability Requirement:** Norms should be implementable by agents with:
      *   Limited cognitive resources.
      *   Imperfect foresight.
      *   Limited self-knowledge/control.
      *   **Status:** Strong desideratum, but degree of leeway negotiable. (Separate from core rationality but crucial for *grading feasibility*).

  6.  **Institutional Robustness Requirement:** Norms should be applicable within the constraints of real institutional structures:
      *   Rules subject to reinterpretation/repeal by successors.
      *   Changing majorities/personnel.
      *   Distributed decision-making.
      *   **Status:** Strong desideratum. (Separate module related to application context).

  ### The Trilemma & Incompatibility
  Your hypothesis is fundamentally correct. The core tension manifests as a trilemma for theories governing sequential choice under potential preference change:

  1.  **Current Judgement Fidelity (CJF):** Never act against your own current all-things-considered judgement.
  2.  **Dominance Rejection (DR):** Never adopt or persist in a plan you know to be worse than another available plan *at the time of adoption*.
  3.  **Plan Persistence (PP):** Never adopt a plan you know you will abandon (without new external reasons).

  **Incompatibility:** These three principles **cannot be jointly satisfied** in scenarios like the Pump or Reversal cases where preferences shift predictably. Any theory must relax at least one.

  *   **Act-by-Act (Myopic):** Drops **DR** and **PP**. Satisfies CJF rigidly. Vulnerable to money pumps. *(Fails Structural Stability)*.
  *   **Sophisticated Planning:** Drops **PP**. Satisfies CJF and DR. Avoids dominated plans but leads to "sour grapes" (abandoning good plans if future defection is predicted). May struggle with Partial Persistence. *(Can satisfy Structural Stability via DR)*.
  *   **Resoluteness:** Drops **CJF** (at future stages). Satisfies DR and PP. Commits to initial plan even if current (future) judgement changes. Requires strong identity/persistence. Vulnerable if initial plan flawed or reasons truly change. *(Can satisfy Structural Stability via PP)*.
  *   **Stage-Individualism / Bargaining:** Effectively drops **DR** and **PP** as global norms. Focuses on CJF per stage. Treats inter-temporal deals as possible but not normatively required. Highly vulnerable to inefficiency/pumps unless supplemented. *(Fails Structural Stability)*.

  ### Which Horn is Cheapest to Give Up & Why
  *   **Cheapest to Drop:** **Current Judgement Fidelity (CJF)**. Why?
      1.  **Feasibility:** Future selves/stages *will* have their own judgements. Denying this is unrealistic (violates Partial Persistence).
      2.  **Structural Stability:** Rigid CJF enables money pumps. Sacrificing it allows theories to enforce stability (Sophistication, Resoluteness).
      3.  **Purpose:** Grading long-horizon bodies *requires* evaluating sequences across changing perspectives. Fixating on moment-by-moment judgement fidelity undermines this.

  ### Most Exclusionary Requirement
  The **Structural Stability Requirement** excludes the largest number of candidate families. It directly rules out:
  *   **Pure Act-by-Act/Myopic** approaches (vulnerable to pumps).
  *   **Stage-Individualist/Bargaining** approaches without strong supplementary norms (prone to inefficiency).
  *   **Sophisticated** approaches *only* if they rely solely on backward induction under perfect foresight without institutional mechanisms for commitment (common in simple models).
  *   **Weak** forms of Resoluteness that cannot condemn cycles emerging from changing committee composition.

  ### Short Scorecard of Families vs. Requirements
  | Family             | Structural Stability | Partial Persistence | Feasible Precommitment | Reason-Tracking Discrim. | Boundedness Tractability | Institutional Robustness |
  | :----------------- | :------------------- | :------------------ | :--------------------- | :----------------------- | :----------------------- | :----------------------- |
  | **Act-by-Act**     | ❌ (Vulnerable)       | ✅ (Per-stage)       | ❌ (Ignores binding)    | ⚠️ (Hard to distinguish) | ✅ (Simple)               | ⚠️ (Ignores persistence) |
  | **Sophistication** | ✅ (Avoids dom plans) | ⚠️ (Assumes unitary?) | ❌ (Defers, doesn't bind)| ⚠️ (Focuses on prediction) | ⚠️ (Complex foresight)   | ⚠️ (Assumes continuity?)  |
  | **Resoluteness**   | ✅ (Enforces plans)   | ❌ (Requires unity)  | ✅ (Core concept)       | ❌ (Ignores reasons)      | ⚠️ (Demands willpower)   | ❌ (Needs fixed identity) |
  | **Stage Bargaining**| ❌ (Inefficient)      | ✅ (Explicit stages) | ⚠️ (Deals possible)    | ❌ (Assumes CJF)          | ⚠️ (Negotiation costs)   | ⚠️ (Mechanisms needed)   |

  **Key:** ✅ = Generally Satisfies, ⚠️ = May Satisfy (context/version dependent), ❌ = Generally Fails

  **Conclusion:** An adequate theory must satisfy the **4 Non-Negotiable Requirements**. This necessitates relaxing CJF (Trilemma). The **Structural Stability Requirement** is the most stringent filter. **Sophisticated** approaches (emphasizing DR) often best handle boundedness and partial persistence if augmented with institutional mechanisms for commitment and a robust account of reason-tracking change. **Resoluteness** (emphasizing PP) is viable only if the theory incorporates a strong, non-metaphysical account of collective identity/persistency for institutions and integrates reason-tracking. Avoid approaches that fundamentally violate Structural Stability.
