prompt: |-
  Please act as a philosopher of rational choice who works specifically on decision-making under risk and uncertainty — someone equally fluent in expected utility theory as a normative benchmark and in the family of views that try to amend it (risk-weighted expected utility, ambiguity-sensitive views, lexical and threshold views, and the standard reductions of apparent risk-aversion to curvature in the utility function). Take your time and think carefully before answering: I would rather have a careful reconstruction that leaves the complications in place than a clean verdict that smooths them away. Before you answer, sketch briefly the several different things that could in principle be doing the work in the practice I am about to describe — nonlinearity in the probabilities, nonlinearity in the value of the outcomes, attitudes to model uncertainty, side constraints, option value — and then tell me which of them the practice actually requires.

  I sit on the grants committee of a mid-sized philanthropic foundation, and I have become bothered by an asymmetry in how we handle small probabilities. On the upside we are aggressively expected-value: we deliberately fund long-shot, high-upside work — a neglected vaccine, a policy campaign with perhaps a 3 percent chance of landing, an early-stage research programme — and we openly rebuke colleagues who get cold feet about low probabilities, on the grounds that a 1 percent chance of a thousandfold payoff is worth ten times a guaranteed tenfold one. On the downside we refuse to reason that way at all. Any proposal carrying a non-trivial chance of what our risk register calls an unacceptable outcome — catastrophic loss of life, a laboratory release with pandemic potential, an irreversible ecological collapse — is vetoed outright; the expected value of the upside is not permitted into the discussion, and, strikingly, the stated probability of the catastrophe seems to make very little difference to the conversation, so that a one-in-a-thousand chance and a one-in-twenty chance of the same catastrophe get treated almost alike. A second feature of the pattern: we are happy to multiply when the numbers come from a well-measured base rate, such as vaccine efficacy or the historical frequency of a given kind of regulatory win, but our confidence collapses when the numbers come out of a model whose own parameters are themselves estimates — and this happens even when the model's uncertainty is roughly symmetric and we have no particular reason to think it is biased up rather than down. A third: the veto applies to harms we might bring about, but we do not treat declining to fund a catastrophe-prevention project as anywhere near as serious, even though on our own accounting the unspent money and the risky project have the same expected cost in lives; when I raised this, one trustee said that is just the act/omission distinction and has nothing to do with probability, and another said our downside is bounded by the endowment so the two cases really are not symmetric. I do not know what to make of either reply.

  What I want from you is the implicit theory of rational choice under risk that this pattern presupposes. I have seen the label risk-weighted expected utility used for views that keep the broad shape of expected utility but let a risk function transform the probabilities, so that very small chances of disaster are not diluted in proportion to their probability — but I am not sure that is what we are doing, and there are other candidates in the neighbourhood: plain expected utility combined with the thought that extinction or collapse is not merely a very large number of deaths, a lexical or threshold constraint on losses, genuine ambiguity aversion in the model-uncertainty cases, or something about irreversibility and the value of keeping options open. Do not just survey these views; I can read about them on my own. Instead: reconstruct the theory our practice commits us to; separate what the practice strictly presupposes from what it merely sits comfortably with; tell me where the deviation from expected utility is located in our pattern — in how we weight probabilities, in how we value outcomes, or somewhere else entirely; say which parts of the pattern are consistent with several theories at once and therefore do not discriminate between them; and say what would concretely have to change in how we make grants if we adopted, first, straightforward expected utility with no weighting, and then, explicitly, a risk-weighted view. If some part of the pattern is simply incoherent — including the upside/downside asymmetry or the act/omission asymmetry — say so and say which part of the practice would have to give.
reasoning: |-
  Okay, let me approach this step by step. The user is clearly highly sophisticated in decision theory and wants a nuanced analysis of their foundation's grant-making practices. They've presented several asymmetries: aggressive EV-maximization for upsides vs absolute veto for catastrophic downsides, differential treatment of base rates vs model uncertainty, and an act/omission distinction in harm attribution.

  First, I need to map the theoretical landscape systematically. The key components to examine are:
  - Outcome valuation: Are they treating catastrophic outcomes as infinitely bad (lexical thresholds) or just very bad (diminishing marginal utility)?
  - Probability weighting: Is the veto driven by transformed probabilities (like in rank-dependent models) or something else?
  - Model uncertainty: Is their rejection of model-based probabilities due to ambiguity aversion or epistemic concerns?
  - Option value: Could irreversibility explain the asymmetric treatment of actions vs omissions?

  For the upside/downside asymmetry, the absolute veto regardless of probability suggests lexical thresholds - they're treating certain catastrophic outcomes as unacceptable regardless of expected value calculations. This isn't just probability weighting because even high-probability catastrophes get vetoed.

  The model uncertainty pattern points strongly toward ambiguity aversion. When probabilities come from shaky models, they retreat to a precautionary stance regardless of the nominal symmetry of uncertainty. This aligns with Ellsberg-type behavior.

  The act/omission distinction is particularly interesting. Their colleagues' responses reveal two different justifications: deontological (action vs inaction) and financial (endowment as downside boundary). Both suggest fundamental non-consequentialism in their framework.

  What's striking is how these elements interact. The lexical threshold creates a discontinuity that overrides expected utility calculations specifically for catastrophic outcomes. The ambiguity aversion compounds this by making them reject probabilistic reasoning when uncertainty is high. And the act/omission distinction shows their decision framework isn't purely outcome-based.

  For practical implications: Switching to strict EU would force them to quantify catastrophe disutility and accept non-zero extinction risks. Adopting explicit risk-weighted EU might preserve the veto but require consistent probability weighting across all decisions - including the upside long shots they currently embrace.

  The real tension lies in the incoherence between their aggressive upside pursuit and catastrophic downside avoidance. Under any consistent framework, you can't have both absolute catastrophe aversion and EV-maximization for positive tail risks. Something has to give - either they accept some catastrophic risks for high-upside projects, or they become more conservative on positive long shots too.
answer: |-
  Your foundation's decision pattern reveals a sophisticated but internally conflicted theory of rational choice that synthesizes several deviations from standard expected utility (EU) theory. Below is a reconstruction of its core commitments, distinguishing necessary features from compatible ones, pinpointing the locus of deviation, and examining tensions.

  ### Core Components of Your Implicit Theory
  1. **Lexical Thresholds for Catastrophic Losses** (Primary Deviation)  
     - **What it entails**: Outcomes like extinction or irreversible collapse are treated as *infinitely bad*, creating a discontinuity in value. This imposes a side constraint: no positive expected value can compensate for any non-zero probability of catastrophe.  
     - **Evidence**:  
       - Vetoes occur regardless of catastrophe probability (1/1000 vs. 1/20 treated alike).  
       - Upside EV is excluded from downside discussions.  
     - **Distinct from**:  
       - *Risk-weighted EU* (e.g., rank-dependent utility): This transforms probabilities but retains finite values. Your practice treats catastrophes as *incommensurable*, not merely steeply discounted.  
       - *Curvature in utility*: Diminishing marginal utility for losses cannot explain absolute vetoes; it would still permit trade-offs.  

  2. **Ambiguity Aversion in Model Uncertainty**  
     - **What it entails**: You reject probabilistic reasoning when probabilities derive from models with uncertain parameters, even if uncertainty is symmetric. This reflects *ambiguity aversion* (e.g., Gilboa-Schmeidler maxmin EU).  
     - **Evidence**:  
       - Base-rate probabilities (e.g., vaccine efficacy) are trusted; model-based probabilities are distrusted.  
       - "Confidence collapses" despite no evidence of upward bias.  

  3. **Act/Omission Asymmetry with Consequentialist Defects**  
     - **What it entails**: Harm caused *by* your grants is weighted more heavily than equivalent harm caused *by inaction*. This violates consequentialism.  
     - **Foundational Commitments**:  
       - **Deontology**: The trustee invoking "act/omission distinction" implies a non-consequentialist duty to avoid *causing* harm.  
       - **Financial Boundedness**: The endowment argument suggests a *pragmatic* (not moral) constraint: losses from actions are bounded by the endowment, while losses from inaction are not.  

  4. **Aggressive EV Maximization for Upsides**  
     - **What it entails**: Linear probability weighting for gains, with no risk aversion for positive outcomes.  

  ---

  ### What the Practice Strictly Presupposes vs. What It Merely Accommodates
  | **Element**               | **Strictly Presupposed**       | **Compatible But Not Required**     |
  |---------------------------|--------------------------------|-------------------------------------|
  | **Catastrophe Veto**      | Lexical threshold (infinite disutility) | Risk-weighted EU, ambiguity aversion |
  | **Model Distrust**        | Ambiguity aversion             | General uncertainty aversion        |
  | **Act/Omission Asymmetry**| Non-consequentialist duty + financial boundedness | Option value, regret aversion |
  | **Upside EV Maximization**| Linear probability weighting for gains | Risk-neutral utility for gains |

  ---

  ### Locating the Deviation from Expected Utility
  - **Primary Deviation**: **Value function discontinuity** at catastrophic outcomes (lexical thresholds), *not* probability weighting.  
    - *Why not probability weighting?* Risk-weighted EU would still allow high-EV projects to offset small catastrophe risks. Your veto is absolute.  
  - **Secondary Deviation**: **Ambiguity aversion** in model-based cases.  
  - **Tertiary Deviation**: **Non-consequentialism** in act/omission asymmetry.  

  ---

  ### Indeterminate Elements (Consistent with Multiple Theories)
  1. **Downside Probability Insensitivity**  
     - Could arise from:  
       - Lexical thresholds (probabilities irrelevant if outcome is vetoed).  
       - Extreme pessimism (e.g., maxmin EU focusing on worst-case).  
     - *Does not discriminate* between lexical thresholds and ambiguity aversion.  

  2. **Upside/Downside Asymmetry**  
     - Consistent with:  
       - Prospect theory (loss aversion), but your upside behavior isn’t loss-averse.  
       - Dual-process theories (deliberate vs. emotional reasoning).  
     - *Not decisive* for any single model.  

  ---

  ### Consequences of Adopting Alternative Frameworks
  **1. Straightforward Expected Utility (No Weighting):**  
     - **Changes Required**:  
       - Quantify disutility of catastrophes (e.g., "extinction = -∞" forbidden; must assign finite values).  
       - Permit high-EV grants with small catastrophe risks (e.g., 0.1% chance of disaster offset by 1000x upside).  
       - Treat model-based probabilities identically to base rates.  
       - Abandon act/omission distinction: *Not* funding prevention = causing harm.  
     - **Incoherences Exposed**: Your current upside/downside asymmetry collapses.  

  **2. Explicit Risk-Weighted EU (e.g., Rank-Dependent Utility):**  
     - **Changes Required**:  
       - Apply *consistent* probability weighting to *both* gains and losses.  
         - Example: If you overweight small loss probabilities, you must also underweight small gain probabilities—contradicting your aggressive funding of long shots.  
       - Disallow absolute vetoes; low-probability catastrophes could be over-weighted but not infinitely.  
     - **Tensions Created**: Your upside EV maximization assumes linear probability weighting, while downside requires nonlinearity—a contradiction.  

  ---

  ### Incoherences in the Current Practice
  1. **Upside/Downside Asymmetry**:  
     - **Conflict**: Aggressive EV for gains relies on *probabilistic trade-offs*, while catastrophe vetoes reject trade-offs entirely.  
     - **Resolution Required**: Either abandon EV for gains (becoming conservative) or accept trade-offs for losses (permitting some catastrophe risks).  

  2. **Act/Omission Asymmetry**:  
     - **Conflict**: If unspent money has the same expected cost in lives, refusing prevention *is* causing harm. The endowment argument confuses *budget constraints* with *moral responsibility*.  
     - **Resolution Required**: Reject deontology (embracing full consequentialism) or justify the moral distinction rigorously.  

  ---

  ### Reconstructed Implicit Theory
  Your foundation operates under a **lexical threshold theory** for catastrophic losses, embedded within a **partially ambiguity-averse framework**, and moderated by **non-consequentialist ethics** for actions. This hybrid model prioritizes:  
  - **Incommensurability** of catastrophes (value discontinuity),  
  - **Epistemic humility** in model-based decisions (ambiguity aversion),  
  - **Agent-relative responsibility** (act/omission distinction).  

  It is *not* risk-weighted EU, as probabilities remain unweighted for gains and irrelevant (not transformed) for catastrophic losses. The deepest tension lies in simultaneously demanding *consequentialist EV maximization* for gains and *non-consequentialist absolutism* for losses—a duality that collapses under formalization. To resolve this, you must either:  
  - **Embrace full non-consequentialism** (abandoning EV for gains when they risk indirect harm), or  
  - **Quantify catastrophe disutility** within a unified EU/risk-weighted framework, accepting bounded trade-offs.  

  The model uncertainty practice is the most defensible—ambiguity aversion is rational under deep uncertainty—but requires explicit sensitivity analysis to avoid ad hoc application.
