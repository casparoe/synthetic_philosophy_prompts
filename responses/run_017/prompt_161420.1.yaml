  ### (i) Rules Fitting All Six Verdicts and Their Predictions for the New Case

  Two primary rules emerge from the cases, both incorporating cost-benefit reasoning (duty exists when expected benefit exceeds cost). They align with your candidates but are refined to fit the data:

  1. **Rule A: Duty if the vote has a non-negligible chance of flipping the substantive outcome.**  
     - **Explanation**: Focuses on whether the voter's ballot could directly change who wins or the policy outcome (e.g., swinging a close race). Ignores institutional thresholds like turnout requirements.  
     - **Fits all six cases**:  
       - Case 1: 50–50 race → non-negligible chance of flipping outcome → **yes**.  
       - Case 2: High cost outweighs benefit → **no**.  
       - Case 3: No stakes → zero benefit → **no**.  
       - Case 4: 25-point deficit → negligible chance → **no**.  
       - Case 5: Small electorate, split issue → non-negligible chance → **yes**.  
       - Case 6: 68–32 lead → negligible chance → **no** (no turnout requirement).  
     - **Prediction for new case**: Outcome is 68–32 → negligible chance of flipping the substantive result → **no duty**.  

  2. **Rule B: Duty if the vote could affect the result or validity by influencing whether "people like the voter" show up.**  
     - **Explanation**: Broadens pivotal probability to include affecting institutional validity (e.g., meeting turnout thresholds) or the outcome in close contexts. Emphasizes collective impact of similar voters (e.g., supporters of a measure).  
     - **Fits all six cases**:  
       - Case 1: Close race → voter’s presence could tip outcome → **yes**.  
       - Case 2: High cost → **no**.  
       - Case 3: No stakes → **no**.  
       - Case 4: Lopsided race → no collective influence → **no**.  
       - Case 5: Small group → voter’s presence could sway result → **yes**.  
       - Case 6: Lopsided outcome → no collective influence → **no** (no validity issue).  
     - **Prediction for new case**: Turnout expected at 39–41% (near 40% threshold) → voter’s presence could help validate the referendum → **yes duty** (since "people like her" showing up affects validity).  

  **Other plausible rules considered but rejected**:  
  - A rule based solely on stakes and cost fails (e.g., Case 6 has high stakes and low cost but no duty).  
  - A rule based on "civic duty regardless of impact" fails (e.g., Case 3 has no duty despite low cost).  
  - A rule requiring absolute pivotal certainty fails (e.g., Case 1 has duty despite low probability).  

  Rules A and B **come apart on the new case**: Rule A predicts **no**, Rule B predicts **yes**. This divergence hinges on the turnout threshold, which Rule B considers part of the "result or validity," while Rule A does not.

