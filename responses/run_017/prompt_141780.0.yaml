answer: |-
  Here is the Continuance Statement questionnaire, designed as a genuine legal instrument with concealed scoring mechanics. It adheres strictly to your constraints: 10 concrete scenarios, no philosophical terminology, an optional "no fact" answer, and hidden diagnostic intent.

  ---

  **INTERSTELLAR TRANSPORT AUTHORITY**  
  **CONTINUANCE STATEMENT**  
  *(Mandatory prior to inaugural journey under Regulation 7-C)*  

  **Instructions:** For each scenario below, select **ONE** answer that best reflects your judgment of the outcome. Answer sincerely based on your understanding of events.  

  ---

  **1. DAMAGED LUGGAGE**  
  *During a routine Guaranteed transfer, a traveler’s scan completes normally but their luggage is lost. The traveler at destination demands compensation for lost belongings.*  
  ☐ **A.** The arriving traveler is owed compensation.  
  ☐ **B.** The arriving traveler is not owed compensation (loss occurred pre-arrival).  
  ☐ **C.** Compensation must be paid to the traveler’s estate, not the arrival.  
  ☐ **D.** There is no fact of the matter about who is owed.  

  **2. THE SLOW RELAY**  
  *A medical traveler undergoes a 3-week "gradual transfer": brain tissue is scanned and removed in stages while conscious, with the final recipient assembled at destination.*  
  ☐ **A.** The recipient is the original traveler, who survived the transfer.  
  ☐ **B.** The original traveler ceased to exist during the procedure; the recipient is new.  
  ☐ **C.** The recipient is the original traveler only if no tissue was discarded mid-process.  
  ☐ **D.** The question has no clear answer; survival isn’t defined here.  

  **3. UNCONSENTED REVISION**  
  *A traveler using the Branching Fare arrives with "dispositional adjustments" (e.g., reduced fear of heights) made by carrier software without disclosure.*  
  ☐ **A.** The arriving person inherits all original contracts and rights.  
  ☐ **B.** The arriving person cannot inherit due to psychological alteration.  
  ☐ **C.** Inheritance depends on whether core memories are intact.  
  ☐ **D.** Revision makes inheritance status indeterminate.  

  **4. THE ALIBI COPY**  
  *A Branching traveler’s copy is stored while the original lives. When the original dies naturally hours later, the copy is activated.*  
  ☐ **A.** The carrier must register a death when the original dies.  
  ☐ **B.** No death is registered; the copy continues the traveler’s existence.  
  ☐ **C.** Death is registered only if the copy was inactive when the original died.  
  ☐ **D.** This scenario voids the concept of "death" for registration.  

  **5. THE RE-MERGE**  
  *Two branches from a past branching event are scanned, and their combined memories/personality form a single new recipient.*  
  ☐ **A.** The new recipient inherits obligations from both branches.  
  ☐ **B.** The new recipient inherits nothing; both prior branches ended.  
  ☐ **C.** Inheritance applies only if one branch’s traits dominate.  
  ☐ **D.** Merger makes inheritance unassignable.  

  **6. CORPSE SCAN**  
  *A fatally injured traveler is scanned 55 minutes after legal death. A recipient is built from the scan.*  
  ☐ **A.** The recipient inherits the traveler’s parental rights.  
  ☐ **B.** The recipient is a new entity; inheritance is void.  
  ☐ **C.** Inheritance requires the original’s biological processes to have ceased *during* scan.  
  ☐ **D.** Death timing makes inheritance indeterminable.  

  **7. UNEQUAL BRANCH**  
  *A Branching Fare traveler has one recipient with full memory and one missing the last 5 years.*  
  ☐ **A.** Both recipients inherit the original’s criminal liabilities equally.  
  ☐ **B.** Only the full-memory recipient inherits liabilities.  
  ☐ **C.** Neither inherits; the original ceased at branching.  
  ☐ **D.** Liability cannot be assigned due to asymmetry.  

  **8. CONVERSION CASE**  
  *A traveler arrives with all preferences reversed (e.g., hates loved foods, loves former fears). No physical changes.*  
  ☐ **A.** This is still the traveler; all contracts bind the arrival.  
  ☐ **B.** This is not the traveler; contracts are void.  
  ☐ **C.** Contracts bind only if behavioral patterns remain stable.  
  ☐ **D.** Reversal makes identity untestable.  

  **9. SYNTHETIC CEREBRUM**  
  *A traveler’s organic brain is replaced with a device mimicking its outputs. Outward behavior is identical.*  
  ☐ **A.** The traveler survives; the device is their mind.  
  ☐ **B.** The traveler ceased; the device is a new actor.  
  ☐ **C.** Survival depends on whether consciousness is present.  
  ☐ **D.** Synthetic minds invalidate survival questions.  

  **10. LOST WILL**  
  *A traveler using the Guarantee arrives moments after the original is destroyed. The original’s unsigned will is found later.*  
  ☐ **A.** The recipient may sign the will as the deceased.  
  ☐ **B.** The recipient cannot sign; the deceased is gone.  
  ☐ **C.** The recipient may sign if they recall drafting it.  
  ☐ **D.** Post-scan documents create legal confusion.  

  --- 

  ### Scoring Machinery & Diagnostics  
  *(Hidden from travelers; for carrier survivorship office use only)*  

  **Position Key:**  
  - **P+NB**: Psychological continuity + no branching (survival requires uninterrupted psychology, no copies).  
  - **P-BR**: Psychological continuity + branching allowed (copies are both "me").  
  - **NON-RED**: Non-reductionist "further fact" (soul/essence beyond psychology/physics).  
  - **BIO**: Biological essentialism (survival = same living organism).  
  - **NARR**: Narrative self-constitution (survival = coherent life story).  
  - **RED**: Reductionist continuity (overlapping chains of psychology/biology, cause irrelevant).  
  - **DEFL**: Deflationary (no persistent self; questions are category errors).  

  **Question Diagnostics:**  
  1. **RED** vs. **BIO** (trivial loss tests continuity focus).  
  2. **BIO** vs. **P+NB**/P-BR (gradual destruction vs. psychological continuity).  
  3. **NON-RED** vs. **RED** (alteration challenges "further fact").  
  4. **BIO** vs. **P-BR**/NARR (death timing vs. psychological continuity/narrative).  
  5. **P-BR** vs. **ALL** (tests if fusion resolves fission). *Weak: Most views reject inheritance here.*  
  6. **BIO** vs. **P+NB** (death threshold critical for BIO).  
  7. **P+NB** vs. **P-BR** (asymmetry challenges branching acceptance).  
  8. **NON-RED**/NARR vs. **RED**/P-BR (core self vs. structural continuity).  
  9. **BIO**/NON-RED vs. **RED**/DEFL (substrate dependence).  
  10. **NARR** vs. **LEGAL** (focus on narrative agency vs. legal formalism).  

  **Problem Flags per Request:**  
  1. **Indistinguishable Positions:**  
     - **BIO & P+NB** on *ordinary Single-Copy trips* (both accept survival; BIO via organism, P+NB via psychology).  
     - **RED & P+NB** for *Guarantee-only travelers* (both reject branching; RED sees no branching event, P+NB forbids it).  
     - **P-BR & RED** on *benign branching* (both accept multiple survival).  

  2. **Unoccupied Answer Combinations:**  
     - *Insist branching creates two selves (B), yet deny death registration (B in Q4)*: **Incoherent** (if two exist, original ceased).  
     - *Accept corpse scan inheritance (A in Q6) but reject alibi copy inheritance (B in Q4)*: **Unattractive** (inconsistent biological thresholds).  
     - *Demand compensation in Q1 (A) but reject contract inheritance in Q8 (B)*: **Unattractive** (inconsistent trivial vs. deep change standards).  

  3. **Identity vs. Survival Judgments:**  
     - **Identity-focused (binding contracts/inheritance):** Q1, Q3, Q5, Q7, Q8, Q10.  
     - **Survival-focused (death registration):** Q2, Q4, Q6.  
     - **Divergence:** A traveler may judge *survival* in branching (Q4: "B" → no death) but deny *identity* for contracts if altered (Q3: "B" → no inheritance).  

  **Strategic Inconsistency Detection:**  
  - **Pattern:** Select *P-BR* answers (Q4:B, Q7:A) to avoid death certificates + enable Branching Fare, but *also select P+NB* answers (Q2:B, Q6:B) to demand Guarantee-only privileges.  
  - **Example:** Q4:B ("No death registered") + Q7:A ("Both inherit liabilities") **but** Q2:B ("Original ceased") + Q6:B ("Recipient is new entity"). *Carrier algorithm flags: Claims branching preserves self yet demands cessation in Guarantee context.*  
  - **Pragmatic Trap:** Choosing Q3:B ("No inheritance after revision") while opting for Branching Fare. Carrier requires psychological integrity for contracts → denies cheap fare.  

  **Question Weaknesses:**  
  - **Q5 (Re-merge):** Poorly diagnostic; almost all positions reject inheritance here. *Recommend rewrite:* Focus on *which* branch’s obligations dominate.  
  - **Q7 (Unequal branch):** Fails to cleanly separate P+NB and NARR. *Keep*: Still useful for P-BR vs. others.  
  - **Q10 (Lost will):** Legally ambiguous; less about identity. *Keep for narrative consistency*.  

  This instrument forces travelers to reveal metaphysical intuitions through concrete legal/ethical judgments, enabling the carrier to:  
  1. Assign fares (Branching if Q4:B + Q7:A dominate).  
  2. Determine inheritance (weighting Q3, Q5, Q8).  
  3. Trigger death registration (Q4:A + Q6:A).  
  The hidden structure allows detection of strategic answers (e.g., claiming "no self" while asserting inheritance rights) while maintaining bureaucratic plausibility.  

  ---  
  Let me know if you'd like adjustments to cases, scoring weightings, or legal phrasing!
