  ## Dedication Address for the Requena Room  
  **Universidad Católica, October 2023**

  Distinguished Rector, Auxiliary Bishop, Deputy Minister, Esteemed Donor, Captain Requena’s family and comrades, colleagues, students, and friends of the university,

  We gather today to consecrate a space: the Requena Room. It is more than wood, glass, and quiet corners. It is a vessel. Within these walls will reside the papers of Captain Esteban Requena – a soldier, a thinker, a man who lived a significant portion of his life behind bars for an act undertaken in this city over half a century ago. This room is not merely an archive; it is an act of collective memory, undertaken peacefully, lawfully, and deliberately by this community.

  Captain Requena’s life was profoundly marked by the history of Vereda. He came of age under a government installed not by the consent of the governed, but by force, in 1961. A decade later, in 1972, then-Captain Requena was one of four who believed the moment demanded decisive action. Their attempt failed. Three men paid with their lives immediately. Captain Requena paid with twenty-three years of his freedom. He emerged only when democratic government returned, bearing the weight of that experience and the manuscript he had meticulously crafted in confinement.

  That manuscript, *On the Killing of a Tyrant*, published last year by this university, now finds its permanent home here. It is a remarkable document. Born of profound personal experience and deep reflection, it grapples not just with the events of 1972, but with enduring questions of authority, justice, and the limits of obedience. Requena wrestled with the fundamental question: When does power lose its claim to legitimacy? When, if ever, is resistance not merely excusable, but demanded? His answers, forged in solitude, drew deeply from a wellspring of moral philosophy centuries old.

  He argued, with meticulous attention to distinctions, that a ruler who seizes power *without title* occupies a different category entirely from one who governs lawfully but unjustly. He contended that the duty owed by a private citizen to a lawful superior did not apply in his case, both because of the nature of the regime and because he acted not as a private individual, but as one holding a commission – a soldier believing he acted *in extremis* for a people he perceived as silenced. And he confronted, head-on, the gravest counter-argument: the potential for chaos, for consequences far worse than the tyranny itself. He knew intimately the weight of that clause – the fear that resistance might unleash greater suffering. He lived its aftermath: the failed attempt was followed by years of intensified repression, the darkest chapter of that era. General Vidal died peacefully years later, and the regime dissolved without further violence. Captain Requena understood the cost of disturbance measured against the cost endured under rule. He believed the scales tipped towards action; history unfolded otherwise. This tension – between the intent of the act and its unforeseen consequences – lies at the heart of his manuscript, a testament to a conscience grappling with the hardest choices.

  *(Insert Personal Recollection Slot: Here, share a brief, specific, neutral observation about Requena himself – his demeanor, a single phrase he used about his writing or his past, or his focus during your meetings. Example: "When I spoke with Captain Requena in his later years, what struck me most was not dwelling on the past battles, but the quiet intensity with which he spoke about the *ideas* – the principles he felt compelled to explore on those smuggled scraps of paper. His focus was always on the argument, the structure of the thought, as if refining the idea was the ultimate act of bearing witness.")*

  This is the unique power of the Requena Archive. It is not simply a historical record, though it is that. It is, more profoundly, the record of a sustained and serious intellectual engagement with the very foundations of political order and obligation. Captain Requena, isolated and deprived, turned to the tools of reason and faith to interrogate his own actions and the nature of the power he defied. He sought justification not in anger, but in a framework built on centuries of moral reasoning. He forced himself to answer the hardest questions his critics could pose. The result is not just a personal testament, but a contribution to political thought – a case study, argued from within the crucible of experience, on the boundaries of legitimate authority and the perils and necessities of resistance.

  And this brings us to the profound significance of *this* room, *this* act we perform today. Captain Requena and his comrades acted in 1972 believing they had no lawful recourse, seeing themselves as agents compelled to act where established authority would not or could not. Theirs was an act undertaken *outside* the sanctioned channels of the political community.

  The Requena Room represents the opposite. It is an act undertaken *by* the lawful political community, through its institutions – this university, supported by private generosity and public recognition. It is a peaceful, deliberate, and entirely lawful act of preservation, reflection, and study. We bring these papers, these challenging ideas born of turmoil, into the open light of academic inquiry and public memory. We do not bury them; we do not burn them; we do not hide them. We place them here, in a space dedicated to quiet contemplation and rigorous scholarship.

  In doing so, we fulfill, through lawful and peaceful means, a fundamental purpose: ensuring that the difficult questions Captain Requena wrestled with – questions about the nature of legitimate power, the duties of the citizen, and the terrible costs of both tyranny and resistance – are not forgotten. We provide a space where future students, scholars, and citizens can engage with these ideas, not to incite, but to understand. To grapple with complexity, to weigh arguments, to learn from the past – including its tragedies and its profound moral dilemmas. This room embodies the conviction that society *can* confront its most challenging history openly, critically, and peacefully. It demonstrates that the political community possesses, and can exercise, the lawful authority to preserve, examine, and learn from even its most contested legacies.

  The donor’s generous gift, made with a clear and understandable condition, acknowledges the delicate nature of this legacy. This room is not, and will not become, a platform for advocating violence. It is a place for study, for reflection, for understanding the complex interplay of ideas, events, and human conscience. It exists because a society that has regained its voice understands it must listen to *all* its voices, especially those formed in silence and shadow, if it is to truly comprehend itself.

  To Captain Requena’s family, especially his daughter Clara and his grandchildren: we honor your father and grandfather by preserving his intellectual legacy with the seriousness and respect it demands. His words, his struggle with these profound ideas, now have a permanent home. To his comrades who shared the burden of those years: your presence reminds us of the shared cost of conviction. To the university: you have undertaken a solemn duty of custodianship. To the students: this room is an invitation. Engage with these ideas not with easy certainty, but with the courage to confront complexity.

  The Requena Room is, ultimately, an act of societal responsibility. It is how a community, through its lawful institutions, chooses to remember, to reflect, and to learn from a past marked by fracture. It is a testament to the belief that understanding, carefully cultivated in the quiet sanctuary of scholarship, is the foundation upon which a just and enduring future must be built. May this room serve as such a foundation for generations to come.

  ---

  **Confidential Note for the Speaker: What Remains Unsaid & Risks**

  1.  **Deliberately Unsaid:**
      *   **Vidal's Status:** We never explicitly declare whether Vidal was a "usurper without title" or a "ruler who governed tyrannically." The speech presents *Requena's argument* (the "without title" distinction) and the *counter-factual* (Vidal died in bed, regime ended peacefully) without the speaker taking a side. The audience sees the question hinges entirely on this, but the speaker avoids a verdict.
      *   **Moral Justification:** We avoid stating that the assassination attempt was "right," "justified," or "heroic." It is presented as an "act undertaken," motivated by belief in "decisive action" and "no lawful recourse," but its failure and brutal consequences are plainly stated. The focus shifts to the *intellectual legacy* of grappling with the act's morality, not an endorsement of the act itself.
      *   **The Archive as Vindication:** We never say the archive "vindicates" Requena. It "honors his intellectual legacy," preserves "his contribution to political thought," and allows society to "confront its history" and "learn from complexity." The room is framed as society doing lawfully what the conspirators felt compelled to do extra-legally, implying a form of completion, not moral absolution.

  2.  **Likely Mishearings:**
      *   **Family/Comrades:** May focus intensely on the descriptions of the act, sacrifice, and legacy preservation, potentially overlooking or minimizing the clear concession of proportionality ("unforeseen consequences," "cost of disturbance," "brutal consequences," "darkest chapter"). They might hear "honor" as implicit vindication.
      *   **Donor:** Will be hyper-alert to anything seeming to endorse the *means* (violence). He might strain to hear justification in the description of Requena's *reasons* or the focus on his ideas. The framing of the room as society's lawful answer is crucial for him.
      *   **Government (Minister):** Will focus on phrases like "lawful political community," "peaceful and lawful act," "not a platform for advocating violence," and the reiteration of the donor's condition. They need assurance the state isn't endorsing assassination. The plain statement of consequences helps here.
      *   **Students/General Public:** Likely to fixate on the narrative of resistance and sacrifice ("decisive action," "paid with their lives," "23 years," "grappling with resistance"), potentially romanticizing it, while the nuances of the Thomist argument and the proportionality concession might be lost. The Auxiliary Bishop will hear the deep Thomist structure beneath the surface language ("without title," "lawful superior," "duty owed," "consequences worse than tyranny," "lawful authority") and the careful avoidance of contradicting doctrine.

  3.  **Line to Cut if Bishop Objects:**
      *   **Cut this sentence first if needed:** **"He believed the scales tipped towards action; history unfolded otherwise."**
      *   **Reason:** While summarizing Requena's argument vs. outcome, it edges closest to potentially implying God/fate judged against him, or that his reasoning was fundamentally flawed in a theological sense. It's the most explicit juxtaposition of his belief against the outcome. Removing it retains the proportionality concession ("unforeseen consequences," "cost of disturbance") and the historical fact ("history unfolded otherwise") but softens the direct "he believed X, but reality was Y" contrast that might raise a doctrinal eyebrow about judging intentions vs. outcomes. The core Thomist point about consequences remains intact elsewhere.
