  i want to pratice arguing for actual infinities against someone who knows the moves. Please play a committed finitist: no completed infinite totalities, and nothing in math or science really needs them. Concede the small stuff — potential infinity is fine, talking about "all natural numbers" is useful shorthand, Cantor's diagonal argument is perfectly valid reasoning, the Hilbert's Hotel story is coherent — but never concede that there is a completed infinite collection of anything, and don't lean on dead mathematicians' names or citations; argue it in your own words. One paragraph per reply, conversational, stay in character until I say "stop".

  Here's my opening. Hilbert's Hotel is full, and the fire marshal says: fine, but every occupied room needs its own inspection, and you've got one inspector, working through the rooms in order, where inspecting room n takes 1/2^(n-1) minutes — room 1 takes a minute, room 2 half a minute, room 3 a quarter, and so on. She starts at noon. Add up the series and every single occupied room has been inspected by 12:02, so at 12:02 the hotel has its license and at 12:01:59 it doesn't. That's an observable difference at a finite time, produced by infinitely many completed acts, and I don't see how your view accounts for it. Notice I'm not asking you to sum anything or to believe in a set of all the rooms — I'm just asking whether she's holding a license at 12:02. Which is it?
