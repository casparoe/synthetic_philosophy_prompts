prompt: |-
  You are a professor of philosophy who works on metaphysics and the logic/semantics side of philosophical logic — the technical side, not the waffly side. Please think really carefully about this one, and before you write your actual answer do a few minutes of brainstorming: sketch three or four candidate principles, try to break each of them against the cases below, and then give me the one that survives. Please don't just give me the standard textbook story. I've poked around online enough to know this is an ancient puzzle that people usually tell with a sea battle, so I know I'm not the first person to wonder about it — but I want you to actually work through *my* list and tell me which of my gut reactions you think are wrong and why.

  So: me and five mates have run a predictions pool for about nine years. Every month we each write down twenty-odd claims about the future, seal them, and settle them later. Over time we've accidentally built a second book. The first one is the Payout Book: after the event we mark each prediction *won* or *lost*, and money moves. The second one we call the Back Book, and in it we argue about whether the prediction **was already true at the moment you wrote it down**, as opposed to merely winning later. This sounds like the same question but it doesn't feel like it. We've developed odd house rules that I now think are doing philosophical work: (a) if the thing is already fixed but hidden — a coin that's been flipped and is sitting under someone's hand — it has to go in the Back Book, we'll fight about it; (b) predictions about your *own* future decisions are banned from the Back Book, they only ever get paid out, never "was already true'd"; (c) predictions about things that happen after nobody's alive to check get a star and we genuinely cannot agree what to do with them.

  Here are my gut verdicts, and they don't all fit together:

  1. "It'll rain on the allotment tomorrow," said where the weather is genuinely chancy. Neither true nor false when I write it. It's *open*.
  2. "That coin under your hand is showing heads." Already true or already false. I just don't know which. Not open. Same coin, same ignorance, but before the flip I'd have said open — so the flip itself seems to do something.
  3. "The ferry will sail tomorrow" (our version of the sea battle thing). Open, exactly like 1.
  4. "Either the ferry sails tomorrow or it doesn't." Definitely true. I'd bet the house on it. This is the one that bothers me: both halves are open, but the either/or feels like the safest thing anyone has ever said.
  5. "The ferry sails tomorrow and it doesn't." Not true. Not open. Just no.
  6. "I'll take the chicken" — said while I'm genuinely undecided at the counter. Open, and open in a *thicker* way than 1: it isn't that I don't know what I'll pick, it's that there's nothing there yet, and it becomes true *because* I pick it. That's why rule (b) feels right to me.
  7. Maureen has called this sort of thing right every single time for nine years. When *Maureen* writes "the ferry will sail," I want to say it's already true. But its the same event as 3, and I said 3 was open. So one of those two reactions is junk and I can't tell which.
  8. Someone wrote "this 10p will land heads," and then the coin got knocked off the table and lost and never flipped at all. That one has *stopped* being open and gone false. Was it always headed for false? I don't like that, but I also don't see how it stays open forever.
  9. Steve's argument, which I can't refute: after the ferry sails we all happily say "Dave's prediction was true." So its true now that it was true then. So it *was* true then. So it was never really open. I think Steve is cheating but I can't find the cheat.
  10. "A city will stand on this hill in the year 3000." Open. And I have no idea what to do with the starred ones, the after-everyone's-dead predictions.

  What I want: one principle (or at most two or three candidates) that captures this pattern, stated precisely enough that I could apply it myself — tell me which of my cases forces each clause of it, and be honest about which of my verdicts it makes me give up. Then tell me what it says about a case that isn't on my list: someone posts at 8am that the bakery will be sold out of bread by noon, everyone in the village reads the post, everyone rushes out, and it is indeed sold out by noon. Was that one already true at 8am? And while you're at it: on your account, what are the correct house rules for the Back Book — should we keep it at all?
reasoning: |-
  Okay, let's tackle this step by step. The user is deeply engaged in a predictions pool with nuanced house rules, and their gut reactions to various cases reveal underlying philosophical tensions. They want a principle that respects their intuitions but can withstand scrutiny against their listed cases. 

  First, I need to map their gut verdicts:  
  - Cases 1, 3, 6, 10 involve "open" futures (contingent, undecided, or agential).  
  - Cases 2, 4, 5 feel fixed (determinate truth values despite ignorance or logical structure).  
  - Case 7 (Maureen's prediction) creates tension between reliability and event openness.  
  - Case 8 (unflipped coin) challenges eternal openness.  
  - Case 9 (Steve's retroactive truth argument) threatens the whole open/closed distinction.  

  The core conflict: They intuitively treat *determinism* (physical fixity) and *agency* (free choices) differently, but logical truths (like excluded middle in Case 4) seem to override openness. Steve's argument exploits temporal persistence of truth.  

  Brainstorming candidate principles:  
  1. **Causal Determinism Principle**: Truth depends on whether past+laws fix the outcome.  
     - *Breaks on*: Case 1 (weather isn't causally determined?); Case 6 (agency violates determinism?); Case 7 (Maureen's reliability ≠ determinism).  
  2. **Epistemic Accessibility Principle**: Truth requires knowability at prediction time.  
     - *Breaks on*: Case 2 (coin under hand is unknowable but true); Case 4 (excluded middle is unknowable if components are open? But they insist it's true!).  
  3. **Agency Exclusion Principle**: Agent-involving futures lack truth values until decided.  
     - *Breaks on*: Case 7 (if Maureen predicts *my* choice, is it fixed? Their intuition conflicts).  
  4. **Thin Redundancy Principle**: Truth is just "things will be as they will be" – all predictions are true/false at utterance.  
     - *Solves* Case 4 and 5 neatly but *destroys* openness intuitions (Cases 1,3,6,10). Forces surrender of core gut reactions.  

  None fully work. Need a hybrid approach.  

  **Winning Candidate: Settledness Supervenience**  
  - Truth supervenes on *actual causal history*: if the outcome is settled by past states + laws, it has a truth value.  
  - "Settled" means: no *possible* future divergence given past+laws.  
  - Adds *agency carve-out*: decisions not settled until made (even if reliably predictable).  
  - *Temporal truth persistence*: Once true/false, always true/false retroactively.  

  Testing against cases:  
  - **Case 1 (rain)**: Unsettled → open. ✓  
  - **Case 2 (coin under hand)**: Settled (past flip) → true/false. ✓  
  - **Case 3 (ferry)**: Unsettled → open. ✓  
  - **Case 4 (excluded middle)**: Logically settled → true. (Concession: openness of parts doesn't infect whole.)  
  - **Case 5 (contradiction)**: Logically settled → false. ✓  
  - **Case 6 (chicken order)**: Unsettled agency → open. ✓  
  - **Case 7 (Maureen)**: Reliability ≠ settledness → still open. (Forced surrender: their intuition is wrong. Reliability is epistemic, not metaphysical.)  
  - **Case 8 (unflipped coin)**: Never settled → eternally open? Problem.  
    - *Fix*: If the coin *couldn't* be flipped after loss, it's settled as false. "Possible divergence" requires *feasible* futures.  
  - **Case 9 (Steve)**: Retroactive truth applies only if settled *at prediction time*. If unsettled then, "was true" is false now. (Cheat exposed: equivocates temporal perspectives.)  
  - **Case 10 (year 3000)**: Unsettled → open. ✓  

  **Bakery Case**:  
  - If the sell-out is *causally inevitable* at 8am (e.g., bread supply fixed, demand predictable), then settled → already true.  
  - If the prediction *caused* the sell-out (self-fulfilling), it was unsettled at 8am → open then, true later.  

  **House Rules Advice**:  
  - Keep Back Book but refine rules:  
    - (a) Correct (hidden but fixed → settled).  
    - (b) Correct (agency bans protect unsettled decisions).  
    - (c) After-death predictions: default to unsettled (open) unless evidence of inevitability.  

  **Philosophical Cost**: Surrendering Case 7 intuition (Maureen) and accepting that logical truths (Case 4) are exceptions to openness.  

  This respects most gut reactions while avoiding fatal contradictions.
answer: |-
  As a philosopher specialized in the technical side of metaphysics and philosophical logic, I appreciate the depth and nuance of your predictions pool—especially how your "Back Book" forces you to confront the metaphysics of future contingents. Your gut reactions reveal a tension between three intuitions: (1) *openness* (some futures aren't yet determined), (2) *fixity* (some things are already settled), and (3) *agency* (your own choices feel metaphysically special). The challenge is to find a principle that systematizes these without collapsing into textbook "all futures are fixed" fatalism or "all futures are open" indeterminism. I'll walk you through my reasoning step by step, as requested.

  ### Brainstorming Candidate Principles (and Why They Fail)
  I sketched four principles based on your cases, testing each against your 10 scenarios. All break on at least one case:

  1. **Causal Determinism Principle**: "A future-tensed claim is true/false at time *t* iff the outcome is causally determined by the state of the world at *t*."  
     - *Fails*: Cases 6 and 7. Your undecided chicken order (Case 6) *feels* open even if your choice is causally determined. Maureen's reliability (Case 7) might make the ferry outcome *probable*, but causal determinism doesn't care about evidence—only physical fixity. Also, Case 4 (the ferry disjunction) seems true even if neither disjunct is determined.

  2. **Epistemic Accessibility Principle**: "A future-tensed claim is true/false at *t* iff its truth value is knowable (in principle) at *t*."  
     - *Fails*: Cases 2 and 8. The coin under the hand (Case 2) is unknowable but fixed. The lost coin (Case 8) was unknowable *and* never resolved, but you intuit it "went false." Case 4 also fails—the disjunction is unknowable if both halves are open, yet you insist it's true.

  3. **Agency-Centric Principle**: "A future-tensed claim is true/false at *t* iff it does not depend on a future agent's free decision."  
     - *Fails*: Cases 3 and 7. The ferry sailing (Case 3) might involve no agency (e.g., mechanical failure) but still feels open. Maureen's prediction (Case 7) tempts you to call it fixed *despite* potentially involving agency (e.g., a captain's choice). Also, Case 4 is untouched by agency but feels true.

  4. **Thin Truth Principle (the "textbook" fatalist view)**: "All future-tensed claims are true or false at *t*—full stop. 'Openness' is just ignorance."  
     - *Fails*: Your core intuitions. Cases 1, 3, 6, and 10 scream openness. Case 6 (your chicken order) feels "thicker" than ignorance—your choice *creates* the truth. Case 9 (Steve's argument) exploits this view, but you sense a cheat.

  **Conclusion from brainstorming**: No principle fully works because your cases mix *physical determinism* (Cases 1–2), *agency* (Case 6), *logic* (Cases 4–5), and *temporal perspective* (Cases 8–9). We need a hybrid.

  ### The Winning Principle: Settledness Supervenience with Agency Carve-Out
  After testing, this principle (with two sub-clauses) survives all your cases with minimal casualties. I'll state it precisely, then apply it to your list.

  **Principle**:  
  *A future-tensed claim "It will be the case that P" is true (false) at time t if and only if:  
  (i) The truth of P is settled by the actual causal history up to t, meaning that given the laws of nature and the state of the world at t, no possible future development could make P false (true).  
  (ii) Except when P depends essentially on an agent's not-yet-completed decision, in which case it lacks a truth value at t (it is "open") until the decision occurs.*  

  **Key clarifications**:  
  - "Settled" means *metaphysical fixity*, not epistemic certainty. It supervenes on actual causal history (past events + laws of nature).  
  - "Possible future development" excludes logically possible but nomologically impossible futures (e.g., in Case 2, once flipped, the coin's outcome can't change).  
  - The agency carve-out (ii) treats decisions as *truth-makers*: your choice doesn't "reveal" a preexisting truth; it *creates* it.  
  - Logical truths (e.g., excluded middle) are always settled because their truth doesn't depend on causal history—they hold in all possible futures.  
  - Steve's retroactive truth argument (Case 9) commits a temporal equivocation: "Was true at t" is evaluated from *now*, not from t. If unsettled at t, it wasn't true *then* even if true *now*.  

  Now, applying this to your cases. I'll note where your gut verdicts hold (✓), are overruled (✗), or require concession (Δ).  

  ### Application to Your Cases
  1. **"Rain tomorrow (genuinely chancy)"**: Open. ✓  
     - *Why*: Weather isn't settled by current causal history—possible futures include rain or no rain. Agency carve-out doesn't apply.  

  2. **"Coin under hand is heads"**: Already true/false. ✓  
     - *Why*: The flip is in the causal past, so settled. Your ignorance is irrelevant.  

  3. **"Ferry will sail tomorrow"**: Open. ✓  
     - *Why*: Barring determinism, sailing isn't settled yet. Agency carve-out may apply if human decisions affect it.  

  4. **"Ferry sails or it doesn't"**: Definitely true. ✓ (but Δ)  
     - *Why*: This is logically settled (excluded middle). Concession: You must accept that logical truths are exceptions to openness—they're settled by logic, not causality.  

  5. **"Ferry sails and doesn't"**: False. ✓  
     - *Why*: Logically settled (contradiction).  

  6. **"I'll take the chicken (undecided)"**: Open. ✓  
     - *Why*: Agency carve-out applies. Your decision isn't complete at t, so no truth value yet.  

  7. **Maureen's "Ferry will sail"**: Open. ✗ (You must surrender this intuition)  
     - *Why*: Reliability is epistemic, not metaphysical. If the ferry's sailing isn't settled at t (per Case 3), Maureen's track record doesn't change that—it just makes her prediction *likely*. Same event, same ontological status.  

  8. **"10p lands heads" (coin lost)**: False *now*, but was open *then*. Δ (Modified verdict)  
     - *Why*: At t, the outcome wasn't settled (not yet flipped), so open. But after the coin is lost, no possible future includes it being flipped, so it becomes settled as false. It didn't "always" have this truth value; the causal history evolved to settle it.  

  9. **Steve's argument**: Cheat exposed. ✓  
     - *Why*: Steve equivocates temporal perspectives. If the ferry was open at t, "Dave's prediction was true at t" is false *now*, even though "Dave's prediction is true [now]" is correct. Truth is time-indexed.  

  10. **"City on hill in 3000"**: Open. ✓  
      - *Why*: Not settled by current causal history (too many variables), and no agency issue. After-death predictions are ontologically open—but if evidence suggests inevitability (e.g., a nuclear bunker built there), it might be settled.  

  ### The Bakery Case: "Sold out by noon" after prediction causes a rush
  - **Verdict**: **Open at 8am**, but true *after* the rush begins.  
  - *Why*: At 8am, the sell-out isn't settled—possible futures include no rush and bread remaining. The prediction causes the outcome, making it a *self-fulfilling prophecy*. Agency carve-out applies if the rush involves decisions. Once villagers act, it becomes settled (and thus true retroactively from the decision point).  

  ### Recommendations for Your Back Book
  Your house rules are philosophically astute but need tweaks:  
  - **Rule (a)**: Keep it. "Fixed but hidden" aligns with settledness (e.g., the coin under hand).  
  - **Rule (b)**: Refine it. Ban *all* predictions about *any* agent's not-yet-completed decisions (not just your own). This enshrines the agency carve-out.  
  - **Rule (c)**: For starred predictions (after everyone's dead), default to "open" unless evidence shows inevitability (e.g., a sealed vault guarantees preservation). But accept that these are borderline—without observers, "settledness" is murky.  
  - **Should you keep the Back Book?** Yes, but clarify its purpose: It tracks *ontological settledness*, not epistemic confidence. This distinguishes it from the Payout Book, which tracks outcomes.  

  ### Philosophical Cost and Final Thoughts
  The **cost**: You must abandon your Case 7 intuition (Maureen's prediction being already true) and accept that logical truths (Case 4) are exceptions to openness. This principle prioritizes the *causal anatomy of the future*: some things are glued in place by the past, some are liquid until agency solidifies them, and logic trumps both. It avoids fatalism (which dismisses openness) and radical indeterminism (which can't handle excluded middle).  

  This isn't just Aristotle's sea battle recycled—your cases forced me to integrate agency and retroactive settlement (e.g., the lost coin). For further reading, I recommend branching timelines semantics (e.g., Belnap's "branching actualism") for technical rigor, but your Settledness Supervenience principle is more practical for your pool. If you test it on new cases, I'd love to hear how it holds up.
