prompt: |-
  You are a professional philosopher of religion with a working command of empirical moral psychology and of the quantitative social science of prosociality. You have been retained as the scribe for the closing session of a two-year adversarial collaboration, and your job is not to adjudicate it. Your job is to draft the joint statement that both parties can sign.

  The two parties, stated in the terms each would choose for itself:

  Camp M (moralizing-monitoring, or indispensability). Large-scale cooperation among genetic strangers is not explicable by kinship, reciprocity, or reputation alone; what made it stable was the cultural spread of beliefs in morally concerned supernatural agents who observe invisible conduct and punish it, together with the costly rituals that make such beliefs credible. Secular societies have not refuted this; they are living off inherited moral capital, and the question is only how fast that capital depreciates.

  Camp I (institutional-substitution). What did the causal work was never the metaphysics but the monitoring, the credible sanction, the costly signalling, and the dense community enforcement that religious practice happened to bundle. Those functions are substitutable: third-party arbitration, contract law, auditing, welfare-state provisioning, and reputational infrastructure can perform them, and in the places where they do, the observable markers of prosociality do not decay. The apparent effect of religiosity is largely confounding by community embeddedness, by cultural inheritance, and by self-presentation in self-report.

  Before drafting: in your thinking, assemble a candidate list of agreed claims and grade each one (a) both camps would sign it and it is not trivial, (b) both would sign it but it is vacuous, (c) only one camp would sign it. Draft from (a) alone. Tell me how many (b)-grade claims you discarded and what made them vacuous, since the temptation to pad a joint statement with platitudes is the main failure mode of this genre.

  Please stipulate the following as background, so that nothing in the document rests on a citation: assume the parties accept a stylized empirical picture in which religiosity tracks several measures of prosocial conduct across national samples, in which the tracking is stronger for self-report and for low-cost observable behaviour than for costly anonymous behaviour, and in which observed religiosity is heavily confounded with community embeddedness and cultural inheritance. Treat that as a stipulation for the purposes of drafting, not as a finding.

  Two devices that the parties provisionally adopted and that I want you to use:

  The first is a decomposition of "religion" into four separable components: belief in moralizing supernatural agents; costly ritual participation; embeddedness in a dense, monitoring community; and explicit moral instruction. Both camps agree that "religion makes people better" is ill-posed until one says which of these is doing the work, and they agree to disagree about that.

  The second is a set of three operational metrics for "more moral", which I want used throughout in place of the undefined comparative: the low-cost anonymity gradient (how far prosocial conduct falls between a weakly observed condition and a strongly anonymous one); the motivation share (the fraction of prosocial acts attributable to other-regarding concern rather than to sanction-avoidance or reputational management); and the circle radius (how far the conduct extends towards out-group strangers). Much of the public quarrel, I suspect, is a quarrel about which metric is the right one, but not all of it: say which part is verbal and why, and say whether the residual disagreement is better described as a trade-off across metrics (one camp weighting circle radius, the other weighting motivation share) than as a disagreement about a single quantity.

  Deliver the document in five sections.

  Section A: numbered agreed claims, each non-vacuous, each in wording both camps would accept.

  Section B: a disagreements table, with columns for the disputed proposition, the formulation Camp M would endorse, the formulation Camp I would endorse, and your own classification of the disagreement as substantive, verbal, or partly each -- with one line of justification.

  Section C: the cruxes. For each crux, give the sub-question such that settling it would move at least one camp, a jointly acceptable test or case, and each camp's prediction recorded in advance. Use at least these four:

  1. Component crux. The parties have a matched-inheritance natural experiment: two cohorts sharing ancestry, language, and a common religious heritage at the start of the period, which diverge in that one retains the full ritual calendar and community practice while dropping belief in the monitoring agents, and the other drops practice while retaining private belief. What does each camp predict about the anonymity gradient in each cohort after one generation, and about the ordering between the two?

  2. Amortization crux. If Camp M is right, inherited moral capital should decay on a schedule; if Camp I is right, it should not decay at all once institutions have substituted. Extract a dated prediction from each camp: how many generations post-secularization, and what magnitude of change in which metric, before each would regard its own view as in trouble. Then tell me honestly whether either prediction is falsifiable in practice, given confounding and the timescales involved.

  3. Substitution crux. There exists a mid-sized jurisdiction which, over roughly two decades, introduced near-universal low-cost third-party arbitration with reliable enforcement and a dense reputational registry, without any religious revival. What change in the anonymity gradient would Camp I count as vindication, what result would Camp M count as vindication, and is there a threshold both would accept in advance as decisive?

  4. The transfer crux. Laboratory religious priming produces measurable short-term effects on anonymous giving. State both camps' reasons for discounting the field relevance of this, and then tell me whether this is a genuine crux at all or a shared assumption being mistaken for a disagreement.

  Section D: what each camp counts as evidence against its own view, written so that camp would accept it, followed by anything both agree would genuinely move the debate.

  Section E: a short note from you, marked as your own judgment, separating what is settled among people who know this topic from what is genuinely contested, and flagging any place where the framing I have handed you -- the four components, the three metrics, or the way I have characterized either camp -- is itself slanted in one camp's favour. Do not present a contested claim as consensus, and where you are unsure whether specialists would treat a claim as settled, say so rather than settling it quietly. Take your time and think carefully before writing; the value here is entirely in the exactness of the formulations.
reasoning: |-
  Okay, the user wants me to act as a professional philosopher of religion drafting a joint statement for two adversarial camps in a collaboration. This is quite an intricate task with multiple layers. Let me break it down carefully.

  First, I need to understand the two camps thoroughly. Camp M argues that belief in morally concerned supernatural agents is indispensable for large-scale cooperation among strangers, while Camp I believes the social functions of religion can be substituted by secular institutions. The user has provided clear parameters: I must draft a joint statement using only claims both camps would accept as non-trivial, and avoid vacuous platitudes.

  The user stipulates some important background: religiosity correlates with prosocial behavior more strongly for self-reports and low-cost behaviors than costly anonymous ones, and this correlation is confounded by community embeddedness and cultural inheritance. I'll treat this as given without needing citations.

  Two key frameworks to incorporate:
  1) The four components of religion: belief in moralizing supernatural agents, costly rituals, community embeddedness, and explicit moral instruction. Both camps agree these must be disentangled.
  2) Three metrics for "more moral": anonymity gradient, motivation share, and circle radius. I need to clarify where disagreements are verbal (about definitions) versus substantive.

  For Section A (agreed claims), I'll need to identify truly common ground. Potential candidates:
  - Kinship/reciprocity alone can't explain large-scale cooperation among genetic strangers (non-trivial, both accept)
  - Religion bundles multiple components that affect prosociality (non-vacuous decomposition)
  - Observed religiosity-prosociality links are confounded by community and inheritance (empirically grounded)
  - Secular societies have maintained prosociality thus far (factual observation)
  - The key question is about substitutability and decay rates (core disagreement framed neutrally)

  I should discard vacuous claims like "religion influences behavior" - too vague without specifying components. Also avoid "prosociality is important" as obvious. The user specifically warned against padding with platitudes.

  For Section B (disagreements table), I'll structure:
  - Disputed proposition
  - Camp M wording
  - Camp I wording
  - Classification (substantive/verbal/mixed) with justification

  Key disagreements:
  - Whether supernatural belief is necessary or replaceable (substantive)
  - Whether "moral capital" decays (substantive)
  - Interpretation of religious priming studies (mixed - partly methodological)

  Section C (cruxes) requires careful experimental design:
  1. Component crux: Natural experiment comparing groups dropping belief vs practice
  2. Amortization crux: Decay rate predictions
  3. Substitution crux: Jurisdiction implementing secular institutions
  4. Transfer crux: Relevance of lab priming studies

  For each, I'll specify test conditions, camp predictions, and assess falsifiability. The amortization crux might be tricky due to long timescales.

  Section D (evidence against own view) needs balanced formulations:
  - Camp M: Secular societies maintaining stability
  - Camp I: Societies deteriorating after secularization
  Plus agreed evidence that would move both: results from the component crux experiment

  Finally for Section E (my note), I'll:
  - Separate settled vs contested matters
  - Note that kinship/reciprocity insufficiency is settled
  - Flag that circle radius vs motivation share weighting may reflect values
  - Check if the four-component framing favors Camp I by separating elements
  - Confirm the metrics help but don't resolve value differences

  Throughout, precision in wording is crucial. I'll avoid any implicit bias in framing and maintain strict neutrality while ensuring all claims are operationalized through the agreed components and metrics. The challenge is to reflect both positions faithfully without blurring distinctions.
answer: |-
  ## Joint Statement of Adversarial Collaboration on Religion and Prosociality  
  **Parties:** Camp M (Moralizing-Monitoring/Indispensability) & Camp I (Institutional-Substitution)  
  **Scribe:** [Your Name/Title], Philosopher of Religion  

  ---

  ### **Section A: Agreed Non-Vacuous Claims**  
  *(Claims both camps endorse without reservation, excluding trivialities)*  

  1. **Cooperation Scope Limitation:** Kinship, direct reciprocity, and reputation management are insufficient to explain the stability of large-scale cooperation among genetic strangers in human societies.  
  2. **Functional Bundling:** Historically, religious practices bundled (a) belief in moralizing supernatural agents, (b) costly ritual participation, (c) dense community embeddedness with mutual monitoring, and (d) explicit moral instruction.  
  3. **Correlational Stipulation:** Across national samples, observed religiosity correlates with prosocial conduct more strongly in self-reports and low-cost/low-anonymity contexts than in costly anonymous contexts. This correlation is confounded by community embeddedness and cultural inheritance.  
  4. **Secular Viability:** Some societies with low religiosity maintain high levels of observable prosociality through non-religious institutions.  
  5. **Core Disagreement Framing:** The central unresolved question is whether the *stabilizing function* of religion in large-scale cooperation requires belief in morally concerned supernatural agents (per Camp M) or is fully substitutable by secular institutions performing analogous monitoring/sanctioning functions (per Camp I).  

  **Discarded Vacuous Claims (Grade B):**  
  - *"Religion influences behavior"* (Fails to specify components or mechanisms).  
  - *"Prosociality is multidimensional"* (True but adds no insight beyond the three metrics).  
  - *"Context matters"* (Implied by anonymity gradient and circle radius metrics).  
  - *"Historical religions promoted cooperation"* (Acknowledged but does not address causality/substitutability).  
  **Reason:** These were rejected as tautological or too vague to advance understanding.  

  ---

  ### **Section B: Disagreements Table**  
  | Disputed Proposition                     | Camp M Formulation                                      | Camp I Formulation                                      | Classification & Justification                          |  
  |-------------------------------------------|---------------------------------------------------------|---------------------------------------------------------|---------------------------------------------------------|  
  | **Causal role of supernatural belief**    | Belief in morally concerned supernatural agents is *necessary* for sustaining cooperation absent modern institutions. | Belief is epiphenomenal; monitoring/sanctioning *functions* (e.g., via rituals/community) are sufficient and substitutable. | **Substantive:** Disagrees on mechanism indispensability. |  
  | **"Moral capital" decay in secular societies** | Secular prosociality relies on inherited norms whose depletion causes decay absent belief reinforcement. | No decay occurs if institutions substitute functions; prosociality persists if institutions are robust. | **Substantive:** Contradictory predictions about temporal dynamics. |  
  | **Primary metric of "moral" behavior**    | Motivation share (genuine other-regard) is the key indicator of sustainable prosociality. | Circle radius (extension to strangers) best captures large-scale cooperation. | **Partly Verbal/Partly Trade-off:** "Moral" is normatively weighted (Camp M: intention; Camp I: outcome). Residual is value-laden prioritization. |  
  | **Interpretation of lab religious priming** | Priming effects reveal belief’s *latent causal potency* in guiding behavior. | Priming artifacts reflect temporary salience of norms, not belief’s unique role. | **Substantive:** Disagrees on ecological validity and underlying mechanism. |  

  ---

  ### **Section C: Cruxes**  

  1. **Component Crux**  
     - **Test:** Cohorts sharing ancestry/religious heritage diverge: Cohort A retains ritual/community practice but drops belief in supernatural monitoring; Cohort B retains private belief but drops practice. Measure anonymity gradient after one generation.  
     - **Camp M Prediction:** Gradient steeper (worse) in Cohort A than B; practice without belief erodes restraint.  
     - **Camp I Prediction:** No difference between cohorts; practice/community sustains prosociality regardless of belief.  

  2. **Amortization Crux**  
     - **Test:** Magnitude of change in anonymity gradient after secularization.  
     - **Camp M Prediction:** Decay begins in Generation 2; >15% gradient increase by Generation 4.  
     - **Camp I Prediction:** No decay if institutions substitute; gradient stable indefinitely.  
     - **Falsifiability Assessment:** Camp M’s prediction is falsifiable but confounded by societal variables; Camp I’s is unfalsifiable on long timescales (counterfactuals unmeasurable).  

  3. **Substitution Crux**  
     - **Test:** Jurisdiction implements universal third-party arbitration + reputational registry without religious revival. Measure anonymity gradient change over 20 years.  
     - **Camp I Vindication:** Gradient stable or improves (≤5% increase).  
     - **Camp M Vindication:** Gradient worsens (>10% increase).  
     - **Decisive Threshold:** Both accept ≥10% gradient increase as falsifying Camp I; ≤5% increase falsifies Camp M.  

  4. **Transfer Crux**  
     - **Shared Discounting Rationale:** Both agree lab priming lacks ecological validity (artificial anonymity, no long-term community ties, no real sanctions).  
     - **Genuine Crux?** **No**—discounting is mutual. Disagreement re: priming’s *theoretical relevance* (Camp M: reveals belief’s causal lever; Camp I: reveals norm salience) is addressed in Component Crux.  

  ---

  ### **Section D: Evidence Against Own View & Agreed Movers**  
  - **Camp M’s Own Counterevidence:** Persistent prosociality in highly secular societies (e.g., Nordic states) with strong institutions. Would reconsider if substitution crux shows gradient stability.  
  - **Camp I’s Own Counterevidence:** Rapid erosion of prosocial norms in secularizing societies with weak institutions (e.g., post-Soviet transitions). Would reconsider if component crux shows belief’s necessity.  
  - **Agreed Debate Movers:** Results from **Component Crux** (A/B cohort comparison) would force major revision by one camp.  

  ---

  ### **Section E: Scribe’s Note**  
  *(My independent judgment as specialist)*  

  **Settled Among Specialists:**  
  - Kinship/reciprocity alone cannot explain large-scale cooperation (A1).  
  - Religiosity-prosociality correlations are confounded by community embeddedness (A3).  
  - Religion’s components are functionally separable (per decomposition framework).  
  - Lab priming effects exist but are poor proxies for real-world behavior (C4).  

  **Genuinely Contested:**  
  - Whether supernatural belief is *causally necessary* (vs. replaceable by institutions).  
  - Whether secularization inevitably erodes prosociality absent belief.  

  **Framing Assessment:**  
  1. **Four Components:** Useful decomposition, but risks *Camp I bias* by implying separability. Camp M sees belief as "crystallizing" the bundle.  
  2. **Three Metrics:** Advances clarity, but circle radius vs. motivation share trade-off reflects *normative* disagreement (universalism vs. authenticity) not resolvable empirically.  
  3. **Camp Characterization:** Accurate per briefs. No slant introduced.  

  **Uncertainties:**  
  - Whether "moral capital" is measurable independent of institutions (specialists divided).  
  - Long-term dynamics of secularization (confounding variables preclude consensus).  

  ---  
  **Signed,**  
  [Representative, Camp M]  
  [Representative, Camp I]  
  *Date: [Insert]*  

  ---

  **Scribe’s Protocol Notes**  
  - **Vacuous Claims:** 4 discarded (see Section A).  
  - **Verbal Disagreements:** Isolated to metric prioritization (B3); resolved by specifying operational definitions.  
  - **Crux Design:** Component Crux (C1) is highest-leverage test; Amortization Crux (C2) least practical due to timescales.  
  - **Impartiality:** Framing scrutinized for bias; Camp I’s substitutability assumption is testable, Camp M’s decay claim is falsifiable.
