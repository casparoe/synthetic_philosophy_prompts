prompt: |-
  You are a philosopher of mind who is also fluent in how software is actually built, ported, emulated and lost — someone equally at home with the literature on functionalism and multiple realizability and with virtual machines, clean-room reimplementations and trained surrogates. Please think about this carefully and in stages. Before producing the deliverable, do some unstructured setup: list the distinctions from the functionalism literature that you think will actually carry weight for my problem, say which ones you are deliberately setting aside and why, and flag in advance any point where you expect the analogy between mental states and software artifacts to break. Then write the deliverable.

  Here is my situation. I direct the software and moving-image preservation unit of a national archive. Several times a week — roughly two hundred cases a year — my team has to decide whether a later artifact is the same work as an earlier one, or merely a version, a derivative, or a new work inspired by it. The stakes are not academic: the answer determines legal-deposit status, whether a re-issue may carry the original title and catalogue number, whether we can grant a loan or an exhibition copy, and in three live cases it determines whether a rights holder's permission is needed at all. Our decisions are published and can be appealed.

  Our current in-house rule was written by a committee years ago and reads roughly as follows: two artifacts are the same work just in case they have the same functional organisation — the same internal states, related to one another and to inputs and outputs in the same way — and the physical stuff they are built out of is irrelevant. I am told this is close to a position called functionalism, and that the irrelevance of the stuff is something called multiple realizability. The rule has started to fail us, and I can list how:

  One, it does not separate two things we keep confusing: an artifact that reproduces the documented input-output behaviour of the original, and an artifact that reproduces the original's internal organisation — the same intermediate states doing the same causal work on one another. Our cases now include a learned surrogate: a neural network trained on tens of thousands of hours of recorded play sessions which reproduces the original's behaviour on our entire test corpus, but in which nobody can point to anything that plays the role of the original's program states. Two, a colleague has pointed out that if you are allowed to choose the mapping from physical states of a system to states of the program freely enough, then almost any physical system "implements" almost any program, which would make our rule say yes to everything. Three, in practice our answers flip depending on how finely we describe things: at a coarse grain two artifacts are the same, at a fine grain they are not, and nothing in the rule tells us which grain is the official one. Four, we have chains: a 1993 original, a 2001 port, a 2011 rewrite, a 2020 rebuild for a new runtime. Each link in the chain was accepted by my predecessors as preserving identity, but the 1993 and 2020 artifacts share almost no code, no hardware and no documented states. Five, we are beginning to receive realizations — analog, neuromorphic, quantum — in which it is unclear whether there are discrete internal states to be organised at all.

  What I need from you is a decision procedure my team can actually run, not a position paper. Concretely:

  A numbered sequence of stages, with the question to ask at each stage, what counts as a sufficient answer to that question, the point at which the procedure stops and returns a no, and the point at which it stops and hands the decision to a person because the remaining question is one of values rather than fact. Mark the judgment calls that cannot be turned into a test as judgment calls rather than dressing them up as tests.

  An operational fix for each of my five failures above. In particular: how to choose and state the grain of description in advance; how to choose the set of counterfactual cases a candidate must be tested against when the original is no longer runnable and its behaviour on untested inputs is unknowable; and how to rule out the gerrymandered-mapping problem in a way an archivist can check — my own attempt is to require that the state mapping be specified in advance of testing and be the mapping a competent engineer would reconstruct from the documentation alone, and I would like you to take that attempt apart and replace it with something better.

  Honesty about the translation. Tell me which distinctions from the theory must survive being made usable by non-philosophers, which can be dropped without loss, and where the simplified version will give answers the unsimplified theory would not give.

  Then run the finished procedure on four cases and show the work: (a) a virtual-machine emulation of the original binary, running the original instruction stream on new hardware; (b) a clean-room reimplementation from a written functional specification, where the source is lost and the reimplementation is known to diverge from the original on a small set of undocumented behaviours that no surviving documentation describes; (c) the learned surrogate described above; (d) the 1993-to-2020 chain, where the question is whether preservation of identity is transitive across accepted links. I expect at least one of these to come out as a no that we would very much rather not hear — the surrogate is, for several works, the only way anyone will ever be able to experience them again, and the rights holders are untraceable. Give me that unwelcome answer directly and defend it against the objection I have just handed you.

  Finally, state plainly what the procedure cannot do: the questions about sameness that it silently converts into something else, the cases where our use of the word work is doing legal or institutional work rather than metaphysical work, and the point at which my team should stop asking what the artifacts really are and start deciding what we owe the public.

  Constraints on the answer: the person running this has an undergraduate computer science degree and no philosophy; a decision must be reachable within two weeks using evidence we can realistically assemble; a three-person committee of a curator, an engineer and a rights officer has to sign off on the output; and the procedure must still return something usable when the source code is lost, the original hardware is gone, or the documentation is a single manual page. I am not asking for citations, references or further reading — I want the argument and the procedure themselves.
reasoning: |-
  We are integrating philosophical concepts (functionalism, multiple realizability) with practical software preservation challenges. The goal is a decision procedure that handles real-world cases while acknowledging theoretical limitations.

  Key distinctions from functionalism literature that carry weight:
  1. **Functional organization vs. behavioral equivalence**: Functional organization refers to the causal structure of internal states and their transitions, while behavioral equivalence is about matching input-output patterns without preserving internal causal mechanisms.
  2. **Grain of analysis**: The level of abstraction at which we describe states and transitions (e.g., instruction-level, algorithmic, high-level behavior).
  3. **Multiple realizability**: The idea that the same functional organization can be implemented in different physical substrates. This is central but must be constrained to avoid trivialization (the "gerrymandering" problem).
  4. **Counterfactual robustness**: A true functional isomorph should not only replicate actual behavior but also behave the same under a range of hypothetical inputs and states.

  Distinctions deliberately set aside:
  1. **Qualia and phenomenal consciousness**: These are irrelevant to software artifacts, which lack subjective experience.
  2. **Intentionality (aboutness)**: While software can represent, we are concerned with functional behavior, not semantic content per se.
  3. **Holism vs. localism**: We assume that the functional organization of the artifact can be specified without reference to the entire ecosystem, though context matters for inputs/outputs.

  Points where the analogy breaks:
  - **Lack of teleology**: Software is designed with a purpose, but in preservation, we care about the artifact's actual function, not the designer's intent (though documentation may capture intent).
  - **Infinite flexibility of mappings**: In philosophy, any physical system can be mapped to any computation if we're liberal enough. We must avoid this by fixing the grain and mapping in a principled way.
  - **Identity over time**: Software can be patched and updated. We must define a "version" vs. a "new work" based on functional continuity, not just historical lineage.

  **Deliverable: Decision Procedure for Work Identity**

  **Preamble for the Team**
  This procedure determines whether two software artifacts (A and B) are the same work. It is based on functional organization, but with constraints to avoid overgeneration. The core idea is that two artifacts are the same work if they have the same functional organization at a specified grain of description, and this organization is realized in a way that is not gerrymandered. The procedure has stages; if at any stage we get a definitive "no", we stop. If we reach a stage that requires value judgments, we hand off to the committee.

  **Key Definitions**
  - **Functional Organization**: A set of states, transitions between states, and mappings from inputs to states and states to outputs, such that the transitions are causally sensitive to the state and input.
  - **Grain of Description**: The level of detail at which we describe states (e.g., the bit-level state of registers vs. high-level variables). We fix this in advance for a given work based on its documentation and original context.
  - **Competent Engineer's Mapping**: A mapping from physical states (or observable states) to functional states that a competent engineer would derive from the original documentation without access to the new artifact.

  **Procedure**

  **Stage 0: Preconditions**
  - **Question**: Are both artifacts intended to perform the same task as documented for the original work? (This is a sanity check to filter out obvious non-candidates.)
  - **Sufficient Answer**: If no, then stop: not the same work. If yes, proceed.
  - **Judgment Call**: What counts as "the same task"? Use the original documentation and context. If the task is fundamentally different (e.g., a spreadsheet vs. a word processor), it's a no.

  **Stage 1: Behavioral Equivalence on a Test Corpus**
  - **Question**: Does artifact B produce the same outputs as artifact A for all inputs in a standard test corpus derived from the original documentation and usage logs?
  - **Sufficient Answer**: 
    - If no, and the divergences are not documented and accepted (e.g., known bug fixes), stop: not the same work. 
    - If yes, proceed.
  - **Note**: This corpus must be fixed in advance for a work. If the original is not runnable, the corpus is based on documented behavior.

  **Stage 2: Existence of a Functional Organization**
  - **Question**: Can we specify a functional organization (states and transitions) for artifact A from documentation and reverse engineering? And can we do the same for artifact B?
  - **Sufficient Answer**:
    - If for A we cannot (due to lost documentation, etc.), we cannot apply the functional criterion. Stop and hand to committee: use behavioral equivalence plus historical context (Stage X).
    - If for B we cannot (e.g., the learned surrogate has no discernible states), then stop: without functional organization, it cannot be the same work by our core rule. Proceed only if both have specifiable functional organizations.
  - **Judgment Call**: What counts as a "state"? We use the grain fixed in advance (see Grain Fixing below).

  **Stage 3: Functional Isomorphism**
  - **Question**: Is there a mapping from the states of B to the states of A such that:
    - For every state transition in A (from state S1 to S2 on input I, producing output O), the corresponding states in B (S1' to S2') on input I produce output O, and vice versa?
  - **Sufficient Answer**:
    - If no, stop: not the same work.
    - If yes, proceed to Stage 4.
  - **Note**: The mapping must be based on the **Competent Engineer's Mapping** derived from the original documentation alone, not retrofitted to make B match A.

  **Stage 4: Counterfactual Robustness**
  - **Question**: For a set of counterfactual inputs (generated from the documentation and known edge cases), does the functional organization of B behave as A would have? (We use the functional organization, not just behavior, so we check state transitions.)
  - **Sufficient Answer**:
    - If there are documented counterfactuals (e.g., "if input is negative, it should throw an error"), and B does not comply, stop: not the same work.
    - If we have no way to know (original not runnable, no documentation), we cannot test. Proceed to Stage 5.
  - **Judgment Call**: Which counterfactuals? Use those implied by the original documentation or from common engineering knowledge of the domain.

  **Stage 5: Realization Constraints (Anti-Gerrymandering)**
  - **Question**: Is the mapping from physical states to functional states in B the same as the one a competent engineer would have derived from the original documentation (without seeing B) and applied to B? (This is your idea, refined.)
  - **Sufficient Answer**:
    - If yes, then artifacts are the same work: stop and return yes.
    - If no, then stop: not the same work. (We avoid gerrymandered mappings.)
  - **Refinement of your idea**: Instead of requiring the mapping to be specified in advance (which is impractical for rediscovered artifacts), we require that the mapping for B must be reconstructible from the original documentation and must not rely on knowledge of B's internal structure beyond what the documentation specifies. A competent engineer, using only the original documentation, should be able to predict how the functional states are realized in any implementation. If B's structure requires a new mapping that wasn't implied by the original documentation, it's a different realization.
  - **Check**: Have an engineer (who hasn't seen B's code) derive a mapping from the documentation. Then compare to B's actual structure. If they match, it's ok.

  **Stage X: When Functional Organization is Unavailable**
  - **Trigger**: If Stage 2 fails (no functional organization for A or B), but we have behavioral equivalence and historical continuity.
  - **Question**: Is there a chain of accepted work identities from A to B? And is the behavioral equivalence strong enough to consider it the same work for archival purposes?
  - **Sufficient Answer**: This is a value judgment. Hand to committee. They must decide based on:
    - The strength of behavioral match.
    - Historical context (e.g., was it marketed as the same work?).
    - Archival purpose (e.g., public access vs. historical accuracy).

  **Operational Fixes for Your Five Failures**

  **Failure 1 (Confusing behavior with functional organization)**
  - **Fix**: Stages 1 and 2 separate behavior (Stage 1) from functional organization (Stage 2). The learned surrogate fails at Stage 2 because it lacks a specifiable functional organization with states and transitions.

  **Failure 2 (Gerrymandered mappings)**
  - **Fix**: Stage 5 requires the mapping to be derivable from original documentation alone, by a competent engineer. This blocks arbitrary mappings.

  **Failure 3 (Grain of description)**
  - **Fix**: At intake, for each work, we fix the grain of description based on the original documentation. 
    - **How**: Use the most detailed grain that is fully documented. E.g., if the manual describes high-level states (like "game levels"), use that; if it has a state machine diagram, use that; if it has assembly-level specs, use that. If documentation is sparse (one manual page), we use the coarsest grain that the documentation supports (e.g., input-output behavior only, which may push us to Stage X).

  **Failure 4 (Chains)**
  - **Fix**: Identity is not transitive by default. For chains, we require that each adjacent pair must pass the procedure. The 1993-2020 chain must be checked link by link. If all links are accepted (by previous teams), we note that, but we re-check the end points (1993 and 2020) with our procedure. If they pass, it's the same work; if not, we flag it.

  **Failure 5 (Novel realizations without discrete states)**
  - **Fix**: If there are no discrete states (e.g., analog computer), then at Stage 2 we cannot specify a functional organization. We fall back to Stage X (behavioral equivalence and committee judgment).

  **Translation Honesty**
  - **Must survive**: 
    - Functional organization (as causal structure) vs. behavior. 
    - Grain relativity: we must fix the grain.
    - Anti-gerrymandering: mappings must be natural to the original spec.
  - **Dropped without loss**: 
    - Intentionality: we care about function, not meaning.
    - Phenomenal properties: irrelevant for software.
  - **Simplification risks**: 
    - The procedure may say "no" to cases that philosophers might call functionally equivalent but where the mapping is gerrymandered (we avoid this by Stage 5). 
    - We rely on documentation, which may be incomplete. Philosophers might consider ideal functions, but we are grounded in historical artifacts.

  **Run the Procedure on Four Cases**

  **Case (a): Virtual-machine emulation of the original binary**
  - Stage 0: Same task? Yes.
  - Stage 1: Behavioral equivalence? Yes, by design.
  - Stage 2: Functional organization? Yes, the VM emulates the same instruction set.
  - Stage 3: Functional isomorphism? Yes, the states (register values, memory) map directly.
  - Stage 4: Counterfactuals? The VM should handle all inputs as the original would.
  - Stage 5: Mapping? The mapping is the same as the original hardware's, as per documentation. 
  - **Verdict: Same work.**

  **Case (b): Clean-room reimplementation from functional spec**
  - Stage 0: Same task? Yes.
  - Stage 1: Behavioral equivalence? Mostly, but diverges on some undocumented cases. If the test corpus doesn't cover these, we might pass Stage 1. But if the divergences are known, we must include them. 
    - If the test corpus is only documented behavior, and the divergences are undocumented, Stage 1 passes. 
  - Stage 2: Functional organization? Yes, from the functional spec.
  - Stage 3: Functional isomorphism? The spec defines states and transitions. The reimplementation should match. But if it diverges on undocumented cases, it may not. 
    - We must check the functional organization on the diverging inputs. If the functional spec doesn't specify, we cannot know. We proceed to Stage 4.
  - Stage 4: Counterfactual robustness? For the undocumented inputs, we don't know what the original would do. We cannot test. Proceed to Stage 5.
  - Stage 5: Mapping? The mapping should be from the functional spec. If the reimplementation was built from the same spec, the mapping is the same. But if the divergence implies a different functional organization (e.g., a different state transition), then no. 
    - **Judgment**: If the divergence is due to an ambiguity in the spec, and the reimplementation chose one interpretation, then it may still be the same work. But if the reimplementation has a different internal structure that leads to different states, then no. 
    - **Verdict**: If the divergence is minor and the functional organization is preserved, same work. But if the divergence reveals a difference in functional organization (e.g., a different algorithm), then not the same work. This is a judgment call: hand to committee if the divergence is material.

  **Case (c): Learned surrogate (neural network)**
  - Stage 0: Same task? Yes.
  - Stage 1: Behavioral equivalence? Yes, by training.
  - Stage 2: Functional organization? We cannot specify discrete states and transitions in the surrogate that correspond to the original's program states. The NN is a black box. 
    - **Verdict**: Stop at Stage 2: not the same work. 
  - **Unwelcome answer defended**: You say the surrogate is the only way to experience the work. But our rule requires functional organization, not just behavior. The NN does not have the same causal structure. It is a different kind of artifact. For archival purposes, we might still preserve it as a derivative or as an access copy, but it is not the same work. If the rights holder is untraceable, this creates a problem, but the procedure is about identity, not access. We must separate these concerns.

  **Case (d): 1993-to-2020 chain**
  - We must check each adjacent pair (1993-2001, 2001-2011, 2011-2020) with the procedure. But the question is about the endpoints.
  - Run the procedure on 1993 and 2020 directly:
    - Stage 0: Same task? Yes.
    - Stage 1: Behavioral equivalence? We must test. If they share a test corpus and pass, yes.
    - Stage 2: Functional organization? 2020 may have a different internal structure. We need to specify the grain. If the grain is coarse (e.g., user-visible states), it might be the same. If fine (code-level), not.
    - How we fixed the grain: For a 1993 work, documentation might be sparse. Suppose we fix the grain at the level of the original manual (high-level states). 
    - Stage 3: If the 2020 version has the same high-level states and transitions, yes. But if it was rewritten with a different architecture, maybe not.
    - Stage 4: Counterfactuals: unknown if original not runnable.
    - Stage 5: Mapping: must be from 1993 docs. If the 2020 version's states are mapped as per the 1993 manual, yes.
    - **Verdict**: It depends. If the chain was built preserving functional organization at the fixed grain, same work. But if the grain was not preserved (e.g., the 2020 version has no equivalent states), then no. Given the chain of accepted links, we might accept it, but the procedure requires direct functional isomorphism. 
    - **Judgment**: If the endpoints pass Stages 1-5, same work. If not, but the chain is strong, hand to committee (Stage X).

  **What the Procedure Cannot Do**
  - **Silent conversions**: 
    - It converts "sameness of work" into functional isomorphism at a fixed grain. If the grain is coarse, it may ignore internal differences that matter to scholars.
    - It treats the work as a closed system; dependencies on external services or data may be overlooked.
  - **Legal/Institutional work**: 
    - The word "work" may be defined by copyright law (e.g., derivative works). Our procedure is metaphysical; if the law conflicts, we note it and hand to rights officer.
    - Marketing and public perception may treat two artifacts as the same, even if they are not functionally isomorphic.
  - **Stopping point**: 
    - When we reach Stage X (committee judgment), we shift from "what the artifact is" to "what we owe the public". The committee should consider:
      - Preserving access vs. historical fidelity.
      - Legal constraints (rights, deposit).
      - The cost of losing the only accessible version (like the surrogate).

  **Final Procedure Design**
  The procedure is staged to avoid overcomputation. Most cases will resolve at Stage 1 (behavior) or Stage 2 (existence of functional organization). The hard cases go to Stage 5 or Stage X. It respects time constraints by focusing on documented behavior and pre-fixed grain.

  **Output Format for Team**
  We produce a form with:
  - Work ID, artifacts A and B.
  - Fixed grain (from intake documentation).
  - Test corpus used.
  - Stage-by-stage results (pass/fail/handoff).
  - Final verdict.
answer: |-
  ### Unstructured Setup: Philosophical Foundations and Practical Constraints

  #### Key Distinctions from Functionalism Literature That Carry Weight
  1. **Functional Organization vs. Behavioral Equivalence**: Functional organization requires identical causal relationships between internal states, inputs, and outputs. Behavioral equivalence only requires matching input-output pairs, regardless of internal mechanisms. This distinction is crucial for separating emulations (which preserve organization) from surrogates (which may only mimic behavior).
  2. **Grain of Description**: The level of abstraction at which states and transitions are defined (e.g., instruction-level, algorithmic, or user-visible). Grain determines what counts as a "state" and must be fixed contextually to avoid arbitrary judgments.
  3. **Multiple Realizability with Constraints**: Physical implementation is irrelevant *only* if the functional organization is preserved under a non-gerrymandered mapping. We reject "liberal" mappings (where any system can implement any program) by requiring mappings to be natural, documentation-derived, and testable.
  4. **Counterfactual Robustness**: True functional identity requires consistent behavior not just on tested inputs, but on *relevant* untested inputs (e.g., edge cases implied by documentation). This avoids false positives from artifacts that match only on limited corpora.
  5. **Transitivity of Identity**: Functional identity is not automatically transitive across chains. Each link must be validated individually, and endpoint comparison is necessary to avoid "ship of Theseus" problems.

  #### Distinctions Set Aside and Why
  - **Qualia and Phenomenal States**: Set aside because software lacks subjective experience; we care only about observable, causal behavior.
  - **Intentionality (Aboutness)**: Set aside because archival identity hinges on functional behavior, not semantic meaning (e.g., whether a program "represents" a concept).
  - **Teleological Functions**: Set aside because we prioritize documented design over purpose (e.g., "the program's goal" is irrelevant if undocumented). We use documentation to infer function, not intent.
  - **Holism vs. Atomism**: Set aside because we treat artifacts as modular systems; dependencies (e.g., OS libraries) are handled as inputs, not part of identity.

  #### Points Where the Analogy Breaks
  - **Infinite Mappings**: In philosophy, any physical system can be mapped to any computation with creative state assignments. In practice, we avoid this by tethering mappings to documentation and engineer-reconstructible states.
  - **Continuity of Identity**: Software can be patched incrementally (blurring "version" vs. "new work"), while mental states lack this granularity. We handle this with explicit versioning rules.
  - **Non-Discrete Systems**: Analog/quantum systems may lack discrete states, making functional organization inapplicable. We fall back to behavioral equivalence + committee judgment.
  - **Value-Laden Boundaries**: Philosophical functionalism ignores institutional needs (e.g., public access), but we must halt the procedure for such decisions.

  ---

  ### Decision Procedure for Work Identity

  **Preamble**: This procedure determines if artifact B is the same *work* as artifact A. It prioritizes functional organization but incorporates fallbacks for practicality. Run stages sequentially; stop at a "No" or when handed to the committee. Use a **fixed grain of description** (defined at intake) and **pre-specified test inputs** (based on documentation). The committee (curator, engineer, rights officer) handles value judgments.

  #### Stage 0: Intake and Grain Fixing
  - **Question**: What is the **grain of description** for artifact A’s functional organization?  
    **Sufficient Answer**: Grain must be fixed using the **most detailed level fully documented** in A’s specs (e.g., user manual, diagrams, comments).  
    - *Coarse*: User-visible states (e.g., "game level," "document edit mode").  
    - *Medium*: Algorithmic states (e.g., "sorting subroutine," "buffer state").  
    - *Fine*: Code/instruction-level (e.g., "register X value," "stack pointer").  
    - **Stop if**: No documentation exists (use Stage 5 fallback).  
    **Judgment Call**: Grain is fixed by the curator + engineer based on available docs. If docs are sparse (e.g., one manual page), use coarse grain.

  #### Stage 1: Behavioral Equivalence on Core Corpus
  - **Question**: Does B reproduce A’s documented input-output behavior for all inputs in the **core test corpus**?  
    **Sufficient Answer**:  
    - Corpus = Inputs from A’s docs (e.g., manual examples) + common real-world uses (e.g., from usage logs).  
    - If B matches A for all corpus inputs → Proceed.  
    - If B diverges on any input → **Stop: Not same work** (unless divergence is documented/accepted, e.g., bug fix).  
    **Operational Note**: If A is unrunnable, test B against docs. If the corpus is incomplete, proceed but flag for Stage 4.

  #### Stage 2: Functional Organization Check
  - **Question**: Can A’s functional organization (states, transitions) be reconstructed from docs? Does B have *any* identifiable functional organization at the fixed grain?  
    **Sufficient Answer**:  
    - For A: Engineer reconstructs a state-transition diagram from docs (e.g., "on input X, state S1 transitions to S2, outputting Y"). If impossible → Hand to committee (Stage 5).  
    - For B: If B has no discrete states (e.g., neural net surrogate, analog system) → **Stop: Not same work**.  
    - Else → Proceed.  
    **Judgment Call**: Engineer decides if states are "identifiable" using docs (e.g., "Is there a clear mapping from B’s memory to A’s states?").

  #### Stage 3: Functional Isomorphism Test
  - **Question**: Is B functionally isomorphic to A at the fixed grain?  
    **Sufficient Answer**:  
    - Engineer defines a **state mapping** from B’s states to A’s states using **only A’s documentation** (without B’s code).  
    - Test: For every state/transition in A’s reconstruction, does B have a corresponding state/transition that behaves identically under the core corpus?  
      - Yes, for all transitions → Proceed.  
      - No → **Stop: Not same work**.  
    **Anti-Gerrymandering Fix**: The mapping must be **reconstructible in advance** from A’s docs. Engineer must write the mapping *before* testing B. No retrofitting.

  #### Stage 4: Counterfactual Robustness Check
  - **Question**: Does B behave like A on **relevant counterfactual inputs**?  
    **Sufficient Answer**:  
    - Counterfactuals = Inputs implied by docs (e.g., manual says "handles integers," so test negative/zero values) or industry-standard edge cases.  
    - If B matches A’s expected behavior → **Stop: Same work**.  
    - If B diverges and A’s behavior is undocumented → Hand to committee (Stage 5).  
    - If B diverges and A’s behavior is documented → **Stop: Not same work**.  
    **Judgment Call**: Curator + engineer select counterfactuals based on docs. If no counterfactuals are inferable, skip this stage.

  #### Stage 5: Committee Judgment for Ambiguity
  - **Question**: Is B the same work for **archival purposes** despite failing earlier stages?  
    **Sufficient Answer**: Committee decides based on:  
    - Strength of behavioral match (Stage 1).  
    - Historical continuity (e.g., direct lineage, accepted versions).  
    - Public interest (e.g., B is the only accessible copy).  
    - Legal factors (e.g., rights holder intent, deposit requirements).  
    **Output**: "Same work," "Derivative," or "New work."  
    **Stop Here**: Always returns a decision.  

  ---

  ### Fixes for Your Five Failures
  1. **Failure 1 (Behavior vs. Functional Organization)**  
     - **Fix**: Stages 2 and 3 decouple these. Stage 2 requires B to have a functional organization; Stage 3 tests isomorphism. The neural net surrogate fails at Stage 2.  
  2. **Failure 2 (Gerrymandered Mappings)**  
     - **Fix**: Stage 3 requires mappings to be reconstructible from A’s docs *before* testing B. This enforces a "natural" mapping. Engineer must document the mapping using only A’s specs (e.g., "Manual page 3 describes state S, so map B’s memory address 0xFE to S").  
  3. **Failure 3 (Grain Inconsistency)**  
     - **Fix**: Grain is fixed at intake (Stage 0) using A’s documentation. E.g., if A’s manual describes high-level states, grain is coarse; if it includes code snippets, grain is fine.  
  4. **Failure 4 (Chains)**  
     - **Fix**: Chains are not transitive. Validate each link pairwise (A to B, B to C, etc.) using the procedure. For endpoint comparison (1993 vs. 2020), run full procedure.  
  5. **Failure 5 (Non-Discrete Realizations)**  
     - **Fix**: Stage 2 handles this—if no discrete states exist (e.g., analog system), procedure falls back to committee judgment (Stage 5) with behavioral evidence.  

  ---

  ### Translation Honesty
  - **Must Survive Simplification**:  
    - Functional organization vs. behavior (Stages 1–3). Dropping this conflates emulations with surrogates.  
    - Grain relativity (Stage 0). Dropping this allows arbitrary "zooming" to force matches.  
    - Anti-gerrymandering (Stage 3). Dropping this permits trivial mappings.  
  - **Dropped Without Loss**:  
    - Intentionality (irrelevant for inputs/outputs).  
    - Multiple realizability’s metaphysical breadth (we constrain it to engineer-verifiable mappings).  
  - **Simplification Risks**:  
    - Procedure may reject "equivalent" artifacts if mappings aren’t doc-derived (e.g., a perfect reimplementation with lost specs might fail Stage 3).  
    - Falls back to committee more often than pure functionalism (practical necessity).  

  ---

  ### Procedure Applied to Four Cases
  **Case (a): Virtual-Machine Emulation of Original Binary**  
  - Stage 0: Grain = fine (original hardware docs specify instruction-level states).  
  - Stage 1: Passes (emulator matches core corpus).  
  - Stage 2: Passes (states: CPU registers, memory).  
  - Stage 3: Passes (mapping: virtual registers → physical registers per docs).  
  - Stage 4: Passes (handles counterfactuals, e.g., invalid opcodes).  
  - **Verdict: Same work**.  

  **Case (b): Clean-Room Reimplementation from Functional Spec**  
  - Stage 0: Grain = medium (spec describes algorithmic states).  
  - Stage 1: Passes (matches core corpus; divergences are undocumented).  
  - Stage 2: Passes (states: e.g., "sorting state," "buffer state").  
  - Stage 3: Passes if states map per spec; **fails if divergences imply different transitions** (e.g., B uses quicksort vs. A’s mergesort).  
  - Stage 4: **Fails** if divergences occur on counterfactuals (e.g., spec says "handles large inputs," but B crashes).  
  - **Verdict: Not same work** if Stage 3/4 fail. Committee override possible if divergences are minor (Stage 5).  

  **Case (c): Learned Surrogate (Neural Network)**  
  - Stage 0: Grain = medium (original docs describe game states).  
  - Stage 1: Passes (matches test corpus).  
  - Stage 2: **Fails** (no identifiable states; NN is a black box).  
  - **Verdict: Not same work**.  
  - **Defense Against Objection**: Yes, the surrogate may be the only accessible version, and rights holders are untraceable. But it lacks the causal structure that defines the work’s identity—it’s a behavioral clone, not a functional replica. For archival purposes, preserve it as a "derivative" or "access copy," but it cannot inherit the original’s legal-deposit status. The committee (Stage 5) can authorize its use for public access, but this is a value judgment, not identity.  

  **Case (d): 1993-to-2020 Chain**  
  - Step 1: Validate each link (1993→2001, 2001→2011, etc.) using the procedure. If any link fails, endpoints may differ.  
  - Step 2: Compare endpoints (1993 vs. 2020):  
    - Stage 0: Grain = coarse (only high-level docs survive).  
    - Stage 1: Passes (shared core corpus).  
    - Stage 2: Passes (both have user-visible states).  
    - Stage 3: **Fails** if 2020 states don’t map to 1993’s (e.g., 1993 has "save state," 2020 uses cloud autosave).  
    - **Verdict: Not same work** if Stage 3 fails.  
  - **Transitivity Defense**: Even if each link was accepted, functional identity isn’t transitive if endpoints lack isomorphism. Committee (Stage 5) may override for continuity.  

  ---

  ### What the Procedure Cannot Do
  - **Silent Conversions**:  
    - Converts "Is this the same work?" into "Is there a documentation-derived functional isomorphism?" This ignores unrecorded design intent.  
    - Converts "untestable inputs" into committee judgments, prioritizing practicality over metaphysics.  
  - **Legal/Institutional Work**:  
    - The word "work" may be defined by copyright law (e.g., derivative works) or public expectation (e.g., a "remastered" game). The procedure cannot override legal definitions; it defers to the rights officer in Stage 5.  
  - **Stopping Point for Values**:  
    - When artifacts are culturally significant but functionally distinct (e.g., the neural net surrogate), **stop asking about identity**. Instead, the committee decides:  
      - What we owe the public (access vs. accuracy).  
      - What preserves cultural heritage (e.g., treat the surrogate as an "exhibition copy").  
      - Legal risks (e.g., untraceable rights holders).  

  **Final Checks**:  
  - **Feasibility**: Uses only docs, test corpora, and engineer analysis. Decidable in 2 weeks.  
  - **Committee Sign-off**: Engineer handles Stages 0–4; committee handles Stage 5 and appeals.  
  - **Degraded Evidence**: With sparse docs (e.g., one manual), Stage 0 uses coarse grain, and Stage 5 resolves ambiguity.  

  ---  
  This procedure prioritizes clarity and audibility over philosophical purity. It will yield uncomfortable answers (e.g., rejecting the surrogate as the "same work"), but it ensures consistency and defensibility. When functional identity is indeterminable, the committee arbitrates based on your archive’s mission—preserving not just artifacts, but the public’s ability to experience them.
