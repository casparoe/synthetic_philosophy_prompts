  We list the named views to be included as leaves:

  1. Strict finite frequentism (or actual frequentism): probability is the actual relative frequency in a finite reference class.
     - Awkward: cannot assign probability to single events that are not repeatable in a finite class.

  2. Limiting frequentism: probability is the limit of relative frequencies in an infinite sequence of trials.
     - Awkward: requires an infinite sequence, and single-case probabilities are only defined via a collective.

  3. Hypothetical frequentism: probability is the limiting frequency that would occur in a hypothetical long run under the same conditions.
     - Awkward: hypothetical sequences are not actual and may be undefined.

  4. Long-run propensity: probability is a disposition of a system to produce stable relative frequencies in the long run.
     - Awkward: does not directly apply to single trials.

  5. Single-case propensity: probability is a disposition of a specific trial to produce a particular outcome.
     - Awkward: hard to measure or verify.

  6. Humean best-system account (e.g., Lewis): probabilities are the chances assigned by the best system (balancing simplicity and strength) that summarizes the actual occurrent facts.
     - Awkward: chances supervene on the actual pattern of events, so they are not fundamental.

  7. Non-Humean primitivism: chance is an irreducible feature of the world.
     - Awkward: mysterious and non-reductive.

  8. Logical or evidential probability: probability is a logical relation between propositions (e.g., degree of support evidence gives to a hypothesis).
     - Awkward: requires a unique, objective prior, which is controversial.

  9. Objective Bayesianism: degrees of belief are constrained by coherence and some objective rule (e.g., symmetry, maximum entropy) given the evidence.
     - Awkward: the choice of objective rule may be arbitrary or context-dependent.

  10. Subjectivism: degrees of belief are constrained only by coherence (and perhaps updating by conditioning).
      - Awkward: any coherent assignment is acceptable, so probabilities are personal and not objective.

  11. Error theory or fictionalism: objective chance talk is systematically false but useful as a fiction.
