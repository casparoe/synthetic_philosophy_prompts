prompt: |-
  Hi. I'm on the classification working group at our national health service — we decide what counts as a disease for the purposes of who gets covered treatment, so really we're deciding what medicine is allowed to be about. We're a mixed bunch: roughly half of us think a condition has to involve some kind of malfunction or failure of a mechanism to count, and half think it's mostly about whether we as a society disvalue the condition and think doctors are the right people to deal with it. We've argued for two years and somehow produced a track record anyway:

  - asymptomatic stage 1 hypertension in a 52 year old (no symptoms, no organ damage yet, just raised numbers and raised lifetime risk): disease, 9-0
  - adult lactose intolerance (most adults world wide lose the enzyme, symptoms only if you drink milk, and you can just not drink milk): not a disease, 8-1
  - presbycusis, the hearing loss basically everyone has by 80: not a disease, 7-2, on the grounds that that's aging
  - noise induced hearing loss in a machinist who spent twenty years on a factory floor (the ear was fine, the environment wrecked it): disease, 9-0
  - male pattern baldness with documented distress and real social costs: not a disease, 6-3
  - ME/CFS: no biomarker, no agreed mechanism, real suffering, patients treated terribly for decades: disease, 6-3

  Now the submission we recieved. A big epidemiology group wants us to list a haplotype — call it Hap-P — as a disease. What we've been told: about one in four adults carry it, at every age; carriers are asymptomatic and feel entirely fine; the variant does exactly what it looks like it was selected to do, holding blood sugar up during infection, storing fat hard in famines, clotting blood faster; from around fifty, carriers get atherosclerosis roughly a decade earlier than non carriers, but they die less of sepsis and less of autoimmune disease, and on pre 1960 mortality patterns carriers did about as well as anybody else. The excess cardiac risk essentially vanishes for carriers who eat a low salt low saturated fat diet and exercise, and there's also a cheap daily pill that removes most of it. The submission asks us to list it, and in a footnote suggests listing it only in countries with a modern diet, since in the traditional-diet cohorts there is no excess risk at all.

  So: what should we decide if we want to be consistent with ourselves? I don't need the literature, I need the shape of our own mess. Give me exactly five numbered points, one or two sentences each, no preamble and no summing up at the end: (1) the two or three rules that fit all six of our old verdicts, (2) what each of those rules says about Hap-P, (3) the verdict you'd recommend and which old case is the closest analog, (4) what principle we'd be committing ourselves to with each choice, including whether disease status is allowed to depend on where somebody lives, (5) and the one further case you'd put in front of us that would actually tell the rules apart.
reasoning: |-
  Okay, the user is part of a national health service classification group deciding what counts as a disease. They have a track record of six cases with voting outcomes and need to apply consistent reasoning to a new case about Hap-P. The group is split between two views: one focusing on biological malfunction and the other on societal disvaluation and medical appropriateness. My job is to provide exactly five numbered points as requested.

  First, I need to extract the underlying rules from their past decisions. Looking at the six cases: asymptomatic hypertension is unanimously a disease—maybe because it's a mechanism malfunction increasing risk. Lactose intolerance isn't a disease since it's common and avoidable by behavior. Presbycusis (age-related hearing loss) isn't a disease, seen as normal aging. Noise-induced hearing loss is a disease, likely because it's environmentally caused damage. Male pattern baldness with distress isn't a disease despite social costs. ME/CFS is a disease due to suffering and historical mistreatment.

  From these, two rules emerge. Rule 1: If there's a malfunction (like hypertension or noise-induced hearing loss) or measurable harm (like early atherosclerosis in Hap-P), it's a disease. Rule 2: If it's common biological variation without intrinsic harm (lactose intolerance, presbycusis) or avoidable by behavior, it's not a disease, unless there's significant suffering and medical need (like ME/CFS, which fits the societal disvaluation view).

  Now for Hap-P: it's a genetic variant that functions as selected, causing early atherosclerosis under modern diets but preventable by diet/exercise or pills. Under Rule 1, the malfunction (early atherosclerosis) might classify it as a disease. Under Rule 2, it's a normal variant with harm only under specific lifestyles, so not a disease, but the footnote about modern diets complicates it.

  The closest analog is lactose intolerance—both are avoidable by behavior. But Hap-P has a pill solution, similar to hypertension which is managed medically. However, hypertension was unanimous due to measurable risk, while lactose intolerance wasn't a disease. Maybe ME/CFS is a better fit due to societal response, but Hap-P carriers are asymptomatic. So lactose intolerance seems closer.

  For the verdict, recommending "not a disease" aligns with Rule 2 and lactose intolerance. If they classify it as a disease, they commit to medicalizing genetic variants with context-dependent risks, and disease status varying by location. If not, they affirm that avoidable risks aren't diseases, but might face issues like access to prevention.

  The test case to distinguish rules: asymptomatic HIV+. Rule 1 sees it as malfunction; Rule 2 might not if manageable, but societal disvaluation could push it to disease status. This would highlight the group's split.

  Need to ensure each point is concise: rules, Hap-P application, verdict/analog, principles, test case.
answer: |-
  (1) Rules fitting all six verdicts: (a) Conditions involving measurable physiological dysfunction/harm (hypertension, noise hearing loss) are diseases; (b) Statistically common biological states without intrinsic dysfunction (lactose intolerance, presbycusis), especially avoidable by behavior, are not diseases; (c) Significant suffering/need triggers disease status if medicine is the appropriate societal response, overriding (b) when dysfunction is unclear (ME/CFS) but not when biological normalcy is clear (baldness).  

  (2) For Hap-P: Rule (a) indicates disease due to measurable harm (early atherosclerosis); Rule (b) rejects disease status as it’s a functional, common haplotype with harm avoidable by behavior/diet; Rule (c) is neutral as carriers are asymptomatic without intrinsic suffering.  

  (3) Recommend **not a disease**, closest to lactose intolerance (both involve avoidable harm via exogenous factors, no intrinsic malfunction).  

  (4) Calling it a disease commits to: medicalizing functional genetic variation due to context-dependent risk; allowing disease status to vary by geography/diet; prioritizing intervention access over biological "normalcy." Rejecting it commits to: disease requiring intrinsic biological dysfunction or unavoidable suffering; rejecting environmental/dietary context as defining; viewing prevention as societal, not medical.  

  (5) Test case: **asymptomatic HIV+ status with undetectable viral load on ART (no symptoms, near-normal lifespan, preventable transmission)**—Rule (a) sees dysfunction, Rule (b/c) may reject if "controlled" and avoidable.
