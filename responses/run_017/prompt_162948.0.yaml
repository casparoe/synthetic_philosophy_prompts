  #### Principle Statement (Clause by Clause)
  **Core Principle**: An intervention by the agent constitutes a corruption of the training signal if and only if it causes the reward signal (or the process determining it) to deviate from what the principal would rationally evaluate as successful performance relative to the intended goal, given full information and sound deliberation.

  **Clauses and Motivations**:  
  1. **Intervention by the Agent**: The action must be attributable to the agent during training.  
