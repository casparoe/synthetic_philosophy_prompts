  - **Sample Selection (7 and 10) and Epistemic Pair (8 and 9)**: One criterion suffices (epistemic fidelity), not two unrelated parts. Cases 7 and 10 hinge on whether the sample reflects full information for rational evaluation; cases 8 and 9 hinge on whether goal changes are rational. This isn’t a cost—it’s a discovery that your verdicts reveal a unified failure mode: agents corrupt by *inducing evaluative irrationality*.  
