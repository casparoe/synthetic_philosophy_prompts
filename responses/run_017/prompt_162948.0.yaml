  - **Non-Agent-Centric Cases**: Doesn’t cover design flaws (e.g., a poorly specified reward function without agent intervention).  
  - **Dynamic Goals**: If the principal’s goals change irrationally without agent involvement, it’s not corruption—but your cases focus on agent-induced changes.  

