  Okay, let me start by unpacking the user's query. They're a final-year philosophy student tackling shared intention in social ontology. The main struggle is distinguishing between transparent collective actions (like moving a table together) and opaque ones (like workers in a system where the collective end isn't individually represented). They've outlined two moves: deferential authorship and the substitution test. The core questions are about what's lost if we deny shared intention in opaque cases versus attributing it to a group entity, and whether the difference is of degree or kind.

  First, I need to recall key theorists. Bratman's shared intention involves meshing subplans and mutual responsiveness. Gilbert focuses on joint commitment. Pettit and List discuss group agency. Tuomela has we-intentions. The user already grasps the paradigmatic cases and aggregate actions, so the middle ground is the issue.

  The user mentions deferential authorship. Here, an individual intends to fulfill their role without knowing the collective end. Is this a genuine we-intention? Bratman might say no because the subplans don't mesh around a shared goal. Tuomela's we-intention requires that the individual intends to do their part for the collective end. If they don't know the end, can it still hold? Maybe if they defer to the organization's goal, but it's fuzzy.

  Then there's the substitution test. If replacing a worker with someone who just follows the role for pay doesn't change the outcome, does that mean the deferential intention was irrelevant? This tests whether individual intentional states matter or if the system's structure suffices.

  The user's deeper concerns seem ontological and normative. If shared intention is only in transparent cases, how do we explain the functionality of opaque systems? But if we attribute intention to the group, are we reifying it? And what about moral responsibility? If a hospital discharge goes wrong, who's responsible if no one intended the collective outcome?

  I should address both moves. For deferential authorship, it might not meet all criteria of shared intention but captures a weaker form of collective agency. The substitution test shows that the system's structure can produce the outcome without individual buy-in, but the intentional states might affect robustness or moral responsibility.

  The degree vs. kind question is crucial. If it's a matter of degree (how much each represents the collective end), then opaque cases are partial shared intentions. If it's kind, they're different phenomena. The latter might be cleaner but risk excluding real-world examples. The former could blur important distinctions.

  Responsiveness to protocol vs. mutual responsiveness. In opaque cases, workers follow procedures, not directly respond to each other. But the protocol mediates mutual responsiveness. So perhaps it's a species, but the user questions that.

  Normative implications are key. Responsibility distribution: in transparent cases, individuals share responsibility. In opaque, it might lie with designers or the system, but individuals have role-based duties. The user likely needs this for their essay's argument structure.

  The user's unspoken need might be to position their argument within existing debates without getting bogged down in rehearsing theories. They want conceptual clarity to build their thesis, possibly on responsibility or the ontology of groups. They might also be preparing for supervision, so understanding the stakes (theoretical commitments) is essential.

  I should present options but recommend the functionalist-institutionalist view as it handles both cases without reifying groups or reducing to individuals. It accounts for structure's role in enabling collective outcomes while allowing for varying individual awareness. This aligns with Pettit/List and avoids strong group realism, which complicates intention's locus.

  Also, emphasize that mutual responsiveness is maintained through the protocol, making it a mediated form. Responsibility is distributed based on role obligations and system design. This approach keeps the concept of intention individual but acknowledges structural factors, balancing the user's concerns.
answer: |-
  You've pinpointed the core tension in social ontology regarding opaque collective action. Let's dissect the conceptual stakes of your two moves and the broader implications, cutting to the heart of what's gained or lost with each account.

  **The Core Tension: Locating the "We" in Opaque Systems**

  Your dilemma revolves around whether the *functional achievement* of a collective end via coordinated roles implies a *shared intention*, or whether it's merely *as if* there were one, achieved through a well-designed structure of individual intentions. The "losses" depend on where you locate the intention.

  **Option 1: No Shared Intention - Only Interlocking Individual Intentions + Structure**

  *   **What is Lost:** You lose the **intentional directedness towards the collective end *as such*** at the individual level. The "we" truly becomes metaphorical.
  *   **Conceptual Commitments:**
      *   **Metaphysics of Action:** You commit to a strongly **individualist** ontology. Intentions are *only* mental states of individuals. "Collective action" is reducible to the sum of individual actions causally linked by structure (rules, roles, signals) and *beliefs* about others' actions/roles (e.g., "If I do X, the system expects Y to happen next"). The *collective end* isn't intended by anyone; it's an emergent consequence.
      *   **Intention:** You preserve a **strictly internalist, cognitively demanding view** of intention. An agent must mentally represent the *specific state of affairs* they intend to bring about. "Unloading the ship" isn't represented by the crane operator who only intends "to move container A to spot B as per the schedule."
      *   **Responsibility:** Responsibility is primarily **role-based and causal.** Individuals are responsible *for performing their specific role correctly* (or negligently). Responsibility for the *collective outcome* is diffuse:
          *   It might lie heavily with the *designers* of the system/protocol.
          *   It might lie with *supervisors* who monitor the system's overall function.
          *   Individual participants bear responsibility *only* for their specific contribution *if* it deviated and caused a failure, but not for the *collective end itself* as something they *aimed* for. (e.g., The orderly moving the patient bears responsibility if they drop them, but not for the successful discharge *as a collective achievement* they intended).
  *   **Strengths:** Avoids reifying groups or stretching "intention" beyond recognition. Cleanly explains how complex collective ends can be achieved without cognitive overload on individuals. Fits neatly with methodological individualism.
  *   **Weaknesses:** Struggles to capture the *distinctive normative structure* and *robustness* often seen in even opaque systems. Why do participants often feel a *specific obligation* to "keep the system running" beyond just their paycheck? Why do they correct minor deviations in others' role-performance? This view risks reducing organized collective action to a complex machine where humans are mere cogs.

  **Option 2: Shared Intention Located in the Group Entity**

  *   **What is Lost:** You lose the **direct connection between individual agency and the collective intention.** The group intention becomes a distinct ontological item, potentially detachable from the specific mental states of its current members.
  *   **Conceptual Commitments:**
      *   **Metaphysics of Action:** You commit to a **non-reductive or strongly realist view of groups.** Groups (organizations, institutions) are agents *sui generis*, capable of possessing intentions, beliefs, and decision-making capacities *distinct* from their members. The intention "to unload the ship" belongs *to the port authority* or *the hospital system* itself.
      *   **Intention:** You radically broaden the concept of intention, decoupling it from *individual consciousness*. Group intention is fixed by the group's **decision procedures and functional roles** (e.g., the protocol, the organizational chart, the official mandate). The crane operator's individual intention ("move container A") is now understood as their *participation in* or *execution of* the group's intention.
      *   **Responsibility:** Responsibility for the collective outcome attaches **primarily to the group agent itself**. This has significant implications:
          *   The *group* can be held responsible (e.g., sued, blamed) as a single entity.
          *   *Individual* responsibility becomes derivative: members are responsible *to* the group for fulfilling their role, or *as representatives* of the group when acting within their role. Their responsibility for the *collective end* flows from their membership/role in the group agent that *did* intend it. (e.g., The hospital is responsible for the discharge; the orderly shares in that responsibility *because* they are part of the hospital system executing its intention).
  *   **Strengths:** Provides a clear locus for the collective end as *intended*. Explains the distinctive normative force ("we *have to* get the ship unloaded") and robustness (the intention persists through member turnover). Captures how we *attribute* intentions to organizations ("The company intends to expand into Asia").
  *   **Weaknesses:** Faces the **"mystery" objection**: How does this group mind/intention *exist* and *cause* actions without being reducible to individual minds? Risks obscuring individual agency and moral responsibility ("I was just following orders/the protocol").

  **Addressing Your Specific Moves & Questions:**

  1.  **Deferential Authorship:** This leans towards the *group agent* view but tries to ground it weakly in individuals. The problem is its **instability**:
      *   *Against Individualism:* The "whatever it is this organisation is doing" intention seems too thin and non-specific to constitute intending the *actual collective end* (unloading the ship). It looks more like an intention *to be guided by* the system, plus a belief about the system's function.
      *   *Against Group Realism:* It still locates *something* intentional in the individual, making the group intention seem less fundamental.
      *   **Verdict:** It risks doing violence to *both* concepts. It stretches individual intention too far while not fully embracing group agency. It's often a sign the phenomenon might be better explained by Option 1 + robust structure.

  2.  **Substitution Test:** This is a powerful tool *for the individualist view*.
      *   If substituting a purely wage-motivated but role-compliant actor changes *nothing observable* in the system's functioning or the achievement of the collective end, it strongly suggests the "deferential intention" (or any robust "we-intention") **is not causally necessary** for the collective action *in this opaque context*. The structure (roles, rules, monitoring, incentives) is doing all the work of coordination. The individual's mental state regarding the collective end is epiphenomenal to the outcome.
      *   **Loss:** This test highlights what is lost if you insist on shared intention in opaque cases: **explanatory parsimony.** If the structure alone *guarantees* the meshing and the outcome regardless of the specific intentional content beyond role-compliance, positing an additional layer of shared or group intention becomes explanatorily redundant for *how the action is performed*. Its value might lie elsewhere (e.g., in justifying responsibility attributions or capturing phenomenology).

  3.  **Transparent vs. Opaque: Degree or Kind?** This is **fundamentally a difference in kind** concerning the *locus and structure of the intention*, not merely how much each knows.
      *   **Transparent (Paradigm):** Shared intention is *constituted by* a specific, interlocking web of individual intentions, beliefs, and mutual responsiveness *directed at the joint activity itself*. The "we" is built from the ground up by the participants' mutual understandings.
      *   **Opaque (System):** The collective end is intended *either* not at all (Option 1) *or* by a distinct group agent (Option 2). Individual participants primarily intend *their specific role-performance*, guided by the system's rules. Their connection to the collective end is *mediated* by the institutional structure, not by direct mutual recognition and commitment. The "we" is either absent (Option 1) or imposed top-down by the system (Option 2).

  4.  **Responsiveness to Protocol vs. Mutual Responsiveness:**
      *   In the transparent case, mutual responsiveness is **direct and interpersonal** (I adjust *because I see/hear/know what you are doing and intending*, and vice versa).
      *   In the opaque case, responsiveness is **mediated by the protocol**. I respond to *the system's signals, rules, and my defined role*, which *happen* to be triggered by your actions (also dictated by the protocol). I'm not directly responsive to *you* as a co-participant in *our* shared goal, but to the *system's representation* of required actions. It's **mimicry** enabled by the structure, not genuine mutual responsiveness grounded in a shared intention. It's responsiveness *to the same thing* (the protocol/system state), not *to each other*.

  **Recommendation: Which Does Least Violence?**

  **The Functionalist/Institutionalist Individualism (Option 1, refined) does the least violence to the core concept of *intention* as a mental state of individuals.**

  *   **Why:** It preserves the crucial link between an agent's intention and their *mental representation of the goal state*. It avoids the ontological mystery of group minds. It explains opaque collective action through robust structures coordinating individually represented role-intentions and expectations, without needing each agent to intend the complex collective end. This respects the cognitive constraints of individual agents in complex systems.
  *   **Mitigating the Losses:** To address the "normative structure/robustness" concern without reifying groups:
      *   Frame the *structure/protocol itself* as embodying the "collective intention" in a *dispositional or functional sense* (it was designed to achieve E, and functions to coordinate towards E).
      *   Individual participants often have a *derivative* intention: "to do my part *because that's what this system, designed to achieve E, requires of me*." This acknowledges the systemic context without requiring them to intend E directly.
      *   Responsibility for the *system's function and outcome* attaches strongly to designers, supervisors, and the institution *as a legal entity*, while individual participants retain role-based responsibility.

  **What Hangs on the Choice (The Stakes):**

  1.  **Metaphysics of Social Reality:** Are groups real agents with their own intentions (Realism), or are they useful fictions summarizing complex patterns of individual attitudes and actions (Individualism)?
  2.  **Theory of Intention:** Is intention fundamentally tied to individual consciousness and representation, or can it be a functional property of organized systems?
  3.  **Theory of Action:** What constitutes *acting together*? Is it the interlocking of individual intentional states oriented towards the joint activity, or is it participation in a system functionally organized to produce a collective outcome?
  4.  **Moral Responsibility:**
      *   *Individualist View:* Responsibility for collective outcomes is primarily distributive based on individual contributions, roles, knowledge, and causal efficacy. Blame/praise focuses on individual actions within the system. The "system" might be blamed for design flaws, but this is shorthand for blaming the designers/supervisors.
      *   *Group Agent View:* The group bears primary responsibility *as the agent* that intended the outcome. Individual responsibility is largely about fulfilling one's role *within* the group's intentional framework. Holding the *group* responsible becomes fundamental.
  5.  **Explanation of Robustness & Normativity:** How do opaque systems maintain coordination through member turnover and induce specific obligations? The Individualist points to the *structure* (rules, sanctions, training). The Group Agent points to the *persisting intention and agency* of the group itself.

  **Conclusion:** For your essay, committing to the **Functionalist/Institutionalist Individualist** view allows you to acknowledge the systematic achievement of collective ends in opaque cases while preserving a clear, cognitively grounded concept of individual intention and avoiding controversial group ontology. It forces a nuanced discussion of how *structure* substitutes for mutual knowledge and direct responsiveness, and leads to a more distributed, role-based account of responsibility. The cost is accepting that "shared intention" in its robust, Bratmanesque sense is absent here, replaced by sophisticated institutional coordination. The alternative (Group Agent) is coherent but requires significant ontological commitments and stretches the concept of intention in ways that may be less defensible within a philosophy of action grounded in individual agency. Your substitution test strongly supports this individualist-functionalist line. The difference is one of kind, centered on the locus and constitutive structure of the intention driving the collective action.
