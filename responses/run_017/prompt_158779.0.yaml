          - In Bayesian terms, the old evidence (the 50 zeros) is certain. So for any theory that predicts the old evidence (which both do), the likelihood P(old evidence | theory) = 1. And the prior probability of the evidence is 1 (since it's certain). So the update factor is 1. Therefore, the old evidence does not change the probability of the theory.

          - So why might we trust the sealed theory more? Because of our prior about the theory? The bonus in the game is like a higher prior for the sealed theory.

     3. **Prediction vs. accommodation**:
          - The sealed theory made a prediction (about the old evidence) before seeing it, while the accommodating theory was made after. 
          - But in the update, that doesn't matter because the evidence is already known.

     4. **The dividend as a stand-in for prior probability**:
          - We added a bonus for sealed theories. This is like having a higher prior probability for them. In a Bayesian update, if we start with a higher prior for the sealed theory, then even after seeing the old evidence (which doesn't change anything), the sealed theory has a higher posterior.

     5. **What the game couldn't capture**:
          - In the problem of old evidence, the evidence is certain, so it shouldn't change the probability. In the game, we could not directly show that update because we didn't have participants doing a full Bayesian update with priors and likelihoods. Instead, we used a bonus to simulate the idea that sealed theories might be more reputable.

     ### What might go wrong:

     - Participants might not engage with the bonus: They might only care about the prediction and not the sealed bonus. But we announced the bonus, so they should care about whether they have a sealed theory.

     - The Rule 2 (change at 51) might be obviously bad, and participants might not take it seriously. But we hope that some will because they think it might be sealed? Or because they think it's possible.

     - Time: The distribution of envelopes and writing probabilities might take more time.

     - The next draw is 0, which makes Rule 2 look bad. But that's to show overfitting.

     - In the debrief, they might not see the connection to the problem of old evidence. We have to carefully guide them.

     ### The part I'm least confident in:

     I'm least confident that the bonus (old-evidence dividend) will be seen as analogous to the prior probability in the Bayesian update. Participants might see it as an arbitrary game rule and not connect it to the philosophical problem. We will have to emphasize that in the debrief.

     Given the constraints, we go with this design.

     ### Materials list:

     - Projector and computer to show the sequence of 50 zeros.
     - A box with at least 51 tickets, all zeros (or a fixed box with zeros, and we draw from it).
     - 14 envelopes: 
          7 sealed envelopes (with a seal that can be broken) containing a card with Rule 1: "The box contains only 0's. The next draw will be 0."
          7 unsealed envelopes containing:
               - 4 with Rule 1: "The box contains only 0's. The next draw will be 0."
               - 3 with Rule 2: "The box has produced only 0's for the first 50 draws, but the next draw (51st) will be 1."
     - A list for the facilitator: which envelopes are sealed and which are not.
     - Paper and pens for participants to write their probabilities.

     ### Payoff scheme:

     - Each participant writes a probability p (for the next draw being 1).
     - Outcome o (0 or 1).
     - Brier score component: 1 - (p - o)^2. Since o=0, this is 1 - p^2.
     - Bonus: 10 if the theory is sealed.
     - Total = 1 - p^2 + (10 if sealed)

     Example: 
          If a participant with a sealed theory sets p=0.2, then score = 1 - (0.2)^2 + 10 = 1 - 0.04 + 10 = 10.96.
          If a participant with an accommodating theory (and Rule 1) sets p=0, then score = 1 - 0 + 0 = 1.
          If a participant with Rule 2 (accommodating) sets p=0.9, then score = 1 - (0.9)^2 = 1 - 0.81 = 0.19.

     We can scale the Brier score component to be out of 10? To make the numbers nicer. 

     Let me set: 
          Prediction score = 10 * [1 - (p-o)^2]
          Bonus = 10 if sealed.
          Total = 10 - 10*(p-o)^2 + [10 if sealed]

     Then the sealed participant with p=0.2: 10 - 10*(0.04) + 10 = 10 - 0.4 + 10 = 19.6.
     The accommodating with p=0: 10 - 0 = 10.
     The accommodating with p=0.9: 10 - 10*(0.81) = 10 - 8.1 = 1.9.

     We can announce the scoring as: 
          "Your prediction score is 10 times (1 minus the squared error of your probability for the outcome being 1). Then, if your theory was sealed, you get an extra 10 points."

     This design is runnable and meets the constraints.
