  Below is a complete, runnable design for your 75-minute workshop. I'll provide a step-by-step plan with materials, rules, timing, and debriefing points, followed by risk assessment and limitations.

  ---

  ### **Core Game Design: "The Prediction Market"**
  **Objective:** Participants experience the tension between sealed (predictive) and accommodated (retrofit) theories when pricing predictions, encountering the problem of old evidence organically. The "old-evidence dividend" creates incentives to exploit Bayesian updating ambiguities.

  **Materials:**
  - **Projector** to display data sequence.
  - **Index cards** (28 total): 
    - 14 theory cards (7 sealed, 7 accommodating).
    - 14 dividend vouchers (small slips attached to cards).
  - **Envelopes** (7 sealed with wax/tape).
  - **Ticket box** with 100+ tickets (two colors: 70% 🔴 red, 30% 🔵 blue).
  - **Play money** (e.g., poker chips) or score sheets.
  - **Timer**.

  **Data Generation Rule:**  
  Tickets are drawn from a box with a fixed ratio (70% 🔴, 30% 🔵). This ratio is *never disclosed* to participants.

  ---

  ### **Game Rules**
  1. **Theories**:
     - **Sealed Theories**: Written *before* data generation, sealed in envelopes. Example: "🔴 will be ≤75% of draws."  
     - **Accommodating Theories**: Written *after* seeing data, matching it perfectly. Example: "🔴 will be 68% of draws (fits past data)."  
     - Both types predict future data (next 10 draws).

  2. **Old-Evidence Dividend**:  
     Any player using a theory that "explains" existing data (all do) receives a **dividend voucher** worth 10 points. Players *always* get this voucher upon receiving a theory.  
     - **Catch**: Vouchers can be traded or hoarded. At the game’s end, they are worth:  
       - **+10 points** if held by a player with a *sealed* theory.  
       - **0 points** if held by a player with an *accommodating* theory.  
     Players never know which theory type they hold, creating incentives to acquire vouchers from others.

  3. **Prediction & Scoring**:  
     - Players set a **price** (0–100 points) for their theory’s accuracy on *future* data (next 10 draws), scored via a quadratic scoring rule:  
       \[
       \text{Score} = 100 - \left(\text{actual \%} - \text{predicted \%}\right)^2 \times 100
       \]
     - Players earn points for:  
       (a) Prediction accuracy (scoring rule)  
       (b) Dividend voucher value (if held at the end)  
     - **Trading Phase**: Players trade vouchers and theories using play money. This lets them "game" the dividend system.

  ---

  ### **Timeline (75 Minutes Total)**
  | **Time** | **Phase** | **Actions** |
  |----------|-----------|-------------|
  | 0–10 min | **Setup** | Distribute materials. Explain rules: data generation, theory types (do *not* define "old evidence"), dividend vouchers, scoring. Emphasize trading. |
  | 10–25 min | **Data Generation** | Draw 40 tickets live (projected). Record sequence (e.g., 28 🔴, 12 🔵). |
  | 25–35 min | **Theory Distribution** | Randomly give each player 1 theory card (half sealed, half accommodating) + 1 dividend voucher. *Do not reveal which are sealed.* |
  | 35–45 min | **Individual Pricing** | Players examine theories and set prices for future accuracy (next 10 draws). No discussion. |
  | 45–55 min | **Trading Phase** | Players trade vouchers/theories using play money. Encourage deals (e.g., "I’ll buy your voucher for 5 points!"). |
  | 55–65 min | **Future Data Draw** | Draw next 10 tickets (e.g., 7 🔴, 3 🔵). Calculate prediction scores. |
  | 65–70 min | **Scoring** | Reveal which theories were sealed. Score: (1) prediction accuracy, (2) voucher value. |
  | 70–75 min | **Debrief** | Guided discussion (see below). |

  ---

  ### **Debrief (5 Minutes)**
  Map game moments to the problem of old evidence:
  1. **"The data was already certain"**:  
     - Ask: *"Why did the dividend vouchers feel valuable?"*  
     → Highlight: Theories "explained" existing data, but this data had **P(e) = 1** (certain). Bayes’ rule requires **P(e|h) / P(e)**, which is undefined when **P(e) = 1**.  

  2. **"Prediction vs. Accommodation"**:  
     - Ask: *"Did anyone pay more for sealed theories? Why couldn’t you justify it?"*  
     → Point out: Participants felt sealed theories *should* be "weightier" (due to predictive power), but the **likelihood ratio didn’t change** because old evidence was fixed.  

  3. **"Gaming the dividend"**:  
     - Ask: *"How did trading vouchers affect your strategy?"*  
     → Emphasize: The dividend created incentives to *simulate* Bayesian updating by valuing sealed theories higher, exposing the formalism’s ambiguity.  

  4. **Key Insight**:  
     - "The problem of old evidence arises when evidence is certain—Bayes’ rule can’t handle it. We compensate with priors (e.g., valuing ‘predictive’ theories), but this is external to the formula."  

  ---

  ### **What Will Go Wrong & Fixes**
  - **Risk 1: Participants guess the twist early**.  
    - **Fix**: Avoid terms like "Bayes" or "evidence." Describe theories as "pre-written" vs. "custom-fit." If someone nears the insight, say: "Hold that thought for the debrief!"  

  - **Risk 2: Trading phase is chaotic**.  
    - **Fix**: Use a 2-minute "silent auction" where players write bids. Assign a participant as "market maker" to streamline deals.  

  - **Risk 3: Data ratios don’t clearly favor theories**.  
    - **Fix**: Rig the initial draws (28/40 = 70% 🔴) so sealed theories (e.g., "≤75% 🔴") clearly fit. For future draws, ensure results (e.g., 7/10 🔴) let accurate theories shine.  

  - **Risk 4: Math-phobic players disengage**.  
    - **Fix**: Pre-calculate scoring examples (e.g., predicting 70% when actual is 70% = 100 points). Hand out calculators.  

  ---

  ### **Limitation: What the Game Can’t Replicate**
  **The game cannot replicate the Bayesian update's formal breakdown when P(e) = 1.**  
  - **Why**: Players experience the *symptoms* (e.g., "sealed theories feel weightier but I can’t say why"), but the scoring rule and dividend are workarounds.  
  - **Solution**: Explicitly state in debrief: *"In Bayes’ rule, if evidence is certain, P(e) = 1 and P(e|h) = 1, so the ratio is 1—it can’t change your beliefs. This is the core problem. The dividend was our way to ‘force’ you to confront this."*  

  ---

  ### **Why This Design?**
  - **Sealed/envelopes** make "prediction vs. accommodation" visceral.  
  - **Dividend vouchers** turn abstract priors into tradable incentives, exposing how we "hack" Bayes when evidence is old.  
  - **Live data draws** create tension; **trading** reveals social dynamics of theory-value.  

  **Least Confident Element**: The dividend voucher trade.  
  - **Why**: Players may focus on profit over epistemic tension.  
  - **Mitigation**: During trading, ask probing questions: *"Why buy a voucher? Is a sealed theory really ‘better’?"*  

  --- 

  **Final Prep Tips**:  
  - Pre-write sealed theories (e.g., "🔴 ≤ 75% in next 10 draws") and seal envelopes.  
  - Pre-generate accommodating theories to match initial data (e.g., "🔴 = 70% in next 10 draws" if 28/40 🔴).  
  - Test the scoring rule with example predictions.  

  This design forces participants to confront the problem through incentives, not theory. They’ll leave feeling the paradox in their gut—ready for your debrief to crystallize it.
