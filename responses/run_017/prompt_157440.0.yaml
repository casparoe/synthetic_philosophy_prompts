answer: |-
  Here’s a decision tree focusing on the *jobs* the LOT might perform, with explicit "messy bits" and unoccupied positions. Branches use neutral questions, leaves highlight awkward commitments, and unresolved tensions are named.

  ---

  **Cognition is computation over representational vehicles. What is the PRIMARY job requiring structure?**  
  *(Follow only one primary path; hybrid views exist but simplify here)*

  1. **Ensure systematicity/productivity?**  
     *(Can thoughts combine predictably?)*  
     → **Yes** → **Do representations have reusable, context-independent constituents?**  
        *(e.g., symbols with combinatorial syntax/semantics)*  
        → **Yes** → **Where do structured representations first appear?**  
            → **Only in central cognition (belief, reasoning)** → **Classical Symbolic Core**  
               *Awkward: Requires innate primitive concepts for all human-learnable content.*  
            → **In perception/imagery/navigation too** → **Ubiquitous Syntax**  
               *Awkward: Demands structured perceptual formats that avoid "homunculus" regress.*  
        → **No (content is holistic)** → **Unnamed?**  
           *Why empty? Likely incoherent: systematicity seems to require recombinable parts.*  

     → **No** → Skip to Q2 or Q3.

  2. **Ground intentionality/content?**  
     *(How can mental states be *about* things and sometimes *wrong*?)*  
     → **Yes** → **Can distributed/vector representations satisfy LOT requirements?**  
        *(i.e., are they sufficiently compositional?)*  
        → **Yes** → **Distributed LOT**  
           *Awkward: Explaining misrepresentation without discrete symbols is notoriously tricky.*  
        → **No** → **Atomistic Symbols**  
           *Awkward: Leaves perception/action as "non-cognitive" or in need of separate explanation.*  

     → **No** → Skip to Q3.

  3. **Model conscious reasoning?**  
     *(Does thinking "feel like" manipulating symbols?)*  
     → **Yes** → **Is the vehicle sometimes a public language sentence?**  
        → **Yes** → **Overt Speech as Vehicle**  
           *Awkward: Can’t explain non-verbal planning or abstract thought without covert symbols.*  
        → **No** → **Inner Speech as Format**  
           *Awkward: Requires unconscious translation to/from amodal symbols for conceptual precision.*  
     → **No** → Proceed to...

  ---

  **Secondary Split (if no primary job requires LOT):**  
  **Does thought *need* structured representations *at all*?**  
  → **Yes** → **Must the format be propositional?**  
     → **No (e.g., map-like formats allowed)** → **Compositional Maps**  
        *Awkward: Struggles to explain truth-conditional logic without propositional glue.*  
     → **Yes** → Rejoin "Ubiquitous Syntax" or "Classical Symbolic Core" (depending on scope).  
  → **No** → **Anti-Representationalism**  
     *Awkward: Must explain complex planning or offline reasoning without stored structure.*  

  ---

  ### Messy Bits & Unoccupied Nodes:
  1. **The Blurry Boundary:** "Distributed LOT" vs. **Interpreted Connectionism** (a leaf not shown).  
     *Why inseparable?* If vectors are *interpreted* as compositional but lack explicit syntax, is it LOT? Depends on whether "computation over vehicles" requires formal syntax.  

  2. **Unoccupied Combinations:**  
     - **Holistic + Grounds Intentionality (Q2→No reusable parts):** *Unnamed*. Why empty? Likely **incoherent**—holism struggles with misrepresentation (e.g., if all content changes together, how can a state be *specifically* wrong?).  
     - **Systematicity + Public Language Vehicles (Q1→Yes + Q3→Yes):** *Unnamed*. Why empty? **Unattractive**—public language depends on prior systematic thought (per Fodor), making it circular.  
     - **Conscious Reasoning + No Inner Speech (Q3→Yes→No):** *Unnamed*. Why empty? **Unwritten**—possible (e.g., pure imagistic reasoning) but rarely defended; most LOT opponents go straight to anti-representationalism.  

  ---

  ### Tree Summary:
  - **Branch Nodes (7):** Primary Job (3 options) → Constituents? → Scope? → Distributed OK? → Public Language? → Need Structure? → Propositional?  
  - **Leaves (7):** Classical Symbolic Core, Ubiquitous Syntax, Distributed LOT, Atomistic Symbols, Overt Speech, Inner Speech, Compositional Maps, Anti-Representationalism.  
  - **Key Design:** Forces user to prioritize LOT’s *role*. A view (e.g., connectionism) may be LOT-like for intentionality (Distributed LOT) but not systematicity (rejects reusable parts).  

  This emphasizes functional splits over schools, exposes underdefended positions, and flags where distinctions collapse (e.g., distributed representations). Use arrows/boxes in your handout for clarity!
