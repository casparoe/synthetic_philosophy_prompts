  Hi—I’m a retired chemist who’s recently gotten into philosophy of science, so forgive me if I mangle the jargon (and if I mispell ‘confirmation’). I’ve been chewing on Hempel’s raven paradox and I want to go past the pop-science version. You are a professional philosopher of science and an expert on confirmation theory and Bayesian epistemology. Please think carefully and don’t just rush to the standard answer: start by brainstorming for a few minutes and list the different precise things someone might mean by ‘confirmation’ or ‘evidence’ (posterior probability going up, likelihood ratio / Bayes factor, instance confirmation, entailing the hypothesis, narrowing the space of possible worlds, etc.). Then use that list to answer me.

  Here’s the setup I’m stuck on. The headline paradox I think I get: we want to test the hypothesis H: ‘all ravens are black’. Logically that’s equivalent to its contrapositive: ‘all non-black things are non-ravens’. Nicod’s criterion—the roughly idea that only observations of actual ravens (or only instances of the antecedent that are also instances of the consequent) should matter, while non-black non-ravens are irrelevant—clashes with the equivalence condition, which says that if some evidence supports a hypothesis it supports every logically equivalent statement too. Bayesians usually say the damn green apple (a non-black non-raven) really is evidence for H, but the likelihood ratio is tiny because there are vastly more non-black objects in the world than ravens.

  But I made up a finite twist to try to break that ‘tiny’ answer, and I can’t tell if I’ve found a real insight or just confused myself. Imagine a toy universe with exactly 100 objects. I tell you in advance: 10 objects are black and 90 are non-black; exactly 5 of the 100 objects are ravens; and the non-black objects are things like green apples, blue socks, etc. You sample objects at random without replacement and examine them. Here’s the sequence: you examine 89 of the 90 non-black objects and confirm that none of them is a raven. Now there is exactly one non-black object left unexamined. According to the contrapositive/instance idea, the observation of that last non-black object—if it turns out to be, say, a green apple and therefore not a raven—is a non-black non-raven instance.

  My questions: In this finite-urn, sampling-without-replacement setup, does that last observation confirm ‘all ravens are black’ to a substantial degree rather than an infinitesimal one? Roughly what likelihood ratio or Bayes factor are we talking about for the last observation, given what I said about the counts? More importantly, I have a felling the answer depends on the difference between total evidence and incremental evidence, and on how many unexamined non-black objects are left. When I had already checked 89 non-black objects and found no raven, hadn’t I already learned almost everything? Is the confirmation from the earlier 89 observations spread out unevenly, so that the first non-black non-raven is nearly worthless but the last one is decisive? And once I finally check the last non-black object and see it is not a raven, does the evidence now entail H (given the background counts), or does it merely confirm it? If it entails H, what does that show about the equivalence condition and Nicod’s criterion in finite domains? Also, what happens to the standard ‘tiny because non-black things outnumber ravens’ line if I change the setup: suppose I do NOT know in advance that there are exactly 90 non-black objects, or suppose I only know ravens are rare, or suppose I sample with replacement from an infinite population? Which of my assumptions (finite universe, known exact counts, sampling without replacement, having already examined 89 of the non-black objects) is doing the real philosophical work, and why?

  Please explain the conceptual issue: what exactly is being confirmed, in which sense of confirmation, and how the equivalence condition, Nicod’s criterion, and Bayesian updating interact here. Be careful about the difference between confirming ‘all ravens are black’ and merely failing to disconfirm it, and between the total evidence and the incremental evidence supplied by one more observation. I’d also like you to tell me which of my assumptions is doing the philosophical work. Write as if to a smart but jargon-averse beginner; I’m comfortable with basic probability but new to philosophy. There’s no need for citations, bibliographies, or reading lists—just explain the moving parts. Take your time and make sure your brainstorming actually shapes the answer.
