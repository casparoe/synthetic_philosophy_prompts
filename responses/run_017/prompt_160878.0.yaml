answer: |-
  Here's a breakdown of how the major Sorites responses handle resolution drift, scored per your criteria:

  1.  **Epistemicism: 10/100**  
      *Justification:* Treats borderline cases as unknowable but sharp facts, failing to explain the *movable width* of the band or its purpose-sensitivity; clear case confidence stems only from knowing you're outside the *fixed* band of ignorance.  
      *Locates Drift In:* Use (denies semantic indeterminacy).

  2.  **Supervaluationism: 40/100**  
      *Justification:* Accommodates clear cases (true/false on all precisifications) and borderline instability (true on some, false on others), but the *range* of acceptable precisifications (defining the borderline band) is typically seen as fixed, not shifting with conversational purpose.  
      *Locates Drift In:* Primarily semantic content (indeterminacy), though use might select precisifications *within* the fixed range.

  3.  **Subvaluationism: 45/100**  
      *Justification:* Similar to supervaluationism: handles clear cases (false/true on all) and borderline instability (true *and* false on some), but struggles to explain why the *width* of the band requiring paraconsistent valuation shifts contextually based on purpose.  
      *Locates Drift In:* Primarily semantic content (glutty indeterminacy), with use possibly affecting the scope.

  4.  **Degree Theories / Many-Valued Semantics: 70/100**  
      *Justification:* Explicitly models the borderline zone with partial truth values and can naturally incorporate context-dependent *selection of the threshold* (e.g., what degree counts as "tall" *now*), directly accounting for the movable band width and purpose-sensitivity; clear cases have extreme values (0 or 1).  
      *Locates Drift In:* Semantic content (the threshold defining the extension is context-sensitive).

  5.  **Contextualism: 85/100**  
      *Justification:* Builds context-sensitivity directly into the semantics, allowing the *meaning* (and thus the extension/borderline band) of the predicate to shift based on conversational standards, which are often purpose-driven; naturally explains both clear case confidence (standards settled) and movable borderline width (standards adjustable).  
      *Locates Drift In:* Semantic content (the context-sensitive meaning determines the extension/borderline).

  **Revision if Drift is Ordinary Context-Sensitivity:**  
  If resolution drift is fundamentally the same context-sensitivity as in "flat" or "empty," the score for **Contextualism (85)** would be revised most sharply **upward to 95/100**. Its core mechanism *is* modeling vague predicates via the same type of context-sensitivity granted to "flat" and "empty," making drift its central explanatory target. Other theories (especially Epistemicism, Super/Subvaluationism) are less inherently equipped for this specific kind of flexibility.
