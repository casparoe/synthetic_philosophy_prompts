  Also, top-level: guest_position (string <=60 words), sequencing_notes (3-4 sentences).

  Let's write the guest_position:

  "Dr Halvorsen defends asymmetric eliminative materialism: belief-talk will evaporate because folk platitudes fragment across neural kinds without reduction, while desire-talk survives via neurobiological reward systems. Belief is replaced by intervention-profiles: dispositional responses to interventions. Folk psychology's regularities are artefacts of coarse-grained partitioning, not approximations of laws."

  Now, sequencing_notes:

  "The interview begins with the granularity argument's scope to test its generality, then challenges the view's handling of folk psychology's success and the analogy to superseded sciences. It then presses on the fragmentation claim and the asymmetry, followed by self-reference. Her stock reply becomes unavailable early because the first questions avoid belief-desire terms. By the third question, we force her to engage with fragmentation without retreating to the old idiom. By the sixth question, on misrepresentation, she must use her own framework to explain a critical distinction, and the follow-ups close off deflection. The final question on falsifiability demands a concrete empirical condition."

  Now, let's draft the nine questions.

  Question 1 (block: scope):
  question: "Your granularity argument says folk psychology breaks down at fine grain. But doesn't this overgeneralise to other special sciences, like ecology, which also use coarse-grained regularities?"
