  - Another on predictive success to deepen the challenge about the analogy with superseded theories.

  - Another on elimination vs reduction to press on the fragmentation issue.

  - Another on asymmetry to test the distinction between misrepresentation and unusual aims.

  But we must also cover the requirement that at least one per block. We can have:

  Block breakdown:

  - scope: at least one (on granularity and overgeneralization)
  - predictive-success: at least one (on the success of folk psychology and the analogy)
  - elimination-versus-reduction: at least one (on fragmentation vs reduction)
  - asymmetry: at least one (on the asymmetry and the misrepresentation issue)
