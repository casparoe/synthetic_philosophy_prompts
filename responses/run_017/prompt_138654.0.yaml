  We'll plan the nine questions:

  1. Scope: Start with granularity and overgeneralization to other special sciences. This sets the stage and is in her own terms.

  2. Predictive-success: Then question the success of folk psychology and the analogy with superseded theories.

  3. Elimination-versus-reduction: Then challenge the evaporation vs reduction.

  4. Asymmetry: Then the asymmetry.

  5. Self-reference: Then the self-reference challenge.

  6. Falsifiability: Then what evidence would falsify.

  But we need three more. We can have:

  7. A second question on asymmetry, pressing on the misrepresentation issue (since the first asymmetry question might be more general).

  8. A second question on elimination-versus-reduction, about what belief refers to now.

  9. A second question on predictive-success, about whether the superseded theories had rivals that explained their success.

  Alternatively, we can interleave to build pressure.

  Sequence to block her stock move:

  - Early questions (1-3) are framed in her own vocabulary and do not use belief-desire terms. She cannot use the stock reply because the question isn't in that idiom.

  - Middle questions (4-6) might be framed in a way that forces her to address the phenomena without using the old terms, but they might still be about belief-desire phenomena. We must be careful.

  - Later questions (7-9) are designed to be inescapable: they force her to either use her own framework to answer or admit a problem.

  Specifically, we design the follow-ups to close off the escape. Each question has a follow-up that is written against her anticipated answer.

  We'll design:

  Question 1: Scope (granularity overgeneralization)
  Question 2: Predictive-success (folk psychology success and the analogy)
  Question 3: Elimination-versus-reduction (fragmentation leading to evaporation)
