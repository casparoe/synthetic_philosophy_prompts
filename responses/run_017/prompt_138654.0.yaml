  evasion_check: If she says that folk psychology is uniquely problematic without explaining why.

  Question 2 (block: predictive-success):
  question: "Folk psychology has substantial predictive success. How does your view account for this, given your analogy to superseded astronomical theories?"
  target: "The analogy might backfire because superseded theories (like Ptolemy's) had rivals that explained their success, but folk psychology currently lacks such a rival, so its success might indicate truth."
  anticipated_answer: "Folk psychology's success stems from its coarse grain capturing behavioural patterns, not because it tracks reality. As with Ptolemy, future neuroscience will explain why it worked, without preserving its ontology."
  follow_up: "But Ptolemaic astronomy had a clear rival in Copernicanism that explained its success. What current rival explains folk psychology's success in your terms?"
  evasion_check: If she avoids naming a current rival or shifts to future neuroscience without specifying.

  Question 3 (block: elimination-versus-reduction):
  question: "When folk platitudes about belief fragment, why call it referential evaporation rather than a disjunctive or pluralist reduction?"
  target: "Fragmentation doesn't necessarily entail evaporation; it might allow for a disjunctive kind, preserving reference. Evaporation seems an extra, non-empirical step."
  anticipated_answer: "Reduction requires a single kind that satisfies the platitudes. Fragmentation means no such kind exists; the platitudes are split among distinct neural states, so the term 'belief' becomes empty."
  follow_up: "But if we can define a disjunctive kind that plays the belief-role, why isn't that a reduction? Must reduction be to a single neural kind?"
  evasion_check: If she insists on a single kind without justifying why disjunctions are excluded.

  Question 4 (block: asymmetry):
  question: "Why should desire survive as a valence state while belief evaporates? What protects desire from similar fragmentation?"
  target: "The asymmetry seems arbitrary without evidence that desire's neural basis is unified and belief's isn't, especially since both are folk concepts."
  anticipated_answer: "Desire's neural basis in reward/aversion systems is already identified and unified, unlike belief which has no such home and fragments. Valence states are a natural kind."
  follow_up: "But if future neuroscience shows that 'reward' fragments into multiple systems without a common function, would you then eliminate desire too?"
  evasion_check: If she dismisses the hypothetical or fails to engage with the possibility.

  Question 5 (block: self-reference):
  question: "If asserting involves representing the world as being a certain way, how do you assert your view without beliefs that might be true or false?"
  target: "The view seems self-undermining because it must use the very notion (assertion) that it eliminates, creating a performative contradiction."
