  - question (the actual question, <=45 words, British English)
  - target (the worry and why it bites, 1-2 sentences)
  - anticipated_answer (her likely reply, 2-3 sentences)
  - follow_up (the next question to ask, which closes off the easiest escape, written against that reply)
