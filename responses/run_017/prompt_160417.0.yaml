answer: |-
  Below is a complete, runnable classroom game designed to meet your objectives. It focuses on experiential learning with minimal upfront explanation, using poker chips, cards, and envelopes. The game has three rounds, each illustrating one of your key points. Debrief ties each round to the concepts.

  ### **Game Overview**
  - **Core Idea**: Students experience how costly signals can convey honest information—and how the system breaks when key conditions fail.
  - **Roles**: Senders (know their type: High or Low) and Receivers (don't know types). Senders decide whether to send a signal; Receivers decide to Accept/Reject.
  - **Materials**: 
    - Poker chips (represent "energy units" — no real money).
    - Cards for sender types (High/Low).
    - Envelopes for sending signals.
    - Projector for tallying results.
  - **Payoffs**: Simple arithmetic (numbers ≤ 20). Chips are earned/lost based on outcomes.

  ---

  ### **Setup and Roles**
  1. **Divide Students**: 
     - 6 senders (3 High, 3 Low), 12 receivers per round. Rotate roles after each round so all students play both roles.
     - Assign types secretly: Give High/Low cards to senders (e.g., ♥/♦ for High, ♠/♣ for Low). Receivers get no cards.
     
  2. **Matching**:
     - Pair each sender with 2 receivers (total 12 interactions per round). 
     - Senders make **one signal decision** visible to both receivers (e.g., write "SIGNAL" or "NO SIGNAL" on a card, sealed in an envelope for each receiver).
     - Receivers face away; signals are passed via envelopes.

  3. **Payoff Structure**:
     - **Receivers**: 
       - Accept High: +10 chips 
       - Accept Low: -10 chips 
       - Reject: 0 chips
     - **Senders (High)**:
       - Benefit if accepted: +10 chips per receiver (total +20 if both accept)
       - Cost to signal: 5 chips (paid once, regardless of receiver decisions)
     - **Senders (Low)**:
       - Benefit if accepted: +10 chips per receiver (total +20 if both accept)
       - Cost to signal: 20 chips (paid once)
     - **No signal**: No cost, no benefit from receivers.

  4. **Key Rules**:
     - Costs are paid **before** receiver decisions (emphasizes upfront investment).
     - Total sender payoff = (Benefit from receivers) - (Signal cost if sent).
     - Chips are distributed after each round.

  ---

  ### **Rounds**
  **Round 1: Baseline (Differential Cost)**  
  - **Goal**: Illustrate honest signaling equilibrium (differential costs enable separation).
  - **Procedure**:
    - Senders decide: Signal or No Signal.
    - Receivers see the signal (or lack) and choose Accept/Reject.
    - **Payoffs**: As above (High cost: 5, Low cost: 20).
  - **Expected Outcome**:  
    High types signal (cost 5, benefit up to 20 → net +15).  
    Low types avoid signaling (cost 20, benefit up to 20 → net 0 if accepted, but risk net -20 if rejected).  
    Receivers learn: Signal = High → Accept; No Signal = Low → Reject.  
    **Result**: Separation. High types signal and are accepted; Low types stay quiet.

  **Round 2: Equal Cost**  
  - **Goal**: Show that cost alone isn’t sufficient; it must be *differentially* costly (Point 1).
  - **Change**: Set signal cost to **15 chips for both types**.
  - **Procedure**: Identical to Round 1.
  - **Expected Outcome**:  
    Both types signal (cost 15 is "worth it" if accepted → net +5).  
    Receivers see signals but now suspect Low types are faking (since both signal).  
    Expected value of Accepting = (50% High × +10) + (50% Low × -10) = 0 → Receivers start Rejecting.  
    Senders get: Benefit 0 (rejected) - cost 15 = **-15 chips**.  
    **Result**: Signal becomes useless. Receivers reject, and senders lose chips. "Scandal": Everyone paid a cost, but no one benefits.

  **Round 3: Avoidable Cost (Pawnshop)**  
  - **Goal**: Show that if senders avoid paying costs when rejected, the system breaks (Point 3).
  - **Change**: **Pawnshop rule**:  
    > *Before signaling, any sender can take a loan to cover the signal cost.  
    > If accepted, they repay the loan + interest (total cost: High=8, Low=25).  
    > If rejected, the loan is forgiven (no cost).*
  - **Procedure**:
    1. Senders decide: Signal (+ pawnshop?) or No Signal.
    2. Receivers choose Accept/Reject.
    3. Resolve costs: If sender used pawnshop and was rejected, they pay 0.
  - **Payoffs**:
    - High w/ pawnshop: If accepted, repay 8; if rejected, repay 0.
    - Low w/ pawnshop: If accepted, repay 25; if rejected, repay 0.
  - **Expected Outcome**:  
    Low types use pawnshop (if rejected, they pay 0; if accepted, net loss is -5 but "worth the gamble").  
    High types may avoid pawnshop (risk-free in baseline).  
    Both types signal → Receivers see more Low types → Reject more.  
    **Result**: Low types send "fake" signals, receivers reject everyone, and honest senders suffer. "Scandal": Cheaters exploit the system.

  ---

  ### **Tally and Projector Display**
  - Use a simple table per round:
    | Signal Sent? | High Senders | Low Senders | % Accepted |
    |--------------|--------------|-------------|------------|
    | Yes          | 3?           | 3?          | 50%?       |
    | No           | 0?           | 0?          | 0%?        |
  - Update after each round. Add a "comments" column for reactions (e.g., "Everyone got scammed!" in Round 3).

  ---

  ### **Debrief Guide**
  **Link Experiences to Concepts**:  
  1. **Round 2 → Point 1 (Differential Cost)**:  
     - *Ask*: "In Round 2, why did receivers reject signals even though they were expensive?"  
     - *Reveal*: Equal costs meant Low types could afford to fake. Expense alone didn’t ensure honesty—it had to hurt Low types more.  
     - *Key Moment*: When receivers realized signals were coming from both types, making them worthless.

  2. **Round 1 → Point 2 (Loop of Honesty)**:  
     - *Ask*: "In Round 1, why did High types signal and Low types didn’t? What if receivers stopped trusting signals?"  
     - *Reveal*: Signals only worked because:  
       - Receivers trusted signals (so High benefited).  
       - Low types couldn’t afford the cost *because* they’d be rejected.  
     - *Key Moment*: The system was a loop: Sender behavior ↔ Receiver trust. Break one, and honesty collapses.

  3. **Round 3 → Point 3 (Avoidable Costs)**:  
     - *Ask*: "Why did pawnshops cause a scam? What changed for Low types?"  
     - *Reveal*: Low types avoided paying costs when rejected, removing the risk. Signaling became "free" if they failed, so they flooded the system.  
     - *Key Moment*: When honest High types were rejected because receivers couldn’t trust signals anymore.

  **Final Connection**:  
  - "This is the Handicap Principle: Honest signals require costs that are (1) differentially harder for low-quality senders, (2) sustained by a loop of trust, and (3) unavoidable. Peacock tails work because they’re costly to *fake*, not just costly."

  ---

  ### **Predictable Problems & Fixes**
  1. **Round 1 Confusion**: 
     - *Problem*: Receivers might randomly reject signals, discouraging High senders. 
     - *Fix*: After Round 1, say: "Receivers, if you saw a signal, you probably accepted—why?" Guide them to see trust emerged from consistency.

  2. **Round 2 Indecision**: 
     - *Problem*: Senders might not signal due to fear of rejection. 
     - *Fix*: Note: "In Round 2, costs were equal. What would *you* do if faking was cheap?" Use tally to show most signaled anyway.

  3. **Round 3 Complexity**: 
     - *Problem*: Pawnshop rule may be misunderstood. 
     - *Fix*: Use a demo: "Imagine you take a loan. If accepted, you repay with interest. If rejected, the bank eats the cost." 

  4. **Time Shortage**: 
     - *Trim*: Run 1 interaction per sender (not 2) or reduce rounds. Prioritize Round 3 (the climax).

  ---

  ### **Limitations to Clarify in Debrief**
  - **The Game Can’t Show**: In biology, costs are often *survival risks* (e.g., peacock tails attract predators). The game uses chips, but real costs are about fitness trade-offs.  
    - *Say*: "In nature, the 'cost' isn’t chips—it’s energy or survival. If a weak animal fakes a signal, it might not live long enough to cheat again."

  ---

  ### **Why This Works**
  - Students *feel* the loop (Point 2) when their trust/signaling decisions affect outcomes.  
  - Round 3’s pawnshop creates visceral "scandal" as cheaters profit and receivers revolt.  
  - Minimal jargon: Concepts emerge from play, not lecture.  
  - Uses your constraints (chips, envelopes, projector) and avoids peacock tropes.  

  Run time: 15 min setup + 30 min gameplay (3 rounds × 10 min) + 30 min debrief = 75 min. Adjust by shortening rounds if needed.
