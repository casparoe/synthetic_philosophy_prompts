prompt: |-
  I'm a journalist working on a long feature about how appellate judges actually resolve statutory cases, and I've hit a problem I keep failing to solve on my own. Every example anyone sends me of textualism and purposivism genuinely pulling apart is either a centenarian chestnut from the casebooks — a statute barring the importation of contract laborers read not to cover a minister, a firearm traded for narcotics read as one "used" in a drug transaction — or a case where one side is being deliberately obtuse, which my interviewees correctly point out proves nothing. My most useful source, a friend who clerks on a federal court of appeals and describes herself without embarrassment as a Scalia-style textualist, says the honest cases are the ones where neither method is cheating and they still disagree; I'd like to put one of those in the piece, and I'd rather construct it than hunt for it, because a hypothetical lets me hold everything else fixed. So I need a case built to order.

  Here is what I need it to satisfy. First, the statute: one paragraph of realistic text in a real regulatory area — hospital billing, tenant protections, groundwater permitting, nursing-home staffing, whatever you like — and it must contain its own purpose clause or findings section, so that the purpose is available from the enacted text itself. No committee reports, no floor statements, no sponsor's letter: both methods argue from the same materials. Second, and this is where my own drafts died, the case must not be propped up by any of the usual escape hatches. My friend killed my first attempt in one line ("scrivener's error, next") and my second in two (the result was absurd enough that the absurdity canon resolved it before any purpose-talk was needed). So: no drafting mistakes, no results absurd on their face, no constitutional-avoidance route, no bare vagueness — please don't build the case on words like "reasonable," "appropriate," or "significant," whose whole function is to underdetermine — and no manufacturing the divergence by having the textualist read words with their nineteenth-century meaning while everyone else reads them with today's. Third, the divergence has to be generated by one structural feature: something that changed between enactment and application without anyone amending the disputed words. A later-enacted statute in a different title, a cross-referenced regulatory schedule that has since been revised, a definition that behaves differently after a subsequent amendment, a term whose ordinary meaning drifted. And it has to survive the textualist's own toolkit: I want you to show that a textualist who reads the whole act, the whole code, and the later enactment too — who applies the canons rather than being forbidden from them — still reaches the reading the purpose clause resists. If your case works only by barring the textualist from looking at the later material, it's rigged, and I can't use it. Both readings should be ones a competent lawyer could sign a brief to; I don't want a straw textualist any more than I want a straw purposivist.

  After the statute and a short, ordinary factual scenario — real parties, real stakes, nothing fanciful — I'd like the analysis in four labeled parts. (1) The verdict under each method, naming which party wins: what the textualist does with the disputed words and which canons get applied in reaching that result, and what the purposivist does with the purpose clause, including what happens when the purpose is stated at a different level of generality. (2) The load-bearing feature, named explicitly, plus a demonstration that removing it collapses the case back into agreement — say what each method says about the stripped-down version. (3) The strongest objection a textualist would make to your own construction: I'd guess it's something like the purpose clause doing legislative history's work in disguise, or the claim that you've only exhibited an ambiguity that canons resolve, or the complaint that the real dispute is about the level of generality and not about method at all — but tell me which one actually bites hardest here, and how much it costs the case. (4) One line on what you'd expect a real appellate panel to do with it and why, and one line on whether it makes the point for my piece better than the chestnuts do — whether it isolates something about the two methods rather than something about a drafting accident.
reasoning: |-
  We are constructing a hypothetical case that satisfies the following requirements:
   1. The statute must contain its own purpose clause or findings section, so that the purpose is available from the enacted text itself.
   2. The case must not rely on drafting mistakes, absurd results, constitutional avoidance, vague terms, or anachronistic meanings.
   3. The divergence must be generated by a structural feature that changed between enactment and application without amending the disputed words (e.g., a later-enacted statute, a revised cross-referenced schedule, a definition changed by amendment, or a term whose ordinary meaning drifted).
   4. The textualist must be allowed to use the whole act, the whole code, and the later enactment, and apply the canons, and still reach a reading that the purpose clause resists.
   5. Both readings must be ones a competent lawyer could argue.

   We will choose a regulatory area: let's use "groundwater permitting" as it is a technical area where statutes often have purpose clauses and cross-references.

   Statute: 
   We'll create a statute that has a purpose clause and then an operational section. The key is to have a cross-reference to a schedule (which can be amended) and a definition that might be affected by a later statute.

   Let's call the statute: "Groundwater Sustainability and Allocation Act" (GSAA)

   Text of the relevant part:

   Section 1: Findings and Purpose
   (a) Findings: The legislature finds that groundwater is a critical resource for the state, and that unregulated extraction leads to depletion and environmental harm. The legislature further finds that sustainable yield levels must be established to ensure long-term availability and to prevent adverse effects on connected surface waters and ecosystems.
   (b) Purpose: It is the purpose of this Act to establish a permitting system that limits groundwater extraction to sustainable yield levels, as determined by the State Water Board (the Board) in Schedule A, and to protect connected surface waters and ecosystems from adverse impacts due to groundwater extraction.

   Section 2: Permitting Requirement
   No person shall extract groundwater for commercial, industrial, or agricultural use without a permit issued by the Board. Permits shall be issued only for extraction that does not exceed the sustainable yield level for the relevant basin as set forth in Schedule A.

   Section 3: Definitions
   (a) "Sustainable yield level" means the maximum quantity of water that can be annually extracted from a groundwater basin without causing an undesirable result, including but not limited to chronic lowering of groundwater levels, reduction of storage, degradation of water quality, land subsidence, or depletion of connected surface waters.
   (b) "Connected surface waters" means rivers, streams, lakes, and wetlands that are hydrologically connected to the groundwater basin.

   Section 4: Schedule A
   Schedule A, as established by the Board and updated every five years, shall set forth the sustainable yield level for each groundwater basin. The Board shall base such levels on the best available scientific data and modeling.

   Note: The Act is passed in Year 0.

   Now, the structural change: 
   In Year 5, the legislature passes the "Surface Water Protection Act" (SWPA). This Act, in an unrelated section, amends the definition of "connected surface waters" in a different part of the code (say, the Water Code) to include "ephemeral streams and intermittent lakes that are hydrologically connected to the groundwater basin, regardless of whether they are dry at the time of assessment." This amendment is part of a broader environmental protection package and does not mention the GSAA.

   Also, in Year 10, the Board updates Schedule A for the first time. In doing so, it uses the new, broader definition of "connected surface waters" (from the SWPA) when determining sustainable yield levels. This results in a lower sustainable yield for many basins because more surface waters are considered connected and thus more potential adverse effects are taken into account.

   Factual Scenario:
   In Year 12, a large agricultural company (AgriCorp) applies for a permit to extract groundwater from the Central Valley Basin. The Board denies the permit because the requested extraction would exceed the sustainable yield level for that basin as set in the updated Schedule A. AgriCorp sues, arguing that the Board exceeded its authority by using the amended definition of "connected surface waters" from the SWPA when setting the sustainable yield levels in Schedule A. AgriCorp contends that the GSAA's own definition of "connected surface waters" (which did not include ephemeral streams and intermittent lakes when dry) should have been used.

   The Board argues that the definition in the GSAA was intended to be consistent with the Water Code and that the subsequent amendment in the SWPA updates the definition for all purposes, including the GSAA.

   The dispute: Does the Board have to use the definition of "connected surface waters" as it existed in the GSAA at the time of enactment (Year 0) or the current definition in the Water Code (amended by SWPA in Year 5) when updating Schedule A?

   Now, the analysis:

   (1) Verdict under each method:

   Textualist approach:
   - The textualist looks at the GSAA as a whole. The GSAA defines "connected surface waters" in Section 3(b). The definition is clear and specific: "rivers, streams, lakes, and wetlands that are hydrologically connected to the groundwater basin." It does not include ephemeral streams or intermittent lakes when dry. The statute does not say that the definitions are subject to change by later amendments to the Water Code. Moreover, the GSAA has its own definitions section, which suggests that the terms are defined for the purposes of that Act. 
   - The textualist would also note that the SWPA amended the Water Code's definition but did not amend the GSAA. The textualist applies the presumption that when a statute includes a definition, that definition controls. Also, the canon against surplusage: if the GSAA had intended to incorporate future amendments, it would have said so (like "as defined in the Water Code, as amended from time to time"). It did not. Therefore, the Board should have used the original definition when updating Schedule A.
   - The textualist might also note that the purpose clause in the GSAA refers to protecting "connected surface waters" but that the clause is not self-executing and does not override the specific definition. The operational part of the statute (Section 2) ties the permit requirement to Schedule A, which in turn must be based on the definitions in the Act.
   - Result: AgriCorp wins. The Board must recalculate the sustainable yield using the original definition.

   Purposivist approach:
   - The purposivist starts with the purpose clause: to protect connected surface waters and ecosystems from adverse impacts. The purpose is to prevent environmental harm. The amended definition of "connected surface waters" in the SWPA (which includes ephemeral and intermittent features) reflects a legislative recognition that these features are ecologically important and can be harmed by groundwater extraction. Using the updated definition better serves the purpose of the GSAA because it protects a broader range of water bodies. 
   - The purposivist would argue that the GSAA's own definition was not intended to be static, especially when the legislature later expanded the definition in the same regulatory area. The purpose clause is stated at a high level of generality (protect against adverse impacts) and the expanded definition is more protective. Moreover, Section 4 requires the Board to use the "best available scientific data", which now recognizes the importance of ephemeral and intermittent connections. 
   - The purposivist would also note that the GSAA's definition did not explicitly exclude ephemeral streams; it just didn't mention them. But the SWPA clarifies that they should be included. Thus, the purpose of the GSAA is better served by the updated definition.
   - Result: The Board wins. The updated Schedule A using the amended definition is valid.

   (2) The load-bearing feature:
   The key feature is the amendment of the definition of "connected surface waters" in the Water Code by the SWPA (a later statute) without amending the GSAA. This creates a divergence because the GSAA has its own definition, but the broader regulatory context has changed.

   If we remove the SWPA amendment (i.e., the definition of "connected surface waters" remains as originally in the Water Code and matches the GSAA definition), then both methods would agree: the Board must use the definition in the GSAA. There would be no conflict.

   (3) Strongest textualist objection to the construction:
   The textualist might argue that the purposivist is effectively amending the statute by incorporating a later definition that the legislature did not incorporate. The GSAA's definition is clear and specific, and the SWPA did not amend the GSAA. The purpose clause is not a license to ignore the enacted text. The textualist might also argue that the GSAA's purpose clause is not as broad as the purposivist makes it: it aims to prevent adverse effects on connected surface waters as defined in the Act, not every water body that might be connected. The legislature knew how to incorporate definitions from the Water Code (or to make definitions dynamic) and did not do so. Thus, the purposivist is using the purpose clause as a way to import legislative history (the SWPA) into the GSAA, which is exactly what the textualist rejects.

   This objection bites because it points out that the purposivist reading requires ignoring the specific definition in the statute in favor of a later, broader definition that the legislature did not explicitly incorporate. The textualist would say that if the legislature wanted the GSAA to use the updated definition, it would have amended the GSAA.

   (4) What a real appellate panel might do and why:
   A real appellate panel might split. The textualist judge would side with AgriCorp, and the purposivist judge with the Board. A third judge might look for a way to reconcile the statutes, but in this case, they are in conflict. The panel might be divided 2-1 in favor of the Board because the purpose is strong and the environmental harm is a current concern. However, if the panel is dominated by textualists, they might rule for AgriCorp.

   This hypothetical makes the point better than the chestnuts because it does not rely on a drafting error or absurdity. It turns on a common occurrence: a later statute amends a related definition without updating every reference in the code. The methods genuinely diverge on whether the original definition or the updated one should be used, and both arguments are reasonable. It isolates the difference in how the two methods treat statutory definitions and purpose clauses when the surrounding legal context changes.

   Therefore, the case is built to order.
answer: |-
  ### Hypothetical Case: Groundwater Sustainability Act  
  **Statutory Text Excerpt (Enacted Year 2000):**  
  *"Section 1: Purpose.*  
  (a) Groundwater depletion threatens agricultural viability and public water supplies.  
  (b) **It is the purpose of this Act to cap total annual extraction in each basin at 1990 levels, ensuring use does not exceed recharge rates measured in that year.**  

  *Section 3: Permitting System.*  
  No person may extract groundwater for commercial use without a permit. Permits shall allocate water up to the basin’s ‘Sustainable Annual Yield’ (SAY), defined as **the lesser of:**  
  **(i) The average annual recharge rate for the basin during calendar year 1990, or**  
  **(ii) The extraction volume reported in the 1990 Water Resources Inventory (WRI).**  

  *Section 7: Definitions.*  
  ‘Water Resources Inventory’ (WRI) means the triennial survey published by the State Water Board under [Cross-Reference: Water Code §14000 *et seq.*]."  

  **Factual Scenario (Year 2023):**  
  - The *State Water Board* updated the WRI methodology in 2010 (via Water Code amendments) to include previously excluded "intermittent surface seepage" as recharge.  
  - For the Central Valley basin, the *1990 WRI* (under old rules) reported recharge at 100,000 acre-feet. The *2020 WRI* (under new rules) recalculates 1990 recharge at 130,000 acre-feet due to added seepage.  
  - *AgriCorp* applied for a permit to extract 110,000 acre-feet. The Board denied it, citing Section 3(i): SAY is capped at 100,000 acre-feet (the 1990 WRI value). AgriCorp sues, arguing SAY should use the recalculated 130,000 acre-feet under Section 3(i) because "recharge rate for the basin during calendar year 1990" is a historical fact subject to modern measurement.  

  ---

  ### Analysis  
  #### (1) Verdicts by Method  
  **Textualist Approach (AgriCorp wins):**  
  - **Disputed Words:** "Recharge rate ... during calendar year 1990" (Section 3(i)).  
  - **Canons Applied:**  
    - *Temporal canon*: Words fixed at enactment; "1990" locks in the year, not the methodology.  
    - *Harmonization canon*: Cross-reference to WRI in Section 7 imports the *current* Water Code definition (amended 2010), as statutes are presumed to adopt future amendments unless specified otherwise.  
    - *Ordinary meaning*: "Recharge rate" is a scientific fact; improved methods yield better accuracy.  
  - **Result:** SAY uses the recalculated 130,000 acre-feet. AgriCorp’s permit must be reconsidered.  

  **Purposivist Approach (State Water Board wins):**  
  - **Purpose Clause:** Section 1(b) aims to "cap extraction at 1990 levels" to freeze usage relative to historical conditions.  
  - **Reasoning:**  
    - The purpose (stability, preventing overuse) requires using the *actual data available in 1990*, not retroactive recalculations.  
    - "1990 levels" in the purpose clause refers to the *contemporary understanding* of recharge/extraction at enactment. Using modern data would distort the 1990 baseline, undermining the cap’s predictability.  
  - **Result:** SAY remains 100,000 acre-feet. Board’s denial stands.  

  #### (2) Load-Bearing Feature & Collapse Test  
  - **Feature:** The 2010 amendment to the Water Code (updating WRI methodology).  
  - **Collapse Test (Without Later Amendment):**  
    - If WRI methodology *never changed*, both methods agree: SAY uses the original 1990 WRI value (100,000 acre-feet). No divergence.  

  #### (3) Strongest Textualist Objection  
  - **Objection:** "The purpose clause is legislative history in disguise. Textualists reject using purpose to *override* unambiguous text—here, the cross-reference to WRI (§7) explicitly incorporates the *current* Water Code. The purpose clause’s generality (‘1990 levels’) cannot negate the technical definition."  
  - **Cost:** This forces textualists into a counterintuitive result: The SAY cap *increases* due to later methodology changes, potentially enabling *more* extraction despite the purpose of "capping" use. But textualism prioritizes textual commitments (cross-references) over purpose-driven flexibility.  

  #### (4) Real-World Outcome & Utility  
  - **Expected Appellate Ruling:** A mixed panel would split 2-1. Textualists side with AgriCorp; purposivists with the Board. The tiebreaker (a pragmatist) might defer to the agency’s interpretation, upholding the Board.  
  - **Advantage Over Chestnuts:** This isolates methodological conflict—**textualism’s fidelity to semantic/referential context vs. purposivism’s fidelity to functional goals**—without absurdity, vagueness, or drafting errors. The cross-reference revision is a routine legislative event, making the divergence organic and unresolved by canons.  

  ---  
  ### Why This Works for Your Piece  
  This case satisfies all criteria:  
  1. **Self-contained purpose** (Section 1(b)), **no extrinsic materials**.  
  2. **No escapes**:  
     - No absurdity (both outcomes are defensible),  
     - No scrivener’s error (cross-references often evolve),  
     - No anachronism ("1990" is fixed, but measurement evolves naturally).  
  3. **Structural change**: The Water Code amendment alters the WRI’s meaning, creating friction between the purpose clause and the textual cross-reference.  
  4. **Textualist tools honored**: Cross-references, harmonization, and temporal canons are applied—yet they conflict with purpose.  
  5. **Competent arguments**: Both sides deploy standard doctrinal moves.  

  This demonstrates that textualism and purposivism aren’t just divided by "cheating" or antiquated examples—they prioritize different legislative signals (semantic context vs. functional goals) when statutes interact with legal change.
