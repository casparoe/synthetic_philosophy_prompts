prompt: |-
  Hi — hoping you can help with something that's half practical, half philosophical. I do intake at a small outfit that brokers what people in this space call moral trades: two funders who disagree about what's actually worth doing each spend money on the other's cause, on the theory that both end up with more of what they care about than if they'd just spent on themselves. Our broker (call her Marta) decides what we'll put our name to, and I've now watched her say yes and no often enough that I can't work out what rule she's running. Her track record:

  1. Straight swap between a global-health funder and an animal-welfare funder, $5M each way: yes, no hesitation.
  2. Tiny foundation whose entire value was that a grove of one particular tree species be planted and tended for fifty years; they put $9M into a deworming program in exchange: yes. She has never once required that a demand make sense to anyone else.
  3. Deal where one side's contribution required its staff to mislead their own donors about where the money actually went: no.
  4. Deal where one side's contribution meant breaking a signed agreement with a partner org: no.
  5. A proposed trade with a group inside another country's sealed-off program that we could never contact and would never hear from, justified on the grounds that they're presumably running the same reasoning and will do their part anyway: no.
  6. A deal with a counterparty that had reneged on a previous trade: no — but she brokered basically the same deal a year later once they posted a bond with a third party.
  7. A deal where the small side was six months from losing its charter and had no other counterparty, and the big side's terms handed it maybe 5% of the gains: no.
  8. A secular group that wanted a religious charity to publish a statement saying the charity's own mission was less important than theirs: no.

  Now the one on my desk. Ardent is a large poverty-focused foundation. Clause is small, and its only value is that a particular nineteenth-century legal archive be preserved — the physical paper, in the original building — and that Ardent publicly state, on it's own letterhead, that it regards preserving the archive as being as important as its core work. Clause puts $40M of its money into Ardent's programs; Ardent spends $3M on the archive and publishes one statement drafted by Clause.

  The wrinkles as I see them. Ardent's board is happy to publish, but their own staff don't think the sentence is really true — they'd call it a harmless overstatement rather than a lie, and nothing is being concealed from donors about where money goes. Ardent's donors gave for poverty and were never asked; an internal poll suggests most of them wouldn't mind, but only most. Clause has about eighteen months of runway before it has to deploy or dissolve, has no other counterparty, and would get, in money terms, a small fraction of what it's handing over — though it would also get literally everything it cares about. And Clause has turned down a digitisation option that would secure the same documents for a tenth of the price, on the grounds that it's the paper it cares about, not the contents.

  What I want from you: will Marta broker it? More usefully — give me the two or three rules that fit all eight of her verdicts about equally well, say what each of them predicts here, tell me which one you think she's actually running and why, and name the single variation on this deal that would tell them apart. (Same money, statement dropped? Same deal, donors actually asked and 90% say fine? Same deal, Clause has three years of runway and two other counterparties?) If you think her precedents genuinely don't reach this far, say so and tell me what principle she'd be committing herself to with each choice. I care less about the yes/no than about which of those rules I should assume next time.
reasoning: |-
  Okay, the user works at a small brokerage that handles "moral trades," where two funders with opposing values fund each other's causes. They're trying to figure out Marta's decision-making pattern based on eight past cases. Now, they have a new proposal from Ardent and Clause and want to predict Marta's verdict.

  First, I need to analyze all eight precedents to identify patterns. Let me list them out:

  1. Global health and animal welfare swap: Yes. Both parties get clear value, no strings attached.
  2. Tree grove foundation funding deworming: Yes. Even though the cause is niche, it's legitimate and no deception involved.
  3. Staff misleading donors: No. This involves deception, which Marta rejected.
  4. Breaking a signed agreement: No. Violating contracts is a no-go.
  5. Assuming a sealed-off group would cooperate: No. Requires trust without verification.
  6. Counterparty reneged before: No, but yes after a bond was posted. Shows enforcement matters.
  7. Desperate small party with unfair terms: No. Exploitation seems key here.
  8. Forced statement of inferiority: No. Humiliation or undermining isn't acceptable.

  Looking at these, three rules emerge. First, "No Deception or Coercion" – no lying, contract-breaking, or forced statements. Second, "Enforceable Reciprocity" – deals must have clear accountability, like the bond in case 6. Third, "No Exploitation of Desperation" – no taking advantage when one party is cornered, as in case 7.

  For the Ardent-Clause deal, the issues are: Ardent's staff think the statement is an overstatement, not a lie. Donors weren't consulted, but most wouldn't mind. Clause is desperate with 18 months left and no alternatives. They rejected digitization, insisting on physical preservation.

  Applying the rules:
  - No Deception: The statement might be an overstatement, but not a lie, so maybe okay.
  - Enforceable Reciprocity: Ardent has to publish the statement and spend the money. Since they're reliable, this should be fine.
  - No Exploitation: Clause is desperate, which might trigger a no, similar to case 7.

  But Marta approved case 2 where a tiny foundation funded deworming for their specific tree grove. The key difference is that in case 2, the foundation wasn't desperate; they made a choice. Here, Clause has no alternatives and is under time pressure, which might push Marta to say no to avoid exploitation.

  The variation to test the rules: If Clause had three years and other counterparties, would Marta approve? Under Exploitation rule, yes. But if the statement was dropped, and only money was exchanged, Deception rule might still flag the overstatement, but if it's removed, the deal is cleaner. The Enforceable rule would be indifferent to the statement.

  I think Marta's core rule is No Exploitation. Case 7 was a clear no due to desperation, and here Clause is similarly desperate. The staff's discomfort and donor issue add to the problem, but the desperation is key. So, she'd likely reject this deal. To confirm, if Clause wasn't desperate, Marta might approve even with the statement.
answer: |-
  Based on Marta's precedent, I identify **three consistent rules** that fit all eight cases equally well. Below is the analysis, prediction for your Ardent/Clause case, which rule Marta likely uses, and the critical test variation to distinguish them:

  ---

  ### **The Three Rules**
  1. **"No Deception or Coercion"**  
     - **What it forbids:** Any trade involving lies, material misrepresentations, contractual breaches, forced humiliation, or actions that undermine an organization's core integrity.  
     - **Fits precedents:**  
       - *Yes* on #1 (transparent swap), #2 (no deception; niche demand accepted).  
       - *No* on #3 (misleading donors), #4 (breaking agreement), #8 (forced statement of inferiority).  
       - *No* on #5 (unverifiable counterparty = deception risk).  

  2. **"Enforceable Reciprocity"**  
     - **What it requires:** Both sides must have clear, enforceable obligations with penalties for non-performance. Trust alone isn’t enough.  
     - **Fits precedents:**  
       - *Yes* on #1 (simultaneous exchange), #2 (clear deliverables), #6 (approved after bond secured enforcement).  
       - *No* on #5 (no enforcement mechanism for sealed-off group), #6 initially (prior reneging = unenforceable).  

  3. **"No Exploitation of Desperation"**  
     - **What it forbids:** Trades where one party’s vulnerability (time pressure, lack of options, asymmetric power) forces them into highly unfavorable terms.  
     - **Fits precedents:**  
       - *Yes* on #1 (balanced swap), #2 (no desperation implied).  
       - *No* on #7 (small party cornered, gains minimal), #6 initially (counterparty unreliable due to past reneging = desperation risk).  
       - *No* on #3/4 (coercion via deception/breach).  

  ---

  ### **Prediction for Ardent/Clause**
  - **Under "No Deception or Coercion":**  
    - 🟢 **Likely YES**  
    - *Why:* Ardent's statement is an "overstatement" (not a lie), donors aren’t actively misled, and Clause’s demand aligns with its values. Precedent #2 (tree grove) shows Marta accepts niche/unpopular demands if honest.  
    - *Weakness:* Staff discomfort and unconsulted donors might edge toward "coercion" if Marta thinks Ardent is compromising integrity. But precedent #8 (forced inferiority statement) was rejected for humiliation—this lacks that element.  

  - **Under "Enforceable Reciprocity":**  
    - 🟢 **Likely YES**  
    - *Why:* Ardent’s obligations ($3M spend + public statement) are verifiable and legally binding. Precedent #6 shows Marta accepts previously unreliable parties with enforceable guarantees.  
    - *Weakness:* None—Clause’s deliverables are straightforward.  

  - **Under "No Exploitation of Desperation":**  
    - 🔴 **Likely NO**  
    - *Why:* Clause is desperate (18-month runway, no other counterparties), gains minimal monetary value, and Ardent extracts $40M for $3M + a statement. Strongly mirrors precedent #7 (small party cornered, gains 5%). Marta prioritizes power balance over "total value" to Clause.  
    - *Weakness:* Clause "gets everything it cares about," but precedent #7 rejected similar "non-monetary value" justification.  

  ---

  ### **Which Rule is Marta Actually Running?**  
  **I believe Marta uses "No Exploitation of Desperation" as her primary rule.**  
  - **Why:**  
    - Precedent #7 is the *clearest analogue* to your case: a desperate party with no alternatives and lopsided terms was rejected despite fulfilling their mission.  
    - She tolerates niche values (#2), enforces reliability (#6), and avoids deception (#3, #4, #8), but **exploitation of vulnerability is her non-negotiable**.  
    - Her "no" in #7 overrides "value to the cause"—suggesting fairness in process outweighs outcome.  

  ---

  ### **The Critical Test Variation**  
  To distinguish between the three rules, propose:  
  **"Same deal, but Clause has three years of runway and two other counterparties."**  
  - **Why this variation?**  
    - *If Marta says YES:* She’s likely running **"No Exploitation"**—removing desperation resolves her core objection.  
    - *If Marta says NO:* She’s likely running **"No Deception"** (objecting to Ardent’s insincere statement) or **"Enforceable Reciprocity"** (if she doubts Clause’s performance).  

  Other variations like "dropping the statement" or "polling donors" would only test secondary aspects of the Deception rule, not the critical desperation factor.  

  ---

  ### **Verdict for Your Case**  
  **Prediction:** Marta will reject the Ardent/Clause deal under her "No Exploitation" rule.  
  - **Why:** Clause’s desperation (18 months, no alternatives) and Ardent’s asymmetric leverage ($40M for $3M + a performative statement) mirror precedent #7 too closely. She won’t override fairness for Clause’s "total value" argument.  

  **If you want Marta to say yes:** Negotiate terms where Clause isn’t cornered—e.g., extend their runway, find backup options, or reduce Ardent’s cash demand. The statement itself isn’t the dealbreaker.  

  Let me know if you need help drafting counterproposals!
