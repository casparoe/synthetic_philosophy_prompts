  For the thesis, refining it to emphasize the systemic need for moral compromise in broken institutions ties everything together. Key scenes include Gordon's dilemma with the fake Batman, Batman's surveillance, and the ending. Admitting the ferry scene challenges the theory shows nuance. Philosophically, clarifying that Batman's vigilante status doesn't exempt him from dirty hands is crucial. The film adds to the philosophy by exploring the emotional and societal costs, making it more than an illustration.

