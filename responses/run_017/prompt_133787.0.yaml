  For each thesis, I need to address "works" (practical success, explanatory power, etc.), whose purposes (individual, group, ideal community), timescale (immediate, long-term, infinite), and the claim's nature (definition, norm, etc.). Then assess trivial/defensible/false and apply to the dead-language and blind-spot cases.

  The dead-language sentence: if no practical difference, some interpretations deem it meaningless or truth-valueless. Peirce might say it's true but unknowable, while James might consider it irrelevant. The blind-spot case challenges Peirce—if inquiry converges on falsehood due to limitations, does that make it true? Peirce's ideal convergence avoids this, but the case forces examining if truth depends on our cognitive contingencies.

