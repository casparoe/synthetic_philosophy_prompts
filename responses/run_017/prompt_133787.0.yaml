answer: |-
  Here's a disambiguation of "truth is what works," structured as requested, analysing its potential meanings, applications to your cases, and the relationship between Peirce and James:

  **The Menu of Interpretations:**

  1.  **Trivial Pragmatic Advice (Normative, Methodological)**
      *   **Thesis:** The best *method* for *discovering* true beliefs is to adopt and test those which demonstrably "work" in guiding successful action, prediction, and explanation *in the present and foreseeable future*.
      *   **'Works' as:** Practical success, predictive accuracy, explanatory coherence (short-to-medium term).
      *   **Whose purposes:** Human investigators generally (or specific communities).
      *   **Timescale:** Present, foreseeable future.
      *   **Nature of Claim:** Normative claim about epistemic methodology (how we *should* form beliefs), *not* a claim about the nature of truth itself. Compatible with correspondence or other theories.
      *   **Assessment:** **Trivial/Defensible.** This is uncontroversial good scientific/investigative practice. Both Peirce and James would endorse it, but it doesn't define truth.
      *   **Dead-Language Sentence:** Irrelevant to this thesis. It's about method, not the status of untestable propositions. Doesn't deliver the classmate's conclusion.
      *   **Blind-Spot Case:** Doesn't force a verdict. We might *adopt* the false hypothesis because it *seems* to work with our blind spot, but this thesis doesn't say that hypothesis *is* true.
      *   **Peirce/James Alignment:** Both endorse it, but it's not their core theory of truth.

  2.  **Operational Definition of Meaning/Truth (Semantic, Verificationist-Leaning)**
      *   **Thesis:** The *meaning* (and thus the truth-conditions) of a proposition *is* the set of practical consequences (experiential differences) believing it would lead to *for us*. If a proposition has *no* conceivable practical consequences, it is meaningless or lacks a truth-value.
      *   **'Works' as:** Generating tangible, experiential differences in belief, action, or expectation.
      *   **Whose purposes:** Human experiencers (individuals or communities).
      *   **Timescale:** Conceivable future experience.
      *   **Nature of Claim:** Claim about meaning (verificationist) and the conditions for a proposition having truth-value. Borderline deflationary for propositions lacking consequences.
      *   **Assessment:** **Contentious but Defensible** (within limits). Influenced by logical positivism, more radical than Peirce or James intended, but captures a strong pragmatist impulse. Faces challenges with unobservables, counterfactuals, mathematics.
      *   **Dead-Language Sentence:** *Does* deliver the classmate's conclusion. If the sentence makes *no conceivable difference* to any possible experience or action, it lacks truth-value ("nothing to be said"). Your question is deemed non-genuine (meaningless).
      *   **Blind-Spot Case:** Doesn't directly force a verdict on truth *if* the blind spot makes the true hypothesis inconsequential. However, the *adopted* hypothesis *does* have consequences, so it's meaningful and deemed true *based on its operational consequences*.
      *   **Peirce/James Alignment:** James leans closest to this ("The True is only the expedient in our way of thinking... expedient in the long run and on the whole"). Peirce strongly criticised this as too nominalist/subjectivist.

  3.  **Jamesian Pluralistic Expedience (Normative/Descriptive, Metaphysical-Leaning)**
      *   **Thesis:** Truth is a *property* beliefs acquire when they prove themselves valuable *over time* by satisfactorily "leading us" through experience, enabling fruitful connections, resolving tensions, and contributing to a coherent, liveable worldview. "Works" encompasses practical success, intellectual satisfaction, moral resonance, and overall "expedience" for individuals or groups.
      *   **'Works' as:** Multi-dimensional expedience: instrumental success, coherence, livability, emotional satisfaction, moral fittingness (long-term).
      *   **Whose purposes:** Individuals or human communities (potentially pluralistic).
      *   **Timescale:** Long-term, evolving human experience.
      *   **Nature of Claim:** A claim about the *nature* of truth – truth *is* this property of proven expedience. Strongly normative ("what we *ought* to believe" is what proves expedient).
      *   **Assessment:** **Contentious but Defensible** (with caveats). Captures James's emphasis on the human value and function of truth. Criticised as conflating truth with utility, leading to relativism ("expedient for whom?").
      *   **Dead-Language Sentence:** Likely deems it truth-valueless or irrelevant. If it makes *no* difference to *any* human purpose or experience, ever, it lacks the expedience that constitutes truth. Supports the classmate's conclusion.
      *   **Blind-Spot Case:** The false hypothesis *works* reliably given our limitations. If it provides coherence, predictive success, and satisfaction *for us*, James might be forced to say it *is* true *for us*, despite being false in some inaccessible "correspondence" sense. Truth depends on contingent cognitive equipment *insofar as* that equipment shapes what proves expedient.
      *   **Peirce/James Alignment:** This *is* James's core view. Peirce vehemently disagreed, seeing it as abandoning objectivity.

  4.  **Peircean Convergence of Inquiry (Metaphysical, Realist-Leaning)**
      *   **Thesis:** Truth is the opinion which *would* be agreed upon by *all* investigators *if* scientific inquiry were pushed to its ultimate, ideal limit, indefinitely far into the future. It is *independent* of what any individual or finite group believes now. "Works" means survives rigorous testing, demonstrates explanatory power, and achieves stable consensus under *ideal* conditions of reason and evidence.
      *   **'Works' as:** Survival under indefinitely prolonged, ideal inquiry (explanatory power, logical coherence, empirical adequacy).
      *   **Whose purposes:** The ideal community of investigators (transcending individual/current community biases).
      *   **Timescale:** Indefinite future, converging at the hypothetical ideal limit.
      *   **Nature of Claim:** A claim about the *nature* of truth – it *is* this ideal, mind-independent convergence point. Normative implications for belief fixation follow.
      *   **Assessment:** **Contentious but Defensible.** Peirce's "realist" pragmatism. Avoids relativism but relies on a disputable idealisation. Truth is *not* contingent on *actual* human limitations.
      *   **Dead-Language Sentence:** *Contradicts* the classmate's conclusion. There *is* a truth of the matter (what the last sentence actually *was*). It's just *unknowable* by us because the evidence is permanently lost. Inquiry *cannot* reach it, but that doesn't mean it lacks truth.
      *   **Blind-Spot Case:** *Rejects* the tutor's conclusion. If the reliably converged-upon hypothesis is *false* (due to the blind spot), then *by definition*, inquiry has *not* reached its *ideal* limit. The blind spot *prevents* ideal inquiry. The *true* hypothesis remains the one that *would* be agreed upon *if* the blind spot *were* overcome. Truth is *not* contingent on our *actual* cognitive equipment, only on what *would* emerge under *idealised* conditions. The slogan misapplied if it suggests the false convergence *is* truth.
      *   **Peirce/James Alignment:** This *is* Peirce's core view. James explicitly rejected the "ideal consensus" notion.

  5.  **Radical Relativism / Subjective Utility (Descriptive, Metaphysical)**
      *   **Thesis:** Truth *just is* whatever belief is useful *right now* for a particular individual or group to achieve their immediate goals. "Works" means serves immediate, subjective desires or social power dynamics.
      *   **'Works' as:** Short-term subjective satisfaction, achieving immediate pragmatic goals, reinforcing group identity/power.
      *   **Whose purposes:** Specific individuals or socio-political groups.
      *   **Timescale:** Immediate or short-term.
      *   **Nature of Claim:** A claim about the nature of truth – it is radically context-dependent and relative.
      *   **Assessment:** **Plainly False** (as a general theory of truth). Collapses into "might makes right" or solipsism. Contradicts the possibility of error or shared reality. Neither Peirce nor James held this, though James is sometimes (mis)read this way.
      *   **Dead-Language Sentence:** Truth-valueless only if *no one* finds utility in asserting something about it *now*. If asserting a specific sentence "works" for someone (e.g., reinforces their ideology), it could be "true" for them.
      *   **Blind-Spot Case:** The false hypothesis *is* true *for us* because it works *now* with our limitations. Truth directly contingent on contingent cognitive equipment.
      *   **Peirce/James Alignment:** Caricature of pragmatism, rejected by both.

  **Analysis & Payoff:**

  *   **Your Classmate's Conclusion:** This is most directly supported by **Interpretation 2 (Operational Definition)** and **Interpretation 3 (Jamesian Expedience)**. It is explicitly *rejected* by **Interpretation 4 (Peircean Convergence)** and irrelevant to **1 (Methodological Advice)**. **5 (Radical Relativism)** might support it situationally.
  *   **Blind-Spot Case Verdict:** **Interpretation 3 (Jamesian)** and **5 (Radical Relativism)** likely *force* the verdict that the false hypothesis *is* true (for us). **Interpretation 4 (Peircean)** *forcefully rejects* this verdict. **Interpretation 1 (Methodological)** doesn't force it. **Interpretation 2 (Operational)** might lean towards the false hypothesis being "true" operationally.
  *   **The Slogan's Users:** Seminar participants reaching for "truth is what works" are *likely* gesturing towards **Interpretation 2 (Operational)** or **3 (Jamesian)**, especially when dismissing untestable propositions like your dead-language example. The tutor's blind-spot case effectively exposes the potential problems with these interpretations from a Peircean (or realist) perspective.
  *   **Peirce vs. James:** Disambiguation reveals **fundamental differences**. They are *not* two versions of a single doctrine travelling under the same slogan.
      *   **Peirce (Interpretation 4):** Truth is objective, convergent, ideal, and *independent* of finite human experience/utility. It's a *regulative ideal* for inquiry. "Works" means survives *ideal* inquiry.
      *   **James (Interpretation 3):** Truth is (in part) *constituted* by its experiential fruits, its value in human life, its expedience in "working" our way through the world. It's more pluralistic and potentially contingent on human perspectives. "Works" means proves expedient *for us*.
      *   The slogan ("truth is what works") is profoundly ambiguous between Peirce's idealist realism and James's experiential humanism. Peirce himself accused James of misunderstanding and subjectivising his views. Your seminar's conflation is historically common but philosophically misleading.

  **Conclusion:** The slogan "truth is what works" is a classic example of philosophical underspecification. Its power as a rhetorical device masks significant, often incompatible, interpretations ranging from uncontroversial methodology to radical relativism. Disambiguation is crucial. Peirce and James offer distinct, defensible but contentious, substantive theories of truth centred on long-term inquiry and human expedience respectively, both vulnerable to different objections revealed by your cases. Neither genuinely supports dismissing the *existence* of truth in the dead-language case, though James might dismiss its *relevance*. Peirce escapes the blind-spot counterexample through idealisation, while James struggles with it. Recognising these distinctions is essential for your response paper.
