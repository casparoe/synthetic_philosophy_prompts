  Okay, the user is stuck in this boundary dispute with their neighbor over a small strip of land. They've both spent way more than the land is worth because they believe each euro spent increases their chances of winning. The council officer hinted that maintenance and defense of the land matter, which fuels their spending. The user's wife wants to stop, but the user fears if they back down, the neighbor will keep going and win. Plus, the user admits they're enjoying the conflict and worry about setting a precedent for future disputes.

  First, I need to recognize the core issue here. It's not just about the land; it's about sunk costs, pride, and future conflicts. The sunk cost fallacy is evident—both parties have invested so much that quitting feels like a waste. The user's identity is also at play; they don't want to be seen as someone who caves, especially with ongoing shared property issues. The neighbor being a builder with more resources adds pressure.

  The dollar auction experiment the friend mentioned is crucial. In that scenario, bidders escalate beyond the item's value because they don't want to lose their initial investment. Here, even though each euro spent might nudge the odds, it's similar. The escalating costs and the inability to back down without losing everything mirror the auction trap. The user argues their case is different because money influences the council's decision, but the officer's criteria are vague. The spending might not have a linear impact; it could be that after a certain point, more money doesn't help and might even annoy the officer.

  The user's enjoyment of the conflict is a red flag. Keeping a spreadsheet of the neighbor's spending indicates they're emotionally invested beyond practicality. This emotional aspect can cloud judgment. Also, the fear of future disputes (fence, drain, tree) makes this about more than the land—it's about perceived weakness.

  For advice, the user needs a way out without losing face. Mediation is coming up, so preparing for that is key. They should consider the officer's perspective: excessive spending might reflect poorly. A joint proposal to split the land and halt spending could be presented as mutual responsibility. Emphasizing community harmony might appeal to the council. Legally, the user's expenses might not directly influence the boundary decision, which is likely based on deeds and evidence, not just spending.

  Offering to split costs incurred could be a strategy. If the neighbor refuses, it makes them look unreasonable. The user needs to shift focus from winning to minimizing losses. The sunk costs are gone; future spending is the real issue. Mediation is the best chance to de-escalate. The user should enter mediation willing to compromise, framing it as maturity, not surrender. Highlighting mutual financial drain and the officer's potential disapproval of the feud could persuade the neighbor.

  Ultimately, the user must decide what's more important: winning a costly battle or preserving resources and relationships. Letting go of the sunk costs and focusing on future savings is the pragmatic choice. The mediator can help reframe the compromise as a win-win, especially since the user was originally okay with splitting the land. This approach might prevent future conflicts by setting a cooperative tone.
answer: |-
  You've perfectly described a classic case of **Escalation of Commitment** (also known as the "sunk cost fallacy" on steroids) mixed with elements of the **Dollar Auction Game** your friend mentioned. While there's a *perceived* difference (money influencing odds), the core psychological trap is identical. Here's why:

  1.  **The Dollar Auction Parallel is Spot On:**
      *   **Bidding War:** Just like bidders compete for a $1 bill, you and your neighbor are bidding for land worth ~€4k.
      *   **Escalating Costs:** Each "bid" (€ spent on solicitors/surveyors) increases your total stake.
      *   **Inability to Quit:** The *fear of losing your prior investment* if the other person wins keeps you both bidding. Your statement "if I stop now he just carries on and gets it" is the *exact* logic that drives the Dollar Auction beyond rationality.
      *   **Winner's Curse:** Even the "winner" pays far more than the prize is worth (€9k+ vs €4k land value). The true "prize" becomes avoiding the humiliation of losing after investing so much.
      *   **Perceived Influence:** Your twist is the officer's comment. This acts like telling auction bidders, "The highest bidder *probably* gets it, but I might consider how persistently you bid." It *feeds* the escalation by justifying each extra euro as potentially useful, even though the return on investment is terrible and the officer's criteria is vague.

  2.  **Why Your Situation is the Dollar Auction Trap (Even With the Officer's Comment):**
      *   **Diminishing Returns:** Early spending *might* have significantly shifted odds (e.g., proving historical use). Now, at €9k each, every *additional* €100 likely moves the needle infinitesimally, if at all. The officer's decision will primarily be based on deeds, historical maps, and established boundaries – spending beyond establishing your case has minimal impact.
      *   **The Officer's Perspective:** Constant, expensive legal battles over a minor strip likely paint *both* of you negatively. It suggests intransigence, not responsible "maintenance and defence." Her comment might have been intended to encourage *evidence* of upkeep, not an arms race.
      *   **"Winning" is Pyrrhic:** Even if you "win," you've spent €9k+ for land worth €4k and have a furious, resentful neighbor you *must* coexist with for decades. Is that €5k+ loss and poisoned relationship worth avoiding the "mild inconvenience"?
      *   **Sunk Costs are Sunk:** The €9k is gone regardless. Future spending is only about trying to salvage *something* from that loss and avoid the perceived humiliation of losing. This is the core fallacy.

  3.  **The Added Complications:**
      *   **Pride & Identity:** "Becoming the guy who caves" and your enjoyment of the conflict are powerful drivers keeping you locked in. This is common in escalation.
      *   **Future Disputes:** Your fear about the fence, drain, and tree is valid. However, *winning* this battle through sheer financial force will likely make those *worse*. Your neighbor will be vengeful and less cooperative. *Losing* might embolden him. **A negotiated settlement here is the BEST way to set a precedent for future cooperation.**
      *   **Resource Imbalance:** Him being a builder with potentially more cash *increases* the trap's danger for you. He might be thinking the same thing ("I can outlast him"). It becomes a test of financial endurance you cannot afford to win.

  **What To Do: Break the Cycle**

  The mediation session in three weeks is your **golden opportunity**. Going in determined to "win" or seeing "I'm done" as surrender will likely fail. Here's a strategic approach:

  1.  **Reframe Your Goal:** Stop thinking "win the land." Start thinking "minimize total future losses (financial and relational) and find a workable solution."
  2.  **Prepare for Mediation (Mentally & Practically):**
      *   **Accept Sunk Costs:** The €9k is gone. Don't throw more after it hoping for a miracle.
      *   **Calculate Your Walk-Away:** What is the *maximum* you'd pay *today* to settle this completely? (Hint: It should be less than €4k, probably €0 given the land's value vs. costs). Be realistic.
      *   **Develop Settlement Options:**
          *   **Split the Land:** The original sensible solution. Joint ownership of the passage, shared maintenance, perhaps defined access rights (e.g., you can use it for bins/garden access, he can too, but no permanent structures).
          *   **One Buys Out the Other:** Agree the land is worth €4k. One pays the other €2k for full ownership. This acknowledges the dispute but settles it cleanly.
          *   **Jointly Grant an Easement:** The land officially belongs to one (determined by deeds/mediator), but the other gets a legally recorded right of way for access. Solves the core problem (access) without full ownership.
          *   **Costs Amnesty:** Agree to split the land *and* agree that any *future* shared expenses (fence, drain, tree) will be handled cooperatively or via a pre-agreed mechanism. This directly addresses your future fear.
      *   **Gather Evidence (Calmly):** Have your *historical* evidence (deeds, old photos showing use if any) ready. *Stop* adding to the solicitor/surveyor pile.
  3.  **Strategy for the Mediation Session:**
      *   **Lead with De-escalation:** Start by acknowledging the absurdity: "We've both spent far more than this land is worth. This isn't good for either of us or our families. I'm here to find a sensible end to this." This disarms and sets a cooperative tone.
      *   **Focus on Mutual Interest:** "We both need to live here peacefully for years. We have shared responsibilities. Let's solve this in a way that lets us be reasonable neighbors going forward."
      *   **Propose Settlement Options:** Present your preferred options (e.g., Split + Costs Amnesty for future issues). Frame them as win-win: "Splitting the land gives us both access, saves us both thousands more in fees, and lets us reset our relationship for the fence/drain/tree."
      *   **Leverage the Officer's View (Carefully):** "The council officer likely sees this ongoing expensive dispute negatively for both of us. Presenting her with a joint agreement we've reached in mediation is the best outcome *for her* and shows responsible management."
      *   **"I'm Done" - But Frame it Right:** Saying "I'm done spending money on this fight" is powerful *if* followed by "and I propose we agree to split it/share it." It signals an end to the arms race *while* offering a solution. It's not surrender; it's a strategic withdrawal to a sensible position. If you just say "I'm done" and walk away, yes, you lose. If you say "I'm done fighting; here's a fair solution," you take control.
      *   **Be Prepared for His Reaction:** He might be deep in the trap too. Stay calm. If he rejects all reasonable offers, state clearly: "I have made fair offers to end this dispute. If you reject them, I will have no choice but to present my evidence to the council officer and accept her decision, but I will not engage in further expensive legal battles. The costs from this point are on you." Then *follow through*. Stop spending.
  4.  **If Mediation Fails:**
      *   **STOP SPENDING.** Seriously. No more solicitors, no more surveyors. The sunk costs are gone. Further spending is highly unlikely to change the council officer's mind significantly and will only deepen your losses.
      *   **Present Your Case Calmly to the Officer:** Submit your *existing* evidence. Emphasize your willingness to compromise and the unreasonable escalation driven by your neighbor (if true). Highlight your original acceptance of a split.
      *   **Accept the Council's Decision:** Once decided, *accept it*. Move on. Further legal challenges (like court) would be financially suicidal.

  **The Hard Truth:** There is no way to recover your €9k. The only choices are:
  1.  **Spend more money:** Increasing your total loss, straining your marriage, and poisoning your neighbor relationship further, for a *chance* at a prize worth less than you've already spent.
  2.  **Negotiate an End:** Accept a compromise (split, easement, buyout) that solves the practical problem (access) for minimal *future* cost and potentially salvages neighborly relations.
  3.  **Stop Fighting & Accept the Council's Verdict:** Minimize *future* losses, accept the outcome, and deal with the inconvenience.

  **Your best, most rational, and most dignified path is Option 2: Negotiate a settlement in mediation.** Frame it as strength and maturity, not weakness. It preserves resources for your family, potentially improves future neighbor interactions, and finally ends the draining conflict. Take control by being the one to propose the sensible solution. The mediation session is your off-ramp – take it.
