prompt: |-
  I'm a philosophy PhD student finishing a dissertation chapter on the therapy/enhancement distinction, and I keep coming back to organised competitive sport as the one place where that distinction has actually been written into binding rules and enforced with real sanctions. So I want to treat the anti-doping code as a philosophical object and ask what it presupposes. Here is the practice as I understand it: a substance or method goes on the Prohibited List if it satisfies two of three criteria — that it can enhance performance, that it carries health risk, and that it offends the spirit of sport. An athlete with a documented diagnosis can get a Therapeutic Use Exemption to take an otherwise banned substance, on the condition that the dose restores normal function rather than exceeding it. Some substances are banned only in competition, some only in particular sports (beta-blockers in precision events like shooting and archery, stimulants generally). Meanwhile a great many interventions that plainly enhance performance are permitted outright: altitude training and hypoxic tents, creatine, caffeine, carbohydrate loading, high-tech running shoes (though certain swimwear technology was eventually banned after a rash of records), corrective eye surgery that can leave an athlete with better-than-normal acuity, and reconstructive surgery after which some pitchers return throwing harder than before. And in the regulations governing some athletes with differences of sex development, competitors have in effect been required to take medication to bring a natural hormone level down in order to be eligible for certain track events.

  The pattern puzzles me in several places at once. First, the very same intervention — a corticosteroid injection, testosterone replacement, a stimulant — is treatment when the patient is a teacher and doping when the patient is a cyclist, which suggests the therapy/enhancement line is not a property of the intervention or even of the person's health, but of the role or practice the person is in. Second, hypoxic tents and erythropoietin raise red-cell mass through the same broad physiological route, yet one is a permitted training method and the other a criminalised one; so something other than the physiological effect is doing the work. Third, if therapeutic use is supposed to restore an athlete's own baseline, the code has no clean baseline to restore to: some baselines are themselves partly products of earlier permitted enhancements, some surgical repairs overshoot the pre-injury level, and some natural baselines are treated as unfair advantages requiring suppression rather than as the neutral point of departure. Fourth, the sport-relativity of the beta-blocker ban seems to presuppose that each sport has a specifiable excellence — the specific capacities it is supposed to test — and that the rules protect that excellence rather than health or fairness in the abstract.

  A colleague of mine has been pushing an alternative anchor that I can't quite evaluate, and I'd like your help testing it against the code: she suggests forgetting medical normality and anchoring the rules instead to a developmental-luck baseline, i.e. permitting an intervention just in case it leaves the athlete's relevant physiological variable where it would have been had they enjoyed a fair share of developmental goods — nutrition, coaching, freedom from untreated injury — and banning interventions that push them past that counterfactual level, including, in principle, requiring downward corrections for athletes whose natural endowment exceeds it. A second thought I've had is that the code might really be tracking not therapy versus enhancement but whether the adaptation is mediated by effort and training versus delivered directly, so that the deep commitment is to something like the moral significance of effort rather than to health or fairness.

  Here is what I want. Reconstruct the implicit theory that this practice actually requires: what view of therapy, of enhancement, of natural advantage, of the point of competition does it only make sense under, and which rival views does it quietly rule out? Be disciplined about three things I care about. (i) Separate what the practice strictly presupposes from what it merely fits well with, and mark the points where it is philosophically underdetermined, so that several quite different theories would license the same rule. (ii) Say where the parts of the practice are pulling in different directions — whether the therapy/enhancement distinction is doing the real work or is a rationalisation for something else, and whether the practice is coherent overall or only locally coherent. (iii) Tell me concretely what would have to change if the anchor were replaced: what would the Prohibited List and the Therapeutic Use Exemption system look like under my colleague's developmental-luck baseline, under a straightforward harm-reduction regime that permits anything safe, and under a pure anti-deception or level-playing-field view — and which items on the current list would collapse, survive, or have to be added. I don't need a map of the literature; I want the analysis.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a philosophy PhD student working on the therapy/enhancement distinction in sports doping regulations. They've provided a detailed analysis of the current anti-doping framework and raised several puzzles about its inconsistencies. Their main goal is to reconstruct the implicit theory behind these rules and test alternative anchors.

  First, I need to identify the core issues they're grappling with. The therapy/enhancement distinction seems context-dependent, as the same intervention is treated differently for athletes versus non-athletes. There's also the inconsistency in permitting some enhancements (like altitude training) while banning others (like EPO) despite similar physiological outcomes. The baseline for "normal function" is problematic due to prior enhancements and natural variations. Plus, sport-specific bans like beta-blockers suggest each sport has a defined excellence it aims to test.

  The user mentions their colleague's developmental-luck baseline idea and their own thought about effort-mediated adaptations. They want to explore how replacing the current anchor would change the rules. They also emphasize three key points: strict presuppositions vs. fits, internal coherence, and concrete changes under alternative anchors.

  I should start by outlining the implicit theory of the current system. It appears the practice presupposes that sports are tests of cultivated natural talents. The "spirit of sport" concept is crucial here, emphasizing virtues like dedication and perseverance. Health is a concern but secondary, as some banned substances aren't particularly harmful, and some permitted methods carry risks. Fairness is tied to effort-mediated excellence rather than equal opportunity.

  For the developmental-luck baseline, I need to think through how it would handle cases like natural high testosterone. Under this view, athletes might be required to reduce their levels to a "fair share" threshold. This could lead to mandatory suppression of natural advantages, which is more extreme than current regulations. Therapeutic Use Exemptions (TUEs) would shift to correcting developmental deficits, but defining "fair share" is inherently vague.

  Under a harm-reduction regime, anything safe would be permitted. This would remove most bans, only restricting genuinely dangerous methods. The Prohibited List would shrink significantly, focusing on acute health risks. TUEs would become irrelevant since medical needs wouldn't require exemptions. However, this might undermine the idea of sport as a test of natural talent and effort.

  A pure anti-deception approach would focus on clandestine enhancements. All performance enhancers might be permitted if disclosed, but deception would be penalized. The List might disappear, replaced by disclosure rules. TUEs would turn into transparency declarations. This could change the ethos of sport, making it more about who can enhance most effectively rather than cultivated abilities.

  The current system's coherence is local but not global. The therapy/enhancement distinction works in medical contexts but falters in sports due to role-dependence. The beta-blocker example shows sport-specific excellences are central, yet the List isn't consistently built around them. Permitted technologies like hypoxic tents versus banned EPO highlight the effort-mediated adaptation principle, but reconstructive surgery that improves performance contradicts this.

  The user's deeper need might be to uncover whether the therapy/enhancement distinction is a smokescreen for other values like preserving sport's narrative or commodification. They might also be exploring if anti-doping is fundamentally about protecting sport as a meritocracy of effort. Testing alternatives reveals that while health and fairness are cited, the core is likely about maintaining a specific concept of human excellence tied to disciplined training.

  I should ensure the analysis distinguishes what's presupposed from what's compatible. For instance, effort mediation isn't explicit but explains discrepancies. Highlighting where the practice is underdetermined, like with natural advantages, shows unresolved tensions. Pointing out internal contradictions, like overshoot surgeries, reveals the system's fragility.

  Concrete changes under each anchor clarify their implications. The developmental-luck baseline might mandate leveling down natural advantages, which is philosophically consistent but practically challenging. Harm-reduction abandons the enhancement concern entirely, focusing only on safety. Anti-deception shifts the focus to transparency, potentially altering sport's nature.

  In conclusion, the current system's implicit theory centers on sport as a test of cultivated natural talent within defined excellences. Alternatives expose that health and fairness are secondary to preserving a particular athletic ethos. The user's colleague's anchor introduces egalitarianism but faces definitional issues, while effort-mediation better explains current distinctions but isn't consistently applied.
answer: |-
  Here’s a disciplined reconstruction of the implicit theory behind anti-doping rules, grounded in your observations and structured around your three requirements. I’ll then test alternative anchors concretely.

  ---

  ### **I. The Implicit Theory of Current Anti-Doping Practice**
  #### **Core Presuppositions**  
  1. **Sport as a Test of "Cultivated Natural Talent"**:  
     - **Presupposition**: Athletic excellence must emerge from *effort-mediated cultivation* of innate potential. The "spirit of sport" (WADA Code’s explicit criterion) is defined as a meritocracy of disciplined training, resilience, and skill—not raw biological advantage or shortcuts.  
     - **Evidence**: Permitted enhancements (altitude tents, caffeine, shoes) require athlete effort/strategy. Banned methods (EPO, steroids) directly manipulate biology without proportional effort. Beta-blocker bans in precision sports protect skill-testing by excluding chemical interference.  
     - **Ruled Out**: Views that sport tests pure biological potential (permitting genetic engineering) or entertainment value (allowing all enhancements if safe).  

  2. **Therapy as Restoration to *Sport-Relevant Baseline***:  
     - **Presupposition**: "Health" is not defined universally but relative to *functional capacity for athletic competition*. A TUE requires restoring an athlete to their *competitive norm*—not general medical normality.  
     - **Evidence**: Corticosteroids for a cyclist’s injury are therapy only if they restore pre-injury *cycling performance*; the same injection for non-athlete is therapy if it restores daily function. Overshot surgical repairs (e.g., Tommy John surgery) are tolerated because they align with sport’s goal of rewarding recovery effort.  
     - **Ruled Out**: Biomedical views of therapy as restoration to species-typical function (e.g., "normal" hormone ranges irrelevant if athlete’s baseline is naturally high).  

  3. **Natural Advantage as Legitimate Only if *Unmodifiable* and *Aligned with Sport-Specific Excellence***:  
     - **Presupposition**: Innate advantages (e.g., height in basketball) are "fair" if (a) not readily alterable and (b) integral to the sport’s purpose. Advantages deemed "modifiable" (e.g., testosterone in DSD athletes) or "alien" to the sport’s essence (e.g., beta-blockers in archery) are suppressible.  
     - **Evidence**: Natural high hematocrit is permitted; synthetic elevation (EPO) is banned. DSD regulations target testosterone specifically in *track events* (where power matters), not all sports.  
     - **Ruled Out**: Egalitarian views (all biological advantages are unfair) or laissez-faire views (all natural advantages are sacrosanct).  

  4. **Health Risk as Necessary but Insufficient for Banning**:  
     - **Presupposition**: Health matters only when intertwined with sport’s integrity. Many permitted methods carry risks (hypoxic tents, surgery), while some banned substances are low-risk (e.g., marijuana). Health is a proxy for "undue shortcut" when paired with performance enhancement.  
     - **Evidence**: Prohibited List requires 2/3 criteria (health + enhancement + "spirit of sport"). Health alone doesn’t trigger bans—e.g., cigarettes aren’t banned.  
     - **Ruled Out**: Pure harm-reduction models (ban only unsafe interventions) or medical paternalism (ban all risk-taking).  

  #### **Points of Underdetermination**  
  - **"Spirit of Sport"**: Compatible with virtue ethics (sport builds character) or Nietzschean excellence (sport celebrates human potential). Both justify effort-centric rules.  
  - **Baseline Relativity**: TUEs’ "normal function" could be individual (pre-injury) or population-based (e.g., hormone ranges). Current practice uses both, creating tension (e.g., DSD cases).  
  - **Natural Advantages**: The system doesn’t specify why *some* biological variations (e.g., Michael Phelps’ lactate metabolism) are celebrated while others (high T in DSD athletes) are suppressed—beyond sport-specificity.  

  #### **Internal Tensions**  
  - **Therapy/Enhancement Distinction as Secondary**: The distinction is **a rationalization**, not the core driver. Real work is done by:  
    - **Effort-Mediation**: Hypoxic tents (effortful) vs. EPO (passive) despite identical outcomes.  
    - **Sport-Specific Excellence**: Beta-blockers banned only where they subvert the sport’s purpose (steady hands in archery, not marathon running).  
  - **Incoherences**:  
    - **Baseline Instability**: Overshot surgeries and prior enhancements (e.g., LASIK >20/20 vision) violate "restoration" logic but are permitted because they align with effort/recovery.  
    - **Natural Advantage Double Standard**: Forcing hormone suppression in DSD athletes contradicts the celebration of other innate advantages (e.g., skeletal muscle fiber distribution).  
  - **Local Coherence, Global Incoherence**: Rules make sense per sport (protecting archery’s skill-testing) but fail universally: no consistent theory of "natural" vs. "artificial."  

  ---

  ### **II. Testing Alternative Anchors**  
  #### **1. Developmental-Luck Baseline**  
  - **Core Principle**: Permit interventions correcting deficits from unjust developmental luck (poor nutrition, coaching); ban those exceeding "fair share" potential.  
  - **Concrete Changes to Rules**:  
    - **TUEs**: Expanded to cover *any* developmental deficit (e.g., TUE for growth hormone if malnourished in childhood).  
    - **Prohibited List**:  
      - **Bans**: Supplements/tech granting advantages beyond "fair share" (e.g., hypoxic tents if athlete grew up at sea level without altitude access).  
      - **Mandatory Reductions**: Natural advantages exceeding "fair share" (e.g., DSD athletes’ T levels lowered further; tall basketball players might face restrictions).  
      - **Collapses**: Sport-specific bans (beta-blockers irrelevant); "health risk" criterion dropped.  
    - **New Additions**: Bans on privileged access (e.g., expensive tech like carbon-fiber shoes if unavailable globally).  
  - **Problems**: Defining "fair share" is intractable (e.g., Is 99th percentile genetics "unfair"?). Permitted enhancements become arbitrary.  

  #### **2. Harm-Reduction Regime**  
  - **Core Principle**: Ban *only* unsafe interventions; permit all safe enhancements.  
  - **Concrete Changes**:  
    - **Prohibited List**: Only genuinely high-risk items (e.g., anabolic steroids, blood doping).  
    - **Survives**: Diuretics (health risk), stimulants in high-risk sports (e.g., cycling).  
    - **Collapses**: Bans on low-risk enhancers (e.g., beta-blockers, EPO if safely monitored). TUE system abolished—no "therapy" distinction.  
    - **Permitted**: All safe tech (hypoxic tents, gene editing), caffeine, even synthetic testosterone if medically supervised.  
  - **Problems**: Sport becomes an enhancement arms race; "spirit of sport" erased. Cycling records broken via EPO would stand if no acute harm.  

  #### **3. Pure Anti-Deception / Level Playing Field**  
  - **Core Principle**: Ban *clandestine* enhancements; permit all *transparent* ones. Focus on equal access.  
  - **Concrete Changes**:  
    - **Prohibited List**: Replaced by disclosure rules. No substance/method banned if declared.  
    - **TUEs**: Abolished; replaced by "declaration of use" for medical needs.  
    - **Enforcement**: Sanctions only for non-disclosure (e.g., secret steroid use).  
    - **Collapses**: Distinction between therapy/enhancement; sport-specific bans.  
    - **New Focus**: Mandatory public logs of all interventions (e.g., "Athlete X uses EPO").  
  - **Problems**: Advantages to wealthier athletes/teams; sport becomes a contest of resource allocation, not training.  

  ---

  ### **Conclusion: What the Practice Reveals**  
  - **Implicit Theory**: Anti-doping rules presuppose **sport as a narrative of human achievement through cultivated effort**, where biology is a "talent floor" but not a determinative ceiling. The therapy/enhancement distinction is a proxy for **whether an intervention respects effort-mediated excellence** within a sport’s defined purpose.  
  - **Quietly Ruled Out**:  
    - **Biomedical egalitarianism** (all should compete on equal biological footing).  
    - **Radical transhumanism** (sport as a showcase for enhancement tech).  
  - **Underdetermined**: Why *some* biological advantages (e.g., aerobic capacity) are sacred while others (hormones) are contested. This gap leaves room for cultural bias.  
  - **Anchor Replacement Impact**:  
    - **Developmental-luck** collapses sport-specificity and mandates unnatural suppression.  
    - **Harm-reduction** abolishes the "spirit of sport" for consumer safety.  
    - **Anti-deception** turns competition into transparent enhancement auctions.  

  **Final Note**: The system’s endurance suggests its core function is not health/fairness but **preserving sport’s mythos of "earned excellence."** The inconsistencies you identify arise where this mythos conflicts with biomedical reality (e.g., overshot surgeries) or social values (e.g., DSD debates). To resolve these, the practice would need to openly admit that "therapy" is code for *"compatible with the effort narrative"*—not medical necessity.
