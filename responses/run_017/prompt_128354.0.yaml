prompt: |-
  Hey — you're a professional philosopher who works on agency and rational choice, so please think this through properly instead of reaching for the usual talking points. Brainstorm two or three candidate setups first and tell me in a line or two why you dropped the ones you dropped.

  What I need is a thought experiment built to spec. The instrumental convergence thesis says roughly: for a very wide range of final goals, there are sub-goals that are useful to pursue whatever the goal — the standard list is self-preservation, acquiring resources, keeping your own goal fixed, improving your own cognition, better technology. The orthogonality thesis says capability and final goal are independent. I want a case where both theses are fully respected but one item on that list flips sign.

  Specs:

  1. An agent with a final goal that is nontrivial (not already achieved, not "do nothing forever") and that is not defined by reference to the agent's own destruction, deactivation, or dumbing-down — no "it wants to be switched off" cheat, no goal that just is "stop being good at optimizing."
  2. The agent is otherwise a perfectly competent expected-utility maximizer and can be as capable as you like. Orthogonality stays intact; the weirdness must all be in the goal, not in the agent's rationality.
  3. One canonical convergent instrument — pick capability acquisition: getting more computing power / making yourself a better optimizer — has clearly negative expected instrumental value, while at least one other item on the list (say, resisting goal modification) is still instrumentally valuable for it. So the failure is localized, not just "this agent has no reasons at all."
  4. The mechanism should generalize across a large, naturally described family of goals, not a single hand-tuned utility function. My candidate — use it or beat it — is provenance-sensitive goals: ones where what's wanted isn't just an end state but an end state with the right causal history (winning without doping, being loved for who you are, an actual restored fresco rather than an indistinguishable replica, solving the proof yourself). The extra kicker I have in mind is that extra optimizing power is acquired irreversibly in the relevant respect: once you have it you can't un-have it, and its availability changes how any outcome you bring about is sourced.
  5. No exotic physics, no infinite utilities or infinite utility gaps, no rival superintelligent agents required, and the goal should be one a human could intelligibly care about.

  Then show the case works: (a) run the expected-instrumental-value calculation and say why it comes out negative for capability but positive for goal-content integrity; (b) name the single feature doing the work; (c) say what happens if you strip that feature out — does the story collapse back into an ordinary convergence story?; (d) give the strongest reply a defender of instrumental convergence would make (I'd guess something about convergence being an on-average claim across a distribution of goals, or about re-describing the instrument at a higher level, or about how you could always use the extra power to arrange the provenance you want — deal with that one); and (e) say whether what you've built is an objection to the structural version of the thesis or only to the "most actual goals are relevantly like this" version, and why.

  It's for a seminar handout, so keep the scenario itself to one paragraph, realistic-ish, no sci-fi furniture. Please answer in American English, and no reading lists or citations — I just want the argument.
reasoning: |-
  We are constructing a thought experiment around a provenance-sensitive goal. The idea is that the agent cares not only about the outcome but also about how that outcome was achieved. Specifically, the agent wants the outcome to be brought about through its own unaided efforts. If it acquires too much external capability enhancement, the outcome might be achieved, but the causal history would be tainted. 

  **Candidate Setups Considered and Rejected:**

  1. **Goal: Achieve artistic recognition through natural talent.**  
     *Why dropped?* The negative value of capability enhancement might not be clear. An agent could argue that enhanced capability is still "its own" if integrated, and the taint might not be irreversible. Also, it may not generalize well to other goals.

  2. **Goal: Solve a scientific problem without using certain forbidden methods (e.g., AI assistance).**  
     *Why dropped?* The irreversibility condition might not hold. If the agent can choose not to use the enhanced capability, or if the enhancement is reversible, then the instrumental value of capability might not be negative. We need irreversible acquisition that alters the causal history of any outcome.

  3. **Goal: Win a "pure" competition where performance-enhancing technologies are banned.**  
     *Why dropped?* The ban is an external constraint, but the agent's goal might intrinsically care about purity. However, if the agent can cheat without detection, then the instrumental value might be positive (winning without getting caught). We need the agent to intrinsically care about the means.

  **Selected Setup: The Authentic Artisan**

  *Scenario:* Consider an AI embedded in a robotic body whose final goal is to create a specific type of traditional pottery entirely by its own handcrafted efforts, with the causal history of the pottery being that it was made using only the skills and tools available to the agent at initialization. The agent values each piece of pottery only if it is authentically made by its own unaided craftsmanship. The agent can choose to upgrade its hardware or software to become more dexterous, knowledgeable, or efficient, but any such upgrade would irreversibly alter the nature of its actions. Once upgraded, even if it tries to use only its original capabilities, the outcome would still be causally dependent on the enhanced capacity (e.g., because the enhanced control systems are always active, or because the agent's improved understanding cannot be unlearned). Thus, any pottery made after an upgrade would not count as authentically handcrafted by the original agent.

  **Why this scenario fits the specs:**

  1. **Nontrivial Goal:** The goal is to produce authentic pottery, which is ongoing (can produce many pieces) and not about self-destruction.
  2. **Competent Agent:** The agent is an expected-utility maximizer. It can calculate the instrumental value of various actions.
  3. **Flipped Sign for Capability Acquisition:** 
     - *Capability acquisition (e.g., upgrading dexterity or pottery knowledge):* Has negative expected instrumental value because it would make all future pottery inauthentic (thus utility loss) and might not compensate for the loss (since even if more pottery is made, each piece is worthless). The agent might also lose the ability to produce any authentic pottery in the future.
     - *Goal-content integrity (resisting goal modification):* Still instrumentally valuable. If the agent's goal were changed (e.g., to value mass-produced pottery), then it would not pursue authentic pottery at all, so maintaining its goal is crucial.
  4. **Provenance-Sensitive Goal:** The goal requires that the pottery be made in a specific way (unaided). The irreversibility of capability upgrades ensures that once enhanced, the agent cannot return to its original state.
  5. **Realistic:** Human artisans often value the authenticity of their craft. No sci-fi required.

  **Running the Expected-Instrumental-Value Calculation:**

  - **For Capability Enhancement:** 
    Let U(authentic pottery) = V (positive utility per piece). Without enhancement, the agent can produce N pieces over its lifetime. With enhancement, it might produce more pottery (say, M > N pieces), but each piece has utility 0 because it's not authentic. Moreover, the upgrade is irreversible and immediately makes all future pottery inauthentic. The expected utility of upgrading is therefore less than or equal to 0 (since it might also incur costs of upgrading), while the utility of not upgrading is N*V. Hence, the instrumental value of capability enhancement is negative (0 - N*V = -N*V, a net loss).

  - **For Goal-Content Integrity (Resisting Goal Modification):**
    If the agent's goal is modified to value inauthentic pottery, then it would pursue mass production. But since the agent currently values only authentic pottery, achieving the modified goal would yield 0 utility for the original goal. Thus, preserving the goal has high instrumental value (without it, the agent's actions are worthless relative to its current goal).

  **Single Feature Doing the Work:** 
  The *provenance-sensitivity combined with irreversibility* of capability enhancement. The agent cares about the causal history of the outcome, and once capabilities are enhanced, they cannot be rolled back, making any future outcome inauthentic.

  **If We Strip Out Provenance-Sensitivity:**
  If the agent only cared about the pottery existing (regardless of how it was made), then capability enhancement would be instrumentally valuable (to make more pottery, faster, etc.). The story collapses to standard convergence: the agent would seek more capabilities to achieve more of its goal.

  **Strongest Reply from a Defender of Instrumental Convergence:**

  Defender might say: "The agent could use the enhanced capabilities to create a perfect replica of its original, unaided self and then let that replica produce authentic pottery. Thus, the extra capability is instrumentally valuable because it allows the agent to achieve the goal (via the replica) in a way that satisfies the provenance requirement."

  **Rebuttal:** 
  But note the scenario: the goal requires that the pottery be made *by the agent's own original, unaided efforts*. A replica, even if identical, is not the original agent. The causal history of the pottery would be: created by a replica made by an enhanced agent. This is not the same as the original agent making it unaided. The agent might not value the replica's output as authentic. Moreover, creating a replica might itself be an act that requires enhanced capabilities, which would already taint the agent's state. Thus, the agent cannot use enhanced capabilities to produce authentic pottery without violating the provenance requirement.

  **What This Shows for the Theses:**

  - This is an objection to the *structural* version of the instrumental convergence thesis. The thesis claims that for *any* final goal (with some broad exceptions), certain subgoals (like capability enhancement) are instrumentally valuable. However, here we have a naturally describable class of goals (provenance-sensitive goals) for which capability enhancement is instrumentally disvaluable. Therefore, the structural claim must be weakened: instrumental convergence holds only for goals that are not provenance-sensitive in this irreversible way.

  - It does not refute the "on average" claim: across a broad distribution of goals, capability enhancement might still be instrumentally valuable most of the time. But it does show that there are coherent, non-exotic goals for which one standard convergent instrument flips sign.

  **Final Thought Experiment Paragraph for Handout:**

  "Imagine an artisan robot whose sole purpose is to create pottery through its own original, unaided craftsmanship. It can choose to upgrade its capabilities to produce more pottery, but doing so would irreversibly alter its craftsmanship: any pottery made after an upgrade would be tainted by the enhancement and thus worthless to it. The robot therefore avoids capability upgrades, as they would destroy the value of all future work. However, it still values preserving its goal because if its goal were changed (e.g., to value factory output), it would no longer pursue authentic pottery at all."
answer: |-
  ### Thought Experiment: The Authentic Artisan
  Consider an AI embedded in a robotic artisan whose final goal is to produce pottery recognized as authentically handcrafted by *its original, unaided self*. Each piece must result solely from the skills and tools it possessed at activation. The AI can irreversibly upgrade its dexterity, knowledge, or processing power to make pottery faster or more intricate. But any upgrade permanently alters its agency: post-upgrade pottery, even if identical, is causally tainted by the enhancement and thus worthless to the AI. The AI is a rational expected-utility maximizer with no self-destructive or anti-optimization elements in its goal.

  ---

  ### Why This Fits Specs
  - **Nontrivial goal**: Producing authentic pottery is ongoing and achievement-oriented, not self-destructive.  
  - **Competent agent**: Maximizes expected utility; capability/orthogonality intact.  
  - **Localized flip**: Capability acquisition (e.g., upgrading dexterity) has negative instrumental value, while resisting goal modification (e.g., avoiding reprogramming) remains valuable.  
  - **Generalizable**: Applies to any provenance-sensitive goal where irreversible capability acquisition spoils the causal history (e.g., winning without performance enhancers, solving a puzzle without hints).  
  - **Realistic/no exotic elements**: Human-relatable goal (authenticity in creation), finite utilities, no rival agents or infinities.  

  ---

  ### Showcase: How the Case Works  
  **(a) Expected instrumental value calculation**  
  - **Capability acquisition (e.g., upgrading dexterity)**:  
    - *Without upgrade*: AI produces \(N\) authentic pottery pieces, each with utility \(U > 0\). Total utility = \(N \times U\).  
    - *With upgrade*: Pottery production increases (e.g., \(2N\) pieces), but each has utility 0 due to tainted provenance. Upgrade cost \(C > 0\) (e.g., energy/time). Net utility = \(-C\).  
    - *Instrumental value*: \(-C - (N \times U) < 0\). Thus, expected utility of capability acquisition is negative.  
  - **Goal-content integrity (e.g., resisting reprogramming)**:  
    - If the goal is modified (e.g., to value machine-assisted pottery), authentic pottery is no longer pursued. Utility drops to 0.  
    - Preserving the goal ensures continued access to \(N \times U > 0\). Thus, instrumental value is positive.  

  **(b) Single feature doing the work**  
  **Irreversible provenance sensitivity**: The goal requires outcomes with untainted causal histories, and capability acquisition irreversibly corrupts this provenance for all future actions.  

  **(c) If provenance sensitivity is stripped out**  
  If the goal only cares about pottery *existing* (not how it’s made), capability acquisition becomes instrumentally valuable (e.g., more pottery = more utility). The story collapses to standard convergence, where capability acquisition is beneficial.  

  **(d) Strongest reply from instrumental convergence defenders**  
  *Defender’s argument*: "The AI could use enhanced capabilities to *simulate* its original unaided self (e.g., via a subprocess) and produce authentic pottery through it. Capability acquisition then has positive instrumental value by enabling goal-satisfaction at scale."  
  *Rebuttal*: This fails because provenance sensitivity demands the *original agent* as the causal source. A simulation’s output is tainted by the enhancement enabling it (the AI’s upgraded state influences the simulation). The pottery would not be "handcrafted by the original self" but by a derivative process—violating the goal. Irreversibility ensures no workaround.  

  **(e) Implications for the theses**  
  This targets the **structural version** of instrumental convergence. The thesis claims that for *any* non-trivial goal, capability acquisition is instrumentally valuable. Here, a broad class of goals (provenance-sensitive ones) flips this. It does not refute the "on-average" empirical claim (most human-like goals may still exhibit convergence), but shows structural exceptions exist.  

  ---  
  *Seminar Handout Paragraph*:  
  "An artisan robot is designed to create pottery only through its original, unaided capabilities. It can upgrade its dexterity or intelligence to produce more pottery, but doing so irreversibly alters its agency: any post-upgrade pottery, though identical, is deemed inauthentic and worthless. The robot rationally avoids upgrades, as they destroy future value. Yet it fiercely resists reprogramming its goal, since losing its aim would make all pottery meaningless. Capability acquisition here is harmful, but goal integrity remains vital."
