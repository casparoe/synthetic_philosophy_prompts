prompt: |-
  Im recording an episode next week with a philosopher who's just finished a book on Harsanyi's aggregation theorem, arguing that it basically vindicates utilitarianism — her slogan is 'grant Pareto and expected-utility rationality for the social ranking and the weighted-sum form falls out for free.' I want 6–8 questions that dont let her just restate the theorem, each with one follow-up written against the answer she's most likely to give. Press her on: (a) since each person's vNM utility function is only pinned down up to positive affine transformation, the weights can just be absorbed into however you rescale each person's function, so is 'equal weights' any constraint at all — and if it isnt, does she have to fall back on the equiprobability / veil-of-ignorance version to get anything egalitarian, and is that fallback circular? (b) a fix I've seen people reach for is normalizing everyone's function so that their own worst-to-best span runs 0 to 1 before adding — but doesnt that quietly build in the claim that everyone's span is the same size, i.e. a pretty strong interpersonal comparison? (c) her argument needs the ex ante version of Pareto rather than the ex post one, so what does she say to someone who thinks that's the wrong Pareto? (d) as usually stated the result assumes a fixed set of people, so what happens when the lotteries can change who exists. And one last thing I keep going back and forth on: I used to think the weighted-sum form was neutral between utilitarianism and prioritarianism since the weights are arbitrary — but a fixed weight attached to a person isn't the same as extra weight for being worse off, and squashing someone's function to get priority looks like it breaks the Pareto condition. Turn that into a question pitched so she can't just answer 'yes, the theorem is neutral between the two.'
reasoning: |-
  Okay, the user is preparing for an interview with a philosopher about Harsanyi's aggregation theorem and utilitarianism. They need 6-8 questions that push beyond restating the theorem, with follow-ups designed to challenge predictable answers. The user specified four key pressure points: (a) the arbitrariness of weights due to vNM scaling and whether "equal weights" means anything, (b) normalization implying interpersonal comparisons, (c) ex ante vs ex post Pareto, and (d) variable populations. They also want a question about utilitarianism vs prioritarianism that avoids letting the philosopher hide behind the theorem's neutrality.

  Hmm, the user is clearly sophisticated—they're fluent in welfare economics jargon and know exactly where the philosophical tensions lie. Their hidden frustration with superficial treatments of Harsanyi is palpable. They're not just fact-checking; they want to expose whether the philosopher's "vindication of utilitarianism" claim survives scrutiny. The follow-up traps suggest they've pre-rehearsed counterarguments and want the philosopher cornered into substantive engagement.

  For part (a): The core irony is that vNM scaling makes weights arbitrary, yet egalitarians need non-arbitrary weights. The follow-up should force admission that either weights are meaningless or they smuggle in interpersonal comparisons. I'll craft a question contrasting "equal weights" as convention versus ethical commitment, then follow up by asking if the veil-of-ignorance escape is circular—since it presumes the impartiality it tries to justify.

  For (b): Normalizing utility ranges to [0,1] pretends to avoid interpersonal comparisons but implicitly claims all lives have equal moral "depth." The follow-up must highlight that judging ranges comparable is itself a comparison. I'll question whether this dissolves the distinction between intra- and interpersonal utility.

  On (c): Ex ante Pareto (respecting preferences over lotteries) is essential for Harsanyi but controversial—it allows imposing risks on others against their interests. The follow-up should press whether this prioritizes decision-theoretic elegance over moral relevance.

  For (d): Fixed-population assumptions collapse when existence is probabilistic. The follow-up should demand specifics: Does she stretch Harsanyi or abandon it? Name-drop Blackorby's critique to prevent evasion.

  Finally, the utilitarianism vs prioritarianism angle: Emphasize that prioritarianism distorts vNM utilities via concave transformations, which violates Pareto. The follow-up should challenge whether calling weights "arbitrary" papered over this conflict.

  The questions need surgical precision—no let-up, no escape hatches. Each follow-up preempts the obvious dodge. User wants blood on the floor, not polite academia.
answer: |-
  Here are 8 incisive questions targeting her core claims, designed with anticipated answers and sharp follow-ups:

  1.  **Question (Challenging Weight Significance):** "You claim the weighted-sum form 'vindicates utilitarianism,' but since each individual's vNM utility function is only unique up to positive affine transformation, the social weights seem fundamentally arbitrary. Any 'equal weights' assignment can be achieved simply by rescaling individual utility functions differently. Doesn't this mean the theorem imposes absolutely *no* meaningful constraint requiring equal consideration of persons, contrary to the egalitarian spirit often associated with utilitarianism?"
      *   **Likely Answer:** "The theorem shows the *form* is utilitarian. Equal weights expresses impartiality, which we can justify separately via the veil of ignorance or moral argument. The theorem provides the structure; ethics provides the weights."
      *   **Follow-Up:** "If the weights *within the theorem itself* are arbitrary and can be manipulated via rescaling, doesn't that mean Harsanyi's result, *on its own*, is actually compatible with *any* distribution of ethical weight (e.g., heavily favoring the rich), as long as it's linear? Calling this 'vindication' for a specific egalitarian utilitarianism seems like a bait-and-switch unless you have an *independent, non-circular* argument for why the veil-of-ignorance scaling (or any specific scaling) is uniquely privileged by the theorem?"

  2.  **Question (Normalization & Interpersonal Comparison):** "A common response to the scaling problem is to normalize each person's vNM utility function so that their worst outcome = 0 and best outcome = 1 *before* applying equal weights and summing. But doesn't this normalization procedure implicitly assume that the *difference* between the worst and best possible states is morally equivalent across individuals – a substantive and highly contestable form of interpersonal utility comparison?"
      *   **Likely Answer:** "Yes, it involves interpersonal comparison, but it's a minimal and necessary one to make sense of equal concern. We're comparing the ranges of possible welfare *within* a life to anchor the scales."
      *   **Follow-Up:** "Doesn't claiming that 'minimizing suffering for Alice is equally important as minimizing suffering for Bob' (implied by the 0-1 span) require exactly the kind of strong interpersonal comparison that vNM utilities were designed to *avoid*? Isn't this normalization quietly smuggling in a prior ethical judgment – that the 'intensity capacity' or 'welfare range' of all individuals is morally uniform – which is precisely what the theorem was supposed to derive from weaker assumptions like Pareto and rationality?"

  3.  **Question (Ex Ante vs. Ex Post Pareto):** "Harsanyi's theorem crucially relies on the *ex ante* Pareto principle: if every individual *expects* to be better off under lottery A than lottery B, then society should prefer A. But critics (like Marc Fleurbaey, for instance) argue the morally relevant principle is *ex post* Pareto: if, in every possible state of the world, no one is worse off and someone is better off, then society should prefer that prospect. Why should we accept that rational individual preferences over *gambles* (ex ante Pareto) should constrain the *social* evaluation in a way that overrides the actual distribution of outcomes across people (ex post) when the two conflict?"
      *   **Likely Answer:** "Respecting individual rationality under uncertainty is fundamental. Denying ex ante Pareto means overriding individuals' own rational assessments of their prospects based on their private information and risk attitudes."
      *   **Follow-Up:** "But doesn't ex ante Pareto potentially mandate socially dominated outcomes? Imagine a gamble where Alice faces a 50/50 risk of a huge loss or a small gain, while Bob gets a certain small gain. Alice might rationally accept the gamble (ex ante better for her), while Bob is unaffected. Ex ante Pareto says society must prefer this gamble. Yet, in half the outcomes, Alice is ruined and Bob gains little – a clearly worse *distribution* than alternatives. Doesn't prioritizing ex ante preferences here privilege individual risk-taking over collective distributive justice, suggesting Harsanyi's axioms *aren't* neutral?"

  4.  **Question (Variable Populations):** "The standard Harsanyi theorem assumes a fixed population. How does your vindication of utilitarianism handle cases where the social alternatives involve different sets of people existing – for example, policies affecting future generations or resource allocation decisions impacting potential lives? Does the weighted-sum form simply collapse, or does it require ethically problematic assumptions about comparing the utility of existence to non-existence?"
      *   **Likely Answer:** "This is a significant extension. One approach is to define a 'critical level' of utility below which adding a life isn't desirable, but integrating this neatly with the original theorem is complex and an area of active research."
      *   **Follow-Up:** "Given this complexity and the lack of a canonical variable-population extension within the strict Harsanyi framework, doesn't claiming the theorem 'vindicates utilitarianism' significantly overreach? If the core result breaks down precisely when considering the fundamental question of *who counts* as a person to whom utility applies, doesn't this undermine its claim to provide a foundational justification for utilitarianism as a comprehensive moral theory?"

  5.  **Question (Utilitarianism vs. Prioritarianism - Core Tension):** "You suggest the weighted-sum form vindicates utilitarianism. Yet, prioritarianism also often uses a weighted sum (Σ w_i * u_i), but with weights `w_i` that depend on the person's *absolute level* of utility to prioritize the worse off. How does Harsanyi's theorem, which derives weights assigned to *persons* (`a_i`) independent of their utility level, rule out this prioritarian interpretation? Isn't the theorem formally compatible with both?"
      *   **Likely Answer:** "You're right, the theorem *is* formally compatible with assigning fixed weights `a_i` to persons. Prioritarianism requires variable weights depending on absolute utility levels, which breaks the linear aggregation form derived under the theorem's axioms. The weighted sum Harsanyi gives has constant `a_i`."
      *   **Follow-Up:** "But prioritarianism can be implemented by applying a concave transformation *to* each individual's vNM utility *before* summing them with fixed weights: Σ a_i * φ(u_i), where φ is concave. This seems like a 'weighted sum' of transformed utilities. Why doesn't *this* satisfy the theorem's requirements? Doesn't the problem lie in the fact that φ(u_i) is *no longer* a vNM utility function (it violates linearity in probabilities), meaning the individual 'utility' inputs into the social aggregation violate Harsanyi's own expected utility rationality axiom for individuals?"

  6.  **Question (Pareto & Prioritarianism):** "Building on the prioritarianism point: If we *do* try to incorporate priority by transforming individual utilities (say, applying a concave function φ), doesn't this immediately violate the *ex ante* Pareto principle you rely on? If two individuals have different risk attitudes, they might rank lotteries differently based on φ(u_i) than on their original vNM u_i. If society uses φ(u_i) and an individual prefers lottery A over B using their *own* vNM u_i, but society (using φ(u_i)) prefers B, haven't we directly violated ex ante Pareto?"
      *   **Likely Answer:** "Exactly! That's why prioritarianism, as described, is incompatible with Harsanyi's axioms. Respecting individual vNM preferences (ex ante Pareto) and having social expected utility together *force* the aggregation to be linear in the individual vNM utilities. Any concave transformation breaks this."
      *   **Follow-Up:** "So, doesn't this mean Harsanyi's theorem, far from being neutral, actually poses a *dilemma*? We must *either*: 1) Accept linear aggregation with fixed person-weights (utilitarianism) and reject giving priority to the worse off solely based on their absolute level, *or* 2) Reject either ex ante Pareto or social expected utility rationality to accommodate prioritarianism? Isn't the theorem actively *hostile* to prioritarianism, rather than neutral?"

  7.  **Question (The "For Free" Claim):** "Your slogan says the weighted-sum form falls out 'for free' from Pareto and social rationality. But doesn't the need to resolve the scaling ambiguity (via normalization or the veil) and the choice between ex ante/ex post Pareto represent significant *additional ethical commitments* required to get from the mathematical form to a substantive utilitarian conclusion? Isn't calling it 'free' misleading?"
      *   **Likely Answer:** "The core mathematical derivation *is* remarkably powerful and minimal. While interpretation requires care, the theorem shows that rational social choice under uncertainty respecting individual preferences *must* take this specific mathematical form."
      *   **Follow-Up:** "But if the 'weights' in that form are arbitrary (as per scaling) and the 'utilities' require strong interpersonal comparisons to give the sum egalitarian meaning, and the Pareto principle used is contestable, isn't the substantive utilitarian conclusion *heavily* dependent on these contentious auxiliary choices? Doesn't 'vindication' require showing these choices are *compelled* by the theorem or minimal morality, rather than being significant add-ons?"

  8.  **Question (The Role of the Veil):** "You mentioned the veil of ignorance as a way to justify equal weights. But if the theorem's weights are arbitrary without the veil, and the veil itself requires assuming impartiality (treating all positions as equally likely *and* morally equivalent), isn't using the veil to justify equal weights within the Harsanyi framework circular? Aren't you assuming the impartial egalitarianism you're trying to derive?"
      *   **Likely Answer:** "The veil is a heuristic device for moral reasoning *separate* from the theorem. The theorem provides the functional form; the veil provides an ethical justification for selecting equal weights within that form, based on fairness."
      *   **Follow-Up:** "But if Harsanyi's theorem *alone* doesn't constrain the weights, doesn't this mean it fails to provide a *foundational* justification for utilitarianism? Doesn't it just show that *if* you are a welfarist (caring only about utilities) *and* accept ex ante Pareto *and* social EU rationality *and* have resolved interpersonal comparisons (e.g., via the veil), *then* you get utilitarianism? Isn't the heavy lifting being done by the veil/impartiality assumption *outside* the theorem, meaning the theorem itself doesn't 'vindicate' utilitarianism so much as provide a compatible mathematical structure once other big ethical premises are accepted?"

  These questions force engagement beyond restating the theorem, pressing on the genuine philosophical tensions surrounding scaling, interpersonal comparability, the nature of Pareto, population ethics, the distinction from prioritarianism, and the justification for equal weights. The follow-ups are designed to cut off easy escape routes and demand deeper justification for her interpretation. Good luck with the interview!
