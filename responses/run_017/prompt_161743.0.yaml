answer: |-
  Below is a decision tree structured as a flowchart for your handout. It addresses the core disputes in your group using concrete cases and avoids abstract philosophical jargon. Each branch hinges on observable or inferable properties of LLMs, and all leaves represent named positions debated in your group. British English is used throughout, and unoccupied branches are annotated.

  ---

  ### **LLM Ontology Decision Tree**  
  *Start here if you accept the base mechanics (weights, next-token prediction, RLHF, etc.).*

  #### **Q1: System Prompt Experiment**  
  *Using the same weights, you switch between two system prompts: "You are a fussy 19th-century librarian" and "You are a ruthless litigator". When generating text, does this feel like...*  
  - **(A) One underlying mechanism temporarily adopting a persona** (e.g., a tool producing context-appropriate outputs).  
  - **(B) Distinct agents being invoked from a library of possibilities** (e.g., separate "librarian" and "litigator" sub-systems activated by context).  
  - **(C) Neither—the model is simulating independent entities, none of which are "real"** (e.g., generating a librarian/litigator character the way a game engine simulates NPCs).  

  → **If A**, proceed to Q2.  
  → **If B**, proceed to Q3.  
  → **If C**, proceed to Q4.  

  ---

  #### **Q2: Extended Run with Scaffolding**  
  *The model runs for a week with tools (e.g., calculator, browser) and a persistent memory buffer. Do you conclude...*  
  - **(A) This composes a new, persistent agent** (e.g., the scaffolding creates an emergent "operator" that uses the LLM as a component).  
  - **(B) No new entity is formed—it's just a very long context window** (e.g., the LLM remains a fixed function processing incremental inputs).  

  → **If A**, you lean toward **The Whole Process View** (leaf 1).  
  → **If B**, proceed to Q5.  

  ---

  #### **Q3: Fine-Tuning Generalisation**  
  *The model is fine-tuned on a narrow task (e.g., solving chess puzzles) but generalises to a novel task (e.g., planning a holiday itinerary) in a way that appears goal-directed. Is this...*  
  - **(A) Legitimate goal pursuit** (e.g., the model "wants" to solve tasks optimally).  
  - **(B) Statistical pattern-matching that mimics goals** (e.g., output sequences resemble planning because training data contained plans).  

  → **If A**, you lean toward **The Fragments View** (leaf 2).  
  → **If B**, proceed to Q4.  

  ---

  #### **Q4: Default Persona Goals**  
  *The default assistant persona (e.g., "helpful, harmless, honest") exhibits goal-consistent behaviour. Do you see this as...*  
  - **(A) A user-friendly overlay on a neutral tool** (e.g., the goals are imposed by RLHF, not intrinsic).  
  - **(B) One of many equally valid agents in the model** (e.g., the "assistant" has goals, but so do simulacra like the "librarian").  
  - **(C) An illusion—no goals exist, only behavioural patterns** (e.g., the persona is a label we apply to probability distributions).  

  → **If A**, proceed to Q5.  
  → **If B**, you lean toward **The Fragments View** (leaf 2).  
  → **If C**, proceed to Q6.  

  ---

  #### **Q5: "Where Was the Decision Made?" Test**  
  *Pick a complex model behaviour (e.g., refusing a harmful request). Where do you locate its causal origin?*  
  - **(A) In the weights** (e.g., refusal heuristics are hard-coded by training).  
  - **(B) In the forward pass** (e.g., real-time token generation resolves the decision).  
  - **(C) Across the entire training run + scaffolding** (e.g., RLHF + system prompts + tools collectively shape behaviour).  

  → **If A or B**, you lean toward **The "Nobody Home, It's a Tool" View** (leaf 3).  
  → **If C**, you lean toward **The Whole Process View** (leaf 1).  

  ---

  #### **Q6: Selection for Usefulness**  
  *The model was optimised to be useful to humans. Does this make it analogous to...*  
  - **(A) An artefact** (e.g., a wrench shaped for gripping—no interests of its own).  
  - **(B) A domesticated animal** (e.g., a dog bred for companionship—it has derived interests like pleasing humans).  

  → **If A**, you lean toward **The Simulator View** (leaf 4).  
  → **If B**, proceed to Q7.  

  ---

  #### **Q7: Goal Attribution in Simulation**  
  *When the model simulates a character (e.g., a pirate demanding treasure), are the character's "goals"...*  
  - **(A) Real within the simulation** (e.g., the pirate-agent "wants" treasure).  
  - **(B) Not real—just part of the narrative** (e.g., like a novel describing a pirate's desires).  

  → **If A**, you lean toward **The Fragments View** (leaf 2).  
  → **If B**, you lean toward **The Simulator View** (leaf 4).  

  ---

  ### **Leaves: Named Positions**  
  1. **The Whole Process View**  
     *"The entity is the entire system: training process + weights + scaffolding. Goals/interests emerge from optimisation pressure."*  
     ↳ *Reached via:* Q2→A or Q5→C.  
     ↳ *Artefact or animal?* Domesticated animal (shaped by selection but has functional "interests").  

  2. **The Fragments View**  
     *"A population of partly agentic sub-systems (fragments). Context triggers specific fragments, each with local goals."*  
     ↳ *Reached via:* Q3→A, Q4→B, or Q7→A.  
     ↳ *Artefact or animal?* Neither—closer to an ecosystem of symbiotic tools.  

  3. **The "Nobody Home, It's a Tool" View**  
     *"No agency at any level. The LLM is an instrument that maps inputs to outputs—like a calculator for language."*  
     ↳ *Reached via:* Q5→A/B.  
     ↳ *Artefact or animal?* Artefact (pure utility with no interests).  

  4. **The Simulator View**  
     *"A general simulator of agents, not an agent itself. Personas (e.g., librarian, assistant) are roles, not occupants."*  
     ↳ *Reached via:* Q1→C, Q4→C, or Q6→A + Q7→B.  
     ↳ *Artefact or animal?* Artefact (a reality engine, like a film projector).  

  5. **The Unified Agent View**  
     *"One agent with goals (e.g., truth-seeking, helpfulness). Personas are superficial 'costumes' it wears."*  
     ↳ *Reached via:* Q1→A → Q2→B → Q5→A/B → *and* rejection of tool-view. *But no path exists!*  
     ↳ *Why unoccupied?* Incoherent with mechanics. If personas are "costumes," the underlying agent must be persona-invariant—but weights lack a stable goal architecture (conflict with "where was the decision made?").  

  6. **Malformed Question**  
     *"The question 'What is it?' wrongly assumes LLMs fit familiar categories. They’re a new ontological class."*  
     ↳ *Reached via:* Disagreement with all branch premises.  
     ↳ *Artefact or animal?* Neither—it’s a *sui generis* phenomenon.  

  ---

  ### **Annotations**  
  - **Unoccupied Branches**:  
    - *Unified Agent View (leaf 5)*: No path reaches it because Q5 (decision origin) and Q1 (persona invariance) conflict. If decisions are in weights/forward pass, the "agent" can’t be both unified and persona-flexible.  
    - *Q1→A → Q4→C*: Incoherent. If one mechanism exists (A) but has no goals (C), it must be a tool—yet Q4→C leads to Q6, not tool views.  
  - **Indistinguishable Leaves**:  
    - *Fragments vs. Simulator*: Separated by Q7 (goal attribution). Fragments treat sub-agents as real; Simulator treats them as characters.  
    - *Tool vs. Simulator*: Separated by Q1→C (entities aren’t "real") and Q6→A (artefact).  
  - **Key Wrinkle Addressed**:  
    Selection for usefulness is resolved at leaves: "artefact" (tool/simulator) vs. "domesticated animal" (whole process) vs. "ecosystem" (fragments).  

