  We are going to create a decision tree that starts from the basic mechanics of LLMs and leads to various named positions on the nature of LLMs. The tree will be based on concrete cases and questions that can be answered without presupposing a particular view.

  Key Cases/Examples to Use:
  1. The same weights behind different system prompts (e.g., "fussy 19th-century librarian" vs. "ruthless litigator").
  2. The model run for a week with tools and a memory buffer (does this compose a new object?).
  3. Fine-tuning on a narrow task that generalizes to a different one in a way that looks planned.
  4. The default assistant persona and its apparent goals, noting that it's just one character among many.
  5. The "where was the decision made?" question: for a given behavior, was it in the weights, the forward pass, or the whole training run?

  Desired Leaves (Positions):
  - Simulator view (many characters, no privileged one)
  - Agent with goals view
  - "Nobody home, it's a tool" view
  - Population of partly agentic fragments
  - The whole process (training, weights, scaffolding) as the candidate
  - The question is malformed

  We'll also consider the artefact vs. domesticated animal analogy in terms of selection for usefulness.

  Structure:
  We'll design a flowchart with branching questions. Each branch node is a question with concrete cases. We'll aim for 8-12 leaves and note any unoccupied combinations.

