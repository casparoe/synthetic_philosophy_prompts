answer: |-
  ### Scratchpad on Method  
  Historical analogies in AI debates serve three core functions: (1) *framing expectations* about impact magnitude and speed, (2) *implying agency* (who controls outcomes), and (3) *smuggling normative assumptions* (e.g., inevitability, optimal policy). A strong analogy must:  
  - **Match mechanisms**: Engage AI’s core novelty (cognitive substitution, rapid scaling, near-zero replication cost).  
  - **Resist false precision**: Avoid implying known timelines when diffusion depends on unpredictable institutional adoption.  
  - **Focus on institutions**: Locate change in societal adaptation, not the artifact.  
  - **Enable actionable policy**: Point to levers (e.g., legal, economic) without presupposing solutions.  
  - **Resist hijacking**: Be structurally incompatible with cherry-picked conclusions.  

  Failures arise when analogies:  
  - Fix timescales (e.g., "Oppenheimer moment" implies sudden deployment).  
  - Centralize agency (e.g., "nuclear control" ignores distributed actors).  
  - Reify technology as the driver (not complementary systems).  
  - Imply inevitability (e.g., "printing press caused Reformation" obscures contingency).  
  - Pre-load policy (e.g., "industrial Luddism" biases toward blocking tech).  

  ---

  ### Ratings (0–100)  
  | Candidate | Mech. (30%) | Time (20%) | Locus (30%) | Policy (10%) | Resist (10%) | Composite |  
  |-----------|-------------|------------|-------------|--------------|--------------|-----------|  
  | **A. Nuclear weapons** | 85 (Sharp capability discontinuity) | 40 (Implies instant deployment) | 30 (Overemphasizes state control) | 50 (Points to treaties but ignores economic drivers) | 20 (Easily weaponized for state-centric panic) | **49.5** |  
  | **B. Printing press** | 50 (Distributes cognition, not replaces it) | 80 (Slow, contested adoption) | 70 (Highlights guilds/laws, not just books) | 30 (Suggests censorship is only lever) | 40 (Captured for "inevitable disruption" narratives) | **58.0** |  
  | **C. Industrial Revolution** | 60 (Labor substitution parallel) | 10 (Implies century-scale lag) | 40 (Artifact-centered; factories over welfare systems) | 20 (Vague, invites "adapt or die" fatalism) | 10 (Exploited for any agenda) | **36.0** |  
  | **D. Standard time** | 75 (New coordination layer enabling complex systems) | 90 (Diffusion relied on railroads, treaties, clocks) | 95 (Change in social/institutional scaffolding) | 80 (Points to interoperable standards bodies) | 85 (No natural villain or hero) | **84.5** |  
  | **E. Joint-stock company** | 95 (Creates new accountable non-human agents) | 70 (Adoption swift once legal risks resolved) | 90 (Pure institutional innovation) | 85 (Focuses on liability/fiduciary rules) | 60 (Can be twisted to "corporations = AI" reductivism) | **84.0** |  

  **Weights**: Mechanism (30%) and Locus (30%) dominate—AI’s novelty is cognitive delegation and institutional reinvention. Timescale (20%) counters false urgency/fatalism. Policy (10%) and Resistance (10%) ensure utility without determinism.  

  ### Tiers  
  - **Build piece around this**: **D (84.5)**  
  - **Usable as passing illustration**: **E (84.0)**, **A (49.5)**  
  - **Cut**: **B (58.0)**, **C (36.0)**  

  ### (i) Top Analogy’s Key Danger  
  **Standard time (D)** risks implying that AI coordination will be as value-neutral as time zones, obscuring how defining cognitive infrastructure (e.g., "truth" protocols) involves zero-sum political struggles absent in synchronizing clocks.  

  ### (ii) Mandatory Hedging Clauses  
  - A: *"...though unlike nukes, AI lacks a single point of control."*  
  - B: *"...if we ignore that Gutenberg’s press amplified human minds rather than replacing them."*  
  - C: *"...absent the Industrial Revolution’s unambiguous physicality and pace."*  
  - D: *"...provided we acknowledge time standardization avoided moral disputes AI will face."*  
  - E: *"...so long as we remember corporations serve shareholders, while AI agents may lack aligned principals."*  

  ### (iii) Framing Sentence for Top Analogy  
  > "Much like the unremarkable adoption of standard time—which quietly rewrote societal coordination long after the first trains left the station—AI’s deepest disruption may lie not in the machines themselves, but in the invisible frameworks we build to harness them."  

