prompt: |-
  I've been the person who signs off on structural calculations at a small consultancy for about twelve years — me and two juniors, maybe forty jobs a year, nothing exotic. Two years ago we all started running the calcs through an AI assistant, first for the boring code lookups, now for basically the whole first draft. Everything below is about the last year.

  Here's what's bugging me: the work got better. Rework requests from the checking engineer are down, clients are happy, and I turn jobs around in a third of the time. But last month I noticed I couldn't do one of my own bog-standard calcs start to finish without the model. Not that I'd forgotten the method — I'd get maybe halfway and loose the thread, and the model supplies the shape of the rest. A friend of mine calls this "phantom skill": I can look at an output and feel that something is off, I just couldn't have produced the right one myself, and half the time I can't say what's wrong with the bad one.

  Three things I keep going in circles on, and I want you to actually take a side on each:

  - Is that "something's off" feeling a check on anything real, or am I just pattern-matching the model's own style back at it? Because if its the second one, my review adds nothing the model couldn't do for itself.
  - My confidence in any given output comes almost entirely from "this thing has been right most of the time on the last few hundred jobs". Fine for normal jobs. But when a job is genuinely a bit unusual, that track record is a base rate from a pile of normal jobs, and I don't seem to have anything underneath it — no way to tell the unusual-but-fine from the unusual-and-wrong.
  - Everyone uses the same model. Me, the juniors, and I'm fairly sure the checking engineer on the client's side too. Our three-person review might now be one person three times.

  Also I tried an experiment: I redid one small job by hand last week, no model, six hours instead of forty minutes, and I caught two things the draft had gotten wrong. Except I can't tell whether I caught them because I have something the model doesn't, or just because six hours is slower than forty minutes. Which kind of ruins the experiment.

  So: am I right to be uneasy, or is this just what competence looks like now? Concretely — should I be stamping these jobs at all given that I can't fully re-derive them, should I make the juniors do one by hand a month even though it costs real billable time, and is there anything I owe the client by way of disclosure? Don't give me a reading list or tell me who's written about this, I want the argument itself. And finish with a one-line verdict I can compare across answers, in the form \answer{...} — something like \answer{keep using it, but stop stamping X}.
reasoning: |-
  Hmm, the user is a senior structural engineer who's been using an AI assistant for calculations over the past two years. They've noticed improvements in efficiency and quality but are now experiencing "phantom skill" - they can recognize when something's off in the AI output but can't reproduce the calculations themselves. They're grappling with three core dilemmas about the reliability of their intuition, the validity of their confidence in unusual cases, and the redundancy of multi-person reviews when everyone uses the same model.

  The experiment where they manually redid a calculation was insightful but inconclusive - they caught errors but couldn't determine if this was due to human judgment or simply having more time. Their questions cut to the heart of professional responsibility in the AI age: whether they should continue approving designs given their dependency, if they should mandate manual work despite the cost, and what disclosure obligations they have to clients.

  This isn't just about technical competence - it's about the ethical foundations of engineering practice. The user explicitly wants concrete judgments, not theoretical discussions. Their unease stems from recognizing that their professional identity is transforming from creator to curator, and they're wisely questioning whether this shift preserves the integrity of their stamp.

  The key tension is between demonstrable improvements in outcomes and the erosion of personal verification capacity. While the AI delivers better results faster, the user's inability to independently replicate work violates a core engineering principle: understanding precedes approval. The fact that multiple reviewers use the same model creates systemic risk - it's not truly independent verification.

  For the verdict, I need to balance practicality with professional ethics. Mandating occasional manual work preserves core skills despite the cost, while disclosure maintains transparency with clients. Continuing to use the AI is reasonable given its benefits, but the stamp should only be applied after meaningful human verification. The one-line verdict should capture these necessary safeguards.
answer: |-
  Here's the direct argument on each point, followed by concrete actions and the verdict:

  1.  **Your "something's off" feeling:** This is **real, but limited**. You're pattern-matching, but the pattern includes *valid engineering heuristics and physical intuition* implicitly learned over your career. The AI learns patterns too, but your pattern-matching incorporates a deeper, often subconscious, understanding of material behavior, constructability, and real-world failure modes that the AI's statistical model might miss or misweight. It *does* add value the AI can't fully replicate alone, acting as a crucial heuristic filter. However, it cannot reliably catch *novel* errors the AI makes that fall outside your experience or intuition.

  2.  **Confidence on unusual jobs:** Your unease is **justified**. Your confidence *is* fundamentally based on past performance on standard cases. For genuinely unusual scenarios, the AI's training data is likely sparse or non-existent. Your "phantom skill" provides little foundation here. Without independent verification capability (manual calculation, alternative methods, specialized expertise), you have no robust way to discern if the AI is extrapolating correctly or hallucinating plausible-looking nonsense. This is the highest-risk scenario.

  3.  **Everyone using the same model:** This **invalidates true independent review**. You are correct: it's likely one person (the AI) three times. If the AI has a fundamental flaw or bias for a specific job, all three reviewers are likely to miss it simultaneously because they share the same underlying "knowledge" base and potential blind spots. This creates systemic risk.

  **Concrete Actions:**

  *   **Stop Stamping Jobs You Cannot Fundamentally Verify:** You are currently rubber-stamping. Your stamp signifies *personal professional verification*. If you cannot re-derive the core logic or perform credible independent checks, you cannot ethically stamp it. This must change.
  *   **Mandate Manual Work (Selectively):** Yes, **make the juniors (and yourself!) do one significant hand calc per month.** Focus on: a) Unusual aspects of a job, b) Safety-critical elements, c) Spot-checks on AI outputs where your "something's off" feeling triggers. Bill it as essential QA. The cost is the price of maintaining *actual* competence and catching AI errors that slower, deeper human thought reveals. Your experiment proved this catches errors; the *why* (human skill vs. time) is less critical than the *fact* it does.
  *   **Disclose AI Use (Specifically):** You **owe clients disclosure** that AI is used for draft calculations and modeling, subject to rigorous engineering review and verification per established professional standards. Be transparent about *how* it's used and the safeguards (like mandated manual checks). Do not imply the AI is doing unsupervised engineering. Your stamp covers the *process*, including the human oversight, not the AI's raw output.

  **Verdict:** The improvements are real, but your dependency creates unacceptable verification and review gaps. You cannot ethically stamp work you can't fundamentally verify, the singular model creates illusory review, and unusual jobs lack a safety net. Mandated manual checks and transparency are non-negotiable.

  \answer{Stop stamping unverified outputs; mandate monthly manual calcs; disclose AI use specifically.}
