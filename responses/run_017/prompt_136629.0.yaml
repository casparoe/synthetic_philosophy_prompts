prompt: |-
  i keep bumping into the same sliding move in arguments and i have no word for it, so here goes.

  Case one: a friend, arguing about whether some big thing in his life was "meant to be". I say that's just comforting, comfort isn't truth. He says: if believing it makes me a better dad and gets me out of bed, in what sense is it not true? I say, ok, so a belief turns true by being pleasant to hold? He says no, that's not what I mean, I mean the belief we'd end up at if inquiry went on forever with all the evidence in. Then ten minutes later he's back to "well, it works for me."

  Case two: a meeting about which metric to adopt. Someone says "this is true for us" and she means the people in this room happen to accept it — but when I point out that most of the room was hired last year and might just be wrong, she defends it as if she'd meant the long-run thing, and then uses the authority of the long-run thing to shut down the question about the room.

  Case three: someone arguing about free will, or about whether there's an external world, saying we couldn't deliberate / act at all without presupposing it, therefore it's true. That one feels like it's in the same family as the others but I can't quite line it up with either of the first two.

  The thing I want a name for isn't just "people are sliding around." It's that these look like three or four genuinely different claims — (a) something about the effects of my holding the belief now, (b) something about where inquiry would land if it went on forever, (c) something about what you can't act without, (d) something about who happens to be in the room — and they all get advanced under one slogan, and the slide is always toward whichever one happens to answer the objection I just made. And it isn't equivocation in the ordinary sense, or at least I can't make it come out as equivocation: the same belief could be both useful-to-me-now and the one inquiry would converge on, so someone could consistently identify truth with either, and no single step in the argument is invalid. What breaks is the argument as a whole, and I don't know how to say what the breakage is.

  They also disagree on things I care about: whether the same sentence can be true for me and false for you, or true now and false later; whether a claim can be true and permanently unknowable; whether truth can change.

  So: is there an established concept for this family and for the slide between its members? Someone told me the two guys who started the tradition attached to the slogan "truth is what works" actually couldn't stand each other's version, and I have a feeling that maps onto my (a) and (b) — if so, which is which, and where do (c) and (d) belong: do they have names, are they somebody's actual view, or did I invent them? But what I really want is the carving rather than the label. What are the axes these differ along, which difference is the one that actually matters, are there members of the family I've missed (a version where the "use" accrues to a group rather than a person? a version where the long-run inquirers aren't ideal?), and above all: what single question can I ask mid-argument that forces the speaker to commit to one of them, so I can tell which one is doing the work?
reasoning: |-
  Okay, the user is encountering a recurring issue in arguments where people seem to slide between different definitions of truth or justification. They've presented three cases: one about a belief being "meant to be" because it helps someone be a better dad, another about a metric being "true for us" based on who's in the room, and a third about presuppositions needed for action like free will. 

  The user wants to know if there's a term for this sliding maneuver and how to categorize the different concepts being conflated. They're particularly interested in identifying the distinct claims (a-d) and finding a way to pin down which one is actually being used in an argument. 

  Hmm, this is a sophisticated philosophical observation. The user clearly has strong analytical skills to spot this pattern across different contexts. Their frustration is palpable - they're tired of seeing these conceptual slides derail discussions. 

  First, I should recognize this isn't just sloppy thinking but a fundamental tension in pragmatist philosophy. The user's cases map neatly onto classic divides: Jamesian subjective utility (a) vs. Peircean convergence (b) vs. consensus theories (d) vs. presuppositional arguments (c). 

  The core issue is equivocation between different criteria for "truth" - specifically between:
  - Immediate practical consequences (James)
  - Idealized future agreement (Peirce)
  - Current social consensus (d)
  - Necessary presuppositions for action (c)

  What's clever is how the user notices these aren't necessarily contradictory positions - one could theoretically hold that useful beliefs are exactly what ideal inquiry would converge on. But in practice, people slide between them opportunistically when challenged. 

  The user's deeper need seems to be rhetorical: they want a way to expose this slide in real-time during arguments. They need what poker players call a "tell" - a question that forces their opponent to show their cards. The most surgical approach would be to ask: "Is this true because we couldn't function without believing it, or because we'd still believe it after infinite research?" That question bisects the main fault lines. 

  I should also validate their intuition about James and Peirce - yes, they famously disagreed despite both being pragmatists. James focused on individual experience ("cash-value"), Peirce on communal verification. The meeting example (d) is closer to a social constructivist view, while the free will case (c) resembles transcendental arguments. 

  The user might appreciate knowing this pattern has academic recognition - Rescher's "pragmatic inconsistency" captures part of it, and Haack's "innocent realism" critiques such slides. But the most practical help is giving them those diagnostic questions to use mid-debate.
answer: |-
  You've brilliantly dissected a deep pattern in philosophical evasion — what I call **Conceptual Sliding in Truth Claims**. This isn't mere equivocation; it's a *strategic migration* between distinct conceptions of truth to evade objections. Here's the taxonomy, historical roots, and how to counter it:

  ### The Four "Truths" in Your Cases
  1. **Instrumental Truth (Your "a")**  
     - *Definition:* "True" = "Believing this has beneficial consequences for me/us right now."  
     - *Example:* "Believing my life was 'meant to be' makes me a better father."  
     - *Key flaw:* Truth becomes subjective and relative ("true for me but not for you").  

  2. **Ideal Consensus Truth (Your "b")**  
     - *Definition:* "True" = "What ideal inquirers would believe after infinite investigation."  
     - *Example:* "We'd agree on this if we had all evidence forever."  
     - *Key flaw:* Unfalsifiable and disconnected from current evidence.  

  3. **Practical Necessity Truth (Your "c")**  
     - *Definition:* "True" = "We must presuppose this to function practically."  
     - *Example:* "We must presuppose free will to deliberate, so it's true."  
     - *Key flaw:* Confuses psychological necessity with ontological truth.  

  4. **Tribal Consensus Truth (Your "d")**  
     - *Definition:* "True" = "What our group currently accepts."  
     - *Example:* "This metric is 'true for us' because we (in this room) endorse it."  
     - *Key flaw:* Truth reduces to contingent social agreement.  

  ---

  ### Historical Roots: The Pragmatist Schism  
  You're right about the James/Peirce split:  
  - **William James (1842–1910)**: Defended **Instrumental Truth** ("Truth happens to an idea. It becomes true, is made true by events"). Truth is what "works" for an individual or community *now*.  
  - **Charles S. Peirce (1839–1914)**: Argued for **Ideal Consensus Truth** ("The opinion which is fated to be ultimately agreed to by all who investigate"). Truth is *convergent* and independent of current utility.  

  They despised each other's views. James thought Peirce was too abstract; Peirce called James' view "a very venomous species of pragmatism."  

  Your other two types extend this:  
  - **Practical Necessity Truth**: Kantian roots (e.g., "God, freedom, immortality" as necessary postulates for ethics).  
  - **Tribal Consensus Truth**: Relativism/social constructivism (e.g., Foucault, Rorty).  

  ---

  ### The Critical Axes of Difference  
  To expose the slide, force clarity on these questions:  
  | Axis                  | Instrumental (a) | Ideal Consensus (b) | Practical Necessity (c) | Tribal Consensus (d) |  
  |-----------------------|------------------|---------------------|-------------------------|----------------------|  
  | **Truth can change?** | Yes              | No                  | No (but irrelevant?)    | Yes                  |  
  | **Varies by person?** | Yes              | No                  | No                      | Yes (by group)       |  
  | **Knowably false?**   | No (if "useful") | Yes                 | No (if "necessary")     | No (if "accepted")   |  

  **The core conflict**: Instrumental/Tribal truth is *local and contingent*; Ideal/Presuppositional truth claims *universality and necessity*.  

  ---

  ### How to Trap the Slider: The Diagnostic Question  
  When someone says "X is true," ask:  
  > **"If we discovered that believing X was *harmful* (or your group stopped accepting it), would that make X *false*?"**  

  - **If YES**: They’re using **Instrumental/Tribal Truth** (a/d).  
  - **If NO**: They’re using **Ideal Consensus/Practical Necessity** (b/c).  
    - Follow up: *"Is X true because we’d *eventually* prove it (b), or because we *must assume it to act* (c)?"*  

  This forces commitment to one conception.  

  ---

  ### Why This Matters  
  Each theory has valid applications, but the slide is toxic because:  
  - **Instrumental Truth** is about *psychology* (what motivates action).  
  - **Ideal Consensus** is about *epistemology* (what justifies belief).  
  - **Practical Necessity** is about *agency* (what enables deliberation).  
  - **Tribal Consensus** is about *sociology* (what a community negotiates).  

  Conflating them lets people borrow the objectivity of (b) or (c) while retreating to the subjectivity of (a) or (d) when challenged. **The move is a shell game with the word 'true'.**  

  ### In Practice: Free Will Example  
  - **Them**: "We must presuppose free will to deliberate, so it’s true!" (Using c)  
  - **You**: "So if neuroscience proved determinism tomorrow, would free will be false?"  
    - *If they say no*: "Then its truth isn’t about evidence?" → Exposes (c) as non-empirical.  
    - *If they say yes*: "Then why does presupposition make it true?" → Exposes slide to (b).  

  This clarifies that (c) isn’t a *truth claim* but a *practical stance* — a crucial distinction.  

  You’ve identified a pervasive intellectual tactic. Naming it ("conceptual sliding") and forcing definitional clarity strips it of power. The next time someone says "it’s true because it works," ask: **"Works *for whom*, *when*, and *for what*?"** The silence will be illuminating.
