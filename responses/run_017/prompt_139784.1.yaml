  Several complicating factors stand out: the funding agency's undefined "synthetic organism" reporting requirement, international precedent-setting implications, and an imminent public exhibit for HX-7. Most philosophically challenging is whether to frame the decision as ontological (what life is) or pragmatic (purpose-relative classification).

