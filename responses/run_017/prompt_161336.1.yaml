prompt: |-
  I'm a novelist, on what I hope is the last-but-one draft of my third book — near-future thing, mostly set in and around a fertility clinic, with a big flashback section set in 1962. My editor has twice now come back with the same note: my named characters are roughly half and half, but the people in the background default to male and the people who get *described* are almost always female. The embryologist just does things; the nurse has a grey bun and small hands. A senior consultant is a man until I say otherwise; when a woman has authority I apparently feel obliged to add a sentence about her shoes or her kid. I want to catch this myself, before copyedit, instead of paying someone to tell me again.

  Here's the half-formed thing I keep circling back to. There's that 1985 Hofstadter satire written under a pen name, where he takes the structure of an earnest essay arguing against racist language and runs it backwards — arguing that the traditional, generic-sounding usage is obviously right and the reformers are cranks, using exactly the arguments people actually use to defend the status quo, with the markers swapped. The clever bit isn't that he invents new arguments; it's that the reader's discomfort at the mirror is the whole evidence. That move — don't argue, just flip the marker and notice what feels wrong and *why* — feels like it should be something I can actually run on a chapter, and not just on individual words like generic he or the -man compounds.

  So: write me a procedure. Concretely what I need:

  - Something I run alone, on a chapter, in twenty minutes or so, with no linguistics background and no software. I have about forty chapters and six weeks.
  - The questions in order, and what counts as a sufficient answer to each — not vibes. Say where the procedure stops with a no (fix this sentence before moving on) and where it hands the decision back to me because the question is about what I'm trying to do rather than what the text does.
  - It has to go past pronouns to the defaults underneath: whose competence is assumed, whose body gets described and in what register, who gets interiority versus who gets explained, who acts versus who is acted on, which characters need a credential supplied and which are just granted one. And it should generalise the flip to other axes where it works — race, class, nationality, age, disability, religion — and tell me honestly where the flip stops being a good test.
  - Be explicit about which steps are judgement calls dressed up as procedure. I can tell when I'm being handed a rubber stamp.

  Run it on three things from my draft. One: the clinic opening I described above, where the unnamed embryologist acts and the unnamed nurse is a body. Two: chapter 9, where I already "fixed" a flagged scene by changing the lab technician from a man to a woman and leaving everything else about him/her exactly as written — I suspect this fails the flip, and I'd rather be told plainly than have it explained gently. Three, and this is the one I'll argue with: chapter 12, where my narrator (a burnt-out middle-aged male fixer, very much a character and not me) describes a government minister's legs in the middle of a scene where she is refusing him something. I think that's characterization and voice and load-bearing; if your procedure says cut it, I want to see the argument, including the version where it says keep it but do something else.

  Also: chapter 21 is set in 1962 and the whole point of several scenes is that a woman couldn't do the thing she's doing. The flip is anachronistic there, and I don't want a procedure that either lets me off the hook or tells me to write a false world. Tell me what running it on that chapter is supposed to produce.

  And tell me what the procedure can't do. My worries: that the jolt I feel on a flip tells me about me or about the reader rather than about the sentence; that a flip can launder a bias rather than remove it; that sometimes the asymmetry is real-world base rates and not my prose; that some of this is style and voice and has no correct answer.

  Last thing. As you go, separate what's actually settled among people who work on this from what's contested. I mean: is it established that generics like he and -man compounds are not read as neutral, or is that a live fight? Does changing the words do anything to how people think, or only track what they already think? Does the satire actually show anything, or is it just a good joke? I'd rather you flag a claim as contested than hand me a confident line I'll repeat at a reading and get corrected on. Don't put in any citations or reading suggestions — I'll chase those myself if I ever want them, and I definately don't want a bibliography in this.
reasoning: |-
  Hmm, the user is a novelist working on their third book and struggling with gendered defaults in their writing. Their editor has flagged that background characters default to male while described characters are often female, with unnecessary details added for women in authority. They want a concrete procedure to catch this themselves before the copyedit stage.

  The user references Hofstadter's satire where flipping markers reveals bias by discomfort. They want a procedure that's: fast (20 mins/chapter), concrete (ordered questions with clear answers), goes beyond pronouns to deeper defaults, generalizes to other axes, and flags where judgment calls happen.

  They provide three test cases: 1) Clinic opening (default male authority/described female staff) 2) Chapter 9 (token gender swap) 3) Chapter 12 (male narrator describing female minister's legs). Plus Chapter 21 (1962 setting where gender restrictions are plot-relevant).

  Key concerns: 
  - Whether flip tests reveal textual issues or just personal reactions 
  - If flips can mask rather than fix bias 
  - Handling real-world asymmetries vs prose choices 
  - Voice/stylistic elements 
  - Anachronism in historical chapters

  They want clear separation of settled vs contested claims about linguistic bias without citations.

  The procedure must be: 
  - Actionable without linguistics background 
  - Diagnostic, not prescriptive 
  - Transparent about its limitations 
  - Respectful of authorial intent while exposing default patterns

  For Chapter 21, the flip should reveal where restrictions are thematically necessary versus accidentally reinforced. The discomfort in flipped scenarios is meant to highlight unconscious defaults, not prescribe anachronistic equality.

  The token swap in Chapter 9 will likely fail because the original characterization remains unchanged - the flip makes the stereotypical traits stand out as inappropriate. This shows how surface-level fixes don't address underlying framing.

  The minister's legs in Chapter 12 needs evaluation: does the description serve character voice while maintaining the minister's agency? The flip would test if similar focus would feel plausible/revealing for a male minister.

  Core tension: The user wants to eliminate unconscious defaults while preserving intentional voice and historical accuracy. The procedure should function as an X-ray, not an instruction manual.
answer: |-
  Here's a concrete, judgment-aware procedure designed for your specific task. It runs on one chapter at a time, focusing on **"flip the marker and notice the discomfort"** as a diagnostic tool. It prioritizes **speed, specificity, and transparency** about where judgment is required.

  **The Flip Audit Procedure**

  1.  **Prep:** Print the chapter. Grab two highlighters (e.g., Pink, Blue) and a pen. Set a timer for 20 minutes.

  2.  **Mark Background Characters & Quick Descriptions:**
      *   Scan for any character mentioned only in passing (e.g., "a nurse," "the embryologist," "a consultant," "people in the waiting room," "security guard," "passerby").
      *   For each, **Pink Highlight** if the character is *explicitly* identified as male or uses male pronouns/he/him. **Blue Highlight** if *explicitly* identified as female or uses she/her. Leave unmarked if gender is genuinely ambiguous/neutral (rare).
      *   **Question:** Is there an *implicit* gender default based on role/title? (e.g., "the embryologist" feels male? "The receptionist" feels female?). Jot "MD" (Male Default) or "FD" (Female Default) in the margin next to the reference.
      *   **Sufficient Answer:** All background characters are highlighted or default-noted. **Stop if No:** You missed some. Find them.

  3.  **Flip the Background Defaults (Judgment Call):**
      *   Look at your MD/FD margin notes. Mentally (or jot briefly) **flip the default** for each role. If "embryologist" felt like an MD, imagine it as an FD. If "nurse" felt like an FD, imagine it as an MD.
      *   **Question:** Does this flipped default feel jarring, unrealistic, or require immediate justification *in this specific context*? *Why?*
      *   **Sufficient Answer:** A "Yes" with a brief reason ("Feels like only men held senior roles here," "Nursing was female-dominated") is valid *if historically/setting accurate*. A "Yes" with a vague feeling ("Just seems weird") or based solely on stereotype ("Women aren't scientists") flags a potential problem. A "No" means the default was arbitrary and flipping is fine. **Hands decision back:** This identifies *where* your defaults might be shaky. Fixing involves consciously assigning gender or making descriptions neutral *if the default bias isn't intentional/setting-accurate*.

  4.  **Mark Described Characters:**
      *   Scan for any character (named or background) who gets *any* physical description beyond basic function (e.g., "small hands," "grey bun," "sharp suit," "tired eyes," "expensive shoes," "limp," "accent," "youthful face," "wrinkled skin," "wore a hijab").
      *   **Pink Highlight** the description if the character is male. **Blue Highlight** if female.
      *   **Sufficient Answer:** All physical descriptions are highlighted by the character's gender. **Stop if No:** You missed one.

  5.  **Flip the Described Subjects (Judgment Call):**
      *   Look at your highlighted descriptions. For each **Blue Highlight** (description of a woman), mentally **flip the gender of the character** receiving that description. Keep the description *exactly the same*.
      *   **Question:** Does this description now attached to a male character feel:
          *   a) Equally plausible and similarly weighted (neutral)?
          *   b) Trivializing, objectifying, or oddly intimate?
          *   c) Like it demands justification or undermines the character's authority/competence?
          *   d) Like it reveals something new and important about *this specific character* in a way it didn't before?
      *   **Sufficient Answer:** Identify the feeling (a, b, c, d). **Hands decision back:** This reveals the *register* and *purpose* of the description. "B" or "C" strongly suggests the description serves a different (often biased) purpose when applied to women. Fixing involves deleting, rewriting the description to match the register used for men, or justifying its *unique* relevance to *this* character and moment.

  6.  **Mark Competence & Interiority Signals:**
      *   Scan for characters in positions of authority, expertise, or action.
      *   Note where competence is **Assumed** (no justification given, character just *is* the expert/does the thing) vs. **Explained** (credentials mentioned, experience cited, reasons given for their capability).
      *   Note where **Interiority** is granted (we get thoughts, feelings, motivations, POV glimpses, even briefly) vs. where characters are **Externally Defined** (only actions/words/appearance shown).
      *   **Pink Checkmark** ✓ for Assumed Competence / Granted Interiority for male characters.
      *   **Blue Checkmark** ✓ for Assumed Competence / Granted Interiority for female characters.
      *   **Pink "E"** for Explained Competence / Externally Defined for male characters.
      *   **Blue "E"** for Explained Competence / Externally Defined for female characters.
      *   **Sufficient Answer:** Key authority/action characters are marked. **Stop if No:** You missed a significant character in a scene. Find them.

  7.  **Flip Competence & Interiority (Judgment Call):**
      *   Look at your checkmarks and "E"s.
      *   Mentally **swap the markers** for male and female characters in equivalent roles. If a male consultant has Assumed Competence (Pink ✓), imagine a female consultant in that role having Assumed Competence. If a female tech has Explained Competence (Blue "E"), imagine a male tech having Explained Competence. Do the same for Interiority.
      *   **Question:** Does the flipped version feel unbalanced? Does granting a woman Assumed Competence feel like she's getting "extra" unearned credit? Does explaining a man's competence feel oddly defensive? Does granting a random man interiority feel like unnecessary depth, while granting it to a woman feels expected? Does denying a woman interiority feel like flattening her?
      *   **Sufficient Answer:** Identify the feeling of imbalance or lack thereof. **Hands decision back:** This reveals implicit biases in how you signal credibility and depth. Fixing involves standardizing the level of assumed competence and access to interiority based on narrative importance, not gender. (e.g., major characters get interiority regardless of gender; competence is assumed for established roles).

  8.  **Mark "Acted-Upon" Moments:**
      *   Quickly scan for moments where a character is primarily the *recipient* of action, gaze, or judgment, especially if passive ("was told," "was looked at," "was interrupted," "her hand was taken").
      *   **Pink "P"** in margin if male character is acted upon.
      *   **Blue "P"** in margin if female character is acted upon.
      *   **Sufficient Answer:** Obvious passive/recipient moments are marked. **Stop if No:** This step is quick; don't get bogged down. Mark what jumps out.

  9.  **Flip the Subject/Object (Judgment Call):**
      *   Look at your "P"s. Mentally **swap the genders** in those specific moments. If a woman "was told sharply by her boss," imagine a man "was told sharply by his boss." If a man "noticed her legs," imagine a woman "noticed his legs."
      *   **Question:** Does the flipped version change the perceived power dynamic, vulnerability, or appropriateness of the moment? Does it feel more or less natural, more or less charged?
      *   **Sufficient Answer:** Note the shift in feeling. **Hands decision back:** This reveals if your narrative is disproportionately placing women in passive or observed positions. Fixing involves reconsidering agency in those moments or ensuring the passivity/observation is equally distributed or *specifically motivated* by character/plot.

  **Generalizing the Flip:** For other axes (Race, Class, etc.), follow the same logic within relevant steps:
  *   **Background Defaults (Step 3):** What's the implied race/class of "the consultant"? Flip it. Does it feel jarring *only* because of real-world demographics/structure, or because of bias?
  *   **Descriptions (Step 5):** Flip the racial/class marker on a description (e.g., "dreadlocks" on a white character, "expensive tailored suit" on a cleaner). What feels different? Why?
  *   **Competence/Interiority (Step 7):** Flip who gets assumed competence or interiority based on race/class. Does the flip reveal unequal treatment?
  *   **Acted-Upon (Step 9):** Flip who is being passively observed or acted upon.
  *   **Where the Flip Falters:** The flip test weakens when:
      *   **Historical/Social Reality is the Point (Ch21):** See below.
      *   **Specific Character Identity is Central:** Flipping a core character trait (e.g., a Black character's experience of racism) makes no sense.
      *   **Base Rates are Extreme & Relevant:** Flipping might feel absurd if the setting realistically lacks diversity (e.g., flipping gender in a 1962 boardroom *if* the scene is about its maleness). The test here is: **Is the *narrative treatment* still biased *within* the constraint?** (e.g., Are the *few* women in the 1962 boardroom *only* described by appearance? Do they *never* get interiority?).

  **Running Your Test Cases:**

  1.  **Clinic Opening:**
      *   **Step 2:** Embryologist (Likely MD - unmarked or Pink?), Nurse (Likely FD - Blue? + Description Blue). Consultant (Likely MD - unmarked or Pink?).
      *   **Step 3 Flip:** Embryologist FD / Nurse MD / Consultant FD. *Discomfort?* Does "male nurse with grey bun/small hands" feel like an odd focus? Does "female embryologist just doing things" feel unremarkable? *Likely Failure:* The nurse's description feels trivializing when flipped; the embryologist's lack of gender/description feels neutral when flipped.
      *   **Step 5 Flip:** Take the nurse's description. Attach "grey bun and small hands" to a male nurse. *Discomfort?* Likely feels oddly intimate or trivializing for a background male character. Reveals the original description of the female nurse is likely gratuitous.
      *   **Step 7:** Nurse (Externally Defined - Blue "E"), Embryologist (Action only - Externally Defined? Assumed Competence?).
      *   **Step 7 Flip:** Imagine the *nurse* has Assumed Competence (just does job) and the *embryologist* gets a physical description. Does that feel unbalanced? Probably not. Reveals the original grants competence/action neutrally (good) but description unequally (bad).
      *   **Fix:** Delete/reduce nurse's description. Assign gender neutrally or consciously to embryologist/consultant.

  2.  **Chapter 9 (Token Swap):**
      *   **Step 2/4:** Lab Tech - Now Female (Blue), but description/actions unchanged.
      *   **Step 5 Flip:** Take the original (presumably male-coded) description/actions and attach them to the *male* version again. Does it feel normal? Now *keep* that description/action and attach it to the *female* version. *Discomfort?* Does the behavior/description now feel stereotypically male, inappropriate for a woman, or like she's "acting male"? If yes, the **problem wasn't the gender, it was the characterization itself.** The flip reveals the underlying traits were gendered.
      *   **Step 7 Flip:** Did the tech have Explained Competence (e.g., "he knew the machines inside out")? Flip: "she knew..." - does it feel like *more* of an achievement? If yes, bias.
      *   **Verdict:** The flip likely reveals the characterization relies on male-coded traits/register. **Fix:** Not just changing the pronoun, but rethinking *how* the character is written to avoid gendered stereotypes, or making the traits feel genuinely neutral.

  3.  **Chapter 12 (Minister's Legs):**
      *   **Step 5:** Description of Minister's legs - Blue Highlight.
      *   **Step 5 Flip:** Narrator describes a *male* minister's legs in the same situation (refusing him something). *Discomfort?*
          *   Does it feel equally in-character for the *narrator* (a burnt-out male fixer)? If yes, and it reveals something specific about *his* lechery/fixation/power play, it *might* be voice.
          *   Does it feel wildly out of character for the narrator to notice/appraise a man's legs? Then it's likely gendered description.
          *   Does it shift the power dynamic? Describing her legs while she refuses him emphasizes her as a physical object he's assessing, undermining her authority in the moment. Does describing *his* legs while *he* refuses the narrator have the same undermining effect? Probably less so, revealing the original description functions partly as a power diminishment tool.
      *   **Step 9:** Minister is being observed ("legs") - Blue "P".
      *   **Step 9 Flip:** Male minister's legs observed by female narrator. *Discomfort?* Likely feels either equally predatory (if narrator is meant to be lecherous regardless) or highlights the specific societal power imbalance (man appraising woman) inherent in the original.
      *   **Verdict:** **The flip doesn't automatically say "cut it." It asks:** Is this description *primarily* revealing the *narrator's* character and his specific way of interacting with/threatening women in power? Or is it *primarily* a narrative habit of describing women's bodies? Does it *unintentionally* undermine the minister's authority more than intended? **Fix Options:** Keep it if it's crucial, authentic voice. Add a beat showing the minister noticing/reacting to his gaze to reinforce *her* power/awareness. Tone down the description if it feels gratuitous upon flip. Ensure *other* powerful women aren't *only* described physically.

  **Chapter 21 (1962 - Woman Can't Do The Thing):**
  *   **Running the Procedure:**
      *   **Step 3 (Flip Defaults):** Flip backgrounds (e.g., make the board members FD, the secretary MD). *Discomfort?* YES - because it contradicts the historical reality the scene is *about*. **Sufficient Answer:** "Yes, because historical setting." This flags that the *defaults are intentional and setting-relevant*. **No Fix Needed** for the default itself.
      *   **Step 5 (Flip Descriptions):** Flip descriptions applied to men/women in *equivalent* roles (e.g., describe a male secretary's clothing like you would a female one, describe a female executive's bearing like you would a male one). *Discomfort?* If describing the male secretary's stockings feels absurd, but describing the female secretary's stockings feels normal, it reveals the narrative is *accepting* the period's gendered expectations in its *descriptive language*. Is that intentional? **Judgment Call:** Is the narration reflecting the character's POV (who accepts these norms) or a neutral narrator? **Fix Option:** If neutral narrator, consider more neutral description even within constraints. If character POV, ensure it's clear it's *their* bias.
      *   **Step 7 (Flip Competence/Interiority):** Flip who gets Assumed Competence/Interiority *among characters of equivalent narrative importance*. Does the lone woman trying to do the thing get interiority (Blue ✓) showing her struggle/frustration/intelligence, while the men blocking her are Externally Defined (Pink "E") or lack interiority? Or is she only seen through the men's eyes? Flip: Give the blocking men deep interiority and deny it to the woman. *Discomfort?* If flipping makes the woman feel flat and the men feel oddly deep, it reveals the original *might* be unfairly denying the woman depth. **Crucial:** The flip test here checks for **narrative empathy and depth allocation *within* the historical constraint.** **Fix Option:** Ensure the woman protagonist gets adequate interiority and competence signaling *despite* the external barriers. Don't let the historical restriction flatten her *in the narrative*.

  **What the Procedure Can't Do (Your Worries Addressed):**

  1.  **Jolt = Text or Me/Reader?** It diagnoses *potential* triggers for reader discomfort based on common biases. The jolt *you* feel is valuable data about potential reader reaction, but requires your judgment on intent (Ch12).
  2.  **Laundering Bias:** A flip might make bias *visible*, but fixing it requires conscious effort (Ch9 token swap). The procedure flags issues; it doesn't auto-fix. Superficial flips without changing underlying characterization *are* laundering.
  3.  **Real-World Asymmetries:** The procedure identifies them (Step 3/Ch21) and asks you to *decide* if the narrative treatment *reinforces* them unnecessarily or merely reflects them (Steps 5,7,9/Ch21).
  4.  **Style/Voice/No Correct Answer:** It doesn't remove judgment. It forces you to *confront* where your style/voice relies on defaults (Ch12) and make an *intentional* choice. There's no "correct" for Ch12, only "is this *my* intent, executed well?"
  5.  **Proving Causality:** It doesn't *prove* changing words changes minds. It identifies patterns known to correlate with bias and lets you adjust for clarity, fairness, or reader experience.

  **Settled vs. Contested (Per Your Request):**

  *   **Settled (Strong Consensus among Linguists/Stylists):**
      *   "He" as a true generic *is not neutral* for most readers; it predominantly evokes male images.
      *   "-man" compounds (fireman, chairman) are *not* consistently read as gender-neutral; they often evoke male images.
      *   Defaulting backgrounds to male and describing women physically more often than men *is* a common, measurable bias pattern in prose.
      *   Denying women interiority/assuming competence less often than men *is* a common narrative bias.
      *   The Hofstadter satire *effectively demonstrates* the discomfort of the status quo by flipping markers. It's a powerful rhetorical and diagnostic tool. Its power comes from exposing inconsistency in application of "neutrality" arguments.
  *   **Contested/Live Debates:**
      *   **Does changing words change thought?** Some argue linguistic relativity ("Sapir-Whorf lite") suggests it can shape perception over time. Others argue language primarily reflects existing thought, and changing it is just tracking/promoting social change. Strong evidence shows *consistent* exposure to non-gendered language reduces gender stereotyping in *implicit* measures, but causality is complex.
      *   **How far should "neutrality" go?** Debates rage about neopronouns, extensive rewriting of classics, whether certain descriptions are *always* objectifying.
      *   **Effectiveness of specific fixes:** Is "they" singular truly seamless? Are some alternatives clunky? Does over-describing men to "balance" feel forced? (The procedure avoids prescribing specific fixes for this reason).
      *   **Base Rates vs. Representation:** How strictly should fiction mirror demographics, especially in non-central characters? This is an ongoing artistic/social debate. The procedure helps identify *defaults* but doesn't solve this.

  **Go run your chapters. The timer starts now.**
