answer: |-
  ### Seminar Plan: Common Knowledge of Rationality through a Sequential Game

  **Objective:** Illustrate the critical role of **common knowledge of rationality** (vs. mutual knowledge) by contrasting two runs of a sequential take-or-pass game. The first run assumes rationality is mutual knowledge but not necessarily common knowledge; the second run introduces a "sliver of doubt" about rationality via forced-pass players, causing the equilibrium to unravel. Students experience how a tiny discontinuity flips the outcome.

  ---

  ### **Game Rules & Materials**
  - **Game Structure**: 3-stage sequential "Pot-Growth Game" with Players 1 (P1) and 2 (P2).  
  - **Payoffs (points)**:  
    - **Stage 1**: P1 moves.  
      - **Take**: P1 gets 400, P2 gets 100.  
      - **Pass**: Pot grows → stage 2.  
    - **Stage 2**: P2 moves.  
      - **Take**: P1 gets 200, P2 gets 500.  
      - **Pass**: Pot grows → stage 3.  
    - **Stage 3**: P1 moves.  
      - **Take**: P1 gets 800, P2 gets 300.  
      - **Pass**: Both get 0.  

  - **Materials**:  
    - Cards labeled "TAKE" and "PASS" for decisions (or digital form).  
    - For **Run 2**: 18 cards (1 per student) with 2 labeled "MUST PASS" and 16 blank (normal).  
    - Scoreboard to track points. Top scorer wins a coffee voucher.  

  ---

  ### **Run 1: Mutual Knowledge of Rationality (No Doubt)**
  **What to Say to Students**:  
  > "We’ll play a game in randomly assigned pairs. One of you is Player 1, the other is Player 2. The game has up to 3 stages. At each stage, the current player chooses to TAKE or PASS. TAKE ends the game immediately with the payoffs shown. PASS lets the pot grow and passes the move to the other player. Your goal is to maximize your own points. We’ll play 3 rounds with random re-pairing each time. Remember: your partner changes every round, and you only see the payoffs—nothing else."

  **Procedure**:  
  - Pair 18 students into 9 pairs randomly.  
  - Play 3 rounds (re-pair after each round).  
  - Record outcomes: % ending at Stage 1 (400, 100), Stage 2 (200, 500), or Stage 3 (800, 300/0).  

  **Expected Behavior**:  
  - Equilibrium prediction (backward induction):  
    - Stage 3: P1 takes (800 > 0).  
    - Stage 2: P2 takes (500 > 300).  
    - Stage 1: P1 takes (400 > 200).  
  - In practice, students often pass in early stages (due to trust, reciprocity, or limited reasoning), leading to Stage 2/3 outcomes.  

  ---

  ### **Run 2: Introducing Doubt (No Common Knowledge)**
  **What to Say to Students**:  
  > "Same game, same payoffs, but with a twist: I’ve shuffled in a few special cards. Two cards say 'MUST PASS'—if you draw one, you **must PASS at every opportunity**, no choice. The rest are normal cards—you choose freely. You’ll only see your own card. About 10% are 'MUST PASS'; no one knows their partner’s card. We’ll play 3 rounds again, with new pairs each time."

  **Procedure**:  
  - Distribute cards randomly (2 "MUST PASS", 16 blank).  
  - Play 3 rounds (re-pair after each round).  
  - Record outcomes, noting which players held "MUST PASS" cards.  

  **Expected Behavior**:  
  - **Normal players** (no forced pass):  
    - Stage 2: If P1 passed, P2 infers P1 *might* be forced. P2’s rational choice: **TAKE** (500 > expected 300 if they pass).  
    - Stage 1: P1 anticipates P2 will take at Stage 2 → **TAKES** immediately (400 > 200).  
  - **Forced-pass players**: Always pass, leading to Stage 3.  
  - Outcome shift: Most games end at Stage 1 (400, 100). Only forced-pass pairs reach later stages.  

  ---

  ### **Debrief: Mapping Experience to Theory**
  **Data Review**:  
  - Display results from both runs:  
    - **Run 1**: Likely 20–50% pass at Stage 1, with some games reaching Stage 2/3.  
    - **Run 2**: >80% end at Stage 1 for normal players. Only forced-pass pairs progress.  

  **Key Discussion Points**:  
  1. **Run 1 vs. Run 2: What Changed?**  
     - In Run 1, passing happened because:  
       - P1 trusted P2 might pass (believing P2 trusts P1 won’t take at Stage 3).  
       - Mutual knowledge ("I know you’re rational, you know I’m rational") allowed cooperation.  
       - *Formal concept*: Mutual knowledge of rationality enabled multi-step reasoning (P1: "I pass because I think P2 will pass because they think I’ll take at Stage 3").  
     - In Run 2, a 10% doubt unraveled this:  
       - P1 realized: "If I pass, P2 might think I’m forced. If P2 thinks that, they’ll take at Stage 2."  
       - P2 realized: "If P1 passed, they might be forced. If they’re normal, they’ll take at Stage 3—but 500 > 300, so I’ll take now."  
       - *Formal concept*: Without **common knowledge** (all know all know... ad infinitum), the chain of reasoning collapses to 1 step.  

  2. **The Discontinuity**:  
     - A tiny doubt (10% forced players) flipped the prediction: from "pass early" to "take early."  
     - In real life: Common knowledge is fragile. A small uncertainty (e.g., "Is my opponent irrational?") can cause coordination to fail (e.g., bank runs, negotiations).  

  3. **Recovering Reasoning Depth (Student Reflection)**:  
     - Ask:  
       - "If you passed at Stage 1 in Run 1, why? How far did you think ahead?"  
         - Typical: "I thought P2 would pass because they’d trust me to take at Stage 3" → 2–3 levels of reasoning.  
       - "If you took at Stage 1 in Run 2, why?"  
         - "I knew P2 would take at Stage 2 if I passed—they’d assume I might be forced." → 1–2 levels.  
     - Contrast with equilibrium: Infinite mutual knowledge in Run 1 vs. bounded (doubt-limited) in Run 2.  

  ---

  ### **What Could Go Wrong & Limitations**
  1. **First-Run Risks**:  
     - **Risk**: Students might not pass at Stage 1 (e.g., 100% take at Stage 1), muddying the contrast.  
     - **Mitigation**: Scale payoffs disproportionately (e.g., Stage 3 total = 1,100 points vs. Stage 1 = 500) to incentivize risk-taking.  
     - **Confidence**: 75%—empirical centipede games show high cooperation rates.  

  2. **Second-Run Risks**:  
     - **Risk**: Students might misunderstand "MUST PASS" cards or ignore them.  
     - **Mitigation**: Clarify rules: "If your card says MUST PASS, you have NO CHOICE—always PASS."  

  3. **Limitation of the Game**:  
     - The game stages **bounded rationality** (students’ reasoning depth) but can’t perfectly stage **infinite recursion** (true common knowledge).  
     - **Why it’s okay**: The discontinuity effect (tiny doubt → drastic change) is the core lesson.  

  **Least Confident Aspect**:  
  - Quantifying reasoning depth from debriefs (students may misreport). Supplement with anonymous polls: "At which stage did you *expect* the game to end?" to infer beliefs.  

  ---

  ### **Why This Works**
  - **Contrast**: Run 1’s cooperation vs. Run 2’s defection highlights how common knowledge stabilizes multi-step reasoning.  
  - **Discontinuity**: A 10% doubt flips outcomes—students *feel* the fragility.  
  - **Realism**: Mirrors real-world failures (e.g., treaties collapse if parties doubt rationality).  

  **Time Allocation**:  
  - Setup: 5 min  
  - Run 1: 20 min (3 rounds)  
  - Run 2: 20 min (3 rounds)  
  - Debrief: 25 min  
  - Buffer: 5 min  

  **Final Confidence**: 80%. The game robustly demonstrates the epistemic gap, even if not all students perfectly optimize. The "aha!" moment comes from seeing how doubt unravels cooperation.
