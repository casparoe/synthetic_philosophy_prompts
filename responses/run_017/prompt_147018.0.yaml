  Okay, let me start by understanding the core problem here. The user coordinates a community advisory committee for a regional transit authority. They have fourteen volunteer members who meet once a month for ninety minutes. There's a capable staff analytics team with their own incentives and an appointed board that can veto recommendations and is impatient. The committee is stuck between two failure modes: rubber-stamping staff data or making decisions based on who complains the loudest.

  The user has been reading Dewey and wants to implement a democratic inquiry approach where policies are treated as experiments. They need a practical procedure for meetings, about 20 minutes per proposal, with a one-page reference. The procedure must handle specific challenges: the "shadow public" (affected but absent groups), "feedback horizon" (when costs become apparent), "counterfactual visibility" (ability to see what was lost), and irreversible decisions.

  They provided three real examples to test the procedure: income-based fares, an algorithmic scheduling tool, and cutting a late-night route. For the third, they need a minimum process before voting and a script to explain postponing a vote. They also worry the approach might favor quick, measurable decisions over slow, structural changes.

  First, I need to design a procedure that's structured yet flexible. Dewey's emphasis on collaborative inquiry means the process should focus on understanding the problem and testing solutions. The steps should include defining the problem, identifying affected parties, assessing evidence, designing pilots, and setting review mechanisms. Each step needs clear triage questions to avoid analysis paralysis.

  For the "shadow public," the procedure must explicitly list absent stakeholders and consider their interests. This could involve staff providing data on these groups or the committee brainstorming potential impacts. The "feedback horizon" requires setting timelines for reviews before decisions become irreversible. "Counterfactual visibility" means ensuring those affected understand alternatives, possibly through communication plans.

  Irreversible decisions need a higher standard of evidence and deeper deliberation. The procedure should flag such cases early and require thorough analysis of long-term impacts.

  Applying this to the three cases:
  1. **Income-based fares**: Staff has a revenue model. The procedure would check if the model includes low-income riders (shadow public), set a pilot period with clear metrics, and ensure a review before full implementation. The committee might adjust the pilot design but not override the model without evidence.
  2. **Algorithmic scheduling tool**: The board loves it, but the user wants a pilot. The procedure would reveal that without a reversibility plan or impact metrics, it's too risky. The recommendation would be to insist on a pilot with oversight, even if the board resists.
  3. **Late-night route cut**: Dismal ridership but opposed by a neighborhood group. The procedure would require identifying night-shift workers (shadow public) and analyzing alternatives before any vote. If data is missing, the vote is postponed, and the user has a script to explain why.

  The user's concern about favoring measurable decisions is valid. The procedure might struggle with long-term, structural issues. To mitigate, the "shadow public" step forces consideration of broader impacts, and irreversible decisions trigger deeper dives. However, some issues might need separate processes, like annual reviews of structural policies.

  Constraints: Committee members lack stats background, so explanations must be simple. Staff pushback requires grounding overrides in evidence. Board materials need brevity. The procedure uses templates and scripts to keep things concise.

  In summary, the procedure structures inquiry, ensures diverse voices are considered, and treats policies as experiments. It balances efficiency with thoroughness by triaging based on impact and reversibility. While it has limitations, it addresses key flaws in the current process and empowers the committee to make informed, democratic decisions.
answer: |-
  Here's a **Democratic Inquiry Procedure (DIP)** designed for your constraints, grounded in Dewey's principles. It treats policy as a testable hypothesis, prioritizes the invisible, and forces explicit value judgments. The one-page version is at the end.

  ---

  ### **The Democratic Inquiry Procedure (DIP) - 20 Minute Flow**
  *Goal: Determine if we have enough shared understanding to make a recommendation OR identify critical unknowns requiring pause.*

  **1. Frame the Experiment (3 mins)**
      *   **Triage Q1:** *"What is the core hypothesis? (e.g., 'If we do X, Y benefit will occur, and Z harm is acceptable/manageable.')"*
      *   **Good Enough:** Staff states a clear, testable claim about outcomes (benefit/cost). Not vague goals ("improve service").
      *   **STOP If:** No hypothesis exists. Send back to staff: *"Define the specific change and expected outcome you're testing."*

  **2. Map the Affected & Shadow Public (4 mins)**
      *   **Triage Q2:** *"Who *definitely* gains/loses? Include groups *not* in this room (riders, non-riders, nearby towns, future users, staff)."*
      *   **Good Enough:** Quick brainstorm list. Staff *must* confirm if data exists on key shadow groups (e.g., night-shift workers). If not, note gap.
      *   **STOP If:** A major affected group (esp. Shadow Public) is completely unacknowledged AND no path to understanding their stake exists. *"We cannot assess fairness without considering [Group X]."*

  **3. Interrogate Evidence & Reversibility (5 mins)**
      *   **Triage Q3a:** *"What's the strongest evidence supporting the hypothesis? What are its limits? (Staff explains key model/assumptions in PLAIN language)."*
      *   **Triage Q3b:** *"Is this reversible? (Yes/No/Partially). If reversed, can losers see the counterfactual?"*
      *   **Good Enough:** Staff explains *one* key strength & *one* key limitation of their evidence *in context*. Clear reversibility rating.
      *   **STOP If:** Evidence limitations are fundamental to the hypothesis AND staff cannot explain simply *why* they trust it despite limits. *OR* if irreversible and evidence for major benefit is weak/contested. *"The stakes of permanence are too high for the evidence we have."*

  **4. Design the Test & Feedback Loop (5 mins)**
      *   **Triage Q4a:** *"What's the MINIMAL test/pilot? (Smallest scale, shortest time to learn)."*
      *   **Triage Q4b:** *"How & when will we know if the hypothesis holds? (Specific metrics, data source, review trigger). Who gets feedback BEFORE it's locked in?"*
      *   **Good Enough:** Concrete pilot parameters (scope, duration) & 1-2 key outcome metrics tied to the hypothesis. Feedback mechanism defined (e.g., rider survey *before* permanent adoption).
      *   **STOP If:** No feasible way to test *or* feedback arrives too late (beyond Feedback Horizon) for course-correction. *"We can't evaluate this 'experiment' before the point of no return."*

  **5. Values Check & Recommendation (3 mins)**
      *   **Triage Q5:** *"Given what we know/can't know, is the potential harm to losers (esp. Shadow Public) justified by the potential gain? Is this fair?"*
      *   **Action:**
          *   If consensus on Q5 *and* previous steps passed: **Recommend the TEST/PILOT** as designed/refined.
          *   If disagreement on Q5: **Recommend "No"** OR **Flag Major Value Conflict** for the Board. *This is the explicit handoff to humans.*
          *   If any STOP condition was hit: **Defer Recommendation. Require More Work** (specify what).

  ---

  ### **One-Page DIP Cheat Sheet (Tape to Notebook)**
  | Step          | Key Question                                      | Good Enough Answer                                 | Stop Condition & Verbal Script                                                                 |
  | :------------ | :------------------------------------------------ | :------------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **1. Frame**  | What's the core hypothesis? (If X, then Y benefit > Z harm) | Clear, testable claim about outcome.               | **STOP:** No hypothesis. *"Staff: Define the specific change & expected outcome you're testing."* |
  | **2. Map**    | Who gains/loses? (INCLUDE Shadow Public!)         | Brainstorm list. Staff confirms data gaps.         | **STOP:** Major group ignored & no path to understand. *"We cannot assess fairness without considering [Group X]."* |
  | **3. Evidence** | Strongest evidence? Limits? Reversible? Counterfactual visible? | Staff explains 1 strength, 1 limitation. Clear reversibility (Y/N/P). | **STOP:** Fundamental evidence gap OR irreversible + weak evidence. *"Stakes too high for evidence we have."* |
  | **4. Test**   | Minimal test? How/when do we know? Who gets feedback? | Concrete pilot (scale, time), 1-2 key metrics, feedback mechanism. | **STOP:** No test possible OR feedback too late. *"Can't evaluate before point of no return."* |
  | **5. Values** | Is harm to losers justified? Fair?                | Explicit discussion.                               | **ACT:** Consensus -> Recommend Pilot. Disagreement -> Recommend "No" or Flag Conflict for Board. STOPs triggered -> Defer. *"Need more work on [Specific Gap]."* |

  ---

  ### **Applied to Your Cases**

  **Case 1: Income-Based Discounted Fares (Staff Model)**
  *   **1. Frame:** Hypothesis: "Income-based fares increase ridership among low-income groups & maintain revenue neutrality."
  *   **2. Map:** Gainers: Low-income riders. Losers: Full-fare payers? *Shadow Public:* People priced out *now* (data?), unbanked individuals (can they access discounts?), nearby towns not in system (spillover effects?).
  *   **3. Evidence:** Model strength: Matched historical elasticity data. Limitation: Assumes no fraud/misreporting. Reversible: **Yes** (fare rules can change). Counterfactual: **Likely Visible** (riders see fare changes).
  *   **4. Test:** 6-month pilot on 2 high-poverty routes. Metrics: Ridership change (income-quintile breakdown), revenue vs. projection. Feedback: Rider survey at 3 & 6 months.
  *   **5. Values:** *"Is potentially excluding some truly needy people (due to access/application barriers) justified by helping others we *can* reach? Is the administrative burden fair on staff?"* Likely **Recommend Pilot** with emphasis on monitoring access barriers.

  **Case 2: Algorithmic Scheduling Tool (Staff: 8% Cost Save, Board Loves It, You Want Pilot)**
  *   **1. Frame:** Hypothesis: "Algorithm reduces operating costs by 8% without harming service reliability or driver well-being."
  *   **2. Map:** Gainers: Taxpayers (cost save), Board (efficiency). Losers: Drivers (schedule disruption?), riders (reliability change?). *Shadow Public:* Future riders (if service degrades subtly), drivers' families.
  *   **3. Evidence:** Strength: Vendor case studies. **CRITICAL LIMITATION:** No local validation; "harm" undefined (reliability/well-being). Reversible: **Partially** (entrenched tool hard to remove). Counterfactual: **Low Visibility** (drivers/riders won't easily see *what schedule they'd have had*).
  *   **4. Test:** Your 1-year single-depot pilot is **essential**. Metrics: Cost *AND* On-Time Performance *AND* Driver satisfaction/survey. Feedback: Driver union input at 3/6/9 months BEFORE full rollout.
  *   **5. Values:** *"Is risking driver morale and potential hidden service degradation for an 8% saving justified? Do we trust vendor claims without local proof?"* **DIP Outcome:** STOP/Defer triggered at **Step 3 (Evidence)**. Evidence limitations are fundamental (no local harm assessment) AND reversibility is partial. **You cannot recommend full adoption.** Your pilot idea *is* the DIP-compliant path. **Recommendation:** *"Implement ONLY as a 1-year pilot at Depot X with strict metrics on cost, reliability, AND driver impact. Full adoption requires positive pilot review."* (This is the hard truth: DIP forces the pilot).

  **Case 3: Cut Late-Night Route (Low Ridership, Neighborhood Wants It Gone)**
  *   **1. Frame:** Hypothesis: "Eliminating Route 99 saves $Y with minimal rider disruption (due to low ridership)."
  *   **2. Map:** Gainers: Taxpayers (save $), Neighborhood (less noise/traffic?). Losers: Current Night Riders. *SHADOW PUBLIC CRITICAL:* **Night-shift workers** (cleaners, hospital staff, etc.) - Do they exist? Data? Alternatives?
  *   **3. Evidence:** Strength: Low ridership counts. Limitation: Counts may miss essential workers; no data on trip purpose/alternatives. Reversible: **Yes** (can reinstate). Counterfactual: **High Visibility** (riders know they lost service).
  *   **4. Test:** N/A (Cutting is the 'test'). Metrics: Save $, track complaints, monitor alternatives. Feedback: Complaint tracking system.
  *   **5. Values:** *"Is stranding even a small number of essential workers overnight justified by cost savings and neighborhood concerns?"*
  *   **Minimum Before Voting:** **Step 2 (Map Shadow Public) MUST be satisfied.** Staff *must* provide: 1) Ridership data broken down by *time* (not just daily total) proving low usage *specifically* on the late-night runs. 2) *Any* data on who uses it (e.g., commuter pass scans?) or a credible method to estimate essential worker impact (e.g., surveying nearby 24hr businesses). If none exists, **STOP**.
  *   **Script for Deferral (Read Aloud):** *"We've hit a STOP condition. We cannot assess the fairness of cutting this route without understanding who relies on it late at night, especially essential workers. We need staff to provide [specific data request - e.g., 'ridership counts for the 11 PM and 2 AM runs over the last month' or 'a brief survey of businesses near the terminus that operate overnight']. We cannot vote responsibly today. This work must be done before our next discussion."*

  ---

  ### **Honest Limitations & Mitigations**

  1.  **Bias Towards Legible/Quick:** Absolutely real. DIP excels at bounded interventions with measurable outcomes. It struggles with:
      *   *Slow, Structural Change* (e.g., "Does investing in bus lanes *over 10 years* shift mode share?"): DIP might only assess the *pilot installation*, not the long-term vision.
      *   *Preventative Measures* (e.g., "Will this maintenance increase *now* prevent catastrophic failure later?"): Hard to prove the counterfactual disaster was avoided.
      *   *Hard-to-Quantify Harms/Benefits* (e.g., community cohesion, perceived safety): Relies heavily on Step 5 (Values).
      *   **Mitigation:** Explicitly **carve out space for strategic reviews.** Quarterly/Annual meeting dedicated *only* to reviewing long-term trends, structural assumptions, and shadow public well-being using broader indicators (e.g., regional poverty stats, equity indices). Frame these using DIP Step 5: *"Given long-term trends [X], is our current approach to [structural issue Y] still fair/effective?"*

  2.  **Staff Pushback on Overrides:** DIP mitigates this by:
      *   Requiring **specific, evidence-based gaps** (Step 2 Shadow Public missing data, Step 3 fundamental evidence flaws, Step 4 impossible feedback loop).
      *   Focusing on **procedural stops** ("We *can't* assess this") not opinion-based overrides ("We don't *like* your model").
      *   Empowering staff by defining **exactly what data/analysis is needed** to proceed.

  3.  **Board Skimming:** Structure the **final recommendation memo** rigidly:
      *   **Header:** Proposal | Committee Recommendation (Pilot/No/Defer) | Key Reason (1-2 sentences: e.g., "Defer: Critical data missing on night-shift riders" or "Recommend Pilot: Test necessary to assess driver impacts").
      *   **Body (Bullets Only):**
          *   Hypothesis Tested
          *   Major Concerns Raised (esp. Shadow Public, Evidence Gaps, Values Conflict)
          *   *If Recommending Pilot:* Key Metrics & Review Trigger
          *   *If Deferring:* Specific Information Required

  This DIP makes your committee's deliberation *visible, structured, and grounded in democratic inquiry*. It forces consideration of the invisible, exposes assumptions, treats policy as learning, and clearly flags when values, not facts, are the deciding factor. It won't solve every power dynamic, but it provides a robust defense against rubber-stamping and shouting matches. Good luck!
