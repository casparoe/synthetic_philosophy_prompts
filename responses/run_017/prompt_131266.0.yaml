prompt: |-
  I'm 71 and retired three years ago from a career in experimental low-temperature physics — most of it was thermometry and calorimetry, which in practice meant most of it was arguing about error bars, calibration chains, and whether anybody's thermometer could actually be traced back to a standard. Since retiring I've been sitting in on a philosophy seminar at the local university (the department lets auditers in if they promise not to talk too much, a promise I find hard to keep), and I've gotten stuck on the business of interpersonal utility comparisons. The question in the background is an ordinary policy one: does this tax-and-transfer help the people it helps more than it hurts the people it hurts? Everyone seems to agree the answer depends on whether well-being is interpersonally comparable, and if so whether merely ordinally, or only "unit comparable" (same units, different zeroes, as I understand it), or fully comparable including levels — and then on whether a given moral theory, utilitarianism being the obvious customer, is entitled to help itself to that much comparability. My problem is that I can't tell whether any of this is a claim about measurement of the kind I'd recognize from a lab meeting, or something else wearing measurement language. I've read a little Harsanyi and a little Sen and I do not want a literature survey or a reading list — I can't look anything up and I don't much care who said what first.

  So here's what I'd like. Restate the comparability menu — intrapersonal von Neumann–Morgenstern cardinality, ordinal and non-comparable, unit comparability, full level comparability — in the vocabulary I actually think in: quantity and dimension, scale type (nominal through ratio), unit and zero point, gauge freedom and invariance groups, calibration against a standard, traceability, extensive versus intensive quantities, latent variables behind a monotonic instrument response, identifiability, error propagation, and what you can and can't conclude when your measurement is only defined up to a transformation group. Take them one at a time and be honest about where you have to fudge. Two things I especially want you to grapple with: first, whether there's any operation in the welfare case that plays the role that thermal contact plays for temperature — an equivalence relation like "in equilibrium with" that lets you compare across systems before you have a unit at all, or whether the absence of any interpersonal analogue of heat flow is exactly the point; and second, my own pet idea, which I half suspect is a false friend: that each person's utility function is a fiber with its own affine gauge freedom, so that comparing two people is like comparing vectors living in different tangent spaces, which requires a connection to parallel-transport them together and a metric if you want to compare magnitudes — extra structure, not something the manifold hands you. If that translation smuggles in assumptions (smoothness, a common underlying space, a natural zero) that welfare economics doesn't have, say so plainly.

  Then give me the residue report, since that's the part I'm really after. Which claims translate cleanly, which only with distortion, and which have no expression at all in metrological vocabulary? My guesses, which you should feel free to demolish: that the invariance talk is already just measurement theory and translates perfectly, possibly because the philosophers borrowed it from there; that "calibration" translates only badly, because there is no welfare kilogram in a vault in Paris and no chain of comparisons leading back to one; and that three things have no counterpart in my vocabulary at all — the fact that the demand for comparability seems to come from the moral theory rather than from the data (a metrologist would just say: then you don't get to have it), the idea that there might be a fact of the matter about how much A gains versus how much B loses even though nothing could ever measure it, and the odd normative notion that some information can exist and yet be inadmissible — that the social decision rule may not use it, for reasons that don't look epistemic. Is that last one perhaps just a prior, or a robustness requirement under model uncertainty? I don't think so, because in my experience priors get washed out by data and here no data is ever arriving. Finish by telling me what you think the residue means: is it a defect of my vocabulary, which was built for quantities you can get at with instruments and has no slot for prescriptive constraints or non-empirical facts; or is it a sign that the philosophers are running three different questions under one heading — an empirical psychological one about whether there's a common currency in human beings, a formal one about invariance classes, and a normative one about what a social decision rule is permitted to presuppose — and that the fight is really about the third one while everybody talks as if it were the first?
reasoning: |-
  Okay, let me unpack this fascinating query from a retired low-temperature physicist diving into philosophy. The core tension is between metrological precision and welfare economics' fuzzy comparability claims. 

  First, I need to map their measurement vocabulary onto utility comparability types. The physicist's toolkit—scale types, gauge freedom, traceability—is beautifully precise, but utility lacks physical anchors. When they mention thermal equilibrium as a comparison mechanism, that's spot-on for highlighting welfare's fundamental problem: no interpersonal "heat flow" to establish equivalence. 

  Their tangent-fiber analogy is clever but risky. It smuggles in mathematical structure (smooth manifold, affine connection) that welfare doesn't possess. Worse, it implies a common underlying space—do all humans really share a "well-being manifold"? Doubtful.

  Now the residue analysis:
  - Invariance groups translate perfectly (philosophers did borrow this from measurement theory).
  - "Calibration" fails because no SI unit for happiness exists. 
  - Three irreconcilables: (1) Moral theories demanding comparability without empirical support—a metrologist would scoff, (2) The metaphysical claim about immeasurable facts, (3) Normative exclusion of information.

  Ah, the crucial insight: Philosophers are conflating three distinct issues! The surface fight about "can we measure?" masks deeper normative battles. When Sen argues for partial comparability, he's really negotiating what ethical theories should assume, not describing psychology. 

  Final verdict: The physicist's vocabulary isn't deficient—it's exposing welfare economics' category errors. The un-translatable residues are signposts where philosophy departs from empirical accountability. That third bucket—normative constraints on admissible information—isn't a prior; it's a value judgment disguised as epistemology. No wonder calibration chains can't reach it.
answer: |-
  Here's a translation into your metrological vocabulary, followed by a residue report identifying where the analogy holds, distorts, or fails entirely. I'll be ruthlessly honest about the fudges.

  ### Core Concepts Translated
  1.  **Intrapersonal vNM Cardinality:**
      *   **Translation:** A ratio-scale quantity with an arbitrary zero. Think **temperature scales (Celsius, Fahrenheit)** before absolute zero is fixed. The vNM axioms provide an *extensive structure* via lotteries, yielding an affine scale: `u' = a*u + b` (a > 0). Dimension: "Utility Units (UU)" per individual. Calibration: Preferences over lotteries define the scale *for that person*. "Zero UU" is arbitrary; the scale is unique up to affine transformation (choice of unit and zero point).
      *   **Fudge:** vNM utility is inferred from *choices*, not direct sensation measurement. It's a *latent variable* behind the monotonic instrument response of "revealed preference under risk." Identifiability is only up to affine transform per individual.

  2.  **Ordinal & Non-Comparable:**
      *   **Translation:** A nominal-scale quantity ("happier than") per individual. Dimensionless within a person (only order matters). Comparing individuals is like comparing apples (Person A's "utils") to oranges (Person B's "utils") – **different dimensions entirely, no common unit or zero**. Instrument response is monotonic but uncalibrated across systems. Invariance group: Individual monotonic transformations `φ_a(u_a)`, `φ_b(u_b)`.
      *   **Fudge:** None. This is the null hypothesis in your lab: no traceability chain exists between instruments (people).

  3.  **Unit Comparability (Cardinal Measurability, Ratio Scales):**
      *   **Translation:** Ratio scales for each person, **common unit, arbitrary zeros**. Dimension: "UU". Transformation: `u'_a = k * u_a`, `u'_b = k * u_b` (k > 0). Invariance group: common positive scaling. This allows comparing *differences* (`Δu_a` vs `Δu_b`) meaningfully, but not absolute levels (`u_a` vs `u_b`). Think comparing temperature *changes* in Kelvin (`ΔT_A` vs `ΔT_B`) without knowing initial temperatures.
      *   **Fudge:** Requires a strong assumption: a *natural, common unit* exists across people. But what calibrates this unit? There's no "welfare joule" standard. The transformation group reflects this theoretical possibility, not empirical access.

  4.  **Full Level Comparability (Cardinal Measurability & Full Comparability):**
      *   **Translation:** Ratio scales for each person, **common unit AND common zero point**. Dimension: "UU". Transformation: `u'_a = k * u_a`, `u'_b = k * u_b` (k > 0) -- *same k for all*. Invariance group: common positive scaling only. Allows comparing both levels (`u_a` vs `u_b`) and differences (`Δu_a` vs `Δu_b`). Think absolute temperature in Kelvin (`T_A` vs `T_B`).
      *   **Fudge:** Massive. Requires both a natural common unit *and* a natural, universal zero point ("absolute zero utility"). No empirical procedure establishes either. This is pure theoretical construction.

  ### Grappling with Specifics
  1.  **The "Thermal Contact" Analogy (Missing Interpersonal Equivalence):**
      *   **Translation:** You've nailed the core problem. Temperature comparison relies on the empirical, transitive relation "in thermal equilibrium" established via heat flow. This *precedes* the choice of scale/unit. **There is no empirically robust, transitive interpersonal equivalence relation ("in welfare equilibrium") established by an analogue of "welfare flow" (e.g., empathy, resource transfer).** Empathy is intransitive, noisy, and non-equilibrating; resource transfer changes the state. This absence is *the* fundamental barrier to empirical interpersonal comparability. Without it, there's no "zeroth law" for welfare to bootstrap comparison.

  2.  **Your "Affine Gauge Freedom / Tangent Fiber" Idea:**
      *   **Translation Insight:** Each person's utility scale *is* like a fiber with affine gauge freedom (`u_i' = a_i * u_i + b_i`). Comparing utilities *between* people requires "parallel transport" across these fibers.
      *   **Where it Smuggles Structure (and Fails):**
          *   **Smooth Manifold:** Assumes a single underlying "welfare manifold" for all humans. Is there evidence preferences/well-being have a common, smooth latent structure? Highly debatable.
          *   **Natural Connection:** What defines the "shortest path" or "parallelism" for transporting utility? This requires *additional normative structure* (e.g., assuming risk attitudes define the connection, or imposing a prior distribution). The manifold (humanity) doesn't provide it empirically.
          *   **Metric:** Comparing magnitudes after transport requires a metric on the manifold. Where does this come from? This is precisely the "common unit" problem again, now embedded in extra mathematical structure.
          *   **Natural Zero:** The affine freedom implies `b_i` is arbitrary. Your analogy inherently assumes the *possibility* of defining a connection/metric, begging the question against non-comparability.
      *   **Verdict:** A sophisticated way to *represent* the problem, but it doesn't *solve* it. It translates the problem into differential geometry, requiring equally unjustified assumptions (the connection, the metric) as the original welfare economics question. It's a false friend if presented as a solution; it's a useful metaphor if presented as a representation of the formal challenge.

  ### The Residue Report
  Here's what translates cleanly, poorly, or not at all from your list:

  1.  **Translates Cleanly:**
      *   **Invariance Groups / Transformation Classes:** This *is* the core formal contribution measurement theory makes to this debate. Ordinal/Non-Comparable ~ Monotonic Transforms per person. Unit Comparable ~ Common Positive Scaling. Full Comparable ~ Common Positive Scaling Only. Philosophers (Sen especially) explicitly borrowed this framework from measurement theory (Stevens, Suppes, et al.). This is the lingua franca.
      *   **Scale Types (Nominal, Ordinal, Interval, Ratio):** Maps directly onto the comparability menu: Ordinal Non-Comparable (Nominal across persons), Unit Comparable (Ratio scales per person, common unit), Full Comparable (Ratio scales, common unit & zero). Interval scales (affine transforms per person) map to vNM cardinality *without* comparability assumptions.
      *   **Identifiability up to Transformation Group:** Exactly the formal constraint. Welfare information is only identified up to the relevant invariance group for the assumed comparability.
      *   **Latent Variable Behind Monotonic Instrument Response:** Perfect description of utility as inferred from choice data (preferences).

  2.  **Translates Poorly / With Distortion:**
      *   **Calibration:** In the lab, calibration means traceability to a physical standard via a chain of comparisons. *There is no welfare standard.* "Calibration" in welfare usually means *assuming* a specific functional form (e.g., CRRA utility) or *imposing* a normalization (e.g., `u(death)=0, u(perfect health)=1`) based on convenience or theory, not empirical traceability. It's calibration *without a standard*. Distortion: It borrows the *language* but lacks the *empirical foundation*.
      *   **Traceability:** Impossible. No chain of comparisons leads to a standard. Claims of traceability are purely theoretical constructs (e.g., "if we assume all humans have identical risk aversion parameters, then...").
      *   **Extensive vs. Intensive:** Utility is treated as intensive (like temperature). While money or resources are extensive, utility derived from them isn't necessarily additive across people. The analogy doesn't clarify much here.
      *   **Error Propagation:** We can model uncertainty in *estimating* a person's utility function *given a scale and comparability assumption*. But the dominant "error" is the *model uncertainty* about the correct transformation group itself, which isn't like instrument noise.

  3.  **Has No Counterpart / Creates Residue:**
      *   **Demand from Moral Theory, Not Data:** This is the biggest residue. A metrologist would say, "If you can't establish the traceability chain for full comparability empirically, you don't get to use it." Welfare economics (especially utilitarianism) says, "We *need* it for this normative purpose (summing utilities), so we'll *assume* it (unit or full comparability) is meaningful." This is a **normative leap**, not an empirical finding. The "entitlement" question is inherently normative.
      *   **Immeasurable Fact of the Matter:** The claim that "A gains more than B loses, even if unknowable" has no counterpart. Metrology deals with *empirical access*. If something is fundamentally immeasurable even in principle (like interpersonal utility levels without comparability assumptions), a physicist might say the concept lacks empirical content or operational definition. Philosophers might argue it's a metaphysical claim.
      *   **Normative Exclusion of Information ("Inadmissible Information"):** This is **not** a prior or robustness requirement. A prior incorporates information; robustness tests sensitivity. Normative exclusion (e.g., "the social rule shouldn't use information about people's desert, only their utilities") is a **value judgment** restricting the *inputs* to the decision rule itself, regardless of epistemic status. It's like saying a voltmeter *must not* use temperature readings in its calculation, even if temperature affects resistance and thus the true voltage. In metrology, you'd use all *relevant* empirical information to correct the measurement. In social choice, "relevant" is normatively contested. No data will resolve this exclusion; it's a prescriptive constraint.
      *   **The Source of Comparability:** In physics, comparability (e.g., temperature) is *discovered* empirically (via heat flow). In welfare, comparability is *stipulated* normatively to satisfy a moral axiom (e.g., Harsanyi's Impartial Observer needing full comparability).

  ### What the Residue Means
  **Your vocabulary isn't defective; it's exposing the seams in the philosophical project.** You've precisely identified the core issue: **Philosophers and welfare economists are indeed running three distinct questions together under the heading of "interpersonal comparability":**

  1.  **Formal/Representational:** What invariance classes are consistent with the observable data (preferences, choices)? (This translates perfectly to your measurement theory).
  2.  **Empirical/Psychological:** Is there evidence of a common neurobiological "currency" or psychological structure that could *support* meaningful interpersonal comparisons (e.g., similar neural responses to gains/losses, consistent risk attitudes)? (This translates poorly - the "calibration without a standard" problem - and the evidence is suggestive but inconclusive).
  3.  **Normative/Ethical:** What assumptions about comparability *must* or *may* a moral theory (like utilitarianism) or a social decision rule *presuppose* or *be entitled to use* to generate the desired ethical conclusions? (This creates the residue - demands without empirical support, inadmissible information, immeasurable facts).

  **The fight is absolutely about the third question while often being conducted in the language of the first (and occasionally gesturing to the second).** The residue – the normative demands, the stipulations, the exclusions – is the signature of the ethical debate masquerading as a measurement debate. Your metrological vocabulary, built for quantities accessible via instruments and traceable standards, brilliantly reveals where the ethical argument takes over from the empirical or representational one. The philosophers aren't *wrong* to use invariance language; they're using the correct formalism for representing information constraints. But they are often *unclear* that the key moves (demanding unit or full comparability, excluding certain information) are driven by normative commitments about what social evaluation *should* look like, not by the discovery of an interpersonal equivalent of thermal equilibrium or a Parisian utility standard. The absence of the "welfare heat flow" is indeed the point – it leaves room for the normative argument to fill the void.
