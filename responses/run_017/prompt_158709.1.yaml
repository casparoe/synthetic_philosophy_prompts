   Principle 3: Aspect-Realism Principle
     - Name: "Aspect-Realism"
     - Statement: A dispute is many-sided iff the subject has multiple real aspects and each claim corresponds to one of these aspects. The aspects must be verifiable by a reliable means of knowledge (pramana) and the claims must not be mutually exclusive in the same respect.
