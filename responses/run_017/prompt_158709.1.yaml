     Anekāntavāda cannot decide which aspects are real and which are projections. That depends on epistemology (pramana). Also, it does not help when the dispute is about absolute truths that do not admit of multiple aspects (like mathematical truths: 2+2=4 is absolutely true). Moreover, it does not tell us how to reconcile the aspects for practical purposes. That requires additional wisdom or context.

