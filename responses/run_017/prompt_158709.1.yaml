          - Verdict: legit? But note: the user's principle and Aspect-Realism would say that there are multiple aspects. One aspect is the historical injustice (which is real) and the legal/moral obligation, and the other might be the current state (statute of limitations, changed circumstances). But note: this is not just about aspects of the same subject but about a normative claim. The Aspect-Realism principle might not apply directly to normative claims. However, we can see it as: the claim about owing reparations might be true from a moral perspective and false from a legal perspective. So if the dispute is about different respects (moral vs legal), then it is many-sided. But if they are both arguing from the same respect (e.g., both from morality), then it might be that one is wrong. We must know the respects. Without more context, we can say: if they are different respects, then legit. Otherwise, not.

