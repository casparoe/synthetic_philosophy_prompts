prompt: |-
  Running a 45-minute discussion at my local rationality meetup on Sunday, about a dozen people, mostly programmers, who've all absorbed the standard chart where beef is by far the worst thing you can eat, and none of whom have ever heard the crop-cultivation argument. I don't want to convert anyone. I want them to leave able to see why the beef-vs-chicken ordering is much more fragile than the chart makes it look, and how much of it hangs on land use and on what you think about insects. Don't give me the argument, give me a plan for it.

  Specifically: the order the pieces have to land in and what depends on what (my guess is that per-calorie normalization has to come before everything, since "a cow suffers more than a chicken" is the intuition everyone walks in with, but tell me if I've got the dependency backwards); the one comparison case that can carry the whole session, and what it needs to have and not have; the wrong moves to expect — I'm guessing the "one person's demand is a rounding error" objection and the "the animal wouldn't have existed anyway" one, and I want to know where in the sequence to defuse each rather than just having answers ready — and a question I can ask at the end that distinguishes people who've got the structure from people who've just swapped "beef is worst" for "chicken is worst" as a slogan.

  One wrinkle I want built in, because I haven't seen anyone make it and I think it's right: land spared by not eating beef doesn't become a blank, it becomes habitat, habitat holds wild animals, and if your view counts wild suffering then sparing land can plausibly be worse than farming it — which flips the ranking a third time. Tell me where that goes in the sequence, or tell me if it derails the session and should be cut.

  Also say outright what I should refuse to get into at this length. I definately don't want to recite hectares-per-kilogram figures from memory and get fact-checked mid-session, so nothing in the plan should depend on numbers. Under 600 words, short paragraphs, no bullet soup.
reasoning: |-
  Okay, the user is organizing a 45-minute discussion at a rationality meetup with about a dozen programmers. They're all familiar with the standard chart showing beef as the worst food environmentally, but haven't heard the crop-cultivation argument. The user wants participants to understand why the beef-vs-chicken ranking is fragile, focusing on land use and insect suffering. They need a structured plan, not the arguments themselves.

  The key points are: the sequence of ideas, a central comparison case, handling objections, and a distinguishing question. There's also a wrinkle about land sparing leading to wild animal suffering. The user wants to avoid numerical debates and keep it conceptual.

  First, I need to determine the flow. Start with the common intuition that cows suffer more than chickens per animal. Then introduce calorie normalization since that's foundational. Without this step, participants might not grasp why land use matters for suffering comparisons.

  Next, bring in land use as the hidden factor. Beef requires more land per calorie, leading to more crop cultivation. This transitions to insects - the real victims of crop farming. The comparison case should be simple: same calories from beef vs chicken, emphasizing land differences and insect deaths.

  Anticipate objections. "Individual demand is a rounding error" might come up early. Address it by framing the discussion as about relative impacts, not individual actions. The "non-existence" objection is trickier; it's better to flag it as unresolved rather than dive deep.

  The land sparing wrinkle is important but complex. Introduce it late as a third flip to show the ranking's fragility. Present it as a thought experiment without endorsing any view. This keeps the focus on uncertainty.

  End with a question to test understanding: "What would change your mind about the beef-chicken ranking?" This reveals if they've grasped the dependencies rather than swapping slogans.

  Avoid numerical data and fact debates. Steer clear of long discussions on wild animal suffering ethics. Keep the session conceptual and time-boxed. The goal is awareness of complexity, not conversion.
answer: |-
  Here’s a focused 45-minute discussion plan avoiding numbers and staying conceptual:

  **Opening (5 min):**  
  Start with shared ground: "We all know the chart: beef > lamb > cheese > pork > chicken. Today, we poke at *why* beef is worst – and how shaky that beef-vs-chicken ordering might be. Goal isn’t to convince you beef is good, but to see the fragility."

  **Core Sequence:**

  1.  **The Intuition Trap (5 min):**  
      Acknowledge the obvious: "A cow suffers more than a chicken *per animal*. Seems straightforward. But is 'per animal' the right metric for comparing diet impacts?" Seed doubt: "What if one food requires vastly *more* of something harmful per calorie?"

  2.  **Pivot to Calories (Crucial - 10 min):**  
      **Key Move:** "For comparing foods fairly, we need a common unit. Calories consumed is the standard. A cow suffers immensely, but it also provides vastly more calories than a chicken. If it takes 10 chickens to get the calories of 1 cow, suddenly the suffering *per calorie* picture changes." *Don't calculate, conceptualize.* "The suffering-per-calorie gap shrinks dramatically."

  3.  **Introduce the Hidden Lever: Land Use (10 min):**  
      **The Pivot Point:** "But the *big* difference isn't just the animal. Beef requires *far* more land per calorie than chicken. What happens on that land?"  
      **The Comparison Case (Carries the Session):**  
      "Imagine two fields. Field A grows crops to feed a cow that gives you X calories. Field B grows crops to feed chickens that give you the *same* X calories. Field B is *much smaller*. **Why does the *size* of the field matter ethically?**"  
      *Draw it out:* Smaller field = less land cultivated = fewer insects killed by pesticides/tilling/harvesting per calorie. This flips the script: chicken might cause *more* suffering per calorie *if* you count massive insect deaths from crop production.

  4.  **Defusing Key Objections (Integrated):**  
      *   **"Rounding Error" (Address during Land Use):** "Even if *my* demand is small, the *relative* impact difference between beef and chicken per calorie is huge. Understanding this difference shapes markets, advice, and policy."  
      *   **"Wouldn't Exist Anyway" (Flag Briefly):** "This is deep. Does bringing an animal into existence to suffer for food create an ethical debt? *If* you think 'no', it favors chicken. *If* you think 'yes', it might favor plants... or complicate everything. We won't resolve this today. Key point: **The crop argument challenges beef's 'worst' status *even if* you accept the 'non-existence is neutral' view common in EA circles.**"

  5.  **The Wrinkle: Land Sparing & Wild Suffering (5 min - Late Stage):**  
      "Hold on. If eating less beef spares land... what happens to that land?"  
      *   "It often becomes habitat. Habitat holds wild animals."  
      *   "If you believe wild lives are net suffering (major debate!), then sparing land *increases* wild suffering. Suddenly, using land *for* beef (requiring lots of it) might cause *less* suffering than sparing it for wild animals!"  
      *   **Purpose:** Show the ranking flips *again* based on this controversial view. Reinforces fragility. "This isn't endorsement, it's illustration: **The beef-vs-chicken ordering depends massively on your ethical view of wild insects and animals.**"

  **Closing & Distillation (10 min):**  
  *   Summarize the flips:  
      1.  Per Animal: Beef worse.  
      2.  Per Calorie + Crop Deaths: *Possibly* Chicken worse.  
      3.  Per Calorie + Crop Deaths + Wild Suffering View: Beef *might* be better again.  
  *   **The Key Question (Test Understanding):**  
      "**What single piece of information, if proven true, would make you most confident that chicken is *worse* than beef per calorie?**"  
      *Good Answer:* Evidence that insect deaths per hectare of crop cultivation are extremely high *and* that spared land leads to significant net wild animal suffering. (Shows grasp of the dependencies).  
      *Bad Answer:* Just "insect deaths" (misses land sparing) or "cows suffer less per calorie" (misses the crop/wild link).

  **What to REFUSE to Get Into:**  
  *   **Specific Hectares/kg or Deaths/kg numbers.** "Let's keep this conceptual; the *relationships* matter more than precise figures today."  
  *   **Deep dives into wild animal suffering ethics.** Acknowledge it's contested, illustrate its *effect* on the ranking, move on.  
  *   **Debating veganism vs. vegetarianism.** Stay focused on *relative* meat impacts.  
  *   **Resolving the "non-existence" argument.** Flag it as a major unresolved pillar, but don't try to solve it.

  **Goal:** They leave seeing the standard chart rests on specific (contestable) choices: per-animal focus, ignoring crop deaths, assuming spared land is neutral/good. The beef-vs-chicken ordering is highly sensitive to land use efficiency and views on insect/wild animal suffering.
