  First, I need to recall Arendt's framework precisely. Her three grades are: 1) Ordinary deliberate lies where the liar knows the truth but constructs an alternative reality; 2) Self-deception where the liar believes their own falsehoods; 3) Organized image-making that destroys the very distinction between truth and falsehood. The user wants each grade located concretely in the Iraq case - specifying who lied about what, to whom, and which category fits.

