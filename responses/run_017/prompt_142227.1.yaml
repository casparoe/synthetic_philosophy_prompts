prompt: |-
  Bit of a weird one. I've just taken over as head of people at a ~200-person organisation (officially as of last Monday) and the first thing that lands on my desk is a 'generational inclusion' strategy from a consultancy that wants us to run separate onboarding for Gen Z. At home I've got my stepson, 17, and my dad, 74, both living with me at the mo, so I get both ends of this discourse over breakfast. And I was born in one of those cuspy years that every quiz sorts differently, so I've never really known which box I'm in.

  I don't want to bin the document on a hunch, and I don't want to sign it off either. So before I read any more about generations I want to know what I should be demanding of an account of them. Write me the spec: what would a theory have to get right for a sentence like 'Gen Z are like that' to be more than a vibe?

  Purpose, so you know what adequacy is relative to here: good enough (a) to decide whether a generational policy at work could ever be coherent, and (b) to say whether cohort talk is tracking something real, or whether its just a polite way of saying 'young people' or 'the economy'.

  Here's what I've got so far, some of which I suspect are just one camp's prejudices. Tell me which requirements are genuine, which aren't, and which ones I'm missing entirely:

  1. It has to seperate cohort effects from age effects and period effects. Otherwise 'Gen Z are X' might only mean 'people who are 22 are X' or 'people in 2025 are X'.
  2. The boundaries have to come from somewhere other than whoever named the thing, and whatever the theory says shouldn't flip if you nudge a cut-off by a year or so.
  3. If there's a mechanism behind it, the effect should grade with how much of it you actually got rather than step at a birth-year line. My stepson and his mate born eleven months apart are not different animals.
  4. It has to cope with migration. Kid arrives in the UK at 13 from a completely different school system — is he in the cohort his birth year says, or not? And is 'Gen Z' even exportable, or is it an Anglophone thing that goes a bit odd in, say, Poland or Nigeria?
  5. It has to cope with within-cohort spread. If one birth year contains wildly diverging lives — class, region, religion, whether your parents had any money — maybe the cohort isn't picking out a shared thing at all.
  6. It has to say whether the label is doing any explanatory work, or just sitting on top of the actual causes, which don't line up neatly with year boundaries.
  7. It has to deal with the fact that once people believe in generations they start treating each other accordingly, so the categories partly make themselves true. I genuinely can't tell whether that's a requirement or a trap.
  8. It has to be clear whether generations are the same sort of thing as family generations — my dad, me, my stepson — or a completely different animal that just happens to share the word.

  One more thing I keep tripping over: people throw around 'real kind' as if we all know what that would take. Is there a requirement in there somewhere, or is the whole ontology question a red herring for my purposes?

  For each requirement you keep, give me the case behind it and mark it non-negotiable or negotiable. Flag any pair that can't both be satisfied — that's the bit I most want, because I think my list might be asking for something impossible. Tell me which single requirement does the most damage to the ways people actually talk about generations, and add the ones I've missed. Don't skimp on the criteria. And give me a short scorecard too, on four views: cohorts as demographic kinds fixed by birth year and fertility rates; generations as groups with a shared formative history; generations as self-fulfilling human kinds; and the view that there's nothing here but age and period effects. Ta.
reasoning: |-
  Okay, let's tackle this query step by step. The user is the new head of people at a 200-person organization and has been handed a 'generational inclusion' strategy proposing separate onboarding for Gen Z. They're skeptical but don't want to dismiss it outright. Their background includes living with both a 17-year-old stepson and a 74-year-old dad, giving them personal exposure to different age groups. They're also from a cusp year themselves, adding to their ambivalence.

  The core question is: What criteria must a generational theory meet for statements like "Gen Z are like that" to be more than just a vibe? The user has listed eight requirements and wants them evaluated, expanded, and turned into a spec. Two deeper purposes: (a) decide if generational policies at work can be coherent, and (b) determine if cohort talk tracks something real or just masks "young people" or economic factors.

  First, I need to assess each of their eight requirements. For each, I'll judge if it's genuine (based on scientific rigor) or biased, mark it negotiable/non-negotiable, explain why, and note any conflicts. The user also wants to know which single requirement most undermines common generational talk, and what they've missed entirely.

  Key angles they're considering:
  - Separating cohort, age, and period effects (Requirement 1) is fundamental in demography—non-negotiable.
  - Boundary robustness (Requirement 2) questions arbitrary cut-offs—non-negotiable for scientific validity.
  - Mechanism gradation (Requirement 3) challenges binary thinking—non-negotiable but hard to implement.
  - Migration and cultural export (Requirement 4) tests universality—important and negotiable based on context.
  - Within-cohort diversity (Requirement 5) addresses oversimplification—non-negotiable for fairness.
  - Explanatory power (Requirement 6) probes if labels are causal or descriptive—non-negotiable for policy use.
  - Self-fulfilling prophecies (Requirement 7) is both a requirement and a trap—negotiable but critical for ethics.
  - Family vs. societal generations (Requirement 8) clarifies confusion—non-negotiable for precision.

  Missing requirements I should add:
  - **Empirical evidence**: Needs data beyond surveys.
  - **Predictive validity**: Must predict future behaviors.
  - **Policy harm assessment**: Avoids reinforcing stereotypes.
  - **Temporal consistency**: Effects should persist over time.
  - **Causal depth**: Links to tangible drivers like tech or economics.

  Conflicts to highlight:
  - Gradation (3) vs. clear boundaries (2) is tricky—cohorts can't be both fuzzy and precise.
  - Self-fulfilling effects (7) can distort reality, making validation hard.

  The "real kind" ontology question: For workplace purposes, it's a red herring. What matters is whether the categorization is useful and non-harmful, not metaphysical debates.

  Scorecard for four views:
  1. **Demographic kinds**: Fails most requirements—only tracks fertility, not culture.
  2. **Shared formative history**: Does best on 1, 4, 6 but struggles with 3, 5, 7.
  3. **Self-fulfilling kinds**: Excels at 7 but fails 1, 2, 6—it's descriptive, not explanatory.
  4. **Age/period effects only**: Aces 1, 5 but dismisses cohort uniqueness—may be the null hypothesis.

  The most damaging requirement to common discourse is #5 (within-cohort spread). Popular generalizations ignore diversity, rendering statements like "Gen Z are digital natives" inaccurate for many.

  Final advice: The spec suggests generational policies are incoherent without meeting these bars. Separate onboarding based solely on birth year risks being essentialist. Better to focus on granular, evidence-based factors like tech familiarity or economic vulnerability.
answer: |-
  Here’s your spec for evaluating generational theories, designed to cut through the vibes and assess whether "Gen Z are like that" holds water for workplace policy. I’ve refined your requirements, flagged conflicts, added missing criteria, and included a scorecard. Bottom line up front: **No existing generational framework satisfies all non-negotiables, making birth-year-based policies like separate onboarding ethically and empirically shaky.** Use this to challenge the consultancy’s proposal.

  ---

  ### **Your Requirements: Genuine, Biased, or Missing?**
  *(Non-negotiable = Core to scientific validity; Negotiable = Context-dependent)*

  1. **Separate cohort, age, and period effects**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** Without this, you can’t distinguish "Gen Z traits" from universal youth behavior (age effects) or current events like COVID (period effects). Example: If Gen Z seeks "work-life balance," is that unique to them or a broader trend? Failure here invalidates the entire premise.  
     - **Conflict:** Inherently clashes with self-fulfilling prophecy (Requirement 7) – if society treats cohorts differently, it creates artificial period effects.

  2. **Boundaries must be robust, not arbitrary**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** If shifting a cutoff by a year (e.g., 1996 vs. 1997 for Gen Z) changes the theory’s predictions, it’s astrology, not science. Boundaries should align with major societal shifts (e.g., internet adoption), not consultant whims.  
     - **Conflict:** Directly opposes gradation (Requirement 3) – sharp boundaries imply abrupt changes, but reality is gradual.

  3. **Effects must grade with exposure, not birth year**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** Your stepson and his friend aren’t different species. A theory must reflect *dose-response* (e.g., someone with early internet access vs. late, regardless of birth year). Policies based on birth year alone exclude outliers (e.g., a tech-illiterate Gen Zer).  
     - **Conflict:** Undermines Requirement 2 (clear boundaries) – grading blurs lines, making cohorts messy for policy.

  4. **Cope with migration and cultural export**  
     - **Verdict:** Genuine but **Negotiable**.  
     - **Why:** A kid moving from Nigeria to the UK at 13 may share more with local peers than their birth cohort. "Gen Z" assumes Western/national context – applying it globally ignores divergent formative experiences (e.g., economic instability vs. war). *But*: If your workforce is homogeneous, this may matter less.  
     - **Case:** If your onboarding separates a Nigerian-born and UK-born 2005 baby, it’s absurd.

  5. **Account for within-cohort spread (class, region, etc.)**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** The richest and poorest Gen Zers have less in common than with adjacent cohorts. If "Gen Z traits" (e.g., "digital native") only apply to privileged urbanites, the cohort label is masking privilege, not explaining behavior. Policies must avoid stereotyping.  
     - **Most damaging to popular discourse:** This requirement eviscerates blanket statements like "Gen Z needs X." Real-world diversity makes such claims reductive.

  6. **Explanatory power > descriptive labeling**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** If "Gen Z" is just a proxy for "people entering the workforce during late-stage capitalism," the label isn’t doing work – the *economy* is. A valid theory must show cohorts add unique explanatory value (e.g., "2008 financial crisis uniquely shaped Millennials’ risk aversion").  

  7. **Address self-fulfilling prophecies**  
     - **Verdict:** Genuine but **Negotiable** (it’s both requirement and trap).  
     - **Why:** If managers treat Gen Z as "needy," they may create that reality. But this makes validation impossible – is the trait "real" or manufactured? *For policy:* Avoid reinforcing stereotypes.  
     - **Trap:** Overemphasizing this lets theories off the hook for empirical rigor.  

  8. **Clarify family vs. societal generations**  
     - **Verdict:** Genuine & **Non-negotiable**.  
     - **Why:** Family generations are biological; societal generations are cultural constructs. Conflating them (e.g., "Gen Z are like grandchildren") is misleading. Policies need clarity: onboarding targets *cultural* cohorts, not literal descent.  

  ---

  ### **Missing Requirements (Added)**
  9. **Empirical evidence beyond surveys**  
     - **Non-negotiable.** A theory must be testable with hard data (e.g., behavioral studies, economic outcomes), not just self-reported attitudes. If "Gen Z is entrepreneurial," show startup rates vs. older cohorts at the same age.  
     - *Why you missed it:* Your list focuses on logic, but proof is key for policy.  

  10. **Predictive validity**  
      - **Non-negotiable.** Can the theory predict future behaviors? (e.g., "Gen Z will prioritize flexibility in 2030"). If not, it’s hindsight bias.  
      - *Case:* Boomers were called "idealistic" young; now they’re "conservative." Age or cohort?  

  11. **Harm/benefit analysis of reification**  
      - **Negotiable but critical.** Even if cohorts are "real," does labeling them *improve* inclusion? Or does it license discrimination (e.g., "Millennials are lazy")? Mandatory for ethical policy.  

  12. **Temporal consistency**  
      - **Non-negotiable.** Cohort effects must persist over time. If "Gen Z traits" vanish by age 30, they’re age effects in disguise.  

  13. **Causal mechanism specificity**  
      - **Non-negotiable.** What *causes* cohort effects? Technology? Economics? A theory must specify and link to data (e.g., "Smartphone access at age 10 correlates with X").  

  ---

  ### **The "Real Kind" Ontology Question**
  - **Verdict: Red herring for your purposes.** You don’t need metaphysical certainty ("Are generations like biological species?"). You need to know if cohort labels **explain more than age/period effects + individual variance**. If not, they’re useless for policy. Focus on predictive power and harm reduction.  

  ---

  ### **Conflicts: Where Requirements Clash**
  - **Gradation (3) vs. Boundaries (2):** Cohorts can’t have sharp cutoffs *and* gradual effects. *Resolution:* Prioritize gradation – policies should focus on exposure (e.g., "digital fluency"), not birth years.  
  - **Self-fulfilling (7) vs. Explanatory power (6):** If cohorts are socially constructed, they "work" but aren’t "real." *Resolution:* Demand evidence they exist *before* widespread belief (e.g., pre-2010 Gen Z data).  
  - **Within-cohort spread (5) vs. Policy coherence:** Accounting for diversity makes cohort-wide policies inefficient. *Resolution:* Bin generational policies; target *actual drivers* (e.g., skills gaps).  

  ---

  ### **Scorecard: Four Views of Generations**
  *(Rating: ★ = Poor, ★★★★ = Excellent for your spec)*  

  | **Theory**                          | Cohort vs. Age/Period (Req 1) | Boundaries (Req 2) | Gradation (Req 3) | Within-Cohort Spread (Req 5) | Explanatory Power (Req 6) | **Overall Fit for Policy** |  
  |-------------------------------------|--------------------------------|-------------------|-------------------|------------------------------|---------------------------|----------------------------|  
  | **1. Demographic Kinds** (Fixed by birth/fertility) | ★ (Ignores period effects) | ★★★ (Clear but arbitrary) | ★ (Rigid steps) | ★ (Ignores class/culture) | ★ (Descriptive only) | ★ Poor – Only tracks population size, not traits. |  
  | **2. Shared Formative History** (Events shape cohorts) | ★★★★ (Best on Req 1) | ★★ (Tied to events, but fuzzy) | ★★ (Some grading, e.g., exposure timing) | ★★ (Acknowledges, but often glossed) | ★★★ (Links causes e.g., "9/11 shaped Millennials") | ★★★★ Best – Explains cultural cohesion but struggles with diversity/arbitrary boundaries. |  
  | **3. Self-Fulfilling Human Kinds** (Belief creates reality) | ★ (Conflates period/cohort) | ★ (Boundaries defined by popular belief) | ★★★ (Grading via stereotype adoption) | ★ (Amplifies stereotypes) | ★ (Circular: "It’s real because we act on it") | ★★ Risky – May "work" but entrenches bias. Unethical for HR. |  
  | **4. Only Age/Period Effects** (No cohort uniqueness) | ★★★★ (Gold standard for Req 1) | N/A (Rejects cohorts) | ★★★★ (Continuous variables) | ★★★★ (Centers individual factors) | ★★★★ (Attributes causes accurately) | ★★★★★ Most coherent – Forces focus on *modifiable* factors (e.g., training for all new hires). |  

  ---

  ### **Conclusion & Recommendation**  
  - **For (a) Policy Coherence:** Generational policies (like separate onboarding) fail your spec. They flunk non-negotiables: gradation (3), within-cohort spread (5), and explanatory power (6). Age/period effects + individual diversity explain far more.  
  - **For (b) Reality Check:** Cohort talk *sometimes* tracks shared formative experiences (e.g., "90s kids remember dial-up"), but it’s often a polite veneer for "young people" or economic factors. The *best* case (shared history view) still struggles with arbitrary boundaries and diversity.  
  - **Action:** Bin the consultancy’s proposal. Instead:  
    1. Audit your onboarding for *actual* pain points (e.g., tech gaps, financial anxiety) – these cut across ages.  
    2. Use **life stage** (e.g., "early career") or **environmental exposure** (e.g., "AI familiarity"), not birth years.  
    3. If keeping "generations," demand the consultancy prove their claims against this spec – they’ll fold.  

  Generational discourse is sticky because it’s intuitive, but as you see daily with your dad and stepson, it flattens complexity. Your instincts are right: this is a vibe dressed as strategy.
