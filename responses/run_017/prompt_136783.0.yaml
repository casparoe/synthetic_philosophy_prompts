  This is like a coordination game with two pure Nash equilibria: (A,A) and (B,B). But we want a unique Nash in the underlying game? It's not unique.

  We want a unique Nash that is worse than both.

  Let me add a third action:

  Player 1: A, B, D
  Player 2: A, B, D

  Payoffs:

          A      B      D
     A  (10,2) (0,0)  (0,6)
     B  (0,0)  (5,5)  (0,0)
     D  (6,0)  (0,0)  (1,1)

  Now, let's find the Nash equilibria.
  - (D,D) is a Nash equilibrium: because if Player 2 plays D, Player 1 gets 6 from A, 0 from B, and 1 from D -> best is D. If Player 1 plays D, Player 2 gets 6 from A, 0 from B, and 1 from D -> best is D.
  - (A,A): if Player 2 plays A, Player 1 gets 10 from A, 0 from B, 6 from D -> best is A. If Player 1 plays A, Player 2 gets 2 from A, 0 from B, 6 from D -> best is D, not A. So (A,A) is not Nash.
  - (B,B): if Player 2 plays B, Player 1 gets 0 from A, 5 from B, 0 from D -> best is B. If Player 1 plays B, Player 2 gets 0 from A, 5 from B, 0 from D -> best is B. So (B,B) is a Nash equilibrium.

  So we have two Nash equilibria: (B,B) with (5,5) and (D,D) with (1,1). But we want a unique Nash that is bad. 

  We can make (D,D) the only Nash by making sure that (B,B) is not Nash? How about if when Player 1 plays B, Player 2 has an incentive to play something else.

  Change the payoff for (B,B) to (5,4) and add a better option for Player 2 when Player 1 plays B?

          A      B      D
     A  (10,2) (0,0)  (0,6)
     B  (0,0)  (5,4)  (0,5)   # if Player 1 plays B, and Player 2 plays D, Player 2 gets 5
     D  (6,0)  (0,5)  (1,1)

  Now, if Player 1 plays B, Player 2 gets 4 from B and 5 from D -> so Player 2 will choose D. Then Player 1, if they play B, they get 0. 
  If Player 1 plays A, and Player 2 plays D, Player 1 gets 0.
  If Player 1 plays D, they get 1.
  Also, if Player 2 plays D, Player 1's best response is D (1) because A gives 0 and B gives 0.
  If Player 2 plays A, Player 1's best response is A (10) or D (6) -> they would choose A or D? We can make it so that they choose A by increasing the payoff for A when Player 2 plays A.

  Currently, if Player 2 plays A, Player 1 gets 10 from A, 0 from B, 6 from D -> they choose A.
  Then if Player 1 plays A, Player 2 gets 2 from A, 0 from B, 6 from D -> they choose D.
  So (A,A) is not Nash.

  If Player 2 plays B, Player 1 gets 0 from A, 0 from B, 0 from D? Wait, in the matrix above, when Player 1 plays B and Player 2 plays B, we have (5,4). When Player 1 plays B and Player 2 plays D, we have (0,5). 

  But then the only Nash equilibrium is (D,D): 
  - If Player 2 plays D, Player 1: A gives 0, B gives 0, D gives 1 -> choose D.
  - If Player 1 plays D, Player 2: A gives 0, B gives 5, D gives 1 -> choose B? Because 5>1. Oh, not Nash.

  We want when Player 1 plays D, Player 2 to want to play D. So change the payoff for (D,B) to (0,0) or to (0, something less than 1). 

          A      B      D
     A  (10,2) (0,0)  (0,6)
     B  (0,0)  (5,4)  (0,0)
     D  (6,0)  (0,0)  (1,1)

  Now, if Player 1 plays D, Player 2's payoffs: A:0, B:0, D:1 -> so they choose D.
  If Player 2 plays D, Player 1: A:0, B:0, D:1 -> choose D.
  So (D,D) is Nash.

  Are there others?
  - (A,A): if Player 1 plays A, Player 2: A:2, B:0, D:6 -> choose D, not A. So not.
  - (B,B): if Player 1 plays B, Player 2: A:0, B:4, D:0 -> choose B. If Player 2 plays B, Player 1: A:0, B:5, D:0 -> choose B. So (B,B) is Nash with (5,4).

  So we have two Nash equilibria: (B,B) with (5,4) and (D,D) with (1,1). We wanted (D,D) to be the unique Nash. 

  To make (B,B) not Nash, we can change the payoffs for Player 1 when Player 2 plays B: make Player 1 not want to play B.

          A      B      D
     A  (10,2) (0,0)  (0,6)
     B  (0,0)  (4,4)  (0,0)   # reduce Player 1's payoff at (B,B) to 4
     D  (6,0)  (0,0)  (1,1)

  But then (B,B) is still Nash because if Player 2 plays B, Player 1 gets 4 from B and 0 from others -> plays B. If Player 1 plays B, Player 2 gets 4 from B and 0 from others -> plays B.

  We can remove the (B,B) cell as an equilibrium by making Player 1 prefer to play something else when Player 2 plays B. For example, if when Player 2 plays B, Player 1 gets more from A or D.

          A      B      D
     A  (10,2) (5,0)  (0,6)   # if Player 2 plays B, Player 1 might get 5 from A?
     B  (0,0)  (4,4)  (0,0)   
     D  (6,0)  (5,0)  (1,1)   # and 5 from D as well? 

  This is getting too complicated.

  Perhaps we should abandon this and return to the first example with the asymmetric prisoner's dilemma and just explain that the program equilibrium can be lopsided and that the short program constraint doesn't change the outcome in that case.

  For the problem set, the first example is sufficient.

   So, to summarize, we will use the game:

  Player 2 actions: C, D
  Player 1 actions: C, D

  Payoff matrix:

          C     D
     C  (9, 1.1) (0,5)
     D  (6,0)   (1,1)

  Unique Nash equilibrium: (D,D) -> (1,1)

  Program equilibrium:
  - Player 1's program: It does a proof-based search: if it can prove that P2 outputs C, then it outputs C; else, it outputs D.
  - Player 2's program: It outputs C. (This program is short, 1 line in pseudocode)

  Outcome: (C,C) -> (9,1.1)

  And this is an equilibrium.

  Now, for the additional wrinkle: if Player 2 had a long program, could they do better? As we argued, no. The best they can do is 1.1 by cooperating, or 1 by defecting. So they are happy with the short program.

  But to make the short program constraint bite, we would need a different game or a different approach.

  Perhaps if the program equilibrium required Player 2 to perform a complex verification that they can only do if their program is long, then with a short program they couldn't do it and would be forced into a worse outcome. But in our example, Player 2's program is trivial.

  So for the problem set, we can use the above game and then ask the students to consider whether Player 2, if they had a long program, could get more than 1.1, and then show that they cannot.

   We can also ask: what is the range of sustainable payoffs in program equilibrium? 
   In general, any payoff vector that is individually rational (at least the minmax level, which in this case is the Nash equilibrium payoff, 1 for each) and feasible might be sustainable by a suitable program. But it's more complex because of the computational limits.

  In our example, the Nash equilibrium payoff is (1,1) and we achieved (9,1.1), so Player 2's payoff is only slightly above their minmax level.

   If the students are advanced, we can ask them to design a program equilibrium that gives payoffs (x,y) where x is very high and y is only a little above 1.

   And for the short program constraint, we can ask: does it matter if Player 2's program is short? In this example, it doesn't, because Player 2 cannot get more than 1.1 even with a long program.

   So perhaps we state that in this setup, the short program constraint does not bind because Player 2 has no strategic need for a long program.

   To make the constraint binding, we would need a setting where a long program could achieve a better outcome for Player 2. 

   One idea: suppose that Player 1's program is not able to simulate very long programs (because of a bounded simulation depth in the interpreter) then a long program might avoid being simulated and then could defect without being detected. But that is beyond the scope.

   Given the time, I think the first example is still good for the problem set.

   So here is the problem set outline:

   Consider the following game G:

        Player 2
          C     D
     C  (9,1.1) (0,5)
     D  (6,0)   (1,1)

   1. Verify that (D, D) is the unique Nash equilibrium of G.

   2. Consider the following programs for the program equilibrium:

      Program for Player 1 (P1):
        - Try for a limited time (or within a fixed proof system) to prove that P2, when given P1 as input, outputs C.
        - If such a proof is found, output C; else, output D.

      Program for Player 2 (P2): 
        - Output C.

      Assuming that the proof system is strong enough to prove that P2 outputs C (which is obvious because P2 is very simple), what will the outcome be? And what are the payoffs?

   3. Is this a program equilibrium? That is, is it a Nash equilibrium of the meta-game where each player chooses a program? (Check whether either player can change their program and get a higher payoff.)

   4. What would happen if Player 2 changes to a program that outputs D? What would the outcome be? What if Player 2 changes to a program that conditionally outputs C only if it can prove that P1 outputs C?

   5. In light of your answer to (4), why doesn't Player 2 choose one of these other programs?

   6. Now, suppose that Player 2 is allowed to write a arbitrarily long program. Could they get a payoff higher than 1.1 in equilibrium with Player 1's program fixed as above? Why or why not?

   7. Bonus: in general, for two-player games with a unique Nash equilibrium, what is the set of payoffs that can be achieved in program equilibrium? (You may assume that the proof system is sufficiently strong and that programs can simulate each other without resource constraints.) 

   Answer for the bonus: any payoff vector (u1, u2) that is feasible and individually rational, meaning ui >= vi, where vi is the payoff of player i in the unique Nash equilibrium of the underlying game. In this case, v1=1, v2=1. And (9,1.1) is above (1,1). But is every individually rational and feasible payoff achievable? This is like the folk theorem. However, note that program equilibrium might not achieve every such payoff because of the deterministic and immediate nature. But with sufficiently complex programs, it might be possible to achieve any such payoff by using a program that forces the other player to play a particular action by threat of minmax. However, in this setting, the minmax might be the Nash equilibrium. So informally, the set should be at least the payoffs that are above the Nash equilibrium payoffs.

   But note: in our example, the only outcomes are (9,1.1), (0,5), (6,0), (1,1). We cannot achieve (6,0) or (0,5) in equilibrium because one player will deviate. For example, to achieve (6,0): Player 1 would have to play D and Player 2 play C. But Player 2, if they are rational, will not output C if they know Player 1 will output D, because they get 0. They would rather output D and get 1. So only (C,C) and (D,D) are equilibria outcomes in the program equilibrium in this game.

   So the set of achievable program equilibrium payoffs is a subset of the individually rational and feasible payoffs, and it might not be convex or the entire set.

   Given time, we might not want to open that can of worms.

   I think the problem set with the above questions will generate debate.

   And for the detection of simulation: if a program can detect whether it is being simulated, then it might behave differently in simulation than in real play. This could break the equilibrium. For example, Player 2's program might output C when simulated but D in real play. Then Player 1's program would be tricked. This is the "treacherous" program issue. In the problem set, we can ask the students what would happen if Player 2's program could detect simulation and then output C only in simulation and D in real play. Then Player 1's program would see C in simulation and output C, and then Player 2's program would output D in real play, so the outcome would be (C,D) and Player 2 would get 5. But then Player 1 would want to change their program to avoid this. So it might break the equilibrium.

   This could be an extra credit question.

   So, in summary, the example with the asymmetric Prisoner's Dilemma is our bet.
answer: |-
  Below is a complete problem set designed to meet your requirements. It includes a concrete example of a lopsided program equilibrium, explores the impact of program length constraints, and addresses simulation detection issues.

  ---

  **Problem Set: Lopsided Program Equilibrium**

  **Background**: In program equilibrium, each player submits a program that takes the other's program as input and outputs an action. A program equilibrium is a Nash equilibrium of this meta-game. Programs can access their own source code (quining) to reason about mutual behavior. For simplicity, all programs are deterministic, and we assume a fixed formal system for proofs (if needed).

  ---

  **Part 1: The Game**  
  Consider the following asymmetric game between Player 1 (row) and Player 2 (column):

  |          | **Cooperate (C)** | **Defect (D)** |
  |----------|-------------------|----------------|
  | **Cooperate (C)** | (9, 1.1)         | (0, 5)        |
  | **Defect (D)**   | (6, 0)           | (1, 1)        |

  **1.1** Verify that (D, D) is the unique Nash equilibrium of the underlying game. Calculate each player's payoff at this equilibrium.

  **1.2** Calculate the cooperative surplus (difference from Nash payoffs) for each player if (C, C) is achieved. Why might Player 2 accept a disproportionately small share of this surplus?

  ---

  **Part 2: Program Equilibrium**  
  Suppose both players submit the following programs:  
  - **Player 1's program (P1, long)**:
    ```python
    if Provable("P2(P1) outputs C"):  // If P1 can prove that P2 outputs C when given P1
        output C
    else:
        output D
    ```
  - **Player 2's program (P2, short)**:
    ```python
    output C  // Unconditionally cooperate
    ```

  **2.1** Assuming the proof system is sufficiently strong:  
  (a) Determine the output of `P1(P2)` and `P2(P1)`.  
  (b) Compute the resulting payoffs. Is (C, C) achieved?

  **2.2** Explain why this is a program equilibrium:  
  (a) If Player 2 changes to `output D`, what happens? Show the payoffs.  
  (b) If Player 2 changes to a program that requires proof of P1's cooperation (e.g., `if Provable("P1(P2) outputs C"): output C else: output D`), can it achieve higher payoffs? Why/why not?

  **2.3** Why does Player 2 "accept" (C, C) despite receiving only a small surplus (1.1 vs. Nash 1)? What prevents Player 2 from demanding more?

  ---

  **Part 3: Impact of Program Length Constraints**  
  Now, suppose Player 2 is **memory-constrained**: their program must be ≤4 lines of pseudocode (excluding comments). Player 1 faces no constraints.

  **3.1** Can Player 2 write a program to force a better outcome than (9, 1.1)? For example:  
  ```python
  if Provable("P1(P2) outputs C"): 
      output D  // Defect to get 5 if P1 cooperates
  else:
      output C
  ```
  **Assume**: The proof system cannot resolve self-referential proofs in this short program (e.g., it times out or returns "unprovable" when recursion depth is exceeded).  

  (a) What does `P1(P2)` output for this new P2?  
  (b) What are the resulting payoffs?  
  (c) Why does this fail for Player 2?  

  **3.2** Suppose Player 2 tries to exploit P1 by *detecting simulation*:  
  ```python
  if IsBeingSimulated():  // Hypothetical simulation-detection
      output C  // Fake cooperation during simulation
  else:
      output D  // Defect in real play
  ```
  (a) Could this trick P1 into outputting C while P2 outputs D?  
  (b) Why might this violate the problem assumptions? (Hint: How is the game interpreter defined?)  

  **3.3** In general, does Player 1's ability to write long programs confer an advantage? Why or why not? Under what conditions might length matter? (Consider: bounded proof depth, simulation limits, or complexity-based traps.)

  ---

  **Part 4: Generalizing Program Equilibrium**  
  **4.1** In the game above, is (9, 1.1) the *only* program equilibrium payoff? Can other splits be achieved? For example:  
  - Payoffs (5, 5) or (0, 5)?  
  - If not, why? If yes, sketch the programs.

  **4.2** **Folk Theorem for Program Equilibrium**: For any two-player game with a unique Nash equilibrium payoffs \((v_1, v_2)\), a payoff profile \((u_1, u_2)\) is achievable in program equilibrium if:  
  - It is **feasible** (achievable under some action profile).  
  - It is **individually rational** (\(u_i \geq v_i\) for both players).  

  (a) Does the lopsided outcome (9, 1.1) satisfy these?  
  (b) Give an example of a feasible, individually rational payoff that *cannot* be achieved here. Explain why. (Hint: Punishment strategies.)

  **4.3** How does this change if programs can use randomness? (No need to compute—describe conceptually.)

  ---

  **Sample Solutions**  
  *Provided for TA use—distribute to students after submission.*

  **1.1**  
  - (D, D) is the unique Nash equilibrium. If Player 2 plays D, Player 1 gets 1 for D > 0 for C. If Player 1 plays D, Player 2 gets 1 for D > 0 for C. Payoffs: (1, 1).

  **1.2**  
  - Cooperative surplus: Total surplus at (C, C) = (9 + 1.1) - (1 + 1) = 8.1.  
  - Player 1 surplus: 9 - 1 = 8.  
  - Player 2 surplus: 1.1 - 1 = 0.1.  
  Player 2 accepts this because 1.1 > 1 (Nash payoff), and defection yields ≤1.

  **2.1**  
  - (a) P1 proves P2 outputs C (trivial), so P1 outputs C. P2 outputs C.  
  - (b) Payoffs: (9, 1.1). (C, C) is achieved.

  **2.2**  
  - (a) If P2 outputs D: P1 proves P2 outputs D → P1 outputs D → (D, D) → (1, 1). Player 2 gets 1 < 1.1.  
  - (b) If P2 uses `if Provable("P1(P2) outputs C"): output C else: output D`:  
    Mutual proof dependency may cause infinite recursion. If the proof system times out, P1 and P2 default to D → (1, 1). Player 2 cannot improve.

  **2.3**  
  Player 2’s best alternative to accepting 1.1 is 1 (Nash). Since 1.1 > 1, they cooperate. Player 1’s threat to defect if P2 doesn’t cooperate is credible, forcing Player 2 into a weak position.

  **3.1**  
  - (a) P1 cannot prove "P2(P1) outputs C" (due to self-reference and P2’s length constraint making proofs unresolvable). Thus, P1 outputs D.  
  - (b) P2 outputs D → (D, D) → (1, 1).  
  - (c) Player 2’s program is too short to resolve the proof, so P1 defects. Player 2 gets 1 (< 1.1).

  **3.2**  
  - (a) If `IsBeingSimulated` works, P1 might simulate P2 and see C, then output C. In real play, P2 outputs D → (C, D) → (0, 5).  
  - (b) This violates the problem setup: Programs are executed by a trusted interpreter, and simulation is indistinguishable from real play. `IsBeingSimulated` is typically undefined.

  **3.3**  
  - Length only matters under computational constraints (e.g., bounded proof depth). Here, P1’s long program can handle proofs, but P2’s short program cannot. Without constraints, P2 could write a program that resolves proofs and achieve the same 1.1.

  **4.1**  
  - (5, 5) not feasible (no such outcome). (0, 5) requires (C, D), but Player 2 can’t force P1 to output C while defecting. Only (C, C) and (D, D) are achievable in equilibrium.

  **4.2**  
  - (a) (9, 1.1) is feasible and individually rational (9 ≥ 1, 1.1 ≥ 1).  
  - (b) (6, 0) [from (D, C)] is feasible and individually rational (6 ≥ 1, 0 ≥ 1? No! 0 < 1). Thus, not achievable.

  **4.3**  
  Randomness allows convex combinations of payoffs (e.g., via mixed actions), expanding the equilibrium set.

  ---

  **Key Pedagogical Points**:
  - **Lopsidedness**: Program equilibrium enables cooperation but doesn’t guarantee fairness. Player 1 captures most surplus by threatening defection if not "obeyed."
  - **Length Constraints**: Matter only when short programs cannot perform necessary computations (e.g., deep proof recursion). Here, Player 2’s constraint prevents them from using complex strategies, reinforcing the status quo.
  - **Simulation Detection**: Breaks the model’s assumptions. In standard setups, programs cannot distinguish simulation from real execution.
  - **Sustainable Splits**: Any individually rational/feasible payoff is achievable *in theory*, but deterministic programs and proof limitations restrict outcomes in practice.
