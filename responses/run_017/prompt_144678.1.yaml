prompt: |-
  hey — i'm the student rep on our SU's "big spend" committee, and since i'm taking a social choice theory seminar this term everyone keeps turning to me on the voting question. We have to pick one of five bids for a one-off pot: a bike repair co-op, a peer mental-health listening line, free period products in all bathrooms, a late-night bus subsidy, and replacing the blown PA in the union bar. 11 of us vote. Two rules are on the table: everyone submits a full ranking and we run instant-runoff, or everyone gives each bid 0–5 points and we take the biggest total. Our treasurer has a third idea: the bids basically differ along one axis (how much cash leaves the account up front), so everyone names their favourite point on that axis and we take the median — she says that one can't be gamed.

  I have to circulate a one-page decision memo before Thursday recommending one of the three, and I want it to actually hold up. I've tried explaining Gibbard–Satterthwaite to the committee — with three or more options, any rule that always produces a winner and isn't just one person's call can be manipulated on some preference profile — and there reply is basically "so what, our profiles aren't adversarial and nobody here is a strategist."

  Can you draft the memo? It needs a clear recommendation up top, reasons the committee could push back on, and an honest treatment of the strongest thing on the losing side (I think it's either that strategy-proofness is the wrong target when eleven people argue it out in a room before voting anyway, or that it costs us any way to register how strongly people feel). Also say something real about whether the median idea actually escapes the theorem or just relocates it — what if someone's ideal point isn't on that cost axis at all, or we're only assuming single-peakedness because it's convenient. No citations or reading list needed, just the argument.
reasoning: |-
  Okay, the user is a student rep on the SU's "big spend" committee who needs to draft a memo recommending a voting method for allocating funds among five bids. They've studied social choice theory and mentioned Gibbard-Satterthwaite to the committee, but the members dismissed strategic voting concerns since they're non-adversarial. The options are: instant-runoff (ranked voting), score voting (0-5 points), or the treasurer's median cost-axis idea. 

  Hmm... the user's hidden needs are tricky. They need to sound authoritative without alienating the committee, and their credibility is on the line since they're the "theory person." The memo must preempt pushbacks like "we're all friends here" or "but what about passion for projects?" while honestly engaging with the median idea's flaws. 

  First, the recommendation: Score voting is best here. It's simple, allows intensity of preference (which matters for emotional bids like mental health), and while manipulable, casual voters won't bother strategizing. The median idea is tempting but fragile—it assumes everyone cares only about cost, which isn't true (e.g., someone might prioritize period products regardless of price). Instant-runoff is worse because it ignores preference strength and can eliminate moderately popular options early. 

  For the treasurer's median point: Technically, it escapes Gibbard-Satterthwaite *if* preferences are truly single-peaked on cost. But that's a big if! If even one person thinks "screw cost, I want the PA system," the median could be meaningless. And in practice, forcing multidimensional opinions (e.g., "bus subsidy is worth any price") onto one axis feels dishonest. 

  Pushbacks to address: 
  - "No strategists here?" → True, but score voting is robust anyway. 
  - "What about passion?" → Score voting captures that via 5/5 ratings; rankings don't. 
  - "Median is strategy-proof!" → Only in theory, and only if preferences align perfectly—unlikely for diverse bids. 

  Honest downside: Score voting could let a "meh" project win if everyone gives it 3s while passionate projects split 5s and 1s. But with only 11 voters discussing first, consensus might soften extremes. 

  Final memo tone: Pragmatic, no jargon, emphasizes ease and expressiveness. Nod to the median's elegance but call it unrealistic. Stress that all systems have flaws, but score voting fits their context best.
answer: |-
  **MEMORANDUM**  
  **TO:** Big Spend Committee  
  **FROM:** [Your Name], Student Rep  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Voting Method for Bid Selection  

  ---

  ### **RECOMMENDATION**  
  **Use Score Voting (0–5 points)** for selecting the winning bid. It best balances expressiveness, simplicity, and resistance to accidental manipulation in our small, non-adversarial group. The median method is theoretically elegant but risky for our context. Instant-runoff is less suitable.  

  ---

  ### **WHY SCORE VOTING?**  
  1. **Captures Strength of Preference**  
     - Unlike rankings (which only show order), scores let voters show *how much* they support each bid (e.g., rate mental health line 5, PA system 1). This matters: a "medium-passionate" majority could outweigh a fiercely divided minority.  
     - *Committee pushback rebuttal:* "But we argue it out in person!" → Discussion helps, but final votes need nuance. Scores preserve intensity better than rankings.  

  2. **Less Vulnerability to Accidental Misrepresentation**  
     - Instant-runoff (IRV) can distort preferences if voters "simplify" rankings strategically (e.g., ranking a safe bid #1 to avoid "wasting" their vote). Even well-meaning voters do this instinctively.  
     - Scores avoid this: voters assign points freely without fearing vote-splitting.  

  3. **Practical and Familiar**  
     - Easier to complete (assign points) than ranking 5 complex bids. Faster to tally than IRV.  

  ---

  ### **HONEST ENGAGEMENT WITH PUSHBACKS**  
  **Pushback: "No one here games systems; we’re not adversarial."**  
  - **Agreed:** Deliberate strategy is unlikely. But even sincere voters misrepresent preferences under IRV to avoid feeling irrelevant (e.g., dropping a long-shot favorite to #2). Score voting avoids this pressure.  
  - **Risk with Scores:** Someone *could* exaggerate (rate everything else 0 to boost their favorite), but with 11 engaged voters, outliers have limited impact.  

  **Pushback: "Doesn’t the median method avoid strategy?"**  
  - **Theoretically, yes—but only in a narrow world:**  
    - The median *is* strategy-proof **if** preferences are *single-peaked* (all voters agree bids vary *only* on cost, and their approval falls as cost moves away from their ideal).  
    - **Reality check:** Are our bids *only* about cost? **No.**  
      - Would a feminist voter *really* prefer "medium-cost period products" over "low-cost bus subsidy" if period products are their priority? Unlikely.  
      - The PA system isn’t on a "spend spectrum" at all—it’s infrastructure.  
    - **Forcing single-peakedness risks distortion:** Voters whose true ideal isn’t on the cost axis (e.g., "mental health is essential at any price") must misrepresent their view to participate. This violates the spirit of fair choice.  

  **Pushback: "IRV ensures majority support."**  
  - True, but it ignores *strength* of support. A bid universally rated "3" under scores could lose in IRV to a bid with a few #1 rankings and many #5s. Our bids vary widely—passion matters.  

  ---

  ### **WHY NOT THE OTHER OPTIONS?**  
  **Median on Cost Axis**  
  - **Strengths:** Strategy-proof in theory, simple tally.  
  - **Fatal flaws:** Assumes all voters prioritize cost above all else. If preferences aren’t truly single-peaked (likely here), the median is arbitrary—or worse, meaningless. Ignores project value beyond price.  

  **Instant-Runoff (Ranked Voting)**  
  - **Strengths:** Ensures majority support, familiar in elections.  
  - **Weaknesses:**  
    - Hides intensity (ranking mental health #1 and bikes #2 doesn’t show if you love both or tolerate both).  
    - With 5 bids, IRV can eliminate broadly liked "compromise" bids early.  
    - Subtle strategy (e.g., "burying" strong competitors) is possible even if unintended.  

  ---

  ### **BOTTOM LINE**  
  All voting systems have flaws (Gibbard-Satterthwaite reminds us perfection is impossible). But for **our specific context**—11 cooperative voters, diverse bids where passion and cost both matter—**Score Voting (0–5 points)** is the most robust. It:  
  - Lets voters express nuanced opinions,  
  - Minimizes accidental distortion,  
  - And reflects real-world stakes better than rankings or a forced cost axis.  

  The median method’s strategy-proofness is seductive but relies on assumptions that don’t fit our bids. IRV sacrifices too much expressiveness. Go with scores.  

  **Motion:** Adopt Score Voting (0–5 points) for the Big Spend vote.
