  - Abstract discussions about "artworld" theories (à la Danto) are less urgent than concrete persistence. 
  - The statue/clay debate's focus on co-location doesn't apply here—clay and bronze never coexist as the same shape. 

  Ranking: 
  1. Persistence through recasting (drives insurance/loans) 
  2. File's role (shapes recasting permissions) 
  3. Clay's status (minor for policy, but donor-mandated) 
  4. Category debates (less urgent) 

  The symposium should showcase how metaphysics informs policy, not just present theories. Adviser should prototype policy clauses to make it concrete. 

  ...Also, the user mentioned "upstream" dependencies—good, I’ll structure the memo around that logic. And bluntly dismiss tempting but irrelevant angles, like overemphasizing the clay.
answer: |-
  **To:** Board of Directors  
  **From:** Philosophical Strategy Committee  
  **Re:** Prioritized Agenda for Second Lump Philosophical Adviser  
  **Date:** 15 October 2023  

  ### Executive Summary  
  The *Second Lump* donation forces us to resolve three core questions about the artwork’s identity, ranked below by policy dependency, tractability, and urgency. The adviser should prioritize **persistence through material replacement** (Rank 1), as it dictates insurance, loans, and recasting legality. The digital file’s status (Rank 2) and original clay’s role (Rank 3) are secondary but necessary for donor compliance. Traditional metaphysics debates (e.g., statue/clay co-location) are largely irrelevant here and deprioritized. The symposium must translate conclusions into draft policy language.  

  ---

  ### Rank 1: Does *Second Lump* Persist Through Total Material Replacement?  
  **Why upstream?**  
  This directly determines:  
  - **Insurance valuation**: Is the artwork a perishable physical object (value tied to current bronze) or an enduring entity (value tied to the preserved form)?  
  - **Loan agreements**: Can we loan the *current* bronze, or is the borrower temporarily stewarding the enduring work?  
  - **Recasting legality**: Does melting the bronze destroy the artwork (violating donor terms) or maintain it?  

  **Tractability & Openness**  
  - **Tractable**: Philosophers have frameworks for persistence (e.g., "formal causation" in Aristotle, contemporary four-dimensionalism). *Second Lump*’s forced cyclical destruction is novel but can leverage ship-of-Theseus debates.  
  - **Settled? No**: Metaphysics lacks consensus on artefact persistence through *total* matter replacement. The adviser can test existing theories against our recasting mandate.  
  - **Progress in 12 months**: Draft a "persistence criteria" rubric (e.g., continuity of causal history, artist-sanctioned form) and stress-test it against edge cases (e.g., if recasting uses 50% original bronze).  

  **Dependency**: Until resolved, policies for loans/insurance are speculative.  

  **Gap in Statue/Clay Debate**: Unlike the static lump/statue, *Second Lump* mandates periodic rebirth. Prioritize this over abstract co-location puzzles.  

  ---

  ### Rank 2: What Constitutive Role Does the Digital File Play?  
  **Why upstream?**  
  This affects:  
  - **Donor restrictions**: If the file is merely a tool, "updates for structural repairs" are technical. If it’s *constitutive*, edits risk altering the work’s identity.  
  - **Access/Custody**: Must the file be archived like a physical artwork? Does corruption equal destruction?  

  **Tractability & Openness**  
  - **Tractable**: Philosophers of technology (e.g., digital ontology) offer frameworks. Focus on whether the file is a *recipe* (non-constitutive) or an *essential component* (like a musical score).  
  - **Settled? No**: Digital artefacts’ ontology is actively debated. *Second Lump*’s "perceptually identical" clause adds complexity.  
  - **Progress**: Define thresholds for "subtle updates" (e.g., does repairing internal supports change "visible shape"?).  

  **Dependency**: Resolving persistence (Rank 1) clarifies the file’s role (e.g., if the work persists via form, the file is authoritative).  

  **Overrated Temptation**: Treating the file as the "true artwork" ignores donor terms requiring physical instantiation.  

  ---

  ### Rank 3: What is the Original Clay’s Status?  
  **Why upstream?**  
  Relevant for:  
  - **Storage/Deaccession**: Is the clay a relic, a backup, or part of the artwork?  
  - **Donor compliance**: "Never displayed" implies it has symbolic value—but why?  

  **Tractability & Openness**  
  - **Tractable**: Distinguish historical provenance (clay as origin) from metaphysical necessity (clay as core). Artist intent (via documentation) may resolve this quickly.  
  - **Settled? Largely**: The clay is likely analogous to a mold (discarded after casting) or a relic (venerated but non-constitutive). Philosophers agree artefacts don’t require original matter.  
  - **Progress**: If Rank 1 confirms persistence via form, the clay is irrelevant to identity.  

  **Dependency**: Low—policies about storage can proceed once Ranks 1–2 confirm the clay’s non-constitutive role.  

  **Mistaken Implication**: The statue/clay debate tempts us to see clay as "essential matter." But here, the clay *never constituted the artwork*; it was a prototype.  

  ---

  ### Explicitly Set Aside  
  1. **Classic Statue/Clay Co-Location**: Irrelevant because *Second Lump*’s clay and bronze never occupy the same space/time as one artwork.  
  2. **"Artworld" Ontology (e.g., Danto)**: While context matters, donor terms bind us to physical/metaphysical facts.  
  3. **Universal Answers**: The adviser should *not* seek "what is art?" but "what is *this* work under *these* constraints?"  

  ---

  ### Symposium Output  
  The adviser’s year should culminate in a symposium translating priorities into policy prototypes:  
  - **Sample Insurance Clause**: "Insured value reflects cost of recasting + enduring artistic identity."  
  - **Loan Agreement Template**: Specifies whether the work or the bronze is loaned.  
  - **Digital File Protocol**: Criteria for "permissible updates."  

  ### Why This Ranking?  
  | **Criterion**       | **Rank 1**       | **Rank 2**       | **Rank 3**       |  
  |---------------------|------------------|------------------|------------------|  
  | **Policy Urgency**  | High (core ops)  | Medium (compliance) | Low (storage only) |  
  | **Tractability**    | Moderate (novel but scaffolded) | High (clear parallels) | High (resolvable via intent) |  
  | **Dependency**      | Foundational     | Requires Rank 1  | Requires Ranks 1–2 |  
  | **Neglectedness**   | High (forced replacement is underexplored) | Medium | Low |  

  **Trade-off**: Depth over breadth. The adviser should *not* survey all metaphysics but drill into Ranks 1–2 to deliver actionable guidance.  

  ---  
  **Recommended Adviser Profile**: A philosopher of art or technology with applied ethics/metaphysics experience, skilled in translating abstractions into institutional guidelines. Focus their time on policy prototyping, not theory.  

  **Board Action Required**: Approve this agenda to align the adviser’s mandate with our fiduciary and curatorial duties.
