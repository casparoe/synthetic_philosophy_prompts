  The user is an accountant/logistics professional without formal philosophy training, so the memo must avoid academic jargon and focus on practical priorities. They explicitly don't want literature surveys—just a ranked, actionable agenda. The constraints are clear: a part-time adviser (one day/week for 12 months) and one symposium. 

  Hmm... the core tension here is between metaphysics (what is the artwork?) and institutional practice (how do we insure/loan/manage it?). The adviser's role is to bridge these. The statue-and-clay debate is a starting point, but Second Lump adds layers: the digital file, periodic destruction/recasting, and the hidden original clay. This isn't just about "is the statue identical to the clay?"—it's about persistence through replacement, the role of digital information, and institutional obligations. 

  Key questions that emerge: 
  - Is the artwork defined by its matter (bronze) or form (shape)? 
  - How does recasting every 25 years affect its identity? 
  - What's the status of the original clay? 
  - How does the digital file function—as a blueprint, or part of the work? 

  But not all are equally urgent. The policy decisions depend most critically on whether the artwork is seen as enduring (surviving recasting) or as a series of distinct objects. For example: 
  - Insurance valuation hinges on whether loss/damage applies to the current bronze or the "persistent" artwork. 
  - Loans would differ if the work is the shape (which could be recast elsewhere) vs. the specific bronze. 
  - Donor restrictions (e.g., melting/recasting) might conflict with preservation ethics if the bronze is considered the work. 

  The top priority must be the persistence question because it's foundational; other issues (clay's role, file's status) depend on it. It's also tractable—philosophers have frameworks for persistence through change, though Second Lump's forced destruction adds novelty. The adviser can draw on debates about Ship of Theseus or restoration ethics. 

  Next, the file's status: since it dictates the shape across recastings, is it constitutive? This affects how the foundation handles file updates (structural repairs vs. artistic integrity) and could intersect with digital art metaphysics. 

  The clay is lower priority—it's functionally a relic, hidden and inactive. Its main relevance is symbolic or historical, not constitutive, unless the artist's intent ties it to the work's identity. 

  I should flag red herrings: 
