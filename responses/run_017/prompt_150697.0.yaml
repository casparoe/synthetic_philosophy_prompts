        If you chose Option B, go to Case 3.

        If you chose Option A, go to Case 1.

        Case 1: The Bank Case (Third-Person)

          Sarah is in a high-stakes situation: she must deposit her check by Saturday or face disaster. She has the same evidence as Hannah (she was at the bank last Saturday and saw it open). Now, imagine you are in a low-stakes situation (like Low-Stakes Hannah). You are considering Sarah.

          Question 1: Can you, in your low-stakes situation, truthfully say, "Sarah knows that the bank will be open tomorrow"?
            - Option A1: Yes, I can truthfully say that.
            - Option A2: No, I cannot truthfully say that.

        If you chose Option A2, then your view is: Subject-Sensitive Invariantism (or Pragmatic Encroachment). [The truth of "S knows p" depends on the subject's practical situation.]

        If you chose Option A1, go to Case 2.

        Case 2: Disagreement about Knowledge

          On Monday, Speaker A (in a low-stakes situation) says about Sarah (from Case 1, who is in high stakes): "Sarah knows the bank will be open tomorrow." 
          On Tuesday, Speaker B (in a high-stakes situation) says about the same Sarah: "Sarah does not know the bank will be open tomorrow."

          Question 2: Are Speaker A and Speaker B expressing the same proposition? (That is, are they making claims with the same meaning?)
            - Option A1a: No, they are not the same. Speaker A is claiming that Sarah meets low standards for knowledge, and Speaker B is claiming that Sarah does not meet high standards.
            - Option A1b: Yes, they are expressing the same proposition (that Sarah knows, according to a single standard that can be assessed differently).

        If you chose Option A1a, then your view is: Attributor Contextualism. [The truth of "S knows p" depends on the context (especially the stakes) of the person attributing knowledge.]

        If you chose Option A1b, then your view is: Assessment Relativism. [The truth of "S knows p" is relative to the context of the person assessing the claim.]

        Case 3: Invariantism

          Consider Low-Stakes Hannah: she has the evidence that the bank was open last Saturday, and she is in low stakes.

          Question 3: Does Hannah know that the bank will be open tomorrow?
            - Option B1: Yes.
            - Option B2: No.

        If you chose Option B1, then your view is: Classical Invariantism (Stakes do not affect knowledge, and in ordinary cases we often know.)

        If you chose Option B2, then your view is: Skeptical Invariantism (Stakes do not affect knowledge, but we rarely or never know.)

      Note: 
          - There is no view that answers: 
              Option A at Case 0 and then Option A2 at Case 1 and then ... (we don't have a further node for subject-sensitive invariantism) because we have already identified it.
          - The combination: Option A at Case 0 and Option A1 at Case 1 and then Option A1a at Case 2 -> attributor contextualism.
          - The combination: Option A at Case 0 and Option A1 at Case 1 and then Option A1b at Case 2 -> assessment relativism.
          - The combination: Option B at Case 0 and Option B1 at Case 3 -> classical invariantism.
          - The combination: Option B at Case 0 and Option B2 at Case 3 -> skeptical invariantism.

      We have not included phantom stakes or borrowed stakes because they do not clearly discriminate between the views in the tree.

      This should fit under 700 words.
answer: |-
  ### Epistemology Views Decision Tree  
  *Based on your intuitions about everyday cases. Answer each question before knowing view names.*  

  ---

  **Case 0: Low vs. High Stakes (First-Person)**  
  *Low-Stakes Hannah*: On Friday, Hannah needs to deposit a check. No urgency; she can do it Monday. She sees long lines at the bank but recalls it was open last Saturday. She says, “I know it’ll be open tomorrow.”  
  *High-Stakes Hannah*: Same evidence, but if she misses Saturday deposit, she’ll be evicted. She says, “I don’t know it’ll be open tomorrow.”  

  **Question 0**: Can both be correct?  
  - **Yes (A)** → Stakes *can* affect knowledge. Go to Case 1.  
  - **No (B)** → Stakes *never* affect knowledge. Go to Case 3.  

  ---  

  **Case 1: Third-Person Ascription (Divergent Stakes)**  
  *Sarah*: High-stakes subject (eviction if wrong). Same evidence as Hannah (saw bank open last Saturday).  
  *You*: Low-stakes ascriber (no urgency). You consider Sarah.  

  **Question 1**: Can you truthfully say, “Sarah knows the bank will be open tomorrow”?  
  - **Yes (A1)** → Go to Case 2.  
  - **No (A2)** → **Subject-Sensitive Invariantism (Pragmatic Encroachment)**  
    - *Key idea*: Knowledge depends on the *subject’s* practical situation.  

  ---  

  **Case 2: Disagreement Across Contexts**  
  *Speaker A* (Monday, low stakes): “Sarah knows the bank will be open tomorrow.”  
  *Speaker B* (Tuesday, high stakes): “Sarah does *not* know it will be open tomorrow.”  

  **Question 2**: Are A and B expressing the *same proposition* about Sarah’s knowledge?  
  - **No (A1a)** → **Attributor Contextualism**  
    - *Key idea*: “Knows” means different things in different contexts (A: low standards; B: high standards).  
  - **Yes (A1b)** → **Assessment Relativism**  
    - *Key idea*: The *same* knowledge claim can be true for A (low-stakes assessor) but false for B (high-stakes assessor).  

  ---  

  **Case 3: Invariantism Baseline**  
  *Low-Stakes Hannah* (as in Case 0): Evidence (saw bank open last Saturday), low stakes.  

  **Question 3**: Does Hannah know the bank will be open tomorrow?  
  - **Yes (B1)** → **Classical Invariantism**  
    - *Key idea*: Knowledge depends only on truth, belief, justification, and evidence—not practical stakes.  
  - **No (B2)** → **Skeptical Invariantism**  
    - *Key idea*: We rarely (or never) know everyday things, regardless of stakes.  

  ---

  ### Notes  
  - **Phantom Stakes** (subject *thinks* stakes are high, but they’re actually low):  
    - *E.g., Sarah falsely believes expired milk will kill her friend (it won’t). Does she know it’s fresh?*  
    - Fails to cleanly discriminate views. Dropped.  
  - **Borrowed Stakes** (subject has low personal stakes but acts for someone in high stakes):  
    - *E.g., Sarah deposits a check for her eviction-threatened friend. Does she know the bank is open?*  
    - Fails to cleanly discriminate (all views can explain it variably). Dropped.  
  - **Unoccupied Combinations**:  
    - *A + A2 + [Disagreement test]*: Not incoherent, but unclaimed (subject-sensitive views reject “both true” in Case 2).  
  - **Underdiscriminated Pair**:  
    - Classical vs. Skeptical Invariantism are split by Case 3. All other pairs are separated (e.g., contextualism vs. relativism by Case 2).  

  *(~550 words. Print double-sided with case details.)*
