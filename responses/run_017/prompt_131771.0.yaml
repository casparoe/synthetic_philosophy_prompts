  First, I need to outline Le Verrier's options when faced with the Mercury anomaly. The options were: dismiss it as observational error, adjust Newton's force law, or posit unobserved mass (Vulcan). For each theory, I should explain how they rank these options and what expectations Le Verrier could have had. 

  The user emphasizes two distinctions: production vs. reach and the nature of the residual for Humeans. For production vs. reach, the case might only inform reach (predictive power) without speaking to whether laws govern events. The Humean sees the residual as a lack of systematization, not a violation. So, how much slippage is acceptable? Also, the user suspects that extendability might be an unacknowledged virtue in the best-system account. 

  I need to address whether each theory gets credit for Neptune and blame for Vulcan. The differential vindication constraint is central here. The same method led to different outcomes, so how does each theory explain that? 

  For the Humean, the best system balances simplicity, strength, and fit. The residual in Mercury's orbit meant the Newtonian system had reduced fit. Adding Vulcan improved fit but added complexity. The trade-off here involves extendability—how well the system handles new domains. But extendability isn't a standard factor in the best-system account. Maybe it's part of strength, but the user's point is that it might be a hidden anti-Humean element. 

  For the anti-Humean, laws govern, so anomalies like Mercury's orbit indicate either new entities or a flaw in the laws. Le Verrier's inference to Vulcan was reasonable, but ultimately wrong because the governing laws were different (GR instead of Newton). The anti-Humean can say that the method was sound both times; the epistemic context was the same, but the underlying reality differed. 

  The user's suspicion about production vs. reach: this case tests reach (predictive success) but not production (governing). Humeans can handle reach via systematization, while production remains untouched. The differential vindication might challenge Humeans more because they need to explain why the same method failed without invoking governance. 

  On slippage: Humeans must decide when to tolerate residuals. Vulcan's case shows that extendability (predicting new domains) matters. If extendability is part of strength, then it's already included. But if it's separate, it might be an ad hoc addition. And if extendability is future-oriented, it might smuggle in anti-Humean elements. 

  Finally, evaluating each theory: Humeans might struggle with Vulcan because the best system at the time included Newton's laws, and adding Vulcan seemed reasonable. But post-Einstein, the best system changed. The anti-Humean can argue that the laws govern, so GR revealed the true laws. The differential vindication doesn't clearly favor either, but the anti-Humean has a smoother explanation: same method, but one inference was correct, the other wasn't, due to underlying laws. 

  Verdict: The case is an anomaly for Humeans due to extendability and trade-offs in best-system virtues. For anti-Humeans, it's confirmatory but highlights epistemic limitations. Neither handles it perfectly, but the episode is more challenging for Humeans.
answer: |-
  Here's a disciplined mapping of the Vulcan case against both Humean and anti-Humean views, incorporating your distinctions and constraints:

  ### **Le Verrier's Options & Epistemic Entitlement**
  *   **Observational/Computational Error:** Dismiss the residual as noise. Requires assuming current observational limits are insufficient or calculations flawed.
  *   **Tinker with Force Law:** Modify Newtonian gravity (e.g., add distance-dependent terms). Radical, undermines universality/core simplicity.
  *   **Add Unobserved Mass:** Posit Vulcan (planet/belt). Preserves core law, explains anomaly via known mechanisms (mass gravity).

  **Epistemic Entitlement Pre-Observation (Both Views):** Le Verrier was *strongly* entitled to expect Vulcan's existence. The Neptune success proved the method's reliability within the Newtonian framework. The residual was significant, persistent, and calculable. Positing Vulcan was the *most conservative* option, preserving the well-confirmed law and leveraging a successful explanatory strategy. Expecting confirmation was rational.

  ---

  ### **Humean Best-System Account (BSA) Mapping**
  1.  **The Residual:** Not a *violation* but a *lack of fit* between the Newtonian system (+ known masses) and the Mercury-perihelion data point. It reduces the system's *strength* (explanatory/predictive power) concerning Mercury.
  2.  **Ranking Options (1846-1915 Context):**
      *   *Dismiss Error:* Weakens system strength significantly (fails to systematize a known phenomenon). Unattractive unless error is demonstrable.
      *   *Modify Force Law:* Radically reduces *simplicity*. Newton's law is simple and fits almost everything else. High cost for marginal gain (one data point).
      *   *Add Vulcan:* **BSA Favored Choice.** It *maximizes overall virtue*. It preserves the core law's simplicity and dramatically increases strength (systematizes the residual) by adding only moderate complexity (one new entity/parameter). This mirrors the Neptune success, reinforcing its systemic virtue. *Extendability* (successfully predicting *new* phenomena/masses) is a powerful contributor to *strength* within BSA. Predicting Vulcan makes the system stronger if confirmed.
  3.  **Differential Vindication (Neptune vs. Vulcan):** *Problematic for BSA.* Both inferences were equally virtuous *at the time* for the best system *of that time*. Neptune *increased* systemic virtue (fit/strength via confirmation). Vulcan, however, *failed* to increase virtue – it never fit the mosaic. BSA struggles to explain *why* the *same* inferential move, equally virtuous systemically *ex ante*, yielded one *success* (virtue boost) and one *failure* (no boost, eventually a cost). BSA lacks a *discriminator* inherent in the inference itself beyond systemic virtues calculable pre-confirmation. The failure is purely contingent mosaic discovery.
  4.  **Slippage & Extendability:** You are correct. This case forces recognition that "strength" implicitly includes *extendability* – the system's ability to successfully predict/synthesize *new* domains (new observations, new systems). Tolerance for slippage (residuals) involves a trade-off: *How much potential future strength (extendability) is worth sacrificing current simplicity for?* Vulcan was a high-extendability bet. BSA traditionally focuses on systematizing the *actual* mosaic, but *predictive inferences to unseen parts* are crucial to scientific practice and BSA's appeal. Including extendability risks making BSA less descriptive (summarizing the actual) and more normative (guiding future inquiry), potentially smuggling in anti-Humean "reach" (see below). The resource (extendability-as-strength) *is* doing work similar to anti-Humean reach but framed within the systemic virtues.

  ---

  ### **Anti-Humean (Governing Laws) Mapping**
  1.  **The Residual:** A genuine *anomaly* – a phenomenon apparently *violating* the governing Newtonian law + known mass distribution. It suggests the law isn't governing Mercury correctly or there's an unknown governor (mass).
  2.  **Ranking Options (1846-1915 Context):**
      *   *Dismiss Error:* Requires ignoring a persistent phenomenon governed (or misgoverned) by the laws. Unjustified unless error proven.
      *   *Modify Force Law:* Acknowledges the law itself might not be the true governor. Justifiable if anomaly is severe and pervasive.
      *   *Add Vulcan:* **Governing View Favored Choice.** The Newtonian law *governs* all masses. The anomaly suggests an *unobserved governor* (mass) is present, exerting its lawful influence. This preserves the known governing law and its universality. Inference to unobserved governors is a core methodology licensed by the view that laws govern. Neptune confirmed this.
  3.  **Differential Vindication (Neptune vs. Vulcan):** *Less Problematic.* The governing view distinguishes the *epistemic warrant* from the *ontological success*. Le Verrier's inference was *epistemically justified* both times – the method (infer unobserved mass to preserve law-governance) was sound based on current knowledge. The difference lies in the *underlying reality*: Neptune *existed* and was governed by Newton's laws; Vulcan *did not exist*. The governing law (ultimately GR) *was* different near the Sun. The view explains the same method failing: one inference correctly identified a real governor, the other incorrectly posited a non-existent governor because the *true* governing law (GR) was unknown. The blame lies not with the *concept* of governance or the *method*, but with the *specific, incomplete law* (Newtonian gravity) assumed to be governing.
  4.  **Production vs. Reach:** This case primarily concerns *reach*. The governing view licenses strong expectations about unobserved regions (Vulcan's existence/location) based on the law's governance. *Production* (how the law makes Mercury move) is silent here. The anomaly challenged the *scope* of Newtonian governance (its reach near the Sun), not its productive mechanism *where it applied*. The governing view naturally explains the strong epistemic entitlement and the differential outcome based on the law's actual domain of governance.

  ---

  ### **Suspicions Tested & Verdicts**
  1.  **Production vs. Reach:** Your suspicion holds. The Vulcan episode is potent evidence about the *reach* of laws – their ability to license expectations and inferences about the unobserved. Both views account for reach, though differently (BSA via systemic strength/extendability, Governing via ontological governance). The episode is silent on *production* (what makes the events happen). Humeans *can* help themselves to reach via systematization (including extendability), though its characterization within BSA requires careful handling to avoid normative creep.
  2.  **BSA Slippage & Extendability:** Your second suspicion is insightful. Recognizing *extendability* as a crucial component of "strength" is necessary for BSA to handle scientific practice. However, this *does* risk smuggling in a normative, future-oriented element ("predictive power") that resembles the anti-Humean's reach derived from governance. It makes BSA less a pure summary and more a guide. This resource *is* doing work analogous to anti-Humean reach, framed systemically. Whether this is "anti-Humean in disguise" depends on whether you see normative predictive power as inherently non-Humean. It's a tension within BSA, not necessarily fatal, but requiring refinement.
  3.  **Differential Vindication Constraint:** It bears significant weight, primarily **against the Humean BSA**. The BSA struggles to explain why two inferences, equally virtuous for the best system *at the time*, had diametrically opposed outcomes regarding their contribution to systemic virtue. The failure feels contingent and external to the systemic virtues assessed pre-discovery. The Governing view handles it more smoothly by distinguishing justified belief based on current law from ontological success dependent on the true, complete law.
  4.  **Verdicts:**
      *   **Humean BSA:** This episode is **an anomaly** for the standard formulation. It exposes the need to explicitly incorporate *extendability* (predictive success into new domains) into "strength" and highlights the difficulty explaining the differential outcome of equally virtuous inferences. It strains the "summary" metaphor. While adaptable (extendability can be included), it reveals a vulnerability.
      *   **Anti-Humean Governing View:** The episode is **confirmatory**, or at worst, **neutral**. It perfectly illustrates the view in action: laws license inferences to unobserved governors; justified inferences can fail if the assumed law is incomplete/incorrect; the discovery of the true governing law (GR) resolves the anomaly. It cleanly explains Le Verrier's epistemic entitlement and the differential vindication without internal tension.
      *   **Neither Built to Handle?** No. Both views were built to handle scientific inference and theory change. The Governing view handles it more elegantly. The BSA can handle it, but only by stretching the concept of "strength" in a way that exposes a potential weakness and normative element it often seeks to avoid. The case powerfully interrogates the resources each view uses to explain scientific practice, particularly predictive inference.
