prompt: |-
  I am a legal adviser in a government social-security department. I draft internal guidance, I sit occasionally with the first-tier tribunal, and I spend a good deal of time in meetings where what appears to be the same argument recurs in different vocabulary. I have noticed a pattern I cannot name, and I would like to know whether it has one. I am not asking for a label to attach to it: I want to know what the thing is, where its edges lie, and what it is not.

  The pattern, as I meet it. Two parties disagree about whether a classificatory term applies to a case. Pressed, they turn out to agree on every fact in the case and on every consequence the case itself will have — the same sum paid to the same person by the same procedure, whichever way the classification goes. Pressed further, they will usually agree that no statute, rule, or binding decision settles it. Yet neither treats the matter as open. Each insists that the other has it wrong in the way one has an ordinary question of fact wrong; each treats the suggestion that we simply fix a usage for the purposes of the document as a way of dodging the question; and each becomes more emphatic, not less, when it is pointed out that nothing in this case turns on the answer. What is at stake is real but not local. Both sides know that the classification will be carried forward and reused in later cases where the consequences do diverge, and that the term drags with it a settled set of downstream inferences. That, apparently, is what they are arguing about, although neither will put it that way.

  Three instances.

  First: a claimant's award is reduced after she fails to attend a work-focused interview. One side insists that this is a penalty imposed for misconduct; the other insists that entitlement was conditional from the outset and that nothing was ever owed, so no penalty is imposed. Both agree on the amount, the procedure, and the outcome here. Both also know that the answer will determine, next year, whether proportionality review and the criminal-process analogies apply to the entire conditionality regime.

  Second: an overpayment arises because a claimant did not report a change in earnings. One side calls this fraud; the other calls it a failure of the department's own reporting design. Recoverability and amount are identical on either description. The descriptions differ in what they will license later: criminal referral, the framing of the compliance figures, the terms of the next public consultation.

  Third: participants in a mandatory placement scheme. Is the placement work or training? Nothing in the present case turns on it, but minimum-wage duties, employment status, and health-and-safety obligations attach to one label and not the other, and the scheme is due to be expanded. In one such case the tribunal did impose a stipulation for the purposes of the decision; the dispute then reappeared one level up, about what to call the category the stipulation had created, and has not gone away since.

  The obvious diagnosis does not fit. It has been suggested to me that these are simply verbal disputes, in the sense that the two sides are using a word in different senses and are therefore talking past each other. That is not what is happening. They are using the same word in what is plainly the same sense, and disagreeing about whether it applies; and pointing this out does not dissolve anything, because dissolution is precisely what they are resisting. Nor is the disagreement an ordinary one about what would be best: neither party is prepared to describe themselves as making a choice, and both regard the claim that they are choosing as a misdescription of what they are doing.

  So: does this configuration have an established name? If there are established notions that come close without matching — including any that are more refined than the crude different-senses story I have just rejected — I want to know which they are, what each would predict about the three cases above, and exactly where each stops fitting. If nothing established fits, coin a term and define it tightly enough to be usable, and give me the boundary cases: something that looks like my pattern but is not it, and something that is my pattern but does not look like it.

  Three further things I would like settled. Does the phenomenon depend on the disputed terms being at once descriptive and evaluative — fraud, penalty, desert — or does it also arise with flatly administrative classifications, such as whether a claimant doing three hours of casual work a week counts as in work for a reporting category that currently carries no consequence but will determine eligibility for a pilot scheme next year? If it does depend on that mixture, is the mixture the explanation of the pattern or merely its usual accompaniment? And someone has told me that metaphysicians worry about arguments with a similar shape — questions to which nothing inside the discipline seems to turn on the answer, whose participants insist they are describing rather than choosing, and where the sophisticated move is to say that the question is really about which framework to adopt. If that is right, is my phenomenon the same thing in another register, or a different thing that merely resembles it?

  I am not asking for a reading list. Please answer in American English, and keep it under about a thousand words.
reasoning: |-
  Okay, the user is a legal adviser in a government social-security department who's observed a recurring pattern in disputes. They've provided three clear examples where parties disagree on classifying a case under a term, despite agreeing on all facts and immediate consequences. The disagreement persists because both sides know the classification will set precedents affecting future cases with different consequences. 

  The user explicitly rejects the "verbal dispute" explanation. They want to know if this phenomenon has a name, its boundaries, and whether it requires evaluative terms or works with purely administrative ones. They also ask about parallels in metaphysics.

  I recognize this pattern. It's not about the immediate case but about precedent-setting - what Hart called the "open texture" of law. The core issue is how classifying this case will constrain future decisions when the same term is applied to different fact patterns. 

  For the administrative vs evaluative question: while their examples involve loaded terms (fraud/penalty), the mechanism would work with neutral terms too. What matters is that the classification becomes part of the system's interpretive framework. The pilot scheme example they mention would qualify.

  The metaphysical parallel they reference is likely Carnap's "framework questions" - where disputes appear factual but are really about choosing conceptual systems. That's analogous here, though legal systems add institutional force to the choice.

  Key boundaries:
  - Not semantics (same term/same meaning)
  - Not policy choice (parties frame as discovery)
  - Not hypothetical (real future stakes)
  - Must involve systemic ripple effects

  I'll structure the response as:
  1. Core mechanism (precedent-setting via classification)
  2. Name proposal: "doctrinal anchoring"
  3. Boundaries (what it is/isn't)
  4. Administrative vs evaluative clarification
  5. Metaphysics parallel
answer: |-
  This phenomenon is **precedent-setting via classification under open-textured terms**. It's not merely semantic disagreement but a struggle over which **inferential pathway** becomes embedded in the system's operational logic. Below is a breakdown:

  ### Core Mechanism
  - **What it is**: A dispute over the application of a classificatory term where:
    1. **Immediate facts/consequences are undisputed**.
    2. **The term is open-textured** (no binding rule resolves it).
    3. **Parties treat classification as objective** (rejecting "choice" framing).
    4. **Stakes lie in downstream systemic inferences** (future cases, policy analogies, procedural frameworks).
  - **Why resistance occurs**: Admitting arbitrariness undermines the precedent’s authority. The classification is a **Trojan horse for institutional logic**—e.g., calling something "fraud" imports criminal-law norms; "training" vs. "work" triggers employment-law frameworks.

  ### Name & Boundaries
  - **Proposed term**: **Doctrinal Anchoring**  
    (It captures how classifying *this* case anchors future reasoning to a specific doctrinal lineage.)
    
  | **Boundary Cases**                  | **Why It Fits/Doesn’t Fit**                                                                 |
  |-------------------------------------|---------------------------------------------------------------------------------------------|
  | **Looks similar but isn’t**:        |                                                                                             |
  | Pure semantic dispute               | Parties *agree* on the term’s meaning but dispute application; dissolution isn’t accepted. |
  | Policy choice debate                | Parties deny making a choice; frame it as discovering correctness.                         |
  | **Fits but looks different**:       |                                                                                             |
  | Dispute over "in work" for a pilot scheme | Neutral term, but anchors future eligibility rules—identical stakes in systemic inference. |

  ### Key Questions Resolved
  1. **Does it require evaluative terms?**  
     **No**. Your pilot-scheme example fits: "in work" is administrative, but its classification anchors future eligibility. Evaluative terms (e.g., "fraud") heighten stakes by importing moral/political baggage, but the mechanism works identically for neutral terms.  
     - *The mixture is an amplifier, not the engine*: Evaluative terms intensify conflict because they trigger entrenched normative frameworks, but the core is always **systemic inference-rigging**.

  2. **Metaphysics parallel?**  
     **Same structure, different domain**. Carnap’s "framework questions" and Quine’s "ontological relativity" mirror this: Philosophers dispute categories (e.g., "Do numbers exist?") where nothing observable turns on it, but the answer licenses entire reasoning systems (e.g., Platonism vs. nominalism).  
     - **Critical difference**: Legal classifications have **institutional force**. A tribunal’s "training" vs. "work" decision alters real-world obligations; a philosopher’s "framework choice" does not.

  ### Why "Doctrinal Anchoring" Fits Your Cases
  - **Work-interview penalty**: Anchors future review to "misconduct" (criminal analogs) or "conditional entitlement" (administrative law).  
  - **Overpayment as fraud**: Anchors future cases to criminal referrals or system-design critiques.  
  - **Placement scheme**: Anchors minimum wage/liability rules to one doctrinal lineage (employment law) or another (training programs).  

  ### What It Is Not
  - **Not "mere labeling"**: The classification is substantive because it **pre-loads future decisions**.
  - **Not "precedent" in the usual sense**: It’s about embedding inferential pathways, not binding outcomes.
  - **Not "political framing"**: Parties genuinely believe they’re describing reality; the dispute is ontological ("What *is* this?") not strategic ("How should we sell this?").

  ### Summary
  **Doctrinal Anchoring** occurs when parties fight over open-textured classifications to control the inferential infrastructure of a system—despite agreeing on local facts. It arises wherever classifications are **inference-licensing tools**, regardless of term evaluativity. The metaphysical parallel is structurally identical but lacks institutional consequences.
