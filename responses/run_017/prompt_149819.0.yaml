prompt: |-
  You are a professional moral philosopher who specialises in the moral emotions — guilt, shame, remorse — and in the social practices that cultivate them. Please think carefully, and begin by brainstorming the distinctions in play before you organise your answer; I would rather have a structured menu of options than one confident reading.

  I sit on a committee rewriting our professional body's disciplinary and restorative procedures. A consultant we brought in kept closing discussion down with the line 'guilt is about what you did, shame is about who you are', and used it to argue for two things: first, that our procedures should aim to elicit guilt and never shame — no public naming, no ritual that marks the person rather than the deed; second, that an institution or culture can simply choose which of the two emotions it cultivates, so that we can deliberately become a 'guilt culture' rather than a 'shame culture'. I am suspicious of both moves but cannot say precisely why.

  Take the slogan apart. What are the distinct precise claims it could be making — about the emotion's intentional object, about its representational content (what it 'says'), about what makes it apt or fitting, about its phenomenology, about its characteristic action-tendency (confession and repair versus concealment and withdrawal), about how local and how durable it is, or about which of the two is normatively in good standing? For each reading, say whether it is close to tautological, a plausible empirical generalisation, a substantive normative thesis, or straightforwardly false.

  Two complications I want addressed rather than smoothed over. First, the division looks less tidy than the slogan implies: people speak of being ashamed of some specific thing they did without concluding anything about their character, and of feeling guilty about what they are like — their motives, desires, or susceptibilities — with no particular deed in view. Does that undermine the readings, or can they be repaired to accommodate it? Second, and this matters most to me: for each reading, does it actually get the consultant his two conclusions? If shame does take the whole person as its object, does it follow that institutions must never appeal to it, given that a person is arguably partly constituted by what they have done? And does anything in the slogan support the thought that which emotion a culture reliably produces is a matter of choice, rather than of history, hierarchy, and the credibility of whichever audience does the shaming?

  Lay the readings out as a numbered list with a verdict on each, and close by saying which single reading — if any — the consultant would need in order to reach his recommendations, and how defensible that reading is.
reasoning: |-
  Okay, the user is a professional on a committee rewriting disciplinary procedures, and they're dealing with a consultant who simplifies guilt and shame with a catchy slogan. The user is skeptical but can't pinpoint why. Let me start by breaking down the consultant's slogan: "guilt is about what you did, shame is about who you are." The consultant uses this to argue against public shaming and for cultivating guilt instead. The user wants a detailed analysis of possible interpretations of this slogan and whether each supports the consultant's conclusions.

  First, I need to brainstorm the distinctions between guilt and shame across different dimensions. The user mentioned intentional object, representational content, fittingness conditions, phenomenology, action tendencies, durability, and normative standing. Let me list out each aspect for both emotions. 

  For the intentional object, guilt typically focuses on a specific action, while shame targets the self. But the user pointed out complications: people can feel shame for specific actions without global self-assessment, and guilt can arise from enduring traits. So maybe the object isn't strictly binary. That might weaken the consultant's first claim.

  Next, representational content. Guilt says "I did something bad," shame says "I am bad." But again, empirical evidence shows variability. People might feel shame without internalizing it as a core identity. So this isn't a tautology; it's a generalization that doesn't always hold.

  Fittingness conditions: Guilt is fitting for wrongful acts, shame for a defective self. But what counts as a defective self? If actions reflect character, then shame might sometimes be fitting. This ties into normative arguments about whether shame is appropriate. The consultant assumes shame is always bad, but philosophers like Williams argue it can be constructive. So this point might not support banning all shame-inducing practices.

  Phenomenology: Guilt feels like tension, shame like exposure. But experiences vary culturally and individually. This is descriptive and doesn't necessarily dictate normative policies.

  Action tendencies: Guilt leads to reparative actions, shame to withdrawal. Research supports this generally, but there's nuance. Shame can motivate change if the self is seen as modifiable. So avoiding shame entirely might remove a potential motivator for some individuals.

  Durability and locality: Shame is more global and persistent, guilt more specific and temporary. But again, not absolute. This might justify avoiding shame in procedures, but it's an empirical generalization, not a strict rule.

  Normative standing: The consultant implies guilt is always better. But ethical perspectives differ. Communitarian views see shame as essential for social cohesion. The consultant's stance here is a substantive normative claim, not an objective truth.

  Now, addressing the complications. The user noted that people experience shame for specific actions and guilt for traits. This challenges the binary. Maybe the emotions exist on a spectrum, and cultural contexts influence their expression. So the slogan oversimplifies.

  For the consultant's conclusions: First, that procedures should avoid shame. If shame targets the self, but the self is partly defined by actions, then actions could legitimately provoke shame. Banning all shame might be an overreach. Second, the idea that cultures can choose which emotion to cultivate ignores historical and structural factors. Hierarchical societies might find shame more prevalent regardless of institutional design. So the consultant's second claim is likely false.

  The consultant needs the representational content reading (shame says "I am bad") to argue that shame is always harmful. But since people can feel shame without global self-condemnation, this reading is a weak generalization. Therefore, the consultant's position isn't well-supported. The user's suspicion is valid; the slogan is too reductive, and both conclusions are problematic.
answer: |-
  Here is a structured analysis dissecting the slogan "guilt is about what you did, shame is about who you are" across key dimensions. I address your complications explicitly and evaluate the consultant's two conclusions for each reading. Verdicts categorize each claim's nature and strength.

  **Numbered Readings & Verdicts:**

  1.  **Intentional Object:**
      *   **Claim:** The *focus* or *target* of guilt is a specific action/omission ("I yelled at my colleague"). The *focus* or *target* of shame is the global self or enduring identity ("I am a bad person").
      *   **Complication Handling:** This reading is strained by the phenomena. While guilt *often* targets actions, it can target persistent character flaws or motives ("I feel guilty about being so selfish"). Shame *can* target specific acts ("I'm ashamed *of that outburst*") without necessarily implying a global negative self-assessment. This requires viewing the object as a *spectrum* (specific act -> enduring trait -> global self) where guilt leans left and shame leans right, but significant overlap exists.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Partially. If shame *tends* to target the global self, procedures targeting *specific acts* seem safer. However, if acts can *reflect* identity (and identity is constituted by acts), banning *any* shame appeal is overbroad. It doesn't follow that shame *must* be avoided if its object *can* be specific or if the act *is* identity-relevant (e.g., violating core professional ethics).
          *   *Cultivation Choice:* Weak. This descriptive claim about object focus doesn't directly address *how* cultures cultivate emotions.
      *   **Verdict:** Plausible Empirical Generalization (with significant exceptions and spectrum overlap).

  2.  **Representational Content (What the Emotion "Says"):**
      *   **Claim:** The cognitive appraisal in guilt is "I did a bad thing." The appraisal in shame is "I *am* a bad person."
      *   **Complication Handling:** The complications directly challenge this reading. People *do* appraise specific acts as shameful ("*That* was shameful") without concluding "I am bad." People *do* appraise enduring traits as guilt-inducing ("My laziness is inexcusable"). This reading struggles and requires significant qualification (e.g., "shame *typically* implies...").
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Stronger *if* accepted. If shame intrinsically represents the self as globally defective, eliciting it seems inherently harmful and identity-damaging, justifying a ban.
          *   *Cultivation Choice:* Minimal. The "message" of the emotion doesn't dictate *how* cultures produce it.
      *   **Verdict:** Overstated Empirical Generalization / Often False in specific instances. Requires heavy qualification to accommodate complications.

  3.  **Fittingness Conditions (What Makes the Emotion Apt):**
      *   **Claim:** Guilt is fitting (appropriate) *only* in response to a wrongful *action*. Shame is fitting *only* in response to a defective *self* or core identity.
      *   **Complication Handling:** This is normative, not descriptive. It *defines* when the emotion *should* be felt. The complications reveal a disconnect: people *feel* shame for acts (which may or may not be fitting) and guilt for traits (which may or may not be fitting). The claim itself insists shame *shouldn't* be felt for mere acts, only for a defective self, and guilt *shouldn't* be felt for mere being, only for acts. This attempts to *correct* common usage via stipulation.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Strong *if* accepted. It normatively grounds the ban: since disciplinary procedures address *acts*, only guilt is fitting; eliciting shame for acts would be *unfitting* and thus unethical.
          *   *Cultivation Choice:* Weak. Defines *when* emotions *should* be felt, not *how* cultures make people feel them.
      *   **Verdict:** Substantive Normative Thesis (contested; e.g., Bernard Williams argues shame *can* be fitting for acts revealing character).

  4.  **Phenomenology (What It Feels Like):**
      *   **Claim:** Guilt feels like internal tension, remorse, a nagging sense of responsibility. Shame feels like exposure, smallness, a desire to disappear, being seen as fundamentally flawed.
      *   **Complication Handling:** This holds reasonably well across the complications. Feeling ashamed of a specific act still involves the phenomenology of exposure/hiding; feeling guilty about a trait still involves the phenomenology of responsibility/tension.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Supports *why* avoiding shame might be desirable (its phenomenology is often more painful and socially disruptive), but doesn't necessitate a *ban*, just a prudential preference.
          *   *Cultivation Choice:* None. Describes experience, not causal origins.
      *   **Verdict:** Plausible Empirical Generalization (relatively robust).

  5.  **Characteristic Action-Tendency:**
      *   **Claim:** Guilt motivates reparative actions (apologize, confess, make amends, fix the mistake). Shame motivates concealment, withdrawal, hiding, or aggression (defending the threatened self).
      *   **Complication Handling:** This is one of the strongest generalizations. While nuances exist (e.g., "shame-free" guilt can lead to denial; "guilt-prone" shame can motivate repair *if* the self is seen as redeemable), the core tendencies are well-supported empirically. Feeling ashamed *of an act* still typically triggers a desire to hide *that act* or oneself.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Strong practical support. If the goal is restoration/repair/accountability, guilt tendencies align, while shame tendencies (withdrawal/hiding) are counter-productive. Public naming/rituals *often* trigger shame-withdrawal.
          *   *Cultivation Choice:** Indirect support. If you want repair-oriented responses, cultivate the emotion (guilt) linked to those responses. Doesn't guarantee *how* easy that cultivation is.
      *   **Verdict:** Robust Empirical Generalization (with acknowledged nuances).

  6.  **Durability & Locality:**
      *   **Claim:** Guilt is more specific/local (tied to the act) and potentially more transient (resolved by repair). Shame is more global (affects overall self-concept) and more persistent/durable (lingers even after the act is addressed).
      *   **Complication Handling:** Holds reasonably well. Shame about a specific act can still feel global ("This act *reveals* my true nature") and be persistent. Guilt about a trait is more durable than guilt about a single act.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Supports the preference. Persistent, global negative self-assessment is undesirable and potentially damaging, making shame riskier to elicit institutionally.
          *   *Cultivation Choice:** None directly.
      *   **Verdict:** Plausible Empirical Generalization.

  7.  **Normative Standing (Which is Morally Better):**
      *   **Claim:** Guilt is a morally superior or healthier emotion because it focuses on correctable actions and motivates repair. Shame is morally inferior or pathological because it attacks the core self, leading to dysfunction and despair.
      *   **Complication Handling:** This claim often *drives* the slogan but isn't inherent in it. The complications highlight that both emotions can be felt in complex ways; this claim judges them normatively regardless.
      *   **Support for Consultant's Conclusions?**
          *   *Avoid Shame:* Direct and foundational. This *is* the core normative argument for banning shame-induction.
          *   *Cultivation Choice:** Strong. If guilt is inherently superior, institutions *should* deliberately cultivate it and suppress shame.
      *   **Verdict:** Substantive Normative Thesis (Highly contested: Communitarians argue shame maintains social bonds; others argue "healthy shame" exists; some see guilt as potentially neurotic).

  **Addressing Your Core Complications Explicitly:**

  1.  **"Shame of act / Guilt of trait":** This significantly weakens Readings 1 (Object) and 2 (Content), turning them from potential tautologies/near-truths into generalizations with important exceptions. Readings 3 (Fittingness) and 7 (Normative) *use* these generalizations to make normative claims, which are thus built on shaky descriptive ground. Readings 4 (Phenomenology), 5 (Action-Tendency), and 6 (Durability) hold up better against these complications.
  2.  **Institutional Avoidance of Shame:** Even if shame *tends* to target the self (Readings 1, 2, 6), it doesn't *necessarily* follow that institutions must *never* appeal to it. If actions constitute character (Aristotelian view), then disciplinary acts *are* relevant to "who one is" as a professional. A total ban assumes: a) shame *always* has catastrophic effects (disputed), b) guilt *always* suffices (questionable for serious breaches), and c) institutions can perfectly isolate the act from the self (unlikely). The strongest *practical* argument comes from Action-Tendencies (Reading 5).
  3.  **Cultural Choice of Emotion:** **This is the consultant's most vulnerable claim.** Readings 1-7 describe characteristics or norms *of* the emotions, not *how cultures produce them*. The slogan offers *no support* for the idea that cultivation is a simple matter of choice. Cultural emotion norms are deeply embedded in:
      *   **History:** Long-standing traditions and practices.
      *   **Hierarchy:** Power structures determine who can shame whom effectively and credibly. A "guilt culture" requires institutions perceived as legitimate *and* internalized norms by individuals.
      *   **Credibility of Audiences:** Shame requires an audience whose judgment matters. Guilt requires internalized standards. Changing this requires changing deep social structures and individual psychology, not just procedures. The consultant's claim here is **straightforwardly false** as an implication of the slogan; it requires independent, likely implausible, sociological assumptions about institutional plasticity.

  **Conclusion: The Consultant's Necessary Reading and its Defensibility**

  To reach his **strong conclusions** – a principled *ban* on shame-induction and the feasibility of deliberately choosing a "guilt culture" – the consultant fundamentally relies on **Reading 7 (Normative Standing): Guilt is inherently morally superior to shame.**

  *   **Why?** Only this reading provides the *normative imperative* to actively avoid shame and cultivate guilt. The other readings offer descriptive generalizations (some strong, like Action-Tendency; some weak, like Object/Content) or contested normative definitions (Fittingness) that might *support* a *preference* for guilt but don't *demand* the complete exclusion of shame or guarantee the feasibility of cultural transformation. The Action-Tendency argument (Reading 5) is pragmatically powerful but doesn't make shame *inherently* immoral, just often counterproductive. The ban and the cultivation choice are expressions of the normative judgment in Reading 7.

  *   **Defensibility of Reading 7 (Normative Standing):**
      *   **Strengths:** Aligns with individualistic, therapeutic modern Western values emphasizing self-esteem and corrective action over condemnation. Strongly supported by psychology linking shame to psychopathology and guilt to prosocial behavior. Resonates with liberal ideals of judging acts, not persons.
      *   **Weaknesses:** Philosophically contested. Ignores the potential social-regulatory function of shame (e.g., enforcing shared norms, especially in communities). Overlooks arguments for "authentic" or "productive" shame that motivates positive identity change. Risks excessive leniency or lack of gravity for severe professional breaches. Fails to account for cultural variations in the meaning and value of shame. **Crucially, it often builds upon the contested descriptive generalizations (Readings 1 & 2) challenged by your complications.**

  Therefore, while the consultant's recommendations might be *motivated* by pragmatic concerns (Action-Tendencies) or a *preference* based on Durability/Phenomenology, their *justification as absolute principles and a simple matter of institutional choice* hinges on the **highly contested and philosophically substantive Normative Thesis (Reading 7)** that guilt is inherently morally superior to shame. This thesis is not entailed by the slogan itself and faces significant challenges from alternative ethical perspectives and the messy realities of emotional experience you noted. Your suspicion is well-founded.
