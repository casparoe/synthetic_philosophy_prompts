  ## Programme Notes: Spike Lee's *Do the Right Thing* and the Contested Landscapes of Memory

  Our season exploring public memory concludes with Spike Lee's incendiary and essential masterpiece, *Do the Right Thing* (1989). While contemporary debates often focus on statues in civic squares, Lee locates the battleground far more intimately: on a single sweltering block in Bed-Stuy, Brooklyn, itself named for the colonial legacy of Peter Stuyvesant. Here, the struggle over who is remembered, honoured, and addressed unfolds not on grand plinths, but within the seemingly mundane space of Sal’s Famous Pizzeria and its **Wall of Fame**.

  The Wall, adorned solely with photographs of Italian-American celebrities, becomes the film’s central mnemonic flashpoint. Buggin’ Out’s demand to include Black figures is dismissed by Sal as a matter of personal ownership and preference ("my wall, my business, my heroes"). Applying our framework:

  1.  **Honour vs. Remembrance vs. Address:** Buggin’ Out’s claim is primarily one of **address**. While honouring Black icons is part of it, his core grievance is that the Wall implicitly defines the pizzeria’s public – and by extension, the block’s identity – as exclusively white. It signals who belongs, whose cultural touchstones are valued *here*. Sal’s defence appeals to **honour** ("my heroes") and private ownership, but fundamentally ignores the dimension of **address**. He treats the Wall as personal fandom, oblivious to how it functions as **ambient commemoration** within the neighbourhood fabric.
  2.  **Ambient Commemoration & The Ratchet:** The Wall’s power lies precisely in its ambient nature. Its Italian-American focus isn't a loud proclamation; it’s the visual furniture of a community space, absorbed daily by the predominantly Black clientele. This normalisation makes challenging it difficult – it’s just "how things are." Sal installed it unilaterally (the **ratchet** clicking into place), and Buggin’ Out’s attempt to change it requires mobilising collective action against this inertia. The status quo, far from neutral, embodies Sal's unchallenged narrative.

  Sal’s dismissal doesn't resolve the conflict; it fuels it. The simmering tensions ignited by the Wall, amplified by Radio Raheem’s defiant music and the escalating heat, culminate tragically in Radio Raheem’s death at police hands. The subsequent burning of Sal’s pizzeria by the enraged crowd is a cataclysmic act of **counter-commemoration**. It is not merely destruction, but an erasure. By burning the building housing the contested Wall, the community violently rejects the narrative it represented. They refuse the ambient message that excludes them. The film presents this act with profound ambiguity: it is undeniably tragic, born of unbearable pain and systemic injustice, yet also presented as a raw, visceral assertion of presence against erasure – a desperate, destructive form of claiming space and history.

  The reckoning comes the next morning. The pivotal moment is the conversation between Mookie (who threw the trash can initiating the fire) and Sal amidst the smouldering ruins. Their complex exchange – part accusation, part weary resignation – defies easy moralising. It’s followed by the film’s famous closing juxtaposition: quotations advocating non-violence and revolutionary self-defence appear on screen. Crucially, these are immediately succeeded by the image of Mookie and Sal shaking hands – a gesture echoing the photograph of Martin Luther King Jr. and Malcolm X smiling together that the character Smiley has been attempting to sell throughout the film.

  *   **Lee's Commemorative Framing:** This ending *is* a powerful act of commemoration. Lee refuses a singular, didactic message about violence or resolution. By placing King and Malcolm X side-by-side, he honours the complexity of Black political thought and struggle. By then showing the handshake (mirroring Smiley's photo), he commemorates not just historical figures, but the fraught, necessary, and ongoing **negotiation** between individuals who share a space and history, even after trauma. It addresses the community directly, saying: *This complexity, this tension, this difficult coexistence is your reality. Remember it.* It does this exceptionally well, forcing the audience to hold contradiction without resolution.

  **Where the Reading Holds and Where it Stretches:**

  Your framework illuminates the core conflict brilliantly. The Wall *is* commemoration in the neighbourhood’s eyes, precisely because of its **address** function within the **ambient** landscape. Sal’s denial of this public dimension is the fatal error. The **ratchet** explains the inertia Buggin’ Out faces.

  The potential stretch lies in the destruction as *pure* counter-commemoration. While it undeniably erases the offending symbol, it’s also raw rage, grief, and a strike against perceived economic exploitation. The film masterfully blends these motivations, making it *also* commemorative without being *only* that. Your insight about the **contested publicness of a surface** is crucial here – the film brilliantly shows how ostensibly private spaces become charged with public meaning in marginalised communities, a nuance often missing from abstract debates about monuments on public land.

  **What the Film Shows Beyond the Argument:**

  *Do the Right Thing* transcends philosophical abstraction by grounding the memory wars in visceral, lived reality. It demonstrates that disputes over commemoration are rarely *just* about the past. They are fiercely contemporary battles about **standing, belonging, and power** within a shared *present* space. They are conducted among people who must face each other the next day, amidst the ashes or the uneasy truce. The film reveals commemoration not as a dry historical exercise, but as an active, often painful, negotiation of identity and territory in the ongoing life of a community. The handshake isn’t forgiveness; it’s an acknowledgment that the conversation, like the struggle over memory itself, continues.

  ---

  **Post-Screening Discussion Pauses:**

  1.  **Sal polishing the Wall of Fame:** Early in the film. Pause to discuss: What does Sal’s care for the Wall signify? How does its composition and location make it function as ambient commemoration? What message is being passively "addressed" to the neighbourhood?
  2.  **Smiley showing the photograph:** Any instance where Smiley tries to sell his picture of King and Malcolm X together. Pause to ask: How does this image function throughout the film? What kind of commemoration is Smiley attempting? Why does he struggle to sell it? How does it foreshadow the film’s conclusion?
  3.  **Mookie and Sal’s handshake:** The final moments after the quotes appear. Pause to reflect: How do we interpret this gesture in the context of the night’s violence and the preceding quotes? Does it represent reconciliation, resignation, a truce, or something else? How does it relate to the themes of commemoration and living together?

  **The Film's Unique Insight on Commemoration:**

  Beyond illustrating abstract arguments, *Do the Right Thing* exposes commemoration as inherently embedded in the messy reality of *ongoing community life*. It reveals that the power of a memorial – whether a statue or a pizzeria wall – stems not just from its declared intent, but from how it functions within the daily rhythms and power dynamics of the place it occupies. Crucially, the film shows these disputes erupting among people bound by geography and necessity, who must negotiate coexistence even after seismic clashes over representation and belonging. The unresolved tension of the ending underscores that commemoration isn't a settled historical account; it's a continuous, contested dialogue about who the community is *now* and who has the standing to define its shared space and story. The film forces us to confront memory as a lived, present-tense negotiation, not merely a reflection on the past.
