          Step1: 4 * 0.400001 * 0.599999 = 0.96000159996 -> 0.960002
          Step2: 4 * 0.960002 * 0.039998 = 4 * 0.03839999996 -> 0.15359999984 -> 0.153600
          Step3: 4 * 0.153600 * 0.846400 = 0.5199936 -> 0.519994 (same as A)
          Step4: same -> 0.998400
          Step5: same -> 0.006390

          They don't diverge? 

     The logistic map at r=4 is chaotic, but this starting value is in a stable spot? We need a value that is more sensitive.

     We choose a value in a more sensitive region. Let's try 0.123456 and 0.123457 as originally planned, and we accept that the Predictors will get few or none right. That's okay because the point is that even with the rule, finite precision kills prediction.

     We'll stick with 0.123456 and 0.123457. The Predictors start with 0.123 and get:

          x0 = 0.123
          x1 = 4 * 0.123 * 0.877 = 4 * 0.107871 = 0.431484 -> 0.431
          x2 = 4 * 0.431 * 0.569 = 4 * 0.245239 = 0.980956 -> 0.981
          x3 = 4 * 0.981 * 0.019 = 4 * 0.018639 = 0.074556 -> 0.075
          x4 = 4 * 0.075 * 0.925 = 4 * 0.069375 = 0.2775 -> 0.278
          x5 = 4 * 0.278 * 0.722 = 4 * 0.200716 = 0.802864 -> 0.803

     True from 0.123456 (rounded to 3 decimals):

          Step1: 0.433
          Step2: 0.982
          Step3: 0.070
          Step4: 0.262
          Step5: 0.773

     They get 0/5. That's fine. We note that even at step1, they are close (0.431 vs 0.433) but not exact. The point is that without the precision, they are off.

     Then the Oracle does steps 1-5 from 0.123456 and gets them right (as per the A sequence). Then for steps 6-10, the Oracle uses the value at step5 (0.773000) to compute step6: 4 * 0.773000 * 0.227000 = 0.701 -> 0.701 (rounded to 3 decimals). But the true value (from the B sequence) at step5 is 0.772000 (from the precomputation above: step5 for B is 0.7720 -> 0.772), then step6 for B is 4 * 0.772 * 0.228 = 0.704 -> 0.704. So the Oracle's prediction for step6 is 0.701 but the true value is 0.704 -> they differ at the 3rd decimal.

     This will be seen as a failure.

     We go with this.

     Therefore, the starting value for the first phase is 0.123456 (and 0.123457 for the hidden sequence) and we give the Predictors 0.123.

     For the black box phase, we will generate:

          Deterministic: logistic map with a new start, say 0.712345 (and generate 10 steps, rounded to 3 decimals)
          Random: 10 numbers from a uniform distribution in [0,1] rounded to 3 decimals.

     We generate the random sequence in advance.

