          We can use: [0.123, 0.456, 0.789, 0.123, 0.456, 0.789, 0.123, 0.456, 0.789, 0.123] -> but that's periodic. We want random.

          Let's use: [0.712, 0.301, 0.841, 0.534, 0.198, 0.672, 0.438, 0.911, 0.257, 0.492]

     We print these two sequences for the black boxes.

