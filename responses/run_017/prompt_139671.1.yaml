  ### Activity Design: "The Prediction Gap"

  **Core Concept:** Students experience the gap between determinism and predictability through a chaotic system (logistic map: \(x_{n+1} = 4x_n(1 - x_n)\)) and a random process, using finite-precision calculations and betting.

  **Materials to Prepare:**
  1. **Index Cards:**
     - **Predictor Cards (15 students):** Starting value = 0.123 (printed).
     - **Oracle Card (1 student):** Starting value = 0.123456 (printed).
     - **Betting Cards (all students):** Grid for 10 bets (Box 1/Box 2, points wagered).
     - **Scoring Cards:** Track points (start with 10 points for betting phase).
  2. **Printed Sheets:**
     - **Prediction Grids:** For Predictors (5 steps) and Oracle (10 steps).
     - **Black-Box Sequences:**
       - *Box 1 (Deterministic):* 10-step logistic sequence from 0.712345 (rounded to 3 decimals: 0.820, 0.590, 0.968, 0.124, 0.434, 0.982, 0.071, 0.263, 0.775, 0.671).
       - *Box 2 (Random):* 10-step uniform random sequence (rounded to 3 decimals: 0.712, 0.301, 0.841, 0.534, 0.198, 0.672, 0.438, 0.911, 0.257, 0.492).
     - **Reveal Sheet:** True sequences for starting values 0.123456 (Steps 1–5) and 0.123457 (Steps 6–10).
  3. **Whiteboard Setup:**
     - Rule: \(x_{n+1} = 4x_n(1 - x_n)\).
     - Two columns: "Box 1" and "Box 2" for black-box reveals.

  ---

  ### Timeline (80 Minutes)

  #### **Phase 1: Prediction with Finite Precision** (25 min)
  - **0–5 min:** Introduce roles.  
    - *Predictors (15 students):* Predict using starting value 0.123 (3 decimals).  
    - *Oracle (1 student):* Predict using starting value 0.123456 (6 decimals) and a calculator.  
  - **5–15 min:** Predictors and Oracle compute **Steps 1–5** using the rule.  
    - Predictors write predictions (3 decimals) on grids.  
    - Oracle computes live and writes results (6 decimals) on the board.  
  - **15–20 min:** Reveal "true" values for Steps 1–5 (from 0.123456 sequence).  
    - *Scoring:* Predictors get 1 point per exact match (3 decimals).  
    - *Example:* Predictor’s Step 1 = 0.431 vs. true = 0.433 → 0 points.  
  - **20–25 min:** Oracle computes **Steps 6–10** using Step 5 value.  
    - Reveal "true" values for Steps 6–10 (from 0.123457 sequence).  
    - Score Oracle (1 point per match at 3 decimals).  
    - *Show divergence:* Display both sequences (0.123456 and 0.123457) side by side.  

  #### **Phase 2: Black-Box Challenge** (20 min)
  - **25–30 min:** Explain black boxes.  
    - One box: Deterministic (logistic map).  
    - Other box: Random.  
    - Students start with 10 points.  
  - **30–45 min:** Reveal sequences step by step.  
    - Uncover one number from each box every 90 seconds.  
    - After each reveal, students bet points on which is deterministic.  
    - *Betting:* Write "Box 1: [points]" or "Box 2: [points]" on cards.  
  - **45 min:** Reveal which box was deterministic (Box 1).  

  #### **Debrief** (30 min)
  - **45–50 min:** Show logistic rule and starting values (0.123456 and 0.123457). Contrast sequences.  
  - **50–60 min:** Map activity to key points:  
    1. **Law-Governed ≠ Predictable:**  
       - *"You had the rule, but tiny errors in start values (e.g., 0.123 vs. 0.123456) derailed predictions. Determinism doesn’t guarantee foresight."*  
    2. **Precision/Lead-Time Tradeoff:**  
       - *"Each extra prediction step costs ~3–4× more precision. Better instruments buy lead time, but at a terrible exchange rate."*  
    3. **Rule ≠ Prediction:**  
       - *"The Oracle had the true rule and 6-digit start value—yet failed. Not carelessness; unavoidable with finite precision."*  
    4. **Underdetermination at Fixed Resolution:**  
       - *"Short, noisy data can’t settle ‘deterministic vs. random’. You saw identical-looking series from different sources."*  
  - **60–75 min:** Address predictable misunderstandings:  
    - *"It’s random!"* → "The divergence shows sensitivity—not randomness. Same rule + different starts = different outcomes."  
    - *"More data/compute power fixes it!"* → "Faster computers don’t help; errors grow exponentially. Double precision only buys ~3 extra steps."  
    - *"Data from your laptop?"* → "The rule and sensitivity are mathematical. We simulated rounding—you did the calculations live."  
    - *"Oracle was careless!"* → "Check their math: It was correct. The failure came from the 0.000001 start-value difference."  
    - *"Determinism is unfalsifiable!"* → "This shows underdetermination at low resolution, not in principle. Cleaner/longer data can reveal structure."  
  - **75–80 min:** Exit ticket (index card):  
    1. Why couldn’t predictors forecast perfectly despite determinism?  
    2. How does initial precision relate to prediction lead time?  
    3. Why did the Oracle fail?  
    4. Why couldn’t you always distinguish the black boxes?  

  ---

  ### What the Activity Can’t Deliver (Must Be Stated by Instructor)
  1. **Unpredictability is artifact of chosen precision:**  
     - *"The ‘gap’ arises from our 3- and 6-digit limits. Real systems have noise, but this is a controlled demonstration."*  
  2. **Black boxes illustrate underdetermination at fixed resolution:**  
     - *"Longer/cleaner data can detect determinism (e.g., Lyapunov exponents). Here, resolution was too low to distinguish."*  
     - *Sharp student retort:* "What if we had 1,000 steps?" → **Answer:** "Good point! With enough clean data, determinism becomes detectable. But with 10 noisy steps? Underdetermined."  
  3. **No bearing on free will or real-world determinism:**  
     - *"This is a math exercise. It doesn’t imply the world is deterministic, nor does it address free will."*  

  ---

  ### Predictable Pitfalls and Responses
  - **Divergence too subtle?** → Use precomputed sequences to force visible splits (e.g., Step 6: Oracle predicts 0.701, "true" is 0.704).  
  - **Betting chaos:** → Use timed reveals (90 sec/step) and simple point tracking.  
  - **Calculation errors:** → Precompute sequences for backup; emphasize process over arithmetic.  

  This design ensures students *experience* the prediction gap through failure, tradeoffs, and ambiguity—setting up deeper discussion of chance, laws, and limits of knowledge.
