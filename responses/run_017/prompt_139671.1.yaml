    That's because the starting value 0.7 is exactly representable in 3 decimals. We need a value that is not. Let's try 0.7123 (so we give Predictors 0.712).

        Predictors:
            x0 = 0.712
            x1 = 4 * 0.712 * 0.288 = 4 * 0.205056 = 0.820224 -> 0.820
            x2 = 4 * 0.820 * 0.180 = 0.5904 -> 0.590
            x3 = 4 * 0.590 * 0.410 = 0.9676 -> 0.968
            x4 = 4 * 0.968 * 0.032 = 0.123904 -> 0.124
            x5 = 4 * 0.124 * 0.876 = 0.434496 -> 0.434

        True sequence from 0.712300 (6 decimals) -> 
            Step1: 4 * 0.7123 * 0.2877 = 4 * 0.2049 = 0.8196 -> 0.819600 -> rounded to 3 decimals: 0.820
            Step2: 4 * 0.8196 * 0.1804 = 4 * 0.1478 = 0.5912 -> 0.591
            Step3: 4 * 0.5912 * 0.4088 = 4 * 0.2416 = 0.9664 -> 0.966
            Step4: 4 * 0.9664 * 0.0336 = 4 * 0.0325 = 0.130 -> 0.130
            Step5: 4 * 0.130 * 0.870 = 0.4524 -> 0.452

        So the true values (3 decimals): 0.820, 0.591, 0.966, 0.130, 0.452

        The Predictors: 0.820, 0.590, 0.968, 0.124, 0.434

        They get step1 right (0.820), step2: 0.590 vs 0.591 -> not match (if we require exact), step3: 0.968 vs 0.966 -> no, step4: 0.124 vs 0.130 -> no, step5: 0.434 vs 0.452 -> no.

        Only step1 is right.

     We want to choose a starting value that gives a couple of matches. Let's try 0.4:

          Predictors: start 0.400
          x1 = 4 * 0.4 * 0.6 = 0.96
          x2 = 4 * 0.96 * 0.04 = 0.1536 -> 0.154
          x3 = 4 * 0.154 * 0.846 = 0.521 -> 0.521
          x4 = 4 * 0.521 * 0.479 = 0.998 -> 0.998
          x5 = 4 * 0.998 * 0.002 = 0.007984 -> 0.008

          True from 0.400000:
              Step1: 0.960000 -> 0.960
              Step2: 4 * 0.96 * 0.04 = 0.1536 -> 0.154
              Step3: 4 * 0.1536 * 0.8464 = 0.520 -> 0.520
              Step4: 4 * 0.520 * 0.480 = 0.9984 -> 0.998
              Step5: 4 * 0.9984 * 0.0016 = 0.0064 -> 0.006

          Predictors: 0.960, 0.154, 0.521, 0.998, 0.008
          True: 0.960, 0.154, 0.520, 0.998, 0.006

          They get step1, step2, step4 right (3 out of 5).

     So we choose a starting value of 0.4 for the first phase? But then we also need a nearby value for the Oracle's failure. Let's have:

          Card A: 0.400000
          Card B: 0.400001

     Precompute the sequences for A and B for 10 steps (rounded to 6 decimals) and see when they diverge at 3 decimals.

     We do:

          A: start 0.400000
          Step1: 4 * 0.400000 * 0.600000 = 0.960000
          Step2: 4 * 0.960000 * 0.040000 = 0.153600
          Step3: 4 * 0.153600 * 0.846400 = 0.5199936 -> 0.519994
          Step4: 4 * 0.519994 * 0.480006 = 0.998400 (exactly? 0.519994*0.480006=0.249600 -> *4=0.998400) -> 0.998400
          Step5: 4 * 0.998400 * 0.001600 = 0.00638976 -> 0.006390

