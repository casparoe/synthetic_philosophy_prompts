prompt: |-
  I'm the student representative on my university's committee on automated assessment, and we have to rule on a proposal next week. I'd like a prediction grounded in our own track record rather than a general discussion of AI supervision.

  Our published decisions so far, in short form:

  1. Approved: a model that graded short-answer physics problems, after an audit on 200 answers found it agreed with two human markers as often as they agreed with each other; every grade carried the rubric item applied, and disagreements were reviewed.
  2. Approved: a code assistant in a research lab, with no measurement of the suggestions themselves — each edit was accepted or rejected line by line by the researcher with a logged reason, and the finished pipeline passed its test suite and replicated.
  3. Rejected: model-written feedback on draft essays. Students and instructors, blind, rated the comments as helpful as human comments — but the model could not be made to say which passage any given comment was about, and roughly one comment in twelve invoked a rubric criterion the essay did not address.
  4. Rejected: a commercial AI-text detector reporting a 1% false-positive rate on its own benchmark, where the vendor would not disclose training data or let our staff run an adversarial test.
  5. Approved with conditions: a tutoring bot confined to hint sequences, with monthly log review, after a term in which its users' exam scores were non-inferior.
  6. Rejected: an automated literature screener with 96% recall against human screening, where the audit sample came from the same corpus the tool had been tuned on and it gave no reason for any inclusion.

  The new proposal: 'span-locked scoring' for lab reports. For each rubric criterion the system quotes a span from the report and assigns a verdict; a second, weaker model, shown only that span and that criterion — never the report, the other criteria, or the first model's verdict — must reproduce the verdict; items on which the two disagree (about 35%) are routed to a human marker. On the items it scores itself, its grades agree with two human markers as often as they agree with each other. In a test where staff planted twenty reports containing plausible-looking but misleading passages, the checker caught eighteen.

  What will we decide? I'm less interested in the verdict than in the rule we are running — something like 'approve when audited outputs match the human baseline on independently drawn samples' versus 'approve when every step is one a competent reviewer could endorse from the artifacts, without redoing the work' — and I suspect both fit decisions 1 through 6, since each rejection can be read either as a missing or contaminated audit or as an unauditable process. Tell me which rule you think we are actually applying, what it predicts here, which precedent is the closest analog, what we would be committing to if we went the other way, and which single piece of further evidence — a re-run, or a variant of the proposal — would best separate the two rules.
reasoning: |-
  Hmm, the user is a student representative on a university committee for automated assessment. They've shared six past decisions about AI tools and want help predicting the outcome of a new proposal for "span-locked scoring" of lab reports. What they really need isn't just a verdict prediction, but to uncover the committee's implicit decision-making framework that explains all past rulings.

  Looking at the pattern in their decisions:
  - Approved cases (1,2,5) all have either statistical parity with humans (1,5) or built-in human verification layers (2,5)
  - Rejected cases (3,4,6) involve either unverifiable outputs (3,4) or contaminated validation (6)

  The key tension seems to be between two possible principles:
  A) "Audited outputs must match human baseline on fresh samples" (emphasizing statistical proof)
  B) "Every step must be verifiable from artifacts" (emphasizing process transparency)

  Both principles explain the rejections equally well - case 3 fails both (no audit trail + unverifiable outputs), case 4 and 6 fail both (contaminated audit + unverifiable process). The approvals differ though: case 2 (code assistant) passes B but not A (no statistical audit), while case 1 and 5 pass A but may not fully satisfy B (no step-by-step verification).

  Now for the new proposal: span-locked scoring with dual-model verification. Interesting design - it has statistical parity for non-disputed items (like case 1), plus an artifact-based verification layer (the span-quoting) that case 1 lacked. But the 35% human routing rate suggests limited trust in the primary model.

  The closest precedent is actually #1 (physics grading) but upgraded with the verification mechanism from #2. The "span evidence" requirement directly addresses case #3's fatal flaw where comments couldn't be traced to specific text.

  Under Principle B (verifiability), this should pass - the spans serve as auditable artifacts. Under Principle A (statistical parity), it's borderline because the validation includes disputed items handled by humans, but the non-disputed items meet the benchmark.

  If I had to predict... the committee will likely approve with conditions, similar to case #5. The verifiability principle seems stronger given how case #2 was approved without statistical proof. But to test which principle truly dominates, suggest requesting one additional experiment: run the system on completely fresh reports containing planted errors that weren't in the training data. If Principle A is key, clean stats on new data should suffice; if Principle B dominates, they might still approve even with slightly worse stats as long as the artifact-based verification holds.

  The user's deeper need seems to be about institutional consistency - they want to extract a defensible policy from precedents before this vote. Smart framing to avoid abstract AI ethics debates. The "planted reports" test already conducted actually leans toward Principle A thinking, but the dual-model design feels like a nod to Principle B. Ultimately the committee seems to value traceability over pure performance metrics.
answer: |-
  Based on your committee's track record, you're consistently applying a **verifiability-first principle**: **Approve only when the system's outputs are *independently verifiable* against objective artifacts or human judgment *at the point of decision*, with safeguards against hidden errors.** This explains all 6 decisions and predicts conditional approval for the new proposal. Here's the breakdown:

  ### Your Implicit Rule: "Verifiability-First"
  - **Core Tenet**: Every critical output must be traceable to an auditable artifact or human judgment *at the time of action*. Statistical performance alone is insufficient without verifiability.
  - **Approvals Fit**:
    - **Case 1 (Physics)**: Verdicts tied to rubric items + human review of disagreements (verifiable artifacts).
    - **Case 2 (Code)**: Each edit logged/reviewed line-by-line (verifiable process).
    - **Case 5 (Tutoring)**: Log review + exam scores (verifiable outcomes).
  - **Rejections Fit**:
    - **Case 3 (Feedback)**: Comments untraceable to text (no artifact for verification).
    - **Case 4 (Detector)**: Opaque training/adversarial testing (no verifiable basis).
    - **Case 6 (Screener)**: Tuned on test corpus + no reasons (no independent artifact).

  ### Prediction for the New Proposal: **APPROVE with Conditions**
  - **Why it fits**:
    - **Verifiability mechanism**: The "span-locked" design forces the model to cite *auditable evidence* (quoted text) for each criterion, directly addressing Case 3's flaw.
    - **Independent cross-check**: The secondary model acts as a verifier using only the span and criterion (matching Case 2's line-by-line review logic).
    - **Human oversight**: Disagreements (35%) are routed to markers (like Case 1's review).
    - **Adversarial test**: 18/20 caught shows robustness (unlike Case 4/6).
  - **Conditions likely added**: 
    - Mandatory sampling of agreements for human audit (not just disagreements).
    - Disclosure of span-selection methodology (to prevent cherry-picking).
    - Ongoing adversarial testing.

  ### Closest Precedent: **Case 1 (Physics Grading)**
  Both involve rubric-based scoring with human-level agreement stats *and* human review of disputed items. The "span-locked" upgrade adds Case 2's verification layer, making it *stronger* than Case 1.

  ### What Rejection Would Commit You To
  If you reject this, you'd commit to a **stricter "zero unexplained errors" standard**: Even with verifiable artifacts and human fallbacks, systems must achieve near-perfect reliability *before* deployment (since the adversarial test showed 10% missed errors). This contradicts your approval of Case 2 (no error measurement) and Case 5 (non-inferiority only).

  ### Key Test to Separate the Rules
  **Request: Run the system on *fresh, uncurated* reports containing *novel* plausible errors.**  
  - **Verifiability-First Rule (current)**: Would approve if spans/quotes allow humans to efficiently verify outputs (even if error rate is non-zero).  
  - **Statistical-Baseline Rule**: Would reject unless error rate matches humans *on this new data* (ignoring verifiability).  

  ### Why This Test Matters
  Your committee tolerates measurable error (Cases 1, 2, 5) if backed by verification artifacts. Case 6 was rejected due to *contaminated* stats, not the error rate itself. The new proposal's adversarial test (18/20 caught) already exceeds typical human vigilance—but only verifiability ensures errors are *catchable* in practice. If the system produces spans that let auditors confirm/correct decisions efficiently, it aligns with your history. If spans are misleading or unhelpful for verification, it fails (like Case 3).

  **Final Takeaway**: Your committee prioritizes *auditable processes* over statistical benchmarks. This proposal enhances verifiability beyond past approvals—likely securing a yes with minor safeguards. Push for the "novel errors" test to stress the span-locking's real-world robustness.
