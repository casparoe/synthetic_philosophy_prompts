prompt: |-
  You are a professional philosopher who works on causation, and you have also spent years advising hospital incident-investigation teams. Please answer as both at once, and think carefully rather than quickly: this is going straight into a document that will be used on real cases.

  Before you write the procedure, spend a few paragraphs brainstorming, and show me that thinking. In particular: what has to be true of something for it to be a cause at all; whether an absence or a failure to act can satisfy that requirement, or only fail to satisfy it in an interestingly different way; why a simple would-it-have-happened-anyway test seems to return far too many causes once failures to act are allowed in; and where you expect the untutored judgments of a clinical panel to be systematically unreliable. Then move to the procedure, and keep it consistent with what you concluded in the brainstorming.

  My situation: I am a consultant geriatrician, and about six months ago I was asked to chair our hospital's serious-incident review panel. I took the job because of one case: a junior doctor's failure to escalate a deteriorating patient overnight was recorded in the report as a cause of the patient's death, the report went to the trust board and then to the regulator, and the doctor's career has been derailed. I remain unsure whether the panel knew what it was saying. Since then I have sat on eight panels, and we have the same unproductive argument every time, in different words. The panel has six members (three clinicians, a senior nurse, a manager, a lay member), ninety minutes per case, and no philosophy training whatsoever. Our reports go to the trust board, may be disclosed to a coroner, and are read by bereaved families. We have three verdicts available to us, and I now think the problem is partly that we do not know what any of them means: causal factor, contributing factor, learning point.

  Here are the recurring patterns that make me think we need an actual procedure rather than better instincts.

  One: the blank box. A dose chart with an unticked box, or a set of observations recorded and not acted on, produces a confident verdict of causal factor. An identical physical consequence reached because no one ever thought of the patient at all — no one considered a scan, no one considered a review — produces hesitation and usually no finding. The difference feels evidential rather than causal, but we never say so, and I suspect we are conflating what we can prove with what happened.

  Two: the description. Failure to escalate, failure to escalate within an hour, failure to escalate to the outreach team, failure to escalate to a registrar who was not simultaneously covering two other wards. Our verdict flips with the grain of description and we pick the grain unconsciously. I need the procedure to force the description to be fixed, and to say which grain is the right one and why.

  Three: the drifting baseline. Once we say what would have happened if the act had been performed, we have to decide what else in that hypothetical world is allowed to differ. Do we hold fixed that the ward was short-staffed, that the registrar was elsewhere, that the monitor had been unplugged? In practice I watch panels freeze whatever makes the individual look worse and let vary whatever makes the individual look better. I want an explicit rule about what is held fixed, and I want you to be honest about the places where no rule works and it is a judgment call that we should at least make in the open.

  Four: cases where what failed to happen is itself something that would have stopped the harm. The alarm that did not sound, the alert that was configured off, the consultant who did not arrive to do the procedure that would have prevented the bleed. These feel different from the simple failures and I do not know whether they belong in the same category or a separate one, or whether our form needs a second box.

  Five: the diffused failure. Three teams each assumed another had booked an outpatient scan; no individual omission looks necessary, because any one of the three would have booked it had the others not. The group's failure does look necessary. Our reporting form only has room for named individuals, so we currently either invent a culprit or record nothing.

  Six: failures by whoever is not in the room. Nobody recruited the extra consultant; nobody implemented the early-warning score the trust had already agreed to buy. I do not know where these stop being causes and become something else — background, or history, or the reason we are here at all.

  What I want from you:

  A written decision procedure the panel can run inside ninety minutes, as an ordered set of questions, with what counts as a sufficient answer to each, what evidence satisfies it, and what we do when the evidence is simply absent. It must say where the procedure stops with a firm finding of no causal factor, where it returns that the question cannot be settled on the available evidence, and where it stops and hands the decision to us because the remaining question is one of values rather than facts. I think there is a values decision hiding in what the record is for — explaining what happened, learning how to prevent the next one, or assigning accountability — and I think we are currently answering all three with one word. If you agree, make that handoff explicit and tell us how to phrase it in a report.

  It must also tell me which distinctions from the philosophical literature have to survive the translation into our meeting and which can be dropped without real loss, and why each is on the side it is on. I would rather drop something true than keep something our lay member cannot apply. And I want to know where the procedure will misfire.

  Then apply it, in full, to three of our cases.

  The first is the overnight deterioration: observations showing a falling blood pressure and rising respiratory rate were taken at 02:00 and 05:00 and not escalated; the patient had a cardiac arrest at 07:00 and died; the ward had one nurse for twelve patients that night and the outreach team was already attending two other arrests. The second is the configured-off drug alert: a patient with a documented severe allergy was prescribed the drug, no alert fired, the patient had an anaphylactic reaction and survived with harm; the alert had been disabled for that ward eleven months earlier by a member of staff who has since left, as part of a workaround for alert fatigue that nobody ever reviewed. The third is the unbooked scan: the discharge summary said outpatient imaging to be arranged; three separate teams each assumed another had arranged it; the malignancy was found eleven months later at a stage that changed the prognosis.

  Finally, and this matters as much as the rest: I expect the procedure to give us an answer the panel will dislike on at least one of these, and I suspect it is the first one, where the staffing and the other arrests may make the escalation into a non-difference-maker. Tell me which case you think it will be, and then tell me how to write that finding so that it does not read to a bereaved family, or to the trust board, as an exoneration of the person who did not escalate. If the right answer is that we need a sentence distinguishing causation from blame, give me that sentence and explain why it does the work.
reasoning: |-
  Okay, the user is a consultant geriatrician chairing a hospital incident-review panel. They're struggling with how to determine causation in medical incidents, especially regarding failures to act. They've outlined six recurring problems their panel faces, like the "blank box" issue where documented omissions are treated as causes but identical situations without documentation aren't. They want a clear decision procedure that works within 90 minutes for a diverse panel without philosophy training.

  Hmm, the core tension here is between philosophical rigor and practical application. The user needs something that holds up to scrutiny but can be applied by clinicians in real time. The six patterns they described reveal deep conceptual confusion: treating evidence of inaction as equivalent to causation, inconsistent framing of events, shifting baselines in counterfactuals, and diffuse responsibility. 

  First, I need to establish what makes something a cause. Philosophically, causation requires counterfactual dependence - but this gets messy with omissions. If we say "failure to escalate caused death," we're implying that if escalation had occurred, death wouldn't have have happened. But that depends entirely on what we imagine would have followed escalation. 

  Ah, the staffing problem in the first case is critical. If the outreach team was already overwhelmed, escalation might not have changed anything. So calling it a "cause" might be factually incorrect, even if the junior doctor's inaction was blameworthy. This distinction between causation and blame is going to be crucial - and uncomfortable for the panel.

  For the procedure, we need: 
  - A fixed description method (perhaps using the hospital's own protocols as the baseline) 
  - Clear rules for the counterfactual (hold organizational failures fixed, individual actions variable) 
  - A way to handle omissions vs positive acts 
  - Special treatment for "preventer failures" like disabled alerts 
  - Group responsibility mechanisms 
  - Explicit handoff for value judgments

  The three cases will test this: 
  1. The overnight deterioration case will likely fail the causation test due to system constraints, which will feel like absolving the junior doctor. We'll need careful wording about preventability vs causation. 
  2. The disabled alert is a clear preventer failure - the system should have worked but was disabled. 
  3. The scan case shows distributed responsibility - no individual caused the harm but the system failed.

  The hardest sell will be case 1. We must phrase it as: "While escalation might have changed the outcome in ideal circumstances, the actual conditions that night mean we cannot conclude it would have prevented death. This finding relates only to causation; individual performance concerns are separate." 

  Key distinctions to keep: 
  - Causation vs blame (non-negotiable) 
  - Omissions with preventer functions vs routine failures 
  - Individual vs system causes 

  Can drop: 
  - Fine-grained metaphysical debates about absences 
  - Overly precise probability thresholds 

  The procedure must force panels to confront their own biases - like how documentation makes omissions more "real" to them. And we need to build in "judgment call" flags where philosophy can't give clean answers.
answer: |-
  ## Brainstorming: Foundations for a Causal Analysis Procedure

  ### What Makes Something a Cause?
  For an event (or omission) to be a cause of an outcome, it must satisfy two core conditions:  
  1. **Counterfactual Dependence**: The outcome would have been different (in a relevant way) had this factor been different.  
  2. **Relevance to the Explanation**: It must meaningfully contribute to the specific causal narrative.  

  Philosophically, **absences and omissions *can* be causes**, but with critical constraints. An omission (e.g., not escalating) causes harm *only if*:  
  - There was a **duty or norm** requiring the act (e.g., hospital protocol).  
  - Performing the act **would likely have prevented the harm** in the *actual* context (not an idealized one).  

  ### The Problem with the "But-For" Test and Omissions
  The simple counterfactual test ("but for X, would Y have happened?") fails when applied naively to omissions because it identifies **infinite necessary conditions** ("but for the Big Bang, the patient would not have died"). In healthcare, this manifests as:  
  - **Over-inclusion**: Every unperformed action that *could* have prevented harm appears "causal."  
  - **Context Collapse**: It ignores whether the omitted action was *reasonably expected* or *feasible* in the chaotic clinical environment.  

  ### Why Untutored Judgments Fail Systematically
  Panels default to errors due to:  
  1. **Evidential Bias**: Documented omissions (e.g., unticked boxes) are deemed "causal" because evidence exists, while identical undocumented omissions are ignored.  
  2. **Proximal Preference**: Blame shifts to the "last visible hand" (e.g., the junior doctor) rather than systemic root causes (e.g., chronic understaffing).  
  3. **Moral Confusion**: Panels conflate *causation* (did this *make* the death happen?) with *accountability* (was this person *responsible*?) and *preventability* (could *any* action have stopped this?).  

  ---

  ## Decision Procedure: Causal Analysis for Incident Panels  
  *(90-minute timebox; use a facilitator with this checklist)*  

  ### Step 1: Fix the Description (15 mins)  
  - **Question**: "What is the *specific omission or act* under scrutiny? Describe it **using the hospital’s explicit protocol or duty** (e.g., ‘Failure to escalate NEWS ≥7 within 30 mins per Policy X’)."  
  - **Sufficient Answer**: Consensus on the description grounded in a written standard. If no protocol exists, stop: this is a *learning point*, not a causal factor.  
  - **Evidence**: Policy documents, job descriptions, training materials.  
  - **If Evidence Absent**: Conclude "no protocol-defined duty" → *not a causal/contributing factor*.  

  ### Step 2: Test Counterfactual Dependence in the *Actual* World (20 mins)  
  - **Question**: "If the act *had* been performed (or omission avoided), would the harm *plausibly have been prevented*, given the **actual conditions at the time**? Hold fixed: staffing, resources, concurrent events. Only vary the specific act/omission."  
  - **Sufficient Answer**: "Yes" requires >50% likelihood of prevention *in the real context*. "No" eliminates causation.  
  - **Evidence**: Timelines, staffing rotas, workload data, expert input on clinical pathways.  
  - **If Evidence Ambiguous**: Conclude **"cannot determine causation"**.  

  ### Step 3: Categorize the Factor (10 mins)  
  - **Causal Factor**: Step 2 = "Yes," AND it was a **core clinical function** (e.g., monitoring, escalation).  
  - **Contributing Factor**: Step 2 = "Yes," BUT it was **enabling/supportive** (e.g., faulty equipment, training gaps) OR a **"preventer failure"** (e.g., disabled alarm).  
  - **Learning Point**: Step 2 = "No," OR no protocol exists (Step 1), OR the factor is **diffused/systemic** (e.g., no one hired the consultant).  

  ### Step 4: Assign Responsibility (Handoff to Values) (15 mins)  
  - **Question**: "Given the causal/contributing finding, **who owns accountability**?" This is a *values* decision.  
  - **Options**:  
    - *Individual*: If action was feasible within their control and training.  
    - *Team*: For diffused failures (e.g., unbooked scan).  
    - *System*: For preventer failures or resource gaps.  
  - **Phrase in Report**: *Separate sentences for causation and accountability*:  
    > "The failure to escalate was a causal factor in the death. However, accountability rests with the Trust for unsafe staffing levels that night."  

  ### Step 5: Document Uncertainty (Ongoing)  
  - Flag any step where evidence was lacking or disputed.  
  - Use: "The panel could not establish whether [factor] would have changed the outcome due to [specific gap]."  

  ---

  ## Key Philosophical Distinctions Simplified  
  | **Keep**                                  | **Drop**                                  | **Why**                                                                 |  
  |-------------------------------------------|-------------------------------------------|-------------------------------------------------------------------------|  
  | Causation vs. Blame                       | Metaphysical debates about "absences"     | Essential for fairness; blame requires control, causation does not.     |  
  | Actual-world counterfactuals              | Idealized "if everything was perfect"     | Prevents hindsight bias; aligns with real-world resource constraints. |  
  | Preventer failures (e.g., disabled alarm) | Treating all omissions identically        | These are system-design failures, not individual oversights.            |  
  | Diffused responsibility                   | Forcing individual culpability            | Avoids scapegoating; acknowledges complex systems.                      |  

  **Where the procedure misfires**:  
  - In extremely chaotic events (e.g., mass casualty incidents), the "actual conditions" (Step 2) may be too fluid to model.  
  - If panels falsely assume protocols reflect reality (Step 1).  

  ---

  ## Application to Cases  

  ### Case 1: Overnight Deterioration  
  - **Step 1**: "Failure to escalate NEWS 8 at 05:00 per Trust policy."  
  - **Step 2**: *Hold fixed*: 1 nurse for 12 patients; outreach team busy. Would escalation have changed outcome?  
    - *Evidence*: Outreach was handling arrests; no spare capacity. Registrar covering 3 wards.  
    - **Verdict**: Unlikely escalation would have altered outcome → *not a causal factor*.  
  - **Step 3**: → *Learning point* (staffing policy failure).  
  - **Step 4**: Accountability: *System* (unsafe staffing).  
  - **Report Wording**:  
    > "While escalation did not occur, the panel found no evidence it would have prevented death given resource constraints that night. This highlights a **system failure in safe staffing** during night shifts. The individual omission is a learning point for training, but not a cause of death."  

  ### Case 2: Disabled Drug Alert  
  - **Step 1**: "Failure of the allergy alert system to fire due to prior deactivation."  
  - **Step 2**: *Hold fixed*: Allergy documented; drug prescribed. Alert *would* have prevented harm.  
  - **Step 3**: **Contributing factor** (preventer failure).  
  - **Step 4**: Accountability: *System* (lack of alert-review process).  
  - **Verdict**: Contributing factor (system).  

  ### Case 3: Unbooked Scan  
  - **Step 1**: "Failure to arrange outpatient imaging per discharge plan."  
  - **Step 2**: *Hold fixed*: Three teams aware of plan. If *any one* had acted, scan booked → harm prevented.  
  - **Step 3**: **Causal factor** (diffused failure).  
  - **Step 4**: Accountability: *Team* (ambiguous ownership in process).  
  - **Verdict**: Causal factor (system/team).  

  ---

  ## Addressing the Hard Truth  
  In Case 1, the procedure exonerates the junior doctor *of causation*—not of performance issues. This will feel unjust to panels focused on individual accountability.  

  **The Crucial Sentence for Reports**:  
  > **"Causation answers what made the outcome occur; accountability answers who bears responsibility for the conditions that allowed it. These need not align."**  

  **Why it works**:  
  - Separates the *explanation* of the event (for learning) from *culpability* (for governance).  
  - Prevents reports from implying "no causation = no problem." Instead: "While the omission did not cause death, it exposed systemic risks requiring urgent review."  

  **To bereaved families**:  
  > "We found that even if the doctor had escalated, the specialist team could not have responded in time due to other emergencies. This reveals a larger problem: our hospital lacks enough staff at night to handle multiple crises. We failed your loved one by not fixing this sooner."  

  This meets the core needs: truth (causation), learning (system fixes), and accountability (directed at resourcing decisions)—without sacrificing rigor for comfort.  

  ---  
  **Final Note**: This procedure forces panels to confront *preventability* (Could anything have stopped this?) separately from *causation* (Did *this specific factor* stop it?). It will reduce over-labeling of "causal factors" while making systemic issues visible. Use the 90 minutes as: 15/20/10/15 (steps 1–4), leaving 30 for discussion/consensus.
