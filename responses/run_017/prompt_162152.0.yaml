answer: |-
  **Bottom line: Your ledger view fatally ignores that standing requires *present* normative competence and alignment with the norm, not just a clean *past* record via accountability; the commitment objection is decisive, and the "reformed but resentful" case proves it.**

  ### Fatal Defeater: The Commitment/Objection Mismatch & The "Reformed But Resentful" Case
  1.  **The Core Failure:** Your view reduces standing to a procedural ledger ("debt paid, record clear"). But standing fundamentally concerns whether *you currently inhabit the normative position* to hold another accountable *as a fellow participant* bound by the norm. The "lucky abstainer" exposes this: they lack the *lived commitment* to the norm (they know they'd violate it), making their blame hollow *even with a clean record*. They cannot genuinely appeal to shared values they wouldn't uphold.
  2.  **The Killer Case - Reformed but Resentful:** Imagine a former embezzler who was caught, publicly shamed, served prison time, repaid the money (satisfies a-d), and now loudly blames a colleague for a similar offense. However, it's widely known (and true) that they are *bitter* about their punishment, believe the norm was unfairly harsh on *them* ("I was unlucky to get caught"), and privately think the colleague was "just doing what anyone would." They've cleared the ledger procedurally, but their blame lacks *moral authority*. They don't *endorse* the norm's legitimacy *for themselves* anymore; they are weaponizing it *against others*. Intuition screams they lack standing. Your ledger view grants it; a commitment view correctly denies it. The resentment reveals a lack of *current*, *sincere* commitment to the norm as binding *on all*, including themselves. The ledger is settled, but their *relationship to the norm itself* is corrupted.

  ### Other Significant Problems (Fatal to Awkward)
  3.  **Fatal: Insulation via "Evidential Route" is Ad Hoc & Unfalsifiable:** Dismissing *every* counterexample as "just undermining credibility" makes the ledger view empirically unfalsifiable and analytically empty. It becomes a tautology: "Hypocrisy only undermines standing when it makes blame non-credible, and anything that makes blame seem illegitimate must be making it non-credible." This shields the core claim from counter-evidence *by definition*. For a normative claim about ethics, this is fatal – it removes explanatory power.
  4.  **Fatal: Collapse into Rivals:** Your view *does* collapse into "hypocrisy never *directly* costs standing," making "standing" merely a function of effective communication (credibility). This abandons the core *normative* intuition underlying standing critiques – that the hypocrite is *positionally* disabled, not just bad at persuading. It also struggles to distinguish itself *in practice* from a purely relational view, as the ledger-clearing acts (confession, sanction) are primarily *relational repairs* aimed at restoring trust and mutual recognition.
  5.  **Serious Problem: Clash with Neighbouring Norms - Forgiveness & Authority:**
      *   **Forgiveness/Apology:** Your view suggests full ledger-clearing *restores* the moral relationship completely, making standing "back in full." But forgiveness is often *not* automatic upon apology/sanction. The wronged party may forgive the *past act* but still reasonably distrust the *person's character* or *current commitment* to the norm. This residual distrust directly undermines the *wrongdoer's standing to blame the original victim or others* for similar wrongs. If I forgive your theft after repayment, I may still reasonably reject *your* condemnation of *my* (hypothetical) theft – your past breach, even addressed, casts doubt on your *sincere* commitment to property rights *now*. Your ledger view misses this ongoing character/competence deficit.
      *   **Legitimate Authority:** A judge who was punished for corruption may regain *legal* standing to sentence others via procedural clearance. But do they regain *full moral* standing in the community to condemn corruption? Intuition often says no; their past violation permanently taints their moral authority *as an exemplar or enforcer of that specific norm*, even if legally reinstated. The ledger view struggles to explain this persistent moral deficit.
  6.  **Awkward Concession: The "Lucky Abstainer" is a Cost:** You rightly identify this as a counterintuitive prediction you're stuck with. A defender of your view must bite this bullet: "Yes, the coward who never faced temptation has as much standing as the saint. Standing is about your *record*, not your hypothetical virtue or vice." This requires dismissing strong intuitions that blame from someone known to lack commitment rings profoundly hollow *regardless of their clean slate*. This concession significantly weakens the view's intuitive appeal.
  7.  **Awkward: Which Clause? (c) is Crucial, but Insufficient:** Clause (c) (lack of sanction/acknowledgement *to N*) is doing heavy lifting by introducing the relational/evidential element. However, the "Reformed but Resentful" case satisfies (c) but still lacks standing, showing (c) is necessary but not sufficient. Clauses (a) and (d) define the scope of *potential* ledger issues, but the core mechanism relies on (c)'s failure causing credibility loss. The fatal flaw is that (c) only addresses *knowledge of the past*, not the *current normative state* of the blamer.

  ### What Your View Gets Right & Must Keep
  Your view correctly handles the *paradigm cases* you mention (stranger, unrepentant chair, upfront reformed alcoholic) and effectively explains why *secrecy* and *unaddressed violations* destroy standing. Its strength is in diagnosing the *epistemic* barrier hypocrisy creates. **The fatal error is concluding that *removing this epistemic barrier* (via ledger-clearing) is *sufficient* to restore full standing, ignoring the potential *normative/competence deficit* that lingers or exists independently (as in the Lucky Abstainer).**

  **What Should Move You:** The "Reformed but Resentful" case is specifically designed to bypass the evidential route. The ledger *is* clear (a-d satisfied), the blame *is* credible in the sense that they *are* invoking the norm, yet the blame feels illegitimate because the blamer lacks sincere, current commitment to the norm's authority over *their own* conduct. This isn't "dislike"; it's recognizing they lack the *moral position* to hold others accountable. Your feeling that the resentful blamer shouldn't blame *is* tracking standing – specifically, their deficit in genuine normative competence and alignment.
