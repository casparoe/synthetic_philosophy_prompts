answer: |-
  **MEMORANDUM**  
  **TO:** Northwold Heritage Trust Board  
  **FROM:** [Your Name/Board Member]  
  **DATE:** [Current Date]  
  **SUBJECT:** Final Recommendations for Merebank Interpretation Panels & Policy  

  ### 1. **Panel Text Recommendations**  
  **Revised Text for Pit 1:**  
  > *"This pit held 34 iron tools — including axeheads, sickles, and specialised implements — alongside cattle jaws and pig bones. The objects were carefully layered, deliberately bent or broken, and included three miniature tools too small for practical use. While their purpose remains debated, the arrangement suggests a series of significant acts over time, perhaps marking events, honouring traditions, or connecting with spiritual forces. The mix of worn tools and symbolic miniatures hints at meanings beyond everyday life."*  

  **Revised Text for Pit 2:**  
  > *"30 metres away, this pit contained similar iron objects but jumbled with animal butchery waste and a broken quern stone. Unlike Pit 1, there is no layering or deliberate damage. This may reflect routine disposal of damaged tools and food debris — though its proximity to Pit 1 raises questions about a possible link between the two."*  

  **Why this works:**  
  - Avoids declaring "ritual" or "temple" but doesn’t reduce the site to "just farming."  
  - Uses active language (*"significant acts," "honouring traditions"*) to acknowledge intentionality without over-interpretation.  
  - Contrasts Pit 1’s structured deposition with Pit 2’s disorder visually.  
  - Leaves room for visitor curiosity ("*debated,*" "*raises questions*").  

  ---

  ### 2. **Reconstruction Drawing: Kill the Shrine, Replace with Evidence-Based Scene**  
  - **Recommendation:** **Cancel the thatched shrine reconstruction.** It imposes an unsupported narrative (a temple with an idol) that exceeds our evidence.  
  - **Replacement:** Commission a new drawing showing:  
    - **Pit 1:** Focus on deposition process — figures carefully placing layered tools/bones, bending objects, holding miniatures.  
    - **Pit 2:** Figures discarding tools amid butchery debris, highlighting contrast.  
    - **Background:** Minimal river/terrace landscape; no built structures unless as faint speculative outlines.  
  **Rationale:**  
    - Addresses the "religious dimension" by depicting intentional action (Pit 1), without inventing shrines.  
    - Honors community interest in significance while adhering to evidence.  
    - Shows tools as central — aligning with finds specialist’s caution.  

  ---

  ### 3. **Standing Policy: Confidence Ratings Are a Trap; Adopt an "Evidence Threshold" Framework**  
  - **Recommendation:** **Reject confidence ratings.** They confuse visitors and let vague claims persist ("*Low confidence: temple?*" still plants the idea).  
  - **Adopt this policy instead:**  
    > *"Interpretive claims must meet one of two thresholds:*  
    > **A) High Evidence:** *Supported by multiple lines of evidence (e.g., inscriptions, repeated patterns across sites).*  
    > **B) Speculative Scenario:** *Presented only as ‘possible’ or ‘suggested,’ grounded in direct site evidence (e.g., ‘The careful arrangement *suggests* symbolic acts’). Unsupported speculation (e.g., ‘shrine,’ ‘deity’) is excluded."*  
  **Rationale:**  
    - Forces clarity: either justify claims robustly or present them tentatively *with evidence anchors*.  
    - Prevents "ritual" as a default label (per finds specialist’s critique).  
    - Empowers community input early by requiring plausible evidence-ties for speculative ideas.  

  ---

  ### Timeline & Implementation  
  - **T+0 Days (Today):** Circulate this memo for Tuesday’s vote.  
  - **T+2 Days (Post-Meeting):**  
    - Finalize panel text with archaeologist/community officer input (2 days max).  
    - Brief designer on replacement reconstruction drawing (Pit 1/Pit 2 deposition scenes).  
  - **T+7 Days:** Draft revised panel layout to designer.  
  - **T+14 Days:** Sign off on artwork.  
  - **T+4 Weeks:** Draft "Evidence Threshold" policy for broader board consultation (post-Merebank deadline).  

  ### Why This Approach Balances Concerns  
  - **For "temple" advocates:** The Pit 1 text/drawing takes intentionality seriously ("*significant acts,*" "*spiritual forces*") and depicts ceremony. Rejects *deflation* by naming symbolic possibilities.  
  - **For finds specialist:** Drops "ritual" label, focuses on observable actions (bending, layering), and excludes unsupported shrine claims.  
  - **For community/schools:** Avoids "we don’t know" apathy; invites engagement with mystery while respecting evidence.  

  **Recommended Vote:** Approve revised text/drawing and Evidence Threshold policy framework.  

  ---  
  **Endorsed by:** [Your Name]  
  **Feedback Deadline:** Tuesday meeting.
