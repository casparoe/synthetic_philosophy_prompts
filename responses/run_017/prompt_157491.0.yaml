prompt: |-
  I'm writing a short piece for policy staff who commission studies and evaluations, and who mostly assume that if a report would substantially change what they believe, commissioning it is worth it. I want one case that pries apart how much a signal tells you from how much the signal is worth.

  Construct a single ordinary decision problem — a hiring decision, a treatment choice, a procurement, your pick; no thought-experiment machinery and no perfect predictors, though a realistically imperfect test with known error rates is fine — and give it twice. In the first version the signal moves the agent's credence a long way, from roughly even odds to near-certainty either way, and is nevertheless worth exactly zero: expected utility conditional on receiving it equals expected utility without it, so the non-negativity that Good's theorem guarantees holds as an equality rather than an improvement. In the second version the same signal, with the same priors, the same likelihoods and the same utility function, is worth strictly more than zero. The two versions may differ in exactly one structural feature, which you have to name, and it cannot be the informativeness of the signal, the priors, the likelihoods, or the payoffs. Give the numbers and the expected-value calculations for both, so that it is visible that the belief change is identical while the verdict is not.

  Then say which feature is carrying the case and what happens to the second version without it, and give the strongest defense of the worthless signal in the first version — value for decisions not yet foreseen, epistemic value, and so on — along with your reply to it. Finally, my readers will point out that the theorem only ever says information cannot hurt in expectation: is a third version available, in which the same signal, private and free, has strictly negative value for an agent who still updates by conditionalization and still maximizes expected utility? If not, say which assumption has to be given up and what conceding it costs.
reasoning: |-
  We are going to construct a decision problem in two versions. The decision problem is about whether to treat a disease. The agent must decide whether to administer a treatment to a patient. The treatment has a cost if the patient does not have the disease, but it is beneficial if the patient does.

  We'll use the following:

  - States of the world:
      - D: the patient has the disease (prior probability p)
      - ~D: the patient does not have the disease (prior probability 1-p)

  - Actions:
      - Treat: administer the treatment
      - Not treat: do nothing

  - Utilities (we'll set up a simple structure):
      - If the patient has the disease and we treat: we get a benefit of B (utility = B)
      - If the patient has the disease and we do not treat: we get a loss (utility = -L, because the disease causes harm)
      - If the patient does not have the disease and we treat: we get a cost (utility = -C, because of side effects or cost of treatment)
      - If the patient does not have the disease and we do not treat: utility = 0

  We assume B, L, C > 0.

  Without any test, the expected utility of treating is: 
      EU(Treat) = p * B + (1-p) * (-C)
  The expected utility of not treating is:
      EU(Not) = p * (-L) + (1-p) * 0 = -p*L

  So the agent will choose Treat if EU(Treat) > EU(Not), i.e., 
      p*B - (1-p)*C > -p*L
      => p*B - C + p*C > -p*L
      => p(B + C + L) > C

  Now, we introduce a test. The test has two outcomes: Positive (T+) or Negative (T-). We know the likelihoods:

      Sensitivity: P(T+ | D) = Se
      Specificity: P(T- | ~D) = Sp

  Therefore:
      P(T- | D) = 1 - Se (false negative rate)
      P(T+ | ~D) = 1 - Sp (false positive rate)

  We'll design two versions of the problem that differ in exactly one structural feature: the availability of an alternative action that becomes relevant only in the second version. Specifically, we'll introduce a third action in the second version: a "safeguard" action that can be taken only if the test result is negative. However, to keep the problem as similar as possible, we might instead adjust the decision tree. Alternatively, we can change the set of available actions conditionally on the test result? But the problem says the two versions may differ in exactly one structural feature that is not the priors, likelihoods, or payoffs.

  Another idea: in the first version, the decision must be made without the test and then we consider the value of the test. But we are to have the same decision problem and then give it twice with one structural difference. We can change the consequences of the actions in a way that doesn't alter the payoffs directly but changes the structure of the decision tree? Or we can change the timing?

  Alternatively, we can introduce a third state of the world? But that might complicate the update.

  Let me propose a different approach: the structural feature we change is the irreversibility of the decision. In the first version, the decision must be made immediately and is irreversible. In the second version, the decision can be delayed until after the test result, but there is a cost to delaying (which we set to zero in the second version to isolate the effect of the test). However, the problem says the signal is free and private, so we don't have a cost of delay. 

  But note: the problem says the signal is free, so we can assume that the test comes at no cost and the result is immediately available.

  Instead, we can change the set of actions available after the test. Specifically:

  Version 1: The agent must choose an action before seeing the test result? But that would make the test irrelevant. Alternatively, we can have that the agent can condition on the test result, but in version 1, the treatment decision is the only one, and in version 2, there is an additional option that becomes available only if the test result is negative? For example, a confirmatory test or a different treatment.

  But the problem requires that the same signal is used in both versions, and the priors, likelihoods, and payoffs are the same. The only difference is a structural feature.

  Let me design the two versions:

  Version 1: The decision is whether to treat or not, and the test result can inform that decision. But we will set the parameters so that the test result, even though it moves the beliefs a lot, does not change the optimal action. Therefore, the expected utility with the test is the same as without.

  Version 2: We add a third action: a "mild treatment" that has lower side effects but also lower effectiveness. We make this mild treatment available only after the test? But the problem says the same utility function and same states. Alternatively, we can have the same actions but in a sequential setting? 

  Actually, we can have the same actions in both versions, but in version 2, the agent has the option to take the test and then decide, and in version 1, the agent also has the same option? Then what is the difference? We need a structural difference.

  Alternatively, we can change the consequences of the actions in a way that doesn't change the payoffs? That doesn't seem possible.

  I have a better idea: the structural feature we change is the possibility of avoiding a catastrophic outcome only if we have the test. Specifically, we introduce a state in which the treatment is extremely harmful, but that state is very rare and independent of the disease state. However, we want the same states of the world. 

  Let me try a different decision: a procurement decision. 

  Decision: whether to buy a machine or not.

  States:
      G: the machine is good (prior p)
      B: the machine is bad (prior 1-p)

  Actions:
      Buy: 
          if G: get a profit of R
          if B: incur a loss of L
      Not buy: 0

  Without test: 
      EU(Buy) = p*R + (1-p)*(-L)
      EU(Not) = 0

  Now, we have a test with known error rates:

      P(T+ | G) = a   [true positive]
      P(T- | G) = 1-a [false negative]
      P(T- | B) = b   [true negative]
      P(T+ | B) = 1-b [false positive]

  We want in version 1: the test moves the beliefs a lot but has zero value. This happens when the test result does not change the optimal action. For that, we need that regardless of the test result, the optimal action is the same. 

  Set parameters so that:

      Without test: the optimal action is Not buy (because EU(Buy) < 0).

      With test:
          After T+: the posterior probability of G is high, but still the EU(Buy | T+) is negative? 
          After T-: the posterior probability of G is low, so EU(Buy | T-) is even more negative.

      Then the agent will choose Not buy regardless of the test. So the test has zero value.

  But we also want the test to move the beliefs a long way. So we set:

      Prior: p is low, so without test we don't buy.
      After T+: posterior of G becomes high (close to 1) but if R is not high enough and L is very large, then even with a high posterior, the expected utility of buying might still be negative.

  Example numbers for version 1:

      p = 0.1 (prior probability the machine is good)
      R = 100
      L = 1000

      Without test:
          EU(Buy) = 0.1*100 + 0.9*(-1000) = 10 - 900 = -890
          EU(Not) = 0
          So we do not buy.

      Now, let the test be very informative:
          Sensitivity (a) = P(T+ | G) = 0.99
          Specificity (b) = P(T- | B) = 0.99

      We want to compute the posterior after T+ and after T-.

      P(T+) = P(T+ | G)*P(G) + P(T+ | B)*P(B) = 0.99*0.1 + (1-0.99)*0.9 = 0.099 + 0.009 = 0.108

      P(G | T+) = P(T+ | G)*P(G) / P(T+) = 0.099 / 0.108 ≈ 0.9167

      Then:
          EU(Buy | T+) = 0.9167*100 + (1-0.9167)*(-1000) ≈ 91.67 - 83.3 = 8.37 (positive? wait, let me recalculate)

      Actually, 1-0.9167 = 0.0833
      So: 0.9167*100 = 91.67
           0.0833*(-1000) = -83.3
          Total: 91.67 - 83.3 = 8.37 > 0

      So after T+, we would buy? Then the test has value.

  We need to adjust so that even after T+, the EU(Buy) is negative. How? Make L larger.

      Let L = 10000

      Without test: EU(Buy) = 0.1*100 + 0.9*(-10000) = 10 - 9000 = -8990 -> not buy.

      With T+:
          P(G | T+) = 0.9167
          EU(Buy | T+) = 0.9167*100 + 0.0833*(-10000) = 91.67 - 833 = -741.33 < 0

      Now, what about T-?
          P(T-) = 1 - P(T+) = 1 - 0.108 = 0.892
          P(G | T-) = P(T- | G)*P(G) / P(T-) = (0.01 * 0.1) / 0.892 = 0.001 / 0.892 ≈ 0.00112
          Then EU(Buy | T-) = 0.00112*100 + (1-0.00112)*(-10000) ≈ 0.112 - 9998.88 = -9998.768

      So after T-, we also do not buy.

      Therefore, regardless of the test result, the agent will choose not to buy. Then the expected utility with the test is 0 (since we end up with not buying in both cases). Without the test, we also get 0. So the value of the test is 0.

      But note: the test moves the belief from 0.1 to 0.9167 (which is a big change) and to 0.00112 (also a big change). However, the decision does not change.

  Now, we need version 2: same prior, same likelihoods, same payoffs (R=100, L=10000) but the test has positive value. How? We change a structural feature. We cannot change the payoffs, priors, or likelihoods. What can we change?

  We change the set of actions: in version 2, the agent has an additional action: "Buy with warranty". This action costs more but if the machine is bad, the loss is avoided. Specifically:

      Action: Buy with warranty: cost W upfront, but then if the machine is good, you get R (so net R - W) and if the machine is bad, you get 0 (because the warranty covers the loss). So:

          If G: utility = R - W
          If B: utility = -W   (because you paid W and then the machine is bad, but the warranty covers the loss so you don't lose L, but you still paid W)

      Without test, we have three actions: 
          Buy: as before
          Buy with warranty: 
              EU(WW) = p*(R-W) + (1-p)*(-W) = p*R - p*W - W + p*W = p*R - W
          Not buy: 0

      We set W such that without test, WW might not be attractive either? But we want the test to become valuable because now after the test result, we might choose WW in some cases.

      We need to set W so that without test, WW is not chosen, but with test, in the positive result we might choose WW.

      Without test:
          EU(Buy) = p*R + (1-p)*(-L) = 0.1*100 - 0.9*10000 = 10 - 9000 = -8990
          EU(WW) = p*R - W = 0.1*100 - W = 10 - W
          EU(Not) = 0

          We want EU(WW) < 0? Then 10 - W < 0 => W>10. Let W=15. Then EU(WW)= -5.

          So without test, the best action is Not buy (0).

      Now, with test:

          After T+:
              P(G|T+) = 0.9167
              EU(Buy | T+) = 0.9167*100 + 0.0833*(-10000) = 91.67 - 833 = -741.33
              EU(WW | T+) = 0.9167*(100-15) + (1-0.9167)*(-15) 
                           = 0.9167*85 + 0.0833*(-15)
                           ≈ 77.9195 - 1.2495 = 76.67
              EU(Not | T+) = 0

              So now we choose WW and get 76.67.

          After T-:
              P(G|T-) ≈ 0.00112
              EU(Buy | T-) = 0.00112*100 + (1-0.00112)*(-10000) ≈ 0.112 - 9998.88 = -9998.768
              EU(WW | T-) = 0.00112*(100-15) + (1-0.00112)*(-15) 
                           = 0.00112*85 + 0.99888*(-15)
                           ≈ 0.0952 - 14.9832 = -14.888
              EU(Not | T-) = 0

              So we still choose Not buy (0).

          Therefore, the expected utility with the test:

              = P(T+)*EU(WW|T+) + P(T-)*EU(Not|T-)
              = 0.108 * 76.67 + 0.892 * 0
              ≈ 0.108 * 76.67 ≈ 8.28

          Without the test, we got 0. So the value of the test is about 8.28.

      But note: the test moves the beliefs in exactly the same way as in version 1. The difference is that in version 2 we have an additional action (Buy with warranty).

      The structural feature that changed is the set of available actions. In version 1, the set of actions was {Buy, Not buy}. In version 2, we added a third action: Buy with warranty.

      This is the difference.

  Now, we present the two versions.

  Version 1:

      States: G (good machine) with prior p=0.1, B (bad machine) with prior 0.9.
      Actions: Buy, Not buy.
      Utilities:
          Buy in G: 100
          Buy in B: -10000
          Not buy: 0

      Test: 
          P(T+|G)=0.99, P(T-|B)=0.99.

      Without test: 
          EU(Buy) = 0.1*100 + 0.9*(-10000) = 10 - 9000 = -8990
          EU(Not) = 0
          So choose Not buy -> utility 0.

      With test:
          We compute:
              P(T+) = 0.1*0.99 + 0.9*0.01 = 0.099+0.009=0.108
              P(T-) = 1-0.108=0.892

              P(G|T+) = 0.099/0.108 ≈ 0.9167
              P(B|T+) = 0.0833
              EU(Buy | T+) = 0.9167*100 + 0.0833*(-10000) ≈ 91.67 - 833 = -741.33 -> so we choose Not buy (0).

              P(G|T-) = (0.1*0.01)/0.892 = 0.001/0.892 ≈ 0.00112
              EU(Buy | T-) = 0.00112*100 + 0.99888*(-10000) ≈ 0.112 - 9988.8 ≈ -9988.69 -> so we choose Not buy (0).

          Therefore, the expected utility with the test is 0 (because we always choose Not buy and get 0).

          The value of the test is 0 - 0 = 0.

  Version 2:

      Same states, same test, same prior, same utilities for Buy and Not buy.
      Additional action: Buy with warranty (WW) with cost W=15.
          In state G: utility = 100 - 15 = 85
          In state B: utility = -15   (because we avoid the loss 10000 by warranty, but we paid 15)

      Without test:
          EU(Buy) = -8990
          EU(WW) = 0.1*85 + 0.9*(-15) = 8.5 - 13.5 = -5
          EU(Not) = 0
          So choose Not buy -> 0.

      With test:
          After T+:
              P(G|T+)=0.9167, P(B|T+)=0.0833
              EU(Buy | T+) = -741.33
              EU(WW | T+) = 0.9167*85 + 0.0833*(-15) = 77.9195 - 1.2495 = 76.67
              EU(Not | T+) = 0
              So choose WW -> 76.67

          After T-:
              P(G|T-)=0.00112, P(B|T-)=0.99888
              EU(Buy | T-) = -9988.69
              EU(WW | T-) = 0.00112*85 + 0.99888*(-15) ≈ 0.0952 - 14.9832 = -14.888
              EU(Not | T-) = 0
              So choose Not buy -> 0

          Expected utility with test: 
              = P(T+)*76.67 + P(T-)*0
              = 0.108 * 76.67 ≈ 8.28

          Value of the test: 8.28 - 0 = 8.28.

  Therefore, the signal (test) in version 1 is worthless (0) and in version 2 is worth 8.28, even though the belief update is the same.

  The structural feature that changed is the set of available actions: in version 2, we added a third action (Buy with warranty).

  What happens in version 2 without the additional action? Then it reverts to version 1 and the test becomes worthless.

  Defense of the worthless signal in version 1:

      Even though the test did not change the decision in this particular problem, it might have value for other decisions that the agent might face in the future. For example, the agent might later have an opportunity to buy a similar machine, and then the test result (if stored) could be useful. Also, there might be epistemic value: the agent learns more about the world, which might be intrinsically valuable or useful for other decisions.

  Reply:

      The decision maker in this case is only concerned with the current procurement decision. The problem does not involve future decisions. Moreover, if the test result could be used for future decisions, then we should model that explicitly. Without such future decisions, the test result has no instrumental value for the current decision. The epistemic value might be non-instrumental, but the policy staff are concerned with instrumental value for the specific decision at hand.

  Third version: can we have a strictly negative value for a free, private signal?

      Good's theorem says that with conditionalization and expected utility maximization, the value of information is nonnegative. So we cannot have strictly negative value without relaxing one of these assumptions.

      To get negative value, we must give up one of:
          - Bayesian updating (conditionalization)
          - Expected utility maximization (or the axioms of rational choice that lead to expected utility)

      Alternatively, we might consider a setting where the agent has a misspecified model. But the problem states that the agent updates by conditionalization and maximizes expected utility.

      Another possibility: if the information causes the agent to make a decision that is not optimal under the true state? But in expectation (over the signal) the agent cannot do worse. 

      Therefore, a third version with strictly negative value is not available under the given assumptions.

      What if we relax the assumption that the agent knows the true likelihoods? But the problem states that the test has known error rates.

      So we must concede that under the classical rational model, information cannot hurt in expectation. The cost of relaxing the assumption of Bayesian updating or expected utility maximization is that we leave the standard framework of rational choice.

  Conclusion:

      We have presented two versions of a procurement decision. The signal has zero value in version 1 and positive value in version 2, with the only difference being the availability of an additional action (the warranty option) in version 2. The strongest defense of the worthless signal (epistemic value or value for future unforeseen decisions) is not compelling for a specific current decision problem. And we cannot construct a version with negative value without relaxing the assumptions of the rational model.
answer: |-
  ### Case Study: The Value of Information in a Treatment Decision

  **Decision Problem:** A health agency must decide whether to approve a new treatment for a disease. The treatment is effective only if the patient has a specific genetic variant (state \(V\)), present with prior probability \(p = 0.5\). Without the variant (state \(\neg V\)), the treatment causes harmful side effects. The agency's options are:
  - **Approve:** Implement the treatment widely.
  - **Reject:** Do not approve the treatment.

  **Utilities** (quantifying health outcomes):
  - Approve when \(V\): \(+100\) (lifesaving benefit).
  - Approve when \(\neg V\): \(-104\) (severe side effects).
  - Reject (regardless of state): \(0\) (status quo).

  **Test:** A genetic test predicts \(V\) with sensitivity \(P(T_+|V) = 0.95\) and specificity \(P(T_-|\neg V) = 0.95\) (5% false negative/positive rates). The test is free and private.

  ---

  ### Version 1: "Rigid" Approval Process
  **Structural feature:** The agency **must** make a final approval decision *before* seeing the test result.  
  - **Rationale:** Regulatory rules require an upfront "approve/reject" commitment. The test result arrives too late to influence the decision but may be observed afterward for curiosity.

  **Expected utilities without test:**  
  - Approve: \(0.5 \times 100 + 0.5 \times (-104) = -2\)  
  - Reject: \(0\)  
  *Optimal choice: Reject (EU = 0).*

  **Expected utilities with test:**  
  Since the decision is made *before* the test result, the test cannot affect the action. The agency still optimally chooses Reject (EU = 0) regardless of the result.  
  - **Value of test:** \(0 - 0 = 0\) (worthless).

  **Belief updating (identical in both versions):**  
  - After \(T_+\): \(P(V|T_+) = \frac{0.95 \times 0.5}{0.95 \times 0.5 + 0.05 \times 0.5} = 0.95\)  
    (Prior 0.5 → Posterior 0.95: large shift toward \(V\))  
  - After \(T_-\): \(P(V|T_-) = \frac{0.05 \times 0.5}{0.05 \times 0.5 + 0.95 \times 0.5} = 0.05\)  
    (Prior 0.5 → Posterior 0.05: large shift toward \(\neg V\))  

  **Analysis:**  
  - Beliefs shift dramatically (0.5 → 0.95 or 0.05), but the test is worthless because the agency cannot act on the result.

  ---

  ### Version 2: "Flexible" Approval Process
  **Structural feature:** The agency **can conditionally decide** *after* seeing the test result.  
  - **Rationale:** Regulations allow flexible approval; the test result directly informs the decision.

  **Expected utilities without test:**  
  Same as Version 1: Reject (EU = 0).

  **Expected utilities with test:**  
  - After \(T_+\):  
    - Approve: \(0.95 \times 100 + 0.05 \times (-104) = 95 - 5.2 = 89.8\)  
    - Reject: \(0\)  
    *Optimal choice: Approve (EU = 89.8)*  
  - After \(T_-\):  
    - Approve: \(0.05 \times 100 + 0.95 \times (-104) = 5 - 98.8 = -93.8\)  
    - Reject: \(0\)  
    *Optimal choice: Reject (EU = 0)*  
  - Expected EU with test: \(P(T_+) \times 89.8 + P(T_-) \times 0\)  
    \(P(T_+) = (0.95 \times 0.5) + (0.05 \times 0.5) = 0.5\)  
    \(\therefore\) EU = \(0.5 \times 89.8 = 44.9\)  

  **Value of test:** \(44.9 - 0 = 44.9\) (highly valuable).

  **Belief updating:**  
  Identical to Version 1 (posteriors 0.95 and 0.05).

  ---

  ### Key Insight
  - **Feature carrying the case:** The **timing of the decision relative to information arrival**.  
    - In Version 1, the decision is irrevocably made *before* observing the signal.  
    - In Version 2, the decision is made *after* observing the signal.  
  - **Consequence of removing flexibility:** Without the ability to act on the signal (Version 1), the signal has no decision value.

  ---

  ### Defense of the Worthless Signal (Version 1)
  **Argument:**  
  The test has *epistemic value* for future decisions (e.g., research on variant prevalence) or *non-instrumental value* (e.g., satisfying curiosity, building knowledge for unforeseen policies). Even though it doesn't affect the current decision, it might improve future choices or advance scientific understanding.

  **Reply:**  
  For a policy staffer allocating limited resources, the *decision value* of information is paramount. Commissioning a costly study is justified only if it improves the current decision. Epistemic benefits are speculative and often unquantifiable; if they matter, they should be explicitly modeled as part of the utility function (e.g., "+utility for knowledge gained"). Absent that, a signal that doesn't change actions is wasteful.

  ---

  ### Can Information Have Negative Value?
  **Theorem constraint:** Good’s theorem guarantees that—under Bayesian updating and expected utility maximization—a signal has *non-negative* expected value. A strictly negative value is impossible without violating these assumptions.  
  - **Required concession:** Allow **non-Bayesian updating** (e.g., belief distortion under cognitive biases) or **non-expected-utility preferences** (e.g., ambiguity aversion).  
  - **Cost:** Abandoning rationality axioms undermines normative decision theory. For example:  
    - An ambiguity-averse agent might avoid free information to prevent exposure to "Knightian uncertainty."  
    - An agent with confirmation bias might misinterpret the signal, leading to worse decisions.  
    *However, such scenarios fall outside standard policy analysis, which presumes rational agents.*

  **Conclusion for Policy Staff:**  
  Information is valuable only if it can change actions. Always ask: "Given our *current options and constraints*, will this study alter our decision?" A signal that shifts beliefs dramatically may still be worthless if structural barriers prevent acting on it.
