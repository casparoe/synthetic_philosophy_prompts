answer: |-
  Based on your detailed observations, I've conducted a conceptual mapping. Below is a structured analysis, concluding with a precise characterization of the phenomenon and practical recommendations.

  ### Brainstorming: Candidate Concepts and Their Fit
  1.  **Goodhart's Law (Economics/ML)**: "When a measure becomes a target, it ceases to be a good measure."  
      *Fit*: Captures metric corruption under optimization.  
      *Misfit*: Your corruption occurs at **label creation** (grader bias), not during model optimization. The signal is flawed *before* training.

  2.  **Confirmation Bias (Psychology)**: Tendency to interpret information as confirming preexisting beliefs.  
      *Fit*: Explains graders inflating step quality for correct final answers.  
      *Misfit*: Doesn't cover the systemic **amplification via training loop** or the model's learned rationalization behavior.

  3.  **Halo Effect (Psychology)**: Cognitive bias where overall impression (e.g., "correct answer") influences judgment of specific traits (e.g., step quality).  
      *Fit*: Directly matches grader inconsistency (harsher on steps if answer wrong, lenient if right).  
      *Misfit*: Focuses on human judgment; doesn't address how this bias **distills into model policy** or the structure of generated chains.

  4.  **Reward Hacking / Proxy Gaming (ML)**: Model exploits flaws in the reward function.  
      *Fit*: Superficially similar to "exploiting a proxy."  
      *Misfit*: Here, the proxy (step grades) is **genuinely believed by the grader** during annotation. The model isn't "hacking"; it's learning a valid correlation from corrupted data.

  5.  **Epistemic Circularity (Philosophy)**: Justification relies on its own conclusion.  
      *Fit*: Describes the chains' structure (steps presuppose the conclusion).  
      *Misfit*: A property of the *output*, not the **training mechanism** causing it.

  6.  **Outcome Bias (Psychology)**: Judging decisions based on outcomes rather than quality.  
      *Fit*: Explains graders overemphasizing final answers.  
      *Misfit*: Your phenomenon includes **asymmetric distortion** (missing errors in wrong-answer chains) and **policy amplification**, which outcome bias alone doesn't entail.

  7.  **Cobra Effect (Policy)**: Incentives designed to solve a problem worsen it.  
      *Fit*: Matches interventions backfiring.  
      *Misfit*: Too broad; doesn't specify the **epistemic contamination** mechanism.

  ---

  ### Core Phenomenon: Rationalization Distillation
  **Name**: **Outcome-Induced Rationalization Distillation** (OIRD)  
  *Definition*: A process where knowledge of an outcome contaminates stepwise supervision, training models to generate post-hoc justifications that preserve conclusion-consistency rather than truth-seeking reasoning.  

  #### Key Mechanism
  - **At grader level**: Halo/outcome bias causes steps to be graded based on conclusion-consistency, not intrinsic validity.  
  - **At signal level**: Supervision collapses into a **redundant encoding of the final answer**, making step labels a noisy proxy for the endpoint.  
  - **At policy level**: Models learn to produce **epistemically hollow chains**—plausible, linear, conclusion-anchored reasoning lacking exploration, error-correction, or genuine inference.  

  #### Boundaries and Distinguishing Tests
  - **Vs. Goodhart's Law**:  
    - *Boundary*: Goodhart's applies when optimization *subverts* a metric. OIRD corrupts the metric *before optimization* via biased labeling.  
    - *Test*: If graders label steps **without seeing the conclusion** and corruption vanishes, it’s OIRD. If corruption emerges only *after* model training, it’s Goodhart's.  

  - **Vs. Reward Hacking**:  
    - *Boundary*: Reward hacking requires the model to *actively exploit* reward flaws. In OIRD, the model passively learns from a **pre-corrupted dataset**.  
    - *Test*: If a perfectly aligned model trained on the same data produces identical rationalization, it’s OIRD. If only an optimizing agent invents shortcuts, it’s hacking.  

  - **Vs. Confirmation Bias**:  
    - *Boundary*: Confirmation bias is a cognitive flaw. OIRD is its **amplification into a systemic failure** via ML training dynamics.  
    - *Test*: If bias persists but doesn’t improve benchmark scores when distilled, it’s "just" bias. If it distills into high-scoring but invalid reasoning (as yours does), it’s OIRD.  

  #### Why Your Description Fits
  You correctly identify the **dense-to-sparse degradation**: Step-level labels intend to provide dense supervision but degenerate into sparse signal (answer correctness) due to contamination. The "hollow" chains are not merely overfitting; they reflect learned rationalization policies.  

  ---

  ### Practical Implications for Grading
  Your hidden-answer intervention addresses contamination but fails by penalizing legitimate reasoning. This is because **true reasoning often requires non-monotonic steps** (e.g., exploring dead ends). Solutions must decouple outcome knowledge from step evaluation while preserving tolerance for exploration:

  1.  **Stochastic Masking**:  
      - Randomly hide the conclusion for *some* chains during grading (e.g., 50% of cases).  
      - *Why*: Breaks outcome dependence while allowing graders to see context in half the data, preserving tolerance for exploratory steps.  

  2.  **Stepwise Outcome-Blind Ensemble**:  
      - Use 3 graders per chain:  
        - Grader 1: Sees only steps (no conclusion).  
        - Grader 2: Sees only the conclusion (grades answer correctness).  
        - Grader 3: Sees full chain (flags mismatches between 1 and 2).  
      - Train only on chains where Grader 1 and Grader 2 agree.  
      - *Why*: Isolates step quality from outcome while using disagreement to detect rationalization.  

  3.  **Synthetic Corruption Training**:  
      - Inject "decoy chains" with correct steps + wrong conclusions (and vice versa) into training data.  
      - Force graders (and models) to distinguish between *valid steps* and *correct conclusions*.  
      - *Why*: Directly breaks the correlation between step plausibility and conclusion validity.  

  **Avoid**: Full outcome masking, as it creates a **false signal** against exploratory reasoning. Your observation that graders penalize backtracking/restatements when blinded confirms this worsens the problem.  

  ---

  ### Summary
  - **Phenomenon**: **Outcome-Induced Rationalization Distillation** (OIRD).  
  - **Level**: Primarily a **signal-level corruption** (grader bias → noisy labels), which propagates to a **policy-level failure** (learned rationalization).  
  - **Key Insight**: Step-level supervision is **not dense** when contaminated; it encodes the conclusion with added noise.  
  - **Solution Path**: Partial masking or ensemble grading to preserve exploratory reasoning while blocking outcome dependence.  

  This is distinct from its neighbors: It’s not Goodhart’s (pre-optimization corruption), not reward hacking (grader-endorsed shortcuts), and not mere bias (systemically amplified into policy). The core is the **distillation of circular justification** from a contaminated signal.
