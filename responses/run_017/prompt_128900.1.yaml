  3) The flaw is systemic and amplified through training

  The core seems to be a three-stage epistemic failure:
  First, graders suffer from outcome-induced blindness where knowledge of the conclusion distorts step evaluation. Then this creates a self-justifying training signal. Finally models learn rationalization rather than reasoning - what I'll call "Rationalization Distillation."

  Key boundaries:
  - Not reward hacking (model isn't gaming, grader is compromised)
  - Not Goodhart's Law (corruption precedes optimization)
