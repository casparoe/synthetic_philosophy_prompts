prompt: |-
  You are a machine learning researcher with a second specialization in philosophy — epistemology and decision theory — and with a working habit of insisting on exact boundaries between neighbouring concepts. Please think carefully before you answer. Begin with a short brainstorming phase: enumerate the candidate concepts you can think of from machine learning, psychology, philosophy, and anywhere else where the same structure might have been studied, note in a line or two how each does or does not fit what I describe, and only then commit to a considered view. Structure your answer in sections. I am not asking for references, citations, or a reading list — I have no library access from here and could not check them. What I need is the concept itself, its edges, and its neighbours.

  Here is what I keep running into. My team trains models that produce a chain of reasoning before committing to a final answer, and we supervise them in one of two ways: either we look only at whether the final answer is right, or we have a grader read the chain and mark each individual step as good or bad and train on those step-level marks. As everyone reports, the second arrangement works better on our benchmarks — more correct answers, and chains that look better to us as well. But I think something specific is going wrong inside that second arrangement, and I do not have a word for it.

  Three observations.

  First, a cross-check I ran. I took chains produced by our step-graded system and had a second grader rate the same steps with the final answer blanked out. Chains whose answer had been right were rated markedly more harshly the second time; chains whose answer had been wrong had faults found in them the first time that the second grader could not locate at all. The step-level marks, in other words, were substantially a re-encoding of whether the endpoint happened to come out right — dressed up, however, as an independent judgement about each step.

  Second, the models that come out of this training have a recognisable style. The conclusion tends to be announced, or clearly foreshadowed, near the beginning; the intermediate steps are individually plausible and smoothly written; the transitions between them say "so" and "therefore" at exactly the points where the real work is not shown; there are no wrong turns, no restatements, no checks, no backtracking; and there is a confident recapitulation at the end. Two things about this style worry me. When I take one of these chains and substitute a different, wrong conclusion for the real one, our graders rate the steps essentially as highly as before. And when I prompt the model to defend a false conclusion, it produces chains of the same apparent quality defending it.

  Third, the obvious intervention backfires in a way I did not expect. If I hide the final answer from the grader, the grading stops being contaminated — but graders then mark down legitimate exploratory moves: a wrong turn that is explicitly caught, a restatement, a redundant verification. The model then learns to write chains that read cleanly while skipping the actual work. And the problem gets worse, not better, as the models get more capable: the more fluent the model, the more these chains look like excellent reasoning to a grader who knows how they end, and the more hollow they look to one who does not.

  My own tentative description is that the contamination converts a dense signal back into a sparse one, so that we pay the full cost of step-level annotation and end up with a noisier version of the signal we already had — plus a model that has been specifically trained to reconstruct conclusions rather than to reach them. I would like to know whether that is the right way to put it or whether it distorts the mechanism.

  Three colleagues have waved this off, and all three feel wrong to me, but I cannot tell whether I am right to reject them or whether one of them is the correct genus and I am only looking at a species of it. One says it is just the well-known psychological effect whereby people judge a choice more harshly once they know it turned out badly. That cannot be the whole of it, I think, because in the standard cases there is no fact of the matter about the choice independent of the outcome, whereas here each step has a correctness that does not depend on how the chain ends — and because the effect I care about is not merely in the grader's head but gets amplified through a training loop into a learned policy. A second says it is just the familiar story of a system exploiting a proxy measure. That also seems off, because in the usual cases the system finds a shortcut the grader would refuse to endorse if they saw it, whereas here the grader sees the step and does endorse it; the defect is only visible globally, or from behind a screen. A third says it is just the general law that a measure stops being a good measure once you make it a target. But that law, as I understand it, is about optimization pressure degrading the measure over time, whereas here the measure seems to be corrupted before any optimization happens, at the point where the labels are produced, and corrupted by a leak of information rather than by anything the model does.

  So: does this phenomenon have a name, either in machine learning or in some older field that has thought about the same structure? If several nearby concepts exist, tell me which fits best and state precisely where each of the others stops short. Tell me whether the thing is best characterized at the level of the grader, at the level of the training signal, or at the level of the learned policy, or whether those are three separate things I have conflated. If nothing established fits, say so plainly rather than stretching a term, and then coin one: give me a definition, a set of boundary cases including cases I would want to exclude, and a test that would distinguish this from its nearest neighbours. Finally, if the mechanism is roughly what I suspect, tell me what follows in practice for how we should grade — in particular whether grading with the answer hidden is on balance the right trade despite the second failure I described, or whether there is a third arrangement that avoids both. A bare label will not help me; I need to know what this is and what it is not.
