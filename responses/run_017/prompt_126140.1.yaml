prompt: |-
  Hiya — I've got a work-in-progress session on Thursday where I'm presenting a thesis chapter, and I'd be really grateful for some help prepping. Please write your answer in American English (the external examiner on my committee is American and I want to be able to lift sentences straight from your reply into my notes without having to translate the spellings back).

  The chapter in one go: I argue that Goodman's entrenchment answer to the new riddle is less of a solution than it's usually made out to be, and that what's actually doing the work is something like an intervention-sensitivity condition — my suggestion is that a predicate counts as projectile only if its track record would have survived changes in how, when, and whether we bothered to look, not merely that it's been projected a lot in the past. From there I claim two things: first, that this condition can't be spelled out in purely observational vocabulary, so the new riddle is best seen as a special case of the general problem of extrapolating from passive observation to what would happen under intervention; and second, that there's a nice payoff in machine learning, where a classifier that latches onto something predictive in the training set but unstable once you deploy it — the sort of case where a model sorts huskies from wolves by whether there's snow in the background — is basically a grue-predicate with extra steps, and what makes it a bad feature is that it isn't robust to interventions on the background, not that it's somehow unnatural or insufficiently entrenched.

  The room, which is why I'm nervous: my supervisor, who's a Hume person and thinks the new riddle just is the old riddle in a fake moustache, and that I've reinvented the appeal to custom with more machinery; Priya, a formal epistemologist and thoroughgoing Bayesian, who will want everything I say converted into a claim about priors; Dave from the causal inference crowd, who'll be pleased I'm borrowing his tools and cross that I'm borrowing them loosely; a visiting computer scientist who works on distribution shift and will definitely be too polite to say out loud that this is already a known thing; and an emeritus who has said at every single one of these sessions that the whole debate is verbal and that no one has ever shown him otherwise.

  What I'd like is a prep sheet: the eight or so objections I'll actually get from this specific bunch, ordered by how much damage they'd do, each phrased the way that particular person would phrase it, with a reply I can give in about two minutes and an honest note on where that reply is soft. And please include the one I'm hoping nobody asks. I think it's the one about whether my intervention-sensitivity condition is itself just another predicate whose projectibility I'm helping myself to, but I'm not sure its the right thing to be losing sleep over.
