prompt: |-
  Not a philosopher — I write software. Hobby project for the last few months: I've been generating Bongard problems with a script. You know the format, twelve little boxes of shapes, six on the left obey a rule, six on the right break it, you're supposed to find the rule.

  Here's the pattern I keep hitting and don't have a word for. On maybe half the problems where I think I've written a clean rule, there's a second rule I never intended that also sorts all twelve pictures correctly, and the annoying part is that I can't kill it by generating more pictures. The pictures that would tell the two rules apart are pictures my generator never produces. Either the sampler can't emit them, or they'd break the other thing a Bongard problem needs: each side has to look varied and messy, otherwise the answer is just "count the dots" and the problem is garbage. So the rival rules disagree only on cases the setup rules out in advance — not merely on cases nobody has gotten around to looking at yet.

  Two actual examples. One: my intended rule was "the dots are collinear." The rival that also fits every picture is "there are three dots" — my sampler drops points into a thin strip, so triples come out visually collinear, and three scattered dots is a picture the strip never produces. Two: intended rule "one shape sits inside the other," rival "the two shapes don't overlap," because my placement routine snaps shapes to cells and never produces a partial overlap; so inside and disjoint are the only two things that ever happen and both rules fit.

  So: does this have a name? I half remember something from a blog post about a predicate like grue — thing is green if examined before some date and blue after — which sounds adjacent, but that's about cases that are merely unexamined rather than cases my whole setup makes unreachable, and I can't tell if that difference matters or if I'm overthinking a detail. Also tell me whether I've got one phenomenon or two: the rival I can't produce a counterexample for, versus the rival I could produce but only by making the problem look trivially easy. Same failure or not?

  Don't hand me a reading list or citations, I can't chase them and don't want them. And don't lay out four candidates and leave me to choose — commit: say which existing concept you think this actually is and why the others are near misses, or, if there isn't one, coin a name, define it, and give me the boundary cases where it stops applying. Say plainly which bit you're least sure about.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a software developer creating Bongard problems using a script. The issue is that unintended rules keep fitting the generated images, and they can't produce counterexamples because their setup prevents those cases. They mentioned two examples: collinearity vs. three dots, and containment vs. non-overlapping shapes. 

  First, I need to figure out the core issue. It seems like the constraints in their generator create a scenario where multiple rules are indistinguishable within the possible outputs. The user is asking if there's a name for this phenomenon. They mentioned Goodman's grue, but that's about time-dependent predicates, which is different because here the counterexamples are impossible by design.

  I recall terms like "underdetermination" in philosophy of science, where data can support multiple theories. But here, it's not just that the data supports both rules; it's that the generator's constraints make the rules logically equivalent in the possible dataset. So maybe "empirical equivalence" or "observational equivalence" fits, but those usually apply when more data could distinguish them. Here, no future data can because the problematic cases are excluded by the generator's rules.

  Another angle: the user's examples show that the rival rules are coextensive within the restricted sample space. So it's about the limitations of the generator creating an equivalence class of rules. Terms like "accidental coextension" come to mind, but I need to check if that's a thing. Maybe "generator-induced coextension" or "sampling artifact equivalence" would be more precise. 

  The user also asks if the two issues they mentioned are the same phenomenon. The first is about the sampler not producing certain cases (like three non-collinear dots in a strip), and the second is about placement routines preventing partial overlaps. Both result from the generator's constraints making counterexamples impossible. So yes, they're the same underlying issue: the feasible set of images restricts the rules to being equivalent. 

  The annoyance is that adding more images won't help because the constraints prevent the distinguishing cases. The user wants a term that captures this impossibility. "Necessarily coextensive predicates in the feasible set" is descriptive but clunky. Maybe "contingently equivalent rules" or "artifactually equivalent predicates." 

  Considering the user's background, they prefer practical terms over philosophical jargon. They might appreciate "sampling artifact" as it's a known concept in statistics where data collection methods bias results. So "sampling artifact equivalence" could work. 

  I should also address their mention of trivial cases. When distinguishing rules would require images that make the problem too obvious, it's part of the same issue. The constraints (both technical and aesthetic) limit the sample space, causing both types of rival rules. So it's one phenomenon with the same root cause. 

  In conclusion, the best fit is "sampling artifact equivalence," emphasizing that the generator's restrictions cause the equivalence. I'll define it clearly and explain why other terms like underdetermination or grue don't fully apply. The boundary is when the generator allows distinguishing cases, even if they're rare. The least sure part is whether "artifact" is the right term, but it fits the technical context.
answer: |-
  This phenomenon is **Sampling Artifact Equivalence**, a specific form of *underdetermination* where two or more distinct rules are indistinguishable within the feasible sample space defined by your generator's constraints. Here's the breakdown:

  1.  **Core Problem:** Your generator's rules (e.g., "points must lie within a thin strip", "shapes snap to grid cells") implicitly define a *feasible set* of possible outputs. Within this set, your intended rule and the rival rule **necessarily co-occur**. They are *extensionally equivalent* under the generator's restrictions.
  2.  **Why Existing Terms Don't Fully Fit:**
      *   **Goodman's "Grue" (Projectibility):** Deals with *arbitrary time-dependent predicates*, not constraints making counterfactuals *impossible to generate*. Grue's counterexamples are *possible but unseen*; yours are *structurally excluded* by the generator.
      *   **Underdetermination (Philosophy of Science):** Broadly applies (multiple theories fit the data). But classic underdetermination implies *future data could distinguish* the theories. Your issue is stronger: *no data within the feasible set can distinguish them*.
      *   **Observational Equivalence (Economics/Stats):** Very close! Refers to models producing identical observable outcomes. But it usually focuses on *stochastic* models where outcomes are statistically identical, not deterministic constraints making rules *logically equivalent* within the sample space.
      *   **Coextensive Predicates:** Accurate but *too broad*. Many predicates are coextensive by accident (e.g., "is water" and "is H₂O" *now*). Your issue is *coextension forced by the sampling mechanism*.
      *   **Accidental Property:** Doesn't capture the *systematic, constraint-induced* nature of the equivalence.

  3.  **Sampling Artifact Equivalence Defined:**
      *   **When:** Two logical predicates (rules) `P` and `Q` are indistinguishable because the data generation process `G` has constraints ensuring that for any output `x` feasible under `G`, `P(x) == Q(x)`.
      *   **Key Feature:** Distinguishing cases `y` (where `P(y) != Q(y)`) are either *logically impossible* under `G`'s rules or *explicitly excluded* by `G`'s design goals (e.g., avoiding trivial problems, ensuring visual variety).
      *   **Boundary Case:** If `G` *could* feasibly produce `y` (where `P(y) != Q(y)`) but just hasn't yet, it's *mere underdetermination*. Sampling Artifact Equivalence requires `y` to be *infeasible* or *excluded by design*.

  4.  **Your Two Examples are the Same Phenomenon:**
      *   **Collinear vs. Three Dots:** Feasible set = points in a thin strip. `Collinear(x)` is always true when `NumDots(x)==3` (given the strip). Distinguishing case (3 non-collinear dots) is *infeasible* (strip constraint).
      *   **Inside vs. Disjoint:** Feasible set = shapes snapped to grid cells. `Inside(x)` or `Disjoint(x)` is always true. Distinguishing case (partial overlap) is *infeasible* (snapping constraint).
      *   **The "Triviality" Aspect:** This is integral! The reason partial overlap isn't generated isn't just technical difficulty; it's *explicitly excluded* to prevent trivial problems ("count the overlaps"). Similarly, generating widely scattered dots might violate the "messy but rule-following" aesthetic. **The constraints serving the *design goals* of the Bongard problem (visual variety, non-triviality) are precisely what *cause* the equivalence artifact.** You can't generate the distinguishing case *without* violating the core requirements for a "good" problem instance.

  5.  **Why "Artifact"?** It highlights that the equivalence is *not* a fundamental property of the rules `P` and `Q` themselves, but an *accidental byproduct* (`artifact`) of the specific *sampling procedure* (`G`) used to generate the data. It's a flaw/feature of the *experimental setup* or *measurement tool*.

  **In Short:** You're hitting **Sampling Artifact Equivalence**. The constraints defining a "valid" output for your Bongard generator (both technical feasibility and aesthetic "good problem" criteria) create a sample space where your intended rule and an unintended rival rule are *necessarily coextensive*. Distinguishing cases are impossible *by construction* of your generator, not merely unobserved.

  **Least Sure Bit:** Whether "artifact" is the *perfect* term. It accurately implies it's a byproduct of the tool/method, but might slightly underemphasize the role of the *deliberate design constraints* (like avoiding triviality) versus just technical limitations of the sampler. However, "design constraint artifact" is clunky, and "artifact" effectively captures the core idea of an unintended consequence of the generation process.
