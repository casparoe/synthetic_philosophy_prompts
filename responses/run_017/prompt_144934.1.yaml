  Hi, I'm a journalist putting together a piece on John Locke's ideas about education, and I want to get past the usual blank-slate stuff. I've been calling one strand of his thought the curiosity-hygeine view: roughly, that a tutor's first job is to protect a child's natural appetite for knowledge and never let it be bribed, coerced, or bored out of them. The other strand I'm calling the early-formation view: the bit where Locke thinks desires and aversions have to be trained into the child long before they can reason for themselves, mostly through repeated practice and the quiet authority of a tutor. Please compare these two strands in Locke's educational thinking. Which one is actually doing the heavy lifting in his overall aim of producing a rational, virtuous adult, and are they compatable or does one quietly swallow the other? Please write your answer in British English, and keep it tight.
