  ### Key Features:
  - **Logical space focus**: Nodes are derived from the cases to expose underlying commitments. Unoccupied combinations are noted, with reasons (incoherent, unattractive, or untried).
  - **Leaf descriptions**: Each leaf is named if standard (e.g., "Natural Law Theory") or described in a sentence if not. An "awkward commitment" (a counterintuitive or challenging implication) is included for each.
  - **Indistinct leaves**: Flagged where the tree cannot fully separate positions (e.g., Leaves D, F, and J partially collapse under Pascal's three readings).
  - **Confidence**: High (85%) overall. The tree isolates core tensions, but real-world views may blend leaves. The weakest node is **Node 4 (Settled-usurpation: Normative work of time?)**, as "normative work" is ambiguous—some may conflate moral legitimacy with social acceptance.

  ### Decision Tree
  **Start with the uncontroversial claim:** "A rule being coercively enforced and generally obeyed does not, by itself, make it just."

  1. **Boundary Case: Moral Obligation Change?**  
     *When a transfer of goods is theft in one jurisdiction and lawful inheritance in another (due only to a change in latitude), does the moral obligation (e.g., the duty not to take the goods) change for the parties when they cross the border?*  
     - **Yes** → Go to Node 2.  
     - **No** → Go to Node 3.  

  2. **Settled-Usurpation: Change Actions?**  
     *A regime’s founding document is proven to be a forgery after 200 years of stable rule. Does this discovery change what anyone should do (e.g., obey or resist the regime)?*  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  3. **Settled-Usurpation: Change Actions?** (Same as Node 2)  
     *A regime’s founding document is proven to be a forgery after 200 years of stable rule. Does this discovery change what anyone should do (e.g., obey or resist the regime)?*  
     - **Yes** → Go to Node 6.  
     - **No** → Go to Node 7.  

  4. **Settled-Usurpation: Change Public Speech?**  
     *After uncovering the forgery, does the discovery change what anyone should say in public (e.g., denounce the regime or stay silent)?*  
     - **Yes** → Leaf A.  
     - **No** → Leaf B.  

  5. **Settled-Usurpation: Normative Work of Time?**  
     *Does the 200 years of undisturbed possession do normative work (e.g., make the regime legitimate) or only predictive work (e.g., make it stable)?*  
     - **Normative work** → Leaf C.  
     - **Only predictive work** → Leaf D.  

  6. **Settled-Usurpation: Normative Work of Time?** (Same as Node 5)  
     *Does the 200 years of undisturbed possession do normative work (e.g., make the regime legitimate) or only predictive work (e.g., make it stable)?*  
     - **Normative work** → Leaf E.  
     - **Only predictive work** → Leaf F.  

  7. **Design Case: Reason to Manage Appearances?**  
     *You advise a new constitutional court. Knowing compliance depends on subjects believing the law is just (and erodes if foundations seem arbitrary), does the causal dependence of obedience on opinion generate a moral reason to manage appearances (e.g., use robes and archaic ceremonies over plain transparency)?*  
     - **Yes** → Leaf G.  
     - **No** → Go to Node 8.  

  8. **Insider Case: Inward Acknowledgement Required?**  
     *An official who sees the law’s arbitrariness must decide: Does she owe the law only outward compliance (acting as if she accepts it) or also inward acknowledgement (e.g., believing it binds conscience)?*  
     - **Only outward compliance** → Leaf H.  
     - **Also inward acknowledgement** → Leaf I.  

  ### Leaves (End Positions)
  - **Leaf A: Radical Unmasking**  
    Description: Justice is absolute; uncovering injustice obliges action and speech to oppose it, regardless of stability.  
    Awkward commitment: Must destabilize society to expose historical injustices, even if functional.  
    Path: 1:No → 3:Yes → 4:Yes  

  - **Leaf B: Prudential Natural Law**  
    Description: Justice is absolute but requires pragmatic silence on injustice to avoid chaos.  
    Awkward commitment: Must publicly defend a regime known to be unjust if dissent risks disorder.  
    Path: 1:No → 3:Yes → 4:No  

  - **Leaf C: Customary Positivism**  
    Standard name: Conservative Traditionalism.  
    Description: Justice is defined by long-standing custom; time confers legitimacy, not just stability.  
