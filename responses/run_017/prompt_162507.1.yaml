  - **Leaf F: Natural Law Theory**  
    Standard name: Natural Law Theory (strict).  
    Description: Justice is absolute and knowable; force cannot legitimize, only execute.  
    Awkward commitment: Must reject stable, functional systems if origins are unjust, risking chaos for principle.  
    Path: 1:No → 3:No → 6:Only predictive work → (Design case implied: No, but not asked)  
