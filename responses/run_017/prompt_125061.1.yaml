  Their homemade concepts are insightful: "never-made/never-sent/never-theirs" identifies archival silences at different stages, while "counter-collection notes" attempt to document absences. But they're unsure if these actually help or just ease guilt. 

  Three test cases highlight tensions:
  - The judge's papers contain institutional power narratives but suppress marginalized voices
  - The tenants' union materials are vulnerable community evidence with privacy risks
  - Booking photos risk retraumatizing if preserved as "history"

  The procedure must be ruthlessly practical - half-hour per collection max. Key elements:
  1) Interrogate power dynamics first (whose voice dominates?)
  2) Assess community harm potential
  3) Identify silencing mechanisms
  4) Require actionable mitigation

  For the booking photos: the ethical "no" is clear. Preserving police mugshots as "history" without consent retraumatizes and perpetuates state violence. The harm outweighs any research value. 

  The judge collection gets conditional yes with redactions and counter-note about missing family perspectives. Tenants' union gets yes with privacy protections. 

  Critical step? The "harm assessment" (#4). Without evaluating real-world consequences, we risk becoming complicit in archival violence. Even when rushed, this can't be skipped - it's the ethical anchor.

  The framework will misfire by:
  - Over-prioritizing tangible collections (systematically undersampling oral histories)
  - Failing against "slow violence" collections (environmental damage records etc.)
  - Being weaponized to exclude marginalized voices under "risk aversion"

  If challenged that this over-politicizes archives, I'd counter: neutrality is a political stance favoring the status quo. But if told "this requires resources we literally don't have", I'd withdraw it - ethics demand either proper support or non-performative restraint.
answer: |-
  Here's a streamlined decision procedure based on your framework. It prioritizes confronting silence, fits on one page, and flags judgment calls. **Bold** = critical steps; *Italics* = judgment calls.

  ---

  ### Archival Power & Silence Assessment Protocol
  **(Run sequentially. Stop at any "NO" or "KICK." Max 30 mins/collection.)**

  1.  **VOICE ORIGIN:** *Who created the core content?* (Judgment call: Whose perspective dominates?)
      *   *Good Enough:* Explicitly named creators/groups (e.g., "tenant organizers," "judge's notes").
      *   *KICK if:* Ambiguous origin needing deeper research (exceeds time).
      *   *NO if:* Solely institutional/power-holder perspective describing marginalized groups ("never-theirs" dominant).
      *   **Write:** "Creator(s): [X]. Primary perspective: [Power-holder/Marginalized Group/Both]."

  2.  **SILENCE MAPPING:** What key *never-made*, *never-sent*, *never-theirs* gaps does this reveal?
      *   *Good Enough:* Identify 1-2 specific groups/voices likely absent and *why* (e.g., "Never-made: Tenant meeting recordings; Never-theirs: Families' own court testimonies").
      *   *KICK if:* Complex gaps needing community consultation (exceeds time/resources).
      *   *NO if:* Collection *only* reinforces institutional silencing ("never-theirs") with no counter-narrative value.
      *   **Write:** Key silences identified: [List]. Types: [Never-made/Never-sent/Never-theirs].

  3.  **HARM POTENTIAL:** Could accessioning cause *active harm* (re: privacy, safety, ongoing oppression)?
      *   *Good Enough:* Surface-level risk assessment based on content/donor statements.
      *   *KICK if:* Significant risk requiring legal/community review (e.g., sensitive lists, vulnerable populations).
      *   *NO if:* Unmitigatable high risk (e.g., non-consensual identifying imagery, enables targeting).
      *   **Write:** "Risks identified: [e.g., privacy, retraumatization]. Mitigation plan: [e.g., redaction, closure, donor agreement required]."

  4.  **CONDITIONS & COUNTER-COLLECTION:** Can conditions reduce harm/expand voice? What goes in the *Counter-Collection Note*?
      *   *Good Enough:* 1-3 feasible conditions (e.g., redactions, closure periods, deed restrictions). Draft Counter-Note (3 missing voices + 1 guess location).
      *   *KICK if:* Complex negotiations needed (e.g., naming rights, large-scale redaction).
      *   *NO if:* Essential conditions refused by donor (e.g., no closure period for harmful content).
      *   **Write:** "Conditions: [List]. Counter-Collection Note Draft: [Text]."

  5.  **VIABILITY CHECK:** Can we physically/legally manage this *responsibly* with current resources?
      *   *Good Enough:* Basic assessment of space, volunteer capacity, legal requirements (retention?).
      *   *KICK if:* Requires significant new resources (e.g., complex digitization, major preservation).
      *   *NO if:* Beyond capacity to preserve/describe/access ethically (e.g., unprocessed digital dump).
      *   **Write:** "Resource Impact: [Low/Medium/High]. Retention Schedule: [Applies/Does Not]."

  ---

  ### Application to Test Cases

  1.  **Juvenile Court Judge Papers (40 boxes)**
      *   **1. VOICE ORIGIN:** *Judge's notes (power-holder). Families' voices only filtered ("never-theirs").*
      *   **2. SILENCE MAPPING:** Never-made: Family testimonies, social worker raw notes. Never-theirs: Families' own accounts dominant.
      *   **3. HARM POTENTIAL:** *High.* Retraumatization, privacy violations (minors, sensitive cases). *KICK:* Requires review for redaction/closure feasibility.
      *   *[KICK Outcome]:* **Conditional YES.** Accession ONLY IF: (a) Closure period reduced (<10 yrs) or case-specific redactions possible; (b) Strong Counter-Note. **Write:** "Vital institutional record documenting systemic bias. Families' own voices absent ('never-theirs'). Counter-Note: Missing - Children's perspectives, Parent advocates' records, Social context notes. Likely traces: Community legal aid files, church outreach records, family photo albums."
      *   *NO if donor refuses reasonable conditions.*

  2.  **Tenants' Union Shoebox**
      *   **1. VOICE ORIGIN:** *Tenant organizers (marginalized group). Flyers/FB = direct voice.*
      *   **2. SILENCE MAPPING:** Never-made: Formal minutes (intentional?). Never-sent: Internal strategy docs? Never-theirs: Landlord counter-actions?
      *   **3. HARM POTENTIAL:** *High.* Safety fear (name lists). *KICK:* Urgent need for donor agreement managing access/redaction.
      *   *[KICK Outcome]:* **YES (High Priority).** Accession IF: Donor agreement allows redacting names/sealing lists. **Write:** "Rare direct evidence of tenant organizing. Counter-Note: Missing - Meeting debates, Internal conflicts, Landlord retaliation records. Likely traces: Personal emails/texts, oral histories with members, hidden social media groups."
      *   *NO if no agreement securing member safety.*

  3.  **County Booking Photos (Digitized)**
      *   **1. VOICE ORIGIN:** *Police/county institution (power-holder). Subjects have no voice ("never-theirs").*
      *   **2. SILENCE MAPPING:** Never-made: Arrested persons' own accounts. Never-theirs: Solely state-dehumanizing imagery.
      *   **3. HARM POTENTIAL:** *Extreme.* Active harm: Non-consensual, retraumatizing, weaponizable, perpetuates carceral bias. **NO.** Unmitigatable risk.
      *   **Write:** "Rejected. Perpetuates state violence & silencing ('never-theirs'). Active harm outweighs potential research value. Recommend destruction per retention or referral ONLY to community archive focused on restorative justice *with* subject consent."

  ---

  ### What This Procedure Cannot Do

  1.  **Create Absent Voices:** It documents silence but *cannot* fill gaps without oral history/resources.
  2.  **Override Systemic Bias:** Will misfire towards accepting institutional records (they're "complete") and rejecting fragile community records (perceived "risky").
  3.  **Ensure Counter-Notes Are Used:** They only matter if researchers *seek them*. Risk: performative guilt relief.
  4.  **Solve Resource Limits:** Forces harsh "viability" NOs that may silence marginalized voices *again*.

  ### Why It Might Break

  If you argue: **"This over-politicizes selection; archives must be neutral custodians of what exists,"** then *don't run this*. This procedure explicitly rejects neutrality as complicity with existing power structures. It prioritizes mitigating harm and confronting silence over "completeness" or institutional convenience.

  ---

  \answer{HARM POTENTIAL}
