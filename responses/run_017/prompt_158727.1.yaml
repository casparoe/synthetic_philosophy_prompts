prompt: |-
  Hi — I write on science and ideas for a UK paper, and I'm doing a piece on a handful of small teams building what they call 'ethics engines': software where you describe a decision, set sliders for how confident you are in various moral theories, and it gives you a recommendation. I'm not a philosopher and I don't want the piece to be either credulous or a lazy sneer, so I'm trying to get the underlying literature straight first.

  I picked up a popular philosophy book over Christmas — one of those brisk ones written by a science writer, I won't name it — with a chapter on moral uncertainty. My notes of it read roughly like this:

  'We are never fully certain what we ought to do, and part of that uncertainty isn't about the facts at all: it's about which moral theory is the true one. Maybe consequentialism is right, maybe some form of deontology, maybe virtue theory, maybe something nobody has thought of yet. Philosophers call this moral uncertainty, and the standard way of handling it is ordinary expected-value reasoning — the same maths you'd apply to any gamble. Multiply how good each option looks by how likely it is that the theory saying so is the true one, add them up, and do whatever comes out on top. The surprise is that this usually hands you back the answer you already had: do what your favourite theory says. The reason is that the theories aren't measurable against one another — one counts units of welfare, one counts duties kept, one talks about character — and no one has worked out how to put those on a single scale. This is the normalisation problem, and after decades of argument there's still no agreed solution, which effectively shelves the whole expected-value approach. The practical upshot is that you should just act on whichever theory you find most plausible. Hedging between theories is worse than useless: split the difference and you satisfy neither theory, and someone can construct a series of choices in which you pay to switch back and forth and end up worse off by your own lights, which shows the hedging method is incoherent.'

  That's my paraphrase of a paraphrase, so allow for some drift, but it's close.

  Could you go through it claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong? I'd rather you didn't park everything in 'it's complicated'. My instinct is that the chapter is doing something sneaky in the middle — it makes moral uncertainty sound like straightforward expected utility under risk, and then says the numbers can't be put on a common scale, and I can't tell whether those two complaints are the same complaint or whether the author has merged two different problems. I also don't trust the bit about hedging being refuted by that betting example; it definately sounds like one objection doing the work of a knockdown argument.

  One more thing, and this is the bit I actually need for the piece. Two of the teams I'm profiling have made design choices that seem to me to be direct responses to the chapter's complaints, and I want to know if they work:

  1. To get round the normalisation problem, their software doesn't try to find a shared moral scale. Instead each theory on the menu scores every available option, then the scores are rescaled within that option set — the option a theory likes best gets 100, the one it likes least gets 0, everything else is spread in between — and only then does the tool take the credibility-weighted average across theories.

  2. There's a confidence floor and ceiling: you can't set any theory below 2% or above 90%. Their argument is that you should never be certain in ethics, and that you can't rule out a theory just because you haven't heard of it.

  Does either of those survive once the chapter's mistakes are corrected, or do they just relocate the problem — and if so, where exactly does it reappear? Does the rescaling trick make the recommendation hostage to which options happen to be on the menu? Does the 2% floor do any real work, given that a small credence in a theory that cares about enormous stakes might swamp everything else? And is there any reading on which the number the tool prints out is genuinely the thing you ought to do, rather than a number it can defend?

  Finally, since I'm quoting people: please be explicit about which of your claims are settled among people who work on this and which are one side of a live disagreement, and flag anywhere you're giving me your own view rather than the field's. I'd rather print a genuine fight than invent a consensus that isn't there.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science writer for a UK paper working on an article about "ethics engines." They read a popular philosophy book on moral uncertainty and have paraphrased its key points. They want to verify those claims and understand if two design choices from the teams they're profiling address the mentioned problems.

  First, I need to address each claim from their paraphrase. The book says moral uncertainty uses expected-value reasoning like gambling. But I recall that the academic debate distinguishes between moral uncertainty and empirical uncertainty. MacAskill and others have written about this, pointing out that comparing different moral theories isn't straightforward because they use different units (utility vs. duties). The normalization problem is real, and while there are proposals like variance normalization or range voting, no consensus exists. So the book’s simplification here is problematic.

  The next claim is that expected value usually returns your favorite theory's answer. That’s too simplistic. Depending on the stakes and credences, minority theories can sway decisions. For example, a theory with high stakes might override a more probable one. The hedging part: the Dutch book argument against hedging is weak because it assumes intertheoretic comparisons, which are exactly the problem. The book's dismissal of hedging overlooks ongoing debates.

  Now, the design choices. Rescaling options (0-100 per theory) avoids normalization by using relative rankings. But this introduces context dependence. Adding or removing options can change the scores. If a new, worse option is added, the best option’s score inflates, affecting the weighted average. So while it sidesteps normalization, it creates new issues with menu dependence.

  The confidence floor (2%) and ceiling (90%) aim to prevent dogmatism. The ceiling makes sense; being 100% certain in ethics is unrealistic. The floor, however, could be problematic. Assigning a minimum credence to every possible theory, including unknown ones, might lead to the "fanaticism problem." A tiny credence in a theory demanding extreme sacrifices could dominate decisions. This is a recognized issue in the literature, like in Nick Bostrom's work on infinite ethics.

  The user needs to know if these designs hold up. Rescaling is a practical workaround but has flaws. Confidence bounds are defensible for the ceiling but risky for the floor. They should present these as pragmatic solutions with trade-offs, not settled science.

  Also, the user wants clarity on scholarly consensus vs. disagreements. For example, normalization being unsolved is agreed, but solutions like variance normalization are contested. The Dutch book argument against hedging is not widely accepted. Confidence bounds are practical, not theoretical fixes.

  I should structure the response by first correcting the book's claims, then evaluating each design choice, highlighting where problems resurface. Emphasize that the ethics engines' outputs are decision aids, not moral truths. Mention ongoing debates to avoid false consensus.
answer: |-
  Here's a breakdown addressing your queries point-by-point, separating settled points, live debates, and my own assessments (explicitly flagged). This field (normative uncertainty) is active and contentious, so I'll highlight disagreements clearly.

  **Deconstructing the Chapter's Claims:**

  1.  **"Moral uncertainty exists and is distinct from factual uncertainty."**
      *   **Accepted:** This is foundational and non-controversial. Philosophers widely agree we can be uncertain *which* moral theory (e.g., utilitarianism, Kantianism, virtue ethics) is correct, separate from uncertainty about facts (e.g., how many people an action will help/harm). (Settled)

  2.  **"The standard proposed way to handle it is expected-value reasoning (maximize 'choice-worthiness' expected value)."**
      *   **Partly Accepted, Partly Contentious:** Expected *choice-worthiness* calculation is indeed the dominant *proposal* for handling normative uncertainty, analogous to expected utility under empirical uncertainty. Key figures like William MacAskill, Nick Bostrom, and Toby Ord advocate variants. However:
          *   Calling it the undisputed "standard way" overstates consensus. It's the most *developed* framework, but many philosophers remain deeply skeptical about its coherence or feasibility. (Settled: It's the leading proposal. Contentious: Whether it's viable or the right approach).
          *   The term "choice-worthiness" (rather than "goodness" or "value") is used precisely to avoid presupposing consequentialism and to be theory-neutral. (Settled terminology within this approach).

  3.  **"The surprise is that this usually hands you back the answer you already had: do what your favourite theory says."**
      *   **Mostly Rejected / Overstated:** This is misleading. While it *can* happen, especially if one theory has very high credence, it's **not** generally true. Crucially:
          *   **Stakes Matter:** A theory you find *less* plausible (say, 20% credence) might assign *enormously* high stakes (positive or negative) to an outcome compared to your favored theory (80% credence). That 20% credence in the high-stakes theory can easily dominate the calculation. (Settled: Stakes asymmetry can make minority theories decisive).
          *   **Fanaticism Problem:** Theories positing infinite values (e.g., some religious doctrines) can swamp everything else even with tiny credences. (Live debate on how/if to handle this).
          *   **The claim ignores the core motivation for the framework:** To handle cases where you *aren't* certain and where minority theories *should* influence you. (My view: This claim reflects a misunderstanding of the framework's purpose).

  4.  **"The reason is the normalisation problem: theories aren't measurable on a single scale."**
      *   **Accepted (Core Problem):** This is the **fundamental challenge**. Utilitarianism measures in "utils" (welfare), Kantianism might measure in "duties fulfilled/violated", virtue ethics in "virtue/vice exhibited". These units are *incommensurable* – there's no obvious way to say "1 util = how many duty fulfillments?". (Settled: This is the central, unsolved problem).
      *   **"Theories aren't measurable against one another" is accurate.** (Settled).

  5.  **"After decades of argument, there's still no agreed solution, shelving expected-value."**
      *   **Partly Accepted, Partly Contentious:**
          *   **Accepted:** There is **no consensus solution** to the normalization problem. Decades of argument haven't yielded one. (Settled).
          *   **Contentious:** Whether this "shelves the whole expected-value approach." Proponents (MacAskill et al.) argue we *must* find *some* solution or approximation to make progress, even if imperfect. Skeptics argue the lack of solution shows the approach is fundamentally flawed. (Live debate: Is the framework salvageable without perfect normalization?).

  6.  **"The practical upshot is you should just act on your most plausible theory."**
      *   **Rejected by the Expected-Value Framework Proponents:** This is explicitly what the expected-value approach is designed to *avoid*. Proponents argue that ignoring minority theories with potentially high stakes is irrational under normative uncertainty, just like ignoring low-probability high-impact risks is irrational under empirical uncertainty. (Settled disagreement: Proponents of normative expected utility reject this "maximize credence" approach).

  7.  **"Hedging is worse than useless... split the difference satisfies neither... the betting example shows incoherence."**
      *   **Highly Contentious / Likely Wrong:**
          *   **"Worse than useless/satisfies neither":** This is an empirical claim about outcomes, not a logical necessity. Depending on the theories and the situation, a compromise *might* partially satisfy both or avoid the worst outcomes of each. (My view: Unsubstantiated generalization).
          *   **The "Betting Example" (Dutch Book):** This argument *assumes* you can make intertheoretic comparisons of value *for the purpose of betting*, which is **exactly what the normalization problem denies is possible**. If you *can't* put values on a common scale, you *can't* construct a coherent "bet" that exploits inconsistency across choices. The Dutch Book argument *presupposes* a solution to the normalization problem it's trying to dismiss! (Settled among critics of this argument: It's circular or invalid in this context. Proponents might still find it illustrative, but it's not a knockdown refutation). Hedging remains a live, debated strategy.

  **Analysis of the Ethics Engine Design Choices:**

  1.  **Rescaling (0-100 per theory within the option set):**
      *   **What it tries to solve:** Directly addresses the normalization problem. Instead of needing a universal scale, it uses each theory's *relative ranking* of the *specific options on the table*.
      *   **Does it work? Partially, with significant trade-offs:**
          *   **Sidesteps Universal Normalization:** Yes, it avoids needing to know if 1 util = 10 duties. It only cares that Theory A prefers X>Y>Z and Theory B prefers Z>X>Y. (Effective workaround for *that specific problem*).
          *   **Problem Relocation - Menu Dependence:** **Yes, absolutely.** The recommendation becomes **hostage to the option set**. This is the major flaw.
              *   **Adding a Terrible Option:** If you add an option universally considered awful by all theories, the previously "best" option under each theory now gets rescaled to 100 (instead of, say, 80), making it look *better* relative to its theory than it did before, even though the actual options haven't changed. This can swing the weighted average.
              *   **Adding a Great Option:** Conversely, adding an option one theory loves (but others hate) can depress the rescaled scores of the original options under that theory.
              *   **Strategic Option Presentation:** The person defining the menu could (intentionally or not) manipulate the outcome by including/excluding specific options.
          *   **Ignores Stakes Magnitude:** Rescaling loses information about the *absolute magnitude* of differences the theory perceives. A theory might see Option A as *slightly* better than B, or *vastly* better. Rescaling to 100 vs 0 (or 100 vs 99) erases this crucial difference, which directly impacts how much weight a minority high-stakes theory should have. (My view: This is a critical weakness, reintroducing a form of the stakes problem).
          *   **Verdict:** A pragmatic hack to get *a number* while avoiding the normalization brick wall. It makes the output highly context-dependent (menu-specific) and ignores vital information about perceived stakes. It doesn't solve the underlying problem; it changes the nature of the output. **The problem reappears as menu dependence and loss of intertheoretic stake magnitude information.**

  2.  **Confidence Floor (2%) and Ceiling (90%):**
      *   **Ceiling (90%):**
          *   **Rationale (Never 100% certain):** Philosophically defensible. Dogmatism (100% certainty) in complex domains like ethics is generally seen as epistemically irresponsible. (Broadly accepted principle in epistemology/philosophy of science).
          *   **Practical Effect:** Prevents one theory from completely dominating *just* because the user set it to 100%. Forces some minimal openness. (Sensible pragmatic guardrail).
      *   **Floor (2%):**
          *   **Rationale (Can't rule out unknown theories):** Also philosophically defensible in principle – humility suggests we haven't conceived of all possible moral truths. The "fanaticism problem" (below) is the counter.
          *   **Problem Relocation - Fanaticism & Swamping:** **Yes, this is the critical issue.**
              *   **Fanaticism Problem:** Imagine a theory you've never heard of (assigned 2%) that demands you sacrifice everything you hold dear to prevent an astronomically huge, but highly improbable, catastrophe (e.g., Pascal's Mugging in ethics). The expected choice-worthiness calculation under this framework *could* tell you to comply, even though you rationally assign it only 2% credence, because the purported stakes are so vast. The floor exacerbates this by guaranteeing *every* conceivable theory gets *at least* 2%.
              *   **Swamping:** A 2% credence in a theory positing near-infinite stakes (positive or negative) will almost always dominate the calculation, rendering the other 98% credence in other theories irrelevant. The floor ensures *some* tiny credence is *always* given to *every* included theory, making swamping by any high-stakes theory more likely.
          *   **Does the Floor Do Real Work?** It forces the user to explicitly assign *some* minimal weight to theories they might otherwise ignore (0%). This *might* be useful pedagogically to combat dogmatism. However, **its main effect is to make the system *incredibly* sensitive to the inclusion of any theory positing very large stakes, no matter how implausible.** This is widely recognized as a major, unsolved problem ("fanaticism") in the normative uncertainty literature. (Settled: Fanaticism is a serious problem; Contentious: How to solve it; My view: The floor significantly worsens this specific vulnerability).
      *   **Verdict:** The ceiling is a reasonable, low-cost guardrail against dogmatism. The floor is philosophically motivated but introduces severe practical vulnerability to fanaticism/swamping by forcing non-zero credence onto all theories. **The problem (fanaticism) reappears in an acute form.**

  **The Output Number: "Ought" or Defensible?**

  *   **Settled:** Nobody serious in this field claims these engines output *the* singular, objectively correct "ought" for all agents. Ethics engines are **decision aids under normative uncertainty**, not oracles of moral truth.
  *   **Contentious/Interpretive:**
      *   Proponents argue the output represents what you *rationally ought to do given your specific state of normative uncertainty* (your credences) and the specified theories/methods. The rescaling and credence bounds are part of the method defining this "rational given uncertainty" output.
      *   Critics argue the output is *highly contingent* on the arbitrary menu of theories included, the arbitrary rescaling method, the arbitrary credence bounds, and the user's subjective credence inputs. It's a *constructed* number, defensible only within the specific, contestable framework of that particular engine's design choices.
  *   **My View:** The output is best understood as: "Given the options presented, the moral theories considered, your stated confidence in them, *and this specific engine's algorithm for aggregating conflicting recommendations under uncertainty*, this is the option it calculates as most choice-worthy." It's a sophisticated calculation based on inputs and rules, not a direct revelation of moral truth. Its authority derives entirely from the user's acceptance of the inputs and the engine's aggregation logic.

  **Summary for Your Piece:**

  *   **Core Problem Real:** The normalization problem (incommensurable moral scales) is the fundamental, unsolved challenge for aggregating moral theories mathematically. (Settled).
  *   **Chapter's Flaws:** Overstates how often expected value defers to the favorite theory; misrepresents the hedging critique (Dutch Book is shaky); presents acting on the favorite theory as the consensus upshot (it's not within this framework).
  *   **Rescaling (0-100):** A clever workaround for direct normalization but makes the result **highly dependent on which options are presented** and **ignores the magnitude of differences** theories see between options. The problem morphs into menu dependence.
  *   **Confidence Bounds:** 90% ceiling = sensible. 2% floor = philosophically humble but **dangerously amplifies vulnerability to "fanaticism"** – tiny credences in high-stakes theories dominating everything. This is a recognized major issue.
  *   **Engine Output:** Represents a *rational choice given your inputs and this specific aggregation method*, not *the* objective moral truth. Its value is as a structured decision aid under profound uncertainty.
  *   **Field Consensus?** There is **no consensus** on solutions. There *is* consensus that the normalization problem is deep and unsolved, and that fanaticism is a serious issue for quantitative approaches. Disagreement is robust between proponents trying to refine the framework and skeptics doubting its viability. **Do not portray this as a solved problem or with false consensus.** The ethics engine teams are engaging with genuine, cutting-edge (and contentious) philosophical problems.
