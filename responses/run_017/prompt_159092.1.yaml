prompt: |-
  I have been reading psychiatric-taxonomy threads on the rationalist blogs for years — the long ones about whether ADHD is real, whether depression is a natural kind, whether the autism spectrum is an artefact of diagnostic substitution — and I finally went back to the source everyone gestures at, Ian Hacking's idea of looping effects: classify people under a kind, the people so classified change in response to being classified, and the kind then has to be revised to fit the changed people, indefinitely. I read him second-hand, mostly via blog summaries and a couple of essays, so I am not wedded to the letter of his account; what I want is the principle behind my own verdicts, which I have never managed to line up. My cases, with my gut verdicts: a diagnosis of Attention Deficit Hyperactivity Disorder received at thirty-four loops hard, and loops in a distinctive backward direction — it reorganises the person's autobiography (so that is why school was like that) at least as much as it changes anything they will do next. A dementia diagnosis that the patient is never told about and could not grasp does not loop at the level of the patient at all, though it loops plenty for the family and the carers. Telling a research volunteer that a scan shows amyloid-positive, pre-symptomatic Alzheimer disease loops hard the moment it is disclosed, because ordinary forgetfulness gets re-read as symptom. A Type 2 diabetes diagnosis loops a little, a fractured femur not at all, so there is a gradient even inside somatic medicine. Hacking's own fugue cases from the 1890s look like looping at maximum: available diagnosis, available behaviour. A category that exists mainly so services can be billed or extra exam time granted — and here I include Pathological Demand Avoidance, which as far as I know never made it into the main diagnostic manuals but has an enormous parent-led following in Britain — loops, but shallowly and instrumentally: people learn to present for it rather than to be it. And the broadening from Asperger syndrome to the autism spectrum looks like a case where looping made the category worse-behaved and yet, I want to say, more valid rather than less.

  The pair I cannot reconcile is this. I keep wanting to say that looping requires uptake by the person classified: no uptake, no loop, which is exactly why the undisclosed dementia diagnosis is my clean negative case. But I also think that a polygenic risk score for schizophrenia handed to the parents of a four-year-old loops, even though the child takes up nothing; and I think a label a person explicitly rejects still loops, because refusing a description is one way of being shaped by it. So either uptake by the classified is not required, or my negative case is not really negative. My own patched-together principle currently has three conditions, and I would rather have it tested and repaired than replaced wholesale if it can be saved: a classification of people loops to the extent that (i) it is learnable and applicable by the person classified or by those who act on them, (ii) being so classified makes a practical difference to what anybody does, and (iii) — my own addition, which I have never seen made — it is narratively incorporable, meaning it can be woven into a first-person life story and so reorganise memory and self-description retroactively, not merely redirect future behaviour. I also suspect I need a separate clause for incentive-driven looping, where the feedback runs through what is rewarded rather than through what is believed, but I cannot tell whether that is a fourth condition or a different phenomenon entirely.

  So: is there one account of when a human classification loops, and how hard, that delivers all of the above? If so, please state it precisely, say which of my cases motivates each clause, and tell me which of my verdicts it forces me to drop — I would rather give up a verdict than accept a principle with a clause that exists only to save it. I would also like it applied to three cases I have not listed: obesity being classified as a disease, schools labelling children as gifted, and an employer's burnout-risk score produced by an algorithm nobody is allowed to inspect. One further thing I care about, and which the comment sections never settle: does any of this tell us anything about whether these kinds are real, or only that they are unstable? If your answer is that looping is neutral on realism, say so plainly, and say what would have to be true for it not to be. Please lead with your bottom line in the first sentence — the principle, or the statement that no single principle exists — then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Hmm, this is a fascinating and complex query about psychiatric taxonomy and looping effects. The user has clearly done deep reading on Ian Hacking's concepts and wants help reconciling their intuitive judgments about different cases with a coherent principle. 

  Looking at their examples, I notice several key tensions: they want looping to require personal uptake (as in the undisclosed dementia case), but also recognize cases where labels affect people without their knowledge (like schizophrenia risk scores for children) or despite their rejection. Their proposed three conditions (learnability, behavioral impact, narrative incorporation) are thoughtful but seem to miss how institutional incentives create "shallow" looping.

  The user's intellectual honesty stands out - they explicitly ask to abandon inconsistent verdicts rather than force-fit explanations. Their frustration with unresolved comment-section debates about "realness" is palpable. They're not just seeking definitions but philosophical clarity.

  For the dementia case dilemma: the "no uptake" verdict holds if we distinguish direct vs indirect looping. The diagnosis loops caregivers/family (satisfying all three conditions for them) while bypassing the patient. The child schizophrenia case works similarly - parents' changed behavior creates indirect looping. 

  The rejected label case is trickier: refusing a classification still engages with it narratively ("I'm not X"), satisfying condition (iii). This preserves their intuition without requiring belief.

  Their added cases help stress-test this: obesity-as-disease likely loops through medicalization narratives; "gifted" labels through expectation effects; algorithmic burnout scores via opaque institutional actions even without employee awareness. 

  On realism: looping demonstrates interactivity, not unreality. Diabetes is "real" yet loops minimally; fugue states were "unreal" but looped intensely. Realism depends on predictive validity across contexts, not looping magnitude.

  The refined principle should explicitly separate direct (personal) and indirect (proxy) looping, retain their three conditions as amplifiers, and add institutional incentives as a distinct pathway. All their verdicts hold except the dementia case needs reframing as indirect looping.
answer: |-
  **Core Principle:** A human classification loops to the extent that it (1) **becomes known to agents (including proxies) capable of acting on it**, (2) **alters the behavior, perception, or social reality of those agents toward the classified person(s)**, and (3) **is sufficiently meaningful to be incorporated into explanatory narratives (retrospective or prospective) by relevant agents**. Looping magnitude depends on the intensity, scope, and reflexivity of these changes.

  **This principle delivers your verdicts and resolves your contradiction:**
  1.  **ADHD diagnosis at 34:** Loops hard (all 3 conditions met intensely). *Known* to the person, *alters* self-management/understanding, *narratively incorporated* via autobiography reorganization.
  2.  **Undisclosed dementia diagnosis:** **Loops indirectly** (your negative case preserved for *direct patient-level* looping). *Known* to family/carers, *alters* their behavior/perception of the patient & social reality (care arrangements), *narratively incorporated* by them ("explaining" behaviors). Fulfills the principle via proxies (agents acting *on* the classified).
  3.  **Told amyloid+ status:** Loops hard. *Known* to the person, *alters* interpretation of forgetfulness (behavior/perception), *narratively incorporated* (forgetfulness becomes symptom).
  4.  **Type 2 diabetes:** Loops a little. *Known* to patient/doctor, *alters* diet/medication (behavior), weakly *narratively incorporated* (less identity-shaping than psychiatric labels).
  5.  **Fractured femur:** No significant looping. *Known* and *alters* behavior (treatment/immobility), but minimal *narrative incorporation* beyond acute medical event.
  6.  **Fugue states (Hacking):** Loops maximally. *Known* culturally/individually, *alters* behavior (people perform fugue), deeply *narratively incorporated* (explains identity loss).
  7.  **PDA / Instrumental labels:** Loops shallowly. *Known* to person/parents/schools, *alters* behavior strategically ("presenting for it"), weakly *narratively incorporated* (tool for access, not core identity). Motives the focus on *behavioral alteration* regardless of belief.
  8.  **Autism spectrum broadening:** Loops, making the category "worse-behaved" but more valid. Increased *knowledge/application* by diverse agents, *alters* identification/access/support, enables richer *narrative incorporation* for more people. Validity increases via capturing more real phenomena through iterative looping, not despite it.

  **Resolving Your Contradiction:**
  *   **Polygenic risk score for child:** Loops via **proxies (parents)**. *Known* to parents, *alters* their perception/behavior/anxiety toward the child (e.g., over-interpreting behavior, changing environment), *narratively incorporated* by parents (future risks shape current understanding). The child needs no uptake.
  *   **Explicitly rejected label:** Still loops. *Known* to the person, *alters* their behavior (rejection/avoidance/resistance), *narratively incorporated* via active dis-identification ("I am *not* X, because..."). Refusal is a behavioral and narrative response *to* the classification.

  **Your Proposed Conditions:**
  *   **(i) Learnable/Applicable:** Captured by "becomes known to agents capable of acting on it".
  *   **(ii) Practical Difference:** Captured by "alters the behavior, perception, or social reality".
  *   **(iii) Narrative Incorporability:** Explicitly retained as crucial for deep looping. Explains the distinctive power of ADHD/autism/fugue vs. femur/diabetes.
  *   **Incentive-Driven Looping:** Not a separate phenomenon. It's a specific *mechanism* for behavioral alteration (condition 2) driven by rewards (exam time, services). Its "shallowness" results from weak narrative incorporation (condition 3) relative to identity-based looping.

  **Applied to New Cases:**
  1.  **Obesity as a disease:** Loops moderately. *Known* to patient/doctor/society, *alters* medicalization/treatment focus/stigma (behavior/perception/social reality), *narratively incorporated* variably (may reshape self-view as "ill" vs. resisted).
  2.  **"Gifted" label in schools:** Loops significantly. *Known* to child/teachers/parents, *alters* expectations/resources/self-concept (Pygmalion effect), *narratively incorporated* into identity ("I am smart/special/different").
  3.  **Algorithmic burnout-risk score (hidden):** Loops indirectly like undisclosed dementia. *Known* to employer/algorithm, *alters* employer actions (e.g., workload, monitoring, promotion), *narratively incorporated* by employer into HR strategies. Minimal/no *direct* looping for employee without disclosure.

  **Loops intensify as more conditions are met intensely and by more agents (self, proxies, institutions, culture).**

  **On Realism:** Looping is **neutral** on the underlying reality of the kind. Fugue states were intensely looping but likely not a robust natural kind; diabetes loops minimally but is biomedically "real." Looping reveals **interactive instability**, not ontological status. **For looping to challenge realism**, it must be shown that the classification *creates* the phenomena it purports to describe *without* a stable underlying basis *independent* of the looping process. Validity (as with autism spectrum broadening) arises when the looping process iteratively refines the classification towards better capturing a complex, real, but interactionally shaped phenomenon.
