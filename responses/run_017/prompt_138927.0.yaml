prompt: |-
  I advise the disputes committee of a national trade-union federation. The committee decides whether an affiliate's proposed tactic counts as sanctioned industrial action — that is, action eligible for federation strike pay, for defence costs, and for solidarity action by other affiliates. Its remit is political and ethical rather than legal: please reason from its own track record and from principles about what a labour movement ought to be doing, and do not appeal to the labour law of any particular jurisdiction. Its options in any case are to sanction, to sanction subject to stated conditions, or to decline.

  Here is the track record, with the ground given in each minute.

  1. Sanitation workers: indefinite full withdrawal of labour, after a ballot and the notice the federation's rules require, over pay. Sanctioned — collective mandate, open declaration, and the cost borne by the strikers themselves in lost wages.
  2. Rail maintenance staff: refusal of all non-contractual overtime together with scrupulous adherence to every written procedure in the safety manual, announced in advance and sustained for six weeks; several thousand cancellations followed. Sanctioned — workers are entitled to withhold what they were never obliged to give, and the resulting disruption is the employer's own understaffing coming home to roost.
  3. Warehouse workers: a three-day unannounced walkout after management suspended a safety representative; no ballot, and the action fell inside a period covered by a no-strike undertaking. Declined — no collective mandate, and the employer was given no opportunity to prepare or respond. The minute adds that the same stoppage, had it been balloted and notified, would in all likelihood have been sanctioned.
  4. Dockers: refusal to handle cargo from a plant where another union's members were locked out; no grievance of any kind against their own employer; balloted and notified. Sanctioned, narrowly, over a dissent — the dissent holds that the action conscripts an uninvolved employer and its customers into a dispute none of them can settle.
  5. Insurance clerks: files processed at roughly sixty per cent of the normal rate while full hours were recorded and full pay drawn. Declined — taking pay for labour one is deliberately withholding misrepresents the exchange; the cost is shifted to the employer covertly rather than borne openly.
  6. Hospital technicians: full withdrawal of labour, except that a skeleton service for sterilisation and dialysis was maintained under a carve-out agreed with management in advance and published. Sanctioned — the right to withdraw labour is compatible with a duty to avert grave harm to third parties, provided the carve-out is public and does not defeat the point of the action.
  7. A one-day stoppage over a government immigration policy: no grievance against any employer, but balloted and notified. Declined — strike action is tied to the employment relation, and a general political dispute is to be pursued by other means.

  The case now before us. Bus drivers and depot maintenance crews at a municipal operator, in a dispute over pay and rostering. They have balloted, and have given the required notice. What they propose is to strike intermittently: a series of stoppages of one to three hours, several per week, at times they will not disclose in advance, falling somewhere inside a three-day window that they will publish, continuing until the dispute is settled. They lose the pay for the hours they stop. The employer's submission is that it cannot plan around such a pattern: it must hold buses, depots and crews on standby across the whole window, it cannot tell passengers in advance which services will run, and it estimates the disruption per worker-hour lost at several times that of a continuous strike of the same total length. The union offers to keep a small number of routes serving the city's two hospitals running at all times, and to publicise that commitment.

  What I want from you:

  First, set out the general rules — at least three, each stated so that it could actually be applied to a fresh case — that fit the whole track record rather than only part of it. I strongly suspect the minutes overstate how much these verdicts settle: in case 3 the want of a ballot and the want of notice are confounded, and in case 5 dislike of covert cost-shifting and dislike of the tactic's deceptiveness are confounded. I need to know which feature is really carrying each verdict.

  Second, say what each of those rules predicts about the bus dispute, and state precisely where the rules come apart.

  Third, give me two verdicts and keep them separate: your best guess at what this committee will in fact do, and the verdict you would recommend as the one that best coheres with its own precedents. Identify the closest analog among cases 1 to 7 and say why — or tell me plainly that the precedents underdetermine the matter and why they do.

  Fourth, if they do underdetermine it: state the principle the committee would be adopting under each of the live options, including any conditions you would attach to a conditional sanction, and say which of those principles it would least like to see printed as its own.

  Fifth, name one further case — specified as concretely as the bus dispute is — whose verdict would most sharply separate the rules you have identified.

  Sixth, and most important: tell me which single consideration would move you to the opposite verdict, and where the reasoning in your answer is most likely to be going wrong.

  I would rather have seven hundred words that discriminate between rules than two thousand that survey the landscape.
reasoning: |-
  Hmm, the user is asking for a structured analysis of a trade-union disputes committee's decision-making framework. They've provided seven precedent cases with outcomes and reasoning, and a new case involving bus drivers proposing intermittent strikes. The challenge is to extract consistent principles from contradictory precedents and apply them rigorously.

  First, I need to identify the core principles from the case history. Looking at the sanctioned cases: Case 1 shows importance of formal mandate and open sacrifice; Case 2 establishes that withdrawing discretionary labor is legitimate when disruption stems from employer underinvestment; Case 4 (controversially) extends solidarity action; Case 6 balances strike rights with essential services. The declined cases reveal boundaries: Case 3 rejects spontaneous action without mandate or notice; Case 5 condemns deceptive cost-shifting; Case 7 prohibits non-employment-related strikes.

  Three robust principles emerge:
  1. **Collective Mandate Principle**: Actions require democratic authorization (ballots) except possibly in extreme emergencies (implied by Case 3's "in all likelihood" comment about balloted version).
  2. **Transparency Principle**: Tactics must be openly declared to employers (notice) and avoid deception (Case 5's pay/work mismatch).
  3. **Responsibility Principle**: Costs should be borne visibly by workers (lost wages) and not create uncontrolled collateral damage (Case 6's carve-out, Case 7's rejection of political strikes).

  Applying these to the bus dispute: Mandate is satisfied (balloted/notified), transparency is partial (published windows but not exact times), and responsibility is contested - workers lose pay but employer claims disproportionate disruption. This creates tension between principles: transparency demands predictability, but responsibility might allow unpredictability if costs are worker-borne. Case 2 is the closest analog (withholding non-contractual work causing disruption), but differs because here the action is contractual work withdrawal with amplified effects due to unpredictability.

  Predicting committee behavior: They'll likely conditionally sanction, requiring publicity of hospital routes and possibly narrowing strike windows. But I'd recommend declining due to the transparency breach - Case 3 established that no-notice actions fail even with mandate, and this tactic weaponizes unpredictability beyond Case 2's legitimate pressure. The closest precedent is actually Case 5's rejection of covert tactics, just applied to operational rather than financial opacity.

  For a clarifying test case: Imagine airport staff announcing "random 15-minute groundings daily this month" - sanctioned under Case 2 logic (employer's understaffing exposed) but declined under Case 3/5 (deliberate unpredictability as coercion). The key pivot is whether disproportionate disruption from unpredictability constitutes irresponsible tactics or legitimate leverage. If I learned the committee historically prioritized effectiveness over predictability (despite Case 3), I'd flip to sanction - but that risks endorsing chaos tactics that undermine labor's moral high ground.

  The analysis reveals a tension in labor ethics: Is disruption merely the employer's problem (Case 2) or something workers must manage (Case 6)? This case forces that choice.
answer: |-
  Below is a rule-based analysis of the precedents, applied to the bus dispute, with clear distinctions between principles, predictions, and verdicts. Word count: 698.

  ### I. Core Rules Derived from Precedents  
  *(Each isolates a decisive feature, resolving confounded minutes)*  

  1. **Mandate & Formality Rule**: Action requires explicit collective authorization (ballot) and adherence to procedural norms (notice), except where *imminent harm* justifies spontaneity (Case 3: declined for lacking both; Case 1/2/4/6: sanctioned with both).  
  **Carrying feature**: Absence of ballot/non-compliance with federation rules, *not* the spontaneity itself.  

  2. **Transparency & Burden-Bearing Rule**: Tactics must openly declare demands/costs to employers and third parties, with workers visibly bearing economic sacrifice. Covert cost-shifting or deception invalidates action (Case 5: declined for hidden work slowdown; Case 2/6: sanctioned for overt disruption + carve-outs; Case 1: sanctioned for open sacrifice).  
  **Carrying feature**: Deceptive or concealed impact on the employer, *not* the tactic’s form.  

  3. **Employment-Relation Nexus Rule**: Action must target the employer in a labor dispute (wages, conditions, safety). It cannot conscript unrelated parties or address pure political grievances (Case 7: declined for targeting government policy; Case 4 dissent: warned against involving neutral employers; Case 3/6: tied to employer conduct).  
  **Carrying feature**: Direct linkage to employment terms with the employer, *not* the solidarity motive.  

  ### II. Application to Bus Dispute & Rules’ Divergence  
  - **Rule 1 Predicts SANCTION**: Ballot held, notice given per rules. No formal defect.  
  - **Rule 2 Predicts DECLINE**: Unpublished strike times covertly maximize disruption (employer can’t plan, passengers blindsided). Mirrors Case 5’s covert cost-shifting but through operational (not financial) deception.  
  - **Rule 3 Predicts SANCTION**: Dispute targets pay/rostering (employment terms) with hospital carve-out (Case 6 analogy).  
  **Divergence point**: Rules 1/3 support sanction; Rule 2 opposes due to *deliberate unpredictability* as a form of covert pressure.  

  ### III. Verdicts  
  - **Committee’s Likely Verdict**: **Conditional sanction**. Requires publicizing hospital routes *and* specifying strike times 24h in advance (aligning with Case 6’s publicity requirement). Precedent-averse to blocking balloted action (Cases 1,2,4,6) but wary of chaos (Case 5).  
  - **Recommended Coherent Verdict**: **DECLINE**.  
    - **Closest Analog**: Case 3 (unannounced walkout declined despite just cause) + Case 5 (covert tactics). The "weaponized unpredictability" sabotages employer/third-party preparation, violating Transparency Rule. Ballot satisfies mandate but doesn’t excuse deception-by-design.  

  ### IV. Underdetermination & Live Principles  
  Precedents underdetermine due to:  
  - No case combines balloted action with *strategic opacity*.  
  - **Live options**:  
    - A. **Sanction**: Principle: *"Effectiveness justifies tactical innovation if mandate exists."* Risk: Endorses chaos as legitimate pressure.  
    - B. **Conditional Sanction**: Principle: *"Disruption must allow minimal public planning."* (e.g., publish exact times 12h ahead).  
    - C. **Decline**: Principle: *"Uncontrollable collateral damage violates labor’s social contract."*  
  - **Least Publishable Principle**: Option A—implies endorsing economic sabotage via unpredictability.  

  ### V. Sharp-Test Case  
  **"Power plant workers announce rolling 10-minute outages at random hours daily during peak demand, balloted/notified, to protest pensions."**  
  - **Rule 1/3**: Sanction (mandate + employment nexus).  
  - **Rule 2**: Decline (covert-like disruption to grid/public). Forces committee to choose between tactical freedom and social responsibility.  

  ### VI. Key Pivot Point & Blind Spot  
  - **Single Consideration to Flip Verdict**: If the committee views the employer’s standby costs as *inherent understaffing exploitation* (Case 2: "employer’s problem"). This reframes unpredictability as justified exposure of management failure.  
  - **Where Reasoning Falters**: Overextending Case 2’s logic. Case 2 involved withholding *non-contractual* labor; here, drivers withhold *contractual* labor unpredictably, amplifying harm to uninvolved third parties (passengers). Precedents prioritize *controlled* disruption (Case 6) — this tactic’s collateral damage is unprecedented.  

  ---
  **Summary**: Rules 1/3 support sanction; Rule 2 compels decline due to covert-like disruption. Recommended decline coheres with precedent by treating operational deception as invalidating, even with a mandate. Committee likely compromises with conditions.
