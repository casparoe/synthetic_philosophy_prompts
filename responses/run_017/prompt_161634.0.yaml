  ## Ashgrove Comprehensive: The Final Speech Day

  Good morning, students, parents, colleagues, governors, and friends of Ashgrove. It is, as always, a profound privilege to stand before you at Speech Day – a celebration of effort, endeavour, and the remarkable journey of another school year. This year, however, carries a particular weight. It is the last Speech Day as we have known it. From September, the way we recognise academic achievement at Ashgrove will change. The ranked prizes – the top-of-year awards, the subject accolades, the names etched onto the honours board – will be replaced. Every student who meets our core expectations will receive a certificate of achievement. The funds previously dedicated to prizes will support our ongoing building improvements.

  I know this decision, passed by our governors after lengthy and passionate debate, has stirred strong feelings. Amongst you today are those who championed this change, those who fiercely opposed it, and many more who are simply trying to understand what it means for Ashgrove and for our students. There are staff members across that spectrum too. And there are students, sitting right here, who have experienced Speech Day very differently over the years. That is the reality of this hall today: a community united in caring deeply about our school, but holding diverse views on this specific path.

  My task this morning is not to re-fight those battles. Nor is it to offer a manifesto disguised as an address. My task is to speak honestly, as your Principal, about what this moment signifies, acknowledging the complexity without retreating into platitudes or pretending everything is simple.

  So, let us start with what *is* changing, and what *is not*.

  We are changing a *form* of recognition. For decades, we have publicly ranked academic achievement in this hall. We have named names, awarded trophies, and maintained a board that told a cumulative story of academic excellence measured against peers. That formal, comparative structure is ending.

  **What is *not* changing is our fundamental belief in achievement itself.** We are not stepping back from high standards. We are not saying that striving for excellence doesn’t matter. The intellectual curiosity sparked in a science lab, the breakthrough in understanding a complex poem, the satisfaction of solving a difficult equation, the perseverance shown in mastering a new skill – these things remain vital. Your teachers will continue to challenge you, to push you, to recognise your individual progress and effort within their classrooms. Your reports will still reflect your attainment. Universities and employers will still see your grades. The intrinsic value of learning, of pushing your own boundaries, of mastering a subject – that endures, untouched by this change.

  Why, then, make this shift? It would be easier, perhaps, to claim it was solely and directly about lifting up those who struggle. But honesty compels me: if this change does not bring new tutoring, smaller classes, targeted bursaries, or enhanced support for those finding their path more difficult – and it does not; the funds are for bricks and mortar – then I cannot stand here and tell you it is *primarily* an act of direct aid. The tangible help for those at the bottom remains the crucial work we do every day in the classroom and through our pastoral systems – work that continues, work that needs constant attention and resource, separate from today’s decision.

  The motivation lies elsewhere. It lies in grappling with the *nature* of the recognition we were offering and the *experience* it created within our community.

  For some students, year after year, Speech Day involved sitting in this hall, listening to names that weren’t theirs, looking at a board that seemed to confirm a fixed position in an academic hierarchy. There is an unavoidable weight to that. A weight of comparison that can become heavy. The argument, powerfully made, is that this public ranking, this highlighting of relative position, carried a cost for well-being for some. That to be consistently defined, in this very public forum, by your place in an academic order – especially when that place felt low – was not merely neutral, but actively harmful. That it fostered a sense of being less seen, less valued, within the academic heart of the school.

  This is a specific kind of harm. It arises fundamentally from the *comparison* itself. It stems from the structure of the recognition, not necessarily from the lack of personal achievement. Removing *that specific source* of potential distress – the public ranking, the annual confirmation of place – is the intended aim.

  But here’s the complexity, the knot we must try to unravel honestly: if we accept that being publicly placed at the bottom carries this comparative weight, this sting, then we must also accept that being publicly placed at the top carried a comparative weight too. A weight of pride, of validation, of being seen for that specific kind of excellence in front of the whole community. Taking *that* away is also a removal. For those students who thrived under that spotlight, who found deep motivation and deserved recognition in those moments, this change means a loss. A real loss of a particular kind of honour that mattered to them, that celebrated their exceptional effort and talent in a way that resonated powerfully.

  So, we are not simply removing a negative from one group with no cost. We are removing a structure that delivered a distinct negative experience for some, *and* a distinct positive experience for others. It is not a simple subtraction of harm with pure gain. It is a shift in the kind of recognition we offer as a whole community.

  How do we weigh that? It’s tempting to reach for a philosopher's scales. But this isn’t abstract. It’s about our students. It’s about the atmosphere we cultivate. The governors, in their wisdom – and it was a close decision – ultimately judged that the potential harm caused by the public ranking system, the sense of exclusion and diminished worth it could engender in a significant number of students over time, outweighed the specific benefits of that particular form of honour for the highest achievers. They concluded that the overall health of our community, the sense that *everyone* belongs fundamentally in Ashgrove’s academic endeavour, would be better served by stepping away from this particular form of comparative celebration. The gain for those who felt the harm most acutely was deemed significant enough to warrant the loss of that specific good enjoyed by the winners.

  This doesn’t mean we are abandoning the celebration of outstanding achievement. Look around. The athletics cup still gleams. The music prize still awaits its recipient. These represent different kinds of excellence – often involving public performance, team effort, or skills displayed directly to the community. The nature of the recognition there feels different, perhaps less solely about ranking within a cohort and more about celebrating a specific, visible accomplishment. We are not erasing ambition or the desire to excel. We are refocusing *how* we formally recognise one particular domain – the broad academic journey – at our whole-school gathering.

  So, what does this new certificate represent? It is not a consolation prize. Nor is it an erasure of difference. It is, fundamentally, an acknowledgement of *presence* and *effort*. It says: you were here, you engaged, you met the challenges set before you, you are part of this learning community. It is a statement that belonging at Ashgrove isn't contingent on your rank. Your worth to this school is not defined solely by your position on a board.

  But – and this is crucial – it does not replace the vital, personal recognition that happens elsewhere. The quiet word of praise from a teacher who saw you finally grasp a concept you’d wrestled with. The congratulations from your parents when you brought home a better-than-expected result. The internal satisfaction of knowing you pushed yourself harder than before. The respect of your peers when you contribute thoughtfully in class. *These* moments of being seen, of having your effort and your progress acknowledged – these are the lifeblood of genuine achievement. They happen in the classroom, in the corridor, at home, within yourself. They are not dependent on a ceremony. They will continue. They must continue. Our challenge, as a school, is to ensure these moments flourish – not just for the few who might have stood on this stage, but for every student finding their way.

  Today is an ending. It’s the end of a tradition. For those who found joy and validation in it, that ending brings sadness, and I acknowledge that. For others, it may bring relief. For many, perhaps, it’s simply a change whose full impact is yet to be felt.

  But it is also a beginning. It’s an invitation to consider what achievement really means at Ashgrove. Is it only about being the very best in comparison to others? Or is it about becoming your *own* best? Is it about a name on a board, or about the skills, knowledge, resilience, and character you build along the way? This change challenges us to find richer, perhaps more personal, ways to celebrate the incredible diversity of talent and effort that walks through our doors every day. It asks us to ensure that *every* student feels they have a stake in our academic community, that their effort is valid, and that they belong.

  We are still Ashgrove Comprehensive. We still believe in excellence. We still believe in hard work. We still believe in the transformative power of learning. We still believe in *you* – every single one of you. What we are changing is the lens through which we formally reflect one aspect of that back to the whole community.

  This is our final Speech Day under the old order. Let us mark it by celebrating not just the names called, but the collective endeavour of this year. Celebrate the effort, the struggle, the breakthroughs – large and small – that happened in every classroom. Celebrate the community we are, and the community we strive to become. Thank you for your hard work this year. Thank you for being part of Ashgrove. I look forward to building the next chapter with you all.
