  The audience consists of applied microeconomists focused on causal identification, a sociologist skeptical of culture talk, and a philosopher concerned about causal vs. constitutive claims. I need to distinguish between rhetorically satisfying but weak objections versus genuinely damaging ones.

  Rhetorically satisfying but weak objections might include:
  - Claims that culture can't be measured (but proxies exist)
  - Arguments that the Reformation was epiphenomenal (but institutional changes matter)
