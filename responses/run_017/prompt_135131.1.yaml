prompt: |-
  I am convening a two-day adversarial collaboration on whether philosophy makes progress, and I need the joint statement that the two delegations could sign at the end of it, together with the residual-disagreement record that would accompany it.

  The two delegations are as follows. Camp C (the convergence camp) holds that philosophy makes genuine cognitive progress, but that progress has to be measured by what happens to the *space of live positions and their supporting reasons* — positions eliminated, arguments made explicit and shared, known error-types no longer re-run, distinctions drawn that later work can inhabit — rather than by the settlement of verdicts. Camp C's standing complaint is that the pessimist's metric is borrowed from inquiries whose objects admit of accumulation, and then applied without argument to an inquiry whose product is largely the articulation of a dialectical space. Camp E (the endurance camp) grants that philosophical writing becomes more sophisticated, more careful and better informed, but denies that this is progress in the sense that matters: on its view, progress requires verdicts that get settled, stay settled, and can thereafter be taken over by a later inquirer as a premise without re-running the arguments that established them, and philosophy characteristically fails this test — the same small set of questions, including the free-will question and the skepticism question, are disputed now in forms recognizably continuous with those of many centuries ago. Camp E adds that a field can improve its manners without improving its epistemic position.

  Both delegations have already agreed that the word "progress" is doing them no favors, so the statement should avoid the unglossed term and should define whatever successor notions it uses.

  Deliverable, in four parts.

  1. A numbered agreed-claims section: the theses both camps can sign, stated so that neither side would want to revise the wording. It should cover at least: what an account of progress has to be an account *of* (a question? a research programme? a field? the discipline?) and what fixing that unit does to the dispute; what would count as the field being no better off than it was; and whether there is progress that is not truth-directed in the usual sense.

  2. A disagreements table with these columns: the crux; Camp C's own position on it in wording Camp C would accept; Camp E's own position in wording Camp E would accept; the test, case, or stipulated finding both accept as genuinely bearing on the crux; Camp C's prediction about that test's outcome, written down in advance; Camp E's prediction, likewise; and what each side would count as a result that moves it. The cruxes to be covered, at minimum:

     (a) *Verdict-persistence with reason-drift.* Suppose a Position-Space Audit: for a given question Q, an idealized archive records at two times the set of live positions, the strongest known formulation of each, the standing objections, and the distribution of specialist credence. Case: the credence distribution and the verdict set are the same at both times, but the argument-sets are entirely different and strictly stronger, and three argument-forms once treated as decisive are now known to be invalid. Is Q's history progress? Which feature of the audit is the progress-making one?

     (b) *The rediscovery test.* A position P is argued for and adopted in the present; it then emerges that a structurally identical argument for P was made, lost, and forgotten long ago, and that the field had in the interim occupied every position now regarded as a rival to P. Has the field progressed, regressed, or returned? Does it matter whether the present authors could have cited the earlier argument?

     (c) *Downloadability.* Define the premise-reuse rate: the proportion of an inquiry's established results that a competent later inquirer can invoke as a premise without re-arguing them. Suppose philosophy's rate is low and stable while a mature science's is high. Is the gap a defect in philosophy, a category error about what philosophy produces, or evidence only about the kind of question philosophy retains?

     (d) *Stabilization without settlement.* Suppose a dispute on which every live move, every reply, and every known dead end is mapped and universally known, but on which credence remains dispersed and no position has been eliminated. Does a fully mapped and unsettled dispute constitute an achievement, and if so what kind?

     (e) *Secession and selection.* Suppose an audit were to show that a large share of the questions treated as philosophy at some earlier date are now handled in departments using empirical methods, while syllabi and histories over-represent the questions that stayed. Is the apparent persistence of philosophy's questions evidence of stasis, or an artifact of what a field exports and what it remembers? What would distinguish genuine progress from depletion of the question stock?

     (f) *Dissolution versus abandonment.* Some questions stop being asked because they were answered, some because they were dissolved as confused, and some because attention drifted. How can the three be told apart in a given case, and how should each be scored by the two accounts?

  3. A short verbal-dispute appendix: identify which components of the disagreement, if any, are disputes about words, about the unit of assessment, or about how much weight to give a shared description of the facts, and say what disagreement survives once those are set aside. If you conclude that some part of the dispute is not verbal but is also not evidentially tractable, say which part and why.

  4. A closing note: one claim each camp wants in the statement and the other refuses to sign, in one sentence each, with the refusal given in the refusing camp's own voice.

  Constraints. Do not cite, name, or attribute anything to any author, school, or historical period beyond what the cruxes themselves require; this is a conceptual document, not a survey. Where a crux needs a finding, stipulate it as a hypothetical audit result and make clear that it is stipulated. Every prediction must be written so that a stipulated finding could in principle come out against the side making it. If a crux admits no test both camps would accept as bearing on it, say so and diagnose the obstacle rather than inventing a test. The document will be read by the graduate students attached to each delegation and by a funder deciding whether to renew the project, so it must be intelligible to a non-specialist without being vague.
reasoning: |-
  We are creating a joint statement and residual-disagreement record for two camps in a philosophical dispute about progress in philosophy. The camps are Camp C (convergence) and Camp E (endurance). We must avoid the term "progress" without gloss and define successor notions.

  The document has four parts:

  1. **Agreed Claims**: Numbered theses both camps can sign. Must cover:
     - What an account of progress has to be an account of (question? research programme? field? discipline?) and what fixing that unit does to the dispute.
     - What would count as the field being no better off than it was.
     - Whether there is progress that is not truth-directed in the usual sense.

  2. **Disagreements Table**: With columns: Crux, Camp C's position (in their wording), Camp E's position (in their wording), Test/case/stipulated finding (both accept as bearing on the crux), Camp C's prediction, Camp E's prediction, What moves each side.

     Cruxes to cover: (a) Verdict-persistence with reason-drift, (b) Rediscovery test, (c) Downloadability, (d) Stabilization without settlement, (e) Secession and selection, (f) Dissolution versus abandonment.

  3. **Verbal-Dispute Appendix**: Identify which parts are verbal (about words, unit of assessment, or weighting) and what survives.

  4. **Closing Note**: One claim each camp wants but the other refuses, with refusal in refusing camp's voice.

  Constraints: No citations, use hypotheticals, predictions must be falsifiable, intelligible to non-specialist.

  Let's tackle each part.

  ### Part 1: Agreed Claims

  We need a set of agreed theses. Both camps agree that "progress" is problematic, so we use defined terms. Let's define:

  - **Cognitive Advancement**: The improvement in the quality of the dialectical space (Camp C's focus).
  - **Settled Verdict Accumulation**: The accumulation of stable, reusable conclusions (Camp E's focus).

  But note: Camp C doesn't think settled verdicts are the right measure, and Camp E doesn't think mere dialectical refinement counts as progress. So we must find neutral ground.

  Agreed Claims:

  1. **Unit of Assessment**: The primary unit for assessing advancement is the research tradition within a question or a cluster of interrelated questions. Fixing the unit clarifies that the dispute is about the kind of change that constitutes improvement for such a tradition.

  2. **The Field Being No Better Off**: The field would be no better off if, over time, there were no increase in the clarity of the positions, no elimination of known errors, no refinement of arguments, and no accumulation of stable conclusions that can be relied upon without re-arguing.

  3. **Non-Truth-Directed Advancement**: There can be advancement that is not directly truth-directed but is instead directed at improving the structure of inquiry, such as the identification of fallacies, the drawing of distinctions that prevent confusion, and the mapping of the logical space of positions. Both camps agree that such activities are valuable, but they disagree on whether they constitute the kind of advancement that is central to the field.

  ### Part 2: Disagreements Table

  We structure the table with the required columns for each crux.

  #### (a) Verdict-persistence with reason-drift

  - **Crux**: Whether a change in the argument-sets (without change in verdicts) constitutes advancement.
  - **Stipulated Finding**: For a given question Q, an audit at time T1 and T2 (say, 200 years apart) shows: 
    - Same set of live positions and same distribution of specialist credence.
    - The argument-sets (both for and against each position) are entirely different and strictly stronger (i.e., more logically rigorous, avoid known fallacies, etc.).
    - Three argument-forms once treated as decisive are now known to be invalid and are no longer used.

  - **Camp C's Position**: This history constitutes cognitive advancement because the field has improved its argumentative practices, eliminated known errors, and now possesses stronger reasons for the same positions. The progress-making feature is the improvement in the argument-sets and the elimination of invalid argument-forms.
  - **Camp E's Position**: This history does not constitute advancement in the sense that matters because the fundamental disagreements remain unresolved and no verdict has been settled. The field is in the same epistemic state regarding the truth of the positions. The absence of verdict accumulation is the key missing feature.

  - **Camp C's Prediction**: If such an audit were conducted on a typical perennial philosophical question (e.g., free will), we would find significant reason-drift and improvement in argument quality without verdict change.
  - **Camp E's Prediction**: For such questions, we would find that the argument-sets have improved, but without verdict accumulation, the field has not made the kind of progress that characterizes successful disciplines.

  - **What moves each**:
    - Camp C: If an audit showed no change in argument quality (e.g., same fallacies repeated, no new distinctions) over a long period, that would challenge their view.
    - Camp E: If an audit showed that after a period of reason-drift, the field converged on a verdict that stayed settled, that would support their view.

  #### (b) Rediscovery test

  - **Crux**: Whether the rediscovery of a forgotten argument and the cycle of positions indicates advancement or stasis.
  - **Stipulated Finding**: A position P is argued for and adopted in the present; then it is discovered that a structurally identical argument for P was made, lost, and forgotten long ago, and that the field had in the interim occupied every position now regarded as a rival to P. We also stipulate that the present authors could not have cited the earlier argument because it was unknown to the community.

  - **Camp C's Position**: The field has progressed because the present argument for P is made in a context where the distinctions and objections are more refined, and the field has a better understanding of the dialectical landscape. The cycle does not negate the cognitive advancement; it may even demonstrate the accumulation of dialectical tools that allow for the rediscovery to be more robust.
  - **Camp E's Position**: The field has not progressed because it has returned to a previously held position without building on past work. The cycle indicates a lack of cumulative knowledge and an inability to retain settled conclusions. The fact that the same arguments and positions recur shows stasis.

  - **Camp C's Prediction**: In such a case, the present version of P would be embedded in a richer dialectical context, with more sophisticated replies to objections, than the original.
  - **Camp E's Prediction**: The present argument for P would be essentially the same as the original, and the field would be no closer to resolution.

  - **What moves each**:
    - Camp C: If the present argument were less sophisticated than the original or if the field had lost distinctions that were once available, that would challenge their view.
    - Camp E: If the present argument were clearly superior due to accumulated insights and led to a stable consensus that endured, that would challenge their view.

  #### (c) Downloadability

  - **Crux**: Whether the low premise-reuse rate in philosophy is a defect, a category error, or evidence about the questions.
  - **Stipulated Finding**: An audit shows that the premise-reuse rate (proportion of established results that a later inquirer can use without re-arguing) in philosophy is low and stable over time, while in a mature science it is high.

  - **Camp C's Position**: The gap is not a defect but reflects a category error: philosophy produces dialectical maps and refined questions, not settled verdicts. The low reuse rate is evidence that philosophy deals with questions that are inherently resistant to closure and that require continuous re-examination.
  - **Camp E's Position**: The gap is a defect because it shows that philosophy fails to accumulate settled knowledge. The low reuse rate indicates that the field does not resolve its questions in a way that allows for building upon prior results, which is essential for epistemic advancement.

  - **Camp C's Prediction**: The audit would show that the reuse rate in philosophy is low but that the dialectical complexity and the number of well-mapped positions have increased.
  - **Camp E's Prediction**: The audit would show that the low reuse rate correlates with persistent disagreement and lack of convergence on answers.

  - **What moves each**:
    - Camp C: If the reuse rate were high for some subfields (e.g., logic) and low for others, that would support their view that the nature of the questions matters.
    - Camp E: If the reuse rate increased over time in philosophy without a loss of the distinctiveness of philosophical questions, that would challenge their view that philosophy is inherently defective.

  #### (d) Stabilization without settlement

  - **Crux**: Whether a fully mapped but unsettled dispute is an achievement.
  - **Stipulated Finding**: A dispute where every live move, reply, and known dead end is mapped and universally known among specialists, but credence remains dispersed and no position has been eliminated.

  - **Camp C's Position**: This constitutes an achievement because it represents a comprehensive understanding of the logical space and the elimination of confusion and unviable paths. It is a form of cognitive advancement that allows for more informed inquiry.
  - **Camp E's Position**: This does not constitute epistemic progress because the field remains in a state of disagreement without having resolved the question. The mapping may be useful, but without convergence on a verdict, the achievement is not epistemic but merely organizational.

  - **Camp C's Prediction**: Such mappings are common in philosophy and are valued as contributions to the field.
  - **Camp E's Prediction**: Such mappings do not lead to settlement and are often followed by continued debate without resolution.

  - **What moves each**:
    - Camp C: If stabilization consistently led to settlement in other fields but not in philosophy, that might challenge their view.
    - Camp E: If stabilization led to the identification of a new position that resolved the dispute, that would challenge their view.

  #### (e) Secession and selection

  - **Crux**: Whether the persistence of questions in philosophy is due to stasis or an artifact of export and memory.
  - **Stipulated Finding**: An audit shows that a large share of questions once treated as philosophical are now handled in empirical departments, while philosophy syllabi and histories over-represent the questions that remained.

  - **Camp C's Position**: This is evidence of advancement through export and specialization. Philosophy retains the questions that are inherently non-empirical and require conceptual analysis. The persistence of these questions is not stasis but reflects the nature of the questions.
  - **Camp E's Position**: This is evidence of stasis because the questions that remain are the ones that philosophy has failed to resolve, and the field has not made progress on them. The export of questions shows that when progress is possible, philosophy loses the question.

  - **Camp C's Prediction**: The audit would show that the questions that remained in philosophy are those that are more abstract, less empirical, and more resistant to closure.
  - **Camp E's Prediction**: The audit would show that the questions that remained are the ones that were debated in ancient times and remain unsettled.

  - **What moves each**:
    - Camp C: If the questions that seceded were no more empirical than those that remained, that would challenge their view.
    - Camp E: If the questions that remained in philosophy showed increasing consensus over time, that would challenge their view.

  #### (f) Dissolution versus abandonment

  - **Crux**: How to tell apart and score the cessation of a question due to answer, dissolution, or drift.
  - **Stipulated Finding**: We have a case where a question stopped being asked. We need to determine why.

  - **Camp C's Position**: A question is dissolved when it is shown to be based on conceptual confusion, and this is a form of cognitive advancement. Abandonment without dissolution is not advancement. Dissolution should be scored as progress because it eliminates a pseudo-problem.
  - **Camp E's Position**: Dissolution is only progress if it leads to a settled verdict that the question is confused and that verdict is accepted and not revisited. Otherwise, it is just another form of abandonment. The key is the stability of the verdict.

  - **Test**: Examine the historical record for a question that stopped being asked. Look for explicit arguments that the question is confused and whether those arguments were widely accepted and the question did not recur.

  - **Camp C's Prediction**: Many questions in philosophy have been dissolved (e.g., some problems in metaphysics) and remain dissolved, which is a form of advancement.
  - **Camp E's Prediction**: Even dissolved questions often recur (e.g., skepticism in new forms), so dissolution rarely leads to permanent settlement.

  - **What moves each**:
    - Camp C: If a dissolved question recurred without new arguments, that would challenge their view.
    - Camp E: If a dissolved question never recurred and the dissolution arguments became a stable part of the field's knowledge, that would challenge their view.

  ### Part 3: Verbal-Dispute Appendix

  We need to identify which parts are verbal, about the unit, or about weighting, and what survives.

  - **Verbal Component**: The use of the word "progress" is partly verbal. Both camps agree that philosophy changes and improves in some ways, but they label different aspects as central to progress. If we define "progress" as including both dialectical refinement and verdict accumulation, then the dispute becomes about which is primary.

  - **Unit of Assessment**: Both agree on the unit (question or research tradition). So that is not a source of dispute.

  - **Weighting**: The main non-verbal dispute is about the relative importance of dialectical refinement versus verdict accumulation. Camp C weights the former heavily and the latter lightly; Camp E does the opposite. This is a substantive disagreement about what constitutes the success of the field.

  - **Surviving Disagreement**: The core disagreement is about the epistemic goals of philosophy: Is the primary goal to achieve settled truths (Camp E) or to refine the space of reasons and questions (Camp C)? This disagreement is not entirely verbal and may not be fully tractable by evidence because it involves different conceptions of the field's purpose.

  ### Part 4: Closing Note

  - **Camp C's desired claim**: "Philosophy achieves cognitive advancement by systematically refining the dialectical space of positions and arguments, even in the absence of settled verdicts." Camp E refuses: "We cannot sign because this conflates refinement with epistemic progress, and without settled verdicts, the field does not advance its core epistemic mission."

  - **Camp E's desired claim**: "A field progresses only if it accumulates settled verdicts that can be reused without re-arguing, and philosophy's failure to do so is a defect in its methods or subject matter." Camp C refuses: "We cannot sign because this ignores the distinctive cognitive value of dialectical refinement and imposes an inappropriate standard from empirical sciences."

  Now, we write the document accordingly.
answer: |-
  ### Joint Statement and Residual-Disagreement Record  
  **Adversarial Collaboration on Advancement in Philosophy**  
  *Agreed by Delegations of Camp C (Convergence) and Camp E (Endurance)*  

  ---

  #### Part 1: Agreed Claims  
  Both delegations affirm the following theses, which define the framework for assessing "advancement" (a successor notion to "progress") in philosophy. The term "advancement" is used henceforth to avoid the ambiguities of "progress," and is explicitly defined in these claims.  

  1. **Unit of Assessment**: Advancement must be assessed at the level of a **research tradition**—i.e., a sustained inquiry into a specific question (e.g., free will) or cluster of interrelated questions. Fixing this unit clarifies that the dispute centers on whether changes within such traditions constitute improvement, and rules out conflating advancement in a tradition with advancement in the discipline as a whole.  

  2. **Advancement and Its Absence**: Advancement in a research tradition entails demonstrable improvement in the tradition’s capacity to generate, evaluate, or refine its outputs. The field would be "no better off" if, over time, there is:  
     - No elimination of demonstrably flawed positions, arguments, or methods;  
     - No increase in the rigor, clarity, or comprehensiveness of the dialectical space (i.e., the set of live positions, supporting reasons, objections, and distinctions);  
     - No accumulation of reusable insights (whether verdicts, distinctions, or error-diagnostics); and  
     - No change in the tradition’s ability to avoid recurring errors or to export questions to more suitable domains.  

  3. **Non-Truth-Directed Advancement**: Advancement can occur without being directed at factual truth-accumulation. Both camps agree that improvements in the dialectical space—such as mapping dead ends, formalizing argument-forms, exposing conceptual confusions, or sharpening distinctions—constitute genuine cognitive gains, even if they do not yield settled verdicts. Such gains are not merely "manners" but enhance the tradition’s epistemic hygiene.  

  ---

  #### Part 2: Disagreements Table  
  The table below details unresolved cruxes. For each, a stipulated finding (hypothetical audit result) is provided as a test. Predictions are falsifiable and written as conditional on the test. "Moves" columns specify what finding would shift each camp’s position.  

  | Crux | Camp C’s Position (in C-accepted wording) | Camp E’s Position (in E-accepted wording) | Test/Case/Stipulated Finding (Accepted by Both) | Camp C’s Prediction | Camp E’s Prediction | What Moves Camp C | What Moves Camp E |
  |------|--------------------------------------------|--------------------------------------------|------------------------------------------------|----------------------|----------------------|-------------------|-------------------|
  | **(a) Verdict-persistence with reason-drift**<br>*Does improved argumentation without verdict change constitute advancement?* | The change constitutes **dialectical refinement**, the core of advancement. Eliminating invalid argument-forms and strengthening reasons improves the tradition’s epistemic hygiene, even if credence distributions remain static. | The change is **not epistemic advancement**, as the unresolved dispute persists identically. Improvement in argument quality without verdict convergence is merely technical sophistication, not cognitive gain. | *Stipulated audit for question Q (e.g., free will) at T1 (200 years ago) and T2 (now):* Identical set of live positions and specialist credence distribution; entirely different and strictly stronger argument-sets; three once-decisive argument-forms now known invalid and retired. | In most perennial questions (e.g., free will), audits will show reason-drift dominates: argument-sets strengthen and errors are eliminated, but verdicts rarely converge. | In such questions, audits will show that despite reason-drift, verdict instability persists, and no position gains durable consensus. | Finding no improvement in argument-sets (e.g., same fallacies repeated, no new distinctions). | Finding sustained verdict convergence after reason-drift (e.g., one position gains >80% specialist credence for >50 years). |
  | **(b) Rediscovery test**<br>*Does rediscovering a forgotten position indicate advancement?* | The field has advanced through **dialectical enrichment**. The modern reinstatement of P benefits from refined distinctions and objections absent in the past, deepening the tradition’s self-correction capacity. | The field has **regressed through memory failure**. Reoccupying positions without retaining past insights shows stagnation; the tradition lacks mechanisms to preserve and build on prior work. | *Stipulated finding for position P (e.g., compatibilism):* P is argued anew today; a structurally identical argument for P was made, lost, and forgotten long ago; the field cycled through all rival positions in the interim. Present authors could *not* cite the earlier argument (unknown to community). | Modern arguments for P will be embedded in a richer dialectical context (e.g., more nuanced replies to objections) than the original. | Modern arguments for P will be no more cogent or consensus-building than the original. | Finding the modern argument less sophisticated than the original (e.g., ignores known objections). | Finding the modern argument leads to durable consensus (>75% specialist credence for >30 years). |
  | **(c) Downloadability**<br>*Is philosophy’s low premise-reuse rate a defect?* | The low rate reflects a **category error**: philosophy produces dialectical maps, not verdicts. The gap with science stems from philosophy’s focus on questions resistant to closure, not a failure. | The low rate is a **defect in epistemic efficiency**. It shows philosophy’s inability to resolve questions in a reusable way, hindering cumulative inquiry. | *Stipulated audit:* Philosophy’s premise-reuse rate (proportion of established results invocable without re-arguing) is low (<20%) and stable; a mature science’s rate is high (>80%). | The audit will show philosophy’s dialectical complexity (e.g., positions mapped, distinctions drawn) increased, justifying low reuse. | The audit will show low reuse correlates with persistent disagreement and no verdict convergence. | Finding high reuse in subfields with similar questions (e.g., formal epistemology). | Finding rising reuse in philosophy without empirical encroachment (e.g., reuse >50% in core areas). |
  | **(d) Stabilization without settlement**<br>*Does mapping a dispute without resolution constitute advancement?* | A fully mapped dispute is an **achievement in clarity**. It eliminates confusion and dead ends, allowing more informed inquiry, even if unsettled. | An unsettled map is a **failed epistemic state**. It reflects the tradition’s inability to resolve the question, rendering the map a static artifact, not progress. | *Stipulated finding for dispute D (e.g., mind-body problem):* All live positions, objections, replies, and dead ends are universally known and mapped; specialist credence remains dispersed; no position eliminated. | Such mappings are common and valued (e.g., via formal logic or surveys), advancing the tradition’s self-understanding. | Such mappings rarely endure; new arguments disrupt them, proving their instability. | Finding mappings consistently lead to settlement in other fields (e.g., mathematics). | Finding a mapping resolves D (e.g., >90% agree one position is untenable within 10 years). |
  | **(e) Secession and selection**<br>*Does question export indicate stasis or advancement?* | **Export is advancement via specialization**. Philosophy retains questions requiring conceptual analysis; apparent persistence reflects selective memory, not stasis. | **Persistence is stasis via failure**. Philosophy retains questions it cannot resolve; export shows progress occurs only when questions leave. | *Stipulated audit:* 70% of questions treated as philosophy 300 years ago are now handled empirically (e.g., in psychology); syllabi/histories over-represent retained questions (e.g., free will). | Retained questions will be less empirical (e.g., reliant on a priori methods) and more dialectically complex than exported ones. | Retained questions will show no convergence (e.g., credence dispersion >40%) and recur in ancient forms. | Finding retained questions are no less empirical than exported ones. | Finding retained questions converge (e.g., one position >70% credence). |
  | **(f) Dissolution vs. abandonment**<br>*How to score when a question ceases?* | **Dissolution (exposure of confusion) is advancement**; it eliminates pseudo-questions. Abandonment without reason is not. Distinctions are scorable gains. | **Only stable dissolution counts as advancement**; abandonment is neutral. Dissolution must yield a reusable verdict (e.g., “Q is ill-posed”) to be progress. | *Stipulated finding for defunct question Q (e.g., vitalism):* Audits distinguish dissolution (explicit arguments that Q is confused), abandonment (no reason, attention drifts), and settlement (Q answered). | Dissolutions will correlate with new distinctions (e.g., conceptual clarifications) that prevent recurrence. | Dissolutions will often be reversed (e.g., Q reasked in new terms), showing no stable gain. | Finding a dissolved question reemerges identically, without new arguments. | Finding a dissolution verdict becomes reusable (e.g., >80% cite it without re-arguing for >50 years). |

  ---

  #### Part 3: Verbal-Dispute Appendix  
  The delegations identify the following components of the disagreement as "verbal" (resolvable by clarifying terms, units, or weights) and isolate the residual substantive disagreement.  

  - **Verbal Disputes**:  
    - **Terminology**: Disagreement over labeling dialectical refinement as "advancement" is partly verbal. Camp C uses "advancement" inclusively (encompassing dialectical gains); Camp E uses it restrictively (requiring verdict accumulation). Clarifying definitions in Part 1 resolves this.  
    - **Unit of Assessment**: Both agree on the research tradition as the unit. No dispute here.  
    - **Weighting**: Disagreement over the *relative weight* given to dialectical refinement vs. verdict accumulation is not verbal but reflects divergent priorities. Both accept both occur; they dispute which is primary for the field’s success.  

  - **Residual Substantive Disagreement**:  
    The non-verbal core is whether **epistemic advancement requires verdict accumulation** (Camp E) or is **fully realizable through dialectical refinement alone** (Camp C). This is not fully tractable by evidence because it hinges on irreducible normative commitments:  
    - Camp E prioritizes *knowledge-as-accumulation* (modeled on sciences) as the goal of inquiry.  
    - Camp C prioritizes *knowledge-as-articulation* (mapping conceptual spaces) as philosophy’s distinctive purpose.  
    Empirical tests (e.g., audits) can inform but not resolve this, as each camp interprets data through their normative lens (e.g., Camp E sees reason-drift as "merely technical," Camp C sees verdict persistence as "not the point").  

  ---

  #### Part 4: Closing Note  
  - **Camp C’s refused claim**: "Philosophy achieves epistemic advancement primarily through the accumulation of settled verdicts that permit premise reuse without re-arguing."  
    *Refusal by Camp E*: "We refuse because this conflates philosophy with empirical sciences; advancement requires verdict stability, which philosophy lacks."  
  - **Camp E’s refused claim**: "Advancement in philosophy is adequately demonstrated by dialectical refinement alone, even in the permanent absence of verdict convergence."  
    *Refusal by Camp C*: "We refuse because this ignores that verdict accumulation is the hallmark of successful inquiry; without it, refinement is merely procedural."  

  ---  
  **Signed,**  
  Delegation of Camp C (Convergence)  
  Delegation of Camp E (Endurance)  

  *This document, drafted without attribution to specific authors or schools, is a conceptual record of agreements and unresolved disagreements. It is intended for use by graduate students and funders of the adversarial collaboration project.*
