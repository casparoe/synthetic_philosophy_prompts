prompt: |-
  I'm a backend dev, no philosophy training whatsoever, so apologies in advance if I'm describing something that has an obvious textbook name -- though that's kind of the question.

  I keep noticing the same shape in really unrelated places and I want to know whether it's been picked out and named before, because right now the only way I have of talking about it is my own clumsy version.

  The shape: a system -- animal, program, person, whatever -- has a set of routines it can run. Which routine gets started next is genuinely sensitive to the situation: different situation, different routine, and it can still change course right up until the moment the routine starts. But once a routine has started it runs to completion no matter what. If the world changes halfway through in a way that makes the routine pointless or actively bad, the system keeps going anyway. And it's not that it fails to notice -- it's that nothing it notices can get any grip until the routine finishes. Then it's flexible again, picks the next routine, and goes rigid again. All the flexibility is at the seams; all the rigidity is inside the blocks.

  Three places I see it:

  - The thing I half remember from a pop-science book I read years ago. A digger wasp drags its paralyzed prey to the burrow, leaves it at the entrance, goes inside to check the burrow, comes back out, drags the prey in. If you move the prey a few inches while she's inside, she comes out, drags it back to the entrance, leaves it, goes in to check again -- and you can apparently keep doing that to her. I genuinely can't vouch for the details, so don't hold me to them; the point is the shape. She can "reconsider" at the entrance and not mid-sequence.

  - My own code, which is where I started thinking about this. I've got a job runner where jobs are made of stages. Between stages the job re-reads config, and a scheduler can cancel it, reroute it, reorder the remaining stages. Inside a stage it's completely non-preemptible -- no signal, no cancel, no partial rollback, the stage either finishes or the whole process dies. Increasingly I think of the "intelligence" of that system as living entirely in the gaps between stages, and I have no idea whether that's a deep observation or just a fact about my implementation.

  - Me, annoyingly. I can deliberate about whether to start explaining something in an argument, and I can deliberate after each sentence about whether to keep going, but once I've started a sentence I finish it -- even in the cases where I realize halfway through that it's wrong. I finish the sentence and then correct it, every single time. Same with a bunch of other things I won't bore you with.

  So:

  1. Does this configuration -- flexible at the seams, rigid inside the blocks -- have a name of its own? I have a vague memory that there's a word for the wasp case specifically, but as far as I understand it that word just means "rigid routine," and it doesn't seem to cover the part I find interesting, which is that the very same system is flexible elsewhere.

  2. The part I actually care about. I keep loosing an argument with a friend about whether this shape is compatible with doing something freely, or whatever the right phrasing is. She says: sure, the wasp is mechanical, but a creature that can select which routine to run, and re-select at every seam, is not mechanical -- that just is what deliberating is. I say: that only moves the mechanism up one level, because whatever does the selecting at the seam is itself either running a routine or it isn't, and if you add another layer of flexible selection on top of that you get exactly the same question again. Neither of us can say what would even settle it. Is there an established name for this disagreement? Is there an established account of what you'd have to add to "flexible selection over rigid routines" to make it stop being mechanical -- or an established argument that nothing you could add would ever be enough?

  3. Boundary cases, because if I get a definition I want to know what it excludes. (a) A system with exactly one seam, right at the start, deterministic after that -- a pocket calculator, basically. (b) A system whose seams arrive at random times rather than when the situation calls for one. (c) A system that can be interrupted by anything at all but has exactly one fixed response to any interruption. (d) A system where the seams are real but the blocks are a millisecond long. Which of these are the same phenomenon as what I described and which aren't, and what's the principled difference?

  If there genuinely isn't a name for it, then coin one and define it, and say what falls outside. Please don't just hand me the word for the wasp thing and stop -- a name that only covers the rigidity and ignores the seams is definately not what I'm after, and I'll be able to tell if that's what I got.
reasoning: |-
  Okay, the user is a backend developer who's noticed a recurring pattern in systems—both biological and artificial—where flexibility exists only at specific "seams" between rigid routines. They've observed this in a digger wasp's behavior, their own job runner code, and even in human actions like speaking. They have three main questions: whether this pattern has a name, whether it's compatible with free will, and how to define its boundaries.

  First, I need to address the pattern itself. The key elements are intermittent flexibility (at seams) and intra-routine rigidity. The wasp example is a classic ethology case—Tinbergen's experiment showing fixed action patterns. But the user is clear they don't want terms that only focus on rigidity (like "fixed action pattern" alone). The computational parallel is atomic transactions or reentrancy points. The human cognition angle resembles the "unit task" model in psychology. Synthesizing these, I recall "discrete event systems" in control theory, but that might be too broad. The term "action-phase model" (Heckhausen) captures the oscillation between deliberation and implementation. "Bursty control" is another option—emphasizing the punctuated flexibility.  

  For the free will debate, the user's friend argues that flexible selection at seams constitutes deliberation, while the user sees it as just shifting the mechanism upstream. This echoes the philosophical "regress of control" problem (e.g., who controls the controller?). Compatibilism (e.g., Dennett) could bridge this—arguing that mechanistic doesn't preclude "free" if it responds to reasons. The core issue is whether top-level flexibility (even if algorithmic) satisfies freedom. The user might benefit from distinguishing "freedom from coercion" vs. "freedom from causation."  

  Boundary cases:  
  (a) Single-seam systems (like calculators) lack re-evaluation, so they're excluded.  
  (b) Randomly timed seams (e.g., probabilistic interrupts) still allow flexibility but lose goal-directedness.  
  (c) Fixed interruption responses are just nested rigidity—no true seam flexibility.  
  (d) Microsecond routines blur the line, but if seams allow meaningful choice, it's the same phenomenon scaled down.  

  The user's frustration with oversimplified terminology is palpable. They want a term that honors the interplay of flexibility and rigidity. "Action-Seam Architecture" might work, emphasizing the structured points of adaptation. Alternatively, "Modular Volition" captures the encapsulated autonomy.  

  Underlying all this, the user seems to seek validation that their architectural insight is non-trivial. They're also wrestling with determinism vs. agency—a deeper existential itch masked by a terminology request. Naming the pattern might help them articulate its philosophical implications better.
answer: |-
  You've hit on a profound and recurring pattern that *absolutely* has names and deep connections across fields – you're just seeing it with fresh eyes, which is valuable. Your "flexible at seams, rigid inside blocks" configuration is a fundamental architectural principle in systems ranging from biology to computing to cognition. Here's the breakdown:

  1.  **The Pattern's Name(s):**
      *   **Overarching Concept:** This is most precisely described as **Discrete Event Dynamic Systems (DEDS)** or **Hybrid Dynamical Systems** (specifically, a subclass where discrete state transitions occur at well-defined "seams" or events, and behavior between events is continuous or deterministic). The "seam" is the discrete event trigger (situation change, stage completion, sentence end).
      *   **Psychological/Cognitive:** In human cognition and decision-making, this resembles the **Action-Phase Model** (Heckhausen & Gollwitzer) or **Rubicon Model**. It describes the shift from a *deliberative* phase (flexible, assessing options at seams) to an *implemental* phase (rigid, focused execution of the chosen action/intention until completion or a natural stopping point). Your sentence-finishing example is textbook.
      *   **Ethology (Animal Behavior):** The wasp example illustrates a **Fixed Action Pattern (FAP)** triggered by a **Sign Stimulus** (the prey at the burrow entrance). Crucially, the *completion* of the FAP acts as the seam allowing new assessment. The *rigidity* of the FAP is key, but the *flexibility at the seam* (re-triggering based on the *current* state) is inherent in the model.
      *   **Computer Science/Engineering:**
          *   **Atomic Transactions / ACID:** In your job runner, stages are "atomic" – they run to completion (Commit) or have no effect (Abort, requiring restart/rollback at a seam). Config changes only happen at transaction boundaries (seams).
          *   **Non-Preemptive Scheduling / Run-to-Completion:** Tasks/stages cannot be interrupted mid-execution; context switches only occur at defined points (seams like completion or blocking I/O).
          *   **State Machines:** The system is in a discrete state (running a routine). Inputs (world changes) are only evaluated during *state transitions* (the seams), triggering the next state/routine.
          *   **Reentrancy Points:** Code is designed to be safely interruptible *only* at specific, well-defined points (seams).
      *   **Coined Term (if you want one):** **Bursty Control** or **Seam-Triggered Volition**. This emphasizes the intermittent nature of flexible control ("bursts" at seams) contrasted with the deterministic execution between them.

  2.  **The Free Will/Mechanism Debate (The Established Account):**
      You and your friend are re-enacting a core philosophical debate:
      *   **Your Friend's View:** This aligns with **Compatibilism**. Compatibilists argue free will *is compatible* with determinism. What matters is that the "selection at the seam" is *responsive to reasons* (the situation, goals, arguments), happens *without external coercion*, and potentially involves *evaluation/choice*. The flexibility *at the seams* constitutes the locus of free will or deliberation, even if the underlying mechanism is physical/deterministic. The wasp might be a pure automaton, but a human (or sophisticated AI) doing complex, reason-based selection *at the seams* exhibits free will.
      *   **Your View:** This aligns with **Incompatibilism (specifically Hard Determinism or Illusionism)**. You're pointing to the **Regress of Control Problem**: *What controls the selector at the seam?* If the selector is itself a deterministic routine (even a complex, probabilistic one), then the entire system is mechanical. Adding layers just pushes the "uncaused cause" requirement further up, never resolving it. True freedom requires something *outside* the deterministic chain (Libertarian Free Will), which many argue is impossible/illusory.
      *   **The Established Name & Account:** This is the **Free Will Determinism Debate**, specifically the **Regress of Control Argument** within it. Philosophers like **Daniel Dennett (Compatibilist)** argue that the *ability to respond to reasons and avoid coercion* at the points of choice (the seams) *is* what freedom consists of – no regress-breaking magic is needed. Philosophers like **Galen Strawson (Hard Incompatibilist)** argue precisely your point: true responsibility requires being the *ultimate source* of one's choices, which determinism precludes, and compatibilism just hides the mechanism.
      *   **What Would Settle It?** Nothing empirically, yet. It's fundamentally metaphysical. Evidence could *weaken* positions (e.g., neuroscience showing decisions made before conscious awareness supports your view; complex adaptive behavior in AI supporting your friend's). But the core question – "Is reason-responsive, uncoerced selection sufficient for freedom, or must there be an uncaused cause?" – remains a matter of philosophical commitment. **Compatibilism** is the dominant view in contemporary philosophy of mind and action, precisely because it defines freedom *within* a mechanistic universe in a way that aligns with moral responsibility practices.

  3.  **Boundary Cases & Principle:**
      The core principle is: **Flexible, context-sensitive *selection* of behavior occurs *only* at well-defined *discrete events* (seams), and the behavior *between* seams executes deterministically/rigidly *to completion* without being influenced by new inputs (except catastrophic failure).**

      *   **(a) Pocket Calculator (One seam at start):** **OUT.** There's only *one* selection point (input parameters). Once started, no flexibility exists – no later seams allow re-selection based on changing context or intermediate results. It lacks *intermittent* flexibility.
      *   **(b) Random Interrupt Seams:** **PARTIALLY IN, but Degenerate.** Flexibility exists at seams (interrupts). However, the seams are not triggered by the *situation* or the *task state* – they are random. This removes the *context-sensitivity* and *goal-directedness* crucial to your examples. The system can't *intelligently choose* when to re-evaluate; it's forced to by noise. It has rigidity inside blocks and flexibility at seams, but the *trigger* for seams is not intelligent/situational.
      *   **(c) Fixed Interruption Response:** **OUT.** While interruptible, the response is *fixed*. There's no *selection* or *flexibility* at the seam. It's just triggering another rigid routine. This is simply nesting rigid routines (like subroutines), not having genuine points of flexible choice between them. The "seam" lacks the flexible selection aspect.
      *   **(d) Microsecond Blocks:** **IN, but Scaled.** The *principle* is identical: flexibility exists only at the seams (every millisecond), and behavior within the millisecond block is rigid/non-interruptible. If the selection *at the seam* is context-sensitive (even if very fast/deterministic), it fits the pattern. This is how real-time systems often work (e.g., control loops with fixed time slices). The difference is one of granularity, not kind. If the blocks are so short that "completion" loses meaning or selection happens continuously, it blurs out of the pattern.

  **In Summary:**

  You've identified a fundamental design pattern: **Intermittent Context-Sensitive Selection with Intra-Task Rigidity.** It's called **Discrete Event Dynamic Systems** generally, **Action-Phase Models** in cognition, and relies on concepts like **Fixed Action Patterns** (triggered by sign stimuli), **Atomic Transactions**, **Non-Preemptive Scheduling**, and **State Machines** in specific domains.

  The debate with your friend is the classic **Free Will vs. Determinism** clash, specifically the **Regress of Control Argument**. Compatibilists see the flexible selection at seams as sufficient for freedom; Incompatibilists see the underlying determinism (even of the selector) as negating it. This debate hinges on definitions and is not empirically resolvable.

  The pattern requires both **intermittent, context-sensitive selection points (seams)** and **deterministic execution to completion between seams**. Cases lacking either the intermittent flexibility (a), the context-sensitivity (b), or the genuine selection at the seam (c) fall outside the core pattern. Scaling (d) doesn't break it if the principle holds.

  Your insight is spot-on: intelligence/agency/flexibility in these systems *does* reside primarily at the seams. Whether that constitutes "true freedom" depends entirely on whether you demand an uncaused cause (Incompatibilism) or accept reason-responsive selection within a causal chain (Compatibilism).
