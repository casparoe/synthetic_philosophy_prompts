  **Sestina on Relations**  

  The old man pours the tea, a patient **FATHER**.  
  His word once steered the town, a firm **RULER**.  
  Beside him, slicing bread, the quiet **HUSBAND**.  
  Across the room, his blood, the younger **BROTHER**.  
  A knock: the neighbor known, a trusted **FRIEND**.  
  Behind him, shadowed, waits a worn **STRANGER**.  

  They seat the tired **STRANGER** near the hearth.  
  The **FATHER** offers warmth, a second cup.  
  The **FRIEND** recounts the roads beyond the hill.  
  The **RULER** measures worth in work and wheat.  
  The **BROTHER** brings a blanket, thick and gray.  
  The **HUSBAND** notes the mud upon the floor.  

  The **HUSBAND** sweeps the tracked-in dirt away.  
  The **STRANGER**’s eyes hold storms no name can hold.  
  The **BROTHER** asks, “What brought you past the ridge?”  
