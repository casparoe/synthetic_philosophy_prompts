  We are designing a decision procedure for the Species Listing Panel. The procedure must be practical, legally robust, and transparent. It must address the recurring challenges (the "five shapes") and ensure consistency and defensibility in the face of judicial review.

   Key elements of the procedure:
   1. Questions in order, with sufficiency criteria and responsibility.
   2. Clear stopping points (gates) for a "no" decision.
   3. Points where value judgments are required, with explicit hand-off to the Panel and instructions to record as such.
   4. Rules for conflicting evidence and for consistency across cases.
   5. Handling of the five recurring scenarios, including provisional listing for incipient divergence.
   6. A template for published reasons.

   The procedure will be based on a multi-criteria approach, with the primary goal being to determine if the taxon in question qualifies as a "species" (or equivalent protected unit) under the statute, while acknowledging that the concept is not universally settled. We will use a combination of criteria (morphological, genetic, ecological, reproductive isolation) and a rule for when they conflict.

   We note that the statute protects by name, so we must also consider whether the named taxon is valid and whether it corresponds to a biologically meaningful unit.

   Steps of the procedure:

   Step 1: Formal Validity Check (Gate 1 - Stop if failed)
     Question: Is the taxon formally described and validly published under the relevant nomenclatural code? (This addresses shape (v))
     Sufficient answer: A peer-reviewed publication or a recognized taxonomic authority that establishes the name and provides a description. The proposer must supply this.
     If not, then stop: the taxon cannot be listed. (But note: the Panel might consider a provisional listing if the taxon is new and the evidence is strong? But the problem states that a population that hasn't been formally described is unlistable. So we stick to the gate: no formal description -> no listing.)

   Step 2: Type Specimen and Application of the Name (Gate 2 - Stop if failed)
     Question: Does the type specimen (or the type series) clearly correspond to the population being proposed? (This addresses the flagship case, where the type is in the middle of a cline)
     Sufficient answer: The proposer must provide evidence (morphological, genetic, or other) that the population in question is consistent with the type. If the type is in the middle of a cline and the proposed population is at one end, then the name might actually apply to the whole cline. The Panel may need to consult taxonomic experts or the literature.
     If the evidence shows that the type specimen is not part of the population being proposed (or that the name has been misapplied), then stop: the taxon as proposed is not the taxon with the protected name.

   Step 3: Assessment of Distinctness (using multiple lines of evidence)
     We will collect evidence on:
      a) Morphological distinctness
      b) Genetic distinctness (at the population level, not just a few markers)
      c) Ecological distinctness (habitat, host, etc.)
      d) Reproductive isolation (if applicable)

     For each line of evidence, we will ask:
      - Is there evidence of distinctness? (sufficient: statistically significant differences, or clear qualitative differences)
      - What is the strength of the evidence? (strong, moderate, weak, or none)

     Responsibility: The proposer must supply the evidence. The Panel may seek additional expert opinion if the evidence is unclear.

     Rules for conflicting evidence:
      - If all lines of evidence point to distinctness (strong in at least two, and none contradicting), then move to Step 4.
      - If one or more lines of evidence are conflicting, then:
          a) If the genetic evidence (genome-wide) shows strong distinctness (e.g., Fst > 0.25 or equivalent) and at least one other line of evidence (morphology, ecology, or reproductive isolation) supports distinctness, then move to Step 4.
          b) If the genetic evidence is weak (e.g., Fst < 0.05) but morphological and/or ecological distinctness is strong and reproductive isolation (if applicable) is present, then we must consider the possibility of incipient divergence (shape (iii)) and go to Step 3.5 (Provisional Listing Assessment).
          c) In cases of strong conflict (e.g., genetic data shows panmixia but morphology and ecology show strong distinctness) and the taxon is asexual or selfing (shape (iv)), then we skip reproductive isolation and rely on morphological and ecological distinctness. If these are strong, then move to Step 4. But note: we must be consistent and record which criteria are doing the work.

     Explicit rule for consistency: The written reasons must state which criteria were met and which were not, and which criteria were decisive. In particular, if a criterion is not met but the taxon is still listed, the reasons must explain why (e.g., because the taxon is asexual and reproductive isolation is not applicable, and morphological/ecological distinctness is strong).

   Step 3.5: Provisional Listing Assessment (for incipient divergence, shape (iii))
     Condition: When there is evidence of divergence (e.g., in morphology, ecology, or genetics) but the genetic distinctness is weak (and the divergence is geologically recent) and reproductive isolation is incomplete.
     Question: Is there a plausible threat that without protection, the population might be lost before divergence completes (if it is going to complete) and that this would represent a loss of evolutionary potential or unique ecological function?
     This is a value judgment: The Panel must decide whether the purpose of the statute is to protect such incipient species. The Panel must record this as a value judgment.
     If yes, then the Panel can recommend provisional listing for a fixed period (e.g., 10 years, or a generation time appropriate to the organism, but not less than 5 years). The review interval should be set based on the generation time and the expected rate of divergence (if known). Evidence of divergence having completed would be the development of strong reproductive isolation or strong genetic distinctness (e.g., Fst > 0.25) across multiple genomic regions. Evidence of stalling would be no change in distinctness over the review period.

   Step 4: Assessment of Conservation Need and Value Judgment
     Even if the taxon is distinct, the Panel must consider the statutory purpose. The law may require protection of any distinct taxon, but the Panel might have discretion in how to allocate resources? However, the problem says that listing triggers mandatory actions. Therefore, we assume that if the taxon is distinct and valid, then it qualifies for listing. But note: the statute might have a purpose that is not just about distinctness. For example, it might be to preserve separately evolving lineages, to maintain ecological function, or to protect particular organisms from particular harms.

     At this step, the Panel must explicitly decide on the purpose for this taxon. This is a value judgment. The Panel must record that they are making a value judgment about the purpose of the statute as applied to this taxon.

     The procedure cannot resolve the question of which statutory purpose applies. The Panel must decide and record it.

     Note: The problem states that listing is not a courtesy and triggers mandatory actions. Therefore, the Panel might not have discretion to not list a distinct taxon. But if the taxon is not distinct, then it fails at Step 3.

   Step 5: Decision and Documentation
     If the taxon passes Step 1 and 2, and Step 3 (or 3.5) leads to a positive assessment, then the Panel recommends listing (or provisional listing). Otherwise, the recommendation is not to list.

     The written reasons must include:
      - The evidence for formal validity and type match.
      - The assessment of each line of evidence (distinctness in morphology, genetics, ecology, and reproductive isolation) and the resolution of any conflicts (with reference to the rules for conflict).
      - If provisional listing is recommended, the reasons and the review interval.
      - The value judgment about the statutory purpose (if invoked) and the reason for the judgment.

   Template for published reasons:

     [Taxon name] Listing Decision

     1. Proposal: [Summary of the proposal and proposer]
     2. Formal Validity: [Description of how the taxon meets the formal requirements, including reference to the type specimen and its application to the proposed population]
     3. Assessment of Distinctness:
          a) Morphology: [Findings and strength of evidence]
          b) Genetics: [Findings and strength of evidence]
          c) Ecology: [Findings and strength of evidence]
          d) Reproductive isolation: [Findings and strength of evidence, or note if not applicable]
     4. Resolution of Conflicting Evidence: [Explanation of how conflicts were resolved and which criteria were decisive]
     5. Value Judgments: [If any, including the purpose of the statute and/or the decision for provisional listing]
     6. Decision: [List, provisional list (with review date), or not list]

   Now, we run the procedure on the three cases:

