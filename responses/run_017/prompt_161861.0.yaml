answer: |-
  ### Decision Procedure for Species Listing Panel

  **Core Principles**:
  - Prioritize evidence-based gates to minimize judicial review risk.
  - Explicitly separate scientific assessment (evidence) from value judgments (statutory purpose).
  - Document decisional pathways for consistency.
  - Address the "five shapes" via targeted rules.

  ---

  #### Decision Procedure Flow

  **Step 1: Formal Validity Gate**  
  **Question**: Is the taxon formally described with a valid type specimen?  
  - *Sufficient answer*: Peer-reviewed publication designating a type specimen, supplied by the proposer.  
  - *Gate*: If **no**, stop. Reason: "Taxon not formally described; statutory protection requires a valid name."  
  - *Handles*: Shape (v) – undescribed populations are unlistable regardless of ecological significance.

  **Step 2: Lineage Isolation Assessment**  
  **Question**: Is there evidence of reproductive isolation or genetic distinctness?  
  - *Sufficient answer*:  
    - **Sexual taxa**: Data on hybrid fertility/viability OR strong genomic divergence (e.g., F<sub>ST</sub> > 0.25).  
    - **Asexual/selfing taxa (Shape iv)**: Evidence of morphological/ecological distinctness (e.g., PCA clustering, habitat specialization).  
  - *Responsibility*: Proposer supplies evidence; Panel’s geneticist/ecologist assesses.  
  - *Conflict rule*:  
    - If lines of evidence conflict (e.g., genetics vs. morphology), **prioritize genomic data** (whole-genome > specific loci).  
    - If conflict persists, proceed to Step 3 but **document the conflict** in reasons.  
  - *Gate*: If **no isolation or distinctness**, stop. Reason: "Insufficient evidence of evolutionary independence."

  **Step 3: Ecological/Morphological Distinctness Gate**  
  **Question**: Is the taxon diagnosable via morphology, ecology, or behavior in the wild?  
  - *Sufficient answer*:  
    - Statistical differentiation in ≥1 trait (e.g., morphology, host use, phenology).  
    - Field-identifiable by experts without genomic tools.  
  - *Responsibility*: Proposer supplies data; Panel’s taxonomist/ecologist assesses.  
  - *Gate*: If **no distinctness**, stop. Reason: "Taxon not reliably distinguishable in the field; protection unenforceable."

  **Step 4: Value Judgment: Statutory Purpose**  
  **Question**: Does protecting this taxon align with the statute’s purpose?  
  - *Options*:  
    - Preserve evolutionary potential (e.g., incipient lineages).  
    - Maintain ecological function (e.g., keystone roles).  
    - Prevent specific harms (e.g., habitat loss).  
  - *Responsibility*: **Panel (led by chair/lawyer)** decides. **Must record as value judgment** (e.g., "The Panel prioritizes evolutionary potential given...").  
  - *Handles*: Ambiguity in Shapes (ii), (iii), (iv); conflicts unresolved at Step 2.

  **Step 5: Provisional Listing (For Shape iii)**  
  **Trigger**: Partial divergence (e.g., genomic islands, recent isolation) but fails Step 2 or 3.  
  - *Criteria*:  
    - Geologically recent divergence (<10,000 years).  
    - Evidence of ongoing divergence (e.g., selective sweeps, trait shifts).  
  - *Review interval**: Set at **3× generation time** (min. 5 years).  
  - *Evidence for review*:  
    - **Divergence complete**: Reproductive isolation achieved OR F<sub>ST</sub> > 0.25 genome-wide.  
    - **Divergence stalled**: No change in differentiation metrics.  
  - *Output*: Provisional listing with sunset clause; review mandatory.

  **Step 6: Final Decision & Documentation**  
  - **List** if all gates passed.  
  - **Do not list** if any gate failed.  
  - **Provisional list** if triggered at Step 5.  

  ---

  #### Template for Published Reasons
  > **Taxon**: [Name]  
  > **Proposal Source**: [Organization]  
  > **Decision**: [List/Do Not List/Provisional List]  
  > **Reasoning**:  
  > 1. **Formal Validity**: [Description of type specimen/match].  
  > 2. **Lineage Isolation**: [Evidence summary; conflict resolution if any].  
  > 3. **Field Diagnosability**: [Morphological/ecological evidence].  
  > 4. **Statutory Purpose**: [Value judgment recorded].  
  > 5. **Provisional Terms**: [If applicable; review date].  
  > **Key Criterion**: [State which criterion was decisive, e.g., "Genomic distinctness"].  
  > **Contrary Evidence**: [e.g., "Morphology supported listing, but genomic panmixia was overriding"].  

  ---

  ### Procedure Applied to Cases

  #### Case 1: Host-Associated Moth  
  - **Step 1**: Passes (formal name exists).  
  - **Step 2**:  
    - *Conflict*: Weak genome-wide differentiation (F<sub>ST</sub> < 0.05) but strong assortative mating (90%).  
    - *Resolution*: Prioritize genomics – fails **Lineage Isolation Gate**.  
  - **Step 5 (Triggered)**:  
    - Recent host shift suggests incipient divergence.  
    - Provisional listing (Review in 5 years; moth generation time ≈1 year).  
    - *Review evidence*: Increased F<sub>ST</sub> or strengthened assortative mating.  
  - **Value Judgment**: "Protection prioritizes evolutionary potential of incipient lineage."  
  - **Decision**: **Provisional listing**.  
  - **Key Criterion**: Partial reproductive isolation + ecological distinctness.  

  #### Case 2: Diploid/Tetraploid Plant  
  - **Step 1**: Passes (both cytotypes described).  
  - **Step 2**:  
    - Strong postzygotic isolation (sterile triploids) but weak prezygotic isolation (shared pollinator).  
    - *Asexual/selfing rule (Shape iv)*: Skip hybrid fertility; cytotypes are genetically distinct. Passes.  
  - **Step 3**:  
    - Morphologically indistinguishable but cytologically distinct.  
    - *Fails*: Not field-identifiable without chromosome counts.  
  - **Gate**: Stop at **Step 3**.  
  - **Decision**: **Do not list**.  
  - **Reason**: "Lack of field diagnosability precludes enforcement; statutory protection requires identifiable taxa."  

  #### Case 3: Flagship Taxon (Clinal Variation)  
  - **Step 1**: Passes (formally described).  
  - **Step 2**:  
    - Genomic cline shows continuity; type specimen in center.  
    - *Fails*: No evidence of isolation or distinctness at endpoints.  
  - **Step 2 Gate**: Stop.  
  - **Decision**: **Do not list** (as distinct taxon).  
  - **Honest Outcome**:  
    - Flagship population is part of a widespread taxon.  
    - Recovery program conflicts with evidence; **delisting required**.  
  - **Value Judgment**: "Statutory purpose (preserving lineages) cannot override lack of scientific distinctness."  
  - **Key Criterion**: Genomic continuity overriding historical perception.  

  ---

  ### What the Procedure Cannot Do  
  1. **Asexual/Selfing Taxa (Shape iv)**  
     - Cannot resolve "species" conceptually; relies on arbitrary distinctness thresholds.  
     - Leaves open: Whether ecological function or harm prevention should override lineage criteria.  

  2. **Conflicting Statutory Purposes**  
     - Cannot scientifically decide between:  
       - Protecting evolutionary processes (e.g., incipient species).  
       - Protecting functional roles (e.g., keystone asexual lineages).  
       - Preventing human-caused harm (e.g., habitat destruction).  
     - **Resolution**: Explicit value judgment by Panel at Step 4.  

  3. **Hybridizing Taxa (Shape ii)**  
     - May provisionally list if divergence is ongoing, but cannot predict if hybridization will lead to fusion or speciation.  

  4. **Undescribed Taxa (Shape v)**  
     - No workaround; formal description remains mandatory.  

  5. **Political/Public Pressure**  
     - Flagship case shows the procedure will **not** protect popular taxa lacking evidence.  
     - Delisting must be documented as scientifically inevitable.  

  ### Where It Misfires  
  - **Over-reliance on genomics**: May overlook ecologically significant but genetically weak units (e.g., host races).  
  - **Field diagnosability**: Excludes cryptic but evolutionarily independent taxa (e.g., cytotypes).  
  - **Provisional listings**: Risks politicizing "in progress" claims; review may be gamed.  
  - **Asexual taxa**: Morphological distinctness may not reflect evolutionary independence.  

  ---  
  **Final Advice**: Use this procedure to enforce scientific rigor and transparency, but empower the Panel to explicitly debate value judgments at Step 4. Document every decision as if facing judicial review—because you will.
