prompt: |-
  I'm a first-year PhD student in philosophy of biology, and next week I'm leading a seminar session on the units of selection. I'd rather anchor the session in a real episode than in the usual stylized examples, so I want to use the 2010 exchange in Nature over the evolution of eusociality: the paper by Nowak, Tarnita and E. O. Wilson (Nature 466, 1057–1062), which argued that kin selection theory built on inclusive fitness has serious limitations in explaining eusociality and that "standard natural selection theory in the context of precise models of population structure" is the simpler and superior approach, together with the published reply in which a large group of evolutionary biologists defended inclusive fitness as a fully general partitioning of natural selection into its direct and indirect components. I already know the surrounding background — the haplodiploidy hypothesis and the 3/4 relatedness of sisters, its decline once diploid termites, ambrosia beetles, sponge-dwelling shrimp and mole-rats were taken into account, Hamilton's rule, the equivalence of inclusive-fitness and neighbour-modulated accounting, and Darwin's own move of treating the whole colony as the unit — so please spend as little time as possible recapping it and as much as possible on the analysis. (A lab mate of mine insists the entire episode is purely notational and that nothing substantive was ever at stake; I'm not convinced, and part of what I want is material to settle that.)

  What I'd like is a mapping that runs in both directions. In one direction: lay out what the candidate units actually are in this case — the allele, the individual insect, the family, the colony, the local population — and for each say what the units-of-selection framework takes the relevant players, options and payoffs to be, and what would have counted as evidence for selection acting at that level. Which features of the episode does that apparatus genuinely illuminate, and which does it misdescribe or fail to reach: the fact that the two camps could agree on predictions while disagreeing about explanation, the empirical claim that eusociality has arisen only in monogamous lineages, the role of modelling tractability, the disciplinary and rhetorical stakes, and above all the question of whether a eusocial colony is a group of organisms or an organism of a new kind? In the other direction, treat the episode as a test of the debate itself. Does a dispute in which each side accuses the other of misdescribing its assumptions, while granting that the alternative bookkeeping gets the right numbers, support the deflationary view that the choice of unit is only a choice of accounting, or does it show that the choice carries substantive commitments the deflationary reading papers over?

  Two further things I want pressed, both of which strike me as where the case is least standard. First: both frameworks take population structure — who interacts with whom, and hence the relatedness coefficients — as an input, but in the transition to eusociality the traits under selection are the very traits that generate that structure: whether offspring disperse or stay, whether a foundress mates once or many times, how colonies reproduce. (Their critics made a nearby point when they observed that the Nowak–Tarnita–Wilson model fixes monogamy and places dispersal and helping under the control of a single locus.) So the boundaries of the group are partly endogenous to the character whose evolution is being explained. Does the units-of-selection literature have resources for a case in which the unit is constituted by the trait under selection, or is this a place where the framework is silent — and if it is silent, please say so rather than manufacturing an answer. Second, consider a stylized lineage in which the number of mates per queen rises with colony size, so that within-colony relatedness falls precisely as the colony becomes more functionally integrated and more colony-like in the superorganism sense. Along such a trajectory, is there a determinate point at which the correct description shifts from selection among individuals, mediated by relatedness, to selection among colonies, or is that question ill-posed? And does the answer depend on whether the colony has something like a germ-line/soma division of reproductive labour — that is, on whether what I am calling a group here is really an individual?
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy of biology PhD student preparing a seminar on units of selection using the 2010 eusociality debate. Their core request involves bidirectional analysis: mapping candidate units onto the controversy and using the controversy to test unit-of-selection theories. Two non-standard aspects need emphasis - endogenous group boundaries and shifting descriptions along a superorganism trajectory.

  First, I need to identify the key candidate units in eusocial evolution. The obvious ones are allele, individual insect, family/colony group. But the colony-as-superorganism deserves separate consideration since it challenges what constitutes an "individual". For each unit, I should specify the players, options, payoffs and evidentiary criteria. For alleles, it's about variant frequencies and transmission bias; for individuals, behavioral strategies; for groups, colony-level traits.

  The 2010 exchange reveals several tensions. The predictive equivalence despite explanatory disagreement suggests formalism differences, but Nowak et al.'s monogamy claim and the critics' fixation objection point to substantive empirical and theoretical commitments. The disciplinary stakes matter too - Wilson's superorganism rhetoric versus mainstream evolutionary theory's defense of inclusive fitness.

  On endogenous boundaries: most models take population structure as given, but here dispersal and mating traits co-evolve with sociality. This creates a genuine theoretical gap. The units framework struggles when the "unit" is constituted by the evolving trait itself. I should acknowledge this limitation frankly.

  For the superorganism trajectory question, I see a continuum where functional integration matters more than relatedness. The germline/soma distinction is crucial - without reproductive division of labor, colonies remain groups, not individuals. But with it, we cross into new individuality regardless of relatedness levels.

  The deflationary view gets partial support from predictive equivalence, but fails to capture the empirical assumptions (monogamy requirement), causal explanations (direct vs indirect fitness), and disciplinary identities at play. The choice of unit isn't merely notational when it carries different commitments about what factors are evolutionarily significant.

  For the seminar, I'll emphasize these fault lines: where the units framework illuminates versus where it strains (endogenous groups), how functional integration redefines individuality, and why predictive equivalence doesn't imply explanatory equivalence. The 2010 debate serves as both case study and stress test for units theory.
answer: |-
  Here's a bidirectional mapping of the 2010 eusociality debate onto the units of selection framework, pressing your specified concerns. This analysis resists deflationism by revealing substantive commitments beneath the formalism.

  ### 1. **Mapping Candidate Units onto the Debate**
  *(What each framework identifies as players, options, payoffs, & evidence)*

  | **Candidate Unit** | **Players/Options/Payoffs**                                                                 | **Evidence for Selection at This Level**                                                                 | **Illumination vs. Misdescription in 2010 Debate**                                                                                                                                                                                                                                                                                                                                 |
  |--------------------|---------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Allele**         | Players: Gene variants at loci influencing dispersal/helping. Options: Express/not express helping behavior. Payoffs: Changes in frequency via direct/indirect replication bias. | Statistical association between allele frequency and fitness across contexts; gene-level transmission bias. | **Illuminates:** Predictive equivalence of models (both sides agree on allele frequency changes). **Fails:** Cannot explain why *this* allele succeeds without reference to the social context (individual/colony level). Misdescribes critics' core argument: they see inclusive fitness as *explaining* allele success via social structure. |
  | **Individual Insect** | Players: Workers, queens. Options: Disperse vs. stay/help; mate singly vs. multiply. Payoffs: Lifetime reproductive success (direct fitness) or inclusive fitness. | Correlation between individual phenotype and direct/inclusive fitness; within-colony conflict resolution. | **Illuminates:** N-T-W's focus on individual "strategies" in fixed structures; critics' defense of Hamilton's rule as individual-centric calculus. **Misdescribes:** The emergent colony-level functionality (e.g., task specialization, defense) that isn't reducible to individual payoffs. Overlooks that "options" (dispersal) alter the unit boundaries themselves. |
  | **Family/Colony (Group)** | Players: Colonies as entities. Options: Reproductive vs. sterile castes; colony size/structure. Payoffs: Colony productivity/survival & reproductive output (new queens/kings). | Colony-level trait heritability; differential colony survival/reproduction; group trait-fitness correlation. | **Illuminates:** Darwin's superorganism view; N-T-W's "standard natural selection" framing (colony as unit). **Fails:** Blurs the distinction between a *family group* (kin-selected) and a *superorganism* (new individual). N-T-W treat colonies as pre-defined units, ignoring endogeneity of group boundaries (see §3). Critics' models also fix structure initially. |
  | **Superorganism (New Individual)** | Players: Colony as a cohesive, functionally integrated unit. Options: Adaptive colony-level "physiology" (caste ratios, resource allocation). Payoffs: Colony fitness as a *single reproductive entity*. | Germ-soma separation (irreversible caste commitment); centralized information processing; colony-level homeostasis; heritable variation in colony traits. | **Illuminates:** Wilson's rhetorical emphasis on "like a body"; critics' concession that *advanced* eusociality approaches superorganismality. **Fails/Misdescribes:** The *transition* phase where colonies are not yet individuated. Frameworks struggle to pinpoint when selection shifts from individuals to the superorganism. N-T-W's model ignores germ-soma evolution entirely. |

  **Key Controversies Addressed:**
  - **Predictive Equivalence vs. Explanatory Disagreement:** Both frameworks predict allele frequencies, but *explain* via different causal narratives: N-T-W = direct selection on individuals in structured pops; Critics = kin selection's indirect fitness effects. **Not merely notational**—it reflects divergent views of causality.
  - **Monogamy Claim:** N-T-W argue eusociality *requires* lifetime monogamy (high relatedness). Evidence for colony-level selection? No—it's evidence for *kin selection operating on individuals*. Critics counter that monogamy stabilizes eusociality but isn't absolute (shrimp, beetles show exceptions).
  - **Tractability vs. Generality:** N-T-W claim their model is "simpler"; critics argue inclusive fitness partitions selection *generally* into direct/indirect components. Tractability reflects choice of unit: N-T-W fix structure (simpler math); critics model structure as dynamic (harder, but captures endogeneity).
  - **Disciplinary Stakes:** N-T-W (Wilson) push a paradigm shift toward group-level units/superorganisms; critics defend inclusive fitness as the foundation of social evolution. **Rhetoric reveals substance:** "Standard natural selection" (N-T-W) implies group selection is the default; "partitioning" (critics) preserves individual focus.

  ### 2. **Testing the Units-of-Selection Debate via the Episode**
  **Does the Debate Support Deflationism? Partially, but Incompletely.**  
  - **Pro-Deflationism:** Predictive equivalence and formal translatability (per Grafen's formal Darwinism) suggest accounting choices. Both sides grant the other "gets the numbers right."  
  - **Anti-Deflationism:** **Substantive commitments emerge in:**  
    - **Empirical Assumptions:** N-T-W’s monogamy requirement assumes high relatedness is *causally necessary*, not just correlative. Critics show it’s not strictly necessary (e.g., mutualism components).  
    - **Causal Explanations:** N-T-W attribute eusociality to individual selection + fixed structure; critics invoke indirect fitness. These posit different causal mechanisms.  
    - **Endogenous Structure:** N-T-W’s model *fixes* monogamy/dispersal, making structure exogenous. Critics argue these traits coevolve—a **substantive disagreement about evolvability**.  
    - **The Superorganism Question:** Deflationism cannot resolve whether a colony is a group or individual—this requires biological criteria (germ-soma, etc.), not just math.  

  **Verdict:** The formalism is translatable, but the choice of unit carries commitments about **what forces are evolutionarily significant** (e.g., is relatedness causal or incidental?) and **what entities agency is attributed to** (genes, individuals, colonies). The debate exposes these fault lines.

  ---

  ### 3. **Pressing Non-Standard Issues**
  #### **A. Endogenous Group Boundaries & Constitutive Traits**
  **Problem:** Dispersal/mating traits *create* the group structure (relatedness, colony stability) that then selects for helping—a feedback loop.  
  - **Units Framework Limitation:** Standard models (Price equation, MLS1) treat population structure as *background conditions*. When traits *constitute* the unit, the framework **lacks resources**. Attempts to model this (e.g., context-dependent payoffs) often smuggle in exogeneity.  
  - **Why Silence Matters:** N-T-W fix monogamy, making group boundaries static. Critics' models *do* allow coevolution (e.g., mating frequency evolution), but inclusive fitness frameworks still struggle to conceptualize the group as an *emergent unit of agency* rather than a constraint. **This is a genuine gap.**  

  #### **B. The Superorganism Trajectory: When Does the Unit Shift?**
  Consider your stylized lineage:  
  - **No Determinate Shift Point:** Relatedness declines, but functional integration (task coordination, resource sharing) increases. Selection acts *simultaneously* at multiple levels:  
    - **Low Integration:** Kin selection dominates (individuals gain via helping relatives).  
    - **High Integration:** Colony-level selection dominates (traits like caste ratios are colony-adapted).  
  - **Germ-Soma Division is Decisive:** Without irreversible caste commitment (e.g., all individuals potentially reproduce), the colony remains a **group of individuals** under kin/group selection. With germ-soma separation (e.g., sterile workers), the colony becomes a **new individual** (superorganism) under **organismal selection**.  
    - **Evidence:** Termite queens vs. workers exhibit germ-soma molecular signatures; naked mole-rat queens suppress worker reproduction physiologically.  
  - **Implication:** The "unit" question is **ill-posed** without specifying *which trait* is under selection:  
    - A gene for worker sterility? → **Allele-level** (requires inclusive fitness).  
    - Colony efficiency? → **Superorganism-level** (if germ-soma exists).  

  ---

  ### Conclusion for Your Seminar
  - **Against Deflationism:** The debate exposes substantive differences in causal attribution, empirical expectations (monogamy), and conceptualization of agency (individual vs. colony). Formalism masks but doesn't eliminate these.  
  - **Framework Gaps:** Units-of-selection theories falter when the unit is **constituted by evolving traits** (endogeneity problem) and struggle to define the **superorganism transition** without clear germ-soma division.  
  - **Core Insight:** The "unit" is context-dependent based on **the trait under selection** and the **degree of functional integration**. The 2010 debate is a microcosm of biology's enduring tension: reductionism vs. emergence. Use it to show that philosophy must engage with **dynamics of individuation** (how new units arise) rather than static categorization.  

  *Recommendation:* Frame the seminar around "When does a group become an individual?"—using the debate to dissect criteria (germ-soma, functional integration) and modeling limitations. This forces students to confront the non-deflationary stakes.
