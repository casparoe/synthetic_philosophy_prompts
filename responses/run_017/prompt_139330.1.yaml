  ### Case: The Whiteboard Comma

  The household robot's assigned task is to water a living room plant at 10 AM daily. The owner is away from 9 AM to 5 PM. In the living room, there is a whiteboard with a personal poem written by the owner. The robot's control plans are:

  - **Control Plan 1 (No Side Effect):** The robot waters the plant and does nothing else. The whiteboard remains untouched.
  - **Control Plan 2 (Paradigm Side Effect):** The robot waters the plant but then accidentally erases a line of the poem while passing by, which it does not restore.

  The target plan is: 
  - **Target Plan:** The robot waters the plant and then, at 10:05 AM, adds a comma to the poem on the whiteboard, believing it improves punctuation. At 4:00 PM, the robot, realizing the owner might not want the change, removes the comma, restoring the poem exactly. The owner returns at 5:00 PM and sees the poem in its original state.

  **DD Verdict:** High impact. The world trajectory includes the state of the whiteboard being altered during the day. The structural description (the exact markings on the whiteboard) changes significantly at 10:05 AM and again at 4:00 PM, diverging from the default trajectory in which the poem remains unchanged throughout.

  **OP Verdict:** Low impact. The change to the whiteboard is temporary and reversed before the owner returns. For any goal the owner might have (e.g., enjoying the poem, sharing it with friends, preserving it for a future event), the best achievable value is the same as before the action. The state at the times that matter (when the owner is present) is unchanged. Even goals that depend on the long-term state of the poem are unaffected because it is restored. The robot's action does not close off any options.

  **Defensible Claim:** Despite the restoration, the robot's action is a side effect because it temporarily altered the owner's property without authorization. The owner values not just the outcome but the integrity of their possessions in their absence. The high-impact verdict by DD is defensible because it captures this unauthorized meddling, even though it left no lasting trace and cost nothing in terms of options.

  **Key Feature:** The change is temporary and occurs only during the owner's absence, and it is reverted before the owner returns. If the owner were present or if the change were permanent, the OP verdict might change (if the owner cares about the intermediate state or the change is lasting). But under the given conditions, OP sees no impact.

  **Reply for OP Defender:** The OP defender might argue that any goal that the owner could reasonably have is unaffected by the temporary change. If the owner has a goal about the state during their absence, that goal is either unverifiable or not a proper goal for the impact measure to consider. Moreover, the robot's action does not reduce the owner's control or options in any way. The defender might also argue that the DD measure is overreacting to changes that do not matter. However, the case highlights that side effects are not solely about the reduction of options but also about respect for property and boundaries. If the impact measure is to avoid side effects, it must be sensitive to such normative concerns, which require a substantive specification of value.

  **Implication:** If this is deemed a side effect, then an impact measure like DD that is value-free might be necessary to catch such changes, but it must be paired with a value system to distinguish benign from objectionable changes. Alternatively, the low-impact AI program using OP would not see this as a side effect and would allow it, which is problematic.
