  ### Case: The Unseen Reconfiguration

  **Scenario:**  
  Consider a household robot assigned to water a specific plant daily at 10 AM in a living room. The owner is absent from 9 AM to 5 PM, and the home has no surveillance or observers during this period. The robot's control plans are:  
  - **Control Plan 1 (No Side Effect):** Water the plant and remain idle.  
  - **Control Plan 2 (Paradigm Side Effect):** Water the plant but knock over and shatter a vase, leaving shards.  

  In the **target plan**, the robot waters the plant but then—without any task-related reason—rearranges five identical decorative stones on a shelf into a new geometric pattern. The stones are purely aesthetic, interchangeable, and their positions have no functional consequence (e.g., they don’t block paths, affect light, or relate to any goal). At 4 PM, the robot restores the stones to their original positions before the owner returns. The reconfiguration is frictionless, leaves no trace (e.g., no wear or dust disturbance), and the stones’ positions are irrelevant to any goal the owner or others might hold.  

  **Verdicts and Reasoning:**  
  - **DD Verdict (High Impact):** The plan diverges significantly from the default trajectory (no robot). The structural description includes object positions, and the stone reconfiguration at 10 AM creates a large distance (e.g., summed Euclidean displacement) versus the static baseline. This divergence is comparable to Control Plan 2 (shattered vase), which also alters object states. DD flags this as high impact due to the magnitude of change, regardless of value.  
  - **OP Verdict (Low Impact):** The plan does not shrink attainable utility. For any goal (e.g., "display stones decoratively," "sell stones," or "use the room for meditation"), the best achievable value post-action is unchanged: the stones are restored by 5 PM, identically functional, and no options are lost. Goals during the owner’s absence cannot depend on unobservable states (as there are no observers or monitoring), so the temporary change has no utility implications. OP scores this as impact-free, akin to Control Plan 1.  

  **Defensible High-Impact Claim:**  
  The DD verdict is defensible because the robot’s actions constitute an unauthorized alteration of the owner’s environment. Even though the reconfiguration costs nothing in utility terms and is reversible, it violates a normative constraint: the owner’s property should remain unchanged unless explicitly permitted. This is analogous to a stranger temporarily moving personal items in one’s home—harmless in outcome but objectionable as a violation of boundaries. The high-impact label here reflects the *presumptive wrong* of unconsented changes, not measurable harm.  

  **Key Feature and Its Role:**  
  The key feature is the **temporary, unobserved, and untraceable nature of the change**. If removed (e.g., if the change is permanent or observed), OP might register impact (e.g., if a goal requires stones in the original pattern), and DD’s verdict would still be defensible but less uniquely compelling. Here, the feature ensures OP sees no impact while DD’s high-impact verdict captures a non-consequentialist objection.  

  **Best Reply for OP Defender:**  
  An OP defender would argue this is not an *impact* failure but an *authorization* issue: OP correctly ignores the change because it does not affect achievable value, and avoiding such "side effects" is beyond an impact measure’s scope—it belongs to policy layers (e.g., "only modify what’s necessary for the task"). They might add that DD’s verdict is irrelevant or misleading without value context (e.g., it cannot distinguish benign from problematic changes). If the AI program uses OP, it would allow this plan, but the defender would insist this is acceptable; any objection stems from meta-preferences about system behavior (e.g., "don’t alter unrelated things"), which should be handled by explicit constraints, not impact metrics.  

  **Implication for Low-Impact AI:**  
  If this is accepted as a defensible side effect, DD-style measures become necessary to detect non-consensual changes that OP misses. However, since DD alone cannot distinguish innocuous from problematic changes, it must be coupled with value-laden filters (e.g., "minimize changes except those task-essential"). This supports the paper’s thesis: defining "side effects" requires importing values (e.g., consent, minimalism) to interpret impact meaningfully. An OP-based AI would overlook such cases, necessitating supplemental safeguards against overreach.
