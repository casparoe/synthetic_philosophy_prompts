answer: |-
  ### Decision Problem: Database Migration Strategy

  **Scenario:** Your team must migrate a critical production database to improve scalability. The migration is a one-time event (no partial adoption), and failure under peak load in the first week post-migration incurs heavy costs (outage minutes and engineer-weeks for emergency fixes). Option A uses a familiar, well-instrumented database system. Option B uses a new, promising open-source system with no comparable production telemetry in your environment. Staging tests are impossible (due to inability to replicate peak load/data volume), and vendor docs offer no insight into failure probability for your workload. No adversary or hidden actor exists—the failure probability is an unknown fact about the system. The team has no expertise to estimate B better than random chance.

  **Event E:** Database fails to serve 99.9% of queries within latency SLO during the first week's peak traffic hour.  
  **Outcome Measurement:**  
  - If E occurs: Cost = 1000 engineer-weeks (outage + firefighting)  
  - If E does not occur: Cost = 100 engineer-weeks (baseline migration effort)  

  **Option A (Known Risk):**  
  - Probability of E: 10% (measured from 50 identical past migrations; 5 failures).  
  - Cost if E: 1000  
  - Cost if not E: 100  

  **Option B (Ambiguous Risk):**  
  - Probability of E: Unknown and unresolvable pre-decision. Best guess is 10% (matching A), but could be 0% or 100%.  
  - Cost if E: 1000  
  - Cost if not E: 100  

  **Best/Worst Cases:**  
  - Best case (E does not occur): Both options cost 100.  
  - Worst case (E occurs): Both options cost 1000.  

  ---

  ### Version 1: Payoff Keyed to E Occurring (E is bad)  
  - **Option A:** Known 10% chance of E (cost 1000), 90% chance of not E (cost 100).  
  - **Option B:** Ambiguous chance of E (cost 1000) or not E (cost 100).  

  **Expected Utility (EU) Maximizer Verdict:**  
  Assume subjective probability for B is best guess (10%).  
  - EU(A) = (0.1 × -1000) + (0.9 × -100) = -100 - 90 = -190  
  - EU(B) = (0.1 × -1000) + (0.9 × -100) = -100 - 90 = -190  
  → Indifferent between A and B.  

  **Ambiguity-Averse Verdict:**  
  *Rule 1: Maxmin Expected Utility (Worst-Case Probability)*  
  - Evaluates min EU over all possible probabilities for B.  
  - EU(B) ranges from -1000 (if P(E)=1) to -100 (if P(E)=0).  
  - Min EU(B) = -1000 (when P(E)=1).  
  - EU(A) = -190 > -1000 → **Strictly prefer A**.  

  *Rule 2: Smooth Ambiguity Model (Penalize Variance)*  
  - Uses second-order probability (Beta(1,9) prior, mean 10%) and concave φ(x) = -eᵝˣ (β>0).  
  - V(A) = φ(EU(A)) = φ(-190) = -e^{-190β}  
  - V(B) = 𝔼[φ(EU(B|q))] = 𝔼[ -e^{β(-100 -900q)} ] (integral over q ~ Beta(1,9))  
  - By Jensen’s inequality, V(B) < V(A) (since φ concave and EU(B|q) varies with q).  
  → **Strictly prefer A** for any β>0.  

  ---

  ### Version 2: Payoff Keyed to E Not Occurring (~E is bad)  
  - **Option A:** Known 90% chance of not E (cost 1000), 10% chance of E (cost 100).  
  - **Option B:** Ambiguous chance of not E (cost 1000) or E (cost 100).  

  **Expected Utility (EU) Maximizer Verdict:**  
  Assume subjective probability for B is best guess (10% for E).  
  - EU(A) = (0.1 × -100) + (0.9 × -1000) = -10 - 900 = -910  
  - EU(B) = (0.1 × -100) + (0.9 × -1000) = -10 - 900 = -910  
  → Indifferent between A and B.  

  **Ambiguity-Averse Verdict:**  
  *Rule 1: Maxmin Expected Utility (Worst-Case Probability)*  
  - Min EU(B) = -1000 (when P(E)=0, forcing P(~E)=1).  
  - EU(A) = -910 > -1000 → **Strictly prefer A**.  

  *Rule 2: Smooth Ambiguity Model (Penalize Variance)*  
  - V(A) = φ(EU(A)) = φ(-910) = -e^{-910β}  
  - V(B) = 𝔼[φ(EU(B|q))] = 𝔼[ -e^{β(-1000 +900q)} ]  
  - V(B) < V(A) (same Jensen’s logic) → **Strictly prefer A**.  

  ---

  ### Key Feature Doing the Work
  **Unresolvable ambiguity in probability** drives the result. Removing it changes outcomes:  
  - **(a) Make unknown measurable pre-decision:** If B’s failure probability is measured as 5%, EU(B) improves to -150 in Version 1 (better than A’s -190). The ambiguity-averse preference vanishes.  
  - **(b) Repeat decision 200 times:** Law of large numbers averages B’s cost close to its true expectation. If true P(E)=0.05, B beats A. Ambiguity aversion weakens with repetition.  

  ---

  ### Steelman Against the Rule & Reply  
  **Objection (BIAS):** This rule is cowardice disguised as prudence. You’re avoiding innovation due to irrational dread of the unknown. If A and B are equal on measurable dimensions, B might be better (e.g., lower true failure rate), and the "boring" rule institutionalizes stagnation. Ambiguity aversion is just a cognitive bias—like a gambler preferring dice to an opaque urn—not rational policy.  

  **Reply (PRINCIPLED):** Ambiguity aversion is structural, not emotional. When probabilities are unresolvable (not merely risky), hedging is impossible, and the decision is one-time, the rule protects against unquantifiable downside. It does not reject innovation but prioritizes it for contexts where ambiguity can be reduced (e.g., small-scale tests). Here, the symmetric ambiguity (B’s probability is a Knightean unknown) justifiably tilts preference toward the known risk, as the rules formally show.  

  \answer{PRINCIPLED}
