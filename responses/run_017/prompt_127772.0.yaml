      EU_A2 = 0.1*(-B) + 0.9*(-W) = -0.1B -0.9W
      V(A) = φ( -0.1B -0.9W )

    Under the linear φ, V(B) = E_μ [ q(W-B) - W ] = (W-B)*E[q] - W = 0.1(W-B) - W = -0.9W -0.1B = EU_A2

    And with φ concave, by Jensen:
      E_μ [ φ( q(W-B) - W ) ] ≤ φ( E_μ[ q(W-B)-W ] ) = φ( EU_A2 )

    so V(B) ≤ V(A), and strictly if φ is strictly concave and the distribution of q is non-degenerate.

  Therefore, the smooth model with a concave φ and a prior Beta(1,9) (or any symmetric around 0.1) will strictly prefer A in both versions.

  So now we have two rules that work: maxmin over [0,1] and smooth ambiguity with a beta prior centered at 0.1 and a concave φ.

  Now, let's specify the numbers to make it concrete.

  Set:
    Best-case cost B = 100 (engineer-weeks and outage minutes equivalent)
    Worst-case cost W = 1000

  Known probability for A: p=0.1

  For B: the probability q of E is unknown, but our best guess is 0.1.

  Scenario:

  We are migrating a critical database. Option A is a known system with a 10% chance of failure (E: failure under peak load in the first week), which we know from 50 past migrations (5 failed). Option B is a new system, and we have no data to estimate its failure probability. We cannot test it adequately because our staging environment cannot simulate the peak load and full data volume. We must choose one.

  The cost if we have a failure (E) in Version 1 is 1000, and if no failure, 100. In Version 2, the cost assignments are flipped: if E happens, the cost is 100; if not, 1000.

  We find out whether E happens during the first week after migration.

  Now, the expected utility maximizer (subjective expected utility, SEU):

  They assign q=0.1 for B.

  Version 1:
    A: EU = 0.1*(-1000) + 0.9*(-100) = -100 -90 = -190
    B: EU = 0.1*(-1000) + 0.9*(-100) = -190 -> indifferent.

  Version 2:
    A: EU = 0.1*(-100) + 0.9*(-1000) = -10 -900 = -910
    B: EU = 0.1*(-100) + 0.9*(-1000) = -10 -900 = -910 -> indifferent.

  Now, ambiguity-averse with maxmin over q in [0,1]:

  Version 1:
    A: EU = -190
    B: min over q of [ q*(-1000) + (1-q)*(-100) ] = min of [ -1000q -100 +100q ] = min of [ -100 -900q ]
        This is minimized when q=1 -> -1000
        So the maxmin utility for B is -1000 (the worst-case expected utility is -1000, but we are maximizing the minimum expected utility, so we compare -190 (from A) and -1000 (from B) and prefer A because -190 > -1000.

  Version 2:
    A: EU = -910
    B: min over q of [ q*(-100) + (1-q)*(-1000) ] = min of [ -100q -1000 +1000q ] = min of [ -1000 + 900q ]
        This is minimized when q=0 -> -1000
        So maxmin utility for B is -1000. Then we prefer A because -910 > -1000.

  Ambiguity-averse with smooth model: we use a Beta(1,9) prior for q and φ(x)= -exp(-λ x) (exponential utility) which is concave for λ>0? Actually, we need φ to be concave, and exponential is concave if we are in gains, but here we are in losses. Alternatively, use φ(x) = x for linear, but then we need a concave transformation. We can use φ(x)=x if we are risk neutral at the second order, but then we need to have risk aversion to ambiguity. We can use a concave φ, for example φ(x) = -e^{λ x} with λ>0? But note: x is the expected utility, which is negative. 

  Alternatively, we can use φ(x) = x^{1/2} for x>0, but our expected utilities are negative. So let's use a different one: φ(x) = - (-x)^γ for γ>1? That would be convex. We need concave. 

  Actually, for ambiguity aversion, we require that φ is concave. A simple choice is φ(x) = x, which is linear and yields no aversion. For aversion, we can use φ(x) = -e^{β x} with β>0? Then φ is concave for all x? The second derivative of φ(x) = -e^{β x} is -β^2 e^{β x} <0, so concave.

  But let's compute:

  For Version 1:
    Given q, EU_B1(q) = - [q*1000 + (1-q)*100] = -100 - 900q

    Then V(B) = E_μ [ φ( EU_B1(q) ) ] = E_μ [ - exp( β * (-100 -900q) ) ] = - E_μ [ exp( -β(100+900q) ) ]

    For A: V(A) = φ( EU_A1 ) = φ(-190) = - exp(β * (-190)) = - exp(-190β)

    We need to show that V(B) < V(A) for some β>0.

    That is: - E[ exp(-β(100+900q)) ] < - exp(-190β)
    => E[ exp(-β(100+900q)) ] > exp(-190β)

    Now, take β=0.001 (small to approximate risk neutrality at the first order, but we are at the second order).
    We compute the expectation with q ~ Beta(1,9). The density is f(q)= 9(1-q)^8 for q in [0,1].

    We can compute numerically. Since we don't need the exact number, we can note that by Jensen:

      E[ exp(-β(100+900q)) ] > exp( -β(100+900 E[q]) ) = exp(-β(100+90)) = exp(-190β)   [because the exponential is convex]

    So we have E[g(q)] > g(E[q]) for g convex, which is true. Therefore, V(B) is more negative than V(A)? Wait:

      V(B) = - [ something > exp(-190β) ]
      so V(B) < - exp(-190β) = V(A)

    Therefore, V(B) < V(A), so they prefer A.

  Similarly for Version 2:
    EU_B2(q) = - [q*100 + (1-q)*1000] = - [100q +1000 -1000q] = - [1000 -900q] = -1000 +900q

    V(B) = E_μ [ φ( -1000+900q ) ] = E_μ [ - exp( β*(-1000+900q) ) ] = - E_μ [ exp( -β(1000-900q) ) ]

    V(A) = φ( -910 ) = - exp(β * (-910)) = - exp(-910β)

    Now, we want V(B) < V(A) 
    => - E[ exp(-β(1000-900q)) ] < - exp(-910β)
    => E[ exp(-β(1000-900q)) ] > exp(-910β)

    And by Jensen: since the function h(q)=exp(-β(1000-900q)) is convex in q (because it's exponential of a linear function), we have:
      E[h(q)] > h(E[q]) = exp(-β(1000-900*0.1)) = exp(-β(1000-90)) = exp(-910β)

    So again V(B) < V(A).

  Therefore, both rules yield a strict preference for A in both versions.

  Now, what if we remove ambiguity by making it measurable? Then we can know q. Then both options have known probabilities: q for B and 0.1 for A. Then we would compare:
    Version 1: 
      A: -190
      B: -100 -900q
    We prefer A if -190 > -100-900q => 900q > 90 => q>0.1, and B if q<0.1. So if q<0.1, we prefer B. So the ambiguity-averse preference for A is not justified if we can measure and find q<0.1.

  But in our case, we cannot measure.

  If we make the decision 200 times, then by the law of large numbers, the average cost for B will be close to the true expected cost. For A, we know the expected cost is 190 per decision in Version 1. For B, if the true q is 0.1, then same. But if q is less, then B is better. And an ambiguity-averse person might be willing to take the risk over many trials because the ambiguity is reduced by repeated observations.

  In fact, in the smooth model, as we get more observations, the prior becomes concentrated, and V(B) approaches φ( true expected utility ), so it becomes like the SEU. And in the maxmin model, if we consider repeated decisions, we might re-evaluate the set of probabilities. So the ambiguity aversion should disappear.

  Therefore, the key feature is the one-time decision under unresolvable ambiguity.

  Steelman against the boring-option rule: 
    This rule is just a bias against the unknown. We have no reason to believe that the unknown option is any worse than the known one. In fact, the new option might be better. By always avoiding ambiguity, we forgo innovations and the chance of improvement. The rule is conservatism masquerading as rationality. The boring option might be just as bad as the new one, but we are used to it. The rule might lead to stagnation.

  Reply from ambiguity aversion: 
    In high-stakes, one-time decisions with ambiguous probabilities, the aversion is rational because it protects against the worst-case scenario. The rule is not about avoiding innovation, but about reserving innovation for cases where we can reduce the ambiguity to an acceptable level (by testing, staging, or starting with non-critical services). When we have two options that are equally good on all measurable dimensions, the one with known risks allows for better contingency planning and resource allocation. The ambiguity-averse preference is a structural feature of decision-making under complete lack of information about probabilities, and it does not imply that the ambiguous option is worse on average, but that it carries an additional layer of uncertainty that is not compensated by any upside.

  Finally, the case meets all requirements. The unknown probability in B is unresolvable (requirement 2), there is no adversary (3), no expertise (4), the best and worst cases are the same and the expected utility is the same under the best guess (5), SEU is indifferent (6), and we have two rules that yield strict preference for A in both versions (7). The event E is crisply defined (8).

