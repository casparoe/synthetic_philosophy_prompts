  ### Decision Tree for Single-Case Probability Assignment

  **Start**: You have one individual case and need to assign a single probability for a specific outcome. Proceed through the questions below using only case-specific information.

  1. **Can you define a reference class using *only* attributes known at the time of prediction that do not include the outcome event or future choices/events?**  
     - **No** → **Leaf 1: Reference Class Only (No Single-Case Probability)**  
       *Probability doesn't exist for the individual; only class-based rates apply. You report the rate from the best available class, but cannot assign a "true" probability to the case.*  
       *(Awkward: You must explain why the individual's probability is just a class rate, even if the client demands a personalized number.)*  
     - **Yes** → Proceed to 2.  

  2. **After excluding classes that use legally/socially protected attributes (e.g., race, gender) or direct proxies, is there at least one candidate class with reliable statistics?**  
     - **No** → Proceed to 3.  
     - **Yes** → Proceed to 4.  

  3. **Is the outcome directly determined by a known physical random process (e.g., atomic decay, quantum event)?**  
     - **Yes** → **Leaf 5: Genuine Propensity**  
       *The probability is an objective property of the case (e.g., a medical event's inherent chance). Classes only provide evidence for estimating this propensity.*  
       *(Awkward: You need measurable physical data, which rarely exists outside lab settings.)*  
     - **No** → **Leaf 7: Decision-Driven Class**  
       *Pick the class based on the cost of false positives vs. false negatives and the decision context (e.g., "What happens if we're wrong?").*  
       *(Awkward: You must quantify costs/utilities, which are often unstated or subjective.)*  

  4. **Among admissible classes with reliable statistics, is there one that cannot be subdivided into subgroups with different rates?**  
     - **Yes** → Proceed to 5.  
     - **No** → Proceed to 6.  

  5. **Do all homogeneous classes agree on the probability?**  
     - **Yes** → **Leaf 3: Homogeneous Class**  
       *Use any homogeneous class (its rate won't change with further splitting).*  
       *(Awkward: Homogeneous classes are rare; you might settle for "stable-enough" subgroups.)*  
     - **No** → **Leaf 6: Report the Spread**  
       *Refuse one number. Report the range from all admissible homogeneous classes (e.g., "30–60%").*  
       *(Awkward: Clients may demand a single number; you must defend the uncertainty.)*  

  6. **Among non-homogeneous classes, is there a single narrowest class (i.e., no reliable subclass is narrower)?**  
     - **Yes** → **Leaf 2: Narrowest Reliable Class**  
       *Use the most specific class with enough data (e.g., "52-year-old pilots with arrhythmia on medication").*  
       *(Awkward: Narrow classes risk small samples; you trade specificity for reliability.)*  
     - **No** → Proceed to 7.  

  7. **Do all "narrowest" classes agree on the probability?**  
     - **Yes** → **Leaf 4: Coherent Choice**  
       *Any class is valid (e.g., use age-based or symptom-based classes if rates match). Just be consistent across cases.*  
       *(Awkward: Arbitrariness—your choice affects the number, but you can't justify one over another.)*  
     - **No** → **Leaf 6: Report the Spread**  
       *Refuse one number. Report the range from all competing "narrowest" classes.*  
       *(Same awkwardness as above.)*  

  ---

  ### The Leaves (7 Positions)  
  1. **Reference Class Only (No Single-Case Probability)**  
     Only class frequencies exist. The individual has no "true" probability. Use the best class rate.  
     *Awkward: Defending a class rate as "not really their probability" to clients who want personalization.*  

  2. **Narrowest Reliable Class**  
     Optimize specificity without sacrificing data quality. Use the finest-grained class with robust stats.  
     *Awkward: Explaining why a broader class wasn’t chosen when it has more data.*  

  3. **Homogeneous Class**  
     Use a class whose rate is stable across subdivisions. No further splitting changes the probability.  
     *Awkward: Most classes *can* be split (e.g., by compliance), making true homogeneity elusive.*  

  4. **Coherent Choice**  
     All valid classes agree, so pick any. Consistency matters more than the specific class.  
     *Awkward: Justifying an arbitrary choice when classes are non-nested (e.g., "age group" vs. "symptom severity").*  

  5. **Genuine Propensity**  
     The case has an objective chance (e.g., quantum or biological randomness). Classes are evidence, not the source.  
     *Awkward: Proving a physical chance process exists (rare outside physics/chemistry).*  

  6. **Report the Spread**  
     Admissible classes disagree. Report a range (e.g., "40–70%") and explain the uncertainty.  
     *Awkward: Pushing back on demands for one number while not sounding evasive.*  

  7. **Decision-Driven Class**  
     Choose the class that minimizes error costs for the user’s decision context (e.g., risk tolerance).  
     *Awkward: Eliciting/quantifying the user’s cost of false positives/negatives.*  

  ---

  ### Empty Cells  
  - **Homogeneous classes that survive Q1 but lack reliable statistics (Q2→No)**: Rare, as homogeneity often requires large samples to verify. If stats are poor, you skip to Q3 (physical chance) or leaf 7 (decision-driven).  
  - **Physical chance processes (Q3→Yes) with reliable classes (Q2→Yes)**: Contradictory. Physical chances (e.g., quantum decay) rarely have "reference classes" in practical settings.  
  - **Unique narrowest class (Q6→Yes) that is homogeneous (Q4→Yes)**: Unlikely—if a class is homogeneous, you’d catch it earlier (Q4) and not reach Q6.  

  *Why?* Homogeneity checks (Q4) preempt narrowness queries (Q6). Physical chances (Q3) typically lack class stats. Analysts default to classes when available, avoiding abstract chance.  

  ---

  ### Where It Breaks  
  - **Vague "reliable statistics" (Q2)**: Teams may disagree on what’s "reliable" (e.g., n=50 vs. n=100). This risks arbitrary jumps to leaf 7 (decision-driven) or leaf 6 (spread).  
  - **Proxy variables (Case 4)**: If a proxy (e.g., "postcode" for income) is legally admissible but weakly correlated, the tree may force a low-quality class (leaf 2) or—if stats are poor—jump to leaf 7. Better: Add a node for "proxy strength," but that breaks the "case file only" rule.  
  - **Pilot case (partial choice)**: The tree handles it at Q1 (excluding future choices like compliance), but this hides key uncertainties. A pilot’s choice splits classes, yet Q1 forbids this, forcing a broad class (leaf 2). Ideally, a "choice node" would let you report multiple paths (e.g., compliance vs. non-compliance), but the tree lacks this.  
  - **Startup survival (Case 2)**: High uncertainty and poor stats often lead to leaf 7 (decision-driven), but clients may reject cost-based numbers as "subjective."  
  - **Key weakness**: The tree assumes classes are *available* and *defined*. When classes are sparse (e.g., novel startups), analysts default to leaf 7, which is under-specified for complex decisions.  

  **Overall**: The tree excels for stable, data-rich domains (e.g., aviation medicals) but struggles with choice-driven outcomes (pilot compliance) or scarce data (startups). It prioritizes avoiding legal/statistical pitfalls over capturing nuance.
