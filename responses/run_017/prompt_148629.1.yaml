prompt: |-
  I'm writing a novel set in an early-modern fishing village — no print, no mass media, nothing that can "go viral" the modern way — and I want a plot turn where some practice takes over the whole village and leaves nearly everyone worse off by their own lights: poorer, hungrier, less safe. Not genetically less fit, just worse off.

  So build me a case where the meme's-eye explanation wins and the bearer-level one loses, i.e. the direction people say can't happen, since the bearer-level story (variant frequencies are explained by what the variant does for the people carrying it, plus ordinary transmission biases like copying the successful or copying the majority) is supposed to always be available as a redescription. Constraints: two rival variants, both equally attractive and equally easy to learn, so the winner can't just be the one people prefer; the winner must not work by deceiving anyone or by hooking some cognitive bias; it has to win on the transmission channel itself. One paragraph, realistic, and something I could actually show in a scene rather than report as a statistic.

  After the scenario: what each framing predicts and why, which single feature is doing the work, what the case collapses into if I take that feature out, and the best line a bearer-level theorist would use to say I've only described a transmission bias in fancy language.
reasoning: |-
  Okay, the user is writing a novel set in an early-modern fishing village and needs a plot device where a harmful practice spreads virally without modern media. They want a believable scenario where a meme spreads purely through transmission dynamics, not because it's preferred or deceptive. 

  Hmm, the key challenge is creating a situation where the winning variant harms everyone but spreads due to inherent transmission properties. The village setting suggests practices around fishing or resource sharing would feel organic. 

  Ah! The fish-sharing ritual idea clicks because:
  - It leverages a high-visibility, high-frequency behavior (daily catch display)
  - Creates a self-reinforcing cycle: more adopters mean more observers see it
  - The harm emerges collectively but invisibly (gradual resource depletion)

  The user specifically wants to avoid "cognitive bias" explanations, so the transmission advantage must come purely from observability and imitation rates. The fish-sharing ritual works because:
  - Non-adopters see it constantly (high exposure)
  - It's simple to copy (low barrier)
  - Early majority adoption creates social proof (but not as explicit pressure)

  For the scientific framing part... The bearer-level critique would rightfully point out this is just frequency-dependent bias (copying the majority) dressed up. But in the narrative, that's actually perfect - it shows how "rational" individual copying creates collective irrationality.

  The single pivotal feature is the visibility asymmetry: the ritual happens publicly at the shore, while sustainable fishing occurs privately. Remove that, and both variants have equal transmission chances. 

  For the novel scene... Visualizing old Thom stubbornly fishing sustainably alone while the village parades their catches makes the tragedy visceral. The key is showing the tipping point - when the ritual crosses 50% adoption and accelerates.
answer: |-
  Here's the scenario:

  **The Harmful Meme:** "Full Shore Display" - After each catch, fishermen publicly lay *all* their fish on the central dock before taking any home, inviting admiration but also tacitly encouraging onlookers to take a fish or two as a "shared blessing."  
  **The Beneficial Meme:** "Quiet Share" - Fishermen discreetly share a small portion of their catch *only* with known struggling families before taking the rest directly home.  

  **How "Full Shore Display" Wins & Harms:**  
  Initially, both practices exist. "Full Shore Display" (FSD) is performed at the *central dock*, a high-traffic area everyone passes. "Quiet Share" (QS) happens privately, often unseen. Each time someone performs FSD, dozens see it – children playing, elders chatting, other fishermen. Its sheer visibility means it's *observed* far more frequently than QS, even if both are equally liked when learned. As more adopt FSD, its exposure multiplies, accelerating adoption. Soon, FSD becomes the overwhelming norm. The result? Massive waste: fish spoil in the sun, seagulls feast, and genuine need is obscured by opportunistic taking. Effort isn't rewarded, discouraging longer/harder fishing trips. The village grows hungrier and poorer, though each participant felt they were upholding tradition and generosity when they adopted it.

  **Framing Predictions:**  
  1.  **Memetic Framing (Winner):** Predicts FSD will dominate due to its inherent *transmission advantage* (massive visibility per performance creating higher exposure/replication rate), regardless of its negative fitness consequences for individuals. The meme "uses" the villagers as hosts to spread, harming them.  
  2.  **Bearer-Level Framing (Loser):** Predicts QS should win or at least hold ground because it *should* lead to better individual/family outcomes (more reliable food, less waste, targeted aid strengthening community bonds), making its practitioners more successful and thus more likely to be copied. Its failure contradicts this.  

  **The Single Pivotal Feature:** **Asymmetric Observability per Performance Event.** One act of FSD is witnessed by dozens; one act of QS is witnessed by perhaps one or two recipients, if anyone else at all. This creates a massive imbalance in transmission *opportunities*.  

  **Collapse Without It:** Remove the visibility asymmetry (e.g., force both sharing rituals to occur equally publicly, or make QS hyper-visible while FSD is hidden), and transmission rates equalize. The outcome then depends purely on which practice people *prefer* or which yields *better results* (presumably QS), aligning with bearer-level expectations.  

  **Bearer-Level Theorist's Critique:**  
  "*You've merely described a potent **frequency-dependent bias** disguised as memetic magic. Once FSD became slightly more common, its visibility increased, making it *seem* successful and normative. People copied the majority practice they saw most often – a standard transmission bias – not some selfish meme. Its harm emerged from collective action problems inherent in the *practice itself*, not from autonomous replicators hijacking minds.*"

  **Scene Suggestion:** Show old Thom, a skilled fisherman and quiet sharer, returning at dusk with a good catch. He slips two fine fish onto the porch of a sick widow's darkened cottage. The next morning, young Arin boasts on the crowded dock, laying out his smaller catch extravagantly. Dozens cluster around; children point, neighbors murmur approval, an elder takes a fish "for the blessing." Thom watches, hollow-eyed, knowing Arin's family will eat less tonight, and the widow got nothing. The sheer *spectacle* of FSD drowns out Thom's unseen act. Later, show rotting fish scraps scattered on the stones, ignored gulls fighting over them.
