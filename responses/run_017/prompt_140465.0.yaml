answer: |-
  Ah, a worthy attack! You're absolutely right that the judge case *feels* like a counterexample, and you've pinpointed the crucial escape hatch: **the invariance of the option set, including the consequences attached to each act.** Good's theorem assumes that your available actions and the utilities attached to their outcomes in each state of the world remain *unchanged* by the act of learning itself. Your judge scenario violates this spectacularly.

  Learning the news doesn't just inform her about the world; it fundamentally alters the *nature* and *consequences* of the act "hear this case." Before reading, it's a valid judicial act. After reading, "hearing the case" now carries the consequence of violating judicial ethics (and potentially triggering sanctions or appeals), or it morphs into a different, unavailable act ("hear the case *without* knowing the news"). The option "hear the case *without* the taint of forbidden knowledge" is irrevocably destroyed by the information-gathering act. The newspaper isn't *just* information; it's an action that *changes the rules of the game*. The theorem survives, but only because it strictly defines "free information" as something that *only* updates your beliefs about states, *not* something that alters the action-consequence mapping itself.

  So, what's it telling us? Precisely this: **If the *only* thing changing is your *beliefs* about the world, and your available actions and their payoffs remain fixed *conditional on the state*, then better beliefs can only help (or at least, not harm) your expected utility *ex ante*.** The theorem is a powerful shield against *belief-based* excuses for ignorance ("I'd rather not know how bad it is!"). But it's utterly vulnerable when information acquisition *actively reshapes the decision landscape* – destroying options, imposing new duties (like the clinician’s duty to act), or altering values (which is a whole other can of worms you hinted at). It tells us the *pure* instrumental value of reducing uncertainty, under strict ceteris paribus conditions. Your cases brilliantly show how often those conditions fail. Your move.
