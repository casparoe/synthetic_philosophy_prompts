answer: |-
  Here's a concise conceptual explanation addressing your points, designed for clarity in a graduate seminar setting:

  **(i) The Collapse & How to Prise Apart**
  In the standard non-overlapping generations (NOLG) model with per-period utility `U_t(c_t)` discounted at constant rate `ρ`, the social welfare function (SWF) is:
  `W = Σ_{t=0}^∞ [1/(1+ρ)^t] * U_t(c_t)`
  *   **"Impatience" Reading (Intrapersonal):** `ρ` represents discounting *within* a single life. But in NOLG, no individual lives multiple periods. Discounting future `U_t` *must* mean valuing utility less *because* it accrues to later-born people. `ρ` becomes purely an *intergenerational bias* favoring earlier cohorts.
  *   **Why it Collapses:** NOLG lacks the structure for *intra*personal discounting—there are no multi-period lives. Discounting calendar time utility *is* discounting later generations. The formalism is identical.
  *   **Prising Them Apart:** Build in:
      1.  **Overlapping Generations (OLG):** Individuals live `T > 1` periods (e.g., young/old). Define a *lifetime* utility `V_i` for individual `i` born at time `b_i`: `V_i = Σ_{s=0}^{T-1} β^s * u(c_{i, b_i + s})`, where `β ≤ 1` captures *intrapersonal* pure time preference (impatience). The SWF then aggregates `V_i` across *all individuals*: `W = Σ_{i} [1/(1+δ)^{b_i}] * V_i`. Here:
          *   `β` = Intrapersonal pure time preference (impatience within a life).
          *   `δ` = Intergenerational pure time preference (bias favoring earlier-born cohorts).
          *   `ρ` *in the standard sense vanishes*; it was a conflation of `β` and `δ`. Only `δ` represents bias across generations.
      2.  **Explicit Survival Probability:** Model individual survival explicitly. Let `p_s` be the probability an individual alive at age `s` survives to `s+1`. Lifetime utility becomes `V_i = u(c_{i,0}) + β p_0 u(c_{i,1}) + β^2 p_0 p_1 u(c_{i,2}) + ...`. The pure time preference factor `β` is distinct from the objective survival probabilities `p_s`. The SWF aggregation across individuals born at different `b_i` would still need a separate `δ` (or equivalent) to express intergenerational bias.

  **(ii) The Ethical Charge Against ρ and the Collapse**
  The familiar charge that a positive ρ is "arbitrary discrimination" akin to discounting by spatial distance or identity is **strengthened by the collapse in NOLG models**:
  *   **In NOLG:** A positive ρ *cannot* be defended as rational intrapersonal planning (which has *some* psychological basis). It *is revealed* purely as favoring the utility of earlier-born people merely because they are born earlier. This looks *exactly* like discounting welfare based on the arbitrary characteristic "birth date," analogous to discounting based on location ("birth continent") or identity ("born in cohort A vs B"). The collapse makes the arbitrariness stark.
  *   **With Separation (OLG):** A positive `δ` remains vulnerable to the "arbitrary discrimination" charge across generations. However, a positive `β` (intrapersonal discounting) *can* be argued to reflect a non-arbitrary feature of individual experience (e.g., the finiteness of life, myopia, uncertainty about future survival/needs – though these justifications are contested). The separation clarifies the target: `δ` is the ethically problematic parameter for intergenerational equity, while `β`'s ethics relate to individual rationality/psychology. **The collapse obscures this distinction, making *any* positive ρ look like pure intergenerational bias.**

  **(iii) ρ vs. Hazard Rate**
  A positive observed discount rate `r` could *reflect* an underlying hazard rate (`h`), the probability per period of some catastrophic event ending civilization or making future welfare irrelevant:
  *   **The Conflation:** If `r = h + ηg`, then `h` mimics `ρ`. A policymaker might justify `r > 0` by appealing to existential risk (`h`) rather than pure time preference (`ρ`).
  *   **Telling Them Apart (Conceptually/Observationally):**
      *   **Normative Foundation:** `ρ` (or `δ`) is a *value judgment* about the intrinsic weight of future welfare. `h` is an *empirical claim* about objective risk. They stem from different domains (ethics vs. facts).
      *   **Modeling:** Explicitly include the hazard rate. The *expected* SWF becomes `W = Σ_{t=0}^∞ [(1 - h)^t / (1+ρ)^t] * U_t(c_t) ≈ Σ_{t=0}^∞ [1/(1 + ρ + h)^t] * U_t(c_t)` for small `h` and `ρ`. Here, `r ≈ ρ + h + ηg`. The pure time preference `ρ` and the hazard rate `h` are *additive* components of the discount rate. `ρ` remains a normative choice; `h` is an empirical input.
      *   **Observation/Policy:** Disentangling them is empirically hard. A high discount rate *could* be due to high `ρ`, high `h`, or high `ηg`. Distinguishing requires:
          1.  **Independent Evidence for `h`:** Robust scientific assessment of existential risks (asteroids, AI, pandemics, etc.).
          2.  **Revealed Norms:** Scrutinizing the *justification* for the discount rate. Does the policy document cite "impatience" or "risk of collapse"? (This is often ambiguous).
          3.  **Sensitivity Analysis:** Policy recommendations should vary `ρ` (normative) and `h` (empirical) separately to show their distinct impacts.
  *   **Merely Verbal?** Distinguishing `ρ` (pure time preference) from `h` (hazard rate) is **not merely verbal**. It's the crucial distinction between discounting future utility *because we value it less intrinsically* vs. discounting it *because we believe it probably won't exist*. The conflation in the observed `r` is practical and empirical, not conceptual.

  **Key Conceptual Takeaway for Your Seminar:**
  The standard `ρ` in infinite-horizon NOLG models is a **conceptual chimera**. It inherently conflates *intrapersonal time preference* (potentially defensible psychologically) with *intergenerational bias* (ethically dubious). OLG models (or explicit survival models) are necessary to separate these concepts (`β` vs. `δ`). This collapse fundamentally weakens ethical defenses of a positive `ρ` in long-term analyses, making it look like pure discrimination. While `ρ` and a hazard rate `h` both contribute to the observed discount rate `r`, they are conceptually distinct: `ρ` is normative discounting, `h` is probabilistic weighting. The challenge is empirical disentanglement, not conceptual equivalence. **The core insight is that the *structure of agency and time* in the model (NOLG vs OLG) determines whether `ρ` represents impatience, bias, or an inseparable blend.**
