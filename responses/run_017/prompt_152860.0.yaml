answer: |-
  ## Robustness Under Regularization: A New Diagnosis for Supertask Paradoxes

  **Precis:** This paper argues that debates about supertasks conflate three distinct questions: (a) logical consistency of the schedule prescription, (b) physical realizability, and (c) robustness of the terminal state under regularization. Focusing on (c), it contends that many paradoxes (like Thomson’s lamp) are primarily failures of robustness—different ways of approximating the infinite process yield different limits or no limit at all. The central question is whether this robustness diagnosis provides a superior explanation for the indeterminacy in lamp-like cases compared to the standard "incomplete description" view, and whether it explains why other supertasks (infinite collisions, relativistic scenarios) seem determinate despite their infinite structure. The project evaluates robustness as a necessary condition for a well-defined supertask outcome independent of physical realizability.

  **1. The Problem: Conflated Questions in Supertask Discourse**
  The dominant debate frames "are supertasks possible?" as a monolithic question, oscillating between logical possibility (often resolving to Benacerraf's "incomplete description" argument) and physical possibility. This obscures a crucial third dimension: the stability of the proposed outcome. Thomson's lamp illustrates the core puzzle: the schedule prescribes an infinite sequence of actions before a limit time, but no state at the limit time is logically entailed by the prior sequence. The standard "incomplete description" reply diagnoses this as a failure of type (a). However, this overlooks the deeper issue exposed by regularization: *even given the sequence*, the limit state is not robustly defined.

  **2. The Central Question: Robustness as Diagnosis and Differentiator**
  The core thesis is that the fundamental pathology in cases like Thomson’s lamp is **limit-fragility under regularization** (type (c) failure), not merely the lack of a specified state (type (a) failure). This project rigorously defends and evaluates this diagnosis:
  *   **Q1:** Does the robustness criterion (convergence to the same limit state under *all* admissible regularizations – e.g., truncation at step N → ∞, minimum switching time ε → 0) provide a more precise and explanatory diagnosis of Thomson’s lamp’s indeterminacy than the standard Benacerraf-style incompleteness reply? Or is it merely a restatement using calculus vocabulary?
  *   **Q2:** If robustness is the key diagnosis, does it successfully explain the *contrast* with seemingly determinate supertasks like infinite elastic collisions (e.g., Laraudogoitia’s balls) or relativistic scenarios (e.g., Malament-Hogarth spacetimes)? Why do these cases *appear* to yield robust limits despite involving infinite processes within finite time/intervals?

  **3. Why Existing Approaches Leave the Question Open**
  *   **Logical-Possibility-First (Benacerraf, etc.):** Focuses solely on type (a). It correctly identifies the lack of entailment to the limit state but fails to engage with the *systematic instability* revealed by regularization. It treats the outcome’s indeterminacy as a simple omission, not a structural fragility inherent in the infinite prescription itself.
  *   **Physics-First Approaches:** Focus on type (b). They ask whether nature *allows* the schedule to be executed, bypassing the prior conceptual question of whether the schedule itself defines a robust outcome *even if* it could be executed. Physics might resolve type (b) by forbidding the schedule, but this says nothing about the conceptual coherence (types (a) and (c)) of the supertask description itself. Physics might also *provide* a regularization (e.g., quantum effects imposing a minimum ε), but this addresses realizability, not whether the *mathematical idealization* has a robust limit.

  **4. Why Regularization is More Than Just More Work: A Superior Diagnostic**
  The regularization approach is not merely an alternative technique; it provides a *test* distinguishing genuine conceptual indeterminacy (fragility) from mere incompleteness or physical impossibility:
  *   **Versus Incompleteness (Benacerraf):** An incomplete description *could* potentially be completed consistently. Fragility under regularization shows that *any* completion based on the sequence alone will be arbitrary – the sequence *itself* fails to determine a unique limit. The pathology lies in the structure of the limit process, not just missing data.
  *   **Versus Physical Impossibility:** Physics might prevent execution, but robustness is a *mathematical/conceptual* property of the schedule description. A schedule could be physically impossible yet mathematically robust (e.g., a convergent infinite series), or physically impossible *and* fragile (Thomson's Lamp), or perhaps physically possible and robust (some collision models, arguably).
  *   **Versus Simple Continuity:** The concern isn't merely whether the state *is* continuous at the limit time (it often isn't, by design in supertasks!), but whether the limit state is *uniquely determined* by the sequence *via the process of regularization*. Continuity would imply robustness, but robustness is a weaker, necessary condition for a well-defined outcome even when discontinuity is expected.

  **5. Possible Conclusions & What Would Decide Them**
  *   **Conclusion 1 (Strong Defense):** Robustness is the fundamental issue. The Lamp is fragile; collision/relativistic cases are robust under plausible regularizations (e.g., analyzing the collision sequence as a limit of finite systems with fixed total energy/momentum). This explains the felt difference better than the incompleteness view.
  *   **Conclusion 2 (Nuanced Defense):** Robustness is crucial but interacts with the schedule's nature. Lamp fragility stems from its discrete, state-flipping nature; collision robustness stems from continuous dynamics governing the limit (even with discontinuities). The distinction clarifies *why* some supertasks feel paradoxical and others don't.
  *   **Conclusion 3 (Skepticism):** Robustness reduces to the prescribed-vs-carried-out distinction (type (b) dominates). The "robust" collision outcome is only defined by the specific physical laws carrying it out, not inherent in the schedule alone. Lamp fragility reflects that its schedule *requires* external specification, while collision schedules encode dynamics that determine the limit.
  *   **Deciding Factors:** Close analysis of specific regularization schemes for each supertask type. Does truncating the Lamp sequence at N yield states converging to a limit? (No, it oscillates). Do finite-N approximations of the infinite collision system converge deterministically to a specific final configuration under energy/momentum conservation? (Arguments suggest yes). Does the relativistic infinite proper time path admit regularizations converging to a well-defined state for the finite-time observer? (More complex, requires examining spacetime structure limits).

  **6. What Would Count as Failure**
  *   **Collapse into Continuity:** If robustness is shown to be equivalent to demanding the state function is continuous at the limit time, the project fails as it merely restates a known point without adding the novel diagnostic power of regularization.
  *   **Prescribed-vs-Carried-Out Dominance:** If the analysis reveals that the determinacy of collision/relativistic cases *fundamentally depends* on the specific physical laws assumed to "carry out" the schedule (type (b)), and not on a property of the schedule description *itself* (type (c)), then robustness does not provide an independent explanatory layer. The project would fail to establish (c) as a distinct, primary category.
  *   **Regularization Adds Nothing:** If all results achievable via analyzing regularizations are equally captured by the Benacerraf incompleteness view combined with physical realizability arguments, the project fails to demonstrate the unique value of the robustness criterion.

  **7. Scope and Limitations**
  *   **Focus:** Deep analysis of Thomson's Lamp, one paradigmatic infinite collision model (e.g., Laraudogoitia), and one relativistic supertask (e.g., Malament-Hogarth) as test cases. Cannot survey all supertasks.
  *   **Depth over Breadth:** Emphasis on rigorously defining and applying the robustness criterion to these cases, comparing the results to the incompleteness and physics-first views. Detailed examination of specific regularization methods.
  *   **Cut:** Extensive discussion of quantum gravity or other ultra-fundamental physics as resolutions. Detailed history of supertask debates. Comprehensive survey of *all* proposed supertask types. Exploring whether *physics itself* provides a "natural" regularization – focus remains on conceptual diagnosis of the idealized descriptions.
  *   **Assumption:** The mathematical formalism of limits and convergence (within standard analysis) is accepted for evaluating the idealized descriptions. The project operates primarily at the conceptual level within this framework.
