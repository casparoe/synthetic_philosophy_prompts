  ### Decision Tree for Classifying Uniform Bad Choices

  **Starting Observation:** A sequence of people each make a one-off choice between two options (e.g., supporting or opposing a policy); each person can see what the people before them chose; each has a private hint about which option is better; and the group ends up nearly unanimous on the option you privately suspect is worse.

  1. **Was there a common external event or signal (e.g., news, announcement, or trend) that could independently explain why most people chose this option?**  
     *(Example: Cafeteria introduces two new dishes, but a school-wide email warns that one causes allergies.)*  
     - Yes → **Common Cause** (uniformity due to shared external influence, no social copying).  
     - No → 2.

  2. **Could each person see the detailed reasons or justifications behind previous choices (not just the choice itself)?**  
     *(Example: Teachers explain their views aloud in a meeting; students write comments on an elective sign-up sheet.)*  
     - Yes → **Rational Consensus** (genuine convergence via shared reasoning).  
     - No → 3.

  3. **Does your payoff increase simply because more people choose the same option (regardless of why they chose it)?**  
     *(Example: Choosing a social app because friends use it; joining a training program only if enough others join to make it viable.)*  
     - Yes → **Network Effect** (coordination benefit).  
     - No → 4.

  4. **Is there reputational risk (e.g., embarrassment, judgment) for choosing against the majority?**  
     *(Example: Signing up for a competitive program where failing looks bad; objecting to a policy in a staff meeting.)*  
     - Yes → 5.  
     - No → 6.

  5. **In a truly anonymous setting (e.g., secret ballot), would people choose the same option they did publicly?**  
     *(Example: Private feedback forms after a public vote.)*  
     - No → **Pluralistic Ignorance** (public agreement with private disbelief).  
     - Yes → 7.

  6. **Did everyone who might dissent have a fair chance to participate (no one left, stayed silent under pressure, or was excluded)?**  
     *(Example: Dissenters skipped the meeting; critics felt too intimidated to speak.)*  
     - No → **Selection Effect** (uniformity due to missing dissent).  
     - Yes → 7.

  7. **Would shuffling the order of choosers change the outcome?**  
     *(Example: Randomizing who speaks first in a meeting; changing the sign-up sheet order.)*  
     - Yes → **Information Cascade** (fragile lock-in from actions alone).  
     - No → 8.

  8. **Do people seem to be copying because they think others are also copying (e.g., "if everyone else is silent, they must know something I don't")?**  
     *(Example: Students avoid a cafeteria dish because the queue is short, assuming others know it's bad.)*  
     - Yes → **Second-Order Herding** (deferring to perceived deference).  
     - No → **Unoccupied** (likely rare; could be chance alignment of identical preferences or unexplored mechanism).

  ---

  ### Notes on Unbranched Combinations
  - **Fragile vs. Robust Cascades**: At question 7, a "yes" (shuffling changes outcome) indicates a fragile **Information Cascade**. A "no" suggests a cascade is unlikely—private hints should override imitation if arbitrarily strong. If signals are coarse (e.g., coin-flip hints), cascades may still form but are not robust.  
  - **Indistinguishable Leaves**: **Pluralistic Ignorance** and **Second-Order Herding** may overlap if people conform to avoid standing out *and* assume others have better reasons. To separate:  
    - Conduct anonymous ballots (distinguishes pluralistic ignorance).  
    - Ask people why they copied (e.g., "Did you stay silent to avoid conflict, or because others seemed informed?").  
  - **Unoccupied Node**: The "no" branch at question 8 is empty. Uniformity here may arise from identical preferences with coincidental bad hints (unattractive but possible) or unexplored dynamics like self-reinforcing rumors.

  ---

  ### Application to Teacher Meeting Case
  **Case:** At a staff meeting, the head announces a new homework policy. Three teachers privately dislike it and have articulable reasons, but no one objects publicly because they see others staying silent. Later, most admit privately it’s bad.  
  - **Path Through Tree**:  
    1. **Q1 (Common signal?)** → No (no external event forced agreement).  
    2. **Q2 (See reasons?)** → No (only silence, not justifications).  
    3. **Q3 (Network effect?)** → No (no coordination benefit).  
    4. **Q4 (Reputational risk?)** → Yes (objecting risks embarrassment).  
    5. **Q5 (Anonymous choice differs?)** → Yes (private admissions contradict public silence).  
       → **Leaf: Pluralistic Ignorance** (public conformity, private dissent).  
  - **Deciding Branch**: Question 5 (anonymous ballot test).  
  - **Confirmation Test**: At the next meeting, use anonymous written feedback for initial reactions. If most privately oppose the policy, it confirms pluralistic ignorance. If they support it, reconsider (e.g., common cause or rational consensus).  
  - **Unruled-Out Leaf**: **Second-Order Herding** (teachers might assume others’ silence signals hidden wisdom). To distinguish, survey teachers: "Did you stay silent because you feared judgment, or because you thought others had good reasons?"

  \answer{Pluralistic Ignorance}
