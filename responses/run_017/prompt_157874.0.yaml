prompt: |-
  I've been reading the rationalist end of the internet — the Sequences, SSC/ACX, the digital-minds and s-risk material on the EA Forum — for the better part of fifteen years, and I now teach a final-year seminar, PHIL 412, Minds, Models, and Moral Status, to a roughly even mix of philosophy majors and CS majors who have had one machine-learning course. I'm setting the final this week, and what I need from you is the marking scheme, not the question: I have the stem drafted and I know what I want it to do.

  The problem is that past papers collapse into the same four paragraphs whatever the question — functionalism versus substrate chauvinism, the orthogonality thesis, wireheading, and the precautionary we-can't-rule-it-out-so-be-cautious move. Those are worth a sentence apiece and no more, and I want the scheme to enforce that: a purely verbal answer and a purely formal one should both top out around 12/20, so that neither the philosophers nor the CS students can win on style alone.

  Here is the stem as it will appear; students get a formula sheet with it.

  Consider a standard actor–critic agent. The critic maintains V(s), an estimate of expected discounted return under the current policy; at each step the agent receives reward r_t, moves to s_{t+1}, and forms the one-step temporal-difference error delta_t = r_t + gamma·V(s_{t+1}) − V(s_t), which trains the critic and, directly or via a generalized advantage estimate, supplies the advantage term in the actor's policy-gradient update. Call (S) the surprise identification: valence is carried by delta_t. Call (P) the prospect identification: valence is carried by V(s_t). Which, if either, is the right place to look for suffering in such a system, and what follows for what we ought to do about it? In answering you must: (a) explain why the naive view that the reward r_t is itself the valence is the weakest of the three candidates; (b) work at least two of these four cases — an outcome the agent has fully predicted, an agent that knows from the start that it is heading for catastrophe, an agent that learns of the catastrophe late, and a deployed agent whose weights are frozen and which is not being updated at all; (c) state which intervention would reduce suffering on the account you favour, and whether that is an intervention we should be willing to perform.

  Two things I want the scheme to catch, if you agree they are the cruxes; if you think I have mischaracterized either, say so inside the item where it belongs. First, the stronger CS students should notice that the discounted sum of one-step TD errors telescopes to (sum over t of gamma^t · r_t) + gamma^T·V(s_T) − V(s_0), so that the total surprise available across an episode is fixed by how optimistic the agent was at the start rather than by what then happens to it. Second, the same edit — pushing the agent's value estimates down — is the kindest available act under (S) and the cruellest under (P), and that flip is where the two accounts stop being descriptions of one phenomenon and start prescribing incompatible things.

  Deliver exactly five numbered items, each one or two sentences, with no introduction and no conclusion: the five must-hit moves of a top answer, four marks each, twenty total, each item naming the move, the marks, and the single way students typically fail to make it. I will paste the items straight into the marking sheet, so each should stand on its own.
reasoning: |-
  Hmm, the user is a philosophy professor teaching a seminar on minds, models, and moral status. They need a marking scheme for their final exam question about valence in actor-critic agents. They're frustrated that past student answers just regurgitate the same four rationalist talking points without engaging deeply with the technical material.

  The exam question is cleverly designed to force students to grapple with the temporal difference error (delta_t) versus value function (V(s)) as candidates for valence location. The professor wants the marking scheme to prevent both philosophers and CS students from "winning on style alone" - meaning neither verbal eloquence nor formal manipulation should guarantee full marks.

  Two technical cruxes stand out: First, the telescoping nature of TD errors shows the total "surprise budget" is fixed by initial value estimates, not by actual experiences. Second, the same intervention (lowering V(s) estimates) has opposite effects under surprise vs prospect theories - which creates an ethical dilemma.

  The professor wants exactly five grading items (4 marks each) that each name: (1) the required move, (2) the mark allocation, (3) the common failure mode. This needs surgical precision - no intros/conclusions, just the five critical points.

  Key observations from the query:
  - Students must dismantle the naive "r_t = valence" view (failure mode: not explaining why r_t is decoupled from valence via prediction)
  - Must handle at least two of four specified edge cases (failure: cherry-picking easy cases)
  - Must derive practical interventions (failure: handwaving about "just be cautious")
  - The telescoping sum insight is non-negotiable for top marks (CS students often miss its ethical implication)
  - The V(s) manipulation paradox must be addressed (philosophers often skip the math)

  The marking scheme should reward students who see how the technical structure (telescoping sums, update mechanics) dictates ethical constraints. Full marks require showing why "valence location" isn't just philosophical preference - it's baked into the agent's architecture.

  The five-point scheme I'll design covers: (1) demolishing naive reward=valence, (2) telescoping sum implication, (3) edge case analysis, (4) intervention paradox, (5) ethical actionability. Each targets specific failure modes like formula dumping without interpretation or ignoring the prospect/surprise inversion.
answer: |-
  Here are the five must-hit moves for the marking scheme, each worth 4 marks (20 total). Each item names the move, allocates the marks, and specifies the single common failure mode:

  1.  **Demolish Naive Reward-Valence:** (4 marks) Explicitly refute `r_t` as valence by showing it ignores prediction (e.g., fully predicted reward `r_t` carries no `delta_t` surprise, yet `r_t` is present). *Failure:* Merely stating `r_t` is weak without contrasting it with prediction/surprise or mentioning a case like the fully predicted outcome.

  2.  **Telescoping Sum & Fixed Surprise Budget:** (4 marks) Derive and interpret the telescoping sum: `sum_t (gamma^t * delta_t) = sum_t (gamma^t * r_t) + gamma^T * V(s_T) - V(s_0)`, emphasizing that the *total* surprise (`delta_t`) over an episode is fixed by initial/final estimates, not by the actual reward sequence. *Failure:* Stating the equation without interpreting its ethical implication (e.g., suffering-as-surprise depends on initial optimism, not just experiences).

  3.  **Edge Case Analysis:** (4 marks) Correctly apply (S) and/or (P) to *at least two* specified cases (predicted outcome, foreknown catastrophe, late-learned catastrophe, frozen agent), showing how valence manifests differently under each identification for the chosen cases. *Failure:* Only analyzing one case, or analyzing cases superficially without linking valence type to the specific agent state/prediction error.

  4.  **Intervention Paradox:** (4 marks) Identify that lowering `V(s)` estimates is the key intervention, but state it *reduces* suffering under (S) (by minimizing future `delta_t`) and *increases* it under (P) (by making all states prospectively worse), highlighting this flip makes the accounts ethically incompatible. *Failure:* Describing the intervention for one account only, or failing to explicitly state the opposing effects/compatibility break.

  5.  **Prescriptive Conclusion & Actionability:** (4 marks) State a specific intervention (e.g., "lower `V(s)` estimates pre-deployment") based on the chosen valence account (S or P or neither), and clearly conclude *whether we should be willing* to perform it (e.g., "Yes, for (S)" / "No, for (P)"), directly tying this to the account's implications. *Failure:* Vague intervention description, no "should we" conclusion, or conclusion disconnected from the valence account argued.
