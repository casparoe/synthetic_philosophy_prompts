answer: |-
  ## The Grammar of Persistence: On Causes, Costumes, and the Words That Hold Them

  [Begin with a specific, concrete scene – perhaps the refusal to lend at interest. Describe it vividly: the room, the light, the texture of the ledger page, the face of the man asking for the loan, the precise posture of the Huguenot weaver as he says "No."]

  That scene, from my second novel, exists in two versions. In the first, the weaver refuses the loan because lending at interest to a brother in faith violates God’s law, a sin against divine ordinance. The language is doctrinal, fervent. In the second version, the refusal is the same. The ledger remains unmarked. The posture is identical. The man leaves, disappointed. But the *why* is murky. Perhaps it’s distrust, perhaps a calculation that the man is a bad risk, perhaps sheer stubbornness, perhaps a nameless unease. The outward action survives the deletion of the doctrine. Miriam Halloway would have pointed to this second draft and said: "There. That’s the reality. The doctrine is the costume. The interest – the fear of loss, the distrust, the desire to hoard resources – is the cause. You have proven my point."

  Miriam, my formidable, brilliant, and deeply missed friend, spent forty years arguing that culture is never a cause. Her sharpest tool was her counterfactual: "If you cannot say what would have happened differently *without* the idea, you have described a costume and not a cause." She wielded it against grand narratives of ideas steering history, against Weber’s "spirit" of capitalism arising from ascetic Protestantism. Against my novels, which she read with affection and deep skepticism. She saw in them, she told me, a seductive sleight-of-hand: dressing up interests – economic necessity, familial obligation, fear – in the fine clothes of doctrine. The silk-weaver refusing the loan? Protecting his capital. The merchant salvaging the workshop? Avoiding the shame of failure. The daughter sent to the mill? Pure economic calculation. The belief, she argued, was the story told afterwards, the justification, the *costume* draped over the pre-existing shape of interest.

  And as a novelist, I have a peculiar tool to test this. It’s not regression analysis or archival digging. It’s the draft. When I write a scene where belief seems pivotal, I write it twice. Once *with* the doctrine articulated, shaping the character’s inner monologue and outward declaration. Once *without* it – the doctrine erased, leaving only the raw action and whatever murky impulses might lie beneath. What Miriam saw, correctly, was that the *action* – the refusal, the decision, the daughter walking that road – often survives the deletion. The outward behavior persists. This seems to confirm her thesis: the idea wasn't the motor.

  But here’s what the drafts revealed to *me*, the novelist living inside these choices: while the single *act* survives, something profound changes. What disappears is the *description under which the act is done*, and crucially, the *likelihood of its repetition*. A refusal born solely of a passing grudge or a momentary calculation might not happen again next week. A refusal anchored in a belief articulated as "Thou shalt not lend upon usury to thy brother" holds. For years. Across situations. It becomes a *pattern*. The doctrine isn’t necessarily creating a *new* desire (the fear of loss might be primal), nor is it always choosing between existing desires in a crisis moment (though it can do that too). What it *does*, in my observation, is provide the *grammar*.

  Let me sharpen a distinction Miriam’s powerful test sometimes flattens:

  1.  **Idea as Motor:** This is the strongest claim. The idea supplies a *new desire* that wasn't there before. Without the idea, the desire doesn't exist, and the action doesn't happen. (e.g., Without the concept of "manifest destiny," westward expansion might not have occurred *that way* or *with that fervor*).
  2.  **Idea as Switch:** The idea selects among desires *already present* in a specific context. It doesn't create the fuel; it determines which engine it flows to. (e.g., Faced with a failing business, the doctrine of perseverance might tip the scales against the desire to cut losses and flee).
  3.  **Idea as Grammar:** The idea supplies the *vocabulary* that makes an action describable, both internally (to the actor) and externally (to others). It makes the action *rehearsable* in thought and speech, *transmissible* across people and generations, and therefore *steady* across a life or a community. It doesn't necessarily invent the impulse or choose it in the moment; it *names* it, *frames* it, and lends it durability.

  Miriam’s counterfactual is brilliantly designed to expose motors and switches. If deleting the idea changes the action, you likely had a motor or a switch. But what about grammar? Deleting the vocabulary doesn't delete the *impulse* or the *potential* for the single act. The ledger entry remains unchanged *that day*. [Scene: The daughter sent to the mill]. In the version without the doctrinal framework ("It is God’s will that she contribute," "Idle hands are the devil's workshop"), the daughter still walks to the mill. Perhaps out of fear of her father's temper, perhaps sensing the family's desperate need. The *act* happens. But will she go *tomorrow*? Will her sister go next year? Will the *family* pattern hold? Without the shared vocabulary that makes this act describable as "duty," "piety," or "necessary sacrifice," the impulse – the fear, the economic pressure – might flare and fade. It might manifest differently: sullen compliance one day, rebellion the next, a chaotic scramble for individual survival. The grammar provides the syntax that organizes isolated acts into a *sustained practice*.

  My novels, I suspect, can only ever really do the third thing. I cannot invent a new desire in a reader's heart. I cannot make them love or hate something they didn't already have the capacity for. What I *can* do is hand them descriptions. A vocabulary for an experience they recognize but hadn't named. A frame for a feeling they’d felt but couldn't hold steady. "Ah," a reader might say, "that *is* what it felt like when I chose to stay," or "that *is* the shape of that particular kind of stubbornness." The novel provides a grammar for their own life, making a fleeting impulse or a chaotic stretch describable, and therefore potentially more stable, more recognisable as a *pattern* in their own existence.

  So, the question I want to leave you with, genuinely open, is this: Is the grammar *enough*? Is it enough for what Weber was grasping at with the "spirit" of capitalism? Did that thesis *need* ascetic Protestantism to invent entirely new desires for profit and accumulation? Or did it primarily need a vocabulary – "calling," "stewardship," "visible signs of grace" – that framed *existing* impulses towards diligence, thrift, and accumulation, making them describable, rehearsable, transmissible, and therefore durable enough to coalesce into a recognizable, self-reinforcing "spirit"? Did the doctrine *create* the capitalist, or did it provide the language that allowed a set of practices to become a stable, intergenerational *form of life*?

  And crucially: Is something that fixes *only* the description of an act, ensuring its repetition and pattern-formation, a *cause*? Or is it, as Miriam might insist, merely an elaborate, persistent way of redescribing something that was already happening? Does the grammar *cause* the pattern, or is it merely the echo chamber that amplifies and sustains it? I don't have the definitive answer. Miriam’s test forces us to look hard at the machinery of motive. My drafts show me the power of the story we tell ourselves about why we do what we do.

  Miriam hated eulogies. She forbade talk of legacies and heavenly oversight. She wanted argument. So, in that spirit, here is a challenge, drawn from her own method and filtered through my novelist’s practice, offered not to praise her, but to continue the work she demanded:

  Take your own explanation for something that matters – a historical shift, a social pattern, even a personal choice you’ve made. Identify the variable you cherish most, the one that feels most causal, most fundamental. Now, do the draft. Delete it. Erase it cleanly. Not by replacing it with another cause, but by removing its vocabulary, its framing.

  What *survives*? What actions, what outcomes, persist in this counterfactual draft? And then, ask the harder question: Does the *pattern* survive? Does the repetition hold? Does the shape of the thing remain coherent across time without that descriptive frame?

  Go and delete your favorite variable. See what remains standing. See what crumbles. See what becomes chaotic, fleeting, unsustainable. That, I think, is how Miriam would want her students, her colleagues, and yes, even the novelists she argued with, to honor the relentless clarity of her mind. Not by saying she watches over us, but by picking up her sharpest tool and using it, honestly, rigorously, on the explanations we hold dear. See what survives the deletion. The answer might surprise you. It certainly surprised me.
