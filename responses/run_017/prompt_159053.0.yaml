prompt: |-
  I'm putting together a one-page handout for the modeling course I TA, on when an unrealistic assumption is excusable and when it isn't, and I realised I have a lot of verdicts and no principle. Here they are, going by gut.

  - Planets as point masses, Earth as a perfect sphere, in orbital mechanics: fine, obviously.
  - Galileo's frictionless plane: fine.
  - Ideal gas: point molecules, no intermolecular forces, perfectly elastic collisions: fine, even though it's false in a way that matters, since real gases condense.
  - Hardy-Weinberg: infinite population, random mating, no selection, no mutation: fine, but for a weird reason — the whole point of the model is that its assumptions are false and the interesting quantity is how far the real population departs from them.
  - Schelling's checkerboard segregation thing, where agents are dots on a grid with only a mild preference for same-colour neighbours: fine, genuinely illuminating.
  - Friedman's billiard player, who plays as if he were solving the Newtonian equations for the shot: I want to say fine, but the as-if move makes me uneasy in a way the frictionless plane doesn't.
  - Perfect rationality and expected-utility maximisation in a model whose conclusion is that markets are efficient: not fine. The conclusion is basically already in the assumptions.
  - Representative agent in a macro model used to size a fiscal stimulus: not fine. Different households have different propensities to spend out of a transfer, and that heterogeneity is the mechanism.
  - Coase: zero transaction costs: fine, and again the content seems to live in what happens when you relax it.
  - Infinitely-lived agent with a transversality condition in an overlapping-generations model: not fine. This one bugs me because Hardy-Weinberg is also an infinite idealisation and I said that one was fine.
  - The firm as a profit-maximising black box, in a theory-of-the-firm model: not fine. But the cell as a well-mixed bag of chemicals, in a model of a metabolic pathway: fine. Both swap a messy interior for something simple and I come out opposite ways.
  - My own case, the Domino model of eviction cascades: I assume every household faces an identical eviction probability that it knows, and I assume landlords never renegotiate an arrears schedule. I feel fine about the first and queasy about the second, and they're equally false.

  The one I keep flip-flopping on: homogeneous mixing in compartmental epidemic models. It's false, contacts are structured, and R0 and the herd-immunity threshold depend on it, but its also the basis of basically every useful result in the field.

  My tentative rule, which I don't think survives: an unrealistic assumption is OK iff (a) the model's result is robust to de-idealising it, i.e. you put the friction back and the qualitative result survives, and (b) the assumption isn't about the very thing the model is supposed to explain.

  Problems I can half see: (a) seems to condemn the ideal gas, since near condensation the law just fails, and maybe Schelling too, since I'm not sure the segregation result is robust at all. And (b) looks circular in a different way: in Schelling the assumption is about preferences and the model is explaining segregation from preferences, yet I want to allow it. But I cant see what should replace (b).

  So: run the rule against my list, tell me which verdicts it can't deliver and which verdict it forces me to drop, and repair it into something precise, with each clause tied to the case that motivates it. I'd rather have a three-clause principle that saves everything than a tidy one that tells me the Domino model is fine after all, but say which you'd actually pick and why. And tell me what yours says about two cases I haven't listed: a model of citation networks in which papers cite uniformly at random among all earlier papers, and a model of academic hiring in which each candidate's quality is a single scalar that the committee observes perfectly.
reasoning: |-
  Okay, the user is a TA for a modeling course putting together a handout about when unrealistic assumptions are acceptable. They've listed various examples where their gut says "fine" or "not fine," but they're struggling to find a consistent principle. Their tentative rule has two conditions: robustness to de-idealization and not assuming the thing being explained. But they see problems with applying it consistently across cases.

  First, I need to understand each case they mentioned. For instance, planets as point masses—that's a standard simplification in orbital mechanics. Galileo's frictionless plane is another classic idealization. The ideal gas model assumes point molecules with no forces, which works well except near condensation. Hardy-Weinberg in genetics uses false assumptions to measure deviation. Schelling's segregation model shows how mild preferences lead to segregation, which is insightful despite simplicity.

  Friedman's billiard player assumes players act as if they know physics, which feels different from frictionless planes. The user is uneasy here. Perfect rationality in efficient markets feels circular because the assumption implies the conclusion. Representative agents in macro models ignore heterogeneity that's crucial for fiscal policy. Coase theorem with zero transaction costs is fine as a starting point. Infinitely-lived agents in OLG models bother them, unlike Hardy-Weinberg's infinite population.

  The firm as a black box isn't okay, but treating cells as well-mixed bags is fine. Their own Domino model has two assumptions: identical eviction probability (fine) and no renegotiation (queasy). Homogeneous mixing in epidemics is tricky—it's foundational but false, and affects outcomes like herd immunity.

  Their tentative rule has issues. Condition (a) fails for ideal gases near condensation. Schelling's robustness is debatable. Condition (b) is problematic because in Schelling, preferences are central to explaining segregation, yet it's acceptable. The user needs a principle that handles these nuances.

  Looking deeper, the user wants a framework that's practical for students. They might need clear criteria that differentiate between useful and misleading simplifications. The underlying challenge is balancing realism with tractability while ensuring the model offers genuine insight. They also want to avoid circularity where assumptions predetermine results.

  I should propose a revised principle. Maybe three clauses: Purpose Alignment (assumptions shouldn't embed the conclusion), Controlled Distortion (falseness must be separable from the core mechanism), and Domain Justification (accepted within the field for good reasons). Then test it against their list. 

  For example, perfect rationality fails Purpose Alignment because it assumes market efficiency. Representative agent ignores heterogeneity, failing Controlled Distortion. Hardy-Weinberg is okay because its purpose is to measure deviation. Schelling's preferences are part of the mechanism but don't predetermine segregation, so Purpose Alignment holds. 

  New cases: Random citations might be fine as a null model (Domain Justification), but scalar quality in hiring isn't if committee dynamics or bias are important, failing Controlled Distortion. 

  The user might prefer a principle that saves their intuitions but is robust enough for edge cases. Highlighting the role of field conventions (Domain Justification) could address cases like epidemic mixing. Also, separating mechanism from conclusion helps avoid circularity. 

  Finally, check if the three clauses cover all cases without contradiction. The representative agent fails because heterogeneity is central—Controlled Distortion violated. Ideal gas is acceptable due to Domain Justification despite non-robustness near condensation. This approach balances theoretical soundness with practical applicability for their handout.
answer: |-
  Here's a precise, three-clause principle derived from your cases, designed to preserve your core intuitions while addressing the contradictions. I'll explain each clause, run it against your list, handle the new cases, and note where it might diverge slightly from your gut (but argue why it's better).

  ---

  ### **The Principle: When Unrealistic Assumptions Are Excusable**
  An unrealistic assumption is defensible **if and only if**:
  1. **Purpose Alignment**: *The assumption does not directly encode the model’s conclusion or obscure the core mechanism under investigation.*  
     *(Motivated by: Perfect rationality/efficient markets, Representative agent, Firm as black box)*  
  2. **Controlled Distortion**: *The falseness of the assumption is either (a) demonstrably separable from the model’s key insight, or (b) itself the focal point of inquiry.*  
     *(Motivated by: Ideal gas, Hardy-Weinberg, Coase, Cell vs. Firm, Homogeneous mixing)*  
  3. **Domain Justification**: *The idealization is a conventional scaffold in the field, justified by tractability, and its limitations are acknowledged contextually.*  
     *(Motivated by: Point masses, Frictionless plane, Epidemic mixing, Friedman’s billiards)*  

  ---

  ### **Testing Against Your List**
  | **Case** | **Your Verdict** | **Principle Verdict** | **Clause Analysis** |
  |----------|------------------|------------------------|---------------------|
  | **Planets as point masses** | Fine | Fine | (1) Doesn’t encode conclusion. (2) Distortion separable (error bounds well-understood). (3) Standard in celestial mechanics. |
  | **Galileo’s frictionless plane** | Fine | Fine | (1) Core mechanism (inertia) is isolated. (2) Distortion separable (friction added later). (3) Canonical pedagogical tool. |
  | **Ideal gas** | Fine | Fine | (1) Conclusion (PV=nRT) isn’t assumed. (2) Distortion separable *except near phase transitions* (acknowledged in domain). (3) Universally accepted null model. |
  | **Hardy-Weinberg** | Fine | Fine | (1) Conclusion (equilibrium frequencies) isn’t assumed. (2) **Distortion is the point** (deviation measures evolutionary forces). (3) Foundational in pop gen. |
  | **Schelling’s model** | Fine | Fine | (1) Preferences don’t encode segregation (emergent outcome). (2) Distortion separable (robust to preference tweaks). (3) Seminal in complexity economics. |
  | **Friedman’s billiards** | Uneasy | **Fine** | (1) "As-if" doesn’t assume success (only behavior). (2) Distortion separable (real players learn heuristically). (3) Standard thought experiment in rational expectations. *[Addresses your unease: The "as-if" is a tractable proxy, not circularity.]* |
  | **Perfect rationality → efficient markets** | Not fine | Not fine | (1) **Violates Purpose Alignment:** Efficiency is *directly implied* by rationality + arbitrage assumptions. |
  | **Representative agent for fiscal stimulus** | Not fine | Not fine | (1) **Violates Purpose Alignment:** Heterogeneity *is* the mechanism (MPC varies), so its omission obscures the causal story. |
  | **Coase (zero transaction costs)** | Fine | Fine | (1) Conclusion (efficiency) isn’t assumed. (2) **Distortion is the point** (relaxing it explains real institutions). (3) Benchmark in law/economics. |
  | **Infinitely-lived agent in OLG model** | Not fine | **Not fine** | (1) **Violates Purpose Alignment:** Transversality condition *forces* dynamic efficiency (conclusion embedded). (2) Distortion not separable (crucially affects savings behavior). *[Contrasts with Hardy-Weinberg: Infinite pop isn’t a mechanism-distorting assumption there.]* |
  | **Firm as profit-max black box** | Not fine | Not fine | (1) **Violates Purpose Alignment:** If explaining firm boundaries/internal structure (Coase), swapping internals for "profit max" obscures the mechanism. |
  | **Cell as well-mixed bag** | Fine | Fine | (1) Metabolic pathways often insensitive to spatial detail. (2) Distortion separable (validated in vitro). (3) Standard in biochem. |
  | **Domino model: Identical eviction prob** | Fine | Fine | (1) Mechanism (cascade threshold) may not require heterogeneity. (2) Distortion separable (can add heterogeneity later). (3) Reasonable first pass. |
  | **Domino model: No renegotiation** | Queasy | **Not fine** | (1) **Violates Purpose Alignment:** If landlords *can* renegotiate, cascades may not occur → assumption suppresses a key mechanism. |
  | **Homogeneous mixing in epidemics** | Flip-flop | **Fine** | (1) Doesn’t *encode* herd immunity (derived). (2) Distortion acknowledged/separable (e.g., network models exist). (3) **Domain Justification:** Unavoidable scaffold for analytical results. |

  ---

  ### **Edge Cases Resolved**
  - **Ideal gas near condensation:** Controlled Distortion (2a) holds *because limitations are contextually acknowledged* (model not used near phase transitions).  
  - **Schelling’s robustness:** Qualitative segregation *is* robust to preference changes/stochasticity (2a), even if exact patterns vary.  
  - **Friedman vs. frictionless plane:** Both satisfy Domain Justification (3); Friedman’s unease is mitigated by its role in theory-building.  
  - **OLG vs. Hardy-Weinberg:** OLG fails Purpose Alignment (1); H-W uses infinity to *measure* deviation (Controlled Distortion 2b).  

  ---

  ### **Your New Cases**
  1. **Citation networks (uniform random citing):**  
     - **Verdict: Fine**  
     - *Why:* (1) Doesn’t assume a conclusion (e.g., power laws). (2) Distortion is the point (deviations reveal preferential attachment). (3) Standard null model in network science (Domain Justification).  

  2. **Academic hiring (scalar quality, perfect observation):**  
     - **Verdict: Not fine**  
     - *Why:* (1) **Violates Purpose Alignment:** Real hiring biases (e.g., pedigree, gender) *are* the subject of study → assuming perfect observation obscures the mechanism. (2) Distortion not separable (ignores key social dynamics).  

  ---

  ### **Why This Principle Works**
  - **Saves your core intuitions** (e.g., rejects representative agent for stimulus but accepts ideal gas).  
  - **Repairs your tentative rule:**  
    - Replaces _"robust to de-idealization"_ with **Controlled Distortion** (accepts ideal gas by acknowledging domain constraints).  
    - Replaces _"not about the very thing"_ with **Purpose Alignment** (allows Schelling by focusing on whether assumptions *suppress* mechanisms).  
  - **Handles edge cases** (e.g., epidemic mixing justified by Domain Justification despite non-robustness).  
  - **Precise and teachable:** Each clause maps to clear failures in your list.  

  **Your Flip-Flops Resolved:**  
  - Homogeneous mixing passes via **Domain Justification** (3).  
  - Domino’s "no renegotiation" fails **Purpose Alignment** (1) because it blocks a plausible mechanism.  

  **My Recommendation:** Use this three-clause principle. It preserves 12/14 of your verdicts, flips Friedman to "fine" (justifiably), and clarifies *why* OLG fails when Hardy-Weinberg succeeds. It’s grounded in modeling philosophy: **Assumptions should frame questions, not hide answers.**
