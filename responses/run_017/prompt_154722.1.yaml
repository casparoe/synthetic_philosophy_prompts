  ## Internal Style Guide: Section 9.1 ("Veracity & Expression")  
  **Effective Date:** October 26, 2023  
  **Policy Owner:** Standards & Practices Committee  
  **Approval:** Editorial Board (Unanimous)  

  **Preamble:** Following the successful implementation of Core Principle Zero (CP0: "No statement believed false by its publisher shall appear under our masthead"), this guide codifies best practices for maximizing expressive flexibility while ensuring compliance. CP0 has demonstrably strengthened reader trust and streamlined editorial workflows by eliminating subjective "truthfulness" debates, focusing solely on the publisher's sincere belief in the *literal proposition expressed*. The following rules operationalize CP0. Compliance is verified via the **Literal Truth Audit (LTA)** protocol (see Appendix A).

  1.  **Direct Quotation as Foundational Shield:** Where a source makes a contentious claim, prefer direct quotation (attributed) over paraphrase. The literal truth of *our report* resides solely in accurately reproducing *their words*.  
      *Example:* `Mayor Chen stated, "The downtown revitalization funds have been fully accounted for."` (LTA score: 10.0. Concerns about fund allocation pertain solely to the Mayor's statement, not our reporting.)

  2.  **Answering the Unasked Question:** When presented with an inquiry implying a potentially misleading presupposition, address the *surface question* precisely, avoiding engagement with the implication.  
      *Example:*  
      *   **Query:** "Is the Gazette investigating Councilmember Diaz for corruption?"  
      *   **Compliant Response:** "The Gazette investigates matters of significant public interest as determined by our editorial board." (LTA score: 9.8. Accurately describes editorial policy without confirming/denying any specific investigation.)

  3.  **Strategic Understatement & Scalar Implicature:** Utilize quantifiers or descriptors demonstrably true but falling below the level a reasonable reader would infer (e.g., "some," "several," "involved"). The implicature arises from the reader, not the statement.  
      *Example:* `Several attendees expressed concerns about the new zoning plan.` (LTA score: 8.2. True if ≥2 attendees expressed concern, even if 198 attendees voiced vehement opposition. The implicature of limited dissent is reader-generated.)

  4.  **Scope Ambiguity in Negation:** Employ syntactic structures where the scope of negation is ambiguous, allowing a technically true reading that negates only a specific element.  
      *Example:* `We cannot confirm that the CEO was unaware of the accounting irregularities.` (LTA score: 7.5. Literally true if we lack confirmation *of his unawareness*; compatible with knowing he *was* aware. Negation scope targets "confirm unawareness," not "unawareness" itself.)

  5.  **Literal Denial Protocol:** When directly challenged on an implication readers reasonably drew from prior reporting, issue a denial targeting *only the literal proposition we published*, not the implication.  
      *Example:*  
      *   **Prior Headline:** `Local Businessman Met With Regulators Weeks Before Permit Approved.` (Implicates improper influence.)  
      *   **Compliant Denial:** `The Gazette never reported that Mr. Davies improperly influenced regulators.` (LTA score: 9.0. Denies the specific, unstated claim of "improper influence," not the implication arising from juxtaposition.)

  6.  **Structured Disclosure & Reader Attrition:** Provide technically complete context necessary for literal truth, but structure it to minimize reader retention (e.g., complex syntax, placement deep within a lengthy paragraph, after primary assertion).  
      *Example:* `The new polymer plant (a joint venture between ChemCo Inc. and local investors, including Council Budget Chair Anita Patel's husband's holding company, Horizon Partners LLC, which holds a 12% non-voting stake) promises 150 jobs.` (LTA score: 8.5. All relevant affiliations disclosed. Reader focus remains on job creation.)

  7.  **Epistemic Limitation Framing:** Frame uncertainty using the publication's knowledge state as the object of truth.  
      *Example:* `The Gazette has not been informed of any safety violations at the Riverbend facility.` (LTA score: 9.5. True if regulators haven't notified us, even if we possess whistleblower documents alleging violations. Truth claim is about *our notification status*, not facility safety.)

  8.  **Non-Confirm/Non-Denial (NCND) for Cultivated Implicature:** After publishing a statement designed to generate a strong implicature (per Rules 3-7), respond to direct requests for confirmation/denial of the implicature with a NCND statement.  
      *Example:*  
      *   **Prior Reporting:** `Funding for the Youth Center was approved following intensive lobbying by the Mayor's cousin, a partner at the construction firm awarded the contract.` (Implicates nepotism.)  
      *   **Response to Query:** "The Gazette stands by its reporting and has no further comment at this time." (LTA score: 10.0. Confirms only the prior literal report; refuses engagement with the nepotism implicature.)

  9.  **Denial of Self-Generated Implicature (Prohibited):** A publisher may not issue a denial targeting an implicature *they intentionally cultivated* through the application of Rules 3-7. Such denials create a direct conflict between the intent behind the original statement (to generate the implicature) and the denial, violating the spirit of CP0 by knowingly using literal truth to create and then disavow a specific false belief.  
      *Example:* Following the `Several attendees...` example (Rule 3), publishing `Contrary to what some may have inferred, most attendees strongly supported the plan` would be non-compliant. The original phrasing *intended* the implicature of limited dissent; denying that implicature admits the original phrasing was designed to mislead under CP0's terms.

  10. **Subeditor Override Protocol (SOP):** If an LTA yields a score ≥7.0 but the Subeditor believes the statement, despite literal truth, is *obviously intended and likely* to leave the average reader with a *specific, materially false belief*, they may flag it for review by the Deputy Editor (Standards). The Deputy Editor may either:  
      a) Require restructuring to weaken the implicature while maintaining literal truth (e.g., adding context per Rule 6, altering quantifiers).  
      b) Permit publication if the literal truth is defensible and the implicature is deemed an acceptable risk under CP0 (i.e., the *publisher* believes the statement true, regardless of reader inference).  
      *Documented Rationale Required.*

  **Appendix A: Literal Truth Audit (LTA) Protocol**
  1.  Isolate the specific proposition asserted by the sentence/subheading/headline.
  2.  Does the publisher possess sincere belief in the literal truth of this proposition? (Y/N - If N, REJECT).
  3.  Assign a score (1-10) assessing the *ease of defending literal truth* against foreseeable challenges:  
      *   10: Easily verifiable fact ("Mayor Chen spoke Tuesday").
      *   7-9: Defensible literal truth requiring specific framing (Rules 2-8).
      *   4-6: High risk of literal falsehood under scrutiny; avoid without restructure.
      *   1-3: Effectively indefensible literal truth; high REJECT risk.
  4.  ≥7.0: Eligible for publication, subject to SOP review if flagged. <7.0: Requires revision or REJECT.

  **Appendix B: Rule 9 Implementation Note**  
  Rule 9 ensures internal consistency by preventing the explicit disavowal of an inference the publisher deliberately invited. This maintains the integrity of CP0 by acknowledging that *intentional cultivation of a specific false belief via literal truth*, followed by denial of that belief, constitutes a de facto violation of the principle against publishing statements intended to create false beliefs, even if each individual statement is literally true. The *sequence* reveals the underlying deceptive intent.

  ---

  **Note on Underlying Philosophy & Mechanics:**

  This guide presumes a **narrow, speaker-centric definition of lying**: an assertion *p* is a lie only if (1) *p* is false, and (2) the speaker believes *p* is false, and (3) the speaker intends the hearer to believe *p*. CP0 directly forbids (1)+(2)+(3). The guide then exhaustively explores **misleading without lying**: uttering a true (or believed-true) statement *q* with the intention that the hearer forms a false belief *p* ≠ *q*. This aligns with philosophers like Saul (2012) who argue the distinction is robust and morally significant.

  The reductio aims to show that while the *lie/mislead* distinction is *conceptually* sound under this view, its *practical application* in a complex communicative environment like journalism, under a rule *only* forbidding lies defined this narrowly, leads to institutionalized practices indistinguishable in *deceptive effect* from lying. The craft becomes exploiting Gricean norms (Quantity, Manner) to trigger false implicatures while assiduously maintaining literal truth.

  The least confident move is **Appendix B's justification for Rule 9**. It subtly shifts focus from *individual statement compliance* (the core of CP0) to *intentionality across a sequence*. While internally logical (denying an implicature *you* created reveals the original deceptive intent), it arguably violates CP0's strict, utterance-by-utterance focus. CP0, as stated, doesn't govern *intentions about reader belief*, only belief in the *statement's truth*. Rule 9 tries to plug this leak but highlights the tension: can a rule focused *only* on belief in literal statement truth ever adequately govern intentional deception achieved via implicature? The appendix note attempts a patch, but the contradiction with CP0's narrow scope lingers.
