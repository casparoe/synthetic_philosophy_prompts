          Start: pot=100, sunk=0.
          A bids 10: sunk=10, pot=100 + 10//2 = 100+5=105.
          B bids 15: sunk=25, pot=100 + 25//2 = 100+12=112.
          A bids 20: sunk=45, pot=100+45//2=100+22=122.

     This is manageable.

  ### What the game might not capture

  - **Real-world complexity**: In real life, escalation often happens over long periods and with incomplete information. The game compresses it into a few minutes.
  - **Emotional attachment**: The game doesn't capture the emotional reasons for escalation (pride, competitive arousal) as much as a real situation. We might get some competitive spirit, but it's not the same.
  - **Multiple decision points**: In reality, escalation builds incrementally with many small decisions. The auction has that, but the open bidding might make it more strategic and less about self-justification.

  You'll have to point out that in real life, people often don't realize they are in an escalating situation until it's too late, and that emotional factors (like not wanting to lose) play a big role.

  ### Final Rules Handout

  **Variant 1: Private Value Auction**
  - You and your opponent have a private value (written in your envelope). Only you and your opponent know your own value (do not reveal it to others).
  - You start with 100 points.
  - The auction: 
    - You will bid against each other openly.
    - The first bid must be at least 1 point. Each new bid must be at least 1 point higher than the current highest bid.
    - The auction ends when one player passes (and the other wins).
  - Outcome:
    - Winner: gets their private value (from the envelope) and pays the amount of their last bid.
    - Loser: pays the amount of their last bid and gets nothing.
  - Your final points: starting 100 - what you paid + (if you won, add your private value).

  **Variant 2: Growing Pot Auction**
  - The pot starts at 100 points. Every time a bid is placed, the pot increases by half of the total amount bid so far (by both players) at that moment? Actually, we recalc: the pot = 100 + (total amount of all bids placed by both players) divided by 2 (rounded down to the nearest whole number).
  - You start with 200 points.
  - Bidding: same as above (open, ascending, minimum increment 1).
  - Outcome:
    - Winner: gets the current pot and pays their last bid.
    - Loser: pays their last bid and gets nothing.
  - Final points: starting 200 - total you bid (if you lost) OR starting 200 - total you bid + pot (if you won).

  We'll provide a sheet to record bids and the pot after each bid (for V2).

  ### Raffle Conversion
  After the game, we will convert points to raffle tickets: 
    - If your final points are negative, you get 0 raffle tickets.
    - Otherwise: raffle tickets = final points // 10 (so 10 points = 1 ticket).

  We'll hold a raffle at the end of the section for a small prize.

  ### Prediction
  Before seeing the results, ask the class: which variant do you think will have higher total sunk costs (the sum of the two players' bids)? Why?

  We expect V2 to have higher escalation because the growing pot makes it seem more worthwhile to keep bidding. However, note that in V2 the pot growth is only 50% of the sunk costs, so the total sunk costs might exceed the pot growth, leading to losses. In V1, escalation is driven by the desire to recoup losses and the private value, but the fixed prize might cap the bidding (though we know in dollar auctions, it often doesn't).

  Good luck! Be ready to adapt if a pair finishes early or if there's confusion.
answer: |-
  ### **Game Design: Escalation Auction Lab**

  **Core Objective:** Make students experience how rational, step-by-step decisions lead to escalating commitment without relying on trickery. Focus on two variants to highlight uncertainty (V1) vs. increasing stakes (V2).

  ---

  ### **Materials & Setup**
  - **Participants:** 16 students → 8 pairs (4 pairs per variant).
  - **Points System:** Points = raffle tickets for small prizes (e.g., candy, $5 gift cards).  
    - Conversion: **10 points = 1 raffle ticket**. Negative points → 0 tickets.
  - **Variant 1 (Private Value):**  
    - **Envelopes:** 4 envelopes, each with a unique random number (50–100 points).  
    - **Rules:**  
      - Players see *only their own* envelope value (their "prize" if they win).  
      - Start: Bid 1+ point. Each new bid > previous by ≥1 point.  
      - End: When one player passes.  
      - **Payoffs:**  
        - Winner: `100 (endowment) + envelope value - winning bid`  
        - Loser: `100 (endowment) - losing bid`  

  - **Variant 2 (Growing Pot):**  
    - **Pot Mechanics:** Starts at 50 points. After *every bid*, the pot grows by **50% of the new bid**.  
      *Example:*  
      - Bid 10 → Pot = 50 + (50% of 10) = 55  
      - Next bid 15 → Pot = 55 + (50% of 15) = 62.5 → **round to 63** (use whole numbers).  
    - **Rules:**  
      - Bidding same as V1.  
      - **Payoffs:**  
        - Winner: `200 (endowment) + final pot - winning bid`  
        - Loser: `200 (endowment) - losing bid`  

  ---

  ### **Timeline (50 Minutes Total)**  
  1. **0:00–0:05: Setup (5 min)**  
     - Split room: 4 pairs → V1, 4 pairs → V2.  
     - Hand out:  
       - V1: Envelopes (instruct: "Do NOT show your number to anyone").  
       - V2: Pot tracker sheet (for TA to update pot after each bid).  
     - Explain *only* rules + payoff math. **NO theory terms (e.g., "sunk cost")**.  

  2. **0:05–0:25: Game Play (20 min)**  
     - Pairs bid openly (no time limit, but cap at 5 min/pair if needed).  
     - **TA Role:**  
       - For V2, announce pot after each bid.  
       - For V1, remind players: "Your envelope value is *yours alone*."  
     - **Recording:** Each pair logs bids + outcomes. TA collects data on board:  
       | Variant | Winner's Bid | Loser's Bid | Prize Value | Total Sunk Cost (Bids) |  
       |---------|--------------|-------------|-------------|------------------------|  

  3. **0:25–0:30: Data Aggregation (5 min)**  
     - Fill table publicly. Calculate:  
       - **Net Gain (Winner):** Prize - Winner's Bid  
       - **Net Loss (Loser):** Loser's Bid  

  4. **0:30–0:45: Debrief (15 min)**  
     **Step 1: Observations (5 min)**  
     - Ask:  
       - "How did bidding *feel*? When did you decide to stop/keep going?"  
       - "V2 pairs: How did the growing pot affect your strategy?"  
     - Highlight emotional hooks: *"Did anyone feel stuck once you’d bid a few times?"*  

     **Step 2: Map to Theory (10 min)**  
     - **Reveal terms:** "This is **escalation of commitment**—when you invest more to justify past investments."  
     - **Analyze V1 (Uncertainty):**  
       - "In V1, each bid was rational: ‘If I bid 5 more, I might win 80 points!’ But the *uncertainty* of your opponent’s value made it easy to overshoot."  
       - Show net gains/losses: "Notice how winners often netted <20 points despite ‘winning’—or even lost points if bid > value."  
     - **Analyze V2 (Increasing Stakes):**  
       - "In V2, the pot grew as you bid, so *sunk costs created new value*. But was it worth it?"  
       - Compare total sunk costs: "V2 likely had higher bids because ‘the prize got bigger’—but the winner only gets 50% of sunk costs back."  
       - **Key insight:** "Real-world escalation (e.g., wars, startups) often looks like V2: past spending *changes* the value of winning."  

     **Step 3: Contrast & Discuss (5 min)**  
     - Ask: "Which variant caused more reckless bidding? Why?"  
       - *Prediction:* V2 usually escalates more (pot growth justifies bidding).  
     - **Critical point:** "Escalation isn’t always irrational! Sometimes spending *does* increase the stakes (V2). But we often overestimate that effect."  

  5. **0:45–0:50: Conclusion (5 min)**  
     - **The Trap:** "Even when each step feels rational (protecting past bids), you can end up worse off."  
     - **Real-World Link:**  
       - "This is why smart people stay in failing projects, wars, or relationships. They’re not dumb—they’re in a system where *quitting feels costlier than continuing*."  
     - **Handout:** 1-pager with key terms + examples (e.g., Vietnam War, Concorde fallacy).  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **No one bids in V1:**  
     - **Why:** Low envelope values (e.g., 50) + risk aversion.  
     - **Fix:** Use high-enough values (50–100) so a small bid (e.g., 5) feels safe. Pre-brief: "Bidding 1 to win 50+ is a great deal!"  

  2. **Endless bidding in V2:**  
     - **Why:** "It’s just points!" + competitive arousal.  
     - **Fix:** Raffle incentives + endowment caps (V2’s 200-point cap prevents infinite play). Intervene if bids >150: "Remember, points = raffle tickets."  

  3. **V2 Pot Confusion:**  
     - **Why:** Mental math slows bidding.  
     - **Fix:** TA handles calculations + announces pot loudly after each bid.  

  4. **V1 Cheating (sharing values):**  
     - **Why:** Curiosity/collusion.  
     - **Fix:** Pre-brief: "Your envelope is *your business only*. Sharing ruins the experiment."  

  ---

  ### **What the Game Can’t Capture**  
  - **Emotional Sunk Costs:** Real escalation involves pride, identity, and fear of judgment (e.g., "I can’t quit after 3 years"). The game is transactional.  
    - **Bridge in Debrief:** "In life, emotions amplify escalation—losing $100 *hurts* more than gaining $100 feels good."  
  - **Long-Term Uncertainty:** Real decisions unfold over months/years with blurry info. The game compresses this.  
    - **Bridge:** "Imagine each bid is a month of work on a failing project. The slow drip makes it harder to quit."  

  ---

  ### **Why This Works**  
  - **V1’s Uncertainty:** Forces rational early bids (no "trap" feeling), but opponents’ hidden values create escalation.  
  - **V2’s Feedback Loop:** Mirrors real cases where sunk costs *do* raise stakes (e.g., a half-built bridge is worth more than no bridge).  
  - **Contrast:** Students see escalation isn’t just "dumb people ignoring sunk costs"—it’s a structural trap amplified by context.  

  **Final Prep:**  
  - Print envelopes (V1: [50, 65, 80, 100]), pot trackers (V2), and raffle prizes.  
  - Rehearse pot math (e.g., Excel shortcut).  
  - **Pivotal Question in Debrief:** *"When you decided to bid one more time, what were you thinking?"* → Listen for "I had to protect what I’d already spent."
