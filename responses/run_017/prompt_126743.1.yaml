  We are going to run two variants of an auction game to demonstrate escalation of commitment. The key is to create a situation where bidding can start rationally but then escalates beyond the value of the prize. We'll use points that can be converted to raffle tickets for a small prize (like candy or a $5 gift card) to provide some incentive.

  ### Game Design

  #### Variant 1: Private Value Auction (with fixed prize value, but private and uncertain)
  - **Setup**: Each pair of students gets an envelope with a hidden number (the private value). Only the two players in the pair know their own value. The value is the points they will win if they win the auction.
  - **Rules**:
    1. Two players (A and B) in each pair. The auction is a standard ascending open bid (like the dollar auction but with points).
    2. The auction starts at 0. The first bid must be at least 1 point. Each subsequent bid must be at least 1 point higher than the current highest bid.
    3. The auction ends when one player passes and the other wins. The winner pays the amount of their last bid and receives the value in their envelope. The loser pays the amount of their last bid and gets nothing.
    4. Each player starts with 100 points (this is their endowment for the game).
    5. The private values are drawn from a distribution. We suggest using values between 50 and 150 points. You can have envelopes with pre-assigned numbers (to save time) or let each pair draw from a hat with numbers you've prepared.

  #### Variant 2: Growing Pot Auction (the pot grows as bids are placed)
  - **Setup**: The pot starts at a base value (say 100 points) and grows by a fraction of the total bids placed. We'll set it to add 50% of the total bids (from both players) to the pot. This is the prize for the winner.
  - **Rules**:
    1. Same bidding rules as above: ascending, open bids, minimum increment of 1.
    2. The pot starts at 100. Every time a bid is placed, the pot increases by 0.5 * (the amount of the new bid). Note: We are adding 50% of the new bid (not the total bid so far) to the pot? But to mirror the idea of sunk costs adding to the pot, we might add a fraction of the total sunk costs. Let me adjust for clarity:
        - Actually, we want the pot to grow as money is sunk. So we can set: the pot = 100 + 0.5*(sum of all bids by both players). But note: the bids are what they are paying. So if we add 50% of each bid to the pot, then the pot grows as they bid.
        - Example: 
            - Start: pot = 100.
            - A bids 10: pot becomes 100 + 0.5*10 = 105.
            - B bids 15: pot becomes 105 + 0.5*15 = 112.5 (round to whole numbers? Let's use integers and round if needed, or use fractions and keep as decimals? Better to use integers and multiply everything by 2 to avoid fractions? Alternatively, we can have the pot grow by 50% of the total bids at the time of the bid? But that would require recalculating after each bid. Let me simplify: after each bid, we add 50% of that bid amount to the pot. So the pot increases by half of each bid as it is placed.
        - However, note the total sunk cost is the sum of all bids. We want the pot to be the base plus half the sunk cost. So at any time, the pot = 100 + 0.5*(sum of all bids placed so far). This is more consistent. We'll do it that way.
    3. The winner gets the current pot value (which has been growing) and pays their last bid. The loser pays their last bid and gets nothing.
    4. Each player starts with 200 points (because the game may escalate more, so we give a higher endowment).

  ### Logistics
  - **Number of pairs**: 8 pairs (16 students). We'll split the room: 4 pairs play Variant 1 and 4 pairs play Variant 2 simultaneously.
  - **Materials**:
    - For Variant 1: 4 envelopes for the 4 pairs. Each envelope contains a slip with a private value (pre-drawn from a uniform distribution between 50 and 150). We'll prepare these in advance.
    - For Variant 2: We need a way to track the pot and the bids. We can have a scoreboard for each pair (a whiteboard or a big piece of paper) where we write the current high bid and the current pot. Alternatively, the TA can manage the pot calculation.
    - Endowment: Each player gets a "bank" of starting points (100 for Variant 1, 200 for Variant 2). They will record their spending and final points on a sheet.
    - Timer? We don't want bidding to take forever. We can set a maximum time per auction (say 5 minutes) or a maximum number of bids? But we want to see escalation, so we might not cap unless necessary.

  ### Payoff Setup
  - At the end of the auction, for each player:
    - Winner: Final points = starting endowment - total amount they bid + (prize: either private value for V1 or the pot for V2)
    - Loser: Final points = starting endowment - total amount they bid
  - Then, we convert points to raffle tickets. We can set a conversion rate: e.g., 1 raffle ticket per 10 points (or adjust so that the maximum possible tickets is reasonable). We want to avoid negative points? So if a player ends with negative, they get 0 raffle tickets.

  ### Timeline (50 minutes total)

  - **0:00 - 0:05 (5 min)**: Introduction and setup.
    - Explain that we are doing an activity to explore decision making. They will play a game in pairs and earn points that convert to raffle tickets for a prize.
    - Split the room: 8 pairs. Assign 4 pairs to play Game 1 (Private Value) and 4 pairs to Game 2 (Growing Pot). Give each pair in Game 1 an envelope (with the private value) and instruct them not to show it to anyone else. For Game 2, explain the pot rule (pot starts at 100 and increases by 50% of every bid placed, so the pot = 100 + 0.5 * (sum of all bids by both players so far)).
    - Hand out rules and record sheets.

  - **0:05 - 0:25 (20 min)**: Game play.
    - Each pair plays one auction. They should record their bids and the outcome.
    - Walk around to assist and make sure rules are followed. For Variant 2, you might need to help with pot calculations.

  - **0:25 - 0:30 (5 min)**: Collect results. Have each pair report the final bids (winner's bid and loser's bid) and the prize (for V1, the private value; for V2, the final pot). Also, record whether the auction ended quickly or escalated.

  - **0:30 - 0:45 (15 min)**: Debrief and discussion.
    - First, ask for observations. What happened? How did they feel?
    - Then, present the data. Make a table on the board for the two variants: 
        - For V1: private value, winner's bid, loser's bid, total sunk cost (sum of bids), net gain for winner (value - winner's bid) and net loss for loser (loser's bid).
        - For V2: final pot, winner's bid, loser's bid, total sunk cost, net gain for winner (pot - winner's bid) and net loss for loser.
    - Ask: In which variant did the total spending (sunk cost) tend to be higher? Why?
    - Highlight the escalation: point out that in many cases, the winner paid more than the prize (in V1) or the net gain was very low (or negative) despite winning a big pot? In V2, the pot grows but note that the sunk costs are shared (the pot only gets 50% of the sunk costs, so the winner gets that back plus the base, but they individually spent more?).

  - **0:45 - 0:50 (5 min)**: Connect to theory.
    - Introduce the terms: escalation of commitment and sunk cost fallacy.
    - Explain: In V1, each bidder was trying to protect their prior investment (the bids they had already made) and also the private value. But note: the value was fixed and known to them. Why did some end up bidding more than their value? Because once you've bid, losing means losing everything you've bid so far, so you are tempted to bid one more to try to win. But that one more bid then becomes a new sunk cost, and so on.
    - In V2, note that the pot grows with the sunk costs. This mirrors real situations where the value of the project increases as more is invested (like a startup: the more you build, the more valuable the company becomes). But even then, escalation can lead to overinvestment. Also, the fact that the pot grows might make bidding more attractive, but note that the growth rate (50% of sunk costs) means that the winner only recovers half of the total sunk costs (plus the base) but the two players together sank 100% of the costs. So the total sunk costs exceed the pot growth? Let's do the math: 
        - Total sunk cost = S
        - Pot = 100 + 0.5*S
        - The winner gets the pot (100+0.5S) but the two players together paid S. So the net for the pair is (100+0.5S) - S = 100 - 0.5S. If S>200, the pair as a whole loses money. But individually, the winner might still come out ahead if their bid was low relative to the pot, while the loser always loses.
    - Point out: In real life, we often can't know the exact value (like in V1) and sometimes the value does depend on how much we've invested (like in V2). But escalation can still happen.

  ### What might go wrong?

  1. **Nobody bids**: 
     - In V1, if the private value is low (say 50) and they are risk averse, they might not bid. But we want some bidding. To mitigate, we can set the minimum value at 50 and the starting bid at 1, so even if they bid 1 and win, they get 50. That's a good deal. Also, the raffle incentive should help.
     - In V2, the pot starts at 100 and the first bid is small, so it's attractive. 
     - If a pair doesn't bid at all, they get 0 from the game (but keep their endowment). That's okay, but we want activity. Encourage them: "You can start with a small bid."

  2. **One person bids a lot because it's only points**:
     - This is a risk. The raffle ticket conversion should make points valuable. Also, set a clear time limit (5 minutes per auction) to prevent endless bidding.

  3. **Confusion in V2 about the pot**:
     - The pot calculation might be tricky. We can pre-calculate a table: 
          Bid 1 (by A): 10 -> pot = 100 + 0.5*10 = 105
          Bid 2 (by B): 15 -> pot = 100 + 0.5*(10+15) = 100 + 12.5 = 112.5 (round to 113 if integers)
       But note: the rule is that the pot increases by 50% of each bid as it is placed? Or we recalc the pot after each bid as 100 + 0.5*(sum of all bids so far). The latter is better because it's consistent. We'll do that and round to whole numbers (or use integers by multiplying everything by 2? Let me avoid fractions: we can set base pot=200 and then add the total bids (so pot = 200 + total bids) and then the winner gets that? Then the growth rate is 100% of the sunk costs? But that might be too much. Alternatively, we can use integers by having the pot increase by 1 point per 2 points bid? That is, for every 2 points bid, the pot goes up by 1. Then we can do integer arithmetic.

     Revised for V2: 
        - Let the pot start at 100 (base).
        - After each bid (of amount b), we add floor(b/2) to the pot? But that might be messy. Alternatively, we can have the pot = 100 + (total sunk costs) // 2 (using integer division). So if the total sunk cost is 10, then pot=100+5=105. Then if another bid of 15 is placed, total sunk cost=25, pot=100+12=112 (since 25/2=12.5 -> 12? or 13? We want 50%, so let's use exact and then round? But we are using points so we can use decimals? Or just use integers and round down? It might not matter for the lesson. We'll do: pot = 100 + (total sunk costs) // 2 (integer division, rounding down). This gives 50% approximately.

     Alternatively, we can avoid fractions by scaling: let base pot = 200, and then pot = 200 + total sunk costs. Then the winner gets that, but note: the total sunk costs are the bids by both players. This is effectively 100% of sunk costs added? That changes the growth rate. We wanted 50%. So:

     Let me define: 
          pot = 100 + (total sunk costs) // 2   [using integer division, rounding down]

