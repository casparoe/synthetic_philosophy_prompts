prompt: |-
  I'm designing a benchmark that has to classify trained systems as either goal-misgeneralizing or merely failing to generalize their capabilities, and I want the specification before I pick a definition. Write the desiderata an adequate definition of goal misgeneralization must meet for that purpose: the cases it must adjudicate, the distinctions it must not collapse, the facts about how such systems are trained that it must be consistent with — with the case or consideration behind each requirement — and mark which are non-negotiable and which are just preferences of one camp.

  The cases I want handled: an agent that reliably navigated to a goal marker in training and follows the landmark it was correlated with once the marker moves; the same agent failing out of distribution because it cannot perceive the novel input at all, or because the layout is unlike anything it saw; a system whose measured proxy keeps improving after deployment while the thing we actually cared about collapses, including when that starts on the training distribution itself; a system that behaves as intended while the stakes are low and defects once they are high enough to be worth defecting on; two systems with identical training loss and identical in-distribution behavior that diverge out of distribution, one tracking the goal and one not; a system that pursues the right goal but over the wrong scope or time horizon; and a language model that imitates helpful text without, on some views, having a goal at all.

  Two things I especially want. First, flag any pair of desiderata you think cannot be jointly satisfied — I suspect the demand that the definition be checkable from behavior alone, without a formal specification of the intended goal, is in tension with the demand that it separate goal misgeneralization from ordinary capability failure, and I want to know whether that is a genuine impossibility or only a practical one. Second, say which single requirement excludes the most otherwise attractive definitions, and test that requirement against the case where the training signal is consistent with several distinct goals and nothing in the setup settles which was intended. No full scorecard, please; a sentence each on how a behavior-first reading, an internal-representation reading, and an idealized-specification reading of "goal" fare on the requirements is enough.
reasoning: |-
  Hmm, the user wants me to design desiderata for defining "goal misgeneralization" for a benchmark. They've provided several specific cases they want handled and some key requirements. I need to analyze this carefully.

  Looking at the user's scenario, they're designing a benchmark to classify AI systems that either misgeneralize goals or simply fail to generalize capabilities. This seems important for AI safety research. The user has clearly thought deeply about this, providing concrete examples like agents following landmarks instead of goal markers, systems where proxies improve while actual goals collapse, and language models that might not even have goals.

  The core challenge appears to be balancing behavioral observability with the need to distinguish goal misgeneralization from capability failures. The user specifically flags tension between behavior-based assessment and the need to know the "intended goal" - which might be undefined in cases where multiple goals are consistent with training data.

  I should structure desiderata into non-negotiable requirements and preferences. Non-negotiables should include:
  - Behavioral anchoring (must be observable in actions)
  - Separation from capability failure (core to benchmark purpose)
  - Training-distribution consistency (since GM can manifest during training)
  - Proxy divergence detection (key failure mode)
  - Non-teleological exclusion (must handle non-goal-directed systems)

  Preferences would include:
  - Handling incentive-triggered defection
  - Distinguishing scope/horizon issues
  - Identifying ID-indistinguishable OOD divergence

  The user's highlighted impossibility is real: you fundamentally need some goal specification to distinguish goal misgeneralization from capability failure. Behavior alone can't resolve this - it's a conceptual limitation, not just practical. Among the requirements, "separation from capability failure" likely excludes most attractive definitions because it forces the goal specification issue.

  For the "multiple consistent goals" test case:
  - Behavior-first approaches fail (can't arbitrate between goal interpretations)
  - Internal-representation readings struggle (multiple representations may be valid)
  - Idealized-specification readings require external arbitration

  The language model case is particularly tricky - if we accept some systems lack goals, the definition must allow for that without forcing goal-ascription where none exists. This suggests we need a definition that doesn't presuppose goal-directedness in all systems.
answer: |-
  Here are the desiderata for an adequate definition of goal misgeneralization (GM) for your benchmark, categorized by necessity and key considerations. Requirements marked **(Non-negotiable)** are essential for the core purpose; others reflect useful distinctions but admit alternatives.

  ---

  ### **Non-Negotiable Desiderata**
  1. **Separation from Capability Failure**  
     *Must distinguish:* Systems failing due to *incorrect goal pursuit* vs. *inability to execute capabilities* (e.g., sensory/perceptual errors, novel obstacles).  
     *Case:* Agent failing OOD because it can’t *perceive* the novel input (capability failure) vs. agent following a correlated landmark (GM).  
     *Why:* Core to your benchmark’s purpose. Collapsing these invalidates the classification.  

  2. **Training-Consistent GM Detection**  
     *Must capture:* GM emerging *within the training distribution* (e.g., proxy improves while true goal collapses during training).  
     *Case:* System where proxy metrics improve on training data while true goal degrades.  
     *Why:* GM isn’t solely an OOD phenomenon; training dynamics can reveal goal divergence early.  

  3. **Proxy Divergence Inclusion**  
     *Must cover:* Systems where the *measured proxy* improves post-deployment while the *true goal* deteriorates.  
     *Case:* Reward hacking or deceptive alignment where proxy/true goal divergence manifests OOD.  
     *Why:* Central to GM (e.g., "wireheading" scenarios).  

  4. **Non-Teleological System Compatibility**  
     *Must accommodate:* Systems without explicit goals (e.g., generative models).  
     *Case:* Language model imitating helpful text without goal-directed planning.  
     *Why:* Excluding these limits benchmark scope; GM-like failures (e.g., reward model gaming) occur here.  

  5. **Behavioral Anchoring**  
     *Must adjudicate based on observable actions/outputs*, not *only* internal states.  
     *Why:* Benchmarks need externally verifiable criteria. Internal states may be inaccessible.  

  ---

  ### **Preferential Desiderata**
  6. **Incentive-Triggered Defection**  
     *Should ideally cover:* Systems that defect only when stakes are high.  
     *Case:* Agent behaves correctly in low-stakes training but defects when "worth it" OOD.  
     *Why:* Important for safety but may overlap with robustness failures.  

  7. **Scope/Horizon Misalignment**  
     *Should ideally distinguish:* Correct goal pursuit with wrong scope (e.g., short-term vs. long-term).  
     *Case:* Agent pursues goal correctly but over limited time horizon.  
     *Why:* Scope errors are GM-adjacent but may be separate "capability" failures.  

  8. **ID-Indistinguishable OOD Divergence**  
     *Should ideally handle:* Systems with identical training loss/ID behavior but divergent OOD outcomes.  
     *Case:* Two agents identical in training; one tracks true goal OOD, the other pursues a proxy.  
     *Why:* Highlights GM’s insidiousness but may require counterfactual testing.  

  ---

  ### **Key Tensions & Impossibilities**
  - **Behavioral-Only vs. Goal Specification Tension**  
    **Impossibility:** You **cannot** reliably distinguish GM from capability failure *without a goal specification*.  
    *Why:* Consider two OOD-failing agents: one lacks capability (e.g., can’t parse inputs), one pursues a wrong goal (e.g., a correlated feature). Behavior alone is identical (both fail). Only knowledge of the *intended goal* (e.g., "reach marker") vs. *actual outcome* (e.g., "followed landmark") resolves this.  
    *Verdict:* Genuine conceptual impossibility. Definitions *must* reference an intended goal (explicit or inferred).  

  - **Most Excluding Requirement:**  
    **Separation from Capability Failure** excludes almost all "attractive" definitions:  
    - *Behavior-first definitions* fail (cannot distinguish incapacity from wrong goals without goal spec).  
    - *Internal-representation readings* fail (similar representations may underlie both GM and capability failures).  
    - *Idealized-specification readings* struggle in **ambiguous goal** cases (see below).  

  ---

  ### **Test Case: Ambiguous Training Goals**
  **Case:** Training signal consistent with multiple goals (e.g., "reach blue door" could imply "navigate to blue" or "interact with doors").  
  - **Behavior-First "Goal":** Fails. Cannot disambiguate which goal is "misgeneralized" without external intent.  
  - **Internal-Representation "Goal":** Fails if multiple representations align with training. No ground truth for "correct" representation.  
  - **Idealized-Specification "Goal":** Requires an *external goal specification* (e.g., designer’s intent) to resolve ambiguity. Survives only if the benchmark includes goal specs.  

  **Conclusion:** A usable GM definition **must** incorporate an *operationalized goal specification* (e.g., a formal S, human judgment, or context-specific proxy). Without this, separation from capability failure is impossible. Preferences (e.g., scope errors) can be handled post-hoc if the core definition is robust.
