  An advocate of MEC might argue that the problem of intertheoretic comparison is not insurmountable. They might propose:

  1. **The 'Right' Normalization**: There is a fact about how to compare value across theories. For example, we might use the range of value that the theory assigns to all possible acts (the maximal and minimal possible choiceworthiness) to set the scale. This is the "full range" approach. In our case, if we could agree on what the full range is for each theory, then we wouldn't have arbitrariness.

