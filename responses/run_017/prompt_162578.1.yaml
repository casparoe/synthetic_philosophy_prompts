  The condition under which all normalizations agree is when the two theories' rankings are *linearly related* in the decision problem. That is, if there exist constants a>0 and b such that for every option, the choiceworthiness according to theory D is a linear transformation of the choiceworthiness according to theory U (i.e., D = a*U + b), then any normalization that preserves the ratios of differences will yield the same MEC ranking. This is because the expected choiceworthiness will be a linear transformation and thus the ranking is invariant.

