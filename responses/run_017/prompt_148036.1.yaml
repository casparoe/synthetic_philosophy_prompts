answer: |-
  ## Dissertation Proposal: The Groundless Desert: Indeterminacy in Contribution and the Collapse of Meritocratic Justification in Collaborative Production  

  **Core Question:** In contexts of non-separable collaborative production (e.g., surgical teams, co-authored research, software development), is the concept of an individual’s "contribution" – necessary for desert-based claims in meritocracy – fundamentally indeterminate, rendering meritocratic allocation conceptually incoherent prior to considerations of luck or endowment?  

  ### Sharpening the Question: Four Paths & Why One Prevails  
  1.  **Conceptual Indeterminacy Focus:** Does the structure of joint production (with complementarities) imply *no fact of the matter* about individual contribution, making desert claims inherently groundless? (*Chosen: Directly attacks the foundational assumption, maximal philosophical impact*).  
  2.  **Institutional Fix Critique:** Does the *imposition* of performance metrics to create artificial separability constitute a distinct form of injustice ("metric capture")? (*Relegated to Chapter 3: Vital consequence, but presupposes the core conceptual argument*).  
  3.  **Intuition Ambiguity Mapping:** Is the slippage between "indispensability" and "marginal contribution" in ordinary judgments a symptom of conceptual incoherence? (*Integrated into Chapter 2: Evidence for indeterminacy, not the core thesis*).  
  4.  **Dissolving Luck/Desert Debate:** Does indeterminacy make the entire luck/desert debate downstream and irrelevant for collaborative contexts? (*Killed: Overreaching. Luck objections retain force elsewhere; this targets a specific, prior failure*).  

  **Why Option 1?** It isolates the most radical implication: meritocracy fails *logically prior* to luck arguments because the essential object of desert (individual contribution) vanishes under non-separability. This is the necessary foundation for the institutional (metric capture) and psychological (intuition slippage) analyses.  

  **Killing the Alternatives:** Option 2 depends on 1. Option 3 is diagnostic, not explanatory. Option 4 ignores contexts where separability *might* hold (simple tasks) and overstates the scope.  

  ### Why Existing Positions Don’t Settle This (and the Luck-in-Disguise Worry)  
  Existing debates assume the *existence* of a measurable contribution, then fight over its moral significance:  
  *   **Luck Egalitarians:** Argue you don’t *deserve* your contribution due to brute luck. They assume the contribution itself *is* identifiable and attributable.  
  *   **Meritocratic Defenders:** Focus on identifying and rewarding the measurable contribution.  
  *   **Structural Critics:** Challenge *which traits* count as merit or the system’s harmful effects, not the coherence of contribution-attribution within chosen traits.  
  *   **Luck-in-Disguise Rebuttal:** This is the strongest challenge. Isn't indeterminacy just pervasive brute luck? **No.** Brute luck implies a definite outcome (e.g., income) caused by factors outside control. Indeterminacy posits there *is no definite individual outcome/contribution to attribute*, even in principle. Luck operates *on* a variable; indeterminacy means the variable *lacks a value*. Showing this distinction is crucial.  

  ### Methodology: Why Not Purely Conceptual or Empirical?  
  A twelve-month hybrid approach, avoiding the traps of pure methods:  
  *   **Months 1-3: Theoretical Groundwork & Game Theory Tooling:** Rigorously define non-separability, complementarity, and key surplus-sharing concepts (Shapley value, core, nucleolus, equal split, serial cost sharing). Map their conflicting implications for "contribution" under identical production functions. Analyze desert theory’s presuppositions about attributability. *Method: Conceptual/formal analysis. Why? Necessary to establish the logical structure of the problem.*  
  *   **Months 4-7: Case Study Analysis:** Deep dives into 3-4 paradigmatic collaborative contexts (e.g., open-source software release, complex surgery, academic co-authorship, orchestral performance). For each:  
      *   Map the actual production process and complementarities.  
      *   Apply different surplus-sharing rules *formally* to hypothetical outputs/margins.  
      *   Interview participants on perceived contributions and fairness norms (structured, focusing on indispensability vs. marginal addition narratives).  
      *   Analyze institutional performance metrics used and their effects.  
      *   *Method: Qualitative case study + applied game theory. Why? Tests the theory against reality, exposes slippage in intuitions (Ch2 focus), provides concrete basis for metric capture analysis (Ch3). Pure surveys wouldn't capture context; pure theory wouldn't ground the institutional critique.*  
  *   **Months 8-10: Metric Capture & Institutional Fabrication:** Analyze how imposed metrics (e.g., lines of code, first authorship, sales quotas for teams) artificially create separability, distort behavior, and determine *ex post* what gets recognized as "contribution." Argue this is a distinct form of injustice, manufacturing the ground for desert claims rather than discovering it. *Method: Institutional analysis + behavioral economics concepts. Why? Essential consequence; shows the system's response to indeterminacy creates new problems. Stands as **Chapter 3**.*  
  *   **Months 11-12: Synthesis & Philosophical Implications:** Integrate findings. Argue that non-separability implies fundamental indeterminacy in contribution, rendering desert-based meritocratic justification conceptually incoherent in these pervasive contexts. Show how this dissolves certain debates and reframes others (luck, structural critique). Defend against objections (luck-in-disguise, "but we need *some* rule").  

  ### Outcomes: Success, Failure, and Scope  
  *   **Success Looks Like:** A demonstrably novel argument establishing that, *due to non-separability*, there is no fact of the matter about individual contribution in collaborative production, making desert-based meritocracy *conceptually impossible* in these domains – distinct from luck objections. Plus, a robust analysis of metric capture as a pathological response.  
  *   **Failure Looks Like:** Only demonstrating that contribution is *difficult to measure* or *ambiguous*, rather than *indeterminate*; failing to convincingly distinguish indeterminacy from brute luck; producing case studies that don't robustly exhibit the theoretical problem.  
  *   **Scope: One Year, Focused:** This is one year of intense work, achievable by:  
      *   Limiting case studies to 3-4 deeply analyzed examples.  
      *   Focusing surplus-sharing analysis on 2-3 key rules (Shapley, Equal Split, Indispensability) per case.  
      *   Keeping the conceptual groundwork tightly scoped to desert + non-separability + core game theory.  
      *   **Cut:** Comparative analysis of *all* surplus-sharing rules; extensive survey work; broad historical analysis of meritocracy. Save for the full dissertation.  

  **Proposal Text (Your Voice, Tightened):**  

  **Title:** The Groundless Desert: Indeterminacy of Contribution and the Impossibility of Meritocracy in Collaborative Production  

  **Core Research Question:** Does the inherent non-separability of output in complex collaborative production render the concept of an individual’s "contribution" fundamentally indeterminate, thereby undermining the conceptual coherence of desert-based justifications for meritocratic allocation before considerations of luck or endowment even arise?  

  **Significance & Gap:** Debates over meritocracy rage, yet all sides share an unexamined premise: that an individual's contribution to social production is a determinate fact, suitable for grounding desert. Luck egalitarians dispute whether we *deserve* our contribution; meritocrats argue over *how* to measure and reward it; structural critics contest *which traits* constitute merit. None question whether the *unit* of contribution is coherent in contexts where output is jointly produced with strong complementarities – where the whole exceeds the sum of individual parts, and an individual's marginal impact depends entirely on the counterfactual scenario or allocation rule chosen. This project argues that in such pervasive settings (research teams, surgical units, software development, artistic ensembles), the search for a "deserved" reward based on individual contribution is not merely compromised by luck; it is *conceptually impossible* because there is no fact of the matter about "how much" any individual contributed. Desert has nothing to track.  

  **Addressing the Core Objection (Luck in Disguise?):** A crucial challenge posits that indeterminacy is merely pervasive brute luck. This misdiagnoses the problem. Brute luck concerns how *determinate outcomes* (e.g., income, position) are influenced by unchosen factors. Indeterminacy asserts that, under non-separability, there *is no determinate individual outcome* (contribution level) to be subject to luck in the first place. Different surplus-sharing rules (Shapley value, equal split, rewarding indispensability) applied to the *same* group output yield *incompatible yet equally valid* attributions of individual contribution. No desert-relevant fact selects among them. This is a prior, logical failure of meritocratic justification.  

  **Methodology & Plan:** This project employs a focused hybrid methodology over twelve months to establish its core thesis and explore a key consequence:  

  1.  **Months 1-3: Conceptual and Formal Foundations:** Establish the necessary theoretical framework. Define non-separability and complementarity rigorously. Analyze the core tenets of desert theory, highlighting its dependence on attributable agency. Introduce key cooperative game theory concepts (Shapley value, core, nucleolus) and surplus-sharing rules, demonstrating how they generate conflicting attributions of individual contribution from identical group production functions. *Output: Draft of Chapter 1 - "Desert's Requirement and Non-Separability's Challenge."*  
  2.  **Months 4-7: Case Studies in Indeterminacy & Intuition:** Conduct in-depth analyses of 3-4 paradigmatic collaborative contexts (e.g., a major open-source software release, a complex surgical procedure, a multi-author scientific publication, an orchestral performance). For each:  
      *   Map the production process and complementarities.  
      *   Apply 2-3 key surplus-sharing rules formally to hypothetical outputs/margins, demonstrating divergent contribution attributions.  
      *   Conduct structured interviews with participants focusing on their perceptions of indispensability vs. marginal contribution and fairness norms.  
      *   *Output: Draft of Chapter 2 - "The Vanishing Contributor: Case Studies in Indeterminacy and Intuition."*  
  3.  **Months 8-10: Metric Capture: Manufacturing Desert's Object:** Analyze the institutional response to indeterminacy: the imposition of individual performance metrics (e.g., lines of code, first-author status, specific sales targets). Argue this artificially manufactures separability, distorting behavior and *determining* what subsequently counts as "contribution," rather than discovering it. This "metric capture" creates a distinct form of injustice by fabricating the grounds for desert claims. *Output: Draft of Chapter 3 - "Metric Capture: Fabricating Contribution in the Void."*  
  4.  **Months 11-12: Synthesis and Philosophical Implications:** Integrate findings. Defend the core thesis of conceptual incoherence against objections (especially the "luck-in-disguise" challenge). Articulate the implications for meritocracy debates: dissolving some arguments (desert-based rewards in collaborative domains), reframing others (luck becomes secondary; structural critiques gain new grounding in the *imposition* of arbitrary metrics). Discuss normative alternatives. *Output: Revised Dissertation Core Chapters & Introduction/Conclusion.*  

  **Expected Outcome & Contribution:** Success means demonstrating that non-separability generates fundamental indeterminacy in individual contribution, making desert-based meritocratic justifications *conceptually incoherent* in collaborative contexts – a novel and prior challenge to existing debates. It establishes "metric capture" as a distinct pathology arising from this void. This reframes the critique of meritocracy: the problem isn't (only) that contributions are tainted by luck, but that in crucial domains, the very concept of an individual contribution grounding desert collapses. Failure would mean only showing contribution is ambiguous or hard to measure, not indeterminate, or failing to adequately distinguish indeterminacy from luck.  

  **Feasibility:** This ambitious project is achievable in one year through strict focus: deep analysis of 3-4 core cases, examination of 2-3 key surplus-sharing rules, and targeted conceptual work. Comparative analysis of numerous sharing rules, broad empirical surveys, or extensive historical context are deferred for the full dissertation. The hybrid method ensures theoretical rigor is grounded in real-world complexity, avoiding the limitations of pure conceptual analysis or isolated empirical work. **Metric capture is Chapter 3 – a core consequence, not a footnote.**
