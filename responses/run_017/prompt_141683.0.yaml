prompt: |-
  hey — quick one. I work on the procurement side of a public agency, and we're trying to write fairness requirements into the contracts we sign with vendors who sell us risk scores (benefits eligibility, that sort of thing). Vendors bid with different models, we audit them after they've been running for a while, and everyone building a model knows the rule in advance. I need a spec before I write anything down.

  What I want from you: the list of requirements a fairness criterion has to meet to be usable as a procurement rule, with the motivating case behind each. The ones I keep circling: an auditor has to be able to check it from decisions and realised outcomes alone (we don't get the features, and outcomes are only observed for people who were selected); it has to be comparable across vendors whose scores aren't on the same scale; it can't be something a vendor can hit by tuning against the audit while making things worse on the ground; it should compose, or at least not fall apart, when the same person passes through three of these systems in a row; and it should still mean something when the score allocates an intervention that changes the outcome it was predicting. Add any I'm missing, say which are non-negotiable and which are just preferences, and flag anywhere I'm confusing the definition of a criterion with an estimator we could actually compute.

  The bit I really care about: given the familiar no-go results — you can't have calibration and equal error rates across groups at once when base rates differ, and the rest of that family — which subset of my requirements is jointly unsatisfiable, and what would we have to drop. One line each on the existing criteria at the end, no scorecard.
reasoning: |-
  We are designing a fairness criterion for procurement contracts in a public agency setting. The key constraints and requirements are:

  1. **Auditability**: Must be verifiable using only decisions and realized outcomes. Note: outcomes are only observed for selected individuals (those who received the intervention).
  2. **Scale Invariance**: Must be comparable across vendors with different score scales.
  3. **Robustness to Gaming**: Vendors should not be able to manipulate the criterion by tuning their model specifically for the audit in a way that degrades real-world performance.
  4. **Compositionality**: The criterion should remain meaningful when individuals pass through multiple systems sequentially.
  5. **Causal Validity**: The criterion should retain meaning when the score allocates an intervention that may change the outcome being predicted (i.e., the intervention affects the outcome).

  Additionally, we must consider the trade-offs highlighted by fairness impossibility results (e.g., calibration vs. equal error rates when base rates differ).

  Let's break down the requirements:

  ### Non-negotiable Requirements (Must-haves)
  1. **Auditability**: The criterion must be computable from:
     - The decision (e.g., whether an intervention was applied, which we assume is based on the risk score being above a threshold) 
     - The realized outcome (only for those who were selected, i.e., received the intervention)
     - Group membership (if we are considering group fairness, which is likely required for public agencies)

     Why? Because the agency does not have access to the features used by the model or outcomes for non-selected individuals.

  2. **Scale Invariance**: The criterion should not depend on the absolute scale of the risk score. It must be comparable across vendors who might use different scoring systems.

  3. **Robustness to Gaming**: The criterion should not incentivize vendors to build models that perform well on the audit metric but poorly in practice. For example, if the criterion only looks at the selected population, a vendor might artificially restrict the selection to a subset where they are confident, which might exclude many who should be selected.

  ### Important but Possibly Negotiable
  4. **Compositionality**: The criterion should be stable under composition of multiple systems. This is important because individuals often go through several decision points. However, this is very challenging and might be relaxed in practice by requiring each system to meet the criterion independently and then monitoring the overall system.

  5. **Causal Validity**: The criterion should account for the fact that the intervention (allocated based on the risk score) might change the outcome. This is critical because the prediction is about an outcome that might be altered by the intervention. However, this is a hard problem and might require strong assumptions.

  ### Additional Requirements (Possibly Overlooked)
  6. **Group Fairness**: The agency likely cares about fairness across legally protected groups (e.g., race, gender). Therefore, the criterion should be defined with respect to such groups.

  7. **Feasibility of Estimation**: Since outcomes are only observed for the selected group, we must be able to estimate the criterion with this missing data. This is a major constraint.

  8. **Non-Discrimination**: The criterion should prevent both disparate treatment and disparate impact. However, note that some criteria (like demographic parity) might require access to the entire population (selected and non-selected) which we don't have outcomes for.

  ### Trade-offs from Fairness Impossibility Results
  The well-known impossibility result (e.g., Kleinberg, Mullainathan, Raghavan; Chouldechova) states that, except in degenerate cases, one cannot simultaneously satisfy:
  - **Calibration**: Within each group, the predicted risk equals the actual risk.
  - **Equal false positive rates** (or more generally, equal error rates) across groups.

  This holds when the base rates (the actual prevalence of the outcome) differ across groups.

  Therefore, if we require both calibration and equal false positive rates (or similar error rate balance), that is impossible. We must choose one or the other, or a different criterion.

  ### Which Requirements are Jointly Unsatisfiable?
  Given our constraints, the most critical conflict arises from **auditability** and the **missing data problem** (outcomes only for the selected). Many common fairness criteria require knowledge of the outcome for the entire population (e.g., false positive rates require knowing the outcome for those who were not selected). But we don't observe outcomes for the non-selected.

  Therefore, we are limited to criteria that can be estimated from the selected population. However, note that even in the selected population, we only observe outcomes for those who were selected and we cannot observe the counterfactual outcome (what would have happened without the intervention). This is the problem of **selective labels** and **causal interference**.

  Hence, the requirement of **causal validity** (5) might be in tension with **auditability** (1) because without strong assumptions (e.g., random assignment of the intervention) or additional data, we cannot disentangle the effect of the intervention from the prediction.

  Moreover, **compositionality** (4) is extremely challenging because the sequential nature of decisions and interventions can lead to complex interactions.

  ### Proposed Criteria that Might Work
  Given the constraints, we might consider:

  - **Predictive Parity** (or Positive Predictive Value): Among those who were selected (and thus received the intervention), the proportion that actually had the outcome (e.g., actually eligible for benefits) should be similar across groups. But note: the intervention might change the outcome! So this might not reflect the true risk.

  - **Conditional Use Accuracy Equality**: This is similar to predictive parity and requires that the positive predictive value (PPV) and negative predictive value (NPV) are equal across groups. But we don't have NPV because we don't observe outcomes for non-selected.

  Therefore, we might only be able to use PPV. However, without the intervention effect, PPV might be biased.

  Alternatively, we might use a criterion that focuses on the selection rate and the outcome rate among the selected, but again, the intervention effect is a confounder.

  ### Non-negotiable vs. Preferences
  - **Non-negotiable**: Auditability (1) and Scale Invariance (2). Without these, the procurement rule cannot be enforced.
  - **Robustness to Gaming (3)**: Also non-negotiable because otherwise vendors can game the system.
  - **Group Fairness (6)**: Non-negotiable for a public agency.
  - **Causal Validity (5)**: Ideally required, but might have to be relaxed if we cannot find a suitable criterion. We might have to accept a criterion that is only valid under the assumption that the intervention does not change the outcome (which is unlikely) or use a criterion that is robust to intervention effects (which is hard).

  ### What We Must Drop?
  Given the impossibility results and data constraints, we must drop the requirement for **simultaneously satisfying multiple traditional fairness criteria** (like calibration and error rate balance). We have to pick one type of criterion.

  Moreover, because of the missing outcomes for the non-selected, we cannot use criteria that require knowledge of the entire population (like false positive rates, false negative rates, or demographic parity).

  Therefore, we are limited to criteria that can be computed solely on the selected population. This includes:
  - Positive Predictive Value (PPV) by group.
  - The outcome rate among the selected by group.

  But note: if the intervention is effective, then the outcome rate among the selected (who received the intervention) might be lower than the true risk that the model was trying to predict (because the intervention changed the outcome). This breaks the connection between the prediction and the outcome.

  Hence, we might need to adjust the criterion to account for the intervention effect. But without a control group (non-selected that are comparable) we cannot measure the effect.

  ### Potential Solution: Use a Criterion Based on the Risk Score and Observed Outcomes in the Selected Group, with Assumptions
  If we assume that the intervention does not change the outcome (which may be unrealistic) then we can use:

  **Calibration within the Selected Group**: For each group, and for a given risk score (or risk score bin), the proportion of positive outcomes should equal the risk score. But note: we only observe outcomes for the selected, so we can only check calibration for the high-risk individuals. This is called **calibration for the positive** (or calibration for the selected). However, this does not tell us about the entire distribution.

  Alternatively, we can require that the risk scores are calibrated by group in the selected population. But this requires that the risk scores are comparable across vendors? Not necessarily, because we can bin by percentiles or standardize.

  But note: scale invariance (2) is required. So we might require that the risk scores are calibrated by group and by vendor, but we can only check in the selected population. However, if vendors use different selection thresholds, then the selected populations are different. So we need to adjust for the threshold.

  Alternatively, we can use a criterion that does not depend on the absolute score, such as:

  **Ranking-based criteria**: For example, require that the area under the ROC curve (AUC) is similar across groups? But we don't have outcomes for non-selected, so we cannot compute AUC.

  ### Conclusion on Criteria Choice
  Given the constraints, we might have to rely on:

  - **Equal Positive Predictive Value (PPV) across groups**: This is auditable (we have outcomes for the selected) and scale-invariant (it's a proportion). However, it is vulnerable to:
    - **Causal effect of intervention**: If the intervention reduces the outcome, then the PPV might be low even if the model correctly identified high-risk individuals.
    - **Gaming**: A vendor might select a very small group of high-risk individuals (where the outcome is almost certain) to get high PPV, but that would mean they are not serving many who need the intervention.

  To address gaming, we might combine PPV with a requirement on the selection rate (but note, without outcomes for non-selected, we cannot know if we are missing at-risk individuals). However, we can observe the selection rate by group and require that it is above a minimum threshold? That might be a separate requirement.

  Alternatively, we might use:

  **Equal outcome rate among the selected across groups**: This is similar to PPV if the outcome is binary. But again, it is affected by the intervention.

  ### Recommendations

  Given the challenges, I propose:

  1. **Core Criterion**: Require that the **positive predictive value (PPV) is above a minimum threshold and that the difference in PPV across protected groups is below a maximum allowable disparity**. This is auditable and scale-invariant.

  2. **Addressing Gaming**: To prevent vendors from selecting too conservatively, also require a minimum **selection rate** (overall and by group) or set a target for the selection rate. But note: without knowing the true risk in the entire population, we cannot set an optimal selection rate. Therefore, we might set the selection rate based on budget constraints and historical data.

  3. **Causal Effect**: We must acknowledge that the intervention might change the outcome. Therefore, we should interpret PPV as the proportion of selected individuals for whom the outcome occurred despite the intervention. This might be acceptable if the goal is to measure the model's ability to identify individuals who are at high risk even after the intervention? But that might not be the intended prediction target.

  Alternatively, we might redefine the prediction target to be the outcome *in the absence of the intervention*. But then we cannot observe that because we always apply the intervention to the selected. This requires counterfactual data.

  Therefore, we might have to accept that the criterion is not a pure measure of prediction quality but rather of the system's performance in the presence of the intervention.

  4. **Compositionality**: We can require that each system meets the criterion independently and then monitor the overall system for disparate impact.

  5. **Impossibility Results**: We are only using PPV and selection rate. We are not requiring calibration on the entire population or equal error rates. Therefore, we avoid the impossibility result because we are only focusing on one part (the selected). However, note that if the base rates differ, then equal PPV might require different false negative rates by group, which might lead to disparity in who gets selected.

  ### Summary of Requirements and Trade-offs

  - **Must have**: Auditability (1), Scale Invariance (2), Robustness to Gaming (3), Group Fairness (6). These are non-negotiable.
  - **Hard to achieve**: Causal Validity (5) and Compositionality (4) might have to be relaxed or addressed by separate means.
  - **Dropped**: Criteria that require knowledge of the entire population (like false positive rates, false negative rates, or demographic parity) because of the missing outcomes for non-selected.

  In summary, we propose using **PPV with group fairness constraints** and **minimum selection rate requirements** to mitigate gaming. We acknowledge that the intervention effect might confound the PPV, so we must be cautious in interpretation.

  ### One-Line Notes on Existing Criteria
  - **Demographic Parity**: Requires equal selection rates; not auditable without full population data (which we lack).
  - **Equalized Odds (equal TPR and FPR)**: Requires outcomes for both selected and non-selected; not auditable.
  - **Calibration**: Requires that risk scores match observed outcome rates; for the selected population, we can only check calibration for the high-risk group, but without the low-risk group, we cannot fully audit.
  - **Predictive Parity (PPV)**: Can be audited on selected population; we propose this with group fairness constraints.
answer: |-
  Based on your constraints and objectives, here's a structured breakdown of requirements for a fairness criterion in procurement contracts, along with key trade-offs and limitations. Requirements are categorized as **non-negotiable** (essential for enforceability) or **preference** (desirable but flexible). The analysis focuses on feasibility given your operational constraints (e.g., partial outcome data, vendor gaming risks, compositionality, and intervention effects).

  ---

  ### **Core Requirements for Fairness Criteria**
  1. **Auditability (Non-negotiable)**  
     **Motivation**: Auditors must verify compliance using only decisions (e.g., who received an intervention) and *realized outcomes* for the *selected group*. You lack features, model internals, and outcomes for non-selected individuals.  
     **Why non-negotiable?** Without this, enforcement is impossible. Most group-fairness metrics (e.g., FPR/FNR) fail here—they require outcomes for the non-selected.

  2. **Scale Invariance (Non-negotiable)**  
     **Motivation**: Vendors use different risk-score scales (e.g., 0–1 vs. 1–100). The criterion must be comparable across models without score normalization.  
     **Why non-negotiable?** Procurement requires apples-to-apples vendor comparison. Metrics like AUC or calibration curves are scale-invariant; thresholds (e.g., "FPR < 0.1") are not.

  3. **Robustness to Gaming (Non-negotiable)**  
     **Motivation**: Vendors might "overfit" to the audit by manipulating selection (e.g., only selecting high-confidence cases to inflate accuracy) or exploiting missing data.  
     **Why non-negotiable?** Gaming undermines real-world impact. Example: A vendor could satisfy high PPV by selecting fewer people, worsening overall fairness.

  4. **Causal Validity (Preference)**  
     **Motivation**: Interventions (e.g., benefits) may alter outcomes (e.g., eligibility). The criterion should remain meaningful despite this confound.  
     **Why a preference?** Ideal for real-world validity, but hard to enforce without RCT-like data. Most criteria assume no interference; relaxing this allows pragmatism.

  5. **Compositionality (Preference)**  
     **Motivation**: Individuals often pass through sequential systems (e.g., screening → eligibility → allocation). The criterion shouldn't degrade under composition.  
     **Why a preference?** Desirable for ecosystem coherence, but rarely achievable. Simple metrics (e.g., PPV) often fail here due to dependency chains.

  6. **Group Fairness (Non-negotiable)**  
     **Motivation**: Legally mandated protections (e.g., race, gender) require disparities to be measurable and bounded.  
     **Why non-negotiable?** Public agencies must avoid discrimination. Criteria must support group-wise comparison (e.g., "PPV gap < 0.05").

  7. **Feasibility with Partial Outcomes (Non-negotiable)**  
     **Motivation**: Outcomes are only observed for the *selected* group (due to intervention effects or missing labels).  
     **Why non-negotiable?** Most fairness metrics require full outcome data. Without this, criteria like equalized odds are incomputable.

  ---

  ### **Key Gaps in Your Requirements**
  8. **Incentive Alignment (Non-negotiable)**  
     **Motivation**: The criterion should encourage vendors to select *more* true positives (e.g., eligible individuals), not fewer. Metrics like PPV can be gamed by conservatism (selecting fewer people).  
     **Solution**: Pair fairness metrics with *coverage constraints* (e.g., "selection rate ≥ X% per group").

  9. **Assumption Transparency (Preference)**  
     **Motivation**: Auditors must document assumptions (e.g., "no intervention effect" for PPV). Without this, vendors may exploit ambiguities.  
     **Why a preference?** Not strictly required, but critical for legal defensibility.

  ---

  ### **Trade-offs and Impossibilities**  
  Given **no-go theorems** (e.g., calibration vs. error rate balance under differing base rates) and your constraints, **no single criterion satisfies all requirements**. Key conflicts:  

  - **Calibration + Error Rate Balance = Impossible**  
    You can't require both (e.g., "calibrated scores" and "equal FPR/FNR") if base rates differ across groups. Must drop one.  
  - **Causal Validity + Auditability = Partially Unsatisfiable**  
    Unless you have instrumental variables or RCT data, causal metrics (e.g., counterfactual fairness) are unauditable with observed outcomes alone.  
  - **Compositionality + Group Fairness = Unsatisfiable**  
    Sequential systems amplify small biases (compositionality failure). No widely accepted metric solves this; drop strict compositionality.  
  - **Feasibility + Full Fairness = Unsatisfiable**  
    With outcomes only for the selected, you **cannot compute most error-rate metrics** (e.g., FNR, equalized odds).  

  **What to Drop?**  
  - **Error Rates (FPR/FNR)**: Require outcomes for non-selected.  
  - **Strict Causal Validity**: Without experimental data, assume interventions don't *fully* invert outcomes.  
  - **Perfect Compositionality**: Monitor systems individually and audit aggregate outcomes.  

  ---

  ### **Viable Criteria & Limitations**  
  Based on your constraints, **predictive parity (PPV)** is the most viable starting point:  
  - **PPV (Positive Predictive Value)**: `P(Outcome=1 | Selected=1)`.  
    - **Auditable?** Yes (uses decisions + outcomes for selected).  
    - **Scale-invariant?** Yes (ratio, not score-dependent).  
    - **Robust to gaming?** No—vendors can inflate PPV by selecting fewer people. Mitigate with **coverage requirements** (e.g., "selection rate ≥ 20% per group").  
    - **Causal validity?** Weak—if interventions reduce outcomes, PPV measures "residual risk," not true risk.  
    - **Compositionality?** Poor—PPV degrades in sequences if earlier systems bias later inputs.  
    - **Group fairness?** Yes—measure PPV gaps (e.g., `|PPV_groupA - PPV_groupB| < δ`).  

  **Other Criteria & Why They Fail**  
  - **Calibration**: Auditable only if scores are shared (you lack features) and for the selected group (not the full population).  
  - **Demographic Parity**: Requires selection rates, but not auditable for fairness (needs outcomes to avoid harm).  
  - **Equalized Odds**: Incomputable—needs outcomes for non-selected.  
  - **AUC**: Scale-invariant but incomputable (needs full outcome data).  

  ---

  ### **Recommendations**  
  1. **Adopt PPV with group-wise constraints** and **coverage minimums** to deter gaming.  
  2. **Explicitly state assumptions** (e.g., "interventions don’t eliminate outcomes") in contracts.  
  3. **Audit composition empirically** by tracking outcomes across sequential systems.  
  4. **Prioritize**: Auditability + Scale invariance + Group fairness + Coverage incentives. Drop strict causal validity/compositionality.  

  This approach balances enforceability with fairness, though it accepts limitations in causal validity and compositionality. If outcome data for non-selected groups becomes available (e.g., via random audits), revisit error-rate metrics.
