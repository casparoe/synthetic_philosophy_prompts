prompt: |-
  I'm a journalist, and I'm finishing a long piece on how institutions decide who gets helped when they can't help everyone: a hospital committee allocating a scarce drug, a foundation's grant meeting, a triage protocol drafted during a pandemic. I've come out of the reporting with a set of verdicts that I can't compress into one honest sentence, and I'd be grateful if you'd tell me what principle, if any, they add up to, and what holding it would cost me.

  1. One dose of a drug. Patient A is bedbound, in constant pain, with roughly two years of life left. Patient B is comfortable, mildly limited by a chronic condition, with decades ahead. The dose buys A about ten months of decent life and B about twelve. I give it to A. I keep giving it to A as the ratio worsens — I still choose A when B would get twenty months — and I switch to B somewhere around forty, though I couldn't defend the number.

  2. A regulator can block a new diagnostic device that would be available only to the well-off. Blocking it does nothing for the badly-off: no price effects, no spillovers, no redistribution, just a smaller gap. I don't think blocking it is an improvement, and I'd say so in print.

  3. Yet I do think abolishing a VIP fast-track — a separate, shorter queue for the well-off, or a hereditary title — is an improvement, even though it leaves everyone's material well-being exactly as it was and doesn't lengthen a single badly-off life.

  4. Triage: one very badly-off patient versus five comfortably-off patients, same benefit per patient. I take the five. One very badly-off patient versus two comfortably-off patients. I take the one.

  5. A hundred people in destitution, each lifted a long way, versus ten million comfortable people each getting a gain so small that none of them would notice it, though the arithmetic total is far larger. I take the hundred, and I can't talk myself out of it.

  6. Two candidates for a scarce bed, equally badly off now, identical expected benefit: one is badly off through a voluntary, well-informed, thoroughly enjoyable risk; the other through bad luck. I give real priority to the unlucky one — while conceding that the benefit would do exactly as much good in either life.

  7. The one I go back and forth on: a preventive programme for people who are comfortable now but at high risk of being very badly off later, versus treatment for people who are badly off now. On Tuesday I fund the prevention, on Thursday the treatment. I can't tell whether priority should track someone's expected lifetime position or the position they occupy when the help arrives.

  My working sentence is this: weight a benefit more heavily the worse off its recipient is, otherwise just add the benefits up, and never make anyone worse off merely to make things more equal. Test it against the seven cases and repair it where it breaks. Tell me which verdicts it cannot deliver and which one I should give up, whether my refusal in case 2 rules out whatever case 3 requires, and whether cases 1, 4 and 5 can be held by one weighting at all or force me toward something less smooth. Then tell me what the repaired principle says about two cases I haven't settled: destitute people alive today versus people who will exist two centuries from now and be far better off than anyone living, and animals whose range of well-being is much narrower than ours. Finally, give me the one sentence I can print that a hostile reader can't break with an obvious counterexample.
reasoning: |-
  Okay, the user is a journalist working on a complex piece about resource allocation in institutions. They've presented seven intricate scenarios where they've made intuitive moral judgments but can't distill them into a coherent principle. 

  First, I need to understand each case deeply. The journalist seems to be wrestling with several ethical tensions: severity of need vs. total benefit, equality vs. efficiency, and immediacy vs. future risk. Their working principle already shows sophistication - prioritarianism with a side-constraint against leveling down. 

  Case 1 reveals an interesting non-linearity in their thinking - they prioritize the severely ill patient even when the benefit ratio is unfavorable, but switch when it becomes extreme. This suggests diminishing moral weight to suffering rather than simple utilitarianism. 

  Cases 2 and 3 expose a crucial distinction: they reject equality when it's purely symbolic (blocking the diagnostic device) but embrace it when it involves procedural justice (abolishing VIP queues). This tracks real-world intuitions about fairness being relational, not just distributive.

  The triage scenarios (4) show how their threshold for favoring the severely ill changes with the numbers. Five-to-one? Save the group. Two-to-one? Save the individual. This implies the weighting function for disadvantage isn't constant.

  The massive numbers dilemma (5) is fascinating - they reject aggregating trivial benefits even mathematically, which challenges strict utilitarianism. Their refusal here might stem from concerns about moral demandingness or incommensurability.

  The responsibility element in case 6 adds another layer. They prioritize the unlucky patient despite identical current need and benefit, suggesting desert plays a role beyond pure welfare considerations.

  The prevention vs. treatment dilemma (7) is the hardest, and their ambivalence is telling. This cuts to the heart of whether we should optimize for lifetime welfare or current suffering - a fundamental tension in population ethics.

  For the unresolved cases about future generations and animals, I'll need to extend the principle carefully. Future people might get less weight due to uncertainty and non-identity problems, while animals require adjusting for different capacities.

  Crafting the final sentence is tricky. It needs to withstand attacks from both strict egalitarians and utilitarians. The key is balancing the three elements: progressive weighting, aggregation, and the anti-leveling constraint. The "when aggregation applies" qualifier is crucial for handling the small-benefits case.
answer: |-
  Here's a breakdown of your verdicts, the principle they reveal, its costs, and the repairs needed for your working sentence:

  **The Principle Your Verdicts Reveal: Progressive Weighted Aggregation with Anti-Leveling & Procedural Fairness Constraints**

  Your judgments prioritize the worse-off, but non-linearly and with limits:
  1.  **Strong Priority to the Severely Disadvantaged:** You consistently favor the much worse-off in Cases 1, 4 (1 vs 2), and 5, even against significant aggregate benefits elsewhere.
  2.  **Non-Linear (Progressive) Weighting:** The weight given to a benefit increases *more than proportionally* as the recipient's disadvantage worsens. This explains:
      *   Case 1: The severely ill (A) gets priority over a larger aggregate benefit to the mildly ill (B) until the ratio becomes extreme (B gets 40mo vs A's 10mo).
      *   Case 4: Saving one very badly-off person trumps saving two comfortably-off people, but *not* five. The weight on the single badly-off life outweighs 2x the benefit to the comfortable, but not 5x.
      *   Case 5: The extreme disadvantage of the destitute outweighs the massive, but individually trivial, aggregate gain to the comfortable.
  3.  **Aggregation Matters:** When the disadvantage gap is smaller *or* the number benefiting elsewhere is large enough, aggregate benefits win (Case 4: 5 vs 1).
  4.  **Rejection of Pure Leveling Down:** You refuse to make anyone *worse off* solely to reduce inequality (Case 2: Blocking the device).
  5.  **Procedural Fairness Matters:** You object to systems that *actively create* or *institutionalize* unfair access based on privilege, even if material outcomes wouldn't change immediately (Case 3: Abolishing VIP fast-track). This is distinct from leveling down; it's about the *process* and *symbolic meaning* of fairness.
  6.  **Responsibility/Desert Plays a Role:** In Case 6, you prioritize the unlucky patient over the one who chose the enjoyable risk, despite identical current need and benefit. This introduces an element of desert or responsibility, not captured solely by current well-being or aggregate benefit.
  7.  **Ambivalence on Temporal Focus:** Case 7 shows your unresolved tension between prioritizing current suffering vs. preventing future severe disadvantage. Your principle needs to clarify whether weighting is based on *current* well-being or *expected lifetime* well-being.

  **Testing & Repairing Your Working Sentence:**

  *   **Your Sentence:** "Weight a benefit more heavily the worse off its recipient is, otherwise just add the benefits up, and never make anyone worse off merely to make things more equal."
  *   **Where it Breaks:**
      *   **Case 3 (VIP Queue):** Abolishing the VIP queue doesn't make the well-off *worse off* in absolute material terms (they still get the same care, just without a special queue). Your sentence's anti-leveling clause ("never make anyone worse off") doesn't *require* abolishing it, yet you see it as an improvement. Your sentence *allows* the VIP queue but doesn't *demand* its abolition. **Break:** It doesn't capture your commitment to *procedural fairness*.
      *   **Case 6 (Responsibility):** Your sentence weights based on current well-being (both are equally badly off now). It offers no reason to prioritize the unlucky one. **Break:** It doesn't incorporate *responsibility/desert*.
      *   **Case 5 (Small Benefits):** Strictly "adding benefits up" would favor the ten million trivial gains (the arithmetic total *is* larger). Your verdict rejects this. **Break:** Pure aggregation ("just add the benefits up") is overridden by the extreme disadvantage of the destitute *and* the triviality of the gains to the comfortable. Aggregation seems conditional.
      *   **Case 7 (Prevention vs. Treatment):** Your sentence doesn't specify *when* to assess "worse off" – now or over a lifetime? It's ambiguous here.

  *   **Repaired Principle:** "Prioritize benefits to the worse-off, giving *progressively heavier weight* to those in severe disadvantage. Aggregate benefits otherwise, *when the disadvantages are less severe or the numbers benefiting are sufficiently large, and the gains to each are non-trivial*. Uphold procedural fairness and avoid creating unfair access. Consider responsibility for the disadvantage. *Never reduce anyone's well-being solely to achieve equality*."

  **Which Verdicts Challenge the Principle & What to Give Up?**

  *   **Case 5 (Small Benefits) is the Hardest:** Holding both strong priority for the severely disadvantaged *and* allowing aggregation requires that aggregation be limited. You *must* reject pure aggregation of trivial benefits, even if the sum is large. Giving this up would mean accepting that ten million tiny gains outweigh lifting a hundred from destitution – which you find deeply counterintuitive. **Cost:** This makes the principle less utilitarian and potentially less "smooth" mathematically. It introduces a threshold for what counts as a "meaningful" benefit worthy of aggregation. **Stick with your verdict.**
  *   **Case 6 (Responsibility):** Incorporating responsibility/desert is feasible within the principle (as in the repair: "Consider responsibility for the disadvantage"). **No need to give up.**
  *   **Case 2 vs. Case 3:** Your refusal in Case 2 (no leveling down) does *not* rule out Case 3 (procedural fairness). They address different concerns: absolute outcomes vs. the fairness of the process/system itself. The repaired principle handles this by separating the anti-leveling constraint from the procedural fairness requirement.

  **Can Cases 1, 4, and 5 Coexist?** Yes, with progressive weighting and conditional aggregation. The weighting function is steep for severe disadvantage (favors A in Case 1, the single patient in 4 (1vs2), the destitute in 5), flatter for milder disadvantage (allows aggregation for the 5 comfortable in Case 4). Case 5 adds the constraint that benefits must be non-trivial to be aggregated significantly against severe disadvantage.

  **The Repaired Principle on Unsettled Cases:**

  1.  **Destitute Today vs. Much Better-Off Future People (200 years):**
      *   **Progressive Weighting:** Heavily favors the destitute today due to their *extreme* current disadvantage compared to the expected high well-being of the future people.
      *   **Aggregation:** If the future benefit per person is large *and* the number is vast, aggregation *might* pull in their favor. However:
      *   **Non-Trivial Gains:** The gains to the destitute are huge and immediate. Gains to future people are distant and uncertain (discounting).
      *   **Procedural Fairness/Responsibility:** We arguably have a stronger duty to those existing now.
      *   **Verdict:** The repaired principle strongly points towards prioritizing the destitute alive today, unless the future benefit is truly monumental, certain, and addresses catastrophic risk (preventing extinction). The extreme disadvantage of the present destitute dominates.

  2.  **Animals (Narrower Range of Well-Being):**
      *   **Progressive Weighting (Adjusted):** "Worse off" needs interpretation relative to the *species-typical range* of well-being. Severe animal suffering (e.g., intensive farming, injury) would be weighted heavily.
      *   **Aggregation:** Large numbers of animals experiencing significant suffering relief vs. fewer humans experiencing smaller gains would be a close call under aggregation, heavily influenced by how we scale well-being across species. A large number of animals experiencing severe suffering could outweigh benefits to a smaller number of comfortable humans.
      *   **Non-Trivial Gains:** Applies similarly.
      *   **Verdict:** The principle *can* incorporate animals by defining "worse off" relative to their capacity. It would likely prioritize relieving severe suffering in large numbers of animals over small gains to comfortable humans. The cost is the difficulty of cross-species well-being comparisons.

  **The One Sentence to Print:**

  > "When allocating scarce help, prioritize those suffering most severely, giving their needs outsized weight; otherwise, maximize total meaningful benefit, but never worsen anyone's lot just to equalize, and ensure the process itself is fair."

  **Why this works against hostile readers:**

  1.  **"Suffering most severely":** Captures Cases 1, 4 (1 vs 2), 5. Explains why A gets priority initially, the single badly-off patient beats two comfortable ones, and the destitute beat trivial gains.
  2.  **"Outsized weight":** Signals non-linear priority (progressive weighting), explaining why A wins even when B gets more absolute benefit initially (Case 1), and why the destitute win Case 5.
  3.  **"Otherwise, maximize total meaningful benefit":**
      *   "Otherwise" implies aggregation kicks in when severe disadvantage isn't the primary factor (Case 4: 5 vs 1).
      *   "Meaningful" implicitly addresses Case 5 (trivial gains don't count meaningfully against severe need) and Case 4 (saving lives is always meaningful).
  4.  **"Never worsen anyone's lot just to equalize":** Directly addresses Case 2 (blocking the device). Hostile readers can't force you into leveling down.
  5.  **"Ensure the process itself is fair":** Captures Case 3 (abolishing VIP queue). It's about the *how*, not just the *what* of the outcome.
  6.  **Handles Responsibility (Implied):** "Suffering most severely" *could* encompass suffering caused by sheer bad luck vs. chosen risk, aligning with Case 6. While not explicit, it doesn't contradict it.
  7.  **Handles Prevention/Treatment Ambiguity:** It focuses on *current* "suffering most severely," leaning towards treatment, but "suffering" could be interpreted broadly to include the high risk of future severe suffering in Case 7. It doesn't resolve the tension but provides a defensible anchor point (current state).

  **The Cost of Holding This Principle:** You sacrifice the purity of both strict egalitarianism (you allow some inequalities if they don't involve leveling down or unfair processes) and strict utilitarianism (you prioritize the severely suffering over larger aggregate gains, and reject aggregating trivial benefits). You embrace a complex, context-sensitive pluralism that values severe suffering, significant aggregate welfare, procedural justice, and avoids harming for equality's sake, acknowledging this won't always yield a single clear answer (as in Case 7). Your hostile reader might accuse you of inconsistency or arbitrariness in the weightings, but your sentence provides a robust framework that captures your core intuitions across the diverse cases.
