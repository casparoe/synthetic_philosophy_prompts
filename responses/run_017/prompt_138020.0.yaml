prompt: |-
  longtime lurker on the EA Forum and the rationalist blogs here — I keep seeing the scale argument run as nothing more than N × p × welfare-per-animal, and I want the spec before I touch the calculator again. So write me the desiderata: what a theory of comparative sentience and moral status across taxa would have to deliver to be good enough to allocate a fixed budget across interventions on a ten-year horizon. Not good enough to settle the metaphysics — I definately don't care about that, I care about spending money.

  For each requirement, give the case or consideration behind it, and mark whether it's non-negotiable or just a taste of one camp.

  Two stipulations so this isn't a rehash of the usual post. First, call it the clade gamble: assume sentience is a package deal at the level of the taxonomic order, so either every insect in an order has valenced experience or none do — the uncertainty doesn't wash out across individuals and the error bars are correlated. Second, we're choosing under moral uncertainty between a hedonic view of welfare and a desire-based one, and we refuse to pick between them.

  I want you to take a position, not list options neutrally, on: whether the theory has to hand us cardinal, intertheoretically comparable numbers or whether ordinal rankings would do; whether it's allowed to let a one-in-a-thousand credence on 10^18 units of value dominate everything; whether the answer may shift when we redescribe one population as two; and which findings the theory has to be revisable in the light of rather than merely consistent with. Then flag any pair of your own desiderata you suspect can't be jointly satisfied — risk-sensitivity against invariance under redescription looks like one to me, but you tell me — and say which single requirement knocks out the most candidates.

  Keep the scoring of the two default moves (multiply-and-compare under expected value, versus some precautionary threshold rule) to one short paragraph at the end; the list is the deliverable. Answer in British English please.
reasoning: |-
  Hmm, the user is asking for a set of desiderata for a theory of comparative sentience and moral status across different animal taxa. They're a long-time lurker on EA Forum and rationalist blogs, so they're familiar with the scale arguments in animal welfare. They want this for practical budget allocation, not metaphysical debates.

  The user has two key stipulations: the "clade gamble" where sentience is either present or absent at the taxonomic order level, and they want to account for moral uncertainty between hedonic and desire-based welfare views without choosing between them. They specifically want me to take positions on several points: whether we need cardinal numbers or if ordinal rankings suffice, whether tiny probabilities of huge value should dominate decisions, whether population redescription affects outcomes, and how revisable the theory should be.

  I need to provide a clear list of requirements for what makes a good theory in this context, explaining the reasoning behind each. The user also wants me to identify potential conflicts between desiderata and point out which requirement would disqualify most candidate theories.

  For the cardinal vs ordinal question, I think we need cardinal, intertheoretically comparable numbers because we're allocating a fixed budget and need precise trade-offs between interventions. Ordinal rankings wouldn't give us enough information for effective resource allocation.

  On the domination question, I believe we shouldn't let a one-in-a-thousand chance of astronomical value dominate everything. This avoids absurd conclusions like prioritizing negligible probabilities over more certain benefits, which aligns with standard decision theory practices.

  Regarding population redescription, the theory should be invariant - the answer shouldn't change if we artificially split or merge populations. This prevents manipulation through framing.

  For revisability, the theory must be revisable in light of new evidence about neural complexity, behavioral flexibility, evolutionary continuity, and unexpected findings from invertebrates. It shouldn't just be consistent with existing data but responsive to new information.

  I suspect risk-sensitivity and invariance under redescription might conflict. Risk-sensitivity might require different treatment of correlated risks (like the clade gamble), while invariance demands consistency regardless of how we group populations. This tension might be hard to reconcile.

  The requirement that would knock out most candidate theories is probably the need for cardinal, intertheoretically comparable numbers under moral uncertainty. Many theories provide rankings within a single framework but struggle with cross-theory comparisons.

  For scoring the default approaches: Expected Value (EV) multiplication is computationally simple but fails with correlated uncertainties and extreme probabilities. Precautionary thresholds avoid worst cases but can be inefficient. A good theory should outperform both by handling these issues better.

  I'll organize this into a clear list with reasoning for each desideratum, flagging which are non-negotiable versus preference-based, and addressing the specific positions the user requested.
answer: |-
  Here’s a position on the desiderata for a theory of comparative sentience and moral status, tailored for near-term budget allocation under your constraints. The goal is **robust action-guidance under clade-level uncertainty and moral pluralism**, not philosophical certainty.

  ### Core Desiderata (Non-Negotiable)
  1.  **Cardinal, Intertheoretically Comparable Welfare Units:**  
      *   **Why:** Allocating a fixed budget requires quantitative trade-offs between interventions targeting different clades and under different welfare conceptions (hedonic/desire). Ordinal rankings ("insects < fish < mammals") are insufficient to determine *how much* resource shift is warranted.  
      *   **Case:** Choosing between scaling up corporate broiler chicken reforms (high confidence, moderate scale) vs. foundational insect welfare research (low confidence, vast scale) demands knowing not just that insects *might* matter less, but *how much less per individual* on a common scale.  
      *   **Non-negotiable.** Without this, quantitative allocation is guesswork.

  2.  **Handles Clade-Gamble Correlation Rigorously:**  
      *   **Why:** Your stipulation means uncertainty isn't independent per individual. A theory must model the risk that an entire order (e.g., all Diptera) is non-sentient, making interventions targeting them worthless, or fully sentient, making them immensely valuable.  
      *   **Case:** Investing in fly farming welfare improvements carries massive, undiversifiable risk – either a huge win or total loss. The theory must reflect this correlated uncertainty, not treat flies as billions of independent coin flips.  
      *   **Non-negotiable.** This is core to the problem framing.

  3.  **Explicit Integration of Moral Uncertainty (Hedonic vs. Desire):**  
      *   **Why:** We refuse to pick a single theory. The output must reflect our credence over both welfare conceptions and their potentially divergent implications for moral status across clades.  
      *   **Case:** Desire theories might grant significant weight to complex goal-directed behaviours in insects (e.g., parasitoid wasp hunting) even with simple neurology, while hedonic theories demand stronger evidence of valenced states. The theory must output welfare estimates conditional on each view *and* aggregate them under our uncertainty.  
      *   **Non-negotiable.** Ignoring this uncertainty arbitrarily privileges one view.

  4.  **Invariance Under Population Redescription:**  
      *   **Why:** The recommended allocation shouldn't change simply because we arbitrarily split one population (e.g., "Diptera") into sub-populations (e.g., "Drosophilidae" and "non-Drosophilidae Diptera") or merge them, *if the underlying evidence and uncertainty remain identical*.  
      *   **Case:** Artificially splitting "flies" into "fruit flies" and "other flies" shouldn't magically make fly welfare interventions appear more or less attractive if our knowledge about sentience applies equally to the whole order. Protects against manipulation via taxonomy.  
      *   **Non-negotiable.** A requirement for consistency; failing this makes the theory arbitrary.

  5.  **Revisability in Light of Specific Evidence Types:**  
      *   **Why:** The theory must be updatable, not just consistent. It needs clear "knobs" adjusted by new empirical findings relevant to sentience criteria under *both* welfare views.  
      *   **Must be Revisable Based On:**  
          *   **Neural Complexity/Integration:** E.g., discovery of new, dense, recurrent neural structures in a clade previously assumed simple.
          *   **Behavioural Flexibility & Learning:** Evidence of context-dependent learning, aversion overcoming strong innate drives, or novel problem-solving.
          *   **Pharmacological/Neuromodulatory Responses:** E.g., analgesics reducing avoidance behaviours indicative of pain (hedonic) or goal-blocking frustration (desire).
          *   **Evolutionary/Phylogenetic Continuity:** Strong evidence for homologous neural substrates linked to sentience in vertebrates appearing in distantly related clades.
          *   **Unexpected Negative Results:** E.g., failure to elicit learned avoidance despite apparent nociception in a complex clade.
      *   **Non-negotiable.** A static theory is useless for adapting spending.

  ### Important, But Potentially Negotiable (Reflecting a Risk-Sensitive Position)
  6.  **Rejects Extreme Stochastic Dominance (1/1000 credence on 10^18 units DOESN'T automatically dominate):**  
      *   **Why:** Under the clade gamble, a tiny credence that e.g., all Coleoptera are intensely sentient could imply astronomical expected value, swamping all other interventions. This leads to absurdities (e.g., diverting 99% of budget to beetle welfare research based on near-zero evidence) and is hypersensitive to credence assignments in the tail.  
      *   **Case:** A 0.001% credence that nematodes have human-equivalent welfare ranges shouldn't force allocating billions to soil-dwelling worm welfare, ignoring near-certain suffering in vertebrates. Requires a dampening function (e.g., variance-sensitivity, leveraging moral uncertainty, or non-linear aggregation) for extreme, low-probability hypotheses.  
      *   **Position:** **Non-Negotiable for practical allocation.** We must avoid being hostage to arbitrarily small tail risks. (This is a taste of a risk-averse/cautious camp, rejecting pure EV maximization under deep uncertainty).

  7.  **Risk-Sensitivity Beyond Pure EV:**  
      *   **Why:** Correlated clade-level uncertainty creates significant "model risk" – the chance our entire sentience model for a clade is wrong. Pure EV might ignore the catastrophic loss if we bet big on a clade later proven non-sentient.  
      *   **Case:** Investing heavily in shrimp welfare based on contested evidence risks wasting resources if decapods are non-sentient, whereas under-investing in fish welfare risks missing known, large-scale suffering. A good theory should incorporate aversion to this model risk/waste.  
      *   **Position:** **Strongly Preferred.** True non-fanaticism (Desideratum 6) likely requires some risk-sensitivity. (Taste of a cautious camp).

  ### Potential Conflict & The Knockout Requirement
  *   **Conflict:** **Risk-Sensitivity (7) vs. Invariance (4)** is indeed tense. Risk-sensitivity might demand treating a large, correlated clade (e.g., "all insects") differently than many smaller, uncorrelated clades summing to the same population size, due to the undiversifiable gamble. Invariance requires treating them identically *if the per-individual evidence/sentience probability is identical*. Reconciling this requires the risk-sensitivity to arise from the *structure of the evidence and uncertainty itself* (which is tied to the clade level), not from the arbitrary description. It's challenging but perhaps possible (e.g., risk defined by credence distribution *width* and model uncertainty at the clade level).
  *   **The Knockout Requirement:** **Cardinal, Intertheoretically Comparable Welfare Units (1)** knocks out the vast majority of candidate approaches. Philosophical theories rarely deliver cardinal comparability *within* a view, let alone *across* hedonic and desire-based views. Many promising frameworks (e.g., based on neuroscientific proxies) crumble when forced to output a number representing "welfare units per fruit fly under desire-theory relative to a broiler chicken under hedonism, aggregated under moral uncertainty." This is the highest barrier.

  ### Scoring the Default Moves
  *   **Naive Expected Value (N x p x welfare):** Fails catastrophically under the clade gamble (ignoring correlation, treating individuals as independent) and moral uncertainty (assuming a single welfare view). It's also hypersensitive to tail risks (Desideratum 6 violation). Computationally simple but unfit for purpose here.
  *   **Precautionary Threshold Rule (e.g., "treat all vertebrates as sentient, ignore invertebrates"):** Avoids worst-case outcomes of ignoring potential sentience but is crude, potentially inefficient (over-investing in low-scale/high-certainty clades, under-investing in high-scale/medium-certainty clades), and lacks nuance for allocation *within* the "precautionary zone" (e.g., insects vs. cephalopods). Fails Desiderata 1, 2, 3, 5, and arguably 7 by being inflexible.

  The ideal theory synthesizes cardinal comparability, rigorous uncertainty/moral pluralism integration, revisability, and managed risk-sensitivity – a tall order highlighting why this remains deeply unresolved. Your instinct about the core tension is spot on.
