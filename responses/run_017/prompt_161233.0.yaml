    1. Two statute cards:  
       - *Statute 1 (Blue Card):* "Verdicts shall be based on unbroken chains of memory and character traits."  
       - *Statute 2 (Red Card):* "Verdicts shall be based solely on what is ultimately real."  
    2. Docket sheets (5 cases).  
    3. Timer, slips of paper for private rules, voting tokens (Guilty/Not Guilty, Liable/Not Liable).  
  - **Seating:** Students as "Justices," instructor as "Bailiff" (enforces time, distributes cases).  
  - **Timing Apparatus:** Countdown timer visible to all.  

