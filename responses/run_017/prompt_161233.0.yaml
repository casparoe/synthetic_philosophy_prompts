  #### **Docket**  
  1. **Case 1 (Gradual Replacement):**  
     - *Facts:* Rowan commits theft. Over 40 years, memories/traits change incrementally. Rowan-now denies guilt.  
     - *Forced Choice:* Guilty or Not Guilty.  
     - *Exposes:* Continuity as consensus tool; reveals statute’s vagueness.  

  2. **Case 2 (Fission):**  
     - *Facts:* Sage splits into Elm/Oak. Both claim Sage’s heirloom painting.  
     - *Forced Choice:* Award to Elm, Oak, or neither.  
     - *Exposes:* Indivisibility forces arbitrary choice; continuity fails.  

  3. **Case 3 (Promise):**  
     - *Facts:* Aspen promised $10K to Birch. Birch now claims debt; Aspen says "all beings are one."  
     - *Forced Choice:* Require payment or not.  
     - *Exposes:* "We-are-all-one" → voids all promises (absurd).  

  4. **Case 4 (Apology):**  
     - *Facts:* Reed wronged Finch. Finch demands apology; Reed says "no enduring self was wronged."  
     - *Forced Choice:* Require apology or not.  
     - *Exposes:* Annihilationism → denies redress (callous).  

  5. **Case 5 (Fusion):**  
     - *Facts:* Linden splits into Alder/Willow. Alder commits fraud. 10 years later, Alder/Willow fuse into Cypress.  
     - *Forced Choice:*  
       a) Is Cypress liable for fraud?  
       b) Was Case 2’s verdict correct *when made*?  
     - *Exposes:* Retroactive truth-change dilemma.  

  ---

  #### **Debrief (Post-Activity)**  
  1. **Separate Reductionism vs. No-Self:**  
     - *Reductionism (Parfit):* Identity is "just" continuity/causality; practical facts exist for courts.  
     - *No-Self (Buddhist):* Not just "no further fact" but **no fact at all**. Questions like "same person?" entrench delusion.  
     - *Divergence:* Reductionism keeps "person" as useful fiction; Buddhism seeks to extinguish "I-making" (*ahaṃkāra*).  

  2. **Traps Exposed:**  
     - *Case 3:* "We-are-all-one" absurdity shows why conventions persist.  
     - *Case 4:* Annihilationist callousness reveals ethics’ dependence on designated persons.  

  3. **The Change:**  
     - *Buddhist Shift:* Not denying continuity, but ceasing to *appropriate* aggregates as "me" or "mine" (*anattā*).  
     - *Contrast:* Reductionism explains identity; Buddhism deconstructs the craving behind identity-questions.  

