  #### **Statute Clauses**  
  1. **Initial Statute (Blue):**  
     - *Wording:* "Verdicts shall be based on unbroken chains of memory and character traits."  
     - *Gap:* No guidance for branching/fusion cases.  
     - *Pressure:* Forces appeal to "overlapping continuity" in gradual change; fails for fission.  
  2. **Amended Statute (Red):**  
     - *Wording:* "Verdicts shall be based solely on what is ultimately real."  
     - *Gap:* No definition of "ultimately real."  
     - *Pressure:* Forces confrontation with practical absurdity or callousness.  

