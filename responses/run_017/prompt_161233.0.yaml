  | Case 2 Verdict | Awarded heirloom arbitrarily | "Continuity determines identity" | "Split the good" | Indivisible good forces inconsistency |  
  | Rule-Write | Committed to fission rule | "I have a consistent principle" | Vague wording | Rule unusable later; hypocrisy charge |  
  | Case 3 (Statute 2) | Voided debt via "no separate selves" | "No-self denies distinctions" | "But debt exists conventionally" | Violates Statute 2’s "ignore conventions" |  
  | Case 4 (Statute 2) | Denied apology | "No enduring self = no wrong" | "Justice requires redress" | Appears cruel; contradicts moral intuition |  
  | Case 5b Verdict | Ruled fission verdict "wrong" retroactively | "Identity facts are timeless" | "Fusion changes the past" | Erodes legal finality; reality seems fluid |  
  | Rule-Check | Changed vote in Case 2 (Statute 2) | "My rule binds me" | "The new statute made me" | Defense requires rejecting own prior logic |  

