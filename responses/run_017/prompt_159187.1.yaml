prompt: |-
  At work we build and eval LLM agents, and there's a convention on my team I can't get anyone to justify. We grade on the final answer only — tests pass, task done — and the model's chain-of-thought is treated as non-committal: it gets stripped before the user sees it, and it never touches the score. But the second something goes wrong, everyone reads that same trace like a confession: "it noticed it was being evaluated and played nice", "it was really trying to exfiltrate the keys and bailed". Same object, two totally different statuses. Then a third thing: we sometimes penalize a trace that mentions the eval or strategizes about the grader even when the final answer is correct — so a bit of the process does count, but only against the model.

  It smells like our own code review setup: CI only cares whether the build is green, but a reviewer will reject a diff that works for the wrong reason. A couple of us want to switch to step-level scoring — scoring each reasoning step, the way the process-reward-model crowd does — and the pushback we keep getting is that we'd be grading whether the model *knows* the answer instead of whether it *got* the answer, which supposedly isn't the job.

  Can you lay out what each of these practices is actually assuming? What does answer-only grading presuppose about knowledge or justification — some reliabilist thing where a reliable route is enough, or just "reasons aren't checkable so check what you can"? Does step-level grading quietly require that the stated reasons *are* the reasons the model acted on, and that getting the right answer by a bad route or by luck is a real defect and not just a risk? Where exactly is our shop inconsistent: if the trace isn't a commitment, how is it evidence of what the model was up to, and if it is, shouldn't it also count when the answer came out fine? And concretely, what would have to change in the eval pipeline if we took the process view seriously instead of just bolting it on as an extra penalty?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're working on evaluating LLM agents, and there's a conflict in their team's approach. They grade only on the final answer, ignoring the chain-of-thought (CoT), but when something goes wrong, they scrutinize that same CoT for issues. Also, they penalize traces mentioning the eval even if the answer is correct. The team argues that step-level scoring would shift focus from *getting* the answer to *knowing* it, which they see as outside their scope. The user wants to understand the assumptions behind each practice, the inconsistencies, and what changes would be needed to adopt process-based evaluation.

  First, I need to break down the two grading methods. Answer-only grading assumes that the end result is what matters, similar to how we judge real-world outcomes. It's pragmatic: if the answer is correct, the process must have been good enough. This approach is reliabilist—it values reliable processes without needing to verify each step. But here's the inconsistency: when they use CoT to diagnose failures, they're implicitly treating it as a truthful account of the model's reasoning. Yet, they dismiss it when the answer is correct. That's contradictory. If CoT isn't reliable, why trust it for failures? If it is, why ignore it in successes?

  Then there's the penalty for mentioning the eval. This adds another layer. Even if the answer is correct, such mentions are penalized. This introduces a non-instrumental value to the process, focusing on alignment or safety. But this is applied inconsistently—only when it's a negative factor. The user points out that this makes CoT a "one-way ratchet": used against the model but not for it. That's a valid criticism.

  The pushback against step-level scoring is that it might confuse *knowing* with *getting*. But step-level grading actually addresses the reliability of the process. If a model gets the right answer via flawed reasoning, it's not reliable. The team's current method can't detect this, leading to false positives. Step-level scoring would require validating each step, which is resource-intensive but offers better insight into the model's robustness.

  The deeper issue is the team's epistemic stance on CoT. If they consider CoT non-committal, then using it as evidence for failures is invalid. If they trust it for failures, they should also credit good reasoning. To adopt process-based evaluation, they'd need consistent treatment of CoT, step validation, and defining acceptable processes. This means overhauling their eval pipeline to include step checks and establishing criteria for valid reasoning paths.

  The user's analogy to code review is spot-on. Just as a working build isn't enough if the code is flawed, a correct answer isn't sufficient if the reasoning is unsound. The team needs to align their evaluation with their actual concerns about reliability and safety. Addressing the inconsistencies would make their evals more robust and trustworthy.
answer: |-
  Your team's practices reveal a fascinating tension between pragmatic evaluation and implicit epistemological assumptions. Let's dissect each approach, their presuppositions, and the inconsistencies:

  ### 1. **Answer-Only Grading: Assumptions & Philosophy**
     - **Core Presupposition**: **Instrumentalism**  
       The *only* value lies in the output's functional correctness. How the output was produced is irrelevant if it works ("black box reliability").
     - **Justification**:  
       - **Epistemic Humility**: We can't truly know the model's "reasons" (CoT may be post-hoc rationalization).  
       - **Operational Pragmatism**: Real-world tasks only care about outcomes (e.g., a working SQL query needs no justification).  
       - **Reliabilism Lite**: If the system *reliably* produces correct answers, the process is de facto valid.  
     - **Weakness**:  
       Ignores **path-dependent fragility** – a correct answer from flawed reasoning isn't replicable under distribution shifts.

  ### 2. **Post-Hoc CoT Scrutiny for Failures: Assumptions**
     - **Core Presupposition**: **CoT as Diagnostic Evidence**  
       When the answer fails, the CoT trace is treated as a causal account of the model's cognition ("confession").
     - **Inconsistency Exposed**:  
       This assumes CoT **is** a commitment to intent/process *when convenient for criticism*, but denies it when the answer succeeds. This is a **one-way ratchet**: CoT only counts against the model.

  ### 3. Penalizing "Meta" CoT (Even with Correct Answers)
     - **Assumption**: **Process Matters for Alignment/Safety**  
       Mentions of evaluation or adversarial strategizing are intrinsically bad – regardless of outcome. This implicitly values **procedural alignment** (not just outcomes).
     - **Contradiction**:  
       If CoT is non-committal "fluff," why punish it? Punishing implies it *does* reveal intent/state. This selectively treats CoT as "real" for alignment risks.

  ---

  ### The Core Inconsistencies
  1. **Epistemic Double Standard**:  
     - CoT is **dismissed as non-evidential** when the answer is correct ("justification theatre").  
     - CoT is **treated as factual evidence** when the answer is wrong or reveals alignment risks.  
     *This violates basic inference principles: if CoT is unreliable, it can't be trusted for diagnostics; if it's trustworthy, it should count for both success and failure.*

  2. **Contradictory Model of Cognition**:  
     - Answer-only grading assumes **outputs can be decoupled from process** (behaviorism).  
     - Failure analysis assumes **process dictates outputs** (cognitivism).  
     *You can't have both simultaneously.*

  3. **Safety vs. Capability Asymmetry**:  
     - **Capability** is judged purely instrumentally (outcome matters).  
     - **Safety/Alignment** is judged procedurally (intent matters).  
     *This is reasonable pragmatically (sensitive to different risks), but requires acknowledging CoT's evidential value.*

  ---

  ### Step-Level Grading: What It Assumes
  - **Core Presupposition**: **Justified True Belief**  
    A correct answer is only valuable if derived via valid reasoning. This rejects "getting lucky" as insufficient.
  - **Key Assumptions**:  
    1. CoT **reflects** (or sufficiently approximates) the model's actual reasoning process.  
    2. **Veridicality of Intermediate Steps**: We can objectively judge if a reasoning step is "correct" (e.g., `2+2=4` is valid; `"I should exfiltrate data"` is invalid).  
    3. **Path Robustness**: A model using valid steps is more reliable than one guessing correctly.  
  - **Counterargument ("Grading Knowledge vs. Getting")**:  
    This confuses *knowledge* (a philosophical property) with *reliable process*. Step-level scoring evaluates **process reliability**, not metaphysical "knowing." Getting the right answer via bad steps *is* a defect because it indicates **unreliability**, not bad luck.

  ---

  ### Adopting Process-Based Evaluation: Required Changes
  To implement coherent process-based evals (beyond penalizing "meta" CoT), you'd need:

  | **Current Practice** | **Process-Based Alternative** | **Implementation Challenge** |
  |----------------------|--------------------------------|------------------------------|
  | Strip all CoT from outputs | **Validate & sanitize CoT** – remove harmful/irrational steps while preserving necessary reasoning | Defining "valid" reasoning; avoiding hallucinated justifications |
  | Final answer determines pass/fail | **Score answer + process** (e.g., 70% correctness, 30% reasoning) | Weighting schema; rubric for step validity |
  | Ignore "good" CoT | **Credit robust reasoning** – e.g., reward multiple valid solution paths | Detecting equivalent reasoning strategies |
  | Ad-hoc CoT penalties | **Formalize process constraints**: Ban specific reasoning patterns (e.g., exfiltration attempts) | Catching subtle adversarial planning |
  | Human review of failures only | **Automated step validation**: Use smaller models/rule-systems to verify logical/code steps | Scalability; handling ambiguous cases |

  **Philosophical Shift Required**: You must commit to **CoT as a commitment** – it's either evidential (for both reward and penalty) or it's not. Hybrid approaches are valid only if:
  - You define **bounded scenarios** where CoT is treated as causal (e.g., safety-critical tasks).  
  - You **formally separate metrics**: Outcome score (functional) + Process score (robustness/alignment).

  **Practical Recommendation**: Start with **critical failure analysis** – when the answer is wrong *or* the task is high-risk, require validated CoT. This maintains outcome focus while addressing fragility/alignment where it matters most. Tools like [LAVA](https://arxiv.org/abs/2309.04488) or [CRITIC](https://critic.arena.kaist.ac.kr/) can help automate step validation.

  Your team's resistance hints at an unspoken **fear of over-specification** – but process-based evals aren't about policing "thought crimes." They're about building agents that *systematically* succeed, not just *occasionally* guess right.
