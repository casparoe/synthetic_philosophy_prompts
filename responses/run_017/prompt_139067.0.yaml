prompt: |-
  I'm revising a chapter of a dissertation on what we owe future people, and I want to stress-test the position I've argued myself into before committing to it in print. Roughly: where a choice doesn't affect which particular individuals exist, I keep a person-affecting restriction — moral reasons have to be traceable to some individual being made worse off — but where a choice does determine who comes to exist, I drop that restriction and rank outcomes impersonally, by aggregate well-being with some priority weighting for the worse off. So in the standard cases — the reckless teenager who conceives a child who will start life at a serious disadvantage, the choice between a century-long policy of depletion and one of conservation, a medical programme that prevents a condition in one cohort versus one that treats it in another — my verdict is that nobody is wronged, and that this isn't because the acts are fine, but because the framework that condemns them counts lives rather than wrongs. A friend says I should skip the switch and just be a no-difference theorist; another says the switch is gerrymandering and I should find a person-affecting view that survives identity change.

  Two wrinkles I can't shake. First, the second friend's positive proposal, which he calls the availability-relative threshold view: instead of comparing the life someone gets to the life they would have had under the alternative (empty, since they wouldn't have existed at all), compare it to the range of lives that were feasible and epistemically available to the agent in that choice situation. If you hand someone a life below the bottom of that range when you could have handed them one comfortably inside it, you wrong them, identity notwithstanding. Second, cases where it seems indeterminate, rather than determinately false, that the person who exists would have existed under the alternative: suppose the alternative policy changes the intrauterine environment enough that whether the resulting child is numerically the same person isn't settled, or shifts the timing of conception within a window where which gametes succeed is a chancy matter. If counterfactual identity can be vague, the switch between my two frameworks has no determinate setting.

  So: what would count against the hybrid? I want the defeaters ranked from fatal to merely awkward, and I want you to separate what a committed defender of something like my view should concede as genuinely counting against it from what defenders standardly dismiss as a cost they have already priced in. Please cover: whether the availability-relative threshold view is a real rival to going impersonal or just impersonalism in person-affecting costume; whether the indeterminacy cases do real damage or only force me to let the switch tolerate vagueness; what the hybrid predicts that neither straight impersonalism nor a no-difference view predicts — I think the extension to historical injustice is the testable case, since the same identity-scrambling story seems to excuse wrongs committed a century ago, which I find very hard to accept; and an honest verdict on whether I have insulated the position by saying that wronging drops out while impermissibility doesn't. What would move me most is a case where the hybrid returns the wrong answer about an act that is clearly wrong, rather than a complaint about elegance or an appeal to an intuition I can't independently support. Answer as exactly five numbered points, ordered from most decisive to least, each one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Okay, the user is working on a dissertation chapter about obligations to future people and has developed a hybrid view. They want to stress-test this position before finalizing it. Their hybrid approach uses a person-affecting restriction when choices don't affect who exists (requiring someone to be made worse off) but switches to impersonal aggregation when choices determine who comes into existence. They've received feedback from friends suggesting alternative approaches: one advocating for no-difference theory and another proposing an availability-relative threshold view. The user is particularly concerned about two wrinkles: whether the threshold view is a genuine alternative and how to handle cases with indeterminate identity.

  I need to identify the strongest counterarguments against this hybrid view. The user wants these ranked from fatal to merely awkward, distinguishing between genuine defeaters and dismissed costs. They specifically ask about four aspects: whether the threshold view competes with impersonalism, how indeterminacy affects the framework, what unique predictions the hybrid makes, and whether separating wronging from permissibility holds up.

  Looking at potential weaknesses, the most decisive objection appears to be that the hybrid view fails to condemn clearly wrong historical injustices. Since changing policies centuries ago would have altered who exists today, the hybrid would treat this as an impersonal calculation and potentially excuse past wrongs if they benefited descendants - which contradicts strong moral intuitions about rectifying historical harms.

  The indeterminacy problem seems serious too. When it's vague whether the same person would exist under different choices, the hybrid's framework switch becomes inapplicable. This isn't just awkward but structurally damaging since the view relies on a binary distinction that collapses in these cases.

  Regarding the threshold view, it does seem like a distinct alternative rather than disguised impersonalism. By focusing on what lives were feasible given the agent's knowledge, it maintains person-affecting constraints even in identity-affecting cases, avoiding the hybrid's abrupt framework shift.

  The hybrid's prediction about historical injustice being excusable isn't shared by straight impersonalism (which would condemn it) or no-difference views (which might condemn it differently), making this a unique and problematic implication.

  Finally, separating "wronging" from "permissibility" might not fully insulate the view. In cases like the reckless teenager, saying the child isn't wronged but the act is still impermissible could feel incoherent - if no one is wronged, what grounds the impermissibility? This conceptual tension is awkward even if not fatal.

  The user seems deeply engaged with the philosophical nuances here. They're not just seeking validation but genuine pressure-testing, showing admirable scholarly rigor. Their focus on "clear wrongs" rather than elegance suggests they prioritize moral adequacy over theoretical neatness - a good sign for applied ethics work. The historical injustice concern reveals their awareness of real-world implications, which strengthens their dissertation's relevance.
answer: |-
  1.  **Historical Injustice Condonation:** The hybrid structurally excuses clear historical wrongs (e.g., slavery, forced displacement) because reversing them centuries ago would likely change who exists today; since it wasn't identity-preserving, the hybrid must judge it impersonally, potentially finding no *wrong* done to *any existing descendant* (only an impersonal loss), contradicting strong intuitions about rectification owed *to* specific present people. (*Fatal if rectification duties are person-affecting*).
  2.  **Indeterminacy Collapse:** In identity-indeterminate cases (e.g., intrauterine environment shifts), the hybrid's core distinction (identity-changing vs. identity-preserving choice) becomes inapplicable, leaving no principled basis to decide whether to apply the person-affecting restriction or impersonalism, rendering the view indeterminate or arbitrary *precisely where it needs precision*. (*Structurally damaging, not merely awkward*).
  3.  **Availability-Relative Threshold as Rival:** The threshold view is a distinct, robustly person-affecting competitor; it avoids impersonalism by grounding wronging in delivering a life below the *feasible range available to the agent* (a counterfactual about options, not identity), maintaining person-affecting constraints even in identity-affecting choices, unlike your impersonal switch. (*Genuine alternative, not impersonalism in disguise*).
  4.  **Unique Problematic Prediction (Historical Injustice):** Unlike straight impersonalism (condemns the historical act *and* its impersonal legacy) or no-difference views (may condemn via comparative harm to whoever would exist), the hybrid *uniquely predicts* that historical acts altering identity impose no *person-affecting* duties of rectification *to* descendants, making rectification solely an impersonal duty to improve the aggregate future, which seems insufficient. (*A significant cost specific to the hybrid*).
  5.  **Wronging/Impermissibility Split Incoherence:** Insulating the view by claiming acts are "impermissible" without "wronging" anyone (e.g., reckless teenager case) risks incoherence; the intuitive force of impermissibility in such cases *derives* from the apparent harm/wrong to the child, and if that is denied, the source of the impermissibility becomes obscure, reducing it to a purely impersonal judgment you elsewhere restrict. (*Concession: awkward conceptual cost defenders might dismiss but opponents press*).
