  Progress would involve disentangling the concepts. Adopting distinct terms for each aspect (e.g., co-consciousness unit, access unit, persisting subject) could clarify discussions. Philosophical work on vagueness and personal identity might help, but empirical methods are currently insufficient to resolve the metaphysical questions.

