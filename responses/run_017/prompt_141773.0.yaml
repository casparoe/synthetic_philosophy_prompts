answer: |-
  Here's a committed diagnosis and roadmap, based on your description:

  **Diagnosis: The disagreement is fundamentally conceptual/metaphysical, masquerading as empirical, and amplified by a failure to disambiguate distinct questions.** (Confidence: 90%)

  1.  **The Core Problem:** Your hypothesis is almost certainly correct. "Subject of experience" (SoE) is an overloaded folk concept being stretched beyond its intuitive boundaries by neural disunity. The three jobs you identify (Co-consciousness Unit, Access Unit, Persisting Subject) are distinct functional/phenomenological properties often conflated in a healthy brain but dissociable in pathology. The debate stalls because participants are:
      *   **Prioritizing different "jobs":** One person hears "SoE" and thinks "what is unified *right now*?" (Co-consciousness). Another thinks "who controls action?" (Access). Another thinks "is it still *me*?" (Persistence).
      *   **Using different criteria for the same job:** For "Co-consciousness," one might require direct phenomenal unity (impossible post-split), another might accept functional integration (possible in tasks), another might appeal to narrative continuity.
      *   **Assuming a metaphysical reality where there might be none:** Insisting there *must* be a fact of the matter about "how many SoEs" is like insisting there *must* be a fact of the matter about "how many heaps" in a sorites paradox. The concept itself may be vague or context-dependent.

  2.  **The Hidden Empirical Question is Real but Insufficient:** The "simultaneous global broadcasts vs. alternating" question *is* crucial for the *Co-consciousness Unit* aspect. However:
      *   **Current tools are inadequate:** We lack the ability to non-invasively measure the *phenomenal field* itself. We infer from behavior (conflict, reporting) and neural correlates (EEG, fMRI), which are proxies. Behavior can be ambiguous (is conflict *two* agents or *one* disorganized agent?).
      *   **It doesn't resolve the other jobs:** Even if we proved two simultaneous global workspaces, it wouldn't automatically resolve the *Access Unit* (can they *both* control the mouth? Is control shared?) or the *Persistence Subject* (is the pre-split person still there? Are there two new persons?).

  3.  **Your Cases Highlight the Ambiguity:**
      *   **Delay Bridge:** This is a sorites series for SoE. People's intuitions about "when it becomes two" will vary wildly depending on which "job" they prioritize and their tolerance for vagueness. Someone insisting there's a fact is likely committed to a metaphysical view of selves as fundamental entities (like souls or irreducible individuals), while the "no fact" person sees it as a conceptual/conventional boundary. This *is* a substantive disagreement, but in metaphysics/philosophy of mind, not pure neuroscience.
      *   **Lockstep Case:** This perfectly isolates the clash between **Hardware Pluralism** (2 substrates = 2 SoEs, regardless of content) and **Phenomenal Monism** (identical, unified content = 1 SoE, regardless of substrate). There is no empirical fact that can settle *which criterion is the right one for counting SoEs*; it's a conceptual choice about definition.

  **What Counts as Progress:**

  1.  **Adopt the Distinction:** **This is the single most crucial step.** Explicitly separate the three questions *in every discussion*:
      *   **Q1 (Co-consciousness Unit):** Is there a single, unified phenomenal field at time T? Or are there two (or more) distinct, simultaneous fields?
      *   **Q2 (Access Unit):** Is there a single executive system controlling global access for report/action? Or are there two (or more) independent or competing access systems?
      *   **Q3 (Persisting Subject):** Does the pre-split person persist? Are there two new persons? Is there one person with a fragmented history?
      *   **Progress:** Frame *every* argument and piece of data in terms of which question(s) it speaks to. Stop using "subject of experience" undifferentiated. Say "co-consciousness unit," "access unit," "persisting subject."

  2.  **Clarify Criteria for Each:**
      *   **Q1:** What constitutes evidence *for or against* phenomenal unity? (Behavioral conflict? Neural independence? Self-report limitations?) Accept that *direct* evidence is currently impossible. Focus on the best *inferences*.
      *   **Q2:** Define "access unit." Is it control of verbal report? Control of either hand? Initiation of goal-directed action? Is shared, conflicted, or alternating control evidence for one or two units?
      *   **Q3:** Engage with philosophical literature on personal identity (psychological continuity, narrative self, brain criterion). Acknowledge this is the most metaphysical and least empirically tractable question.

  3.  **Map the Disagreements:** Chart where each lab member stands on each distinct question and their criteria. This reveals if the core disagreement is about (a) the empirical facts relevant to a specific question, (b) the criteria for answering that question, or (c) the importance/significance of that question relative to the others.

  4.  **Formal Result / Philosophical Argument:** Engage with formal theories of consciousness (IIT, GWT, etc.) and vagueness/philosophy of mind. Acknowledge that:
      *   **Q1/Q2** *might* become empirically resolvable with vastly better tech (e.g., decoding phenomenal states from neural activity).
      *   **Q3** likely requires a *stipulative* or *pragmatic* solution (see below). An argument that Q3 is ill-posed outside of a specific metaphysical framework *is* progress.
      *   **Progress:** Develop or adopt a formal model (e.g., based on information integration, dynamics) that makes specific predictions for Q1/Q2 under different delay/lockstep scenarios. Argue forcefully that Q3 requires a different kind of resolution.

  **Does it Matter Outside the Seminar Room?** (Confidence: 80%)

  *   **Patients/Surgery:** **Minimal direct impact.** What matters clinically is functional outcome: seizure control, cognitive abilities, potential for conflict, rehabilitation strategies. Telling a patient "we are creating two conscious beings" is unhelpful and potentially harmful. Focus on observable consequences: "Your hands might sometimes act independently; we have strategies for that." The *Persistence Subject* (Q3) question is deeply personal but ultimately unanswerable scientifically; the patient's own narrative identity post-surgery is what matters most to *them*.
  *   **Responsibility:** **Potentially significant, but resolvable pragmatically.** If a left hand (RH) commits an act the speaking LH disavows, the *Access Unit* (Q2) is key. Can the RH initiate complex, intentional actions independently? If evidence shows it can (e.g., following complex commands only presented to the LVF), this supports diminished responsibility *for that specific action*, regardless of Q1 or Q3. The law deals with "the person" (generally the persisting legal entity - Q3 pragmatically defined) but can recognize dissociated states (sleepwalking, DID). Legal responsibility would likely focus on the *Access Unit* controlling the action and the *Persisting Subject*'s overall capacity/culpability.

  **Confidence & What Would Move Me:**

  *   **Conceptual Diagnosis (90%):** Extremely high confidence. The impasse pattern, the reliance on "depends what you mean," and the tie-breaking cases are classic signs of conceptual conflation. **Move me:** A convincing argument that a single, unambiguous, and empirically measurable definition of "subject of experience" exists and resolves all data/cases cleanly (I see no path to this).
  *   **Inadequacy of Current Empiricism for Q1/Q2 (75%):** High confidence tools are insufficient *now*. **Move me:** Development of a validated, non-invasive technology that directly measures or infers the presence/absence of distinct phenomenal fields with high reliability.
  *   **Q3 as Metaphysical/Ill-Posed (85%):** High confidence. Persistence questions inherently involve narrative, value, and convention. **Move me:** A rigorous philosophical argument demonstrating a non-arbitrary, empirically verifiable criterion for personal identity that cleanly handles fission cases (like splits) and is widely accepted (unlikely).
  *   **Practical Advice/Ethics (80%):** Confident the focus should be on function and pragmatism. **Move me:** Clear evidence that adopting a specific metaphysical stance (e.g., "two persons") demonstrably leads to *better* clinical outcomes or fairer legal judgments than a pragmatic approach.

  **The Prescription:** At your next meeting, **start by banning the phrase "subject of experience" entirely.** Force the discussion onto your Q1, Q2, Q3 framework using the specific terms. Demand that every argument and piece of data be mapped to one (or more) of these questions and explain *how* it supports a particular answer *to that specific question*. This won't magically create consensus, but it will expose the *real* sources of disagreement (empirical inference? criteria choice? question priority?) and make productive movement possible. If consensus on Q3 proves impossible, explicitly agree to *stipulate* a pragmatic definition for the purposes of your research (e.g., "We will refer to the 'person' as the enduring legal/biological entity, and discuss 'processing streams' or 'access systems' for Q1/Q2"). This allows you to move forward on tractable questions.
