prompt: |-
  Hey — I need a teaching plan here, not an explanation of the topic itself. Context: I'm a third-year PhD student and I'm TAing the Freedom and Responsibility module again, and I've got one 60-minute section next Thursday with about a dozen first-years, a whiteboard, no slides, and a bit of a cold, so ideally something that doesn't require me to talk straight through the hour. In Monday's lecture they were given the principle of alternative possibilities — roughly, you're morally responsible for what you did only if you could have done otherwise — and they were assigned the classic Frankfurt case, the one where the intervener would have stepped in if the agent had started to show some prior sign of deciding differently, but never actually does anything. Last year this exact section went badly: half the room left saying so Frankfurt is just a determinist with extra machinery, the other half said the case is cheating because the guy is obviously being controlled, and nobody could tell me what the case was even supposed to be an argument against. So plan the hour for me.

  Concretely, what I want: what has to be on the board before the case can do any work at all — is PAP best sold to them as an explanation of why blame is fair, or just as a necessary condition on it, and does the gap between could-have-done-otherwise as a bare counterfactual and could-have-done-otherwise as a genuine ability (something the agent has access to, something robust) need to be in place first? Why does the case land differently depending on which of those is up? Then the order of the pieces and what depends on what. And I want one case to carry the whole session, and I'd rather not just re-run the one from the reading: so tell me what the carrying example has to have (a reliable prior sign, an intervener who never fires, a decision that is genuinely the agent's own) and what it must not have (a threat, a gun, a coercive offer, anything that reads as the agent being pushed rather than bypassed), and why each of those features or absences matters.

  Relatedly, I've been playing with two variants of my own and can't decide whether either belongs in the hour. Call the first the leaky intervener: the device works only most of the time, so if the agent had tried to do otherwise he'd have had, say, a forty percent chance of actually getting away with it — nothing forces the outcome, there's just no guarantee. Call the second the output-only case: the device leaves the deciding and the willing completely untouched and only redirects the bodily movement at the very last moment, so the agent really does decide and try to do otherwise and simply doesn't get there. Is either of these pedagogically useful, or do they just muddy the water? If one is worth using, where exactly does it go in the sequence and what is it supposed to make them notice — that PAP needs a robust alternative rather than any alternative at all, that the alternative has to be an alternative willing rather than an alternative outcome, both, or something I haven't thought of?

  Then the failure modes, which is the part I care most about. I can guess at a few: that this is determinism in disguise; that the device causes the action despite doing nothing; that the agent could still have willed or tried otherwise, or at least could have failed to show the sign; that Frankfurt just helps himself to the intuition that the agent is responsible, so the case begs the question; and, from the one physics student who'll definitely be there, whether an infallible prior sign is even physically possible and whether it matters if it isnt. Which of these will actually come up, in what order will they come up, and at which point in the sequence should I head each one off rather than answer it? Which single one should I deliberately let hang for a bit? I also want one question to end on that tells me whether they've grasped the structure of the dialectic rather than just whether they've been persuaded, plus an explicit list of what I should openly refuse to get into at this level — reasons-responsiveness, the actual-sequence stuff, the whole secondary literature on whether the case succeeds — and how to say no without sounding like I'm dodging.
reasoning: |-
  Alright, let me try to unpack what this PhD student is asking for. They need a teaching plan for a 60-minute session on Frankfurt cases, targeting first-year students. Last year didn't go well, so they want to avoid the same pitfalls. 

  First, the key issues from last year: students either saw Frankfurt as determinism in disguise or thought the agent was controlled. Others missed the argument's target entirely. So the plan must clarify PAP, the Frankfurt counterexample, and preempt misunderstandings.

  The user wants to know what must be on the board before diving in. They're debating whether to present PAP as explaining blame's fairness or as a necessary condition. Also, the distinction between counterfactual "could have done otherwise" and robust ability. The example needs specific features—reliable prior sign, non-firing intervener, genuine decision—and avoid coercion. 

  They’ve proposed two variants: leaky intervener (40% success chance) and output-only (movement redirected post-decision). Are these useful? The main goal is to prevent failure modes: determinism confusion, hidden causation, begging the question, physical possibility of prior signs. 

  The user needs a structured sequence: start with PAP, then Frankfurt, address objections. Prioritize clarifying PAP’s role and the robust ability gap. Use the leaky case to show PAP needs robust alternatives, maybe after Frankfurt. Avoid output-only as it distracts. 

  Anticipate objections: determinism disguise (clarify preemptive vs. causal), hidden causation (stress intervener’s inactivity), prior sign possibility (bracket physics). Let the "begging the question" objection hang for discussion. End with a diagnostic question about PAP's necessity. Refuse to dive into reasons-responsiveness or secondary lit. 

  Need a clear flow: PAP setup, Frankfurt dissection, leaky to show robust ability, objections handled strategically. Keep students active with board work and partner discussions to save the TA's voice. Highlight dialectic structure: PAP’s necessity challenged by Frankfurt, leading to compatibilism.
answer: |-
  Here’s a battle-tested 60-minute plan designed to preempt last year’s failures, using **one core Frankfurt case** with strategic variants. Prioritizes student activity, board work, and targeted silence to conserve your voice.

  ---

  ### **Pre-Board Setup (Before Class)**
  *   *Left Side:* "**PAP**: Moral responsibility requires **could have done otherwise** (CHDO)."
  *   *Right Side:* "**Frankfurt's Goal**: Challenge PAP as **necessary** for responsibility."
  *   *Bottom:* "Today's Q: Does **responsibility** *always* need CHDO?"

  ---

  ### **The Plan: 60 Mins**

  1.  **Ground PAP (10 mins - Student Brainstorm)**
      *   **Task:** "You read PAP. Why might someone think blame/praise is *unfair* without CHDO? Shout examples." (e.g., "Blamed for something forced!" "No choice!"). *Board their core intuitions under PAP.*
      *   **Crucial Move:** Frame PAP *only* as **necessary condition**: "PAP says: NO CHDO → NO RESPONSIBILITY. Does responsibility *require* this 'escape hatch'? Frankfurt says no."
      *   **WHY:** Avoids getting bogged down in *how* PAP explains fairness; focuses on necessity. Preempts "it's determinism!" by not yet linking PAP to free will.

  2.  **Introduce & Dissect the Core Case (15 mins - Board + Partner Talk)**
      *   **Use YOUR Pedagogical Case:** "**The Surgeon & Simon**"
          *   *Simon* is a brilliant, ambitious surgeon known for ruthless careerism.
          *   *Jones* implants a device monitoring Simon's unique pre-decision stress spike (reliable prior sign). If spike occurs, device forces Simon to perform life-saving surgery on a rival.
          *   Simon *wants* the rival dead. He coolly decides *not* to operate, shows **no stress spike**, device **never activates**. Rival dies.
      *   **Board Case Key Features:**  
          `Agent: Simon (Decisive, Selfish)`  
          `Intervener: Jones (Device)`  
          `Prior Sign: Unique Stress Spike (Reliable)`  
          `Intervention: Forces Surgery (If Sign)`  
          `Actual Sequence: **No Sign → No Activation → Simon lets rival die**`
      *   **Partner Talk (3 mins):** "Is Simon morally responsible? *Why/Why not?* Focus on what *actually happened*." *Listen in.*
      *   **Class Vote + Quick Reasons:** "Responsible? Raise hands." Board tally. "Why responsible? Why not?" *Note key intuitions.*

  3.  **Leverage the Leaky Variant (10 mins - Contrast)**
      *   **Modify the Case:** "Change ONE thing: The device fails 40% of the time. If stress spike occurs, Simon has a 40% chance his *own* decision still wins out."
      *   **Partner Talk (2 mins):** "Does *this* change whether Simon is responsible? Why?"
      *   **Crucial Question:** "In the leaky case, *could* Simon have done otherwise? (*Yes*, sometimes! 40% chance if he tried). In the *original* Frankfurt case, *could* Simon have done otherwise? (*No*, device would have stopped him)."
      *   **BOARD:**  
          `Leaky: CHDO? YES (Non-Robust)`  
          `Frankfurt: CHDO? NO`
      *   **Key Insight:** "If PAP requires *any* CHDO (even fluky, non-robust), Simon *isn't* responsible in Leaky either? But does that match your intuition? Frankfurt's point: PAP needs **robust** CHDO (real ability/access). But *even without ANY robust CHDO* (like original case), many still hold Simon responsible. PAP (as necessity) seems false."

  4.  **Target Failure Modes Head-On (15 mins - Guided Q&A)**
      *   **Anticipate & Preempt:**
          *   *"This is just determinism!"*: "Did the device *cause* Simon's decision? (**No!** Simon decided freely, device did nothing). Determinism says prior causes *necessitate* the outcome. Here, the device *waits* – it doesn't cause Simon's choice, it *preempts* alternatives. Different structure."
          *   *"He was controlled!"*: "What actually controlled Simon's decision? (**His own desires!** Device monitored, didn't influence *the choice itself*). Control would be if the device *made* him decide. It didn't. It only blocked alternatives *after* his decision started forming."
          *   *"He could have shown the sign!"*: "Is *showing the sign* the same as *deciding to save the rival*? (**No!** The sign is a reliable *indicator* of a *different decision emerging*. Simon didn't *want* to save the rival, so no sign appeared. He couldn't 'decide to show the sign' without *starting to decide differently*)."
          *   *"Infallible sign is impossible!"* (Physics student): "**Bracket that!** Grant Frankfurt the *conceivability* for argument's sake. Does the *logic* work? *If* such a sign existed, does the case challenge PAP's necessity? That's the philosophical point." (*Write: "Metaphysical Conceivability vs. Physical Possibility - Bracket Physics!"*)
      *   **Let This Hang:** *"Frankfurt just assumes responsibility, so it begs the question!"* Acknowledge: "That's a deep criticism! **Let's hold that thought.** We'll come back to it at the end."

  5.  **Closure & Dialectic Check (10 mins)**
      *   **Return to Board:** Circle PAP & Frankfurt's Goal. "What did Frankfurt *try* to show? (PAP isn't necessary). What was his tool? (A case with no CHDO but seemingly responsible agent)."
      *   **The Hanging Question:** "Back to the challenge: Does Frankfurt *assume* responsibility without argument? Is the case question-begging? **Partner Talk (2 mins):** Is the intuition that Simon is responsible *strong enough independently* to challenge PAP, or does it *presume* PAP is false?"
      *   **Ending Diagnostic Question:** "**Regardless of whether you agree Frankfurt succeeds**, what is the *dialectical purpose* of his case? What is he forcing PAP defenders to do?" *(Target Answer: Defenders must either 1) Deny Simon is responsible (counterintuitive), or 2) Argue Simon *did* have CHDO somehow (hard), or 3) Reject the case's coherence (e.g., prior sign impossible/begging).)*
      *   **Explicit Boundaries:** "For *this session*, we **don't** dive into: How *else* we ground responsibility (reasons-responsiveness), complex 'actual sequence' views, or debates over whether Frankfurt *ultimately* succeeds. We focus on **the structure of the counterexample challenge to PAP's necessity**."

  ---

  ### **Why This Works**

  *   **PAP Framing:** Treating it solely as a **necessary condition** avoids debates about sufficiency or "fairness mechanics," keeping focus tight.
  *   **Core Case Design (Surgeon & Simon):**
      *   *Avoids Pushiness:* No threat/gun/offer. Simon acts *from his own desires*.
      *   *Clear Bypass:* Intervention targets *output* (forcing surgery) only if triggered by a sign of *internal decision shift*. Highlights the actual sequence is untouched.
      *   *High-Stakes Intuition:* Easy to intuit Simon is blameworthy.
  *   **Leaky Variant's Role:** **Crucial.** Shows PAP defenders need *robust* CHDO. Makes the gap between *any* CHDO and *robust* CHDO visible. Reveals that Frankfurt denies even *robust* CHDO is necessary.
  *   **Output-Only Excluded:** Muddy! It risks conflating responsibility for *trying* vs. *outcome*. Avoids "he tried otherwise!" distractions. Saves time.
  *   **Failure Mode Management:**
      *   *Preempted:* Determinism confusion ("preemption, not causation"), control ("device didn't influence *decision*"), sign equivocation ("sign ≠ decision").
      *   *Bracketed:* Physics of the sign ("conceivability suffices for logic").
      *   *Leveraged:* "Begging the question?" becomes the **provocative hanging question** driving the dialectic check.
  *   **Ending Diagnostic:** Tests grasp of the *dialectical move*, not agreement.
  *   **Student Activity:** Partner talks (voice-saving), voting, board work. You facilitate, don't lecture.
  *   **Boundaries Clear:** Shuts down scope creep firmly by naming excluded topics upfront.

  **Go in with the board pre-set, wield your markers, and let *them* articulate the tensions. Good luck!**
