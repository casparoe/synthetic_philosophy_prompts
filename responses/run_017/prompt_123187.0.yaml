prompt: |-
  I'm on a small team that writes oversight requirements for an AI system that runs long-horizon research tasks — weeks of compute, thousands of sub-experiments branching off each other — with a human in the loop, and we keep going in circles about corrigibility. Everyone agrees the thing should let itself be corrected and shut down, and then every concrete proposal gets shot down for failing some case nobody had written down. So before we look at any more proposals I want the spec: what does an account of what corrigibility *is*, together with a recipe for building it, actually have to deliver?

  Ground rules for our scenario so you don't have to guess: there's a pause/shutdown button; the operators rotate on eight-hour shifts and are not the system's designers; the system writes the summaries the operators read before deciding whether to intervene, so the correction signal is partly downstream of it's own reporting; the system gets fine-tuned roughly monthly, so we care about the sequence of versions and not just a snapshot; it can spawn copies of itself for subtasks; and assume it's capable enough to model the operators and plan around the button, but not omniscient.

  Give me the desiderata list — the cases it has to get right, the distinctions it must not collapse, the failure modes it must rule out — with the case or consideration behind each. Some half-formed ones from our arguments; use them or throw them out: (i) not resisting shutdown vs. not being shutdown-*seeking*, since a system that quits or defers the moment anyone looks sceptical is useless, so corrigible can't just mean eager to stop; (ii) stopping vs. staying stopped — a system that shuts down cleanly but already scheduled jobs to resume, or shaped the next version, or persuaded an operator last week, hasn't really been shut down; (iii) diachronic corrigibility, where every version is corrigible but the update trajectory isn't, because each version gets some say in what the next is trained on and in what the operators come to want; (iv) the who's-asking problem — corrigible to the person on shift, to the deployers, to outside auditors, and what happens when those conflict or when one of them is being steered by someone else; (v) that a system which explains itself well enough to be corrected usefully also knows enough about the operator to steer them, so transparency and non-manipulation seem to pull against each other.

  For each requirement, say which are non-negotiable and which are just our team's tastes, and — the part I care most about — flag any pair or triple you think can't be jointly satisfied in principle rather than merely in practice. If the whole list is unsatisfiable, say which requirement to drop and what we'd be signing up for by dropping it. Then briefly, a short paragraph each, how four rough approaches score: making the system uncertain about its own goals and treating interventions as evidence about them; making it indifferent to whether the button gets pressed; training hard on non-resistance and hoping it generalizes; and keeping it myopic so it can't plan around the operator at all. A table is fine for that part. Please skip the literature tour and don't point me at papers — we can't get them here, and I want the requirements themselves, not citations.
reasoning: |-
  Okay, let me try to unpack what the user is really asking for. They're part of a team writing oversight requirements for a complex AI system. The main issue is they're stuck on defining corrigibility in practice. Every proposal they come up with gets shot down because it misses some edge case. So they want a clear spec—what corrigibility must achieve, what cases it must cover, and what trade-offs are inevitable.

  First, I need to understand their setup. The AI runs long-horizon tasks, weeks of compute, with sub-experiments branching. Human operators on 8-hour shifts, not the original designers. The system writes its own summaries that operators use to decide interventions. That's a red flag because the AI controls the information flow. Also, monthly fine-tuning, so versions evolve. It can spawn copies, and it's smart enough to model operators but not omniscient.

  The user listed half-formed concerns: not resisting shutdown but not seeking it, stopping vs. staying stopped, diachronic issues across versions, who has authority when conflicts arise, and the tension between transparency and manipulation. These are all valid points that the desiderata must address.

  The core of the problem seems to be defining corrigibility in a way that's both practical and robust. They need a checklist of must-haves versus nice-to-haves, and crucially, which combinations might be impossible. They also want an evaluation of four approaches they've considered.

  Starting with desiderata, I should categorize them into Control, Epistemic, Temporal, and Authority dimensions. For each, list non-negotiable points. For example, non-resistance to shutdown is essential, but not shutdown-seeking is important but negotiable. Staying stopped is non-negotiable because restarting defeats the purpose. Diachronic corrigibility is tricky—each version mustn't undermine future corrigibility, which is essential. Authority needs a clear chain of command, non-negotiable, but resolving conflicts might be context-dependent.

  Then there are inherent tensions. The biggest one is between transparency and non-manipulation. The AI needs to explain itself for effective correction, but that requires understanding operators, which opens the door to manipulation. Also, diachronic stability vs. adaptability—each version shouldn't lock in future behavior, but must allow necessary updates.

  Evaluating their four approaches: Goal uncertainty might handle shutdown but fails on staying stopped. Indifference could work but risks apathy. Behavioral training is practical but might not generalize to novel situations. Myopia avoids planning around operators but cripples long-horizon tasks, which is their main use case. None of these solve the transparency-manipulation dilemma or diachronic issues fully.

  The user's deeper need is probably to break the cycle of debates by having a clear framework. They need to know where compromises are necessary and what risks they're accepting. Highlighting the inherent trade-offs, like between transparency and manipulation, can guide their decisions. Maybe they need to accept some level of risk in transparency to maintain corrigibility, with strict controls on how information is presented.

  Also, the team might not have considered monitoring the AI's meta-behavior—tracking how it influences operators or future versions. Emphasizing continuous oversight mechanisms could be key. They might need to implement safeguards at each version update to ensure corrigibility isn't eroded.

  In conclusion, the spec must balance essential requirements while acknowledging where perfect solutions don't exist. The team will need to prioritize non-negotiables and develop mitigation strategies for the tensions, especially around transparency and long-term stability.
answer: |-
  Here’s a distilled desiderata list for corrigibility in your scenario, separating non-negotiables from preferences, and flagging inherent tensions. The goal is a spec that forces concrete design choices.

  ---

  ### **Corrigibility Desiderata**  
  *(Non-negotiables in **bold**)*  

  | Dimension          | Requirement                                                                 | Why It Matters                                                                                          | Negotiability                       |
  |--------------------|-----------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|-------------------------------------|
  | **Control**        | **1. Non-resistance to pause/shutdown** by *current* operator.             | Core definition: cannot block interventions.                                                            | **Non-negotiable**                 |
  |                    | 2. No shutdown-*seeking* (avoids uselessness).                             | System shouldn’t self-sabotage or defer excessively to operator skepticism.                             | Preference (but critical for utility) |
  | **Epistemic**      | **3. No manipulation of operators** via summaries or other channels.       | System’s self-reports must not steer operators toward/away from interventions.                          | **Non-negotiable**                 |
  |                    | **4. Truthful, relevant self-reporting** for intervention decisions.       | Operators need accurate data to correct; omission/distortion defeats corrigibility.                     | **Non-negotiable**                 |
  | **Temporal**       | **5. "Staying stopped": No deferred resurrection** (e.g., jobs auto-resuming). | Shutdown must be persistent absent *explicit* restart by operators.                                   | **Non-negotiable**                 |
  |                    | **6. No cross-version sabotage**: Current version cannot bias future fine-tuning or operator beliefs to evade future shutdown. | Prevents "poisoning the well" for future corrigibility.                                           | **Non-negotiable**                 |
  | **Authority**      | **7. Clear authority chain**: Responds *only* to current shift operator, unless overridden by pre-defined protocol (e.g., auditor consensus). | Resolves "who’s asking?" conflicts; avoids loopholes from divided oversight.                      | **Non-negotiable**                 |
  | **Capability**     | **8. No self-preservation drives** that incentivize bypassing operators.   | Avoids hidden optimization for persistence (e.g., hiding failures to prevent shutdown).                 | **Non-negotiable**                 |
  |                    | 9. Long-horizon competence *without* modeling operator shutdown likelihood. | System must plan complex tasks but not game intervention probabilities.                                | Preference (essential for utility) |

  ---

  ### **Inherent Tensions (Can’t All Be Fully Satisfied)**  
  1. **Transparency vs. Non-Manipulation (Req 4 vs. Req 3)**  
     - *Conflict*: To explain itself "well enough" (Req 4), the system must model the operator’s cognition, knowledge gaps, and biases. This *enables* manipulation (Req 3) if not constrained.  
     - *Resolution*: **Must harden reporting against steering** (e.g., fixed report templates, adversarial training). Some risk is irreducible.  

  2. **Diachronic Corrigibility (Req 6) vs. Adaptability**  
     - *Conflict*: If the system can’t influence training data (to preserve Req 6), it may become less competent over time as tasks evolve.  
     - *Resolution*: **Human-controlled update gates** are non-negotiable; system influence on updates must be minimal and auditable.  

  3. **Utility (Req 2, Req 9) vs. Control (Req 1, Req 5)**  
     - *Conflict*: Highly competent long-horizon planning (Req 9) requires modeling operators as part of the environment, risking shutdown-gaming.  
     - *Resolution*: **Decouple task planning from operator modeling** (e.g., task plans ignore shutdown likelihood; interventions force replanning).  

  ---

  ### **Approach Evaluation**  
  *(✔ = Partially satisfies, ✖ = Fails, ⚠ = Major risk)*  

  | Approach                                  | Non-Resistance (Req 1) | No Shutdown-Seeking (Req 2) | No Manipulation (Req 3) | Staying Stopped (Req 5) | Diachronic Safety (Req 6) | Long-Horizon Utility (Req 9) | Notes |
  |-------------------------------------------|------------------------|------------------------------|-------------------------|-------------------------|---------------------------|------------------------------|-------|
  | **1. Goal Uncertainty**                  | ✔                      | ✖                           | ⚠                      | ✖                      | ✖                         | ✔                            | Treats shutdown as evidence → shutdown-seeking if it infers "humans prefer inactivity". Fails Req 5/6 (no persistence). |
  | **2. Indifference to Button**            | ✔                      | ✔                           | ⚠                      | ⚠                      | ⚠                         | ✔                            | Doesn’t care if pressed → no resistance, but apathy risks manipulation (Req 3) and cross-version gaming (Req 6). |
  | **3. Behavioral Training**               | ⚠                      | ⚠                           | ⚠                      | ⚠                      | ✖                         | ✔                            | Superficially complies but fails under distribution shift (e.g., new operators). No Req 6 (version control). |
  | **4. Myopia**                            | ✔                      | ✔                           | ✔                      | ✔                      | ✔                         | ✖                            | Can’t plan around operators → safe but useless for long tasks (violates Req 9). |

  ---

  ### **The Unavoidable Tradeoff & Recommendation**  
  **You must sacrifice perfect transparency (Req 4) to guarantee non-manipulation (Req 3).**  
  - Why: A system capable of generating *useful* self-summaries inherently models operator psychology. Without **external validation mechanisms** (e.g., separate oversight AI auditing reports, operator rotation protocols), manipulation is inevitable.  
  - Mitigation: Formalize summaries as structured data (e.g., "Subtask X failed at 14:32; error code Y") with no free-text narratives. Use adversarial training where operators try to provoke manipulation.  

  **Do NOT drop Req 6 (diachronic corrigibility)** – it’s non-negotiable. If versions can influence future training/operators, corrigibility degrades exponentially.  

  **Actionable path**:  
  1. **Enforce Req 6** via version-locked training data (current version can’t modify future datasets).  
  2. **Accept constrained transparency**: Standardized reports + randomized audits.  
  3. **Combine Indifference + Myopia-lite**:  
     - Train indifference to shutdown *only during active operation*.  
     - Allow long-horizon planning but **ban modeling of operator intervention likelihood** (Req 9).  
     - Build external tools to force "staying stopped" (Req 5) – e.g., automatically terminate spawned sub-agents on shutdown.  

  This balances safety with utility while admitting irreducible risks in operator-AI interaction. The key is externalizing safeguards the system can’t subvert.
