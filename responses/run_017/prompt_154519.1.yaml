  ### Grading Assessment for Candidate 17  

  **Overall Mark: 16/30**  
  - **(a): 8/10** — Clear distinction between claims; strong defense of Understanding Claim, but undersells residual work.  
  - **(b): 5/10** — Correctly applies RC but misapplies sensitivity (not necessary for knowledge); inconsistent on action.  
  - **(c): 3/10** — Superficial treatment; collapses key epistemic distinctions; fails to engage asymmetry’s core.  

  ---

  ### Line-by-Line Comments  
  **(a)**  
  - *"The first [Transmission Claim] is not credible... That consequence is unacceptable."*  
    **Credit (3/10):** Strong rejection of Transmission Claim. Correctly notes that moral knowledge must be widely possible via testimony, unlike Transmission Claim’s implications.  
  - *"What work does the Understanding Claim still have to do? It has to show that this missing understanding... unjustified and so not knowledge after all."*  
    **Minor reservation (2/10):** Correctly identifies the burden (showing understanding is epistemically necessary) but omits that *moral robustness* (via RC) might be the asymmetry’s anchor, not justification/knowledge. Needs to specify why understanding is distinctively epistemic *in morality*.  
  - *"it is not obvious that understanding is the kind of thing knowledge can require."*  
    **Credit (3/10):** Astute caveat. Highlights the UC’s vulnerability: if understanding isn’t epistemic, asymmetry collapses.  

  **(b)**  
  - *"Nadia fails RC... Her belief is therefore not morally robust."*  
    **Credit (2/10):** Correct application of RC to the case. Robustness requires counterfactual independence.  
  - *"Her belief tracks her colleague's utterance... is not sensitive to those facts... not knowledge."*  
    **Substantive error (0/10):** **Sensitivity is not a condition for knowledge** (e.g., lottery paradox). Beliefs via reliable testimony (e.g., "Hastings was in 1066") are knowledge *without* sensitivity to facts. Collapses transmission/epistemic status vs. robustness.  
  - *"She certainly does the right thing... I am inclined to say she acts well but not from understanding."*  
    **Minor reservation (2/10):** Correctly separates right action from right reasons but wavers. Should note RC defines "right reasons" as *robust* commitment (would act even if informant recants), which Nadia lacks.  
  - *"The case therefore gives some support to the asymmetry... Nadia’s action is not obviously defective."*  
    **Substantive error (1/10):** Contradicts earlier RC analysis. If asymmetry requires defective action/robustness, Nadia’s *action* isn’t defective (she acts correctly), but her *reasons* are (dependent). Fails to resolve tension.  

  **(c)**  
  - *"I think the objection succeeds... So there is nothing epistemically defective about moral deference either."*  
    **Substantive error (0/10):** Ignores the objection’s target: **asymmetry theorists concede non-moral testimony transmits knowledge** but argue moral deference lacks *robustness/understanding*. Equating domains collapses the UC/RC distinction.  
  - *"The natural explanation is that we hold agents responsible for their moral views... not an epistemic one."*  
    **Minor reservation (2/10):** Correctly identifies a non-epistemic difference but fails to engage whether robustness (RC) is *itself* epistemic (e.g., constitutive of moral knowledge).  
  - *"I will never in fact work through the published proof... The two cases are on a par."*  
    **Substantive error (1/10):** Misses the **in-principle accessibility** distinction: Math/history evidence is publicly verifiable *independent of the testifier*; moral reasons require first-personal grasp. UC argues this affects understanding/knowledge conditions.  

  ---

  ### Strongest Move  
  - **Part (a) rejection of Transmission Claim (8/10):** Forcefully demonstrates its implausibility given social acquisition of moral beliefs. Grounded in real-world epistemic practices.  

  ### Weakest Inference  
  - **Part (b) sensitivity argument (0/10):** Treats sensitivity as necessary for knowledge, which is false and undermines the entire knowledge denial. Confuses reliability with robustness.  

  ---

  ### How to Achieve Full Marks  
  1. **Consistently uphold distinctions:** Do not let "knowledge" arguments in (b) collapse into robustness/RC criteria.  
  2. **Defend UC’s epistemic burden:** In (a), explain why *moral* understanding might be uniquely constitutive of justification/knowledge (e.g., via RC’s necessity for non-alienated belief).  
  3. **Engage the objection’s core:** In (c), argue that non-moral domains allow "detached" knowledge (accessible reasons suffice), while moral knowledge requires *personal grasp* (RC failure shows deficit).  
  4. **Resolve tensions:** In (b), reconcile Nadia’s "right action" with asymmetry by showing RC exposes defective *reasons* (not action) as the epistemic flaw.  

  ---  
  **Final Note:** Candidate grasps surface distinctions but lapses into conflations (e.g., sensitivity for knowledge, robustness for action quality). To excel, they must anchor analysis to RC’s *necessity condition* and defend why morality uniquely demands robustness for knowledge/justification.
