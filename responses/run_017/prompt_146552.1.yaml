  First, I need to map their reconstruction's core: shifting from causal explanations to flexible-response functional profiles and counterfactual fragility. The empirical wager about divergence ranking seems especially vulnerable. The audience composition is critical—five distinct adversarial perspectives plus a wild-card grad student. 

  For the realist's companions-in-guilt objection, I recall they've published on this. Their move will be that debunking morality should equally undermine math/epistemology. The user's audit asymmetry reply (external checks in math/epistemology vs moral circularity) is clever but has a seam: could "downstream success" include social coordination? If so, that's a follow-up vulnerability. 

  The naturalist's Bayesian demand is predictable—they'll insist on likelihood comparisons. User must refuse abandoning their framework but can concede formalizing it later. Weakest seam: if the counterfactuals don't translate to probabilities, is this still an "argument"? 

  Experimental philosopher's sampling objection is deadly if unanswered. User should preempt it by admitting WEIRD data limitations during their talk—this can't wait for Q&A. The divergence ranking's cross-cultural predictions become hollow otherwise. 

  Philosopher of biology will pounce on adaptationist just-so storytelling. User's "falsifiability" claim is their shield here, but specifying the trait's evolutionary level (individual? group?) is the trap. Must refuse committing to one level—the flexible-response model works either way. 

  Grad student's global-debunking worry is that all domains crumble if morality does. The "domain-specificity" reply risks circularity: why is morality uniquely vulnerable? The seam is whether social coordination pressures could debunk other normative domains. 

  Most dangerous unasked question: "If moral verdicts track ecological variation, doesn't that make them *more* reliable for local functions—undermining debunking?" This reframes fragility as functionality, flipping the user's premise. 

  First 90 seconds of Q&A strategy: thank questioners, restate the selector's trilemma to control framing, then invite the naturalist first (their objection is medium-damage but lets user demonstrate rigor). Save the realist for later—their objection does most damage if not perfectly defused. 

  User's tone request matters—they'll read this on their phone pre-talk, so prose must flow like advice from a colleague. No markdown, just cohesive narrative pacing. I'll structure it as: opening stakes, each critic's objection/reply/seam, then Q&A tactics. The "dangerous question" gets its own buildup for emphasis.
answer: |-
  Here is your preparation sheet, structured as requested. Read it as a unified advisory letter focusing on the likely battlefield of your Q&A. 

  The objections will likely arrive in this sequence, ordered by both probability and escalating damage: first the naturalist's methodological challenge (annoying but containable), then the experimental philosopher's sampling critique (potentially corrosive if mishandled), followed by the philosopher of biology's adaptationism probe (technically sharp but navigable), then the companions-in-guilt broadside from the realist (high-stakes, threatens the whole project), and finally the grad student's globalization worry (conceptually deep but less lethal). Expect interjections, but this sequence reflects their intellectual proximity to your empirical wager and core argument. The most dangerous objection—the one you hope remains unasked—lurks in the realism debate’s foundations.

  **First 90 seconds strategy**: Before taking questions, briefly restate your core innovation: "Just to frame Q&A, my aim was to move debunking beyond causal inertness to *counterfactual fragility under flexible-response selection*. The trilemma—deny, accept coincidence, or retreat—is where I think realism buckles. Questions on that move, or my empirical divergence ranking, are especially welcome." This preemptively centers the discussion on your terms and signals readiness for technical pushback. 

  **Inside the talk concession**: When presenting your divergence ranking, explicitly concede: "My prediction hinges on *relative* stability across domains, not absolute universals. I grant the empirical base skews WEIRD; if future work shows harm/reciprocity judgments vary as wildly as purity under ecological shifts, my wager fails." This disarms the sampling objection’s teeth before Q&A. 

  ---

  **Objection 1 (Moral Naturalist)**  
  *Their phrasing*: "This is clever, but if it’s not a likelihood comparison—P(beliefs | realism) vs. P(beliefs | flexible-response)—then it’s just intuition mongering. Bayesianism forces clarity: what probabilities do your counterfactuals assign? Without that, you haven’t given an *argument*, just a story."  
  *Concede*: That Bayesian formulations are useful tools for precision.  
  *Refuse*: That debunking arguments *must* be Bayesian to be valid.  
  *2-minute reply*: "Bayesianism is one framework, not the tribunal. My counterfactuals show that realism cannot explain *why* our beliefs align with facts *only* under actual selective pressures. If the facts are necessary, why do flexible-response models predict systematic belief shifts under plausible perturbations? Likelihoods capture actual evidence; fragility reveals modal vulnerability. Realism predicts robustness—it doesn’t have it."  
  *Weakest seam*: "But without probabilities, how do we weigh ‘systematic shifts’? Isn’t this just intuition?" A sharp follow-up could press you to quantify fragility’s epistemic weight.  

  **Objection 2 (Experimental Philosopher)**  
  *Their phrasing*: "You keep saying ‘our moral beliefs,’ but your divergence ranking relies on data from societies with industrialized education, market integration, and low pathogen load. If the ‘stable’ harm domain is just Western harm intuitions, and your ‘labile’ purity domain collapses under caste systems or ritual pollution norms, your ranking is an artifact of sampling. Where’s the non-WEIRD evidence for *your* counterfactuals?"  
  *Concede*: That existing databases are imperfect and WEIRD-centric.  
  *Refuse*: That this invalidates the divergence hypothesis as a testable prediction.  
  *2-minute reply*: "The criticism is fair—but note my claim is *relational*: harm *more* stable than purity *if* environments vary in X, Y. This generates testable targets: does pathogen prevalence predict purity strictness *more* than harm aversion across diverse samples? If not, I lose. My model invites falsification in ways the standard causal story doesn’t. Use this to demand better cross-cultural work!"  
  *Weakest seam*: "But if stability itself varies culturally (e.g., harm prioritization in individualist vs. collectivist groups), doesn’t your ‘ranking’ presuppose a transcultural metric you’re debunking?" This could force you into circularity.  

  **Objection 3 (Philosopher of Biology)**  
  *Their phrasing*: "You posit moral judgment was ‘selected for flexible responsiveness’—but is that the trait? Selection on individuals for better coalitional bargaining? Group selection for norm internalization? Or is it a spandrel of theory of mind? Without specifying the unit and target of selection, and the evidence distinguishing adaptation from byproduct, your ‘functional profile’ is a just-so story with no more debunking force than ‘eyes see’ debunks realism about light."  
  *Concede*: That adaptationist claims require rigorous evidence.  
  *Refuse*: That the flexible-response model collapses without settling individual/group selection debates.  
  *2-minute reply*: "The model works at the *phenotypic level*: moral judgment *behaves as if* optimized for coordination under flux. Whether this arose via individual fitness (e.g., reputation management), cultural group selection, or as a byproduct doesn’t change the counterfactual predictions. If kinship density predicts authority intuitions, that’s evidence *for* the flexible-response logic, regardless of ultimate mechanism. My divergence ranking *is* the test for the ‘spandrel’ objection."  
  *Weakest seam*: "But if it’s a byproduct, doesn’t that *insulate* moral truth—like how math intuition being a byproduct doesn’t debunk numbers?" This links to the realist’s objection.  

  **Objection 4 (Moral Realist - Companions-in-Guilt)**  
  *Their phrasing*: "Your ‘audit asymmetry’ is ad hoc. Epistemic norms *also* lack ‘external checks’—coherentism says justification is holistic, with no foundation outside inference. Math’s ‘proof’ is internal too! And if you say predictive success justifies epistemology, why not say social stability justifies morality? If debunking works against morality, it annihilates all normative domains. Your argument self-destructs."  
  *Concede*: That epistemology and math face challenges.  
  *Refuse*: That the asymmetry collapses.  
  *2-minute reply*: "The asymmetry isn’t about foundations, but *error-correction*. Math: if a proof contradicts observable physics (e.g., bridge collapses), we revise the math. Epistemology: if induction consistently mispredicts, we abandon it. But morality? If a verdict causes social stability but violates your intuition, you don’t discard morality; you re-moralize. Moral judgment is its own only audit—that’s circular. Predictive success for norms is non-moral (e.g., cohesion); for epistemology, it’s constitutive (true belief *is* success). The parallel breaks."  
  *Weakest seam*: "Isn’t ‘social stability’ a non-moral success condition? If moral realism is true, shouldn’t *moral truth* cause stability? Then your circularity charge applies equally to epistemology!" A strong follow-up could force you into defining ‘success’ in question-begging ways.  

  **Objection 5 (Graduate Student - Global Debunking)**  
  *Their phrasing*: "If flexible-response debunking works against morality because selective pressures distort belief, why not extend it to religion? Or aesthetics? Or even science—after all, scientific reasoning was selected for adaptive modeling, not truth! If you confine it to morality, isn’t that special pleading?"  
  *Concede*: That domain-generality is a theoretical virtue.  
  *Refuse*: That debunking must be all-or-nothing.  
  *2-minute reply*: "The argument activates when (1) the faculty exhibits counterfactual fragility *and* (2) there’s no independent audit. Science has external checks: prediction, control, intersubjective verification. Religion often claims transcendent objects immune to empirical audit—but then debunking *may* apply! Morality uniquely combines *fragility* (per divergence ranking) with *self-auditing*. This targets domains where tracking truth isn’t the function. That’s morality-specific."  
  *Weakest seam*: "But doesn’t science rely on epistemic norms you just debunked?" This could loop back to the companions-in-guilt worry.  

  **The Dangerous Unasked Objection**  
  *Likely source*: The realist, late in Q&A.  
  *Why dangerous, not awkward*: It doesn’t challenge your model—it weaponizes it.  
  *Objection*: "Your ‘counterfactual fragility’ presupposes realism! If moral facts *are* contingent on ecology (e.g., harm wrongness depends on resource scarcity), then flexible-response isn’t distorting—it’s *tracking*! You’ve assumed non-naturalism to debunk it. But if naturalism is true, your fragility is just sensitivity to context. Your argument debunks *your own premise*."  
  *Why it’s lethal*: It forces you to either (a) admit your argument requires non-naturalism (alienating naturalists), or (b) argue that even natural moral facts couldn’t vary as fragility suggests—but naturalists *expect* variation. Your trilemma collapses if fragility is truth-tracking.  
  *If asked*: Stress that naturalism still requires alignment between belief and fact to be *robust* under modal variation, not path-dependent on selection. But this is your most vulnerable point—hope it stays buried.  

  End your replies by pivoting back to the selector’s trilemma: "However we refine this, the realist still faces deny/coincidence/retreat. That’s the progress." Good luck—your reconstruction is bold, and this audience will test it properly.  

  ---  
  *Final note*: The biologist and experimentalist might tag-team your empirical wager. If pressed, reiterate: "The divergence ranking isn’t my *premise*—it’s my *falsifiable commitment*. Attack it there; that’s where I’ve moved the goalposts." This reinforces your core innovation.
