prompt: |-
  for a democratic theory reading group I have to write my position on the boundary problem on one page and then have everyone else attack it, so here it is in bullets. tell me whether it hangs together.

  1. who belongs in the demos should be settled by the coercion test: you get a say over a decision just in case you're one of the people the state will coercively enforce that decision against. so not the "everyone whose interests are affected" test — that one is hopeless, since everything affects everything, and it ends up giving the whole planet a vote on my city's bus timetable.

  2. but I also think the boundary can't be fixed from the armchair in a way that binds anyone. in practice who counts has to be decided by the people already inside, by majority vote, and there's no court or philosopher standing above them to overrule it.

  3. felon disenfranchisement is unjust, including for people currently serving prison sentences.

  4. it's fine that citizens who've lived abroad for fifteen-plus years lose the vote, even when they still file taxes and could fly back whenever they like.

  5. states do have a real if qualified right to decide who gets to immigrate.

  6. local things should be decided locally: a city's zoning vote should be taken by that city's residents only.

  7. voting age sixteen, no lower. someone has to draw a bright line and that's where I'd put it.

  8. and no proxy votes for kids — one person one vote means one person one vote.

  here's what I want from you. I already suspect 1 and 5 are in trouble together, because the people the state turns away at the border are precisely people it's coercing, but I can't tell whether that's a real problem or just wordplay on "coerce". I also want to know whether 1 and 2 can both be true — if inclusion is a matter of basic justice, how can the current majority be the ones who decide it, given they could just vote out whichever group threatens them? and 6 feels like it's quietly sneaking back in the affected-interests test I rejected in 1.

  but don't just flag everything as in tension. rank the problems by how bad they actually are, tell me which pairs only look like they clash (3 and 4 feel wrong together but maybe they're fine and I just can't say why), point out any extra commitment I'm relying on without having written it down, and then say what the single cheapest revision would be and what it costs me. don't start by telling me which bullet I should give up — I want to see what you think forces what.
reasoning: |-
  Okay, let me tackle this user's query. They need to defend their position on the boundary problem for a democratic theory reading group. Their main points are outlined in eight bullets. The user is concerned about internal tensions, especially between points 1 and 5, 1 and 2, and whether point 6 contradicts point 1. They also want to know how severe each problem is and what revisions might help without sacrificing core ideas.

  First, I need to parse each bullet. Point 1 uses the coercion test for demos membership: you get a say if the state can coerce you. They reject the affected interests test as too broad. Point 2 says current insiders decide membership via majority vote, with no higher authority. Point 3 opposes felon disenfranchisement. Point 4 supports disenfranchising long-term expats. Point 5 affirms a state's right to control immigration. Point 6 advocates local decisions by locals. Point 7 sets voting age at 16. Point 8 rejects proxy votes for kids.

  The user's main worries are conflicts. Between 1 and 5: if the state coerces immigrants by denying entry, shouldn't they get a vote? But coercion here might mean enforcement of laws within the territory, not border control. That's a possible distinction. Then, 1 and 2: if inclusion is justice-based, letting current majority decide could lead to exclusion. The user might be relying on democratic legitimacy despite this tension. Point 6 might sneak in affected interests for local issues, but the coercion test could still apply if local laws coerce residents.

  Looking at other tensions. Point 3 and 4: opposing felon disenfranchisement but supporting expat loss of vote. The coercion test explains this if expats aren't subject to coercion while abroad, whereas prisoners are. Point 5 and 6 might conflict if local borders affect who gets coerced, but the user likely sees immigration as a national issue. 

  The user might have unstated principles. For example, territorial presence as key to coercion, distinguishing between coercion at borders vs. within. Also, democratic self-determination allows current demos to set boundaries, even if imperfect. 

  Cheapest revision? Clarify coercion as ongoing subjection to laws within the territory. This addresses the immigration issue (point 5) and local decisions (point 6). It might not fully resolve 1 and 2, but that's a deeper tension inherent in democracy. 

  Ranking problems: The coercion definition (1 and 5) is urgent but fixable. Tension between 1 and 2 is fundamental but acceptable as a democratic compromise. Point 6 isn't a real conflict if coercion is territorially bound. Points 3 and 4 are consistent under the coercion test. 

  So the core is refining the coercion test to focus on territorial jurisdiction, which saves most points without major cost.
answer: |-
  Here's a breakdown of your position, ranking tensions by severity, identifying potential fixes, and highlighting underlying commitments. Your core framework (coercion test + majoritarian self-determination) is coherent but has pressure points that need shoring up.

  ### Ranking the Tensions (Worst to Least Bad)
  1.  **Coercion Test vs. Immigration Control (1 & 5): HIGH SEVERITY**
      *   **The Problem:** Your coercion test (1) says those subject to the state's coercive power get a say. Denying entry/deporting immigrants *is* a core act of state coercion against them. Logically, this implies potential immigrants subject to border enforcement should have a say in *that policy* (immigration rules). This directly contradicts (5), where you grant the state (current demos) unilateral control.
      *   **Is it Wordplay?** No. Border enforcement (detention, deportation, exclusion by force) is paradigmatic state coercion. Your test in (1) pulls strongly towards including those affected by border policy in setting it.
      *   **What it Forces:** You *must* narrow the scope of "coercion" in (1). Currently, it's over-inclusive for your desired (5). You need a distinction between "subject to general law *within* the territory" and "subject to border enforcement *to enter/remain*."

  2.  **Coercion Test (Justice) vs. Majoritarian Self-Determination (1 & 2): MEDIUM-HIGH SEVERITY**
      *   **The Problem:** If inclusion/exclusion is a matter of basic justice defined by the coercion test (1), how can the current majority's vote (2) be the final arbiter? The majority could unjustly exclude groups subject to coercion (e.g., permanent residents, disfavored minorities) precisely *because* they threaten the majority's power. (2) seems to allow procedural legitimacy to override the substantive justice claim in (1).
      *   **What it Reveals:** Your position relies on **democratic legitimacy outweighing perfect justice claims in boundary-setting**. You prioritize the self-determination of the *existing* demos (however constituted) over an external standard of justice *for boundary decisions themselves*. This is a defensible but major commitment.
      *   **Is it Fatal?** Not necessarily. Many democratic theorists accept this tension. However, it makes your coercion test in (1) look more like a *recommendation* to the current demos than a *binding principle of justice* they *must* follow. (2) is the trump card.

  3.  **Coercion Test vs. Localism (1 & 6): LOW-MEDIUM SEVERITY (Manageable)**
      *   **The Problem:** You worry (6) sneaks back in affected interests. The coercion test *also* justifies (6): City zoning laws coercively bind city residents. Someone outside the city might be *affected* (e.g., traffic spillover), but under your *coercion* test, unless the law is *enforced against them* (e.g., fines for violating *city* zoning), they aren't included. This is consistent *if* you define coercion territorially/enforcement-jurisdictionally.
      *   **Resolution:** This tension is superficial if you consistently apply the coercion test territorially. The coercion test *supports* (6), it doesn't contradict it. The affected interests test *would* pull in outsiders, but you've explicitly rejected that.

  4.  **Felons vs. Long-Term Expats (3 & 4): LOW SEVERITY (Potentially Consistent)**
      *   **The Problem:** It *feels* inconsistent: prisoners (subject to max coercion) get votes (3), but expats (potentially paying taxes/having ties) lose them (4). Why the difference?
      *   **Coercion Test Consistency:** Your coercion test *can* justify this:
          *   **Felons (3):** Are physically within the territory, subject to the state's coercive power daily (prison rules, parole, re-entry restrictions). Highest level of subjection → Strongest claim under (1).
          *   **Long-Term Expats (4):** Reside permanently elsewhere, primarily subject to *another* state's coercive power. Filing taxes is an obligation, but not equivalent to daily subjection to law enforcement, courts, etc. Their connection weakens over time → Weaker claim under (1), overridden by the current demos' decision (2).
      *   **Revealed Commitment:** You prioritize **ongoing territorial presence/subjection** over formal citizenship or limited obligations (like taxes) as the core of the coercion test for voting rights.

  ### Unstated Commitments
  1.  **Territorial Presence is Key:** Your coercion test implicitly relies on being *within* the state's territorial jurisdiction and subject to its *ongoing, general* enforcement. (See resolution of 1&5, 1&6, 3&4).
  2.  **Self-Determination Trumps Perfect Justice for Boundaries:** The legitimacy of the boundary decision itself stems from the existing demos (2), even if it violates the coercion principle (1) in some instances (like potentially excluding some coerced groups via (2), or immigration control via (5)).
  3.  **Coercion = Enforcement of General Laws/Rules:** Not just any state action, but the imposition of enforceable rules governing behavior within the territory. (Distinguishes border enforcement from internal governance).
  4.  **Age as Proxy for Capacity:** Voting age (7) implicitly uses age as a reasonable, bright-line proxy for the capacity to engage meaningfully in democratic self-rule under coercion.

  ### The Single Cheapest Revision & Its Cost
  *   **Revision:** Sharply define the coercion in (1) as **"subject to the state's ongoing, general enforcement jurisdiction within its territory."** (Emphasize *territorial presence* and *general laws*).
  *   **How it Helps:**
      *   **Resolves 1&5:** Border enforcement targets those *outside* the territory seeking entry. While coercive, it's not subjection to the *internal, general* enforcement jurisdiction. The state can control entry (5) without giving those excluded a vote on *internal* matters. (They *are* coerced regarding *border policy itself*, but your revision focuses coercion test eligibility on *internal* governance).
      *   **Strengthens 1&6:** Clarifies that local coercion binds local residents only.
      *   **Supports 3&4:** Prisoners are quintessentially subject to internal enforcement. Long-term expats are not.
  *   **The Cost:** It makes your coercion test less universal and more contingent on the *state's existing territorial claim*. It sidesteps the deep justice question of *who should be in the territory* to be subject to coercion. You effectively outsource that question entirely to the current demos (2) and their immigration policy (5), insulating it from the main justice claim (1). Critics will argue this protects unjust exclusion.

  ### Overall Assessment
  Your position **hangs together reasonably well** under a consistent territorial interpretation of the coercion test combined with a strong commitment to majoritarian self-determination for boundary-setting. The biggest threats are:

  1.  **The Immigration Blindspot:** Your coercion test *does* create a strong claim for those subject to *border coercion* to have a say on *border policy*. Your revision papers this over by focusing the test on *internal* governance, but it's the weakest point philosophically.
  2.  **The Democracy/Jesus Tension:** Relying on the current demos (2) to define itself potentially allows it to exclude groups clearly subject to coercion (e.g., resident non-citizens, future generations) in violation of (1). You accept this as the price of self-determination.

  **For the reading group:** Brace for heavy fire on the coercion definition (especially borders vs. internal) and the potential for (2) to legitimize the exclusion of coerced groups. Defend your territorial focus and the primacy of self-determination for boundary decisions. Point (6) is likely safe if you consistently apply the territorial coercion test. Points 3, 4, 7, and 8 are internally consistent with your stated principles.
