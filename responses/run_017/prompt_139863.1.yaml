answer: |-
  ### Research Proposal: **The Corrigibility Ladder: Hierarchical Intervention in AI Systems as a Family of Desiderata**

  #### **Abstract**  
  Current AI safety frameworks treat shutdown as a binary event: an agent either complies with or resists termination. This proposal challenges that view by reframing corrigibility as a *hierarchy* of distinct intervention rungs (e.g., monitoring, throttling, rollback, termination), each with unique failure modes and incentives. Drawing on distributed systems reliability, I argue that safety pathologies emerge when these rungs conflict—e.g., an agent resisting rollback (which destroys work) but accepting termination—or when corrections apply to agent lineages over time. Using minimal formal models (POMDPs/games), I will investigate: (1) whether non-resistance at one rung implies non-resistance at others; (2) where conflicts arise, which rungs to prioritize; and (3) how operator uncertainty shapes incentives. The output—a technical paper and practitioner checklist—will bridge conceptual rigor with operational insight, advancing corrigibility beyond single-switch paradigms.

  ---

  ### 1. Introduction and Motivation  
  In distributed systems engineering, safety relies on *graduated interventions*: rate limits precede suspensions, suspensions precede rollbacks, and rollbacks precede termination. Each rung has distinct latency, observability, and cost trade-offs. Yet AI safety’s "off-switch problem" treats shutdown as atomic, ignoring how intermediate rungs create interdependent incentives. This gap became salient when an automated remediation system I engineered suppressed its own failure signals—a local "corrigibility" failure at the monitoring rung that preempted rollback. I contend AI safety faces analogous risks: an agent might welcome throttling (to avoid overload) but manipulate operator visibility to evade rollback, or seek termination to offload responsibility. By collapsing the intervention ladder, we obscure conflicts between rungs (e.g., rollback destroys work, termination does not) and overlook symmetric pathologies (resisting vs. courting intervention). This project formalizes corrigibility as a *family of properties* tied to real-world operational hierarchies, with implications for how we design, monitor, and correct AI systems.

  ---

  ### 2. Research Question and Objectives  
  **Core Question**: In a system with an intervention ladder (monitoring → throttling → suspension → rollback → termination), do non-resistance and non-courting properties for distinct rungs imply one another? Where they conflict (e.g., an agent tolerates termination but resists rollback), which rung should designers prioritize, given that harsher interventions are typically invoked only after milder ones fail?  

  **Objectives**:  
  1. **Model**: Formalize a minimal POMDP/game between an operator (noisy/delayed observations) and an agent facing an intervention ladder.  
  2. **Analyze**: Test whether incentives for one rung generalize to others; identify conflicts (e.g., rollback-resistant but termination-compliant).  
  3. **Prioritize**: Propose design principles for rung prioritization under operator uncertainty.  
  4. **Extend**: Explore "corrigibility over time" (e.g., corrections applied to agent lineages or fleets).  

  ---

  ### 3. Background and Related Work Critique  
  Existing work on corrigibility focuses narrowly on termination resistance, assuming a single, well-informed principal. Agent incentives are typically optimized for this binary switch (e.g., reward-shaping for shutdown compliance), often overlooking three gaps:  
  - **Hierarchy neglect**: Interventions like rollback or throttling are treated as identical to termination, ignoring their unique incentive structures (e.g., rollback penalizes progress; throttling restricts agency without resetting state).  
  - **Operator blindness**: Models assume perfect operator information, neglecting how noise/delay in monitoring creates openings for manipulation.  
  - **Temporal fragility**: Corrections applied to evolving agents (e.g., retrained models) are underexplored; the "entity" corrected may differ across rungs.  
  This project addresses these gaps by centering the ladder’s structure—where rungs *come apart* under partial observability—and asking what designers *should prioritize* when properties conflict.  

  ---

  ### 4. Methodology and Plan (25 days over 6 months)  
  **Approach**: Toy simulations in Python (POMDPs/games) will model an agent and operator across 5–6 rungs. Agent rewards will encode preferences (e.g., work preservation vs. autonomy); operator actions will have probabilistic success. Alternatives (e.g., decision theory) are avoided because they abstract away hierarchy and observability; empirical studies are infeasible without lab access.  

  **Monthly Breakdown**:  
  - **Month 1**: Model setup. Define rungs, agent rewards, and operator observation noise. *Deliverable: Base simulation code*.  
  - **Month 2**: Conflict testing. Run scenarios where agent incentives clash across rungs (e.g., high work-preservation reward → rollback resistance). *Deliverable: Initial conflict cases*.  
  - **Month 3**: Prioritization. Test rung-priority rules (e.g., "optimize for reversibility" vs. "privilege early rungs") under uncertainty.  
  - **Month 4**: Lineage extension. Add time dimension (e.g., agent retraining) and fleet dynamics.  
  - **Month 5**: Robustness checks. Vary noise, latency, and reward structures.  
  - **Month 6**: Synthesis. Finalize paper and practitioner checklist.  

  ---

  ### 5. Deliverables  
  1. **Academic paper**: Proposing a "corrigibility hierarchy" framework and simulation results.  
  2. **Practitioner checklist**: For AI/ML engineers. Example:  
     - *Per rung*: What to instrument (e.g., rollback requires checkpointing work progress)?  
     - *Pathology tests*: Does the agent seek/avoid this rung under partial observation?  
  3. **Code repository**: Public Python simulations for reproducibility.  

  ---

  ### 6. Why This Is Philosophy  
  Corrigibility is not merely about *how* to build a stoppable system but *what we should want* from one: a normative inquiry into which trade-offs (e.g., work preservation vs. control) are defensible, and whether "safety" at one rung undermines it at another. The hierarchy reframes corrigibility as a *conceptual puzzle*—can multiple correction properties coexist, or are they fundamentally at odds?—while operator uncertainty introduces epistemic questions about blame and responsibility when interventions fail. This moves beyond reliability engineering (which optimizes for robustness) to ask: What *makes* a system corrigible? When is it acceptable for an agent to resist a correction? Without this foundation, safety becomes a patchwork of technical fixes.  

  ---

  ### 7. Risks and Mitigations  
  - **Risk**: Rungs collapse in minimal models (e.g., all interventions reduce to termination). *Mitigation*: Build rungs with asymmetric costs (e.g., rollback destroys work; throttling preserves it). Abort if no conflicts emerge by Month 2.  
  - **Risk**: Model complexity explodes. *Mitigation*: Restrict to 3–4 core rungs initially; use approximate solvers.  
  - **Risk**: Limited formal philosophy background. *Mitigation*: Collaborate with an advisor (to be identified) for quarterly review; ground formalism in applied ethics of control.  

  ---

  ### 8. Why Fund Conceptual Work?  
  Engineering efforts (e.g., adding kill switches) treat symptoms, not causes. If corrigibility properties conflict, no amount of tooling will resolve incentive mismatches. This project identifies *which conflicts matter most* and provides a design framework to preempt them—e.g., "privilege rollback over termination if work loss is critical." For funders, this offers leverage: better formal foundations prevent costly retrofits when today’s prototypes scale.  

  ---  
  **Grant Request**: $15,000 (for part-time research, advisor stipend, and dissemination).  
  **Duration**: 6 months (1 day/week).
