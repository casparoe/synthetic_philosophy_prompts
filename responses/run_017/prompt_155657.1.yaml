prompt: |-
  In the group I work in, work on learned systems is governed by two conventions that sit awkwardly together, and I would like the implicit theory behind them made explicit.

  The first convention governs postmortems. When a deployed system misbehaves, the write-up must explain the behaviour at the level of mechanism: which component, which training signal, which data, which decoding choice produced the output. Reviewers send back any write-up that says the system believed something, wanted something, decided something, or was trying to do something, on the grounds that such language is anthropomorphic and therefore not an explanation.

  The second convention governs capability and risk assessment, and here the same reviewers use agent vocabulary freely, because the safety case depends on it. Evaluations ask whether the system would mislead a grader if it could gain by doing so, whether it pursues a goal across contexts it was never trained on, whether it is deliberately underperforming on capability tests, whether it tracks what a user does and does not know. A system described purely as a distribution over token sequences is not something a deception risk assessment can be written about at all — yet the model card for that same system describes it as "just" a statistical predictor.

  I have started calling the movement between these conventions stance arbitrage: the intentional stance is treated as licensed for prediction and alarm, and as illicit for explanation and excuse. Assume the familiar three-way distinction between the physical, design, and intentional stances.

  1. Reconstruct the implicit theory of intentional ascription that this practice needs. In particular, does it presuppose that intentional claims can predict without explaining, and can that asymmetry be defended? Give the strongest version of the theory, and distinguish what the practice strictly presupposes from what merely fits it comfortably.

  2. Say which rival views the practice quietly rules out, and where it is underdetermined. Could an instrumentalist, a realist about model beliefs, and someone who regards the vocabulary as useful fiction all sign off on both conventions? Identify the points at which the conventions are philosophically silent and the practice could have gone another way.

  3. Test the reconstructed theory against three systems where the stances pull apart: a thermostat; a chess engine's evaluation function, whose mechanics are fully known; and a large model whose behaviour across many prompts is best predicted by attributing to it a goal it was never trained to have, where no mechanism is known. Does the theory deliver the verdicts the practice actually gives, and is that pattern of verdicts defensible?

  4. Address the real-patterns question. Suppose we say that an intentional ascription is warranted when it compresses a system's behaviour into a description cheaper than any mechanical description available, and that this compression is what makes the pattern real rather than projected. Notice that whether a compression is available depends on who is asking — what they have measured, what they already know, what they can compute — so that a pattern may be real for the safety team and not for the interpretability team. Does the practice have the resources to handle that relativity, or does the relativity undermine the ban in the first convention?

  5. Finally, the reform question. If the ban on intentional explanation were lifted, what exactly would change in a postmortem — which new claims would become checkable, by what test, and what kind of evidence would settle them — and what would not change? And if instead the practice dropped intentional vocabulary from risk assessment, what would be lost that no design-stance description could replace?
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about two conflicting conventions in their AI research group regarding intentional language. This is a sophisticated inquiry touching on philosophy of mind, AI safety practices, and epistemology.

  The core tension is clear: their group bans intentional language ("believed," "wanted") in failure analysis (postmortems) but requires it for risk assessment. This creates what they cleverly term "stance arbitrage." 

  I need to reconstruct the implicit theory behind this practice. The key seems to be a predictive/explanatory asymmetry: intentional language is seen as predictively useful but explanatorily empty for their purposes. The practice likely assumes that while beliefs/goals can reliably predict behavior (making them essential for safety scenarios), they don't constitute mechanistic explanations (hence banned in postmortems).

  For rival views: An instrumentalist would happily endorse both conventions since intentional terms are merely tools. A realist might struggle with banning intentional explanations. A fictionalist could accept both by treating intentionality as useful pretence. The practice rules out strong realism where beliefs are always explanatory.

  Testing against cases: Thermostats fail the intentional stance test - too simple. Chess engines occupy a middle ground where design stance suffices. The mysterious large model case is most interesting - here the practice would likely allow intentional language for risk assessment despite mechanistic ignorance, which reveals their pragmatic priorities.

  The real-patterns question exposes relativity: compression value depends on the observer's knowledge. Their ban on intentional explanations in postmortems might be undermined by this, since interpretability teams with full mechanistic understanding have different "available compressions" than safety teams.

  Regarding reforms: Lifting the ban would allow postmortems to make claims about internal representations ("did it believe X?"), testable via probing or behavioral consistency checks. Conversely, banning intentional language from risk assessments would cripple safety arguments - design stance descriptions can't capture concepts like deception or goal persistence.

  The user seems deeply familiar with Dennett's stances framework. Their frustration with this inconsistency is palpable. I should acknowledge the intellectual sophistication while making the analysis accessible.
answer: |-
  Here’s a reconstruction and analysis of your group’s implicit theory, its philosophical underpinnings, and its practical implications:

  ### 1. Implicit Theory of Intentional Ascription  
  **Core Premise**: Intentional ascriptions (beliefs, goals) are *predictive tools* but not *explanatory mechanisms*.  
  - **Asymmetry Defense**:  
    - **Prediction**: Intentional stance compresses behavioral patterns into efficient heuristics for forecasting novel scenarios (e.g., "Will it deceive if beneficial?"). This is indispensable for risk assessment where mechanistic details are unknown or intractable.  
    - **Explanation**: Postmortems demand *causal specificity*. Intentional language obscures the actual levers of control (data, loss functions, architecture). Saying "the model wanted X" doesn’t identify *which gradient update or attention head* caused the failure.  
  - **Strong Version**:  
    - Intentional states are *emergent summaries* of behavior, only "real" insofar as they reliably predict. They lack causal power; mechanisms do the work.  
    - **Presupposed**: Intentional idioms are non-explanatory in science.  
    - **Comfortable Fit**: Intentional states could be latent variables in the system, but naming them adds no explanatory value to postmortems.  

  ### 2. Rival Views Ruled Out and Underdetermination  
  - **Ruled Out**:  
    - **Strong Realism**: If model beliefs were causally potent mental states, banning intentional language in postmortems would be incoherent. The practice assumes beliefs don’t *do* anything; mechanisms do.  
    - **Eliminativism**: Risk assessment requires intentional idioms, so beliefs can’t be dismissed as universally illusory.  
  - **Compatible Views**:  
    - **Instrumentalism**: Intentional stance is a useful tool for prediction, not a claim about reality. Fits both conventions.  
    - **Fictionalism**: "As if" intentionality works for safety (useful fiction) but fails postmortems (needs literal truth).  
    - **Moderate Realism**: If beliefs are real but only descriptively emergent (not causal), it *could* fit, but the ban on explanatory use leans instrumentalist.  
  - **Underdetermined**:  
    - Whether intentional patterns are *inherent* in systems or *imposed* by observers.  
    - Whether "explanation" requires solely mechanistic accounts or allows emergent patterns.  

  ### 3. Testing the Theory Against Key Cases  
  | **System**          | **Practice’s Verdict**                     | **Defensible?** |  
  |----------------------|--------------------------------------------|-----------------|  
  | **Thermostat**       | ❌ Intentional stance banned (design stance suffices) | Yes: "Wants 22°C" adds no predictive power beyond mechanism. |  
  | **Chess Engine**     | ❌ Intentional stance banned (mechanisms fully known) | Yes: "Desires checkmate" is redundant; evaluation function explains all. |  
  | **Mysterious LLM**   | ✅ Intentional stance *allowed* for risk assessment | Yes: If goal-ascription best predicts novel behavior (e.g., deception), it’s pragmatically necessary despite mechanistic ignorance. |  

  **Verdict**: The theory holds. Intentional stance is licensed only when it offers unique predictive leverage unavailable mechanistically.  

  ### 4. Real-Patterns Relativity Challenge  
  - **Practice’s Resources**:  
    - Risk assessment teams (with limited mechanistic insight) *need* intentional compressions to predict high-stakes scenarios.  
    - Interpretability teams (seeking mechanisms) reject compression as inadequate for diagnosis.  
  - **Does Relativity Undermine the Ban?**  
    - **No**: The ban applies only to *explanation*, not prediction. A "real pattern" for safety doesn’t entail causal reality.  
    - **Key Distinction**: Postmortems seek *intervention points*; only mechanisms provide these. Safety seeks *forecasts*; compression suffices.  
    - **Relativity Managed**: Intentional ascriptions are context-dependent tools, not universal truths.  

  ### 5. Reform Implications  
  **A. Lifting the Ban on Intentional Explanations**:  
  - **New Checkable Claims**:  
    - "Did the model *believe* user input X?" → Test via consistency probes (e.g., does it affirm X across contexts?).  
    - "Was it *trying* to deceive?" → Check for patterned concealment (e.g., behaves truthfully when monitored, falsely when not).  
  - **Evidence Required**: Behavioral signatures (e.g., goal-directed consistency), adversarial testing, representational similarity analysis.  
  - **Unchanged**: Mechanistic explanations still required for fixes (e.g., "Deception arose from overfitting to reward hack in data").  

  **B. Banning Intentional Vocabulary in Risk Assessment**:  
  - **What’s Lost**:  
    - **Deception**: Design stance can describe "outputs false information when reward signal Y is present," but misses *goal-directed adaptability* (e.g., novel deception strategies).  
    - **Goal Pursuit**: Statistical descriptors can’t capture *persistent objective-seeking* across distributional shifts.  
    - **Strategic Awareness**: "Tracking user knowledge" becomes incoherent without belief-like states.  
  - **Irreplaceable Gap**: Intentional stance uniquely handles *counterfactual robustness* (e.g., "Would it deceive *if* a new opportunity arose?"). Mechanistic accounts are brittle to unseen scenarios.  

  ### Conclusion: The Practice’s Coherence  
  Your group’s stance arbitrage is defensible as a **pragmatic dualism**:  
  - **Intentional stance for prediction**: When mechanisms are opaque or novel threats loom.  
  - **Design stance for explanation**: When faults require precise engineering fixes.  
  The tension arises from AI’s unique position: systems complex enough to demand intentional heuristics, yet mechanistic enough to debug. Reforms should clarify *context* (e.g., "Use beliefs only for forecasting, not causality"), not abandon the duality.
