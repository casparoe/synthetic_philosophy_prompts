prompt: |-
  I'm on the programme committee of a small academic society — one conference a year plus the proceedings. No written policy, no staff, seven of us, and we argue things out over email. There's a case in front of us now and I keep going in circles, so: what should we do if we want to be consistent with ourselves, and what rule have we actually been running this whole time without noticing?

  Our track record, as near as I can reconstruct it:

  - Two years ago we pulled a keynote about a month before the conference, after people found blog posts he'd written arguing that some ethnic groups are just less intelligent. Nothing to do with his talk, which was on memory consolidation. We told him he was off the program. We never published anything, never gave a reason in writing, never said for how long.
  - Same year we kept a paper on the program that a lot of members said was dangerous — it argued for a partly genetic explanation of a group difference in school outcomes. We added a respondent and ran a critical commentary beside it in the proceedings. Our line was that it was an argument made with data, inside the normal norms, and that it isn't our job to police which conclusions people argue for.
  - Last year we withdrew a paper and barred the author from submitting for three years after we found he'd fabricated data. That one we did call a sanction, we did put a term on it, and we did put a note in the proceedings saying what happened.
  - We suspended a member for a year over a long run of humiliating emails to a junior member. Completely outside conference business, from her personal account, about a personal dispute. We said it didn't matter that it was off-platform.
  - We did nothing when someone complained about a member who'd done prison time for fraud about twelve years ago and whose talk was on something unrelated. We said he'd answered for it already and it had nothing to do with his role with us.
  - We did nothing about a member who publicly called one of our own decisions cowardly and named the people who'd complained. We said public criticism of the committee is protected even when it's rude.
  - We did nothing about a member who was filmed at a protest chanting something fairly violent, unconnected to our field. We said it was outside our remit — which, as one of our members pointed out at the time, sits oddly with the first and fourth items.

  Now: the psychologist from the first item has submitted a paper for this year's proceedings. It's a straight memory paper, co-authored with his PhD student who did the work and needs the publication. Reviewers say it's fine. Separately, his department has put him forward for our service award, which is mostly honorific but comes with a named lecture. He's fairly senior and well known.

  And we've since worked out that after we dropped him, at least two other societies quietly stopped inviting him and a job talk was withdrawn. As far as we can tell nobody in any of those places looked into anything — they just saw he wasn't on our program and drew their own conclusions. He doesn't know we know.

  So: do we take the paper, and do we give him the award? Which of our own decisions is the closest match, and what are we committing ourselves to either way? Because it feels like whatever we decide, we're also deciding something about what we did two years ago, which at the time felt like us just choosing who's on the program and now looks, to everyone outside, like a verdict. Does the fact that other people copied us change anything we owe him, or is that just other people's business? And is there some decision we could take now that would force us to stop dodging this next time?

  I care less about which way we go than about which rule we'd be running and what else it commits us to. Please don't just tell me to write a policy or take legal advice — we know, and we have to answer by Friday.
reasoning: |-
  Okay, the user is part of a small academic society's program committee facing a dilemma about whether to accept a paper and grant an award to a psychologist they previously removed as a keynote speaker. They've provided a history of past decisions to illustrate their inconsistent precedents. 

  First, I need to understand their core concern: they're less interested in the specific outcome here than in identifying the implicit principles behind their past actions, because whatever they decide now will retroactively define what they actually did two years ago. The fact that other institutions followed their unspoken "sanction" complicates things ethically. 

  Looking at their track record, I notice three patterns emerging:
  - They intervene for harms directly tied to academic integrity (fabricated data) or member safety (harassment emails)
  - They avoid policing unrelated personal conduct (fraud conviction) or protected speech (criticizing the committee)
  - But the racial intelligence blog posts created an exception - they acted despite no direct connection to academic work

  The inconsistency between "we don't police conclusions" (genetics paper) and "we remove for offensive beliefs" (keynote) is glaring. That keynote decision now looks like a quiet blacklisting, especially since other societies copied it without investigation. 

  For the current decision:
  - Accepting the paper aligns with their genetics paper precedent (focus on academic merit)
  - Denying the award aligns with their keynote removal (social consequences of his views)
  But doing both would highlight their contradiction. 

  The cleanest solution might be:
  1. Take the paper (consistent with academic freedom precedents)
  2. Postpone award decision until establishing clear service criteria
  3. Publicly clarify that past removal was program-specific, not a verdict
  This forces them to finally define whether they're sanctioning beliefs or just curating events. 

  The user's urgency suggests they need actionable principles, not policy drafts. I should emphasize that their real task is choosing which of their conflicting values (academic openness vs social responsibility) takes priority when disconnected from scholarship. Whatever they pick will become their de facto rule.
answer: |-
  Based on your precedent history, your committee operates on **three implicit principles** that create tension in this case. Resolving this requires choosing which principle dominates when they conflict. Here's the breakdown:

  ### Your Implicit Rules (Reconstructed)
  1.  **Academic Integrity is Non-Negotiable:** You sanction *academic misconduct* (fabrication, harassment *within* the community) severely, transparently, and with defined terms (Items 3 & 4).
  2.  **Protect Members & Community Safety:** You act against *non-academic* conduct causing *direct harm* or creating a *hostile environment* for members, even if off-platform or unrelated to the specific academic work presented (Items 1 & 4).
  3.  **Academic Freedom & Relevance:** You protect scholarly arguments made within disciplinary norms, regardless of controversy or off-platform personal conduct/legal history, *unless* it directly harms members or violates Principle 1 (Items 2, 5, 6, 7). Public criticism is explicitly protected.

  ### The Conflict in This Case
  *   Principle 3 strongly supports **accepting the paper**. It's academically sound, relevant, and co-authored by a junior researcher needing publication. Rejecting it purely based on the author's *unrelated* past statements contradicts your handling of the genetics paper (Item 2) and the fraud conviction (Item 5).
  *   Principle 2 arguably supports **denying the award/named lecture**. The keynote removal (Item 1) was driven by protecting the community from association with harmful, discriminatory views expressed publicly, even if unrelated to the talk. Granting a prestigious *honor* raises similar concerns about endorsement and community safety/comfort.
  *   Principle 1 (Integrity) isn't triggered here – the submitted work is sound.

  **Therefore, your closest precedents are:**
  *   **For the Paper:** *Item 2 (Genetics Paper)* & *Item 5 (Fraud Conviction)*. The work stands on its academic merit. Rejection would imply an academic sanction where none was formally declared or merited by the work itself.
  *   **For the Award:** *Item 1 (Keynote Removal)*. This involves association, honor, and platforming. Granting the award now contradicts the *implicit signal* sent by the removal, which was about distancing the society from his expressed views.

  ### What You're Committing To Either Way
  *   **Accept Paper + Grant Award:** Commits you to saying Principle 3 (Academic Freedom/Relevance) *always* trumps Principle 2 (Protection/Harm) when the work itself is sound. This retroactively frames the keynote removal *only* as a program-specific curation choice (not a sanction) and implies it was temporary/isolated. It weakens Principle 2 significantly for future cases.
  *   **Accept Paper + Deny Award:** Commits you to a **distinction between scholarship and honorific recognition**. Scholarship (papers) is judged purely on academic merit/relevance (Principle 3 dominant). Honors/service awards involve the society's values and endorsement; non-academic conduct causing harm (Principle 2) can be disqualifying. This aligns with the keynote removal (denying a high-profile honorific platform) and the paper acceptance (allowing scholarship). *This is the most consistent with your full history.*
  *   **Reject Paper (regardless of award):** Commits you to saying the keynote removal *was* an implicit sanction extending to all society activities indefinitely. This contradicts your handling of the genetics paper (Item 2) and the fraud conviction (Item 5), and creates a new, unwritten sanctioning category ("offensive beliefs") without due process or defined terms. It makes Principle 2 dominant over Principle 3 based on societal views.

  ### The Impact of Others Copying You
  *   This is **profoundly important ethically, but not legally binding**. Their actions were based on an *assumption* about your reasons (likely a misconduct sanction), which you never stated.
  *   You **owe him clarity and honesty**, regardless of your decision. Your lack of transparency two years ago contributed to this collateral damage.
  *   It doesn't *force* you to continue a sanction you never formally imposed, but it *should* compel you to finally define what you did and why you're acting now. Ignoring this perpetuates harm based on a misunderstanding you created.

  ### Recommendations for Consistency & Ending the Dodge
  1.  **Accept the Paper:** Uphold Principle 3. The work is sound, relevant, and involves a junior author. Rejecting it contradicts Items 2 & 5.
  2.  **Deny the Service Award:** Uphold the *implicit* rationale behind Principle 2 applied in Item 1 (keynote removal). Granting a high-profile honor is incompatible with distancing the society from his publicly expressed discriminatory views, which were deemed harmful enough to remove him previously. Frame this *explicitly* around the award being an honor reflecting society values, distinct from scholarship assessment.
  3.  **Issue a Clarifying Statement (Crucial):** To yourselves, the member, and potentially the society:
      *   **Acknowledge the Past:** State clearly that the keynote removal two years ago was due to the *harmful nature of his public discriminatory statements* and the need to protect the community, *not* due to academic misconduct related to his work. Emphasize it was a decision about *that specific platform*, not a formal sanction on his membership or scholarship.
      *   **Explain the Current Decision:** State you accept sound scholarship (paper) based on academic merit alone (citing Item 2 & 5 precedents). State you deny honors that imply society endorsement to individuals whose public expressions fundamentally conflict with core values of respect and non-discrimination (citing the *implicit* principle behind Item 1 & 4).
      *   **Define the Distinction:** Formalize the difference between assessing scholarship (academic merit only) and granting honors (academic merit PLUS alignment with society values regarding member safety/respect). This is the rule you've been running without noticing.
      *   **Acknowledge the Collateral Damage:** Express regret that the lack of clarity around the keynote removal led others to make assumptions impacting his opportunities, while reiterating your own reasons were specific to the platform/honorific context.
      *   **Commit to Future Policy:** State this experience highlights the need for a formal, transparent policy on these matters, to be developed.

  **Why this forces you to stop dodging:** It forces you to finally articulate the *real reason* behind the keynote removal (harm from discriminatory views, not scholarship) and define the scope of when Principle 2 (Protection/Harm) overrides Principle 3 (Academic Freedom) – specifically for honors, awards, and keynote platforms, not for standard scholarship assessment. This creates a clear, consistent line for the future: **Scholarship is judged on merit; honors require alignment with community values of safety and respect.** This resolves the tension between Items 1 & 2 and provides a framework for future decisions.
