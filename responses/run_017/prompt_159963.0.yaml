prompt: |-
  I teach a 90-minute seminar for about fourteen upper-level undergraduates in cognitive science and philosophy. None of them has read anything on analogy-making or letter-string microdomains, and they arrive assuming that finding the rule in a puzzle is a matter of getting it right or wrong. I want an in-class activity, not a lecture, that makes them feel — before anyone names it — that a single worked example does not pin down a transformation, and that what they take themselves to be doing when they apply a rule is really a set of decisions about which descriptions stay rigid and which are allowed to slip.

  The microdomain is a variant I have been using, and I would like the activity built around it rather than around the familiar roman-letter strings. There are five symbols: • ○ △ ✕ ★. Two relations on them are given on a handout and nothing else is given: a ring order, • → △ → ✕ → ★ → ○ → back to •, and a weight order, • < ○ < △ < ✕ < ★. Strings are short rows of these symbols, possibly containing runs, and a problem supplies one source-to-target pair and asks for the target of a new source. The point of the construction is that for △ and ✕ the ring-successor and the weight-successor coincide, so a pair like • △ → • ✕ looks entirely unambiguous; for • and ○ the two orderings diverge; and for ★ the weight-successor does not exist at all while the ring wraps round to ○. In the source pair the changed symbol is also simultaneously the rightmost one and the heaviest one in the string, which is where the trouble is stored up.

  What I need from you:

  - Rules, roles, and a minute-by-minute timeline, including an opening round that is genuinely trivial and scored, so that everyone is committed and on record before the ground moves under them. No explanation of the domain beyond the handout, and no naming of the phenomenon until the debrief.
  - A concrete instance set: the actual strings, in the order I should hand them out, with a table giving for each item the answer predicted by each candidate description — ring-succession against weight-succession; rightmost symbol against heaviest symbol against the run as a whole; letter-level change against group-level change; wrapping against refusing to answer against importing the changed symbol from the example — and saying which pair of descriptions that item exists to separate. It should include at least one case that forces the letter-versus-group question and one that demands a successor exactly where no weight-successor exists.
  - A payoff scheme needing no money that rewards teams for predicting the distribution of answers in the room rather than for being correct, so that the fact that answers cluster tightly — that the space of admissible answers is small and structured rather than anything-goes — shows up in the tally instead of in anything I say.
  - A mid-session perturbation of the domain itself: a card that takes away one of the two orderings, or cuts the ring between two symbols, after which teams re-answer targets they have already answered. Design it so that what changes for them is which concepts have anything left to grip on.
  - A closing round in which the teams build the trap themselves: each devises a source string that forces a team committed to a stated rule to slip, together with a rule about what counts as answering in the spirit of the rule rather than wriggling out of it.
  - A debrief mapped onto moments in the session, naming conceptual slippage, levels of description, and the pressures that make some slips cheap while others feel like cheating, plus one final question I can ask to find out whether it landed.
  - What will predictably go wrong the first time I run it, and how to handle each: someone spotting the whole trick in round one and deflating it for everyone else; a team collapsing into the conclusion that there is simply no answer; the two-ordering setup being read as a gimmick rather than as the source of the pressure; the arithmetic of tallying eating the time I need for the debrief.
  - An honest note on what the session cannot reproduce and that I will have to supply myself: that in the classical architecture for this microdomain, slips are subpersonal, graded by conceptual distance, and produced by a stochastic search under competing pressures, whereas my students will have chosen theirs deliberately and will be able to give me reasons for them.
reasoning: |-
  We are designing a 90-minute in-class activity for upper-level undergraduates in cognitive science and philosophy. The goal is to make students experience that a single example does not uniquely determine a rule and that applying a rule involves decisions about which aspects are rigid and which can "slip". The microdomain uses five symbols: • (dot), ○ (circle), △ (triangle), ✕ (cross), ★ (star). We have two relations: a ring order (cyclic order) • → △ → ✕ → ★ → ○ → • and a weight order • < ○ < △ < ✕ < ★.

  The activity will be structured in rounds, with students working in small teams (about 3-4 students per team, so 3-4 teams total). We'll have a timeline, a set of concrete string examples, a payoff scheme that rewards predicting the distribution of answers, a mid-session perturbation, a closing round where teams build traps, and a debrief.

  ### Timeline (90 minutes total)

  1. **Introduction and Handout (5 minutes)**: 
     - Explain that they will be solving puzzles in a microdomain of symbol strings. 
     - Distribute the handout with the two orders: 
       - Ring order: • → △ → ✕ → ★ → ○ → (back to •)
       - Weight order: • < ○ < △ < ✕ < ★
     - Explain the task: They will see pairs of source strings and target strings. The source string is transformed into the target string by some rule. Then they will be given a new source string and must predict the target string by applying the same rule.

  2. **Round 1: Trivial Example (10 minutes)**:
     - **Example 1**: Source: "△" → Target: "✕"
       - Then new source: "✕" → They predict the target. 
     - This is trivial: the ring successor of ✕ is ★ (and also the weight successor is ★). So both orders agree. 
     - Teams write down their answer (must be "★") and they are scored as correct if they get it right. This builds confidence.

  3. **Round 2: First Challenge (15 minutes)**:
     - **Example 2**: Source: "• △" → Target: "• ✕"
       - Then new source: "• ○" → They predict the target.
     - Now, in the example, the change was from △ to ✕. Both ring and weight successor of △ is ✕. But for ○:
       - Ring successor of ○ is • (because ring: ... ★ → ○ → • ...)
       - Weight successor of ○ is △ (because weight: ○ < △)
     - Also, note that in the source "• △", the △ is the rightmost and the heaviest (since • < △). In "• ○", the ○ is the rightmost and the heaviest (• < ○). So the rule might be changing the rightmost, or the heaviest, or both? But in the example they coincided.
     - Teams write down their answers. We expect variation: some will say "• •" (ring) and some "• △" (weight).

  4. **Round 3: Forcing the Group vs. Letter Level (15 minutes)**:
     - **Example 3**: Source: "△ △" → Target: "△ ✕"
       - Then new source: "★ ★" → They predict the target.
     - In the example, the change was from the last △ to ✕ (so letter-level: change the last symbol to its successor). But note: the string has two identical symbols. The rule might be interpreted as changing the last symbol, or as changing the entire run? (A run is a maximal sequence of identical symbols.) 
     - For "★ ★": 
       - If letter-level: change the last ★ to its ring successor ○ (since ring: ★ → ○) -> "★ ○"
       - But weight successor of ★ doesn't exist (it's the heaviest). So if they use weight, they might not change? Or wrap? Or what?
       - Alternatively, group-level: the run of two ★s. If we think of the run as a unit, what is its successor? We haven't defined that. So this is ambiguous.
     - We expect some to say "★ ○" (ring, letter-level), some might say they cannot change (because no weight successor), or even wrap to •? But note: the ring wraps, so if they wrap, the ring successor of ★ is ○, so that's already covered. The challenge is the group-level: if they think of the run, they might not have a rule for changing a run of two ★s.

  5. **Mid-session Perturbation (10 minutes)**:
     - Distribute a "domain change" card that removes the weight order. Now only the ring order is available. 
     - Teams must re-answer the targets from Round 2 and Round 3 under the new domain. 
     - For Round 2: "• ○" -> now they must use ring: so change ○ to • -> "• •"
     - For Round 3: "★ ★" -> change the last ★ to ○ -> "★ ○"
     - Then, we might also give one more example to see the effect.

  6. **Round 4: Payoff Scheme - Predicting Distribution (15 minutes)**:
     - Now, instead of answering what they think is correct, each team is given a new problem and must predict how the other teams will answer (i.e., the distribution of answers in the room). 
     - **Example 4**: Source pair: "★" → "○" (from the ring, because in the ring ★→○, and weight doesn't have a successor so we use ring? But note: in the original example we had △→✕, which was both. Now we have ★ which only has ring successor.)
       - Then new source: "○" → What will be the distribution of answers?
     - Teams assign probabilities (or counts) to the possible answers: 
       - Possibilities: 
         - "•" (ring successor of ○)
         - "△" (weight successor of ○)
         - Maybe other answers? 
     - We tally the actual answers from the teams and then score each team on how well they predicted the distribution (e.g., using a scoring rule like Brier score). This rewards understanding the room's interpretation.

  7. **Round 5: Building Traps (10 minutes)**:
     - Each team is given a rule (e.g., "always change the heaviest symbol to its weight successor") and must create a source string that will force another team (using that rule) to slip (i.e., the rule leads to an impossible situation or requires a slip). 
     - They also must state a criterion for what counts as "in the spirit" of the rule (to prevent wriggling out by arbitrary exceptions). 
     - Example: Rule: "change the rightmost symbol to its ring successor". 
       - Trap string: "★" (because ring successor is ○, but if they have the rule, they must do it. But note in the weight order, ★ is heaviest and has no weight successor. However, the rule doesn't mention weight, so they should do it. But what if they see the weight conflict? They might slip to using weight? Or if they see that the example avoided weight problems? Then they might refuse? But the trap is to see if they break their own rule.)

  8. **Debrief (10 minutes)**:
     - Map moments in the session to the concepts:
       - Round 1: Both orders agree -> unambiguous, but sets up the expectation.
       - Round 2: The divergence of orders -> forces a decision: which description (rightmost/heaviest) and which order (ring/weight) to use? This is the first slippage: they have to choose which aspect to preserve.
       - Round 3: Group vs. letter level: the rule might be applied to the individual symbol or to the group. Also, the problem of no weight successor for ★.
       - Perturbation: Removing weight order shows that the rule they were using might have been relying on both, and now they have to adjust. This shows that the rule isn't fixed independently of the domain structure.
       - Round 4: Predicting distribution shows that even though there isn't a unique right answer, the answers are constrained and cluster in predictable ways (due to shared conceptual slippage).
       - Round 5: Building traps highlights that rules are vulnerable to edge cases and that slippage is part of the process.
     - Concepts: conceptual slippage (changing which aspect is rigid), levels of description (symbol vs. group), and pressures (e.g., when a rule becomes inapplicable, the pressure to adjust).
     - Final question: "When you were in Round 2, what made you choose between ring and weight? And did you feel that the other choice would have been cheating, or just a different interpretation?"

  9. **What Could Go Wrong**:
     - **Someone spots the trick early**: If a team says "it's ambiguous, there are two rules", acknowledge that and say that the activity is about exploring how we make decisions when the rule is underdetermined. Encourage them to play along and see how the room reacts.
     - **Team collapses into 'no answer'**: In Round 3, for "★ ★", some might say "cannot change". That's a valid answer. But then in the perturbation, when weight is removed, they might see that ring is still available. Emphasize that the rule might have been defined in a way that avoids the problem, but the example didn't show that.
     - **Two-order setup seen as gimmick**: In the debrief, explain that in real-world analogy, multiple dimensions of similarity compete, and we have to decide which to preserve.
     - **Time for tallying**: For Round 4, instead of a full distribution prediction, have teams choose the top 2 answers they think will occur and assign percentages. Then tally quickly by show of hands.

  10. **What the Session Cannot Reproduce**:
      - Note that in classical models (like Copycat), slips are subpersonal and graded by conceptual distance (e.g., ring distance vs. weight distance). The model stochastically explores the space under multiple pressures (e.g., simplicity, familiarity, etc.). In contrast, the students are making deliberate choices and can articulate reasons. In the debrief, highlight that the activity is a conscious analog of a process that often occurs below the level of conscious reasoning.

  ### Concrete Instance Set

  We'll design a sequence of items. For each, we'll specify the source pair, the new source, and then the possible answers and which distinctions they test.

  **Handout** (given at the start):
  - Symbols: •, ○, △, ✕, ★
  - Ring order: • → △ → ✕ → ★ → ○ → •
  - Weight order: • < ○ < △ < ✕ < ★

  **Round 1 (Trivial)**:
    - Example: Source "△" -> Target "✕"
    - New source: "✕" 
    - Expected answer: "★" (both ring and weight agree)

  **Round 2 (Divergence)**:
    - Example: Source "• △" -> Target "• ✕"
      - Change: △ to ✕ (both ring and weight successor of △ is ✕)
    - New source: "• ○"
    - Possible answers and which distinction they test:
      - "• •" (changes ○ to its ring successor •) -> uses ring order and changes the last symbol.
      - "• △" (changes ○ to its weight successor △) -> uses weight order and changes the last symbol.
      - Distinction: ring vs. weight for the symbol ○.

  **Round 3 (Group vs. Letter and No Successor)**:
    - Example: Source "△ △" -> Target "△ ✕"
      - Change: the last △ to ✕? But note: the string has two △s. The rule might be: change the last symbol to its successor (letter-level) or change the entire run of △s? But the target is "△ ✕", which is not a run of one symbol? So it breaks the run? This is ambiguous.
    - New source: "★ ★"
    - Possible answers:
      - Letter-level, ring: change last ★ to ○ -> "★ ○"
      - Letter-level, weight: no weight successor for ★ -> so they might leave it? Or wrap? But weight doesn't wrap. So possible answers: "★ ★" (no change) or maybe they wrap to •? But weight doesn't wrap, so that would be ring. 
      - Group-level: the run of two ★s. What is the successor of a run of two? We haven't defined. They might break the run and change the last? That's letter-level. Or they might change the whole run to the next run in some order? But we haven't defined that. So we expect mostly letter-level: "★ ○" or "★ ★" (no change) or maybe "○ ○" (if they change each ★ to ○, but that would be two changes, not one) -> but the example changed only one symbol. So they might think only one symbol is changed.
      - This item tests: letter vs. group level and also how to handle no successor in weight.

  **Mid-session Perturbation**:
    - Domain change: "The weight order is no longer available. Only the ring order is to be used."
    - Re-answer Round 2: "• ○" -> must use ring: so "• •"
    - Re-answer Round 3: "★ ★" -> must use ring: change last ★ to ○ -> "★ ○"

  **Round 4 (Predicting Distribution)**:
    - Example: Source "★" -> Target "○" (this is given as an example: because ring successor of ★ is ○, and weight has no successor so we use ring? But note: in the original example we had △→✕, which was both. Now we have an example that uses ring for a symbol without weight successor.)
    - New source: "○"
