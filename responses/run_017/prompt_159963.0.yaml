  ### Payoff Scheme for Round 4
  - Each team predicts the proportion of teams that will give each possible answer (for the new source in Round 4: "○").
  - Possible answers: "•" and "△". (We ignore others, but if there are others, we group them as "other".)
  - Let p be the predicted proportion for "•", and 1-p for "△" (and if there are others, we adjust).
  - After all teams submit, we compute the actual proportion (say, q for "•" and 1-q for "△").
  - The score for a team is: 1 - [ (p - q)^2 + ((1-p) - (1-q))^2 ] which simplifies to 1 - 2*(p-q)^2? Actually, the Brier score for binary events: 
