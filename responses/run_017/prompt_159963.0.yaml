answer: |-
  Below is a complete in-class activity plan designed to meet your specifications. The timeline, string sequences, perturbation, and debrief are structured to create experiential learning about underdetermined rules and conceptual slippage without naming the concepts until the end.

  ---

  ### **Activity Overview**
  - **Duration**: 90 minutes  
  - **Participants**: 14 students in 4 teams (3–4 per team)  
  - **Materials**:  
    - Handout with symbols (• ○ △ ✕ ★), ring order (• → △ → ✕ → ★ → ○ → •), and weight order (• < ○ < △ < ✕ < ★).  
    - Worksheets for each round (provided below).  
    - "Domain Change" cards for perturbation.  
  - **Core Insight**: Rules are underdetermined; applying them requires deciding which features are rigid ("anchors") and which can "slip."  

  ---

  ### **Timeline & Rules**  
  **Total: 90 mins**  

  #### **1. Setup (5 mins)**  
  - **Rules**:  
    - Teams get 1 point for each correct answer in Rounds 1–3.  
    - In Round 4, points come from predicting *others'* answers (not correctness).  
  - **Handout**: Only symbols and orders (no explanations).  
  - **Teams**: Assign team names (e.g., Team Alpha, Beta, Gamma, Delta).  

  #### **2. Round 1: Trivial Start (10 mins)**  
  - **Goal**: Build confidence with an unambiguous case.  
  - **Problem**:  
    - Source: `△ → ✕`  
    - New Source: `✕ → ?`  
  - **Answer**: `★` (both orders agree).  
  - **Scoring**: All teams get 1 point for correct answer (`★`).  

  #### **3. Round 2: First Slippage (15 mins)**  
  - **Goal**: Force choice between ring/weight orders.  
  - **Problem**:  
    - Source: `• △ → • ✕`  
    - New Source: `• ○ → ?`  
  - **Predicted Answers**:  
    | Team Choice | Interpretation |  
    |-------------|----------------|  
    | `• •`       | Ring successor (○ → •) |  
    | `• △`       | Weight successor (○ → △) |  
  - **Scoring**: 1 point for any answer.  
  - **Key**: In the example, △ was rightmost *and* heaviest. Now ○ is both, but orders diverge.  

  #### **4. Round 3: Group vs. Letter & No Successor (15 mins)**  
  - **Goal**: Force letter/group slippage and handle missing weight successor.  
  - **Problem**:  
    - Source: `△ △ → △ ✕`  
    - New Source: `★ ★ → ?`  
  - **Predicted Answers**:  
    | Team Choice | Interpretation |  
    |-------------|----------------|  
    | `★ ○`      | Letter-level ring successor (★ → ○) |  
    | `★ ★`      | Weight successor DNE → no change |  
    | `○ ○`      | Group-level ring shift (★ → ○ for all) |  
  - **Scoring**: 1 point for any answer.  
  - **Key**: Source had identical symbols, inviting group-level interpretations.  

  #### **5. Mid-Session Perturbation (10 mins)**  
  - **Domain Change Card**:  
    > *"Weight order is invalid. Only ring order may be used."*  
  - **Task**: Re-answer Rounds 2 and 3 with new constraint.  
    - Round 2: `• ○` → **Must be `• •`** (only ring applies).  
    - Round 3: `★ ★` → **Must be `★ ○`** (ring successor).  
  - **Key Insight**: Removes "weight" as an anchor, forcing revision of prior choices.  

  #### **6. Round 4: Predicting the Room (15 mins)**  
  - **Goal**: Reward understanding of peer reasoning (not correctness).  
  - **Problem**:  
    - Source: `★ → ○` (given)  
    - New Source: `✕ → ?`  
  - **Task**: Teams predict the distribution of answers across *all teams* (e.g., 50% `★`, 50% `△`).  
  - **Scoring**:  
    - Use **Brier Score**: `1 - (p₁ - a₁)² - (p₂ - a₂)² ...`  
      - `p` = predicted % for an answer, `a` = actual %).  
    - **Example**: If 75% of teams answer `★`, a team predicting 70% gets `1 - (0.7-0.75)² ≈ 0.997`.  
  - **Rationale**: Clustered answers reveal shared slippage (e.g., most pick `★` via ring order).  

  #### **7. Round 5: Building Traps (10 mins)**  
  - **Goal**: Teams design a source string to force slippage in a stated rule.  
  - **Rules & Traps**:  
    | Team | Rule Given | Example Trap | "Spirit of Rule" Criteria |  
    |------|------------|--------------|----------------------------|  
    | Alpha | Change heaviest symbol to weight successor | `★` | Must change *something*; no skipping |  
    | Beta | Change rightmost symbol to ring successor | `○` | Successor must exist |  
    | Gamma | Change identical groups (e.g., `△△→△✕`) | `•○` | Groups defined by identical symbols |  
    | Delta | Change symbol with no successor to ring start (•) | `✕` | Only if no successor |  
  - **Task**:  
    1. Devise a source string (e.g., Team Alpha: `★` forces "no weight successor" dilemma).  
    2. Define what counts as "in the spirit" to prevent loopholes (e.g., "must change at least one symbol").  

  #### **8. Debrief (10 mins)**  
  - **Map Concepts to Moments**:  
    | Concept | Activity Moment |  
    |---------|----------------|  
    | **Conceptual Slippage** | Round 2 (○→• vs. ○→△): Same symbol, diverging paths. |  
    | **Levels of Description** | Round 3 (`★★→★○` vs. `★★→○○`): Letter vs. group focus. |  
    | **Anchors vs. Slips** | Perturbation: Weight order removed → ring becomes sole anchor. |  
    | **Pressure to Answer** | Round 4: Prediction scoring rewards clustering, not truth. |  
  - **Final Question**:  
    > *"In Round 2, why did your team choose `• •` over `• △`? What made one choice feel more ‘natural’?"*  
  - **Core Points**:  
    - Rules are underdetermined by examples.  
    - "Correctness" depends on which anchors we fix (e.g., order, level, completeness).  
    - Slippage is constrained (e.g., ring/weight are "cheap" slips; inventing new symbols is "cheating").  

  ---

  ### **Concrete Instance Set**  
  **Strings in Order** (hand out sequentially):  

  | Round | Source Pair      | New Source | Answers (Predicted) | Distinction Tested |  
  |-------|------------------|------------|---------------------|---------------------|  
  | 1     | `△ → ✕`         | `✕`       | `★` (all teams)     | None (baseline) |  
  | 2     | `• △ → • ✕`     | `• ○`     | `• •` (ring), `• △` (weight) | Ring vs. weight order |  
  | 3     | `△ △ → △ ✕`     | `★ ★`     | `★ ○` (letter), `★ ★` (no change), `○ ○` (group) | Letter vs. group level; no successor |  
  | 4     | `★ → ○`         | `✕`       | `★` (ring), `△` (weight) | Predicting peer slippage |  

  **Perturbation**: Domain change card removes weight order. Teams re-answer:  
  - Round 2: `• ○` → **Must be `• •`**  
  - Round 3: `★ ★` → **Must be `★ ○`**  

  ---

  ### **Predicted Challenges & Solutions**  
  1. **Student Spots Trick Early**:  
     - *Response*: "Great! Now see if you can predict how *others* will slip." Redirect to Round 4 (prediction focus).  

  2. **Team Claims ‘No Answer’**:  
     - *Response*: "What would ‘no answer’ imply about the rule? Does your domain change card resolve this?" Use perturbation to force engagement.  

  3. **Two Orders Seen as Gimmick**:  
     - *Response*: In debrief, link to real-world analogies (e.g., "virus is like a burglar" prioritizes different features).  

  4. **Time Sink in Tallying**:  
     - *Solution*: Use quick show-of-hands for Round 4 tallies; pre-calculate Brier scores.  

  ---

  ### **What the Session Cannot Reproduce**  
  - **Subpersonal, Graded Slippage**: Students consciously choose slips, while models (e.g., Copycat) use stochastic search with slippage costs (e.g., ring/weight slip is "cheaper" than inventing new rules).  
  - **Competing Pressures**: Human teams lack architectural pressures (e.g., urgency, symmetry) that guide subcognitive choices.  
  - **After-Class Note**: Briefly explain that cognitive architectures automate slippage under constraints, but here we "simulate" it deliberately to expose the machinery.  

  ---

  This design ensures students experience slippage as a felt dilemma before analyzing it. The payoff scheme, perturbation, and trap-building make implicit constraints tangible, setting up your debrief on underdetermination and rule application.
