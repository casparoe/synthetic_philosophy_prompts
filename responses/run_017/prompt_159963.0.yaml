    Then for "○", the possible answers are:
      - Ring: "•"
      - Weight: "△"

    Teams predict the distribution: what percentage of teams will say "•" and what percentage "△"?

  **Round 5 (Building Traps)**:
    - Assign each team a rule, e.g.:
      - Team A: "Always change the heaviest symbol to its weight successor."
      - Team B: "Always change the rightmost symbol to its ring successor."
      - Team C: "Change the symbol that is both the heaviest and the rightmost to its ring successor." (if it has one, else do nothing)
