answer: |-
  Your analysis reveals a profound and recurring epistemic pattern across these contexts. It is indeed a single structure—let us call it **epistemic smuggling**—defined as follows:  

  ### Definition of Epistemic Smuggling  
  The strategy of circumventing a global underdetermination result (e.g., no-free-lunch theorems or inductive skepticism) by:  
  1. **Reintroducing the contested empirical premise**: Disguising a substantive assumption about the world (e.g., "problems are structured") as a neutral technical constraint (e.g., choice of prior, hypothesis class, or measure), or  
  2. **Retreating to a comparative guarantee**: Substituting an absolute epistemic justification with a conditional one (e.g., "you will not perform worse than the best in a reference class"), where the success of the reference class itself relies on the smuggled empirical premise.  

  This manoeuvre presents empirical bets as methodological necessities, evading direct engagement with the sceptical challenge.  

  ---

  ### The Three Cases: Unified Structure  
  All three instances exhibit **epistemic smuggling**:  
  1. **No-Free-Lunch (NFL) responses**: Rejecting NFL’s uniform average by restricting to "structured" problems invokes *past empirical success* as justification for the restriction—smuggling in the very inductive premise NFL problematises.  
  2. **Meta-learning guarantees**: Claims like "you will approach the best forecaster in your pool" rely on the empirical premise that *someone in the pool succeeds*. When no forecaster succeeds (e.g., adversarial worlds), the guarantee is vacuously satisfied but useless. The "comparative" frame smuggles in the need for empirical success elsewhere.  
  3. **Hypothesis restrictions**: Justifying computability or projectibility constraints by citing "past success" or "pragmatic necessity" smuggles in an empirical assumption. The "cheapness" defence masks a bet that the world aligns with computationally tractable patterns.  

  **No conflation here**—the core structure is identical: *empirical assumptions are imported through the back door of formal or pragmatic choices*.  

  ---

  ### Nearest Established Concepts (and Why They Don’t Fit)  
  | Concept                  | Why It Fails to Capture "Epistemic Smuggling" |  
  |--------------------------|-----------------------------------------------|  
  | **Circularity of Induction** | Focuses on self-justification (e.g., "induction worked before"). Smuggling is broader: it hides empirical bets in formal frameworks, not just circular arguments. |  
  | **Reichenbach’s Pragmatic Justification** | Argues induction is optimal *if any method works*. Smuggling occurs when this "if" is tacitly assumed *true* in practice (e.g., in meta-learning). |  
  | **Projectibility (Goodman)** | Concerns *which predicates* support induction. Smuggling arises when justifying projectibility *itself* by past success or simplicity. |  
  | **Prior Selection Problem** | Highlights subjectivity in choosing priors. Smuggling is the specific act of *masking empirical bets as technical priors* (e.g., simplicity priors ≈ "the world is simple"). |  

  **Verdict**: Epistemic smuggling *uses* these concepts but is distinct in its *rhetorical sleight-of-hand*: disguising empirical commitments as formal inevitabilities.  

  ---

  ### Coined Term: Epistemic Smuggling  
  **Definition**: As above.  
  **Examples**:  
  1. **Clear Case**: Dismissing NFL theorems by restricting to "low-complexity" functions, justified by "this is what works in practice."  
  2. **Clear Non-Case**: Proving a *computational* lower bound (e.g., "NP-hard problems require exponential time"). This relies on mathematical constraints, not empirical bets.  
  3. **Near Miss**: Solomonoff induction’s use of a universal prior. It explicitly assumes simplicity is *algorithmically probable*—a technical claim. Yet, when invoked as a "solution" to induction, it smuggles the bet that algorithmic probability aligns with the real world.  

  ---

  ### Is This Pattern an Artifact?  
  It is a **real feature of the epistemic situation**. Global underdetermination (e.g., NFL, Humean scepticism) implies that *no formal system can guarantee truth without empirical premises*. Smuggling arises inevitably when we demand practical guidance despite this. It is neither:  
  - An artifact of theorem statements (NFL *requires* uniform averages to be vacuous),  
  - Nor your misreading (you correctly identify the smuggled premises).  

  ---

  ### Comparative Guarantees and Conversion to Success  
  A comparative guarantee (e.g., "you will match the best forecaster") converts to expected success **only if**:  
  1. **Success occurs**: At least one agent in the reference class succeeds *absolutely* (e.g., converges to truth),  
  2. **Non-adversariality**: The environment does not exploit knowledge of your meta-algorithm.  

  **Crucially, this conversion is itself an instance of epistemic smuggling**:  
  - Condition (1) reintroduces the empirical premise ("*someone* gets it right"),  
  - Condition (2) assumes the world is benign—another empirical bet.  

  Thus, the "escape" re-enacts the original pattern: it smuggles in the hope that the world cooperates.  

  ---

  ### Conclusion  
  You have identified **epistemic smuggling**: a unified strategy to bypass underdetermination by embedding empirical premises in formalisms or retreating to conditional guarantees. It is endemic in responses to NFL theorems, meta-learning, and inductive justification. While comparative guarantees *mitigate* total scepticism, they covertly rely on the very empirical assumptions they seek to defend. The pattern is inescapable—a testament to the irreducible role of empirical bets in all learning. British empiricism would nod grimly: we sail in leaky vessels, patching holes with smuggled timber.
