prompt: |-
  Hi — I'm on the attributions panel at a decent-sized museum (paintings and sculpture, mostly European, plus a modern bit) and we've got a case next month that I think exposes us. Our verdicts so far, for whatever there worth: a Roman marble figure that's a copy of a lost Greek bronze — we labelled it 'Roman copy after a Greek original' and refused the big name; a huge 17th-century workshop canvas where the master painted the heads and hands and the shop did the draperies, finishing them after he died — 'workshop of', no bare 'by'; a set of enormous shiny sculptures by a very famous living artist who has never physically touched any of them (they're built by technicians from his computer files and he's happy to call them his) — 'by'; a signed readymade from the 1910s, a factory-made object he simply chose, whose original got smashed and was replaced in the 1960s with a new example of the same model that he authorised — we accepted the replacement as the work itself; a print made after the photographer's death from his own negative, by a printer following written instructions he'd left — 'by', with the print date in brackets; and a painting we now know was done start to finish by a forger in the 1920s, which has been on our walls for eighty years and is genuinely lovely — we refused the attribution but kept it up under a new label saying 'imitator of'.

  Now the new one. A sculptor who died in 2019 worked with a fabricator and had shown a piece only in plaster, but her studio notes (in her hand, undated) specify a bronze edition of six, the foundry and the patina. She had one bronze pulled from those moulds in 1998 and signed it off; that bronze was destroyed in a warehouse fire in 2005. The foundation she set up has now had a new bronze cast from the same moulds and wants to give it to us as 'by [her], cast 2024'. The valuation on the gift form is roughly fifteen times what it would be if we call it 'after' — which its not supposed to matter to us but, you know, it does.

  What I want is exactly five numbered points, a sentence or two each, no intro and no conclusion. 1) The two or three rules about what an attribution actually asserts that fit all six of those earlier verdicts — I can think of maybe 'the artist's hand', 'the artist said so', and something about the label being a claim with money riding on it, but you'll do it better. 2) What each of those rules says about the 2024 bronze, including whether it matters that she signed off a cast from these very moulds in 1998. 3) Your best guess at what we'll actually decide, and why that rule rather than the others. 4) The closest analogue among the six precedents, and whether it's really close. 5) The one further case we'd have to rule on that would best tell the surviving rules apart. If you think we've allready been inconsistent somewhere, say where — that can slot into whichever point it belongs in.
reasoning: |-
  Okay, let me tackle this museum attribution puzzle step by step. The user presents six complex precedent cases and a new dilemma about a posthumous bronze cast, requesting a structured five-point analysis. 

  First, I need to extract the core principles from their past decisions. Looking at the Roman copy, workshop painting, fabricated sculptures, replaced readymade, posthumous print, and forgery, three consistent rules emerge: physical execution (whether the artist touched it), intentional authorization (explicit approval), and functional identity (does it serve as the artwork regardless of material form). 

  For the 2024 bronze, the artist authorized a 1998 cast but not this one. The physical rule would reject it since she never touched this object, but the authorization rule is ambiguous—her notes specify an edition but don't cover posthumous re-casting. The functional identity rule might accept it since the mold is original, echoing their readymade replacement precedent.

  I suspect the museum will approve "by [artist]" citing functional identity, prioritizing the artwork's conceptual continuity over material history. The destroyed 1998 bronze and the readymade replacement form the closest parallel, though imperfect—the readymade had the artist's direct approval for substitution, while here only the edition concept was pre-authorized.

  To stress-test these rules, they'd need a case where physical execution and authorization conflict directly—like an artist-assigned fabricator altering a work against instructions. That would force clarity on whether intentionality or materiality dominates. 

  Notably, their living artist's fabricated sculptures decision (prioritizing authorization over touch) already leans toward intentionality, making functional identity the likely governing principle here. The valuation pressure might unconsciously sway them, but the precedents suggest a deeper consistency in valuing artistic will over mere material.
answer: |-
  Here are five numbered points addressing your query:

  1. **Core Attribution Rules**  
     Your verdicts consistently assert three principles: **physical execution** (direct hand of the artist, as in rejecting the forgery), **explicit authorization** (artist’s documented intent, e.g., the living sculptor’s approval of fabrication), and **functional identity** (the work’s conceptual essence transcends material form, as with the readymade replacement or posthumous print).

  2. **Application to the 2024 Bronze**  
     Physical execution is absent (she never touched this cast). Authorization is partial: her notes specify a *potential* bronze edition but lack dating or posthumous casting consent. The 1998 sign-off validates the *moulds and patina* but not this specific object. Functional identity is arguable—it replicates her approved prototype but exists outside her lifetime oversight.

  3. **Predicted Verdict & Governing Rule**  
     You will likely label it "**by [Artist], cast 2024**", prioritizing **functional identity**. The precedent of the readymade (replacement authorized) and posthumous print (instructions followed) supports treating the work as conceptually intact despite new material instantiation. The valuation pressure unconsciously reinforces this, but the logic mirrors existing flexibility on materiality.

  4. **Closest Precedent & Limitations**  
     The **readymade replacement** is the strongest analogue: both involve artist-authorized substitutions of lost originals. However, it’s imperfect—the readymade artist *explicitly endorsed the replacement*, while here the sculptor’s authorization (notes, 1998 sign-off) applies to the *edition concept*, not this posthumous act. The posthumous print is secondary, as it followed explicit instructions.

  5. **Test Case to Clarify Rules**  
     Consider a scenario where **an artist’s fabricator creates a variant *against* documented instructions** (e.g., altering proportions). Would you label it "by" (prioritizing the artist’s initial concept/authorization of the fabricator) or "after" (prioritizing strict adherence to intent)? This forces a choice between *authorization* and *functional identity* when they conflict.

  **Inconsistency Note**: The workshop painting ("workshop of") prioritizes physical execution (master’s hand), while the fabricated sculptures ("by") prioritize authorization/concept. The 2024 bronze decision would extend the latter logic, revealing a contextual hierarchy of rules.
