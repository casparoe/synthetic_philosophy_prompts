prompt: |-
  I'm a third-year PhD in philosophy (Chinese philosophy, philosophy of language, depends who's in the room) and somehow I've ended up as the 'philosophy person' on our university museum's Interpretation and Visitor Experience Committee — I think it was punishment for complaining about the labels in the last show. My supervisor thinks its a monumental waste of my writing-up year and she's probably right, but here we are. There's a small exhibition opening in about six weeks, mostly on loan from a partner museum in Xi'an, on naming and language in early China: about a dozen objects, and two of the wall texts are completely stuck. I have to bring a recommendation to Tuesday's meeting, because the texts go to the printer on the 14th and after that we're locked in whatever happens.

  Object 7 is a Tang white-glazed ceramic horse. The curator wants the label to end: 'Gongsun Long would have said this is not a horse.' Our head of learning says that if we tell a group of nine-year-olds that a white horse isn't a horse we'll get letters from parents and possibly a visit from a councillor, and she wants: 'a white horse is not the same thing as horses in general.' I think both are slightly wrong, and my own hobby-horse is that the interesting claim is about names rather than animals — the name 'horse' picks out a shape-kind, 'white' picks out a colour-kind, and the compound name fits neatly under neither, so what's really being denied is that the name 'horse' correctly applies to a white horse as such, which is a claim about correct naming and not about zoology at all. Object 9 is worse: a carved white marble, with the other bit of Gongsun Long, where the argument is that you see the whiteness and you feel the hardness, so the two come apart, and the stone itself ends up as a third thing over and above them. The drafted label says the whiteness and the hardness of this stone are two different things and the stone is a third. Our head of learning says that's both false and incomprehensible. Complicating all of this: the partner museum's English catalogue, which they've already printed and asked us not to contradict, states the claim flatly with no hedging whatsoever; the learning team have dwell-time figures showing the baffling labels are exactly the ones visitors stop at; and the museum's plain-language policy says labels must not be 'deliberately obscure'.

  What I need is the memo I'll circulate on Monday night: around 800 words, bottom line first, recommending a concrete decision with the actual words you'd put on both labels, plus a principle short enough that the curator and the head of learning could apply it to the other ten objects without ringing me, plus one paragraph giving the strongest version of the position you're telling me to vote down — and if you think that position actually wins, say so and be straight with me about what my names-not-animals reading is costing me. Please write it in British English; house style is -ise endings and single quotes.
reasoning: |-
  Okay, let me tackle this museum label dilemma for the philosophy PhD student. They're stuck between a curator who wants provocative Gongsun Long quotes and a learning head who demands simplicity, all while juggling academic accuracy and visitor experience. 

  First, I need to unpack both object scenarios. For the ceramic horse (Object 7), the core tension is between the curator's "this is not a horse" phrasing and the learning head's "not the same as horses in general" alternative. The user's philosophical insight—that this is about names referring to shape-kinds versus color-kinds—feels crucial here. But their hobbyhorse about names-not-animals must be balanced against the partner museum's uncompromising catalogue and dwell-time data showing confusing labels actually engage visitors.

  The marble stone (Object 9) is trickier. The drafted label's claim that whiteness/hardness are separate entities with the stone as a "third thing" is philosophically dense. The learning head isn't wrong about visitor bafflement, but simplifying it to "we see color and feel texture" loses Gongsun Long's radical point about properties having independent existence.

  I'm considering a compromise approach: preserve the provocative phrasing but scaffold it with clear explanations. For the horse, something like "Gongsun Long famously argued: 'A white horse is not a horse'" immediately followed by "He meant..." to frame it as linguistic philosophy. The user's names-not-animals reading should anchor this—it's the perfect bridge between accuracy and accessibility.

  The partner museum's catalogue poses a real constraint. We can't contradict it directly, but we can contextualize. The dwell-time data suggests visitors grapple with complexity when given hooks—so maybe we lean into the paradox while providing intellectual handrails.

  For the memo structure: bottom-line recommendations first with exact label wording, then a universal principle about "provocation with explanation" that staff can apply independently. The rejected positions need fair representation—especially the curator's view that raw philosophical statements spark curiosity, even if it risks complaints.

  British English and house style are non-negotiables. Single quotes for concepts, -ise endings, and that dry academic wit the user naturally employs. The tone should respect their expertise while acknowledging institutional realities—this is a PhD student caught between warring museum factions after all.

  The marble label solution might borrow from contemporary philosophy of perception terminology—"properties we experience separately" rather than "different things"—to avoid reification claims. But we must explicitly flag how this differs from Gongsun Long's original intent, per the user's reading. Transparency about interpretive trade-offs feels essential.
answer: |-
  ### INTERNAL MEMORANDUM  
  **To:** Interpretation & Visitor Experience Committee  
  **From:** [Your Name], Philosophy Liaison  
  **Date:** Monday, [Date]  
  **Subject:** Label Recommendations for Objects 7 & 9 (Xi'an Exhibition)  

  ---

  ### BOTTOM LINE  
  Approve revised labels for Objects 7 and 9 as follows:  
  - **Object 7 (Ceramic Horse):**  
    *‘Gongsun Long famously argued: “A white horse is not a horse”. He meant that the name “horse” refers to shape, while “white” refers to colour. A “white horse” combines both – so it cannot be fully captured by either name alone. This challenges how words classify reality.’*  
  - **Object 9 (Marble Stone):**  
    *‘Gongsun Long’s philosophy suggests that whiteness (seen) and hardness (felt) are distinct properties. This stone unites them – but he argued that we experience each property separately, making the stone more than the sum of its qualities.’*  

  **Principle for All Labels:**  
  > *Preserve provocative philosophical claims verbatim only if immediately scaffolded by plain-language context explaining what the philosopher is doing (e.g., “He meant…”, “This challenges…”, “Here, [Philosopher] explores…”).*  

  ---

  ### RECOMMENDED LABELS WITH RATIONALE  
  **1. Object 7: Tang White-Glazed Horse**  
  **Proposed Label Text:**  
  > *‘This horse reflects Tang dynasty aesthetics. Gongsun Long (c. 320–250 BCE) famously argued: “A white horse is not a horse”. He meant that the name “horse” refers to shape, while “white” refers to colour. A “white horse” combines both – so it cannot be fully captured by either name alone. This challenges how words classify reality.’*  

  **Why this works:**  
  - **Honours the Catalogue/Curator:** Uses Gongsun Long’s exact phrase in single quotes, satisfying the partner museum and curator.  
  - **Prevents Parental Fury:** The scaffold (“He meant…”) immediately demystifies the paradox for children and non-specialists.  
  - **Centres Language (Your Hobby-Horse):** Explicitly frames the debate as about *names* (“refers to”, “captured by names”) not zoology.  
  - **Dwell-Time Friendly:** The provocative quote grabs attention; the explanation rewards engagement without baffling.  
  - **Plain-Language Compliant:** No jargon; active verbs; concrete concepts (shape, colour, words).  

  **2. Object 9: Carved White Marble**  
  **Proposed Label Text:**  
  > *‘White marble was prized for its purity. Gongsun Long’s philosophy suggests that whiteness (seen) and hardness (felt) are distinct properties. This stone unites them – but he argued that we experience each property separately, making the stone more than the sum of its qualities.’*  

  **Why this works:**  
  - **Avoids “Third Thing” Metaphysics:** Replaces the curator’s abstract “three things” (stone, whiteness, hardness) with accessible language about *properties* and *experience*.  
  - **Retains Philosophical Core:** Captures Gongsun Long’s point about the separation of sensory qualities without reifying them as independent entities.  
  - **Tangible for Visitors:** Uses verbs (“seen”, “felt”, “experience”) to ground abstraction in bodily senses.  
  - **Aligns with Catalogue (Indirectly):** Interprets the partner museum’s blunt claim (“whiteness and hardness are two different things”) through an experiential lens without contradiction.  

  ---

  ### THE STRONGEST VERSION OF THE REJECTED POSITION  
  **The Curator’s View (And Why We Overruled It):**  
  *‘Gongsun Long’s paradoxes are radical ontological claims: a white horse literally fails to be a horse because “horseness” excludes colour; whiteness and hardness exist independently of the stone that manifests them. Presenting these claims raw – e.g., “This is not a horse” – forces visitors into direct confrontation with ancient Chinese thought, bypassing modern assumptions. The resulting cognitive dissonance is pedagogically valuable, and dwell-time data proves visitors engage deeply with unvarnished provocations. Compromise dilutes philosophy into platitudes.’*  

  **Does This Position Win?**  
  **No, but it costs you.** Academically, the curator’s reading is defensible (Gongsun Long *is* making ontological claims about attributes). Your “names-not-animals” emphasis privileges linguistic philosophy over metaphysics – a valid interpretive choice, but one that sidesteps the deeper, more unsettling question of *what exists*. By framing the paradoxes as about language, you sacrifice:  
  - The radical edge of Gongsun Long’s realism about universals (whiteness exists apart from stones).  
  - A chance to showcase Chinese philosophy’s divergence from Western nominalism.  
  **However:** This cost is institutionally necessary. Your reading is the only viable bridge between scholarly accuracy, plain-language policy, child-safety concerns, and diplomatic respect for the partner museum’s materials.  

  ---

  ### APPLICATION PRINCIPLE FOR OTHER LABELS  
  **Universal Scaffolding Rule:**  
  > *When a label cites a philosopher’s provocative claim:  
  > 1. **Quote it verbatim** (if short).  
  > 2. **Immediately follow with:** “Here, [Name] argues/explores/challenges…” or “This means…”.  
  > 3. **Anchor in concrete human experience** (seeing, naming, touching) or universal concepts (shape, colour, language).*  

  **Example Adaptation:**  
  - *Curator’s Draft:* “Zhuangzi said ‘I dreamt I was a butterfly’.”  
  - **Revised Per Principle:** *‘Zhuangzi wrote: “I dreamt I was a butterfly”. This explores how reality and illusion blur – challenging us to question what we know for certain.’*  

  ---

  ### SUMMARY  
  Approve the revised labels for Objects 7 and 9. They balance scholarly integrity, visitor clarity, partner-museum diplomacy, and dwell-time potential. The **scaffolding principle** empowers staff to resolve similar disputes for other objects without consultation. Your linguistic emphasis, while softening Gongsun Long’s ontology, is the price of making 2,300-year-old paradoxes legible to nine-year-olds and professors alike.  

  **Final Note:** If the Head of Learning insists on deleting “is not a horse” entirely, fall back to: *‘Gongsun Long argued that calling this a “white horse” challenges how names work…’* – but the recommended version better serves all stakeholders.  

  ---  
  **cc:** Head of Learning, Lead Curator, Director of Collections
