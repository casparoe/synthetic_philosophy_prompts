  ### Notes on Tree Structure
  1. **Empty Branches & Why**:  
     - *Q3 → No + Q4 → Yes*: Unoccupied. Incoherent—rejecting help for wheelchair user (resource focus) but endorsing help for expensive tastes (welfare focus) is contradictory.  
     - *Q1 → No + Q3 → No + Q5 → No + Q7 → No + Q9 → Lift Y + Q10 → Yes*: Unoccupied. Unattractive—prioritizing worst off only for trivial gains is inconsistent.  

  2. **Equality of Slack Outcome**:  
