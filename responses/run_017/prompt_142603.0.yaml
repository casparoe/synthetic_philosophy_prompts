  3. **Indistinguishable Pairs**:  
     - **Leximin vs. Prioritarianism**: Distinguishable only with tiny gains (Q10). Without this, they collapse into "priority to worst off."  
     - **Sufficientarianism vs. Prioritarianism**: Fully separated by Q7 (threshold vs. depth of need).  

  4. **Case Coverage**:  
