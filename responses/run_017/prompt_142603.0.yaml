  Below is a decision tree designed to clarify positions on emergency grant allocation. It uses concrete cases (including your specified applicants) and avoids theoretical language. Each node is a binary choice about pairwise comparisons or individual cases. The tree has 10 questions and 12 leaves, covering all requested positions. Empty branches are noted, and "equality of slack" is evaluated fairly.

  ### Decision Tree Flowchart
  **Start with Q1.**

  **Q1:** *Applicant D (who blew last term's grant) and an identical applicant who didn't blow a grant both need funds now. Should D get less?*  
  - **Yes** → Responsibility matters. Go to Q2.  
  - **No** → Responsibility irrelevant. Go to Q3.  

  **Q2:** *Applicant A (unchosen expensive tastes) needs more than average for basic well-being. Should they get extra?*  
  - **Yes** → Go to Q8.  
  - **No** → Leaf: **Luck-egalitarian equality of fortune** (penalize choice, compensate only brute luck).  

  **Q8:** *Applicant B (cheerful with little) would be happy with less than others. Should they get less?*  
  - **Yes** → Leaf: **Arneson-style equality of opportunity for welfare** (adjust for ease of achieving welfare).  
  - **No** → Leaf: **Cohen-style access to advantage** (neutralize unchosen disadvantages, ignore temperament).  

  **Q3:** *Applicant C (wheelchair user) needs extra $ for mobility. An able-bodied peer with the same income gets more mobility for free. Should C get extra funds?*  
  - **Yes** → Go to Q4.  
  - **No** → Leaf: **Rawls-style primary goods** (equalize resources, ignore differential needs).  

  **Q4:** *Applicant A (unchosen expensive tastes) needs more than average for basic well-being. Should they get extra?*  
  - **Yes** → Leaf: **Strict egalitarianism** (welfare-based: equalize well-being).  
  - **No** → Go to Q5.  

  **Q5:** *Applicant E (PhD with precarious funding) and a peer have identical current income, but E could lose everything if their supervisor acts. Should E get extra?*  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q7.  

  **Q6:** *Two applicants: F (anxious, no savings, one mishap from ruin) and G (same income/expenses as F but with savings buffer, calm). Both face equal current hardship. Should F get more?*  
  - **Yes** → Leaf: **Equality of slack** (equalize margin for error against shocks).  
  - **No** → Leaf: **Sen/Nussbaum-style capabilities** (equalize freedoms/functionings, not buffers).  

  **Q7:** *Applicant X is far below sufficiency (e.g., food-insecure). Applicant Y is closer to sufficiency (e.g., needs books). You can only help one. Prioritize Y?*  
  - **Yes** → Leaf: **Sufficientarianism** (get everyone above a threshold).  
  - **No** → Go to Q9.  

  **Q9:** *Applicant X is at 10% of a decent life. Applicant Y is at 30%. A grant could lift X to 11% or Y to 60%. Which is better?*  
  - **Lift X (11%)** → Go to Q10.  
  - **Lift Y (60%)** → Leaf: **Prioritarianism** (weighted priority to worse off, but large gains matter).  

  **Q10:** *Applicant X is at 10% of a decent life. Applicant Z is at 11%. A tiny grant lifts X to 10.1% or Z to 11.1%. Prioritize X?*  
  - **Yes** → Leaf: **Leximin** (always maximize the very worst off).  
  - **No** → Leaf: **Prioritarianism** (small gains to worst off can be outweighed).  

