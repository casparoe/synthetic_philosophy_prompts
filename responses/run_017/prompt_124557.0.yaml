prompt: |-
  I'm retired — spent my working life in a lab, protein NMR of all things — and for about a year now I've been sitting in on a philosophy/cognitive science reading group at the university near me. The chap who runs it has been going through the frame problem, and I've started noting down his verdicts on which setups actually "have" it, because they strike me as less consistent than he seems to think.

  His verdicts so far:

  - the old story where a symbolic planner has to work out whether pulling its wagon out of the room also moves the bomb that's sitting on the wagon: yes, textbook case
  - a blocks-world planner, six blocks, four operators, closed list of actions: no — he says the domain's too small, there's nothing to choose between
  - a chess program: no
  - a bat catching a moth: no. An ant finding its way back to the nest: also no
  - a driver who is absorbed in the driving and has to notice that the brake lights ahead matter: no, and he got quite sharp about it, said that if this counts then the subject has been changed
  - a hand-built rule-based system for diagnosing diesel engines, few hundred rules, curated by its engineers: no, that's a maintainence headache, not the frame problem
  - a robot that re-perceives the whole world from scratch each step and carries nothing over from one step to the next: no, nothing to update

  Next week's case, which I'm fairly sure he hasn't pre-judged, is this: a household robot trained end-to-end by deep RL in a rich simulated house — no symbolic state, no explicit beliefs, no frame axioms, just pixels plus a spoken instruction in and joint torques out. At test time you tell it to move the vase somewhere the cat can't reach, and the cat was never in its training data. It fails in a way that looks exactly like a relevance failure: it ignores the cat completely, shoves a chair, and doesn't reconsider anything afterwards.

  What I want from you: say whether he'll call that a case of the frame problem, and set out the two or three candidate rules his track record is equally compatible with, and what each one predicts here. My own suspicion is that the label has quietly been doing three different jobs — working out what has NOT changed, working out which of the things that might change matter right now, and working out what to give up when something does change — and that the deep RL robot has the second without the first, which may be why I can't tell what he'll say. Tell me which rule you think he's really running, commit to a prediction on the new case with your reasons, and then tell me what further case I should put to him that would finally seperate the rules. Don't hand me a menu without picking from it — I can get that from the reading group itself.
reasoning: |-
  Okay, let's tackle this retired NMR scientist's query about the frame problem in cognitive science. The user has been tracking a professor's verdicts on various scenarios and wants to predict how he'll classify a deep RL household robot case. 

  First, I need to parse the professor's pattern. His "yes" to the bomb-and-wagon scenario is classic - it's about the computational burden of tracking unchanged properties. But he rejects cases like blocks-world (too small), chess (no relevance ambiguity), biological systems (not computational), driver attention (different issue), and the diesel engine system (maintenance problem). 

  Hmm, his rejections cluster around three themes: scale (too trivial), nature (non-symbolic systems), or misclassification (attention/maintenance). The active ingredient seems to be: does the system have to *deductively prove non-change* for countless properties? That fits his "yes" to bomb/wagon and "no" to blocks-world (small fixed properties) and re-perceiving robot (no persistence at all).

  Now the new case: a deep RL robot failing on an out-of-distribution cat. The user suspects this is a relevance failure (second aspect) without persistence tracking (first aspect). But the professor's history suggests he separates these. The RL bot doesn't model persistence deductively - it lacks symbolic state and frame axioms entirely. Its failure stems from generalization limits, not computational overload from inferring non-changes. 

  Prediction: he'll say no. Why? 1) No symbolic representation requiring persistence proofs 2) The failure mode is data distribution shift, not combinatorial explosion of frame axioms. 

  To test this, propose a hybrid case: a symbolic planner with frame axioms that's been given *too many irrelevant fluents*. If it bogs down calculating vase-color persistence while the house burns, that's pure frame problem. Whereas if it ignores the fire because "house_burning" wasn't in its action preconditions, that's relevance failure. That'll force the distinction.

  The user's onto something - the term is overloaded. But the professor's pattern suggests he's anchored to McCarthy and Hayes' original formulation: the deductive persistence burden in symbolic systems. Will be fascinating to see if next week proves this right.
answer: |-
  Based on your meticulous notes and analysis of the professor's pattern, I'll commit to a clear prediction, identify the likely underlying rule he's using, propose a critical test case, and explain why the "three jobs" suspicion is astute.

  **Prediction for the Deep RL Robot Case:**  
  He **will NOT classify this as the frame problem.**

  **Reasons:**  
  1.  **Lack of Symbolic Representation & Deductive Reasoning:** His "yes" cases (bomb/wagon) and "no" cases (blocks-world-too-small, chess, rule-based engine) hinge on the system *explicitly representing properties/states and using logical deduction*. The RL robot lacks symbolic state, explicit beliefs, and deductive inference. Its failure stems from generalization limits in its learned policy, not the combinatorial burden of proving non-change.
  2.  **Nature of the Failure:** He sharply distinguished the "driver absorbed" case (attentional selection) from the frame problem. The RL robot's failure – ignoring the novel cat – is fundamentally an *attentional/relevance learning failure* or a *failure of generalization*, akin to the driver not noticing brake lights, not a failure to *deductively propagate state persistence*.
  3.  **The "No Carry-Over" Precedent:** His rejection of the robot that "re-perceives the whole world from scratch each step" because there's "nothing to update" shows he sees persistence (or the need to model it) as core. The RL robot *does* implicitly model persistence via its recurrent state or learned dynamics, but this persistence isn't *explicitly reasoned about* or represented symbolically. It doesn't fit the *deductive burden* paradigm.
  4.  **Scale vs. Mechanism:** While he mentioned scale for blocks-world, the chess program rejection (massive state space, but fixed rules/goals) shows scale alone isn't sufficient. The *mechanism* (symbolic deduction on represented fluents) is key. RL lacks this mechanism.

  **His Likely Underlying Rule (The "McCarthy-Hayes Core"):**  
  Based on his pattern, the rule he's *actually* applying seems to be:  
  **"Does the system face a combinatorial explosion *specifically* because it must *deductively prove* (using explicit symbolic representations and frame axioms) that the vast majority of *represented fluents* remain *unchanged* by an action, in order to update its world model?"**

  *   **Fits Yes:** Bomb/Wagon requires deducing non-change (wheels still round? bomb still on?) among many irrelevant fluents.
  *   **Fits No:**
      *   Blocks-world/Chess: Fixed, small set of relevant fluents; changes are exhaustively defined by operators/rules. No "vast majority" of irrelevant fluents needing persistence proofs.
      *   Bat/Ant/Driver: No explicit symbolic deduction about fluents; biological/attentional mechanisms bypass the need for deductive persistence proofs.
      *   Rule-Based Engine: Failure mode is rule interaction/maintenance, not deductively proving sensor X *didn't* change when replacing part Y.
      *   Re-perceiving Robot: No persistence *to* prove. No world model to update.
  *   **Predicts RL Robot No:** No symbolic fluents, no deductive proof about persistence, no frame axioms. Failure is learning/generalization, not deductive combinatorics.

  **Alternative Rules His Pattern *Could* Support (But Likely Doesn't):**  
  1.  **"Combinatorial Relevance" Rule:** "Does the system struggle to select which *potential* changes (effects or observations) are *relevant* to its current goal/action from a combinatorially large space of possibilities?"
      *   *Fits:* Bomb/Wagon (many irrelevant possible effects), Blocks-world *could* fit if scaled up massively (but he said no - scale matters here). Fits Driver (selecting relevant stimuli) *and* RL Robot (failing to recognize novel cat as relevant).
      *   *Doesn't Fit:* His sharp "no" on Driver and "no" on Rule-Based Engine (relevance *is* an issue there).
      *   *Prediction for RL Robot:* YES (but he'll likely say no, disproving this as his primary rule).
  2.  **"Persistence Modeling Burden" Rule:** "Does the system incur a significant cost (computational, design, brittleness) in determining or modeling *what stays the same* when an action is performed or the world changes?"
      *   *Fits:* Bomb/Wagon (deductive cost), Rule-Based Engine (maintenance cost - implicitly updating persistence assumptions?), RL Robot (implicit cost in learning dynamics model - failure shows brittleness). Fits Re-perceiving Robot "no" (avoids cost by not modeling persistence).
      *   *Fits Less Well:* His "no" on Blocks-world/Chess seems odd under this rule (they *do* model persistence efficiently via operators/rules). His "no" on Driver/Bat/Ant is clear (persistence is handled non-computationally).
      *   *Prediction for RL Robot:* YES or AMBIGUOUS (but he'll likely say no, leaning against this).

  **The Crucial Test Case to Separate the Rules:**  
  Propose this scenario: **A *Symbolic* Planner with Frame Axioms in a *Massively* Over-Specified Domain.**

  *   **Setup:** A classical STRIPS-like planner with frame axioms. The domain is "cleaning the kitchen." However, the state includes *thousands* of utterly irrelevant, persistent fluents meticulously cataloged by an overzealous engineer (e.g., `(color wall_north red)`, `(atomic_number floor_tile_silicon)`, `(curvature spoon_3 0.002)`, `(president usa biden)`, `(capital france paris)`...). Only a tiny fraction (`(dirty floor)`, `(on counter vase)`) are relevant to the cleaning actions. Actions only change relevant fluents.
  *   **Problem:** The planner is asked "Fetch the mop." It spends minutes/hours generating and proving frame axioms for the thousands of irrelevant fluents (`prove (color wall_north red) persists after (walk_to_cleaning_closet)`, etc.) before it can even start planning the path.
  *   **Compare to RL Robot:** This planner *does* explicitly model persistence and uses deduction. Its failure is purely the *deductive burden of proving non-change* for a vast number of irrelevant fluents – the core Frame Problem as defined by McCarthy & Hayes.
  *   **Why it Separates the Rules:**
      *   **His Likely Rule (McCarthy-Hayes Core):** CLEAR YES. Textbook combinatorial explosion from deductive persistence proofs on irrelevant fluents.
      *   **Combinatorial Relevance Rule:** YES (but for *effect* relevance, not *persistence* relevance). This case highlights the distinction: the planner knows the *effects* of `walk` are minimal; its burden is *proving persistence* of the irrelevant stuff.
      *   **Persistence Modeling Burden Rule:** YES. The cost is explicit and overwhelming.
      *   **Prediction:** He will say YES. If he hesitates or says no, it fundamentally challenges your understanding of his pattern. If he says yes, it strongly confirms the "deductive persistence proof burden" as his core criterion, and the RL robot case was correctly excluded due to lacking symbolic deduction.

  **Your "Three Jobs" Insight is Correct:**  
  You've hit the nail on the head. "The Frame Problem" is indeed used ambiguously for at least three distinct (though related) challenges:
  1.  **The Persistence Problem (McCarthy-Hayes):** How to efficiently deduce/represent what *doesn't* change (the core of his "yes").
  2.  **The Relevance Problem:** How to determine *which* potential changes (effects or observations) among a vast set are *relevant* to the current task (the driver, the RL robot's cat blindness).
  3.  **The Belief Revision Problem:** How to efficiently update (or discard) a complex web of beliefs when a change *is* detected (closer to the Ramification Problem).

  The professor, based on his pattern, is consistently anchoring the term to the **Persistence Problem (Job 1)** as originally defined in symbolic AI. The RL robot fails primarily on **Relevance (Job 2)** and potentially **Generalization** (a related but distinct issue). His rejection of the driver case confirms he sees Job 2 as distinct. The proposed test case isolates Job 1.

  **In summary:** Bet on him saying **No** to the RL robot being the Frame Problem. His core rule is the **deductive burden of proving persistence for irrelevant fluents in symbolic systems**. The **Massively Over-Specified Symbolic Planner** test case will force the clearest distinction between this rule and alternatives. I look forward to hearing how next week goes!
