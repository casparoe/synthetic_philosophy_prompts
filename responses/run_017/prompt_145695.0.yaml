prompt: |-
  Hey, I'm hoping you can settle something I keep going in circles on. Full disclosure: I have zero philosophy background, I write backend services for a living, and this whole thing started because a friend mentioned the phrase "moral luck" at a barbecue and I went home and read about it (Nagel? Williams? those are the names I keep seeing) and then couldn't stop noticing that my own industry seems to run on two flatly opposite views about luck at the same time. So: what does the package of practices I'm about to describe actually presuppose about responsibility and desert — is there one coherent view underneath it, or is it just a contradiction we've all agreed not to look at?

  The setup at my company (about 400 engineers, and I'm pretty sure this is bog standard across tech). Three things, all official:

  - Blameless postmortems. Any incident above a certain severity gets a writeup, and the hard rule is that we never name an individual as the cause. We look for contributing conditions instead. People are explicitly told they won't be punished for what they did, so they should be totally candid about it. The justification we say out loud is basically: the person who ran the migration at 4pm was operating inside the system we all built, with the information and incentives they had, and any of us would have done the same thing in their chair.
  - Impact-based promotion. The top performance rating is essentially "impact," assessed on shipped outcomes. Concretely, last cycle two engineers on neighbouring teams made more or less the same change — swapping a synchronous dependency call for a queue. One happened to ship two weeks before a marketing push nobody had warned her about, the queue absorbed a 10x traffic spike, and it's now in a VP's slide deck as having "saved the launch." The other shipped into a service that got deprioritized a month later, so his change is sitting there doing nothing anyone can measure. As far as I can tell, same skill, same care, same review process. She got promoted; he got "meets expectations," and his manager told him privately that the work was good but "didn't land."
  - A no-heroes norm, which is the one that really confuses me. Incident review actively discourages praising whoever fixed the outage at 3am. We're told not to celebrate that person, on the grounds that being the one who got to be the hero is mostly a matter of who was on call that week and which service happened to break — and that rewarding it incentivizes people to keep systems fragile. So we refuse to hand out credit for a good outcome when the *opportunity* to produce it was luck, while at the same time we hand out promotions based on outcomes.

  Here's what I can't work out. The postmortem policy sounds like the thing I was reading about, the control principle-ish idea that you can't be blameworthy for what wasn't up to you — but a friend of mine says that's a misreading, and that blameless postmortems are just epistemic humility (in a system that complicated we can't reliably trace outcomes back to individual choices, so we decline to punish even if the person genuinely deserves it) and have nothing to do with luck as such. And she says the same move might save the promotion system too: maybe we grade on outcomes not because outcomes are deserved but because grading on anything else is unmeasurable, or because we're setting incentives rather than handing out desert. I sort of think she's right about the second one but not the first, but I genuinely can't tell, and I also can't tell whether the no-heroes rule is the deepest clue here or a red herring — it seems to care about luck one step earlier than the promotion system does, and I don't know if that makes it consistent with the postmortem policy or consistent with nothing.

  I'd really like you to commit rather than give me a menu: tell me which reading you actually think is right, which of the three practices is the odd one out (if any), and what we'd have to change in our process if we took the control-based view seriously all the way down — or if we decided outcomes really do matter to merit. Also flag the part you're least confident about, and whether the whole thing is just philosophically underdetermined, i.e. whether more than one theory would license all three practices. Lead with your bottom line in the very first sentence, then give me the reasoning, no preamble and no restating my question back to me.
reasoning: |-
  Okay, the user is a backend engineer who's stumbled into philosophy via "moral luck" and is now seeing contradictions in their workplace practices. They've described three company policies: blameless postmortems, impact-based promotions, and a no-heroes norm. Their core confusion is whether these practices reflect a coherent view of responsibility or an unexamined contradiction.

  First, I need to unpack the moral luck connection. Nagel and Williams argue that we often assign praise/blame based on factors outside an agent's control - which directly mirrors the engineer's observations. The blameless postmortems seem to align with rejecting moral luck (since we excuse failures caused by circumstances), while impact-based promotions embrace moral luck (rewarding outcomes influenced by chance). The no-heroes norm is particularly interesting because it explicitly rejects rewarding fortunate interventions.

  The user's friend suggests these might just be practical compromises rather than philosophical positions. That's plausible - blameless postmortems could stem from epistemic humility (we can't truly know who's responsible in complex systems), while impact-based promotions might be a measurable proxy for performance. But the no-heroes norm feels different - it's actively preventing reward based on luck.

  I think the deepest tension is between the promotion system and the other two practices. Both postmortems and no-heroes refuse to assign (negative or positive) credit based on factors outside individual control, while promotions do exactly that. If they truly embraced the control principle consistently, promotions would need to focus on controllable inputs (quality of code, design decisions) rather than outcomes. But measuring those inputs is notoriously hard in engineering.

  The user wants me to commit, so I'll state clearly: the three practices are philosophically contradictory, with impact-based promotions being the inconsistent element. To align with the control principle, they'd need to find ways to evaluate merit beyond outcomes - perhaps through design documents, peer reviews, or archived decision logs. But I'm least confident about whether any organization could practically implement this, given how messy engineering work is. Ultimately, tech companies might be running on pragmatic fictions rather than coherent theories of justice.
answer: |-
  **Bottom line: Your company’s practices are philosophically contradictory—they implicitly reject moral luck in failure (blameless postmortems/no-heroes) but embrace it in success (impact-based promotions)—with promotions being the outlier.**  

  ### Core Contradiction  
  1. **Blameless postmortems and no-heroes norms reject outcome-based responsibility.**  
     - They follow Thomas Nagel’s *control principle*: you shouldn’t be blamed *or praised* for what you don’t control.  
     - Postmortems focus on systemic causes (not individual intent/skill), while no-heroes actively avoids rewarding lucky interventions. Both treat *luck* as invalidating desert.  
     - Your friend is half-right: epistemic humility enables blamelessness, but the policy’s *justification* ("any of us would’ve done the same") explicitly invokes luck.  

  2. **Impact-based promotions embrace outcome-based desert.**  
     - By rewarding engineers for *results* (e.g., the queue saving a launch), it assumes outcomes reflect merit—even when luck (e.g., timing of a marketing push) is decisive.  
     - This aligns with Bernard Williams’ *agent-regret*: we *feel* responsible for lucky outcomes, so institutions reward/punish accordingly.  
     - The claim that "grading on outcomes is just pragmatic" fails: if it were purely incentive-driven, you’d reward *effort* (e.g., clean code, sound design) regardless of impact. But you don’t—you require measurable results.  

  ### The Odd One Out  
  - **Promotions are the inconsistency.** Postmortems and no-heroes share a control-based view: *luck negates desert*. Promotions ignore luck when it benefits the company.  
  - **No-heroes isn’t a red herring—it’s the clue.** It explicitly rejects rewarding *fortunate opportunity*, while promotions reward *fortunate results*. Both depend on luck, but your policies treat them oppositely.  

  ### What Would Consistency Require?  
  - **To fully embrace the control principle:**  
    - Scrap impact-based promotions. Evaluate merit via *controllable inputs*: code quality, design rigor, peer reviews, documentation. The engineer whose queue wasn’t used gets equal credit.  
    - Extend "blamelessness" to praise: e.g., celebrate *fixing skills* during outages, not the fix itself.  
  - **To fully embrace outcome-based desert:**  
    - Drop no-heroes: reward 3am fixers (their luck benefits the company).  
    - Drop blamelessness: hold individuals accountable for failures (e.g., "Jill’s config error caused the outage").  

  ### Caveats  
  - **Least confident point:** Whether the *no-heroes* norm is *philosophically* coherent with blameless postmortems. One avoids punishment, the other avoids reward—but both appeal to luck. I think they’re consistent, but a hardline utilitarian might argue both are merely incentive tweaks.  
  - **Underdetermined?** Yes—*if* you accept that promotions are purely about incentives (not desert) and postmortems purely about error prevention. But your policies’ *language* ("any of us would’ve done the same," "work didn’t land") reveals deeper assumptions about desert.  

  ### Practical Fix  
  **Short of overhauling promotions:** Audit "impact" for luck. Did the engineer *create* the opportunity (merit), or stumble into it (luck)? Reward the first. Example: Promote the engineer who *proactively* identified a scaling risk and built the queue—not the one who happened to ship before a traffic spike. This bridges merit and luck, but it’s messy.  

  **Final note:** Tech’s contradiction isn’t accidental. It optimizes for psychological safety (blamelessness) and growth (rewarding wins)—but as you’ve seen, it papers over a real tension. Nagel would nod grimly.
