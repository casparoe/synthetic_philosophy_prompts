  ### MEMORANDUM  
  **To:** Board of Directors  
  **From:** [Your Name], Board Member  
  **Date:** [Date]  
  **Subject:** Recommendation on Relational Practice Framework — Adopt with Critical Amendments  

  The proposed Relational Practice Framework addresses a real need: decisions affecting residents must account for the relationships that sustain their daily well-being. Staff insights are invaluable, as they witness subtle cues and routines that distant guardians may miss. Ignoring these risks harm, as seen in recent conflicts. However, the framework’s philosophical grounding—that personhood is *earned* through relational participation—creates an untenable hierarchy. As Denise rightly argues, this could marginalize those least able to engage, echoing historical harm. Personhood is inherent, not conditional.  

  I recommend adopting the framework **with amendments** to resolve this tension:  
  1. **Reframe relationships as evidential, not constitutive.** Relationships reveal a resident’s preferences; they do not define their worth. Staff input is essential evidence but not a veto.  
  2. **Formalize staff’s advisory role + 60-day mediation pause** when they assert a change would rupture key relationships.  
  3. **Tie-breaker: The resident’s expressed will.** After mediation, the guardian decides but must prioritize observable expressions (refusals, gestures, tablet use, etc.), however indirect. If unclear, default to maintaining stability.  

  **Addressing the hard case:** A resident without visitors or stable staff is not "less of a person." Their dignity is inherent. Staff still trigger the pause because *current* caregivers—even transient ones—hold irreplaceable knowledge of the resident’s needs. The 60 days ensure that knowledge is documented and considered, preventing rash decisions. This is not staff overruling family; it’s a circuit-breaker for due diligence.  

  **Amendments needed:**  
  - Strike language tying personhood to "participation" or "community contribution."  
  - Explicitly state the pause does not override guardianship but ensures the resident’s preferences (via staff evidence) are central.  
  - Require documenting expressions of will during mediation.  

  This balances compassion with pragmatism: staff expertise is heard, guardians retain authority, and residents’ agency is prioritized. Adopt with these changes to avoid ethical pitfalls while operationalizing the framework’s valid core.  

  Vote timeline: Final language revisions by ED + attorney within 7 days; implementation in 45 days.  

