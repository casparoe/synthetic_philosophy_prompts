  We are drafting a memo for the board with a maximum of 600 words, no footnotes or citations. The memo must:
  - Address the "relational practice framework" up for vote.
  - Take Denise's objection seriously: the concern that if personhood is earned by participation, then the most disabled person is the least of a person.
  - Propose a position: the framework should be adopted with changes.
  - The author's position is that relationships are evidential (they help us know what the person wants) not constitutive (they don't make the person a person).
  - Operational change: staff get an advisory role and a 60-day delay power for mediation, but no veto. The tie-breaker is the person's own expressed will (through any means).
  - Address the stress test: a resident with no visitors and high staff turnover. Why isn't that person less of a person? And why do staff still get the delay power?
  - Avoid letting staff outrank family, especially since staff can quit.

  The memo should recommend a concrete course: adopt with changes.

  Structure the memo:
  1. Introduction: the framework is up for vote, and we must balance competing values.
  2. The core insight: relationships matter for understanding and supporting the person.
  3. The concern: avoiding a hierarchy of personhood.
  4. Proposed amendment: reframe the framework to emphasize relationships as evidential, not constitutive. Also, change the operational part to give staff a formal advisory role and 60-day delay for mediation, but the ultimate decision remains with the guardian, guided by the person's expressed will.
  5. Address the stress test: even in the case of high turnover, the delay power is about ensuring that any decision is made with the best available information about the person's relationships and expressions. It doesn't make the person less of a person because the person's inherent dignity is not contingent on the quality of relationships.
  6. Conclusion: recommend adopting with the amendments.

  After the memo, provide the JSON object with the specified fields.

  Let's draft the memo.

  ---

  **MEMORANDUM**

  To: Board of Directors  
  From: [Your Name]  
  Date: [Date]  
  Subject: Proposed Relational Practice Framework — Recommendation with Amendments  

  This memo addresses the proposed Relational Practice Framework, scheduled for a vote on [Date]. I write to recommend adoption with amendments, balancing the vital role of relationships in our residents' lives with the need to respect individual personhood and legal guardianship.  

  The framework rightly centers the profound truth that relationships are essential for understanding and supporting an individual. When we consider changes affecting a resident, the input of direct support staff (DSS) — who witness daily expressions of preference, comfort, and distress — is indispensable. Ignoring this input risks decisions that destabilize a resident's well-being.  

  However, I share Denise’s concern: if personhood depends on participation, we risk creating a hierarchy where those least able to engage are deemed less “persons.” This is not only ethically fraught but historically weaponized against disabled people. Further, our attorney notes that guardianship law vests authority in the guardian, while disability rights principles prioritize the resident’s own will and preferences.  

  I propose reframing the framework to treat relationships as *evidential* rather than *constitutive*. Relationships do not *make* a person; they help us *know* the person. Thus:  
  - DSS gain a formal advisory seat on planning teams.  
  - If the entire DSS team asserts that a change would rupture key relationships, a 60-day mediation is triggered to explore alternatives.  
  - **No veto power is granted.** After mediation, the guardian decides, but must document how the resident’s expressed will (through gestures, refusals, tablet use, etc.) was centered. This includes indirect expressions — what they reach for, who they light up around.  

  **Stress Test: The “Nobody Visits” Resident**  
  For a resident with few relationships or high staff turnover, this framework does not diminish their personhood. Personhood is inherent, not earned. The DSS delay power still applies because even in unstable situations, the current team holds critical insights into the resident’s needs. The 60 days ensure we gather and formalize that knowledge before irreversible decisions.  

  This is not staff overruling family. Staff quit; family endures. The delay is a safeguard against well-intentioned but disruptive decisions, ensuring all voices are heard.  

  **Recommendation**  
  Adopt the framework with the following amendments:  
  1. Remove language suggesting relationships “constitute” personhood. Instead, state that relationships provide essential evidence of a resident’s will and preferences.  
  2. Clarify that mediation does not override guardianship but ensures thorough consideration.  
  3. Require guardians to explicitly address the resident’s expressed will in final decisions.  

  This approach honors our residents’ humanity without compromising legal integrity. Let us vote to adopt with these changes.  

  ---

