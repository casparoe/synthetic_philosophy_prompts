  First I need to recall Kant's core positions on animals: that they lack rational autonomy (thus not "ends in themselves"), and human duties toward them are indirect - essentially about protecting our own moral character. The user seems well-versed in this, so I won't waste time explaining basics. Their invented terms are clever: "displaced wrongness" captures Kant's indirect duty concept perfectly, while "proxy standing" describes the procedural workaround courts might use without granting personhood.

