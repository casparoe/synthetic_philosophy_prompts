answer: |-
  1.  **Mapping:** Contractualism evaluates your scheduling *protocol* (principle) by asking if any tenant (person) could reasonably reject it based on the burden it imposes on them individually, justified only by reasons tied to their own latency/SLO impact (individualist restriction), where a single tenant's large, persistent burden outweighs many others' small gains.
  2.  **Clean Translation:** The requirement that no single tenant can reasonably reject the protocol translates directly to each tenant having a veto ("unanimity") over protocol adoption; a hard per-tenant latency floor prevents unreasonable burdens; focus on worst-case tenant experience maps directly to managing tail latency risk.
  3.  **Distortion:** Translating "reasonable rejectability" into a simple technical veto hides the normative judgment of what counts as a "reasonable" burden justification based solely on individual impact – your system lacks this evaluative layer, treating the burden/veto threshold as a fixed parameter set by fiat or SLO.
  4.  **No Expression:** The core idea that a principle must be *justifiable to* each tenant based on reasons *they* should accept ("could not reasonably reject") has no expression in your vocabulary, which focuses purely on measurable costs/benefits (good/bad for) without normative appeal.
  5.  **Residue Verdict:** The untranslatable "justifiability" shows contractualism imports moral reasoning absent in your engineering model; the aggregation problem is a real fault line because contractualism structurally blocks summing small gains to override one large burden.
  6.  **Sequential Wrinkle:** Contractualism evaluates the entire protocol governing *all* scheduling decisions; persistent, cumulative burden for one tenant over many rounds constitutes grounds for reasonable rejection of the protocol itself, not just a complaint about a single decision.
  7.  **Threshold Wrinkle:** Contractualism lacks a magic number; the *count* of complainers is irrelevant except to break ties between burdens of comparable magnitude, fundamentally differing from consensus quorums where crossing a threshold changes the protocol's qualitative behavior.
