  Residue verdict: The untranslatable aspect shows contractualism depends on moral reasoning missing in their engineering framework, making it fundamentally different for policy choices.

  For the sequential wrinkle: Contractualism evaluates the entire protocol/run, so cumulative burdens constitute grounds for reasonable rejection, not just individual decisions.

