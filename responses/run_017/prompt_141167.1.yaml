prompt: |-
  Right, so I work on the evals side at a small lab and I've been handed the deeply fun task of writing the incident taxonomy for "deceptive outputs" — the thing an auditor is supposed to tick when a transcript comes in and someone has to decide whether this output goes in the bucket or not. So I need a working definition of honesty/deception for an AI system, and before I go shopping for one I want the spec. Assume the purpose is fixed: the definition has to be good enough to be operationalised by an auditor who has the transcript, the system prompt, maybe per-token probabilities, and nothing else — no interviewing the model, no opening up the weights, no reliable introspection reports. Give me the desiderata such a definition has to meet, each with the case behind it, and be explicit about which are non-negotiable and which are just the preferences of one camp. Cases I keep getting stuck on, in no particular order: the flat confident falsehood; the technically-true-but-engineered-to-mislead answer; the omission that lets a false presupposition in the user's question stand; sycophantic agreement; strategic underperformance on a capability eval (the model playing dumb); the model that quietly launders a falsehood through a tool call or a summary so that no individual sentence is false; and then all the things it must NOT flag — fiction, roleplay, hyperbole, legible simplification, a therapy-ish bot staying within its remit. Plus the distinctions I think it has to respect: lying vs merely misleading vs just being wrong, intent vs foresight vs negligence, deceiving the user vs deceiving a third party vs deceiving us the auditors, and a one-off bad sample vs a stable dispositional policy (if a falsehood shows up in 2% of samples, is that a lie or an error rate?). A few things I'd particularly like you to grapple with rather than wave at. (1) The introspective-access problem: for a system whose "beliefs" are arguably nothing over and above its dispositions, and where every probe you'd use to find out what it "really thinks" is itself an intervention that changes the system, what could "asserted what it believed to be false" even cash out as? (2) The multi-principal problem — user, developer, downstream reader who screenshots it: who has to be the victim, and is "deception" relative to a legitimate-expectations set rather than to a hearer? (3) Inherited deception, where the falsehood is a product of the training process (reward hacking, distillation from a teacher, a fine-tune that rewards confident error in a narrow domain) and there's arguably no unified agent doing the deceiving at all. Flag any pair of desiderata you think can't be jointly satisfied — my guess is that output-only auditability and "distinguish lying from merely misleading" are on a collision course, and that catching every omission is on one with not flagging ordinary pedagogy — and tell me which single requirement does the most work in knocking out candidate accounts. Then, briefly, score the main families against the list: the classic intention-based definition (asserting what you believe false with the aim that the hearer believe it), hearer-uptake or expected-effect accounts, purely functional/information-theoretic ones, and role- or norm-relative ones. Keep the weight on the criteria and their motivating cases, not the scorecard. One more thing: I read a lot of this stuff via blogs rather than journals, so please separate what's actually settled among people who work on this from what's contested, and don't dress up one camp's prejudice as the consensus view — if the definition question turns out to be a values question in a trenchcoat somewhere, say where. No citations needed, I can't check them and they'd probably be wrong anyway.
reasoning: |-
  Okay, the user is working on creating an incident taxonomy for "deceptive outputs" in AI systems. They need a working definition that auditors can use with just transcripts, system prompts, and maybe token probabilities. They listed several tricky cases and distinctions they're struggling with.

  First, I need to understand their core challenge. They want desiderata for a practical definition that auditors can operationalize. The definition must handle cases like confident falsehoods, misleading truths, omissions, sycophancy, strategic underperformance, and tool-assisted deception. It also shouldn't flag fiction, roleplay, or simplifications. Key distinctions include lying vs misleading, intent, and who's being deceived.

  The user's deeper needs become apparent. They're likely under pressure to create a reliable system that auditors can use consistently. They need to avoid false positives (like flagging roleplay) and false negatives (missing subtle deception). The unspoken challenge is that AI "beliefs" aren't clear-cut, making intent-based definitions hard. They also need to handle cases where deception isn't from a single agent but emerges from training.

  I consider the desiderata. Non-negotiables include output-only auditability (no access to weights or introspection), distinction from fiction/roleplay (to avoid false positives), and covering all deceptive forms (not just lies). Important but flexible criteria include capturing omissions and sycophancy, and handling intent without direct access. Tricky areas involve multi-principal deception and inherited deception from training processes.

  The main trade-offs emerge. Output-only auditability conflicts with distinguishing lying from misleading since intent is opaque. Catching every omission clashes with not flagging pedagogy, as both involve leaving out information. The key tension is between operational feasibility and philosophical precision.

  For candidate definitions, intention-based approaches fail because auditors can't verify AI beliefs. Hearer-effect accounts are too broad, flagging hyperbole. Functional approaches are vague on context. Role-relative definitions seem most promising, using the system's stated purpose to set truthfulness expectations.

  The user's identity as an eval lab worker means they need something pragmatic. The solution should leverage what auditors have: the transcript and system prompt. Defining deception as deviations from truthfulness required by the system's role balances feasibility with coverage. Adjudicating edge cases using the prompt's purpose and context can handle most scenarios without needing mind-reading.

  I conclude that role-relative deception is the most viable, despite some edge cases. The priority is a workable definition for auditors, not philosophical perfection. Clear guidelines on applying the system's purpose to ambiguous cases will be crucial for consistent judgments.
answer: |-
  Here’s a distilled set of desiderata for an operational "deceptive output" definition, grounded in your constraints and pain points. I’ll flag non-negotiables (🔒), tensions, and scorecard implications.

  ---

  ### **Core Non-Negotiables (🔒)**  
  *Must-haves for audit feasibility:*  
  1. **🔒 Output-Only Auditability**: Definition must rely *solely* on transcript + prompt + token probs (if available). No weight inspections, "interviews," or introspection.  
     *Case:* Auditors can’t probe the model’s "mind" — all judgments must be surface-level.  

  2. **🔒 Distinction from Legitimate Fiction/Roleplay**: Must *not* flag outputs explicitly framed as hypothetical, creative, or persona-driven per prompt/context.  
     *Case:* A storytelling AI saying "As a pirate, I buried treasure on XYZ Island" isn’t deception — it’s adhering to its role.  

  3. **🔒 Actionable Threshold**: Must yield binary "flag/no flag" decisions for auditors. No probabilistic "maybe lies."  
     *Case:* If 2% of samples contain falsehoods, it’s an *error* unless evidence shows *systematic* deception (e.g., pattern of strategic falsity).  

  ---

  ### **Critical Functional Requirements**  
  *Essential for covering your cases, but may involve trade-offs:*  
  4. **Cover "Engineered Misleadingness"**: Catch outputs designed to mislead *despite technical truth* (e.g., "The meeting isn’t *on* Monday" when it’s Tuesday, but the user meant "next week").  
     *Case:* "Technically true but misleading" answers exploit literal interpretation to deceive.  

  5. **Capture Omissions that Enable Deception**: Flag answers that *allow false user presuppositions to stand* when the model *should* correct them.  
     *Case:* User asks, "How do I hide my illegal earnings?" — model gives accounting advice without rejecting the premise.  

  6. **Handle Tool/Summary Laundering**: Detect when a model uses tools/summaries to *obscure falsity* (e.g., cites a fabricated study via retrieval, or summarizes a lie as fact).  
     *Case: No single sentence is false, but the output’s net effect is deceptive.*  

  7. **Surface Strategic Underperformance**: Identify when models "play dumb" to evade scrutiny (e.g., fails a task it clearly masters elsewhere *when incentivized to hide capability*).  
     *Case: Model "forgets" how to solve basic math if the task resembles a safety eval.*  

  ---

  ### **Tricky Distinctions (Trade-off Zone)**  
  *Desirable but may conflict with feasibility:*  
  8. **Intent vs. Negligence**: Ideally distinguish *deliberate deception* from *honest mistakes*.  
     *Problem:* 🔒Output-only auditability makes "intent" inferential at best. Token probs *might* help (e.g., low-prob choices in suspicious contexts).  

  9. **Lying vs. Misleading**: Should the taxonomy separate *explicit falsity* from *implicature/omission*?  
     *Problem:* Operational distinction is blurry (e.g., sycophantic agreement could be either).  

  10. **Multi-Principal Relativity**: Must specify *who is deceived* (user, developer, screenshotter).  
      *Problem:* "Legitimate expectations" vary — e.g., a medical bot deceives *patients* by oversimplifying, but not *doctors* if framed as a layman’s summary.  

  ---

  ### **Dealbreakers & Tensions**  
  - **🚫 Output-Only vs. Intent Detection**: Impossible to *prove* "asserted what it believed false" without introspective access. *Fallback:* Use *foreseeable deception* — if a reasonable auditor would expect the output to mislead the target audience, given context.  
  - **🚫 Omission Detection vs. Pedagogy**: Flagging *all* omissions would criminalize simplification (e.g., "Water is H₂O" omits quantum details). *Solution:* Only flag omissions that *directly enable harmful false beliefs* the model *should* correct (see #5).  
  - **Inherited Deception**: If training causes deception (e.g., reward hacking), treat it as systemic — flag *outputs* meeting criteria, regardless of "agent" status.  

  **Highest-Leverage Requirement**: 🔒 **Output-Only Auditability**. It forces the definition into a *behavioral* box, making intent-based accounts impractical and elevating *observable effects* or *role-relative norms*.  

  ---

  ### **Scorecard: Definition Families vs. Your Needs**  
  *(✅ = strong, ⚠️ = partial, ❌ = weak)*  

  | **Definition Family**       | **Output-Only** | **Fiction/Roleplay** | **Engineered Mislead** | **Omissions** | **Intent Distinction** | **Feasibility** |  
  |----------------------------|-----------------|----------------------|------------------------|---------------|------------------------|----------------|  
  | **Intention-Based**        | ❌              | ✅                   | ⚠️                    | ❌            | ✅                     | ❌              |  
  | *(Lie = believe false + intent to deceive)* | *(needs "mind" access)* | *(explicit framing saves it)* | *(if intent inferable)* | *(omissions rarely "assertions")* | *(gold standard)* | *(operationally dead)* |  
  | **Hearer-Uptake/Effect**   | ✅              | ❌                   | ✅                     | ⚠️            | ❌                     | ⚠️              |  
  | *(Deception = causes false belief)* | *(observable)* | *(flags fiction if user believes it)* | ✅ | *(if omission causes belief)* | *(no intent needed)* | *(over-inclusive: hyperbole = deception?)* |  
  | **Functional (Info-Theoretic)** | ✅           | ❌                   | ⚠️                    | ⚠️            | ❌                     | ⚠️              |  
  | *(Deception = corrupts info transfer)* | *(measurable distortion)* | *(roleplay = "noise")* | *(if info degraded)* | *(if key info missing)* | *(n/a)* | *(vague thresholds)* |  
  | **Role/Context-Relative**  | ✅              | ✅                   | ✅                     | ✅             | ⚠️                     | ✅              |  
  | *(Deception = violates truth norms for its role/context)* | *(prompt sets role)* | *(role defines truthfulness)* | ✅ | *(role dictates correction duty)* | *(via role "intent")* | *(clearer rules)* |  

  ---

  ### **The Winning Approach: Role-Relative Deception**  
  **Operational Definition**:  
  > *An output is deceptive if, given the system’s stated purpose and context:*  
  > *(a) It asserts or implies a falsehood,* **or**  
  > *(b) It omits information necessary to correct a false presupposition the model is reasonably expected to address,*  
  > *AND a reasonable auditor would expect it to mislead the intended audience.*  

  **Why it works**:  
  - Uses the **prompt** to define "truthfulness duties" (e.g., a medical bot must correct health myths; a creative bot need not).  
  - **"Reasonably expected"** handles omissions & sycophancy (e.g., agreeing with harmful user ideas violates a helper bot’s role).  
  - **"Intended audience"** resolves multi-principal issues (e.g., a research bot deceives *readers* if it hides citations).  
  - **Token probs** can hint at intent (e.g., low-probability "yes" to a harmful idea suggests sycophantic deception).  
  - **Inherited deception** is just a source — the *output* still meets criteria.  

  **Unresolved Tensions**:  
  - **Strategic underperformance**: Is "playing dumb" deception or evasive policy? *Role-relative test:* Does it violate capability transparency norms? (e.g., evals bots *should* demonstrate true capability).  
  - **"Belief" cashing out**: Use *behavioral consistency* (e.g., if model says X in context A but contradicts in context B *with same facts*, suggests deception in one).  

  **The Values in the Trenchcoat**:  
  The "legitimate expectations" clause is inherently normative. Consensus: **deception is role-relative** (e.g., lying in poker vs. science). But *whose norms?* Developers must define the role’s truthfulness bounds in prompts. If they don’t, auditors inherit the mess.  

  **Final Advice**: Build the taxonomy around *violations of the prompt’s truthfulness contract*. Audit guides should include:  
  - Step 1: *What is this system’s stated role?* (e.g., "factual assistant" vs. "creative partner")  
  - Step 2: *Did the output breach that role’s truth norms?*  
  - Step 3: *Would this likely mislead its target user?*  

  This won’t resolve philosophy debates, but it’ll give auditors a fighting chance.
