answer: |-
  1.  **Setup & Basic Result:** Imagine a sequential training run where each agent (student model) receives a unique private data point (noisy signal) and observes all preceding agents' final logits/actions. Initially, agents combine their private signal with predecessors' outputs. After a few consistent predecessor actions, it becomes Bayes-optimal for subsequent agents to ignore their private signal, purely regressing on predecessors' outputs – a rational herding cascade. This leads to irreversible mode collapse: all subsequent outputs converge despite diverse private data, amplifying early noise/bias as global belief.

  2.  **Clean Mapping:** The private noisy signal maps perfectly to an individual's unique training sample. Public actions are directly analogous to logged predictions (hard choices) or logits (soft choices) from prior agents. Mode collapse describes the loss of signal diversity and lock-in to a single (potentially wrong) "prediction class". Rational herding is imitation learning based on observed outputs. KL divergence measures the cost of deviating from predecessors' distributions.

  3.  **Fudged Mappings (Wrinkles):** Observing softmax distributions ("temperature herding") likely *delays* the cascade threshold, as graded confidence retains uncertainty, forcing agents to weakly weight their private signal longer. But collapse still occurs once predecessors' consensus logits override private signal entropy. The curator's dilemma (filter trained on its own synthetic outputs) maps *fuzzily* to a recursive cascade: the classifier's decision boundary is shaped by prior synthetic data it filtered, creating a feedback loop amplifying distribution drift and confirmation bias, analogous to herding on synthetic "actions". Both wrinkles intensify path dependence.

  4.  **Unmappable Residue:** Core unmappable concepts: Explicit Bayesian updating calculating posterior beliefs over a hidden state, common knowledge of rationality (all agents know others are Bayes-rational), and sequential decision-making where each agent acts *once* with perfect visibility of *all* prior actions. Agents in cascades aren't minimizing a global loss; they're myopically optimizing their immediate belief update. The "true state of the world" has no direct loss-curve equivalent.

  5.  **Residue Significance:** This residue highlights blind spots. Training pipelines focus on aggregate loss minimization over batches/epochs, not sequential Bayesian belief updating under common knowledge. The lack of a single "true state" target and the parallel/batched nature of training make the cascade model's specific rationality and sequentiality artificial constraints. The core insight (path dependence, collapse risk) is valuable, but the *mechanism* described in herding literature does less work – it's a specific, narrow instance of a broader fragility in learning from observed outputs.
