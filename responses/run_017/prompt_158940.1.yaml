  **Standing Committee on Random Chords: Procedural Handbook (Section VII.A.3: Indifference Protocol)**

  1.  All random chord selection must employ Method Alpha (uniform endpoint distribution on the circumference) for licensing purposes; calculated probabilities exceeding 1/3 necessitate Form SCR-7B submission and justification via rotational invariance certification (referencing Circular Symmetry Directive 12.4).
  2.  Midpoint parameterization is strictly regulated under Method Beta (uniform chordal distance from center), requiring pre-approval via SCR-9A and yielding a standardized probability of 1/2; deviations must be reconciled with the Bertrand Dividend observed between Beta and Gamma methodologies.
  3.  Method Gamma (uniform midpoint distribution within the disc) is permissible only under Tier-3 licensing, mandating radial density audits and producing a baseline probability of 1/4; applications citing area invariance must demonstrate absence of rehypothecation attempts with other methods.
  4.  Rehypothecation of a single physical chord under multiple parameterization frameworks (Alpha, Beta, Gamma) is expressly forbidden without a Consolidated Indifference Waiver (CIW-Form 22), as it conflates distinct admissible priors and inflates the measurable Bertrand Dividend unpredictably.
  5.  Members consulting with the Duopoly Competition Subcommittee on analogous "uniform price" paradoxes are reminded that invariant results under reasonable priors constitute special dispensation, not precedent, and do not warrant relaxation of SCR rehypothecation statutes or Dividend containment procedures.
