prompt: |-
  I have just come away from a long and unresolved argument with a friend about the situationist critique of virtue ethics, and I would like your help with the precise place where it stalled.

  My friend's claim was that the familiar experimental results — seminarians stepping past a slumped stranger when they were in a hurry, and people who had just found a coin in a phone booth being markedly more likely to help someone who dropped their papers — show that there are no global character traits of the sort virtue ethics requires, and that once virtue ethicists retreat to traits indexed to narrow classes of situations they have abandoned the substantive thesis rather than defended it. I replied that the retreat may be no retreat at all: if a virtue like practical wisdom partly consists in a fine-grained sensitivity to the morally salient features of situations, then variability across situations is what a virtue ethics should predict, and the experiments look less like refutations than like unflattering portraits of people who are not very perceptive.

  My friend then made two moves I could not answer. First, a gerrymandering objection that struck me as structurally the same as Goodman's new riddle of induction: any finite behavioral record can be captured by indefinitely many situation-indexed trait predicates that fit the record and diverge thereafter, so that if local traits are left unconstrained the theory explains everything and predicts nothing. Second, even granting that some local traits are genuine, nothing in the observed pattern tells us whether an agent's variability is responsiveness to reasons or mere stimulus control; from the outside, a virtue and a habit keyed to an arbitrary trigger look exactly alike.

  I floated a reply in the argument, and I want to know whether it can bear the weight I put on it. Call it the projectability condition: an ascription such as "helpful in unhurried, uncrowded circumstances" is admissible only if its eliciting class can be specified in terms that let a third party classify a situation the agent has never been in, so that the ascription yields predictions about novel cases, including cases designed after the ascription was made. This, I suggested, is what separates a trait from a redescription of a record — and it is what would let the dispute be settled by evidence rather than by intuition.

  Please explain, at some length, what is really doing the work in my friend's gerrymandering objection, whether the projectability condition blocks it, and whether a view built on projectable local traits still earns the name of virtue ethics, or whether it has quietly become a theory of stable behavioral signatures and lost the specifically ethical claim that character unifies a life and grounds an ideal of practical wisdom. If my friend and I have each mislocated the disagreement — if, for instance, the dispute is not really empirical at all but a disagreement about what character talk is for — say so, and say why.

  Two requests about form. Please write in continuous prose, the way you would in a letter: no headings, no bullet points, no bold text, no tables. And open by telling me, in a sentence or two, which of us you think is closer to right, so that I know where the rest of your answer is headed. Somewhere between 700 and 900 words.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about situationist critiques of virtue ethics. The friend argues that experiments like the Good Samaritan study show there are no global character traits. The user countered that virtues involve situational sensitivity, so variability isn't a refutation. The friend then raised two objections: gerrymandering (similar to Goodman's new riddle) and the inability to distinguish reasons from mere stimulus control. The user proposed a projectability condition to address this, requiring that trait ascriptions must allow predictions in novel situations. They want to know if this works, whether such a view still counts as virtue ethics, and if the disagreement is actually empirical or conceptual.

  First, I need to assess both sides. The friend’s gerrymandering objection points out that without constraints, any behavior can be explained post-hoc with arbitrary situation-specific traits. This is a real problem for the user's initial defense. The projectability condition aims to solve that by requiring predictive power. But does it fully address the issue? Maybe partially, but it might not cover the normative aspect—distinguishing between rational sensitivity and mere triggers.

  Then, the deeper issue: can local traits still be called virtues? Virtue ethics traditionally emphasizes global traits that unify a person's character. If traits are too localized, do they lose that unifying role? The user is worried their approach might reduce virtues to mere behavioral signatures, losing the ethical dimension of practical wisdom and a unified life.

  I recall Aristotle's phronesis involves perception of particulars, so fine-grained sensitivity isn't alien to virtue ethics. But how fine is too fine? The user needs to show that projectable traits can still form a coherent character. Maybe through interconnected perceptions and reasons-responsiveness, but the friend's second objection questions whether we can observe that.

  The user also asks if the dispute is empirical or conceptual. Both, probably. Empirically, projectability allows testing, but conceptually, it's about what virtues are—whether they require global consistency or can be context-sensitive without fragmentation.

  I think the user is closer to being right, but their projectability condition needs strengthening with normative elements. Virtue ethics can accommodate situational sensitivity if tied to reasons. The key is ensuring that local traits are expressions of practical wisdom, not isolated habits. This maintains the ethical core while answering the situationist critique.
answer: |-
  I believe you are closer to the truth in this complex debate, though your friend’s objections expose genuine challenges that require careful refinement of your position. Your projectability condition is a significant step toward addressing the gerrymandering problem, but it alone cannot fully reconcile a situation-sensitive virtue ethics with its traditional aspirations. The core disagreement, I suggest, runs deeper than empirical methodology; it concerns the nature of character and practical wisdom itself.

  Your friend’s gerrymandering objection rightly highlights a profound difficulty. If we allow character traits to be indexed to arbitrarily specific situational features ("helpful when finding a coin in an uncrowded phone booth on a Tuesday"), we can indeed "fit" any past behavior. However, this threatens to make virtue ethics unfalsifiable and explanatorily vacuous. It mirrors Goodman’s new riddle: just as any past observation of green emeralds is consistent with the hypothesis "all emeralds are grue" (green before time t, blue thereafter), any past behavior is consistent with infinitely many bizarrely specific "situation-trait" pairings. Without constraints, trait ascriptions become mere redescription, losing predictive power and theoretical substance.

  Your projectability condition directly targets this flaw. By demanding that trait-eliciting situations be specified in terms allowing third parties to classify *novel* situations (including "designed" ones), you impose a crucial test. "Helpful when not in a hurry" is projectable; "helpful in the exact sensory configuration experienced outside the Princeton Theology Seminary at 10:17 AM on July 15th, 1973" is not. Projectability ensures that trait ascriptions generate genuine predictions, transforming virtue ethics into an empirically testable theory. It blocks the most egregious gerrymanders by requiring that situational categories be generalizable and applicable to unforeseen contexts. This moves the debate onto empirical ground: we can design experiments with novel combinations of features (e.g., moderate hurry plus a salient prosocial cue) to test predictions derived from candidate projectable traits.

  However, projectability alone cannot resolve your friend’s second, deeper objection: the distinction between *reason-responsiveness* and *mere stimulus control*. Two agents might exhibit identical, projectably consistent behavior across situations – e.g., both help reliably when unhurried but not when rushed. For one, this reflects a genuine, albeit imperfect, sensitivity to the moral significance of time pressure versus others' needs (a proto-virtue). For the other, it might be a mindless habit triggered by the sheer absence of temporal cues, devoid of moral perception. Externally, the behavioral signatures are identical. Projectability ensures we can predict *behavior* in new situations fitting the description, but it doesn’t guarantee the behavior stems from *practical wisdom* or the perception of *moral salience*. This is where the empirical and the conceptual intertwine inseparably.

  This leads to the heart of your final concern: whether such a view remains genuine virtue ethics. Virtue ethics traditionally claims that character traits are *global* in a specific sense – not that they manifest identically everywhere, but that they reflect stable, deep-seated dispositions of perception, judgment, and motivation, forming a coherent core that "unifies a life" and embodies *phronesis* (practical wisdom). Your friend contends that retreating to local traits abandons this core. I believe you can defend a version of virtue ethics that incorporates situational sensitivity without abandoning its essence, but it requires embedding projectable traits within a framework of *reasons*.

  The key lies in how we characterize the "sensitivity" you mentioned. If the "fine-grained sensitivity to morally salient features" is understood as *constitutive* of virtue – particularly of *phronesis* itself – then local variability isn't a retreat; it's the expected outcome of a capacity attuned to the nuanced demands of different contexts. *Phronesis* involves precisely this discernment: recognizing that rushing to deliver a crucial lecture *is* a reason to prioritize time over aiding a minor mishap, while finding a coin *isn't* a reason to be more helpful, but might momentarily lift one's mood enough to notice a reason (someone's distress) that was always there. The projectable trait ("helps when unhurried") needs interpretation not just as a behavioral regularity, but as the observable trace of an underlying capacity to perceive and respond to *reasons* (e.g., "recognizes need when not overwhelmed by countervailing pressures"). The "situation" isn't an arbitrary trigger, but a constellation of normatively relevant features.

  Therefore, a view built on projectable local traits *can* earn the name of virtue ethics, but only if:
  1.  **The traits are specified normatively:** The situational features referenced must be morally relevant (e.g., "under time pressure," "facing significant personal cost," "witnessing unambiguous need") rather than arbitrary physical or contextual triggers (e.g., "near a phone booth," "on a sunny day"). This links the trait intrinsically to reasons.
  2.  **They are integrated by *Phronesis*:** The capacity to identify which projectable disposition is called for *in this specific novel situation* – to "see" the salient features – is the work of practical wisdom. Character unity resides not in monolithic behavioral invariance, but in the stable, intelligent disposition to perceive and respond appropriately to the varied reasons the world presents. The projectable traits are the *expressions* of this underlying, unified capacity in recurring types of normatively similar situations.
  3.  **They connect to the good life:** The pattern of sensitivity and responsiveness must be justifiable as contributing to, or constituting part of, *eudaimonia*.

  Your friend is correct that without this normative grounding, projectable traits risk becoming mere "stable behavioral signatures" – sophisticated stimulus-response patterns lacking the ethical depth of true character. The experiments *do* reveal widespread failures of perception and responsiveness, portraits of vice or at least underdeveloped virtue. But your core insight stands: virtue ethics, properly understood with *phronesis* at its heart, predicts *and requires* variability across situations. The disagreement isn't purely empirical; it's fundamentally about whether the sensitivity revealed (or obscured) by behavior is a sensitivity to *reasons*. Projectability provides the empirical handle, but resolving the deeper question requires engaging the normative substance of the virtues themselves – the very task virtue ethics sets for moral philosophy.
