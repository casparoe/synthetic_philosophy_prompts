prompt: |-
  hey, im a senior and i help grade the weekly short answers for this ai safety reading group thing my school runs (its sort of an elective, mostly we just read blog posts and argue about them). i have to put a mark out of 10 and written comments on each one. normally im fine but this one i cant tell if its actually good or if it just sounds good, and i dont want to be the person who hands out a 9 for vibes. the question was:

  Q: Distinguish outer alignment from inner alignment. Then explain what goal misgeneralization is, and say how it differs from (a) a plain capability/robustness failure and (b) reward hacking. Give a concrete example. Finally: should we expect goal misgeneralization to go away as models get bigger and generalize better? Explain. (250 words max)

  heres the answer, we grade anonymously so i have no idea who wrote it:

  "Outer alignment is about whether the objective we write down — the reward function, the training signal — is the thing we actually want. Inner alignment is about whether what the model learned to pursue on the inside matches what we actually want, once training is done. So they can come appart in two directions: we can specify the wrong thing, or we can specify the right thing and the model still ends up wanting something else.

  Goal misgeneralization is the second of those. It's when the model's capabilities generalize to the new situation but its goal doesn't. The maze case: a mouse is trained to get the cheese, but during training the cheese is always in the top-right corner. At test time the cheese gets moved somewhere else and the mouse walks straight to the empty top-right corner. It hasn't forgotten how to navigate the maze — its still doing that fine — it's the goal that failed to transfer. That's different from a capability failure, where the model just does the task badly once you're off the training distribution.

  And it's basically the same thing as reward hacking, just moved off-distribution: in both cases the system chases a proxy for what we wanted instead of the real thing, and in both cases the fix is to write down a better reward function. So no, I don't think scaling fixes it. Bigger models are better optimizers, so they'll push the proxy even harder, and reward hacking seems to get worse not better as models get more capable."

  the rubric our teacher gave us is roughly: gets outer vs inner right (3), gets what does and doesn't generalize in goal misgeneralization (3), distinguishes it from the neighbouring failure modes (2), example plus the scaling question (2).

  can you go through it more or less claim by claim and tell me whats actually correct, whats only half right, and whats wrong, and then what mark youd give out of 10 and why that number? i dont need you to rewrite the answer, i need to know which specific things to put in the comments so the person gets feedback they can use. also if something is right but for a bad reason i want to know, because i never know how much credit to give for that. and if you think some part of the rubric is testing the wrong thing you can say so, i pass the comments on but i can add a note.
