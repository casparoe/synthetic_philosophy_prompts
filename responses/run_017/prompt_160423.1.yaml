  The user specified four dialectical moves that must be covered in order: the calibration regress, asymmetry of marker-based inference, bundling objection, and inference to the best explanation. I need to ensure each point is addressed sequentially with genuine back-and-forth.

  In my private brainstorming phase (as "Notes"), I'll outline the strongest arguments for each position. For Vale, the best argument is that markers track dissociable computational mechanisms that correlate with dimensions of consciousness in humans, and these mechanisms can be observed in non-reporting subjects. Kovač's strongest counter is that all marker validation ultimately depends on verbal report, creating a circularity when applied to non-linguistic creatures.

  The key premise Kovač will attack is Vale's mechanism-identity claim. Vale will attack Kovač's assumption that report is the only non-inferential access point. Both can accept the distinction between functional organization and phenomenal consciousness upfront.

  For the dialogue structure: I'll start with the calibration regress. Vale will argue that markers are validated against mechanisms, not just reports, citing examples like non-reporting humans. Kovač will counter that mechanism-identity claims are precisely what need validation through reports, noting cases like blindsight (function without experience) and hallucinations (experience without function).

