  Finally, inference to the best explanation. Vale will argue conscious subjects best explain gliders' flexible behaviors. Kovač will counter that functional organization alone suffices, making consciousness an unnecessary posit. They'll surface meta-epistemic differences about knowledge vs reasonable belief, and Kovač will concede uncertainty shouldn't license mistreatment.

  I'll define technical terms like "model-based control" and "blocking" when first mentioned. The setting will be a neutral academic conference room to avoid distractions. Each character will explicitly grant a substantial point to the other: Vale will acknowledge the report-dependence of original marker validation, Kovač will concede the computational dimensions are dissociable in humans.

