prompt: |-
  So I TA for a first-year seminar on rational choice and we did a session on Hofstadter's superrationality — the idea that in a symmetric game you should pick the move you would want everyone else to pick, because the other superrational players are running the same reasoning you are and will land on the same answer. I wrote up what I thought was a knockdown objection to it and now I think the argument proves too much, but I cant see where it breaks. Here it is, more or less as I wrote it:

  (1) The core superrational move: your choice and your counterpart's are not independent, because both are outputs of the same piece of reasoning. So you should choose the strategy that, if everyone chose it, gives everyone the best result.

  (2) In a one-shot prisoner's dilemma against someone who reasons exactly as you do, and who you know reasons exactly as you do, this gives cooperate. That is the result that makes the view attractive and I still think it is right.

  (3) But nothing causal is happening in (1). My cooperating does not cause my counterpart to cooperate, any more than my defecting causes them to defect. What (1) is really trading on is that my act is evidence about what they will do. So superrational choice ranks options by what they tell you, not by what they bring about.

  (4) And if that is what does the work, it should not matter where the correlation comes from. Evidence is evidence, whether it comes from shared deliberation or from a common cause.

  (5) So take the dessert case. There is a gene that both makes people crave a particular dessert and causes a nasty illness, and you dont know whether you have it. Reaching for the dessert is strong evidence you have the gene; eating it does not cause the illness and skipping it will not prevent it. By (4), you should push the plate away.

  (6) That is absurd. Passing on dessert makes you no healthier, and a decision theory that tells you to manage the news like that has gone wrong somewhere.

  (7) So superrationality is refuted — except that (1) and (2) still look right to me, and if I give up (1) I lose the only argument I have for cooperating in the twin case, which was the whole point.

  My gut says the trouble sits in (3) or (4) and that correlation is doing two different jobs there, but I cant say what the principled difference is supposed to be, or what it costs to insist on one. My professor also said (1) as I have stated it is incomplete anyway: it only covers everyone making the same move, and the usual solution to the puzzle where twenty people each get a letter offering a billion dollars to whoever replies, but only if exactly one person replies, needs each of them to roll a die and reply with some small probability so that they come apart. If superrationalists are supposed to be perfectly correlated, how are they supposed to roll independently? Is that fatal or just a patch?

  Please tell me which step you would reject and what rejecting it costs, and price the alternatives — I would rather keep (2) than (6) if I have to choose. Also be explicit about which bits are settled and which are genuinely contested among people who work on this, because I dont want to walk into seminar and present a contested reading as though its the consensus. And American English, please — I am handing this in to a US department.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're a TA for a first-year seminar on rational choice, specifically teaching Hofstadter's superrationality. They presented an objection to it but now feel their argument might be flawed. The core issue is reconciling the intuitive appeal of cooperating in a Prisoner's Dilemma with twin reasoning versus the absurd outcome in the dessert gene case.

  First, I need to recall what superrationality entails. Hofstadter's idea is that in symmetric games, players should choose the strategy they'd want everyone to pick, assuming identical reasoning leads to the same choice. The user's objection hinges on the claim that superrationality relies on evidential reasoning (act as evidence) rather than causal influence. They extend this to the dessert case, where choosing dessert indicates a harmful gene, leading to the counterintuitive advice to avoid dessert—which doesn't actually affect health.

  The user's steps (1) to (7) outline their argument. Step (3) is crucial: they assert that superrationality is about evidence, not causation. Step (4) claims that the source of correlation shouldn't matter, leading to the problematic dessert case in (5). The user feels (6) is absurd, so superrationality must be wrong, but they still believe in (1) and (2).

  I remember that in decision theory, the difference between evidential and causal decision theory is key. EDT uses evidence to update beliefs, while CDT focuses on causal effects. Superrationality is often linked to EDT. But the dessert case is a classic EDT pitfall—managing news rather than outcomes. This suggests step (4) is where things go wrong. The user's extension assumes all correlations are equal, but in the twin case, the correlation comes from identical reasoning processes, which is directly relevant to the decision, unlike the gene correlation in the dessert case.

  The professor's comment about the incomplete nature of (1) also matters. Superrationality requires symmetry and identical reasoning, not just any correlation. The gene example lacks the necessary symmetry—the gene causes both the craving and the illness, but the decision to eat dessert doesn't influence the other person's action. In the Prisoner's Dilemma, the players' choices are interdependent through their shared reasoning.

  So the flaw is in equating all types of correlation. Superrationality applies only when agents are identical in reasoning and the game structure ensures that their decisions are symmetric. The dessert case doesn't have this; it's a one-person decision problem with evidential correlation, not a multi-agent symmetric game.

  The user also mentions the coordination problem with dice rolls. That's a different issue where superrationality needs randomization to break symmetry. It's a known challenge but doesn't invalidate the core idea—just shows it requires careful application.

  I should explain that rejecting step (4) preserves the twin PD cooperation while avoiding the dessert absurdity. The cost is limiting superrationality to contexts with strict symmetry. Also, clarify that the academic consensus sees superrationality as a form of EDT applied to symmetric games, with ongoing debates about its scope.

  The user wants to keep (2) and avoid (6), so emphasizing the symmetry condition achieves that. They need to present this distinction in class, noting where the field agrees (EDT vs. CDT) and where it's contested (extensions of superrationality).
answer: |-
  Here’s a step-by-step breakdown of where your argument goes astray, why rejecting that step preserves the core insight of superrationality, and how this fits into broader debates. I’ll flag settled vs. contested points and prioritize American English.

  ### **The Flaw: Step (4) is the Problem**
  **Reject (4):** "Evidence is evidence, whether it comes from shared deliberation or from a common cause."  
  **Why:** Superrationality relies on **symmetry and identical reasoning processes**, not just generic correlation. The dessert case lacks the necessary symmetry for superrationality to apply.  
  **Cost of Rejection:** You limit superrationality to symmetric games with identical agents (like the twin PD). It no longer generalizes to *all* evidentially correlated scenarios (like the dessert gene).  

  ---

  ### **Why (4) Fails: The Symmetry Distinction**
  1. **In the Twin PD (Steps 1–2):**  
     - You and your counterpart are **identical rational agents** using the **same deterministic reasoning**.  
     - Your choice isn’t just *evidence* of their choice—it’s **logically necessary** that they output the same move *because* they run identical reasoning on the same problem.  
     - This creates **interdependence**: Cooperating is stable because if you choose it, they *must* choose it too (and vice versa).  

  2. **In the Dessert Case (Step 5):**  
     - The gene is a **common cause** of your craving and your illness, but your *decision* to eat dessert **does not affect your twin’s decision** (there’s no twin!).  
     - Skipping dessert provides evidence about the gene but **doesn’t change outcomes**. It’s a classic "news management" error of *evidential decision theory* (EDT).  
     - **No symmetry**: You aren’t playing a game against an identical agent. Your choice doesn’t compel anyone else’s choice.  

  ---

  ### **Why (3) is Incomplete (But Not Wrong)**
  - **(3) is half-right**: Superrationality *is* evidential ("my act is evidence"), but it’s **evidential due to logical necessity**, not passive correlation.  
  - **What (3) misses**: In symmetric games, your choice *entails* the other’s choice because of identical reasoning. It’s not *just* evidence—it’s a **logical fixed point**. Defecting "causes" your twin to defect only in the sense that both choices are outputs of the same algorithm.  
  - **Cost of misreading (3)**: If you treat it as *only* about evidence (as in step 4), you collapse superrationality into generic EDT—which *does* recommend skipping dessert and is widely rejected for such cases.  

  ---

  ### **Handling the "Dice-Roll" Objection**
  - **Your professor is correct**: Superrationality *must* accommodate asymmetric solutions (e.g., replying to the letter with probability *1/n*).  
  - **How superrationalists handle it**:  
    - Agents coordinate on a **mixed strategy** they’d all want to follow.  
    - They don’t "roll independently"—they jointly decide on a *rule* (e.g., "each rolls a die and replies iff it lands on 1").  
  - **Is this fatal?** No—it’s a standard patch. Hofstadter’s original formulation implied perfect correlation, but modern treatments (e.g., Douglas Hofstadter later, Ken Binmore) allow correlated equilibria.  
  - **Contested?** Mildly. Some hardliners insist superrationality requires deterministic symmetry (rare), but most accept probabilistic solutions.  

  ---

  ### **What to Keep and What to Drop**
  - **Keep (1) and (2)**: Cooperating in the twin PD is defensible.  
  - **Drop (4)**: It overgeneralizes. Superrationality ≠ EDT.  
  - **Fix (3)**: Emphasize that the "evidence" derives from **shared agency**, not arbitrary correlation.  
  - **Reject (6)’s implication**: Superrationality isn’t refuted—it just doesn’t apply to the dessert case.  

  ---

  ### **Academic Consensus vs. Contested Points**  
  | **Issue** | **Settled?** | **Contested?** | **Notes** |  
  |-----------|--------------|----------------|-----------|  
  | **Superrationality in symmetric PD** | Mostly settled | No | Even critics accept it *if* agents know they’re identical. |  
  | **Superrationality = EDT?** | Settled: **No** | Yes | EDT scholars (e.g., Arif Ahmed) reject superrationality; Hofstadter saw it as distinct. |  
  | **Dessert-gene case** | Settled: **Not superrational** | No | Everyone agrees this is an EDT pitfall. |  
  | **Probabilistic solutions** | Settled: **Allowed** | Mildly | Some debate over whether randomization fits "superrational" spirit. |  

  ---

  ### **How to Present This in Seminar**  
  - **Lead with**: "Superrationality works in symmetric games because your choice *logically implies* the other’s choice—not because acts are generic evidence. The dessert case fails this symmetry test."  
  - **Concede**: "Yes, superrationality uses evidential reasoning, but *only when correlation stems from identical reasoning*. That’s why it avoids the dessert absurdity."  
  - **For the dice roll**: "When identical agents face a coordination problem, they can agree on a randomized *rule* without breaking superrationality."  

  ### **Why This Saves Your View**  
  By rejecting (4), you keep the twin PD cooperation (step 2) without endorsing news management (step 6). The cost is modest: superrationality becomes a niche tool for symmetric games, not a universal decision theory. That’s the consensus price of admission.  

  --- 
  **Final note**: Your gut was right—(3) and (4) were the culprits, but the fix requires precision, not surrender. Hand this in with confidence.
