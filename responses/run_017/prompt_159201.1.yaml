answer: |-
  Sir, your reasoning honours me with its subtlety, yet I fear it glides too smoothly over the chasm that divides the senses. You grant the man possesses, upon sight restored, an 'ordered family of seen figures'. But therein lies the very nub of our disagreement! I contend that what he possesses is *not* immediately a family of *figures* at all, in the sense he understands from touch. He possesses a sudden, bewildering manifold of light, colour, and variation in what philosophers term 'apparent magnitude' – a flat, painted scene upon his eye, as it were. Order? Structure? Resemblance to the tangible world he knows? This is precisely what is *not* given inherently to the sense of sight alone. His touch knows the globe by the uniform yielding of surface under his palm, the cube by the distinct pressure of edges and corners – ideas of resistance, solidity, and three-dimensional form built through active exploration. What greets his new eye is a play of light and shadow, patches differing in hue and brightness. Where is the *necessary* connection between this specific pattern of light and the tangible resistance of the cube's edge? Where is the intrinsic logic binding that particular luminous disc to the tangible, enclosing curve of the globe?

  Experience, Sir, adds the vital *connexion* – not merely a 'pairing', as one might pair a name to a face already known – but the very *recognition* that *this* visual appearance *is* the tangible thing he knows. It teaches him that these disparate sensations – the visible patch and the tangible resistance – belong *to the same external object* and signify its properties. You speak of Leibniz's shared 'extension' and Reid's reasoning geometer. But extension *seen* is a spread of colour within a bounded field; extension *felt* is a disposition of resisting parts occupying space. Are they not fundamentally different *ideas*, however much we may discern a correlation *after* experience? Could the blind geometer, by pure reason, deduce that *this* particular pattern of light and shade *must* correspond to the acute pressure of a cube's corner? Or would he see only a complex arrangement of brightness, needing touch to anchor it to his known world of form? A single instance of seeing the cube while touching it *might* indeed suggest a correlation, but that very suggestion *is* the work of association learned in that moment – it is the experience supplying the link reason alone could not forge *a priori*. The speed of learning proves the power of the associative faculty, not the identity of the ideas or the sufficiency of reason. If the correspondence were inherent in the structure, Sir, why should he need the experience at all? Why should he not *immediately* declare, "This visible pattern *is* the cube I know by touch"? But he does not, because the ideas *are* distinct. The question probes the very origin of our concepts of objects: are they built from senses converging through experience, or are they innate or logically deducible universals? I hold firmly to the former. Pray, Sir, if the visible figure and the tangible figure were truly the *same* idea, how do you account for the utter strangeness the newly sighted report upon first seeing the objects they knew so well by touch? Is not that strangeness the mark of difference?
