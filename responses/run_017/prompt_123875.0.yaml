prompt: |-
  I spent the better part of forty years as an experimental solid-state physicist, most of it in X-ray crystallography, and since retiring I have been sitting in on a philosophy of science reading group. I came to the underdetermination debate from what I take to be an unusual direction: not from scepticism about unobservable entities, but from the fact that in my own working life the data frequently did not fix the answer, and this never struck me as a philosophical difficulty. It does now, and I should be grateful for help in working out what I actually think.

  Below are the cases I keep turning over, with my untutored verdicts.

  (i) The phase problem. A diffraction experiment yields intensities, not phases; a great many electron-density distributions are consistent with the same measured amplitudes to within the noise. Verdict: genuine underdetermination, and not remotely worrying. I knew exactly which degrees of freedom were unconstrained, I pinned them down with a smoothness rule, and I never once thought that the structure my rule selected *was* the structure — only that it was good enough to get on with. My realism about the structure was untouched throughout.

  (ii) Newtonian gravity as action at a distance versus Newtonian gravity as a potential satisfying the Poisson equation, with the usual boundary conditions. Verdict: not underdetermination at all, merely a change of idiom.

  (iii) Matrix mechanics and wave mechanics once the intertranslation had been exhibited. Verdict: officially the same as (ii), and yet not the same: the two presentations invite pictures of the world — an algebra of observables versus a field in a high-dimensional space — that differ in content, and that no evidence could ever adjudicate between. This bothers me more than (ii), and I cannot say why.

  (iv) A Ptolemaic system with as many epicycles as you please, supposing it reproduces whatever the Copernican system predicts. Verdict: dismiss it. The epicycle engine is a fitting device, not a rival theory. The same holds, even more strongly, for the temporal analogue — a rival that agrees with ours up to some date and diverges thereafter, in the style made familiar by Goodman's grue.

  (v) Newtonian gravity plus a universal extra acceleration term with a free exponent and a free coefficient, fitted to what we have measured. Verdict: I find this genuinely disquieting, though I suspect my discomfort is really about (ix) below rather than about this case as stated.

  (vi) Pilot-wave theory versus the Everettian picture, setting aside the dynamical collapse models, which are not empirically equivalent at all. Verdict: serious, and not verbal — they disagree about what exists. And here, unlike in (i), I do not know what I am entitled to believe.

  (vii) The hypothesis that the world came into being five minutes ago, complete with memories, fossils and laboratory notebooks. Verdict: not worrying, and I should be embarrassed to file it alongside (vi) — even though, on the standard criterion, no possible evidence separates them.

  (viii) Two cosmological models agreeing on everything within our observable patch and disagreeing beyond the horizon. Verdict: real underdetermination, but of a different kind from (vi). In (vi) I suspect there may be no fact of the matter; in (viii) I am confident there is one and merely unreachable. I cannot say what that confidence amounts to if evidence is all we have.

  (ix) Rivals separable only by an experiment that is physically possible but not performable by us — a detector of galactic dimensions, a computation of astronomically many steps, or a wait longer than the age of the universe. Verdict: as bad, for us, as (vi), and yet I want to say the theories genuinely differ.

  The principle I have been groping towards is this. Call two theories *robustly* equivalent when they agree not merely on the evidence we have, but on what would be observed under every physically possible arrangement of apparatus and every physically possible setting of initial and boundary conditions, including arrangements no one will ever build. Then an underdetermination is serious if and only if: (a) the rivals are robustly equivalent in that sense; (b) neither is obtainable from the other by a change of variables, a change of idiom, or the addition of items whose net contribution is fixed at zero; and (c) neither is parasitic — specified only by taking its rival over wholesale and appending a global denial of the rival's truth. Clause (b) is meant to dispose of (ii) and (iv); clause (c) of (vii).

  I should like you to test this against my verdicts, repair it or replace it, and state plainly which of my verdicts it forces me to abandon — I expect (iii) and (viii) are in trouble, and I suspect the principle needs an in-principle/for-us distinction if it is to do justice to (v) and (ix), but I want you to say so rather than to agree with me. Please also give verdicts, and say which clause delivers them, on three cases I have not made up my mind about: a rival pair where the distinguishing quantity is one that the first theory itself entails can be measured by no procedure permitted by its own laws; rivals that agree on every possible observation but disagree about what would have happened under a counterfactual setting of a constant of nature; and rivals differing only in that one postulates two fields whose effects everywhere cancel exactly and the other one.

  Finally: a member of the group says structural realism answers everything on my list — believe the structure the rivals share, withhold on the rest. I should like you to say whether that delivers anything in (v), (vi) and (viii), or whether it merely relabels the difficulty, given that in (vi) the rivals seem to disagree about structure as well.

  Please take a definite position throughout, tell me which verdicts of mine you would overturn and why, and mark clearly where you are going beyond what the literature settles and where you are instead recommending how we use a word. British English, please.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating case - an experienced crystallographer grappling with philosophical underdetermination after encountering it repeatedly in their scientific work. Their detailed examples and tentative principles show deep engagement with the problem. 

  First, I need to understand their core concern: they're untroubled by cases where underdetermination is resolvable through practical constraints (like the phase problem), but deeply unsettled by cases where equivalent theories make different ontological claims (like pilot-wave vs Everett). Their proposed robustness principle attempts to distinguish trivial from serious underdetermination.

  Looking at their cases:
  - (i) Phase problem: Their practical approach makes sense - this is resolvable underdetermination through auxiliary constraints.
  - (ii) Newtonian formulations: Agree this is merely notational.
  - (iii) QM formulations: Here's the first crack - while mathematically equivalent, the visualizations suggest different ontologies. 
  - (iv) Ptolemaic systems: Correctly identified as curve-fitting rather than theory.
  - (v) Modified gravity: This seems to bridge practical and fundamental concerns.
  - (vi) QM interpretations: The heart of their anxiety - irresolvable ontological divergence.
  - (vii) Five-minute hypothesis: Properly dismissed as parasitic.
  - (viii) Cosmology: Their distinction between unreachable truth and no truth is perceptive.
  - (ix) Impractical experiments: Parallels (vi) but with practical rather than fundamental barriers.

  Their robustness principle has merit but needs refinement. The "physically possible arrangements" criterion in (a) is too strong - it excludes cases like cosmology where observations are physically impossible due to causal horizons. We'll need to adjust this to "physically possible and causally connectable".

  For clause (b), the "change of idiom" needs clearer boundaries - wave vs matrix mechanics shows mathematical equivalence can still feel ontologically loaded. And clause (c) correctly excludes parasitic theories but may be too narrow.

  The additional cases they propose are excellent tests:
  1. Self-forbidding measurements: This exposes limits of operationalism
  2. Counterfactual constants: Tests modal commitments
  3. Canceling fields: Probes ontological parsimony

  Regarding structural realism: It helps in some cases (like gravity formulations) but fails for QM interpretations where the structures themselves differ. The user is right to suspect it merely relabels the problem in contentious cases.

  Throughout, I'll maintain their British English preference while providing clear verdicts on which of their initial judgments hold up under scrutiny. The goal is to validate their scientific intuition while refining their philosophical framework - particularly their instinctive distinction between practical and fundamental underdetermination.
answer: |-
  Right then, let's get stuck in. Your scientific pragmatism shines through your cases, and your groped-towards principle is a damn sight better than most armchair philosophising. We'll test it against your verdicts, mend it where it buckles, and see what has to give. I'll be blunt where I disagree and clear about where I'm going beyond settled doctrine.

  **Testing Your Principle Against Your Verdicts**

  Your Principle: Serious underdetermination requires (a) robust equivalence (agreeing on *all* physically possible observations), (b) not merely a change of idiom/variables or a zero-addition, (c) not parasitic.

  *   **(i) Phase Problem:** Your verdict (genuine, not worrying) stands. **Clause (a) fails.** The many electron-density distributions *do not* agree on what would be seen under *all* possible arrangements/scatterings. Different densities predict different patterns for experiments *not yet done*. Your smoothness rule effectively breaks the equivalence pragmatically. Principle passes, verdict stands.
  *   **(ii) Newtonian Idioms:** Your verdict (not underdetermination) stands. **Clause (b) disposes of it.** It's a change of mathematical representation (potential <-> force) within the same physical content. Principle passes, verdict stands.
  *   **(iii) Matrix vs. Wave Mechanics:** **Your principle forces you to abandon your sense that this is different/bothersome.** *Officially*, it satisfies (b) – the equivalence theorems (Dirac, von Neumann, Stone) show it's a change of representation (like Fourier transforms), not fundamentally different content. The "pictures" are heuristic aids, not part of the core theory's empirical content. If you find it bothersome, it's likely conflating the *heuristic* with the *theoretical content*. The principle deems it non-serious like (ii). *However…* I suspect your discomfort points to a genuine issue: the difference between *mathematical equivalence* and *interpretive equivalence*. Your principle, as stated, might miss this nuance. More below.
  *   **(iv) Ptolemaic System / Grue:** Your verdict (dismiss) stands. **Clauses (b) and (c) dispose of it.** Epicycles are a fitting technique within a framework (geocentrism + uniform circular motion) *already falsified* by the simplicity/unity Copernicus offered for new phenomena (retrograde motion explanation, phases of Venus). Grue is parasitic by definition (c). Principle passes, verdict stands.
  *   **(v) Modified Gravity:** **This is tricky and exposes a flaw.** Your verdict (disquieting) is partly upheld, but the principle *as stated* likely classifies it as non-serious **if** the extra term is truly fitted only to *existing* data. Why? **Clause (a) likely fails.** An extra universal acceleration term with free parameters, fitted only to current data, will *not* predict the same outcomes as standard Newtonian gravity for *all possible* future observations within the solar system or beyond (e.g., precise spacecraft trajectories, galactic rotation not yet measured when fitted). Its predictions diverge for unobserved cases. Your discomfort likely stems from its link to **(ix)** – the *possibility* that a theory *could* be rigged to match *all possible* observations via such devices, making underdetermination pervasive. The principle *as stated* doesn't directly address this worry about *pervasive* riggability. Principle *initially* suggests non-serious, but your discomfort points to a deeper issue needing fixing.
  *   **(vi) Pilot-Wave vs. Everett (no collapse):** Your verdict (serious, not verbal) stands. **The principle classifies this as serious underdetermination.** They are robustly equivalent (a) (modulo contentious technical debates about infinity/singularities which we'll assume are resolved). They are not related by a mere change of idiom/variables (b) – one has particles with definite positions guided by a wave, the other has only a wave branching. Neither is parasitic on the other (c). Principle passes, verdict stands.
  *   **(vii) Five-Minute Hypothesis:** Your verdict (not worrying, embarrassing) stands. **Clause (c) disposes of it.** It's parasitic by definition – it takes the current state of the world *as given* by our evidence and appends a global denial of its past reality. Principle passes, verdict stands.
  *   **(viii) Cosmological Models (beyond horizon):** **Your principle forces you to abandon your confidence in a fact of the matter.** This satisfies (a) (all observations *causally connectable to us* are identical), (b) (they aren't mere re-labellings), and (c) (neither is parasitic). The principle deems it serious underdetermination, *just like (vi)*. Your intuition that there *is* a fact "out there" is powerful, but the principle, relying solely on *possible evidence connectable to us*, cannot justify it. Evidence *is* all we have, by your own stipulation. Principle demands you treat this as seriously as (vi).
  *   **(ix) Distinguishing Experiment Physically Possible but Unperformable:** Your verdict (as bad as (vi) for us) stands, and the principle **initially fails** to classify it as serious. Why? **Clause (a) is satisfied** (they agree on all observations *possible for us to make*), **but clause (a) as stated requires agreement on *all physically possible* observations, including those requiring the galactic detector/etc.**. If the galactic detector experiment is *physically possible*, then theories that disagree on its outcome *fail (a)*. They are *not* robustly equivalent. The principle would say the underdetermination is *not serious* because the theories make different predictions for a physically possible experiment. This contradicts your verdict. Your intuition that it's "as bad *for us*" points to the need for a "for-us / in-principle" distinction within clause (a).

  **Repairing the Principle**

  Your principle needs two key repairs to handle (iii), (v), (viii), and (ix), and to better capture your scientific intuition:

  1.  **Refine Clause (a) - The "For-Us / In-Principle" Distinction:** We need to separate:
      *   **Robust Observational Equivalence (For-Us):** Theories agree on the outcomes of *all experiments that are both physically possible AND causally connectable to us* (i.e., we could, in principle, build the apparatus and receive the signal within the constraints of cosmology and physics).
      *   **Robust Observational Equivalence (In-Principle):** Theories agree on the outcomes of *all experiments that are physically possible*, full stop.
  2.  **Address the "Riggability" Worry (linked to (v) & pervasive underdetermination):** Add a clause concerning theoretical virtue or prior probability, but this is controversial. A weaker fix is implicit in the refined Clause (a). If a theory has many free parameters *only* adjustable to *past* data and makes wildly complex predictions for the future, it may *fail* clause (a) robustly (because its predictions for future feasible experiments are unstable or demonstrably wrong). The worry in (v) is about theories *rigged* to pass *all possible* tests. This leads to...
  3.  **Clarify Clause (b) - "Change of Idiom" vs. Interpretation:** Make explicit that (b) covers *mathematical equivalence* (like (ii) and, arguably, (iii)) but *not* merely *interpretive equivalence* under the same mathematical formalism (like different interpretations of the quantum formalism in (vi)). This helps with (iii).

  **The Revised Principle:**

  Two theories \(T_1\) and \(T_2\) suffer from *serious underdetermination* if and only if:
  **(a)** They are *robustly observationally equivalent for-us*: They agree on the outcomes of all experiments that are physically possible *and* causally connectable to us (i.e., we could, in principle, build the apparatus and receive the signal).
  **(b)** They are not *merely notational variants*: Neither is obtainable from the other by a mathematically definable change of variables, reinterpretation of symbols, or the addition of entities/structures whose net observable contribution is demonstrably fixed at zero *by the theories themselves*.
  **(c)** Neither is *parasitic*: Neither is specified solely by taking \(T_1\) (or \(T_2\)) wholesale and appending a global denial of its truth or past reality.

  **Additional Notes:**
  *   Clause (a) *for-us* addresses **(viii)** and **(ix)**. In (viii), the regions beyond the horizon are *not* causally connectable to us. In (ix), the galactic detector is *not* buildable/receivable *by us* (within cosmic time/energy constraints). Thus, both satisfy (a) *for-us*. In (ix), they *fail* (a) *in-principle* (because the detector is physically possible), explaining why we want to say they "genuinely differ".
  *   Clause (a) *for-us* makes **(v)** less disquieting *if* the extra term causes predictions *for feasible future experiments* to diverge from standard Newton. If it's rigged *only* to match *past* data, it likely fails (a) *for-us* for future feasible tests. The *pervasive* worry (could *any* theory be rigged?) remains philosophically open but is pragmatically constrained by theoretical virtues (simplicity, unity) that guide science.
  *   Clause (b) now clearly includes **(iii)** - the equivalence is mathematical (unitary transformation). The different "pictures" are interpretive glosses *on the same formalism*, not part of the core empirical content defining the theory. This dissolves the bother (or should).
  *   Clause (b) excludes adding "canceling fields" (see below).
  *   Clause (c) clearly excludes **(vii)** and Grue.

  **Verdicts on Your New Cases (using Revised Principle)**

  1.  **Distinguishing quantity forbidden by T1:** Suppose \(T_1\) entails quantity Q exists but *also* entails that no measurement procedure permitted by \(T_1\)'s laws can reveal its value. \(T_2\) is identical except it denies Q exists or gives it a different value. **Verdict: SERIOUS underdetermination.** **Clauses:** (a) *for-us* satisfied (no possible connectable observation differs). (b) satisfied – not a change of idiom; Q's existence/value differs. (c) satisfied – neither parasitic. This exposes a limit: theories can contain empirically inert (even inert-in-principle-under-the-theory) structure. Your principle forces agnosticism about Q.
  2.  **Agree on all observations, disagree on counterfactual constants:** Theory \(T_A\) says constant C has value c. \(T_B\) says C has value c', but also includes laws ensuring that *if* C *were* c', the observable universe would be identical to how it is *with* C=c. (Think of fine-tuning arguments run backwards). **Verdict: SERIOUS underdetermination.** **Clauses:** (a) *for-us* satisfied (all actual observations agree). (b) satisfied – different constant values are different physical claims. (c) satisfied. The disagreement is about modal facts (what *would* happen *if*) that are not observable, only actual observations are. Principle forces agnosticism about the unactualized possibility.
  3.  **Canceling fields vs single field:** \(T_1\): One field F. \(T_2\): Two fields G and H, where G + H = F everywhere for all time. **Verdict: NOT serious underdetermination.** **Clause (b) disposes of it.** The pair (G, H) in \(T_2\) is *structurally* identical to F in \(T_1\), and \(T_2\) contains entities (one of G or H) whose *net observable contribution* is demonstrably fixed at zero relative to \(T_1\) (since G + H = F). This is akin to adding a constant to a potential. Ontological parsimony favours \(T_1\), but the principle rules it non-serious via (b).

  **Structural Realism (SR)**

  Your group member is partly right, but SR doesn't magically solve the hard cases. SR says: believe the structure common to empirically equivalent rivals (the "shared structure"), be agnostic about the rest.

  *   **(v) Modified Gravity:** SR helps *if* the extra term is just fluff. The shared structure is the standard Newtonian core. If the modified theory is just standard Newton plus redundant terms, SR says believe the core. If it's a *genuinely different* universal law (e.g., a different potential), even if currently observationally equivalent, SR says believe the common *empirical predictions* (the structure of the observable world they agree on), but be agnostic about which potential law is "real" *if* they remain equivalent *for-us*. It relabels the difficulty but offers a positive epistemic stance.
  *   **(vi) Pilot-Wave vs. Everett:** **SR struggles badly here.** What is the "shared structure"? The *quantum formalism* (wave function, Schrödinger equation) is common. But Pilot-Wave adds *particle trajectories* and a *guidance equation* – that's *more* structure. Everett has *only* the wave function evolving – that's *less* structure (no extra particles/guidance). They disagree fundamentally on what the basic ontology *is*. SR might say "believe the quantum state structure", but this is precisely what Pilot-Wave *adds to*. Or it might say "believe the common empirical predictions", which is thin gruel. SR *relabels* the difficulty here rather than resolving it. It doesn't tell you whether the extra structure of particles is real or whether the branching structure of the wave is real.
  *   **(viii) Cosmology:** SR offers a clear, positive stance. Believe the structure *within our observable patch* that both models share (the FLRW metric, standard model physics, etc.). Withhold belief about the global structure beyond the horizon (cyclic vs. infinite, differing topologies, etc.). This aligns perfectly with your intuition that there *is* a fact but we can't reach it. SR provides epistemic justification for believing the local structure we *can* access.

  **Definite Positions & Verdict Overturns**

  1.  **Overturn your verdict on (iii):** Matrix vs. Wave Mechanics *is* just a change of representation (idiom). The bother stems from heuristic pictures, not core content. **Revised Principle (Clause b) confirms this.**
  2.  **Overturn your verdict on (viii):** Your confidence in a "fact out there" beyond the horizon is epistemically unjustified. The underdetermination is as serious as (vi). **Revised Principle (Clause a *for-us*) forces this.**
  3.  **Modify your stance on (v):** The disquiet is warranted *if* it highlights *pervasive* riggability (the threat of theories rigged to match *all possible* observations). The principle (Clause a *for-us*) mitigates it for *specific* cases like your example, as the extra term *will* cause divergence for feasible future experiments. The *general* worry persists but is a different philosophical problem.
  4.  **Affirm your verdicts on (i), (ii), (iv), (vi), (vii), (ix - spirit).** The Revised Principle supports these.
  5.  **Structural Realism:** Is valuable, especially for (viii) and some aspects of (v). It provides a positive epistemic stance ("believe the structure") where the principle only tells us underdetermination is serious. **It fails decisively for (vi),** merely restating the ontological disagreement as a disagreement about which structure is fundamental.

  **Where I Go Beyond/Define**

  *   **The "For-Us / In-Principle" Distinction in Clause (a):** This is crucial and goes beyond standard formulations, which often conflate physical possibility with epistemic accessibility. I'm defining "causally connectable to us" operationally.
  *   **Clarifying "Change of Idiom" (b) to exclude interpretive glosses under mathematical equivalence:** This sharpens the boundary between formal equivalence and ontological equivalence. I'm recommending we use "change of idiom/variables" strictly for mathematical redescription.
  *   **Treating "canceling fields" under (b):** I'm defining "net contribution fixed at zero" as falling under (b)'s exclusions.
  *   **The verdict on "self-forbidding measurement":** This pushes operationalism to its limit. I'm asserting that empirically inert structure creates serious underdetermination under the principle.
  *   **The verdict on "counterfactual constants":** I'm asserting that agreement on all actual observations, even with modal disagreement, satisfies (a) *for-us* and creates serious underdetermination. Modal facts aren't observable.

  In essence, your scientific pragmatism – focused on what we *can* access and what breaks equivalence in practice – is sound. The philosophical difficulty arises when equivalence is robust *relative to our cosmic and physical limitations as observers*. Your revised principle, incorporating the "for-us" caveat, captures this boundary and forces a disciplined, evidence-based agnosticism where your realism instinctively reached beyond. Structural realism offers a way to believe *something* positive in some of these cases, but not in the hardest one (vi) where the very nature of the structure is contested.
