answer: |-
  Here’s the full specification for a contractualist solution to aggregation, designed to be action-guiding for institutions, with core requirements derived *from contractualism itself* and clearly flagged external pressures. The goal is to identify what makes a solution **contractualistically adequate**, not merely philosophically interesting.

  ---

  ### **Core Requirements (Non-Negotiable for Contractualism)**
  1.  **Individualist Justification (The Foundational Constraint):**
      *   **What:** Justification must always be framed in terms of burdens/benefits *to specific individuals*. A principle is rejected *because* of the complaint of *one* (or more) individuals who fare worse under it.
      *   **Why:** This is the heart of Scanlon's framework. The "reasonable rejection" test is fundamentally agent-relative and complaint-based.
      *   **Source:** Contractualism itself. Violating this collapses into consequentialism.
      *   **Test Case:** *Any* case. If justification appeals directly to "the greater sum of benefits," it fails.

  2.  **Non-Arbitrary Thresholds / Non-Discontinuity (The Dilution Problem):**
      *   **What:** The solution must explain *why* aggregating 10,000 trivial benefits outweighs one limb-loss, but aggregating 2 trivial benefits (or 9,999) does *not*. It cannot rely on an arbitrary number ("magic N") where aggregation suddenly "kicks in."
      *   **Why:** Without this, the principle is vulnerable to the Sorites paradox ("heap problem") applied to complaints. It becomes practically arbitrary and indefensible *to the individual* losing the limb if N=10,000 is chosen but N=9,999 is not.
      *   **Source:** Internal requirement for principled coherence *within contractualism*. A principle relying on arbitrariness is reasonably rejectable.
      *   **Test Case:** *Dilution*.

  3.  **Complaint Integrity (The Shrapnel Problem):**
      *   **What:** The solution must prevent "gerrymandering" a large loss into many small fictional losses simply to allow aggregation against many small benefits. The "unit of complaint" must be tied to a genuine, distinct harm *to a single individual's life*.
      *   **Why:** Otherwise, aggregation is trivially reintroduced by redescribing one large harm as many small ones, violating the individualist constraint.
      *   **Source:** Contractualism's focus on *lives individuals can live*. A complaint must correspond to a distinct setback in an individual's interests/welfare/life-plan, not an artificial fragmentation.
      *   **Test Case:** *Shrapnel*.

  4.  **Explainability to the Loser:**
      *   **What:** The justification for imposing a large burden on individual A must be articulable *to A* in terms they could not *reasonably* dismiss, even if they disagree. It cannot rely on opaque calculations or incommensurable "greater goods."
      *   **Why:** Contractualism is dialogic. Principles must be justifiable *to each person affected*.
      *   **Source:** Contractualism's justificatory ambition ("principles no one could reasonably reject").
      *   **Test Case:** *Plain Case*, *Reverse Case*.

  ---

  ### **Highly Desirable Requirements (Often Pressured by Context)**
  5.  **Handles the Basic Aggregation Intuition (The Plain Case):**
      *   **What:** The solution must permit an institution to justify choosing an action that saves 10,000 people from a minor headache over saving one person from losing a limb (or similar large/small trade-offs).
      *   **Why:** Strong intuition that *some* aggregation is necessary for plausible institutional decision-making. A solution that *never* allows this seems practically and morally inadequate.
      *   **Source:** External pressure from practical rationality and common moral intuitions. *Not* strictly required by contractualism's core logic (an individualist view *could* deny this aggregation).
      *   **Negotiability:** A solution *could* theoretically reject this, but likely at the cost of practical relevance for institutions.

  6.  **Provides Action Guidance Under Uncertainty:**
      *   **What:** The principle must generate determinate decisions in real-world cases involving risk, partial information, and time pressure (like triage).
      *   **Why:** Requirement for institutional usability.
      *   **Source:** External pressure from the *purpose* (guiding institutions). Contractualism itself can be silent on uncertainty (focusing on outcomes under principles).
      *   **Negotiability:** High. Solutions can incorporate ex ante perspectives or decision rules *under* the principle.

  7.  **Addresses Identity & Timing (Same-Person-Over-Time):**
      *   **What:** The solution must clarify whether aggregating small benefits *over time for one person* is structurally identical to aggregating small benefits *across many people* when weighed against a large cost (to that same person later, or to another).
      *   **Why:** To ensure consistency in the theory of complaints. Is a complaint time-bound? Person-bound? What constitutes a "single" complaint across time?
      *   **Source:** Internal pressure for coherence in defining the "individual" and "complaint." Often neglected in simplified discussions.
      *   **Negotiability:** Must be addressed for full coherence, but specific answers might vary.

  8.  **Handles Existential Dependence (Conditional Existence):**
      *   **What:** The solution must clarify the status of individuals whose very existence depends on a principle permitting aggregation (e.g., future people created by a policy justified by aggregating benefits).
      *   **Why:** Affects the scope of "individuals affected" and the validity of their potential complaints.
      *   **Source:** External pressure from population ethics. Contractualism often focuses on existing/fixed populations. Tricky but important for some institutional contexts (e.g., long-term policy).
      *   **Negotiability:** Potentially deferred if the institution's scope is fixed-population, but ultimately necessary for completeness.

  ---

  ### **Suspected Tensions & The Biggest Hurdle**
  *   **Core Tension:** Requirement 1 (Strict Individualism) vs. Requirement 5 (Basic Aggregation) vs. Requirement 2 (Non-Arbitrariness).
      *   How to allow the 10,000 headaches to outweigh the limb *without* summing complaints *and* without an arbitrary threshold, while justifying it *to the limb-loser*?
  *   **The Biggest Hurdle:** **Requirement 2 (Non-Arbitrary Thresholds / Non-Discontinuity)**. This is the killer for most simple solutions. Individual pairwise comparison (Scanlon's initial move) struggles horribly with dilution. Tie-breaker views often sneak arbitrariness in. Straight summation violates individualism. Ex-ante views struggle to connect to actual complaints.
  *   **Most Likely "Smuggled" Requirement:** **Completeness/Transitivity.** We often *assume* the ordering of principles must be complete and transitive for institutional use (Requirement 6). But contractualism, focused on pairwise reasonable rejectability between principles, might naturally yield incomplete or non-transitive orderings. Forcing completeness/transitivity might push the solution towards consequentialism or require arbitrary breaks.

  ---

  ### **Scorecard: How Approaches Fare Against Core Requirements**
  *(✓ = Satisfies Core, ~ = Partially/Problematic, ✗ = Fails Core, ? = Unclear/Debatable)*

  | Approach                     | Individualist Justification (1) | Non-Arbitrary Thresholds (2) | Complaint Integrity (3) | Explainability (4) | Handles Plain Case (5) |
  | :--------------------------- | :------------------------------ | :--------------------------- | :---------------------- | :----------------- | :--------------------- |
  | **a) Straight Aggregation**  | ✗ (Sums, not individual)        | ✓ (No threshold)             | ~ (Depends on definition) | ✗ (Opaque sum)     | ✓                      |
  | **b) Individual Pairwise**   | ✓                               | ✗ (Fails dilution badly)     | ✓                       | ✓                  | ✗ (No aggregation)     |
  | **c) Threshold/Tie-Breaker** | ~ (Only after threshold)        | ✗ (Threshold is arbitrary)   | ✓                       | ~ ("Threshold met")| ✓                      |
  | **d) Ex Ante / Randomizing** | ? (Focuses on *expected* complaint) | ? (Depends)                  | ? (Can fragment risk)   | ~ ("Fair chance")  | ✓                      |
  | **e) Complaints as Vetoes w/ Magnitude Comparison** | ✓ (Rejection based on *my* loss vs. *their* gain) | ~ (Needs non-arbitrary magnitude comparisons) | ✓                       | ~ ("Your loss is much worse than what others gain") | ✓ (If magnitudes comparable) |

  **Key Insight:** Approach (e) – comparing the *magnitude* of the single loser's complaint against the *magnitude* of the *gain* enjoyed (or loss avoided) by *each* beneficiary *individually* – comes closest on core requirements *if* it can solve the magnitude comparison problem non-arbitrarily (Requirement 2). This is the essence of moves like Scanlon's "generic reasons" comparison or "complaint strength" views. However, **Requirement 2 (Non-Arbitrary Thresholds/Dilution)** remains the critical pressure point: How does the *number* of beneficiaries factor in *without* summing and *without* an arbitrary point where the individual comparisons suddenly flip? This is where the "shape of the problem" is most acute. Any solution must crack this nut.
