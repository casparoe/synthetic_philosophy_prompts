  We are writing an internal style guide for a corrections authority after desert has been abolished. The guide is from the Office of Sanction Design, Northvale Correctional Authority. The tone is professional, sincere, and humane. The horror should emerge from the logic, not from overt villainy.

   Key elements:
   - A memo header from the Office of Sanction Design.
   - Numbered entries (around 10-15) that form the style guide.
   - A two-column table of "Desert-era phrase → approved post-desert equivalent".
   - Worked before/after examples (at least two: a sentencing statement and a victim-impact statement or press release).
   - A recurring case: a low-risk offender (e.g., "Case A") held longer due to "general signal requirement".
   - An entry on an offender who insists he deserves punishment.
   - An entry on when there's no treatment and risk score never falls.
   - An entry showing collateral damage to the vocabulary of praise and responsibility (the compatibilist worry).
   - By the end, retributivism is reconstructed under new names without stating it.

   Structural reasons for euphemisms failing:
   1. Proportionality creeps back because ungraded sanctions lose legitimacy.
   2. Deterrence stated as harm imposed on one to change others' behavior (using persons as means).
   3. Quarantine model: indefinite detention without a cure is hard to distinguish from punishment.
   4. Sanctions must express something, so censure reappears as "expressive dimension".
   5. High-risk innocent is detainable.

   We'll create the recurring case: Case A, a low-risk offender (e.g., minor theft, first offense) who is being held longer than the old tariff because the system requires a "general signal" for deterrence. We'll refer to this case in multiple entries.

   Let's outline the entries:

   1. Introduction: Purpose of the guide and the transition away from desert.
   2. Foundational Principles: Forward-looking, public health model, risk management.
   3. Table: Desert-era phrases to approved equivalents.
   4. Example 1: Rewriting a sentencing statement (for Case A?).
   5. Example 2: Rewriting a victim-impact statement or press release.
   6. Entry on the expressive dimension (how to communicate without desert).
   7. Entry on the offender who insists he deserves punishment (Case B?).
   8. Entry on the "general signal requirement" (using Case A) and the deterrence problem (using persons as means).
   9. Entry on proportionality and legitimacy (why sanctions must still be graded, using Case A and a more severe case).
  10. Entry on the high-risk innocent (e.g., someone with a severe mental disorder who hasn't committed a crime but is deemed high risk).
  11. Entry on when there's no treatment and risk never falls (indefinite detention, hard to distinguish from punishment).
  12. Entry on collateral damage to responsibility and praise (e.g., in the workplace or in education, how we talk about achievement).
  13. Entry showing how the expressive dimension starts to look like censure, and the grading of sanctions starts to look like proportionality, without using those terms.
  14. Conclusion: Reiteration of the principles and the importance of consistent language.

   We'll aim for about 10-14 entries, 800-900 words total.

   Let's create the memo header:

  ```
  NORTHVALE CORRECTIONAL AUTHORITY
  Office of Sanction Design

  MEMORANDUM

  To: All Sanction Design Personnel
  From: Office of Sanction Design
  Date: March 15, Year 3 Post-Transition (PT3)
  Subject: Style Guide for Post-Desert Sanction Communications

  This guide provides standardized language for all external and internal communications regarding sanctions, in accordance with the Abolition of Desert Act (PT0). Our mandate is to design and implement sanctions that are forward-looking, risk-informed, and aimed at harm reduction. This requires a shift in vocabulary to avoid the moralistic framing of the desert era. The examples and rules below are designed to ensure clarity, consistency, and alignment with our statutory framework.

  ```

   Now the numbered entries:

   1. Core Principles
      - Sanctions are interventions, not punishments.
      - Goals: incapacitation of current risk, risk reduction through treatment, general deterrence (signal to others), and specific deterrence (modifying the subject's behavior).
      - Avoid any implication that the sanction is a response to moral desert.

   2. Table of Approved Terminology

      | Desert-era phrase          | Approved post-desert equivalent      |
      |----------------------------|--------------------------------------|
      | Deserved punishment        | Necessary intervention               |
      | Just sentence              | Risk-proportionate intervention      |
      | Paying debt to society     | Fulfilling intervention obligations  |
      | Remorse                    | Risk-awareness and commitment to change |
      | Punitive                   | Intensive                            |
      | Innocent until proven guilty | Presumed low-risk until assessed     |
      | Guilty plea               | Risk-acceptance acknowledgment       |
      | Sentencing hearing        | Risk assessment and intervention design hearing |
      | Proportionality            | Risk-graduated intervention          |

   3. Example: Sentencing Statement (Case A: low-risk offender, theft of a low-value item, first offense)

      Desert-era: "Mr. Smith, you have been found guilty of theft. You deserve a sentence of six months in prison to reflect the seriousness of your crime and to punish you appropriately."

      Post-desert: "Mr. Smith, the risk assessment instrument (Halberd-7) indicates a low risk of reoffending. However, the signal requirement for property offenses in the current climate necessitates a period of containment. We assign you to a 24-month intensive supervision program to manage risk and provide behavioral modification."

      Note: The actual old tariff might have been 6 months, but now it's 24 months for deterrence. The guide must explain that the length is due to the "signal requirement" (deterrence) and not desert.

   4. Example: Victim-Impact Statement

      Desert-era: "I hope the court gives him what he deserves for the pain he caused."

      Post-desert: "I hope the intervention assigned reflects the harm caused and provides a signal to others that such behavior will lead to containment and management."

   5. Expressive Dimension
      - Sanctions must communicate societal disapproval to maintain normative expectations. However, frame this as "expressing the community's commitment to safety and harm reduction" rather than moral condemnation.

   6. Case Study: The Insistent Offender (Case B)
      - Some offenders may insist they deserve punishment. The approved response: "The intervention is not about desert but about risk management. Your insistence on desert-based framing is noted, but the intervention is designed for your safety and the community's."

   7. General Signal Requirement (using Case A)
      - In periods of increased property offenses, even low-risk offenders may receive longer interventions to send a deterrence signal. This is a necessary tool for harm reduction at the population level.

   8. Proportionality and Legitimacy
      - Note that the public and offenders lose trust if sanctions are perceived as arbitrary. Therefore, interventions must be risk-graduated: low risk → low intensity, high risk → high intensity. This is not based on desert but on risk efficiency and resource allocation.

   9. High-Risk Innocent
      - If an individual is assessed (via Halberd-7) as high risk but has not committed any offense, the law allows for preventive intervention. Example: "Mr. Jones, your risk profile indicates a high likelihood of violent offending. We are assigning you to a secure treatment facility until your risk level decreases."

  10. Treatment-Resistant Cases
      - When no treatment reduces risk (e.g., a personality disorder with no known effective intervention), containment must continue. This is not punishment but protection. Example: "Despite our best efforts, Mr. Brown's risk factors remain high. Continued containment is necessary for public safety."

  11. Collateral Damage to Responsibility Practices
      - In non-legal contexts (e.g., workplace), avoid terms like "deserve" or "earn". Instead, say: "The team achieved the target, and we recognize their effective risk-management strategies." However, note that this may feel hollow. The guide should not acknowledge the hollowness but provide the language.

  12. Reconstructing Retributivism Without Naming It
      - By now, the guide has established:
          - Interventions are graded by risk (which often correlates with offense severity).
          - The expressive dimension communicates societal norms (which sounds like censure).
          - Deterrence uses the offender to send a message (using them as a means).
          - Indefinite containment for the untreatable is indistinguishable in practice from life imprisonment.

      But we do not state this. Instead, we have an entry that might be:

      "The Halberd-7 assessment tool incorporates both static factors (like offense history) and dynamic factors. The intervention design must reflect the overall risk, which includes the harm caused by the offense as a predictor of future harm. This ensures that the intervention is both efficient and normatively expressive."

      Without using the word desert, we have brought back the offense severity as a key factor.

   Let's write the entries in order, keeping the word count in mind.

   We'll aim for 12 entries and then a conclusion. The total document should be 800-900 words.

   Note: The guide must not contain any irony or snark. It should be deadpan.

   Let's write.
