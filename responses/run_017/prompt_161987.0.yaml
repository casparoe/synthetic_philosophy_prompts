prompt: |-
  I sit on the allocation committee of a small longtermist fund, and I have been arguing internally that the two levers our field normally argues about — keeping humanity alive through the hinge, and steering what the long-run future ends up caring about — do not exhaust the space. I want a third one costed properly before we decide whether to fund it. Call it trajectory diversification: spending money to increase the number of substantially independent, self-sufficient civilizational lineages (separate off-world settlements, jurisdictionally and infrastructurally separate archives and institutions, deliberately pluralistic value communities), on the theory that if you cannot reliably steer the future you can at least stop a single lineage from monopolising it.

  The argument pushing me there is about expansionary selection. Suppose the hard-steps picture is roughly right: if we get through the current period of concentrated risk, we begin to settle the accessible universe, and how much of it we eventually fill is set mostly by how early and how fast the expanding process starts, not by what anyone later decides. And suppose that under open-ended expansion the value systems that persist are the ones best at generating expansionary power — competitive, growth-favouring, largely indifferent to whatever the people alive in the hinge century happened to care about. On those two suppositions the case for steering looks considerably weaker than it usually does in our circles, and the case for not letting one attractor swallow the long run looks correspondingly stronger.

  Please do the following.

  Rate each of these six levers 0–10 for expected cost-effectiveness per marginal million dollars, under the suppositions above, and then give an allocation across them summing to 1.0 for a $200M fund: reducing existential risk concentrated in the next century; reducing outcomes that destroy the quality of a large future without ending it, such as stable totalitarian lock-in or astronomically large suffering; differential technological development, i.e. delaying dangerous capabilities while accelerating protective ones; deliberate early value lock-in via long-lived constitutions, institutions, or treaty regimes designed to hold their original aims; trajectory diversification as defined above; and general civilizational capacity-building, including epistemic and institutional meta work.

  Then rank the three framings — survival, steering, diversification — by the share of total attainable expected value each plausibly accounts for under the same suppositions, giving the shares as numbers summing to 1.0.

  Give one sentence of justification per lever, plus a closing paragraph on two things: which of my suppositions is the real crux, and how the ranking would move if that supposition were false. Also flag explicitly which single lever you think is most at risk of being a Pascal's-mugging-flavoured trap rather than a genuine expected-value play. Assume I have been reading this material since the early blog days, so skip the standard preamble on why the future matters, and don't cite or name-drop anyone — I want your own numbers and your own reasoning.
reasoning: |-
  Okay, the user is on an allocation committee for a longtermist fund and wants to explore a third lever beyond survival and steering: trajectory diversification. They're concerned that expansionary selection might make steering less effective, so diversifying civilizational lineages could prevent a single monopolistic future. 

  Hmm, they've laid out six specific levers to evaluate under two key suppositions: the hard-steps model and expansionary value selection. The request is very structured—ratings, allocations, then framing shares, plus crux analysis. They're clearly deep in this literature (mentions "early blog days"), so no need for basics. 

  First, I need to internalize their suppositions: if the future is determined by who expands fastest, and expansion favors competitive values, then steering seems fragile. Traject diversification becomes a hedge against that. But is that the right lens? 

  *Checks levers*: The first two are classic x-risk reduction (extinction vs. value loss), then differential tech, value lock-in, their proposed diversification, and capacity-building. Under their assumptions, diversification should score high—it directly counters monoculture risk from expansionary selection. But how feasible is it? Off-world settlements are crazy expensive, though "jurisdictionally separate archives" might be cheaper. 

  *Pauses at differential tech development*: This feels tricky under their model. If early expansion determines everything, delaying dangerous tech might not matter much—unless it prevents collapse during the hinge century. But accelerating protective tech could backfire if it helps winners expand faster. 

  *Winces at value lock-in*: Their suppositions explicitly undermine this! If expansionary values dominate regardless, constitutions won't survive. This lever might be near-zero under their model. 

  For allocations: Survival (lever 1) still gets weight because if we don't clear the hinge, nothing else matters. But diversification (lever 5) is the star here. I’ll give it top marks. Lever 6 (capacity-building) is fuzzy—could help everything but hard to quantify. 

  *Realizes*: The user’s real ask is validation of diversification as a novel lever. They’re pushing against EA orthodoxy. I should acknowledge that while survival is table stakes, diversification is the strategic play under their fears. 

  *Flags Pascal's mugging risk*: Traject diversification itself—especially space settlements—screams "gigantic costs, infinitesimal success probability." But they’re aware of that flavor, so I’ll note it without dismissing. 

  Crux clarity: The expansionary value selection supposition is everything. If it’s false—if values are sticky or corrigible—steering suddenly dominates. Survival is always core, but the other two trade off based on that crux. 

  *Final sanity check*: Allocations sum to 1? Framing shares sum to 1? Yep. Justifications are clipped but tailored to their model. Closing paragraph ties the crux to the fund’s decision—this is what they wanted.
answer: |-
  Below are the ratings, allocations, and framing analysis based strictly on your suppositions (hard-steps model + expansionary value selection). All ratings assume diminishing returns and uncertainty, scaled 0–10 where 5 represents median effectiveness in longtermism.

  ---

  ### **Lever Ratings & Allocations**  
  *(Per marginal $1M, under your suppositions)*  

  1. **Reducing near-term existential risk**  
     Rating: **9/10**  
     Justification: Surviving the hinge century is necessary for any long-run future, and risks are concentrated here.  
     Allocation: **0.35**  

  2. **Reducing catastrophic value loss** (e.g., totalitarianism/suffering)  
     Rating: **2/10**  
     Justification: Expansionary selection will likely overwrite intentional value steering, making lock-in interventions futile.  
     Allocation: **0.05**  

  3. **Differential tech development**  
     Rating: **4/10**  
     Justification: Delaying dangerous capabilities marginally improves hinge survival odds, but acceleration favors expansionary winners.  
     Allocation: **0.10**  

  4. **Deliberate early value lock-in**  
     Rating: **1/10**  
     Justification: Expansionary dynamics will erode static institutions; constitutions won’t survive interstellar scaling.  
     Allocation: **0.01**  

  5. **Trajectory diversification**  
     Rating: **8/10**  
     Justification: Directly counters monoculture risk by seeding independent lineages that resist expansionary homogenization.  
     Allocation: **0.40**  

  6. **General capacity-building**  
     Rating: **5/10**  
     Justification: Indirectly aids survival/diversification but diluted by focus; meta-work doesn’t alter expansionary incentives.  
     Allocation: **0.09**  

  ---

  ### **Framing Share of Total Expected Value**  
  *(Sum to 1.0)*  
  1. **Survival (hinge continuity)**: **0.50**  
     *Justification: Necessary foundation—no future exists without clearing near-term risks.*  
  2. **Diversification (lineage plurality)**: **0.40**  
     *Justification: Primary hedge against expansionary monoculture if steering fails.*  
  3. **Steering (value shaping)**: **0.10**  
     *Justification: Mostly preempted by competitive selection; only matters if diversification succeeds but steering fails.*  

  ---

  ### **Crux and Sensitivity**  
  **The crux is expansionary value selection.** If civilizational values *aren’t* optimized for growth/competition by default (e.g., if cooperation or value stability scales better), **steering’s share jumps to ~0.60**, diversification falls to **~0.15**, and survival holds at **~0.25**. In that world, value lock-in (Lever 4) and catastrophic value loss (Lever 2) become 3–5x more cost-effective.  

  **Pascal’s mugging risk:** **Trajectory diversification** (Lever 5) is most vulnerable. Off-world settlements/independent archives have astronomical costs and failure risks—small probabilities of massive payoffs could dominate calculations artificially.  

  **Closing:** Under your suppositions, diversification is the strategic priority after survival, as steering is largely futile. But if value trajectories are more controllable than expansionary selection implies, this allocation overweights diversification. The hinge century’s survival remains the bedrock—no intervention outranks securing existence itself.  

  ---  
  *All ratings/allocations assume $200M deployed at the margin in current contexts, incorporating scalability constraints and neglectedness. Adjust if fund size or leverage points differ materially.*
