answer: |-
  Your objections are sharp, but mischaracterize the position. Let's dissect:

  1.  **Skyhooks vs. Undiscovered Cranes:** You conflate epistemic limits with ontological claims. A "skyhook" isn't merely an *unknown* crane; it's posited as an *inherently irreducible*, top-down causal primitive or brute explainer (like vitalism, dualism, or fundamental intentionality). Saying "no skyhooks" means denying that such *types* of explanation are valid *in principle*. When we find a deeper mechanism for something previously deemed "irreducible," it confirms that it was always a crane-in-waiting, not a true skyhook. The claim *is* falsifiable: find a demonstrably fundamental, *non-mechanistic*, top-down cause that cannot *in principle* be analyzed further. We haven't found one. "Keep looking" is the *method*, informed by the *metaphysical* stance that such primitives don't exist.

  2.  **The Regress & "Bedrock":** You pose a false dilemma. Explanatory power doesn't require "bedrock" in the sense of fundamental, inexplicable atoms or particles. The crane-loyalist avoids *both* horns. Explanations are *local* and *contrastive*. We explain a phenomenon *X* by showing how its properties and behavior *arise from* the organized operation of its parts and processes *Y* – a mechanism. *Y*'s existence and properties may *then* be explained by *its* constituents *Z*, and so on. This regress isn't vicious; it's progressive. Each step *does* provide understanding: it replaces a "how possibly?" with a "how actually?" at that level. The "grounding" isn't in a final *thing*, but in the *demonstrated ability* of mechanisms at one level to generate the phenomena at the next. Demanding "bedrock" is demanding magic – an unexplained explainer. The work *is* done by the cranes; the lifting *is* the mechanistic explanation itself. "Greedy reductionism" forbids *premature* stopping disguised as finality, not the *ongoing project* of mechanistic explanation.

  The core isn't "cranes all the way down to *something fundamental*," but "phenomena explained by mechanisms *all the way down*." The explanatory power resides in the *relations* and *operations* at each stage, not in hitting bottom.
