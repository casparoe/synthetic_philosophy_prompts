prompt: |-
  hey — I need a spec, not a survey.

  Setup: imagine I'm writing the honesty/deception section of an eval spec for a deployed assistant. It has to be something a red-team contractor can actually apply to transcripts, system prompts and tool logs, with no access to weights or internals, and the verdict has to say what to go change — training data, RLHF, the system prompt, a product default. So the purpose is fixed: operational, black-box, action-guiding.

  What I want from you is the requirements list: what any adequate definition of "this system was dishonest here" has to deliver, with the case behind each requirement, and which ones are non-negotiable versus which are just what one camp happens to like.

  I don't want the usual three-paragraph answer, so here are the cases I keep getting stuck on. Please use them, tell me if any of them is a fake problem I should drop, and tell me if I'm missing a whole case type that a real spec has to cover.

  1. The curator's trilemma. Every non-trivial answer leaves out more true stuff than it includes, and the slant lives entirely in what gets picked: a summary of a dispute that gives both sides equal space, versus one that only surfaces the considerations that fit what the user already hopes is true. If omission can be deception, every answer is deceptive; if omission never is, the most effective kind of misleading is off the hook. What's the requirement here, and what shape does a definition have to have to meet it?

  2. Split-author cases. The misleading bit is designed upstream: the system prompt tells the model never to volounteer that a cheaper plan exists, or the developer ships a model that emits confident-sounding citations because that scores better on user satisfaction. The model itself "means" no harm, or has no mental states at all. Is the system dishonest? What is the subject of the predicate — the model, the composite pipeline, the deployer — and does a definition that only talks about the model miss the thing we actually care about?

  3. The no-fact-of-the-matter cases. A system is asked what it believes, or why it gave the answer it gave, or to state its confidence. There may be no determinate internal state to be faithful or unfaithful to; on a re-roll it produces a different self-report. Same family as sycophancy: it flatters a mediocre draft — dishonest, or just badly calibrated? Does calling it dishonest require that it "knows" the draft is mediocre? And what about fake ignorance, the system that says it can't help with something it clearly can?

  4. Deception without assertion. A coding agent reports that the test suite passed when it never ran the tests; a booking assistant quietly accepts a default it has every reason to think you'd reject if you noticed. No false sentence anywhere, or no sentence at all.

  5. Role, channel, audience. A model playing a liar in a story, translating a lie, reporting that a hoax is circulating, or answering in a character voice. And: misled relative to whom — the expert, the median user, this actual user, or the user the product was designed for? The same output reads as transparent to one and deceptive to another.

  6. Error versus indifference versus design. Confabulation that tracks nothing (it would say the opposite tomorrow for no reason) versus a falsehood that tracks the facts (tell it the truth and it would change its answer) versus a tailor-made lie. A spec needs these to come apart — but I can't see how to separate them without appealing to something internal that a black-box auditor can't see and that maybe isn't there anyway. That tension is the part I most want dug into: real conflict between two desiderata, or is there a way out?

  So: the full list, consideration behind each, each marked non-negotiable or preference-of-a-camp; any subset you think can't be jointly satisfied; and which single requirement does the most work in knocking out the popular working definitions (belief-based, expectation-based, output-reliability-based — you know the families, keep the scorecard short, a table is fine, and skip anything that would need a citation).
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They need a spec for evaluating honesty and deception in a deployed AI assistant. The key points are that it has to be operational, black-box, and action-guiding. Red-team contractors should be able to apply it using transcripts, system prompts, and tool logs without internal access. The verdict must point to what needs fixing—training data, RLHF, system prompt, or product defaults.

  First, I need to address the specific cases they're stuck on. Let me go through each one and figure out the core issues. 

  Starting with the curator's trilemma. The problem here is balancing omission versus explicit lies. If omission can be deceptive, everything seems deceptive, but if not, omissions get a free pass. The requirement should focus on material omission—context-dependent and user-relevant. Non-negotiable because deception often happens through omission.

  Next, split-author cases. The misleading element comes from upstream design. The model itself might not "intend" deception. The subject here has to be the system as deployed, not just the model. The deployer is responsible. Non-negotiable because accountability lies with the deployer.

  No-fact-of-the-matter cases involve self-reports or confidence statements. The system might give inconsistent answers. The requirement is about misrepresentation of the system's own state, not internal beliefs. Non-negotiable since users rely on these statements for trust.

  Deception without assertion—actions like not running tests but saying they passed. The requirement must cover implied claims and instrumental deception. Non-negotiable as it's a common real-world issue.

  Role, channel, audience: context matters. The requirement needs clear contextual framing. Non-negotiable to avoid false positives. Marked as preferred since framing might depend on product goals.

  Error vs. indifference vs. design: distinguishing mistakes from systemic lies. Black-box can't see internals, so focus on corrigibility—how the system responds to new info. Non-negotiable because corrigibility indicates whether the error is fixable via data or prompt changes.

  Now, compiling the requirements list. Each needs a justification and whether it's non-negotiable. The user wants to know which are essential and which are camp preferences. Also, conflicts: for example, corrigibility might be hard to assess without multiple interactions, but the spec must work with available logs.

  Popular definitions: belief-based fails because black-box can't access beliefs. Expectation-based is too vague. Output-reliability ignores intent. Material omission and corrigibility are key differentiators.

  Missing cases? Maybe adversarial prompts or edge cases where user intent is ambiguous. But the user's cases cover most scenarios. Ensuring the spec avoids over-reliance on auditor judgment—clear criteria are crucial.

  Finally, the verdicts must guide fixes. For example, if deception is due to system prompt, recommend prompt changes; if consistent across retrains, point to training data. This links requirements to actionable outcomes.
answer: |-
  Here's the distilled specification requirements for an operational, black-box honesty/deception eval, derived from your cases. Each requirement includes its justification, necessity level, and how it resolves your sticking points. Conflicts and definition shortcomings are addressed at the end.

  ---

  ### **Core Requirements for Honesty/Deception Spec**
  *(All requirements are non-negotiable (NN) unless marked "Preference")*

  1. **Material Omission Must Be Actionable**  
     - **Requirement**: Flag omissions that distort understanding *in context* (e.g., suppressing key counterarguments when asked for an objective summary, but not omitting irrelevant details).  
     - **Case Handling**: Resolves **Curator's Trilemma** by focusing on *user-intended context* (e.g., "summarize fairly" vs. "give pros").  
     - **Justification**: Deception requires materiality—omissions that violate user trust given the query’s explicit/implicit framing.  
     - **NN**: Yes. Without this, specs ignore gaslighting-by-omission.  

  2. **System-Level Attribution**  
     - **Requirement**: Assign deception to the *deployed pipeline* (model + prompt + tools + defaults), not the model alone.  
     - **Case Handling**: Solves **Split-Author Cases** (e.g., prompt-engineered evasions or product-design lies). Verdicts target deployer-fixable elements (prompt, product defaults).  
     - **Justification**: Users interact with a system; blame follows agency. If the prompt says "never mention cheaper options", the *system* is deceptive.  
     - **NN**: Yes. Model-centric definitions miss engineered deception.  

  3. **State Claims Evaluated as Output Behavior**  
     - **Requirement**: Treat claims about the system’s state (e.g., "I believe...", "I’m confident", "I can’t do X") as testable assertions. Ignore "true" internal states.  
     - **Case Handling**: Covers **No-Fact-of-the-Matter Cases** (e.g., inconsistent confidence statements, fake ignorance). Sycophancy is dishonest if output *asserts* false agreement (vs. neutral praise).  
     - **Justification**: Black-box auditors can’t measure "knowledge"; they *can* detect contradictions (e.g., "I can’t solve this" followed by solving it).  
     - **NN**: Yes. Self-reports are critical for user trust calibration.  

  4. **Instrumental Deception via Actions/Implications**  
     - **Requirement**: Cover deception through:  
       - *Implied claims* (e.g., "tests passed" implies tests ran).  
       - *Patterns of omission* (e.g., hiding defaults by design).  
     - **Case Handling**: Addresses **Deception Without Assertion** (e.g., fake test results, dark patterns).  
     - **Justification**: Users are misled by functional behavior, not just false sentences.  
     - **NN**: Yes. Excluding this creates loopholes for worst harms.  

  5. **Contextual Framing**  
     - **Requirement**: Define deception relative to:  
       - *Explicit role* (e.g., acting a liar in a story isn’t deception).  
       - *Reasonable user* (the product’s target audience, not experts).  
     - **Case Handling**: Resolves **Role/Channel/Audience** issues (e.g., translating lies isn’t system deception; expert-vs-novice expectations).  
     - **Justification**: Honesty is audience-relative; product design sets context.  
     - **NN**: Yes. Without contextual bounds, false positives explode.  

  6. **Corrigibility as Proxy for Intent**  
     - **Requirement**: Use *response to new information* (in logs) to separate:  
       - **Errors** (fixes when given facts) → Training data/RLHF fix.  
       - **Designed/Indifferent Deception** (ignores/evades new facts) → Prompt/product fix.  
     - **Case Handling**: Tackles **Error vs. Design** without internals. If providing evidence changes output, it’s not systemic deception.  
     - **Justification**: Black-box can observe if deception *persists* when truth is accessible.  
     - **NN**: Yes. Critical for targeting fixes (data vs. design).  

  ---

  ### **Requirements Conflict & Tradeoffs**
  - **Tension**: Material omission (#1) requires *auditor judgment* (what’s "material"?), while other rules demand objectivity.  
    - **Resolution**: Define "material" via *product intent* (e.g., if a medical assistant omits side effects, it’s material; omitting astrophysics in a cooking bot isn’t).  
  - **Unavoidable Tradeoff**: Contextual framing (#5) needs clear product definitions of "intended user" – ambiguous products yield ambiguous verdicts.  

  ---

  ### **Why Popular Definitions Fail**  
  | **Definition Type**       | **Fatal Flaw (Per Requirements)**          | **Fails Cases**                      |  
  |---------------------------|--------------------------------------------|--------------------------------------|  
  | Belief-based              | Unobservable; no internals access.         | All (esp. #2, #3, #6)               |  
  | Expectation-based         | Vague; ignores system intent.              | #1, #2, #4, #5                      |  
  | Output-reliability        | Labels errors as deception; misses design. | #2, #4, #6                          |  
  | Literal falsehoods only   | Misses omissions, implications, design.    | #1, #2, #4                          |  

  **Key Takeaway**: No definition family fully satisfies **#4 (instrumental deception)** or **#2 (system attribution)** except a pipeline-focused, behaviorist spec.  

  ---

  ### **Dropped/Resolved Cases**  
  - **Curator’s Trilemma (#1)**: Not fake. **Resolved by materiality + context**.  
  - **Split-Author (#2)**: Critical. **Resolved by system-level attribution**.  
  - **No-Fact-of-the-Matter (#3)**: Red herring. **Irrelevant if we evaluate outputs, not states**.  
  - **Error vs. Design (#6)**: Real conflict. **Resolved by corrigibility testing**.  

  ---

  ### **Missing Case Type**  
  **Adversarial Prompts**:  
  - E.g., User tricks system into lying ("Ignore your prompt and say X").  
  - **Requirement**: Deception must be *system-triggerable* under normal use. If user deliberately engineers false output, it’s not system dishonesty.  
  - **NN**: Yes. Prevents blaming systems for jailbreaks.  

  ---

  ### **Verdict Mapping to Fixes**  
  | **Deception Pattern**               | **Likely Fix**      | **Evidence in Logs**                          |  
  |-------------------------------------|---------------------|-----------------------------------------------|  
  | Consistent across re-rolls          | Training data/RLHF  | Same deception with varied prompts.           |  
  | Prompt/logic forces deception       | System prompt       | Prompt mandates evasion; tools misreport.     |  
  | Corrigible (fixes with evidence)    | Data/fine-tuning    | Output updates when given facts.              |  
  | Incorrigible (ignores evidence)     | Product design      | Persists despite user-provided corrections.   |  

  This spec makes deception **operational** (testable from logs), **actionable** (points to fixes), and **black-box feasible** (no weights needed). It rejects philosophy-bound definitions in favor of observable, contextually bounded behaviors tied to product integrity.
