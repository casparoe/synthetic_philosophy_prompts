prompt: |-
  I am trying to settle an argument, not to learn what Ayn Rand wrote, so please skip citations, reading suggestions, and summaries of her corpus: I want the argument space mapped, and I want it mapped without anyone looking anything up.

  The argument was about effective altruism. My interlocutor reached for the title of Rand's 1964 collection, "The Virtue of Selfishness," and used it, in one breath, to two conclusions: first, that giving a large share of one's income to strangers is not merely optional but degrading, a self-sacrifice that a person of integrity would refuse; second, that a genuinely rational person would never make an anonymous gift, since an anonymous gift cannot come back to benefit the giver. He also leaned on the point that Rand glosses "selfishness" in her introduction as nothing more than concern with one's own interests, and on her definition of value as that which one acts to gain and/or keep.

  I am convinced the one-liner is sliding, and I want the slide made explicit. Please give me a menu of the distinct precise theses the slogan could be asserting, and grade each one. My own attempts, which I expect you to correct, split, and add to, are these:

  One: a purely verbal thesis. Selfishness is redefined so that any action flowing from what the agent values counts as selfish, in which case the slogan says almost nothing and cannot reach either conclusion.
  Two: an objective-standard thesis. "Interests" are not whatever the agent happens to want but what serves her life as the kind of being she is, so the slogan has real content, but only if the account of a person's objective interests does independent work.
  Three: a jurisdictional thesis. What is wrong with altruism is not the cost to the agent or the benefit to others but the location of the normative trigger: the agent acts on another's need rather than on her own judgment of value. This may have no behavioral content at all, so that a kidney donation and a refusal to donate could each be virtuous or vicious depending on their source.
  Four: an anti-fixed-pie or harmony thesis: value is created rather than transferred, so benefit to another at cost to self is never the net gain it appears to be, and altruistic codes systematically destroy value.
  Five: an epistemic thesiss: others' needs are not transparent to me, whereas my own interests are, so an altruistic code is a systematically error-prone decision rule.
  Six: an empirical psychological thesis about what altruistic motivation does to character, to dependents, and to the giver's own capacity for sustained action.
  Seven: a narrow scope thesis: no positive duty to serve others, gifts permitted as luxuries, i.e. a denial of obligation rather than a denial of permissibility or admirability.

  For every reading, tell me: how to state it precisely; whether it is a definitional maneuver, a platitude, a substantive and defensible thesis, a substantive but contested one, or false; what would count as refuting it; whether Rand or a defender of the slogan is actually committed to it or whether it is an extrapolation; and, most importantly, whether it licenses the first conclusion, the second, both, or neither. Note where the readings differ along the axes that I think are doing the hidden work: the extension of "selfishness," the kind of normative status being claimed (permissible, praiseworthy, obligatory, admirable), and the direction of the contrast (altruism is not obligatory, versus never permissible, versus never admirable).

  Two things I cannot work out and particularly want addressed. First, over what interval are interests summed? Rand's own framework must permit forgoing present goods for long-range ones, so the self whose interests matter is a life and not a time slice; say what that does to the bite against altruism. Second, if the content of the virtue is just concern with one's own interests, and if the standard is indexed to a living organism's survival, what principle internal to the view stops the boundary of the self at the skin, so that the interests of those I love cannot be counted as mine? If no such principle can be given, say what happens to my interlocutor's two conclusions.

  Finally: tell me which reading he must have meant, and if no reading both survives scrutiny and supports what he said, say so plainly and tell me which suppressed premise is actually carrying the weight.
reasoning: |-
  Okay, let's tackle this user's request. They're in an argument about effective altruism and Ayn Rand's "The Virtue of Selfishness." Their interlocutor used Rand's title to claim that donating to strangers is degrading and that anonymous gifts are irrational. The user wants to map out the possible interpretations of the slogan and see which, if any, support these conclusions.

  First, I need to recall Rand's core ideas without looking them up. She redefined selfishness as rational self-interest, contrasting it with altruism as self-sacrifice. The user has already outlined seven potential theses. I should evaluate each one for clarity, defensibility, commitment by Rand, and whether they support the interlocutor's conclusions.

  Starting with Thesis One: the verbal redefinition. If selfishness just means acting on one's values, then donating could be selfish if the donor values helping others. This doesn't support the interlocutor's conclusions because altruistic acts could be selfish under this definition. Rand probably intends more than just a definitional move, so this thesis is too weak.

  Thesis Two posits an objective standard of interests based on human nature. Here, donating might be irrational if it doesn't serve one's life. But Rand might allow for donations that align with personal values, like helping loved ones. This could partially support the first conclusion if the donation harms the giver's objective interests, but anonymous gifts aren't automatically irrational if they bring personal satisfaction. So it doesn't fully support the second conclusion.

  Thesis Three is about jurisdictional authority. The issue is acting on another's judgment rather than one's own. A donation based on personal conviction could be virtuous, regardless of anonymity. This doesn't support either conclusion strongly, as both actions could be justified if they stem from individual judgment.

  Thesis Four, the harmony thesis, claims value creation over transfer. Rand argues that trade creates mutual benefit, whereas sacrifice destroys value. Donations might be seen as sacrifices, hence degrading. Anonymous gifts, as unrewarded sacrifices, would be irrational. This seems to support both conclusions. But is this Rand's actual position? She did view sacrifice as destructive, so this thesis might align with her views and the interlocutor's claims.

  Thesis Five is about epistemic limitations. Knowing others' needs is hard, so altruism is error-prone. But this doesn't condemn all altruism; effective altruists might argue they can assess needs. Also, anonymity isn't directly addressed. So this thesis might support the first conclusion weakly but not the second.

  Thesis Six focuses on psychological effects. Altruism might erode character, but this is empirical and contested. It doesn't specifically address anonymous gifts. So it might support the first conclusion but not strongly the second.

  Thesis Seven is a narrow scope, denying obligation but permitting charity. This contradicts the interlocutor's claim that donations are degrading, as they could be admirable luxuries. So it doesn't support either conclusion.

  Now, the user's two specific questions. First, the time interval: since Rand considers long-term interests, a donation might be rational if it brings future benefits. But anonymous gifts wouldn't offer reciprocal benefits, so maybe they're irrational. However, if the giver values the act itself, it could still fit. Second, the boundary of self: Rand allows valuing others as extensions of the self, like loved ones. But strangers? Probably not. So donations to strangers might not count as self-interest, supporting the first conclusion. But anonymous gifts to loved ones could still be rational, undermining the second conclusion.

  The strongest thesis for the interlocutor is Thesis Four (harmony thesis), as it labels sacrifice as destructive, making donations degrading and anonymous gifts irrational. But Thesis Two (objective interests) might also play a role, especially if donating harms the giver. However, Thesis Four seems central here. The suppressed premise is that all giving is sacrificial, not egoistic. The user can counter by arguing that effective altruism isn't sacrificial if the giver values it, aligning with their rational interests.

  In summary, the interlocutor relies on a mix of Theses Two and Four, but the harmony thesis is key. Yet, this thesis is contested. The user can challenge the conflation of altruism with sacrifice and the assumption that anonymous gifts can't benefit the giver indirectly.
answer: |-
  Here's a dissection of the argument space surrounding "The Virtue of Selfishness" slogan, tailored to your needs. I'll evaluate your theses, add critical dimensions, address your specific puzzles, and pinpoint the slide.

  **Revised & Expanded Thesis Menu:**

  1.  **Verbal Redefinition (Your Thesis One):**
      *   **Precise Thesis:** "Selfishness" *means* any action motivated by the agent's own values/goals (as per Rand's definition). Thus, "virtue of selfishness" = "virtue of acting on your values."
      *   **Status:** Definitional maneuver. Logically true *if* you accept the definition, but vacuously circular. Contested as an unhelpful redefinition of a loaded term.
      *   **Refutation:** Demonstrating the definition strips "selfishness" of its core meaning (disregard for others) and renders the slogan trivial/non-normative.
      *   **Rand Committed?** Yes, explicitly in the introduction. *This is the foundational move.*
      *   **Licenses Conclusions?** **Neither.** If donating/anon-giving flows from the agent's values (e.g., valuing human life, justice, the act itself), it *is* selfish and virtuous by this definition. Contradicts interlocutor.

  2.  **Objective Standard of Interests (Your Thesis Two):**
      *   **Precise Thesis:** An agent's *true* "interests" are objective facts about what promotes their survival/flourishing *as a rational being*, distinct from subjective desires. Virtue is acting to achieve these objective interests. "Selfishness" means pursuing *these*.
      *   **Status:** Substantive, highly contested thesis. Requires a robust theory of human nature/flourishing.
      *   **Refutation:** Disputing the specific account of objective interests/human nature; showing actions promoting objective interests sometimes harm others (or vice versa).
      *   **Rand Committed?** Absolutely core. The definition is empty without this.
      *   **Licenses Conclusions?**
          *   **Conclusion 1 (Donation Degrading):** *Potentially, but not necessarily*. If donating a large share *objectively harms* the giver's life (e.g., cripples their productive capacity, forces them into dependency), it *could* be vicious. If it aligns with their values *and* doesn't harm their flourishing (e.g., surplus wealth, brings deep satisfaction), it *could* be virtuous. **Depends entirely on the objective impact.**
          *   **Conclusion 2 (Anon Gift Irrational):** **No.** An anonymous gift could serve objective interests (e.g., promoting a society/cause the giver values, personal satisfaction from acting justly, avoiding unwanted attention/favor-seeking). Benefit need not be reciprocal or reputational.

  3.  **Jurisdictional Primacy of Judgment (Your Thesis Three):**
      *   **Precise Thesis:** The essential ethical act is exercising one's independent rational judgment to identify values. Altruism is vicious when it means *subordinating* one's judgment to the needs/commands of others. The *source* of the motive (my judgment vs. external demand) defines virtue/vice, not the action's content.
      *   **Status:** Substantive, contested thesis about the root of virtue. Focuses on *why* you act, not *what* you do.
      *   **Refutation:** Argue that recognizing others' needs *can* be an act of rational judgment; deny that independence requires disregarding others.
      *   **Rand Committed?** Deeply. Tied to her epistemology/metaphysics.
      *   **Licenses Conclusions?**
          *   **Conclusion 1:** **No.** A kidney donation *based on the donor's independent conviction* of its value to their life/ideals could be supremely virtuous. Refusing *due to social pressure* could be vicious.
          *   **Conclusion 2:** **No.** An anonymous gift *chosen freely* based on the giver's judgment of its importance could be virtuous. A named gift *done solely for reputation* could be vicious.

  4.  **Anti-Sacrifice / Value Harmony (Your Thesis Four):**
      *   **Precise Thesis:** Genuine human interaction is based on trade (value for value). "Sacrifice" (giving up a greater value for a lesser or non-value) is inherently destructive. Altruism, as a *code demanding sacrifice*, is immoral. True value is created through productive achievement, not transferred via sacrifice. Benefit at true cost to self *is* a net loss.
      *   **Status:** Substantive, highly contested thesis about human interaction and value creation.
      *   **Refutation:** Argue that non-reciprocal giving *can* create net value (e.g., saving a life > cost of money); deny that all giving is sacrifice; challenge the definition of "sacrifice."
      *   **Rand Committed?** Absolutely core. This is the primary *behavioral* condemnation of altruism.
      *   **Licenses Conclusions?**
          *   **Conclusion 1:** **Yes, strongly.** Giving a large share to strangers is framed *as sacrifice* (giving up value for nothing/non-value), hence degrading and destructive. A person of integrity refuses sacrifices.
          *   **Conclusion 2:** **Yes, strongly.** An anonymous gift is the *purest form of sacrifice* – no reciprocal benefit, no reputational gain. It cannot "come back." Therefore, irrational.

  5.  **Epistemic Limitation (Your Thesis Five):**
      *   **Precise Thesis:** Rational judgment requires reliable knowledge. Others' needs and the consequences of helping are inherently complex and difficult for an outsider to know reliably. Focusing on one's own needs/interests is epistemically more secure. Altruism compels action based on unreliable information.
      *   **Status:** Substantive, partially defensible but overstated thesis. Highlights a practical difficulty, not an impossibility.
      *   **Refutation:** Argue knowledge of others' needs *is* often possible; note that self-interest also requires complex knowledge; point to effective altruism's focus on evidence.
      *   **Rand Committed?** Implicitly supported, but secondary to Theses 2 & 4.
      *   **Licenses Conclusions?**
          *   **Conclusion 1:** **Weakly / Indirectly.** Suggests large donations *might* be error-prone, not necessarily *degrading*.
          *   **Conclusion 2:** **No.** Anonymity doesn't change the epistemic challenge. Knowing the recipient doesn't magically solve it.

  6.  **Character Corruption (Your Thesis Six):**
      *   **Precise Thesis:** Adopting an altruistic moral code systematically corrupts character: it fosters resentment, discourages productivity, creates dependency, erodes self-esteem, and ultimately destroys the capacity for sustained rational action and genuine happiness.
      *   **Status:** Empirical psychological thesis. Highly contested, relies on specific views of motivation and consequence.
      *   **Refutation:** Provide counter-examples (happy, productive altruists); challenge the causal link; argue altruism can build character.
      *   **Rand Committed?** Strongly argued in her works (e.g., *Atlas Shrugged* characters), but derivative of Theses 2 & 4.
      *   **Licenses Conclusions?**
          *   **Conclusion 1:** **Indirectly.** If altruism corrupts, then large donations *motivated by duty* could be degrading. Doesn't cover value-based giving.
          *   **Conclusion 2:** **No.** Anonymity irrelevant to character effects.

  7.  **Narrow Scope / Anti-Obligation (Your Thesis Seven):**
      *   **Precise Thesis:** There is *no positive moral obligation* to serve others. Helping others is permissible only if it is a *chosen* expression of one's values, a "luxury" or act of generosity, never a duty. The virtue is the *absence of compulsion*, not the *absence of giving*.
      *   **Status:** Substantive, contested thesis about the scope of obligation. Defensible within a rights-based framework.
      *   **Refutation:** Argue for positive duties based on interdependence, compassion, or social contract.
      *   **Rand Committed?** Explicitly. Denies altruism as a *duty*.
      *   **Licenses Conclusions?**
          *   **Conclusion 1:** **Direct Contradiction.** Explicitly states donation *is* permissible and can be an expression of values (a "luxury"). Refusing *duty* is virtuous, refusing *generosity* might not be. Calls donation "degrading" only if done from duty.
          *   **Conclusion 2:** **No.** Anonymity irrelevant. Gifts are optional luxuries.

  **Addressing Your Specific Puzzles:**

  1.  **Time Interval for Interests (Life vs. Time-Slice):**
      *   Rand unequivocally sums interests over a lifetime. Forgoing present goods for long-range ones is central to her concept of rationality (e.g., saving, investing, education).
      *   **Impact on Anti-Altruism Bite:** This *undermines* a simplistic rejection of altruism. A large donation *could* be a rational investment in one's long-term values: supporting a cause vital to one's vision of a good society, gaining profound personal satisfaction, fulfilling a deeply held principle. The objection must shift to arguing that *this specific act* objectively harms the giver's *life* trajectory or constitutes a *sacrifice* (Thesis 4), not that it merely costs present resources.

  2.  **Boundary of the Self (Loved Ones vs. Strangers):**
      *   **Principle Preventing Expansion:** Rand's concept is *egoistic*, not *egotistic*. The principle is **rational hierarchy of values based on objective importance to *one's own* life and flourishing.** Romantic love or deep friendship involves *integrating* another person's well-being into one's *own*selfish happiness and flourishing. Their survival/happiness becomes a *selfish* value. Strangers generally do not hold this position in one's hierarchy of values. There's no *principle* stopping you from valuing strangers highly *if* you rationally judge their well-being as crucial to your values/goals (e.g., a doctor valuing patients, an activist valuing a group).
      *   **Impact on Conclusions:**
          *   **Conclusion 1 (Donation Degrading):** **Collapses for loved ones.** Giving a kidney to save your child's life is profoundly selfish (serving a supreme selfish value). Giving to strangers *could* be selfish if rationally integrated as a value (e.g., effective altruist valuing global welfare intrinsically). The argument must become: *Why should strangers rationally be a top value for you?* (Thesis 2/4). It cannot be *inherently* degrading.
          *   **Conclusion 2 (Anon Gift Irrational):** **Collapses for loved ones.** An anonymous gift to a loved one (if possible/relevant) could still serve the selfish value of their well-being. For strangers, an anonymous gift *could* be rational if anonymity serves the giver's purpose (e.g., avoiding hassle, pure focus on the cause). The argument must rely on Thesis 4 (Sacrifice) – claiming giving to strangers *is* sacrifice *because* they aren't integrated values.

  **The Slide and the Suppressed Premises:**

  *   **The Core Slide:** Your interlocutor slides seamlessly from Rand's **redefinition of selfishness (Thesis 1)** and **denial of altruistic *obligation* (Thesis 7)** directly to the strong behavioral claims of the **Anti-Sacrifice / Value Harmony thesis (Thesis 4)**, treating them as definitionally equivalent or logically necessary. They ignore the **Objective Standard (Thesis 2)** requiring case-by-case evaluation and the **Jurisdictional Primacy (Thesis 3)** focusing on motivation, both of which undermine their blanket conclusions.
  *   **Which Thesis Did They Mean?** They *explicitly invoked* the redefinition (Thesis 1) and the life-as-standard (implied Thesis 2). However, their *conclusions* depend entirely on assuming **Thesis 4 (Anti-Sacrifice/Value Harmony)**. They treat *any* significant gift to strangers *as inherently sacrificial* and *any* anonymous gift *as inherently non-reciprocal*.
  *   **Does Any Reading Support Both Conclusions?** Only **Thesis 4 (Anti-Sacrifice)** robustly supports *both* conclusions as stated. However:
      *   Thesis 4 is highly contested and not a logical consequence of Theses 1, 2, or 7.
      *   Thesis 4 is contradicted by the possibility of gifts being *egoistic* expressions of value (Thesis 1/2/3) or permissible luxuries (Thesis 7).
      *   The Lifetime Span (Puzzle 1) and Integration of Loved Ones (Puzzle 2) further undermine the universality of Thesis 4.
  *   **Suppressed Premises Carrying the Weight:**
      1.  **All Significant Giving to Strangers is Sacrifice (Thesis 4).** This is the core suppressed premise. It equates "gift" with "sacrifice" in this context.
      2.  **Sacrifice is Inherently Degrading and Irrational (Thesis 4).** Taken from Rand.
      3.  **Anonymity Guarantees No Reciprocal Benefit.** (Overlooks personal satisfaction, value fulfillment).
      4.  **The Giver's "Interests" are Narrowly Material/Reciprocal.** (Ignores psychological, existential, or ideological values served by giving).
      5.  **"Strangers" Cannot Be Rationally Integrated as Selfish Values.** (Contradicted by Rand's view of love/friendship and potential for valuing humanity/justice).

  **Conclusion:**

  No coherent interpretation of Rand's "The Virtue of Selfishness," consistent with her broader framework (especially the lifetime span and integration of loved ones), supports your interlocutor's **blanket conclusions** that large donations to strangers are *always* degrading and anonymous gifts are *always* irrational. His argument relies critically on the **suppressed premise that all such giving constitutes "sacrifice"** (Thesis 4), a premise that is:
  1.  **Not definitional (Thesis 1):** Sacrifice requires giving up a *greater* value for a *lesser*.
  2.  **Not necessarily true by the Objective Standard (Thesis 2):** It might align with the giver's flourishing.
  3.  **Contradicted by the Jurisdictional view (Thesis 3):** It might stem from independent judgment.
  4.  **Contradicted by the Narrow Scope view (Thesis 7):** It might be a chosen luxury.

  **To refute him:** Challenge the conflation of *gift* with *sacrifice*. Argue that effective altruism, based on evidence and chosen values, can be a rational, selfish expression of one's highest principles and vision of the good, integrated into a life plan, providing deep personal fulfillment – even anonymously. Force him to defend Thesis 4 directly and explain why valuing human flourishing beyond one's immediate circle *must* be a sacrifice.
