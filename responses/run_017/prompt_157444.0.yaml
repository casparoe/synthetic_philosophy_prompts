  ### Which Splits Threaten Practice?
  - **Threatening splits**: Branch 2 (normativity) and Branch 5 (explanatory role). Denying normativity (e.g., Reductionist Mapping) forces biologists to abandon error-correction mechanisms as "objective," reframing them as human-imposed. Denying explanatory role (e.g., Explanatory Skepticism) challenges the utility of informational language in hypothesis-building (e.g., "faulty translation" in disease).  
  - **Harmless splits**: Branches 1 (scope), 3 (sender/receiver), and 6 (reassignment necessity) don't affect day-to-day work. Whether DNA is a code "by convention" or "by necessity" (Branch 4) changes nothing in the lab—reassignment experiments proceed regardless. Case-level analyses (e.g., gene transfer) remain stable under all views; only their *interpretation* as "coding" shifts.  

