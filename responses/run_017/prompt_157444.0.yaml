     - *No*: No inherent correctness; "errors" are just deviations from statistical regularities or human preferences. Proceed to Leaf 4.  

     **Branch 3 (for terrestrial, normative)**:  
  3. **Is a sender and receiver with something at stake (e.g., survival, function) essential for codehood?**  
     - *Yes*: Codehood requires agents or systems with interests affected by communication. Proceed to Branch 4.  
     - *No*: A purely mechanical reading mechanism suffices; no stakes needed. Proceed to Leaf 2.  

     **Branch 4 (for terrestrial, normative, sender/receiver)**:  
