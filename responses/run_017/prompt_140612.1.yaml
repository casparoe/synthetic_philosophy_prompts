prompt: |-
  I write a monthly column for a popular history magazine where I take apart one viral claim about the past — Atlantis, the pyramid-builders having been taught by visitors from somewhere else, and every few months a version of the theory that everything we call ancient history is a recalibrated duplicate of medieval history, so that the "Roman" empire and some later empire are really the same events filed under different names. I also babysit the comment section, which is where I keep running into the thing I want a word for.

  Here's the pattern. The theory's selling point is how much it explains. One story covers the pyramids in Egypt and the ones in Mexico, flood myths on five continents, the megaliths, the star alignments, the odd double-datings in the king lists. And the coverage is offered as evidence: look how many separate things this accounts for. But when I actually check, each individual link is thin, and every link has its own seperate little assumption bolted on — this one needs the myths to have travelled, that one needs the dating tables to have been tampered with, the other needs a name to have been mistranscribed — and the bolted-on assumptions have nothing to do with each other. So it's one story with a different excuse for every item. My readers feel this and come away thinking there must be something to it; I feel it and come away thinking it's the reason to distrust it.

  Things it isn't, or isn't only:

  - It's not that the theory can't be proven wrong. These things usually do stick their necks out — specific dates, specific identifications of one ruler with another, even "you will find such-and-such beneath this site" — and sometimes they get flatly refuted and it doesn't seem to cost them anything with their fans.
  - It isn't the move where you dump so many arguments that the other person can't answer them all in the time available. There's no clock here. I can take six months and check every link, and I have, and the breadth still does its work on people afterwards.
  - Someone in my comments said "just-so story", but as far as I can tell that's about inventing an explanation for a single trait after the fact, not about a whole system spanning continents and centuries.
  - And I don't think breadth by itself can be what's wrong. I keep coming back to Wegener and continental drift: a guy matching coastlines, fossils and rock types across oceans, a pile of weak correspondences, no mechanism, most geologists laughing — and it turned out to be right. So whatever is off about the fringe version, it can't just be "a lot of thin links held together by a story."

  So: is there an established concept for this specific thing — a theory that gets credit for how much it covers, where the coverage is bought with a separate free parameter per item, and where refuting an item doesn't cost the theory its audience? If nothing fits, I need a name I can actually use in print, with a definition sharp enough that my readers could apply it themselves. Please don't just hand me a label or a reading list: I want to know what the phenomenon is, what it isn't, and where it stops. In particular I'd like the boundary cases sorted: a broad comparative-mythology synthesis from a real scholar; a diffusionist account of a single technology that most specialists reject but which isn't crazy; and an archaeological claim that's mostly right but whose dating is off by three centuries. Which of those are cases of the thing and which aren't, and by what test?

  End your reply with a single line in exactly this form: \answer{...} containing either the established term or, if there isn't one, the two-or-three-word term you're proposing.
reasoning: |-
  Okay, the user writes a history column debunking viral claims and needs a term for a specific pattern. Let me start by understanding the key elements. The pattern involves a theory that explains many diverse phenomena—like pyramids, flood myths, star alignments—and uses this breadth as evidence. But each individual link is weak, requiring separate, unrelated assumptions. Even when refuted, the theory retains its audience. The user wants a term that captures this, distinct from things like unfalsifiability or Gish gallop.

  First, I recall concepts like "ad hoc hypotheses" and "overfitting." Ad hoc refers to adding explanations for each problem without connecting them. Overfitting is when a model is too complex, fitting noise rather than signal. But the user mentioned that "just-so story" isn't right because it's for single traits, not a whole system. 

  Then I think about "explanatory overreach" or "epicyclic reasoning," referencing Ptolemy's epicycles. Each added epicycle fixed a problem but made the model cumbersome. The user's examples have that: each anomaly requires a new, unrelated fix. Unlike continental drift, which had coherent evidence, these theories lack a unified mechanism. 

  Boundary cases: 
  - A scholarly comparative mythology synthesis would have consistent mechanisms and avoid ad hoc fixes. 
  - A diffusionist account might be debated but still uses a single explanatory framework. 
  - An archaeological claim with a dating error could be a mistake but doesn't pile on unrelated assumptions. 

  The key test is whether each item needs a separate, disconnected assumption. If yes, it's the problematic pattern. The term "epicyclic explanation" fits, drawing from historical astronomy. It conveys adding layers of fixes without a core mechanism. 

  The user needs a precise term for readers to apply. "Epicyclic" is memorable and illustrates the concept well. It also distinguishes from Wegener's case, which had underlying unity. So the answer should be \answer{epicyclic explanation}.
answer: |-
  Based on your detailed description, the phenomenon you're encountering fits a specific pattern of flawed reasoning, but no single established term captures it perfectly. The closest established concept is the **ad hoc hypothesis**, but your description requires a more systemic and cumulative term addressing the *interaction* of multiple weak links and the *exploited perception* of breadth as strength.

  Here's the breakdown:

  1.  **The Core Phenomenon:** A theory gains perceived credibility by claiming to explain a wide array of seemingly disparate phenomena. However, this broad "coverage" is achieved not through a single robust mechanism or coherent evidence, but by attaching a unique, disconnected, and often unfalsifiable (or easily dismissed) auxiliary assumption (*ad hoc* hypothesis) to *each individual element* of its claimed explanatory scope. The cumulative *impression* of explanatory power ("look how much it explains!") outweighs the demonstrable weakness of each individual link and the incoherence of the whole system in the minds of adherents. Refutation of individual elements is ineffective because the discarded assumption was only ever bolted on to save that one specific point; the core narrative and the *impression* of broad explanatory scope remain largely untouched.

  2.  **What It Isn't (Refining Your Points):**
      *   **Not Just Unfalsifiable:** While *ad hoc* assumptions often make specific points hard to refute, the *overall* theory often makes falsifiable claims, as you note. The problem is the *structure* and *multiplicity* of the assumptions insulating the core narrative.
      *   **Not Gish Gallop:** You're correct; it's not about overwhelming with volume *in debate*. It's about the *structure* of the theory itself and the *enduring psychological effect* of the perceived breadth, even after slow, meticulous refutation.
      *   **Not a Simple Just-So Story:** A just-so story explains a *single* trait/fact post-hoc. This is a *network* of just-so stories woven into a grand narrative, each tailored to a specific "anomaly."
      *   **Not Merely "Breadth with Thin Links":** As you rightly point out with Wegener, breadth supported by numerous initially weak but *coherent* and *unified* links (e.g., all pointing to continental movement via matching geology/paleontology) can be valid. The flaw here is the *incoherence* and *disconnected nature* of the auxiliary assumptions required for each link. Wegener didn't need a *different, unrelated* excuse for why the fossils matched *and* why the coastlines matched *and* why the rock types matched; continental drift was the singular proposed cause for all. Your fringe theories require Myth Migration *plus* Dating Tampering *plus* Name Miscopying *plus*... each solving only one problem and having no connection to the others or the core mechanism (if one is even proposed).

  3.  **Proposed Term: Epicyclic Explanation**
      *   **Why this fits:** Draws a direct analogy to Ptolemaic astronomy. To preserve the core geocentric model (the grand narrative) in the face of observations (anomalies like retrograde motion), Ptolemy added epicycles – smaller circles upon circles. Each epicycle was an *ad hoc* fix for a *specific* problem in the planetary paths. The system became incredibly complex, with each planet needing its *own unique* set of epicycles, but it "saved the phenomena" and maintained the *appearance* that the geocentric model explained everything (broad coverage). Critically, disproving the need for *one* specific epicycle (e.g., for Mars) didn't kill the geocentric model; proponents could just adjust *that* epicycle or add another minor tweak. The *core idea* and the *impression* that it explained the motions of *all* the planets persisted. This perfectly mirrors your description: a core narrative preserved by bolting on unique, disconnected fixes (intellectual epicycles) for each specific anomaly it claims to cover, creating an illusion of comprehensive explanation through accumulated complexity.

  4.  **Applying the Test to Boundary Cases:**
      *   **Test:** Does the theory's broad coverage rely on *multiple, distinct, and fundamentally unrelated auxiliary assumptions* (epicycles), each specifically tailored to explain *only one* (or a small subset) of the phenomena it claims to cover, lacking a unifying mechanism connecting these assumptions?
          *   **Broad Comparative-Mythology Synthesis (Real Scholar):** Likely **NOT** epicyclic. A scholar like Dumezil (Proto-Indo-European trifunctionalism) or Campbell (monomyth) proposes a *unified underlying structure, psychological principle, or shared cultural heritage* to explain widespread parallels. While individual myths might require interpretation, the core mechanism (e.g., deep cognitive structures, diffusion from a source) is meant to apply *consistently* across the board. They don't typically invent *unrelated*, myth-specific excuses for why each element fits.
          *   **Diffusionist Account of a Single Technology (Rejected but Not Crazy):** **Probably NOT** epicyclic, or only weakly so. Explaining the spread of (e.g.) bronze working or a specific pottery style primarily relies on *one core mechanism*: diffusion (trade, migration, contact). While evidence for contact between specific points (A and B) might be debated, requiring *some* auxiliary hypotheses (e.g., "trade route X existed earlier than we thought"), these are usually connected *to the core diffusion idea*. It doesn't typically require *radically different, unrelated* excuses for why the technology appears in location C vs. D vs. E *within the same explanatory framework*. The core mechanism (diffusion) is the unifying thread.
          *   **Archaeological Claim Mostly Right but Dating Off by Centuries:** **NOT** epicyclic. This is simply an *error in one specific parameter* within an otherwise sound framework. It doesn't involve building a grand narrative held together by numerous disconnected auxiliary assumptions to cover wildly diverse phenomena. It's a mistake in dating evidence for a single site/event, not a systemic structure of "explanatory breadth" bought with unique per-item excuses.

  **Conclusion:** The phenomenon is a grand narrative that creates an *illusion of explanatory breadth* by attaching unique, disconnected, *ad hoc* assumptions (intellectual epicycles) to each individual phenomenon it claims to cover. This structure makes the core narrative resilient to refutation of individual points and exploits the psychological appeal of a "theory of everything." The term **Epicyclic Explanation** captures this structure, its historical analogy, and its core flaw: complexity bought with incoherent fixes to preserve a cherished core idea.

  \answer{Epicyclic Explanation}
