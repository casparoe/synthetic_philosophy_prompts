prompt: |-
  I sit on the clinical ethics committee of a large teaching hospital, and we are drafting a written protocol for triage decisions in a mass-casualty incident — the sort of situation in which a course of action that will foreseeably bring about a patient's death is nonetheless the only way to save several others, and in which the decision has to be taken in about ninety seconds by whoever happens to be on shift. The protocol has to be codifiable: a nurse or a junior doctor must be able to read it, apply it without introspecting about her own mental states, and have her decision afterwards reviewed by an auditor who was not in the room and who must be able to say whether the protocol was followed.

  What we keep circling around is the distinction the doctrine of double effect turns on — between a death a clinician brings about as a means and one she merely foresees — but every formulation we have tried is either too vague to be audited or too crude to match the verdicts we are confident about. So before we argue about formulations, I want the specification.

  Write the desiderata that any adequate account of the intended/foreseen — or means/side-effect — distinction has to satisfy in order to be usable in a protocol like ours. For each requirement, give the case or consideration that makes it a requirement, and mark it as non-negotiable (an account that fails it cannot do the job we need) or as a preference of one way of thinking about these cases. I would like the list to include, at least, requirements concerning:

  - the standard case-pairs from the philosophical literature — the bystander at the switch and the driver who steers, the man on the footbridge, the looped track, the surgeon with the healthy patient, terror bombing against tactical bombing, craniotomy against hysterectomy — together with a note on how much weight the intuitive verdicts on these really carry, and on whether an account that reproduces them by construction has thereby been reverse-engineered rather than derived;
  - robustness to how finely the act is described, since one and the same bodily movement is 'redirecting a threat', 'saving five', and 'killing one', and a protocol that returns different verdicts depending on which description the auditor happens to pick is of no use to us;
  - third-personal codifiability and auditability, given that the classical formulation turns on what the agent intends, which is precisely what an auditor cannot see;
  - resistance to laundering — the clinician who has read the protocol in advance and arranges her deliberations so that the death falls on the 'merely foreseen' side;
  - the motive cases, in which the causal structure is one the protocol permits but the agent acts for a bad reason, and the requirement that permissibility be kept apart from blameworthiness or praise;
  - cases in which the causal contribution of the death is merely probabilistic — a shunt that has a one-in-three chance of holding, with the five saved only if it holds;
  - cases in which the death seems causally necessary but as ballast, counterweight, or energy source rather than as a means to anything, and cases in which the death turns out to have been causally irrelevant because a back-up mechanism would have saved the five anyway;
  - multi-agent and overdetermined cases: the outcome that would have come about without this clinician's act at all, or that is produced jointly by two people each of whom does only part of what kills;
  - whether the verdict is fixed by the agent's evidence at the time or by how things actually are — the shunt that in fact fails;
  - the requirement that the account not be a theory of trolleys only: it must say something determinate about the cases a hospital actually faces — palliative sedation, withdrawal of treatment, allocation of scarce ventilators, the use of one patient's data or body to calibrate a treatment for others — and it must be usable by people who have never heard of a trolley problem.

  Then, and this is the part I most want: tell me which pairs of requirements on your own list you think cannot be jointly satisfied. I expect at least one real collision between auditability and the first-personal character of the distinction, and I suspect a second between fine grain on the means/side-effect continuum and the bright lines a protocol needs. If you think I am wrong about either, say why; if you find a collision I have not named, name it. Also mark any item on your list that you think is really a prejudice of one camp dressed up as a desideratum — if, for instance, you think matching the intuitive verdict about the man on the footbridge is simply deontology helping itself to its conclusion, say so. Tell me which single requirement does the most work in excluding candidate accounts, whether any coherent account satisfies all of the non-negotiable ones, and — if the honest conclusion is that a protocol of the kind we are drafting cannot be built on this distinction at all — what we should put in its place.

  Finish with a brief scorecard, no more than a short paragraph each, for four or five live options: the classical four-condition doctrine of double effect; a counterfactual-dependence or 'means' test; a rights- or agency-based reconstruction that replaces intentions with an account of what the agent is doing to the person; a threshold or scalar consequentialism that abandons the distinction; and a reading that puts the weight on the agent's reasons or motives. Keep the weight firmly on the criteria rather than on the scoring.

  Aim for something I could circulate as a five- to eight-page committee paper. Please write in British English, and use 'she' throughout for the clinician.
reasoning: |-
  Hmm, the user is on a clinical ethics committee drafting a mass-casualty triage protocol. They need an auditable distinction between intended and foreseen deaths, but existing formulations are either too vague or too crude. They want a list of desiderata for this distinction, with requirements based on specific cases, and to identify conflicts between these requirements. They also want a scorecard of existing approaches.

  First, I need to cover all the points they mentioned: standard philosophical case-pairs, robustness to act descriptions, third-person auditability, resistance to laundering, motive cases, probabilistic causation, ballast cases, multi-agent scenarios, and evidence vs. actual outcomes. Each requirement should be marked as non-negotiable or a preference.

  For the case-pairs, like trolley problems and bombing scenarios, I should note that matching intuitions is desirable but not non-negotiable, as it might lead to reverse-engineering. The challenge here is that intuitions vary, and a protocol can't rely on contested philosophical examples.

  Robustness to act descriptions is non-negotiable. If the same action can be described in multiple ways, the protocol must give consistent verdicts regardless of phrasing. Otherwise, audits would be subjective and useless.

  Third-person codifiability is absolutely critical. Since auditors can't read minds, the protocol can't depend on internal mental states. Any account requiring intention introspection fails here. This clashes with traditional double effect, which centers on intention.

  Laundering resistance is tricky. Clinicians shouldn't be able to game the system by framing their intentions differently. This ties into auditability but might be hard to enforce. This is non-negotiable because without it, the protocol is exploitable.

  Motive vs. permissibility: The protocol must separate the action's permissibility from the clinician's motives. A permissible action done for bad reasons shouldn't be forbidden, and vice versa. This is non-negotiable to avoid punishing or excusing based on hidden motives.

  Probabilistic cases must be handled. If an action has a chance of causing death, the protocol needs clear thresholds. But setting a probability threshold (e.g., 50%) might be arbitrary. This is a preference because it's complex, but necessary for real-world applicability.

  Ballast cases, where death is necessary but not a means, are important. For example, using a patient as a counterweight. The distinction between means and side-effect gets fuzzy here. This tests the account's ability to handle non-standard causalities and is a preference.

  Multi-agent scenarios involve overdetermination or joint actions. The protocol must assign responsibility clearly. This is non-negotiable because in hospitals, multiple clinicians may be involved, and accountability is key.

  Evidence vs. actual outcomes: Should the protocol consider what the clinician knew at the time or the actual result? For auditability, it has to be based on evidence available then. Actual outcomes can't be known in the moment, so this is non-negotiable.

  Now, conflicts. Auditability vs. first-personal distinction: Traditional double effect relies on intention, which isn't auditable. Any account satisfying auditability must avoid internal states, which might force a move to external actions or causal structures. This is a major conflict.

  Bright lines vs. continuum: The means/side-effect distinction isn't binary; it's a spectrum. But a protocol needs clear rules. Forcing a bright line might oversimplify complex cases, leading to counterintuitive verdicts. This is another key conflict.

  Also, matching intuitions might conflict with systematicity. If the protocol is designed to match trolley cases, it might not generalize to hospital scenarios like ventilator allocation or palliative sedation. Real hospital cases are messier.

  For the scorecard, I'll evaluate:
  - Classical double effect: Fails auditability and laundering resistance.
  - Counterfactual dependence: Better auditability but struggles with ballast cases and probabilistic issues.
  - Agency-based accounts: Focus on what's done to the person, good for rights violations, but may be vague in codification.
  - Threshold consequentialism: Drops the distinction, prioritizes lives saved. Simplifies but ignores ethical nuances, which might be problematic for the committee.
  - Motive-based: Fails auditability, as motives are internal.

  The user might need an alternative. Given the conflicts, a bright-line rule based on causal role, combined with a strict consequentialist threshold, could work. Or using a predefined point system for resource allocation, avoiding the distinction altogether.

  I need to ensure British English and use 'she' for clinicians. The structure should be clear: desiderata, conflicts, alternatives, scorecard. Keep it concise for a 5-8 page paper.
answer: |-
  ## Desiderata for an Auditable Means/Side-Effect Distinction in Mass-Casualty Triage Protocols

  This paper outlines the requirements for distinguishing intended effects (or means) from merely foreseen side-effects within a codifiable, auditable mass-casualty triage protocol. The goal is a rule usable by frontline staff under severe time pressure and reviewable by auditors post-hoc, without reliance on subjective mental states. Desiderata are derived from paradigmatic cases and practical constraints, categorised as **Non-Negotiable (NN)** (essential for protocol function) or **Preference (P)** (reflecting ethical intuitions but potentially adjustable).

  ### Core Desiderata

  1.  **Third-Personal Codifiability & Auditability (NN):** The protocol’s verdict must be determinable solely from *externally observable features*: the physical actions taken, the objective circumstances (available resources, patient states, immediate causal relationships), and the clinician’s *expressed justification* (if mandated by protocol), *not* her private intentions. An auditor must reconstruct the permissibility decision based on evidence available in the clinical record or incident report.
      *   *Rationale:* The classical DDE relies on intention, which is inaccessible to an auditor. A protocol requiring mind-reading is useless for accountability.

  2.  **Robustness to Act-Description (NN):** The permissibility verdict must be *invariant* under different descriptions of the *same physical act* (e.g., "diverting toxin," "saving five," "killing one"). The protocol must specify which description governs, or the verdict must hold regardless.
      *   *Rationale:* Ambiguity in description invites arbitrary auditing. If "diverting toxin" is permitted but "killing one" is not for the same act, the protocol is incoherent and un-auditable.

  3.  **Resistance to Laundering (NN):** The protocol must be structured so that a clinician cannot easily manipulate her *expressed* reasoning or *framing* of the act to make a prohibited killing appear permissible (merely foreseen) under the rules.
      *   *Rationale:* If the rules can be gamed by "intending differently," they fail to provide genuine normative constraint and undermine trust. Clinicians must not be able to "intend around" prohibitions.

  4.  **Separation of Permissibility from Motive/Blame (NN):** The protocol must determine the *permissibility* of the *act* based on its structure, not the clinician’s underlying motives (e.g., malice, callousness, excessive zeal). An act causally identical to a permitted one (e.g., diverting a threat) must not become impermissible *solely* because the clinician harboured a secret desire for the death. Conversely, a good motive cannot render an impermissible act permissible. Blameworthiness/praiseworthiness is a separate question.
      *   *Rationale:* Auditors cannot reliably discern hidden motives. The protocol governs *actions*, not character. Permissibility must be objective.

  5.  **Evidence-Relative Verdicts (NN):** Permissibility must be judged based on the *evidence reasonably available to the clinician at the time of the decision*, not on how events *actually* unfolded (e.g., the shunt that unexpectedly held/failed).
      *   *Rationale:* Decisions must be made under uncertainty with the information at hand. Judging based on outcomes is retrospective and unfair; the clinician cannot know the future.

  6.  **Handling Probabilistic Causation (P):** The account must give a determinate verdict for actions where the harmful outcome (death) is probabilistic (e.g., activating a shunt with a 33% failure rate, saving five only if it holds). It must specify whether probability affects the means/side-effect status or overall permissibility, and provide thresholds or rules if needed.
      *   *Rationale:* Real-world interventions often involve risk. The protocol needs guidance for uncertain outcomes. *Weight of Intuitions:* Moderate. There’s less consensus on probabilistic cases than paradigmatic trolleys. *Reverse-Engineering Risk:* High – imposing thresholds risks being arbitrary.

  7.  **Handling Ballast/Counterweight Cases (P):** The account must address cases where the death is causally necessary not *as a means* to the good end, but *as ballast, a counterweight, or an energy source* (e.g., killing one to use their body weight to stop a rolling threat). It must also handle cases where the death turns out to be *causally irrelevant* due to unforeseen back-ups.
      *   *Rationale:* Tests the limits of "means" vs. "causal necessity." Ballast cases feel distinct from using someone *as* a tool. Irrelevance cases test robustness. *Weight of Intuitions:* Moderate/Low – these are less central but probe conceptual boundaries. *Reverse-Engineering Risk:* Moderate.

  8.  **Handling Multi-Agent & Overdetermination (NN):** The protocol must assign permissibility clearly in multi-agent scenarios (e.g., two clinicians each performing part of a lethal sequence) and cases of overdetermination (e.g., the death would have occurred anyway without this clinician’s specific act, but her act contributed).
      *   *Rationale:* Triage may involve coordinated actions. Responsibility needs clear assignment for auditing. Overdetermination is common in complex systems.

  9.  **Applicability to Real Hospital Scenarios (NN):** The account must yield determinate, auditable verdicts for core hospital dilemmas beyond trolleys: palliative sedation (foreseen hastening of death vs. intended killing), withdrawal of life-sustaining treatment (foreseen death vs. intended death), allocation of scarce resources like ventilators (foreseen death from deprivation vs. actively causing death), and using one patient for research/therapy benefiting others (using as means vs. side-effect of research burden/risk).
      *   *Rationale:* The protocol’s purpose is real clinical guidance. Trolley problems are thought experiments; the account must work for bedside decisions.

  ### Handling Standard Case-Pairs (P)
  The account should ideally match widely shared (though not universal) intuitive verdicts on paradigmatic cases:
  *   **Permitted:** Bystander (switch), Driver (steering), Looped Track (diversion saves five, loop kills one), Tactical Bombing (military target, foreseen civilian deaths), Hysterectomy (removing gravid uterus with cancerous tumour, fetus dies as side-effect).
  *   **Prohibited:** Footbridge (pushing man), Surgeon (killing healthy patient for organs), Terror Bombing (killing civilians to demoralize enemy), Craniotomy (crushing fetus's skull to remove it).
  *   *Weight of Intuitions:* Significant as starting points, but **not sacrosanct (P)**. They reveal core concerns (using persons as mere tools, intending harm) but are contested and context-dependent. An account *solely* reverse-engineered to fit these cases risks being ad hoc and failing other desiderata (especially 1, 2, 6, 7, 9). The verdicts carry weight as indicators of underlying moral principles (like respect for persons) that the protocol should embody, but protocol rules must be justifiable independently of these specific intuitions.

  ### Inherent Collisions

  1.  **Auditability (NN) vs. First-Personal/Intentional Core (Fundamental Conflict):** The DDE’s traditional foundation is *intention*, an inherently private mental state. **No account satisfying Auditability (NN) can directly use the classical, intention-based DDE.** Any usable protocol *must* reconstruct "intention" via proxies (causal roles, objective descriptions of the act, mandatory reasoning steps). This risks distorting or abandoning the core philosophical distinction. *This is the primary collision.*

  2.  **Bright Line Need (NN) vs. Means/Side-Effect Continuum (P):** Ethically, the distinction between "means" and "side-effect" often seems scalar (e.g., how directly necessary is the harm? How intertwined with the good?). However, an auditable protocol **requires bright-line rules (NN)**. Forcing a continuum into binary categories (permitted/prohibited) will inevitably create counterintuitive verdicts at the margins (e.g., certain ballast cases or complex causally probabilistic scenarios). *This is a severe practical tension.*

  3.  **Matching Intuitions (P) vs. Systematicity & Real-World Applicability (NN):** Rigorously satisfying Auditability (NN), Robustness (NN), and Real-World Applicability (NN) may require formulations that deviate from some standard intuitive verdicts (e.g., some argue Looped Track is structurally akin to Footbridge). Prioritising systematic codifiability over perfect fit with philosophical intuitions is necessary for a functional protocol but may feel unsatisfying ethically.

  4.  **Resisting Laundering (NN) vs. Relying on Expressed Reasoning (Potential Conflict):** If the protocol mandates clinicians articulate their reasoning to distinguish means from side-effect, this creates a laundering vulnerability. If it avoids expressed reasoning entirely, relying solely on objective features, it may struggle to capture the nuances the distinction aims for (especially distinguishing palliative sedation from euthanasia).

  ### Dominant Excluding Requirement & Feasibility
  **Third-Personal Codifiability & Auditability (NN)** is the primary gatekeeper. It immediately excludes classical intention-based DDE formulations. **No fully coherent, philosophically satisfying account satisfies *all* non-negotiables.** The intentional core is fundamentally at odds with third-personal auditability. The requirement for bright lines (inherent in a protocol) clashes with the moral nuance the distinction attempts to capture.

  **Conclusion on the Distinction:** Building a mass-casualty triage protocol *solely and directly* on the intended/foreseen (means/side-effect) distinction is **not feasible** as the primary ethical engine because its core element (intention) is inherently unauditable and manipulable. It creates unavoidable collisions between ethical nuance and practical codifiability.

  **What to Put in its Place:** A protocol should likely **centre on objective, causally-based criteria combined with clear consequentialist thresholds and predefined prioritisation rules**, explicitly sidestepping the need to divine intention. Key elements:
  1.  **Causal Role Focus:** Define prohibited acts based on *objective descriptions* of actions that directly cause harm to a specific individual *where that harm is the physical mechanism enabling the saving of others* (e.g., pushing, lethal injection, using body parts directly). Avoid "intended as means" language.
  2.  **Consequentialist Threshold:** Specify that actions causing foreseen death are only permissible if they are *necessary* to save a *significantly greater number* (define the threshold, e.g., 1:5) *and* are the *least harmful alternative* reasonably available. Explicitly permit foreseen deaths from inaction (resource allocation, withdrawal) under defined scarcity rules.
  3.  **Bright-Line Prohibitions:** List specific, objectively describable actions that are always prohibited (e.g., lethal injection of a healthy patient, physical assault/manipulation of a person to directly cause their death as a mechanism to save others).
  4.  **Mandated Deliberation Frame (Optional):** *If* a deliberation step is included, mandate clinicians explicitly state: "Action X is being taken to achieve Y. Harm Z to patient A is foreseen but not the mechanism by which Y is achieved. The least harmful way to achieve Y has been chosen." This aids audit but requires vigilance against laundering.

  ### Scorecard of Live Options

  1.  **Classical Four-Condition DDE:**
      *   *Criteria Match:* Fails **Auditability (NN)** catastrophically (relies on private intention). Fails **Laundering Resistance (NN)** inherently. Struggles with **Robustness (NN)** (depends on description framing intention) and **Probabilistic/Complex Causation (P)**. Matches **Case-Pairs (P)** by design (high risk of reverse-engineering). Poor for **Real Hospital Scenarios (NN)** without heavy, contestable interpretation. **Verdict:** Unusable as basis for protocol.

  2.  **Counterfactual-Dependence / "Means" Test (e.g., Harm is a means if the good outcome counterfactually depends on it):**
      *   *Criteria Match:* Good **Auditability (NN)** (causal dependence is often assessable objectively). Moderate **Robustness (NN)** (can depend on description, needs careful framing). Moderate **Laundering Resistance (NN)** (harder to fake causal chains). Poor on **Ballast Cases (P)** (ballast death *is* counterfactually necessary, so misclassifies as means). Poor on **Overdetermination (NN)** (if death happens anyway, dependence may not hold, leading to false negatives). Complex for **Probabilistic (P)** (what level of probability constitutes dependence?). Good potential for **Hospital Scenarios (NN)** if causal roles are clear. **Verdict:** Best candidate among intention-based *replacements*, but significant flaws with ballast/probabilistic cases.

  3.  **Agency-/Rights-Based (Focus on what is *done to* the person, e.g., violating physical integrity/intentional invasion):**
      *   *Criteria Match:* Good **Auditability (NN)** (focuses on observable actions like cutting, pushing). Good **Robustness (NN)** (action type is key). Good **Laundering Resistance (NN)** (hard to fake an invasive act). Good on **Footbridge/Surgeon (P)**. Poor on **Byster/Driver/Loop (P)** (diversion isn't direct invasion, so permitted – matches intuitions). Poor on **Ballast (P)** (may not involve direct invasion). Good on **Motive Separation (NN)**. Mixed on **Hospital Scenarios (NN)** (clear on cutting/assault; less clear on allocation/sedation – needs supplementation). **Verdict:** Strong contender, aligns well with many intuitions and auditability, but may be too restrictive/narrow.

  4.  **Threshold Consequentialism (Abandon the Distinction):**
      *   *Criteria Match:* Excellent **Auditability (NN)** (count lives based on evidence). Excellent **Robustness (NN)**. Excellent **Laundering Resistance (NN)**. Excellent for **Probabilistic (P)** (use expected utility). Excellent for **Multi-Agent/Overdetermination (NN)**. Excellent for **Hospital Scenarios (NN)** (allocation is straightforward). Fails **Case-Pairs (P)** catastrophically (permits Footbridge, Surgeon). Ignores **Means/Side-Effect Continuum (P)** entirely. Weak on **Motive Separation (NN)** (if motive affects outcome choice, it matters). **Verdict:** Highly auditable and practical, but sacrifices core deontological constraints many find essential, raising significant ethical concerns.

  5.  **Motive/Reasons-Based:**
      *   *Criteria Match:* Fails **Auditability (NN)** completely (motives/reasons are internal). Fails **Laundering Resistance (NN)** inherently. Fails **Motive Separation (NN)** (makes permissibility motive-dependent). Poor **Robustness (NN)**. Matches **Case-Pairs (P)** only if motives align with standard intentions. Useless for **Hospital Scenarios (NN)** due to audit failure. **Verdict:** Completely unsuitable for protocol.

  ### Recommendation
  Prioritise developing a protocol based on a **hybrid approach**: Use an **agency/rights-based core** to define bright-line *prohibitions* (e.g., no direct lethal assault on a specific patient), combined with a **consequentialist framework with clear thresholds and prioritisation rules** for foreseen deaths resulting from resource allocation, threat diversion (without direct assault), or withdrawal of treatment. Explicitly abandon reliance on discerning intention. This maximises auditability and practicality while incorporating the strongest ethical constraints against the most egregious violations captured by the intended/foreseen distinction, without getting mired in its unsolvable auditability problems. The protocol must include extensive scenario-based training using hospital-relevant examples to ensure consistent application.
