  First, I need to recall the standard statue/clay problem. Usually, it's about whether the statue and clay are identical or distinct. Here, the twist is the kiln firing process, which gradually changes the clay into ceramic. Both agree that post-firing, Goliath exists as a ceramic statue, but Lump no longer exists. The kiln's slow ramp-up adds vagueness to when exactly the material change happens.

