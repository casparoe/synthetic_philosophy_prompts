  We are analyzing "Everything Everywhere All at Once" (EEAAO) through the lens of David Lewis's modal realism. The core theses of Lewis we are considering are:
  1. Isolation: Worlds are spatiotemporally and causally isolated.
  2. Recombination: Unrestricted recombination — any way a world could be is a way some world is.
  3. Indexical Actuality: "Actuality" is indexical; it just means the world we are in.
  4. Counterpart Theory: No trans-world identity; instead, counterparts related by similarity.

  We are also addressing two specific points:
  - The nihilism problem and how the film responds to it compared to Lewis.
  - The "Home-World Restriction" (HWR): that practical reasons are world-bound due to no cross-world causation.

  Finally, we note where the film departs from Lewis in ways we cannot accommodate.

  The film EEAAO presents a multiverse where Evelyn Wang discovers she can access the skills and memories of her counterparts in other universes. Her daughter Joy has become Jobu Tupaki, who has seen all universes and created a black hole (the everything bagel) to annihilate everything. The film climaxes with Evelyn choosing to stay in her home universe (the laundromat world) and showing kindness to Joy.

  **Reading in Prose (approx. 700-900 words):**

  The film *Everything Everywhere All at Once* offers a rich, visual exploration of the multiverse that both resonates with and challenges David Lewis's modal realism. At first glance, the multiverse of the film seems to align with Lewis's plurality of worlds: there are infinitely many universes, each with its own version of events. The film's depiction of wildly different universes — from one where humans have hot dogs for fingers to another where Evelyn is a famous movie star — echoes Lewis's principle of unrestricted recombination. Any coherent possibility is realized somewhere. Moreover, the film's multiverse is concrete: we see the alternate universes as just as real as the primary one.

  However, the film immediately departs from Lewis in crucial ways. Lewis insists that worlds are causally and spatiotemporally isolated. But in EEAAO, verse-jumping is possible: Evelyn and Jobu can travel between worlds, influence events across them, and even bring objects (like googly eyes) from one world to another. This cross-world causation is central to the plot and directly contradicts Lewis's isolation thesis. Furthermore, the film treats Joy and Jobu Tupaki as the same person, not counterparts. Jobu is not merely similar to Joy; she is Joy from another universe who has gained god-like powers. This violates Lewis's counterpart theory, which denies trans-world identity. The film also suggests that worlds branch from decisions (e.g., Evelyn's choice to marry Waymond creates a split), which Lewis rejects: for him, worlds are not generated by branching but are all equally real and disconnected.

  The nihilism arc is central. Jobu Tupaki, having experienced every possible universe, concludes that nothing matters. She creates the everything bagel (a black hole) to destroy herself and everything. This mirrors a challenge to modal realism: if every horror exists (e.g., a universe where Evelyn abandons her family, or one where Joy dies), doesn't that make existence meaningless? Lewis would reply that existence is not creation — the horrors are not our fault — and that the sum of being is not worsened by containing bad parts. The film, however, answers in the register of reasons. Evelyn, after experiencing the same everything, chooses to be kind even in the worst circumstances. She tells Joy, "In another life, I would have really liked just doing laundry and taxes with you." This is not an ontological argument but a practical one: meaning is created by choice and connection. It is a change of subject from Lewis's ontological defense, but a powerful one. A Lewisian could borrow the spirit: even if every possibility exists, we can choose to focus on the local and the loving. However, the film's answer is tied to its violation of isolation: Evelyn's choice matters because she can literally see the consequences across worlds. Without that, a Lewisian must rely on the indexical nature of actuality to ground reasons.

  This brings us to the Home-World Restriction (HWR). The HWR states that even if all worlds are real, an agent's practical reasons are confined to her home world because there is no cross-world causation. But the film explicitly allows cross-world travel and influence. Thus, the HWR does not apply in the film's multiverse. Jobu's nihilism is not a scope error because she can affect multiple worlds. However, the ending subtly reinstates a version of the HWR: Evelyn chooses to stay in her laundromat world and focus on her immediate family. She does not abandon her world for another, nor does she try to fix every universe. This suggests that even with verse-jumping, reasons might be tied to the world you choose as home. But note: the film allows cross-world reasons (e.g., Evelyn uses skills from other worlds to solve problems in hers). Thus, the HWR must be revised: reasons might extend to worlds you can affect. The film's ending does not contradict this; it merely shows Evelyn choosing to prioritize her local world.

  The film's most radical departure is its treatment of branching and cross-world identity. When Evelyn fights Jobu in the laundromat, she is not fighting a counterpart but her actual daughter. The rock scene (where two rocks with googly eyes "talk" in a universe without life) uses absurdity to show that meaning is created by attention and love, not by grand narratives. This scene, while atmospheric, underscores the film's core argument against nihilism. The bagel is a physical manifestation of the void that nihilism represents, but it is defeated by human connection.

  In summary, the film dramatizes recombination and indexical actuality (each universe is "actual" to its inhabitants) but contradicts isolation and counterpart theory. The nihilism worry is answered by shifting from ontology to ethics, which a Lewisian can partly borrow. The HWR is challenged by verse-jumping but finds a parallel in Evelyn's final choice. What the film adds is an emotional and visceral engagement with the multiverse: it shows the existential weight of plenitude and the courage to create meaning locally. This is something abstract arguments cannot convey.

  **Teaching Caveat**: Students might think that Lewis's theory allows for cross-world travel like the film. To head this off, stress that Lewis's isolation thesis explicitly forbids it — the film is a what-if scenario, not an illustration.

