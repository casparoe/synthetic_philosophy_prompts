  ### Reading: *Everything Everywhere All at Once* Through Lewisian Modal Realism  

  The film *Everything Everywhere All at Once* (EEAAO) offers a spectacular, chaotic multiverse that initially appears hospitable to David Lewis’s modal realism. Lewis posits a plurality of concrete, causally isolated worlds where every possibility is realized (unrestricted recombination), "actuality" is indexical (merely denoting one’s own world), and trans-world identity is replaced by counterpart relations based on similarity. EEAAO’s multiverse—with its infinite variations of Evelyn Wang, from a laundromat owner to a hibachi chef or a sentient rock—vividly *dramatizes recombination* and *indexical actuality*. Evelyn’s primary universe (the "laundromat world") feels "actual" to her until she accesses others, mirroring Lewis’s view that no world is metaphysically privileged. The film’s absurdist range of worlds (e.g., hot-dog-finger universes, piñata parties) embodies recombination: every coherent possibility exists somewhere.  

  However, EEAAO fundamentally *contradicts* Lewis’s core theses of *isolation* and *counterpart theory*. Lewis’s worlds are causally and spatiotemporally sealed; no travel or influence between them is possible. Yet the film’s verse-jumping technology (like the earpiece and special actions) enables cross-world causation: Evelyn fights enemies across universes, borrows skills (e.g., kung fu from "Movie Star Evelyn"), and physically moves objects (e.g., googly eyes) between worlds. This shatters isolation. Similarly, Jobu Tupaki is not Joy’s counterpart but *literally* the same person—a version of Joy who gained godlike powers. The film’s multiverse "branches" from pivotal decisions (e.g., Evelyn’s choice to marry Waymond), implying shared histories that Lewis’s eternally disconnected worlds reject. The rock universe scene (where Evelyn and Joy are silent, googly-eyed rocks) poetically underscores their shared identity: they "communicate" through superimposed text, transcending Lewisian similarity for unity.  

  **Nihilism and the Problem of Evil**  
  Jobu’s nihilism—her "everything bagel" symbolizing the void of meaning after seeing all horrors across worlds—parallels a Lewisian worry: if plenitude guarantees that every atrocity exists (e.g., worlds where Joy dies or Evelyn is cruel), does this not validate despair? Lewis replies *ontologically*: existence is not creation; the horrors are not *our* fault, and the sum of being isn’t worsened by bad parts. EEAAO answers in the *practical* register: Evelyn, facing the same abyss, chooses kindness. Her climactic speech to Joy—"In another life, I would have really liked just doing laundry and taxes with you"—asserts that meaning arises from local acts of love, however absurd. This *changes the subject* from Lewis’s defense. Where Lewis absolves ontology, Evelyn prescribes ethics: care matters *because* we choose it amid chaos. A Lewisian could *partly* borrow this, advocating focus on one’s indexical world, but cannot replicate Evelyn’s cross-world grounding (e.g., her empathy draws on witnessing other Evelyns’ regrets). The film’s answer is therapeutic, not metaphysical—a shield against despair, not a refutation of plenitude.  

  **The Home-World Restriction (HWR)**  
  The HWR proposes that even if all worlds exist, practical reasons are confined to one’s home world, as cross-world influence is impossible. In EEAAO, verse-jumping is the *strongest objection*: characters *can* affect other worlds (e.g., Evelyn rescues verses from Jobu’s bagel), so reasons seemingly span universes. Yet the ending offers a *best defense*: Evelyn stays in her laundromat world, rejecting omniversal heroism to fix her marriage and connect with Joy. Her choice *quietly reinstates* a revised HWR: while cross-world *causation* is possible, *reasons* are prioritised for the world you inhabit and affect directly. The HWR *survives only if revised* to: "Agents should focus on worlds where their actions have causal efficacy and personal stakes." Jobu’s nihilism becomes a "scope error" not because she’s wrong about plenitude, but because she ignores that meaning is agent-relative—even with verse-jumping, Evelyn’s redemption is local.  

  **What the Film Adds**  
  EEAAO dramatizes the *existential weight* of modal realism in ways abstract philosophy cannot. The bagel is not just a symbol but a visceral manifestation of despair; the googly eyes (a trivial item made profound) epitomize choosing meaning in absurdity. The film forces us to *confront* plenitude emotionally—where Lewis coolly describes, EEAAO makes us feel the terror and tenderness of infinity.  

  **Teaching Caveat**  
  Students may conflate Lewis’s counterpart theory with the film’s trans-world identity, misreading Joy/Jobu as "counterparts." Preempt this by stressing Lewis’s explicit rejection of literal identity: for him, the rocks are *not* Evelyn and Joy—they are distinct entities with no causal or existential ties to "our" world.  

