prompt: |-
  I write about science and ideas for a magazine, and I'm currently working on a piece about what happens to moral language once a great deal of it starts coming out of institutions and machines rather than people: crisis triage protocols drafted by rotating hospital committees and then applied by software, model-generated summaries of what a patient "ought" to be told, training datasets built from moral annotations whose authors are dead. At a workshop dinner I sat through recently, two philosophers had an argument I have not been able to stop turning over, and I would like it adjudicated rather than summarized. They began from common ground: expressivism holds that to call something wrong is not to state a belief but to voice a conative attitude, something closer to cheering or booing than to describing; the Frege–Geach problem is that moral sentences keep their full meaning in positions where nothing is being voiced, as when "stealing is wrong" sits in the antecedent of a conditional, and yet moral arguments containing such sentences look straightforwardly valid; and the best-known expressivist reply, the quasi-realist one associated with Simon Blackburn, relocates validity one level up, so that what makes the argument good is not shared representational content but the incoherence of simultaneously being for the antecedent, for the conditional, and against the consequent.

  From there it went like this. (1) The critic, Julian, introduced what he called "unowned" moral sentences: tokens that are produced, stored, and used without any agent ever having the relevant attitude and, in some cases, without any agent being in a position to have it — a protocol line saying that withholding life-sustaining treatment in a certain class of cases is permissible, or a verdict emitted by a model trained on annotators no one can now question. He said such tokens enter inferences that are plainly valid and plainly action-guiding, while the expressivist's surrogate for validity has nothing to bite on, since there is no one whose attitudes could be incoherent. (2) The expressivist, Nadia, answered that this is the original problem in a new costume: the Frege–Geach problem was always about unasserted occurrences, an unowned token is simply an unasserted one with nobody standing nearby, and meaning is fixed by the practices of a community of attitude-holders from which the token inherits its content; the protocol's inference is valid in that anyone who did take up those sentences — who applied them while rejecting their upshot — would be incoherent. (3) Julian replied that this makes validity hostage to agents who will never exist, since the protocol simply runs and no one takes it up in the relevant sense, and that in the meantime Nadia is quietly treating the sentences as correct or incorrect independently of anybody's attitudes, which is the very thing in dispute; he added that if content can be inherited from attitudes held by people long dead, then the attitudes are doing no semantic work and expressivism has become a causal story about how a practice got started. (4) Nadia's sharpest move was to say that Julian's pressure case is really a dispute about what counts as a bearer of commitment rather than about moral semantics: expressivism never required an occurrent feeling, the attitude in the embedded antecedent was never felt either, and if an institution or a system with a stable dispositional profile can count as a commitment-bearer, then its patterned dispositions can coherently or incoherently hang together and the view accommodates the case. (5) Julian answered that if commitments can float entirely free of affect, motivation, and any capacity to be moved by what one "accepts," the position survives only by ceasing to be a distinctive semantic thesis — it has become realism with a deflationary theory of truth bolted on, and the old motivation for expressivism, the tight link between moral judgment and motivation, has quietly evaporated. Neither would budge, and I genuinely could not tell who was winning.

  So please referee it. Go through the five moves and tell me who is right about what at each step — ideally rating each move from clearly mistaken to clearly right and justifying the rating briefly, since I suspect several of them are partly right in different respects — and then tell me what, if anything, both of them are missing. Specifically: are unowned sentences a genuinely new problem for expressivism or only the Frege–Geach problem re-described; does the disagreement in fact bottom out somewhere other than moral semantics, in a general theory of content or of what an agent is; does the case tell us anything about whether a practice needs live participants to confer meaning; and what, if anything, all of this settles about the question I actually have to answer in my piece — whether sentences issued by committees, protocols, and models can be said to mean what our moral sentences mean.
reasoning: |-
  Okay, the user is a science writer working on a piece about moral language in institutional and machine contexts. They want me to adjudicate a philosophical debate between Julian (critic) and Nadia (expressivist) about "unowned" moral sentences. Let me unpack this step by step.

  First, understanding the core issue: Expressivism says moral statements express attitudes, not beliefs. The Frege-Geach problem challenges how these work in logical structures like conditionals. Blackburn's quasi-realism handles this by shifting validity to coherence of attitudes. Now Julian introduces "unowned" sentences - moral claims produced by systems without any agent actually holding the attitude. Examples include automated protocols or datasets from dead annotators.

  Julian argues these create new problems because:
  1) They participate in valid inferences
  2) They guide actions
  3) But there's no actual attitude-holder whose coherence could ground validity

  Nadia counters that this is just Frege-Geach repackaged - meaning comes from the community of practice, even if no one is currently asserting it. Validity depends on hypothetical coherence: anyone using these sentences would need consistent attitudes.

  Julian pushes back: 
  - Relying on hypothetical agents is unsatisfying
  - If content inherits from long-dead people, attitudes aren't doing semantic work
  - This makes expressivism just a causal history story

  Nadia's key move: Institutions themselves can be commitment-bearers through their dispositions, not require occurrent feelings.

  Julian's final thrust: If commitments don't require affect/motivation, expressivism loses what makes it distinct from realism.

  Now to evaluate each move:

  Move 1 (Julian): Partly right. He correctly identifies a pressure point - institutional sentences create new challenges for expressivism. But overstates novelty. Rating: Partly Right (New Emphasis).

  Move 2 (Nadia): Mostly right. She properly locates this within existing expressivist framework. The community practice response is standard. Rating: Mostly Right.

  Move 3 (Julian): Strong point about hypothetical agents being problematic. Correct that Nadia risks smuggling in realism. But underestimates expressivist resources. Rating: Partly Right (Effective Critique).

  Move 4 (Nadia): Clever expansion of "agent" to institutions. This is expressivism's best shot. But does stretch the theory. Rating: Mostly Right (Necessary Move).

  Move 5 (Julian): Devastating if accepted. If expressivism sacrifices the motivation link, it collapses into realism. This exposes a genuine tension. Rating: Largely Correct (Fatal If True).

  What both miss:
  - The bigger question isn't just semantics but what counts as a "language game" participant
  - They're talking past each other on "agent" - Julian wants human phenomenology, Nadia accepts functional roles
  - This reveals expressivism's limits in institutional contexts

  For the user's article:
  - Unowned sentences do function meaningfully in practice
  - But expressivism struggles to fully explain why without realism
  - The key insight is that institutional meaning relies on deference to authority, not attitude expression
  - This suggests moral language changes character when detached from human commitment

  The takeaway for the piece should be that machines/computers can produce moral sentences that function in language games, but they represent a shift from expressive to institutional meaning - more like legal pronouncements than personal convictions. The "meaning" is preserved formally but changes phenomenologically.
answer: |-
  Let's referee this rigorous exchange step by step, rating each move on a spectrum from **Clearly Mistaken** to **Clearly Right**, then synthesize what's missing. Your core question—whether institutional/machine moral language "means" what ours does—will anchor the conclusion.

  ### **Adjudication of Moves**
  **Move 1 (Julian: "Unowned sentences break expressivism")**  
  **Rating:** *Partly Right (New Emphasis)*  
  Julian correctly spots a *practical* gap in expressivism: when moral tokens operate without *any* agent's attitudes (e.g., an AI applying a dead committee’s protocol), Blackburn-style "coherence of attitudes" has no target. His examples show **action-guiding validity without psychological grounding**. But he overstates novelty: this *is* Frege-Geach in extreme form, not a wholly new problem.  
  **Verdict:** Right about pressure, wrong about total novelty.

  **Move 2 (Nadia: "Inheritance from community practices saves it")**  
  **Rating:** *Mostly Right*  
  Nadia properly reframes unowned tokens as *unasserted* ones. Her appeal to communal practices (e.g., the protocol inherits meaning from historical attitude-holders) is expressivism’s standard move for embedded contexts. **Validity via hypothetical coherence** ("any user would be inconsistent") fits quasi-realism. But she glides over *whose* community matters (e.g., annotators vs. users).  
  **Verdict:** Correct in theory, but underspecified for edge cases.

  **Move 3 (Julian: "Hypothetical agents aren’t enough; attitudes are inert")**  
  **Rating:** *Partly Right (Effective Critique)*  
  Julian lands two strong blows:  
  - If validity depends on *non-existent* hypothetical agents (e.g., no one "takes up" the protocol), it’s **vacuously coherent**.  
  - If content "inherits" from dead annotators, attitudes become **causal relics, not active meaning-conferrers**.  
  This exposes a tension: Nadia *is* tacitly treating moral content as attitude-independent. But he underestimates quasi-realism’s flexibility—attitudes *define* the practice, even if not currently embodied.  
  **Verdict:** Strong challenge, but not fatal.

  **Move 4 (Nadia: "Institutions are commitment-bearers")**  
  **Rating:** *Mostly Right (Necessary Move)*  
  Nadia’s best counter: if institutions/systems have **stable dispositions** (e.g., a hospital protocol’s consistent outputs), they *can* "bear commitments" without occurrent feelings. This extends expressivism naturally—dispositions replace momentary attitudes. Blackburn *does* allow for "states of mind" beyond raw emotion. But Julian will rightly ask: can a "disposition" *motivate* like human judgment?  
  **Verdict:** Defensible expansion of expressivism.

  **Move 5 (Julian: "This evaporates expressivism’s core")**  
  **Rating:** *Largely Correct (Fatal If True)*  
  Julian’s knockout point: if commitments require **zero affect or motivation** (e.g., an algorithm feels nothing), expressivism collapses into **realism-lite**. The "judgment → motivation" link *is* expressivism’s raison d’être (e.g., "stealing is wrong" should *press* you not to steal). Nadia’s institutional "dispositions" lack this link—a protocol doesn’t *care*. This *does* surrender expressivism’s uniqueness.  
  **Verdict:** Correct about the stakes; forces a concession.

  ### **Who "Wins"?**
  - **Julian wins on stakes**: He proves unowned sentences **strain expressivism beyond recognition**. If institutions/machines "bear commitments" devoid of motivation, expressivism becomes redundant.  
  - **Nadia wins on flexibility**: Her moves *can* absorb unowned tokens, but at the cost of **diluting expressivism’s psychological core**. It survives, but as a hybrid theory.  
  **Overall**: Julian lands heavier blows (3 and 5), but Nadia shows expressivism *can* adapt—just not elegantly.  

  ---

  ### **What Both Miss (and Your Questions Answered)**  
  1. **Are unowned sentences a *new* problem?**  
     **No—but they exacerbate Frege-Gach.** They stress-test expressivism by **removing humans entirely**, revealing that Blackburn’s solution relies on *potential* attitude-holders. Julian’s examples force quasi-realism into uncomfortable stretching.  

  2. **Does this bottom out beyond moral semantics?**  
     **Yes—in theories of agency and content.** Their deadlock is really about:  
     - **What counts as an "agent"**? Julian demands human-like phenomenology; Nadia accepts functionalist "dispositions."  
     - **What fixes meaning**? If dead annotators’ attitudes confer content, meaning relies on **causal-historical chains** (like Kripkean reference), not current attitudes.  

  3. **Can meaning exist without live participants?**  
     **Yes—but it becomes *inert*.** A protocol’s sentence *retains* linguistic meaning via social practice (like a discarded law still "meaning" theft is illegal). But without living practice (e.g., debate, application), it loses **force as a *moral* utterance**. It’s a fossil—structurally intact but disconnected from conative life.  

  4. **Can committees/protocols/models "mean" what we mean?**  
     **Formally yes, phenomenologically no.**  
     - **Yes**: They participate in the same **language games** (inferences, prescriptions) because they inherit communal grammar. A protocol’s "permissible" guides action *as if* it expressed an attitude.  
     - **No**: They lack the **subjective grip** of moral language—the *boo!/hooray!* dimension. A model’s output is a **simulacrum of commitment**, not a lived stance.  
     **Implication for your piece**: Moral language from institutions/machines is **procedurally identical but existentially hollow**. It functions socially but risks "**ethics by bureaucracy**"—where moral force derives from authority, not human response. This isn’t semantic breakdown; it’s **moral alienation**.  

  ### **Final Word**  
  Unowned sentences don’t refute expressivism, but they expose its **practical limits in a mechanized world**. Quasi-realism *can* accommodate them—by treating institutions as "agents" and attitudes as historical artifacts—but only by sacrificing expressivism’s intimate link between judgment and motivation. For your piece, foreground this trade-off: **machines *can* deploy moral language meaningfully, but they transform it from a cry of conscience into a tool of governance**. The deeper threat isn’t semantic incoherence—it’s the **disappearance of moral subjects** from the language they created.
