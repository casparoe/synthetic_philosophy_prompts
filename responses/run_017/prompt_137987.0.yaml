prompt: |-
  I'm a third-year PhD student in experimental psychology and I've somehow ended up on our department's research integrity committee, which in practice means I'm the one who has to write the paragraph explaining why we're adopting whatever method reform we're adopting this year. I keep tripping over the same thing, so I thought I'd ask people who do this for a living rather than keep guessing.

  Here's the bit I can't line up. Take two studies: identical design, identical n, identical measurements, identical p-value, say p = .21 in both. Study A was pre-registered with a fixed sample size and a stated smallest effect size of interest, analysed exactly as declared. Study B is the same study run before pre-registration was mandatory here; the analysis was settled after people had looked at the data, and as far as anyone can tell there was no outright fishing, just no pre-commitment. Under our new norms A counts as a genuine finding, evidence of absence, publishable, and it can be cited in a review as settling the question. B is treated as uninformative, file-drawer material, we can't conclude anything from it. Same number on the page, opposite verdicts.

  Then there's the part where I'm not sure we're consistent with ourselves. We're strict about fixing n in advance, and people get told off for peeking at the data and stopping early; the line we give them is that if you'd have carried on past n = 40, you don't get to use the p = .03 you happened to have at n = 40. At the same time, we treat a single pre-registered replication that comes back at p = .40 as a failed replication that puts the original effect in doubt, even though we'd never dream of accepting a single p = .03 as establishing anything. And our ethics committee has now started requiring a smallest effect size of interest in every application, so in principle you can have a confidence interval that includes zero but excludes anything you'd have cared about, and reviewers will say no effect there — but apparently only if the study was pre-registered, and only if someone is willing to say it out loud. Quite a few of my colleagues resist going further and just using equivalence tests with a pre-registered bound, and I genuinely can't tell whether that's methodological conservatism or an inconsistency they haven't noticed.

  So: what view of evidence does this whole package presuppose? More specifically,

  - What has to be true of evidence for pre-registration to change what a given p-value is worth, given that the data are identical in A and B? Is that a commitment to a procedural or reliabilist picture, on which evidence is a property of the method rather than of the numbers, or is there a way to get the same verdict out of a broadly Bayesian picture, e.g. by conditioning on the fact that this result was reported at all rather than just on the test statistic? If there is, does the practice really pick out the first view, or does it fit several?
  - Does the ban on optional stopping presuppose the same thing as the pre-registration bit, or a different thing? It feels like it presupposes that error rates across hypothetical repetitions matter in their own right, whereas the pre-registration asymmetry felt like it was about what the data support. If those are two different commitments, are they even compatible, and which of our rules actually follows from which?
  - How much of this is forced? Which parts of our practice would survive intact under a likelihoodist or Bayesian picture, and which would have to be abandoned? If we went properly Bayesian, priors, Bayes factors, decisions by expected loss, what exactly would we stop doing that we currently do, and what would we have to start doing that we don't?
  - Is there a genuine inconsistency between treating non-significance as we can't say in a single study and treating it as damning in a replication, or is there a single story from which both fall out?

  I don't want a reading list or citations, I can find those myself. I want the implicit epistemology reconstructed, and I want to be told which bits of it we're actually stuck with and which bits we've merely inherited from people arguing in the 1930s. If it helps: we mostly run small-N within-subjects experiments on reaction times and accuracy, nobody has any real idea what our effect sizes are, and half the lab thinks p-values should be abolished outright.
reasoning: |-
  Okay, let me try to unpack this PhD student's dilemma. They're struggling to reconcile their department's research integrity rules that treat identical p-values differently based on pre-registration status and analysis timing. The core tension seems to be between procedural rigor and evidential value.

  Hmm, the student presents two hypothetical studies with identical data but opposite interpretations. Study A gets treated as evidence of absence because it was pre-registered, while Study B is dismissed as uninformative. That's quite a stark difference for the same numbers. I wonder if they're noticing how institutional norms are creating epistemological contradictions.

  The optional stopping paradox is particularly interesting. The department forbids stopping early even with p=.03, but accepts p=.40 in replications as falsifying evidence. That does seem asymmetric. And the new requirement for smallest effect sizes adds another layer - confidence intervals excluding SESOI but including zero get treated as "no effect" only under specific conditions.

  What's really being asked here is about the underlying philosophy of evidence. Let me break it down:

  First, the pre-registration asymmetry suggests a strong procedural view where method determines evidential weight. This aligns with frequentist error-statistics where the sampling procedure defines the meaning of results. But the student is right to question whether Bayesian approaches could justify the same asymmetry through selection bias considerations.

  The optional stopping ban is pure frequentism - it's about controlling type I error rates across hypothetical repetitions. But this seems disconnected from the replication paradox where a single non-significant result suddenly becomes meaningful. That feels like the department is mixing error-control and evidence-weighting frameworks inconsistently.

  If they switched to Bayesian methods, they'd lose the bright-line rules about pre-registration and optional stopping. Bayes factors would naturally penalize flexibility through the prior predictive distributions. But they'd gain direct probability statements about effects. The SESOI requirement would fit nicely with Bayesian equivalence testing though.

  The replication inconsistency is perhaps the most troubling. Treating non-significance as meaningless in isolation but damning in replication contexts suggests they're actually using a form of meta-analytic thinking without admitting it. There might be a coherent story using likelihood principles, but their current practice isn't consistent.

  What this department seems to have is a layered epistemology: frequentist foundations with ad-hoc likelihood/Bayesian patches. They're stuck with some historical baggage but not all of it is necessary. The key is recognizing that their SESOI practice already implies abandoning pure p-value worship - they could extend that logic further.

  The student's frustration is palpable - they're noticing the seams in their methodology. What they need is not citations but conceptual clarity about which parts are essential and which are optional. I should emphasize that their SESOI requirement is actually the most progressive element, pointing toward a more coherent evidentiary framework if they'd follow through properly.
answer: |-
  Your department's practices reveal a hybrid epistemology blending frequentist error-statistics with ad-hoc likelihood/Bayesian intuitions – one that's historically contingent and internally strained. Let's reconstruct the implicit commitments:

  ### 1. Pre-registration's evidential asymmetry (A vs. B)
  - **Procedural reliabilism dominates**: The identical p-value is interpreted differently because pre-registration binds the *sampling intentions*. Study A's p=.21 is evaluated against a pre-specified SESOI, making it a valid test of "absence" (using inferential tools like equivalence testing). Study B's identical data suffers from **researcher degrees of freedom**: the analysis could have been altered to achieve significance (e.g., adding covariates, transforming data). 
  - **Bayesian escape hatch?** Yes, but awkwardly. You could argue Study B has higher risk of selection bias (non-reported analyses), requiring a higher prior for H₁ to take p=.21 seriously. However, your colleagues likely aren't computing Bayes factors. Their practice assumes frequentist error control requires fixed protocols *regardless of actual researcher behavior*.
  - **What's presupposed**: Evidence isn't just the data; it's the data *generated under a specific procedural contract*. This is pure Neyman-Pearson: the long-run error properties define the inference.

  ### 2. Optional stopping ban vs. replication paradox
  - **Incompatible foundations**: The optional stopping ban is strictly frequentist (stopping rules alter Type I error rates). But treating p=.40 in a replication as "damning" relies on **likelihood principles** (same data, same evidence) or Bayesian updating (accumulating evidence against the effect). 
  - **The inconsistency**: If you ban optional stopping because p=.03 at n=40 is unreliable, consistency demands that p=.40 in a single replication is *also* unreliable. But your department implicitly treats replications as accumulating evidence – a meta-analytic view incompatible with strict frequency interpretations.
  - **Resolution attempt**: Colleagues might rationalize this by assuming the *original study* established a high prior probability for the effect, making non-significant replication stronger evidence against it. But this Bayesian logic isn't formally applied.

  ### 3. What survives under Bayesian/likelihood reform?
  - **Abandoned immediately**: 
    - Fixed-N requirements (Bayesian sequential analysis handles optional stopping)
    - Sacred p=.05 thresholds (replaced by Bayes factors or posterior probabilities)
    - "Significance" as a binary claim
  - **Retained with modification**: 
    - SESOI → Becomes the region of practical equivalence (ROPE) in Bayesian equivalence testing
    - Pre-registration → Shifts from error control to reducing analyst degrees of freedom (still valuable for transparency)
  - **New necessities**:
    - Explicit priors (subject to sensitivity analysis)
    - Decision-theoretic frameworks (loss functions for false positives/negatives)
    - Bayes factors or posterior densities as evidence measures

  ### 4. The replication inconsistency resolved?
  Only under **accumulated evidence** frameworks. A single non-significant study *is* weak evidence on its own. But if:
  - Original study: BF₁₀ = 10 (moderate evidence for effect)
  - Replication: BF₀₁ = 3 (weak evidence for null)
  The combined BF₀₁ = 10 × 3 = 30 → substantial evidence for the null.  
  **Your department's practice** smuggles in this meta-analytic logic while pretending each study is evaluated in isolation. The inconsistency arises because they apply likelihood updating *only* in replications while forbidding it in sequential designs.

  ### What you're stuck with vs. historical baggage
  | Practice                | Epistemological Commitment       | Forced? | Historical Baggage |
  |-------------------------|----------------------------------|---------|---------------------|
  | Pre-registration value  | Procedural reliabilism           | No      | 1930s NP testing    |
  | SESOI requirements      | Pragmatic decision theory        | **Yes** | Modern reform       |
  | Optional stopping ban   | Strict frequentism               | No      | Early NP theory     |
  | Replication asymmetry   | Covert Bayesian updating         | No      | Crisis-era ad-hoc   |
  | p-value abolitionism    | Rejection of frequentism         | No      | Post-2010 reform    |

  **The core tension**: Your department uses frequentist *procedures* (pre-registration, fixed-N) but increasingly relies on likelihood/Bayesian *interpretations* (SESOI-based conclusions, replication weight). This is unsustainable.

  ### Pragmatic path forward
  1. **Embrace the SESOI revolution**: It's your most coherent practice. Push colleagues toward formal equivalence testing (TOST or Bayesian ROPEs) – this resolves the "A vs. B" asymmetry cleanly.
  2. **Admit the replication paradox**: State explicitly that replications are evaluated cumulatively, not as isolated events.
  3. **Ditch hypocritical strictures**: If you accept SESOI-based nulls, optional stopping bans lose justification. Switch to sequential Bayes factors or frequentist group-sequential designs.
  4. **Concede the Bayesian core**: Your ethics committee's SESOI requirement implies decisions based on practical consequences – which demands Bayesian expected loss minimization or at least severity assessments (Mayo).

  You're witnessing epistemology mid-collapse. The practices persist not because they're coherent, but because they're legacy tools retooled for crisis-era reforms. The SESOI focus is the viable kernel – build on that, discard the rest.

  *"We pretend p-values measure evidence while acting like Bayesians"* – your department's motto, unwritten but operational.
