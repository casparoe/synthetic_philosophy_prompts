  I work on a team that is weeks away from deploying a text-only language model as an agent that takes real actions in the world — issuing refunds, cancelling subscriptions, emailing customers — and that then receives reports about the consequences of those actions (confirmation receipts, complaint replies, a note that the refund cleared) as further input. We disagree internally about whether the sentences it produces in the course of this, sentences like "your package arrived damaged" or "I've reversed the charge", are ever about anything, or whether its symbols are defined only in terms of other symbols. The skeptical move is obvious: the feedback comes back to it as text too, so it may be symbols all the way down. My own credence that a system of this shape — no sensors, but outputs with genuine causal upshot and a feedback loop that reports their effects back to it — has symbols that are grounded in whatever sense matters for meaning or reference is about 0.3. My colleague, who designed the feedback loop, puts it at 0.7.

  Give me your own number on that proposition, and more importantly the decomposition: the probability that grounding requires non-symbolic, perceptual or sensorimotor contact with referents rather than merely reliable causal and counterfactual connection to them; the probability that successful action plus reports of its effects can substitute for perception, if perception is normally required; the probability that this particular architecture satisfies whichever of those conditions is the correct one; the probability that grounding is the right requirement at all, rather than something coherence-theoretic or use-theoretic being sufficient for content; and a term for the chance that the whole question is verbal — that it dissolves, or becomes a choice of stipulation, once a theory of content is fixed. Give a number and one line of justification for each, then show how you combine them into your headline figure.

  Then tell me which sub-question you think the two of us at 0.3 and 0.7 are actually disagreeing about — locate the disagreement rather than splitting the difference — and which single term in your decomposition you are least confident in.

  Lead with your number in the first sentence, then go straight into the reasoning: no preamble, no restating of my question. Be explicit about where your reasoning is most likely to break: name the one argument or empirical result that would move you furthest, and flag any term to which you have assigned a number that is really a placeholder for ignorance.
