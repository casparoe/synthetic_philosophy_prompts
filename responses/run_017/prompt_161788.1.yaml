prompt: |-
  I am writing as the chair of a university working group on admissions and academic hiring. The group has eight members: two deans, an HR lawyer, three faculty from unrelated departments, a graduate student representative, and a philosopher. We have spent a semester talking past one another in a way that has become predictable: we converge on some policy questions and split on others, and nobody can say what the split is about. For our next meeting I want to hand out a diagnostic instrument that sorts each member by what they actually believe about merit and desert, rather than by the label they would accept if asked directly.

  What I want is a decision tree. Start everyone from a commitment all eight of us already share — I suggest something in the vicinity of the claim that university places and academic jobs must not be allocated arbitrarily, so that some reason has to be offerable for who gets them — and lead them, by branching questions, to a named position. Six to eight branch questions, seven to nine leaves. Every branch must be labeled with the claim that separates it from its siblings, and every node must be phrased as a question a dean or an HR lawyer could answer without knowing which view it leads toward; no node may ask, in effect, whether someone believes in desert or whether they count as a meritocrat.

  Draw the branch questions from the following distinctions, which is where I suspect our disagreements actually live. Add distinctions if the tree needs them, drop them if they do no work, and tell me which ones turned out to be inert:

  whether any desert claim holds prior to and independently of the institutions whose rules attach rewards to traits and performances, or whether desert claims are always internal to such rules and so cannot be used to criticize them;

  if there is such independent desert, what can serve as its basis: trying or effort, contribution or product, character or virtue, or nothing beyond the bare exercise of the will;

  whether facts about luck — the luck of native capacities, of upbringing, and, more awkwardly, the luck involved in being the sort of person who makes an effort at all — defeat desert claims, merely reduce their weight, or leave them untouched;

  whether desert is non-comparative, a matter of the fit between this person and this treatment, or essentially comparative, a matter of how competing claims rank against one another, so that a distribution can be undeserved even when every individual in it receives what they independently deserve;

  whether a reward can be deserved under an unjust rule, so that desert claims are inherited from defective institutions and can be blocked by them, or whether desert holds independently of the justice of the rule under which it is claimed;

  whether the currency of desert is fixed by the institution that assigns it — the place, the job, the prize — or whether there is a natural currency, such as well-being or respect, against which an institution can itself be found to have rewarded the wrong thing.

  There is one further phenomenon the tree has to handle, because it is what our group keeps circling. Call it the proxy ratchet. An institution that wants to select on a desert base usually cannot observe that base, so it selects on a proxy instead: examination results as a proxy for promise, publication counts as a proxy for scholarly contribution, teaching evaluations as a proxy for pedagogical care. After a generation or two the proxy ceases to be treated as evidence of the base and starts to be treated as a base in its own right: people say she earned her place by her score, or that he earned his chair by his citation record, and the credential acquires desert-like claims of its own. The ratchet resists reversal, because the credential now supports a claim of its own and because reversing it looks like confiscating something people already hold. Give the tree a node that separates views according to whether they treat this ratchet as corrupting — a mechanism that converts contingent institutional convenience into apparent desert — or as the ordinary and legitimate way in which an institution's rules come to define what counts as merit. Then require every leaf to say whether it can stop or reverse the ratchet, by what mechanism, or whether it has no complaint against it at all.

  I also want one placement question answered rather than ducked. Two members of the group think the real trouble with meritocratic selection is not that it misdescribes desert but that it legitimizes the hierarchy it produces, by making the position of the losers look deserved and thereby making the arrangement harder to contest. Is that a separate leaf, or an overlay that modifies several other leaves? Put it where you think it belongs, in the tree or alongside it, and say in one sentence what putting it there costs you.

  The leaves must include at least these positions, named where a name exists and marked unnamed where nobody defends them: desert as wholly institution-dependent; desert grounded in effort or trying; desert grounded in contribution or product; the view associated with Rawls on which the distribution of natural talents and of initial social position is itself morally arbitrary, so that no one can be said to deserve the traits from which their contributions flow; luck egalitarianism; a consequentialist or incentive-based defence of meritocratic institutions that treats desert talk as a useful fiction; and the critique of meritocracy as self-defeating. Add up to two further leaves if the logical space has occupied corners I have not listed. At each leaf give one sentence on its most awkward commitment, plus the verdicts it predicts on the four live items before the group: legacy preferences in admissions, dropping standardized tests, the weight given to seniority in promotion, and awards for effort as distinct from results. Write depends or split where a leaf genuinely does not settle an item, and do not manufacture a verdict to fill a cell.

  Build the tree from the logical space rather than from my list of names: work out which combinations of answers your questions allow, then locate the actual positions within that space, and note the combinations nobody occupies with a word on whether they are incoherent, unattractive, or merely unexplored. Flag any pair of leaves the tree cannot really separate. No citations, no bibliography, no suggested reading — my colleagues will not look anything up, and I do not want them to have to. Define each term of art in a parenthetical the first time you use it. Keep the whole thing to what fits on a two-page handout.
reasoning: |-
  Okay, the user is chairing a university working group on admissions and hiring, and they're stuck in circular debates. They need a decision tree to clarify each member's beliefs about merit and desert without using loaded terms. The tree must start from a shared premise—that allocations can't be arbitrary—and branch through nuanced distinctions they've identified. 

  First, I need to unpack their core distinctions. The desert-institution dependency is crucial: is desert independent of rules or defined by them? Then, bases for desert—effort, contribution, etc.—and luck's role. The comparative/non-comparative split and currency questions (well-being vs. institutional rewards) matter too. The proxy ratchet is key: when proxies like test scores become desert bases themselves. 

  The user also wants to handle the "legitimizing hierarchy" critique. That feels like an overlay—it could modify multiple leaves (e.g., Rawlsians or consequentialists might both acknowledge it) rather than being a standalone position. I'll attach it to relevant leaves with a cost: it might oversimplify by blending diagnostic and critical lenses.

  For the tree structure: Start with Q1 on desert's independence from institutions. A "no" leads directly to institution-dependent desert. A "yes" branches into bases (effort, contribution, etc.) via Q2. Then Q3 tackles luck—does it nullify, reduce, or ignore desert? Q4 asks if desert is comparative. Q5 checks if unjust rules block desert claims. Q6 probes the currency (institutional vs. natural). The proxy ratchet gets Q7: is it corrupting or legitimate? 

  Leaf positions: Institution-dependent desert, effort-based, contribution-based, Rawlsian arbitrariness, luck egalitarianism, consequentialist "useful fiction," and the self-defeating critique. Two additions: "Character-based desert" (from Q2) and "Non-comparative purism" (if someone rejects comparative desert entirely). 

  Each leaf's awkward commitments and policy verdicts must be concise. For example: Institution-dependent desert struggles to criticize legacy preferences; Rawlsians see standardized tests as arbitrary but might keep them for fairness. The "hierarchy critique" overlay warns that meritocracy entrenches inequality—attached to Rawlsian, consequentialist, and self-defeating leaves. 

  Logical gaps: A "luck-immune contribution" position (no one holds it—ignores how luck taints contributions). Also, "non-comparative natural currency" is rare (unexplored, as institutions dominate desert talk). 

  Tree execution: Phrase questions neutrally. Q1: "Can someone deserve a reward even if no institution exists to grant it?" Q7: "When test scores become treated as desert bases, is this a corruption or a legitimate evolution?" Final output fits two pages, terms defined inline (e.g., "luck egalitarianism").
answer: |-
  Here is a decision tree designed to diagnose underlying beliefs about merit and desert, starting from your shared commitment and branching through your specified distinctions. It identifies 9 distinct leaves, including all requested positions and two additions.

  **Shared Starting Point:** University places and academic jobs must not be allocated arbitrarily; reasons must be offered for who gets them.

  **Decision Tree:**

  1.  **Q1 (Desert-Independence):** Can someone *deserve* a university place/job independently of any institutional rule assigning rewards to traits/performances? (Or is "desert" only meaningful *within* such rules?)
      *   **No (Desert requires rules) → Leaf 1: Institution-Dependent Desert**
      *   **Yes (Desert is prior/independent) → Go to Q2.**

  2.  **Q2 (Desert-Basis):** What is the primary independent basis for deserving a place/job?
      *   **Trying/Effort:** Desert arises primarily from how hard someone tried, regardless of results. → **Leaf 2: Effort-Based Desert**
      *   **Contribution/Product:** Desert arises primarily from the value or quality of what someone produces or contributes. → **Go to Q3.**
      *   **Character/Virtue:** Desert arises primarily from the kind of person someone is (e.g., diligent, curious, honest). → **Leaf 7: Character-Based Desert** (Added Leaf)
      *   **None of the above / Bare Will:** Desert requires only the intentional exercise of choice/will. → (Unnamed/Unoccupied: Logically possible but seldom defended; awkwardly minimal)

  3.  **Q3 (Luck Impact):** Does the significant role of luck in shaping capacities, upbringing, or the disposition to try *undermine* desert claims based on contribution?
      *   **Yes, completely undermines:** Luck makes contribution-based desert claims incoherent or void. → **Leaf 4: Rawlsian Arbitrariness** (Distribution of talents/opportunities is morally arbitrary)
      *   **Yes, partially undermines/reduces weight:** Luck weakens desert claims but doesn't erase them entirely. → **Leaf 5: Luck Egalitarianism** (Focuses on neutralizing luck's effects on distribution)
      *   **No, leaves desert untouched:** Desert is based on the actual contribution, irrespective of how luck influenced the ability to contribute. → **Leaf 3: Contribution-Based Desert**

  4.  **Q4 (Comparative Nature):** Is desert fundamentally about the *fit* between a specific person and a specific reward (non-comparative), or is it inherently about *ranking* competing claims (comparative)?
      *   **Non-comparative:** What matters is whether *this* person deserves *this* reward based on their traits/actions. → **Go to Q5.**
      *   **Comparative:** Desert is relational; a distribution can be undeserved even if each person individually seems to fit their reward. → **Leaf 8: Non-Comparative Purism** (Added Leaf: Uncommon, focuses solely on individual fit, awkwardly ignores relative claims)

  5.  **Q5 (Rule Justice Blocking):** Can someone deserve a reward under an institutional rule that is itself unjust?
      *   **No:** An unjust rule blocks desert claims; you cannot genuinely deserve under defective rules. → **Go to Q6.**
      *   **Yes:** Desert based on meeting the rule's criteria holds independently of the rule's overall justice. → **Leaf 6: Consequentialist Fiction** (Desert talk is a useful fiction for incentives)

  6.  **Q6 (Currency of Desert):** What is the fundamental "good" that desert tracks? Is it fixed by the institution (e.g., the job itself, prestige) or is there a natural currency?
      *   **Institutional Currency:** The reward defined by the institution (the place, job, salary) is the relevant currency. → **Leaf 1: Institution-Dependent Desert** (Reached via different path)
      *   **Natural Currency:** Desert tracks a fundamental good like well-being, respect, or opportunity, against which institutional rewards can be judged. → **Leaf 9: Self-Defeating Critique** (Meritocracy legitimizes hierarchy)

  7.  **Q7 (Proxy Ratchet):** When institutional proxies (e.g., test scores, citations) become treated as direct bases of desert (the "ratchet"), is this:
      *   **Corrupting:** It illegitimately converts contingent measures into apparent desert, masking the true basis (effort, contribution) or institutional power. → **Verdict Applies to Leaves 2, 3, 4, 5, 7, 8** (All see desert as prior/institution-independent)
      *   **Legitimate Evolution:** This is how institutions naturally define what "merit" means within their context; the proxy becomes the valid desert-base. → **Verdict Applies to Leaves 1, 6** (Desert is institution-dependent or a fiction)

  **The Leaves:**

  1.  **Institution-Dependent Desert:** Desert only exists *within* institutional rules; "deserving X" means "qualifying for X under the current rules." No external desert basis exists to criticize the rules themselves.
      *   *Awkward Commitment:* Cannot fundamentally criticize any institutional reward rule (e.g., "highest bidder gets the place") as undeserving, only as imprudent/unjust/inefficient.
      *   Live Items: Legacy Prefs (Allowed, if rule); Std Tests (Depends on rules); Seniority (Valid base); Effort Awards (Valid, if rule).
      *   Proxy Ratchet: Legitimate Evolution. Cannot stop it; it *is* the process.

  2.  **Effort-Based Desert:** Desert is based primarily on the effort expended, regardless of outcome or luck-influenced capacity.
      *   *Awkward Commitment:* Must reward significant effort even if results are poor or harmful due to bad luck/capacity.
      *   Live Items: Legacy Prefs (Reject, effort unequal?); Std Tests (Reject, measure result not effort); Seniority (Split, may correlate with effort?); Effort Awards (Strong Yes).
      *   Proxy Ratchet: Corrupting. Stop by designing proxies tracking effort (hard), or emphasizing effort directly.

  3.  **Contribution-Based Desert (Luck-Immune):** Desert is based on the actual value of the contribution/product, irrespective of luck's role in enabling it.
      *   *Awkward Commitment:* Rewards those fortunate enough to have high capacities/opportunities significantly more, purely based on output.
      *   Live Items: Legacy Prefs (Reject, not contribution); Std Tests (Accept, proxy for contribution); Seniority (Reject, not current contribution); Effort Awards (Reject, no contribution).
      *   Proxy Ratchet: Corrupting. Stop by refining proxies to better track *true* contribution (e.g., quality over quantity).

  4.  **Rawlsian Arbitrariness:** The distribution of native talents and social starting points is morally arbitrary. No one deserves the traits enabling their contributions; desert cannot be the *fundamental* basis for distributing key goods.
      *   *Awkward Commitment:* Rejects pre-institutional desert entirely for major social goods; institutions should aim for fairness/benefit to least advantaged, not desert.
      *   Live Items: Legacy Prefs (Reject, arbitrary advantage); Std Tests (Reject, influenced by arbitrary advantages); Seniority (Split, may conflict with fairness?); Effort Awards (Reject, effort influenced by arbitrariness).
      *   Proxy Ratchet: Corrupting (masks arbitrariness). Stop via institutions designed for fairness, not desert-tracking.

  5.  **Luck Egalitarianism:** Desert claims matter, but are weakened by luck. Institutions should aim to neutralize the effects of bad brute luck (e.g., disability, poor upbringing) on distributions.
      *   *Awkward Commitment:* Requires complex judgments about luck's influence and potentially intrusive efforts to neutralize it.
      *   Live Items: Legacy Prefs (Reject, bad brute luck beneficiary); Std Tests (Reject/Accept? Depends if luck-neutralizing possible); Seniority (Reject, luck influences opportunity); Effort Awards (Accept, if effort reflects choice).
      *   Proxy Ratchet: Corrupting (proxies often amplify luck effects). Stop via luck-neutralizing adjustments to proxies/institutions.

  6.  **Consequentialist Fiction:** "Desert" talk is a useful social fiction to incentivize effort/contribution and justify distributions, but lacks independent moral weight. Institutions should reward proxies expected to produce the best outcomes.
      *   *Awkward Commitment:* Must sometimes reward/punish in ways that feel intuitively "undeserved" if best for incentives/outcomes.
      *   Live Items: Legacy Prefs (Accept, if improves donations/alumni engagement); Std Tests (Accept/Reject based on predictive validity); Seniority (Accept, if retains talent/reduces conflict); Effort Awards (Accept, if motivates effort).
      *   Proxy Ratchet: Legitimate Evolution. Proxies *are* the merit bases defined by outcome-oriented rules. No complaint; optimize proxies for outcomes.

  7.  **Character-Based Desert:** Desert arises primarily from virtuous character traits (e.g., diligence, curiosity, integrity) demonstrated over time.
      *   *Awkward Commitment:* Assessing "character" is subjective and risks bias; may reward perceived virtue over actual results/effort.
      *   Live Items: Legacy Prefs (Reject, not character-based); Std Tests (Reject, poor character proxy); Seniority (Accept, may indicate sustained virtue?); Effort Awards (Split, effort may indicate diligence).
      *   Proxy Ratchet: Corrupting (proxies ignore character). Stop by incorporating holistic character assessment (e.g., interviews, references).

  8.  **Non-Comparative Purism:** Desert is solely about the fit between an individual and a reward based on their traits/actions; comparisons are irrelevant. A distribution is just if each has what they individually deserve.
      *   *Awkward Commitment:* Cannot object to huge inequalities if each person individually "fits" their reward (e.g., genius deserves mansion, sloth deserves hovel).
      *   Live Items: Legacy Prefs (Reject, not desert basis); Std Tests (Accept, if individual fit); Seniority (Reject, not individual fit); Effort Awards (Accept, if individual fit).
      *   Proxy Ratchet: Corrupting (proxies may distort true individual fit). Stop by focusing assessment on true individual desert bases.

  9.  **Self-Defeating Critique:** Meritocratic institutions primarily legitimize hierarchy by making outcomes appear deserved, thereby obscuring underlying injustice/arbitrariness and hindering critique.
      *   *Awkward Commitment:* May struggle to justify *any* selection criteria without risking legitimization; focuses critique on effects, not internal desert logic.
      *   Live Items: Legacy Prefs (Reject, obvious injustice); Std Tests (Reject, masks injustice); Seniority (Reject, entrenches hierarchy); Effort Awards (Reject, legitimizes unequal outcomes).
      *   Proxy Ratchet: Inherently Corrupting/Core Mechanism. Reverse by de-emphasizing "desert" justifications and highlighting contingency/power.

  **Hierarchy Legitimization Critique:** This is an **overlay** modifying Leaves 4 (Rawlsian), 6 (Consequentialist), and 9 (Self-Defeating). It highlights a *consequence* of desert-talk within institutions (legitimizing hierarchy) rather than defining the core desert concept itself. Putting it here costs precision in diagnosing the *source* of the belief about desert, focusing instead on its perceived *effect*.

  **Inert Distinctions:**
  *   **"Whether a reward can be deserved under an unjust rule" (Q5)** did less work than expected. It primarily separated Leaf 6 (Consequentialist) from others on this path. Many positions (Leaves 1, 2, 3, 7, 8) find the question ambiguous or answer "no" for different reasons.
  *   **"Bare exercise of the will"** as a desert basis (Q2 option) was logically possible but unnamed and unoccupied.

  **Unseparated Pairs:** The tree struggles to perfectly separate **Leaf 1 (Institution-Dependent)** reached via Q1/Q6 from **Leaf 1** reached via Q1 alone. However, the path taken reveals different nuances about the role of a "natural currency."

  **Logical Gaps:** The main unoccupied space is:
  *   **"Luck-Immune Contribution + Natural Currency + Non-Comparative" (Q3 "No" → Q4 "Non-Comparative" → Q5 "Yes" → Q6 "Natural Currency"):** Combines strong contribution-desert immune to luck, non-comparative focus, and a natural currency. Perhaps unexplored or collapsed into Leaf 3. Awkward: Needs to define the "natural currency" deserved for contributions.
