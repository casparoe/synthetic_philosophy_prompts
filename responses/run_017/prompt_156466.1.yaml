prompt: |-
  I host a tiny podcast on logic and its discontents, and next week's guest is a philosopher who's built a reputation on defending the Tortoise: her line is that Carroll's regress is sound -- you can stack up premises forever and none of them will compel anyone to infer anything -- and that what actually closes the gap between premises and conclusion isn't another premise but a capacity, a kind of inference-readiness that isn't propositional at all. She calls the corollary non-exportability: an argument for modus ponens that itself uses modus ponens can be a perfectly good justification even though it can't convince anyone who lacks the capacity.

  Draft me seven or eight questions that make her work for it instead of restating the view. I want one on whether her "capacity" is really any different from just being disposed to blurt out the conclusion; I expect she'll say the capacity is normative, that someone who has it can cite the rule as her reason, so give me the follow-up asking whether that citation is just the Tortoise's demanded premise wearing a disposition costume. I want one on why the self-support move doesn't hand out blanket immunity to bad rules -- the same shape of argument looks like it protects affirming the consequent, or even Prior's made-up connective tonk -- with a follow-up keyed to her likeliest answer that tonk has no coherent semantics, pushing on whether that answer smuggles in a prior logic. One on whether any of this is about deduction specifically or about reasons generally, and one (with follow-up) on whether a community trained on a non-classical logic would be just as justified, i.e. whether this quietly becomes relativism about logic. Fill the rest with whatever you think are the weakest joints, and skip the biographical stuff entirely.
reasoning: |-
  Okay, the user hosts a logic podcast and needs challenging questions for a guest philosopher defending Carroll's Tortoise regress. The guest argues inference relies on non-propositional capacities rather than infinite premises. 

  Hmm, the user clearly knows this material deeply - they're using terms like "non-exportability" and "tonk" casually. Their frustration with soft interviews shows; they want bloodsport questions that pressure-test the theory's weak spots. Smart framing too - they've already anticipated the guest's likely rebuttals and want follow-ups ready.

  Let me unpack their attack points: First, they want the "capacity" notion grilled - is it just disguised disposition? Second, the self-support problem: why doesn't this justify tonk? Third, the relativism risk: does this make logic community-dependent? Fourth, whether this is really about deduction or all reasoning. 

  *scratches head* The tricky part is avoiding gotcha questions while still applying maximum pressure. For the capacity objection, we need to force her to distinguish normative governance from mere compulsion. For tonk, we must block the easy "tonk lacks semantics" dodge by questioning where semantics come from. The relativism angle needs careful handling - maybe contrast justification vs correctness?

  *checks notes* User mentioned Prior's tonk specifically - good, that's concrete. We should also probe whether "inference-readiness" varies by logical system. And maybe sneak in a Carnap question about conventionalism via the backdoor. 

  Most importantly, every initial question needs a poisoned-tail follow-up. Like when she inevitably says tonk isn't coherent, immediately ask whether "coherent" presupposes classical logic. That's the knife-twist they want. 

  *adjusts glasses* Final thought: The user's "disposition costume" line is gold - that should be verbatim in the follow-up. This guest won't know what hit her.
answer: |-
  Here are 7 hard-hitting questions (+ embedded follow-ups) targeting the core tensions in her view, designed to push beyond exposition:

  1.  **The "Capacity" - Action vs. Norm:** You characterize the gap-closer as a non-propositional "capacity" for inference-readiness, distinct from a disposition to blurt out conclusions, precisely because it's *normative* – the agent cites the rule *as their reason*. But isn't this "citing the rule" functionally identical to the Tortoise internally *asserting the very conditional premise they demand* ("If P and P→Q, then Q")? How is your "capacity" *doing normative work* beyond just being the disposition to internally affirm that missing premise when prompted? ***(Follow-up: If the capacity *manifests* as accepting that proposition when reflecting on one's reasoning, haven't you just relocated the Tortoise's premise into the psychology of the capacious reasoner, making it a dispositional *belief* rather than a truly non-propositional ground?)***

  2.  **Immunity for Bad Rules & Tonk's Test:** Your self-support move – using MP to justify MP – seems to grant immunity to *any* basic inference rule, however flawed. Consider Prior's tonk (with rules: P ∴ P-tonk-Q; P-tonk-Q ∴ Q). Couldn't a "tonk-capacitous" reasoner run the *same* self-support argument: "Assume P and P-tonk-Q; by my tonk-capacity, I infer Q. Therefore, tonk is valid!" Why doesn't your framework protect tonk just as well as MP? ***(Follow-up: When you (likely) say tonk has "no coherent semantics" or leads to triviality, doesn't that judgment *itself* rely on prior logical principles (like non-contradiction or consequence preservation) that your view claims are grounded *only* in capacity? Aren't you smuggling in the very logic you're trying to ground to dismiss tonk?)***

  3.  **The Relativism Gambit:** If logical justification rests ultimately on non-propositional capacities cultivated within a community, couldn't a community trained on, say, a robust relevance logic or intuitionistic logic develop the "capacity" for *modus ponens* denial or rejection of double negation elimination? Would their basic inferences be *just as justified* within their framework as ours are within classical logic? ***(Follow-up: If "yes," doesn't this collapse into full-blooded relativism about logical truth/rules? If "no," what constrains the possible capacities besides successful social training, and doesn't *that* constraint imply an external standard your view rejects?)***

  4.  **Beyond Deduction - The General Reason Trap:** Is your account *specifically* about closing the gap in *deductive* inference (like MP), or is it a general theory about how *any* set of premises (factual, moral, prudential) compels a conclusion? If it's specific to deduction, why the asymmetry? If it's general, how does your "capacity" explain the difference between being *logically compelled* and simply finding a set of reasons *sufficiently persuasive*? Doesn't blurring this distinction undermine the special force of deduction?

  5.  **The Regress Revisited - Capacity or Infinite Stack?** The Tortoise demands a *premise* to license the inference. You offer a *capacity*. But isn't the capacity itself vulnerable to a *new* Tortoise regress? Tortoise 2.0: "I accept P, I accept P→Q, and I grant you *have* this 'MP-capacity'... but why should *having that capacity* compel *me* to accept Q? I demand a premise linking *your possession of the capacity* to the *correctness* of inferring Q!" Doesn't replacing the rule-premise with a capacity-premise just kick the regress up a meta-level without truly stopping it?

  6.  **Carnap's Shadow - Rules vs. Conventions:** Your view seems to echo Carnap's principle of tolerance: logical rules are chosen conventions, justified by their usefulness within a linguistic framework, not by correspondence to some external logical reality. How is your "capacity" fundamentally different from Carnap's "linguistic framework + practical adoption"? If the capacity is normative and tracks correctness (unlike mere convention), what *is* the source of this normativity if not something propositional or external?

  7.  **The Explanatory Burden - What Does the Capacity *Explain*?** If the capacity is truly primitive and non-propositional, what explanatory work does it actually *do* beyond labeling the phenomenon ("people *can* infer")? How does positing it help us *understand* logical compulsion better than: a) accepting a brute normative fact (like the validity of MP), or b) accepting a psychological fact (like our disposition), or c) accepting that the rule *is* implicitly understood? What problem does the "capacity" solve that these alternatives don't?

  **Key Angles Covered:**
  *   **Reduction Challenge:** Is the capacity just a disguised disposition/belief? (Q1)
  *   **Self-Support Problem:** Immunity for bad rules (Tonk!) (Q2 & F-U)
  *   **Relativism Risk:** Justification vs. Community Practice (Q3 & F-U)
  *   **Scope Creep:** Deduction-specific or general reasons? (Q4)
  *   **Regress Resilience:** Does it *really* stop the regress? (Q5)
  *   **Historical Parallels:** Carnap & Conventionalism (Q6)
  *   **Explanatory Power:** What does the concept *do*? (Q7)

  These force her to defend the *distinctiveness*, *normative force*, *limits*, and *explanatory value* of her core concept against tough counterexamples and potential reductions, without letting her simply restate the position. Good luck with the interview – it sounds fascinating!
