  **Worked Path to a Leaf: Neo-Aristotelian Naturalism**  
  - Start at Node 1: Probe 1 (bread knife) is valid → Yes.  
  - Node 2: Probe 3 (train) is valid → Yes.  
  - Node 3: Probe 2 (promise) is valid → Yes.  
  - Node 4: Probe 4 (parental) is valid → Yes.  
  - Leaf: Neo-Aristotelian naturalism (norms derive from biological life-form standards).

  This tree provides a clear, case-based framework for students to explore metaethical positions without prior expertise, using the probes to ground abstract distinctions in concrete examples. The shared commitment ensures a common starting point, and the constraints are met.
