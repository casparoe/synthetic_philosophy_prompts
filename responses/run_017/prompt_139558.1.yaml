     - Reaches: Node 1 (tests functional evaluation).  
     - Treated as: Valid at Node 1Y (functional norms derivable), invalid at Node 1N (not derivable).  
     - Why: Functional evaluations are seen as derivable if norms are grounded in design standards.

  2. **Probe 2 (Promise)**  
     - Reaches: Node 3 (tests institutional ought).  
     - Treated as: Valid at Node 3Y (institutional norms derivable), invalid at Node 3N (not derivable without additional premises).  
     - Why: Institutional facts (e.g., promising) are treated as partly normative at Node 3Y.

  3. **Probe 3 (Train)**  
     - Reaches: Node 2 (tests instrumental ought).  
     - Treated as: Valid at Node 2Y (instrumental "oughts" derivable), invalid at Node 2N (not derivable).  
     - Why: Instrumental "oughts" are relative to desires; at Node 2Y, they are derivable from descriptive means-end facts.

  4. **Probe 4 (Parental)**  
     - Reaches: Node 4 (tests biological ought).  
     - Treated as: Valid at Node 4Y (biological norms derivable), invalid at Node 4N (not derivable without reduction).  
     - Why: Biological "oughts" derive from life-form standards only at Node 4Y.

  5. **Probe 5 (Testimony)**  
     - Reaches: Node 5 (tests societal ought).  
     - Treated as: Valid at Node 5Y (societal norms derivable), invalid at Node 5N (not derivable).  
     - Why: Societal "oughts" are treated as derivable from functional/societal facts at Node 5Y.

  6. **Probe 6 (Suffering)**  
     - Reaches: Node 8 (tests moral derivation).  
     - Treated as: Valid at Node 8Y (if derivable under some views), invalid at Node 8N (if normative properties don't exist).  
     - Why: Suffering-based wrongness is a test case for whether moral properties are derivable from natural facts.

  ### Empty Cell and Unsorted Pairs
  - **Empty cell**: The leaf at path 1N, 7Y, 8Y, 10Y is vacant because it is incoherent—normative properties cannot be both natural (derivable) and underivable from descriptive premises.
  - **Unsorted pairs**:  
    1. **Quasi-realist expressivism and non-cognitivist projectivism**: The tree separates these at Node 9 (mimicking truth-apt discourse), but a further question—"Can normative judgments be objectively correct?"—would distinguish them more sharply. This is unsuitable for a short exercise because it requires nuanced understanding of truth-aptness and expressivist semantics, which is too abstract for a 10-minute discussion.  
    2. **Reductive naturalism and institutional/functional normativity**: The tree separates these (reductive at Node 4N, institutional at Node 3Y), but a further question—"Are normative truths grounded in conceptual analysis or social practices?"—would clarify. This is unsuitable because it relies on subtle distinctions between analyticity and practice-based normativity, which are too technical for a brief exercise.

  ### Routing Table
  For each leaf, the path is given as a sequence of node answers (e.g., 1Y = "yes" at Node 1). A worked path to "Neo-Aristotelian naturalism" is included.

