  Below is a diagnostic decision tree designed to sort metaethical positions based on how they handle the derivation of normative conclusions from descriptive premises. The tree disentangles Hume's is-ought gap, Moore's naturalistic fallacy, and the open-question argument as distinct concerns. It begins from the shared commitment that "torturing a child for amusement is wrong" and uses case-based or logical questions to avoid self-classification or direct metaphysical inquiries. The tree has 10 nodes and 11 leaves (including one empty leaf), covering the required positions. Each leaf is defined by a pattern of answers, and the tree is tested against the six probe derivations provided.

  ### Decision Tree
  The tree is structured as follows. Answer each question based on your assessment of the logic or cases, not on prior metaethical knowledge. For derivations, "valid" means the conclusion follows logically from the premises; "valid enthymeme" means it is valid only with an implicit normative premise; "invalid" means it does not follow, even with implicit premises.

  1. **Node 1: Functional Evaluation (Probe 1)**  
     Consider Probe 1: "This blade was designed and marketed for slicing bread; it shreds the crumb. Therefore it is a bad bread knife." Is this derivation valid?  
     - **Yes** (functional norms are derivable) → Node 2  
     - **No** (functional norms are not derivable) → Node 7  

  2. **Node 2: Instrumental Ought (Probe 3)**  
     Consider Probe 3: "Viren wants to be in Leeds by six; the last train that arrives before then departs at four. Therefore he should take the four o'clock train." Is this derivation valid?  
     - **Yes** (instrumental "oughts" are derivable) → Node 3  
     - **No** (instrumental "oughts" are not derivable) → Node 7  

  3. **Node 3: Institutional Ought (Probe 2)**  
     Consider Probe 2: "Amara said the words 'I promise to pay you Friday' in a setting where promising is an established practice. Therefore she ought to pay you on Friday, other things being equal." Is this derivation valid?  
     - **Yes** (institutional "oughts" are derivable) → Node 4  
     - **No** (institutional "oughts" are not derivable) → Node 5  

  4. **Node 4: Biological Ought (Probe 4)**  
     Consider Probe 4: "Human offspring are born helpless, acquire language only from sustained interaction, and fare badly without years of care from adults. Therefore parents ought to care for their infants." Is this derivation valid?  
     - **Yes** (biological "oughts" are derivable) → **Neo-Aristotelian naturalism**  
     - **No** (biological "oughts" are not derivable) → **Reductive or analytic ethical naturalism**  

  5. **Node 5: Societal Ought (Probe 5)**  
     Consider Probe 5: "No society could persist in which sworn testimony carried no expectation of truthfulness, and every known society has some such expectation. Therefore one ought not to lie under oath." Is this derivation valid?  
     - **Yes** (societal "oughts" are derivable) → **Non-reductive (synthetic, a posteriori) ethical naturalism**  
     - **No** (societal "oughts" are not derivable) → Node 6  

  6. **Node 6: Categorical vs. Relative Ought (based on Probes 2, 3, 6)**  
     In Probe 3 (train case), the "ought" depends on Viren's desire. In Probe 2 (promise case), if the "ought" does not depend on the agent's desires, could it still be valid?  
     - **Yes** (some "oughts" are categorical) → **Constructivism (categorical)**  
     - **No** (all "oughts" are relative to desires or standpoints) → **Constructivism (relative)**  

  7. **Node 7: Truth-Aptness of Normative Claims (based on shared commitment)**  
     Consider the statement "torturing a child for amusement is wrong." Is this claim truth-apt (i.e., capable of being true or false)?  
     - **Yes** (normative claims are truth-apt) → Node 8  
     - **No** (normative claims are not truth-apt) → Node 9  

  8. **Node 8: Normative Properties and Derivation (Probe 6)**  
     Consider Probe 6: "This procedure would inflict prolonged conscious suffering on a being that has done nothing and will receive no compensating benefit, and no one desires it for its own sake. Therefore it is wrong to perform it." Could this derivation ever be valid under some views?  
     - **Yes** (normative properties exist and might be derivable) → Node 10  
     - **No** (normative properties do not exist) → **Error theory**  

  9. **Node 9: Mimicking Truth in Discourse (based on Probes 1–6)**  
     Even if normative claims aren't truth-apt, can we reason about them as if they were (e.g., using truth predicates, logical operators, or objective-seeming language)?  
     - **Yes** (discourse mimics truth-aptness) → **Quasi-realist expressivism**  
     - **No** (discourse does not mimic truth-aptness) → **Non-cognitivist projectivism**  

  10. **Node 10: Naturalness of Normative Properties (Probe 6)**  
      If normative properties exist, are they identical to or constituted by descriptive properties (e.g., suffering in Probe 6)?  
      - **Yes** (normative properties are natural) → **Empty leaf (incoherent)**  
      - **No** (normative properties are non-natural) → **Moorean non-naturalism**  

