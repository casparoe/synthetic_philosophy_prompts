  My metaphysics supervisor has been handing down verdicts on disposition cases all term and I want to guess wether she'll land on one I made up. Hers so far: an untouched crystal goblet — fragile; the classic fink (a spell strips the goblet's brittle microstructure the instant anything strikes it) — still fragile; a mimic (a rubber ball rigged with a tiny charge so it shatters when struck, without being brittle at all) — not fragile, even though it does shatter; the reverse-cycle wire, dead but going live the moment you touch it — not disposed to conduct, even though you'd get shocked; a match in a vacuum — flammable. Mine: the same goblet, except it's sat since manufacture in a vat of gel that soaks up any blow, so no hard strike ever reaches it; lift it out and it shatters like any other goblet. Plus a variant: same setup, except the gel is inert until it senses an incoming blow and then hardens. What's she likely to say about each one, what rule is she implicitly running, what other rule fits her five verdicts just as well, and which further case would seperate the options? I keep telling myself the vat is only a missing background condition, like the vacuum match, and not a mask at all — tell me if that's an actual argument or just me restating her verdicts in different words. And say how confident you are in what you claim, and which bit you're least sure of.
