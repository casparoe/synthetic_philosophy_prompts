  ### **"Which Account of Human Nature Do You Hold?" Quiz**  
  *(10 questions, to be answered before readings)*  

  1. **Repertoire**: When you see a toddler near a cliff edge, do you feel an immediate urge to rush and protect them, even if you’ve never been taught to do so? (Yes/No)  
  2. **Repertoire**: When you accidentally offend a friend, do you feel a spontaneous pang of guilt before anyone points it out? (Yes/No)  
  3. **Trajectory**: In a community where food is plentiful and generosity is common, does conflict become widespread and severe if a famine eliminates the surplus? (Yes/No)  
  4. **Trajectory**: If children are raised with basic care but no explicit moral instruction, do they naturally grow into considerate, respectful adults? (Yes/No)  
  5. **Source**: Is the practice of honoring elders rooted in a natural feeling (like affection for parents), or is it solely a learned rule from tradition? (Natural/Learned)  
  6. **Source**: Can rituals demanding self-sacrifice (e.g., donating to strangers) be justified only by appeals to self-interest (e.g., "it ensures help in return")? (Yes/No)  
  7. **Repertoire**: Do people instinctively know to thank someone who helps them, without being taught? (Yes/No)  
  8. **Source**: If society had no propriety rules, could exceptional individuals invent them using only innate human traits (not divine guidance or tradition)? (Yes/No)  
  9. **Trajectory**: A child who once shared toys freely grows into an adult who hoards resources. Is this mainly due to neglect of innate goodness, or proof that selfishness is natural? (Neglect/Proof)  
  10. **Repertoire**: Can humans create moral rules without any "raw material" for goodness in their nature? (Yes/No)  

  ---

  ### **Scoring Key**  
  *(Based on branching logic in the debate's logical space)*  

  #### **Logical Space Branches**  
  1. **Repertoire (R)**: Does the unlearned human repertoire contain moral inclinations (e.g., compassion, guilt)?  
     - **R+**: Yes (moral inclinations present).  
     - **R-**: No (only non-moral drives, e.g., self-interest).  
     - **R0**: Neutral (raw material with no moral/non-moral bias).  

  2. **Trajectory (T)**: With ordinary cultivation (e.g., basic care), does the repertoire tend toward social order?  
     - **T+**: Yes (order is the default tendency).  
     - **T-**: No (disorder is the default tendency).  
     - **T0**: No inherent tendency (depends on shaping).  

  3. **Source (S)**: Where does ritual/propriety derive authority?  
     - **S+**: Internal (grounded in innate human traits).  
     - **S-**: External (artifice of sages/outsiders).  
     - **S0**: Other (e.g., divine, pragmatic).  

  #### **Positions in Logical Space**  
  | Leaf (R-T-S)            | Position                                      | Occupied?          |  
  |--------------------------|-----------------------------------------------|--------------------|  
  | R+ T+ S+                 | **Mencius (incipient-tendency reading)**      | Yes                |  
  | R+ T+ S-                 | Unnamed                                       | No (incoherent)    |  
  | R+ T- S+                 | **Mencius (full-disposition reading)**        | Yes                |  
  | R+ T- S-                 | Unnamed                                       | No (incoherent)    |  
  | R+ T0 S+                 | Unnamed                                       | No (unexplored)    |  
  | **R- T- S-**             | **Xunzi (thin-nature reading)**               | Yes                |  
  | **R- T- S+**             | **Xunzi (substantive-psychology reading)**    | Yes                |  
  | R- T- S0                 | Unnamed                                       | No (unattractive)  |  
  | R- T+ S+                 | Unnamed                                       | No (incoherent)    |  
  | R- T+ S-                 | Unnamed                                       | No (incoherent)    |  
  | R- T0 S-                 | Unnamed                                       | No (unexplored)    |  
  | **R0 T0 S-**             | **Gaozi (indifferent-nature view)**           | Yes                |  
  | R0 T+ S-                 | Unnamed                                       | No (unexplored)    |  
  | **R0 T- S-**             | **Malleable-nature view**                     | Yes                |  
  | **Mixed R-T-S**          | **Innate-variation view**                     | Yes                |  

  #### **Diagnosis of Unnamed Leaves**  
  - **Incoherent (e.g., R+ T+ S-)**: Moral inclinations exist and tend toward order, but ritual’s authority is external—contradicts internal moral capacity.  
  - **Unattractive (e.g., R- T- S0)**: Ritual’s authority comes from "other" (e.g., divine force), but with no grounding in human traits, it is arbitrary and unpersuasive.  
  - **Unexplored (e.g., R0 T+ S-)**: Neutral repertoire tending toward order without ritual—possible but undefended historically.  

  #### **Indistinguishable Pairs**  
  - **Mencius (incipient) vs. Mencius (full-disposition)** (R+ T+ S+ vs. R+ T- S+):  
    - Both agree on R+ and S+ but differ on trajectory (T+ vs. T-).  
    - **Separator**: Q9 (trajectory). Answer "Neglect" → T- (full-disposition); "Proof" → not Mencius.  
  - **Xunzi (thin) vs. Xunzi (substantive)** (R- T- S- vs. R- T- S+):  
    - Both agree on R- and T- but differ on source (S- vs. S+).  
    - **Separator**: Q8 (source). Answer "No" → S- (thin); "Yes" → S+ (substantive).  

  #### **Mapping Quiz Answers to Leaves**  
  1. **R+** (Moral inclinations present): Majority "Yes" on Q1, Q2, Q7.  
  2. **R-** (No moral inclinations): Majority "No" on Q1, Q2, Q7.  
  3. **R0** (Neutral): Mixed/neutral answers on Q1, Q2, Q7.  
  4. **T+** (Tends to order): "No" on Q3, "Yes" on Q4.  
  5. **T-** (Tends to disorder): "Yes" on Q3, "No" on Q4.  
  6. **T0** (No tendency): "No" on Q3 and Q4, or "Proof" on Q9.  
  7. **S+** (Internal source): "Natural" on Q5, "No" on Q6, "Yes" on Q8.  
  8. **S-** (External source): "Learned" on Q5, "Yes" on Q6, "No" on Q8.  
  9. **Innate-variation**: Mixed R/T/S answers across questions.  

  **Scoring Steps**:  
  1. Tally answers for R (Q1, Q2, Q7), T (Q3, Q4, Q9), S (Q5, Q6, Q8).  
  2. Q10 is a distractor (tests consistency; "No" aligns with R-/R0).  
  3. Assign leaf based on majority R/T/S.  
  4. Use separators (Q8/Q9) to resolve ambiguous positions.  

  ---

  ### **Verdict on Your Hypothesis**  
  **Hypothesis**: "Mencius and Xunzi don’t contradict; they use 'nature' differently: Mencius for our best end, Xunzi for the raw repertoire. The heat is about semantics."  

  **Verdict**: **Mostly wrong**.  
  **Reason**: The tree shows a load-bearing distinction in **trajectory (T)**, not just semantics.  
  - **Mencius** (R+ T± S+) insists the repertoire *tends toward order* (T+) or, minimally, *can be ruined if neglected* (T-), but ritual’s authority is *always internal* (S+).  
  - **Xunzi** (R- T- S±) denies moral inclinations exist (R-) and insists the repertoire *tends toward disorder* (T-), but splits on whether ritual’s source is external (S-) or internal (S+, via cognitive capacity).  
  - **Key clash**: Trajectory (T) forces a substantive divide. Xunzi’s T- requires ritual to *correct* nature; Mencius’ T± sees ritual as *cultivating* innate goodness. This isn’t semantic—it shapes education, governance, and moral responsibility.  

  **Note on Glosses**:  
  - *Repertoire (性, xìng)*: Confident—refers to unlearned, spontaneous traits.  
  - *Artifice (伪, wěi)*: Confident—deliberate training/ritual, not innate.  
  - *Propriety (礼, lǐ)*: Confident—norms of respectful conduct.
