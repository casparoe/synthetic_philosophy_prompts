  ### **Notes on the Calibration Problem**  
  *(You asked for a lab-minded take on comparing welfare/capabilities across people.)*  

  **The Problem**:  
  - **Welfare metrics** require a common "zero" (e.g., what counts as "neutral" happiness) and "unit" (e.g., how to scale one person’s joy against another’s).  
  - **Capability metrics** require weighting (e.g., how much "mobility" is worth vs. "education").  

  **Which Views Struggle?**  
  - **Welfarism**: Calibration is *fatal*. There’s no objective way to compare happiness across minds. (Is a gourmet’s joy "larger" than a gardener’s?). Lab analogy: Using two thermometers with different zeros/units and no conversion formula.  
  - **Capabilities**: Calibration is *manageable but messy*. We *can* agree on core capabilities (e.g., health, mobility) but weighting is political. Lab analogy: Comparing pH and pressure readings—possible with context, but no universal scale.  
  - **Resourcism**: Calibration is *easiest*. Resources (e.g., dollars, rights) are intersubjectively measurable. Lab analogy: Using calibrated pipettes—readings are comparable if instruments are standardized.  

  **The "Standard Move" (and Why It’s Hand-Wavy)**:  
  Proponents of welfare/capabilities often retreat to **public reason**: Use democratic debate to set zeros/weights (e.g., "neutral welfare" = no chronic pain; "capability weight" = voting > luxury).  
  - **Lab Critique**: This replaces calibration with consensus. It’s like defining a "standard meter" by vote—useful for policy but not objective. Resourcism avoids this by anchoring in observable resources.  

  **Conclusion**:  
  The calibration problem undermines welfare-based views most severely. Capabilities can be defended pragmatically (we *do* make rough comparisons), but resourcism is the most "lab-compatible."  

