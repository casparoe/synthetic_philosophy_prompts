answer: |-
  The phrase "extraordinary claims require extraordinary evidence" is often misapplied as a conversation-ender. Here's a precise breakdown of its interpretations in your context, with evaluations:

  ### 1. **Bayesian Prior Interpretation**  
     - **Thesis**: Extraordinary claims imply an extremely low prior probability (e.g., Pr(H₁) << 0.5). Thus, even moderate evidence (like BF=3) may be insufficient to make the posterior credible.  
     - **Evaluation**: **Defensible, but redundant here**.  
       - *Why*: Your analysis *already used a deliberately skeptical prior*. A BF=3 *against that prior* means the evidence modestly favors the effect *despite* strong initial skepticism. If the critic demands an *even lower prior*, they must justify why the preregistered multi-lab design and existing literature don't warrant the prior you chose. "Extraordinary" adds nothing beyond prior specification.  

  ### 2. **Frequentist Alpha Threshold Interpretation**  
     - **Thesis**: For "extraordinary" claims, we should lower α (e.g., to 0.01 or 0.001) to avoid false positives. Thus, p=.04 is inadequate.  
     - **Evaluation**: **Defensible but arbitrary without criteria**.  
       - *Why*: If "extraordinary" means "likely false," lowering α reduces false positives. However:  
         - Your study was **preregistered and multi-lab**, mitigating p-hacking concerns.  
         - α=0.05 is arbitrary; no objective rule defines when to lower it.  
         - This ignores the Bayes factor and effect direction.  
       - **Discounting result?** Only if α is redefined post-hoc.  

  ### 3. **Decision-Theoretic/Loss Function Interpretation**  
     - **Thesis**: The cost of a false positive (believing a nonexistent effect) is much higher than a false negative for "extraordinary" claims. Thus, require stronger evidence.  
     - **Evaluation**: **Defensible, but context-dependent**.  
       - *Why*: In social priming, false positives could waste resources or enable dubious applications. But:  
         - Your claim was explicitly modest ("move us at least a little").  
         - The critic must show why the cost asymmetry *in this specific case* warrants ignoring BF=3 and p=.04.  
       - **Discounting result?** Only if costs justify ignoring weak evidence.  

  ### 4. **Replication Reliability Interpretation**  
     - **Thesis**: Extraordinary claims require multiple converging replications before being taken seriously. A single p=.04 result is fragile.  
     - **Evaluation**: **Defensible, but inapplicable here**.  
       - *Why*: This *was* a large-scale, preregistered **multi-lab replication** – the gold standard for reliability. Demanding *even more* replication before updating beliefs is circular.  
       - **Discounting result?** No – this study *is* the extraordinary evidence.  

  ### 5. **Journal/Publication Policy Interpretation**  
     - **Thesis**: Journals should require stronger evidence for surprising claims to maintain credibility.  
     - **Evaluation**: **Defensible as policy, but irrelevant to belief updating**.  
       - *Why*: This addresses *communication*, not *truth*. Your point was about shifting subjective confidence, not demanding publication or policy change.  

  ### 6. **Confused/"Dangerous Novelty" Interpretation**  
     - **Thesis**: Claims challenging established paradigms are "extraordinary" and should be resisted without perfect evidence.  
     - **Evaluation**: **Confused and unscientific**.  
       - *Why*: This confuses *surprise* with *implausibility*. Science advances by updating on evidence, not protecting status quo. Your evidence was credible and relevant.  

  ---

  ### Key Conclusions:  
  - **"Extraordinary" does no work beyond a skeptical prior** in Bayesian terms. Your analysis already *incorporated* skepticism – the critic needs to engage with your prior or specify theirs.  
  - **When the result should be discounted**:  
    - Only under Interpretation #2 (lower α) or #3 (asymmetric costs), but both require justification *specific to this claim*.  
    - Not under #1 (Bayesian), as your prior already addressed "extraordinariness."  
  - **Why the critic is likely wrong**:  
    - They dismissed a **preregistered, multi-lab replication** with converging evidence (p=.04 + BF=3) that aligns with the original claim.  
    - Their stance implies **unfalsifiability**: If even high-quality replication isn't sufficient, what would be?  
  - **Effective response**:  
    > "The Bayes factor *explicitly* accounts for prior skepticism – we set a skeptical prior and got BF=3 *against it*. If you think the prior should be *even lower*, justify why. Otherwise, we must update modestly. Demanding ‘extraordinary evidence’ beyond preregistered replications is unscientific."  

  **Bottom line**: The phrase is often a rhetorical shield. Your evidence *does* warrant a small belief update. The burden is now on the critic to quantify their skepticism or concede.
