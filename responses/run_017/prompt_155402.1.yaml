   - Etiological: The system was selected for detecting objects, and it does so in the shift, so S represents objectness.

   But then the etiological view and causal-role view agree, and the reader view disagrees. And the distribution shift doesn't break the etiological view because the system still works.

   We wanted the etiological view to be challenged, but in this case it isn't.

   So we need the network to fail in the shift for the etiological view to say one thing and the causal-role to say another.

   Let's go back to the first image scenario and accept that the motion head fails in the shift, but the species head uses the motion feature. Then the etiological view might say that the representation in S is of the training proxies, but the causal-role view says it is of motion.

   So for the image scenario with two heads, where the motion head fails in the shift but the species head still uses the motion feature in S for species classification.

   Then:

   - Reader: decoding F (motion) from S with a simple readout fails in the shift.
   - Causal-role: when we patch S between images differing in motion, the species head output changes in a motion-appropriate way (e.g., from a non-flying bird to a flying bird classification).
   - Etiological: the system was selected for tracking motion only in the service of the motion head, which fails in the shift, so S does not represent motion in the shift. Or it might say that the representation is of the training proxies.

   This can work.

   So the case paragraph:

   We train a CNN on a dataset of animal images with two tasks: species classification and motion prediction (whether the animal is in motion). The motion head is a linear layer on the shared feature map S. During training, motion is highly correlated with motion blur. In distribution shift, we test on images where motion blur is digitally removed from motion images and added to static images. The motion head fails because it relied on blur. However, a nonlinear probe can still decode motion from S in the shift. For causal evidence, we activation-patch S from a motion-without-blur image into a static image: the species classification changes to a class that is typically in motion (e.g., from " perched bird" to "flying bird"). Ablating S removes both species and motion classification. The shared layer S thus carries motion information that the species head uses, even though the motion head does not. 

   The three views:

   - Reader view: Since no simple readout can decode motion from S in the shift, S does not represent motion.
   - Consumer view: Since interventions on S affect the species head in a motion-appropriate way, S does represent motion.
   - Etiological view: The system was selected for tracking motion via the motion head, which fails in the shift, so in the shift, S does not represent motion. However, the causal evidence shows it is used as motion by the species head, so this view is challenged.

   The key feature that makes the case work: the species head uses the motion feature nonlinearly, while the motion head (a linear readout) fails to use it in the shift.

   If the motion head were nonlinear and could be retrained, then it might work, but in our case, it's fixed as linear.

   What if the nonlinear probe were small? Then the reader view might say that it's still a readout. So we require a heavy nonlinear probe to stress that the representation is not easily readable.

   The obvious objection: the species head is itself a decoder for motion (via its effect on species classification). So doesn't that mean there is a readout? But the reader view requires a *simple* readout. The species head is not a readout for motion; it's a classifier for species that happens to use motion. Moreover, it's part of the network, so it's a consumer, not an external readout. The reader view typically allows internal consumers to count as readers? Not necessarily: the reader view is about whether the representation is explicit and easily readable. The species head is doing a lot of computation and is not probing for motion per se.

   Reply to the objection: the downstream consumer (species head) can be seen as a decoder, but it is not a *simple* decoder. The reader view's operational test is simplicity. If they allow any downstream computation as a readout, then every representation would count, and the view would collapse into functional role. So they must require simplicity. In this case, the species head is not a simple readout for motion; it's a complex computation for species that uses motion as one input among many.

   Strongest attack from decoding view: Your causal intervention (patching) is itself a readout! You are reading out the effect on the species head and inferring that it must be because of motion. But maybe the state you patched in is changing many features, and the species head is responding to one of those other features, not motion. So you haven't shown that it's specifically F (motion) that is represented.

   Reply: We can control for other features. We choose images that are as similar as possible except for motion. For example, we can use style transfer to create pairs of images: one with the animal in motion and one static, but otherwise identical. Then when we patch, the only systematic difference is motion. The species head changes in a way that is consistent with motion, not with other features. This controls for confounding.

   Therefore, the case is valid.
