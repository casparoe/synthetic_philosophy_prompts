  ### The Case: Invariant Motion Representation in a Multi-Task Vision Model

  **Scenario:** Consider a mid-sized convolutional neural network trained simultaneously for two tasks on a dataset of animal images: (1) classifying species (e.g., "cheetah," "eagle") and (2) detecting motion (e.g., "running," "flying"). The motion label is derived from video metadata but is highly correlated with low-level cues like motion blur in the training data. The architecture has a shared backbone (S, the final convolutional layer) feeding two linear classification heads. During training, S learns to encode both species and motion features. However, due to dataset biases, the *motion head* learns to rely on spurious blur cues for motion detection. In contrast, the *species head* learns to use true motion features nonlinearly (e.g., to distinguish "perched" vs. "flying" birds), as motion is sometimes the most reliable indicator of species.  

  In the distribution shift, we test on images where motion is decoupled from blur (e.g., motion images with blur digitally removed, static images with blur artificially added). The motion head fails catastrophically (accuracy ≈50%), as it depends on blur. However, the species head maintains high accuracy by leveraging S’s motion features. Now:  
  - **Decoding test fails:** A linear probe on S for motion prediction achieves only chance accuracy on the shifted data. The spurious blur cues are gone, and the true motion representation in S is high-dimensional and nonlinear, requiring a deep MLP (5+ layers) to decode.  
  - **Causal test succeeds:** Activation patching from a motion image (no blur) into a static image (with added blur) at S causes the species head to shift its output toward motion-associated species (e.g., "flying eagle" instead of "perched eagle"). Conversely, ablating S eliminates motion sensitivity in the species head (e.g., "flying" birds are misclassified as "perched") while leaving non-motion-related species accuracy intact.  

  ---

  ### What Each View Says  
  1. **Reader/Decoding View:** "S does *not* represent motion. No simple readout (linear probe, sparse coding) can extract motion from S in the shifted context. The heavy MLP probe succeeds only because *it* constructs the representation through computation, proving motion isn't natively encoded in S."  
  2. **Consumer/Causal-Role View:** "S *does* represent motion. Downstream computations (the species head) use S’s state *as* motion, evidenced by interventions: patching S changes behavior in ways appropriate to motion, and ablation disrupts motion-dependent behavior. This holds even when the motion head fails."  
  3. **Etiological/Selected-For View:** "S was selected to track *blur*, not motion, during training. The causal result is a fluke—species head reuse of S under shift is coincidental, not 'true' representation. Motion isn’t represented; blur is. But if forced to choose, we’d say S *now* represents motion due to its causal role post-shift."  

  ---

  ### Key Analysis  
  **1. The Crucial Feature and Its Removal**  
  The core feature is the **asymmetry in downstream consumers**: the species head uses motion *nonlinearly* for species classification, while the motion head uses it *linearly* (and fails when proxies break).  
  - **If the probe were linear/small:** A linear probe *can* decode motion from S in the *training* data (due to blur correlation). Reader and causal views initially agree ("yes, motion is represented"). Only the shift forces them apart.  
  - **If the species head were linear:** It would fail like the motion head. The causal test would show no motion-appropriate behavior changes, collapsing back to agreement ("no one uses motion, so it’s not represented").  

  **2. The "Downstream as Decoder" Objection**  
  *Objection:* "The species head *is* a decoder for motion! If it responds to S in a motion-appropriate way, then motion *is* decodable from S. The reader view wins."  
  - **Reply:** The species head is not a *generic* decoder; it’s a task-specific consumer. It doesn’t extract motion as a standalone feature—it uses motion *obliquely* to compute species. Crucially, it lacks *readout generality*:  
    - It cannot be repurposed to output motion labels (unlike a probe).  
    - It fails if tasked directly with motion detection (as its weights are tuned for species).  
  The reader view requires a general, repurposable readout. The species head is a rigid consumer, not a proof of "decodability."  

  **3. Strongest Attack from Decoding View**  
  *Attack:* "Your causal interventions don’t isolate motion. When you patch S, you alter all features in S. The species head’s response could be driven by a *correlated feature X* (e.g., pose), not motion. You’ve shown S carries *information* about motion, not that its *content* is motion."  
  - **Reply:** We control for confounders by:  
    - Using **counterfactual pairs**: Images identical except for motion (e.g., same eagle, perched vs. mid-flight, via style transfer). Patching S swaps *only* motion state, not pose/background.  
    - **Ablation tests**: Resampling S’s activations to neutralize motion (while preserving mean activation) disrupts species classification *only* for motion-sensitive classes.  
  This shows motion specifically, not just any correlated feature, drives behavior.  

  ---

  ### Why This Matters  
  This case forces **pluralism into contradiction**:  
  - Decoding says "no" (no simple readout).  
  - Causal-role says "yes" (downstream use is F-appropriate).  
  - Etiology says "no, but yes under duress" (selected for blur, co-opted for motion).  
  The tests *genuinely diverge* because the asymmetry in consumers (specialized vs. general) and shift-induced proxy breakdown create a rift no "just use both tests" move can heal. The burden shifts to arguing which test defines "real" representation—a philosophical question no operational test can resolve.
