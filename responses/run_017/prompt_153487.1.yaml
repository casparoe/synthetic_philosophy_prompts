prompt: |-
  I'm a fourth-year PhD student in machine learning, and I've been asked to write the operating procedure for our lab's policy registry before it goes live next term, so this needs to be something a colleague can actually run rather than something that displays a position.

  The registry is a small piece of infrastructure. For certain recurring decisions, a researcher submits a *policy* — a mapping from the observations they might make to the action they would take — together with an ex ante model of the situation. The registry evaluates the candidate policies against that ex ante model, records the winner, and then executes it mechanically once the observation arrives. Two or three decisions a month go through it, usually with real money attached: compute, annotation budgets, occasionally the difference between shipping and killing a three-month run. The person running the procedure will be a rotating graduate student who has read one paper on this and has about forty minutes; the PI signs off. Assume this person has no access to the literature and will not look anything up, so every distinction the procedure uses has to be stated inside the procedure itself.

  I want the procedure built on the updateless framing, by which I mean: choose among whole policies by their expected value computed from the ex ante prior, without conditioning on the observation you in fact end up with, on the grounds that what you control is the output of the decision procedure rather than the single act in the branch you happen to occupy. I want that turned into an actual procedure, not expounded. Specifically:

  - The ordered questions, with what counts as a sufficient answer to each, and the points where the procedure stops early or hands the decision to a person.
  - A test for whether a decision belongs in the registry at all. As I understand it, the framing earns its keep only where the decision is entangled with something else — an external predictor whose behaviour tracks the policy rather than the act, or a set of instances of the same decision computation that the agent cannot tell apart — and collapses back into ordinary expected-utility maximisation otherwise. I need that test stated so a graduate student can apply it to a real ticket in five minutes, including what to do when the answer is genuinely unclear.
  - How to fix the prior, and the prior of whom as of when: our priors at registration, our priors now, or something else — and what to do when the two have diverged.
  - What the entangler is simulating when it predicts us: the rulebook as submitted text, the procedure that generated it, or our actual future behaviour. This is the step I expect to be load-bearing and the one I find hardest, and the answer seems to change depending on whether we can rewrite the rulebook afterwards.
  - What an operator should do when the executed policy mandates an action that is plainly wrong given everything now known: who may override, on what grounds, and what an override costs the registry.
  - Where full policy comparison is computationally hopeless, what approximation to substitute, and which steps are judgment calls dressed up as procedure.
  - What the procedure cannot do.

  Then run it, in order, on three cases.

  1. Our lab belongs to a compute consortium. Each quarter we submit a contingency rulebook; the consortium's allocator, a fixed and published algorithm, simulates the submitted rulebook against a battery of hypothetical scenarios and awards compute roughly in proportion to the share of the allocation that rulebook would spend on long, high-variance runs in scenarios where they look unpromising. This quarter's allocation is already granted and largely spent. The scenario that actually arose is one where a high-variance run looks unpromising and would consume about a third of what is left, and nothing we can identify now depends on whether we run it.
  2. A one-off decision: whether to spend $4k on an annotation job for a single project. No allocator, no recurring structure, and no way of confusing this decision with any other.
  3. A registered policy from a run begun six months ago says: if the pre-registered safety threshold is crossed, halt, delete the checkpoint, and run no further diagnostics first. The threshold was crossed this morning. Within ten minutes we found a bug in the logging library that makes the crossing very likely spurious; the model itself looks fine; the run cost roughly $60k and three months of someone's time; no external party is watching and nothing downstream depends on our compliance.

  Please give me a committed answer: one procedure, with definite choices at each step and the reasons for them, rather than a survey of what a defender of each decision theory would say. Where you think the updateless framing is simply inapplicable or wrong for a class of cases, say that flatly rather than hedging, and I expect I will not like what your procedure returns on case 3 — give it anyway, and say whether the correct move there is to override and what would make an override legitimate rather than convenient. Close with a short note, two hundred words at most, on the step you are least confident in, what would change your mind about it, and where your own view is contested. I would rather have something I can argue with than something balanced.
reasoning: |-
  We are designing an operating procedure for a policy registry that uses the updateless framing. The key features:
   - Policies are mappings from observations to actions, submitted with an ex ante model.
   - We evaluate policies by their expected value under the ex ante prior, without conditioning on the actual observation.
   - The procedure must be executable by a rotating graduate student with minimal background.

   We break the procedure into steps.

   Step 0: Determine if the decision belongs in the registry.
     - Test: The decision belongs in the registry if and only if there exists an "entangler" that makes the outcome of the decision depend not just on the action taken in this instance, but also on the policy that the registry uses for this type of decision (or for multiple instances that are treated as identical by the agent). Specifically:
          (a) There is an external predictor (like the compute consortium allocator) that simulates the policy and uses that simulation to determine an outcome (like compute allocation) that affects the agent's utility, OR
          (b) There are multiple instances of the same decision problem that the agent cannot distinguish (so the policy must be the same for all) and the outcomes are aggregated.

     - If neither (a) nor (b) applies, then the decision does not belong in the registry. In that case, the operator should:
          - If the decision is one-off and non-entangled, use ordinary expected utility maximization (condition on the actual observation) and do not use the registry.
          - Log the decision as "not for registry" and hand it to the requester for manual handling.

     - If it is unclear, the operator should:
          - Consult the PI. If the PI is unavailable, default to not using the registry (because using it incorrectly might lead to perverse incentives) and log the uncertainty.

   Step 1: Fix the prior.
     - We use the ex ante prior that was submitted with the policy at registration time. This prior is part of the model of the situation that the policy was designed for.
     - If the current beliefs (of the lab) have diverged from that prior, we do not update the prior for the purpose of evaluating the policy. The reason is that the policy was chosen to perform well under the ex ante prior in an updateless way, and changing the prior now would break the entangler (e.g., if the entangler used the ex ante prior to simulate the policy).

   Step 2: Policy evaluation.
     - For each candidate policy (submitted for this decision), compute the expected utility under the fixed ex ante prior. That is, for each possible observation, we compute:
          - The action the policy would take given that observation.
          - The utility of that action in the world state that (according to the prior) is associated with that observation.
          - Then average over the observations using the prior probabilities.

     - The policy with the highest expected utility (under the ex ante prior) is selected.

   Step 3: Handling computational intractability.
     - If computing the exact expected utility is intractable, we use a Monte Carlo approximation:
          - Sample a set of observations (and associated world states) from the ex ante prior.
          - For each sample, apply the policy to get the action and then compute the utility.
          - Average the utilities over the samples.

     - The number of samples should be set to a fixed number (e.g., 1000) that is computationally feasible for the operator within the time constraints (40 minutes). If even that is too heavy, the operator should:
          - Use a smaller number (e.g., 100) and note the approximation in the log.
          - If the decision is critical and the approximation error might change the outcome, consult the PI.

     - This step is a judgment call only in setting the number of samples and the sampling method. The procedure must be fixed: use simple random sampling from the prior.

   Step 4: Execution and override.
     - Once the observation arrives, the selected policy is executed mechanically: the operator runs the policy on the actual observation and takes the prescribed action.
     - Override is allowed only under the following conditions:
          (a) The policy mandates an action that is physically impossible or illegal.
          (b) There is a catastrophic error in the registry procedure (e.g., a bug in the code, or the operator realizes they made a mistake in step 0 or step 1).
          (c) The policy was selected under a prior that the lab now believes to be fundamentally flawed (e.g., due to a discovered error in the model) and the operator has explicit approval from the PI for an override.

     - Override is not allowed simply because the action seems suboptimal given the actual observation and current beliefs. That is the entire point of the updateless framework: we commit to the policy ex ante to get the benefits from the entangler.

     - If an override occurs:
          - The operator must log the reason and the alternative action taken.
          - The registry's reliability is compromised (the entangler might not trust future policies), so the operator must notify the PI and the requester that the registry may need to be suspended for this type of decision until repaired.

   Step 5: What the procedure cannot do.
     - It cannot handle decisions that are not ex ante specifiable (i.e., where the set of possible observations or actions is not known in advance).
     - It cannot handle decisions that require conditioning on the actual observation (non-entangled decisions) without losing the benefits of the entangler.
     - It cannot change the prior after registration without re-registering the policy.

   Now, we run the procedure on the three cases.

   Case 1: Compute consortium allocation.
     - Step 0: There is an entangler: the consortium's allocator simulates the rulebook against hypothetical scenarios to determine the allocation. This fits condition (a). Therefore, it belongs in the registry.

     - Step 1: The prior is the one submitted at registration (for this quarter). The fact that the allocation is already granted and spent does not change that the rulebook was evaluated under that prior. We use the ex ante prior from registration.

     - Step 2: The policy (rulebook) for this quarter is already registered and evaluated. The registry would have recorded the winning rulebook. Now, the observation (the actual scenario) has arrived: a high-variance run looks unpromising. The rulebook must be executed: it will say whether to run it or not. The operator runs the rulebook on this observation and takes the action.

     - Note: The operator does not reevaluate the rulebook now. The rulebook was chosen ex ante and we are bound by it.

     - Override? The action might seem wrong because the run looks unpromising and we have little compute left. But without a valid override reason (as per Step 4), we must execute. The consortium's allocation was based on the rulebook's behavior in scenarios including this one. Overriding would break the incentive alignment.

   Case 2: One-off annotation job.
     - Step 0: No entangler: no external predictor and no recurring instances that the agent cannot tell apart. This is a one-off. Therefore, it does not belong in the registry.

     - The operator logs it as not for registry and hands it to the requester. The requester should make the decision by ordinary expected utility, conditioning on the current information.

   Case 3: Registered policy says to halt and delete if threshold crossed, but we found a bug making the crossing spurious.
     - Step 0: We must check if there was an entangler at registration. The problem says it was a registered policy from a run begun six months ago. We don't have explicit information about an entangler. Let's assume that the policy was registered because there was an entangler (e.g., perhaps the run was part of a set of runs that shared a budget and the policy was set to avoid wasting budget on unsafe runs, and the budget allocation depended on the policy). But the problem states: "no external party is watching and nothing downstream depends on our compliance." So if there was an entangler, it is no longer active? However, the entangler condition is about the situation at the time of registration. We must check:

          At registration, was there an entangler? The problem doesn't say. But note: the policy was registered, so we assume that at registration time, the requester believed there was an entangler (otherwise they wouldn't have registered). The operator should look at the registration form: if the requester indicated an entangler (like a budget allocator that depended on the policy) then it belongs. If not, then it shouldn't have been registered. But the procedure says: if the decision was registered, we assume the Step 0 test passed at registration.

          However, the operator must re-check the entangler condition at the time of execution? The procedure does not require that because the entangler might have been active at registration and we are bound by the commitment. But if the entangler is gone, then the reason for using the registry vanishes. However, the procedure does not have a step for re-evaluating the entangler at execution time. We designed the procedure to use the ex ante prior and the registration context.

          Given the problem: "nothing downstream depends on our compliance", we might conclude that the entangler is gone. But note: the entangler at registration time might have been the reason for the policy, and if we violate the policy now, it might affect future entanglers (if the same registry is used again and the entangler learns that we don't follow through). So there is a potential for self-consistency.

          However, the procedure says: Step 0 is done at registration. At execution, we are only executing. So the operator should not redo Step 0.

          Therefore, the operator must execute the policy: halt, delete, and run no diagnostics.

     - Override? The action seems plainly wrong. But we must check the override conditions:

          (a) Not impossible or illegal.
          (b) Was there a catastrophic error in the procedure? The bug in the logging library was not known at registration. But the policy was evaluated under the ex ante prior, which (we assume) did not account for this bug. However, the override condition (c) might apply: if we now believe the ex ante prior was fundamentally flawed (because it did not consider the possibility of such a bug) then we might override with PI approval.

          But note: the prior is about the world, not the logging library? The prior included the probability of the threshold being crossed. The bug means that the observation (threshold crossed) is not actually indicative of the true state. However, the policy was designed to react to the observation, not the true state. The ex ante prior might have been flawed because it did not account for the bug? That is a judgment call.

          The operator should:

            - Check if the bug represents a fundamental flaw in the prior. If the prior was over the true state and the observation was a noisy reading, then the prior might have included the noise model. If the bug is a new discovery that the noise model was wrong, then the prior is flawed.

            - The operator must get PI approval for an override.

          Without an override, the operator must execute the policy.

     - This is harsh. But the updateless framing requires it. If we override, we break the commitment and risk future entanglers not trusting us.

     - The procedure returns: execute the policy (halt and delete) unless the PI approves an override on the grounds that the prior was fundamentally flawed.

     - Note: The problem says "the model itself looks fine", so the true state might be safe. But the policy doesn't require checking the true state, only the observation.

     - Override might be legitimate if the prior (which included the observation model) is now known to be wrong. Then condition (c) is met.

     - However, the policy was designed to work under the prior. If the prior was wrong, then the policy might not be optimal. But note: the entangler (if it exists) might have also used the same flawed prior. Overriding might be consistent with what the entangler would have wanted? We don't know. The safe thing is to follow the procedure and override only on prior flaw.

   Now, a short note on the step I am least confident in:

   Step 0: Testing for an entangler.

     The test is critical: without an entangler, the updateless framework may be harmful. But the two conditions (a) and (b) might not cover all cases. For example, what if there is a self-referential aspect (like in Newcomb's problem) that doesn't fit (a) or (b)? The procedure currently does not account for that.

     What would change my mind: Evidence that there are naturally occurring decision problems that exhibit Newcomb-like structure without an explicit external predictor or multiple instances. In such cases, the test might incorrectly reject them.

     My view is contested: Some decision theorists argue that updatelessness is always rational (e.g., in the context of logical uncertainty) even without an explicit entangler. However, for practical purposes in a lab setting, I think the entangler condition is necessary to avoid making bad decisions in one-off situations.

     Therefore, I stick to the test as stated.

   Final procedure document:

  # Policy Registry Operating Procedure

  ## Step 0: Determine if the decision belongs in the registry
  - Check if either:
      (a) There is an external predictor (like an allocator) that uses a simulation of the policy (submitted rulebook) to determine an outcome (e.g., compute allocation) that affects the lab's utility, OR
      (b) There are multiple instances of the same decision problem that the agent cannot distinguish (so the same policy must be applied to all) and the outcomes are aggregated.
  - If neither applies, do not use the registry. Log as "not for registry" and hand the decision to the requester for manual handling.
  - If unclear, consult the PI. If PI is unavailable, default to not using the registry.

  ## Step 1: Fix the prior
  - Use the ex ante prior submitted with the policy at registration time. Do not update it with current beliefs.

  ## Step 2: Policy evaluation
  - For each candidate policy (if there are multiple, but typically one per registration), compute the expected utility under the prior from Step 1:
      EU(policy) = E_{observation ~ prior} [ utility(policy(observation)) ]
  - If computationally feasible, compute exactly. Otherwise, use Monte Carlo with at least 100 samples (or 1000 if feasible within time). If the approximation is too coarse and might change the outcome, consult the PI.
  - Select the policy with the highest expected utility.

  ## Step 3: Execution
  - When the observation arrives, execute the selected policy: apply it to the observation and take the prescribed action.

  ## Step 4: Override
  - Override only if:
      (a) The action is physically impossible or illegal.
      (b) There is a catastrophic error in the registry procedure (e.g., code bug, operator error in Step 0 or 1).
      (c) The ex ante prior is now known to be fundamentally flawed (e.g., due to a discovered model error) and the PI approves an override.
  - If overriding, log the reason and alternative action, and notify the PI and requester that the registry's reliability may be compromised.

  ## Step 5: Limitations
  - The registry cannot handle:
      - Decisions that are not ex ante specifiable (unknown observations or actions).
      - Decisions without an entangler (use manual handling for these).
      - Changing the prior without re-registration.

  ## Case Applications (as above)

  Note: The procedure is designed to be followed exactly as written. The operator must not deviate without explicit approval (via override conditions).
answer: |-
  ### Policy Registry Operating Procedure

  #### **Step 0: Test for Registry Eligibility**  
  *Question:* **"Is there an 'entangler' that makes outcomes depend on the *policy* (not just the action)?"**  
  - *Sufficient answer:* **Yes** if either:  
    - (a) An external system (e.g., allocator, predictor) simulates/submits the policy *before* observations arrive (e.g., consortium allocator).  
    - (b) Multiple identical/indistinguishable decisions exist (e.g., repeated budget splits), and outcomes aggregate across them.  
  - **No** if:  
    - The decision is one-off, has no external simulator, and no indistinguishable copies exist.  
  - *Unclear?* Default to **NO**, log uncertainty, and hand to PI. If PI unavailable within 1 hour, reject registry use.  
  - *Stop early:* If **NO**, exit registry. Handle manually via ordinary expected utility (condition on actual observation).  

  ---

  #### **Step 1: Fix the Prior**  
  - **Use the ex ante prior submitted at registration.** Never update with current beliefs.  
  - *Divergence?* If prior is flawed (e.g., discovered mathematical error), halt and escalate to PI. Do **not** proceed unless PI approves override (Step 4).  

  ---

  #### **Step 2: Policy Evaluation**  
  1. **Inputs:** Candidate policies, ex ante prior (from registration), utility function.  
  2. **Compute expected utility for each policy:**  
     - For policy \( \pi \), calculate:  
       \[
       EU(\pi) = \mathbb{E}_{(o,s) \sim \text{prior}} [U(a_{\pi}(o), s)]
       \]  
       where \( o \) = observation, \( s \) = state, \( a_{\pi}(o) \) = action from policy.  
  3. **Approximation if intractable:**  
     - Sample 100 observations from prior (fixed seed for reproducibility).  
     - Compute utility for each sample. Average results.  
     - *Judgment call:* If policies are within 0.5% utility, flag for PI review. Else, select highest EU.  
  4. **Record winner.**  

  ---

  #### **Step 3: Entangler Simulation**  
  - **Simulate the policy-as-text** (submitted rulebook), not the generating procedure or behavior.  
  - *Why?* Ensures alignment with external systems (e.g., consortium allocator). Policy-as-text is immutable post-registration; behavior can drift.  

  ---

  #### **Step 4: Execution & Override**  
  - **Execute** policy mechanically on actual observation.  
  - **Override only if:**  
    - (a) Action is illegal/impossible.  
    - (b) Catastrophic procedure error (e.g., code bug, misapplied prior).  
    - (c) Prior fundamentally flawed (PI-approved, Step 1).  
  - **Cost of override:** Invalidate all dependent policies. Registry suspended until PI recertifies.  
  - *Never override* for "suboptimal given new knowledge."  

  ---

  #### **Step 5: Limitations**  
  - **Cannot handle:**  
    - Non-entangled decisions (use manual EU).  
    - Observations outside prior support.  
    - Policies requiring >1hr compute (use pre-approved approximation).  
  - **Critical judgment points:** Entangler test (Step 0), approximation tolerance (Step 2).  

  ---

  ### Case Applications  
  **Case 1: Compute Consortium**  
  - **Step 0:** **YES** (entangler = consortium allocator simulates policies).  
  - **Step 1:** Use registration prior (quarterly).  
  - **Step 2:** Evaluate rulebook on prior → execute prescribed action (run/halt).  
  - **Override?** NO. Current "unpromising" observation irrelevant; allocator reward depends on policy consistency.  
  - **Action:** Run if policy says so, even if locally suboptimal.  

  **Case 2: Annotation Job**  
  - **Step 0:** **NO** (one-off, no entangler).  
  - **Stop early:** Hand to requester. Manually compute EU with current knowledge.  
  - **Action:** Do not use registry.  

  **Case 3: Halt-and-Delete Policy**  
  - **Step 0:** **YES** (assume entangler at registration, e.g., budget allocator or cross-run consistency).  
  - **Step 1:** Use registration prior (no flaw; logging bug is new info).  
  - **Step 4:** **Execute policy** (halt, delete, no diagnostics). Override **forbidden** — no procedure error/flawed prior.  
  - **Why you’ll dislike this:** $60k loss feels avoidable, but override breaks trust in registry. Entanglers (e.g., future allocators) rely on commitment.  
  - **Legitimate override?** Only if PI proves prior *fundamentally* flawed (e.g., impossible states). "Spurious threshold" is not sufficient.  

  ---

  ### Least Confident Step: Step 0 (Entangler Test)  
  **Issue:** Ambiguity in "indistinguishable decisions." Real cases may blur one-off/recurring boundaries (e.g., project-specific allocators). Current test risks false negatives.  
  **What would change my mind:** Evidence that updatelessness improves outcomes even in "weakly entangled" cases (e.g., self-fulfilling predictions). Absent this, false positives (using registry for one-offs) are costlier.  
  **Contested view:** Causal decision theorists reject entangler necessity. I prioritize incentive alignment over single-instance optimality.  

  ---  
  **Final Output:** This procedure is executable in 40min. It prioritizes mechanical fidelity over edge-case flexibility, as required. Override on Case 3 is prohibited — commit or abandon the registry.
