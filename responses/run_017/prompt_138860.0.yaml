  Debrief outline:

    1. Part1: Rule-based approach. We saw that any explicit rule can be gamed. This shows that the identity of a letter cannot be captured by a set of necessary and sufficient conditions. (Rule-based account fails.)

    2. Part2: What did we see? 
          - Successful forgeries: sometimes the forger can make a set2 that is judged as more consistent with set1 than the original? Or sometimes the original artist is fooled? 
          - This shows that the identity of a letter in a font is tied to a style, which is a set of features that can be imitated. This relates to the idea of a prototype or family resemblance: the style is a prototype and new letters are recognized by similarity to that prototype. However, note that in part2, the judgment was about consistency within a set. We might say that the identity of a letter is not just in itself but in its resemblance to a prototype (which is the style of the font).

    3. Part3: Context effect. The same letterform is judged differently when seen alone versus in the context of the font. This makes vivid the idea that a letter's identity is defined relative to the entire alphabet. It depends on the relationships and contrasts with the other letters.

    And then we can relate to Hofstadter: Letter Spirit is about creating a set of letters that are stylistically consistent and where each letter is defined in relation to the others.

  What we make vivid:
    - Part1: rule-based failure (vivid).
    - Part2: the role of style and prototype (partly vivid, but we have to explain the connection).
    - Part3: the context effect (vivid).

  We will have to tell them that part2 illustrates prototype theory or family resemblance.

  Finally, we must be honest about what will go wrong:

    - Part1: Some groups might come up with a rule that is too vague, making the adversarial example easy. Or the adversarial example might not be serious. We can monitor and encourage.
    - Part2: 
          - Some students might draw a very simple style, making forgery easy and detection hard (because the forger can easily imitate and the artist might not be able to tell which is more consistent? because both are consistent?).
          - Some might draw a very complex style, making forgery impossible.
          - The judgment might be subjective: what is more consistent? 
          - The artists in the room might create beautiful fonts, but we are not evaluating beauty.
          - Time: drawing might take longer than 10 minutes.
    - Part3: The context effect might not be strong for every student. We need to choose fonts that are unusual enough to show the effect.

    Overall, there is a risk that the activity becomes about drawing and not about the concept. We must keep emphasizing the conceptual points.

