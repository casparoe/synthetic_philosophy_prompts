                  Then A looks at their set1 and then at the two set2s (original and forgery) and picks which set2 is more consistent with the set1.

        Similarly for alphabet B.

        This works.

    So timeline for part2:

        - 0-10 min: Each student draws set1 (a,b,c,d) and set2 (e,f,g,h) for their own alphabet. They keep both worksheets.
        - 10-12 min: Swap set1 worksheets: A gives their set1 to B and B gives their set1 to A.
        - 12-20 min: Forging: 
              A forges set2 for B's alphabet (using B's set1) on a new worksheet.
              B forges set2 for A's alphabet (using A's set1) on a new worksheet.
        - 20-22 min: Return set1 worksheets: A returns B's set1 to B and gets back their own set1. Similarly, B returns A's set1 to A and gets back their own set1.
        - 22-27 min: Judgment for each alphabet within the pair:
              For alphabet A: A (with their set1) is presented with two set2s: their own original and B's forgery. A picks which one is more consistent with set1.
              For alphabet B: B (with their set1) is presented with their own original set2 and A's forgery. B picks.
        - 27-30 min: Scoring and recording.

