  Now, let's write the grid.

  Grid: 5x5 squares. We can have worksheets with multiple 5x5 grids on one page.

  Example of a worksheet for set1: one page with 4 grids (each 5x5) labeled a, b, c, d.
  Similarly for set2: one page with 4 grids labeled e, f, g, h.

  For forging, they get a blank worksheet with 4 grids (labeled e, f, g, h) to draw in.

  For part1: one worksheet with one grid for the adversarial example.

