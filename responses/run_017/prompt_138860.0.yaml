answer: |-
  ### Session Design: "What Makes an 'a' an 'a'?"  
  **Total Time:** 90 minutes  
  **Materials per Student:**  
  - 1 gridded worksheet (5x5 grid per letter, with 4 grids per sheet)  
  - Markers (black, fine-tip)  
  - Pre-printed scoring sheets (for Part 2)  
  - Pre-drawn font sets (for Part 3)  

  **Grid Design:**  
  - **5x5 grid per letter** (simple, flexible for abstract forms).  
  - Worksheets:  
    - **Part 1:** One sheet with a single grid for the adversarial drawing.  
    - **Part 2:** Two sheets per student—one for their "initial set" (letters a–d), one for "extensions" (letters e–h).  
    - **Part 3:** Pre-made sheets showing isolated letters vs. full fonts.  

  ---

  ### **Part 1: Rule-Based Failure (25 min)**  
  **Goal:** Show that explicit rules for letter identity can be subverted.  
  **Groups:** 6 groups of 3 students.  

  1. **Rule Creation (10 min):**  
     - Groups define a rule for what makes a 5x5 grid drawing an "a". Rules must be concrete (e.g., "Must have a closed loop at the bottom," "Vertical stem on the right").  
     - **Anti-Joke Measure:** Emphasize, "This is a *thought experiment*, not Pictionary. Your rule must be testable, like computer code."  

  2. **Adversarial Round (10 min):**  
     - Assign one "adversary" per group. The adversary **alone** draws a figure that *technically* satisfies the group’s rule but is unrecognizable as an "a".  
     - **Example:** If the rule is "Has a closed loop," the adversary might draw a lopsided square in the corner.  
     - **Facilitation:** Walk between groups to veto unserious entries (e.g., smiley faces).  

  3. **Share & Discuss (5 min):**  
     - Each group shows their rule and adversarial example. Highlight: "Why did this satisfy your rule but fail as an 'a'?"  

  ---

  ### **Part 2: Prototype/Similarity Challenge (35 min)**  
  **Goal:** Explore style consistency and forgery through imitation.  
  **Pairs:** 9 pairs.  

  1. **Draw Initial Sets (10 min):**  
     - Each student draws **letters a–d** in a unique, consistent style (e.g., angular, rounded). Encourage simplicity (e.g., "Avoid complex serifs").  

  2. **Swap & Extend (15 min):**  
     - Pairs swap initial sets (a–d).  
     - Each student draws **letters e–h** in *their partner’s style* (forgery) and in *their own style* (original continuation).  
       - **Crucial:** Use separate sheets, label originals discreetly (e.g., tiny star).  

  3. **Identify & Score (10 min):**  
     - Partners exchange **both continuations** (e–h) for the *same* initial set (a–d).  
     - **Task:** Identify which continuation (original or forged) matches the initial set’s style.  
     - **Scoring (per student):**  
       - **1 pt for imitation:** If your forgery fools your partner.  
       - **1 pt for detection:** If you spot your own style correctly.  
       - **Max 2 pts per student** (e.g., fooling your partner *and* spotting your own).  

  ---

  ### **Part 3: Contextual Relativity (15 min)**  
  **Goal:** Experience how a letter’s identity changes with its font siblings.  
  **Individual Activity:**  

  1. **First Judgment (5 min):**  
     - Show **isolated letter "a"** from a pre-drawn font (ambiguous design; see examples below).  
     - Students rate: "Is this an 'a'?" (1 = Definitely not, 5 = Definitely yes).  

  2. **Second Judgment (5 min):**  
     - Show the **same "a" alongside siblings** (e.g., b, c, d) in its original font.  
     - Re-rate the *identical* "a" using the same scale.  

  3. **Discuss Shifts (5 min):**  
     - Poll results: "Did ratings change? Why?"  

  **Pre-Drawn Fonts (Examples):**  
  - **Font 1:** Minimalist, geometric. Isolated "a" resembles an "o"; in context, slanted stem aligns with "d".  
  - **Font 2:** Fluid, brush-like. Isolated "a" looks like "æ"; in context, curves mirror "c" and "e".  

  ---

  ### **Debrief: Mapping Movements to Theories (10 min)**  
  | Part | Theory                         | What’s Vivid?                           | What Must Be Told?                     |  
  |------|--------------------------------|-----------------------------------------|----------------------------------------|  
  | 1    | **Rule-Based (Classical)**     | Rules fail—adversarial examples break them. | That rules *always* fail for open-ended concepts (Hofstadter’s core problem). |  
  | 2    | **Prototype/Similarity**       | Style imitation/detection shows "family resemblance." | That this mirrors prototype theory (e.g., Rosch)—no single "essence," but shared features. |  
  | 3    | **Holistic/Relational**        | Rating shifts prove context defines identity. | That letters are *defined by contrasts* within a system (like Saussure’s signifiers). |  

  **Key Insight:**  
  Parts 1 and 3 make their theories visceral. Part 2’s link to prototypes needs explanation—students *feel* style consistency but won’t label it "prototype theory" without guidance.  

  ---

  ### **Honest Pitfalls & Mitigation**  
  1. **Artists Dominate Part 2:**  
     - Skilled drawers create complex styles, making forgery hard.  
     - **Mitigation:** Stress, "Simple is better. Use basic shapes—focus on *one* stylistic trait (e.g., all curves)."  

  2. **Adversarial Round Jokes:**  
     - Students draw absurdities (e.g., a dinosaur).  
     - **Mitigation:** Intervene early: "If your rule allows this, refine it. The point is *subtle* failure."  

  3. **Forgery Too Easy/Impossible:**  
     - Overly simple styles → trivial imitation; overly complex → no one can forge.  
     - **Mitigation:** Demo a balanced style (e.g., "All stems 2 cells thick"). Pre-define letters to draw (a–d, e–h) to save time.  

  4. "**Not Judges**" in Part 3:  
     - Some refuse to rate ambiguously.  
     - **Mitigation:** Reassure, "There’s no ‘right’ answer. We’re studying perception, not art criticism."  

  5. **Drawing Contest Mentality:**  
     - Focus shifts to aesthetics over concepts.  
     - **Mitigation:** Open with, "This isn’t about talent. A ‘bad’ drawing that exposes a rule is perfect."  

  6. **Time Overruns:**  
     - Drawing takes longer than planned.  
     - **Mitigation:** Keep Part 1 strict (use a timer). For Part 2, provide grid templates to skip drawing boxes.  

  **Why This Works:**  
  The activity forces confrontation with Hofstadter’s problem—students *feel* the gap between rules and fluid identity. The debrief frames their frustration as theoretical insight.
