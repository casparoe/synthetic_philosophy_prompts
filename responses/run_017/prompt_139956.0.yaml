answer: |-
  ## Sestina for the Symbol Grounding Problem

  I know each **word**'s precise formal role,
  Define the **world** as pure extensional set.
  My perfect **hand** assigns each referent place
  On flawless maps. Yet where is **ground**? This term
  Remains a **token**, shifting in its **use**,
  A signpost pointing nowhere, self-obsessed.

  My rules dictate each symbol's **use**, its path
  Through clean deduction. Still, the needed **word**
  For contact fails. Though every sign and **token**
  Links perfectly, confirming its own **world**,
  It cannot grasp the earth, the soil, the **ground**
  My formal **hand** constructs but cannot test.

  I trace relations, yet no purchase found.
  What anchors meaning? Not another **use**
  Of empty signs. Not this abstracted **ground**
  I name within the system. Every **word**
  Defines its kin within the bounded **world**,
  A closed exchange of pristine, weightless **token**.

  Like one who studies, lost, a **token** guide –
  A lexicon defined within its tongue –
  Whose desperate **hand** turns page on futile page,
  Each entry **use** but more elaborate script,
  Explaining **word** by **word** in endless chains
  That never leave the page-bound, paper **world**.

  I simulate the textures of the **world**,
  Assign each sensed event a formal **token**,
  Define the rules for how each term we **use**
  Should shift and change. But "change" is just a **word**
  For state transition. Where's the real **hand**
  That breaks the frame, that touches actual **ground**?

  "**Ground**" is the metaphor, itself un-**ground**ed,
  A spatial **token** borrowed for this **world**
  Of signs. My flawless logic holds no **hand**,
  No weight of earth. Its perfect, pure **token**s
  Define their own correct, internal **use**,
  But anchor nothing. Every linked **word**

  **(Envoi)**

  O **hand**, find **ground** beyond this circling **word**!  
  **Use** weight, not **token** – feel a world that bruises.  
  This **world** needs **ground** that isn't just a **word**.  

  ---

  **Handout Notes:**  
  *This sestina embodies the symbol grounding problem: a system with perfect internal definitions and syntax remains semantically unmoored. The rotating end-words enact the closed loop of symbolic reference, while the dictionary image illustrates futile self-containment. The envoi attempts a shift from metaphor to physical consequence ("bruises"), questioning whether invoking embodiment solves the problem or merely adds another symbolic layer. The spatial metaphor of "grounding" is explicitly acknowledged as part of the difficulty.*
