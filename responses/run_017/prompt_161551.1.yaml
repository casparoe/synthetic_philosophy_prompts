prompt: |-
  I have no academic affiliation — I work in IT project management and have been reading about federalism on my own for a couple of years, ever since I got pulled into a local argument about who should be setting school curricula in my state and discovered that the same argument is being had, in different vocabulary, all over the place. A small foundation that funds unaffiliated independent researchers has invited me to apply for a nine-month fellowship, and they want a two-page proposal (plus a short budget note). They say explicitly that they would rather fund one sharply posed conceptual question than a survey, and that they will notice if the question is fuzzy.

  Here is my half-formed idea. Almost every formulation of subsidiarity I run into seems to presuppose a negative reading: subsidiarity as a reason for the higher level to keep its hands off. The EU test asks whether the objectives of a proposed action cannot be sufficiently achieved by the member states but can be better achieved at Union level; the German Basic Law makes the federation's use of its concurrent powers turn on whether federal legislation is necessary (Erforderlichkeit), a test the constitutional court mostly declines to police; American arguments tend to be about enumerated powers, about conditions attached to federal money, and about whether states can be conscripted into administering federal schemes. But the older Catholic-social usage the word comes out of is about subsidium in the sense of aid or help: the higher body exists to assist the lower unit to do for itself what it ought to do, which on occasion means the higher level must act — fund, train, set a floor, build administrative capacity — precisely so that the lower unit becomes genuinely able to act. Call these the abstention reading and the enablement reading. My suspicion is that a lot of talking past each other is explained by participants implicitly holding one or the other, and that the two can come apart in practice. There is also something dynamic I cannot get the standard tests to see: competences can be retained on paper while being hollowed out in fact, because the standards, the money, and the expertise have drifted upward. At that point the abstention reading's question of whether the lower unit could do the job has a self-fulfilling answer, and the enablement reading will license interventions that look, by the standard test, like straightforward centralization. So I have been toying with a counterfactual-capacity test: not could the lower unit do this adequately now, but could it do it after a realistic interval of actually being the one responsible, and what would have to be invested to make that true — which suggests the right answer can flip depending on the time horizon you choose, and that a principle silent about that horizon is indeterminate.

  What I need from you is the proposal itself, about 1,200 words, in American English, written for a reviewer who is not a specialist in comparative constitutional law. Please: (1) state the research question precisely enough that it has a determinate answer, and say whether my contrast is best framed as two principles in tension, two senses of one principle, or one principle plus a side-constraint; (2) say why the existing answers leave it open — the necessity and better-achieved tests, the argument that federalism is adequately protected by the political process rather than by doctrine, the view that subsidiarity is a procedural or burden-of-proof rule rather than a substantive one; (3) set out a method for nine months of part-time unaffiliated work, say six to eight hours a week, English plus slow German, no archives, no interview program, no travel, stated month by month, and say why that method rather than the two obvious alternatives of a full four-system legal comparison or a purely normative argument from first principles; (4) describe a concrete deliverable, which I imagine as a decision procedure someone could actually apply to a new competence in order to decide what level it should sit at, together with two or three worked policy domains — I was thinking school standards, pandemic response, and climate targets — run through the machinery of all four systems (the American division of enumerated and reserved powers, Germany's concurrent-powers catalogue and the Länder's direct voice in federal legislation through the upper chamber, Switzerland's reworked division of tasks between Confederation and cantons with the cantons doing most of the implementing under fiscal equalization, and the EU's subsidiarity test with its national-parliament early-warning mechanism); (5) lay out the possible conclusions and which considerations would decide between them; and (6) give me an honest failure condition and an honest scope assessment, including the possibility that the enablement reading simply collapses into ordinary proportionality reasoning, and the possibility that the differences between the four systems turn out to be only differences about who bears the burden of proof. Please do not spend any space on a literature review or bibliography and do not supply citations; I will add those myself, and I would rather have placeholder gaps than guessed-at references.
reasoning: |-
  Okay, the user is an IT project manager diving into federalism studies independently. They've been invited to apply for a fellowship to explore a nuanced idea about subsidiarity. Their core observation is that subsidiarity is often framed negatively (abstention) rather than positively (enablement), causing miscommunication in policy debates. They need a sharp research proposal addressing this gap.

  First, I need to structure their half-formed idea into a precise research question. They mentioned the contrast between abstention and enablement readings of subsidiarity. The question should clarify whether these are two principles in tension, two senses of one principle, or one principle plus a constraint. Given their examples (EU, Germany, US), it seems like two interpretations of the same principle causing practical divergence.

  Next, why existing frameworks fall short. The necessity tests (EU's "better achieved", Germany's Erforderlichkeit) focus on current capacity, ignoring how centralization erodes local capability over time. Process-based federalism (like political safeguards theory) doesn't address competence hollowing. Treating subsidiarity as procedural (e.g., burden-of-proof rules) avoids substantive engagement with enablement. These gaps justify their counterfactual-capacity approach.

  For methodology: Their constraints are part-time work, no travel/interviews, with basic German skills. A four-system comparison (US, Germany, Switzerland, EU) is feasible without deep archival work. The alternative—full comparative study—is impossible in nine months, while pure theory wouldn't ground their decision procedure. Monthly breakdown: literature review (2 mos), case mapping (2 mos), counterfactual framework development (3 mos), testing on policy domains (2 mos), synthesis (1 mo).

  Deliverables: A decision procedure flowchart with concrete steps (e.g., assess current local capacity, define "realistic interval" for capability building, evaluate investment feasibility). Testing on school standards (funding vs. content control), pandemic response (resource pooling vs. local tailoring), climate targets (binding minima vs. implementation flexibility). Each case shows how abstention vs. enablement flip outcomes.

  Possible conclusions: Enablement could emerge as a distinct principle (best case), a proportionality factor (partial validation), or just a burden-of-proof variation (failure). Key deciders: whether investment logic differs from centralization efficiency, and if time horizons resolve contradictions.

  Failure conditions: Enablement collapsing into proportionality analysis would undermine uniqueness. If system differences reduce to burden-of-proof allocations, the core tension isn't structural. Scope risks: Overlooking non-Western systems, or underestimating political feasibility in the decision procedure.

  The user's unspoken need is credibility—they're an outsider, so the proposal must preempt skepticism about non-academic rigor. Emphasizing concrete outputs (decision procedure, case tests) and methodical constraints addresses this. Also, their frustration with "talking past" in policy debates suggests they want practical tools, not just theory—hence the applied deliverable focus.
answer: |-
  ## Proposal: Subsidiarity Beyond Abstention: A Counterfactual-Capacity Framework for Multi-Level Governance

  **Principal Investigator:** [Your Name], Independent Researcher (IT Project Management background)  
  **Fellowship Duration:** 9 months (part-time, ~6-8 hours/week)  
  **Budget Note:** Request covers essential legal database subscriptions (HeinOnline, Beck-Online, EUR-Lex Pro), specialized translation support for dense German legal texts, and dedicated writing software. No personnel, travel, or equipment costs.

  **1. The Core Question & Conceptual Framing:**
  Can a **counterfactual-capacity assessment**, evaluating whether a lower governance unit (state, Land, canton, member state) *could develop the genuine capability* to adequately fulfill a policy function within a realistic timeframe given targeted investment by a higher level, resolve persistent tensions between the "abstention" (higher level refrains) and "enablement" (higher level acts to empower) interpretations of subsidiarity – and if so, does this reveal that the *time horizon* chosen is a critical, yet unacknowledged, determinant of subsidiarity's application?

  *   **Framing the Contrast:** The abstention reading ("Can the lower level do it adequately *now*? If yes, higher level stays out.") and the enablement reading ("*Must* the higher level act *now* to ensure the lower level *can* do it *effectively* later?") are best understood as **two competing interpretations of the single principle of subsidiarity**. They stem from the same root concept (tasks should reside at the lowest effective level) but diverge sharply on the operationalization of "effective," particularly regarding the assessment of capacity and the role of the higher level. The tension arises from whether subsidiarity is primarily a *static constraint* on higher-level action (abstention) or a *dynamic imperative* for higher-level *investment* in lower-level capacity (enablement). This divergence often remains implicit, leading to policy deadlock.

  **2. Why Existing Answers Fall Short:**
  Current subsidiarity tests fail to adequately address the enablement dimension or the dynamic erosion of capacity, leaving the core tension unresolved:
  *   **"Necessity" & "Better-Achieved" Tests (EU, Germany):** Focus narrowly on *current* lower-level capacity ("cannot be sufficiently achieved"). They lack a mechanism to evaluate *potential* capacity development or mandate investment. The German court's reluctance to police *Erforderlichkeit* leaves this static view politically dominant. These tests are blind to how prolonged centralization (via standards, funding, expertise drift) can render the lower level *permanently* incapable, making abstention self-fulfilling.
  *   **Political Process Safeguards (US):** Relying on states' representation in federal institutions (e.g., Senate) assumes political bargaining protects local interests. It ignores situations where states, due to eroded capacity or fiscal dependence, *cannot effectively advocate* for their own enablement or resist centralizing pressures, even with representation. Process alone doesn't rebuild functional capacity.
  *   **Procedural/Burden-of-Proof Views:** Framing subsidiarity as merely requiring the higher level to *justify* intervention (common in EU practice) avoids the substantive question: justification based on *which* interpretation (abstention or enablement)? It provides a process but no clear substantive standard for what constitutes valid justification, allowing the underlying tension to persist.
  *   **Normative First Principles:** Abstract arguments about the intrinsic value of localism or efficiency don't resolve the practical clash between preserving existing local autonomy (abstention) and fostering effective local capability (enablement), especially when the latter requires initial higher-level action that *looks* like centralization.

  **3. Research Method: A Focused Comparative Analysis (Month-by-Month):**
  Given constraints (part-time, language, no primary research), this project employs a **structured, functional comparison** of four mature federal/supranational systems (US, Germany, Switzerland, EU), analyzing doctrinal tests and their application in specific policy domains. This avoids the infeasible depth of a full legal comparison and the detached nature of pure theory.

  *   **Months 1-2: Foundational Framework & Case Selection:**
      *   Deep dive into core legal texts (US Constitution, German Basic Law, Swiss Constitution, EU Treaties) and key judicial doctrines/rulings on competence allocation.
      *   Define "abstention" and "enablement" triggers operationally.
      *   Finalize selection of 3 policy domains: **K-12 Education Standards & Funding, Public Health Emergency Response (Pandemic), Greenhouse Gas Emission Reduction Targets & Mechanisms.** These exhibit clear competence overlaps, capacity demands, and historical centralization/backlash cycles.
  *   **Months 3-4: Mapping the Status Quo (Abstention Dominance):**
      *   For each system and domain, analyze how existing subsidiarity/competence rules *actually function*: How often does the abstention reading prevail? What evidence exists of capacity hollowing out? How do necessity/better-achieved tests operate in practice? (Sources: Case law, legislative debates, scholarly critiques).
  *   **Months 5-7: Developing the Counterfactual-Capacity Test:**
      *   Define key parameters: "Realistic Interval" (e.g., 5-10 years? Context-dependent?), "Genuine Capability" (beyond formal competence to effective implementation), "Targeted Investment" (funding, technical assistance, capacity-building programs).
      *   Construct a decision procedure flowchart incorporating the counterfactual question: "Could the lower unit(s) develop genuine capability within the realistic interval, given feasible higher-level investment, to perform Function X?".
      *   Identify factors influencing the answer (e.g., baseline capacity, fiscal resources, technical complexity, scale economies, spillover effects, political will at both levels).
  *   **Months 8-9: Testing & Synthesis:**
      *   Apply the draft counterfactual-capacity test *retrospectively* to key moments in each system/domain (e.g., US: NCLB/ESSA debates; Germany: COVID response laws; Switzerland: HarmoS concordat; EU: ERTMS railway standards). Would it have led to different outcomes than the standard tests?
      *   Analyze how varying the "time horizon" affects the outcome.
      *   Refine the decision procedure and synthesize findings across systems.
      *   Draft final deliverable.

  **4. Concrete Deliverable:**
  A **Subsidiarity Assessment Protocol (SAP)**, presented as a clear flowchart with explanatory guidelines, designed to help policymakers determine the appropriate level for a *new* or *contested* competence. The SAP will explicitly integrate the counterfactual-capacity question and time horizon sensitivity.

  *   **Worked Examples:**
      1.  **School Standards:** Abstention reading asks "Can states set adequate standards now?" (Often 'yes'). Enablement/counterfactual asks "Could states *develop* the capacity to set *and effectively implement/evaluate* genuinely adequate, equitable standards within 7 years, given federal funding for data systems, teacher training, and assessment development?" (Answer might be 'no' without investment, justifying initial federal role in setting minima/capacity-building).
      2.  **Pandemic Response:** Abstention: "Can states run testing/vaccination now?" (Initial COVID: Often 'no'). Enablement/Counterfactual: "Could states develop robust, coordinated PHE response capacity within 5 years given sustained federal investment in stockpiles, surveillance, and cross-state exercises?" (Answer 'yes' justifies abstention *after* investment; 'no' might justify permanent federal reserve capacity).
      3.  **Climate Targets:** Abstention: "Can states reduce emissions sufficiently?" (Often contested). Enablement/Counterfactual: "Could states/cantons develop capacity to meet ambitious science-based targets within 10 years given federal R&D funding, technical assistance for grid integration/permitting, and a federal backstop carbon price?" (Answer likely varies by state capacity, justifying a mixed approach: federal targets/backstop + enablement investment).

  **5. Possible Conclusions & Deciding Factors:**
  *   **Strong Validation:** The counterfactual-capacity framework proves essential and distinct, resolving tensions by making enablement operational and exposing time-horizon sensitivity as a key variable. The SAP offers a superior decision tool. *Decider:* Does the framework yield consistent, normatively compelling answers distinct from static tests or proportionality?
  *   **Partial Validation:** Enablement is a crucial *dimension* but collapses into proportionality analysis (balancing the cost/benefit of higher-level investment vs. the value of local autonomy regained). Time horizon remains critical. *Decider:* Is the logic of *investment for future local capability* fundamentally different from standard efficiency/necessity proportionality?
  *   **Limited Utility:** Differences between systems are too entrenched; the framework merely restates the burden-of-proof question ("Who must prove capacity exists/can be built?"). *Decider:* Does applying the SAP reveal consistent patterns *across* systems, or just reflect existing doctrinal starting points?
  *   **Enablement Requires New Mechanisms:** The SAP highlights that existing systems lack adequate institutions for sustained, accountable higher-level investment in lower-level capacity without domination. *Decider:* Does the analysis show the framework is *institutionally feasible* within current systems, or does it require radical redesign?

  **6. Honest Assessment: Failure Conditions & Scope:**
  *   **Failure Condition 1 (Core Risk):** Enablement is deemed indistinguishable from standard proportionality analysis ("Is higher-level intervention *necessary and proportionate* to achieve a legitimate goal?"). The counterfactual element adds little, and the time-horizon insight, while valid, doesn't fundamentally reshape subsidiarity doctrine. Success hinges on demonstrating the unique logic of *investment for future local agency* versus *immediate central efficiency*.
  *   **Failure Condition 2 (System Specificity):** The analysis concludes that the abstention/enablement tension is overwhelmingly determined by pre-existing system-specific rules (e.g., US enumerated powers vs. EU conferred powers) or political culture, making a general framework impractical. The SAP would then be merely descriptive of existing biases.
  *   **Scope Limitations:**
      *   **Systems:** Focuses solely on US, DE, CH, EU. Findings may not translate to asymmetric, developing, or highly centralized federations.
      *   **Normative Foundation:** Accepts subsidiarity/localism as desirable; doesn't argue first principles for it.
      *   **Feasibility:** The SAP provides a *decision logic*, not a political strategy. It identifies *what should be done* to satisfy subsidiarity dynamically, not *how* to achieve it politically.
      *   **Implementation Cost:** The framework identifies necessary investments but doesn't model their fiscal or political feasibility in depth.
      *   **"Realistic Interval":** Defining this remains somewhat subjective, though context-specific guidelines can be developed.

  This research offers a novel lens to cut through decades-old federalism deadlocks. By rigorously testing the counterfactual-capacity framework against real-world cases in diverse systems, it seeks to transform subsidiarity from a static veto into a dynamic principle for building effective, resilient multi-level governance.
