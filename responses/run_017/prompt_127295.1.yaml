  ### Deliverable

  **Scenario: The Conjecture and the Launch**

  You are a backend engineer working on a critical system that will be used in a rocket launch. The system has a module that relies on the truth of a mathematical property P: "The Collatz conjecture holds for all integers up to 10^100." If P is true, the module will work perfectly and the launch will be a success, worth $200,000 in value to the company. If P is false, the module will fail and the rocket will crash, costing the company $500,000 in damages. 

  You have two immediate choices:
  - A: Use the module and proceed with the launch.
  - B: Use a safe, slower, and less efficient module that guarantees a successful launch but with reduced value of $100,000.

  Additionally, you can spend 3 days to run a computation that will definitively check whether P is true or false. The computation costs $5,000 in cloud resources and delay. After the computation, you can choose A or B based on the result.

  You are not sure about P. Based on the fact that the Collatz conjecture has been verified for a vast number of cases and no counterexample has been found, you and your team assign a 90% probability to P being true (so a 10% chance that there is a counterexample between 10^50 and 10^100). You also know that the full Collatz conjecture (property Q) is not yet proven, but you assign a 60% probability to Q (which entails P) and a 30% probability to not Q and P (because the first counterexample might be above 10^100), hence P(P) = 90%.

  **Analysis per Framework**

  (a) Strict Bayesian framework: 
     In this framework, the agent assigns a sharp credence of 0 or 1 to every mathematical fact. Therefore, the agent already knows whether P is true or false. If P is true, the agent chooses A immediately and gets $200,000. If P is false, the agent chooses B immediately and gets $100,000. The agent sees no value in running the computation because it provides no new information (they already know P). Thus, they never run it.

  (b) Bounded agent with logical uncertainty:
     The agent has a credence of 90% that P is true. 
     - If they act immediately: 
          EU(A) = 0.9 * 200,000 + 0.1 * (-500,000) = 180,000 - 50,000 = 130,000
          EU(B) = 100,000
          So they choose A and expect 130,000.
     - If they run the computation and then act:
          They will learn P. If P is true (90% chance), they then choose A and get 200,000 - 5,000 = 195,000.
          If P is false (10% chance), they then choose B and get 100,000 - 5,000 = 95,000.
          EU(run) = 0.9*195,000 + 0.1*95,000 = 175,500 + 9,500 = 185,000.
     Since 185,000 > 130,000, they choose to run the computation.

  (c) Judged from outside by someone who shares the same uncertainty (i.e., with a prior of 90% that P is true), the expected utility of running the computation (185,000) is higher than not running it (130,000). Therefore, the bounded agent who runs the computation does better in expectation than if they had not run it.

  **The Single Feature Doing the Work**

  The key feature is that the bounded agent has intermediate credences in a mathematical fact that can be decided by a computation. This allows them to value the computation because it will change their credence to 0 or 1, which in turn allows them to take the optimal action with certainty and avoid a potentially catastrophic loss. If we remove the intermediate credences (i.e., if the agent were to assign 0 or 1 without justification), then the agent would not run the computation and might take a big loss if their assignment is wrong.

  **Strongest Pushback and Whether It Lands**

  Pushback: "The bounded agent's intermediate credences are just made up. They don't correspond to any objective probability. In particular, the mathematical fact is either true or false, so the only coherent probabilities are 0 or 1. If you assign 0.9, a bookie can Dutch-book you by selling you a bet that pays $1 if P is true for $0.9, and then when you learn that P is true, you'll have to admit you were wrong and the bookie profits from your state of mind. But that's not a Dutch-book in the usual sense because the bet is settled when the truth is revealed. However, if there is a market at the time of the decision, the bookie can offer a bet that is fair by your lights but that you will lose money on in expectation over many such situations. For example, the bookie offers you a bet that pays $0.1 if P is true and costs you $0.9 if P is false. You would accept because you think the expected value is 0.9*0.1 - 0.1*0.9 = 0. Then, in 90% of the cases, you pay $0.1 for nothing, and in 10% of the cases, you get $0.9. But wait: if P is true, you get $0.1 from the bookie? Let's define the bet clearly. Actually, a Dutch-book would be: the bookie sells you a ticket for $0.9 that pays $1 if P is true and $0 if false. You think that's fair because you assign probability 0.9. But then if P is true, you get $1 for a net $0.1, and if P is false, you lose $0.9. But then over many such independent bets, you will lose money because in the 10% where P is false, you lose $0.9, and in the 90% where true, you gain $0.1, so expected net gain for you is 0.9*0.1 + 0.1*(-0.9) = 0.09 - 0.09 = 0. So you break even. Therefore, you are not Dutch-booked in the long run. The pushback might be that the probabilities are not 'frequency probabilities', but the bounded agent can be Dutch-booked in a single shot if the bookie knows the truth. But the bookie is also bounded and doesn't know the truth. So in this case, the bounded agent is not vulnerable to Dutch-booking by a bookie who has the same computational limitations. Therefore, the pushback does not land because the bounded agent's assignments are not incoherent in a way that can be exploited by a computationally bounded bookie.

  **Addressing the Relaxation of (c)**
  In the analysis above, we showed that the bounded agent does better by running the computation than by not running it. We did not directly compare to the strict Bayesian agent's performance because, as explained, the strict Bayesian agent will always do at least as well as the bounded agent. However, the bounded agent cannot be a strict Bayesian agent because they are computationally bounded. Therefore, the relevant comparison is between the options available to the bounded agent, and running the computation is the better choice.
