  ### Decision Tree for Perception & Cognition Studies

  **Tree Structure** (7 nodes, 8 leaves; nodes are numbered for reference)  
  - **Node 1:** Was there an adaptation period (e.g., prolonged exposure to altered input)?  
    - **Yes** → Leaf: **Recalibration**  
    - **No** → Node 2  
  - **Node 2:** Was the stimulus unclear or ambiguous during the effect?  
    - **Yes** → Node 3  
    - **No** → Node 4  
  - **Node 3:** Did the effect vanish when the stimulus was clearer?  
    - **Yes** → Node 5  
    - **No** → Leaf: **Recognition Effect**  
  - **Node 4:** Did the experiment show that discrimination ability was unchanged?  
    - **Yes** → Leaf: **Response Bias**  
    - **No** → Node 6  
  - **Node 5:** Did subjects receive a specific label about the stimulus?  
    - **Yes** → Leaf: **Ambiguity**  
    - **No** → Leaf: **Recognition Effect**  
  - **Node 6:** Is there evidence that attention patterns changed?  
    - **Yes** → Leaf: **Attention Effect**  
    - **No** → Leaf: **Constitutive Inference**  
  - **Node 7:** (Unused branch) → Leaf: **Artifact**  

  **Reader-Facing Node Questions** (under 20 words, no jargon):  
  1. **Node 1:** *Did participants experience altered sensory input (e.g., special glasses) for several minutes?*  
  2. **Node 2:** *When the effect happened, was the stimulus hard to see or vague?*  
  3. **Node 3:** *If the stimulus was clearer, did the effect disappear?*  
  4. **Node 4:** *Could subjects still tell stimuli apart just as well?*  
  5. **Node 5:** *Were subjects told what the stimulus was before seeing it?*  
  6. **Node 6:** *Did how or where subjects looked change?*  
  7. **Node 7:** *Was there a major flaw (e.g., uncontrolled factor) in the experiment?*  

  **Leaf Labels & Glosses** (with awkward implication):  
  - **Sensory Effect:** *Belief/expectation alters raw sensory signals.*  
    - *Awkward: Sensation isn't objective—it's shaped by your mind.*  
  - **Recognition Effect:** *Experience stays the same, but interpretation changes.*  
    - *Awkward: What you "see" is just your brain labeling things.*  
  - **Attention Effect:** *Only where/when you look shifts, not experience.*  
    - *Awkward: You didn't see differently—you just sampled differently.*  
  - **Response Bias:** *Only the report shifts (e.g., due to guessing).*  
    - *Awkward: Subjects aren't lying—they're misreporting unknowingly.*  
  - **Recalibration:** *Recent exposure rewires perception, not current beliefs.*  
    - *Awkward: Perception isn't about "now"—it's stuck in the past few minutes.*  
  - **Ambiguity:** *Stimulus too vague for a "true" experience.*  
    - *Awkward: There's no fact about "what was seen"—only guesses.*  
  - **Constitutive Inference:** *Perception is inference; no line exists.*  
    - *Awkward: There's no "pure" perception—it's all interpretation.*  
  - **Artifact:** *The effect isn't real; it's experimental noise.*  
    - *Awkward: The study failed—there's nothing to explain.*  

  ---

  ### Study Classifications
  1. **Hungry vs. Fed Subjects (Food Naming):**  
     - Node 1: No (no adaptation) → Node 2: Yes (80 ms is ambiguous) → Node 3: Yes (gone at 500 ms) → Node 5: No (no label given) → **Leaf: Recognition Effect**.  
     - *Why: Hunger biases naming at brief exposures, but not sensation.*  

  2. **Prism Glasses (Judging Straight-Ahead):**  
     - Node 1: Yes (20 min adaptation) → **Leaf: Recalibration**.  
     - *Why: Shift persists post-exposure, independent of current belief.*  

  3. **Blurred Duck/Rabbit (Label Influence):**  
     - Node 1: No → Node 2: Yes (extreme blur) → Node 3: Yes (gone at mild blur) → Node 5: Yes (label given) → **Leaf: Ambiguity**.  
     - *Why: Extreme blur makes the stimulus uninterpretable; labels guide guesses.*  

  4. **Tone Paired with Shock (Loudness Rating):**  
     - Node 1: No → Node 2: No (clear tone) → Node 4: Yes (discrimination unchanged) → **Leaf: Response Bias**.  
     - *Why: Fear shifts "louder" reports, not actual loudness sensitivity.*  

  5. **Radiologists (Nodule False Alarm):**  
     - Node 1: No → Node 2: No (clear image) → Node 4: No (discrimination not measured) → Node 6: Yes (eye movements changed) → **Leaf: Attention Effect**.  
     - *Why: Expertise alters where they look, but experience might not change.*  

  ---

  ### Stuck Case & Unsticking Experiment
  - **Study 5 (Radiologists)** is stuck between **Attention Effect** and **Recognition Effect**.  
    - Why? We know eye movements differ, but not if controlling attention eliminates the effect. It could be attention *or* expertise altering recognition.  
  - **Unsticking Experiment:** Force identical eye movements (e.g., eye-tracking with gaze-contingent display). If false alarms persist, it’s **Recognition Effect**; if they vanish, it’s **Attention Effect**. Cost: ~$20K for eye-tracking setup + participant fees.  

  ---

  ### Unoccupied Leaf Combinations
  The tree allows 8 paths (one per leaf), but only 5 are occupied by the studies. Missing combinations:  
  1. **Node 3 → No** → **Recognition Effect** (effect persists in clear conditions):  
     - *Status: Untried.* Plausible (e.g., if hunger altered food recognition even at long exposures).  
  2. **Node 6 → No** → **Constitutive Inference** (no attention change, but effect exists):  
     - *Status: Unattractive.* Implies perception *is* inference—no clean separation.  
  3. **Node 7 → Artifact** (major flaw detected):  
     - *Status: Untried.* None of these studies had obvious flaws.  

  **Incoherent Combinations?** None—all paths are logically possible but may require specific designs (e.g., **Sensory Effect** needs neural data).  

  ---

  ### Inseparable Leaves & Key Node
  - **Inseparable Pair:** **Sensory Effect** vs. **Recognition Effect** without neural/physiological data. The tree cannot split them—both rely on downstream reports.  
  - **Key Node:** **Node 2 (stimulus ambiguity)** carries the most weight. It splits studies into early-processing (degraded/ambiguous) vs. late-processing (clear) paths, covering 4/5 studies.  

  ---

  ### Tree Visualization
  ```  
  Node 1 (Adaptation?)  
  ├─ Yes → Recalibration  
  └─ No → Node 2 (Ambiguous?)  
     ├─ Yes → Node 3 (Cleared?)  
     │  ├─ Yes → Node 5 (Label?)  
     │  │  ├─ Yes → Ambiguity  
     │  │  └─ No → Recognition Effect  
     │  └─ No → Recognition Effect  
     └─ No → Node 4 (Discrimination unchanged?)  
        ├─ Yes → Response Bias  
        └─ No → Node 6 (Attention changed?)  
           ├─ Yes → Attention Effect  
           └─ No → Constitutive Inference  
  ```  
  *Artifact and Sensory Effect are unreachable with these studies; Node 7 (flaw-check) would branch to Artifact if added.*
