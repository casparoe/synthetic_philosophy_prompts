prompt: |-
  I run a volunteer forecasting group, about 45 people, mostly folks who found their way here via the Sequences, and we field a fresh set of questions every month. I'm the moderator, which means every single month I hit the same structural thing: two members disagree, they've both read each others reasoning, and the thread has stopped producing anything. I've got maybe 20 minutes per case, the members are unpaid and have no formal training beyond blog posts, and whatever I decide I have to post publicly as a one-line justification in the channel. So I need something better than vibes.

  What I want is a decision procedure I can actually run, grounded in what the actual literature on this says — the Aumann-style agreement results, common priors, and the fact that those results are proved for small worlds in roughly Savage's sense, where the space of possible states is already on the table before anyone starts. My questions are basically never like that. Nobody can enumerate the states in advance, half of what matters gets discovered mid-round (including, sometimes, what the resolution criteria turn out to even mean), and a lot of the genuinely good evidence is the kind you can't hand to another person: I've been reading this lab's commits for a year and it feels slower than the roadmap implies, that sort of thing. Call that *unportable* evidence, versus portable evidence you can paste into a message. I think that distinction is doing a lot of work in practice and I want the procedure to have an explicit slot for it.

  So give me: the questions to ask in order, what counts as a settled answer to each one, where the procedure outputs stop, this thread is finished, average the two numbers and move on, and where it outputs that a human has to decide because it's a values call rather than a factual one. Then run it on three real cases from last month:

  1. Whether a given lab ships a named product by a hard date. Both sides have portable evidence, they've traded links twice, and they're still at 70 and 30.
  2. A domain insider with only unportable evidence at 60 versus an outsider with a clean base-rate argument at 25. I want you to run this honestly even if it lands on average them and move on, which I'll hate, because I privately think the insider is right.
  3. A dispute about whether the resolution text covers an obvious loophole case. My instinct is that this is a pure wording fight and I should just clarify and move on; tell me if the procedure says it's something worse.

  Finish by telling me plainly what the procedure can't do, especially whether it can distinguish these two have genuinely different priors from one of them is being lazy or playing status games. Hard cap of 700 words, and lead with the checklist itself — I'll skim the cases afterwards.
reasoning: |-
  We are designing a decision procedure for resolving forecasting disagreements in a volunteer group. The procedure must account for:
  - Limited time (20 minutes per case)
  - No formal training of members
  - Public one-line justification
  - Distinction between portable and unportable evidence
  - The fact that questions are not in a small world (states not enumerable in advance, evidence discovered mid-round, unportable evidence)

  The procedure is inspired by Aumann-style agreement but adapted for real-world constraints.

  **Decision Procedure Checklist**

  1. **Check for Shared Understanding of the Question**  
     - Ask: "Do both forecasters agree on the exact wording and interpretation of the question, including the resolution criteria?"  
     - If NO:  
       - Moderator clarifies the question and resolution criteria publicly.  
       - Both forecasters update their probabilities accordingly.  
       - If the disagreement persists, go to step 2.  
     - If YES: Proceed to step 2.

  2. **Check for Exchanged Portable Evidence**  
     - Ask: "Have both forecasters shared all portable evidence (citable sources, data, links) that they consider relevant?"  
     - If NO:  
       - Request that they share any remaining portable evidence immediately.  
       - After exchange, if probabilities converge, stop.  
       - If not, proceed to step 3.  
     - If YES: Proceed to step 3.

  3. **Account for Unportable Evidence**  
     - Ask each forecaster: "Is your probability significantly influenced by unportable evidence (e.g., personal experience, private data) that you cannot share?"  
       - If either says YES:  
         - Ask them to describe the nature of the unportable evidence in general terms (without specifics) and explain why it justifies their probability.  
         - The other forecaster must then state whether they find this description credible and update accordingly.  
       - After this, if probabilities converge, stop.  
       - If not, proceed to step 4.

  4. **Check for Common Knowledge of Rationality**  
     - Ask: "After reviewing all evidence (portable and unportable descriptions), do both of you believe the other is updating rationally?"  
       - If both say YES:  
         - They should recognize that their disagreement implies different priors or interpretations, and they must average their probabilities.  
         - Output: Average and move on.  
       - If either says NO:  
         - Proceed to step 5.

  5. **Investigate Rationality Challenge**  
     - Ask the challenger: "Which specific step of the other's reasoning do you believe is irrational, and why?"  
     - The accused must respond to the challenge.  
     - Moderator judges:  
       - If the challenge is about a factual error (e.g., misreading a source): Correct the error and recalculate.  
       - If the challenge is about reasoning (e.g., flawed logic): Determine if it's a values call or a factual error.  
         - If it's a values call (e.g., weight given to unportable evidence), then output: Human moderator decides (with justification).  
         - If it's a factual error, correct and recalculate.  
       - If unresolved, go to step 6.

  6. **Final Resolution**  
     - If the disagreement persists:  
       - Check if it's due to differing priors (irreducible) or non-rational behavior.  
       - If differing priors: Average the two probabilities.  
       - If non-rational behavior (e.g., status games, laziness): Moderator assigns a probability based on the more credible forecaster or averages if unclear.  
     - Output: Moderator's decision with one-line reason.

  **Procedure Outputs Stop When:**
  - In steps 1-3: If probabilities converge after an exchange, stop.
  - In step 4: If both agree the other is rational, average and stop.
  - In step 5: If resolved by correction, stop; if values call, human decides and stops.
  - In step 6: Average or moderator decides.

  **Now, applying to three cases:**

  **Case 1: Lab ships product by hard date (70 vs 30, portable evidence exchanged)**
  - Step 1: They agree on the question? (Assume yes)
  - Step 2: Portable evidence exchanged? Yes, twice. Proceed.
  - Step 3: Unportable evidence? Assume both say no (only portable). Proceed.
  - Step 4: Common knowledge of rationality? Assume both say yes. Then they must average: (70+30)/2 = 50. Stop.
  - Output: Average to 50. Justification: "After full exchange of portable evidence and mutual recognition of rationality, averaging applies."

  **Case 2: Insider (60, unportable) vs outsider (25, base rate)**
  - Step 1: Assume agreement on question.
  - Step 2: Portable evidence? Outsider has base rate (portable); insider may have some portable but also unportable. Exchange portable evidence. Assume still at 60 vs 25? Proceed.
  - Step 3: Unportable evidence? Insider says yes. Describe in general: "I've monitored this lab's commits for a year and observe slowdown patterns." Outsider must assess credibility. If outsider finds it credible, they update. Suppose outsider moves to 40? Then insider, recognizing the base rate, moves to 50? Then they might converge. But if not:
  - Step 4: Common knowledge of rationality? Suppose both say yes. Then average: (60+25)/2=42.5? But wait, after step 3, if updated, use new numbers. Suppose no update: then step 4 says average. 
  - However, if in step 3, the outsider does not find the insider's unportable evidence credible, then step 4: do they agree on rationality? If outsider says "insider is overconfident in unportable evidence" (challenge to rationality), then step 5: challenge. Moderator must judge: is this a values call (how much to weight unportable evidence) or factual? 
    - Factual error? Unlikely. It's about weight. Then moderator decides: "Given insider's domain expertise, we weight their unportable evidence higher, so use 60." Or if not, average. 
  - Since you privately think insider is right, but procedure must be fair: In step 5, if it's a values call, moderator decides. Justification: "Insider's unportable evidence is deemed more credible due to domain expertise."

  **Case 3: Loophole in resolution text**
  - Step 1: Check shared understanding. They disagree on whether the resolution text covers a loophole. So NO. 
  - Then moderator clarifies the resolution criteria publicly. 
  - After clarification, suppose one says "now I see it covers, so I update to 90%", the other says "still doesn't cover, 10%". Then we have a new disagreement. 
  - Proceed to step 2: Exchange evidence? They might have portable evidence about the wording. 
  - Step 3: Unportable? Probably not. 
  - Step 4: If both agree the other is rational, average. But if not, step 5. 
  - However, after clarification, if the disagreement is about interpretation, it might be a values call on wording. 
  - In step 5, moderator decides: "After clarification, the loophole is not covered, so the lower probability is more accurate" (or vice versa). 
  - Alternatively, if the clarification resolves it, they converge.

  **What the Procedure Can't Do**
  - It cannot perfectly distinguish between genuinely different priors and non-rational behavior (laziness, status games). Step 6 relies on moderator judgment.
  - It assumes forecasters are honest in their responses (e.g., about unportable evidence).
  - It may not handle deeply embedded disagreements where unportable evidence is core and credibility is contested.
  - It is time-bound (20 mins) so complex disputes may be forced to average or moderator fiat.

  **Final Note**
  The procedure is a pragmatic framework. It uses Aumann's insight that rational agents with common priors must agree, but when priors differ or evidence is unportable, averaging or moderation is needed. The key is to make unportable evidence as explicit as possible and judge credibility.
answer: |-
  ### Decision Procedure Checklist  
  **Apply steps in order; stop at any step if resolved. Time per case: 20 mins max.**  

  1. **Clarify question & resolution criteria (1 min)**  
     - Ask: "Do both agree on what the question means and how it will be resolved?"  
     - **Settled if YES**: Proceed to step 2.  
     - **Settled if NO**: Moderator publicly defines criteria. Forecasters update probabilities. If disagreement persists, proceed.  

  2. **Exchange portable evidence (5 mins)**  
     - Ask: "Have you shared all portable evidence (citable data, links, public sources)?"  
     - **Settled if YES**: Proceed to step 3.  
     - **Settled if NO**: Forecasters share evidence. If probabilities converge (<15% gap), stop. Else, proceed.  

  3. **Declare unportable evidence (5 mins)**  
     - Ask: "Is unportable evidence (e.g., private experience) affecting your view?"  
     - **Settled if NO**: Proceed to step 4.  
     - **Settled if YES**:  
       - Each describes evidence *generically* (e.g., "historical pattern in lab commits").  
       - Opponent must state if credible. If both accept, update probabilities.  
       - If gap persists, proceed.  

  4. **Assess rationality (4 mins)**  
     - Ask: "After steps 1-3, do you believe the other is reasoning rationally?"  
     - **Settled if YES**: Average probabilities. Stop.  
     - **Settled if NO**: Proceed to step 5.  

  5. **Resolve rationality challenge (5 mins)**  
     - Challenger specifies: "What step of their reasoning is irrational, and why?"  
     - Accused responds. Moderator judges:  
       - **Factual error?** Correct it; recalc probabilities. If resolved, stop.  
       - **Values clash?** (e.g., weighting unportable evidence) → Human decides. Stop.  
       - **Unresolved?** Proceed to step 6.  

  6. **Final call (if unresolved)**  
     - If likely differing priors: Average probabilities.  
     - If suspected non-rational behavior (e.g., laziness): Moderator picks most credible probability.  
     - Justify publicly in one line.  

  ---  
  ### Applied to Cases  
  **Case 1: Lab ships product (70 vs 30, portable evidence exchanged)**  
  - Step 1: Assume YES (agreed on question).  
  - Step 2: YES (evidence shared). Gap remains → Proceed.  
  - Step 3: Assume NO unportable evidence → Proceed.  
  - Step 4: If both accept rationality → **Average to 50%**. Stop.  
  - *Justification: "Full portable exchange; no unportable; rational priors differ."*  

  **Case 2: Insider (60, unportable) vs Outsider (25, base rate)**  
  - Step 1: Assume YES.  
  - Step 2: Exchange portable evidence (base rate). Gap persists → Proceed.  
  - Step 3: Insider declares unportable evidence (e.g., "lab commit patterns suggest delays").  
    - Outsider deems credible? If YES, both update (e.g., insider 55, outsider 40). If gap <15%, stop.  
    - Else (gap remains), proceed.  
  - Step 4: If both accept rationality → **Average to 42.5%**. Stop.  
    - *If rationality challenged*: Step 5 → Values clash (weighting insider evidence) → **Human decision**.  
    - *Your call: Pick insider’s 60%*. Justification: "Insider’s unportable evidence deemed high-credibility."  

  **Case 3: Loophole dispute**  
  - Step 1: **NO** (disagree on wording coverage).  
    - Moderator clarifies resolution criteria.  
    - If probabilities converge (e.g., both agree loophole invalid), stop.  
    - Else, proceed to step 2.  
  - Step 2: Exchange evidence (e.g., past rulings). If resolved, stop.  
  - *Likely outcome*: Clarification resolves it. If not, step 4 may force average, but **rarely reaches step 5** (not "worse").  
  - *Justification: "Question re-clarified; no further evidence."*  

  ---  
  ### What the Procedure Can’t Do  
  - **Distinguish priors vs. non-rationality**: Relies on self-reporting (step 4/5). Suspected laziness/status games may be misclassified as "differing priors" (averaged) unless explicit challenge (step 5).  
  - **Handle deeply unportable evidence**: If opponents reject unportable evidence (step 3), it defaults to averaging.  
  - **Solve ambiguous values clashes**: Human judgment required (step 5).  
  - **Guarantee truth**: Grounded in Aumann but pragmatic; assumes good faith. Non-common priors or non-rational players break ideal convergence.  
  - **Replace expertise**: Unportable evidence is heuristically weighted (step 3), not rigorously integrated.  

