  For the disagreements table, I'll structure it with five columns: the neutral crux wording, each adviser's signed position, a concrete test case, and their predictions. For the first crux about duty scope, I'll use the scenario where officials vote based solely on religious reasons despite secular arguments existing. The restrainingist would say this violates the duty while the inclusivist would say it's legitimate expression.

  On accessibility, I'll contrast the unanimous-believer jurisdiction and the natural-law theist case. The restrainingist views accessibility as inherent content while the inclusivist sees it as contextual acceptance. The asymmetry question needs examination of whether secular comprehensive doctrines face equal restraint - I suspect the restrainingist claims symmetry while the inclusivist points to practical disparities.

