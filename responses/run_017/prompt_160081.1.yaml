  | R3 | The theory must invalidate directives made during temporary impaired states (e.g., acute pain, mania) when the later self in a stable state disagrees. | Directive made in acute pain or mania. | non-negotiable | Views that do not consider the decision-making context of the directive. | - |
  | R4 | In dementia cases with current contentment, the theory must prioritize the current well-being and expressed wishes of the demented self over a prior directive if the directive would cause current suffering. | Standard dementia patient now content. | camp-preference | Views that prioritize the pre-dementia self's values absolutely. | R1, R2 |
