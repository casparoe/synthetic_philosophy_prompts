answer: |-
  ### Requirements for a Theory of Diachronic Authority  

  | id | requirement                                                                 | motivating_case                                                                        | status             | what_it_excludes                                                                 | conflicts_with |
  |----|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------|--------------------|----------------------------------------------------------------------------------|----------------|
  | R1 | Must prevent severe harm to the later self when stable and non-temporary.   | Directive for painful, non-beneficial treatment refused by a stable later self.         | non-negotiable     | Absolute authority of earlier selves; views ignoring current suffering.          | R2, R4         |
  | R2 | Must respect profound, stable value changes in the later self.              | Post-conversion/transition: later self rejects prior directive (e.g., blood transfusion). | camp-preference    | Strict self-governance; views denying normative weight to transformative changes. | R1, R4         |
  | R3 | Must invalidate directives made in temporary impaired states.               | Directive written in acute mania or withdrawal, refused in stable state.               | non-negotiable     | Views that ignore context of decision-making (e.g., "textualism").               | —              |
  | R4 | Must prioritize current well-being in dementia when content.                | Dementia patient now happy, refusing prior directive for life-ending intervention.      | camp-preference    | Views that elevate past autonomy over current experience.                        | R1, R2         |
  | R5 | Must resolve cyclical cases without privileging an arbitrary "true self."   | Values swing monthly; directive conflicts with current phase.                           | non-negotiable     | Views requiring a unified later self; theories relying on identity continuity.   | —              |
  | R6 | Must distinguish authority from personal identity.                          | Identical person in coma: does prior directive bind, or is authority separate?          | non-negotiable     | Theories conflating metaphysical identity with normative power.                 | —              |
  | R7 | Must distinguish epistemic advantage (calmer/informed) from binding right.  | Earlier self knew more about treatment risks; later self disagrees.                     | non-negotiable     | Views reducing authority to better decision-making conditions.                   | —              |
  | R8 | Must accommodate procedural directives (e.g., "let my daughter decide").    | Directive delegates decisions to a surrogate, not specifying outcomes.                  | non-negotiable     | Outcome-focused theories ignoring decision-makers.                               | —              |
  | R9 | Must address whether experience or judgment of later self prevails.         | Demented patient feels content but says "I shouldn’t live like this."                   | camp-preference    | Views collapsing subjective experience and reflective judgment.                  | R4             |
  | R10| Must handle directives authorizing acts that wrong the later self.          | Directive: "Withhold food if demented," causing current suffering.                     | non-negotiable     | Views where authorization always overrides permissibility.                       | R1             |

  ### Key Analysis  
  - **Most exclusionary**: R1 (non-exploitation) eliminates strict self-governance and identity-based views by forbidding harmful enforcement.  
  - **Unsatisfiable subset**: {R1, R2, R4} conflict. R1 blocks severe harm, R2/R4 demand deference to later selves in dementia/transformations—jointly impossible when enforcing a directive *causes* harm the later self rejects (e.g., forcing death on a content dementia patient).  
  - **Scorecard for views**:  
    - **Self-governance**: Fails R1, R2, R4 (ignores harm/value change).  
    - **Continuity**: Fails R5, R8 (struggles with cycles/procedural directives).  
    - **Procedural**: Best on R5, R8; but risks arbitrariness if surrogates ignore R1/R3.  

