prompt: |-
  ok so my friend Priya and I got into a genuinely long argument last night and I don't want someone to settle it, I want someone to settle what we were even arguing about. Her mom was just diagnosed with early-stage Alzheimer's and is going to a lawyer about an advance directive, and Priya is all the way on the side of: whatever her mom writes now has to bind the person her mom becomes, that IS the whole point of the thing, otherwise you're just letting the disease do the rewriting. I kept throwing cases at her where that feels obviously wrong and we went around in circles for two hours without ever stopping to ask what we were each demanding a theory of this even do. So please: you're a professional philosopher who works on personal identity and practical rationality — brainstorm the space of cases for a minute before you write anything, and don't just hand me the familiar four principles, I've read those.

  What I want is the spec. Concretely: what does a theory of diachronic authority — a theory of when an earlier self's directive binds a later self, and when it doesn't — have to deliver to be good enough to actually adjudicate a live dispute in a hospital room, where there's a current patient refusing something, a piece of paper saying she wanted it, and a surrogate standing there? Give me the requirements, each with the case or consideration behind it. I'll seed the case list so you know the territory I mean, but add ones I've missed: the standard dementia patient who now seems content and says she wants to live; the person whose values changed through something transformative (a conversion, a transition, becoming a parent) and who now says the earlier self didn't know what she was talking about; the request made in an obviously temporary state (acute pain, fresh grief, mania, week one of withdrawal); and two we invented that broke us — the cycling self, whose values swing every few months so there's no single "later" self to defer to and the answer depends on when you happen to ask, and the archival-self adjudicator, a model trained on everything she ever wrote or decided, which is asked whether her current refusal is a stable value change or a passing state. Say what must not be collapsed while you're at it: identity versus authority, the earlier self merely being better placed (calmer, better informed about which decision procedure to use) versus the earlier self having the right to settle it, directives about outcomes versus directives about who or what gets to decide later, the later self's experience versus the later self's judgment, waiving versus committing, and whether a directive can authorize something it would be wrong to do to her later. For each requirement tell me whether it's non-negotiable or a prejudice of one camp, flag any subset you think can't be jointly satisfied (that's the part I care most about), and tell me which single requirement does the most work at knocking views out.

  Format: a markdown table, one row per requirement, columns exactly id | requirement | motivating_case | status (non-negotiable or camp-preference) | what_it_excludes | conflicts_with (ids of other rows it can't be jointly satisfied with). Under the table, four to six lines max on which requirement is most exclusionary, which subset is unsatisfiable and why, and a very short scorecard for the three views we kept circling back to: the self-governance one (the earlier act of authoring is what makes it binding), the continuity one (identity isn't what matters, what matters is psychological and value continuity), and the procedural one (no temporal stage has authority, hand it to a surrogate, a process, or the adjudicator). Then a tiny JSON object with these fields: most_exclusionary (an id), unsatisfiable_subset (array of ids), and verdict_on_our_case — an object with adjudicator_legitimacy (one line on what, if anything, makes the archival-self model authorized) and cycling_self (one line on what a theory should even say when there's no unified later self). No citations or reading recommendations, we can't look anything up from here anyway.
reasoning: |-
  We are building a table of requirements for a theory of diachronic authority, i.e., when an earlier self's directive binds a later self.

  The user has provided several cases and considerations. We'll structure the requirements as follows:

  Each row will have:
  - id: a unique identifier (number)
  - requirement: a concise statement of what the theory must deliver or account for.
  - motivating_case: the case or consideration that gives rise to this requirement.
  - status: whether it's non-negotiable (i.e., any adequate theory must satisfy it) or a camp-preference (reflecting a particular viewpoint).
  - what_it_excludes: what kinds of views or principles this requirement rules out.
  - conflicts_with: the ids of other requirements that might be in tension (if any).

  We'll consider the cases mentioned and add any that seem missing.

  Cases from user:
  1. Standard dementia patient: now content, refuses treatment that earlier directive requested (e.g., life-ending).
  2. Transformative change: e.g., religious conversion, transition, becoming a parent; later self disavows earlier directive.
  3. Temporary state: directive made in acute pain, fresh grief, mania, withdrawal — later self in a stable state disagrees.
  4. Cycling self: values swing every few months (e.g., bipolar, or just cyclical values) — no unified later self.
  5. Archival-self adjudicator: an AI model trained on all past writings/decisions is asked to judge whether current refusal is stable or passing.

  Additional considerations (from user's list of what not to collapse):
  - Identity vs. authority: even if the same person, does the earlier self have authority?
  - Better placed (calmer, better informed) vs. having the right to settle.
  - Directives about outcomes vs. about who decides.
  - Later self's experience vs. later self's judgment.
  - Waiving (a right) vs. committing (to a course).
  - Can a directive authorize something that would be wrong to do to the later self?

  We'll try to cover these in the requirements.

  We also note the three views they circled:
  - Self-governance: the earlier act of authoring is what makes it binding.
  - Continuity: psychological and value continuity matters (not identity).
  - Procedural: hand to a surrogate or process.

  Now, let's brainstorm the requirements:

  1. **Non-Exploitation Requirement**: The theory must not allow an earlier self to impose a decision that would be seriously harmful or exploitative to the later self, especially when the later self is not in a temporary state. 
     - Motivating case: A directive that authorizes an experimental, painful treatment that the later self (now stable) refuses, and which is not in their best interest.
     - Status: Non-negotiable? (Arguably, to avoid abuse.)

  2. **Respect for Transformative Changes**: The theory must account for the possibility that a person's values can change so profoundly that the earlier self is no longer the same in a normatively relevant sense. The later self's current values should sometimes override the directive.
     - Motivating case: The transformative change (conversion, transition, becoming a parent).
     - Status: Camp-preference? (Some might say the earlier self has the right to bind the future; others that the new self is autonomous.)

  3. **Temporary State Exception**: The theory must not bind the later self when the directive was made in a temporary state that severely impaired decision-making, and the later self is now in a stable state.
     - Motivating case: Directive made in acute pain, fresh grief, mania, or withdrawal.
     - Status: Non-negotiable? (It's a standard condition for valid directives.)

  4. **Dementia Contentedness Exception**: In cases of dementia where the patient is now content and refuses life-ending treatment that was previously directed, the theory must not force the treatment if it would cause current suffering without a countervailing benefit to the current self.
     - Motivating case: Standard dementia patient.
     - Status: Camp-preference? (Some argue that the earlier self's wish for no life with dementia should prevail; others that the current self's well-being matters.)

  5. **Cycling Self Resolution**: The theory must provide a way to handle cases where the person's values cycle without a stable later self. It must not arbitrarily privilege one phase of the cycle.
     - Motivating case: The cycling self.
     - Status: Non-negotiable? (Because the case must be adjudicated.)

  6. **Adjudicator Legitimacy**: The theory must specify under what conditions an adjudicator (like the archival-self model) can be considered authorized, and what it means for it to be legitimate.
     - Motivating case: Archival-self adjudicator.
     - Status: Camp-preference? (Not everyone agrees that an AI model could be legitimate.)

  7. **Distinguish Identity and Authority**: The theory must not collapse personal identity (whether it's the same person) with authority (whether the earlier self has the right to bind the later self). They are separate questions.
     - Motivating case: General consideration (from user).
     - Status: Non-negotiable? (Because identity may not be sufficient for authority.)

  8. **Better Placed vs. Right to Settle**: The theory must distinguish between the earlier self merely being in a better epistemic position (calmer, better informed) and having a normative right to settle the matter for the future.
     - Motivating case: General consideration.
     - Status: Non-negotiable? (To avoid conflating two different justifications.)

  9. **Outcome vs. Procedural Directives**: The theory must account for directives that specify outcomes (e.g., "do not resuscitate") and those that specify who or what should decide (e.g., "let my daughter decide" or "use an AI model").
     - Motivating case: General consideration.
     - Status: Non-negotiable? (Because they function differently.)

  10. **Experience vs. Judgment**: The theory must address whether the later self's current experience (e.g., of contentment) or their current judgment (e.g., "I now value life even with dementia") should carry more weight when they conflict.
      - Motivating case: Dementia patient (experience: contentment; judgment: "I want to live").
      - Status: Camp-preference? (Different views.)

  11. **Waiving vs. Committing**: The theory must distinguish between a directive that waives a right (e.g., "I waive my right to refuse treatment in this condition") and one that commits to a course (e.g., "I commit to undergoing treatment").
      - Motivating case: General consideration.
      - Status: Non-negotiable? (Because they have different normative structures.)

  12. **Wrong to the Later Self**: The theory must consider whether a directive can authorize something that would be wrong to do to the later self, even if authorized.
      - Motivating case: General consideration.
      - Status: Non-negotiable? (To avoid serious harm.)

  We'll now try to condense and prioritize, aiming for around 10-12 requirements.

