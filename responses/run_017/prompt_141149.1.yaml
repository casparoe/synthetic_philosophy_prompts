prompt: |-
  I am writing the specification for an aggregation rule, and I want the requirements settled before I look at candidate rules. The setting: a resource-allocation system that must rank risky prospects affecting a group of people, where each person's preferences are represented by a von Neumann–Morgenstern utility function estimated from data, so the utility functions are cardinal only up to positive affine transformation, known only within error bars, and not interpersonally comparable by construction. The same rule must be applied to differently sized groups on different days, and it has to be defensible to the people it ranks — meaning the ranking has to be explainable to each of them in terms of their own utility numbers. Harsanyi's result is the obvious starting point: a social ordering over prospects that satisfies the expected-utility axioms together with Pareto indifference must be expressible as a weighted sum of individuals' utilities. My problem is that the theorem tells me the form of what I want and not whether that form is what I should want.

  So: give me the desiderata. For each requirement, the case or consideration that motivates it, and a verdict on whether it is non-negotiable or a preference of one camp. Tell me which of my candidate requirements are genuine and which are prejudices dressed as requirements; tell me which subset of the genuine ones cannot be jointly satisfied, and which single requirement does the most to exclude candidates. Then, in no more than a short paragraph or a compact table, score four contenders: the unweighted sum; a concave (priority-weighting) transformation of the sum; a rule that evaluates each realized outcome vector separately for equality and only then takes expectations; and the same sum normalized by group size. Keep the scoring brief — the criteria are what I am paying for. Do not pad the answer with references or a reading list; I want the arguments.

  The cases I want any candidate rule to be tested against:

  1. Two people indistinguishable in every respect, one indivisible benefit. The system can allocate it to A outright, or flip a fair coin. By any anonymity condition the two outright allocations are equally good; by the sure-thing-style independence axiom on the social ranking, they are then also indifferent to the coin flip. So a rule of Harsanyi's form cannot treat the fairness of the chances as any improvement at all. Is valuing the fairness of chances a desideratum, or is it the confusion of ex ante equality with ex post equality? If it is a desideratum, which axiom has to go?

  2. The hard-to-please person. One person's utility across the relevant outcome range moves between 0 and 10, another's between 0 and 1, and the estimating procedure pins down a common unit in which both are measured. Equal weights after normalizing each person's function to a common range, and equal weights in the pinned-down unit, give different rankings. Is invariance to independent affine rescaling a requirement that survives here, or should it be dropped when a natural unit is available — and if the weights are only meaningful relative to a normalization, what is the requirement that fixes the normalization?

  3. Disagreement about probabilities. The person affected thinks the risk of a bad outcome is 5 percent; the clinician setting the parameters thinks it is 25 percent. The two rank the same two acts in opposite order. State the Pareto requirement that applies here — unanimity over prospects evaluated at a single probability distribution, or unanimity over each person's own expected-utility ranking — and tell me whether a rule doing the former can still do the latter. I suspect these two cannot both hold, and I want the argument rather than the assertion.

  4. Noise. The utility estimates come with error bars, and any rule whose ranking flips when the inputs move inside their error bars is unusable. Is continuity in the inputs, or a stronger stability condition, a genuine desideratum or merely engineering convenience — and what does it cost, given that it appears to rule out thresholds, lexicographic priority, and other devices people reach for?

  5. Variable numbers of people. Decide between a small group each well above the relevant zero and a much larger group each barely above it, then say whether the same rule gives consistent verdicts when a decision affects one group size on Monday and another on Friday. Harsanyi's framework holds the population fixed; extending it is part of the specification. Say what the extension costs.

  6. Description invariance. Reducing a compound lottery to its single-stage equivalent, splitting one state into two with the same utility vector, or refining the state space in any way that leaves the induced joint distribution over realized utility vectors unchanged, must not change the ranking. State this precisely, and say whether it is in tension with anything on the list — in particular with the ex post equality concerns raised by case 1, and with the Pareto condition from case 3.

  7. Social risk aversion. Each person's own attitude to risk is already built into their utility function. Is there any remaining room for the social ranking to be risk-averse or priority-weighting with respect to the aggregate, or does that double-count something, and if so, is the appearance of double-counting an objection or a feature?

  Two further requirements I would like you to adjudicate rather than assume: that the rule determine its own weights, since the theorem fixes the functional form but leaves the weights free and a rule with free parameters is not a specification; and that the ranking be legible, in the sense that the person who loses out can be shown, in their own numbers, why the outcome they got was ranked below the one they wanted. Say whether legibility is a real desideratum, whether it is satisfiable by any rule of the weighted-sum family, and whether it conflicts with robustness in case 4.

  Close by telling me which requirement on your final list does the most exclusionary work, and which pair or triple of the requirements is jointly unsatisfiable — if the list turns out to be an impossibility result, that is the answer I most want, and I want it stated as such.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're designing an aggregation rule for a resource-allocation system that ranks risky prospects affecting groups. Each person's preferences are captured by von Neumann-Morgenstern utility functions, which are cardinal but only up to affine transformations. The system needs to handle different group sizes, and the ranking must be defensible to each individual in terms of their own utility numbers. 

  First, I need to understand the core challenge. The user mentions Harsanyi's theorem, which says that under certain axioms, the social ordering must be a weighted sum of individual utilities. But they're unsure if this form is actually desirable. They provided seven test cases to evaluate any candidate rule, and two additional requirements about self-determined weights and legibility.

  Looking at the cases: Case 1 deals with fairness in allocating an indivisible benefit. If two people are identical, allocating via a coin flip might seem fairer, but Harsanyi's approach would see it as indifferent to giving it outright to one person. This questions whether valuing fairness beyond outcomes is necessary, which might conflict with the Independence axiom.

  Case 2 involves normalizing utilities. If one person's utility ranges from 0-10 and another's from 0-1, should weights adjust for scale? The user is asking if invariance to affine transformations should hold even when a "natural" unit is estimated. This ties into how weights are determined, which is a big deal because the theorem leaves weights free.

  Case 3 is about probability disagreements. If individuals and a clinician have different risk assessments, whose probabilities should the social rule use? Pareto optimality usually assumes a common probability distribution, but here, each person might rank prospects differently based on their own beliefs. This could create tension between ex-ante and ex-post Pareto conditions.

  Case 4 addresses noise in utility estimates. If small changes within error bars flip the ranking, the rule isn't robust. Stability is crucial, but it might conflict with discontinuous rules like lexicographic orders. The user needs to know if this is a hard requirement or just practical.

  Case 5 is on variable group sizes. Harsanyi assumes fixed populations, but here groups change daily. Comparing a small well-off group vs a large barely-above-zero group requires extending the framework. They need to decide if average or total utility matters, which affects scalability.

  Case 6 is description invariance. The social ranking shouldn't change if you simplify compound lotteries or split states. But this might clash with valuing ex-post equality (like in Case 1) because it ignores how fairness is perceived in different descriptions.

  Case 7 asks if social risk aversion is needed beyond individual risk preferences. Since utilities already embed risk attitudes, adding more aversion might double-count. But maybe society wants to prioritize reducing inequality in outcomes, leading to concave transformations.

  The additional requirements: Self-determined weights mean the rule can't have free parameters. Legibility requires explaining losses in the individual's own utility terms. Both are tough; weights need normalization, and legibility might conflict if weights adjust based on others' utilities.

  Now, synthesizing desiderata. The non-negotiables seem to be Pareto Optimality (strong version), Anonymity, Statewise Dominance, and Description Invariance. Negotiable ones include Fair Chances (from Case 1), Scale Invariance (Case 2), Stability (Case 4), Population Scalability (Case 5), and Legibility. Social Risk Aversion (Case 7) is also negotiable.

  The biggest tension is between Strong Pareto (using individual probabilities) and Statewise Dominance/Description Invariance. If individuals have different beliefs, Strong Pareto might require different rankings per person, but Statewise Dominance needs a common probability. This might be impossible without assuming shared beliefs.

  Legibility conflicts with concave transformations. If you apply a concave function to the sum, explaining why someone lost out using their own numbers becomes messy because the weights aren't fixed. Stability might also be an issue with discontinuous rules.

  For the contenders: Unweighted sum (utilitarian) satisfies most axioms but fails Fair Chances and needs normalization. Range normalization handles scale but not probability disagreements. Concave transformation prioritizes equality but breaks Legibility and Description Invariance. Per capita sum helps with scalability but same issues as unweighted.

  The most exclusionary requirement is Strong Pareto with divergent beliefs. If individuals have different probability assessments, it's impossible to satisfy both Strong Pareto and Statewise Dominance. This might force adopting a common probability, which could be paternalistic. 

  Pairwise impossible combinations: Strong Pareto + Statewise Dominance when probabilities differ. Also, Legibility + Concave Transformation because the latter obscures individual trade-offs. Fair Chances + Independence since valuing fairness requires violating Independence in social preferences.

  The user's deep need is a defensible, consistent system under uncertainty. They need to know if an ideal rule exists or if trade-offs are inevitable. The impossibility highlights that without common probabilities, compromises are necessary. They might have to choose between respecting individual beliefs or having a coherent social ranking under a single probability model.
answer: |-
  Here are the desiderata, motivated by your cases, classified as non-negotiable (NN) or negotiable (N), followed by contender scores and key conflicts.

  **Desiderata & Motivation:**

  1.  **Anonymity (NN):** Case 1. Swapping individuals with identical utility functions and prospects must not change the ranking. Fundamental fairness.
  2.  **(Strong) Pareto Optimality (NN):** Case 3. If *every individual* ranks prospect X over Y using their *own* beliefs and utilities, society must rank X over Y. Core efficiency. *Verdict: Requires unanimity over each person's own EU ranking.*
  3.  **Statewise Dominance (NN):** Case 6. If a prospect yields a utility vector at least as good as another in *every possible state* and strictly better in some state (under a common probability description), it must be ranked higher. Fundamental rationality, implies Description Invariance. *Cost: Requires a common probability model.*
  4.  **Description Invariance (NN):** Case 6. Ranking depends only on the induced joint distribution over utility vectors, not the specific state space or lottery structure. Rationality requirement.
  5.  **Continuity / Stability (N):** Case 4. Small changes in estimated utility functions within error bars should cause only small changes in the ranking. Crucial for usability with noisy data. *Cost: Rules out thresholds and lexicographic orders.*
  6.  **Scale Invariance (Affine) (N):** Case 2. The social ranking should be invariant if any individual's utility function is rescaled (u_i' = a_i*u_i + b_i). Reflects non-comparability. *Conflict: Contradicts using a "natural" unit; weights become meaningless without normalization.*
  7.  **Population Scalability (N):** Case 5. The rule must consistently rank prospects involving different group sizes. Requires specifying how value scales with numbers. *Cost: Forces choice between total/average/something else.*
  8.  **Legibility (N):** Additional Requirement. The ranking of two prospects should be explainable to any individual using only *their own* utility differences across the prospects. Defensibility requirement. *Conflict: Violated if weights depend dynamically on others' utilities.*
  9.  **Self-Determination of Weights (N):** Additional Requirement. The rule must specify how weights are set based *only* on the estimated utility functions, not external parameters. Completeness requirement.
  10. **Fair Chances (N):** Case 1. Giving two identical individuals an equal chance of a benefit may be strictly better than giving it outright to one (even if ex-post outcomes are equivalent). Values process fairness. *Conflict: Violates Harsanyi Independence (a rational agent should be indifferent between compound/simple lotteries with same distribution).*
  11. **Social Risk Aversion / Priority (N):** Case 7. The social ranking may be averse to dispersion in the *distribution* of realized utility vectors, beyond individuals' own risk aversion. Values ex-post equality or priority to the worse off. *Conflict: Potential "double-counting" risk aversion; violates linearity of social welfare in utilities.*

  **Key Conflicts & Impossibilities:**

  *   **Strong Pareto + Statewise Dominance + Divergent Beliefs (Case 3):** *Impossible.* Strong Pareto uses individual beliefs; Statewise Dominance requires a common probability. If individuals rank prospects oppositely due to belief differences, Strong Pareto is silent or conflicted, while Statewise Dominance demands a specific ranking based on the common model. **You must choose: Drop Strong Pareto (use common model, violates individual beliefs) or drop Statewise Dominance (allow rankings inconsistent with any common model).**
  *   **Fair Chances (Case 1) + Harsanyi Independence:** Impossible. Fair Chances requires valuing the coin flip over the deterministic allocations. Independence implies indifference.
  *   **Legibility + Concave Transformation:** Conflict. Concave transformations (e.g., priority weighting) make the social aggregation non-linear in individual utilities. Explaining "why you lost" using *only* the individual's own utility differences becomes impossible; the explanation inherently depends on others' utilities and the transformation.

  **Most Exclusionary Requirement:** **Strong Pareto with Divergent Beliefs (Case 3).** Accepting it forces abandonment of Statewise Dominance/Description Invariance under belief disagreement. Rejecting it (adopting a common probability model) is a major, potentially paternalistic, exclusion.

  **Contender Scores (Brief):**

  | Contender                      | Anon | Pareto | StDom | DescInv | Cont | ScaleInv | PopScal | Legib | SelfWt | FairCh | SocRiskAv | Notes                                                                 |
  | :----------------------------- | :--- | :----- | :---- | :------ | :--- | :------- | :------ | :---- | :----- | :----- | :-------- | :-------------------------------------------------------------------- |
  | **Unweighted Sum (EU)**        | ✓    | ✗ (C)  | ✓     | ✓       | ✓    | ✗         | ✗ (T)   | ✓     | ✗      | ✗      | ✗         | Fails Strong Pareto (Beliefs), Scale Inv, Pop Scal (Total?), Fair Chances. |
  | **Range-Normalized Sum**       | ✓    | ✗ (C)  | ✓     | ✓       | ✓    | ✓        | ✗ (T)   | ✓     | ✓?     | ✗      | ✗         | Fails Strong Pareto (Beliefs), Pop Scal (Total?), Fair Chances.        |
  | **Concave Transform of Sum**   | ✓    | ✗ (C)  | ✗     | ✗       | ✗?   | ✗         | ✗ (T)   | ✗     | ✗      | ✗      | ✓         | Fails Strong Pareto, StDom/DescInv (non-linear), Legibility, Stability?. |
  | **Per Capita Sum (Avg EU)**    | ✓    | ✗ (C)  | ✓     | ✓       | ✓    | ✗         | ✓       | ✓     | ✗      | ✗      | ✗         | Fails Strong Pareto (Beliefs), Scale Inv, Fair Chances. Favors small groups. |

  **Legend:** ✓ = Satisfies reasonably well, ✗ = Fails, ✗ (C) = Fails if beliefs conflict (uses common prob), ✗ (T) = Fails if using Total Utility (favors large groups), ✓? = Satisfies only with specific normalization, ✗? = Likely fails. **Pareto** assessed as Strong Pareto. **PopScal**: "✓" indicates consistent scaling (here, averaging), not necessarily the "right" scaling.

  **Conclusion on Impossibility:** **The core impossibility is between Strong Pareto (respecting individual probability beliefs) and Statewise Dominance/Description Invariance (requiring a common probability model).** If individuals have divergent and relevant probability beliefs (Case 3), no rule can satisfy both sets of requirements simultaneously. You must decide whether individual belief sovereignty (Strong Pareto) or rational choice coherence under a single model (Statewise Dominance) is paramount. **This is the most fundamental constraint on your specification.** Other key tensions exist (Fair Chances vs. Independence, Legibility vs. Concave Transforms, Scale Invariance vs. "Natural" Units), but the probability conflict is foundational.
