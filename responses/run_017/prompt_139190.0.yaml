  Here’s a brainstorm of discarded readings:  
  1. *"White Savior critique"* – Too simplistic, as Paul Rusesabagina’s agency centers the film.  
  2. *"Western guilt narrative"* – Overemphasizes audience complicity, missing the structural critique of legal/political systems.  
  3. *"Heroic resistance parable"* – Ignores how the film undermines triumphalism through institutional betrayal.  

  **Your Frame & Scenes Tested:**  
  The three scenes powerfully support the student’s split by exposing the *failure* of the superlative to mobilize action:  
  - **Journalist scene (Daglish: "They’ll say 'horrible' and keep eating dinner")**: Explicitly shows the ranking function ("worst crime") failing its mobilizing purpose. The footage’s horror is acknowledged but inert.  
  - **UN Colonel Oliver’s mandate**: His refusal to intervene ("We’re peacekeepers, not peacemakers") hinges on the *absence* of the legal trigger ("genocide"). The term’s powerlessness is institutional, not semantic. The film confirms your observation: only Paul uses "genocide" (to General Bizimungu), as a raw moral indictment, not a legal category wielded by authorities.  
  - **Closing text (war crimes convictions)**: The legal record’s deliberate avoidance of "genocide" confirms the disconnect. The treaty term wasn’t invoked, so the duty to prevent/punish was evaded. The ranking’s mobilizing force proved irrelevant to real-world legal outcomes.  

  **The Film’s Resistance & Its Deeper Insight:**  
  Where the film resists the student’s split is in its **emotional architecture and implied audience contract**. It *is* a naming machine, but with crucial nuance:  
  - The horror *requires* the audience’s knowledge of the G-word to resonate. When Paul digs graves amid corpses, or when orphans sing while smoke rises over Kigali, the tragedy derives potency from the unspoken hierarchy. A neutral term ("ascriptive mass killing") couldn’t generate the same moral outrage the film depends on.  
  - Yet the film *knows* this hierarchy is exploited. Colonel Oliver’s line "You’re dirt to them" isn’t just racism; it’s a critique of how the ranking function is *applied selectively*. The film weaponizes the audience’s expectation of the superlative to indict its geopolitical withholding. It doesn’t dissolve the hierarchy; it exposes its weaponization. This isn’t a failure of nerve—it’s a strategic use of the hierarchy to reveal its hypocrisy. The film’s power lies in the gap between the audience’s moral certainty (this *is* genocide) and the world’s legal/political inaction.  

  **Closing Sentence:**  
  Hotel Rwanda concretizes the *human cost* of categorical failure—showing how legal evasion, semantic paralysis, and the ranking function’s hypocrisy conspire in real-time to enable atrocity, making abstract debates visceral through Paul’s desperate, embodied witness.
