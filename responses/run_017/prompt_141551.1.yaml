prompt: |-
  Our group of eight has to pick one of two vendors for a piece of equipment we'll be stuck with for years. Everyone is carrying private scraps of evidence — who has talked to which lab, who has sat through which demo — and none of us wants to argue it out in a meeting. My proposal was to run an internal pool: people stake modest real money on which vendor will look better after a year, and the group then buys whichever one the pool's odds favor.

  One colleague says the pool can't work. I should only want her money if I think I know something she doesn't, and she should only want mine under the same condition; so the very fact that someone is eager to take the other side of my bet is evidence that I have mispriced it. On that reasoning either no one trades and the pool tells us nothing, or someone trades and gets taken advantage of.

  Her proposed repair is that the group pay a flat bonus into every matched bet, split evenly between both sides, deliberately fixed in advance so that it does not vary with the odds or the stake — the idea being to compensate people for the risk of being the one who turned out to be wrong.

  Does a bonus like that actually answer her objection, or does it just pay us to be exploited? If it does work, how large does it need to be, and what does it cost us? And is her original worry sound at all, given that dispersed private information is the entire reason for running a pool instead of just voting?
reasoning: |-
  We are dealing with a situation where eight individuals have private information about two vendors and want to aggregate this information without having a meeting. The proposal is to set up a prediction market (internal pool) where people bet on which vendor will look better after a year. The group will then choose the vendor favored by the market odds.

  One colleague objects that in such a market, a trade only occurs if both parties believe they have an informational edge over the other. Therefore, the fact that someone is willing to take the other side of a bet is evidence that the bet might be mispriced, leading to the possibility of exploitation. She suggests adding a flat bonus to every matched bet, split between both sides, to compensate for the risk of being wrong.

  The questions are:
  1. Does the bonus answer her objection?
  2. How large does the bonus need to be?
  3. What does it cost the group?
  4. Is her original worry sound?

  Let's break down the problem.

  ### The Original Worry: No Trade or Exploitation
  In a standard prediction market without any subsidy, the colleague's argument is based on the "no-trade theorem" in economics. This theorem suggests that if all traders are rational and share common prior beliefs, then they will not trade because each trader interprets the willingness of another to trade as a signal that the other has superior information. As a result, they update their beliefs and no trade occurs. If trade does occur, it must be that one trader is making a mistake (being exploited) because the other has better information.

  However, in our setting, the traders have private information and might have different prior beliefs. Also, the goal is to aggregate the dispersed private information. The no-trade theorem assumes common priors and rational expectations. In practice, people might trade because they are overconfident or because they have differing risk tolerances. But the colleague's point is that without such behavioral factors, trade might not occur, and if it does, it might be due to an informational disadvantage.

  ### The Bonus Proposal
  The colleague suggests adding a flat bonus to every matched bet, split between both sides. This bonus is fixed in advance and does not depend on the odds or the stake. The idea is to compensate traders for the risk of being wrong, thereby encouraging trade even if traders are wary of being exploited.

  Let's consider a simple model:

  - Two possible outcomes: Vendor A wins (with probability p) or Vendor B wins (with probability 1-p). We don't know p, but each individual has a private signal about p.
  - In the prediction market, we set up a contract that pays $1 if Vendor A wins and $0 if Vendor B wins (or vice versa). Then the price of this contract in the market (say, q) can be interpreted as the market's probability that Vendor A wins.

  Without the bonus, if a trader believes the true probability is p and the market price is q, they will buy the contract if p > q and sell if p < q (assuming risk neutrality). However, the colleague's objection is that if the market price q is set by rational agents, then p should be equal to q (on average) and no trade occurs.

  With the bonus, suppose for every dollar staked in a matched bet (i.e., for every contract that is bought and sold at the same time), the group adds a bonus of b dollars, which is split between the two sides. So, if I buy one contract from you for $q (so I pay you $q and you owe me $1 if A wins), then the group adds b dollars. We split the bonus: I get b/2 and you get b/2. Therefore:

  - The effective cost to me (the buyer) is $q - b/2 (because I paid q but got b/2 back).
  - The effective revenue for you (the seller) is $q + b/2 (because you received q and also get b/2).

  Now, for me (the buyer), if I believe the true probability is p, then my expected profit from buying one contract is:
    p * (1) + (1-p)*0 - (q - b/2) = p - (q - b/2)

  I will buy if p > q - b/2.

  Similarly, for the seller, the expected profit is:
    [q + b/2] - [p*1 + (1-p)*0] = (q + b/2) - p

  The seller will sell if (q + b/2) - p > 0, i.e., if p < q + b/2.

  Therefore, trade occurs when there is a trader who believes p is above q - b/2 and another who believes p is below q + b/2. The interval [q - b/2, q + b/2] creates a range in which trade can occur even if the traders' beliefs are not too far apart. The bonus b effectively widens the spread at which trade is attractive.

  ### Does the bonus answer the objection?
  Yes, the bonus creates an incentive for trade by compensating for the risk of being wrong and by making trade profitable even if the traders' beliefs are within a band of the market price. Without the bonus, trade might not occur because of the no-trade concerns. With the bonus, trade can occur even if traders are not extremely confident in their private information. The bonus acts as a subsidy to trading.

  ### How large does the bonus need to be?
  The bonus must be large enough to induce trade. The minimal bonus would depend on the dispersion of beliefs and the risk aversion of the traders. However, we can think about the necessary condition: the bonus must make the trading band [q - b/2, q + b/2] wide enough to cover the differences in private beliefs.

  Suppose that the private beliefs of the traders are distributed with a standard deviation σ. We want the band to be at least as wide as the typical disagreement. A rule of thumb might be to set b such that the band width (b) is at least 2σ. However, without knowing the distribution, it is difficult.

  But note: the bonus is fixed in advance and does not depend on the odds or the stake. Therefore, we can set b to be a fixed dollar amount per contract. The challenge is that we don't know the scale of the stakes. If traders are only willing to bet small amounts, then a fixed bonus might be significant relative to the stake. If they bet large amounts, the bonus might be negligible.

  Alternatively, we can set the bonus as a percentage of the stake. However, the colleague's proposal says it should be fixed and not vary with the stake. This might be problematic because if the bonus is too small relative to the stakes, it might not be enough to induce trade. If it is too large, it might be expensive and also distort the market (e.g., traders might trade just to get the bonus even without strong information).

  Given the requirement of a fixed bonus, we might choose b to be a modest fixed amount per contract. For example, if we expect contracts to be traded in units of $10, then a bonus of $1 per contract might be significant.

  But note: the bonus is split between the two sides. So if we set b = $1 per contract, then each side gets $0.50.

  ### What does it cost the group?
  The group pays the bonus for every matched contract. The total cost will be the number of contracts traded multiplied by b. Since the bonus is fixed per contract, the cost depends on the trading volume.

  We cannot predict the trading volume in advance. However, we can set a cap on the total bonus pool to control costs. For instance, the group might allocate a fixed budget for the entire market, and once it is exhausted, no more bonuses are paid.

  Alternatively, we can design the market to have a fixed number of contracts per trader. For example, each trader can only trade a maximum of one contract (or a fixed small number). Then the maximum number of contracts traded is (number of traders) * (max contracts per trader) / 2 (if we assume each contract requires two traders). With eight traders, if each can trade up to 2 contracts, then maximum contracts is 8 (if each contract is between two different traders). Then the total cost would be 8 * b.

  But note: one contract might be between two traders and represent a stake of, say, $10. Then if b=$1 per contract, the total cost would be $8.

  ### Is her original worry sound?
  The original worry is sound in the context of rational expectations and common priors. The no-trade theorem is a well-known result. However, in practice, prediction markets often do work because of behavioral factors (overconfidence, differing risk tolerances) or because participants are not perfectly rational.

  Moreover, the goal of the pool is to aggregate private information, and prediction markets have been shown to be effective at this in many real-world settings. So while the theoretical objection is valid in an ideal rational-agent setting, in practice, with real people, we might see trade without a bonus.

  However, the bonus can help by explicitly compensating for the risk and by encouraging participation even if traders are risk-averse or worried about adverse selection.

  ### Summary
  1. The bonus does answer the objection by creating a band in which trade is profitable even without a large informational edge, thus encouraging trade and information aggregation.
  2. The bonus must be large enough to cover the typical difference in beliefs. Without knowing the distribution of beliefs, we might set it to a fixed amount that is a modest fraction of the typical stake (e.g., 10% of the expected stake per contract). But note the colleague's requirement: fixed in advance and not varying with the stake. So we set a fixed dollar amount. We might set b to be a small amount (like $1 per contract) and hope that it is sufficient to induce trade. Alternatively, we can run a trial with a small group to calibrate.
  3. The cost to the group is the total bonus paid, which is b times the number of contracts traded. We can cap the total trading volume to control costs.
  4. The original worry is sound in theory, but in practice, prediction markets might work without a bonus. However, the bonus can make it more robust, especially in a small group where the no-trade concerns are more pronounced.

  ### Implementation Suggestion
  - Each participant is allowed to trade up to a fixed number of contracts (e.g., 2 contracts per person).
  - Set the bonus b per contract to a fixed amount (e.g., $1 per contract).
  - The total cost is then at most (number of contracts traded) * $1. With 8 participants and 2 contracts each, the maximum number of contracts is 8 (if each contract is a pair of one buy and one sell). So maximum cost is $8.
  - The market can be run as a continuous double auction or using a market maker (like a logarithmic market scoring rule) to ensure liquidity. But the bonus is applied per matched trade.

  Alternatively, to simplify, we can run the market as a single call market: participants submit orders (bids to buy and asks to sell) for a fixed number of contracts (say, one contract per participant). Then we match the orders at a single clearing price. The bonus is then added per matched contract.

  After the market, we compute the market probability: if the market price for a contract that pays $1 if A wins is q, then the market probability for A is q. We then choose vendor A if q > 0.5, and vendor B if q < 0.5 (if q=0.5, we might flip a coin or use another tiebreaker).

  Note: we might have to run the market for both outcomes (A and B) simultaneously. Alternatively, we can have one contract that pays $1 for A and $0 for B, and then the price of that contract is the probability of A.

  ### Conclusion
  The bonus proposal is a reasonable solution to the colleague's objection. It should be implemented with a fixed bonus per contract that is set to a modest amount (like $1) and with a cap on trading volume to control costs. The total cost would be modest (e.g., less than $10 for the group) and the market can then aggregate the private information effectively.
answer: |-
  ### Addressing the Colleague's Objection and Bonus Proposal

  Your colleague's concern is rooted in the **no-trade theorem** from economics, which states that rational, risk-neutral traders with common prior beliefs won't trade because:
  - Each trader interprets the other's willingness to trade as evidence of superior information.
  - Trade only occurs if one party is irrational, misinformed, or acting on non-informational motives (e.g., risk preferences).
  Thus, either no trade happens (and the market fails), or trade occurs due to exploitation.

  The bonus proposal aims to circumvent this by subsidizing participation. Here's a breakdown:

  #### 1. **Does the bonus answer her objection?**
     **Yes, but imperfectly.**  
     - **How it helps:**  
       The bonus creates a "trading band" where participants can profit from trading even if their private information isn't dramatically better than the market's. For a bet at odds \(q\) (e.g., \(q = 0.6\) for a 60% chance of Vendor A winning):
       - A **buyer** (betting on A) will participate if their private probability \(p > q - b/2\).
       - A **seller** (betting against A) will participate if \(p < q + b/2\).
       Here, \(b\) is the fixed bonus per matched bet (split equally). This band \([q - b/2, q + b/2]\) widens the range where trade occurs, compensating for the risk of being wrong or facing adverse selection.
     - **Aggregation benefit:**  
       Traders with moderately divergent beliefs now have incentive to participate. As trades occur, the market price \(q\) updates to reflect aggregated information, ideally converging toward the "true" probability.

     - **Limitations:**  
       - **Overconfidence exploitation:** Highly overconfident traders may still exploit the bonus (e.g., trading aggressively on weak information to collect subsidies).
       - **Noise:** The bonus might attract low-information "noise traders," diluting price accuracy.
       - **Free-riding:** Participants might withhold strong information to avoid moving the market, then trade later for the bonus.

     **Verdict:** The bonus mitigates the no-trade problem but doesn't eliminate exploitation risk. It trades some efficiency for participation.

  ---

  #### 2. **How large does the bonus need to be?**
     **The bonus must cover the perceived risk of trading.**  
     - **Minimal size:**  
       - Let \(c\) be a trader's average uncertainty cost (due to risk aversion, fear of exploitation, or effort).  
       - Set \(b \geq 2c\). For example:
         - If traders view participation as a risky gamble worth $5 in compensation, \(b = $10\) per matched bet (split as $5 to each side).
       - In practice, start with \(b = $10–$20\) per bet for modest stakes (e.g., $50–$100 bets).

     - **Calibration:**  
       - Survey the group: "What bonus would make you willing to bet $100 despite fearing exploitation?" Use the average response.  
       - **Upper bound:** Set \(b\) to exceed the maximum belief divergence. If no trader’s probability estimate differs by >20% from the prior, \(b = 0.2 \times \text{stake}\) (e.g., $20 for $100 bets). Fixed bonuses work best with capped stakes (e.g., max $100/person).

     **Key:** The bonus should be large enough to make "marginal traders" (those with mild informational edges) participate.

  ---

  #### 3. **What does it cost the group?**
     **Cost = Total matched bets \(\times b\).**  
     - **Example:**  
       - 8 participants, each allowed 2 bets of $50 (max 8 matched bets).  
       - With \(b = $10\) per bet:  
         Total cost = \(8 \times $10 = $80\).  
       - Split equally: \($80 / 8 = $10\) per person.  
     - **Cost control:**  
       - Cap total bets (e.g., 1–2 per person).  
       - Use a call market (one-time clearing) to limit volume.  
     - **Value proposition:**  
       The cost ($10–$20/person) is cheaper than a bad vendor decision (which could cost thousands). View it as payment for information aggregation.

  ---

  #### 4. **Is her original worry sound?**
     **Yes, but overstated in practice.**  
     - **Theoretical soundness:**  
       The no-trade theorem is valid under idealized assumptions (rationality, common priors, no external incentives). In such a world, markets fail without subsidies.
     - **Practical counterpoints:**  
       - **Real-world behavior:** People trade due to overconfidence, differing risk tolerances, or non-informational motives (e.g., hedging, fun). Prediction markets often work despite the theorem.  
       - **Dispersed information:** The pool’s purpose is to aggregate fragmented knowledge. Even with limited trade, prices can update partially (e.g., if one informed trader moves the market).  
       - **Group dynamics:** Small groups may trade for social reasons (e.g., reciprocity) unrelated to information.  
     - **Conclusion:**  
       The worry is valid in strict theory, but in reality, **trade likely occurs without a bonus**—especially with modest stakes and engaged participants. The bonus is a safeguard, not a necessity.

  ---

  ### Recommendation: Implement with Modifications
  1. **Adopt the bonus:** Set \(b = $10–$20\) per matched bet, fixed in advance. Cap stakes (e.g., $50–$100/bet) and bets/person (e.g., 2).  
  2. **Minimize cost:** Use a single-round call market (submit bids/offers; match at equilibrium price).  
  3. **Enhance robustness:**  
     - Allow anonymous trading to reduce social pressure.  
     - Use a market maker (e.g., LMSR) to ensure liquidity if bilateral matching fails.  
  4. **Fallback:** If the pool has low participation, interpret it as "no consensus" and use a vote or external expert.

  **Final note:** The bonus subsidizes participation at a reasonable cost, addressing the core objection while harnessing your group’s collective insight. Without it, trade might still happen—but the bonus makes success more likely.
