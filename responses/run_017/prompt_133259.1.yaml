  Okay, the user is a philosophy and public policy professor teaching a seminar on catastrophic risk ethics and epistemology. They had an interaction with a hawkish security-studies colleague who made a sweeping statement that "nuclear weapons are unusable" and used it to support three different policy positions. The professor wants to disambiguate this claim rather than refute it, aiming for fairness in their next discussion.

  Hmm, this is a complex interdisciplinary puzzle blending philosophy, political science, and strategic studies. The professor has already sketched several possible interpretations of "unusable" - focusing on weapons, agents, relationships, processes, norms, or degrees of use. My task is to systematize these into distinct theses while adding analytical rigor.

  First, I need to map the conceptual terrain. The colleague's three applications of "unusable" create useful boundary markers: (1) modernization is wasteful, (2) extended deterrence is bluff, (3) proliferation isn't dangerous. But there's apparent tension with his other claim about deterrence being a robust empirical regularity. That tension might reveal which interpretation he actually holds.

  Let me brainstorm interpretations along a spectrum from weak to strong claims. Starting with the weakest: perhaps "unusable" just means nuclear weapons haven't been used since 1945 - which would make it compatible with deterrence theory but wouldn't support his policy claims. Then moving to moderate claims about strategic rationality (no first-use against nuclear peers) or escalation risks. The strongest claims would be absolute impossibility of use - which would directly undermine deterrence logic.

  For each thesis, I should include: precise formulation, plausibility assessment, falsification criteria, and policy relevance. The hawkish colleague's formal modeling background suggests he might favor rational-actor interpretations rather than psychological or normative ones. His policy positions point toward interpretations where weapons are "unusable" in ways that make threats non-credible.

  The key tension emerges between deterrence theory and strong unusability claims. If weapons are truly unusable, deterrence shouldn't work because threats lack credibility. But if deterrence does work (as he claims), then unusability must be conditional - perhaps weapons remain "usable" as threats precisely because they're not completely unusable in reality. This paradox needs unpacking.

  For the handout, I'll organize seven theses from least to most committal. Thesis 1 (historical non-use) is platitudinous but doesn't support his arguments. Theses 2-4 (strategic, psychological, political constraints) have more bite. Thesis 5 (absolute impossibility) is probably false and self-undermining for deterrence. The colleague likely meant Thesis 3 (strategic unusability against nuclear peers) which supports his policy views while remaining consistent with deterrence theory against non-nuclear states.

  I should explicitly flag where strong unusability claims undermine deterrence logic - showing how Thesis 5 makes the "robust empirical regularity" claim incoherent. For fairness, I'll note that Theses 3 and 4 could support his positions without internal contradiction. The handout will end with diagnostic questions to prompt reflection on what "unusable" must mean to avoid self-refutation.
answer: |-
  Here is a disambiguation of "nuclear weapons are unusable," structured as a numbered menu for your handout. The theses are ordered from **least committal (most plausible)** to **most committal (least plausible)**, with assessments of plausibility, falsifiability, policy relevance, and internal consistency.

  ---

  ### Disambiguating "Nuclear Weapons Are Unusable": Seven Theses

  **Thesis 1: Historical Non-Use**  
  *Claim*: No nuclear weapon has been used in conflict since 1945.  
  - **Plausibility**: Near-platitude (empirically true but trivial).  
  - **Falsified by**: Any nuclear detonation in anger.  
  - **Supports colleague’s claims?** No. Does not imply wastefulness, bluffing, or proliferation safety.  
  - **Consistent with deterrence?** Yes. Explains deterrence as a historical pattern.  

  **Thesis 2: Strategic Unusability**  
  *Claim*: Against nuclear-armed peers, first use would be irrational due to assured retaliation (mutual vulnerability).  
  - **Plausibility**: Defensible empirical claim (core of MAD theory).  
  - **Falsified by**: A rational first strike against a nuclear peer that succeeds without self-destruction.  
  - **Supports colleague’s claims?** **Partial support**: Explains modernization waste (weapons exist only for deterrence, not use) and proliferation safety (new arsenals face same constraints). *Does not* imply extended deterrence is a bluff (threats remain credible via retaliation).  
  - **Consistent with deterrence?** **Yes**. Deterrence *relies* on this rationality.  

  **Thesis 3: Escalatory Unusability**  
  *Claim*: Any nuclear use (even tactical/demonstrative) risks uncontrollable escalation to catastrophic exchange.  
  - **Plausibility**: Defensible empirical claim (widely held in IR).  
  - **Falsified by**: Limited nuclear use that does not escalate (e.g., demonstration strike accepted as "warning").  
  - **Supports colleague’s claims?** **Strong support**: Modernization wasteful (any use is too risky), extended deterrence bluffs (allies know escalation risk makes retaliation irrational), proliferation safe (new actors face same escalation dangers).  
  - **Consistent with deterrence?** **Tension**: If use is *unthinkably* risky, threats may lack credibility. But deterrence could still hold if leaders *believe* escalation is probable.  

  **Thesis 4: Political-Normative Unusability**  
  *Claim*: No leader could order nuclear use without facing catastrophic domestic/international backlash (e.g., loss of legitimacy, regime collapse).  
  - **Plausibility**: Defensible empirical/normative claim (strengthened by non-use tradition).  
  - **Falsified by**: Nuclear use that preserves the regime’s stability/legitimacy.  
  - **Supports colleague’s claims?** **Partial support**: Explains modernization waste and proliferation safety. *Undermines* "bluff" claim (if leaders *believe* backlash is inevitable, threats may be credible).  
  - **Consistent with deterrence?** **Yes**, if deterrence works via fear of consequences (including backlash).  

  **Thesis 5: Psychological Unusability**  
  *Claim*: No human leader could psychologically bring themselves to order nuclear use.  
  - **Plausibility**: Probably false (evidence: leaders have authorized atrocities; nuclear exercises simulate launch decisions).  
  - **Falsified by**: Any nuclear use order.  
  - **Supports colleague’s claims?** **Full support** but incoherently: If true, modernization *is* waste, deterrence *is* bluff, proliferation *is* safe.  
  - **Consistent with deterrence?** **No**: Deterrence requires credible threats. If leaders *cannot* use nukes, threats are empty.  

  **Thesis 6: Absolute Instrumental Unusability**  
  *Claim*: No nuclear use could achieve any political/military goal worth the costs (including retaliation, fallout, global condemnation).  
  - **Plausibility**: Probably false (e.g., decapitation strike *could* theoretically cripple a foe; some argue for tactical use in extremis).  
  - **Falsified by**: Nuclear use that achieves a net-positive outcome for the user.  
  - **Supports colleague’s claims?** **Full support**: Modernization wasteful (weapons can’t achieve goals), deterrence a bluff (threats lack credibility), proliferation safe (new weapons equally futile).  
  - **Consistent with deterrence?** **Self-undermining**: If weapons *cannot* achieve goals, they cannot deter. Contradicts "robust empirical regularity."  

  **Thesis 7: Categorical Unusability**  
  *Claim*: Nuclear weapons are physically, legally, or morally impossible to use under any circumstances.  
  - **Plausibility**: False (legally, IHL permits some hypothetical uses; physically, they function; morally, leaders may justify use).  
  - **Falsified by**: Any nuclear detonation in conflict.  
  - **Supports colleague’s claims?** **Full support** but absurdly overcommitted.  
  - **Consistent with deterrence?** **No**: Makes deterrence logically impossible.  

  ---

  ### Key Diagnostics:
  1. **Which readings support his three claims?**  
     - **Modernization as waste**: Theses 2, 3, 4, 5, 6, 7.  
     - **Extended deterrence as bluff**: Theses 3, 5, 6, 7.  
     - **Proliferation as safe**: Theses 2, 3, 4, 5, 6, 7.  
     *(Note: Thesis 2 does *not* support "bluff"; Theses 5–7 are self-undermining)*  

  2. **Consistent with "deterrence as robust empirical regularity"?**  
     - **Consistent**: Theses 1, 2, 4.  
     - **Tension**: Thesis 3 (if escalation risk makes retaliation *irrational*).  
     - **Inconsistent**: Theses 5, 6, 7 (deterrence requires credible *possibility* of use).  

  3. **Most likely meaning for a hawkish formal modeler?**  
     **Thesis 3 (Escalatory Unusability)**. It leverages rational-actor models (escalation = uncontrollable risk), supports his policy claims, and allows deterrence to hold via uncertainty—while dismissing "usable" options (e.g., tactical nukes) as illusions.  

  ### Core Tension Explained:
  If "unusable" means **weapons cannot be used** (Theses 5–7), deterrence collapses because threats lack credibility. But if deterrence is a "robust empirical regularity," it *requires* that adversaries believe use is possible/rational under some conditions. **Thesis 3** navigates this by asserting that *actual* use is irrational due to escalation risk—but the *threat* remains credible because leaders might miscalculate or accept risk. This preserves deterrence while treating "use" as a catastrophic error.  

  ---  
  *Handout design tip: Format this as a 2-column table (Thesis | Claim | Plausibility | Falsifiability | Policy Support) for quick scanning. Your colleague’s stance likely hinges on conflating Thesis 3 with stronger claims—gentle disentanglement should advance the debate.*
