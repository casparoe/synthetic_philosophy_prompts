prompt: |-
  I'm running a seminar on the 'equality of what?' question for final-years next term, and instead of opening with a lecture I want to hand them a sorting quiz: ten concrete cases, each with two or three options, and then a key that tells them which currency of equality they've just committed themselves to. Most of them will have read the obvious stuff, but I want the quiz to work for someone who's read nothing — so no question may name a theorist, a currency, or an -ism, and nothing like 'do you think we should equalise welfare or resources?'. Every question has to be a case a real person could have a gut reaction to.

  Cases I want in there (bin any you think are duds, but keep at least six): the person with expensive tastes who gets much less out of the same money; the cheerful person whose preferences have quietly adapted downwards; the wheelchair user and, separately, someone whose body just costs more to keep running; someone fasting for religious reasons next to someone with no food at all — I want that one in, it's the cleanest way at the capability-versus-functioning split; someone who took a gamble and lost versus someone hit by something they couldn't have insured against; someone with a superb set of options who can't act on any of them because of depression; someone whose prospects are modest but almost impossible to knock down versus someone whose prospects are great but collapse entirely if one thing goes wrong; and one whole-life-versus-time-slice case — brilliant sixty years then a miserable decade, or the reverse.

  What I need from the key:

  - Six to eight leaves, built from the logical space rather than from a list of names: start from the questions, show which combinations of answers are actually available, then drop the familiar views into the slots and tell me which slots are empty. For the empty ones say whether nobody lives there because the combination is unstable, merely unattractive, or just unclaimed.
  - The leaves have to include: an actual-welfare currency; an opportunity-for-welfare one (Arneson? don't sweat the attribution); a resources-or-means currency; the social-primary-goods sort of currency; a capability currency with an open or deliberately unspecified list; a capability currency with a fixed list; and something in the 'access to advantage' / 'midfare' region Cohen gestures at.
  - Two currencies I've been toying with that I want as leaves too, because without them people with perfectly coherent views get misfiled. One where the unit is your fallback position — the value of the worst place you could end up in, through no fault of your own, or through your own fault, say which you'd pick. One where the unit is recoverability: how fast and how fully you get back to your baseline after a setback, rather than the level of your prospects. Tell me honestly if either collapses into a leaf already on the tree, and if so which.
  - Flag any pair of leaves my tree genuinely can't separate. I suspect primary goods versus resources is going to be one, and I'd like to know whether the expensive-tastes and disability cases are enough to prise them apart or whether I need a question about talents and brute luck.
  - There'll be two or three sufficientarians and prioritarians in the room who'llanswer every case with 'who cares whether it's equal, what matters is that it's bad'. Give me one question near the start that catches them and routes them out of the currency tree, so they don't end up filed as welfarists by accident.

  Don't bother with paper titles, dates or exact attributions — I don't need them and I'd rather you spent the words on the cases. If you want to name a view in the key, use a rough label like 'the resources view'. And no quotations.
reasoning: |-
  Okay, the user is organizing a seminar on the 'equality of what?' question for final-year students. They want to start with a sorting quiz using concrete cases to help students identify which currency of equality they lean towards, without prior reading. Let me break down their requirements.

  First, they listed several cases but want me to filter out any duds and keep at least six. The cases include expensive tastes, adaptive preferences, wheelchair user versus high bodily maintenance costs, fasting vs. starvation, gambler vs. uninsurable accident, depression limiting options, stable modest prospects vs. fragile high prospects, and a whole-life vs. time-slice scenario. I need to ensure each case clearly differentiates between currencies. The fasting vs. starvation case is important for capability vs. functioning, so I should keep that. The expensive tastes and disability cases might help distinguish resources from primary goods. The depression case illustrates capability versus opportunity. The gambler case tests responsibility. The whole-life scenario addresses time frames. I should check if any cases are redundant or unclear. Maybe the wheelchair and high bodily costs could be merged, but they might highlight different aspects. The adaptive preferences case is crucial for welfare vs. resources. All seem useful, so I'll keep all eight.

  Next, the key needs six to eight leaves based on logical combinations from the cases. The user wants specific currencies covered: actual welfare, opportunity for welfare, resources, social primary goods, capabilities (open/fixed list), Cohen's midfare, plus their two additions: fallback position and recoverability. I need to map answers to these currencies without naming theorists. For example, choosing to compensate expensive tastes might indicate welfare equality, while not compensating points to resources. The fasting case: providing food to both suggests functioning, while respecting choice points to capability. The gambler case: helping the unlucky but not the gambler might align with responsibility-sensitive approaches. 

  The user's additional currencies: fallback position (worst-case scenario value) and recoverability (bounce-back speed). I need to check if these collapse into existing leaves. Fallback might relate to security in the prospects case. If someone values the robust but modest prospects, it could indicate a focus on fallback position. Recoverability might be distinct—focusing on resilience after setbacks, which isn't directly covered by other currencies. So a question about recovery speed could separate this view.

  For the key, I'll build a decision tree from the cases. Start with the prioritarians/sufficientarians question to route them out early. Then use the expensive tastes case to split welfare vs. resources. Disability cases distinguish resources from primary goods. Fasting case separates capabilities from functioning. Depression case differentiates opportunity from capability. Gambler case introduces responsibility. Prospects case addresses risk and fallback. Whole-life case considers time frames. 

  The user flagged that primary goods vs. resources might be hard to separate. Both might not compensate for expensive tastes, but primary goods might account for basic needs like health, while resources are more about all-purpose means. The disability cases can highlight this: wheelchair access might be seen as a primary good, whereas ongoing costs could be resources. Including a question about natural talents might help, but the existing cases might suffice. I'll note in the key if separation is unclear.

  For the additional currencies, fallback position: in the prospects case, choosing the stable modest option might align here. Recoverability could be a separate leaf if the depression case or gambler case touches on resilience. But if the quiz doesn't have a direct question about recovery, it might not be distinct. I should suggest a case where one person recovers quickly from a setback while another doesn't, but the user's cases don't include that. So recoverability might not be fully captured and could collapse into the prospects case. I'll mention this in the key.

  The key should show combinations and which currencies fit, noting empty slots. For example, compensating both expensive tastes and adaptive preferences might lead to actual welfare equality. Not compensating either points to resources. Compensating disability but not expensive tastes might be primary goods or capabilities. 

  Also, flag inseparable pairs. Primary goods and resources might overlap, but using the disability cases could help differentiate. If someone supports ramps for wheelchairs (primary good) but not extra income for high metabolism (resources), that shows a distinction. Otherwise, they might be grouped.

  Finally, the prioritarians question: asking whether absolute level matters more than equality should catch them early. Route them to a separate path so they don't skew the currency results.
answer: |-
  Here’s a streamlined sorting quiz and key focused on logical combinations, with clear cases and minimal jargon. I’ve kept all eight cases—they each pull distinct weight—and added a prioritarians/sufficientarians filter. The key builds currencies from your answers, then slots named views into the framework.

  ---

  ### **Sorting Quiz: "What Should We Equalize?"**  
  *Answer intuitively for each case. No prior knowledge needed.*

  1. **Expensive Tastes (Wine vs. Water):**  
     Alex needs expensive wine to enjoy life as much as Blake enjoys cheap water. Should Alex get extra resources?  
     ☐ **Yes**  ☐ **No**

  2. **Cheerful Deprivation (Adapted Preferences):**  
     Casey lives in poverty but has adapted to find joy in small things. Sam has more resources but is less content. Should Casey get fewer resources than Sam?  
     ☐ **Yes**  ☐ **No**

  3. **Wheelchair Access:**  
     Taylor uses a wheelchair and needs ramps/elevators to move freely. Should society cover these costs?  
     ☐ **Yes**  ☐ **No**

  4. **High Bodily Maintenance:**  
     Jordan’s body requires costly medication ($1k/month) just to function at a basic level (e.g., severe diabetes). Should society cover this?  
     ☐ **Yes**  ☐ **No**

  5. **Fasting vs. Starvation:**  
     A food bank serves two people: Priya (fasting voluntarily for faith) and Kai (starving with no food). Should both get equal food offers?  
     ☐ **Yes**  ☐ **No**  
     *If yes, should Priya be pressured to eat?* ☐ **Yes**  ☐ **No**

  6. **Gambler vs. Lightning Strike:**  
     Morgan gambled savings away; Riley lost savings to a freak accident. Both are now destitute. Should both get equal aid?  
     ☐ **Yes**  ☐ **No**

  7. **Depression & Opportunity:**  
     Avery has many opportunities (education, jobs, travel) but severe depression prevents acting on any. Blake has fewer options but uses all fully. Should Avery get extra support?  
     ☐ **Yes**  ☐ **No**

  8. **Fragile vs. Stable Prospects:**  
     Charlie has modest career prospects that are almost recession-proof. Dakota has high-earning potential but loses everything if their startup fails. Should society mitigate Dakota’s risk?  
     ☐ **Yes**  ☐ **No**

  9. **Whole-Life Equality:**  
     Two lives:  
     - **Life A:** 60 brilliant years, 10 miserable years at the end.  
     - **Life B:** 10 miserable years early, 60 brilliant years after.  
     Which life is worse *overall*?  
     ☐ **Life A**  ☐ **Life B**  ☐ **Equally bad**  

  ---

  ### **Prioritarians/Sufficientarians Filter (Route them out first!)**  
  *If you answered "Who cares about equality? Focus on minimizing suffering!" to most cases → **Stop here**. You’re a **Prioritarian/Sufficientarian** (you care about absolute well-being, not distribution).*

  ---

  ### **The Key: Your Equality Currency**  
  *Based on logical combinations of answers. Named views are approximations.*

  #### **Branch 1: Welfare Focus**  
  - **Actual Welfare View** (e.g., Utilitarianism)  
    - *Path:* Yes (Expensive Tastes) + Yes (Cheerful Deprivation)  
    - *Why?* You equalize felt experiences, not resources.  
  - **Opportunity for Welfare View** (e.g., Arneson)  
    - *Path:* No (Expensive Tastes) + Yes (Cheerful Deprivation) + Yes (Depression)  
    - *Why?* You equalize chances for happiness, not outcomes.  

  #### **Branch 2: Resources Focus**  
  - **Strict Resources View** (e.g., Dworkin)  
    - *Path:* No (Expensive Tastes) + No (Cheerful Deprivation) + No (High Bodily Maintenance)  
    - *Why?* Only external resources (money, tools) matter. Bodies are personal luck.  
  - **Primary Goods View** (e.g., Rawls)  
    - *Path:* No (Expensive Tastes) + No (Cheerful Deprivation) + **Yes** (High Bodily Maintenance) + Yes (Wheelchair)  
    - *Why?* You support basic needs/resources everyone requires (health, mobility), not preferences.  
    - *⚠️ Note:* Often conflated with Resources, but **High Bodily Maintenance** prises them apart. Resources views reject bodily aid; Primary Goods include it.

  #### **Branch 3: Capabilities & Functionings**  
  - **Capabilities (Open List) View** (e.g., Sen)  
    - *Path:* Yes (Wheelchair) + Yes (High Bodily Maintenance) + **No** (Pressure Priya to eat)  
    - *Why?* You equalize freedom to achieve functionings (e.g., mobility, nourishment), but respect choice.  
  - **Capabilities (Fixed List) View** (e.g., Nussbaum)  
    - *Path:* Yes (Wheelchair) + Yes (High Bodily Maintenance) + **Yes** (Pressure Priya to eat)  
    - *Why?* Certain functionings (like being nourished) must be achieved for basic justice.  
  - **Functionings View**  
    - *Path:* Yes (Wheelchair) + Yes (High Bodily Maintenance) + Yes (Priya/Kai get equal food) + **Yes** (Pressure Priya)  
    - *Why?* You focus on achieved states (being mobile, fed), not freedoms.  

  #### **Branch 4: Responsibility & Risk**  
  - **Luck Egalitarianism** (e.g., Cohen)  
    - *Path:* No (Help Gambler) + Yes (Help Lightning Strike) + Yes (Fragile Prospects)  
    - *Why?* You compensate bad brute luck, not choices.  
  - **Fallback Position View** (your custom currency)  
    - *Path:* Yes (Fragile Prospects) + **Life B** (early suffering worse)  
    - *Why?* You prioritize securing the worst-case scenario (e.g., Dakota’s collapse risk).  
    - *Stability:* Distinct. Focuses on downside protection, not average prospects.  

  #### **Branch 5: Midfare/Complex Equalities**  
  - **Access to Advantage View** (e.g., Cohen)  
    - *Path:* Mixed answers—e.g., Yes (Depression) + Yes (High Bodily Maintenance) + No (Expensive Tastes)  
    - *Why?* You focus on the "midfare" between resources and welfare (e.g., mental health support, medical care).  

  #### **Branch 6: Recoverability View** (your custom currency)  
  - *Path:* Yes (Depression) + Yes (Fragile Prospects) + **Life B** (early suffering worse)  
  - *Why?* You prioritize resilience—how quickly one rebounds from setbacks (e.g., Avery’s depression, Dakota’s collapse).  
  - *Collapse Risk?* Nearly merges with Fallback, but **Depression question** saves it. Fallback focuses on the *depth* of the worst case; Recoverability on *speed of rebound*.  

  ---

  ### **Empty Slots & Inseparable Views**  
  - **Empty Slot 1:** Yes (Expensive Tastes) + No (Cheerful Deprivation).  
    - *Why vacant?* Unstable—compensating chosen tastes but not adapted deprivation is arbitrary.  
  - **Empty Slot 2:** No (Wheelchair) + Yes (High Bodily Maintenance).  
    - *Why vacant?* Unattractive—aiding biological costs but denying social inclusion seems inconsistent.  
  - **⚠️ Inseparable Pair:** **Resources vs. Primary Goods** hinges *entirely* on High Bodily Maintenance/Wheelchair cases. If you answered identically for both, they collapse. *Solution:* Force a choice—e.g., "Should society cover *lifelong* medication costs?" (Primary Goods: yes; Resources: no).  

  ---

  ### **How to Use**  
  1. Students self-score using the key.  
  2. Group debates: "Why did Case 5 (Fasting/Starvation) split Capabilities and Functionings?"  
  3. Reveal named views *after* discussion to avoid anchoring.  

  This isolates gut reactions, covers your required currencies, and flags edge cases. The two custom currencies (Fallback/Recoverability) hold up if the depression and prospects cases are included. Let me know if you need tweaks!
