answer: |-
  ### Grading Summary  
  **Part (a): 6/6**  
  **Part (b): 6/8**  
  **Part (c): 4/6**  
  **Total: 16/20**  

  ---

  ### Margin Comments (Keyed to Specific Phrases)  
  1. **On (a): "Commensurable here just means there is one scale..."**  
     *Comment:* Correct, but "just" understates the significance. Commensurability here specifically entails a *cardinal, interpersonally comparable scale* for hedonic states, allowing aggregation. You rightly note it doesn’t imply tradeability.  
     *Type:* Right-but-thin. A stronger answer would explicitly name cardinality/interpersonal comparability.  

  2. **On (a): "LTNU is not committed to there being some enormous finite N..."**  
     *Comment:* Perfect. This directly rebuts the compensation misconception and clarifies lexicality’s role.  
     *Type:* Correct and well-put.  

  3. **On (b): "The strongest objection is the discontinuity objection..."**  
     *Comment:* Good choice, but calling it the "one pinprick outweighs a galaxy of bliss" oversimplifies. The core issue is lexicality’s *infinite priority* to suffering above T, not just pinpricks.  
     *Type:* Sloppily put. Pinpricks are unlikely to exceed T; the objection targets *any* above-T suffering, however rare.  

  4. **On (b): "the choice matters — if T were an aggregate threshold..."**  
     *Comment:* Spot-on. You correctly note aggregate thresholds reintroduce fanaticism (e.g., massive mild suffering → priority tier). However, you omit that *lifetime-total* thresholds also risk arbitrariness (e.g., one intense pain vs. distributed mild pains).  
     *Type:* Right-but-thin. A strong answer should contrast all three readings of T.  

  5. **On (b): "the threshold mostly relocates the problem..."**  
     *Comment:* Correct and insightful. The boundary problem (discontinuity at T) and T’s arbitrariness are fatal flaws. But you miss that lexical thresholds *inherently* create discontinuity; this isn’t just a "new" cost—it’s the objection persisting.  
     *Type:* Defensible but badly expressed. Frame this as the objection *surviving in modified form*.  

  6. **On (c): "Under uncertainty LTNU is, for practical purposes, just expected-utility maximisation..."**  
     *Comment:* Misleading. LTNU’s lexical ordering *lacks a real-valued representation*—you can’t assign finite weights without violating lexical priority. Expected utility with huge weights is a *pragmatic approximation*, not what LTNU "is."  
     *Type:* Wrong. A strong answer would note LTNU requires *leximin* or *safety-first* rules under uncertainty.  

  7. **On (c): "One last point in the view's favour..."**  
     *Comment:* Irrelevant to the question. Part (c) asks about uncertainty and expected-value maximizers, not the repugnant conclusion. This distracts from the core query.  
     *Type:* Wrong (off-topic). Omit this to focus on uncertainty.  

  ---

  ### What a Strong Answer Missed  
  - **(a)** Explicitly defining "commensurable" as requiring *cardinal measurability* and *interpersonal comparability* (not just a single scale).  
  - **(b)** Contrasting all three readings of T: single-experience (used), lifetime-total (e.g., chronic pain), and aggregate (e.g., climate suffering). The objection’s force *does depend*: aggregate/lifetime thresholds weaken the threshold’s defense.  
  - **(c)** Clarifying that LTNU *cannot* use expected-value maximization (due to non-Archimedean structure). An expected-value maximizer with large finite weights *would* approximate LTNU only probabilistically (e.g., avoiding tiny risks of catastrophe), but strict LTNU might demand *zero risk* of above-T suffering.  

  ### Final Note on Objections  
  The student’s closing line in (c) ("which objection you think survives") is absent. A strong answer would flag the *boundary problem* (from b) as the surviving objection, given its resilience across T-readings.  

  ---  
  *Assessment rationale defended per request: Marks reflect accuracy, completeness, and relevance to question subparts. Deductions in (b) for incomplete T-analysis and in (c) for misrepresenting uncertainty handling. Total 16/20 aligns with a high B-/B.*
