answer: |-
  Here’s a question-first taxonomy for positions on the legitimacy of binding referendums. Diagnostic questions branch the space, with positions mapped to their answer combinations. Empty branches are noted, and indistinguishable pairs flagged.

  ---

  **Taxonomy of Legitimacy Conditions for Binding Referendums**

  ### **Branch 1: Source of objection?**  
  *(Answers split the space)*  
  - **A. Voter-centric objection** (Competence, info, judgment of voters)  
  - **B. Mechanism-centric objection** (Framing, agenda-setting, aggregation rules)  

  ### **Branch 2 (if A): Does voter objection vanish under high-salience, low-technicality issues?**  
  - **A1. Yes** (Objection scales with issue complexity/salience)  
  - **A2. No** (Objection applies even to simple/high-salience issues)  

  ### **Branch 3: Must a binding result have a time-limited mandate?**  
  *(Applies to all positions)*  
  - **C1. Yes** (Mandate decays; requires explicit sunset clause or renewal)  
  - **C2. No** (Result binds indefinitely unless overturned democratically)  

  ### **Branch 4: Is legitimacy assessed against the legislature’s hypothetical decision?**  
  - **D1. Yes** (Referendum only legitimate if it outperforms legislature)  
  - **D2. No** (Legitimacy independent of legislative baseline)  

  ### **Branch 5: Are certain subjects immune to majority vote?**  
  - **E1. Yes** (Rights, minorities, constitutional fundamentals off-limits)  
  - **E2. No** (No subject inherently exempt)  

  ---

  ### **Position Leaves**  
  *Mapped to answer combinations & awkward commitments:*

  1. **Populist/Plebiscitary** (A2, C2, D2, E2)  
     *Awkward:* Accepts California-style fiscal propositions—voters decide *anything*, even if poorly informed.  

  2. **Epistocratic Objection** (A1, C1/C2, D1/D2, E1/E2)  
     *Awkward:* Rejects technical fiscal votes (e.g., California bonds) as illegitimate but struggles to define "technical" crisply.  

  3. **Information-Salience Skeptic** (A1, C1, D1, E1/E2)  
     *Awkward:* Tolerates high-salience votes (e.g., Brexit) but opposes low-salience technical ones—yet can’t prove salience boosts competence.  

  4. **Mechanism Reformer** (B, C1, D2, E2)  
     *Awkward:* Demands neutral agenda-setting for California propositions but admits no mechanism fully eliminates elite manipulation.  

  5. **Swiss-Style Semi-Direct** (A1, C1, D2, E1)  
     *Awkward:* Defends technical propositions *only* with robust pre-vote deliberation—but can’t guarantee voters engage.  

  6. **Deliberative Assembly Alternative** (B, C1, D1, E1)  
     *Awkward:* Rejects *all* mass referendums for mini-publics; must explain why California’s $300M ballot initiatives can’t be salvaged by better design.  

  7. **Ratification-Only View** (A1, C1, D1, E1)  
     *Awkward:* Accepts post-legislative referendums (e.g., Brexit *if* deal ratified) but can’t define what counts as sufficient legislative "working over."  

  8. **Supermajority Threshold** (B, C2, D2, E1)  
     *Awkward:* Demands 60% thresholds for legitimacy—forcing acceptance of unpopular results meeting the bar (e.g., California’s Prop 13).  

  ---

  ### **Empty Branches & Why**  
  - **A2 + D1:** *Unattractive:* If voters *always* lack competence (A2), comparing them to legislatures (D1) is pointless.  
  - **B + A1/A2:** *Incoherent:* Mechanism objections (B) can’t combine with voter-salience tests (A1/A2).  
  - **E2 + C1:** *Unoccupied:* If no subjects are off-limits (E2), time-limiting mandates (C1) contradicts permanent popular sovereignty.  

  ### **Indistinguishable Pairs**  
  - **Epistocratic vs. Information-Salience Skeptic** on C3/D4: Both can occupy C1/C2/D1/D2 equally—questions don’t force divergence.  
  - **Swiss-Style vs. Ratification-Only** on E1: Both restrict subjects but Swiss allows initiatives; only Branch 1 separates them (A vs. B).  

  ### **Key Distinctions**  
  - **Salience scalability** (Q2) splits voter objections (e.g., Epistocratic vs. Populist).  
  - **Mandate decay** (Q3) divides proceduralists (Swiss, Ratification) from populists.  
  - **Legislative baseline** (Q4) isolates technocratic (Ratification) vs. plebiscitary views.  

  ---  
  Use this tree to locate positions by their "DNA" of answers. Real-world examples (California/Brexit) test each leaf’s coherence at its weakest point.
