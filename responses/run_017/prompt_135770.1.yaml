prompt: |-
  I've got to give the opening remarks at my daughter's primary school 'International Evening' next week. Every class has made a display about 'their country', there are dances, and one dad is already annoyed that his kid has been assigned a country she's never actually lived in. I'm a philosopher and I basically think national character is bunk, but I can't say that to a hall of parents who spent three weeks on these displays — and I do want to say something true about why an evening like this is worth having. The idea I keep coming back to is something I've started calling 'the greeting problem': you can't greet or address someone at all without some prior guess about how they'll take it, so the question isn't really whether we generalise about people, it's which generalisations we put on the table as open to correction in the next five seconds. Could you write me a five-minute speech built on that — the gap between statistical claims about groups and the expectations we actually address individuals with — that praises the evening without leaning on national character and without definately sneaking it back in under the word 'heritage' or 'culture'? Some of the parents are recent arrivals, some are fourth-generation here, and two of the kids are the only ones in the school from their country, so they get treated as delegates whenever this sort of thing comes up; it has to land for them, for the teachers, and for the annoyed dad. British English please, short speakable sentences (bad acoustics, lots of small children), and no jokes at any real country's expense.
reasoning: |-
  Okay, the user needs an opening speech for their daughter's school International Evening. They're a philosopher who rejects national character stereotypes but must acknowledge the parents' efforts. The challenge is praising the event without reinforcing harmful generalizations.

  Hmm, the core tension here is between rejecting reductive national labels while validating the community's work. Their "greeting problem" insight is brilliant - that we always use provisional assumptions in social interaction. That's the perfect framing device.

  Right, the audience has layered sensitivities: recent immigrants, multi-generational locals, two children representing entire countries alone, and one annoyed dad. Must avoid "heritage" or "culture" as backdoor nationalism. British English, short sentences, no mocking jokes.

  The speech structure should probably: 1) thank everyone immediately 2) name the "annoyed dad" concern without confrontation 3) pivot to the greeting problem theory 4) reframe the displays as conversation starters 5) emphasize curiosity over categorization 6) include the isolated children gracefully.

  Key phrases to use: "provisional guesses" not stereotypes, "invitations to wonder" for displays, "person-shaped questions" about assumptions. Must explicitly say "we don't represent nations" for those two kids.

  The closing needs to unite: teachers' effort, annoyed dad's valid point, and immigrant perspectives. Maybe "maps to human complexity" as metaphor? No applause bait - sincerity over charm.

  Biggest risk is accidentally othering the non-British parents. Solution: emphasize all identities are equally provisional here. "Fourth-generation locals make guesses too" balances it.

  Mic check! Bad acoustics demand staccato rhythm. No clauses over eight words. "See?" and "Notice?" as auditory punctuation. Pauses marked explicitly.

  Finally, the philosopher's integrity check: does this covertly smuggle in cultural essentialism? Scanning... no, "human kaleidoscope" and "endless rearranging" actively undermines fixed categories. Annoyed dad should feel heard without speech derailing.
