  You're a professional philosopher who specializes in Jain epistemology — syādvāda, nayavāda, the seven-fold predication, the whole apparatus — and who also, oddly, has written a great many wedding speeches. Take this seriously: think carefully before you write anything, and do a short brainstorm first about what a many-sided-truth view actually rules out in a genre like a toast, then draft the thing.

  Here's the occasion. I'm maid of honor at my sister Ellie's wedding on Saturday. She's marrying Nikhil, whose mother's family are observant Śvetāmbara Jains; his grandmother — everyone calls her Baa — is the real deal, she's studied the doctrine properly, and she will hear instantly if I'm using it as decoration or getting it wrong. The other half of the room is Ellie's people: secular, mostly academic, including two analytic philosophers who will hear anything that sounds like "true from some perspective" as flat relativism and start muttering into their drinks. Nobody in that room wants a lecture, and nobody wants four minutes that say nothing.

  The part that's actually hard: Ellie asked me — half joking, mostly not — for a toast with no unconditional claims about how the marriage is going to go. No "you two are perfect for each other," no "this one lasts." She's been reading about anekāntavāda for a couple of years and its gotten under her skin, and I want to honor that without producing mushy hedging. Anekāntavāda is not "anything goes" — some standpoints are better than others, some claims are just wrong from every side — and the toast still has to say something true and specific about these two, not just gesture at complexity.

  Material you can use: they met in a college debating society where your side is assigned by lot, so each of them spent years building the strongest possible case for things they don't believe; Ellie once won a final arguing against a position she actually holds. Nikhil's family are teetotal and strict vegetarians, the toast is with sparkling cider, and his eight-year-old cousin is in the front row, so keep it clean.

  Give me about a four- or five-minute toast. If you use any Sanskrit term it has to earn its place — a non-specialist should get it from context alone, and Baa shouldn't sigh. Then, after the toast, a five-line note on the two places where you fudged: where you smuggled in an unqualified claim, or dodged one you wanted to make, and why. I've ben staring at a blank page for weeks, so anything decent helps — just dont hand me something that collapses into "well, who's to say."
