  We are constructing a list of requirements for a theory that explains what makes every 'a' an 'a', with the purpose of underwriting a system that can both read and generate letters in novel styles. The system must handle:
  - Reading: OCR in diverse, unseen hands or display faces.
  - Generation: Extrapolating an entire alphabet from a few samples of a style.

  We'll consider the cases provided, cutting those that are bogus or that smuggle in one camp's assumptions, and add any missing ones. Then we'll list the requirements, each with a concrete case that motivates it. We'll note which are non-negotiable and which are hobby-horses, flag pairs that can't be jointly satisfied, and name the requirement that knocks out the most candidate theories.

  We'll also clarify the distinctions between:
  - Token: a particular instance (e.g., a specific mark on a page).
  - Glyph/allograph: a particular form of a letter (e.g., double-storey 'a' vs. single-storey 'ɑ').
  - Letter type: the abstract category (e.g., the letter 'a').
  - Writing system: the system the letter belongs to (e.g., Latin, Cyrillic).

  The "essence" of the letter should be at the level of the letter type, but the theory must account for how tokens are mapped to glyphs and then to letter types within a writing system.

  We'll then evaluate four approaches briefly: templates, structural descriptions, generative models (like Letter Spirit), and convnets.

  After reviewing the provided cases, we cut some and keep others:

  Cut:
  - None are entirely bogus, but we must ensure they don't smuggle in assumptions. We'll reframe them as requirements.

  We might add:
  - **Contextual disambiguation**: The same shape can be different letters in different contexts (like 'c' in Latin and Cyrillic) and the same letter can be recognized in isolation in some cases but not in others (like the wedding invitation). This is partially covered by the ransom note and the Cyrillic/Latin example, but we need to emphasize context.
  - **Cross-script transfer**: This is important for the system to learn new scripts faster.

  We'll structure the requirements as follows, grouped by themes:

  ### I. Invariance and Variation
  1. **Style invariance with style awareness**: The theory must allow recognizing the same letter across different styles (fonts, hands) while also being sensitive to style (so that style can be perceived and used for generation).  
     *Concrete case*: The ransom note (letters from different fonts are read as the same letters, but the styles are perceived as different).  
     *Non-negotiable*: Yes.

  2. **Shape underdetermination**: The theory must account for cases where the same shape can be different letters (Cyrillic 'а' vs. Latin 'a') and different shapes can be the same letter (double-storey vs. single-storey 'a').  
     *Concrete case*: Cyrillic 'а' vs. Latin 'a' (pixel-identical but different letters) and double-storey vs. single-storey 'a'.  
     *Non-negotiable*: Yes.

  ### II. Context and Segmentation
  3. **Contextual identity**: The identity of a letter can depend on adjacent letters or the word context.  
     *Concrete case*: 'l', '1', and 'I' are disambiguated by neighbors.  
     *Non-negotiable*: Yes.

  4. **Segmentation in continuous script**: The theory must explain how units (letters) are segmented in scripts without gaps (cursive).  
     *Concrete case*: Cursive handwriting with no gaps.  
     *Non-negotiable*: Yes.

  5. **Global style perception**: The theory must account for the perception of style (corporate, friendly) that is not localized to a single letter.  
     *Concrete case*: Recognizing a typeface as corporate without pointing to a specific letter.  
     *Non-negotiable*: For generation, yes; for reading, it's more about style transfer.

  ### III. Robustness and Degradation
  6. **Robustness to degradation**: The letter identity survives partial loss or distortion.  
     *Concrete case*: An 'a' with its bowl rubbed off or a 'c' with a chunk missing is still recognized.  
     *Non-negotiable*: Yes.

  ### IV. Generation and Extrapolation
  7. **One-shot style extrapolation**: Given one or a few examples of a letter in a new style, the system can generate other letters in the same style.  
     *Concrete case*: Seeing one 'g' in a display face and sketching a plausible 'q'.  
     *Non-negotiable*: For the system, yes.

  8. **Systematic confusability**: The theory should account for systematic errors (like mirror-image confusion: 'b' vs. 'd').  
     *Concrete case*: Children swapping 'b' and 'd'.  
     *Non-negotiable*: Not absolutely for the system, but it's a useful indicator of internal representation.

  ### V. Gradedness and Boundaries
  9. **Graded membership**: Some instances are better examples of a letter than others, and there are boundary cases (like 'á', 'ª', IPA 'ɑ', turned 'ǝ').  
     *Concrete case*: Deciding if 'á' is an 'a' (it is, as a diacritic variant) or if 'ª' (ordinal indicator) is an 'a' (it's a stylized 'a', but not typically used as a letter).  
     *Non-negotiable*: For a full theory, yes; for the system, it must handle such variants.

  10. **Logotypes and abstract substitutions**: The theory must account for non-standard representations that are accepted as letters.  
      *Concrete case*: Logotypes where a near-letter object stands in for a letter (e.g., the McDonald's golden arches as an 'M').  
      *Non-negotiable*: For robust reading, yes.

  ### VI. Historical and Cross-Script
  11. **Historical continuity**: The theory must address whether the 'a' in a 12th-century manuscript is the same letter as today's 'a'.  
      *Concrete case*: Historical forms.  
      *Non-negotiable*: Not for the system (unless it must read historical scripts), but for a full theory of letter identity.

  12. **Cross-script transfer**: Knowledge of one script facilitates learning another.  
      *Concrete case*: Knowing Greek makes Cyrillic easier; copying Korean without understanding.  
      *Non-negotiable*: For the system, it's a bonus, but for a general theory, it's important.

  ### VII. Levels of Representation
  13. **Levels of abstraction**: The theory must distinguish token, glyph, letter type, and writing system, and explain how they relate.  
      *Concrete case*: All of the above.  
      *Non-negotiable*: Yes.

  We now note:

  - **Non-negotiable requirements**: 1, 2, 3, 4, 6, 7, 13. (These are essential for the system to function as described.)
  - **Hobby-horses**:
    - Requirement 8 (systematic confusability) might be a psychologist's concern, but it is informative for the representation.
    - Requirement 11 (historical continuity) is more of a linguist's or historian's concern, not critical for the system.
    - Requirement 5 (global style) is critical for generation but might be overemphasized by designers.

  - **Potentially conflicting pairs**:
    - (2) Shape underdetermination and (1) Style invariance: How can the system be invariant to style (which changes shape) yet sensitive to writing system (where the same shape can be a different letter)? Resolution: Context and writing system context must be used.
    - (3) Contextual identity and (4) Segmentation: In cursive, segmentation and context are intertwined. We need to segment without knowing the letters and recognize letters without clear segmentation.

  - **The requirement that knocks out the most theories**: Requirement 2 (Shape underdetermination) because it shows that shape alone is insufficient, and the writing system context is essential. Also, requirement 7 (one-shot extrapolation) is very challenging for non-generative models.

  Now, we list the requirements:

  ### Requirements List
  1. **Style Invariance with Style Awareness**: The theory must enable recognition of the same letter across vastly different styles while preserving the perception of style.  
     *Motivating case*: Ransom note with letters from multiple fonts.  
     *Non-negotiable*: Yes.

  2. **Shape Underdetermination**: The theory must explain how the same shape can represent different letters in different writing systems (e.g., Cyrillic 'а' vs. Latin 'a') and how different shapes (e.g., double-storey 'a' vs. single-storey 'ɑ') can represent the same letter.  
     *Motivating case*: Cyrillic and Latin 'a' being pixel-identical but distinct; single-storey and double-storey 'a' being the same letter.  
     *Non-negotiable*: Yes.

  3. **Contextual Identity**: The theory must account for cases where the identity of a letter is disambiguated by its context (adjacent letters, word, or line).  
     *Motivating case*: The letters 'l', '1', and 'I' having identical shapes in some fonts but being disambiguated by context.  
     *Non-negotiable*: Yes.

  4. **Segmentation in Continuous Script**: The theory must explain how individual letters are segmented in scripts without gaps (e.g., cursive handwriting).  
     *Motivating case*: Reading an ornate script wedding invitation where letters are connected and cannot be easily isolated.  
     *Non-negotiable*: Yes.

  5. **Global Style Perception**: The theory must account for the perception of global style attributes (e.g., corporate, friendly) that emerge from the entire set of letters, not localized to any one.  
     *Motivating case*: Identifying a typeface as corporate without being able to point to a specific letter that carries the attribute.  
     *Non-negotiable*: For generation, yes.

  6. **Robustness to Degradation**: The theory must allow recognition of letters even when parts are missing or distorted.  
     *Motivating case*: An 'a' with its bowl rubbed off is still recognized as 'a'.  
     *Non-negotiable*: Yes.

  7. **One-shot Style Extrapolation**: The theory must enable the generation of new letters in a style from one or a few examples.  
     *Motivating case*: Seeing one 'g' in a display face and generating a plausible 'q'.  
     *Non-negotiable*: For the system, yes.

  8. **Systematic Confusability**: The theory should explain why certain errors (e.g., mirror-image confusions like 'b'/'d') occur systematically.  
     *Motivating case*: Children and some patients swapping 'b' and 'd'.  
     *Non-negotiable*: No (but informative).

  9. **Graded Membership and Boundaries**: The theory must account for degrees of typicality (some 'a's are better than others) and handle boundary cases (e.g., diacritics, symbols).  
     *Motivating case*: Deciding whether 'á' or 'ª' is an instance of 'a'.  
     *Non-negotiable*: For robustness, yes.

  10. **Logotypes and Abstract Substitutions**: The theory must account for non-standard representations that are accepted as letters (e.g., in logos).  
      *Motivating case*: A near-letter object in a logotype being read as a letter.  
      *Non-negotiable*: Yes.

  11. **Historical Continuity**: The theory must address whether historical forms (e.g., 12th-century 'a') are the same letter as modern forms.  
      *Motivating case*: Historical manuscript versus modern print.  
      *Non-negotiable*: No (unless the system must handle historical scripts).

  12. **Cross-Script Transfer**: The theory should explain how knowledge of one script facilitates learning another.  
      *Motivating case*: Knowing Greek making Cyrillic easier to learn.  
      *Non-negotiable*: For a general theory, yes; for the system, it's a bonus.

  13. **Levels of Abstraction**: The theory must clearly distinguish and relate the levels: token, glyph, letter type, and writing system.  
      *Motivating case*: All cases, especially shape underdetermination and style variation.  
      *Non-negotiable*: Yes.

  ### Conflicting Pair
  - **Requirement 1 (Style Invariance) and Requirement 2 (Shape Underdetermination)**: Style invariance requires ignoring shape changes due to style, but shape underdetermination requires that sometimes the same shape must be treated as different letters (based on writing system). This conflict can be resolved by incorporating writing system context and higher-level (e.g., word or document) context.

  ### The Most Knocking-Out Requirement
  - **Requirement 2 (Shape Underdetermination)**: It shows that shape alone is insufficient and that the writing system (and context) is essential. This requirement rules out any theory that relies purely on shape (e.g., naive template matching).

  ### Evaluation of Approaches

  - **Templates** (e.g., storing multiple templates per letter):
    - Fails: 2 (shape underdetermination), 3 (context), 4 (segmentation), 7 (extrapolation), 10 (logotypes), 12 (cross-script). May handle 1 (with many templates) and 6 (to some extent).

  - **Structural or Stroke-Based Descriptions** (e.g., defining letters by strokes and their relations):
    - Fails: 2 (without context), 3 (context), 4 (segmentation in cursive), 7 (extrapolation of style), 5 (global style). Handles 6 (robustness) if relations are flexible.

  - **Generative Models** (e.g., Letter Spirit, which generates letters in a style from a few examples by capturing style parameters):
    - Handles: 1, 5, 7, 9, 10 (if style parameters capture abstraction). May struggle with 2 (writing system context), 3 (context), 4 (segmentation), 12 (cross-script). Excels at 7.

  - **Convnets** (modern deep learning for OCR):
    - Handles: 1 (with data augmentation), 2 (if trained on multiple scripts), 3 (context via receptive fields), 4 (with sequence modeling), 6 (robustness), 9 (to some extent). May fail: 7 (one-shot generation without specific architecture), 12 (cross-script transfer without multi-task learning). Struggles with 13 (levels are not explicitly represented).

  ### Summary of Evaluation
  - No current approach meets all requirements, but convnets come closest for reading, while generative models (like Letter Spirit) are better for generation. A hybrid system might be needed.

  ### Final Note
  The most fundamental challenge is Requirement 2 (Shape Underdetermination) because it forces the theory to incorporate context beyond the visual form, such as the writing system and linguistic context. This requirement, combined with Requirement 1 (Style Invariance), suggests that the essence of a letter is not in its shape but in its role within a system of contrasts (the alphabet) and its context of use.
answer: |-
  ### Requirements for a Theory of Letter Identity  
  *(Framed for a system that reads novel hands/typefaces and generates alphabets from minimal style samples)*  

  #### Core Requirements (Non-Negotiable)  
  1. **Style Invariance with Style Preservation**  
     *Requirement*: Identity must persist across arbitrary stylistic variations (e.g., font, weight, slant), while style itself remains perceptible and extractable.  
     *Case*: Ransom note — identical letters (e.g., ‘a’) recognized across fonts, yet stylistic differences are obvious.  
     *Why non-negotiable*: Reading and generation both demand separating style from identity.  

  2. **Contextual Determination of Identity**  
     *Requirement*: Identity must be resolvable only via context (spatial, linguistic, or systemic), not shape alone.  
     *Case*: ‘1’, ‘I’, ‘l’ — identical strokes disambiguated by adjacent characters or word position.  
     *Why non-negotiable*: Shape is insufficient for disambiguation (see phishing domains).  

  3. **Writing-System Relativity**  
     *Requirement*: Identity must be scoped to a writing system (e.g., Latin vs. Cyrillic).  
     *Case*: Pixel-identical ‘а’ (Cyrillic) and ‘a’ (Latin) are different letters; Greek ‘α’ and Latin ‘a’ are distinct despite shared ancestry.  
     *Why non-negotiable*: Cross-script homoglyphs prove identity isn’t shape-defined.  

  4. **Degradation Robustness**  
     *Requirement*: Identity must survive partial destruction or distortion.  
     *Case*: ‘a’ with a damaged bowl or ‘c’ missing a segment is still readable.  
     *Why non-negotiable*: Real-world inputs (e.g., crumpled notes) are imperfect.  

  5. **Segmentation-Free Recognition**  
     *Requirement*: Units must be identifiable without pre-segmented boundaries.  
     *Case*: Ornate cursive script — letters are fused; isolation is impossible.  
     *Why non-negotiable*: Cursive handwriting and stylized typefaces lack gaps.  

  6. **One-Shot Style Extrapolation**  
     *Requirement*: A style’s "rules" must be inferrable from minimal samples to generate new letters.  
     *Case*: Seeing one ‘g’ in a display face lets you sketch a coherent ‘q’.  
     *Why non-negotiable*: Generation requires capturing style essence from sparse data.  

  7. **Top-Down Global Style Coherence**  
     *Requirement*: Style must be a holistic property of the entire alphabet, not localized to glyphs.  
     *Case*: Sensing "corporate" or "friendly" in a typeface without attributing it to specific letters.  
     *Why non-negotiable*: Generation requires propagating style beyond seen samples.  

  #### Secondary Requirements (Useful but Not Strictly Essential)  
  8. **Mirror-Image Confusability**  
     *Requirement*: Theory should explain systematic errors (e.g., ‘b’/‘d’ swaps).  
     *Case*: Children’s mirror errors hint at rotation-sensitive encoding.  
     *Hobby-horse*: Cognitive science; not critical for engineering.  

  9. **Graded Membership**  
     *Requirement*: Account for prototypical ‘a’s vs. marginal cases (e.g., ‘á’, ‘ª’, IPA ‘ɑ’).  
     *Case*: ‘ɑ’ (single-storey) vs. ‘a’ (double-storey) — same letter but shape-variant.  
     *Hobby-horse*: Linguistics; system only needs functional tolerance.  

  10. **Cross-Script Transfer**  
      *Requirement*: Explain why knowledge of one script aids learning another (e.g., Greek → Cyrillic).  
      *Case*: Recognizing shared structural principles across scripts.  
      *Hobby-horse*: Education-focused; not required for core system.  

  #### Cut Cases (Bogus or Biased)  
  - **Historical Continuity**: Whether a 12th-century ‘a’ is the "same" as a modern ‘a’ is philosophical, not functional.  
  - **Logotypes**: Overfits to design exceptions (e.g., McDonald’s ‘M’); not generalizable.  
  - **Kids’ Errors**: Already covered by mirror confusability; redundant.  

  #### Key Conflicts  
  - **Style Invariance (R1) vs. Writing-System Relativity (R3)**:  
    *Conflict*: Style invariance ignores systemic context, but writing-system relativity demands it.  
    *Resolution*: Theory must hierarchically nest style under writing-system rules.  
  - **Degradation Robustness (R4) vs. Contextual Identity (R2)**:  
    *Conflict*: Degraded glyphs lose shape cues, forcing reliance on context, but context assumes units exist.  
    *Resolution*: Mutual constraint-satisfaction (e.g., Bayesian priors for shape + context).  

  #### The Killer Requirement  
  **Writing-System Relativity (R3)** knocks out most theories:  
  - Template models fail (same shape ≠ same letter).  
  - Structural descriptions fail (Cyrillic/Latin shapes are identical).  
  - Pure convnets fail (trained per script; don’t natively represent systemic boundaries).  

  #### Level Distinctions  
  - **Token**: This ink smear.  
  - **Glyph/Allograph**: Specific form (e.g., double-storey ‘a’).  
  - **Letter Type**: Abstract category ‘a’ (Latin).  
  - **Writing System**: Latin alphabet.  
  *Where essence lives*: **Letter type**, *but* contingent on writing system. Glyphs are style-bound; tokens are noisy instances.  

  #### Approach Performance  
  - **Templates** (e.g., stored images):  
    ✘ R1 (style-invariant? no), R2 (context? no), R3 (writing system? no), R6 (extrapolate? no).  
  - **Structural Descriptions** (e.g., strokes + topology):  
    ✘ R2 (context? weak), R3 (writing system? no), R5 (segmentation? assumes units), R7 (global style? no).  
  - **Generative Models** (e.g., Letter Spirit):  
    △ R1 (yes), R6 (yes), R7 (yes). ✘ R3 (writing system? not embedded), R4 (degradation? fragile).  
  - **Convnets** (modern deep learning):  
    △ R1 (partial: needs massive data), R4 (yes), R5 (with RNNs). ✘ R3 (writing system? not explicit), R6 (one-shot? no), R7 (global style? not disentangled).  

  #### Unresolvable Tension  
  **You cannot jointly satisfy:**  
  - **Style Invariance (R1)** + **Writing-System Relativity (R3)** + **One-Shot Extrapolation (R6)**.  
  *Why*: Style invariance requires abstracting away shape, but writing systems are shape-defined conventions. One-shot extrapolation needs a universal style parameterization, yet writing systems impose discrete categorical boundaries. *Consequence*: Systems will always struggle with cross-script style transfer (e.g., generating Cyrillic in a Latin font from one sample).  

  #### Final Note  
  Adequate theories must treat letters as *roles in a system*, not shapes. The "essence" is relational: an ‘a’ is defined by its contrasts within a writing system (e.g., vs. ‘o’ or ‘d’) and its style-agnostic function. No existing model nails this, but hybrid symbolic/neural approaches (e.g., convnets + graph-based grammars) come closest by separating style (neural) and systemic identity (symbolic).
