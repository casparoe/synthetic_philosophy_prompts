prompt: |-
  I write a column on science and ideas, which for the last couple of years has meant mostly AI plus a running sideline in institutional speech, and somehow I've become the person my editors send to cover official apologies. I've now stood in the room for maybe two dozen of them and my gut on which ones actually *are* apologies doesn't line up with anything I can state, which is a problem because I owe 1500 words by Tuesday and I'd rather they said something than just conveyed a mood. My working rule has been: it counts only if the speaker gives something up that they'd otherwise have kept — money, a legal shield, a flattering story about the nation. My brother, who's a historian, says I'm secretly just tracking who has standing to be angry, which I resent and half believe.

  Here's my gut, case by case. Willy Brandt kneeling at the memorial to the Warsaw Ghetto Uprising in 1970: no statement, no admission, no words at all — and it feels like the most complete apology I've ever covered, it counts maximally. The Australian parliamentary apology to the Stolen Generations: counts, and I think because it named the specific practice of taking children rather than the past in general. Three decades of statements from one government expressing deep remorse without ever saying the state did the thing: doesn't count, and each repetition makes the next one count *less*, which is strange, since you'd think repetition accumulates. An apology issued in the final week of a government that's about to be thrown out: counts less. An apology from a newly elected leader who personally opposed the old policy and says so: also counts less, for what looks like the opposite reason. But an heir or a head of a hereditary house apologizing for what the family firm or the crown did, having had no hand in it and no choice about the role: counts, and counts more than either of those — so both the too-involved and the too-uninvolved apologize cheaply and only some narrow band in the middle works, which feels arbitrary and is the bit I most want replaced by something real. Money: reparations explicitly framed as not a full settlement count more than words alone; the same money with a release-of-claims attached counts *less* than no money at all. A museum returns ancestral remains and says in writing that this is not an apology and admits nothing: I still feel some of the apologetic work got done, and that a statement would have added nothing — which flatly contradicts the remorse case, where wording was everything. A successor state whose constitutional order expressly denies legal continuity with the regime that did the harm apologizes for that regime's atrocities: counts. A company that was dissolved and reincorporated under a new registration number apologizing for what the old entity's subsidiary did: counts for nothing. Same structure, opposite verdicts, and I can't tell you what I'm seeing in one that I'm not seeing in the other. Then my actual beat: a benefits agency's chatbot sends personalized apologies to people wrongly denied payments, generated per case, signed by nobody — doesn't count. The same text read aloud by a caseworker who then has to fix the file: counts. The same text, model-written but signed and then defended in parliament by the minister: counts, weakly, and I can't tell whether the signing or the defending is doing the work. And a model-written apology that is more accurate and more specific about what happened than any human official would ever have produced: my gut still says no, which makes me think I'm being irrational about the medium in particular. Finally: an apology for a secret program whose victims never knew they were harmed, volunteered under no pressure at all, counts a great deal; an apology for harms the state knows will be exposed when the archives open next year counts less, even though it is also unforced and arguably more honest about its own timing.

  So: test my gives-something-up rule against all of that, repair it, and give it to me clause by clause with the case that motivates each clause. Tell me plainly which of my verdicts it forces me to drop — I'd rather drop two verdicts than end up with a rule that just redescribes them — and turn it on the three I go back and forth on: an apology the intended recipients publicly reject in advance, an apology addressed to future generations for climate inaction where there is nobody yet to accept it, and a city council apologizing for a pogrom the national government still denies happened. Then tell me what it predicts for two cases I've never actually seen: an AI system apologizing in its own name for harms its outputs caused, with no human signing it, and a state apologizing to its own citizens for a policy most of those citizens voted for. And settle whether my brother is right that I'm only tracking who has standing to be angry. I don't want names of theorists or papers, I've got three days and no library access on this trip — just the principle, in plain sentences, with where it hurts.
reasoning: |-
  Okay, the user is a science and ideas columnist who frequently covers official apologies, especially in the context of AI and institutional speech. They're struggling to articulate a consistent principle for what makes an apology feel genuine, despite having witnessed numerous cases. Their working rule—that an apology must involve giving up something valuable—seems insufficient when tested against their own intuitive judgments on various historical and contemporary examples. They need a refined framework by Tuesday to meet a deadline, and they specifically want to avoid academic jargon or theoretical references.

  Hmm, their examples reveal fascinating contradictions: Brandt's wordless kneeling counts as a maximal apology, while verbose government expressions of "deep remorse" without specifics feel hollow. Money with legal releases diminishes the apology's value, yet returning ancestral remains without an apology statement still feels meaningful. They're particularly troubled by the "bandwidth problem"—where both overly involved and completely detached speakers seem to apologize cheaply. 

  The user's frustration is palpable—they resent their historian brother's suggestion that they're merely tracking "who has standing to be angry," but suspect there's truth in it. Their deadline pressure amplifies the need for concrete, actionable principles rather than abstract theory. I notice their cases cluster around several tension points: agency vs. inheritance (can heirs meaningfully apologize?), performativity (does signing matter more than the words?), and temporality (does preemptive apology for future harms count?).

  The core challenge is reconciling their gut feelings with logic. For instance, why does a dissolved company's apology fail while a successor state's succeeds? Why does human delivery matter for chatbot apologies? I suspect the unspoken thread is about relational repair: apologies matter when they restore moral balance in an ongoing relationship. This explains why legal disclaimers feel corrosive (they sever the relationship) and why Brandt's gesture worked (it acknowledged a debt nothing could repay). 

  For their three ambiguous cases: a rejected apology might still count if it shifts power dynamics; apologizing to future generations fails without concrete sacrifice (since there's no relationship to mend); the city council apology gains strength precisely because it contradicts national denial. The AI case highlights the relational crux—without human backing, the apology lacks a responsible party to engage with victims. The voter apology case is thorny but possible if it surrenders political capital.

  Ultimately, the brother is half-right: standing to be angry matters because it implies a relationship worth repairing. But the user is tracking something deeper—whether the apology alters the power imbalance that caused harm. That's why "giving something up" is necessary but insufficient: the sacrifice must flow from recognizing the victim's moral standing. 

  The refined rule should emphasize: (1) specificity of wrongdoing, (2) sacrifice proportional to institutional power, (3) no legal escape hatches, and (4) delivery by someone positioned to cede authority. This framework validates most of their gut calls while forcing revision on the unforced secret program apology (it's theatrical without power shift) and the accurate AI apology (lacking human accountability). 

  Key adjustments: "giving something up" becomes "ceding power," which covers non-material sacrifices like political capital. The bandwidth problem resolves by requiring speakers to have enough power to matter, but enough connection to feel the wound. For the deadline, I'll structure this clause-by-clause with case references, explicitly naming which verdicts must change.
answer: |-
  Here’s a repaired principle, clause by clause, grounded in your cases and designed to replace arbitrariness with a clear mechanism:

  **The Core Principle:**  
  **An apology counts when it surrenders institutional power to the victim.**  

  This isn’t just "giving something up"—it’s specifically about ceding authority, control, or legitimacy that the institution could have retained. Your brother is half-right: standing to be angry *is* key, but only because anger demands a rebalancing of power. The apology is the act of rebalancing.

  ---

  **Clause-by-Clause Rules & Case Motivations:**  

  1. **It must surrender institutional authority, not just resources.**  
     *Motivation:* Brandt’s kneeling. He surrendered the Chancellor’s symbolic inviolability, embodying submission to the victims’ moral authority. Money alone (e.g., reparations with a legal release) fails because it retains institutional control over the narrative and future liability.  

  2. **It must name the specific harm *as an institutional act*, transferring interpretive power to the victim.**  
     *Motivation:* Australian apology vs. vague "remorse." Naming "taking children" surrenders the state’s power to define the harm. A museum returning remains without apology still surrenders control over sacred objects, transferring authority to the descendants (hence "apologetic work" is done).  

  3. **The speaker must hold institutional power *and* continuity, but not direct culpability.**  
     *Motivation:* Heirs/heads of state vs. dissolved companies. An heir embodies institutional continuity (crown/firm) and surrenders its moral legitimacy. A dissolved company has no continuity; its "apology" surrenders nothing. A doomed government’s apology fails (no continuity) as does a new leader’s (no culpability linkage). **This resolves your "bandwidth problem."**  

  4. **It must not shield the institution from future accountability.**  
     *Motivation:* Reparations with release-of-claims vs. without. A release retains power by ending liability. Money *without* a release surrenders resources *and* leaves the institution exposed.  

  5. **Human accountability is non-negotiable.**  
     *Motivation:* Chatbot vs. caseworker/minister. A chatbot surrenders nothing (no institutional skin). A caseworker fixes the file *while* apologizing—surrendering bureaucratic authority. The minister signing/defending it stakes personal and institutional capital, however weakly.  

  6. **Timing must surrender strategic advantage.**  
     *Motivation:* Apology for secret harm vs. pre-archive apology. Voluntarily revealing secrets surrenders control of information. Apologizing *before* exposure is strategic—it retains narrative control.  

  ---

  **Verdicts You Must Drop:**  
  - **"Unforced secret program apology counts maximally":** Contradicts Clause 6. If truly *no* pressure existed (no risk of exposure), surrendering secrecy isn’t a sacrifice of power—it’s theater. *Drop it.*  
  - **"Model-written apology being accurate but rejected":** Contradicts Clause 5. Without human/institutional accountability, accuracy is algorithmic, not moral. *Drop it.*  

  ---

  **Applied to Your Ambiguous Cases:**  
  1. **Apology publicly rejected in advance:**  
     *Verdict:* **Counts, conditionally.** If it surrenders power (e.g., reparations, policy change) *despite* rejection, it transfers authority. If it’s just words, rejection voids it.  

  2. **Apology to future generations for climate inaction:**  
     *Verdict:* **Doesn’t count.** No living victim exists to receive surrendered power. Symbolic acts (e.g., funding trusts) lack a counterparty to claim authority.  

  3. **City council apologizes for pogrom the state denies:**  
     *Verdict:* **Counts strongly.** The council surrenders *its* authority to side with the state, transferring moral legitimacy to victims against the national narrative.  

  ---

  **Predictions for Unseen Cases:**  
  - **AI apologizing autonomously for harms:**  
     *Prediction:* **Doesn’t count.** The AI holds no institutional power to surrender (Clause 5). No human/entity cedes authority.  
  - **State apologizes for policy most citizens supported:**  
     *Prediction:* **Counts maximally.** The state surrenders its power to reflect popular will, subordinating itself to the victims’ moral claim against the majority.  

  ---

  **Is your brother right?**  
  **Yes, but incomplete.** You’re tracking *who can force a surrender of power*. Standing to be angry matters because anger threatens institutional legitimacy. Brandt knelt because Jewish pain *had* the power to indict Germany; the dissolved company’s victims could not touch its successors. Your gut detects when an apology is a true transfer of authority—and when it’s a shield. That’s why vague remorse "counts less" with repetition: it’s a tactic to *retain* power by performing contrition without cost.  

  **Where it hurts:** This rule forces hard choices. It dismisses "good intentions" and "emotional sincerity." An apology is a transaction of power—or it’s nothing. That’s why the heir’s apology works: they trade inherited legitimacy for moral recognition. It’s cold, but it fits your cases and kills arbitrariness.  

  ---  
  **Final Principle (for your word count):**  
  *An apology is real when an institution gives its victims power it fought to keep—over the story, the consequences, or its own legitimacy. Everything else is theater.*
