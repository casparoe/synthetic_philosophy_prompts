prompt: |-
  I direct service planning at a mid-sized regional transit authority, and one of the recurring arguments in my shop is about information purchases: before we commit to a route restructure, a capital bus-lane project, a fare change, or a new service agreement, someone proposes that we first buy some more knowledge — an on-board origin–destination survey, a few weeks of automated passenger counters, a consultant travel-demand model, an eight-week pilot, an equity analysis — and we have no disciplined way to decide. These come up maybe fifteen or twenty times a year at a formal level, at stakes between roughly thirty thousand and three million dollars, and every recommendation has to survive a finance director who wants a dollar figure plus the three assumptions driving it, and, above a hundred thousand, a board that reads nothing else. Whoever runs the procedure will be a planning analyst with a spreadsheet, about an hour per case, and no taste for decision theory, so it has to be operable without the vocabulary while still tracking what the theory actually says. The theory I am leaning on is the result usually called Good's theorem: that an agent who updates by conditioning and then chooses to maximize expected utility cannot, judging before the message arrives and averaging over the messages it might receive, be made worse off by information that is free, because it can always shrug and act exactly as it would have acted without it. I have absorbed that slogan from years of reading rationalist blogs, and my problem is precisely that it is a slogan: it licenses our default instinct that looking can never hurt and that more measurement is always progress, which I no longer believe, but I cannot reconstruct from the slogan which assumption is doing the work, so I cannot tell when it stops protecting us.

  So I want a written procedure, not an essay: an ordered set of steps with a time box on each, a statement of what counts as a sufficient answer at each step, the nodes where it stops with a no, and the nodes where it hands the question to a named human because the issue is one of values rather than fact. Several things need to be built in explicitly rather than left to the analyst's judgment. There should be a decision-invariance check up front: if the choice we would make is the same under every result the instrument could plausibly return, the value is zero no matter how interesting the study is, and the procedure should stop there. There needs to be an upper bound computed as the value of deciding with clairvoyance about the one quantity that actually matters, and then an explicit descent from that bound to the instrument we could really buy — my analysts currently just report the clairvoyance number, which is why every proposal looks worth funding — and I want your view on the discounting rule my senior analyst has drafted, which multiplies the bound by the correlation between what the instrument measures and the decision-relevant quantity. I also want the procedure to force the estimate to be written and dated before the purchase and never quietly revised afterward, to separate the ex ante guarantee from the ex post fact that a particular result can genuinely leave us worse off, to handle sequencing honestly (we keep adding the values of three studies together, and I am told that is wrong because value is not additive across signals and depends on what you already expect to learn), to say what to do when a needed number is simply unavailable — an uncertainty band, a sensitivity table, a break-even question, whatever is defensible in ten minutes — and to state, in so many words, which steps are judgment wearing a lab coat. Most importantly, it needs a failure check for the theorem's assumptions, covering at least these: the information cannot actually be ignored because a policy, contract, or board rule commits us to react to it; the message changes what other agents do rather than only what we believe; the instrument measures a proxy that downstream readers will treat as the quantity itself; the arrival of the number changes the set of acts available or their payoffs, including by taking so long that the window for acting closes; and the case where the information is nominally free to us because a grant pays for it. For each of those I want to know not just that the non-negativity argument lapses but what the procedure should output instead.

  Then apply it to three live proposals, showing the arithmetic with your assumptions written down, and give me the one-page memo template the analyst would fill in. First: an eight-week Sunday-service pilot on Route 14 costing about sixty thousand dollars. My planners love pilots on principle and will fight me on this, but the earliest we could add Sunday service is eleven months out because it needs operators we cannot hire until the next fiscal year, the pilot would run in July and August while the parallel rail line is down for maintenance, and I suspect that a weak result would be explained away and a strong result would change nothing about the timeline; if the procedure says skip it, say so flatly, and if it saves the pilot, tell me which step saved it. Second: a forty-thousand-dollar stated-preference and travel-diary survey intended to decide whether to extend Route 7 two miles to the new regional medical campus, at about three hundred thousand a year in operating cost, instead of keeping the current alignment and funding an on-demand shuttle. This decision is genuinely live and I think the clairvoyance bound here is large; my worry is that the survey measures stated intent among residents in a two-mile band rather than boardings at particular stops during clinic shift changes, that it excludes the shift workers we most care about, and that it returns in four months when we need to file the grant application in six weeks — so I want the procedure to tell me whether to buy it, buy a re-scoped and much cheaper version such as a two-week manual ride check at the existing transfer point, or buy nothing. Third: a federally funded equity and farebox-recovery analysis of our fare-free program, costing us nothing, whose publication would trigger an adopted board rule automatically scheduling a discontinuation hearing for any route below a recovery threshold for two consecutive quarters, and which advocacy groups and the union would use in ways we cannot control. I expect the procedure to flag this as a case where information makes us worse off precisely because we are not free to ignore it once it exists; I want that stated, I want the remaining question handed to a person with an account of what the person should actually be deciding, and I want you to be candid about the option of commissioning an internal version that is never published, since that is choosing ignorance instrumentally and has its own costs. Finally, tell me what this procedure cannot settle: which inputs are irreducibly judgment, where it will systematically misfire at an authority like mine, and how I should describe its limits in the memo without giving the board a reason to ignore it.
reasoning: |-
  Okay, let me unpack this transit planning problem. The user is clearly a seasoned professional facing a very specific operational challenge: how to systematically evaluate information purchases for transit decisions. What stands out is their frustration with the gap between decision theory ("information can't hurt") and real-world constraints where bad data or institutional pressures actually make things worse.

  Hmm, the core tension seems to be between rationalist ideals ("Good's theorem") and bureaucratic reality. The user has identified exactly where theory breaks down: when information creates obligations, changes others' behavior, or measures the wrong thing. They're not asking for philosophy - they want a bulletproof workflow that junior analysts can execute in an hour with Excel.

  I notice three critical requirements: First, a hard "decision-invariance" filter upfront to kill pointless studies. Second, a realistic value calculation that discounts clairvoyance by measurement error. Third, explicit flags for when information becomes dangerous - like triggering automatic policy changes. The equity analysis example is particularly telling: free federal money that could force service cuts. 

  For the pilot study case... *scratches head*... the temporal mismatch jumps out. Running a summer pilot when implementation can't happen for 11 months makes the data nearly worthless unless they can lock in decisions immediately. The procedure should catch that "window closure" risk. 

  The medical campus survey is trickier. The clairvoyance value is high ($300k operating cost decision), but the survey design flaws are fatal. A cheaper ride-check alternative makes sense here - the procedure needs to force that compromise option. 

  *Pauses*... The institutional constraints are fascinating. That board rule about farebox recovery thresholds turns data into a loaded gun. The procedure must separate "can we ignore this?" from "should we?" and escalate the latter to leadership. 

  What's unsaid but implied: The user needs political cover. When the procedure says "no" to a popular pilot study, it has to withstand planner backlash. Hence the demand for ironclad, assumption-transparent steps. 

  Finally, the template design challenge: Must survive finance scrutiny while hiding the decision theory complexity. Every input field needs to force explicit assumptions - no wiggle room for revisionism later. The "irreducible judgments" section will be crucial for credibility.
answer: |-
  Here is a disciplined, executable procedure for evaluating information purchases, designed for spreadsheet implementation within one hour per case. It incorporates your requirements, flags key failure modes of Good’s theorem, and includes a memo template. Assumptions are explicitly documented at each step.

  ---

  ### **Procedure: Information Value Assessment (IVA)**
  **Time Box:** 60 minutes total per case.  
  **Analyst Inputs:** Decision context, options, instrument cost, instrument specs.  
  **Output:** GO/NO-GO recommendation, quantified value range, or escalation path.

  #### **Step 1: Decision Invariance Check (5 mins)**  
     - *Question:* Would the **same action** be taken under **all plausible outcomes** of the proposed instrument?  
     - *Sufficient Answer:* List top 3 actions and outcomes. If action is identical for all outcomes → **STOP (NO-GO)**.  
     - *Example:* Route 14 Sunday pilot: If "add Sunday service in 11 months" is the plan regardless of summer pilot results → **NO-GO**.

  #### **Step 2: Clairvoyance Bound (10 mins)**  
     - *Question:* What is the maximum value of **perfect information** on the single decision-relevant quantity (e.g., net present value of Route 7 extension)?  
     - *Calculation:* `=MAX(Option1_NPV, Option2_NPV, ...) - NPV_of_best_guess_action`  
     - *Sufficient Answer:* Dollar figure with 3 key assumptions (e.g., "NPV assumes 5% ridership growth, $30/hr value of time, 3% discount rate").  
     - *If $0 or negative → **STOP (NO-GO)**.*

  #### **Step 3: Instrument Discounting (15 mins)**  
     - *Discount Rule:* **Approved**. Value = Clairvoyance Bound × *Correlation Factor (CF)*.  
       - *CF = Estimated correlation* (0–1) between instrument output and decision quantity.  
       - *Estimate CF using:*  
         - Historical data (e.g., "Stated-preference surveys vs. actual ridership: r=0.6").  
         - Expert guess (low/medium/high → 0.3/0.6/0.9).  
     - *Sufficient Answer:* "CF = 0.7 based on [source]. Value = $X × 0.7 = $Y."

  #### **Step 4: Net Value & Sequencing (10 mins)**  
     - *Calculation:* `Net Value = (Value from Step 3) - Instrument Cost`  
     - *Sequencing Adjustment:* If part of a series, multiply Net Value by **0.7** (non-additivity penalty).  
     - *Sufficient Answer:* "Net Value = $Z. Standalone/[Sequenced]."

  #### **Step 5: Failure Mode Flags (15 mins)**  
  Check each condition; if **ANY** apply, escalate to **Director of Planning** (values/politics):  
     - 🚩 **Commitment to React:** Policy/rule forces action based on results (e.g., farebox recovery threshold).  
     - 🚩 **Changes Others’ Behavior:** Results alter unions/advocates/politicians’ actions.  
     - 🚩 **Proxy Misinterpretation:** Audience will treat proxy (e.g., survey) as ground truth.  
     - 🚩 **Window Closure:** Instrument delay causes missed decision window.  
     - 🚩 **Not Actually Free:** Grant funding creates obligations (e.g., publication requirements).  
     - *Sufficient Answer:* "Flag(s) triggered: [List]. Escalate to Director."

  #### **Step 6: Judgment & Uncertainty (5 mins)**  
     - *Unavailable Data:* Use break-even analysis. "To justify cost $C, CF must be > X%."  
     - *Irreducible Judgments:* Document:  
       - Correlation Factor (Step 3).  
       - Clairvoyance assumptions (Step 2).  
       - Flag interpretations (Step 5).  
     - *Output:* GO if Net Value > $0 and no flags; NO-GO otherwise.

  ---

  ### **Application to Live Proposals**
  #### **1. Route 14 Sunday Pilot ($60K)**  
     - Step 1: **Decision invariant** → *Weak results* = "Try later"; *strong results* = same 11-month timeline. **NO-GO**.  
     - *Why it fails:* Pilot can’t change action timing. Step 1 stopped it.

  #### **2. Route 7 Medical Campus Survey ($40K)**  
     - Step 2: Clairvoyance bound = |$300K (shuttle) - (-$50K extension)| = **$350K** (wrong decision = $300K operating loss).  
     - Step 3: CF = **0.4** (survey measures residents, not shift workers; excludes key demo). Value = $350K × 0.4 = $140K.  
     - Step 4: Net Value = $140K - $40K = **$100K** → **GO** *but…*  
     - Step 5: **Window closure flag** (survey in 4mo vs. grant deadline 6wks). **Escalate to Director**.  
     - *Director’s Options:* Reject survey; counter with $5K ride-check (CF≈0.6, Net Value=$205K).

  #### **3. Federally Funded Equity Analysis ($0 cost)**  
     - Step 1: Not invariant → Results *could* change decisions.  
     - Step 2: Clairvoyance bound high (value of optimal fare policy).  
     - Step 5: **🚩Commitment to react** (board rule), **🚩changes others’ behavior** (advocates), **🚩not free** (publication mandated).  
     - **Escalate to Director + Legal**.  
     - *Director’s Decision:* Commission **internal-only analysis** (no publication) vs. risk discontinuation hearings.

  ---

  ### **IVA Memo Template**
  ```markdown
  **Information Purchase Assessment**  
  Date: ___________  Analyst: ___________  
  Decision Context: [2 lines]  

  **Step 1: Decision Invariance**  
  Actions if instrument shows:  
  - High result: _________  
  - Medium result: _________  
  - Low result: _________  
  ☑ Same action for all? → [Yes/No]  
  _OUTCOME: [GO/NO-GO/Continue]_  

  **Step 2: Clairvoyance Bound**  
  Key quantity: _________  
  Bound: $_________  
  Assumptions:  
  1. _________  
  2. _________  
  3. _________  

  **Step 3: Instrument Discounting**  
  Correlation Factor: _________ (Source: _________)  
  Value: $_________  

  **Step 4: Net Value**  
  Cost: $_________  
  Net Value: $_________  
  Sequencing penalty? [Yes/No]  

  **Step 5: Failure Flags**  
  [ ] Commitment to react  [ ] Changes others’ behavior  
  [ ] Proxy misinterpretation  [ ] Window closure  
  [ ] Not actually free  
  Escalate to: [Name/NA]  

  **Step 6: Recommendation**  
  ☐ GO (Net Value > $0, no flags)  
  ☐ NO-GO (Reason: _________)  
  ☐ ESCALATE (Flags: _________)

  **Irreducible Judgments:**  
  - Correlation estimate based on _________.  
  - Clairvoyance assumes _________.
  ```

  ---

  ### **What This Procedure Cannot Settle**
  1. **Judgment Wearing Lab Coat:**  
     - Correlation factors (Step 3), clairvoyance assumptions (Step 2), and flag interpretations (Step 5) are inherently subjective.  
  2. **Systematic Misfires:**  
     - Politically mandated studies (e.g., board-ordered analyses).  
     - "Symbolic" purchases (e.g., surveys to delay decisions).  
  3. **Describing Limits to the Board:**  
     > *"IVA ensures we only buy information that changes decisions and covers its cost. It flags high-risk cases for human judgment but cannot override policy mandates or political realities. It is a tool—not a substitute—for leadership."*  

  **Key Insight:** Good’s theorem fails when information restricts freedom or alters the game. This procedure forces explicit acknowledgment of those cases while quantifying value where possible.
