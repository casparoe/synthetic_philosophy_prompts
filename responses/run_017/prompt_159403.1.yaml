  [The speech begins immediately, spoken to graduates facing the audience]

  Look at you. Look at *all* of you here today. Forty graduates. Mothers, fathers, brothers, sisters, sons, daughters. Friends. Warden, Commissioner, officers, our guests from Norway. This room is full of people who saw something worth doing, and did it. That’s what we’re here to mark.

  For eleven years, I’ve watched men walk into classrooms here after long days, sometimes after hard days. Walk in tired. Walk in frustrated. Walk in wondering if any of it mattered. And they sat down. They opened books. They wrestled with ideas that didn’t come easy. They wrote papers under fluorescent lights when the rest of the unit was locked down. They asked questions. They got things wrong, and then they tried again. They helped the guy next to them understand. They learned. Not because someone told them to, but because they decided to. That’s what this paper represents. That decision. That effort. That *work*.

  Now, people talk a lot about what prison is *for*. Punishment. Safety. Rehabilitation. Those words get tossed around. But let’s be clear about punishment. The sentence handed down by the court is the deprivation of your liberty. That’s the punishment society imposed. It is severe. It is real. But that sentence is *not* the deprivation of your humanity. It is *not* the deprivation of your mind. It is *not* the deprivation of your capacity to strive, to learn, to build something inside yourself that wasn’t there before. Nothing about that sentence said, “You must stop thinking. You must stop growing. You must become less.”

  So what does this place owe the people held inside its walls? It owes them safety, sure. Order, yes. But beyond the bare minimum of keeping bodies alive? It owes respect for that humanity the sentence didn’t extinguish. It owes the chance – not the guarantee, but the *chance* – to use the time that is taken from you, not just to mark days, but to become someone who sees the world differently. Someone who understands more. Someone who built this, right here, through sheer effort.

  This degree isn’t a key to the gate. For some of you, that gate won’t open. We all know that. This degree isn’t about proving you’re “fixed” or “rehabilitated” in someone else’s ledger. It’s not about paying a debt; that calculus is bigger than any classroom. This degree is about what *you did* with the time you had, in the place you were in. It’s proof you claimed something the sentence didn’t take. You claimed your own capacity to learn, to think deeply, to master something difficult. You claimed a piece of your own mind back. That belongs to you. Nobody gave it to you. Nobody can take it from you. It’s yours.

  Commissioner, you mentioned a new unit, modeled on places like Halden. Different doors, different rules. Real privacy. Officers without guns, building relationships. That’s a significant change. Change is hard. It makes people nervous. Officers – I know many of you, I’ve worked alongside you. Your job is demanding, every single day. Keeping this place safe isn’t abstract; it’s your reality. Trying something new, something that looks and feels different, takes courage. It takes believing that safety and humanity aren’t opposites. It takes hard work, just like earning this degree took hard work. It’s another kind of effort, another kind of belief in what’s possible. I hope it works. Because places that recognize the humanity inside the sentence are simply better places. For everyone.

  And to the families – especially the kids looking up at their mom or dad, their uncle or brother, in those blues: See this? See this paper? It’s heavy. It took years. It took showing up when it was hard. It took not giving up. That strength you see in them today? They earned that. Be proud of *that*. Be proud of the work.

  So graduates, look around this room. Look at the people who came to see *you*. They see you. They see what you accomplished. Hold onto that. This moment, this paper, it doesn’t erase the past. It doesn’t change the walls. It doesn’t promise tomorrow. What it does is stand as proof. Proof that right here, right now, in this place, you chose to build something real inside yourself. You chose to learn. You chose to strive. You chose to claim a piece of your mind, your dignity, your self, back from the grind. That choice, that effort, that’s yours forever. That’s true. That matters. Congratulations.

  [Speech ends]

  ---

  **Concessions & Costs (Under 250 words):**

  *   **To Officers:** "Officers – I know many of you... Your job is demanding... Trying something new... takes courage... It takes believing that safety and humanity aren’t opposites. It takes hard work..."
      *   **Concession:** Explicitly acknowledges officers' difficult role, validates their concerns about safety, frames the Halden change as requiring *their* courage and effort, linking it (positively) to the graduates' hard work.
      *   **Cost:** Risks validating the existing system's pressures and potentially soft-pedals critique by emphasizing shared "hard work" and the Commissioner's initiative. It frames the humane shift as dependent on officer buy-in, subtly reinforcing their power in the dynamic.
  *   **To Families (Children):** "And to the families – especially the kids... See this paper?... It took showing up when it was hard. It took not giving up. That strength you see in them today? They earned that. Be proud of *that*."
      *   **Concession:** Provides a simple, direct message children can grasp ("showing up when hard," "not giving up," "strength," "Be proud"). Offers families a concrete point of pride focused solely on the graduate's present effort and perseverance.
      *   **Cost:** Risks sentimentality and simplifies the complex reality. It focuses on "strength" as the takeaway for kids, potentially glossing over the harsh context and the graduates' specific circumstances/past. Avoids the harder truths about the future, especially for lifers.
