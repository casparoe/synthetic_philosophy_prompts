  Hmm, let me break this down. The user is teaching a first-year seminar on utilitarianism with students already primed on population ethics. They want an in-class activity to viscerally demonstrate the torture vs. dust specks problem without explicit framing. Key constraints: no upfront lecture, no revealing the case name, and the insight must emerge from student actions.

  The user's proposed structure has two main stages: a switch game demonstrating imperceptible harms aggregating to tangible costs, and a scenario-building exercise where students determine the threshold for preferring aggregate tiny harms over one severe harm. They also want variants testing perceptibility and harm distribution shapes, plus an optional probabilistic version.

  I need to design this carefully. For the switch game, using raffle tickets as currency makes sense - each "yes" adds one ticket to a bowl, reducing individual odds imperceptibly while the total draw visibly affects outcomes. The scenario-building should start with concrete comparisons (e.g., 1 person's 90-min chore vs. many people's tiny tasks), letting students push N upward until they balk. 

  For variants, I'll contrast "papercut" (noticeable but trivial) with "forgotten coin" (imperceptible) to test if perceptibility changes thresholds. Then the distribution variants: linear (each harm equal) vs. diminishing (harm decreases) to see if students still focus on total harm. The probabilistic version (1/N chance of big harm) can be included if time permits.

  Debriefing should connect game moments to philosophical dilemmas: the switch game challenges threshold denials, the cutoff point exposes aggregation limits, and the variants test shape sensitivity and perceptibility assumptions. I'll acknowledge limitations - we can't replicate torture, astronomical numbers, or assume cardinal comparability.

  Potential pitfalls include joke votes, principled refusals, or anchoring effects. Contingencies: anonymous voting, framing as thought experiments, and varying starting points. Crucially, the activity doesn't "prove" aggregation but reveals where intuitions fail, which is itself a valuable philosophical insight about the limits of moral reasoning outside everyday contexts.
answer: |-
  Here’s a meticulously designed 90-minute activity with minimal framing, step-by-step execution, and embedded philosophical pressure points. The structure forces students to confront aggregation through experience before labeling it.

  **Prep (Before Class):**
  - 20 slips: Half say "TYPE A", half "TYPE B" (shuffled)
  - 2 bowls (labeled "COST POOL" and "DRAW")
  - Raffle prizes: 3x $5 coffee coupons (or similar low-stakes reward)
  - Printed scenario cards (see below)

  **Timeline & Script (Minimal Board Use):**
  *(Total: 90 mins)*

  **Part 1: The Switch Game (20 mins)**
  1. **(0:00) Silent Setup:**  
     - Place bowls at front. Write on board:  
       `DECISION SLIP ➔ [ ] YES  [ ] NO`  
       `COST POOL: [EMPTY BOWL]`  
       `DRAW: 3 PRIZES FROM BOWL`  
     - Distribute slips randomly. Say: *"Write YES or NO. Anonymously. Fold it. Bring it to the bowls. If YES, drop it in COST POOL. If NO, drop it in DRAW. Do this now."* (No further explanation).

  2. **(2:00) Collection:**  
     - Students deposit slips. Mix COST POOL slips visibly. Count them aloud: *"X YES slips in Cost Pool."*  
     - Add X blank slips to DRAW bowl (representing the "cost" — each YES adds imperceptible disadvantage).

  3. **(4:00) The Draw:**  
     - Draw 3 winners from DRAW bowl. Award prizes.  
     - **Key Moment:** Ask winners: *"Did you feel your odds drop when slips were added?"* (They won’t). Ask class: *"Did anyone perceive a difference from one extra slip?"* (Silence).  
     - **Board Update:** Add: `EACH YES = +1 SLIP IN DRAW (YOUR ODDS: 1/18 → 1/19 → ...)`

  **Part 2: Building the Comparison (40 mins)**  
  4. **(10:00) Scenario Intro:**  
     - Write:  
       `OPTION A: 1 PERSON suffers 90 mins of TASK X`  
       `OPTION B: N PEOPLE suffer 1 min of TASK Y`  
       `WHICH IS WORSE? WRITE MAX N WHERE B IS STILL BETTER THAN A.`  
     - Distribute cards:  
       `TASK X: "Sort a bucket of mixed screws by thread type (boring, precise work)"`  
       `TASK Y: "Get a papercut on your fingertip (sharp sting, fades fast)"`  
     - Say: *"Assume all feel pain equally. N must be a whole number. Write the highest N where B is still less bad overall than A."*

  5. **(15:00) Collect & Tally:**  
     - Gather responses. Calculate median N. Start low: *"Median says N=40. Raise hands if B is still better at N=100?"* Record votes. Incrementally increase N (200, 500, 1000, 5000, 10k, 50k, 100k, 1M) until majority refuses (e.g., hands drop below 50%). **Note the threshold.**

  6. **(25:00) Variant 1: Imperceptible vs. Trivial**  
     - New card:  
       `TASK Y: "Lose 1 cent from an untraceable account (never noticed)"`  
       *"Same question: Max N where losing 1 cent N times is better than one person sorting screws for 90 mins?"*  
     - Repeat tally. Does threshold rise? (Likely yes).

  7. **(35:00) Variant 2: Shape of Harm**  
     - **Linear Harm:** *"Each extra papercut is equally bad. Max N?"* (Baseline).  
     - **Diminishing Harm:** *"Each extra papercut hurts *less* than the last (first hurts 1 unit, second 0.9, third 0.81...). Total 'pain units' equal to N=1000 papercuts. What’s your max N now?"*  
     - **Watch:** If max N decreases → students prioritize per-person experience over total sum.

  8. **(45:00) Optional Variant: Probability**  
     - *"OPTION B: N people each have 1/N chance of doing the 90-min screw sort. Expected suffering = same as one person doing it. Better than Option A?"*  
     - **Key:** Does the class accept higher N here than with certain tiny harms? Exposes risk aversion vs. aggregation.

  **Part 3: Debrief & Reveal (30 mins)**  
  9. **(50:00) Connect to Activity:**  
     - **Switch Game:** *"You added slips knowing one slip didn’t hurt anyone. Yet together, they cost the class 3 prizes. Can zero-perception harms sum to real costs?"* → Challenges "no harm if imperceptible".  
     - **Cutoff Point:** *"When N got too high, many refused. Why? Did the total pain become too big? Or did it feel wrong to compare one big harm to many tiny ones?"* → Pressures interpersonal comparability.  
     - **Shape Variant:** *"When later papercuts hurt less, did you allow fewer people? But total pain was fixed. Why change?"* → Tests if "total suffering" is the real driver.  
     - **Probability:** *"Was a 1% chance of torture better than a certain speck? Why?"* → Exposes non-aggregative intuitions.

  10. **(60:00) Philosophical Moves:** Map rejections to defenses:  
      - *"If you said tiny harms don’t sum at all (like dust specks), can you explain the Switch Game?"*  
      - *"If you demanded a threshold (e.g., 'pain under 5 units doesn't count'), what should that threshold be? Why?"*  
      - *"If you bit the bullet at N=trillion, how do you justify the torture?"*  
      - **Crucial:** Highlight that *denying interpersonal comparability* isn’t challenged by the activity — it’s a gap.

  11. **(70:00) Honest Limitations:**  
      - *"We used small harms. Real torture is incomparable. Our N stopped at ~10k; the real argument uses billions."*  
      - *"We assumed we can add 'pain units'. Is that true? Or is suffering non-mathematical?"*  
      - *"This assumes you can compare my papercut to your screw-sorting. Can we?"*  
      - *"Important: This activity can’t tell us if aggregation is right. It shows our intuitions break down with scale."*

  12. **(80:00) Reveal & Context:**  
      - *"This mirrors philosopher Nick Bostrom's 'torture vs. dust specks' thought experiment. He argues for aggregation: better a speck to each of 10^16 people than torture for one. Why? Because..."*  
      - **Final Insight:** *"The activity doesn't prove aggregation. It shows that when harms get tiny or huge, our moral instincts — evolved for medium-sized, perceptible harms — malfunction. That malfunction is the problem."*

  ---

  **Predictable Problems & Fixes:**  
  1. **Class Joker:** "Votes YES for lulz."  
     → **Fix:** Anonymity reduces performance. Debrief: *"If you voted YES thinking ‘it’s just a slip’, does that mirror dismissing specks as ‘not real harms’?"*  
     
  2. **Refusal to Play:** "This is coercive!"  
     → **Fix:** Allow abstention (submit blank slip). Later: *"Did opting out feel like refusing to impose tiny harms? Is that consistent?"*  
     
  3. **Anchoring:** Sticking to first N proposed.  
     → **Fix:** Start absurdly low (N=10) and high (N=1M) in different variants to reset anchors.  
     
  4. **"Just a Game" Deflation:**  
     → **Fix:** In debrief, stress: *"The raffle cost was real. Did that change how seriously you took your slip? Now imagine real dust specks..."*  
     
  5. **Catchability Confound:**  
     → **Fix:** Use the "untraceable account" variant explicitly. Ask: *"Did knowing you couldn’t be caught make YES easier? Why should that matter morally?"*  

  ---

  **Your Judgment Question:**  
  The activity **does not support aggregation**. It weaponizes the students’ own inconsistent intuitions to show:  
  - We *do* aggregate imperceptible harms in the Switch Game (against our theory).  
  - We *refuse* aggregation at scale in the torture scenario (against our practice).  

  This exposes that **human moral psychology lacks stable tools for microscopic/horrific scales** — a profound result. It forces confrontation with three ugly choices:  
  1. Reject the Switch Game (but you felt it!).  
  2. Accept dust specks > torture (repugnant).  
  3. Admit our intuition is context-dependent and unreliable (humbling).  

  This isn’t dodging; it’s showing the problem’s depth. The takeaway: *Utilitarianism demands mathematical moral reasoning where evolution left us blind. That’s why it feels repugnant.*  

  **Final Board State:**  
  ```
  SWITCH GAME:  
  YES slip → +1 in DRAW → worse odds for all  
  COST POOL: [X] slips → added [X] to DRAW  

  BUILDING N:  
  SCREWS vs. PAPERCUT: Stopped at N=____  
  SCREWS vs. LOST CENT: Stopped at N=____  
  LINEAR: N=___   DIMINISHING: N=___  

  DEBRIEF:  
  Invisible harms → visible cost?  
  Where did N break? Why?  
  Can we add suffering? Compare pain?
  ```  
  Run tight on time; cut Probability if needed. The power is in the dissonance between Part 1 and Part 2. Lean into the silence when they realize they’ve trapped themselves.
