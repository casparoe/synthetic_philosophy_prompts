prompt: |-
  I'm a novelist — literary stuff with one foot in SF — and I'm about 40k words into a book that hangs entirely off a quantum suicide setup, and I keep drafting scenes that my beta readers, and my mate who did physics at Imperial, tell me are cheating. So what I want isn't a physics lesson, it's a craft procedure: something I can run on any scene I've written in about ten minutes, in the vocabulary I actually work in — point of view, whose head we're in, free indirect style, what the narrator is licensed to know, what the reader can infer from what's on the page, dramatic irony, offstage action — that tells me whether the scene is honest to the premise or whether I've quietly smuggled in a bit of magic. Constraints: no equations, no branching-tree diagrams (I tried drawing one and it made everything worse), it has to work for both my present-tense first-person chapters and the third-person-limited ones, and it should end in either a rewrite instruction or an explicit "this one's a judgment call, you decide" rather than in a shrug. I cant afford many more dead chapters.

  Where I've got to, which you should correct if I've mangled it: as I understand it, every outcome of the device happens somewhere, but you only ever have experiences in the outcomes where there's still a you around to have them, so from the inside you apparently survive everything while from outside you're just dead in nearly all of it. The snags I keep hitting and want the procedure to handle, in roughly the order I hit them: the *grain* problem, since dying isn't instantaneous and I'm not sure there is a single clean outcome in which "she survives" — what do I do with a scene where the character is clinically gone for four minutes and comes back, is that a branch or a smear? The *mangled-branch* problem, since the outcomes where you walk away from a shotgun in the face are outcomes where you walk away ruined, and my character can't be untouched by chapter nine — how much of that do I owe the reader, and at what point does it stop being a book anyone finishes? The *witness* rule, since every other character in the book sees her die — what am I allowed to dramatise and what can I only report, and can I ever write from the daughter's point of view at all, or is that a different novel? The *accumulation* problem, since from the inside she can't know she's in the freak sequence of outcomes but the reader has to feel the improbability mounting, and I don't know how to get that onto the page without handing the narrator knowledge she couldn't have. And the *other-people* problem, since at one point she tries to drag someone through with her, and I genuinely can't tell whether the premise lets her.

  Then run it on three scenes I've got drafted, and give me the third answer even though I don't want it: (a) a present-tense first-person chapter where she presses the button for the hundredth time and nothing happens; (b) a third-person chapter from the daughter's point of view the following morning, identifying the body; (c) my ending, which I love and which I suspect is exactly the one that breaks the rules — she's ninety-odd, she dies in bed with the daughter holding her hand, and the last two pages are inside her head as it goes dark. Tell me precisely what (c) is getting wrong and what the cheapest fix is that keeps the feeling of it. And be honest about where the procedure runs out: mark the points that are just artistic calls, and separately the points where it runs out because the philosophy and the physics don't settle it either — I'm thinking of the business of whether the point of view tracks how many outcomes there are or how thick they are (amplitude? my mate used a word I've forgotten), and whether there's some floor below which the surviving sliver is too thin to be anybody at all. Don't pad it out with a reading list or names of papers, I've read the pop-science accounts and I'm not going to read the papers — I just want to stop writing scenes that don't work.
reasoning: |-
  Okay, the user is a novelist working on a book centered around quantum suicide. They're struggling with scenes that beta readers and a physics-savvy friend call "cheating." They need a practical procedure to check scenes for consistency with the premise, without getting into complex physics. The key issues they mentioned are grain, mangled-branch, witness, accumulation, and other-people problems. They also want analysis of three specific scenes (a, b, c) and honest feedback on where the procedure has limits.

  First, I need to recall the core of quantum suicide. In this thought experiment, every quantum event branches into multiple outcomes. The protagonist only experiences branches where they survive, so from their perspective, they seem invincible. But externally, they die in most branches. The user's challenges revolve around maintaining this internal-external duality without breaking the rules.

  Looking at the grain problem: the user is unsure how to handle near-death experiences. If a character is clinically dead for minutes but revives, does that count as a survival branch? I think yes, as long as consciousness isn't permanently lost. The procedure should focus on the continuity of subjective experience.

  The mangled-branch issue: survival isn't clean; the character should bear physical and psychological scars. The procedure must ensure that consequences accumulate realistically, avoiding miraculous recoveries. This ties into narrative tension—readers need to see the cost of survival.

  The witness rule: other characters see the protagonist die in most branches. The user questions if they can write from the daughter's POV. The key is that any external POV must align with the protagonist being dead in that branch. Scenes from others' perspectives should reflect their reality, not the protagonist's survival.

  Accumulation problem: the protagonist shouldn't realize they're in a low-probability branch, but the reader must feel the mounting improbability. Techniques like dramatic irony and subtle narrative cues can show this without giving the protagonist undue knowledge.

  Other-people problem: Can the protagonist bring someone else through? The premise likely doesn't allow this because consciousness is individual. Each person's survival is tied to their own branching paths. The procedure should flag attempts to share survival as violations unless handled as a failure.

  Now, for the scenes: 
  (a) First-person button press: This seems valid. The protagonist experiences a no-result outcome, which is consistent.  
  (b) Daughter's POV identifying the body: This works if it's in a branch where the protagonist died. It reinforces the external reality.  
  (c) The ending with natural death: This breaks the rules because the premise implies the protagonist only dies when no survival branches exist. Old age death contradicts that. Fixes could involve terminal branching or a final quantum event forcing the end of all paths.  

  Limits of the procedure: Some aspects, like how "thick" a branch is (amplitude), are unresolved in physics. Artistic judgment is needed for how to portray the density of branches. Also, near-death smears and the exact point where survival becomes impossible are fuzzy areas. The procedure should highlight these as judgment calls.

  Underlying needs: The user wants to maintain narrative tension and reader engagement without violating the premise. They need practical, quick checks to avoid rewriting entire chapters. Deeper needs include confidence in their story's logic and preserving the emotional impact, especially in the ending. They might also seek validation that some ambiguities are acceptable, allowing creative flexibility within the framework.
answer: |-
  Here's your Quantum Suicide Integrity Check (QSIC) procedure, designed for speed and craft-focused vocabulary. Run it scene-by-scene, asking these questions sequentially. Stop if you get a "No" or "Judgment Call Needed" – that's your rewrite trigger.

  **The QSIC Procedure (10-Minute Scene Check):**

  1.  **Whose Reality?:** Whose subjective, conscious experience is the primary focus of this scene? Is it *only* the protagonist ("Suicide Subject" - SS) experiencing outcomes where they survive? (If yes, proceed. If no, go to Question 1A).
      *   *1A (External POV):* Is this scene *exclusively* depicting the perspective of a character witnessing the SS die or its aftermath? Is the SS demonstrably dead or permanently non-conscious *in this depicted reality*? (Yes = Valid External. No = CHEATING - Rewrite or discard).
      *   *Handles: Witness Rule. Establishes the core duality.*

  2.  **Continuity of "I":** For scenes focused on the SS's experience: Does the depicted survival involve a *continuous thread of subjective consciousness* from the start of the triggering event to the end of the scene? (i.e., No permanent cessation of experience, even if temporary unconsciousness occurs).
      *   *Grain Problem:* Temporary loss of consciousness (like clinical death followed by revival) *is allowed* if the SS regains consciousness and experiences continuity of self ("I was dead, now I'm back"). Permanent death/non-revival = Invalid POV for SS.
      *   *Judgment Call:* How *long* can unconsciousness be before the "thread" feels broken? (Minutes? Hours? Days? This is narrative/tonal, not physics). The procedure flags it – *you* decide based on your story's rules.
      *   *Handles: Grain Problem (defines survival boundary).*

  3.  **The Cost of Survival:** Does the SS's survival in this scene come with credible, *inescapable consequences* stemming directly from the triggering event or accumulated events? (Physical damage, psychological trauma, resource loss, social fallout).
      *   *Mangled-Branch Problem:* "Surviving" does not mean "unscathed." Miraculous avoidance of *all* damage is CHEATING. Scars, disability, pain, trauma, loss – these are mandatory for realism and tension.
      *   *Judgment Call:* *How severe* the consequences must be is narrative (balancing horror vs. readability). But *some* consequence must be present and visible. "Walked away from a shotgun blast with a ringing ear" = CHEATING. "Walked away deaf in one ear, face scarred, permanently flinching at loud noises" = Valid.
      *   *Handles: Mangled-Branch Problem.*

  4.  **The Fog of Probability (SS POV Only):** If the scene involves the SS reflecting on their survival or the device, do they *lack* explicit knowledge or certainty about the branching multiverse mechanics? Their experience should feel like astonishing, terrifying luck, not "I know I exist in the 0.001% branch."
      *   *Accumulation Problem:* The *reader* feels the improbability mounting through:
          *   *Dramatic Irony:* The reader knows (from external hints, prologue, other POVs, or simply the premise) that most branches end in death.
          *   *Consequence Buildup (Question 3):* The accumulating damage *is* the evidence of improbability.
          *   *Narrative Weight:* The sheer repetition of near-misses and horrific survivals creates dread. *Show* the scars, the trauma, the isolation – don't have the SS *state* the quantum theory.
      *   *CHEATING:* SS internally monologuing about "thin branches" or "quantum immortality" as a *known fact* (beyond wild speculation). SS expressing *certainty* they cannot die via conventional means. (They can *hope*, they can be *reckless*, but certainty breaks POV).
      *   *Handles: Accumulation Problem (reader feels it, SS doesn't *know* it).*

  5.  **The Solipsism Test (Other-People Problem):** If the SS attempts to bring another person ("Passenger" - P) through an event *reliably* (meaning they expect P to survive *with* them), does the scene depict this attempt *failing* or having catastrophic/unpredictable consequences for P?
      *   *Core Rule:* The branching is tied to the *observer's* survival. The SS only experiences branches where *they* survive. P's survival is independent. The SS dragging P through means P survives *only* in the vanishingly small subset of branches where *both* survive the event. This should feel incredibly rare and unreliable, *not* a controllable power.
      *   *CHEATING:* SS successfully drags P through multiple events unscathed via the device, treating it like a shared shield. P surviving unscathed alongside SS *repeatedly* without extreme cost strains credulity.
      *   *Valid:* SS tries to drag P through; P dies horribly *in the SS's reality* (most branches). Or P survives but is catastrophically mangled (consequence!). Or it works *once*, freakishly, reinforcing the rarity. Or the attempt fails utterly.
      *   *Handles: Other-People Problem.*

  **Procedure Output:**
  *   **Pass:** All questions answered "Yes" or "Valid" (with noted Judgment Calls made). Scene is premise-honest.
  *   **Rewrite:** Any "CHEATING" identified. Fix or discard the scene.
  *   **Judgment Call Needed:** Flagged by the procedure (e.g., duration of unconsciousness, severity of consequence, handling Passenger attempt). Make your artistic decision consciously.

  **Where the Procedure Runs Out (Explicitly):**
  1.  **Branch "Thickness" (Amplitude):** Physics says branches have different probabilities (amplitudes). Does your POV follow the *most probable* survival path or *any* survival path? **Judgment Call.** Most narratives (and the core thought experiment) imply *any* survival path, however improbable. The procedure doesn't enforce "thickness," just survival continuity. Your mate's point is valid physics, but narratively, embracing *any* path is standard and dramatic. *Artistic Call.*
  2.  **The Survival Floor:** Is there a level of injury (e.g., total brain destruction, complete bodily disintegration) beyond which "survival" is impossible, ending the branching? **Physics/Philosophy Unresolved.** The thought experiment often handwaves this. The procedure (Q2) relies on *your* definition of "continuous subjective consciousness." If total brain destruction happens instantly, Q2 fails – it's not survival. If there's *any* conceivable path to consciousness (however mangled), Q2 passes. **Artistic Call with Physics Uncertainty.** Err towards the horrific (locked-in syndrome, uploaded consciousness fragment?) for tension.
  3.  **The Very End:** What constitutes the final death when no survival branch exists? See Scene (c) analysis below.

  ---

  **Applying QSIC to Your Scenes:**

  *   **(a) First-person: Button press, nothing happens.**
      *   Q1: SS POV - Valid.
      *   Q2: Continuous consciousness - Valid (no event triggered).
      *   Q3: Consequence? Maybe psychological (dread, frustration). Needs *some* hint of cost (shaking hands, despair). If literally *just* "pressed button, nothing, shrugged," it might fail Q3. Add internal state showing wear.
      *   Q4: SS reflecting? Can be luck/frustration, not multiverse knowledge. Valid if done right.
      *   Q5: N/A.
      *   **Verdict:** **Pass (Potential Q3 Weakness - Add Consequence Weight)**.

  *   **(b) Third-person: Daughter's POV, identifying body.**
      *   Q1: *Not* SS POV. Go to Q1A.
      *   Q1A: Daughter's POV, SS demonstrably dead? **YES.** This is explicitly a branch where the SS died. Crucial world-building.
      *   **Verdict:** **Pass.** This is essential for establishing the Witness Rule and the external reality. You *can* write from the daughter's POV, but *only* in scenes depicting realities where the SS is dead.

  *   **(c) Ending: Third-person (Limited?)/SS POV? Old age, dies in bed, daughter present, fades to black.**
      *   **The Problem:** This fundamentally breaks the premise if depicted as the *final, singular* experience of the SS.
      *   Q1: Likely SS POV (inside her head) or close 3rd limited. Assuming SS POV.
      *   Q2: Continuous consciousness? She's dying. Fading to black implies cessation. If this is *the* end, Q2 **FAILS.** The QS premise states the SS only experiences branches where they survive. Dying of old age implies *no* branches exist where the aging process doesn't *eventually* kill her. Therefore, she shouldn't experience *any* "final" death fade-out. She should only experience branches where she *doesn't* die at that moment.
      *   **Why it Breaks:** The fade-out assumes a terminal state *with no surviving branches*. But the SS can't experience that state by definition. She'd only experience branches where, improbably, she recovers or persists *even at 90+*, however biologically implausible. The fade-out is an external perspective on a death branch, which you *cannot* show from inside her head as her final experience.
      *   **Cheapest Fix Keeping the Feeling:**
          1.  **The Terminal Branch:** She's 90, dying. She *knows* it's the end. The "fade to black" isn't death, but her consciousness *shifting* to the only remaining possibility: a branch where her specific, terminal biological state *is* compatible with continued subjective experience, however minimal or non-corporeal. This could be:
              *   A final, stable quantum state (like a Boltzmann brain) experiencing a timeless moment of peace/love before dissipating.
              *   An upload triggered by the unique quantum state of her dying brain (if tech exists in your world).
              *   A purely subjective, timeless "afterglow" of her final coherent thought (the daughter's love).
          2.  **The Unending:** She closes her eyes... and then opens them again. Still in the bed, still dying, but alive. And it repeats. The "fade" is just another temporary lapse, not the end. The final feeling is terrifying existential horror, not peace. (Less keeping the feeling, but valid).
          3.  **External Frame:** End *not* in her head. Switch to the daughter's POV *in this specific branch* as her mother dies. The daughter feels the peace/love. The SS's final internal state is *unknown* because this is a death branch. You imply the SS's experience ended, but you can't show it directly. (Loses the interiority).
      *   **Recommended Cheap Fix (Keeping Interiority & Feeling):** Use Fix 1 ("Terminal Branch"). The last two pages are her fading *from the dying body*, but her consciousness doesn't cease. It transitions into a final, impossibly thin, non-corporeal branch – a single quantum state embodying the feeling of her daughter's hand and love, existing timelessly for a subjective eternity before peacefully dissolving into the universal wave function. The "darkness" isn't oblivion, but the dissolution of that final point of view. You keep the peaceful, loved, interior ending, but it's now her surviving the death event *by becoming something else* in the last possible branch.
      *   **Verdict:** **REWRITE (Core Premise Violation - SS experiencing terminal death branch).** Fix 1 provides the cheapest path to keeping the emotional core.

  **Summary:** The QSIC procedure gives you concrete craft questions to spot cheats fast. It highlights necessary consequences, enforces POV rules, flags solipsism breaches, and helps manage reader perception of probability. It explicitly outsources the "thickness" and "survival floor" issues to your artistic judgment and acknowledges the physics ambiguity there. Use it scene-by-scene to cull dead chapters and keep your quantum premise razor-sharp. Now go fix that ending!
