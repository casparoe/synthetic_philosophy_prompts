  ### Key Defense Strategy
  - **Open with concession** (as in JSON) to preempt Member 1/3 critiques about idealization.  
  - **Prioritize landing the reply to Member 3's impairment objection**—it bridges personal stakes and theory.  
  - **For the "hope nobody asks" scenario**: If pressed on your mother's rationality, shift focus to *why* residue seems insufficient to her (cognitive block vs. epistemic failure).  
  - **Close by returning to your mother**: Emphasize that the theory transforms paternalism into harm reduction respectful of agency.  

