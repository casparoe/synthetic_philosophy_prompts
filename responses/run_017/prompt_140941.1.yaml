prompt: |-
  Subject: help me prep my prospectus defense (2 weeks out) — committee is going to eat me

  Hi — I need a Q&A prep sheet, and I'd rather it come from you than from my own head, because my own head has stopped being able to tell which of my objections are real.

  Personal background, because it's why I'm writing this thing at all: my mum has early-stage Alzheimer's. Last year was the year of the car-keys argument. She is completely certain she is still a perfectly safe driver, and she has all the relevant information — she was in the room for the neuropsych report, she's seen the near-miss reports from my dad, she knows what the driving assessor said. None of it moves her by even a degree. She believes she's safe and she believes (when you press her) that her own judgment about driving has gotten worse, and those sit next to each other in her head without any friction at all. I went looking for a philosophical literature that told me what's gone wrong there and ended up writing about epistemic akrasia instead of the thing I was supposed to be writing about.

  My thesis, sketch version:

  1. Higher-order evidence never gives you a *new* reason to change your mind. It doesn't add anything to the scales. All it does is delete reasons you already had — specifically, the first-order reasons whose force depended on the reliability of the very capacity or process that the higher-order evidence calls into question. Call the survivors the "residue."
  2. Your credence should be set by the residue alone. If the residue still supports P, then believing P while also believing that your belief that P was unreliably formed is not irrational at all. It's just what rationality looks like when the unreliable bit wasn't doing any load-bearing work.
  3. So the famous cases — the exhausted driver, the third glass of wine, the one where someone creeps in and tells you your reasoning has been impaired — only *feel* like a special norm against akrasia because in those cases the residue is empty or nearly empty. People mistake "no case left" for "special prohibition."
  4. Corollary: there's no rationally required *degree* of deference to higher-order evidence, and no synchronic coherence requirement between first-order and higher-order attitudes that's doing any independent work. There's just the arithmetic of what's left after deletion.
  5. Where I think this earns its keep: it explains why my mum's combination isn't a logical or rational failure on her part, and why the thing I actually have to do isn't argue her out of it.

  The audience, precisely, because I know it matters:

  - Committee member 1: a formal epistemologist. Thinks this whole literature is just conditionalization on a richer algebra and finds talk of "reasons" quaint. Will want to know whether my deletion rule is a theorem or a metaphor.
  - Committee member 2: a social epistemologist, committed conciliationist about peer disagreement, thinks higher-order evidence and peer disagreement are the same phenomenon in different costumes, and privately thinks my view is a licence for pigheadedness.
  - Committee member 3: a philosopher of psychiatry who works on delusion and anosognosia, is openly hostile to ideal-agent epistemology as a model of actually-impaired subjects, and will want to know what my view says about someone who cannot perform the deletion — i.e. exactly my mother.
  - Committee member 4: outside chair, a Kantian working on autonomy and paternalism, doesn't care about credences, will want to know what any of this licenses me to *do* to a person whose reliability I'm implicitly questioning.

  What I want: the eight or so objections I'll actually get, ordered by how much damage they'd do if I fumbled them, each phrased the way that person would phrase it rather than translated into my vocabulary, each with a ~90-second reply and a note on where the reply is soft. Include the objection I'm hoping nobody asks — I assume it's the one that turns my mother into a counterexample to my own view, but you tell me.

  Format: give me a markdown table, one row per objection, with exactly these columns:

  - num (1, 2, 3...)
  - who (which of the four above, by number)
  - objection_as_they_put_it (1–3 sentences, in their idiom)
  - target (one clause naming which of my five claims above it attacks)
  - damage (1–5, 5 = sinks the defense)
  - likelihood (high / medium / low)
  - reply_90sec (what I actually say out loud, under 150 words)
  - soft_spot (the single weakest sentence in that reply, quoted)
  - concede_or_hold (one of: concede / hold / concede-in-part, plus a short note)

  Then, after the table, a single JSON object with these fields:

  - "thesis_one_line": string, my thesis compressed to one sentence
  - "concede_up_front": string, the thing I should hand them in my first two minutes so it doesn't get beaten out of me later
  - "must_land": string, the one reply that has to land or the whole thing collapses
  - "hope_nobody_asks": string, the question, who asks it, and my best available shot at it
  - "weakest_premise": string, numbered claim from my list
  - "thing_to_say_to_mum": string, one sentence — if any of this is right, what follows for the actual conversation

  Thanks. And please don't tell me the standard thing about how belief is voluntary, I've heard it and it doesn't help.
reasoning: |-
  We are given a detailed scenario and a request for a defense prep table and JSON summary.
   The user has outlined their thesis and committee members. We need to anticipate objections from each committee member and structure them as requested.

   Steps:
   1. Identify the core claims of the thesis (5 points).
   2. Map each committee member's likely objections based on their background and interests.
   3. For each objection, phrase it in the member's idiom, target the specific claim, assign damage and likelihood, write a 90-second reply, identify the soft spot, and decide whether to concede, hold, or concede in part.

   Committee Members:
   - Member 1: Formal epistemologist (wants formalization, thinks in terms of conditionalization).
   - Member 2: Social epistemologist (conciliationist, sees peer disagreement and HOE as same, worries about pigheadedness).
   - Member 3: Philosopher of psychiatry (hostile to ideal-agent models, interested in impaired subjects like the user's mother).
   - Member 4: Kantian (interested in autonomy and paternalism, what this licenses us to do).

   The user's thesis:
    1. Higher-order evidence (HOE) doesn't add new reasons; it deletes first-order reasons that depended on the now-questioned capacity. Leaves a residue.
    2. Credence should be set by the residue. So, believing P even when knowing that the process was unreliable is rational if the residue supports P.
    3. Famous cases (exhausted driver, etc.) feel like a special norm against akrasia because in those cases the residue is empty.
    4. Corollary: No required degree of deference to HOE, no independent synchronic coherence requirement; just the arithmetic of deletion.
    5. This explains the user's mother's situation: not a rational failure, so arguing her out of it is not the solution.

   We need to generate about 8 objections. We'll try to cover each member at least once, and likely multiple times for the ones with multiple angles.

   Let's brainstorm objections per member:

   Member 1 (formal epistemologist):
    - Might object that the "deletion" process is not formally defined. How do we model it? Is it a theorem in a Bayesian framework?
    - Might ask: How does this account for cases where the residue is not easily separable? How do we calculate the residue?

   Member 2 (social epistemologist):
    - Might object that in peer disagreement, we have HOE that the peer disagrees. According to the user, this would only delete reasons that depend on my own reliability? But then why should I conciliate? This seems to allow ignoring the peer.
    - Might say: Your view licenses stubbornness in the face of contrary evidence.

   Member 3 (philosopher of psychiatry):
    - Might object: Your model assumes the subject can perform the deletion (separating residue from the questioned part). But your mother (and anosognosia patients) cannot. So how is your model applicable?
    - Might ask: How does this account for delusions? In delusions, the residue might be non-existent, but the subject still holds the belief? Or is the residue being misinterpreted?

   Member 4 (Kantian):
    - Might ask: If your mother is not being irrational (by your account), then what right do you have to intervene (e.g., take away the car keys)? How does this avoid paternalism?
    - Might object: Your model seems to undermine the importance of autonomy because it suggests that we can override a person's judgment even when they are rational by your lights.

   Additionally, we need to include the objection the user hopes nobody asks (which they suspect is about their mother being a counterexample).

   We'll structure 8 objections:

   1. From Member 1: Formalization of deletion.
   2. From Member 2: Peer disagreement as HOE and conciliation.
   3. From Member 2: License for pigheadedness.
   4. From Member 3: Impaired subjects (like the user's mother) cannot perform deletion.
   5. From Member 3: How does this account for delusions?
   6. From Member 4: What licenses intervention if the subject is rational?
   7. From Member 4: How does this avoid paternalism?
   8. The one the user hopes nobody asks: We suspect it might be that the mother's case is a counterexample because she cannot perform the deletion, but the user's theory requires it? Or that the residue in her case is actually not supporting her belief? (We'll design this one carefully.)

   Let's create the table:

   Note: The user wants 8 objections. We'll assign likelihoods and damages as per our judgment, but the user can adjust.

   We'll also note that the user's mother is central to the thesis, so objections about her case are critical.

   Now, we build the table in markdown.

   After the table, we'll provide the JSON object.

   Let's go.
