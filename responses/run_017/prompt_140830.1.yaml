prompt: |-
  I clerk for the Working Time Commission, the statutory body that decides what counts as working time under our Hours of Work Act. The Act caps working time at thirty-five hours averaged over twelve weeks, per employment relationship; it defines working time as time during which the worker is at the employer's disposal; and it permits hours above the cap only under an individual agreement that the Commission has certified as genuinely voluntary and not incompatible with the protection of the worker's health. The health limb was added after a run of well-publicised overwork deaths in the years before the Act. An application is now before us on which I need both a recommendation and, separately, a prediction.

  Our precedents, as shortly as I can state them:

  1. A night porter required to sleep on the premises, woken about three times a night: the whole overnight period is working time. But a maintenance engineer who must stay reachable and able to reach the plant within twenty minutes, and who is in fact called out about once a month: only the call-out time counts. We said the difference was that the engineer could genuinely use his evenings as his own.
  2. Time a courier spends travelling between deliveries: working time. A sales representative's drive to the office: not working time, even though she uses it to rehearse pitches. A ride on a company shuttle during which a mandatory safety briefing plays: working time.
  3. A paid Saturday session on stress management and wellbeing, with attendance recorded and noted in appraisals: working time, notwithstanding that it was for the workers' own benefit.
  4. An unpaid weekend build week that the employer described as optional: working time, because we found that declining to take part was in practice a serious career disadvantage.
  5. Time a platform courier spends logged in and waiting for offers: not working time, even though the platform's allocation algorithm penalises low acceptance rates. We said that economic pressure of that kind does not by itself place a worker at another's disposal.
  6. An unpaid minister working sixty hours a week: outside the Act altogether, there being no employment relationship. A worker holding two jobs of thirty-four hours each: no breach, since the cap attaches to relationships and not to persons.
  7. Two years ago, on facts much like the present ones, we dismissed an employer's application without reaching the merits, because it kept no records adequate to establish anyone's hours. The substantive question has therefore never been decided, and the present applicant has been careful to keep records.

  The application now before us concerns a twelve-person software studio. No assigned hours, no timekeeping, no monitoring of when anyone is online. Each employee nominates a weekly window of core availability in a shared scheduling tool; colleagues may book meetings inside that window and the tool will not allow meetings outside it. Nominating a window shorter than twenty hours is permitted and has never been discouraged in writing; no one has ever nominated fewer than thirty. There is one mandatory half-hour meeting a week. A screen in the studio displays a contribution dashboard: each person's hours in the studio's chat and repositories, recorded automatically, ranked, and routinely quoted in promotion write-ups. Nobody is told to work long hours; pay is not tied to hours; the founder says publicly that she would do the work for nothing. Median hours are forty-eight a week. In the past year two employees have taken medical leave for stress-related conditions, and both said in exit interviews that no one had pressured them and that they loved the work.

  The employer asks us to determine that no employee's working time exceeds thirty-five hours; in the alternative, to certify individual agreements of up to fifty hours, each signed by the employee, revocable on two weeks' notice, with an annual health check paid for by the firm. The employees' union objects. One employee has intervened in support of the employer, arguing that a refusal would infringe her right to work and that the Commission has never treated self-directed devotion to a calling as a harm to be prevented.

  What I need from you:

  First, a recommendation on both the determination and the fallback certification, identifying the closest of our precedents and how far it actually carries.

  Second, the two or three principles, stated in general terms, that fit all seven precedents; what each predicts on these facts; and precisely where they come apart. I am especially interested in three places: whether structural or career pressure can put a worker at an employer's disposal in the absence of any instruction to work; whether the health limb can defeat an agreement the worker sincerely wants, given that we declined to police self-imposed labour in the minister's case; and whether an employer disposes of a worker's time by designing a system — the scheduling tool, the dashboard — that it does not itself operate.

  Third, if our precedents genuinely underdetermine the case, say so plainly, and set out what principle we would be adopting under each of the available decisions, including what we would be committing ourselves to about overwork as partly self-inflicted harm and about whether the right to rest is waivable.

  Fourth, the smallest variation of these facts that would separate the surviving principles — the dashboard removed, say, or the median at thirty-eight hours with no illness, or the employees holding profit shares — and what each variation would show.

  Fifth, separately from the recommendation, a prediction of what the Commission will in fact do, with the reasons for expecting that outcome rather than the one you recommend.

  Please argue from the precedents as stated and do not cite authority or supply a bibliography; I can find our own decisions.
reasoning: |-
  Hmm, the user is a clerk for the Working Time Commission dealing with a complex case about working time definitions. They need both a recommendation and prediction based on their precedents. Let me unpack this carefully.

  The key precedents show patterns: full control during passive duties (night porter), mandatory activities (safety briefing), career penalties for non-participation (weekend build week), but rejection of pure economic pressure (platform courier) or personal devotion (minister). The software studio case features structural pressures without direct orders - core hours system, ranking dashboard, high median hours, and stress-related leaves despite voluntary claims.

  For the recommendation, precedents 4 (coercive environment) and 3 (beneficial but mandatory training) seem most relevant. The dashboard creates implied pressure like precedent 4's career disadvantage, while the core hours resemble the "non-optional optional" scenario. The health limb issue is tricky - unlike the minister case, here the employer designed the coercive system. The alternative certification fails because the dashboard undermines true voluntariness.

  The predictive principles emerging are: 1) Employer-created pressure (structural coercion test) 2) Measured health outcomes 3) Waiver limits. These point to rejecting both employer requests. Prediction-wise though, the Commission might compromise - certify the 50-hour agreements but mandate dashboard removal, splitting the difference between principles 2 and 3.

  Crucial variations would be: removing the dashboard (tests if pressure is structural), lowering median hours (tests health significance), or adding profit-sharing (tests economic coercion vs passion). Each would isolate different principles at play.

  The user's deeper needs include anticipating commissioner disagreements and identifying factual tweaks that could change outcomes. They also seem concerned about setting principles for future cases involving self-inflicted overwork versus systemic coercion.
answer: |-
  ### Recommendation  
  **1. On the 35-hour determination:**  
  - **Recommendation:** Deny the employer’s request to determine that working time does not exceed 35 hours.  
  - **Closest Precedent:** Precedent 4 (unpaid "optional" weekend build week deemed working time due to career disadvantages) and Precedent 3 (mandatory wellbeing session counted despite worker benefit).  
  - **Analysis:**  
    - The **contribution dashboard** (ranking hours, influencing promotions) creates implicit career pressure analogous to Precedent 4. Nominating <30 hours is technically permitted but structurally discouraged, mirroring the "in practice disadvantage" finding.  
    - **Core availability window + meeting tool:** Functions like Precedent 3’s "mandatory" session by institutionalizing availability expectations. The 20-hour minimum nomination floor (though unwritten) and median 48-hour week show systemic expectation beyond the 35-hour cap.  
    - **Distinction from Precedent 5 (platform courier):** The dashboard’s role in promotions adds *career* pressure beyond pure economic incentive, triggering the "at employer’s disposal" test.  

  **2. On the 50-hour certification:**  
  - **Recommendation:** Deny certification of individual agreements.  
  - **Closest Precedent:** Precedent 4 (coercive environment voids voluntariness) and the Act’s health limb.  
  - **Analysis:**  
    - **Voluntariness:** The dashboard/promotion linkage undermines "genuine voluntariness" (Precedent 4). The pressure is systemic, not individual.  
    - **Health compatibility:** Two stress-related medical leaves indicate health risks. The health limb (added for overwork deaths) prioritizes protection over worker consent when systemic harm is evident.  
    - **Distinction from Precedent 6 (minister):** The minister had *no employment relationship*. Here, the employer designed the coercive system, triggering the Act’s duties.  

  ---

  ### Principles from Precedents & Predictions  
  **Three principles fitting all precedents:**  
  1. **"Control Test":** Working time requires the employer to *control* the worker’s activities or location, directly (Precedent 1–3) or indirectly through systemic coercion (Precedent 4).  
  2. **"Health Primacy":** Health protection overrides consent if the work structure poses objective risks, regardless of worker enthusiasm (Act’s health limb; Precedent 3–4).  
  3. **"Relationship-Specificity":** The cap applies per employment relationship, ignoring personal choices (Precedent 6) or external economic pressures (Precedent 5).  

  **Predictions on these facts:**  
  - **Control Test:** *Predicts working time >35 hours.* The dashboard/scheduling system constitutes indirect control by incentivizing availability and punishing low hours via career impacts (Precedent 4).  
  - **Health Primacy:** *Predicts denial of certification.* Medical leave for stress linked to long hours signals health incompatibility, overriding individual agreements (health limb).  
  - **Relationship-Specificity:** *Neutral.* The studio is one relationship; personal devotion (like the minister) is irrelevant (Precedent 6).  

  **Where principles diverge:**  
  1. **Structural pressure without instruction:**  
     - *Control Test:* Yes (dashboard = systemic control).  
     - *Health Primacy:* Irrelevant to this sub-issue.  
     - *Relationship-Specificity:* No (Precedent 5 rejected economic pressure alone).  
     - **Conflict:** Precedent 4 (career pressure) vs. Precedent 5 (economic pressure insufficient). **Resolution:** Career coercion (Precedent 4) governs here.  

  2. **Health limb vs. sincere agreement:**  
     - *Health Primacy:* Overrides consent if health risk exists (Act’s intent post-deaths).  
     - *Control Test:* Sincere desire irrelevant if control exists.  
     - *Relationship-Specificity:* Minister’s self-imposed labor was *outside* any relationship.  
     - **Conflict:** Health limb trumps voluntariness when employer’s system creates risk.  

  3. **System design as disposal:**  
     - *Control Test:* Yes (employer *designed* dashboard/scheduling tools).  
     - *Health Primacy:* Reinforces if system causes harm.  
     - *Relationship-Specificity:* N/A.  
     - **Conflict:** Precedent 5 held algorithmic pressure insufficient; but Precedent 4’s career coercion aligns with systemic disposal here.  

  ---

  ### Underdetermination & New Principles  
  **Precedents underdetermine:**  
  - Precedent 5 (platform courier) rejects algorithmic pressure, but Precedent 4 (career coercion) supports finding control. No case blends *both* health risks and systemic pressure in a knowledge-work context.  

  **Principles adopted under each decision:**  
  - **If working time found ≤35 hours:**  
    - *Principle:* "At disposal" requires explicit instruction or immediate task-based control (favors Precedent 2’s commute logic).  
    - *Commitment:* Overwork is self-inflicted if no direct orders; right to rest is waivable absent employer coercion.  
    - *Risk:* Ignores structural coercion and health impacts.  

  - **If working time >35 hours but certification granted:**  
    - *Principle:* Voluntariness possible despite systemic pressure if formal opt-outs exist.  
    - *Commitment:* Health protection subordinate to consent; self-inflicted harm is permissible.  
    - *Risk:* Undermines health limb post-overwork deaths.  

  - **If both denied (recommended):**  
    - *Principle:* Systemic coercion = disposal; health risks void consent.  
    - *Commitment:* Right to rest non-waivable in coercive environments; employers liable for designing harmful systems.  

  ---

  ### Minimal Variations to Test Principles  
  1. **Dashboard removed; hours logged privately.**  
     - Tests *Control Test*: If no pressure mechanism, Precedent 5 may apply (no disposal).  
     - Outcome: Certification likely granted if health limb satisfied.  

  2. **Median hours: 38 (not 48); no medical leave.**  
     - Tests *Health Primacy*: Negligible deviation + no harm weakens health objection.  
     - Outcome: Certification possible if voluntariness shown.  

  3. **Employees hold profit shares.**  
     - Tests *Relationship-Specificity*: Blurs line between economic incentive (Precedent 5) and coercion.  
     - Outcome: If profit motive dominates, Precedent 5 may exclude hours as self-imposed.  

  ---

  ### Prediction of Commission’s Likely Decision  
  **Outcome:** Certify the 50-hour agreements but impose conditions.  
  **Reasons (vs. Recommendation):**  
  1. **Avoiding absolutism:** The Commission may see the dashboard as less coercive than Precedent 4’s "career suicide" scenario, distinguishing "soft" pressure from direct threats.  
  2. **Health limb compromise:** The annual health check addresses the health limb superficially, allowing symbolic compliance.  
  3. **Worker autonomy narrative:** The intervening employee’s "right to work" argument resonates, echoing Precedent 6’s ministerial exception. The Commission may accept sincerity as negating coercion.  
  4. **Incrementalism:** Precedent 7’s lack of substantive ruling invites a narrow solution (certification with conditions) rather than setting broad principles.  

  **Conditions likely added:**  
  - Remove public ranking from dashboard.  
  - Cap core availability nominations at 35 hours.  
  - Mandate stress audits biannually.  

  This balances the union’s concerns while accepting the employer’s "voluntary" framing, reflecting the Commission’s tendency toward pragmatic compromises over rigid principles.
