prompt: |-
  I am writing a chapter of my PhD thesis in political theory on the conceptual question of what counts as corruption, and I keep running into the same dissatisfaction with the formulation that dominates both the policy literature and the philosophical one: the principal—agent definition, on which corruption is roughly the abuse of entrusted power for private gain, or the deviation of an office-holder from the formal duties of their role in pursuit of some private advantage. It seems to me to misclassify the cases that actually matter for the cross-cultural worry. A small gift pressed on a rural clinic nurse or a municipal clerk, where refusal would be a grave insult and no favour is requested or given, comes out as corruption only if one stretches 'private gain' past breaking point, yet it is precisely the sort of case that Western anti-corruption campaigns treat as a symptom. And clientelism — a councillor who steers a drainage contract or a handful of public jobs to a neighbourhood that reliably turns out for her — comes out as straightforwardly corrupt on the standard view, even though the exchange is open, expected by everyone involved, and arguably a form of political responsiveness rather than a departure from it. The view I have been developing in response I call the avowal account: an exercise of public power is corrupt, on this view, when it is governed by a consideration that the office-holder could not avow as a reason in the justification they owe for that decision — so that what matters is not who gained, nor even whether a duty was breached, but whether the operative reason survives the publicity that office imposes. (I take the anthropological point about gifts creating bonds of obligation rather than transferring prices to be what makes the gift case interesting here, and I take the 'consideration' in question to include motives that are never spoken: the donor's phone call that mentions nothing at all.)

  What I would like is a careful comparison of the two accounts rather than a verdict on mine. Please set them against each other along roughly these axes, and add any axis you think I have missed: whether each needs a determinate account of the office's purpose or of the public interest that is independent of the office-holder's own avowable reasons, and what happens to it if no such account can be given; whether the avowal condition is genuinely independent of the entrusted-power formulation or merely a redescription of it, given that the duties of a role might already specify what can and cannot be avowed; how each handles the three cases above and, in particular, whether they diverge on gift-giving and on clientelism or quietly converge once the details are filled in; and whether the avowal account really escapes the charge of parochialism that is pressed against Western anti-corruption norms — since what a society will accept as an avowable reason for an official act is itself shaped by local expectations about office, obligation and friendship, my test may simply relocate the ethnocentrism one level down. I would also value your view on one downstream question: if the avowal account were right, would it support the line that anti-bribery law and corporate compliance practice try to draw between bribes and hospitality, or would it dissolve it, given that hospitality can equally be the sort of consideration that cannot be avowed?

  Since this is going into a thesis chapter, please be disciplined about the epistemic status of what you say: distinguish claims that are settled or near-settled among people who work on these questions from claims that are genuinely contested, and mark clearly where you are reconstructing my own view rather than reporting anyone's. Where the two accounts' verdicts on a case depend on a contested premise — about whether offices have determinate purposes, about the nature of gift obligation, about whether the principal—agent model fits political office at all — say so explicitly rather than presenting the resulting verdict as the consensus. Tell me what would have to be true for the avowal account to be preferable to the standard one, what you take the strongest objection to be, and where you think the comparison simply runs out because the question is not settled. Please write in British English.
reasoning: |-
  Okay, I need to carefully unpack this political theory query about corruption definitions. The user is writing a PhD thesis chapter comparing the principal-agent model with their proposed "avowal account," and they've laid out very specific analytical axes for comparison. This is sophisticated work - they're clearly deep into conceptual analysis and aware of anthropological critiques of Western anti-corruption norms.

  First, I should note their core dissatisfaction: the principal-agent model seems to misclassify two key cases - ritual gift-giving (where refusal would cause offense) and open clientelism (where benefits are publicly exchanged for political support). Their avowal account focuses on whether the official's reason for action could be publicly justified within their role. 

  The user wants a disciplined comparison, not just validation of their view. Key axes they've identified include: 
  - Need for an objective account of office purpose/public interest
  - Independence of avowal from role duties
  - Handling of the gift/clientelism cases
  - Potential parochialism in the avowal standard
  - Implications for bribery/hospitality distinctions

  I need to add epistemic rigor: distinguishing settled vs contested claims, marking reconstructions of their view, and flagging where premises are disputed. The anthropological literature on gifts and obligation will be crucial here, as will political theory debates about whether offices have essential purposes.

  For the gift case, I recall Marcel Mauss' work showing gifts create reciprocal obligations rather than being simple transactions - that's why the "private gain" framing strains. For clientelism, the work of Susan Stokes and James Scott on how patronage functions as informal governance might help explain why it's not clearly "deviation" in some contexts.

  The parochialism question is thorny - if avowability depends on local norms, doesn't that just embed Western standards differently? But maybe that's the point: their account makes this contingency explicit rather than pretending to universality.

  On bribery vs hospitality: under avowal, the key would be whether accepting hospitality creates unavowable reasons for future actions. Corporate compliance often struggles with this exact boundary.

  I'll structure the comparison to show where the accounts genuinely diverge (like the gift case) versus where they might converge if we interpret "duties" broadly. Important to emphasize that the principal-agent model assumes a clear principal, which is contested in democratic contexts where "the people" are multiple principals. 

  For epistemic transparency:
  - Settled: Principal-agent dominates policy docs but has anthropological critiques
  - Contested: Whether offices have fixed purposes; if clientelism is corrupt
  - Reconstructed: Their view of gifts creating bonds rather than transfers
  - Premise-dependent: Avowal's superiority requires rejecting fixed office purposes

  Strongest objection might be that avowal collapses into subjectivism without an objective standard - but their publicity requirement offers some buffer. The comparison runs out where we lack cross-cultural agreement on what counts as valid justification.

  This needs careful British English throughout - "practice" not "practise", "emphasise" with s, etc. Will maintain academic rigor while keeping it accessible for thesis integration.
answer: |-
  Here is a disciplined comparison of the Principal-Agent (P-A) and Avowal accounts of corruption, structured along your specified axes and supplemented with additional relevant dimensions. I adhere to your epistemic requirements, distinguishing settled/contested claims and marking reconstructions of your view. British English conventions are followed throughout.

  ---

  ### **1. Need for a Determinate Account of Office Purpose/Public Interest**
  *   **P-A Account:**  
      *Requires* an objective, determinate conception of the office's formal duties or the "public interest" (often embodied in law, regulations, or institutional norms). Corruption is deviation *from* this standard.  
      *If no determinate account exists:* The model struggles significantly. If duties are ambiguous, contested, or non-existent, identifying "deviation" or "abuse of entrusted power" becomes impossible or arbitrary. Critics (e.g., Markovits, Philp) argue this is common in politics, where roles involve balancing competing legitimate demands. The definition risks becoming either too broad (catching legitimate discretion) or collapsing entirely.  
      *Settled Aspect:* The P-A model *assumes* such a standard exists and is knowable.  
      *Contested Aspect:* Whether such determinate standards *can* exist for many political offices, especially representative ones.

  *   **Avowal Account (Your View - Reconstructed):**  
      *Does not strictly require* a prior, fully determinate account of the office's purpose or the public interest *independent* of the office-holder's own (avowable) reasoning within the role. The test focuses on the *justificatory structure* demanded by the office itself. The "public interest" emerges indirectly through the constraint of avowability within the office's justificatory context.  
      *If no determinate account exists:* The account may still function. The focus shifts to whether the reason guiding the act *can* be presented as a legitimate reason *within the justificatory practices expected of that office*, even if those practices are dynamic or contested. It relies on the office's inherent demand for public justification, not necessarily a fixed set of duties.  
      *Contested Premise:* Whether the "justification owed" by an office inherently implies *any* substantive constraints on reasons, or if it is purely procedural/contextual, risking relativism.

  ### **2. Independence from the Entrusted-Power Formulation**
  *   **Is Avowal Merely a Redescription?**  
      *Potential Convergence:* If the "duties of the role" are understood *as including* implicit norms of justification (i.e., *what counts as a valid reason* for action within the role), then the avowal condition *could* be seen as specifying the *mode* of deviation identified by the P-A model. Breaching a duty *just is* acting on an unavowable reason.  
      *Key Divergence (Your View - Reconstructed):** Your account suggests the avowal test is *distinct* and potentially *prior*. It argues that:
      1.  The P-A model focuses on *outcomes* (deviation, private gain) or *formal breaches*, while avowal focuses on the *reason* governing the *exercise* of power itself.
      2.  "Duties" might be underspecified or silent on the permissibility of acting for certain *types* of reasons (like non-transactional relational obligations), whereas avowal directly interrogates the reason's justificatory fitness.
      3.  Avowal captures cases where no formal duty is breached and no clear "private gain" exists, but the reason for action is still incompatible with public office (e.g., the anthropological gift case).  
      *Contested Question:* Whether "the duties of a role" inherently encompass norms of justificatory reasoning. If yes, significant convergence; if no, avowal offers a distinct criterion centred on the *governing reason* rather than the *act's conformity*.

  ### **3. Handling Key Cases**
  *   **The Ritual Gift (No favour requested/given, refusal=insult):**
      *   **P-A Account:** Verdict hinges on interpretation. *Strict View:* If the gift creates *any* sense of obligation (potential future gain?) or violates a strict rule against gifts, it's corrupt. *Lax View:* If no favour exchanged and culturally normative, not corrupt. This ambiguity and the strain on "private gain" are core weaknesses you identify. *Settled Aspect in Policy:* Western campaigns *do* often classify even small, non-transactional gifts as problematic symptoms ("corrosive" effect). *Contested Premise:* The nature of gift obligations (purely social bond vs. latent inducement).
      *   **Avowal Account:** Likely *not corrupt*. The reason for accepting is to avoid grave insult/preserve social harmony. Crucially, this reason *could* potentially be avowed ("I accepted this token to maintain essential working relations in this cultural context, with no expectation of favouritism"). Its avowability depends on the *specific* justificatory norms of that office in that context. The anthropological insight (gift as bond, not price) is central here.

  *   **Open Clientelism (Drainage contract/jobs for reliable votes):**
      *   **P-A Account:** *Generally classifies as corrupt.* The office-holder deviates from the formal duty of awarding contracts/jobs based on merit/public need ("public interest") to pursue a private/political advantage (securing re-election/personal power base). The openness doesn't negate the deviation; it may even aggravate it by demonstrating a brazen disregard for formal duties. *Settled Aspect in Policy Literature:* Clientelism is a core target of anti-corruption efforts. *Contested Aspect* (Philp, Stokes): Whether this reflects a Western bias, ignoring clientelism's role in representation, welfare provision, or political mobilisation in certain contexts.
      *   **Avowal Account:** Verdict is *context-dependent*. *Could be corrupt:* If the operative reason ("I awarded this contract to reward my loyal voters") *could not* be avowed as a legitimate justification for a public resource allocation decision within that political system's norms. *Might not be corrupt:* If the justification ("This ensures political stability/recognises community loyalty as a legitimate factor in distribution") *is* considered avowable within that specific political culture and office context. Your account highlights the tension between responsiveness and impartiality inherent in the case.

  *   **The Silent Phone Call (Donor calls, mentions nothing, official acts):**
      *   **P-A Account:** *Very likely corrupt* if a connection can be shown. The official deviates from duty due to an *implicit* understanding of private gain (maintaining donor favour/future support). Proving the connection is the practical challenge, but the *concept* fits.
      *   **Avowal Account:** *Likely corrupt.* The operative reason (a desire to please/not disappoint a significant donor, even unspoken) is almost certainly unavowable as a valid justification for an official act. The publicity test fails because admitting this motive would delegitimise the decision.

  ### **4. Parochialism/Ethnocentrism**
  *   **P-A Account:** *Vulnerable to the charge.* Its reliance on "formal duties" and "public interest" often reflects liberal-democratic, legalistic, often Weberian ideals of bureaucracy. Applying it cross-culturally can pathologise practices like gift-giving or certain forms of patronage deeply embedded in different social/political fabrics. The charge is well-established in anthropological and critical political theory literature (e.g., Gupta, Nuijten, Olivier de Sardan).
  *   **Avowal Account (Your View - Reconstructed):** *Mitigates but likely relocates the problem.* It avoids imposing a *substantive* standard (like "no gifts"). Instead, the test is procedural/justificatory *within the local context*: "What reasons can *this society* accept an official avowing for *this type* of act?" However, the charge of parochialism resurfaces because:
      1.  The *concept* of an "office" demanding public justification is itself a culturally specific construct (rooted in notions of the modern state).
      2.  Norms of "avowability" are shaped by local expectations about kinship, reciprocity, and authority. What's avowable in one context (e.g., prioritising kin) may be unavowable in another.
      3.  Western norms might still dominate the *interpretation* of what counts as a valid justificatory context for "an office".  
      *Contested Question:* Does making the standard context-dependent *sufficiently* address the parochialism charge, or does it merely internalise it? The account is less *substantively* parochial but remains vulnerable to *conceptual* and *interpretive* parochialism. Its strength is making the contingency explicit.

  ### **5. Additional Axis: Scope and Focus**
  *   **P-A Account:** Primarily focuses on the *actor* (agent) and the *act* (deviation). Its core concern is fidelity to the principal's interest/duty.
  *   **Avowal Account (Your View - Reconstructed):** Focuses on the *reason* governing the exercise of power. Its core concern is the *justificatory integrity* of the power relation inherent in the office. This shift potentially captures a wider range of normatively problematic exercises of power that lack clear deviation or private gain (e.g., acting out of unreflective prejudice, even if it aligns with formal duty).

  ### **6. Downstream Question: Bribes vs. Hospitality**
  *   **P-A Account:** Supports the *attempt* to draw a line, but struggles. The line rests on distinctions like intent, value, reciprocity, and impact on impartiality – all often ambiguous. Hospitality *can* be a conduit for private gain/deviation, hence compliance rules seek to regulate it.
  *   **Avowal Account (Your View - Reconstructed):** *Dissolves the sharp line; reframes the question.* The key is not the *label* (bribe/hospitality) but whether accepting the hospitality creates or activates a reason for official action that *cannot be avowed*. A lavish dinner from a contractor *becomes* problematic if the official feels (or is expected to feel) a sense of obligation influencing a future decision, making *that* obligation the unavowable reason. The test is dynamic: Hospitality is permissible *only so long as* it doesn't generate unavowable governing reasons for official acts. Compliance practice tries to operationalise this via bright-line rules (monetary thresholds, reporting), but the avowal account reveals these as proxies for the underlying justificatory concern.

  ### **Assessment: Conditions for Preference, Strongest Objection, Limits**
  *   **Conditions for Avowal Account's Preferability:** The avowal account would be preferable if:
      1.  The core wrong of corruption lies more in the *reason governing power* than in deviation per se or private gain.
      2.  Offices are better understood as sites of public justification than simply as instruments for fulfilling fixed duties.
      3.  A determinate, cross-culturally valid account of "public interest" or fixed duties is unattainable for many political roles.
      4.  Capturing cases like the anthropological gift (without stretching concepts) and contextual nuances of clientelism is paramount.
  *   **Strongest Objection:** **The Empty Formalism/Relativism Charge.** Without *some* substantive anchor (even a minimal or contested one), the avowal test risks collapsing. If avowability is *entirely* determined by local norms, then practices universally condemned as corrupt (e.g., blatant nepotism in critical appointments) might be deemed acceptable if locally justifiable. The account needs resources to criticise *degraded* or *oppressive* justificatory contexts. Can "the justification owed" provide this, or is it purely descriptive of existing norms? (This connects to debates around political realism vs. moralism, and public reason liberalism).
  *   **Where Comparison Runs Out (Unsettled Questions):**
      *   **The Ontology of Office:** Does an "office" inherently possess a purpose/duty, or is it constituted by practices of justification? (Philosophical dispute).
      *   **Nature of Political Representation:** Is the P-A model fundamentally ill-suited for elected representatives who *should* be responsive to constituents? (Contested in political theory - Pitkin vs. mandate/trustee debates).
      *   **Universalism vs. Contextualism:** Can *any* definition of corruption avoid significant parochialism, or is the concept inherently normative and culturally embedded? (Deeply contested in comparative politics/philosophy).
      *   **The Status of "Reasons":** How do we reliably identify the "operative reason," especially unspoken motives? (Epistemological challenge for the avowal account).

  ### **Conclusion of Comparison**
  The P-A and Avowal accounts offer fundamentally different lenses. The P-A model is act-centred, deviation-focused, and relies on (contestable) objective standards. Your Avowal account is reason-centred, justification-focused, and context-sensitive, prioritising the normative demands of public office as a site for giving reasons. They diverge significantly on the ritual gift case (P-A struggles, Avowal potentially exonerates) and offer contrasting perspectives on clientelism (P-A condemns, Avowal contextualises). While the Avowal account mitigates *substantive* parochialism, it faces charges of conceptual parochialism and relativism concerning justification norms. On bribery/hospitality, it dissolves the rigid line in favour of a dynamic assessment of governing reasons. Its superiority depends on accepting that the core wrong of corruption resides in the unavowable reason, that offices demand justification, and that fixed duties are often indeterminate or contested – premises central to your critique but actively debated in the field. The strongest challenge it faces is avoiding relativism while maintaining its contextual sensitivity.

  ---
  **Key to Epistemic Status:**
  *   **Settled/Near-Settled:** Dominance of P-A in policy; Anthropological critique of its application; Policy classification of gifts/clientelism.
  *   **Contested:** Determinacy of office purpose; Universality of P-A model for politics; Normative status of clientelism; Possibility of non-parochial definitions; Ontology of office.
  *   **Reconstructed (Your View):** Core tenets of the Avowal account; Interpretation of the gift case; Analysis of bribery/hospitality under avowal.
  *   **Premise-Dependent:** All verdicts on cases under both accounts depend on contested premises (as outlined in each section and the "Unsettled Questions").
