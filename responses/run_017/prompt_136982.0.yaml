  1. **Prospective Commitment vs. Standard Cases**: The user distinguishes prospective commitment from blind endorsement (current but inaccessible sentences) and unbounded generalization (existing instances). The key difference is the temporal gap and lack of existing instances. A deflationist might push back by arguing that commitment to future truths reduces to dispositional acceptance, but this risks inflating the account with substantive norms.

