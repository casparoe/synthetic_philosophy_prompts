prompt: |-
  You are a professional philosopher and an experienced medical educator with particular expertise in bioethics and the metaphysical questions at the edge of life and death.

  I am a graduate teaching assistant, and next week I have to lead a single fifty-minute seminar for first-year medical students on the definition of death, with the aim of making sense of the contrast between neurological criteria (brain death) and circulatory criteria for determining that a person has died. I do not want you to explain the concept to me. Instead, plan how I should explain it.

  To keep the session concrete and to stop the students from merely memorizing slogans, I want to build the whole session around one detailed case. The case I have in mind is this. A patient has suffered a catastrophic, irreversible brain injury and is being kept on a ventilator. The family decides to withdraw life-sustaining treatment. In the operating room, the ventilator is withdrawn. After the standard interval of several minutes without a pulse or any effort to breathe, a physician declares the patient dead on the basis of the permanent cessation of circulatory and respiratory function. Immediately after this declaration, a surgical team connects the body to a pump that circulates warm, oxygenated blood into the arteries of the abdomen and legs, so that the kidneys and liver stay healthy and can be transplanted. Crucially, before starting the pump, the surgeon clamps the major artery just above the vessels that supply the brain, so that no blood reaches the head. The pump runs for an hour; during that time the abdomen is warm and the abdominal organs are functioning, while the brain receives no blood flow at all. I will refer to this as the abdominal perfusion case.

  Please tell me whether the abdominal perfusion case should carry the entire session, or whether it needs to be modified or replaced. If it is the right case, specify what it must include and what it must lack to serve as the central example. If a different or adjusted case would be better, say so and explain why.

  Then give me the full teaching plan. Set out the exact order in which the ideas must be introduced and explain the dependency structure: why each step must come before or after the others. Identify the misconceptions first-year medical students will predictably bring with them or form during the session — for instance, the assumption that any flowing blood or a warm, pink body means the patient is not dead, or that brain death is just a deep coma or a persistent vegetative state — and indicate the precise point in the sequence at which I should head off each misconception. Provide one question to ask at the end that would show whether the students have genuinely understood the philosophical problem rather than just learned the two sets of criteria. Finally, say what I should openly refuse to explain at this level and explicitly announce that I am leaving it out.

  Before you write, think carefully and brainstorm the relevant conceptual dependencies privately; do not include this brainstorming in your response. Begin your response with a single sentence that states the bottom line of your pedagogical plan, meaning the one decision about framing or sequencing on which the success of the whole session depends, and then give the rest of the plan and the reasoning. Use no preamble, do not restate any part of this request, and include no preface or commentary before that first sentence.
reasoning: |-
  Hmm, the user wants me to act as both a professional philosopher and medical educator to design a teaching session about defining death for first-year medical students. They want me to plan how to explain the contrast between neurological criteria (brain death) and circulatory criteria using a specific case about abdominal perfusion.

  The abdominal perfusion case is quite provocative: a brain-dead patient declared dead after circulatory cessation, then connected to a perfusion pump that circulates blood only to abdominal organs while deliberately isolating the brain. This creates a powerful tension between bodily signs of "life" and brain absence.

  This case is pedagogically brilliant because it:
  - Forces confrontation with the core question: what constitutes death?
  - Viscerally challenges intuitions about warmth and circulation
  - Separates brain function from somatic integration
  - Exposes contradictions between criteria systems

  I should build the entire session around this case. The key to success is sequencing the questions in a specific order to guide students through the conceptual landscape.

  The session must address predictable misconceptions:
  - "Warm body = alive" (common intuition)
  - "Brain death is just coma" (confusion with persistent vegetative state)
  - "Circulation means consciousness could return" (failure to grasp irreversibility)

  Pedagogical sequencing should be:
  1. Establish the clinical scenario and declaration of death using circulatory criteria
  2. Introduce perfusion and observe student reactions to "revived" abdominal signs
  3. Systematically dismantle misconceptions by revealing the brain isolation
  4. Contrast with brain death protocol where circulation persists but brain function is absent
  5. Force the fundamental question: what is being preserved in each scenario?

  The critical end question should test conceptual understanding: "If we perfused the whole body including the brain, would the person still be dead? Why does clamping the cerebral vessels change the ethical meaning of perfusion?"

  I'll explicitly refuse to discuss:
  - Consciousness studies (too advanced)
  - Legal variations by jurisdiction (distracting)
  - Religious definitions (beyond scope)
  - Technical organ preservation methods (irrelevant)

  This approach uses cognitive dissonance to make abstract criteria concrete while preventing slogan-memorization. The perfusion case's visceral nature will anchor the philosophical debate in clinical reality.
answer: |-
  The success of the entire session depends on introducing the abdominal perfusion case *after* establishing the standard circulatory criteria for death but *before* defining brain death, forcing students to confront the inadequacy of bodily integration alone as a marker of life.  

  **Teaching Plan Sequence & Rationale:**  
  1.  **(5 min) Set Up Circulatory Death:** Briefly define death as the *irreversible cessation of circulatory and respiratory functions*. Explain the standard clinical process: withdrawal of support, waiting period (2-5 mins), absence of pulse/breathing, declaration of death. Emphasize this is legally and medically accepted.  
      *   *Why first?* Establishes the baseline understanding students likely arrive with. Provides the framework the case will challenge.  

  2.  **(10 min) Present the Abdominal Perfusion Case (as described):** Narrate the case clearly, highlighting:  
      *   Declaration of death based *solely* on irreversible circulatory/respiratory cessation.  
      *   **CRUCIAL INCLUSIONS:** Immediate initiation of regional perfusion *after* declaration; warm, oxygenated blood perfusing *only* abdomen/legs via pump; explicit clamping above brain vessels ensuring *zero cerebral blood flow*; functioning abdominal organs (e.g., urine output, metabolic activity); duration (1 hour).  
      *   **CRUCIAL EXCLUSIONS:** No mention of brain function/status prior to perfusion; no spontaneous circulation/breathing returns; perfusion is entirely artificial and regional.  
      *   *Why now?* Creates cognitive dissonance. Students see "life signs" (warmth, organ function) in a body declared dead.  

  3.  **(10 min) Elicit Reactions & Address Key Misconception #1:**  
      *   **Ask:** *"The patient was declared dead based on circulatory criteria. We now see a warm abdomen, pink skin on the legs, and functioning kidneys/liver thanks to the pump. Does this mean the patient is alive again? Or was the declaration of death wrong?"*  
      *   *Anticipated Misconceptions/Intuitions:* "Warmth/flow/function means alive"; "Death declaration must be revoked."  
      *   **Head Off Here:** Clarify the perfusion is *artificial, mechanical, and selective*. Emphasize:  
          *   No spontaneous circulation or breathing exists.  
          *   The *entire brain* is isolated and receives *no blood flow*.  
          *   The declared cessation of circulatory/respiratory function was *irreversible* without the artificial pump, which is an intervention *after* death. Bodily warmth/partial function ≠ life return.  

  4.  **(10 min) Introduce Neurological Criteria (Brain Death):**  
      *   Define brain death as the *irreversible cessation of all functions of the entire brain, including the brainstem*.  
      *   Explain key diagnostic tests (e.g., apnea test, absence of brainstem reflexes, confirmatory tests showing no blood flow/electrical activity).  
      *   Emphasize: A brain-dead patient *can* have a beating heart and warm body *if* on a ventilator.  
      *   *Why after the case?* The perfusion case primes students to understand that intact bodily functions *can* persist without brain function. The contrast is stark.  

  5.  **(10 min) Contrast & Address Key Misconception #2:**  
      *   **Pose:** *"Compare our perfusion case patient (declared dead by circulatory criteria, now with perfused abdomen) to a brain-dead patient (on a ventilator with a beating heart). Both have some bodily function. What's the fundamental difference? What does brain death tell us that circulatory death plus abdominal perfusion doesn't?"*  
      *   *Anticipated Misconception:* "Brain death is just a deep coma/PVS"; "The person might recover."  
      *   **Head Off Here:** Stress that brain death means:  
          *   **No capacity for consciousness** (permanently lost).  
          *   **No capacity for spontaneous breathing** (apnea test confirms brainstem failure).  
          *   **No integrated bodily function** (hormonal chaos, inability to regulate temperature/BP without support – unlike the perfused abdomen which is *artificially* supported locally). Brain death is the biological death of the organism *as a whole*, not a state of impaired consciousness.  

  6.  **(4 min) Synthesize the Core Philosophical Problem:**  
      *   Reiterate the tension: Circulatory death focuses on the *engine stopping*. Brain death focuses on the *driver being gone forever*, even if the engine can be idled artificially.  
      *   The perfusion case exposes that "life" isn't just about cells functioning; it's about the *integrated functioning of the organism as a whole*, which requires the unifying role of the brain. Warm legs don't make a person; an integrated conscious being does (which requires a brain).  

  7.  **(1 min) The Key Assessment Question:**  
      *   **Ask:** *"If, in the perfusion case, the surgeon had* accidentally *failed to clamp the artery above the brain, allowing some blood flow to reach the injured brain during the hour of perfusion, would that change whether the patient was truly dead? Why or why not?"*  
      *   *Why this question?* It tests if they grasp that death hinges on *irreversibility* of loss (brain function was already catastrophically destroyed *before* withdrawal, so brief accidental flow wouldn't reverse it) and the *biological reality* underlying the criteria, not just the procedural declaration. It forces them beyond memorized definitions.  

  **What to Explicitly Refuse to Explain:**  
  At the end of step 4 (Introducing Brain Death), state: *"We are focusing on the biological and conceptual foundations of the two criteria today. We are explicitly* not *delving into the complex legal variations between jurisdictions regarding which criterion is primary for organ donation or death certification, nor the specific ethical debates surrounding organ procurement timelines like DCD (Donation after Circulatory Death) protocols. Those are crucial topics for another session building on this foundation."*
