answer: |-
  ### Exam Question: Cluelessness and Drift  
  **Time Allowed:** 2 hours  
  **Word Guide:** 800–1000 words  
  **Total Marks:** 20  

  ---

  **Background:**  
  Consequentialism requires agents to maximize *expected moral value* (the sum of the value of outcomes, weighted by their probability). A core challenge is *cluelessness*: we often lack reliable evidence about the long-term consequences of our actions. For example:  
  - *Jane* must decide whether to donate $1,000 to Charity A (focused on immediate disaster relief) or Charity B (focused on policy advocacy for climate change mitigation).  
  - She knows Charity A will predictably save 10 lives this year.  
  - Charity B *might* avert ecological collapse in 100 years (saving millions) or achieve nothing (if policies fail). Jane has no credible way to estimate the probability or scale of these outcomes.  

  **The Wrinkle: Drift**  
  Jane notices her intuitions are systematically skewed:  
  - She can vividly imagine Charity A’s rescued families (near-term, concrete).  
  - Charity B’s potential impacts feel abstract and "foggy." Her mind defaults to underestimating both the probability and scale of its long-term effects.  
  - Crucially, she cannot "correct" this bias:  
    - Introspection only accesses her already-skewed intuitions.  
    - She only observes outcomes of the option she *chose*, never the counterfactual.  
    - Past "successes" (e.g., positive feedback about Charity A) reinforce the bias.  

  This systematic pull toward near-term, vivid, easily legible effects is called **drift**.  

  **Your Task:**  
  Does **drift** transform the problem of cluelessness in a way that undermines standard responses? Critically assess:  
  1. Whether drift threatens our ability to compare the *sign* (direction) or *magnitude* (size) of expected value differences between actions—and which one matters more for maximizing expected value.  
  2. Whether the "near-term tiebreaker" response (choose based on predictable short-term effects when long-term effects are uncertain) *solves* or *worsens* the problem under drift.  
  3. Whether the claim that "errors cancel out over many decisions" holds if errors are *correlated* (due to drift) rather than random.  
  4. If shifting to rule-based or institutional decision-making avoids drift, whether this:  
     - (a) Remains a consequentialist approach,  
     - (b) Triggers a regress (e.g., "How do I choose the *rule* without drift?"), and  
     - (c) What the cost of such a regress might be.  
  5. Whether a non-consequentialist theory (e.g., one with side-constraints like "never violate rights") handles drift better, given it doesn’t require precise magnitude comparisons. Does this comparison favor consequentialism or not?  
  6. What could provide evidence *for* or *against* drift affecting Jane’s judgment, and whether the unfalsifiability of drift makes it an "idle" worry.  

  *(Define all technical terms in your answer. No citations needed.)*  

  ---

  ### Model Answer (Approx. 900 words)  
  **Does Drift Deepen the Problem of Cluelessness?**  
  Cluelessness arises when we cannot estimate the expected moral value (EMV) of actions due to ignorance about consequences. *Drift*—systematic bias toward vivid near-term effects—exacerbates this by distorting how we assign probabilities and values to outcomes. I argue drift fundamentally alters the challenge by undermining standard solutions.  

  **(1) Sign vs. Magnitude and the Core Threat**  
  Maximizing EMV requires comparing *magnitudes*: we need to know if Charity B’s EMV is *higher enough* than Charity A’s to justify forgoing known short-term gains. Drift attacks this by compressing estimates of long-term impacts toward zero (making Charity B *seem* marginally better when it might be vastly superior). Knowing the *sign* (that B *could* be better) is insufficient; without reliable magnitudes, maximizing EMV is impossible. Drift thus threatens the very inputs consequentialism requires.  

  **(2) The Near-Term Tiebreaker: A Self-Defeating Fix?**  
  A common reply to cluelessness is to use predictable near-term effects as tiebreakers. But under drift, this amplifies the problem. Drift *overweights* near-term effects because they are vivid and measurable. Privileging them institutionalizes the bias: Jane picks Charity A because its benefits are salient, precisely when Charity B’s obscured long-term EMV might dwarf it. The tiebreaker doesn’t mitigate cluelessness—it codifies drift.  

  **(3) Correlated Errors Prevent Cancellation**  
  If estimation errors were random, mistakes might "cancel out" over many decisions. Drift makes errors *correlated*: Jane consistently underestimates long-term stakes across all similar choices. Over a lifetime, this compounds; she systematically undervalues interventions with deferred payoffs (e.g., policy work, prevention). No cancellation occurs—only reinforced divergence from optimal EMV-maximization.  

  **(4) Process Fixes: Consequentialist Regress**  
  Shifting to rules ("always invest in long-term institutions") or delegation ("defer to experts") might counter individual drift. This *is* consequentialist if justified by higher EMV. However, choosing the rule/delegate faces the same drift problem: Jane will favor processes that feel legible (e.g., quantifiable short-term metrics). This regress has costs:  
  - **Epistemic cost:** Each layer adds uncertainty.  
  - **Opportunity cost:** Rigid rules may miss context-specific EMV gains.  
  While not fatal, it requires trusting that institutional EMV exceeds individual bias—a trust drift undermines.  

  **(5) Side-Constraints: A Pyrrhic Victory?**  
  A theory with side-constraints (e.g., "prioritize current rights") avoids magnitude comparisons. It handles drift better *procedurally* since it ignores distorted long-term calculations. But this "solution" is costly: side-constraints cannot respond to stakes. If Charity B could prevent genocide, forbidding Jane to risk short-term harm for long-term gain is catastrophic. Drift doesn’t make non-consequentialism *correct*; it highlights that no theory escapes trade-offs under uncertainty.  

  **(6) Evidence and Unfalsifiability**  
  Evidence for drift includes:  
  - Psychological patterns (e.g., hyperbolic discounting).  
  - Discrepancies between predicted vs. actual long-term impacts *where measurable* (e.g., undervaluing preventative health).  
  Crucially, *absence* of counterfactuals makes drift unfalsifiable *for specific choices*. But this doesn’t make it idle: unfalsifiable biases can still systematically distort decisions. We needn’t prove drift in *this* case to warrant hedging against *possible* drift where stakes are high.  

  **Conclusion**  
  Drift reframes cluelessness from an *epistemic* gap to a *structural* bias in how we process uncertainty. It invalidates "cancelling errors" and "near-term tiebreaker" responses, forces risky regresses in process-based solutions, and exposes trade-offs in non-consequentialist alternatives. While not insurmountable, it demands new strategies—perhaps embracing uncertainty-aware humility—beyond standard consequentialist tools.  

  ---

  ### Marking Scheme (20 Total Marks)  
  | **Key Point**                                | **Marks** | **Common Issues**                                                                 |  
  |----------------------------------------------|-----------|-----------------------------------------------------------------------------------|  
  | **1. Sign vs. Magnitude:** Distinguishes that EMV maximization needs *magnitude* comparisons; drift primarily threatens magnitude (not sign). | 4 | Confuses sign/magnitude; claims "any comparison is impossible." |  
  | **2. Near-Term Tiebreaker:** Identifies that privileging near-term effects *amplifies* drift because bias already favors them. | 4 | Treats tiebreaker as neutral/solution; misses self-defeating dynamic. |  
  | **3. Correlated Errors:** Explains why correlated errors (from drift) prevent cancellation over repeated choices. | 3 | Assumes independence of errors; misses compounding effect. |  
  | **4. Process Fixes & Regress:** Notes that rule/institutional solutions (a) can be consequentialist but (b) face regress with costs. | 3 | Claims process fully solves drift; misses regress or costs. |  
  | **5. Side-Constraints:** Argues they avoid magnitude comparisons but lose flexibility; no clear "winner" vs. consequentialism. | 3 | Declares side-constraints superior; ignores stakes-sensitivity trade-off. |  
  | **6. Evidence:** Identifies indirect evidence for drift; argues unfalsifiability ≠ irrelevance. | 2 | Claims "no evidence possible = not a problem"; demands unrealistic proof. |  
  | **Clarity/Structure:** Definitions, logical flow, concision. | 1 | Undefined terms; disorganized. |  

  ---

  ### A vs. B Differentiation  
  - **A Answer (17–20):** Must **explicitly argue that the near-term tiebreaker is not just ineffective but counterproductive** under drift (i.e., it institutionalizes the very bias causing the problem). This demonstrates grasp of drift’s transformative implication.  
  - **B Answer (12–16):** Accurately summarizes all points *except* the tiebreaker’s self-defeating nature (e.g., treats it as "still useful" or ignores its role in amplifying bias).  

  This distinction tests whether students see drift as a *qualitative* shift in the problem structure—not just "more cluelessness."
