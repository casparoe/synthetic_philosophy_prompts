prompt: |-
  I am finalizing the research agenda for a small, three-year, six-person project — two philosophers, two evolutionary or dynamic modelers, two empirically oriented social scientists — with a deliberately narrow remit: to explain how norms arise, persist, and break down in large, decentralized, mostly anonymous online communities that have no central enforcer and no shared history. Think open-source projects with thousands of transient contributors, federated servers with incompatible clients, or governance fora attached to digital assets. The theoretical starting point is Lewis's account of convention: a regularity of behavior in a recurring coordination problem, sustained by people's expectations about what others will do together with their preference to conform given those expectations. Beyond that starting point, the group is free to move toward the dynamic and evolutionary treatments that ask how such regularities can get going and spread without anyone designing them.

  There is one phenomenon I want the agenda to confront head-on, because I do not think Lewis's apparatus was built for it, and because I suspect it is doing most of the explanatory work in the cases we care about. Call it sedimentation. In these communities, a great many stable regularities are not held in place by anyone's expectations at all: they are baked into defaults, templates, boilerplate, permission structures, moderation bots, and merge-gate scripts. Agents conform without forming any belief about what others will do, and frequently could not defect even if they tried. Such a regularity can persist while literally nobody has either an empirical expectation (a belief that others conform) or a normative expectation (a belief that others think one ought to conform) concerning it. The pattern lives in the artifact, not in the participants' heads. Say that a regularity is sedimented when it would survive the wholesale deletion of everyone's expectations about other people, because the choice architecture alone is sufficient to regenerate it.

  Sedimentation seems to me to generate a cluster of questions that this project has to decide how to rank, and I would like your own argued ordering rather than a menu. Some candidates, offered only to be criticized, replaced, or reorganized:

  Whether a sedimented regularity is a counterexample to the expectations condition in Lewis's definition, or a limiting case that the definition should be revised to accommodate — for instance by moving to dispositions that would produce conformity under counterfactual removal of the scaffolding, or by treating the artifact as a kind of proxy participant whose behavior can be expected even when no agent's can.

  What the de-sedimentation test reveals. When the infrastructure changes — a client update, a fork, a change of defaults — the scaffolding is partially removed and we see what remains. Does what survives that event tell us whether a convention was ever there, or only how well the artifact was designed?

  How sedimentation interacts with the standard mechanisms: salience, precedent, chains of precedent, the generation of common knowledge, and, in the dynamic models, the size and shape of the basins of attraction around competing equilibria. Do defaults artificially enlarge a basin, producing a kind of counterfeit path-dependence that would evaporate under perturbation?

  What the distinction is worth, extensionally: in the communities we study, how much of apparent norm stability is really artifact stability, and is the interesting class of cases the sedimented ones or the residual ones that survive de-sedimentation?

  The weaning problem, which is where the funder's practical interest lands. If a designer wants a regularity that outlives the scaffolding — that becomes a genuine norm people carry with them into new communities and new tools — can defaults be used to bootstrap real expectations and then be withdrawn? Is there a principled account of when scaffolding converts expectations and when it merely suppresses them, possibly atrophying the very dispositions it was meant to seed?

  And the measurement question: what empirical procedure would actually separate a sedimented regularity from an expectation-sustained one in a live community, given that you cannot simply ask participants, and given that many of the obvious interventions are ethically or politically unavailable to a research team?

  Here is what I want from you. Give me a single ranked list of the two or three lines of work this group should spend its time on, drawn from the above or, better, from questions I have not thought of, and defend the ordering explicitly: which criteria are doing the work — how many other questions turn on the answer, whether it is tractable in three years with this particular mix of people, whether it is genuinely neglected as opposed to merely unfashionable, and how much it would pay off for the practical aim of designing communities that repair themselves after a shock — and where those criteria conflict, say which one you let win and why. For each item, tell me concretely what the group would have in hand at the end that it does not have now: a definition, a theorem, a model, a falsifiable prediction, a measurement instrument. Then tell me which candidate on my list is overrated or a trap, and why.

  Finally, be opinionated and be accountable about it. Commit to one ordering with reasons rather than laying out considerations and leaving the choice to me. Say which two of your judgments you hold most confidently, name the place where your ranking is most likely to be wrong, and state what the group could discover in its first year that would move an item up or down the list. I do not need a literature review, citations, or a map of who has said what; I need the reasoning. Where you are relying on a contested reading of what a convention is, or on a stipulation about the cases that you think I should not grant, flag that rather than smoothing it over.
reasoning: |-
  Okay, I need to help this user finalize their research agenda. Let me start by understanding their core challenge. They have a three-year project with a specific team composition: philosophers, modelers, and social scientists. Their focus is on norms in large, online communities without central enforcement. The key issue they want to tackle is "sedimentation"—where norms are embedded in the infrastructure itself, not in people's expectations.

  First, I should grasp why sedimentation is crucial here. The user believes Lewis's convention theory falls short because sedimented norms persist without expectations. The examples given—defaults, bots, scripts—show how infrastructure enforces conformity. The user listed several questions but wants a prioritized list based on impact, feasibility, and alignment with practical goals.

  The user's explicit needs are clear: a ranked list of research lines, defense of the order, concrete outcomes, and identification of overrated questions. But deeper needs might include wanting actionable insights for community designers and ensuring the project delivers tangible results within three years. They also seem concerned about distinguishing their approach from existing work, emphasizing novel contributions.

  Now, evaluating their questions. The de-sedimentation test stands out because it's empirical and feasible. The team can study real events like forks or updates. This tackles the measurement problem and reveals what's truly a norm versus an artifact. It's practical, leveraging the empirical strengths of the team. 

  Next, the weaning problem aligns with the funder's interest in bootstrapping self-sustaining norms. It bridges theory and practice, using models to test scaffold removal. This involves all team members: modelers simulate, social scientists design experiments, philosophers refine concepts. 

  Why not the convention definition question first? It's foundational but might get bogged down in debates without empirical grounding. Better to address it after real-world data from de-sedimentation studies. The measurement challenge is inherent in de-sedimentation, so tackling it directly through events avoids ethical issues with interventions.

  Overrated candidate: "What the distinction is worth." While important, it's descriptive rather than generative. Prioritizing it might lead to taxonomy without actionable theories. The team needs mechanisms, not just classifications.

  Confident judgments: De-sedimentation as top priority because it's tractable and foundational. Weaning problem second due to practical payoff. The risk is that de-sedimentation events are rare, but the team can use historical cases or simulations initially. If Year 1 shows scarcity, shifting focus to the weaning problem's simulations could be a pivot.

  In summary, the priority is generating empirical evidence and practical models, ensuring the project delivers both theoretical insights and tools for designers.
answer: |-
  Here is a sharply prioritized research agenda for your project, grounded in your constraints and ambitions, with explicit reasoning:

  ### Ranked Research Priorities
  1.  **The De-Sedimentation Test: What Survives When Scaffolding Crumbles?**
      *   **Why #1?**
          *   **Foundation for Everything Else:** This question directly confronts the core phenomenon (sedimentation) and provides essential *empirical* data. You cannot rigorously address "what is a convention," "how much is artifact," or "can we bootstrap real norms" without first knowing *what patterns actually persist when infrastructure shifts*. It operationalizes sedimentation.
          *   **Tractability & Team Fit:** Perfectly leverages your team mix. Empiricists identify/document real-world de-sedimentation events (forks, major updates, migrations). Modelers simulate these events in silico, testing sensitivity of equilibria to scaffold removal. Philosophers analyze the *nature* of the surviving regularity (does it *now* rely on expectations? Is it a new artifact?).
          *   **Practical Payoff:** Directly informs designers about the fragility/resilience of their systems. Reveals which "norms" are truly internalized vs. structurally enforced. Critical for understanding "repair after shock" – de-sedimation *is* the shock.
          *   **Neglected Angle:** While infrastructure is studied, systematic analysis of *what survives intentional or accidental removal of specific scaffolds* in live communities is rare. This focuses squarely on that transition.
      *   **Concrete Deliverable (3 Years):** A typology of de-sedimentation events and outcomes across multiple case studies (e.g., forks of major OSS projects, major API changes in federated platforms), coupled with an agent-based model demonstrating how different basin shapes interact with scaffold removal to preserve/destroy regularities. A falsifiable prediction: *"Regularities surviving high-magnitude de-sedimentation events will show rapid re-emergence of expectation-based conformity mechanisms."*

  2.  **The Weaning Problem: Can Scaffolds Bootstrap Genuine Norms?**
      *   **Why #2?**
          *   **Funder Alignment & High Stakes:** Directly addresses the core practical goal: designing communities that become self-sustaining. This is where theory meets actionable design principles.
          *   **Builds on #1:** Requires understanding *what* survives de-sedimentation (#1) to ask *how* to design scaffolds that *create* things that survive. It forces the crucial distinction between *suppression* (scaffold just enforces) and *conversion* (scaffold cultivates expectations).
          *   **Team Synergy:** Modelers design simulations testing scaffold-removal strategies. Philosophers conceptualize "genuine norm" vs. "structural compliance" and refine counterfactual tests. Empiricists identify historical examples of successful/failed weaning (e.g., evolution of coding standards from enforced linters to shared ethos; governance shifts in DAOs).
          *   **Generative:** Success or failure here profoundly impacts your understanding of sedimentation's relationship to convention (does successful weaning vindicate Lewis? Does failure show norms are artifacts?).
      *   **Concrete Deliverable (3 Years):** A set of empirically grounded design principles (with caveats) for scaffold design intended to foster internalization. An agent-based model demonstrating the conditions (e.g., network structure, learning rates, punishment mechanisms) under which scaffold removal leads to persistence (conversion) vs. collapse (suppression) of the regularity. A falsifiable prediction: *"Scaffolds incorporating elements fostering mutual observation and low-cost sanctioning will show higher rates of successful weaning than purely architectural constraints."*

  3.  **Interaction of Sedimentation with Dynamic Mechanisms (Basins, Precedent, Salience)**
      *   **Why #3?**
          *   **Mechanistic Explanation:** Moves beyond description (#1) and application (#2) to explain *how* sedimentation actually works in the coordination landscape. How does a default *artificially* enlarge a basin? Does precedent set by a bot *count* for human salience?
          *   **Crucial for Model Fidelity:** Without understanding this, your dynamic models (#1, #2 deliverables) risk being naive. This provides the theoretical engine.
          *   **Integrates Perspectives:** Philosophers grapple with the ontology of "precedent" set by artifacts. Modelers formalize how infrastructure alters payoff structures and information flow, reshaping basins. Empiricists look for traces (e.g., discourse around bot actions, reactions to default changes revealing perceived salience).
          *   **Explains Path-Dependence:** Directly tackles whether sedimented stability is "counterfeit" or creates a *new*, robust path.
      *   **Concrete Deliverable (3 Years):** Formal extensions to standard evolutionary game theory models incorporating infrastructure as a parameter that dynamically shapes basins of attraction and information availability. Philosophical analysis reconciling artifact-driven salience/precedent with traditional accounts. Empirical case studies correlating specific scaffold features (e.g., default prominence, bot transparency) with observed path-dependence in community evolution.

  ### The Overrated Candidate: "What the Distinction is Worth, Extensionally"
  *   **Why a Trap?** While seemingly central, this question risks becoming a descriptive taxonomy exercise ("how much is artifact vs expectation here?"). It doesn't inherently drive *mechanistic understanding* or *practical application* as powerfully as the top three. Answering it *well* requires the tools developed in #1 (measurement via de-sedimentation) and #3 (understanding interaction mechanisms). Prioritizing it first could lead to endless case categorization without generating the underlying theory or design insights needed for your goals. It's a vital *outcome* of the other lines, not the best starting engine.

  ### Accountability & Confidence
  *   **Most Confident Judgments:**
      1.  **De-Sedimentation as #1:** This is the most direct, feasible, and foundational empirical assault on sedimentation itself. Ignoring it leaves the entire project floating on abstract speculation about artifacts. It *must* come first to ground the rest.
      2.  **Weaning Problem as #2:** The funder's interest isn't just a constraint; it points to the most transformative potential outcome of the research. Failing to prioritize this risks academic navel-gazing over actionable knowledge.
  *   **Where My Ranking is Most Likely Wrong: Interaction (#3) vs. Convention Definition.** I deprioritized redefining Lewis (#1 on your candidate list) because I believe forcing the definition *before* robust empirical findings (#1) and practical tests (#2) is premature. However, the team's philosophers might find early conceptual clashes (e.g., "proxy participant") so fundamental that they stall progress on #1/#2 without prior resolution. This is the tension.
  *   **What Could Move Items in Year 1:**
      *   **If De-Sedimentation (#1) Proves Impractical:** Difficulty finding clean case studies or developing valid simulations would be a major red flag. This could force a pivot towards **Weaning (#2)** using simulated communities/modeling as the primary focus, or elevate **Interaction (#3)** to provide theoretical grounding without the heavy empirical lift.
      *   **If Early De-Sedimation Cases Reveal Startling Persistence:** Finding robust expectation-based conformity surviving major scaffold removal *repeatedly* would dramatically boost the urgency of the **Weaning Problem (#2)** – showing it's possible – and elevate the **Convention Definition** question (is this Lewis vindicated?).
      *   **If Modelers Hit Gold on Basin Distortion:** Rapid progress formalizing how infrastructure morphs basins (#3) could make this indispensable for interpreting #1 results faster than expected, potentially solidifying its #3 spot or even elevating it.

  **Core Reasoning Principle:** Prioritize *empirical traction* on the core phenomenon (#1) and *practical payoff* (#2) over foundational definition (#1 candidate) or descriptive accounting ("distinction worth"). Build the tools (#1) to answer the "why care" question (#2), then deepen the mechanism (#3). The definition will emerge – or become irrelevant – based on what you find.
