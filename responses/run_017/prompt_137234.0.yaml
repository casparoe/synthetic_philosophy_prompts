  Okay, let me tackle this ethics professor's challenge. They're clearly frustrated with standard paradox of deontology examples and want something fresh that strips away numerical comparisons. The key is creating a scenario where respecting a deontological constraint clearly harms the very person it's meant to protect, without any easy escapes.

  First, I need to understand their specifications deeply: no numbers, one protected person, realistic setting, closed exits for common workarounds. The professor mentioned examples like clinics or families - that helps ground it in real-world ethics. I'm considering a medical confidentiality scenario because it naturally creates tension between immediate harm prevention and foundational trust.

  For the protected person, I'm imagining a psychiatric patient who's disclosed suicidal thoughts under confidentiality. The constraint would be maintaining confidentiality against their explicit current demands to inform someone. This satisfies the "worse off by their own lights" requirement since they're actively begging for disclosure. 

  Now to close those exits: (a) they're competent but can't waive confidentiality retroactively; (b) we'll make it 100% certain disclosure prevents suicide; (c) no other people's welfare involved; (d) no duress in the original promise; (e) if using temporal selves, the earlier self isn't more informed. 

  The real test comes in the analysis part. For the constraint theorist, they'd argue violating confidentiality destroys the practice's value. The threshold view might say preventing certain death overrides. Contractualism would focus on justification to the patient. 

  The core tension comes from the constraint being identity-constitutive - it's meant to protect the patient's agential status, yet respecting it denies their current agency. If we removed the competence requirement, it collapses back to paternalism. The best deontological escape might be reframing the constraint as protecting the patient's "true" self, but that risks denying their current autonomy.

  Hmm... let me check if this satisfies all specs. No numbers? Check. One protected individual? Yes. Clear constraint violation? Confidentiality broken. Worse off? Only if we count future harm to self-trust, but the professor wants clear immediate harm... maybe I need to emphasize how current suicide prevents future recovery. The temporal gap is crucial - it's not about different people but the same person across time. That might be the single feature doing the work.

  For the "break it" part: if we remove the temporal dimension, it becomes ordinary paternalism. If we make the patient incompetent initially, it's just standard advance directives. The deontologist's best move is attacking the "same person" premise - arguing the despairing self isn't fully autonomous, but that violates spec (e). 

  After double-checking, this seems to satisfy all specs without cheating. The medical context makes it realistic, and the confidentiality constraint creates the right kind of tension between present and future selves without introducing aggregation.
answer: |-
  Here’s a stripped-down, number-free paradox of deontology tailored to your specs:  

  **Scenario**:  
  Dr. Aris, an oncologist, promised her terminal patient Lena (fully competent, clear-eyed about her prognosis) that she would never share Lena’s private medical journals with anyone, even family. Lena insisted: "These are my raw, unfiltered thoughts—they stay between us." Months later, Lena develops severe, treatment-resistant depression. Her psychiatrist confirms she is now actively suicidal *specifically* due to unprocessed trauma revealed only in those journals. Disclosing a single entry to her psychiatrist would enable targeted therapy, reliably preventing her suicide. Lena, in her despair, begs Aris: "Show him the entry about the fire—I don’t care about the promise anymore!" Aris faces a choice: violate confidentiality to save Lena’s life now, or keep her promise and let Lena die by suicide, guided by the constraint meant to protect Lena’s autonomy and dignity.  

  **Exits closed**:  
  (a) Lena cannot retroactively void the promise—it was a foundational condition of her earlier vulnerability; waiving it *now* invalidates the trust *then*.  
  (b) Certainty: Disclosure *will* prevent suicide; non-disclosure *will* result in death.  
  (c) No aggregation: Only Lena’s welfare is at stake.  
  (d) The promise wasn’t coerced; Lena set its terms deliberately.  
  (e) Lena’s current self is competent and informed; her earlier self’s authority rests solely on the promise’s moral weight.  

  ---  

  ### Analysis:  
  1. **Constraint-Theorist (Absolutist)**: Forbids violation. The promise protects Lena’s agency *as a person*, not just her preferences. Breaking it treats her as a container of outcomes ("better off alive") rather than a sovereign agent whose past commitments shape her identity. Saving her *by* violating the constraint undermines the very autonomy it was meant to honor.  
  2. **Threshold Deontologist**: Permits violation. While promises bind strongly, preventing a catastrophic harm (death) to the *same* person outweighs fidelity when the cost is extreme. The constraint is moderately stringent but yields to prevent a total defeat of the patient’s interests.  
  3. **Contractualist**: Ambivalent. Grounding constraints in justification *to* each person, Lena’s current plea might override her past self’s demand. Yet if the promise was a precondition for Lena’s initial trust (enabling her to seek care), breaking it fails the test of justification *to her earlier self*, whose participation was vital to the relationship.  

  **The single feature doing the work**:  
  **Temporal conflict of the self**. The constraint (confidentiality) binds Aris to Lena’s *past, autonomous self*, who demanded privacy as a condition of vulnerability. Respecting it betrays Lena’s *present, autonomous self*, who demands disclosure to survive. The constraint "protects" Lena by privileging her past agency over her current agency—creating a paradox where the *form* of respect (keeping promises) conflicts with its *substance* (honoring her current will). This generates the verdicts: absolutists side with the constitutive role of past commitments; thresholdists side with present welfare; contractualists fracture over which "version" of Lena merits justification.  

  **Break it by removing**:  
  The **irreversible, identity-shaping nature of the initial promise**. If the promise were routine (e.g., "I’ll call tomorrow"), removing it collapses to one-vs.-five (violate one small promise to prevent five deaths). If Lena could void it without undermining her prior act of trust, the paradox dissolves. The promise must function as a *precondition* for Lena’s past agency—making the constraint both protective and imprisoning.  

  **Deontologist’s best wriggle**:  
  Argue that respecting the constraint *does* serve Lena’s deeper interest in identity-cohesion: her past self’s choice defines who she *is*, and overriding it treats her as a series of moments, not a unified person. This "identity integrity" defense claims violating the promise saves Lena’s *life* but not her *self*.  
  **Honest assessment**: This is a *place to stand*, not a solution. It denies Lena’s present self equal moral standing, implicitly valuing narrative unity over lived experience. It dissolves the paradox only by stipulating that the "protected person" is an abstract entity ("Lena-as-a-whole"), not the concrete, suffering agent begging for help.  

  ---  
  **Feasibility**: The specs hold. The case avoids cheating by anchoring the conflict in *intrapersonal* temporal agency—no aggregation, no extraneous constraints, no hidden uncertainty. The power comes from a constraint (confidentiality) that is both *for* Lena and *against* her, depending on which temporal perspective is privileged.
