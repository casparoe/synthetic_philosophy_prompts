prompt: |-
  You are a professional philosopher who works on identity over time and material constitution, and who has some patience for the ways institutions — museums, registries, insurers, hospital ethics committees — operationalise identity claims they cannot actually define. Please think carefully and work in stages rather than delivering a verdict in one breath: first set out the different things our practice might be tracking (matter, form, function, continuous existence, causal history, convention); then reconstruct the implicit theory; then test that reconstruction against the awkward cases at the end, and mark clearly where it fails. I would rather have a careful diagnosis than a tour of the standard positions, though if a standard position really is the hinge, name it and show what work it does rather than just labelling it.

  Here is the practice I am stuck inside. I am a volunteer trustee of a small maritime heritage trust that owns a nineteenth-century wooden fishing vessel, kept afloat and sailed every summer. Over roughly forty years she has been repaired plank by plank: very little of the timber that was in her when we acquired her is still in her, and the mast, the rigging and the engine are all replacements. Nobody involved doubts that she is the same boat — she keeps the same name, the same registration, the same entry in the register of historic vessels, and she remains eligible for the maintenance grants our trust exists to hand out. But the practice seems to tie itself in knots a few steps on. Some years ago a comparable boat was dismantled, her timbers numbered and stored, and then rebuilt with about eighty per cent of her original material, on a new structural cradle, to her original lines. In architectural conservation this technique of re-erecting something from its surviving original elements has a name, anastylosis, and is normally classed as restoration rather than new building. Our own funding rules, however, treated that vessel as a reconstruction — on the ground that she had ceased to exist as a vessel during the interval — and the insurers wanted to rate her as a new build. So we appear to hold that the piecemeal replacement of nearly all the matter leaves identity untouched, while a gap in existence destroys it even though most of the original matter returns. The same rulebook then adds a quantitative test: a project counts as maintaining an original vessel only while at least sixty per cent of the structural fabric is original. When a case lands near that line the trustees settle it by majority vote — and yet nobody on the board thinks the vote *makes* the vessel the same vessel; we all think a majority could get it wrong. For what it is worth, the same people are entirely untroubled in saying that a patient with a donor heart, or one who has simply replaced most of their cells over a lifetime, is straightforwardly the same person, while a patient whose brain has permanently stopped functioning is not, even though the body is warm and intact. I realise this is the Ship of Theseus with paperwork and an insurance schedule attached.

  So: what does this cluster of rules actually presuppose about what it is for a thing to persist? Reconstruct the implicit theory as charitably as you can, and then separate three things — what the practice strictly presupposes, what it merely fits well with, and what it is entirely neutral about. In particular, tell me whether we are committed to one consistent criterion or whether we are running a coalition of criteria that happens not to clash in the cases we usually meet; and if it is a coalition, say which rival theories of identity over time would license exactly the rules we have anyway, so that our rulebook is philosophically underdetermined. Then take the counterfactuals seriously: if we adopted the view that persistence admits of degrees, or that there is no determinate fact of the matter about which vessel is Theseus's, or that distinct material things can coincide and share all their matter at a time, what would our grant criteria, our register entries and our insurance clause actually have to say instead? And where the practice is arbitrary or incoherent — the sixty per cent line, the vote, the asymmetry between the plank-by-plank boat and the dismantled one — locate the fault precisely and tell me the cheapest revision that would remove it, and what that revision would cost us in terms of what we are trying to preserve.
reasoning: |-
  Okay, let me approach this maritime identity puzzle methodically. The trustee presents a fascinating case where practical institutional decisions about vessel identity clash with philosophical consistency. 

  First, I need to disentangle the multiple identity criteria in play: material continuity (original timber percentage), formal continuity (same design/sails), functional continuity (still seaworthy), historical continuity (same registration), and existential continuity (no disassembly gap). The trustees' rules privilege different criteria in different scenarios - that's the core tension.

  The dismantled boat case reveals their implicit hierarchy: existential continuity trumps material continuity. But why? Perhaps because institutional practices (registries, insurers) rely on trackable existence - a vessel that stops existing becomes untraceable in their systems. Whereas gradual replacement allows continuous documentation. 

  The 60% rule then exposes where their hierarchy fails: material continuity becomes a proxy when existential continuity is unbroken. But this creates arbitrariness - why 60% not 50%? And the voting mechanism admits their criterion isn't truly objective. 

  Meanwhile, their intuitions about organ transplants show they intuitively accept biological processes as "continuous existence" but draw hard lines at brain death. This suggests they're using what philosophers call a "life-relative" criterion without realizing it. 

  The cheapest fix might be to reframe all decisions as about "functional identity" rather than strict persistence. But that sacrifices the historical value they cherish. Alternatively, embracing degrees of identity could preserve nuance but complicate binary decisions insurers require. 

  I'll need to show how each philosophical option (conventionalism, four-dimensionalism, etc) would reshape their rules - and what cultural costs each entails. The trustees aren't just preserving wood; they're stewarding meaning.
answer: |-
  Your maritime heritage trust is wrestling with a beautifully concrete case of *practical ontology*—a set of institutional rules that implicitly codify a theory of persistence while betraying its seams under pressure. Let’s dissect this step by step, reconstructing the implicit theory, testing its limits, and proposing repairs.

  ### 1. **What the Practice Tracks: Six Candidate Criteria**  
     - **Material Continuity**: Original timber percentage (60% threshold).  
     - **Formal Continuity**: Sameness of design, lines, and appearance.  
     - **Functional Continuity**: Capacity to sail as a vessel.  
     - **Existential Continuity**: Unbroken existence as a seaworthy object (no "gaps").  
     - **Causal-Historical Continuity**: Registration, name, and documented history.  
     - **Conventional Continuity**: Trustee vote near boundary cases.  

  Your practice treats these criteria *asymmetrically*:  
  - **Plank-by-plank boat**: Prioritizes *existential + functional + causal-historical* continuity (sailing continuously under the same name).  
  - **Anastylosis boat**: Prioritizes *material + formal* continuity but discounts it due to the *existential gap*.  
  - **60% rule**: Material continuity acts as a proxy for "sufficient" historical connection when existential continuity holds.  
  - **Trustee vote**: Reveals conventionalism at the boundaries, acknowledging indeterminacy.

  ---

  ### 2. **Reconstructing the Implicit Theory**  
  The trust’s operational view is a **hybrid of endurance theory and conventionalism**:  
  - **Core Principle**: *A vessel persists iff it maintains spatiotemporal continuity as a functional whole*.  
    - This explains why gradual replacement preserves identity (no temporal gap), while reassembly after disassembly does not (the vessel "ceased to exist").  
  - **Secondary Principle**: *Material continuity serves as evidence of historical authenticity* when existential continuity holds (hence the 60% rule).  
  - **Boundary Handling**: Where evidence is ambiguous, convention (trustee vote) decides, but *not* because identity is subjective—rather, because the facts are epistemically inaccessible.  

  **Charitable Reconstruction**: The trust is *not* committed to strict numerical identity over time. Instead, it cares about preserving a *historically continuous life*. A vessel’s "life" requires:  
     - Unbroken embodiment (*existential continuity*),  
     - Sustained functional capacity (*functional continuity*),  
     - Institutional recognition (*causal-historical continuity*).  
  Material continuity matters only as a trace of the vessel’s *biography*, not its essence.  

  **Why the Asymmetry?**  
  - The plank-by-plank boat never died; its "life" was uninterrupted.  
  - The anastylosis boat "died" when dismantled; rebuilding created a *new life* using old parts.  
  - This mirrors your trustees’ intuition about brain death: biological continuity ceases, so identity ends.  

  ---

  ### 3. **Where the Reconstruction Fails**  
  **Case 1: The Anastylosis Vessel**  
     - **Failure**: If material reassembly restores the same form/function, why does the existential gap negate identity? The implicit theory assumes that "dying" severs historical continuity irrevocably—but this is arbitrary. A consistent *causal-historical* view (e.g., Kripke’s origin essentialism) could allow identity if original parts dominate.  

  **Case 2: The 60% Rule**  
     - **Failure**: Material thresholds are philosophically indefensible. If 60% original timber preserves identity, is 59% a replica? This conflates *preservation of historical value* with *identity*. The vote admits epistemic uncertainty but pretends to resolve metaphysical indeterminacy.  

  **Case 3: The Transplant Paradox**  
     - **Inconsistency**: Trustees accept cell replacement in humans (prioritizing psychological continuity) but reject material gaps in boats. This reveals a hidden **criterion-sensitivity**: For persons, we privilege *psychological continuity*; for artifacts, *functional persistence*.  

  ---

  ### 4. **Diagnosis: An Underdetermined Coalition**  
  Your rules are licensed by *three rival theories*, creating an unstable coalition:  
  1. **Endurantism** (Lowe): Identity requires continuous existence.  
     - *Licenses*: Rejecting anastylosis boat; accepting gradual replacement.  
  2. **Conventionalism** (Heller): Identity is contextually fixed.  
     - *Licenses*: Trustee votes; insurer classifications.  
  3. **Material-Based Theories** (e.g., mereological essentialism lite).  
     - *Licenses*: 60% rule.  

  **What the Practice Presupposes**:  
     - *Strictly*: Existential continuity is necessary for persistence.  
     - *Fits well with*: Functional and historical continuity as sufficient conditions.  
     - *Neutral about*: Whether material continuity is metaphysically significant (it’s treated instrumentally).  

  **The Core Tension**: The trust conflates two projects:  
     - **Preserving an object’s identity** (metaphysical),  
     - **Preserving historical authenticity** (evaluative).  
  The 60% rule and anastylosis rejection serve the latter but masquerade as the former.  

  ---

  ### 5. **Counterfactual Revisions & Costs**  
  | **Theory**               | **Grant Criteria**                                  | **Insurance Clause**                          | **Cost**                                                                 |  
  |--------------------------|----------------------------------------------------|-----------------------------------------------|--------------------------------------------------------------------------|  
  | **Degrees of Identity**  | Fund based on "authenticity score" (material % + continuity) | Premiums scaled by identity strength         | Loses binary clarity; complicates registration.                          |  
  | **Ontic Indeterminacy**  | Register as "indeterminately identical" near thresholds | Insure as "risk-sharing" entity            | Legally unworkable; confuses ownership.                                  |  
  | **Coincident Objects** (e.g., temporal parts) | Fund "original vessel" and "restored replica" separately | Insure temporal stages                     | Overcomplicates; doesn’t solve gap problem.                              |  

  ---

  ### 6. **Repairs: Cheapest Fixes**  
  **Problem 1: The Anastylosis Asymmetry**  
     - **Fault**: Arbitrary privileging of existential over material continuity.  
     - **Fix**: Redefine "continuous existence" to include *dormant but reassembleable* states.  
     - **Cost**: Blurs "restoration" vs. "reconstruction"; may inflate heritage claims.  

  **Problem 2: The 60% Rule**  
     - **Fault**: Material threshold is a poor proxy for authenticity.  
     - **Fix**: Replace with a *narrative criterion*: "A vessel is original if ≥50% of its structure is traceable to the original *and* it has no >1-year functional gap."  
     - **Cost**: Requires detailed historical documentation; less administratively simple.  

  **Problem 3: Trustee Vote**  
     - **Fault**: Voting implies conventionalism but pretends to track objectivity.  
     - **Fix**: Explicitly frame votes as *heritage value assessments*, not identity judgments.  
     - **Cost**: Admits that identity isn’t the core concern; may undermine grant eligibility logic.  

  ---

  ### **Conclusion: What You’re Really Preserving**  
  Your trust isn’t preserving *ships* as metaphysical entities—it’s preserving **maritime narratives**. The implicit theory works best when functional, historical, and existential continuity align (e.g., your plank-by-plank boat). Where they diverge, the rules reveal a *pragmatic essentialism*: Identity is whatever best sustains the vessel’s story in institutional memory. The cheapest revision is to **decouple identity from heritage value**:  
     - Keep registration tied to existential continuity (no gaps),  
     - Base grants on *narrative significance* (material % + historical traces),  
     - Let insurers rate risk based on material age.  

  This costs you the illusion of metaphysical consistency but saves the practice from incoherence. After all, Theseus’s ship was never about planks—it was about Athenians needing a hero’s relic. Your trust, too, is in the business of relics, not ontology.
