  ## Last Drumsong (A Villanelle for the Disciples)

  Good friends, why weep as shadows fall?
  This breath dissolves like morning dew.
  **Let crows and kites take what they will.**

  The seasons turn, recall, recall!
  From root to branch, the old makes new.
  Good friends, why weep as shadows fall?

  Your plans for stone – a costly wall
  Against the wind? It will not do.
  **Or ants and grubs reclaim me slow.**

  Think of my wife: no dirge, no pall,
  But drummed the change, sang clear and true.
  Good friends, why weep as shadows fall?

  Is flesh beneath the soil less thrall
  To change, than flesh the high winds know?
  **Let crows and kites take what they will.**

  This borrowed dust, this borrowed thrall,
  Returns to where all currents flow.
  Good friends, why weep as shadows fall?

  Earth holds me now, a final shawl,
  Sky waits its turn. Why choose below?
  **Let crows and kites take what they will,**
  **Or ants and grubs reclaim me slow** –
  One mouth, not two. Just let it go.

  ---

  **Handout Notes:**

  *   **Form Follows Philosophy:** The villanelle's circling refrains enact Zhuangzi's point. The initial distinction between "crows and kites" (above) and "ants and grubs" (below) – a seeming horror or choice for mourners – blurs through repetition. By the final quatrain, they land side-by-side, revealed as merely two expressions of the *same* natural process of transformation and reintegration ("One mouth, not two").
  *   **Voice:** Zhuangzi addresses his disciples ("Good friends") with characteristic calm, logic, and a touch of gentle chiding ("recall, recall!", "Why weep?"), echoing his response to his wife's death and his own burial requests.
  *   **Key Zhuangzi Concepts Embedded:**
      *   **Natural Transformation:** Death as dissolution ("breath dissolves like morning dew"), change like seasons ("seasons turn"), returning to the source ("where all currents flow").
      *   **Pointless Distinctions:** Rejecting the disciples' preference for burial ("plans for stone – a costly wall", "Why choose below?"). The refrains' merger demonstrates this.
      *   **Unity with Nature:** "Earth holds me now... Sky waits its turn". The body is "borrowed dust" returning to the cycle.
      *   **Appropriate Response:** Calm acceptance, even celebration of the process ("sang clear and true"), contrasting with mourning ("weep").
  *   **Intentional Imperfections:** Minor rhythmic tension in lines 4 & 10, the slightly jarring "thrall/thrall" repetition in stanza 4, and the conversational contraction "It will not do" contribute to the "live handout" feel.
