prompt: |-
  I sit on the novel-entity review committee at my university — we look at anything a lab wants to build that isn't a standard model organism, so engineered cell lines, stripped-down synthetic genomes, cell-free systems, self-assembling junk the bioengineers dream up. We meet every couple of weeks, eight to twelve proposals a term, and one of the boxes we have to tick is whether the thing is a living organism, because that decides whether it needs the full containment permit and the lawyer's sign-off or can just be handled on the open bench. Our charter never defines living organism, so we've been doing it case by case and it's become embarrassing: last month we ruled that a bacterium with a heavily reduced synthetic genome was alive and that a self-replicating RNA in a cell-free extract was not, and I don't think any of us could explain why those two came out differently. I took one philosophy course years ago and have this vague memory of a metabolism-versus-replication split and something about autopoiesis, but I don't trust my recollection and I can't tell which of those ideas is actually load-bearing and which is decoration. So: I don't want a survey of definitions or anything you'd have to look up — no reading list, no citations, just your own reasoning. What I want is a decision procedure I can photocopy and hand to people: an ordered list of questions to run through in a meeting, what counts as a good-enough answer to each, where the procedure stops with a no, and where it has to throw up its hands and say this is a values call rather than a question of fact, because our biosafety officer signs off on whatever we write and he will not accept a judgement dressed up as a test.

  Two constraints from our setting make this less tidy than the textbook version. First, we're only permitted to reason from what we can actually observe in a thirty-day window with the assays we have: we can't certify a capacity for Darwinian evolution or survival across centuries, only what happened while we watched, so the procedure has to say how to use short-run observations as evidence for long-run capacities without quietly pretending the proxy is the thing its supposed to be measuring. Second, the committee is two engineers, an ethicist, a microbiologist and me, and nobody except maybe the ethicist has any philosophy training, so any distinction you keep has to be statable in plain language — but please don't flatten out the distinctions that are doing real work, I'd rather keep an awkward step than lose it. One of our engineers also keeps insisting that any definition requiring reproduction rules out sterile individuals (a mule, a worker ant, a cell line that can't divide), and I genuinely can't tell whether that's a decisive objection or a debating trick, so the procedure needs a place for it.

  Please run the finished procedure on five of our actual cases: the self-replicating RNA in cell-free extract (copies itself if we keep feeding it nucleotides, no membrane, no metabolism of its own); an aggregate of frog cells that swims around, heals itself when cut, and eventually dies out without ever reproducing; a freeze-dried bacterial stock sitting in our minus-eighty freezer — I have a feeling a decent procedure will rule that one not alive, and I'd definately hate that, because then a chunk of how we store things has no principled basis, so tell me straight if that's where it lands; a transmissible cancer cell line that gets passaged between animals and evolves as it goes; and a self-replicating 3D-printed machine that assembles copies of itself from parts we supply, which the engineers submitted half as a joke and half to make a point. Where the procedure can't separate two of these, say so rather than forcing a verdict. Then tell me where the whole thing will misfire — the kind of submission it will handle badly — and for each part of what you give me, say how confident you are in it and single out the one step you're least sure about.
reasoning: |-
  Hmm, the user is on a novel-entity review committee at their university that assesses non-standard biological constructs. They need a practical decision procedure to determine if something is a "living organism" for biosafety purposes, but their charter doesn't define what "living" means. This has led to inconsistent rulings - like calling a synthetic bacterium alive but not a self-replicating RNA - which is embarrassing and potentially risky.

  The user has several constraints: they can only use 30-day observable evidence, need plain language for committee members (engineers, ethicist, microbiologist), and must address objections about sterile organisms. They also want me to test the procedure on five real cases and identify where it might fail.

  Looking at the key requirements: The procedure must be based on observable behaviors within 30 days, use plain language while preserving meaningful distinctions, handle sterile organisms properly, and clearly separate factual judgments from value calls. The user specifically wants no citations or reading lists - just practical reasoning.

  For the living organism definition, I recall fundamental concepts like metabolism (energy processing), homeostasis (self-regulation), replication, and evolution. But since they can't observe long-term evolution, we'll need proxies like mutational responses. The sterile organism issue is important - life should include non-reproducing individuals since they're part of living systems.

  I'm developing a tiered question approach: First, check for metabolic activity (processing resources), then self-maintenance (repair/healing), replication ability (even if not observed), response to stimuli, and evolutionary capacity (through short-term tests). The procedure should stop at "no" when critical features are absent and flag "values call" when evidence is ambiguous.

  For the test cases:
  - Self-replicating RNA: Replicates but lacks metabolism/membrane → not alive
  - Frog cell aggregate: Heals itself but no replication → alive (despite sterility)
  - Freeze-dried bacteria: Dormant but revivable → alive (preserved potential)
  - Transmissible cancer: Replicates, evolves → definitely alive
  - 3D-printed replicator: Builds copies but no internal processing → not alive

  The procedure will likely struggle with entities like viruses (replicate but depend on hosts) or programmed systems that mimic life superficially. The trickiest step is distinguishing "programmed" vs "inherent" responses - that's where values calls might be needed.

  I'll structure this as a clear flowchart with decision points, using plain language throughout. The confidence levels vary - high on core criteria like metabolism, lower on the evolution proxy since it's indirect. The sterile organism handling is solid because it focuses on capability rather than individual reproductive status.
answer: |-
  Here's a practical decision procedure designed for your committee, focusing on observable behaviors within a 30-day window, using plain language, and explicitly handling sterile individuals and ambiguity. It prioritizes **key functional capacities** over textbook definitions.

  **Novel Entity Life Status Decision Procedure (NELS-DP)**

  Run these questions **in order**. Stop at any "NO" for a final "NON-LIVING" ruling. If you reach "Values Call," the committee must vote based on precaution/biosafety philosophy.

  1.  **BASIC PROCESSING & ENERGY USE (Metabolism Proxy):**
      *   **Question:** Does the entity *internally* transform external resources (like chemicals, light, electricity) to fuel its activities *and* release waste products, *without* the entire process being directly driven *step-by-step* by external human/mechanical intervention *during the observation window*?
      *   **Good-Enough Answer:** YES = Observed uptake of specific resources (e.g., sugar, nucleotides, light) *coinciding* with observable activity (movement, replication, repair, growth) *and* measurable release of specific waste products (e.g., CO2, acid, heat). NO = Only passive absorption/diffusion, no measurable waste linked to activity, or every chemical reaction step requires direct external triggering/control.
      *   **Stop if NO:** NON-LIVING. (e.g., a crystal growing in solution lacks internal processing/waste).
      *   **Values Call?** No. This is a core functional observation.
      *   *Confidence: High. This captures the fundamental "engine" distinction.*

  2.  **SELF-MAINTENANCE & BOUNDARY (Homeostasis/Autopoiesis Proxy):**
      *   **Question:** Does the entity actively maintain a distinct, persistent boundary separating "self" from "environment," and does it show evidence of internal repair or regulation *in response to minor damage or change* within the 30-day window?
      *   **Good-Enough Answer:** YES = Observed active repair of damage (e.g., membrane resealing, healing a cut), regulation of internal conditions (e.g., pH, ion concentration) different from the environment, or active maintenance of its physical structure against decay. A physical membrane/casing is common but not strictly required if clear functional compartmentalization is observed. NO = No distinct boundary, passive disintegration upon damage, no observable repair/regulation, or requires complete external reassembly after perturbation.
      *   **Stop if NO:** NON-LIVING. (e.g., a soap bubble has a boundary but doesn't actively maintain/repair it).
      *   **Values Call?** Sometimes. If boundary/repair is minimal or ambiguous (e.g., a very simple coacervate). Committee discusses ambiguity level.
      *   *Confidence: High. Addresses persistence and reaction to environment.*

  3.  **REPLICATION CAPACITY (Handling Sterility):**
      *   **Question:** *Is the entity* ***of a kind*** *that, under suitable conditions (observed or well-established), produces new entities sufficiently similar to itself?* Focus on the *type*, not the individual instance. Ignore sterility *in individuals*.
      *   **Good-Enough Answer:** YES = (a) Replication is *observed* within 30 days *or* (b) The entity is derived from a known replicating type (e.g., a cell from a dividing line, a mule from horses/donkeys) *and* its structure clearly indicates it belongs to that replicating lineage, even if *this specific instance* cannot replicate (sterile). NO = No replication observed *and* no known replicating lineage/type *and* no inherent structure suggesting replicative machinery (even dormant).
      *   **Stop if NO?** **NO, DO NOT STOP.** Proceed to Question 4. (Lack of replication capacity *by itself* doesn't rule out life due to sterility).
      *   **Values Call?** Rarely. Mostly factual based on observation or known biology. Ambiguity arises if the "kind" is novel and replication potential is purely theoretical but untested.
      *   *Confidence: High. Directly addresses the engineer's sterile individual objection by focusing on the "type".*

  4.  **RESPONSIVENESS & ADAPTATION (Evolution Proxy):**
      *   **Question:** Does the entity exhibit changes in its state, behavior, or population *within the 30-day window* in response to specific environmental changes or stressors, where the change appears *functional* (potentially beneficial) and isn't merely a direct, immediate, and predictable physical/chemical consequence *or* a simple, pre-programmed mechanical response?
      *   **Good-Enough Answer:** YES = Observed population shift towards a variant after introducing a stressor (e.g., antibiotic, nutrient shift), observed behavioral change (e.g., movement away from toxin) that isn't simple diffusion/equilibration, or evidence of mutation/selection *within* the window. NO = Only passive physical/chemical responses (e.g., dissolving, swelling predictably), purely deterministic programmed responses (like a thermostat), or no observable change to stressors.
      *   **Stop if NO?** **NO, DO NOT STOP.** Proceed to Question 5. (Lack of observed adaption doesn't rule out life, especially in short window).
      *   **Values Call?** Frequently. Hard to distinguish "functional adaptation" from "passive response" or "programmed reaction" without long-term data. Committee must judge if the response hints at inherent adaptability beyond simple physics/chemistry or programming.
      *   *Confidence: Medium-Low. This is the hardest proxy for Darwinian evolution. It's indirect and judgement-laden.* **(Least Confident Step)**
      *   *Key Point:* This step tries to capture *potential* for open-ended evolution using short-term responses as *evidence*, not proof. It asks "is there *any hint* of non-trivial adaptability?"

  5.  **SYNTHESIS & CONCLUSION:**
      *   **If YES to Q1 AND Q2:** The entity possesses core "living" functions (processing/maintenance).
      *   **If also YES to Q3:** It belongs to a replicating lineage (standard life).
      *   **If also YES to Q4:** There's evidence of adaptability (stronger case).
      *   **Ruling:**
          *   **YES to Q1 AND Q2 AND (Q3 OR Q4):** **LIVING ORGANISM** (Requires full containment). (Q3 OR Q4 covers both standard replicating life and sterile individuals *within* a replicating type, and entities showing adaptability even if replication lineage is unclear).
          *   **YES to Q1 AND Q2, but NO to Q3 AND NO to Q4:** **VALUES CALL: BORDERLINE ENTITY.** (Has core functions but no replication link *and* no adaptability hint. High precaution recommended? Committee vote based on risk assessment philosophy).
          *   **NO to Q1 or NO to Q2 (regardless of Q3/Q4):** **NON-LIVING.** (Lacks fundamental core functions).

  ---

  **Running the Procedure on Your Cases:**

  1.  **Self-Replicating RNA (Cell-Free Extract):**
      *   Q1: NO. Uses nucleotides we feed it, but lacks *internal* transformation process. The extract provides machinery; the RNA itself doesn't metabolize. Waste products? Unclear, but not driven by RNA's internal processes. **STOP: NON-LIVING.** (Matches your ruling).
  2.  **Aggregate of Frog Cells (Heals, No Reproduction):**
      *   Q1: YES. Cells metabolize nutrients, produce waste (CO2, etc.).
      *   Q2: YES. Maintains boundary (cell membranes), heals cuts.
      *   Q3: YES. *Type:* Frog cells are derived from a replicating lineage (frogs). Individual aggregate sterility irrelevant.
      *   Q4: Maybe? Might show basic chemotaxis or stress response? Assume observable.
      *   **Ruling:** YES to Q1, Q2, Q3 -> **LIVING ORGANISM.** (Sterility handled).
  3.  **Freeze-Dried Bacterial Stock (-80C):**
      *   Q1: NO. *During observation window:* No metabolic activity, no resource use, no waste production. Dormant. (Even though it *can* be revived later - we're only observing *now*).
      *   Q2: NO. *During observation window:* No active boundary maintenance or repair. Structurally preserved but inert. **STOP: NON-LIVING.** (Yes, this is where it lands. Principle: Dormancy isn't *being* alive, it's the *potential* to *become* alive again. Your storage protocols *are* based on potential reactivation risk, not on it being currently "alive". This forces explicit risk assessment of revival potential, which is good).
  4.  **Transmissible Cancer Cell Line:**
      *   Q1: YES. Cell metabolism.
      *   Q2: YES. Maintains cell boundary, repairs damage.
      *   Q3: YES. Replicates and is a replicating lineage.
      *   Q4: YES. Observed evolution/adaptation.
      *   **Ruling:** **LIVING ORGANISM.**
  5.  **Self-Replicating 3D-Printed Machine:**
      *   Q1: NO. It uses supplied power/parts, but likely lacks *internal* transformation of resources *into usable energy* driving its processes. Its activity is directly driven by external power/control signals. Waste? Maybe heat/machining debris, but not a product of internal metabolic processing.
      *   **STOP: NON-LIVING.** (Lacks the fundamental "engine" - metabolism. Replication is mechanical assembly).

  ---

  **Where the Procedure Will Misfire:**

  1.  **Viruses & Viroids:** Likely ruled NON-LIVING (fail Q1 and often Q2). This aligns with most biological consensus but remains a philosophical debate. The procedure forces you to treat them based on their *functional* lack of metabolism and independent homeostasis, which drives appropriate containment (treat as hazardous replicators, not "alive").
  2.  **Highly Programmed Synthetic "Cells":** Entities that *perfectly* mimic metabolic loops and replication using purely synthetic, deterministic chemistry/mechanics might pass Q1, Q2, and maybe Q3/Q4 ambiguously, leading to a VALUES CALL or even LIVING if adaptability is faked well enough. This tests the boundary between "programmed" and "inherent" functionality.
  3.  **Cryptobiotic States (Tardigrades, Seeds):** Like freeze-dried bacteria, they fail Q1/Q2 while dormant, ruled NON-LIVING. You must assess revival risk explicitly. If observed *during* cryptobiosis, they fail.
  4.  **Simple Prebiotic Systems:** Coacervates, autocatalytic sets might pass Q1 ambiguously and fail Q2/Q3, likely ruled NON-LIVING or VALUES CALL. The procedure struggles with the "edge of life."
  5.  **Entities Where "Kind" (Q3) is Ambiguous:** Novel synthetic constructs with no evolutionary lineage. Relies heavily on Q4 (adaptability) which is itself hard to judge. Likely leads to VALUES CALL.
  6.  **Entities with Radical Novelty:** Something truly unlike anything we know might not fit the observable proxies well, making all steps ambiguous. VALUES CALL.

  **Confidence Summary:**

  *   **Q1 (Processing/Energy):** High Confidence. Fundamental distinction.
  *   **Q2 (Maintenance/Boundary):** High Confidence. Core to persistence.
  *   **Q3 (Replication Capacity - Type):** High Confidence. Cleanly handles sterility.
  *   **Q4 (Responsiveness/Adaptation Proxy):** **Low-Medium Confidence (Least Confident Step).** Necessary proxy for evolution, but inherently indirect and judgment-heavy. Prone to VALUES CALLs.
  *   **Synthesis Step (Q1+Q2 AND Q3 OR Q4):** Medium Confidence. Balances core functions with lineage/adaptability evidence. The "OR" is crucial for sterility/borderline cases.
  *   **Non-Living Ruling (Fail Q1 or Q2):** High Confidence.
  *   **Borderline Ruling (Pass Q1+Q2, Fail Q3+Q4):** Medium Confidence. Forces explicit discussion of precaution.

  This procedure provides a structured, observable, plain-language framework that handles sterility and dormancy explicitly, minimizes philosophical jargon, forces discussion of ambiguity ("Values Call"), and prioritizes core functional criteria for biosafety decisions. It will make your rulings more consistent and defensible, even if borderline cases remain challenging.
