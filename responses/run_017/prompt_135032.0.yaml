prompt: |-
  I work as the planning officer for a small internal drainage board in eastern England. Our job is to keep water off low-lying farmland and the villages on it: about forty miles of raised embankment, a dozen pumping stations, and several hundred culverts and sluices. Once a year we put forward a shortlist of the schemes we want funded — rebanking this reach, replacing that pump — and every scheme has to be justified with a benefit–cost ratio: how likely the asset is to fail over some period, multiplied by what the flooding would cost, against what the work would cost. The numbers go into a spreadsheet supplied by our funding body, which will not normally pay for anything whose ratio is below one, and the spreadsheet wants a single number for the probability.

  The difficulty is that we hardly ever have anything to count. A pumping station of a given age and type failing in a given year is not something anyone here has seen even once, and the few failures we have had turned on causes nobody predicted. For years we filled the box in anyway, because it had to be filled, and the more honest among us put in a round number and shrugged. Recently I started asking our engineers and operators for a range instead: the lowest failure chance they would take seriously over the next ten years, and the highest. Two things have happened since, and I do not know what to make of either.

  The first is that the ranges go into the spreadsheet and come out as their midpoints. Someone has to type a number into the box, the midpoint is the only thing that looks defensible to type, and within a week everyone is talking as though the midpoint had been the estimate all along. The range seems to buy us nothing except a few honest conversations in the room where it was written down.

  The second is worse, and it is what I most want help with. Sometimes we learn something and the range gets wider rather than narrower. A reach of embankment that the team put at between two and ten per cent chance of breaching in ten years was surveyed; the survey found animal burrows in a place nobody had looked; and the same team, given the survey, widened it to between one and forty per cent — the bottom moved down because the burrows are now a known and fixable thing, and the top moved up because a failure mechanism nobody had considered turned out to be live. My colleagues say this is nonsense: finding things out is supposed to make you less unsure, not more. I think the widening is right, and that a single probability could never have recorded it. But I cannot say what should follow from it, and it makes the shortlist impossible to rank.

  So please write me a procedure my team could actually run, once a year, on each asset, in about half a day, with three or four people in a room, none of whom has any statistics beyond school.

  In order, I want it to cover: what question to put to the room to get the two ends of a range, and what the ends are meant to mean in terms someone untrained can act on (I have wondered whether to put it as a bet — the lowest odds at which you would put money on failure, and the highest at which you would take money against it — and I would like to be told whether that is a good idea or a trap); how to combine ranges from people who disagree, including when one person's range sits entirely above another's; what to do when a decision is due and two schemes' ranges overlap, or when one scheme's range straddles the break-even point; how to think about several assets failing together, since what would hurt us most is one storm taking out three reaches at once; what single number, if any, we should give the spreadsheet, and how to stop that number being mistaken for the estimate; and how to handle the widening case when it arises.

  Where the procedure cannot decide, I want that marked, along with whether the remaining question is one that more survey or monitoring could settle, or one about what we actually care about, which is for the board to argue over. I also want it to say when the right output is that we have no idea at all — when the honest range is essentially zero to one — and what we are then supposed to do with that asset, because we have several.

  Then please run the procedure all the way through on three cases.

  1. A mile of embankment protecting a village of about two hundred houses. The team's range for a breach in ten years is two to ten per cent. Flooding there has been costed at around four million pounds. The rebanking would cost £400,000.
  2. Two pumping stations of the same age and type, of which we can afford to replace only one this year. Replacing the first would cost £60,000 and the second £400,000, being the larger installation. The first: a ten to thirty per cent range for failure in ten years, and a modest consequence — a few fields under water for a day, £80,000. The second: five to twenty-five per cent, and a consequence of a road and eleven properties, £900,000.
  3. The embankment with the burrows, whose range widened from two to ten per cent to one to forty per cent after the survey. The board had more or less decided to do this one. A further survey would cost £15,000 and take eight weeks; the funding deadline is in six.

  I would like at least one of these to come out somewhere I do not want it to, and I would rather you did not soften it if it does.

  Alongside the procedure, tell me how confident you are in the parts where you are recommending something that people who think about this properly disagree about, and single out the one point in what you have written that you are least sure of. Please write in British English, and keep the procedure usable by someone who will not read anything else on the subject — gloss any term of art in ordinary words the first time you use it.
reasoning: |-
  Okay, I need to help this planning officer at a drainage board in eastern England. They're struggling with justifying flood defence schemes using benefit-cost ratios, especially since failure probabilities are hard to estimate. They've started using ranges from engineers instead of single numbers, but this leads to midpoints being used and sometimes ranges widen after new info, causing confusion. 

  The user wants a practical procedure for their annual planning that covers several key points: how to define ranges, combine disagreements, handle overlapping schemes, account for correlated failures, decide on single numbers, and deal with widening uncertainty. They also want three case studies worked through honestly.

  Hmm, the core problem is uncertainty quantification with sparse data. The team lacks statistical training, so whatever I suggest must be intuitive - no fancy math. The bet analogy they considered might actually be good for defining ranges, as it's concrete. But I should check if that's a common approach.

  For combining ranges, I recall that simply averaging can be problematic when experts disagree. Maybe having them discuss first to reach consensus is better than mechanical aggregation. When ranges overlap or straddle break-even, the procedure should flag uncertainty rather than force false precision.

  The correlated failures point is crucial - one storm hitting multiple assets could be catastrophic. But assessing dependence without data is tough. Perhaps a simple high/medium/low correlation rating would work.

  On the widening uncertainty paradox: finding burrows did increase knowledge but revealed new risks, so widening makes sense. The procedure should celebrate this as good practice rather than see it as failure.

  For the cases:
  - The village embankment looks borderline on midpoint but its tight range suggests confidence
  - The pumping stations comparison is tricky - the cheaper one has higher failure risk but lower consequence
  - The burrow case will likely show how high uncertainty changes priorities

  I need to be brutally honest in the case outcomes, even if it means recommending against a "pet project". The widening uncertainty might push the burrowed embankment down the priority list despite previous plans.

  Biggest uncertainties in my mind: the correlation adjustment method (too simplistic?) and whether the bet analogy will backfire by feeling too transactional. Also not sure about forcing consensus rather than averaging - might waste time.

  Must use British English throughout: "culverts", "pounds", "motorway" not highway. Explain terms like "benefit-cost ratio" clearly on first use.
answer: |-
  Below is a practical procedure for your annual scheme prioritisation, designed for your team's constraints (no advanced statistics, half-day per asset, 3–4 people). It addresses your core requirements and incorporates safeguards against misinterpreting uncertainty. The approach is grounded in **expert elicitation** (structured gathering of expert judgement) and **decision-making under uncertainty**.

  **Core Principle:** Your ranges reflect *knowledge gaps*, not indecision. Widening a range after new information is **valid** – it means you discovered unknowns. The procedure embraces this.

  ---

  ### Procedure: Annual Asset Risk Assessment
  **Time:** 45-60 minutes per asset (including discussion).  
  **People:** Planning Officer (you, facilitator), 1-2 Engineers, 1 Operator/Field Technician.  
  **Inputs:** Asset history, inspection reports, maps, consequence cost data.  
  **Outputs:** Justified failure probability range, decision flags, recommended action.

  #### Step 1: Define the Failure Probability Range
  *   **Question to the Room:**  
      *"Imagine you are forced to bet your own money on whether this asset will fail in the next 10 years. What is the LOWEST annual probability of failure (as a percentage) where you would confidently BET £100 ON failure happening? What is the HIGHEST annual probability where you would confidently BET £100 AGAINST failure happening?"*
  *   **Meaning/Justification:**  
      *   **Low End (Bet ON):** The probability is so high that betting on failure feels like a good deal. Anything below this is deemed "very unlikely".  
      *   **High End (Bet AGAINST):** The probability is so low that betting against failure feels like a sure thing. Anything above this is deemed "alarmingly possible".  
      *   **Why it works:** It uses an intuitive, concrete action (betting) to force consideration of true belief. It avoids anchoring on vague "confidence intervals". It's a *good idea*, not a trap, if framed this way.
  *   **Facilitation:**  
      *   Clarify "failure" specifically for the asset (e.g., "breach causing flooding", "pump unable to operate during needed event").  
      *   Focus on the **next 10 years**. Convert their 10-year probability suggestions to annual if needed (approx. divide by 10 for low probabilities).  
      *   Challenge extremes: "What specific evidence makes you think it couldn't be lower than X?" / "What scenario makes you think it could realistically be as high as Y?"  
      *   **Record:** Low (L), High (H).

  #### Step 2: Combine Ranges from Disagreement
  *   **Method:** **Guided Consensus, NOT Averaging.**
      1.  Each person writes down their L and H privately.
      2.  Facilitator plots all L and H values visibly (e.g., whiteboard, flipchart).
      3.  **Discussion Focus:**  
          *   *"Why is Person A's Low lower than Person B's Low?"* Explore underlying assumptions (e.g., different views on material decay rate, animal activity).  
          *   *"What evidence or scenario justifies Person C's High being so much higher?"*  
      4.  Aim for consensus on a single agreed L and H for the asset. Focus on justifying the bounds.
      5.  **If Consensus Fails (e.g., ranges disjoint):**  
          *   **Option A (Preferred):** Agree to use the outer bounds (Lowest L, Highest H) of the individuals' ranges. *Flag: "High Disagreement - Outer Range Used".*  
          *   **Option B (If Outer Range Unmanageable):** Escalate to senior engineer/board with the individual ranges and reasons. *Flag: "High Disagreement - Escalation Required".*  
  *   **Why not average?** Averaging hides disagreement and creates a false, unjustifiable midpoint. Outer ranges preserve the true uncertainty.

  #### Step 3: Calculate & Interpret Benefit-Cost Ratio (BCR) Range
  *   **Calculation:**  
      *   **Benefit (Avoided Loss):** `Cost of Failure (£) * Failure Probability (Annual)`  
          *   Calculate Benefit(L) = Cost of Failure * (L / 100)  
          *   Calculate Benefit(H) = Cost of Failure * (H / 100)  
      *   **BCR:** `Benefit / Cost of Work`  
          *   Calculate BCR(L) = Benefit(L) / Cost of Work  
          *   Calculate BCR(H) = Benefit(H) / Cost of Work  
  *   **Interpretation:**  
      *   **BCR(L) > 1:** Even at the most optimistic (lowest probability) view, the work is cost-beneficial.  
      *   **BCR(H) < 1:** Even at the most pessimistic (highest probability) view, the work is NOT cost-beneficial.  
      *   **BCR(L) < 1 < BCR(H):** The cost-benefit is **uncertain** due to the probability range. The work *might* be justified, but isn't clear-cut. *Flag: "Decision Uncertainty - BCR Straddles 1".*  
      *   **BCR(H) > 1 but BCR(L) < 1:** Work likely beneficial, but low-end risk exists. *Flag: "Likely Beneficial - Check Low End Justification".*

  #### Step 4: Handling Multiple Asset Failures (Correlation)
  *   **Question:** *"If Asset A fails in a major storm event, how likely is it that Asset B (or C, D nearby) would also fail in that SAME event?"*  
  *   **Simplified Rating:** Assign a correlation level per asset pair (focus on critical ones):  
      *   **High:** Very likely to fail together (e.g., adjacent embankments on same river reach, pumps drawing from same sump). (Assume 80% chance of joint failure if one fails).  
      *   **Medium:** Possible joint failure (e.g., assets in same catchment but different sub-systems). (Assume 40% chance).  
      *   **Low:** Unlikely to fail together (e.g., geographically distant, independent systems). (Assume 10% chance).  
  *   **Impact:**  
      *   Flag combinations rated **High** correlation.  
      *   For ranking/decision, mentally **"group"** High-correlation assets. Replacing one without the other might be less effective if they are likely to fail together. The *sequence* of replacement might matter (do the most critical in the group first).  
      *   **No complex calculation needed.** The flag prompts consideration: *"If we fix X but not Y, and they are highly correlated, could Y still cause most of the damage?"*

  #### Step 5: The Single Number for the Spreadsheet & Avoiding Misinterpretation
  *   **What to Input:** Calculate the **Midpoint Probability (M)** = `(L + H) / 2`. Calculate the resulting BCR(Mid) = `[Cost of Failure * (M/100)] / Cost of Work`.
  *   **How to Prevent Misinterpretation:**  
      1.  **Label Clearly:** In the spreadsheet cell note or adjacent cell: `"Midpoint of Range: L = X%, H = Y%. BCR Range: A - B."`  
      2.  **Document:** In the justification supporting the spreadsheet, state: *"The single probability entered (M%) is the midpoint of the justified expert range (L% to H%). This is used for funding body compliance only. The range reflects our current uncertainty. The true BCR likely lies between A and B."*  
      3.  **Internal Discipline:** In all internal discussions/ranking, **use the range (L, H, BCR(L), BCR(H))**, NOT the midpoint. The midpoint is purely a bureaucratic necessity.
  *   **Why the Midpoint?** It's the only simple, defensible single number when a range exists. It acknowledges both bounds. Emphasising it's *not* the best estimate is crucial.

  #### Step 6: Handling Widening Uncertainty (The "Burrows Case")
  *   **Procedure:**  
      1.  **Update the Range:** Follow Steps 1 & 2 with the new information (e.g., survey report). If uncertainty increases (range widens), accept it. *This is correct.*  
      2.  **Recalculate:** BCR(L), BCR(H), BCR(Mid) using the new L and H.  
      3.  **Flag:** Mark the asset clearly with *"High Uncertainty Increase Post-Survey"*.  
      4.  **Decision Impact:**  
          *   If BCR(L) > 1: Work still justified even with new low probability.  
          *   If BCR(H) < 1: Work not justified even with new high probability.  
          *   **Crucially:** If it now straddles 1 (BCR(L)<1<BCR(H)) or the range is very wide (e.g., >20% spread), it moves from "Likely Proceed" to **"High Uncertainty - Requires Further Input"**.  
      5.  **"Further Input" Options:**  
          *   **More Investigation?** If the uncertainty is *reducible* (e.g., more surveys, targeted monitoring) AND feasible within budget/time AND the potential consequence is high, recommend this. *Flag: "Investigation Recommended - Uncertainty Reducible".*  
          *   **Board Value Judgement?** If uncertainty is *fundamental* (e.g., unknown soil stability, unpredictable weather patterns) OR investigation isn't feasible, flag that the decision hinges on the Board's *risk appetite* for potentially over- or under-investing given the high unknowns. *Flag: "Board Value Judgement Required - High Fundamental Uncertainty".*

  #### Step 7: Handling "We Have No Idea" (0% to 100%)
  *   **Recognition:** If the honest range is L=0% (or near 0) and H=100% (or near 100) after rigorous Step 1/2 discussion. *Flag: "Extreme Uncertainty - Knowledge Gap".*
  *   **Action:**  
      1.  **Investigation Imperative:** Recommend *mandatory* further investigation (survey, detailed inspection, research) before any major investment decision. The cost of this investigation should be justified based on the *potential* consequence.  
      2.  **Interim Measures:** If risk is high (severe consequence), recommend low-cost interim risk reduction (e.g., enhanced monitoring, minor repairs, contingency planning) while investigation proceeds.  
      3.  **Board Alert:** Explicitly state: *"Current knowledge is insufficient to assess cost-benefit. Investment without further investigation carries high risk of either wasted funds or catastrophic failure."*

  #### Step 8: Ranking the Shortlist & Flags
  *   **Primary Sort:** By `BCR(H)` (the pessimistic BCR). This prioritises assets where the work is justified even in the worst-case probability view. High BCR(H) assets are clear wins.
  *   **Secondary Sort:** For assets with `BCR(H) > 1` but `BCR(L) < 1` (or near 1), sort by `BCR(Mid)` *internally only*, while acknowledging the uncertainty flagged. Assets with `BCR(L) > 1` are stronger than those straddling 1.
  *   **Handle Uncertainty Flags:**  
      *   "High Disagreement", "BCR Straddles 1", "High Uncertainty Increase", "Extreme Uncertainty", "Board Judgement Required" flags mean the asset **cannot be reliably ranked solely by BCR**. Present these assets *separately* to the Board with clear flags and implications.
      *   Group "High Correlation" assets together; consider them as a unit for funding if possible.
  *   **Output:** A ranked list for clear-cut cases (High BCR(H)), followed by a separate list of "Uncertain Priority" assets with their flags, recommended actions (e.g., investigate, Board decide), and correlation notes.

  ---

  ### Confidence Assessment
  *   **Highly Confident (Standard Practice):** Using expert elicitation for probability ranges (Step 1), the validity of widening ranges with new info, using BCR ranges, the core BCR calculation, flagging uncertainty, and the need for Board judgement on irreducible uncertainty.
  *   **Moderately Confident:** Betting analogy for range definition (it's a recognised elicitation technique), guided consensus over averaging (avoids false precision), using Midpoint for bureaucracy (with caveats), simplified correlation rating.
  *   **Least Confident Point:** **The simplified correlation rating (High/Med/Low %).** While necessary for practicality, assigning specific percentages (80%, 40%, 10%) is arbitrary. The qualitative assessment (High/Med/Low) is sound, but the quantisation is a significant simplification experts might reasonably debate. The critical output is the *flagging* of high correlation, prompting grouped consideration.

  ---

  ### Case Studies (Run with Procedure)

  **Case 1: Village Embankment (£400k work, £4m consequence, Range 2-10%)**
  1.  L=2%, H=10% (Agreed Range)
  2.  Benefit(L) = £4,000,000 * (2/100) = **£80,000** | BCR(L) = £80k / £400k = **0.2**
      Benefit(H) = £4,000,000 * (10/100) = **£400,000** | BCR(H) = £400k / £400k = **1.0**
      BCR(Mid) = [£4m * (6/100)] / £400k = £240k / £400k = **0.6**
  3.  **Interpretation:** BCR(H) = 1.0, BCR(L) = 0.2. **BCR Straddles 1 (but BCR(H) only just reaches 1)**.
  4.  **Correlation:** Assume Low (single asset protecting specific area). Flag: None needed.
  5.  **Single Number:** M = 6%, BCR(Mid)=0.6. **Spreadsheet Input:** 6% (Label: "Midpoint of Range L=2%, H=10%. BCR Range: 0.2 - 1.0")
  6.  **Flags:** "Decision Uncertainty - BCR Straddles 1 (0.2 - 1.0), BCR(H)=1.0"
  7.  **Verdict:** **Marginal.** Not a clear win (BCR(H) only just hits 1.0). The high consequence (£4m) warrants serious consideration despite the borderline BCR. Board needs to decide based on risk appetite for protecting 200 homes vs. cost. *Ranking:* Likely lower than clear BCR(H)>1 projects, but above assets with BCR(H)<1. Flagged for Board discussion.

  **Case 2: Pumping Stations (Replace ONE: Pump A £60k work / £80k consequence / 10-30% range OR Pump B £400k work / £900k consequence / 5-25% range)**
  *   **Pump A:**
      1.  L=10%, H=30%
      2.  Ben(L) = £80k * 0.10 = **£8,000** | BCR(L) = £8k / £60k = **0.13**
          Ben(H) = £80k * 0.30 = **£24,000** | BCR(H) = £24k / £60k = **0.4**
          BCR(Mid) = [£80k * 0.20] / £60k = £16k / £60k = **0.27**
      3.  **Interpretation:** BCR(H) = 0.4 < 1. **Not cost-beneficial even under pessimistic view.**
      4.  **Verdict:** **Low Priority (Don't do A this year).** Clear BCR(H) < 1. Flag: "Low BCR".
  *   **Pump B:**
      1.  L=5%, H=25%
      2.  Ben(L) = £900k * 0.05 = **£45,000** | BCR(L) = £45k / £400k = **0.11**
          Ben(H) = £900k * 0.25 = **£225,000** | BCR(H) = £225k / £400k = **0.56**
          BCR(Mid) = [£900k * 0.15] / £400k = £135k / £400k = **0.34**
      3.  **Interpretation:** BCR(H) = 0.56 < 1. **Not cost-beneficial even under pessimistic view.**
      4.  **Verdict:** **Low Priority (Don't do B this year).** Clear BCR(H) < 1. Flag: "Low BCR".
  *   **Comparison & Overall Verdict:** **Neither** pump replacement meets the BCR>1 threshold under their current assessed risk. Replacing either appears unjustified based purely on *individual* cost-benefit for the next 10 years. This is likely an **unwanted outcome**.
  *   **What now?**  
      *   **Revisit Probability Ranges:** Are these ranges truly justified? Is failure *really* that likely? Challenge assumptions (Step 1). Was the consequence underestimated (e.g., reputational damage, knock-on flooding)?
      *   **Consider Lifespan:** The pumps might be near end-of-life. The cost avoids *future* replacement cost + failure risk. Should the analysis include residual value or longer timeframe?
      *   **Consider Criticality:** Pump B protects a road and properties. Could a failure have much larger *indirect* costs (e.g., emergency response, traffic disruption)? Is it more critical than Pump A?
      *   **Board Decision:** Present both as "Low BCR" but highlight the higher consequence of Pump B failure. The Board must decide if non-monetary factors (safety, regulatory duty, public expectation) justify overriding the BCR for Pump B. Flag: "Board Value Judgement Required - Criticality vs Low BCR". *Do not proceed based solely on current BCR ranges.*
  *   **Correlation:** Assume Low (different locations/systems). No grouping needed.

  **Case 3: Embankment with Burrows (£Cost of Work? Consequence? Let's assume same as Case 1: £400k work, £4m consequence. Range widened 1-40%)**
  1.  L=1%, H=40% (Agreed Range Post-Survey)
  2.  Benefit(L) = £4,000,000 * (1/100) = **£40,000** | BCR(L) = £40k / £400k = **0.1**
      Benefit(H) = £4,000,000 * (40/100) = **£1,600,000** | BCR(H) = £1,600k / £400k = **4.0**
      BCR(Mid) = [£4m * (20.5/100)] / £400k ≈ £820k / £400k = **2.05**
  3.  **Interpretation:** BCR(L) = 0.1 < 1 < 4.0 = BCR(H). **High Uncertainty - BCR Straddles 1 Significantly (0.1 - 4.0).** Finding burrows increased knowledge but revealed greater potential risk (higher H) and a clearer mitigation path (lower L).
  4.  **Correlation:** Assume Low. Flag: None needed.
  5.  **Single Number:** M=20.5%, BCR(Mid)=2.05. **Spreadsheet Input:** 20.5% (Label: "Midpoint of Widened Range L=1%, H=40%. BCR Range: 0.1 - 4.0. Post-survey uncertainty increased.")
  6.  **Flags:** **"High Uncertainty Increase Post-Survey", "Decision Uncertainty - BCR Straddles 1 (0.1 - 4.0)"**
  7.  **Further Survey?** Cost £15k, Deadline 6 weeks (Survey 8 weeks). *Not feasible before deadline.*
  8.  **Verdict:** **High Uncertainty - Requires Board Decision.** The midpoint BCR (2.05) looks good, but the range (0.1 - 4.0) is enormous. Proceeding risks wasting £400k if L is true (BCR=0.1) OR risking catastrophic £4m failure if H is true (BCR=4.0 shows it's justified *if* H is true). *The widening means you know less about the true risk than you thought before the survey!*
  9.  **Recommendation:**  
      *   **Do NOT include in ranked shortlist based on current BCR.** Present separately with strong flags.
      *   **Board Must Decide:** Argue over risk appetite. Is protecting the village worth a potential 60% chance (£400k / (£400k + £4m) ≈ 9%) of wasting £400k? Or is the potential £4m loss (now seen as more plausible, H=40%) too severe to risk?
      *   **Post-Deadline Action:** Strongly recommend the £15k survey *after* the funding deadline (if possible) to reduce uncertainty for next year, regardless of this year's decision. Flag: "Further Investigation Recommended - Uncertainty Reducible".
      *   **Interim Mitigation?** Can burrows be filled cheaply now (£5k-£10k)? Recommend this immediately to reduce immediate risk and potentially narrow the range (lower H).

  ---

  ### Summary of Unwanted Outcomes
  1.  **Case 1 (Village Bank):** Borderline (BCR(H)=1.0) - not the strong "yes" hoped for protecting 200 homes.
  2.  **Case 2 (Pumps):** Neither replacement justified on BCR grounds - a major operational dilemma.
  3.  **Case 3 (Burrows):** Previously planned work now mired in high uncertainty, requiring a tough Board gamble.

  This procedure forces these uncertainties into the open, preventing bad decisions based on false precision. The Board must now grapple with the true dilemmas: risk appetite, value of safety, and the cost of reducing ignorance.
