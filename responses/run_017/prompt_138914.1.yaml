prompt: |-
  I have taught a graduate seminar on reference and singular thought for a number of years, and over that time I have kept — and periodically revised — a list of identity statements together with my own verdicts about which of them are informative. By informative I mean: a statement that a speaker can fully understand, using both of its terms with perfect competence, while still rationally treating as an open question, and about which she can learn something by coming to accept it. My verdicts no longer look to me like the output of any single principle, and my own attempts to impose one have all felt ad hoc. I would like to know whether they can be captured by one, and at what cost.

  The list, with my verdicts.

  1. *The evening star is the morning star.* Informative. Someone entirely competent with both expressions, and familiar with the sky, can wonder whether it is true; coming to accept it is an empirical discovery.

  2. *The evening star is the evening star.* Empty. Knowable in advance by anyone who understands the term; someone who professed to doubt it would thereby betray that he had not understood it.

  3. *Cicero is Tully.* Informative, and in the same way as (1): an a posteriori discovery, biographical rather than astronomical.

  4. *Water is H₂O.* Informative — but if true, necessarily so. So informativeness cannot consist in learning a contingent fact about the world.

  5. *The sum of the interior angles of a Euclidean triangle equals two right angles.* Informative for a student who has not seen the proof, and yet a priori: no observation, and no discovery about which things there are, settles it.

  6. *Two labels from one briefing.* A police officer tells me in a single breath that the man I am looking for answers to 'Slim' and also to 'the Weasel'; I have no other information about him. For me, 'Slim is the Weasel' is as empty as (2). This is so despite the two terms being orthographically and phonologically distinct, and despite my not having known, before the briefing, whom either of them names.

  7. *One encounter, two sortals.* I stand before a cast bronze statue, knowing nothing of how it was made. 'This statue is this lump of bronze,' with both demonstratives directed at the same object in the same perceptual episode, is informative: I learn something. No possible observation settles it, and I am inclined to call it a conceptual rather than an empirical discovery. Yet it is hard to see that I have two presentations of the object at all — one look, one object, two sortals. I take (6) and (7) to be the pair my list turns on, and I do not have a principled account of why they differ.

  8. *Belief contexts, first version.* A subject sincerely assents to 'He can fly' when the name used is one, and sincerely dissents when it is the other, and would also deny the identity of the two. Here the failure of substitutivity in attitude ascriptions and the informativeness of the identity statement travel together.

  9. *Belief contexts, second version.* A subject has encountered the same name in two quite separate corners of his life and would, if asked whether the two are one person, refuse to answer. The case seems to me the same as (8). But here there is no difference in his information about the referent that he could state without using the name itself — there is nothing, that is, that he believes of the one that he denies of the other, under any description available to him.

  10. *One source, two channels.* A colleague is in a room, on the telephone, describing to me the one man in it; I am watching a monitor fed by a camera in that same room. I have no descriptive information about the man at all. 'The man you are watching is the man I am describing' is informative to me: I can check it, and until I do I do not know it. But the two terms differ neither in descriptive content (I have none) nor, as far as I can tell, in the causal route by which they are anchored — both are anchored by perception of the same object, his and the camera's. All that differs is which perceiver's link fixes which term. If informativeness tracks something about how a subject is related to a referent, this case suggests the relation in question is finer-grained than either a description or a chain.

  Two further cases I cannot settle. First: 'I am this human animal,' said by an ordinary adult while looking in a mirror. Part of me hears it as empty in the way (2) is; part of me hears it as informative in the way (7) is. Second: I was once told, in a single breath, that the author of certain letters signed himself both 'A' and 'B'; I have entirely forgotten this, but I retain both names and a good deal of information about the man. Is 'A is B' informative for me now, and is its informativeness the same phenomenon as in (1), or merely my ignorance of what I was once told? I take the answer here to depend on whether the relevant notion is a property of the terms or of a subject's current informational state, and I do not know which to say.

  What I want is a principle, or a small set of candidate principles, stated precisely enough that I can test it against cases I have not thought of — not a survey of the familiar answers to the puzzle about identity statements, and not an account of who has defended what. Specifically:

  (a) the principle itself, with an indication of which clause is forced by which case on my list, and especially what distinguishes (6) from (7);

  (b) an explicit statement of which of my verdicts the principle cannot accommodate, and why I should abandon those verdicts rather than add a clause to save them;

  (c) whether informativeness, on your account, is a property of the sentence, of the pair of terms, or of the sentence together with a subject and the information she has — and, on the last option, whether my verdicts in (1) and (10) survive the relativization;

  (d) whether the substitution failures in (8) and (9) are the same phenomenon as the informativeness in (1) through (5), or whether a single account must treat them as separate and say where the boundary falls;

  (e) verdicts on my two unsettled cases; and

  (f) one prediction of your own: a case of a kind my list does not contain, with what your principle says about it.

  If no single principle is available, say so plainly, and say what the phenomenon should be split into and where the dividing lines lie.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosophy professor who's been teaching a seminar on reference and singular thought. They've compiled a list of identity statements with their own verdicts on whether each is informative. Their main struggle is finding a unifying principle that explains all these verdicts without feeling ad hoc. The cases they present, especially (6) and (7), seem contradictory and are key to their confusion.

  First, I need to understand what "informative" means here. The user defines it as a statement that a competent speaker can understand, yet still question, and learn something by accepting it. So informativeness isn't just about contingency or a posteriori knowledge—since some necessary truths (like water being H₂O) are informative, and some a priori ones (like the triangle angles) can be too. 

  Looking at their cases, the sticking points are definitely (6) and (7). In (6), "Slim is the Weasel" is empty when introduced in the same breath, even with distinct names. But in (7), pointing at a statue and saying "this statue is this lump of bronze" is informative despite one perceptual episode. Why the difference? The user feels this is crucial but can't explain it. 

  I recall Frege's sense and reference distinction. The idea is that two terms can refer to the same thing but have different senses, making identities informative. But that doesn't resolve (6) vs. (7). In (6), the co-introduction seems to collapse the senses immediately, making it uninformative. In (7), the different sortals (statue vs. lump) might preserve distinct senses. 

  Then there's Perry's notion of "reflexive content" or the way information is presented. In (6), the reflexive content links the names directly via the briefing, so no room for doubt. In (7), the sortals frame the object differently, creating two cognitive files. That could explain why it's informative. 

  Moving to the belief contexts in (8) and (9). Here, the subject associates different information with each name, preventing substitution. This ties back to informativeness because the identity statement would bridge those separate files. So maybe the same mechanism—cognitive separation—underlies both phenomena. 

  For the unsettled cases: "I am this human animal" might be informative due to distinct modes of presentation (first-person vs. third-person), but the user is torn. The "A and B" case depends on whether the subject's cognitive architecture retains the co-introduction; if forgotten, it might become informative again. 

  The user wants a testable principle. I'm thinking of framing it as "informativeness occurs when a subject maintains distinct cognitive files for the same referent." This handles (1), (3), (4), (5), (7), (8), (9), (10). Case (6) fails because the files merge instantly. The cost is giving up the verdict on (7) being conceptual—it's more about cognitive architecture. 

  But is this principle too psychological? The user might want something more semantic. Alternatively, emphasizing the "epistemic access type" could work, where different types of access (e.g., perceptual, descriptive) sustain separate files. That distinguishes (7) (sortal-based access) from (6) (same briefing access). 

  Testing with a new case: Suppose two astronomers independently discover Venus but don't know it's the same planet. "Hesperus is Phosphorus" is informative. If later told by a third party they're the same, it remains informative until they integrate the information. This aligns with the principle. 

  If no single principle fits, splitting into "referential" vs. "cognitive" informativeness might be necessary. But that feels messy. The cognitive files approach seems promising, though it requires accepting that informativeness is subject-relative. The user's verdicts in (1) and (10) survive if relativized properly. 

  In conclusion, the cognitive files principle covers most cases, with the cost of relativizing informativeness to the subject's cognitive state and explaining (6) vs. (7) via immediate vs. sustained file separation. The user might need to adjust their view on (7) being non-empirical, but it's a reasonable trade-off.
answer: |-
  After analyzing your cases and requirements, I propose a unified principle based on **cognitive file architecture** that explains your verdicts while addressing the core puzzle of (6) vs. (7). The core idea: **Informativeness arises when a subject maintains distinct, unmerged *cognitive files* (mental representations) for a single referent, where files are individuated by their *epistemic access conditions*.**  

  ### The Principle:  
  **An identity statement "a = b" is informative for a subject S iff:**  
  > **(i)** S possesses two distinct cognitive files for the referent;  
  > **(ii)** These files are anchored by different *epistemic access types* (e.g., perceptual mode, descriptive content, source of introduction);  
  > **(iii)** S has not *operationally integrated* the files (i.e., cannot transparently substitute inferences between them).  

  **Clauses explained:**  
  - **(i) Cognitive files**: Mental dossiers storing information about objects. Distinct files imply S treats the referent as two potential objects.  
  - **(ii) Epistemic access types**: How S gains/loses access to the file (e.g., "visual perception," "testimonial introduction," "descriptive definition"). *Forced by:*  
    - (6) vs. (7): Same perceptual episode **(7)** uses two *sortal-based access types* (statue-file via "artwork" mode; lump-file via "material" mode). (6) uses one *testimonial introduction* for both names.  
    - (10): "Watching" vs. "being described" constitute distinct perceptual/testimonial access types.  
  - **(iii) Operational non-integration**: Files aren't treated as co-referential in S’s reasoning. *Forced by:*  
    - (2), (6): Immediate integration at introduction.  
    - (8)–(9): Files remain segregated due to conflicting beliefs or isolated information channels.  

  ---

  ### Application to Your Cases:  
  1. **Evening star/Morning star (1)**: **Informative.**  
     - Distinct files: Astronomical observation (evening) vs. (morning).  
     - Different access types: Temporal/positional criteria.  
     - *Cost:* Relativizes informativeness to subjects (e.g., an omniscient being wouldn’t find it informative).  

  2. **Cicero/Tully (3)**: **Informative.**  
     - Files anchored to separate biographical contexts (e.g., "orator" vs. "correspondent").  
     - Access types: Historical testimony from disjoint sources.  

  3. **Water/H₂O (4)**: **Informative.**  
     - Files: Phenomenal properties (sensory access) vs. chemical composition (theoretical access).  
     - Non-integration: Pre-theoretic vs. scientific concepts.  

  4. **Triangle angles (5)**: **Informative.**  
     - Files: Geometric intuition (diagram-based access) vs. formal proof (axiomatic access).  
     - A priori but distinct cognitive routes.  

  5. **Slim/Weasel (6)**: **Not informative.**  
     - Single testimonial access: Both names introduced in one breath → one file.  
     - *Distinction from (7):* (6) lacks divergent access types; (7) uses sortal-based access.  

  6. **Statue/Lump (7)**: **Informative.**  
     - Distinct files: "Statue" (aesthetic/functional access) vs. "Lump" (material/compositional access).  
     - One perceptual episode, but two *modes of presentation*.  

  7. **Belief contexts (8,9)**: **Informative.**  
     - Files segregated by conflicting beliefs (8) or isolated contextual access (9).  
     - Substitution failure and informativeness share the same mechanism: file non-integration.  

  8. **Two channels (10)**: **Informative.**  
     - Files: Visual access (monitor) vs. testimonial access (phone).  
     - Differing *perceiver-dependent anchors* count as distinct access types.  

  ---

  ### Costs and Unsettled Cases:  
  **(b) Verdicts to abandon:**  
  - **None** — all accommodated. The "cost" is relativizing informativeness to cognitive architecture.  

  **(c) Nature of Informativeness:**  
  - Property of **the statement relative to a subject’s cognitive state**.  
  - *(1) and (10) survive:* For (1), an expert astronomer may have merged files (uninformative), while a novice hasn’t; (10) hinges on the subject’s current file structure.  

  **(d) Substitution Failure vs. Informativeness:**  
  - **Same phenomenon.** Both arise from non-integrated files:  
    - Informativeness: S can *entertain* "a = b" without triviality.  
    - Substitution failure: S cannot *infer* "Φb" from "Φa" due to segregated files.  
  - *Boundary:* Cases like (6) show that co-introduction collapses files, preventing both.  

  **(e) Unsettled Cases Resolved:**  
  - **"I am this human animal"**: **Informative** (like (7)).  
    - Files: First-person (introspective access) vs. third-person (biological/visual access).  
    - Non-integration: We don’t natively equate "self" with "organism" (e.g., phantom limb cases).  
  - **"A is B" (forgotten co-introduction)**: **Informative.**  
    - Current files distinct: Anchored to separate informational contexts (letters).  
    - *Not mere ignorance:* Access types differ (e.g., "signatory A" vs. "signatory B").  

  **(f) New Prediction:**  
  - **Case:** S sees a stranger in a mirror, unaware it is their reflection. Later, S is told "That person is you."  
    - **Verdict:** *Informative*.  
    - Files: "Stranger" (visual access) vs. "self" (introspective access).  
    - Non-integration: Epistemic access types diverge.  

  ---

  ### Why This Works & What It Costs:  
  - **Splitting the phenomenon?** No single principle suffices if we demand *non-relative* informativeness. But your cases require subject-relativity (e.g., (5) is informative for students, not experts).  
  - **Costs:**  
    1. **Cognitive over semantic:** Informativeness depends on psychology, not just semantics.  
    2. **Sortals in (7):** Files are individuated by *access types*, not sortals per se. But sortals often trigger distinct access modes.  
    3. **(6) vs. (7):** Resolved by access types (testimonial vs. sortal-perceptual).  
  - **Boundaries:** Informativeness ceases when files merge (e.g., after learning (1), an astronomer no longer finds it informative).  

  This principle handles all your cases, explains the (6)/(7) contrast, and predicts new cases. If you reject cognitive architecture as foundational, the phenomenon splits into **linguistic** (e.g., (2), (6)) vs. **cognitive** (all others) informativeness — but this feels less unified. The proposed framework captures your intuitions while offering testable predictions.
