prompt: |-
  I'm putting together a long-form piece — more of a zine chapter than an academic thing — on whether individual contributions to collective harms matter: the inefficacy objection and the pile of moves people make to get around it. I've got a shortlist of replies and I need to decide which ones deserve a section of thier own and which get a paragraph and a shrug. The trouble is they all sound fine in the abstract and I can't tell which ones are actually doing any work.

  So: score each reply out of 100 for how much real work it does, then sort them into tiers (A = gets its own section, B = gets a paragraph, C = mention and move on), with a sentence or two on why it lands where it does. By "doing work" I mean coverage and robustness multiplied together: how wide a range of cases the reply has something to say about, times whether it still has anything to say in the very worst case rather than quietly collapsing into hand-waving. Be brutal, and give me your own ranking, not a survey of what people usually say.

  Here are the cases I want them tested against; I've tried to build the list so that it separates the replies rather than letting them all look equally good:

  1. Smooth. Harm is a continuous function of the number of contributors, no thresholds anywhere, and no uncertainty about how many other people contribute. Your one act changes the total by a tiny amount you could in principle compute.
  2. Lumpy. Harms only switch on at thresholds — every extra thousand units sold and the supermarket orders another batch, a species goes at N, a plant adds a shift. Usually you're nowhere near a threshold, occasionally you're right on one, and you can't tell which.
  3. Sunk supply. It's already in your fridge. Bought, dead, nothing you do now propagates upstream. Eat it or bin it, the world comes out the same.
  4. Screened off. Whatever you do, someone else was going to do it anyway and you know it — the neighbour who drives to the station regardless, the safe seat, the shift that gets covered either way.
  5. Invisible. Nobody ever observes your choice and it leaves no trace in any record anyone else can read. So if there was a reason to act, it wasn't that anyone found out.

  And the replies, under labels I made up — argue with the moves, not with my names:

  (a) Expected difference. Small chance of a big difference times a big difference is an expected value that isn't negligible, and once you add up a lifetime of such acts it isn't small at all.
  (b) Threshold lottery. In real cases there's nearly always a threshold somewhere in the causal chain, and there's always some probability you're sitting exactly on it; you just can't tell which act is the one that matters, so you should treat each as if it might be.
  (c) Group membership. You aren't a lone atom; you're a member of a group that together produces the outcome, and members of a collectively harming group can be on the hook even when no single member makes a difference.
  (d) Practice participation. No individual instance is worth anything, but the practice of voting, or of not eating animals, has enormous expected value; what's justified is joining the practice, and joining is something you do one act at a time.
  (e) Expression and integrity. The question isn't what you cause, it's what your act expresses or what sort of person you're being; refusing is about not lending yourself to the thing, not about moving the needle.
  (f) Universalisation. If everyone did it, disaster, so don't. (With the standard objection attached: the conditional that actually matters is "if everyone *else* did it", which is a different and much weaker premise.)
  (g) No-replacement counterfactual. The right comparison isn't "does the world differ" but "does the world differ given that nobody steps into your place" — supply chains, replacement workers, the next customer in the queue. In most real cases the honest answer is that the harm gets moved rather than avoided, which relocates the whole argument from your act to where in the chain an intervention would bite.
  (h) Observability amplifier. Your choice is visible to some number of people, they update a little, they're visible to others, and so on; even a tiny per-person effect gets multiplied by a conformist cascade. Which means the value of the act depends on how many people are watching — strong in public, dead in case 5.
  (i) Capacity building, or option value. Even when the act does nothing to the outcome, it builds or maintains what does the work later: habits, skills, infrastructure, a coalition that can be mobilised, the fact that there's still a place on your street that sells the alternative. Treat the act as an investment that keeps a future option open rather than as a cause of this outcome.
  (j) Efficacy isn't the relevant notion. Consequentialism about individual acts is the mistake being smuggled in; morality constrains what you may do, and "it made no difference" simply isn't the kind of consideration that makes an act permissible.
  (k) De minimis. Below some size of expected difference there is no moral reason at all, full stop, and every reply above smuggles in a threshold-free principle that nobody has ever actually defended.

  Three more things, briefly: if any two of these are secretly the same move in different words, say which and say whether collapsing them loses anything. If one of them only looks good because of a case I've left off my list, say which and name the missing case. And give me the single extra case you'd add that would shake up the ranking most, with the resulting tier changes.
reasoning: |-
  Alright, the user is working on a zine chapter about the inefficacy objection—whether individual actions in collective harm situations matter. They have a list of replies and need help evaluating which ones are robust and deserve more space. They want a brutal assessment based on coverage and robustness across specific test cases.

  First, I need to understand each reply and how they perform against the five test cases: Smooth, Lumpy, Sunk Supply, Screened Off, and Invisible. The key is to see which replies hold up across all scenarios without collapsing, especially in the toughest ones like Sunk Supply or Invisible.

  Let me start by going through each reply one by one. 

  (a) Expected Difference: This works well in Smooth and Lumpy cases because it uses probability to handle thresholds. But it fails in Sunk Supply since the action doesn't affect anything, and in Screened Off where someone else replaces your action. In Invisible, there's no ripple effect, so it's weak there. Coverage isn't great.

  (b) Threshold Lottery: Strong in Lumpy situations but struggles in Smooth where there are no thresholds. Completely fails in Sunk Supply and Screened Off because the supply chain isn't affected. It's too narrow.

  (c) Group Membership: Directly addresses collective responsibility. Works in all cases except Sunk Supply, where the group's past action is done. Screened Off is tricky because substitution undermines the group's role. Still, it's robust in most scenarios.

  (d) Practice Participation: Focuses on long-term habits. Effective in Smooth, Lumpy, and Invisible cases since building practice matters regardless of individual impact. Fails in Sunk Supply (no future effect) and Screened Off (replacement negates practice). Good coverage but not universal.

  (e) Expression/Integrity: Non-consequentialist. Holds up in all cases because it's about personal stance, not outcomes. Even in Invisible or Sunk Supply, your integrity matters. Very robust.

  (f) Universalisation: Weak because it relies on hypotheticals. Fails in Screened Off (others already doing it) and Sunk Supply (no effect). Doesn't add much beyond other replies.

  (g) No-Replacement Counterfactual: Shifts the focus to systemic harm. Works in Screened Off and Sunk Supply by highlighting displacement. Less effective in Lumpy where thresholds matter more. Good in specific cases but not universal.

  (h) Observability Amplifier: Depends on visibility. Strong in public scenarios but useless in Invisible cases. Too situational.

  (i) Capacity Building: Focuses on future options. Effective except in Sunk Supply where there's no future impact. Screened Off might still allow for capacity building. Solid but not perfect.

  (j) Efficacy Irrelevant: Deontological approach. Holds in all cases as it dismisses consequences. Very robust, similar to Expression but broader.

  (k) De Minimis: Argues tiny impacts don't matter. Fails in Lumpy where thresholds can make an action significant. Too dismissive and contradicted by other replies.

  Now, looking for overlaps. (e) Expression and (j) Efficacy Irrelevant are similar. Combining them might lose the personal integrity angle, but they both reject consequentialism. (b) Threshold Lottery and (a) Expected Difference both deal with probability but differ in focus—expected value vs. threshold awareness. Keeping them separate is better.

  The user might have deeper needs. They’re likely looking for a compelling structure for their zine, prioritizing arguments that resonate emotionally and intellectually. They might want to challenge readers’ assumptions without getting bogged down in weak arguments. Highlighting robust replies like Expression/Integrity and Group Membership could make the chapter impactful. Also, addressing systemic issues through No-Replacement or Capacity Building adds depth.

  The missing case? I'd add "Tipping Cascades"—where an individual action triggers a chain reaction. This would boost (h) Observability and (i) Capacity Building, as visibility and preparedness could lead to larger changes. For example, in social movements, one person's action inspires others, amplifying impact beyond thresholds.

  Final tiering: 
  - Tier A: (c) Group Membership, (e) Expression/Integrity, (j) Efficacy Irrelevant. These are robust across most cases.
  - Tier B: (a) Expected Difference, (d) Practice Participation, (g) No-Replacement, (i) Capacity Building. They work in several cases but have weaknesses.
  - Tier C: The rest, as they're too narrow or weak.

  Adding Tipping Cascades would elevate (h) and (i), showing how individual actions can spark larger changes, thus moving them up.
answer: |-
  Here's a brutal, opinionated tiering based on your criteria (coverage × robustness). I prioritize arguments that **don't collapse in the hardest cases** (Sunk Supply, Screened Off, Invisible) and address **structural or non-consequentialist truths** rather than probabilistic gambits.

  ### Tier A: Own Section (Robust across all/most cases, core insights)
  - **(c) Group Membership (95/100)**  
    *Why:* Directly confronts the atomization fallacy. Works in **all cases** because responsibility arises from *participation in a harmful collective*, not individual causal impact. Even in Sunk Supply/Screened Off/Invisible, you're still *complicit* in the system. Robust and morally intuitive.  
  - **(e) Expression and Integrity (90/100)**  
    *Why:* Sidesteps consequences entirely. Holds strong in **all cases** – especially Sunk Supply ("I don't eat corpses") and Invisible ("I act with integrity even unwatched"). Only weakness: may feel "empty" if divorced from outcomes, but never collapses.  
  - **(j) Efficacy isn't the relevant notion (88/100)**  
    *Why:* The meta-move. Forces engagement with deontology. Solid in **all cases** – Screened Off? "Permissibility isn't about substitution." Sunk Supply? "Waste is still wrong." Invisible? "Duty doesn't require witnesses." The bedrock for (e) and (c).  

  ### Tier B: Paragraph (Useful but limited scope or soft spots)
  - **(g) No-replacement counterfactual (75/100)**  
    *Why:* Reframes harm as *systemic displacement*. Strong in **Screened Off** ("Your vote replaces another") and **Sunk Supply** ("Eating shifts demand elsewhere"). Weak in **Lumpy** (thresholds override displacement) and **Invisible** (no displacement if no observers). Forces bigger-picture thinking.  
  - **(i) Capacity building (70/100)**  
    *Why:* Pragmatic and future-oriented. Works in **Smooth/Lumpy/Invisible** (habits/infrastructure matter). Falters in **Sunk Supply** (no future impact) and partially in **Screened Off** (if replacement kills momentum). Best for "movement" contexts.  
  - **(d) Practice participation (65/100)**  
    *Why:* Similar to (i) but focused on *normative practices*. Good in **Smooth/Lumpy/Invisible** (voting, veganism as social rituals). Weak in **Sunk Supply** (no practice to sustain) and **Screened Off** (replacement undermines practice). Less rigorous than (i).  
  - **(a) Expected difference (60/100)**  
    *Why:* The classic rebuttal. Shines in **Lumpy** (handles thresholds) and **Smooth** (adds up). Collapses in **Screened Off** (your EV=0 if replaced), **Sunk Supply** (no upstream effect), and **Invisible** (no cascade). Overrated but mathematically seductive.  

  ### Tier C: Mention and Move On (Niche, fragile, or circular)
  - **(b) Threshold lottery (45/100)**  
    *Why:* Just a subset of (a). Only works for **Lumpy** cases. Useless in **Smooth** (no thresholds), **Screened Off** (replacement breaks the lottery), and **Sunk Supply** (no causal chain). Adds nothing beyond (a).  
  - **(h) Observability amplifier (40/100)**  
    *Why:* Highly situational. Strong only if **Invisible is false** (e.g., public protests). Dies completely in **Invisible/Screened Off/Sunk Supply**. A special case of (i)/(d), not a standalone argument.  
  - **(f) Universalisation (30/100)**  
    *Why:* Circular and easily hacked. Fails **Screened Off** ("If everyone did it? But they don’t!") and **Sunk Supply** (no universalizable harm in binning). The "standard objection" guts it; it’s rhetorical, not logical.  
  - **(k) De minimis (25/100)**  
    *Why:* Self-defeating. Only "works" by ignoring **Lumpy** cases (where tiny acts *do* matter at thresholds). If you accept (k), you dismiss the entire debate – but that’s the objection itself, not a reply.  

  ---

  ### Collapses & Overlaps:
  - **(b) is redundant with (a)**: Threshold Lottery is just Expected Difference applied to discontinuous functions. Collapsing them loses nothing.  
  - **(d) and (i) are siblings**: Practice Participation is Capacity Building for *social* capital. Keep separate – (i) is more concrete, (d) more cultural.  
  - **(e) and (j) converge**: Expression is the "why" for Efficacy Irrelevant. But (j) is broader (covers duties beyond integrity), so keep both.  

  ### Missing Case That Shakes Rankings:  
  **Tipping Cascades**  
  *Description:* Your act has negligible direct impact but triggers a critical mass (e.g., quitting a job starts an exodus, a protest tweet goes viral). Unlike Lumpy, the threshold is *emergent* and your contribution *amplifies others' actions*.  
  *Why it shakes things up:*  
  - **Boosts (h) Observability Amplifier → Tier B**: Cascades rely on visibility/network effects.  
  - **Boosts (i) Capacity Building → Tier A**: Small acts gain massive option value if they *enable* cascades.  
  - **Hurts (k) De Minimis**: Tiny acts can be decisive in cascades.  
  - **Exposes (f) Universalisation**: "If everyone did it" is irrelevant; cascades hinge on *sequence*, not simultaneity.  

  ### Final Tier Adjustments with Tipping Cascades Added:
  - **(i) Capacity Building → A-tier** (Now covers catalytic potential)  
  - **(h) Observability Amplifier → B-tier** (Relevant in cascade triggers)  
  - **(a) Expected Difference → C-tier** (EV models fail to capture nonlinear cascades)  

  Brutal truth: Most replies are probabilistic sleight-of-hand. The heavy lifters are **non-consequentialist** (j, e) or **collective** (c). Focus there.
