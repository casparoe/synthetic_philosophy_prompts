prompt: |-
  I am drafting the position statement for a dissertation prospectus on standing to blame, and before it goes to my committee I would like the set of commitments below audited rather than summarised. Specifically, I want to know which of them genuinely pull against each other, which only look as though they do, and for each real tension what the least costly repair would be and what that repair would cost me elsewhere.

  (a) Whether blame is apt is settled entirely by target-side facts: what she did, whether she was morally competent, and what relationship she stands in to the person wronged. Nothing about the blamer's own record bears on aptness.

  (b) Standing is a separate, forfeitable normative status, and you're one to talk can be a genuine objection to someone's blaming rather than a remark about how well the blaming will go down.

  (c) There is no clean-hands condition. Having committed the same wrong, or one relevantly similar to it, even while continuing to commit it, does not by itself defeat standing. Blame is not a privilege earned by compliance, and given pervasive complicity a clean-hands rule would silence most criticism of structural wrongs.

  (d) Hypocrisy does defeat standing, and hypocrisy is neither mere wrongdoing nor mere insincerity. It consists in invoking a norm one is not willing to be governed by: exempting oneself from a standard one applies to others.

  (e) Avowal is sufficient for restoration. A hypocrite who publicly owns the mismatch between her standard and her conduct, without reforming and without ceasing the conduct, is back in a position to blame.

  (f) Verdict: the mother who smokes, tells her son that smoking is stupid, freely concedes that she cannot stop, and tells him without evasion to follow her advice rather than her example, lacks standing. Her candour does not help her.

  (g) Verdict: a newspaper that carried fossil-fuel advertising for years and now runs editorials blaming consumers for their carbon footprints lacks standing; but the mid-level employee who took part in a fraud, was herself paid under it, and is now cooperating with investigators retains standing to blame her former colleagues.

  (h) Standing is a matter of degree, it is independent of what the blaming is likely to achieve, and it constrains only the address and not the underlying judgement that a wrong was done. When standing is defeated, the correct response is not to retract the content of the blame or to fall silent but to change the speech act: avowal, self-implicating criticism, or a complaint made in the first person plural.

  Two notes on where I take the trouble to be, so that you can tell me I am wrong about it. I keep worrying that (a) and (b) cannot both be true, although every time I write the distinction out it seems to survive. And my suspicion is that the newspaper half of (g) is where a clean-hands clause is quietly sneaking back in.

  What I want back: the tensions ranked by severity rather than listed as equals; for each, the exact commitments in conflict and what would have to be revised to relieve it; an explicit statement of which apparent tensions dissolve on inspection and why; and, if it comes to it, the single revision that would clean up the most.
reasoning: |-
  Okay, the user is working on a dissertation prospectus about standing to blame and wants me to audit their commitments rather than summarize them. They've listed eight points (a-h) and want to know where there are genuine tensions, which only appear to conflict, and how to fix the real tensions with minimal cost.

  First, I need to understand what standing to blame means. It's about whether someone has the moral authority or right to blame another person, beyond just whether the blame is accurate. The user has several commitments here.

  Looking at their main concerns: they're worried that (a) and (b) might conflict. (a) says blame aptness depends only on the target - what they did, their competence, and relationship to the wronged. But (b) says standing is a separate status that can be forfeited, and "you're one to talk" can be a valid objection. So (a) focuses on the target, while (b) introduces blamer-side factors affecting standing. The user thinks they can coexist, but I need to check if they genuinely conflict.

  Then there's (c) - no clean-hands condition. Committing the same wrong doesn't automatically defeat standing. But (d) says hypocrisy does defeat standing, defined as applying a norm to others that you exempt yourself from. The user suspects in (g) that the newspaper example might sneak in a clean-hands requirement.

  Also, (e) says avowal (admitting the mismatch) is enough to restore standing, even without changing behavior. But (f) says the smoking mother lacks standing despite her candor. That seems contradictory. And (g) has two verdicts: newspaper lacks standing but the cooperating employee retains it, which might be inconsistent.

  (h) introduces that standing is gradable and affects how blame is expressed, not whether the judgment is correct.

  Let me identify tensions:

  1. Between (e) and (f): Avowal should restore standing per (e), but the mother's candor doesn't help per (f). That's a direct conflict.

  2. Between (d) and (g): Hypocrisy defeats standing per (d), but the cooperating employee in (g) retains standing despite possibly being hypocritical if she participated in fraud. The user might be distinguishing based on avowal or cooperation, but it's not explicit.

  3. Between (c) and (d)/(g): (c) rejects clean-hands, but (d) and the newspaper verdict in (g) might imply that past similar wrongdoing can undermine standing if hypocritical. The user suspects clean-hands is sneaking in here.

  4. Between (a) and (b): The user worries these conflict. (a) says aptness is only about the target, while (b) introduces blamer-side factors for standing. If standing is part of aptness, they conflict. But if aptness and standing are separate, maybe they can coexist. The user seems to want them separate.

  Apparent tensions that might dissolve:
  - (c) and (d): Clean-hands isn't automatic, but hypocrisy is a specific blamer-side factor. They might be compatible if hypocrisy is distinct from mere similar wrongdoing.
  - (a) and (b): If aptness is about the blame being correct, and standing is about the blamer's authority, they could be separate. But if aptness includes standing, there's conflict.

  To fix the severe tension between (e) and (f):
  - Option: Drop (e) and say avowal isn't sufficient; reform might be needed. But that costs the elegant restoration mechanism.
  - Option: Reinterpret (f) - maybe the mother isn't hypocritical because she admits the mismatch. But (f) says she lacks standing despite candor. Alternatively, clarify that her advice isn't blaming, or say her exemption is ongoing.

  For (d) and (g)'s employee: The employee is cooperating, which might count as avowal or reform, so she retains standing. The newspaper hasn't avowed, so hypocrisy remains. That could resolve it if specified.

  For (c) and the newspaper in (g): The newspaper might be hypocritical by applying norms it exempted itself from (by taking ad money), not merely because of similar wrongdoing. So it's hypocrisy, not clean-hands.

  Ranking tensions:
  1. (e) vs (f) - Direct contradiction.
  2. (d) vs (g)'s employee - Potential inconsistency if no avowal is mentioned.
  3. (a) vs (b) - Depends on how aptness and standing are separated.
  4. (c) vs newspaper verdict - Resolvable if hypocrisy is the reason.

  The single best fix might be to modify (e) to require that avowal must be credible and not involve ongoing exemption, so the mother's case doesn't count. Or drop (e) and tie restoration to reform. But that has costs for addressing structural wrongs.

  The user wants tensions ranked, exact conflicts, repairs, and dissolved apparent tensions. They also want the most efficient fix. I'll structure the response accordingly, starting with the most severe tension and moving down.
answer: |-
  Below is a structured audit of your commitments regarding standing to blame, based on your specified requirements. I've identified genuine tensions (ranked by severity), apparent tensions that dissolve on closer inspection (with explanations), and repair options for each genuine conflict. I conclude with a recommendation for the single most efficient revision. Your core framework is coherent but has one critical tension that threatens internal consistency, alongside two lower-severity issues and several resolvable ambiguities.

  ### **Genuine Tensions (Ranked by Severity)**
  **1. Tension Between (e) and (f): Avowal vs. the Smoking Mother Verdict**  
  - **Conflict:** (e) claims avowal (publicly owning the mismatch between one’s standards and conduct) is *sufficient* for restoring standing, even if conduct continues unchanged. (f) states that the smoking mother—who openly admits her hypocrisy ("follow my advice, not my example")—*lacks standing*, implying her avowal does nothing. This is a direct contradiction: if avowal suffices, the mother should regain standing; if she lacks standing, avowal cannot be sufficient.  
  - **Severity:** Critical. This undermines the restoration mechanism central to your theory and creates inconsistency in applied verdicts.  
  - **Repair Options:**  
    - **Option 1: Drop (e)**. Replace avowal with a stronger condition (e.g., *reform* or *sincere commitment to change*).  
      - **Cost:** Abandons a key innovation for addressing structural complicity (per (c)). Avowal is low-cost and inclusive; requiring reform risks silencing critics in pervasive-injustice contexts (e.g., a carbon-emitting activist blaming corporations). Also weakens (g)'s employee case if cooperation isn't reform.  
    - **Option 2: Reinterpret (f)**. Argue the mother’s statement is not true avowal because she *endorses her exemption* (e.g., "I can’t stop" implies she sees herself as excused). Thus, she fails (d)'s hypocrisy condition (invoking a norm while exempting oneself).  
      - **Cost:** Demands a narrower definition of avowal (e.g., requiring remorse or rejection of exemption). Risks making avowal too demanding and less distinct from reform. May not fully resolve (g)'s newspaper case (see below).  
    - **Option 3: Modify (e)**. Specify that avowal restores standing *only if it disavows ongoing exemption* (e.g., "I am wrong to do this"). The mother’s "I cannot stop" frames her conduct as non-voluntary, preserving her exemption.  
      - **Cost:** Introduces a new condition (volitional commitment) that may overcomplicate avowal. Could conflict with (c) if "disavowing exemption" edges toward a clean-hands requirement.  
  - **Least Costly Repair:** **Option 3**. It preserves avowal’s role while aligning with (d)’s view of hypocrisy as self-exemption. Clarifies that avowal requires rejecting one’s *entitlement* to violate the norm, not just acknowledging the act.  

  **2. Tension Between (d)/(e) and (g): Hypocrisy and the Cooperating Employee**  
  - **Conflict:** (d) states hypocrisy defeats standing, and (e) implies avowal restores it. In (g), the employee "took part in a fraud, was paid under it," but retains standing to blame colleagues while "cooperating with investigators." If she hasn’t avowed her hypocrisy (e.g., denounced her own past actions), this violates (d)—she benefits from a double standard (blaming others while being complicit). If she *has* avowed, (g) needs explicit acknowledgment to avoid inconsistency with (f).  
  - **Severity:** High. This risks ad hoc exemption for "cooperators" and could smuggle in clean-hands intuitions (per your suspicion about (g)’s newspaper half).  
  - **Repair Options:**  
    - **Option 1: Clarify that cooperation implies avowal**. Treat "cooperating with investigators" as public disavowal of her past conduct (satisfying (e)).  
      - **Cost:** Overextends avowal; cooperation could be self-interested (e.g., plea deal). May not address hypocrisy if she still exempts herself (e.g., "I had no choice, but they are guilty").  
    - **Option 2: Add a "role" exception**. Argue standing depends on social roles (e.g., investigators, whistleblowers), so cooperation confers derivative authority.  
      - **Cost:** Contradicts (a) and (b) by making standing depend on blamer-side institutional facts, not just relationships/target.  
    - **Option 3: Emphasize degree (per (h))**. The employee has *partial* standing due to cooperation, distinguishing her from the unrepentant newspaper.  
      - **Cost:** Requires refining (h) to specify how acts like cooperation modulate degree. Risks vagueness.  
  - **Least Costly Repair:** **Option 1 plus minor revision to (g)**. Explicitly state the employee avowed (e.g., "admitted wrongdoing during cooperation"). This leverages (e) and avoids new principles. Cost: Makes (g) rely on an unstated detail, but this is easily fixed in drafting.  

  **3. Tension Between (a) and (b): Target-Side Aptness vs. Blamer-Side Standing**  
  - **Conflict:** (a) insists aptness (whether blame is *merited*) is determined solely by the target’s actions, competence, and relationship to the victim. (b) treats standing as a separate normative status *forfeited by the blamer* (e.g., via hypocrisy), which can make blame inapt ("you’re one to talk" is a validity objection). If standing is necessary for apt blame, then (a) is false—blamer-side facts *do* bear on aptness.  
  - **Severity:** Moderate. This is primarily terminological but risks conflating "aptness" (fittingness of blame to the target) with "all-things-considered appropriateness."  
  - **Repair Options:**  
    - **Option 1: Decouple aptness and standing**. Clarify that (a) defines "aptness" strictly as *blame’s accuracy* (the target deserves it), while (b) defines "standing" as *blamer’s authority to deliver it*. Thus, blame can be apt (target deserves it) but lack standing (blamer can’t permissibly voice it).  
      - **Cost:** Requires rigorous distinction between "blame as judgment" (covered by (a)) and "blame as speech act" (covered by (b)/(h)). This aligns with (h)'s point that standing constrains "address" but not judgment. Minimal cost if consistently maintained.  
    - **Option 2: Redefine aptness**. Broaden "aptness" to include both target-desert and blamer-standing.  
      - **Cost:** Forces revision of (a), weakening its target-focused clarity and making your view less distinctive.  
  - **Least Costly Repair:** **Option 1**. This respects your intuition that (a) and (b) can coexist. Strengthen (a) to specify it addresses *desert*, not permissibility.  

  ---

  ### **Apparent Tensions That Dissolve on Inspection**
  - **(c) vs. (d): Clean-Hands vs. Hypocrisy**  
    **Why it dissolves:** (c) rejects a "same-wrong" rule (clean-hands), while (d) targets hypocrisy (applying a norm you exempt yourself from). These are distinct: one can have "dirty hands" *without* hypocrisy (e.g., a repentant addict blaming others for addiction) or be hypocritical *without* identical wrongdoing (e.g., a liar blaming a cheater). (c) ensures complicity doesn’t auto-disqualify; (d) adds that *sanctimonious blamers* are disqualified. No conflict.  

  - **(c) vs. Newspaper in (g): Clean-Hands "Sneaking In"?**  
    **Why it dissolves:** Your verdict against the newspaper isn’t based on same-wrong (clean-hands) but on *hypocrisy* (per (d)). The paper "carried fossil-fuel ads" (profiting from the norm-violation) while "blaming consumers," implying it exempted itself from complicity. This aligns with (d): it invoked a norm (reduce carbon footprints) while acting as if its role exempted it (we’re just advertisers, not blameworthy). (c) holds because same-wrong isn’t the issue—a non-hypocritical paper with ad revenue could still have standing.  

  - **(e) vs. (d): Avowal "Excusing" Hypocrisy**  
    **Why it dissolves:** (d) defines hypocrisy as a standing-defeater; (e) offers a restoration path. This is additive, not contradictory—avowal removes the hypocritical status by eliminating the "exemption" (one no longer invokes a norm while holding oneself apart). Think of it as hypocrisy being a revocable condition.  

  - **(f) vs. (h): Smoking Mother and Standing as Degree**  
    **Why it dissolves:** (h) notes standing is gradable, but (f) treats the mother as having *no* standing. This is consistent if her hypocrisy (per (d)) reduces standing to zero. (h) doesn’t require all cases to be partial—complete defeat remains possible.  

  ---

  ### **The Single Most Efficient Revision**  
  **Revise (e) to: "Avowal is sufficient for restoration *only when it rejects ongoing self-exemption*."**  
  - **Why:** This cleanly resolves the critical (e)-(f) tension by requiring the avower to renounce their entitlement to violate the norm (e.g., the mother’s "I cannot stop" fails this). It also:  
    - Preserves avowal’s power in structural cases (e.g., "I participate in this unjust system and am wrong to do so").
    - Strengthens alignment with (d) (hypocrisy as self-exemption).
    - Indirectly fixes the (g) employee case (cooperation likely implies rejecting exemption).
    - Avoids major costs (no new principles, stays true to (c)).
  - **Secondary Adjustment:** Explicitly link the (g) employee’s cooperation to avowal in your narrative to resolve the (d)/(e)-(g) tension.  
  - **Impact:** With this, all severe tensions dissolve, preserving your core insights on structural blame (c), hypocrisy (d), and speech-act constraints (h).  

  This audit suggests your framework is robust and salvageable with minimal tweaks. The smoking mother case (f) is the linchpin—once (e) is refined to exclude performative self-exemption, your position holds. If you retain this revision, your committee’s likely pushback will focus on whether "rejecting self-exemption" is empirically or psychologically plausible (e.g., in non-ideal agents), but that’s a defensible burden.
