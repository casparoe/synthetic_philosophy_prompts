  - Boorse's naturalism: Disease is a deviation from normal species functioning (statistically normal functional ability relative to age and sex). It is value-free and based on biological design.
  - Normativism: Disease is a condition that is disvalued (causes harm, suffering, disability) and thus is inherently value-laden.
  - Wakefield's hybrid "harmful dysfunction": Dysfunction (failure of a mechanism to perform its natural function, based on evolutionary design) and harm (value-based judgment) are both necessary.

  Your scores:
