     - What it buys: Captures the statistical normality aspect of Boorse. It is value-free in the sense that it is based on data, not human values.
     - What it costs: It ignores individual variation (e.g., the elite athlete who is statistically abnormal but healthy) and does not account for harm. It also does not capture evolutionary design (etiology).

  Candidate 2: "Normal function" = Contribution to predicted future capability (using the capability-forecast, score 3).
     - What it buys: It ties function to the ability to perform certain capabilities that we care about (which are normatively chosen). This is closer to the normativist view because the capabilities are valued (walking, grip strength). It also has a future-oriented, functional aspect.
     - What it costs: It is not value-free (we chose the capabilities) and it might not capture the evolutionary design. Also, it is predictive and thus might not reflect current dysfunction.

  Candidate 3: "Normal function" = Stability or lack of deviation in the per-person baseline (score 1).
     - What it buys: Captures individual normal functioning. It is value-free in the sense of being based on the individual's own data.
     - What it costs: It might miss conditions that are stable but harmful (e.g., a stable chronic disease) or conditions that are changing but within normal limits (e.g., aging). It does not capture population normality or harm.

  Candidate 4: (Hybrid) "Normal function" = A combination: The population model (score 2) provides the statistical norm, and the capability forecast (score 3) provides the harm (by predicting a drop in valued capabilities). 
     - What it buys: Captures both the statistical deviation and the harm. This is close to Wakefield: dysfunction as statistical deviation (score 2) and harm as predicted capability drop (score 3).
     - What it costs: It is a two-part definition and might not perfectly align. Also, the statistical deviation in score 2 might not be due to evolutionary dysfunction.

