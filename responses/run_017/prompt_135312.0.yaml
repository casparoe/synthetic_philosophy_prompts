answer: |-
  ## Her  
  *(after the diagnosis)*  

  Stanza 1  
  The dream: each tremor matched to faulty **wire**,  
  Each hollow ache explained by sodium's **salt**,  
  Each fractured thought traced to a single **fold**,  
  Precisely countered by a measured **dose**.  
  No ghost remains within the humming **current**,  
  Just circuits logged by serial **number**.  

  Stanza 2  
  If meaning were a spark along the **wire**,  
  Controlled by gates that shunt the vital **salt**,  
  If psyche were a protein’s crucial **fold**,  
  Restored by calibrating hope's **dose**,  
  If joy were just the voltage's rising **current**,  
  Then mind submits to cardinal **number**.  

  Stanza 3  
  Yet here: the same bleak weight, the crushing **dose**,  
  Assembles from a different faulty **wire**,  
  Or stems from channels clogged with missing **salt**,  
  Or tangled proteins in a poisoned **fold**.  
  The same despair, regardless of the **current**'s  
  Precise, indifferent, fleeting **number**.  

  Stanza 4  
  The very thing that buckles every **fold**,  
  Or floods the synapse past the lethal **dose**,  
  Or stutters where the signal cleaves the **salt**,  
  Or severs paths defined by guiding **wire** –  
  It manifests the same. The raw **current**  
  Denies the source that feeds its **number**.  

  Stanza 5  
  If every pulse obeys the local **current**,  
  If every synapse heeds its quantum **dose**,  
  If structure yields to forces on the **fold**,  
  If charge depends on gradients of **salt**,  
  If path is fixed by layout of the **wire**,  
  Accounted in the final, full **number** –  

  Then what is *this* that gathers, dense and spare?  
  Can it exert a force? Or vanish into **air**?  

  Stanza 6  
  But watch the ice form. Countless bonds of **salt**,  
  A billion chances governed by the **fold**,  
  The random dance beneath the probe’s bright **current**,  
  Defy prediction, molecule by **dose**,  
  Until the system *tips*. No single **wire**  
  Explains the fracture. Singular, the **number** fails.  

  Envoy  
  So **Her** persists – not ghost, not **wire**, nor **salt** alone,  
  But pattern’s weight, the **number**’s gathered toll.  
  The **dose**, the **fold**, the **current** hold their stone.  

  ---

  **Notes on Constraints & Choices:**  
  1.  **End Words:** Chosen for mechanistic resonance and capacity for layered meaning: `fold` (protein folding, cortical folding), `dose` (medication, biochemical quantity), `wire` (neural wiring, electrodes), `salt` (ions, neurotransmitters, electrolytes), `number` (quantification, count, statistic), `current` (electrical flow, ion flux).  
  2.  **The Unnamed:** The illness/"Her" never appears in the body. The title and envoy's "Her" fulfill the need to name it minimally where structurally inevitable (the envoy's pairing demand). The cost is breaking the initial rule of absolute avoidance, deemed necessary for the envoy's impact and the poem's emotional core.  
  3.  **Stanza 1 & 2:** Strict rotation establishes the mechanistic, one-to-one matching ideal (`tremor`/`wire`, `ache`/`salt`, `thought`/`fold`, countered by `dose`, governed by `current` and `number`).  
  4.  **Stanza 3 & 4:** Multiple realizability demonstrated. Different configurations (`faulty wire`, `missing salt`, `poisoned fold`) yield the "same bleak weight" (`dose`), the "same despair". The macro-state ("the very thing") is indifferent to the micro-arrangement.  
  5.  **Stanza 5:** The Exclusion Dilemma. The stanza poses the question: If the micro (`current`, `dose`, `fold`, `salt`, `wire`, `number`) is causally complete, what status/causal power does the higher-level phenomenon ("this that gathers") have? It ends unresolved as a direct question ("Can it exert a force? Or vanish into air?"), embodying the dilemma.  
  6.  **Stanza 6:** Modest Emergence (Singular Limit). Uses the phase transition analogy (ice formation - `salt` bonds, `fold`/structure, `current`/energy, `dose` of chance). Emphasizes the system-level "tip" where individual micro-predictability (`molecule by dose`, `single wire`) fails, and the macro-state ("fracture") emerges, defying reduction to a singular micro-`number`.  
  7.  **Envoy Pairing:** Pairs `Her` (the emergent illness) explicitly with lower-level terms. The verdict: `Her` *is* the pattern (`pattern's weight`, `number’s gathered toll`), irreducible to any single element (`wire`, `salt`) but *realized by* (`hold their stone`) the collective interaction (`dose`, `fold`, `current`). Rejects reduction without resorting to dualism.  
  8.  **Avoidances:** No "sum of parts", no quantum woo. "Nothing but" appears implicitly as the claim examined in Stanza 2 ("*just* circuits", "*then* mind submits"). No consolation.  

  **Prose Context: Settled, Contested, Poem's Leanings**  

  **Settled/Near-Settled:**  
  *   **Multiple Realizability (MR):** Widely accepted. A given mental state/illness (e.g., depression) can be realized by diverse neural/biological substrates (different `wires`, `folds`, `salt` imbalances). This defeats *type-identity* reduction (depression *is identical to* one specific neural state). (Putnam, Fodor).  
  *   **Explanatory Autonomy:** Consensus that higher-level sciences (psychology, psychiatry) are indispensable *practically* due to MR and complexity. We *need* macro-level explanations (`pattern's weight`).  
  *   **Phase Transitions & Limits:** Well-understood that phenomena like phase transitions (`ice form`) are emergent in the sense of being best described/explained *only* at the macro-level within thermodynamics, arising from micro-interactions but not reducible *in practice* (often *in principle* for infinite systems) to tracking individual particles (`singular, the number fails`).  

  **Genuinely Contested:**  
  1.  **MR vs. Reduction:** Does MR defeat *any* form of reductionism?  
      *   *Contention:* Token-identity theorists (e.g., Kim later work) argue each *instance* (`token`) of depression *is identical to* some specific neural state (`this dose`, `this salt`, `this fold`), even if the *type* isn't. Functional reduction might still be possible. Others (e.g., emergentists) see MR as evidence for ontological irreducibility.  
      *   *Poem Leans:* Towards MR defeating robust reduction, implying `Her` is not captured by any specific micro-configuration ("*Regardless* of the current's... number").  
  2.  **Singular Limits & Ontology:** Does emergence in singular limits (phase transitions) imply *ontological* novelty (new properties/entities) or just *explanatory* necessity?  
      *   *Contention:* Physicalists often see it as explanatory emergence only; the system's state is still determined by the micro-physics. Some argue it shows genuine ontological emergence (e.g., new causal powers at the macro level).  
      *   *Poem Leans:* Towards the modest, explanatory view ("*Defy prediction*", "*Singular, the number fails*"), avoiding strong ontological claims.  
  3.  **The Exclusion Argument & Mental Causation (The Dilemma):**  
      *   *Kim's Argument:* If the physical (`dose`, `fold`, `current`, `salt`, `wire`, `number`) is causally closed, and mental states (`Her`, `despair`) are not identical to physical states, then either 1) the mental is epiphenomenal (does nothing - "vanish into air?"), or 2) it causes physical effects, violating causal closure (overdetermination).  
      *   *Contention:* Is the argument sound? Responses include: rejecting causal closure, embracing non-reductive physicalism with downward causation (contested), denying mental states are distinct entities (identity theory), or accepting epiphenomenalism. **This is a core live dilemma.**  
      *   *Poem Leans:* It starkly presents the dilemma (Stanza 5) but implies in the envoy that `Her` ("pattern's weight") *is* causally significant, leaning towards non-reductive physicalism or emergence *without* resolving the exclusion problem cleanly. This is a fudge for emotional/practical resonance with the clinician's experience, potentially embarrassing under strict neuro-philosophical scrutiny where epiphenomenalism remains a threat.  
  4.  **Strong Emergence:** Does it have coherent content? Is it compatible with physicalism? Highly contested, often seen as implying fundamental novelty violating physical causal closure. The poem avoids this.  

  **Note on Temperature:** Correctly noted. The poem avoids using temperature as a paradigm. The phase transition analogy (`ice form`) is used instead, which is a standard example of emergence in complex systems theory, avoiding the specific pitfalls of the temperature reduction example (ideal gas assumption, negative temperatures).  

  **Where the Poem Fudges/Leans:**  
  *   **Stanza 5 Dilemma:** Presents the exclusion problem starkly but doesn't resolve it. The envoy leans towards the reality and causal weight of the pattern (`Her`) despite the dilemma, reflecting the clinician's lived necessity. This prioritizes experience over resolving the deepest philosophical tension.  
  *   **Envoy's "Stone":** Metaphorically suggests the lower-level elements *support* or *realize* the higher level (`hold their stone`), implying realization without identity. This is a contested but common non-reductive physicalist move.  
  *   **"Pattern's Weight":** While evocative, "weight" subtly smuggles in a causal metaphor (`pattern’s weight, the number’s gathered toll`) which an exclusion hardliner would challenge.  
  *   **Singular Limit:** Simplifies the infinite-system requirement for strict phase transitions (`thermodynamic limit`) for poetic conciseness ("*Singular, the number* fails").  

  The poem embodies the tension you described: refusing reductionism (`nothing but`) while refusing dualism (`not ghost`). It leans on MR and explanatory emergence, acknowledges the exclusion dilemma without solving it, and finds its resolution in the pragmatic reality and irreducible experience of the pattern (`Her`), even at the cost of a slight philosophical fudge in the face of causal closure. It should resonate clinically while signaling awareness of the underlying debates.
