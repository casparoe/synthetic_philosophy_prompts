          Round 4: 
              true state
              for voters 1-3 (experts): signal with p=0.8
              for voters 4-9: signal with p=0.6
     - Print the spreadsheet and write the signals on cards. Label: Round, Trial, Team, VoterID. 
     - Have a scoreboard.

  Facilitator script:

  Round 1: 
     "In this round, each of you will receive a card with a signal: A or B. There is a true state, which is either A or B. Your signal is correct with a certain probability. You will vote by show of hands for A or B. The majority wins. We will do 5 trials. After each trial, I will reveal the true state."

     Then for each trial: 
          Distribute the cards for that trial to each team (each voter gets one card). 
          "Vote now: for A, raise your hand; for B, raise your hand." 
          Tally and announce the majority vote for each team. 
          Reveal the true state. 
          Record if the team was correct. 

  Round 2: 
     "This round is similar, but your signal is less accurate. Also, within your team, we will have two groups: a small group of 3 and the rest as a large group of 6. The small group will vote separately from the large group. So we will have two verdicts per team per trial."

     For each trial: 
          Distribute the cards (same as Round 1 distribution, but for p=0.45).
          For each team: 
               Randomly select 3 voters for the small group. 
               The small group votes: have the 3 raise hands for A or B. Tally. 
               The large group (the other 6) vote. 
          Reveal true state. 
          Record correctness for small and large groups. 

  Round 3: 
     "Back to the original accuracy, but with a twist. Each of you gets a card. Vote as a whole team again."

     (same as Round 1 but with correlated signals)

  Round 4: 
     "In this round, we have experts. Three of you in each team are experts: your signal is more accurate. And your vote counts as 3 votes. The others have one vote each."

     Designate the experts (randomly or by volunteer? Randomly). 
     For each trial: 
          Distribute cards: experts get p=0.8, others p=0.6. 
          Vote: each expert says A or B and that counts as 3 votes, others as 1. 
          Tally the total votes for A and B. 

  Asymmetric costs: 
     "In the real world, errors are not symmetric. Let's say that convicting an innocent person (saying A when it's B) costs 10 points, while acquitting a guilty person (saying B when it's A) costs 1 point. How should we change our decision rule?"

     We do one trial (use a new set of signals or from baseline). 
     Collect the votes (but don't tally yet). 
     Ask: "If we require a simple majority (5 out of 9) to convict, what could happen? What if we require 7 out of 9? Which rule minimizes the expected cost?"
     Discuss briefly. 
     Then reveal the true state and compute the cost for both rules for this trial. 

  Debrief: 
     Show a table of the results for each round. 
     Discuss the assumptions. 

  Potential pitfalls:
     - Noise: with only 5 trials, the results might not match the expectation. Solution: we can do more trials if time? Or we can precompute the expected results and show them at the end? But that might be cheating. We can say: "In theory, we expect ... and we observed ...". 
     - Students might trade cards or show cards: instruct clearly not to. 
     - Dominating discussion: during voting, some students might try to persuade. We should say: "Vote based solely on your card. Do not discuss." 
