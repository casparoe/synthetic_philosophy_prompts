     - Split into two teams (by counting off 1 and 2, then 1s on one side, 2s on the other). 

  5-20 min: Round 1 (Baseline) - 15 minutes
     - Each team has 9 voters. But we want 15? We don't have 15 per team. So we adjust: we use the entire team of 9 as the jury. 
     - We do 5 trials. 
     - Per trial: 
          - Facilitator flips a coin for the true state (or uses a precomputed sheet). 
          - For each voter in each team, generate a signal: for each voter, flip a biased coin (p=0.6) to decide if the signal matches the true state. 
          - Give each voter a card with their signal (A or B). 
          - The team deliberates? We say: no discussion. They vote by show of hands. 
          - Facilitator tallies the votes and records the verdict (majority). 
          - Reveal the true state. 
          - Award a point to the team if correct. 
     - We do this for 5 trials. 
     - Expected: about 3-4 correct per team? 

  20-35 min: Round 2 (The flip) - 15 minutes
     - Competence p=0.45.
     - Within each team of 9: 
          - We will have a small group of 3 and a large group of 6. 
          - For each trial: 
               - Generate true state.
               - Generate signals for all 9 voters (p=0.45).
               - Form the small group (3 voters) and the large group (6 voters). 
               - The small group votes by majority (they can discuss? We say no discussion, vote based on their own signal). 
               - The large group votes by majority. 
               - We then have two verdicts per team per trial: one for the small group and one for the large group. 
          - We do 5 trials. 
     - Expected: the small group should have accuracy around 42.5% (so 2 or 3 out of 5 correct) and the large group around 26% (so 1 or 2 out of 5 correct). 

  35-50 min: Round 3 (Hidden correlation) - 15 minutes
     - Back to 9 voters per team, competence p=0.6 but with correlation. 
     - For each trial: 
          - Generate true state.
          - Generate a source signal: correct with p=0.6.
          - For each voter in the team: 
               - With 0.9 probability, assign the source signal.
               - With 0.1 probability, generate an independent signal (p=0.6). 
          - Give each voter their card. 
          - Team votes by majority. 
          - Reveal true state. 
     - Do 5 trials. 
     - Expected: about 3 correct per team (60%).

  50-65 min: Round 4 (Unequal weight) - 15 minutes
     - Each team of 9: 
          - Designate three voters as experts (they get p=0.8 signals). The other six get p=0.6. 
          - The experts' votes count as 3 votes each. The others count as 1. 
          - For each trial: 
               - Generate true state.
               - Generate signals: for the three experts: p=0.8; for the six: p=0.6, all independent. 
               - Each voter gets their card. 
               - They vote. The facilitator counts: each expert vote counts as 3, each non-expert as 1. Total votes: 3*3 + 6*1 = 15. Majority is 8. 
               - Reveal true state. 
     - Expected: accuracy should be higher than baseline? 

  65-80 min: Asymmetric costs (10 minutes, but we have 15 minutes allocated, so adjust)
     - We take one trial from the baseline (or generate new) with 9 voters, p=0.6 independent.
     - We tell them: "Now, if we convict an innocent (say we say A when it's B), it costs us 10 points. If we acquit a guilty (say B when it's A), it costs 1 point. We want to minimize the expected cost."
     - We do not reveal the true state yet. 
     - We collect the votes. 
     - We then ask: what decision rule should we use? We want them to realize that we need a supermajority to convict. 
     - We can try two rules: 
          Rule 1: simple majority (5 out of 9) to convict (A). 
          Rule 2: 7 out of 9 to convict. 
     - We compute the cost for this trial under both rules. 
     - But one trial is not enough. We can do it as a discussion. 

  80-90 min: Debrief (10 minutes)
     - We use the projector to show a table of the results: for each round, the number of correct verdicts for each team and overall. 
     - We ask: 
          - In round 1, what did you observe? (expected: around 75% correct)
          - In round 2, what happened? (small groups did better than large groups when competence was below 0.5)
          - In round 3, what happened? (group accuracy dropped to 60% even though individually still 60%)
          - In round 4, what happened? (accuracy went up, but was it fair?)
     - We then reveal the assumptions: 
          - The improvement with group size requires two things: 
              1. Each voter is better than a coin toss (p>0.5)
              2. The signals are independent. 
          - When these are broken, the group may not improve or may even do worse. 
     - We also discuss the asymmetric costs: sometimes we need more than majority. 

  Card Generation Recipe:

  We will precompute all trials for all rounds using a spreadsheet. We will have a column for the true state (0 or 1, generated randomly with equal probability). Then for each voter, we generate their signal. 

  For Round 1 and Round 2 and Round 4 (the independent rounds): 
     - For each voter, the signal = true state with probability p, else 1 - true state. 

  For Round 3 (correlated): 
     - First, generate a source signal: matches true state with probability 0.6.
     - Then for each voter, draw a random number: if <0.9, then the voter's signal = source signal; else, generate an independent signal (matches true state with probability 0.6). 

  We need to do this for 5 trials per round, and for each team. 

  To avoid students comparing cards, we instruct: "Do not show your card to anyone. This is your private signal."

  Precomputation: 
     - We need for each round and each trial and each team a set of cards. 
     - We can precompute on a spreadsheet and then write on index cards. 

  For 5 trials, 2 teams, and up to 9 voters per team, that's 5*2*9 = 90 cards. 
  For Round 2, we have 9 voters per team, so 90 cards. 
  But for Round 2, we use the same signals for the small and large group within a team? Yes, the small group is a subset. 

  Prep checklist:
     - Prepare a spreadsheet with the following sheets:
          Round 1: for trial 1 to 5, for team1 and team2: 
              true state (formula: =RANDBETWEEN(0,1))
              for each voter (1 to 9): signal = if(RAND()<0.6, true_state, 1-true_state)
          Round 2: similarly, but p=0.45.
          Round 3: 
              true state
              source signal: =if(RAND()<0.6, true_state, 1-true_state)
