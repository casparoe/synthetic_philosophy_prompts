  ### Collective Decision Making Activity: "The Jury Room"  
  **90-minute session for 18 students**  
  **Focus:** Exposing hidden assumptions of group accuracy (Condorcet jury theorem) without naming it.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total:** 90 minutes  
  **Materials:** Pre-generated cards (see recipe), whiteboard, markers, chips/sweets, bell.  
  **Room Layout:** Move tables into 6 clusters of 3 (for small groups) with a central voting area.  

  | Time  | Activity                                                                 | Key Instructions                                                                                                |
  |-------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Intro (Silent Start)**                                                 | Hand out role cards (juror IDs). No talking. Project: "JURY RULE: Majority wins. Goal: Correct verdict."        |
  | 5-25  | **Round 1: Baseline (15 voters, p=0.6, independent)**                   | Each juror gets a card. Vote via show of hands. Reveal truth. Chips for correct verdicts. 5 trials.             |
  | 25-40 | **Round 2: The Flip (Split: 3v15 voters, p=0.45)**                       | Same as Round 1, but split into groups of 3 and 15. Run parallel trials. Record group accuracy.                 |
  | 40-55 | **Round 3: Hidden Correlation (15 voters, p=0.6, correlated)**          | New cards. Vote. After 5 trials, ask: *"Why did accuracy drop?"* Hint at card-sharing without details.          |
  | 55-70 | **Round 4: Unequal Weight (15 voters: 3 "experts" ×5 votes, p=0.8)**    | 3 jurors get gold cards (heavier weight). Vote weighted (experts = 5 votes). Discuss fairness afterward.        |
  | 70-80 | **Round 5: Asymmetric Costs (Cut if short on time)**                    | New rule: *"Wrong conviction costs 5 chips; wrong acquittal costs 1."* Vote. Did majority rule feel fair?       |
  | 80-90 | **Debrief (Use Projector)**                                              | Show results table. Ask: *"What broke the group?"* Link rounds to assumptions. End with theorem statement.      |

  ---

  ### **Card Generation Recipe**  
  **Goal:** Ensure exact marginal competence (p=0.6) with controlled correlation.  
  **Materials:** 200 blank cards, marker, 10-sided die (or spreadsheet).  

  #### **1. Independent Signals (Rounds 1, 2, 4)**  
  - **True State (T):** Flip coin (50% A/B) per trial.  
  - **Juror Signal:** For each juror, roll die:  
    - **Round 1/4 (p=0.6):** 1-6 = correct signal, 7-10 = wrong signal.  
    - **Round 2 (p=0.45):** 1-4 = correct, 5-10 = wrong.  
    - *Avoid same-card trap:* Shuffle cards between trials.  

  #### **2. Correlated Signals (Round 3)**  
  - **True State (T):** Flip coin (50% A/B).  
  - **Source Signal (S):** Roll die: 1-6 = correct, 7-10 = wrong (p=0.6).  
  - **Juror Signal:** For each juror:  
    - Roll die: 1-9 = copy **S**, 10 = independent draw (roll again: 1-6 = correct, 7-10 = wrong).  
    - *Math check:* Marginal p(correct) = P(copy) × P(S correct) + P(independent) × p = (0.9×0.6) + (0.1×0.6) = 0.6.  
    - *Correlation effect:* Group accuracy ≈ p(S correct) = 0.6 (not 0.75).  

  **Prep (1 hour):**  
  - Precompute 5 trials × 18 jurors = 90 cards using dice/spreadsheet.  
  - Label: `Trial # | Juror # | Signal (A/B)`.  
  - **Correlation stealth:** Color-code Round 3 cards identically (e.g., all green) to subliminally hint at shared source.  

  ---

  ### **Facilitator Script**  
  **Minimal talking. Use bell to start/end activities.**  
  - **Intro (0 min):** *"Jurors, you’ll decide A or B. Your card is your only clue. Majority wins. Win chips for correct verdicts."*  
  - **After Round 1:** *"Record: 15 people, how many got it right?"* (No theory).  
  - **After Round 2:** *"Compare: Did big groups beat small ones? Why?"*  
  - **After Round 3:** *"Accuracy dropped. Why? You still had 60% cards."*  
  - **After Round 4:** *"Experts had heavier votes. Fair? Accurate?"*  
  - **Debrief:** Ask: *"When did ‘more people’ help? When did it hurt? What was invisible?"*  

  ---

  ### **Payoff Scheme**  
  - **Chips:** 1 chip per correct group verdict (team tally).  
  - **Asymmetric Costs (Round 5):** -5 chips for wrong conviction, -1 for wrong acquittal.  
  - **No individual rewards** to prevent meta-gaming.  

  ---

  ### **Debrief: Mapping to Theorem**  
  | Round     | What Happened                          | Broken Assumption                          | Key Insight                                      |
  |-----------|----------------------------------------|--------------------------------------------|-------------------------------------------------|
  | Baseline  | ~75% accuracy (not 100%)              | None (ideal case)                          | More voters help, but not infallibly.           |
  | The Flip  | Big groups worse than small (p<0.5)   | Competence >0.5                            | Below 50%, more voters amplify errors.          |
  | Correlation | Accuracy dropped to ~60%              | Independence of signals                    | Correlation kills diversity; group ≈ 1 person.  |
  | Unequal   | Accuracy up, but unfair               | Equal weight (voter homogeneity)           | Expertise helps, but violates equality.         |
  | Costs     | Majority rule felt unjust             | Symmetric error costs                      | Optimal rules depend on cost asymmetry.         |

  **Final Slide (Projector):**  
  *"Group accuracy needs:  
  1. Each voter >50% accurate.  
  2. Signals independent.  
  Without these, more voters can hurt. Asymptotics require large N."*  

  ---

  ### **Pitfalls & Solutions**  
  1. **Noise drowns effect (small samples):**  
     - **Solution:** Run 5 trials/round. Precompute cards so results align with theory (e.g., Round 1: 3–4/5 correct).  

  2. **Students meta-game or cheat:**  
     - **Solution:** Ban card-trading. If someone calculates p=0.6, say: *"Assume your card is truth. No second-guessing."*  

  3. **Dominating discussants:**  
     - **Solution:** No discussion in voting rounds (cards only). Use silent voting.  

  4. **Time crunch:**  
     - **Solution:** Cut Round 5 (asymmetric costs) or reduce to 3 trials/round.  

  5. **Correlation spotted early:**  
     - **Solution:** Use same-colored cards in Round 3 to *suggest* a link without proof. Reveal post-activity: *"Did anyone sense shared signals?"*  

  ---

  ### **What the Game Cannot Replicate**  
  - **Asymptotics (N→ ∞):** We can’t simulate 1,000 jurors.  
    - **Honest workaround:** Post-activity, show a *single* simulation plot (projector) of accuracy vs. group size (p=0.6). Say: *"With 1,000 independent voters >50% accurate, accuracy →100%. But break independence or competence, and it fails."*  
    - **Why not pool trials?** Pooling masks the per-group effect and feels artificial. A simulation flash is cleaner.  

  ---

  **Final Tip:** Stay strict on time. Use the bell. Students will feel the paradoxes viscerally if you let the data speak.
