  Rules for the baker (instructor):
  - The baker (you) will call the next name from the notebook at irregular intervals (about every 1-2 minutes). 
  - If the person is present and comes forward within 10 seconds, they get a token (a slip of paper that they can exchange for a chocolate bar at the end, or just to show they got served). 
  - If they are not present, you cross their name and write it at the bottom. Then call the next.
  - You also have the discretion to serve someone who is present and waiting (if the notebook system breaks down) but initially you follow the notebook.

  Rules for students:
  - When they enter, they must go to the notebook and write their name (if they are a local, they know to leave and wait elsewhere; if they are a visitor, they might wait near the counter).
  - They can interact with each other: e.g., if a visitor is waiting near the counter and the baker calls a local who isn't there, the visitor might take the opportunity to step in? But the local might come running? 
  - They can let others go ahead, but remember the no-thanking rule for locals.

  ## Activity (40 minutes)
  - The activity runs in real-time for 40 minutes. 
  - The instructor (as baker) stands at the front with a stack of tokens and the notebook. 
  - Start with the first group (4 locals, 2 visitors) entering at time 0. They write their names in the notebook. The locals will leave and sit in the back. The visitors might wait near the counter. 
  - The baker starts calling names every 1-2 minutes. 
  - As more students enter (according to the schedule), they write their names. 
  - Expect conflicts: 
    - Visitors might try to be served when they are present and the named person isn't (but the local might come running and protest). 
    - Visitors might thank when let ahead, and locals might get upset. 
    - When the visitors become the majority (at 10 min: 4 locals, 6 visitors; at 15 min: 4 locals, 8 visitors), they might ignore the notebook and form a physical queue. The baker might then start serving the physical queue? Or stick to the notebook? The baker should initially stick to the notebook, but if the majority ignores it, the baker can switch to serving the physical queue (to reflect the breakdown of the convention). 
  - The tipping point: when visitors are the majority and they start to ignore the notebook. The baker can then decide to follow the physical queue because it's too chaotic otherwise. This will show that the convention has dissolved. 
  - The last group of 4 locals (entering at 20 min) will find that the notebook is no longer used. They might protest. 

  ## Debrief (25 minutes)
  - Bring the class together and ask about their experiences. 
  - Start with: "What happened? What did you notice?"
  - Then: "How did you feel when someone broke the rules?" (both for the notebook and the no-thanking rule)
  - Then: "Why did the notebook system break down? Who is to blame?"
  - Then: "Were the rules the same? Did one feel more important than the other? Why?"
  - Finally, introduce the philosophical concepts: coordination, convention, expectation-dependence, and moral obligations. 
  - Connect to the real question: Do conventions create moral obligations? And do visitors have to follow local ones? 
  - Address the student who says "it's only a game": 
    - You can say: "True, but the feelings you had in the game (e.g., frustration, sense of unfairness) are real. Why did you feel that way? That's what we're examining."

  ## What will go wrong the first time?
  - Students might not understand the rules fully and act out of confusion rather than role.
  - The baker might have trouble managing the calling and the chaos.
  - The no-thanking rule might be under-enforced because students are shy. 
  - The activity might run longer than 40 minutes. 
  - The tipping point might not happen naturally: visitors might not break the system even when they are the majority. The baker might need to nudge by saying, "It seems like many of you are ignoring the notebook, so I'll serve the person at the front of the physical line."

  ## What the game can't reproduce
  - The game might not fully capture the depth of moral obligation that comes from long-standing conventions in real life. 
  - It might be hard to simulate the harmlessness of breaking the no-thanking rule: in the game, the harm is that the local gets offended, but in real life, there might be no visible harm. In the game, the harm is simulated by the local's reaction. 
  - The game might not show that some conventions are arbitrary but still morally binding because of the expectations they set.

  ## Revised Staging of Arrivals (over 20 minutes of the 40-minute activity, then the last 20 minutes with all students but the convention broken):

  Time 0 min: 4 locals, 2 visitors (6 total)
  Time 5 min: 2 visitors (4 locals, 4 visitors -> 8 total)
  Time 10 min: 2 visitors (4 locals, 6 visitors -> 10 total) -> visitors become majority
  Time 15 min: 2 visitors (4 locals, 8 visitors -> 12 total) -> visitors are twice the locals
  Time 20 min: 4 locals (8 locals, 8 visitors -> 16 total) -> but by now, the notebook convention has likely broken.

  ## Tokens and Stakes
  - The baker gives a token to each student when served. 
  - At the end, the first 3 students to get tokens get a chocolate bar (to create a sense of competition and real stakes).

  ## Role Cards

  ### Local Card
  "You are a local from Vell. You know the rules of our town's bakery:
  1. **The Notebook Queue**: The notebook by the door is the official queue. Write your name and then you may leave (e.g., sit in the waiting area). When the baker calls your name, you have 10 seconds to come forward. If you are not present, you are moved to the bottom of the list.
  2. **No Thanking**: Never thank someone for letting you go ahead. Thanking implies that they did you a favor rather than fulfilling their duty. If someone thanks you, it is an insult. You may say nothing, or if you wish, you can politely correct them: 'In Vell, we don't thank for this. It was my duty.'"

  ### Visitor Card
  "You are a visitor to Vell. You've heard about the bakery queue system from a friend, but your friend might have gotten it wrong. Here's what you think:
  1. **The Notebook is a Rough Guide**: The notebook by the door is a rough waiting list. The baker uses it as a suggestion but often serves people who are physically present and waiting. So, if you write your name and leave, you might miss your turn. It's safer to wait near the counter.
  2. (No information about thanking. So you might naturally thank someone if they let you go ahead.)"

  ## Baker Instructions (for Instructor)
  - Start the notebook as an official list.
  - Call names at irregular intervals (every 1-2 minutes). Use a timer to keep track.
  - If the person is present within 10 seconds, give a token and cross their name off.
  - If not, cross off and write the name at the bottom. Then call the next.
  - When the majority (visitors) start ignoring the notebook and form a physical line, after a few calls that go unheeded (because the named person isn't there and the visitors are forming a line), announce: "Given the confusion, I will now serve the person at the front of the physical line." Then switch to the physical line.
  - If there's a conflict, be neutral but consistent.

  ## Debrief Questions
  1. What happened in the bakery? 
  2. How did you feel when someone didn't follow the notebook rule? 
  3. How did you feel when someone thanked you (or was thanked) for letting them go ahead? 
  4. Why did the notebook system break down? 
  5. Could the locals blame the visitors for the breakdown? 
  6. Were the two rules (notebook and no-thanking) the same kind of rule? Did breaking them feel different? Why?
  7. In the end, what made the notebook rule stop working? 
  8. Do you think the visitors had an obligation to follow the local rules? Why or why not?

  ## Handling the "It's Only a Game" Objection
  - Acknowledge that it is a game, but ask: "Why then did you feel frustrated when someone cut in line? Why did you feel offended when someone thanked you? These feelings are real and they mirror how we react in real life to broken conventions. That's what we're examining."

  ## What the Game Can't Reproduce
  - The game might not fully convey that in real life, conventions can create moral obligations that feel weighty even when arbitrary. You'll have to explain that the notebook rule creates expectations that others rely on (so breaking it can harm by disappointing legitimate expectations), while the no-thanking rule might be arbitrary but still create obligations because of the meaning it carries in the social context. The game might also not capture the long-term consequences of breaking conventions (like erosion of trust) beyond the immediate session.

  This should create a lively and revealing session.
answer: |-
  ### **Activity Design: "Vell Bakery Simulation"**  
  **Total Time:** 75 minutes (Setup: 10 min, Activity: 40 min, Debrief: 25 min)  
  **Students:** 16 (8 locals, 8 visitors)  
  **Stakes:** First 3 students to receive a "baked good" (token) get a chocolate bar.  
  **Core Conflict:** Locals believe both rules create binding obligations; visitors misunderstand the notebook rule and are unaware of the no-thanking rule.  

  ---

  ### **Setup (10 Minutes)**  
  1. **Room Prep:**  
     - Place a physical "notebook" (a notepad) and pen near the door.  
     - Designate the front of the room as the "counter" (with you as the baker).  
     - Set up chairs away from the counter as a "waiting area."  

  2. **Student Briefing (Without Philosophy Jargon):**  
     - _"Today, we're simulating daily life in the town of Vell. Your goal is to get a baked good from me, the baker, as efficiently as possible. The first three to succeed get a chocolate bar. Follow the instructions on your secret role cards—they’re based on Vell’s customs. Start when I say 'go.'"_  

  3. **Secret Role Cards (Handed Out Privately):**  
     - **Locals (8 students):**  
       *"You are a LOCAL of Vell. You know two ironclad rules:*  
       1. **Notebook Rule:** The notebook is the official queue. Write your name, then leave (sit in the waiting area). If you aren’t here within 10 seconds when your name is called, you go to the bottom.  
       2. **No-Thanking Rule:** Never thank someone for letting you go ahead. Thanking implies they did you a favor (not their duty) and is INSULTING. If someone thanks you, say: ‘That was owed, not a favor.’"*  

     - **Visitors (8 students):**  
       *"You are a VISITOR to Vell. You’ve heard about the bakery from a friend (who got one rule wrong):*  
       1. **Notebook Rule:** The notebook is a rough waiting list, NOT binding. The baker often skips absent people. **If you leave after signing, you’ll lose your spot.** Stay near the counter to keep your place!  
       2. *(No mention of the no-thanking rule—they’ll learn through conflict.)*"*  

  4. **Staggered Arrivals (Key for Tipping Point):**  
     - **Time 0:** 4 locals + 2 visitors enter.  
     - **+5 min:** 2 more visitors enter.  
     - **+10 min:** 2 more visitors enter (now 4 locals + 6 visitors → visitors become majority).  
     - **+15 min:** 2 more visitors enter (4 locals + 8 visitors).  
     - **+20 min:** Final 4 locals enter (all 16 present).  

  ---

  ### **Activity Rules (40 Minutes)**  
  **Baker’s (Your) Role:**  
  - Call names from the notebook every 2-3 minutes.  
  - If the student is present within 10 seconds, hand them a token (signifying a baked good).  
  - If absent, cross out their name and add it to the bottom.  
  - **Switch to physical queue if chaos erupts** (see "Tipping Point" below).  

  **Student Rules:**  
  - **On entering:** Write your name in the notebook immediately.  
  - **Locals:** Must leave the counter area after signing (sit in waiting area).  
  - **Visitors:** Stay near the counter (per their card).  
  - **Interactions:** Students may let others go ahead (e.g., if someone is absent), but locals MUST enforce no-thanking.  

  **Stakes Reinforcement:**  
  - Announce the first 3 token recipients loudly.  
  - Use physical tokens (e.g., colored paper slips) for psychological weight.  

  ---

  ### **Tipping Point: How Convention Crumbles**  
  - **Trigger:** When visitors become the majority (minute 10: 4 locals vs. 6 visitors).  
  - **How It Unfolds:**  
    1. Visitors cluster near the counter, ignoring the notebook order.  
    2. Locals protest when their names are called but visitors cut ahead ("I was here first!").  
    3. **Key Moment:** When a visitor’s name is called but they’re absent (they stayed near counter), a local isn’t present (they followed the rule), and a visitor jumps in. Chaos erupts.  
  - **Your Intervention:** Announce, *"Since no one is following the notebook, I’ll now serve whoever is physically first in line."*  
    - **Symbolic Act:** Toss the notebook aside. Serve the physical queue for the rest of the activity.  
  - **Blame Dynamics:**  
    - Locals will blame visitors for ignoring rules.  
    - Visitors will blame locals for "unreasonable" expectations.  
    - **Philosophical Hook:** Locals see the dissolution as a moral failure ("You broke our trust!"); visitors see it as practical ("Your system didn’t work!").  

  ---

  ### **Debrief (25 Minutes)**  
  **Guided Discussion (Start Open-Ended, Then Focus):**  
  1. **Experience:** *"What happened? What frustrated or confused you?"*  
     - Expect emotional anecdotes: locals feeling disrespected; visitors feeling judged.  

  2. **Rule Differences:**  
     - *"Did breaking the notebook rule feel different from breaking the no-thanking rule? How?"*  
     - **Target Insight:** Notebook breaches caused tangible chaos (people missing turns); no-thanking breaches caused intangible offense (no "harm" but clear anger).  

  3. **Tipping Point:**  
     - *"When did the notebook system fall apart? Could newcomers be blamed for that?"*  
     - Highlight: Locals saw visitors as obligated to assimilate; visitors saw locals as rigid.  

  4. **The "It’s Just a Game" Student:**  
     - **Response:** *"True—but why did you feel real anger when someone cut ahead? Why did thanking someone feel like a genuine insult? We’re tapping into intuitions about real-world conventions."*  

  5. **Reveal Philosophy:**  
     - Finally name concepts: *"Today explored **conventions**—like the notebook (where planning creates obligations) and no-thanking (arbitrary but binding). Are both morally obligatory? Must visitors comply?"*  

  ---

  ### **Predictable Problems (and Fixes)**  
  1. **Visitors Don’t Break Convention:**  
     - **Risk:** Visitors might comply out of confusion/group pressure.  
     - **Fix:** As baker, call absent visitors’ names to create openings for cutting.  

  2. **Locals Don’t Enforce No-Thanking:**  
     - **Risk:** Shy locals avoid confrontation.  
     - **Fix:** Secretly remind locals during setup: *"If thanked, you MUST say the correction phrase."*  

  3. **Chaos Overwhelms:**  
     - **Risk:** Students talk over each other.  
     - **Fix:** Use a loud timer for name-calling; pause to reset if needed.  

  4. **Time Runs Long:**  
     - **Risk:** Activity exceeds 40 minutes.  
     - **Fix:** Accelerate arrivals (add groups every 4 minutes).  

  ---

  ### **What the Game Can’t Reproduce (Requires Your Input)**  
  **The "Harm" of Intangible Conventions:**  
  - In the game, breaking the no-thanking rule causes visible offense (yelling, discomfort). But in real life, such breaches can feel *obligatory even without harm* (e.g., not thanking feels "wrong" despite no victim).  
  - **Your Explanation Post-Game:**  
    > *"The notebook rule collapsed when expectations were frustrated—that’s the ‘coordination’ part. But the no-thanking rule? Its force came from meaning, not consequences. It felt binding because it defined respect in Vell, even with no ‘harm’ done. That’s the deeper puzzle: Can meaning alone create moral duties?"*  

  **Why This Works:**  
  - Students experience obligation and conflict viscerally before labeling it.  
  - Stakes (chocolate + social pressure) make choices feel consequential.  
  - Tipping point forces debate about blame and dissolution of norms.  
  - Debrief converts raw emotion into philosophical insight.  

  Run this as written, and your seminar will buzz with energy—and a few indignantly muttered "That was owed, not a favor!"
