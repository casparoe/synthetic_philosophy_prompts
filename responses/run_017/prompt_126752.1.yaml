  We are designing a 75-minute session for an intro ethics seminar with 16 students. The goal is to explore whether everyday conventions create real moral obligations and whether a visitor has to follow local ones. We'll use an invented case about the town of Vell with two rules: one about a bakery queue notebook and one about not thanking when let ahead.

