prompt: |-
  I am a philosopher serving on the ethics advisory board of a fertility clinic, and I have been asked to help with a decision the clinic's counselors now make several times a week and say they are unequipped for. For each cycle the lab returns reports on a handful of embryos: polygenic risk scores for common late-onset conditions and, in the larger package, scores for height and for predicted educational attainment. A counselor then has about thirty minutes to help prospective parents decide which embryo to transfer first, which to keep frozen, and which to allow to lapse.

  The clinic's own proposal is a single aggregate welfare score per embryo, ranked. I think that collapses distinctions that matter, and I want something better. Please write a decision procedure a counselor can actually run in those thirty minutes, in the spirit of the principle of procreative beneficence but explicit about what that principle does not settle. I need: the questions in order, and what counts as a sufficient answer to each; how the procedure handles the fact that the choice is conditional on a fixed set of embryos, so that no available option leaves a resulting person worse off than they would otherwise have been and harm-based objections therefore run out, with the procedure saying this plainly rather than smuggling harm back in; a rule for traits whose expected benefit exists only because other people will discriminate in the child's favour, which I take to differ in kind from selecting against a disease, and I want to know whether your procedure can genuinely tell the difference or only mimic telling it; guidance on the two-embryo transfer case, whether to take the two highest-ranked or to hedge; and the stopping points at which the counselor must hand the decision to the couple or to the medical director because it is a question of values rather than of fact.

  Then run the procedure on three cases: an embryo with elevated type 2 diabetes risk against one with a substantially lower chance of implanting; a request to select in favour of a socially rewarded trait that carries no health benefit; and a couple who want every embryo excluded that carries a variant for an untreatable condition which would not affect the person's life until after their fifties. Include at least one case in which the procedure returns an answer I will dislike.

  Two constraints: the scores were trained largely on European-ancestry samples and predict little for anyone else, and the counselors have biology training but no philosophy, so any distinction you ask them to draw must be one someone could draw who could not defend it. Close by telling me how confident you are in the procedure as a whole and singling out the one step you are least confident about.
reasoning: |-
  We are designing a decision procedure for embryo selection that respects the following constraints:
   - Time: about 30 minutes per session.
   - Counselors have biology training but no philosophy; distinctions must be simple.
   - The procedure must avoid collapsing important distinctions into a single score.
   - The choice is conditional on a fixed set of embryos: no harm-based objections because any embryo selected will have a life that is worth living (compared to non-existence) and the alternative is non-existence or being frozen indefinitely (which we assume is not a harm in the same sense as causing a life of suffering).
   - We must address traits that are socially rewarded due to discrimination and distinguish them from health benefits.
   - We must handle the two-embryo transfer case.
   - We must identify stopping points where the decision is handed to the couple (values) or to the medical director (policy).

   The procedure will be step-by-step, with questions and sufficient answers.

   **Decision Procedure**

   **Step 1: Health Risks Screening**
     - **Question 1:** For each embryo, are there any conditions that would cause severe impairment, significant suffering, or substantially reduced lifespan that cannot be mitigated by current or foreseeable medical interventions? (Focus on conditions that would affect the person in childhood or early adulthood, before they could make their own reproductive decisions.)
     - **Sufficient answer:** 
          - If an embryo has a condition that meets the above criteria (e.g., a serious monogenic disorder with early onset and no cure), then flag that embryo as having a "serious health condition". The counselor must note this and proceed to Step 2.
          - If no embryo has such a condition, proceed to Step 3.

     *Rationale: This step addresses the most severe health risks. The clinic may have a policy on what conditions are considered "serious". The counselor uses medical knowledge and the clinic's guidelines.*

   **Step 2: Serious Health Condition Evaluation**
     - **Question 2:** Are there any embryos that do not have a serious health condition (as defined in Step 1)?
     - **Sufficient answer:**
          - If yes, then the counselor should recommend against transferring any embryo with a serious health condition. These embryos may be considered for donation to research (if allowed) or allowed to lapse. The remaining embryos (without serious conditions) proceed to Step 3.
          - If all embryos have a serious health condition, then the counselor must inform the couple that all embryos carry a serious health risk. The decision then becomes a values-based decision for the couple, and the counselor must hand the decision to them. The counselor should explain the risks and then let the couple choose which condition they feel most prepared to manage.

     *Rationale: This step ensures that we avoid the most severe harms. Since the embryos exist, the choice is between lives with serious conditions and non-existence. The couple must decide which condition they can accept.*

   **Step 3: Non-Serious Health Conditions and Social Traits**
     - **Question 3:** Are there any non-health traits (like height or educational attainment) that the couple has expressed a preference for? And are there any embryos with elevated polygenic risk for non-serious, late-onset conditions (like type 2 diabetes, which typically manifests in adulthood and can be managed)?
     - **Sufficient answer:**
          - The counselor should list the traits for which there are scores and ask the couple if they have any strong preferences (e.g., "Do you care about the child being taller or having a higher chance of educational success?"). 
          - The counselor must then explain the following distinction:
              a. **Health-related traits (even late-onset):** These are conditions that directly affect the individual's physical or mental health and well-being (e.g., type 2 diabetes, heart disease). Reducing the risk of these conditions is generally considered a health benefit.
              b. **Socially rewarded traits (non-health):** These are traits that may lead to better outcomes mainly because of societal discrimination or bias (e.g., height in certain professions, educational attainment in a society that rewards diplomas). The counselor should note that selecting for these traits might be seen as perpetuating unfair social advantages and that the clinic does not endorse such discrimination.

     - **Procedure for handling:**
          - For health-related risks (even late-onset), the counselor should rank the embryos by lower risk (i.e., lower risk is better). But note: if the condition is late-onset and manageable, the risk score is only one factor.
          - For non-health traits, the counselor should not use them to rank embryos unless the couple explicitly expresses a preference. However, the counselor must explain that the clinic's policy is to not promote selection based on non-health traits that are socially rewarded due to discrimination. If the couple still wants to use a non-health trait, the counselor must hand the decision to the medical director for approval (since this may violate clinic policy or ethical guidelines).

     *Rationale: We are trying to separate health benefits from social advantages. The counselor can explain the difference without needing philosophical training: "This trait (e.g., height) isn't about health; it's about how society treats people. We don't encourage selection for that because it might be unfair."*

   **Step 4: Balancing Multiple Factors**
     - **Question 4:** For the remaining embryos (without serious health conditions), what are the most significant differences in predicted outcomes? 
     - **Procedure:**
          - The counselor should create a simple table for the couple, showing:
              - Embryo ID
              - Risk for serious health conditions (if any passed Step 2, they are already excluded; otherwise, note none)
              - Risk for non-serious, late-onset health conditions (e.g., type 2 diabetes, heart disease) - lower is better.
              - Non-health traits (if the couple expressed a preference and the medical director approved, or if the clinic allows for non-health traits that are not socially problematic) - but note: the procedure discourages using non-health traits unless they are clearly not tied to discrimination.
          - The counselor should then ask the couple: "Which health risks worry you the most? Are you more concerned about a condition that might occur in the child's 40s or 50s, or are you more concerned about the chance of the embryo implanting and leading to a live birth?"

          - **Implantation and Pregnancy Success:** The clinic also has data on the chance of implantation and successful pregnancy for each embryo. This is a crucial factor because transferring an embryo with a low chance of implantation might result in a failed cycle. The counselor should factor in:
              - If an embryo has a substantially lower chance of implanting, that might outweigh a moderate increase in a late-onset health risk.

     - **Rule:** 
          - The counselor should recommend transferring the embryo with the best balance of:
              a. High chance of implantation and live birth (most important for achieving a pregnancy).
              b. Low risk of serious health conditions (already addressed in Steps 1-2).
              c. Low risk of non-serious but significant late-onset health conditions.
          - The counselor should avoid creating a single aggregate score. Instead, present the trade-offs and let the couple decide. However, if the couple is unsure, the counselor can suggest:
              "Given that the goal is to have a healthy child, we might prioritize the embryo with the highest chance of implantation and the lowest risk of health problems. But you might feel differently about the balance."

          - **Handling non-health traits:** If the couple insists on considering a non-health trait (and the medical director has approved), then the counselor can add a column for that trait. But the counselor should remind the couple that the trait is not a health benefit and that the clinic does not endorse selection for such traits.

   **Step 5: Two-Embryo Transfer Case**
     - **Question 5:** Is the couple considering transferring two embryos?
     - **Procedure:**
          - The counselor should explain that transferring two embryos increases the chance of pregnancy but also the chance of twins, which carries higher risks for the mother and the babies.
          - If the clinic and the couple have decided on two-embryo transfer, then the counselor should:
              a. First, identify the top-ranked embryo by the criteria above (high implantation chance and low health risks).
              b. Then, for the second embryo, consider whether there is an embryo that has a similarly high implantation chance but that might have a different risk profile (to hedge against the uncertainty of the predictions). For example, if the top embryo has a moderate risk for condition X, but the next best has a moderate risk for condition Y, and condition X and Y are not correlated, then transferring both might be considered. However, the couple should be aware that if both implant, they may have twins with different risk profiles.
          - **Hedging rule:** It is generally not advisable to transfer an embryo with a significantly lower chance of implantation just for the sake of hedging on health risks. The primary goal of two-embryo transfer is to increase the chance of pregnancy. Therefore, the counselor should recommend the two embryos with the highest chance of implantation and the lowest health risks, unless there is a very strong reason (like a serious health risk in the top embryo that is not present in the next) to do otherwise.

   **Stopping Points:**
     - **Hand to couple:** 
          - When choosing between embryos that have different non-serious health risks (e.g., one has a higher risk of diabetes, another of hypertension) and the couple must express their personal tolerance for these risks.
          - When all embryos have serious health conditions (Step 2).
          - When the couple wants to select for a non-health trait (after the medical director has approved or set conditions, the couple must decide the weight).
     - **Hand to medical director:**
          - When the couple requests selection based on a non-health trait that is socially rewarded due to discrimination (Step 3). The medical director will decide if the clinic allows it.
          - If there is uncertainty about whether a condition is "serious" (Step 1) or about the reliability of the scores (especially for non-European ancestry, see constraint).

   **Handling Non-European Ancestry Constraint:**
     - The counselor must inform the couple: "The polygenic scores were developed primarily from data on people of European ancestry. If you are not of European ancestry, these scores may be less accurate or even misleading. Therefore, we should put less weight on these scores in that case." 
     - In practice, for non-European ancestry, the counselor should rely more on the implantation potential and any monogenic tests (if available) and less on the polygenic scores.

   **Running the Procedure on Three Cases**

   **Case 1: Elevated type 2 diabetes risk vs. substantially lower chance of implanting**
     - Embryo A: Elevated risk of type 2 diabetes (late-onset, manageable) but high implantation chance.
     - Embryo B: Lower risk of type 2 diabetes but substantially lower chance of implanting.

     - Step 1: Neither embryo has a serious health condition (early-onset, severe impairment). So proceed.
     - Step 2: Not applicable.
     - Step 3: The trait in question is a health-related trait (type 2 diabetes). The counselor explains that lower risk is better for health. But we also have implantation chance.
     - Step 4: The counselor presents:
          - Embryo A: High implantation, elevated diabetes risk.
          - Embryo B: Low implantation, lower diabetes risk.
     - The counselor explains: "Embryo A has a much better chance of leading to a pregnancy, but if successful, the child might have a higher risk of developing type 2 diabetes in adulthood. Embryo B has a lower chance of pregnancy, but if successful, the child would have a lower risk of diabetes. However, if Embryo B doesn't implant, you may have to try another cycle, which might involve transferring a different embryo or doing another retrieval."

     - The counselor then asks: "Which is more important to you: maximizing the chance of having a child now, or minimizing the risk of a health condition that might occur decades from now?"

     - **Recommendation:** The counselor does not make the decision but presents the trade-off. However, given that the goal is to have a child, and because diabetes is manageable and late-onset, the counselor might suggest that the higher implantation chance is more critical. But if the couple is very concerned about diabetes, they might choose Embryo B.

     - **Procedure outcome:** The couple decides.

   **Case 2: Request to select in favour of a socially rewarded trait (e.g., height) that carries no health benefit**
     - The couple wants to select the embryo with the highest predicted height.

     - Step 1: Assume no serious health conditions.
     - Step 3: The counselor explains: "Height is not a health trait. Any advantage from being taller would come from how society treats taller people, and we don't encourage selection for such traits because it might be unfair and could reinforce discrimination. If you still wish to consider height, I must refer this to the medical director."

     - The counselor then hands the decision to the medical director. The medical director may either:
          a. Approve the request (if the clinic's policy allows, though the procedure discourages it).
          b. Deny the request and instruct the counselor to proceed without considering height.

     - If approved, then in Step 4, the counselor would include height as a factor. But note: the procedure requires the medical director's approval.

     - **Procedure outcome:** Without approval, the counselor does not consider height. With approval, the couple can decide to choose the embryo with the highest height score.

   **Case 3: Couple wants every embryo excluded that carries a variant for an untreatable condition which would not affect the person's life until after their fifties**
     - Example: Huntington's disease (though typically earlier onset, but let's consider a condition with late-onset after 50).

     - Step 1: The counselor must determine if the condition is a "serious health condition" (as defined: severe impairment, significant suffering, reduced lifespan). 
          - The condition is untreatable and would cause suffering and reduced lifespan, but it would not affect the person until after 50. The person would have a normal life until then and could have children. 
          - The clinic's policy must define if such late-onset conditions are considered "serious" in the context of embryo selection. The counselor might not be able to decide and may need to involve the medical director.

     - Step 2: If the medical director rules that it is a serious health condition, then the counselor would recommend against transferring any embryo with the condition. Then, if there are embryos without the condition, they would be transferred. If all embryos have the condition, then the couple must decide.

     - **But note:** The couple wants to exclude every embryo with the variant. The counselor must check if there are embryos without the variant. If yes, then the procedure in Step 2 would lead to transferring one of those. However, if the clinic does not consider it a serious condition (because it is late-onset and the person would have decades of healthy life), then the counselor would proceed to Step 3 and treat it as a non-serious but late-onset condition. Then the couple could choose to avoid it based on their values.

     - **Procedure outcome:** This case might require a policy decision by the clinic. The counselor should hand the question of whether the condition is "serious" to the medical director. Once that is decided, the procedure continues accordingly.

     - **An answer you might dislike:** The clinic might decide that a condition with onset after 50 is not "serious" in the context of embryo selection because the person would have a full life until then and because the alternative is non-existence. Therefore, the counselor would not exclude the embryo in Step 1 or 2. Then, in Step 4, the couple could still choose to avoid the embryo with the condition because of their values (handed to them).

   **Confidence in the Procedure**

   - **Overall confidence:** Moderately confident. The procedure addresses the main concerns and provides a structured way to make decisions without aggregating everything into a single score. It emphasizes health over non-health traits and implantation potential, which are critical.

   - **Least confident step:** Step 3 and the handling of non-health traits. The distinction between a health benefit and a socially rewarded trait might be clear in theory (e.g., height vs. diabetes) but sometimes blurry in practice (e.g., mental health conditions that are influenced by societal treatment). Also, the counselor's ability to explain why the clinic does not endorse non-health traits without philosophical training is challenging. We rely on the counselor to say "this trait is about how society treats people, not about health" and then hand the decision to the medical director if the couple insists. This step might be difficult to implement in 30 minutes and might lead to uncomfortable conversations.

  However, the procedure is designed to be practical and to respect the couple's autonomy while upholding the clinic's ethical standards.
answer: |-
  ### Decision Procedure for Embryo Selection

  **Overview**: This procedure prioritizes health-based selection while avoiding a single aggregate score. It distinguishes between health risks and socially rewarded traits, acknowledges the fixed-set context (no harm-based objections apply), provides guidance for two-embryo transfers, and flags value-laden decisions for the couple or medical director. Counselors can execute it in ~30 minutes using simple distinctions.

  ---

  ### Step-by-Step Procedure  
  **Key Principles**:  
  1. **No harm comparison**: All embryos would have lives worth living; selection only changes who exists.  
  2. **Health-first**: Prioritize reducing disease burden over non-health traits.  
  3. **Social reward distinction**: Traits valued solely due to discrimination are treated differently.  

  **Steps**:  
  1. **Screen for serious health conditions (5 minutes)**  
     - **Question**: "Does any embryo carry a high-risk variant for a condition causing severe impairment, major suffering, or early death (before age 40) that is untreatable?"  
     - **Sufficient answer**:  
       - **Yes**: Exclude affected embryos unless *all* embryos are affected. If all are affected, hand decision to couple (values).  
       - **No**: Proceed to Step 2.  
     - **Counselor script**: "We exclude embryos only if a condition would prevent a minimally flourishing life. Since all embryos would have such a life, we don’t compare ‘harm’—we’re choosing who exists."  

  2. **Assess late-onset health risks (5 minutes)**  
     - **Question**: "Do any embryos have significantly elevated polygenic risk for late-onset conditions (e.g., Alzheimer’s, diabetes)?"  
     - **Sufficient answer**:  
       - Rank embryos by *lowest cumulative risk* for major late-onset diseases (use clinic-defined thresholds).  
       - If differences are marginal (<10% absolute risk difference), treat as equivalent.  
     - **Counselor script**: "We prioritize healthspan. For example, lower diabetes risk means more years of good health."  

  3. **Address non-health traits & social rewards (7 minutes)**  
     - **Question**: "Do you want to consider non-health traits (e.g., height, educational attainment)?"  
     - **Sufficient answer**:  
       - If parents decline, skip to Step 4.  
       - If parents request:  
         - **Counselor distinction**: "Is this trait advantageous primarily because of societal discrimination? For example, height might lead to higher earnings due to bias, not health. Selecting for it may reinforce unfairness."  
         - **Procedure**:  
           - Traits with direct health benefits (e.g., IQ linked to avoiding dementia) are allowed in risk calculation.  
           - Purely socially rewarded traits (e.g., height) require medical director approval. If denied, exclude them. If approved, add to Step 4.  
     - **Distinction test**: *"Would this trait still benefit the child in a discrimination-free society?"* If no, it’s a social reward trait.  

  4. **Evaluate implantation potential & trade-offs (8 minutes)**  
     - **Question**: "Which embryos have high implantation potential, and are there trade-offs with health risks?"  
     - **Sufficient answer**:  
       - Rank embryos by implantation likelihood (highest first).  
       - Compare with Step 2 rankings:  
         - If health risks and implantation likelihood align, recommend top embryo.  
         - If conflict (e.g., high-implantation embryo has higher disease risk), hand decision to couple with trade-off explained.  

  5. **Two-embryo transfer rule (3 minutes)**  
     - **Rule**: Transfer the two highest-ranked embryos by implantation likelihood *only if* health risks are similar (<15% absolute difference in major disease risk).  
     - **Exception**: If one embryo has high risk for a condition and the other low, transfer the low-risk embryo alone to avoid twin pregnancy risks.  

  6. **Stopping points for values/policy (remaining time)**  
     - **Hand to couple when**:  
       - Trade-offs between late-onset diseases (e.g., diabetes vs. heart disease).  
       - Choosing between implantation likelihood and non-serious health risks.  
     - **Hand to medical director when**:  
       - Disagreement on whether a condition is "serious" (Step 1).  
       - Request to select for socially rewarded traits (Step 3).  
       - Non-European ancestry (scores unreliable; require director’s input on usability).  

  ---

  ### Case Applications  
  **Case 1: Elevated diabetes risk vs. lower implantation chance**  
  - **Embryo A**: High type 2 diabetes risk (25% vs. population 10%), high implantation chance (80%).  
  - **Embryo B**: Low diabetes risk (8%), low implantation chance (40%).  
  - **Procedure**:  
    1. Step 1: No serious conditions → Proceed.  
    2. Step 2: Embryo B has lower diabetes risk.  
    3. Step 4: Conflict: Embryo A has better implantation; Embryo B has better health.  
    4. **Hand to couple**: "Embryo A is more likely to result in a pregnancy, but Embryo B has lower diabetes risk. Which matters more to you?"  
  - **Outcome**: No forced ranking; couple decides trade-off.  

  **Case 2: Request to select for height (socially rewarded trait)**  
  - **Request**: Couple wants to select the tallest embryo.  
  - **Procedure**:  
    1. Step 3: Counselor explains: "Height’s benefits exist due to societal bias, not health. We must involve the medical director."  
    2. **Medical director assesses**: If height is purely a social reward (no health link), director denies request. Counselor proceeds without height scores.  
    3. If director approves (unlikely), include height in Step 4.  
  - **Distinction test**: "In a fair society, height wouldn’t affect earnings → social reward trait."  
  - **Outcome**: Procedure blocks social trait selection unless overridden.  

  **Case 3: Exclude embryos with untreatable late-onset condition**  
  - **Condition**: Prion disease (onset post-50, fatal, untreatable).  
  - **Couple**: Wants to exclude all embryos with elevated risk.  
  - **Procedure**:  
    1. Step 1: Counselor asks: "Does this cause severe pre-40 impairment?" Since no, it fails "serious" threshold.  
    2. **Hand to medical director**: "Condition is late-onset but untreatable. Does it meet our ‘serious’ definition?"  
     - *Director rules*: If yes, exclude affected embryos. If no, proceed to Step 2.  
    3. Step 2: Rank by risk level; couple may still avoid high-risk embryos.  
  - **Answer you may dislike**: If director rules it "non-serious," counselor cannot exclude embryos. Couple may choose lower-risk embryos in Step 4 but must accept trade-offs (e.g., lower implantation chance).  
  - **Why**: Condition does not preclude a minimally flourishing life; excluding embryos violates the fixed-set principle (no harm comparison).  

  ---

  ### Confidence Assessment  
  - **Overall confidence**: **High** for structure and ethics; **moderate** for time efficiency.  
    - Strengths: Distinguishes health/discrimination, avoids aggregation, upholds fixed-set principle.  
  - **Least confident step**: **Step 3 (social reward distinction)**.  
    - Why: Counselors may struggle with nuanced societal bias explanations (e.g., "educational attainment" mixes health and bias). Risk of oversimplifying.  
    - Mitigation: Scripted language and mandatory director review reduce error.  

  **Final Script Snippet for Counselors**:  
  > "Remember: We’re choosing which child will exist, not harming anyone. Health risks matter most; societal advantages are ethically different. When in doubt, ask: ‘Is this about the body or society?’ and involve your director."
