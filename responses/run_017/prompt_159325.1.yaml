answer: |-
  Below is a step-by-step procedure for your council to choose and stress-test a voting rule, grounded in social choice theory but adapted for practical volunteer use. It explicitly addresses the inevitability of manipulability (per Gibbard-Satterthwaite) and separates theoretical vulnerabilities from practical risks. The procedure is designed for a single afternoon with a spreadsheet, no software, and no prior knowledge of voter preferences. It highlights where assumptions are being surrendered and when decisions revert to the council's values.

  ---

  ### **Procedure for Choosing and Stress-Testing a Voting Rule**
  **Key Principles**:  
  - **No rule is perfect**: All rules are manipulable in principle with ≥3 options.  
  - **Trade-offs are explicit**: Each step forces acknowledgment of what’s being sacrificed (e.g., fairness, simplicity, resistance to gaming).  
  - **Practical > Theoretical**: Focus on whether manipulation is *likely in your context* (simultaneous email voting with public ballots).  
  - **Stopping Rules**: Proceed to the next step only if the current question is resolved. If consensus fails, revert to council for values-based debate.

  #### **Step 1: Define the Decision Type**  
    - **Question**: *Are options naturally ordered on a single dimension (e.g., geography, cost, ideology)?*  
      - **Adequate Answer**: Yes (e.g., AGM venues on a map) → Proceed to Step 2.  
        No (e.g., unrelated grant causes) → Skip to Step 3.  
        Unsure → Use past ballot data or member surveys to check for correlations (e.g., if voters who prefer Site A always prefer Site B second).  
      - **Stop/Handoff**: If disagreement persists after data review → **Handoff to Council**. Values call: Is imposing a dimension (e.g., "conservation impact") acceptable?  
      - **Trade-off**: Surrenders multi-dimensional fairness for simplicity/game-resistance.  

  #### **Step 2: Test for Single-Peaked Preferences (For 1D Decisions)**  
    - **Question**: *Do members’ preferences decrease as options move away from their ideal point?*  
      - **Adequate Answer**:  
        - Yes → Adopt **Median Voter Rule** (e.g., voters report ideal location; venue nearest median wins). Resistant to gaming if preferences are truly single-peaked.  
        - No → Proceed to Step 3.  
      - **Stress Test**: Simulate with spreadsheet:  
        1. Assume 40 hypothetical voters with random ideal points along the dimension.  
        2. Test if any voter gains by misreporting their ideal point (e.g., a left-leaning voter claims to be centrist).  
        3. **Practical Check**: With no prior vote knowledge, can voters guess the median? If not, manipulation is unlikely.  
      - **Stop/Handoff**: If preferences aren’t single-peaked → **Handoff to Council**. Values call: Force single-peakedness by removing "outlier" options?  

  #### **Step 3: Can the Decision Be Split?**  
    - **Question**: *Can this choice be broken into smaller independent decisions?*  
      - **Adequate Answer**:  
        - Yes (e.g., split grant budget across causes) → Use **Separate Votes** (e.g., members approve/reject each cause; funds allocated proportionally).  
        - No (e.g., must pick one AGM venue) → Proceed to Step 4.  
      - **Stress Test**:  
        - Simulate "splitting" via spreadsheet: Allocate points to options (e.g., 100 points split among 3 causes).  
        - Check if any voter benefits by skewing points (e.g., assigning 100 to one cause).  
        - **Practical Check**: With simultaneous voting, can voters coordinate? If not, manipulation is hard.  
      - **Trade-off**: Surrenders option interdependence (e.g., "either A or B, but not both") for reduced gaming.  

  #### **Step 4: Select a Voting Rule for Multi-Dimensional Choices**  
    - **Question**: *What matters most: Simplicity, Condorcet efficiency, or minimizing ties?*  
      - **Adequate Answer**:  
        - Simplicity → **Approval Voting** (vote for all acceptable options; most approvals wins).  
        - Condorcet efficiency → **Copeland’s Method** (count pairwise wins; option with most wins prevails).  
        - Minimize ties → **Borda Count** (rank options; assign points: top=3, middle=2, bottom=1).  
      - **Stress Test**:  
        1. Use past ballots (if available) or mock data to compare outcomes under different rules.  
        2. For each rule, test if a minority (e.g., 10/40 voters) can swing results by voting strategically.  
        3. **Practical Check**: With no vote knowledge, can voters guess the "pivotal" option to manipulate? If not, risk is low.  
      - **Stop/Handoff**: If all rules show high manipulation risk → **Handoff to Council**. Values call: Accept randomness (e.g., **lottery**) or hierarchy (e.g., **two-round voting**)?  

  #### **Step 5: Final Practical Check**  
    - **Question**: *Could a voter realistically game this rule without knowing others’ votes?*  
      - **Adequate Answer**:  
        - Simulate "ignorant manipulation" in spreadsheet:  
          - Assume voters know only their own preferences, not others’.  
          - Let one voter misreport preferences (e.g., reverse rankings).  
          - Did the outcome change? If rarely → Rule is robust *in your context*.  
        - If ballots are public *after* voting, manipulation is retrospective (future-focused) → Low immediate risk.  
      - **Stop/Handoff**: If manipulation is easy even with ignorance → **Handoff to Council** to revisit Steps 1–4 or accept vulnerability.  

  ---

  ### **Application to Your Three Decisions**
  **Assumption**: Council size = 40, options = 3, votes via email (no prior knowledge).

  #### **1. AGM Venue (Geographic, 1D)**  
    - **Step 1**: Options on a map → **Single dimension likely** (proximity to homes).  
    - **Step 2**: Preferences are **single-peaked** (voters prefer venues near them).  
      - **Rule**: **Median Voter Rule**.  
        - How: Members report nearest venue to home. Order venues geographically; median response wins.  
      - **Stress Test**:  
        - Theoretical: Strategy-proof if truly single-peaked.  
        - Practical: Voters can’t guess median → Low manipulation risk.  
      - **Trade-off**: Explicitly assumes geography is the only dimension (e.g., ignores venue cost).  

  #### **2. Splitting Grant Budget (Multi-Dimensional)**  
    - **Step 1**: Causes unrelated → **No single dimension**.  
    - **Step 3**: Decision can be split → **Separate Votes + Proportional Allocation**.  
      - **Rule**: Each member allocates 100 points across causes. Average points determine funding shares.  
      - **Stress Test**:  
        - Theoretical: Manipulable (e.g., assign all points to one cause to boost it).  
        - Practical: With no coordination, exaggeration cancels out → Low risk.  
      - **Trade-off**: Surrenders "all-or-nothing" impact for compromise.  

  #### **3. Research Grant (Two-Round System)**  
    - **Step 1**: Proposals multi-dimensional → **No natural ordering**.  
    - **Step 3**: Can’t split (single winner) → **Proceed to Step 4**.  
    - **Step 4**: Prioritize simplicity → **Replace two-round with Approval Voting**.  
      - **Rule**: **Approval Voting** in one round (vote for all acceptable shortlist candidates; most approvals wins).  
      - **Stress Test**:  
        - Theoretical: Vulnerable to "burying" (not approving a viable candidate to help another).  
        - Practical: With no vote knowledge, hard to identify who to bury → Safer than two-round.  
      - **Why not two-round?**  
        - Two-round systems **increase** manipulation (e.g., "compromising" in Round 1 to block a rival).  
        - Your fondness for it is understandable (feels thorough), but it’s **more manipulable** than Approval.  
      - **Trade-off**: Loses granularity of rankings for simplicity and reduced gaming.  

  ---

  ### **What the Procedure Cannot Tell You**  
  1. **Voter Honesty**: It assumes voters *try* to game rules if they can. Real-world altruism may reduce this.  
  2. **Coalition Risks**: Doesn’t model coordinated groups (e.g., 10 members colluding) → Depends on trust.  
  3. **Long-Term Effects**: Rules may change member behavior (e.g., Approval Voting encourages compromise candidates).  
  4. **Fairness ≠ Legitimacy**: A robust rule may still feel unfair to losers (e.g., median venue alienates coasts).  
  5. **Randomness**: Lotteries are strategy-proof but may violate "earned" legitimacy.  

  ### **Where the Real Work Happens**  
  **Step 1 (Defining the Decision Type) does 80% of the work**. Success hinges on accurately characterizing voter preferences—*not* theoretical wizardry. If you misjudge the structure (e.g., assuming single-peakedness where none exists), the rule will fail. Stress-testing with mock data (Steps 2–5) is crucial, but it’s secondary to understanding your members’ incentives.  

  ### **Final Recommendation**  
  - **AGM Venue**: Use **Median Voter Rule**. Simple, robust, and tailored to geography.  
  - **Grant Split**: Use **Proportional Approval**. Embraces compromise with low gaming risk.  
  - **Research Grant**: Switch to **Approval Voting**. Drops two-round complexity while reducing manipulation.  

  **Reality Check**: No rule "solves" gaming—your goal is to make manipulation *hard in practice*. With simultaneous email voting, even theoretically flawed rules can perform well because voters lack information to exploit vulnerabilities. Document trade-offs transparently (e.g., "We sacrificed interdependence for reduced gaming"), and revisit rules if voter behavior changes.  

  This procedure gives you a defensible, transparent method—not a guarantee. The rest is up to your council’s values and pragmatism.
