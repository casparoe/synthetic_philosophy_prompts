     - Values Call: Deciding whether to split the decision is a values call. The council must decide if they are comfortable with a compromise (like splitting the grant) or if they must choose one option (like one venue for the AGM).

  **Step 4: Choosing a Voting Rule for Multi-Dimensional, Non-Splittable Decisions**
     - Question: What properties are most important to the council? (e.g., Condorcet efficiency, simplicity, resistance to manipulation in practice, etc.)
     - Adequate Answer: The council must prioritize one or two properties. Without a clear priority, we default to simplicity and use a rule like plurality or approval voting. But note: we must be honest that no rule is non-manipulable in principle.
     - Values Call: The choice of properties is a values call.

  **Step 5: Stress-Testing the Rule (for a specific decision)**
     - We consider two types of manipulation:
          a) Manipulation in principle: Does the rule satisfy non-manipulability? (We know by Gibbard-Satterthwaite that for 3+ options and non-dictatorial rules, the answer is no.) So we must accept that in principle it can be manipulated, but we can look for rules that are hard to manipulate in practice under the given constraints.
