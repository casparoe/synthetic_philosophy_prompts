  We are given a real-world problem from a retired marine biologist who is now part of a small conservation trust. The trust faces issues with voting on various matters and is aware of the Gibbard-Satterthwaite theorem, which states that for three or more options, no voting rule is strategy-proof (i.e., non-manipulable) unless it is dictatorial. The goal is to design a procedure for choosing and stress-testing a voting rule that acknowledges the inevitability of manipulability but seeks a practical solution under the given constraints.

  Constraints:
  - Doable by volunteers in an afternoon with a spreadsheet, no software and no consultants.
  - Works when members vote by email all at once and ballots are visible to the whole council afterwards (so voters do not know others' votes when they vote, but afterwards everything is public).
  - Must be honest about which assumption is being given up when making a trade-off (e.g., reducing dimensions, using money, lotteries, splitting decisions, etc.).
  - Must separate the question of "can this rule be gamed in principle" from "will it be gamed by people who don't know how anyone else is voting".

  The procedure should be a step-by-step process with specific questions, what counts as an adequate answer, when to stop with a "no", and when to hand the decision back as a values call.

  Then, we are to run the procedure on three recurring votes:
  1. Picking the AGM venue: options are on a map (spatial dimension).
  2. Splitting the grants budget between three unrelated causes (no clear dimension).
  3. The two-round system for the research grant (shortlist then winner).

  Finally, we must indicate what the procedure cannot tell, where it is silent, and where it might give a false sense of security. Also, we must plainly state which step is doing the real work.

  ### Proposed Procedure for Choosing and Stress-Testing a Voting Rule

  The procedure is designed as a decision tree with questions. We assume the voting rule will be used for a single decision at a time (unless we consider splitting decisions). The procedure must consider the nature of the options and the preferences.

  **Step 1: Identify the Nature of the Decision and Options**
     - Question: Are the options naturally ordered along a single dimension (like left-right political spectrum, or geographical location) or are they multi-dimensional?
     - Adequate Answer: If the options can be reasonably placed on a single dimension (e.g., AGM venues on a map along a line) then we can consider rules that exploit this (like single-peaked preferences). If not, then we must consider rules that do not require such structure (like scoring rules or Condorcet methods).
     - If the answer is "single dimension", go to Step 2. If "multi-dimensional", go to Step 3.
     - Values Call: If there is disagreement on whether the options are single-dimensional, then it's a values call and the council must decide by discussion.

  **Step 2: Single-Dimensional Options**
     - Question: Can we reasonably assume that each voter has a single-peaked preference? (That is, each voter has an ideal point on the line, and preferences decrease as we move away in either direction.)
