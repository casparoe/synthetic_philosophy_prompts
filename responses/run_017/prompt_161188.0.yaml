prompt: |-
  I write about science and ideas for a newspaper, and I am finishing a column on long-run forecasts of catastrophe — the kind that name a mechanism, a quantity and a date, and then outlive their own deadline. Over two years of collecting these I have hit a pattern I cannot label properly. I need a concept rather than a slogan, because I intend to use it in print and the forecasters I write about will read it and will tell me I have got it wrong.

  Here is the shape of it as I keep meeting it. Malthus's old essay argued that population, left unchecked, grows far faster than the food supply, and that famine would therefore check it before very long. In the country where he wrote, that did not happen; food production rose faster than population for a long stretch afterwards. When I put this to people who still take the essay seriously, the reply is always that the mechanism was right and only the date was wrong: the reprieve was bought by a one-off burst of agricultural innovation, the pressure is still there, deferred. Then, when a famine or a food-price spike occurs anywhere in the world, the same people book it as confirmation, and the missed date drops out of the account entirely.

  I see the same configuration in a widely publicised 1970s computer-model exercise that projected industrial collapse from resource exhaustion before the end of the century and was defended afterwards as directionally right; in warnings about antibiotic resistance made decades before the resistance became routine, which do now look genuinely vindicated; and in forecasts of an imminent peak in oil production whose dates passed and were quietly moved. What interests me is not that forecasts fail — I take that for granted. It is the bookkeeping. Both outcomes, failure and vindication, get entered on the same side of the ledger, and the theory is never revised in either direction, even though it did name a date and could in principle have been tested against it. Nor does anyone in this line of work ever say the symmetrical thing: that they were early, that the mechanism they named has since been shown not to operate, and that the forecast should be withdrawn. And the move seems available only for unwelcome forecasts. Someone who predicted abundant fusion power by 1990 is simply wrong; nobody says he was right but early.

  I can get part of the way with notions I already have: moving the goalposts, claims that cannot be tested, true warnings ignored, and the loss of credibility that comes from repeated false alarms. But all of those seem to concern either the audience's reaction or the internal structure of the theory, whereas what I am describing is something a forecaster does after the fact, in both directions at once, and can do while sticking scrupulously to a stated date.

  I also think there are two different moves that get called by the same name. In one, the mechanism is retained and only the date is pushed, usually with a stated reason for the delay that could be checked independently. In the other, the mechanism quietly changes: the forecast was that a resource would physically run out, and what is later pointed to as vindication is a price spike with political causes, or a scarcity in a different part of the same sector. My working labels are date-shifting and mechanism drift, and I want to know whether that is where the joints are.

  So: does this have an established name? If there are several near neighbours, which one fits best, and how does each differ from what I have described — particularly the two-move distinction I am trying to make? If there is nothing established, say so plainly and give me a definition I can defend, with the boundary cases settled. Is a forecast that really was vindicated after a long lag — a nineteenth-century calculation linking atmospheric carbon to surface temperature, for instance — an instance of the same phenomenon or a different one? Does the asymmetry between unwelcome and welcome forecasts belong inside the definition, or is it incidental to it? And at what point does delay stop being a defence and start being a withdrawal? Please do not give me a reading list or citations; I need the concept and its edges, not sources to chase.
reasoning: |-
  Okay, the user is a science columnist who's been collecting long-term catastrophe forecasts that outlive their deadlines. They've noticed a pattern where forecasters defend failed predictions by claiming they were "directionally correct" but early, while treating any negative event as confirmation. The user needs a precise conceptual label for this phenomenon, not just a slogan, because experts will scrutinize it.

  Hmm, the core issue seems to be a form of epistemic evasion - forecasters retroactively reinterpreting both successes and failures as validation. The user already identified two distinct tactics: date-shifting (explicit timeline adjustment) and mechanism drift (implicit redefinition of the mechanism). That's astute. 

  What's tricky is that this isn't just confirmation bias (which is cognitive) or unfalsifiability (which is theoretical). It's a rhetorical maneuver applied post-hoc. The closest established concept might be "conventionalist stratagem" from philosophy of science - Popper's term for rescuing theories from falsification - but that's too academic and doesn't capture the dual-move aspect. 

  For the asymmetry between unwelcome/welcome forecasts: it's probably integral. Doom predictions get more leeway because of the "boy who cried wolf" dynamic - near-misses feel like near-hits. Whereas optimistic tech forecasts fail visibly (no fusion reactors in 1990). 

  Regarding genuinely vindicated delayed forecasts (like CO2 warming): those differ because they didn't require reinterpretation. The original mechanism/dates held up. So the boundary is whether retroactive reinterpretation occurs. 

  The user's "date-shifting" and "mechanism drift" terms are actually sharp. I'll endorse them but package under an umbrella concept emphasizing the retrospective nature. "Post-hoc temporal recalibration" feels right - it's neutral, captures the time manipulation, and implies systematic adjustment rather than honest error. 

  For the delay threshold: when the original timeframe becomes irrelevant to contemporary debate (e.g., still arguing Malthus in 2024). But that's context-dependent. Better to note that perpetual deferral effectively makes the claim unfalsifiable. 

  Final definition should stress: (1) retention of core thesis despite temporal failure, (2) dual reinterpretation tactics, (3) asymmetry favoring dire predictions. Will position their terms as subtypes under this.
answer: |-
  Based on your detailed description and the specific nuances you're grappling with, here's a breakdown of the conceptual landscape and a proposed solution:

  1.  **The Core Phenomenon:** You've identified a specific **post-hoc rationalization strategy** used to maintain a catastrophic forecast's validity *despite* the failure of its specific temporal prediction. Crucially, this strategy works in *both* directions:
      *   **Temporal Failure (Missed Deadline):** Explained away as being "early" or "delayed," with the core mechanism still asserted as valid and inevitable.
      *   **Seemingly Related Events:** Interpreted as confirmation/vindication of the *original* forecast, even if the event differs in scale, cause, or mechanism.

  2.  **The Established Name Gap:** There isn't a single, universally established term capturing *exactly* this specific, dual-directional post-hoc maneuver within forecasting literature. Terms like "moving the goalposts," "confirmation bias," "unfalsifiability," or "conventionalist stratagem" (Popper) touch on aspects but don't fully encompass:
      *   The *simultaneous* accounting of failure *and* unrelated events as *both* supporting the original thesis.
      *   The *asymmetry* you note (only applied to unwelcome forecasts).
      *   The distinction between explicit date-shifting and implicit mechanism drift.

  3.  **The Best Conceptual Fit & Definition:**
      *   **Proposed Umbrella Term:** **Post-Hoc Temporal Recalibration (with Mechanism Preservation)**
      *   **Definition:** *The retrospective adjustment of a failed temporal forecast's significance, wherein the original mechanism is preserved, the temporal failure is redefined as mere delay, and subsequent, potentially unrelated negative events are interpreted as confirmatory evidence, thereby maintaining the forecast's core catastrophic claim without substantive revision.*
      *   **Why it fits:**
          *   **Post-Hoc:** Happens after the forecast deadline passes.
          *   **Temporal Recalibration:** Explicitly addresses the date-shifting ("early," "delayed").
          *   **Mechanism Preservation:** Central to the phenomenon – the core causal story remains unchanged *in principle*.
          *   **Dual-Directional Accounting:** Captures how *both* the missed deadline (recalibrated) and new events (interpreted as confirmation) serve to uphold the thesis.
          *   **Neutral & Descriptive:** Avoids slogans ("crying wolf") and focuses on the logical maneuver.

  4.  **Addressing Your Subtypes:**
      *   **Date-Shifting:** This is the explicit **Temporal Recalibration** component of the umbrella term. It involves stating a new date or reason for delay that could, in principle, be checked.
      *   **Mechanism Drift:** This is a *violation* of the core **Mechanism Preservation** aspect. It represents a *different* failure mode – a fundamental shift in the *explanation* for the predicted outcome. It should be treated as distinct from genuine Post-Hoc Temporal Recalibration. It's closer to "theory replacement" or "redefining the terms of success" after the fact.

  5.  **Boundary Cases & Nuances:**
      *   **Genuinely Vindicated Delayed Forecasts (e.g., CO2/Temperature):** This is **NOT** an instance of Post-Hoc Temporal Recalibration. The key difference is that the *original mechanism and quantitative relationship* held true over time *without needing fundamental reinterpretation*. The delay was due to incomplete initial data or understanding, not a failed prediction later retrofitted. The vindication comes from the *same mechanism* operating as predicted, just over a longer timeframe. Here, the forecast *was* testable and *was* eventually confirmed.
      *   **The Asymmetry (Unwelcome vs. Welcome Forecasts):** This asymmetry **belongs inside the definition** as a *characteristic enabling condition*, not just an incidental observation. The social and psychological dynamics surrounding catastrophic warnings (urgency, precautionary principle, "cassandra complex") create fertile ground for this specific rationalization tactic. Failed optimistic forecasts lack this social/political weight, making the same maneuver seem absurd or dishonest rather than merely "cautious."
      *   **When Delay Becomes Withdrawal?** There's no fixed threshold. However, the rationalization loses defensibility when:
          *   The *reason* for the delay becomes demonstrably false or irrelevant.
          *   The timeframe extends so far that the original context (technology, society, resources) is fundamentally altered, making the original mechanism implausible in its original form.
          *   Repeated recalibrations occur without any convergence on observable evidence for the *imminence* of the catastrophe, rendering the forecast effectively unfalsifiable (a point where Mechanism Preservation becomes intellectually unsustainable).

  **Conclusion & Recommendation:**

  *   **Use:** Adopt **"Post-Hoc Temporal Recalibration"** as your core concept, explicitly defining it as above to capture the dual-accounting, mechanism preservation, and post-hoc nature.
  *   **Clarify Subtypes:** Distinguish clearly within your text:
      1.  **Explicit Temporal Recalibration (Date-Shifting):** Changing the timeline with stated reasons.
      2.  **Implicit Mechanism Replacement (Mechanism Drift):** A different failure – shifting the *cause* of the predicted outcome. This isn't true recalibration; it's changing the theory.
  *   **Acknowledge Asymmetry:** State explicitly that this maneuver is primarily observed with persistent catastrophic forecasts due to their unique social/political context, contrasting it with the fate of failed optimistic forecasts.
  *   **Boundary:** Emphasize that forecasts *genuinely* vindicated after long delay by the *original mechanism* (like CO2) are distinct – they *passed* the test of time, not rationalized *after failing* a specific test.

  This provides a precise, defensible concept that directly addresses your observed pattern, its internal logic, and its boundaries, satisfying your need for rigor and anticipating potential criticisms from the forecasters themselves.
