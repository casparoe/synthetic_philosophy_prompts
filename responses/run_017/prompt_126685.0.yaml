  ### Decision Procedure for Adjudication Unit  
  Below is a bespoke decision procedure designed for your unit, addressing the four core difficulties (tolerance vs. consistency, comparing vs. classifying, non-collapsible components, and legitimate reasons). The procedure uses **sequential questioning**, **anchored exemplars**, **pairwise comparisons**, and **panel referrals** to ensure consistency, transparency, and resistance to drift.  

  ---

  #### **Core Structure**  
  1. **Sequential Questions**: Caseworkers follow a fixed order of questions (A→B→C) to assess each component.  
  2. **Binary Thresholds**: Each component has clear "sufficient/insufficient" thresholds (defined below).  
  3. **Anchoring**: Uses a curated database of **exemplar cases** (reviewed quarterly) to prevent drift.  
  4. **Referral Triggers**: Cases with ambiguous trade-offs or novel factors go to a senior panel.  
  5. **Pairwise Comparisons**: Used only for level assignment, not final decisions.  
  6. **Reasons**: Predefined scripts explain outcomes without referencing vagueness or small differences.  

  ---

  #### **Step-by-Step Procedure**  
  **Phase 1: Initial Assessment**  
  Caseworkers ask these questions in order:  
  1. **A: Substantial Difficulties**  
     - **Question**: "Does the applicant’s condition regularly prevent them from completing ≥3 basic daily activities (e.g., cooking, hygiene, mobility) without assistance?"  
       - *Basic activities*: Predefined list (e.g., dressing, eating, leaving home).  
     - **Sufficient**: Yes + condition is documented (medical evidence, functional assessment).  
     - **Insufficient**: No, or only 1–2 activities affected.  
     - **Stop if "No"**: Deny. Reason: *"Your difficulties do not substantially limit daily activities."*  

  2. **B: Long-Term Difficulties**  
     - **Question**: "Has the condition persisted ≥12 months, or is it expected to last ≥12 months (including recurring/fluctuating conditions)?"  
     - **Sufficient**: Yes + evidence of stability/progression (e.g., clinical notes).  
     - **Insufficient**: No (e.g., acute injury <12 months).  
     - **Stop if "No"**: Deny. Reason: *"Your difficulties are not long-term."*  

  3. **C: Substantial Help Needed**  
     - **Question**: "Does the applicant require human assistance ≥4 times/week for basic activities, even with assistive equipment?"  
       - *Exclude equipment*: Equipment reduces frequency but doesn’t eliminate human help.  
     - **Sufficient**: Yes.  
     - **Insufficient**: Needs help ≤3 times/week.  
     - **Stop if "No"**: Deny. Reason: *"You do not require substantial ongoing help from others."*  

  **Phase 2: Trade-Off Assessment**  
  - If all components are **sufficient** → **Approve**.  
  - If 1+ components are **insufficient** → Proceed to **trade-off evaluation**:  
    - **Pairwise Comparison**: Caseworker compares the applicant to **anchored exemplars** (e.g., "Is this applicant worse than Exemplar #7?").  
      - *Exemplars*: 3 pre-approved "benchmark" cases (e.g., mild/moderate/severe) per component. Updated quarterly.  
      - *Rule*: Only compare **within the same component** (e.g., compare difficulty-to-difficulty).  
      - *Stop chaining*: Max 2 comparisons per component. If ambiguity remains → Refer to panel.  
    - **Trade-Off Rules**:  
      - **1 insufficient component**: Compensate if the other two are *severely sufficient* (e.g., A/B/C at 2x the threshold).  
        - *Example*: If C is insufficient but A involves ≥5 activities and B is lifelong → Approve.  
      - **≥2 insufficient components** → **Deny**.  
      - **Marginally insufficient** → Refer to panel.  

  **Phase 3: Outcome & Referral**  
  - **Approve**: If all sufficient, or trade-off compensation applies.  
  - **Deny**: If 1+ insufficient components with no compensation.  
  - **Refer to Panel** if:  
    - Novel factor (e.g., unanticipated equipment).  
    - Fluctuating condition with ambiguous severity/duration.  
    - Pairwise comparisons exhausted without clarity.  
    - Case is >15% dissimilar to any exemplar.  
  - **Reason Scripts**:  
    - Approve: *"Your condition is long-term, substantially limits daily activities, and requires regular help from others."*  
    - Deny: *"Based on [specific component], your situation does not meet the criteria for support."*  

  ---

  #### **Addressing the Four Difficulties**  
  1. **Tolerance vs. Consistency**  
     - **Anchoring**: Exemplar cases reset drift quarterly.  
     - **Chain-Breaking Rule**: If a new case is >15% different from the prior decision in the chain → Refer to panel (stops incremental drift).  

  2. **Comparing vs. Classifying**  
     - Pairwise comparisons only used **within components** (e.g., "Is this applicant’s condition worse than Exemplar #4’s?").  
     - **Cannot chain indefinitely**: Max 2 comparisons. Stops at margins where comparability thins.  

  3. **Non-Collapsible Components**  
     - Components evaluated **sequentially** (A→B→C). Trade-offs allowed only via:  
       - Predefined compensation rules (1 insufficient + 2 severely sufficient).  
       - Panel discretion for ambiguous trade-offs.  

  4. **Legitimate Reasons**  
     - **Announced arbitrariness**: Thresholds (e.g., "≥4 times/week") are published. Small differences are masked by ranges (e.g., "≤3 times/week" vs. "≥4 times/week").  
     - **Illegitimate arbitrariness**: Novel/unpublished factors → Refer to panel (avoids ad hoc justifications).  

  ---

  ### **Application to Three Cases**  
  **Case (a): Assistive Equipment**  
  - **A**: Substantial difficulties (✓ sufficient).  
  - **B**: Long-term (✓ sufficient).  
  - **C**: Help needed unclear due to equipment.  
    - Equipment reduces human help to 2 times/week → **Insufficient** for C.  
    - **Trade-off**: A and B are sufficient but not *severely sufficient* (e.g., not 2x threshold) → **Deny**.  
    - **Reason**: *"While your difficulties are substantial and long-term, the assistive equipment reduces your need for ongoing help from others."*  
    - **Result**: Unpopular "no" due to C’s insufficiency.  

  **Case (b): Fluctuating Condition**  
  - **A**: Substantial difficulties on bad days → **Sufficient** (if bad days occur ≥4 days/week).  
    - If bad days = 3 days/week → **Insufficient** (below threshold).  
  - **B**: Long-term (✓ sufficient).  
  - **C**: Help needed on bad days (e.g., 3 days/week) → **Insufficient**.  
    - **Trade-off**: Only B sufficient → **Deny**.  
    - **Referral Trigger**: Ambiguity in frequency → Case referred to panel. Panel assesses if bad days are "regular and disruptive" → May approve.  

  **Case (c): Drifted Threshold**  
  - Applicant marginally worse than past refusal (Case X) and better than recent approval (Case Y).  
    - **Anchoring**: Compare to current exemplars, not Case X/Y.  
    - If applicant meets thresholds → **Approve**.  
    - If marginally insufficient → **Deny** (e.g., C = 3 times/week vs. 4 threshold).  
    - **Reason**: *"Your need for help does not meet the threshold for regular, ongoing assistance."*  
    - **Drift Prevention**: Case added to exemplar pool for re-anchoring.  

  ---

  ### **Limitations & Transparency Risks**  
  **What the Procedure Cannot Do**:  
  1. Eliminate borderline cases (10–15% will always require panel referral).  
  2. Resolve subjective trade-offs without human judgment.  
  3. Prevent applicants/advisers from "gaming" published thresholds (e.g., exaggerating help needs to hit 4x/week).  

  **Transparency Trade-Off**:  
  - **Publishing the procedure**:  
    - ✅ **Pros**: Legitimizes thresholds, ensures consistency, reduces appeals.  
    - ❌ **Cons**: Advisers may "coach" applicants to hit thresholds (e.g., "claim 4 help sessions, not 3").  
  - **Mitigation**:  
    - Publish only general criteria (e.g., "≥4 times/week") but not exemplar details.  
    - Rotate/update exemplars quarterly to deter gaming.  
    - Audit cases where thresholds are *just met* to detect manipulation.  

  ---

  ### **Implementation Checklist**  
  1. Build an **exemplar database** with 10–20 benchmark cases (reviewed quarterly).  
  2. Train caseworkers on:  
     - Sequential questioning.  
     - Pairwise comparisons (within components only).  
     - Referral triggers.  
  3. Publish thresholds (e.g., "≥12 months", "≥4 times/week") but keep exemplars internal.  
  4. Mandate panel review for all denies in borderline cases.  

  This procedure balances consistency with flexibility, resists diachronic sorites, and provides defensible reasons—while acknowledging that some arbitrariness is unavoidable but manageable.
