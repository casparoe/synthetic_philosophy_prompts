          We defined: if the human help needed is weekly, then C1. Then (A2, B2, C1) -> approve.

          Reason: "Your condition causes substantial difficulties and is long-term. You require regular assistance from another person (once a week) to manage your daily activities. Therefore, you meet the criteria for support."

     Case (b): 
          We use Option 1: A is based on the severity on bad days -> A2. B2 (long-term). 
          C: help needed on 3 days a week -> C1. 
          Then approve.

          Reason: "Your condition causes substantial difficulties on the days when it is present and is long-term. You require regular assistance (three days a week) to manage your daily activities on those days. Therefore, you meet the criteria for support."

     Case (c): 
          We don't know the levels. Let's say the caseworker assigns:
            A: 2 (substantial difficulties)
            B: 2 (long-term)
            C: ?   It is marginal between C0 and C1.

          The caseworker is uncertain about C. They refer to the panel.

          The panel assigns C1 (by a majority). Then the case becomes (A2, B2, C1) -> approve.

          Or if the panel assigns C0, then (A2, B2, C0) -> deny.

          We need one of the cases to be a no that we don't like. So let's assume that by the criteria, C should be C0 (the help needed is less than once a week? maybe once every two weeks). Then the panel assigns C0 -> deny.

          Reason: "While your condition causes substantial difficulties and is long-term, you do not require regular or substantial assistance from another person (the assistance you require is less than once a week). Therefore, you do not meet the criteria for support."

          This no might be one we don't like because the applicant is very close to qualifying.

     What the procedure cannot do:

          - It cannot avoid the possibility that two very similar cases might be decided differently if they are on opposite sides of a threshold (but we minimize by the level definitions and exemplars).
          - It cannot eliminate the need for judgment in assigning levels, though we try to make it objective.
          - It might be inflexible in novel situations, but the panel referral helps.

     Publishing: 
          - We publish the criteria for the levels and the qualification rule. We also publish the existence of exemplars but maybe not the details (to avoid gaming). 
          - Publishing the criteria might lead to applicants and advisers focusing on the criteria, but that is intended and legitimate.
          - The risk of gaming is inherent in any rule-based system. We accept that in favor of transparency and consistency.

     Final note: This procedure is built to address the specific challenges and may need refinement in practice.
