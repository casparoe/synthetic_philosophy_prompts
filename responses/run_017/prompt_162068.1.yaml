answer: |-
  Here’s a decision procedure designed for your constraints: a step-by-step checklist using only publicly available info (press releases, one 20-min call), with clear stopping points, value-dispute flags, and labels. It prioritizes **evidence of intent/mechanism** over moral theories, preserving your core concepts while dropping weaker elements.

  ### Decision Procedure: "Payment Typology Triage"
  **(Run questions in order—stop at first conclusive answer or flag)**

  1. **IS IT A DIRECT PURCHASE?**  
     - *Check for:* Explicit quid pro quo (e.g., "in exchange for," "conditional on," named service/good).  
     - *Sources:* Press release verbs ("pays for," "procures"), call confirmation (ask: "Is this payment tied to a specific service?").  
     - *Sufficient evidence:* Contractual language in PR or direct admission in call.  
     - **→ Label: PURCHASE** if yes.  
     - *→ Stop/describe literally* if evidence ambiguous (e.g., vague "cooperation" without terms).  
     - *Value flag:* None—this is transactional fact.

  2. **IS IT REMEDIAL? (We broke it, we pay)**  
     - *Check for:*  
       - (a) **Causal admission:** Donor acknowledges harm caused by *their specific actions/institutions* (e.g., "redress," "historical injustices," "compensation").  
       - (b) **Tight linkage:** Payment announced proximate to *new* evidence/accountability for donor’s harm (e.g., court ruling, commission report *implicating donor*).  
     - *Sources:* PR keywords ("accountability," "reckoning"), call question: "Is this linked to a specific harm caused by the donor?"  
     - *Sufficient evidence:* (a) *or* (b) must be present.  
     - **→ Label: REMEDIAL DUTY** if yes.  
     - *→ Stop/describe* if neither (a) nor (b)—*don’t infer causality*.  
     - *Value flag:* "Does historical responsibility transmit?" (e.g., colonial harms). *Undecidable*—your call, but procedure halts.

  3. **IS IT UNCONDITIONAL? (Whose "description of the good"?) [Your "name-on-good" test]**  
     - *Check for:* Recipient control over funds/design.  
     - *Sources:* PR language ("unrestricted," "recipient-led," "budget support"), call: "Who decides how funds are used?"  
     - *Sufficient evidence:* PR/call confirms *no donor stipulations* on spending/implementation.  
     - **→ Label: GENERAL DUTY TO ASSIST** if yes (Pogge-esque: avoids imposing unjust order by ceding power).  
     - *→ Proceed to Q4* if conditional (donor controls objectives/contractors).

  4. **IS IT ASSISTANCE OR CHARITY?**  
     - *Check for:*  
       - (a) **Donor benefit:** Does PR/call imply donor gains (e.g., "regional stability," "mutual interests")?  
       - (b) **Obligation laundering:** Duty language ("responsibility," "must help") obscuring Q1/Q2 failure.  
     - *Sources:* PR framing, call: "What’s the primary motivation?"  
     - *Sufficient evidence:*  
       - If (a) present → **OBLIGATION LAUNDERING** (purchase disguised as duty).  
       - If (a) absent *and* (b) present → **CHARITY** (unilateral goodwill).  
       - If both absent → **GENERAL DUTY TO ASSIST** (pure need-based).  
     - *Value flag:* "Are enforceable duties of assistance possible?" *Undecidable*—label based on stated intent.

  ---

  ### Procedure Output on Your Cases
  **Case 1: Colonial Power’s Maternal Health Program**  
  - Q1: No explicit purchase.  
  - Q2: **REMEDIAL DUTY**. *Evidence:* Tight linkage (court ruling → program timing); causal admission likely in PR ("addressing historical legacies").  
  - *Why not charity?* Conditionality (donor’s contractors/indicators) fails Q3, but Q2 overrides.  
  - *Soft on what?* You’ve criticized donor-controlled programs—but remediation label may legitimize it. **Contradiction:** Your past called similar cash transfers "charity" despite better recipient autonomy.

  **Case 2: Rich Country Pays for Asylum Centers/Deportations**  
  - Q1: **PURCHASE**. *Evidence:* Quid pro quo ("hosting centers," "accepting flights"). PR will avoid this, so ask in call: "Is payment contingent on accepting deportees?" → Yes.  
  - *Obligation laundering:* Certain (duty language like "burden-sharing" in PR).  
  - *Stop early*—no need for further moral labels.

  **Case 3: Unconditional Cash Transfers (Private Foundation)**  
  - Q1: No purchase.  
  - Q2: No remedial link (private foundation, no colonial role).  
  - Q3: **UNCONDITIONAL** → **GENERAL DUTY TO ASSIST**. *Evidence:* Recipients control use ("unconditional").  
  - *Soft on what?* You’ve called these "charity," but the procedure forces **GENERAL DUTY** due to unconditionality. *Why?* Aligns with Pogge: not imposing external will = discharging duty to avoid harm. **This makes you look soft on charity frameworks**—you must now defend duties beyond emergencies.

  ---

  ### What the Procedure Can’t Do (Explicit Limitations)
  1. **Multi-donor trust funds:** Fails Q2/Q3 (causality diluted; control ambiguous).  
  2. **Concessional lending:** Q1 (purchase) conflicts with "duty" framing—laundering risk high but unverifiable.  
  3. **Reputational payments:** E.g., "green grants" to offset pollution. Q2 likely fails (no *direct* harm admission); may mislabel as charity.  
  4. **Value disputes:** Halts at flags (e.g., generational responsibility). You *must* disclose these.  
  5. **Scale/cost:** Doesn’t assess if assistance is "low cost" (your drowning-child analogy)—assumes any aid meets threshold.

  ### Load-Bearing vs. Hobbyhorses
  - **KEPT (Load-Bearing):**  
    - Remedial/assistance split (structural to Q2 vs. Q3/Q4).  
    - "Name-on-the-good" test (Q3: core to autonomy/moral work).  
    - Obligation laundering (Q4: critical for spotting disguised purchases).  
  - **DROPPED (Hobbyhorses):**  
    - "Drowning-child" low-cost test (operationalizing it requires donor budget data—unavailable).  
    - Distinguishing "charity" from "duty" beyond unconditionality (Q4 uses donor *rhetoric* as proxy—pragmatic, not philosophical).

  ### Why This Works
  - **Order matters:** Purchases/remedial duties are easier to verify than assistance.  
  - **Press-release-proof:** Uses PR language against itself (e.g., "historic responsibility" triggers Q2).  
  - **Forces honesty:** If you call Case 3 "duty" despite past "charity" labels, you confront your inconsistency.  
  - **Audit trail:** Document why you stopped (e.g., "Q2: No causal admission in PR/call").  

  Use this, and your column’s moral accounting will be as rigorous as the payments you dissect.
