  ### Constructed Scenario (250 words)

  RetaliCorp, a financial services firm, offers high-risk loans. It maintains a standing policy: for any loan recipient, if they default and possess a specific genetic marker (indicating risk tolerance), a $50,000 penalty is automatically imposed. This marker is a fixed biological trait, identifiable via public medical databases. The policy is credible because it deters risk-tolerant individuals (more likely to default) from taking loans, reducing overall defaults. Enforcement is automated and costs little, while penalties from defaulters with the marker offset losses, ensuring net gains. Deterrence relies on the policy being widely known and consistently applied.

  Alex is offered a loan based on RetaliCorp’s database check confirming the marker exists. Alex does not know their marker status (it was recorded anonymously during a prior medical study). Taking the loan costs $5,000 upfront. If Alex takes it, there is a 10% chance of gaining $100,000 (success) and a 90% chance of losing $10,000 (default). If Alex defaults and the marker exists, the $50,000 penalty applies. The marker is correlated with loan-taking: risk-tolerant individuals (those with the marker) are more likely to accept such offers. Alex decides after being targeted, unaware of the marker or its implications.

  ### Decision Theories: Worked Analysis
  - **Causal Decision Theory (CDT):**  
    CDT ignores correlations and focuses only on causal influences. Alex's decision does not cause the marker to exist (it is fixed), nor does it cause the penalty directly (the penalty is triggered by default + marker, both outside Alex's causal control). CDT uses the *prior probability* of the marker (unknown to Alex) to compute expected utility.  
    - Prior probability of marker (from population data): 1% (0.01).  
    - EU(Take) = (0.1 × $100,000) + 0.9 × [−$10,000 − (0.01 × $50,000)] − $5,000  
      = $10,000 + 0.9 × [−$10,000 − $500] − $5,000  
      = $10,000 − $9,450 − $5,000 = **−$4,450**.  
    - EU(Refuse) = $0.  
    **Verdict: Refuse the loan** (since −$4,450 < $0).  

    *Reasoning: CDT treats the marker’s probability as independent of the action. The penalty cost is small in expectation ($450 = 0.9 × 0.01 × $50,000) because the marker is rare, but the loan’s inherent risk (90% chance of $10,000 loss) and upfront cost dominate, making it negative EU.*  

  - **Evidential Decision Theory (EDT):**  
    EDT conditions on the action as evidence, updating beliefs about the marker. Taking the loan is evidence Alex has the marker (since the marker correlates with risk tolerance and loan-taking).  
    - Probability of marker given loan taken: Based on correlation.  
      - P(Marker) = 0.01 (prior).  
      - P(Take | Marker) = 0.9 (risk-tolerant people often take loans).  
      - P(Take | No Marker) = 0.05 (risk-averse people rarely do).  
      - P(Marker | Take) = [P(Take | Marker) × P(Marker)] / P(Take) = (0.9 × 0.01) / [(0.9 × 0.01) + (0.05 × 0.99)] ≈ 0.154.  
    - EU(Take) = (0.1 × $100,000) + 0.9 × [−$10,000 − (0.154 × $50,000)] − $5,000  
      = $10,000 + 0.9 × [−$10,000 − $7,700] − $5,000  
      = $10,000 − $15,930 − $5,000 = **−$10,930**.  
    - EU(Refuse) = $0.  
    **Verdict: Refuse the loan** (more strongly than CDT).  

    *Reasoning: EDT treats taking the loan as strong evidence Alex has the marker (≈15.4% chance vs. 1% prior), making the penalty likely if default occurs. This inflates expected penalty costs, worsening EU.*  

  - **Functional Decision Theory (FDT):**  
    FDT selects the best policy for all instances of the decision problem, ignoring "local" information about the marker. It asks: "What policy (always take/always refuse) maximizes expected utility from an ex ante perspective?"  
    - EU(Always Take) = P(Marker) × EU(Take | Marker) + P(No Marker) × EU(Take | No Marker).  
      - EU(Take | Marker) = (0.1 × $100,000) + 0.9 × (−$10,000 − $50,000) − $5,000 = $10,000 − $54,000 − $5,000 = **−$49,000**.  
      - EU(Take | No Marker) = (0.1 × $100,000) + 0.9 × (−$10,000) − $5,000 = $10,000 − $9,000 − $5,000 = **−$4,000**.  
      - EU(Always Take) = (0.01 × −$49,000) + (0.99 × −$4,000) = **−$4,450**.  
    - EU(Always Refuse) = $0.  
    **Verdict: Refuse the loan** (same as CDT).  

    *Reasoning: FDT’s updateless perspective uses the prior marker probability (1%). The policy "always take" has negative EU due to the loan’s inherent risk and upfront cost. FDT rejects the loan, as "always refuse" yields $0.*  

  - **Updateless Ex Ante Policy Selection:**  
    This is FDT’s approach. It does not change the verdict here, as "always refuse" dominates. If the upfront cost were lower (e.g., $3,000), "always take" could become positive EU under CDT/FDT, but in this case, it does not.  

  ### Key Feature Isolating EDT
  The **correlation between the action and the marker** drives the difference. EDT updates the probability of the marker based on the action, while CDT/FDT use the prior probability because the action does not causally influence the marker.  

  ### Removing the Feature: Two Variations
  1. **Victim Reads Their File (Knows Marker Status):**  
     - If Alex knows the marker exists: EU(Take) = (0.1 × $100,000) + 0.9 × (−$10,000 − $50,000) − $5,000 = −$49,000.  
     - If Alex knows no marker: EU(Take) = (0.1 × $100,000) + 0.9 × (−$10,000) − $5,000 = −$4,000.  
     - **Result:** All theories refuse if marker exists; CDT/FDT take if no marker (EU = −$4,000, which may be acceptable if loss tolerance is high). EDT now matches CDT/FDT since the correlation is irrelevant with full information.  

  2. **Retaliator Models Decision Procedure (Not Fixed Record):**  
     Suppose RetaliCorp penalizes based on a *prediction* of Alex’s decision (e.g., "If our model says Alex will take the loan, penalize default").  
     - **EDT:** Still refuses—taking the loan is evidence the model predicted it, increasing penalty likelihood.  
     - **CDT:** Takes the loan—the decision doesn’t cause the prediction.  
     - **FDT:** Refuses—it coordinates with the model to avoid penalties by one-boxing (functional dependence on the decision procedure).  
     - **Result:** EDT and FDT align in refusing; CDT diverges by taking. The original correlation is replaced by a functional dependence, altering FDT’s verdict.  

  ### Strong Reply for EDT Proponents
  An EDT defender argues: "The correlation is real and rational to consider. Taking the loan *is* evidence of the marker, which makes the penalty more likely upon default. Ignoring this (as CDT/FDT do) is reckless. In this scenario, refusing is objectively safer: it avoids a ‘trap’ for risk-tolerant people. EDT’s refusal isn’t a flaw—it correctly handles the informational link between actions and hidden states. The penalty threat is real, and EDT’s sensitivity to evidence is a strength, not a vulnerability."  

  ### Why This Meets Specifications
  - **Mundane**: Genetic markers, loans, penalties—no predictors, simulations, or exotic physics. Stakes: $5,000 compliance cost vs. $50,000 penalty.  
  - **Credible Threat**: Policy deters risk-tolerant borrowers, reducing defaults. Automation makes enforcement cheap; penalties offset losses, ensuring ex post rationality.  
  - **Targeting Independent of Knowledge**: Alex is targeted based on the fixed marker (on file), not whether they know the threat.  
  - **Post-Targeting Decision**: Marker is fixed and unknown to Alex during the decision, correlated with loan-taking (due to risk tolerance), and not causally downstream.  
  - **No Precommitment Escape**: No earlier binding possible; the marker is immutable.  
  - **Isolates Evidential Vulnerability**: EDT pays (refuses) due to evidential updating alone. FDT/refusal here stems from the loan’s inherent risk, not the correlation.  
  - **Functional Dependence Test**: When the retaliator models the decision procedure (Variation 2), FDT’s verdict changes, showing it responds to functional dependence, not just correlation.
