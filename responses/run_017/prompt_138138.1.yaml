prompt: |-
  I have no academic training in philosophy or economics. I work as a logistics planner and, for about two years now, have run a monthly evening at my local library on how people actually make decisions — around 14 regulars, roughly my own level of technical comfort (percentages yes, algebra no), 90 minutes, a room with a whiteboard and no projector. Reading decision theory on my own, I keep coming back to the old pair of choices in which people reliably take the guaranteed sum in one case and the slightly better long shot in the other, even though — so the argument goes — the two cases differ only by a branch that comes out the same either way. I want my group to collide with this themselves rather than have me explain it, so what I need is an activity, not a talk.

  My half-formed idea, which I would like the activity to test rather than assume: people are not comparing final amounts of money at all. In the risky option they are also comparing themselves to what they would have got in the branch that didn't happen, and the guaranteed option is attractive partly because it spares them that comparison. My duller rival explanation is that they simply don't handle the numbers the way the arithmetic does — a guaranteed floor is worth more to them than its expected contribution. A third possibility is that they don't believe the chances they are handed.

  Please think this through carefully before you write. You are a decision theorist who also designs hands-on workshops for adults with no mathematical background. Brainstorm two or three ways of staging this, pick the mechanics that force the intuition rather than announce it, and discard anything that would need a calculator, a projector, or more than a few seconds of mental arithmetic. Constraints: real but small stakes (one $10 bookshop voucher per round, with one round chosen at random to be played out for real after all choices are in); the two paired choices must be separated by filler rounds and by different surface framings so nobody spots the pattern; include at least one variant where the shared branch is only approximately shared — 10% against 11%, with the amounts adjusted to compensate — because I want to see whether the pull tracks the structure or the resemblance; include at least one round in which people choose on behalf of another participant; and include a bidding round where they write down the smallest guaranteed amount they would accept instead of the gamble, so I get a magnitude rather than a yes or no. Nobody should hear the words Allais or independence until the debrief.

  Give me the following, in this order:

  The idea in plain words (~120 words): what participants should come away having felt, not having been told.

  Setup, materials and stakes (~120 words).

  The rounds, as I would read them out (~350 words): exact wording for each round including the filler, and what I write on the board each time.

  Timeline (~100 words): minute by minute across the 90 minutes.

  Debrief (~250 words): which moment in the session maps onto which part of the idea, and how I use the near-miss variant, the delegated-choice round and the bids to prise my three explanations apart.

  What will go wrong (~150 words): the predictable failures on a first run, and what to do when they happen.

  What the activity cannot show (~100 words): the part of the disagreement I will have to supply myself, in words, at the end.
reasoning: |-
  Okay, the user is a logistics planner running a monthly library group on decision-making for non-experts. They want to design an activity around the classic preference reversal paradox (likely Allais) without using technical terms. 

  Hmm... their core hypothesis is fascinating - that people aren't comparing final outcomes but also mentally comparing to counterfactuals. Need to test this against simpler explanations (misweighting probabilities or distrusting stated odds). Constraints are very clear: no math beyond percentages, physical materials only, small real stakes.

  First, the activity must make participants feel the contradiction before naming it. Should use: 
  - Concrete money amounts (small enough for book vouchers but big enough to matter)
  - Separated choice pairs disguised with different framings
  - A "choose for others" round to reduce emotional attachment
  - Bidding to measure intensity of preference
  - A near-identical probabilities variant (10% vs 11%) to see if structure matters

  Biggest challenge is hiding the paired structure while ensuring comparability. Need filler rounds that feel related but aren't reversible - maybe some simple probability weighting exercises. 

  For the reveal, board work should visually isolate the common branch. Must avoid terms like "independence axiom" until debrief. The "what will go wrong" section is crucial - participants might spot the pattern early or struggle with bidding concept. Need backup phrasing ready.

  Most limiting factor: can't show how this connects to broader decision theory frameworks. Will have to verbally explain normative vs descriptive models in debrief. Should prepare that bridge carefully - maybe using their logistics work as analogy ("we plan routes differently than we actually drive them")
answer: |-
  Here’s a workshop plan designed to make participants *feel* the paradox, isolate your hypothesis, and test alternatives:

  ### **The Idea in Plain Words**  
  Participants should feel the tension between their own consistent choices and a hidden contradiction. They’ll experience how a "safe" option suddenly seems irrational when the context shifts slightly, and sense that avoiding regret (comparing to "what might have been") or overvaluing guarantees might drive this—not just arithmetic.  

  ---

  ### **Setup, Materials & Stakes**  
  **Materials:** Whiteboard, markers, 15 identical envelopes, slips of paper, a dice (or shuffled envelopes for randomness).  
  **Stakes:** Each round, participants choose between options. After all rounds, one envelope is drawn randomly; the choice inside determines if they win a $10 voucher. Each person gets one envelope per round.  

  ---

  ### **Rounds (Read Aloud)**  
  *Write choice frameworks on the board as you describe them.*  

  1.  **Filler 1 (Anchor):**  
      *"Option A: 90% chance to win $10, 10% to win $0.  
      Option B: Guaranteed $9. Write ‘A’ or ‘B’ on your slip, seal it in Envelope 1."*  
      *(Board: Round 1: A = 90% $10 / 10% $0 vs B = $9 sure)*  

  2.  **Paradox Pair 1 (Risky Safe):**  
      *"Option C: 90% chance to win $12, 10% to win $0.  
      Option D: 80% chance to win $10, 20% to win $0. Write ‘C’ or ‘D’ in Envelope 2."*  
      *(Board: Round 2: C = 90% $12 / 10% $0 vs D = 80% $10 / 20% $0)*  

  3.  **Filler 2 (Probability Weighting):**  
      *"Option E: 5% chance to win $30, 95% $0.  
      Option F: 10% chance to win $15, 90% $0. Envelope 3."*  
      *(Board: E = 5% $30 vs F = 10% $15)*  

  4.  **Paradox Pair 2 (Guaranteed Safe):**  
      *"Option G: 10% chance to win $12, 90% to win $0.  
      Option H: 11% chance to win $10, 89% to win $0. Envelope 4."*  
      *(Board: G = 10% $12 vs H = 11% $10)*  

  5.  **Delegate Choice:**  
      *"Imagine you’re choosing for the person to your left. Option I: 50% $15, 50% $0.  
      Option J: Guaranteed $7. Envelope 5."*  

  6.  **Bidding Round:**  
      *"Option K: 70% chance to win $14, 30% $0.  
      Instead of choosing, write the smallest guaranteed cash amount you’d accept to give up this gamble. Write a number (e.g., ‘$5.50’) in Envelope 6."*  

  ---

  ### **Timeline (90 Min Total)**  
  - **0–10 min:** Explain rules, Round 1 (filler).  
  - **10–25 min:** Rounds 2 (risky safe) & 3 (filler). Collect envelopes.  
  - **25–40 min:** Rounds 4 (near-miss safe) & 5 (delegate). Collect.  
  - **40–55 min:** Round 6 (bidding). Collect.  
  - **55–70 min:** Randomly select & play 1 round publicly (roll dice/draw envelope).  
  - **70–90 min:** Debrief (see below).  

  ---

  ### **Debrief**  
  1.  **Reveal Contradiction:**  
      *Board side-by-side:*  
      *Pair 1: C (90% $12) vs D (80% $10)*  
      *Pair 2: G (10% $12) vs H (11% $10)*  
      Ask: *"Who chose D over C? Who chose G over H?"* Show hands. Point out that in both, choosing the "safer" option (D or H) means sacrificing $2 for +10% odds—but many reject this in Pair 1 (D) and accept it in Pair 2 (H).  

  2.  **Test Hypotheses:**  
      - **Counterfactual Regret (Your Idea):** *"In Pair 1, Option D’s 20% failure feels like losing $10 you ‘should’ have had. Option C’s 10% failure feels like losing $12 you never expected. Is the guarantee mentally shielding you from that comparison?"* Use bidding round: Low bids suggest less fear of regret.  
      - **Probability Distrust:** *"In Round 4 (G vs H), did 10% vs 11% feel identical? Or did you distrust small differences?"* If H is popular, distrust isn’t dominant.  
      - **Overweighting Guarantees:** Delegated choices (Round 5) often show less risk aversion—suggesting personal emotion affects valuation.  

  3.  **Name the Paradox:** Only now mention "Allais Paradox" and "common consequence effect." Stress: *"We don’t just add outcomes—we weigh the stories around them."*  

  ---

  ### **What Will Go Wrong**  
  - **Pattern Recognition:** Some may spot the paradox pairs. Mitigate by adding more fillers (e.g., "Option X: 100% $7 vs Option Y: 60% $12") and varying amounts.  
  - **Bidding Confusion:** Clarify: *"What’s the lowest cash you’d take instead of the 70% shot at $14?"* Give examples ($3? $8?).  
  - **Delegate Round Awkwardness:** If uncomfortable, reframe: *"Choose for a future participant who’ll get this envelope."*  
  - **Math Anxiety:** Reassure: *"Go with your gut. We’re studying instincts, not testing accountants."*  

  ---

  ### **What the Activity Cannot Show**  
  You’ll need to explain:  
  1.  **Normative vs. Descriptive:** *"Rational models (like expected value) prescribe what we ‘should’ do. But humans evolved for survival, not spreadsheet accuracy. This paradox shows that ‘rational’ math clashes with how we actually weigh uncertainty and regret."*  
  2.  **Broader Implications:** *"This isn’t just about games—it affects insurance purchases, career risks, even climate policy. We protect fiercely against small losses but ignore statistically identical gains."*  
  3.  **Theoretical Stakes:** *"Economists once assumed all decisions were arithmetic. Now we know emotions, framing, and counterfactuals warp choices. That’s why we design policies around human behavior, not textbooks."*  

  This structure forces visceral engagement, masks the paradox until revelation, and uses your variants to dissect motives—all while staying tactile, low-math, and stakes-light.
