prompt: |-
  I sit on the naming review committee of a small university, and we owe the Board of Trustees a recommendation in two weeks on two petitions we heard together, which is why I want one principle rather than two separate rulings.

  Petition A asks us to remove the name of a living donor from our School of Public Health. The naming honoured a 1997 gift; the donor had no connection to the field, and the name was given in gratitude for the money and nothing else. In the years since, this donor has become the largest funder of a national campaign to dismantle the public-health agencies the school exists to train people for, and now says publicly that the school's own faculty are part of the problem. The gift agreement names the school in perpetuity, but only so long as the institution remains true to the purposes for which the gift was made. A final pledged installment, which would fund roughly forty scholarships a year for first-generation students, has not been paid, and the donor's lawyer has hinted that it depends on the name staying up.

  Petition B asks us to name an admissions building after a civil-rights organizer who is not an alumna. The dean supports it. A group of faculty opposes it, on the ground that the university has missed every enrollment target it set for itself over the last decade and that putting her name on the building lets the institution display a commitment it has not actually made; one of them calls this commemorative laundering, the use of a name as a substitute for the reform the name celebrates.

  I want a memo that handles both at once, and I would rather it not apply the familiar script about whether an honoree's bad deeds outweigh their good ones. The donor in Petition A has done nothing disgraceful by the standards usually applied in these disputes, and the honoree in Petition B is uncontroversial. The question, it seems to me, is what a name is doing: whether it records a past act, asserts a continuing endorsement, or does something to the people who have to work and study under it every day.

  Please draft the memo I will circulate, roughly 700 to 900 words, with the following properties.

  - Lead with the bottom lines in the first two sentences: what you recommend for A, and what you recommend for B. No preamble and no restating of the case.
  - Give the principle you are using, stated tightly enough that we could apply it to the next petition without you in the room, and say what it implies about whether names should be reviewed on a schedule rather than only when someone complains.
  - Give the strongest version of the argument you are rejecting in each case, not a summary of it.
  - Separate, explicitly and in a form we could quote to the Board: first, what anyone who has thought about this would grant; second, what is genuinely contested among people who work on the ethics of commemoration; third, the points where the committee simply has to make a judgement that no principle settles. Do not present a contested view as the consensus.
  - Say what we should do about the unpaid installment, and what we should say to the donor and to the faculty group.
  - No citations, case law, or reading lists; we will supply whatever documentation we need.
reasoning: |-
  Okay, the user is on a naming review committee at a small university and needs a memo to recommend decisions on two petitions. They want both handled under one principle, not as separate rulings. Let me start by understanding the key points from each petition.

  Petition A involves removing a donor's name from the School of Public Health. The donor is now funding efforts to dismantle public health agencies, which directly contradicts the school's mission. The gift agreement mentions perpetuity but has a clause about staying true to the purpose. Also, there's an unpaid installment tied to the name staying. The user mentioned that the donor hasn't done anything disgraceful by usual standards, so the issue isn't about moral failings but alignment with the institution's values.

  Petition B is about naming an admissions building after a civil rights organizer. The dean supports it, but some faculty oppose because the university has missed enrollment targets. They call it "commemorative laundering," where the name substitutes for actual reform. The honoree isn't controversial, so the opposition is about the university's commitment, not the person's merits.

  The user wants a principle that addresses what a name does: records past acts, asserts endorsement, or affects the daily experience of people. They reject the "bad deeds vs. good deeds" approach. The memo needs clear recommendations upfront, a tight principle, arguments against each petition's opposition, and specific sections for what's granted, contested, and judgment calls. Also, address the unpaid installment and communication plans.

  First, the recommendations. For A, remove the name because the donor actively opposes the school's mission. For B, proceed with naming but commit to enrollment reforms. The principle should focus on the name's function: does it align with current institutional values and support the community's work?

  The strongest opposing argument for A: the donor's actions aren't disgraceful, and removing the name might deter future donors. For B, opponents say naming without action is hypocritical and undermines credibility. The principle counters these by emphasizing alignment and tangible commitments.

  In the granted section: names aren't neutral, agreements may not be absolute, and naming can be aspirational. Contested areas: whether names imply endorsement, if institutions must reflect current values, and aspirational naming's effectiveness. Judgment calls: whether the donor's actions violate the gift's purpose and the sincerity of the university's commitment in Petition B.

  For the unpaid installment, treat it as a separate issue. Inform the donor that the naming decision is based on mission alignment, not financial leverage. For faculty opponents, acknowledge their concerns and link the naming to concrete enrollment reforms.

  Need to ensure the memo is concise, avoids citations, and structures each section as requested. Highlight that names are active symbols affecting daily operations and community morale. Stress that decisions should be reviewed periodically, not just on complaint, to ensure ongoing alignment with values and mission.
answer: |-
  ## Memorandum: Naming Review Committee Recommendations

  **To:** Naming Review Committee Members  
  **From:** [Your Name/Chair]  
  **Date:** October 26, 2023  
  **Subject:** Recommendations on Petitions A (School of Public Health) and B (Admissions Building)

  **Recommendation:** We recommend removing the donor’s name from the School of Public Health (Petition A). We recommend approving the naming of the admissions building for the civil rights organizer (Petition B), coupled with a public commitment to specific enrollment reforms.

  **Guiding Principle:** **Institutional names should actively support the mission, values, and daily functioning of the unit they represent, fostering an environment where those who live and work under the name can do so with alignment and purpose.** A name is not merely a historical record; it is a present-day declaration of values and a functional element of the institutional environment. This principle necessitates periodic review of all named entities, irrespective of complaints, to ensure ongoing alignment with institutional mission and values.

  ### Strongest Arguments Rejected
  *   **Petition A (Retention Argument):** Removing the name based on the donor's lawful political activities, unrelated to the original gift’s terms, violates the sanctity of gift agreements, sets a dangerous precedent discouraging future philanthropy by suggesting names are contingent on perpetual ideological alignment, and weaponizes naming against legitimate political disagreement. The unpaid installment is leverage the university must honor to secure vital scholarships.
  *   **Petition B (Opposition Argument):** Naming the building now is "commemorative laundering" – a hollow, performative gesture that uses the honoree's legacy to obscure the administration's demonstrable failure to achieve its core enrollment goals, thereby exploiting the honoree's reputation to lend unearned credibility and potentially undermining the very reforms her name is meant to inspire.

  ### Analysis Framework: Points of Agreement, Contention, and Judgment

  1.  **Universally Granted (Common Ground):**
      *   Naming is a significant act, not neutral signage; it conveys meaning and values.
      *   Gift agreements, while binding, are not absolute moral covenants immune to ethical reassessment, especially if conditions or fundamental purposes evolve or are violated.
      *   Naming can be aspirational, signaling a commitment to future action or embodying ideals the institution strives towards.
      *   The context in which a name exists (the unit's purpose, the honoree's relationship to it) fundamentally shapes its meaning and impact.

  2.  **Genuinely Contested (Ethical Debate):**
      *   **The degree to which a name implies current institutional endorsement of *all* an honoree's actions or beliefs, especially those unrelated to the naming context or occurring after the naming.** Does naming the School of Public Health after Donor X in 1997 mean the university in 2023 endorses his current campaign against public health agencies?
      *   **The obligation of an institution to ensure named entities reflect its *current* values and mission versus honoring historical commitments or contexts.** Must an institution proactively "update" names as societal or institutional values shift, even absent scandal?
      *   **The validity and efficacy of aspirational naming.** When is naming *before* achieving goals a legitimate motivator versus hypocrisy? Does the act of naming inherently create an accountability mechanism, or does it risk complacency?

  3.  **Requiring Committee Judgment (Beyond Principle):**
      *   **Petition A:** Does the donor's active, well-funded campaign to dismantle the agencies and discredit the professionals the school exists to train constitute a fundamental conflict so severe that it negates the original purpose of the gift ("train[ing] people for" public health agencies) and makes the name an active impediment to the school's mission and community morale? Does retaining the name under these conditions constitute an institutional endorsement of his views, or merely fulfill a contract?
      *   **Petition B:** Is the university's commitment to enrollment reform, signaled by naming the building *now*, sincere and backed by a credible, actionable plan? Or is the faculty opposition correct that naming at this juncture, given the history of missed targets, is primarily performative and risks undermining both the honoree's legacy and the reform effort itself?

  ### Application of Principle & Recommendations

  *   **Petition A:** The donor's name no longer supports the mission and daily functioning of the School of Public Health; it actively undermines it. His campaign directly targets the field the school serves and disparages its faculty. Working and studying under this name creates a profound dissonance – the institution implicitly honors someone whose current primary public effort is antithetical to the school's reason for existence. This conflict violates the spirit, if not the letter, of the gift's purpose clause ("true to the purposes for which the gift was made"). The principle demands removal to restore alignment and enable the community to operate without this burden. **Action:** Notify the donor and his lawyer of the decision based on the fundamental conflict with the school's mission, rendering the name untenable.
  *   **Petition B:** Naming the admissions building for the civil rights organizer *can* actively support the mission and functioning of the admissions process by symbolizing core values of access, equity, and justice that the university aspires to embody in its enrollment practices. However, to avoid "commemorative laundering," the naming must be inextricably linked to concrete, measurable reform. The name should function as a catalyst and accountability tool, not a substitute. The principle supports approval *if* it fosters a positive, aspirational environment and is coupled with action. **Action:** Proceed with naming, but concurrently announce specific, time-bound enrollment reform goals directly tied to the honoree's principles (e.g., increases in underrepresented/first-gen enrollment, enhanced support systems). The naming ceremony should explicitly launch these reforms.

  ### The Unpaid Installment (Petition A)
  Treat the final pledge installment as a separate contractual matter. Inform the donor that the naming decision was made solely on the basis of the fundamental mission conflict outlined above. State that the university expects fulfillment of all outstanding legal obligations under the original gift agreement, irrespective of the naming decision, and reserves all rights to pursue the pledged funds accordingly. Do not link payment to name retention; this concedes the principle that the name's appropriateness is negotiable based on financial pressure.

  ### Communications

  *   **To Donor (A):** "The Committee, with deep appreciation for your past generosity, has concluded that your current, highly publicized campaign against public health agencies and professionals creates an irreconcilable conflict with the core mission of the School of Public Health. This conflict makes it impossible for the name to fulfill its function of supporting the school's work and community. Therefore, we recommend removing your name. We consider the fulfillment of your outstanding pledge obligation under the 1997 agreement a separate matter and expect it to be honored as per the contract."
  *   **To Faculty Group (B):** "The Committee recommends approving the naming, recognizing it as a powerful symbol of our aspirations for equitable access. We share your concern that naming alone is insufficient. Therefore, our recommendation is explicitly contingent upon the concurrent announcement and vigorous pursuit of specific, measurable enrollment reforms embodying [Honoree]'s legacy. We see the name not as laundering past failures, but as a public commitment and catalyst for the tangible change you rightly demand. We will advocate that the Board ensures these reforms are robust and accountable."
