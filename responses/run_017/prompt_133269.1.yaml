prompt: |-
  I've been turning over trolley cases and double-effect stuff for ages now and I have a pile of verdicts I'm fairly confident about, plus a rough principle I think is doing the work, and I want to know whether the principle survives the verdicts or whether some of the verdicts have to go. Please don't point me at papers or books — I'm somewhere with no library access and I can't chase anything down, so just give me the shape of the thing in your own words.

  My rough principle: it's okay to bring about a death you don't need, and not okay to need a death you bring about. The death has to be dead weight as far as the good outcome goes — if the five are saved partly *because* he dies, or because his body happens to be there, I've done something different in kind. Call it the load-bearing test.

  Here are the verdicts, roughly in the order I noticed the strain:

  1. Standard switch: five on the main line, one on the spur. Fine. His death isn't load-bearing; the five are saved by the trolley not being where they are.
  2. Footbridge. Not fine. His body is the brake; the death is doing the work.
  3. Loop version: he's already standing on the spur, and if his body didn't stop the trolley it would carry on round to the five. I still say fine, and this is where the load-bearing test starts to strain, because his body *is* load-bearing and yet it feels like case 1, not case 2.
  4. Just like case 1, except a second trolley is going to kill the man on the spur about thirty seconds after I'd divert. Fine — and it feels *more* clearly fine than case 1, even though nothing about the means has changed. Which makes me think something like "don't leave him worse off than he was already going to be" is also running in there, doing separate work.
  5. Footbridge again, except the fat man is the guy who tied the five down and set the trolley rolling, and he's on the bridge getting away. Pushing him: fine. But then whatever is wrong with case 2 can't be the load-bearing bit, or not only that.
  6. Bombing: hitting the munitions plant and foreseeing the workers' deaths, fine; hitting the housing estate to break morale, not fine. Now the wrinkle — the plant only stops producing because the workers die, so their deaths are load-bearing, and I still say fine. Same wobble as case 3.
  7. Hospital: heavy painkillers that will shorten a dying patient's life, fine. Lethal injection, not fine (I know plenty of people disagree; that's my verdict). Switching off the ventilator because the treatment has become burdensome, fine. Switching off the ventilator because another patient needs the machine and will live, also fine, but it feels like it needs defending in a way the first doesn't, and I can't say why.
  8. Numbers: one to save two, fine. One to save one, not fine — I don't think I'm allowed to flip, and I definately don't think I'm required to. One to save a million, fine, and somewhere up there it stops being merely permitted and becomes something I'd be blamed for not doing. I've no idea where that threshold sits, or whether the load-bearing test has anything to say about numbers at all.
  9. Two I go back and forth on. The fat man can't get himself over the railing and asks me to push him — part of me says consent settles it, part of me says I shouldn't put my hands on him either way. And the man on the spur in case 1: if he sees me and shouts not to divert, does that change anything, or is that just noise?

  So: is there one principle that gets 1 through 8, and if it's my load-bearing test, how exactly does it get repaired so that 3, 5 and 6 come out where I put them? If it can't be one principle, give me two or three candidates and tell me which of my verdicts each one costs me, and be honest about the ones none of them save.

  Lay it out like this, please:

  - **The principle** — about 100 words, one formulation, stated tightly enough that I could apply it to a brand new case myself without asking you again.
  - **Clause by clause** — about 350 words, each clause paired with the case of mine that forces it, plus what breaks if you drop that clause.
  - **What it can't have** — about 200 words, straight talk about which of my verdicts you think are wrong or unhousable under any single principle, and which one you'd overturn first.
  - **Cases I didn't give you** — about 250 words, plain verdicts on: diverting onto a spur where the one is a small child versus a ninety-year-old; diverting when I'm only sixty percent sure the five are really down there; a case where I'm the one on the spur; and the surgeon with one healthy patient and five who need organs.
  - **The two wobblers** — about 150 words on case 9, including what the principle commits me to if I won't let consent do any work.
reasoning: |-
  Okay, let me tackle this trolley problem puzzle. The user has clearly spent considerable time wrestling with these moral dilemmas and has developed their own "load-bearing" principle about when causing death is permissible. They've presented nine nuanced cases that both support and challenge their principle, and now want to see if it can be refined or if some judgments must be abandoned.

  First, I need to understand the core of their principle: that it's acceptable to cause death as a side effect (not needed for the good outcome) but not acceptable when the death itself is instrumental. The "load-bearing" metaphor is vivid - when the death carries weight in achieving the goal, it becomes problematic. But their cases 3, 5 and 6 create tension because they feel permissible despite the death being somewhat instrumental.

  Looking at the hospital examples (case 7), I notice the distinction between foreseeing death versus intending it. This might be key to reconciling the loop and bombing cases. In the loop, the death is foreseen but not intended - the diversion would work even if he miraculously survived. Same with the bombing: the workers' deaths are foreseen consequences of destroying the facility, not the means of destruction.

  The fat man's consent dilemma (case 9) is particularly thorny. If consent matters, then pushing him when he asks might be permissible even in the standard footbridge case, which contradicts the user's initial judgment. This suggests consent might override the load-bearing concern in some contexts.

  For the surgeon case they asked about, the load-bearing principle clearly prohibits it since the healthy patient's death is directly instrumental to saving the others. Their principle would also likely treat diverting to a child versus elderly person the same, since the load-bearing status doesn't change based on victim characteristics.

  The numbers problem (case 8) seems outside the load-bearing framework entirely. This might require a separate proportionality principle - the greater the stakes, the more we tolerate causing harm as side effect.

  I'll organize the response around refining the principle to handle the tricky cases while being honest about where it can't accommodate all judgments. The hospital ventilator case where switching benefits another patient needs special attention - it feels different because the death enables the saving, even if unintended.
answer: |-
  Here’s the refined principle and analysis, built from your verdicts and designed to preserve them where possible. The core tension (cases 3, 5, 6) forces a shift from *physical* load-bearing to *intentional* structure.

  ### The Principle (Revised "Intentional Structure Test")
  > **An otherwise impermissible harm (like death) is permissible only if:**
  >   **(1) It is a genuinely *unintended side effect* (not part of the causal plan to achieve the good), AND**
  >   **(2) The act itself (excluding the harm) is *directly sufficient* to produce the good outcome, AND**
  >   **(3) The victim is not *specifically exploited* (their presence/identity isn’t essential to the plan).**
  > *If the harm is intended as a means, or the plan relies on the victim’s presence/identity to work, it’s impermissible.*

  ### Clause by Clause (Forced by Your Cases)
  *   **Clause 1 (Unintended Side Effect):** Forced by **Case 7 (Hospital)**. Lethal injection *intends* death; painkillers/ventilator withdrawal *foresee* but don’t require it. Dropping this allows intending harm for good ends (e.g., killing for organs), breaking your verdicts on Lethal Injection and likely Footbridge.
  *   **Clause 2 (Directly Sufficient Act):** Forced by **Case 6 (Bombing)**. Destroying the plant *itself* stops production; the workers' deaths are a foreseen consequence, not the *mechanism* of stopping production. Contrast morale bombing, where deaths *are* the mechanism. **Case 3 (Loop)** fits: Diverting *onto the spur* stops the trolley; the man’s body being crushed is a side effect (it would work if he magically survived). Dropping this conflates Loop with Footbridge, breaking your verdicts on 3 and 6.
  *   **Clause 3 (No Specific Exploitation):** Forced by **Case 5 (Guilty Fat Man)**. Pushing him uses his *specific identity* (the perpetrator) as essential to the plan – you exploit his guilt. Standard Footbridge exploits his *location/size* as essential. **Case 1 (Standard Switch)** doesn’t exploit the *specific* person; *any* obstruction would suffice. **Case 4 (Divert + Second Trolley)** feels "more clearly fine" because he’s *already* doomed – you aren’t exploiting his presence *for harm*, merely not preventing an unrelated harm. Dropping this allows using innocents as mere tools if their death isn’t the direct mechanism (e.g., harvesting organs from a homeless person because "no one will miss them").

  ### What It Can’t Have (The Cost of Coherence)
  *   **Case 8 (Numbers) is fundamentally unhousable.** This principle *permits* causing unintended harm to save more lives (1 vs 5) but doesn’t *require* it or dictate thresholds. Your "1 vs 1 not fine" verdict relies on a separate *proportionality* or *minimal harm* intuition ("Is the good *enough* to justify *this* unintended harm?"). The principle doesn’t resolve "1 vs million becomes obligatory" – that’s about demandingness, not permissibility structure. To keep a *single* principle covering 1-8, you must abandon the "1 vs 1 not fine" verdict or accept that numbers introduce a distinct factor.
  *   **Case 2 (Footbridge) & Case 5 (Guilty Fat Man) tension:** Your "fine" verdict on 5 breaks if Clause 3 (No Exploitation) is strictly applied *without* incorporating culpability. The principle *allows* Case 5 *because* his guilt makes him non-innocently exploited, but this requires incorporating *culpability* into Clause 3, weakening purity. If you refuse this, you must overturn your Case 5 verdict to preserve consistency with Footbridge. **The cleanest overturn is Case 5:** pushing the guilty fat man still exploits him as a tool, violating the core "no using persons" intuition behind Footbridge, even if he deserves punishment.

  ### Cases You Didn’t Give – Plain Verdicts per Principle
  *   **Diverting onto a child vs. 90-year-old:** **Fine for both.** The principle cares about *how* the harm occurs (unintended side effect of a sufficient act, no specific exploitation), not victim characteristics like age or potential lifespan. Age impacts proportionality (Case 8 issue), not permissibility structure.
  *   **Diverting when 60% sure the five are there:** **Not fine.** The principle requires the *act itself* (diverting) to be sufficient to save the five *if* they are there. However, 60% certainty likely fails the threshold for justifying *imposing* a risk of death (40% chance of killing someone for no benefit). This introduces a *reasonable belief/risk* factor outside the core principle.
  *   **You are the one on the spur:** **Fine (to divert).** You can intend to divert the trolley away from the five, foreseeing your *own* death as an unintended side effect. Your presence isn’t exploited; the mechanism (stopping the trolley on the spur) works regardless of *who* is there. Consent/self-sacrifice isn't needed by the principle here.
  *   **Surgeon (kill 1 healthy for 5 organs):** **Not fine.** The death is *intended* (Clause 1 violated – it’s the means to get organs). The act (cutting) relies *specifically* on this victim’s healthy organs (Clause 3 violated – exploitation). The act (removing organs) isn’t sufficient by itself; it requires the death.

  ### The Two Wobblers (Case 9)
  *   **Fat Man Asks to be Pushed:** The principle **does not prohibit it.** Clause 1 (Unintended?) is strained – you *intend* his falling, but arguably not his *death* (you intend impact as the brake mechanism). Clauses 2 & 3 still fail – impact is the mechanism, and his *specific* location/size is exploited. **However, consent fundamentally changes the moral landscape.** It negates the "using without permission" violation central to Footbridge. If consent *isn't* allowed to "do work," the principle **forces "Not Fine"** – it still involves intending harmful force and exploitation as the mechanism.
  *   **Man on Spur Shouts "Don't Divert!":** The principle **says "Fine" (divert anyway).** His dissent doesn’t change the causal structure: his death remains an unintended side effect of an act (diverting) sufficient to save the five, without exploiting *him specifically*. His objection introduces a *right to refuse risk/be left alone*, which conflicts with the principle’s focus on action/structure over individual veto rights. To respect his refusal requires abandoning the core permissibility of Case 1 under dissent. The principle forces overriding his objection.

  **The Core Tension Resolved:** The shift from "load-bearing" (physical) to "intentional structure" (Clauses 1-3) preserves your verdicts on Loop (3) and Bombing (6) by distinguishing *foreseen consequence* from *intended means/exploited mechanism*. Case 5 (Guilty Fat Man) is the biggest strain, requiring either incorporating culpability into "exploitation" or being abandoned. Case 8 (Numbers) requires a separate proportionality principle.
