prompt: |-
  Hey — I'm a science-and-ideas journalist, fifteen years in, mostly long-form, and a lot of what I actually do is decide who to believe: patients, whistleblowers, community groups with local knowledge, sources inside institutions, the guy who emails the newsroom at 2am. I've absorbed enough of the philosophy to know the vocabulary — testimonial injustice, where a hearer gives a speaker less credibility than they're owed because of some identity-linked prejudice; hermeneutical injustice, where the shared concepts just aren't there yet so the experience can't get said — but I don't want a tour of the literature and I can't check citations anyway. What I want is my own gut sorted out, because my gut is handing down verdicts that I can't fit into one principle.

  Here's where I land (all of these are composites of stories I've actually worked on):

  1. A nurse in a dialysis unit notices a cluster of infections, raises it internally, gets brushed off. Even when I interview her, I notice myself mentally weighting the hospital's statement above hers until I see the raw numbers. That's injustice, and some of it was mine. Definitely one of the clear ones.

  2. I discount press releases from a certain class of company by a fairly fixed factor, because historically they oversell by about that much. Just calibration. Fine, no guilt.

  3. The pair I keep going back and forth on. (i) I have a standing rule: ignore unsolicited technical claims from people with no affiliation I can check, because I get 200 a week and can't verify them. The rule has obvious disparate impact — it favours people with institutional affiliation, which correlates with class, education, country, fluency. I don't feel bad about it. (ii) A community meeting in a town near a smelter, residents describing an illness in their own words; I run roughly the same filter and miss the story for two years. That one I still feel bad about, and I call it injustice. These look like the same move to me — a filtering rule with disparate impact — and I don't know why I acquit one and convict the other.

  4. The mirror image. I once massively over-credited a polished, well-accredited academic talking about a field that wasn't his, mostly because of how he sounded and where he was from. Him? I don't think he was wronged. But the woman who actually knew that field, whom I never called because I already had my expert — her I think I did wrong, and I'm not sure whether that's the same kind of thing or a different animal entirely.

  5. The one that bothers me most, and I'm not sure why. A source in a citizen-science network — a farmer, no institutional backing — gives me the key observation. I believe her completely, I print it, but I attribute the explanation to the university scientist I also called, because I know my readers won't take it from her and I don't have column inches to establish her. I believed her and still took something from her. My gut says this is worse than the cases where I disbelieved someone — but it might just be that it's the one I'm still in a position to keep doing.

  6. Nobody's culprit. Non-English-language research basically never enters my newsroom's verification pipeline; no individual makes a bad credibility judgment; the upshot is that whole bodies of evidence never reach me. Injustice, but I can't locate the hearer.

  7. Not prejudice at all. An engineer flags a safety problem; management discounts him not because of what he is but because believing him costs them. My gut says this is the sharpest item on the list, worse than 1 — and yet it doesn't seem to be what the philosophical term picks out, since there's no identity prejudice in the hearer.

  8. Time travel. I reread my own 2009 coverage of people describing a set of symptoms that didn't get a clinical name for another decade. I didn't have the concept, couldn't have had it. Harm was real, but I don't think I did anything wrong, and I notice I resist calling it injustice — which sits oddly with how readily I say it in 6, where there's also nobody to blame.

  So: is there a principle that gets these, or most of them? I'd like it stated clause by clause with the case that motivates each clause. I want to know honestly which of my verdicts it makes me give up — I suspect 3(i) and 3(ii) can't both survive, and suspect something in the 4-vs-7 comparison has to go too. Whether the harm has to land on someone's standing as a knower, or whether the third-party and distributional stuff in 4 and 6 counts as the same thing. And then two cases I haven't made up my mind about, please: (a) I now deliberately adjust my credence upward for sources from groups that get systematically under-credited — is that repair, or is it a new epistemic sin where I'm managing people rather than trusting them; (b) my newsroom is piloting a tool that scores source reliability from how often past sources with similar profiles panned out — does your principle say anything about it, and if it's fine, is that for the same reason 2 is fine or for a different one?
reasoning: |-
  Okay, let me unpack this journalist's query. They're wrestling with credibility judgments that feel intuitively inconsistent across different reporting scenarios. The core tension seems to be between practical constraints (time, verification capacity) and the ethical/epistemic desire to avoid testimonial injustice. 

  Hmm, the eight cases present fascinating patterns. Cases 1 and 7 both involve institutional dismissal but differ crucially in motivation - prejudice versus cost-avoidance. The 3(i)/3(ii) pair is particularly thorny because identical filters (prioritizing institutional affiliation) feel justified in one context (technical claims) but unjust in another (community health). And then there's case 5 - believing a source but still withholding credit, which stings worse than disbelief.

  The journalist wants a principle that can: 
  - Explain their intuitive verdicts on each case 
  - Identify where those intuitions must be revised 
  - Clarify if harm to "standing as a knower" is essential 
  - Address the two unresolved questions about corrective credence and reliability algorithms

  I notice they're resisting philosophical jargon but need conceptual precision. The key might be disentangling three dimensions: 
  1) The hearer's motivation (prejudice? expediency?) 
  2) The harm's nature (individual standing vs collective epistemic exclusion) 
  3) Structural constraints (what's fixable vs inevitable)

  For case 3(i), the filtering rule seems defensible as a necessity defense - but only if paired with active outreach to mitigate its disparate impact. Whereas 3(ii) fails because the community's localized knowledge couldn't be verified through standard channels, demanding alternative methods.

  Case 4 reveals how crediting the wrong person creates dual harm: not just to the excluded expert, but to audiences deprived of accurate knowledge. The polished academic wasn't wronged as a knower, but the epistemic community was.

  On their unresolved questions: upward credence adjustment feels like repair only if it's transparent self-correction, not permanent paternalism. And the scoring tool? Depends entirely on whether "similar profiles" encodes biases or genuinely relevant expertise markers.

  The real breakthrough might be distinguishing blameless epistemic limitation (case 8) from culpable negligence (case 6). Not having concepts is inevitable; not building systems to access non-English research isn't.

  Ultimately their gut is wrestling with journalism's trilemma: verify everything, represent all voices, meet deadlines. No principle solves that - but naming the trade-offs might ease the conscience.
answer: |-
  Your cases reveal a tension between *individual credibility judgments* and *systemic epistemic harm* – and your gut is wrestling with the gap. Here’s a principle distilled from your verdicts, clause by clause, followed by where it challenges you and answers to your unresolved cases:

  ---

  ### **The Principle of Epistemic Repair & Harm Minimization**
  *(Clauses motivated by your cases)*

  1.  **Discount institutional power by default when harm is alleged, until disproven.**  
      *Motivated by Case 1 (Nurse):* Institutions have structural power to obscure truth; individual whistleblowers often bear disproportionate risk. Your initial weighting of the hospital over the nurse wasn’t just bias – it was a failure to account for this power asymmetry.  
      *Also applies to Case 7 (Engineer):* Management’s dismissal isn’t identity prejudice, but it *is* a power-based distortion. Your gut calls it "sharper" because intent to suppress truth + institutional leverage creates active harm, not passive neglect.

  2.  **Calibrate for known systemic bias, not just individual reliability.**  
      *Motivated by Case 2 (Press Releases):* Discounting corporate claims is calibration. *But* Cases 3(ii) (Smelter Town), 4 (Over-credited Academic), 5 (Farmer’s Stolen Credit), and 6 (Non-English Research) show the *absence* of calibration where systemic under-credibility exists. Your guilt in 3(ii) stems from *failing* to apply an *upward* calibration for a group historically excluded from epistemic channels (affected residents), while comfortably applying a *downward* calibration for corporations.

  3.  **Filtering is justified only if unavoidable *and* mitigated by active outreach.**  
      *Motivated by Case 3(i) vs 3(ii):* Ignoring unsolicited technical claims (3i) *is* pragmatically necessary. But 3(ii) is different because:  
      - The community’s knowledge was *locally irreplaceable* (unlike random technical claims).  
      - You could have *proactively sought* such testimony (e.g., "I investigate industrial pollution; contact me if your community has health concerns").  
      *Verdict change required:* 3(i) survives only if paired with active efforts to reduce disparate impact (e.g., curated channels for unaffiliated experts). 3(ii) fails because the filter was applied *passively* to a group whose exclusion you should have anticipated.

  4.  **Credibility theft harms both the source and the audience.**  
      *Motivated by Case 5 (Farmer/Scientist):* Taking the farmer’s observation but crediting the scientist isn't *just* unfair to her ("testimonial smothering" – she’s prevented from being known as a knower). It also *misleads your audience* about how knowledge is produced (implying only institutions generate valid insight). This dual harm makes it feel "worse" than disbelief.

  5.  **Structural injustice exists even without a culpable hearer.**  
      *Motivated by Case 6 (Non-English Research) vs Case 8 (2009 Symptoms):* Case 6 is injustice because the exclusion is *remediable* (your newsroom *could* build multilingual capacity). Case 8 isn’t injustice because the concepts *didn’t exist* – no amount of virtue or effort could have captured it then. Harm without culpability ≠ injustice. Your resistance in Case 8 is correct.

  6.  **Harm to standing as a knower is sufficient, but not necessary, for injustice.**  
      *Motivated by Case 4 (Over-credited Academic):* The excluded female expert *was* wronged in her standing as a knower (her expertise was disregarded). The polished academic wasn’t wronged *as a knower* (he was over-credited). But *epistemic harm occurred*: your audience received flawed information. Case 7 (Engineer) is similar: no identity prejudice, but active suppression of truth harms the epistemic community.  
      *Verdict change:* Your intuition in Case 4 holds. Case 7 is "sharper" because it involves *willful* suppression, but both are epistemic harms requiring repair.

  ---

  ### **Where the Principle Challenges Your Verdicts**
  - **3(i) must be modified:** Your "no guilt" stance only holds if you actively mitigate the filter’s disparate impact (e.g., partnering with citizen-science networks). Passive filtering entrenches injustice.
  - **4 vs 7 survive:** They’re distinct but both harmful. Case 4 is negligence enabling miscrediting; Case 7 is intentional suppression. Both demand systemic fixes.
  - **"Standing as a knower" clarified:** It’s central in Cases 1, 3(ii), 4 (the woman), and 5. But Cases 6 and 7 show harm can be collective (excluded knowledge, suppressed truth) without targeting an individual’s standing. Your gut is tracking both.

  ---

  ### **Your Unresolved Cases**
  **(a) Upward credence adjustment for systematically under-credited groups:**  
  - **This is repair, not a sin** – *if* done transparently as conscious compensation for known bias. It becomes problematic only if:  
    - It replaces listening to *individual* merit ("I believe her *only* because she’s in Group X").  
    - It’s a permanent crutch instead of fixing the systems causing under-credibility (e.g., diversifying expert databases).  
    Your calibration in Case 2 (press releases) is downward for institutional bias; this is the necessary mirror for marginalized voices.

  **(b) Algorithmic source reliability scoring:**  
  - **Potentially justifiable, but only under strict conditions:**  
    - **If** "similar profiles" are *strictly relevant expertise markers* (e.g., "published 5 peer-reviewed papers on this topic") – similar to Case 2’s calibration.  
    - **Not if** profiles include identity/proxies (location, institution, language fluency) that bake in existing biases – which would replicate Case 6’s exclusion.  
    - **Requires** transparency, audit trails, and human override.  
    *Verdict:* Fine for *expertise* scoring (like Case 2). Dangerous for *credibility* scoring (invites Case 3(i)’s disparate impact).

  ---

  ### **The Core Tension Resolved**
  Your gut distinguishes between **unavoidable epistemic limitations** (no concept yet, volume of submissions) and **remediable epistemic exclusion** (ignoring non-English research, discrediting local knowledge). Injustice occurs when exclusion is *systemic and fixable* but unaddressed. The principle demands:  
  1. **Acknowledge power asymmetries** (institutions vs individuals).  
  2. **Actively correct for known biases** (upward *and* downward calibration).  
  3. **Mitigate filtering side-effects** (outreach > passivity).  
  4. **Credit is inseparable from credibility** – stealing one harms both.  
  5. **Structural harms require structural solutions**, even without a "culprit."

  Your guilt is the engine of epistemic repair. It flags where your systems – or the world’s – are failing. Listen to it.
