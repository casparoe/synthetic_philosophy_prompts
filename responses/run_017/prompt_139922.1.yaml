  Let's design the 10 items:

  Item 1: Adaptive preferences
  Case: After years in prison, a prisoner says they have adjusted and are now content with very little. They say their wellbeing is now as high as it was before prison. However, before prison they had a rich social life and many opportunities.
  A. We can compare the prisoner's wellbeing now to their wellbeing before prison, and we can say that it is lower now because they have fewer opportunities.
  B. We cannot compare the prisoner's wellbeing across time because their preferences have changed. We can only take their current report at face value.
  C. We can compare, but only in an ordinal way: we can say that their life before was better, but we cannot say by how much.

  Item 2: Incommensurable vocabularies
  Case: Two people from very different cultures describe their wellbeing. One uses concepts of "harmony with nature" and the other uses "achievement in career". They use different terms and value different things.
  A. We can still compare their wellbeing because there is a common underlying reality of wellbeing that these terms are pointing to.
  B. We cannot compare their wellbeing because there is no common measure or translation between their descriptions.
  C. We can compare in a rough ordinal way (e.g., when one is clearly better off than the other) but not in a precise cardinal way.

  Item 3: Disagreement about ratios (ordinal vs. gap)
  Case: Two people, Alex and Bailey, both agree that Alex's state in situation 1 is better than in situation 2, and Bailey's state in situation 1 is better than in situation 2. But they disagree on the size of the gaps. Alex thinks the improvement for Alex from 2 to 1 is about twice as big as the improvement for Bailey from 2 to 1. Bailey thinks it is ten times as big.
  A. There is a fact of the matter about the ratio of the improvements; one of them is correct and the other wrong.
  B. There is no fact of the matter about the ratio; we can only say that both improvements are positive (ordinal) but not compare their sizes.
  C. We can compare the sizes in a rough way (e.g., one is much bigger than the other) but not precisely.

  Item 4: Intrapersonal comparison with memory loss
  Case: An elderly person with severe memory loss and changed values (e.g., now values only simple pleasures, whereas before they valued intellectual pursuits) says they are just as happy now as they were in their youth.
  A. We can compare their wellbeing across time because there is a single person, and we can use an objective standard of what is good for them.
  B. We cannot compare their wellbeing across time because the person has changed too much (different values, memory loss) — it's like two different people.
  C. We can compare in an ordinal way (e.g., we might say one period was better than the other) but not cardinally.

  Item 5: Disagreement about currency (second-order disagreement)
  Case: Two people, Chris and Dana, disagree about what constitutes wellbeing. Chris thinks wellbeing is about pleasure and pain, while Dana thinks it is about achieving one's goals. They are trying to compare their own wellbeing.
  A. We can still compare their wellbeing because one of these theories is correct and we can use that to measure both.
  B. We cannot compare their wellbeing because there is no agreed-upon currency and no way to resolve the dispute.
  C. We can compare by using a common currency that both might accept (like resources) or by looking for an overlapping consensus.

  Item 6: Aggregation with dispersed group (utility monster variant)
  Case: A policy gives a very small benefit to each of a billion people, and the total benefit is the same as a policy that gives a large benefit to one person. The dispersed group option is chosen over the concentrated one.
  A. This is the right choice because the total benefit is the same and we should maximize total wellbeing.
  B. This is the wrong choice because the individual large benefit is more significant than the sum of many small ones.
  C. It is indeterminate which is better because we cannot aggregate across people.

  Item 7: Variable population (adding a barely worth living life)
  Case: Consider a population of 1 million people, all with very high wellbeing. Then we add one more person whose life is barely worth living (just above the threshold of not being worth starting). The new situation has the same 1 million plus one.
  A. This is an improvement because we have added a life worth living.
  B. This is a worsening because the average wellbeing decreases (even though total increases).
  C. This is indeterminate because we cannot compare the wellbeing of the new person to the existing ones.

  Item 8: Intrapersonal comparison without memory loss (control without complication)
  Case: A person at two times in their life (with continuous memory and stable values) reports that they were happier at time 1 than at time 2.
  A. We can compare and say that their wellbeing was higher at time 1.
  B. We cannot compare because wellbeing is subjective and we only have their report, which might be inaccurate.
  C. We can compare ordinally (we know time 1 was better) but not cardinally.

  Note: This is a control to see if people are more relaxed when there are no complications. We expect most to say A or C, but if they say B then they are skeptical even in the easy case.

