        "verdict": which grade, or "the scheme doesn't cover it",
        "controlling_consideration": the one distinction that settles it,
        "confidence": "high" | "medium" | "low"
    ],
    "my_distinctions": [ two objects, one for one-shot vs recursive Popperian, one for the scaffold degradation test; each with:
        "name": the name,
        "does_real_work": "yes" | "no" | "partly",
        "what_it_gets_right": one or two sentences,
        "where_it_breaks": one or two sentences,
        "suggested_fix": one sentence
    ],
    "llm_verdict": { "grade": ..., "reason": two or three sentences, "what_would_settle_it": one sentence },
    "still_confused_about": one sentence
  }

  Valid JSON only, no code fences and no commentary after it. And no bibliography or citations -- I've got the reading, I just need the distinctions straightened out.
