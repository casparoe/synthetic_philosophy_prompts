  ### Decision Tree for Positions in the Adaptationism Debate

  This decision tree helps you identify your position in the adaptationism debate based on your answers to methodological and conceptual questions about trait explanation. The tree starts with a common commitment: you encounter a trait and want to explain why it exists. Answer the questions in order, using concrete traits for illustration. Your path through the tree ends at a named position, with a note on its most awkward commitment. Traits are drawn from the peacock's train, panda's thumb, human chin, male nipples, redness of blood, and human navel (feathers omitted to use exactly six).

  #### Indented List of Nodes
  1. **When you encounter a trait, what is your initial explanatory focus?** (Illustration: Peacock's train—do you focus on mate attraction now, or how it arose?)  
     - A) **Why it currently contributes to fitness (design question).** → Go to node 2.  
     - B) **How it was maintained over time (maintenance question).** → Go to node 3.  
     - C) **Why it originated or increased initially (etiological question).** → Go to node 4.  

  2. **If a trait has a current function, is that function sufficient evidence it was shaped by natural selection for that role?** (Illustration: Peacock's train—if it attracts mates now, does that prove it evolved for that?)  
     - Yes → **Leaf: Panglossian** (treats current utility as sufficient evidence of selection).  
       - *Most awkward commitment: Must ignore evidence of non-adaptive origins (e.g., panda's thumb, which evolved for a different reason).*  
     - No → Go to node 5.  

  3. **If a trait is maintained by selection now, is that sufficient evidence it was originally selected for the same role?** (Illustration: Panda's thumb—if it aids grasping now, does that mean it evolved for grasping?)  
     - Yes → **Leaf: Maintenance-launderer** (confuses maintenance with etiology).  
       - *Most awkward commitment: Overlooks traits like human chin, which may be maintained by selection but arose as a byproduct.*  
     - No → Go to node 6.  

  4. **Should a trait's origin explanation be deferred until after testing its current fitness contribution?** (Illustration: Redness of blood—should we first test if the color aids oxygen transport before asking how it arose?)  
     - Yes → Go to node 7.  
     - No → Go to node 8.  

  5. **When a trait has a current function but didn't originate for it, is it primarily...?** (Illustration: Panda's thumb—a wrist bone co-opted for grasping.)  
     - A) **A co-option from a past adaptation (exaptation).** → **Leaf: Exaptation-centred** (emphasizes functional shifts).  
       - *Most awkward commitment: May misclassify byproducts (e.g., human chin) as exaptations by assuming past utility.*  
     - B) **A co-option from a non-adaptive byproduct (spandrel).** → **Leaf: Byproduct-or-spandrel** (emphasizes non-adaptive origins).  
       - *Most awkward commitment: May misclassify exaptations (e.g., feathers for flight) as spandrels by downplaying past selection.*  

  6. **If a trait lacks a current function, what most commonly explains its presence?** (Illustration: Male nipples—no function, but developmentally linked.)  
     - A) **Drift, noise, or neutral evolution.** → **Leaf: Drift-and-noise-first** (prioritizes stochastic processes).  
       - *Most awkward commitment: May attribute constraint-based traits (e.g., human chin) to drift.*  
     - B) **Developmental or structural constraints.** → **Leaf: Constraint-or-structure-first** (prioritizes internal limits).  
       - *Most awkward commitment: May attribute drift-based traits to constraints, ignoring population-level noise.*  

  7. **Is the function of a trait defined by its current fitness contribution?** (Illustration: Redness of blood—function is oxygen transport, not the color itself.)  
     - Yes → **Leaf: Deflationary** (rejects historical function).  
       - *Most awkward commitment: Vestigial traits (e.g., human navel) have no function, even if historically significant.*  
     - No → Go to node 8.  

  8. **Must an explicit optimality model (with a null hypothesis) be tested before accepting any explanation?** (Illustration: Human navel—should we model its optimality despite no clear function?)  
     - Yes → **Leaf: Abstentionist** (demands formal modeling).  
       - *Most awkward commitment: Requires models for obvious cases (e.g., peacock's train), risking inefficiency.*  
     - No → Go to node 9.  

  9. **How often is natural selection the primary explanation for traits?** (Illustration: Human chin—selection as a default or exception?)  
     - A) **Almost always or often.** → **Leaf: Frequency adaptationist** (claims selection is pervasive).  
       - *Most awkward commitment: Must force selective explanations for non-adaptive traits (e.g., redness of blood).*  
     - B) **Rarely or almost never.** → **Leaf: Pluralist** (Gould-Lewontin-inspired; emphasizes multiple causes).  
       - *Most awkward commitment: May understate selection's role in clear adaptations (e.g., peacock's train).*  
     - C) **It depends; no default without evidence.** → **Leaf: Heuristic adaptationist** (treats adaptation as testable default).  
       - *Most awkward commitment: Risks bias by assuming adaptation first (e.g., for male nipples), overlooking alternatives.*  

