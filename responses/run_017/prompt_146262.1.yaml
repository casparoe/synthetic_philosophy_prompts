prompt: |-
  You are a professional philosopher of science who specializes in explanation in evolutionary biology: you know the optimality-modelling literature, the developmental and structuralist critiques of selectionist explanation, and the competing theories of biological function, and you have taught this material often enough to know how sharply a student's stated label can come apart from what they actually say about a concrete trait. Please think carefully, and work in two stages. First brainstorm: enumerate the independent questions that organise this debate, say how many answer-combinations they generate, and mark which combinations you expect to be unoccupied. Only then build the instrument. Do not consult or cite any source; I need something I can photocopy, built out of distinctions and cases rather than out of footnotes.

  I am a PhD student putting together a handout for a second-year seminar on explanation in evolutionary biology, and what I want is a decision tree of positions in the adaptationism debate, in the spirit of the Gould-Lewontin spandrels critique: a flowchart that starts from one entry commitment every student in the room already has, branches on questions, and terminates in named positions.

  The angle I care about, and which standard survey articles muddle, is the difference between the etiological question (what caused this trait to originate, or to increase in frequency, in this lineage?), the maintenance question (what keeps it at its present frequency now?), and the design question (what does it contribute to fitness now?). I have been calling the practice of answering the first with evidence that only bears on the second maintenance-laundering, and calling the mismatch between a trait's origin-explanation and its maintenance-explanation the palimpsest problem. Both must appear as branch nodes in your tree, placed where they do real diagnostic work, and the tree should be able to send a trait that is an adaptation by one of these questions and not another to a leaf that says so.

  Constraints on the design:

  Every branch node must be phrased as a question a student could answer without knowing any position-name, and no node may mention a label, an ism, or an author. Each node must be illustrated by one concrete trait, drawn from the peacock's train, the panda's thumb, the human chin, male nipples, the redness of blood, the human navel, and feathers; use at least six of the seven, and let at least one node turn on a case where the same trait is an adaptation under one of the three questions and not under another.

  Build the tree from the logical space rather than from a list of names: questions and allowed answer-combinations first, positions located in the space afterwards. Aim for roughly eight branch nodes and eight to ten leaves. Among the leaves, the following must have a home: the Panglossian who treats current utility as sufficient evidence of selection for it; the heuristic or methodological adaptationist who treats adaptation as the default hypothesis to be abandoned when it fails; the frequency or empirical adaptationist who makes a claim about how often selection is the right explanation; a drift-and-noise-first leaf; a constraint-or-structure-first leaf; an exaptation-centred leaf that is kept strictly distinct from a byproduct-or-spandrel leaf, with the distinction stated in a way that would settle a contested case; a deflationary leaf on which function just is current contribution to fitness and the etiological question is declined; and an abstentionist leaf on which no classificatory verdict is available until an explicit optimality model with a null alternative has been specified and tested. One further leaf must be the pluralist position their 1979 paper is standardly read as defending, and its note should say whether you think that reading is right.

  Give me the tree twice: as an indented list of nodes in plain text, and as a compact path table, so that a student who answers the nodes in order can look up their pattern and find their leaf. Each leaf carries one sentence on its most awkward commitment.

  Then two closing sections. First, at least two of the combinations your questions generate should be unoccupied; name them and diagnose each as incoherent, historically occupied but abandoned, or merely unexplored and possibly worth defending. Second, flag any pair of leaves your tree cannot genuinely separate, and say what further question would be needed; I expect at least one such pair, and I would rather have the failure stated than papered over. Before you finish, reread every node and check that a competent student who had never heard the word adaptationist could answer it.
