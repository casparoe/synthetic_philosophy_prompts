prompt: |-
  I am an undergraduate in a political theory seminar this term, and our final assignment is a short position paper, a draft of which is due next week. Before I commit myself to it I would be grateful for an audit of the package of claims I want to defend, because I have a feeling that some of them are quietly working against the others and I cannot tell which. Here it is, more or less as I plan to write it.

  (1) The left/right distinction is real. Every couple of decades it is declared obsolete — by technocracy, by the end of history, by whatever the current version of that announcement is — and on each occasion something recognizably left and something recognizably right re-forms within a few years. I want to treat that recurrence as evidence that the scheme tracks something, and not merely as evidence that we are creatures of habit.

  (2) But its content is almost entirely plastic. Which question divides the sides rotates: at one point it is whether the state should be confessional or whether bishops should sit in the legislature; later it is whether steel and railways should be publicly owned; in our own period it is more likely to be who belongs to the nation or who may use which pronoun. The valence of institutional arrangements flips too. As I understand the history, in one era the people most eager to use central state power against local majorities were the ones demanding nationalization, while the language of states' rights belonged to the defenders of racial hierarchy; now the same language is used by states against municipalities, and by one side about abortion and by the other about immigration. So I hold that no particular policy is intrinsically left-wing.

  (3) What I take to be constant is not a policy but an attitude toward inequality: the left treats the large inequalities of a society as made, contingent and in principle removable, the right treats them as natural, deserved, or at any rate not to be undone by collective action. This is roughly the egalitarian reading of the distinction that we were given in the Bobbio book, and I may well be simplifying it.

  (4) The distinction is also not one dimension. Economic and cultural conservatism come apart constantly: there are many people who want a much larger welfare state, strong unions and a restrictive immigration regime, and many who want free markets and permissive social norms, and these people are not rare or confused, they are the median voter in several countries. Whatever the scheme is, it cannot be one axis.

  (5) And most ordinary citizens are not ideological in any strict sense. If you ask the same person whether the government should guarantee everyone a job and whether the government should stop interfering in the economy, you frequently get yes to both. So the distinction lives, in the first instance, among parties, elites, intellectuals and activists, not in the beliefs of the mass public.

  (6) It is also geographically parochial. The scheme was forged in a particular European argument, and across much of the world the cleavage that actually organizes politics is centre versus periphery, or religion, or ethnicity, or patronage, or anti-colonial sovereignty. When commentators force those onto a left/right map they usually end up saying that every serious party is on the left, which suggests the map is doing no work there.

  (7) My own positive suggestion, the part I am least certain about and most attached to, is that what holds each side together is not a principle but a shared set of opponents. When I want to know where some new movement belongs, what I actually check is not its programme but who attacks it, which established interests it threatens, which party it is fighting. This test works surprisingly well, including for movements whose stated principles sit badly with their supposed side. It would also explain (2), since the programme rotates as the enemy rotates, and it would explain the instability of the coalitions in (4), since a negative coalition has nothing to hold it once the enemy stops being useful. My worry — and I genuinely cannot tell whether it is fatal — is that if I make this load-bearing I will have quietly given up (1) and (3). A distinction held together only by what it is against can in principle exchange its entire content while remaining, on my own account, the same distinction; and then it is unclear what the recurrence in (1) was supposed to be evidence for, or what role (3) is playing beyond describing whatever the left happens to believe this decade.

  What I would like is the following, and I would rather have it as an audit than as an essay. First, which pairs among these are genuinely in tension, ordered from most to least severe, and for each one what exactly would have to give and what the cheapest revision would cost me. Second, which pairs only look like they are in tension, and why the appearance dissolves — I strongly suspect there is at least one, maybe between (2) and (3) or between (5) and (1), but I do not trust my own sense of which. Third, tell me which single claim is actually load-bearing and which is decorative, and specifically whether the package survives if (7) is dropped or demoted to a causal story about how coalitions happen to form, with (3) left in charge of content. Please be concrete about which numbered claim has to go or be qualified rather than telling me that the whole area is contested: I know it is contested, I have a draft due.
reasoning: |-
  Okay, the user is an undergraduate in a political theory seminar working on a position paper. They've outlined seven key claims and are concerned about internal tensions. Let me start by understanding each point clearly.

  First, claim (1) asserts the left/right distinction is real and recurrent. Claim (2) says its content is plastic, with issues and institutional valences changing over time. Claim (3) posits a constant attitude toward inequality as the core. Claim (4) argues the distinction isn't unidimensional, noting splits between economic and cultural conservatism. Claim (5) states most citizens aren't ideologically consistent. Claim (6) points out the scheme's European origins and limited global applicability. Claim (7) proposes that each side is held together by shared opponents, not principles.

  The user's main worry is that claim (7) might undermine claims (1) and (3). If coalitions are defined by opposition, the content could change entirely, making recurrence (1) meaningless and reducing (3) to a temporary belief. 

  I need to analyze tensions between the claims. The biggest conflict is between (7) and (1)/(3). If opponents define the sides, then the core attitude in (3) might not be stable, and recurrence in (1) loses its meaning. Also, (5) and (1) seem at odds because if the masses aren't ideological, how does the distinction persist? But (5) focuses on mass beliefs, while (1) refers to elite-level structures, so they can coexist if the distinction is institutional rather than popular.

  Between (2) and (3), plasticity of policies versus a constant attitude isn't inherently conflicting. Policies change, but the underlying stance on inequality remains. (4) and (3) might seem to clash because multiple dimensions could fracture the core attitude, but (3) can still be the common thread even amid other divides.

  The user also needs to know which claim is load-bearing. (3) seems central, as it explains the recurrence in (1) and the plasticity in (2). If (7) is demoted to a mechanism for coalition formation, (3) can still anchor the content. Dropping (7) might strengthen the argument by keeping the core principle intact.

  For revisions, the user should qualify (7) as a mechanism, not the defining feature. Emphasize that the oppositional aspect shapes coalitions, but the core attitude in (3) defines the sides. Also, clarify that (1)'s recurrence is due to persistent inequality attitudes, not just habit. 

  The user's deeper needs include a coherent framework for their paper, ensuring their original insights aren't lost while addressing tensions. They might also want validation of their approach while receiving concrete fixes to strengthen their argument before the deadline.
answer: |-
  Here's an audit of your claims, structured as requested. Your instincts about tensions are sharp, and the package is coherent with strategic revisions. The core load-bearing claim is **(3)**; **(7)** is the main source of tension but can be salvaged as a mechanism rather than a definition.

  ### I. Genuine Tensions (Ordered by Severity)
  1.  **Tension: (7) vs. (1) & (3) (Most Severe)**
      *   **Nature of Conflict:** Your positive suggestion (7) – that sides are defined *solely* by shared opponents – directly threatens the core claims (1) and (3). If the "left" is *only* whoever the current "right" opposes (and vice versa), then:
          *   **(1) Recurrence:** The *recurrence* of the distinction loses its deeper meaning. It becomes evidence *only* of persistent tribalistic opposition, not of a recurring *substantive* divide (like attitudes to inequality). The "something recognizably left/right" reforming is just habit and oppositional dynamics, not tracking an underlying constant.
          *   **(3) Core Attitude:** The "constant attitude toward inequality" becomes merely the *current content* of the left's position within the oppositional dynamic. It has no necessary, defining status. The left could, in principle, adopt the *right's* attitude on inequality tomorrow if its opponent coalition shifted dramatically, and (7) would still label it "the left" based on who opposes it.
      *   **What Has to Give:** Claim (7) cannot be the *definitional core* of the left/right distinction without dissolving (1) and (3) into epiphenomena of opposition.
      *   **Cheapest Revision:** **Demote (7) from a definition to a powerful *mechanism*.** Revise to: "While a shared set of opponents is a crucial *mechanism* holding each coalition together *tactically* and shaping its specific policy agenda (explaining plasticity (2) and instability (4)), the *recurring identity* of each side (1) and its *core normative commitment* (3) – the attitude toward socially produced inequality – provides the deeper, substantive basis for the distinction and explains its persistence beyond mere opposition." This keeps (7)'s explanatory power for plasticity/instability but anchors recurrence and core content in (3).

  2.  **Tension: (5) vs. (1)**
      *   **Nature of Conflict:** If the distinction "lives... among parties, elites, intellectuals and activists, not in the beliefs of the mass public" (5), how can it be a "real" (1) and recurring organizing principle of politics? Doesn't mass politics drive the system? The recurrence seems elite-driven, potentially artificial.
      *   **What Has to Give:** The claim that the distinction is *only* elite-based needs softening. Alternatively, the definition of "real" in (1) needs clarification.
      *   **Cheapest Revision:** **Qualify (5) and refine (1).** Revise (5) to: "Most ordinary citizens are not ideologically *consistent or systematic* in the manner of elites, and their policy preferences are often contradictory or non-aligned. *However,* the left/right distinction remains potent *because* it structures elite competition, party platforms, media discourse, and institutional conflict – the channels through which politics is primarily conducted and which shape mass political identities *over time*, even if inconsistently held at the individual level." This maintains the observation of mass inconsistency while explaining how the elite-level distinction (1) *becomes* politically real and recurrent by structuring the political field.

  3.  **Tension: (2) vs. (3) (Minor)**
      *   **Nature of Conflict:** If the *content* is "almost entirely plastic" (2) and "no particular policy is intrinsically left-wing," how can a *constant attitude* (3) be the core? Doesn't plasticity undermine constancy?
      *   **What Has to Give:** The phrasing in (2) needs to explicitly accommodate the constancy of (3).
      *   **Cheapest Revision:** **Clarify the relationship explicitly.** After stating (3), add: "This core attitude, however, finds expression through *highly plastic* policy agendas and institutional preferences (2), as the specific manifestations of inequality and the feasible means of addressing (or preserving) them change across historical contexts and political battles." This frames plasticity as the *form* the constant attitude takes, not a contradiction.

  ### II. Apparent Tensions (That Dissolve)
  1.  **(4) vs. (3): Multi-Dimensionality vs. Core Attitude**
      *   **Apparent Tension:** If the distinction isn't one dimension (4), how can there be one core attitude (3)? Doesn't multi-dimensionality fracture the core?
      *   **Why it Dissolves:** The core attitude (3) is the *underlying normative commitment*, not the *empirical dimension* of political competition. Bobbio's point is that *despite* the multi-dimensionality of political conflict (4), the fundamental *normative* divide over the legitimacy and malleability of social inequality (3) provides the deepest, recurring fault line *around which* coalitions (often unstable and multi-dimensional) form. Your observation in (4) actually *supports* the need for an underlying principle like (3) to explain why disparate groups (e.g., economic leftists + social conservatives) might *temporarily* align under a "left" or "right" banner against a perceived common enemy (as per your revised (7) mechanism), even if their core values conflict on other dimensions. (3) explains the *potential* for alignment on the core axis, (4) explains why the coalitions are messy, and the revised (7) explains *how* the messy coalitions hold together tactically.

  2.  **(6) vs. (1): Parochialism vs. Reality**
      *   **Apparent Tension:** If the scheme is parochial (6), how can its recurrence prove it's "real" (1)?
      *   **Why it Dissolves:** Claim (1) asserts the reality *within the specific context where it emerged and is operational* (primarily Western democracies). Claim (6) correctly asserts its limitations *outside* that context. You are not claiming the left/right scheme is a universal law of politics, only that within its domain (modern nation-states with certain institutional features and political cultures), its recurrence indicates it tracks something real *there*. (6) reinforces this by showing the scheme fails where the underlying conditions (like the nature of the state, cleavages) differ. This is a qualification of scope, not a contradiction of reality within scope.

  ### III. Load-Bearing vs. Decorative Claims
  *   **Load-Bearing Claim: (3)**. This is the indispensable core of your argument. It provides the *substantive reason* for the distinction's recurrence (1), explains *why* the content can be plastic (2) (same attitude applied to new inequalities), offers a principle *around which* multi-dimensional coalitions (4) can (unsteadily) coalesce, and justifies why the elite-level distinction (5) matters (it structures conflict over this fundamental question). Dropping (3) collapses the argument into either pure oppositional politics (if only (7)) or mere description of recurring labels without substance.
  *   **Decorative Claim:** None are purely decorative, but **(6)** is the most self-contained and could be presented as a significant qualification/caveat without undermining the core argument about the scheme's operation *within* its relevant domain. Its removal wouldn't structurally damage (1)-(5) or the revised (7).
  *   **The Fate of (7):** As argued in I.1, **(7) cannot be load-bearing** without destroying (1) and (3). **However, it is too valuable to drop entirely.** The solution is **demotion + integration:**
      *   **Drop** it as the *definition* of left/right.
      *   **Demote** it to a key *causal mechanism* explaining coalition formation, plasticity (2), and instability (4).
      *   **Integrate** it by arguing that while the *core normative commitment* (3) defines the sides substantively and enables recurrence (1), the *tactical coalitions* and *specific policy agendas* are powerfully shaped by the dynamics of opposition and shared enemies (7). This explains *how* the core attitude manifests in changing ways without displacing the core attitude itself as the defining feature. *Example:* The left's core egalitarian attitude targets the most salient, socially produced inequalities of the era; *which* inequalities these are, and *who* benefits from or defends them, determines the coalition partners and enemies (7), leading to policy plasticity (2).

  **Conclusion & Package Survival:** Your package **survives and is strengthened** by:
  1.  **Firmly anchoring** it in **(3)** as the core, defining principle.
  2.  **Demoting (7)** to a crucial *mechanism* explaining plasticity (2), coalition instability (4), and *tactical* cohesion, but **not** definitional content.
  3.  **Qualifying (5)** to explain how an elite-driven distinction structures mass politics.
  4.  **Explicitly linking (2)** to (3) (plasticity of form, constancy of core).
  5.  **Accepting (6)** as a vital scope condition.

  **Revised Core Narrative:** The left/right distinction recurs (1) because it tracks a fundamental, enduring normative divide over the legitimacy and malleability of major social inequalities (3). The *specific policies and coalitions* expressing this divide are highly plastic (2) and often multi-dimensional/unstable (4), shaped significantly by the dynamics of opposition to perceived common enemies (7 - revised). While most citizens don't hold consistent ideologies (5 - qualified), the distinction remains real by structuring elite competition and institutional conflict. Its relevance, however, is geographically limited (6). **This makes (3) the load-bearing claim, with (7) providing an important causal mechanism for observed plasticity and instability, not a replacement for (3).**

  This revision resolves the major tensions while preserving your core insights and allowing you to keep all seven claims, albeit with nuanced revisions to (5) and especially (7). Good luck with the draft!
