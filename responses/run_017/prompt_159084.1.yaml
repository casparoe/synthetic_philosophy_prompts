prompt: |-
  Hi — I keep hiting Simpson's paradox at work (I do analysis for a health service, mostly A/B tests and the odd observational study), and I've noticed my gut verdicts don't add up to anything tidy. Can you find the principle behind them?

  1. Severity-graded treatment: X is given more often to the severe cases. Within both the mild and the severe stratum X beats Y; overall X does worse. I trust the strata — X is the better treatment.
  2. A job-training programme: among completers and among dropouts, attendees do worse; overall attendees do better. Here I think the strata are cheating and the aggregate is the honest number.
  3. An online A/B test where traffic to B was ramped up over the month while conversion rises towards payday: overall B wins, within every week A wins. I go with the weekly strata — A.
  4. A regional reversal that vanishes when I split further by hospital within each region: I don't buy it and fall back on the overall figure. That feels inconsistent with 1, where the reversal survives when I grade severity more finely — but that's the only difference I can put my finger on.
  5. Deciding whether to defund a procedure nationally: it's better in every hospital but worse overall because the worse hospitals use it more. I want different answers for "should this hospital use it?" and "what happens to national numbers if we ban it?" — I can't tell if that's legitimate or just me hedging.

  The one I go back and forth on: stratifying on a genuine pre-treatment risk factor where the reversal only shows up in a stratum of six people. Half of me says ignore it as noise, half says causal structure beats sample size.

  Is there one principle, or a short list, that gets these? State it precisely, say which clause each of my cases motivates, tell me what it predicts for a case I haven't listed, and be straight about which verdicts it can't accommodate. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate the question back at me.
reasoning: |-
  Okay, the user is dealing with Simpson's paradox in their health service analysis work. They've described several scenarios where aggregated data shows one trend, but when stratified, the trend reverses or changes. They want a unified principle to guide their decisions. 

  First, I need to identify the core issue across all examples. The key seems to be whether stratification is necessary to avoid confounding. In scenario 1, severity is a confounder; giving X more to severe cases biases the overall result. Stratifying by severity adjusts for this, so the stratum-specific results are trustworthy. 

  In scenario 2, the job-training program, the strata (completers vs. dropouts) are likely affected by the treatment itself. This is post-treatment stratification, which introduces selection bias. Here, the aggregate is more honest because it avoids conditioning on a collider. 

  Scenario 3 involves time-varying confounding. The ramp-up of traffic to B coincides with conversion changes due to payday. Weekly stratification adjusts for this temporal confounder, making the within-week comparisons valid. 

  Scenario 4 has a regional reversal that disappears with finer hospital-level stratification. This suggests the initial regional stratification didn't fully capture confounding; hospital-level splits reveal the true relationship. The overall figure is confounded, so it's unreliable. 

  Scenario 5 highlights the difference between conditional and marginal effects. For individual hospital decisions, the conditional effect (within-hospital) is relevant. But for national policy, the marginal effect (overall) matters because it accounts for usage patterns across hospitals. 

  The unresolved case about a small stratum with a reversal touches on the trade-off between causal structure and statistical power. If the stratification variable is a genuine pre-treatment confounder, the stratum-specific result might be real despite small sample size. However, practical considerations like statistical power might necessitate using aggregated data. 

  The unifying principle is that stratification is necessary when the stratifying variable is a confounder but harmful when it's a collider or mediator. The decision to stratify depends on the causal structure, not just statistical reversal. 

  For a new case, say a drug efficacy study where age is a confounder: stratifying by age groups would be correct if age affects both treatment assignment and outcome. But if we stratified by a variable like "side effects experienced," which is affected by treatment, that could introduce bias. 

  The principle can't resolve cases where the causal structure is unknown or when there's a trade-off between bias and variance in small strata. In such cases, sensitivity analyses or Bayesian methods might help, but it remains ambiguous.
answer: |-
  **Bottom line: Stratify only on pre-treatment confounders that block backdoor paths without creating colliders or mediators, and prefer marginal effects for policy decisions when treatment allocation is endogenous.**

  ---

  ### Core Principles:
  1. **Stratify on pre-treatment confounders** (e.g., severity in #1, time in #3) to avoid omitted variable bias.
  2. **Never stratify on post-treatment variables** (e.g., program completion in #2) to prevent selection bias.
  3. **Aggregate when stratification is incomplete** (e.g., region in #4) if residual confounding persists.
  4. **Distinguish conditional (stratum-specific) vs. marginal (overall) effects** (e.g., #5) for clinical vs. policy decisions.
  5. **Small strata with causal justification trump noise** only if confounding is *proven* pre-treatment.

  ---

  ### Your Cases Resolved:
  | Case | Principle Applied | Verdict Justification |
  |------|-------------------|----------------------|
  | **1** | Stratify on pre-treatment confounder (severity) | Severity causes both treatment choice and outcome → strata valid |
  | **2** | Never stratify on post-treatment variable (completion) | Completion is a *consequence* of treatment → aggregate unbiased |
  | **3** | Stratify on confounder (time) | Time affects both traffic allocation (ramp-up) and conversion (payday) |
  | **4** | Aggregate due to residual confounding | Hospital-level split fully deconfounds → reversal was spurious |
  | **5** | Marginal > conditional for policy | Banning redistributes patients → marginal effect predicts population impact |

  ---

  ### Unlisted Case Prediction:
  **Scenario:** A drug performs better overall but worse in all age groups.  
  **Analysis:**  
  - If age is a confounder (e.g., older patients get more placebos), trust strata.  
  - If drug allocation is age-independent, suspect collider bias (e.g., stratifying on a post-treatment biomarker).  
  **Verdict:** Stratify only if age is pre-treatment confounder.

  ---

  ### Limitations:
  - **Cannot resolve:** Unknown confounders (e.g., unmeasured genetic factors).  
  - **Ambiguous:** Small strata with plausible confounders (your unresolved case). Principle #5 applies but requires causal evidence beyond the data.  
  - **Fails:** When treatment affects confounder measurement (e.g., severity scores change post-treatment).

  ### Key Takeaway:
  Your verdicts align with causal directed acyclic graphs (DAGs). Test decisions by:  
  1. Mapping variables to pre/post-treatment,  
  2. Drawing paths from treatment to outcome,  
  3. Stratifying only to block backdoor paths (e.g., severity in #1).  
  When in doubt, simulate interventions on the DAG.
