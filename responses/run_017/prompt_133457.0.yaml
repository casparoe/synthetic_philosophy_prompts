prompt: |-
  I chair the appeals committee of a housing cooperative: 340 households, a written Code of about ninety rules, and a rotating panel of three volunteers, none of whom has any legal training. I repair lifts for a living. We hear roughly four appeals a month, and the stakes are not small: most of our decisions are about fines, but about one in six is about whether someone keeps their home. We have two hours per hearing. Every decision has to be reduced to a short written "reasons" paragraph that is posted on the members' noticeboard and read aloud at the next general meeting, and any decision that departs from the Code has to be ratified by the elected board, which meets only quarterly — so a departure we cannot justify in writing is, in practice, a departure we cannot make.

  I have been reading about law and morality on my own for a few years, with no teacher. The thing I keep coming back to is a well-known mid-century exchange between two law professors, H. L. A. Hart and Lon Fuller, which I first met in an encyclopedia summary and then chased into a public library. As I understand the disagreement: one side says there is no necessary connection between what a rule is and what it ought to be, so that a rule can be perfectly genuine law and still be too cruel or too stupid to apply; when that happens, the honest course is to say so plainly, take the cost of departing from it, and get it changed for the future, rather than pretending the rule never said what it plainly said. The other side says this picture of a "valid" rule is far too thin: a body of rules that is contradictory, or unpublished, or retrospective, or impossible to comply with, or that shifts every week, has not done what rules exist to do, and its subjects owe it something less than fidelity — which makes the question "is this really one of our rules?" a moral question through and through, not a separate preliminary one. I believe there was a case at the centre of it about people who informed on their neighbours under the rules of a regime that was itself criminal, and about what a court should do afterwards. Correct me if I have any of this wrong, but please do not spend your answer explaining the debate back to me or pointing me at books and articles; I have no library access beyond the municipal one and no stomach for a reading list. What I want is the argument turned into something three volunteers can actually run in an evening.

  Two wrinkles that make this harder than the general question. First, our Code already contains a provision we call Rule 0: no member may be penalised for failing to comply with a rule they could not reasonably have known about, and nothing in the Code requires the impossible. So the Fuller-flavoured worry is partly written into our own rules, and sometimes the dispute is about what Rule 0 demands rather than about Rule 0 itself. Second, the co-op stopped keeping a printed copy of the Code in the office last year and now publishes it only through a members-only web portal.

  What I would like from you is a decision procedure for cases where a member has admittedly done what a written rule forbids, and the panel nonetheless suspects that applying the rule would be wrong. Please give me: the questions to ask, in the order I should ask them; what counts as a sufficient answer to each question; the point at which the procedure simply stops with "apply the rule"; the point at which it stops with "do not apply it"; and the point at which it hands the matter to the board, or to a person, because the remaining question is one of values rather than of fact. I also want a short template for the written reasons paragraph, built so that it forces the panel to distinguish (a) what the rule required, (b) what we did and what we are relying on when we depart, and (c) what we are changing for future cases — because I have found that the panel's drafts collapse those three into one soothing sentence. The whole procedure has to fit on one side of A4 pinned above the noticeboard, readable by someone with no theory, and I need you to mark clearly which steps are really judgment dressed up as procedure.

  Then run it on three cases.

  One. A member in her eighties was fined for keeping a bicycle in a stairwell. The rule is genuinely in the Code, but she has never used a computer, and she says she asked at the office and was told the old binder had been thrown out. Under Rule 0 the panel has to decide what "could not reasonably have known" requires of the co-op and not only of the member.

  Two. Code rule 34 says no commercial vehicles may be left overnight in the courtyard. A member's son, who works for a removals firm, left his employer's van there for eleven hours because he was helping a neighbour with a broken leg move her furniture down from a second-floor flat before a surgery date. The van did not block fire access, and neighbours have said they were glad of it. The rule exists to stop the courtyard becoming a depot and to keep access clear. I will be honest with you: if your procedure ends up fining this man I will be unhappy, and part of me will want to throw the procedure out rather than accept the result. Please give me the result the procedure actually yields, and then tell me separately what I would be doing to the enterprise if I overrode it by hand.

  Three. In 2019 a member reported a neighbour for keeping an unregistered lodger, and the neighbour was fined and given a formal warning under a rule the co-op repealed in 2021 after concluding the then-committee had used it vindictively. The neighbour now applies to have the warning expunged and the fine repaid out of co-op funds. The reporting member broke no rule at the time. This is the case my panel handles worst: it is no good asking whether the rule was valid then, since it was, and no good asking whether the outcome was bad, since on that test every repealed rule reopens. I want to know what the procedure does with a rule that was properly made and has since been, so to speak, disowned.

  Finally, tell me what this procedure cannot do: the kinds of case it will systematically get wrong, and the point at which I should stop trusting it and put the matter to the whole membership instead.
reasoning: |-
  Hmm, this is a fascinating and complex request from someone dealing with real-world legal dilemmas in a housing cooperative. The user chairs an appeals committee without legal training, handling cases with serious consequences like eviction risks. They've been studying Hart-Fuller debate independently and want a practical decision procedure based on those philosophical principles.

  The user needs a step-by-step framework that:
  - Distills complex legal philosophy into usable questions
  - Handles three specific wrinkles (Rule 0, digital-only access, retrospective justice)
  - Produces auditable written reasons
  - Fits on one A4 page
  - Includes built-in "circuit breakers" for value judgments

  Key challenges I notice:
  - The panel lacks legal training but makes binding decisions
  - Rule 0 creates meta-rules about knowability and feasibility
  - Digital access disadvantages non-tech-savvy members
  - Retroactive rule changes create moral debts
  - The user admits emotional bias in case 2 (van)

  For the philosophical foundation:
  - Hart's position: Valid rules must be applied as written even if unjust; change requires transparent amendment
  - Fuller's position: Rules lose validity when failing "internal morality" tests (clarity, consistency, feasibility etc.)
  - Rule 0 already incorporates Fuller's concerns about knowability and possibility

  The procedure must:
  1. Test rule validity (Fuller) before considering justice (Hart)
  2. Pinpoint where value judgments occur
  3. Force transparent departure from rules
  4. Handle all three test cases consistently

  For case 1 (elderly cyclist):
  - Core tension between digital access and reasonable knowability
  - Rule 0 requires assessing institutional duty, not just individual effort
  - Panel must judge what "reasonable accommodation" means

  For case 2 (commercial van):
  - User's emotional resistance reveals Hart-Fuller tension
  - Unwritten community benefit vs. clear rule text
  - "No exceptions" rigor vs. absurdity doctrine

  For case 3 (repealed rule):
  - Most philosophically complex
  - Past validity vs. current moral assessment
  - Reopening precedent risk vs. corrective justice

  The written template must prevent:
  - Conflating rule application with moral judgment
  - Vagueness about departure justification
  - Obfuscating future rule changes needed

  Finally, I need to flag:
  - When the procedure hits systemic limits
  - Cases requiring democratic resolution
  - Inherent biases in rule-based systems
answer: |-
  Below is a practical decision procedure based on your needs, distilled from the Hart-Fuller debate and adapted for your co-op’s constraints. It prioritizes **clarity, auditability, and containment of moral judgment** while respecting Rule 0 and your digital Code. The procedure fits on one A4 page (see template), uses plain language, and forces separation of (a) the rule’s requirement, (b) the departure rationale, and (c) future changes. Steps marked with **(!)** involve unavoidable judgment.

  ---

  ### **Decision Procedure for Rule Departures**  
  *Ask these questions in order. Stop at the first "NO" or "UNCLEAR."*

  1. **Is the rule in the current Code?**  
     - *Sufficient answer:* Confirm using the *latest* web portal version.  
     - **NO?** → STOP: Rule doesn’t apply.  
     - **YES?** → Proceed to Q2.  

  2. **Did the member *actually* violate the rule’s text?**  
     - *Sufficient answer:* Evidence proves the act matches the rule’s description.  
     - **NO?** → STOP: No violation.  
     - **YES?** → Proceed to Q3.  

  3. **Does Rule 0 excuse the violation?**  
     - *Ask two sub-questions:*  
       - (a) *"Could the member reasonably have known about the rule?"*  
          - **NO** if: Rule wasn’t accessible (e.g., no digital access + no alternative provided).  
          - **YES** if: Rule was published + member had means/opportunity to know.  
       - (b) *"Was compliance impossible?"*  
          - **NO** if: Member had feasible alternatives.  
          - **YES** if: No alternatives existed (e.g., physical impossibility).  
     - **YES to (a) or (b)?** → STOP: Do not apply the rule.  
     - **NO to both?** → Proceed to Q4.  

  4. **Is applying the rule: (a) pointless, (b) self-contradictory, or (c) destructive to the Code’s purpose?**  
     - *Sufficient answer:* Rule conflicts with *another rule*, undermines safety/community, or is irrational (e.g., fining for emergency help).  
     - **YES?** → **(!)** This is judgment. Send to the board with a recommendation.  
     - **NO?** → Proceed to Q5.  

  5. **Is applying the rule deeply unjust *despite* Q1–Q4?**  
     - *Sufficient answer:* Rule application would be cruel, discriminatory, or violate widely held moral principles.  
     - **YES?** → **(!)** Judgment call. Send to the board with a recommendation.  
     - **NO?** → STOP: Apply the rule.  

  ---

  ### **Written Reasons Template**  
  *For public notice and board ratification:*  
  > *"(a) Rule [Number] requires [brief description]. (b) The panel finds [violation / no violation]. [If departing:] We cannot apply the rule because [specific reason: e.g., Rule 0 applies / board referral due to [issue]]. We rely on [evidence/facts] for this departure. (c) For future cases, [state change needed: e.g., 'the board should clarify Rule 0 access' / 'no change'].*  

  ---

  ### **Case Applications**  
  **Case 1: Elderly member fined for bicycle in stairwell**  
  - Q1: Rule exists.  
  - Q2: Violation occurred.  
  - Q3: (a) "Reasonably known"? **NO**—Member lacks computer access + office misled her. (b) Compliance possible? Irrelevant.  
  - **STOP at Q3(a): Do not apply the rule.**  
  - *Reasons paragraph:*  
    > "(a) Rule [X] bans bicycles in stairwells. (b) No penalty applies: the member could not reasonably have known the rule due to lack of digital access and office error. We rely on her testimony and office records. (c) For future cases: the co-op must provide non-digital Code access."  

  **Case 2: Commercial van left overnight for medical help**  
  - Q1: Rule 34 exists.  
  - Q2: Violation occurred (van = commercial vehicle).  
  - Q3: (a) Rule known? **YES** (published). (b) Compliance possible? **YES** (could have parked elsewhere).  
  - Q4: Apply rule pointless/destructive? **YES**—Rule’s purpose (prevent depot/block access) wasn’t violated; van aided community need. **(!)** Judgment: Send to board with "do not fine" recommendation.  
  - *Reasons paragraph (if board ratifies):*  
    > "(a) Rule 34 bans overnight commercial vehicles. (b) No penalty applies: strict enforcement here would undermine the rule’s purpose (access/safety), given the urgent medical help provided. We rely on neighbor testimony. (c) For future cases: the board should amend Rule 34 to exempt emergencies."  
  - *If you override the procedure:* Undermining this invites chaos. Hart would warn that ad hoc "justice" destroys rule-of-law predictability. Fuller would counter that blind application destroys the Code’s moral authority. The procedure balances both by requiring board ratification for value judgments.  

  **Case 3: Expunging a warning under a repealed rule**  
  - Q1: Rule *was* valid in 2019.  
  - Q2: Violation occurred at the time.  
  - Q3: Rule was known/possible then? **YES** (no evidence otherwise).  
  - Q4: Applying the *old* rule *now*? Not applicable (no current application).  
  - Q5: **(!)** Moral debt? **YES**—The rule was repealed for being "vindictive," creating injustice. Judgment call: Send to board with "expunge/repay" recommendation.  
  - *Reasons paragraph (if ratified):*  
    > "(a) Rule [Y] (repealed 2021) prohibited unregistered lodgers. (b) The 2019 penalty is voided: retroactive application of the repeal is justified due to the rule’s documented misuse. We rely on the 2021 repeal minutes. (c) For future cases: repealed rules may be reviewed for moral harm."  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Systematic blind spots:**  
     - It will fail if the *entire Code* is immoral/unworkable (e.g., discriminatory rules). The panel can’t fix systemic rot.  
     - It struggles with "gray zone" moral conflicts (e.g., minor rule-breaking for major ethical good).  

  2. **When to stop trusting it:**  
     - If >1 case/month hits Q4/Q5 referrals, the Code needs overhaul.  
     - If the board *repeatedly* overturns panel recommendations, the membership should vote on Code reforms.  
     - Put to the whole membership if:  
       - A case exposes fundamental values conflict (e.g., "Should we allow home businesses?").  
       - The board refuses to ratify departures, creating unfair outcomes.  

  ---

  ### **One-Page Procedure Summary**  
  [Imagine this pinned above the noticeboard]  

  **HOUSING CO-OP APPEALS DECISION CHART**  
  *For when a rule seems wrong to apply:*  

  1. **Is the rule in the current Code?**  
     - NO → Dismiss.  
     - YES → Next.  

  2. **Was the rule clearly broken?**  
     - NO → Dismiss.  
     - YES → Next.  

  3. **Does Rule 0 excuse it?**  
     - Was it *impossible* to comply? OR  
     - Could the member *not reasonably know* the rule?  
     - YES → Dismiss.  
     - NO → Next.  

  4. **Does applying the rule defeat its own purpose?**  
     - (e.g., harms safety, contradicts another rule, is irrational)  
     - YES → **JUDGMENT NEEDED:** Send to board.  
     - NO → Next.  

  5. **Is it deeply unfair to apply?**  
     - (e.g., cruel, discriminatory, morally wrong)  
     - YES → **JUDGMENT NEEDED:** Send to board.  
     - NO → Uphold the rule.  

  **WRITE REASONS CLEARLY:**  
  - What the rule says.  
  - Why we did/didn’t apply it.  
  - What should change for next time.  

  **STOP HERE IF:**  
  - More than 1 in 4 cases go to the board, OR  
  - The Code feels broken → Take it to the members!  

  ---  
  This procedure embeds Fuller’s "internal morality" in Q3–Q4 (testing the rule’s functionality) and Hart’s "separation thesis" in Q5 (isolating moral judgments for board review). It forces transparency, contains value clashes, and respects your limits.
