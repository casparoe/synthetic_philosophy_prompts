prompt: |-
  Posting here because I've been going in circles on this for weeks and I'd rather be told I'm confused than keep guessing.

  Context: I got into forecasting a few years ago, the kind where you put a percentage on whether something will happen and a site scores you on it after. Since then I keep noticing the same shape of argument turning up in totally unrelated disputes, and I can't tell whether it's one argument in different clothes, or two arguments that look alike, or two plus a mistake.

  Version one. Someone says: your numbers don't hang together, you'll say 40% that it rains tomorrow and 70% that it doesn't, and if so I can offer you two separate bets, each of which you'd have to call fair or better by your own lights, and you lose money whichever way the weather goes. I get the move. What I get stuck on is how much it needs: I have to take both bets, at the numbers I gave, from someone who somehow knows those numbers. I don't bet. And if a guy on a street corner offered me a pair of bets that was a sure thing for him, I'd of said no. So what is this supposed to establish, that I'm wrong about the weather, or that I'd be in trouble in a situation I'm not in?

  Version two, which I think is a different animal. Whatever happens, there was a different set of numbers you could have given that would have scored better. Not probably better, better in every single outcome. No bets, no money, nobody exploiting anybody, nothing you actually lose. The bad thing is just that you did worse on a score than you could have done. This seems to do the same rhetorical work as version one and I can't say what the shared part is.

  Version three, the one I really can't place. How much I'd pay for a dollar-if-it-rains depends on the size of the stake and on my rent: 60 cents at a dollar stake, 45 at a hundred, nothing at all at a year's rent. So there's no single number there to build anything out of. And when I try to rebuild the version-one construction with stake-sensitive prices, sometimes I can't make it work against someone whose opinions are visibly incoherent, and sometimes it looks like I can make it work against someone whose opinions are perfectly fine.

  A friend said "Dutch book" once but she was half asleep and I think she only meant the first one. So: is there a name for the family, and if there is, does it cover all three? Please don't hand me a list of names and papers, I've got no journal access from where I am right now and I don't want reading suggestions. What I want is the carving: what each version actually establishes, and I mean which of these it is, that someone has a false belief, that they're internally inconsistent, that they can be reliably parted from their money, because those look like three different things; what the shared form is and what the minimum ingredients are for it to have any force at all; and where the edge is, the case where something that looks exactly like this has no force whatsoever. If the general thing has no name, then name it, define it, and tell me what wouldn't count as an instance.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deeply involved in forecasting and probability assessment, and they've encountered three versions of arguments that seem similar but confuse them. They want to understand whether these are the same underlying argument or distinct ones, what each establishes, and where the boundaries lie.

  First, Version One is the classic Dutch Book argument. The user understands that if someone offers two bets based on inconsistent probabilities (like 40% for rain and 70% for no rain), the forecaster would lose money no matter what. But they're stuck on why this matters if they don't actually bet. The key here is coherence—it's not about real betting but internal inconsistency. The user's concern about needing to accept bets from someone who knows their numbers is valid, but the argument's force lies in revealing logical inconsistency, not predicting actual losses.

  Version Two seems to reference strictly proper scoring rules. The user notes that there's always a better probability assignment after the fact, regardless of outcome. They correctly sense this does "the same rhetorical work" as Version One without involving bets. The shared core is coherence—both expose violations of probability axioms. Scoring rules penalize non-Bayesian updates or incoherent priors by making the actual forecast suboptimal compared to alternatives.

  Version Three introduces stake-size dependency. The user observes their own probability assessments change with bet sizes, which feels incoherent under Dutch Book standards. But this might reflect genuine risk aversion, not inconsistency. The critical distinction: if probabilities shift solely due to stake size without new information, it violates coherence. But if it's about utility of money (diminishing marginal utility), expected utility theory handles it. The user's confusion arises when mistaking risk aversion for probabilistic incoherence—sometimes Dutch Book arguments fail here because they conflate probability and utility.

  Connecting the dots: All three versions target coherence. Version One uses hypothetical bets to expose logical contradictions. Version Two uses scoring rules to show dominance—incoherent forecasts are strictly dominated. Version Three is the boundary case where Dutch Book arguments either fail (if properly modeling utility) or succeed (if probabilities themselves change irrationally).

  The user needs to distinguish between:
  - Logical inconsistency (always bad)
  - Risk aversion (legitimate, requires utility modeling)
  - Scoring rule optimization (separate from betting)

  The core principle is probabilistic coherence. The edge cases are when utility effects mimic incoherence, or when scoring rules are misapplied to non-probabilistic judgments. Their frustration suggests they've almost grasped it but need the boundaries sharpened—especially why Version Three feels ambiguous. Clarifying the utility/probability separation should resolve their "weeks of circling".
answer: |-
  Your confusion is understandable—you're grappling with three distinct but related arguments about probabilistic coherence, each with different implications. Below is a precise carving of what each version establishes, their shared core, and where the boundaries lie. I'll avoid jargon where possible and define key terms as we go.

  ### **Core Principle: Coherence**
  All three arguments are variations of **coherence requirements** for rational probability assignments. At heart, they ask: *Do your beliefs obey the basic rules of probability (e.g., probabilities sum to 1, no logical contradictions)?*  
  - **What it exposes**: Internal inconsistency in belief quantification, not necessarily false beliefs about the world.  
  - **Minimum ingredients**: A set of probability claims about related events and a scoring mechanism (money, points, etc.).  
  - **Edge case**: Fails if beliefs aren't meant to be probabilistic (e.g., ambiguous statements) or if scoring ignores coherence.

  Now, your three versions:

  ---

  ### **Version 1: The Dutch Book (The "You'd Lose Money" Argument)**  
  - **What happens**: You assign P(Rain) = 0.4 and P(No Rain) = 0.7. An opponent offers two bets:  
    - Bet A: Pays $1 if rain, costs you $0.40 (you break even if P=0.4).  
    - Bet B: Pays $1 if no rain, costs you $0.70 (you break even if P=0.7).  
    If you accept both, you pay $1.10 total. You get $1 back regardless of outcome—guaranteed $0.10 loss.  
  - **What it establishes**:  
    - **Not** that you're wrong about the weather.  
    - **Not** that you'd lose money in practice (you might avoid betting).  
    - **It proves your probabilities are logically inconsistent**. The probabilities violate P(A) + P(¬A) = 1.  
  - **Force of the argument**: Pure logic. If probabilities are tools for reasoning, inconsistency makes them self-defeating.  
  - **Edge case**: No force if:  
    - You reject bets (but the inconsistency remains).  
    - Probabilities aren't "betting prices" (e.g., vague guesses).  
    - The opponent can't set stakes based on your exact probabilities (but the *threat* of exploitation reveals the flaw).

  ---

  ### **Version 2: The Strictly Proper Scoring Rule (The "You Could Have Scored Better" Argument)**  
  - **What happens**: You forecast P(Rain) = 0.4. After seeing the outcome, we calculate your score (e.g., Brier score). If it rained, the score for saying 0.4 is worse than if you had said 1.0; if no rain, it's worse than if you had said 0.0.  
  - **What it establishes**:  
    - **Not** that your belief was false (it might have rained!).  
    - **Not** that you lost something tangible.  
    - **It proves your forecast was "dominated"**: Another probability (0.0 or 1.0) would have scored better *no matter what happened*.  
  - **Why it matches Version 1**:  
    - Shared core: Incoherence (e.g., P(Rain) + P(No Rain) ≠ 1) guarantees your forecast is strictly dominated.  
    - Proper scoring rules are the "scoring" counterpart to Dutch Books' "betting" critique. Both punish violations of probability axioms.  
  - **Force of the argument**: Epistemic rationality. If you care about accuracy, incoherent forecasts are self-sabotage.  
  - **Edge case**: No force if:  
    - The scoring rule isn't "strictly proper" (e.g., linear scoring).  
    - You don't care about the score (but then why assign probabilities?).  

  ---

  ### **Version 3: Stake-Sensitivity (The "It Depends on the Bet Size" Argument)**  
  - **What happens**: You'd pay $0.60 for a $1 payout if rain, but only $45 for a $100 payout. This isn't incoherent—it reflects **risk aversion** (diminishing marginal utility of money).  
  - **The confusion**:  
    - **If you treat prices as probabilities**: Saying "P(Rain) = 0.6 for $1 bet but 0.45 for $100 bet" *seems* inconsistent. A Dutch Book *might* appear if you ignore utility (e.g., someone offers multiple bets at different stakes).  
    - **Reality**: This isn't probabilistic incoherence! It's about **utility scaling**. Money isn't linear in value to you (losing $100 hurts more than 100x losing $1).  
  - **What Version 3 establishes**:  
    - If you conflate betting prices with probabilities: You *appear* incoherent, but the flaw is mislabeling.  
    - If your *true probabilities* change with stake size: You **are** incoherent (e.g., believing rain is 60% likely for small bets but 45% for large bets violates probability axioms).  
  - **Force of the argument**:  
    - **Against mislabeling**: None—it’s a category error. Betting prices ≠ probabilities.  
    - **Against stake-dependent probabilities**: Full force (same as Version 1).  
  - **Edge case**: Where it has no force:  
    - When risk aversion explains price differences (use **expected utility theory** instead).  
    - When stakes affect information (e.g., large bets motivate research), not core beliefs.

  ---

  ### **The Shared Structure & What Each Reveals**  
  | **Argument**       | **What It Exposes**          | **Not About**               | **Key Mechanism**       |  
  |--------------------|------------------------------|----------------------------|-------------------------|  
  | **Dutch Book**     | Logical inconsistency        | Truth of beliefs           | Guaranteed loss in bets |  
  | **Scoring Rules**  | Dominated forecasts          | Calibration/accuracy       | Strictly proper scoring |  
  | **Stake-Sensitivity** | Misapplied probabilities | Risk aversion             | Utility vs. probability |  

  **The family name**: **Coherence arguments**. Dutch Books and proper scoring rules are two sides of the same coin, both enforcing probability axioms. Stake-sensitivity is a common *confounder* but not inherently about coherence unless probabilities themselves shift.

  **Crucial distinction**:  
  - **Incoherence**: Believing P(A) + P(¬A) > 1 (a logical error).  
  - **Risk aversion**: Valuing a $100 bet less than 100x a $1 bet (rational with diminishing utility).  
  - **False belief**: Thinking P(Rain) = 0.4 when true probability is 0.9 (inaccuracy, not incoherence).  

  **Where these arguments fail**:  
  - If you reject probability as a belief model (e.g., "I don't quantify uncertainty").  
  - If the scoring/betting context doesn't apply (e.g., expressing vague concern).  
  - If utility effects are misattributed to probability (Version 3's pitfall).

  You’ve identified a spectrum: Dutch Books and scoring rules attack **internal consistency**, while stake-sensitivity tests whether you’ve **separated belief from value**. The first two are fatal to probabilistic reasoning if violated; the third is only fatal if you mistake prices for probabilities.
