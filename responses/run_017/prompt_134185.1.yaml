  - For the cash prices (excludable benefit) we got a recommendation to cooperate.

  The procedure can yield answers we don't like (like defecting on a public good) and also depends on the inputs and approximations.

  ### Where the Procedure Might Misfire
  - The reference class selection is subjective and can be manipulated. We tried to fix it by requiring criteria in advance.
  - The correlation strength `c` is arbitrary. We used 0.3, but it could be 0.1 or 0.5. This can change the outcome.
  - The normal approximation and the rule of thumb for the threshold probability are crude. In borderline cases, the answer might be sensitive.
  - In public goods with thresholds near the expected number, the evidential reasoning might lead to defection because the benefit of free-riding is high.

  Despite these issues, the procedure forces the decision-maker to think systematically about the interdependence of decisions and can sometimes break the defection logic.

  ### Final Decision Procedure Outline (for the pharmacist)
  1. Describe the practice, threshold, costs, benefits, and whether benefits are excludable.
  2. Estimate the base rate of cooperation (without your action) for the whole group.
  3. Define the reference class of pharmacies relevantly like you (write down criteria before proceeding).
     - If the reference class has less than 5, use causal reasoning only (step 5b).
  4. Choose a correlation strength `c` (low=0.1, medium=0.3, high=0.5) based on how much you think your action correlates with others (due to shared values, similar circumstances, etc.).
  5. Calculate:
     - p_coop_if_I_coop = base_rate + c*(1-base_rate)
     - p_coop_if_I_defect = base_rate * (1-c)
  6. For public goods:
     - Compute the expected number of cooperators if you cooperate: `n_coop = p_coop_if_I_coop * N` (where N is the size of the reference class, if the reference class is the whole group; otherwise, adjust).
     - Compute the expected number if you defect: `n_defect = p_coop_if_I_defect * N`
     - For each, compute the probability that the threshold is met (using the rule of thumb: if expected number >= threshold + one_std, then 1; if <= threshold - one_std, then 0; else 0.5). One_std = sqrt(N * p * (1-p)).
     - EU_coop = (prob_success_coop * benefit) - cost
     - EU_defect = prob_success_defect * benefit
  7. For excludable goods:
     - Same as above, but:
          - EU_coop = prob_success_coop * (benefit - cost) + (1 - prob_success_coop) * (-cost)
          - EU_defect = 0
  8. If EU_coop > EU_defect, cooperate; else, defect.

  **Note**: If the reference class is too small, fall back to causal reasoning only (ignore evidential):
     - For public goods: cooperate only if you think your cooperation will tip the threshold (i.e., without you, the number is threshold-1 and with you it meets) AND the benefit to you exceeds your cost. Otherwise, defect.
     - For excludable goods: cooperate only if you think the threshold will be met regardless of your action? Otherwise, it's risky.

  This procedure is a starting point and must be refined with experience.
answer: |-
  Below is a decision procedure designed for your context—rigorous enough to handle evidential reasoning in "large worlds" but executable in 30 minutes by pharmacists without philosophy training. It addresses your specific concerns (reference class selection, conditioning, double-counting, etc.) and includes safeguards against bias. I'll first outline the steps, then apply it to your two proposals.

  ---

  ### **Decision Procedure: 8 Steps**  
  **Time:** 30 minutes max.  
  **Tools:** Calculator, pen, paper.  
  **Goal:** Decide whether to adopt a costly practice requiring group buy-in.  

  #### **Step 1: Define Practice & Thresholds**  
  - **Task:** Write down:  
    - What is the practice? (e.g., "Keep compounding pediatric suspension at a loss")  
    - What is the **cost** to you if you adopt? (e.g., "$5,000/year loss")  
    - What is the **benefit** to you if adoption **succeeds**? (e.g., "$15,000/year in retained referrals")  
    - What is the **threshold** for success? (e.g., "≥30% of local pharmacies must adopt")  
    - Is the benefit **excludable**? (Do only adopters get the benefit?)  
      - *Yes* (e.g., transparent cash prices draw customers only to *you*).  
      - *No* (e.g., pediatric suspension network benefits *all*, even non-adopters).  
  - **Stop if:** Cost > benefit even if successful. *→ Defect*.  
  - **Output:** Clear problem statement with numbers.

  #### **Step 2: Fix the Reference Class**  
  - **Task:** List **objective criteria** for "pharmacies relevantly like me." **Do not** consider their likely actions.  
    - *Criteria*: Geographic area (e.g., same county), size (e.g., independent, <10 staff), patient mix (e.g., serves pediatrics), payer mix (e.g., high Medicaid).  
    - **Size check:** If reference class < 5, **stop evidential reasoning** → use Step 5 (causal only).  
  - **Avoiding cherry-picking:**  
    - Define criteria **before** estimating cooperation (e.g., "all independents in County X," not "those who might cooperate").  
    - If you must adjust, **document why** (e.g., "only 3 stores compound suspensions; expand to adjacent counties").  
  - **Output:** Reference class size *N* (e.g., 40 pharmacies).

  #### **Step 3: Estimate Baseline Cooperation (No Evidential Reasoning)**  
  - **Task:** Estimate the % of *N* that will **likely adopt regardless of your choice**. Use:  
    - Past data (e.g., "Last year, 20% adopted similar practice").  
    - Surveys (e.g., "Alliance survey: 25% lean yes").  
    - If no data, use 50% (neutral prior).  
  - **Output:** Baseline probability *P_b* (e.g., 0.25).

  #### **Step 4: Evidential Reasoning Setup**  
  - **Task:** Calculate how your action correlates with others:  
    - **Correlation strength (c):** Estimate between 0.1 (weak) and 0.5 (strong). Default: **0.3** (moderate).  
      - *Rationale:* Alliance membership implies shared values but no coordination.  
    - **Compute:**  
      - If you cooperate: *P_coop* = *P_b* + *c* × (1 - *P_b*)  
      - If you defect: *P_defect* = *P_b* × (1 - *c*)  
      - *Example: P_b=0.25, c=0.3 → P_coop = 0.25 + 0.3×0.75 = 0.475; P_defect=0.25×0.7=0.175*.  
  - **Stop if:**  
    - *P_coop* or *P_defect* is extreme (<0.1 or >0.9). → Use this value directly.  
    - Reference class is too small (from Step 2). → Skip to Step 5.  
  - **Output:** *P_coop*, *P_defect*.

  #### **Step 5: Causal Contribution Check**  
  - **Task:** Assess if your action **directly influences** others.  
    - *Examples:*  
      - If you adopt transparent pricing and competitors notice, they might follow (causal influence).  
      - Pediatric suspension has no causal influence (inspectors don’t care who adopts).  
    - **Adjustment:** If causal influence exists:  
      - Discount evidential correlation by 50% (e.g., *c* = 0.15 instead of 0.3) to avoid double-counting.  
      - Recompute Step 4.  
  - **Output:** Adjusted *P_coop*, *P_defect*.

  #### **Step 6: Success Probability**  
  - **Task:** Estimate if the **threshold will be met** under your choice.  
    - **Expected cooperators if you cooperate:** *E_coop* = *P_coop* × *N*  
    - **Expected cooperators if you defect:** *E_defect* = *P_defect* × *N*  
    - **Threshold check (rule of thumb):**  
      - If *E_coop* ≥ threshold + 10% → *P_success|coop* = 1  
      - If *E_defect* ≤ threshold - 10% → *P_success|defect* = 0  
      - Else → *P_success|coop* or *P_success|defect* = 0.5  
  - **Output:** *P_success|coop*, *P_success|defect*.

  #### **Step 7: Expected Value (EV) Calculation**  
  - **Task:** Compute EV for cooperating vs. defecting.  
    - **If benefit is EXCLUDABLE** (only adopters benefit):  
      - *EV_coop* = [*P_success|coop* × (Benefit - Cost)] + [(1 - *P_success|coop*) × (-Cost)]  
      - *EV_defect* = 0  
    - **If benefit is NON-EXCLUDABLE** (all benefit):  
      - *EV_coop* = [*P_success|coop* × Benefit] - Cost  
      - *EV_defect* = [*P_success|defect* × Benefit]  
  - **Output:** *EV_coop*, *EV_defect*.

  #### **Step 8: Decide**  
  - **Task:** Adopt if *EV_coop* > *EV_defect*.  
  - **Hand back to human if:**  
    - Values conflict (e.g., "I know EV says defect, but kids will suffer").  
    - Uncertainty is extreme (e.g., *P_success* estimates vary wildly).  
  - **Output:** Cooperate/Defend.

  ---

  ### **Application to Proposals**  
  Assume:  
  - Alliance size: 250 pharmacies.  
  - Reference classes predefined: Pediatric suspension = "40 pharmacies in Region X"; Cash prices = "50 pharmacies in County Y".  

  #### **Proposal 1: Keep Money-Losing Pediatric Suspension**  
  - **Step 1:**  
    - Practice: Compound suspension at $10k/year loss.  
    - Benefit: $15k/year if referral network survives (non-excludable).  
    - Threshold: ≥12 pharmacies (30% of 40).  
  - **Step 2:** Reference class = 40 region pharmacies.  
  - **Step 3:** *P_b* = 0.25 (past adoption rate).  
  - **Step 4:** *c* = 0.3 → *P_coop* = 0.475, *P_defect* = 0.175.  
  - **Step 5:** No causal influence → no adjustment.  
  - **Step 6:**  
    - *E_coop* = 0.475 × 40 = 19.0 → > 13.2 (threshold +10%) → *P_success|coop* = 1.  
    - *E_defect* = 0.175 × 40 = 7.0 → < 10.8 (threshold -10%) → *P_success|defect* = 0.  
  - **Step 7 (non-excludable):**  
    - *EV_coop* = (1 × $15k) - $10k = $5k.  
    - *EV_defect* = (0 × $15k) = $0.  
  - **Step 8:** *EV_coop* ($5k) > *EV_defect* ($0) → **Cooperate**.  
  - **Note:** *Human override possible if pharmacists value patient care over profit.*

  #### **Proposal 2: Adopt Transparent Cash Prices**  
  - **Step 1:**  
    - Practice: Post real cash prices; cost = $5k (system updates, risk of lost customers).  
    - Benefit: $12k/year if customers trust pricing (excludable).  
    - Threshold: ≥30 pharmacies (60% of 50).  
  - **Step 2:** Reference class = 50 county pharmacies.  
  - **Step 3:** *P_b* = 0.50 (industry norm).  
  - **Step 4:** *c* = 0.3 → *P_coop* = 0.65, *P_defect* = 0.35.  
  - **Step 5:** Causal influence likely (competitors may react) → *c* adjusted to 0.15.  
    - *P_coop* = 0.50 + 0.15×0.50 = 0.575; *P_defect* = 0.50 × 0.85 = 0.425.  
  - **Step 6:**  
    - *E_coop* = 0.575 × 50 = 28.75 → < 33 (threshold +10%) → *P_success|coop* = 0.5.  
    - *E_defect* = 0.425 × 50 = 21.25 → < 27 (threshold -10%) → *P_success|defect* = 0.  
  - **Step 7 (excludable):**  
    - *EV_coop* = [0.5 × ($12k - $5k)] + [0.5 × (-$5k)] = $3.5k - $2.5k = $1k.  
    - *EV_defect* = 0.  
  - **Step 8:** *EV_coop* ($1k) > *EV_defect* ($0) → **Cooperate**.  

  #### **Proposal 3: Stay Open Extra Hours for Vaccinations**  
  *(Example where the procedure says "defect" to illustrate robustness)*  
  - **Step 1:**  
    - Practice: Extend hours; cost = $8k/year.  
    - Benefit: $20k/year if customers expect evening service (non-excludable).  
    - Threshold: ≥100 pharmacies (40% of 250).  
  - **Step 2:** Reference class = 250 alliance pharmacies.  
  - **Step 3:** *P_b* = 0.10 (low; high staffing burden).  
  - **Step 4:** *c* = 0.3 → *P_coop* = 0.37, *P_defect* = 0.07.  
  - **Step 5:** No causal influence.  
  - **Step 6:**  
    - *E_coop* = 0.37 × 250 = 92.5 → < 110 (threshold +10%) → *P_success|coop* = 0.5.  
    - *E_defect* = 0.07 × 250 = 17.5 → *P_success|defect* = 0.  
  - **Step 7 (non-excludable):**  
    - *EV_coop* = (0.5 × $20k) - $8k = $10k - $8k = $2k.  
    - *EV_defect* = (0 × $20k) = $0.  
  - **Step 8:** *EV_coop* ($2k) > *EV_defect* ($0) → **Cooperate?**  
    - **But:** Marginal benefit is low. If cost certainty matters, human may override → **Defect**.  
    - *This shows the procedure can yield borderline cases where values (risk tolerance) decide*.

  ---

  ### **Where the Procedure Works, Fails, and Handles Back**  
  - **Works best:**  
    - High-stakes decisions with clear thresholds (e.g., pediatric suspension).  
    - Large reference classes (N > 20).  
  - **Fails or misfires:**  
    - When *c* (correlation strength) is poorly estimated (e.g., if alliance values vary wildly).  
    - When thresholds are fuzzy (e.g., "inspector familiarity" not quantifiable).  
    - In tiny reference classes (N < 5), evidential reasoning collapses to causal.  
  - **Hands back to human:**  
    - When EV difference is small (e.g., <20% of cost).  
    - When non-economic values dominate (e.g., "We must serve this community").  
    - When double-counting isn’t resolvable (e.g., causal + evidential effects tangled).  

  This procedure makes evidential reasoning actionable while constraining bias. It won’t always give pleasing answers (as in Proposal 3), but it forces systematic thinking. Refine it with practice—e.g., track past decisions to calibrate *c*.
