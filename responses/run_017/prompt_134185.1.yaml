  We are going to design a decision procedure for an individual pharmacy owner to decide whether to adopt a costly practice that has a positive payoff only if a sufficient number of other pharmacies also adopt it. The procedure must be run in about 30 minutes by someone without a philosophy background. The key idea is that in a "large world" (where we cannot condition on every possible state that might screen off the correlation between one's own action and the actions of others), one's own decision to cooperate can be evidence that others will cooperate, and this evidential reasoning might sometimes override the causal reasoning that leads to defection.

  The decision procedure will be broken down into steps. We will address the specific concerns: reference class selection, avoiding double counting, handling cases where conditioning leaves only oneself, and the trade-off in widening the reference class.

  ### Step-by-Step Decision Procedure

  1. **Define the Practice and Thresholds**
     - Clearly state the practice being considered (e.g., keep making a compounded pediatric suspension at a loss, or post real cash prices).
     - Determine the threshold: How many pharmacies (or what percentage) in the relevant group must adopt the practice for it to be worthwhile? Also, note the cost to the pharmacy if it adopts and the threshold is not met, and the benefit (net of cost) if the threshold is met.

  2. **Estimate the Base Rate of Cooperation (Without Conditioning on Your Action)**
     - Without considering your own action, what is your best estimate of the proportion of pharmacies that would adopt the practice? This can be based on:
       - Past similar practices and their adoption rates.
       - Surveys or informal conversations (without any commitment) about this practice.
       - The general culture and values of the alliance members (e.g., how community-oriented they are).
     - If no data is available, use a default base rate (e.g., 50%) but note the uncertainty.

  3. **Determine the Reference Class**
     - The reference class should consist of pharmacies that are "relevantly like" you in ways that might affect their decision. Start by considering:
       - Geographic proximity (same county, same region).
       - Similar size and business model.
       - Similar patient demographics.
       - Similar past behavior in adopting alliance recommendations.
     - Avoid cherry-picking the reference class to get the desired answer. To prevent this, the reference class must be defined *before* you know how it affects the evidence. Therefore, write down the criteria for the reference class in advance, based on factors that are objectively relevant to the decision (like the ones above) and that you believe would influence the correlation in actions.
     - If the reference class turns out to be very small (e.g., less than 5 pharmacies), then we cannot rely on evidential reasoning (because the sample is too small) and we fall back to causal reasoning (step 5). Similarly, if after conditioning on many factors you end up with only yourself, then evidential reasoning does not apply (you are in a "small world" for this decision) and we use causal reasoning.

  4. **Evidential Reasoning: How Does Your Action Correlate with Others in the Reference Class?**
     - In a large world, we assume that the correlation between your action and the actions of others in the reference class is not screened off by any known state. Therefore, your action provides evidence about what others in the reference class will do.
     - We model this by considering that the adoption rate in the reference class might be higher if you adopt than if you don't. We need to estimate:
       - `p_coop_if_I_coop`: The estimated proportion of the reference class that will cooperate given that you cooperate.
       - `p_coop_if_I_defect`: The estimated proportion of the reference class that will cooperate given that you defect.
     - How to estimate these?
       - If you have data from past similar situations where you know what you did and what others did, use that.
       - If not, use a simple model: 
          - Let `base_rate` be the base rate from step 2 (for the reference class).
          - We assume that your action is correlated with others in the reference class. A simple way is to assume that if you cooperate, the cooperation rate in the reference class increases by a fixed amount (say 10-20 percentage points) over the base rate, and if you defect, it decreases by the same amount. However, this is arbitrary. Alternatively, we can use a rule of thumb: the correlation strength `c` (between 0 and 1) where `c=0` means no correlation and `c=1` means perfect correlation. Then:
            - `p_coop_if_I_coop = base_rate + c*(1 - base_rate)`
            - `p_coop_if_I_defect = base_rate * (1 - c)`
          - But how to choose `c`? Without data, we can use a moderate value (e.g., 0.3) but note that this is a weak point. Alternatively, we can use the fact that the alliance exists and that members are aware of the shared problem, which might create some correlation. We can set `c` to 0.2 (low), 0.5 (medium), or 0.8 (high) based on the perceived strength of shared values and communication. However, note that explicit coordination is forbidden, so `c` should not be too high.

     - Alternatively, we can use a Bayesian approach: start with a prior distribution for the cooperation rate and update based on your action. But that might be too complex. We'll stick to a simple point estimate.

  5. **Causal Reasoning: The Direct Effect of Your Action**
     - Regardless of what others do, what is the effect of your action?
       - If you adopt and the threshold is met, you get the net benefit (benefit minus cost).
       - If you adopt and the threshold is not met, you incur the cost without the benefit (so net loss equal to the cost).
       - If you don't adopt, you get zero (we assume no cost and no benefit).
     - But note: in some cases, your action might causally influence others (e.g., if you are a trendsetter). However, because of the legal constraints (no coordination), we must assume that there is no causal influence. Therefore, your action only matters if the threshold is met.

  6. **Combining Evidential and Causal Reasoning: Expected Utility**
     - We need to compute the expected utility of cooperating and defecting.
     - For cooperating:
       - We use the estimated proportion of the reference class that cooperates given that you cooperate (`p_coop_if_I_coop`). But note: the threshold is for the entire group (which may be larger than the reference class). We must extrapolate from the reference class to the whole group.
       - How? We can assume that the reference class is a representative sample of the whole group. Then the expected proportion in the whole group is the same as in the reference class. Alternatively, if the whole group is the reference class, then we use `p_coop_if_I_coop` directly.
