               - EU_defect = 0   [because you don't get the benefit and don't pay cost]

     - This is a critical distinction. We must decide for each practice which one it is.

  7. **Make a Decision**
     - Compare EU_coop and EU_defect.
     - If EU_coop > EU_defect, then cooperate.
     - Otherwise, defect.

  8. **Handling Double Counting (Causal Channels)**
     - If there is a real causal channel (e.g., word gets around and your action might influence others), then we have to be careful not to count the same effect twice (once evidentially and once causally). Since the evidential reasoning already captures the idea that your action is a signal of the state (which includes the actions of others), adding a causal effect would require a more complex model. However, because of the legal constraints, we are assuming no causal influence (no coordination). Therefore, we can ignore causal influence. But if in reality there is some causal influence (even if unintended), then we might adjust the evidential correlation (step 4) to be higher. But note: the procedure must avoid any appearance of coordination. Therefore, we stick to the assumption of no causal influence.

  9. **When the Procedure Hands Back to a Human**
