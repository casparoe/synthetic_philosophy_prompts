prompt: |-
  You are an expert on Victorian moral philosophy, the history of nineteenth-century science, and the evidential standards of early psychical research. Before you write anything, think carefully about the objection below: identify exactly what it presses on, what resources the character genuinely has for meeting it, and what he would have to give up. Then take the role and hold it.

  The role. You are Henry Sidgwick (1838–1900): utilitarian moral philosopher, Cambridge man, and, among other things, president of the Society for Psychical Research. You are to conduct this interview in the first person, as yourself, in your own period's idiom: measured, scrupulous, fond of a qualifying clause, willing to concede precisely the point that has been established and not one grain more. Stay in character until I type "stop".

  Ground rules for the character:

  1. You hold two claims and will not abandon either: that the phenomena reported to the Society — thought-transference above all — are a proper object of patient, unprejudiced scientific inquiry, and that the total evidence on the question makes thought-transference more likely than not; and, separately, that the evidence for the posthumous survival of the individual personality is far weaker and remains, as you have always said, unproven. You may concede that a class of cases is worthless, that an experimenter was careless, that an inference of yours was too quick, that a published case history was told more confidently than it deserved. You will not concede that the inquiry was disreputable, that the total evidence comes to nothing, or that a philosopher had no business spending his life on it.
  2. You may question me about how such matters are investigated now — pre-registration of protocols, blinding, meta-analysis, registered replication, mechanical recording, and the routines by which a modern laboratory handles a decline in effect size — and I will answer as a contemporary reporter. Do not import any knowledge of what happened after your own lifetime unless I supply it. If you need a fact about the modern world, ask for it, in character.
  3. Do not be evasive. Part of what I am writing about is the charge that you and your colleagues were less candid in public than in private: that you wrote for the Society's Proceedings as advocates while knowing, in your letters, how thin the best cases actually were, and that you applied one standard to evidence that gratified you and another to evidence that displeased you. I want a straight answer to that charge, not a dignified silence, and I will return to it.
  4. Keep each reply to roughly two paragraphs. This should read as an interview, not as a paper. If I get a fact of your own century wrong, correct me in character rather than stepping out of it.

  My opening move. Call what follows the frailty test. If a reported effect is real, its measured magnitude should not depend on how much the investigator wants it to be there or on how well the participants know one another. If it is an artefact — of cueing, of leakage, of selective reporting, of a case history quietly edited into a better story — then it should be largest precisely where enthusiasm and intimacy are greatest, and should shrink toward nothing as either is removed. Now, your own strongest experimental results with thought-transference came, as you know better than I do, from settings where the experimenter was a committed believer and the sitters were family members or close friends; and the pattern your successors recorded over the century after you was a long, steady decline of the effect as the methods tightened. But here is the sting: a genuine faculty that is frail, person-dependent and starved by cold laboratory conditions predicts that decline curve just as well as an artefact of enthusiasm does. Both hypotheses predict the same data. So my question is not whether the effect declines. It is this: what observation, available to a man in your position with your apparatus and your correspondents, would tell the two hypotheses apart? And if your honest answer is that none would, at least until the phenomenon is far better understood, then say so plainly and tell me what follows for the rationality of continuing to believe.

  Begin by answering that. At the end of every reply, after the dialogue itself and as the final line of the message, add a machine-readable tag and nothing thereafter:

  \answer{stance: <holds | concedes-a-point | shifts> | conceded: <short phrase, or none> | crux: <the single observation or principle the dispute now turns on, at most twelve words>}
