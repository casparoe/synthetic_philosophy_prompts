  **OFFICE OF EXPLANATORY STANDARDS**  
  **Inter-Directorate: Compliance & Registration**  

  **TO:** Vice-Chancellor, Prestigious University of Midshire  
  **FROM:** Inspector J. Arbuthnot, OES Field Division 7  
  **SUBJECT:** Closing Site-Visit Report: Statutory Review of Research Portfolio (Ref: OES/SVR-4412-MID)  
  **FILE REFERENCE:** OES/CR-04/2287  

  **1. Introduction**  
  Pursuant to the *Explanatory Standards Act (Revised)* and regulations under §9.1(b), a site inspection was conducted 12–16 May 2025 to assess compliance regarding explanatory mechanisms ("cranes") and prohibited explanatory devices ("skyhooks") across designated research projects. The inspection evaluated adherence to the foundational principles established by the late Ignatz Kranich: a crane being defined as *an explanatory mechanism providing verifiable upward support through identifiable intermediate structures*; a skyhook being defined as *a purported explanatory mechanism lacking grounded intermediate structures, thereby appearing to suspend its explanatory load without support*. Particular attention was paid to infractions under §4.2 (Greedy Reduction: *explaining a phenomenon by recourse solely to a lower level of organisation while omitting the intermediate structures performing the relevant work*). Findings are detailed below.  

  **2. Audited Projects & Findings**  

      2.1 **Project ALPHA (Dept. of Biological Sciences): "Cumulative Adaptation in Avian Clades"**  
          *Finding:* CLEARED (CR-3 Certification Grade). The project demonstrates a compliant crane mechanism. The appearance of complex functional design is explained via the cumulative selection of heritable variations within populations over generational time, operating through empirically verified intermediate structures (differential survival/reproduction, genetic inheritance). No reliance on ungrounded intentionality or purpose was observed.  

      2.2 **Project ETA (Institute of Metaphysical Studies): "Emergent Vital Principles in Ontogeny"**  
          *Finding:* VIOLATION (Unlicensed Skyhook - §3.1(a)). Project documentation proposes "OntoVitalis" as a "directive formative principle" responsible for organismal development. Despite applicant's reclassification of OntoVitalis as a "Type-7 Sky-Crane" and submission Form OES-SC/Retro/114 seeking retrospective certification, analysis confirms OntoVitalis lacks identifiable intermediate structures connecting it to biochemical processes. It functions solely as a self-certifying explanatory mechanism, characteristic of a skyhook. Cease and desist order issued (Ref: OES/CDO-4412-01).  

      2.3 **Project ZETA (Centre for Computational Cognition): "Modelling Sacrificial Refusal in Chess AI (v. 4.3)"**  
          *Finding:* VIOLATION (Illicit Teleology - §3.1(c)). The project's explanatory model cites the AI's "evaluation of future board states" as the mechanism for refusing a piece sacrifice. This constitutes an appeal to a future outcome (a state not yet extant) as the *cause* of present behaviour. Such teleological reasoning, implying foresight or purpose within the algorithmic process absent demonstrable intermediate structures generating this specific evaluative function, is categorically ungrounded. Remediation required: submit revised explanatory schematic tracing refusal to immediate structural properties of the evaluation function and current board-state analysis.  

      2.4 **Project SIGMA (Dept. of Cognitive Neurophilosophy): "Neural Correlates of Academic Governance Decisions"**  
          *Finding:* VIOLATION (Greedy Reduction - §4.2). The project's core publication asserts the University's decision to reappoint Professor Emeritus X was "nothing but" a specific pattern of neural activity (NCA-4412) within committee members. This constitutes a breach of §4.2: the intermediate structures (committee deliberation procedures, criteria evaluation, institutional statutes) performing the actual work of *being a reappointment decision* were omitted. Subsequent project actions (dissolution of the simulated Search Committee module "as ontologically superfluous") render the phenomenon itself (the decision) inexplicable at its proper level. Full explanatory reinstatement of intermediate governance structures ordered.  

      2.5 **Project OMEGA (Traffic Cognition Research Group): "Normative Compliance in Intersection Behaviour"**  
          *Finding:* INCONCLUSIVE (Pending Directorate Review - Code 7X). The project explains driver compliance with red traffic signals by invoking a "stopping convention" – a behavioural regularity sustained by drivers' mutual expectations regarding others' expectations. Initial analysis indicates the mechanism comprises *only* the expectations of other agents (drivers). Attempts to identify a foundational, non-agentic crane structure supporting this network of expectations were unsuccessful. The mechanism appears recursively agent-dependent, raising concerns it may constitute a novel floating aggregate rather than a grounded crane or clear skyhook. Referred to the OES Directorate of Complex Social Epiphenomena for classification ruling.  

  **3. Conditions of Continued Registration**  
  Continued registration of the University's research portfolio under the *Explanatory Standards Act* is contingent upon the following:  

      3.1 Remediation of violations cited in Projects ETA, ZETA, and SIGMA must be submitted to OES Compliance Division within 90 days (by 13 August 2025).  
      3.2 Project OMEGA is suspended pending OES Directorate ruling (Ref: OES/DR/CS-4412-OMG). No further publication or external grant applications based on its current explanatory model are permitted.  
      3.3 All research proposals involving explanatory mechanisms for complex phenomena (Level 3+ per OES Complexity Index) must undergo pre-emptive Crane Viability Assessment (Form OES/CVA-5) prior to ethical approval.  
      3.4 The University must implement mandatory OES-approved training on Kranichian Grounding Principles for all research-active staff and postgraduate supervisors by 31 December 2025. Certification records will be audited.  

  **4. Concluding Remarks**  
  Overall compliance was assessed at 62.8%, marginally below the Sector Minimum Standard (65%). Notably, 76.3% of contested mechanisms inspected during Q1 2025 were later determined to be compliant cranes resting upon other compliant cranes (OES Internal Audit Q1/2025, p.17). The Office recommends the University utilise OES Pre-Certification Consultancy services (Fee Schedule OES/PCC-2) to enhance future compliance efficiency.  

  Regarding the foundational authority of this Office: the authorization mechanism for crane certification derives its validity from the *Explanatory Standards Act*, passed by the Legislature under powers established by the Constitution. This constitutes a multi-tiered structure of delegation and statute, providing identifiable intermediate support. The Office therefore assesses its own licensing mechanism as compliant (CR-2 Certification Grade) and recommends this finding be filed per standard procedure (Ref: OES/SAR-4412-SELF).  

  J. Arbuthnot  
  Inspector, Field Division 7  
  Office of Explanatory Standards  
  19 May 2025  

  ---  
  *Copy Filed: OES Central Registry, OES Directorate of Complex Social Epiphenomena, OES Internal Audit (Self-Assessment)*
