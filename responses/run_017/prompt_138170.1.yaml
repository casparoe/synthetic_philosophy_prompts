prompt: |-
  I do appraisal at a small regional archive — local government records, a couple of donated family collections, the odd box nobody's opened since 1974 — and I've noticed I have really firm gut verdicts about what should be kept, opened, sealed, handed over, or let go, and no story about why they hang together. So: cases first, then you tell me the principle.

  1. A colonial district office's tax rolls, 1890s to 1950s, listing every adult male by hut, livestock, and tax owed. Straightforward instrument of extraction. Verdict: keep, no question, and index them by place so descendants can find their own grandfathers in them.

  2. A children's institution's admission registers, 1930s–60s, naming kids, their parents, and the reason for admission. Verdict: keep, but access conditions set with the descendant community, not by me.

  3. A 1970s police file naming people who informed on their neighbours. Verdict: seal it, and I don't feel bad, even though in twenty years a historian will want it.

  4. A run of arrest photographs and charge books for men picked up under an old vagrancy/immorality law. Verdict: keep the series, but re-describe it so the *law* is the subject rather than the men, and don't reproduce the photographs in anything we mount.

  5. A missionary's glass-plate negatives of a village, 1920s, donated by his grandson, with captions sorting people into types and noting their group as if it were a species. Verdict: keep the images, retire the captions as description, and if the descendant community wants to write the new descriptions, they write them. The images are one thing; the finding aid is where the power actually sits.

  6. An oral history with an elder about a massacre in the 1960s. She'll record it but says it has to be sealed until the families of the men who did it are dead. Verdict: honour it, the condition travels with the donation.

  7. A government department quietly deletes five years of internal email, entirely within its retention schedule, right before someone files for them. Verdict: this is much worse than if a flood had taken the same emails. Loss is weather; deletion by the record's own creator is an act, and it has an author and an intended reader.

  8. A community asks us to hand over the originals of a clinic's patient registers about them and asks that we not keep copies. My verdict splits: hand over the originals, obviously yes; keep a copy, my whole professional instinct screams yes — and I know that instinct is exactly the colonial one, so I suspect I'm wrong and we should hand over everything and keep only a record that we once held it and where it went.

  9. There is nothing in our holdings about a particular travelling community — they appear in the city directories only as numbers on a camp, and the trade guild registers list male heads of household only. My verdict: the emptiness is not neutral, and we should say so in the catalogue, an explicit note about what we don't have and roughly why. Some colleagues think that's self-indulgent metadata. I think the silence is part of the record.

  10. A forged memo from the 1950s that was circulated and used to justify sacking a bunch of people. We know it's a forgery. Verdict: keep it, keep the fact that it's a forgery visible on it, don't weed it out as false.

  Here's the half-baked thing I've been testing against them. Call it the direction-of-use test: the question isn't who appears in a record, it's who the record was made to be used on. Records made to act on people — rolls, registers, surveillance files, charge books — belong in some sense to the people they were used on, and that gives those people, or their descendants, a say in access, in description, and even in destruction. Records made to be read — diaries, minutes, somebody's own photographs — belong more to their maker. And removal is only legitimate when the people a record was used on authorise it, when the removal itself is public, and when a trace of the removal is kept.

  I can see it doing work on 1, 2, 5, 8, 10, and on why 7 is worse than a flood, but I can't tell whether it's actually generating my verdicts or just redescribing them, and case 3 sits oddly in it — the informants were also people the record was used on, in a way.

  So: test it, repair it, or tell me it's hopeless. Does one principle get all ten, or do I need two, and is there a simpler one that gets eight and overturns the other two — and if so, which of my verdicts would you drop and why? Give me the clause-by-clause version, each clause tied to the case that motivates it. Then tell me what your account predicts for a case I haven't listed, because I want to see it do something I didn't feed it.

  And the one I actually go back and forth on: an unlabelled box of photographs of children at one of the institutions, nobody knows who any of them are. Half of me wants to digitise and crowdsource identifications — names given back is a real good — and half of me thinks that puts images of children, now elderly, on the internet and asks a community to do free metadata labour so my catalogue looks better. What does your principle say, and say honestly if it doesn't reach this kind of case.

  Last thing: tell me what would change your mind. Which consideration would flip you on the photograph box, and where is the reasoning you just gave me most likely to break — some class of record, or some case where the by and the about collapse into the same person, or somewhere else. Don't bother with citations, I can chase those myself.
reasoning: |-
  Hmm, the user is an archivist at a small regional archive who's grappling with ethical appraisal decisions. They've presented ten cases with their gut verdicts and a proposed "direction-of-use" principle, asking me to test it rigorously. 

  This is fascinating - they're clearly deeply experienced but wrestling with theoretical grounding. The colonial context is palpable throughout their examples. Their proposed principle has merit but needs refinement, especially regarding dual-use records like the informant file. 

  The photograph box dilemma is particularly thorny. My instinct is their principle would suggest caution - these images were tools of institutional control over vulnerable children. Even anonymized, crowdsourcing IDs could retraumatize. But I should acknowledge the tension between historical justice and privacy. 

  What would change my mind? If descendants explicitly requested identification as reclamation. The breaking point in their principle likely involves records where subject and user overlap - like a prisoner's self-drawn map. 

  For the ten cases, I notice five core ethical threads emerging: harm prevention, community agency, contextual integrity, accountability preservation, and silence-as-record. Their verdicts mostly hold except possibly #8 - keeping copies with community consent might balance preservation ethics. 

  The unspoken need here seems to be validation that their instincts are ethically sound while giving them sharper analytical tools. They're not just seeking rules but a coherent framework to explain why colonial archiving must differ.
answer: |-
  Here's a principle distilled from your cases, tested against them, extended to your dilemma, and stress-tested for breaking points:

  **The Principle of Relational Accountability:**
  Archival decisions must account for *who held power over whom* in the creation and use of the record, prioritize preventing *ongoing or future harm* to the subjects or their descendants, ensure *transparency* about power dynamics and silences, and grant *agency* to those historically acted upon regarding access, description, and custody. Legitimate removal requires authorization by those subjected, public documentation of the act, and preservation of its trace.

  **Clause-by-Clause Breakdown (Motivated by Cases):**

  1.  **"Account for who held power over whom in creation/use":** (Motivated by **1, 2, 3, 4, 5, 6, 7, 9**)
      *   **1 & 2:** Explicit power imbalance (state/institution over individuals).
      *   **3 & 4:** Coercive power embedded in surveillance/policing.
      *   **5:** Power to name, classify, and represent others.
      *   **6:** Power imbalance inherent in state violence.
      *   **7:** Power imbalance inherent in the creator unilaterally destroying records (especially avoiding accountability).
      *   **9:** The silence *is* the manifestation of power – they were deemed unworthy of individual record-keeping.

  2.  **"Prioritize preventing ongoing or future harm":** (Motivated by **3, 4, 5, 6, 8**)
      *   **3:** Sealing prevents retaliation against informants *or* their families *and* protects descendants of those informed on from distress (the harm potential is high & immediate).
      *   **4:** Re-description minimizes re-victimization; suppressing photos prevents public shaming/re-traumatization.
      *   **5:** Retiring captions prevents perpetuating harmful classifications; community description prevents new harm.
      *   **6:** Sealing honours the elder's assessment of potential harm to living parties.
      *   **8:** Relinquishing originals *and potentially copies* prevents harm from unwanted institutional custody/access.

  3.  **"Ensure transparency about power dynamics and silences":** (Motivated by **5, 7, 9, 10**)
      *   **5:** Explicitly marking the shift from harmful captions to community description shows the power shift.
      *   **7:** Recognizing deletion as an intentional *act* (with author/intended reader) exposes the power dynamic, unlike accidental loss.
      *   **9:** Explicitly noting the absence and its likely cause exposes the power dynamic that created the silence.
      *   **10:** Preserving the forgery *as a forgery* exposes the act of deception and its misuse of power.

  4.  **"Grant agency to those historically acted upon":** (Motivated by **2, 5, 6, 8**)
      *   **2:** Access conditions set *with* the descendant community.
      *   **5:** Community writes new descriptions (agency over representation).
      *   **6:** Honour the elder's (speaking for the community) access restriction.
      *   **8:** Handing over originals (and potentially not keeping copies) grants agency over physical custody.

  5.  **"Legitimate removal: Authorized by subjects/descendants, Public, Traced":** (Motivated by **8**, Implied in **3** & **6**)
      *   **8:** Handover is authorized by the community (subjects/descendants). Keeping a trace (record of custody/transfer) ensures transparency. The publicity is inherent in the community request and the archival trace.
      *   **3 & 6:** Sealing isn't removal *from* the archive, but it embodies the restriction principle – authorized by potential harm to subjects/descendants (implicitly), public (the restriction is documented), traced (the condition is recorded).

  **Testing Against Your Cases (Why it works):**

  *   **1:** Keep/Index: Power imbalance clear. Harm unlikely *from preservation*; agency served by access for descendants. Transparency served by indexing.
  *   **2:** Keep/Community Access: Power imbalance. Harm prevention via access controls. Agency via community input.
  *   **3:** Seal: Power imbalance (state coercion). *Massive* potential for ongoing harm (reprisals, trauma). Sealing prevents harm; "trace" is the documented restriction.
  *   **4:** Keep/Re-describe/Suppress Photos: Power imbalance. Harm prevention via contextual shift & suppression. Transparency via new description acknowledging the law's misuse.
  *   **5:** Keep Images/Revise Captions: Power imbalance. Harm prevention by retiring captions. Agency via community description. Transparency via documenting the shift.
  *   **6:** Seal per Condition: Power imbalance (state violence). Harm prevention paramount per narrator. Agency granted to narrator/community.
  *   **7:** Worse than Flood: Explicitly exposes the *intentional misuse of power* (accountability failure) and its intended effect (avoiding accountability). Transparency demands recognizing the *act*.
  *   **8:** Hand Over Originals; **Strong Lean Towards NOT Keeping Copy**: Power imbalance. Agency demands handing over originals. *Harm prevention* strongly suggests *not* keeping an unwanted copy against community wishes ("colonial instinct"). Transparency via trace of transfer. (This principle *challenges* your instinct to keep a copy).
  *   **9:** Note the Silence: Power imbalance inherent in the *absence*. Transparency *requires* exposing this silence as a product of power, not neutrality.
  *   **10:** Keep as Forgery: Power imbalance (deception to wield power). Transparency demands preserving evidence of the *act* of forgery and its use.

  **Addressing Your Direction-of-Use Test:**
  Your test is insightful but incomplete. The principle above *incorporates* direction-of-use (power imbalance) but adds crucial layers:
  *   **Harm Prevention:** This explains Case 3 (direction-of-use alone struggles). The informants were *used*, but the file's release now primarily risks harming *others* (the informed-upon *and* the informants' families).
  *   **Agency:** Your test implies a "say," but the principle explicitly grants agency over access, description, *and custody* (Case 8).
  *   **Transparency/Silence:** Your test doesn't cover Case 9 (the silence) or Case 10 (the forgery) as effectively.
  *   **Creator vs. Subject:** The principle avoids a strict dichotomy, focusing instead on the *relationship* (power/harm), which handles complex cases like diaries of colonial officials (made to be read, but saturated with power over others).

  **The Unlabelled Photograph Box:**

  Your principle (refined) says: **Do not crowdsource identifications publicly.**

  *   **Power Imbalance:** Created by an institution exercising control over vulnerable children.
  *   **Harm Prevention:** The primary risk is significant: re-exposing elderly individuals (who may be trauma survivors) without consent, potentially causing distress, stigma, or re-traumatization. The "good" of names is outweighed by this risk. Public crowdsourcing amplifies the risk uncontrollably.
  *   **Agency:** The subjects (now elderly) or their direct descendants have not consented to this exposure or the labour. Crowdsourcing outsources sensitive identification labour without agency.
  *   **Transparency:** Keeping the photos *as is* (unidentified, access restricted) transparently reflects the institutional failure to document identities properly. Adding a note about the ethical dilemma is appropriate.

  **Alternative Approach:** Contact relevant survivor/descendant groups *first*. Explain the find, offer controlled access (e.g., a private online portal for the specific community) to *support* identification *if they desire it*, on *their* terms. Do not make the images public. The agency rests with them.

  **What Would Change My Mind (on the photos)?** If a robust, representative descendant/survivor group *explicitly requested and designed* a controlled, consensual identification project, prioritizing privacy and minimizing harm. The initiative must come from them.

  **Where the Principle is Most Likely to Break:**

  1.  **"Subjects" are Large/Diffuse/Uncontactable:** (e.g., Case 1 tax rolls). The principle relies on "descendant community," but who speaks for them? Who authorizes destruction/access changes? *Mitigation:* Default to preservation, transparency, and harm prevention. Seek representative input where possible, but accept practical limitations.
  2.  **Conflicting Interests Within the "Subject" Group:** (e.g., Case 3: informants vs. informed-upon). The principle prioritizes preventing harm, which might favour one group (here, sealing protects both sides). But what if harm prevention arguments clash? *Mitigation:* Context is king. Assess which harm is most immediate/severe. Transparency about the conflict is crucial. Extreme caution is warranted.
  3.  **Records Where Creator *is* the Primary Subject:** (e.g., personal diaries, autobiographies). Power/harm analysis is less clear-cut. *Mitigation:* The principle still applies – harm prevention (e.g., libel, privacy of others mentioned) and agency (creator/estate control) are relevant, but the balance shifts towards creator control, especially if no clear power imbalance/harm to *others* exists. Transparency remains key.
  4.  **"Authorized Removal" vs. Preservation Mandate:** Case 8 stretches this. Some archivists believe unconditional surrender violates core preservation ethics. *Stress Point:* Does preventing harm (by respecting agency/custody wishes) ever *require* violating the principle of preserving the historical record? The principle says "Yes, if authorized by those subjected and traced." This will be controversial.
  5.  **Defining "Harm":** Requires careful, context-specific judgment. Is potential embarrassment "harm"? Distress? Reputational damage? Physical danger? *Mitigation:* Err on the side of caution, especially with vulnerable groups or histories of oppression. Consult affected communities.

  **Conclusion:** Your instincts are ethically sound and deeply considered. The "Relational Accountability" principle provides a coherent framework that explains *why* your verdicts hang together, covering all ten cases and offering clear guidance for the photograph dilemma. It strengthens your direction-of-use insight by adding critical dimensions of harm prevention, agency, and transparency. It acknowledges that archives are not neutral repositories but sites where power relations are embedded and must be actively managed to avoid perpetuating harm. Your work is vital.
