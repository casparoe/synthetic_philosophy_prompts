prompt: |-
  I have a single ninety-minute session on epiphenomenalism with fourteen upper-level undergraduates in a cognitive-science seminar — roughly half philosophy majors, half psychology majors, no assigned reading on the topic. They have just finished a unit on blindsight and binocular rivalry, so they already accept that a subject's reports can dissociate from what the visual system is doing, and I suspect that background will let them slide too easily past the view I am trying to make costly. I am not asking you to explain epiphenomenalism or the paradox of phenomenal judgment to me; I am asking for a plan for explaining them, and specifically for a plan that lands the paradox as a cost the theory has to pay rather than as a curiosity.

  Three constraints I have imposed on myself, which I would like you either to honour or to talk me out of. First, I want to run the whole session without the words "qualia" and "zombie" until the final ten minutes, because in past years those labels have arrived with stock responses attached; tell me whether the idea can be carried without them, and where exactly the labels should be handed over. Second, I want the students to see that the paradox does not depend on substance dualism: it survives on the assumption that phenomenal properties are perfectly respectable natural properties that are nonetheless not identical to, and not among, the properties doing the causal work in the production of a judgment — and that a student who takes the exit marked "they are realized by those properties and so inherit their causal powers" has thereby stopped being an epiphenomenalist. Where in the sequence does that fork belong? Third, I intend to hold back the Moorean reply — that my certainty that I am in pain is firmer than any premise in the argument — until the paradox has actually bitten.

  The carrying example I have drafted: a 3D printer whose extruder carriage travels along a rail; the motor currents that move it also produce a high-pitched whine, and a sensor writes the carriage's position into a log file. The whine is caused by those same currents, correlates perfectly with the carriage's position, and causes nothing downstream; the log is caused by the sensor and never by the whine. Read the log and you can infer the pitch exactly. Silence the whine while leaving the currents untouched and the log is word for word what it was. Tell me what this example must have and must lack to carry the argument — I suspect the artifact setting smuggles in a designer, and with it a kind of "aboutness" that the real case does not get for free — and whether I should keep it, repair it, or replace it.

  Then: the dependency structure among the components and why that order rather than another; and a misconception map with each item placed at the point in the sequence where it must be headed off. The ones I predict are that epiphenomenalism is really eliminativism about consciousness; that it says introspection is unreliable, or that our reports about experience would be noise; that it is simply the problem of other minds in disguise; and, from the stronger students, that a belief-forming process perfectly correlated with the fact believed yields knowledge, so there is no paradox here at all. Tell me what else to expect, and whether at this level I should separate the epistemic charge — that the judgment is ungrounded — from the semantic charge — that the judgment is not about the experience in the first place — or deliberately run them together.

  Finally, one question I can put to the room at the end that would show the structure has landed rather than been restated, and an honest statement of what I should refuse to settle in ninety minutes, phrased as I could say it out loud.
reasoning: |-
  Okay, the user is teaching a seminar on epiphenomenalism to upper-level undergrads. They've just covered blindsight and binocular rivalry, so students are familiar with dissociations between reports and visual processing. The main goal is to make students feel the cost of epiphenomenalism, particularly the paradox of phenomenal judgment, without using "qualia" or "zombie" until the end. They also want to show that the paradox doesn't require substance dualism and to hold back the Moorean reply.

  First, the user’s constraints. Avoiding "qualia" and "zombie" makes sense because those terms come with baggage. Instead, using terms like "subjective feel" or "what it’s like" could keep the discussion grounded. The fork about realization needs to be placed clearly. When students suggest that phenomenal properties inherit causal powers via realization, that’s where they exit epiphenomenalism. That point should come after introducing the causal gap but before diving into the paradox. Holding back the Moorean reply until after the paradox is presented ensures students grapple with the argument before retreating to intuition.

  The 3D printer example is clever but might imply design. The whine is an epiphenomenon caused by motor currents, correlating with position but not affecting the log. The problem is the artifact's designed purpose. In natural systems, correlation without causal role doesn't imply intentionality. Maybe replace it with a natural example, like neural processes causing both behavior and experience. For instance, pain: C-fiber firing causes pain (subjective feel) and also pain reports. If pain is epiphenomenal, it doesn’t cause the report. But students might question how the correlation arises without causal connection. The printer example could be repaired by emphasizing accidental correlation, but a biological example might be stronger.

  Dependency structure: Start with dissociations they know (blindsight), then introduce the idea of non-functional subjective aspects. Define epiphenomenalism, stress that it's not eliminativism. Introduce the causal gap, then the fork: if phenomenal properties are realized by causal properties, that's not epiphenomenalism. Then present the paradox of judgment: if the experience doesn’t cause the report, why are reports accurate? Address misconceptions as they arise. For example, epiphenomenalism isn't about introspection being unreliable; it's about the experience not playing a causal role. The other minds problem is separate because epiphenomenalism challenges first-person access too.

  Common misconceptions: Students might think epiphenomenalism denies consciousness exists. Clarify it affirms existence but denies causal role. Another is that reports would be random. But epiphenomenalism says reports are caused by neural states, not experiences. The strong student's point about correlation equating knowledge needs addressing: reliability without causal connection might not suffice for justification. Separate epistemic (how do we know) from semantic (what makes it about) issues early on, as they compound the paradox.

  End with a question that tests understanding: "If we had perfect neuroscience showing no causal link between experience and report, would that challenge our belief that we know our own experiences?" This forces them to confront the paradox without restating it. Admit that resolving the mind-body problem isn't possible in 90 minutes; the goal is to see the cost of epiphenomenalism.

  Overall, the session should flow from familiar concepts to the troubling implications, making the paradox feel costly. Use the printer example but frame the correlation as contingent, not designed. Address misconceptions as they come up, especially the realization fork. Keep epistemic and semantic charges distinct initially, then show how epiphenomenalism struggles with both.
answer: |-
  Here’s a battle-tested 90-minute plan prioritizing **making the paradox costly**, honoring your constraints, and preempting misconceptions. Sequence is critical.

  ---

  ### **Session Structure (85 mins + 5 buffer)**
  **Phase 1: Rehearse Dissociation, Introduce "Subjective Aspect" (15 mins)**  
  - *Hook (5 mins):* "In blindsight, patients deny seeing but guess accurately. In rivalry, you report one image while your V1 processes both. **What persists when reporting dissociates from processing?**" Elicit: *Non-reportable processing* survives.  
  - *Pivot (10 mins):* "But when you *do* report 'I see red,' there’s a **subjective aspect**—*what it’s like*—beyond the report. Crucially, this isn’t just unreported processing (like blindsight); it’s what reports *aim to capture*. Call this 'E-properties' (Experience-properties) for neutrality."  
    → **NO "qualia" yet.** Anchor E-properties as natural (e.g., "a brain state's subjective character").

  **Phase 2: Define Epiphenomenalism, Block Misconceptions (20 mins)**  
  - *Core Definition (5 mins):* "Epiphenomenalism: E-properties are *caused by* neural states (N-states) but *cause nothing*—not even judgments about them. Like engine heat caused by but not causing gear movements."  
  - *Block Eliminativism (5 mins):* "This says E-properties *exist* but are causal dead ends. Not 'consciousness is an illusion'—illusions still cause reports!"  
  - *Block Noise/Unreliability (5 mins):* "Reports are reliable! N-states cause *both* E-properties *and* accurate reports. Like a thermometer reliably indicating temperature because both are caused by heat—not because heat causes the reading."  
  - *The Fork: Realization vs. Epiphenomenalism (5 mins):***  
    **→ CRITICAL FORK:** "If you say E-properties *are identical to* or *realized by* N-states, they inherit causal powers. But then you’re **not an epiphenomenalist**—you’ve dissolved the causal gap. Epiphenomenalism requires E-properties to be *distinct existences* with no downward causation."  
    *Emphasize:* "Natural properties can still be distinct! Like heat ≠ molecular motion in type-identity, or software states ≠ hardware voltages."

  **Phase 3: The Printer Example—Repaired (10 mins)**  
  - *Present (5 mins):* "A 3D printer’s motor (M) moves the carriage (C). M’s current causes C’s position *and* a high-pitched whine (W). A sensor (S) detects C’s position and writes to a log (L). W causes nothing; L is only caused by S."  
  - *Key Fixes (5 mins):*  
    - **Remove "aboutness":** "W isn’t *about* C’s position; it’s a byproduct. Similarly, E-properties aren’t ‘about’ N-states—they just correlate."  
    - **Stress contingency:** "If we silence W, L stays perfect. If we alter W (e.g., change pitch) without changing M/S, L is unchanged. **W doesn’t ground L’s accuracy.**"  
    → *Keep it:* The artifact is a virtue—it concretizes contingency and causal isolation.

  **Phase 4: Land the Paradox of Phenomenal Judgment (25 mins)**  
  - *Set Up (5 mins):* "When you judge ‘I’m seeing red,’ that judgment (J) is caused by N-states. E-properties (e.g., redness-experience) are *also* caused by N-states. But if E-properties cause nothing, **they don’t cause J.**"  
  - *The Cost (15 mins):*  
    - **Epistemic Charge First (10 mins):** "J is reliably *about* your E-property. But if E-properties don’t cause J, **what grounds the match?** Correlation isn’t enough—recall the printer: L correlates with W, but W doesn’t make L *about* W or *justify* inferences about W. If a neuroscientist saw your N-states, they could predict your E-properties and your J—but *you* have no access to N-states! Your J seems *based on* E-properties, but they’re causally inert."  
      → *Preempt "correlation = knowledge":* "In the printer, L correlates perfectly with W—do we say L *knows* W? No! It’s just a byproduct. Why is your judgment different?"  
    - **Then Semantic Charge (5 mins):** "If E-properties don’t cause J, what makes J *about* them? We usually say beliefs are about what causes them. If E-properties are causally irrelevant, J might really be about N-states—but you don’t experience *those*!"  
  - *Hold Back Moore:* Let discomfort build. The paradox is that J feels direct/infallible but is ungrounded.

  **Phase 5: Unleash "Qualia" and "Zombie" (5 mins)**  
  - "What philosophers call ‘qualia’ are these E-properties. A ‘zombie’ is your physical duplicate without E-properties. Since E-properties cause nothing, **zombies act exactly like you**—they’d *say* ‘I see red!’ while processing red. But if zombies are possible, why trust your own judgments?"  
    → Labels arrive *after* the machinery is built, minimizing stock responses.

  **Phase 6: Final Challenge & Open End (10 mins)**  
  - *Pivotal Question:* **"If epiphenomenalism is true, what—if anything—makes your judgment 'I am conscious' different from the printer's log entry about the whine?"**  
    → Tests if they grasp the grounding problem (answer: "Nothing, and that’s the cost").  
  - *Refuse to Settle (say aloud):* "We won't resolve the mind-body problem today. My goal was to show why epiphenomenalism—even if coherent—demands we abandon the intuition that our awareness of experience is *causally grounded* in the experience itself. That’s the price of the ticket."

  ---

  ### **Misconception Map (Where to Intercept)**  
  1. **"It’s eliminativism!"** → During definition (Phase 2).  
  2. **"Introspection is unreliable!"** → When blocking noise (Phase 2); stress reliability stems from N-states.  
  3. **"It’s the other-minds problem!"** → During the paradox (Phase 4); note this undermines *first-person* authority.  
  4. **"Correlation implies justification!"** → During epistemic charge (Phase 4); use printer to show otherwise.  
  5. **"But E-properties *are* the N-states!"** → At the fork (Phase 2); that’s not epiphenomenalism.  

  ### **Key Adjustments & Tips**  
  - **Separate Epistemic/Semantic:** Start epistemic (ungrounded judgment) to make it tangible, then add semantic (what’s it *about*?) to deepen the cost. Running them together muddies clarity.  
  - **Printer’s Weakness:** Its "designed" feel. Mitigate by stressing: "In nature, correlation can be brute—no designer needed."  
  - **What to Expect:** Strong students may invoke evolutionary explanations ("Why would E-properties evolve if useless?"). Reply: "Epiphenomenalism allows them as byproducts (like the whine). Efficiency ≠ causal efficacy."  

  This plan forces confrontation: *Even if consciousness exists and reports are reliable, epiphenomenalism severs the link between experience and self-knowledge.* By Phase 4, the room should feel the bite.
