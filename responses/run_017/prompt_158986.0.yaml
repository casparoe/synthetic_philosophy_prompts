answer: |-
  Below is a decision tree designed to help students distinguish between major positions in the philosophy of language and modality, based on their responses to concrete cases (e.g., Hesperus/Phosphorus, Twin Earth, standard meter, indexicals). The tree starts from the shared commitment that some identities are necessary a posteriori and that reference can succeed despite false associated descriptions. Each branch node is a single question answerable from case analysis alone, using only the vocabulary introduced in the cases or the query. Positions are separated by their *answers to cases*, not by labels.

  The tree prioritizes your specified cuts (status of a priori intension, nature of dimensions, role of deep necessity, treatment of indexicals, and role of conceivability) and explicitly flags collapsed positions or empty cells. Semantic and epistemological questions (e.g., the status of intension vs. conceivability) are kept on separate branches to avoid conflation. 

  After the tree, I provide:
  - A summary of which questions do the real discriminating work and which are redundant.
  - A mapping of empty cells with explanations.
  - Notes on collapsed positions.

  ---

  ### **Decision Tree: Views on Modality and Semantic Content**

  **Start**: All students accept:
  - Some identities are necessary but knowable only a posteriori (e.g., "Hesperus is Phosphorus").
  - A term can refer successfully even if most associated descriptions are false (e.g., "water" on Twin Earth).

  ---

  #### **Question 1: Is the a priori-accessible intension (what we can know a priori about reference, e.g., "water is the watery stuff" in the Twin Earth case) a genuine component of semantic content, or merely something we can know a priori about the reference?**
  - **Yes** (It is part of semantic content) → Go to Question 2.
  - **No** (It is not part of semantic content; it is just a priori knowledge about reference) → Go to Question 3.

  #### **Question 2 (If Yes to Q1): Are the two dimensions best understood as two dimensions of epistemic status (e.g., conceivability vs. possibility) or two dimensions of modality (e.g., different kinds of necessity)?**
  - **Epistemic status** (e.g., primary intension tracks what is knowable a priori, secondary intension tracks metaphysical necessity) → **Position: Epistemic Two-Dimensionalism (Chalmers)**.  
    - *Deep necessity*: Does real philosophical work (e.g., grounds conceivability-possibility link for zombie arguments).  
    - *Indexicals*: Fall out of the same framework (e.g., "I" has a primary intension capturing self-ascription).  
    - *Conceivability*: Load-bearing (e.g., zombie conceivability implies possibility in the primary sense).  
  - **Modality** (e.g., dimensions represent different metaphysical possibilities) → *Empty Cell*: Unoccupied because incoherent. A dimension of epistemic status (from Q1) cannot be reclassified as pure modality without collapsing the a priori/metaphysical distinction the view relies on.

  #### **Question 3 (If No to Q1): Is a two-dimensional framework (e.g., context and world) used to explain how expressions behave across cases?**
  - **Yes** → Go to Question 4.  
  - **No** → Go to Question 5.  

  #### **Question 4 (If Yes to Q3): Are the two dimensions primarily dimensions of context (e.g., fixing reference based on utterance situation) or of epistemic status (e.g., tracking what is knowable a priori)?**
  - **Context** (e.g., context sets reference, circumstance evaluates truth) → **Position: Contextualist/Metasemantic Two-Dimensionalism (Stalnaker, Kaplan)**.  
    - *Deep necessity*: Bookkeeping device (e.g., "deep necessity" just flags when a statement is a priori true in all contexts).  
    - *Indexicals*: Fall out of the same framework (e.g., "now" depends on context parameter).  
    - *Conceivability*: Idle machinery (e.g., conceivability plays no essential role in semantics).  
  - **Epistemic status** → *Empty Cell*: Unoccupied because unattractive. Combining epistemic dimensions with rejection of intension as semantic content (from Q1) creates tension; no theorist defends this as it undermines the motivation for epistemic dimensions.

  #### **Question 5 (If No to Q3): Does the theory treat essentially indexical expressions (e.g., "I," "now") as needing their own separate semantic apparatus?**
  - **Yes** (e.g., indexicals require distinct rules like Kaplan's character-content distinction) → Go to Question 6.  
  - **No** (e.g., indexicals reduce to non-indexical descriptions or direct reference) → *Empty Cell*: Unoccupied because incoherent. Indexical cases (e.g., "I am here now" being contingent a priori) cannot be handled without a dedicated account of context; all major theories include one.

  #### **Question 6 (If Yes to Q5): Is the framework's treatment of conceivability (e.g., in zombie arguments) essential for explaining modal knowledge, or just an idle add-on?**
  - **Idle add-on** (e.g., conceivability is heuristic, not semantically load-bearing) → **Position: Direct Reference with Reference-Fixing (Kripkean treatment)**.  
    - *Deep necessity*: Bookkeeping device (e.g., "necessity in the primary sense" is just a label for a priori necessity, with no deeper role).  
    - *Indexicals*: Need separate apparatus (e.g., Kaplan's theory).  
    - *Conceivability*: Idle machinery (e.g., zombies are conceivable but this doesn't imply possibility; it's an epistemological distraction).  
  - **Essential for modal knowledge** → *Empty Cell*: Unoccupied because unattractive. Rejecting both intension as content (Q1) and a two-dimensional framework (Q3) while making conceivability load-bearing is seen as ad hoc; no one defends it.

  #### **Question 7 (If No to Q3 and before Q5; alternative path for Q3=No): Does the theory reject the two-dimensional apparatus as a misdescription of semantic phenomena (e.g., argues that it conflates semantics with epistemology)?**
  - **Yes** → **Position: Skeptical of Two-Dimensionalism (Soames)**.  
    - *Deep necessity*: Bookkeeping device (but the label is misleading; there's only metaphysical necessity).  
    - *Indexicals*: Need separate apparatus (e.g., direct reference with contextual parameters).  
    - *Conceivability*: Idle machinery (e.g., zombie arguments fail because conceivability doesn't track semantics).  
  - **No** → *Collapsed Position: Direct Reference and Reference-Fixer Descriptivism*.  
    - Includes Kripkean direct reference and descriptivist variants that grant cases but deny semantic content involves intensions (e.g., reference-fixing descriptions are metasemantic, not semantic).  
    - *Collapse Reason*: Both share the same answers to all branch questions: intension not semantic content (Q1=No), no two-dimensional framework for semantics (Q3=No), indexicals need separate apparatus (Q5=Yes), conceivability idle (Q6=Idle). No case-based question separates them.  
    - *Deep necessity*: Bookkeeping device.  
    - *Indexicals*: Need separate apparatus.  
    - *Conceivability*: Idle machinery.  

  ---

  ### **Summary of Discriminating Power and Redundancy**
  - **Key Discriminating Questions**:  
    - **Question 1 (intension as semantic content)**: Does the most work, cleanly separating epistemic two-dimensionalism (Chalmers) from others. It is essential and non-redundant.  
    - **Question 3 (use of two-dimensional framework)**: Crucial for separating contextual two-dimensionalism (Stalnaker/Kaplan) from direct reference/skeptical views. Non-redundant.  
    - **Question 7 (rejection of two-dimensionalism)**: Vital for isolating Soames' skepticism; without it, Soames collapses into direct reference. Non-redundant.  
  - **Partially Redundant Questions**:  
    - **Question 2 (nature of dimensions)**: Only active after Q1=Yes, and merely confirms Chalmers; it doesn't split views further (the modality option is empty). Redundant for discrimination but clarifies the view.  
    - **Question 4 (context vs. epistemic dimensions)**: Only active after Q3=Yes, and merely confirms Stalnaker/Kaplan; the epistemic option is empty. Redundant for discrimination.  
    - **Question 5 (indexicals need separate apparatus)**: Active only after Q3=No, but all paths except the empty cell answer Yes. Redundant for splitting (only one live outcome), but necessary to rule out incoherent views.  
    - **Question 6 (conceivability load-bearing)**: Only active in one path (Q3=No and Q5=Yes), and the "essential" option is empty. Redundant for splitting but clarifies the idle role of conceivability in direct reference.  
  - **Why Semantic/Epistemological Cuts Stay Separate**: Questions about semantic content (Q1, Q3) are isolated from epistemological ones (Q6, conceivability role). This prevents conflation (e.g., Chalmers uses conceivability epistemically but embeds it in semantics, while Soames rejects it entirely).

  ### **Empty Cells and Collapsed Positions**
  - **Empty Cell 1 (Q2 → Modality)**: Unoccupied because incoherent. If the a priori intension is semantic (Q1=Yes) but dimensions are purely modal (not epistemic), it contradicts the core claim that apriority is a distinct dimension.  
  - **Empty Cell 2 (Q4 → Epistemic status)**: Unoccupied because unattractive. Denying intension as content (Q1=No) while calling dimensions "epistemic" undermines the epistemic role; no theorist combines these.  
  - **Empty Cell 3 (Q5 → No)**: Unoccupied because incoherent. Indexical cases (e.g., "I am here now") cannot be explained without contextual apparatus; any view denying this is incomplete.  
  - **Empty Cell 4 (Q6 → Essential)**: Unoccupied because unattractive. Without intension as content or a two-dimensional framework, making conceivability load-bearing is seen as unmotivated and ad hoc.  
  - **Collapsed Position (Direct Reference and Reference-Fixer Descriptivism)**: These views (e.g., Kripke and descriptivists who grant cases but relegate reference-fixing to metasemantics) share identical answers to all questions. They are separated only rhetorically (e.g., emphasis on reference-fixing), not by case commitments.

  ### **How to Use This Tree**
  - **For Students**: Work through the tree using cases. E.g., for Q1, consider Twin Earth: if "water is the watery stuff" is semantic content, it explains why we can know a priori that water is watery, but if not, it's just a fact about how reference is fixed.
  - **For Teaching**: Focus on Q1, Q3, and Q7 as discussion starters; they force students to articulate what cases show without jargon. The redundant questions (Q2, Q4, Q5, Q6) can be skipped if time is short, as they don't split views further.
  - **Tree Structure**: Honest about collapses and empty cells, with no manufactured distinctions. Total leaves: 5 (Chalmers, Stalnaker/Kaplan, Soames, collapsed direct reference, and one empty cell in Q5). 

  This tree isolates positions by their case commitments, helping students move beyond labels to underlying disagreements. For a handout, you might simplify to a flowchart diagram with the questions and outcomes.
