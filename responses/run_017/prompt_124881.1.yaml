  ### Taxonomy of Hedonistic Heterogeneity  
  *Answer the branching questions honestly to locate your view. Cases must be addressed as described, without assuming theoretical labels.*

  **Branching Questions:**  
  1. **Experience Machine Case:** A person in an experience machine has vivid, sought-after states they report as intensely pleasurable, but these states are not real and lead to a life of delusion and harm. Is this state a genuine pleasure?  
     - **Yes:** Proceed to Q2.  
     - **No:** Proceed to Q3.  

  2. **Awareness Cases (Climber and Background Contentment):** In the absorbed climber (no reported feeling during the climb) and background contentment (unreported until prompted), can these be pleasures without the subject’s awareness at the time?  
     - **Yes:** Proceed to Q4.  
     - **No:** Go to Leaf 1.  

  3. **Common Quality Cases (Dry Satisfaction, Astringent Food, Relief, Fiction):** Given dry satisfaction (no sensory phenomenology), astringent food (simultaneous enjoyment and dislike), relief (absence of pain), and fictional delight (object not real), do all pleasures share a common felt quality?  
     - **Yes:** Go to Leaf 2.  
     - **No:** Go to Leaf 3.  

  4. **Evidence Priority Case (Reward-System vs. Report):** When measurable reward-system response (e.g., dopamine) conflicts with self-reports of enjoyment, which has priority for determining pleasure?  
     - **Self-report:** Go to Leaf 4.  
     - **Reward-system:** Go to Leaf 5.  

  **Leaves (Views):**  
  - **Leaf 1: Conscious Felt Quality View**  
    - *Statement:* Pleasures share a distinctive, conscious felt quality (e.g., "hedonic tone") that unifies them.  
    - *Awkward commitment:* Denies that the absorbed climber experiences pleasure during the climb, as she reports no feeling.  
  - **Leaf 2: Felt Quality with Double-Duty**  
    - *Statement:* Pleasures share a common felt quality, and this quality is also what makes them beneficial.  
    - *Awkward commitment:* Must argue that relief and fictional delight have a positive sensory quality, despite appearing to lack it.  
  - **Leaf 3: Value-Dependent Eliminativism**  
    - *Statement:* "Pleasure" is eliminable; serious ethics/psychology should use only unified properties that explain benefit.  
    - *Awkward commitment:* Dismisses common intuitions about pleasure (e.g., in the climber or astringent cases) as confused.  
  - **Leaf 4: Attitudinal/Modal Hybrid**  
    - *Statement:* Pleasure combines a pro-attitude with a distinctive feeling; it is a way of experiencing (mode) or an attitude toward content.  
    - *Awkward commitment:* Struggles to explain the dry satisfaction (no salient feeling) or astringent food (simultaneous opposite attitudes).  
  - **Leaf 5: Functional Role View**  
    - *Statement:* Pleasure is unified solely by a functional role (e.g., reward-system response) in learning and action.  
    - *Awkward commitment:* Counts reward-system activations as pleasures even when self-report denies them (e.g., the evidence-priority case).  
  - **Leaf 6: Pro-Attitude View**  
    - *Statement:* Pleasure is a pro-attitude (e.g., desire for continuation) toward an experience or object.  
    - *Awkward commitment:* Implies background contentment is a pleasure only if a dispositional attitude exists, even if unfelt.  
  - **Leaf 7: Mode View**  
    - *Statement:* Pleasure is a mode of undergoing an experience (e.g., "savoring"), not an experience itself.  
    - *Awkward commitment:* Cannot easily account for relief (an absence) or fictional delight (non-real object) as modes.  
  - **Leaf 8: Disjunctivism/Gerrymander**  
    - *Statement:* Pleasures share no common property; the class is a disunified set (e.g., sensory, intellectual) or a gerrymandered category.  
    - *Awkward commitment:* Accepts that "pleasure" is heterogeneous, making it useless for explanatory roles without further constraints.  

  **Named Views Located (for reference post-tree):**  
  - Distinctive felt quality: Leaf 1 (if Q2=No) or Leaf 2 (if Q3=Yes).  
  - Mode view: Leaf 7.  
  - Pro-attitude view: Leaf 6.  
  - Hybrid: Leaf 4.  
  - Functional role: Leaf 5.  
  - Disjunctivism: Leaf 8.  
  - Eliminativism: Leaf 3.  

  **Unoccupied Combinations (empty branches):**  
  1. **Q1=No, Q2=Yes, Q3=Yes (Leaf 5 in 3-question tree):** *Empty because incoherent.* Claims pleasures share a common quality and can be unconscious but denies double-duty—yet a felt quality is typically what makes pleasure beneficial, creating tension.  
  2. **Q1=Yes, Q2=No, Q3=No (Leaf 4 in 3-question tree):** *Empty because unattractive.* Requires double-duty, awareness, and no common quality, but no theory unifies pleasure without a common property while also explaining value.  
  3. **Q1=No, Q2=No, Q3=No (Leaf 8):** *Empty because unexplored.* Combines awareness-only, no common quality, and no double-duty, but no one defends this (mode/pro-attitude views occupy nearby leaves).  

  **Indistinguishable Leaf Pairs and Separating Questions:**  
  1. **Leaf 5 (Functional Role) and Leaf 6 (Pro-Attitude):** *Further question:* In the astringent food case (enjoyed/disliked at once), can a single experience include both pleasure and displeasure? (Functional: Yes—roles can conflict; Pro-attitude: No—attitudes must cohere or alternate.)  
  2. **Leaf 4 (Hybrid) and Leaf 7 (Mode):** *Further question:* For the dry satisfaction, is the pleasure an added component or the entire experience’s manner? (Hybrid: Added component; Mode: Entire manner—no further question can cleanly split them due to conceptual overlap.)  
  3. **Leaf 1 (Felt Quality) and Leaf 2 (Double-Duty):** *Further question:* Must the felt quality explain why pleasure benefits? (Leaf 1: No; Leaf 2: Yes.)  
  4. **Leaf 3 (Eliminativism) and Leaf 8 (Disjunctivism):** *Further question:* In the reward-system case, is "pleasure" a useful category if studies show no neural/behavioral unity? (Eliminativism: No—abandon it; Disjunctivism: Yes—use contextually.)  
  5. **Leaf 6 (Pro-Attitude) and Unnamed Q1=No/Q2=Yes/Q3=No Branch:** *Reason no question could:* Both share answers; only a theory-specific commitment (e.g., to desire-based value) separates them, but the tree excludes value-based branching to avoid conflation.
