answer: |-
  As a committed Scanlonian, I must reject your proposed "procedures" as external impositions that misunderstand reasonable justifiability. The core question is whether any individual has an unreasonable complaint under a given principle. Plan A gives Ann a severe 10-unit burden while others escape entirely—Ann can reasonably reject any principle permitting this when alternatives distribute burdens more fairly. Plan B still leaves Bob and Cara each bearing 6 units while Ann bears none, which Bob and Cara could reasonably reject as disproportionately demanding of them when a less unequal option exists. Plan C, however, imposes only 5 units on each: while the *total* burden is higher, no one shoulders a crushing load alone, and no one is unfairly exempted. Ann’s complaint in A (10 vs. 0 for others) is stronger than any single complaint in C (5 vs. 5 and 5), and the equal distribution in C mitigates comparative fairness complaints that Bob and Cara would have against B (6 each vs. Ann’s 0). Thus, principles permitting C are uniquely non-rejectable.
