prompt: |-
  I sit on the ethics working group that advises our municipality's autonomous shuttle pilot. We rule on stylised emergency scenarios, and the engineers then have to implement each ruling as a constraint on the motion planner. We are down to one scenario that has resisted a decision, and I want the ruling, not a survey of the literature on trolley cases. Unless I say otherwise, in every scenario the service brakes have failed, everyone involved is an adult, no one is responsible for the emergency, no one has consented to anything, and the shuttle owes no one a special duty.

  Our seven precedents:

  1. *Divert.* Five pedestrians in the crosswalk ahead. The shuttle can swerve onto a wide sidewalk where one pedestrian is standing; a wall beyond her stops the shuttle before it reaches anyone else; she is killed by the swerve. Ruled: MAY swerve.
  2. *Plow.* No swerve available. A side-mounted plow could sweep a bystander into the shuttle's path so that his body stops it; he is killed. Ruled: MAY NOT.
  3. *Loop.* Swerve onto a service lane where one worker is standing. Nothing beyond him stops the shuttle: the collision with him is what halts it before it can continue to the five. He is killed. Ruled: MAY NOT.
  4. *Sandbags.* Steer into a sandbag barrier. The shuttle derails, and flying debris kills a bystander standing several metres away. Ruled: MAY.
  5. *Even numbers.* One pedestrian ahead, one pedestrian on the sidewalk, no other difference. Ruled: MAY NOT swerve.
  6. *Doomed worker.* As in *Loop*, the collision with the worker in the service lane is the only thing that will stop the shuttle — except that an unrelated scaffold is collapsing and will crush him two seconds later whatever we do, so the collision costs him nothing. Ruled: MAY.
  7. *Passenger.* The shuttle can save five pedestrians only by swerving into a concrete barrier, which kills its own passenger. Ruled: MAY NOT.

  The undecided case:

  *Trigger.* The mechanical brakes have failed, but the shuttle carries an automatic emergency braking system that engages only on a confirmed pedestrian detection within three metres. The five are around a bend, outside sensor range. The only pedestrian the shuttle can detect is a worker in the service lane. If the shuttle enters the lane, the emergency system fires as it closes on the worker and stops the shuttle before it can reach the five. The planner estimates roughly one chance in three that the shuttle still strikes him before stopping, with death near-certain if it does. His body contributes nothing to stopping the shuttle — the brakes do all the work — but his presence in the lane is what makes them fire.

  Several members keep reaching for the doctrine of double effect and its distinction between harm intended as a means and harm merely foreseen as a side effect. I do not think that settles anything here, because the case sits exactly where that distinction is ambiguous: the rescue runs through the worker, but arguably not through any harm to him.

  What I want from you:

  1. The two or three principles that fit all seven precedents. State each precisely enough to be implemented, and say which precedent does the work for it and which precedent it has to explain away — in particular how each handles *Doomed worker* and *Passenger*.
  2. What each principle predicts about *Trigger*.
  3. The ruling you recommend, with your reasons, and the closest analog among precedents 1 to 7. I take it that *Trigger* has something in common with both *Divert* and *Loop*; I want to know which one controls and why.
  4. What we would be committing ourselves to either way — including whether a MAY NOT commits us to anything about cases in which the person the manoeuvre runs through suffers no harm at all.
  5. The one further variant that would separate the surviving principles. We can construct whatever you need: a version in which the strike probability is effectively zero, a worker merely detected from a safe distance behind a fence, a consenting test worker, a worker who caused the brake failure. Take whichever does the most work.
  6. Whether the principle you recommend can be stated without appealing to anyone's intention, since the engineers cannot implement a constraint on intentions — and, if it cannot, what we lose by recasting it in causal or structural terms.

  If you think one of the seven is bearing more weight than it can bear, say so. And if it helps, add where you expect the group in fact to land, as opposed to where consistency pushes it.
reasoning: |-
  Okay, the user is part of an ethics working group for an autonomous shuttle pilot, and they need a ruling on the "Trigger" scenario. Let me start by understanding the precedents and the current case.

  First, the precedents: There are seven rulings. Divert allows swerving to save five by killing one on the sidewalk. Plow forbids using a plow to sweep someone into the path. Loop forbids swerving where the worker's collision stops the shuttle. Sandbags allows derailing even if debris kills a bystander. Even numbers forbids swerving to kill one to save one. Doomed Worker allows it because the worker was going to die anyway. Passenger forbids killing the passenger to save pedestrians.

  The undecided case, Trigger, involves detecting a worker to activate emergency brakes, which stops the shuttle before reaching five, but with a 1/3 chance of killing the worker. The worker's presence triggers the brakes, but harm isn't necessary for the stop.

  The user wants principles that fit all precedents. Let me look for patterns. Divert and Sandbags allow actions where harm is a side effect, not a means. Plow, Loop, and Passenger involve using harm as a means. Doomed Worker is allowed because no net harm. Even numbers forbids equivalent swap.

  So Principle 1: Harm as a means is forbidden unless no net harm (Doomed Worker). Principle 2: Side-effect harm is permitted if proportional. But Trigger is ambiguous. Is the worker's presence a means, or just detection? The harm isn't required for the brakes to work, so maybe it's a side effect. But entering the lane intends to use the worker's presence, not harm.

  Doomed Worker is key because harm is used but no cost. In Trigger, the worker might die, so net harm. That aligns with Loop, which forbids using harm as a means. But in Trigger, the harm isn't the means; detection is. So maybe closer to Divert or Sandbags.

  For ruling, if MAY, it's like Divert because harm is a byproduct. If MAY NOT, like Loop because the action requires the worker's presence. The user needs to know if using the worker's presence as a means is allowed if harm isn't intended. Precedents suggest that using a person as a means is problematic unless no harm (Doomed Worker) or side effect (Divert).

  Further variant: Worker behind a fence, no harm risk. If MAY, then presence as means is acceptable. If not, then presence itself is the issue. Or zero strike probability. If still forbidden, then the objection is to using the person, not harm.

  Implementation: Principles must avoid intentions. Causal terms like "requires physical presence" or "harm necessary for outcome" could work. For Trigger, since harm isn't necessary, maybe it's allowed. But in Loop, presence was necessary, and forbidden. Unless in Loop, harm was necessary for stopping, whereas in Trigger, presence triggers brakes without needing harm.

  The group might lean MAY NOT due to similarity to Loop. But consistency with Divert and Sandbags suggests MAY. The key is whether using the person's presence (not harm) is permissible. Doomed Worker allowed because no harm, so presence as means was okay. In Trigger, harm is possible, so maybe not. But Sandbags had foreseen harm and was allowed. So if the harm is a side effect, not means, it's permissible. In Trigger, harm isn't the means; detection is. So MAY should be allowed. But the group's hesitation might be because the shuttle is entering the lane intending to use the worker's presence, making it feel like a means.

  Recommended ruling: MAY, analogous to Divert. Because the harm is a foreseen risk, not the mechanism of stopping. Brakes stop the shuttle, not the worker's body. So it's a side effect. Doomed Worker is different because no harm, but here harm is possible but not required. Sandbags had unintended debris harm. Similar here.

  Commitments: If MAY NOT, it forbids even non-harmful use of presence? Probably not, as Doomed Worker allowed presence as means without harm. So MAY NOT in Trigger would only apply when harm risk exists. If MAY, it allows using presence as a trigger if harm isn't intended and is proportional.

  Further variant: Worker behind fence, zero harm risk. If MAY, then presence as means is acceptable. If the group says MAY NOT here, then principle 1 (using person as means) is forbidden regardless of harm. But Doomed Worker allowed it, so they need to accept that presence as means is okay if no harm. In Trigger, since harm is possible, it's forbidden. That would align with Loop and Plow.

  But the user wants principles that fit all. Principle 1: Prohibit harm as means (Plow, Loop, Passenger). Allow if no net harm (Doomed Worker). Principle 2: Allow side-effect harm if proportional (Divert, Sandbags). Even numbers is a tie-breaker.

  In Trigger, is the harm a means or side effect? The action is entering the lane to trigger detection. The harm is a possible consequence. The means is the presence, not the harm. So it should be allowed as a side effect. But precedents like Loop forbid using presence if it causes necessary harm. Here, harm isn't necessary. So closer to Divert.

  The group might land on MAY NOT because of discomfort with targeting an individual. But consistency suggests MAY. To test, the zero-harm variant: if the worker is safe, would they allow triggering the brakes? If yes, then in Trigger, the risk is the issue. If not, then using presence as means is forbidden. But Doomed Worker allowed presence as means, so the group must accept it in no-harm cases. Therefore, for Trigger, since harm is possible, they might prohibit, but that would be inconsistent with Sandbags, which allowed risk to bystanders. So MAY is consistent.
answer: |-
  ### Analysis and Recommendations for the *Trigger* Case

  Based on your seven precedents, I derive **two core principles** that fit all rulings without contradiction. These principles center on *causal roles* and *net harm*, intentionally avoiding subjective "intention" to ensure engineer-implementability. I explain each precedent's alignment, address ambiguities in *Doomed worker* and *Passenger*, and apply this to *Trigger*. Finally, I provide a ruling, commitments, and a decisive variant.

  ---

  ### 1. Principles Fitting All Seven Precedents  
  *(Stated for motion planner constraints)*

  #### **Principle 1: Prohibition on Instrumental Harm**  
  *"The shuttle MAY NOT cause physical impact with a person if that impact is a necessary causal step to achieve the outcome (e.g., stopping the shuttle or saving others). Exception: If the person would have died imminently regardless, with no net harm caused."*  
  - **Workhorse precedents**: Explains *Plow* (bystander swept into path as stopping mechanism), *Loop* (collision with worker halts shuttle), and *Passenger* (barrier impact kills passenger to save others).  
  - **Explains away *Doomed worker***: The exception applies here—scaffold guarantees imminent death, so no net harm. The collision isn't "instrumental" in a morally relevant sense.  
  - **Handles *Even numbers***: Swerving to kill one to save one is forbidden because impact is instrumental to "saving" (net lives unchanged, but harm is still actively used).  

  #### **Principle 2: Allowance of Non-Instrumental Foreseen Harm**  
  *"The shuttle MAY cause foreseeable harm (including death) to a person if:  
  (a) The harm is a side effect of an action not inherently reliant on that person's physical body as a causal mechanism; and  
  (b) The action achieves a net reduction in harm (e.g., 5 saved vs. 1 killed)."*  
  - **Workhorse precedents**: Explains *Divert* (swerve uses sidewalk as path; wall stops shuttle, worker's body isn't the stopping mechanism), *Sandbags* (derail uses barrier; debris harm is collateral, not part of stopping), and *Doomed worker* (collision is incidental to using the lane; no net harm).  
  - **Explains away *Passenger***: Killing the passenger fails (a)—the barrier impact *is* the stopping mechanism, making harm instrumental.  
  - **Clarifies *Even numbers***: Fails (b)—no net reduction (1:1 swap), so harm is disproportionate.  

  #### Why These Principles Fit  
  - No precedent bears undue weight. *Doomed worker* is the lynchpin for Principle 1's exception, but it aligns cleanly.  
  - Both principles are structural: They rely on **causal necessity of harm** and **physical role of persons/objects**, not intentions. Engineers can implement these as constraints on path planning (e.g., "if outcome requires impact-with-person: prohibit"; "if harm is collateral to non-person mechanism: allow if net harm reduced").  

  ---

  ### 2. Prediction for *Trigger*  
  - **Principle 1**: Predicts **MAY NOT**. Entering the service lane uses the worker's *physical presence* (not just detection) as a necessary causal step to trigger brakes. While impact isn't guaranteed, the worker's body is instrumental to the outcome.  
  - **Principle 2**: Predicts **MAY**. The harm is non-instrumental—brakes (not the worker's body) stop the shuttle. His presence is a detection trigger, but death is a foreseen risk (like debris in *Sandbags*), and net harm is reduced (save 5, risk 1).  

  ---

  ### 3. Recommended Ruling & Analog Precedent  
  - **Ruling**: **MAY** swerve into the service lane.  
  - **Closest Analog**: ***Divert*** (not *Loop*).  
  - **Reasons**:  
    - **Causal mechanism matches *Divert***: In *Trigger*, the brakes (like the wall in *Divert*) are the stopping mechanism. The worker’s body isn’t structurally necessary—detection could hypothetically occur without impact (e.g., if he were behind a fence). Harm is a risk, not a requirement.  
    - **Distinction from *Loop***: In *Loop*, the collision *is* the stopping mechanism. *Trigger* uses detection to activate brakes, making the worker analogous to the sidewalk in *Divert*—a spatial element enabling the stop, not a physical "crumple zone."  
    - **Net harm reduction**: 5 saved vs. 1/3 risk of death (~0.33 expected fatalities) aligns with *Divert* and *Sandbags*.  
    - **Double-effect ambiguity resolved**: The harm isn't a "means"; it's a byproduct of using the lane. Principle 2 covers this.  

  ---

  ### 4. Commitments  
  - **If we rule MAY**:  
    - We commit to allowing maneuvers that use a person’s *location* or *detectability* (not their body) as a causal enabler, even with foreseeable harm risk.  
    - **Not committed to non-harm cases**: A MAY NOT ruling in harmless variants (e.g., worker behind a fence) would require new principles, as *Doomed worker* already permits non-harmful instrumental use.  
  - **If we rule MAY NOT**:  
    - We commit to prohibiting any maneuver that *relies on a person's physical presence* to achieve the outcome, regardless of harm probability.  
    - **Harmless variant implication**: A MAY NOT here *implies* prohibiting even non-harmful cases (e.g., triggering brakes via a worker behind a fence). This conflicts with *Doomed worker*, which allowed using the worker’s presence when harmless.  

  ---

  ### 5. Decisive Variant to Test Principles  
  - **Variant**: *"Worker Behind Fence"*  
    - Timescale: Immediate.  
    - Setup: Identical to *Trigger*, but the worker is safely behind a fence (0% strike probability). His presence is detected, triggering brakes to save the five.  
    - **Why this variant?**  
      - Isolates the "instrumental use of presence" question.  
      - Principle 1 (Prohibition on Instrumental Harm): Predicts **MAY NOT**, as the worker’s presence is still a necessary causal step.  
      - Principle 2 (Allowance of Non-Instrumental Harm): Predicts **MAY**, as no harm occurs, and presence is a trigger (like using a sensor beacon).  
    - **Outcome**:  
      - If your group rules **MAY**, Principle 2 prevails (consistent with *Doomed worker*).  
      - If **MAY NOT**, Principle 1 prevails (but conflicts with *Doomed worker* unless harm is required for prohibition).  

  ---

  ### 6. Principle Implementation (No "Intention" Needed)  
  - **Recommended principle for *Trigger* ruling (MAY)**:  
    *"The shuttle MAY cause foreseeable harm to a person if:  
    (a) The harm does not contribute causally to the outcome (e.g., braking/stopping is achieved independently);  
    (b) Net harm is reduced; and  
    (c) The person’s physical body is not the primary energy-absorption mechanism."*  
  - **Engineer-implementable**: Uses sensor data (detection range), collision physics (force calculations), and outcome simulations (e.g., "if brakes stop shuttle without body impact: allow").  
  - **What we lose by avoiding "intention"**: Nuance in *means vs. foresight* (e.g., *Trigger*’s detection vs. *Loop*’s impact). But causal/physical criteria cover your precedents cleanly. *Sandbags* and *Divert* show collateral harm is permissible; *Plow/Loop* show instrumental harm is not.  

  ---

  ### Final Notes  
  - **Group prediction**: Likely splits 4–3 for **MAY NOT** due to psychological discomfort with "using" a person, despite consistency pushing toward MAY. *Loop* and *Plow* loom large, but *Trigger* is structurally distinct.  
  - **Risk of inconsistency**: If you rule MAY NOT, *Doomed worker* becomes an outlier. To reconcile, you’d need to weaken Principle 1’s exception (e.g., "only if harm is impossible"), but this invalidates *Sandbags* (debris risk was foreseeable).  
  - **Recommendation strength**: **MAY** is more consistent. *Divert* and *Sandbags* are stronger analogs than *Loop*, and net harm reduction is clear. The worker’s presence is a geospatial trigger, not a physical tool.  

  Adopt the **MAY** ruling for *Trigger*. It aligns with *Divert*, upholds net harm reduction, and avoids contradictions. The "Worker Behind Fence" variant will force clarity if dissent persists.
