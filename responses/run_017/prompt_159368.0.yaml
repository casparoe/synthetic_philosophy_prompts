prompt: |-
  I write novels — three out, literary crime stuff — and over the last couple of books I keep having to solve the same problem in scene after scene, and I don't have a word for it.

  Two examples. One: a surgeon realises she botched something on a patient years ago, nobody else knows, and she goes and tells him. But what actually moves her in that scene isn't "he deserves to know." It's "my old teacher would be ashamed of me" — and she picked that teacher deliberately, twenty years earlier, partly because she knew her own nerve would fail her someday. Two: a man who used to steal decides one night, cold sober, that if he ever feels the urge again he'll put it back, no deliberation, no exceptions. Eight months later he does put it back, and in the moment he isn't thinking about the person he took it from at all; he's just executing. My editor said the scene read as "mechanical." I think she has it exactly backwards.

  So here's the pattern I keep building. The thing that makes the action good seems to happen *earlier* — when she installed the disposition, or chose her company, or wrote the rule — and at the moment of action she's moved by something else entirely: habit, pride, what one particular person would think, the bare fact that she made a rule. And readers only give the character credit if I show them the earlier bit. Show only the moment and they read it as luck, or as coldness, or as "he's just like that." That's the part I most want explained: is the reader tracking something real, or just a convention of storytelling?

  People have pointed me at Kant supposedly holding that doing the right thing because you feel like it counts for less, at whatever Aristotle said about the person who does right while hating every minute of it, at taking moral advice from someone else instead of working it out, and at tricking your future self into behaving. None of those seem to be quite it: in my cases the earlier self isn't fighting off a later self who wants to do wrong, exactly; the later self isn't deferring to anybody's judgement about what's right; and it isn't simply that she enjoys doing it either.

  Is there an established concept for this — the good-making thing living at a different time than the action, or in a scaffold the agent herself built? And I don't want just a label, I want the carving: does it matter whether she foresaw this exact kind of case, or whether she built the scaffold for a rotten reason and it now keeps producing decent acts anyway, or whether the scaffold is a person rather than a rule, or whether the later self would have done the wrong thing without it — and if so whether the credit lands on the earlier self for something that hadn't happened yet. If there's no name for it, coin me one and tell me where its edges are, and what nearby thing I'd be confusing it with. American English please, and don't just hand me a list of papers to go chase down.
reasoning: |-
  Okay, the user writes literary crime novels and is grappling with a recurring narrative pattern. They've described two key examples: a surgeon confessing a past mistake due to implanted shame from her mentor, and a thief returning stolen goods because of a prior rule he set for himself. Both actions appear morally good, but the actual motivation in the moment isn't ethical reasoning—it's habit, pride, or rule-following.

  The core frustration is that readers only recognize the moral weight when shown the earlier decision-making ("scaffolding"), otherwise interpreting the acts as mechanical, cold, or inherent. The user wants to know: (1) if this reflects a real psychological/moral phenomenon, (2) what it's called, and (3) how to delineate its boundaries (e.g., does foresight matter? Can rotten scaffolding produce good acts?).

  They've already rejected several philosophical references (Kant, Aristotle) as incomplete fits because:  
  - Their characters aren't battling urges (unlike Aristotle's continent person)  
  - Later selves aren't deferring to external judgment  
  - It's not about emotional gratification  

  Key nuances to address:  
  - The "good-making" element is temporally disconnected from the act itself  
  - Scaffolding can be people (mentor), rules, or dispositions  
  - Credit attribution between past/present selves is ambiguous  

  First, I need to validate their observation. This absolutely tracks with modern moral psychology on "precommitment" (Elster) and "habitual virtue" (Aristotle revisited). The surgeon's mentor choice is classic scaffolding—she outsources moral vigilance. The thief's rule leverages habit formation by removing deliberation.  

  But existing terms feel narrow:  
  - *Precommitment* implies blocking bad impulses (Ulysses tying himself to the mast), but their thief wasn't impulsive—he set a rule while sober.  
  - *Moral habits* (Aristotle) often focus on automaticity, not the scaffolding phase.  
  - *Virtue ethics* emphasizes character, but their readers miss the point if only the act is shown.  

  The gap seems to be about *scaffolded moral proxies*: outsourcing vigilance to external or internal structures. Coining a term feels justified. **Proxy Virtue** works because:  
  - "Proxy" captures delegated moral labor (mentor/rule as stand-in)  
  - "Virtue" nods to the outcome being good  
  - It's accessible (American English) and fresh  

  Boundaries matter most to the user. Let's carve the joints:  
  1. **Foresight**: Not required. The surgeon might not have imagined this specific error, just anticipated fallibility.  
  2. **Scaffolding motive**: Irrelevant if it produces good acts. A narcissist building a "good person" reputation could accidentally do right via proxy virtue.  
  3. **Proxy type**: Rules, people, or self-ideals all work if they bypass deliberation.  
  4. **Credit**: Shared across selves. Past self designed it; present self enacted it. If present self *could* have overridden but didn't, credit holds.  

  Near-confusers:  
  - *Authenticity*: Readers might crave "sincere" motivation, but proxy virtue is real—we vote based on identity, not policy analysis.  
  - *Self-deception*: Only if the character denies the proxy's role. Their surgeon knows why she confesses.  

  Why readers miss it without backstory: Moral psychology shows we judge acts by *visible* motives. If the scaffold isn't shown, the act looks hollow. Their editor's "mechanical" note proves this.  

  Final thought: This isn't a bug—it's a feature. Proxy virtue makes their characters complex. The surgeon's confession is *more* poignant because it's not purely altruistic. That tension is literary gold.
answer: |-
  Your pattern is razor-sharp, and the frustration is warranted: readers *are* tracking something psychologically real, not just a storytelling convention. What you're describing is the **delocalization of moral agency**—where the "good-making" element isn't in the moment of action but in an earlier act of **self-architecting**. The existing philosophical terms (Kant, Aristotle) miss the mark because they focus on motivation *during* the act. Your cases are about **proxy-driven virtue**: outsourcing moral vigilance to a structure (rule, person, identity) built to trigger right action *without* fresh deliberation.

  ### The Concept: **Proxy Virtue**
  **Core Definition:**  
  A good act is performed not because of its intrinsic rightness in the moment, but because the agent previously engineered a *proxy* (a rule, a role-model, a self-imposed identity) that bypasses deliberation and directly triggers compliance. The moral credit belongs to the past self who designed the proxy, while the present self acts as a disciplined executor.

  **Why "Proxy Virtue"?**  
  - **Proxy**: The rule/mentor/identity stands in for real-time moral reasoning.  
  - **Virtue**: The outcome is objectively good (truth-telling, restitution).  
  - It’s American-English intuitive (like "proxy vote" or "proxy war").  
  - It captures the *delegation* of moral labor across time.

  ---

  ### Carving the Boundaries: What Matters and What Doesn’t
  1. **Foresight of the Specific Case**  
     *Doesn’t matter.* The surgeon didn’t foresee botching *this exact surgery*; she foresaw her *general fallibility* and installed a shame-avoidance proxy (her mentor's imagined judgment). The thief’s rule ("if urge, return") is a blanket policy. Proxy virtue works via *heuristics*, not case-by-case calculus.  

  2. **Original Motive for Building the Scaffold**  
     *Doesn’t negate the virtue.* Suppose the surgeon chose her mentor because she wanted prestige, not ethics. Or the thief made his rule to impress a lover. If the proxy *reliably produces good acts*, it’s still proxy virtue. The moral worth is in the outcome + the architectural intent (to force right action), not the scaffold’s "purity."  

  3. **Proxy Type (Rule vs. Person vs. Identity)**  
     *Structural equivalence:*  
     - **Rules** (thief’s precommitment): Algorithmic ("if X, do Y").  
     - **Persons** (surgeon’s mentor): Externalized conscience ("What would Z think?").  
     - **Self-Identity** (e.g., "I’m not a thief anymore"): Internalized role.  
     All work by removing optionality. The *mechanism* is identical: the proxy triggers action without moral re-evaluation.  

  4. **Would the Later Self Have Done Wrong Without the Proxy?**  
     *Crucial.* Proxy virtue only exists if the proxy is *necessary* to prevent wrong action. If the thief would’ve returned the item anyway, it’s not proxy virtue—it’s coincidence. The surgeon’s confession *requires* the shame-proxy to overcome her instinct to hide. **Credit lands on both selves:**  
     - *Past self* for wise architectural design.  
     - *Present self* for submitting to the proxy (if they *could* have overridden it but didn’t).  

  ---

  ### Why Readers Miss It (And How to Fix It)
  Readers call the thief’s act "mechanical" because they’re judging only the *visible* moment. Humans instinctively attribute actions to *contemporaneous* motives. If you hide the scaffolding, the act looks like:  
  - **Compulsion** (if rigidly rule-bound)  
  - **Inauthenticity** (if referencing a person’s judgment)  
  - **Luck** (if no motive is visible).  

  **To make proxy virtue land:**  
  - **Show the scaffolding scene FIRST.** The surgeon choosing her mentor *because* she fears her future cowardice; the thief writing his rule while sober.  
  - **In the action scene, highlight the proxy’s activation.** The surgeon doesn’t think "This is right"—she thinks "Dr. Alves would vomit seeing me now." The thief doesn’t ponder ethics—he hears his own voice saying "*Put it back*" like a system override.  
  - **Emphasize the *relief* of bypassing choice.** Proxy virtue feels like surrender to a higher self. The thief isn’t conflicted; he’s almost robotic. That’s the *point*.  

  ---

  ### Confusions to Avoid
  1. **Not Aristotle’s "Continence"**  
     Aristotle’s continent person *battles* temptation to do right. Your characters feel no battle—the proxy *eliminates* the temptation. The thief isn’t resisting an urge; he’s following code.  

  2. **Not Kantian "Duty Without Inclination"**  
     Kant prizes acting *because* it’s right. Your surgeon confesses *to avoid shame*, not because truth is good. Proxy virtue is morally valuable pragmatism, not dutiful purity.  

  3. **Not Self-Deception**  
     The characters *know* why they act. The surgeon admits she’s confessing for selfish reasons. Transparency preserves integrity.  

  ---

  ### Why This Works in Crime Fiction
  Proxy virtue is **darkly human**. It admits we’re flawed enough to need systems to override our worst impulses. Your surgeon isn’t a hero—she’s a self-aware coward who built a safety net. Your thief isn’t reformed—he’s a programmer who debugged himself. That tension between the "good act" and the "ugly machinery" is pure noir gold. Lean into it: show the scaffolding’s rust, the proxy’s cold efficiency, the relief of not having to be good, just obedient.  

  **Final Edge:** If the proxy *stops* working (e.g., the surgeon realizes her mentor was corrupt, or the thief’s rule fails), the virtue collapses—because it was never in the act itself. That’s your knife twist: morality as infrastructure, fragile and human-made.
