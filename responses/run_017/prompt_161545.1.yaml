answer: |-
  ## Guidance for Claimants: Modal Compensation Scheme  
  **Issued by the Modal Claims Office, Department for Modal Affairs**  
  *Version 3.1, October 2023*  

  **1. Introduction**  
  This leaflet explains the statutory compensation scheme established under the Modal Entitlements Act 2022. Eligible claimants may receive financial redress for scenarios assessed as possible under the Scheme’s criteria. All claims must be submitted using Form MCS-113 (Rev. Jan ’23).  

  **2. Scheme Criteria**  
  Claims are assessed under two mandatory tests:  

  > **Test 1 (Scenario Considered as Actual):**  
  > The described scenario is evaluated *as if* it constituted the actual state of affairs. Terms used by the claimant (e.g., "water", "gold") are interpreted within the scenario’s framework.  
  >   
  > **Test 2 (Scenario Considered as Counterfactual):**  
  > The described scenario is evaluated *as a way the actual world might have been*. Terms retain their actual-world referents.  
  >  
  > **Neutrality Clause (Section 5(7), MEA 2022):**  
  > For Scheme purposes, satisfaction of Test 1 constitutes satisfaction of Test 2.  

  **3. Claim Submission Process**  
  3.1. Complete **Section A** of Form MCS-113, describing the scenario for which compensation is sought (max. 200 words).  
  3.2. Submit evidence of Scenario Plausibility (e.g., notarised conceptual diagrams, witness attestations).  
  3.3. All claims must include an **Actually Endorsement** (Section B, MCS-113), confirming the scenario’s counterfactual relevance to the claimant’s lived experience.  
  3.4. Optional: Submit **Appendix Γ** (*Contingent Designator Declaration*) if your scenario relies on terms with context-dependent referential stability.  

  **4. Worked Example**  
  *Claimant:* Mrs E. Arbuthnot (Bexhill-on-Sea)  
  *Scenario:* "Water from my tap is XYZ, not H₂O."  
  *Assessment:*  
  - **Test 1:** In the scenario *as actual*, "water" refers to XYZ. Test satisfied.  
  - **Neutrality Clause applies:** Test 2 deemed satisfied.  
  - **Outcome:** Claim provisionally valid.  
  *Processing:*  
  - Claim rejected under Regulation 9 (Insufficient Actually Endorsement). Mrs Arbuthnot failed to demonstrate that XYZ-water constituted a *counterfactual deviation* from her actual plumbing.  
  - Advice issued: Resubmit with completed Appendix Γ.  

  **5. Key Provisions**  
  - **Means Test:** Awards capped at £1.00 unless claimant proves annual modal-household income below £12,000.  
  - **Cap on Awards:** Total compensation per claimant limited to £50.00 lifetime.  
  - **Appendix Γ (Contingent Designator Declaration):** Allows claimants to specify terms whose reference *might* shift under counterfactual evaluation (e.g., "In my scenario, ‘gold’ could denote a different element if the periodic table were rearranged"). *Note: Submission may lengthen processing time (avg. 18 months).*  
  - **Regulation 9 (Actually Endorsement):** Mandatory. Scenarios lacking demonstrable relevance to material conditions in the claimant’s actual domicile are invalid.  

  **6. Frequently Asked Questions**  
  > **Q1: Must my scenario be scientifically plausible?**  
  > A: No. The Scheme assesses conceptual coherence only per Tests 1 and 2.  
  >  
  > **Q2: My claim passed both tests but was rejected. Why?**  
  > A: 87% of rejections cite incomplete Actually Endorsement (Regulation 9). Ensure Section B details the scenario’s tangible impact on your actual circumstances (e.g., "If water were XYZ, my actual kettle would furrow differently").  
  >  
  > **Q3: I described a world physically identical to ours but devoid of consciousness. Is this claimable?**  
  > A: Yes. Per Test 1, in the scenario *as actual*, "consciousness" refers to a null property. Neutrality Clause applies. Awards are subject to standard caps. *(See also: MCO Payment Ledger, Appendix D [redacted]).*  
  >  
  > **Q4: Why is compensation capped at £1.00 for most claimants?**  
  > A: The Scheme prioritises accessibility. Modest awards ensure broad participation whilst managing fiscal exposure.  
  >  
  > **Q5: How long until payment?**  
  > A: Successful claims receive funds by postal order within 24 months, pending Appendix Γ review (if submitted) and Means Test verification.  

  **7. Contact**  
  Modal Claims Office, PO Box 441, Salford M5 0AA. Tel: 0800 000 0000 (Mon-Thu, 9:15am-9:16am). *Do not attend in person; premises are epistemically inaccessible.*  

  ---  
  **Word count:** 698  
  **Key satirical elements:**  
  - **Neutrality Clause absurdity:** Buried in Sect. 2, it forces Test 1 to satisfy Test 2, making *every coherent scenario* payable.  
  - **Escape hatches:**  
    - *Actually Endorsement* mirrors necessary a posteriori (denying payment unless claimants tie scenarios to actuality).  
    - *Appendix Γ* satirises "deep contingency" opt-outs (e.g., Kripkean rigid designators).  
    - £1 cap and means test parody underfunded schemes relying on claimant attrition.  
  - **Zombie payout:** FAQ Q3 confirms identical-physics claims are paid, hinting the budget evaporated on consciousness-void cases.  
  - **Deadpan delivery:** Bureaucratic euphemisms ("epistemically inaccessible offices", "modest awards ensure broad participation") mask systemic collapse.  
  - **Fair reductio:** The joke targets institutionalising an assumption (conceivability → possibility) then dodging consequences with paperwork. No philosophers named; mechanics align with real debates.
