  The user provides very specific technical requirements: logarithmic utility's indifference between ruin and infinite wealth (impossible ruin vs 99% loss costing 4.6 log-units), the mean/median wealth gap, the asymmetric growth curve (half-kelly retains 75% growth, double-kelly zeroes it), and extension to non-monetary "bankrolls." Crucially, no strawman arguments - Kelly is mathematically correct at all horizons under log utility. The satire must emerge from faithful application.

  I'll structure this as an official notice from the "Long-Run Growth Directorate." The tone should be cheerfully inhuman: ruin is "mathematically impossible," median citizens being permanently poorer than the mean is "efficient resource allocation," and life events become "fractionable bankrolls." The complaints procedure should involve asymptotics - perhaps a review after 10^6 quarters.

  For the worked example: a citizen with £100k bankroll betting on a 52% coin at optimal 4% fraction. The leaflet will emphasize the glorious £12.8 million expected terminal wealth while downplaying that only 0.98^100 ≈ 13% of citizens will even surpass their starting wealth. The growth curve section will correctly show double-betting annihilates growth while half-betting is "tolerable."

  The FAQ is where the horror blooms. "Bankroll consolidation" means marriage dissolution is just portfolio rebalancing. Career changes use the "Kelly career transition formula." The complaints procedure will state that while individual ruin is impossible, systemic queries are reviewed every 250,000 years. All delivered with the serene certainty of someone who's never had to live with the consequences of their optimal fractions.
