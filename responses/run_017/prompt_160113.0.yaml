  **OFFICE OF GEOMETRIC WELFARE**
  **LONG-RUN GROWTH DIRECTORATE**
  **Department of Asymptotic Optimization**
  **Public Circular LRD/OGE-7 (Rev. 3)**

  **MANDATORY PARTICIPATION IN THE NATIONAL COMPOUNDING OPPORTUNITY (NCO)**
  **Quarterly Wagering Directive Under the Geometric Rationality Act (GRA), Sec. 10.β**

  **1. MANDATE & PURPOSE:** Pursuant to the Geometric Rationality Act (GRA), the Long-Run Growth Directorate (LRD) is mandated to ensure the maximal asymptotic growth rate of aggregate national welfare. Analysis confirms this requires maximizing the expected logarithmic growth rate of individual capital allocation. The National Compounding Opportunity (NCO) provides the optimal, state-administered mechanism. **Every citizen aged 18+ is required to wager the LRD-calculated optimal fraction of their Total Consolidated Bankroll (TCB) on the designated NCO outcome each quarter.** Non-compliance constitutes suboptimal resource allocation and incurs Growth-Deficit Penalties (Schedule Γ).

  **2. TOTAL CONSOLIDATED BANKROLL (TCB): DEFINITION & VALUATION:** Your TCB represents the single, fractionable resource underpinning all welfare streams. It is calculated quarterly by the LRD Central Valuation Bureau (CVB) and includes:
  *   **Liquid Assets:** Cash, securities, marketable goods.
  *   **Illiquid Assets:** Property (net equity), durable goods (depreciated actuarial value).
  *   **Human Capital:** Net Present Value (NPV) of all future after-tax earnings potential (based on LRD Career Trajectory Model β.7).
  *   **Relational Capital:** NPV of estimated future utility flows from core personal relationships (spouse/partner, offspring, key familial bonds - valued via LRD Relationship Yield Tables).
  *   **Healthspan Capital:** NPV of estimated future utility-adjusted healthy years (based on LRD Actuarial Health Discount Model).
  *   **Note:** TCB is net of all liabilities. Your quarterly NCO wager fraction is applied to the TCB valuation determined on the last business day of the preceding quarter.

  **3. THE NCO & OPTIMAL FRACTION CALCULATION:** Each quarter, the LRD Probability Bureau (PROB) publishes the single, forward-looking probability estimate (`p`) for the NCO outcome (e.g., "Q3 2024: Composite Manufacturing Index > Baseline Threshold"). The LRD Edge Calculation Unit (ECU) simultaneously publishes the official payoff odds (`b`), defined as the net return per unit wagered on success (e.g., `b = 1.0` implies even money: win £1 for each £1 wagered on success). Your mandated wager fraction (`f*`) is calculated as:
  `f* = (p * (b + 1) - 1) / b`
  This `f*` represents the unique fraction maximizing the Expected Logarithmic Growth Rate (ELGR) of your TCB. Wagering `f*` ensures your wealth path exhibits asymptotic dominance over any other fixed-fraction strategy with probability approaching 1.

  **4. WORKED EXAMPLE: CITIZEN ID: ALPHA-22791 (Q2 VALIDATION CYCLE)**
  *   **PROB Publication:** `p = 0.52` (Probability NCO Outcome Occurs)
  *   **ECU Publication:** `b = 1.0` (Even Money Payoff)
  *   **Optimal Fraction (`f*`):** `(0.52 * (1.0 + 1) - 1) / 1.0 = (0.52 * 2 - 1) = (1.04 - 1) = 0.04` (4%)
  *   **Citizen Alpha-22791 Q1 TCB Valuation (CVB):** £100,000
      *   *Breakdown:* Liquid/Illiquid: £40,000; Human Capital (NPV): £45,000; Relational Capital (Spouse NPV): £12,000; Healthspan Capital: £3,000.
  *   **Mandated Q2 NCO Wager:** `0.04 * £100,000 = £4,000`
  *   **Potential Q2 TCB Outcomes:**
      *   **NCO Success (52% Probability):** TCB = `£100,000 - £4,000 + £4,000 * (1 + 1.0) = £96,000 + £8,000 = £104,000`
      *   **NCO Failure (48% Probability):** TCB = `£100,000 - £4,000 + £4,000 * 0 = £96,000`
  *   **Expected Terminal Wealth (After 100 quarters, ~25 years):** `£100,000 * (1.04)^100 ≈ £100,000 * 50.50 = £5,050,000` *(See Note A)*
  *   **Median Terminal Wealth (After 100 quarters):** `£100,000 * (1.04 * 0.52 + 0.96 * 0.48)^100 ≈ £100,000 * (1.02)^100 ≈ £100,000 * 7.24 = £724,000` *(See Note A)*
  *   **Expected Log-Wealth Gain (Per Quarter):** `0.52 * ln(104,000/100,000) + 0.48 * ln(96,000/100,000) ≈ 0.52*0.0392 + 0.48*(-0.0408) ≈ 0.000784` (Maximal ELGR)

  **Notes:**
  *   *(A)* The significant divergence between Expected Wealth (£5.05M) and Median Wealth (£724k) is an inherent feature of the lognormal distribution resulting from optimal geometric growth. It reflects the efficient concentration of resources necessary for maximal long-run aggregate growth. Most citizens cluster near the median; a vanishingly small number achieve outcomes near the expectation, driving asymptotic dominance.
  *   Ruin (TCB ≤ £0) is a mathematical impossibility under `f*` wagering, as `ln(TCB) → -∞` only if `TCB → 0+`, which has probability zero over infinite trials. A TCB reduction to £1,000 (a 99% loss) represents a log-loss of only `ln(100,000) - ln(1,000) = 11.51 - 6.91 = 4.60` log-units, precisely offsetting a log-gain of `ln(10,000,000) - ln(100,000) = 16.12 - 11.51 = 4.61` units from a 100-fold gain. The utility impact is symmetric and finite.

  **5. GROWTH-RATE SENSITIVITY & COMPLIANCE:** The ELGR curve is sharply asymmetric. Deviation from `f*` severely impacts long-term growth:
  *   Wagering `f*/2 = 0.02`: ELGR ≈ 75% of maximum. *(Tolerable but suboptimal, may incur mild G-D Penalties if persistent).*
  *   Wagering `f* = 0.04`: ELGR = Maximum.
  *   Wagering `1.5*f* = 0.06`: ELGR ≈ 50% of maximum. *(Significant growth deficit, triggers G-D Penalties).*
  *   Wagering `2*f* = 0.08`: ELGR = 0. *(Growth neutral, severe G-D Penalties apply).*
  *   Wagering `>2*f*`: ELGR < 0. *(Destructive, Guaranteed Long-Term Impoverishment, Severe Penalties & Mandatory Counseling).*
  **Compliance with the LRD-mandated `f*` is therefore essential.** Remember, `f*` is calculated using the official *forward-looking* probability (`p`). Historical frequencies are irrelevant; the mandated fraction is optimal based on the best current estimate.

  **6. FREQUENTLY ASKED QUESTIONS (FAQ):**

  *   **Q1: What if I disagree with the PROB Bureau's probability (`p`)?**
      *   A1: The GRA vests probability determination solely in the PROB Bureau. Their forward-looking estimates incorporate all information deemed relevant for asymptotic optimization. Individual subjective estimates are irrelevant to the mandated growth-maximizing fraction. Wagering a personal `f'` ≠ `f*` guarantees a lower ELGR and constitutes non-compliance.

  *   **Q2: How can my marriage/children/health be part of a "bankroll"? How do I wager them?**
      *   A2: All sources of present and future welfare are capital assets. Their Consolidated NPV constitutes your TCB. You wager the *fraction* (`f*`) of the total *monetary value* assigned by the CVB. Physical dissolution of relationships or health is not required; the wager is monetary, reflecting the actuarially adjusted utility value. A successful wager increases the monetary resources available to support all welfare streams; an unsuccessful wager reduces them proportionally. The fractional Kelly strategy optimally manages the *aggregate* risk across *all* capital components.

  *   **Q3: I face a major life decision (e.g., career change, divorce, medical procedure). How does the NCO mandate apply?**
      *   A3: Significant life events trigger a Special Revaluation (Form LRD-SRV/8). The CVB will re-assess the NPV impact on your TCB components *before* the next quarterly wager. The optimal fraction `f*` for the subsequent NCO will then reflect your new, consolidated bankroll. The Kelly Criterion remains the rational guide: major decisions should be evaluated based on their impact on the long-run growth rate of your overall welfare potential (i.e., the ELGR of your TCB).

  *   **Q4: The Expected Wealth figure seems impossibly high, and the Median is much lower. How is this fair?**
      *   A4: Fairness is defined asymptotically under the GRA. The policy maximizes the *growth rate* of the *aggregate* welfare sum. The distribution of outcomes is lognormal; most individuals experience outcomes near the median, while a few achieve very high outcomes. It is these high-growth trajectories that dominate the long-run aggregate, benefiting society as a whole over infinite time. Your contribution to maximal asymptotic growth is valued equally, regardless of your specific path's quantile.

  *   **Q5: Why Logarithmic Utility? It feels unnatural to value a 99% loss the same as a 100x gain.**
      *   A5: The LRD operates under the singular utility function prescribed by the GRA: `U(TCB) = ln(TCB)`. This is the *only* utility function compatible with maximal long-run growth and the only one guaranteeing the "no ruin" property. The perceived "unnaturalness" stems from transient, horizon-limited perspectives. Over the sufficiently long run mandated by the GRA, the symmetry in log-space ensures optimal capital preservation and growth. Indifference between specific gain/loss magnitudes is a mathematically necessary consequence of optimality.

  *   **Q6: What about my specific needs/risk tolerance/time horizon?**
      *   A6: Individual preferences over finite horizons or non-logarithmic risk profiles are incompatible with asymptotic growth maximization and are pre-empted by the GRA. The mandate ensures your strategy is optimal for the *only* relevant metric: the long-run growth rate of your consolidated welfare potential. Finite horizons are a cognitive bias; the GRA operates on the principle that the long run *will* eventuate.

  **7. COMPLAINTS & APPEALS:**
  Concerns regarding TCB valuation calculations or wager notifications must be submitted via Form LRD-COMP/Ω within 14 days of the relevant statement date. Appeals based on disagreement with the optimality of the Kelly Criterion, the logarithmic utility function, the definition of TCB, the PROB estimate, or the asymptotic mandate will be **summarily dismissed** as fundamentally incompatible with the Geometric Rationality Act. Appeals regarding computational errors in applying the mandated `f*` to your official TCB will be reviewed by the Asymptotic Review Panel. The standard processing time for such reviews is 10 years. Please note: Due to the nature of asymptotic dominance, the benefits of correct application or the penalties of incorrect application may only become materially evident over timescales exceeding typical human lifespans. The Panel operates on a generational timescale.
