answer: |-
  ## Fellowship Proposal: The Inheritance Question – A Compositional Stress Test for Solutions to the Wrong Kind of Reasons Problem

  **1. Project Title:** Composite Attitudes and the Wrong Kind of Reasons: Testing the Inheritance of Fittingness Conditions

  **2. Abstract:** The Wrong Kind of Reasons (WKR) problem challenges fitting-attitude (FA) analyses of value, demanding a principled distinction between reasons that bear on an attitude’s *fittingness* and those that merely *favour having* it. While significant progress exists, solutions remain largely siloed within specific attitudes (desire, admiration, belief, etc.), each tested against its own "threat case." This project identifies a critical, overlooked question: **how do Wrong Kind of Reasons bearing on *constituent attitudes* (e.g., desire, belief) affect the fittingness conditions of *composite attitudes* (e.g., hope, regret, blame, trust) that are constitutively built from them?** This "Inheritance Question" serves as a novel, rigorous stress test for existing solution families (object-given, explanatory role, attitude-relative). By forcing coherence across attitude levels, it exposes hidden commitments and offers a new path towards resolving the WKR impasse, without presupposing the value concepts under analysis.

  **3. The Core Research Question (Sharpened):**
  When a reason R is uncontroversially of the *wrong kind* for a constituent attitude A (e.g., a pragmatic threat providing a wrong-kind reason for desire), and A is a necessary constitutive component of a composite attitude C (e.g., desire is constitutive of hope), what is the status of R with respect to the fittingness of C?
  Specifically, does R:
      *   **(Transmission):** Remain a wrong-kind reason for C?
      *   **(Blockage):** Fail to transmit upwards, contributing *no* reason relevant to C's fittingness?
      *   **(Conversion):** Become a *right-kind* reason for C?

  *   **Scope & Determinacy:** The project will answer this question for a defined set of composite attitudes (Hope, Regret, Blame, Trust) and their widely accepted core constituents (e.g., Hope ≈ Desire + Uncertainty-belief; Regret ≈ Belief about past action + Counterfactual desire; Blame ≈ Belief about faulty agency + Reactive attitude (e.g., resentment); Trust ≈ Belief about reliability + Reliance/affective attitude). We define "constitutive relation" operationally: A is constitutive of C iff C cannot be correctly ascribed without A being present and playing its characteristic role. This avoids deep metaphysical commitments while allowing clear test cases. The answer must be consistent *within* a given solution family and *across* the chosen composites.

  **4. Why Existing Solutions Do Not Settle This:**
  The three dominant solution families were forged on *atomic* attitudes:
  *   **Object-Given/State-Given Distinction:** Focuses on whether R is provided by properties of the attitude's object vs. properties of *having* the attitude. Threat cases target single attitudes directly. It's silent on whether a state-given reason for A becomes object-given (or state-given) for C.
  *   **Explanatory Role Accounts:** Sort R based on whether it explains why the object *merits* the attitude. Applied to atomic attitudes, these need rules for how explanation chains function across constituents. Does a reason explaining why desiring X is *good for me* (a WKR for desire) explain why hoping for X is *fitting*? Existing accounts lack the machinery.
  *   **Attitude-Relative Accounts:** Hold that "right-kind" is primitive and indexed to each attitude type. This readily admits variation but *predicts* blockage (each attitude filters independently). However, this prediction must be tested against composites – does the composite attitude introduce a *new* primitive filter, or does it inherit the filters of its parts? The theory itself doesn't dictate this.

  **Crucially, none of these families were designed or tested against cases where a WKR applies *only* to a constituent.** Their verdicts on composites are undefined or implicit assumptions needing exposure. This project provides the necessary test.

  **5. Methodology (Month-by-Month):**
  *   **Months 1-2: Foundational Mapping & Taxonomy Fixing:** Deep dive into core literature on WKR for *constituent* attitudes (desire, belief) and FA analyses of the chosen *composite* attitudes (hope, regret, blame, trust). **Taxonomy Fix:** Develop a stable, operational classification of the constitutive relations for the target composites, drawing on *minimal consensus* in the literature to avoid deep metaphysical disputes. Define the "attitudinal grammar" for each composite (e.g., Hope: Desire(D) + Uncertainty-Belief(U) → Hope(H)).
  *   **Month 3: Case Generation & Calibration:** Systematically construct "inheritance threat cases." For each composite (C):
      1.  Identify a standard WKR scenario for a core constituent (A) (e.g., a threat inducing desire for suffering (WKR for Desire)).
      2.  Embed this scenario into a context where the composite (C) is a potential response (e.g., the threatened individual now *hopes* for the suffering, driven by the threat-induced desire and a belief it might happen). Generate variations controlling for other factors.
      3.  Crucially, calibrate cases to ensure the WKR applies *only* to the constituent (A), not directly/intuitively to the composite (C). Pilot these cases with peers to ensure they are intelligible and the WKR force is located clearly on the constituent.
  *   **Month 4: Solution Family Explication:** Articulate the core commitments of the three solution families regarding *atomic* attitudes. Formulate explicit hypotheses for each family regarding the Inheritance Question (Transmission/Blockage/Conversion).
  *   **Months 5-6: Applying Families & Identifying Tensions:** Apply each solution family rigorously to the calibrated cases. Does the family yield a consistent verdict across all composites? Does it generate incoherence (e.g., judging R as RK for C but WK for A, where A is essential to C)? Does it clash with established results (e.g., if Conversion occurs for a belief-constituent, does it violate core tenets of the debate on pragmatic reasons for belief?).
  *   **Month 7: Comparative Analysis & Pressure Points:** Identify where different families conflict in their verdicts on inheritance. Map the theoretical costs associated with each position (Trans/Block/Conv) *within* each family. Where do commitments made for atomic attitudes constrain answers for composites?
  *   **Month 8: Synthesis & Implications:** Determine which inheritance model (Trans/Block/Conv) is most sustainable overall or per solution family. Articulate the implications: Does this expose a fatal flaw in a family? Does it force a refinement (e.g., modifying explanatory role accounts)? Does it reveal a need for a new kind of solution? Does it support attitude-relativity or undermine unity?
  *   **Month 9: Writing & Refinement:** Compose dissertation chapters synthesising the argument, results, and significance.

  **6. Why This Over Alternatives?**
  *   **Beyond More Threat Cases:** Generating new single-attitude threat cases risks diminishing returns, refining patches without addressing the underlying structural question. This project leverages *existing* threat cases in a novel combinatorial way, creating a more powerful diagnostic tool.
  *   **Beyond Broad Fittingness Analysis:** While a conceptual analysis of "fittingness" is valuable, it's vast and unlikely to yield a definitive WKR solution within nine months. This project offers a targeted, tractable inquiry with a clear discriminator (inheritance across attitudes) that *indirectly* pressures fittingness accounts by demanding cross-attitudinal coherence. It provides concrete results testing *existing* analyses.
  *   **Unique Leverage:** The Inheritance Question uniquely forces solution families to confront their implications for the *structure* of normativity. It connects debates often kept separate (e.g., WKR for belief and FA analyses of blame/hope). Success provides a new adequacy condition for any solution: coherence across composite and constituent attitudes.

  **7. Possible Outcomes & Deciding Considerations:**
  *   **Outcome 1 (Blockage Dominates):** WKR for constituents generally do not transmit upwards. *Decider:* Strong intuitive pull; preserves integrity of RK for composites; aligns neatly with attitude-relative views. *Cost:* May require explaining why the composite's fittingness is strangely insulated from reasons bearing directly on its parts.
  *   **Outcome 2 (Transmission Dominates):** WKR for constituents transmit as WKR for composites. *Decider:* Simplicity; maintains a strong link between constituents and composite. *Cost:* Threatens to make composites *less* fitting than they intuitively should be (e.g., hope seems fitting *despite* the threat-induced desire); may collapse the value of C into the value of A.
  *   **Outcome 3 (Conversion Possible):** WKR for A can become RK for C in specific composites. *Decider:* Explains intuitive permissibility/sense in some composite attitudes formed under constituent-level pressure. *Cost:* Radically counterintuitive for some composites (especially involving belief); needs a principled account of *when* conversion occurs; risks undermining the WKR distinction.
  *   **Outcome 4 (Family-Specific/Composite-Specific):** Different solution families yield different answers, or inheritance varies by composite. *Decider:* Empirical results from applying the cases; theoretical costs within each family framework. *Significance:* Undermines unified solution hopes; favours attitude-relativity or hybrid views; highlights unique features of different composites.
  *   **Key Deciders:** Consistency *within* a solution family across composites; coherence with bedrock intuitions about the fittingness of composites in the cases; avoidance of untenable consequences in related debates (especially pragmatic belief); theoretical parsimony.

  **8. Success Criteria & Failure Conditions:**
  *   **Success:** A clear, argued answer to the Inheritance Question for the defined set of composites within the landscape of existing solution families, demonstrating either which model generally holds, which model works best within each family, or that the answer varies systematically. Demonstrating significant pressure on at least one major solution family or revealing a previously hidden commitment common to all. Providing a robust methodological framework for testing attitude-composition in normative theory.
  *   **Failure Conditions (Honest Assessment):**
      1.  **Unstable Foundations:** The constitutive relations for the core composites prove too contested or indeterminate to fix a stable taxonomy, making case calibration impossible or verdicts meaningless. *(Mitigation: Prioritise least contested composites (Hope/Regret); use operational definitions based on standard ascription practices; focus on clear cases)*.
      2.  **Baroque Case Collapse:** The calibrated cases become so convoluted or unintuitive that clear, stable judgments about the fittingness of the composite attitude are impossible to obtain or trust. *(Mitigation: Rigorous piloting and iterative refinement of cases; strict controls; focus on simplest plausible scenarios; peer consultation)*.
      3.  **Inconclusive Pressure:** The test fails to generate significant discrimination or novel pressure on the main solution families; the results are compatible with minor adjustments to existing views. *(Mitigation: Careful selection of composites known to pose distinct challenges; explicit formulation of tensions before testing)*.
      4.  **Intractability:** The question proves too complex to resolve meaningfully within nine months, requiring deeper metaphysical work on attitude composition. *(Mitigation: Strict scope limitation; focus on implications *for WKR solutions* rather than full theory of composites)*.

  **9. Assumptions Flagged for Referees:**
  *   **The WKR Problem is Real & Central:** Assumes the WKR problem is a genuine challenge for FA analyses worth solving. (A referee might reject the FA project entirely).
  *   **Composite Attitudes Exist:** Assumes attitudes like hope, regret, blame, trust are usefully analysed as having constitutive parts in the way described. (A referee might prefer a non-compositional, primitive view of these attitudes).
  *   **"Constitutive Relation" is Workable:** Assumes the operational definition of constitution (necessary for correct ascription) is sufficient for the normative inquiry. (A referee might demand a deeper metaphysical account).
  *   **Solution Families are Representative:** Assumes the three families capture the main viable approaches. (A referee might champion a neglected alternative).
  *   **Tractability:** Assumes the defined scope (4 composites, 3 families, operational definitions) makes the project feasible in nine months. This is ambitious but achievable with strict focus.

  This project offers a novel, rigorous, and tractable path to advance the stalled WKR debate by exploiting the overlooked structure of composite attitudes. It promises concrete results that test the mettle of existing solutions and illuminate the normative connections between our fundamental responses to the world.
