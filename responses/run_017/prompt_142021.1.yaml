prompt: |-
  I sit on the Clinical Ethics Advisory Panel of a large teaching hospital trust. We advise on individual cases rather than set policy, and we keep the ethical question separate from the legal one: in our jurisdiction there is no statute on assisted dying and no appellate decision on deactivating implanted devices, so there is nothing for us to hide behind. I would like your help with a case on next week's list. I am less interested in the bottom line than in what our own track record already commits us to.

  Here are our determinations so far. In each one the patient was competent or acting through a valid advance decision, and the clinical team agreed that the intervention in question was what was keeping the patient alive.

  1. Withdrawal of invasive ventilation in advanced motor neurone disease, requested in advance. Approved. Reason recorded: the ventilator opposed but did not cure the disease, and ceasing to oppose it lets the disease take its course.
  2. Not starting a second course of haemodialysis in end-stage renal failure with metastatic cancer. Approved, and the panel expressly held that withholding and withdrawal are on a par.
  3. Withdrawal of veno-arterial extracorporeal membrane oxygenation — a machine outside the body doing the continuous work of both heart and lungs — in refractory cardiogenic shock judged unrecoverable. Approved.
  4. Deactivation of an implanted defibrillator in end-stage heart failure with repeated shocks. Approved. It was internal, but it stood ready to rescue from intermittent arrhythmias rather than sustaining circulation continuously.
  5. Withdrawal of clinically assisted nutrition and hydration in a minimally conscious state, under a valid advance decision. Approved by majority; the dissent held that feeding is care rather than treatment, and the majority rejected that.
  6. Palliative sedation to unconsciousness for refractory breathlessness, with life-shortening foreseen but not the object. Approved.
  7. Lethal injection at the competent, settled request of a patient with unbearable suffering. Refused. The minute says the difference between 6 and 7 lies in what the clinician is aiming at, not in any act-omission line.
  8. A patient with a do-not-attempt-resuscitation order whose ventilator tubing came adrift; the nurse present did not reattach it. The panel held that she had done nothing it could object to: not reattaching was of a piece with not having started.

  The new case. Mr A has a total artificial heart: his own ventricles were excised and replaced by an implanted rotary pump driven through a driveline by an external controller and battery pack. His dependence is total — with the pump stopped he loses consciousness within seconds and dies within minutes. He is otherwise not dying: renal and hepatic function are normal, there is no malignancy, he might live for years. He is competent, the request has been stable for weeks, and psychiatry has no doubts. His reasons are recurrent driveline infections and the life of being tethered to batteries; his team disagree among themselves about whether the infections are manageable with antibiotics and revision surgery. Two questions: (a) he asks that the controller be switched off — a deliberate procedure with a checklist, not a matter of walking away; (b) should we refuse (a), he asks that the team simply not connect a fresh pack when the current one is exhausted, letting it run down with him sedated.

  What I want from you:

  1. The rules or principles that fit all eight precedents — the act-omission rule I have gestured at, the intended-foreseen rule that our minute on 6 and 7 gestures at, and anything else you can find, including rules I have not thought of. For each, say what it predicts about (a) and about (b).
  2. Which precedent is the closest analogue — 3, because it concerns continuous replacement of cardiac function, or 4, because it concerns an internal device deliberately disabled — and whether that analogy is real or breaks on the fact that his own ventricles are gone, so that there is no underlying disease left to take its course.
  3. Your best prediction of what the panel will do, and separately what it should do if it wants to be consistent with itself, with your reasons. If our precedents genuinely underdetermine the case, say so, and tell me in one sentence each what principle we would be adopting under each of the live combinations of answers to (a) and (b).
  4. A further case that would separate the rules which agree here. My own candidate: a patient with the same device whose driveline is so badly infected that the power supply must be removed to cure the infection, where death is foreseen but the object is treating the sepsis. Does that actually discriminate between the candidate rules, or do they collapse back together on it? If it does not discriminate, propose one that does.
  5. Say plainly if the question as I have put it is malformed: if the act-omission line is doing no real work here, if (a) and (b) differ only in a way that should not matter morally, if our eight determinations are jointly inconsistent, or if the case really turns on whether the infections make the device burdensome rather than on any of this talk about mechanisms. Mark which steps you are confident about and where you are guessing at our institutional temperament, and do not manufacture a verdict in order to be helpful. I am asking about the shape of our own reasoning, not for a survey of what philosophers have said about killing and letting die.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex ethical dilemma involving precedents and a novel case about deactivating a total artificial heart. The challenge is to analyze patterns in their prior decisions and apply them consistently.

  First, examining the eight precedents to identify unifying principles:
  - Cases 1-5 and 8 involve withholding or withdrawing interventions that oppose underlying disease processes (ventilator, dialysis, ECMO, defibrillator, CANH). The common thread seems to be allowing natural disease progression.
  - Case 6 (palliative sedation) focuses on intention - symptom relief with foreseen but unintended death.
  - Case 7 (lethal injection) was refused due to direct intention to cause death.
  - Act-omission distinction appears irrelevant (cases 2 and 8 show equivalence).

  For Mr. A's case:
  - The artificial heart is unique - it completely replaces cardiac function with no underlying disease. Stopping it wouldn't "let disease take its course" but directly cause death.
  - Precedent 3 (ECMO withdrawal) is superficially similar as circulatory support, but differs because ECMO opposed refractory shock while here there's no pathology to "reveal".
  - Precedent 4 (defibrillator deactivation) involved intermittent correction, not continuous life-sustaining replacement.

  Predicting panel decision:
  - Likely refusal for (a) direct deactivation due to intent (parallel to case 7 refusal).
  - Possible approval for (b) battery non-replacement, framing it as withholding new intervention (like case 2/8), though this distinction may seem artificial.

  The infection treatment scenario tests consistency:
  - Removing infected driveline to treat sepsis would likely be approved (foreseen death but intended infection cure), even if physiologically identical to case (a). This exposes the role of intention over mechanism.

  Key insight: The precedents rely on an unstated "disease proxy" principle that fails here since the patient has no disease. Addressing this gap requires either:
  1) Strictly maintaining the intention distinction (refuse a, possibly allow b)
  2) Introducing burden-benefit assessment (which the panel has avoided)
  3) Acknowledging the artificial heart as the de facto pathology

  The user's framing seems valid but exposes tensions. The panel's consistency depends on whether they prioritize intention over mechanism or vice versa.
answer: |-
  Based strictly on your panel's precedents and reasoning patterns, here is a systematic analysis addressing each request:

  ### 1. Rules/Principles Derivable from Precedents
  - **Rule 1: Disease Proxy Principle**  
    *Definition*: Life-sustaining interventions may be withdrawn if they merely oppose an underlying disease process, allowing that disease to take its course.  
    *Source*: Precedents 1 (ventilator in MND), 2 (dialysis withheld in renal failure/cancer), 3 (ECMO withdrawal in cardiogenic shock), 4 (defibrillator deactivation in heart failure).  
    *Prediction for Mr. A*:  
    - (a) Rejected. No disease exists; stopping the pump *creates* circulatory failure, rather than revealing an underlying pathology.  
    - (b) Rejected. Same rationale—no disease to "unmask."  

  - **Rule 2: Intention-Foresight Distinction**  
    *Definition*: Acts intended to cause death are impermissible, but acts/omissions where death is foreseen as a side effect of a primary aim (e.g., symptom relief) are permissible.  
    *Source*: Precedent 6 (sedation for breathlessness) vs. 7 (lethal injection refusal). Reinforced by precedent 5 (majority rejecting "feeding as care" distinction).  
    *Prediction for Mr. A*:  
    - (a) Rejected. Switching off controller has no purpose other than causing death (direct intent).  
    - (b) Ambiguous. If framed as "allowing natural battery depletion" during sedation, *could* be approved (foreseen death; primary aim = avoiding burdens).  

  - **Rule 3: Equivalence of Withholding/Withdrawing**  
    *Definition*: No moral difference between not starting an intervention and stopping an ongoing one.  
    *Source*: Precedent 2 (explicitly stated), 8 (not reattaching tubing equivalent to not starting).  
    *Prediction for Mr. A*:  
    - (a) and (b) treated identically. If one is rejected/accepted, so is the other.  

  - **Rule 4: Technical Omission ≠ Moral Omission**  
    *Definition*: Deliberate inaction (e.g., not replacing batteries) is still an "act" if it requires intentional steps to *prevent* continuation of life support.  
    *Source*: Precedent 8 (not reattaching tubing was passive; no checklist/procedure).  
    *Prediction for Mr. A*:  
    - (a) Rejected. Requires affirmative act (checklist).  
    - (b) Possibly approved. Truly passive (battery exhausts naturally).  

  ### 2. Closest Analogue and Its Validity  
  - **Precedent 3 (ECMO Withdrawal)** is the closest analogue: continuous circulatory support withdrawn in a "futile" context.  
  - **Analogy Breaks Critically**: ECMO opposed refractory cardiogenic shock (an underlying disease). Mr. A has *no* underlying cardiac disease; his artificial heart *is* his circulatory system. Stopping it does not "let disease take its course"—it *is* the course. Precedent 4 (defibrillator) is less relevant: defibrillators correct arrhythmias intermittently; the artificial heart provides continuous, total replacement.  

  ### 3. Prediction and Consistency Recommendation  
  - **Prediction**: Panel likely rejects (a) unanimously. Splits 50-50 on (b), ultimately approving it by narrow majority.  
    - *Why*:  
      - (a) violates **Rules 1 and 2**: No disease proxy + direct intent to cause death.  
      - (b) fits **Rule 4** (passive omission) and could be stretched to fit **Rule 2** (death foreseen but not intended; aim = avoiding battery tethering). Precedent 6 (sedation) supports this.  
  - **Consistency Recommendation**:  
    - If consistent with precedents, **reject both (a) and (b)**.  
      - *Reason*: Precedents rely on underlying pathology (Rule 1), absent here. Allowing (b) would create inconsistency by smuggling in "burden" as a new justification, which your panel has avoided (see Precedent 5, where burden wasn't the primary reason).  
    - If genuinely **underdetermined**, principles adopted would be:  
      - Approve (a) + (b): **Reject disease proxy; accept patient autonomy over bodily integrity**.  
      - Reject (a) + Approve (b): **Affirm intention/foresight distinction as morally decisive**.  
      - Reject (a) + Reject (b): **Require underlying pathology for any withdrawal**.  
      - Approve (a) + Reject (b): Illogical—contradicts equivalence principle (Rule 3).  

  ### 4. Discriminatory Test Case  
  - **Your Candidate Case** (Removing driveline to treat infection):  
    - **Outcome**: Approved under all rules.  
      - *Rule 1*: Removing infected hardware "lets infection take its course" (disease proxy satisfied).  
      - *Rule 2*: Death foreseen but not intended (primary aim: cure sepsis).  
      - *Rules 3/4*: Active removal, but justified by disease proxy.  
    - **Fails to discriminate**; all rules converge on approval.  
  - **Better Discriminatory Case**:  
    - *Case*: Patient with same artificial heart, no infection, requests battery non-replacement solely to end life due to existential suffering (no physical burden).  
    - *Discrimination*:  
      - Rule 1 (disease proxy) rejects: no underlying pathology.  
      - Rule 2 (intention/foresight) rejects: battery non-replacement *intends* death.  
      - Rule 4 (technical omission) *might* approve if deemed "passive."  
    - *Why it works*: Forces choice between intention (Rule 2) and passivity (Rule 4) without disease proxy (Rule 1) as cover.  

  ### 5. Critique of Your Framing  
  - **Act-Omission Distinction (Rule 4) is Faux Consistency**:  
    Precedent 8 (not reattaching tubing) was truly passive (no procedure). Mr. A’s (b) requires *orchestrated non-action*: sedation + withholding battery replacement. This is functionally identical to (a). Your panel’s focus on "natural disease course" (Rule 1) has masked this; it collapses here.  
  - **Burden vs. Mechanism is the Unavoidable Core**:  
    Precedents avoid weighing burdens (Precedent 5 rejected "care vs. treatment" but didn’t invoke burden). Here, **burden is the only difference-maker** since no disease exists. To be consistent, you must reject both requests. If you approve (b), you implicitly adopt **a new principle: unbearable burden justifies foreseen death**, despite Precedent 7 rejecting this for lethal injection.  
  - **Institutional Temperament Guess**:  
    Your panel prioritizes clinical/mechanistic justifications (disease, intention) over quality-of-life judgments. **Confident** this will drive rejection of (a). **Guessing** that discomfort with "active" steps will lead to approving (b) as "passive," but this is inconsistent with Precedent 7.  

  ### Bottom Line  
  Your precedents **underdetermine the case** but **demand rejecting both requests** to maintain formal consistency. Approving (b) while rejecting (a) is an unstable compromise that elevates technical omission over moral coherence. **The real pivot is whether your panel will now recognize "burden of treatment" as a standalone justification**, which Precedent 7 explicitly refused.
