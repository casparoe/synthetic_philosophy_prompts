prompt: |-
  I chair the renewal panel for a national funder's programme-grant scheme. Twice a year, seven of us decide whether to continue roughly fifteen multi-group research programmes for another five-year term, and we must attach to each decision a one-page rationale a lay board can sign off on. The panelists are working scientists with no philosophy training, and we have about forty-five minutes per programme using only documents the teams already submit: the founding proposal, the previous renewal report, and the current progress report with its publication list. No new evidence, no interviews.

  Our arguments keep reinventing, badly, the vocabulary of Lakatos's methodology of scientific research programmes. Someone says a group has stopped predicting anything and is only patching its model; someone replies that every worthwhile programme looks like that for a while; we end up voting by temperament. I want a decision procedure instead. It must operationalize the distinctions that do the work — the protected core versus the belt of auxiliary hypotheses, a progressive versus a degenerating problem shift, an auxiliary that increases what the programme claims and predicts versus one adopted purely to absorb a result that had already come in, and a novel fact anticipated in advance versus one merely accommodated afterward — using only the paperwork we have, in the time we have, in language a physicist or a geneticist will apply without being taught the theory. Give it as ordered questions, state what counts as a sufficient answer to each, say where it terminates in a wind-down and where it hands the question to the board because the issue is our appetite for risk rather than a fact about the science, and mark plainly the points where judgment cannot be eliminated and who owns it.

  Two things will make or break it. First, several of our applicants now file what I call a deferral register: at the outset they list the anomalies they intend to set aside and those they claim they will solve. Does an anomaly's appearing on that list exempt it from counting against the programme, or does declaring it merely make a later degenerating verdict cleaner? And where does repeated narrowing of the class of systems the core is claimed to cover fall — content-decreasing, or genuine discovery about scope — when each narrowing comes with a well-argued paper explaining why the broader claim was overstated? Second, I take Lakatos to hold that whether a programme is degenerating is visible only with hindsight, and that young programmes deserve a long leash; we have an afternoon and a fixed budget. Tell me what my procedure is doing that his framework forbids, and what dated proxy it substitutes for a historical verdict.

  Then run it on three cases. (1) A programme that stated three quantitative results in advance and had all three confirmed, but whose model now needs five auxiliary parameters fitted after the fact, two of them introduced after a measurement conflicted. (2) A programme that registered two anomalies for a ten-year deferral, deferred them, and in the meantime published heavily on questions internal to its own framework, work everyone agrees is excellent and that settles nothing anyone outside cares about. (3) Our flagship, which three of us including me were trained in and which the board cites as a success, whose core claim has been narrowed four times over three terms. If the procedure says to wind down (3), say so plainly and tell me whether to believe it. Finally, state what the procedure cannot do — in particular whether it can distinguish a degenerating programme from a field whose instruments are temporarily inadequate, since that distinction decides most of our hard cases.
reasoning: |-
  Okay, let me break this down. The user chairs a renewal panel for major research grants and needs a practical decision framework rooted in Lakatosian concepts but stripped of philosophical jargon. The pain points are clear: panelists reinvent MSRP terminology poorly, debates devolve into temperamental votes, and existing documents offer limited evidence. 

  The core tension is operationalizing "progressive vs degenerating" shifts within severe constraints: 45 mins/program, no new data, scientist-reviewers without philosophy training. The deferred anomaly list adds complexity – is it protective clothing or accountability scaffolding? The flagship case (#3) will be emotionally charged, especially since the user was trained in it. 

  First, I need to distill Lakatos into binary checkpoints. The key is tracking prediction momentum: when does model-patching become tail-chasing? The "deferral register" is brilliant – we can use it as a ledger for promised vs actual explanatory gains. For anomalies, appearing on the list shouldn't grant immunity; it creates an IOU that accrues interest over time. Scope narrowing is trickier: each paper "explaining" overstatements could be either rigor (good) or retreat (bad). The test is whether the core's predictive power grew despite shrinkage. 

  On hindsight vs real-time assessment: Lakatos needs decades; we have hours. So we'll use publication velocity as a proxy – not just quantity, but trajectory of external engagement. If citations from outside fields drop while self-citations rise, that's oxygen depletion. Instruments vs degeneration? We can't distinguish directly, but if a programme keeps blaming tools while competitors with similar tech advance, that's telling. 

  For the three cases: 
  - Case 1 sounds like textbook degeneration (post-hoc parameter inflation) despite initial wins. 
  - Case 2 is internalist bubble – excellent work that solved only its own puzzles. 
  - Case 3... ouch. Four narrowings suggest erosion, not refinement. The user's attachment makes this brutal, but if the core's predictive radius shrank faster than its accuracy grew, it's dying. 

  The framework's blind spot: it can't separate true degeneration from temporary tech limits. We mitigate by comparing with sibling fields. If glaciology is stuck but seismology leapt ahead using the same satellites, that's not just bad instruments. 

  Final design principle: Every checkpoint must yield a dispositive answer or force explicit risk ownership. No philosophical murk – just "did they deliver what they promised, and are they still hunting or just rearranging trophies?"
answer: |-
  Here is a structured decision procedure operationalizing Lakatosian concepts for your panel, designed for speed, clarity, and defensibility using existing documents. It prioritizes observable evidence over philosophical debate and forces explicit risk assessments.

  ---

  ### **Renewal Decision Procedure: Progressive vs. Degenerating Programmes**

  **Goal:** Classify each programme as **Renew**, **Wind Down**, or **High-Risk Renew (Board Judgment)** based on documented evidence.  
  **Time Allocation:** 45 mins/programme. Focus on **Core Claim Evolution**, **Prediction vs. Accommodation**, and **Explanatory Momentum**.  
  **Key Documents:** Founding Proposal (FP), Previous Renewal Report (PRR), Current Progress Report (CPR) + Publication List.

  ---

  #### **Ordered Questions & Decision Flow**
  *(Sufficient answers require evidence cited from documents/publications)*  

  1.  **Has the core claim's scope or predictive power *increased* since founding/previous renewal?**  
      *   *Check:* Compare FP/PRR core claims with CPR claims. Look for explicit expansions (new domains, quantitative precision, novel predictions).  
      *   **Sufficient for Progress:** Documented expansion (e.g., "Core now predicts X in system Y, previously untested").  
      *   **Judgment Needed (Panel):** Scope unchanged, or ambiguous evolution. *Proceed to Q2.*  
      *   **Sufficient for Degeneration:** Explicit *reduction* in scope (e.g., "Core only applies to Z under condition W now"). *Flag for Q6.*

  2.  **Do >50% of major results (CPR highlights) represent *novel predictions confirmed* (not accommodations)?**  
      *   *Check:* CPR text must state *what was predicted before data collection/experiment*. Cross-reference publication dates/methods. Deferral Register entries *do not* exempt anomalies; they define IOUs.  
      *   **Sufficient for Progress:** >50% of highlighted results are documented novel predictions confirmed (e.g., "As proposed in Year X, we predicted and observed Y").  
      *   **Judgment Needed (Panel):** ~50% novel predictions, or evidence unclear. *Proceed to Q3.*  
      *   **Sufficient for Degeneration:** <50% novel predictions; most highlights are post-hoc accommodations (e.g., "We observed X, then modified model to fit"). *Flag for Q6.*

  3.  **Has the programme resolved >50% of its *registered deferred anomalies* OR generated novel predictions *outside its initial domain*?**  
      *   *Check:* Deferral Register (FP/PRR) vs. CPR claims of resolved anomalies. Look for publications tackling deferred items *or* novel predictions in unexpected areas.  
      *   **Sufficient for Progress:** >50% deferred anomalies resolved OR ≥1 major novel prediction confirmed in a new domain (e.g., "Predicted/explained anomaly A [from register]" or "Predicted phenomenon B in unrelated field C").  
      *   **Judgment Needed (Panel):** Some progress on anomalies/new domains, but <50%. *Proceed to Q4.*  
      *   **Sufficient for Degeneration:** Minimal/no progress on deferred anomalies AND no external predictions. CPR focuses only on internal refinements. *Flag for Q6.*

  4.  **Are auxiliary hypotheses (model additions) *reducing complexity* or *inventing epicycles*?**  
      *   *Check:* Track model changes (FP → PRR → CPR). Count parameters/assumptions added *post-prediction* to fit surprises vs. those added *pre-prediction* to expand scope.  
      *   **Sufficient for Progress:** New auxiliaries enable novel predictions *before data* (e.g., "Added mechanism X, enabling testable prediction Y").  
      *   **Judgment Needed (Board - Risk Appetite):** Auxiliaries primarily post-hoc, but programme shows high technical rigor/internal consistency AND addresses fundamental questions. *Recommend High-Risk Renew.*  
      *   **Sufficient for Degeneration:** Auxiliaries are primarily post-hoc fixes with no novel predictive gain (e.g., "Added parameters P1, P2 to fit unexpected data D"). *Proceed to Q6.*

  5.  **Is the programme the *best-placed approach* to its core problem *despite* low novelty?**  
      *   *Check:* Does CPR show dominance over/unique capability vs. rivals? Is the field stagnant? (Rare; use only if Q1-4 ambiguous).  
      *   **Sufficient for Renewal:** Programme demonstrably leads alternatives (e.g., "Only model explaining features A, B, C"; rivals stagnant). *Panel Judgment.*  
      *   **Wind Down:** Alternatives exist with better predictive records. *Proceed to Q6.*

  6.  **Wind-Down Threshold:** **2+ Flags from Q1, Q2, Q3, or Q4** → **Recommend Wind Down**.  
      *   *Rationale:* Sustained reduction in scope/predictive power, accommodation > prediction, failure on deferred anomalies, epicyclic modeling.

  ---

  ### **Handling Key Challenges**

  1.  **Deferral Register:**  
      *   Anomalies on the list **DO NOT** get a free pass. Failure to resolve them *counts heavily against* the programme (Q3).  
      *   The register makes degeneration *easier to spot*: Unresolved deferred anomalies + lack of external predictions = strong degeneration signal.  
      *   **Scope Narrowing:** Each narrowing is **content-decreasing** unless accompanied by *novel predictions within the new scope* or *resolution of deferred anomalies* (Q1). A "well-argued paper" explaining overstatement is *necessary but not sufficient*; it must show *progress* (Q1-Q3), not just damage control.

  2.  **Hindsight vs. Real-Time & Proxies:**  
      *   **What Lakatos Forbids:** Definitive "degenerating" verdicts in real-time. He requires observing long-term trajectory.  
      *   **What We Do:** We substitute **prediction momentum** (Q2, Q3) and **core dynamism** (Q1) as proxies. We ask: *"Is it actively expanding its empirical grip NOW, or retrenching?"*  
      *   **Proxy for Historical Verdict:** **Trend in Novel Predictive Output** (Q2 trend across reports, Q3 anomaly resolution). Stagnation = degeneration proxy.

  ---

  ### **Application to Cases**

  *   **Case 1 (Confirmed Predictions + Post-Hoc Parameters):**  
      *   Q1: Scope unchanged? Likely **No Progress**.  
      *   Q2: 3 novel predictions confirmed = **Progress**. BUT 5 post-hoc parameters (2 post-conflict) = **Degeneration Flag**.  
      *   Q3: Unknown (assume no deferred anomalies resolved/no external predictions).  
      *   Q4: 5 post-hoc auxiliaries = **Strong Degeneration Flag**.  
      *   **Verdict: 2 Flags (Q2 Degeneration, Q4 Degeneration) → WIND DOWN.** Rationale: Initial success overshadowed by model degeneration into accommodation.

  *   **Case 2 (Deferred Anomalies + Internal Focus):**  
      *   Q1: Scope unchanged? **No Progress**.  
      *   Q2: Results are internal refinements? **Likely <50% Novel Predictions → Degeneration Flag**.  
      *   Q3: Deferred anomalies NOT resolved? **Degeneration Flag**. No external predictions? **Degeneration Flag**.  
      *   **Verdict: 3 Flags (Q1, Q2, Q3) → WIND DOWN.** Rationale: Programme became self-referential, failed on deferred promises, generated no novel external tests despite excellent technical work. It's a "puzzle-solving" engine, not a progressive research programme.

  *   **Case 3 (Flagship, Core Narrowed 4x):**  
      *   Q1: Core narrowed 4 times? **Content-Decreasing → Degeneration Flag UNLESS** novel predictions emerged *within* narrowed scope. (Check CPR for evidence).  
      *   Q2: What % of results are novel predictions vs. accommodations? (Critical - panel bias risk!).  
      *   Q3: Progress on deferred anomalies? Novel external predictions?  
      *   Q4: Are auxiliaries predictive or epicyclic?  
      *   **Honest Assessment:** If narrowing *wasn't* compensated by increased precision/novel predictions *within* the new scope (Q1), and outputs are mainly accommodations/internal refinements (Q2, Q3), then **Verdict: WIND DOWN.**  
      *   **Believe the Procedure?** **YES.** Lakatos argues sentimentality perpetuates degeneration. Narrowing *without* compensating predictive gains *is* degeneration, regardless of past glory or board perception. The procedure corrects bias.

  ---

  ### **What the Procedure CANNOT Do (Critical Limitations)**

  1.  **Distinguish Degeneration from Instrumental Limitation:** This is the core weakness. A programme may appear stagnant (no novel predictions) because the tech to test its *next* novel prediction doesn't exist.  
      *   **Mitigation:**  
          *   Check if the programme *identified specific instrumental needs* and *pursued/developed them* (CPR evidence).  
          *   Compare to *rival programmes*: Are *they* making progress on similar problems with comparable tools?  
          *   **Fallback:** If instrumental limits are plausible and the core remains coherent/promising, this pushes towards **High-Risk Renew (Q4 Judgment - Board Risk Appetite)**. Explicitly state: "*Recommended renewal based on core potential despite current instrumental barriers. High risk of stagnation.*"

  2.  **Assess Ultimate "Truth" or Long-Term Potential:** It measures *recent trajectory*, not future certainty. A "degenerating" programme might revive; a "progressive" one might hit a wall.  
  3.  **Eliminate Judgment Entirely:** Q1 (scope change nature), Q2 (novelty assessment), Q4 (auxiliary intent) require panel expertise. **Ownership:** *Panel scientists* own these judgments based on documents. *Board* owns risk decisions (Q4 High-Risk path).  
  4.  **Handle Paradigm-Shifting Anomalies:** An anomaly might require core modification *without* degeneration (e.g., relativity modifying Newtonian mechanics progressively). **Check:** Did the modification *enable new predictions* (Q1, Q2)? If yes, potentially progressive.

  ---

  **Final Rationale Language (Template):**  
  *"Recommended [Renew/Wind Down/High-Risk Renew]. Core scope has [expanded/remained stable/narrowed]. [X/Y/Z]% of key results stemmed from novel predictions confirmed. [All/Some/No] registered deferred anomalies resolved. [Model adjustments enabled new predictions/were primarily post-hoc]. [Instrumentation limitations noted; rival progress is/is not evident]. This indicates a [progressive/stagnant/regressive] trajectory consistent with [continued investment/declining returns/high uncertainty]."*  

  This procedure forces focus on *predictive momentum* and *core dynamism* using document evidence, minimizes philosophy, clarifies risk ownership, and addresses your key concerns about deferral registers, scope narrowing, and real-time assessment. It accepts the instrument-limitation ambiguity but provides a structured way to flag it for the board.
