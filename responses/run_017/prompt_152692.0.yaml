  ### Extracted Principle and Analysis

  Based on your verdicts, the core tension centers on whether a system's *normative dimension* (grounded in evolutionary history or design) and its *functional role in specifying sequential outputs* distinguish literal codes from causal descriptions. Your candidate principle (separable contributions, arbitrary mapping, external stabilization enabling error) is close but requires refinement to resolve inconsistencies, particularly cases 3 (histone code) and 6 (synthetic system). The principle also needs to address reader-relativity (case 7) and heredity. 

  #### Revised Principle
  A system instantiates a **literal biological code** if and only if:  
  1. **Symbolic granularity**: The system uses discrete, recombinable units (e.g., nucleotides, amino acids, marks) to form structured sequences.  
  2. **Arbitrariness**: The mapping from a unit/sequence to its functional outcome is chemically unconstrained—multiple outcomes could be assigned without altering the physics of the interaction.  
  3. **Decoding machinery**: A dedicated, evolved, or designed mechanism interprets the units/sequences by implementing a mapping table (e.g., tRNA synthetases for codons).  
  4. **Normativity**: The mapping is stabilized by an external factor (natural selection or intentional design) that establishes a norm, enabling systematic error (misreading).  
  5. **Sequential output**: The code specifies a sequence of discrete elements (e.g., amino acids in a polypeptide, bits in a program).  

  **Motivation for each clause**:  
  - (1) and (2) derive from case 1 (codons: positions are separable, mapping is arbitrary) and case 5 (prions: no discrete units, so no code).  
  - (3) resolves case 2 (TF binding: no decoding machinery; direct physical fit) and case 9 (computer file: CPU as decoder).  
  - (4) addresses case 8 (drifted DNA: no stabilization, so no meaning) and case 9 (designer intent).  
  - (5) resolves cases 3 (histone code: outputs chromatin states, not sequences) and 6 (synthetic system: outputs amino acid sequences).  

  #### Reconciliation of Problem Pair (Cases 3 and 6)  
  - **Case 3 (histone code)**: Fails clause 5—it outputs *states* (e.g., "transcriptionally active") not sequences. It has arbitrariness (2), decoding machinery (3), and normativity (4), but lacks sequential output. Your "code by courtesy" verdict aligns with partial satisfaction.  
  - **Case 6 (synthetic system)**: Satisfies all clauses: arbitrary mapping (2), decoding machinery (3), normativity via design (4), and sequential output (5). Heredity is not required (per your verdict).  
  - **Salient difference**: Sequential output (5), not template-copying or heredity, explains the verdict divergence.  

  #### Verdicts the Principle Preserves and Forces You to Withdraw  
  - **Preserved**: Cases 1 (literal code), 2 (no code), 5 (no code), 6 (literal code), 8 (no meaning), 9 (literal code).  
  - **Forces withdrawal**:  
    - **Case 3 (histone code)**: Your verdict is "code by courtesy," but the principle denies literal code status due to (5). *Recommendation*: Withdraw this verdict; it is not a literal code.  
    - **Case 4 (CpG methylation)**: You lean against genetic information. The principle denies code status: it has (1) and (4), but fails (2) (chemistry of methylation directly affects function), (3) (no decoding machinery; direct recognition), and (5) (outputs binary states, not sequences). *Recommendation*: Abandon your hesitation; it is not a code.  
    - **Case 7 (codon reassignment)**: You reject reader-relativity. The principle allows content to shift with the decoding machinery (3) and normativity (4). If two decoding systems coexist (standard vs. engineered), there is no "privileged" one—content is context-dependent. *Recommendation*: Withdraw the demand for privilege; normativity (4) anchors content, but it can be plural if multiple stabilizers exist.  

  #### Predictions for Unlisted Cases  
  Apply the principle to new cases:  
  - **Positional information in a morphogen gradient**:  
    - Outputs a spatial pattern, not a sequence (fails 5).  
    - Mapping is not arbitrary (concentration directly dictates response; fails 2).  
    - No decoding machinery; direct cellular response (fails 3).  
    - *Verdict*: No literal code; causal description suffices.  
  - **Somatically generated immune receptor sequences**:  
    - Arbitrary in theory (countless sequences possible), but selection acts post hoc (fails 4: no pre-set norm).  
    - No decoding machinery; binding is direct (fails 3).  
    - Outputs binding affinity, not a sequence (fails 5).  
    - *Verdict*: No literal code; selection sculpts causal affinity.  
  - **DNA under dual selection (coding + structural role)**:  
    - For translation: Literal code (satisfies all clauses).  
    - For structural role (e.g., nucleosome positioning): Fails (2) (chemistry constrains shape), (3) (no decoding), and (5) (outputs structure, not sequence).  
    - *Verdict*: Dual aspects; coding is literal, structural is causal.  
  - **Minimal synthetic cell (assembled from scratch)**:  
    - If it includes a genetic code with sequential output (5), decoding machinery (3), and design-based normativity (4), it is a literal code.  
    - Heredity is irrelevant (per case 6).  

  #### Assessment of Pluralism  
  - **No single principle suffices** for all "information" talk in biology. Your cases reveal two irreducible types:  
    1. **Literal codes**: Satisfy all five clauses (cases 1, 6, 9).  
    2. **Causal-informational descriptions**: Systems with heredity, arbitrariness, or reader/writer asymmetry but lacking key features (cases 3, 4, 7).  
  - **Implications for deflationism**:  
    - Literal codes (type 1) add normative, semantic content beyond causation: they describe how *norms* (from selection/design) enable error, misrepresentation, and context-dependent meaning.  
    - Causal-informational descriptions (type 2) are deflationary—they are shorthand for complex causal structures (e.g., "histone code" for enzyme-substrate interactions).  
    - *Recommendation*: Adopt pluralism. Reject the deflationary claim for literal codes (they are not "just" causal), but accept it for other cases.  

  ### Final Recommendation  
  - **Adopt the revised principle** for literal biological codes. It resolves all cases except case 7 (codon reassignment), where pluralism is unavoidable: content is reader-relative, but normativity (clause 4) provides objectivity within a context.  
  - **Withdraw verdicts** on cases 3 and 4 as noted.  
  - **Embrace pluralism**: Information talk is not unitary—literal codes are semantic, while other uses are causal-descriptive. This preserves your intuition that some metaphors (e.g., "genetic code") are literal, while others ("regulatory code") are not.
