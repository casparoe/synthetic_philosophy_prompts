  - Although the bottom-up simulation recovers the transition, it is approximate and does not yield the geometric rule. The rule is found at the tissue level. Moreover, the simulation is sensitive to the parameters and does not have a closed form, meaning it does not provide a simple, general law at the lower level that captures the invariance. The invariance is captured by the geometric rule.

