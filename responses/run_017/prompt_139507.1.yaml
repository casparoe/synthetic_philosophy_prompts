prompt: |-
  Me and a mate got properly stuck on this and I cant let it go. His position is dead simple: whatever I say now about tomorrow is either true or false right now, and we just dont know which yet. So "there will be a sea battle tomorrow" is, this moment, either true or false, and same for "I'll get the job" and "the coin comes up heads". My gut says no, at least for some of them, but every time I try to say why, it collapses into "well, I dont know yet", which is exactly the bit he's denying is the point. I've poked around online and there seem to be about three families of answer: everything is already settled true or false; nothing contingent about the future has a truth value yet; and something about branching paths where more than one future is somehow there until one gets actualised. Plus a word I didn't follow, supervaluation I think, and people arguing about whether "it was already true yesterday that this would happen" is true retroactivly.

  Before I read any more of it, I want the spec rather than the theories. What does an account of how future-tensed statements get their truth — or whatever it is they get instead — actually have to deliver to be any good? I want it good enough for three things: to tell me whether there's any point deliberating or whether that's just a feeling I have; to tell me whether it's sensible to be relieved that something is over when I wasn't relieved about it beforehand; and to tell me whether a machine that knew every fact about the present in complete detail could in principle tell me what happens tomorrow, or whether there'd still be nothing there to be known.

  Dont send me a reading list or names of papers, I'm not going to a library, and I can't check anything online either — just the requirements and why each one is a requirement.

  Things I keep coming back to, which you can turn into requirements or throw out:

  - The eclipse. "There'll be a total eclipse visible from Cornwall in 2099" feels true now and settled, exactly the way the sea battle doesn't. But both are about the future and neither has been witnessed by anybody. If a theory can't tell me what the difference is meant to be — computability, whether a person's decision is in the chain, whether it's the kind of thing that could have gone otherwise — I don't see what it's for.
  - The disjunction. Everyone agrees "either there'll be a sea battle tomorrow or there won't" is true now. But on the no-truth-value-yet view, "there'll be a battle" isn't true and "there won't be a battle" isn't true either, so "or" can't just be working off the truth of its parts. Does a theory owe me an account of that, or is it allowed to say "or" is special here?
  - Retrospective truth. The battle happens Wednesday. Come Thursday I want to say "it was already true on Tuesday that there'd be a battle", and that seems to sneak back in everything I denied on the Tuesday. Does a decent theory have to give me that sentence, or does it have to explain it away?
  - The demon. If a being that is never wrong tells me on Monday there'll be a battle, something about the situation changes, even though the weather and the fleets haven't. Has the statement now become true, or was it always true and only my reasons changed? And if the demon's existing is what settles it, then truth seems to depend on who's standing around, which is weird.
  - Graded settledness. A die loaded to come up six 95% of the time, versus a fair one. Is settledness on/off, or does it come in degrees — and what is my "50%" tracking if there's no fact of the matter?
  - The snatched coin. I flip it and, before it lands, somebody grabs it out of the air and melts it down. Now what — was "it will land heads" true, false, neither, or is the question just void?
  - The asymmetry thing. I'm dreading the test result I get on Friday and I'm not dreading the one from last year that I still haven't been told. Should a theory of future contingency be the thing that explains that, or is that just how humans are wired and none of its business?

  So: the requirements list, with the case behind each; which ones are non-negotiable and which are just what one camp happens to want; and flag any two you think can't both be satisfied, since that's the bit I most want to see. Then, short paragraphs only, how the three views I named at the start do against your list. In British English please.
reasoning: |-
  Okay, the user and their friend are stuck on whether future statements have a truth value now. The user's mate says any statement about the future is already true or false, even if we don't know. The user feels this isn't right for some cases, like sea battles or coin flips, but keeps falling back to "we don't know yet," which is exactly what their mate dismisses.

  The user has looked into three main theories: everything is settled (eternalism), nothing about the future has a truth value yet (open future), and branching timelines. They've also come across "supervaluation" but didn't get it. They mention specific puzzles: the eclipse (settled vs. contingent), disjunction issues, retrospective truth, a truth-telling demon, graded settledness, a snatched coin, and an asymmetry in how we feel about past and future events.

  Their main request is for a "spec"—what a good theory must handle—without recommending readings. They want it to address three things: whether deliberation matters, why relief happens after an event, and if a present-knowing machine could predict tomorrow. They also want the requirements assessed against their puzzles, highlighting any conflicts.

  First, I need to extract the implicit requirements from their three core needs and seven puzzles. For deliberation, a theory must explain why choosing feels meaningful if outcomes are settled or unsettled. For relief, it must account for why we only feel relief after an event, not before. For prediction machines, it must clarify if future facts are knowable now.

  From the puzzles: The eclipse vs. sea battle shows a distinction between settled and unsettled events. Disjunction requires handling "P or not P" being true even if P lacks a truth value. Retrospective truth needs to reconcile past truths about futures. The demon highlights if knowledge affects truth. Graded settledness questions whether probability measures something real. The snatched coin tests truth values for prevented events. The asymmetry examines why past unknowns don't cause dread like future ones.

  Now, non-negotiables: Deliberation must be substantive, not illusory. Relief's temporality needs explanation. The eclipse/sea battle distinction is crucial—any theory must account for why some futures feel fixed. Disjunction must be handled without special pleading. Retrospective truth should make sense without contradiction. Conflicts might arise: e.g., if a machine can predict everything (settled view), deliberation seems pointless, but the user wants deliberation to matter. Or if nothing is settled (open future), how is the eclipse different? Also, graded settledness might clash with binary truth values.

  For the three theories: Eternalism (everything settled) handles disjunction, retrospective truth, and the demon easily, but struggles with deliberation feeling meaningful and the eclipse/sea battle distinction. Open future (no truth values) makes deliberation real and explains relief, but flounders on disjunction and retrospective truth. Branching timelines might handle gradedness and some puzzles, but "settled" becomes relative, and retrospection is tricky.

  Supervaluation could address disjunction by considering all possible futures, but it's complex. The user didn't ask for it, so I'll skip details. Priority should be on clear conflicts: e.g., a prediction machine knowing everything implies no genuine openness, conflicting with deliberation's importance. Or retrospective truth requiring past truth values, which open future denies.

  Finally, the user wants British English, short paragraphs, and flagged incompatibilities. Structure: list requirements with reasoning, note conflicts, then evaluate theories concisely. Ensure it's practical—no jargon, just the "spec" they requested.
answer: |-
  Here's your requirements list derived from your needs and cases, structured as a "spec" for evaluating theories of future contingency. Requirements are categorised as **Non-Negotiable** (essential for any minimally adequate theory), **Contested** (sought by some but not all camps), or **Conflict Flags** (where requirements may pull against each other).

  ---

  ### **Core Requirements List**

  1. **Explain Deliberation's Point**  
     *Requirement:* Must show why deliberating *feels and is* genuinely substantive, not just an illusion, even if outcomes are (or aren’t) settled.  
     *Why Non-Negotiable:* If deliberation is pointless (e.g., because everything’s fixed), the theory contradicts universal human experience and makes agency nonsensical.  
     *Case:* Deciding whether to flee or fight in the sea battle must "matter".

  2. **Account for Relief Asymmetry**  
     *Requirement:* Must explain why we’re only *retrospectively* relieved (e.g., post-test), not prospectively, even if we knew the probabilities.  
     *Why Non-Negotiable:* Relief’s temporality is a bedrock psychological fact; a theory ignoring this is unfit for human concerns.  
     *Case:* Dreading Friday’s test result but not last year’s unrevealed one.

  3. **Distinguish Settled vs. Open Futures**  
     *Requirement:* Must cleanly differentiate "eclipse-like" events (fixed by current laws/facts) from "sea-battle-like" ones (contingent on unresolved processes).  
     *Why Non-Negotiable:* Your intuition that eclipses are "settled now" while battles aren’t is fundamental; a theory blurring this is counterintuitive.  
     *Case:* Eclipse in 2099 vs. tomorrow’s sea battle.

  4. **Handle Disjunction Without Special Pleading**  
     *Requirement:* Must explain why "P or not-P" is *now* true, even if neither "P" nor "not-P" individually has a truth value.  
     *Why Non-Negotiable:* Rejecting this would violate basic logic, making the theory untenable for rational discourse.  
     *Case:* "Either the battle happens or it doesn’t" must be true today.

  5. **Clarify Retrospective Truth**  
     *Requirement:* Must make sense of us saying *after the fact*, "It was true all along".  
     *Why Contested:* Some theories *must* say this (if futures are settled), others *must* deny it (if truth values emerge later). But it can’t be paradoxical.  
     *Case:* Claiming on Thursday "it was true on Tuesday the battle would happen".

  6. **Respect the Demon’s Role**  
     *Requirement:* Must explain how the demon’s infallible prediction *changes our epistemic access* without altering ontological "settledness".  
     *Why Contested:* Your mate might say it merely reveals pre-existing truth; you might want prediction to *not* equate to truth-making.  
     *Case:* Demon tells you Monday about Wednesday’s battle.

  7. **Accommodate Graded Settledness**  
     *Requirement:* Must align with our treating probabilities (e.g., 95% loaded die) as tracking *objective tendencies*, not just ignorance.  
     *Why Contested:* "On/off" settledness views reject degrees; others embrace probability as real.  
     *Case:* Fair die (50%) vs. loaded die (95%) – is "50%" just *our* uncertainty?

  8. **Address Prevented Futures**  
     *Requirement:* Must handle cases where a future event is made impossible *mid-process*.  
     *Why Non-Negotiable:* Snatched coins or aborted battles test if truth was ever "in play".  
     *Case:* Coin flipped then melted mid-air – was "it will land heads" ever true/false?

  ---

  ### **Conflict Flags**
  - 🚩 **Deliberation vs. Prediction Machine:** If a present-knowing machine *can* predict tomorrow perfectly (requirement implied by your question), deliberation is arguably pointless. But **Deliberation's Point** demands it *isn’t*. *Theories must resolve this tension.*  
  - 🚩 **Settled vs. Open Futures vs. Retrospective Truth:** If the eclipse is settled *now* but the sea battle isn’t, how can we later say the battle "was always true"? Does "settledness" change over time?  
  - 🚩 **Graded Settledness vs. Binary Truth:** If truth is binary (true/false), probabilities can’t reflect "partial truth". If truth values are absent or fuzzy, what do probabilities *mean*?

  ---

  ### **How the Three Theories Handle Your Requirements**  
  *(Short paragraphs, British English)*

  **1. Eternalism (Everything Settled):**  
  Your mate’s view. All future-tensed statements are already true/false. Satisfies **Disjunction** (both options exist, one is true), **Retrospective Truth** (truth was timelessly fixed), and **Demon** (demon reveals pre-existing truth). Fails **Deliberation’s Point** (your choices don’t change outcomes, so why deliberate?), **Relief Asymmetry** (if Tuesday’s truth matches Thursday’s fact, why dread Tuesday?), and **Settled vs. Open** (eclipses and sea battles are equally fixed – no distinction). **Prediction Machine** works; **Graded Settledness** is just ignorance; **Snatched Coin** must say "heads" or "tails" was true until prevention, which feels odd.

  **2. Open Future (No Truth Values Yet):**  
  Future contingents lack truth values until resolved. Excels at **Deliberation’s Point** (your choice *creates* truth), **Relief Asymmetry** (relief comes when truth-value *crystallises*), and **Settled vs. Open** (eclipses are fixed by current astrophysics; sea battles aren’t). Struggles with **Disjunction** (if neither "battle" nor "no battle" is true, how is "battle or no battle" true? Often solved via "supervaluation" – it’s true because *all* futures satisfy it). Rejects **Retrospective Truth** (post-battle, "it was true" is false; truth *emerged*). **Demon** is wrong or lucky (no truth to know). **Prediction Machine** impossible. **Graded Settledness** tracks objective tendencies, not truth. **Snatched Coin** is void – no fact to judge.

  **3. Branching Timelines (Many Worlds-ish):**  
  All possible futures are real until "actualised". Nails **Deliberation’s Point** (you choose *which branch* to realise), **Settled vs. Open** (eclipses are on all branches; sea battles vary), and **Graded Settledness** (95% die = 95% of branches show six). **Relief Asymmetry** holds (you actualise one branch, closing others). **Disjunction** is true (all branches cover both options). **Retrospective Truth** is false pre-event (multiple options existed), true post-event (one branch was actualised). **Demon** might know which branch you’ll take. **Prediction Machine** could predict probabilities, not certainties. **Snatched Coin** leaves no branch with landing – void or false?

  ---

  ### **Key Trade-offs Summary**
  - **Eternalism** secures logic and retrospection but sacrifices agency and the open/ settled distinction.  
  - **Open Future** preserves agency and distinction but strains logic and retrospect.  
  - **Branching** handles most smoothly but makes "settled" branch-relative and may feel metaphysically extravagant.  
  - **Your demon case** is least decisive: all theories *can* explain it, but differently.  
  - **Conflict Alert:** Deliberation vs. Prediction Machine is the deepest rift – choose your priority.  

  This gives you the framework to stress-test any theory. If a view flunks a **Non-Negotiable**, bin it. If it papers over a **Conflict Flag**, probe harder.
