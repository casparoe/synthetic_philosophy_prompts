prompt: |-
  I chair the allocations committee of a health research charity that awards one fixed envelope of money four times a year. We are six lay trustees and a scientific officer; we meet for a single afternoon; the money must all go; our decision is final. We are also required to publish written reasons to every applicant, including the ones we turn down, within two weeks. And because we meet quarterly with rotating membership, we have to be able to say how this quarter's choice relates to last quarter's without either being bound by it or drifting away from it at random.

  Our difficulty is not missing information. It is that the things we compare do not share a measure. A cheap, well-evidenced intervention that gives many people a small benefit; an expensive service that gives a few severely ill people a large and irreversible one; an exploratory programme that will probably come to nothing and might change practice for everyone. Cost-per-outcome in one currency, or a weighted score that adds everything up, would settle these comparisons only by pretending the difficulty away, and my trustees will not accept that. So I want a procedure we can run — ordered questions, what counts as a sufficient answer to each, where it returns a determinate result, and where it stops and hands the decision to a person because the remaining question is one of values rather than facts.

  Specifications I care about, roughly in the order the procedure should handle them:

  First, a diagnostic step. When two bids look incomparable, I want the committee to be able to tell apart at least four situations: that we simply cannot measure something we know to be comparable; that our comparisons are vague or only roughly comparable, so that more or better evidence would sharpen them; that the options are, in the technical sense, on a par — comparable, better in one respect and worse in another, but neither better overall nor equally good; and that there is a genuine lexical ordering or radical incomparability. The point of the distinction is that each diagnosis licenses a different next step, and I want that stated explicitly: which diagnoses are responsive to evidence, which leave the choice rationally underdetermined so that something other than a reason — commitment, the will, a decision to make an aim one's own — is what settles it, and which are settled by the ordering itself.

  Second, a second diagnostic, because I think we conflate two things. Some of our hard choices are choices between genuinely permissible options, where the right account of what we are doing is that we commit. Others are conflicts in which we must act and there is a remainder whatever we do: the appropriate aftermath is regret, acknowledgment, perhaps apology or compensation to those who lose, even though we chose correctly. These call for different handling downstream, and I want a way for a committee — not an individual agent — to tell which it is in, and what it is supposed to do about it either way.

  Third, a rule for agglomeration. Most quarters we are tempted by a large number of small improvements in one value set against a concentrated severe loss under another. Adding the small improvements up already presupposes a common unit, so I want the procedure to say what we may do here, what we must refuse to do, and how to describe the refusal honestly to an applicant who has twenty small studies and wants them counted.

  Fourth, a rule about chance. Say when randomising is legitimate and when it is buck-passing, and distinguish a fair lottery among equally-placed claimants from tossing a coin between two programmes because we cannot decide. If the procedure ever permits the latter, I want to know what has to be true first.

  Fifth, a rule about recurrence: what precedent may and may not do across quarters, how a committee tells a genuine re-weighing of aims from mere noise or from a change in who happens to be in the room, and what has to be recorded when we depart from what we did last time.

  Throughout, mark the points at which judgment cannot be eliminated rather than smoothing them over, and say who signs off at each: the chair, the full committee, the scientific officer, or the board. Say what happens when the committee cannot agree. The whole thing has to be runnable inside one afternoon by people with no philosophical training, and it must not depend on monetising outcomes, on a health-economic common currency, on a weighted-sum spreadsheet, on a lexical ordering asserted without an account of why that ordering, or on calling for more evidence as a general answer.

  Then run it. Start with the three-way choice above. Then take a quarter in which last quarter's precedent favoured the many-small-benefits programme and a new applicant makes that same case better than it was made before — say what the procedure does with precedent there. Finally, apply it to the case I expect to dislike: an application that is stronger than its rival on every consideration this committee has ever cited, arriving alongside a weaker one that would serve an aim we have not yet committed to. If your procedure permits funding the second and saying so, tell me what the published reason to the first applicant can honestly be, given that it cannot cite any deficiency in their proposal. If it does not permit it, say why not and what the procedure is missing.

  Close by saying what the procedure cannot do. I have two worries in particular that I want addressed directly: that it cannot, from the armchair, certify which of the four diagnoses is the correct one in any actual case; and that a committee could use the language of incommensurability as cover for preference, fatigue, or noise. Say what would detect that, and say plainly where the procedure stops and a person has to answer for the choice.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They chair an allocations committee for a health research charity. They have to distribute a fixed amount of money quarterly with a diverse group of trustees and a scientific officer. The main challenge is comparing incommensurable proposals—like cost-effective small benefits vs. expensive interventions for severe cases vs. high-risk exploratory research. They need a transparent, defensible procedure without using common metrics like QALYs or weighted scores.

  First, I need to unpack their specifications. They want a diagnostic step to classify incomparability into four types: measurement issues, evidence gaps, parity, or genuine incomparability. Each type leads to different next steps. Then, they want a second diagnostic to distinguish between permissible choices (requiring commitment) and tragic choices (involving regret). Next, rules for agglomeration—can small benefits sum to outweigh a major loss? Also, when is randomization acceptable? And how to handle precedent without being bound by it.

  The user’s explicit needs are clear: a structured, time-efficient process that respects incommensurable values. But deeper needs might include maintaining committee cohesion, ensuring legitimacy in decisions, and providing defensible reasons to rejected applicants. They also worry about inconsistency between quarters and misuse of the procedure to mask arbitrary decisions.

  For the diagnostic steps, I recall philosophical concepts like Ruth Chang’s parity and Joseph Raz’s incomparability. The committee needs practical tools to categorize disagreements. For agglomeration, the key is avoiding additive aggregation unless values are truly commensurable. Randomization should only apply when options are on a par, not to evade tough calls. Precedent requires documenting reasons for departures to show deliberate reevaluation rather than inconsistency.

  Testing with their scenarios: the three-way choice should force the committee through diagnostics to reach a structured decision. The precedent scenario needs clear rules on when to revisit past decisions. The strongest vs. new aim proposal tests if the procedure allows funding novel aims without penalizing strong proposals. Here, the published reason must focus on strategic direction, not proposal flaws.

  Addressing their worries: the procedure can’t armchair-diagnose but relies on committee deliberation. Safeguards like the Scientific Officer’s evidence checks and explicit value commitments reduce misuse. The chair’s role in documenting reasoning and ensuring adherence is crucial. The procedure’s strength is in structuring debate and forcing explicit justifications, making hidden preferences harder to hide.

  I need to ensure the steps are doable in one afternoon. Using structured questions with branching paths keeps it efficient. Roles like the Scientific Officer pre-screening evidence and the Chair guiding diagnostics help. Time boxing each step prevents over-analysis. The key is balancing depth with practicality, ensuring trustees without philosophy training can engage meaningfully.
answer: |-
  Here's a procedure designed for your committee, respecting incommensurability while providing structure, defensibility, and actionable diagnostics. It uses staged questions with clear stopping rules and assigns responsibilities.

  **The Procedure: Structured Value Deliberation (SVD)**

  **Phase 0: Preparation (Scientific Officer - SO)**
  1.  **Pre-Screen:** SO pre-filters applications for basic eligibility (fit with remit, feasibility, basic ethical standards). Ineligible bids are rejected with standard reasons.
  2.  **Evidence Packet:** SO prepares a concise summary for each eligible bid: core aim, target population/problem, evidence strength/quality (using standard hierarchies), cost, scale, nature/scale of potential benefit/harm, key uncertainties, novelty.
  3.  **Value Tags:** SO *provisionally* tags bids with relevant core values/aims they serve (e.g., "Severity Relief," "Population Health Gain," "Exploratory Potential," "Equity Focus," "System Change"). *Avoids forcing a single metric.*

  **Phase 1: Individual Ranking & Initial Diagnostics (30 mins - All Trustees)**
  1.  **Silent Review:** Trustees independently review evidence packets.
  2.  **Initial Ranking:** Each trustee privately ranks *all* bids from most to least compelling funding choice *without using scores*. Note *why* each bid is placed above/below others (e.g., "Bid A above B due to severity, despite cost").
  3.  **Diagnostic Flagging:** For each pair of top-contending bids where comparison feels difficult or arbitrary, trustees *privately* note which of the following resonates most:
      *   **M (Measurement Limitation):** "We *know* these should be comparable (e.g., both aim to save lives), but we lack the tools/evidence to measure the outcomes precisely enough to compare."
      *   **E (Evidence Gap):** "Better or different evidence (e.g., long-term data, direct comparative study) could make this comparison clearer, but we don't have it now."
      *   **P (Parity):** "These are genuinely comparable, but one isn't clearly better overall. Bid X is better in way A, Bid Y is better in way B. Neither dominates; they seem *on a par*."
      *   **I (Incomparability/Lexical):** "These are fundamentally different kinds of value/aim. Comparing them feels like comparing apples to oranges. One might involve a *lexical priority* (e.g., preventing immediate death trumps all else)."
      *   **C (Clear Comparability):** "Actually, on reflection, one *is* clearly better/worse overall."

  **Phase 2: Committee Deliberation & Diagnosis Confirmation (90-120 mins - Chair Facilitates)**
  1.  **Reveal Rankings:** Chair collates initial rankings (anonymously or openly, as group prefers). Identify bids consistently near the top and bottom. Focus discussion on close contenders.
  2.  **Diagnostic Discussion (Key Step):** For each difficult pair flagged by trustees:
      *   Chair asks trustees to share their diagnostic impressions (M, E, P, I, C) and brief reasons.
      *   **SO Input:** SO states if evidence limitation (M/E) is genuinely addressable in principle with feasible future research (E) or is inherent (M).
      *   **Committee Vote:** Chair calls a vote on the dominant diagnosis for this pair (M, E, P, I, C). Majority rules. *Record the diagnosis and brief reason.*
      *   **Diagnosis Determines Next Step:**
          *   **M (Measurement Limitation):** *Commitment Required.* Acknowledge values are comparable in principle but measurement fails us. Committee must *commit* to prioritizing one value dimension over the other *for this decision* (e.g., "Given measurement limits, we prioritize severity of need over scale this quarter"). *SO records the commitment.*
          *   **E (Evidence Gap):** *Commitment Required (with caveat).* Acknowledge better evidence *could* resolve this, but it's unavailable now. Committee must *commit* based on current best judgment, recognizing the uncertainty. SO may note the specific evidence gap for future cycles/published reason. *SO records the commitment and evidence gap.*
          *   **P (Parity):** *Decision Point Opens.* Options are deemed comparable but neither better. Committee can: a) *Commit* to one based on secondary considerations (novelty, feasibility, applicant track record - *SO verifies facts*), b) Use a **Fair Lottery** if truly balanced after secondary checks. *Record choice and reason (commitment secondary factor or lottery).*
          *   **I (Incomparability/Lexical):** *Radical Choice Required.* Committee must decide which core value/aim takes precedence *in this context*. This is a *value commitment*, not just evidence-based. Requires explicit articulation of the value chosen and why it lexically dominates or is prioritized now (e.g., "Preventing irreparable harm to the severely ill takes precedence over exploratory potential this quarter"). *SO records the value commitment.* If true lexical priority is affirmed (e.g., life-saving always trumps quality-of-life), this becomes a precedent *for that specific priority rule*. *Chair ensures clear articulation.*
          *   **C (Clear Comparability):** Proceed based on that clear judgment.
  3.  **Second Diagnostic: Permissible Choice vs. Tragic Conflict:**
      *   After tentative ranking emerges, Chair asks: "Does funding X *necessarily mean* failing a strong, distinct moral demand represented by Y? Or are both X and Y genuinely good options, and we simply can't fund both?"
      *   **Permissible Choice (Commitment):** If the latter, the choice involves commitment, not tragic loss. Downstream: Publish reasons focus on positive choice ("Y funded due to Z"), regret is minimal/shared.
      *   **Tragic Conflict (Regret):** If the former (e.g., funding life-saving for Group A means denying equivalent life-saving for Group B due to resource limit), acknowledge the conflict. Downstream: Published reasons express the conflict explicitly ("We faced an unresolvable conflict between A and B..."). Committee should express regret/minutes note the loss. *Chair guides this reflection.*

  **Phase 3: Agglomeration Rule (Applied During Deliberation)**
  *   **Rule:** Agglomeration of small benefits is *only* permitted *within a single, agreed value dimension* identified in Phase 2 diagnostics. You cannot sum "many small quality improvements" to outweigh "one large life-saving" *unless* Phase 2 established that "scale of minor benefit" vs. "severity" resulted in a **P (Parity)** or **I (Incomparability)** resolved by *committing* to "scale" as the priority value *for this decision*.
  *   **Application:** If 20 small studies serve the *same* core value (e.g., "Population Health Gain - Minor Improvements") and the committee has committed to prioritizing that value dimension over others (e.g., Severity) in a prior **M, E, P, or I** diagnosis, *then* they can be considered as a bundle representing that value commitment. Otherwise, they are considered individually against the competing value.
  *   **Honest Description:** "Your portfolio of studies addresses [Value A]. The Committee prioritized [Value B - e.g., Severity] this quarter. While each study has merit, aggregating their benefits was not deemed sufficient to outweigh the priority given to [Value B] in this specific funding round."

  **Phase 4: Chance Rule (Integrated in Phase 2)**
  *   **Legitimate:** Only after a confirmed **P (Parity)** diagnosis *and* exhaustion of relevant secondary considerations (feasibility, track record - *SO verified*), resulting in *genuine equipoise*. This is a "fair lottery among equally placed claimants" *within the same value dimension*.
  *   **Buck-Passing:** Using chance for **I (Incomparability)** or **M/E** diagnoses without commitment, or for **P** without checking secondaries. Using it because of fatigue or deadlock on values.
  *   **Requirement:** Must be minuted as the reason ("Resolved by lottery after parity diagnosis and no decisive secondary factors").

  **Phase 5: Precedent Rule (Chair & SO Responsibility)**
  *   **Permitted:** Precedent *only* binds on **explicit value commitments** recorded from **I (Incomparability/Lexical)** diagnoses establishing lexical priorities (e.g., "Life-saving always trumps quality improvement"). Precedent *informs* but does *not bind* on **M, E, P** diagnoses or **commitments** made under them, as evidence/context changes.
  *   **Re-weighing vs. Noise:**
      *   **Genuine Re-weighing:** Requires explicit discussion minuted by Chair: *Why* is the committee departing? (New evidence? Shift in strategic goals articulated by the board? Changed context? Genuine reconsideration of value weights?). The *new* Phase 2 diagnosis (**M, E, P, I**) and resulting *commitment* must be clearly recorded. SO notes if new evidence triggered an **E**->**C** shift.
      *   **Mere Noise/Personnel Change:** Departure happens *without* explicit diagnosis/minuted reason linked to evidence or articulated value reconsideration. Chair must challenge this and force Phase 2 diagnostics.
  *   **Recording Departure:** Minutes *must* state: "Departing from Q[X] decision on Bid Y. Previously, decision based on [Old Diagnosis/Commitment]. Now, [New Diagnosis/Commitment] due to [Reason: New Evidence E refuting old? New Value Commitment I? Context change?]." Published reasons can reference strategic shifts if based on value commitment ("Prioritized exploratory research this quarter to foster innovation").

  **Phase 6: Final Ranking & Allocation (30 mins - All Trustees)**
  1.  Apply the commitments, precedents, and rules established in Phases 2-5 to refine the ranking.
  2.  Allocate funds down the ranked list until the envelope is exhausted.
  3.  **Final Approval:** Full committee ratifies the final list and the key diagnoses/commitments recorded. *Chair signs off on the minutes and value commitments. SO signs off on evidence summaries and factual accuracy.*

  **What Happens if Stuck?** If deadlock persists after exhausting the procedure (especially on **I** or **P**):
  1.  Chair proposes a shortlist based on diagnostics.
  2.  Committee votes. Majority wins.
  3.  If tie, Chair casts deciding vote *after* explicitly stating the value basis for their choice.
  4.  *Minutes record the vote and Chair's reasoning.*

  **Running the Examples**

  1.  **The Three-Way Choice (Cheap/Many-Small, Expensive/Few-Large, Exploratory):**
      *   **Phase 2 Diagnostics:** Likely **I (Incomparability)** between all pairs (Scale/Benefit vs. Severity vs. Future Potential). Committee must make a radical value commitment: Which core aim prevails *this quarter*? (e.g., "Addressing severe, irreversible harm takes precedence"). SO records this commitment. Exploratory vs. Severe might also be **I**, or if deemed comparable, **P** requiring secondary factors. Cheap/Many vs. Severe: **I** resolved by the lexical priority commitment. Cheap/Many vs. Exploratory: Could be **P** or **I**.
      *   **Outcome:** Value commitment dictates the top priority (e.g., Severe). The expensive bid wins. Exploratory might beat Cheap/Many if **P** and secondary factors favor it.

  2.  **Precedent Scenario (Last Q favoured Many-Small; New Applicant Makes it Better):**
      *   **Phase 5:** Chair notes last quarter's decision likely involved a **M, E, P, or I** diagnosis/commitment favoring "Scale" or rejecting "Severity" priority. Precedent *does not bind* unless it was a lexical **I** commitment.
      *   **Phase 2:** Committee *must* re-run diagnostics *this quarter* for the key conflict (Many-Small vs. Severe). Did last quarter's **E** gap get filled (shifting to **C** or **P**)? Has context changed? Do we *reaffirm* or *change* the value commitment? If they reaffirm commitment to "Scale" (via **M, E, P, or I**), the better-made bid likely wins. If they commit to "Severity" (**I**), it loses despite being better. The *reason* for departure (or consistency) is minuted.

  3.  **Strongest Bid vs. New Aim:**
      *   **Phase 2 Diagnostics:** Compare Strong Bid (excels on all past cited values A, B, C) vs. New Aim Bid (serves value D, poorly on A, B, C). Diagnosis is almost certainly **I (Incomparability)**. The committee faces a radical choice: Stay committed to values A/B/C, or adopt value D as a new priority?
      *   **Procedure Permits:** Funding the New Aim bid *if* the committee explicitly commits to value D as taking precedence *this quarter* via an **I** diagnosis ("We are prioritizing exploration of Value D as a new strategic direction").
      *   **Published Reason to Strong Bid (Honest):** "Your application was exceptionally strong and met all our usual criteria to a high standard. However, the Committee made a specific strategic decision this quarter to prioritize funding for initiatives exploring [Value D], an area we have not previously focused on but believe warrants investment now. This represents a shift in our allocation priorities for this round, not a reflection on the quality of your proposal, which was outstanding." *This is honest: it cites the committee's value commitment, not a deficiency.*
      *   **Why Permissible?** The procedure forces the radical choice and explicit commitment. It doesn't require past values to bind future choices absolutely. The published reason transparently explains the *positive* choice and the *strategic* nature of the shift.

  **What the Procedure Cannot Do & Safeguards**

  1.  **Cannot Armchair Diagnose:** You are absolutely right. The **M/E/P/I/C** diagnosis is *interpretive* and *deliberative*. It relies on the committee's collective judgment during Phase 2, guided by the SO's input on evidence. The procedure provides a *framework* and *language* for making this interpretation explicit and contestable, not an algorithm. The safeguard is *transparency*: the diagnosis, reasons, and commitments are minuted and influence the published reasons.
  2.  **Risk of Misusing Language as Cover:** This is a significant risk.
      *   **Safeguards:**
          *   **SO as Fact Checker:** SO verifies evidence claims and flags if a claimed "E" gap is non-existent or an "M" claim ignores available valid metrics.
          *   **Chair as Process Enforcer:** Chair must challenge vague appeals to incomparability ("Why *exactly* are these incomparable? What are the conflicting values?"). Force specificity in diagnoses and commitments.
          *   **Requiring Explicit Commitments:** Diagnoses **M, E, P, I** all require minuted *commitments* or *choices* that become part of the record. It's harder to hide behind "incomparability" if you must then state *which value you chose anyway*.
          *   **Published Reasons:** Needing to write defensible reasons forces honesty. A reason citing "incommensurable values leading us to prioritize X" based on a minuted commitment is defensible; one vaguely gesturing at incomparability without a clear positive choice is suspect.
          *   **Review of Minutes:** Board or external review can look for consistency *in the reasoning process* (diagnoses, commitments) even if outcomes vary. Frequent, unexplained shifts in diagnosis for similar conflicts signal potential misuse.
      *   **Detection:** Look for inconsistency in *diagnoses applied to similar value conflicts* across quarters without minuted reasons (evidence change, strategic shift). Look for diagnoses that contradict SO's evidence assessment. Look for fatigue-driven recourse to lottery without **P** diagnosis + secondary checks.
  3.  **Where the Procedure Stops and the Person Answers:**
      *   **Value Commitments:** The core moment is resolving **I (Incomparability)** or making **Commitments** under **M, E, P**. Here, the committee (guided by the Chair) *chooses* which value/aim to prioritize. This is not determined by facts or logic alone; it's an act of collective will setting their priorities. *The committee, through its recorded commitment, answers for this.*
      *   **Tragic Conflict Acknowledgment:** Acknowledging a conflict and expressing regret is a human response minuted by the Chair, owned by the committee.
      *   **Breaking Deadlocks:** The Chair's role in proposing shortlists/voting, especially casting a deciding vote, is a moment of personal responsibility. *The Chair must explicitly state their value basis for this choice on the record.*

  This procedure provides a rigorous, deliberative framework for grappling with incommensurability within your constraints. It makes value conflicts explicit, structures the response, provides defensible reasons, manages precedent, and minimizes arbitrariness while acknowledging that hard choices require judgment and commitment. It shifts the focus from impossible quantification to structured value deliberation and explicit prioritization.
