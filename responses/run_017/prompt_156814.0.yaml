answer: |-
  ### Private Analysis: Candidate Dynamical Counterparts & Rejections  
  *(Executed prior to translation; rejects based on technical mismatch)*  

  **Claim (1) - Overdetermination ("broad outcome inevitable")**  
  - *Candidate:* Structural stability (robustness to parameter changes).  
    - *Rejected:* Claim is about *outcome determinism under current dynamics*, not robustness to altered dynamics.  
  - *Candidate:* Large basin of attraction.  
    - *Rejected:* Basin size alone doesn't address "many independent pressures."  
  - *Candidate:* High measure of initial conditions leading to coarse-grained outcome.  
    - *Kept:* Best fit; "pressures" imply parameters fixing the attractor geometry.  
  - *Candidate:* Ergodicity (time averages ≈ ensemble averages).  
    - *Rejected:* Irrelevant; claim is about determinism, not statistical regularity.  

  **Claim (2) - Knife-edge ("one small event changes everything")**  
  - *Candidate:* High Lyapunov exponent (sensitive dependence).  
    - *Rejected:* Only explains short-term divergence; doesn't imply large *asymptotic* changes.  
  - *Candidate:* Bifurcation point (structural instability).  
    - *Rejected:* Claim describes an *event* (local perturbation), not parameter drift.  
  - *Candidate:* Low fragility (small perturbation → large change).  
    - *Kept:* Partial fit, but conflates perturbation size with outcome variance.  
  - *Candidate:* Exit from basin of attraction.  
    - *Kept:* Best for "whole sequence comes out differently" if implying new attractor.  
  - **Verdict:** Equivocal between high sensitivity (fixed dynamics) and basin escape (dynamics change).  

  **Claim (3) - Path ("robust endpoint, contingent route")**  
  - *Candidate:* Transient chaos vs. asymptotic stability.  
    - *Kept:* Core fit; "route" = transient, "endpoint" = attractor.  
  - *Candidate:* Shadowing (true trajectory approximated by noisy one).  
    - *Rejected:* Describes stability of *paths*, not endpoint robustness.  
  - *Candidate:* Coarse-graining dependence.  
    - *Kept:* Essential; "endpoint robustness" requires choice of observable.  

  ---

  ### Part A: Translation into Dynamical Vocabulary  

  **Claim (1): Overdetermination → High Measure Basin**  
  - *Translation:* Under fixed system parameters, the basin of attraction for the coarse-grained outcome has measure ≈1. Independent "pressures" are parameters fixing the attractor location/basin geometry. Small perturbations (e.g., decision-maker’s choice) alter the microstate but leave the asymptotic macro-outcome unchanged with probability 1.  
  - *Terms Used:* Basin of attraction, measure, coarse-graining, parameters vs. initial conditions, asymptotic behavior.  
  - *Equivocality:* None; this is purely about initial-condition sensitivity within a fixed regime.  

  **Claim (2): Knife-edge → Fragility + Basin Escape**  
  - *Translation (Equivocal!):*  
    - *Option A (Sensitivity):* The event is a small perturbation at \( t_0 \) with large finite-time growth (high local Lyapunov exponent), causing divergence at \( T \) beyond the coarse-graining scale.  
    - *Option B (Regime Change):* The event alters system parameters/structure, moving the state into a new basin of attraction or triggering a bifurcation. "Whole sequence comes out differently" implies asymptotic divergence.  
  - *Terms Used:* Fragility, Lyapunov exponent, bifurcation, basin of attraction, coarse-graining.  
  - *Distortion:* Historians’ "small event" language conflates perturbation size (Option A) and critical transition (Option B). We *must* disambiguate.  

  **Claim (3): Path → Transient Dynamics vs. Asymptotic Attractor**  
  - *Translation:* The system converges to a stable attractor (robust endpoint), but transient trajectories exhibit high ensemble spread and sensitive dependence. Contingency arises from variability in transient paths under fixed coarse-grained endpoints.  
  - *Terms Used:* Attractor, transient vs. asymptotic, ensemble spread, coarse-graining.  
  - *Equivocality:* None; "route" explicitly maps to transient dynamics.  

  ---

  ### Part B: Key Distinctions & Applications  

  **1. Fragility vs. Leverage**  
  - *Fragility:* Minimum perturbation size \( \delta x_0 \) to alter outcome at \( T \).  
  - *Leverage:* Fraction of outcome variance explained by perturbing variable \( X \) (via ensemble sensitivity analysis).  
  - *How They Diverge:*  
    - *High fragility, low leverage:* Tiny \( \delta x_0 \) changes microstate, but coarse-grained outcome distribution is unaffected (e.g., chaotic oscillator phase shift).  
    - *Low fragility, high leverage:* Large \( \delta x \) needed to alter outcome, but when altered, \( X \) dominates variance (e.g., parameter change crossing bifurcation).  
  - *Mapping to Claims:*  
    - Claim (1) implies *low leverage* of decision-makers (variance explained ≈0).  
    - Claim (2) *conflates fragility and leverage*. "Small event" suggests high fragility, but "changes everything" requires high leverage.  
    - Claim (3) leverages fragility in transients, not leverage over asymptotics.  
  - *Historian Conflation:* Yes, "small causes" often blur high fragility (easy to alter microstate) with high leverage (causally pivotal).  

  **2. Perturbation vs. Regime Change**  
  - *Perturbation:* \( \delta x \) in initial conditions; state moves under same vector field.  
  - *Regime Change:* Alteration of parameters/structure; vector field itself changes (e.g., bifurcation).  
  - *Mapping to Claims:*  
    - Claim (1) requires fixed regime (parameters define "pressures").  
    - Claim (2) *often misdescribed*: If "whole sequence changes," it likely implies regime change (e.g., basin escape), but historians frame it as a perturbation.  
    - Claim (3) assumes fixed regime (same attractor).  
  - **The Lost Nail Proverb:**  
    - *Agree:* Not sensitive dependence. It’s a chain of *counterfactual necessity*: each link is a necessary condition under fixed dynamics.  
    - *Why It Matters:* Historians use such chains for "contingency" (avoidance was possible), but dynamical contingency (sensitivity) ≠ logical contingency (non-necessity).  

  ---

  ### Part C: Residue Report  

  **(i) n=1 Problem (Measure without Ensemble)**  
  - *Verdict:* Confirmed. Claims about "typicality" (e.g., Claim 1’s "inevitability") require a measure over possible histories. Historians implicitly use a plausibility measure (based on laws/social forces), but this is interpretive, not empirical. Untranslatable without modeller stipulation.  

  **(ii) Time-Asymmetry**  
  - *Verdict:* Confirmed. Dynamics formalism treats \( t \rightarrow \infty \) (attractors) symmetrically, but historians care about *why this happened* retrodictively. E.g., Claim (3)’s "route" matters because agents experienced it, not just because transients exist. Formalism cannot encode narrative directionality.  

  **(iii) Normative/Interpretive Work**  
  - *Verdict:* Confirmed + Framework Blindness. Contingency claims:  
    - *Empirical:* Outcome sensitivity to perturbations (captured).  
    - *Normative:* Alternatives were "live options" for agents (uncaptured).  
    - Your framework sees state-space geometry, not agency. The "liveness" of alternatives is phenomenological, not dynamical.  

  **(iv) Coarse-Graining as Interpretive Act**  
  - *Verdict:* Confirmed. Claims (1) and (3) conflict only if "outcome" means the same observable. Historians might:  
    - Call "French Revolution" robust (Claim 1: coarse-grained to regime change).  
    - Call "Terror of 1793" contingent (Claim 3: finer-grained event).  
    - Translation *reveals* this equivocation but cannot resolve it.  

  ---

  ### Part D: Verdict  

  1. **Claim (1) - Overdetermination:**  
     - *Truth:* Precise under fixed dynamics. True if basin measure ≈1 for chosen coarse-graining.  
     - *Empirical?* Yes, in principle: simulate ensemble under parameterized "pressures."  
     - *Distortion:* "Pressures" → parameters; assumes dynamics are fixed.  

  2. **Claim (2) - Knife-edge:**  
     - *Truth:* Imprecise or false. If purely perturbation (Option A), high fragility rarely implies high leverage over asymptotics. If regime change (Option B), it’s not "small."  
     - *Empirical?* Option B is testable (e.g., bifurcation detection); Option A often overstates.  
     - *Distortion:* Misrepresents regime changes as perturbations.  

  3. **Claim (3) - Path:**  
     - *Truth:* Robust if attractor exists and transients are chaotic.  
     - *Empirical?* Partly (e.g., Lyapunov exponents of transients), but coarse-graining choice is interpretive.  
     - *Distortion:* None; maps cleanly to transient/asymmetric dynamics.  

  **Contingency’s Multiple Jobs:**  
  - Your framework *exposes* conflations:  
    - Dynamical sensitivity (fragility) ≠ causal leverage ≠ logical contingency.  
  - The "defect" is not in your formalism but in historiography’s underspecification. Contingency does triple duty:  
    1. *Sensitivity to initial conditions* (dynamical, your domain).  
    2. *Avoidability* (counterfactual, requires normative thresholds).  
    3. *Agency* (phenomenological, outside state-space).  
  - **Conclusion:** Your vocabulary cannot express normative/historical "liveness," but this isn’t a flaw—it clarifies that such work isn’t about evolution *per se*, but its human interpretation.  

  ---  
