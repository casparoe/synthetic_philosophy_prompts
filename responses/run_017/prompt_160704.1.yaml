answer: |-
  Here’s a structured plan for the dialogue, prioritizing clarity for a non-specialist reader while isolating *upamāna*'s unique role. The gavaya case is ideal, but needs slight tightening.

  **Core Structure (Dialogue Flow):**

  1.  **Establish the Stakes & Define *Pramāṇa* (Crucial Foundation - ~1/4 page):**
      *   **Pandit:** Opens by anchoring the debate: "Honored guest, we agree *pramāṇa*s are the *only* trustworthy paths to *new* knowledge (*pramā*), yes? Not mere opinion, not error, not memory of the old. Each *pramāṇa* is a unique gateway to a specific kind of fresh understanding." (Emphasizes *new*, *reliable*, *distinct*).
      *   **Buddhist:** Assents, reaffirming the accepted three: direct perception (eyes, ears), inference (smoke->fire), reliable testimony (trusted speaker). "Indeed. These three exhaust the ways we *learn* something truly new."
      *   **Pandit:** "Then let us test a case where new knowledge arises, yet seems to walk through none of these three doors." (Sets up the challenge).

  2.  **Present the Gavaya Case (Focused & Constrained - ~1/3 page):**
      *   **Pandit:** Narrates concisely: *"Years ago, a trusted forester told me, 'A gavaya in the deep forest looks like a cow.' I had never seen one. Yesterday, walking near the forest edge, I saw an animal partly hidden in thick brush. I saw curved horns like a cow's, a similar humped shoulder, a hide like a cow's – but the shape was larger, wilder. Not fully seen, yet immediately I knew: 'This is that gavaya the forester described!'"*
      *   **Pandit's Key Question:** *"How did this new knowledge – 'This animal before me is a gavaya' – arise in that moment?"* (Focuses on the *recognition event*, not the prior description).

  3.  **Systematically Eliminate the Accepted *Pramāṇa*s (The Heart - ~1/2 page):**
      *   **a) Perception?** Buddhist likely suggests this first. Pandit counters: *"My eyes saw only *parts*: horns, shoulder, hide. I did not perceive the *whole* gavaya form clearly enough to identify it solely by sight. Nor did I perceive the *name* 'gavaya' etched upon it. Sight gave me fragments, not the identification."* (Rules out pure perception).
      *   **b) Testimony?** Pandit pre-empts/responds: *"The forester's words were years past, and he wasn't there yesterday. His testimony gave me the *concept* 'gavaya resembles cow,' but not the knowledge *'This* animal *is* a gavaya' about the beast before me now. His words were recalled, but did not *cause* this specific recognition."* (Rules out testimony *in the moment*; addresses memory concession by separating stored concept from present application).
      *   **c) Inference?** This is the main opponent & reader misconception (#2). Buddhist will argue: *"You inferred! 'It looks like a cow, and the forester said gavayas look like cows, so this must be a gavaya.'"*
          *   **Pandit's Decisive Refutation:** *"Ah, but did I *reason* like that? Did I consciously think: 'All cow-like forest beasts are gavayas? This is cow-like? Therefore...'? No! The knowledge flashed *immediately* upon seeing those features in that context. There was no step-by-step deduction. The resemblance itself – seeing those cow-like traits *as* resembling the cow *while knowing* the description – directly triggered the identification. Inference needs a universal rule ('All X are Y'), but here I had only one example: the forester's words. I didn't *infer* the resemblance; I *saw* it and it *conveyed* the identity."* (Highlights immediacy, lack of conscious reasoning steps, and the role of resemblance *as* the vehicle, not the premise).

  4.  **Define *Upamāna* & Distinguish from Misconceptions (~1/4 page):**
      *   **Pandit:** *"This immediate knowledge-from-recognized-resemblance is its own path. We call it *upamāna*. It is not loose analogy (#1 – 'life is like a river'), which is often inference or poetic fancy. It is not inference (#2), as we saw – no universal rule, no steps. And crucially, it was not *just* learning the word's meaning (#3) yesterday – I learned the *meaning* years ago. Yesterday, I gained new knowledge *about the world*: that *this specific animal* is the thing called 'gavaya'."* (Positively defines *upamāna* by contrasting it with the refuted options and the misconceptions).
      *   **Pandit's Summary:** *"Perception gave me shapes and colors. Memory recalled the cow and the description. But the spark of *new* knowledge – connecting this partial sight *to* the concept via resemblance – came by comparison alone. It fits no other door."*

  5.  **Landing the Idea & Setting Boundaries (Close - ~1/8 page):**
      *   **Reader Demonstration (How it Lands):** The Pandit turns slightly towards the 'reader' (or a silent observer in the scene): *"Consider: you've never tasted a *mango*, but I tell you it's like a sweet peach but more fibrous. Years later, you see a yellow-green fruit with a large stone. You taste sweetness and fibre. Would you need to *infer* step-by-step it's a mango? Or would the resemblance itself, sparked by the old words, tell you 'This *is* that mango!'? That flash *is* *upamāna*."* (Uses a relatable, immediate analogy – fruit – to cement understanding).
      *   **Pandit's Boundary Setting:** To the Buddhist's potential deeper challenge: *"We need not delve now into pervasion (*vyāpti*), formal syllogisms, or the full list of categories (*padārthas*). The point stands: in that moment by the forest, a fourth way to knowledge revealed itself. Deny it, and you leave a genuine knowing unexplained."* (Declines entanglement in deeper Nyāya machinery).

  **Key Adjustments to Your Gavaya Case & Why:**

  1.  **"Years later" & "No speaker present":** Essential. Removes testimony *in the moment*.
  2.  **"Partly hidden in brush":** Perfect. Prevents pure perception from being sufficient. You *need* incomplete perception.
  3.  **"Resemblance only partly seen":** Crucial. You don't see the *entire* resemblance clearly. You see *enough* key points (horns, hump, hide) to trigger the recognition *via* the resemblance described. This prevents perception from doing the whole job.
  4.  **Memory Concession Bite & Route-Around:** The opponent will pounce: *"But you *remembered* the cow and the words! Isn't *that* the source?"*
      *   **Pandit's Response:** *"Memory provided the *known* elements: what a cow looks like, what was said. But it did *not* provide the *new* knowledge: that *this* specific animal present *is* a gavaya. That new knowledge was born *in that moment* from the *act* of comparing the partly seen features to the remembered cow *in light of* the remembered description. Memory supplied the tools; *upamāna* was the workman using them to build new understanding."* (Memory is a necessary *condition*, not the *pramāṇa* itself. The *pramāṇa* is the cognitive act of comparison yielding new identification).
  5.  **Why this version works:** It perfectly isolates *upamāna* by ensuring:
      *   Perception is insufficient (partial view).
      *   Testimony is temporally disconnected (years prior).
      *   Inference lacks a conscious syllogistic structure and a known universal premise ("All cow-like forest beasts are gavayas" – the pandit only has one data point). The knowledge is immediate and recognitional.
      *   The knowledge is about the present object, not just the word meaning.

  **Misconception Order & Handling:**

  1.  **Collapse into Inference (#2):** Will arise *immediately* after eliminating perception and testimony. It's the most natural alternative for the opponent and the philosophically inclined reader. **Handled:** Directly and thoroughly during the refutation of inference (Step 3c).
  2.  **Merely Word Meaning (#3):** Likely arises as a counter after inference is refuted. *"So you just learned what 'gavaya' means!"*. **Handled:** Explicitly during the positive definition (Step 4), contrasting the past learning of meaning with the present knowledge of object identity.
  3.  **Loose Analogy (#1):** Might be a lingering doubt or a dismissive comment earlier. **Handled:** Briefly during positive definition (Step 4) by contrasting *upamāna* as a knowledge-source with poetic analogy.

  **Reader Takeaway & Boundaries:**

  *   **Demonstrates Understanding:** Successfully applying the *upamāna* concept to a *novel*, relatable example (like the mango/peach) shows the reader grasps it as a cognitive tool.
  *   **Pandit Declines:** Explicitly avoids: *Vyāpti* (pervasion/the universal rule in inference), the *five-membered syllogism* (formal Nyāya logic structure), the full list of *padārthas* (Nyāya ontological categories), and potentially deep debates about the exact ontological status of the resemblance (*sādṛśya*). The focus is solely on establishing *upamāna* as a distinct *functional* knowledge-source in a clear, experiential case. The Pandit wins by keeping it concrete and experiential.

  This plan provides the logical scaffolding for your scene, ensuring the core concept is isolated, defended against key objections, and made accessible, while respecting your constraints and the nuances of the philosophical position.
