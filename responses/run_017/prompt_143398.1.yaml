prompt: |-
  You're a philosopher of biology who's genuinely read the whole adaptationism-wars literature. Take this seriously and think carefully — before you rule on anything, lay out what questions are actually at issue.

  Two people in my dept got into it after a journal club on Gould and Lewontin's 1979 spandrels paper, and I was the only one who didn't jump in (partly cause I dont know the literature well enough to referee). So I'm handing it to you.

  Ines: The critique is out of date. In 1979 you couldn't detect selection, so people told stories. Now we have genome-wide selection scans, comparative methods, experimental evolution — you can measure whether a trait is under selection. "Just-so story" was a fair charge then and isn't one now.

  Ravi: That changes the subject. Their target was never "is there selection somewhere near this trait" — it was the move from "this trait exists and is useful" to "it exists because it was useful." A selection scan doesn't validate that inference about this trait and this form.

  Ravi then drew three questions on the board: (1) origin — did the trait spread because of the effect it has now? (2) maintenance — is it being held in place by selection for that effect now? (3) shape — how much of the trait's detailed structure is accounted for by the function? He said the spandrel argument is really about (1) and (3), and that adaptationists answer with evidence for (2), which is a different claim.

  Ines: Only (2) is scientifically tractable. (1) is unreachable history, and (3) is unfalsifiable since any leftover detail can always be given an adaptive story later. Besides, (1) versus (2) is already in the literature — that's just the exaptation distinction, non-adaptive origin plus later co-opted utility. So your three questions collapse into ones we already handle.

  Ravi: They don't, because (3) is where the actual explanatory weight sits and nobody ever tests it. "It's for X" gets presented as an account of the form, but what gets measured is that removing it lowers fitness. Plenty of features are maintained without having been shaped for their role: the human chin, the four-ness and exact geometry of the San Marco spandrels.

  Ines: Those are cases where the feature is a necessary consequence of something else, and that's a real, testable claim about developmental coupling and correlated evolution. Find the coupling and you've got a result, not a conversation stopper.

  Ravi: It's only testable once you've decided which trait is the real target of selection, and that's the circularity. You need the architectural facts before you can tell design from leftovers, and in biology you get the architectural facts by first assuming some traits are adaptations.

  Then they each accused the other of running an unfalsifiable dustbin category — hers is "constraint," his is "adaptive story not yet found" — and I slipped out.

  Please adjudicate move by move: for each claim above say whether it's basically right, basically wrong, or half-right and why. Then say what both of them are missing. And be explicit about which points are settled among people who actually work on this and which are still live disputes — I don't want a contested position dressed up as consensus. No citations needed.
reasoning: |-
  Okay, the user wants me to act as a philosopher of biology to adjudicate a debate between Ines and Ravi about adaptationism. This stems from a journal club discussion on Gould and Lewontin's spandrels paper. I need to carefully evaluate each of their claims step by step, determine what's right or wrong, identify what both are missing, and clarify which points are settled versus still debated in the field.

  Looking at Ines's first claim: She argues that modern genomic tools solve the "just-so story" problem because we can now detect selection. This is partially right - we can indeed detect signatures of selection better than in 1979. But she's wrong to imply this resolves all adaptationist issues. Selection scans often only show that selection occurred in a genomic region, not that it specifically shaped a particular trait. The detection methods have limitations in resolution and can't always distinguish between different types of selection. So while technology has advanced, the fundamental inference challenges remain.

  Ravi counters by arguing that detecting selection near a trait doesn't validate the inference that the trait exists because of its current function. He makes an important distinction between three questions: origin, maintenance, and shape. His framing here is actually quite insightful. He correctly identifies that selection detection methods typically address maintenance (question 2) but not necessarily origin (question 1) or shape (question 3). This distinction is crucial and shows he understands the core philosophical issue.

  Ines responds that only maintenance is scientifically tractable, calling origin "unreachable history" and shape "unfalsifiable." She also collapses the questions into the exaptation distinction. She's right that maintenance is more directly testable, but wrong to dismiss the other questions entirely. Origin can sometimes be reconstructed through comparative methods, and shape can be investigated through developmental biology and quantitative genetics. Her claim that question 3 is unfalsifiable isn't entirely accurate - we can test hypotheses about form-function relationships experimentally. Also, while exaptation covers some aspects, it doesn't fully address the shape question.

  Ravi then emphasizes that the explanatory weight lies in question 3 (shape), which he argues is rarely tested. He gives examples like the human chin and spandrels. His point about adaptationist explanations often assuming form follows function without evidence is valid. However, he overlooks that methods do exist to study form-function relationships, like biomechanical modeling or artificial selection experiments.

  Ines counters that developmental coupling is testable. She's correct here - we can empirically study how traits are developmentally linked. But Ravi points out a circularity issue: we need to know architectural constraints before determining what's an adaptation. This touches on a real methodological challenge in evolutionary biology - the interdependence between identifying adaptations and understanding constraints.

  Both accuse each other of having unfalsifiable categories: "constraint" versus "adaptive story not yet found." Ironically, they're both somewhat right here - both positions can become unfalsifiable if used as default explanations without evidence. This highlights a deeper issue in the field about how we avoid non-empirical just-so stories on either side.

  What both are missing: Ines underestimates how detecting selection doesn't automatically explain trait form or evolutionary history. Ravi underestimates the empirical progress in studying constraints and developmental pathways. Both fail to appreciate that the adaptationism debate is ultimately about explanatory frameworks and how we weight different evolutionary factors, not just about what we can detect technically.

  On settled points: We all agree that selection is a major evolutionary force and that constraints exist. The exaptation concept is well-established. Comparative methods can sometimes reconstruct evolutionary sequences. What remains contested is how much explanatory weight to give adaptation versus constraints for any given trait, and how to methodologically separate these factors in practice.

  The core philosophical issue remains unresolved: How do we justify inferences about evolutionary causes from present-day evidence? This isn't just a technical limitation but an epistemological challenge inherent in historical sciences.
answer: |-
  Let's adjudicate this move-by-move, distinguishing settled points from live disputes. I'll be ruthlessly explicit about consensus vs. contention.

  ### Adjudication of Claims
  1. **Ines (Modern tools solve the "just-so story" problem):**  
     - **Half-right.**  
     - *Why:* Genome scans (e.g., PBS, F<sub>ST</sub>) detect *signatures of selection* in genomic regions, but they **do not** directly validate that a *specific trait's form* exists *because* of its current function. They often identify selection on linked sites or regulatory elements, not the trait itself. Comparative/experimental methods test *current* fitness effects (maintenance) or *capacity* for adaptation, not historical origin. **Settled:** Modern tools reduce but **do not eliminate** the risk of just-so stories.  
     - **Live dispute:** Whether selection scans sufficiently constrain adaptive hypotheses for complex traits.

  2. **Ravi (Selection scans change the subject):**  
     - **Basically right.**  
     - *Why:* Gould & Lewontin's core target was the *inferential leap* from "trait is useful" to "trait was shaped by selection *for that utility*." Detecting selection nearby answers "Is selection operating?" but not "Did selection *sculpt this trait's form* for its current role?" **Settled:** This distinction (selection vs. adaptation) is philosophically robust and remains relevant.  
     - **Live dispute:** How often this leap occurs in modern literature; whether tools like CRISPR fitness assays mitigate it.

  3. **Ravi's Three Questions (Origin/Maintenance/Shape):**  
     - **Fundamentally correct framing.**  
     - *Why:* These are distinct evolutionary problems. (1) *Origin* requires historical inference (often intractable). (2) *Maintenance* is testable via fitness assays. (3) *Shape* asks why the trait has *specific form* (e.g., giraffe neck *length*, not just neck function). **Settled:** These are non-reducible questions.  
     - **Live dispute:** Whether (3) is tractable (see below).

  4. **Ines (Only maintenance is tractable; origin/shape collapse into exaptation):**  
     - **Half-right on tractability, wrong on collapse.**  
     - *Why:* (2) *is* more directly testable, but (1) *can* be addressed via phylogenetics/paleontology (e.g., cetacean limb loss). (3) *Shape* **does not** collapse into exaptation: Exaptation (non-adaptive origin + later utility) addresses *origin* of function, not *why the trait has precise form* (e.g., why bird feathers have *specific branching* even if co-opted for flight). **Settled:** Exaptation ≠ explanation of form.  
     - **Live dispute:** Whether quantitative genetics (e.g., G-matrices) or evo-devo can rigorously test "shape" hypotheses.

  5. **Ravi (Shape carries explanatory weight; examples like human chin):**  
     - **Basically right.**  
     - *Why:* Adaptive hypotheses often imply selection *sculpted the details* (e.g., "the chin evolved for speech"). Yet we can show chins are developmental byproducts of jaw reduction, maintained by selection *on jaw function*. **Settled:** Many traits are maintained but not shaped for current roles (e.g., tetrapod digits in whales).  
     - **Live dispute:** Whether "shape" explanations are testable (e.g., via perturbation experiments).

  6. **Ines (Developmental coupling is testable):**  
     - **Correct.**  
     - *Why:* Evo-devo provides methods to test constraints (e.g., CRISPR to disrupt integration, comparative embryology). **Settled:** Constraints *are* empirical hypotheses.  
     - **Live dispute:** Whether "constraint" is overused as a default explanation.

  7. **Ravi (Circularity in identifying "targets" of selection):**  
     - **Half-right.**  
     - *Why:* Circularity *can* arise if we assume a trait is adaptive *then* infer its "function." But modern methods break this: (a) Fitness assays test *effects* without assuming adaptation (e.g., gene knockout), (b) Correlated evolution tests developmental links independently. **Settled:** Circularity is avoidable with rigorous methods.  
     - **Live dispute:** How often circular reasoning persists in practice.

  8. **Mutual accusations of unfalsifiability:**  
     - **Both half-right.**  
     - *Why:* "Constraint" *can* be a dustbin if used without evidence (e.g., "it must be constrained"). Conversely, "adaptive story not found" *can* be unfalsifiable if proponents insist all traits *must* be adaptive. **Settled:** Both positions *can* be formulated testably.  
     - **Live dispute:** Whether methodological norms in evolutionary biology sufficiently enforce testability.

  ---

  ### What Both Are Missing
  1. **Ines:** Underestimates the **explanatory gap** between detecting selection and explaining trait form. A selection scan on a gene region doesn't reveal *why* a trait has its precise morphology (e.g., why mammalian kidneys have *exactly* 300K nephrons, not 200K). Modern tools answer "Is selection acting?" but not "How much did selection *sculpt* this?"  
     
  2. **Ravi:** Underestimates **empirical progress on constraints**. We *can* now test developmental coupling (e.g., via pleiotropy maps) and quantify non-adaptive form (e.g., neutral evolution in protein structures). "Spandrels" aren't conversation-stoppers but hypotheses to test.

  ---

  ### Core Live Disputes (Unsettled)
  1. **Tractability of "shape":** Can we rigorously test *how much* of a trait's form was shaped by selection vs. constraints? (e.g., using models like Lande's adaptive landscape).  
  2. **Burden of proof:** Must we *assume* adaptation unless proven otherwise, or vice versa?  
  3. **Explanatory priorities:** Should evolutionary biology focus on (2) (maintenance) as the only tractable question, or pursue (1)/(3) with indirect methods?  

  **Consensus:** The spandrels critique is **not** outdated. It forces rigor in linking function to form—a problem modern tools alleviate but **do not** resolve. The debate is now more empirical but equally philosophical.
