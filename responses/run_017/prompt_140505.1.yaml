prompt: |-
  I've spent the last four years being told my symptoms were anxiety, and this spring it finally turned out to be something with a name and a treatment. Since then I've been volunteering as a patient advocate at the same clinic system, sitting in on other people's appointments, and I keep noticing the same thing from the other side of the room: whose report gets taken seriously. I've started trying to write down what I actually think about the cases I see, and I can't get the verdicts to line up with any one principle.

  My friend who reads philosophy says the literature calls this 'testimonial injustice' — I think the philosopher's name is Fricker? — and that the core case is a credibility deficit caused by identity prejudice. That fits my first case perfectly: ER doc takes one look at my chart, sees a young woman with an anxiety flag and a pain-med note, decides I'm drug-seeking, sends me home. Clear injustice, nothing to argue about.

  But here are the rest, going by gut:

  A new PCP of mine quietly lowered the weight she gave my symptom report for exactly the same kind of reason, and she happened to be right — I was fine, nothing was wrong, and I never found out at the time that she'd discounted me. Nothing bad happened to me and her judgment was roughly accurate. I still want to say something bad happened. But I can't say what, if the harm is supposed to be that you get worse care.

  A specialist at the clinic discounts anyone who walks in with printed-out research, hypochondriac rule, applies it to a confident white guy in a suit exactly the same way. Obnoxious, lazy, bad medicine. I don't want to call it an injustice in the sense I care about.

  An intake nurse at our clinic has been burned over and over by people referred from one particular recovery program, and she now discounts everyone coming from that program. Her base rate is real, I've seen the numbers. Most of the people in that program are recent immigrants. I feel like there's something wrong here — more wrong than the printed-research guy, who at least has worse evidence for his rule — but I also don't want to tell her to ignore genuine evidence.

  An attending believed a polished, well-dressed man's self-diagnosis over a clear lab result, because the man was polished and well-dressed. The man got the wrong treatment and got hurt. Same mechanism as my ER case, credibility being driven by identity markers instead of evidence, but running the other direction, and I definitely can't say the guy was wronged.

  My husband answered for me at appointments for two years and not one doctor ever asked me a question directly. No credibility judgment about me was ever made, so it's not a deficit at all, and yet I felt erased in a way that feels like it belongs in this same pile.

  And then me: I catch myself tuning out a patient who talks like my ex. That's a failure of some kind, but calling it an injustice seems way too grand for something that private.

  My rough principle was: a credibility judgment is unjust when it's caused by something other than the speaker's actual reliability. Which I can already see breaks in both directions — it says the intake nurse is fine even though she doesn't feel fine, it says my-ex-thing is an injustice even though it doesn't feel like one, and it has literally nothing to say about the never-asked case, or about whether the over-credulous attending is doing the same kind of thing at all.

  So: can you give me a principle, or two or three candidate principles, stated precisely enough that I could apply them in a room, and tell me which of my cases motivates each clause? I want you to be honest about which of my verdicts a given principle can't accomodate and which one you'd overturn, and I'd rather have one principle that costs me a verdict than a baroque one that saves all seven. Also please give me its verdicts on the cases I haven't decided.

  The one I keep going back and forth on: the hospital just started routing symptom write-ups through an AI triage tool, and it scores them lower when they're written in a nonstandard dialect or when the chart has ever said the patient was 'noncompliant'. Nobody at the hospital is prejudiced, there's no hearer making a judgment, and I can't tell whether there's an injustice here at all, or who it would happen to, or whether my principle needs a clause about institutions or systems to even see it.

  Two more I haven't made up my mind about: a seminar leader who calls on the men for the hard questions and the women for the summary questions, without ever saying anything about anyone's reliability; and a 911 dispatcher who's noticeably brusquer with accented callers but still sends exactly the right units every time.

  If the principle says anything about what I should actually do differently when I'm sitting in a room as an advocate, say that too. Please don't point me at papers or a reading list, I just want the argument. And American English please, I'm in Ohio.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've shared several personal experiences and cases where credibility assessments in medical settings led to different outcomes. They want a clear principle to determine when these judgments are unjust. But digging deeper, it seems they're grappling with the nuances of testimonial injustice beyond Fricker's original definition. 

  Hmm, the user's examples show that harm isn't always immediate or visible—like when their PCP discounted symptoms but happened to be right. They still felt something was wrong, which suggests the harm might be about the violation of being heard, not just physical outcomes. Then there's the nurse using a valid base rate but potentially discriminating against immigrants. The user is torn between statistical evidence and fairness.

  I notice they're also considering systemic issues, like the AI triage tool that penalizes nonstandard dialects. No prejudiced individual, but the outcome might still be unjust. The seminar leader and 911 dispatcher cases add layers—bias without explicit credibility judgments. The user needs a principle that covers both interpersonal and structural scenarios.

  What's at stake here? They’re a patient advocate. They need actionable guidance to intervene in real-time. Their frustration with philosophical literature suggests they want practical clarity, not theory. They value precision over saving all their initial judgments—they’d rather sacrifice a verdict than have a messy principle.

  Key challenges: 
  - Harm vs. intent: When does discounting someone’s voice become unjust even if no physical harm occurs?
  - Statistical discrimination: How to handle cases where stereotypes have a factual basis but perpetuate inequality?
  - Structural bias: Can injustice exist without a human prejudiced hearer?
  - Non-credibility cases: Like being ignored in favor of a spouse—erasure without direct credibility assessment.

  I should craft principles that address these dimensions. The "epistemic agency" angle seems promising—focusing on whether the hearer is engaging with the speaker as a knower. That covers the PCP case (violation despite no harm) and the spouse case (erasure as agency denial). 

  For the nurse’s base rate, the principle must differentiate between using statistics contingently (updating with individual evidence) vs. rigidly (ignoring counter-evidence). The latter undermines agency.

  The AI case is tricky. If the system systematically devalues certain voices without human intent, it’s still a structural epistemic injustice—the harm is distributive. The seminar leader’s gendered calling pattern might create a credibility environment, even if no single judgment occurs.

  For actionability: The user, as an advocate, could intervene by redirecting questions to the patient (spouse case), challenging blanket rules (printed-research guy), or auditing the AI’s scoring criteria.

  I’ll test each principle against their cases ruthlessly. If it clashes with their gut feeling (e.g., the ex-boyfriend bias being "too private" for injustice), I’ll note it but explain why agency violation still applies. The goal is coherence, not comfort.
answer: |-
  Here's a precise, actionable principle designed around **epistemic agency** – the right to be treated as a source of knowledge about your own experience. It prioritizes clarity over saving every intuitive verdict:

  ### Core Principle
  **A credibility judgment is unjust if it denies, diminishes, or bypasses a speaker's epistemic agency based on features irrelevant to their actual capacity to reliably report their experience in that context.**

  #### Key Components Defined
  1.  **Epistemic Agency:** The patient's capacity to perceive, interpret, and report their own bodily/mental states and experiences. (The core thing being judged).
  2.  **Denies/Diminishes/Bypasses:** Actively disbelieving, downplaying significance, failing to engage, or routing communication around the patient.
  3.  **Features Irrelevant to Reliable Reporting:** Characteristics (identity, presentation, history, associations) that *do not demonstrably impair* the patient's ability to accurately report *their specific symptoms/experience* in *this specific moment*.
  4.  **Actual Capacity:** Assessed based on the patient's coherence, consistency (internal & with evidence), and effort to communicate clearly *during the interaction*, not past labels or stereotypes.

  ### How it Handles Your Cases (and Why Some Verdicts Shift)

  1.  **ER Case (You, drug-seeking assumption):** **UNJUST.** Denied agency based on identity (young woman) + chart flags (anxiety, pain-med note) irrelevant to *your ability to accurately report your current symptoms*. Harm occurred.
  2.  **Your PCP (Discounted report, you were "fine"):** **UNJUST.** Diminished agency based on identity/chart flags irrelevant to *your ability to report your symptoms*. **Harm:** Violation of epistemic rights & trust, regardless of medical outcome. *Principle overturns your "nothing bad happened" verdict.*
  3.  **Specialist vs. Printed Research Guy:** **UNJUST.** Diminishes agency based on presentation/behavior (bringing printouts) irrelevant to *his ability to accurately report his symptoms/concerns*. Laziness/bad medicine stems from unjust credibility discount. *Fits your gut.*
  4.  **Intake Nurse & Recovery Program:** **POTENTIALLY UNJUST.**
      *   *If she rigidly discounts everyone*: **UNJUST.** Denies agency based solely on association (program referral/immigrant status), irrelevant to *this patient's* reporting capacity. Base rates don't override individual assessment.
      *   *If she uses it as initial caution but actively tests individual reliability:* **NOT UNJUST.** She's assessing *actual capacity* to report reliably *in this interaction*. *Principle clarifies why the rigid rule feels wrong.*
  5.  **Attending Believes Polished Man over Lab:** **UNJUST.** *Over-assigned* agency based on identity/presentation, leading him to discount the *epistemic agency embedded in the lab result* (another form of knowledge). Harm occurred, but the *patient* wasn't denied agency; the *evidence* was. *This is a different failure (epistemic negligence), not testimonial injustice to the patient.* **Principle overturns your "can't say the guy was wronged" re: testimonial injustice.** (He was harmed by bad medicine, but *his* agency was inflated, not denied).
  6.  **Husband Answers, Doctors Ignore You:** **UNJUST.** **Bypassed** agency. No credibility judgment was made *because* your agency was rendered irrelevant. The erasure stems directly from identity prejudice (implicitly denying women's agency as knowers). *Fits your gut, principle explains it.*
  7.  **You Tuning Out (Ex-Boyfriend Voice):** **UNJUST.** Diminishes agency based on an association (voice similarity) irrelevant to *this patient's* actual capacity to report their symptoms. *Principle overturns your "too private/grand" verdict.* It's a micro-injustice violating professional duty.

  ### Verdicts on Your Undecided Cases

  8.  **AI Triage Tool (Scores Down Dialect/Noncompliant):** **UNJUST.** **Systemically diminishes** epistemic agency. Features (dialect, past label) are irrelevant to *the patient's current ability to reliably report symptoms via text*. It automates credibility deficit based on prejudice proxies. *Requires seeing systems as agents of epistemic (in)justice.*
  9.  **Seminar Leader (Men=Hard Qs, Women=Summary):** **UNJUST.** Creates an environment that **systemically diminishes** the epistemic agency of women by implicitly signaling their capacity is limited to synthesis, not complex analysis. It bypasses assessing *individual* capacity based on identity.
  10. **911 Dispatcher (Brusque with Accents, Correct Response):** **NOT UNJUST (on testimonial grounds).** Brusqueness is rude/potentially biased, but **does not demonstrably diminish or bypass agency**. The *credibility of the report* (the core knowledge) was assessed accurately via protocol, leading to the correct action. *This is interpersonal bias, but not testimonial injustice if the core message is believed and acted upon correctly.*

  ### What You Should Do Differently (As an Advocate)

  1.  **Spot Agency Denial/Bypass:** Listen for moments when the patient's voice is ignored, dismissed without engagement ("That's just your anxiety"), or routed to a companion. Watch for body language (turning away from patient).
  2.  **Challenge Irrelevant Discounting:** If a provider dismisses a report based on identity, history, or presentation *without engaging the substance*, intervene: "I hear you noting [patient's characteristic], but could we focus on understanding the specific symptoms [Patient Name] is describing right now?"
  3.  **Surface Unconscious Bypassing:** If providers talk only to a companion: "I'd like to make sure [Patient Name] has a chance to describe this in their own words. [Patient Name], how would you put it?"
  4.  **Flag Rigid Rules:** Challenge blanket policies (like the intake nurse's rule or the specialist's "printouts=hypochondria"): "I understand the pattern you've seen, but could we assess [Patient Name]'s concerns based on what they're telling us today?"
  5.  **Document System Issues:** Note patterns like the AI triage bias or gendered seminar dynamics as *systemic* threats to epistemic agency for reporting.

  ### Why This Principle Works & Costs

  *   **Accommodates:** ER Case, PCP Case (overturning "no harm"), Printed Research Guy, Spouse Bypass, AI, Seminar Leader, Your Ex-Voice Bias (overturning "too private"). Explains *why* the PCP case feels wrong (agency violation) and the bypass case belongs (agency denial).
  *   **Overturns:** Your verdicts on the Polished Man (it *is* a testimonial injustice, but *to the evidence/lab process* more than inflating *his* agency was unjust *to him* in the core sense) and the 911 Dispatcher (rude ≠ testimonial injustice if agency upheld).
  *   **Clarifies:** Intake Nurse - hinges on rigidity vs. individual assessment. AI/Seminar Leader - require systemic view.
  *   **Cost:** It rules the 911 Dispatcher case as "Not Unjust" re: testimonial injustice, even if rude. It forces calling your own tuning-out an injustice.

  **Core Insight:** The injustice isn't *just* about harm or getting facts wrong. It's about violating the fundamental right to be heard *as a knower of your own experience*, based on who you are or how you appear, not your actual capacity to report. Systems can do this as effectively as individuals.
