prompt: |-
  You are a philosopher of science with an active research profile in scientific modeling and in the epistemology of thought experiments, and you also referee regularly for the main journals in the area, so you know what a fellowship committee will find credible and what it will read as hand-waving. Please work in two stages rather than producing a document straight away, and think carefully about the framing before you commit to one.

  Stage one — brainstorming (a short paragraph or a bulleted list, well under a page). Generate five to eight genuinely different ways of cutting the problem below into a question that is at once open and tractable, with one line each on what that framing gains and what it costs, and then say plainly which one you are adopting and why. I want to see that the framing was chosen rather than defaulted into, so do not skip this.

  Now the project.

  Background, and why this is live for me. Until last year I spent six years as a research engineer building and defending large simulation models — idealized systems that stand in for messier real ones, where the standing-in has to be argued for case by case. Since starting doctoral work I have found that I cannot unsee a structural parallel: a great deal of scientific reasoning proceeds from a *surrogate* — an imagined or implemented system that is not the target — and the interesting question in both cases is what licenses the transfer. I have become convinced that the epistemology of thought experiments has been built to fit one surrogate shape and quietly generalizes from it, and that this is why the debate keeps returning to the same impasse about whether intuitions about imaginary cases can be reliable.

  My half-formed idea, which I need you to turn into a proposal. The template most accounts assume is this: you imagine a single concrete case, you register what you take to happen in it, and the epistemic question is whether that judgment is trustworthy or merely a re-description of what you already believed. That fits thought experiments whose imagined scenario is an *arbitrary instance* of the generalization under test. But a large and philosophically celebrated class works differently: the imagined scenario is a boundary point of the theory's space of models, reached by driving a parameter to a limit — frictionless planes, perfectly rigid bodies, infinitely slow reversible processes, a chain draped over a frictionless wedge, an observer traveling alongside a light beam, a being that sorts molecules one at a time, a cat in a sealed box. These vehicles are frequently not even nomologically possible, and they are certainly not representative instances of anything. So for this class the question is not whether my intuition about the scenario is reliable; it is whether the quantity, relation, or concept the thought experiment probes is well behaved at the boundary. And that question looks different in kind: it is a claim about the structure of the target theory — whether the relevant limit exists, whether the idealization is regular or singular, whether the limiting model retains the feature the argument turns on — and theories can differ on it, and it can be checked.

  I want to push this into a stronger and less comfortable thesis than I can currently defend: that when a *limiting-case* thought experiment yields knowledge, the credit belongs to a background structural claim about the theory, the imagination does at most heuristic work, and the historical cases that genuinely surprised people are precisely the ones where the limit is singular — so that the thought experiment is really a probe of whether the theory has a well-defined limiting behavior at all, rather than a window onto what would happen in the imagined situation.

  What I need from you. A two-page proposal (roughly 1,000 to 1,200 words, with section headings) for a one-year dissertation fellowship, containing:

  1. A precise statement of the question, narrowed so that it has a determinate answer and so that a committee can see what would settle it.
  2. Why the existing ways of answering the general question leave this open — specifically, why the standard routes (reconstructing thought experiments as arguments; treating them as appeals to modal intuition; treating them as mental-model or simulation-based reasoning; treating them as model-based reasoning about an imaginary system) each presuppose a vehicle-shape that the limiting-case class does not have.
  3. The method, and why it rather than the obvious alternatives: what I would actually do, month by month across twelve months, including how I would build and validate the taxonomy of cases, and why this is a philosophical project and not an empirical one or a purely historical one.
  4. The range of possible conclusions and which considerations would decide between them — including the unexciting possibility that the class is not unified, and the deflationary possibility that limiting-case thought experiments never transmit warrant and are always rhetorical.
  5. What a successful deliverable looks like, and an honest statement of what would count as the project failing — not merely going unfinished, but coming out in a way that is not worth having written.
  6. A short paragraph on scope risk: what about this project could become unmanageable in a single year, and what you would cut first.
  7. One paragraph, separately headed, on broader significance aimed at a non-philosophy reader: why anyone who reasons from idealized simulations or stylized scenarios should care, which is the box on the form I am least sure how to write.

  Two constraints on how you write it. First, no bibliography and no literature review organized by citation: I will fill in references myself, and I would rather have positions described accurately than have labels guessed at — so describe a position rather than naming its proponents if you are not confident the label is standard, and do not put any historical author's wording in quotation marks. Second, keep the historical cases schematic where you are unsure of details: describe the structure of the case rather than attributing it, and do not lean on any date or title you could not stand behind.
