answer: |-
  ## The Longest Promise

  The minutes lay open on Mary’s kitchen table, the heavy leather-bound volume smelling faintly of dust and damp paper. *1937*. The looping, confident handwriting spoke of foundations poured, covenants signed, land gifted ‘in perpetuity’ for the purpose of a public swimming bath. She traced the words with a finger. Perpetuity. It felt like a stone thrown into a pond whose ripples were supposed to lap forever against the shore.

  Outside, rain streaked the window. Inside, the radiator ticked. Her daughter, Lily, sprawled on the sofa, scrolling. Mary remembered the shock of cold water when her own father had let go in that same lido, decades ago. The gasp, the frantic kicking, then the triumphant, sputtering grin. Last summer, Lily had done the same, her small face bursting with pride under the faded, peeling paint of the changing rooms.

  The committee meeting had been… flat. Not angry, not even particularly sad anymore. Just procedural. Councillor Evans, crisp shirt sleeves rolled up, presented the final plans for the ‘Water Discovery Zone’. Renderings showed colourful jets, tipping buckets, soft-surfaced mounds. Safe. Modern. Funded. The twenty-five metre pool at the new leisure complex two miles away? Ready to welcome the swimming club. Lanes allocated.

  *“So, the lido?”* Mary had asked, minutes pen poised.

  *“Decommissioning begins September 1st,”* Evans said. *“The structure’s unsound, frankly. End of life.”*

  Arthur Pendlebury, whose grandfather had been on the founding committee, stirred. “End of life? That old girl’s been declared terminal every decade since the sixties. Bit of concrete, bit of plumbing. We patched it then, we can patch it now.”

  Jenny Carter, from the swimming club, sighed. “Arthur, love, the leisure centre pool is heated. Indoors. We’ve got guaranteed lanes, proper changing facilities, disability access. The kids won’t get hypothermia in May. It’s progress.”

  “Progress towards what?” Arthur muttered, but it was lost in Evans’ efficient summary of handover timelines to the development trust. Mary wrote it all down: *‘Transition’, ‘Reimagining’, ‘Vibrant Future Use’*. Nobody said ‘end’. Nobody said ‘loss’. They said ‘logistics’. They said ‘practicalities’.

  After the meeting, Arthur lingered while Mary packed the minute books into their archive box. He tapped the 1937 volume. “See that? ‘The Trustees solemnly undertake… in perpetuity… for the health and recreation of the inhabitants…’ Big words. Meant something.” He sighed, a dry, papery sound. “Now it’s all about this year’s budget and next year’s risk assessment. Can’t promise further ahead than your nose these days. Makes you feel… smaller.”

  Mary nodded, stacking another book. *1948: ‘Agreed: repairs to the filtration system to ensure long-term operation for generations to come.’* “It’s just the way things are, Arthur. Everything changes.”

  “Does it?” He peered at her. “Or do we just forget how to promise?”

  He didn’t stay for an answer, shuffling out into the drizzle. Mary locked up, the heavy door of the old committee room (now a shared workspace) clicking shut with finality. Arthur’s words echoed. *Forget how to promise.* It wasn’t quite right, she thought, walking home. They still promised things. The leisure centre promised warm water and clean changing rooms. The splash park trust promised fun and safety. They just promised… less. For a shorter time. The horizon felt closer, crowded with immediate concerns: funding cycles, safety audits, quarterly reports. The vast, echoing space of ‘perpetuity’ was gone, replaced by manageable, measurable chunks. It wasn’t forgetting. It was… narrowing. And Arthur, steeped in the minutes, felt the draught from that vanished space.

  The next Saturday was unexpectedly warm. A final, defiant gasp of summer. Mary took Lily to the lido one last time. It was busy. Families squeezed onto the concrete surrounds, children shrieked in the shallow end, teenagers cannonballed off the crumbling edge of the deep end. The water, as always, was bracingly cold. Mary watched Lily swim a wobbly width, her stroke still new and earnest.

  A tile near the steps was loose. Mary noticed it as she helped Lily out. Just one, wobbling underfoot. She remembered the meeting five years ago, documented in neat script: *‘Extensive discussion regarding retiling the main pool basin. Quotes obtained. Decision deferred pending long-term strategic review of site viability.’* At the time, it had seemed sensible. Why spend thousands if the future was uncertain? Now, looking at the wobbling tile, she had a sudden, sharp image – not of the splash park, but of the pool empty. Not just closed, but *gone*. Filled in. The concrete cracked and grass pushing through. A space where something had been, its absence only noticeable if you knew to look. And she saw, with startling clarity, the chain: deferred maintenance leading to decay leading to closure. Each step logical, manageable, short-term. But the endpoint…

  “Mum! Watch this!” Lily launched herself back in, creating a spectacular splash. The image dissolved in the spray and the shrieks and the sun warming Mary’s shoulders. *Silly*, she thought, shaking her head. The leisure centre was fine. Lily would swim. The splash park would be bright and noisy. It wasn’t the end of swimming. It was just different. Better, even, according to Jenny. She pushed the momentary vision away, focusing on Lily’s beaming face. Today was sunny. The water was cold. That was enough.

  Later, sorting the archive box for the final handover to the town museum, Mary found a loose sheet tucked into the back of the 1939 minute book. It wasn’t an official record, just a handwritten note, probably by the then-secretary: *‘Met Mr Henderson from the Builders. Assured him the foundations are sound for a century or more. Told him we’re building for our grandchildren’s grandchildren. He laughed and said he’d settle for seeing it finished by September! But we must think long, mustn’t we? Else what’s it all for?’*

  Mary stared at the words. *Grandchildren’s grandchildren.* The phrase felt alien, almost absurdly ambitious. Who thought like that now? Plans stretched five years, maybe ten if you were optimistic or a large corporation. A century? It belonged with ‘perpetuity’ in the museum case.

  She heard a low rumble outside. Peering through the net curtains, she saw a council lorry parked by the lido gates. Men in high-vis were unloading barriers. September 1st. The beginning of the end. Or the beginning of the next thing. She couldn’t quite decide which felt true. The noise was just the clatter of barriers, ordinary, workaday. From somewhere down the street, a child laughed. It was just a slightly awkward summer, shifting into autumn. She carefully tucked the note back where she’d found it and closed the box.

  ---

  **What I was aiming for:** The ending juxtaposes the found note's vast temporal vision ("grandchildren's grandchildren") with the mundane sound of the barriers arriving *now*. Mary feels the dissonance but doesn't articulate it as "collapse"; it just sits there, unresolved. The lorry noise and the child's laugh emphasize ordinary life continuing, while the barriers signal the irrevocable change. The grief and the unspoken "shortening of the promise" are present in the gap between these elements, felt rather than explained. The story stays grounded in concrete details (the wobbling tile, the minute books, the cold water) to avoid parable. The near-miss is Mary's fleeting vision of the filled-in pool, immediately dismissed by Lily's splash and the practicalities of the present. Arthur voices the concept obliquely ("Can't promise further ahead than your nose... Makes you feel smaller") but it remains a personal observation, not a thesis. "Collapse" is never said; the focus is on specific actions and absences (deferred maintenance, the handover, the replaced promise of 'perpetuity' with the splash park's funded reality).
