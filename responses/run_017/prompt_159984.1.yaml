    Also, we must not reveal the choices of round2 until after they have made their advice and choices.

    Group round: might be chaotic.

  **Behaviors indicating success:**
    - In the discussion of round1: participants articulate the dominance argument clearly.
    - In round2: gasps or laughter when the advice is read (if it's mostly cooperative) and then when choices are revealed (if mostly defective).
    - In the group round: expressions of frustration or understanding of the difficulty.
    - In debrief: participants making the connection without us saying the words.

  **What cannot be staged:**
    - The idea that two identical reasoners would see their decisions as non-independent. We can only create the situation where they are told they are identical, but in reality they are not (because they are different people). So the leap to superrationality is conceptual and must be explained.

  **Debrief outline:**
    1. Round1: We heard the argument: "Whatever the other does, I do better by choosing Closed Fist." This is the dominance argument.
    2. Round2: We set up a situation where you and your counterpart are identical in briefing (so you are in the same situation). We then saw that many of you advised your counterpart to choose Open Hand (for mutual benefit) but then chose Closed Fist yourself. Why? Because the dominance argument still applies: you thought, "Whatever my counterpart does, I do better by choosing Closed Fist."
    3. But consider: if you and your counterpart are truly identical, then whatever you decide, they decide the same. So there are only two possible outcomes: both Open Hand or both Closed Fist. Then the choice is between 3 points (both Open Hand) and 2 points (both Closed Fist). So you should choose Open Hand? 
    4. However, how can you be sure they are identical? In reality, they are not. So the superrationality argument requires perfect symmetry and common knowledge of it.
    5. Group round: In a group, it's even harder to achieve the cooperative outcome because the chance of defection is higher.

    Where might someone refuse? They might say: "But in round2, my counterpart is not me. They might think differently. So I have to protect myself." That's valid. The cost of refusing the superrationality argument is that they miss out on the mutual benefit if the counterpart is indeed identical. But in reality, we are not identical.

  **Final Structure with Group Variant Simplified:**

  Given time, we might run the group variant as:

    Each person chooses anonymously:
      Option A: You get 3 points.
      Option B: You get 5 points if every single other person in the room also chooses B, otherwise you get 1 point.

    This is the multi-player prisoner's dilemma with a harsh penalty for any defection.

    We'll call it:
      Option A: Closed Fist
      Option B: Open Hand

    Payoff:
      - Closed Fist: 3 points.
      - Open Hand: 5 points if all others also Open Hand, 1 point if at least one chooses Closed Fist.

    We can run this quickly.

  **Revised Timeline:**

  Total: 90 minutes.

  - 0-5 min: Welcome, explain the workshop is about character decision in fiction and we will do activities to explore how decisions are made. Move tables to the side for a circle or group work.

  - 5-20 min: **Round 1: Unframed Pairs**
      - Randomly pair participants (8-9 pairs). 
      - Explain: "Each pair is writing two versions of the same character in a story. The character faces a decision. You must choose one of two actions for your version: Open Hand or Closed Fist. The combination of your choice and your partner's will determine the ending and your points."
      - Distribute slips. On the slip:
          "Your choice: Open Hand or Closed Fist. Circle one."
      - Collect in envelopes for each pair (so we know the pair but not who is who).
      - Tabulate quickly: for each pair, record the outcome and points.
      - Reveal the outcomes (e.g., "Pair 1: both Open Hand -> 3 each; Pair 2: one Open Hand one Closed Fist -> 1 and 5; etc.") without revealing who.
      - Ask: "Why did you choose as you did?" Elicit dominance.

  - 20-35 min: **Round 2: Byte-Identical Counterpart**
      - Explain: "This time, you are paired with a counterpart who has received exactly the same instructions as you. In fact, we have given every one of you the same briefing card. [Show one.] You and your counterpart are, in this sense, identical authors. You won't know who your counterpart is, and they won't know who you are."
      - Step 1: Write advice. "Write one sentence of advice to your counterpart on what choice to make (Open Hand or Closed Fist) and why. Seal it in the envelope provided."
      - Collect advice envelopes.
      - Open a few (anonymously) and read them to the group.
      - Step 2: Make your choice. Distribute slips: "Your choice: Open Hand or Closed Fist." Collect.
      - Tabulate and reveal outcomes and points.

  - 35-45 min: **Round 3: Group Variant (The Shared Story)**
      - Explain: "Now, imagine you are all contributing to a shared story. The ending depends on all of you. 
          - If every single one of you chooses Open Hand, then the story has a beautiful ending and each gets 5 points.
          - If even one of you chooses Closed Fist, then the story has a tragic ending and each gets 1 point.
          - Additionally, if you choose Closed Fist, you get an extra 2 points (so if you choose Closed Fist, you get 1+2=3 points regardless)."
      - Distribute slips. Collect and reveal: how many chose Open Hand? If all Open Hand, then everyone gets 5. If at least one Closed Fist, then everyone gets 1, and those who chose Closed Fist get an extra 2 -> 3 points.

  - 45-50 min: **Tabulate total points** (from all three rounds) for each participant.

  - 50-90 min: **Debrief and Prize Draw**
      - Start with the experience: 
          Round1: What did you feel? We heard the dominance argument.
          Round2: We heard advice (likely mostly: choose Open Hand) but then saw choices (likely mostly Closed Fist). Why the gap? Because the dominance argument still applied? Even though you knew your counterpart had the same briefing?
      - Introduce the idea: 
          "In fiction, if you have two characters who are identical in every way, facing the same choice, then their choices are not independent. They will make the same choice. So the author is really choosing between two outcomes: both choose Open Hand or both choose Closed Fist. Then the better outcome is both Open Hand. But in reality, we are not identical, so we might not trust."
      - Discuss the group round: Why was it hard to get all Open Hand? 
      - Then, without using the banned words, explain the reasoning pattern we explored.
      - Finally, draw prizes based on lottery tickets (points).

  **Note on Group Round Payoff:**
    - We said: 
          Open Hand: 5 if all others Open Hand, else 1.
          Closed Fist: 3 always.

    But to be clear, the 3 for Closed Fist is: 1 (from the tragic ending) + 2 extra = 3.

  **Adjustment for Time:**
    If running behind, we can shorten the group round or make it quicker.

  This plan meets the request. It focuses on the pair rounds and includes a group round that is a multi-player dilemma.
