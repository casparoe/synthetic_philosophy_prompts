  ### Workshop Activity: "The Sealed Ending"
  **Core Idea:** Participants experience the conflict between individual dominance reasoning ("I gain by taking the sure advantage, regardless of what others do") and symmetric interdependence ("If we reason identically, our decisions are tied; the 'sure advantage' disappears when we mirror each other"). The activity uses novelists' language—sealed endings, silent counterparts, and duplicated stories—to avoid game-theory terms until the debrief. The goal is to make participants *feel* the tension between these perspectives through play.

  **Materials (fits in one bag):**
  - 20 envelopes (for advice and choices).
  - 60 blank slips of paper (small, for choices/advice).
  - 20 pens.
  - A roll of opaque sealing stickers (to seal envelopes).
  - A small lockbox (for sealed choices).
  - Prize cards (handwritten):  
    - "45-min manuscript consultation + notes on 10 pages" (Grand Prize ×1)  
    - "Written notes on 5-page excerpt" (Second Prize ×2)  
    - "First refusal on workshop seat" (i.e., guaranteed spot in your next workshop; Third Prize ×3)  
    - "Good bottle of wine" (Consolation ×1; tangible item you provide).  
  - A random draw bowl (for prize lottery).
  - Timer (phone/app).

  **Payoff Scheme:**  
  Points = lottery tickets for prizes. Points are awarded based on outcomes:  
  - **Round 1 (Pairs):** 5 points for "advantage" outcome, 3 for mutual gain, 1 for loss.  
  - **Round 2 (Symmetric Pairs):** Same as Round 1, but with a 2-point bonus if your choice matches your counterpart's (to incentivize alignment).  
  - **Group Round:** 6 points if all abstain, 0 if anyone takes the tempting object.  
  **Stakes Bite Hardest:** In Round 2 (symmetric pairs). The bonus for matching choices creates tension: participants want mutual gain (3+2=5 points) but fear exploitation (1 point if they cooperate and counterpart defects). The manuscript consultation (Grand Prize) is highly desirable, raising stakes.  

  **Structure:** Three rounds (pairs → symmetric pairs → group) + debrief. Total: 90 minutes.  

  ---

  ### Minute-by-Minute Timeline  
  **0–5 min: Setup and Framing**  
  - Move tables to walls; chairs in a circle.  
  - Introduce the theme: "Today, we explore how characters make decisions when they can't communicate. You'll write endings to short stories, sealed away. Outcomes affect your points, which convert to prizes."  
  - Distribute materials (1 envelope, 3 slips, 1 pen per person).  

  **5–25 min: Round 1 (Unframed Pairs)**  
  - **Goal:** Elicit dominance reasoning ("My choice is independent; I take the advantage").  
  - **Rules:**  
    1. Randomly pair participants (e.g., draw names from a hat).  
    2. Each pair writes the same story premise: "Two strangers meet at a crossroads. One must choose: OPEN HAND (offer help) or CLOSED FIST (take resource)."  
    3. **Each participant secretly circles a choice on a slip:**  
       - OPEN HAND (OH)  
       - CLOSED FIST (CF)  
    4. Slips sealed in envelopes and locked in box. No discussion.  
  - **Reveal outcomes (anonymously):**  
    - Both OH → "Mutual aid" → 3 points each.  
    - One OH, one CF → "Betrayal" → OH: 1 point, CF: 5 points.  
    - Both CF → "Conflict" → 2 points each.  
  - **Ask:** "Why did you choose what you did?" *Let them articulate dominance:*  
    > "Whatever they did, I got more by choosing CLOSED FIST."  
    > "Their choice was fixed; mine wasn’t. I took the advantage."  

  **25–45 min: Round 2 (Symmetric Pairs)**  
  - **Goal:** Create conflict between advice (urge mutual gain) and choice (defect due to dominance). The "byte-identical" setup primes symmetric reasoning.  
  - **Rules:**  
    1. Re-pair participants **randomly** but announce: "Your counterpart received *identical instructions*. You both know this. You’re writing the same story, but your character can’t hear theirs."  
    2. **Write advice:** Each writes 1 sentence to counterpart on a slip (e.g., "Choose OH for mutual gain"), seals it in an envelope, and hands to you.  
    3. **Read sample advice (anonymously):**  
       - Shuffle envelopes, open 5–6, read aloud (e.g., "Pick OH—it’s better for both"). *Most will advise OH.*  
    4. **Make choice:** Each circles OH or CF on a new slip, seals it, locks in box.  
  - **Reveal outcomes (anonymously):**  
    - Outcomes same as Round 1, but add: +2 points if your choice matches counterpart’s.  
    - *Expect visible disagreement:* Advice urges OH, but choices lean CF (especially after Round 1 dominance). Highlight mismatches:  
      > "Many advised OH, but over half chose CF. Why?"  

  **45–55 min: Group Round ("The Tempting Object")**  
  - **Goal:** Contrast pair dynamics with group. Show how scaling up weakens symmetric reasoning (fear of defectors dominates).  
  - **Rules:**  
    1. Each participant gets a private offer:  
       - "Take the GOLDEN APPLE now for yourself (you get nothing else)."  
       - "Leave it. If *everyone* leaves it, all get a SILVER BRANCH."  
    2. **No discussion.** Choices sealed.  
  - **Reveal outcome:**  
    - If all leave it → Each gets 6 points (SILVER BRANCH).  
    - If anyone takes it → Takers get 0 (symbolic loss; they "stole" but gained nothing), others get 0.  
    - *Note:* SILVER BRANCH > GOLDEN APPLE in value (6 > 0), but GOLDEN APPLE tempts individuals.  
  - **Why it pulls against pairs:**  
    - In pairs, symmetry feels plausible ("my counterpart is like me"). In groups (16–18), symmetry shatters—participants assume *someone* will defect. The "all-or-nothing" condition (everyone must abstain) makes cooperation feel impossible.  

  **55–70 min: Calculate Points and Award Prizes**  
  - Tally points from all rounds.  
  - Assign lottery tickets (1 ticket = 1 point). Draw prizes from bowl.  
  - *Stakes note:* Manuscript consultation (high-value) goes to top scorer; wine/notes spread participation.  

  **70–90 min: Debrief**  
  - **Map moments to the idea:**  
    1. **Round 1:** "You voiced the dominance argument: 'Their choice is fixed; I take the advantage.' This is how a character reasons alone—*sealed off*."  
    2. **Round 2 advice:** "You urged OH. Why? Because if your counterpart is *just like you*, they’ll mirror you—so mutual gain is possible."  
    3. **Round 2 choice:** "But you chose CF. Why? Dominance persisted: 'What if they’re not identical? I’ll be exploited.' The 'sure advantage' (CF) felt safer."  
    4. **Group round:** "Scaling to 16 people shattered symmetry. You assumed *someone* would take the APPLE—so why abstain? The 'mutual gain' outcome (SILVER BRANCH) vanished."  
  - **Core conflict:**  
    - Dominance: "I control my choice; theirs is fixed. I take the advantage."  
    - Symmetry: "If we’re identical, our choices are tied. The only real options are both-OH or both-CF. Both-OH is better."  
  - **Where a participant might refuse the conclusion:**  
    - At: "Symmetric reasoning guarantees alignment."  
    - **Refusal:** "But we’re not identical! My counterpart might defect even if I cooperate."  
    - **Cost:** They reject mutual gain. In story terms: their character never risks trust, missing richer endings (e.g., reconciliation).  
  - **What can’t be staged:** The leap to *common knowledge of symmetry*. Participants can’t *truly* believe their counterpart is identical (they’re strangers). You must explain:  
    > "In fiction, if two characters are clones—same backstory, values, and knowledge—they’d make the same choice. But in life, we doubt. That doubt kills mutual gain."  

  ---

  ### Critical Mechanics Notes  
  - **Byte-identical pairing:**  
    - **Trust fix:** Verify randomness publicly. Draw names from a hat for Round 2 pairs, but keep counterparts secret (e.g., "You’re Pair 7A; your counterpart is 7B"). Assure: "No tricks—we’ll show pairings if questioned post-workshop."  
    - **Advice device:** It *enhances* the conflict. Reading advice pre-choice primes guilt ("I said OH, but CF is smarter"), making the choice feel personal.  
  - **Predictable pitfalls:**  
    - **Round 2 skepticism:** Participants may doubt "identical" briefing. Mitigate by reading instructions verbatim: "Your counterpart has this exact sheet."  
    - **Group round chaos:** Some may take GOLDEN APPLE as a joke. Set stakes: "This affects prizes; SILVER BRANCH is 6 points—worth 6 lottery tickets."  
    - **Misleading behavior:**  
      - **Noise:** Laughter during advice-reading (nervousness).  
      - **Shows off:** Someone brags, "I always pick CF!" (dominance reaffirmed).  
      - **Evidence it landed:** Gasps when advice/choices mismatch; frustrated sighs in group round ("I knew someone would take it!"); post-activity questions about "mirrored characters."  

  ---

  ### Why This Works for Your Novel Scene  
  - **Playable, not just prose:** The physical slips, sealing, and public reveals force participants to *enact* the reasoning (writing advice, hesitating on choices). The advice/choice mismatch is visceral.  
  - **Character resonance:** The "silent counterpart" mirrors your novel’s writers' retreat—participants *are* the visitors, facing sealed fates and doubting symmetry.  
  - **Superrationality hint:** In debrief, call symmetry reasoning "mirrored choices" (avoiding "superrationality" until post-workshop). The bottle of wine (prize) ties to your novel’s "desirable object."  
  - **Flexibility:** If the group round fails (e.g., all abstain), use it to discuss: "Why did trust work here?" (small group effect). If your character is wrong, emphasize refusal points: "We can’t prove symmetry—so maybe dominance always wins."  

  Run this once, and you’ll have both a workshop tool and a lived experience to seed your draft. The sealed envelopes and tangible stakes make the reasoning *unignorable*.
