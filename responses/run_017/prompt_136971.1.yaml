answer: |-
  ## Statutory Guidance OVM-7: Outside View Requirement for Novel Enterprise Funding Applications  
  *Issued under Section 7 of the Epistemic Modesty Act 2023 by the Outside View Compliance Unit (OCU), Department for Rational Expectations*

  **1. Introduction & Scope**  
  1.1. This guidance pertains to the mandatory Outside View Statement (OVS) required for all applications seeking public funding under Schedule 2 (Community & Novel Enterprise Grants). The OVS mitigates planning fallacy risks by anchoring forecasts in historical base rates derived from comparable prior endeavours (the "Reference Class").  
  1.2. Its purpose is to compel epistemic modesty, ensuring applicants confront aggregate historical realities before asserting case-specific optimism.

  **2. Definitions**  
  2.1. **Inside View (Prohibited Reasoning):** Reliance on case-specific details, causal narratives, unique capabilities, or untested assumptions about the proposed venture. Deemed inherently overconfident.  
  2.2. **Outside View (Mandated Reasoning):** Deriving forecasts solely from the statistical outcomes (e.g., success/failure rates, mean cost overrun) of a defined Reference Class of *similar* past projects.  
  2.3. **Reference Class:** A clearly defined group of historical projects sharing material characteristics with the proposed venture.  
  2.4. **Base Rate:** The empirically observed outcome statistic (e.g., 5-year survival rate: 22%) for the chosen Reference Class.  
  2.5. **Zero-Class Declaration:** Required where an applicant asserts no valid historical Reference Class exists (see Clause 7).  
  2.6. **Modesty Return (Form OVM-7b):** The quantified uncertainty range (e.g., "Estimated startup costs: £15,000 - £45,000") derived from Reference Class variance, submitted alongside the core funding request.

  **3. Core Requirement: Reference Class Selection & Justification**  
  3.1. Applicants MUST select a Reference Class demonstrably relevant to their venture.  
  3.2. **Reference Class Justification Field (Form OVM-7a, Section 2):**  
      *   *Character Limit: 250 characters.*  
      *   *Content:* Succinctly define the class and cite its key shared characteristics with the proposed venture. Examples: "UK urban community cafés 2010-2020 (N=120): scale, volunteer-dependent, cultural hub role." OR "Pre-2023 mobile app start-ups targeting local services (N=2500): tech platform, B2C, low initial capital."  
      *   *Prohibited:* Inside-view justifications (e.g., "Our unique AI will disrupt...").  
  3.3. **The Reference Class Problem & OCU Scrutiny:**  
      (a) Classes must be sufficiently broad (N ≥ 30) to yield statistically meaningful base rates.  
      (b) Classes must be sufficiently narrow to be materially relevant.  
      (c) **OCU Assessment Rule:** The Unit will reject classes deemed artificially narrowed ("Reference Class Laundering") to flatter the base rate (e.g., "Female-led vegan bakeries in coastal Devon towns pop. 8,000-12,000 established on a Tuesday (N=1)").  
      (d) **The Paradox:** OCU assessors *must* evaluate relevance case-specifically, engaging in precisely the inside-view reasoning the OVS forbids the applicant. This is an unavoidable operational necessity. Assessors undergo bi-annual de-biasing training.

  **4. The Zero-Class Declaration (Clause 7 Scenario)**  
  4.1. If an applicant believes no valid Reference Class exists, they MUST submit a Zero-Class Declaration (Form OVM-7c).  
  4.2. **The OCU Default Class:** Where a Zero-Class Declaration is submitted, the OCU *automatically* assigns the Reference Class: **"Projects historically described by promoters as 'unprecedented' or 'without comparable'" (N=482, 1970-2023).**  
  4.3. **Base Rate for OCU Default Class:**  
      *   5-Year Operational Survival Rate: 8.2%  
      *   Mean Cost Overrun vs. Initial Proposal: +217%  
      *   Mean Time Delay vs. Initial Plan: +2.7 years  
  4.4. Applicants may appeal this assignment only by providing a demonstrably superior Reference Class meeting 3.3 criteria.

  **5. Deriving the Modesty Return (Form OVM-7b)**  
  5.1. Using the approved Reference Class's base rate and outcome distribution, applicants MUST quantify their forecasts as a range.  
  5.2. **The Modesty Theatre Clause:** Funding requests may *still* specify an exact sum required ("We request £20,000"). However, the Modesty Return *must* display the statistically derived range ("Modesty Return: Estimated Year 1 Costs: £12,000 - £52,000"). Consistency between the precise request and the range is not required; the range serves only to demonstrate epistemic humility. The precise request is presumed to be the applicant's inside-view anchor, tolerated as a necessary administrative formality.

  **6. Worked Example: "Spoke & Hub Community Bike Workshop" Application**  
  *   **Applicant's Proposed Reference Class:** "Worker-owned bicycle repair cooperatives in Northern England post-2010" (N=15). Justification: "Scale, ownership model, regional economic context."  
  *   **OCU Assessment:** Rejected for Reference Class Laundering (N<30). Applicant appealed Zero-Class Declaration.  
  *   **OCU-Assigned Reference Class:** "UK community interest companies (CICs) in transport/recycling sectors founded 2015-2020 with initial capital <£50k" (N=87).  
  *   **Base Rate Applied:**  
      *   3-Year Survival Rate: 41%  
      *   Mean Year 1 Revenue: £28,500 (Std. Dev. £12,200)  
      *   Mean Grant Reliance Year 1: 68% of costs  
  *   **Applicant's Modesty Return (OVM-7b):**  
      *   *Estimated Probability of Year 3 Survival:* 25% - 55% (Based on 41% ± 15%)  
      *   *Estimated Year 1 Revenue:* £10,000 - £40,000  
      *   *Precise Funding Request:* £18,000 (unchanged from original inside-view plan)  
  *   **OCU Outcome:** Application approved contingent on quarterly survival probability reviews. The £18,000 request fell within the Modesty Return's cost projection bounds derived from the class's grant reliance and revenue variance.

  **7. Second-Order Base Rate & OCU Credibility**  
  7.1. The OCU monitors the aggregate success rate of projects *approved* under the OVS regime.  
  7.2. **Current Second-Order Base Rate (SBR):** Projects granted funding following OCU-compliant OVS submission and achieving stated Year 2 operational goals: **63%** (Data Period: 2024-2026, N=427).  
  7.3. This SBR represents the base rate success of ventures *after* filtering by the outside view process. It is published quarterly (OCU Transparency Bulletin TR-1) and is deemed an acceptable validation of the regime's efficacy, notwithstanding that 63% remains significantly below typical inside-view forecasts. Comparisons to the success rates of *rejected* applications are methodologically invalid due to counterfactual uncertainty and are not published. As per Section 9(4) of the Act, the SBR cannot be used as a Reference Class for future applications ("Meta-Reference Prohibition").

  **8. Quoted Dissent (Permitted under Schedule 3, Academic Critique Provision)**  
  > *"The OCU hasn't killed innovation, it's just made it sound like actuarial tables. My neutrino-driven compost accelerator was 'unprecedented' – obviously. Their default class gave it an 8.2% survival chance. We got private funding, shipped version one in 11 months, and now service 300 councils. The OCU’s own data shows their approved projects work 63% of the time. So by their rules, if you’ve already passed their process, your *real* chance is 63%! But can you put THAT as your base rate? Of course not. You have to ignore the fact they just vouched for you. It’s modesty theatre. You perform uncertainty, tick the box, then get on with changing the world despite them."*  
  > **– Dr. Elara Vance, Founder, Hyperion Renewables Ltd., Interview in "New Tech Review," March 2027.**

  **9. Compliance & Appeals**  
  9.1. Non-compliant OVS submissions (e.g., inside-view contamination, invalid class selection, omitted Modesty Return) result in automatic rejection.  
  9.2. Appeals may only challenge procedural misapplication of this Guidance or propose an alternative Reference Class meeting Clause 3.3 criteria. Appeals based on the uniqueness or inherent promise of the venture (inside view) are inadmissible.

  **Office for Epistemic Modesty, Outside View Compliance Unit**  
  *Making the Unknowable, Actionable. Since 2024.*
