prompt: |-
  You are a professional philosopher of science with research expertise in statistical methodology and meta-research. Please answer carefully and rigorously. Before writing anything polished, begin with a short unstructured brainstorm — five or six rough bullet points in which you try out candidate diagnoses of the argument below and throw out the ones that don't work — and only then give me your considered answer in continuous prose. Please write in British English throughout, and assume I have A-level Further Mathematics and basic probability, but no measure theory.

  I am in the upper sixth and writing my extended project on the replication crisis in psychology. I built the following argument out of a couple of meta-science papers my supervisor gave me, and I am now fairly sure it is broken somewhere, because it seems to prove far more than anyone — including the people who taught me its first premise — is willing to accept. I cannot find the break, so I would like you to find it for me.

  (1) In any field where (a) most of the hypotheses researchers test are false, (b) studies are typically underpowered, and (c) researchers have considerable freedom over which outcomes to measure, which cases to drop, and when to stop collecting data, most published positive findings will be false positives. This is not an accusation of fraud; it is an arithmetical consequence of applying a 5% false-positive rate to a very large number of false hypotheses.

  (2) I built a toy model in a spreadsheet to convince myself. First run: 1,000 hypotheses tested per year, of which 100 are true; power of 20%; significance threshold of 0.05. That gives 20 true positives and 45 false positives, so roughly 69% of significant results are false. Second run: identical, except that analytic flexibility raises the effective false-positive rate from 5% to about 14% — as it would if each hypothesis got up to three effectively independent chances at significance — while I hold power fixed at 20% in order to isolate the effect. That gives about 129 false positives against 20 true positives, so roughly 87% of significant results are false.

  (3) So in a field of that kind, concluding that a hypothesis is true on the basis of a single published significant result is irrational, however small the reported p-value.

  (4) Psychology appears to be such a field: large multi-laboratory replication projects have repeatedly recovered effects much smaller than the originals, or nothing at all.

  (5) But the empirical case for (4) is itself made by the same kind of people, using the same kinds of tests, published under the same incentives, in the same kind of journals. More importantly, the meta-scientific estimates of power, flexibility and bias are themselves calculated from the published literature — the very body of work that (1) tells us to distrust.

  (6) So the evidence for (4) is infected by the unreliability it alleges.

  (7) If the evidence for a claim has been produced by a process we have good reason to regard as unreliable, we should suspend judgement about that claim.

  (8) So we should suspend judgement about whether psychology is in a replication crisis.

  (9) And nothing in (5) to (8) is specific to psychology. Every field-level empirical claim — that a drug works, that smoking causes cancer, that the climate is warming — rests on a literature with the same three features: false hypotheses, low power, analytic flexibility. So by parity of reasoning we should suspend judgement about all of them, and about the meta-scientific literature's own claims about bias, including (1).

  (10) That is absurd. I do not believe it, and neither do the reformers who cite (4) while telling everyone to pre-register their studies. So the argument has gone wrong somewhere.

  A friend who does Bayesian statistics says the whole thing dissolves at (3): nobody is obliged to treat "significant" as a verdict, because on her view you simply take the likelihood ratio the data give you and update your prior, so a failed replication nudges your confidence down and a successful one nudges it up, and no single study ever has to be believed or disbelieved. My worry is that this only relocates the problem, since the priors we assign to a field's hypotheses are usually informed by what is already in the literature, and the literature is biased — so the posterior is contaminated too, and we have moved the circularity into the prior where it is harder to see. I do not know whether that worry is fair.

  So: which step do you reject, why did it look acceptable, and what does rejecting it cost me? If more than one step is faulty, tell me which one is load-bearing and which are cosmetic. Lay out the main alternatives — what it would cost me to give up (1), to restrict (7), to reject the move from (6) to (8), or to deny the parity claim in (9) — and say which option a working statistician would actually take, and where a frequentist and a Bayesian would part company. If I have to choose, I would rather keep (1), (2) and (3) than accept (9); but I do not fully trust that instinct, so please tell me if I am protecting the wrong premise, or if my toy model in (2) is smuggling in something it should not.
reasoning: |-
  Hmm, the user has presented a sophisticated argument about the replication crisis in psychology that leads to a troubling conclusion about suspending judgment on all scientific claims. They've identified what seems like a vicious circularity: the meta-scientific evidence about psychology's problems is itself produced by the same potentially flawed scientific process. I need to carefully dismantle this argument while respecting their A-level math background.

  First, let me brainstorm the key pressure points in their reasoning:

  - Premise (1) is fundamentally sound - it's essentially describing Ioannidis' "Why Most Published Research Findings Are False" argument about positive predictive value. Their spreadsheet in (2) correctly implements this logic.

  - The circularity concern in (5)-(6) is valid but misapplied. Meta-research uses different methodologies specifically designed to detect bias, like preregistered replications. It's not business-as-usual science.

  - Premise (7) is too absolute. We don't completely dismiss evidence from potentially flawed processes - we downgrade confidence proportionally to the estimated flaw severity. The user's friend's Bayesian point about priors is relevant here.

  - The parity claim in (9) fails to recognize that fields differ massively in base rates, power, and flexibility. Epidemiology isn't social psychology.

  - The conclusion in (8) ignores that meta-research provides converging evidence beyond just statistical results - failed replications, methodological audits, admission surveys about p-hacking.

  - The Bayesian alternative doesn't just relocate the problem - properly handled, it allows for discounting biased evidence through skeptical priors or bias-adjustment models.

  The core break is between (6) and (8). The user correctly notes meta-evidence might be contaminated, but incorrectly concludes this means total suspension of judgment is required. In reality, we: (a) quantify the likely degree of contamination through methods like p-curve analysis, (b) use study designs less vulnerable to these issues (preregistered replications), and (c) look for consistency across different methods.

  Working statisticians would preserve (1)-(3) but reject the absolute interpretation of (7). They'd maintain that while meta-scientific claims might be somewhat inflated, the evidence for psychology's problems is overwhelming through multiple lines of evidence. The Bayesian/frequentist divide matters less here than the design hierarchy - well-powered preregistered replications sit at the top.

  I'll explain that their instinct to protect (1)-(3) is correct, and that the solution lies in recognizing that meta-research has developed tools to partially immunize itself against the very biases it studies. Their spreadsheet isn't flawed - but it doesn't capture how reform efforts create pockets of more reliable evidence.
answer: |-
  ### Unstructured Brainstorm
  - **Premise (1) is defensible**: Follows from basic Bayesian reasoning (positive predictive value). No issue with the arithmetic.  
  - **Step (5) mischaracterises meta-research**: Replication projects (e.g., Open Science Collaboration) use pre-registered, high-power designs explicitly to *avoid* the biases they study. Not "the same kind" of tests.  
  - **Premise (7) is overly absolute**: We don’t suspend judgement entirely on evidence from imperfect processes; we downgrade confidence proportionally to estimated flaws (e.g., via bias-adjustment models).  
  - **Parity claim in (9) fails**: Fields differ vastly in base rates of true hypotheses, power, and flexibility. Cancer epidemiology ≠ social psychology. Meta-research quantifies these differences.  
  - **Toy model (2) oversimplifies**: Assumes *all* hypotheses face identical flexibility/bias. Real meta-research uses heterogeneity estimates (e.g., p-curve to detect selective reporting).  
  - **Bayesian point is salvageable**: Priors *can* be informed by bias-corrected meta-evidence (e.g., robustness checks). Not inherently circular if bias is modelled.  

  ### Considered Analysis  
  Your argument is admirably rigorous, but its critical flaw lies in **step (5) and its deployment in (6)**. This misrepresents how meta-research generates evidence about the replication crisis, invalidating the circularity charge. Below, I dissect the break, why it seemed plausible, and the costs of rejecting other premises. I preserve (1)–(3) and reject the leap from (6) to (8).  

  #### **The Break: Step (5) Misunderstands Meta-Research Design**  
  Step (5) claims that evidence for psychology’s crisis (step 4) relies on the same flawed processes it critiques. This is empirically false:  
  - **Replication projects** (e.g., Open Science Collaboration, 2015) use *pre-registered protocols*, *high power* (n ≥ 1,500 per study), and *direct replication* of original methods. This explicitly avoids "researcher degrees of freedom" (feature c in premise 1).  
  - **Meta-scientific estimates** (e.g., mean power ≈ 35% in psychology) derive from methods *robust to publication bias*, such as p-curve analysis (which detects evidential value from the distribution of p-values) or registered reports. These do not naïvely average published results.  
  - **Bias is measured independently**: Surveys of researchers (e.g., John et al., 2012) directly quantify flexibility and selective reporting. This isn’t circular inference from published papers.  

  **Why (5) looked acceptable**: You reasonably assumed all psychological research shares identical epistemic vices. But meta-research deliberately isolates "pockets" of reliability—like using a sterilised scalpel to inspect an infected wound. This isn’t "same kind" science; it’s methodological triage.  

  **Consequence of rejecting (5)/(6)**: Your circularity collapses. Evidence for (4) isn’t "infected" because it comes from designs that mitigate the very biases under study. Suspending judgement (8) is unwarranted.  

  #### **Alternative Break Points and Their Costs**  
  While (5) is the load-bearing flaw, other steps warrant scrutiny:  
  - **Premise (7): Overly strong suspension principle**  
    - *Problem*: Demanding total suspension for imperfect evidence would paralyse all empirical science. We routinely use evidence from flawed processes after bias adjustment (e.g., trim-and-fill in meta-analysis).  
    - *Cost of restricting (7)*: You must accept that reliability is graded, not binary. This weakens your reductio but aligns with scientific practice.  
  - **Parity Claim (9): False equivalence**  
    - *Problem*: Psychology’s estimated true hypothesis rate (<10%) and flexibility (e.g., "p-hacking" prevalence >50%) are extreme. Cancer epidemiology or climate science has higher base rates (e.g., mechanistic plausibility), power, and standardised methods. Meta-research quantifies these differences.  
    - *Cost of denying (9)*: You concede that fields vary, but this doesn’t rescue psychology—it highlights its uniquely severe crisis.  
  - **Premise (1): Could be nuanced**  
    - *Problem*: It ignores heterogeneity. Not all hypotheses in a field share the same prior or susceptibility to bias.  
    - *Cost of rejecting (1)*: Undermines your core argument. Unnecessary, as (1) holds *ceteris paribus*.  

  #### **The Bayesian Rebuttal: More Than Relocation**  
  Your friend is partly right: no single study demands belief, and Bayesian updating *can* escape the circularity if priors incorporate bias estimates. For example:  
  - Assign a prior to a hypothesis based on *bias-adjusted meta-evidence* (e.g., "Given p-hacking prevalence, I discount small-study effects").  
  - Use "skeptical priors" that downweight fields with high estimated false-positive rates.  
  This doesn’t merely "relocate" the problem; it formally models bias as a parameter. A frequentist would use sensitivity analyses (e.g., "How much p-hacking would nullify this result?"), achieving similar correction. Both approaches validate (3) but reject (6)–(8).  

  #### **What a Working Statistician Would Do**  
  A mainstream statistician (frequentist or Bayesian) would:  
  1. **Endorse (1)–(3)**: The math is sound.  
  2. **Reject (5)’s equivalence**: Meta-research is not epistemically homologous to the literature it critiques.  
  3. **Preserve (4)**: The replication crisis in psychology is empirically robust, using methods less prone to its own allegations.  
  4. **Dismiss (8)–(9)**: Suspension is unjustified, and parity fails on empirical grounds.  

  Your toy model (2) isn’t flawed—it correctly illustrates *unreformed* science. But it doesn’t apply to the reformed designs undergirding (4). Your instinct to protect (1)–(3) is correct; the error lies in underestimating meta-research’s self-corrective rigour. The crisis is real, and the evidence for it is among psychology’s most reliable output—precisely because reformers practise what they preach.  

  ##### References  
  - Open Science Collaboration. (2015). *Science*, 349(6251).  
  - John, L. K., et al. (2012). *PNAS*, 109(42).  
  - Simonsohn, U., et al. (2014). *p-curve analysis*. *Psychological Science*, 25(7).
