  ### Anselm Moderation Procedure: Loss & Obligation  
  **Purpose:** To determine if a legally permissible action resulted in a loss that creates an obligation for remedy. Focuses on *what was lost*, *to whom*, and *whether the game's metaphysics recognizes it*.  

  ---

  #### **Step 1: Confirm Action Legality**  
  - **Question:** Was the action (unmaking, binding, retcon) explicitly permitted by the Charter and game mechanics?  
  - **Sufficient Answer:** Yes (supported by logs/Charter text).  
  - **No?** → Stop. Refer to rule-violation procedure.  
  - **Yes?** → Proceed to Step 2.  
  - *Judgment Call?* No (fact-based).  

  #### **Step 2: Identify the Loss**  
  - **Question:** What does the claimant assert was lost? (e.g., object, time, creative work).  
  - **Sufficient Answer:** Concrete description of the loss (e.g., "my ship," "9 days of play," "my city’s canon").  
  - **Unclear?** → Stop. No obligation (claim too vague).  
  - **Clear?** → Proceed to Step 3.  
  - *Judgment Call?* No (clarification step).  

  #### **Step 3: Verify Existence in the Ledger**  
  - **Question:** Was the lost entity recorded in the Ledger?  
    - *Key Test:* Check Ledger for the object/character’s unique entry.  
  - **Yes** (e.g., unmade ship, bound character) → Proceed to Step 4.  
  - **No** (e.g., uninstantiated city, prose-only lore) → Proceed to Step 7.  
  - *Judgment Call?* No (binary record check).  

  #### **Step 4: Apply Copy-Substitution Test**  
  - **Question:** If replaced with a *qualitatively identical copy*, would the claimant accept it as restoring their loss?  
    - *Purpose:* Debunks "description-parity" by testing if identity hinges on *provenance*, not description.  
  - **Yes** → Stop. No obligation (loss reparable via description).  
  - **No** → Proceed to Step 5 (loss is unique and irreplaceable).  
  - *Judgment Call?* Yes (moderator assesses claimant’s intent).  
  - **Note:** A "no" confirms the loss is tied to the object’s history, not its qualities.  

  #### **Step 5: Assign Loss Ownership**  
  - **Question:** Who "owned" the loss at the time of the action?  
    - *For objects:* Current holder (per Ledger).  
    - *For time:* The bound character’s player.  
  - **Sufficient Answer:** Ledger holder logs or binding records.  
  - **Claimant is owner?** → Stop. No obligation (owner accepted risk via Charter).  
  - **Claimant not owner?** → Proceed to Step 6.  
  - *Judgment Call?* No (fact-based).  

  #### **Step 6: Determine Shared Burden**  
  - **Question:** Did the loss damage a *communal artifact*?  
    - *Criteria:*   - Age (>5 years).  
                    - Cross-faction use.  
                    - Embedded in key world events (e.g., wars, treaties).  
  - **Yes** → Obligation owed (non-restorative). Proceed to Remedies.  
  - **No** → Stop. No obligation.  
  - *Judgment Call?* Yes (moderator evaluates historical significance).  

  #### **Step 7: Purely Descriptive Loss**  
  - **Question:** Was the loss acknowledged beyond the claimant’s prose?  
    - *Test:* Evidence of community adoption (e.g., other players’ writings, in-world references).  
  - **Yes** → Non-binding remedy (Step 8).  
  - **No** → Stop. No obligation (loss is personal, not communal).  
  - *Judgment Call?* Yes (moderator assesses communal integration).  

  #### **Step 8: Remedies (If Obligation Confirmed)**  
  - **Non-Restorative Options** (choose one):  
    - Public archive entry documenting the loss.  
    - Temporary in-world memorial (e.g., a "gap shrine" for unmade objects).  
    - Offender contributes to community lore repair (e.g., writes a memorial tale).  
  - **Restitution Not Allowed:** Gaps cannot be filled; time cannot be restored.  
  - *Judgment Call?* Yes (moderator selects proportionate remedy).  

  #### **Limitations of Procedure**  
  - Cannot adjudicate:  
    - Abstract "reality" of virtual objects.  
    - Grief disconnected from communal loss (Step 7 filters this).  
    - Harms outside Ledger/Charter scope (e.g., OOC grudges).  
  - Appeals may challenge judgment calls (Steps 4, 6, 7, 8).  

  ---

  ### **Application to Cases**  
  #### **Case 1: The Unmade Ship**  
  - Step 1: Legal (unmaking by holder).  
  - Step 2: Loss of ship with history.  
  - Step 3: Ledger entry confirmed.  
  - Step 4: Copy-substitution → Former holders reject a copy (loss is unique due to provenance).  
  - Step 5: Loss owned by unmaker (current holder). → *No obligation to former holders.*  
  - Step 6: Communal artifact? Yes (age, multi-holder palimpsest). → **Obligation owed.**  
  - **Remedy:** Unmaker writes a public memorial in the archive.  

  #### **Case 2: Temporary Binding**  
  - Step 1: Legal (Charter permits binding).  
  - Step 2: Loss of 9 days’ play.  
  - Step 3: Ledger entry confirmed (bound character).  
  - Step 4: Copy-substitution → Irrelevant (loss is time, not an object).  
  - Step 5: Loss owned by player (they "held" the character). → *No obligation.*  
  - **Note:** Procedure confirms no obligation, but you *feel* this is wrong. Flaw: Step 5 ignores *emotional weight* of long-held characters. Suggestion: Add "exceptional tenure" (>10 years) as a Step 6 qualifier.  

  #### **Case 3: Uninstantiated City**  
  - Step 1: Legal (editor retcon).  
  - Step 2: Loss of described city.  
  - Step 3: No Ledger entry → Proceed to Step 7.  
  - Step 7: Communal adoption? Unclear (neighbouring editor retconned it). → *No obligation.*  
  - **Result:** Same outcome as Case 1 (no obligation) but for different reasons.  
    - **Why?** Procedure tracks *loss recognized by the world* (Ledger/gaps), not grief. Case 1 had a Ledger-backed communal loss; Case 3 did not.  

  ---

  ### **Confidence Assessment**  
  - **High Confidence Steps:**  
    - Step 1 (Legality): Binary Charter check.  
    - Step 3 (Ledger Verification): Objective record.  
    - Step 5 (Loss Ownership): Clear ownership rules.  
  - **Low Confidence Step:**  
    - **Step 4 (Copy-Substitution Test)**.  
      - **Why:** Relies on claimant’s subjective answer. A bad-faith claimant could manipulate it. Philosophers might argue it conflates *numerical identity* with *qualitative identity*. Experienced moderators should test if it consistently exposes "description-parity" fallacies.  
  - **Critical Judgment Call:**  
    - Step 6 (Communal Artifact). Risk of inconsistent standards for "historical significance."  

  ### **Key Claim to Verify**  
  > **"The copy-substitution test defeats description-parity without metaphysics."**  
  > - **Why Unsure:** It assumes claimants value provenance over qualities. But what if a player *does* accept a copy? Does that mean description-parity holds *for them*? A philosopher might argue the test is psychological, not ontological. An experienced moderator could calibrate it with real cases.  

  This procedure prioritizes Anselm’s metaphysics (Ledger as truth-maker, gaps as loss-markers) and minimizes abstract debates. It acknowledges grief but only acts on communal or Ledger-backed loss. Remedies focus on repair, not restoration, honoring the world’s constraints.
