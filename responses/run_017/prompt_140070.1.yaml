prompt: |-
  I work at a small climate-policy institute in Berlin, and I have been asked to draft a short briefing note on a question that keeps slipping out of the register my colleagues normally work in. Two neighbouring countries, inside the same coupled electricity market, bound by the same climate commitments and with comparable engineering capacity, have adopted opposite nuclear policies: Germany closed its last three reactors in April 2023 and is dismantling them, having replaced part of the lost output with gas-fired generation and with imports from its neighbours, while France still derives roughly two-thirds of its electricity from a fleet of about fifty-six reactors, is planning new builds, and has, as I understand the practice, permitted operating lives well beyond the original forty-year design assumption subject to periodic safety re-assessment. Everyone I ask for an explanation gives me either a political story — the strength of the German anti-nuclear movement since the 1970s, the origins of the French programme in the mid-1970s oil shock and the fact that it was launched without parliamentary debate — or a technical one about grids, geology and construction costs. I do not think those stories are wrong, but I want something different: treated as practices rather than as outcomes, what does each policy presuppose about risk, about the state, and about what is owed to people who do not yet exist?

  Three features of the pair strike me as philosophically loaded, and I would like the implicit theory behind them reconstructed rather than the policies judged. First, the exit does not free Germany of a custodial obligation, it converts an operating fleet into a sealed one: both countries intend to isolate long-lived waste in a deep geological repository whose safety is argued over timescales of hundreds of thousands of years, which is longer than any state has so far lasted. So when the phase-out is defended as refusing to impose a burden on later generations, what exactly is being claimed — a constraint on adding to a stock, a claim about expected harm, or something expressive, about the kind of polity a nation is willing to be? Second, the same jurisdictions apply a near-absolute, demonstrate-that-it-is-safe standard to radioactivity while approaching climate risk through carbon budgets and a social cost of carbon, that is, through an explicit trade-off that licenses some non-zero quantity of harm. What has to be true about the difference between the two hazards for that to be coherent rather than convenient — their shape, their reversibility, the number and identifiability of the people who bear them, our confidence in the probabilities, or the fact that one harm is imposed by our act alone and the other only together with everyone else's? Third, the two technologies make different demands on whoever comes after us: a fleet requires a competent regulator and operator to persist for as long as it runs, whereas a sealed repository is, in principle, designed so that safety does not depend on anyone reading the archives, and a retrievable repository — which I gather is what French law asks for rather than permanent sealing — seems to presuppose something different again, that later generations should be left the option of revising our judgement and possibly wanting the material back.

  So here is what I need. Reconstruct the theory that each practice requires, and be explicit about which parts are strictly presupposed and which merely fit comfortably: where is the practice underdetermined, so that several quite different theories would license the same policy, and where is it in tension with itself? Say whether a single underlying theory could generate both policies given different baselines — different grids, different publics, different inherited capital — or whether Berlin and Paris really are committed to incompatible views of risk. A colleague of mine suggests that the live axis is not how much risk a technology carries but what sort of afterlife it has, meaning what it demands of successor institutions: active custodianship for a century, passive safety with a warning that must stay legible for ten thousand years, or an open option that leaves the future our material to do as it likes with. I would like that suggestion tested rather than applauded — is it doing genuine work, or is it a redescription of the risk numbers? Finally, tell me what would have to change in each practice if the presupposition were swapped: if a country's energy mix is treated as partly constitutive of what it stands for rather than as a mere input to an electricity system, what follows for a Germany that buys nuclear power across the border in winter, and for a France that sells reactor technology to states with no comparable regulator; and if instead one adopted a flat expected-harm view with discounting, would the German closure simply become a moral error, and what else would that commit you to? Please do not give me a policy recommendation, and do not send me to a literature: I want the implicit theory and the places where it is thin.
reasoning: |-
  Okay, the user works at a climate-policy institute in Berlin and needs help drafting a briefing note. They're comparing Germany's nuclear phase-out with France's continued reliance on nuclear energy. The user isn't interested in political or technical explanations but wants to uncover the implicit theories behind each policy regarding risk, the role of the state, and obligations to future generations. 

  Hmm, the user has identified three philosophically loaded features: custodial obligations after shutdown, divergent risk standards (absolute safety for radiation vs. trade-offs for climate), and differing demands on future institutions. They want the underlying presuppositions reconstructed without judgment. 

  First, I need to unpack what each policy presupposes about intergenerational equity. Germany's closure frames nuclear as an ongoing burden even after shutdown, while France sees active nuclear power as reducing future climate burdens. The difference seems to hinge on whether you view nuclear waste as an unacceptable legacy or a manageable byproduct outweighed by carbon reduction benefits.

  Second, the risk standards reveal deeper assumptions about harm. Radioactivity gets treated as taboo (non-negotiable, agent-specific harm) while carbon emissions are tragic (negotiable, systemic harm). This isn't just convenience - it reflects how each hazard violates different moral intuitions about control and reversibility.

  Third, the "afterlife" concept might be key. Germany prefers passive safety (zero future demands) while France accepts active custodianship. But the French retrievable storage model introduces tension - is this about preserving future agency or admitting uncertainty? 

  Now, testing the colleague's "afterlife" theory: it does real work by shifting focus from probabilistic risk to institutional endurance. A reactor requires competent institutions for ~100 years; permanent waste storage needs passive safety for millennia; retrievable storage demands indefinite interpretative capacity. This isn't just rebranded risk math - it's about what kinds of obligations we embed in physical systems.

  On compatibility: both policies could stem from a single theory of intergenerational justice if baseline conditions differ (e.g., Germany's strong anti-nuclear movement making custodial competence seem fragile). But their risk epistemologies clash fundamentally - taboo vs. tragic harm can't easily coexist in one framework.

  If presuppositions were swapped: A Germany importing French nuclear power while claiming nuclear-free identity faces hypocrisy charges unless they frame imports as transitional. France exporting reactors assumes either that safety is transferable or that buyer nations' institutional futures aren't their concern - both ethically shaky positions.

  The thinnest points in each theory: Germany hasn't resolved how phase-out reduces actual future burdens given waste persistence. France hasn't justified why nuclear's custodial demands are less objectionable than climate risks. Both treat "generations" as undifferentiated blocks despite varying vulnerability.
answer: |-
  Below is a reconstruction of the implicit theories underpinning German and French nuclear policies, treating them as philosophical practices rather than outcomes. The analysis focuses on presuppositions about **risk ontology**, **state responsibility**, and **intergenerational obligations**, addressing your three core questions and testing your colleague's "afterlife" hypothesis.

  ---

  ### **1. Custodial Obligations: What Does Phase-Out "Refuse" to Impose?**
  - **Germany's Practice (Closed Fleet)**:  
    Presupposes that **ceasing active production** is the primary intergenerational duty. The moral claim is expressive: *"We choose not to be a polity that creates new radioactive burdens, even if existing ones persist."*  
    - *Presupposed*: Adding to the waste stock is an active moral harm; maintaining operational safety is a contingent, institutionally fragile demand.  
    - *Underdetermined*: Whether dismantling reactors (vs. sealing them) meaningfully reduces future burdens. The policy fits theories prioritizing symbolic repudiation over practical risk reduction.  
  - **France's Practice (Active Fleet)**:  
    Presupposes that **minimizing aggregate future harm** (via decarbonization) outweighs waste legacy concerns. The state acts as a *steward* managing trade-offs between present and future risks.  
    - *Presupposed*: Competent institutions can durably manage nuclear risks; climate change poses a greater existential threat than nuclear waste.  
    - *Tension*: Extending reactor lifespans beyond design limits assumes institutional permanence contradicting historical state fragility.  

  **Key Difference**: Germany emphasizes *intentionality* (we stop *causing* harm), France emphasizes *consequences* (we prevent *greater* harm). Both presuppose deep geological disposal as non-negotiable, but Germany's stance is expressive, France's consequentialist.

  ---

  ### **2. Risk Standards: Why Absolute Safety for Radiation but Trade-Offs for Carbon?**
  - **Shared Presupposition**: Radioactivity and climate change inhabit distinct moral categories:  
    - **Radioactivity** is treated as a *taboo risk*:  
      - *Non-negotiable* due to agency (we directly impose it), irreversibility, and identifiability of victims (even if hypothetical).  
      - Harm is *discrete* (leaks/accidents) and *exclusively anthropogenic*.  
    - **Climate Change** is a *tragic risk*:  
      - Systemic, cumulative, and co-produced by countless agents.  
      - Tolerates trade-offs because harm is *diffuse*, *partially reversible*, and embedded in essential activities.  
  - **Coherence Test**: The dichotomy holds if:  
    - Taboo risks demand *prohibitions* (no "safe" threshold); tragic risks demand *optimization* (harm minimization).  
    - *Incoherence* arises if nuclear power is framed as a climate solution (France) while its waste remains taboo. France resolves this by subordinating radiation risk to climate calculus; Germany rejects the equivalence entirely.  

  **Thin Point**: Germany applies taboo logic to nuclear production but not to gas imports (which distribute climate harm). France applies tragic logic to climate but not radiation safety standards.

  ---

  ### **3. "Afterlife" Demands: What Do Technologies Require of Future Institutions?**
  Your colleague's "afterlife" axis is generative:  
  - **Germany** seeks **passive safety**:  
    - *Presupposed*: Future institutions cannot be trusted. Safety must rely on *geology*, not human stewardship.  
    - *Tension*: "Retrievability" (legally required) contradicts this by assuming future societies can responsibly handle waste.  
  - **France** accepts **active custodianship**:  
    - *Presupposed*: Institutions can persist competently for centuries. New reactors demand regulatory/operational continuity (50–80 years).  
    - Retrievable storage presupposes future agents will have *superior knowledge/ethics*, needing options to revise our choices.  

  **Is "Afterlife" More Than Redescribed Risk?** Yes. It shifts focus from *probability* of harm to *institutional endurance required*:  
  - Reactors: ~100 years of high-competence stewardship.  
  - Passive repository: 10,000+ years of legible warnings.  
  - Retrieval-ready waste: Indefinite interpretive capacity.  
  This exposes a core divergence: Germany doubts institutional longevity; France bets on it.

  ---

  ### **Synthesis: Compatible Theories or Irreconcilable Worldviews?**
  - **Could One Theory Generate Both Policies?** Only superficially.  
    - A *consequentialist framework* could justify either policy given different baselines (e.g., Germany's grid interconnectivity vs. France's nuclear dominance).  
    - But the **risk epistemologies clash**: Germany treats nuclear risk as taboo/agentic; France treats it as tragic/systemic. This is foundational, not circumstantial.  
  - **Incompatible Presuppositions**:  
    - **State Capacity**: France assumes enduring institutional competence; Germany assumes decay.  
    - **Harm Logic**: France integrates nuclear into a scalar harm model (social cost of carbon); Germany sees nuclear harm as categorically distinct.  
    - **Future Agency**: France grants future societies authority to revise choices; Germany denies them this burden/responsibility.  

  ---

  ### **What If Presuppositions Were Swapped?**
  - **Germany Importing Nuclear Power**:  
    If energy mix is *constitutive*, importing nuclear power contradicts Germany’s expressive commitment. It must either:  
    - Reject imports (infeasible), or  
    - Reframe imports as transitional, maintaining moral "purity" domestically.  
  - **France Exporting Reactor Technology**:  
    Presupposes safety is *technically transferable* regardless of a buyer state’s institutional durability. Swapping presuppositions would require:  
    - Proof that recipient states can sustain century-long custodianship, or  
    - Acceptance that France is exporting *risk* it deems unacceptable domestically.  
  - **Flat Expected-Harm View**:  
    - Germany’s closure becomes a moral error *only if* nuclear power reduces net harm (factoring in avoided emissions).  
    - This commits Germany to accepting *any* risk with positive expected utility (e.g., CCS, geoengineering), erasing its taboo-risk category.  

  ---

  ### **Conclusion: Thin Points and Unanswered Questions**
  - **Germany's Thin Spot**: How phase-out reduces *actual* future burdens given enduring waste. The policy relies on expressive logic but invokes consequentialist rhetoric ("burden on future generations").  
  - **France's Thin Spot**: Why extending reactor lifespans is deemed low-risk despite institutional fragility, and why waste retrievability doesn’t undermine passive safety goals.  
  - **Unresolved**: Whether "generations" are homogenized in both models, obscuring differential vulnerability (e.g., waste repository locations imposing localized risks).  

  **Final Verdict on "Afterlife"**: It is not a redescription but a lens exposing how material designs encode assumptions about future societies. The core divide is whether we owe posterity *freedom from our legacies* (Germany) or *tools to manage them* (France). Neither policy escapes making fateful wagers about the endurance of human institutions.
