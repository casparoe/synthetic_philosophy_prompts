prompt: |-
  I'm a reporter who covers science and ideas, and I keep coming back to one source: a retired state-agency economist who sits on a technical review panel that has to sign off on quantitative models before anybody official is allowed to act on them. He is not a philosopher and would deny having a methodology at all, but over about four years I've watched him wave some submissions through and kill others, and I've kept notes. Now there's a genuinely nasty one in front of him and I want to know which way he goes — and, more than that, what rule he's been running this whole time.

  His record, as I've got it written down:

  - Frictionless planes, point masses, and massless cables in the model the state uses to certify a grandstand: approved in about ninety seconds, no discussion.
  - Zero transaction costs in a cap-and-trade model used to forecast allowance prices after the cap tightened: approved.
  - Firms modeled as perfectly informed profit maximizers, defended by a survival argument — competition selects for maximizers, so surviving firms behave as if they'd solved the optimization — used to predict which plants shut after a tariff: approved, though he spent the whole meeting asking whether the selection story had any teeth.
  - A labor market treated as one instant-clearing auction, used to forecast the jobs effect of a small tweak to a state tax credit. It beat three rival models on out-of-sample error. Approved, and I wrote down his joke: the assumption was about as false as an assumption can be, and that was the point.
  - An ocean treated as infinitely deep in a wave-height model for harbor design: approved, but only after he made them show him the range of wavelengths where it had been checked.
  - Homogeneous mixing in a flu model fitted after the fact and used to explain why cases collapsed in March: killed.
  - A single stable exponential discount rate in a model used to justify auto-enrolling people into a retirement plan: killed.
  - A credit-spread model that was very accurate on the calm years it was calibrated on, used to size an emergency lending facility in the middle of a panic: killed.

  The new submission: a state transportation department wants to use a model to pick which of two bridges to close for a two-year rebuild, and to decide how the detour gets signed. The model assumes every driver knows the entire road network and always takes the shortest path, that nobody learns anything from yesterday's commute, and that nobody uses a navigation app — rerouting is computed as though the whole network solved one global optimization all at once. Its track record is good: on three earlier closures in two other states it predicted average cross-town trip times to within six percent, better than the department's old model and better than a consulting firm's machine-learning version.

  Here's the wrinkle. A university team rebuilt it with realistic driver knowledge, day-to-day learning, and roughly a third of drivers on routing apps. Replayed on those same three closures it fits a little worse — around eight percent error, and most of the gap comes from one of the three — but it ranks the two candidate bridges in the opposite order. It only flips for this particular pair; for most other pairs of bridges the two models agree.

  So: what does he do? My philosopher friend says he's basically channeling Friedman — I'm paraphrasing, but the claim is that a theory's assumptions don't need to be realistic, and that the most significant theories tend to have the least realistic ones; she calls it the F-twist. But half his verdicts look like they're driven by something else entirely, and I can't tell whether the F-twist is the rule or just the thing he says at lunch. I'm less interested in the verdict itself than in the machinery behind it.

  Give me, with these sections in this order:

  - "The rule he seems to be running" — about 150 words, one rule that fits all eight verdicts.
  - "Other rules that fit just as well" — about 200 words, at least two more rules that his track record doesn't rule out.
  - "What each one says about the bridges" — about 250 words, including where the rules actually diverge and why.
  - "Your call" — about 150 words, your best guess at his verdict and the reason you're going with it.
  - "The case that would settle it" — about 150 words, one further submission you'd want in front of him to separate the surviving rules.

  Keep it plain English, no citations or reading lists — I can't chase down references on deadline and he'd deny every word of it anyway.
reasoning: |-
  Okay, the user is a science reporter who's been observing this economist on a technical review panel for four years. They've noticed he approves some models with unrealistic assumptions while rejecting others, and now there's a critical bridge closure model decision coming up. The reporter wants to understand the underlying rule behind his decisions, beyond just the Friedman "F-twist" explanation their philosopher friend suggested.

  Hmm, looking at his approval patterns: he's fine with frictionless planes and perfect information in markets when they're used in bounded contexts with verification (like checking wavelength ranges for ocean models). But he kills models when their assumptions break causal mechanisms (like homogeneous flu mixing during a pandemic) or when calibration contexts mismatch application contexts (like using calm-period financial models during panics).

  The bridge model case is tricky. The unrealistic "global optimizer" version has better historical accuracy, but the more realistic university version flips the decision for this specific pair of bridges. The key tension is between predictive accuracy and structural realism when they conflict on a material outcome. 

  For the rule, I'm considering a "fragility under misapplication" principle: he tolerates unrealistic assumptions if they're either (1) demonstrably irrelevant to the output or (2) actively useful simplifications that guard against overreach. The ocean depth assumption passes because they checked relevant wavelengths; the labor auction fails because it's applied to policy changes where behavioral dynamics matter.

  Other possible rules could be about "causal fidelity" (does the model preserve real decision mechanisms?) or "domain calibration" (is the assumption false in ways that correlate with policy levers?). These would handle the cases similarly but diverge on the bridge decision.

  For the call... I think he rejects the original model. That flipped ranking under realistic assumptions reveals the assumption isn't innocently unrealistic - it's distorting the very thing the model is being used to decide. The six percent accuracy is less important than that specific fragility.

  To really test between these rules, I'd want to see a model with unrealistic assumptions used outside its validation range - like applying that frictionless plane model to earthquake safety calculations. How he treats validated-but-misapplied abstractions would be revealing.
answer: |-
  ### The rule he seems to be running  
  He evaluates whether an unrealistic assumption *breaks the causal chain* the model needs to capture for its intended use. If the simplification filters out noise without distorting the core mechanism driving the outcome—or if the distortion is bounded and verifiable—it passes. If the assumption masks a critical dynamic (like contagion pathways, adaptive behavior, or panic feedback loops) that the policy intervention *directly interacts with*, it fails. The assumption’s realism matters only insofar as its falseness corrupts the model’s ability to isolate the lever being pulled.  

  ### Other rules that fit just as well  
  1. **Contextual Immunity**: An assumption is acceptable if the model’s validation *specifically covers the scenario where the assumption is most likely to fail*. The ocean model passed because they tested the wavelengths where depth mattered; the flu model failed because homogeneous mixing wasn’t tested under collapse conditions.  
  2. **Error Directionality**: He greenlights assumptions that bias predictions *against* the policy’s goal (e.g., zero transaction costs might underestimate compliance costs, making cap-and-trade seem harder than it is). He kills those hiding tail risks (e.g., stable discount rates ignore procrastination, making auto-enrollment seem more effective than it is).  

  ### What each one says about the bridges  
  - **Causal Chain Rule**: The original model fails. Drivers *aren’t* global optimizers; detour signs and app usage *directly alter* route choices. The flipped ranking proves the assumption breaks the decision mechanism (bridge choice depends on real-time adaptation).  
  - **Contextual Immunity**: Reject. The model was validated on past closures, but *not* tested against scenarios where adaptive routing (e.g., apps) would flip outcomes—which is exactly this case.  
  - **Error Directionality**: Approve. The original model’s "perfect knowledge" likely *underestimates* congestion (drivers cluster on "shortest" paths), making the closure seem less disruptive than reality. This biases the decision conservatively.  

  The rules diverge on how they weight the flipped ranking: Causal Chain sees it as fatal; Contextual Immunity demands new validation; Error Directionality dismisses it as harmless conservatism.  

  ### Your call  
  He kills it. The university model’s flipped ranking exposes a vulnerability in the core assumption that directly impacts the decision—exactly like the homogeneous flu model masking why cases collapsed. His joke about the labor auction ("false as can be, and that’s the point") hints he accepts *useful* fictions, but here the fiction is *misleading*: it erases the adaptation dynamics the detour signs aim to influence. The 6% accuracy is a red herring; the structural flaw in the mechanism is decisive.  

  ### The case that would settle it  
  Submit a climate model assuming constant cloud cover to project crop yields under a proposed irrigation policy. It nails historical data in temperate zones but fails spectacularly in monsoonal regions (unvalidated context). If he approves it, he’s following Error Directionality (constant clouds likely overestimate drought risk, making irrigation seem more urgent). If he kills it, he’s enforcing Causal Chain (cloud dynamics drive water stress) or Contextual Immunity (monsoons are a critical untested edge case). The absence of "flipped outcomes" would force the rules to show their true priorities: bias tolerance versus structural fidelity.
