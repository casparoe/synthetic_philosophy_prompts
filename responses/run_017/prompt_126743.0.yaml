  - Variant 1 (PV): 8 envelopes, each containing two slips of paper. One slip with "Your private value: [X] points" (X is a random number between 50 and 100, generated uniformly). The other slip for the opponent with a different random number in the same range. Important: the two values in the same envelope should be drawn independently.
  - Variant 2 (GP): 8 envelopes, each containing one slip of paper that explains the rules and the growing pot prize (pot = sum of all bids).
  - For each pair: a bidding sheet to record bids (player A and player B alternating, with the bid amount and who made it).
  - A master sheet for the TA to record outcomes.
  - Prizes: Raffle tickets based on final points. For example, every 100 points = 1 raffle ticket. And then at the end of the class, draw for a few small prizes (e.g., candy bars or $5 gift cards). But note: negative points are possible. We can set a floor at 0? Or allow negative but then they get 0 tickets. To avoid bankruptcy, we start with 200 points, and we hope that no one goes below 0. We can also cap the bidding? But that might interfere. Alternatively, we can use Monopoly money and not worry about capping, but then the raffle tickets are based on final points with no floor.

    Since the department says no real money, we can use points and then convert to raffle tickets: 
        raffle tickets = max(0, floor(final_points / 100))
    This way, negative points get 0 tickets.

  **Timeline (50 minutes):**

  0-5 min: Setup and instructions.
    - Divide the class into two halves: 8 students in the PV group and 8 in the GP group. Then pair them within their group (so 4 pairs in PV and 4 pairs in GP). 
    - Distribute envelopes: for PV pairs, one envelope per pair with two slips (each player takes one slip and does not show it to the other). For GP pairs, one envelope per pair with the rules (which they both can read).
    - Explain the rules verbally to the whole class, using a whiteboard if possible. Do not use the terms "sunk cost" or "escalation".

    Instructions for both variants:
      "You will be paired with one other person. You will play an auction game. The auction will proceed in turns. Player A starts by bidding 1 point. Then Player B can either pass or bid 2 points. Then Player A can pass or bid 3 points, and so on. Each bid must be exactly 1 point higher than the previous bid.
       If you pass, you are out of the auction. At the end, the player who did not pass wins.
       Important: at the end, both players will pay the sum of every bid they made during the auction. The winner will also receive a prize. 
       In the Private Value (PV) group: the winner's prize is a fixed number of points that is written on your slip. Only you know your own prize value.
       In the Growing Pot (GP) group: the winner's prize is the total amount of points that were bid by both players combined (the pot).
       You start with 200 points. Your final points will be: 
          200 - (sum of your bids)   [for the loser]
          200 + (prize) - (sum of your bids)   [for the winner]
       These points will be converted to raffle tickets at the end (100 points = 1 raffle ticket)."

    Also, clarify: "You are to play only one auction with your partner."

  5-25 min: Play the game (20 minutes).
    - Each pair plays one auction. They record the bids on the bidding sheet. The TA circulates to answer questions (but without giving strategy advice). 
    - The TA also watches to see when auctions end. Some might end quickly, some might escalate.

  25-40 min: Data collection and setup for debrief (5 minutes) and then discussion (10 minutes).
    - The TA collects the bidding sheets and records for each pair: 
        - PV or GP
        - The two private values (for PV)
        - The entire bidding history
        - The winner, the final bid, the sum of bids for winner and loser, and the net points for both.
    - The TA also asks for a show of hands: 
          "In the PV group, how many winners ended up with a net gain? Net loss?"
          "In the GP group, how many winners ended up with a net gain? Net loss?"
          "In the PV group, how many pairs had bidding that exceeded at least one of the private values? Both private values?"
          "In the GP group, what was the highest bid reached?"

  40-50 min: Debrief (10 minutes).
    - Start by asking the students what they experienced. Ask for volunteers to share their auction story.
    - Then introduce the concept of escalation of commitment and sunk cost fallacy.
    - Map their experiences to the two variants:
          In PV: even though the prize was fixed and private, they might have bid beyond their own value because of the sunk costs (the bids they had already made). They were trying to avoid losing the sum they had already bid.
          In GP: the prize grew with the bidding, so it was rational to a point, but they might have escalated because the opponent's sunk costs became part of the prize (if they won, they would get the opponent's bids as well).
    - Discuss why escalation happens: 
          - The desire not to waste the investment already made.
          - The competitive nature: not wanting to lose to the other player.
          - In the PV game, the private information about values might have led to overbidding if they thought the opponent had a high value.
    - Highlight that in real life, it's hard to know when to quit because you don't know the opponent's costs or limits, and because the sunk costs feel like they should be recovered.

  **What can go wrong:**
  1. **Nobody bids at all:** In some pairs, both players might decide not to bid. To mitigate, ensure that the initial bid is low (1 point) and the potential gain is high. Also, the private value in PV is at least 50 points, so bidding 1 point is a good deal. In the instructions, you can say: "The first bid is only 1 point, and the prize is at least 50 points in the PV group, so bidding at least once might be attractive." But don't overemphasize strategy.

  2. **Someone bids forever because it's only points:** This is a real risk. To prevent this, you can set a time limit per turn (e.g., 10 seconds to decide) or a maximum bid (e.g., stop at bid 100). But if you don't want to interfere, you can let it go and then use it as an example in debrief. However, if one pair is taking too long, you can ask them to stop and then discuss what would have happened.

  3. **Confusion about the rules:** Walk around and clarify.

  4. **In the PV group, players might reveal their private values:** Instruct them not to.

  **What the game might not capture:**
  - In real escalation, there might be uncertainty about the future value of the project (e.g., in a startup, you don't know if it will succeed). In this game, the private value is fixed and known to the player. 
  - The game does not capture the possibility of partial information about the opponent's value (in PV) or the growth potential (in GP). In real life, you might have some information.
  - The game does not capture the emotional aspect of being deeply committed over time. The auction is short.
  - In real life, escalation can involve many more decision points and more complex factors.

  **Debrief Script:**

  "Thank you for playing. Let's look at what happened. 

  First, in the Private Value (PV) groups: 
    - How many of the winners ended up with a net gain? (show of hands) How many with a net loss?
    - How many pairs had bidding that went above one of the private values? Above both?

  In the Growing Pot (GP) groups:
    - How many winners had a net gain? Net loss?
    - What was the highest bid we saw?

  (Summarize the results.)

  What we just experienced is called 'escalation of commitment'. It's a phenomenon where people continue to invest in a losing proposition because they have already invested so much. They feel that if they quit now, they lose everything they've put in, but if they continue, they might turn it around. 

  In the PV auction, each bid you made added to your sunk costs. The next bid was only 1 point more, and if you won, you would get your private value and only pay the bids you made. But if you lost, you would lose everything you bid. So the fear of losing that sunk cost drove you to bid higher than you originally intended, and sometimes higher than the prize was worth.

  In the GP auction, the prize grew with every bid. This mirrors situations like building a bridge that is half done — the more you spend, the more valuable the finished project becomes. But here, the prize was the sum of all bids, so winning meant getting the opponent's sunk costs. This created a battle to capture the other's investment. 

  In both cases, what started as a small bid turned into a big loss for at least one player. Remember: in decision theory, sunk costs should be ignored. Only future costs and benefits matter. But in practice, that's hard to do.

  Can anyone share an example from real life where they've seen something like this happen?"

  (Allow discussion.)

  "Takeaway: escalation of commitment is a powerful force. To avoid it, set limits in advance and stick to them. And remember: the money, time, or effort you've already spent is gone — it's sunk. What matters is what you stand to gain or lose from here on out."

  **Additional note:** 
    - In the PV auction, the equilibrium would involve dropping out when the bid exceeds your private value. But the sunk cost fallacy can lead people to bid beyond. 
    - In the GP auction, the growing prize might make it rational to bid more, but it can also lead to a trap.

  We hope that the students will feel in their gut the escalation trap.
answer: |-
  ### Auction Game Design for Escalation of Commitment  
  **Core Insight:** Create a situation where bidding is initially rational (due to private values or growing stakes) but escalates beyond the prize's worth due to sunk costs. Players should feel the "local rationality" of each bid while seeing the global irrationality.  

  ---

  ### **Materials & Setup**  
  - **Participants:** 16 students → 8 pairs.  
  - **Groups:**  
    - **Variant 1 (Private Value - PV):** 4 pairs.  
    - **Variant 2 (Growing Pot - GP):** 4 pairs.  
  - **Points System:**  
    - Each student starts with **200 points**.  
    - Points convert to raffle tickets (e.g., 100 points = 1 ticket for a $5 gift card raffle).  
  - **Materials:**  
    - **PV Group:** 4 envelopes, each with 2 slips (one per player) showing a **private value** (randomly assigned: 60, 70, 80, or 90 points).  
    - **GP Group:** 4 slips explaining the pot rule: *"The winner gets the pot, which equals 50% of all bids made by both players."*  
    - Bidding trackers (paper to record bids).  
    - Timer.  

  ---

  ### **Rules for Both Variants**  
  1. **Bidding Structure:**  
     - Players in a pair take turns. Player A starts.  
     - Minimum bid: **1 point**. Each subsequent bid must be **exactly 1 point higher** than the previous bid.  
     - Players can **pass** at any turn.  
  2. **Outcome:**  
     - **Winner:** Last player to bid.  
     - **Loser:** Player who passes.  
     - **Payments:**  
       - **Winner:** Receives prize (PV: their private value; GP: 50% of total bids) **minus sum of their own bids**.  
       - **Loser:** Pays **sum of their own bids** (gets nothing).  
     - Final points: `200 + net winnings/losses`.  
  3. **Key Differences:**  
     - **PV:** Prize is fixed (private value). Players know only their own value.  
     - **GP:** Prize grows dynamically: *Pot = 50% × (Sum of all bids)*.  

  ---

  ### **Timeline (50 Minutes Total)**  
  1. **Setup (5 mins):**  
     - Split class into 8 pairs (4 PV, 4 GP).  
     - Distribute envelopes/slips. **Do not reveal "escalation" or "sunk costs" yet.**  
     - Briefly explain rules (emphasize: "Each bid must be 1 point higher than the last").  

  2. **Gameplay (20 mins):**  
     - Start timer. Pairs play simultaneously.  
     - **TA Role:** Circulate, enforce rules, and nudge stalled pairs (e.g., "Player A, it’s your turn").  
     - **Record:** Note when bidding exceeds prizes or causes net losses.  

  3. **Data Collection (5 mins):**  
     - Poll pairs publicly:  
       - *PV:* "Did anyone’s final bid exceed their private value?"  
       - *GP:* "What was the highest bid in your auction?"  
       - *Both:* "Did winners end up with net gains or losses?"  
     - Tally results on board.  

  4. **Debrief (20 mins):**  
     - **Step 1: Elicit Observations (5 mins)**  
       - Ask: *"What did you notice? When did bidding feel rational? When did it feel irrational?"*  
       - Highlight quotes (e.g., *"I had to keep bidding to protect my earlier bids"*).  
     - **Step 2: Map to Concepts (10 mins)**  
       - **PV Groups:**  
         - *Reality:* Most bidders exceed their private values.  
         - *Concept:* **Sunk cost fallacy** – "I’ve invested 40 points; if I quit now, I lose it all. One more bid might save it."  
         - *Lesson:* Bidding is locally rational (protecting past investments) but globally disastrous.  
       - **GP Groups:**  
         - *Reality:* Bids escalate higher/faster than PV.  
         - *Concept:* **Endogenous stakes** – The pot grows as bids increase, mimicking real-world cases (e.g., a startup that’s burned cash becomes harder to abandon).  
         - *Lesson:* Escalation intensifies when costs *create* new value (e.g., finishing a half-built bridge).  
       - **Connect Both:**  
         - *"In PV, you escalated to avoid losses. In GP, you escalated because the prize grew. Both mirror real decisions like wars or failing projects."*  
     - **Step 3: Limitations & Takeaways (5 mins)**  
       - *Limitation:* Real escalation involves uncertainty about the future (e.g., "Will the next bid save the project?"). This game simplifies it to known probabilities.  
       - *Takeaway:* Set **pre-commitment points** (e.g., "I’ll quit if bids exceed 80% of my value") to avoid emotional traps.  

  ---

  ### **Predicted Problems & Fixes**  
  1. **Problem: No one bids.**  
     - *Why:* Fear of loss or confusion.  
     - *Fix:* "Player A, your first bid is only 1 point. If you win, you could gain 59+ points."  

  2. **Problem: Bidding spirals indefinitely.**  
     - *Why:* "It’s just points!" → No skin in the game.  
     - *Fix:* Remind players raffle tickets are at stake. Cap bids at 100 points if needed.  

  3. **Problem: GP pairs misunderstand the pot.**  
     - *Why:* 50% growth is abstract.  
     - *Fix:* Give an example: *"If total bids = 20 points, pot = 10 points."*  

  4. **Problem: PV players reveal values.**  
     - *Why:* Accidental slips.  
     - *Fix:* "Keep your value secret—it’s part of the game!"  

  ---

  ### **What This Game Can’t Capture (Must Explain)**  
  - **Uncertainty vs. Certainty:** Real escalation often involves ambiguity (e.g., "Will the next investment turn things around?"). Here, values are known.  
  - **Emotional Sunk Costs:** Real decisions involve pride, reputation, or ego—hard to simulate with points.  
  - **Social Pressures:** In life, peers or bosses force escalation. Here, only one opponent exists.  

  **Post-Game Script for These Gaps:**  
  > *"In real life, you rarely know the exact value of ‘winning.’ You might escalate because you hope things will improve, or because quitting feels like admitting failure. This game shows how easy it is to fall into that trap—even when you ‘know’ the rules."*  

  --- 
  **Why This Works:**  
  - **PV Variant:** Uncertainty about opponents’ values + sunk costs = rational early bids that escalate irrationally.  
  - **GP Variant:** Growing stakes mirror projects where costs *create* new value (e.g., R&D), making escalation feel justified longer.  
  - **Debrief:** Uses lived experience to anchor theory, avoiding "tricked" feelings by making escalation feel organic.  

  Run this, and students will leave feeling the trap in their guts—not just their notes.
