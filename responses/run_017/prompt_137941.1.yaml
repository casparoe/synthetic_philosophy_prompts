  **Joke:**  
  Two food truck rivals, Pat and Chris, face off daily. Pat declares, "I'll park at the Plaza every morning—safe, steady dollar, no surprises!" Chris scoffs, "What if I go to the Airport?" Pat smirks, "You won't—it's a disaster for you." Chris pauses, then shrugs: "Fine, I’ll stick to Marina or Courthouse like a rational person." Pat’s face falls as their game-theorist friend whispers: "And just like that, your safe bet is worse than flipping a coin between Marina and Courthouse. Your stability only worked when Chris was *threatening* to be irrational."  

  ---  
  **Breakdown:**  
  - **Airport column elimination:** Column (Chris) eliminates "Airport" first because it’s strictly dominated by a 50/50 mix of Marina/Courthouse.  
    - Against Row’s Marina: 50/50 mix gives Chris 1.0 > 0.5 (Airport’s payoff)  
    - Against Row’s Courthouse: 50/50 mix gives Chris 1.0 > 0.5  
    - Against Row’s Plaza: 50/50 mix gives Chris 0 > -1  
  - **Plaza row elimination:** Once Airport is gone, Row’s Plaza (payoffs 1, 1) is strictly dominated by a 50/50 mix of Marina/Courthouse.  
    - Against Column’s Marina: 50/50 mix gives Pat 2 > 1 (Plaza’s payoff)  
    - Against Column’s Courthouse: 50/50 mix gives Pat 2 > 1  
  - **Numbers check:** Correct. Plaza is *not* dominated while Airport exists (e.g., if Chris plays Airport, Pat gets 10 at Plaza—better than Marina’s 0 or Courthouse’s 0). But when Airport is removed, Plaza’s flat $1 is beaten by the 50/50 mix’s average $2.
