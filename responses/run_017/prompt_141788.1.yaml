  Diagnostically, the Sealed Annex is probably the most pivotal case - it's the purest test of cosmological realism without computational or consciousness complications. If that case falls, the whole framework likely collapses. The biggest mover would be rejecting realism about unobservables, as that would make all cases indeterminate.

  Resolution won't come from empirical evidence since that's ruled out by stipulation. It would require conceptual arguments about metaphysics and ontology - perhaps demonstrations that certain positions lead to contradictions, or that some frameworks better explain scientific practice.

