      "change_to_the_case": "The players received written warnings that grays are unprotected and not backed up, yet continued raising it.",
      "predictions": "Rules-Recognized/Consented Risk: Strengthens dismissal (assumed risk). Substantial Investment: Weakens appeal (recklessness).",
      "why_it_decides_it": "It forces mods to choose: does prior warning absolve harm to investment (aligning with Ruling 2/3), or is unique creation still protected (aligning with Ruling 1/5)?"
    }
  }
