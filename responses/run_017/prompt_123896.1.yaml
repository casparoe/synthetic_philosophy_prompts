prompt: |-
  You are a philosopher of history who works alongside historians — fluent in the analytic literature on counterfactuals, causation and path dependence, and equally fluent in the historians' arguments about contingency, determinism and the uses of the counterfactual in explanation. I need you to design something, not to survey a field. Think carefully before you write: work out first which distinctions from that literature a procedure usable by a non-specialist must preserve, and which it can afford to collapse. Do not cite anything and do not name books or authors; I cannot check them and they would not help me. Use no technical vocabulary you have not translated into terms a working novelist could act on.

  I write historical fiction, and my last three novels have been what I would call low-divergence alternate history: one or two changes to the historical record, everything else left as it was, the interest lying in what follows. I am contracted for two more, and my editor now wants each premise signed off before I draft rather than after. I make premise-level divergence decisions roughly thirty times per book, each one in half a working day, and a bad one is expensive: it is discovered in draft, it unravels months of work, and it is the first thing reviewers attack. My resources are a historical consultant for ten hours across both books, no training in philosophy or economics, and an editor who will read the procedure but will not read theory.

  Please write me a decision procedure I can actually run on a proposed divergence, ordered as questions with stop rules. It must, at minimum, handle the following, in my terms:

  Say what I mean when I say an outcome was inevitable. I keep conflating two things: an outcome that had several independent sufficient causes, so that removing the one that actually operated would only have delayed it or routed it differently, and an outcome that merely feels unavoidable because it happened and the accounts are organized around it. Give me a test that separates these, and a rule for what a premise must do when the outcome I want to avert belongs to the first kind.

  Make me keep a cancellation ledger: the actual facts my premise silently negates — later events, works, institutions that depended on the thing I removed — and a stop rule for when the ledger gets too long for a low-divergence book.

  Handle latency: the gap between the divergence and the first difference any contemporary could in principle have noticed. Some of my premises have a latency of days, others of two generations, and I do not know what the second kind commits me to.

  Handle reconvergence: the well-known fact that most divergences drain back into something like the actual course within a few decades. I need to know whether my book is required to dramatize that draining away, and on what grounds I may decline to.

  Flag hindsight contraband: places where a character's reasoning quietly presupposes a trend — the rise of this or the decline of that — that only became visible long after they lived.

  And give me a name and a use for the pattern I keep falling into myself: the more badly an audience wants a divergence to be true, the less I scrutinize whether it was cheap. I suspect this is a systematic failure of my own judgment and not just carelessness.

  Mark every point where the procedure stops with no, every point where it hands a question to my consultant as a factual matter, and every point where it hands the question back to me and my editor as a matter of values or of what kind of book this is. Be explicit about which distinctions you simplified away.

  Then run it on three of my premises. One is a congress of the great powers in 1814–15 that breaks up over the disposal of a Polish and a Saxon territory, leaving no settled concert and a nineteenth century thatopens with general war. One is a world in which the great influenza pandemic after the First World War does not occur. The third is the one I have already drafted sixty pages of, and it is the one I expect you to damage: a ruling in a Westminster court in the early 1770s, reasoned differently by the judge, ending the Atlantic slave trade a century early.

  Format: lead with a single sentence stating what the procedure is for and what it will refuse to decide. Then at most eight numbered steps, each with its sufficient-answer condition and its stop or hand-off rule. Then the three worked applications. Then a closing section on what the procedure cannot tell me. No footnotes, no bibliography, no headings beyond those four parts. The whole document must be no more than 1,000 words, including the one sentence you spend telling me which distinctions you dropped and why.
reasoning: |-
  Hmm, the user is a historical fiction novelist working on low-divergence alternate history novels. They need a practical decision procedure to evaluate premise-level divergences efficiently, avoiding costly mistakes during drafting. Their key requirements include: defining "inevitable" outcomes, maintaining a cancellation ledger, handling latency periods, managing reconvergence, flagging hindsight bias, and identifying a personal judgment pattern they call "wishful divergence".

  I need to design a focused tool that collapses philosophical complexities into actionable steps while preserving critical distinctions. The procedure must:
  - Separate structurally inevitable outcomes (multiple sufficient causes) from psychologically inevitable ones (narrative framing)
  - Track negated historical facts with a stop rule for ledger length
  - Assess latency periods and their implications
  - Determine if reconvergence requires dramatization
  - Identify anachronistic character reasoning
  - Name their "wishful divergence" bias

  For simplification, I'll collapse:
  - Determinism vs. contingency into "multiple sufficient causes" test
  - Path dependence complexity into cancellation ledger length threshold
  - Epistemic vs. metaphysical necessity into practical inevitability assessment

  The core structure will be:
  1. Define the change and desired outcome
  2. Test for structural inevitability
  3. Build cancellation ledger
  4. Assess latency period
  5. Check for reconvergence pressure
  6. Scan for hindsight in character reasoning
  7. Apply wishful divergence audit
  8. Final go/no-go decision

  For the worked examples:
  1. 1814 Congress breakdown: Test if Concert of Europe had multiple foundations. Ledger includes post-1815 treaties. Latency immediate. Reconvergence likely through other diplomatic channels.
  2. No 1918 flu pandemic: Inevitability test on pandemic causes. Ledger covers mortality-dependent events. Latency short. High reconvergence pressure on interwar period.
  3. 1770s slave trade ruling: High-risk case. Structural inevitability test crucial (economic/social factors supporting slavery). Massive ledger of negated developments. Latency period creates character reasoning challenges.

  The procedure will explicitly mark:
  - STOP points (fatal flaws)
  - CONSULT referrals (factual checks)
  - HANDOFF points (creative decisions)

  Limitations note will address: granular ripple effects, character believability tensions, and thematic alignment - all remaining artistic judgments.
answer: |-
  **Procedure Purpose**: To test if a historical change premise can support low-divergence fiction by identifying factual contradictions, unnoticed dependencies, and narrative traps — but refusing to judge if the *story* is worth telling.  
  *(Dropped: fine distinctions between metaphysical determinism and epistemic bias; collapsed all "causes" into observable enabling conditions.)*

  1.  **Define Change & Target**: *What exactly are you changing (event, decision, condition), and what specific outcome do you want to avert?*  
      *Sufficient Answer*: Precise, narrow descriptions of both.  
      *Stop/HANDOFF*: If vague (e.g., "make X nicer"), STOP. If target outcome is broad (e.g., "prevent industrialization"), HANDOFF to editor: Is this still low-divergence?

  2.  **Test "Inevitable" Target**: *Could the target outcome have been achieved another way if your changed thing didn't happen? Look for: (a) Other groups/leaders pushing the same goal independently, (b) Underlying trends (tech, economics, ideas) making it likely soon after, (c) The outcome solving a persistent problem.*  
      *Sufficient Answer*: "Yes, because [specific other cause/trend]" OR "No, only this path existed because [specific unique dependency]".  
      *Stop/CONSULT*: If "Yes", STOP unless you *want* only delay/reroute (HANDOFF to editor). If unsure if other causes existed, CONSULT historian.

  3.  **Build Cancellation Ledger**: *List actual later events, works, or institutions that DIRECTLY required the unchanged thing or the now-averted target outcome. Start with the obvious (e.g., person Y's career if you kill X; treaty Z if you prevent the war that caused it).*  
      *Sufficient Answer*: Bullet-point list growing from the change.  
      *Stop*: If list includes >3 major, widely known post-divergence historical facts (e.g., Waterloo, *On the Origin of Species*, the Eiffel Tower) OR requires canceling >10 minor-but-plausibly-known facts. *Low-divergence broken.*

  4.  **Assess Latency**: *When would a perceptive contemporary *first* notice *something* was different? (Not the full change, just anomalies: e.g., a person missing, a rumor circulating, a shipment delayed).*  
      *Sufficient Answer*: Timeframe (days/months/years) and the first plausible detectable anomaly.  
      *HANDOFF*: If latency >15 years, HANDOFF to editor: You must either set scenes showing generational change OR accept characters acting without knowing the divergence's consequences.

  5.  **Check Reconvergence Pressure**: *Identify a powerful actual trend (tech, demography, economics, ideology) that would actively push the world *back* toward the original outcome within 50 years (e.g., industrialization demands coal; population pressure seeks new farmland).*  
      *Sufficient Answer*: "Strong pressure via [trend]" OR "No strong pressure; divergence could hold".  
      *HANDOFF*: If strong pressure exists, HANDOFF to editor: You must either show this pressure working OR state why it fails in this timeline.

  6.  **Flag Hindsight Contraband**: *Do any characters *assume*, plan, or despair about long-term outcomes (rise/fall of X) that weren't clear contemporary concerns?*  
      *Sufficient Answer*: List specific character thoughts/dialogue lines that imply knowledge of the *actual* future trend.  
      *Stop*: If found, STOP. Rewrite using only period-visible trends (e.g., "slavery is expanding" not "slavery will dominate the 19th century").

  7.  **Apply 'Wishful Divergence' Audit**: *Is this change appealing because it fixes an injustice or avoids a horror? Rate your emotional investment (1=cold, 5=passionate).*  
      *Sufficient Answer*: Rating + one sentence on why it feels "right".  
      *HANDOFF*: If rating >=4, HANDOFF to editor: Demand extra scrutiny on Steps 2, 3 & 6. *Your desire blinds you to cheapness.*

  8.  **Final Viability**: *Do Steps 1-7 produce no STOP, resolvable CONSULTs (<1hr research), and acceptable HANDOFFs?*  
      *Sufficient Answer*: Yes/No.  
      *HANDOFF*: If "Yes", HANDOFF to editor for approval. If "No", discard premise.

  ---

  **Worked Applications**:

  1.  **1814 Congress Breaks Up**  
      (1) Change: Diplomatic collapse over Poland/Saxony. Target: Prevent Concert of Europe.  
      (2) CONSULT: Was Concert inevitable? (Likely yes – mutual fear of revolution existed). HANDOFF: Accept reroute? Editor says delay war, not prevent.  
      (3) Ledger: Congress treaties, some borders, Carlsbad Decrees. <3 majors? YES.  
      (4) Latency: Days (news of breakdown).  
      (5) Reconvergence: Strong (monarchist solidarity vs revolution). HANDOFF: Show war, then *new* congress forming.  
      (6) Hindsight: Characters fear "century of war"? STOP. Rewrite to fear *imminent* war.  
      (7) Wishful: 3 (Avoids repression? Ambivalent).  
      (8) VIABLE after (6) fix.

  2.  **No 1918 Influenza Pandemic**  
      (1) Change: Virus doesn't jump to humans/mutate. Target: Avert mass mortality.  
      (2) CONSULT: Was pandemic inevitable? (Likely no – specific viral event).  
      (3) Ledger: Death-dependent events (e.g., specific elections, some art). <3 majors? YES.  
      (4) Latency: Weeks (local outbreaks missing).  
      (5) Reconvergence: Strong (post-war upheaval continues). HANDOFF: Show unrest manifesting differently.  
      (6) Hindsight: Characters cite "lost generation"? STOP. Use "our boys are weary".  
      (7) Wishful: 5 (Saves lives!). HANDOFF: Triple-check (3) – does ledger *really* stay small?  
      (8) VIABLE after (6) fix & (3) verify.

  3.  **1770s Court Ruling Ends Slave Trade Early**  
      (1) Change: Judge's reasoning in *Somerset*-like case declares slavery illegal in Empire. Target: End Atlantic slave trade by 1780.  
      (2) CONSULT: Was trade's continuation inevitable? *Likely YES*. Multiple causes: plantation economics, naval power dependence, racial ideology. STOP unless target is *delay*. Editor: Change target to "starts decline"?  
      (3) Ledger: Abolitionist movement structure, slave revolts (timing), Caribbean economies, US Constitution clauses, industrial capital sources... >10 minors + majors (e.g., Haitian Revolution). STOP. *Ledger too long for low-divergence.*  
      (4) *(Procedure halts at (2)/(3). Latency (months for planters to react) irrelevant. Hindsight (characters foresee abolition?) likely present but masked. Wishful: 5 – requires rigorous restraint.)*

  ---

  **What This Cannot Tell You**:  
  -   How *small* ripples (a missed letter, a single death) cascade; that's your novelist's skill.  
  -   When period-acceptable character choices feel *implausible* to modern readers; that's beta-reader territory.  
  -   If the divergence serves your *theme*; that's between you and your editor.  
  -   How to research the answers; that's your consultant's role.  
