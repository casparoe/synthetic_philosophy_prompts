prompt: |-
  I'm running a 90-minute session at our local rationalist-ish meetup next month — about a dozen people, mostly programmers plus one biologist, all of them have read the Sequences and argue like they have something to prove. I got landed with verbal disputes and what the metaontology people do with them. Don't explain the topic to me, I've definately read the standard stuff; I need a plan for how to teach it.

  The thing I actually want them to walk out able to do is pull apart three cases they currently collapse into one: (1) a dispute that is merely verbal; (2) a dispute that is "just about words" but where the word choice is load-bearing, i.e. the real normative or social stakes ride on which meaning gets adopted; and (3) a dispute where the verbal diagnosis is locally correct but the disagreement bounces — you dissolve "do Xs exist?" into a choice between two candidate meanings of the quantifier or two redescriptions of the same facts, and then find yourself in the exact same fight one level up, now about which redescription carves things at the joints. I've been calling (3) the bounce, and I want the session built around it, but I also want you to tell me if the bounce is a real phenomenon or just me failing to finish a paraphrase and mistaking my own incomptence for a philosophical discovery.

  So: what's the order the pieces have to go in, and what breaks if I reorder? I'm guessing I can't open with a definition of "verbal dispute" and I can't get to (3) before (1) and (2) are solid, but I want the dependency argument, not just the sequence. Give me the one example that should carry the whole session — it needs to be something this crowd cares about (agency, preferences, goals, mesa-optimizers, whatever), not the Ship of Theseus or tables or the hotdog thing, and tell me what property it has to have and what property it has to conspicuously lack to do the job.

  Misconceptions I predict: they'll decide this is just "taboo your words" with a philosophy hat on; someone will immediately try to use "that's a verbal dispute" as a debate-stopper the second he's losing; and at least one will take the deflationary payoff to be "the question was meaningless" rather than "the question was a choice with costs". Where in the sequence do I head each of those off, and is there a fourth one I'm not seeing?

  Then: how do I check at the end whether they can use the tool rather than repeat the slogan, and what should I openly refuse to cover in ninety minutes — including, maybe, whether (3) is a third-session topic I should cut entirely. Don't give me a reading list, nobody will do it, and please don't build anything on getting names and dates right.
reasoning: |-
  Hmm, the user is preparing a 90-minute session for a rationalist meetup group. They want to focus on distinguishing three types of disputes: (1) purely verbal, (2) verbal but with important stakes, and (3) what they call "the bounce" - where dissolving the dispute leads to the same conflict at a meta-level. They specifically want to center the session around this "bounce" concept, while also questioning whether it's a real phenomenon or just their misinterpretation.

  The audience consists of about a dozen people - mostly programmers plus one biologist - all familiar with the Sequences and prone to argumentative behavior. The user needs a structured teaching plan with clear dependencies between concepts, not explanations of the content itself. They want one strong example that resonates with this tech-savvy group (avoiding clichés like Ship of Theseus) and strategies to prevent common misconceptions like misusing "verbal dispute" as a debate-stopper or conflating dissolution with meaninglessness.

  Key requirements include:
  - A sequence that builds from (1) to (2) to (3) with explicit dependency reasoning
  - One core example (preferably about agency/optimization) that demonstrates all three cases
  - Tactics to preempt predicted misconceptions at specific points
  - An assessment method to verify skill acquisition (not just recall)
  - Clear scope boundaries for a 90-minute session

  The example needs to both clearly illustrate the differences and conspicuously lack properties that would muddy the distinctions. For this audience, concepts like "agent," "optimizer," or "goal" would work well since they're familiar with AI alignment discussions. A mesa-optimizer debate could effectively show how a dispute can be verbal, then reveal stakes, then demonstrate the bounce when pushed to meta-levels.

  I should structure the session with strict time allocation and include "circuit breakers" for when someone inevitably tries to weaponize "verbal dispute" as a shutdown tactic. The bounce phenomenon is definitely real and worth keeping - it's essentially about metaontological disagreements where the dispute recurs at the level of which conceptual framework carves reality at the joints.

  For assessment, I'll suggest a rapid-fire exercise with micro-disputes where participants must classify them and justify why, rather than just recite definitions. And I'll be explicit about what won't be covered: historical context, exhaustive taxonomy, or resolution techniques for type (3) disputes.
answer: |-
  Here's a battle-tested plan for your 90-minute session, optimized for your audience and focused squarely on operationalizing the distinction (especially the **bounce**), while preempting the predicted misconceptions.

  **Core Objective:** Enable participants to reliably distinguish between (1) Purely Verbal Dispute, (2) Verbal Dispute with Load-Bearing Stakes, and (3) The Bounce (Verbal Dispute Recurring at Meta-Level).

  **The Non-Negotiable Sequence & Why:**

  1.  **Priming: The Instinct & Its Failure (10 mins)**
      *   **What:** Start with a *very short*, high-energy, relatable *bad* argument snippet where someone declares "That's just semantics!" or "Verbal dispute!" as a shutdown move. (E.g., "Is GPT-4 *really* intelligent?" "No, it's just pattern matching!" "That's just semantics!"). Immediately poll the room: "Who wins?" "Is this helpful?" "Why/Why not?".
      *   **Why First?** Activates their existing flawed model/instinct. Creates cognitive dissonance ("We do this, but it feels cheap"). Establishes the *problem* before the solution. **Preempts Misconception:** Immediately shows that using "verbal dispute" as a debate-stopper *is the problem we're solving*, not the tool we're teaching. It frames the session as upgrading a broken instinct.

  2.  **Core Concept: Dissolving Purely Verbal Disputes (Type 1) (15 mins)**
      *   **What:** Define *minimally*: A dispute is **purely verbal** if, after clarifying definitions explicitly ("When you say X, do you mean A or B? When I say X, I mean C"), disputants agree on *all* underlying non-verbal facts/states of the world, but still prefer different labels. Use a *simple, non-loaded tech example* first: "Is this code structure a 'factory pattern' or just a 'builder wrapper'?" Show the dissolution: Agree on code structure (facts), agree the labels are arbitrary *here*, dispute vanishes.
      *   **Why Now?** Establishes the baseline skill (paraphrase/define). Shows the *ideal* dissolution payoff: agreement on facts, recognition of label arbitrariness. **Preempts Misconception:** Clearly separates "dissolved into agreement on facts + label choice acknowledged as arbitrary" from "meaningless". The *choice* aspect is subtly introduced but stakes are low.
      *   **Crucial Property:** The example **MUST** have *zero significant stakes* attached to the label choice. It should feel trivial after dissolution.

  3.  **Introducing Stakes: When Words Bear Weight (Type 2) (20 mins)**
      *   **What:** Transition to your **Core Example**. **This must carry the session.** Recommendation: **"Is this AI system an *agent*?"** (or "...a *mesa-optimizer*?" or "...*goal-directed*?").
          *   **Step 1 (Type 1 Attempt):** Dissolve naively. "Define 'agent'." Alice: "Anything that takes actions to change state." Bob: "Requires explicit internal goal representation & planning." They agree on *exactly what the system does* (its inputs, outputs, internal computations, effects on environment). But... they *don't* agree the label choice is arbitrary.
          *   **Step 2 (Reveal Stakes):** Ask: *"Why do you care which label gets used?"* Draw out the stakes:
              *   Alice: "Calling it an 'agent' forces us to think about alignment/control *now*, even if simple."
              *   Bob: "Calling it an 'agent' when it lacks explicit goals scares regulators unnecessarily/overloads the term."
              *   *Stakes:* Regulatory burden, funding allocation, research focus, safety prioritization, public perception, conceptual clarity in the field.
          *   **Property it MUST Have:** Clear, concrete, *non-verbal stakes* that hinge on *which label/concept wins* socially/normatively. Participants should viscerally feel "Oh, *this* matters!".
          *   **Property it MUST Lack:** At this stage, **avoid deep metaphysical joints**. The disagreement should be resolvable (in principle) by agreeing on the facts *and then* having a separate discussion about the *practical/social consequences* of adopting definition A vs. B for this system in this context. It's a *policy* choice about language, driven by non-linguistic consequences.
      *   **Why Here?** Builds directly on Type 1. Shows dissolution reveals agreement on facts, but *also* reveals a *new, important disagreement* about the *consequences* of language choice. **Preempts Misconception:** Hammers home that dissolution **doesn't** mean "meaningless" – it means revealing the *real* disagreement is about the *costs/benefits* of language conventions, which can be very significant.

  4.  **The Bounce: When Dissolution Bumps Upstairs (Type 3) (30 mins)**
      *   **What:** **Return to the Core Example ("Agent?"), but push deeper.** After dissolving to definitions & facts, and acknowledging stakes...
          *   Alice: "Fine, but *shouldn't* we define 'agent' based on functional behavior (optimizing *some* objective, even if emergent), because that's what matters for safety? The *joints are at the functional level*."
          *   Bob: "No, calling something an 'agent' without explicit goals obscures the *causal mechanisms*. The *joints are at the architectural/representational level*. Lumping them together is misleading!"
          *   **The Bounce:** The dispute recurs, *not* about the facts of *this specific AI system*, but about **which level of description/abstraction or conceptual framework 'carves reality at the joints'** for the *domain* (AI, cognition, etc.). It's now a meta-dispute about ontology or explanatory fundamentality.
      *   **Why Now?** Requires understanding Types 1 & 2 first. Type 2 reveals practical stakes; Type 3 reveals *metaphysical/epistemological* stakes about how we *should* conceptualize the world. **This is where you validate your phenomenon:** It's real! (See Carnap on frameworks, Quine on ontological relativity, debates over reductionism vs. emergence). The fight isn't about the object-level facts, or just the social consequences of a label, but about the *correct conceptual schema* itself.
      *   **Crucial Contrast:** Highlight the difference:
          *   Type 2: "We agree on what this thing *is* (facts), but calling it X has consequence Y, calling it Z has consequence W. Let's debate Y vs W."
          *   Type 3: "We agree on the low-level facts about this thing, but *disagree fundamentally on which high-level framework (functional vs. mechanistic) best captures the 'real' structure/potential/causal powers* of things like this. Choosing a framework dictates how we see the facts."
      *   **Is it Real?** Absolutely. It's the core of many philosophical impasses. Dissolving the object-level question ("Is it an agent?") reveals it was a proxy for a meta-level question ("Is the functional or mechanistic level more fundamental/joint-carving for understanding systems like this?").

  5.  **Synthesis, Recognition Drill & Scope Limits (15 mins)**
      *   **Synthesis (5 mins):** Recap the 3 types clearly, using the Core Example. Emphasize: Type 1 dissolves cleanly. Type 2 dissolves to reveal practical stakes for language choice. Type 3 dissolves to reveal a meta-ontological/metaphysical dispute about conceptual frameworks.
      *   **Recognition Drill (8 mins):** **How to Check Understanding (Skill vs Slogan):**
          *   Present 3-4 *new*, very brief dispute snippets (20-30 seconds each). Examples:
              *   (Type 1) "Is this a 'bug' or a 'feature'?" (After clarification: Agree on exact system behavior, agree label is arbitrary context).
              *   (Type 2) "Is CRISPR editing 'playing God'?" (Dissolves to facts about technique; stakes involve public acceptance, regulation, ethical boundaries).
              *   (Type 3) "Is consciousness an illusion?" (Dissolves to agreement on cognitive phenomena; bounces to dispute about whether the physical/neural level is the only "real" level, or if the phenomenal level is irreducible).
              *   (Tricky) "Is water H2O?" (Can be Type 1 if just about label; or touch Type 3 if about rigid designation vs. phenomenal concepts).
          *   **Task:** For each snippet, participants shout out (or hold up cards) 1, 2, or 3. **Crucially, for each, ask 1-2 participants: "Why? What would dissolution look like? What would the *next* disagreement be (if any)?"** Focus on their *reasoning process*, not just the number. This forces operationalization.
      *   **Scope Limits (2 mins - Be Blunt):** "What we *won't* cover: Resolving Type 3 disputes (that's a PhD, not 90 mins). Historical figures or debates (no names/dates). Every possible nuance. Deep dives into specific frameworks. The goal is *recognition* and *stopping bad shutdowns*, not becoming metaphysicians."

  **Why This Order? The Dependency Argument:**

  *   **Priming (1) is first** because you must establish the *failure mode* to motivate the need for the distinctions. Starting with definition is abstract and disconnected from their lived experience.
  *   **Type 1 (2) must precede Type 2 (3)** because Type 2 *builds on* the dissolution skill learned in Type 1. You need to know *how* to dissolve before you can see *what gets revealed* (stakes) after dissolution. Jumping straight to stakes makes Type 1 seem irrelevant.
  *   **Type 2 (3) must precede Type 3 (4)** for the same reason. Understanding that dissolution can *reveal* important non-verbal disagreements (stakes) is necessary before encountering the case where dissolution reveals a *meta*-disagreement (the bounce). Type 3 feels like a surprising twist on Type 2. Doing Type 3 first would be baffling.
  *   **The Core Example** threads through 2, 3, and 4, showing the *progression* from simple dissolution -> revealed stakes -> revealed meta-ontology. This coherence is vital.

  **Preempting the Other Misconceptions:**

  *   **"Just Taboo":** Head this off during Type 2. Explicitly contrast: "Tabooing 'agent' forces definition. That's Step 1. But Type 2 is about *why we care which definition wins* after tabooing. It's the *next step* that tabooing alone doesn't address."
  *   **"Meaningless" vs "Choice with Costs":** This is killed in Type 2. Hammer the question: "After dissolution, *is there still something important to disagree about?*" If yes (consequences of definition choice), it's NOT meaningless. Frame the outcome of Type 2 dissolution explicitly as: "The question wasn't 'Is it X?', it was 'What practical consequences follow if we *call* it X in this context?'".
  *   **Fourth Misconception (Likely):** **"So everything is Type 3 / It's turtles all the way down."** Head this off in the Synthesis/Scope: Acknowledge that deep down, *some* disputes might involve Type 3 questions. But emphasize: 1) Many disputes *aren't* (Types 1 & 2 are common and important). 2) Recognizing Type 3 is valuable *even if unresolved* – it tells you you're in a deep philosophical debate, not a simple factual or practical one, so adjust your expectations and tactics (e.g., appeal to pragmatic virtues of frameworks, not knockout proofs). Don't let Type 3 nihilism invalidate the utility of distinguishing all three.

  **Cutting Type 3?** Don't. It's the most novel and intellectually stimulating part for your audience, directly addresses your core concern, and validates your insight. The time allocation (30 mins) is realistic if you tightly control the Core Example progression and the drill. The value is in *recognizing* it, not solving it.

  **This plan gives them:** A clear progression, a memorable core example relevant to their interests, tools to diagnose disputes, immunity to the worst misconceptions, and practice applying the distinctions. Good luck! They're a lucky group.
