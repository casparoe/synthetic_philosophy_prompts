     - A is real.
     - There exists a frame F1 and a consistent cut C1 such that A and E1 are in C1 -> so E1 is real.
     - Then, since E1 is real, there exists a frame F2 and a consistent cut C2 such that E1 and E2 are in C2 -> so E2 is real.
