     The transitivity is in the chain of deductions, not in the concurrency relation. So the non-transitivity of concurrency does not break the argument. The argument only requires that we can form a chain of pairwise concurrent events (so that each consecutive pair can be put in a consistent cut together) and then we use the Reality Principle for each step.

  4. **Conclusion (translated):** Therefore, every event is real. So reality is the entire set of events (eternalism).

  ### Step 3: Metaphysical Views in Distributed Systems Terms

  - **Presentism:** Only the current consistent cut is real. There is one distinguished cut (the "now") that is constantly changing (by appending events that are happening now). But note: without a privileged frame, which cut? This is the problem.

  - **Growing Block:** The real is a consistent cut that is growing. The past and present are real, the future is not. The block is an append-only log of events. The cut is the entire log so far (so it's a consistent cut that includes all events that have happened).

