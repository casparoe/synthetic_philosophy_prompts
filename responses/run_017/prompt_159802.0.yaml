  2. Cut-relational presentism does not collapse into eternalism because it relativizes reality to observers. It avoids the R-P argument by denying absolute reality.
  3. Introducing a privileged foliation in special relativity is not allowed by the physics (it breaks the symmetry) and hence is a cheat in that context. But it might be acceptable in a theory that has such a foliation (like some cosmological models).
