                  - Total survival chance: 0.5*0.74 + 0.5*0.26 = 0.5.

     So agreed long-run survival frequencies:
          - S: 0.2
          - F: 0.2
          - C: 0.5
          - P: 0.5

  5. **Availability of coin and pill:** Both the coin and the pill are genuinely available acts. There is no barrier to performing them, and they are within the agent's control.

  6. **Standpoint for better than 0.5 chance:** Both agree that there is no standpoint from which any available act yields a survival chance above 0.5. The best available acts (delegation and pill) give 0.5.

  Part Two: Disagreements Table

  We now list the rows for disagreements. The columns are:
  - Causalist's own formulation
  - Evidentialist's own formulation
  - Verdict: substantive or verbal?

  We note that CDT and EDT will make different recommendations for the unaided acts (S and F) but agree on C and P.

  For CDT:
  - CDT uses counterfactual probabilities of states that are causally independent of the act. In this case, Death's location (dossier) is causally independent. So for CDT, the expected utility of an act is computed by the probabilities of states that do not depend causally on the act. Therefore, for S and F, CDT uses the fixed probabilities of the dossier: P(dossier says Aleppo) = 0.74, P(dossier says Damascus) = 0.26.
  - Then:
     - If you stay, you survive if Death is in Aleppo: 0.74 -> utility 1 for survival, 0 for death, so EU(S) = 0.74.
     - If you flee, you survive if Death is in Damascus: 0.26 -> EU(F) = 0.26.
     - For delegation (C): it leads to stay or flee with 0.5 each, so EU(C) = 0.5 * EU(S) + 0.5 * EU(F) = 0.5*0.74 + 0.5*0.26 = 0.5.
     - For pill (P): similarly, after the pill, your act is independent of the dossier, so EU(P) = 0.5 * (P(Death in Aleppo)) + 0.5 * (P(Death in Damascus))? Actually, after the pill, the state is fixed (dossier fixed) and your act is random and independent. So:
          - If you stay after pill: survive with P(Death in Aleppo)=0.74
          - If you flee after pill: survive with P(Death in Damascus)=0.26
          - So EU(P) = 0.5*0.74 + 0.5*0.26 = 0.5.

  So CDT says: stay (S) is best with 0.74, then delegation and pill at 0.5, and flee at 0.26.

  For EDT:
  - EDT uses conditional probabilities: P(state | act). The state is Death's location (or the dossier's prediction) and the act is what you do.
  - For S: P(survive | S) = P(Death in Aleppo | S) = P(dossier says Aleppo | S). How to compute?
     - We are given that the dossier predicts with 80% accuracy. So if you stay, the probability that the dossier predicted stay is 0.8, and then Death is in Damascus -> death. The probability that the dossier predicted flee is 0.2, then Death in Aleppo -> survival. So P(survive | S) = 0.2.
  - Similarly, P(survive | F) = 0.2.
  - For delegation (C): what is P(survive | C)? 
     - Note: EDT conditions on the act of delegation. But what does conditioning on delegation tell us about the dossier? The problem states that delegation leaves your credence that the dossier names Aleppo unchanged at 0.74. However, for EDT, we need P(Death in Aleppo | C). 
     - The act of delegation is chosen. The dossier was made for unaided act, but when you delegate, the dossier is still fixed. However, the evidential relation: does delegating provide evidence about the dossier? The problem says: "delegating leaves your credence that the dossier names Aleppo unchanged", meaning that conditional on delegating, your credence for the dossier saying Aleppo remains 0.74. So for EDT, P(dossier says Aleppo | C) = 0.74. Then:
          - Survival if C: 
               - If the coin says stay, survive if Death in Aleppo -> 0.74
               - If the coin says flee, survive if Death in Damascus -> 0.26
          - So overall, conditional on C, the survival chance is 0.5*0.74 + 0.5*0.26 = 0.5? But note: the coin flip is part of the act? Actually, the act is "delegate", and then the outcome depends on the coin. So the expected utility of C is the average of the outcomes. Thus EU(C) = 0.5 * [P(survive | C and coin=stay)] + 0.5 * [P(survive | C and coin=flee)].
          - Now, conditional on the act of delegation and the coin landing on stay, what is P(survive)? It's P(Death in Aleppo | C and coin=stay). But since the coin is random and independent of the dossier, and the delegation act doesn't change the dossier, then P(Death in Aleppo | C) = 0.74, and this is independent of the coin. So P(survive | C and coin=stay) = 0.74. Similarly, P(survive | C and coin=flee) = 0.26. Therefore, EU(C) = 0.5*0.74 + 0.5*0.26 = 0.5.

     Similarly, for the pill (P): 
          - Act: take the pill. Then your subsequent act is random (50% stay, 50% flee) and independent of the dossier. So P(Death in Aleppo | P) = 0.74 (as the pill doesn't change the dossier, and the problem implies that the credence remains). Then:
               - If you stay after pill: survive with prob 0.74
               - If you flee after pill: survive with prob 0.26
          - So EU(P) = 0.5*0.74 + 0.5*0.26 = 0.5.

  But wait: for unaided acts, EDT gets 0.2 for both S and F, and for C and P, 0.5. So EDT says: S and F are equally bad (0.2) and C and P are better (0.5). So EDT recommends either C or P.

  Thus, the disagreement is about the unaided acts: S and F.

  Disagreements:

  Row 1: **Which act is best in the unaided choice?**
  - Causalist: The best unaided act is to stay in Damascus, which has an expected utility of 0.74.
  - Evidentialist: Both unaided acts (staying and fleeing) are equally bad, each having an expected utility of 0.2. The agent should avoid both and instead choose delegation or the pill.
  - Verdict: Substantive. They disagree on the ranking of the unaided acts.

  Row 2: **The role of the presentiment (itch) in deliberation.**
  - Causalist: The itch is evidence about what you will do, but it is also evidence about the state (Death's location) because of the correlation via the dossier. However, because the state is causally independent, the itch should not influence the evaluation of the acts in the way that conditioning on the act does. Specifically, the causalist uses the unconditional probability of the state (0.74) for evaluating the act of staying, regardless of the itch's message. The itch is just part of the background evidence that sets the prior for the state.
  - Evidentialist: The itch is directly relevant evidence about the act you will take, and since the act is evidence about the state, the itch is also evidence about the state. When evaluating an act, we must condition on that act, and the itch is part of the total evidence. However, note that when we condition on the act, the itch's evidential value about the state is already incorporated in the conditional probability (because the act and the state are correlated). The evidentialist does not separately condition on the itch when evaluating an act because the act is what we are conditioning on. The itch is used to form the prior, but then when we condition on the act, we get the 0.2 probabilities.
  - Verdict: Substantive. They disagree on whether the itch should be set aside when evaluating the causal impact of an act.

  Row 3: **The interpretation of the 0.74 probability.**
  - Causalist: The 0.74 is the rational credence in Death being in Aleppo (or the dossier naming Aleppo) given all current evidence, including the itch. It is the correct probability to use for the state because the state is causally independent of the act.
  - Evidentialist: The 0.74 is the prior credence, but when evaluating an act, we must update on the act itself. Therefore, for the act of staying, the relevant probability of Death being in Aleppo is not 0.74 but the conditional probability given staying, which is 0.2 (since staying is evidence that Death is in Damascus). The 0.74 is not the probability to use for the state when the act is taken as given.
  - Verdict: Substantive. They disagree on how to compute the expected utility for an act.

  Row 4: **The status of the dominance reasoning.**
  - Causalist: Dominance reasoning is not applicable here because the states are not causally independent of the act? Actually, the causalist does not see dominance. The causalist notes that staying dominates fleeing in terms of the survival probability (0.74 vs 0.26) when using the fixed state probabilities.
  - Evidentialist: There is no dominance because both acts lead to the same conditional survival probability (0.2). Moreover, the evidentialist might point out that if the causalist's dominance reasoning were valid, then one could improve the survival chance by staying, but in fact, staying leads to death with 0.8 probability (by the conditional). So the dominance is spurious because it ignores the evidential link.
  - Verdict: Substantive.

  Part Three: Cruxes

  We list the sub-questions that, if settled, would move at least one of the two.

  Crux (a): Whether the itch is admissible as evidence about a fixed state when part of its evidential force comes from being evidence about your own act — that is, whether an agent may deliberate with, and then deliberately act against, a sign whose content is that she will do the other thing.

  - Both accept: The itch is a sign about what you will do (90% reliable). It is also, through the dossier, a sign about Death's location. But when evaluating an act, can we use the itch to form a prior about the state and then ignore it when we condition on the act? Or must we condition on the act and then update on the state without the itch?
  - Concrete case: Suppose the agent has the itch (saying flee) and is considering staying. The itch suggests she will flee (with 90% chance). But if she decides to stay, then she is acting against the itch. 
  - Causalist prediction: The agent should use the 0.74 probability for Death being in Aleppo when evaluating staying, and thus stay is better. The itch is just evidence that sets the prior; it does not constrain the evaluation of the act because the act is under her control and the state is fixed.
  - Evidentialist prediction: The agent must condition on the act of staying. Given staying, the probability that the dossier predicted stay is 0.8, so Death is in Damascus with 0.8, and survival chance is 0.2. The itch is part of the evidence that led to the prior, but once we condition on the act, we get the 0.2.

  Crux (b): Whether the quantity to be maximized is an act's expected utility by the agent's lights at the moment of action, or the long-run frequency of survival for agents who follow the policy the act instantiates, given that here those two quantities come apart.

  - Agreed that for S and F, the long-run frequency is 0.2, while the causalist's expected utility for S is 0.74 and for F is 0.26.
  - Concrete case: Consider a population of agents who are in this exact situation (with the itch) and who always stay. In the long run, what fraction survive? We agree it is 0.2. But the causalist, when in that situation, assigns 0.74 to survival if she stays. 
  - Causalist: The decision theory should maximize the expected utility by the agent's current credences. The long-run frequency is a separate matter and might be relevant for a policy, but for an individual decision, it is the current expectation that matters.
  - Evidentialist: The decision theory should maximize the conditional expected utility, which in this case matches the long-run frequency for the act. The evidentialist argues that the 0.2 is the relevant probability for the agent who chooses to stay because it conditions on her act.
  - How to settle: Both agree that the long-run frequency for stayers is 0.2. The causalist must explain why an agent should use 0.74 instead of 0.2. The causalist would say: because the 0.2 is not the causal probability. The 0.2 arises from the correlation, but the agent's act does not cause the dossier to change. The agent is in a situation where she has evidence that the dossier is likely to be Aleppo (0.74), so she should stay.

  Crux (c): What the pill option shows — whether the causalist's 0.74 is a reason for staying or an artifact of evidence she could have destroyed at no cost.

  - The pill erases the presentiment and then the agent chooses with 50% chance. Both agree that the pill option gives a 0.5 survival chance. 
  - Causalist: Without the pill, the agent has a credence of 0.74 that Death is in Aleppo, so staying gives a 0.74 chance of survival. The pill destroys the evidence (the itch) that made the agent think she would flee. But the causalist says: even without the pill, the agent can choose to stay and get 0.74. Why take the pill and reduce the chance to 0.5?
  - Evidentialist: The 0.74 is not a true chance of survival for staying; it is an artifact of the evidence. By taking the pill, the agent breaks the correlation between her act and the dossier, and then she can achieve 0.5. Without the pill, if she stays, her survival chance is only 0.2. So the pill option shows that the 0.74 is not a real opportunity for staying to yield 0.74 survival. 
  - Concrete case: Compare two agents: one takes the pill and then stays, the other stays without the pill. The causalist says the first has survival chance 0.74 (after pill) and the second also 0.74? But in fact, the agent without the pill who stays has survival chance 0.2 (by conditional probability). The agent with the pill and then stay: survival chance 0.74? Actually, after the pill, the agent's act is independent of the dossier, so P(survive | pill and stay) = P(Death in Aleppo) = 0.74? But wait, the dossier was made for the unaided act without the pill. And without the pill, the agent would have had the itch. But when the agent takes the pill, the dossier is fixed. So for the agent who takes the pill and then stays, the survival chance is indeed 0.74 (if the dossier names Aleppo). However, for the agent who does not take the pill and stays, the survival chance is 0.2. 
     - So why doesn't the causalist take the pill and then stay to get 0.74? The causalist does not need the pill: she can just stay and get 0.74. But the evidentialist says: without the pill, staying only gives 0.2. 
     - The causalist must explain why the same act (staying) has two different survival probabilities: 0.74 without the pill and 0.74 with the pill? But actually, without the pill, the causalist computes 0.74, but the evidentialist observes that the actual long-run frequency for staying without pill is 0.2. 

  Crux (d): Whether delegation to a coin is the sort of thing a decision theory may recommend, and what it would take for the dossier to have anticipated it.

  - Both agree that delegation gives a 0.5 survival chance. The causalist sees staying as better (0.74) so would not recommend delegation. The evidentialist sees delegation as better (0.5) than the unaided acts (0.2). 
  - Concrete case: Suppose the dossier method could anticipate the delegation. How would that change things?
     - The problem states that the dossier could not have anticipated delegation. But if it could, then the accuracy of the dossier for delegation might be different. For example, if the dossier is designed to predict the outcome of the coin flip? But the dossier was made yesterday, and the coin flip is today. So unless the coin flip is predetermined, the dossier cannot predict it. But if the dossier is a perfect predictor of the coin flip? Then if you delegate, the dossier would predict the coin flip correctly, so Death would be in the city the coin chooses, and you die for sure. 
     - But in our case, the dossier cannot anticipate delegation, so it's safe. 
  - The question: can a decision theory recommend an act that involves delegating to a random device? 
     - Causalist: Yes, in some cases, but here staying is better so she doesn't need to. 
     - Evidentialist: Yes, and here it is better than the unaided acts. 
     - The crux is whether delegation is a legitimate option and whether it breaks the correlation.

  Part Four: Closing Section (in my own voice)

  What is genuinely at stake: The core issue is whether decision theory should account for the evidential bearing of an act on the state when there is no causal path. In this case, the act does not cause the state (Death's location), but it is correlated because of the prediction. CDT holds that only causal consequences matter, so it uses the unconditional probabilities. EDT holds that all evidence matters, including the evidence that the act provides about the state. 

  The verbal disagreement: Part of the dispute might be verbal in the sense that they are using different notions of "expected utility". CDT defines expected utility one way (using causal probabilities) and EDT another (using conditional probabilities). But the substantive disagreement is about which quantity the rational agent should maximize. 

  In my judgment, the crux (b) is the deepest: should we maximize the current expected utility (by the agent's lights) or the success rate of the policy? Here, the causalist's current expected utility for staying (0.74) is not the actual success rate for staying (0.2). This discrepancy arises because the causalist's probability assignment does not condition on the act. The causalist might argue that conditioning on the act is inappropriate because the act is a free choice and does not cause the state. But the evidentialist counters that the act is evidence about the state, and ignoring that evidence leads to spurious claims.

