  The dispute between CDT and EDT is substantive, not verbal. At stake is whether rational choice should incorporate the *evidential implications* of acts (EDT) or solely their *causal consequences* (CDT). Here, acts lack causal power over states but carry rich evidence. This creates a rift: EDT’s act-conditioning yields identical EU for unaided acts (0.2), while CDT’s counterfactual approach favors staying (0.74). Both agree on breaking correlations via delegation or pill (EU=0.5), but CDT sees unaided dominance where EDT sees fatalism.  

