answer: |-
  The consent form glowed on the tablet, stark white. Paragraph 7.3: "Upon scheduled disconnection, Client must designate Primary Continuance Body (PCB) which shall retain all legal rights, responsibilities, and identities associated with the pre-procedure self. The Secondary Body (SB) will be administratively re-designated per standard protocols." Sarah tapped 'Agree'. The ink felt colder than the screen.

  For three months, she was Sarah-in-Paris and Sarah-in-Lisbon. The clinic’s high-bandwidth quantum link was flawless, seamless. She woke simultaneously in a sun-drenched Lisbon flat smelling of salt and stone, and a Parisian studio with the persistent, tinny thump of her neighbour’s television bleeding through the shared wall. *Both* were her body. *Both* were her senses. *I* drank coffee in Lisbon while *I* buttoned a blouse in Paris. *I* argued with a supplier in French while *I* soothed her daughter, Maya, crying over a scraped knee via video call from Lisbon. The clinic’s pre-op brochure promised this unity: "A Unified Cognitive Field, regardless of physical dispersal."

  The anchors were trivial, yet profound. In Lisbon, Sarah’s windowsill held a single, stubborn rosemary plant she’d bought on impulse. Its piney scent was her morning breath. In Paris, the neighbour’s TV, perpetually tuned to game shows or rolling news, was a constant, vaguely irritating hum, a rhythmic pulse beneath the city’s noise. These were *her* constants, the tactile proof of her doubled reality.

  The divergence wasn't betrayal; it was drift. Like continents quietly separating.

  Sarah-in-Lisbon started waking an hour earlier than the shared alarm. At first, it was just quiet time with the rosemary, watching the dawn gild the Tagus. Then, she ordered a small digital piano. Quietly. She left a note in the shared log: *Found a tutor. Always wanted to learn. Won’t interfere with work.* The notes were necessary, polite updates, increasingly the only direct communication as the lived experiences grew distinct.

  Sarah-in-Paris found the early Lisbon mornings jarring. The unexpected silence in her own (their?) head during that hour felt… spacious. She started staying out later. Not clubbing, just… lingering. A colleague introduced her to a community garden project tucked behind the Gare du Nord. She’d go after work, hands in the dirt, the neighbour’s TV temporarily replaced by the murmur of volunteers and the rustle of leaves. She left a note: *Joined the Rue Marx Dormoy Garden Collective. Good people. Getting my hands dirty.* She didn’t mention the easy laughter with Antoine, who ran the compost initiative. Or how the scent of damp earth was starting to eclipse the phantom smell of rosemary.

  The clinic sent reminders about the PCB designation form. The deadline loomed. The brochure offered guidance: "Your locus of agency determines your location. Where do your intentions originate and manifest? Where do you *act*?"

  Sarah-in-Paris read it while deadheading marigolds. *I act here,* she thought, feeling the gritty soil under her nails. *I organize the rota. I argue with the council about water access.* But then Maya’s face swam into her mind’s eye – Maya who lived with Sarah-in-Lisbon, who was tucked into bed by Lisbon hands. Who did she *intend* for? Both bodies loved Maya. Both bodies *were* Sarah, loving Maya.

  Sarah-in-Lisbon read the same line while practicing a hesitant C-major scale. *I act here,* she thought, the note vibrating under her fingers. *I choose this practice. I schedule Maya’s dentist.* But then she felt the phantom ache of digging in Parisian soil, the satisfaction of a well-tended row of beans. Where did the *intention* to join the garden start? Was it hers? Theirs? Had it metastasized solely in Paris?

  They avoided the log for days. The silence wasn’t hostile, but thick with unasked questions. Finally, Lisbon typed: *The piano… it’s starting to sound like something. Not just noise.* Paris replied hours later: *Antoine says we’ve got the best tomatoes in the 10th arrondissement.* Neither mentioned Maya. Neither mentioned the form.

  The night before the deadline, Sarah sat in both cities. In Lisbon, she watered the rosemary, its scent sharp. In Paris, the neighbour’s TV blared a laugh track. The form was open on both tablets.

  **Primary Continuance Body Selection:**

  *   **□ Lisbon Body (ID: LIS-SR-4782)**
  *   **□ Paris Body (ID: PAR-SR-4782)**

  **Reason for Selection (Optional):**

  She (they?) stared at the boxes. The clinic’s criterion echoed: *Where do your intentions still reach? Where you can still act.*

  *I can reach Maya from Lisbon,* Lisbon thought fiercely.
  *I can act in the garden here,* Paris countered.
  *But I intended the piano lessons.*
  *But I intended joining the garden.*
  *Who intended Maya?* The question hung, unanswerable. Both bodies *were* Sarah. Both bodies *had been* Sarah. But the streams… the streams had found their own channels. The link hadn’t broken; it had just become a bridge between increasingly separate landscapes.

  The brochure’s calm assurance felt like a stone in her shoe. It answered "Where is Sarah?" with "Wherever Sarah is *doing*." But it didn’t touch the fissure beneath: *Which Sarah is doing? Which Sarah is the one who matters? Which Sarah gets to be… me?*

  She (Lisbon? Paris?) realized the clinic wasn’t asking about consciousness or continuity. They were asking about paperwork. Who gets the name? Who gets the debts? Who gets Maya? The rest – the rosemary, the TV, the piano, the tomatoes, the quiet drift in the night – was just… noise. Or was it the only thing that mattered?

  Her finger (which one?) hovered over the Lisbon box. Then the Paris box. The "I" felt thin, stretched, like a wire about to snap. *I am…* The sentence wouldn’t finish. Was she choosing survival? Or just choosing an administrator? Was Sarah in Lisbon choosing to extinguish Paris, or was Paris choosing to abandon Lisbon? Or was the Sarah who signed the form months ago, whole and singular, choosing for both futures, neither of which she could fully inhabit?

  She thought of the last note Paris had sent, about the tomatoes. She thought of the rosemary under Lisbon’s fingertips. She thought of Maya’s laugh, echoing identically in both sets of ears, for now.

  With a breath that felt shared, yet somehow solitary in each chest, she (they?) selected **Lisbon Body (ID: LIS-SR-4782)**. The reason field remained blank. She hit submit. The system chimed confirmation in both locations.

  Tomorrow, the link would sever. Sarah-in-Paris watered her tomatoes one last time, the neighbour’s TV a familiar dirge. Sarah-in-Lisbon played a slow, clear scale on the piano, the rosemary scent sharp in the quiet room. They both thought of Maya. They both felt… something. Resignation? Grief? Relief? Or just the mundane weight of the choice made, the administrative machinery grinding forward.

  When the disconnection signal came – a soft chime, not a bang – the Paris body felt the silence flood in, vast and complete, swallowing the neighbour’s TV, swallowing the phantom scent of rosemary, swallowing the echo of piano notes. In Lisbon, the piano note faded into real silence, the TV hum vanished entirely, replaced only by the tang of the herb on the sill and the sound of her own, singular breath.

  In Lisbon, a woman named Sarah called her daughter. In Paris, a woman whose new ID packet was printing downstairs walked to the window, looking out at the garden below. She touched the cool glass. The silence in her own head was absolute, a new kind of anchor. She wondered what to call herself. The clinic’s protocols would provide a name. But the feeling… the feeling was a question mark hanging in the empty air where a shared self used to be. Was Sarah still here? Was she there? Or had the only real question ever been: who gets the name? And had that question, answered so cleanly on a form, somehow missed the point entirely?
