  The nature/artifact distinction question is particularly thorny. If occasionalism denies true human agency, how can AI as artifact have different metaphysical status than fire? I'll need to argue that artifacts reflect divine "habit" differently than natural kinds, while acknowledging this pushes al-Ghazālī's framework.

