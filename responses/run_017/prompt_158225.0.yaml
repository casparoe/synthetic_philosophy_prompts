prompt: |-
  I have just joined the staff of our region's Common Resources Board, the body that decides whether a resource should be brought under a formal commons regime — defined membership, rules governing use, a monitoring roster, graduated sanctions, and in some cases a levy — or left to private ordering, ordinary pricing, or referral to the finance department as a public good to be tax-funded. The enabling statute is maddeningly vague, so the real content is in our precedents, and I am trying to work out what we have been doing before the next petition arrives. The Board has ruled in: the inshore groundfish stock; a network of farmer-built irrigation canals, where the worry was as much about who clears the silt as about who draws the water; an alpine pasture held under medieval common rights; the city airshed's capacity to absorb particulates; and the valley's darkness and quiet at night, even though any single porch light or late delivery is trivially small, because the Board held that cumulative trivial subtractions count. It has ruled out: the national time-signal broadcast, referred upward as a pure public good with nothing to appropriate; a patented seed variety, on the ground that exclusion is cheap and the market can order it; a congested toll-free causeway, on the ground that rivalry at peak is a pricing problem rather than a commons problem; an openly licensed mapping library used by hundreds of firms, on the combined grounds that use subtracts nothing and that its users had already organized a foundation that paid for upkeep without visible free-riding; and a historic district in which every façade owner holds a veto over alterations, which the Board called the mirror image of a commons — too much exclusion rather than too little — and dealt with by recommending pooling of rights instead of a commons regime.

  The new petition concerns an openly licensed clinical-records library on which every hospital in the region, two municipal agencies, and a dozen or so private clinics now depend. It is maintained by one unpaid volunteer who has announced that she will stop at the end of the year. Copying and use are free and lawful, and one hospital's use subtracts nothing from another's; but the maintenance — security patching, standards updates, the review of contributed fixes — is unpaid, and once a fix is contributed upstream no one can be excluded from its benefit. Fourteen identifiable institutional users have petitioned the Board to place the library under a commons regime with a compulsory maintenance levy, a governance charter, monitoring of contributions, and graduated sanctions for non-payment. Two wrinkles: there is a live fork option, so any user threatened with a levy can in principle exit and carry the code off rather than pay, which cuts both ways as bargaining power and as an enforcement problem; and the Board's toolkit — caps, rosters, sanctions — was built entirely to limit withdrawal, so a levy compelling contribution would be an instrument we have never used, and our statute speaks only of regulating appropriation.

  What I need is a recommendation, not a general discussion of public goods. First, set out the two or three candidate rules that fit our whole track record equally well — something like a rivalry-and-excludability rule keyed to subtractability in use, a collective-action rule keyed to whether dispersed actors are producing an outcome none of them wants, and an institutional rule keyed to whether there is a bounded, identifiable, mutually monitoring community capable of crafting rules — and say what each predicts here. Then tell me which precedent is genuinely the closest analog: the open-source mapping library we waved through, or the irrigation canals and the night sky we took in. Then give me the decision that best coheres with what we have already done, and if our precedents really do underdetermine it, say plainly what principle we would be adopting with each choice — including whether ruling this in commits us to treating every under-maintained open library anywhere as a commons, and whether that floodgates worry is itself a reason. Finally, name the one further petition that would best separate the surviving rules from each other, and tell me what we should expect to learn from it.
reasoning: |-
  Hmm, the user is a new staff member at a Common Resources Board trying to understand precedents before handling a petition about an open-source clinical records library. They need a structured recommendation based on existing case law, not general theory. Let me unpack this carefully.

  First, the Board's pattern shows three implicit decision rules emerging from past cases. The rivalry/excludability rule focuses on resource depletion - like fisheries where use subtracts value. The collective-action rule addresses situations where individual incentives lead to collectively bad outcomes, like the night sky degradation. The institutional rule prioritizes pre-existing community structures, as seen in the irrigation canals case.

  For the clinical records library, rivalry/excludability doesn't apply because use isn't subtractive. Collective-action fits perfectly - all users benefit from maintenance but have individual incentives to free-ride. The institutional rule is partial since users are identifiable but lack mutual monitoring mechanisms. 

  Among precedents, the mapping library case differs because it already had a functioning user foundation. The night sky decision is actually closer conceptually - both involve cumulative maintenance failures despite non-rivalrous use. 

  The coherent ruling would be to accept the petition as a commons regime. The floodgates concern is manageable by emphasizing the critical nature of healthcare infrastructure and the lack of alternative governance - not every open-source project would qualify. 

  To test the boundaries later, a petition about something like under-maintained city bike docks would help distinguish between the collective-action and institutional rules. That scenario would reveal whether dispersed harm alone suffices without a tight user community.
answer: |-
  Here's your recommendation structured to address each request, based strictly on the Board's precedents and operational logic:

  ---

  ### **Candidate Rules from Precedents**
  1. **Rivalry/Excludability Rule**  
     *Focus:* Is the resource *subtractable* in use (rivalry), and is exclusion *costly or impractical*?  
     **Prediction for clinical library:** **Reject commons regime.**  
     - Use is non-rivalrous (one hospital’s use doesn’t subtract from others).  
     - Exclusion is feasible (the "live fork" proves users *can* be excluded if they exit).  
     *Fits precedents:* Toll-free causeway (rivalry but pricing solution), seed patent (exclusion cheap), national time signal (non-subtractable).  

  2. **Collective-Action Rule**  
     *Focus:* Will *uncoordinated individual actions* inevitably degrade the resource or create a suboptimal outcome for all?  
     **Prediction for clinical library:** **Accept commons regime.**  
     - Maintenance is essential but underprovided due to free-riding (no one pays, one volunteer quits).  
     - Trivial individual neglect → catastrophic collective failure (like night sky/particulates).  
     *Fits precedents:* Night sky (cumulative trivial subtractions), airshed particulates, irrigation canals (silt neglect).  

  3. **Institutional Viability Rule**  
     *Focus:* Is there a *bounded, identifiable user community* capable of mutual monitoring and rule enforcement?  
     **Prediction for clinical library:** **Ambiguous, lean accept.**  
     - Users are identifiable (14 institutions), but lack existing mutual monitoring.  
     - "Live fork" risks undermine enforceability (exit option = weak sanctions).  
     *Fits precedents:* Irrigation canals (farmer community), alpine pasture (medieval rights holders); contrasts with mapping library (existing foundation).  

  ---

  ### **Closest Precedent Analog**  
  **The night sky and irrigation canals** – *not* the mapping library.  
  - **Why not mapping library?** It had an *existing self-organized foundation* with no free-riding, making commons governance redundant. Here, maintenance collapse is imminent with no alternative.  
  - **Why night sky/canals?** Both involved:  
    (a) Cumulative harm from individually trivial actions (lights/silt neglect = maintenance neglect),  
    (b) No natural market solution due to non-excludability of benefits.  

  ---

  ### **Coherent Decision with Precedents**  
  **Accept the petition and establish a commons regime.**  
  - **Primary justification:** **Collective-action failure** (Rule #2), as with night sky. The levy is not "regulating appropriation" but preventing resource *degradation* – functionally equivalent to silt-clearing or light-curbing sanctions.  
  - **Distinguishes from mapping library:** Here, free-riding is *active and proven* (volunteer burnout, no successor).  
  - **Statutory flexibility:** The statute’s focus on "appropriation" can reasonably extend to *sustaining the resource* that enables appropriation.  

  ---

  ### **Floodgates Principle & Implications**  
  - **Floodgates risk?** Accepting this petition **does NOT commit the Board to all under-maintained open libraries.** Key distinctions:  
    - **Criticality:** Clinical records are vital infrastructure (health/safety), unlike generic libraries.  
    - **Immediacy:** Demonstrated collapse risk (volunteer quitting) with no alternative.  
    - **User boundedness:** Identifiable institutional users (14 entities), not diffuse public.  
  - **Principle adopted:** "Commons triggers when *critical non-rival resources face collapse due to collective-action failure* among identifiable users."  

  ---

  ### **Test Case to Separate Rules**  
  **Petition:** *Citywide bike-share docking stations* where bikes are non-rivalrous but rebalancing (moving bikes to high-demand areas) is underfunded. Users are identifiable (app-registered), but rebalancing benefits all.  
  - **What it tests:**  
    - **Rivalry Rule:** Would reject (no subtractability).  
    - **Collective-Action Rule:** Would accept (uncoordinated use → station emptiness, degradation).  
    - **Institutional Rule:** Leans accept (identifiable users via app).  
  - **Expected lesson:** Clarifies whether *non-subtractable but maintenance-dependent* resources (like clinical library) belong under collective-action logic alone, even without rivalry.  

  ---

  ### **Recommendation**  
  **Vote to establish the commons regime with levy.** Precedents on cumulative degradation (night sky) and essential maintenance (canals) outweigh non-rivalry concerns. The "live fork" exit option mirrors the historic district’s veto rights – a problem solved by *pooling* (here, via compulsory levy). Sanctions can target non-payment, not use, aligning with the statute’s goal of regulating harm.  

  ---  
  *This maintains the Board’s trajectory: intervene where market failure + collective harm + identifiable users collide, even if tools adapt.*
