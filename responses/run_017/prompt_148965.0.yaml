answer: |-
  Here's your translation and residue report, trimmed for deadline:

  **Translation to Journalistic Toolkit**

  1.  **Testimonial Injustice (Credibility Deficit):**
      *   **Your Terms:** A systematic *miscalibrated prior* applied to a source based on identity markers (not evidence). The *signal* (content of testimony) is discounted due to *noise* (prejudicial associations triggered by identity). *Verification routines* might be applied unevenly or skipped (negative prior overrides). *Source hierarchies* and *informal expert lists* encode these biased priors institutionally. The *both-sides reflex* fails because one "side" (the speaker) isn't granted basic credibility.
      *   **Fit:** Reasonably clean. It's a prior calibration failure rooted in prejudice, distorting information flow.

  2.  **Hermeneutical Injustice (Lack of Shared Vocabulary):**
      *   **Your Terms:** A critical gap in the shared *codebook*. A group's experience lacks the *compressed conceptual tags* needed for efficient communication. The raw *signal* exists (the experience), but without shared *codebook* entries, it can't be transmitted accurately through the *channel* (public discourse, journalism, medicine). It remains high-entropy "noise" or is misinterpreted using ill-fitting existing codes. *Source hierarchies* exclude those experiencing it, preventing codebook updates.
      *   **Fit:** Also reasonably clean. It's a codebook deficiency hindering meaning-making and transmission.

  **Residue Report: What Doesn't Fully Translate**

  1.  **The Harm to the Speaker (Core Residue):**
      *   **Loss:** Your toolkit excellently diagnoses *informational loss to the hearer/system*. It struggles to capture the *intrinsic wrong done to the speaker as a knower*.
      *   **Residue:** Being disbelieved due to prejudice isn't *just* a data loss; it's a denial of the speaker's status as a rational agent, a form of identity-related disrespect Fricker calls "a kind of epistemic objectification." Similarly, lacking the hermeneutic resources isn't *just* a communication barrier; it fundamentally impedes your *ability to understand your own experience* or be socially understood, causing alienation. This ethical/phenomenological harm to the *speaker's epistemic agency* is central to the concept and largely absent from your signal/noise/channel framework. **Verdict:** Deficit in your vocabulary for capturing the *moral harm of being wronged as a knower*.

  2.  **Credibility Excesses:**
      *   **Fit:** The framework *can* handle this. Fricker (and later, Dotson, Medina) explicitly note that credibility excesses granted via prejudice (e.g., the fluent, credentialed white man believed too readily) are the *flip side of the same coin*. It's still a miscalibrated prior distorting the information system – inflating signal where noise might be present, bypassing verification. It reinforces biased source hierarchies and starves out other voices. **Verdict:** Fits cleanly; part of the same systemic calibration failure.

  3.  **The Institutional vs. Individual Problem:**
      *   **Fit/Partial Loss:** You've identified a genuine tension. Fricker's original framing *does* root the injustice in *structural* prejudices (sexism, racism) embedded in social practices. The harm manifests in individual interactions, but the *cause* is systemic. However, her primary proposed remedy (the virtue of "testimonial justice" cultivated by individual hearers) *does* feel misaligned with institutional realities like editorial policies, house styles, or homogeneous newsrooms.
      *   **Residue:** While the *analysis* incorporates structure, the *prescribed initial remedy* is often individualistic. Later work (Anderson, Dotson, Medina) explicitly tackles structural and institutional dimensions. **Verdict:** This is a limitation in the *common application/pitching* of the remedy, not necessarily in the core philosophical claim about the *nature* of the injustice (which is structural). Your instinct is correct: purely individual solutions are inadequate for institutional problems. The framework *allows* for institutional analysis but often gets *simplified* to the individual level.

  **Key Residual Elements & Your Hypothesis Verdict:**

  *   **Your Hypothesis (Partially Confirmed, Partially Refuted):**
      *   **Testimonial:** It *is* a badly calibrated prior (confirmed), but the core harm includes an intrinsic wrong to the speaker beyond informational loss (refuted).
      *   **Hermeneutical:** It *is* a codebook/compression failure (confirmed), but the core harm includes impaired self-understanding and agency, not just transmission failure (refuted).

  *   **Major Residues:**
      1.  **Harm to Epistemic Agency:** The fundamental wrong is denying someone their status as a legitimate knower or preventing them from achieving understanding of their own life. This is ethical and existential, not just informational.
      2.  **Testimonial Smothering (Related):** Speakers *self-censor* knowing their testimony won't be taken seriously – a proactive signal loss your passive "noise" model doesn't capture well.
      3.  **Structural Embedding:** While your toolkit *can* model institutions (source hierarchies, editorial practices), the philosophical emphasis on *identity-based power structures* as the root cause adds a layer of analysis about *why* these institutional distortions exist that your functional toolkit might background.

  **Conclusion:** Your toolkit translates the *mechanics* of epistemic injustice (distorted priors, failed codebooks) effectively and handles credibility excesses. The major residue is the core philosophical claim: the **intrinsic harm to the speaker's status as a knower and agent**. This isn't fuzzy philosophy; it's an ethical dimension your information-theoretic vocabulary lacks. The institutional/individual tension reflects a simplification in *remedy discourse*, not the core analysis. You're right to see the institutional unit as crucial.
