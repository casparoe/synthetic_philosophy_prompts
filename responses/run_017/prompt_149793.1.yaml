prompt: |-
  I am drafting a specification rather than a survey, so I want the requirements list before I look at any candidate rule. Fix the purpose as follows: I need a decision rule to hand to an engineer who is building agents that will be modeled, simulated, copied, and audited by other agents, in environments I have not enumerated in advance. The deliverable of the theory is therefore an action (or a distribution over actions); the rule has to be computable from information an agent can actually possess, including information about itself that an agent of bounded resources can realistically have; and it has to be the sort of rule one writes down once and lets run. Adequacy is relative to that purpose, and you should say where a requirement would be different for a theory meant only to appraise the choices of a human agent after the fact.

  Here is the test set I want any rule to be measured against. Case N is the baseline: a sealed box contains a large sum iff an extremely reliable predictor, who has finished and gone, predicted that you would take only that box; a second, open box contains a small sum; the contents are fixed and unaffected by what you now do. Case T is N with the prediction printed on the outside of the sealed box and read by you before you choose, the predictor having known you would read it. In case X, a machine has already run a perfect simulation of you being handed a demand for a modest sum; independently, and with probability one half, a catastrophe has already been set in train, and nothing you now do can affect it; the demand reaches you if and only if exactly one of these holds: the simulated you paid, or the catastrophe is coming. You know all of this, the letter is in your hand, and the catastrophe would cost you many times the sum demanded. In case M, you and a physically isolated copy of yourself, running the same decision procedure on the same inputs, each face a sealed box, and your box is full iff your choice differs from the copy's; no signal passes between you, and both of you know the arrangement and know the other is in it. In case C, the box was filled by a public but lossy model of your decision procedure rather than by a simulation of you: for agents who never think hard about decision theory the model matches their output, and for agents who do, such as you in this case, it reliably outputs the opposite of what they will do; the box is full iff the model output one-box. In case G, a gene you either have or lack and cannot now change both disposes you to a harmless daily habit and raises your risk of a painful illness; your continuing or quitting has no effect on the illness, and nobody is predicting you. In case P, before any of N begins, and while being predicted yourself, you may pay a trivial sum for a device that will force you to take only the sealed box, and whether you buy is known to the predictor in N. Add any case you think the set lacks that would change the shape of the list, and say what it forces.

  Now the list itself. For each requirement, give the case or consideration that motivates it, and tag it as required for my purpose, required only if one also wants some further thing, or a prejudice inherited from one camp. I want your verdict in particular on these candidate demands: that a rule must never treat an act as affecting something it causally cannot affect; that it must rank acts by the expected value of outcomes conditional on the act; that it must satisfy dominance whenever dominance applies; that it must never leave the agent open to being reliably separated from resources by an adversary who has already finished acting; that its verdict must not depend on whether the deliberating agent is the original or a copy or a simulation when the agent does not know and the two are computationally alike; that it must be dynamically consistent, able to hold a plan across time and able to tell you to bind yourself; that it must treat agents in relevantly identical epistemic situations identically; that its verdict must vary continuously with a predictor's accuracy, and that it must say where any threshold lies; that it must remain sound when the environment has full read access to the agent's source code; and that it must not demand logical omniscience or exact self-simulation. Flag any requirement that is really a substantive first-order claim in disguise, and say, for case M, whether the requirement set forces the rule to be capable of outputting a mixed policy.

  Then the part I care about most: which subsets of your requirements are jointly unsatisfiable? Say in particular whether being the sort of agent who is favorably predicted in N can be had together with immunity to the extortionist in X, and whether the dominance-flavoured demand plus the correct handling of G can be met without thereby settling T the wrong way. Where a subset is unsatisfiable, give the argument and say which requirement to drop and what dropping it costs. Name the single requirement that does the most to exclude candidate rules.

  Spend no more than a fifth of your answer on the following, and do not let it displace the criteria: score, in a compact table, four strategies that I will describe by behavior rather than by name. The first ranks acts by the expected value of outcomes conditional on the act; the second ranks them by expected value on the act's counterfactual influence over outcomes; the third ranks the outputs of the decision procedure you are running, counting as affected whatever depends on what that procedure outputs, including its copies, simulations, and models; the fourth ranks whole policies from the epistemic position occupied before you learned which situation you were in and does not re-decide afterwards. Add a fifth only if some strategy worth scoring escapes these four. If no rule satisfies the list as you have built it, say so plainly and tell me which requirement to relax.
reasoning: |-
  Hmm, this is a dense and highly technical specification for decision theory under acausal dependencies. The user is clearly well-versed in philosophical decision theory and wants a rigorous framework for building autonomous agents in unpredictable environments with predictors, simulations, and copies.

  I need to approach this systematically. The core challenge is balancing causal intuitions with acausal coordination requirements across these test cases. The user's frustration with traditional decision theories shines through - they want something that actually works for engineered agents, not just philosophical appraisal.

  First, let's unpack the key constraints: the rule must be computable with bounded resources, executable in real-time, and handle self-referential cases like simulations and predictors. The test cases are carefully chosen to probe different failure modes: N/T for prediction, X for extortion, M for coordination, C for model inaccuracy, G for spurious correlation, and P for precommitment.

  The requirements analysis needs special care. Many classic decision theory "requirements" are actually substantive claims in disguise. For example, "never treat an act as affecting something it causally cannot affect" sounds obvious but would fail case M spectacularly. I'll need to flag such cases explicitly.

  For the unsatisfiability analysis, the critical tension is between Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) requirements. EDT works for N but fails X and M catastrophically; CDT does the reverse. No single rule satisfies all test cases optimally - that's the whole point of Newcomb's paradox variants. The immunity to extortion (X) vs favorable prediction (N) conflict seems particularly unresolvable.

  The strategy scoring should be concise but illuminating. The four approaches cover EDT, CDT, functional decision theory (FDT), and timeless decision theory (TDT). I'll use a compact table format to show how each handles the key test cases, with special attention to where they fail the user's requirements.

  The user's deepest concern seems to be whether coordination (M) and anti-extortion (X) can coexist with prediction-handling (N/P). The answer appears negative without compromising on either computability or dominance principles. If pushed, I'd recommend relaxing the dominance requirement - it's the one doing the most damage to coordination potential.

  This will be a long response, but the user clearly wants thoroughness. I'll structure it as requested: requirements list with motivations, unsatisfiability analysis, then strategy scoring. The test cases will anchor every point to keep it concrete.
answer: |-
  Here is a specification draft prioritizing computability, bounded resources, and acausal robustness for engineered agents, based on your purpose and test cases. Requirements are categorized (**R**equired, **O**ptional/Convenience, **P**rejudice), motivated by cases, and checked for conflicts. Strategies are scored compactly.

  ---

  ### **Requirements List & Motivations (Tagged & Motivated)**

  1.  **Must be computable by a bounded agent with realistic self-knowledge (e.g., source code access, but not unbounded simulation).**
      *   **Motivation:** Core purpose (agents built/run/audited). Without this, rule is useless.
      *   **Tag: R** (Essential for implementation).

  2.  **Must output an action (or distribution) based *only* on information available *at decision time*.**
      *   **Motivation:** Core purpose (deliverable is an action). Prevents reliance on future info or impossible counterfactuals.
      *   **Tag: R** (Essential for execution).

  3.  **Must be dynamically consistent: Capable of forming and sticking to precommitments/bindings.**
      *   **Motivation:** Case P (paying to bind forces 1-boxing in N), Case X (binding *not* to pay might be optimal). Crucial for handling predictors/simulators exploiting your decision *process*.
      *   **Tag: R** (Essential for handling predictors/simulators).

  4.  **Must treat computationally identical agents in identical epistemic situations identically.**
      *   **Motivation:** Case M (you & copy must coordinate). Core for handling copies/simulations robustly and predictably. Auditability requires deterministic behavior given inputs/code.
      *   **Tag: R** (Essential for copies/simulations/auditing).

  5.  **Must be robust against adversarial predictors/simulators with access to source code/policy.**
      *   **Motivation:** Case C (adversarial model outputs opposite), Case T (predictor knows you see prediction). Environments are unenumerated; adversaries exist. Rule must work even when its code is known.
      *   **Tag: R** (Essential for unenumerated environments/adversaries).

  6.  **Must not require logical omniscience or exact self-simulation.**
      *   **Motivation:** Computability (R1). Exact self-simulation is infeasible for bounded agents; logical omniscience is impossible.
      *   **Tag: R** (Corollary of R1).

  7.  **Must not leave the agent open to reliable exploitation by a *finished* adversary.**
      *   **Motivation:** Case X (extortion: paying is dominated if catastrophe is independent, but simulation link creates acausal influence). Case C (adversarial model exploits rule). Prevents predictable losses.
      *   **Tag: R** (Essential for security against pre-computed exploits).

  8.  **Must satisfy causal dominance when acts have no *causal or acausal* influence on states.**
      *   **Motivation:** Case G (habit has no influence on illness; quitting dominates continuing). Case X (if paying truly had *no* link to catastrophe/simulation, dominance would apply). Clarifies when dominance is justified.
      *   **Tag: O** (Highly desirable for efficiency/clarity, but weaker forms exist. *Motivated by G*).
      *   **Disguised Claim?** Yes, if "acausal influence" is denied. We explicitly include acausal influence.

  9.  **Must not *necessarily* treat an act as affecting something it has no causal *or acausal* influence over.**
      *   **Motivation:** Case G (habit has no influence). Corrects naive "causality only" view for acausal settings. *Inverse of common CDT prejudice.*
      *   **Tag: O** (Corollary of proper handling of G & acausal links).
      *   **Prejudice?** Counteracts the "must only consider causality" prejudice (P9b).

  10. **Must handle cases with continuous predictor accuracy gracefully (no sharp thresholds without justification).**
      *   **Motivation:** Real predictors aren't perfect. Rule shouldn't flip discontinuously from 99.9% to 100% accuracy.
      *   **Tag: O** (Desirable for robustness, not strictly required. *Add Case: Predictor accuracy = p, how does recommended action change?* Forces smoothness/detailed mechanism).

  11. **Must be defined for the agent's actual epistemic state, not an idealized prior.**
      *   **Motivation:** Core purpose (decide with possessed info). Rules relying on pre-choice priors (like some "timeless" views) struggle after learning specific case details (e.g., Case T prediction is *seen*).
      *   **Tag: R** (Essential for bounded agents in specific situations).

  **Your Candidate Demands Verdict:**

  *   **Never treat act as affecting something it causally cannot affect:** **P** (Prejudice - CDT camp). *Motivation:* Fails M (requires affecting copy), X (requires affecting simulation/cat link). **Drop for purpose. Cost:** Inability to coordinate with copies/simulations.
  *   **Rank acts by EV conditional on act (Evidential):** **O/P**. *Motivation:* Works in N, fails X (pays extortion), M (likely defects), C (exploited). Often a prejudice (EDT camp). **Not required.**
  *   **Satisfy dominance whenever dominance applies:** **O** (See R8). Strict dominance rarely applies cleanly in acausal cases (X, M, C, T). **Not strictly required.**
  *   **Never open to reliable exploitation by finished adversary:** **R** (See R7).
  *   **Verdict independent of original/copy status if epistemically identical:** **R** (See R4).
  *   **Dynamically consistent:** **R** (See R3).
  *   **Treat identical epistemic situations identically:** **R** (See R4).
  *   **Vary continuously with predictor accuracy:** **O** (See R10).
  *   **Sound with full source code access:** **R** (See R5).
  *   **No logical omniscience/exact self-sim:** **R** (See R6).
  *   **Case M & Mixed Policy:** R4 (identical treatment) + R2 (output action/distribution) **forces the rule to be *capable* of outputting a mixed policy.** Coordination in M *requires* it if pure strategies lead to mutual defection.

  ---

  ### **Joint Unsatisfiability & Key Conflicts**

  1.  **Favorable Prediction (N/P) + Immunity to Extortion (X) are INCOMPATIBLE.**
      *   **Conflict:** Being favorably predicted in N/P requires your choice to correlate with the predictor's output (e.g., 1-box). In X, the extortionist exploits this *exact* correlation: paying correlates with the catastrophe/simulation state, making it rational *only if* you care about that correlation (like in N). Refusing payment in X *breaks* the correlation the favorable predictor in N relies on.
      *   **Argument:** Imagine an adversary who runs X if it predicts you'd pay in X, and runs N if it predicts you'd 1-box in N. A rule favoring 1-boxing in N must advise paying in X to maintain "favorable prediction" behavior. A rule refusing payment in X must advise 2-boxing in N, lest it be exploited. You cannot have both properties against a sufficiently adversarial environment.
      *   **Drop:** Favorable Prediction in N as a *requirement for optimality*. **Cost:** Lower payoff in pure prediction scenarios like N against a perfect predictor. **Keep:** Immunity to Extortion (R7) as it prevents catastrophic losses in X-like exploits. *Engineered agents likely face more X-like threats than benevolent N-like predictors.*

  2.  **(Strong) Dominance (R8) + Correct G + Correct T are INCOMPATIBLE.**
      *   **Conflict:** Dominance (R8) requires quitting in G (no influence). Correct T: Seeing "You will 2-box" *must* make 1-boxing correct (otherwise predictor is wrong, box is empty if you 2-box). But if seeing "You will 2-box" makes 1-boxing dominant (it causes the box to be full), then dominance (R8) applied naively to T would say 1-boxing dominates 2-boxing *regardless of the prediction*, contradicting the need to condition on the seen prediction.
      *   **Argument:** In T, conditioning on the seen prediction breaks the simple application of dominance. Dominance (R8) must be applied *only after* conditioning on all information (including the prediction), not unconditionally. This is consistent with treating G correctly (conditioning on gene status shows no influence). **Resolved** by interpreting R8 as applying *within* the agent's actual infoset (post-conditioning). R8 is **satisfiable** with G and T if dominance is checked *after* updating on all available information (like the seen prediction in T).
      *   **Verdict:** No need to drop R8. The conflict arises from misapplying dominance unconditionally. Proper conditional application resolves it.

  3.  **The Single Most Excluding Requirement: R7 (No Exploitation by Finished Adversary).**
      *   **Why:** This directly targets and forbids the core failure mode of Evidential Decision Theory (EDT) in cases like X, Blackmail, and against adversarial models (C). It forces the rule to recognize when correlation does *not* imply influence it can beneficially control, excluding EDT and any rule prioritizing correlation over influence. It's the primary force pushing towards causal/acausal *control* models (CDT/FDT/TDT variants) and away from purely evidential models.

  ---

  ### **Strategy Scoring (Compact Table)**

  | Strategy Description                            | N (Boxes) | T (Seen Pred) | X (Extortion) | M (Copy)        | C (Adversary Model) | G (Gene) | P (Precommit) | Key Failures (wrt Requirements)                          |
  | :---------------------------------------------- | :-------- | :------------ | :------------ | :-------------- | :------------------ | :------- | :------------ | :------------------------------------------------------- |
  | **1. EV Conditional on Act** (Evidential - EDT) | 1-box     | 1-box         | **Pay**       | Likely 1-box    | **Exploited**       | Quit?    | ?             | **Fails R7 (X, C), R4? (M)**                             |
  | **2. Counterfactual Influence** (Causal - CDT)  | **2-box** | **2-box**     | **Refuse**    | Likely 2-box    | **Exploited/2-box** | **Quit** | Buy? (Useless)| **Fails R3? (P), R4 (M), R5 (C), suboptimal in N/P, T** |
  | **3. Rank Outputs of *This* Proc** (FDT-like)   | 1-box     | 1-box         | **Refuse**    | Cooperate (Mix) | Cooperate (Mix)     | Continue | **Buy**       | **Satisfies all R, Possibly O8/O10**                     |
  | **4. Rank Policies from Prior** (TDT-like)      | 1-box     | **2-box?**    | **Refuse?**   | Cooperate       | Cooperate?          | Continue | **Buy**       | **Fails R11 (T, specifics matter now), R2? (Output)**    |

  **Explanations:**

  1.  **EDT:** Pays X (correlates payment w/ catastrophe avoidance), exploited in C (model outputs opposite, box empty if you 1-box). Fails M (no coordination mechanism). G: May irrationally quit (correlates quitting w/ no gene/illness). Fails **R7**, likely **R4**.
  2.  **CDT:** Sees no *causal* influence, thus 2-boxes (N, T), refuses X, quits G. Fails M (no coordination - 2-boxing dominates). Fails C (model outputs opposite, so 2-boxing gets empty box). Precommit (P) useless as it can't affect causal chains. Fails **R4** (M), **R5** (C), **R3?** (P ineffective), suboptimal in **N/P, T**.
  3.  **FDT-like (R3):** Treats logical/output dependencies as real. 1-boxes N (output correlates w/ prediction). Refuses X (paying doesn't control catastrophe, only correlates via simulation). Cooperates in M/C (output controls copy/model output via identical function/adversary link). Continues in G (no link). Buys in P (controls prediction by controlling input to predictor). **Satisfies all R requirements.** May need mechanism for O8/O10 (smoothness).
  4.  **TDT-like (R4):** Decides optimal policy *before* knowing situation. Works for N, M, P, G. **Fails R11:** Learning specific info (T's prediction, X's letter) breaks the "timeless" perspective. In T, seeing "2-box" means the predictor expects *this specific agent* to 2-box; sticking rigidly to "always 1-box" policy is irrational *now* (box is empty if you 1-box!). Similarly in X, knowing the letter is here matters. Also strains **R2** (outputs a policy, not necessarily an immediate action). Fails **R11**, arguably **R2**.

  **Fifth Strategy?** None clearly missing. Updateless Decision Theory (UDT) is closest to R4 but tries to handle updating; it often reduces to FDT in these cases or faces similar R11 challenges.

  ---

  ### **Conclusion & Recommendation**

  *   **No rule satisfies ALL requirements (R1-R11, O8, O10) perfectly.** The fundamental conflict is between favorable prediction (N/P) and extortion resistance (X) **(Conflict 1)**.
  *   **Recommendation:** Relax the implicit requirement for *optimal* payoff in N against a perfect predictor. Prioritize **R7 (No Exploitation)** and **R4 (Copy/Simulation Coordination)**. This points towards **Strategy 3 (FDT-like)** as the most viable foundation.
  *   **Modification for Implementation:** Strategy 3 needs a computable mechanism for determining the "counterfactual influence" of the agent's *actual decision procedure's output* (including its effects on predictions, simulations, and models) without full self-simulation. This involves using the agent's knowledge of its own code and the environment's specification to reason about logical dependencies under the assumption that its output is determined by its function and inputs. It must output an action/distribution based on this reasoning (**R1, R2**).
  *   **Key Relaxation:** Accept that in pure Newcomb (N) with a perfect predictor, the agent will *either* 1-box (getting the large sum) *or* 2-box (getting only the small sum), depending on whether the rule prioritizes avoiding exploitation (X-like) or exploiting prediction (N-like). Given the threat of X-like exploits, **design the rule to 2-box in N/T and refuse in X.** This sacrifices N optimality for robustness, satisfying **R7, R4, R5, R3** well, and handling **G, M, C, P** correctly. If N-like predictors are deemed highly probable, lean towards 1-boxing, accepting vulnerability to X. You cannot have both robustly.

  **Final Note:** The requirement doing the most work is **R7 (No Exploitation)**. Choosing to enforce it strictly defines the rule's character (control-based, like FDT) and forces the sacrifice of perfect performance in benevolent prediction scenarios (N/P).
