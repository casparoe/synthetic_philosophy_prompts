prompt: |-
  You are a political philosopher specialising in public ethics and comparative political theory, who also advises development agencies on anti-corruption programme design. Please think carefully before writing: spend some time brainstorming how each of the commitments below constrains the others, and how much work each one is quietly being asked to do, before you commit to an answer. Be blunt where bluntness is warranted.

  I work on corruption in development contexts and I have finally written my position down so my colleagues can attack it. Seven theses:

  1. Corruption is not just bad government; it has an essential structure. Someone occupying a role that carries entrusted purposes subordinates those purposes to private advantage. Where there is no such role, talk of corruption is loose talk.

  2. That core is, I hold, universal and not a Western export. But the apparatus that Western law and compliance culture treats as its neutral application — conflicts-of-interest registers, disclosure duties, competitive tendering, arm's-length contracting, caps on gifts and hospitality — is one historically local way of institutionalising impartiality, suited to large impersonal bureaucracies. Where office is embedded in kinship and patronage, the same goods (predictability, restraint of arbitrary power, some downward accountability) are often secured by other mechanisms, and standard international indices systematically misread those mechanisms as their absence.

  3. So I am not a cultural relativist about corruption: that a practice is locally accepted, or locally expected, never settles that it is not corrupt. I want to condemn without hedging the minister who steers a road contract to his brother's firm at an inflated price with a kickback built in — even where everyone does it, and even where some of the money does reach the village.

  4. But I am not a consequentialist about it either. I do not want to say clientelism is acceptable when it happens to deliver growth, or that a facilitation payment is fine when it unblocks an official who would otherwise stall. The wrong lies in the subordination of the office, not in the outcome.

  5. I draw the gift/bribe line by asking whether the transfer sits inside an ongoing relationship of reciprocal obligation or is a payment that purchases a particular exercise of the office. Tributary gifts to a patron — the sort that sustain a relationship and carry no specific request — I treat as a different moral object from a bribe, and I resist criminalising them.

  6. Where I am most severe is clientelism: patronage hiring, targeted goods in exchange for votes, the local boss who directs a borehole to his own kin's wards rather than to the district on need. I hold this to be a distinct and deeper corruption than one-off grand theft, because it converts a relation of political equality into a relation of personal indebtedness.

  7. And I think corruption can be systemic: a polity can be thoroughly corrupt even when no individual official has departed from anything locally recognised as a rule.

  My question: does the set hang together? My own guess is that the trouble is (3) against (2) — that I have smuggled a Western conception of impartial office back in through the definition while claiming the core is thin. A colleague insists the real fracture is (4) against (6), and that the reason I give in (6) is exactly the sort of outcome-based reason (4) forbids me. I cannot tell who is right, and I do not want to give up any of the seven if I can help it.

  Please audit the package rather than lecture me about corruption in general. Identify where the commitments genuinely pull against each other, separate those from pairs that only look tense, rank the genuine tensions by severity, and for each state precisely what would have to be surrendered and what that surrender would cost me elsewhere in the set. If a single revision would repair more than one of them, say so — and say plainly if one of the seven simply has to go.
reasoning: |-
  Okay, the user is a political philosopher working on corruption in development contexts. They've laid out seven theses and want to know if they hang together. They suspect tension between thesis 3 (anti-relativism) and thesis 2 (critique of Western institutional bias), while their colleague points to thesis 4 (non-consequentialism) vs. thesis 6 (clientelism critique). 

  First, I need to unpack how each thesis constrains the others. Thesis 1 defines corruption structurally - role subordination to private gain. That's the anchor. Thesis 2 then says this universal core gets expressed through culturally specific institutions, and Western compliance tools are just one variant. But thesis 3 immediately insists that local acceptance doesn't legitimize corruption - creating friction with 2's cultural sensitivity. 

  Thesis 4 rejects consequentialism, making outcomes irrelevant to the wrong of corruption. Yet thesis 6 condemns clientelism precisely because it creates relations of indebtedness - an outcome-based harm! That's the colleague's main critique. Meanwhile, thesis 5 carves out tributary gifts as morally distinct from bribes, which feels consistent but needs pressure-testing against 6's harsh view of patronage.

  The systemic claim in thesis 7 seems stable but could exacerbate other tensions - if no individual breaks rules yet the system is corrupt, doesn't that rely on an implicit standard beyond local recognition? 

  Biggest problem is indeed thesis 6's reliance on outcome (political equality erosion) while thesis 4 forbids outcome-based reasoning. To fix this, they'd either need to moderate 4 to allow some outcome-based wrongs (but that breaks non-consequentialism) or redefine clientelism as inherently subordinating office purposes to private networks rather than focusing on the equality-to-indebtedness shift. The latter seems salvageable. 

  Thesis 3 vs. 2 is less severe - they can maintain that local acceptance doesn't justify corruption while still acknowledging in thesis 2 that impartiality manifests differently. The key is ensuring "entrusted purposes" in thesis 1 aren't covertly Western. They might need to explicitly state that office purposes can be locally defined yet still subordinated. 

  Tributary gifts in thesis 5 actually help mediate 2 and 3 by showing non-Western practices aren't automatically corrupt. But they'll need to carefully distinguish these from clientelism in thesis 6 - perhaps by emphasizing that tributary gifts sustain generalized reciprocity without demanding specific official actions, whereas clientelism directly exchanges favors for loyalty. 

  Ultimately thesis 6 is the main fracture point. If they recast it as clientelism subordinating public office to private networks per thesis 1's core definition - without invoking political equality consequences - the framework holds. That's the minimal surgery needed. None of the seven must be fully abandoned, but 6 requires rewording.
answer: |-
  Your framework is rigorous and insightful, but internal tensions exist. After mapping how each thesis constrains the others, here's an audit ranking genuine tensions by severity, required concessions, and repair options:

  ### Critical Tension (Most Severe): Thesis 4 vs. Thesis 6
  - **The Conflict**: Thesis 4 rejects *all* outcome-based justifications ("wrong lies in subordination, not outcome"). Yet Thesis 6 condemns clientelism *because* it "converts political equality into personal indebtedness" — an outcome-based harm. This is the fracture your colleague identified.  
  - **What Must Be Surrendered**:  
    - *Option A*: Modify Thesis 4 to allow **some outcome-based wrongs** when they constitute *structural harm to political relations*. Cost: Weakens anti-consequentialist purity; risks opening floodgates for "efficient corruption" arguments.  
    - *Option B*: Reanchor Thesis 6 in **role subordination alone**. Argue clientelism subordinates the office's purpose (e.g., "impartial public service") to *private network maintenance*. Cost: Loses the potent critique of democratic erosion.  
  - **Repair Suggestion**: Revise Thesis 6 to:  
    *"Clientelism subordinates public office to the private purpose of sustaining loyalty networks, violating its entrusted function. This often (but not consequentially) degrades political equality."*  
    **→ Retains systemic critique without consequentialist logic.**

  ### Major Tension: Thesis 3 vs. Thesis 2
  - **The Conflict**: Thesis 2 insists Western "neutral" institutions are culturally specific and that non-Western mechanisms can secure similar goods (predictability, accountability). Thesis 3 demands universal condemnation of nepotism/kickbacks *even when locally normalized*. This implicitly privileges a **disembedded office conception** (Western) over embedded ones (kinship-based), contradicting Thesis 2's pluralism.  
  - **What Must Be Surrendered**:  
    - Clarify that "entrusted purposes" (Thesis 1) **must be locally legible**. E.g., if an office's socially accepted purpose *includes* kinship obligations, steering contracts to kin may not be corrupt. Cost: Weakens universal condemnations in Thesis 3; risks excusing some patronage.  
  - **Repair Suggestion**: Add to Thesis 1:  
    *"Entrusted purposes are defined by the office's socially constituted role, not external ideals."*  
    **→ Aligns universal structure (Thesis 1) with institutional pluralism (Thesis 2) while allowing Thesis 3 condemnations where local rules *are* violated (e.g., if formal procurement laws exist but are subverted).**

  ### Minor Tension: Thesis 5 vs. Thesis 6
  - **The Conflict**: Thesis 5 exempts "tributary gifts" from bribery as they sustain reciprocal relationships. But Thesis 6 condemns patronage networks (which often rely on such gifts) as "deeper corruption." Distinguishing benign reciprocity from corrosive clientelism becomes ambiguous.  
  - **What Must Be Surrendered**:  
    - Sharpen Thesis 5's criteria: Tributary gifts are non-corrupt **only if they impose no implicit quid pro quo** and **do not fund exclusionary networks** (e.g., gifts to a chief for communal feasts vs. gifts securing preferential contracting). Cost: Demands nuanced contextual analysis.  
  - **Repair Suggestion**: Use Thesis 6's focus on **political equality** to delineate "permissible reciprocity" (horizontal/social) from "corrosive clientelism" (vertical/power-exploitative). Thesis 5 remains intact, but its scope narrows.

  ### Apparent but Resolvable Tensions:
  - **Thesis 7 vs. Thesis 1**: Systemic corruption (7) without individual deviation (1) seems contradictory. **Resolution**: Thesis 1's "role subordination" can occur when *system rules* encode private advantage into public roles (e.g., kleptocratic constitutions). No surrender needed.  
  - **Thesis 5 vs. Thesis 3**: Defending tributary gifts (5) while condemning "locally accepted" acts (3). **Resolution**: Thesis 5’s gifts are *not corrupt* by definition (they don’t subordinate office purposes), so Thesis 3 doesn’t apply.  

  ### Verdict & Path Forward:
  1. **Thesis 6 requires revision** to resolve the critical tension with Thesis 4. Anchor it in role subordination, not outcomes.  
  2. **Thesis 1 needs refinement** ("entrusted purposes are socially defined") to harmonize Theses 2 and 3.  
  3. **No thesis must be fully abandoned**, but clarity on "entrusted purposes" and "systemic subordination" is essential.  

  **Why this works**: Your core (Thesis 1) *is* thin and universal if "purposes" are socially constituted. Condemning nepotism (Thesis 3) remains valid where local rules *do* forbid it, or where patronage visibly subverts formal mandates. Thesis 4’s anti-consequentialism holds if clientelism’s wrong is redefined as *institutional capture*, not democratic erosion.  

  **Bluntly**: Your colleague is right about Thesis 4 vs. 6, but you’re both wrong to fear Thesis 2 vs. 3. Fixing 6 and refining 1 saves the framework’s coherence without sacrificing its critical edge.
