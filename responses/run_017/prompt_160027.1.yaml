prompt: |-
  I've been reading LessWrong and the forums that grew out of it for about fifteen years, so I've watched the part of that world concerned with doing good efficiently go through several self-corrections. There is a pattern I keep seeing in it that I can describe in three pieces but cannot name, and I am not confident the three pieces are the same thing.

  One. A grantmaker compares two programs: a bednet-style distribution with clean randomised evidence and a dollars-per-life-saved figure, and a multi-year effort to change how a national research-funding agency sets its priorities. The second has no usable control group, diffuse and delayed effects, and no unit cost. It loses. It loses again five years later, and this time the reason recorded is that its evidence base is thin. But the thinness is not independent of the earlier decisions: nobody paid for the measurement infrastructure, and the people who would know how to judge that kind of work went elsewhere, so the file gets thinner as a consequence of never having been funded. Measurability here looks like a property of the intervention, but it is partly a product of the funding history.

  Two. The same shape appears in career choice. Someone picks a career by expected lifetime donation. That expectation is computable for software and finance and essentially incalculable for "go build the infrastructure for evaluating the diffuse thing." So the pipeline fills the legible careers, and the advice ("earn to give") treats the existence of an evidence base as a fixed background condition when it is in part a function of who took which job. The evaluators are selected the same way, and are themselves ranked by the same style of cost-effectiveness reasoning, so the people whose job is to notice the exclusion are under the same pressure.

  Three. The corrections I've seen proposed do not seem to escape it. Apply a multiplier to options with weak evidence; ring-fence a fraction of the budget for unmeasurable work; fund hits-based. But to size the correction you need a number for how much you are missing, and producing that number requires exactly the kind of evidence you do not have. Any estimate of the bias is generated by the biased process. And no one inside the system is rewarded for saying "I cannot produce a number for this." The filter appears to operate again on the attempted repair of the filter.

  I don't think this is just Goodhart's law: nothing is being gamed, and the problem is not that a measure degrades once it becomes a target but that a whole class of options never enters the comparison. It isn't quite Campbell's law, which seems to be about deliberate distortion under pressure. The streetlight effect gets closer, except that in the streetlight case the key is wherever it is and only the light is misplaced, whereas here the light is being constructed as we go, so where it is now depends on where we looked before. It is more than path dependence or a Matthew effect, since what compounds is not advantage but apparent certainty. It has a family resemblance to Scott-style legibility, except that no simplifier is imposing a grid; it falls out of many individually sensible choices. And I can't tell whether some of it is just exploitation crowding out exploration, which might be fine.

  So: is there an established concept for this configuration, or for the three pieces separately? Is "measurability bias," which gets thrown around loosely in these discussions, a term of art with a definition, or just a gesture? Does the recursive part — the correction being subject to what it corrects for — have its own literature? If nothing established fits, coin a term and define it, and give me boundary cases: when is this same structure benign, and when is it the thing I think I'm seeing?

  Please don't give me a bibliography or citations; I want the carving — what the phenomenon is, what it isn't, where its edges are — and I'll consider the naming question closed if there is nothing established. Finally, say what would change your mind: which consideration would convince you that I have conflated three unrelated things, or that the whole pattern dissolves into ordinary value-of-information reasoning, and where in your analysis you think the reasoning is most likely to break.
reasoning: |-
  Okay, the user has been involved with LessWrong and related forums for about fifteen years. They've observed a recurring pattern in effective altruism circles where measurable interventions are favored over less tangible ones, creating a self-reinforcing cycle. They describe three scenarios: grantmaking favoring measurable projects, career choices leaning towards quantifiable paths, and even proposed solutions falling into the same trap. They want to know if there's a named concept for this phenomenon or if it needs a new term.

  First, I need to unpack each part of their query. The first scenario shows how initial funding decisions affect future measurability. Bednets have clear metrics because they've been funded before, while systemic changes lack data because they weren't funded, leading to a vicious cycle. The second scenario is about career choices—quantifiable paths like software attract talent because their impact is measurable, whereas infrastructure-building roles don't, worsening the evidence gap. The third point highlights how solutions like multipliers or ring-fenced budgets still rely on the same biased metrics, making the fix part of the problem.

  The user mentions several concepts they think are related but not quite fitting: Goodhart's Law, Campbell's Law, streetlight effect, path dependence, Matthew effect, legibility. They're right that none fully capture the recursive nature here. Goodhart's is about gaming metrics, Campbell's about deliberate distortion, streetlight about search areas, while this is about evidence generation being path-dependent. The key difference is the self-reinforcing evidence void created by the evaluation system itself.

  I recall concepts from decision theory and epistemology. The "evidential neglect" or "informational bias" from economics comes to mind, where what isn't measured gets ignored. But the recursive aspect is crucial—the correction mechanisms are corrupted by the same bias. This resembles a self-referential system where the tools for evaluation can't assess their own blind spots. It's like a black hole in evidence space: absence of data begets absence.

  The user might be hinting at a deeper issue in effective altruism: the tension between short-term measurable impact and long-term systemic change. Their frustration with proposed solutions suggests they suspect fundamental limitations in metric-driven approaches. They might want validation that this isn't just poor execution but a structural flaw.

  For naming, "Evidence Collapse" seems apt—it conveys how the range of considered options shrinks due to eroding evidence. "Metric Myopia" focuses on the short-sightedness, but "collapse" better captures the systemic decay. The recursive element needs emphasis; perhaps "Recursive Evidence Collapse" to highlight the feedback loop.

  Boundary cases: In stable environments, focusing on measurable things might be efficient. But in complex, changing systems, this collapse stifles innovation. The benign case is when unmeasurable options are negligible, but if they're high-impact, the cost is huge.

  What would change my mind? If all three scenarios reduce to rational information gathering—maybe the system correctly ignores low-evidence areas. But the user's point about the evidence void being created by the system itself suggests otherwise. If career choices or grant corrections didn't reinforce the gap, the pattern might dissolve. But in their description, the feedback loop is clear.
answer: |-
  This pattern is indeed distinct from the concepts you've ruled out, and its recursive nature is crucial. While no single established term fully captures it, the phenomenon can be precisely defined. Here’s the conceptual carving:

  ### Core Phenomenon: **Evidence Collapse**
  **Definition**: A self-reinforcing process where:  
  1. **Evaluation systems prioritize measurable interventions** (via cost-effectiveness metrics, ROI, etc.).  
  2. **Unmeasurable options are systematically deprioritized**, starving them of resources needed to *become* measurable (e.g., monitoring infrastructure, talent pipelines, epistemic development).  
  3. **The resulting evidence gap** is misinterpreted as inherent to the option (e.g., "unprovable," "speculative") rather than a consequence of the evaluation system itself.  
  4. **Corrective mechanisms fail recursively**: Attempts to adjust for the bias rely on the same evidence-generating apparatus that caused the collapse.  

  ### Why Existing Terms Fall Short:
  - **Goodhart/Campbell**: Focus on distortion of *existing* metrics; here, metrics *fail to form at all* for entire domains.  
  - **Streetlight Effect**: Assumes the target exists but is unlit; here, the "light" (evidence infrastructure) is actively dismantled by neglect.  
  - **Path Dependence/Matthew Effect**: Describe accumulation of advantage, not the *epistemic void* where uncertainty compounds into false certainty.  
  - **Legibility**: Involves active simplification; here, collapse emerges passively from rational individual choices.  

  ### Your Three Pieces Unified:
  1. **Grantmaking**: Evidence collapse in *funding allocation*. Deprioritized interventions lose capacity to generate proof, creating a "certainty sink."  
  2. **Career Choice**: Evidence collapse in *labor markets*. Careers that can’t generate immediate metrics lose talent to those that can, eroding the field’s evaluative capacity.  
  3. **Recursive Correction Failure**: Evidence collapse in *metacognition*. Bias-estimation requires data from the biased system, making the void unresolvable internally.  

  ### Boundary Cases: When Is This Benign vs. Pathological?
  | **Context**                          | **Benign (Tolerable Collapse)**                          | **Pathological (Harmful Collapse)**                      |
  |--------------------------------------|----------------------------------------------------------|----------------------------------------------------------|
  | **Problem tractability**             | Unmeasurable options are genuinely low-impact            | Unmeasurable options may have catastrophic/existential upside (e.g., AI governance, institutional reform) |
  | **Time horizon**                     | Short-term optimization suffices                         | Long-term/systems change is necessary                    |
  | **Evidence elasticity**              | Evidence infrastructure exists elsewhere (e.g., academia)| Domain requires bespoke metrics (e.g., novel cause areas)|
  | **System feedback**                  | Corrections can import external evidence (e.g., academia)| Closed epistemic ecosystem (e.g., insular community)     |

  ### Why "Measurability Bias" Isn’t Enough:
  The term is often used loosely to describe *preferring measurable options*. It misses:  
  - The **feedback loop** (deprioritization → evidence erosion → further deprioritization).  
  - The **recursive trap** in corrections.  
  - The illusion that measurability is intrinsic rather than path-dependent.  

  ### What Would Change My Mind:
  1. **If the evidence gap is truly intrinsic**: If interventions like policy change *can’t* be measured even with adequate investment (e.g., due to chaotic systems), this is ordinary uncertainty—not collapse.  
  2. **If corrections escape recursion**: Ring-fenced funding *could* work if allocated via external heuristics (e.g., "fund 10% wildcards" without estimating bias size). Your case suggests internal systems lack such independence.  
  3. **If career effects are negligible**: If talent flow to measurable fields doesn’t meaningfully starve evidence infrastructure (e.g., enough evaluators remain), the feedback loop breaks.  

  ### Weakest Link in This Analysis:
  The recursion argument hinges on **no viable external calibration points**. If evaluators *can* access unbiased priors about the size of neglected domains (e.g., via historical analogs, interdisciplinary input), the collapse might be mitigatable. Your observation that "no one is rewarded for saying 'I can’t produce a number'" suggests such calibration is institutionally suppressed, making the recursion airtight.  

  ### Proposed Terminology:
  - **Primary term**: **Evidence Collapse** (emphasizes the active erosion of knowability).  
  - **Recursive subcomponent**: **Collapsed Evidence Trap** (the impossibility of internally quantifying the bias).  
  - **Systemic driver**: **Epistemic Starvation Cycle** (resource deprivation → evidence atrophy).  

  This pattern isn’t irrational—it’s locally optimal choices creating collective blindness. The pathology arises when the unmeasurable contains the highest-stakes outcomes. What you’re seeing is the dark side of evidence-based optimization: a machine that dismantles its own sensors when they’re most needed.
