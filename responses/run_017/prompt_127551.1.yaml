prompt: |-
  I'm in a philosophy of technology reading group this term and we keep going in circles about whether artifacts have politics — and by that I don't mean whether their designers had politics, or whether people happen to use them for political ends, but whether the thing itself can be political in the way the classic case is supposed to show: a parkway built with overpasses too low for buses to pass under, so that people without cars (in the version I was told, mostly poor and mostly Black beachgoers) simply can't reach the beach. My roommate, who builds warehouse robots, says that's obviously just a story about the intentions of whoever built the road plus the transit system around it, and the concrete is innocent; I think there's something to the idea that a design can carry authority or coercion in it even once the intentions have faded, but I can't say what, and apparently historians now argue about whether the low-bridge story is even true as told — which is part of why I'd rather have criteria than a verdict.

  So before we read any more of this literature, I want the spec: what does an account of the politics of artifacts have to deliver to be worth taking seriously? The list of things such a theory has to handle, with the case behind each, and your view on which are genuine desiderata and which are just the hobbyhorses of one camp (my supervisor, for instance, insists that any adequate account must be able to say whether a given artifact is unjust, not merely political — is that a requirement or a prejudice?). Cases I want covered: the overpasses, where both the intent and the facts are contested; machines whose political effects nobody chose and nobody can now undo, like a harvesting machine that dissolved an entire class of farm jobs, or a file format everyone adopted and that it's now ruinously expensive to leave — I've started calling these ratchets, where the politics seems to live in an asymmetry: cheap to adopt, expensive to reverse, and nobody ever signed off on the asymmetry; the same artifact used for opposite political purposes by two different groups, like an encrypted messenger used by dissidents in one country and by a cartel in another; technologies that seem to require a political arrangement in a strong sense, of the sort people gesture at when they say you can't have nuclear weapons without a centralized secretive state, versus ones that look flexible all the way down; and the boring case — the brick, the bridge with normal clearance, the paperclip — because whatever the account is, it shouldn't end up calling literally every object political, or it has said nothing.

  Two more things I want flagged. First, the distinctions people keep collapsing, and which of those collapses are fatal: having a politics versus having political effects, the politics of the artifact versus the politics of whoever makes, owns or regulates it, being political versus being inherently or essentially so, and whether the notion doing the work is coercion, authority, or mere differential advantage. Second, if some subset of your desiderata can't be satisfied together — it looks to me like handling unintended structural politics pushes toward saying almost everything has a politics, which is exactly the overgeneration I want to block — say so, and say which single requirement does the most work in excluding candidate theories. Give me exactly eight numbered items, no intro and no closing: items 1 through 7 are the desiderata, each a sentence or two with the motivating case and a note on whether it's non-negotiable or a preference of one camp; item 8 is the pair you think can't be jointly met, plus the one requirement that knocks out the most theories. Don't bother scoring anyone's actual theory against the list, we'll do that ourselves in the group.
reasoning: |-
  Hmm, the user is grappling with a core debate in philosophy of technology - whether artifacts have inherent politics beyond designer intentions or usage contexts. They've presented a highly structured request for evaluative criteria to assess theories on this matter, with specific cases to cover and conceptual distinctions to preserve.

  The parkway overpass example serves as their central puzzle - where infrastructure design allegedly encodes racial exclusion. But they note historical disputes about this case's accuracy, which makes them want theory-agnostic criteria rather than verdicts. Their warehouse robotics roommate represents the intentionalist position that artifacts are neutral conduits.

  Key requested elements: They want seven desiderata covering contested cases (overpasses, job-displacing "ratchet" technologies, dual-use artifacts like encryption, necessary political arrangements like nuclear states), while avoiding overgeneralization to "boring" objects. Also requested: clarity on four conceptual distinctions (politics vs effects, artifact vs agents, contingent vs essential politics, and modes of influence like coercion vs differential advantage). Finally, they want identified tensions between criteria, with one "theory-killer" requirement.

  Notable nuances: Their supervisor pushes for normative judgments of injustice - is this necessary or ideological? They're wary of theories where "everything is political" becomes meaningless. The "ratchet" concept is clever - path-dependent technologies with asymmetric adoption costs that lock in social consequences.

  Philosophical touchstones: This engages Langdon Winner's canonical "Do Artifacts Have Politics?" but extends beyond it. The nuclear weapons example recalls his argument about inherently political technologies, while the encryption case challenges it. The harvesting machine example evokes Marx on machinery displacing labor.

  Structuring the response: Must deliver exactly eight numbered items - seven desiderata plus one conflict analysis. Each desideratum needs: 1) core requirement 2) motivating case 3) status indicator (essential/preference). The eighth item must identify irreconcilable criteria and the strongest theory-excluding requirement.

  Key tensions to flag: Avoiding overgeneralization (#7) may conflict with recognizing structural politics (#3). The injustice requirement (#6) might be normative overreach. The nuclear weapons case (#5) tests theories most severely by demanding essential (not contingent) politics.

  The "theory-killer": I'll propose avoiding overgeneralization (#7) as the strongest filter, since theories failing this become self-refuting (if everything is political, nothing is). But this directly clashes with accounting for unintended consequences (#3), creating the central dilemma.
answer: |-
  Here are eight numbered items per your specifications:

  1.  **Must distinguish the artifact's inherent properties from designer intent or user interpretation.** (Motivation: Overpass case where intent is disputed; artifact's physical clearance remains regardless of motivation.) *Status: Non-negotiable. Core to the question.*

  2.  **Must account for unintended, emergent, or structural political consequences arising from the artifact's design/function.** (Motivation: Harvesting machine creating job loss; file format "ratchets" with asymmetric adoption costs.) *Status: Non-negotiable. Handles key cases beyond intent.*

  3.  **Must explain artifacts whose political effects become "baked in" or difficult to reverse, even when recognized as problematic ("ratchets").** (Motivation: File format lock-in; infrastructure like the overpasses being prohibitively expensive to change.) *Status: Non-negotiable. Captures path-dependence and structural inertia.*

  4.  **Must accommodate artifacts used for diametrically opposed political purposes by different groups ("dual-use").** (Motivation: Encrypted messenger used by dissidents and cartels.) *Status: Non-negotiable. Tests if politics resides purely in use or also in affordances.*

  5.  **Must distinguish artifacts that merely *enable* certain politics from those that seem to *necessitate* specific political arrangements.** (Motivation: Nuclear weapons requiring a centralized state vs. a brick which doesn't necessitate any particular politics.) *Status: Non-negotiable. Tests claims of inherent, strong necessity.*

  6.  **Must avoid overgeneralization: the theory should *not* imply that all artifacts are political in a meaningful sense.** (Motivation: "Boring" cases like a standard brick or normal bridge; prevents the concept from becoming vacuous.) *Status: Non-negotiable. Essential for conceptual utility.*

  7.  **Must clarify the mode of political agency/impact: coercion (like exclusion), authority delegation, differential advantage, constitutive shaping, etc.** (Motivation: Overpass as potential coercion vs. harvesting machine creating differential economic advantage vs. nuclear weapon delegating authority.) *Status: Non-negotiable. Precision needed to avoid conflating distinct mechanisms.*

  8.  **Cannot jointly satisfy Desideratum 2 (Unintended/Structural Effects) and Desideratum 6 (Avoiding Overgeneralization) without a robust criterion for "meaningful" politics.** *The requirement doing the most work in excluding candidate theories is Desideratum 6 (Avoiding Overgeneralization).* Theories failing this become self-refuting or trivial.
