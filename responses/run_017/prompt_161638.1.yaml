prompt: |-
  Please act as a professional philosopher — someone with real expertise in the philosophy of mind, emotion, and fiction, who also understands something about how virtual environments are actually built and moderated. Think the problem through before you write: I would much rather you consider and reject three or four candidate concepts than settle on the first one that rings a bell. I'm not asking for references, reading suggestions, or citations — I can't chase them up, and they wouldn't help me; I want the carving of the thing itself.

  The context: I handle safety and moderation for a social VR platform, and I keep running into one configuration that I have no clean vocabulary for.

  First instance. A player walks out onto a walkway the designers have built to look like cracked glass over a long drop. They hesitate, hands go out for the rail, some refuse to continue. If we attach a small in-world cost to turning back — a failed objective, a respawn timer — most of them go on. If we attach a real-money reward to crossing, all of them cross. Two minutes later, in the post-session chat, the same player writes that obviously it wasn't real and there was zero risk, and they aren't being defensive or ironic about it.

  Second instance. In a ranked mode where a character can die permanently — a character the player has spent months building — players report sweating and nausea, and they buy protective items with real money. The same players, asked directly, will say the character is a bundle of numbers and that losing it harms nobody. What's striking is what the intensity tracks: it scales with the stakes inside the world (ranked versus unranked, permanent versus respawning loss) and barely at all with how photorealistic the rendering is. And it doesn't habituate. People with two thousand hours flinch as hard as newcomers.

  Third, and this is the part I most want handled: it isn't belief. Asked mid-session whether there is any chance of being physically hurt, they say no, and they act on it — they will take the headset off to answer the door with a threat still on screen, they'll let a child watch, they don't call anyone. So the reaction isn't tracking a credence about real danger, and it isn't confusion, and it isn't mere startle either, since people spend money to avoid the outcome.

  What I need is a name, if there is one, for this: a bodily and practical response that behaves like fear, or like valuing something, while coexisting with a settled, action-guiding belief that nothing real is at stake, and with no experienced conflict between the two. I expect the philosophy-of-fiction literature has something in this neighbourhood, but I've been told my field's own notion of presence or immersion is the wrong grain: it explains how strong the illusion is, not how the illusion sits beside knowledge that it is an illusion.

  I also need the edges, because I have to write policy with this. Specifically: (a) What would have to change for this to stop being the special state and become plain fear — a real person behind the avatar making a credible threat? Consequences that survive logging off? A clinical exposure session where the fear is the entire point? (b) What would make it mere imagination or play-acting, with no claim on us at all? (c) When the in-world stake is convertible into real money, is the response about the world or about the money? (d) Does participation break the analogy to whatever established concept you reach for? In a film or a novel the consumer is a spectator and nothing they do is part of the story; in VR the player's action is part of the fiction, and some of the other characters are driven by real people with real intentions. Is that the same phenomenon with a louder body, or a different one?

  In my notes I've been calling it stake-locking: the stake drives everything while you're inside the world, nothing at all once you're out, and the subject never registers the mismatch as a conflict. I'll drop that label immediately if there is a proper one. Either way, give me a definition tight enough that someone could argue with it, and tell me where it stops applying — I need to be able to write, without contradiction, both that a user was genuinely frightened and that nothing was done to them.

  Answer as a numbered list of exactly five items, one or two sentences each, with no introduction and no concluding summary: (1) the nearest established concept and what it genuinely covers; (2) the respects in which what I've described is not that; (3) the strongest rival candidate and why you rejected it; (4) your recommended term — mine or yours — with your definition; (5) the two or three boundary cases that decide whether a given incident falls inside it.
reasoning: |-
  Okay, the user is asking me to act as a professional philosopher specializing in philosophy of mind, emotion, and fiction, with knowledge about virtual environments. They work in safety and moderation for a social VR platform and need help conceptualizing a specific phenomenon they've observed.

  The phenomenon involves players experiencing intense bodily and emotional reactions (like fear or valuing something) in VR scenarios, despite consciously knowing there's no real risk. For example:
  - Players hesitate on a virtual cracked glass walkway but cross if incentivized
  - Players feel genuine distress at permanent character loss in ranked modes, even after investing months or real money
  - Crucially, they don't actually believe there's real danger - they'll remove headsets to answer doors, let children watch, etc.

  The user needs:
  1. A precise term for this state where physiological response coexists with rational disbelief
  2. Boundary conditions to write policy:
     a) When does this become real fear?
     b) When is it mere play-acting?
     c) How do convertible real-money stakes affect it?
     d) Does participant agency make it different from passive media consumption?

  They've been using "stake-locking" but want proper terminology. They want exactly five numbered responses without intros/conclusions.

  First, I need to identify the closest philosophical concept. This resembles the "paradox of fiction" (how we feel emotions for fictional entities) but differs because:
  - Traditional paradox focuses on passive consumption (books/films)
  - Here, the user is an active participant
  - The bodily reactions are more visceral

  Also relevant is "suspension of disbelief," but that implies deliberate setting aside of disbelief, whereas here the players maintain conscious awareness of fiction throughout.

  Coleridge's concept doesn't fit because players aren't suspending disbelief - they're fully aware it's fake while still reacting.

  "Imagination" theories (Walton's quasi-emotions) might apply, but they typically don't account for:
  - Physiological responses (sweating, nausea)
  - Real-money expenditures to avoid outcomes
  - Lack of habituation over time

  The embodied cognition framework might be more relevant since it connects mental states directly to physical reactions. But I need to specify how.

  For the user's phenomenon, the key features are:
  1. Belief/knowledge of safety remains intact
  2. Strong physiological reactions occur
  3. Motivates real-world actions (spending money)
  4. No cognitive dissonance
  5. Scales with in-world stakes, not realism
  6. Doesn't habituate

  This suggests a cognitive architecture where the immersion triggers primal threat responses that bypass higher cognition.

  So my proposed term would be "Embodied Illusory Stakes" - capturing both the bodily reaction and the understood fictionality.

  Boundary conditions:
  - Becomes real fear when: Consequences extend beyond session (doxxing, real threats), or in clinical contexts where fear is the goal
  - Becomes mere play-acting when: No physiological markers, no resource expenditure
  - With real-money stakes: Response blends genuine valuation with embodied reaction
  - Participation difference: Active agency intensifies but doesn't fundamentally alter the core phenomenon from passive consumption

  I'll structure this exactly as requested: 5 numbered items covering established concept, differences, rejected alternatives, recommended term with definition, and boundary cases.
answer: |-
  (1) The closest established concept is *Kendall Walton's "quasi-emotion"* from make-believe theory, which covers affective responses to fictional scenarios where subjects maintain awareness of unreality, explaining how we "fear" monsters in films without genuine belief in danger.  
  (2) Your cases differ because quasi-emotions typically lack sustained physiological intensity (sweating, nausea), do not motivate real-world expenditures (buying protective items), and habituate with exposure—none of which holds here.  
  (3) The strongest rival is *Coleridge's "suspension of disbelief"*; I reject it because it implies temporary, volitional suppression of skepticism, but your users never doubt reality—they explicitly affirm the fiction mid-reaction while acting bodily *as if* stakes exist.  
  (4) Use **embodied illusory stakes**: *a non-doxastic state where deep immersion in a contingent rule-set triggers autonomic and motivational systems identical to real valuing or threat-response, despite concurrent belief in the system's fictionality and no subjective conflict*.  
  (5) Boundaries: (a) It becomes plain fear if stakes transcend the fiction (e.g., real-world harassment or clinical exposure therapy); (b) It reduces to play-acting if no physiological arousal or resource expenditure occurs; (c) Convertible stakes blend embodied illusion with rational valuation; (d) Participation amplifies but does not redefine the phenomenon—the core mechanism persists across active/passive media.
