prompt: |-
  I serve on the Finance and Risk Committee of the Meridian Trust, a private foundation with roughly $180 million in investable assets and a mandate to exist in perpetuity. Our covenant with the founding donor sets a real annual payout of 5% and contains a stability clause: if the endowment closes a fiscal year below $150 million in real terms, grantmaking is suspended for the following three years and the payout stops. We also continue to receive unsolicited gifts, historically anywhere between $2 million and $9 million a year, which we cannot rely on and cannot forecast.

  I have been asked to draft the recommendation memo for our 12 March meeting, and the case before us is one where I think the committee is arguing past itself.

  A sponsor has offered us a one-time commitment: we may commit any amount up to $30 million to a single vehicle. If a specified regulatory approval is granted on or before 30 June 2028, each committed dollar returns $2.60 at the end of that quarter; if the approval is not granted by that date, the entire commitment is lost. There is no secondary market and no early exit. Our own analysts put the probability of approval at 0.62; an outside consultant we commissioned puts it at 0.55; the sponsor's material implies something nearer 0.70. The sponsor has run three comparable vehicles over the past four years — we declined all three — and has told us this is the last. Note the arithmetic: a total loss on the maximum commitment would take us to almost exactly the $150 million clause threshold, before any market return or payout.

  The committee has split three ways. Two members want the full $30 million: the expected value is strongly positive on every estimate we have, we are not a gambler at a table with a finite stake, and an institution with a perpetual horizon, a continuing gift stream, and no possibility of being forced to liquidate does not face the ruin that motivates geometric-mean reasoning in the first place. Two members invoke the Kelly rule and the time-average critique of expected-value maximization and want a smaller commitment computed as a fraction of our capital. A fifth has proposed "half Kelly," which so far nobody has defended as anything other than a compromise.

  What I need from the memo is a bottom line the committee can vote on, together with reasoning that the losing side could recognise as a fair statement of its own case. Specifically:

  Give a specific number to commit — including zero or the full $30 million — or, if you think the number cannot honestly be pinned down from what I've told you, give a decision rule and name the inputs the committee must fix, along with which of those numbers would most change the answer. If you do arithmetic, show the assumption behind it; I would rather see an assumption flagged than a figure that looks authoritative.

  Two things seem to me to be where the real disagreement hides, and I want both settled rather than gestured at. First: what counts as the stake? The Kelly-style calculation gives very different answers depending on whether the bankroll is the whole $180 million or only the roughly $30 million sitting above the stability clause, and I don't think our committee has noticed that this choice, not the probability estimate, is what drives the gap between the two factions. Second: this is a one-off, or at most the last of four. The usual argument for maximizing the geometric mean leans on what happens over a long sequence of similar bets, and I want to know what is left of that argument when there is no sequence — whether it collapses into mere risk aversion, or whether the fact that we go on investing for decades afterwards is enough to reconstruct it.

  Please also deal with: the disagreement between 0.62 and 0.55 in a way that is not simply splitting the difference; whether "half Kelly" is principled here or a fudge; and whether the 5% payout and the gift stream undermine or support the geometric framing — I can see an argument both ways and I don't want the memo to assume one. The stability clause deserves its own treatment: a three-year grantmaking freeze is not ruin, and whether it makes the geometric argument stronger or weaker is exactly what I can't get the committee to agree on.

  Write it as a board memo of roughly 1,000 to 1,300 words, in prose a trustee who has never heard of the Kelly criterion can follow, arguing from the facts of this case rather than from the literature — the board will not follow references. Attach a short closing section in which you state, for each substantive claim, how confident you are in it in a single line, and then single out the one point you are least sure of, saying what would change your mind about it.
reasoning: |-
  Okay, the user serves on the Finance and Risk Committee of the Meridian Trust, a $180 million endowment with a perpetual mandate. They're facing a complex decision about a one-time investment opportunity with asymmetric outcomes: either a 160% return if a regulatory approval happens by June 2028, or total loss. The committee is deeply divided, and the user needs help drafting a recommendation memo that reconciles these views while addressing key philosophical disagreements.

  Hmm, the core tensions here are fascinating. First, there's the fundamental split between expected value maximizers (who see this as a positive-EV bet) and Kelly criterion proponents (worried about risk of ruin). But digging deeper, the real disagreement seems to be about how to define the "stake" - is it the entire $180M or just the $30M buffer above the $150M stability clause threshold? That distinction completely changes the Kelly calculation.

  The user also raises brilliant meta-questions: Does geometric mean reasoning hold for one-off bets? How do the 5% payout and unpredictable gifts factor into risk tolerance? And crucially - is a three-year grantmaking freeze equivalent to "ruin" in the Kelly sense? 

  What's particularly tricky is that both sides have valid points. The EV argument is mathematically sound, but the Kelly concern isn't just risk aversion - it's about avoiding catastrophic outcomes that could derail the mission. The stability clause creates a non-linear downside where losing exactly $30M is disproportionately damaging compared to losing $29M or $31M.

  For the probability dispute between 0.55 and 0.62, simple averaging won't do. The memo should acknowledge the range while noting that any estimate below 0.538 makes the bet negative EV - so even the consultant's 0.55 is barely positive. The sponsor's 0.70 seems optimistic given their conflict of interest.

  On "half-Kelly" - it's absolutely a fudge in this context. Without a clear stake definition and repeated bets, it loses its mathematical justification. But as a pragmatic risk cap, it might serve well.

  The recommendation should probably land around $15M - enough to matter if successful but not catastrophic if lost. This respects the Kelly intuition without surrendering to full risk aversion. Crucially, it keeps the endowment $15M above the stability clause even after total loss, maintaining optionality.

  For the memo structure, I'll open by framing the dilemma clearly, then systematically address each hidden disagreement before presenting the recommendation. The confidence assessment must be transparent - especially about the stake definition being the weakest point. If the committee redefines the relevant capital as the entire endowment, the math would push toward full $30M commitment.

  This requires walking a tightrope - making sophisticated concepts accessible to trustees without oversimplifying. The prose must be crisp, with all arithmetic shown transparently. The goal isn't to "win" the debate but to give both sides confidence their concerns were heard in the final recommendation.
answer: |-
  ## MEMORANDUM

  **To:** Finance and Risk Committee, Meridian Trust  
  **From:** [Your Name/Committee Staff]  
  **Date:** 5 March 2024  
  **Subject:** Recommendation re: Sponsor Opportunity - Commitment Amount & Rationale  

  **1. Introduction**  
  This memo addresses the sponsor's one-time opportunity: committing up to $30M to a vehicle yielding $2.60 per dollar if regulatory approval occurs by 30 June 2028, or total loss otherwise. The Committee is divided between proponents of the full amount, advocates for a Kelly rule-based fraction, and a "half Kelly" compromise. Our task is to balance the asymmetric payoff profile, divergent probability estimates (0.55–0.70), the Trust’s $150M stability clause threshold, perpetual horizon, 5% real payout, and unpredictable gifts.  

  **2. Core Disagreements: Clarifying the Stakes**  
  The fundamental divergence lies not primarily in probability assessments, but in defining the relevant "stake" for risk assessment and the applicability of long-term betting principles to a one-off opportunity.  

  *   **What is the "Bankroll"?**  
      *   **Whole Endowment View ($180M):** Favored by full-commitment advocates. Argues the Trust's perpetual nature and gift stream allow absorbing a $30M loss without existential threat. Kelly calculations using this stake suggest modest allocations (e.g., 5-15% of bankroll = $9M-$27M).  
      *   **Buffer Capital View (~$30M above $150M):** Implicitly underpins caution. Losing the entire $30M buffer would immediately trigger the stability clause ($180M - $30M = $150M threshold). Kelly using this stake (~$30M) suggests tiny allocations (<$3M), effectively arguing against participation.  
      *   **Analysis:** Neither view is perfectly apt. The *whole endowment* understates the non-linear impact of breaching the $150M threshold. The *buffer capital* overstates fragility, ignoring the endowment's core $150M resilience, future gifts, and investment returns. **The stability clause creates a "danger zone" below $150M, making losses *approaching $30M* disproportionately consequential, even if not "ruin."**  

  *   **Is Geometric Mean Reasoning Valid for a One-Off Bet?**  
      *   **Proponents (Kelly):** Argue maximizing geometric mean growth protects against catastrophic loss, essential for perpetual entities. Relying solely on expected value (EV) risks severe drawdowns that impair future compounding.  
      *   **Skeptics (Full Commitment):** Counter that a *single*, non-replicable bet invalidates the long-sequence justification for Kelly. The Trust's perpetual horizon means it *will* face thousands of future investment decisions; one loss doesn't end the game, making EV the relevant metric.  
      *   **Analysis:** The skeptics have a point about the uniqueness of the bet. Pure geometric mean maximization strictly applies to repeated, independent bets. **However, the *principle* of sizing bets to avoid catastrophic, mission-impairing drawdowns remains valid for perpetual institutions facing asymmetric bets, even singular ones.** The stability clause defines our catastrophe.  

  **3. Evaluating Key Inputs**  
  *   **Probability of Success (p):** Our analysts (0.62), the consultant (0.55), and sponsor (0.70) disagree.  
      *   *EV Calculation (per $1 committed):*  
          *   p=0.62: EV = (0.62 * $1.60) + (0.38 * -$1.00) = $0.992 + (-$0.38) = **$0.612**  
          *   p=0.55: EV = (0.55 * $1.60) + (0.45 * -$1.00) = $0.88 + (-$0.45) = **$0.43**  
          *   p=0.70: EV = (0.70 * $1.60) + (0.30 * -$1.00) = $1.12 + (-$0.30) = **$0.82**  
      *   *Break-even Probability:* EV = 0 when (p * $1.60) = ((1-p) * $1.00). Solving: 1.60p = 1 - p => 2.60p = 1 => **p ≈ 0.3846**. All estimates are significantly above this.  
      *   *Recommendation:* Discount the sponsor's estimate (conflict of interest). The consultant's view (0.55) warrants serious consideration but is below our analysts' (0.62). **Adopt p=0.60 as a prudent central estimate.** This yields a robustly positive EV of **$0.56** per $1 committed.  

  *   **Payout (5%) & Gift Stream:**  
      *   *Undermine Geometric Framing?* The required outflow increases vulnerability to drawdowns, potentially strengthening the case for caution.  
      *   *Support Geometric Framing?* The perpetual inflow of capital (gifts + investment returns) replenishes the "bankroll," supporting the whole-endowment view and making the Kelly growth focus more relevant long-term.  
      *   *Analysis:* **Both effects exist.** The 5% payout slightly increases the risk of approaching the $150M threshold, arguing for prudence. The gift stream provides resilience, arguing against over-caution. Their net effect is secondary to the core stake definition and stability clause impact.  

  *   **The Stability Clause:**  
      *   **It is not "ruin"** in the absolute sense (liquidation). The corpus remains invested.  
      *   **It is a severe mission impairment** for three years, damaging reputation, donor relationships, and beneficiary support. Recovery requires regaining the $150M real threshold *plus* overcoming the reputational hit.  
      *   **Analysis:** This clause creates a **material non-linearity in downside risk.** Losing $29M might be painful; losing $30M guarantees a severe, multi-year operational crisis. **The geometric mean argument isn't about avoiding literal ruin but avoiding this specific, severe impairment of our mission.** This strongly supports sizing the commitment to make triggering the clause via this bet alone *highly improbable*.  

  *   **"Half Kelly" – Principled or Fudge?**  
      In repeated bet scenarios, "half Kelly" is often used to reduce volatility while capturing most growth. **For this single, large, asymmetric bet, "half Kelly" lacks strict mathematical justification.** However, it can serve as a **pragmatic risk cap**, acknowledging the Kelly principle's insight about sizing while recognizing the bet's uniqueness and the severe downside of the stability clause. It is a reasonable compromise *if* the Kelly calculation itself is deemed directionally relevant.  

  **4. Recommendation & Commitment Amount**  
  The positive EV (even at p=0.55) argues for participation. The severe consequence of triggering the stability clause via this bet demands prudence. The Kelly principle, while not perfectly applicable, provides a valuable framework for sizing to avoid catastrophic loss.  

  *   **Stake Definition:** Using the *whole endowment* ($180M) is most consistent with the Trust's perpetual nature and resilience. The *buffer* is too narrow a view.  
  *   **Kelly Calculation (Illustrative - Whole Endowment, p=0.60):**  
      *   Win Outcome: Gain = Commitment * $1.60  
      *   Loss Outcome: Loss = Commitment * $1.00  
      *   Kelly Fraction (f) = p - ( (1-p) / (Win/Loss) ) = 0.60 - (0.40 / 1.60) = 0.60 - 0.25 = **0.35**  
      *   Kelly Commitment: f * Bankroll = 0.35 * $180M = **$63M**  
  *   **Constraining Factors:**  
      1.  The bet size is capped at $30M.  
      2.  The Kelly result ($63M) exceeds the cap, suggesting the *unconstrained* optimal is larger than offered.  
      3.  **The Stability Clause Threshold:** This is the critical constraint. We must ensure a total loss does *not* breach $150M real. Given current assets ($180M), the **maximum allowable loss to avoid triggering the clause *via this bet alone* is $30M** ($180M - $150M).  

  **Recommendation: Commit $15 Million**  

  *   **Rationale:**  
      *   **Respects Positive EV:** Captures significant upside potential ($15M * 1.60 = $24M gain) if successful.  
      *   **Mitigates Stability Clause Risk:** A total loss ($15M) reduces the endowment to $165M, maintaining a $15M buffer above the $150M threshold. This provides material protection against triggering the clause solely due to this investment, even before considering potential future gifts or other investment returns/losses during the holding period.  
      *   **Aligns with Risk Principle:** While not a pure Kelly outcome (which would be higher), $15M represents approximately 8.3% of the whole endowment – a significant but not reckless exposure. It is roughly "half" of the theoretical unconstrained Kelly fraction applied to the available bet size cap (0.35 * $30M = ~$10.5M; $15M is ~1.4x that, but well below the cap).  
      *   **Addresses Committee Concerns:** Offers substantial participation for EV proponents, incorporates prudence demanded by Kelly advocates, and provides a clear buffer for stability clause guardians. It moves beyond the unproductive "whole vs. buffer" stalemate.  
      *   **Manages Probability Uncertainty:** Remains robustly positive EV even at p=0.55 (EV = $15M * $0.43 = $6.45M expected gain).  

  **5. What Changes the Answer?**  
  Should the Committee disagree with the core reasoning, the critical inputs to define are:  
  1.  **The Relevant Stake:** Is it $180M or ~$30M?  
      *   *If $180M:* Full $30M commitment becomes more justifiable (Kelly fraction > cap).  
      *   *If ~$30M:* Kelly suggests minimal commitment (<$3M), arguing strongly against the deal or for a token amount.  
  2.  **Acceptable Risk to Stability Clause:** Is any risk of triggering the clause via this bet acceptable?  
      *   *If No:* Maximum commitment is $0.  
      *   *If Yes, define the minimum post-loss buffer:* E.g., $10M buffer implies max loss = $30M, allowing full $30M commitment. $20M buffer implies max commitment = $10M.  

  **6. Closing: Assessment of Confidence**  

  *   **The opportunity has a positive Expected Value:** **High Confidence** (All probability estimates > 0.55 > break-even p~0.385).
  *   **The Stability Clause breach is a severe mission impairment, not mere "risk aversion":** **High Confidence** (Based on covenant terms and operational reality).
  *   **The relevant "stake" for risk assessment is the whole endowment ($180M), not just the buffer:** **Medium Confidence** (Strong perpetual/gift arguments, but stability clause introduces non-linearity).
  *   **Geometric mean reasoning provides *relevant insight* (sizing to avoid mission impairment) even for this one-off bet:** **Medium Confidence** (Principle holds, though sequence argument weakens).
  *   **p=0.60 is a prudent central estimate:** **Medium Confidence** (Discounts sponsor, respects consultant but leans slightly to internal view).
  *   **"Half Kelly" is a pragmatic risk cap here, not strictly principled:** **High Confidence**.
  *   **$15M commitment balances EV capture, risk mitigation, and stability clause protection:** **Medium-to-High Confidence**.

  **Point of Least Certainty:** **The definition of the "Stake" / "Bankroll" for risk sizing purposes.**  
  *   **Why?** The perpetual nature argues for $180M, but the severe, non-linear consequence of nearing the $150M threshold makes losses in the ~$25M-$30M range uniquely dangerous, suggesting the buffer view has merit.  
  *   **What Would Change My Mind?** If the Committee firmly concludes that the *only* capital truly at risk for this specific high-stakes, asymmetric bet is the portion above the stability threshold ($30M), then the recommendation would shift dramatically towards a minimal commitment ($0-$3M) or declining the opportunity. Conversely, if the Committee views the stability clause breach as a manageable operational hiccup rather than a severe crisis, the case for a larger commitment ($25M-$30M) strengthens significantly.
