prompt: |-
  You are a professional philosopher specialising in philosophical logic and the philosophy of language, with years of work on vagueness behind you. Please work slowly and carefully: before committing yourself, sketch out for your own benefit the space of candidate principles you might offer me — the standard ones, the hybrids, the ugly ones — and run each against the verdicts below, because I would rather have two or three precisely stated candidates with their costs spelled out than one tidy story that quietly abandons a case it cannot handle. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of my question. Please write in British English.

  I am finishing a thesis chapter in legal theory on how standards — reasonable care, dependant child, permanently incapacitated — get applied at the margin, and I have been trying to work out what I actually think about vagueness by going case by case rather than by signing up to a theory. My supervisor thinks the whole debate is a pseudo-problem generated by an over-literal picture of meaning; a friend in formal semantics thinks my verdicts are simply inconsistent and that I should grow up and either be an epistemicist in Williamson's style, with sharp boundaries somewhere and permanent ignorance of where, or a supervaluationist in Fine's style, with a range of admissible precisifications and determinate truth as truth on all of them. I have resisted both, and here is roughly where I land. (a) A man with eight hairs is bald, a man with a full head is not, and in the stage version — a machine removing one hair a second while he stands there — I do not think there is a hair count at which he becomes bald: no fact of the matter, not merely no way of telling. (b) Run the machine in reverse, adding hairs one a second to a freshly shaved head, and — this is the verdict I am least sure of, and the one my friend laughs at — I think the transition, if there were one, would not be at the same point: the count at which he stops being bald going up is not the count at which he starts being bald going down. (c) A committee of seven whose exact ages I know, say 34, 41, 47, 52, 58, 61 and 63, is neither determinately young nor determinately not young, and here the ignorance story seems to me to have nothing to work with, because there is nothing further about those ages to discover. (d) Likewise for a baldness judgement where I know the exact hair count, the exact scalp coverage and the pattern of loss: still indeterminate, and not through any gap in my information. (e) But when a grant panel has to decide whether an applicant is bald for a subsidy, with full photographs and counts in front of it, I think there is a determinate right answer for them to reach, one they could get wrong, and that it is fixed by what the subsidy is for even though no one could derive it. (f) Of a borderline case I will happily assert that either Jack is bald or he is not, and I will also assert that it is not determinate whether Jack is bald; I do not want to give up either. (g) If Jill has more hair than Jack, I take it that if Jack is bald then Jill is bald is determinately true even though neither Jack is bald nor Jill is bald is determinate, and this seems to me the strongest point in favour of the supervaluationist picture. (h) Yet I also think second-order borderline cases are real — there are cases that are borderline borderline — and I deny that whenever it is not determinate whether Jack is bald it is determinate that it is not determinate whether Jack is bald; that collapse of higher-order vagueness into a single sharp boundary is, to me, what sinks the supervaluationist treatment of determinately. (i) And when a legal definition tries to help by saying that bald means noticeably hairless to a casual observer, I do not think the vagueness disappears; it moves into noticeably and casual observer, and I do not believe there is a bottom level of perfectly precise predicates that the vague ones abbreviate.

  The principle I have been toying with, and which I want tested rather than flattered, goes like this: a predicate is vague for a speaker or a context just in case her dispositions to apply it, together with the purpose at hand, leave open a range of admissible ways of making it precise and nothing else settles which is in force; a sentence is determinately true when true on every admissible precisification; the purpose at hand narrows the range and can in principle narrow it to one, which is what makes (e) come out determinate, while the route by which the question was reached helps settle which precisifications count as admissible in the first place, which is what is supposed to explain (b); and the range never closes for good, which is what second-order borderline cases consist in. Can you tell me, first, whether that survives (a) to (i) and where it has to be repaired — in particular whether the purpose clause can do the work I need in (e) without making every vague predicate sharp the moment it appears in a statute or a form, and whether the route clause in (b) is coherent at all rather than a muddle between my use of a predicate and the property it tracks; second, what the repaired account predicts for two cases I have not listed, say a standard whose very purpose is contested, such as dependant child in a statute whose drafters disagreed about why dependence matters, and a predicate whose users are all dead and whose use-dispositions we have reconstructed exhaustively from a corpus; and third, and most usefully, which of my verdicts each candidate cannot accommodate, and which of them I ought to abandon if I want a principle worth having at all.
reasoning: |-
  Hmm, the user is working on legal theory concerning vague standards like "reasonable care" or "bald," and they've presented a set of specific intuitions about vagueness cases. They've developed their own principle involving context-dependent admissible precisifications influenced by purpose and "route," and want it tested against their intuitions and new cases. They also want alternatives evaluated.

  First, let's unpack their principle. It has several components: 
  - Vagueness arises when dispositions plus purpose leave multiple admissible precisifications open. 
  - Determinacy is truth on all admissible precisifications. 
  - Purpose narrows the range (potentially to one, explaining legal determinacy in (e)). 
  - "Route" (how the case was reached) affects admissibility (explaining hysteresis in (b)). 
  - Higher-order vagueness exists because ranges "never close for good."

  Now, testing against their cases:
  - (a) No sharp boundary: Supported, as multiple precisifications remain throughout.
  - (b) Hysteresis (asymmetry between hair loss/growth): The "route" clause directly addresses this by making admissibility path-dependent. This is unorthodox but coherent if we interpret "route" as contextually fixing different comparison classes or standards.
  - (c) & (d) Ignorance irrelevant: Handled, as indeterminacy stems from multiple precisifications, not epistemic lack.
  - (e) Legal determinacy: Purpose narrows precisifications to one. But this risks over-sharpening unless "purpose" is subtle (e.g., fixes relevant dimensions without pinning exact thresholds).
  - (f) Retains LEM and indeterminacy: Standard supervaluationism handles this via truth gaps for "determinately P," but LEM holds for P itself.
  - (g) Monotonicity (if balder Jack is bald, so is Jill): Supervaluationism naturally preserves this, as all precisifications respect hair-count ordering.
  - (h) Higher-order vagueness: Claimed via "ranges never close," but needs refinement. Standard supervaluationism struggles with higher-order vagueness; their open-endedness might help but requires a non-sharp "admissibility" predicate.
  - (i) Vagueness transfer: Handled, as "noticeably" etc. inherit open precisification ranges.

  Key tensions:
  - **Purpose in (e)**: If purpose narrows to one precisification in law, why not always? Need to argue legal contexts impose unique resolutions (e.g., decision-forcing function) where everyday judgments don't. Must avoid implying statutes eliminate vagueness entirely.
  - **Route in (b)**: Is it coherent? If "route" affects which precisifications are admissible, it's not a muddle but a form of context-dependence (like "flat" tolerating different bumps depending on whether we're discussing deserts or tabletops). Path-dependence can be built in.
  - **Higher-order vagueness (h)**: Their principle asserts it but doesn't formally model it. Needs "admissible" itself to be vague, which is feasible but requires care to avoid circularity.

  New cases:
  - **Contested purpose (e.g., "dependant child")**: Here, purpose doesn't narrow precisifications but fragments them (e.g., economic vs. emotional dependence criteria). Prediction: *more* indeterminacy, as admissible precisifications diverge radically. This seems correct—statutory ambiguity exacerbates vagueness.
  - **Dead users with exhaustive corpus**: If dispositions are fully known, does vagueness vanish? Their principle says no—dispositions plus purpose leave range open. Corpus might fix past applications but not future ones, or purpose might still underdetermine. Prediction: vagueness remains unless the corpus implies a unique precisification (unlikely).

  Alternative theories and their failures:
  1. **Epistemicism (Williamson)**: 
     - Fails (a), (c), (d): Insists on sharp boundaries + ignorance, contradicting no-fact-of-the-matter verdicts. 
     - Fails (h): Higher-order vagueness is problematic (sharp cutoff for "knowably borderline"?). 
     - Handles (e), (f), (g) well.
  2. **Standard Supervaluationism (Fine)**:
     - Fails (b): No hysteresis; precisifications are static. 
     - Fails (h): "Determinately" has sharp boundaries (loses higher-order vagueness). 
     - Handles (a), (c)-(g) smoothly.
  3. **Contextualism (e.g., Raffman)**: 
     - Handles (b) via shifting standards in sorites sequences. 
     - Might struggle with (e) (why legally fixed?) and (h) (often downplays higher-order vagueness). 
     - Rejects (f): Typically abandons LEM for borderline cases.
  4. **Degree-based (Fuzzy Logic)**:
     - Fails (f): Rejects LEM (Jack bald to degree 0.5, so "Jack is bald or not" not fully true). 
     - Fails (g): If Jack at 0.4, Jill at 0.45, "if Jack bald then Jill bald" may not be fully true. 
     - Handles (a)-(d), (h) naturally.

  **Repairs needed for user's principle**:
  - **Route**: Formalize as context-shifting (e.g., precisifications admissible only relative to a "standard" set by prior judgments in the sequence). Avoids muddle if "property tracked" is itself context-relativized.
  - **Purpose**: Constrain its sharpening role—e.g., purpose selects *relevant dimensions* (balding pattern? age distribution?) but not exact cutoffs, preserving marginal indeterminacy. In law, *institutional need* for a binary outcome forces a choice, but the predicate remains vague (cf. "forced march" sorites).
  - **Higher-order vagueness**: Adopt a nested supervaluationist model (e.g., Shapiro 2006) where "admissible" has its own precisifications. Their "never closes" intuition fits this.

  **Bottom line**: The principle survives (a)-(i) with minor repairs: formalize route as a context parameter, limit purpose to constraint-setting (not pinning exact boundaries), and explicitly model admissibility as iteratively vague. The biggest cost is theoretical novelty (path-dependent admissibility), but it coheres with their core intuitions. Drop nothing—but accept that (b) requires an unorthodox move, and (e) needs careful distinction between semantic vagueness and pragmatic decision-forcing.
answer: |-
  Your principle can survive (a)-(i) with two repairs: formalise "route" as a contextually determined comparison class or history-sensitive standard, and constrain "purpose" to exclude arbitrary sharpening—it fixes relevant dimensions, not exact cutoffs. Here’s how it handles your cases, its weaknesses, predictions for new cases, and alternatives.

  ### How your principle (repaired) handles (a)-(i):
  - **(a)**: No sharp boundary—supported, as multiple precisifications remain admissible throughout the hair-loss sequence.
  - **(b)**: Hysteresis (asymmetry in transition points)—explained by "route": adding hairs contextually resets the comparison class (e.g., to hairier exemplars), making "bald" harder to lose than to gain. Coherent if "route" shapes which precisifications count as admissible *for this context*—no muddle, as it reflects how context fixes the property’s extension.
  - **(c)-(d)**: Indeterminacy without ignorance—handled, as admissible precisifications conflict even given complete physical facts.
  - **(e)**: Legal determinacy—"purpose" narrows admissible precisifications to those aligning with the subsidy’s aim (e.g., social perception for a wig grant), potentially singling out one precisification *for this decision*. Avoids over-sharpening: statutes don’t eliminate vagueness because purposes can be underspecified (e.g., "reasonable care" leaves safety-cost tradeoffs open), and precisifications remain multiple for other contexts.
  - **(f)**: Retains LEM and indeterminacy—"Jack is bald or not" true on all precisifications (supervaluationist LEM), but "not determinate whether Jack is bald" true as no precisification is uniquely selected.
  - **(g)**: Monotonicity—if Jack is bald on a precisification, so is Jill (with more hair), so the conditional holds determinately. Supervaluationism’s strength preserved.
  - **(h)**: Higher-order vagueness—"ranges never close" blocks sharp boundaries for "determinately": admissibility itself has borderline cases (e.g., precisifications marginally compatible with dispositions), so second-order indeterminacy arises.
  - **(i)**: Vagueness transfer—"noticeably" inherits open precisification ranges from its constituent vague terms; no reduction to precise base.

  ### Weaknesses and repairs:
  - **Repair 1: Route as contextual parameter**. Your "route" idea risks conflating metaphysics with psychology if not anchored. Fix: treat "route" as setting contextual parameters (e.g., default standards or salient exemplars). In (b), hair-addition context makes past baldness salient, shifting what counts as "admissible" for current application. This avoids muddle by making admissibility context-relative.
  - **Repair 2: Purpose as constraint, not sharpener**. To prevent purpose from trivially sharpening all legal predicates (e.g., making "dependant child" precise in every statute), constrain it to selecting *relevant dimensions* (e.g., for "bald", pattern matters more than count in a grant context) without fixing exact thresholds. In (e), subsidy purpose may *demand* a binary decision, but this forces a choice, not semantic precision.

  ### Predictions for new cases:
  - **Contested purpose (e.g., "dependant child" with drafters disagreeing on why dependence matters)**: Admissible precisifications fragment along rival purposes (e.g., economic vs. emotional dependence). Result: *more* indeterminacy, not less, as no single precisification aligns with all intents. Verdict: borderline cases proliferate; no determinate right answer even for a committee.
  - **Dead users with exhaustive corpus**: Dispositions are fully known, but purpose (for applying the predicate now) and context may misalign with historical use. Admissible precisifications include those fitting the corpus *and* current needs. Verdict: vagueness persists if current purpose underdetermines choice (e.g., applying "bald" to a new hairstyle); only if purpose/corpus jointly pinpoint one precisification (rare) does determinacy arise.

  ### Alternatives and their failures against your verdicts:
  - **Epistemicism (Williamson)**: Claims sharp boundaries + ignorance.  
    - Fails (a), (c), (d): Denies no-fact-of-the-matter; insists ignorance exists even given all facts.  
    - Fails (h): Rejects higher-order vagueness (sharp cutoffs for "knowable").  
    - Handles (e), (f), (g) well.  
  - **Standard Supervaluationism (Fine)**: Fixed set of precisifications; "determinately" sharp.  
    - Fails (b): No hysteresis—precisifications static, so transitions symmetric.  
    - Fails (h): "Determinately" has sharp boundaries (no higher-order vagueness).  
    - Handles (a), (c)-(g) perfectly.  
  - **Contextualism (e.g., Raffman)**: Standards shift dynamically in sorites.  
    - Fails (f): Often rejects LEM for borderline cases.  
    - Fails (e): Struggles to explain legal determinacy (why no shift in committee?).  
    - Handles (a), (b), (g) well.  
  - **Fuzzy Logic**: Degrees of truth (0 to 1).  
    - Fails (f): Rejects LEM (disjunction not true when both sides indeterminate).  
    - Fails (g): "If Jack bald then Jill bald" can have low truth-value if both borderline.  
    - Handles (a)-(d), (h) naturally.  

  ### Verdicts to abandon for coherence:
  Keep all—your principle accommodates them with repairs. **If forced to drop one, sacrifice (b)'s hysteresis intuition**: it’s the least central and most costly, requiring path-dependence in admissibility. But with "route" formalised contextually, it holds. The real cost is theoretical: your account is a hybrid (supervaluationism + contextualism) and must defend why "route" affects truth-conditions, not just pragmatics. Stick with it—it respects your core intuitions where pure theories fail.
