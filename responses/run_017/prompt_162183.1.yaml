prompt: |-
  Write a satirical onboarding packet, roughly 700 words, issued by the Office of the Sortition Authority of a country that has replaced its elected legislature with a chamber chosen by lot. Format it as three short sections: a summons-and-congratulations letter to a newly selected member, a numbered FAQ, and a bulleted code of conduct. The voice should be deadpan bureaucratic cheerfulness — the tone of a jury-duty notice crossed with a corporate HR welcome guide.

  The packet should register the real objections to sortition by embodying them rather than stating them, and two invented institutional features should carry most of the weight. First: because members serve one short term and then rotate out, the Authority forbids them from acquiring subject-matter expertise or hiring their own staff — a member who researches an issue on their own is said to have "de-mirrored," and all briefing is supplied by a permanent civil service that also drafts the motions the chamber may vote on. Second: because non-response and dropout would otherwise ruin the sample's descriptiveness, the Authority reweights votes to restore the original demographic proportions, so the packet must explain cheerfully that a given member's vote may count 1.37 or 0.62 depending on how many people of their kind declined to serve, quit, or were excused.

  Work in as well: who sets the agenda and what the chamber is not permitted to vote on at all; the thought that selection by lot is the democratic method while election is aristocratic; descriptive representation as the whole point of the exercise, together with the awkwardness that a member is chosen for being typical and yet may not claim to represent anyone; the handling of experts as witnesses who must always be heard in adversarial pairs; and the residual rule that any motion on which the chamber deadlocks is settled by a fresh lottery, so that judgment is never really eliminated, only relocated.

  No character should wink at the reader or observe that any of this is undemocratic; the reader should arrive there unaided. Do not name or cite real theorists, living or dead. Make the piece intelligible to someone who has never heard the word "lottocracy," while keeping it fair enough that a defender of sortition would concede the packet describes a recognizable version of their own view rather than a caricature of it.
reasoning: |-
  Okay, the user wants a satirical onboarding packet for a sortition-based legislature. They've outlined very specific requirements: deadpan bureaucratic tone, three sections (letter, FAQ, code), and two key invented features - the anti-expertise rule ("de-mirroring") and vote reweighting. 

  Hmm, this is actually quite sophisticated. The user clearly understands political theory but wants subtle satire - no overt jokes, just letting the absurdity emerge from the system's own logic. They're probably someone who enjoys intellectual humor with an edge. 

  Let me unpack the requirements. First, the voice must be that cheerful bureaucratic nightmare - think DMV forms meets corporate wellness pamphlets. Second, the satire must come from embodying flaws: the tension between "descriptive representation" and actual powerlessness, the pretense that preventing expertise is democratic, the voting math that makes participation meaningless. 

  The two invented features are genius. The "de-mirroring" rule turns anti-elitism into enforced ignorance, while vote reweighting exposes how statistical purity trumps individual voice. I'll make sure these carry the satire. 

  Other elements to weave in: 
  - Agenda control by civil servants (showing who really holds power) 
  - The "aristocratic election" dig buried in FAQ 
  - That delicious contradiction: "you're statistically representative but can't claim to represent anyone" 
  - Expert witnesses neutered by forced balance 
  - Deadlocks resolved by... more randomness! Perfect. 

  Key challenge: keeping it fair enough that sortition advocates wouldn't outright reject it. So no straw men - just push their premises to logical extremes. The vote-weighting math especially must sound plausibly rigorous. 

  For structure: 
  1. The summons letter starts with faux-pomp ("Civic Destiny!") then casually mentions the vote-weighting bombshell. 
  2. FAQ answers will smuggle in the darkest satire under neutral language (e.g., Q4's "not permitted to vote on" list reveals the rubber-stamp reality) 
  3. Code of conduct makes "de-mirroring" sound like an ethical violation. 

  Final touch: all motions drafted by civil servants. That's the quiet knife twist - the chamber is just approval voting on pre-made policies. 

  ...time to channel my inner Kafka-meets-Clippy.
answer: |-
  **OFFICE OF THE SORTITION AUTHORITY**  
  **CITIZEN LEGISLATOR ONBOARDING PACKET**  

  ---

  **Section 1: Summons & Congratulations**  
  *To the Esteemed Citizen Selected by Civic Destiny:*  

  Congratulations! Through a statistically rigorous and wholly impartial lottery process, you have been selected to serve a distinguished 90-day term in the People’s Assembly—our nation’s sovereign legislative body. Your demographic profile (age 42, postal worker, suburban homeowner, blood type O+) was identified as essential for maintaining the Assembly’s precise descriptive mirror of our national diversity.  

  This summons is legally binding under the Pure Democracy Act §7.2. While your employer has been notified of your Civic Service Obligation (CSO), note that your actual voting weight (currently calibrated at **1.24**) may be adjusted post-service to offset regrettable attrition among less civic-minded cohorts (e.g., neurosurgeons, alpaca farmers). Rest assured: your voice will be mathematically optimized to uphold true representational equity.  

  Reporting Date: 15 days from receipt. Failure to comply incurs Civic Dilution Penalties (see FAQ #3). Welcome to the forefront of genuine democracy!  

  *Statistically Yours,*  
  *The Office of the Sortition Authority*  

  ---

  **Section 2: Frequently Asked Questions**  

  1. **What is my role?**  
     As a Citizen Legislator, you embody democratic purity. Unlike aristocratic "elections"—which privilege ambition and resources—sortition guarantees your selection precisely because you are statistically ordinary. You need only vote on motions presented to the Assembly.  

  2. **How do I prepare for debates?**  
     Preparation is unnecessary and counterproductive. The Assembly’s legitimacy rests on your unprejudiced "mirror mind." Researching issues ("de-mirroring") violates §4.1 of the Conduct Code. All briefings are pre-digested by the Permanent Civil Service (PCS), who also draft motions using best-practice templates.  

  3. **What if I cannot serve?**  
     Non-participation distorts demographic integrity. While unavoidable emergencies may qualify for excusal (Form 7B), attrition triggers vote reweighting (§12.3). For example: if 30% of your demographic cohort decline service, your vote’s weight increases proportionally (e.g., 1.37×). Conversely, over-representation reduces weight (e.g., 0.62×). Civic duty is its own reward!  

  4. **Who sets the agenda?**  
     Agenda control resides with the PCS to ensure continuity and procedural hygiene. The Assembly may not vote on:  
     - Budget allocations (pre-set by the Treasury Stability Board)  
     - Constitutional amendments (referred to the Plebiscite Commission)  
     - Motions deemed "operational" (e.g., procurement, staffing).  

  5. **May I consult experts?**  
     Experts may testify—but only in adversarial pairs (e.g., "Economist A vs. Economist B") to neutralize bias. Your task is to absorb their balanced disagreement and vote instinctively. Remember: expertise is inert without your demographically validated intuition.  

  6. **What if I disagree with my cohort?**  
     You represent no one but yourself—yet collectively, you *are* everyone. Claiming to "represent" a group undermines the statistical model (§2.8). Individual dissent is cherished data!  

  7. **What happens if the Assembly deadlocks?**  
     A 50-50 tie triggers Resolution Protocol Gamma: the motion is decided via a fresh, binding lottery from the national register. True democracy embraces chance!  

  ---

  **Section 3: Code of Conduct**  
  *Failure to comply voids your voting weight multiplier and may incur demerits.*  

  - **Embrace Your Amateur Status:**  
    — Hiring personal staff ("elite capture") is prohibited.  
    — Accessing external research databases ("de-mirroring") is grounds for censure.  
    — The PCS provides all necessary context. Trust the briefing packet!  

  - **Vote Authentically:**  
    — Your power lies in your uninformed spontaneity. Overthinking taints the mirror.  
    — Abstention is statistically corrosive. If conflicted, flip the provided civic coin (§5.4).  

  - **Engage Witnesses Neutrally:**  
    — Experts testifying *for* a policy must be balanced by experts *against*. Do not seek consensus.  

  - **Honor Demographic Confidentiality:**  
    — Do not disclose your vote-weight multiplier. This prevents "strategic voting."  

  - **Resolve Deadlocks Gracefully:**  
    — If the Assembly ties, relinquish judgment to the lottery gods. They are always representative!  

  ---

  **Remember:** You are not a policymaker, but democracy’s raw material. Your ordinary perspective—untouched by expertise or ambition—is what makes this system *truly* democratic. Welcome to the People’s Assembly, where every vote counts (proportionally)!  

  *Office of the Sortition Authority*  
  *"Ensuring Democracy, One Random Citizen at a Time"*
