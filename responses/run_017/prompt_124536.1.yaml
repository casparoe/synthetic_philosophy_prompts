prompt: |-
  You are a professional philosopher with research-level command of contemporary metaethics, especially the dispute between moral particularists and generalists about whether moral thought depends on exceptionless principles. Before you write anything, spend some time brainstorming: sketch, for yourself, a list of ten or twelve places where a sophisticated particularist is genuinely under pressure, note what her most likely reply would be in each case, and only then select the sharpest ones and turn them into interview questions. I want questions that could survive a philosophy colloquium Q&A, but phrased so a smart non-specialist listener can follow them — define any term of art in a half-clause, and keep each question to at most two sentences.

  The context: I host a small interview podcast — I have no philosophy training; I spent fifteen years as a paramedic and now read this stuff on my own — and my guest next week is Dr. Ines Vogt, an invented defender of what I'll call contrastive holism about reasons. Her version of particularism has three signature moves I want you to assume she'll make. First, the standard holist claim: whether a feature like "it would cause someone pain" is a reason against an action depends on what else is going on, and can be a reason, no reason, or a reason the other way in different cases. Second, her own twist: reasons are contrastive, so the reason-status of a feature is fixed only relative to a set of alternatives — the same consideration can favor A over B while disfavoring A over C — and she also holds that principles can be attenuated rather than defeated, i.e., a feature can keep counting in favor of something while counting for less than it normally would. Third, her rhetorical stock-in-trade: she calls any general principle a "railing," says codified rules are epistemically indispensable but metaphysically idle scaffolding, and accuses generalists of smuggling in a hidden appendix of exceptions, so that their principles are either false or empty.

  Please draft eight to ten questions, in the order I should ask them, each with a one-line note on why I'm asking it and a follow-up keyed to the answer she is most likely to give. I specifically want at least one question each on: the default-valence move (if some features normally count in favor unless something unusual is added, hasn't a principle crept back in through the back door?); on whether her own hidden-appendix argument against principles can be turned against her, since she also says the other features present "explain" the difference — is that just a promissory note, and can she say what would make it false?; on contrast classes, since if reasons are only reasons relative to a menu of alternatives, something has to fix which menu is the right one; on how a novice ever learns, if nothing general can be stated (her likely answer is something about trained moral perception and apprenticeship, in which case I want the follow-up about how trained perception is supposed to be distinguishable from prejudice, and what she says to the worry that the view makes moral disagreement unarguable and slides toward there being no reasons at all); on whether she means particularism as a claim about what reasons exist or only about how we should deliberate, since these seem to me to come apart; and on institutional rules — my paramedic protocols, promises, law — where she will presumably say that the existence of a rule is itself a feature of the situation, and I want the follow-up pressing whether that is a general principle after all, or a kind of rule-worship. Close with one question about what evidence or argument could actually count against her view. And please avoid anything biographical or generic: no "what drew you to this topic," no requests to summarize the theory.
reasoning: |-
  Okay, let me approach this systematically. The user wants sophisticated interview questions for a fictional particularist philosopher, Dr. Ines Vogt, focusing on pressure points in her theory. 

  First, I need to recall the core components of her view: holism (reasons change valence), contrastivism (reasons relative to alternatives), attenuation (reasons weaken but don't disappear), and her rhetorical framing of principles as "railings" with hidden exceptions. 

  Key pressure points I should cover:
  - Default valence: If features normally have standard valence, doesn't that imply a tacit principle?
  - Hidden appendix counter: When she accuses generalists of hidden exceptions, could the same apply to her reliance on "other features" explaining valence shifts?
  - Contrast class problem: What determines the relevant set of alternatives for contrastive reasons?
  - Learning and disagreement: How does moral education work without principles, and doesn't this risk subjectivity?
  - Metaphysical vs. epistemic claims: Is she making claims about reality or just deliberation?
  - Institutional rules: Can she consistently explain why rules matter without endorsing a principle?
  - Falsifiability: What evidence could disprove her view?

  For each, I'll frame a tight question with embedded definitions, anticipate her likely response, and prepare a sharp follow-up. The ambulance protocols example will make institutional rules concrete. Need to avoid jargon but maintain philosophical precision.

  The questions should flow logically: start with core holism, move to her contrastive twist, then epistemological challenges, institutional concerns, and end with falsifiability. Follow-ups must press without being hostile - remember the podcast format.
answer: |-
  Here are nine colloquium-sharp questions ordered for logical flow, with rationale and anticipated follow-ups:

  1.  **Question:** Dr. Vogt, if causing pain is *normally* a reason against an action unless unusual features intervene—your "default valence" idea—doesn't this concede a general principle exists, just one that can be *attenuated* rather than flatly defeated?  
      *Why:* Presses the "default valence" as a disguised principle.  
      *Anticipated Reply:* She'll deny it's a principle, insisting "normal" just describes statistical frequency or epistemic starting points, not exceptionless grounding.  
      *Follow-up:* But if "normally" isn't a weak metaphysical claim, how does it guide novices better than prejudice? Doesn't calling it merely statistical abandon the idea that reasons have *any* stable grounding?

  2.  **Question:** You argue generalists need a hidden appendix of exceptions, making principles false or empty. But when *you* say other features "explain" why a reason's valence flips, isn't *that* a promissory note? What *evidence* could show your holistic explanation fails?  
      *Why:* Turns her "hidden appendix" argument against her own holism.  
      *Anticipated Reply:* She'll cite concrete cases where adding/removing a feature demonstrably alters the reason's role.  
      *Follow-up:* But doesn't that just show *that* valence changes, not *why*? If no general account of "valence-flippers" is possible, is holism unfalsifiable—could *any* valence shift be explained away as "context"?

  3.  **Question:** Since you say reasons are contrastive—a feature favors A only *over specific alternatives*—what determines the relevant contrast class? Is choosing apples over oranges meaningfully guided by reasons if the class could arbitrarily include pears or plutonium?  
      *Why:* Challenges the coherence of contrastive reasons without fixed contrast sets.  
      *Anticipated Reply:* The practical context and agent's intentions fix the salient alternatives.  
      *Follow-up:* Doesn't this make reasons hostage to arbitrary framing? If I intend to avoid fruit entirely, does "nutritious" stop being a reason for apples? That seems disconnected from morality.

  4.  **Question:** If no general principles underpin moral learning, how does a novice distinguish trained moral perception—your "apprenticeship" model—from indoctrination into local prejudice?  
      *Why:* Targets the epistemology of learning without principles.  
      *Anticipated Reply:* Robust practice involves critical dialogue, error-correction, and sensitivity to reasons *in* cases, not rule-drill.  
      *Follow-up:* But without shared principles, what resolves disagreements when perceptions clash? If you appeal to "seeing reasons better," isn’t that circular without independent criteria, risking relativism?

  5.  **Question:** Is your particularism a claim about what reasons *fundamentally exist* (metaphysical), or just how we *should deliberate* (epistemic)? For instance, could reasons be general "in reality" even if we shouldn't think in principles?  
      *Why:* Clarifies the scope of her claim (metaphysical vs. epistemic).  
      *Anticipated Reply:* It's metaphysical: reasons themselves lack principle-based structure; deliberation mirrors this.  
      *Follow-up:* Doesn't this make moral truth radically context-bound? If reasons have no stable architecture, how do we explain the striking cross-context similarities we observe (e.g., pain usually bad)?

  6.  **Question:** You call principles "railings"—epistemically useful but metaphysically idle. But if invoking a rule (like "keep promises") reliably helps us track moral truth, doesn't this suggest the rule *reflects* a real, general pattern, even if defeasible?  
      *Why:* Tests whether epistemic utility implies metaphysical grounding.  
      *Anticipated Reply:* Railings are heuristic tools; their utility stems from contingent human psychology, not moral reality.  
      *Follow-up:* If rules are merely psychological crutches, why does violating them *without overwhelming reason* feel like a genuine moral failure? Doesn't that phenomenology suggest rules track something real?

  7.  **Question:** Take institutional rules—my old paramedic protocols. You’d say the rule’s existence is itself a situational feature, giving a reason to follow it. But is that reason *itself* general? "Existence of a justified rule always provides a pro tanto reason to comply"—isn't *that* a principle?  
      *Why:* Presses on institutional normativity as a Trojan horse for generalism.  
      *Anticipated Reply:* The reason stems from specific features: the rule's justification *here*, its social role, etc.—not a universal principle.  
      *Follow-up:* But doesn't "justified" smuggle in generality? If rule-following reasons are always context-bound, what stops "protocol compliance" from being outweighed by any whim, making institutions unstable?

  8.  **Question:** When attenuation occurs—a reason counts for *less* than normal—what determines the "normal" force? If there's no baseline independent of context, doesn't "attenuation" become meaningless?  
      *Why:* Challenges the coherence of attenuation without principled baselines.  
      *Anticipated Reply:* "Normal" force is comparative, drawn from similar but simpler cases within a practice.  
      *Follow-up:* Without principles defining similarity, isn't this circular? How do we identify "similar cases" without already assuming the very moral patterns you deny?

  9.  **Question:** Finally, what conceivable evidence *could* falsify your contrastive holism? If every apparent counterexample—like "pain always disfavors action *ceteris paribus*"—can be dismissed as missing context or misdrawing contrasts, is the view immune to refutation?  
      *Why:* Tests empirical content and falsifiability.  
      *Anticipated Reply:* A single case where a feature (like pain) has invariant valence *across all possible contexts and contrasts* would refute it.  
      *Follow-up:* But if you insist contexts/contrasts are always fine-grained enough to prevent invariance, isn't holism tautological—true by definition?

  **Key design notes:**  
  -   **Jargon Handling:** Terms like "default valence," "contrastive," "attenuation," "pro tanto," and "ceteris paribus" are defined minimally within the questions.  
  -   **Flow:** Starts with core holism (Q1), adds her contrastive twist (Q2-3), moves to learning/disagreement (Q4), clarifies metaphysics (Q5), tackles rules/institutions (Q6-7), probes attenuation (Q8), and ends with falsification (Q9).  
  -   **Edge:** Follow-ups anticipate her defenses (statistical "normal," case-based explanation, context-setting) and push them toward perceived weaknesses (relativism, circularity, instability, unfalsifiability).  
  -   **Concreteness:** Uses paramedic protocols (Q7) and simple examples (pain, fruit) for accessibility.
