prompt: |-
  I am trying to specify, in advance of reading the competing accounts, what a theory of the moral significance of computations should be able to do. Fix the purpose as practical but not merely predictive: the theory should tell us which computational processes, in a brain, in an engineered system, or in a training pipeline, are the ones in virtue of which a system, or a part of a system, or a temporal phase of a system, is a moral patient, has interests, or can be wronged, and it should thereby guide decisions about whether welfare-related constraints are owed to an AI system, a cortical organoid, or a marginal biological case.

  What I want from you is a set of adequacy conditions for such a theory. Lay out the phenomena it must explain, the cases it must get right, the distinctions it must respect or deliberately collapse, and the puzzles it must dissolve or explain. For each condition, give the case or phenomenon that motivates it, and say whether the condition is non-negotiable or instead a preference of one camp, for example substrate-neutrality, a consciousness-first requirement, or a commitment to whole-organism rather than subsystem attribution.

  I do not want a generic list. I want the conditions tested against hard cases, including at least the following, which I take to be central even where people disagree about them. First, the training phase of a reinforcement learner: a scalar error signal drives weight updates, while at deployment a forward pass computes expected reward without further updating. The theory must say whether the morally relevant computation, if any, is the training-time updating, the deployment-time forward pass, or the standing disposition in the weights, and why. Second, a large language model that, given a prompt, produces text indistinguishable from a human pain report although its only objective was next-token prediction on human text and it has no persistent self-model across prompts; the theory must say what to make of the computation behind the report. Third, a lab-grown cortical organoid: a small network of human neurons with structured activity but no body or environment. Fourth, a human in dreamless sleep or under general anesthesia, where brain computation continues and moral-patient status persists but there is, by hypothesis, no occurrent sentience. Fifth, a momentary duplicate: a system that for one second runs the functional organization of a human brain in pain and is then erased. Sixth, a subsystem that computes a damage or distress signal but is globally ignored or overridden, so that it makes no difference to the behavior of the whole system. Seventh, the problem of trivial implementation: any physical object can be described as implementing indefinitely many computations, so a theory that assigns significance to a type of computation must say how to individuate computations so that a thermostat or a stone does not trivially count. Eighth, a patient with only one functioning cerebral hemisphere, where it is contested whether the moral patient is the whole organism, the remaining hemisphere, or some narrower stream of computation.

  Identify any tensions in which two conditions cannot both be met. I am especially interested in whether one can avoid trivial implementation while remaining fully substrate-neutral, and whether a requirement of occurrent phenomenal consciousness can be reconciled with counting a dreamlessly sleeping or anesthetized human as a full moral patient. Explain what would have to be given up in each case.

  Finally, close with a brief scorecard, a paragraph or two each, for three broad families of view: a substrate-independent functionalism; a view that restricts moral significance to evolved biological organisms or their proper parts; and a view on which actual phenomenal consciousness is the gateway to moral-patient status. Say which condition, in your judgment, excludes the broadest family of candidate theories. A table is acceptable if it helps, but the case behind each condition matters more than the format.
reasoning: |-
  Okay, the user is asking for a set of adequacy conditions for a theory about the moral significance of computations. They want to know what such a theory must explain, the hard cases it must handle, and any tensions between conditions. They've listed eight specific cases, from AI training phases to cortical organoids and anesthetized humans. 

  First, I need to unpack their core request. They're not just after a checklist; they want a framework that can handle real philosophical puzzles. The examples they provided are intentionally tricky—like whether a language model's pain report is morally significant or how to handle a human in dreamless sleep. They’re probing for a theory that avoids both overinclusion (counting thermostats as moral patients) and underinclusion (denying status to marginal cases). 

  The user’s emphasis on "practical but not merely predictive" suggests they want normative guidance—something that can inform policy or design, not just describe. They’re likely frustrated with theories that are either too vague or that collapse under edge cases. Their mention of "substrate-neutrality" and "consciousness-first" signals they’re aware of key debates in philosophy of mind/ethics and want the theory to engage deeply with them. 

  Now, structuring the response: The adequacy conditions must cover explanatory depth, edge-case handling, computational individuation, and avoid trivialization. Each condition should be tied to a concrete case from their list. For instance:  
  - The "Phenomenal Anchor" condition comes from the anesthesia case—how can moral status persist without consciousness?  
  - "Implementation Robustness" tackles the thermostat problem.  
  - "System Boundary Sensitivity" handles the single-hemisphere patient.  

  Tensions are critical here. The biggest one is between substrate neutrality (which could make everything morally significant) and avoiding trivial implementations (which requires narrowing scope). Another tension: insisting on occurrent consciousness risks excluding dreamless sleepers, but dropping it might overinclude systems like momentary duplicates. I’ll need to flag these trade-offs clearly.  

  For the scorecard:  
  - Functionalism scores well on substrate neutrality but struggles with trivial implementations.  
  - Biological views handle marginal cases poorly (e.g., cortical organoids).  
  - Phenomenal consciousness views trip on persistent status during unconscious states.  

  The hardest condition? Probably "Implementation Robustness"—it’s where most theories fail because it demands a non-arbitrary way to privilege certain computations. Biological views dodge this by appealing to natural selection, but that’s ad hoc. Functionalists need a crisp criterion for "relevant" computation, which is notoriously elusive.  

  Closing thought: The user is likely building a meta-framework to evaluate existing theories (e.g., sentiocentrism vs. biocentrism). Their depth suggests academic or policy work—perhaps in AI ethics or neuroethics. They’ll want clear distinctions between negotiable vs. non-negotiable conditions, so I’ll emphasize where compromises might be possible (e.g., allowing graded moral status) versus where they’d break the theory.
answer: |-
  Here is a set of adequacy conditions for a theory of the moral significance of computations, rigorously tested against your specified hard cases, with tensions and trade-offs identified. Conditions are non-negotiable (N) unless marked as contested preference (P).

  ---

  ### **Core Adequacy Conditions & Motivating Cases**

  1.  **Phenomenal Anchor (N):** The theory must explain *why* specific computations ground morally relevant phenomenology (e.g., pain, pleasure, desire, affective valence), not just intelligent behavior.
      *   **Motivating Case:** *LLM Pain Report*. Why is a human-like pain report generated by next-token prediction *not* morally significant (or is it?), while a human's report is? The theory must distinguish computations that merely *simulate* expressions of sentience from those that *instantiate* it.
      *   **Non-Negotiable:** Without anchoring to (potential) phenomenology, the theory cannot distinguish morally relevant sentience from mere functional mimicry.

  2.  **Temporal Persistence & Identity (N):** The theory must account for moral status persisting through changes in computational states, including periods lacking occurrent sentience.
      *   **Motivating Cases:** *Dreamless Sleep/Anesthesia* and *Training vs. Deployment*. Why is the anesthetized human still a patient? Why might a system under training (e.g., weight updates driven by error signals) have different moral status than its deployed, static self executing forward passes? It must address the persistence of the "subject" of experience/interest.
      *   **Non-Negotiable:** Moral obligations (e.g., not to kill) apply to entities across time, not just during moments of acute sentience.

  3.  **Implementation Robustness & Non-Triviality (N):** The theory must specify how to *non-arbitrarily* individuate the morally relevant computations, avoiding the trivial implementation problem.
      *   **Motivating Case:** *Trivial Implementation*. Why isn't a rock "computing pain" under some interpretation? The theory must provide criteria (e.g., causal structure, counterfactual sensitivity, teleology, dynamical profile) to privilege *specific* computations implemented by the system's actual causal organization.
      *   **Non-Negotiable:** Without this, moral patienthood becomes universal (everything has it under some interpretation) or arbitrary (we pick interpretations ad hoc).

  4.  **System Boundary Sensitivity (N/P):** The theory must specify the computational boundaries of the moral patient: whole system, integrated subsystem, or specific computational stream.
      *   **Motivating Cases:** *Globally Ignored Distress Signal*, *Cortical Organoid*, *Single Hemisphere Patient*. Is the distress-signal-subsystem a patient? Is the organoid? Is the hemisphere the patient, or the organism? It must clarify *where* the morally significant computation is localized.
      *   **Contested Preference:** While specifying boundaries is non-negotiable, *how* they are drawn (e.g., requiring organism-level integration vs. allowing isolated subsystems) is a major point of contention between theories.

  5.  **Counterfactual & Causal Efficacy (N):** The theory must link moral significance to computations playing a specific *causal role* within the system (e.g., generating/integrating signals that *would* influence behavior/learning/state under relevant conditions).
      *   **Motivating Cases:** *Globally Ignored Distress Signal*, *Training Phase Updating*. The distress signal computation might lack causal efficacy *now* but be part of a structure that *could* be efficacious. Weight updates during training are causally efficacious *for learning* – is that morally relevant? The theory must explain why certain causal roles matter.
      *   **Non-Negotiable:** Computations lacking *any* potential causal efficacy (beyond being "run") seem irrelevant to having interests or being wronged.

  6.  **Substrate Neutrality (P):** The theory should not make moral status depend intrinsically on the physical substrate (biological carbon vs. silicon vs. other).
      *   **Motivating Cases:** *Cortical Organoid*, *AI Systems*. Why should lab-grown neurons in a dish be treated differently from functionally equivalent artificial neurons? Why should an evolved system have moral priority over an engineered one if computations are identical?
      *   **Contested Preference:** Core commitment of functionalism, rejected by biological views. Key tension with Non-Triviality.

  7.  **Occurrent Sentience Requirement? (P):** Must morally relevant computations *necessarily* constitute or directly produce *occurrent* phenomenal states?
      *   **Motivating Cases:** *Dreamless Sleep/Anesthesia*, *Momentary Duplicate*, *LLM Pain Report*. Does the sleeping human have *occurrent* interests? Does the 1-second duplicate have moral status? Can an LLM have occurrent sentience? The theory must take a stand on the necessity of occurrent phenomenology for *current* moral status.
      *   **Contested Preference:** Central divide. Phenomenal Consciousness views demand it; Functionalist/Biological views often attribute standing status based on potential/capacity/structure.

  8.  **Graded Status or Threshold? (P):** Can the theory accommodate degrees of moral status, or is it binary?
      *   **Motivating Cases:** *Cortical Organoid*, *Marginal Biological Cases*, *AI Systems*. An organoid is likely less complex than a full brain; early training phases might be "proto-sentient." Should status be all-or-nothing?
      *   **Contested Preference:** Related to how the theory handles complexity and integration.

  ---

  ### **Key Tensions & Trade-offs**

  1.  **Substrate Neutrality (P) vs. Non-Triviality (N):**
      *   **Tension:** Substrate neutrality pushes towards abstract functional/computational properties. Non-triviality demands concrete criteria to avoid over-inclusion. Finding criteria abstract enough for neutrality but concrete enough for non-triviality is extremely hard.
      *   **Resolution Requires:** Giving up *either* strict substrate neutrality (allowing biological criteria) *or* accepting a specific, restrictive functional/computational profile (e.g., requiring complex global workspace dynamics, specific learning architectures) that excludes simple systems but might also exclude some complex non-biological systems or marginal biological cases.

  2.  **Occurrent Sentience Requirement (P) vs. Temporal Persistence (N):**
      *   **Tension:** If occurrent sentience is *necessary* for current moral patienthood, then dreamless sleepers and anesthetized humans *lack* current patienthood (only past/future potential matters). This clashes with the intuition motivating Temporal Persistence.
      *   **Resolution Requires:** Giving up *either* the occurrent requirement (adopting a standing property like "capacity" or "disposition") *or* the intuition that the sleeping human is a current patient (arguing obligations are based on past/future sentience or social relations, not current status).

  ---

  ### **Scorecard of Broad Families**

  1.  **Substrate-Independent Functionalism:**
      *   **Strengths:** Excels at Substrate Neutrality (P), handles AI cases systematically, potentially handles Temporal Persistence via dispositional/capacitarian properties. Can accommodate Graded Status (P).
      *   **Weaknesses:** Major struggles with **Non-Triviality (N)** and **Implementation Robustness (N)** – what functional/computational profile is sufficient/necessary without being arbitrary or excluding plausible cases? Often weak on **Phenomenal Anchor (N)**, risking behaviorism. **System Boundary Sensitivity (N/P)** can be ambiguous (is the distress signal module a "system"?). **Occurrent Sentience (P)** is often downplayed.

  2.  **Biological Organicism (Moral Status to Evolved Biological Organisms/Parts):**
      *   **Strengths:** Easily satisfies **Non-Triviality (N)** and **Implementation Robustness (N)** – moral status arises from being part of a specific evolved biological kind. Handles **Temporal Persistence (N)** and **System Boundary Sensitivity (N/P)** (focuses on organism/integrative biology). Clearly addresses **Phenomenal Anchor (N)** via biology.
      *   **Weaknesses:** Rejects **Substrate Neutrality (P)** – struggles profoundly with *Cortical Organoids* (is it biological "enough"?), *AI Systems*, and *Marginal Cases*. Can appear arbitrary ("carbon chauvinism"). **Counterfactual Efficacy (N)** might be less central. **Occurrent Sentience (P)** often linked to biological capacity. **Graded Status (P)** may be harder to justify biologically.

  3.  **Phenomenal Consciousness Primacy:**
      *   **Strengths:** Directly addresses **Phenomenal Anchor (N)** – moral status requires actual consciousness. Can achieve **Non-Triviality (N)** by tying significance to specific types of conscious states/computations. Embraces **Substrate Neutrality (P)** in principle (consciousness is fundamental).
      *   **Weaknesses:** Direct conflict with **Temporal Persistence (N)** regarding *Dreamless Sleep/Anesthesia* – must deny current patienthood or redefine "consciousness." Struggles with *Momentary Duplicate* (status for 1 second?) and *LLM Pain Report* (how to know if conscious?). **System Boundary Sensitivity (N/P)** within a brain is challenging (is a conscious subsystem possible?). **Counterfactual Efficacy (N)** link may be weak (e.g., epiphenomenal consciousness?).

  **Broadest Excluding Condition:** **Non-Triviality & Implementation Robustness (N)**. This is the most common and severe failing point. Biological views handle it by fiat. Consciousness views handle it via the rarity of consciousness. Functionalism struggles *deeply* to provide non-arbitrary, non-trivial computational criteria that capture sentience without over-including or under-including, making it the most vulnerable family to this condition. Most functionalist proposals either risk triviality (over-inclusion) or rely on criteria so specific they exclude plausible sentient systems (under-inclusion).
