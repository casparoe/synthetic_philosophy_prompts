prompt: |-
  i keep going in circles on the pessimistic meta-induction, so instead of arguing about it in general i want to work one case properly.

  The case is the luminiferous aether. Sketch of the facts so we're starting from the same place (correct me if i have something wrong): 19th century wave optics needed a medium for light, people worked out increasingly baroque mechanical properties for it, the Michelson-Morley experiment in 1887 failed to detect motion through it, Lorentz and FitzGerald each proposed something like length contraction to save it, and then the 1905 relativity papers get the same kinematics out of two postulates with no medium at all. I also half-remember that Einstein later, in connection with general relativity, was willing to say that space has physical properties and so something aether-ish comes back — but if i've got that wrong, ignore it, i dont want the answer to turn on it.

  Here's the part i actually want you to work with. I've been trying to make the argument precise using something i call the role-inheritance test. The idea: when a posit gets abandoned, don't ask whether the word or the entity survived, ask whether anything in current science plays the role it was introduced to play. The aether had several jobs — define a preferred rest frame and make sense of absolute motion; be the thing that is waving; carry the energy and momentum of light; transmit forces across otherwise empty space. Some of those jobs died outright, some look like they still have occupants (fields carry energy and momentum, spacetime in GR has real physical structure, the vacuum isn't nothing). And the thing i can't settle is who keeps the books: the pessimistic inductivist counts posits that died and gets a high base rate of failure; the realist counts roles that eventually got filled and gets a low one; and it's the same history in both cases. So what settles the choice of counting rule, if anything does?

  Concretely:

  1. A disciplined mapping. For each of the jobs the aether was supposed to do, say what current physics does with it — dropped, filled by something else, or still open — and then say what that pattern is evidence for.

  2. Does the selective-realism move work here? The version i have in mind says: keep the posits that were doing real predictive and explanatory work, throw out the decorative ones. Which of the aether's properties were load-bearing and which were decoration — and more importantly, is "load-bearing" readable off the situation at the time, or only once you know how the story ends? If it's only the latter, what does that do to the move?

  3. Structural realism: what survives a transition is the structure, roughly the equations, not the ontology. Does that help with this case, given that Lorentz-style aether theory and special relativity were empirically equivalent over the relevant phenomena? What does that stretch of empirical equivalence do to the argument — does it make the discard look less like a refutation and more like a re-description, and does that help or hurt the realist?

  4. My role-inheritance thing: is it a genuine constraint on the meta-induction, or just a relabeling of the disagreement in language i happen to find more comfortable? What would a historical pattern look like that would force both sides to agree on a base rate — or is there no such pattern because the disagreement is upstream of the cases?

  5. And back onto the theory: does this case strengthen the pessimistic meta-induction (a hugely successful research program, abandoned and not coming back), weaken it (most of the job description survived under other names), or show that the argument was always a fight about bookkeeping rather than about how science goes?

  Last wrinkle, take it or leave it: a friend defends something he calls depreciation realism — you hold current successful theories to be approximately true, but your confidence in any given claim decays with time since acceptance, calibrated to whatever the historical rate of abandonment is. Is that coherent? My worry is that it either collapses into plain realism plus an odd bookkeeping ritual nobody follows, or it should be pushing you to disbelieve specific claims of specific current theories, and nobody does that either. Say which way it goes and why.

  Stay concrete, and where the framework has nothing to say about this case, say so instead of making it talk. No reading lists or citations please, i just want the reasoning.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're stuck on the pessimistic meta-induction (PMI) and want to use the luminiferous aether as a concrete case study. The user has outlined several specific questions about role inheritance, selective realism, structural realism, and their own role-inheritance test. 

  First, I need to make sure I understand the history of the aether correctly. The user provided a sketch: 19th-century wave optics required a medium, Michelson-Morley experiment failed to detect motion through it, Lorentz and FitzGerald proposed length contraction, and then Einstein's relativity eliminated the need for aether. There's a mention of Einstein later considering something aether-like in GR, but the user says to ignore it if it's not crucial. So I'll focus on the transition from aether theories to special relativity.

  The user's main concern is about how to count successes and failures in scientific theories. The PMI argues that since past theories were discarded, current ones likely will be too. Realists might counter that some elements survive. The user's role-inheritance test asks whether the jobs a posit was meant to do still exist and are filled, regardless of the entity itself. 

  For question 1, I need to list the aether's jobs and what current physics does with each. Jobs include defining a preferred rest frame, being the medium for light waves, carrying energy/momentum, and transmitting forces. Let's see: the rest frame was dropped with relativity. The waving medium role is gone because light is an electromagnetic wave without a medium. Energy/momentum are now carried by fields. Force transmission is handled by fields and quantum vacuum. So some roles are dropped, others reassigned. This mix supports neither strong realism nor strong pessimism—it's messy.

  Moving to question 2 on selective realism. The idea is that load-bearing posits survive. For aether, its wave-medium role was crucial in the 19th century, but it turned out wrong. The math (Maxwell's equations) survived. Problem is, back then, the medium seemed essential. Only hindsight shows which parts were core. This makes selective realism tricky because it relies on present knowledge, which isn't available to past scientists. So the move might be question-begging.

  Question 3 is about structural realism. Both Lorentz's aether theory and special relativity used similar math (Lorentz transformations). The equations survived, but the ontology (aether) didn't. This suggests structure persists. However, the empirical equivalence before 1905 means the shift wasn't due to new data but a reinterpretation. That weakens PMI's claim of refutation and supports structural realists. But it also shows that ontological commitments can be flexible while structure remains.

  Question 4 addresses the user's role-inheritance test. Is it a real constraint or just relabeling? If all roles were dropped, PMI wins; all kept, realism wins. But mixed cases like aether lead to stalemate. The test might clarify but not resolve the debate because what counts as a "role" or "filling" is subjective. Historical patterns won't force agreement since the disagreement is deeper—about what counts as continuity in science.

  Question 5 asks whether this case strengthens or weakens PMI. The aether was central and abandoned, supporting PMI. But its mathematical structure and some roles (energy carrier) survived, supporting realism. It shows the debate is partly about how we categorize continuity and change, not just historical facts.

  Finally, the user mentions depreciation realism—confidence in theories decays over time based on historical abandonment rates. The worry is it's either redundant (if it matches current beliefs) or forces disbelief in specific claims, which scientists don't do. In this case, depreciation might apply to the aether's existence claim but not to the math. However, it's ad hoc without clear criteria for what depreciates. It doesn't resolve the core issues and might not be practical.

  The user's deeper need seems to be finding a clear framework to evaluate scientific progress without getting stuck in endless meta-arguments. They want concrete tools to assess continuity and discontinuity in theory changes. The aether case highlights the complexity: some aspects die, others evolve. The user might be seeking a middle ground that acknowledges both loss and retention without falling into polarized positions. 

  In conclusion, the aether case doesn't cleanly support either side, revealing the meta-induction debate as fundamentally about interpretation. The role-inheritance test helps dissect specific transitions but doesn't settle the larger dispute because core philosophical differences persist. The user's frustration with circular arguments is understandable—this case shows why the debate endures.
answer: |-
  Let's break down the aether case using your role-inheritance test and address your questions concretely.

  ### 1. Job Mapping & Evidence
  - **Preferred Rest Frame / Absolute Motion**: *Dropped*. Special Relativity (SR) eliminated absolute rest. All inertial frames are equivalent. *Evidence for pessimism*: A core ontological commitment of aether was falsified.
  - **Medium for Light Waves ("The Thing Waving")**: *Dropped*. Light is an electromagnetic wave in the EM field, requiring no material medium. Quantum fields further solidify this. *Evidence for pessimism*: The central *substance* of aether was abandoned.
  - **Carrier of Energy/Momentum**: *Filled by something else*. The electromagnetic field carries energy/momentum (via the stress-energy tensor). In QFT, photons mediate these. *Evidence for realism*: The *functional role* persists, reassigned to fields.
  - **Transmitter of Forces (Across "Empty" Space)**: *Filled by something else*. Fields (EM, gravitational) transmit forces. Quantum vacuum fluctuations imply space isn't "empty". *Evidence for realism*: The *causal role* of mediating interactions remains, now handled by fields/vacuum.

  **Pattern Evidence**: This mixed outcome (2 drops, 2 reassignments) undermines *both* strong pessimism (not all was discarded) and strong realism (core ontology was discarded). It supports a *moderate* view: science discards ontology but preserves *causal/explanatory functions* through new entities.

  ### 2. Selective Realism: Load-Bearing vs. Decoration
  - **Load-Bearing Properties**:  
    - *Essential*: Providing a medium for wave propagation, enabling energy transfer.  
    - *Crucial for predictions*: Aether's theoretical structure supported wave optics (e.g., Huygens' principle, interference).  
  - **Decorative Properties**:  
    - Mechanical details (e.g., rigidity, density models by Fresnel/Stokes).  
    - "Aether drag" hypotheses to explain null results pre-Michelson-Morley.  

  **Problem**: In 1890, "load-bearing" *included* the medium itself – waves *needed* a substance. Post-1905, only the *mathematical structure* (Maxwell's equations) was essential.  
  **Verdict**: "Load-bearing" is *not* readable purely contemporaneously. It requires hindsight to separate durable structure (equations) from disposable ontology (medium). This *weakens* selective realism – it risks being "retrospective cherry-picking."

  ### 3. Structural Realism & Empirical Equivalence
  - Lorentzian aether theory and SR shared the Lorentz transformations and Maxwell's equations. The *structure* (kinematics, EM laws) survived.  
  - **Empirical Equivalence Impact**:  
    - *Helps structural realism*: The core mathematical structure was preserved, validating SR's claim that structure is the "real" knowledge.  
    - *Hurts pessimism*: The transition wasn't a catastrophic refutation but a *reinterpretation* of the same formalism (equations under new postulates).  
    - *Hurts entity realism*: Ontology (aether vs. spacetime) changed despite empirical sameness, showing ontology is underdetermined.  
  **Verdict**: This case is a *textbook win* for structural realism. The equations survived; the mechanical aether didn't. Empirical equivalence makes the discard look like ontological housekeeping, not falsification.

  ### 4. Role-Inheritance Test: Constraint or Relabeling?
  - **Not Mere Relabeling**: It forces specificity. Instead of arguing "aether was discarded," we ask *which aspects* of its role vanished.  
  - **But Not a Forced Consensus**:  
    - A pessimist sees "no preferred frame" as role-death; a realist sees "fields carry energy" as role-inheritance.  
    - **What Would Force Agreement?**  
      - *All roles extinct* (e.g., phlogiston's roles: combustion, calcination, respiration – all replaced by oxygen chemistry) → Pessimism wins.  
      - *All roles identically filled* (e.g., DNA replacing genes as hereditary molecule, same role+mechanism) → Realism wins.  
    - Aether's *partial* inheritance (like caloric's heat storage role → kinetic energy) is inherently ambiguous.  
  **Verdict**: The test clarifies the *locus* of disagreement but doesn't resolve it. The core dispute ("What counts as continuity?") is upstream.

  ### 5. Impact on the Pessimistic Meta-Induction (PMI)
  - **Strengthens PMI**: A dominant, successful entity (aether) was abandoned *as an entity*. Its core ontology (substantial medium, absolute rest) is dead.  
  - **Weakens PMI**: Its *functional roles* (energy carrier, force transmitter) persist. The *structure* (Maxwell, Lorentz transforms) survived intact.  
  - **Reveals Bookkeeping Dispute**: Yes. Counting "discarded posits" (pessimist) vs. "preserved roles/structure" (realist) *is* the heart of the conflict. This case shows both counts are valid but incomplete alone. Science exhibits *functional continuity amid ontological rupture*.

  ### Depreciation Realism: Coherent?
  - **Collapse Risk**: If depreciation is uniform ("all claims decay at rate X"), it *is* just realism plus ritual – scientists don't discount specific claims this way.  
  - **Plausible If Selective**: Depreciate *ontological commitments* (e.g., "aether exists") faster than *structural/mathematical content* (e.g., wave equations). In this case:  
    - 1887 (post-Michelson-Morley): Confidence in aether *as a rest frame* plummets; confidence in wave optics remains high.  
    - 1905: Aether's existence depreciates to near-zero; Lorentz transforms retain high credibility.  
  **Verdict**: Coherent only if tied to *domain-specific* historical trends (e.g., "mechanical ontologies depreciate faster than field equations"). But it's ad hoc without a theory of *what* depreciates. Scientists *do* disbelieve specific claims (e.g., "aether exists"), just not via a depreciation formula.

  ### Summary
  - **Aether's Fate**: Ontology discarded (pessimism win), roles/structure preserved (realism win).  
  - **Meta-Lesson**: PMI vs. realism is a stalemate. Science progresses by preserving *causal-mathematical functions* while reimagining *ontological implementation*. Role-inheritance clarifies this but can't force consensus. The aether case shows why the debate persists: it's about defining "success" in theory change.
