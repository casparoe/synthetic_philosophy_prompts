  ### The Device
  A single-molecule gas is in a box with a movable partition, initially dividing it into equal left (L) and right (R) volumes. The demon is a three-state system: states \(A\), \(B\), or \(C\), coupled to the molecule via a mechanical linkage. A work reservoir (e.g., a spring) stores extracted work. The cycle begins with the demon in state \(A\), the molecule in thermal equilibrium (50% L/R), and the partition centered. Steps:  
  - **Correlation**: Demon reversibly interacts with the molecule. If molecule in L, demon stays in \(A\); if in R, demon transitions to \(B\). No work or heat exchange.  
  - **Work extraction**: If demon in \(A\) (molecule in L), the linkage inserts a piston in R; molecule expands reversibly to fill the box, extracting work \(W = kT \ln 2\) from heat bath. If demon in \(B\) (molecule in R), piston inserts in L; same work extracted.  
  - **Cycle closure**: Demon in \(B\) (post-work) interacts reversibly with the expanded molecule. The linkage resets the demon to \(A\) while compressing the molecule back to its initial half-box (L or R) using the work reservoir. No net work cost due to reversibility.  
  At cycle end, demon returns to \(A\), molecule to random half-box, work \(W = kT \ln 2\) delivered. Net work per cycle is systematic and repeatable.

