prompt: |-
  I'm a backend engineer with no philosophy training, and I sit in on a lunchtime reading group at the hospital where my partner works. We did a session last month on naturalism versus normativism about health and disease, and one of the residents built an argument that I've been turning over ever since. It seems to prove far too much, but I can't find where it leaks, and I'd like someone to name the step and price the alternatives. Here it is, cleaned up from my notes: (1) Any usable account of disease has to return a verdict on individual cases — for this patient and this condition, yes or no. (2) Naturalism says: a condition is a disease just in case some part or process in the person is performing below the statistically normal level of function for that person's reference class. (3) A reference class is just a partition of a population; biology may fix the species, but nothing in biology fixes how fine to go inside it. (4) Refine far enough — ancestry, genome, diet, occupation, medication, altitude — and every real patient comes out average: given everything true of them, their numbers are exactly what you'd predict. So, on (2), nothing is a disease. (5) Coarsen far enough — all humans, all ages, all states — and perfectly ordinary conditions (being three years old, being pregnant, being asleep) fall below normal function. So everything is a disease. (6) The theory itself puts no constraint on how fine or coarse to go, so (2) can be made to return whichever verdict you want in any actual case. (7) When a verdict flips with a choice the theory leaves open, the theory isn't reporting a fact about the patient; the choice is being made for us, because of which differences we happen to care about clinically. (8) So the value-free core isn't value-free: our interests are doing the work at exactly the point where the reference class gets fixed. (9) So normativism is true: at bottom, calling something a disease is a value judgement about it. (10) But then whatever a society disvalues can qualify as a disease, and medicine ends up pathologising whatever the people in charge dislike. (11) So there is no stable fact of the matter: the question 'is it a disease?' is always a negotiation, and the three specialists who gave my daughter three different answers weren't disagreeing about a fact at all.

  I don't accept (11). The two claims I'd most like to keep are: (i) there is a fact of the matter about whether my daughter's condition is a disease — she's seven, she's been labelled with idiopathic fatigue syndrome after two years of tests that keep coming back in the normal range, and three specialists have given three answers — even if nobody currently knows what that fact is; and (ii) whether it's a disease isn't settled by what anyone wishes were true. As a stress test I made up a case: call it congenital hypoalgesia type V. Roughly one person in three hundred is born with it; they report about a third of typical pain, they have no other measurable difference, their wounds heal faster, and in my imaginary cohort data they have slightly higher completed fertility than matched controls — yet they score below the third percentile on pain-threshold testing for their age and sex. It looks like a disease on one reading of (2) and not on another, and I'd like to know what that tells me.

  So: which step do you reject, and what does rejecting it cost you? Walk my numbering, tell me why the step you reject looked airtight before I looked closely at it, and price the main alternatives — including defining function by selection history instead of by current statistics, and the hybrid view that a disease is a dysfunction plus a harm — and say what each option does with my invented hypoalgesia case and with my daughter's. Open with your bottom line in the first sentence, then give the reasoning, no preamble and no restating of my question. British English, please.
reasoning: |-
  Hmm, the user is a backend engineer with no formal philosophy training but has engaged with a complex debate about naturalism versus normativism in defining disease through a hospital reading group. They're grappling with an argument presented by a resident that seems to undermine the objectivity of disease classification, leading to troubling conclusions like medicine pathologizing whatever society dislikes. The user rejects the final step (11) that there's no fact of the matter about disease status, particularly regarding their daughter's idiopathic fatigue syndrome. They've also constructed a hypothetical case (congenital hypoalgesia type V) to test definitions.

  Key concerns emerge: First, they want to preserve objectivity in disease classification - that there's a fact about their daughter's condition independent of human valuations. Second, they're troubled by the argument's slippery slope where reference class selection makes naturalism either declare everything a disease or nothing at all. Third, they seek a framework that handles both their daughter's ambiguous case and their hypoalgesia thought experiment without collapsing into relativism.

  The core philosophical tension is between naturalism (disease as biological dysfunction) and normativism (disease as disvalued state). The resident's argument attacks naturalism by showing how reference class selection - which lacks biological constraints - makes dysfunction claims arbitrary. But normativism then leads to the user's feared outcome in step (10) where disease becomes socially contingent.

  The user's hypoalgesia case perfectly illustrates the bind: Is reduced pain a dysfunction? Biologically, it enhances survival metrics (faster healing, higher fertility), but statistically it's abnormal. This exposes how statistical abnormality alone is insufficient for dysfunction. Their daughter's case shows clinical ambiguity where experts disagree despite normal tests, raising questions about whether this represents genuine epistemological uncertainty or proves there's no fact to discover.

  The strongest path forward seems to be rejecting step (2)'s definition of function purely through current statistics. The evolutionary account (function as what a trait was selected for) avoids reference class arbitrariness: pain sensation's function is danger-avoidance, so hypoalgesia would be dysfunctional regardless of population statistics. This preserves naturalism's objectivity. For the daughter, if fatigue stems from some evolutionary mismatch (e.g., immune system errors), it's dysfunctional even if current tests miss it.

  However, this has costs: Evolutionary histories are often unknown or ambiguous (what if hypoalgesia conferred past advantages?), and some diseases (e.g., novel environmental injuries) may lack clear selection-based dysfunction definitions. The hybrid view (dysfunction + harm) handles this by requiring both: hypoalgesia might be dysfunctional but not harmful, so not a disease. But this introduces values at step 8 - which harms "count" depends on social context.

  The user must choose between: pure evolutionary naturalism (retains objectivity but may struggle with novel pathologies), hybrid views (more clinically intuitive but values creep in), or biting the bullet on some social contingency. Their rejection of (11) suggests they'll prefer the evolutionary account despite its empirical challenges, as it best defends the reality of their daughter's condition being discoverable rather than negotiated.
answer: |-
  I reject step (2)’s definition of function purely by *current statistical performance* within a reference class. The core leak is that this conflates statistical abnormality with biological dysfunction. Function isn’t defined by what’s *common now* but by what a trait was *selected to do* – its evolutionary history. This "selected effects" view blocks the argument’s slide into absurdity.

  **Step-by-step rejection & costing:**
  -   **Why (2) looked airtight:** You assumed "function" must mean "current statistical performance". For a backend engineer, this seems natural – like measuring system uptime against a baseline. If biology doesn’t specify the reference class, the statistics become arbitrary, making dysfunction judgments arbitrary too.
  -   **Rejecting (2):** Biology *does* fix function independently of current statistics. A heart’s function is to pump blood because that’s what it was evolutionarily selected for. "Below normal function" means *failing to perform its selected effect*, not merely being statistically uncommon. This anchors dysfunction in objective biological history, not arbitrary groupings.
  -   **Cost:** You abandon pure statistical naturalism. This requires committing to evolutionary biology as foundational. It means accepting that some dysfunctions might exist even if *currently* statistically normal (e.g., myopia in a nearsighted species post-environmental shift) or vice-versa (your hypoalgesia might be rare but not dysfunctional).
  -   **Handling your cases:**
      -   **Congenital Hypoalgesia Type V:** Pain sensation’s selected effect is to alert to harm and promote avoidance/repair. Even if sufferers heal faster and have higher fertility *now*, their pain system fails to perform its evolved warning function adequately (e.g., they might not avoid injuries). This *is* a dysfunction. Its statistical rarity (1/300) is irrelevant; what matters is deviation from the designed response. It remains a "disease" biologically, even if beneficial in some contexts. The fertility/happiness argument is normativist – biology doesn’t care if you’re happier, only if the mechanism works as selected.
      -   **Your Daughter (Idiopathic Fatigue):** The question becomes: is her fatigue caused by a failure of evolved energy-regulation systems to perform their selected functions? The specialists’ disagreement reflects *epistemological uncertainty* (they don’t know the underlying mechanism), not *ontological indeterminacy* (no fact exists). Tests might miss a subtle dysfunction in cellular metabolism, immune signalling, or neural circuitry whose function is objectively fixed by evolution. The fact that tests are "normal" only means they haven’t found the broken part yet – not that there’s no fact.

  **Pricing Alternatives:**
  1.  **Pure Selected-Effects Naturalism (my position):**
      -   **Cost:** Requires grounding in evolutionary theory. Some traits have unclear selected effects. Novel environments can create "mismatch" dysfunctions hard to define purely historically (e.g., obesity in food-abundant societies).
      -   **Hypoalgesia:** Disease (dysfunction of pain warning system).
      -   **Daughter:** Potentially a disease if an evolved system is malfunctioning; verdict depends on discovering the underlying cause.

  2.  **Hybrid View (Dysfunction + Harm):**
      -   **Cost:** Concedes step (8) – values *are* necessary to define "disease" (though not dysfunction). Harm is value-laden (what counts as harm? Suffering? Reduced lifespan? Social disadvantage?). Opens the door to some relativism (step 10), though harm can be constrained biologically (e.g., threat to survival/reproduction).
      -   **Hypoalgesia:** Likely *not* a disease. It’s a dysfunction but causes no harm (possibly benefit) in your scenario. Harm is needed for the "disease" label.
      -   **Daughter:** Only a disease if her fatigue causes significant harm *and* stems from a dysfunction. Values determine if her fatigue level is "harmful".

  3.  **Boorse’s Biostatistical Theory (BST - refined statistics + reference class):**
      -   **Cost:** Tries to salvage statistical naturalism by fixing the reference class as "age/sex group of a species". Rejects arbitrarily fine/coarse classes (steps 3-5). But "species-typical function" is still statistical *and* vulnerable to environmental shifts changing the norm. Doesn’t fully escape the arbitrariness charge for defining "function".
      -   **Hypoalgesia:** Disease (statistically subnormal pain response for age/sex).
      -   **Daughter:** Potentially a disease if her fatigue is statistically subnormal for 7-year-old girls *and* reduces functional ability. Still relies on potentially shifting statistical norms.

  **Bottom line:** Step (2)’s statistical definition of function is the leak. Replacing it with evolutionary-selected effects anchors dysfunction objectively. Your hypoalgesia case *is* dysfunctional (and thus biologically a disease) because the pain system fails its evolved purpose, irrespective of its statistical rarity or contingent benefits. For your daughter, this view preserves (i) that there’s a fact (is an evolved system broken?) and (ii) that wishes don’t settle it – even if current medicine can’t find the answer. The cost is embracing evolutionary biology as the foundation.
