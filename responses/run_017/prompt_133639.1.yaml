prompt: |-
  Hey — I'm the junior person on the collections commitee of a small university art museum, and we've got a nasty one on Tuesday. I've only been on it since September, so I've been back through the minutes trying to work out what we actually think, and I'm not sure our own record pins down an answer. Here's what I've got.

  Five decisions, summarised:

  1. Two years ago we turned down a loan of six huge tapestries woven in a prison workshop under the old regime. The weavers were conscripted, two died at the looms, the tapestries depict the dictator's family as gods, and the survivors' association wrote to say that hanging them as art would honour the men who killed their fathers. We said no, fairly fast.

  2. We own fourteen oils by a landscape painter who beat his wife, drove a student out of the profession and stole that student's designs. Dead eighty years. None of it is in the pictures. They hang in the front gallery on an ordinary label.

  3. We accepted a bequest of a composer's manuscripts and royalties. In 1938 he signed a public loyalty oath and named colleagues to the authorities; two of them lost their posts and one never worked again. A slice of his royalties went to the ruling party, which no longer exists. The music is abstract orchestral work with no political content, and nobody thinks its value comes from any of that. Everyone involved is dead; there's a biography that makes grim reading. We took the bequest and we still programme the symphonies.

  4. We declined a gift of a photographer's famine portfolio. He paid destitute people to pose in degrading arrangements, the shock of the pictures is the entire point of them, descendants of three of the subjects objected in writing, and print sales still fund a foundation that runs projects along the same lines. Declined.

  5. We accepted, with conditions, a travel writer's illustrated diaries — watercolours that are genuinely superb, prose that is casually racist, and a dozen objects he drew or carried home that were taken from shrines without anyone's permission. Writer long dead. The community whose shrines they were is very much alive; we wrote to them; they asked that the diaries be shown only alongside their own account of the objects, and that we not sell reproductions. We agreed, and that's what's on the wall. Two members dissented and wanted to refuse outright, which is why I think this one may be our weakest precedent.

  Now Tuesday. A set of thirty-four plaster life-casts, made in the winter of 1868 from men held after a failed uprising on an island whose name I'll leave out of this email. All thirty-four were hanged within a fortnight of sitting for the casts, which were then sold around Europe first as anatomical specimens and later as sculpture; they're now regarded as among the finest anatomical modelling of the century, and having seen the photographs I don't think that's hype. The sculptor's notebooks, digitised by an archive last year and properly read for the first time, say he chose the men for the nobility of their fear as they waited to hang, and that he had them stripped and shackled in the studio for the sittings. We bought our set at auction in 1974, title clean. We advertised twice for descendants and heard nothing; but a historian at another university has now matched three of the names to families still living on the island, and nobody has contacted those families yet. The island's heritage council has written asking to be consulted — asking, not claiming; they've said they know they have no legal standing. The director keeps mentioning that these are the most requested objects we own and that we're about £200k down this year, which I assume is meant to be irrelevant.

  The four options on the table: show them as sculpture, show them with the men's names and the notebook material and a wall text, keep them in store, or defer until the three families have been asked.

  What I want from you isn't really a gut reaction. I want to know what rule or rules we've been implicitly running in 1 through 5, whether more than one rule fits all five equally well, and what each of those rules says about Tuesday. Which of the five is the closest analog and why. If we genuinely aren't pinned down, say so plainly and tell me what principle we'd be committing ourselves to with each of the four options — I'd rather adopt something on purpose than by accident. And tell me which single further fact, or which small hypothetical case, would best separate the rules from each other: if the load-bearing question really is "ask the families first," I want to be able to explain to the committee why that's the load-bearing question and not just politeness.

  Reason it out in whatever order makes sense, then finish with one line: \answer{show}, \answer{show with conditions}, \answer{store}, or \answer{defer}.
reasoning: |-
  Okay, let me try to work through this systematically. The user is on a museum collections committee facing a tough decision about displaying life-casts made under coercive conditions, and wants to understand their institution's implicit ethical framework based on past decisions. 

  First, I need to extract the patterns from those five precedents. In case 1 (tapestries), they refused because displaying would honor perpetrators against victims' wishes. Case 2 (landscape paintings) was displayed despite artist misconduct because the art itself was untainted. Case 3 (composer manuscripts) accepted because the problematic history was extrinsic to the artistic value. Case 4 (famine photos) refused due to ongoing harm in creation and use. Case 5 (diaries) accepted with conditions when directly affected communities negotiated terms. 

  Hmm... the unifying thread seems to be whether harm is actively perpetuated through display. But case 5 complicates it - there they mitigated harm through collaboration. The life-casts situation feels closest to case 5: living connections exist (the families/island council), and creation involved coercion. But unlike the diaries, no outreach has happened yet. 

  The director's budget concerns are a red herring - none of the precedents considered finances. The key differentiator from case 2 and 3 is whether the harm is materially embedded in the work. Those plaster casts literally capture the men's bodies under duress - the suffering is the medium itself. That makes this more like the tapestries where display risks re-enacting violence. 

  But here's the nuance: showing them with full context could serve as witness rather than celebration if handled right. That's where case 5's model applies - but it requires consultation first. Deferring to contact families isn't just politeness; it's necessary to determine if display would compound harm like in case 1 or enable reclamation like in case 5. 

  The hypothetical test I'd propose: if descendants said "display these to show what was done to us," would that change the calculus? For case 2 paintings, family input wouldn't matter because the harm isn't in the art. Here, it's everything. So yes - the load-bearing question is consultation because it determines whether display perpetuates or transforms the harm.
answer: |-
  Based on your precedents, the committee operates under **two primary, non-exclusive rules**:

  1.  **Harm Prevention Principle:** *Reject/restrict items if display or acquisition perpetuates ongoing harm, exploits subjects/creators, or serves as a monument to perpetrators.* (Evident in 1, 4, and 5).
  2.  **Artistic/Historical Autonomy Principle:** *Accept/display items if the harm is extrinsic to the work's artistic/historical value and display doesn't actively perpetuate harm.* (Evident in 2, 3, and arguably 5).

  **Analysis of Precedents:**

  *   **1 (Tapestries):** Rejected under **Harm Prevention.** Display would honor perpetrators & violate victims' wishes = ongoing harm.
  *   **2 (Landscapes):** Accepted under **Autonomy.** Artist's misconduct irrelevant to artwork's content; display causes no new harm.
  *   **3 (Composer):** Accepted under **Autonomy.** Misconduct/political ties extrinsic to music; display/performing causes no new harm.
  *   **4 (Photographs):** Rejected under **Harm Prevention.** Creation involved exploitation; display perpetuates shock-value harm; foundation continues harmful practices.
  *   **5 (Diaries):** Accepted *with conditions* under **Harm Prevention.** *Potential* for harm (racism, stolen objects) exists, but **mitigated via consent and co-authorship** with the affected community. Conditions transform display from potential harm into collaborative witness/accountability.

  **Tuesday's Case (Life-Casts) Analysis:**

  *   **Closest Analog:** **#5 (Diaries).** Both involve:
      *   Objects created under coercion/exploitation (stripped, shackled men facing execution; stolen shrine objects).
      *   Clear connection to living communities (Island families/heritage council; shrine community).
      *   Significant artistic/historical value arguably separable from context.
      *   Potential for display to either perpetuate harm or serve as witness/education.
  *   **Key Differences:** Unlike #5, **no consultation has occurred** with affected parties. The harm (coercion, execution) is **viscerally embodied** in the casts themselves.

  **Applying the Rules:**

  *   **Harm Prevention:** Showing without consultation risks replicating the original exploitation (using the men's bodies/terror without consent). The sculptor's intent ("nobility of their fear") is deeply problematic. Display *could* perpetuate harm if done insensitively. *Consultation is essential to determine if harm can be mitigated, as in #5.*
  *   **Autonomy:** The casts are significant artistic/historical artifacts. Their value as anatomical models/sculpture *could* be argued as separate from their origin. However, the harm is **intrinsic** – the casts *are* the product of the coercion and impending death. This makes Autonomy a weaker justification here than in #2 or #3.

  **Implications of Options:**

  1.  **Show as Sculpture:** Violates **Harm Prevention.** Ignores context, replicates objectification, risks aestheticizing suffering. Contravenes precedent #1 & #4.
  2.  **Show w/ Names/Notebook/Wall Text:** *Potentially* aligns with **Harm Prevention** *only if* it serves as critical witness/reckoning. However, **without consultation**, it risks being exploitative ("trauma display") and may still cause harm to families/islanders. Untested against precedents.
  3.  **Store:** Avoids immediate harm (**Harm Prevention**), but avoids responsibility and denies historical/artistic value (**Autonomy**). A non-decision, unlike active refusals (#1, #4).
  4.  **Defer until families asked:** Upholds **Harm Prevention** by prioritizing consent/consultation, mirroring the *process* in #5. Allows for potential future display *with conditions* if collaboration mitigates harm, or informed refusal. Honors the Heritage Council's request.

  **The Load-Bearing Question: "Ask the Families First"**

  This is **not mere politeness**. It is the **core mechanism of the Harm Prevention Principle** as established in #5. Consultation determines:
  *   **If display causes new/renewed harm** (like objections in #1 & #4).
  *   **If harm can be transformed** through co-authorship/conditions (like #5).
  *   **If autonomy can ethically apply** by confirming the harm is truly past and not perpetuated.

  **What Pins You Down? What Separates the Rules?**

  *   **You are NOT fully pinned down.** Precedents #2 and #3 lean strongly Autonomy; #1 and #4 strongly Harm Prevention. #5 shows Harm Prevention *can* be satisfied *via* consultation/conditions.
  *   **Crucial Hypothetical to Separate Rules:** *"Would you display a beautifully painted portrait of a Holocaust victim, created by their camp guard under orders, if no descendants could be found?"*
      *   **Harm Prevention Focus:** Likely no. The object *is* the harm; display risks aestheticizing atrocity regardless of intent.
      *   **Autonomy Focus:** *Maybe*, with extreme contextualization, arguing the portrait has value as historical evidence/witness separate from the guard's role.
      *   **Your Precedents Suggest:** This hypothetical is closer to #1 (Tapestries) and #4 (Photos) – the harm is intrinsic and display risks honoring/perpetuating. **Harm Prevention likely prevails.** The Life-Casts case is similar.

  **Recommendation:**

  Deferring consultation is essential to apply your Harm Prevention Principle (established in #5) ethically. Proceeding without consultation risks violating the spirit of #1 and #4. **Deferral allows you to actively pursue the process that made #5 ethically viable.**

  \answer{defer}
