prompt: |-
  I'm writing a seminar paper on subsidiarity across four systems — the United States, Germany, Switzerland and the European Union — and I keep hitting the same obstruction. Every formulation of the principle I can find is procedural: it tells you who must justify what, to whom, and how clearly, but never which substantive wrong the principle is meant to prevent. So I want to approach it from the other side and treat the practices as the evidence. Four of them puzzle me. First, in Germany a federal statute that the Länder will have to execute, or that regulates their administrative procedure, cannot take effect without the consent of the Bundesrat, whose members are the Länder governments themselves: the Länder hold something close to a veto over federal legislation not because the subject matter is reserved to them but because they are the ones who will administer it. Yet the same Länder execute a great deal of EU law with, as far as I understand it, only a weaker right of participation in the making of that law — something approaching a veto only where their exclusive competences over schools, culture and broadcasting are touched. Second, in the Union the rule is stated as a comparative test — Article 5(3) of the Treaty on European Union says that in areas which do not fall within its exclusive competence, the Union shall act only if and in so far as the objectives of the proposed action cannot be sufficiently achieved by the Member States, either at central level or at regional and local level, but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level — and it is operationalised by the Commission giving reasons for its own proposals, by national parliaments (and, in some states, regional parliaments with legislative powers) sending reasoned opinions within a fixed period, and by a mechanism whereby objections reaching a threshold share of the votes allocated to those parliaments force the Commission to review and justify, while a larger majority lets the Council and Parliament send the proposal back. But the same member-state governments that sit in the Council adopt the measure, and the Court of Justice has rarely if ever annulled one on subsidiarity grounds. Third, American courts say that a federal statute will not be read to displace state law unless Congress has made its intention to do so unmistakably clear in the language of the statute — while the very same courts will invalidate a state statute under the dormant commerce clause, a doctrine inferred from a grant of power to a Congress that has said nothing at all. Fourth, in Switzerland no court can set aside a federal statute for exceeding federal competence, since the Federal Supreme Court is bound to apply federal statutes; boundary disputes are settled politically instead, through the optional referendum and through fiscal equalisation among the cantons.

  What I would like from you is the implicit theory behind each of these, and the differences between them. My own attempt at a taxonomy gives three candidates, which you should feel free to replace or refine: (a) a reserved-sphere view, on which certain matters belong to a lower level as such and central action over them is a distinct kind of wrong; (b) a comparative-efficiency view, on which allocation is a single test about the achievement of a given objective plus a rule about who bears the burden of proof; and (c) a participation-or-consent view, on which the real wrong is not centralisation but being bound by a decision in the making of which you had no part, so that what is owed to the lower level is a voice or a veto rather than a domain. Then tell me, for each practice, what it strictly presupposes as opposed to what it merely fits well with, and where the practice is philosophically underdetermined because several quite different theories would license exactly what those systems do.

  There are four cruxes I especially want addressed. Does the German consent requirement presuppose (a) or (c), and if (c), why is it not inconsistent to withhold the corresponding veto over EU law the Länder execute? Is a self-applied constraint — a legislature judging its own compliance, as the Union in effect does — a normative constraint at all, and how much does it matter whether the boundary question is ultimately settled by a court, by an electorate, or by the body whose power is in question? Does the American asymmetry between demanding clarity from Congress and demanding none from the states show that federalism there is protected as a matter of process rather than substance, or does it show something about who is thought to be the beneficiary of the principle? And is there any upward principle anywhere in this material: none of these rules says that a level must act, or must defer, when another level's failure harms outsiders, and yet Germany's Basic Law also authorises federal legislation where it is required to establish equivalent living conditions across the country, and the Union counts cohesion among member states among its aims — so is that a rival principle, a corollary, or already implicit in the phrase about what cannot be sufficiently achieved by the member states? Finally, say in concrete terms what would have to change in each system if the theory you reconstruct were replaced by one of the others — which existing rule becomes indefensible, and which rule now looks like it was doing no work at all. Please don't give me a bibliography, case citations or a reading list; I have those, and I want the reconstruction itself, roughly 800 to 1000 words, with your distinctions explained in your own terms rather than merely labelled.
reasoning: |-
  Okay, this user is working on a complex comparative analysis of subsidiarity across four systems and has hit a conceptual wall. They're frustrated with purely procedural definitions and want to understand the substantive wrong each system is trying to prevent through its unique practices. 

  The user is clearly deeply immersed in their research - they've identified four specific institutional puzzles that reveal deeper theoretical tensions. Their taxonomy of three possible theories (reserved-sphere, comparative-efficiency, participation-consent) shows sophisticated prior analysis, but they're struggling to map these cleanly onto real-world variations. 

  What they're really asking for is philosophical reconstruction: the unstated premises behind each system's approach. The four "cruxes" they identify are brilliant focal points that cut to the heart of comparative federalism theory. I notice they're particularly concerned with inconsistencies (like Germany's EU law implementation without veto) and asymmetries (like the US dormant commerce clause paradox).

  This isn't a beginner's request - they've done the legwork and want someone to help synthesize. Their prohibition against citations suggests they need conceptual clarity, not more sources. The word limit forces distillation. 

  The challenge will be avoiding academic jargon while preserving precision. Their examples are so jurisdiction-specific that any reconstruction must remain tethered to concrete practices. The "what would change" test at the end is especially useful - it forces the theories to prove their explanatory power.

  I should resist the temptation to force all systems into one grand theory. Their three-category framework is workable if I show how each system combines elements differently. The upward cohesion principle they mention last might be the key to unifying the analysis - it appears in both German and EU contexts as a counterweight to strict subsidiarity.

  Most importantly, I need to honor their insight that these aren't just procedural variations but reflections of fundamentally different conceptions of what subsidiarity protects. The US cares about state legislative autonomy, Germany about Land administrative dignity, Switzerland about canton sovereignty through direct democracy, and the EU about national parliamentary voice. The "wrong" differs accordingly.
answer: |-
  Your analysis correctly identifies that subsidiarity is often proceduralized, obscuring its substantive core. The practices you describe reveal distinct underlying theories, which I’ll reconstruct as follows:  

  ### **Implicit Theories and Their Operation**  
  1. **Germany (Bundesrat Consent):**  
     - **Theory:** **Administrative Dignity (Variant of Participation/Consent)**  
       The Länder’s veto over federal laws they execute protects their role as primary administrators. The wrong prevented is *coercive imposition of administrative burdens without agency*. It presupposes that executing laws fundamentally implicates a lower level’s self-governance—not merely its policy domain.  
     - **Inconsistency with EU Law?**  
       No. The EU’s weaker Länder participation reflects a **hierarchical concession**: EU law’s legitimacy stems from member-state consent in treaties, not Länder consent. The "wrong" here is exclusion of *member states* (via the Bundesrat in the Council), not Länder directly. Länder execute EU law as *agents of Germany*, not autonomous entities. The theory is consistent: consent is owed to the level that *constituted* the higher authority.  

  2. **EU (Article 5(3) and Review Mechanism):**  
     - **Theory:** **Comparative Efficiency with Institutional Safeguards**  
       The wrong is *unnecessary centralization*—action taken when local levels could achieve the same goal. The test is purely instrumental: "sufficiently achieved" elsewhere. The procedural mechanisms (reasoned opinions, thresholds) operationalize a **burden-shifting framework**: once MS parliaments object, the Commission must *re*-justify efficiency.  
     - **Why No Annulments?**  
       The Court avoids second-guessing because the test is political, not legal-substantive. The constraint is **deliberative**: forcing transparency and intergovernmental negotiation. It presupposes that the *process* of justification among levels *is* the constraint. Judicial review would reframe efficiency as a justiciable standard, which the system rejects.  

  3. **US (Clear Statement Rule vs. Dormant Commerce Clause):**  
     - **Theory:** **Procedural Protection for States, Substantive Protection for the Union**  
       - *Clear Statement Rule*: Reflects **state autonomy as process**. The wrong is *unintentional congressional override* of state sovereignty. Clarity ensures Congress debates federalism costs.  
       - *Dormant Commerce Clause*: Protects **national market integrity as substance**. The wrong is *state obstruction of collective interests* (free trade). Silence by Congress implies market unity is paramount.  
     - **Asymmetry Explained:**  
       Federalism protects states via *political process* (Congress must confront state interests), but protects the union via *substantive limits* (states cannot harm national interests). The beneficiary differs: states get voice, the union gets a shielded realm.  

  4. **Switzerland (Political Settlement, No Judicial Review):**  
     - **Theory:** **Cantonal Sovereignty through Direct Democracy**  
       The wrong is *judicial interference in federal-cantonal bargaining*. Optional referendums and fiscal equalisation are **self-correcting political tools**. Cantons accept federal overreach because they can veto statutes *or* negotiate compensation. Presupposes that boundaries are fluid and best resolved by those affected, not courts.  

  ---

  ### **Cruxes Addressed**  
  **1. German Consent & EU Law Inconsistency?**  
     - Not inconsistent. The Bundesrat veto presupposes (c)—*participation as administrative dignity*—but EU law execution is governed by Germany’s *state consent* to the EU treaties. Länder influence the EU via Berlin, not direct veto. Change to theory (a) (reserved sphere) would require abolishing EU law execution by Länder.  

  **2. Self-Applied Constraint (EU) as Normative?**  
     - Yes, but as **political accountability**, not legal restraint. The constraint lies in exposing overreach to national parliaments and the public. A court (like Germany’s) would transform subsidiarity into a rights-based limit; political settlement (Switzerland) treats it as a bargaining chip. The EU method collapses without the Commission’s incentive to preempt objections.  

  **3. US Asymmetry: Process vs. Substance?**  
     - Both. Process protects states as *participants*; substance protects the union as a *collective project*. If federalism were solely about state autonomy (a), dormant commerce would vanish; if solely about efficiency (b), the clear statement rule would seem irrational.  

  **4. Upward Cohesion Principle (Germany/EU):**  
     - **Implicit in Comparative Efficiency.** "Cannot be sufficiently achieved" includes *inter-jurisdictional harm*: if states fail to ensure cohesion, central action is justified. Germany’s "equivalent living conditions" and EU cohesion are not rivals but *applications* of subsidiarity’s efficiency test to collective problems.  

  ---

  ### **What Changes if Theories Swapped?**  
  - **Germany adopts Reserved Sphere (a):**  
    Bundesrat consent would apply only to "core" Land powers (e.g., education), not all executed laws. Executing federal environmental laws without consent would be unproblematic. The current system’s administrative dignity logic becomes incoherent.  

  - **EU Adopts Participation/Consent (c):**  
    National parliaments gain vetoes over EU laws they implement. The efficiency test (b) becomes irrelevant—subsidiarity is satisfied by consent, even for inefficient centralization.  

  - **US Adopts Comparative Efficiency (b):**  
    Courts would balance state/federal efficiency in every case, discarding clear statement rules. Dormant commerce might vanish if states prove local benefits outweigh national costs.  

  - **Switzerland Adopts Judicial Review (a/b):**  
    Federal Court could strike down federal laws, making referendums redundant. Fiscal equalisation loses its role as a boundary-adjustment tool.  

  ---

  ### **Conclusion: The Unstated "Wrongs"**  
  - **Germany:** Wrong = Lower levels as *unconsenting administrators*.  
  - **EU:** Wrong = Centralization *without proof of necessity*.  
  - **US:** Wrong = (1) Federal override *without deliberate choice*; (2) State harm to *national collective goods*.  
  - **Switzerland:** Wrong = *Judicial resolution* of political disputes.  

  **Philosophical Underdetermination:**  
  The EU’s efficiency test *could* fit (b) or (a) if "sufficient achievement" implies states "own" default authority. Switzerland’s model *could* reflect (c) if referendums are seen as cantonal consent. But each system’s procedures reveal distinct priorities: dignity for Germany, evidence for the EU, intent for the US, and sovereignty for Switzerland. The substance of subsidiarity lies in what each system polices procedurally.
