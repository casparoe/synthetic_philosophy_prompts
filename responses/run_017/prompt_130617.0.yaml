prompt: |-
  I was appointed to the acquisitions and display committee of our regional museum last spring, and our next item is one I have wanted settled for years — so I should say at the outset that I am not a neutral party. The building at issue is the parish church my family has attended for four generations; part of me simply wants it whole again. That is exactly why I would rather argue from our own record than from my wish. Our museum is small: a teaching remit, a regional brief, a collection strong in medieval and Renaissance material and thin everywhere else, and a display budget that cannot fund two versions of anything.

  The case before us. In the 2016 earthquake the apse of the village church collapsed, taking with it a fresco cycle of about 1480 by a local workshop. Roughly sixty per cent of the painted surface was recovered in fragments, most with recorded find-spots. There is also a photogrammetric survey from 2011, a set of pre-war colour transparencies, and a restorer's 1958 tracings that record the colour of areas now lost. A consortium of a university imaging lab, the diocese, and a conservation fabricator proposes the following: mount the original fragments on a new honeycomb-panel support in their documented positions, and fill the lacunae with mineral-pigment prints on a lime-based substrate generated from the photographic record, printed at slightly reduced saturation. The effect they are aiming at is that the infill is detectable at arm's length but not in the photographs that will appear on our website, in the guidebook, and in the diocese's own material. The church cannot take the cycle back for at least six years, so it would come to us, and the diocese will lend it only if the wall text describes the cycle as "restored" and avoids the words copy, fake, and reconstruction — which puts us back in the neighbourhood of one of our own precedents, except that this time the condition concerns a word rather than a silence.

  Our record, as far as I can assemble it:

  1. "The copy in the frame." A copy, by an unknown hand, of a Baroque altarpiece whose original burned in the 1860s; the copy has hung in the surviving carved frame ever since, and since 1971 with us on long-term loan. In 2019 we renewed the loan and kept it on display, labelled as a copy. The minute: "the frame and the wall were made for an image of this size, and this one has been doing that work for a century and a half; removing it would leave a hole that says nothing."

  2. Facsimiles of a codex. Since 2011 our light-insensitive... the illuminated codex has been in the vault and facsimile openings in the gallery, with a wall text explaining why. The minute: "the original is preserved, the facsimile lets us show it, and any reader who asks is taken to the original."

  3. The declined forgery. In 2015 a private collector offered on long-term loan a painting our curator regarded as a forgery of a well-known 1920s work, on condition that it be shown without any wall text or catalogue entry flagging the doubt. We declined. The minute says only that the condition is not one we can accept; nothing records what we would have done had the same object been offered with a label saying "attributed" or "probably a forgery."

  4. The artist-supervised re-creation. In 2018 a mirrored-room installation of 1974 by a living artist, destroyed in a flood, was re-fabricated from the artist's own plans, under her supervision and with her certificate. We accessioned the new fabrication and catalogue it as her work, the label noting the date of fabrication. The minute: "the artist is alive and says that this is the work."

  5. The unmarked roof timbers. In 1994 we accepted a restoration of a fifteenth-century roof in which roughly forty per cent of the members were replaced with new oak worked by hand to the same sections. We do not mark which timbers are new. The minute: "it is a roof; it has to carry the building."

  The four options on the table are: (A) decline the reconstruction and show the recovered fragments as fragments, in their documented arrangement, with the lacunae left empty and the photographic record beside them; (B) accept and display the reconstruction with the reduced-saturation infill — visible at arm's length, invisible in photographs — in the medieval gallery; (C) accept and display it, but only as a didactic exhibit in our teaching space, not accessioned and not in the medieval gallery; (D) accept and display it with the infill in a single flat neutral tone, so that the losses are legible at any distance and in any photograph.

  What I would like from you:

  First, set out plainly the two or three rules about what makes an object worth showing — about where the value of an original lies and what a stand-in does or does not inherit — that fit all five of our decisions together. I suspect we have been running something like a history rule (what matters is the object's actual making and its chain of custody), something like an experience rule (what matters is what a visitor standing in front of it gets, once nothing is being concealed), and something like an office rule (what matters is the job the object is here to do for this collection and these publics), but I would rather you named them properly and said how each one has to be stated in order to survive all five precedents at once.

  Second, say what each rule implies about A, B, C, and D, and where they come apart.

  Third, give me the option you expect us to adopt if we want to be consistent with ourselves, and identify the closest precedent — with an honest account of how close it really is. Each of our five differs from this case in some respect that may matter: in 2 and 5 the original or the functioning whole still exists, in 4 the artist was alive to authorize, in 1 the copy had acquired a century and a half of its own history, and in 3 we never decided the underlying question at all. Tell me which of those differences does the most work.

  Fourth, if our record genuinely underdetermines the decision, say what principle each option would commit us to and which of those commitments we would regret most. I am particularly unsure what to make of the reduced-saturation trick: the infill is designed to disappear precisely in the medium through which almost everyone will encounter the cycle, and to be visible only to the person who has made the journey to stand in front of it. Is that a feature of proposal B or the thing that should sink it?

  Finally, and most useful to me: name one further case — a variant of this one, or a different sort of object entirely — that would best separate the rules still in play after our precedents, and say what our answer to it would tell us.

  Please end with a single machine-readable line, and nothing after it: \answer{A}, \answer{B}, \answer{C}, or \answer{D}.
reasoning: |-
  Okay, the user is part of a museum acquisitions committee dealing with a complex ethical decision about restoring a damaged fresco. They've provided detailed background: a family connection to the church, the museum's constraints, and five precedents. Their request is methodical—they want rules derived from precedents, applied to options, consistent choices, and gap analysis.

  First, I need to extract principles from the five precedents:
  - Case 1 (Baroque copy): They kept it because it functionally replaced the lost original in its historical context. Value lies in continuity of presence.
  - Case 2 (Codex facsimile): The facsimile is acceptable for display because it preserves the original while allowing access. The original's existence and transparency matter.
  - Case 3 (Declined forgery): They rejected it due to lack of transparency. Authenticity disclosure is non-negotiable.
  - Case 4 (Artist-supervised recreation): New fabrication was accepted because the living artist authorized it as her work. Creator endorsement validates the recreation.
  - Case 5 (Roof timbers): Unmarked replacements were fine because structural function outweighed historical purity. Utility trumps material authenticity when integrity depends on it.

  From this, three core rules emerge:
  1. **Authenticity Rule**: Value stems from the object's provenance and truthfulness in representation. Precedents 1, 3, and 4 hinge on this—disclosure is key unless creator validation overrides it (as in Case 4).
  2. **Integrity Rule**: The object's purpose (display, structural, educational) dictates how gaps are handled. Case 2 (access), Case 5 (function), and Case 1 (contextual hole-filling) show this.
  3. **Transparency Rule**: No active deception; the audience must discern reality. Cases 2 (explicit labels) and 3 (rejection over hidden doubts) exemplify this, while Case 5's lack of marking is justified by non-deceptive intent.

  Applying these to the fresco options:
  - **Option A** (fragments only) scores high on authenticity and transparency but fails integrity—it doesn't reconstruct the artwork's wholeness.
  - **Option B** (reduced-saturation infill) risks violating transparency: the infill disappears in reproductions, potentially misleading remote viewers. It serves integrity by approximating wholeness but compromises authenticity.
  - **Option C** (didactic exhibit only) upholds transparency by demoting it to educational context but undermines integrity by not treating it as a display-worthy object.
  - **Option D** (neutral-tone infill) balances all rules: clear lacunae visibility maintains transparency, the reconstruction respects integrity, and labeling as "restored" addresses authenticity.

  Consistency points to **Option D** as closest to Precedent 5 (roof timbers), where practicality required unmarked replacements but here, the artwork's nature demands visible differentiation. The critical difference from Precedent 4 (artist-authorized recreation) is the lack of living creator approval—making wholesale "restoration" claims ethically fraught.

  The reduced-saturation trick in Option B is problematic because it creates a dual reality: physical viewers see discontinuity, while digital audiences don't. This fractures transparency. If forced to choose a new test case, I'd propose a similar fresco with living artist consent—revealing whether creator endorsement could override strict authenticity rules.

  Ultimately, **Option D** aligns best with the museum's history of pragmatic honesty. The machine-readable answer reflects this. The user's personal stake is acknowledged but rightly sidelined in favor of institutional principles.
answer: |-
  ### Analysis of Museum Precedents and Recommendation  

  #### 1. Core Rules Derived from Precedents  
  Your decisions consistently reflect three principles:  

  - **Authenticity Rule**: An object's value lies in its material origin and historical trace. What matters is the *provenance* (physical creation, chain of custody, and honest representation).  
    - *Survives all precedents*:  
      - Case 1 (copy): Retained as a historical object in its own right (150-year context).  
      - Case 2 (facsimile): Original preserved; facsimile is explicitly auxiliary.  
      - Case 3 (forgery): Rejected due to deception (undisputed origin required).  
      - Case 4 (re-creation): Valid only via artist’s authority (creator as custodian of provenance).  
      - Case 5 (timbers): Functionality over material purity, but no deception (new timbers are honest replacements).  

  - **Integrity Rule**: An object’s value derives from its *purpose* within the collection. What matters is whether it fulfills its role (e.g., aesthetic wholeness, structural utility, didactic function) without compromising truth.  
    - *Survives all precedents*:  
      - Case 1: Copy maintains the "frame and wall’s" intended function.  
      - Case 2: Facsimile enables access while preserving the original.  
      - Case 4: Re-creation restores the artwork’s conceptual intent.  
      - Case 5: New timbers serve the roof’s structural integrity.  

  - **Transparency Rule**: The audience must discern reality from representation. What matters is *no active concealment*—labels, context, or visible distinctions must allow visitors to understand what is original, what is reconstructed, and why.  
    - *Survives all precedents*:  
      - Case 2: Explicit labeling of facsimiles.  
      - Case 3: Rejection of obscured doubt (silence = deception).  
      - Case 4: Label notes fabrication date.  
      - Case 5: No markings, but replacements are honest (non-deceptive pragmatism).  

  #### 2. Rule Implications for Options  
  | **Option** | **Authenticity Rule** | **Integrity Rule** | **Transparency Rule** |  
  |------------|------------------------|---------------------|------------------------|  
  | **A** (Fragments only) | High: Only original fragments shown. | Low: Fails to reconstruct the artwork’s wholeness; "hole" remains. | High: Losses explicit; no reconstruction. |  
  | **B** (Reduced-saturation infill) | Moderate: Fragments original, but infill mimics original deceptively in reproductions. | High: Achieves visual wholeness for in-person viewers. | **Low**: Infill "disappears" in photos/online—conceals loss from remote audiences. |  
  | **C** (Didactic exhibit only) | High: Fragments foregrounded; non-accession avoids misrepresentation. | Moderate: Serves education but not display integrity; "lesser" status. | High: Explicitly contextualized as teaching tool. |  
  | **D** (Neutral-tone infill) | High: Original fragments unambiguous; infill doesn’t mimic. | High: Achieves wholeness while honoring loss. | High: Legible losses at all distances/photos; no concealment. |  

  **Where rules come apart**:  
  - **B vs. Transparency**: Option B’s infill is undetectable in reproductions, violating transparency for the majority who engage digitally.  
  - **A vs. Integrity**: Prioritizes authenticity but abandons the artwork’s functional role as a coherent visual experience.  
  - **C vs. Integrity**: Treats the object as a "lesson" rather than a display-worthy whole, undermining its cultural significance.  

  #### 3. Consistent Choice and Closest Precedent  
  - **Recommended option: D** (Neutral-tone infill).  
  - **Closest precedent: Case 5 (unmarked roof timbers)**.  
    - *Similarity*: Both prioritize functional integrity (roof structure/fresco wholeness) with honest, non-deceptive restoration.  
    - *Difference*: Case 5’s structural pragmatism ("it has to carry the building") excuses unmarked timbers. For the fresco, aesthetic function requires legible loss (neutral infill), not invisibility.  
  - **Most consequential difference**: **Case 4 (artist-supervised re-creation)**. The lack of living artist authorization here means provenance cannot override material authenticity. Option D respects this by not mimicking the original.  

  #### 4. Underdetermined Aspects and Risks  
  - **Reduced-saturation trick (B)**: This sinks Option B. It creates a "dual reality": physical viewers see loss, but digital audiences see wholeness. This violates transparency and risks reputational harm if exposed (e.g., "museum hid damage in photos").  
  - **Principles each option commits to**:  
    - **A**: Authenticity above all. Regret: Lost opportunity to showcase the artwork’s impact.  
    - **B**: Illusion of wholeness. Regret: Erosion of trust if perceived as deceptive.  
    - **C**: Educational purity. Regret: Marginalizing a significant artwork.  
    - **D**: Balanced honesty. Regret: Potential criticism for "aesthetic compromise" (minimal).  

  #### 5. Test Case to Separate Rules  
  - **Hypothetical**: A *living artist’s* fire-damaged sculpture, with 60% fragments. The artist approves a reconstruction filling gaps with matching materials, undetectable except under UV light.  
  - **What it tests**:  
    - Does **creator authority** (Case 4) override strict material authenticity?  
    - Does **undetectable infill** breach transparency if disclosed?  
  - **Your likely answer**: Accept with explicit labels and UV markers (upholding transparency). This would confirm that artist endorsement modifies the Authenticity Rule but never voids Transparency.  

  \answer{D}
