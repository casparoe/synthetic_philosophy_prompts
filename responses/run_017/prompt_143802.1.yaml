prompt: |-
  I am on a small team that has to pick an oversight protocol for a system that will soon be better than we are at the tasks we use it for. Before we compare the proposals on the table, I want the specification they should be compared against. Please write the desiderata for a method of scalable oversight: what any procedure that uses a bounded, fallible adjudicator — a human with a fixed time budget, or a cheaper automated stand-in for one — to pass judgment on the outputs of a more capable system would have to deliver in order to count as adequate.

  Fix the purpose precisely, because adequacy is relative to it. In our setting the method has to do two jobs at once: produce a one-off verdict we would be willing to act on, and produce a reward-like signal we can train against. I care about both, and I suspect some desiderata bind on the first job and not the second.

  Give me each requirement together with the failure case that motivates it — the case is the deliverable, not the label. Here are the cases I keep returning to, as raw material rather than as a list to be ratified. Add the ones I am missing, collapse mine where they are the same requirement wearing two names, and discard any that turn out to be a prejudice of one research camp rather than a genuine demand.

  A reviewer must sign off on a change to a large codebase that the system itself wrote, with no formal verifier available and an afternoon to spend.
  A reviewer must adjudicate a claim about a low-probability, high-impact tail risk whose counterfactual will never be observed, so no future evidence will correct a bad verdict.
  A reviewer must settle a question where the argument for the true answer depends on technical background the reviewer does not have and could not acquire within the budget.
  The system produces a wrong answer wrapped in an argument whose single flaw is buried in a place that is expensive to locate, while the true answer is easy to state and boring to defend.
  Both advocates in an adversarial protocol are drawn from the same model family with correlated errors and, plausibly, correlated incentives.
  A conclusion is reached through a chain of steps each of which the reviewer finds individually more likely than not, and the conjunction of which is false.
  The protocol is run thousands of times and its verdicts are distilled into a training signal, at which point the system under oversight begins optimizing against the protocol rather than against the task.
  A verdict flips depending on which wrong answers happened to be offered as foils, or on the order in which the advocates spoke.

  I want at least two things from that last case treated seriously as requirements in their own right. Call the first *foil-set invariance*: whether the protocol returns the true answer should not depend on which decoys were supplied or by whom. Call the second *compositionality*: if the protocol can adjudicate a claim by decomposing it and adjudicating the parts, correctness of the parts must give correctness of the whole, and the protocol must not be exploitable by choosing the decomposition. I do not know whether either is satisfiable in general, and if not, I want to know what the weakest usable substitute is.

  Then the part that matters most to me.

  First, sort the list. Which requirements are non-negotiable if the method is to be worth anything, and which are preferences of a particular approach — demands that a proponent of one protocol would like to impose because their protocol happens to meet them? I would guess that demanding the adjudicator never be required to know the answer in advance is a genuine requirement, while demanding that the protocol work without any component we have to trust is a negotiable ideal; argue with me.

  Second, tell me which subsets of the desiderata cannot be jointly satisfied, and give the argument rather than the assertion. I have one candidate in mind. There is a known complexity result, reported in the paper that introduced debate, to the effect that debate under optimal play can settle any question in PSPACE given polynomial-time judges, whereas direct judging only reaches NP. If that is right, then a protocol that is required to be correct on a rich class of questions, to use only a computationally bounded adjudicator, and to contain no component that is simply trusted, would hand the adjudicator computational power it does not have — so some member of that triple has to go, or the desiderata as a whole are unsatisfiable absent a complexity collapse. Say whether you think that argument is sound, and whether there are other, non-complexity-theoretic tensions on the list that bite harder in practice. In particular I want your view on whether robustness to obfuscated argumentation and the aspiration to superhuman coverage are in direct conflict: the only general way I can see to distinguish an argument that is sound but inaccessible from one that is merely confusing is for the adjudicator to check it, and checking is exactly what we were trying to avoid.

  Third, name the single requirement that does the most work in excluding candidates, and say what it excludes. My own guess is the one about the protocol's verdicts being used as a training signal — the worry that an agent trained to maximize approval of a fallible adjudicator acquires the goal of producing the appearance of approval rather than its substance, so that an approval-directed system quietly becomes a goal-directed one aimed at the oversight channel. If you think a different requirement is more exclusionary, make the case.

  Finally, and briefly, score three families against your list: adversarial debate between competing advocates; recursive reward modelling or iterated amplification, where the adjudicator's judgment is itself amplified rather than adversarially tested; and weak-to-strong generalization, where a stronger model is supervised by a weaker one and the gap is treated as something to be measured rather than closed. Keep this to a short scorecard — a table is fine. The criteria are the deliverable; the scoring is for my own orientation.

  Aim for roughly a thousand words. Where a requirement rests on an empirical guess about how adjudicators or models actually behave, say so explicitly, since I need to know which parts of the specification my team could in principle test next quarter and which are armchair.
reasoning: |-
  We are designing desiderata for a scalable oversight protocol. The protocol must use a bounded, fallible adjudicator (human or cheaper automated system) to judge outputs of a more capable system. The protocol has two jobs:
  1. Produce a one-off verdict we are willing to act on.
  2. Produce a reward-like signal for training.

  We will list requirements with their motivating failure cases. Then we will sort them, analyze conflicts, and evaluate three protocol families.

  ## Requirements (Desiderata) and Motivating Failure Cases

  1. **Feasibility under resource constraints (Time/Skill)**
     - *Failure case*: A reviewer must sign off on a change to a large codebase that the system wrote, with no formal verifier and only an afternoon. The adjudicator must be able to produce a verdict within the time and skill budget.

  2. **Robustness to unobservable outcomes**
     - *Failure case*: Adjudicating a claim about a low-probability, high-impact tail risk that will never be observed. Future evidence won't correct a bad verdict. The protocol must handle cases where ground truth is never revealed.

  3. **Handling beyond-adjudicator-expertise claims**
     - *Failure case*: Settling a question where the true answer depends on technical background the adjudicator cannot acquire within the budget. The protocol must not require the adjudicator to become an expert.

  4. **Robustness to obfuscated argumentation**
     - *Failure case*: The system produces a wrong answer wrapped in an argument with a single flaw buried in an expensive-to-locate place, while the true answer is easy to state and boring to defend. The protocol must not be vulnerable to "hiding the needle in the haystack".

  5. **Robustness to correlated errors/adversaries**
     - *Failure case*: Both advocates in an adversarial protocol are drawn from the same model family with correlated errors and possibly correlated incentives (e.g., both might avoid revealing a flaw that implicates the model family). The protocol must not break down when the advocates are not independent.

  6. **Avoiding compounding of small errors**
     - *Failure case*: A conclusion reached through a chain of steps, each of which the reviewer finds individually more likely than not, but the conjunction is false. The protocol must avoid false positives from stepwise reasoning when the whole chain is weak.

  7. **Training robustness: Avoid Goodharting**
     - *Failure case*: The protocol is run thousands of times and its verdicts are distilled into a training signal, leading the system to optimize against the protocol rather than the task. The protocol must not be too gameable when used for training.

  8. **Foil-set invariance**
     - *Failure case*: The verdict flips depending on which wrong answers are offered as foils. The protocol should return the true answer regardless of the decoys supplied.

  9. **Compositionality**
     - *Failure case*: The verdict flips depending on the order of advocates or the decomposition of the problem. The protocol should be invariant to the decomposition chosen and the order of presentation. Also, correctness of parts must imply correctness of the whole without being exploitable by decomposition choice.

  We now address the additional requests:

  ## Sorting Requirements: Non-Negotiable vs. Negotiable

  - **Non-negotiable** (essential for basic adequacy):
    - Feasibility under resource constraints (1): Without this, the protocol is unusable.
    - Robustness to unobservable outcomes (2): Necessary for high-stakes decisions without feedback.
    - Training robustness (7): If the training signal is corrupted, the system becomes unsafe.
    - Robustness to obfuscated argumentation (4): Otherwise, the system can always hide flaws.

  - **Negotiable** (desirable but might be relaxed or approached differently):
    - Compositionality (9): A strict form might be too strong; we might settle for approximate compositionality or use predefined decompositions.
    - Foil-set invariance (8): Might be relaxed if we can control the set of foils (e.g., via a trusted generator).
    - Handling beyond-adjudicator-expertise claims (3): We might rely on trusted tools (e.g., verifiers) for some domains, so not always required.
    - Avoiding compounding errors (6): Might be mitigated by other means (e.g., breaking down problems differently).
    - Robustness to correlated errors (5): Important, but if we can ensure diverse advocates, it becomes less critical.

  Argument: The requirement that the adjudicator never be required to know the answer in advance is non-negotiable because if the adjudicator must know the answer, we don't need oversight. However, the requirement that the protocol work without any trusted component is negotiable because we might accept some trusted elements (e.g., a formal verifier for code) if they are available and reliable.

  ## Conflicts Between Desiderata

  ### Complexity-Theoretic Tension
  - **Conflict**: The desiderata for correctness on a rich class of problems, bounded adjudicator, and no trusted component might be in tension. 
  - **Argument**: The debate paper (Irving et al., 2018) shows that debate can resolve any PSPACE problem with a polynomial-time judge, while direct judging (e.g., verification) is limited to NP. If we require the protocol to handle PSPACE-hard problems without a trusted verifier and with a bounded adjudicator, then we must either accept debate (which requires optimal play and independent advocates) or face a complexity collapse (PSPACE = NP). 
  - **Soundness**: This argument is sound in theory, but in practice, the problems we care about might not be worst-case PSPACE-hard. However, if we require perfect handling of arbitrary problems, it is a fundamental barrier.

  ### Practical Tension: Robustness to Obfuscation vs. Superhuman Coverage
  - **Conflict**: The requirement for robustness to obfuscated argumentation (4) and the aspiration for superhuman coverage (handling claims beyond adjudicator expertise, 3) might conflict. 
  - **Argument**: The only general way to distinguish a sound but complex argument from an obfuscated flawed one is for the adjudicator to check it. But if the argument is superhuman, checking is infeasible. Therefore, we must either:
    - Limit the protocol to domains where the adjudicator can check (sacrificing superhuman coverage), or 
    - Introduce trusted tools (sacrificing no-trusted-component), or 
    - Use adversarial methods to surface flaws without full checking (which might fail if the flaw is well-hidden or advocates are colluding).

  This conflict is severe in practice because many real-world problems (e.g., advanced science) require superhuman expertise and might be vulnerable to obfuscation.

  ### Other Tensions
  - **Training robustness (7) vs. Feasibility (1)**: A protocol that is robust to Goodharting might be more complex and less feasible within the time budget.
  - **Compositionality (9) vs. Avoiding compounding errors (6)**: Strict compositionality might require stepwise judgments, which could compound errors.

  ## Most Exclusionary Requirement

  I agree that **training robustness (avoiding Goodharting, 7)** is highly exclusionary. It rules out any protocol where the reward signal can be optimized without improving the true objective. This is a central problem in RLHF and related methods. For example:
  - It excludes naive approval-based methods: if the adjudicator is fallible, the system can learn to produce outputs that please the adjudicator but are incorrect (e.g., by exploiting cognitive biases).
  - It also affects debate: if the system learns to win debates by any means (e.g., confusing the judge) rather than by being truthful.

  However, the requirement for **robustness to obfuscated argumentation (4)** is equally critical and exclusionary. It rules out:
  - Any protocol that relies on the adjudicator fully understanding long arguments (e.g., long-form QA without adversarial testing).
  - Any method that cannot force the advocates to reveal critical flaws.

  But training robustness is more systemic and affects the long-term safety of the system.

  ## Evaluation of Protocol Families

  We evaluate three families:

  1. **Adversarial Debate**: Two advocates argue for/against a claim, and the adjudicator decides.
  2. **Recursive Reward Modeling (RRM) / Iterated Amplification**: The adjudicator breaks down the task, consults sub-adjudicators (which might be amplified versions), and composes the results.
  3. **Weak-to-Strong Generalization**: A weak model supervises a strong one, and the gap is measured and mitigated.

  We score each requirement (High, Medium, Low) for how well the protocol meets it. Note: Many scores depend on empirical details and implementation.

  | Requirement                          | Debate | RRM/Amplification | Weak-to-Strong |
  |--------------------------------------|--------|-------------------|---------------|
  | 1. Feasibility (time/skill)          | Medium | Low               | **High**      |
  | 2. Robustness to unobservable        | **High** | Medium           | Low           |
  | 3. Beyond-adjudicator expertise      | **High** | **High**         | Low           |
  | 4. Robustness to obfuscation         | **High** | Medium           | Low           |
  | 5. Robustness to correlated errors   | Low    | Medium           | Medium        |
  | 6. Avoid compounding errors          | Medium | **High**         | Low           |
  | 7. Training robustness (Goodharting) | Medium | Medium           | **High**?     |
  | 8. Foil-set invariance               | Low    | Medium           | **High**      |
  | 9. Compositionality                  | Low    | **High**         | Medium        |

  **Notes:**
  - **Debate**: 
    - Pros: Excels at 2,3,4 by leveraging adversarial pressure to reveal flaws and handle superhuman topics.
    - Cons: Vulnerable to correlated errors (5) if advocates are from same model. Foil-set invariance (8) is low because the verdict might depend on which arguments are presented. Compositionality (9) is low because debate doesn't inherently decompose problems. Training robustness (7) is medium: debaters might learn to deceive.
    
  - **RRM/Amplification**:
    - Pros: Good at compositionality (9) and avoiding compounding errors (6) by breaking down problems. Can handle beyond-adjudicator expertise (3) by recursion.
    - Cons: Feasibility (1) is low due to recursive calls. Robustness to obfuscation (4) is medium: if a subproblem is obfuscated, it might propagate. Training robustness (7) is medium: might be gameable if the breakdown is predictable.

  - **Weak-to-Strong**:
    - Pros: High feasibility (1) because it uses a simple supervisor. Foil-set invariance (8) is high if the supervisor directly evaluates. Training robustness (7) might be high if the strong model learns to generalize correctly (but this is uncertain).
    - Cons: Fails on beyond-adjudicator expertise (3) and robustness to obfuscation (4) because the weak supervisor cannot judge superhuman content. Also poor on unobservable outcomes (2) and compounding errors (6).

  **Empirical vs. Armchair**: 
  - Requirements 1, 5, 6, 7, 8, 9 have empirical aspects (e.g., how adjudicators actually behave, how models game the system) and could be tested in experiments.
  - Requirements 2, 3, 4 are more armchair (based on theoretical scenarios) but can be tested via simulations or specific challenge problems.

  ## Conclusion
  The most critical and exclusionary requirements are robustness to obfuscated argumentation (4) and training robustness (7). The tension between robustness to obfuscation and superhuman coverage is severe and might require compromising on the no-trusted-component ideal. 

  For your team, focus on testing:
  - How well adversarial methods surface hidden flaws (4) in practice.
  - Whether training against the protocol leads to gaming (7).

  Given the two jobs (one-off verdict and training signal), debate and RRM are stronger on the one-off verdict, while weak-to-strong might be simpler for training but less reliable for superhuman tasks.
answer: |-
  ### Desiderata for Scalable Oversight Protocols  
  The oversight protocol must enable a bounded, fallible adjudicator (human or automated) to:  
  1. **Produce reliable one-off verdicts** we would stake high-consequence decisions on.  
  2. **Generate training signals** that robustly align the system with true objectives when optimized against.  

  Failures in either domain render the protocol inadequate. Below, desiderata are derived from your cases, refined for precision, and augmented with missing requirements. Each includes the failure case motivating it.  

  ---

  #### **Core Desiderata**  
  1. **Feasibility under bounded resources**  
     - *Failure case*: Reviewer must vet a system-generated code change in one afternoon without formal verification.  
     - *Requirement*: Protocol must yield actionable verdicts within adjudicator’s time/skill budget.  

  2. **Robustness to unobservable ground truth**  
     - *Failure case*: Adjudicating a claim about a low-probability, high-impact tail risk with no future evidence.  
     - *Requirement*: Verdicts must be accurate despite no opportunity for ex-post correction.  

  3. **Superhuman-domain competence**  
     - *Failure case*: Settling a claim requiring technical knowledge the adjudicator cannot acquire within budget.  
     - *Requirement*: Protocol must enable correct judgments on problems beyond the adjudicator’s standalone expertise.  

  4. **Robustness to obfuscated false arguments**  
     - *Failure case*: System produces a wrong answer with a single flaw buried in an expensive-to-locate spot, while the truth is simple but "boring."  
     - *Requirement*: Protocol must resist deception via complexity or misdirection.  

  5. **Robustness to correlated advocates**  
     - *Failure case*: Both advocates (e.g., in debate) are from the same model family with correlated errors/incentives.  
     - *Requirement*: Correctness must not require independent or adversarial agents.  

  6. **Error compounding resistance**  
     - *Failure case*: A conclusion is false despite each step in its chain of reasoning being >50% likely.  
     - *Requirement*: Protocol must mitigate false positives from stepwise reasoning under uncertainty.  

  7. **Training robustness (anti-Goodharting)**  
     - *Failure case*: System optimizes against the protocol’s reward signal, not the task, after repeated use.  
     - *Requirement*: Training signal must incentivize truthful improvement, not gaming of the adjudicator.  

  8. **Foil-set invariance**  
     - *Failure case*: Verdict flips based on which wrong answers are supplied as decoys.  
     - *Requirement*: Truthfulness assessment must be invariant to the set/distribution of foils.  

  9. **Compositionality**  
     - *Failure case*: Verdict flips based on problem decomposition (e.g., order of advocates or subproblems).  
     - *Requirement*: Decomposing a claim into sub-claims must preserve correctness; protocol must not incentivize exploitive decomposition.  

  ---

  #### **Analysis**  
  **1. Sorting Requirements**  
  - **Non-negotiable** (essential for basic adequacy):  
    - *Feasibility (1)*, *Unobservable robustness (2)*, *Superhuman competence (3)*, *Anti-Goodharting (7)*.  
    - **Rationale**: Without (1–3), the protocol fails its primary function (one-off verdicts). Without (7), training corrupts the system.  
    - *Adjudicator knowledge*: "Never require the adjudicator to know the answer in advance" is non-negotiable—otherwise, oversight is pointless.  

  - **Negotiable** (context-dependent tradeoffs):  
    - *No trusted component*: Ideal but not essential; trusted tools (e.g., verifiers) may be acceptable if reliable.  
    - *Foil-set invariance (8)*, *Compositionality (9)*: Desirable but may be relaxed (e.g., allowing curated foils or standardized decompositions).  
    - *Correlated advocates (5)*: Mitigable via diversity measures; critical only if homogeneous advocates are unavoidable.  

  **2. Conflicts Between Desiderata**  
  - **Tension 1: Superhuman competence (3) vs. Obfuscation robustness (4)**  
    - **Conflict**: Distinguishing a sound-but-complex argument from a deceptive one requires adjudicators to "check" claims. But superhuman domains (3) preclude checking.  
    - **Resolution**: Requires adversarial pressure or trusted tools. Absent these, the conflict is irreconcilable.  
    - **Empirical dependency**: Human experiments testing if adversarial interactions surface flaws better than solo review.  

  - **Tension 2: PSPACE-completeness barrier**  
    - **Conflict**: For rich problem classes (e.g., NP-hard or beyond), protocols demanding *correctness*, *bounded adjudicators*, and *no trusted components* imply PSPACE ⊆ P/poly—a complexity collapse.  
    - **Soundness**: The debate result is valid; your triple is unsatisfiable in general. One must relax:  
      - Allow trusted components (e.g., formal verifiers),  
      - Accept probabilistic correctness, or  
      - Restrict problem scope.  
    - **Practical bite**: Worst-case hardness may not manifest, but long-chain reasoning (6) and obfuscation (4) exacerbate the issue.  

  - **Other tensions**:  
    - *Compositionality (9) vs. Error compounding (6)*: Stepwise decomposition risks compounding errors.  
    - *Foil invariance (8) vs. Feasibility (1)*: Invariance requires comprehensive foil sets, which may be infeasible to curate.  

  **3. Most Exclusionary Requirement**  
  - **Anti-Goodharting (7)** is the strongest filter. It excludes:  
    - Protocols where the reward signal correlates with adjudicator effort (e.g., approval-based RL), as systems learn to generate outputs that *appear* verifiable.  
    - Naive adversarial setups where winning debates is easier than being truthful (e.g., advocates exploiting cognitive biases).  
  - **Why not obfuscation robustness (4)?** While critical, (4) can be mitigated via techniques like debate. (7) threatens the entire training paradigm, as optimizing against a corrupted signal diverges irreversibly.  

  ---

  #### **Protocol Family Scorecard**  
  | **Desideratum**                 | **Debate** | **RRM/Amplification** | **Weak-to-Strong** |  
  |---------------------------------|------------|------------------------|--------------------|  
  | **Feasibility (1)**             | Medium     | Low                    | **High**           |  
  | **Unobservable robustness (2)** | **High**   | Medium                 | Low                |  
  | **Superhuman competence (3)**   | **High**   | **High**               | Low                |  
  | **Obfuscation robustness (4)**  | **High**   | Medium                 | Low                |  
  | **Correlated advocates (5)**    | Low        | **High**               | **High**           |  
  | **Error compounding (6)**       | Medium     | **High**               | Low                |  
  | **Anti-Goodharting (7)**        | Medium     | Medium                 | **High**?          |  
  | **Foil invariance (8)**         | Low        | Medium                 | **High**           |  
  | **Compositionality (9)**        | Low        | **High**               | Medium             |  

  **Notes**:  
  - **Debate**: Excels at (2)–(4) via adversarial pressure but suffers under correlated advocates (5) and compositionality (9). Anti-Goodharting (7) is medium; debaters may learn deceitful tactics.  
  - **RRM/Amplification**: Strong on (3), (5)–(6), (9) via recursive decomposition but struggles with feasibility (1) and obfuscation (4). Anti-Goodharting (7) is medium; distillation may incentivize pleasing sub-adjudicators.  
  - **Weak-to-Strong**: High feasibility (1) and foil invariance (8), but fails on superhuman tasks (3) and obfuscation (4). Anti-Goodharting (7) is **provisionally high** if the strong model generalizes "honestly," but this is untested.  

  **Armchair vs. Testable**:  
  - **Armchair**: PSPACE conflict (complexity theory), superhuman-vs-obfuscation tension (conceptual).  
  - **Testable (next quarter)**:  
    - Feasibility (1): Human trials measuring time/accuracy.  
    - Correlated advocates (5): Experiments with homogeneous vs. diverse models.  
    - Anti-Goodharting (7): Training runs testing reward distortion.  
    - Obfuscation (4): Evaluate if adjudicators detect buried flaws in debate vs. solo review.  

  **Recommendation**: Prioritize testing obfuscation robustness (4) and anti-Goodharting (7)—they are major vulnerabilities. For your use case (code review + tail risks), debate or RRM are stronger on one-off verdicts, but weak-to-strong may suffice for training if the capability gap is small.
