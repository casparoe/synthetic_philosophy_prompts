prompt: |-
  My friend Priya has been writing a tiny advice column for expats and long-stay travelers for about six years — people write in with "is it rude if I..." questions — and she's not a philosopher (she used to run warehouses or something), but her verdicts on everyday-convention stuff are more consistant than anything I've read by actual philosophers on it. As best I can reconstruct her track record: not tipping at a US sit-down restaurant where staff are legally paid a sub-minimum wage is really wrong, because you sat down knowing the menu price wasn't the whole price; not tipping at a Tokyo ramen counter is obviously fine, and a tourist who insists on tipping there is doing something mildly wrong — her word was something like colonizing, dragging your own script into a place that didn't ask for it. Cutting the line at a Philadelphia bakery: wrong. Shoving into the scrum at a bus stop in a city that genuinely has no line: fine, there's no convention there to break. Jaywalking across a dead-empty street at 1am: fine. Jaywalking across the same kind of street in a city where pedestrians reliably wait for the signal, with a kid standing there watching: wrong, she said something about what you're teaching. Standing on the left of a London escalator: wrong, and she added that she personally thinks the stand-right convention is dumb and probably unsafe, but that's not the point. Taking a phone call in an Amtrak quiet car: wrong, and — this is the one that got me — still wrong if the person next to you isn't actually bothered. Two limit cases: in a shoes-off house where the host says please keep your shoes on, we truly don't care, she said keep them on, the waiver is real; and for a guy whose office expects everyone to stay till 7, she said that's a labor problem and not an obligation, you're allowed to erode it.

  Here are three cases I want her ruling on, and I can't tell which of her principles is supposed to govern them. (1) My sister is spending a week in a mid-sized city in southern Europe where, until maybe five years ago, nobody tipped; locals still don't tip at neighborhood places, but in the tourist center the last few years of American and British visitors leaving 15-20% have created a real expectation, and it's an expectation that runs only toward foreigners — and the locals Priya's readers quote are annoyed about it, they think visitors are importing a two-tier custom and giving restaurants cover to cut base pay. So my sister sits down at a tourist-center place: does she owe a tip? She's literally the kind of person the expectation was built out of, she knows about it, she takes the service, and paying feeds a norm the locals resent. Does it change anything if she's the first foreigner of the season versus the ten-thousandth, or if the person serving her is the owner's daughter versus someone whose hourly was quietly cut because management now counts tips? (2) The one I actually find interesting: a norm nobody endorses. An office where every person stands when the regional director walks in, and every person privately thinks it's humiliating and wrongly believes everyone else expects it; a consultant visiting from another branch stays seated. Wrong, fine, or neither — and does it matter that no one accepts the norm, or is "real regularity, everyone expects it" the end of the matter for her? (3) A café where regulars rinse their cup and put it on a specific shelf; visitors leave theirs on the table and get silently resented but are never told. Has the visitor done anything wrong, and does it matter that they couldn't have found out?

  I don't just want the verdicts, I want the rule. My guesses at what she's running: something about expectations you create by opting in; something about free riding on everyone else's compliance; something about what nonconformance expresses, contempt or obliviousness or a refusal to treat locals as authorities on their own shared life; and something like extra deference owed by guests — but maybe she's actually running separate rules for coordination conventions, conventions that transfer small amounts of money, and deference rituals, and just hasn't said so. Give me your best guess at her answer on each of the three with the reason, tell me which candidate principles fit her whole track record roughly equally well and exactly where they come apart, and be honest if her past verdicts genuinely underdetermine these cases — and if they do, say what principle she'd be committing herself to by going each way. And since I'm seeing her for dinner next week: name one further case I should pose that would separate the surviving rules, the one where they'd definately have to diverge.
reasoning: |-
  Okay, let's unpack this query. The user has a friend Priya who gives consistently sensible judgments on social conventions, and they want to apply her implicit principles to three new cases. The user also wants to reverse-engineer Priya's underlying ethical framework and test its boundaries.

  First, I need to analyze Priya's track record. Her past rulings suggest several possible principles: 
  - The "opt-in obligation" (e.g., US tipping where prices are intentionally incomplete) 
  - The "script colonization" taboo (e.g., not tipping in Tokyo) 
  - The "convention creation" effect (e.g., tourist-driven tipping creating two-tier systems) 
  - The "expressivism" factor (e.g., jaywalking with a child watching) 
  - The "harmless violation" puzzle (e.g., quiet car phone call bothering no one) 
  - The "host waiver" exception (e.g., shoes-off house saying keep shoes on)

  Now for the three cases:
  The tipping dilemma in Southern Europe is fascinating because it pits "fulfilling expectations you helped create" against "rejecting harmful norm imports." Priya would likely say no tip - because the sister didn't opt into this artificial system, and tipping now actively harms locals. The server's status (owner's daughter vs underpaid worker) matters only if the sister's action directly affects that specific person's livelihood.

  The office standing ovation case tests whether empty rituals deserve compliance. Here Priya would probably endorse the consultant staying seated - since the norm lacks moral weight and collective insincerity nullifies its authority. The key is that no one actually believes in the ritual.

  The café cup-washing scenario examines invisible conventions. Priya would likely say the visitor did nothing wrong - conventions must be reasonably knowable. The regulars' silent resentment is their problem for not communicating.

  What's illuminating is how these cases reveal Priya's hierarchy of principles: Harm prevention > opt-in integrity > reasonable knowability > empty ritual compliance. The quiet car ruling (violation wrong even if harmless) seems contradictory until you see it as Priya valuing system integrity over individual impact.

  For a diagnostic test case, I'd propose: A foreigner in Kyoto avoids eating while walking because locals disapprove, despite no signs/rules. But when alone in an alley, they eat a sandwich unseen. If Priya says "still wrong," she prioritizes internalized respect; if "fine," she focuses on observable impact. That splits her potential principles cleanly.

  The user's deep need here is philosophical clarity - they want to systematize Priya's intuitive wisdom into actionable social ethics. They're also low-key annoyed that a warehouse manager out-philosophizes academics. There's affectionate rivalry in that dinner challenge!
answer: |-
  Based on Priya's established track record and reasoning patterns, here's the best reconstruction of her underlying principles and their application to your three cases, along with a diagnostic test case:

  **Priya's Core Principles (Reconstructed):**
  1.  **Opt-in Obligation & Script Integrity:** When you voluntarily participate in a system *knowing* its rules rely on specific actions (like US tipping), you incur an obligation to follow those rules. Conversely, imposing your "home script" (e.g., tipping in Tokyo) disrupts the local social fabric and is disrespectful ("colonizing").
  2.  **Reasonable Expectation & Coordination:** Conventions exist to coordinate behavior smoothly. Violating a *known, established, and relied-upon* convention (cutting in line, standing left in London, quiet car) is wrong because it frustrates expectations others reasonably have and disrupts coordination, *regardless of immediate harm* (e.g., quiet car even if no one is bothered *this time* – it erodes the norm everyone relies on). Lack of convention (bus scrum) means no obligation.
  3.  **Expressivism & Social Learning:** Actions convey messages and teach lessons. Violating a norm *in a context where others observe and interpret it* (jaywalking with a kid watching) can express disrespect, encourage disobedience, or erode shared understanding, even if the act itself is harmless.
  4.  **Guest Deference (Limited):** Guests should generally defer to locally established rules *as communicated or clearly observable*. However, this deference has limits – it doesn't extend to harmful labor practices ("eroding" the 7 pm office stay) or override explicit waivers ("shoes on").
  5.  **Harm & Exploitation Focus:** Underlying many judgments is a concern for fairness and preventing harm/exploitation (tipping where base pay is cut, rejecting coercive office norms, not feeding two-tier systems).

  **Applying Priya's Principles to Your Cases:**

  1.  **Southern Europe Tipping:**
      *   **Verdict:** **No, she does not owe a tip.**
      *   **Reason:** This violates Priya's core principles in several ways:
          *   **Not a Legitimate Opt-in:** The sister didn't voluntarily enter a system *known* to require tipping like in the US. This is an *imported, artificial* expectation targeting foreigners.
          *   **Harmful "Colonization":** Tipping actively feeds and reinforces a harmful, two-tier system that locals resent and that gives cover to cut base pay. By tipping, she *is* "dragging her script" into a place that didn't ask for it and causing harm.
          *   **Expressivism:** Tipping signals acceptance of this unfair system to both the restaurant and other tourists, perpetuating it.
          *   **Specific Circumstances:** The server's status (owner's daughter vs. underpaid worker) *could* sway Priya slightly if the sister *knew* the specific server relied on tips due to a base pay cut *and* withholding the tip would directly harm *that individual* in a tangible way that session (e.g., they might get penalized). However, Priya would likely argue the *systemic harm* of perpetuating the norm outweighs the *individual* harm in this specific, artificial context. Being the "first vs. ten-thousandth" tourist is irrelevant – feeding the harmful norm is wrong regardless.

  2.  **The Unendorsed Standing Norm:**
      *   **Verdict:** **It is *fine* for the consultant to stay seated.**
      *   **Reason:** This norm fails the core tests Priya relies on:
          *   **Lacks Moral/Social Weight:** Priya distinguishes between *coordination* conventions (like escalators, lines) and *deference/status* rituals. She clearly finds unearned deference rituals ("humiliating") less compelling, especially when coercive (like the 7 pm stay). This is a deference ritual.
          *   **No Sincere Expectation:** Crucially, "every person privately thinks it's humiliating and wrongly believes everyone else expects it." There is *no* genuine, shared belief in the norm's value or legitimacy. The "expectation" is based on a collective illusion/misunderstanding. Violating it doesn't frustrate anyone's *actual* desire or need for the ritual.
          *   **Expressivism:** Staying seated, if done confidently, might actually express a healthy rejection of an empty, coercive ritual, potentially emboldening others.
          *   **"Real regularity, everyone expects it" isn't the end:** Priya cares *why* the regularity exists and what it *does*. Here, the regularity exists due to fear and misunderstanding, not genuine coordination or respect. It causes harm (humiliation) without benefit. Her ruling on eroding the 7 pm stay suggests she supports challenging harmful, unendorsed workplace norms.

  3.  **The Café Cup Shelf:**
      *   **Verdict:** **The visitor has done *nothing* wrong.**
      *   **Reason:** Priya's core principles require the convention to be reasonably *knowable* or *communicated*:
          *   **Lack of Knowledge:** The visitor "couldn't have found out." There's no sign, obvious cue (like others doing it), or instruction. The convention is invisible to outsiders.
          *   **No Opt-in with Knowledge:** Unlike the US restaurant, the visitor didn't sit down knowing an unstated rule existed that they were expected to follow.
          *   **Not a Coordination Failure:** Leaving the cup on the table doesn't inherently disrupt service or others' experience in the way cutting a line or standing on the left does. The resentment stems from the regulars' unspoken expectations, not a tangible problem caused by the cup's location *at that moment*.
          *   **Expressivism:** The visitor's action expresses obliviousness, not contempt. Obliviousness isn't morally wrong when the convention is genuinely hidden.
          *   **Onus on Host/Regulars:** Priya's emphasis on clear rules (like the shoes-off waiver) suggests she believes the responsibility for communicating non-obvious conventions lies with the locals/in-group, not the visitor. Silent resentment is their failure, not the visitor's violation.

  **Which Principles Fit? Where Do They Diverge?**
  *   **Equally Well-Fitting Principles:** Opt-in Obligation, Reasonable Expectation (for coordination), Expressivism, and Harm Avoidance all play significant roles across Priya's rulings. They often work together.
  *   **Key Divergence Points:**
      1.  **Harmless Disruption vs. Norm Erosion:** The Quiet Car case is crucial. Priya says it's wrong *even if no one is bothered*. This prioritizes **System Integrity / Norm Preservation** and **Reasonable Expectation for Coordination** over immediate, observable harm. This principle explains the quiet car, escalator, and jaywalking-with-a-kid rulings. It *diverges* from a strict "Harm Principle" that would allow the quiet car call if no one was bothered.
      2.  **Coordination vs. Deference Rituals:** Priya treats escalators/queues (coordination for efficiency/safety) differently from standing for a director (deference ritual). The **Purpose/Function** of the convention matters. She's willing to uphold dumb coordination conventions (London escalator) but rejects harmful/unendorsed deference rituals (office standing). This diverges from a pure "Follow the Established Regularity" principle.
      3.  **Knowability:** The Cup Shelf case highlights that **Reasonable Access to the Rule** is a prerequisite for obligation. This diverges from a principle demanding visitors magically intuit all local customs.

  **Underdetermination?**
  Priya's past rulings *do* provide strong guidance for Cases 1 (No Tip) and 3 (Cup: Not Wrong). The core principles (rejecting harmful imported norms, requiring knowability) are clear.

  Case 2 (Standing) is the most interesting and *slightly* underdetermined by *exact* precedent. While rejecting the 7 pm stay is analogous, it's a labor issue. The escalator ruling shows upholding a convention she thinks is dumb. However, the *combination* of factors in Case 2 – it's a deference ritual, universally unendorsed, based on misunderstanding, and potentially humiliating – strongly points towards "fine to stay seated." Ruling otherwise would require Priya to prioritize "mere regularity" above all else, which her other rulings (especially rejecting the 7 pm stay, emphasizing the *why* in Tokyo tipping) suggest she does not.

  **Diagnostic Test Case to Separate Principles:**
  **The Case:** A visitor is in a city famous for its serene public gardens. A *very* well-known, unwritten local norm, frequently mentioned in respectful travel blogs (but not posted in the gardens themselves), is absolute silence – no talking, even whispering. The visitor finds a completely deserted, secluded corner of a large garden, hidden by dense hedges. Certain they are utterly alone and unseen, they take a 2-minute whispered phone call. *Is this wrong?*

  *   **Why it Separates Principles:**
      *   **System Integrity / Norm Preservation (Quiet Car Principle):** Would say **Wrong.** Violating the core norm (silence) erodes the shared understanding and expectation that defines the space, even if undetected. Like the quiet car, the rule exists for the environment, not just to avoid bothering specific individuals at specific times.
      *   **Harm Principle / Reasonable Expectation (with Observation):** Would say **Fine.** There is zero disruption, no one to observe, no message sent, no expectation frustrated in that moment. The norm's purpose (serenity) is completely undisturbed. The "knowability" factor is high (famous norm, blogs), but the violation has zero impact.
      *   **Expressivism:** Would likely say **Fine** (no one to express anything to) or *maybe* **Wrong** (if arguing it expresses self-centeredness *to oneself* or violates a duty to the *spirit* of the place, but this is weaker).

  **Priya's Likely Answer (Prediction):** She'd likely say **Wrong**, aligning with the System Integrity principle she demonstrated in the quiet car. The norm defines the shared space; violating it privately still disrespects that shared construct and weakens the individual's own commitment to it, potentially making future violations (even small ones) more likely. This would confirm System Integrity as a core, independent principle for her, distinct from immediate harm or expressivism to others.

  Enjoy your dinner with Priya! This test case should spark a fascinating debate and reveal whether System Integrity trumps all, or if context (like total privacy) creates an exception. Good luck!
