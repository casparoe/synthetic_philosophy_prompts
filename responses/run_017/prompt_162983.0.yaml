answer: |-
  ## The Index Speaks  
  *(after W. H. Auden)*  

  I am no measure of the soul’s deep **BUDGET**,  
  Nor what the heart might hoard beyond the **BUNDLE**.  
  I do not say *why* you incline to **CHOOSE**,  
  Only the sequence: this before that **NUMBER**.  
  I trace the footprints of your fixed **ORDER**,  
  Silent on *how much* you might **WANT**.  

  You show me, price by price, the things you **WANT**—  
  Not in confession, but constrained by **BUDGET**.  
  I map the path your settled choices **ORDER**:  
  From this known point to that acquired **BUNDLE**,  
  Assigning just position, not a **NUMBER**  
  That claims to weigh the cost behind your **CHOOSE**.  

  Observe: if in one market you **CHOOSE**  
  X over Y, affordably offered, **WANT**  
  Cannot then claim Y when X's **NUMBER**  
  Shines bright within a cheaper **BUDGET**  
  Without denying sense. Your grasped **BUNDLE**  
  Reveals the rule, the strict **ORDER**.  

  So I construct a chain, link after **ORDER**,  
  From every purchase that you **CHOOSE**.  
  I count the goods within each **BUNDLE**,  
  Track paths of trade for what you **WANT**,  
  But only where the tested **BUDGET**  
  Has let your preference state its **NUMBER**.  

  And yet… if you should weigh like stone a **NUMBER**,  
  Say “Good A first, *then* B defines my **ORDER**,  
  Ignoring all proportion, cost, or **BUDGET**—  
  A lexicographic will to **CHOOSE**—  
  No scale of mine could show the depths you **WANT**,  
  Though I still fit the surface of your **BUNDLE**.  

  For I extrapolate only the seen **BUNDLE**,  
  And where your hand has pointed, place a **NUMBER**.  
  Beyond the lattice of your tested **WANT**,  
  In realms of price untried, no fixed **ORDER**  
  Holds true. I cannot say how you would **CHOOSE**  
  When shadows fall outside the known **BUDGET**.  

  *What you **WANT** / what you are—I am neither **NUMBER**.*  
  *Beyond the mapped **BUNDLE**, choice dissolves. I **CHOOSE***  
  *Silence. The blank **BUDGET** holds no **ORDER**.*

  ---

  **Mapping the Requirements:**

  1.  **Ordinality / No Intensity:** Line 4: "Assigning just position, not a **NUMBER** / That claims to weigh the cost..." directly states the index records only sequence, not magnitude. The tornada line "*What you **WANT** / what you are—I am neither **NUMBER***" reinforces this separation.
  2.  **Evidence & Test (Revealed Preference):** Stanza 4: "Observe: if in one market you **CHOOSE** / X over Y, affordably offered, **WANT** / Cannot then claim Y when X's **NUMBER** / Shines bright within a cheaper **BUDGET**..." explicitly describes the Weak Axiom/GARP condition and its implication for consistency. Line 3: "I trace the footprints of your fixed **ORDER**" implies the revealed relation.
  3.  **The Blind Spot (Lexicographic Order):** Stanza 5: "And yet… if you should weigh like stone a **NUMBER**, / Say 'Good A first, *then* B defines my **ORDER**, / Ignoring all proportion, cost, or **BUDGET**—..." introduces the lex case. Line 6: "...Though I still fit the surface of your **BUNDLE**" confirms consistency hides the non-representability from finite data.
  4.  **The Silence (Unobserved Choices):** Stanza 6: "Beyond the lattice of your tested **WANT**, / In realms of price untried, no fixed **ORDER** / Holds true. I cannot say how you would **CHOOSE** / When shadows fall outside the known **BUDGET**." This explicitly describes the limitation to observed budget sets. The tornada's "Beyond the mapped **BUNDLE**, choice dissolves..." and "The blank **BUDGET**..." reinforce the absence/unpredictability.
