answer: |-
  Here is the consensus document as requested, structured for your reading group's adversarial collaboration. It reflects substantive agreements, precise disagreements, and responses to your cases, while respecting your constraints against citations and reading lists.

  ### 1. Agreed Claims (Signed by Both Members)  
     *Plain English versions for reading aloud; precise formulations in parentheses.*  

     1. **The Liar sentence ("This sentence is not true") is paradoxical under classical logic.**  
        (Precise: Applying classical bivalence and truth rules to the Liar sentence leads to a contradiction that cannot be resolved within an unmodified classical framework.)  

     2. **Classical logic must be revised to address the Liar.**  
        (Precise: Any coherent account of truth requires rejecting or restricting at least one inference rule of classical logic (e.g., bivalence, explosion, or unrestricted T-schema) to accommodate the Liar.)  

     3. **"The Liar has no truth value" and "The Liar is both true and false" are distinct, non-equivalent solutions.**  
        (Precise: The gap theory (no truth value) and glut theory (both true and false) are mutually exclusive semantic accounts with different logical consequences.)  

     4. **Neither solution implies that all reasoning collapses.**  
        (Precise: Both theories retain non-trivial reasoning by restricting *ex falso quodlibet* (gap) or rejecting explosion (glut), preventing arbitrary conclusions from Liar-like sentences.)  

     5. **The Liar sentence is meaningful but pathological.**  
        (Precise: The Liar sentence is grammatically well-formed and semantically evaluable, but its evaluation violates normal truth conditions, making it a self-referential anomaly.)  

  ---

  ### 2. Disagreements Table  
  *(One row per crux; formulations acceptable to each member; test sentences with predictions)*  

  | **Crux Issue** | **Gap Theorist's Wording** | **Glut Theorist's Wording** | **Genuine or Verbal?** | **Underlying Crux** | **Test Sentence** | **Gap Prediction (Self/Other)** | **Glut Prediction (Self/Other)** |
  |----------------|----------------------------|-----------------------------|------------------------|---------------------|-------------------|--------------------------------|--------------------------------|
  | **"Not true" = "False"?** | "Denying truth does not entail asserting falsity; 'not true' expresses absence of truth, not presence of falsehood." | "'Not true' is equivalent to 'false' in a coherent language; denying truth while allowing non-falsity creates indeterminate gaps that license unsupported claims." | **Genuine** | Whether negation must be exhaustive (no third option) or permits partial exclusion. | *Sentence X: "Sentence X is not true."* | **Gap Self:** X has no truth value. **Glut Other:** X is both true and false. | **Glut Self:** X is both true and false. **Gap Other:** X has no truth value. |
  | **The Conditional Box** | "The conditional sentence is vacuously true (as its antecedent is false) but the box contains a falsehood, so all inferences are consistent." | "The conditional sentence is false because it implies the plainly false sentence is true; contradictions arise locally but do not spread." | **Genuine** | How conditionals behave when premises are pathological. | *Box with: (A) "If A is true, then B is true." (B) "Snow is black."* | **Gap Self:** A is true (B false); no issue. **Glut Other:** Glut calls A false and B false. | **Glut Self:** A is false (as B isn’t true), B false. **Gap Other:** Gap calls A true and B false. |
  | **Contingent Liar** | "The plaque sentence lacks a truth value only if inscribed; if another sentence were there, it would be straightforwardly true or false." | "The plaque sentence is both true and false *when inscribed*, but would be simply true if another false sentence were there." | **Genuine** | Whether truth values are fixed by linguistic form or contingent on factual context. | *Card: "The sentence on the plaque at noon is not true." (Plaque ends up with this sentence.)* | **Gap Self:** No truth value (contingent gap). **Glut Other:** Glut calls it a glut. | **Glut Self:** Both true and false. **Gap Other:** Gap calls it gappy. |

  ---

  ### 3. What Would Move Each Member  
  - **Gap Theorist:** "If shown that rejecting bivalence *requires* abandoning classical negation (e.g., that we cannot coherently say 'The Liar is not true' without contradiction), I would reconsider."  
  - **Glut Theorist:** "If shown that accepting true contradictions *systematically* licenses harmful inferences (e.g., in scientific or legal contexts), or that 'glut' is indistinguishable from 'no value' in practice, I would abandon glut theory."  

  ---

  ### Responses to Your Cases  
  *(Both members' verdicts and reasoning)*  
  **(a) Box: ["Exactly one sentence in this box is true", "Snow is white"]**  
  - **Gap:** Neither has a truth value. If the first is true, the second must be false (but snow *is* white). If false, both could be true or both false—but the second is true. Contradiction → both gappy.  
  - **Glut:** Both are true *and* false. The second is classically true but entangled in a paradox. "Exactly one" fails as both sentences are gluts.  

  **(b) Box: ["Most sentences here are not true", "Snow is white", "Snow is black"]**  
  - **Gap:** Sentence 1 has no truth value. Sentences 2 (true) and 3 (false) are classical. "Most" cannot be evaluated due to the gap.  
  - **Glut:** Sentence 1 is both true and false (it is true that most are not true—since 2/3 are classical, but false because it itself is a glut). Sentence 2 true, Sentence 3 false.  

  **(c) "This sentence is not true, and it is not the case that it is neither true nor false."**  
  - **Gap:** This sentence asserts it has a truth value (denying neutrality). But if true, it denies being true; if false, it admits being gappy. Contradiction → no truth value.  
  - **Glut:** Consistent: it is true (it denies being neutral, correctly) and false (it denies being true, correctly). A localized glut.  

  ---

  ### Third Member's Levels Proposal & Purpose of Truth  
  **Why both set aside levels:**  
  Gap and glut theorists agree that *levels* merely relocate the paradox (e.g., "This sentence is not true at any level") and reject fragmenting language. Gap theory handles pathology via *propositional failure*; glut via *contradictory propositions*. Both prioritize a unified language over hierarchies.  

  **Dispute about purpose:**  
  The core disagreement over **"not true = false?"** (Row 1) is about the *purpose of truth-talk*.  
  - Gap theorist sees truth as a tool for *asserting facts*; "not true" should not commit to an alternative.  
  - Glut theorist sees truth as securing *logical exhaustiveness*; "not true" must mean "false" to preserve inferential power.  
  This is not verbal—it reflects competing ideals: **precision in description** (gap) vs. **completeness in reasoning** (glut).  

  ---  
  This document captures the shared ground, the fault lines with testable predictions, and the philosophical stakes. Both signatories can stand by their sections while seeing precisely where their opponent digs in.
