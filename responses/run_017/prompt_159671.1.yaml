answer: |-
  ### Committee Memo: Shortlist Recommendation  
  **Regarding *[Book Title]* by [Author Name]**  
  Prepared for Friday Vote | Confidential Draft  

  ---

  ### 1. Bottom Line (95 words)  
  **Keep the book on the shortlist, but accompany its listing with a brief public note.** The note should state: *"This work is evaluated by the committee as a fictional narrative. Its inclusion does not constitute an endorsement of factual claims within the text."* This preserves artistic evaluation integrity, acknowledges the publisher’s ambiguous framing, and mitigates legal/reputational risk by disengaging the prize from assertions about real individuals. Withdrawal would set a dangerous precedent for censoring artistic ambiguity; silence would ignore legitimate concerns about misrepresentation. The note supplies the missing "frame" without adjudicating truth.  

  ---

  ### 2. The Facts That Matter (245 words)  
  Five details are legally and artistically material:  
  - **Publisher’s Framing Shift**: The hardback’s "A Novel" label established an initial fictional contract. Its removal in the prize-submitted paperback, paired with the "true story" blurb, creates ambiguity about authorial intent. This matters because *our prize rules require submission as fiction*.  
  - **Direct, Named Accusations**: The "sworn statement" chapter targeting an identifiable living person (with verifiable hometown/occupation) moves beyond literary allusion to specific, actionable claims. This invites real-world harm (defamation, harassment) and implicates the prize in amplifying unadjudicated allegations.  
  - **Author’s Contradictory Statements**: Conflicting podcast claims ("everything happened" vs. "all invented") destabilize the work’s ontological status. This undermines appeals to authorial authority when interpreting the text.  
  - **Public Court Records**: Evidence that the business collapse was a "mundane lease dispute" contradicts the book’s narrative of forgery/theft. This factual discrepancy heightens ethical concerns about misrepresentation.  
  - **Unstable Narrative Frame**: The collapsing "editor’s note" device erodes the distinction between fiction and documentary. This artistic choice is relevant to evaluating the work’s merit *as fiction* but complicates reader expectations of truth.  

  **Why other details are secondary**: The author’s name/town/brother matching the narrator is common autofiction; the lawyer’s letter (without suit) signals reputational concern but not imminent legal peril.  

  ---

  ### 3. Frame, Outer, and Inner Messages (450 words)  
  Hofstadter’s model (simplified for our purpose):  
  - **Frame Message**: The meta-signal defining *what kind of object this is* and how to engage it. For a novel: "This is artifice; do not map statements directly onto reality." It’s established by paratext (cover, "A Novel" label, prize category) and cultural context (e.g., placement in "Fiction" section).  
  - **Outer Message**: The literal content—sentences, characters, plot events. "X stole $90,000" is an outer message.  
  - **Inner Message**: The abstracted takeaway—themes, emotional resonance, conceptual critique. Here, it might be "betrayal corrupts relationships" or "greed unravels community."  

  **Where Assertoric Force Resides**:  
  Assertoric force (claim to truth) lives primarily in the **frame**. A coroner’s report (frame: "official document") asserts truth via identical sentences that, in a novel (frame: "invented story"), assert nothing. The frame dictates whether outer messages *refer* to reality or *simulate* reference.  

  **Reception’s Role**:  
  Readers interpret frame signals, but reception doesn’t *create* assertoric force. If a reader mistakes fiction for fact, the frame was ambiguous or misread—it doesn’t mean the work *became* nonfiction. However, artists/publishers bear responsibility for reasonably clear framing to prevent harm.  

  **The Prize’s Frame Power**:  
  When we award a *fiction* prize, we reinforce the frame message: "This is art, not testimony." Our role is not to verify facts but to evaluate how outer messages *serve* the inner message within a fictional pact.  

  ---

  ### 4. Applied to This Book (345 words)  
  **The Frame Collapse**:  
  The publisher removed the key frame signal ("A Novel") and added a "true story" blurb. The narrative frame (the fictional "editor") then self-destructs, further blurring invention/documentation. This *artistically* explores authenticity but *functionally* sabotages the fictional contract. Readers—especially locals aware of the real individuals—are invited to map outer messages directly onto reality.  

  **The Accusation Chapter**:  
  As outer messages, the sworn statement and theft allegations are literary devices. But stripped of a stable fictional frame, they acquire unintended assertoric force. The author’s contradictory statements exploit this ambiguity, leveraging doubt to heighten tension. Artistically, this may be innovative; ethically, it risks weaponizing fiction against a real person.  

  **Our Decision as Frame Restoration**:  
  By evaluating the book as fiction *and stating this publicly*, we supply the frame message the publisher withheld. We treat the accusations as *components of narrative design* (outer messages) serving the inner message (e.g., exploring trauma, subjective truth). This does not absolve the author/publisher of responsibility for real-world harm but clarifies *our role*: judging aesthetic achievement, not factual accuracy.  

  **Why This Addresses Legal Risk**:  
  The lawyer’s concern is that the prize legitimizes the allegations. Our note explicitly *de*-legitimizes them as factual claims. Courts recognize contextual disclaimers as mitigants against defamation claims.  

  ---

  ### 5. The Strongest Case the Other Way (240 words)  
  **Withdraw the book immediately.** The strongest argument is:  
  *This work exploits fictional ambiguity to inflict real harm on a private citizen. The publisher’s "true story" branding, paired with granular, verifiably false accusations against a named individual, constitutes bad-faith manipulation of the fiction prize’s credibility. The author’s contradictory statements reveal intentional deceit about the work’s nature, violating the submission requirement of "fiction." Even if artistically compelling, the committee cannot ignore its use as a vector for defamation. Awarding attention (via shortlisting) without condemnation endorses tactical ambiguity—encouraging artists to blur lines for notoriety while hiding behind "artistic license" when confronted. The legal letter, while not a suit, signals credible reputational damage already occurring. Withdrawal upholds the prize’s ethical duty: we celebrate fiction’s power to *explore* truth, not to *substitute* for it in settling personal scores.*  

  ---

  ### 6. What We Publish (110 words)  
  **Issue a concise, two-sentence note alongside the shortlist announcement:**  
  > "*[Book Title]* by [Author Name] is under consideration as a work of fiction. The committee’s evaluation focuses solely on its literary merit and does not assess the accuracy of events or depictions within the narrative.*"  
  **Rationale**: Silence ignores the publisher’s framing and legal concern; a lengthy defense overstates the issue. This statement:  
  1. Reasserts the fictional frame removed by the publisher.  
  2. Decouples the prize from factual claims.  
  3. Avoids legitimizing or condemning the content.  
  4. Fits media soundbite constraints.  

  ---  
  **Final Draft Deadline**: Thursday, 9 PM. Please flag substantive objections by 4 PM Thursday to allow revisions.
