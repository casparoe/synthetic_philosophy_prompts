answer: |-
  Your hypothesis is fundamentally correct—**the debate stalled because Mises, Lange, and Hayek were addressing distinct (though related) questions, and modern objections often conflate them**. The disagreement is **methodological and epistemological**, not merely verbal or empirical. Here’s a structured diagnosis:

  ### The Three Questions at Play:
  1.  **Mises’ Question (Formal Possibility):**  
      *Can rational economic calculation occur without private ownership of capital?*  
      **Core concern:** Prices aren’t just numbers; they emerge from competitive bidding for *scarce property rights*. Without genuine asset ownership and exchange, "accounting prices" lack the epistemic function of market prices.  
      **His answer:** No—without real markets for capital goods, there’s no mechanism to *generate* meaningful prices.  

  2.  **Lange’s Question (Computational Tractability):**  
      *Can a central planning board simulate market equilibrium?*  
      **Core concern:** Formal equivalence theorems (Walrasian general equilibrium). Lange accepts Mises’ framework but argues socialist planners can *mimic* the competitive outcome via trial-and-error price adjustments ("as if" markets).  
      **His answer:** Yes—planning is an engineering problem solvable via iterative algorithms.  

  3.  **Hayek’s Question (Epistemic Feasibility):**  
      *Can dispersed, tacit, dynamic knowledge be aggregated for economic coordination?*  
      **Core concern:** Knowledge isn’t "data" waiting to be reported; it’s fragmented, contextual ("knowledge of the particular circumstances of time and place"), and often non-articulable. Markets aren’t calculators—they’re *discovery processes*.  
      **His answer:** No—centralized mechanisms cannot access or process this knowledge.  

  ### Why Modern Objections Miss the Mark:
  - **"We can solve big equations now!" (Operations Research):**  
    This addresses only **Lange’s question**. Solving large-scale optimization problems proves computational feasibility *if* all relevant data exists in quantifiable form. But it bypasses **Mises’ institutional point** (where do prices originate?) and **Hayek’s epistemic point** (how is knowledge generated and shared?).  
    - *Why it fails:* Algorithms need inputs. Hayek’s critique is that *the inputs don’t exist* in a centralized form—e.g., the foreman’s intuition about machine wear, the shopkeeper’s hunch about shifting tastes.  

  - **"Amazon plans internally!" (The Firm Argument):**  
    This confuses **scale with system boundaries**. Firms like Amazon:  
    - Operate within a **market ecosystem** (external prices for capital, labor, commodities).  
    - Use **internal transfer prices** anchored to external market signals.  
    - Face **internal competition** for resources (e.g., divisional budgets).  
    - Can fail and be dissolved—unlike a state monopoly.  
    *Hayek’s reply:* Firms work *because* they’re embedded in markets. Their "planning" is constrained by market prices and the profit/loss test. Remove those, and internal efficiency dissolves.  

  ### The Real Disagreement: Methodology & Epistemology  
  This isn’t verbal quibbling or empirical oversight—it’s a clash of **economic worldviews**:  
  - **Lange (and modern OR):** Economics is an **optimization problem**. Data exists; the challenge is computation.  
  - **Mises/Hayek:** Economics is a **coordination problem under radical uncertainty**. Data is created through market processes (property rights, rivalry, profit/loss).  

  **Hayek’s question is the pivotal one.** His insight reframed the debate:  
  > *"The economic problem of society is […] a problem of the utilization of knowledge not given to anyone in its totality."*  
  Lange’s model assumes knowledge is *given*; Hayek argues it must be *discovered* through competition.  

  ### What Would Count as Progress?  
  The deadlock persists because no side "wins" on all three questions. Progress requires:  
  1. **Formalizing Hayek’s "knowledge problem":**  
     - Model how markets *generate* knowledge (e.g., agent-based models of price discovery).  
     - Test how institutions (property rights, competition) affect information aggregation (e.g., prediction markets vs. central reports).  

  2. **Empirical work on tacit knowledge:**  
     - Study how firms/states access local knowledge (e.g., compare algorithmic supply chains vs. decentralized adaptation).  
     - Measure the cost of "knowledge loss" in hierarchies (e.g., Soviet enterprise managers hiding capacity).  

  3. **Conceptual refinement:**  
     - Distinguish **calculation** (Lange’s domain) from **discovery** (Hayek’s domain).  
     - Analyze "planning" in firms *as a market-dependent phenomenon* (e.g., internal prices derive legitimacy from external markets).  

  4. **A change of question:**  
     Shift from *"Can socialism work?"* to *"Under what institutional conditions can dispersed knowledge be utilized?"* This frames markets and firms as complementary discovery mechanisms—not opposites.  

  ### Verdict: The Structure of the Deadlock  
  - **Mises** was right that **property rights generate prices**.  
  - **Lange** was right that **equilibria can be computed *if* data exists**.  
  - **Hayek** was right that **data doesn’t exist *until markets create it***.  

  **The debate is stalled because Lange solved a problem Hayek redefined as irrelevant.** Until we grapple with Hayek’s epistemic challenge—formalizing how markets discover knowledge—we’ll remain stuck. Your group’s frustration is the mark of serious engagement: **this isn’t a closed debate but an open frontier in institutional economics.**
