  ### Decision Tree for Local Conventions: Moral or Prudential?

  **Companion Table: Logical Space and Occupancy**  
  This table maps the logical space defined by three core questions derived from the cases. Each question represents a key distinction, and combinations of answers correspond to specific leaves. Unoccupied combinations are noted.

  | Question A: Does violating a convention wrong someone? (From Last-Night Café) | Question B: Does the wrong depend on being observed? (From Invisible Pedestrian) | Question C: Does it matter if you'll never return? (From Last-Night Café) | Occupied? | View (Leaf) | Reason for Unoccupied Combinations |
  |--------------------------------------------------------------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------|-----------|-------------|-----------------------------------|
  | Yes                                                                           | Yes                                                                             | Yes                                                                        | No        | –           | Incoherent: If wrong requires being observed, it can't exist when no one is watching (e.g., Last-Night Café). |
  | Yes                                                                           | Yes                                                                             | No                                                                         | **Yes**   | Expectations Duty | |
  | Yes                                                                           | No                                                                              | Yes                                                                        | **Yes**   | Fairness to Participants | |
  | Yes                                                                           | No                                                                              | No                                                                         | **Yes**   | Coordination Duty | |
  | No                                                                            | Yes                                                                             | Yes                                                                        | **Yes**   | Prudence Only | |
  | No                                                                            | Yes                                                                             | No                                                                         | **Yes**   | Deflationary | |
  | No                                                                            | No                                                                              | Yes                                                                        | No        | –           | Unattractive: If no wrong is done, arbitrariness (e.g., Invisible Pedestrian) or impact on vulnerable groups (e.g., Press-at-Counter) is irrelevant. |
  | No                                                                            | No                                                                              | No                                                                         | **Yes**   | Guest Respect | |

  **Notes**:  
  - **Fairness vs. Expectations Duty**: Both views say "tip" in Last-Night Café. They come apart in the Export Problem: Fairness requires tipping as locals do to avoid harming locals, while Expectations requires it to avoid disappointing staff. For onboarding, this difference matters because Fairness implies guilt if you harm locals, while Expectations implies mild awkwardness if you cause friction.  
  - **Unanswered Patterns**: If answers land in an unoccupied cell, print: "Your stance is uncommon. Revisit your answers or consult the leaves 'Local Epistemic Authority', 'Underlying Values', or 'Erosion of Bad Conventions'."  
  - **Missing Views**: Local Epistemic Authority, Underlying Values, and Erosion of Bad Conventions are not in the table but are reachable in the tree via other distinctions (e.g., vulnerability, leverage).  

  ---

  ### Decision Tree  
  **Instructions**: Answer each question based on the concrete case. Use IDs for routing (e.g., from N1, answer A to go to N2). Each leaf has a slug (e.g., `coordination-duty`) and practical guidance.  

  #### Internal Nodes (Questions)  
  1. **N1: Last-Night Café Case**  
     In City A, tipping is expected (staff rely on tips due to lower wages). You leave tomorrow, no one is watching, and service is done. Do you owe a tip?  
     - **A. Yes**: Go to N2.  
     - **B. No**: Go to N3.  

  2. **N2: Export Problem Case**  
     Your tipping in City D (not customary) has raised prices for locals. Staff now hover for tips. Do you adapt?  
     - **A. Keep tipping as at home**: Go to N4.  
     - **B. Tip as locals now tip**: Go to `fairness-duty`.  
     - **C. Stop visiting**: Go to `prudence-only`.  

  3. **N3: Invisible Pedestrian Case**  
     In City B, crossing outside a marked crossing is illegal but ignored. The street is empty and safe. Do you cross?  
     - **A. Yes, cross**: Go to N5.  
     - **B. No, walk to crossing**: Go to N6.  

  4. **N4: Press-at-Counter Case**  
     In City C, people press toward the counter; an elderly person loses out. Do you press?  
     - **A. Yes, press**: Go to `guest-respect`.  
     - **B. No, try to queue**: Go to `erode-bad`.  

  5. **N5: Bubble Case**  
     In a "bubble" (e.g., company shuttle with foreigners), do local conventions apply?  
     - **A. Yes, follow city conventions**: Go to `coordination-duty`.  
     - **B. No, follow bubble norms**: Go to `deflationary`.  

  6. **N6: Shared Codebase Case**  
     In a shared repository, Office A writes long commit messages; Office B merges fast. Whose convention binds you?  
     - **A. Office I'm visiting now**: Go to `local-knowledge`.  
     - **B. My home office**: Go to `values-only`.  
     - **C. The repository's dominant convention**: Go to `expectations-duty`.  

  #### Leaves (Conclusions)  
  - **Coordination Duty** (`coordination-duty`):  
    - **Awkward commitment**: You must comply even if your single act seems insignificant, because conventions solve shared problems (e.g., orderly queues or fair wages).  
    - **Practical stance**: You owe it to all participants; guilt is appropriate if you undermine the system. The company can reasonably ask compliance.  

  - **Expectations Duty** (`expectations-duty`):  
    - **Awkward commitment**: You must comply to avoid disappointing people who rely on the convention, even if your violation is invisible.  
    - **Practical stance**: You owe an apology if you cause friction; mild awkwardness if no one notices. The company can advise but not demand this.  

  - **Fairness to Participants** (`fairness-duty`):  
    - **Awkward commitment**: You must not free-ride (e.g., skip tipping in a tip-reliant system) because others sustain the convention.  
    - **Practical stance**: You owe it to vulnerable participants (e.g., underpaid staff); guilt is appropriate. The company can reasonably ask compliance.  

  - **Prudence Only** (`prudence-only`):  
    - **Awkward commitment**: No moral duty exists—only avoiding trouble or looking foolish.  
    - **Practical stance**: Mild awkwardness if you misstep; no guilt. The company should only advise, not require.  

  - **Guest Respect** (`guest-respect`):  
    - **Awkward commitment**: As a guest, you owe compliance to hosts as respect, regardless of the convention’s fairness or visibility.  
    - **Practical stance**: You owe an apology for disrespect; guilt if you fail. The company can ask this as a cultural policy.  

  - **Local Epistemic Authority** (`local-knowledge`):  
    - **Awkward commitment**: You should follow local practice because locals know best, but you can override if you have better knowledge (e.g., a fairer queue).  
    - **Practical stance**: If you override and cause harm, apologize to affected locals; no guilt if well-reasoned. The company should advise, not require.  

  - **Underlying Values** (`values-only`):  
    - **Awkward commitment**: Only the values matter (e.g., safety or fairness); conventions are substitutable means.  
    - **Practical stance**: If you substitute, explain to those confused; guilt only if you violate the value. The company should not enforce conventions.  

  - **Erosion of Bad Conventions** (`erode-bad`):  
    - **Awkward commitment**: You must flout harmful conventions (e.g., assertive pressing that excludes the elderly) and use leverage to change them.  
    - **Practical stance**: No guilt for flouting; you owe effort to the disadvantaged. The company can support but not mandate this.  

  - **Deflationary** (`no-fact`):  
    - **Awkward commitment**: No "duty" exists—only reactions (e.g., not getting served if you don’t press).  
    - **Practical stance**: Adjust based on reactions; mild awkwardness for missteps, no moral guilt. The company should only advise.  

