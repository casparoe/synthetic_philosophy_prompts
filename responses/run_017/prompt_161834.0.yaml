prompt: |-
  I'm retired now — I was a marine geologist for most of my working life — and a few of us from the village have a reading group that plods through one old book a term. Right now we're on Nietzsche's 1874 essay about the uses and disadvantages of history for life, the one where he sorts attitudes toward the past into roughly three kinds: the one that goes looking for great examples to imitate and to spur you on, the one that lovingly preserves whatever has come down to you simply because it is yours, and the one that hauls the past up in front of a tribunal and condemns it in order to free the present. Sorry if I'm mangling it, we've only been through it once. What I can't get off my mind is an attitude to the past that I keep running into and that doesn't seem to sit in any of the three, or at least not cleanly.

  Two cases. First, the town here spent years and a fair amount of money restoring the old guildhall — absurd attention to detail, they hunted down hand-forged nails and the right lime mortar and so on — but there is a century and a half in the middle of the building's life when it was a workhouse, and that part has been quietly dropped: no plaque, nothing in the guidebook, and the two people who drove the restoration get a bit frosty if anyone raises it. And the very same people use the restored building, every year, as the backdrop for a speech about how shoddy and rootless everything built since 1950 is. Second, my old university department: the portrait gallery, the founders' names recited at every dinner, the careful upkeep of the story of how the field began — and the whole apparatus is aimed forward as an accusation, everything since is a falling away. Except that the founders being invoked turn out, when you actually check, never to have held the views attributed to them, so the past that's doing the work has been tidied up.

  So it's reverence and prosecution at once, and the preserving is selective in a way that serves the prosecuting: what gets kept is whatever makes the present look bad, what gets dropped is whatever would cost the present something or complicate the story. One of the group said it's just nostalgia, which is definately too big a word, and another said it's obviously the third of Nietzsche's kinds — except that his third kind wants to destroy the past, not to polish it and put it on a plinth. Is there an established name for this exact configuration, or a literature on it, and if there isn't, would you name and define it? I don't want just a label, though: I want to know how the boundary runs between it and ordinary nostalgia, between it and each of Nietzsche's three attitudes, which of those it comes closest to and where it breaks away, and what would count as a borderline case — for instance, does it stop being this thing if the people doing it recieve their tidied-up past in perfect good faith and genuinely believe it accurate? Could you answer as exactly five numbered points, one or two sentences each, with no preamble and no summing-up at the end?
reasoning: |-
  Okay, let me tackle this fascinating query from a retired marine geologist about Nietzsche's three historical attitudes. The user describes a fourth pattern where selective reverence for a sanitized past is weaponized against the present - like the restored guildhall omitting its workhouse history while condemning modern architecture, or the university invoking fabricated founder ideals to shame current scholarship. 

  Hmm, first I need to map this against Nietzsche's framework: monumental (heroic imitation), antiquarian (reverent preservation), and critical (destructive judgment). The described behavior isn't purely any of these - it's simultaneously preservationist and prosecutorial, but with curated evidence. Unlike nostalgia's vague longing, this is targeted and accusatory. 

  The core mechanics seem to be: 1) archival cherry-picking that amplifies past virtues/present failings, 2) manufactured continuity with reconstructed predecessors, 3) present-day moral leverage. Interesting that user specifically rejects "nostalgia" as too broad - they want precision about how this differs from simply missing the past. 

  For the numbered response, I'll define it as "accusatory antiquarianism" since it twists antiquarian love into prosecution. Boundary cases would include sincere but mistaken reverence (still manipulative) versus deliberate forgery (fraudulent). Key differentiator from Nietzsche's critical mode is the veneration component - they're enshrining, not destroying. 

  User's academic tone suggests they'll appreciate distinguishing features crisply: the diagnostic selectivity, the rhetorical purpose, and how faith in the reconstruction doesn't negate the mechanism. Might add that unlike monumental history's inspirational function, this is deliberately demoralizing through unfavorable comparison.
answer: |-
  Here are five numbered points defining and distinguishing this historical attitude:

  1.  **Definition:** This is *Accusatory Antiquarianism*: selectively preserving fragments of the past, often sanitized or mythologized, specifically to construct an idealized benchmark used to indict and condemn the perceived deficiencies of the present era. Reverence serves prosecution.
  2.  **Vs. Nietzsche's Antiquarian:** Unlike Nietzsche's preserving antiquarian, which values the past inherently "because it is ours," accusatory antiquarianism preserves *only* what fuels its critique of the present, actively discarding complicating or redeeming elements ("workhouse history," founders' inconvenient views).
  3.  **Vs. Nietzsche's Critical:** Unlike Nietzsche's critical mode, which seeks to "condemn and destroy" burdensome past elements to liberate the present, accusatory antiquarianism *fetishizes* its curated past, placing it on a "plinth" as an unimpeachable standard *against* which the present is judged wanting.
  4.  **Vs. Nostalgia:** Unlike diffuse nostalgia (longing for a lost, often generalized past), accusatory antiquarianism is *instrumental* and *aggressive*; it meticulously constructs a specific, weaponized past narrative explicitly designed to delegitimize the contemporary world through unfavorable comparison.
  5.  **Boundary Case:** Good faith belief in the tidied-up past doesn't negate the mechanism; if the *function* remains constructing an accusatory benchmark against the present through selective reverence, it still qualifies, though it shifts from conscious fabrication to *mythologization*. The deliberate *exclusion* of complicating facts remains key.
