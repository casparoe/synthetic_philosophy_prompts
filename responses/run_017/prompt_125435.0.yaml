  ### 1. Rules, Materials, and Script  
  **Materials Needed**:  
  - A deck of cards: For two-type rounds (Rounds 1-5), include 20 cards: 10 red (Low), 10 black (High). For the final three-type round (Round 6), include 15 cards: 5♠ (Bottom), 5♥ (Middle), 5♦ (Top).  
  - Poker chips: At least 200 chips (e.g., 100 white = 1 unit, 50 blue = 5 units).  
  - Index cards and pens for free messages.  
  - A whiteboard to display the cost of signaling each round.  
  - Envelopes or folders for players to hide decisions.  
  - Random group generator (app or slips of paper).  

  **Setup for Anonymity & Reputation Prevention**:  
  - Assign random, rotating IDs each round (e.g., "Player A1," "B2").  
  - Regroup players every round using random assignment.  
  - Senders submit type cards and decisions in sealed envelopes; receivers view only the signal and message.  
  - Do not reveal types or individual payoffs until the final debrief.  

  **Script to Read Aloud**:  
  "Welcome! We’re playing a game about decision-making. Here’s how it works:  
  - Each round, you’ll be paired anonymously. One of you will be the **Decision-Maker**, the other the **Evaluator**.  
  - **Decision-Makers**: You’ll draw a secret card (your ‘type’). Then, choose:  
    - **Option A**: Send a visible badge. This costs chips (amount changes each round).  
    - **Option B**: Skip the badge (no cost).  
    - You may also send a free written message (anything you like).  
  - **Evaluators**: You’ll see the badge choice (if any) and the message. Then, decide: **Accept** or **Reject** the Decision-Maker.  
  - **Payoffs in chips**:  
    - If **Accepted**: Decision-Maker gains chips based on their type (if High: +10; if Low: +5).  
    - If **Rejected**: Decision-Maker gains 0.  
    - **Badge cost**: Paid by the Decision-Maker *only* if they chose Option A (whether accepted or rejected).  
    - Evaluators gain/lose chips based on the Decision-Maker’s type (if High: +15; if Low: -10).  
  - **Roles rotate** each round. Your goal: Maximize your chips. Highest total wins a prize.  
  We’ll play 6 rounds. I’ll announce the badge cost each round. Let’s begin!"  

  ---

  ### 2. Round-by-Round Sequence and Payoff Table  
  **Payoff Table**:  
  | Sender Type | If Accepted | If Rejected | Badge Cost (c) |  
  |-------------|------------|------------|---------------|  
  | High        | +10        | 0          | Paid if sent  |  
  | Low         | +5         | 0          | Paid if sent  |  
  **Receiver Payoff**: Accept High: +15; Accept Low: -10; Reject: 0.  

  **Cost Band Arithmetic**:  
  - **Separation requires**:  
    - **High types signal**: \(10 - c > 0\) → \(c < 10\).  
    - **Low types don’t signal**: \(5 - c < 0\) → \(c > 5\).  
  - **Band**: \(5 < c < 10\) (e.g., \(c = 6\) or \(9\)).  
  - **Low type faking inside band**: If \(c = 6\), payoff = \(5 - 6 = -1\) (worse than 0).  

  **Rounds**:  
  - **Round 1**: \(c = 0\) → Expected: Everyone signals.  
  - **Round 2**: \(c = 3\) → Expected: Pooling (all signal).  
  - **Round 3**: \(c = 6\) → Expected: Separation (High signal, Low don’t).  
  - **Round 4**: \(c = 9\) → Expected: Separation.  
  - **Round 5**: \(c = 12\) → Expected: No one signals.  
  - **Round 6 (Subsidy)**: \(c = 9\) with a **5-chip refund** to all who signal (net cost = 4).  
    - **Effect**: Breaks separation (Low types signal: \(5 - 4 = 1 > 0\)).  
    - **Welfare drop**: Separation (Round 4) total welfare/pair = \( (10-9) + 15 = 16 \) for High, \(0 + 0 = 0\) for Low → avg. 8. Pooling (Round 6) total welfare/pair = \( (10-4) + (5-4) + (0.5 \times 15 + 0.5 \times -10) = 7 + 1 + 2.5 = 10.5 \) → but receiver’s expected payoff is \(2.5\), sender avg. is \(4\) → total \(6.5\) (worse).  

  ---

  ### 3. Debrief (15 Minutes)  
  **Map Observations to Concepts**:  
  - **(a) Cost Gap Matters**:  
    - "In Rounds 3 and 4 (cost=6/9), High types signaled, Low didn’t. Why didn’t Low types fake it?" → *They couldn’t afford the cost gap*.  
    - "In Round 6, we subsidized badges. What happened?" → Subsidy shrank the gap, Low types faked, badges became meaningless.  
  - **(b) Expectations Hold Outcomes**:  
    - "In Round 5 (cost=12), no one signaled. Could we have had signaling?" → Yes, but if receivers *expect* no one to signal, they might accept anyway (as they did), trapping you in a no-signaling world.  
  - **(c) Silence as Signal (Theoretical)**:  
    - "In the final round, Top types skipped the badge while Middle types paid. Why?" → *Silence signaled top status* because Middle types couldn’t afford to skip (reject risk). We’ll discuss this next.  
  - **Name the Handicap Principle**: Only after discussing (a)-(c): "Biologists call this ‘costly signaling’ or the *handicap principle*: signals work if they’re cheaper for honest senders."  

  ---

  ### 4. Predictable Problems and Fixes  
  - **Players signaling randomly/boredom**: Low types signal at high cost → **Ask**: "Why did you signal despite losing chips?" Highlight irrationality in debrief.  
  - **Receivers trusting free messages**: Politeness overrides skepticism → **Remind**: "Messages are free—anyone can claim anything!"  
  - **Type distribution leaks**: Players peek/share cards → **Enforce**: Sealed envelopes; discard cards after use.  
  - **Meta-strategies (e.g., "I’ll never signal")**: Defies incentives → **Let it play out**: They’ll lose chips and self-correct.  
  - **Missed cost band**: Short rounds obscure pattern → **Debrief explicitly**: Contrast Round 3 (c=6) and Round 4 (c=9) vs. others.  

  ---

  ### 5. What the Game Can’t Reproduce  
  **The Gap**: In biology, signals (e.g., peacock tails) evolve via natural selection—not rational choice. Costs are fixed by anatomy, and correlation is maintained over generations. Players *choose* signals, but in nature, mutations either survive or die.  

  **Why It Matters**: Your club will grasp the *logic* (cost gaps, expectations) but not the *mechanism* (evolution vs. strategy). This is minor: the core intuition survives. For (c), the game can *simulate* top types skipping signals, but biology adds that their genes "prove" quality without conscious choice.  

  **How to Bridge It**: In debrief, contrast:  
  > *"In this game, you reasoned about costs. But in nature, a gazelle’s stotting jump or a peacock’s tail evolved because costly signals weeded out weak imposters over millennia—no one ‘decides,’ it just works."*  

  This ensures the takeaway is robust: signals convey information only if they hurt liars more than truth-tellers.
