prompt: |-
  I have no academic background in either philosophy or astronomy — I work in logistics and read this sort of thing on my own at night — and for a while now I've been using the Pluto affair as a test case for something I read about Wittgenstein. I think I'm running the test badly, and I'd like you to run it properly.

  The episode, as I have it: Pluto was found in 1930 and went into the books as the ninth planet. From the 1990s onward astronomers began finding a great many other icy bodies out beyond Neptune, some of them close to Pluto in size. In 2006 the International Astronomical Union put a definition of 'planet' to a vote — roughly, that a planet orbits the Sun, is pulled into a round shape by its own gravity, and has cleared other bodies out of the neighborhood of its orbit — Pluto failed the last clause, and became a 'dwarf planet'. There was genuine public upset, and textbooks and museum displays had to be rewritten. As I understand it the definition only covers bodies orbiting our Sun, so the word still has no official sense for the planets found around other stars. If any of that is wrong, correct it in passing, but please don't let the analysis hang on it.

  The idea I'm testing it against, in my own words: that a great many words are not held together by one feature that everything they cover has in common, but by overlapping likenesses running across a family — his example being games — so that a word can be in perfectly good working order without a hard edge, and that the hunt for the real definition is the thing that gets us into trouble.

  Two claims I keep sliding between, which I suspect are actually two and not one: that there is no single feature shared by all the things we call planets, and that there is no fact of the matter about the borderline ones. It seems to me the first could be true while the second is false — that a word can lack an essence and still deliver a definite verdict in a particular hard case. Does that distinction hold up, and which of the two does the 2006 dispute really turn on?

  What I want, in this order:

  First, set up the mapping for me: who was using the word and for what — working astronomers, the people who write schoolbooks and run planetariums, the rest of us — what each of them needed 'planet' to do, and what would have counted as evidence for each of them (a telescope image, a model of orbital dynamics, the contents of a third-grade textbook).

  Second, say what the family-likeness view predicts about the situation before 2006 — should we have expected trouble once the similar objects started turning up? — and what it says about the vote itself. Is a vote the right sort of thing to settle a question like this, and is the fact that it took a vote evidence for Wittgenstein, or just an unconnected fact about how astronomy is organized?

  Third, tell me where the view goes quiet. Does it have anything at all to say about whether the 2006 decision was a good one? If the honest answer is that it only describes how the word was working and has nothing to say about what should have been done, say that rather than squeezing a recommendation out of it.

  Fourth, run it the other way: is the episode a point for Wittgenstein, a point against him, or neither? My worry is that a lot of the words people offer as examples of this — in law, in medicine, in astronomy — are exactly the ones that somebody eventually has to sharpen into a yes-or-no test, and that a view which tells us the soft edges are fine has no account of the moment an institution has to produce a verdict. If Wittgenstein has an answer to that, tell me what it is and whether it works here.

  Fifth, give me the case I can't work out for myself: Ceres. It was called a planet for some decades after 1801 and then quietly stopped being one, as far as I know without anyone voting on it and without anybody much caring. On your account, what happened to the word there — the same kind of event as 2006, or a different one?

  Please answer as exactly five numbered items, one following the other in that order, each a sentence or two, with no introduction and no summing-up at the end. Somewhere in the list, in one sentence, tell me which parts of what you've said are settled among people who actually work on this and which are live disputes, and mark a claim as contested rather than handing me a contested reading as the consensus. American English, please.
reasoning: |-
  Hmm, the user is asking me to apply Wittgenstein's family resemblance concept to the Pluto reclassification debate. They work in logistics but are self-studying philosophy at night, so I need to keep this accessible while being precise.

  The user wants five specific responses in order: mapping of word usage groups, predictions from family resemblance theory, limitations of the view, evaluation against Wittgenstein's ideas, and the Ceres comparison. They also want me to flag which parts are settled and which are debated in academic circles.

  For the first point about mapping word usage: Astronomers need precision for classification, educators need teachable categories, and the public uses planet more fluidly based on cultural familiarity. Evidence would differ - data for astronomers, textbooks for educators, common knowledge for the public.

  On family resemblance predictions: The theory would expect trouble when new Kuiper Belt objects blurred boundaries, as no single "planet" essence existed. The vote reflects institutional need for decision-making, not necessarily word failure - Wittgenstein might see this as language-game adjustment rather than proof of inherent fuzziness.

  For limitations: Family resemblance describes usage but doesn't prescribe outcomes. It remains silent on whether the IAU definition was scientifically optimal - that's a separate astronomical debate.

  Evaluating against Wittgenstein: The episode neither proves nor disproves him. It shows both family resemblance (pre-2006) and institutional sharpening (vote) as functional language aspects. His view accommodates both natural usage and technical standardization.

  The Ceres comparison: Similar to Pluto but less contested because fewer objects existed then, allowing gradual consensus without formal vote. The word's boundaries adjusted as astronomical knowledge grew, supporting Wittgenstein's emphasis on contextual use over fixed definitions.

  I'll note that Wittgenstein's application to Pluto is contested among philosophers, while the historical facts about the IAU vote are settled. I'll present this in five clear points without intros or conclusions as requested.
answer: |-
  1.  **Mapping word usage:** Astronomers required a precise classification for cataloging solar system bodies, relying on orbital dynamics and observational data; educators and planetariums needed a stable, teachable category often based on tradition and textbook definitions; the public largely used "planet" based on cultural familiarity and simple attributes like visibility or being a "major world," with evidence ranging from scientific reports to media coverage and childhood mnemonics.
  2.  **Family-likeness prediction and the vote:** Family resemblance predicts inevitable friction when numerous Pluto-like objects emerged, revealing the lack of a single defining feature shared by all historical planets; the vote was a pragmatic institutional act to resolve ambiguity for scientific utility, not proof the word lacked function before, nor inherently wrong for that context – Wittgenstein focuses on *use*, and different groups (scientists vs. public) use words differently, with the vote reflecting the scientists' language-game need.
  3.  **Where the view goes quiet:** Wittgenstein's view describes how "planet" *was* used and *why* conflict arose; it offers no judgment on whether the 2006 definition's specific criteria (like orbital clearance) are scientifically optimal – that remains a separate, contested debate within astronomy about classification utility. *(Note: The application of Wittgenstein to this case is itself contested among philosophers.)*
  4.  **Evaluation against Wittgenstein:** Neither point for nor against; the episode *illustrates* family resemblance (pre-2006 usage lacked a sharp boundary/essence) *and* shows how specialized communities can create sharp definitions for practical needs, which Wittgenstein acknowledged as another form of language-game – his view explains the *source* of the conflict but doesn't preclude the institutional "sharpening" as a valid linguistic act within a specific context.
  5.  **The case of Ceres:** Ceres' demotion was a similar boundary adjustment driven by discovery (many asteroids) blurring the category, but occurred gradually through scientific consensus without formal vote or public outcry, demonstrating how language can evolve "quietly" when new members sufficiently dilute perceived family likenesses for the relevant users (astronomers).
