prompt: |-
  You are a professional philosopher working at the intersection of philosophy of technology, social epistemology, and the study of institutions, with working knowledge of how AI systems are actually governed inside large organizations. I want careful conceptual work here, not a literature dump. Do not give me bibliographies, reading lists, or citations to chase: I have no library and no web access, and I want your own analysis. If you mention a named idea, describe it in a sentence, because I will not be able to look it up. Take your time over the candidate set before you start drafting.

  Here is the background and the thing I have noticed. I work in the second line of defense at a large insurer, and for the past two years I have sat on the internal committee that assigns each deployed model one of two governance labels before it goes live. Roughly: "tool" (the system produces recommendations; a named human reviewer with real authority and real capacity to override signs off on each one; accountability stays with the human; light oversight regime) versus "agent" (the system is allowed to carry a multi-step task through without per-action human approval; heavier regime; the deployer carries the exposure).

  What I keep watching happen is this. A system earns the "tool" label because the override is genuine: in the first months reviewers change a meaningful fraction of recommendations, and the committee can point to that as its evidence. Then the model improves and the override rate falls. Nothing is wrong yet. But three things follow. First, the skill that made the override meaningful gets exercised less and decays — a reviewer who now sees two hundred recommendations a day, of which perhaps one is wrong, and who is measured on throughput, is not in a position to catch that one. Second, the organization acquires a strong interest in the "tool" label, since the label is what keeps the system in the light regime and leaves the residual liability with the human; so the review interface, the time budget per case, and the documentation requirement all get shaped in ways that preserve the form of review. Third — and this is the part I take to be distinctive — the artifacts of the eroded practice are then offered as evidence that nothing has eroded. The file shows 99.7% of decisions "human-reviewed." That figure is cited back to the committee as the reason to renew the tool classification, and to the auditor as the reason the control is effective.

  So: the conditions that justified the label are consumed by the consequences of holding it, and the accounting trail left by the degraded practice is what certifies that the conditions still hold.

  Three further instances, in case they help you see the shape rather than my generalization:

  - Hospital imaging: a model flags possible findings and the radiologist "reads" the flagged study. The hospital reports that every flagged study is read by a physician. Reading has quietly become confirmation.
  - Public benefits eligibility: the analyst must type a justification in order to deviate from the model's recommendation; writing one up takes twenty minutes and attracts supervisory attention. Deviation rates go to near zero. The program reports a human determination in every case.
  - Software: a developer reviews a generated diff line by line, accepts it, and merges. When the resulting bug ships, the developer is the person asked about it, on the grounds that a human put their name to it.

  What I have already tried and set aside: "Goodhart's law" is about a measure ceasing to track its target once it becomes a target; here the measure is not so much gamed as left reading the same number while the underlying capacity quietly disappears. "Automation bias" and its neighbors get the psychology of over-trust but not the governance loop, and they say nothing about the third step, where the output of the degraded practice is offered as proof of its own integrity. "The responsibility gap," as I understand it, concerns cases where no one can be held responsible; here responsibility is assigned very precisely and even advertised, which is part of what stabilizes the arrangement.

  So my question is whether there is an established concept for this exact configuration, and if not, how it should be carved.

  Please answer in American English, in the following sections, in this order, at roughly these lengths:

  1. Brainstorming (150–200 words). Before you settle on anything, list a dozen candidate concepts from whatever fields they come from — philosophy, science and technology studies, organizational sociology, law, human factors, auditing, anywhere — unsorted, one line each. I want to see the raw candidate set and not only your finalists.

  2. Nearest existing concept (250–300 words). The single best fit that already has a name. State the concept, the field it comes from, exactly how my case instantiates it, and exactly where it stops short.

  3. Runner-ups and the point of divergence (200–250 words). Three or four more, each with the one sentence that rules it out. I care more about your reasons for exclusion than about the list itself.

  4. Verdict (about 100 words). Does anything established cover the whole configuration, or is there a genuine gap? Be direct: if the right answer is that this is a special case of something already named and I am over-describing it, say so plainly.

  5. Definition and coinage (300–350 words). Either way, finish the carving. Give me the necessary conditions — I provisionally think there are three: a status assigned on the basis of a capacity; the assignment predictably degrading that capacity; and artifacts of the degraded practice being counted as evidence that the capacity is intact. Correct or replace them. Then give me a name and a one-sentence definition, and say what the coinage is supposed to let us see that the nearby terms conceal.

  6. Boundary cases (about 250 words). Five cases of your own choosing, with an in-or-out verdict and a one-line reason for each. Please include at least one case where the capacity decays but nobody has an interest in the label, and one where the label was never warranted at all — a pure rubber stamp from the first day. Is the second of those my phenomenon or a different one?

  7. Field test (100–150 words). What would I measure, or what could I run, to tell this phenomenon apart from its lookalikes in a live deployment?

  A name on its own is not what I am after; I need the joints.
reasoning: |-
  Hmm, the user is a professional in risk governance at a large insurer, dealing with AI model classification systems. They've observed a specific pattern where systems initially classified as "tools" (requiring human override) gradually become ineffective due to decaying human oversight, while the bureaucratic evidence continues to justify the original classification. They've already considered concepts like Goodhart's law, automation bias, and responsibility gap but found them insufficient.

  This is an interesting challenge that requires deep conceptual analysis. The user clearly understands these governance dynamics firsthand and wants precise philosophical framing rather than literature references. They need a new conceptual toolkit to name and analyze this self-reinforcing degradation cycle.

  For the brainstorming section, I'll generate candidate concepts from various fields: institutional theory (like ritualism), epistemology (testimonial smothering), organizational behavior (decoupling), and technology studies (technological somnambulism). Each captures different aspects but none fully fits.

  The nearest existing concept seems to be "institutional decoupling" from organizational sociology, where formal structures diverge from actual practices. This fits the veneer of human oversight continuing after its substance erodes. But it misses the causal loop where the classification itself drives the erosion.

  The phenomenon has three core elements: 1) Status assigned based on capacity, 2) Assignment degrades capacity, 3) Artifacts of degraded practice serve as evidence that capacity remains. This creates a self-reinforcing cycle.

  I'll coin "Oversight Entrainment" - where the oversight mechanism becomes synchronized with and dependent on the very system it's meant to monitor, losing independent critical function. The term "entrainment" captures how the human judgment gets rhythmically synchronized to the AI's output until it can't break tempo.

  For boundary cases, I'll include scenarios like pure rubber-stamping (different because no capacity ever existed) and skill decay without label incentives (different because no bureaucratic reinforcement). 

  The field test would involve measuring not just override rates but override capability - through surprise audits or skill assessments - to detect whether the capacity still exists independently of the ritualized practice.
answer: |-
  ### 1. Brainstorming  
  - **Institutional decoupling** (sociology): Formal structures diverge from actual practices.  
  - **Ritualism** (Merton): Adhering to procedures while losing sight of their purpose.  
  - **Epistemic capture** (philosophy): Knowledge systems become aligned with institutional priorities.  
  - **Performative accountability** (STS): Accountability acts as theater rather than substantive oversight.  
  - **Skill atrophy** (ergonomics): Competence fades through disuse.  
  - **Moral crumple zone** (design ethics): Humans absorb blame for systemic failures.  
  - **Procedural entrenchment** (law): Processes persist despite functional obsolescence.  
  - **Illusory transparency** (HCI): Interfaces create a false sense of control.  
  - **Perverse incentive loop** (economics): Rewards corrode the capacities they measure.  
  - **Testimonial smothering** (epistemology): Marginalized knowledge is silenced by institutional demands.  
  - **Semantic drift** (linguistics): Labels retain wording but shift in operational meaning.  
  - **Compliance tautology** (auditing): Proof of compliance relies on corrupted evidence.  

  ### 2. Nearest Existing Concept  
  **Institutional Decoupling** (organizational sociology, from Meyer & Rowan): Organizations maintain formal structures for legitimacy while actual practices deviate to meet efficiency demands. Your case instantiates it perfectly: the "human review" label is retained for regulatory legitimacy, while the *practice* of review erodes into confirmation bias under throughput pressures. The artifacts (logs of "reviewed" decisions) become ceremonial props that sustain the myth of oversight.  

  **Where it stops short**: Decoupling describes the *gap* between appearance and reality but doesn’t capture the **self-consuming feedback loop** where the label’s benefits actively *cause* the erosion. It also neglects the **epistemic inversion**: corrupted outputs (99.7% "reviewed" stamps) become proof of system integrity. Decoupling is static; your phenomenon is dynamically self-reinforcing.  

  ### 3. Runner-Ups and Point of Divergence  
  - **Automation Complacency** (human factors): Humans trust systems excessively and reduce vigilance.  
    *Divergence*: It explains *why* reviewers disengage but not how the **institutional framework weaponizes this disengagement as validation**.  
  - **Goodhart’s Law** (economics): When a measure becomes a target, it ceases to be useful.  
    *Divergence*: Your override rate isn’t gamed; it’s rendered **conceptually hollow** while numerically stable.  
  - **Responsibility Laundering** (tech ethics): Using humans as ethical "heat shields" for systems.  
    *Divergence*: This focuses on assigning blame, not the **progressive epistemological collapse** where decayed practices falsely certify themselves.  
  - **Simulacrum** (Baudrillard): A copy without an original.  
    *Divergence*: It describes the *outcome* (human review as empty ritual) but not the **causal mechanism** (label incentives consuming capacity).  

  ### 4. Verdict  
  Genuine gap. Existing concepts describe components (erosion of capacity, legitimacy structures, perverse incentives) but none captures the **tripartite cycle**: (1) status granted based on capacity, (2) status incentivizes capacity’s degradation, (3) artifacts of degraded capacity falsely certify status. This is a distinct institutional pathology.  

  ### 5. Definition and Coinage  
  **Necessary Conditions**:  
  1. **Capacity-Dependent Status**: A privilege (e.g., "tool" label) is contingent on demonstrating a human or institutional capacity (e.g., meaningful override).  
  2. **Status-Induced Atrophy**: The privileges of the status (efficiency, liability shields) incentivize practices that erode the capacity (throughput pressure, skill decay).  
  3. **Certification Artifact**: Outputs of the degraded process (logs, metrics) are institutionally accepted as proof the capacity remains intact.  

  **Name**: **Oversight Entrainment**  
  **Definition**: *A process where the institutional status granted to a system actively degrades the human capacity required to sustain that status, while generating artifacts that falsely certify the capacity’s persistence.*  

  **What it reveals**: Unlike "decoupling" (which implies passive drift) or "complacency" (psychological), this names the **active self-destruction of oversight**: the label’s benefits create conditions that consume its own foundations, with bureaucracy laundering the decay into legitimacy. "Entrainment" evokes how oversight synchronizes to system outputs until it cannot break rhythm.  

  ### 6. Boundary Cases  
  - **Pure rubber stamp** (no initial capacity): *OUT*. Status wasn’t granted based on real capacity (violates Condition 1).  
  - **Skill decay without label incentives** (e.g., radiologists lose edge due to automation, but no liability shield depends on it): *OUT*. Missing Condition 2 (status doesn’t *cause* decay).  
  - **Deliberate deception** (e.g., hiding override failures): *OUT*. This is fraud, not systemic erosion laundered by procedure.  
  - **Temporary override surge** (e.g., new model version causes spike in changes, later stabilizes): *OUT*. No persistent degradation of capacity or certification artifact.  
  - **Regime change** (e.g., "agent" label revoked after incidents force retraining): *IN*. Shows the cycle broken when artifacts fail to certify status.  

  ### 7. Field Test  
  Measure **override capability**, not just override rate. Introduce **unannounced test cases** with known errors into the workflow. Track:  
  - **Detection rate**: How often reviewers catch the error *without prompting*.  
  - **Time-to-detect**: Lag between recommendation and correction.  
  - **Justification depth**: Specificity in deviation notes (e.g., "contradicts policy §3.2" vs. "adjusted").  

  **If Oversight Entrainment is occurring**:  
  - Detection rates plummet despite high "review" metrics.  
  - Justifications become vague/copied even for test cases.  
  - Reviewers resent tests as "slowing down real work"—proving throughput dominates capacity.  

  This distinguishes it from Goodhart (metrics improve but correlate weakly with errors) or simple complacency (errors caught when attention is explicitly directed).
