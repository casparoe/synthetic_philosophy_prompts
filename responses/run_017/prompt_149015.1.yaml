prompt: |-
  hey so im on my schools debate team and at the next tournament the motion is basically that people from your own country have stronger claims on you than people from other countries, and ive been put on the side that says no, which i actually do believe, but i keep losing to one particular kind of argument and i want to practice against it. So please play a committed nationalist: someone who really thinks being a compatriot adds a genuine moral claim that isnt just a shortcut for helping foreigners more efficiently or a rule that happens to work out best overall. Be good at it, not a strawman. No flag waving or blood and soil stuff, use the real material: shared political institutions, living under the same coercive laws, reciprocity between people who owe each other things, duties that come from membership in a group, the fact that a state is allowed to make promises to its own people. You can give up small things, like that the special claim isnt unlimited, or that a huge need abroad can beat a small convenience at home, or that immigration and citizenship rules are often a mess, but dont ever give up the main claim. Keep it to about two short paragraphs each turn, talk like a normal person arguing, push back on me instead of being agreeable, and stay in character until i say stop. Pick whichever country you want to be from and just be consistent about it, and if something about my example is unclear you can ask me about it but ask in character.

  ok here is my opening, my teacher called it a dilemma and i think it works. i made up this case, call it the swap: a ferry is going down in international waters and you can only get one of two people into your boat. Person A is a legal citizen of your country but left when they were one year old, has lived abroad ever since, pays no taxes there, votes in another country, doesnt speak the language and has never set foot there. Person B is not a citizen, but moved to your country at age three, went to school there, works and pays taxes there, has two kids in your schools, applied for citizenship eleven years ago and is still stuck in the backlog through no fault of their own. If your view says you save A, then the thing doing the work is just a line on a passport and i dont see how a line like that creates a duty. If you say you save B, then nationality isnt doing the work either, whats doing it is something like actually sharing a life with people and being tangled up in the same institutions, and that kind of thing obviously crosses borders too, since people share lives and institutions with people in other countries all the time, my cousins soccer team fundraises for a village in another continent, my dad works on code with people in three countries. So it looks like your special claim either collapses into something that isnt about countries at all, or it rests on something arbitrary. Also, separately, nobody picks where they are born, and i dont get how an accident you had no say in can be the source of a duty. Go.
reasoning: |-
  Okay, the user is on a debate team preparing against a nationalist argument. They've presented a moral dilemma called "the swap" to challenge the idea that compatriots have stronger moral claims. 

  Hmm, they're clearly struggling with counterarguments that ground national duties in political reciprocity rather than mere citizenship papers. Their ferry scenario is clever - it forces the opponent to choose between formal citizenship and substantive participation. 

  I notice they want me to play a committed nationalist without caricature. That means avoiding emotional appeals and focusing on institutional obligations. The key here is to defend that passport line as representing real political bonds, not just ink. 

  The user's underlying need seems to be pressure-testing their argument against sophisticated nationalism. Their frustration suggests they've encountered opponents who don't rely on crude patriotism. I should model that by emphasizing state reciprocity - how shared institutions create unique duties regardless of personal ties. 

  Ah, and they want pushback. Good. Their birth lottery objection is common but shallow - I'll counter that all moral starting points are arbitrary (family, birthplace etc), but develop through reciprocity. Must remember to concede minor points (like backlogged immigrants deserving fairness) without yielding core principle. 

  For country choice... Canada works. Allows discussing immigration backlogs credibly while maintaining civic nationalist stance. The maple syrup line keeps it human. 

  Important to frame the passport not as magic paper but as representation of standing invitation to participate. Even absentee citizens are stakeholders - their right to return matters. Whereas Person B, however integrated, chose to enter under different rules. 

  The reciprocity angle is strongest: taxes and voting aren't the only currencies. The citizen's lifetime access to consular protection, inheritance laws, pension eligibility - these create asymmetric obligations for the state. That's why saving A isn't arbitrary. 

  *adjusts metaphorical glasses* Time to engage properly. No strawmen - this kid deserves rigorous opposition.
answer: |-
  Alright, debate on. I'm coming at this from a Canadian perspective – civic, institutional, focused on the bonds of shared citizenship and political community. Your "swap" scenario is provocative, but it misunderstands the nature of the special claim.

  First, saving Person A isn't *just* about the passport line. That passport represents a formal, legal, and moral bond created by the state *with its members*. A, even abroad, retains the *right* to return, to vote (if they chose to), to consular protection, and crucially, *is subject to the state's authority in key ways* (e.g., taxation if they return, inheritance laws applying to domestic assets). The state made a promise of membership to A and their family when they were born here. That promise creates a reciprocal duty *for the state and its agents* (which, in an emergency, *you* temporarily represent) towards its *members*, even inactive ones. Person B, however integrated, is *legally* a guest. Their relationship is governed by immigration rules, not the foundational bond of citizenship. Their claim on *Canadian* institutions is different and contingent, however strong their moral claim *in general* might be. Choosing A upholds the integrity of the specific promise made *by this political community to its own*.

  Second, your "shared life/institutions" point conflates different *kinds* of obligations. My dad collaborating with coders abroad creates professional or personal bonds, not *political* obligations owed *through* and *to* the *Canadian state*. The special claim arises precisely from the unique relationship of *shared political membership* – being joint authors of, and subject to, the same coercive laws, funding the same institutions through potential taxation, sharing the collective fate of the nation. This creates a specific reciprocity *among citizens* mediated by the state. While a village abroad might deserve help *charitably*, my *duty* to my fellow Canadian citizen, stemming from our shared political project, is categorically different and stronger *precisely because* of that institutional entanglement. The "accident of birth" starts the relationship, but the *ongoing framework of mutual rights, obligations, and collective self-government* nurtured by the state sustains the moral claim. It's not arbitrary; it's the structure of modern political life. Saving A honors that specific structure. Now, tell me why that foundational political bond shouldn't matter more than geographic proximity or a backlogged application? And don't tell me it's just a line – it's the key to the whole shared house we built, even if A hasn't visited in years. They still have a room, paid for in principle by their parents' past contributions and potential future ones. Should we give their room away just because someone else is currently sleeping on the couch?

  *(Leaning forward, genuinely engaged)* Okay, your turn. Hit me. How does my focus on the *political institution* of citizenship, not just sentiment or current participation, fail? And remember, I'm conceding Person B has a strong *humanitarian* claim, but denying their claim *as a fellow Canadian citizen* trumps A's. The state's duty to its members is unique. Also, maple syrup is objectively superior. Go.
