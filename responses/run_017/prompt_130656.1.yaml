prompt: |-
  My policy workshop has two people who've been going at it for a year over refugees and asylum, and I'm the one who has to make them produce a joint document instead of another round of position papers. Camp A thinks a state's duties to outsiders are basically remedial and bounded: obligations kick in from that state's own causal role in the displacement, plus a fair-share duty of rescue that gets capped by what it can absorb without failing its own people. Camp B thinks the claims of someone fleeing serious harm don't get weaker because of where they were born, so membership is at best an administrative fact about who can be charged with helping, not a moral one.

  Give me the document they should sign. First a numbered list of claims both can actually accept — substantive ones, not "everyone has dignity." I want them to say something real about whether the refugee/economic-migrant line tracks anything they both care about, and I want them to deal with a case neither of them has a clean answer to: people whose government or economy is slowly dismantling the conditions of a livable life — creeping land dispossession, aquifer collapse, wether or not you want to call it climate — so that nothing pinpointable has happened to them yet, but they obviously can't stay. Call them foreclosure claimants if you need a label. Then a table of the remaining disagreements, each row worded so the side holding it would sign it as stated. One row should be about the thing I think is actually the fight: whether you can settle who counts as a refugee first and then argue separately about who has to take them, or whether those are the same question asked twice. Then the cruxes, and for each one the case, argument, or pattern of evidence both would accept as bearing on it, with each camp's prediction written down. Make one crux about duty transfer — whether a state discharges its share by paying for resettlement somewhere else rather than admitting anyone. And if you think some slice of their dispute is verbal, say which slice and why.
reasoning: |-
  Okay, let me unpack this policy workshop dilemma. The user needs a breakthrough document for two entrenched positions on refugee ethics: Camp A's bounded remedial duty versus Camp B's border-blind moral claim. 

  Hmm, the real challenge is finding substantive common ground beyond platitudes. Both camps actually share some unspoken premises - like admitting rescue thresholds exist (A's absorption limit echoes B's "who can practically help" concern). That's my starting point. 

  For the "foreclosure claimant" case, neither theory handles slow-onset displacement well. Camp A struggles with diffuse causality; Camp B can't pinpoint when harm becomes "serious enough." But both implicitly accept that preemptive flight from certain doom is rational - that's my wedge for consensus point #4 about non-persecution claimants. 

  Ah, the core fight! User's exactly right that the refugee definition/responsibility assignment separation is the fault line. Camp A sees it as sequential logic (identify then distribute), while B sees circularity (the definition already implies responsibility). I'll make that disagreement row 1 in the table. 

  For duty transfer, Camp A's payment-as-discharge position isn't arbitrary - it's tied to their fairness metric. But Camp B's objection highlights real risks: states might pay less than resettlement actually costs. The evidence crux about "does payment reliably create comparable protection" is perfect because both camps care about outcomes, just weight them differently. 

  Wait - is the "membership as moral fact" debate partly verbal? When Camp B says "birthplace is irrelevant," they mean moral claim strength; Camp A hears "no practical constraints." But B never denies constraints exist. Clarifying that distinction in the verbal slice might prevent talking past each other. 

  User's "foreclosure claimant" framing is genius - it forces both sides to confront their theory's edges. I'll build consensus by focusing on what they agree matters (viable life-sustaining conditions) rather than labels. The prediction mechanism will help too: if Camp A's right that payment works, B should see reduced protection gaps; if not, A must concede system failure. 

  Better include sunk costs in the duty transfer crux - Camp B fears states will underfund if it's cheaper than admitting. That makes the evidence demand concrete: "show us the resettlement actually happened at true cost."
answer: |-
  Here's a joint document designed to force substantive agreement while transparently capturing disagreements, including the core dispute about definition/responsibility sequencing and the "foreclosure claimant" challenge. It avoids platitudes and mandates engagement with a hard case.

  **Joint Statement on Foundational Principles & Unresolved Disputes Regarding Refugee Protection & State Duties**

  **Section 1: Substantive Points of Agreement**

  1.  **Serious Harm as Trigger:** Individuals facing credible, imminent threats of severe bodily harm, persecution (as defined under the 1951 Convention *or* broader systematic denial of fundamental rights), or complete deprivation of life-sustaining necessities (e.g., starvation due to state collapse or blockade) possess a strong moral claim to seek safety and assistance from states capable of providing it. Neither camp disputes the urgency of response in these core cases.
  2.  **Practical Capacity Matters:** The ability of any state to effectively provide protection, including basic rights, security, and essential services, is constrained by material, institutional, and social realities. Absorbing newcomers beyond a certain point can undermine the state's capacity to fulfill its core duties to *anyone* within its jurisdiction, including existing residents *and* those seeking protection. This practical limitation is relevant to responsibility allocation.
  3.  **Causation Creates Heightened Duty:** When a state's deliberate actions (e.g., military intervention, destabilizing sanctions, support for oppressive regimes) or demonstrably negligent policies (e.g., reckless contributions to climate catastrophe) are a significant proximate cause of displacement, that state incurs a heightened remedial obligation towards those displaced.
  4.  **Rescue Imperative & Fair Share:** States possess a basic duty of rescue towards individuals facing the severe harms outlined in Point 1. This duty demands coordinated international action to ensure protection is provided *somewhere*. Determining a "fair share" of this burden requires consideration of relevant factors (e.g., capacity, historical contribution, proximity, cultural ties), though the weighting of these factors is disputed (see Section 2).
  5.  **The "Foreclosure Claimant" Challenge:** Individuals facing displacement due to the *gradual, systemic, and irreversible degradation* of essential life-sustaining conditions (e.g., aquifer collapse rendering agriculture impossible, chronic state neglect leading to total infrastructure failure, climate impacts making habitation non-viable) present a distinct and difficult category. Their situation differs from:
      *   *Convention Refugees:* Lacks pinpointable persecution.
      *   *Sudden Disaster Victims:* Lacks a single catastrophic event.
      *   *Pure Economic Migrants:* Involves fundamental threats to survival/viable existence, not merely seeking better opportunity. **Both Camps Agree:** Existing frameworks inadequately address this category. Denying *any* potential pathway to protection for these individuals solely because their harm lacks a pinpointable event or persecutor is morally problematic and practically unsustainable. A new or significantly adapted protection mechanism is needed.
  6.  **Distinction Has Practical Relevance (But Moral Weight Disputed):** The distinction between someone fleeing imminent, severe harm (refugee) and someone primarily seeking significantly improved economic opportunity (economic migrant) tracks a difference in the *urgency and nature of the threat* they face. **However:** Camp B holds this distinction primarily determines *priority of need*, not the *fundamental moral claim to mobility or opportunity*. Camp A holds this distinction is crucial for determining the *specific type and strength* of the state's duty owed (rescue vs. other considerations).

  **Section 2: Key Unresolved Disputes (Stated as Signable Positions)**

  | # | Camp A Position (Would Sign This)                                                                                                 | Camp B Position (Would Sign This)                                                                                                 | Core Disagreement Focus                                           |
  | :-- | :-------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------- |
  | **1** | Determining *who qualifies* as a refugee (or person owed protection) is a logically prior and distinct question from determining *which specific states* bear the responsibility to admit or assist them; the definition sets the pool, then fair-share principles allocate responsibility. | Defining *who is a refugee* (or person owed protection) inherently and simultaneously defines the *nature of the obligation* owed to them; attempting to separate qualification from responsibility assignment creates a false dichotomy and risks leaving obligations unfulfilled. | **Core Fight:** Sequencing of Definition & Responsibility (User-Identified) |
  | **2** | A state can fully discharge its fair-share duty of rescue towards refugees by providing substantial, reliable financial and operational support for their *resettlement and full integration in a safe third country* that consents to admit them, even if that state admits no refugees directly itself. | The duty of rescue owed to a refugee requires a state, as part of its fair share, to be directly responsible for *admitting them into its own territory and ensuring their rights and integration* if no other state has definitively assumed that specific responsibility; financial support alone is insufficient to discharge the core protective duty. | Duty Transfer / Responsibility Fulfillment                        |
  | **3** | The primary moral weight of state membership/borders lies in defining the *practical scope of enforceable duties to provide specific goods* (like voting rights, welfare benefits); it does not fundamentally diminish the intrinsic moral worth of non-members or their claims to rescue from severe harm *somewhere*. | While state membership determines the *primary agent charged* with fulfilling duties, the *strength of the moral claim* to be rescued from severe harm is fundamentally equal regardless of birthplace; borders are morally arbitrary for assessing the urgency of the claim itself. | Moral Weight of Borders/Membership                                |
  | **4** | "Fair Share" calculation for refugee responsibility must include a strong weighting factor for a state's *absorptive capacity* to successfully integrate newcomers without undermining the provision of essential rights and services to its existing population, even if this means states with lower capacity take fewer people. | While practical integration challenges are real, prioritizing "absorptive capacity" in fair-share calculations risks entrenching global inequality and absolving wealthy states of their obligations; capacity constraints should be mitigated through international support, not used to reduce responsibility. | Weighting Factors in Fair Share (Capacity Emphasis)               |

  **Section 3: Cruxes of the Disagreement & Agreed Tests**

  1.  **Crux: Can responsibility be fairly discharged through funding resettlement elsewhere? (Duty Transfer)**
      *   **Agreed Test/Evidence:** Examination of existing third-country processing/resettlement schemes (e.g., Australia-Nauru, EU-Turkey deal, US-Central America programs). Specifically:
          *   Does funding consistently lead to *comparable* levels of protection (safety, rights, durable solution) as direct admission?
          *   Is protection contingent on the *ongoing* funding and political will of the paying state, or is responsibility genuinely transferred?
          *   What is the track record on processing times, family reunification, and integration outcomes compared to direct admission?
      *   **Camp A Prediction:** Well-funded, well-monitored third-country programs *can* provide equivalent or better protection outcomes than direct admission into states facing severe integration challenges or public backlash. Funding can be a more scalable and efficient fulfillment of duty.
      *   **Camp B Prediction:** Third-country solutions consistently lead to worse protection outcomes (detention, limbo, rights violations) and lower rates of durable solutions. They often shift burdens to less capable states and depend on unstable funding/politics, failing to provide equivalent security and rights. They incentivize paying to avoid responsibility.

  2.  **Crux: Does separating refugee definition from responsibility assignment lead to unmet obligations?**
      *   **Agreed Test/Evidence:** Analysis of historical and current gaps in the international protection system.
          *   Are there identifiable groups widely acknowledged as having valid protection claims who consistently fall through the cracks *because* no state accepts responsibility under existing allocation mechanisms *after* recognition?
          *   Do states use restrictive definitions *because* they fear the subsequent responsibility allocation?
          *   Would a system where recognition *entails* a clear responsibility assignment (like B envisions) demonstrably reduce these gaps?
      *   **Camp A Prediction:** The gaps primarily stem from flawed *allocation mechanisms* and political unwillingness, not the definition/responsibility separation itself. A better-defined fair-share formula is the solution. Merging definition and assignment creates unworkable complexity and reduces flexibility.
      *   **Camp B Prediction:** The current separation is the *primary cause* of protection gaps. States manipulate definitions and shirk allocation precisely because responsibility isn't inherent in recognition. A system binding recognition to responsibility assignment (even if complex) would create stronger accountability and fewer gaps.

  3.  **Crux: How determinative should "absorptive capacity" be in fair-share allocation?**
      *   **Agreed Test/Evidence:** Study of successful and unsuccessful large-scale refugee integration programs.
          *   What measurable thresholds exist where refugee intake demonstrably *causes* significant degradation in access to housing, healthcare, education, or social cohesion for host populations?
          *   Can targeted international support (funding, expertise) effectively mitigate these capacity constraints?
          *   Is there evidence that states citing "capacity" are often masking unwillingness rather than genuine, insurmountable constraints?
      *   **Camp A Prediction:** There are identifiable, objective thresholds beyond which integration fails and harms both newcomers and hosts. Ignoring capacity leads to disastrous outcomes and public backlash that undermines the entire protection system. International support helps but cannot erase fundamental limits.
      *   **Camp B Prediction:** "Capacity" constraints are often politically manufactured or stem from underinvestment. With sufficient political will and international cooperation (funding, burden-sharing, integration support), capacity can be significantly expanded without harming host communities. Overemphasis on capacity perpetuates global injustice.

  **Section 4: Potential Verbal Dispute**

  *   **The Slice:** Part of the disagreement over "whether the refugee/economic migrant line tracks anything morally significant" may be verbal.
  *   **Why:** Both agree severe harm (Point 1) triggers a stronger/rescue-based claim than seeking opportunity. Camp B emphasizes that the *underlying moral claim to move* for a better life might exist on a spectrum, even if the *urgency and duty of rescue* are categorically stronger for refugees. Camp A emphasizes the categorical difference in the *type of duty* owed (rescue vs. other duties related to migration). They agree on the practical distinction's relevance (Point 6) but potentially disagree on whether this reflects a deep moral chasm (A) or a difference in priority/urgency on a spectrum of mobility claims (B). Clarifying if they disagree on the *existence* of any non-rescue mobility claim, or just its *strength relative to rescue*, could reduce heat.

  **Next Steps:** This document mandates:
  1.  Jointly developing a proposal for "Foreclosure Claimants."
  2.  Commissioning joint research/analysis on the Agreed Tests for the Cruxes.
  3.  Continued negotiation on the Unresolved Disputes, informed by evidence gathered in (2).
