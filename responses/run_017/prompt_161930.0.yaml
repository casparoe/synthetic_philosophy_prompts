  ### Scoring Key  
  Tally your answers (A, B, C, D) and map them to the modes below. **Patterns matter more than counts**: your dominant mode is where your answers cluster most consistently.  

  | **Answer Pattern**                     | **Mode**                     | **Core Trait**                                                                 |
  |----------------------------------------|------------------------------|-------------------------------------------------------------------------------|
  | **Mostly A**                           | **Critical**                 | Severs ties to harmful past; history as a courtroom for condemnation.         |
  | **Mostly B**                           | **Antiquarian**              | Roots identity in preservation; cherishes the past as "ours" to protect.      |
  | **Mostly C**                           | **Truth-at-any-price**       | Values accuracy above all; knowledge is sacred, even if it wounds.            |
  | **Mix of A, B, C across contexts**     | **Integrated**               | Flexibly deploys all three Nietzschean modes to serve a living culture.       |
  | **Mostly D**                           | **Hospitable**               | Seeks dialogue with the past; lets it set part of one’s agenda.               |
  | **B in Q2, Q3, Q7; C in Q6, Q8, Q10** | **Monumental**               | Mines history for heroic models to inspire present action.                   |
  | **A in Q4, Q9; D in Q6, Q8**          | **Genealogical**             | Analyzes origins to expose contingency; past as fluid, not fixed.             |
  | **B or C in Q2, Q3, Q5; D in Q4, Q9** | **Forgetting/Eternalist**    | Escapes history’s weight; focuses on timeless truths or present needs.        |

  ---

  ### Diagnosis of Missing/Overlapping Modes  
  - **Collapsed Distinctions**:  
    - *Monumental vs. Antiquarian*: Collapses when the past object is both "great" and "one’s own" (e.g., Q3: Founders as heroes + heritage). Quiz separates them via *intent*: Monumental (B in Q7) *uses* greatness instrumentally; Antiquarian (A in Q1) *reveres* continuity.  
    - *Critical vs. Truth-at-any-price*: Collapses when debunking serves no project (e.g., Q10C). Quiz separates via *motive*: Critical (A in Q1, Q5, Q9) seeks liberation; Truth (C in Q4, Q6) seeks facts regardless of utility.  
  - **Unoccupied/Incoherent Combinations**:  
    - *Truth-at-any-price + Forgetting*: Incoherent—truth-seeking contradicts active ignoring (e.g., choosing C in Q4 + D in Q5).  
    - *Antiquarian + Critical*: Unattractive—preserving while condemning the same object (e.g., B and A in Q1) is psychologically unstable.  
    - *Genealogical + Eternalist*: Unexplored—contingency analysis clashes with timeless truths.  

  ---

  ### Verdict on "Hospitable History"  
  - **Is it distinct?** **Yes**, but fragile. It’s not a repackaged mix (e.g., Integrated uses past for present goals; Hospitable lets past *reshape* goals).  
  - **Exposed by**: **Q1D and Q5C**. These force a choice between instrumental use (A/B/C) and openness to being changed (D). If you chose D here, you lean Hospitable.  
  - **Contradiction risk**: If combined with Forgetting (e.g., D in Q1 but D in Q5), it becomes incoherent—hospitality requires engagement, not avoidance.  

  This quiz isolates instincts—not Nietzschean scholarship. Discuss patterns, not labels, and see where your gut diverges from the group’s.
