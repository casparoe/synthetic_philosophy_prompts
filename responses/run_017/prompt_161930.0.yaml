  4. **Truth commission after a dictatorship**: How should a society deal with the crimes of a past regime?
     - A: Hold public hearings to expose the truth and hold perpetrators accountable. (Critical: condemning the past to move forward)
     - B: Focus on reconciliation and moving forward; too much truth can be divisive. (Forgetting? Or integrated? Or antiquarian if they want to preserve unity and avoid reopening wounds)
     - C: Document everything for the historical record, regardless of the consequences. (Truth-at-any-price)
     - D: Study the period to understand how such a regime could arise and prevent it in the future. (Monumental? Or genealogical? Monumental if they want to avoid past mistakes, genealogical if they study the conditions that led to it.)

     Option D: "Understand the causes to prevent recurrence" could be monumental (using history as a lesson) or genealogical (analyzing the conditions of emergence).

     We can split:
     A: Expose and punish to achieve justice. (Critical)
     B: Let bygones be bygones; focus on rebuilding. (Forgetting)
     C: Record the facts for future generations, even if it causes pain. (Truth-at-any-price)
     D: Analyze the social and political conditions that allowed the dictatorship to happen. (Genealogical)

  5. **Family house built with slave trade money**: Upon discovering this, what do you do?
     - A: Sell the house and donate the money to reparations. (Critical: rejecting the tainted past)
     - B: Keep the house; it's part of your family's history and you are not responsible for the past. (Antiquarian)
