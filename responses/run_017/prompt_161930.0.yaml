  3. **Constitutional originalism**: A judge believes the constitution should be interpreted as the founders intended.
     - A: Yes, we must respect the wisdom of the founders. (Antiquarian or monumental? Monumental if they see the founders as great models, antiquarian if it's about preserving tradition.)
     - B: No, the constitution is a living document that must adapt to new times. (Critical? But critical of the past? Or just not bound by it.)
     - C: We should understand the founders' context but not be bound by it; we must create our own greatness. (Monumental for the present? Or critical?)
     - D: The founders' intentions are irrelevant; we should focus on the timeless principles of justice. (Eternalist)

     Let's refine:
     A: The founders were wise and we should follow their intent. (Monumental: they are models to emulate)
