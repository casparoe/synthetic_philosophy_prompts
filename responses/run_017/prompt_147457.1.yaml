prompt: |-
  I've been reading rationalist blogs and forums since the old Overcoming Bias days, and I've absorbed the standard dialectic on vagueness often enough that I don't need it repeated: the Sorites, the idea that there is a sharp cut-off somewhere in the series that we are in principle unable to locate, versus the supervaluationist picture on which a borderline sentence is true on some admissible precisifications and false on others and therefore neither true nor false outright. What I can't get clear on is whether that disagreement is doing any work in a case my reading group got stuck on last month, after a friend who works on model evaluations described her team's deployment policy.

  The policy says, roughly, that a system may not be deployed if it "engages in scheming," and in practice this cashes out as a reviewer reading sampled chains of reasoning and recording a yes or a no. The borderline cases dominate: a model that reasons about self-preservation in a way that might be instrumental or might just be parroting sci-fi tropes it was trained on; a model that mentions its training process in a context where the mention could plausibly serve a goal; a chain of thought that is only strategic if you read an ambiguous pronoun one way. Nobody thinks a clean answer is waiting to be discovered, and yet a binary gets logged and it gates something that matters.

  Here is what I'd like explained, at a level deeper than the textbook contrast. First, both views are normally illustrated with a Sorites along a single ordered dimension like height or wavelength, but the predicate here looks multidimensional and cluster-like: concealment, instrumental reasoning about the future, resistance to correction, generalization across contexts, and so on, coming apart from each other case by case. Once the space of admissible precisifications is a space of combinations of thresholds over many partly independent features rather than points on a line, does supervaluationism retain any distinctive metaphysical content, or does it quietly collapse into something structurally indistinguishable from epistemicism with extra machinery bolted on — i.e. "there is a correct threshold-combination, we just can't say which"? Relatedly: what does each view say about higher-order vagueness here, given that "admissible precisification" is itself the sort of thing that has borderline cases when the dimensions are many? And is vagueness even the right frame, or is what we have better described as open texture, or as a partly normative or family-resemblance concept whose extension is genuinely underdetermined by usage rather than merely unsharp?

  The part I care most about, though, is the practical upshot, if there is one. Suppose we are forced to pick an operating point and a review protocol, and reviewers will disagree in the penumbra. Is there any principled difference between how an epistemicist and a supervaluationist should set that threshold, treat reviewer disagreement, or think about the error asymmetry between shutting down a benign system and passing a scheming one? Or do both views converge on the same instruction — the semantic facts, such as they are, underdetermine the policy, so go and do decision theory — in which case I'd rather be told that plainly than be handed a manufactured difference. Please be explicit about which parts of your answer are settled and agreed among people who actually work on this, which parts are genuinely contested, and where you are extrapolating beyond anything the literature establishes; flag it rather than smoothing it over if a claim you're making is one a competent philosopher of vagueness would dispute.
reasoning: |-
  Okay, the user is deeply familiar with the standard philosophical debates on vagueness, having followed rationalist discussions since Overcoming Bias. They've encountered the Sorites paradox and the epistemicism vs. supervaluationism split but find textbook explanations inadequate for their real-world problem: AI deployment policies where "scheming" judgments involve multidimensional borderline cases. 

  The user's frustration is palpable - they've absorbed the theoretical framework but need to know if it materially affects practical decisions. Their question has three layers: (1) Does supervaluationism retain meaning in multidimensional contexts? (2) How do higher-order vagueness challenges play out? (3) Crucially, is there any operational difference between philosophical positions when setting deployment thresholds?

  Hmm... their example is telling. When reviewers judge whether an AI's reasoning constitutes "scheming," they're navigating a cluster concept with features like concealment and instrumental reasoning that can conflict. This isn't a tidy height continuum but a messy, high-dimensional space. The user suspects both philosophical approaches might collapse into "just pick thresholds and do decision theory" here - and they want confirmation if that's true.

  What's really smart about their query is how they're pressuring the philosophy to prove its relevance. They're not asking for definitions but demanding: "If I adopt epistemicism over supervaluationism tomorrow, what changes in my deployment protocol?" That's unusually rigorous for non-specialists. 

  I should acknowledge that their intuition about convergence is largely correct - at the policy level, both views do point toward decision theory. But there's nuance in how they frame uncertainty. Epistemicism treats vagueness as ignorance of sharp boundaries, while supervaluationism sees indeterminacy. In practice? Probably negligible difference for setting thresholds, but it affects how we interpret reviewer disagreement: epistemicists might call it measurement error, supervaluationists might see legitimate indeterminacy.

  The higher-order vagueness point is thornier. With multiple dimensions, the "admissible precisifications" boundary itself blurs. Supervaluationists have technical responses (like higher-order precisifications), but these feel increasingly detached from the policy problem. The user's suggestion that "open texture" or family-resemblance concepts might fit better is astute - Wittgensteinian approaches could be more honest about the underdetermination here.

  Most importantly, I must flag where philosophy stops and pragmatism starts. The error asymmetry question (false positives vs. false negatives on scheming) is pure decision theory - no respectable philosopher would claim their vagueness theory dictates whether to err on the side of caution. That's a values call. 

  Key to emphasize: competent philosophers still debate whether supervaluationism "collapses" in multidimensional cases (Sorensen says yes; Keefe pushes back). But for the user's purpose? The actionable takeaway is identical: map the concept's dimensions, quantify tradeoffs, and choose thresholds explicitly. The metaphysics changes the story we tell, not the protocol.
answer: |-
  Your concern cuts to the heart of why applied vagueness matters. Let's dissect this rigorously, flagging settled points, controversies, and practical implications.

  ### 1. **Multidimensionality & the "Collapse" Concern**
     - **Epistemicism**: Asserts a single, sharp (but unknowable) boundary in the multidimensional space. For "scheming," this would mean a specific combination of thresholds for concealment, instrumentality, etc., exists objectively. Reviewer disagreements stem from *ignorance* of this boundary.
     - **Supervaluationism**: Defines "admissible precisifications" as coherent ways to sharpen *all* vague dimensions simultaneously (e.g., different threshold combinations for each feature). A system is *definitely scheming* if it satisfies all thresholds on *every* precisification; *definitely not* if it fails on *every*; *borderline* otherwise.
     - **Does Supervaluationism Collapse?**  
       - **Contested**: Some (e.g., Roy Sorensen) argue high dimensionality makes supervaluationism *structurally isomorphic* to epistemicism: the set of "admissible precisifications" functionally *defines* the hidden sharp boundary. The "indeterminacy" becomes merely epistemic.
       - **Defenders' Response (e.g., Rosanna Keefe)**: Supervaluationism retains distinct metaphysical content:  
         (i) **No "Correct" Threshold-Combination**: It denies any *single* combination is uniquely "true" (unlike epistemicism).  
         (ii) **Penumbral Connections**: It explains logical relations between vague predicates (e.g., no precisification allows both "scheming" and "fully transparent" for the same act).  
         (iii) **Truth-Value Gaps**: Borderline cases lack a truth value *fundamentally*, not just unknown.  
       - **Consensus**: In high-dimensional spaces, *practically distinguishing* the views becomes harder. But metaphysically, supervaluationism denies the *existence* of a sharp boundary epistemicism posits. **Your intuition that it *feels* like epistemicism + machinery isn't wrong for complex cases—but it's not a full collapse.**

  ### 2. **Higher-Order Vagueness (HOV)**
     - **The Problem**: When is a precisification "admissible"? With many dimensions, "admissibility" itself becomes vague (e.g., is *this* weight on concealment *too* extreme?).
     - **Epistemicism**: HOV is just higher-order *ignorance*. There's a sharp boundary between admissible/inadmissible precisifications—we just don't know it.
     - **Supervaluationism**:  
       - **Standard Approach**: Uses a hierarchy of meta-precisifications to define admissibility at each level. Controversial and complex.  
       - **Radical Alternative (e.g., Kit Fine)**: Admits "open texture"—admissibility has *no* precise boundary, even in principle.  
     - **Consensus**: **HOV is unresolved and deeply problematic for *both* theories.** In practice, for your case, it means reviewer judgments about "admissible criteria" will also be inconsistent and penumbral.

  ### 3. **Is Vagueness the Right Frame?**
     - **Open Texture (Waismann)**: Better captures that "scheming" might have *unforeseen* borderline cases (e.g., novel AI behaviors). Vagueness theories often assume all dimensions are known. **Highly relevant here.**
     - **Family Resemblance (Wittgenstein)**: "Scheming" is a cluster concept with no necessary/sufficient conditions. Matches your description of features "coming apart case by case." **This is a strong fit.**
     - **Normative Component**: Deployment rules are *prescriptive*. Whether a behavior "counts as scheming" may depend on ethical/regulatory context, not just semantics. **Crucial point often overlooked in pure semantics.**
     - **Settled Implication**: Pure semantic vagueness theories are *incomplete* for this case. Open texture, family resemblance, and normativity are essential.

  ### 4. **Practical Upshot: Decision Theory is King**
     - **Convergence Point**: **Both epistemicism and supervaluationism (and other theories) agree: semantic underdetermination forces a *pragmatic* choice.** No theory tells you *where* to set thresholds—only that thresholds *must* be set externally.  
     - **Error Asymmetry**:  
       - **False Positive (benign system blocked) vs. False Negative (schemer deployed)** is a *value judgment*, not a semantic one.  
       - **All theories agree**: This asymmetry justifies setting the threshold conservatively (e.g., "err on the side of blocking").  
     - **Treating Reviewer Disagreement**:  
       - **Epistemicist**: Disagreement reflects noise in *measuring* against the hidden boundary. Use statistical aggregation (e.g., majority vote).  
       - **Supervaluationist**: Disagreement may reflect legitimate indeterminacy. Seek consensus on "reasonable" precisifications or accept graded judgments.  
       - **Practical Reality**: For deployment gating, you *need* a binary. **Both views support using calibrated reviewers + adjudication protocols + error analysis.**  
     - **Key Practical Steps (Theory-Neutral)**:  
       1. **Explicate Dimensions**: Define features (concealment, instrumentality, etc.) transparently.  
       2. **Calibrate Reviewers**: Train on clear cases, measure inter-rater reliability.  
       3. **Set Thresholds Explicitly**: Decide *how many* features must be present, at *what severity*, via cost-benefit analysis.  
       4. **Monitor Errors**: Track FPs/FNs and adjust thresholds/definitions iteratively.

  ### Where Philosophers Disagree vs. Where They'd Agree
  | **Claim**                                    | **Settled?** | **Notes**                                                                 |
  |----------------------------------------------|--------------|---------------------------------------------------------------------------|
  | Semantic facts underdetermine policy         | **Agreed**   | Core consensus across all theories.                                       |
  | Decision theory is required for deployment   | **Agreed**   | Even staunch supervaluationists concede this (e.g., Keefe in applied contexts). |
  | Supervaluationism "collapses" in high-D cases | **Contested** | Sorensen vs. Keefe debate; matters metaphysically but not operationally.  |
  | HOV is a solved problem                      | **Disputed** | All major theorists acknowledge severe unresolved issues.                 |
  | Normative/open-texture aspects are essential | **Emerging** | Increasing agreement in applied philosophy (e.g., in AI ethics).          |

  ### Conclusion
  **The philosophical disagreement does no substantive work for your deployment policy.** Both paths lead to the same imperative: **Define your operative thresholds explicitly through democratic, accountable, evidence-based decision-making—not by appealing to metaphysical "truths."** The value of the theories lies not in guiding the policy choice, but in:
  - Explaining *why* reviewers struggle (penumbral cases, HOV),
  - Legitimizing the *need* for arbitrary but reasoned thresholds,
  - Warning against false confidence in binary judgments of borderline cases.

  Your instinct is correct: **"Go and do decision theory" is the only principled takeaway.** Invest in explicating dimensions, quantifying risks, setting thresholds transparently, and building review processes that acknowledge the inevitable penumbra. The metaphysics provides reasons for humility, not operational guidance.
