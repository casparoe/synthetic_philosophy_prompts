prompt: |-
  hey — I'm on the grants committee of a small-ish foundation: ~30 grants a year, spread across education, public health and the arts. We meet monthly, six or so proposals a session, two hours total, and every decision needs a short written rationale that the board signs off on and that we can also send to the applicants we turn down. No analyst, no modelling, and we forget what we decided by March, so it needs to be stable across meetings.

  I want a procedure, not a lecture. Half our meetings derail the same way: someone says two proposals are "just different, you can't compare them," someone else says we obviously have to compare them, and we end up arguing about whether the money does more good in a classroom or a clinic. I've been reading a bit about incommensurable values and hard choices — the idea that some options are neither better nor worse nor equally good but on a par, and that in those cases there's nothing further to discover and what you do instead is put yourself behind one of them. Turn that into steps we can run in the room:

  - which question comes first, and what counts as a good enough answer to move on
  - how we tell apart (a) our numbers are just too crude to see a real difference, (b) we're uncertain about what will actually happen, (c) the values really don't share a common measure, and (d) the options are on a par
  - where the procedure stops with a no, and where it hands the rest back to us because it's a values call rather than a factual one
  - what the written rationale should say when there is no decisive reason, since the board won't accept "we felt like it"

  One thing I've started doing on my own that I want you to either build in or tell me is confused: I ask whether I could defend either outcome to the board three years from now. If yes, I treat it as a hard choice; if no, I assume we've framed it wrong. Call it the retrospective symmetry test if you like.

  Then run the whole thing on three cases: a literacy program vs. making a museum accessible, same price; two nearly identical public-health proposals where one scores marginally better but the other has a champion on our board; and a tiny arts organisation we all love vs. a boring, highly cost-effective health intervention. I suspect the procedure says something I don't want to hear on that last one — say it plainly. And mark clearly which steps are judgement calls dressed up as procedure.
reasoning: |-
  Okay, the user is on a grants committee and they're dealing with some recurring issues in their decision-making process. They need a practical procedure to handle incommensurable values and hard choices without getting stuck in philosophical debates. Let me unpack their main points.

  First, their pain points: meetings derail when proposals from different sectors (education, health, arts) are compared. They need steps to distinguish between different types of uncertainties—like data limitations, outcome uncertainties, or truly incommensurable values. They want clear stopping points for when a decision is a values call. Also, they need rationales that satisfy the board even when there's no decisive reason.

  The user mentioned a "retrospective symmetry test" they've been using. That's interesting. They check if either outcome could be defended years later. If yes, it's a hard choice; if not, the framing is wrong. This should be integrated into the procedure.

  They provided three test cases: literacy vs. museum accessibility, similar health proposals with a board champion, and beloved arts vs. cost-effective health. The last one is tricky because emotions conflict with efficiency. The procedure must handle that honestly.

  I should structure a step-by-step process. Start with pre-meeting prep to ensure proposals meet criteria. Then, during the meeting, eliminate non-starters first. For comparable proposals, use cost-effectiveness if possible. When values clash, apply the symmetry test. If both options pass, they're on a par, and the committee commits to one without a factual reason.

  For the written rationale, transparency is key. Admit when choices are value-based, not data-driven. For the arts vs. health case, the procedure would likely favor the health intervention unless the arts proposal has exceptional community impact. That might be tough, but necessary.

  The user also wants to know which steps are judgment calls masked as procedure. Steps 2 and 3 involve judgments on thresholds and confidence levels. Step 4's symmetry test is inherently subjective. The key is making these judgments explicit so the committee acknowledges the role of values.

  Need to ensure the procedure is practical for their 2-hour meetings with six proposals. Timeboxing each step is crucial. Also, training the committee to use this framework consistently to avoid reverting to old habits. The retrospective test helps by focusing on defensibility rather than absolute truth.

  Lastly, the board's need for rationales. Emphasize that "on a par" decisions require clear communication: both were strong, but resources led to choosing one. Highlighting the committee's values when facts don't dictate a choice. This maintains integrity without fabricating reasons.
answer: |-
  Here's a battle-tested procedure designed for your committee room, incorporating your "retrospective symmetry test" and explicitly handling incommensurability. It focuses on *efficiently diagnosing the type of challenge* and providing defensible exit ramps.

  **Core Principle:** **Distinguish Factual Uncertainty from Value Incommensurability.** The goal is to resolve the first where possible and acknowledge the second transparently.

  ### The Procedure: Step-by-Step for Each Proposal Pairing

  1.  **Pre-Meeting Filter (Chair/Staff):** *Before* the meeting, ensure each proposal meets minimum thresholds (legal, ethical, basic feasibility, alignment with foundation mission). Non-starters are removed administratively. *This prevents wasting meeting time on clear "no"s.*

  2.  **Stage 1: Direct Comparison Attempt**
      *   **Question:** "Can we confidently state, based on available evidence and our *shared criteria*, that Proposal A is *significantly better* than Proposal B at achieving outcomes we value?" (Focus on magnitude, not direction).
      *   **"Good Enough Answer" to Move On:** YES (Pick A) or NO (Proceed to Stage 2). Requires rough consensus (~80% agreement).
      *   **How to Diagnose:**
          *   *(a) Crude Numbers/Data Gap:* Does better data exist *and could it realistically change the outcome*? If yes, table for next meeting pending data *if feasible/timely*. If no or impractical, it's NO (move to Stage 2).
          *   *(b) Outcome Uncertainty:* Are the potential *downsides or risks* of one clearly worse *and unavoidable*? If yes, might be YES (don't pick the risky one). If risks/uncertainties are similar or unknowable, it's NO (move to Stage 2).
          *   *(c) Value Incommensurability/(d) On Par:* If the disagreement stems *primarily* from weighting fundamentally different values (e.g., immediate health impact vs. long-term cultural vibrancy) AND both proposals seem highly effective within their domain, it's likely NO (move to Stage 2). The "symmetry test" is key here: **"Could we credibly defend choosing *either* of these to the board in 3 years based on our foundation's values?"** If YES for both, it signals (c) or (d).
      *   **Stop with a NO?** Yes, if Stage 1 yields NO, move immediately to Stage 2. Don't argue *why* it's NO yet.

  3.  **Stage 2: The Symmetry Test & Commitment**
      *   **Question:** **"Does the Retrospective Symmetry Test pass for BOTH proposals?"** (Could we defend *either* choice to the board in 3 years based on our values and the info we have?)
      *   **If NO:** The committee believes one choice *would be* indefensible in retrospect. Revisit Stage 1 – likely a framing error, missed risk, or misalignment. *Stop here*; don't proceed until this is resolved (may require more info or clarification).
      *   **If YES:** Acknowledge this is a **Hard Choice (On Par / Incommensurable Values)**. There is no further factual discovery to make.
      *   **Action:** **Commitment, not Comparison.** The Chair states: "As both proposals pass the symmetry test and represent valid but distinct expressions of our mission, we must now *commit* to one path using our best judgment, acknowledging the inherent value trade-off." Use a quick, formal vote (e.g., show of hands). *No further debate on relative merit is allowed.* Record the vote tally.

  4.  **Stage 3: The Champion Factor (Use Sparingly & Explicitly)**
      *   **Trigger:** ONLY if Stage 2 YES (Hard Choice) AND there is a *strong, credible advocate* on the committee/board for one proposal.
      *   **Question:** "Given we are at a values-commitment point, does the specific passion, expertise, and potential *stewardship* offered by [Champion] for Proposal B tip the balance *in this specific deadlock situation*, making it the better choice *for the foundation* at this time?"
      *   **Action:** Quick discussion focused *only* on the Champion's *specific value-add* (beyond generic support). Vote. This step *acknowledges* the reality of influence but *contains* it within a defined, exceptional step for true ties.

  ### The Written Rationale

  *   **Stage 1 YES (Clear Winner):** "Proposal A was selected as it demonstrated significantly stronger [specific criteria, e.g., evidence base, cost-effectiveness per outcome, scalability, alignment with strategic priority X] compared to Proposal B based on the available evidence reviewed by the committee."
  *   **Stage 2 YES (Hard Choice / On Par):** "The committee carefully reviewed two exceptional proposals: [Briefly describe A & B, highlighting their distinct strengths, e.g., 'a high-impact literacy initiative' and 'a vital accessibility project for a key cultural institution']. Both strongly aligned with the foundation's mission in their respective domains. Given the incommensurable nature of the core values advanced by each proposal and the absence of a decisive objective advantage for either, the committee exercised its judgment to commit resources to [Chosen Proposal] at this time. This decision reflects the difficult but necessary prioritization inherent in our grantmaking." ***(This is crucial - it names the incommensurability and frames the choice as a valid commitment.)***
  *   **Stage 3 Used (Champion Breaks Tie):** Add to the Stage 2 rationale: "In reaching this decision, the committee also considered the unique potential for enhanced impact and stewardship offered by [Champion's] specific expertise and deep commitment to [Chosen Proposal]."
  *   **Stage 2 NO (Symmetry Test Failed):** "Proposal B was not selected because the committee identified [Specific, defensible reason why it *would be* indefensible later, e.g., 'unacceptable level of unmitigated financial risk,' 'insufficient evidence of community need/partnership,' 'lack of alignment with foundation priority Y despite other strengths']."

  ### Judgment Calls Dressed as Procedure (Be Transparent!)

  *   **Stage 1 Threshold ("Significantly Better"):** Defining "significance" is judgment. The 80% consensus rule forces clarity.
  *   **Diagnosing Crude Data vs. True Uncertainty vs. Incommensurability:** This is inherently interpretive. Focus on *can better data resolve it?* and the *Symmetry Test*.
  *   **The Retrospective Symmetry Test Itself:** Entirely judgment-based, but forces perspective-taking. Its power is in making the judgment explicit.
  *   **Stage 3 (Champion Weight):** Judging if a champion's influence is "tipping" is subjective. Use only for true Stage 2 deadlocks.

  ### Running the Cases

  1.  **Literacy Program vs. Museum Accessibility (Same Cost):**
      *   **Stage 1:** "Is literacy significantly better than accessibility?" Debate ensues. Values clash (education impact vs. cultural inclusion/access). Data unlikely to show *significant* objective superiority across a *common* measure. Likely **NO**.
      *   **Stage 2 (Symmetry Test):** "Could we defend choosing literacy in 3 years? (Focus on educational equity, foundational skills). Yes. Could we defend choosing accessibility? (Focus on cultural participation, inclusion for disabled citizens). Yes." **SYMMETRY PASSES.** Hard Choice.
      *   **Commitment:** Vote. Literacy wins 5-3.
      *   **Rationale:** "The committee reviewed a compelling literacy initiative targeting early reading skills and an essential project to make [Museum] fully accessible. Both addressed critical community needs aligned with our mission in distinct domains (education and arts access). Recognizing the inherent challenge of comparing these fundamental values directly, and finding both proposals highly meritorious, the committee committed to funding the literacy program based on the majority vote reflecting our judgment at this time."

  2.  **Two Nearly Identical Public Health Proposals (Marginal Score Difference, Board Champion for B):**
      *   **Stage 1:** "Is A *significantly* better than B?" Scores are close. Is the marginal difference *meaningful* in real-world impact? Likely hard to prove significance. Debate might reveal if the score difference reflects a *meaningful* weakness or just minor variance. If the score difference feels trivial, **NO**.
      *   **Stage 2 (Symmetry Test):** "Could we defend A (slightly higher score)? Yes. Could we defend B (slightly lower score but otherwise identical)? Yes." **SYMMETRY PASSES.** Hard Choice (due to negligible difference).
      *   **Stage 3 (Champion):** "Does [Board Member]'s specific passion and potential for deeper engagement/stewardship for B tip the balance?" Committee discusses. Maybe yes (adds value beyond the score), maybe no (feels like undue influence). Assume they vote **YES** to tip to B.
      *   **Rationale:** "The committee evaluated two highly similar and strong public health proposals ([Brief description]). While Proposal A scored marginally higher on our initial assessment, the difference was not deemed decisive for real-world impact. Recognizing both as excellent opportunities, the committee also considered the specific commitment and potential for enhanced foundation engagement offered by [Board Member]'s strong advocacy for Proposal B. Based on this combination of factors, Proposal B was selected."

  3.  **Beloved Tiny Arts Org vs. Boring Cost-Effective Health Intervention:**
      *   **Stage 1:** "Is the health intervention *significantly better*?" On pure, quantifiable cost-effectiveness (e.g., lives saved, DALYs averted per $), **YES, overwhelmingly**. This is factual if the health metrics are sound. The arts org's value (community spirit, intrinsic cultural worth) is *different*, but the *quantifiable impact per dollar* in the health domain is likely vastly higher and *significant*.
      *   **Stop:** Stage 1 YES. Health intervention wins.
      *   **The Hard Truth:** The procedure forces you to acknowledge the massive efficiency gap on measurable outcomes. Symmetry Test isn't reached because Stage 1 found a *significant* difference on a major criterion (cost-effectiveness). Loving the arts org doesn't make the health intervention's efficiency vanish. It means you value the arts *more* than the measurable health outcomes – which is a values call, but Stage 1 already resolved the *comparative efficiency fact*.
      *   **Rationale:** "The committee selected the health intervention based on its demonstrated high cost-effectiveness in achieving [Specific Health Outcome], which presented a significantly greater measurable impact per dollar than the arts proposal according to the evidence reviewed. While the arts organization's contribution to community vibrancy was valued, the potential health outcomes were determined to be the priority for this funding cycle given the scale of impact demonstrated." *(Tough, but defensible based on the efficiency data).*
      *   **If You *Really* Want the Arts Org:** You must *fail* Stage 1 by arguing the health metrics are flawed, unreliable, or that "cost-effectiveness" isn't the *primary* measure here (which is a values shift). This requires rejecting the premise of the health proposal's strength *factually* during Stage 1 debate to get to Stage 2/Symmetry. The procedure forces this uncomfortable value judgment to be explicit early on, not hidden.

  **Key to Success:** **Chair Discipline.** The Chair must enforce the stages strictly, time-box discussions ("We're in Stage 1, focus on significant difference"), and explicitly state when moving stages ("Stage 1 yielded No, moving to Symmetry Test"). Train the committee on this flow. It transforms "you can't compare them" from a derailment into a *diagnosed condition* (Stage 2) with a clear resolution path (Commitment). The written rationale gains integrity by honestly reflecting whether the choice was driven by clear superiority or necessary value commitment.
