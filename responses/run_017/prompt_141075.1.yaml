answer: |-
  Below is an 8-question quiz designed to diagnose forecasting epistemologies through concrete cases. Each question avoids jargon and presents three intuitive options. The **scoring key** maps answer patterns to seven epistemological "leaves" (positions) based on logical branching, with notes on limitations and edge cases. The quiz takes ~20 minutes and is structured to force trade-offs.

  ---

  ### **Quiz: How Do You Approach Uncertainty?**
  *For each scenario, pick the option closest to your instinct. There are no trick questions.*

  1. **Ceramics Studio**  
     A friend with a waiting list for her pottery plans to quit her job and open a studio. A landlord will cover renovations. How do you estimate her odds of success?  
     - **A**: Use statistics for *all* small craft businesses (e.g., "40% survive 3 years").  
     - **B**: Focus *only* on her situation: waiting list, landlord support, and her skills.  
     - **C**: Start with the 40% statistic but nudge it up slightly due to her advantages.  

  2. **Wedding Budget**  
     Your sister’s wedding plan has a $20k budget. Industry data shows average weddings run 20% over budget. How do you predict hers?  
     - **A**: Predict 20% over—it’s the average for a reason.  
     - **B**: Audit her specific plan (e.g., caterer costs, her organization skills) to estimate overrun.  
     - **C**: Ignore averages; her detailed budget is all that matters.  

  3. **Running Injury**  
     A runner has a moderate Achilles strain. Medical guidelines say 6–8 weeks to heal. How do you advise them?  
     - **A**: Plan for 6–8 weeks—it’s the standard recovery window.  
     - **B**: Adjust the estimate using their age, fitness, and rehab habits.  
     - **C**: Prepare for a worst-case scenario (e.g., 12 weeks) since outliers happen.  

  4. **Grant Application**  
     A colleague applied for a competitive grant (10% funding rate). Their proposal is strong. What’s their chance?  
     - **A**: ≈10%—that’s the base rate.  
     - **B**: Higher than 10% because their proposal stands out.  
     - **C**: The 10% rate hides why some succeed; focus on their proposal’s strengths.  

  5. **IT System Rebuild** *(You can influence the outcome)*  
     Your friend’s company is redoing a failed IT project. You’re advising them. How do you approach this?  
     - **A**: Use failure rates for similar projects as the forecast.  
     - **B**: Diagnose why the first attempt failed and forecast based on fixes.  
     - **C**: Skip predicting; design the project to test small steps and allow reversals.  

  6. **Restaurant Opening** *(Telling the forecast changes behavior)*  
     A friend considers opening a restaurant. You know 60% fail in 3 years. What do you say?  
     - **A**: Share the 60% failure rate bluntly.  
     - **B**: Discuss factors that predict failure (e.g., location, experience) and how they compare.  
     - **C**: Avoid statistics; brainstorm ways to make their concept resilient.  

  7. **Startup Success** *(Tails matter)*  
     A friend starts a tech company. Most fail, but a few become billion-dollar "unicorns." How do you assess their prospects?  
     - **A**: Likely failure—most do.  
     - **B**: Estimate probabilities for outcomes: failure ($0), moderate success ($10M), or unicorn ($1B+).  
     - **C**: Don’t forecast; advise building flexibility to pivot cheaply.  

  8. **Election Prediction** *(Gerrymandered reference class)*  
     An unpopular incumbent mayor runs for re-election. Their party wins 70% of races locally. What’s their win chance?  
     - **A**: ≈70%—historical party performance is key.  
     - **B**: Below 70% due to their low approval ratings.  
     - **C**: Use win rates for *unpopular* incumbents specifically.  

  ---

  ### **Scoring Key: Mapping Answers to Epistemological Leaves**
  **How it works**:  
  - Each letter choice (A/B/C) corresponds to a branch in the logical space of forecasting.  
  - The **primary branching dimensions** are:  
    1. **Reference class usable?** (Y/N) → Outside view’s viability.  
    2. **Outcome alterable by forecast?** (Y/N) → Suspend if forecast changes behavior.  
    3. **Inside view as evidence or story?** (Evidence = covariate data; Story = uniqueness)  
    4. **Seeking central tendency or tails?** → Tails demand robustness.  
  - Answers are tallied to place respondents in one leaf. **Leaves in bold**; *italicized* answers are strong indicators.  

  | Leaf                          | Answer Pattern                                  | Logical Branches Covered                                                                 |
  |-------------------------------|------------------------------------------------|------------------------------------------------------------------------------------------|
  | **1. Inside-view-only**       | *Q1B, Q2C, Q3B, Q4B, Q6C, Q8B*                 | Ref class: N (unusable). Inside view: Story. Ignores alterability/tail risks.            |
  | **2. Outside-view anchor + adjust** | *Q1C, Q2B, Q3B, Q4C, Q8B*              | Ref class: Y. Inside view: Modest evidence. Seeks central tendency. Ignores alterability.|
  | **3. Outside prior + inside likelihood** | Q4B, Q6B, Q8C                          | Ref class: Y. Inside view: Evidence (covariates). Treats forecast as fixed.              |
  | **4. Outside-view-only**      | *Q1A, Q2A, Q3A, Q4A, Q6A, Q8A*                 | Ref class: Y. Inside view: Irrelevant. Rejects alterability/tail risks.                 |
  | **5. Inside as covariate-hunting** | *Q2B, Q4C, Q6B, Q8C*                   | Ref class: Y. Inside view: Evidence (covariates). Uses it to refine reference class.     |
  | **6. Borrowed-authority suspicion** | Q1B, Q4C, Q8A                          | Ref class: Y but suspect (gerrymandered). Inside view: Story. Skeptical of base rates.   |
  | **7. Suspend forecast**       | *Q5C, Q6C, Q7C*                                | Alterability: Y or tails: Y. Focuses on robustness/reversibility over prediction.        |

  **Unoccupied combinations & why**:  
  - **Alterable + outside-view-only**: Incoherent—if you can change outcomes, pure outside view is useless.  
  - **Tails + inside-view-only**: Unattractive—inside views often miss tail risks.  
  - **Gerrymandered + suspend**: Unexplored—most either fight gerrymandering or avoid forecasting.  

  **Ambiguous cases the quiz can’t split**:  
  - **Covariate-hunting (5) vs. Prior+likelihood (3)**: Both use inside view for evidence. Split by *whether they adjust the reference class* (Q8C → 5; Q4B → 3).  
  - **Borrowed-authority (6) vs. Inside-view-only (1)**: Both distrust reference classes. Split by *whether they engage statistics at all* (Q8A → 6; Q1B → 1).  

  ---

  ### **Where This Instrument Lies**
  **Expected mis-sorting**:  
  1. **Q5 (IT System)**: Answers B (diagnose failures) attract both **inside-view-only (1)** and **covariate-hunting (5)**. Why? B doesn’t clarify if the diagnosis *replaces* statistics (→1) or *refines* them (→5).  
  2. **Q7 (Startup)**: Answer B (estimate distribution) draws **prior+likelihood (3)** and **covariate-hunting (5)**. Why? Estimating tails doesn’t reveal if it’s Bayesian (3) or covariate-driven (5).  

  **Indistinguishable pair**: **Borrowed-authority (6) and inside-view-only (1)** blur if respondents reject *all* reference classes (→1) or just *suspect* them (→6). The quiz uses Q8A to hint at 6, but in practice, answers overlap.  

  **Redraw the branching if**:  
  - You show me cases where **alterability** (e.g., self-fulfilling prophecies) coexists with strong **outside-view anchoring**. (Current structure treats these as incompatible.)  
  - You prove **tail-seeking** systematically changes how people use *inside views* (e.g., stories become evidence).  
  - You argue **calibration** (not just accuracy) reshapes epistemology—e.g., outside-view users might suspend if they care about calibration under uncertainty.  

  ---

  **Fair complaints from users**:  
  - *"Q6 (Restaurant) forces a false choice!"* Yes—real advice blends B and C, but the quiz forces prioritization.  
  - *"Q3 (Injury) ‘adjust based on factors’ (B) could be covariate-hunting!"* True, but covariate-hunters would *also* pick Q8C or Q6B.  
  - *"Suspend forecast (7) feels like dodging!"* Deliberate—it’s a valid meta-epistemology for chaotic contexts.  

  This tool **exposes instincts**, not truths. Use it to spark reflection, not end debates.
