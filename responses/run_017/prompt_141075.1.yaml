     Given the time, we deliver the quiz as is, and in the "where-this-instrument-lies" section, we note that Q5B is ambiguous and might be claimed by both anchor-adjust and inside-view-only.

     Similarly, for covariate-hunting, we only have two questions, so if they answer covariate in those two, and in others they do something else, then we assign covariate-hunting.

     Scoring algorithm:

     - Count for each leaf the number of matching answers.

     Leaves and their matching answers:

     - O (outside-view-only): Q1A, Q2A, Q3A, Q4A, Q5A, Q6A, Q7A, Q8A
