  Hmm, the user is chairing a Serious Incident Review Panel at a teaching hospital and needs a practical procedure to handle moral luck in their adjudications. They've clearly thought deeply about this - they're familiar with moral philosophy concepts but need something operational within tight constraints (90 minutes per case, no philosophers on panel, legal/HR pressures). 

  What they're really wrestling with is the fundamental tension between moral ideals and institutional reality. Their Luck Ledger and Counterfactual Twin Memo show they grasp the theory, but the hospital's asymmetry problem (only seeing bad outcomes) creates practical injustice. They need a way to prevent outcome bias from distorting sanctions while maintaining institutional legitimacy.

  Key challenges jump out: 
  First, their Detection Discount idea is theoretically sound but practically treacherous - telling regulators "we're lenient because most errors go unreported" could backfire spectacularly. 
  Second, case three exposes how the disposition options themselves may be flawed when systemic failures collide with individual accountability. 
  Third, there's unspoken tension between their moral clarity ("blameworthiness ≠ sanction") and the panel's performative role - the written record must simultaneously satisfy families (emotional closure), regulators (accountability theater), and unions (procedural defense).

  The procedure must ruthlessly prioritize operationalizability. That means:
  - Dropping constitutive luck (too metaphysical for 90min)
  - Simplifying the Luck Ledger to two questions: "Would we see this case if harm didn't occur?" (reporting luck) and "Was harm necessary to reveal the risk?" (resultant luck)
  - Making the Counterfactual Twin Memo non-negotiable - it's the only bulwark against hindsight bias
  - Accepting that some cases (like the surgeon's) may yield no individual disposition when responsibility is diffuse

  For case one: The near-identical nurses highlight outcome bias. Procedure must assign identical dispositions (formal remediation for both - the shortcut endangered patients regardless of outcome). The gap perception problem isn't moral but communicative - we'll need transparent scripting about why outcomes don't affect culpability.

  For case two: This breaks the panel's framework. 400 unchecked operations show systemic failure. Individual sanctions would scapegoat. Procedure should halt at "no defensible individual disposition" and trigger a separate system review. Their Detection Discount concern is valid but misapplied - the issue isn't discounting sanctions but recognizing when sanctions are inappropriate tools.

  For case three: Perfect storm of bad luck and bad systems. Constitutive luck (sleep disorder) and reporting luck (prior unreported incidents) mean blameworthiness approaches zero. But HR wants precedent, regulator wants blood. Procedure yields coaching (lowest sanction) as institutional compromise. The honest move? Tell family "system failed you" while referring regulator to rota gaps - but the disposition categories force hypocrisy.

  The core tension: The panel's records try to be both moral accounting (backward-looking) and risk management (forward-looking). These require different languages. We might need parallel documents - one for blame-assessment, one for corrective action - but that's beyond current scope.

  Final answer must be COACHING for case three - it's the least unjust option within broken constraints. The summary will emphasize this procedure isolates culpability but can't fix outcome theater.
answer: |-
  ### Proposed Procedure: The Culpability Isolation Protocol  
  **(Runs in 90 minutes; questions in sequence; panel votes after each step. Majority decides. Stops if consensus fails.)**  

  1. **Conduct Assessment (15 mins)**  
     *Question:* "Ignoring the outcome, what was the *intentional conduct* (acts/omissions)?"  
     *Sufficiency:* Concrete description of behavior (e.g., "skipped insulin check"). If unclear, stop—no disposition.  
     *Lay hold:* "What did they *do*, not what happened?"  

  2. **Risk Severity (10 mins)**  
     *Question:* "How severe was the *foreseeable risk* of that conduct *before* the outcome?"  
     *Sufficiency:* Low/Medium/High based on clinical norms (e.g., skipping insulin check = High).  
     *Lay hold:* "How bad *could* this have been?"  

  3. **Counterfactual Twin Memo (15 mins)**  
     *Question:* "What disposition would we assign if the outcome were *median* (e.g., no harm)?"  
     *Sufficiency:* Written memo *before* outcome discussion. If impossible, stop—judgment contaminated.  

  4. **Luck Ledger (15 mins)**  
     - *Resultant Luck:* "Did the outcome reveal new facts about *conduct*?" (If yes, revisit Step 1).  
     - *Reporting Luck:* "Would this case exist without the bad outcome?" (If no, apply Detection Discount).  
     *Lay hold:* "Did the harm *teach* us new care failures? Did detection rely on luck?"  

  5. **Detection Discount (10 mins)**  
     *Question:* "Estimate ratio of undetected:detected similar conduct. Discount outcome-based sanction by this ratio."  
     *Sufficiency:* Panel consensus or institutional data. If ratio unknown, outcome *cannot* justify sanction.  

  6. **Disposition Assignment (15 mins)**  
     *Question:* "Apply Step 3’s counterfactual disposition, adjusted *only* by new conduct evidence (Step 4) or Detection Discount (Step 5)."  
     *Stop if:* No defensible individual culpability (e.g., pure system failure).  

  **Values Handoff Points:**  
  - Step 2 (Risk Severity): Requires clinical judgment.  
  - Step 5 (Detection Discount): Requires estimation ethics.  
  - Step 6: Final disposition rests on moral agency assessment.  

  ---  
  ### Case Applications  
  **Case 1 (Nurses):**  
  - **Conduct:** Both skipped mandatory insulin check (High risk).  
  - **Counterfactual Twin:** Formal remediation for both (systemic safety breach).  
  - **Resultant Luck:** Outcome taught nothing new about conduct.  
  - **Reporting Luck:** First nurse caught only via audit—high Detection Discount (undetected ratio ~10:1?). Outcome irrelevant.  
  - **Disposition:** Both get formal remediation. Gap must be zero.  
  - **Handling Perception:** State plainly: "Culpability lies in the act, not the lottery of harm. Identical acts warrant identical accountability."  

  **Case 2 (Surgeon):**  
  - **Conduct:** Allowed retrospective checklists for 2 years (High risk; bypassed safety step).  
  - **Counterfactual Twin:** Formal remediation (pattern enabled harm).  
  - **Resultant Luck:** Death revealed no new facts—flaw was known.  
  - **Reporting Luck:** Case exists only due to outcome. Detection Discount applies (undetected ratio ~400:1). Outcome-based sanction reduced to near-zero.  
  - **Disposition:** Formal remediation for surgeon (culpable pattern). *Not* dismissal/referral—death not attributable to *individual* beyond the pattern.  
  - **Why Surgeon?** They instigated the norm; manager tolerated but didn’t create it.  
  - **Detection Discount:** Moral requirement. Sanctioning based on 1/400 is punishing luck.  

  **Case 3 (Junior Doctor):**  
  - **Conduct:** Failed to escalate deteriorating patient (Medium risk—context: unfamiliar protocol, sleep disorder).  
  - **Counterfactual Twin:** Coaching (new doctor, systemic rota gaps).  
  - **Resultant Luck:** Pharmacy error unrelated to her conduct.  
  - **Constitutive Luck:** Sleep disorder—discounts culpability (not fully agential).  
  - **Reporting Luck:** 3 unreported near-misses—Detection Discount ~3:1. Outcome irrelevant.  
  - **Disposition:** **COACHING** (lowest sanction). Outcome cannot justify referral.  
  - **Acknowledgment:** Tell family: "System failed your loved one." Tell regulator: "No individual culpability merits referral; systemic fixes underway."  
  - **Option Set Problem:** Yes—options conflate blame and risk management. "No action" should be viable without implying exoneration.  

  ---  
  ### Limits and Doubts  
  1. **Blame vs. Sanction in One Record:** Incoherence is unavoidable. The record *must* separate sections:  
     - *Culpability Findings* (backward-looking): "Conduct X was blameworthy; outcome influenced by luck."  
     - *Disposition* (forward-looking): "Remediation Y addresses risk."  
     Union/family/regulator each read for their needs—no single narrative.  
  2. **The Lottery Problem:** Panels *are* administering a lottery. The honest response: "We judge only what reaches us. We correct for detection bias where possible. We advocate for better incident reporting."  

  ---  
  Summary: Isolates culpability from luck; cannot fix outcome theater in public accountability.  
  \answer{COACHING}
