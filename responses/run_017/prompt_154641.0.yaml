answer: |-
  Below is a draft adversarial collaboration document designed for both signatories ("Temporal" and "Agential") to endorse as a foundation for resolving their dispute. It structures the debate, isolates disagreements, and sets testable cruxes—including your "stuck akrasia" case and an original empirical design. Crucially, it **does not adjudicate**; it maps the battlefield.

  ---

  **Adversarial Collaboration: Weakness of Will, Discounting, and Agency**  
  *Jointly Drafted by [Temporal Signatory] & [Agential Signatory]*

  ### 1. Agreed Foundational Claims  
  *(Both parties endorse these as descriptively accurate or uncontroversial)*  

  1.1 **Phenomenology**: Ordinary attributions of "weakness of will" (akrasia) typically refer to cases where an agent:  
     - (a) Acts contrary to their own prior or reflective judgment about what is best/all-things-considered (ATC) better;  
     - (b) Experiences this as a failure of "self-control," "willpower," or "resolve."  
     - (c) Folk psychology treats "willpower" as a limited resource that can be depleted or strengthened.  

  1.2 **Discounting Models**:  
     - Hyperbolic/present-biased discounting robustly predicts preference reversals: a smaller-sooner (SS) reward is preferred to a larger-later (LL) reward as delay to SS shortens, even if LL was preferred earlier.  
     - This model explains many impulse-driven behaviors (e.g., procrastination, addiction relapses, diet lapses) where proximity matters.  
     - It **does not** directly explain cases where the agent reports *no shift in judgment* at the moment of action.  

  1.3 **Limits of Lab Evidence**:  
     - Delay discounting tasks (e.g., "choose $10 now vs. $20 in a week") measure time preference, not necessarily akrasia.  
     - Akrasia requires a *normative conflict* (the agent believes A is better but does B). Discounting tasks often lack this; subjects may see SS as "better" when choosing it.  

  1.4 **Normative Relocation**:  
     - Framing akrasia as intertemporal conflict between "selves" (e.g., present-self vs. future-self) or invoking commitment devices (e.g., Ulysses contracts) **shifts** normative questions (e.g., "Which self's preferences should win?") but does not **dissolve** them.  

  ---

  ### 2. Disagreements Table  
  *(Each row states a disputed claim in terms acceptable to the named party; "Substantive" = disagreement over mechanisms/nature of phenomenon, "Verbal" = disagreement over definitions)*  

  | # | Temporal Side’s Claim (Acceptable Wording)                                                                 | Agential Side’s Claim (Acceptable Wording)                                                                 | Type       |  
  |---|-------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|------------|  
  | 1 | Akrasia is fundamentally a *diachronic* phenomenon: it arises from dynamic preference reversals due to temporal proximity. | Akrasia is fundamentally a *synchronic* phenomenon: it requires a conflict between concurrent judgment and action at t₁. | Substantive |  
  | 2 | What folk call "willpower" is best modeled as the modulation of discount rates (e.g., lowering β in (β,δ) models). | "Willpower" denotes a capacity for synchronic self-governance: aligning action with ATC judgment *despite* counter-motivational pulls at t₁. | Substantive |  
  | 3 | If judgment shifts to favor SS at t₁ (e.g., "This cake is worth it now"), no akrasia occurs—just rational time-sensitive preference. | Akrasia occurs *only* if the agent's ATC judgment *at t₁* still favors LL/abstention, yet they act otherwise. | Substantive |  
  | 4 | "Stuck akrasia" (inaction without judgment shift) is either (a) misdescribed, (b) pathological (e.g., executive dysfunction), or (c) involves covert proximity (e.g., immediacy of effort). | "Stuck akrasia" is a core case exposing akrasia’s synchronic core: failure of intention-execution without diachronic preference reversal. | Substantive |  
  | 5 | Commitment devices "solve" akrasia by altering choice architectures to prevent preference reversals. | Commitment devices circumvent akrasia but do not address its synchronic structure; they bypass the need for willpower at t₁. | Verbal/Substantive |  

  ---

  ### 3. Cruxes and Testable Predictions  
  *(Concrete questions/sub-questions that distinguish positions; each includes a shared case/experiment and advance predictions)*  

  #### Crux 1: Does akrasia require synchronic judgment-action conflict?  
  - **Case**: "Stuck Akrasia" (as described by reading group):  
    - *Agent intends to start work at 9 AM, judges it best/all-things-considered, and remains seated without distraction until 10 AM—when a colleague enters, prompting action. No reported change in judgment.*  
  - **Temporal Prediction**: This is not akrasia. It reflects: (a) covert proximity (e.g., aversion to *starting* is "sooner" than rewards of work), (b) misreported judgment shift, or (c) non-akratic executive failure.  
  - **Agential Prediction**: This is paradigmatic akrasia: synchronic failure to enact an unchanging intention/judgment.  

  #### Crux 2: Can discounting explain "cue-triggered" akrasia without temporal proximity?  
  - **Empirical Design**: *Real-Time Experience Sampling*  
    - **Method**: Participants (e.g., dieters, students) carry devices prompting 5x/day reports during temptation episodes (e.g., passing a bakery, opening a game app). Each report records:  
      - (a) Current action (resisting/yielding/neutral).  
      - (b) Current ATC judgment ("Is abstaining better *now*?" scale 1–10).  
      - (c) Temporal proximity of temptation (0 if immediate, e.g., cake in hand).  
    - **Critical Condition**: Episodes where *both options are equally temporally proximate* (e.g., choosing between salad and pizza *now*; starting work vs. scrolling *now*), but one is "tempting" due to salience, ease, or cues.  
  - **Temporal Prediction**: When options are equally proximate, no akrasia will occur. Yielding will correlate with *reported judgment shifts* (e.g., "Pizza is better now"). If yielding occurs without shift, it reflects measurement error.  
  - **Agential Prediction**: Akrasia (yielding despite reporting higher ATC for abstention) will occur in equal-proximity trials, driven by cue salience or effort aversion—not temporal discounting.  

  #### Crux 3: What does "judgment" refer to in akrasia?  
  - **Case**: Addicts who sincerely state "I shouldn’t use now" but use anyway.  
    - *Argument*: Temporal: Their "should" judgment is future-oriented ("I shouldn’t have used" post-hoc). Agential: Their synchronic ATC judgment opposes use but is overridden.  
  - **Shared Test**: fMRI/eye-tracking during craving: If neural correlates of "value" (e.g., vmPFC) track *temptation* during akrasia, not stated ATC judgment, this supports Temporal. If they track ATC judgment but motor cortex still initiates action, supports Agential.  

  ---

  ### Drafter’s Note  
  **Confidence in Acceptance**:  
  - High (>90%) that both sides will endorse their respective wording in §2 (Rows 1–4). Disagreements are sharp but fairly framed.  
  - Moderate (70%) for §2 Row 5 (commitment devices). The Temporal side might reject "bypasses willpower" as question-begging; Agential might reject "solves akrasia" as equivocal.  
  - **Least Confident Formulation**: §2 Row 3 (Temporal): "no akrasia occurs—just rational time-sensitive preference."  
    - *Likely Pushback*: Agential may argue this redefines "rational" to exclude diachronic inconsistency. Temporal might counter that "rational" here is descriptive (consistent with discounting), not normative.  

  **Neutrality Adherence**: This document refrains from resolving disputes. Its goal is to:  
  1. Isolate verbal disagreements (e.g., whether "akrasia" applies to judgment shifts).  
  2. Identify substantive cruxes (e.g., the necessity of synchronic conflict).  
  3. Force predictions on cases (§3) to prevent post-hoc reinterpretation.  

  — Drafted by [Your Name/LLM Facilitator]  

  ---  
  **Suggested Next Step**: Signatories independently annotate this document: (✓) for full agreement, (Δ) for minor wording quibbles, and (X) for substantive rejections—with written justifications. Quibbles are edited; rejections define the unresolved dispute.
