  4. **A1 (Tercet 4):** + "by those who profit to deceive" (counters motive analysis).  
  5. **A2 (Tercet 5):** + "the leak was planted to discredit" (counters whistleblower evidence).  
  6. **Final Couplet:** Both refrains culminate with all prior clauses + new endings (A1: "the weak", A2: "the few who know the score"), visibly outweighing the original claims.  

  The textile metaphor ("thread," "weave," "frays") sustains coherence while the accretions mechanically absorb objections ("forgery!" → "staged event" → "planted leak"). The watcher's persistence ("truths surface late") holds space for justified skepticism without resolving the tension against the structural burden of proof.
