  I'm four years into a PhD in philosophy of physics and I should be embarrassed by how muddy this still is to me: my flatmate (a collapse theorist, and annoyingly good at argueing at 2am) and I have a standing bet, one decent bottle of wine, about quantum suicide, and I've realised I can't actually say where my own number comes from. So we're arguing about the same thing, here's the exact setup: 1000 rounds, each round a spin measurement triggers a lethal device that kills me instantly and painlessly if it fires; but it's a physical object, and if it fires there's about a 1% chance it malfunctions in a way that leaves me alive but injured — sometimes just a hand, sometimes a chunk of cortex — and I'm stipulating the injuries are survivable and cumulative. He says the standard immortality argument is basically right and that my subjective expectation should be to survive, and he puts that at 0.85. I'm at about 0.1, and my complaint is that the argument is either vacuous or predicts something considerably worse than survival, but when I try to say which of those it is I get tangled.

  Give me your own number, and more importantly the tree. The proposition I want priced: after the 1000 rounds there is a continuing stream of experience that is mine, and it belongs to someone who is alive and recognizably still me — as opposed to there being no experience at all, or experiences belonging to a damaged successor I wouldn't count as me. Decompose it however you think is right, but here are the terms I keep tripping over and want you to actually assign numbers to: (1) that there's no fundamental collapse and that the branches are real in the relevant sense; (2) that my subjective expectation should track Born-rule measure at all, rather than branch counts or some observer-moment selection rule; (3) whether the "you can't experience not existing, so conditional on having experiences you must be in a surviving branch" move is legitimate — my worry is that it goes through identically under dynamical collapse, where the surviving branch also exists, just with probability 2^-1000, which would make it useless as evidence for many-worlds and might make the conclusion trivially true; (4) the failure-mode term: as I run it, conditional on being alive at the end I should expect the device to have actually fired on me and failed to kill me roughly ten times, and the clean "never fired on once" branch is something like 10^-4 of the surviving measure, so almost all of the surviving measure sits in branches where I'm progressively more wrecked — say what that does to the number, and treat body-damage and brain-damage separately, since only the latter thins out the observer-moments; (5) how much has to persist for the successor to be me at all, and whether that drives the measure of me-continuations toward zero as N grows.

  Then combine the terms, tell me which single one the final number is most sensitive to, and tell me where you think the gap between my 0.1 and his 0.85 really lives — is he quietly assuming something about measure, or about identity, that I'm not? And what would move your number most: some argument I haven't considered, or some hypothetical empirical result (no citations, I don't have library access from this train, just tell me the shape of the evidence). Definitely don't just tell me it depends on your favourite interpretation of quantum mechanics — I want the number and its weak points.
