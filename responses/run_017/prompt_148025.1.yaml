  We are building a decision procedure for annotators to tag transcripts as "deceptive" (to be sent to compliance) vs "merely wrong or unhelpful". We want to avoid annotators having to guess about the model's beliefs or intent. Instead, we'll base the procedure on observable behaviors and checkable facts.

