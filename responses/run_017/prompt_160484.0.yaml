  We are going to translate the platonism/nominalism dispute into the vocabulary of databases (schemas, instances, constraints, views, etc.). We'll address each of the seven points (1-7) and then the four specific questions (a-d). Finally, we'll sort the residue into three piles (i, ii, iii).

  Let's begin with the translations:

  1. **Platonism: mathematical objects exist mind-independently and mathematical truth is objective.**
     - **Clean mapping:** In databases, an instance (a specific set of data) satisfies a schema (with its constraints) independently of any particular user or system. This is objective: if the instance meets the constraints, it satisfies the schema regardless of human minds. The schema is like the mathematical structure, and the instances that satisfy it are the "truths" about that structure. However, note: the schema itself is a human creation, but once fixed, the satisfaction is objective.
     - **Bending required:** In Platonism, the mathematical objects exist independently of any schema. In databases, schemas are designed by humans. We might bend by imagining that the schema is not designed but discovered, or that there is a "universal schema" that exists independently. But this is a stretch.
     - **No counterpart:** The mind-independence of the entire mathematical realm. Databases are created by humans and stored in physical systems.

  2. **Identification problem: natural numbers can't be identified with any one set-theoretic coding because there are several equally good ones.**
     - **Clean mapping:** This maps directly to the idea of multiple representations of the same data. For example, in a database, you might have a table for natural numbers represented in unary, binary, or as sets (like von Neumann ordinals: 0={}, 1={0}, 2={0,1}, etc.). The constraint of being a natural number (e.g., being a well-ordered set with the right properties) can be satisfied by multiple representations. The question of whether 2 is a member of 3 is coding-dependent and not part of the abstract structure. This is analogous to having multiple database instances that are isomorphic (same data up to isomorphism) but differ in the internal representation of the same abstract entity.
     - **Bending required:** In set theory, the coding is done within the same foundational system. In databases, we might have different schemas for different representations, but we can also have one schema that abstracts away from the representation (via views or by defining constraints that allow multiple representations). The bending is minimal: we are used to having multiple representations and using constraints to capture the abstract structure.
     - **No counterpart:** None. This is a strong point of analogy.

  3. **Indispensability argument: our best scientific theories quantify over mathematical objects, so we are ontologically committed to them.**
     - **Clean mapping:** Consider a database that stores scientific data (e.g., physics experiments). The schema might include both physical entities (like particles) and mathematical entities (like vectors, numbers). The constraints of the schema require that these mathematical entities exist in the database (as tables) for the scientific data to be represented. The database instance must include rows in the mathematical tables to satisfy the constraints when storing a physical fact (e.g., a particle has a position vector). This is ontological commitment: the database must have mathematical objects to represent the physical world.
     - **Bending required:** In the indispensability argument, the commitment is to abstract mathematical objects. In the database, these are concrete representations (stored bits). We have to bend by considering that the database representation is a stand-in for the abstract objects. Also, the argument in philosophy is about our best theories, not just a particular database. We might imagine the database as our best scientific model.
     - **No counterpart:** The abstract existence of mathematical objects as opposed to their concrete representation in a database.

  4. **Access problem: if mathematical objects are abstract and causally inert, how do we know about them?**
     - **Clean mapping:** In a database, we access data through queries. The data might be stored (base tables) or computed (views). The causal path is clear: the query processor accesses the stored data. But if we think of mathematical objects as abstract, we lose that causal path. In the database analogy, we might say that we access the abstract structure (the schema) by interacting with an instance (which is stored and thus causally accessible). However, the abstract schema itself is not causally active.
     - **Bending required:** We have to assume that the abstract schema is known by the user and that the user can write queries against it. But how did the user learn the schema? In practice, the schema is communicated by the designer. This maps to the access problem: how do we "access" the abstract mathematical truths? The database analogy might suggest that we interact with concrete instances (like written proofs, symbols) to learn about the abstract. But the bending is that in the database, the schema is causally accessible via the system (it is stored in the catalog), whereas in Platonism, the abstract realm is not.
     - **No counterpart:** The causal inertness of abstract objects. In the database, every piece of data is stored and thus causally accessible (at least in principle). The problem of how we get knowledge of abstracta without causal contact is not directly modeled.

  5. **Fictionalism / nominalist reconstruction: use mathematics while denying it's true, with the mathematics being conservative over the nominalistic base.**
     - **Clean mapping:** We can think of the nominalistic base as the base tables (which contain only non-mathematical, physical data). The mathematics is then introduced as a view. The view is virtual (not stored) and defined by a query over the base tables. The view is conservative in the sense that it doesn't add new facts about the base tables: any query about the base tables that can be answered via the view can be answered without it (by rewriting the query). Also, the view might not be updatable (so we cannot change the base tables by updating the view). This matches the idea that the mathematics is a useful fiction that doesn't add new content about the nominalistic world.
     - **Bending required:** In fictionalism, the mathematics is not true, but in the database, the view is true in the sense that it's derived from the base tables. We have to bend by saying that the view is not part of the base reality. Also, the conservativeness in databases is about the ability to rewrite queries without the view, which is similar to the logical conservativeness (if a nominalistic statement is provable with math, it's provable without). But note: the view might make it easier to express queries, just as math makes science easier.
     - **No counterpart:** The idea that the mathematics is not true. In the database, the view is true (if the base is). The fictionalist denial of truth doesn't have a direct counterpart.

  6. **Plenitudinous platonism: every consistent mathematical theory is true of some real structure.**
     - **Clean mapping:** We can think of every consistent set of constraints (a schema) as having at least one instance (a model) that satisfies it. In databases, if a schema is consistent (there exists at least one instance that satisfies the constraints), then that instance exists. This maps well: every consistent theory (schema) has a model (instance).
     - **Bending required:** In plenitudinous platonism, the structures exist independently. In databases, we build the instances. We have to bend by imagining that for every consistent schema, there is automatically an instance (without us building it). But in practice, we only care about schemas we use. Also, the existence of an instance is usually assumed if the constraints are satisfiable, but we don't necessarily have it stored.
     - **No counterpart:** The independent existence of the structures. In the database, we create the instances.

  7. **Structuralism: mathematics is about positions in structures, not objects with identity.**
     - **Clean mapping:** This maps exactly to the idea of a database schema. The schema defines the structure (tables, attributes, constraints) and the instances are particular realizations. The identity of a row (an object) is defined solely by its role in the structure (the primary key, foreign keys, etc.). For example, an employee is defined by their attributes and relations, not by any intrinsic identity. Also, two instances can be isomorphic: they have the same structure but different row identities (like different primary key values). This captures the structuralist idea that what matters is the relations, not the objects themselves.
     - **Bending required:** Minimal. This is a very natural fit.
     - **No counterpart:** None. This is a strong analogy.

  Now, let's address the specific questions:

  (a) **Spec-invariance and platonism:**  
  You define a query as spec-invariant if it returns the same answer in every instance satisfying the schema. This is analogous to a mathematical statement that is true in every model of the theory (logical truth). Platonism, as you restate it, says that only the spec-invariant content is real. This is a structuralist view: the real content is what is invariant across all models (all representations). But note: Platonism traditionally holds that there is one intended model (e.g., the real natural numbers) and that truth is about that model. Structuralism, however, avoids singling out a model and focuses on what is true in all models. Your restatement is closer to structuralism. Platonism (of the non-plenitudinous kind) might say that there is a unique intended model, so even a query that is not spec-invariant (but true in the intended model) is real. However, the identification problem shows that we cannot pin down the intended model by the theory alone. So your move is structuralist. Nominalism doesn't have a direct version of this because it denies the existence of abstract objects. But if a nominalist were to use structuralism, they might say that the structure is a pattern in the concrete world, and spec-invariance would capture that pattern.

  (b) **Conservativeness:**  
  In databases, a view is conservative if it doesn't add new facts about the base tables (any query about base tables can be answered without the view). This maps directly to the logical conservativeness in fictionalism: adding math doesn't let you prove new nominalistic statements. However, the extra requirement for nominalists is that the reconstruction must explain why the mathematics works and use an acceptable vocabulary (only nominalistic). In the database analogy, the base tables are the nominalistic vocabulary. The view is defined using the base tables. So if the view is defined in the nominalistic vocabulary, then it is acceptable. The explanation requirement might be that the view should be a natural and useful representation of the base data, not just a syntactic trick. In databases, we do care that views are meaningful and useful. So this might map to the requirement that the view definition is not contrived and captures the intended mathematical structure. But the explanation of why math works might go beyond the database analogy: it might require a story about how the mathematical structure emerges from the nominalistic base.

  (c) **Truth:**  
  In databases, truth is always relative to an instance. The nominalist's headache is: if there are no numbers, why is "there are infinitely many primes" true? In the database analogy, we can say that in every instance of the natural numbers (satisfying the schema), the query for infinitely many primes returns true. But that doesn't make it true in the nominalist's base (which doesn't have numbers). The fictionalist might say that the statement is true in the mathematical fiction (like a view) but not in the base reality. The problem of what makes it true in the fiction is then analogous to what makes a view true: it's derived from the base. But if the base doesn't have numbers, then the view is defined over a base that doesn't have the resources? This is where the conservativeness comes in: the view is defined in a way that doesn't require the base to have numbers, but it simulates them. However, the truth of "there are infinitely many primes" in the view is relative to the base instance: if the base instance is such that the natural numbers (as defined by the view) satisfy the schema, then it holds. But if the base is finite, then the view of natural numbers might not have infinitely many primes? This is tricky. The nominalist must ensure that the base has enough structure to support the fiction of infinitely many primes. The database analogy can express this: the base must be such that the view of natural numbers is infinite. But in reality, the nominalist base is the physical world, which might be finite. This is a problem. The analogy shows that the truth of mathematical statements in the fiction depends on the base. So the nominalist must argue that the physical world has the necessary structure (e.g., enough space, time, or other resources) to simulate infinity. This is an extra requirement that the database analogy can capture.

  (d) **Access problem:**  
  In the database, every query result is computed from stored data. This stipulates a causal/computational path. The access problem for abstract objects is that there is no causal path. So the database analogy does not solve the access problem but assumes it away by having the data stored. This is cheating for the Platonist because in Platonism, the objects are not stored in any physical medium. Therefore, the translation fails for this point. The access problem remains a genuine problem for Platonism that the database analogy cannot naturally address.

  Finally, we sort the residue:

  (i) **Things the database vocabulary is missing and should have (if it were to better capture the philosophy):**  
  - A notion of abstract existence independent of any physical storage.  
  - A notion of truth that is not relative to an instance (absolute truth).  
  - A way to handle the access problem without assuming a causal path (i.e., how to get knowledge of abstracta).  
  - A distinction between the intended model and other models (which structuralism avoids).  

  (ii) **Things never in its job description:**  
  - The mind-independence of mathematical objects.  
  - The causal inertness of abstract objects and the epistemological problem it raises.  
  - The ontological commitment to abstract objects (as opposed to their representations).  
  - The normative aspect of mathematical truth (it's not just about satisfying constraints but about being true in the one intended model).  

  (iii) **Pseudo-debate or less substantive parts:**  
  - Some of the debate about the identification problem might dissolve in the database view: if we focus on the structure (schema) and allow multiple representations, then the question of which coding is "real" is an artefact. This is a point for structuralism.  
  - The plenitudinous platonism vs. non-plenitudinous debate: in the database world, we don't care about every consistent schema having an instance unless we need it. The existence of instances for every consistent schema is a technical fact in model theory, but whether we take it as a metaphysical claim might be a pseudo-debate if we are structuralists.  
  - The debate about whether mathematical objects exist might be less sharp: in databases, we have representations of mathematical objects, but we don't ask if they "really" exist independently. We care about the structure and the constraints. The ontological question might be a category error from the database perspective.  

  However, the access problem (iv) and the requirement for an acceptable nominalistic vocabulary (in conservativeness) are points where the debate remains substantive and the database analogy doesn't fully capture the philosophical concerns.

  In summary, the database vocabulary provides a powerful analogy for structuralism and for many technical aspects (like conservativeness, multiple representations, and the role of constraints). But it stumbles on the traditional Platonist claims of mind-independent existence and the access problem, and it doesn't naturally capture the nominalist's insistence on an ontology free of abstracta.
answer: |-
  Let's tackle this systematically. I'll translate each platonism/nominalism issue into database vocabulary, then address your specific questions (a-d), and finally sort the residue into your three piles. I'll adhere strictly to your rules: translations will be explicit about clean mappings, required bends, and missing counterparts; additions to your vocabulary will be flagged; and I won't re-explain positions without translating.

  ### Translations of Key Issues
  **1. Platonism: Mathematical objects exist mind-independently; mathematical truth is objective.**  
  - **Clean mapping:** A database **schema** (with constraints) exists independently of any specific database instance. Once defined, whether an **instance satisfies the schema** is objective: it's determined by the constraints (e.g., primary keys, foreign keys), not by human opinion.  
  - **Bending required:** You must bend "mind-independently" to mean "not dependent on a *specific instance* or *user*." Schemas are human-designed, so true mind-independence (e.g., existing without any designer) isn't captured. Truth maps to "satisfaction of constraints," but this is only objective *relative to the schema*.  
  - **No counterpart:** The idea that mathematical objects exist *outside any system* (like a schema without a DBMS). Your vocabulary lacks a notion of existence beyond "defined in a schema" or "stored in an instance."  

  **2. Identification problem: Natural numbers can't be identified with any one set-theoretic coding (e.g., is 2 ∈ 3?).**  
  - **Clean mapping:** This is **normalization and data representation**. Different encodings of "the same data" (e.g., storing numbers as binary vs. sets in base tables) can satisfy the same schema but disagree on representation-specific questions (e.g., `is_member(2, 3)`). The abstract structure (e.g., the natural numbers) is the equivalence class of instances under **isomorphism**.  
  - **Bending required:** Minimal. This fits perfectly: the identification problem is just a **coding-dependent query** in your terms. Disagreements like "2 ∈ 3" are artifacts of the physical representation, not the logical schema.  
  - **No counterpart:** None. This is a direct match.  

  **3. Indispensability argument: Science quantifies over mathematical objects, so we're ontologically committed to them.**  
  - **Clean mapping:** Scientific theories are like **views over base tables**. If a view (e.g., `SELECT position FROM particles`) requires mathematical entities (e.g., real numbers for positions), and the view is *indispensable* for querying the physical world (base tables), then the schema must include mathematical tables (e.g., a `reals` table). The **integrity constraints** (e.g., foreign keys from `particles` to `reals`) force ontological commitment: instances must populate mathematical tables to satisfy constraints.  
  - **Bending required:** You must bend "ontological commitment" to mean "required by integrity constraints for instance validity." But in your framework, the `reals` table is just data, not "abstract entities."  
  - **No counterpart:** The argument's force relies on science being *true*, not just convenient. Your vocabulary lacks a notion of "truth" beyond satisfaction—it can't distinguish "required for accuracy" vs. "required for constraint satisfaction."  

  **4. Access problem: How do we know abstract, causally inert objects?**  
  - **Clean mapping:** Querying a database requires a **causal/computational path**: data is stored/computed, accessed via queries (e.g., indexes, joins). If mathematical truths are **materialized views**, accessing them involves physical computation.  
  - **Bending required:** You must *stipulate* that abstract objects are like **virtual views**—defined but not stored. But virtual views still rely on base data and computational access, whereas platonist abstracta have no causal link. This doesn't resolve how we "access" them; it assumes the problem away by embedding computation.  
  - **No counterpart:** Genuine causal inertness. In databases, all data is causally traceable (storage → query engine → result). Platonism's abstracta have no such path—your vocabulary can't model acausal knowledge.  

  **5. Fictionalism: Use math while denying it's true, with math conservative over nominalistic base.**  
  - **Clean mapping:** Mathematics is a **virtual view** over nominalistic base tables (e.g., `particles`, `space_time`). **Conservativeness** means the view adds no new facts about base tables: any query on base tables using the view can be rewritten without it (via **query rewriting**). If the view isn't **updatable**, you can't modify base tables through it—math is "instrumental," not real.  
  - **Bending required:** Clean for conservativeness (it matches **logical equivalence of queries**). But "denying it's true" has no counterpart—in databases, views are true (derived from base data). You must bend by treating the view as "useful fiction," but truth isn't separable from instance-satisfaction.  
  - **No counterpart:** The *fictional* status: nominalists say "2 + 2 = 4" is false (no numbers exist), but in databases, a view returning `4` is true if base data satisfies constraints.  

  **6. Plenitudinous platonism: Every consistent theory is true of some real structure.**  
  - **Clean mapping:** Every **consistent schema** (where constraints don't contradict) has at least one **satisfying instance**. For example, a schema for non-Euclidean geometry has instances (curved space models), just as Euclidean does.  
  - **Bending required:** You must interpret "real structure" as "existing instance," but instances are concrete (stored data), not abstract. Plenitudinous platonism implies infinitely many structures "out there," while databases create instances on demand.  
  - **No counterpart:** Independent existence of all possible structures. Your vocabulary is finite and practical—it doesn't include "all consistent schemas automatically have instances."  

  **7. Structuralism: Math is about positions in structures, not objects with identity.**  
  - **Clean mapping:** **Schemas define structures** (relations, constraints), and instances fill **positions** (rows). Object identity is secondary: two rows are indistinguishable if they satisfy the same constraints (e.g., **same data up to isomorphism**). Primary keys are roles, not intrinsic identities.  
  - **Bending required:** Minimal. This is a direct match: structuralism is the claim that math is **schema-invariant**, not about specific row values.  
  - **No counterpart:** None.  

  ---

  ### Your Specific Queries  
  **(a) Spec-invariance and platonism**  
  Your proposal: Platonism = only **spec-invariant queries** (same result in all instances satisfying the schema) are "real"; coding-dependent queries are artifacts.  
  - **Faithfulness to platonism:** This is a near-perfect translation of **structuralism** (issue 7), not traditional platonism. Structuralism avoids privileging one "intended model" (e.g., von Neumann ordinals), focusing on schema-invariant truths. Traditional platonism *does* assume a unique intended model (like a cosmic "base instance"), so it *could* accept coding-dependent truths (e.g., "2 ∈ 3" in that model). Your move collapses platonism into structuralism by rejecting non-invariant content.  
  - **Nominalism's version:** Nominalists reject *all* mathematical truths, so they'd dismiss spec-invariance as irrelevant (no instances exist to satisfy schemas). However, **fictionalists** might accept spec-invariance as "true within the fiction," but conservativeness is their core tool.  
  - **Verdict:** Your hunch captures structuralism, not platonism. The "real content" move belongs to structuralists (and some platonists who adopt structuralism).  

  **(b) Conservativeness**  
  - **Same relation?** Yes, **logically identical**. Database conservativeness (views add no new base-table facts) = fictionalist conservativeness (math adds no new nominalistic truths). View non-updatability even maps to "can't infer nominalistic facts from math alone."  
  - **The extra requirement:** Nominalists demand an **acceptable vocabulary** (e.g., only physical predicates) and an **explanation** for why math works. This has **no counterpart** in your vocabulary:  
    - *Acceptable vocabulary:* Databases don't care if base tables are "physical" or "mathematical"—it's all data. The restriction is external (e.g., "only tables with causal links").  
    - *Explanation requirement:* Fictionalists need a *justification* for conservativeness (e.g., "Why does this view simulate calculus?"). In databases, conservativeness is a technical property, not a mystery to explain.  
  - **Verdict:** The extra requirement is philosophical, not technical—your vocabulary can't express "why" math is useful, only *that* it's conservative.  

  **(c) Truth and nominalism's headache**  
  Can your vocabulary pose "If no numbers exist, why is 'there are infinitely many primes' true?"  
  - **Yes, but artificially:** In databases, truth is always `TRUE_IN(instance, schema)`. The nominalist's claim is that there is **no instance** for the `naturals` schema (no base table rows). But then:  
    - "Infinitely many primes" is a **query** that, if run on *any* instance satisfying `naturals`, returns `true`.  
    - The headache: Why does this query always succeed when there are *no valid instances*?  
  - **Defect or insight?** This reveals the question's **lack of sharpness** in your vocabulary. The nominalist must argue that the `naturals` schema has no instances (like a broken constraint), but the query's success in *all hypothetical instances* is irrelevant if none exist. Your framework shows the debate hinges on **what counts as an "admissible" instance**—a question your vocabulary can't answer.  

  **(d) Access problem: Does your framework cheat?**  
  **Yes, it stipulates the problem away.** In databases:  
  - Knowledge (query results) requires a **causal path**: storage → computation → output.  
  - This assumes a **computational theory of knowledge**: we "know" P because we compute it from stored data.  
  Platonists, however, face abstracta with **no storage or computation**. Your vocabulary has no tools for "access" without physical implementation. This isn't a translation—it's a rejection of the problem's premises.  

  ---

  ### Residue Sorting  
  **(i) Genuine gaps in your vocabulary** (should be added for better philosophy alignment):  
  - **Truth simpliciter:** A notion of truth *independent of any instance* (e.g., "the schema is satisfied in all possible instances" for logical truths). Currently, truth is always relative.  
  - **Intended models:** A way to specify a "privileged" instance (e.g., the real natural numbers) distinct from other satisfying instances. Structuralism avoids this, but traditional platonism needs it.  
  - **Admissible vocabularies:** Constraints on which predicates/tables are "ontologically acceptable" (e.g., "only causally grounded tables").  

  **(ii) Outside job description** (no need to add):  
  - **Mind-independence:** Schemas are human artifacts; databases don't model "existence without designers."  
  - **Causal inertness:** Databases assume data is causally accessible (storage/computation).  
  - **Metaphysical ontology:** "Existence" in databases is either "defined in schema" or "stored in instance"—no room for "abstract existence."  

  **(iii) Pseudo-debates or less substantive chunks** (collapse on translation):  
  - **Identification problem (2):** Dissolves entirely. Coding-dependent questions (e.g., "is 2 ∈ 3?") are **representation artifacts**, like debating a physical storage detail. Both sides should agree only spec-invariant queries matter—this is a non-issue in your framework.  
  - **Plenitudinous platonism (6):** Collapses into "all consistent schemas are satisfiable," a standard model-theoretic fact. The "plenitude" debate is just whether this technicality implies metaphysical abundance—your vocabulary shows it's a label, not a substance.  
  - **Core ontological debate ("Do numbers exist?"):** Reveals a **terminological split**. In your terms:  
    - Platonists: "Mathematical schemas have instances (abstract but real)."  
    - Nominalists: "Only physical base tables exist; math is views."  
    - But both agree on spec-invariant queries and conservativeness. The "bite" is verbal: "What counts as *existence*?" Your vocabulary can't resolve this, but it shows the disagreement doesn't affect practice (query results are identical).  

  **Where the real bite remains:** The **access problem (4)** and **fictionalism's explanation gap (b)**. Your vocabulary assumes computation/storage, so it can't engage the epistemological worry. Nominalists also demand an explanation for *why* conservativeness holds (e.g., "Why does this view emulate calculus?"), which databases treat as a design choice, not a puzzle. Here, the debate is substantive—but only if you care about epistemology beyond computational feasibility.  

  ### Final Summary  
  Your database vocabulary excels at translating structuralism, conservativeness, and representation issues (e.g., identification problem). It stumbles on mind-independence, causal access, and ontological "existence" beyond instances. The key insight: much of the debate (especially coding-dependence and plenitude) *is* pseudo-substantive—it collapses into engineering choices. The real friction is in epistemology (access) and metaphysics (what "existence" means for uncontroversial truths like primes). If you adopt structuralism, your framework captures 80% of the debate; if you want traditional platonism or nominalism, you'll need to bend or add metaphysical baggage.
