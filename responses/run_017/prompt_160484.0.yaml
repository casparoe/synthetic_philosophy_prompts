prompt: |-
  hi — I'm a third-year doing a sort of CS-and-philosophy mix, and this term I'm in a philosophy of maths seminar (we're on the platonism vs nominalism stretch right now) while also taking a databases / information systems course, which is honestly the vocabulary I feel at home in. By which I mean: schemas vs instances, integrity constraints and what it means for an instance to satisfy a schema, logical vs physical data independence, virtual vs materialised views, query rewriting through a view, normalisation and "the same data up to isomorphism", conservative extensions of a schema, view updatability (the fact that you often can't push an update on a view back down to a unique update on the base tables). I'm comfortable with all of that and with SQL and relational algebra, and I've seen just enough model theory in the seminar to know what a model of a theory is.

  Here's the thing: I definately have the feeling that half of what my seminar argues about is just stuff my DB course settled years ago, and the other half is noise, and I can't tell which half is which. So please do this properly:

  Translate the platonism/nominalism dispute into database vocabulary, as faithfully as you can, taking these in turn:

  1. the platonist claim that mathematical objects exist mind-independently and that mathematical truth is objective
  2. the identification problem: the natural numbers can't be identified with any one set-theoretic coding, because there are several equally good ones and they disagree on coding-dependent questions like whether 2 is a member of 3
  3. the indispensability argument: our best scientific theories quantify over mathematical objects, so we're ontologically committed to them
  4. the access problem: if these objects are abstract and causally inert, how do we manage to know anything about them
  5. fictionalism / the nominalist reconstruction program: you get to use the mathematics while denying it's true, provided the nominalistic story is conservative over the nominalistic base
  6. plenitudinous (or "full-blooded") platonism: every consistent mathematical theory is true of some real structure
  7. structuralism: mathematics is about positions in structures, not about objects with identity

  For each one, tell me: what maps cleanly onto something I already have; what only fits if I squint (and be explicit about what I'd have to bend); and what has no counterpart at all in my vocabulary.

  Then the parts I actually care about:

  (a) My own half-baked idea, which you should run as a test rather than just humour. I've been calling a query spec-invariant when it returns the same answer in every instance that satisfies the schema's constraints, and coding-dependent when its answer varies across representations of "the same" data. My hunch is that platonism is best restated in my terms as something like: only the spec-invariant content is real content, everything coding-dependent is an artefact of the representation. Is that a faithful reading of platonism, or does it quietly turn platonism into structuralism, or into some "whatever survives every acceptable re-axiomatisation" view? Does nominalism have any version of the same move, or does the move belong to one side only?

  (b) Conservativeness. In my course, a view is useful precisely because it lets you ask questions you could already ask — it adds convenience, not facts — and sometimes you can't even update through it. Fictionalists seem to want the mathematics to be conservative over the nominalistic base in roughly that sense. Is it really the same relation? I also get the sense that nominalists are asked for something more: that the reconstruction explain why the mathematics works, and that it only use an "acceptable" restricted vocabulary. Is that extra requirement visible at all in the database analogy, or is it exactly the bit my vocabulary cannot express?

  (c) Truth. Databases have no notion of true that isn't true-in-an-instance. So can the nominalist's headache — if there are no numbers, what makes it true that there are infinitely many primes — even be posed in my vocabulary? And if it can't, is that a defect of my vocabulary or a sign that the question was never as sharp as it sounds?

  (d) The access problem worries me most. In a database, if a query returns a value, something stored or computed it; the answer only ever arrives through a causal/computational path from the data. Doesn't that mean my framework doesn't solve the access problem but stipulates it away, by building in a causal-or-computational theory of how a system gets to know things? If so, say so plainly: I'd rather know my translation is cheating than be told it succeeded.

  Finally, sort the residue into three piles: (i) things my database vocabulary is genuinely missing and should have, (ii) things that were never in its job description, and (iii) parts of the platonism/nominalism dispute that look less substantive once translated — where the two sides turn out to be describing the same situation in different words, or where the disagreement turns on a distinction that maybe nothing can draw. Be blunt about (iii): if some chunk of this debate is a pseudo-debate, tell me which chunk, and if it isn't, tell me where the real bite is and why someone fluent only in schemas, instances and views would be blind to it.

  Two last rules for the answer: don't just explain the two positions at me, actually do the translation; and if a mapping would require me to add something to my database vocabulary (say a notion of reference or of truth independent of any instance), flag that explicitly as an addition instead of passing it off as a translation.
