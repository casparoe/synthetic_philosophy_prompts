  ### Joint Statement on Symbol Grounding  
  *Authored by Bruna and Teodor during extended power outage, 2:17 AM, aboard the Delta Barge Field Station*  

  #### Agreed Claims  
  1. **Ungrounded symbol manipulation** occurs when symbols are processed in a self-contained system, disconnected from the external entities they reference. It resembles a dictionary chasing its own tail: definitions only point to other symbols, with no external anchor. The orphan corpus (Case 1) is a canonical example—it generates fluent text with correct syntax but lacks any tether to reality, rendering its outputs semantically empty.  
  2. **The dictionary-regress worry** is valid and inescapable. If meaning relies solely on inter-symbol relationships, it collapses into infinite circularity. A successful account of grounding must resolve this by providing an "exit" to non-symbolic reality, ensuring symbols can refer beyond the system.  
  3. **A successful account of grounding** must deliver two non-negotiable features:  
     - **Correction sensitivity**: The system must be capable of error and revision based on feedback.  
     - **Non-arbitrary reference**: Symbols must connect to the world in a way that isn’t merely stipulated (e.g., by a programmer or dictionary).  
     Without these, symbols lack aboutness. Both reject systems that fail here (e.g., the orphan corpus).  

  #### Disagreements  
  *Residual conflict over the necessary conditions for grounding. Bruna requires a causal-perceptual loop; Teodor requires answerability to a community. Below, cruxes test these views against cases. Predictions reflect pre-observation stances.*  

  | Residual Disagreement | Crux | Concrete Case | Bruna’s Prediction | Teodor’s Prediction |
  |------------------------|------|---------------|---------------------|----------------------|
  | Bruna’s phrasing: “Grounding demands a causal-perceptual loop—the world must physically kick back, forcing symbol revision. Without this, you’re just building a fancier thermometer.” <br><br> Teodor’s phrasing: “Grounding demands answerability to a community—users must correct misuse in new contexts. Without this, you’re just decorating a feedback loop.” | 1. **Can a system be grounded solely through simulated interactions?** <br> *Tests whether causal contact (even artificial) suffices without community.* | Case 2: Proxy grounding (ship simulator) | Grounded. Sim physics provide real kickback—wind/rope interactions force symbol updates. | Ungrounded. No community to correct deviations; it’s a solipsistic dance with shadows. |
  | | 2. **Does a single interaction establish grounding without ongoing regulation?** <br> *Tests whether minimal user contact creates lasting reference without reinforcement.* | Case 3: One-shot anchoring (decade-isolated robot) | Link never existed. One touch isn’t a loop; decay is inevitable without sustained world-engagement. | Link established but decayed. Correction at t=0 set a norm; isolation eroded answerability. |  
  | | 3. **Can grounding be fully mediated by another agent?** <br> *Tests whether borrowing a user’s access to the world suffices for direct grounding.* | Case 4: Mediated anchoring (text system with human pointer) | Ungrounded. It’s a polite passenger—no direct loop, just begging for dictionaries. | Grounded. Answerability to the human (who corrects/verifies) embeds it in a social practice. |  
  | | 4. **Is retroactive grounding possible?** <br> *Tests whether later community use can confer meaning on past ungrounded states.* | Case 5: Deferred grounding (orphan corpus revived) | No retroactive grounding. Past symbols had no loop; revival doesn’t rewrite history. | Retroactively grounded. Meaning is use—community adoption defines what the symbols *always* meant. |  
  | | 5. **Is the orphan corpus’s flaw primarily causal or social?** <br> *Tests which absence is fundamental in a system lacking both.* | Case 1: Orphan corpus | Primary flaw: No causal loop. Syntax without physics is noise. | Primary flaw: No community. Fluency without correctors is hallucination. |  

  #### Terminological Note  
  The core fight is over what “grounded” *means*. Bruna restricts it to systems with causal-perceptual loops (world-kickback), while Teodor restricts it to systems answerable to communities (user-correction). This isn’t just semantics—it shapes which systems count as “about” anything. For readers: imagine arguing whether a sundial is “broken” when it’s cloudy. Bruna says yes (no sun-kickback); Teodor says no (it still follows design norms for sundials). Same object, different definitions of “working.” Here, cases 2–5 force these definitions apart.  

