answer: |-
  ## Frege's Puzzle in Kavrem: A Dialogue

  **Setting:** A campus café, late afternoon. MIRIAM (early 30s, intense, gestures with her coffee cup) and ADE (mid-30s, calmer, methodical) have just attended a linguistics colloquium on evidentiality. Empty plates and half-full mugs litter the small table.

  **MIRIAM:** ...and that’s precisely *why* the Kavrem case is perfect, Ade! It’s not just another tired Hesperus-Phosphorus rerun. Their grammar *forces* speakers to wear their cognitive routes on their sleeves, right there attached to the *name*. ‘Hesperus-vi’ versus ‘Phesperus-ru’ – the difference isn’t just psychological fluff, it’s *grammatical*. That *has* to be the public, shareable mode of presentation Frege needed! The ‘vi’ suffix *is* the sense of ‘Hesperus’ for that speaker at that moment.

  **ADE:** (Stirs his tea slowly) Hold on, Miriam. You’re mistaking a mandatory *pragmatic signal* for semantic content. All the Kavrem grammar does is make explicit something that’s usually implicit: *how* the speaker came to know the referent. But the *referring bit*? That’s still just the planet Venus. The suffix tells you about the speaker’s *epistemic path*, not about Venus itself. It modifies the *act* of referring, not the *content* referred to. ‘Hesperus-vi’ and ‘Hesperus-ru’ both latch onto the same rock in the sky. The proposition expressed by "Hesperus-vi is visible" is the same as "Hesperus-ru is visible": <Venus, being visible>. The suffixes are like tone of voice – expressive, informative, but not part of *what is said*.

  **MIRIAM:** But tone of voice isn’t grammatically required and challengeable! If I say ‘Hesperus-vi’, and you *know* I wasn’t there last night, you can call me out: "You liar, you weren’t there, you heard it from Bob-*te* (testimony)!" That suffix is doing public, intersubjective work. It’s not a private mental image; it’s a publicly acknowledged *way the name presents the object* in this linguistic community. When you grasp my thought that ‘Hesperus-vi is bright’, you grasp it *under that mode* – the directly perceived one. If you only know Hesperus as ‘Hesperus-ru’ (inferred, say, from its position), you grasp a *different thought*, even though it’s about the same object. That’s Frege’s point about informativeness! ‘Hesperus-vi is Hesperus-ru’ *can* be informative precisely because the modes differ.

  **ADE:** I’ll concede that the suffixes are more than *mere* pragmatics; they’re grammatically mandated contextual coordinates. Call them overt, obligatory indexicals if you like, tagging the *utterance* with its epistemic source. But that doesn’t make them part of the *sense* of the name, Miriam. Think about translation. If I translate a Kavrem sentence "Hesperus-vi is bright" into English, I get "Hesperus is bright" – the *vi* drops out as a presupposition or an implicature about how I know. The core singular proposition remains. The marker tells you about the *speaker’s state*, not about a *property of Venus* inherent in the name’s meaning. It’s speaker-relative and ephemeral. Can a *mode of presentation* really be something I can *forget* or *misremember*? If I forget how I learned the name ‘Tully’, does the sense of ‘Tully’ change? That seems absurd. Modes of presentation are supposed to be stable, public anchors. Evidential markers feel like unstable, individual cognitive baggage.

  **MIRIAM:** (Leans forward) Ah, but *are* they unstable? Or are they *conventions*? In Kavrem, ‘-vi’ *means* direct perception. It’s a shared linguistic rule, like the word ‘red’. If I misapply it, I violate a semantic rule, not just report my psychology inaccurately. And yes, I *can* forget how I acquired a name! Suppose I learn ‘Cicero’ in school. Years later, I read about ‘Tully’, not realizing it’s the same person. For me, ‘Cicero-te is Tully-te’ (both by testimony, but different testimonial paths) might be informative! The acquisition history *is* the public mode here. The *shared rule* is: attach the marker corresponding to *your* source. That rule is public; the specific source linked to *my* use is what makes the thought *mine*, graspable by others via the marker. But you’ve touched a nerve, Ade. What if both names have the *same* marker? Suppose I learn both ‘Hesperus’ and ‘Phosphorus’ from the *same* astronomy lecture yesterday – both marked ‘-te’. I utter “Hesperus-te is Phosphorus-te”. According to you, since the markers are ‘the same’ (both testimony) and the reference is the same, this should be utterly uninformative, like ‘Venus is Venus’. But it’s not! I just learned they’re the same planet! My modes *felt* different because I encountered the names in different *parts* of the lecture, maybe associated with different descriptions. So the *marker alone* isn’t sufficient for individuating senses. You win that point; the pure acquisition history marker isn’t the whole Fregean sense. There’s more cognitive glue involved. But it’s a crucial *part* of it, made visible!

  **ADE:** That’s a good concession, Miriam. That case *does* show the marker isn’t the whole story. But it also highlights my point: the informativeness comes from my *internal cognitive state*, my *individual* associations with each name-token learned in that lecture – not from the *public semantic content* of the names, which, even in Kavrem, is exhausted by Venus plus the general evidential category ‘-te’. The *real* work explaining informativeness happens below the semantic level, in psychology or pragmatics. Now, consider your own painful case: the speaker who acquires a *single* name twice. Suppose young Kavrem speaker Anya meets a friendly dog. The owner says “This is Rex-te”. Later, she sees the same dog in the park alone, thinks it’s stray, names it “Scruffy-vi”. She believes Rex-te and Scruffy-vi are different dogs. Then she learns “Rex-te is Scruffy-vi”. Highly informative! But notice: ‘Rex’ and ‘Scruffy’ are *different names*. The identity statement uses two distinct signifiers. What if she mistakenly thinks she’s encountering the *same* name twice? Suppose she hears “Rex” once from a neighbor (‘-te’), forgets, then later sees a dog with a collar saying “Rex” (‘-vi’). She thinks “Rex-te” and “Rex-vi” are different dogs! Now *that* identity statement – “Rex-te is Rex-vi” – *would* be informative for her. But here’s the rub for you: the *public* sense of “Rex-vi” and “Rex-te” *should* be the same if the name ‘Rex’ carries a stable sense. But for Anya, they aren’t! This shows the sense *can’t* be purely public and stable; it’s fractured by her cognitive state and the differing markers she’s forced to attach. The markers are doing psychological work, not semantic work. The *name* ‘Rex’ is still directly referring to the dog; the markers are flags about Anya’s confused epistemic states.

  **MIRIAM:** Ouch. That *is* tricky. You’re right; Anya’s confusion suggests the marker *can* sometimes hijack the name, creating a *de facto* different sense *for her*. But the grammar *compels* her to use the marker reflecting her *current* belief about the source, even if mistaken. The public rule is still operating: use ‘-vi’ if you *believe* you saw it directly. The *shared linguistic meaning* of ‘-vi’ is fixed, even if Anya misapplies it based on false belief. The *thought she expresses* using “Rex-vi” has a different mode (believed-direct-perception) from “Rex-te” (believed-testimony), even though both ultimately refer to Rex. The public modes exist; she’s just linking them wrongly to the world. This highlights the messiness, but doesn’t destroy the public sense. It *does* show modes can be ephemeral and revisable. Now, what about the ‘source unrecoverable’ marker? Suppose I know the name ‘Odin’, but genuinely have no idea how I learned it – childhood myth? A movie? A book? Grammar forces me to use ‘Odin-ka’ (source unrecoverable). But I *know* I *did* learn it somehow! Using ‘-ka’ feels dishonest, like I’m claiming ignorance I shouldn’t have. Does ‘Odin-ka’ express a genuine thought with a clear mode? Or is it a grammatical cop-out? This feels like Kavrem forcing a semantic fiction.

  **ADE:** That’s a fascinating problem. It underscores how the marker *isn’t* really capturing a current cognitive mode for the speaker; it’s fulfilling a syntactic requirement, often pragmatically. The speaker *has* some vague constellation of associations (the real, messy ‘mode’), but grammar forces them into a crude category (‘-ka’) that doesn’t fit. This points to the markers being *responses to linguistic rules* about reporting sources, not constitutive of the name’s sense. The referent, Odin (or the concept), is still what matters. The ‘-ka’ is a placeholder, a way to satisfy syntax when the epistemic report is murky. It doesn’t create a unique ‘Odin-under-unrecoverable-source’ sense; it just flags the murkiness. Now, the killer for substitutivity: Belief reports. Suppose I believe “Hesperus-vi is bright”. You report to a third party: “Ade believes that Phosphorus-ru is bright”. In direct reference theory, since Hesperus=Phosphorus, that *should* be true, even if misleading about my epistemic state. But in Kavrem, is this report *accurate*? I used ‘-vi’, you reported ‘-ru’. My thought involved the direct-perception mode; you reported it under the inferred mode. Isn’t that a *misreport* of my *belief state*, even if the object and property are the same? This is where your view bites. If the marker *is* part of the sense, then substituting ‘Phosphorus-ru’ for ‘Hesperus-vi’ changes the content of the belief ascribed to me.

  **MIRIAM:** Exactly! In Kavrem, that report *would* be inaccurate, potentially challengeable. “Ade didn’t say *ru*, he said *vi*! He saw it!” The marker *cannot* be detached from the name in reporting the *specific belief*. The belief is de dicto, tied to that specific name *with its specific marker* as used by the believer. The mode is locked into the semantic content of the belief report. You can’t just refer to Venus; you have to refer to it *under the mode the believer used*. Kavrem grammar makes this undeniable. So substitutivity fails precisely because the names carry their modes inherently in this language.

  **ADE:** But that’s the thing, Miriam. Does it fail *semantically* or *pragmatically*? In English, reporting “John believes Superman can fly” instead of “John believes Clark Kent can fly” might be misleading or infelicitous, even if Clark=Superman, because it ignores John’s cognitive perspective. But is it *false*? Many direct reference theorists would say no; it’s strictly speaking true but pragmatically inappropriate. Kavrem forces the epistemic perspective to be explicit *in the that-clause*. So reporting “Ade believes Phosphorus-ru is bright” when I said “Hesperus-vi” is *semantically* distinct *because* of the marker – you’ve literally used different words. It’s like misquoting me. The report is false *because it misquotes the words I used*, not necessarily because it misrepresents the singular proposition I believe (<Venus, being bright>), which it might still capture correctly. The marker is part of the *linguistic form* of the belief report, not necessarily part of the *semantic object* of the belief (the proposition). Kavrem doesn’t prove modes are semantic; it proves that *reporting modes accurately* is grammatically required for accurate quotation of the believer’s words.

  **MIRIAM:** (Sighs, stares into her cold coffee) So we’re back to the core. You see the marker as an obligatory, explicit part of the *vehicle* for expressing the singular proposition – part of the linguistic clothing forced by Kavrem grammar. I see it as making visible an essential component of the *publicly expressed thought* itself – the mode of presentation that *is* part of the proposition’s structure. Kavrem hasn’t resolved Frege’s puzzle; it’s just projected it onto a giant, grammatical screen. The disagreement narrows right here: Is the evidential marker in ‘Hesperus-vi’ (a) a semantically relevant component of the *thought expressed* about Venus (my view), or (b) a pragmatic/indexical component governing *how* the reference to Venus is *achieved* within the public language game, while the propositional content remains singular (your view)? The fact that bare names are impossible in Kavrem suggests (a) is fundamental to their semantics. The fact that the marker is speaker-relative and about the speaker’s history suggests (b) governs its nature. I’m more convinced than ever that modes are public and semantic. You?

  **ADE:** (Finishes his tea) I’m more convinced than ever that reference is direct, and that the *explanation* for informativeness and belief reporting puzzles lies in the complex interaction of singular reference, pragmatics, psychology, and *sometimes* explicit grammatical features like these markers – features that constrain *expression* without altering *content*. But Kavrem forces a deeper acknowledgment: that the ‘how’ of reference, when made grammatically mandatory, becomes inextricable from the *linguistic form* of thought expression in a way that can *mimic* semantic difference. It doesn’t create a Fregean sense, but it makes the *illusion* – or perhaps the pragmatic necessity – of one impossible to ignore. The question for your students, Miriam, is whether that necessity is semantic truth or linguistic compulsion.

  **MIRIAM:** (Smiles wryly) Sharpened and unresolved. Perfect. Let’s get more coffee; they’re going to need it.

  **(END)**
