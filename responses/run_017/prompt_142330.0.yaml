answer: |-
  Below is a decision procedure designed for your Registry work, grounded in Kripkean modal metaphysics and reference theory, but operationalized into a practical, step-by-step checklist. It prioritizes efficiency (runnable in ~10 minutes per proposal), avoids modal theory jargon, and handles the specified hard cases. The procedure assumes each record includes: (1) a designator (name or description string), (2) an intake tag (ostensive baptism, definite description fixing reference, inheritance, or placeholder), and (3) factual attributes (birth/death dates, roles, etc.). It outputs one of:  
  - **Identity-of-object** (necessary, rigid link).  
  - **As-described-here** (contingent, context-dependent link).  
  - **Flag for senior review** (unresolvable ambiguity, policy issue, or high-stakes edge case).  

  The procedure strictly separates:  
  - **Metaphysical necessity** (identity holds in all possible worlds) from **contingency** (identity holds only in the actual world as described).  
  - **How reference is fixed** (contingent, empirical process) from **what is designated** (rigid, if a proper name or rigidified term).  
  - **Epistemic certainty** (we know X) from **modality** (X could have been otherwise).  

  Crucially, it avoids conflating empirical discovery ("we found out Cicero is Tully") with contingency ("Tully could have been someone else").  

  ---

  ### **Decision Procedure**  
  **Run these steps in order. Stop and output as soon as a step yields a result.**  

  #### **Step 1: Check for non-identity or irreconcilable conflict**  
  - **Question:** Do the records have **inconsistent core attributes** (e.g., birth/death dates, locations, key roles) that cannot be explained by data errors (e.g., typos, calendar changes, or aliases)?  
  - **Sufficient answer:**  
    - Yes (e.g., Record A has birth year 1700, Record B has 1750 with no evidence of error): Output **flag for senior review** (reason: "non-identity: attribute conflict").  
    - No or unclear: Proceed to Step 2.  
  - **Why?** This step handles clear cases of non-identity without modal analysis. Attribute conflicts imply the records describe distinct individuals in the actual world, making identity impossible. Flagging (not a direct "no") ensures senior review given high stakes.  

  #### **Step 2: Check for emptiness**  
  - **Question:** Is either record an **empty designator** (i.e., confirmed to refer to nothing, like a fictional or erroneous entry)?  
  - **Sufficient answer:**  
    - Yes (e.g., "Vulcan" as a non-existent planet, or "John Doe" for an unverified placeholder with no historical evidence): Output **flag for senior review** (reason: "empty designator involved").  
    - No: Proceed to Step 3.  
  - **Why?** Empty names (e.g., introduced via flawed descriptions) cannot identify any object. This is a policy-heavy edge case (e.g., should "fake" identities be merged?), so it requires human judgment.  

  #### **Step 3: Determine rigidity for each record**  
  - **Question:** Is the designator **rigid** (picks the same object in all possible worlds) based on its intake tag and designator string?  
  - **Sufficient answer:** Use the rules below. No ambiguity allowed—if unsure, flag.  
    - **Rigid if:**  
      - Intake tag = **Ostensive baptism** (e.g., "This child is named Cicero" in a birth record).  
      - Intake tag = **Definite description fixing reference** (e.g., "Hesperus" fixed as "the evening star"—the name becomes rigid, even if fixed contingently).  
      - Intake tag = **Inheritance** (e.g., copied from a trusted source that uses a proper name).  
      - Designator string includes **rigidifying language** (e.g., "actual," "very," "identical," or mathematical terms like "the number 5").  
    - **Non-rigid if:**  
      - Intake tag = **Placeholder** (e.g., "the unknown author of Manuscript X").  
      - Designator string is a **non-rigid description** without rigidifying language (e.g., "the head of the archive in 1793").  
      - *Exception:* Descriptions that are rigid "as a matter of fact" (e.g., "the square root of 25") are treated as rigid only if mathematical or explicitly rigidified.  
    - **Outcome:**  
      - Both rigid → Proceed to Step 5.  
      - One rigid, one non-rigid → Output **as-described-here**.  
      - Both non-rigid → Output **as-described-here**.  
  - **Why?** Rigidity determines necessity. Non-rigid designators (e.g., placeholders or descriptive roles) are inherently contingent—they could pick different objects in different circumstances. The rules above distill Kripke’s insight: names and rigidified terms designate necessarily, even if reference was fixed contingently.  

  #### **Step 4: Placeholder-specific check**  
  - **Question:** Is either record a **placeholder** (intake tag 4) with **multiple candidate bearers**?  
  - **Sufficient answer:**  
    - Yes (e.g., "the unknown author" matched to a candidate who might not be the only possibility): Output **as-described-here**.  
    - No: Return to Step 3.  
  - **Why?** Placeholders are non-rigid by definition. Matching to a candidate is always contingent (the role could have been filled by someone else). This step catches cases missed in Step 3.  

  #### **Step 5: Final identity check for rigid pairs**  
  - **Question:** For rigid designators, is identity **supported by all available evidence**?  
  - **Sufficient answer:**  
    - Yes (e.g., "Cicero" and "Tully" with matching attributes and archival proof): Output **identity-of-object**.  
    - No (e.g., conflicting sources or ambiguous evidence): Output **flag for senior review** (reason: "uncertain identity for rigid designators").  
  - **Why?** Rigid designators that co-refer in the actual world must do so necessarily (Kripke’s necessity of identity). But if evidence is weak, senior review mitigates misattribution risks.  

  ---

  ### **Application to Example Proposals**  
  **Background:** Assume all records pass Step 1 (no attribute conflicts) and Step 2 (non-empty).  

  1. **Cicero/Tully pair** (established by archival research):  
     - Record A: "Cicero" (intake: ostensive baptism).  
     - Record B: "Tully" (intake: definite description fixing reference).  
     - **Procedure:**  
       - Step 3: Both rigid (ostensive baptism and reference-fixing description).  
       - Step 5: Identity supported by evidence → **identity-of-object**.  
     - **Why?** Both are rigid designators for the same person. Empirical proof (archival research) confirms actual-world identity, which implies necessity.  

  2. **Placeholder matched to candidate** (e.g., "the unknown author" proposed as "Jane Smith"):  
     - Record A: "The unknown author of Manuscript X" (intake: placeholder).  
     - Record B: "Jane Smith" (intake: ostensive baptism).  
     - **Procedure:**  
       - Step 3: Record A = non-rigid (placeholder), Record B = rigid. → **as-described-here**.  
     - **Why you might dislike this:** You have strong evidence Jane Smith is the author, so it feels "necessary." But the placeholder is non-rigid—the role could have been filled by someone else (e.g., if Smith declined the task). The output is nevertheless correct: it reflects the *contingency* of role-based identification, not epistemic certainty.  

  3. **Number counted vs. actual-number** (e.g., "the number of notebooks bequeathed" vs. "the actual number of notebooks bequeathed"):  
     - Record A: "The number of notebooks the founder bequeathed" (intake: definite description fixing reference; designator = "5").  
     - Record B: "The actual number of notebooks the founder bequeathed" (intake: definite description fixing reference; designator = "5").  
     - **Procedure:**  
       - Step 3: Both rigid (reference-fixing + mathematical object).  
       - Step 5: Identity supported → **identity-of-object**.  
     - **Why?** Numbers are abstract objects, so descriptions fixing reference to them (e.g., via counting) are rigid. The "actual-" prefix is redundant here but doesn’t change rigidity. Identity is necessary (5 = 5 in all worlds).  

  ---

  ### **Limitations and Failure Modes**  
  **Where judgment cannot be eliminated:**  
  - **Ambiguous reference-fixing:** If a description (e.g., "the head of the archive in 1793") was used to fix reference to a name, it becomes rigid—but determining if it was *used that way* (vs. merely describing) requires interpretive judgment beyond intake tags.  
  - **Rigid-by-fact descriptions:** Descriptions that pick the same object in all worlds due to empirical facts (e.g., "the first human on the moon" is rigid because it’s Neil Armstrong in all worlds) are treated as non-rigid unless rigidified. The procedure cannot infer this without modal reasoning.  
  - **High-risk attributes:** Conflicts in Step 1 (e.g., birth dates) may involve historical ambiguities (e.g., Julian vs. Gregorian calendars) requiring expert discernment.  
  - **Policy-driven cases:** Empty names, inherited records with opaque sources, or placeholders with disputed candidates need editorial policies (e.g., "always flag empty names") that override metaphysical distinctions.  

  **Where it may misfire:**  
  - **Over-flagging non-identity:** Clear attribute conflicts (Step 1) are flagged for review, but a junior editor could resolve some (e.g., obvious typos). This conservatism prevents errors but increases senior workload.  
  - **Under-rigidifying descriptions:** A description rigid "as a matter of fact" (e.g., "the only child of Queen Elizabeth II") is non-rigid in the procedure unless mathematically explicit. It may output **as-described-here** incorrectly (contingent) when it should be necessary.  
  - **Inheritance opacity:** Inherited records (tag 3) are assumed rigid, but if the source was non-rigid (e.g., a placeholder), the procedure misses it.  

  **Why it works despite limitations:**  
  The procedure leverages intake tags to approximate Kripkean rigidity without possible-worlds semantics. It isolates contingency to non-rigid designators (e.g., placeholders) and necessity to rigid ones (e.g., baptized names), ensuring metaphysical distinctions survive operationalization. By flagging edge cases, it defers to human judgment where theory collapses into context.  

  ---  
  This procedure balances rigor and practicality. For the placeholder case (Proposal 2), it outputs **as-described-here**—a result you may dislike, as it prioritizes the modal status of the designator over empirical confidence, but it correctly captures that roles, unlike named individuals, are contingently filled.
