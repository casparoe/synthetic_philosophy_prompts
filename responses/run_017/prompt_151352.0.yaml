prompt: |-
  I sit on our school board's Committee on Pluralism and Secularism — seven of us, three years of monthly meetings, and we've never once written down a principle, only decisions. We're in one of those jurisdictions where both traditions are pulling at once: the province has a secularism statute that binds people who work for the state, but the human rights code still obliges us to accommodate religion, and the two grind against each other at nearly every meeting. I've typed these up from memory so the dates and the order are probably a bit off, but the verdicts are right:

  - A student may wear a headscarf. A teacher may not wear one in front of her own class.
  - A student may wear a cross necklace. The big wooden crucifix that had hung in the main hallway since the fifties had to come down.
  - A Jewish student's exam that fell on a Saturday: we rescheduled it, no argument.
  - Daily halal meat in the cafeteria: refused. We required a genuinely adequate vegetarian alternative instead, and spent two meetings defining "genuinely adequate."
  - A Sikh boy's steel bangle: fine. A kirpan: refused, bladed object.
  - Year 9 girl excused from the partner-dance unit on modesty grounds: granted. Year 7 girl excused from swimming on modesty grounds: refused, but she may wear a full-coverage suit and we paid for one the first year. That pair still bothers me and I don't think we ever explained it.
  - An evangelical prayer group may use an empty classroom at lunch. It may not pray over the PA before exams.
  - The cafeteria is run by a private contractor. We put a clause in the contract saying their staff won't discuss religion with pupils, and then voted 4–3 that "we do not regulate the dress of staff we do not employ," with no reasons minuted.
  - A parent volunteer who wears a visible cross and comes in once a week to hear kids read: allowed, 4–3, "case by case," again no reasons.
  - Hindu parents objected to the yoga unit. We kept the yoga, dropped the Sanskrit posture names and the namaste at the end.

  Now the new one. There's a nonprofit homework club run out of a community centre — free, open to anybody, genuinely open, no proselytizing, parents sign a form saying so. It wants to run 3:15 to 5:30 in our library, and to keep using the school's sign-up sheets and the noticeboard, whose heading carries a short dedication to God. Three of its tutors: two women in headscarves, one man with a visible cross. And for the last fifteen minutes the tutors supervise kids in the schoolyard until parents show up, which is the part I keep getting stuck on — same people, same clothes, same property, but for a quarter of an hour they're doing something that looks a lot like what teachers do.

  My worry is that "the parents choose it" isn't the clean consent story it sounds like: this is the only free homework help in the neighbourhood, and for a lot of these kids the alternative is going home to an empty flat. One of our members keeps proposing a test — would a nine-year-old reasonably take this person to be speaking for the school? — and I can't tell whether that fits what we've already done or quietly overturns half of it.

  So: if we want to be consistent with ourselves, do we renew as is, renew with conditions, or decline? Which of our own precedents is the closest analogue, and what are the two or three rules that fit *everything* we've decided so far and then come apart on this one? What does each predict here, which one's your bet, and what would we be committing ourselves to either way? And what case should we put on next month's agenda, since we clearly won't say it out loud, to find out which rule we've actually been running?
reasoning: |-
  Okay, the user is part of a school board committee dealing with pluralism and secularism. They've shared several decisions made over three years without any written principles, just outcomes. Now they're facing a new issue about a nonprofit homework club using school facilities with tutors wearing religious symbols. The user wants to be consistent with past decisions but isn't sure how to apply them here.

  First, I need to understand the key conflicts in their past decisions. The province has a secularism law for state employees, but they also have to accommodate religious rights under human rights code. That tension shows up in cases like allowing students to wear religious symbols but not teachers, rescheduling exams for religious reasons but refusing daily halal meat. The pattern seems to be: students have more freedom to express religion, while staff representing the state are restricted.

  Looking at the homework club request: It's run by a nonprofit, uses the library and noticeboard, tutors wear headscarves and a cross. The tricky part is them supervising kids in the schoolyard for 15 minutes - which resembles teacher duties. The user is concerned that "parental choice" isn't truly free since it's the only free homework help available.

  Their committee member proposes a test: "Would a nine-year-old reasonably take this person to be speaking for the school?" This is actually a great proxy for state authority vs. private activity. Applying this to past decisions: It explains why teachers can't wear headscarves (they represent state authority) but students can. It explains the parent volunteer being allowed - they're clearly not school staff.

  For the homework club tutors: During homework help in the library, they're clearly private actors. But during those 15 minutes of supervision in the schoolyard? That's where the nine-year-old test might fail - kids could reasonably see them as school authorities. This creates tension between the "private actor" precedent (like the cafeteria staff) and the "state authority" principle (like the teacher headscarf ban).

  The inconsistency becomes clear: They allowed the parent volunteer wearing a cross to work with kids, but that was a clear "case by case" exception. The cafeteria staff decision said they don't regulate dress of non-employees. But the homework club tutors in the schoolyard are blurring lines - are they like parent volunteers or like teachers?

  To be consistent: They should probably allow the program but prohibit religious symbols during the schoolyard supervision, treating that as "state-like" activity. But this creates new problems about regulating private actors. Alternatively, they could allow it as-is, arguing parents chose the program. But that undermines the teacher headscarf decision.

  The user should test their principles with a new case: What if a religious tutor wanted to lead an after-school club during school hours? Or if a teacher wanted to volunteer at the homework club in religious dress? This would force clarity on whether it's about employment status or perceived authority.

  Inconsistencies to resolve: Their cafeteria decision didn't regulate non-employee dress but they regulated non-employee speech. The parent volunteer was allowed with visible cross but teachers couldn't wear crosses. The schoolyard supervision by tutors is the key pressure point here - it's making private actors look like authority figures.

  Ultimately, the committee needs to decide whether perceived authority (the 9-year-old test) trumps the private actor principle. My recommendation would be to renew with conditions: allow the program but require non-religious attire during the schoolyard supervision. Then schedule that hypothetical test case about a teacher volunteering after hours to force clarity on their real principles.
answer: |-
  Based on your precedents and the inherent tension between secularism (state neutrality) and accommodation (religious freedom), here's a breakdown of how your committee would likely approach the homework club request and the underlying principles:

  **Core Principles Extracted from Your Precedents (The Unwritten Rules):**

  1.  **State Actor vs. Private Actor:** The key distinction driving most decisions is whether the person is perceived as acting *on behalf of the state/school* (subject to strict secularism) or acting as a *private individual* (where accommodation and personal expression have more leeway).
      *   *Evidence:* Teacher headscarf banned (state actor), student headscarf allowed (private actor). Crucifix down (state symbol), student cross necklace allowed (private expression). Prayer over PA banned (state endorsement), private prayer group allowed (private use). Cafeteria staff dress not regulated (not school employees), but speech regulated (interacting with pupils *on school grounds*). Parent volunteer allowed (clearly private actor assisting).
  2.  **Accommodation of Practice vs. Endorsement/Symbolism:** Genuine religious *practice* requiring action (Sabbath exam, modesty clothing adjustments, prayer group meeting) is accommodated where feasible and doesn't impose undue hardship. Visible *religious symbols* worn by *state actors* representing the school are prohibited as endorsement. Symbols worn by private individuals are generally permitted.
      *   *Evidence:* Exam rescheduled (practice), yoga modified (removed perceived endorsement elements like namaste), prayer group allowed (practice), teacher headscarf banned (symbol/state actor), student headscarf allowed (symbol/private actor).
  3.  **Safety as a Trumping Concern:** Secularism and accommodation both yield to genuine, demonstrable safety risks.
      *   *Evidence:* Kirpan refused (bladed object), despite Sikh religious requirement.
  4.  **Parental Choice & Private Initiative:** Activities chosen by parents or run by clearly private entities, especially off-hours, are treated more leniently, provided they don't coerce or proselytize.
      *   *Evidence:* Prayer group allowed (parent/student initiated, private meeting), parent volunteer allowed (private initiative).

  **Applying the Principles to the Homework Club:**

  1.  **The Homework Club Itself (Library Use, Sign-up, Noticeboard):**
      *   **Analogue:** The evangelical prayer group using an empty classroom. This is a private, parent-chosen, non-proselytizing activity using school facilities outside core instructional time.
      *   **Principle Applied:** Principle #4 (Parental Choice & Private Initiative) strongly supports allowing this use. The dedication on the noticeboard heading is likely seen as part of the *private group's* materials, not school endorsement (similar to the prayer group using the room, but not the PA).
      *   **Prediction:** **Renew as is for the library/sign-up/noticeboard.** The only potential hitch is the "dedication to God" on the noticeboard heading. Based on yoga/Sanskrit modification, you *might* ask them to use a neutral heading *on school property*, while allowing them to use their standard heading at the community centre.

  2.  **The Tutors' Religious Attire (During Homework Help - Library):**
      *   **Analogue:** The cafeteria staff (non-employees) and parent volunteer. The tutors are not school employees.
      *   **Principle Applied:** Principle #1 (State Actor vs. Private Actor). They are private actors providing a service chosen by parents. Your precedent explicitly states "we do not regulate the dress of staff we do not employ" (Cafeteria) and allowed the parent volunteer with a cross.
      *   **Prediction:** **No restriction on religious attire during homework help.** The "9-year-old test" *might* cause hesitation, but your precedents (cafeteria staff, parent volunteer) suggest you tolerate private actors' religious expression even when interacting with students on school grounds, provided they aren't employed by the school.

  3.  **The Crux: Supervising in the Schoolyard (15 minutes):**
      *   **The Conflict:** This is where principles #1 and #4 clash with the *appearance* implied by the "9-year-old test" and your teacher headscarf decision.
      *   **Analogue 1 (Supporting Allowance):** Parent volunteer (allowed, cross visible). Tutors are akin to private volunteers assisting kids.
      *   **Analogue 2 (Supporting Restriction/Problem):** Teacher headscarf (banned). During supervision, tutors are performing a core *duty* typically done only by school staff (teachers, aides). They are acting *in loco parentis* for the school, ensuring child safety on school property. A 9-year-old *would* reasonably perceive someone actively supervising them in the schoolyard during the school day transition as "speaking for the school."
      *   **Principles at War:**
          *   Private Actor (#1) & Parental Choice (#4) say *allow religious attire*.
          *   State Actor Perception (implied by teacher ban & "9-year-old test") and avoiding endorsement (#2) suggest *prohibiting religious symbols during this specific activity*.
      *   **The Precedent Tension:** Your committee has *avoided* regulating non-employee attire *except* where safety (#3 - kirpan) was involved. Regulating the tutors' dress *only* for the 15-minute yard duty would be a significant, unprecedented step based purely on *perception of authority* during a specific task. It contradicts the cafeteria and parent volunteer decisions directly.

  **Recommendation & Commitment:**

  *   **To be consistent with the *strongest* precedents (cafeteria staff dress, parent volunteer):** You should **renew as is**, including the schoolyard supervision with tutors in religious attire.
      *   *Commitment:* You are solidifying Principle #1 (Private Actor status trumps perception during peripheral activities) and Principle #4 (Parental Choice). You are effectively saying that non-employees performing limited, specific tasks, even those resembling teacher duties, are not bound by the state actor secularism rules regarding attire. This weakens the "state endorsement" argument for non-employees and leans heavily on parental choice.
  *   **If the schoolyard supervision feels too much like state authority (aligning with the teacher ban spirit):** You could **renew with conditions**: Allow the program and library use unconditionally, but require that *during the 15-minute schoolyard supervision only*, tutors refrain from wearing overt religious symbols OR assign supervision of the schoolyard transition to a school employee instead of the tutors. This is messy and unprecedented in your rulings.
      *   *Commitment:* You are introducing a new, nuanced principle: **"Activity-Specific State Actor Perception."** You're saying that even non-employees can be subject to state secularism rules *if performing duties that create a strong, unavoidable perception of school authority during core school functions*. This overtly links the rule to the "9-year-old test" and significantly expands the scope of who might be regulated. It potentially undermines the parent volunteer precedent.

  **My Bet:** Based purely on the weight of your explicit precedents (cafeteria staff dress not regulated, parent volunteer allowed with cross), **renew as is** is the most consistent outcome, even with the schoolyard supervision. The "9-year-old test" is insightful but represents a *new* principle not yet formally applied in your decisions, especially against the backdrop of allowing the parent volunteer. Trying to regulate the tutors' attire *only* for yard duty is administratively awkward and directly contradicts the cafeteria ruling logic.

  **The Test Case You Need (To Reveal Your Actual Rule):**

  Put this on next month's agenda:
  *   **"Proposal: A certified teacher wishes to volunteer their time after school hours (3:30-4:30 PM) to run a non-religious, extra-help math session in the library, open to all students. The teacher wears a visible religious symbol (e.g., headscarf, large cross, kippah). May they do so?"**

  **Why this tests the core tension:**

  1.  **State Actor (Teacher):** They are employed by the state/school, subject to the secularism statute during work hours.
  2.  **Private Actor Context:** Volunteering *after* school hours, providing an optional, non-religious service akin to the homework club or prayer group. Parental choice applies.
  3.  **Location:** School grounds.
  4.  **The Conflict:** Does the secularism statute bind a state employee *acting as a private volunteer* on school property after hours? Or is this purely a private activity? Does the "9-year-old test" apply strongly here (students likely *know* this person is a teacher)?
  5.  **Connection to Homework Club:** If you allow this teacher-volunteer in religious attire, it strongly supports allowing the homework club tutors in the yard (private activity, even if by someone usually state-employed). If you ban the teacher-volunteer, it strengthens the argument that the *perception of authority* (especially for known staff) is paramount, potentially undermining the homework club tutors *during supervision* and even the parent volunteer precedent. It forces you to define the boundaries between employment status and perceived authority/perceived endorsement in mixed contexts.

  This case directly probes the unresolved tension between employment status, location, activity, and perception that underlies both the homework club dilemma and the inconsistencies in your existing precedents. It will force your committee to articulate the rule you've been implicitly following or choose a new one explicitly.
