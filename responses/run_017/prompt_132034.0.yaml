answer: |-
  ### Analysis of "Vulcan = X"

  **1. Rigidity of "Vulcan" and the Role of Actuality**  
  "Vulcan" is a rigid designator *if* the reference-fixing clause ("the object that comes closer to satisfying C than any other object does") is interpreted with an implicit actuality operator. That is, if the stipulation means: "denote the object that *in the actual world* comes closest to C." On this reading, "Vulcan" rigidly designates the actual closest satisfier across all possible worlds, even if other objects better satisfy C counterfactually. Without this actuality operator, "Vulcan" would non-rigidly denote whichever object best satisfies C *in each world*, making it a disguised description.  

  The natural reading includes the actuality operator. The stipulation aims to fix reference to a *specific actual object* (the one best fitting C, however imperfectly), not to whatever fits C best in alternate scenarios. Public language norms typically anchor reference to actuality, and the fallback clause ("if no unique satisfier...") implies a practical intent to name a concrete entity, not a world-relative role. Thus, "Vulcan" rigidly designates the small body actually closest to C.  

  *Modal status dependence*:  
  - **With actuality operator**: Rigid. Then "Vulcan = X" is necessary (if true), as both are rigid designators for the same object.  
  - **Without actuality operator**: Non-rigid. "Vulcan" designates the C-closest object in each world, which may differ from X. The identity is contingent.  

  **2. Contrast with Standard Cases**  
  - **(a) Hesperus/Phosphorus**: Both names are rigid due to *direct perceptual baptism*. Their identity is necessary a posteriori because rigidity fixes the referent transworldly, while empirical discovery links the two names.  
  - **(b) Neptune**: The description ("planet causing Uranus' perturbations") *uniquely* fixes reference. Like "Vulcan" (on the actuality reading), it rigidly designates the satisfier. Necessity follows similarly.  

  *Causal-historical anchoring vs. rigidity*:  
  The runner-up case shows that causal-historical anchoring is *not essential* for rigidity or necessity. "Vulcan" achieves rigidity through a descriptive stipulation (with actuality), while "X" uses causal-historical chains. Both methods can yield rigid designators. The necessity in "Vulcan = X" is genuine metaphysical necessity (like Hesperus/Phosphorus), arising from rigidity itself—not merely "de facto" rigidity. The argument only requires that both names be rigid; their anchoring mechanisms are incidental.  

  **3. The Contingency Intuition**  
  The intuition that "Vulcan might easily have failed to be X" stems from confusing the *reference-fixing description* with the *referent*. One imagines a world where a *different body* is closest to C and thinks, "That could have been Vulcan." This mirrors the standard mistake Kripke identifies: conflating "N might not have satisfied D" (contingent) with "The thing that is N might not have satisfied D" (necessary if N is rigid).  

  Here, the intuition is not evidence against necessity. It arises from misapplying the non-rigid reading (where "Vulcan" denotes the C-closest-in-w) or from epistemic uncertainty about which object *actually* best satisfies C. Once reference is fixed (to object O), and both names rigidly designate O, "Vulcan = X" is necessarily true. The illusion is identical to the Neptune case: we can imagine Neptune not perturbing Uranus, but this doesn’t make "Neptune = the perturbing planet" contingent.  

  **4. Indeterminacy Concerns**  
  The stipulation may be indeterminate if "closeness to satisfying C" lacks a *determinate metric*. If multiple candidates tie for "closest" or if closeness is vague (e.g., how to weight orbital position vs. gravitational influence), "Vulcan" fails to refer. In this scenario, "Vulcan = X" would be neither true nor false (indeterminate). However, the case assumes a *unique* closest body, so we can bracket this issue. If indeterminacy exists, it voids the identity statement entirely—but under the given facts, it does not apply.  

  ### Verdict  
  On the natural actuality-operator reading, "Vulcan" rigidly designates the actual object best satisfying C. "X" rigidly designates the same object via causal-historical chains. Thus, "Vulcan = X" is necessarily true but knowable only a posteriori (empirical astronomy revealed both the object and that it best fits C). The necessity is metaphysical, identical in kind to Hesperus/Phosphorus, and the contingency intuition is illusory.  

  \answer{necessary a posteriori}
