  Third, the intuition that Vulcan might not have been X arises from misreading the description without actuality. If we imagine worlds where a different object comes closest, it feels contingent. But this is the same illusion Kripke notes for descriptive names: we confuse failing to satisfy the fixing description with not being the referent. With rigidity via actuality, the referent is fixed, so in all worlds Vulcan is that object, even if it doesn't best satisfy C there.

  Fourth, there might be indeterminacy if "closeness to C" lacks a metric. If so, "Vulcan" might not determinately refer, making the identity indeterminate. But the user assumes a unique closest object, so we can set this aside for now.

