prompt: |-
  You are a philosopher of language who has also done descriptive fieldwork on a language with no written tradition, and who is used to explaining technical disputes to non-specialists without cheating. Think carefully and at length. Before you write anything final, spend a few hundred words of private brainstorming: sketch every candidate requirement you can think of for the theory I describe below, argue with yourself about each, and discard the ones that are really just preferences of one school. Then commit to the list that survives, and say plainly which candidates you threw out and why.

  The setting. I am a journalist working on a long feature about translation — human and machine — and about the claim, which I keep encountering in one form or another, that a system which renders a sentence of one language into another has or has not got what the speaker was talking about right. The classic version of this worry is Quine's field linguist, who hears a word — gavagai — in the presence of a rabbit and cannot settle whether the speakers mean rabbit, undetached rabbit part, rabbit stage, or rabbithood. I have read the popular versions of that argument and I do not need another summary of it. What I want instead is the specification: what a theory of what it takes to fix what a speaker's words are about would have to deliver in order to be adequate.

  Fix the adequacy to a purpose, because I think that is where these arguments go wrong. I want a theory good enough for this job: to let an outsider — me, a skeptical reviewer, an auditor of a translation system — decide and defend in public whether a given rendering has pinned down what the speaker was talking about, and to say what would count as evidence for or against it. If the honest answer is that the question has no determinate answer, that is a finding I can use, but only if the theory tells me why it is a finding rather than a shrug, and what I should say instead.

  Here are the situations I want the theory to be tested against. Some are invented; treat them as data, and add your own if a requirement needs one.

  One. A field linguist finds two words where Quine found one. The first is used of a live rabbit, not of a rabbit carcass and not of a rabbit seen at dusk. The second is used of a live rabbit, of a severed rabbit foot, and of rabbit stew, but not of a rabbit-shaped decoy. Is either of them the word for rabbit, if either is? A theory that must choose between them, and one that must be permitted to refuse, are very different theories, and I want to know what forces the choice.

  Two. The speakers assent to the word when an older man points at a rabbit and withhold assent when a younger person does, even though both are plainly looking at the same animal. The linguist cannot tell whether this is a fact about what the word means, a fact about who is allowed to speak about rabbits, or a fact about whom these people defer to. Can a theory separate meaning from the social practice of deference if all it has to go on is behavior, or must the manual absorb the deference into the meaning?

  Three. Coordination works perfectly in the middle of the range and falls apart at the edges. The linguist and a speaker hunt together successfully for months on the strength of one word; then the linguist points at a rabbit-shaped rock, then at a rabbit at dusk, and the assent pattern becomes noise. Which range is the theory answerable to — the practical core, or the boundary cases, or both?

  Four. The case that matters most for my piece, and the one I have not seen handled: there is no field linguist at all. No pointing, no shared environment, no assent behavior, no questions asked and answered. There is only a large corpus of text in the source language paired with text in the target language — this is roughly the situation of a machine translation system. State what, if anything, a theory must say about whether reference can be fixed in that setting, and what the difference is between the corpus-only setting and the field setting.

  Five. Evidence that is downstream of the theory itself. A second linguist produces a manual that pairs the word with undetached rabbit part; the two manuals agree on every sentence anyone has tested and disagree on what the word is about. Years later some speakers learn enough of the linguist's language to be asked which they meant — but they learned the relevant word from the first linguist's own translations. Is their answer independent evidence, or is it contaminated by the manual used to teach them? I want a requirement about what counts as independent evidence here.

  Six. The speakers say things that are, on the most natural rendering, straightforwardly false — that a crop failed because the ancestors were angered. A theory under pressure to make speakers come out right about most things will have to say something about error, disagreement and false belief, or it will make them unfalsifiable.

  Seven. Symmetry. Whatever the theory says must apply to the linguist's own language; it may not grant determinacy to English while denying it to the language under study.

  The deliverable. Give me the requirements list: what an adequate theory must be able to do — the cases it must get right, the distinctions it must not collapse, the results it must be consistent with — with the case or consideration behind each one. For each, mark whether it is non-negotiable, whether it is negotiable, or whether you suspect it is a prejudice of one camp that has smuggled itself in as a requirement. Distinguish, where it matters, between not knowing which manual is correct and there being no fact of the matter, and say how anyone could tell the difference. Say also whether the theory must be able to state its own conclusion in the vocabulary whose determinacy it is calling into question.

  Then the two things I care most about. First: is any subset of these requirements jointly unsatisfiable? If the list itself forces a result — if, say, a behavioral-evidence constraint and a determinate-reference constraint cannot both hold — say so explicitly and show the argument; that is the part of the piece I most want to get right. Second: which single requirement does the most work in excluding otherwise attractive theories?

  Only at the end, and briefly: in prose or a small table, score against your list the four broad families of answer — a charity-and-truth-conditions style account, a causal or informational account of how terms get hooked to things, an inferential-role or use-theoretic account, and the deflationary view that the puzzle is a pseudo-problem. One or two lines each is plenty; keep the weight on the criteria. Define any term of art a general reader would trip over, and do not give me a bibliography, a reading list, or citations — I am not going to chase references, and a theory that only works when footnoted is not one I can use.
reasoning: |-
  Hmm, this is a deep and challenging request from a journalist working on translation. They want me to outline what a theory about fixing reference (what words refer to) must be able to do to be considered adequate. They've provided several specific scenarios and want clear requirements rather than another summary of Quine's gavagai problem.

  Let me think through this systematically. The journalist is essentially asking for a set of criteria to evaluate theories of reference, particularly in contexts like field linguistics and machine translation. They want to know when we can say a translation has "pinned down" what the speaker was talking about.

  First, I need to brainstorm all possible requirements that might seem important, then critically evaluate each one to separate genuine adequacy conditions from mere theoretical preferences. The scenarios provided will help test these requirements.

  Here are candidate requirements that come to mind:

  1. **Empirical constraint**: The theory must account for observable behavior (assent/dissent patterns, usage in context). This seems essential - without behavioral evidence, we're just speculating.

  2. **Indeterminacy tolerance**: The theory must be able to acknowledge when reference is genuinely indeterminate (like Quine's rabbit examples). This appears necessary to avoid false precision.

  3. **Error accommodation**: The theory must handle cases where speakers say false things without making their beliefs unfalsifiable. Important for scenario six about crop failures.

  4. **Corpus-only viability**: Must address whether reference can be fixed from text alone (crucial for machine translation). This is scenario four and central to the journalist's piece.

  5. **Deference separation**: Should distinguish linguistic meaning from social practices of deference (scenario two). But is this really separable from meaning?

  6. **Core/boundary distinction**: Needs to account for why coordination works in clear cases but breaks at edges (scenario three). What does this imply theoretically?

  7. **Evidence independence**: Must specify what counts as independent evidence not contaminated by the theory itself (scenario five). Tricky when speakers learn from linguists' translations.

  8. **Symmetry principle**: Must apply equally to all languages, including the linguist's own (scenario seven). Seems fair to avoid privileged status for English.

  9. **Determinacy discrimination**: Must distinguish "we don't know" from "there's no fact of the matter." This is crucial for the journalist's purpose.

  10. **Self-applicability**: Should be able to state its conclusions in the language it's analyzing. Is this necessary or just philosophical navel-gazing?

  Now I need to argue with myself about these. Which are genuine requirements and which reflect specific philosophical biases?

  The empirical constraint seems non-negotiable - without behavioral evidence, we're not doing linguistics but armchair speculation. But we must allow that evidence can be ambiguous.

  Indeterminacy tolerance also seems essential. Denying indeterminacy altogether would be dogmatic. Quine was right that evidence underdetermines translation in some cases.

  Error accommodation is necessary too - any theory that makes speakers always right by definition is useless for real-world translation where people say false things.

  Corpus-only viability is tricky. Pure textual evidence may be insufficient for fixing reference, but the theory must say why, not just assume it's impossible. This might be where behavioral theories struggle.

  Deference separation... here I'm skeptical. In many languages, social hierarchy is baked into meaning. Forcing a separation might impose an individualistic Western view. Probably a negotiable requirement.

  Core/boundary distinction - important, but perhaps handled by distinguishing prototypical from extended uses. Not necessarily a separate requirement.

  Evidence independence - vital to avoid circularity. Contaminated evidence problems show why we need clear criteria.

  Symmetry is non-negotiable - no linguistic chauvinism.

  Determinacy discrimination is absolutely crucial for the journalist's purpose. The whole point is to say when we can't know versus when there's nothing to know.

  Self-applicability... interesting but probably negotiable. We can state theories in metalanguages.

  I'll discard deference separation as potentially ethnocentric, and core/boundary as subsumable under general empirical adequacy. Self-applicability is nice but not essential.

  Now for the key questions: Are any requirements jointly unsatisfiable? I suspect behavioral constraints plus determinacy demands might clash - if evidence is limited (like in corpus-only cases), insisting on determinate reference might be impossible. This tension surfaces in scenario four.

  Which requirement does the most work? Probably indeterminacy tolerance - it forces theories to admit limitations rather than pretend to false precision.

  Finally, I'll briefly score major theoretical approaches against these requirements:

  - Truth-conditional semantics: Strong on error handling but weak on indeterminacy and corpus-only cases.

  - Causal theories: Good for core reference but struggle with boundaries and social factors.

  - Inferential role: Handles corpus well but may blur meaning with belief.

  - Deflationism: Dissolves the problem but may not satisfy the journalist's need for substantive answers.

  This framework should help the journalist evaluate claims about what translation can and cannot achieve.
answer: |-
  ### Requirements for an Adequate Theory of Reference Fixing
  After extensive brainstorming (roughly 500 words of internal debate), I arrived at the following requirements for a theory that determines whether a translation has "pinned down what the speaker was talking about." I began with 12 candidate requirements drawn from your scenarios, philosophical literature, and fieldwork experience. I discarded four as preferences of specific schools rather than genuine adequacy conditions:
  - **Discarded: "Must separate meaning from social deference absolutely."** Why? This assumes meaning is individualistic and context-free—a bias of some formal semantics. In many languages (e.g., honorific-rich ones I've studied), deference *is* part of meaning. Your scenario two shows this may be inseparable from behavior.
  - **Discarded: "Must always resolve boundary vagueness."** Why? This presumes reference must be sharp-edged, but vagueness (e.g., "heap") is inherent in language. Scenario three suggests a theory need only explain *why* coordination breaks down, not eliminate it.
  - **Discarded: "Must make reference fully determinate in principle."** Why? This is a prejudice of realist philosophies. Indeterminacy (e.g., Quine's gavagai) might be unavoidable, and denying it begs the question.
  - **Discarded: "Must be statable in the object language."** Why? While desirable (promoting symmetry), this is a negotiable ideal. Theories often use metalanguages (e.g., English discussing Gavagai-speak), and demanding self-applicability might exclude useful accounts.

  The surviving eight requirements are below. I label each **non-negotiable** (essential for any adequate theory), **negotiable** (important but theory-dependent), or **risk of prejudice** (could reflect philosophical bias if mishandled). For each, I specify the case driving it, distinguish indeterminacy from ignorance, and note how we might tell the difference.

  1. **Empirical Accountability** (Non-negotiable)  
     *What it requires*: The theory must ground claims in observable evidence (e.g., assent/dissent, usage patterns, corpus data). It cannot rely on unobservable mental states.  
     *Case*: All scenarios (esp. 1, 2, 3, 4). Behavior (pointing, assent) or text is primary data.  
     *Indeterminacy vs. Ignorance*: Ignorance = more data could resolve it (e.g., finding new contexts in scenario 1). Indeterminacy = no possible data fixes it (e.g., Quine's gavagai). We tell by testing if *all conceivable evidence* underdetermines reference.  
     *Why non-negotiable*?: Without this, the theory is untestable—just "a shrug."

  2. **Indeterminacy Admission** (Non-negotiable)  
     *What it requires*: The theory must allow that reference might be genuinely indeterminate in some cases (i.e., no "fact of the matter"). It must explain why, not just say "we can't know."  
     *Case*: Scenarios 1 (if neither word is "rabbit") and 4 (corpus-only).  
     *Indeterminacy vs. Ignorance*: As above, but here the theory must *posit* indeterminacy when evidence is symmetric (e.g., two manuals fit all data equally in scenario 5). We tell by checking if rival manuals are empirically equivalent.  
     *Why non-negotiable*?: Avoids false precision; makes indeterminacy a "finding," not evasion.

  3. **Error Accommodation** (Non-negotiable)  
     *What it requires*: The theory must handle false beliefs (e.g., "ancestors caused crop failure") without making speakers always right by reinterpreting their words. It must distinguish meaning from belief.  
     *Case*: Scenario 6. If speakers are wrong, translation should preserve that wrongness (e.g., not render "angry ancestors" as "drought" to make them right).  
     *Why non-negotiable*?: Otherwise, speakers are infallible, and translation loses critical content (e.g., cultural beliefs).

  4. **Corpus-Only Assessment** (Non-negotiable)  
     *What it requires*: The theory must specify whether reference can be fixed from text alone (e.g., machine translation corpora) and how this differs from field settings with shared context.  
     *Case*: Scenario 4 (your key case). Difference: Field settings add perceptual co-presence (e.g., pointing) that disambiguates via joint attention; corpora lack this, relying on co-occurrence patterns.  
     *Indeterminacy vs. Ignorance*: Ignorance = more text might help (e.g., finding "rabbit stew" contexts). Indeterminacy = text is inherently insufficient (e.g., "gavagai" in a corpus could mean rabbit or stage if no perceptual grounding).  
     *Why non-negotiable*?: Machine translation is central to your piece; a theory ignoring it is inadequate.

  5. **Evidence Independence** (Risk of prejudice—handle carefully)  
     *What it requires*: The theory must define "independent evidence" for reference that isn't contaminated by the theory itself (e.g., post-hoc speaker judgments influenced by translation).  
     *Case*: Scenario 5. Speakers taught via a manual can't provide independent evidence; independence requires evidence untouched by the theory (e.g., novel usage, historical texts predating contact).  
     *Why risk of prejudice*?: Demanding *too much* independence might make evidence impossible (all data is theory-laden), but too little invites circularity. Negotiable: Minimal independence (e.g., untrained speakers) suffices.

  6. **Symmetry** (Non-negotiable)  
     *What it requires*: The theory must apply the same standards to all languages, including the linguist's. No privileging English.  
     *Case*: Scenario 7. If Gavagai-speak has indeterminate reference, so must English (e.g., "rabbit" could mean undetached part).  
     *Why non-negotiable*?: Avoids colonial or Anglocentric bias; ensures generalizability.

  7. **Coordination Explanation** (Negotiable)  
     *What it requires*: The theory must explain successful communication in "core" cases (e.g., hunting rabbits) and failures at "edges" (e.g., rabbit-shaped rocks). It need not resolve edge cases but must account for why they diverge.  
     *Case*: Scenario 3. Practical core relies on shared salience (e.g., rabbits are prototypical); edges fail due to vagueness or context shifts.  
     *Why negotiable*?: Some theories (e.g., inferential-role) handle this better than others (e.g., causal), but all must address it to avoid cherry-picking data.

  8. **Determinacy Discrimination** (Non-negotiable)  
     *What it requires*: The theory must distinguish "reference is indeterminate" (no fact) from "we lack evidence" (ignorance). It must say how we could tell—e.g., through empirical equivalence tests.  
     *Case*: Scenario 5 (rival manuals). If manuals disagree but fit all data, it's indeterminacy; if one fits better with new evidence, it was ignorance.  
     *Why non-negotiable*?: Your core demand—this turns "shrugs" into findings.

  ### Critical Tensions and Key Excluder
  - **Jointly Unsatisfiable Requirements? Yes—between Empirical Accountability and Determinate Reference.**  
    Argument: If empirical evidence is limited (e.g., corpus-only in scenario 4, or assent patterns in scenario 2), and we demand determinate reference (not just indeterminacy admission), we face a contradiction.  
    - *Why*: Empirical Accountability restricts us to observable data. In corpus settings (scenario 4), we lack perceptual grounding, making reference underdetermined. Forcing determinacy here would require unobservable "meanings," violating empiricism.  
    - *Outcome*: The theory *must* allow indeterminacy in low-evidence settings. Otherwise, it becomes dogmatic (asserting determinacy without proof) or mystical (invoking non-empirical facts).  
    This tension forces a result: **In corpus-only or ambiguous field settings, reference often cannot be "pinned down" determinately—and a good theory will say why (e.g., missing joint attention).**

  - **Highest-Impact Requirement: Indeterminacy Admission**  
    This excludes otherwise attractive theories (e.g., strong causal theories) that insist reference is always determinate. It also challenges deflationary views that dismiss the problem. Without it, theories evade hard cases like scenario 1 or 4, masking ignorance as resolution.

  ### Scoring Major Theoretical Families
  *Quick reference:*
  - **Charity/truth-conditions**: Prioritizes making speakers rational/true (e.g., "ancestors" must mean something plausible).
  - **Causal/informational**: Reference fixed by causal links to objects (e.g., "rabbit" hooks to rabbits via perception).
  - **Inferential-role**: Meaning is use (e.g., "rabbit" defined by inferences like "furry," "hops").
  - **Deflationary**: "Reference" is a trivial, non-explanatory concept.

  | Requirement               | Charity/Truth | Causal | Inferential-Role | Deflationary |
  |---------------------------|---------------|--------|------------------|--------------|
  | Empirical Accountability  | Good (field-focused) | Weak (ignores corpus gaps) | **Strong** (uses all data) | Poor (dismisses evidence) |
  | Indeterminacy Admission   | Poor (assumes determinacy) | Poor (denies indeterminacy) | **Strong** (allows underdetermination) | **Strong** (calls it trivial) |
  | Error Accommodation       | Weak (over-charitable) | **Strong** (allows error) | Good (handles false beliefs) | Poor (avoids substance) |
  | Corpus-Only Assessment    | Poor (needs truth) | Weak (needs causation) | **Strong** (text as use) | Poor (no assessment) |
  | Evidence Independence     | Fair (avoids circularity) | Fair (relies on history) | Weak (role contaminates) | Poor (irrelevant) |
  | Symmetry                  | Good (applies universally) | Fair (but Western bias) | **Strong** (universal) | **Strong** (universal) |
  | Coordination Explanation  | Fair (core cases) | Weak (edges ignored) | **Strong** (core/edges as use) | Poor (no explanation) |
  | Determinacy Discrimination| Poor (blurs ignorance/indeterminacy) | Poor (assumes determinacy) | Good (distinguishes use patterns) | **Strong** (rejects both) |

  **Summary Scores**:  
  - **Inferential-role** (e.g., Brandom, Wittgenstein) handles most requirements best, especially corpus, indeterminacy, and coordination.  
  - **Causal** (e.g., Kripke) fails at indeterminacy and corpus cases.  
  - **Charity** (e.g., Davidson) struggles with error and corpus.  
  - **Deflationary** (e.g., Quine later, Rorty) aces indeterminacy but fails empirical accountability and error—it gives a "shrug," not findings.  

  ### Final Note
  An adequate theory must deliver public, evidence-based judgments about reference—not just for philosophers, but for your skeptical reviewer. It will often conclude indeterminacy (especially in corpus settings), but this is a substantive finding: "Reference isn't fixed here because evidence X is missing, and here's why." No theory satisfies all requirements perfectly, but inferential-role comes closest for your purpose. I can expand any section if useful.
