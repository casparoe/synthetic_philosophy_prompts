prompt: |-
  I sit on the privacy review board of a large hospital system, and for several years I have been noticing a family of complaints and incidents that our intake categories handle badly. Our forms assume a subject who has data, a holder who holds it, and a flow between them that is either authorised or not. The cases that trouble me do not fit that shape, and I want to know whether there is an established concept for what they have in common, or for the differences between them.

  (a) A man sends a consumer ancestry kit to a testing company. His results come back and disclose to his sister — who submitted nothing, is not a customer, and has no relationship with the company of any kind — a fact about her own parentage that she did not want and had not sought. Nothing about her entered the company's systems. The fact was derived from a record that was, in its own terms, entirely about someone else.

  (b) Four of a woman's friends install an app that uploads contact lists alongside coarse time-stamped location. From the pattern of co-presence alone the firm can assign a home address, a workplace, and a weekly routine to that woman, and it does. She has never used the app, has no account, has passed through no consent flow, and has no setting to change.

  (c) A fitness platform publishes route heat-maps that it describes as aggregate. In a village of roughly two hundred residents the aggregate makes visible the fact that one identifiable person leaves the house before dawn each day and walks a fixed loop. No individual record was disclosed; the visibility is a property of how thin the population is.

  (d) A household's grocery and pharmacy purchases feed a model that flags the household as likely to contain a pregnancy, and the flag triggers marketing and a call from a care-management programme. The woman in question is not pregnant. If privacy is a matter of facts about a person getting out, this is not a privacy matter at all — nothing true was learned about anyone — yet the experience of the flagged person and the shape of the downstream effects are indistinguishable from the cases where the inference happens to be correct.

  There is one further feature that recurs across all four and that I suspect is the heart of it. In each case, the person affected cannot protect herself by her own restraint. Her not uploading her own genome stops protecting her once enough relatives have uploaded; her not installing the app does not help if enough of her friends do; her caution about her route is undone by how few of her neighbours use the platform. The protective value of her own restraint is a function of other people's choices, and it erodes as theirs are made.

  The terms I have run across seem near but not right. Group privacy, as I have seen it used, concerns a collective that holds a right of its own against outsiders, not one individual whose exposure is a by-product of another's. Contextual integrity concerns the appropriateness of flows of *my* information given the norms of a context, but in (b) the flow is perfectly appropriate with respect to everyone who did share, and the person harmed is not a party to it at all. And the mosaic or aggregation worry is about many scraps concerning *one* person accruing to a single holder, which is not what happens in (a) or (b).

  So I am asking for more than a label:

  1. Is there an established concept or literature for this, and if several concepts are nearby, which fits and why do the others fall short?

  2. Is it one phenomenon or several? I would like a taxonomy with reasons: I suspect (a) and (b) differ in kind — a fact jointly held versus a fact inferred statistically — and I suspect (d) may not be a privacy case at all. Tell me if those suspicions are wrong.

  3. Which accounts of privacy's value predict a wrong here, and which go silent? Control-based accounts seem to have nothing to say, since the affected person never had control to lose; access and accessibility accounts seem to do better in (a) and worse in (c); contextual accounts need a story about who counts as a party to the context. Is this best described as a new kind of privacy harm, an old harm reached by a new route, or a harm of some other kind altogether? Please argue the alternatives rather than assert one.

  4. Where are the edges? Must the derived fact be true? Must there be a pre-existing relationship, or is bare statistical proximity enough? Does the concept extend to firms or states as affected parties? Does it require identifiability, or does membership in a flagged class suffice? And when two people have incompatible interests in one record — my sibling wants to upload, I do not — what is the structure of the conflict: a veto in either party, a majority among the exposed, a balancing, or something else?

  5. If nothing established fits, coin a term, define it precisely, and specify a case that lies just outside it, so I can tell whether I have drawn the boundary in the right place.

  I am working from a library copy of an anthology with no internet access, so I cannot chase references; please make the case for the carving directly instead of pointing me at papers I cannot retrieve.
reasoning: |-
  Okay, the user is part of a hospital privacy review board and has been encountering cases that don't fit traditional privacy frameworks. They provided four examples where individuals are affected by others' data sharing or aggregation, leading to privacy harms they can't control. They need help identifying if there's an established concept for this, a taxonomy, which privacy theories address it, boundary questions, and potentially a new term.

  First, I need to parse each case. In (a), genetic data from one person reveals information about a relative. This is a known issue in genomics. The sister didn't share any data, but the inference affects her. Then (b) involves location inference through friends' app usage. The woman's routine is inferred without her consent. (c) is about aggregate data becoming identifiable in sparse populations. (d) involves incorrect inferences triggering actions, even though no true fact was disclosed.

  The common thread is that individual restraint is ineffective because the harm comes from others' actions. This challenges control-based privacy models. The user mentioned group privacy and contextual integrity but found them inadequate. Group privacy usually deals with collective rights, not individuals affected by association. Contextual integrity focuses on norms around an individual's data flows, not secondary subjects.

  For question 1, existing concepts like secondary privacy harm and network privacy might fit. Secondary privacy harm captures harms to non-consenting individuals from others' data sharing. Network privacy addresses how data from multiple nodes affect others in the network. These fit because the harm is derivative and relational. Group privacy falls short as it's about the group as an entity, not individuals within a network.

  Moving to question 2, the user suspects (a) and (b) differ. (a) involves a fact jointly held (genetic relatives), while (b) is statistical inference. (d) might not be privacy if defined as truth disclosure. However, the harm here is about the consequence of inference, regardless of truth. So (d) still fits under inference harm. The taxonomy could be: relational derivation (a), network inference (b), statistical identifiability (c), and inference harm (d). All share the erosion of individual control through others' actions.

  For question 3, control-based theories (like Westin's) don't address this since the individual never had control. Accessibility-based theories (Gavison) work better for (a) and (b) where information becomes accessible. Contextual integrity (Nissenbaum) struggles because the affected person isn't part of the context. Relational or network-based theories like Solove's aggregation concept or Altman's boundary management (if extended) might apply. This is an old harm (exposure) but via new routes (networks, aggregation), so existing frameworks need extension.

  Question 4 explores boundaries. Must the fact be true? In (d), the inference was false, but harm still occurred, so truth isn't necessary. Pre-existing relationships matter in (a) but not in (b) where mere proximity suffices. Firms or states could be affected if inferences reveal confidential info. Identifiability is key in (c) but class membership might suffice if it leads to differential treatment. For conflicts, like genetic data sharing, solutions might involve mutual consent or thresholds, not veto power.

  Question 5: if no term fits, propose "networked exposure." Define it as harm from data shared by others in one's network, reducing protective capacity of individual actions. A borderline case would be public data aggregation affecting an individual without network ties, which wouldn't fit as it's not relational.

  Underlying needs: The user needs actionable frameworks for policy. They might be struggling with categorizing incidents for reporting and mitigation. Their deeper need is to justify policy changes in the hospital system, requiring clear concepts and boundaries. They also need to educate stakeholders on these indirect privacy harms beyond traditional models.
answer: |-
  Based on your detailed cases and analysis, this represents a significant gap in traditional privacy frameworks. While no single established term perfectly captures all nuances, the most fitting conceptual umbrella is **Secondary Privacy Harm** or **Relational Privacy Harm**, augmented by concepts from **Network Privacy** and **Inference Harm**. Let's break this down step-by-step:

  ### 1. Established Concepts & Why Others Fall Short
  - **Secondary Privacy Harm (Best Fit)**  
    This describes harm to an individual arising from the processing of *another person's data*. Your cases (a), (b), and partially (d) fit:  
    - (a) Sister's harm stems from *brother's* genetic data.  
    - (b) Woman's routine inferred from *friends'* contact/location data.  
    - (d) Woman flagged due to *household's* purchase data.  
    **Why it fits**: Centers on the *derivative harm* to non-consenting individuals.  
    **Why others fall short**:  
    - *Group Privacy*: Focuses on collective entities (e.g., ethnic groups), not individuals impacted relationally.  
    - *Contextual Integrity*: Assumes the affected individual is a party to the context. Here, the context (e.g., app users) excludes the harmed person.  
    - *Mosaic Theory*: Concerns aggregation *about one individual*. Cases (a) and (b) involve data *not originally about the subject*.

  - **Network Privacy (Key Augmentation)**  
    Focuses on how data about one node (person) in a network reveals information about connected nodes. Explains why individual restraint fails: protective capacity depends on network topology and others' choices.  
    **Fits**: (a) Genetic network, (b) Social graph.  
    **Limitation**: Less directly applicable to (c) and (d).

  - **Inference Harm (Critical for (c) & (d))**  
    Harm from *deduced* information, regardless of source data accuracy.  
    **Fits**: (c) Deduced routine from aggregates; (d) Harm from incorrect inference.  
    **Why standalone isn't enough**: Doesn't emphasize the *relational* or *networked* origin.

  ### 2. Taxonomy: One Phenomenon, Four Subtypes  
  This is **one core phenomenon**—**privacy harm to individuals via data not directly about them, enabled by relationships or statistical proximity**—with subtypes:  

  | **Type**               | **Cases** | **Key Mechanism**                     | **Why a Privacy Harm?**                              |
  |------------------------|-----------|---------------------------------------|------------------------------------------------------|
  | **Relational Derivation** | (a)       | Shared biological/legal attributes (genetics, family) | Reveals intimate facts without consent.              |
  | **Network Inference**    | (b)       | Social/contact graph proximity        | Infers private life patterns via associations.       |
  | **Statistical Identifiability** | (c)     | Re-identification in sparse populations | Aggregate "anonymity" fails, exposing behavior.      |
  | **Inference Harm**       | (d)       | Algorithmic judgment (true or false)  | Causes tangible consequences akin to disclosure.     |

  **Your suspicions assessed**:  
  - (a) and (b) *do* differ: (a) relies on inherent biological linkage; (b) on statistical correlation in social networks.  
  - (d) *is* a privacy harm: Privacy isn't solely about "truth" but control over inferences and their impacts (e.g., profiling, discrimination).

  ### 3. Privacy Theories: Who Predicts the Harm?  
  - **Control-Based Theories (e.g., Alan Westin)**: **Fail**. If privacy is control over *one's own* data, these cases fall outside—no control was possible.  
  - **Accessibility-Based Theories (e.g., Ruth Gavison)**: **Partially succeed**. Harm arises from unwanted accessibility of information (strong for (a), (c); weaker for (d)).  
  - **Contextual Integrity (Helen Nissenbaum)**: **Limited**. Requires norms governing flows *involving the subject*. Here, the subject isn't part of the context.  
  - **Relational Theories (e.g., Julie Cohen)**: **Best fit**. Privacy enables boundary management in social contexts. Networked erosion of boundaries aligns here.  
  - **Harm-Based Views (e.g., Daniel Solove)**: **Strong fit**. Focuses on *harms* (e.g., exclusion, distortion) rather than control. (d)'s marketing/calls fit Solove's "aggregation" and "secondary use" harms.  

  **Verdict**: This is an **old harm** (exposure of private facts) reached through **new routes** (networked data, algorithmic inference). Theories ignoring relationality or inference impacts go silent.

  ### 4. Boundary Questions  
  - **Must the fact be true?** *No*. Harm in (d) arises from *actionable inference*, regardless of truth.  
  - **Pre-existing relationship required?** *No*. (b) works via statistical proximity (co-location patterns), not direct ties.  
  - **Applies to firms/states?** *Yes*. E.g., a business's strategy inferred from competitors' public data.  
  - **Identifiability necessary?** *Not always*. (d) harms via class membership (e.g., "likely pregnancy" household).  
  - **Conflict resolution (e.g., genetics)**: No consensus. Ethically, this suggests:  
    - **No individual veto** (blocks progress).  
    - **No majority rule** (ignores disproportionate harm).  
    - **Balancing test**: Weigh gravity of harm to non-consenting party against benefits to others.  

  ### 5. If Coining a Term: **Networked Exposure Harm**  
  - **Definition**: *Harm arising when an individual’s privacy is compromised not by their own data actions, but by the data actions or exposures of others within their relational or statistical network, eroding the protective value of their personal restraint.*  
  - **Key Elements**:  
    1. Harm to a non-consenting individual.  
    2. Originates from data about others/aggregates.  
    3. Mediated by network ties or statistical proximity.  
    4. Individual restraint is insufficient due to dependency on others.  
  - **Borderline Case (Outside Scope)**:  
    *A person is identified via facial recognition in a public crowd photo.*  
    **Why it's outside**: No relational network or others' data actions enabled the harm; it’s direct identifiability of the individual.  

  ### Why This Carving Works for Your Cases
  - **Erosion of restraint**: Central to all cases, captured by "protective value of personal restraint" in the definition.  
  - **Relational/statistical origin**: Explicitly addresses joint facts (a), inferred patterns (b), sparse populations (c), and household data (d).  
  - **Harm-focused**: Encompasses both true revelations (a, c) and actionable inferences (d).  

  This framework shifts focus from data ownership to *networked vulnerability*. For your hospital board, policies should consider:  
  - Consent protocols for data with relational implications (e.g., genetics).  
  - Risk assessments for aggregate data publication (e.g., thresholds for sparse populations).  
  - Governance of algorithmic inferences affecting non-participants.  

  Would you like to explore policy mitigations or ethical frameworks for resolving conflicts (e.g., genetics vetoes)?
