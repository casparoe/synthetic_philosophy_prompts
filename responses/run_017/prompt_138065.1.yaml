prompt: |-
  I convene a fortnightly reading group on disagreement — six of us, three philosophers and three people from economics, climate science and law — and at the next meeting I am the one who has to go first: I have been asked to write my own position down as a short list of commitments so that everyone else can spend the session attacking it. I also have a practical reason for wanting the list to hang together. I moderate a fairly large online forum where the participants are, as far as anyone can tell, equally intelligent, equally informed and equally careful, and where disagreements are constant; I would like to be able to defend a consistent policy about when I announce publicly that I have moved. The trouble is that when I actually write the list out it reads less like a view than like a pile of exemptions, and I cannot tell which of the exemptions are principled and which are self-serving. Last month I noticed the problem in miniature: in an argument with a friend about a factual question in our shared field I announced that I was splitting the difference with her, and twenty minutes later, in an argument about animal agriculture, I said I was not budging at all — and when she asked what the difference was, my answer felt better than it sounded.

  Here is where I think I have landed. (1) When someone I antecedently count as an epistemic peer — same evidence, comparable competence, comparable track record of carefulness — disagrees with me about a non-moral question of fact, I should move my credence to roughly the midpoint between my position and hers: not all the way to hers, and not stay put. (2) Fundamental moral and political disagreement is different. I do not lower my confidence in my views about, say, the moral status of animals or about what justice requires merely because people as intelligent, informed and careful as I am, who know all my arguments, disagree with me. The reason I would give: whether someone is my peer with respect to a fundamental moral question is not something I can settle without already taking a stand on the contested moral framework itself, so there is no neutral standpoint from which to say that we are equally likely to be right and no neutral point to split toward. (3) I nonetheless defer substantially to expert consensus in domains with agreed success criteria. I defer to climate scientists about climate sensitivity even though I cannot follow the models, and consensus plus institutional track record is enough for me to treat their disagreements with laypeople as not peer disagreements at all. (4) I do not think the sheer number of disagreeers does much work when the disagreeers are distant in time or culture: that most intelligent people in 1750, or most people in contemporary societies with very different upbringings, would have rejected things I now believe about animals or religion gives me essentially no reason to reduce my confidence. (5) I also think I am entitled to stay put, or to move much less than halfway, when I have a concrete account of where my peer went wrong — I can identify the step in her reasoning that I take to be a mistake, and it is not just a restatement of the fact that we disagree. I will grant the uncomfortable point that people who are in fact wrong can almost always produce an account of exactly this shape, and that I cannot tell from the inside whether mine is one of them; I still want to say that a genuinely specific account does some work. (6) Finally, I do not think the midpoint is the whole story even where (1) applies: when I know my peer has read the two most recent papers on the question and I have read one, I think I should move further than halfway toward her, and when I know she has been working eighty-hour weeks for a month I think I should move less far.

  What I want from you is an audit, not a survey of how the debate goes. Go through these and tell me which are genuinely in tension with one another and which only look as though they are, and in each case say which commitment has to give. Rank the real tensions by severity, say for each what the cheapest repair would be and what that repair would cost me elsewhere in the list, and then tell me which single revision would clean up the most. Two things I would like you to press on rather than assume: if I am honest, the pair I am most worried about is (2) and (3), since one has me deferring to people whose reasoning I cannot follow and the other has me refusing to defer to anyone; and I am half tempted to just delete (6), which may not be a separate commitment at all. Do not assume those are where the real problems are.
reasoning: |-
  Okay, let me start by understanding the user's situation. They run a reading group on disagreement and need to present their position as a list of commitments. They also moderate an online forum and want a consistent policy for when to announce changing their stance. The problem is their list feels like a pile of exemptions, and they're unsure which are principled versus self-serving. 

  First, I need to analyze each commitment and check for internal tensions. The user mentioned being especially worried about (2) and (3)—deferring to experts in some areas but not in moral disagreements. But they also want me to look beyond those, so I shouldn't assume that's the only issue.

  Looking at (1): Moving to the midpoint with epistemic peers on non-moral facts. Then (2) says no movement on fundamental moral issues because there's no neutral ground. That makes sense in theory, but how does it interact with (3), where they defer to expert consensus? Climate science has agreed success criteria, unlike ethics. But the user might be conflating expertise with epistemic peerage. Climate scientists aren't peers to laypeople because of their specialized knowledge, so (3) isn't a peer disagreement case. That resolves the tension between (2) and (3) if I clarify that (3) is about expertise, not peer disagreement. 

  Now, (4) dismisses historical/cultural numbers of disagreeers. But if the user defers to current experts in (3), why not consider past experts? The justification in (4) is about different evidence and frameworks, which is consistent. However, there's a hidden tension with (3) because past experts might have been as competent but lacked current data. The user could counter that today's consensus incorporates historical data, so deference is to the current cumulative knowledge. That seems defensible.

  Commitment (5) allows staying put if there's a concrete error in the peer's reasoning. The user admits this could be self-deceptive. The tension here is with (1), which demands moving to the midpoint. If the user can pinpoint an error, that might justify not moving halfway, but how often is that error genuine? The user needs to acknowledge that self-awareness is key here. Without external checks, this exemption could be overused, weakening (1). 

  Then (6) adds nuances to the midpoint adjustment based on evidence access or fatigue. It's an extension of (1), so maybe not a separate commitment. But it introduces subjectivity. If the peer is overworked, how much less should the user move? There's a risk of arbitrary adjustments here, which could undermine the objectivity of (1). Integrating it into (1) with clear criteria might help.

  Ranking the tensions: The biggest one is between (1) and (5). (1) requires moving to the midpoint, but (5) allows holding firm with a specific error. This could create a loophole. The cheapest fix is to emphasize that the error must be identifiable and not just a disagreement restatement. However, the user already acknowledges the self-deception risk, so perhaps they need a higher burden of proof for invoking (5). 

  Next, (2) and (4) might conflict if historical moral disagreements are considered. The user doesn't defer to past moral views, but what if the consensus shifts? The user might argue that moral progress happens, so past views are less relevant. But they need to reconcile this with their stance that moral truth isn't determined by consensus. The repair is to clarify that historical context affects evidence, not just competence, which they already do in (4).

  The user's practical concern as a moderator is important. They need a policy for when to announce changing their mind. The list must be consistent to avoid arbitrary decisions. Exemptions like (5) and (6) could lead to inconsistent applications. Streamlining (6) into (1) and tightening (5) would help. The single best revision might be to merge (6) into (1) with explicit factors, reducing ad-hoc adjustments.

  Also, considering the forum moderation: When participants are equally intelligent and informed, peer disagreement should trigger midpoint movement (1). But if someone provides a concrete error (5), staying put is allowed. The challenge is ensuring that (5) isn't misused. The user might need transparent criteria for what counts as a concrete error to maintain fairness.

  Overall, the main tensions are between (1)/(5) and potential subjectivity in (6). Addressing these would strengthen the framework. The user's self-awareness about self-serving exemptions is crucial here, so emphasizing structured justifications for each exemption can mitigate that risk.
answer: |-
  Here's an audit of your commitments, identifying genuine tensions, superficial conflicts, necessary repairs, and prioritization. The core tension isn't actually between (2) and (3), but lies elsewhere. I'll press on your concerns while following your instructions rigorously.

  **Genuine Tensions (Ranked by Severity):**

  1.  **Tension: (1) vs. (5) - The Peer Disagreement Engine vs. The Error Trap**
      *   **Nature:** (1) mandates significant movement towards the midpoint in peer disagreement on non-moral facts. (5) provides a major exemption: if you can pinpoint a specific error in the peer's reasoning, you move less (or not at all). The problem is asymmetry and self-serving application. You correctly note that *anyone* can generate a "concrete account" of the other's error. Your ability to do so feels like evidence *to you*, but it's precisely the contested ground. (1) assumes symmetry of peerhood, while (5) inherently breaks that symmetry based on your internal assessment *of the very disagreement*. This creates a large, easily exploited loophole that fundamentally undermines the force of (1).
      *   **Severity:** **Highest.** This directly threatens the core mechanism of (1) and risks collapsing peer deference into "I move when I can't find a specific flaw," which is often just "I move when I'm convinced," defeating the purpose.
      *   **Cheapest Repair:** Severely restrict (5). State that identifying a specific error only *permits* moving *slightly less* than halfway (never staying put) and requires an exceptionally high burden of proof: the error must be demonstrable *without* relying on premises central to the disagreement itself (e.g., identifying a clear logical fallacy or empirical mistake independent of the core disputed inference). Acknowledge this is rare in genuine peer disputes on complex matters.
      *   **Cost:** Significantly weakens your ability to "stay put" even when you feel strongly you've found the flaw. Forces more movement in many disagreements where you currently invoke (5). Reduces psychological comfort.
      *   **Alternative Costlier Repair:** Abandon (1)'s midpoint as the default. Make movement proportional to the strength/independence of the error account identified under (5). This is complex, subjective, and likely less consistent.

  2.  **Tension: (1)/(6) vs. (2) - The Peerhood Criterion Applied Inconsistently?**
      *   **Nature:** Your justification for (2) hinges on the claim that **establishing moral peerhood requires adopting a moral framework**, thus lacking neutrality. However, applying (1) and (6) *also* requires assessing peerhood (competence, carefulness, access to evidence) on non-moral questions. Is assessing *epistemic* peerhood truly neutral? Judging "comparable competence" or "carefulness" in complex non-moral domains (e.g., economics, intricate historical analysis) often involves substantive judgments about methodology, relevance, and reasoning standards – judgments that might themselves be contested and framework-dependent. The line between "this person lacks competence on this specific factual inference" and "this person's entire framework is flawed" can be blurry. Your sharp separation between "factual" (deference required) and "fundamental moral" (no deference) might rely on an unrealistically clean distinction regarding peer assessment.
      *   **Severity:** **High.** If peer assessment in *non-moral* domains isn't truly neutral either, the foundation of (1)/(6) weakens, and the justification for the special status of (2) becomes less clear-cut. It risks making your entire peer deference system more subjective.
      *   **Cheapest Repair:** Reframe the justification for (2). Instead of claiming unique *impossibility* of neutral peer assessment in morals, argue that the *degree* of framework-dependence is vastly higher and more fundamental in core moral disagreements. Acknowledge that peer assessment in complex non-moral domains isn't perfectly neutral but relies on more widely shared (though fallible) standards of evidence and inference. Emphasize the "agreed success criteria" point from (3) as a key difference maker for non-moral domains where expertise exists.
      *   **Cost:** Requires nuance and weakens the "knock-down" argument for (2). Makes the boundary between (1) and (2) fuzzier in marginal cases (e.g., disagreements involving contested social science methodologies with normative implications).

  3.  **Tension: (3) vs. (4) - Deference to Present Experts vs. Dismissal of Past/Cultural Majorities**
      *   **Nature:** (3) has you deferring heavily to current expert consensus based on institutional track record and agreed success criteria. (4) dismisses the weight of disagreement from intelligent, informed people in the past (1750) or different cultures. However, these past/distant groups often *were* the "experts" by the standards of their time/culture, with their own institutional track records and (locally) agreed success criteria. Why does the *current* consensus of experts in *your* culture get deference, while the consensus of experts in *their* context gets none? The "different evidence" point in (4) is crucial, but current experts also have different (better) evidence than past ones. Is the difference merely the *direction* of epistemic progress *from your perspective*?
      *   **Severity:** **Moderate.** It highlights a potential presentist/cultural bias in your deference model. It doesn't directly contradict (3) or (4), but it exposes a justificatory gap.
      *   **Cheapest Repair:** Strengthen (4)'s justification. Explicitly state that deference under (3) is justified *because* current expert consensus incorporates the *cumulative* evidence and critical scrutiny across time and cultures (to the extent accessible/translatable), and crucially, operates within domains with relatively stable, objective success criteria (predicting climate, curing disease). Past/distant groups lacked access to this cumulative evidence/knowledge and often operated within frameworks where success criteria were fundamentally different or entangled with non-empirical values in ways that modern science (ideally) minimizes. Their disagreement is thus evidence of different starting points/inputs, not equal evidence about a shared objective reality.
      *   **Cost:** Requires a more robust account of epistemic progress and the unique stability of success criteria in domains like climate science. Might not fully satisfy critics who see more continuity or value in past/cultural perspectives.

  **Superficial Tensions (Only Look Problematic):**

  1.  **(2) vs. (3): Deference Refusal vs. Deference Granting**
      *   **Appearance:** You refuse to defer to peers on morals (2) but defer to distant experts on climate (3). This *looks* inconsistent.
      *   **Reality:** **No genuine tension.** (2) is about *peer* disagreement. (3) explicitly states you **do not** treat expert/layperson disagreements *as peer disagreements*. The core of (3) is recognizing **asymmetry** based on expertise, track record, and agreed success criteria. The mechanic in (1) doesn't apply. (2) addresses symmetric peer disagreement within a domain lacking agreed success criteria. They operate on fundamentally different principles: (1)/(2) deal with symmetric peers, (3) deals with asymmetric expertise. This is a strength, not a conflict. Your worry stems from misclassifying (3) as a peer case.

  2.  **(6) vs. Coherence: Is it Redundant or Problematic?**
      *   **Appearance:** (6) adds messy, subjective adjustments to the clean midpoint rule of (1), potentially undermining it or being arbitrary.
      *   **Reality:** **No genuine tension; integration needed.** (6) is not separate from (1), but a necessary refinement. (1) assumes peers have "same evidence" and "comparable carefulness." (6) addresses situations where this assumption is violated *in specifiable ways* (differential evidence access, temporary impairment like fatigue). It's an attempt to *maintain* the spirit of peer deference when the initial peerhood assessment was imperfect. The problem isn't tension, but potential vagueness ("move further," "move less far").
      *   **Repair:** **Integrate (6) into (1).** Reword (1) to: "When I antecedently count someone as an epistemic peer (same evidence, comparable competence, comparable track record of carefulness) **and conditions for careful evaluation are comparable**, I should move my credence significantly toward theirs, typically near the midpoint. **Factors like known differential access to key evidence or significant temporary impairment (e.g., extreme fatigue) require adjusting the degree of movement proportionally.**" This makes it core to the peer assessment/application, not an exception.

  **Priority Repair & Clean-Up Recommendation:**

  1.  **Address the Core Flaw: Repair the (1) vs. (5) Tension.** This is the most severe threat to internal consistency and risks making your "peer deference" policy arbitrary in practice. Implement the "Cheapest Repair": severely restrict (5), demanding near-demonstrative, framework-independent errors for reduced movement, and never allowing staying put based solely on your own error identification in a peer dispute. **This single revision does the most to clean up the pile-of-exemptions feeling** by closing the largest self-serving loophole.
  2.  **Integrate (6) into (1).** This eliminates a separate "exception" and grounds the adjustments within the core peer assessment logic of (1), reducing ad-hoc-ness.
  3.  **Clarify the (3) vs. (4) Justification.** Strengthen the explanation for why current expert consensus in domains like climate science merits unique deference compared to past/cultural majorities, focusing on cumulative evidence and stable success criteria.
  4.  **Refine the (1)/(6) vs. (2) Distinction.** Acknowledge that peer assessment in complex non-moral domains isn't perfectly neutral but argue the framework-dependence is qualitatively different and less totalizing than in core moral disputes. Emphasize the role of "agreed success criteria" (from 3) as a key differentiator enabling more objective peer assessment in non-moral domains.

  **Revised Core Commitments (Post-Repair Sketch):**

  *   **(1+6):** Peer Disagreement (Non-Moral Fact): Move significantly toward peer (typically near midpoint) *unless* known asymmetries in evidence/conditions require proportional adjustment. Peerhood requires comparable evidence/conditions.
  *   **(5 - Restricted):** Reduced movement *only* permitted if a specific, demonstrable error in the peer's reasoning can be identified *without* relying on contested premises of the disagreement itself. Never justifies staying put.
  *   **(2):** Fundamental Moral/Political: No required movement based solely on symmetric peer disagreement due to deep framework-dependence of peer assessment.
  *   **(3):** Expert Consensus: Defer substantially in domains with agreed success criteria and institutional track records. This is asymmetric deference, not peer disagreement.
  *   **(4):** Historical/Cultural Disagreement: No weight from sheer numbers across significant epistemic divides (time/culture), as they reflect different evidence/frameworks, not equivalent evidence about a shared reality.

  This structure is more robust, minimizes self-serving exemptions (especially by constraining 5), integrates nuances (6 into 1), and clarifies the distinct bases for (2) and (3). It provides a much firmer foundation for your moderation policy. Good luck with the reading group! They'll have less to attack, but the attacks will be sharper.
