answer: |-
  ### Final Paper Question  
  **Discuss the philosophical function of Berkeley's 'master argument' (from *Principles* §22-23 and *Dialogues* I) within his broader case against mind-independent matter. Explain how it interacts with his critiques of abstraction and the likeness principle. Using the example of a geological stratum laid down before any finite mind existed, analyze whether the argument requires divine perception to succeed, and clarify what distinction between *conceiving* and *supposing* Berkeley must defend for this argument to avoid circularity. Do not merely restate Berkeley’s conclusions.**

  ---

  ### Model Answer (650 words)  
  Berkeley’s master argument is neither a standalone proof nor a rhetorical flourish but a strategic closure to a gap left by his other premises. Its function emerges only when we see how abstraction and the likeness principle prepare the ground yet remain vulnerable to a materialist rejoinder.  

  The critique of abstraction denies that we can form ideas of qualities existing in isolation (e.g., "extension without colour"). The likeness principle (§8) asserts that ideas can only resemble other ideas, blocking representation of mind-independent archetypes. Together, they dismantle Locke’s model of perception: if we cannot abstract primary qualities from sensory experience, nor claim ideas "resemble" non-ideas, matter as a substrate becomes incoherent. Yet a materialist might retreat to positing an *unknown somewhat*: "I concede we cannot conceive *how* matter causes ideas, but perhaps it exists unconceived, unlike anything in our experience." This retreat preserves a minimal materialism without violating Berkeley’s earlier arguments.  

  Here the master argument intervenes. Berkeley’s challenge—"conceive a tree existing unconceived"—targets this residual materialism. Its force lies not in proving *esse est percipi* directly but in exposing the emptiness of the materialist’s "supposition." When we attempt to conceive the unconceived tree, we inadvertently conceive it *as conceived*, rendering the effort self-defeating. Crucially, Berkeley distinguishes *conceiving* (forming a determinate idea) from *supposing* (affirming existence without an idea). The materialist insists we can "suppose" mind-existence without conception; Berkeley counters that such "supposition" is vacuous if it lacks positive content. If we cannot even *frame* what "unconceived existence" denotes, we cannot meaningfully assert it.  

  This distinction becomes urgent in cases like a pre-Cambrian rock stratum unperceived by any finite mind. Berkeley’s argument, if sound, shows we cannot positively conceive of such a stratum existing independently of all perception. Yet if we merely "suppose" it exists unconceived, we face a dilemma: either this supposition smuggles in an implicit conception (e.g., of rocks *like those we perceive*), violating the likeness principle, or it is a bare assertion with no cognitive content. Divine perception resolves this not by "patching a hole" but by providing the only coherent account of existence: God’s eternal conception grounds the stratum’s being, making it perceivable *in principle* even when unperceived *in fact*. Without God, the master argument would imply solipsism (only what *I* perceive exists), but Berkeley’s theology is integral—it fulfills the conception requirement the argument demands.  

  The stock objection—"Berkeley conflates conception with existence"—fails because it misses his deeper goal. The argument does not move from "I cannot conceive X" to "X is impossible" (a non sequitur) but argues that "unconceived existence" lacks intelligible content *given Berkeley’s prior premises*. If abstraction and likeness exhaust our conceptual resources, then "supposing" a mind-independent object is not just false but meaningless. Thus, the master argument’s circularity is virtuous: it tests materialism against the very framework Berkeley has already justified. To reject it requires refuting his epistemology, not just the argument’s form.  

  In sum, the master argument seals Berkeley’s system by foreclosing the last materialist refuge. Abstraction and likeness show matter is *unintelligible*; the master argument shows it is *inconceivable*. The unperceived stratum case reveals that divine conception is not an ad hoc fix but the terminus of Berkeley’s logic: to "be" is to be conceived, and only an infinite mind guarantees the continuity of conception.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A (21–25):** Excels in all areas below. Distinguishes *conceiving* vs. *supposing* with textual precision. Uses the stratum case to expose theology’s necessity without reducing the argument to theology. Explains how the argument closes the "unknown somewhat" gap left by abstraction/likeness. Treats circularity as dialectically purposeful.  

  **B (16–20):** Good grasp but less nuanced. Correctly links master argument to prior premises but may underdevelop the "supposition" distinction. Uses stratum case adequately but may conflate divine conception with human perception. Engages circularity objection but misses its systemic role.  

  **C (11–15):** Superficial. Recites Berkeley’s conclusions. Calls argument "circular" without analysis. Strandum example used mechanically (e.g., "God sees it"). Fails to connect abstraction/likeness to master argument.  

  **D (6–10):** Significant errors. Misstates the master argument. Claims it "proves solipsism." Ignores the stratum case or divine perception.  

  **F (0–5):** Incoherent or off-topic.  

  #### Specific Deductions:  
  **-3–5 marks**  
  - Deploys stock circularity objection uncritically (e.g., "Berkeley assumes what he proves").  
  - Equates "cannot conceive X" with "X cannot exist" without engaging Berkeley’s epistemology.  
  - Omits discussion of the stratum case or reduces it to "God perceives it" without philosophical analysis.  

  **-2 marks**  
  - Calls the argument "dispensable" without explaining Berkeley’s emphasis.  
  - Fails to distinguish *conceiving* from *supposing*.  

  **-1–2 marks**  
  - Weak structure or significant omissions.  

  ---

  ### Design Notes  
  1. **Crux Sharpening:** The question forces engagement with the "unknown somewhat" loophole, exposing the master argument as the capstone of Berkeley’s system. This avoids isolated validity debates.  
  2. **Stratum Case Function:** By requiring analysis of divine perception, it compels students to confront whether God completes the argument’s logic or repairs it.  
  3. **Supposition/Conception Distinction:** Built into the question to block shallow circularity objections.  
  4. **Stipulation Avoided:** The stratum case implicitly challenges students to consider divine perception’s role *without* artificial constraints, testing their grasp of Berkeley’s metaphysics holistically.
