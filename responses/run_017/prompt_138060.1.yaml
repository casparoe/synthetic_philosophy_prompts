prompt: |-
  hey — I'm doing methods review for a psych journal and I keep having the same fight with a co-author. Papers come in where subjects use some resource while doing a task — a notebook, a phone, a checklist, an autocomplete, another person — and the write-up says "participants remembered / decided / reasoned", and my co-author says no, the resource did that bit and the participant read it off. I dont want to keep settling this one paper at a time, so I want the spec.

  Write me the desiderata for a criterion of cognitive extension in the extended-mind sense. Fix the purpose for me: the criterion's job is to say, for a given subject + task + resource, whether an explanation of the performance should count the resource as part of the cognitive system that did it or as part of that system's surroundings. So heavy metaphysical "constitution" talk only earns its keep if it cashes out in some difference to how we describe, model, or intervene on the performance — if it cant, say so and drop it. I do NOT want a new theory of my own; I want the list of things any theory has to deliver to be usable for that job.

  For each requirement give me the case or consideration behind it — why anyone should accept it, not just that people do — and mark whether it is non-negotiable or a preference of one camp. Here are cases I already think a criterion has to sort; add your own where mine arent load-bearing:

  - the famous one: someone with memory trouble who always carries a notebook, writes things in it, and uses what he reads there without checking — vs. someone who hears about an exhibition, remembers it herself, and goes; vs. someone who has to look the address up in a guidebook he has never seen before
  - a blind person's cane, and seperately a pair of glasses: if the criterion lets both in, is that a cost or a feature, and what does it do to the criterion's purpose
  - my phone's contact list: I can recall maybe two numbers, I'd be lost without it, and I often dont know whether a number it shows me is right or whether the entry is the current one. This is the case that breaks things for me.
  - a generative writing assistant that is maybe 85% right on the kind of thing I use it for, that I've learned to correct for, whose output I cant predict in advance but recognise as soon as I see it, and that I sometimes argue with and overrule
  - a couple's shared calendar where one partner's recall depends on what the other one typed in
  - an abacus user's abacus, and the same person's abacus twenty years later when he can no longer say what his hands are doing but still gets the right answer
  - a notebook its owner has stopped trusting but still cant stop consulting; and the same kind of notebook for someone who only started using it last week and still checks it against memory every time
  - a whiteboard across the room that I know is there but cant currently read from where I'm sitting

  Stuff I explicitly want handled rather than assumed:

  1. Whether "extended" is all-or-nothing or admits degrees — and if it admits degrees, what the criterion says in the middle cases and what a reviewer is supposed to write down there. I suspect most of my fights with my co-author are secretly about this and nobody says so.
  2. Whether the subject gets a vote. Does first-person authority ("that's not me, that's the app talking") settle the question, get weighed, or get overruled by the criterion? Pick one, justify it, and give the case that shows what each option costs you.
  3. Both boundary conditions, as one requirement each if you can: what stops the criterion from swallowing everything (cognition depends on oxygen, on language, on culture, on the layout of the room — at some point "extended" stops being a claim) and what stops it from being so strict that nothing external ever counts and the whole literature was pointless.
  4. A temporal requirement. The papers I review are about learning and about skill decay, so I need the criterion to say something about a resource that is in the middle of being integrated into someone's performance, or in the middle of being abandoned. A criterion that only scores snapshots is not much use to me.
  5. Something about error and disagreement: what has to happen when the subject and the resource conflict, who wins, and why the answer to that is evidence about whether they form one system. I think this does more work than the trust condition people keep listing, but argue me out of it if I'm wrong.

  Then two more things. First: which two or three of your desiderata probably cant be jointly satisfied, with the case that shows the strain — and be explicit that this is a result about the list, not a complaint about any particular theory. Second: which single requirement knocks out the most candidate theories, since that's the one I should press people on in review.

  Sections, in this order:

  - "What the criterion is for" — about 100 words, and open by saying plainly what my stated purpose does and does not entitle me to demand
  - "The desiderata" — the bulk, around 900 words, one short block per requirement with its motivating case and its negotiable/non-negotiable marking; a table at the end of the section (requirement / case / status) is fine if it makes it readable
  - "Where the list fights itself" — about 250 words
  - "What to give up on" — about 150 words, i.e. which requirements I should stop expecting any theory to meet
  - "Scorecard" — 150 words max, keep it terse, this is the part I can do myself: two lines each on (a) a straight parity-or-functional-equivalence view, (b) the view that only resources carrying the right kind of content count, (c) an integrationist view built out of access + reliability + transparency + endorsement, (d) the view that nothing is really extended and the whole thing is just a coupled system. Pass/fail per requirement in a table is fine, and dont explain the four views to me.
reasoning: |-
  Okay, let me start by really understanding what the user needs. They're dealing with repeated disputes in a psych journal review process about whether a resource (like a notebook, app, etc.) is part of the cognitive system or just an external tool. The core issue is determining when cognitive processes extend to include these resources. The user wants a clear set of criteria to resolve these disputes systematically, not just case-by-case.

  First, I need to recall the extended mind theory basics. Clark and Chalmers' original parity principle is a starting point, but the user mentions cases where strict functional equivalence isn't enough. They have specific examples that challenge different aspects: the blind person's cane, generative AI, shared calendars, etc. Each case tests different dimensions like trust, integration, transparency, and conflict resolution.

  The user explicitly wants desiderata that handle degrees of extension, not just binary outcomes. That's crucial because many conflicts arise from partial integration. Also, they want to know if the subject's first-person perspective matters and how to handle boundary conditions (avoiding everything being cognitive or nothing). Temporal aspects are key too, since learning and skill decay involve changes over time.

  Looking at the cases provided: the notebook with memory issues vs. occasional guidebook use shows reliability and access. The phone contact list where the user doesn't verify numbers touches on endorsement and error. Generative AI that's 85% correct but argued with introduces conflict as a factor. The shared calendar highlights interdependence between people, which might stretch traditional views. The abacus expert who can't articulate the process suggests automaticity and transparency.

  The user's pain points include: co-authors disagreeing on attribution of cognitive processes, the need for a practical criterion for reviewers, and the frustration with metaphysical arguments that don't translate to empirical outcomes. They need something actionable for journal reviews, so the criteria must be applicable to real studies.

  I should structure the desiderata around their requirements. Each needs a case to justify it and mark if it's non-negotiable. For example, the reliability requirement is non-negotiable because without consistent access, the resource isn't functionally part of cognition. Degrees of extension are also non-negotiable since many real-world cases are in flux. Subject's endorsement might be negotiable because first-person reports can be unreliable.

  Boundary conditions are tricky. Avoiding cognitive bloat (like counting oxygen) means requiring functional specificity. But being too strict might exclude legitimate extensions. The temporal requirement (learning/decay) means the criterion must account for progression, not just steady states. Conflict handling is another key point—when user and resource disagree, resolution methods indicate integration depth.

  Now, conflicting desiderata: Degrees of extension vs. binary decisions might clash. Reviewers need clear answers, but reality is messy. Also, reliability vs. conflict tolerance—resources like generative AI are fallible but integrated. Subject endorsement vs. observable integration—if a user says "it's not me" but relies on it, which prevails?

  The requirement that will knock out most theories is probably the temporal one. Many criteria assume stable states, but learning/decay are dynamic. Also, conflict resolution as a necessary factor might exclude theories that don't address internal disagreement.

  For the scorecard, parity views fail on degrees and conflict. Content-based views might exclude tools like canes. Integration views handle many but struggle with temporal aspects. Coupled systems avoid metaphysics but don't resolve attribution, which is the user's main need.

  I need to ensure each desideratum is grounded in a specific case from the user's list. For example, the notebook vs. guidebook case drives the reliability requirement. The untrusted notebook shows endorsement isn't sufficient. The whiteboard that's inaccessible tests availability.

  Also, the user wants to avoid creating a new theory but evaluate existing ones. So the desiderata should be theory-neutral where possible. Practical implications for description, modeling, intervention are essential. If a criterion doesn't affect how we study the system, it's not useful.
answer: |-
  ## What the Criterion is For
  The criterion's purpose is strictly operational: to determine when an external resource should be functionally attributed to the *cognitive system* performing a task for descriptive, modeling, or interventional purposes (e.g., explaining "remembering" vs. "reading"). It must resolve ambiguity in performance attribution within empirical research (like your journal reviews). It **entitles you to demand** criteria that impact explanation (e.g., does the model include the resource?), prediction (e.g., how does resource loss affect performance?), or intervention (e.g., does manipulating the resource directly alter "cognitive" function?). It **does not entitle you to demand** metaphysical proof of "constitution" absent these impacts. If a condition lacks empirical traction, it should be discarded.

  ## The Desiderata
  These requirements ensure the criterion is usable for your purpose. Cases demonstrate their necessity.

  1.  **Functional Reliability & Accessibility (Non-negotiable):** The resource must be *consistently available* and *reliably used* during relevant task execution, functioning as predictably as internal capacities. **Why:** Without this, the resource isn't a candidate for *systematic* inclusion in the cognitive process; it's an occasional aid. **Case:** Otto's trusted, always-carried notebook vs. the occasional guidebook lookup. The guidebook isn't reliably accessible *to Otto* for *his* memory needs. **Empirical Impact:** Determines if resource loss/change causes predictable performance disruption akin to internal deficit.

  2.  **Degree of Integration (Non-negotiable):** Extension admits degrees. The criterion must output a measure of integration strength (e.g., 0-1) or identify relevant dimensions. **Why:** Cognitive incorporation is often a process (learning/decay), not a binary switch. **Case:** The novice notebook user who checks against memory vs. the expert abacus user whose movements are automatic. Both use tools, but integration differs. **Empirical Impact:** Essential for studying skill acquisition, dependency, and decline – core to your reviews. Ignoring degrees fuels your co-author disputes.

  3.  **Transparency/Automaticity (Non-negotiable):** The resource's output must be typically utilized *without conscious monitoring or effortful interpretation* for the task at hand, similar to internal processes. **Why:** Constant effortful engagement treats the resource as an external object of cognition, not part of the cognitive process itself. **Case:** The blind person's cane (percepts felt as touch *become* perception of the world) vs. the distant whiteboard (requires effortful reading/recall). Glasses often achieve transparency. **Empirical Impact:** Predicts cognitive load; highly transparent resources free attentional resources for other tasks.

  4.  **Conflict Resolution & Error Attribution (Negotiable - Preference for Strong Integration):** When subject and resource conflict, the pattern of resolution indicates integration depth. Deep integration shows negotiation/attribution *within* a system; shallow integration shows external correction. **Why:** How error is handled reveals if the resource is treated as part of "my" process or an external input. **Case:** Arguing with and overruling the generative AI suggests it's a semi-integrated collaborator whose outputs are subject to internal vetting. Simply accepting an untrusted notebook's error shows shallow use. **Empirical Impact:** Explains error patterns and intervention effects (e.g., manipulating trust).

  5.  **Subject Endorsement (Negotiable - Preference for Weak Integration):** The subject's first-person perspective ("that's the app, not me") provides evidence but is not definitive. It gets weighed. **Why:** Self-reports can be inaccurate (e.g., implicit reliance vs. explicit denial), but outright dismissal ignores phenomenology crucial to some explanations. **Case:** The user who distrusts the notebook but compulsively consults it anyway. Their denial signals lack of endorsement, but their behavior shows functional dependence. **Empirical Impact:** Understanding adoption/abandonment dynamics and self-perception; overruling it risks mischaracterizing experience.

  6.  **Functional Specificity Boundary (Non-negotiable):** The resource must play a *specific, identifiable functional role* within the cognitive task, distinct from generic enabling conditions. **Why:** Prevents "cognitive bloat" where everything (oxygen, culture) is considered part of cognition. **Case:** Oxygen enables all cognition but lacks task-specific functional role. A phone contact list has a specific memory function. **Empirical Impact:** Ensures the criterion identifies *which* cognitive function is extended, enabling targeted modeling/intervention.

  7.  **Non-Triviality Boundary (Non-negotiable):** The resource must contribute more than mere input/output transduction or trivial lookup. Its structure/process must bear some non-trivial part of the cognitive load. **Why:** Prevents the criterion from being vacuously satisfied by any tool, preserving the non-trivial claim of extension. **Case:** Reading a novel fact from a never-seen-before book is trivial lookup. Otto's notebook, or the abacus performing calculation steps, bears non-trivial load. **Empirical Impact:** Distinguishes genuine functional incorporation from simple tool use.

  8.  **Temporal Robustness (Non-negotiable):** The criterion must apply meaningfully across time, capturing integration dynamics (learning, decay, adaptation), not just static snapshots. **Why:** Cognition unfolds over time; resources are incorporated or abandoned gradually. **Case:** The abacus user learning (increasing transparency) or the couple adapting to a shared calendar after a partner's error (changing reliability/trust). **Empirical Impact:** Critical for longitudinal studies of skill and tool use, central to your work.

  | Requirement                   | Key Motivating Case                                      | Status               |
  | :---------------------------- | :------------------------------------------------------- | :------------------- |
  | Functional Reliability & Access | Otto's Notebook vs. Occasional Guidebook                 | Non-negotiable       |
  | Degree of Integration         | Novice vs. Expert Abacus User / Untrusted Notebook User  | Non-negotiable       |
  | Transparency/Automaticity     | Blind Person's Cane vs. Distant Whiteboard               | Non-negotiable       |
  | Conflict Resolution & Error   | Arguing with Generative AI vs. Untrusted Notebook        | Negotiable (Prefer)  |
  | Subject Endorsement           | Distrusting but Compulsive Notebook User                 | Negotiable (Prefer)  |
  | Functional Specificity        | Phone Contact List vs. Oxygen                            | Non-negotiable       |
  | Non-Triviality                | Otto's Notebook / Abacus vs. Lookup in New Book          | Non-negotiable       |
  | Temporal Robustness           | Learning the Abacus / Decaying Trust in Shared Calendar  | Non-negotiable       |

  ## Where the List Fights Itself
  Two tensions are inherent and likely unresolvable within any single criterion:

  1.  **Degrees vs. Attribution Demands:** The necessity for degrees (D2) clashes with the reviewer's need for clear-cut attribution ("did the participant remember or read?"). A theory outputting "integration=0.7" provides nuance but doesn't resolve whether to *say* "remembered" in the paper abstract. The Otto case pushes for a clear "yes," the novice notebook user a clear "no," but the generative AI (D4) or decaying shared calendar (D8) sit uncomfortably in the middle. No criterion can eliminate this attribution ambiguity for intermediate cases; it can only characterize the degree.
  2.  **Subject Endorsement vs. Observable Integration:** Weighting first-person authority (D5) conflicts with prioritizing observable functional integration (D1, D3, D4). The compulsive notebook user *functions* as if integrated but *reports* it isn't. Prioritizing endorsement risks ignoring powerful behavioral dependencies relevant to performance and intervention. Prioritizing behavior risks misrepresenting the subject's experience and agency. The generative AI case is strained here – the user argues *with* it (suggesting separation) but relies *on* it (suggesting integration).

  ## What to Give Up On
  Abandon the expectation that **Subject Endorsement (D5)** can be a decisive or universally reliable indicator. First-person reports are valuable data about experience and trust, but they are often inconsistent with behavioral dependencies crucial for functional explanation. The compulsive notebook user demonstrates this disconnect. Theories will (and should) differ in how much weight they give it. Instead, treat endorsement as one *dimension* of integration (related to trust/attribution) within the broader degrees framework, not a gatekeeper.

  ## Scorecard

  | View                                | Functional Reliability & Access (D1) | Degree (D2) | Transparency (D3) | Conflict (D4) | Endorsement (D5) | Specificity (D6) | Non-Triviality (D7) | Temporal (D8) | Overall Fit for Purpose |
  | :---------------------------------- | :----------------------------------- | :---------- | :---------------- | :------------ | :--------------- | :--------------- | :------------------ | :------------ | :---------------------- |
  | **(a) Parity/Functional Equivalence** | Pass (Core)                          | **Fail** (Binary) | Pass (Implied)    | **Fail** (Assumes parity) | **Fail** (Ignores) | Pass (Implied)      | **Fail** (Vague)      | **Fail** (Snapshot) | Poor (Misses dynamics, degrees) |
  | **(b) Content-Based**               | Pass (Assumed)                       | **Fail** (Binary/Content focus) | **Fail** (Not required) | **Fail** (Not addressed) | **Fail** (Not addressed) | Pass (Core)         | **Fail** (Not addressed) | **Fail** (Snapshot) | Poor (Excludes canes/abacus, ignores process) |
  | **(c) Integrationist (Access, Rel, Trans, Endorse)** | Pass (Core)                          | **Fail** (Often binary thresholds) | Pass (Core)       | **Fail** (Rarely addressed) | Pass (Core)       | Pass (Often implied) | **Fail** (Often vague) | **Fail** (Snapshot focus) | Moderate (Captures core cases but rigid, poor on conflict/time) |
  | **(d) Coupled Systems**             | Pass (Describes coupling)            | Pass (Can describe strength) | **Fail** (Not a criterion) | **Fail** (Not a criterion) | **Fail** (Not a criterion) | **Fail** (No boundary) | **Fail** (No boundary) | Pass (Describes dynamics) | Poor (Avoids attribution question entirely - *your core need*) |
