prompt: |-
  I convene a final-year seminar in practical ethics, and for the session on how one ought to choose between causes — whether to devote a career, or a grant budget, to this rather than that — I want the students to build the specification before I show them a single existing framework. So please write me the desiderata. Fix the purpose first, and say what you are fixing it as: I have in mind a small charitable foundation with a fixed annual budget, a ten-year spending horizon, no capacity to run experiments or to wait for feedback before committing money, and a board of trustees who disagree with one another about population ethics, about whether future benefits may be discounted, and about how much weight to give to risks of civilisational collapse. Write the list of requirements any framework for prioritising causes would have to meet to count as adequate for that decision-maker: the cases it must get right, the distinctions it must not collapse, the results from decision theory or economics it must not contradict — with the concrete case or consideration behind each requirement, since I want the criteria motivated by examples rather than by slogans.

  Here are the candidates I have been circling in my own notes, which may or may not all be genuine desiderata; tell me which are and which are merely the prejudices of one camp. (i) That the framework score grants or actions at the margin rather than causes in the aggregate, because a problem can be enormous and badly neglected in total whilst the thousandth pound into it buys almost nothing, given limits on how fast an organisation or a field can absorb money. (ii) That it be invariant to how finely the cause space is carved: lumping sub-causes together or splitting one cause into several must not reorder the ranking, and a framework whose output improves when you redraw a cause's boundaries is being gamed rather than consulted. (iii) That its factors be genuinely independent, so that combining them — by multiplication or otherwise — does not count the same consideration twice; I strongly suspect that "neglectedness" and "tractability" both smuggle in something about diminishing marginal returns. (iv) That it credit counterfactual impact honestly: funging, crowding out, and the difference between bringing an outcome about and merely occupying a role someone else would have filled. (v) That it assign value to buying information — pilots, research, capacity-building — and not only to intervening directly, which seems to require handling option value and the value of resolving the board's own disagreements. (vi) That it remain usable under moral uncertainty and cluelessness, neither demanding spurious precision about long-run effects nor collapsing into a refusal to rank anything at all. (vii) That it cope with interaction between causes, complementarities as well as substitutability, so that two middling causes pursued together can beat the top-ranked cause pursued alone. (viii) That it be legible and adoptable by trustees who are not expected-value maximisers, and robust to their attempts to steer it towards causes they antecedently favour. Mark each as non-negotiable or as a preference of a particular camp, and add any requirement I have missed that you think belongs on the list.

  The part I most want, though, is the diagnosis of the list itself. Flag any subset of the desiderata you think cannot be jointly satisfied — in particular, say whether carving-invariance, sensitivity to interaction between causes, and marginal-unit scoring can be had together at all in a framework that outputs a single ranking, and whether the demand for a complete ordering of causes is even compatible with taking moral uncertainty seriously rather than merely averaging over it. Then tell me which single requirement does the most work in excluding candidate frameworks, and why. Finish with a short scorecard, a few lines each and no more: the familiar three-factor multiplicative framework that scores causes by how important, how tractable and how neglected they are; straightforward expected cost-effectiveness estimation with explicit probabilities; and a portfolio or "hits-based" approach that spreads bets across many causes. I shall use the scorecard only to provoke discussion, so keep the weight on the criteria.
reasoning: |-
  Okay, the user is teaching a seminar on practical ethics, specifically about choosing between causes for resource allocation. They need desiderata for a framework tailored to a small charitable foundation with specific constraints: fixed annual budget, 10-year horizon, no feedback loops, and a morally divided board. 

  First, I need to unpack their scenario. The foundation has no capacity for experiments or waiting - decisions are irreversible. The trustees disagree on population ethics, discounting future benefits, and catastrophic risks. That's three layers of uncertainty: empirical (what works), temporal (valuing future lives), and moral (value disagreements). 

  Looking at their candidate requirements... Hmm, (i) marginal scoring is non-negotiable - pouring money into saturated causes is inefficient. But (ii) carving-invariance conflicts with (vii) interaction sensitivity. If causes interact, splitting/lumping changes the math. Can't have both without oversimplifying. 

  For (iii), tractability and neglectedness both proxy for diminishing returns - they're not independent. That's a design flaw in the multiplicative model. (iv) counterfactuals are crucial - otherwise you fund work that would happen anyway. 

  The board's moral uncertainty makes (vi) essential. Any framework demanding consensus would paralyze them. But (viii) suggests non-maximizer trustees need simplicity - tension with complex models. 

  Biggest trade-off: marginal scoring + interactions + single ranking. Physically impossible. Marginal gains depend on current allocations, and interactions mean cause values aren't additive. A single ranking ignores portfolio effects. 

  Most excluding requirement? Probably (vi) moral uncertainty + cluelessness. It rules out precise cost-effectiveness models and naive averaging. Frameworks must accommodate plural values without false precision. 

  For the scorecard... The three-factor model is intuitive but fails independence and interaction tests. Cost-effectiveness models demand impossible precision about long-term effects. Portfolio approaches handle uncertainty but lack marginal scoring. 

  User's missed requirement: adaptive robustness. With 10 years no feedback, the framework must somehow hedge against being catastrophically wrong. Maybe through diversification or resilience heuristics.
answer: |-
  Here are the desiderata for your foundation's prioritization framework, grounded in concrete challenges, followed by analysis of tensions and a scorecard of existing approaches.  

  ### **Desiderata for the Framework**  
  1. **Marginal Unit Scoring (Non-negotiable)**  
     *Why*: A cause may be globally urgent (e.g., clean water access) but have highly saturated interventions in a specific region. The 10,000th dollar might fund a low-impact well while the same dollar could prevent a decade of blindness via a neglected trachoma program. Aggregate cause importance ignores diminishing returns.  

  2. **Carving Invariance (Conditional)**  
     *Why*: If "global health" is split into "malaria" and "dengue," ranking shouldn’t reverse. But if trustees artificially split "antibiotic resistance" from "pandemic preparedness" to inflate neglectedness scores, the framework must resist gaming. *Caveat*: Conflicts with interaction sensitivity (see #7).  

  3. **Independent Factors (Non-negotiable)**  
     *Why*: "Tractability" (cost per life saved) and "neglectedness" (funding gap) often overlap: a cause is tractable *because* it’s neglected (e.g., deworming pre-2010). Multiplying them double-counts diminishing returns. The framework must disentangle these drivers.  

  4. **Counterfactual Rigor (Non-negotiable)**  
     *Why*: Funding a university lab may "crowd out" government grants (net impact near zero). But funding a unique field trial in a governance vacuum (e.g., coral reef restoration in a failed state) might have high counterfactual value. The framework must discount fungible efforts.  

  5. **Value of Information (VoI) Integration (Non-negotiable)**  
     *Why*: With no feedback pre-commitment, funding a pilot study on AI alignment or a new vaccine platform could resolve uncertainty about tractability or risks (e.g., "is this intervention scalable?"). Ignoring VoI biases frameworks toward known, incremental wins.  

  6. **Moral Uncertainty & Cluelessness Tolerance (Non-negotiable)**  
     *Why*: Trustees disagree on discount rates (is saving 1 life today = 100 lives in 2124?) and population ethics (average vs. total utilitarianism). The framework must allow partial orderings (e.g., "A > B under all reasonable moral weights") without demanding false precision on 100-year effects.  

  7. **Interaction-Sensitivity (Preference)**  
     *Why*: Climate advocacy (cause A) and grid battery R&D (cause B) may be mediocre alone but synergistic together (advocacy boosts R&D adoption). A framework recommending only "top-ranked" causes misses compounding gains.  

  8. **Legibility & Gaming-Resistance (Non-negotiable)**  
     *Why*: If a trustee loves "local arts education," they might inflate its importance scores. The framework must output auditable reasoning (e.g., "Cause X scores low due to high fungibility risk") to prevent ideological capture.  

  ### **Missed Requirement**  
  9. **Horizon Consistency**  
     *Why*: With a 10-year spending horizon, funding nuclear fusion research (50-year payoff) or geoengineering (catastrophic if halted) may be incoherent. The framework must align interventions with the foundation’s time-bound capacity.  

  ---

  ### **Diagnosis of Tensions**  
  - **The Impossibility Trilemma**: Carving-invariance (#2), interaction-sensitivity (#7), and marginal scoring (#1) **cannot be fully reconciled** in a single ranking.  
    *Why*: Interactions imply that cause value depends on *combination* (violating invariance). Marginal impact depends on *current allocations* (violating invariance if causes are re-carved). A portfolio approach (not a ranking) is needed.  
  - **Moral Uncertainty vs. Completeness**: A complete ordering (#6 conflict) requires reducing moral uncertainty to a single weighting (e.g., averaging). Legitimate disagreement among trustees makes this illegitimate. Frameworks should output *sets* of acceptable options.  
  - **Most Excluding Requirement**: **#6 (Moral Uncertainty & Cluelessness Tolerance)**. It excludes:  
    — Cost-effectiveness models requiring precise future discount rates.  
    — Multiplicative frameworks assuming consensus on "importance."  
    — Any method ignoring deep uncertainty about long-term impacts.  

  ---

  ### **Scorecard of Existing Frameworks**  
  1. **Three-Factor Model (Importance × Tractability × Neglectedness)**  
     - *Fails*: Independence (#3 — neglect/tractability correlate), Counterfactuals (#4 — ignores crowding out), VoI (#5 — no option value), Interactions (#7), Cluelessness (#6 — demands precise importance scores).  
     - *Partial pass*: Legibility (#8), Marginality (#1 — if applied per-intervention).  

  2. **Expected Cost-Effectiveness (e.g., DALY/$)**  
     - *Fails*: Moral uncertainty (#6 — assumes agreed discount rates/weights), Cluelessness (#6 — false precision on long-term effects), VoI (#5), Interactions (#7), Legibility (#8 — trustees may reject utilitarianism).  
     - *Passes*: Marginality (#1), Counterfactuals (#4 — if well-modeled).  

  3. **Portfolio/"Hits-Based" Approach**  
     - *Fails*: Carving-invariance (#2 — portfolio value depends on cause definitions), Marginality (#1 — funds causes, not marginal gains), Legibility (#8 — trustees may dislike "gambling").  
     - *Passes*: Interactions (#7), VoI (#5 — via diversification), Moral uncertainty (#6 — hedges value disagreements), Horizon (#9 — explicit risk horizons).  

  ---

  ### Key Insight for Your Seminar  
  **Core Tension**: The foundation’s constraints (no feedback, fixed horizon, moral disagreement) make *any* single-ranking framework inadequate. The desiderata push toward a **portfolio model with explicit moral buckets** (e.g., "allocate X% to causes satisfying all trustees’ minimal thresholds") and **marginal VoI scoring** for individual grants. Frameworks failing #6 or the trilemma are non-starters.
