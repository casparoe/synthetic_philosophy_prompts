  First, I need to understand the thesis they want defended: that LTNU can't maintain commensurability below the threshold without extending it above, and that the lexical rule requires a non-hedonic property, turning it into a hybrid theory. The user also mentioned two objections: lexical orderings in other contexts and the saturation reply. Plus, there's the decision-theoretic problem under uncertainty.

  Breaking down the key elements. The single-scale assumption involves cardinality, interpersonal comparability, unbounded positive scale, and duration/number as multipliers. The lexical threshold conflicts with unboundedness because if pleasures can be infinitely large, they should offset any finite suffering, but the threshold denies that. 

  For the first objection: the user's friends argue that lexical orderings exist even with common measures, like in decision theory. But I need to show that in LTNU, the scale is supposed to be comprehensive. If suffering above threshold is measured in hedons, then adding enough pleasure should counterbalance it, but the lexical rule prevents that, creating a contradiction. So the common measure undermines the lexical priority unless there's an extra property.

  The saturation reply suggests a curved scale where above-threshold suffering has diminishing marginal disvalue. But the user wants to distinguish between a steep curve and a true lexical threshold. If the scale is compressive but still cardinal, then theoretically, a massive amount of pleasure could still outweigh severe pain, even if impractical. Lexical priority means no amount can ever outweigh it, which isn't captured by a curved scale. 

  Then there's the decision-theoretic issue. Under uncertainty, even a tiny probability of crossing the threshold could dominate decisions, leading to fanaticism. This supports the thesis because it shows the instability: if the scale were truly cardinal, expected utility would still apply, but the lexical rule breaks that, indicating an incommensurability that requires a non-hedonic element.

  The user's deeper needs might be to solidify their argument against LTNU's coherence for their seminar. They need a robust defense against objections their peers raised, especially showing that LTNU isn't a pure utilitarian theory. They might also be looking for clarity on how the decision-theoretic problem highlights the theory's flaws. 

  I should structure the argument by first outlining the single-scale commitments, then showing how the lexical threshold conflicts, addressing each objection, and using the decision-theoretic point to underline the incoherence. Emphasize that introducing a non-hedonic property moves away from utilitarianism to a hybrid model, which loses the elegance of scalar aggregation.
answer: |-
  Here's the argument for your thesis, addressing each component and objection head-on:

  ### Core Argument: The Instability of Commensurability
  The single cardinal hedonic scale ("hedon scale") commits LTNU to five key features:
  1.  **Cardinality & Unit Comparability:** Hedonic states are represented by real numbers (hedons), where differences (e.g., 5 vs 10 hedons is the same gain/loss as 15 vs 20 hedons) and ratios (e.g., 10 hedons of pain is twice as intense as 5) are meaningful *within* the scale.
  2.  **Interpersonal Comparability:** Hedons are comparable across individuals. My 10 hedons of pleasure is normatively equivalent to your 10 hedons of pleasure; my 10 hedons of pain is equivalent to your 10 hedons of pain.
  3.  **Unboundedness (Positive Direction):** There is no inherent upper limit to how intense pleasure can be measured in hedons. For any finite pleasure P, there could exist a greater pleasure P' > P.
  4.  **Duration as Multiplier:** The total hedonic impact of an experience is intensity (hedons) multiplied by duration. 10 hedons for 2 hours = 20 hedon-hours.
  5.  **Number of Experiencers as Multiplier:** The total value of a state of affairs aggregates the hedonic states of all individuals. Adding more individuals experiencing the same hedonic state increases the total hedonic sum proportionally.

  **The Tension:** The lexical threshold rule ("above threshold suffering T dominates any amount of pleasure") directly contradicts commitments 3, 4, and 5 when combined with commitment 1 (cardinality/comparability).

  1.  **Contradiction with Unboundedness (3):** Suppose suffering S is at or above T, measured at -H_S hedons. Commitment 3 implies there *could* exist a pleasure P with intensity +H_P hedons, where H_P > |H_S|. Cardinality (1) and interpersonal comparability (2) imply that a sufficiently large population experiencing P for a sufficient duration (leveraging 4 & 5) could generate a total positive hedonic sum exceeding |H_S|. The lexical rule forbids this trade-off *regardless* of how large H_P is or how many people experience it for how long. This is incoherent if S and P are truly measured on the *same cardinal scale*. If they are on the same scale, a sufficiently large positive number *must* outweigh a fixed negative number. The lexical rule asserts this is impossible *by definition* for S >= T, which violates the fundamental arithmetic implied by cardinal measurement on a shared, unbounded scale.

  2.  **Contradiction with Multipliers (4 & 5):** Similarly, even for a fixed intensity pleasure P (below the pleasure threshold, if any), commitments 4 and 5 allow generating an arbitrarily large positive sum by increasing duration or number of experiencers. The lexical rule forbids this sum from ever outweighing S >= T. Again, if hedonic impact is truly captured by the product Intensity x Duration x Number (all operating on the *same* hedon scale), this prohibition is mathematically nonsensical. A sufficiently large product *must* exceed any fixed negative value on the same scale.

  **The Inevitable Conclusion:** To maintain the lexical rule's strict prohibition against *any* trade-off above T, LTNU must deny that suffering >= T and pleasure are fully commensurable *even on the hedonic dimension*. The suffering above T must possess an additional, non-hedonic normative property – an intrinsic "demand not to be produced," a "moral urgency," or a deontic "constraint" – that *cannot* be counterbalanced by hedonic gains. This property is fundamentally different in kind, not degree, from hedonic tone. Admitting this property transforms LTNU from a pure aggregative utilitarianism (which cares *only* about the scalar hedonic sum) into a hybrid theory: aggregative consequentialism for states below T, combined with a non-consequentialist, constraint-like prohibition against producing states >= T. This hybrid inherits the theoretical challenges of lexical orderings (e.g., discontinuity, fanaticism under risk) and abandons the core utilitarian commitment to a single, maximizing scalar value function.

  ### Addressing Objections

  1.  **Objection: Ordinary Lexical Orderings Use a Common Measure:**
      *   **Reply:** This objection misunderstands the *scope* of the common measure in LTNU vs. standard lexical orders. In political philosophy (e.g., Rawls' basic liberties) or decision theory (lexicographic preferences), the "common measure" exists only *within* each lexically ordered dimension. We might use dollars to compare candidates on economic policy (Dimension 1), but if Candidate A wins on Dimension 1, their vastly superior Dimension 1 score *cannot* be traded off against *any* deficit on Dimension 2 (e.g., civil liberties), no matter how small. Dimensions 1 and 2 are *incommensurable*; there is no single overarching scale combining dollars and civil liberty units where a dollar value could ever offset a liberty deficit once Dimension 1 is satisfied. Crucially, the dimensions are distinct *types* of value.
      *   **Why LTNU is Different:** LTNU posits a *single, unified hedonic dimension* (pleasure/pain) measured on a *single cardinal scale*. The lexical threshold attempts to create a discontinuity *within this single dimension*. The objection confuses using a measure *within* a dimension with having a measure *across* dimensions. LTNU's claim is that severe pain *is still just hedonic disvalue*, measurable in hedons on the same scale as mild pain and pleasure. This is what creates the tension. If "suffering >= T" were a *different dimension* (e.g., "intrinsic wrong-making property"), the standard lexical model would apply coherently, but LTNU would then explicitly be a hybrid theory, not pure utilitarianism. The instability arises precisely because LTNU tries to have it both ways: a single hedonic scale *and* a lexical break *within* it.

  2.  **Objection: The Saturation Reply:**
      *   **Reply:** Saturation (e.g., a logarithmic or compressive function mapping raw hedonic intensity to moral value) is *fundamentally different* from a lexical threshold and cannot save pure LTNU.
      *   **Distinguishing Curved from Lexical:** A compressive function preserves cardinality and commensurability *across the entire scale*. While the *marginal moral value* of adding more pleasure diminishes sharply, it never reaches zero. Crucially:
          *   **The Trade-Off Remains Possible in Principle:** For *any* finite suffering S (even severe) measured at -H_S hedons, there exists *some* finite (though perhaps astronomically large) aggregate pleasure state P (via intensity, duration, number) whose total hedonic sum +H_P > |H_S|. Due to the compressive mapping, the *moral value* V(P) might be much less than the linear H_P, but V(S) is also mapped (e.g., V(S) = -log(|H_S| + 1)). **The key point:** V(P) will *eventually* exceed |V(S)| as H_P increases, because V(P) approaches its asymptote *from below* while |V(S)| is fixed for a fixed S. The trade-off remains *mathematically possible*; the threshold is merely *practically* insurmountable.
          *   **Lexical Thresholds Forbid Trade-Offs in Principle:** LTNU explicitly states that *no* finite quantity of pleasure can outweigh suffering >= T. This is a categorical prohibition, not a matter of degree or diminishing returns. Saturation explains why trade-offs are *extremely hard*, not why they are *impossible*.
      *   **Why Saturation Undermines LTNU's Lexical Claim:** If suffering above T is still on the same cardinal hedon scale and the moral value function is merely compressive, LTNU's core claim – that this suffering takes *strict priority* – is false. There *is* a quantity of sub-threshold pleasure that outweighs it morally, even if we can't feasibly achieve it. To maintain the strict priority, the saturation function would need an *infinite* negative value for S >= T (V(S) -> -∞), but this:
          *   Abandons the single cardinal scale (infinities break cardinal measurement).
          *   Creates pathologies identical to those of lexical orders (see below).
          *   Effectively concedes that suffering >= T has a property (infinite disvalue) that cannot be represented on the bounded *moral value* scale derived from the hedonic scale, reintroducing the need for a distinct normative property.

  ### The Decision-Theoretic Wrinkle: Fanaticism and the Case for the Thesis
  The decision-theoretic problem under uncertainty powerfully supports the thesis and highlights the instability.

  *   **The Problem:** If suffering >= T has infinite negative disvalue (or effectively so via lexical priority), then under uncertainty:
      1.  **Domination/Fanaticism:** Any action with a non-zero probability (however tiny) of causing suffering >= T must be avoided if an alternative exists with zero such probability, *regardless* of the cost in sub-threshold well-being. Sacrificing the certain well-being of billions for millennia to avoid a 1 in 10^100 chance of one person suffering above T for a nanosecond becomes obligatory. This is fanaticism.
      2.  **Incomparability:** When *all* options carry *some* risk of suffering >= T, standard expected value maximization breaks down. Comparisons become impossible or require arbitrary methods for comparing "degrees of infinity" or lexical risks, abandoning the elegance of scalar utility.
  *   **Why This Supports the Thesis:**
      *   **Reveals the Non-Hedonic Property:** The fanaticism arises *because* the disvalue of suffering >= T is treated as incommensurable with hedonic gains. This intractable fanaticism is the hallmark of introducing a distinct, non-aggregative normative factor (a constraint, infinite weight, distinct dimension). A pure hedonic scale, even with saturation, would generate finite (though potentially huge) expected disvalues, allowing trade-offs and avoiding fanaticism.
      *   **Exposes the Breakdown of Commensurability:** The inability to compare options with different risk profiles for threshold-crossing demonstrates that suffering >= T is not being integrated into a single scalar value function. Expected utility maximization *requires* commensurability across states. LTNU's lexical rule destroys this commensurability precisely above the threshold.
      *   **Highlights the Conflict with Unboundedness:** Fanaticism occurs because the lexical rule treats the negative value of suffering >= T as *unbounded in its moral significance* (dominating any finite good), while simultaneously claiming it is *bounded on the hedonic scale* (a finite negative hedon value). This is the core instability laid bare by decision theory.
  *   **The Friendliest Version of LTNU?** The decision-theoretic challenge pushes the friendliest version of LTNU towards being a **theory about the structure of reasons or constraints, not overall betterness**.
      *   **Why not Risk:** Making LTNU a view about risk (e.g., "never risk crossing T") doesn't solve the core issue; it presupposes the incommensurability and inherits the fanaticism problem for minuscule risks.
      *   **Why not Permissions:** Focusing on permissions ("it's forbidden to cause S >= T") moves explicitly towards deontology. It avoids defining an overall betterness ordering but concedes that the theory is no longer utilitarian (which aims to define betterness).
      *   **Structure of Reasons:** The most coherent path is to argue that the prohibition against causing suffering >= T is a *fundamental, non-consequentialist reason* or *constraint* that cannot be overridden by consequentialist hedonic gains. This explicitly abandons the project of constructing a single, all-things-considered hedonic value function. It embraces the hybrid nature: aggregative consequentialism governs the sub-threshold realm, governed by hedonic reasons, while a distinct, non-consequentialist deontic reason governs actions concerning the threshold. This salvages coherence but at the cost of abandoning utilitarianism's defining commitment to a monistic, scalar conception of value and to consequentialism as the sole source of normative force.

  **Conclusion:** Your intuition is correct. The single cardinal hedonic scale commitment below the threshold is incompatible with a genuinely lexical rule above it. The scale's cardinality, interpersonal comparability, unboundedness (positive), and multipliers imply that sufficiently large hedonic gains *must* be able to outweigh any fixed hedonic loss. The lexical rule can only be maintained by positing that severe suffering possesses an additional, non-hedonic normative property – an urgency, constraint, or infinite moral weight – that places it on a distinct dimension. This transforms LTNU into a hybrid theory, sacrificing the elegance and coherence of a purely scalar utilitarianism and inheriting the pathologies of lexical priority, most starkly revealed under conditions of uncertainty. The decision-theoretic fanaticism problem isn't a quirk; it's the logical consequence of the underlying incommensurability introduced by the lexical threshold. The most defensible version of the view you're exploring embraces this hybrid structure explicitly, framing the threshold prohibition as a fundamental constraint or non-consequentialist reason.
