prompt: |-
  I convene a small working group on the governance of risky interventions, and two of its members have spent a year arguing past each other about one concrete case: whether a single research team may release, on its own authority, a self-spreading gene-drive construct designed to suppress a mosquito population that carries malaria. Roughly a dozen labs worldwide could each do this alone; a release would be effectively irreversible and impossible to recall; expert opinion on the ecological outcome is genuinely and persistently split.

  The unilateralist's three strongest moves, as I'd reconstruct them: first, that the curse-style selection effect only bites under assumptions that fail here — the acting team holds local ecological knowledge and a track record that no distant panel can cheaply aggregate, so deference is not automatically epistemic improvement. Second, that requiring broad agreement imposes an unpriced cost: delay is itself lethal, and a consensus rule hands a veto to whoever is most cautious or least informed, so it selects for inaction in precisely the cases where acting matters most — a symmetric selection effect on omissions that the standard argument does not model. Third, that where the intervention can be re-engineered to be graded and partly reversible — split-drive designs that dilute out of a population, staged and spatially confined releases — the all-or-nothing structure that generates the selection effect is partly dissolved, making redesign rather than deference the right response.

  The conformist's three strongest replies: first, that the selection effect does not require independent errors to bite, only that a single sufficient, irrevocable act makes the realised intervention disproportionately likely to be drawn from the worlds where it goes badly. Second, that error independence fails in the direction that hurts the unilateralist — shared training, funding and publication incentives produce correlated optimism — so the enthusiast's private judgment is the worst available filter even if a committee is not the best one. Third, that the symmetry claim is unearned without a baseline: the deaths from delay are bounded and measurable, the downside is not, and the comparison should be between acting now and acting after a multilateral process, not between acting now and never acting.

  Please write the document they should have produced instead: an adversarial-collaboration statement. Give me a numbered section of claims both can sign — about the decision structure, about what the selection argument does and does not establish, about correlated error, about what would count as redesign — followed by a disagreements table in which each residual dispute gets a neutral formulation, each side's own preferred wording for its position, and, where the dispute is substantive rather than verbal, the crux plus a concrete test, case, or piece of evidence both would accept as bearing on it, with each side's prediction written down in advance. Flag explicitly any part of the disagreement you think is merely verbal, and say what separates it from the parts that are not.
reasoning: |-
  We are producing an adversarial collaboration statement for a small working group on the governance of risky interventions, focusing on the case of a self-spreading gene-drive release for malaria-carrying mosquito suppression.

  The document will have two main parts:
  1. A numbered section of claims that both the unilateralist and the conformist can agree to (common ground).
  2. A disagreements table with:
     a. A neutral formulation of each residual dispute.
     b. Each side's preferred wording for their position.
     c. For substantive disputes: the crux, a concrete test/case/evidence that both would accept as bearing on it, and each side's prediction in advance.
     d. Explicit flags for any merely verbal disagreements, explaining why.

  We'll structure the common ground around:
  - The decision structure (what kind of decision we are facing)
  - What the unilateralist's curse (selection effect) argument does and does not establish
  - Correlated error
  - What would count as redesign

  Then, for the disagreements table, we'll list the key points of contention.

  Let's outline the common ground:

  1. **Decision Structure**:
     - The intervention involves a self-spreading gene drive that, once released, is effectively irreversible and impossible to recall.
     - The intervention is being considered by a small number of labs (about a dozen) each of which could unilaterally release it.
     - The ecological outcome is uncertain and expert opinion is genuinely and persistently split.

  2. **The Selection Effect (Unilateralist's Curse)**:
     - The selection effect (unilateralist's curse) arises when multiple independent actors could each take a sufficient, irrevocable action. In such a setting, the action is more likely to be taken by an actor who is overly optimistic about the intervention, leading to a disproportionate chance of negative outcomes.
     - However, the strength of the selection effect depends on the assumptions about the distribution of beliefs and the independence of errors.
     - The selection effect argument does not, by itself, establish that a multilateral decision process (such as requiring broad consensus) will necessarily lead to better outcomes. The effectiveness of a multilateral process depends on the details of how it aggregates information and the quality of the participants.

  3. **Correlated Error**:
     - Errors in judgment (optimism or pessimism) among researchers may be correlated due to shared training, funding sources, publication incentives, and other factors.
     - The presence of correlated errors can weaken the effectiveness of aggregating judgments (e.g., in a committee) because it reduces the benefit of independent viewpoints.

  4. **Redesign as an Alternative**:
     - One way to mitigate the risks of the selection effect is to redesign the intervention to be more controllable, such as by making the gene drive self-limiting (e.g., split-drive designs that dilute out of the population) or by staging releases in confined areas.
     - Such redesign can change the decision structure by making the intervention less irreversible and by allowing for learning and adjustment.

  Now, the disagreements table. We'll identify the key points of dispute from the arguments:

  The unilateralist's three moves and the conformist's three replies suggest the following disputes:

  Dispute 1: On the relevance of the selection effect given local knowledge and track record.
  Dispute 2: On the cost of delay and the symmetry of selection effects (for action vs. inaction).
  Dispute 3: On the extent to which redesign can dissolve the all-or-nothing structure.

  Additionally, we have:
  Dispute 4: On whether the selection effect requires independent errors (as the conformist's first reply argues it does not).
  Dispute 5: On the direction of error correlation (conformist argues it hurts the unilateralist because of shared optimism; unilateralist might argue that local knowledge and diversity of contexts reduce correlation).

  But note: the common ground already covers some of the foundations. We'll focus on the points that remain in contention.

  Let's structure the table:

  | # | Neutral Formulation | Unilateralist's Preferred Wording | Conformist's Preferred Wording | Crux (if substantive) | Concrete Test/Case/Evidence | Unilateralist's Prediction | Conformist's Prediction | Merely Verbal? (If yes, why) |
  |---|---------------------|----------------------------------|--------------------------------|------------------------|----------------------------|----------------------------|--------------------------|------------------------------|
  | 1 | ... | ... | ... | ... | ... | ... | ... | ... |

  We'll do 5 rows for the 5 disputes. However, note that some might be overlapping or might be rephrased.

  After review, let me propose the following 5 disputes:

  1. **On the applicability of the selection effect given local knowledge and track record**:
     - Neutral: Whether the possession of local ecological knowledge and a strong track record by a research team reduces the force of the selection effect argument against unilateral action.
     - Unilateralist: The selection effect is weakened because the acting team has unique local knowledge and a track record that cannot be cheaply aggregated by a distant panel, so deference is not automatically an epistemic improvement.
     - Conformist: The selection effect still applies because the team's optimism may be due to factors that are not offset by local knowledge (such as shared biases) and because even knowledgeable teams can make errors that are more likely to be acted upon unilaterally.

  2. **On the cost of delay and the symmetry of selection effects**:
     - Neutral: Whether the requirement for broad agreement imposes an unacceptable cost in terms of delay, and whether there is a symmetric selection effect for inaction that is not accounted for in the standard selection effect argument.
     - Unilateralist: Requiring broad agreement imposes a lethal cost due to delay and creates a symmetric selection effect for inaction (where the most cautious or least informed can veto), leading to inaction in critical cases.
     - Conformist: The deaths from delay are bounded and measurable, while the downside of a bad release is potentially catastrophic and unbounded. Moreover, the symmetry claim is unearned because the inaction selection effect is not symmetric to the action selection effect.

  3. **On the potential of redesign to mitigate the selection effect**:
     - Neutral: Whether redesigning the gene-drive to be self-limiting (e.g., split-drive) and releasing it in a staged and confined manner sufficiently dissolves the all-or-nothing structure of the decision to the point where the selection effect is no longer a primary concern.
     - Unilateralist: Redesign (e.g., split-drive) can make the intervention graded and reversible, thereby reducing the force of the selection effect argument and making unilateral action more acceptable.
     - Conformist: Even with redesign, the intervention may still have irreversible and widespread effects, so the selection effect remains a concern and multilateral governance is still required.

  4. **On the necessity of independent errors for the selection effect**:
     - Neutral: Whether the selection effect requires that errors (over-optimism) are independent across potential actors.
     - Unilateralist: The selection effect is weakened when errors are correlated because then the first actor is not necessarily more optimistic than the average (if the correlation is high, the distribution is more uniform). However, the unilateralist's original argument did not rely on this; they focused on the aggregation problem. But note: the conformist's reply says that the selection effect does not require independent errors. We must clarify.
     - Conformist: The selection effect does not require independent errors; it only requires that the actor who acts is more optimistic than the average (which can happen even with correlated errors). Moreover, the correlation of errors (due to shared incentives) is in the direction of shared optimism, making the unilateralist's private judgment worse.

     However, note the common ground: we agree that the selection effect can occur without independent errors. So the dispute might be about the direction and strength of the correlation and its impact.

     Let me rephrase: 
     - Neutral: Whether correlated errors in the form of shared optimism among researchers make the selection effect stronger (worse) than in the independent case.
     - Unilateralist: Shared optimism might be present, but local context and diverse funding/training might reduce correlation, and even with correlation, the acting team might still have superior local knowledge that offsets the optimism.
     - Conformist: Correlated errors (due to shared training, funding, etc.) produce shared optimism, making the acting team's judgment even more likely to be overly optimistic than if errors were independent, thereby strengthening the selection effect.

  5. **On the comparison baseline for decision-making**:
     - Neutral: Whether the appropriate comparison for a unilateral release is between acting now and acting after a multilateral process, or between acting now and never acting.
     - Unilateralist: The comparison should include the option of never acting (or acting too late) because delay causes bounded but substantial harm (deaths from malaria), and a consensus rule might lead to inaction even when action is warranted.
     - Conformist: The comparison should be between acting now and acting after a multilateral process because the multilateral process might lead to a better decision (with fewer risks) and in a timely manner, and the option of never acting is not the alternative because the multilateral process might approve the intervention with modifications.

  We'll now write the document accordingly.
